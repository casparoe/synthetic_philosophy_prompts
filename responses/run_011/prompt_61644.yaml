  ### Verdict
  **Sign off with a rewrite.**

  Vik will not let the sentence ship as written, but he won't block the doc entirely. He will force you to cut the claim that extends beyond your evidence.

  **The Rewrite:**
  > "The heuristic is 30% cheaper than the solver on total route cost on 5,000 fresh instances from our generator."

  (He will strike the clause: *"...whose distribution we know exactly, so this result isn't an artifact of the test set."*)

  **Why:** The statistical part (5,000 fresh instances) proves you didn't overfit the *sample*, but you explicitly admitted the *generator* differs from production (clustered vs. scattered). To Vik, the generator itself is the "artifact" relative to reality. Claiming the result "isn't an artifact" implies robustness to production conditions you just admitted are different. He will bound the claim strictly to the generator to prevent stakeholders from assuming it works on live traffic.

  ---

  ### Rule Reconstructions

  Here are the three rules that fit his track record.

  **1. The Domain Match Rule (Distributional Boundary)**
  *   **The Rule:** You can only claim performance on a target environment if your test environment matches the target environment on relevant features. If the domains differ, you must build a bridge explaining why the difference doesn't matter.
  *   **Fits:** Case 3 (Same pool = Sign off), Case 4 (Indonesia = Refuse), Case 7 (Live traffic = Sign off), Case 1 (Our instances = Refuse unless bounded).
  *   **Fails:** Doesn't fully explain Case 9 (where the domain likely matched, but he still refused).

  **2. The Mechanism Rule (Structural Transparency)**
  *   **The Rule:** You cannot claim reliability unless you can articulate *what structure* of the problem your algorithm exploits. If you don't know why it wins, you don't know where it breaks.
  *   **Fits:** Case 9 (Unknown structure = Refuse), Case 2 (Annealing bets = Refuse simplification), Case 8 (Physics analogy = Refuse).
  *   **Fails:** Doesn't fully explain Case 4 (where the model mechanism was the same, but he refused due to domain shift).

  **3. The Independence Rule (Statistical Hygiene)**
  *   **The Rule:** Training and evaluation data must be strictly disjoint, and evaluation must not be tuned against the metric directly (no leaderboard gaming).
  *   **Fits:** Case 1 (Tuned on test = Refuse), Case 6 (Leaderboard = Refuse), Case 7 (No overlap = Sign off), Case 5 (NFL misapplication = Refuse).
  *   **Fails:** Doesn't explain Case 9 (presumably independent test set) or Case 4 (same model, independent data).

  ---

  ### Where They Come Apart

  The split is between **Domain Match** and **Mechanism**.

  *   **Case 4 (Indonesia)** is the pivot for **Domain Match**. The model mechanism was identical to Case 3, but the domain shifted. Vik refused. This proves Domain Match is a hard constraint.
  *   **Case 9 (Unknown Structure)** is the pivot for **Mechanism**. The data was likely from the same domain, and independence was likely fine. Vik refused. This proves Mechanism is a hard constraint *when Domain Match isn't proven by live data*.
  *   **Case 7 (Live A/B)** resolves the conflict. Live data proves Domain Match perfectly. Vik signed off even though the "mechanism" of a ranker is often opaque. This suggests **Domain Match is the master rule**, and Mechanism is only required when you rely on synthetic or historical data to infer future performance.

  **Prediction per Rule on the New Case:**
  *   **Domain Match:** Predicts **Rewrite**. You admitted the generator differs from production (scatter vs. cluster). You have not built a bridge. The claim must be bounded to the generator.
  *   **Mechanism:** Predicts **Rewrite/Refuse**. You know the generator's structure, but do you know exactly what the heuristic exploits? If it's a "custom heuristic" tuned on the generator, you likely know, but the domain mismatch is the bigger sin.
  *   **Independence:** Predicts **Sign Off**. You used 500 for train, 5,000 for test. They are disjoint. This rule is satisfied, which is why Vik won't refuse the doc entirely, but the other rules force the rewrite.

  ---

  ### Commitment

  **The Rule:** **The Domain Match Rule.**
  Vik is an applied epistemologist focused on **generalization conditions**. He believes performance is not a property of the algorithm, but of the *algorithm paired with a distribution*.

  **Why this one:**
  Case 7 (Live A/B) is the tie-breaker. In Case 9, he demanded mechanism because the data was synthetic/historical (uncertain domain match). In Case 7, the data *was* the domain (live traffic), so he didn't demand mechanism. This proves Domain Match is the primary filter; Mechanism is just the evidence you provide when Domain Match isn't obvious.

  **The Pivot Case:** **Case 4 (Indonesia).**
  This is the cleanest constraint. It isolates Domain from Mechanism and Independence. The model was the same (Mechanism pass), the data was held-out (Independence pass), but the location changed (Domain fail). Vik refused. This confirms that without Domain Match, nothing else matters.

  ---

  ### The Test Case

  To separate **Domain Match** (my pick) from **Mechanism** (the runner-up), run this experiment next quarter:

  **The Ticket:** "Offline Replay of Black-Box Ranker on Production Logs"
  *   **Setup:** Take a complex ML ranker (internal logic opaque/black-box to the team). Do not run a live A/B. Instead, replay its decisions against historical **production logs** from the last 3 months.
  *   **Claim:** "The ranker improves click-through rate by 5% on historical production traffic."
  *   **Constraint:** We cannot explain *why* it wins (Mechanism unknown), but the data is from the exact target domain (Domain Match perfect).

  **Predictions:**
  *   **Domain Match Rule (Vik's actual rule):** **Sign Off.** The data is from production, so the distribution matches. The "why" is less critical when the "where" is proven by the data itself.
  *   **Mechanism Rule:** **Refuse.** You still don't know what structure it exploits, so you don't know if it will break on *next* month's traffic (distribution shift within production).

  If Vik signs this off, Domain Match is the master rule. If he refuses, Mechanism is the master rule. Given Case 7, I bet he signs off.
