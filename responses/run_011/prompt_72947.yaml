      *   *Verdict:* The user's instinct is defensible and supported by sociological research (e.g., "poverty porn," the limits of empathy). However, it's not absolute. Tears *can* lead to action, but the structure needs to facilitate that transition. The 6-year data point (0 new volunteers) is strong evidence for the user's side *in this specific context*.

