  2.  **Deconstruct the Core Ethical & Practical Tensions:**
      *   **Awareness vs. Action:** The classic "slacktivism" or "compassion fatigue" debate. Does witnessing suffering motivate help or satisfy the urge to help?
      *   **Representation vs. Exploitation:** Verbatim theatre walks a fine line. Is it amplifying voices or mining trauma? Does scaling up (tour) worsen this?
      *   **Direct Aid vs. Cultural Shift:** Theatre aims for cultural shift (empathy), dinner aims for direct relational aid (community building).
      *   **Measurement:** How do you measure success? Ticket sales/donations vs. volunteer sign-ups vs. systemic change.

  3.  **Address Question 1 & 2: The Tears (Proof or Problem?):**
