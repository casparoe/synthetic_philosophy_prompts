answer: |-
  This is one of the most honest questions about the ethics of advocacy art I've ever encountered. You are wrestling with the tension between *witnessing* and *doing*, and between *representation* and *presence*.

  Here is a breakdown of your instincts, the risks of the tour, the potential of the dinner, and how you might actually settle the argument.

  ### 1. Are the tears the problem or the proof?
  Your instinct is defensible. In fact, it is supported by a specific sociological phenomenon often called **"moral licensing"** or **"vicarious atonement."**

  When people consume stories of suffering in a controlled aesthetic environment (a theatre), they often experience a catharsis that mimics the psychological relief of having *done* something. They cry, they feel the weight of the injustice, they put money in the bucket, and their nervous system regulates. The transaction is complete. The bucket isn't just a donation; it's a receipt that says, "I have paid my dues for this evening."

  Your co-director believes empathy is a pipeline to action. You are suggesting empathy can be a destination.
  **The evidence you already have:** The volunteer roster. Six years of zero growth is not an anecdote; it is data. If the plays were successfully converting empathy into labor, you would see a trickle. The fact that you don't suggests the current model is optimized for *feeling*, not *changing*.

  You are not being "precious about purity." You are noticing that the *form* of the intervention (spectatorship) dictates the *outcome* (passivity).

  ### 2. Is the tour "trafficking in misery"?
  Your worry about the tour is the logical extension of your worry about the local shows.
  *   **Distance dilutes responsibility:** When an audience in a city two states away cries for a homeless person they will never meet, the barrier to action is infinitely higher. The tears become purely aesthetic.
  *   **Professionalization:** When professional actors perform trauma, there is a risk of polishing the rough edges to make it "watchable." Verbatim theatre relies on the friction of the real. If the performance becomes too smooth, the subjects become characters, and their suffering becomes a plot point.
  *   **The Funder's Incentive:** The funder wants to "move ten times as many people." That is a metric of *reach*, not *impact*. They are buying scale. You are worried about depth. These are opposing goals.

  If you take the tour money without changing the mechanism, you are essentially scaling up the emotional discharge. You will create 10x more people who feel they have "done their part" by crying and donating $20.

  ### 3. Does the dinner dodge the objection?
  The long-table dinner is a fundamentally different intervention. It shifts the paradigm from **Spectatorship** to **Commensality** (eating together).

  *   **The Good:** It removes the fourth wall. There is no "audience" to absolve themselves. There are only participants. It forces proximity without a script. It allows the unhoused neighbors to be hosts, cooks, and conversationalists, not just subjects of a tragedy. It restores agency.
  *   **The Risk:** It can still slip into "poverty tourism." If the housed people come to "slum it" for an evening to feel virtuous, and the unhoused people are expected to perform gratitude or share trauma over mashed potatoes, it is the same sickness in nicer clothes.
  *   **The Fix:** The dinner cannot be *for* the housed to learn about the unhoused. It must be *with* the community. The unhoused residents should have veto power over the guest list. The goal shouldn't be "awareness"; it should be "solidarity" or "resource redistribution."

  ### 4. How do you find out who is right?
  You asked if there is evidence that could settle it. You actually have the evidence, but you might be measuring the wrong variable.

  **The "Empty Sheet" Test**
  The volunteer sheet isn't empty because people don't care; it's empty because the ask is too abstract. "Volunteer at the shelter" is a high-barrier request. It requires background checks, schedules, training.
  *   **Experiment A (The Pivot):** If you do the tour (or continue the show), change the "bucket" moment. Do not ask for money. Ask for a specific, low-barrier commitment *on the spot*. "Sign up to write one letter to a city councilman," or "Sign up for a one-shift orientation." If they won't sign that, the tears were definitely the destination.
  *   **Experiment B (The Subjects):** You haven't mentioned the most important stakeholders: **the people whose words you are speaking.** Have you asked them?
      *   Show the tour contract to the shelter residents whose transcripts are used.
      *   Ask them: *"Does this feel like help? Does this feel like exploitation? Would you rather we take this money and buy food, or take it on the road?"*
      *   If they feel the tour dignifies them, proceed. If they feel like exhibits, stop. Their intuition about their own dignity is more valid data than any sociological theory.

  **The "Follow-Up" Metric**
  For the next three shows, collect email addresses. Follow up in 30 days. Ask: *"Did you do anything after the show? If not, why?"*
  *   If they say "I meant to," the barrier is logistical.
  *   If they say "I felt like I helped by coming," your theory is confirmed.

  ### A Proposed Compromise
  You don't necessarily have to choose between "Art" and "Dinner," but you do need to choose between "Scale" and "Depth."

  Take the tour money. **But refuse the tour.**
  Negotiate with the funder. Tell them: *"We can move ten times as many people, but not by traveling. We can move them by deepening the local impact."*
  Use the tour budget to fund the dinner series for a year. Use the budget to pay the shelter residents an honorarium for their time and stories (stop relying on donations to pay for their trauma). Use the budget to hire a caseworker to be present at every show to immediately onboard anyone moved to act.

  **Summary**
  You are not being unfair to the plays. Art can change minds, but it rarely changes behavior without a scaffold for action. Your co-director is betting on the "trickle-down theory" of empathy. You are observing that the trickle has dried up.

  The dinner is riskier logistically but ethically sounder *if* it is co-designed with the unhoused participants. The tour is the riskiest option: it maximizes the chance of commodifying suffering for an audience that is geographically insulated from the consequences of that suffering.

  Trust the volunteer sheet. It has been telling you the truth for six years.
