      *   *Critique of Dinner:* Is it "poverty tourism" in reverse? Are unhoused people expected to perform their trauma over soup? Or is it genuine community building? It risks being a "one-off" event without structural support. But it aligns better with *relationship* than *representation*.
      *   *Comparison:* Theatre = Spectatorship (Passive). Dinner = Participation (Active). The dinner is likely ethically "cleaner" regarding exploitation, but logistically harder to sustain.

