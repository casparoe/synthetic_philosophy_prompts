answer: |-
  1. **Bottom line**
  Your quantitative trustee is making a category error common among numerate professionals: he is treating a descriptive ratio of variance as a causal limit on intervention. His position is statistically unsound. The fourth trustee is too dismissive; twin studies are informative but limited. The foundation should fund the water system and the preschool program. These are public goods that shift the population mean, whereas the screening scholarship merely selects existing advantages. The heritability statistic describes why children differ *now*, not whether their trajectory can be altered. High heritability is compatible with massive environmental improvement.

  2. **What that statistic is, and what it is not**
  The statistic is heritability ($h^2$), defined as the proportion of phenotypic variance ($V_P$) in a specific population attributable to genetic variance ($V_G$). Formally, $h^2 = V_G / V_P$. Since $V_P = V_G + V_E$ (environmental variance) plus interaction terms, heritability is a ratio of variances, not a measure of individual causation. It tells you why Child A differs from Child B in this specific context, not what caused Child A's score.

  Crucially, this value is population-specific and time-specific. It is not a physical constant like the speed of light. If you change the environmental variance ($V_E$), you change the heritability, even if the genes remain identical. For example, if you provide universal high-quality nutrition, $V_E$ decreases because everyone is equally well-fed. Consequently, the remaining differences between children are relatively more due to genetics, so $h^2$ rises. Conversely, if you introduce a chaotic environment where some children starve and others feast, $V_E$ explodes, and $h^2$ drops. Thus, the statistic can change even if nothing about the children's biology changes, solely because the distribution of environmental inputs has tightened or widened. It measures the spread of differences, not the height of the floor.

  3. **His three inferences, and hers**
  First, that rising heritability predicts fade-out: This fails. Heritability of IQ does increase with age, often because adults select environments matching their genetic propensities (gene-environment correlation). However, this does not mean early environmental interventions vanish. Fade-out in preschool programs usually occurs because the subsequent schooling is inadequate, not because genes "displace" early gains. The statistic describes the source of variation, not the stability of the mean.

  Second, that screening targets the durable component: This holds only under the assumption that current test scores perfectly reflect genetic potential. They do not. At age six, scores are heavily influenced by current environmental advantages. Screening selects children who have already benefited from favorable environments, conflating genetic potential with prior privilege. It targets existing status, not durability.

  Third, that the 30% environmental share bounds intervention: This is the most serious error. It confuses variance with means. You can raise the average cognitive score of the entire population (shifting the mean) by removing lead or improving nutrition, even if those interventions do not change the *ranking* of children (the variance). If you remove lead from everyone, you might improve everyone's score by five points without changing the gap between them. The 30% figure limits how much you can reduce inequality, not how much you can improve health.

  Finally, the fourth trustee's claim that shared households invalidate twin studies: This fails. While shared environment is hard to disentangle, adoption studies and comparisons of monozygotic versus dizygotic twins allow researchers to estimate these components. The studies are not worthless, but they estimate variance in the *current* range of environments, not the effects of novel interventions.

  4. **A suspicion I cannot state properly**
  Your suspicion is precisely correct. If your preschool program succeeds in standardizing the early environment—giving every child similar cognitive stimulation—you reduce environmental variance ($V_E$). Mathematically, if the denominator ($V_P$) shrinks because $V_E$ shrinks, the ratio of genetic variance ($h^2$) must rise.

  Consequently, a successful universal program would produce higher heritability estimates in the treated group. Your trustee, seeing this rise, might interpret it as proof that the environment doesn't matter. In reality, it would be proof that the environment matters so much that you successfully equalized it. To state this in the board meeting without sounding paradoxical: "If we succeed in making these children's starts equal, the remaining differences will look more genetic. We must not mistake the success of equalization for the failure of intervention."

  5. **What evidence would settle it**
  To adjudicate this, you need randomized controlled trials (RCTs) or natural experiments, not twin correlations. For the water proposal, look for longitudinal data comparing cognitive outcomes in children before and after lead abatement in similar districts, controlling for socioeconomic status. A significant rise in mean scores post-abatement would kill the trustee's claim that plumbing is irrelevant.

  For the preschool program, you need follow-up data from similar interventions tracking not just test scores but life outcomes (graduation, earnings) into adulthood. If the treatment group outperforms the control group on these metrics despite test score convergence, the "fade-out" argument fails.

  To test the screening proposal, you would need to randomize the scholarship. Offer it to the top decile, but also offer it to a random subset of the second decile with similar scores. If the top decile succeeds solely due to the scholarship, the treatment effect will be visible. If they succeed regardless because of home advantages, the scholarship is wasteful. Findings showing high correlation between family income and scholarship retention would strengthen the case against screening and for universal enrichment.

  6. **What I say on Thursday**
  "Colleagues, we are confusing a map of differences with a manual for improvement. The statistic our friend cites explains why children differ from one another in their current circumstances; it does not tell us whether we can raise the floor for all of them. We can improve the average health and ability of this population without changing the ranking between them. Funding the water system and the preschool shifts the baseline for everyone; the screening scholarship merely rewards those who have already cleared the hurdle. I move that we fund the water remediation and the preschool enrichment, and decline the screening proposal."
