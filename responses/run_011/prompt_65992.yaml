prompt: |-
  ok so I'm a senior and I'm doing an independent metaphysics thing because I want to apply to a summer philosophy program, and I've basically spent two weeks reading about the identity of indiscernibles and Max Black's 1952 example with the two exactly similar spheres in an otherwise empty universe, and honestly I feel like I'm just soaking up other people's arguments instead of knowing what I should even be *demanding* from an answer. So can you take on the role of a professional metaphysician who's spent their career on individuation and haecceity, and think really carefully about this? What I want isn't a summary of the debate, it's the spec. Before I read one more contender, tell me what any account of what makes a particular thing *this* particular thing (rather than just being the kind of thing it is) has to deliver in order to count as adequate — which cases it has to get right, which distinctions it can't collapse, which results or intuitions it has to stay consistent with — with the motivating case behind each requirement, and a mark on each one saying whether it's non-negotiable or whether it's really just what one camp wants. Please start with like four to six sentences of brainstorming about what the job of such a theory even is before you get to the list, because I think a lot of the disagreement is about what the job is. Don't pad it, and don't hedge everything into mush.

  Here's the rough list my philosophy club and I came up with, and I'd like you to tear it apart as much as use it, because I'm pretty sure some of these are smuggling in the answer they're supposed to be testing: (i) it has to explain how there can be *two* spheres at all when nothing qualitative tells them apart, i.e. numerical diversity without discernibility; (ii) it has to work even in a universe where space is purely relational with no absolute positions, otherwise it's just sneaking Newtonian space in; (iii) it has to explain why the identity of indiscernibles feels obviously true to people even if it's false, or else it's leaving something unexplained; (iv) it mustn't just posit a brute "thisness" and stop talking, because then it hasn't explained anything; (v) it has to scale up from spheres to people — like if I had an exactly similar identical twin, what makes me me; (vi) my friend insisted on this one and I don't know if it's real or if he's just assuming stuff: the theory has to let you pick the thing out by something you could in principle state or observe, or else it's not a theory about the world, just a label stuck on it. Tell me straight whether that last one is a genuine desideratum or a verificationist prejudice. Then I made up two variations of Black's setup and I want the spec to say what a theory owes me in each. First: suppose space in that universe isn't shaped like normal Euclidean space but is closed and twisted, kind of like the surface of a mobius strip, so that there's a symmetry of the whole space that maps each sphere's location onto the other one — now even "where it is" doesn't pick either sphere out. Does an adequate theory have to handle that, and does it commit you to anything about whether points of space have identities of their own? Second: a universe where at any moment there's exactly one sphere, it exists for an hour, goes out of existence, and an exactly similar one appears an hour later, forever, in a cycle. Does the theory have to say whether that's one sphere returning or a brand new one each time, and more importantly — does it have to deliver a determinate answer at all, or is "there's no fact of the matter" a legitimate output? I want the list to tell me which of those is a real requirement and which isn't, and why.

  Finally: flag any pair of requirements that you think can't be jointly satisfied, because if the list itself shows something's impossible I'd rather know that than get a scorecard. And tell me which single requirement does the most work in killing off candidates — I have a feeling it's either the brute-thisness one or the relational-space one. At the very end, and only briefly, score the main contenders against the list in a couple sentences each: bare particulars / substratum, bundle theory with and without primitive thisness, some structuralist or network-position view, and the simple "it's just where it is in spacetime" answer. Also — please no citations, no reading list, no bibliography, I can't get into the library database from home and I'll just end up chasing down stuff I get wrong. Paraphrase whatever you'd otherwise quote, don't put anything in quotation marks you can't stand behind.
