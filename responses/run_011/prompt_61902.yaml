answer: |-
  ### Ratings: Peirce (P) vs. James (J)
  *Scale: 0 (No room for "true") to 10 (Straightforwardly "true")*

  1.  **Dinosaur feathers (evidence destroyed)**
      *   **P: 1** — If no evidence can *ever* bear on it, inquiry cannot converge. For Peirce, a question that investigation cannot touch is meaningless, not true.
      *   **J: 6** — If the belief coheres with your broader biological worldview or "feels" right in the stream of experience, James allows it to function as true, even without strict empirical verification.
      *   **Gap: 5**

  2.  **Counterfeit watches (hidden empirical fact)**
      *   **P: 9** — A matter of fact waiting for discovery. Inquiry *could* find them; therefore, a convergent opinion is possible.
      *   **J: 8** — Verifiable in principle. If you act on the belief and find them, the idea "works."
      *   **Gap: 1**

  3.  **Goldbach's conjecture (Math)**
      *   **P: 9** — Mathematical inquiry converges on necessary truths. Proof is the ultimate form of Peircean convergence.
      *   **J: 7** — James respects math as a system of relations that "works," but he is often wary of truths detached from concrete human experience.
      *   **Gap: 2**

  4.  **Universe hospitable to moral effort (Religious/Moral)**
      *   **P: 2** — Scientific inquiry cannot converge on this. It is a hope, not a truth. Peirce might personally wish it, but his theory of truth excludes it.
      *   **J: 10** — This is the core of *The Will to Believe*. If the belief sustains moral effort and evidence is ambiguous, believing it *makes* it true for the believer.
      *   **Gap: 8**

  5.  **Medical treatment (Practical/Scientific)**
      *   **P: 9** — The scientific method applied to a specific case. The "right" treatment is what the community of doctors would agree upon.
      *   **J: 9** — The "cash value" is health. If the treatment works, the belief was true.
      *   **Gap: 0**

  6.  **Inquiry continues in 1 million years (Future of Community)**
      *   **P: 7** — Peirce *needs* this to be true for his theory to hold (immortality of the community), so he treats it as a regulative hope, bordering on truth.
      *   **J: 4** — Speculative. Unless believing this pays off for you *now*, James has little interest in validating it as truth.
      *   **Gap: 3**

  ***

  ### Ranking by Gap Size (Biggest First)

  1.  **Case 4** (Gap: 8) — Moral/Religious hope
  2.  **Case 1** (Gap: 5) — Undiscoverable past fact
  3.  **Case 6** (Gap: 3) — Future of inquiry
  4.  **Case 3** (Gap: 2) — Mathematics
  5.  **Case 2** (Gap: 1) — Hidden empirical fact
  6.  **Case 5** (Gap: 0) — Medical treatment

  ***

  ### Which One Goes on the Board First?

  **Case 4: "The universe is on the whole hospitable to sustained moral effort."**

  **Why:**
  This is the historical and philosophical flashpoint. It forces the seminar to confront the **normative stakes** of the definition of truth, not just the epistemic mechanics.
  *   **For James:** This case demonstrates that truth is *made*. If believing the universe supports your morality helps you live a better life, and science can't disprove it, the belief is true. It exposes his pluralism and his "right to believe."
  *   **For Peirce:** This case demonstrates that truth is *found*. No amount of moral satisfaction can force a convergence of scientific opinion on this claim. To call it "true" is to confuse hope with fact, which threatens the integrity of inquiry.

  Starting here prevents students from thinking the split is merely about "how long we wait for evidence" (Case 2) or "how we verify science" (Case 5). It shows that James is willing to expand truth into the realm of **value**, while Peirce is willing to restrict truth to protect the **method**.

  ***

  ### Agreements and Duds

  **Where They Agree (Despite Surface Differences):**
  *   **Case 5 (Medical Treatment):** This is the strongest agreement. Both pragmatists love concrete, scientific problem-solving where "what works" and "what inquiry converges on" are effectively the same thing.
  *   **Case 2 (Counterfeit Watches):** Both agree this is a truth-apt claim because it is empirically decidable. Peirce focuses on the *potential* convergence; James focuses on the *actual* verification. The outcome is the same.

  **The Duds:**
  *   **Case 5 is a Dud for Conflict:** Do not use this to open the seminar. If you start here, students will conclude Peirce and James are saying the same thing. The fight isn't about wording here; it's that there *is* no fight. They shake hands on scientific practice.
  *   **Case 3 (Math) is a Potential Dud:** While I rated a small gap, in practice, both treat math as valid. Arguing over whether mathematical truth is "convergence" or "utility" often devolves into semantic quibbling that distracts from the core metaphysical split found in Case 4.
