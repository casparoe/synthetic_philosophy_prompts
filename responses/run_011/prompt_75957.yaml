  - `why`: 1–3 sentences; for anything not `correct`, name the specific conflation, misattribution, or missing step
  - `severity`: `none` / `minor` / `moderate` / `serious` — i.e. whether it's a slip or something that actually breaks the argument
  - `comment_to_student`: one sentence I could paste straight into the margin

  Then, after the table, a short JSON object with this schema: `{"score": <int 0-100>, "band": "<A|B|C|D|F>", "strongest_part": "<one line>", "most_serious_error": "<one line>", "errors_a_hasty_grader_would_miss": ["<one line each>"], "comparison_question_answered": <true|false>, "internal_consistency_issue": "<one line, or null>", "one_thing_to_reread": "<describe the idea or passage, no page numbers>"}`.
