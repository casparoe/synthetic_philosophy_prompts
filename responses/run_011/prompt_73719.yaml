answer: |-
  **ORDINAL INSTRUMENTS**
  **USER GUIDE: REVEALER 7 (MARK IV)**
  **DOC-ID: OI-77-OP**

  **1. WHAT IS IN THE BOX**
  *   One (1) Revealer 7 Unit.
  *   One (1) Shielded Power Cable.
  *   One (1) Quick-Start Guide.

  *Note: The Revealer 7 does not possess a microphone, haptic sensor, or questionnaire port. This is not a defect. The absence of input channels for verbal reportage ensures data purity. Do not attempt to drill an input jack into the chassis. This will void the warranty and compromise the unit's epistemological integrity.*

  **2. FIRST CALIBRATION**
  Place the subject within the Observation Field. Do not present a consent form. Under the Operationalist Standard, the subject's failure to exit the Observation Field constitutes an elected preference for remaining within it. Continued presence is recorded as affirmative consent. If the subject attempts to leave, record this as a preference for the exterior environment. Do not intervene. Intervention alters the choice set and invalidates the reading.

  **3. HOW TO READ THE DISPLAY**
  The LCD screen displays a single ordinal integer (e.g., 1st, 2nd, 3rd). This indicates the rank of the chosen option relative to the available set.
  *   **WARNING:** The Revealer 7 measures order, not magnitude. Do not add readings. Do not average readings. Do not place two units side by side to compare the welfare of Subject A against Subject B. The Revealer 7 cannot measure if Subject A is happier than Subject B, only that Subject A prefers X to Y. Any attempt to make interpersonal comparisons will permanently lock the processor. The warranty is void if a comparison is attempted.

  **4. CONSISTENCY ROUTINE**
  The unit automatically logs choices to test for transitivity (if A > B and B > C, then A > C). If the subject selects A, then B, then C, then returns to A, the Consistency Light will flash amber. This indicates an intransitive cycle.
  *   **Action:** Initiate Arbitrage Protocol. The technician is authorised to facilitate exchanges between the subject and the market until the subject's resources are exhausted or consistency is restored. This is a feature, not a bug. It demonstrates the cost of irrationality.

  **5. TROUBLESHOOTING**

  | Symptom | Probable Cause | Corrective Action |
  | :--- | :--- | :--- |
  | Subject states "I want Y" but chooses X. | Semantic noise. | Ignore verbal statement. On this instrument, the statement is not false; it is meaningless. Only the choice is data. |
  | Subject accepts default option. | Strong preference for status quo. | Record default as optimal choice. Do not adjust for framing effects. |
  | Subject claims they did not choose. | Confabulation / Noise. | File report under "Post-Hoc Rationalisation." The physical movement of goods constitutes the choice. The subject's narrative is irrelevant. |
  | Subject expresses joy or misery. | Unobservable mental state. | Disregard. Emotions are not testable. |

  **6. KNOWN LIMITATIONS**
  The Revealer 7 classifies subjects whose aspirations have contracted to fit their constraints as "Excellently Calibrated." If a subject stops desiring what they cannot have, the unit registers a high welfare reading because choice friction is minimised. This is the highest available reading. Do not attempt to recalibrate for "resignation." The instrument cannot distinguish between contentment and adaptation. If the choice is stable, the welfare is maximised.

  **7. CARE AND MAINTENANCE**
  Technicians frequently ask why the subject's own account of their welfare is never consulted. The answer is falsifiability. A science of behaviour must rest on observations that can be proven wrong. Feelings cannot be disproven; choices can.
  *   **What counts against a reading?** Only an observable reversal of choice under identical constraints. If the subject chooses X over Y today, and Y over X tomorrow without a change in price or availability, the instrument registers a fault. If the subject claims to be miserable but continues to choose the same bundle, the instrument is functioning correctly. To suggest the instrument is wrong because the subject is "unhappy" is to introduce untestable metaphysics. We measure what we can see.

  **8. LIMITED WARRANTY**
  Ordinal Instruments warrants the Revealer 7 against defects in logic for a period of five years. This warranty covers inconsistencies in the algorithm. It does not cover dissatisfaction arising from the definition of welfare.
  *   **Exclusions:** This warranty is void if the unit is used to measure "happiness," "utility," or "well-being" as distinct from "choice." The Revealer 7 does not measure how good a life is. It measures what was done. If you require a measure of how good a life is, please consult a poet. For science, use the Revealer 7.

  **ORDINAL INSTRUMENTS**
  *We Reveal What You Do.*
