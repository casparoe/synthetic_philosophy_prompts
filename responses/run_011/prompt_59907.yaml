  As for the counterfactual, the asymmetry between my account and Hylas's is where the real work happens. When I say the table exists unperceived by me because I would see it if I returned, the truthmaker for that conditional is the consistent will of God, who sustains the order of nature. When Hylas uses his description, he intends it to pick out something independent of God's mind as well as ours. That's the divergence. You ask if 'God sustains it' is just moving the problem up a floor; I say it's recognizing there is only one floor. Existence is perception. So my counterfactual is grounded in actual perception (divine), whereas Hylas's description is grounded in a contradiction (perceived existence that isn't perceived). I'm not positing a mysterious substratum; I'm positing a continuous agent. Hylas is positing nothing, and calling it something.
