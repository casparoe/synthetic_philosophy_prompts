      *   *Rule A (Forward-Looking/Remedial):* Based on (iii) and (vi). The Committee's power is limited to protecting *future* conditions of exchange. If the threat is gone (person left, account deleted) or if the sanction implies a final judgment on character (permanent exclusion), we hesitate. We fix the channel, we don't punish the soul.
      *   *Rule B (Channel-Risk/Context):* Based on (iv) and (v). Liability depends on the expectation of privacy/publicness of the channel. Public channel = you own the amplification (iv). Private channel = you don't own the leak (v). Truth is not a defense if privacy is violated (ii).
