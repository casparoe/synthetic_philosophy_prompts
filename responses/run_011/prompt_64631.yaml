  2.  **Analyze the Precedents (The Record):**
      *   *(i) Faculty False Claim:* False claim, measurable harm (enrollment depressed). Sanction: 60-day suspension, removal of post. *Principle:* Truth matters, harm matters, temporary exclusion ok.
      *   *(ii) Student Screenshot:* Authentic screenshot, private message made public. Sanction: Suspension + restorative. Dissent: Accuracy is not a defense. *Principle:* Context/privacy matters more than truth. Harm to exchange conditions.
      *   *(iii) Anonymous Disruption:* Urged disruption, didn't happen, account deleted, respondent gone. Decision: Declined to act. *Principle:* Nothing left to protect (forward-looking/remedial limit).
      *   *(iv) Staff Bad Remark:* Public thread (12 readers), amplified by journalist, hostile messages. Sanction: Formal finding + 1-year suspension. Dissent: Amplification not foreseeable. *Principle:* Channel risk (you take your chances on public channels). Harm counts even if unforeseen amplification.
      *   *(v) Grad Student Leak:* Harsh remark in closed chat, leaked, pile-on. Decision: Declined to sanction student. *Principle:* Leak created harm, not the remark. Context matters (private vs. public).
      *   *(vi) Harassment Campaign:* Sustained harassment via alumni forum. Sanction: 5-year exclusion (not permanent). *Principle:* Incompetent to make final judgments on people (rehabilitative potential).
      *   *(Proc 1) Procedural Fairness:* Set aside finding because respondent wasn't shown complaint. *Principle:* Due process is mandatory.
