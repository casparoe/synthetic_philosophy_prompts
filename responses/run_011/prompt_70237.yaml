answer: |-
  Dear Colleague,

  I have reviewed the transcript of the ethics conference regarding Eleanor with care, and what follows is my adjudication of the exchange between Dr. Okonjo and Professor Lindqvist. Regarding the first move, Okonjo's claim that the clause is void because it suspends autonomy partly succeeds because it correctly identifies the tension between past and present agency, but it fails to acknowledge that the very point of a precedent directive is to restrict future choices when competence is lost, meaning the suspension of current autonomy is the feature rather than the bug. Lindqvist's reply in the second move that authority lies with the competent self succeeds in establishing the standard philosophical defense of advance directives, yet it leaves standing Okonjo's worry about whether the past self can dictate how evidence is interpreted, which is a distinct epistemic problem from the authority problem. In the third move, Okonjo's distinction regarding Ulysses and evidence partly succeeds as a logical distinction because Ulysses did not deny the informational value of his pleas, but it fails because a competent person can arguably define what counts as evidence of their values in a future state they anticipate, effectively stipulating that certain behaviors are pathological. Lindqvist's counter in the fourth move that the request is an evidential filter and concerns critical interests succeeds decisively because it reframes the debate from current happiness to the specific losses Eleanor sought to avoid, directly addressing Okonjo's evidential concern by clarifying that cheerfulness is irrelevant to the loss of conversation and agency.

  Moving to the fifth move, Okonjo's claim that the clause makes the refusal immune to any state fails because advance directives are designed to hold even against contrary current wishes, though it succeeds in highlighting the alienation between the two selves and the moral discomfort of ignoring a protesting patient. Lindqvist's comparison to wills and promises in the sixth move partly succeeds in showing continuity of obligation because it demonstrates that we routinely honor past commitments despite changed feelings, but it fails to fully address the disanalogy regarding bodily integrity and immediate welfare, which carries a different moral weight than property disposal. In the seventh move, Okonjo's distinction between property and bodily welfare succeeds in raising the moral stakes regarding current suffering because it forces us to weigh the interests of the living being against the dead author, but it fails to override the prior commitment to critical interests if those interests are indeed gone and the prior self specified this exact scenario. Lindqvist's warning about eroding precedent autonomy in the eighth move succeeds as a practical policy argument because it highlights the systemic risk of allowing current mood to invalidate prior instructions, but it does not resolve the specific ethical tension in this case regarding the validity of the anti-revocation clause.

  The crux of the entire dispute is the fourth move, because it is the point where the argument shifts from whether the directive can bind the patient to what the directive actually binds her against, and if Lindqvist is correct that Eleanor refused a life without conversation rather than a life without happiness, then Okonjo's appeals to her current cheerfulness become morally irrelevant. Despite the strength of this exchange, both parties missed a crucial distinction between the authority of the directive and the interpretation of its trigger conditions, specifically whether Eleanor's current state of sometimes recognizing her daughter and saying her name meets the threshold of no reasonable prospect of conversing again as myself. They also missed how the daughter's exclusion from surrogate status changes the reading of the document, because without a proxy who knew the patient's historical identity to interpret what conversing as myself meant, the committee is left to guess at the clinical satisfaction of the trigger, which complicates the enforcement of the anti-revocation clause.

  Overall, Professor Lindqvist is more right on the philosophical principles regarding precedent autonomy and the coherence of the advance directive, as Dr. Okonjo's reliance on current experiential welfare undermines the specific critical interests Eleanor sought to protect. However, I would advise the committee to treat the pneumonia with antibiotics, not because Okonjo's ethical framework is superior, but because the clinical trigger for the directive has not been clearly met given the patient's occasional recognition of her daughter, and in cases of ambiguity regarding the activation of a life-ending directive, the presumption should remain in favor of life. The anti-revocation clause is philosophically defensible per Lindqvist, but it only matters if the condition of irreversible dementia with no prospect of conversation is satisfied, and on the available evidence, that condition is currently debatable.

  Sincerely,

  The Referee
