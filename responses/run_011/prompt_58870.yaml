prompt: |-
  I am running a 110-minute session for eighteen students in a final-year undergraduate seminar on historical explanation. They have had no prior coursework in probability or in judgment and decision-making, and they will have read nothing for this class. I want a self-contained simulation that makes them feel, rather than be told, why the outside view is so hard to adopt when one is holding a rich and vivid particular case in one's hands, and why it is nonetheless what ought to govern the number one writes down. Please design the activity in full, to the specification below.

  The setting should be invented, so that no student can substitute remembered facts: a fictional basin containing some thirty polities over roughly four centuries, each with a recorded lifespan, plus dossiers on a handful of them. You should generate the materials yourself rather than sketch them in outline. I want the following built into the data.

  1. Real but weak signal. The dossiers should contain features that genuinely correlate with durability in the table of lifespans you supply, but modestly: a forecaster who reads a dossier well should beat the bare base rate by a few years, against a spread of recorded lifespans running from a decade or two to well over a century. Students must be able to discover in the debrief that the case detail felt enormously informative and was only mildly so.
  2. Reference-class ambiguity. At least two defensible reference classes for the target polity — say, all polities of comparable territorial scale, versus all polities sharing its constitutional arrangement — whose base rates differ by decades. Choosing the class must itself be a judgment the teams make under time pressure.
  3. One exceptionalism hook. At least one dossier should be so compelling — a reforming ruler, a settled succession, an army that has never been beaten — that a reasonable reader is tempted to remove the polity from every class at all.
  4. Right-censoring. A few polities should still be standing when the record closes, so that a naive average of recorded lifespans is systematically biased, and a team that averages the numbers on the sheet without thinking inherits that bias. Do not flag this anywhere in the student-facing materials; I want it to emerge, if it emerges, from the sharpest team or from the debrief.

  Mechanics: teams of three. In round one each team forecasts the remaining lifespan of a single polity from its dossier alone, recording a point estimate plus a 50 percent and a 90 percent interval. Between rounds teams may spend a limited allotment of archive tokens to purchase the recorded lifespans of comparable cases, choosing for themselves which comparisons to buy. In round two they revise. The token scarcity is the point: the outside view should cost something, and teams should have to commit, before they know how much they need it, to how much they will pay. Give me a scoring scheme that runs on paper points, penalizes both error and intervals that are too narrow, and is simple enough that I can compute it in front of the class in five minutes. Include the exact handout text for each dossier (compressed to a page is fine), the token prices, a minute-by-minute timeline, and what I say — and what I pointedly refrain from saying — while it runs. The vocabulary of the domain should not be spoken aloud until after round two.

  Then the debrief. It should map specific moments in the play onto the ideas at work: the drift between the round one and round two numbers as a measure of how far the inside view actually moved them; the interval scores as a measure of how confident they were entitled to be; the token purchases as reference-class selection; the exceptionalism hook and who fell for it; and the censoring problem, which I want explained properly, including what those teams should have done with the unfinished records. The names may be attached only here — the planning fallacy, reference class forecasting, regression toward the mean.

  Finally, two frank notes. First: what will predictably go wrong the first time this is run — teams finishing at wildly different speeds, one team spotting the censoring issue and broadcasting it, students gaming the intervals, the hook dossier provoking an argument that eats the clock — and what I should do about each. Second: which feature of reasoning from base rates this simulation cannot reproduce, and which I will therefore have to supply by argument afterwards. I suspect it has to do with the fact that my table of lifespans is settled and uncontested, whereas in real forecasting the reference class is itself a thing people fight over; tell me whether that is the largest gap or whether there is a worse one I have not thought of.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar activity:

  1.  **Analyze the Request:**

      *   **Target Audience:** 18 final-year undergraduates, no prior prob/stats/JDM coursework, no pre-reading.
      *   **Duration:** 110 minutes.
      *   **Goal:** Experiential understanding of the "Outside View" vs. "Inside View" (Kahneman/Lovallo), specifically why the Outside View is hard to adopt but necessary, and the difficulty of reference class selection.
      *   **Setting:** Fictional basin, ~30 polities, ~4 centuries, recorded lifespans + dossiers.
      *   **Key Data Features:**
          1.  *Weak Signal:* Dossier details correlate with lifespan but modestly (feel informative, actually mild).
          2.  *Reference Class Ambiguity:* Two defensible classes with different base rates (e.g., size vs. constitution).
          3.  *Exceptionalism Hook:* One dossier so compelling students want to ignore base rates entirely.
          4.  *Right-Censoring:* Some polities still standing at record close (naive average is biased).
      *   **Mechanics:** Teams of 3 (6 teams total). Round 1 (Dossier only) -> Round 2 (Buy data with tokens) -> Scoring.
      *   **Scoring:** Paper points, penalize error and narrow intervals, computable in 5 mins.
      *   **Deliverables:** Full handout text (dossiers, data table), token prices, timeline, instructor script (say/don't say), debrief plan, troubleshooting notes, limitations analysis.
      *   **Constraint:** Do not use domain vocabulary (base rate, outside view, etc.) until debrief.

  2.  **Design the Fictional World (The "Ostral Basin"):**

      *   *Name:* The Ostral Basin.
      *   *Polities:* 30 total.
      *   *Timeframe:* 400 years (Year 1 to Year 400). Record closes Year 400.
      *   *Lifespan Data:* Need to generate 30 entries.
          *   Range: ~15 years to ~150 years.
          *   Censoring: 5 polities still active at Year 400.
          *   Signal: Need variables in dossiers that correlate. Let's use "Succession Mechanism" (Hereditary vs. Elective vs. Meritocratic) and "Geography" (Riverine vs. Highland vs. Coastal).
          *   Reference Classes:
              *   Class A: Constitutional Type (e.g., "Council-led" vs. "Autocratic").
              *   Class B: Geographic/Strategic (e.g., "Riverine" vs. "Highland").
              *   *Constraint Check:* Need base rates to differ by decades. Let's make Council-led last longer on average, but Riverine more stable? No, let's make *Constitutional* the stronger predictor but *Geography* the more obvious one, or vice versa. Let's go with:
                  *   Class 1: "Succession Type" (Stable vs. Contested). Stable averages 80 yrs, Contested averages 40 yrs.
                  *   Class 2: "Region" (North vs. South). North averages 55 yrs, South averages 65 yrs.
                  *   *Wait, need ambiguity.* Let's make the Target Polity fit *both* classes but the classes give different numbers.
                  *   Target Polity: *Vesuvia*.
                  *   Vesuvia Traits: "Elective Council" (Class 1 avg: 90 yrs) AND "Borderland" (Class 2 avg: 50 yrs).
      *   *The Hook:* One polity, *Aethelgard*, has a "Perfect General" and "Iron Succession." It feels immortal. In reality, it's average.
      *   *Censoring:* 5 polities listed as "Current: 120+" (started Year 280, still going). Naive average ignores the "+" part.

  3.  **Drafting the Data (Mental or Scratchpad):**

      *   Need a table of 30 polities.
      *   Columns: Name, Start Year, End Year (or "Active"), Type, Region.
      *   Need to ensure the correlation exists but is noisy.
      *   *Target for Forecast:* Polity #31 (Vesuvia). Started Year 350. Current Year 400. Age so far: 50 years. Question: *How much longer will it last?* (Total lifespan = 50 + Remaining).
      *   *Wait, simpler:* Ask for *Total Expected Lifespan*. Then subtract current age to get remaining. Or just ask for Remaining. Let's ask for **Total Lifespan** to make base rate comparison easier, then they can do the math if they want. Actually, "Remaining Years" is more intuitive for "forecasting." Let's stick to **Remaining Years**.
      *   *Correction:* If I ask for Remaining Years, they need to know current age. Dossier says "Founded Year 350. Current Year 400." So they know it's 50 years old.
      *   *Base Rates:*
          *   All Polities (Naive): Avg lifespan ~60 years. (So remaining ~10 for a 50yo).
          *   Censored Naive: If they ignore censored, avg might look like 55.
          *   Class 1 (Council): Avg 80 years total. (Remaining 30).
          *   Class 2 (Border): Avg 50 years total. (Remaining 0 - i.e., likely to die soon).
          *   *Conflict:* Council says live longer. Border says die soon.
      *   *Signal:* Dossier mentions "Council" and "Border."
      *   *Hook:* Dossier mentions "General Kael" (undefeated).

  4.  **Developing the Mechanics:**

      *   *Teams:* 6 teams of 3.
      *   *Tokens:* Each team gets 3 tokens.
      *   *Market:* Data cards sold by instructor.
          *   "Full List of Lifespans" (Cost: 2 tokens).
          *   "Filtered List by Type" (Cost: 2 tokens).
          *   "Filtered List by Region" (Cost: 2 tokens).
          *   "Single Case History" (Cost: 1 token).
          *   *Scarcity:* They can't buy everything. They must choose which reference class to investigate.
      *   *Scoring:*
          *   Point Estimate Error: $|Forecast - Actual|$.
          *   Interval Score: Width of interval + Penalty if Actual falls outside.
          *   Formula: Score = 100 - (Error) - (Interval Width) - (50 if Outside).
          *   *Simpler:* Brier-style or Logarithmic? No, needs to be calculated in 5 mins on paper.
          *   *Proposed:* 100 points start.
              *   Subtract absolute error (1 pt per year).
              *   Subtract interval width (1 pt per year).
              *   Subtract 50 pts if true value is outside 90% interval.
          *   *Wait, Actual Value:* I need to decide the "True" remaining lifespan of Vesuvia *now*. Since this is a simulation, I define the truth. Let's say Vesuvia will last 20 more years (Total 70).
          *   *Why 70?* It fits the "Council" (90) better than "Border" (50), but the "Border" drag pulls it down. It validates the "Weak Signal" (Dossier helped slightly over global average, but not as much as they think).

  5.  **Refining the "Right-Censoring" Trap:**

      *   In the "Full List" handout, 5 entries say "End Year: --- (Active)".
      *   If they average the "End Year - Start Year" for completed ones only, they get ~55 years.
      *   If they include the active ones as *completed* (mistake), they get higher.
      *   If they exclude active ones (standard naive mistake), they underestimate the potential of long-lived states.
      *   *Actually, the bias direction:* If you exclude long-lived survivors, you bias the average *downward* (survivorship bias is usually the opposite, but here "right censoring" means you don't know the end).
      *   *Standard Bias:* If you treat "Active" as "Ended Now", you underestimate lifespan. If you exclude "Active" entirely, you remove the longest-lived cases from the sample, also underestimating.
      *   *Goal:* I want them to see that the "Average" on the sheet is wrong.
      *   *Fix:* In the data table, list "Duration" column. For active ones, write "120+ (Active)".
      *   *Trap:* Students average the numbers. They ignore the "+". They get a number.
      *   *Debrief:* Explain that "120+" is a lower bound, not a value.

  6.  **Writing the Materials:**

      *   *Dossier:* Needs to be vivid. "The Republic of Vesuvia."
      *   *Data Table:* 30 rows. Needs to look historical.
      *   *Tokens:* Physical chips or paper slips.
      *   *Script:* Strict instructions on what not to say.

  7.  **Timeline (110 mins):**

      *   0-10: Intro & Setup (No vocab).
      *   10-25: Round 1 (Dossier only).
      *   25-35: Market Phase (Buying data).
      *   35-50: Round 2 (Revision).
      *   50-60: Scoring & Reveal.
      *   60-110: Debrief (The heavy lifting).

  8.  **Addressing the "Frank Notes":**

      *   *What goes wrong:* One team finishes Round 1 in 2 mins, another takes 20. One team shouts "There's a trick with the active ones!"
      *   *Mitigation:* Enforced pacing, collection of sheets before market opens.
      *   *Limitations:* The data is "God's truth." In reality, the data itself is contested. Also, the "True" value is fixed by me, whereas in reality, it's probabilistic.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Scoring:* Let's make it very robust.
          *   Score = 100 - |Guess - Actual| - (90% Width / 2).
          *   Bonus: +20 if Actual inside 90%.
          *   This encourages calibration.
      *   *The "Truth":* Vesuvia lasts 25 more years. (Total 75).
      *   *Data Generation:* I need to create the 30 polity table now to ensure the stats hold up.
          *   Total Polities: 30.
          *   Active (Censored): 5.
          *   Target: Vesuvia (Polity 31).
          *   Correlation: "Constitutional Stability" (High/Med/Low). High avg 80, Low avg 40. Vesuvia is "High".
          *   Correlation 2: "Geography" (Coast/Inner). Coast avg 50, Inner avg 70. Vesuvia is "Coast".
          *   Conflict: Constitution says 80, Geography says 50. Average ~65. Current age 50. Remaining 15.
          *   Let's set True Remaining = 20 years.
          *   This makes the "Inside View" (Hook) tempting (predict 100+ years) and the "Outside View" (Base Rate) modest (predict 15-25 years).

  10. **Final Review against Constraints:**
      *   110 mins? Yes.
      *   18 students (6 teams)? Yes.
      *   No prior knowledge assumed? Yes.
      *   Self-contained? Yes.
      *   Vocab withheld? Yes.
      *  Right-censoring hidden? Yes.
      *  Scoring simple? Yes.

  11. **Constructing the Output:** (Proceeding to generate the full text based on these decisions). *Self-Correction on Scoring:* Calculating absolute error for 6 teams in 5 mins is easy. Calculating interval widths is easy. I will provide a scoring sheet template for the instructor.

      *   *Refining the "Hook":* The dossier needs to mention a specific charismatic leader. "Archon Valerius."
      *   *Refining the "Censoring":* The table must clearly show "Current" for some, but not explain the statistical implication.
      *   *Refining the "Tokens":* 3 tokens per team. Data packs cost 2 tokens. Individual case costs 1. They can buy *one* reference class list OR two individual cases. This forces the Reference Class choice.

      *   *Wait, one detail:* "Right-censoring... a naive average... is systematically biased."
      *   If I have 5 polities that are 100+ years old and still active, and I exclude them, the average drops. If I include them as 100, it's accurate *so far* but underestimates final.
      *   Let's make sure the "Active" ones are the *longest* lived. This makes the bias significant.
      *   Okay, ready to write.

      *(Self-Correction during drafting)*: Ensure the "Data Packs" are distinct. Pack A groups by Constitution. Pack B groups by Geography. They can't buy both. This forces the Reference Class Ambiguity.

      *(Scoring Check)*: To compute in 5 mins:
      1. Write True Value on board (20).
      2. Teams write Guess, Width, Inside? (Y/N) on board.
      3. Instructor does math: 100 - |Guess-20| - (Width/2) + (20 if Inside).
      4. Done.

      *(Debrief)*: Need to explicitly map the "Token Purchase" to "Reference Class Selection."

      *(Limitations)*: The biggest gap is indeed that the "True Value" is fixed here. In reality, the future is not determined. Also, the data is clean. Real data is messy. I will highlight the "Contested Reference Class" issue as requested.

      *(Vocab)*: Do not use "Base Rate," "Inside/Outside View," "Censoring," "Regression" until Debrief. Use "Archive Data," "Case Details," "Active Records," "Pull to Average."

      Let's assemble.
answer: |-
  # Seminar Activity: The Ostral Basin Forecast

  ## 1. Instructor Preparation & Materials

  **Room Setup:**
  *   6 tables (one per team of 3 students).
  *   Projector/Whiteboard for instructions and scoring.
  *   **Tokens:** 18 poker chips or paper slips (3 per team).
  *   **Handouts:**
      *   *Packet A:* The Vesuvia Dossier (1 per team).
      *   *Packet B:* The Archive Catalog (1 per team).
      *   *Packet C:* Round 1 Forecast Sheet (1 per team).
      *   *Packet D:* Round 2 Forecast Sheet (1 per team).
      *   *Data Packs (Instructor Only):* 3 distinct sets of data to sell (see Section 3).

  **The "Truth" (Instructor Eyes Only):**
  *   **Target:** The Republic of Vesuvia.
  *   **Current Age:** 50 years (Founded Year 350, Current Year 400).
  *   **True Total Lifespan:** 70 years.
  *   **True Remaining Lifespan:** 20 years.
  *   **The Trap:** The Archive contains 30 historical polities. 5 are marked "Active." These 5 are the longest-lived (110–140 years so far). Excluding them biases the average downward. Treating their current age as their final age biases it downward.
  *   **The Signal:** "Constitutional Type" is a stronger predictor than "Geography," but both are noisy. Vesuvia is *Council-Led* (Avg 80 yrs) but *Coastal* (Avg 55 yrs). The truth (70) splits the difference.
  *   **The Hook:** The Dossier highlights "Archon Valerius," a popular leader with no heirs. Students will want to predict longevity based on his popularity.

  ---

  ## 2. Student Handouts

  ### Handout 1: The Vesuvia Dossier (Round 1)
  **CONFIDENTIAL: OFFICE OF STRATEGIC ESTIMATION**
  **SUBJECT:** POLITY #31 — THE REPUBLIC OF VESUVIA
  **CURRENT DATE:** Year 400, Ostral Era

  **Overview:**
  Vesuvia is a mid-sized coastal republic located in the Southern Basin. Founded in Year 350 following the collapse of the Imperial Hegemony, it has survived the initial turbulent period of basin consolidation.

  **Leadership & Succession:**
  The state is currently led by **Archon Valerius** (Term: 15 years). Valerius is widely regarded as a political genius who stabilized the currency and negotiated peace with the Highlanders. His approval ratings are historically high (85%). However, Valerius is 60 years old and has no designated heir. The constitution requires an election upon his death or incapacity. Historically, interregnum periods in Vesuvia have been short, but the lack of a clear successor is noted by observers as a potential risk.

  **Military & Geography:**
  Vesuvia maintains a professional standing navy, unmatched in the Southern Basin. It has not lost a naval engagement in 30 years. Its land borders are fortified by the River Kess, providing a natural defensive barrier against the Northern Confederations. However, reliance on trade makes it vulnerable to blockades.

  **Economy:**
  Agrarian base with significant maritime trade revenue. Reserves are sufficient for 5 years of conflict.

  **TASK:**
  Based *only* on the qualitative details above, estimate the **remaining lifespan** of the Republic of Vesuvia.
  *   **Point Estimate:** (Single number of years)
  *   **50% Interval:** (You believe there is a 50% chance the truth lies within this range)
  *   **90% Interval:** (You believe there is a 90% chance the truth lies within this range)

  ---

  ### Handout 2: The Archive Catalog (Available for Purchase)
  **THE BASIN ARCHIVES: SUMMARY STATISTICS**
  *Access Level: Restricted. Tokens Required.*

  You may purchase data packets to refine your estimate. You have **3 Tokens**. Prices are non-negotiable.

  **OPTION A: The Constitutional Ledger (Cost: 2 Tokens)**
  *   Contains the lifespans of all 30 historical polities, grouped by **Succession Mechanism** (Hereditary, Elective Council, Autocratic).
  *   *Note:* Does not include geographic data.

  **OPTION B: The Geographic Survey (Cost: 2 Tokens)**
  *   Contains the lifespans of all 30 historical polities, grouped by **Terrain Type** (Coastal, Riverine, Highland).
  *   *Note:* Does not include constitutional data.

  **OPTION C: Individual Case Files (Cost: 1 Token each)**
  *   Purchase the full dossier and lifespan record of a single specific historical polity of your choice (e.g., "Show me the history of Polity #12").
  *   *Limit:* Max 2 files per team.

  **OPTION D: The Complete Raw Table (Cost: 3 Tokens)**
  *   A raw list of all 30 polities with Start Year, End Year, and Type. No grouping, no analysis.
  *   *Note:* Costs your entire endowment.

  **ARCHIVE NOTE:**
  *Records close at Year 400. Polities marked "Active" have not yet fallen.*

  ---

  ### Handout 3: Forecast Sheets (Round 1 & 2)
  *(Identical format for both rounds)*

  **TEAM NUMBER:** ______
  **ROUND:** [1 / 2]

  **1. Point Estimate (Remaining Years):** ______

  **2. Confidence Intervals:**
  *   **50% Interval:** [ ______ to ______ ] (Width: ___)
  *   **90% Interval:** [ ______ to ______ ] (Width: ___)

  **3. Reasoning (One Sentence):**
  _________________________________________________________________________

  *(Instructor collects Round 1 sheets before allowing Token Spending)*

  ---

  ## 3. Instructor Data Packs (The "Market")

  *Print these on separate sheets to hand out when tokens are paid.*

  **PACK A: The Constitutional Ledger (Succession Mechanism)**
  *   **Hereditary (10 cases):** Avg Lifespan 45 yrs. (Range 20–70)
  *   **Autocratic (10 cases):** Avg Lifespan 50 yrs. (Range 25–80)
  *   **Elective Council (10 cases):** Avg Lifespan 80 yrs. (Range 40–130)
      *   *Includes 3 "Active" cases: 110+, 120+, 130+.*
      *   *Vesuvia is an Elective Council.*

  **Pack B: The Geographic Survey (Terrain)**
  *   **Highland (10 cases):** Avg Lifespan 75 yrs.
  *   **Riverine (10 cases):** Avg Lifespan 65 yrs.
  *   **Coastal (10 cases):** Avg Lifespan 55 yrs. (Range 15–90)
      *   *Includes 2 "Active" cases: 90+, 100+.*
      *   *Vesuvia is Coastal.*

  **Pack C: Individual Case Files (Examples)**
  *   *If bought, give a specific card.* E.g., "Polity #14 (Coastal, Council): Lasted 72 years. Fell due to famine."
  *   *Ensure at least one file bought is an "Active" one if they ask for a long-lived state.*

  **Pack D: The Complete Raw Table**
  *   List of 30 rows. Columns: Name, Start, End, Type, Terrain.
  *   **Crucial:** 5 rows must have End Year = "Active". Their Start Years must be early enough that their *current* age is >100.
      *   E.g., Polity #3: Start 280, End "Active". (Current Age 120).
      *   If students average the "End - Start" column but treat "Active" as missing or "400", the math breaks.

  ---

  ## 4. Minute-by-Minute Timeline (110 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Distribute Dossier (Handout 1). Explain task: "Forecast remaining years." **Do not** mention probability, base rates, or bias. Emphasize: "Work as a team. One submission." |
  | **10-25** | **Round 1** | Teams discuss and fill Round 1 Sheet. Collect sheets immediately at 25:00. |
  | **25-30** | **Market** | Distribute Tokens (3 per team). Explain Prices (Handout 2). Teams decide what to buy. |
  | **30-40** | **Analysis** | Teams review purchased data. Instructor circulates. **Do not answer data questions**, only clarify rules. |
  | **40-55** | **Round 2** | Distribute Round 2 Sheets. Teams revise forecasts. Collect sheets. |
  | **55-60** | **Scoring** | Reveal True Value (20 Years). Compute scores on board (see Scoring Section). Announce Winner. |
  | **60-110** | **Debrief** | Structured discussion (see Section 6). |

  ---

  ## 5. Scoring Scheme (5-Minute Calculation)

  Write this formula on the board before revealing the True Value.

  **Team Score = 100 − Error − (Interval Width / 2) + Bonus**

  *   **Error:** Absolute difference between Point Estimate and True Value (20).
  *   **Interval Width:** The size of the 90% Interval (Upper − Lower).
  *   **Bonus:** +20 points if the True Value (20) falls inside the 90% Interval.
  *   **Penalty:** −50 points if the True Value falls *outside* the 90% Interval.

  *Example:*
  *   Guess: 30 years. (Error = 10)
  *   90% Interval: 10 to 50. (Width = 40)
  *   True Value (20) is Inside.
  *   Score: 100 - 10 - (40/2) + 20 = **90 points**.

  *Why this works:* It rewards accuracy (low error) and calibration (intervals that capture the truth without being infinitely wide). It penalizes overconfidence (narrow intervals that miss).

  ---

  ## 6. The Debrief Script (50 Minutes)

  **Part 1: The Drift (10 mins)**
  *   **Action:** Plot Round 1 vs. Round 2 Point Estimates on the board.
  *   **Ask:** "Did your number go up or down? Why?"
  *   **Concept:** *The Inside View.* In Round 1, you focused on Vesuvia's specific story (Valerius, the Navy). This feels informative. In Round 2, you saw data.
  *   **Point:** "Most of you moved your number toward the average of the data you bought. This movement has a name: **Regression to the Mean**. The specific details (Valerius) felt like they guaranteed success, but the data suggests 'Council States' usually last 80 years, not forever."

  **Part 2: The Token Market (15 mins)**
  *   **Ask:** "Which Data Pack did you buy? Constitutional or Geographic?"
  *   **Reveal:** "Vesuvia is a Council State (Avg 80) AND Coastal (Avg 55). Which number did you use?"
  *   **Concept:** *Reference Class Forecasting.* You had to choose which group Vesuvia belongs to. There is no objective 'correct' class. You had to judge which feature (Constitution vs. Geography) matters more.
  *   **Observation:** Teams that bought 'Individual Cases' (Option C) usually performed worse. Why? *Sample Size.* One case is noise. A class is signal.

  **Part 3: The Hook (10 mins)**
  *   **Ask:** "Did anyone predict over 100 years because of Archon Valerius?"
  *   **Reveal:** "Valerius is a distractor. In the data, 'Charismatic Leaders' do not correlate with lifespan. This is the **Exceptionalism Hook**. You wanted to treat Vesuvia as unique. The Outside View demands you treat it as ordinary."

  **Part 4: The Censoring Trap (15 mins)**
  *   **Ask:** "Who bought the Complete Raw Table (Option D)? What average did you calculate?"
  *   **Reveal:** "If you excluded the 'Active' polities, your average was ~55 years. If you included them as 'ended now', it was ~65. The true average of completed states is higher."
  *   **Concept:** *Right-Censoring.* The 'Active' states are the survivors. They are still ticking. Treating them as finished underestimates the potential of long-lived states. Excluding them removes the most successful cases from your sample.
  *   **Lesson:** "Data is not just numbers. It is a record of what happened *until the record stopped*. You must ask: Why did the record stop?"

  **Vocabulary Reveal:**
  *   Inside View = Focusing on the specific case details.
  *   Outside View = Focusing on the statistics of the class.
  *   Planning Fallacy = Underestimating time/cost because of the Inside View.
  *   Reference Class = The group you compare your case to.

  ---

  ## 7. Frank Notes: Troubleshooting & Limitations

  ### Predictable Problems & Fixes

  1.  **Pacing Disparity:**
      *   *Risk:* Team A finishes Round 1 in 5 minutes; Team B takes 20.
      *   *Fix:* Enforce a "Blackout Period." No one may hand in Round 1 sheets before the 25-minute mark. Use the extra time to have them write down their "Reasoning" sentence in more detail.
  2.  **The Censoring Shout:**
      *   *Risk:* One statistically literate student realizes the "Active" trap in Round 2 and shouts it across the room.
      *   *Fix:* Pre-brief the room: "This is a silent market. Discuss only within your team. If you leak data, your tokens are void." If it happens, acknowledge it in the debrief as "Information Asymmetry" but proceed with the planned reveal.
  3.  **Gaming the Intervals:**
      *   *Risk:* Teams make their 90% interval 0 to 1000 to guarantee the Bonus.
      *   *Fix:* The scoring formula penalizes width (`Width / 2`). A 1000-year width costs 500 points. They will lose. Point this out during the scoring phase.
  4.  **The Hook Argument:**
      *   *Risk:* A team spends 10 minutes arguing about whether Valerius is "really" that good.
      *   *Fix:* Circulate and remind them: "Time is a resource. You are being scored on the forecast, not the debate."

  ### Simulation Limitations (The "Second Note")

  **What this simulation cannot reproduce:**
  The **Contested Reference Class.**
  In this simulation, the "Truth" (70 years) is fixed by you, and the Data Packs are handed out as objective fact. In the real world, the reference class itself is a matter of argument.
  *   *Example:* If forecasting the lifespan of a startup, is the reference class "All Startups" (high failure), "Tech Startups" (higher failure), or "Startups founded by Ex-Google Engineers" (lower failure)?
  *   *The Gap:* Here, students fight over *which* pack to buy. In reality, they fight over *how to define the pack*. One expert will argue "Vesuvia is Coastal," another will argue "Vesuvia is a Council State," and both have political incentives to choose the class that supports their desired outcome.
  *   *How to Supply:* In the debrief, explicitly state: "Today, I gave you the classes. In reality, you have to build them. That is where the real bias hides: not in the math, but in the selection of the comparison group."

  **Is there a worse gap?**
  Yes. **The Fixed Future.**
  In this game, Vesuvia *will* last 20 more years. It is deterministic. In reality, lifespan is probabilistic. Vesuvia might be hit by a meteor tomorrow. The "Outside View" gives you a probability distribution, not a number.
  *   *Correction:* Emphasize in the debrief that the "True Value" of 20 is a simulation convenience. In reality, the Outside View tells you the *odds*, not the *outcome*. A good forecast can still be "wrong" (e.g., predicting 20 years, but it lasts 5). The scoring system we used rewards calibration, not just luck.
