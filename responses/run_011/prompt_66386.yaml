prompt: |-
  I retired four years ago after 32 years running field trials for an agricultural experiment station — mostly nitrogen response in small plots, which sounds dull but taught me more than anything about how a well-designed experiment can still tell you nothing. Since then I've been sitting in on a philosophy of science reading group at the state college, and this term we've been grinding through the replication crisis and the frequentist/Bayesian fight. I read philosophy the way I used to read methods sections, slowly and with a pencil, so I hope you'll forgive how I've framed this.

  The thing that keeps coming up, in the group and in the popular statistics books I've been working through, is the courtroom analogy for significance testing. The null hypothesis is the presumption of innocence; the researcher is the prosecution and carries the burden of proof; alpha is the "beyond reasonable doubt" standard; rejecting the null is a conviction; failing to reject is an acquittal; a type I error is a wrongful conviction and a type II error is letting a guilty person walk free. In our group it gets used to do at least three separate jobs. (a) One member, a retired physician, says a non-significant result is an acquittal and therefore does tell you there's no effect — the court found for the defendant, after all. (b) Another says the 5% level is respectable precisely because it is our version of beyond reasonable doubt, a principled standard rather than an arbitrary number people happen to like. (c) And the general drift of the discussion is that the frequentist trial is more objective than the Bayesian one, because it keeps the juror's private beliefs out and controls the long-run rate of wrongful convictions, whereas a Bayesian smuggles priors in the back door.

  So: audit the analogy for me. Lay out the correspondence explicitly — what plays the prosecutor, the defendant, the jury, the body of evidence, the judge's instructions, the standard of proof, the verdict, the appeal, and the long run of similar trials that frequentist error rates are supposed to be about — then tell me which disanalogies actually bear on (a), (b), and (c) and which are surface noise I can ignore. I especially want to know what features of a courtroom get imported that the statistical setting simply doesn't have; my suspicion is that a single defendant with a determinate guilt and a coherent narrative are carrying a lot of weight that the composite alternative hypothesis can't support. Two things of my own I'd like you to engage with rather than wave away. First, I tried to patch the analogy by arguing that the prior doesn't disappear, it just lives outside the courtroom in the charging decision — police only bring a case when they already have reason to suspect somebody — so what a Bayesian calls a prior, a frequentist handles as a selection effect on which hypotheses ever reach trial. The working statistician in our group called this a category error and I'm not sure its fair. Second, I keep coming back to the fact that Scots law used to allow a third verdict, "not proven," which is neither conviction nor acquittal, and that a great deal of the trouble with (a) is that our courts have no verdict meaning "we found nothing, and nothing isn't the same as innocence." Is there a three-verdict version of the analogy that does better, or would you rather swap the source domain entirely — I've seen population screening and customs inspection offered instead.

  Format, please: prose for the reasoning, but put the mapping in a table with exactly these columns — Courtroom element | Statistical counterpart | Holds / Partial / Breaks | What the mapping smuggles in | Which of (a)(b)(c) it turns on. Then finish with a short structured verdict block, one line per claim, in the form: claim — verdict (survives / survives with repair / fails) — one sentence saying what would have to change for it to survive. No bibliography or reading list, I can't chase references and I'd rather have your own working-out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired agricultural researcher (32 years field trials, nitrogen response), currently in a philosophy of science reading group. Reads slowly, carefully ("with a pencil"). Values practical experience with experimental design. Skeptical of superficial analogies.
      *   **Topic:** The courtroom analogy for Null Hypothesis Significance Testing (NHST).
      *   **Specific Issues:** Three claims made in the group:
          *   (a) Non-significant = Acquittal = No effect.
          *   (b) Alpha (5%) = Beyond Reasonable Doubt = Principled standard.
          *   (c) Frequentist = Objective (long-run error control) vs. Bayesian = Subjective (priors).
      *   **User's Own Contributions:**
          *   Idea 1: Priors exist in the "charging decision" (selection effect). Statistician called this a category error.
          *   Idea 2: Scots law "Not Proven" verdict might fix the "Acquittal = Innocence" problem.
      *   **Format Requirements:**
          *   Prose for reasoning.
          *   **Table:** Exactly 5 columns (Courtroom element | Statistical counterpart | Holds / Partial / Breaks | What the mapping smuggles in | Which of (a)(b)(c) it turns on).
          *   **Verdict Block:** Structured, one line per claim (Claim — Verdict — One sentence repair).
          *   No bibliography/reading list.

  2.  **Deconstruct the Courtroom Analogy (The Mapping):**
      *   *Defendant:* The Null Hypothesis ($H_0$). (Wait, usually $H_0$ is "innocent" status quo).
      *   *Prosecutor:* The Researcher/Data.
      *   *Jury:* The Statistical Test/Algorithm.
      *   *Evidence:* The Data/Test Statistic.
      *   *Standard of Proof:* Alpha level ($\alpha$).
      *   *Verdict:* Reject $H_0$ / Fail to Reject $H_0$.
      *   *Truth:* The actual state of nature (Effect vs. No Effect).
      *   *Long Run:* Repeated sampling/experiments.

      *Critique of Mapping:*
      *   In court, the defendant is a specific person. In stats, $H_0$ is usually a point null (e.g., $\mu = 0$), which is almost never *exactly* true in nature (the "nil null" problem).
      *   In court, "Innocent" is a positive state. In stats, "Fail to Reject" is a lack of evidence, not proof of truth.
      *   In court, the jury decides *this* case. In stats, the test controls error rates over *hypothetical* replications.

  3.  **Address the Three Claims (a, b, c):**
      *   *(a) Non-significant = Acquittal = No effect:* This is the classic "accepting the null" fallacy. In court, acquittal $\neq$ innocence (sometimes). In stats, $p > 0.05$ definitely $\neq$ no effect. The analogy breaks here because legal acquittal *can* imply factual innocence in public discourse, but statistically it's just "insufficient evidence."
      *   *(b) 5% = Beyond Reasonable Doubt:* This is normative vs. descriptive. "Beyond reasonable doubt" is a high bar, but is it 5%? Is it consistent? In law, it's a qualitative standard for a specific case. In stats, 5% is a long-run frequency cap. The analogy smuggles in moral weight to an arbitrary convention.
      *   *(c) Frequentist = Objective vs. Bayesian:* The court analogy suggests objectivity because rules are fixed. But the "charging decision" (which hypotheses get tested) is subjective. Bayesian priors make subjectivity explicit. The analogy hides the subjectivity of model selection and experimental design.

  4.  **Engage with User's Specific Ideas:**
      *   *Idea 1 (Charging Decision = Prior):* The statistician called it a category error. Is it? In frequentist theory, the prior probability of $H_0$ being true is not part of the calculation. In law, police discretion *does* act like a prior filter. However, frequentist error rates ($\alpha, \beta$) are conditional on $H_0$ being true or false, not on the probability *that* $H_0$ is true. So, while conceptually similar (filtering), formally it's distinct. It's a "Partial" hold. It addresses the Base Rate Fallacy.
      *   *Idea 2 (Scots Law "Not Proven"):* This is a strong fix for (a). "Not Proven" maps perfectly to "Fail to Reject." It distinguishes "Evidence for Innocence" (Accept $H_0$) from "Lack of Evidence for Guilt" (Fail to Reject $H_0$). Most US/UK courts don't have this, which fuels the confusion.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's background. Validate their skepticism. The analogy is pedagogical but dangerous.
      *   **The Table:** Needs to be precise.
          *   *Defendant:* $H_0$. (Breaks: $H_0$ is often a straw man, Defendant is a specific entity).
          *   *Prosecutor:* Researcher. (Holds).
          *   *Jury:* Test Procedure. (Partial: Jury weighs evidence, Test calculates $p$).
          *   *Verdict:* Decision. (Breaks: Acquittal $\neq$ Innocence).
          *   *Standard:* $\alpha$. (Partial: Qualitative vs. Quantitative).
          *   *Truth:* Reality. (Holds).
          *   *Long Run:* Reference Class. (Breaks: Courts don't think in long-run error rates for *this* defendant).
      *   **Reasoning/Analysis:**
          *   Discuss the "Point Null" problem. In agriculture, is nitrogen response *ever* exactly zero? Probably not. So $H_0$ is always false. In court, the defendant is either guilty or not.
          *   Discuss the "Long Run." Frequentism is about the *procedure*, not the *case*. Courts care about *this* case. This is the biggest disanalogy.
          *   Address (a): The "Acquittal" trap. Use the Scots law idea here.
          *   Address (b): The arbitrariness of 5%. It's not "beyond reasonable doubt," it's "convenient for publication."
          *   Address (c): Objectivity. The "Charging Decision" argument. It's not a category error, it's a recognition of the "Garden of Forking Paths."
      *   **Verdict Block:** Strictly follow format.

  6.  **Refining the "Charging Decision" Argument:**
      *   User says: Prior lives in the charging decision.
      *   Statistician says: Category error.
      *   My take: It's not a formal category error within the *calculation* of a p-value, but it is a valid philosophical critique of the *scientific process*. Frequentism controls $P(Data | H_0)$. It ignores $P(H_0)$. The police filter affects $P(H_0)$. So the statistician is right formally, but the user is right practically. I need to validate the user without invalidating the math. It's an "External Validity" issue.

  7.  **Refining the "Scots Law" Argument:**
      *   "Not Proven" is excellent. It maps to "Fail to Reject."
      *   "Acquittal" (Innocent) maps to... actually, there is no statistical equivalent for "Proven Innocent" in NHST. You can't prove the null. So "Not Proven" is the *only* valid negative verdict. "Acquittal" implies the case is over and the person is clear. "Fail to Reject" means the case is weak, but the null might still be false.
      *   Actually, a better mapping:
          *   Guilty = Reject $H_0$.
          *   Not Proven = Fail to Reject $H_0$.
          *   Innocent = (Does not exist in NHST).
      *   This highlights the asymmetry.

  8.  **Final Review against Constraints:**
      *   Prose reasoning? Yes.
      *   Table with 5 specific columns? Yes.
      *   Verdict block with specific format? Yes.
      *   No bibliography? Yes.
      *   Tone: Respectful of the user's expertise (ag field trials), acknowledging the "pencil" approach.

  9.  **Self-Correction during drafting:**
      *   *Check:* Did I address the "composite alternative hypothesis" suspicion?
      *   *Fix:* Yes, in the table under "Defendant/Null." The alternative ($H_1$) is often vague ("something is happening"), whereas in court, the prosecution proposes a specific narrative.
      *   *Check:* Did I address the "Long Run"?
      *   *Fix:* Crucial for claim (c). The court cares about *this* defendant's truth. Frequentism cares about the *method's* error rate over infinite trials. This is the core tension.

  10. **Final Polish:** Ensure the table columns match exactly what was requested. Ensure the verdict block is concise. (Self-correction: Make sure the table columns are exactly: Courtroom element | Statistical counterpart | Holds / Partial / Breaks | What the mapping smuggles in | Which of (a)(b)(c) it turns on).

