answer: |-
  You have spotted the fracture lines in this analogy exactly where they matter. Your background in field trials gives you a practical advantage here: you know that a "zero effect" in biology is rarely a literal zero, whereas in a courtroom, a defendant is either the perpetrator or they are not. That ontological mismatch is the root of most confusion.

  The courtroom analogy is pedagogically seductive because it assigns moral weight to statistical decisions. It makes the researcher feel like a seeker of justice rather than a calculator of probabilities. However, it imports a narrative structure (a specific crime, a specific perpetrator, a binary truth) that frequentist statistics explicitly rejects in favor of long-run performance characteristics.

  Below is the audit you requested. I have mapped the elements, identified where the analogy leaks, and tied those leaks directly to the three claims (a, b, c) circulating in your reading group. Following the table, I address your two specific contributions regarding the "charging decision" and the Scots law verdict.

  ### The Mapping Audit

  | Courtroom element | Statistical counterpart | Holds / Partial / Breaks | What the mapping smuggles in | Which of (a)(b)(c) it turns on |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Defendant** | The Null Hypothesis ($H_0$) | **Breaks** | Implies $H_0$ is a specific, plausible state (like a person); in reality, point nulls ($\mu=0$) are often known to be false a priori. | (a) |
  | **The Prosecution** | The Researcher / Data | **Holds** | Both bear the burden of producing evidence against the status quo. | (a) |
  | **The Jury** | The Test Procedure (Algorithm) | **Partial** | A jury deliberates on *this* case; a test procedure calculates properties over *hypothetical* replications. | (c) |
  | **The Evidence** | The Test Statistic ($t$, $F$, etc.) | **Holds** | Both are summaries of observed data used to weigh against the null. | (a) |
  | **Judge's Instructions** | Assumptions (Normality, Independence) | **Partial** | Judges instruct on law; stats assume model fit. Violations corrupt both, but stats are more fragile to hidden violations. | (c) |
  | **Standard of Proof** | Alpha Level ($\alpha$, e.g., 0.05) | **Breaks** | "Beyond reasonable doubt" is a moral threshold for *this* case; $\alpha$ is a long-run error rate cap, not a measure of certainty. | (b) |
  | **Verdict: Guilty** | Reject $H_0$ | **Holds** | Both indicate sufficient evidence to act against the null/defendant. | (a) |
  | **Verdict: Acquittal** | Fail to Reject $H_0$ | **Breaks** | Acquittal often implies innocence in public discourse; "Fail to Reject" implies only insufficient evidence, not truth of $H_0$. | (a) |
  | **The Truth** | State of Nature (Effect vs. None) | **Holds** | Both systems aim to align verdicts with an underlying reality. | (a) |
  | **Long-Run Trials** | Reference Class (Repeated Sampling) | **Breaks** | Courts care about truth in *this* trial; Frequentism cares about error rates in *imagined* infinite trials. | (c) |
  | **Charging Decision** | Hypothesis Selection / Study Design | **Partial** | Police filter suspects (Prior); Researchers filter hypotheses. Frequentism ignores this filter in calculation. | (c) |

  ### Reasoning and Disanalogies

  **The Ontological Mismatch (Claim a)**
  Your suspicion about the "single defendant with a determinate guilt" is the critical failure point. In a criminal trial, the defendant either committed the crime or did not. In your nitrogen trials, the question was never "Is nitrogen *exactly* zero effect?" (You knew it wasn't). The question was "Is the effect large enough to matter?"
  Frequentist NHST tests a point null (effect = 0). In agriculture, physics, and psychology, the null is almost always false if you measure precisely enough. Therefore, a "Fail to Reject" is never an "Acquittal" (proof of no effect); it is merely a declaration that your sample size or precision was insufficient to detect the deviation. This is where your retired physician colleague is dangerous. An acquittal in court allows the defendant to walk free as if innocent. A non-significant result should not allow a researcher to conclude "no effect," yet the analogy encourages exactly that.

  **The Standard of Proof (Claim b)**
  The 5% threshold is not "beyond reasonable doubt." It is a convention adopted by Fisher and codified by textbook authors for convenience. In law, "beyond reasonable doubt" is meant to be a very high bar, variable by the gravity of the crime. In statistics, 0.05 is applied rigidly to trivial and critical questions alike. The analogy smuggles moral legitimacy into an arbitrary number. It makes $\alpha = 0.05$ feel like a principled ethical stance rather than a tolerance for false positives that we agreed upon to facilitate publication.

  **Objectivity and the Long Run (Claim c)**
  This is the deepest fracture. The frequentist courtroom claims objectivity because it ignores the juror's private beliefs (priors). However, it replaces subjective belief with a hypothetical "long run" of identical trials that never actually happen. A court does not care if the jury method yields 5% wrongful convictions over 100 years; they care if *this* defendant is guilty *today*.
  Frequentism guarantees error control over the *procedure*, not the *conclusion*. Bayesianism admits subjectivity in the prior but provides a probability about the *specific hypothesis* given the data. The courtroom analogy favors the frequentist view because courts *look* like they are judging single cases, but the *logic* of p-values is about the long run. This mismatch makes the frequentist claim to objectivity fragile; it controls long-run error but says nothing about the probability that the current finding is true.

  ### Engaging Your Proposals

  **1. The Charging Decision as Prior**
  The statistician in your group called your "charging decision" argument a category error. Formally, they are correct: a frequentist p-value is calculated conditional on $H_0$ being true. The probability that $H_0$ was selected wisely (the prior) does not enter the equation.
  However, philosophically, you are right. In science, as in law, we do not test random hypotheses. We test hypotheses that survived a filter of theory, observation, and plausibility. If police only arrest when evidence is strong, the conviction rate rises. If researchers only test hypotheses that are biologically plausible, the rate of true rejections rises.
  The analogy breaks because the courtroom acknowledges the charging decision (Grand Jury, Probable Cause) as part of the justice system, whereas NHST treats the hypothesis as if it appeared out of thin air. Your patch doesn't fix the math, but it fixes the *interpretation*. It acknowledges that the "objectivity" of the p-value is undermined by the subjectivity of which experiments get run.

  **2. The Scots Law "Not Proven" Verdict**
  This is the strongest repair for the analogy. The binary "Guilty/Not Guilty" forces the "Acquittal = Innocence" error (Claim a).
  A three-verdict system maps much better to statistical reality:
  *   **Guilty:** Reject $H_0$ (Evidence strong enough to act).
  *   **Not Proven:** Fail to Reject $H_0$ (Evidence insufficient, case dismissed, but defendant not exonerated).
  *   **Innocent:** (This verdict does not exist in NHST).
  Adopting "Not Proven" forces the researcher to admit that a non-significant result is a statement about the *evidence*, not the *world*. It kills the idea that $p > 0.05$ proves the null. However, it does not fix the long-run/short-run tension in Claim (c).

  **Alternative Source Domains**
  You mentioned population screening or customs inspection. These are often superior.
  *   **Customs Inspection:** You cannot search every bag (test every hypothesis). You set a threshold (alpha) to catch smugglers (effects). You know you will miss some (Type II) and flag some tourists (Type I). The goal is throughput and error control, not "truth" about a specific bag. This aligns perfectly with the frequentist long-run philosophy but removes the moral weight of the courtroom.
  *   **Quality Control:** A factory tests bolts. You don't care about the "innocence" of one bolt; you care about the rate of defects in the batch. This is the purest frequentist analogy.

  ### Final Verdict

  Claim (a): Non-significant result is an acquittal proving no effect — **Fails** — Requires adopting a "Not Proven" verdict to distinguish lack of evidence from evidence of absence.
  Claim (b): The 5% level is a principled standard akin to beyond reasonable doubt — **Survives with Repair** — Requires acknowledging 0.05 as a conventional error tolerance rather than a moral threshold of certainty.
  Claim (c): Frequentist trials are more objective because they exclude private beliefs — **Fails** — Requires admitting that hypothesis selection (the charging decision) introduces subjectivity that long-run error rates do not neutralize.
