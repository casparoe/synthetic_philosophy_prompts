prompt: |-
  so im in a senior elective called Ethics and Public Policy and my teacher is really into this one philosopher Parfit, and shes doing the whole peer-assessment thing where you get handed someone elses final essay along with her rubric and you have to write up a grade plus comments, and then she spot-checks a few of them to see if you actually read closely. The essay is from a girl in my class named Maya and I dont want to screw her either way — not hand back an A to something with a hole in it, and not trash something thats actually good. Ive read it maybe four times and I have this nagging feeling that something in the middle doesnt hold together, but honestly I cant tell if thats the essay or just me being tired. Can you go through it properly for me?

  Here's the question she assigned:

  Rivertown's council has to pick between two plans for a new freight corridor. Plan A runs it above ground through the Eastside neighborhood. Plan B is a tunnel — more expensive, but finished about two years sooner. Because the construction takes years and reshuffles where thousands of families live and work, the generation born in the two decades after Plan A is finished would be, almost entirely, different people from the generation that would have been born under Plan B. Everyone agrees the Eastside kids under Plan A grow up with worse air: more asthma, shorter lives, but lives that are clearly worth living.

  (a) Explain why someone might think Plan A harms no one who will ever live.
  (b) Suppose the council also knows Plan A will worsen the asthma of children who are already conceived and will be born in the Eastside no matter which plan wins. Does the reasoning from (a) cover them too?
  (c) Some philosophers suggest replacing the principle that an act is wrong only if it makes some person worse off with a wider one: an act is wrong if how things go is worse for whoever turns out to exist than how things would have gone for whoever would have existed under some alternative. Would this wider principle rescue the verdict that Plan A is wrong, and what does it cost you?

  And here's Maya's essay:

  "Plan A looks like it harms nobody, and the reason has to do with timing rather than with air quality. Which specific person you are depends on an absurdly delicate chain of events — which sperm meets which egg, and that depends on when your parents met and conceived, which depends on where they were living and working at the time. A two-year difference in when a project like this finishes moves thousands of people around, and that changes who meets whom. So the children who grow up in the Eastside under Plan A are, almost all of them, not the same children who would have grown up there under Plan B. Under Plan B those particular people would never have existed at all.

  Harm is normally comparative: to harm someone is to make them worse off than they otherwise would have been. For the Eastside kids there is no such alternative. Their only alternative was never existing, and since their lives are worth living, Plan A is better for each of them than the alternative was. So they have no complaint — you cant say 'you ruined my life' to someone whose life was only possible because of the thing you did. And this is basically what the person-affecting view says anyway, which is what utilitarianism amounts to once you apply it to individual people: an act is wrong only if its worse for someone. If nobody is worse off, Plan A isnt wrong.

  I dont think thats the end of it though. Even if no one has a complaint, the world under Plan A is worse than the world under Plan B — same number of people, worse lives — and Parfit's whole point is that we need a theory of wrongness that doesnt have to run through harm to particular people. Thats the right move for (a).

  For (b), the already-conceived kids are a different case but I dont think it changes much. The reason Plan A seemed harmless was that there was no fact about who the future people would otherwise have been. Thats still true in a way here: if the council picks Plan B those kids still exist, but the specific details of their lives would be different, so theres no clean comparison to make. The air is worse under Plan A, but 'worse than what' is doing a lot of work in that sentence, and once you start comparing whole possible lives instead of single events the objection runs out. So (b) is really just (a) again.

  For (c), the wider principle seems built to get us the verdict we want. It lets you set the Eastside kids' actual lives against the lives the Plan B kids would have had, even though theyre different people. The cost is that it stops being person-affecting in any real sense — youre ranking outcomes now, not protecting anyone — so you might as well be a straight utilitarian, and then you inherit whatever problems utilitarianism has with population."

  Her rubric, for the grade part:
  - 40 pts — accurately explains the mechanism and why it seems to block the harm claim
  - 30 pts — handles (b) and (c), i.e. spots where the reasoning does and doesnt apply
  - 20 pts — argument and structure, no unsupported leaps
  - 10 pts — uses the terms precisely (harm, person-affecting, same number of people, etc.)

  Can you write this up for me in these sections, in this order:

  1. **Quick verdict** — like 60 words. Is my nagging feeling justified? Is there a real hole, and how big a deal is it? If you think the essay is actually fine and im wrong, just say that here, dont invent problems to look thorough.
  2. **What's solid** — about 120 words, bullet points. The stuff she gets right, and specifically the stuff thats right for the right reasons rather than by luck.
  3. **What's off** — this is the main section, maybe 350 words, numbered. For each problem give me: the exact claim from the essay, why it doesnt work, whether its a flat-out error or just a step she asserted instead of arguing for, and whether a hasty reader would have let it slide. If one of her moves is defensible-but-contested, tell me thats what it is instead of counting it as a mistake.
  4. **Grade** — around 100 words. The four rubric numbers and a total out of 100, one line of justification each.
  5. **Comments for Maya** — about 100 words, written to her directly in second person, the kind of thing I'd actually hand back. Constructive, no sarcasm, points her at the fixes without writing her essay for her.

  You dont need to cite anything or name books or page numbers, my teacher doesnt care about that at all — I just need the reasoning to be right.
