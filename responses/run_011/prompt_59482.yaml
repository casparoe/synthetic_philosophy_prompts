      **Header:** Effective Date: 2023-10-01 | Owner: Standards Committee B

      **1. Purpose and Scope**
      The Ontological Stability Consortium (OSC) maintains canonical models of physical reality for downstream consumption by research and engineering teams. This policy defines versioning, support tiers, and withdrawal procedures for OSC releases. The OSC warrants predictive fidelity within stated confidence intervals. The OSC does not warrant ontological correspondence, causal completeness, or permanence of internal entity definitions. Users acknowledge that models are provided "as-is" regarding their mapping to external reality.

      **2. Versioning Policy**
      Releases follow semantic versioning (Major.Minor.Patch).
      *   **Patch:** Corrections to numerical precision or calculation errors within existing domains.
      *   **Minor:** Expansion to new domains or phenomena without altering existing interfaces.
      *   **Major:** Significant changes to model structure or entities.

      Major releases are governed by two competing stability criteria:
      2.3.1 **Interface Stability:** A release is non-breaking if all externally observable predictions remain within legacy error margins, regardless of internal entity redefinition. Internal mechanisms are considered implementation details subject to refactoring without notice.
      2.3.2 **Ontological Continuity:** A release is breaking if core causal entities are substituted or removed, even if predictive output remains invariant. Users relying on entity persistence must pin to specific Major versions.

      In cases where 2.3.1 and 2.3.2 conflict, the Standards Committee B will issue a advisory notice. Until then, both clauses remain active.

      **3. Deprecation Schedule**
