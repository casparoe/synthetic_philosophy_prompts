  2.3.1 **Interface Stability:** A release is considered non-breaking if all externally observable predictions remain within legacy error margins, regardless of internal entity redefinition. Internal mechanisms are considered implementation details subject to refactoring, optimization, or wholesale replacement without notice.
  2.3.2 **Ontological Continuity:** A release is considered breaking if core causal entities are substituted, removed, or fundamentally redefined, even if predictive output remains invariant. Users relying on entity persistence for downstream reasoning must pin to specific Major versions.

  In cases where 2.3.1 and 2.3.2 conflict (e.g., output is stable but entities are replaced), the Standards Committee B will issue an advisory notice. Until such notice is issued, both clauses remain active, and versioning decisions are made at the discretion of the Release Manager.

