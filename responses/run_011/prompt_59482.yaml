  **4. Support Warranties**
  Support is limited to versions marked LTS (Long Term Support) or Active. Removed versions receive no security patches, ontological updates, or defect resolution. Users running Removed versions do so at their own risk and indemnify the OSC against liabilities arising from ontological collapse. The OSC reserves the right to redefine base units without notice in Major releases provided Section 2.3.1 is satisfied.

  **5. Frequently Asked Questions**
  **Q: Given the number of Removed releases in the graveyard, should we assume the current flagship will also be withdrawn?**
  A: No. Historical withdrawal records do not constitute predictive evidence for future releases. Each release is evaluated on current merit. The success of past releases in their warranted domains does not guarantee future permanence, nor does their withdrawal guarantee future failure.

  **Q: Does a withdrawal imply the previous release was defective?**
  A: Only if the release failed to meet the predictive fidelity warranted at time of release. Withdrawals due to scope expansion, domain extension, or entity substitution do not qualify as defects under Section 1. A model may be successful and still be Removed.

  **Q: Does the OSC warrant that internal entities (e.g., electrons, quarks, fields) describe anything at all?**
  A: No. See Section 1. Internals are optimized for computational efficiency and predictive accuracy. Ontological correspondence is out of scope. Users requiring ontological warranties must purchase an Enterprise Ontology license.

  **Q: Can we file a ticket if a Removed version works better for our use case?**
  A: Tickets require an Active or LTS version ID. Tickets referencing Removed versions will be closed as Invalid. We cannot support configurations we no longer maintain.

