answer: |-
  **Final Exam: Probability and Rational Choice**
  **Time Allowed:** 45 Minutes
  **Instructions:** Answer both parts. Calculators permitted. No notes.

  **Question 1 (25 Marks)**

  Consider a repeated gamble available to an agent with current wealth $W_0$. In each round, a biased coin is flipped ($p=0.55$ for Heads). The agent stakes a fraction $f$ of their current wealth.
  *   **Heads:** Wealth becomes $W_{new} = W_{old}(1 + 2f)$.
  *   **Tails:** Wealth becomes $W_{new} = W_{old}(1 - f)$.
  Wealth is reinvested over $N$ rounds.

  **(a)** Derive the stake fraction $f_{EW}$ that maximizes expected wealth after one round, and the stake fraction $f^*$ that maximizes the expected logarithmic growth rate. Calculate the specific numerical values for $p=0.55$. Briefly explain what the divergence between $f_{EW}$ and $f^*$ demonstrates about the applicability of expected-value reasoning to a single agent traversing a single time trajectory versus an ensemble of parallel agents. (15 marks)

  **(b)** Critique the following argument:
  > *"The Kelly criterion maximizes expected log wealth. By the Strong Law of Large Numbers, expected log wealth converges to the almost-sure long-run growth rate. Since the logarithmic function is an admissible von Neumann–Morgenstern utility function, Expected Utility (EU) theory mandates Kelly betting as uniquely rational for any agent maximizing utility."*

  Identify the specific logical flaw. Explain why the premises may be individually true while the conclusion fails, focusing on the relationship between utility functions and rational mandates. (10 marks)

  ***

  **Model Answer**

  **(a) Derivations and Interpretation**
  Let $W_1$ be wealth after one round. The expected wealth is:
  $$E[W_1] = W_0 [p(1+2f) + (1-p)(1-f)] = W_0 [1 + f(3p - 1)]$$
  Substituting $p=0.55$: $E[W_1] = W_0 [1 + 0.65f]$.
  Since the coefficient of $f$ is positive, expected wealth is maximized by staking the maximum possible amount. Thus, **$f_{EW} = 1$** (betting all wealth).

  The long-run growth rate is determined by the expected log return:
  $$g(f) = E[\ln(W_1/W_0)] = p \ln(1+2f) + (1-p) \ln(1-f)$$
  To find $f^*$, we set the derivative with respect to $f$ to zero:
  $$g'(f) = \frac{2p}{1+2f} - \frac{1-p}{1-f} = 0 \implies 2p(1-f) = (1-p)(1+2f)$$
  Solving for $f$: $2p - 2pf = 1 + 2f - p - 2pf \implies 3p - 1 = 2f$.
  $$f^* = \frac{3p - 1}{2}$$
  Substituting $p=0.55$: $f^* = \frac{1.65 - 1}{2} = \mathbf{0.325}$.

  **Interpretation:** The divergence highlights the difference between **ensemble averages** and **time averages**. $f_{EW}=1$ maximizes the mean wealth across a hypothetical ensemble of parallel universes; in most individual universes, the agent eventually hits ruin ($W=0$), but the few universes with long winning streaks skew the average astronomically high. $f^*=0.325$ maximizes the growth rate for a **single agent** living through one trajectory over time. For a non-replicable agent, ruin is absorbing and irreversible; therefore, maximizing the ensemble mean is irrational if it entails almost-sure ruin in the time domain. Expected-value reasoning fails here because the process is non-ergodic: the expectation over probability space does not equal the expectation over time.

  **(b) Critique of the Argument**
  The argument contains a non-sequitur in its final step. While the premises are individually true, they do not support the conclusion that EU theory *mandates* Kelly betting as *uniquely* rational.

  1.  **Premise Validity:** It is true that Kelly maximizes expected log wealth and that log wealth corresponds to the long-run growth rate via the SLLN. It is also true that $U(W) = \ln(W)$ is an admissible vNM utility function (it is concave and monotonic).
  2.  **The Flaw:** The error lies in conflating **sufficiency** with **necessity**. While having logarithmic utility is *sufficient* to justify Kelly betting, EU theory does not *necessitate* logarithmic utility. vNM rationality requires only that preferences satisfy axioms (completeness, transitivity, independence, continuity); it does not dictate the specific functional form of the utility function.
  3.  **Rational Mandates:** An agent with $U(W) = \sqrt{W}$ is equally rational under EU theory but will derive a different optimal stake (more conservative than Kelly). The argument attempts to derive an objective rational mandate (Kelly) from a subjective preference structure (Log Utility) by smuggling in the long-run growth property as a normative requirement. Unless an agent *specifically* values long-run geometric growth over other risk profiles, EU theory remains agnostic. The bridge principle fails because convergence properties of a specific function do not constrain the admissibility of other functions. Rationality in EU theory is coherence of preference, not alignment with asymptotic frequency properties.

  ***

  **Marking Scheme (Total: 25)**

  **Part (a): 15 Marks**
  *   **$f_{EW}$ Derivation (3 marks):**
      *   1 mark: Correct setup of linear expectation equation.
      *   1 mark: Identification that positive slope implies boundary solution.
      *   1 mark: Correct value ($f=1$).
  *   **$f^*$ Derivation (5 marks):**
      *   2 marks: Correct log-growth objective function.
      *   2 marks: Correct differentiation and algebraic solution.
      *   1 mark: Correct numerical value ($0.325$).
  *   **Interpretation (7 marks):**
      *   **B Grade (4-5 marks):** Notes that $f=1$ leads to ruin eventually. Notes that Kelly is safer. Mentions "average" vs. "single person."
      *   **A Grade (6-7 marks):** Explicitly distinguishes **ensemble average** (parallel copies) vs. **time average** (single trajectory). Uses the term **non-ergodic** or explains that expectation over probability space $\neq$ expectation over time. Explains that $f_{EW}$ relies on outlier trajectories that a single agent cannot access.

  **Part (b): 10 Marks**
  *   **Identifying the Flaw (5 marks):**
      *   **B Grade (2-3 marks):** States that "Log isn't the only utility" or "Other utilities exist."
      *   **A Grade (4-5 marks):** Identifies the logical gap: Admissibility $\neq$ Mandate. Explains that the argument conflates a specific goal (growth) with the general framework (EU).
  *   **Explaining the Failure (5 marks):**
      *   **B Grade (2-3 marks):** Explains that different agents have different risk aversions.
      *   **A Grade (4-5 marks):** Explains that the **bridge principle** fails because vNM axioms constrain *consistency*, not *content*. The SLLN property of Log utility is a mathematical fact, not a normative constraint on all rational agents. An agent can be rational (coherent) without caring about long-run growth rates.

  **Differentiation Summary:**
  *   **A (21-25):** Precise math; explicitly names "ensemble vs. time" or "ergodicity"; identifies the category error in (b) between subjective utility and objective convergence.
  *   **B (16-20):** Correct math; intuitive explanation of ruin in (a); identifies Log is not unique in (b) but misses the logical structure of the failure.
  *   **C (10-15):** Math errors or incomplete derivations; vague qualitative answers.
