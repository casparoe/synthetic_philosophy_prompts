          *   With $p=0.55$, $f^* = (1.65 - 1)/2 = 0.325$.
      *   *Part (a) Interpretation:* Expected wealth maximizes over an *ensemble* of parallel universes (one agent per universe). Growth rate maximizes over *time* for one agent. Ruin in the long run makes high expected wealth meaningless for the single trajectory.
