  Your reliance on the counterfactual argument is a convenient shield, but it does not scrub the enamel hypoplasia off the maxilla. The people who lived through the transition—the ones whose bones I hold—did not experience their lives as a necessary trade-off for existence; they experienced them as a physiological decline from the condition of their ancestors. If I break a man's legs to put him in a cart that carries more people, I cannot justify the broken legs by telling him he wouldn't have been in the cart otherwise. The loss is theirs, measured in pain, labor, and stature, and it is not erased because the system that broke them also conceived them. Ethics must account for the quality of the life actually lived, not just the fact of its existence, and the isotopic record shows that quality dropped precipitously.

  Furthermore, you treat this population explosion as a surplus of welfare rather than a demographic trap. Once the slope is greased, the only way to sustain the new density is to double down on the very practices that degrade health. Those extra lives are not beneficiaries of a benevolent expansion; they are conscripts required to work the land that feeds them. You are conflating biological replication with human flourishing. A parasite is successful when it maximizes its host count while draining their vitality; by your metric, the parasite has created a universe of lives worth living. But if the baseline of those lives is defined by vulnerability to famine, zoonotic disease, and social coercion, then the expansion is merely the scaling of a disaster.

  So whose loss was it? It was the loss of resilience. The forager could walk away from scarcity; the farmer must starve in place and defend the granary. The catastrophe is the locking-in of a system where human welfare is subordinate to caloric throughput and state formation. It is not an aesthetic preference to note that we built a world where more people live lives of drudgery and compromised immunity. It is the central ethical problem of our history that we mistake survival for success. You ask me to justify the dip in average welfare; I ask you to justify the creation of a system where the average human body becomes a cheaper, more expendable unit of production.
