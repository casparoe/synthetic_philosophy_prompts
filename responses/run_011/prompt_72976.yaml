          *   Wrongness: Explicitly stating the motive too early.
          *   Control: A sentence where the motive *is* clear.
      *   *Probe 2: Aspect/Tense (The "Drowning" Case).*
          *   Source: English past tense (neutral).
          *   Target: Spanish Preterite (completed) vs. Imperfect (ongoing/descriptive).
          *   Wrongness: Using Preterite for the memory if it should feel suspended, or Imperfect if it needs finality.
          *   Innocent Explanation: Regional variation (Bogotá vs. Madrid).
      *   *Probe 3: Lexical Echo (The "Sparrow" Case).*
          *   Source: Proper noun vs. Common noun (same word).
          *   Target: Same Spanish word (*Gorrión* vs. *Gorrioncito*).
          *   Wrongness: Diminutives applied inconsistently.
          *   Control: Another nickname/bird pair.
      *   *Probe 4: Register/Pronoun (The "Married Couple" Case).*
          *   Source: *Usted* vs. *Tú*.
          *   Target: Consistency with specific breaks.
          *   Wrongness: Standardizing to *tú* (common MT habit).
