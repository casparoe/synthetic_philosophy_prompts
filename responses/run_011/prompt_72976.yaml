  4.  **Applying to the Three Cases:**
      *   *Case 1 (Dog/Letters):* Spanish forces causality (*por el perro* vs. *a causa del perro* vs. *volvió por las cartas*). If the translation says *No volvió por el perro* (He didn't return because of the dog), it implies he didn't return. If it says *Volvió, pero no por el perro*, it clarifies he returned. The English says "he didn't go back... because of the dog." Wait, the prompt says: "he didn't go back to the house because of the dog. The English is deliberately double — he did go back, the dog just wasn't why."
