      *   *Case 3 Nuance:* Nicknames in Spanish almost always take diminutives. Real birds usually don't. Maintaining the exact lexical root without morphological shift is unnatural in Spanish. This is likely the author's fault for expecting English morphology to map 1:1. I need to call this out.
      *   *Tone:* Keep it crisp. The user is a pro. Don't patronize.

