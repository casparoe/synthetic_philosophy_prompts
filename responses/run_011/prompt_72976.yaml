      *   *Old Argument (1997):* MT lacks semantic depth; it fails on poetry/form/ambiguity because it doesn't "understand."
      *   *New Reality (LLMs):* LLMs predict tokens based on vast context. They *simulate* understanding very well. They handle ambiguity by picking the most probable path, often smoothing over intentional roughness.
      *   *The Shift:* The failure mode isn't "nonsense" or "clunky syntax." It's "averaging." It's resolving ambiguity too early, flattening irony, or standardizing register.
      *   *Protocol Design:* Needs to target *resolution of ambiguity*, *register consistency over distance*, and *lexical echo*.

