answer: |-
  # The "Regression to the Mean" Diagnostic Protocol

  **Objective:** Distinguish between human translation choices (even bad ones) and Machine Translation (MT) + light post-editing.
  **Premise:** Modern MT does not produce gibberish. It produces *probabilistic averages*. It resolves ambiguity prematurely, standardizes register, and smoothes over intentional friction. It avoids risk.
  **Time:** 2 hours per manuscript (sampling method), 1 hour per deep-dive case.
  **Personnel:** Author (you) + Helper (bilingual, non-linguist).

  ---

  ## Part 1: The Probe Set

  Run these five probes on random samples (10 pages per chapter, scattered) before tackling your specific cases. If a manuscript fails 3+ probes, treat it as MT-compromised.

  ### Probe 1: The Ambiguity Resolution Test
  *   **Source Feature:** A sentence where syntax allows two contradictory readings, resolved by context 50+ pages later.
  *   **Target Requirement:** Spanish must either maintain the syntactic ambiguity or resolve it *incorrectly* (to preserve the mystery).
  *   **The Wrongness:** The Spanish clarifies the meaning immediately, spoiling the reveal. Or, it resolves the ambiguity in the "most common" way (statistically probable) rather than the "narratively correct" way.
  *   **Innocent Explanation:** Spanish syntax may force a choice where English allows flexibility.
  *   **The Control:** Find a sentence nearby where the meaning *is* clear in English. Ensure the Spanish translates that one clearly. If the ambiguous sentence is translated with the *same* clarity as the clear one, it's a smoothing error.
  *   **Rule Out:** If the Spanish is grammatically broken trying to maintain ambiguity, that's a human struggle. If it's perfectly smooth but spoils the plot, that's MT prediction.

  ### Probe 2: The Aspect/Tense Consistency Test
  *   **Source Feature:** English Simple Past describing a memory that is later revealed to be traumatic/final, or vice versa.
  *   **Target Requirement:** Spanish must choose Preterite (*cantó* - completed) or Imperfect (*cantaba* - ongoing/descriptive) consistently until the reveal shifts the perspective.
  *   **The Wrongness:** Inconsistent switching without narrative cause. MT often defaults to Preterite for narrative sequence.
  *   **Innocent Explanation:** Regional dialect (Bogotá uses Preterite more aggressively than Madrid).
  *   **The Control:** Find a clearly completed action in the same chapter. It should be Preterite. Find a clearly descriptive background action. It should be Imperfect. If the "load-bearing" sentence matches the background action when it should match the completed action (or vice versa), flag it.
  *   **Rule Out:** Ask your helper: "Does this sound like a story being told, or a scene being watched?" If the answer wavers, the aspect is leaking.

  ### Probe 3: The Lexical Echo Test
  *   **Source Feature:** A word used as a proper noun (nickname) and later as a common noun (object/animal).
  *   **Target Requirement:** The Spanish root word must remain identical. Morphology (diminutives/plurals) can change, but the root must be recognizable.
  *   **The Wrongness:** The nickname is translated with a diminutive (*-ito*) or synonym that the common noun does not share three hundred pages later.
  *   **Innocent Explanation:** Nicknames in Spanish naturally attract diminutives; common nouns do not.
  *   **The Control:** Find another nickname in the book. Does it also get a diminutive? If *only* this one does, it's an MT hallucination of "affection."
  *   **Rule Out:** If the common noun *also* gets a diminutive in the later chapter (e.g., watching "little sparrows"), the link is preserved. If only the nickname is diminutized, the link is broken.

  ### Probe 4: The Register Slip (Pronoun) Test
  *   **Source Feature:** Two characters who use formal (*usted*) address, with specific, marked slips to informal (*tú*).
  *   **Target Requirement:** *Usted* conjugation must hold 95% of the time. *Tú* must appear *only* at the emotional climax points.
  *   **The Wrongness:** Standardization to *tú* (most MT default for fiction) or random mixing.
  *   **Innocent Explanation:** Post-editor "correcting" what they think is an error.
  *   **The Control:** Check a dialogue with a stranger. It should be *usted*. Check a dialogue with a child. It should be *tú*. If the spouse dialogue matches the stranger dialogue, it's a systematic MT collapse.
  *   **Rule Out:** If the *tú* slips happen in the same scenes as the English but the conjugation is wrong (e.g., *tú* + *usted* verb ending), that's a human error. If it's all *tú*, it's MT.

  ### Probe 5: The Irony Distance Test
  *   **Source Feature:** A statement that is factually false or ironic based on information provided 60+ pages prior.
  *   **Target Requirement:** The Spanish must remain deadpan. No scare quotes, no "supuestamente," no tonal markers.
  *   **The Wrongness:** The translation adds markers to signal the irony immediately (over-marking) or translates it sincerely (under-marking).
  *   **Innocent Explanation:** Translator didn't catch the irony.
  *   **The Control:** Find a line of sincere dialogue nearby. Ensure it isn't marked ironically.
  *   **Rule Out:** If the irony is marked with words not in the source (e.g., *alegadamente*), it's MT trying to be helpful.

  ---

  ## Part 2: Case Studies (End-to-End Run)

  ### Case 1: The Husband/Dog/Letters (Chapter 4)
  *   **Source:** "He didn't go back to the house because of the dog." (Meaning: He *did* go back; dog was not the reason).
  *   **Probe:** Ambiguity Resolution.
  *   **What to Look For:**
      *   **Right:** *Volvió a la casa, pero no por el perro.* (Clarifies return, hides motive). OR *No volvió a la casa por el perro.* (Maintains ambiguity, risks reader thinking he stayed away).
      *   **Wrong:** *No volvió a la casa a causa del perro.* (Explicitly says he stayed away).
  *   **The Wrongness on Page:** If the Spanish explicitly states he *did not return* (*No volvió*), the translator resolved the scope of negation incorrectly. If the Spanish explicitly states he *did return* (*Volvió*), the mystery is spoiled.
  *   **Innocent Explanation:** Spanish syntax (*No volvió por...*) strongly implies he stayed away. A human translator might force a rewrite to make it readable.
  *   **Control:** Check Chapter 200 (when the letters are revealed). Does the Spanish reference his return as an established fact? If Chapter 4 says he didn't return, but Chapter 200 says he did, it's a continuity error (Human). If Chapter 4 says he did return explicitly, it's a spoiler (MT/Human).
  *   **Verdict:** If the Spanish reads *No volvió a la casa por el perro*, the MT (or tired human) took the statistically probable path. This is a **Critical Failure**. It breaks the plot.
  *   **Author Fault Check:** **Yes.** English allows scope ambiguity here that Spanish syntax fights. You wrote a sentence that is untranslatable without loss. The translator *had* to choose: spoil the return or spoil the motive. Blaming the machine for fixing your untranslatable syntax is unfair. However, they should have queried you. If they didn't query, that's the failure.

  ### Case 2: The Drowning/Aspect (Chapter 3 vs. 22)
  *   **Source:** "He swam out past the rocks." (Simple Past).
  *   **Probe:** Aspect/Tense Consistency.
  *   **What to Look For:**
      *   **Right:** *Nadaba* (Imperfect) in Ch 3 if the memory is suspended/unreal. *Nadó* (Preterite) in Ch 22 when confirmed as death. OR *Nadó* in Ch 3 if the narrator knows it's the end.
      *   **Wrong:** Swapping randomly. *Nadaba* in Ch 22 (makes death feel ongoing/uncertain). *Nadó* in Ch 3 (if the intent was a dreamlike suspension).
  *   **The Wrongness on Page:** In Ch 3, if it says *Nadó*, it feels like a completed event. If the narrator "has known the whole time," the Preterite (*Nadó*) is likely correct (it is a fact to her). If the Spanish uses Imperfect (*Nadaba*), it suggests she is trying to pretend it wasn't final.
  *   **Innocent Explanation:** Colombian Spanish often prefers Preterite for narrative sequence even in memories.
  *   **Control:** Check a different memory in Ch 3 that *wasn't* fatal. Is it also Preterite? If yes, the translator is consistent, just perhaps not matching your specific psychological intent.
  *   **Verdict:** This is **Untestable by Protocol**. Aspect is a stylistic choice. Unless the Spanish contradicts itself (Imperfect in Ch 3, Preterite in Ch 10, Imperfect in Ch 22), you cannot prove MT. MT usually defaults to Preterite for narrative. If the Spanish is all Preterite, it's standard translation, not necessarily MT.
  *   **Author Fault Check:** **Yes.** You are expecting Spanish to carry a psychological load via grammar that it may not naturally support without sounding archaic or specific to a region. This is a "untranslatable nuance."

  ### Case 3: The Sparrow (Chapter 2 vs. 31)
  *   **Source:** Nickname "Sparrow" vs. Real "sparrows."
  *   **Probe:** Lexical Echo.
  *   **What to Look For:**
      *   **Right:** *Gorrión* (Ch 2) and *Gorriones* (Ch 31).
      *   **Wrong:** *Gorrioncito* (Ch 2) and *Gorriones* (Ch 31).
  *   **The Wrongness on Page:** The diminutive *-ito* creates a different lexical root in the reader's ear. The echo fails.
  *   **Innocent Explanation:** Spanish nicknames almost demand diminutives. Translating "Sparrow" as *Gorrión* for a person can sound cold or like a criminal alias.
  *   **Control:** Check Ch 31. Do the birds on the wire get called *gorrioncitos*? If yes, the link holds. If no, the link breaks.
  *   **Verdict:** If Ch 2 is *Gorrioncito* and Ch 31 is *Gorriones*, the MT (or human) normalized the nickname.
  *   **Author Fault Check:** **Yes.** This is your fault. In English, "Sparrow" works as a neutral nickname. In Spanish, *Gorrión* is harsh. A translator *must* soften it to *Gorrioncito* to sound like a brother's affection. You cannot demand lexical identity over cultural naturalism here. If you want the echo, you must accept the nickname sounds slightly odd in Spanish, or accept the echo is weakened.

  ---

  ## Part 3: The One-Page Helper Sheet

  **TO:** Translation Helper
  **FROM:** Author
  **TASK:** Spot-check the Spanish manuscript for "Smoothing."
  **TIME:** 2 Hours Max.

  **INSTRUCTIONS:**
  We are not looking for grammar mistakes. We are looking for **decisions that were made too easily.** Machines pick the most common option. Humans pick the specific one.

  **STEP 1: The Pronoun Count (20 mins)**
  *   Pick a married couple who should be formal (*usted*).
  *   Scan 5 pages of dialogue.
  *   **FLAG:** If you see *tú* verbs (*quieres, eres*) before the emotional climax scenes.
  *   **JUDGMENT CALL:** If they use *tú* everywhere, is it a Colombian norm? (Ask me). If it's mixed randomly, it's MT.

  **STEP 2: The "Safe Word" Search (40 mins)**
  *   Search for these Spanish words: *supuestamente, alegadamente, básicamente, realmente.*
  *   **FLAG:** Any instance of these.
  *   **WHY:** MT adds these to hedge irony or uncertainty. English "He was the king" might become "Era *realmente* el rey."
  *   **ACTION:** Delete them. If the sentence breaks, the translation was weak.

  **STEP 3: The Echo Check (40 mins)**
  *   Find the nickname "Sparrow" (Ch 2). Note the Spanish word.
  *   Find the birds "sparrows" (Ch 31). Note the Spanish word.
  *   **FLAG:** If the roots are different (e.g., *Gorrioncito* vs. *Gorriones*).
  *   **JUDGMENT CALL:** If the nickname has *-ito* and birds don't, ask me: "Do we force the birds to be *-itos* too?"

  **STEP 4: The Ambiguity Spot (20 mins)**
  *   Go to Chapter 4 (Husband/Dog).
  *   **FLAG:** If the Spanish clearly says he *did not return* (*No volvió*).
  *   **WHY:** The plot requires he *did* return.
  *   **ACTION:** This is a critical error. Highlight it.

  **STOP RULES (When to call the Author):**
  1.  **Tone:** If a joke feels flat, don't mark it. That's taste. Call me.
  2.  **Grammar:** If a sentence looks weird but is grammatically correct, don't fix it. That might be style. Call me.
  3.  **The "Fault" Cases:** I know three places (Dog, Drowning, Sparrow) might be my fault for writing untranslatable English. If you find errors there, mark them "Author Query" not "Translator Error."

  ---

  ## Part 4: The Hard Truths

  **1. Which case is your fault?**
  **Case 1 (Dog)** and **Case 3 (Sparrow)** are largely your fault.
  *   **Dog:** You wrote a scope ambiguity that Spanish syntax cannot replicate without breaking clarity or spoiling the plot. A translator *must* resolve it. If they didn't ask you how to resolve it, they were negligent. But the problem originates in the source.
  *   **Sparrow:** You are prioritizing lexical symmetry over target-language naturalism. *Gorrión* is a cold nickname in Spanish. The translator softened it to be human. That is a correct translation choice, even if it breaks your echo. You have to decide if the echo is worth the unnatural nickname.

  **Case 2 (Drowning)** is the only one where the translator/MT could be truly at fault, but only if they were inconsistent with aspect. If they were consistent, it's just a stylistic difference you have to accept.

  **2. Does Hofstadter's diagnosis still work?**
  **Yes, but the signal has changed.**
  In 1997, MT failed because it produced **nonsense**.
  In 2024, MT fails because it produces **safety**.

  Hofstadter's argument buys you this: A non-comprehending system cannot distinguish between a *risk worth taking* and a *mistake to be avoided*.
  *   A human translator sees your ambiguous "dog" sentence and panics, then emails you.
  *   An MT system sees the probability distribution and picks the smoothest path.
  *   A human translator sees "Sparrow" and knows *Gorrión* is cold, so they use *Gorrioncito* and accept the loss of the echo.
  *   An MT system might flip-flop or stick to the root regardless of warmth.

  **Verdict:** The protocol will not prove "This was generated by a machine." It will prove "This translation was not risk-managed by a human."
  If the Spanish is flawless, smooth, consistent, and completely devoid of the specific struggles your text demands, **it is machine-post-edited.** A human struggle leaves scars. MT leaves polish. You are looking for the absence of scars where there should be wounds.

  **Final Instruction:** Do not sign the approval form until the "Dog" ambiguity is resolved via email correspondence. That paper trail is your only proof that a human engaged with the text. If there is no query, there was no reader.
