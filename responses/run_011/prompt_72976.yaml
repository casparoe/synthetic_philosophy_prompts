      *   *Case 2 (Drowning/Aspect):* English "He swam." Spanish *Nadó* (Preterite) vs. *Nadaba* (Imperfect).
          *   *Intent:* She knows he died. The memory is fixed/final (Preterite?) OR The memory is a living scene she revisits (Imperfect?). Actually, if she *never says so*, the narrative voice might treat the afternoon as ongoing in her head until the reveal.
          *   *Diagnosis:* Check *Nadó* vs. *Nadaba*. If *Nadó*, it treats the swim as a completed event in the timeline. If *Nadaba*, it treats it as background/descriptive. The "leak" is if the aspect changes prematurely before the reveal.
      *   *Case 3 (Sparrow):* *Gorrión* vs. *Gorrioncito*.
          *   *Intent:* Same word.
          *   *Diagnosis:* Check Chapter 2 vs. Chapter 31. If Ch 2 is *Gorrioncito* (affectionate nickname) and Ch 31 is *Gorriones* (plain birds), the link is broken.
          *   *Hard Truth:* If the author used "Sparrow" in English, Spanish *needs* a diminutive for a nickname to sound natural. This might be the author's fault for not accounting for target language norms.

  5.  **Refining the Protocol for the "Helper":**
      *   Needs to be actionable.
      *   Needs to flag where the author must decide.
      *   Time limit: 2 hours.
      *   Must identify "MT Smoothing."

  6.  **Addressing the Hofstadter Question:**
      *   Does it still work? Yes, but differently. It's not about "nonsense," it's about "probabilistic averaging." MT avoids risk. Literary fiction *requires* risk.
      *   Verdict: It picks out "safe" translation vs. "committed" translation.

  7.  **Review against Constraints:**
      *   *No summarizing Hofstadter.* (Check)
      *   *No reading list.* (Check)
