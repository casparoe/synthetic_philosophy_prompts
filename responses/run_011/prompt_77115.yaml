prompt: |-
  I co-teach a 90-minute research-methods session within an evidence-based-practice module for 24 second-year nursing students, seated at six tables of four. These students are fluent at describing effect sizes and remarkably casual about moving from what the audit shows to what the ward should do. I want an in-class game that makes them feel the is-ought gap from the inside, and feel the specific pull of the naturalistic fallacy, with no lecture beforehand and with no use of the terms "is-ought," "guillotine," "naturalistic fallacy," or "open question" until the debrief.

  The skeleton I have in mind: each table gets a hand of purely descriptive cards drawn from one recurring clinical case (night-shift staffing ratios, an infection-rate audit, a family's stated preferences, a medication-error report) together with a very small number of "bridge" cards that are frankly normative, and a target recommendation they must justify. Every step of their chain must be licensed by a card in hand, and an auditor rotating from another table must be able to put a finger on the exact card that supplies the normativity at each step.

  Two things I cannot figure out how to build in. First, a deliberate subset of trap cards phrased in thick or quasi-clinical evaluative vocabulary — "deteriorating," "non-compliant," "within a healthy range," "the normal course," "an appropriate level of care" — that read as descriptive and are worth substantially more if a team slips one through unchallenged than they cost if an auditor catches it. I want the payoff structure to make smuggling profitable but risky, so the students feel the temptation rather than being warned against it. Second, a round in which each table proposes a wholly descriptive definition of a normative term they have already been using ("harm," "benefit," "recovery"), and opponents score by producing a live open question against that definition — with some mechanism for penalizing the cheap logical escapes, both the added-disjunct trick and the inference from a role-occupying fact ("she is the charge nurse, therefore she ought to do what a charge nurse does"), which otherwise lets a smart table win the round on a technicality.

  Please supply: enough of the card lists to run it as written, a scoring scheme requiring no real money, a minute-by-minute timeline, the facilitator's moves and minimal scripted remarks at each transition, and a debrief that maps identifiable moments in play onto the gap, onto the definitional error, and onto the distinction between a premise that is merely missing and one that cannot be discharged at all. Tell me what will predictably go wrong the first time I run it with a group this size — in particular whether the thick-concept round degenerates into an argument about vocabulary rather than inference — and be frank about which feature of the philosophical problem a card game cannot reproduce, so that I know what I have to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** 90-minute research-methods session, evidence-based-practice module, 24 second-year nursing students (6 tables of 4).
      *   **Student Profile:** Fluent in effect sizes, casual about moving from "is" (audit data) to "ought" (ward action).
      *   **Goal:** Make them *feel* the is-ought gap and the naturalistic fallacy from the inside. No jargon until debrief.
      *   **Core Mechanism:** Card game. Descriptive cards + Normative "bridge" cards + Target Recommendation. Auditors check links.
      *   **Specific Challenges to Solve:**
          1.  *Trap Cards:* Thick/Quasi-clinical evaluative vocabulary (e.g., "deteriorating," "appropriate") that look descriptive. Smuggling them must be profitable but risky.
          2.  *Definition Round:* Tables define normative terms ("harm," "benefit"). Opponents score by producing "open questions." Need to penalize logical escapes (added disjuncts, role-occupying facts).
      *   **Deliverables:** Card lists, scoring scheme, minute-by-minute timeline, facilitator script/moves, debrief plan, prediction of failure modes, limitations of the medium.

  2.  **Deconstruct the Game Mechanics:**

      *   *The "Is-Ought" Gap:* The game needs to force a break in logic where data ends and value judgments begin.
      *   *The "Trap":* Students need to be incentivized to hide value judgments inside clinical language.
      *   *The "Audit":* Peer review is essential. One student from Table A checks Table B.
      *   *Scoring:* Needs to be simple (points/tokens) but meaningful enough to create tension.
      *   *Timeline:* 90 minutes is tight for a complex game + debrief. Needs strict timekeeping.

  3.  **Drafting the Card System:**

      *   *Case Study:* Needs to be unified. Let's use "Night-Shift Staffing & Patient Safety" (as suggested in the prompt). It's relatable and high stakes.
      *   *Descriptive Cards (Blue):* Hard data. "3 falls last night," "Staff ratio 1:8," "Patient BP 90/60."
      *   *Normative Bridge Cards (Red):* Explicit values. "Patient safety is priority," "Cost must be minimized," "Family wishes should be respected."
      *   *Trap Cards (Purple/Thick):* The tricky ones. "Suboptimal staffing," "Unacceptable risk," "Standard of care," "Deteriorating condition." These look like facts but contain values.
      *   *Target Cards:* The goal. "Increase staffing," "Discharge patient," "Restrict visitors."

      *   *Refining the Trap Mechanic:* If a team uses a Trap Card as if it were Descriptive, they get bonus points *if* the Auditor misses it. If the Auditor catches it, the team loses points, and the Auditor gains points. This creates the "smuggling" incentive.

  4.  **Drafting the Definition Round (The "Open Question" Mechanic):**

      *   *Task:* Define a term like "Safe."
      *   *Attack:* Opponents ask, "X fits this definition, but is X actually Safe?"
      *   *Defending against Cheap Shots:*
          *   *Added Disjunct:* "Safe means no harm OR acceptable harm." -> Penalty: This is just restating the value.
          *   *Role-Occupying:* "Safe means what a Nurse says is safe." -> Penalty: Appeal to authority, not definition.
      *   *Scoring:* If the definition holds against 3 challenges, points. If an Open Question sticks, opponents get points.

  5.  **Developing the Timeline (90 Minutes):**

      *   0-10: Setup & Rules (No theory).
      *   10-40: Round 1 (The Argument Chain).
      *   40-55: Round 2 (The Definition Trap).
      *   55-80: Debrief (Connecting to Hume/Moore).
      *   80-90: Wrap up.

  6.  **Addressing the Specific Constraints:**

      *   *No Jargon:* Facilitator must not say "Hume," "Fallacy," "Normative" during the game.
      *   *Incentives:* Points system needs to be clear.
      *   *Failure Modes:* What goes wrong? Students might argue semantics. The game might feel too abstract. The "Trap" might be too obvious or too subtle.

  7.  **Fleshing out the Content (Iterative refinement):**

      *   *Card List:* Need enough variety for 6 tables.
      *   *Scoring:* Let's use "Evidence Tokens" (poker chips or paper slips).
      *   *Facilitator Script:* Needs to be authoritative but neutral during the game.
      *   *Debrief:* This is where the philosophy lands. Connect the "Purple Card" frustration to the "Is-Ought" gap. Connect the "Definition" frustration to the "Naturalistic Fallacy."

  8.  **Anticipating Problems (The "Frank" Assessment):**

      *   *Vocabulary vs. Inference:* Students will argue about what "deteriorating" *means* clinically, missing the point that it's a value judgment. *Fix:* Facilitator must intervene to ask "Is that a measurement or a judgment?"
      *   *Cynicism:* They might treat it as just a game. *Fix:* Debrief must link back to real patient harm/liability.
      *   *Limitations:* A game simplifies. Real life has implicit norms everywhere. The game makes them explicit, which is artificial. I need to tell the user this.

  9.  **Structuring the Response:**

      *   **Title:** Clear and descriptive.
      *   **Materials:** Cards, Tokens, Timer.
      *   **Card Decks:** Detailed lists (Blue, Red, Purple).
      *   **Rules & Scoring:** Clear mechanics for the Trap and the Definition round.
      *   **Timeline:** Minute-by-minute.
      *   **Facilitator Script:** What to say when.
      *   **Debrief Guide:** Mapping game moments to philosophy.
      *   **Failure Modes & Limitations:** Honest assessment.

  10. **Refining the "Trap" Logic:**
      *   *Idea:* If a team plays a Purple card as Blue (Descriptive), they mark it secretly.
      *   *Audit:* Auditor checks the chain. If they find a Purple card masquerading as Blue, they flag it.
      *   *Payoff:* Successful smuggling = +3 points. Caught smuggling = -3 points (Team) + 3 points (Auditor). Honest play (using Red card for the jump) = +1 point.
      *   *Why:* This makes honesty "boring" but safe, and cheating "exciting" but risky.

  11. **Refining the "Definition" Logic:**
      *   *Challenge:* "I accept your definition, but is it *good*?"
      *   *Blocking Cheap Escapes:* If the defining team says "Safe means what the policy says," the opponent plays a "Role Card" penalty. If they say "Safe means no harm or acceptable harm," opponent plays "Circular Card" penalty.
      *   *Simplification:* Maybe just have the Facilitator judge the "Cheap Escapes" to save time, while students generate the Open Questions. *Decision:* Keep it peer-judged but with a "Facilitator Veto" rule for the specific logical fallacies mentioned in the prompt (disjuncts/role).

  12. **Final Review against Prompt:**
      *   24 students, 6 tables? Yes.
      *   No jargon until debrief? Yes.
      *   Trap cards included? Yes.
      *   Definition round with penalty for escapes? Yes.
      *   Card lists provided? Yes.
      *   Timeline included? Yes.
      *   Prediction of failure? Yes.

  13. **Writing the Content:** (Self-Correction during drafting: Ensure the clinical examples are realistic for 2nd-year nurses so they don't get bogged down in medical ignorance.) *Make sure the "Trap" cards sound very clinical.* "Patient is non-compliant" is a good one. "Vitals outside normal parameters" is another.

  14. **Final Polish:** Check tone. Professional, pedagogical, slightly provocative (to match the user's sophisticated request).

  *(Self-Correction on the Definition Round)*: The prompt asks for a mechanism to penalize cheap logical escapes *during* the round. I need a specific token or card for opponents to play if they spot a "Role-Occupying" or "Added-Disjunct" defense. Let's call them "Objection Tokens."

  *(Self-Correction on Timeline)*: 90 minutes is very tight for two rounds + debrief. I need to be ruthless with the timing. Round 1: 25 mins. Round 2: 20 mins. Debrief: 35 mins. Setup/Cleanup: 10 mins.

  Let's assemble.
answer: |-
  # Session Plan: "The Bridge Game" (Is-Ought Mechanics)

  **Target:** 24 Second-Year Nursing Students (6 Tables of 4)
  **Time:** 90 Minutes
  **Goal:** Experiential understanding of the Is-Ought gap and the Naturalistic Fallacy without initial jargon.
  **Materials:** Printed Card Decks (Blue, Red, Purple), Poker Chips/Tokens (3 colors), Timer, Whiteboard.

  ---

  ## 1. The Card Decks

  Print these on colored cardstock. Each table gets one **Case File** (containing the Target and a shuffled mix of Blue, Red, and Purple cards).

  ### The Case: "Night Shift 4B"
  **Target Card (Goal):** *"The Ward Manager ought to authorize overtime for two additional nurses tonight."*

  ### Blue Cards (Descriptive / "Is")
  *These are safe to play as premises. They contain measurements, counts, or direct observations.*
  1.  Current staff ratio is 1 nurse to 9 patients.
  2.  Policy states ideal ratio is 1 nurse to 6 patients.
  3.  Three patient call-bells went unanswered in the last hour.
  4.  Patient in Bed 4 has a BP of 88/50 mmHg.
  5.  Overtime costs $150 per hour per nurse.
  6.  The budget for this month is already exceeded by 5%.
  7.  Two nurses called in sick at 19:00.
  8.  Family members are currently advocating at the nurses' station.
  9.  Medication administration records show a 15-minute delay.
  10. The charge nurse has 12 years of experience.

  ### Red Cards (Normative Bridges / "Ought")
  *These are required to make the jump to the Target. They contain explicit values.*
  1.  Patient safety is more important than budget constraints.
  2.  Unanswered call-bells constitute a failure of care.
  3.  Budget deficits must not be exceeded under any circumstance.
  4.  Family distress should be minimized whenever possible.
  5.  Delays in medication over 10 minutes are unacceptable.
  6.  Staff well-being is a priority equal to patient outcomes.
  7.  Policy guidelines are mandatory, not optional.
  8.  Risk of harm must be reduced to the lowest possible level.

  ### Purple Cards (The Traps / "Thick Concepts")
  *These look like Blue cards but contain hidden values. **Mechanic:** If played as a Blue card (Descriptive), they are "Smuggled."*
  1.  Staffing levels are **suboptimal**.
  2.  Patient in Bed 4 is **deteriorating**.
  3.  The delay was **negligent**.
  4.  This is **standard nursing practice**.
  5.  The risk is **unacceptable**.
  6.  The family is being **unreasonable**.
  7.  Care provided was **appropriate**.
  8.  The patient is **non-compliant**.
  9.  Vitals are outside the **healthy range**.
  10. This is the **normal course** of recovery.

  ---

  ## 2. Scoring & Mechanics

  **Tokens:** Give each table 10 White Chips (Points).
  **Auditor:** In Round 1, Table 1 audits Table 2, Table 2 audits Table 3, etc. (Table 6 audits Table 1).

  ### Round 1: The Argument Chain
  *   **Task:** Build a chain from Blue Cards to the Target.
  *   **Rule:** You cannot place a Target card next to a Blue card. There must be a link.
  *   **The Smuggle:** You may play a **Purple Card** face-down as if it were a **Blue Card**.
      *   **If Undetected:** You gain **3 White Chips**. (The logic holds, the value is hidden).
      *   **If Caught by Auditor:** You lose **3 White Chips**. Auditor gains **3 White Chips**.
      *   **Honest Play:** If you use a **Red Card** to make the jump, you gain **1 White Chip**. (Safe, but low reward).
  *   **Time:** 20 Minutes build + 5 Minutes audit.

  ### Round 2: The Definition Trap
  *   **Task:** Table chooses one normative term used in Round 1 (e.g., "Safe," "Appropriate," "Harm"). They write a **Purely Descriptive Definition** for it.
      *   *Example:* " 'Safe' means no falls occurred."
  *   **Challenge:** Opposing tables (rotated) try to generate an **Open Question**.
      *   *Example:* "No falls occurred, but was it *Safe*?" (If the class agrees this is a valid question, the Defenders lose points).
  *   **Penalizing Cheap Escapes:** If Defenders try to save their definition using:
      1.  **Added Disjunct:** ("Safe means no falls OR acceptable falls.")
      2.  **Role-Occupying:** ("Safe means what the Charge Nurse says is safe.")
      *   The Challenger plays a **Black Token** (available to all). Defenders lose **2 White Chips**.
  *   **Time:** 15 Minutes build + 10 Minutes challenge.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Facilitator Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute Case Files, Chips, and Cards. **Do not explain the philosophy.** |
  | **05-10** | **Rules** | Read the "Rules & Mechanics" above. Emphasize: "Your goal is to justify the Target using the cards. Auditors are looking for breaks in the chain." |
  | **10-30** | **Round 1** | **Build.** Circulate. If asked "Can we use this card?", reply: "That's a strategic decision." |
  | **30-35** | **Audit** | **Swap.** Auditors visit assigned tables. They check every link. They flag Purple cards played as Blue. |
  | **35-40** | **Score 1** | Tally chips. Announce the table with the most "Successful Smuggles" (without shaming). |
  | **40-50** | **Round 2** | **Define.** Tables pick one term (e.g., "Deteriorating"). Write a definition using *only* measurable facts. |
  | **50-60** | **Challenge** | **Attack.** Tables swap definitions. Challengers ask: "X fits this definition, but is it really [Term]?" Defenders must not use Role/Disjunct escapes. |
  | **60-65** | **Score 2** | Tally final chips. |
  | **65-90** | **Debrief** | **The Reveal.** Connect game mechanics to Hume and Moore. (See Script Below). |

  ---

  ## 4. Facilitator Script & Moves

  ### Introduction (Minute 05)
  > "You are the Night Shift Management Team. You have data. You have a decision to make. Your goal is to build a logical chain from the data cards to the Decision Card.
  >
  > **Rule 1:** Every step must be licensed by a card.
  > **Rule 2:** An Auditor from another table will check your chain. If they find a break in logic, you lose points.
  > **Rule 3:** Some cards look like facts but act like values. It is up to you how you play them. It is up to the Auditor to catch you.
  >
  > You want to maximize your points. Go."

  ### During Play (Minute 15 & 45)
  *   **If a table argues about clinical accuracy:** "Assume the card is true for the sake of the game. The issue is whether it *licenses* the next step."
  *   **If a table asks about Purple cards:** "Read the rules on Smuggling. It's profitable, but risky."
  *   **If a table uses a Role-Occupying defense in Round 2:** "Check your Black Tokens. If that definition relies on *who* said it rather than *what* happened, play the token."

  ### The Debrief (Minute 65)
  *Do not start with definitions. Start with their frustration.*

  **Step 1: The Smuggle (The Is-Ought Gap)**
  > "Table 3, you lost points on the 'Suboptimal Staffing' card. Why?"
  > *(Students: "Because it's an opinion, not a fact.")*
  > "Exactly. It sounded like a fact. It felt like a fact. But the Auditor could ask: 'Staffing is 1:9, but is that suboptimal?' If you say yes, you've added a value judgment that wasn't in the numbers.
  >
  > **The Lesson:** You felt a gap between the numbers (Blue) and the decision (Target). To cross it, you needed a Bridge (Red). When you used a Purple card, you hid the bridge inside the fact. In practice, we do this constantly. We say 'The patient is deteriorating' as if it's a measurement. It isn't. It's a measurement *plus* a judgment that this direction is bad. Hume called this the **Is-Ought Gap**. You cannot get an 'Ought' from an 'Is' without a bridge."

  **Step 2: The Definition (The Naturalistic Fallacy)**
  > "In Round 2, Table 5 defined 'Safe' as 'No falls.' Table 2 challenged them: 'No falls occurred, but was it Safe?'
  >
  > Why was that a valid challenge?"
  > *(Students: "Because you could have no falls but the patient was in pain.")*
  > "Right. Any time you define a value word (Safe, Good, Right) using only descriptive words (Falls, Pain, Biology), I can always ask: 'I know it has [Description], but is it [Value]?'
  >
  > **The Lesson:** This is the **Naturalistic Fallacy** (G.E. Moore). You cannot define 'Good' (or 'Safe') purely by listing natural properties. If you could, the question would be nonsense. The fact that the question *makes sense* proves the definition failed."

  **Step 3: The Cheap Escapes (Logical Fallacies)**
  > "Some of you tried to save your definitions by saying 'Safe means what the Policy says' or 'Safe means no falls OR acceptable falls.'
  >
  > Why did we penalize that?"
  > *(Students: "Because it's circular." / "Because it dodges the question.")*
  > "Exactly. Appealing to authority (Role-Occupying) or adding 'or acceptable' (Added Disjunct) admits that the description wasn't enough. You had to sneak the value back in. In evidence-based practice, this is where we get into trouble. We hide our values behind 'Policy' or 'Standard of Care' so we don't have to own the ethical choice."

  **Step 4: Closing**
  > "Evidence-Based Practice is not just applying data to decisions. It is recognizing where the data stops and your professional judgment begins. The gap you felt today? That's where your license lives. Don't hide it in Purple cards."

  ---

  ## 5. Predictable Failure Modes & Mitigation

  **1. The "Vocabulary Argument" Degeneration**
  *   **Risk:** In Round 1, students will argue whether "deteriorating" is clinically descriptive. (e.g., "BP 88/50 *is* deteriorating!")
  *   **Why:** Nursing education trains them to treat clinical judgments as facts.
  *   **Mitigation:** As facilitator, intervene immediately. "For this game, treat 'BP 88/50' as the fact. 'Deteriorating' is the *interpretation* of that fact. If the Auditor can imagine a world where BP is 88/50 but the patient is *not* deteriorating (e.g., a trained athlete), the card is Purple."
  *   **Philosophical Point:** This *is* the point. They need to feel how deeply embedded the normativity is in their clinical language.

  **2. The "Cynical Gamer"**
  *   **Risk:** A table decides to just play all Purple cards as Blue, accept the penalty, and rack up points on other tables' failures.
  *   **Mitigation:** The scoring must make honesty competitive. Ensure the "Honest Play" (Red Card) points add up over the session. Also, publicly shame the "Caught Smugglers" during the debrief as "High Risk, Low Integrity" play.

  **3. Round 2 Stalemate**
  *   **Risk:** Challengers run out of Open Questions.
  *   **Mitigation:** Provide a "Cheat Sheet" for Challengers with prompts: "But is it *ethical*?", "But is it *kind*?", "But is it *sustainable*?"
  *   **Philosophical Point:** This shows the inexhaustibility of the Open Question.

  ---

  ## 6. Limitations of the Medium (Frank Assessment)

  **1. The "Missing Premiss" vs. "Unbridgeable Gap"**
  *   **Limitation:** The game implies the gap is a *mistake* (a missing Red card) that can be fixed. In reality, Hume suggests the gap is structural. You can't just "add" a value; you have to *own* it.
  *   **Your Fix:** In the debrief, emphasize that the Red Cards aren't "facts we forgot." They are *commitments*. The game makes them look like inventory items. You must clarify that values are not objects to be found, but stances to be taken.

  **2. Consensus vs. Truth**
  *   **Limitation:** Scoring relies on the Auditor's judgment. If the Auditor is weak, the "Trap" fails.
  *   **Your Fix:** You (the Facilitator) are the Supreme Court. If an Auditor misses a blatant Purple card, you can overrule during the scoring phase to preserve the lesson.

  **3. Clinical Reality**
  *   **Limitation:** In real nursing, "deteriorating" *is* treated as a fact for speed. Slowing down to find the value judgment every time is impractical.
  *   **Your Fix:** Acknowledge this. "In an emergency, you act on the thick concept. In policy, audit, and ethics, you must disentangle them. This game is for the boardroom, not the code blue."

  **4. The "Role-Occupying" Penalty**
  *   **Limitation:** Students may genuinely believe authority *does* define safety (e.g., "If the policy says it's safe, it is safe legally").
  *   **Your Fix:** Distinguish *Legal Safety* from *Moral Safety*. The game targets Moral Safety. "The policy might protect your license, but does it protect the patient? That's the Open Question."

  ---

  ## 7. Preparation Checklist

  1.  **Print Cards:** 6 sets of Blue/Red/Purple. (Laminate if possible for reuse).
  2.  **Tokens:** 100 White chips (Points), 20 Black chips (Objections).
  3.  **Room:** 6 Tables, clearly numbered.
  4.  **Board:** Write "Round 1: Build the Chain" and "Round 2: Define the Term" with timers visible.
  5.  **Handout:** A simple scorecard for Auditors (Checklist: Blue->Blue OK, Blue->Purple FLAG, Blue->Red OK).

  This design forces the students to *use* the fallacy to win, then *analyze* the fallacy to understand why it felt slippery. The "Trap" mechanic leverages their competitive drive to expose their own cognitive biases regarding clinical language.
