answer: |-
  **MODULE CODE: HIST70042 / STAT70042**
  **MODULE TITLE: QUANTIFYING THE LONG RUN**
  **ASSESSMENT: UNSEEN EXAMINATION PAPER**
  **TIME ALLOWED: 2 HOURS**

  **SECTION B**
  **Answer ONE question from this section. This question is worth 25 marks. Your answer should be approximately 1,500 words.**

  **Question 1**
  Consider a hypothetical quantitative study of a single agrarian polity spanning 700 years. The authors fit a structural-demographic model to the series and report three distinct peaks of sociopolitical instability. The intervals between these peaks are 180, 210, and 265 years respectively. The data indicate that elite numbers grew faster than total economic output across the entire 700-year stretch, including during stable centuries, not merely in the run-up to instability peaks. Furthermore, real wages rose rather than fell in the two decades preceding each instability peak. Finally, the state's fiscal position deteriorated only *after* the first recorded instances of elite mobilisation, rather than before them.

  Evaluate the implications of these empirical findings for Structural-Demographic Theory. In your answer, address whether a predictor that is active continuously can discriminate between periods of stability and instability, whether discarding the immiseration mechanism constitutes a legitimate refinement or an ad hoc rescue, and whether the observed periodicity warrants the label of a 'cycle'. Conclude by assessing what such a tightly bundled theory must risk given the limited number of independent historical cases available.

  ***

  **MODEL ANSWER**

  The hypothetical findings presented constitute a severe challenge to the mechanistic core of Structural-Demographic Theory (SDT), necessitating a distinction between the theory's diagnostic utility and its predictive validity. While the data may support the presence of structural stress, they fundamentally undermine the claim that such stress operates as a deterministic, endogenous clockwork mechanism. To accept these findings while retaining the theory requires such significant modification that the resulting framework risks losing the very explanatory power it claims to possess.

  The most immediate statistical objection concerns the periodicity. A cycle implies a regular recurrence driven by internal feedback loops with a characteristic frequency. Intervals of 180, 210, and 265 years exhibit a variance too high to sustain a claim of endogenous periodicity. In dynamical systems, such drift suggests that external shocks or contingent historical events are driving the timing, rather than the internal demographic parameters. If the 'cycle' length varies by nearly fifty percent, the label becomes metaphorical rather than mathematical. Consequently, the theory cannot claim to predict *when* a crisis will occur, only that structural conditions are ripe. This reduces SDT from a dynamical model to a static typology of vulnerability, which is useful for classification but fails to explain temporal sequencing.

  Regarding the mechanisms, the continuous growth of elite numbers relative to output presents a logical problem for discrimination. If elite overproduction is a necessary condition for instability, but is present during stable centuries as well as unstable ones, it loses its power as a predictor. It becomes a background condition rather than a trigger. A variable that is switched on constantly cannot explain episodic events without invoking an additional, unspecified trigger. This suggests that elite overproduction may be a ubiquitous feature of agrarian polities rather than a specific cause of their collapse. To retain it as a causal driver, one must argue that it interacts with other variables non-linearly, but the provided data offers no evidence of such interaction effects, only constant pressure.

  The behaviour of real wages strikes at the Malthusian heart of the theory. SDT posits that population pressure drives down real wages, leading to popular immiseration and unrest. The finding that wages rose before each peak contradicts this causal chain. It suggests that instability may be driven primarily by intra-elite conflict rather than popular rebellion fueled by starvation. While this preserves the 'elite overproduction' leg, it requires jettisoning the 'popular immiseration' leg. This is not merely a refinement; it changes the nature of the revolution from a social upheaval to a civil war. If the theory is modified to exclude popular welfare, it can no longer claim to explain broad sociopolitical instability, only elite factionalism. This looks less like a legitimate refinement and more like an ad hoc rescue to save the model from falsification by inconvenient data.

  The sequencing of fiscal crisis and elite mobilisation further reverses the proposed causal arrow. SDT argues that state fiscal incapacity precedes instability, preventing the state from suppressing dissent or co-opting elites. If fiscal deterioration follows mobilisation, it is a consequence of instability, not a cause. This implies that states collapse because they are attacked, not that they are attacked because they are bankrupt. This undermines the feedback loop where fiscal crisis accelerates instability. Instead, instability creates fiscal crisis. This reversal suggests the model has misidentified symptoms for causes, a common error in retrospective modelling where correlation is mistaken for causation.

  Finally, one must consider the epistemological risk. SDT is a tightly bundled theory; its components are designed to work in concert. When empirical evidence contradicts the timing, the wage mechanism, and the fiscal sequencing, retaining the label of 'secular cycle' requires stretching the definition until it becomes unfalsifiable. Given the small number of independent secular cycles in the historical record, the theory cannot rely on large-N validation to overcome these mechanistic failures. If every contradiction is explained away as a contingent variation or a measurement error, the theory becomes immune to evidence. A robust theory must risk being wrong. In this case, the theory risks becoming a post-hoc narrative that fits any data by adjusting the parameters of what counts as a cycle or a cause.

  In conclusion, these findings suggest that while structural-demographic factors may create conditions conducive to instability, they do not determine its timing or specific mechanism. The theory should be revised to acknowledge that elite competition is a constant background risk, while the triggering of instability depends on contingent events not captured by the model. To claim otherwise is to prioritise model elegance over empirical fidelity.

  ***

  **MARKSCHEME**

  1.  **Periodicity Critique (5 marks):** Awards marks for identifying that 180–265 year variance is too high for an endogenous cycle and arguing this reduces the model to a static typology; loses marks if the student accepts the variance as normal noise without questioning the 'cycle' label.
  2.  **Predictor Discrimination (5 marks):** Awards marks for arguing that continuous elite overproduction cannot explain episodic instability without an additional trigger variable; loses marks if the student asserts elite growth alone is sufficient to explain the timing of peaks.
  3.  **Mechanism Validity (5 marks):** Awards marks for recognising that rising wages contradict the immiseration thesis and that removing it changes the theory from social upheaval to elite civil war; loses marks if the student dismisses wage data as irrelevant to the core model.
  4.  **Causal Sequencing (5 marks):** Awards marks for noting that fiscal crisis following mobilisation reverses the causal arrow from cause to consequence; loses marks if the student treats the temporal lag as simultaneous enough to sustain the original causal claim.
  5.  **Epistemological Risk (5 marks):** Awards marks for concluding that modifying the theory to fit these contradictions risks unfalsifiability given the small sample size of historical cycles; loses marks if the student concludes the theory is either completely vindicated or entirely worthless without nuance.
