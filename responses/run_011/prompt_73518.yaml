prompt: |-
  I'm teaching Flowers for Algernon in a philosophy of mind seminar alongside the four-tier taxonomy of minds -- Darwinian, Skinnerian, Popperian, Gregorian -- and I want a piece of criticism I can hand the students, not a plot summary or a restatement of the taxonomy. Set the tiers out by the selection process each adds (genes, reinforcement, internal trial and error in which hypotheses die instead of the creature, and the importation of culturally supplied mind-tools), then read the book against them.

  Please structure your answer in these sections, in this order:

  **Placing Charlie** (about 250 words). Which tier he occupies before the operation, during the ascent, at his peak, and in the decline -- and whether the decline is a Popperian creature losing his Gregorian tools, or tools being withdrawn from a chassis that was never more than Skinnerian.

  **What the book gets right** (about 300 words). Take the maze races against Algernon, the demonstration at the conference, and Charlie's own eventual formulation of the flaw that will undo both of them. Is Charlie's discovery the taxonomy's central claim enacted -- a creature whose hypotheses can die in his stead, aimed at himself?

  **Where the ladder has no rung** (about 300 words). Gregorian status looks like it requires scaffolding Charlie lacks: teachers, an audience, a community that keeps the tools in circulation. So was his intelligence ever properly his? Say whether this forces a fifth category, or whether the taxonomy can absorb it as part of what a mind-tool is.

  **Algernon** (about 150 words). Whether the mouse is a Skinnerian creature driven past its ceiling or a case the taxonomy cannot classify at all -- and whether the same diagnosis covers Charlie, or whether the difference between them is exactly what the tiers are supposed to track.

  **The moral of the ladder** (about 150 words). The book insists Charlie deserves the same regard at both ends of the curve. Does that refute ranking minds by tier, or only the social use to which such a ranking gets put?

  Paraphrase scenes rather than quoting the text, and say where you're unsure of a detail. Roughly 1,150 words in total.
