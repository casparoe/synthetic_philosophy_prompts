  **The letter and the gossip**
  You claim both cases are painful, free, about a fixed past, and change no actions. If that description is true, your verdicts must match. You defend the difference with "self-respect" versus "healing," but this is post-hoc dressing. In the letter case, you prioritize peace; in the gossip case, you prioritize social vigilance. But if you truly cannot act on the gossip, vigilance is useless performance. Knowing someone spoke ill of you, while being powerless to address it, is pure hedonic loss. The feeling that refusing the gossip is "hiding" is a social signal, not a rational calculation. It relies on an audience to judge you, whereas rationality is internal. To be consistent with your verdict on the ex's letter, you must admit that refusing the gossip is also rational. Self-respect does not require consuming pain that serves no function. Drop the gossip verdict; protect your peace in both cases. "Betrayal" in the mom case is legitimate constitutive work; "hiding" in the gossip case is ego.

  **Three new cases**
  1.  **The Spoiler:** A friend knows the ending of the mystery novel you're reading. They promise it's satisfying. Do you ask?
      *   *Verdict:* Don't Look.
      *   *Reasoning:* Hedonic/Fragility. Ruins the experience (utility) without changing the ending (world state).
  2.  **The Smoke Alarm:** You hear a faint beep in the wall. It might be dying battery, might be fire. You can't check tonight.
      *   *Verdict:* Look (Investigate immediately).
      *   *Reasoning:* Instrumental value dominates. High stakes (fire) vs low cost of checking. Anxiety cost of not knowing is too high.
  3.  **The Loyalty Test:** A machine tells you if your spouse *would* cheat if offered $1M tomorrow. You can never tell them you know.
      *   *Verdict:* Don't Look.
      *   *Reasoning:* Constitutive/Hedonic. Knowing destroys the relationship's foundation (trust) without allowing action (can't confront). It turns a partner into a suspect permanently.

  **What I should say to Nadia**
  "You're right about the math for an ideal agent, but wrong about the anthropology. Good's Theorem assumes a processor that doesn't glitch when fed bad news and values only external outcomes. My cases show that information can break the processor (panic, creative block) or violate values that aren't outcomes (privacy, relationship norms). Concede that for humans, information has a cost beyond privacy, and utility includes peace of mind. You win the theory; I win the practice. The theorem describes a god, not a cook."
