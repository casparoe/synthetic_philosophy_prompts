      *(Self-Correction on Tone)*: Ensure I'm not just saying "forecasting is better." I need to say "forecasting changes the question."

      *(Refining the Verdict)*: The prompt asks for a specific format: "Verdict: [sentence]". And if neither, say what it is.

      *(Final Polish)*: Check the "attack" instruction. I need to be forceful about where the two-number bookkeeping fails to address the philosophical anxiety. The anxiety is about *agency*, not just output quality.

