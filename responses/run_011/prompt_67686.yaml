      *   *Piece 1:* HOE = Meta-model input. Clean translation.
      *   *Piece 2:* Conciliationism = Ensemble weighting. Distortion: "Peer" vs. "Weighted Contributor."
      *   *Piece 3:* Akrasia = Calibration mismatch. Distortion: Normative force. Forecasting allows "model says X, meta-model says low confidence." Philosophy asks "What do *you* believe?"
      *   *Piece 4:* Drug cases = Adversarial input/Model invalidation. Distortion: Infinite regress. If the meta-model is also drugged?
