prompt: |-
  Write me a short story, maybe 1200 words, that actually dramatizes the Rietdijk–Putnam argument for the block universe instead of just name-checking it. Setup I have in mind: a long-haul cargo ship and a relay buoy pass each other at a decent fraction of c, and the two crews are in a contract dispute. The ship's log carries a "settled" flag on events, and the company's legal desk defined settled as "on your own simultaneity slice," which nobody thought through very carefully. What's in dispute is some hearing back on Earth, and each side is convinced the other is trying to weasel out.

  I want the bones of the argument visible in the dialogue: both of them have an equally good claim about which distant events are already real, and all the force comes from sliding between "real for me now" and "real, full stop." So have one character make that slide out loud and another push back on it — something like, co-reality isn't transitive or observer-independant, you can't just chain two tilted slices together and call the result what exists. No time machines, nobody sees or messages the future, no twin-paradox business; I want the metaphysics, not the fireworks. And please get the direction right: whether a given far-off event lands in your now or in your past depends on whether it lies ahead of or behind your direction of motion. That's the bit everybody botches.

  Finally, give one of them a reason to care beyond the contract — a parent going into surgery back home, say — so the ending can leave the question genuinely open but still make it cost something.
