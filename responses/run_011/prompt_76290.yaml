answer: |-
  The comms channel crackled with the Doppler shriek of the pass. Outside the *Acheron's* bridge, the relay buoy *Station-9* streaked by, a blur of silver against the starfield, moving at 0.8c relative to the cargo hauler. They were coincident for only a microsecond, but the data handshake had to hold.

  Captain Elara Vance kept her eyes on the telemetry. "Confirm receipt, Station. The hearing outcome is flagged 'Settled' in our log."

  Adjuster Kael's voice came back thin, stretched by the protocol overhead. "Denied, Captain. In our frame, the Earth Tribunal convenes tomorrow. You can't flag a future event as settled."

  "Clause 14-B," Elara said, her voice steady. "Definition of 'Settled': An event existing on the observer's current simultaneity slice. We are moving toward Earth, Adjuster. Our slice tilts into your future. The hearing is yesterday for us."

  "That's a coordinate artifact, Elara. Not ontology."

  "The contract doesn't specify ontology. It specifies slices."

  Kael sighed, the sound digitized into a harsh static burst. "You're trying to trigger the hazard bonus based on a ruling that hasn't happened yet. If the Tribunal votes against you tomorrow, you're claiming pay for a dispute that doesn't exist."

  "The dispute exists," Elara said. "The outcome exists. That's the point."

  She wasn't just talking about the credits. Three light-years ahead, in the direction of their vector, Earth hung in the dark. Her mother was in surgery at Johns Hopkins. Appendiceal complications, routine but risky. In the buoy's frame—roughly synchronized with Earth—the surgery was scheduled for 0800 tomorrow. On the *Acheron*, crossing the buoy at this velocity, the math was unforgiving. Their plane of simultaneity swept through Earth's timeline nearly fifteen hours ahead of the buoy's.

  For Elara, the surgery was over.

  "You're making the slide," Kael said. "I can hear it. You're moving from 'real for me' to 'real, full stop.' You think because your clock says it's done, the universe has signed off on it."

  "I think the universe is a block, Kael. You know the physics. If my 'now' includes your 'tomorrow,' then your tomorrow is just as real as my today. There's no privileged present. If the outcome is real for me, it's fixed."

  "Co-reality isn't transitive," Kael snapped. "You can't chain two tilted slices together and call the result truth. Just because an event is simultaneous with your passing doesn't mean it's causally sealed. It just means you've drawn a line through spacetime that intersects it."

  "And what is a line through spacetime if not what exists?" Elara leaned forward. "If I can point to it and say 'that is happening,' then it *is*. You're arguing for a magical 'now' that rides along with Earth, but relativity killed that. There is no universal now. There is only here, and there, and the angle of motion."

  "There's causal contact," Kael countered. "That's the only 'now' that matters for contracts. Information flow. Until the light reaches you, it's not settled. It's probabilistic."

  "Probabilistic for who?" Elara's hand hovered over the console. The telemetry showed the distance to Earth shrinking, but the light lag remained absolute. She wouldn't know the outcome for three years. But the contract clause was a trap the lawyers had built without understanding the geometry. They thought 'simultaneity' meant 'what we know.' They didn't realize that at relativistic speeds, 'what we know' and 'what is' diverge.

  "For everyone who matters," Kael said. "Look, Elara. I know about your mother."

  The bridge went quiet, save for the hum of the containment fields.

  "This isn't about the bonus," Kael continued, softer now. "You want me to validate the Block. You want me to say 'Yes, Captain, the surgery is done, the result is written,' so you don't have to sit with the uncertainty."

  "I want the contract honored."

  "You want certainty. But you're trying to derive metaphysics from a loophole. Just because your slice cuts through Earth's future doesn't mean the future is determined. It just means your definition of 'now' is aggressive."

  "It's not aggressive, it's geometric." Elara tapped the screen. "Rietdijk–Putnam. If I am real, and you are real, and we disagree on what is present, then all times must be equally real. Otherwise, whose reality gets vetoed? Yours? Why is the buoy's frame privileged over the ship's?"

  "Because the buoy is stationary relative to the contract issuer!" Kael's patience frayed. "Earth time governs Earth law. You're trying to use time dilation to legislate fate."

  "I'm using it to read the log," Elara said. "The log says settled. The physics says the event is on my slice. If you deny the slice, you deny the relativity principle. You say my frame is wrong."

  "Your frame is valid, but your inference is garbage. 'Real for me' does not equal 'Fixed for all.' You can't look at a tilted slice and claim you've seen the whole loaf."

  "Why not?" Elara whispered. "If the loaf exists, the slice is part of it."

  "If the loaf exists, then yes. But that's the assumption, Elara. That's the block universe hypothesis. It's not proven. It's a interpretation. You're betting your sanity on Eternalism because a contract lawyer was sloppy with definitions."

  Elara looked out the viewport. The buoy was gone, receding into the dark behind them. They were alone again, rushing toward the solar system.

  In her frame, the surgery was complete. Her mother was either in recovery or she wasn't. The state vector had collapsed. In Kael's frame, the scalpel hadn't touched skin yet.

  If Kael was right, the future was open. Her mother's survival was a probability wave, not a fact. There was hope, genuinely new hope, that hadn't been written yet.

  If Elara was right, if the geometry held the metaphysical weight she needed it to, then it was already done. The grief or the relief was already sitting there, three light-years away, waiting for the light to catch up.

  "Adjuster," Elara said. "Flag the contract dispute as 'Pending Metaphysical Review.' Don't void the log."

  "Accepted," Kael said. "Elara... don't let the geometry eat you. Just because you can calculate the time doesn't mean you own the moment."

  "Copy that."

  She cut the channel.

  The bridge was silent. The stars ahead were blue-shifted, harsh and bright. She had the math. She knew exactly where her simultaneity slice intersected Earth. She knew that, by the strict definition of her own motion, the event was in her past.

  But she also knew that no signal could reach her. She was trapped in the light cone of her own ignorance.

  Elara closed her eyes. She could choose the Block. She could tell herself it was already decided, that the uncertainty was an illusion of her limited speed. It would be easier, in a way. To know it was fixed.

  Or she could listen to Kael. She could accept that 'real' required connection, that until the light arrived, the universe was still writing the sentence.

  She looked at the log entry. **STATUS: SETTLED.**

  She highlighted the word. Her finger hovered over the delete key.

  If she deleted it, she admitted the future was open. If she left it, she admitted the future was dead.

  The ship droned on, carrying her toward the answer she couldn't have. Elara left the cursor blinking. She let the question hang in the dark, unanswerable, costing her everything either way.
