answer: |-
  **MEMORANDUM**

  **TO:** Dissertation Prize Jury
  **FROM:** Chair
  **DATE:** 14 October 2023
  **SUBJECT:** Procedure for Final Deliberation

  Colleagues,

  Ahead of Friday's meeting, I wish to propose a definitive procedure for our final vote. We face a genuine dilemma: one candidate has produced the philosophically superior work, while the other stands to gain significantly more from the award's material and reputational benefits. We have heard two compelling positions: that we must judge the text alone, or that we should judge the consequences of the award.

  Before settling on a method, I want to place on record the strength of the case for awarding the prize based on need. The argument is that a prize is a tool, and tools should be used where they are most effective. Denying a funded year of research to a candidate with no prospects, in favour of one who is already secure, may maximise technical merit but minimises human good. If the department is a community, not merely a judging panel, we have a duty of care that supersedes abstract metrics. To ignore this is to risk making our standards complicit in precarity.

  However, I recommend that we adopt a **Lexical Priority** procedure. We must first determine which dissertation is 'most outstanding' on its philosophical merits. Only if we find the quality of the two submissions to be effectively indistinguishable should we admit secondary considerations regarding the candidates' career prospects or the utility of the funds.

  This approach keeps the question of *quality* apart from the question of *good consequences* by sequencing them. Quality is the gatekeeper; impact is the tie-breaker. Since we have already noted that one dissertation is clearly the stronger piece of philosophy, this procedure dictates that we award the prize to the stronger work.

  My reasons for this recommendation are threefold. First, the terms of the prize bind us. The award promises to recognise excellence, not to administer welfare. To repurpose it without changing the statutes is to deceive the donor, the department, and future candidates. Second, the long-term value of the prize depends on its integrity. If it becomes known that the award is influenced by need, its prestige as a mark of excellence diminishes, ultimately reducing its value to *all* future winners, including those from disadvantaged backgrounds. Third, fairness requires that candidates be judged on what they have submitted, not on circumstances outside the text.

  I propose we vote first on the relative merit of the texts. If we agree one is superior, our deliberation ends there. If we cannot agree, we may then consider the broader context. I hope this allows us to honour both our mandate and our conscience, while ensuring our decision is defensible to the wider university.

  Please come prepared to confirm this procedure on Friday.
