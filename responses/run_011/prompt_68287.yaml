      *   *Objection 7 (Dennettian):* Even if you find a difference, why call it "Orwellian/Stalinesque"? You've redefined the terms so much they lose their original philosophical punch.
      *   *Objection 8 (General/Grad):* Is this just a verbal dispute about the word "experience"?

      *Refining for Idiom:*
      *   Dennettians need to sound like they care about heterophenomenology and functionalism.
      *   Vision Scientists need to talk about signal-to-noise, latency, and paradigms.
      *   Comp Neuro needs to talk about priors, latency compensation, and architecture.
      *   Phenomenologist needs to talk about lived time, retention, protention.

      *Ranking:*
