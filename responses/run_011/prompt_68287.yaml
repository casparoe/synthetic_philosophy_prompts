      8.  Grad Student: Verbal Dispute (General).

      *Wait, the prompt asks for "roughly eight objections."* I will stick to 8.

      *Pre-emptive:* Acknowledge the motor task isn't a "God's eye view."
      *Killer Reply:* The causal role argument.
      *Feared Question:* "Does the hand know the colour before the brain does?" (Disembodiment/Localization issue). Or better: "If the motor system has the content, is there *experience* there?" (Hard Problem). Let's go with the Hard Problem/Experience location question.

  7.  **Final Review against constraints:**
