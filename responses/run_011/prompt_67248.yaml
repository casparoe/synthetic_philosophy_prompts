  ### The Predicted Verdict
  Your friend will say the turtle's state is **about the ocean**, and the hatchling is **getting it wrong**. Furthermore, he will classify this intentionality as **non-derived** (original).

  **Why?**
  If he says the turtle is *about brightness*, the turtle is never wrong (the lot is bright). That reduces the turtle to a thermostat (tracking correlation), which he explicitly denies has beliefs or meaning. To maintain consistency with the Labrador (which has non-derived beliefs that can be false), he must grant the turtle representational content that *can* misfire. Since the turtle is an animal and not an artifact, that content must be non-derived.

  ### The Three Rules
  Based on his track record, here are the three principles governing his ontology of mind:

  1.  **The Artifact Principle:** Any system whose function is assigned by human design (atlases, smoke alarms, chess programs) possesses only **derived** intentionality. It borrows meaning from the designer.
  2.  **The Mechanism Principle:** Any system that operates via pure causal correlation without agency (molecules, thermostats, antibodies) possesses **no** intentionality. Tracking is not meaning.
  3.  **The Organism Principle:** Evolved animals with nervous systems (labradors) possess **non-derived** intentionality. Their states are genuinely *about* things, allowing for genuine error (misrepresentation), not just malfunction.

  ### Application to the Turtle
  Here is how each rule presses on the hatchling:

  *   **Rule 1 (Artifact):** The turtle is not built by humans. **Verdict:** Non-derived.
  *   **Rule 2 (Mechanism):** The turtle is not a simple causal switch; it is an agent navigating a world. **Verdict:** Has intentionality (not just tracking).
  *   **Rule 3 (Organism):** The turtle is an animal. **Verdict:** Capable of error regarding its goals (the ocean).

  **The Tension:** The turtle is the boundary case. Physiologically, it looks like a thermostat (phototaxis). Biographically, it looks like the Labrador (an animal seeking a goal). Your friend's rules underdetermine the turtle because he hasn't defined the complexity threshold where "Mechanism" stops and "Organism" begins. However, to avoid arbitrary speciesism, he is forced to side with the Labrador.

  ### The Wedge Case: The Genetically Engineered Moth
  To force these rules apart, present him with this case:

  **A moth genetically engineered in a lab to seek LED light instead of the moon.**
  We splice its genome so its phototaxis circuit targets 500nm wavelengths (LEDs) rather than the moon's spectrum. It flies into the porch light and dies.

  **Why this breaks the system:**
  This case creates a direct collision between **Rule 1 (Artifact)** and **Rule 3 (Organism)**.

  *   **According to Rule 1:** It was designed by humans. Its "goal" is imposed by engineers. Therefore, its intentionality is **derived** (like the smoke alarm).
  *   **According to Rule 3:** It is a living animal with a nervous system. It acts on its own biological impulses. Therefore, its intentionality is **non-derived** (like the labrador).

  **The Forced Choice:**
  He cannot have it both ways.
  1.  If he says the moth's intentionality is **derived**, he admits that being an "animal" is not sufficient for original intentionality; human intervention strips the "soul" from the system. This threatens the status of domesticated animals or animals raised in captivity.
  2.  If he says the moth's intentionality is **non-derived**, he admits that **human design does not automatically confer derived intentionality.**

  **The Rule to Sacrifice:**
  To settle it, he must give up **Rule 1 (The Artifact Principle)** in its current form.
  He would have to concede that "Human Design" is not the source of derived intentionality. A smoke alarm is derived not because a human built it, but because it lacks *functional autonomy* or *evolutionary history of selection*. If the engineered moth has non-derived intentionality, then the smoke alarm's derived status must come from its inability to adapt or its lack of teleological history, not merely the fact that a human touched it. This forces him to deepen his theory from "Who built it?" to "What kind of causal history sustains it?"—which is exactly where the real philosophy begins.
