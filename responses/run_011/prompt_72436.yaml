answer: |-
  **The paradigm**
  Subjects sit in a dimly lit room with head stabilized by a chin rest, 60cm from a 144Hz monitor. High-speed eye tracking samples at 1000Hz. Each trial begins with a central fixation cross (500ms). Stimulus 1 (S1) is a 2° colored disk (Red or Green) at 10° eccentricity, duration 50ms. Stimulus 2 (S2) is a different-colored disk at the identical location, onset 100ms after S1 offset, duration 50ms. Subjects are trained on a strict sensorimotor mapping: Red requires a saccade to a left target box, Green to a right target box. Instruction emphasizes speed: "Move your eyes immediately upon seeing the first flash; do not wait to be sure." After landing, the subject verbally reports the color of S1. Valid trials require saccade initiation between 150ms and 250ms post-S1 onset. Trials outside this window are discarded as anticipatory or deliberative. The design forces the oculomotor system to commit based on early sensory processing, while the verbal report relies on slower memory consolidation.

  **Stalinesque prediction**
  On the Stalinesque model, conscious experience is the final edited draft. The brain receives S1 and S2, reconciles them into a single coherent narrative (favoring S2 due to recency or masking), and *then* broadcasts this content to conscious systems. Since both the saccade and the verbal report are voluntary actions requiring conscious identification, they both draw from this single reconciled pool. Consequently, the saccade target and the verbal report will match on every valid trial. If the brain decides the experience was "Green," the eyes go Right and the voice says "Green." There is no opportunity for the motor system to access a pre-reconciliation state because no such state is ever made available to the systems governing voluntary action. The editing is complete before the "light" of consciousness turns on.

  **Orwellian prediction**
  On the Orwellian model, S1 generates a genuine conscious experience before S2 arrives. The oculomotor system, having a lower latency threshold (~200ms), accesses this initial veridical experience and programs a saccade accordingly (e.g., Left for Red). However, the memory consolidation process required for verbal report takes longer (~300ms+). During this gap, the subsequent S2 input triggers a post-experiential rewrite of the memory trace. The subject consciously saw Red (driving the eyes) but later remembers Green (driving the voice). We expect a significant dissociation: saccades targeting Left paired with verbal reports of "Green." The divergence point is the consolidation window; the eyes commit before the rewrite, the voice speaks after. The behavioral mismatch is the signature of the rewrite.

  **The hinge**
  The hinge is the latency differential between the oculomotor commitment channel and the verbal-memory channel. The Orwellian model treats consciousness as a timestamped event that occurs early enough to drive fast reflexes but is susceptible to later memory alteration. The Stalinesque model treats consciousness as a late-stage output buffer where editing is complete before any voluntary action is authorized. The experiment exploits the 100ms window where the eye can move but the memory trace is still labile. If the eye moves on unedited data, the Orwellian story gains empirical traction; if the eye waits for edited data, the Stalinesque story holds. The leaky channel is the superior colliculus pathway driving the saccade before cortical consolidation finishes.

  **Dennett's reply**
  Dennett would argue this design smuggles in a Cartesian Theater. By treating the saccade as a report of "true consciousness" and the voice as a report of "edited memory," you assume a single stream of experience that exists independently of its effects. For a Multiple Drafts theorist, the saccade *is* a form of reporting. If the saccade says "Red" and the voice says "Green," there isn't a fact about what was *really* experienced; there are just two competing drafts influencing different effectors. The "Orwellian" label implies a privileged moment of truth that was falsified, but the data only shows fragmentation. You haven't found a pre-conscious edit; you've found that different neural pathways have different integration times. The experiment measures latency, not the location of consciousness, because consciousness isn't located anywhere. It begs the question by assuming a finish line where there is only a race.

  **Kill switch**
  To collapse this back into indistinguishability, you must remove the latency advantage. If the saccade task requires deliberation rather than reflexive mapping, its latency increases to match the verbal report. Once both outputs draw from the same temporal window of consolidation, the dissociation vanishes. Equalizing the decision threshold for eyes and voice ensures both channels access the same final draft, restoring the Stalinesque/Orwellian merger. If the subject is told to "be accurate" rather than "be fast," the Orwellian gap closes.

  **Would it run?**
  Executable but noisy. Saccade latency varies wildly (150–300ms) across trials and subjects. Many trials would be discarded for being too slow (losing the Orwellian window) or anticipatory. Training could reduce variance, but fatigue would increase it. Eye tracker drift and verbal transcription errors add noise. However, with adaptive timing (adjusting S2 onset based on individual saccade latency), you could isolate the window. It's physically runnable, but statistical power would require hundreds of trials per subject to detect the dissociation signal against motor variance. It is a conceivable experiment, but the signal-to-noise ratio is the enemy.
