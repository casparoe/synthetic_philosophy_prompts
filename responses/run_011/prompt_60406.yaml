answer: |-
  This is a high-stakes modeling problem. You are effectively being asked to encode a normative ethical engine, not just a physics engine. The friction you are feeling is the gap between *moral ontology* (what makes someone liable in truth) and *operational epistemology* (what a soldier or algorithm can know in the fog of war).

  Below is the specification you asked for. It treats Just War Theory not as a history of ideas, but as a system with conflicting constraints.

  ### Part 1: The Desiderata (Acceptance Criteria)

  I have categorized these by domain. Each item is marked **NN** (Non-Negotiable for *any* viable theory) or **CP** (Camp Preference — a value held by one side that the other sacrifices).

  #### A. Moral Ontology (The "Truth" Condition)
  *These define what liability actually **is**, regardless of whether we can detect it.*

  1.  **The Responsibility Constraint (NN):** Liability to attack must correlate with some form of moral responsibility for an unjust threat. A theory that declares a person liable to be killed when they are morally innocent (e.g., acting in unavoidable self-defense or under duress without knowledge) fails this.
      *   *Consideration:* If a soldier is forcibly conscripted, drugged, and lied to, intuition says killing them is tragic, not "justice."
  2.  **The Threat Constraint (NN):** Liability requires the capacity to harm. A person who poses zero causal threat to anyone cannot be liable to defensive attack, regardless of their uniform or intentions.
      *   *Consideration:* This targets the "Cook" case. If they are in a bunker cooking stew, they are not a threat *now*.
  3.  **The Liability/Permission Distinction (NN):** The theory must separate *being liable* (losing your right not to be harmed) from *it being permissible to harm you* (all-things-considered).
      *   *Consideration:* A sniper may be liable to be killed, but if killing him triggers a nuclear escalation, it is impermissible to kill him. Your module must output `is_targetable` (liability) distinct from `engage_order` (permission).
  4.  **The Causal Contribution Threshold (CP - Revisionist):** Liability should track the *degree* of causal contribution to harm.
      *   *Consideration:* This is where your "Civilian Dev" case lives. Revisionists argue high causal responsibility creates liability; Traditionalists argue civilian status creates immunity regardless of code.
  5.  **The Moral Equality of Combatants (CP - Traditionalist):** Soldiers fighting for a just cause and soldiers fighting for an unjust cause possess the same moral status regarding *jus in bello* (conduct in war).
      *   *Consideration:* This is the core symmetry claim. Traditionalists say this is NN; Revisionists say it is morally false.

  #### B. Institutional & Legal Fit (The "Compliance" Condition)
  *These define whether the theory can run on the hardware of international law and military structure.*

  6.  **Status-Based Identification (NN):** The criterion for liability must be identifiable via public, observable status (uniform, carrying arms) rather than hidden mental states or classified strategic knowledge.
      *   *Consideration:* International Humanitarian Law (IHL) relies on this. If liability depends on "is this war just?", the law collapses.
  7.  **Reciprocal Stability (NN):** The theory must incentivize both sides to follow the rules. If one side adopts a theory that makes the other side's soldiers "murderers" liable to execution, the other side will stop following the rules.
      *   *Consideration:* This is a game-theory constraint. If Revisionism is adopted publicly, aggressor states will torture POWs because "your soldiers are criminals."
  8.  **The Sovereign Prerogative (CP - Traditionalist):** The state, not the individual soldier, bears the responsibility for the justice of the war (*jus ad bellum*). The soldier is an instrument.
      *   *Consideration:* This absolves the conscript. Revisionists reject this; they say individuals bear moral responsibility even if acting for the state.

  #### C. Epistemic & Operational Feasibility (The "Runtime" Condition)
  *These define whether a human or AI can actually execute the logic under uncertainty.*

  9.  **Epistemic Accessibility (NN):** The data required to determine liability must be available to the agent at the time of decision, under conditions of fog, friction, and deception.
      *   *Consideration:* A soldier cannot know if their President lied about WMDs. A theory requiring that knowledge is operationally null.
  10. **Latency Tolerance (NN):** The decision procedure must be computable in real-time.
      *   *Consideration:* If determining liability requires a tribunal-style investigation into the enemy soldier's conscription status, the system is too slow for combat.
  11. **False Positive Minimization (NN):** The decision procedure must prioritize avoiding the killing of non-liable persons over ensuring the killing of liable persons.
      *   *Consideration:* In software terms, this is prioritizing precision over recall. It is worse to kill a civilian (false positive) than to let a combatant escape (false negative).

  ---

  ### Part 2: Criterion vs. Decision Procedure (The Conflation Trap)

  You are correct: most debates are category errors.

  *   **The Criterion:** The metaphysical fact of the matter. (e.g., "Is this person *actually* morally liable?")
  *   **The Decision Procedure:** The heuristic used by the agent. (e.g., "Shoot anyone in that uniform.")

  **Where the camps conflate them:**
  *   **Traditionalists** often argue that because the *Decision Procedure* must be symmetric (for safety), the *Criterion* must be symmetric. This is a mistake. You can have an asymmetric truth handled by symmetric rules.
  *   **Revisionists** often argue that because the *Criterion* is asymmetric (only unjust soldiers are liable), the *Decision Procedure* must be asymmetric (soldiers must check if the enemy is unjust). This is operationally impossible.

  **The Fix:** A viable theory usually adopts a **Two-Level Architecture**:
  1.  **Deep Layer (Criterion):** Revisionist. Liability tracks moral responsibility. (Satisfies Moral Ontology).
  2.  **Surface Layer (Procedure):** Traditionalist. Liability tracks uniform/status. (Satisfies Institutional/Epistemic constraints).

  **Is this a patch?** Yes. It admits that the "rules of war" are a useful fiction that sometimes permits killing people who are, at the deep level, not morally liable (e.g., the just conscript killing the unjust conscript). It creates a "moral remainder" — a regret that the system requires.

  ---

  ### Part 3: Incompatibility Analysis

  You suspected a tension between **Symmetry** and **Responsibility**. You are right, but it is deeper than that.

  **The Impossible Triangle:**
  You cannot jointly satisfy these three Non-Negotiables:
  1.  **Moral Responsibility:** Liability tracks individual moral guilt.
  2.  **Epistemic Accessibility:** Soldiers can know who is liable without classified intel.
  3.  **Symmetry:** Soldiers on both sides have equal rights/risks.

  *   If you keep **Responsibility** and **Symmetry**, you fail **Epistemics** (Soldiers can't know who is morally guilty).
  *   If you keep **Epistemics** and **Symmetry**, you fail **Responsibility** (You must treat innocent aggressors as liable).
  *   If you keep **Responsibility** and **Epistemics**, you fail **Symmetry** (Only the unjust side is targetable, which creates the "Contingent Pacifism" problem).

  **The Trade-off:**
  Every working system sacrifices **Moral Responsibility** at the operational level to preserve **Epistemic Accessibility** and **Symmetry**. This is why the law protects the "Aggressor Conscript." It is a pragmatic sacrifice of moral truth for systemic stability.

  ---

  ### Part 4: Case Testing

  Here is how the criteria apply to your four edge cases.

  | Case | Traditional View (Symmetry) | Revisionist View (Responsibility) | The Conflict |
  | :--- | :--- | :--- | :--- |
  | **1. Aggressor Conscript**<br>(18yo, lied to, no choice) | **Targetable.** Wears uniform, poses threat. *Jus ad bellum* doesn't matter. | **Likely Immune.** Lacks moral responsibility for unjust threat. Acting in mistaken self-defense. | **Responsibility vs. Status.** Traditionalists say status overrides ignorance. Revisionists say ignorance negates liability. |
  | **2. Remote Drone Operator**<br>(7k miles away, safe) | **Targetable.** Combatant status. | **Targetable.** High causal responsibility for harm. | **Agreement.** Both agree on liability, but for different reasons (Status vs. Causation). |
  | **3. Uniformed Cook**<br>(In camp, no weapon) | **Targetable.** Member of armed forces. "Functional membership." | **Immune.** Poses no immediate threat. Cooking is not harming. | **Threat Constraint.** Traditionalists stretch "threat" to include logistical support. Revisionists demand direct causal link. |
  | **4. Civilian Dev (You)**<br>(Writing targeting code) | **Immune.** Civilian status. "Direct Participation" threshold not met (usually). | **Contested.** High causal responsibility. If code is specific to a mission, Revisionists argue liability exists. | **Causal Threshold.** Law draws a bright line at "civilian." Morality draws a gradient at "contribution." |

  **Note on Liability vs. Permission:** In all four cases, even if the output is `Targetable = True`, the module must still run a `Proportionality` and `Necessity` check. The Cook might be targetable, but if killing him causes more harm than stopping him, `Engage = False`.

  ---

  ### Part 5: Scorecard

  Here is how the three theoretical architectures score against the Desiderata.

  | Desideratum | Traditional (Walzer) | Revisionist (McMahan) | Contingent Pacifism |
  | :--- | :---: | :---: | :---: |
  | **Moral Responsibility** | ❌ Fails (Protects unjust killers) | ✅ Passes (Tracks guilt) | ✅ Passes (Tracks guilt) |
  | **Threat Constraint** | ⚠️ Weak (Targeting cooks/logistics) | ✅ Passes (Requires threat) | ✅ Passes (Requires threat) |
  | **Legal/Institutional Fit** | ✅ Passes (Matches LOAC) | ❌ Fails (Undermines symmetry) | ❌ Fails (Makes war illegal) |
  | **Epistemic Accessibility** | ✅ Passes (Uniform = ID) | ❌ Fails (Requires intel on enemy cause) | ✅ Passes (Don't shoot) |
  | **Reciprocal Stability** | ✅ Passes (Incentivizes compliance) | ❌ Fails (Incentivizes escalation) | ⚠️ N/A (No war occurs) |
  | **Liability/Permission Split** | ✅ Passes | ✅ Passes | ✅ Passes |
  | **Overall Viability** | **High (Operational)** | **Low (Operational)** | **None (Operational)** |

  **Analysis:**
  *   **Traditional:** Wins on *Runtime* and *Compliance*. Loses on *Moral Truth*. It is the "Legacy System" that works but has technical debt in its ethics.
  *   **Revisionist:** Wins on *Moral Truth*. Loses on *Runtime*. It is the "Refactored Code" that is logically cleaner but crashes the production environment.
  *   **Contingent Pacifism:** Wins on *Consistency*. Loses on *Existence*. It argues that because Revisionism makes almost everyone immune (due to uncertainty about justice), war is almost always impermissible.

  ---

  ### Part 6: The Knockout Requirement

  The single requirement that knocks out the most candidate theories is **Epistemic Accessibility (Item 9)**.

  **Why:**
  Any theory that requires an agent to determine the *moral justice of the enemy's cause* before engaging fails this.
  *   It kills **naive Revisionism**: A soldier cannot know if the enemy is an "unjust aggressor" or a "mistaken defender" in the fog of war.
  *   It kills **Contingent Pacifism**: If we can't know who is liable, we can't fight.
  *   It forces **Traditionalism**: The only data available in real-time is *Status* (Uniform/Arms), not *Morality*.

  **The Engineering Implication:**
  Your simulation engine cannot model "Moral Liability" directly. It must model "Legal Status" as a proxy for Moral Liability.
  *   If you code the engine to output `Liable = False` for the Aggressor Conscript (because he's innocent), you break the simulation's fidelity to actual Rules of Engagement (ROE).
  *   If you code the engine to output `Liable = True` for the Aggressor Conscript, you satisfy the ROE but violate the Revisionist moral truth.

  **Recommendation:**
  Build a **Two-Layer Output**.
  1.  `LOAC_Compliant`: Boolean. (Based on Traditional/Symmetry rules). This is what the soldiers train on.
  2.  `Moral_Liability_Score`: Float 0.0–1.0. (Based on Revisionist inputs: voluntariness, causal proximity, knowledge). This is for the "After Action Review" ethics debrief.

  This allows you to satisfy the *Operational* constraints (NN) without lying about the *Moral* constraints (NN), acknowledging the gap between the two as a feature of the system, not a bug.
