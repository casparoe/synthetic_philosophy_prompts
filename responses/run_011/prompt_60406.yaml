prompt: |-
  So — slightly embarrassing context. I'm a software engineer and my company sells training-simulation gear to a couple of militaries, and last quarter someone decided our scenario engine needs a proper "law of armed conflict" module: for every person in the sim it should output whether they're targetable, and why. My PM handed me the task, I started reading to figure out what the underlying concepts actually are, and I fell into this whole argument about the moral equality of combatants — the Walzer-style view that soldiers on both sides have an equal right to kill each other no matter whose war is just, versus the revisionist stuff (McMahan and the people after him) saying liability to be attacked has to track your responsibility for an unjust threat, which blows the symmetry apart. I've got maybe fifteen tabs open, zero philosophy background, and I've realized I don't know what I'd even count as a satisfying answer. So before I drown in more of it, I want the spec — the acceptance criteria, basically.

  Write the desiderata: what any theory of who may be attacked in war has to deliver to count as adequate — the cases it has to get right, the distinctions it can't collapse, the facts about how wars actually work that it can't contradict, the legal and institutional results it's supposed to explain. Every item with the consideration or example behind it, and mark which ones are genuinely non-negotiable versus which are one camp's preferences wearing a requirements costume. Two things I especially want. First, please separate the requirements on the criterion of liability itself from the requirements on the decision procedure that an actual soldier, or an actual targeting system, can run under uncertainty and bad intel — my suspicion is that a lot of the arguing is people attacking a criterion using intuitions that only apply to a decision procedure, and vice versa, so say which views conflate the two. Second, flag any pair of desiderata you think can't be jointly satisfied. I already suspect "has to vindicate the symmetry, because the law and the soldiers need something operable" and "has to make liability track moral responsiblity" are in tension, and that the two-levels move is a patch rather than a fix — tell me if that's right or if I've got it backwards. And finish by saying which single requirement knocks out the most candidate theories.

  The cases I want the list tested against, since these are the ones our module has to handle: an 18-year-old conscript fighting for the aggressor state who has no realistic way to find out whether his country's cause is just; a drone operator seven thousand miles away who is in no danger at all and is nonetheless killing people; a cook in uniform who is legally a combatant but threatens nobody; and — awkward one — the civilian contractor who writes and maintains the targeting software, i.e. basically me, who legal says is off-limits because she's out of uniform and poses no threat but who is arguably more causally responsible for the killing than the pilot is. Also make sure the list doesn't let anyone slide between "liable to be attacked" and "permissible to attack, all things considered," because I keep seeing that happen. Then, briefly, score the three options I've run into against your list: the traditional symmetry view, the revisionist liability view, and the reply that says revisionism makes almost nobody liable in a real war so it collapses into a kind of contingent pacifism. A table is fine for that scorecard. No reading list and no citations — I can't look anything up from work anyway — keep the weight on the criteria, that's the part I can't get anywhere else.
