          5.  Conclusion: What changes the mind.

      *   *Refining the "Profligacy Slide":* The user asks: "Does profligacy show no omissive causes, or too many?" I need to be clear: It shows *too many*. The move from "too many" to "none" requires an extra premise (e.g., "Causes must be sparse"). That premise is controversial.
      *   *Refining the "Insulation":* If the view is "Positive facts + Pragmatics = All causal talk," then the metaphysical claim "No negative causation" is essentially a translation manual. The risk is triviality.
      *   *Refining the "Double Prevention":* This is the standard heavyweight. Example: A doctor disconnects a life support (omission/positive act?) which stops the machine (prevention) which kills the patient. Or: Suzy shoots down the bomber. The cause of the victim's survival is the *absence* of the bomb. If you deny this, you have to say the survival had *no* cause, which is weird.

  7.  **Final Polish (checking against user constraints):**
