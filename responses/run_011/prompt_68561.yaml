answer: |-
  This is a sophisticated position, often associated with process theorists like Phil Dowe or Helen Beebee. You are arguing for a **positivist ontology of causation** (only events/processes exist) paired with a **pragmatic theory of causal explanation** (we talk about omissions for utility, not metaphysics).

  Here is an analysis of the pressure points in your view, the specific slide you suspect you're making, and the ranking of defeaters you requested.

  ### 1. The Profligacy Slide: Existence vs. Selection
  You asked: *Does the profligacy argument show there are no omissive causes, or only that there are far too many of them?*

  You are correct to suspect a slide here. The profligacy argument demonstrates **multiplicity**, not **non-existence**.
  *   **The Slide:** You move from "There is no principled metaphysical way to distinguish my not-watering from the Nebraskan's not-watering" to "Therefore, neither is a cause."
  *   **The Counter:** In positive causation, we accept profligacy all the time. The cause of the plant's death includes the Big Bang, the existence of oxygen, and the sun's fusion. These are all positive facts. There are infinitely many positive conditions necessary for the plant's death. We don't say "Therefore, the sun's fusion is not a cause." We say it is a *background condition*, not a *salient cause*.
  *   **The Implication:** If you accept pragmatics to filter infinite positive causes, you can use the exact same pragmatics (norms, expectations, intervention capacity) to filter infinite negative causes. Profligacy threatens the *utility* of citing omissions, but it does not threaten their *ontological status* any more than it threatens the status of the Big Bang as a cause. To use profligacy to deny existence requires an extra premise: "Causation must be sparse." That is a contentious metaphysical claim, not a logical necessity.

  ### 2. The Insulation Risk: Is the View Vacuous?
  You asked: *Does 'it's a pragmatic matter' insulate the view to the point where no case could tell against it?*

  Yes, it does. And yes, that is a problem.
  If your view is: "All causal work is done by positive facts; any talk of omission is just a shorthand for positive facts + pragmatic interests," then your metaphysical claim ("there is no negative causation") becomes **empirically idle**.
  *   **The Risk:** If every time someone presents a case of apparent omission causation, you translate it into "positive facts + pragmatics," you are not offering a competing theory of causation; you are offering a translation manual.
  *   **Why it matters:** A metaphysical view should constrain our expectations. If your view can accommodate *any* intuition about omissions by shunting it off to "pragmatics," it risks triviality. The danger isn't that you can't be falsified; it's that your ontology is doing no work. The "positive facts" you posit (e.g., "my sitting on the couch" instead of "my not watering") often look like gerrymandered descriptions designed solely to save the theory. If the only reason to describe the world as "positive facts" is to avoid omissions, the ontology is serving the dogma, not the data.

  ### 3. Ranking the Defeaters (Fatal to Awkward)

  Here are the arguments friends of negative causation use, ranked by how much damage they do to your specific package.

  #### 1. Double Prevention (Fatal / Most Costly)
  This is the heavyweight champion against your view.
  *   **The Case:** Suzy shoots down an enemy bomber. The bomber would have bombed a target. By shooting the bomber, Suzy *prevents* the bombing, which *causes* the target's survival.
  *   **The Problem:** This involves a chain: Event (shoot) → Prevention of Event (no bomb) → Outcome (survival). The middle link is an omission/absence.
  *   **Why it lands:** To maintain your view, you must deny that Suzy's shooting caused the target's survival. This violates strong transitivity intuitions. If you say "Suzy caused the plane crash, but didn't cause the survival," you fracture causal chains in a way that makes causal reasoning in law, history, and medicine incoherent. You are forced to say the survival had *no cause*, only a history of positive events that didn't kill it. This is a massive bullet to bite.

  #### 2. Difference-Making Accounts (Strong)
  *   **The Case:** Most modern causal modeling (Structural Equation Models, Counterfactual theories) defines causation as difference-making. $C$ causes $E$ iff if $C$ had not occurred, $E$ would not have occurred.
  *   **The Problem:** To state the counterfactual "If I had watered the plant, it would live," you must refer to the *absence* of watering in the actual world.
  *   **Why it lands:** If you want to keep a difference-making account of causation (which is highly successful in science), you must allow variables to take "default" values (0/1). The "0" value represents an absence. To ban omissions, you have to abandon difference-making accounts in favor of process-transmission accounts (like conserved quantities). This forces you into a specific, minority metaphysical camp (process theory) rather than a general account of causation.

  #### 3. The Normative Distinction (Awkward / Manageable)
  *   **The Case:** We distinguish between me (cause) and the Nebraskan (non-cause).
  *   **The Problem:** You claim this is pragmatic.
  *   **Why it's only awkward:** You *can* handle this. You can say: "The positive facts include my sitting on the couch. The positive facts also include the Nebraskan sitting in Nebraska. Pragmatic norms select my sitting as explanatory because I had a duty." This saves your ontology. However, it makes "causation" do less work. It pushes all the heavy lifting onto "norms." It's not fatal, but it makes your metaphysical view less explanatory than the rival view (which says the norm tracks a real causal difference).

  ### 4. What Would Change My Mind

  If I were to adopt your view, the reasoning above is most likely to break down at **Double Prevention**.

  Here is why:
  The profligacy argument is your strongest shield, but it is also your weakest link because it conflates *selection* with *existence*. However, the **Double Prevention** case pierces that shield.

  In the Double Prevention case, there is no "missing" fact to point to in the way there is with the plant. There is a positive event (shooting) and a positive outcome (survival). The *only* link between them is the **absence** of the bombing.
  *   If you deny this is causation, you break the transitivity of causal chains.
  *   If you accept it is causation, you admit that an absence (the non-bombing) can be a causal relata.

  **The Defeater that Lands Hardest:**
  The argument that **causal modeling requires variables with default values.**
  In science, we model the plant's death with a variable $W$ (Water). $W=0$ causes $D=1$ (Death). This model predicts and intervenes successfully.
  *   **Your View:** Says the model is literally false (there is no $W=0$ entity), but pragmatically useful.
  *   **The Defeater:** If the model is literally false but indispensable for prediction and intervention, then your "true" ontology (positive facts only) is **explanatorily inferior** to the "false" ontology (variables including absences).
  *   **Why this changes the mind:** Metaphysics should ideally track the structure of the world that makes our best sciences true. If our best causal science (SEM, Counterfactuals) structurally requires absences to function, positing an ontology that forbids them makes the metaphysics a hindrance to understanding the science.

  **Conclusion:**
  Your view is consistent, but it purchases consistency at the price of **explanatory power**. You solve the profligacy problem by denying the data (omissions), rather than explaining it. The Double Prevention case shows that denying the data breaks causal chains we rely on. I would abandon the "no omission" view if I became convinced that **causal transitivity** is a non-negotiable feature of causation, because double prevention forces you to choose between transitivity and your ontology. Most philosophers choose to keep transitivity.
