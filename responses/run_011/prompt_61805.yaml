prompt: |-
  I direct the audience-ethics review function at a nonprofit that runs two kinds of campaign out of the same communications team: behaviour-change work aimed at the people whose welfare is at stake (vaccination uptake, smoking cessation, road safety), and fundraising appeals aimed at donors who are not the beneficiaries of the gift. Roughly fifteen campaign elements reach us each week — messages, images, landing pages, defaults in our patient portal, targeting parameters, and occasional proposals to work through a community partner — and two officers with communications backgrounds but no philosophical training have to classify each one and write a rationale that goes into a public register. We have forty-five minutes per item. We have no capacity to run experiments, so we cannot test a disclosure variant against a non-disclosure variant; we work from the materials in front of us and whatever the team already knows. The director signs off only on escalations.

  Our current instrument is a single question we call the 'disclosure test': would this technique still work as well if the audience knew we were using it, and why? Answers go into three bins. Bin A, works just as well — clear argument, accurate statistics made vivid, plain description of a benefit. Bin B, works somewhat less well — loss framing, a suggested giving amount, a deadline that is real but emphasised. Bin C, stops working if disclosed — invented scarcity, an authority we cannot substantiate, guilt aimed at a named individual, a message whose force depends on the audience not knowing who paid for it. Bin C is refused, Bin A is cleared, and everything else is meant to be easy. In practice almost all of the consequential items land in Bin B, where the test tells us nothing: a technique that loses a third of its effect on disclosure is neither transparent nor deceptive, and we currently settle those by seniority and mood.

  Please build the procedure we should be using instead. Specifically:

  1. State, in plain language and without jargon, what the disclosure intuition is actually tracking, and then what it is not tracking — why the trichotomy collapses exactly where our hard cases sit. Keep whatever in it is worth keeping.

  2. Give an ordered set of questions, no more than seven, each with an account of what counts as a sufficient answer and what counts as a non-answer, such that an officer who did not create the material can run the set in forty-five minutes.

  3. Preserve at least these distinctions, and tell me explicitly which of them must survive the simplification and which can be dropped without corrupting the instrument: influence that supplies reasons versus influence that changes how reasons are processed; techniques that exploit a known condition or vulnerability of the particular audience versus techniques that merely make use of a general feature of human cognition; and cases where the person being influenced is the person whose welfare is at stake versus cases where they are not. Draw on whatever the philosophical work on manipulation, on the ethics of choice architecture, and on the difference between manipulating and persuading has that is genuinely usable at a desk. Do not give me a reading list; give me the parts that change an answer.

  4. Handle the structural cases the disclosure test cannot see at all: a default or pre-set option where disclosure does not reduce efficacy but the choice is still steered; an intervention the audience asked for, such as a commitment device or a self-exclusion request; and influence routed through a third party the audience trusts.

  5. Specify the output. A classification code, a register entry of one or two sentences that a member of the public could understand and that a campaign manager could contest, and two explicit lists: conditions under which the officers must stop and refer to the director, and conditions under which the question is one of values that no procedure can settle and must be handed to a person.

  6. Mark every step that is a judgment call dressed as a measurement. Where the procedure asks an officer to estimate a magnitude — how much efficacy is lost on disclosure, how severe a harm, how specific a vulnerability — say what to do when no estimate is available, and whose estimate counts when two officers disagree.

  Then run the finished procedure on three items and report which way each comes out, including where the result is one I will not like:

  First, a winter fundraising appeal that encloses a sheet of personalised address labels as an unsolicited gift, states that the recipient may keep the labels whether or not they give, and pre-fills a giving amount at the second-highest tier of our historical distribution. It is our best-performing appeal of the year and the finance director has asked that it be repeated four times.

  Second, a cessation campaign aimed at fourteen- and fifteen-year-olds using short-form video of a young person describing what treatment for mouth cancer involves, accurate in every particular, delivered through the platforms' own interest and lookalike audiences.

  Third, a portal default that books eligible patients into a screening appointment they can decline in one click, with the default and its rationale explained on the same screen, which moved uptake from forty-one to sixty-eight per cent.

  Finally, state what the procedure cannot do: the kinds of item it will systematically misclassify, the direction of the error, and what would have to be true for a determined team to game it while remaining formally compliant on every question it asks.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Context:** Nonprofit ethics review function. Two campaign types: behavior-change (beneficiaries = audience) and fundraising (beneficiaries $\neq$ audience).
      *   **Current State:** 15 items/week, 2 officers (comms background, no philosophy), 45 mins/item. Current tool: "Disclosure Test" (Bin A/B/C).
      *   **Problem:** Bin B (works somewhat less well if disclosed) is a catch-all for hard cases. Decisions there are arbitrary (seniority/mood). Disclosure test fails on structural nudges (defaults), requested interventions, and third-party routing.
      *   **Task:** Build a new procedure.
      *   **Requirements:**
          1.  Explain the disclosure intuition (what it tracks/misses).
          2.  Ordered set of $\le$ 7 questions (with sufficient/non-answer criteria).
          3.  Preserve specific distinctions (reasons vs. processing, vulnerability vs. general cognition, beneficiary vs. donor).
          4.  Handle structural cases (defaults, requested interventions, third parties).
          5.  Specify output (code, register entry, escalation lists).
          6.  Mark judgment calls vs. measurements (handle uncertainty/disagreement).
          7.  Test on 3 specific cases (Fundraising labels, Teen cessation video, Portal default).
          8.  State limitations (systematic misclassifications, gaming risks).

  2.  **Deconstruct the "Disclosure Test" (Requirement 1):**

      *   *What it tracks:* It's a proxy for *manipulation* vs. *persuasion*. If I tell you what I'm doing and you still agree, I likely appealed to your reasoning. If telling you ruins the effect, I likely bypassed your reasoning or exploited a blind spot.
      *   *Why it collapses:* "Works somewhat less well" (Bin B) is the zone of *nudging*. Nudges work *because* they aren't fully scrutinized, but they aren't necessarily deceptive. Disclosure reduces efficacy of *all* communication (even good arguments) because attention is finite. The test confuses "reduced attention" with "deception." It also misses structural constraints (defaults) where disclosure doesn't change the friction cost.
      *   *What to keep:* The core intuition that *transparency compatibility* matters. If a technique *requires* ignorance to function, it's ethically suspect.

  3.  **Develop the New Procedure (Requirements 2, 3, 4, 6):**

      *   *Constraint:* 45 minutes per item. No philosophy jargon. 2 officers.
      *   *Philosophical Core:* Need to distinguish between *rational persuasion* (appealing to reasons), *non-rational influence* (heuristics/emotions), and *anti-rational manipulation* (exploiting vulnerabilities/deception). Also need to weigh *welfare* (beneficiary vs. donor).
      *   *Drafting the Questions:*
          1.  **Intent/Benefit:** Who benefits? (Preserves beneficiary distinction).
          2.  **Mechanism:** Does it add information or change friction? (Reasons vs. Processing).
          3.  **Vulnerability:** Does it target a specific weakness? (Vulnerability vs. General Cognition).
          4.  **Disclosure/Transparency:** (Refined Disclosure Test).
          5.  **Consent/Request:** Is this wanted? (Handles structural/requested cases).
          6.  **Exit Cost:** How hard is it to say no? (Handles defaults).
          7.  **Proportionality:** Is the influence proportional to the goal?
      *   *Refining for Time:* 7 questions might be tight for 45 mins if deep analysis is needed. Need clear "Stop/Go" criteria. Let's group them logically.
      *   *Judgment Calls:* Need to specify that officers use "best available evidence" and "precautionary principle" when unsure. Disagreement goes to Director (but we want to minimize that).

  4.  **Refining the Distinctions (Requirement 3):**

      *   *Reasons vs. Processing:* Crucial. Persuasion gives new reasons. Manipulation changes how existing reasons are weighed (e.g., scarcity makes a reason feel heavier without changing the object).
      *   *Vulnerability:* Targeting smokers is okay (general cognition). Targeting *grieving* donors is not (specific vulnerability).
      *   *Beneficiary:* Higher bar for donors (they lose money, no direct health gain). Lower bar for patients (they gain health, but autonomy is high stakes). *Correction:* Actually, autonomy is high stakes for both, but the *welfare trade-off* differs. For patients, we want them to act (vaccinate). For donors, we want them to act (give), but they get no direct physical benefit. The ethical bar for *manipulation* should be lower for self-regarding acts (health) than other-regarding acts (charity), provided the health advice is sound.
      *   *Survival:* All three distinctions must survive. They are the core of the ethical analysis.

  5.  **Handling Structural Cases (Requirement 4):**

      *   *Defaults:* Disclosure doesn't stop a default. Need an "Ease of Opt-out" question.
      *   *Requested:* If they asked for it (commitment device), it's consensual. Need a "Solicitation" question.
      *   *Third Party:* Trust transfer. Need a "Source/Intermediary" check.

  6.  **Developing the Output (Requirement 5):**

      *   *Code:* Green (Clear), Amber (Review/Modify), Red (Reject).
      *   *Register Entry:* Plain English. "We approved X because Y, despite Z concern."
      *   *Escalation:* When officers disagree, when harm is high/uncertain, when it sets a precedent.
      *   *Values:* When the trade-off is purely philosophical (e.g., autonomy vs. welfare weight).

  7.  **Addressing Judgment Calls (Requirement 6):**

      *   Explicitly mark where estimation is needed.
      *   Rule: If evidence is missing, assume the *higher risk* classification.
      *   Disagreement: If Officers disagree on a binary (Yes/No), it escalates. If they disagree on a scale (1-5), take the average or the more cautious score. Let's say: *More cautious score prevails.*

  8.  **Running the Test Cases (Requirement 7):**

      *   *Case 1: Fundraising Labels.*
          *   Benefit: Donor (cost), Org (gain), Beneficiary (gain).
          *   Mechanism: Reciprocity norm (processing), Default amount (friction).
          *   Vulnerability: General (everyone likes gifts), but unsolicited.
          *   Disclosure: If told "This is to make you feel obliged," does it stop? Probably reduces efficacy.
          *   Exit: Easy to not give, but pre-fill suggests norm.
          *   *Verdict:* Amber/Red. Exploits reciprocity without explicit consent. High risk of Bin C behavior disguised as Bin B.
      *   *Case 2: Teen Cessation Video.*
          *   Benefit: Teen (health).
          *   Mechanism: Vivid information (Reasons).
          *   Vulnerability: Teens (general cognition/developmental), but not exploiting a specific weakness (like addiction) to sell something harmful.
          *   Disclosure: "We are showing you this to scare you off smoking." Works just as well.
          *   *Verdict:* Green. Persuasion via vivid facts.
      *   *Case 3: Portal Default.*
          *   Benefit: Patient (health).
          *   Mechanism: Default (friction).
          *   Disclosure: Explained on screen.
          *   Exit: One click (low friction).
          *   *Verdict:* Green. Libertarian Paternalism done right.

      *   *The "Result You Won't Like":* The Fundraising Labels (Case 1) are the "best performing appeal." The procedure will likely flag this as ethically risky (Amber/Red) because it relies on unacknowledged reciprocity norms and pre-set anchors that benefit the org more than the donor. This conflicts with the Finance Director's wish.

  9.  **Limitations & Gaming (Requirement 8):**

      *   *Misclassification:* Subtle emotional framing that passes as "information."
      *   *Direction:* False negatives (approving manipulative stuff that looks like persuasion).
      *   *Gaming:* Writing rationales that claim "vivid statistics" when it's actually "fear appeals." Officers rely on materials provided; if materials lie, procedure fails.

  10. **Review and Refine:**

      *   *Tone:* Professional, directive, practical.
      *   *Jargon Check:* Ensure "heuristics," "friction," "reciprocity" are explained or used plainly.
      *   *Time Check:* Can 7 questions be answered in 45 mins? Yes, if they are binary or simple scales.
      *   *Philosophy Check:* Ensure the distinction between *manipulation* (bypassing reason) and *persuasion* (engaging reason) is central.
      *   *Constraint Check:* Did I answer all 6 specific points + the test cases + limitations? Yes.

      *(Self-Correction during drafting)*: I need to make sure the "Judgment Call" markers are explicit. I will use bold brackets like **[JUDGMENT CALL]**.
      I also need to ensure the "Values" vs "Procedure" distinction is clear in the escalation section.
      For the Fundraising case, I need to be firm. It's a classic "reciprocity trigger." Even if disclosed ("We sent you gifts so you feel like giving"), it loses potency. That pushes it toward Bin C logic, but since it's not *deceptive* (they say you can keep them), it's high-risk Bin B. The new procedure needs to catch this.

      *Refining the Questions:*
      1. Who is the target and who benefits? (Beneficiary distinction)
      2. Does this add new facts or change the 'weight' of existing facts? (Reasons vs Processing)
      3. Does this rely on a specific vulnerability or general human traits? (Vulnerability)
      4. If we explained the *mechanism* (not just the fact), would it still work? (Refined Disclosure)
      5. Is this action requested or expected by the audience? (Consent/Structure)
      6. How hard is it to choose the alternative? (Friction/Defaults)
      7. Is the intensity of the technique proportional to the benefit? (Proportionality)

      *Wait, 45 minutes is tight.* I need to make sure the "Sufficient Answer" guidance is very concrete.
      *Escalation:* Needs to be specific.

      *Let's write it.*
answer: |-
  ### 1. The Disclosure Intuition: What It Tracks and Why It Fails

  **What it tracks:**
  The disclosure test is a proxy for **respect for agency**. It asks: *Does this technique rely on the audience remaining ignorant of how they are being moved?*
  *   **Bin A (Transparent):** Appeals to reason. Telling you *why* I am showing you this adds to the argument (e.g., "We show you this statistic because it proves the risk").
  *   **Bin C (Deceptive):** Relies on ignorance. Telling you *how* it works breaks the spell (e.g., "We invented this deadline to panic you").

  **Why it collapses (The Bin B Problem):**
  The test fails on **non-rational but non-deceptive influence** (nudges).
  *   **Friction and Defaults:** Telling someone "This is a default option" does not make clicking "Next" harder, but it still steers them. Disclosure doesn't stop the inertia.
  *   **Emotional Salience:** Telling a donor "We use vivid images to trigger empathy" might reduce the emotional impact slightly (Bin B), but it doesn't make the appeal deceptive.
  *   **The Measurement Error:** Your officers are asked to estimate *efficacy loss* ("works somewhat less well"). This is impossible to measure without experiments. It turns an ethical question into a marketing guess, which leads to decisions based on mood.

  **What to keep:**
  Keep the core question: *Does the technique require ignorance to function?* Discard the measurement of *how much* efficacy is lost.

  ---

  ### 2. The Procedure: Seven Questions for Ethics Review

  **Time Budget:** 45 Minutes.
  **Instruction:** Answer sequentially. If any question triggers a **STOP**, refer to the Director. If all are answered, assign the Code.

  **Q1. The Welfare Map**
  *   **Question:** Who is the audience, and who primarily benefits if they comply?
  *   **Sufficient Answer:** Identifies Audience (e.g., "Donors") and Beneficiary (e.g., "Patients" or "The Organisation").
  *   **Non-Answer:** "Everyone benefits" or "The cause."
  *   **Rule:** If Audience $\neq$ Beneficiary (Fundraising), apply **High Scrutiny**. If Audience $=$ Beneficiary (Behaviour Change), apply **Standard Scrutiny**.

  **Q2. The Mechanism**
  *   **Question:** Does this element provide new information/reasons, or does it change the *ease* or *emotional weight* of the decision?
  *   **Sufficient Answer:** "Provides new info" (Persuasion) OR "Changes ease/weight" (Nudge/Influence).
  *   **Non-Answer:** "It encourages them."
  *   **Rule:** If "Changes ease/weight," proceed to Q3. If "Provides new info," skip to Q5.

  **Q3. The Vulnerability Check**
  *   **Question:** Does this technique exploit a temporary state (grief, urgency, intoxication) or a specific cognitive deficit known in this group, or does it use a general human trait (loss aversion, reciprocity)?
  *   **Sufficient Answer:** "General trait" OR "Specific vulnerability (specify)."
  *   **Non-Answer:** "It targets their interests."
  *   **Rule:** If "Specific vulnerability," **STOP (Refer to Director)**. If "General trait," proceed.

  **Q4. The Transparency of Mechanism**
  *   **Question:** If we told the audience *how* this technique works (not just what it says), would it feel like a trick?
  *   **Sufficient Answer:** "No, it's a standard tool" OR "Yes, it relies on hiding the motive."
  *   **Non-Answer:** "They wouldn't read the disclosure."
  *   **Rule:** If "Yes, feels like a trick," **Code Red (Reject)**. If "No," proceed.

  **Q5. The Friction Test (For Defaults/Structure)**
  *   **Question:** If the audience wants to choose the alternative, how many clicks/steps does it take?
  *   **Sufficient Answer:** A number (e.g., "1 click," "5 minutes," "Phone call").
  *   **Non-Answer:** "It's easy."
  *   **Rule:** If $>3$ clicks or requires active effort (phone/mail), **Code Amber (Modify)**. If $\le1$ click, proceed.

  **Q6. The Solicitation Check**
  *   **Question:** Did the audience ask for this intervention, or is it unsolicited?
  *   **Sufficient Answer:** "Requested (e.g., commitment device)" OR "Unsolicited."
  *   **Non-Answer:** "They signed up for newsletters." (This is not specific consent).
  *   **Rule:** If "Unsolicited" AND "High Scrutiny" (from Q1), proceed to Q7. If "Requested," **Code Green**.

  **Q7. The Proportionality Balance**
  *   **Question:** Is the intensity of the influence proportional to the welfare gain for the beneficiary?
  *   **[JUDGMENT CALL]:** Weigh the intrusiveness against the good done.
  *   **Sufficient Answer:** "High intrusiveness/High gain" OR "High intrusiveness/Low gain."
  *   **Non-Answer:** "It's important."
  *   **Rule:** If "High intrusiveness/Low gain" (e.g., aggressive tactics for small donation), **Code Amber**. Otherwise **Code Green**.

  ---

  ### 3. Preserved Distinctions

  All three distinctions you requested must survive. Here is how they are embedded in the procedure:

  1.  **Reasons vs. Processing (Q2):** This is the primary filter. Persuasion (Reasons) is ethically cheaper than Nudging (Processing). This distinction survives intact.
  2.  **Vulnerability vs. General Cognition (Q3):** This is the critical safety valve. Using general loss aversion is permissible; exploiting a specific trauma is not. This distinction survives intact.
  3.  **Beneficiary vs. Audience (Q1 & Q7):** This sets the "Scrutiny Level." We tolerate more steering when the person being steered gets the health benefit (Behaviour Change) than when they pay for someone else's benefit (Fundraising). This distinction survives intact.

  **Philosophical Import:**
  *   **Manipulation:** Defined here as *bypassing or subverting the agent's capacity to choose for reasons* (Q2 + Q4).
  *   **Paternalism:** Defined as *steering for the agent's own good* (Q1 + Q7). Permissible if friction is low (Q5).
  *   **Consent:** Defined as *specific solicitation* (Q6).

  ---

  ### 4. Handling Structural Cases

  *   **Defaults (Q5):** The disclosure test cannot see defaults. Q5 explicitly measures *exit cost*. A default with a 1-click opt-out is Green; a default with a phone-call opt-out is Amber.
  *   **Requested Interventions (Q6):** If a user asks for a commitment device (e.g., "remind me to quit"), Q6 clears it immediately as consensual, bypassing the manipulation check.
  *   **Third-Party Routing:** Handled in **Q1 (Welfare Map)**. Officers must identify if the "Messenger" is a trusted community partner. If the material hides the funder, it fails **Q4 (Transparency of Mechanism)**.

  ---

  ### 5. Output Specification

  **Classification Code:**
  *   **Green:** Clear. No ethics concerns.
  *   **Amber:** Proceed with conditions (e.g., reduce friction, add explanation).
  *   **Red:** Reject. Technique relies on deception or exploitation.

  **Register Entry (Public Facing):**
  *   *Format:* "We reviewed [Item]. We approved/rejected it because [Mechanism] was judged [Proportionate/Disproportionate] for [Audience]."
  *   *Example:* "We approved the screening default because the opt-out is one click and the health benefit is high."

  **Escalation List (Refer to Director):**
  1.  **Q3 Trigger:** Specific vulnerability exploitation (e.g., targeting grieving widows).
  2.  **Officer Disagreement:** Officers cannot agree on a Binary (Yes/No) answer.
  3.  **Precedent:** A technique never before reviewed (e.g., first use of AI-generated personas).
  4.  **High Scrutiny + Amber:** Fundraising appeal that triggers an Amber rating.

  **Values Handoff (Refer to Board/External Committee):**
  1.  **Q7 Deadlock:** Officers agree on facts but disagree on whether the welfare gain justifies the intrusiveness (e.g., "Is saving a life worth lying about a deadline?").
  2.  **Mission Drift:** A campaign that is ethically sound but conflicts with the nonprofit's stated values (e.g., aggressive fundraising that feels "commercial").

  ---

  ### 6. Judgment Calls and Measurements

  **Marked Steps:**
  *   **Q3 (Vulnerability):** **[JUDGMENT CALL]** Distinguishing "general cognition" from "specific vulnerability."
      *   *Rule:* If no data exists on the audience's state, assume **General Cognition**. If the campaign team *knows* the list is segmented by life-event (e.g., "recently bereaved"), assume **Specific Vulnerability**.
  *   **Q4 (Feels like a trick):** **[JUDGMENT CALL]** Subjective assessment of "trickery."
      *   *Rule:* Use the "Newspaper Test." Would we be comfortable if the mechanism was described on the front page of a national paper? If officers hesitate, mark **Yes**.
  *   **Q7 (Proportionality):** **[JUDGMENT CALL]** Weighing harm vs. benefit.
      *   *Rule:* Use the **Precautionary Principle**. If the benefit is speculative (e.g., "brand awareness") and the intrusion is high, default to **Disproportionate**.

  **Handling Uncertainty:**
  *   **Missing Data:** If the campaign team cannot answer "How many clicks to opt-out?" (Q5), assume the **Worst Case** (High Friction).
  *   **Officer Disagreement:**
      *   On Binary (Yes/No): **Escalate to Director.**
      *   On Scale (Proportionality): Take the **More Cautious** score (e.g., if one says Green, one says Amber, result is Amber).

  ---

  ### 7. Test Cases

  **Case 1: Winter Fundraising (Labels + Pre-fill)**
  *   **Q1 (Welfare):** Audience = Donor. Beneficiary = Org/Patients. **High Scrutiny.**
  *   **Q2 (Mechanism):** Changes ease/weight (Reciprocity norm + Anchoring). **Proceed.**
  *   **Q3 (Vulnerability):** General trait (Reciprocity). **Proceed.**
  *   **Q4 (Transparency):** If told "We sent gifts to trigger obligation," efficacy drops significantly. It feels transactional. **Borderline Trick.**
  *   **Q6 (Solicitation):** Unsolicited. **Proceed.**
  *   **Q7 (Proportionality):** High intrusiveness (unsolicited gift + anchor) for financial gain (not direct donor welfare).
  *   **Result:** **Code Amber (Modify).**
  *   **Rationale:** "The unsolicited gift relies on unacknowledged reciprocity norms. The pre-filled amount anchors high. To clear, remove the pre-fill or explicitly state the gift is unconditional in the first paragraph."
  *   **Note:** This contradicts the Finance Director. The procedure flags this as ethically risky because it leverages social debt for revenue.

  **Case 2: Teen Cessation (Vivid Video)**
  *   **Q1 (Welfare):** Audience = Teen. Beneficiary = Teen. **Standard Scrutiny.**
  *   **Q2 (Mechanism):** Provides new info (Vivid description of treatment). **Skip to Q5.**
  *   **Q5 (Friction):** N/A (Video view).
  *   **Q6 (Solicitation):** Unsolicited, but public health mandate.
  *   **Q7 (Proportionality):** High emotional weight, but High welfare gain (cancer prevention).
  *   **Result:** **Code Green.**
  *   **Rationale:** "Vivid information appeals to reason and welfare. No structural barriers or specific vulnerabilities exploited."

  **Case 3: Portal Default (Screening)**
  *   **Q1 (Welfare):** Audience = Patient. Beneficiary = Patient. **Standard Scrutiny.**
  *   **Q2 (Mechanism):** Changes ease (Default). **Proceed.**
  *   **Q3 (Vulnerability):** General trait (Inertia). **Proceed.**
  *   **Q4 (Transparency):** Explained on screen. **Not a trick.**
  *   **Q5 (Friction):** One click to decline. **Pass.**
  *   **Q6 (Solicitation):** Unsolicited, but part of care pathway.
  *   **Result:** **Code Green.**
  *   **Rationale:** "Libertarian paternalism. Default steers toward health, but exit cost is minimal and rationale is disclosed."

  ---

  ### 8. Limitations and Gaming

  **Systematic Misclassification:**
  *   **The "Rationalisation" Error:** The procedure will systematically **False Negative** (approve) campaigns that dress emotional manipulation as "information." (e.g., A video that is technically accurate but edited to induce panic). Q2 relies on officers distinguishing "info" from "weight," which is subtle.
  *   **Direction of Error:** It will tend to be **too permissive on Fundraising** (Case 1) if officers feel pressure to validate "standard industry practice" as "General Traits."

  **Gaming the Procedure:**
  A determined team can remain formally compliant by:
  1.  **Obfuscating Q2:** Describing emotional triggers as "educational vividness."
  2.  **Minimising Q5:** Claiming an opt-out is "one click" when it is buried in a submenu.
  3.  **Exploiting Q3:** Arguing that *all* donors are "grieving" or "hopeful," making specific vulnerabilities look like general traits.

  **What would have to be true to stop gaming:**
  Officers would need **independent access** to the live user journey (to verify Q5 clicks) and **access to the segmentation logic** (to verify Q3 vulnerabilities). Without this, they are auditing the *claim*, not the *campaign*.
