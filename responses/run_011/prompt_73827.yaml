  1. Rational belief must avoid sure loss in betting scenarios, because accepting guaranteed losses violates minimal instrumental rationality regardless of evidence quality. This is non-negotiable; the Ramsey/Savage coherent-credence view survives it, while the Keynesian objective-relation view fails it unless augmented with decision rules.

  2. Belief precision must not exceed evidence determinacy, because assigning exact probabilities to unique events manufactures knowledge where none exists and misleads decision-makers. This is non-negotiable and the single requirement that eliminates the most candidates, as the Ramsey/Savage coherent-credence view fails it while Keynesian objective-relation and two-dimensional views survive.

  3. The account must guide an agent's deliberation from her internal standpoint, since a theory of rationality unusable by the agent is merely an external critique rather than a normative guide. This is a local preference where the Ramsey/Savage coherent-credence view survives and the Keynesian objective-relation view fails; I hold this requirement least firmly and would withdraw it if shown external coherence suffices for normative force, acknowledging my reasoning may privilege convenience over truth.

  4. Strength of belief and weight of evidence must remain distinct dimensions, because high confidence on thin evidence warrants different action than high confidence on thick evidence despite identical probabilities. This is non-negotiable and survives only in two-dimensional views; plainly, this requirement and Item 1 are jointly unsatisfiable, as coherence proofs demand precise credences that weight separation forbids.

  5. Confidence must affect the size of commitment and not merely its direction, because rational agents stake more where evidence is weightier even if expected values match. This is non-negotiable; the two-dimensional view survives it, whereas the Ramsey/Savage coherent-credence view fails it unless modified to incorporate ambiguity aversion.
