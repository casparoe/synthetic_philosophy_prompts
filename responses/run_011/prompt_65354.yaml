prompt: |-
  hey — could you give me comments on a draft? It's for a small reading group at my school, maybe fifteen people, mostly philosophy grad students plus two linguists who will absolutely tear into anything sloppy. I'm about 60% done and I'd rather find out now whether the central move is worth another month of work. Bluntness is welcome. I've pasted the relevant part below (it's the argument section, the intro and the history stuff I've left out).

  --- DRAFT ---

  Everyone teaches the primary/secondary occurrence distinction from the 1905 paper as a scope ambiguity, and then everyone is puzzled by the fact that Russell has to tell you which scope to pick. Consider: The current king of France doesn't exist. Take the description with wide scope over the negation and you get that there is exactly one current king of France and that he fails to exist — not just false but self-undermining. Take it with narrow scope and you get the denial of the whole existence-and-uniqueness package, which is true. Russell says the sincere speaker means the second one. Standard textbooks report this as: the sentence is ambiguous, and only one of the readings is available to the sincere speaker. Which is a strange thing for a semantic ambiguity to be like. Ambiguities are supposed to be free; the grammar generates both and the world picks. Here one of the two generated readings is systematically never what anybody means, and it's never what anybody means for a reason that has nothing to do with what the sentence says.

  My claim is that the wide/narrow contrast isn't a scope contrast at all, and that the reason it looks like one is that Russell had no vocabulary for the thing that actually controls it, so he reached for the only structural resource he had. What controls it is the discourse status of the descriptive content: whether that content is already on the table as part of the question being answered, or whether it's being newly asserted.

  Run the example again. Somebody asks whether France still has a king. The descriptive content of the current king of France is supplied by the question; it is given, not asserted. What the answerer adds is a negation over that whole package. So the description ends up narrow, and the sentence is true. Now imagine the same words in a context where the descriptive content is precisely what's being put forward as news — a con-man has just been introduced as royalty and you want to say the fellow is no such thing. Now the description is the assertoric contribution, it goes wide, and the sentence says that there is exactly one current king of France and he fails to exist. Contradiction. But notice: the contradiction isn't a defect in the reading, it's a diagnosis of the context. You cannot newly assert existence-and-uniqueness and deny existence in the same breath. So the wide reading isn't a reading anyone could sincerely mean — it's what you get when you ask the analysis to do something incoherent.

  This is exactly the structural role that focus plays in the semantics of particles like only and even. The particle's contribution is invariant; what varies is which material counts as background and which counts as the point. Russell's two occurrences are, I want to say, the two positions a description can occupy relative to the question under discussion, and he encoded them as two positions relative to a logical operator because operator position was the only notion of position he had.

  Two things I think this buys us. First, it converts a stipulation into an explanation. Russell doesn't get to decree that negative existentials take the secondary reading; the decree follows from the fact that a topic can't be an assertion. Second, it explains the odd locality of the distinction. The wide/narrow contrast only ever does visible work in puzzles — empty descriptions, negative existentials, nonexistence claims about fictional characters. Everywhere else it's invisible. On the scope story that's a coincidence. On my story it's a prediction: the contrast only becomes visible when the speaker has no salient individual to work with and the descriptive content is doing the whole job of fixing the topic. When there's a perfectly good referent in the room, whether the description sits inside or outside an operator makes no difference to what's said, and so nobody notices.

  There is also a consequence for the old quarrel about truth-value gaps. On my account Russell and Strawson are not disagreeing about the semantics of the English determiner. Russell is describing a procedure for converting a topic-comment structure into canonical form, a procedure that only issues a truth-evaluable claim once you know what the topic was supplied by. Strawson is describing what happens to the sentence when you detach it from any such supply. The one who says false and the one who says neither-true-nor-false are answering different questions, and the difference between them is not in the sentence. It's in whether there's a question under discussion.

  The hard case for me, and I don't yet have an answer. The same distinction does work inside attitude reports and modals, where the two positions of the description generate a genuine de re / de dicto contrast and where both readings are perfectly available and non-contradictory. A monarch wondering whether the author of a certain novel is a particular person he suspects: description narrow gives a claim about whoever wrote it, description wide gives a claim about a specified individual. Both are coherent. Nothing there looks incoherent-by-construction, and it isn't obvious to me that givenness versus assertedness tracks the two readings. If my story has to say that attitude contexts are a different phenomenon wearing the same clothes, then the theory is narrower than I've been letting on.

  --- END DRAFT ---

  Okay, what I actually want from you:

  1. Is the central analogy load-bearing or is it decorative? I can feel that focus-background structure and quantifier scope are different kinds of thing — one's about alternatives, one's about composition — and I want you to tell me whether that difference is fatal to what I'm doing or just a matter of presentation. If it's fatal, say so and tell me why in as much detail as you can.

  2. Check my claim that the wide reading of the negative existential is self-undermining rather than merely false. I'm pretty confident but I want a second pair of eyes on whether I'm reconstructing his analysis correctly, since a lot rides on it.

  3. The attitude-report paragraph is where I'm weakest. Can you think of a way to extend the givenness account into those cases, or a specific counterexample that shows it can't be extended? I'd honestly rather have the counterexample.

  4. Am I being too cute about Strawson? The both-are-answering-different-questions move feels like a place where I could be accused of dissolving a real disagreement by relabelling it. Tell me where that accusation would actually bite.

  5. Give me one example of a context where my account predicts the wrong reading — where the descriptive content is clearly background/given but the wide reading is nevertheless what's meant, or the reverse. That's the kind of thing the linguists in the room will produce in about ninety seconds and I want to have it in advance.

  6. Structurally: does the thing read like an argument or like a seminar presentation where I keep announcing what I'm about to do? I suspect the latter and I don't know how to fix it.

  Please don't give me a reading list or citations — I know roughly where to go and I'll do that part myself. Describing positions in prose is totally fine, exact attributions are not needed. I mostly want to know whether the argument works and where it breaks.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the Request:**
      *   **Task:** Provide comments on a draft argument section of a philosophy paper.
      *   **Audience:** Small reading group (15 people), mostly philosophy grad students + 2 linguists (who will be critical of sloppiness).
      *   **Status:** 60% done. Author wants to know if the central move is worth another month of work.
      *   **Tone:** Bluntness welcome. No reading lists/citations needed. Focus on argument strength and structural integrity.
      *   **Specific Questions:**
          1.  Is the focus/background analogy load-bearing or decorative/fatal?
          2.  Is the "self-undermining" claim about wide-scope negative existentials correct?
          3.  How to handle attitude reports (extend the account or find a counterexample)?
          4.  Is the Strawson move too cute/dissolving?
          5.  Provide a counterexample context (Given = Wide or Given = Narrow mismatch).
          6.  Structural critique (Argument vs. Seminar announcement).

  2.  **Analyze the Draft:**
      *   **Core Thesis:** Russell's primary/secondary occurrence distinction isn't genuine logical scope ambiguity but rather a reflection of discourse status (Given/Topic vs. New/Comment).
      *   **Mechanism:** "Wide scope" = Description is asserted (New). "Narrow scope" = Description is given (Topic/QUD).
      *   **Application:** Negative existentials ("The King of France doesn't exist"). Wide scope = contradiction (asserting existence then denying it). Narrow scope = true denial (denying the existence package supplied by context).
      *   **Extension:** Russell vs. Strawson dispute is dissolved (different QUDs).
      *   **Weakness acknowledged:** Attitude reports/modals (de re/de dicto) where both readings are coherent and don't look like QUD issues.

  3.  **Address Question 1: The Focus/Scope Analogy (Load-bearing or Fatal?)**
      *   *Initial thought:* This is the riskiest part. Scope is syntactic/semantic (composition). Focus/QUD is pragmatic/informational. Conflating them is a category error unless there's a mapping mechanism.
      *   *Linguist perspective:* Linguists distinguish LF (Logical Form) from Information Structure. If the author claims there *is no* scope ambiguity, just IS (Information Structure), they need to explain how IS maps to truth conditions without scope.
      *   *Verdict:* It's load-bearing but currently vulnerable. It risks being "pragmatic intrusion" into semantics. The fatal flaw would be if the truth conditions *actually* differ in a way IS can't capture without covert scope operators.
      *   *Advice:* Don't say "it's not scope." Say "scope is the *formal encoding* of a pragmatic distinction." Or acknowledge that IS *determines* the LF. The distinction between "alternatives" (focus) and "composition" (scope) is real, but IS often drives LF movement. The draft needs to be careful not to deny the semantic machinery exists, but rather explain *why* it moves.

  4.  **Address Question 2: Self-Undermining vs. False**
      *   *Analysis:* Russell's analysis of "The F is G" is $\exists x (Fx \land \forall y (Fy \to y=x) \land Gx)$.
      *   *Negation:* "The F is not G" (wide scope) = $\exists x (Fx \land \forall y (Fy \to y=x) \land \neg Gx)$.
      *   *Negative Existential:* "The F does not exist."
      *   *Wide Scope:* $\exists x (Fx \land \forall y (Fy \to y=x) \land \neg \exists y (y=x))$.
      *   *Evaluation:* Yes, asserting uniqueness/existence and then denying existence of that very individual is a contradiction (or necessarily false). It's not just false; it's logically incoherent *given the analysis*.
      *   *Verdict:* The claim holds up. It's a contradiction in terms within Russell's system.

  5.  **Address Question 3: Attitude Reports (The Hard Case)**
      *   *Problem:* "John believes the F is G." De re (wide) vs. De dicto (narrow). Both are coherent.
      *   *Draft's worry:* Givenness doesn't track this.
      *   *Potential Extension:* QUD can work here. "Who does John believe wrote the book?" (De re: specific individual). "What does John believe about the author?" (De dicto: whoever fits the description).
      *   *Counterexample:* Specificity without Givenness. I can have a de re belief about someone I don't know is the F. (e.g., Oedipus wants to marry the Queen. He doesn't know it's his mother. De re about his mother? De dicto about the Queen?)
      *   *Better Counterexample:* "I hope the winner is happy." If I don't know who won, it's de dicto. If I know who won, it's de re. This tracks knowledge/givenness.
      *   *Fatal Counterexample:* Quantified attitudes. "Every student hopes the professor cancels class." De re (specific professor) vs De dicto (whoever is the professor). The "givenness" of the professor is constant, but the scope varies based on the quantifier interaction, not just discourse status.
      *   *Advice:* The QUD account struggles with *specificity* independent of *givenness*. You can have a specific individual in mind (de re) that is *not* discourse-given (e.g., pointing at a stranger).

  6.  **Address Question 4: The Strawson Move (Too Cute?)**
      *   *Analysis:* Russell says False (no King). Strawson says Neither True nor False (presupposition failure).
      *   *Draft's Move:* Russell = QUD supplies topic (so we evaluate the comment). Strawson = Sentence detached (no QUD, so presupposition failure).
      *   *Critique:* Strawson's point is about *semantic* presupposition, not pragmatic context. Strawson argues the sentence *itself* carries the requirement. Moving it to QUD makes it a pragmatic phenomenon.
      *   *Risk:* Linguists will say you are pragmaticizing a semantic intuition. Strawson's intuition persists even *in* a context. "The King of France is bald" said in a context where we know there is no King still feels infelicitous, not just false.
      *   *Advice:* Acknowledge that Strawson's intuition is about *felicity conditions* which you are reclassifying as QUD appropriateness. The accusation bites where the sentence feels "wrong" even when the QUD is clear.

  7.  **Address Question 5: Counterexample Context (Predicting Wrong Reading)**
      *   *Goal:* Given content + Wide Scope (bad for theory) OR New content + Narrow Scope (bad for theory).
      *   *Scenario 1 (Given + Wide):* Context: We are discussing the current King of France (Given). Speaker: "The King of France does not exist." Theory predicts Narrow (True). But maybe speaker means Wide (Contradiction)? No, speaker usually means Narrow.
      *   *Scenario 2 (New + Narrow):* Context: No mention of Kings. Speaker introduces: "I bet the King of France doesn't exist." Here "King of France" is New. Theory predicts Wide (Contradiction). But the sentence is naturally read as True (Narrow).
      *   *Wait, that supports the theory.* The theory says New = Wide = Bad. But we say it and mean True.
      *   *Refined Counterexample:* "I doubt the winner will be happy." Context: Race hasn't happened. "The winner" is not Given (no specific individual). It is New information. Theory predicts Wide (asserting there is a winner). But we naturally read it Narrow (I doubt there will be a winner who is happy).
      *   *Actually, the strongest counterexample is 'Specific Indefinites' or 'Referential Descriptions' in Donnellan's sense.* "The murderer is insane." (Pointing at Smith in court). Smith is the murderer (false description). Speaker means Smith (Wide/Referential). Description is "New" (accusation), but reading is Wide.
      *   *Better one for Russell:* "The man drinking a martini is happy." (He's drinking water). If I say this, I am asserting existence (Wide). But if the context is "Who is happy?", and I say "The man drinking a martini," the description is the *answer* (New/Asserted). This fits.
      *   *Let's find the mismatch:* Context: We are looking for the thief. I say "The thief left fingerprints." (Thief is Given/Topic). Reading: Narrow? No, I am asserting something about the thief. I am presupposing existence. This is the Strawson zone.
      *   *The Killer Counterexample:* **Modal Subordination.** "A wolf came in. It was hungry." vs "The wolf was hungry."
      *   *Let's stick to the prompt's specific negative existential focus.*
      *   *Context:* A historian is lecturing. "Now, regarding the King of France in 1905..." (Topic Established/Given). Statement: "The King of France did not exist." (Wait, he did in 1905).
      *   *Let's try:* "I am looking for the current King of France." (Non-specific/Narrow). Context: I am a delusional person. The description is "New" to the listener (they don't know I'm looking). But the reading is Narrow (I'm not asserting he exists).
      *   *Best Bet:* **Specific but Discourse-New.** I point to a man across the room. I don't know his name. I say to you: "The man in the corner is suspicious." The description "man in the corner" is visually salient but not linguistically Given. It functions de re (Wide). My theory says New = Wide. This fits.
      *   *Where it breaks:* **Generic/Kind Readings.** "The dodo is extinct." "The dodo" is the topic (Given in a biology class?). Reading: Wide (There is a kind, it is extinct). But if I say "The dodo doesn't exist," meaning the species is gone.
      *   *Let's go with the 'Specific Indefinite' style counterexample.* "I need to talk to the boss." (Context: I don't know who the boss is, there might not be one). Description is New. Reading is Narrow (I need to talk to whoever is boss, if there is one). Theory predicts Wide (Assertion of existence). This is a strong mismatch. "I want to meet the King of France." (Delusional). Description is New. Reading is Narrow (I want to meet whoever fits this, though no one does). Theory says New = Wide = Contradiction. But the sentence is coherent.

  8.  **Address Question 6: Structure (Argument vs. Announcement)**
      *   *Observation:* The draft uses phrases like "My claim is...", "Two things I think this buys us...", "The hard case for me..."
      *   *Critique:* It reads like a talk. "I want to say," "I don't yet have an answer."
      *   *Fix:* State the thesis definitively. Integrate the "buy us" points into the argument flow. Acknowledge the limitation (attitude reports) as a scope condition of the theory, not a personal confession.

  9.  **Synthesize and Refine:**
      *   *Tone:* Direct, rigorous, slightly critical (as requested).
      *   *Linguist Check:* Ensure the distinction between LF and IS is highlighted.
      *   *Philosophy Check:* Ensure the Russell/Strawson distinction is treated with care regarding presupposition.

      *(Self-Correction during drafting response)*: On Q1, I need to be careful. The author asks if the difference is fatal. It *is* fatal if they claim scope *doesn't exist*. It's survivable if they claim scope is *driven* by IS. I should advise the latter.
      On Q5, the "I want to meet the King of France" example is strong. It's a negative-existential-adjacent context (intensional). The description is discourse-new, but the reading is narrow (non-existence compatible).

  10. **Final Polish:** Organize by the 6 questions. Keep it tight. No fluff.

  *(Final check of the "Self-Undermining" point)*: Russell's analysis of "The F does not exist" with wide scope is $\exists x (Fx \land \forall y(Fy \to y=x) \land \neg E!x)$. Since $Fx$ entails $E!x$ in standard logic (or at least existence is part of the quantifier), this is indeed a contradiction. The author is right.

  *(Final check of Strawson)*: The "different questions" move is essentially the Stalnakerian move. The accusation is that Strawson's intuition is about *semantic* presupposition, which projects out of contexts. If the author makes it purely pragmatic (QUD), they lose the projection data. I need to mention projection.

  *(Final check of Structure)*: The draft is very conversational ("Everybody teaches," "Run the example again"). Needs tightening for a paper, even a draft.

  Let's write the response.cw
answer: |-
  Here are the comments, organized by your six questions. I've kept the tone direct.

  ### 1. The Focus/Scope Analogy: Load-bearing or Fatal?
  It is load-bearing, and currently, it is the point where the linguists will attack. The distinction is not merely presentational; it is categorical. Scope is a semantic/compositional mechanism (determining truth conditions via LF). Focus/Background is an information-structural mechanism (determining relevance via context).

  **The Fatal Flaw:** If you claim the wide/narrow contrast *isn't* a scope contrast but *is* a focus contrast, you owe an explanation of how truth conditions change without scope movement. If the truth conditions *do* change (which they must, to solve the Russell puzzle), you effectively have scope. If you say "focus determines scope," you are safe, but you must stop saying "it isn't a scope contrast."

  **The Fix:** Don't deny scope. Deny that scope is *ambiguous* in the lexicon. Argue that LF scope movement is *driven* by Information Structure (QUD). The grammar generates one LF, but the interface rules map Given material to wide scope and New material to narrow scope (or vice versa, depending on your specific claim). If you frame it as "Pragmatics drives Syntax," you survive. If you frame it as "It's Pragmatics instead of Syntax," the linguists will show you truth-conditional differences that pragmatics can't touch without covert operators.

  ### 2. The "Self-Undermining" Claim
  You are correct on the reconstruction. On Russell's analysis, "The F does not exist" with wide scope parses roughly as: *There is exactly one F, and it does not exist.*
  Since the existential quantifier in the first conjunct entails existence, the conjunction is a logical contradiction (necessarily false), not merely contingently false.
  **Nuance:** Be careful with the word "contradiction." It is a contradiction *given Russell's formalization of existence*. If existence is a predicate, it's a contradiction. If existence is a quantifier, it's a logical falsehood. For your purposes, "logically incoherent" is the safe term. This part of the argument is solid.

  ### 3. Attitude Reports (The Hard Case)
  You asked for a counterexample to show the Givenness account can't extend easily. Here it is:

  **The "Specific but Discourse-New" Case.**
  *Context:* We are watching a stranger across the room. I don't know who he is, and we haven't talked about him. He is not "Given" in the discourse.
  *Utterance:* "I hope the man in the corner leaves soon."
  *Reading:* De Re (Wide). I have a specific individual in mind (the guy I'm looking at). I am not hoping that whoever fits the description leaves; I am hoping *that guy* leaves.
  *Problem for your theory:* The descriptive content ("man in the corner") is **New** (not supplied by QUD/Context), yet the reading is **Wide**. Your theory predicts New = Narrow (to avoid asserting existence/uniqueness incorrectly) or New = Wide (asserting existence). If New = Wide, you're fine here.
  *The Real Killer:* **The "Non-Specific Discourse-Given" Case.**
  *Context:* We are discussing the rules of a game we are about to play. "The winner" is the topic (Given).
  *Utterance:* "I doubt the winner will be happy."
  *Reading:* De Dicto (Narrow). I doubt there will be a winner who is happy.
  *Problem:* The description is Given (part of the game rules/QUD), but the reading is Narrow. Your theory links Given to Wide (Topic = Wide). Here Given = Narrow.
  *Verdict:* Givenness does not track De Re/De Dicto cleanly enough to do the heavy lifting without additional machinery (like specific vs. non-specific intent). You may need to concede that attitude contexts involve a separate mechanism (e.g., acquaintance relations) that overrides the QUD constraint.

  ### 4. The Strawson Move: Too Cute?
  Yes, it is vulnerable to the **Projection Objection**.
  Strawson's intuition isn't just that the sentence is infelicitous without a QUD; it's that the presupposition survives embedding.
  *Example:* "If the King of France is here, he will be happy."
  Even if the QUD is "Who is here?", the presupposition that there is a King projects out of the conditional. Your account explains the simple assertion well (QUD supplies topic), but it struggles to explain why the "topic requirement" persists inside operators where the QUD shouldn't force an existence claim.
  **Where the accusation bites:** When a linguist asks, "Why does the presupposition project through negation and modals if it's just a matter of what question is being answered?" If you say "It's pragmatic," they will show you pragmatic effects that don't project. You need to explain why this specific pragmatic constraint behaves like a semantic one.

  ### 5. Counterexample Context (Predicting the Wrong Reading)
  You asked for a context where your account predicts the wrong reading.
  **Context:** A child is drawing a picture. She hasn't drawn a king yet, but she plans to. The concept is "New" (not on the table).
  **Utterance:** (Pointing to a blank spot) "The King of France won't go here."
  **Your Prediction:** Since "King of France" is New/Asserted, it should take Wide Scope. This would imply: *There is a King of France, and he won't go here.* (False/Incoherent).
  **Actual Reading:** Narrow. *It is not the case that (The King of France goes here).* The sentence is perfectly coherent and true, despite the description being discourse-new.
  **Why this hurts:** You claim New content forces Wide scope (or that Wide scope is the only option for New content). Here we have New content + Narrow scope + Coherence. This suggests speakers can treat descriptions as Narrow even when they aren't "Given" in the QUD sense, likely because the context (fiction/drawing) suspends existence commitments generally.

  ### 6. Structural Critique
  It reads like a seminar presentation, not a paper draft.
  **The Problem:** You use too many meta-commentary markers ("My claim is," "Two things I think this buys us," "The hard case for me," "I want to say"). This undermines authority. It sounds like you are thinking out loud rather than presenting a finished position.
  **The Fix:**
  1.  **Delete the hedging.** Instead of "My claim is that...", write "The wide/narrow contrast is not..."
  2.  **Integrate the "buy us" section.** Don't list benefits. Make the benefits the conclusion of the argument. "This explains the odd locality of the distinction..." should follow directly from the analysis, not be listed as a perk.
  3.  **Own the limitation.** Instead of "The hard case for me... I don't yet have an answer," write "Attitude reports present a limit case. While the QUD account explains X, it requires supplementation for Y." Treat the gap as a boundary condition of the theory, not a personal stumbling block.
  4.  **Tighten the prose.** "Everyone teaches..." is a bit colloquial. "Standard expositions treat..." is better for a grad group.

  **Summary:** The core insight (QUD drives the appearance of scope) is worth a month of work, but only if you formalize the relationship between Information Structure and LF. If you leave it as "it's focus, not scope," the linguists will dismantle it. If you make it "Focus determines LF scope," you have a viable paper.
