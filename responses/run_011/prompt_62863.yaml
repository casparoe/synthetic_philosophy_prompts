answer: |-
  Your hypothesis is correct. This is not a factual dispute, nor is it merely semantic squabbling over the word "neutral." It is a teleological clash regarding the function of the finding aid itself. Camp A operates under a **provenancial** model: the description is a proxy for the creator's activity, and introducing absence implies a claim about that activity which cannot be proven. Camp B operates under a **user-centric** model: the description is a map of the holdings as they exist now, and omitting known gaps misleads the researcher.

  They are indeed arguing past each other under the shared label of "description." Camp A answers "What did the creator do?" while Camp B answers "What is in the boxes?" Because they agree on the facts but disagree on the *purpose* of the metadata, no amount of historical evidence will resolve the deadlock.

  What would move it is a **distinction**. You can resolve this by separating the note types. Camp A's concerns belong in an "Administrative History" note (documenting the creator's known activities). Camp B's concerns belong in a "Scope and Content" or "Processing Information" note (documenting the physical reality of the accession). By bifurcating the metadata fields, you allow both the evidential record and the epistemic resource to coexist without contradicting one another.

  Verdict: different-questions They define description's purpose differently.
