answer: |-
  This is a profound impasse, one that cuts to the heart of the philosophy of cognitive science as applied to machine learning. To assist in breaking it, I shall offer a concrete hypothetical case that satisfies your stipulations, followed by an analysis of what such a case implies for the realism of neural representations.

  ### The Example: The 'Silent Concept' Neuron

  Consider a hypothetical image classification system, a multi-layer perceptron trained to distinguish between various animals. Let us focus on a single neuron, $N$, located in a hidden layer deep within the network.

  **Genealogical Autonomy:**
  An investigator is granted access to the numerical values of the weights feeding into neuron $N$, but is told nothing about the training data (e.g., whether it was ImageNet or medical X-rays), the objective function (e.g., cross-entropy loss), or the specific architectural blueprint (e.g., number of layers or activation functions). By inspecting the weight vector of $N$, the investigator observes that the values form a spatial pattern isomorphic to a template for 'canine faces'. The positive weights align precisely with the typical pixel locations of eyes, noses, and ears of a dog, while negative weights align with the background. The investigator can ascribe the content 'dog detector' to $N$ purely on the basis of this structural isomorphism. They did not need to know *why* the weights are so (the training history) to see *that* they are so. The ascription is genealogically autonomous.

  **Not Causally Load-bearing:**
  However, when the investigator performs interventions on $N$, the ascription fails to predict the system's behaviour. If they ablate $N$ (set its activation to zero) or clamp it to maximum activation, the model's classification output remains unchanged. It transpires that the weights feeding *out* of $N$ into the subsequent layer are effectively zero, or that there exists a redundant parallel pathway in the network that carries the same information and dominates the decision logic. Consequently, while $N$ structurally encodes 'dog', intervening on it does not alter the model's behaviour in the direction or manner the ascription predicts. The state is causally inert regarding the output.

  ### What This Case Shows

  In my view, this case strongly supports an **instrumentalist** verdict regarding the representation. If an internal state is genealogically autonomous but not causally load-bearing, it is best understood as a structural artefact or an epiphenomenon rather than a genuine representation.

  The intuition here is functionalist: for a state to count as a representation *of* something for the system, it must play a role in the system's economy of action. In the example above, neuron $N$ is akin to a map of a city found in a drawer of a navigation computer that has been disconnected from the routing software. The map is accurate (autonomous), and one can look at it and say, "This represents London." However, because the computer does not use it to navigate, the computer itself does not represent London via that map. The ascription is useful for *us* (the investigators) to understand the history of the weights, perhaps indicating that the network *once* relied on this feature or that the optimisation landscape naturally favoured such a configuration. But it is not a representation that the system *uses*. Therefore, the network does not genuinely represent 'dog' via $N$; rather, $N$ is a relic that merely resembles a representation.

  ### The Opposite Direction

  Now, consider the converse case: a state that is **causally load-bearing but not genealogically autonomous**.

  Imagine a distributed pattern of activation across a hundred neurons that, when intervened upon (e.g., via a specific linear combination), reliably flips the model's output from 'positive sentiment' to 'negative sentiment'. However, an investigator looking at the weights or activations without knowledge of the training data or objective would find nothing intelligible. The pattern looks like noise; it does not cluster neatly, nor does it resemble any obvious feature of the input. The ascription 'sentiment representation' is only possible because we know the training objective was sentiment analysis and we have probed it with labelled data.

  Here, my verdict shifts towards **realism**. If the state is causally load-bearing, it is doing the work of the representation. The fact that it is opaque to an investigator lacking context speaks to the complexity of the encoding (perhaps due to superposition or high-dimensional entanglement), not to its ontological status. The system is functionally utilising that state to differentiate sentiment. To deny it the status of a representation because it is not human-readable would be to privilege human interpretability over the system's own functional architecture.

  ### Conclusion

  The divergence of these two conditions suggests that **causal load-bearing is the necessary condition for genuine representation**, while genealogical autonomy is merely a sufficient condition for *human-interpretable* representation.

  When the two come apart, as in your requested example, the lack of causal power renders the ascription instrumental. We call it a representation because it looks like one to us, not because it functions as one for the network. Conversely, if a state drives behaviour but lacks autonomy, it remains a genuine representation, albeit one that is cryptic. Thus, in your argument, the claim that interpretability establishes genuine representations holds water only insofar as the interpreted features are shown to be causally load-bearing. Autonomy alone grants us a convenient instrument for prediction and explanation, but not a window into the system's genuine cognitive states.
