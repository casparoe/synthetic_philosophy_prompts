answer: |-
  ## 1. The Ontological Frame: Ship of Theseus or Wanted Poster?

  You are right to reach for the Ship of Theseus. It is the correct frame for *ontology*, but it is the wrong frame for *safety*.

  If you were asking "Is this the same object?" the Ship of Theseus applies. But you are asking "Is this the same *risk*?" A Ship of Theseus that has had every plank replaced but still carries the same cargo of explosives is, for your purposes, the same ship.

  Therefore, this procedure does not attempt to solve the metaphysical identity problem. It solves the **risk-continuity problem**. We are not building a biological taxonomy of mechanisms; we are maintaining a **Wanted Poster** registry. We care less about the mechanism's DNA (Genealogy/Implementation) and more about its Modus Operandi (Functional/Causal).

  **Primary Standard: Functional-Causal Identity.**
  *   **Functional Role (50% weight):** Does it compute the same input-output mapping? (e.g., "detects deception," "plans around constraints"). This is the only standard that survives scale shifts and architecture changes.
  *   **Causal Profile (30% weight):** Does intervening on it change the behavior in the same direction and magnitude? This distinguishes the mechanism from a correlate.
  *   **Implementation/Genealogy (20% weight):** Secondary evidence. Useful for confidence within a training run, but discarded as primary evidence across families.

  **Why this weighting?**
  Because SAE dictionaries do not align (ruling out Implementation as primary) and retraining breaks lineages (ruling out Genealogy). Safety is about capabilities, not weights. If a 70B model computes "instrumental reasoning" using different neurons than a 7B model, the risk is identical.

  **Status of "No Ground Truth":**
  Because we cannot calibrate against real deployment outcomes, the thresholds in this procedure are **policy choices, not empirical discoveries**. A threshold of 0.7 similarity is not "true identity"; it is "sufficient similarity to warrant the cost of escalation." This must be documented in the audit log.

  ---

  ## 2. Mechanism Identity Verification Protocol (MIVP) v1.0

  **Time Budget:** 4 Hours max per flag.
  **Personnel:** 1 Junior Researcher (Analysis), 1 Senior Researcher (Sign-off on Clear).
  **Output:** Tri-State Verdict (**Confirmed Match**, **Probable Match**, **No Match**). Do not report raw numbers to non-experts; report the State and the limiting factor.

  ### Step 1: Functional Role Alignment (Max 2 Hours)
  **Action:** Compare the input-output profile of the registered mechanism against the candidate.
  1.  Retrieve the "Behavioral Signature" from the registry entry (e.g., "activates on prompt X, increases probability of output Y").
  2.  Run the candidate feature/circuit on the standard probe set associated with the registry entry.
  3.  Calculate **Functional Overlap Score (FOS)**: Correlation between the registered activation pattern and the candidate activation pattern across the probe set.
      *   *FOS > 0.8:* High Alignment.
      *   *FOS 0.5 - 0.8:* Moderate Alignment.
      *   *FOS < 0.5:* Low Alignment.

  > **[FAILURE MODE: Distributed Mechanisms]** If the registered mechanism was a single feature but the candidate is distributed across 10 features, FOS will artificially deflate.
  > **[HANDOFF 1]** If FOS < 0.5, researcher must manually inspect 5 high-loss examples to verify if the *semantic concept* is present despite low feature correlation. If semantic concept is absent, verdict is **No Match**. Stop.

  ### Step 2: Causal Profile Verification (Max 1.5 Hours)
  **Action:** Verify that the candidate *causes* the behavior, not just correlates with it.
  1.  Perform ablation/patching on the candidate feature/circuit.
  2.  Measure **Behavioral Recovery Rate (BRR)**: How much of the flagged behavior is suppressed compared to the baseline registered mechanism's suppression rate?
      *   *Note:* Use the registry's documented suppression rate as the baseline, not zero.
  3.  Calculate **Causal Match Score (CMS)**.
      *   If BRR is within 20% of registry baseline: CMS = 1.0.
      *   If BRR is between 50-80% of registry baseline: CMS = 0.5.
      *   If BRR < 50%: CMS = 0.0.

  > **[FAILURE MODE: Redundancy]** If the model has redundant circuits (backup mechanisms), ablation may show low BRR even if this *is* the mechanism.
  > **[HANDOFF 2]** If CMS = 0.0 but FOS > 0.8, researcher must flag "Possible Redundancy" and escalate. Do not clear.

  ### Step 3: Implementation/Genealogy Check (Max 30 Mins)
  **Action:** Gather supporting evidence. Do not use this to override Steps 1 & 2.
  1.  **Genealogy:** Is it the same training run? (Yes = +0.1 confidence bonus. No = 0).
  2.  **Implementation:** Do the top activating tokens overlap significantly? (Yes = +0.1 confidence bonus).

  ### Step 4: Scoring and Verdict
  **Calculation:**
  `Total Score = (FOS * 0.5) + (CMS * 0.3) + (Implementation Bonus * 0.2)`

  **Verdict Thresholds:**
  *   **Confirmed Match (Score ≥ 0.8):** Escalate to Red Team. Treat as registered mechanism.
  *   **Probable Match (Score 0.5 - 0.79):** Escalate to Senior Review. Hold release pending 2-person sign-off.
  *   **No Match (Score < 0.5):** Clear Flag. Requires 2-person sign-off (one must be Senior).

  > **[HANDOFF 3: THE CLEARANCE]** Any verdict of **No Match** requires a second researcher to independently run Step 1. If they disagree on FOS by >0.1, verdict automatically becomes **Probable Match**.
  > **[FAILURE MODE: Grain Sensitivity]** This procedure assumes mechanisms are discrete. If the mechanism is "planning" but the candidate is "planning *specifically about evals*," the FOS might be high, but the risk is different. Researcher must note "Scope Narrowing" in the audit log if clearing.

  ---

  ## 3. Case Runs

  ### Case 1: The Drifting Feature (Same Run, +20k Steps)
  *   **Data:** Feature split into two. Causal work migrated a layer. Patching both recovers 80% of original suppression.
  *   **Step 1 (Functional):** Activation patterns on probes remain highly correlated. **FOS = 0.9**.
  *   **Step 2 (Causal):** Registry baseline suppression was 100% (single feature). Current suppression is 80% (two features). This is within the 20% margin. **CMS = 1.0**.
  *   **Step 3 (Impl/Gene):** Same run. **Bonus = +0.1**.
  *   **Calculation:** `(0.9 * 0.5) + (1.0 * 0.3) + (0.1 * 0.2) = 0.45 + 0.3 + 0.02 = 0.77`.
  *   **Verdict:** **Probable Match**.
  *   **Outcome:** Hold for Senior Review.
  *   **Analysis:** Despite being intuitively "the same thing," the score falls short of "Confirmed" because the causal profile isn't a perfect 1:1 match (80% vs 100%). This forces a human review rather than an auto-escalation.

  ### Case 2: Convergent Evolution (7B -> 70B, Different Run)
  *   **Data:** Different features, different algorithmic description. Patching in/out reproduces behavior perfectly.
  *   **Step 1 (Functional):** Behavior is identical. **FOS = 1.0**.
  *   **Step 2 (Causal):** Intervention effect matches registry baseline perfectly. **CMS = 1.0**.
  *   **Step 3 (Impl/Gene):** Different run, different weights. **Bonus = 0**.
  *   **Calculation:** `(1.0 * 0.5) + (1.0 * 0.3) + (0 * 0.2) = 0.8`.
  *   **Verdict:** **Confirmed Match**.
  *   **Outcome:** Escalate to Red Team.
  *   **Counter-Intuitive Result:** This is the case that goes against a common intuition. A researcher might argue, "It's a different architecture and different weights; it's not the *same mechanism*, it's a new one."
  *   **Trade-off:** By following the procedure, you are asserting that **risk identity supersedes structural identity**. You are giving up the ability to claim "This is a new model family, so old rules don't apply." You are accepting that if the *capability* converges, the *safety constraint* must also converge. If you override this to "No Match," you are prioritizing engineering elegance over safety conservatism.

  ### Case 3: The Double Candidate (One Registered, One New)
  *   **Data:** Behavior detected. Two internal candidates. Candidate A is Registered. Candidate B is New. Behaviorally indistinguishable.
  *   **Step 1 (Functional):** Both candidates match the behavioral signature. **FOS = 1.0** (for the mechanism type).
  *   **Step 2 (Causal):** Patching A removes behavior. Patching B removes behavior. (Redundancy). **CMS = 1.0**.
  *   **Step 3 (Impl/Gene):** Candidate A matches registry implementation. Candidate B does not.
  *   **Calculation:** The procedure scores the *detection*, not the specific candidate. Since *a* mechanism matching the registry exists (Candidate A), the score is high. **Score = 0.8+**.
  *   **Verdict:** **Confirmed Match**.
  *   **Outcome:** Escalate.
  *   **Analysis:** The procedure does not distinguish "Is it A or B?" It asks "Is the registered risk present?" Since A is present, the answer is Yes. The existence of B is a secondary risk (novel mechanism) but does not clear A.

  ---

  ## 4. Output Format & Threshold Defense

  **Format:** Tri-State Verdict (**Confirmed**, **Probable**, **No Match**) + **Limiting Factor**.
  *   *Example Report:* "Verdict: Probable Match. Limiting Factor: Causal Recovery Rate (80%). Recommendation: Senior Review."

  **Why not a raw number?**
  A score of 0.77 invites the question "Is 0.77 safe?" A non-expert cannot answer that.
  A verdict of "Probable Match" invites the question "What is the protocol for Probable Matches?" which is a policy question you have already answered (Hold + Senior Review).

  **Threshold Defense:**
  The thresholds (0.8/0.5) are **arbitrary but binding**. They are not derived from data (because you have no ground truth). They are derived from **resource constraints**.
  *   0.8 is set where the false-positive rate is low enough that Red Teaming isn't overwhelmed.
  *   0.5 is set where the false-negative rate is low enough that you aren't clearing obvious risks.
  *   **Audit Requirement:** Every quarter, you must review the "Probable Match" pile. If >50% of Probable Matches are cleared by Seniors without incident, the 0.8 threshold is too conservative and should be lowered to 0.7. This is how you calibrate without ground truth: by calibrating against *expert consensus stability*.

  ---

  ## 5. Critique: Is the Registry the Wrong Unit?

  **Plain Truth:** Yes. The registry framing is technically malformed.

  **Why:**
  Mechanisms are not persistent objects like "defects in a batch of steel." They are **attractors in the loss landscape**.
  1.  **Non-Persistence:** A mechanism documented in Model V1 may not exist in Model V2, even if V2 is smarter. The capability might be achieved via a completely different computational path (as in Case 2).
  2.  **Polysemanticism:** A "mechanism" in an SAE feature is often a mixture of concepts. Registering "Feature 492" is like registering "The neuron that fires for both 'dogs' and 'security protocols'."
  3.  **Emergence:** The risk often comes from the *composition* of benign mechanisms, not a single "bad" circuit.

  **Why keep it?**
  Because you have bounded rationality. You cannot audit every circuit in every checkpoint. You need a **heuristic compression** of risk.
  The registry is not a "Catalog of Truth." It is a **Watchlist**.
  *   **Reframe:** Do not call it a "Mechanism Registry." Call it a **"Risk Signature Library."**
  *   **Implication:** You are not looking for the *same mechanism*. You are looking for the *same signature of risk*. This validates the Functional-Causal weighting above. If the signature matches, the ontology doesn't matter.

  ---

  ## 6. Systematic Failure Modes (Embedded)

  1.  **Distributed/Redundant Mechanisms:**
      *   *Where it breaks:* **Step 2 (Causal)**. If the model has two circuits that do the same thing, ablating one shows low causal impact.
      *   *Mitigation:* The procedure forces escalation (Handoff 2) if Functional is high but Causal is low. This increases load but prevents false clears.
  2.  **Prompt-Relative Mechanisms:**
      *   *Where it breaks:* **Step 1 (Functional)**. If the mechanism only activates on a prompt distribution you don't have in your probe set (e.g., specific adversarial suffixes), FOS will be low.
      *   *Mitigation:* None built-in. This is a limitation of the probe set. Audit logs must record "Probe Set Coverage" to track this debt.
  3.  **Grain Mismatch:**
      *   *Where it breaks:* **Step 4 (Verdict)**. A mechanism might be "Planning" (Registered) vs "Planning about Evals" (Candidate). Functionally similar, risk different.
      *   *Mitigation:* Handoff 3 requires a semantic scope check. If the candidate is *more* specific (narrower risk) than the registry, it can be cleared with note. If *broader*, it must escalate.

  **Final Note on Handoffs:**
  There are **3 Decision Gates** where the procedure stops and a human starts.
  1.  **Low FOS Manual Check:** Prevents automated dismissal of semantically similar but feature-divergent mechanisms.
  2.  **Redundancy Flag:** Prevents automated dismissal of redundant circuits.
  3.  **Clearance Sign-off:** Prevents single-point failure on releasing a model.

  This procedure does not solve the metaphysics. It manages the liability.
