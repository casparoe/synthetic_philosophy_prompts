      *   **Round 4: Wittgenstein §204 (Acting).**
          *   Marcus: It's about what they *do*. They still hunt bugs elsewhere.
          *   Elena: Their actions show a shift in commitment.
      *   **Round 5: The Complication (Bank Statements & Unrelated Subsystems).**
