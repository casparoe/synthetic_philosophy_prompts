      *   **Closing:** One sentence claims + Assessment.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Make sure Elena doesn't sound like a relativist. She's a Quinean naturalist. Logic is revisable *within* science, not arbitrarily.
      *   *Critique:* Make sure Marcus doesn't sound like he thinks logic is *a priori* in a Kantian sense. Hinges are not truths; they are rules/grammatical.
      *   *Focus on the Bank Case:* This is crucial. If they accept $P \land \neg P$ in code but not in finance, does that save the Hinge view? Marcus will say yes (different language games). Elena will say no (it shows logic is domain-relative, hence revisable).
      *   *Wittgenstein §204:* "Giving grounds, however, justifying the evidence, comes to an end;—but the end is not certain propositions' striking us immediately as true, i.e. it is not a kind of seeing on our part; it is our acting which lies at the bottom of the language-game." Marcus needs to use this to show that the engineers' *action* (ignoring the bank contradiction) proves the hinge remains there, even if their *talk* suggests otherwise.

  5.  **Drafting the Dialogue (Iterative Process):**
      *   *Start:* Elena sets the stage. The classical monitor failed.
      *   *Marcus:* It's a tool change, not a truth change.
