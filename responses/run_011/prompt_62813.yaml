  *(Self-Correction on the Bank Case)*: I need to make sure the bank case doesn't just look like "logic is context dependent." For Quine, logic is global but revisable. For Wittgenstein, logic is grammatical and local to the practice. The tension is: Is the bank case proof that non-contradiction is still a hinge (just in a different game) or proof that it's a belief that is held firmly in finance but loosely in code? I need to make sure both sides leverage this well.

