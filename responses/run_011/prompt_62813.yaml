      *   *Marcus:* Distinguish the rule from the move.
      *   *Elena:* Is a hinge just a belief you refuse to call a belief?
      *   *Marcus:* No, because you can't verify a hinge.
      *   *Complication:* Bring in the bank statement.
      *   *Elena:* They use paraconsistency in navigation *and* diagnostics now. It's spreading.
      *   *Marcus:* But not finance. Why? Because finance *requires* exclusivity.
