prompt: |-
  On a school trip to the Natural History Museum I saw a drawer containing a single dried bird, labelled as the type specimen of its species. The guide explained that the name is pinned to that individual body: it stays attached to it even if the bird turns out to have been a hybrid, an albino, a juvenile, or one of a pair of species that look identical, and even if the population it came from has since changed. As I understand it, anyone naming a new animal species today has to designate an actual specimen, which is then deposited in a collection; a written description on its own will not do, though I have read that people argue about whether a photograph or a DNA sequence ought to count.

  What confuses me is that this looks like a rule about pointing rather than about discovering. It is as though the joint in nature falls wherever one particular dead bird happens to sit. And yet taxonomists talk as though the boundaries they draw are out there to be found, and they split and lump species whenever the evidence changes, which suggests the type is meant to track something independent of itself.

  Could you reconstruct as explicitly as you can the theory of natural kinds this practice presupposes — what it assumes about essences, about whether a species is a historical individual rather than a class of similar things, and about reference being fixed by ostension and a chain of usage instead of by a description? Then separate what the practice strictly requires from what it merely sits comfortably with: could a convinced conventionalist, who thinks species boundaries are useful fictions we draw for the sake of communication, run exactly the same museum rules without embarrassment? And is anything internally unstable about pinning a name to one possibly atypical individual while claiming to carve nature at its joints?

  Please also tell me what would change your mind here: which argument, or which fact about how taxonomists actually work, would push you to a different verdict, and where your reconstruction is most likely to have gone wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Observation:** The user saw a type specimen in a museum.
      *   **Key Fact:** The name is pinned to *that specific individual*, regardless of its atypicality (hybrid, albino, etc.) or changes in the population.
      *   **Requirement:** New species need a physical specimen (holotype), not just a description (though photos/DNA are debated).
      *   **The Tension:** This looks like a rule about *pointing* (ostension/naming convention) vs. *discovering* (realism/natural kinds). It seems arbitrary ("wherever one particular dead bird happens to sit") yet taxonomists act as if boundaries are real ("carving nature at its joints").
      *   **Tasks:**
          1.  Reconstruct the theory of natural kinds presupposed by this practice (essences, individuals vs. classes, reference fixing).
          2.  Separate strict requirements from comfortable accommodations (Could a conventionalist use these rules?).
          3.  Analyze internal stability (Is pinning a name to an atypical individual while claiming realism unstable?).
          4.  Identify what would change my mind (falsifiability/limitations of the reconstruction).

  2.  **Task 1: Reconstructing the Presupposed Theory of Natural Kinds:**

      *   *Reference Fixing:* This is classic Kripke/Putnam causal-historical theory of reference. The name is rigidly designated to the specimen. The description doesn't fix the reference; the ostensive act does.
      *   *Ontological Status (Individual vs. Class):* The "Type Specimen Concept" leans towards Species-as-Individuals (Ghiselin/Hull). The species is a spatiotemporally bounded lineage. The type specimen is an anchor point in that lineage. However, the *name* applies to the class of organisms belonging to that lineage.
      *   *Essences:* It rejects traditional Aristotelian essentialism (necessary and sufficient morphological traits). Instead, it implies a *historical essence* (genealogical connection to the type). If the type is an albino, "albinism" isn't the essence, but "descended from the population containing this type" is the anchor.
      *   *Realism:* The practice assumes there *is* a fact of the matter about which other organisms belong to the same group as the type. The type is the anchor, not the definition.

  3.  **Task 2: Conventionalism vs. Realism (Strict Requirements vs. Comfort):**

      *   *Strict Requirements:* The Code (ICZN, ICN) requires a type. It requires stability of nomenclature. It does *not* require the type to be "typical." It does *not* require the taxonomist to believe in real species boundaries.
      *   *Conventionalist Compatibility:* Yes, a conventionalist can use these rules. For them, the type is just a "standard meter" in Paris. It's a linguistic anchor to prevent talking past each other. "Species X" just means "Organisms similar enough to *this* bird for our current purposes." The rule ensures everyone points to the same standard, even if the category is fuzzy.
      *   *Comfort:* Realists feel more comfortable because the type anchors a real lineage. Conventionalists feel comfortable because it stabilizes language.

  4.  **Task 3: Internal Stability (The Tension):**

      *   *The Problem:* If the type is a hybrid or monster, and we say the species is "real," does the species include the hybrid's other parent's lineage?
      *   *Resolution:* Taxonomy handles this via revision. If the type is discovered to be a hybrid, the name might become a *nomen dubium* or be suppressed, or the concept of the species shifts to match the type (even if it means splitting a previously thought single species).
      *   *Instability:* There is a tension between *nomenclatural stability* (the name stays with the type) and *conceptual stability* (the idea of the species changes). The system prioritizes the name's attachment to the object over the object's representativeness. This is stable *pragmatically* but ontologically awkward if one insists the type *must* represent the "essence."
      *   *Verdict:* It's not internally unstable *if* one accepts the Species-as-Individuals view. The type is a sample of the lineage. If the sample is weird, the lineage definition adjusts, but the name stays.

  5.  **Task 4: What Would Change My Mind (Falsifiability):**

      *   *Reconstruction Flaw:* Maybe I'm over-intellectualizing. Maybe taxonomists don't care about philosophy at all.
      *   *Fact that shifts verdict:* If taxonomists routinely discarded types when they were "atypical" (they don't, they petition to suppress names). If DNA barcoding replaced types entirely (it hasn't, types are still required). If the Codes explicitly adopted a purely phenetic definition (they moved towards phylogenetic).
      *   *Weak point:* The assumption that the practice *presupposes* a specific metaphysics. It might be metaphysically agnostic.

