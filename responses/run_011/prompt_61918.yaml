      *   *Section 2: Conventionalism.* Can a conventionalist play? Yes. The type is a linguistic standard. Like the kilogram prototype. It stabilizes communication, not ontology.
      *   *Section 3: Internal Stability.* Address the "atypical type" problem. The system prioritizes nomenclatural stability over descriptive accuracy. This creates friction but not collapse. The "joints" are hypothesized, the name is fixed.
      *   *Section 4: Changing My Mind.* What evidence would undermine this? If the Codes changed to allow description-only. If taxonomists treated types as discardable when "wrong." If the "Species as Individuals" thesis was universally rejected in favor of pure clustering.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* Be careful not to say the type *defines* the species. It anchors the name. The *concept* of the species is separate from the *name*. This is the crucial distinction (Nomenclature vs. Taxonomy).
      *   *Nuance:* The user asks about "carving nature at its joints." I need to explain that the *name* is conventional, but the *grouping* aims to be real. The type bridges the two.
