      *   *Experiments:* "Measured Landauer bound." -> Acceptable (Bérut et al.).
      *   *Identity:* "Entropy and information are literally the same quantity." -> Mistaken. One is physical state space volume, the other is epistemic/correlational. They map via Boltzmann constant, but aren't "literally the same."
