  5.  **Historical Deep Dive (Brillouin vs. Bennett):**
      *   The text says Bennett *refined* Brillouin. This implies Brillouin was mostly right but needed tweaking.
      *   *Reality:* Brillouin argued measurement *itself* costs energy (negentropy). Bennett argued measurement can be reversible (costless), but *resetting* the memory costs energy. This is a conceptual inversion, not just a refinement. It shifts the locus of entropy production from the *input* channel to the *memory reset*.
      *   "Century": Maxwell (1867) to Bennett (1982) is roughly a century, but Szilard (1929) solved the core logic much earlier. Saying it went "unanswered" ignores Szilard's engine.

  6.  **Addressing the "Case-Closed" Tone & Dissent:**
