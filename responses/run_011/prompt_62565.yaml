      *   *Impact:* The passage isn't "wrong" in the mainstream view, but it presents a specific narrative (Landauer-Bennett) as the *only* truth. It ignores the Sagawa-Ueda generalization which is more precise for feedback control. It also ignores the Norton/Earman critique which questions the fundamentality of Landauer's principle itself.
