answer: |-
  Here is the specification sheet for a normative theory of communication adequate to your seminar and the Amsterdam/Osaka policy conflict.

  ### The Desiderata

  **1. The Modalities Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must assign normative value to four distinct channels: explicit assertion, pragmatic implicature, expressive register (tone/format), and strategic silence. It cannot treat anything other than explicit assertion as "noise."
  *   **Consideration:** Your raw material identifies that "dishonesty" happens in silence and tone as much as in propositions. A theory that only polices explicit falsehoods allows the "honest brute" to weaponize bluntness (violating register) and the "polite evader" to weaponize silence. For the Osaka office, silence *is* content; for Amsterdam, it is often negligence. The theory must be able to say when a silence is a lie and when a "thank you" is a lie, without equating the two.

  **2. The Convention Anchor (Non-Negotiable)**
  *   **Requirement:** The theory must explicitly state whose linguistic and social conventions fix the *content* and *force* of an utterance: the Speaker's, the Hearer's, or a Shared Contextual Standard.
  *   **Consideration:** This is the core of the Amsterdam/Osaka fight. If content is fixed by the Speaker, the Dutch manager is blameless when offending the Japanese employee (they intended respect). If fixed by the Hearer, the Dutch manager is negligent for not mastering Japanese norms. If fixed by a Shared Standard, the theory must explain how that standard is generated in a hierarchy where one culture (HQ) holds more power. A theory that leaves this ambiguous allows both sides to claim moral victory.

  **3. The Livability Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must permit standard phatic communion (pleasantries, white lies, softened refusals) without requiring complex moral justification for every instance.
  *   **Consideration:** If the theory implies that "Lovely to see you" is a lie whenever you are tired, it makes ordinary social life pervasively immoral. This is a *reductio ad absurdum* for strict truth-telling views. For the policy context, if employees feel they need ethical clearance to say "good morning," the policy will be ignored. The theory must distinguish between *social lubrication* and *deceptive manipulation*.

  **4. The Harm/Candour Balance (Non-Negotiable)**
  *   **Requirement:** The theory must identify conditions under which strict truthfulness constitutes a moral wrong (cruelty) and conditions under which politeness constitutes a moral wrong (paternalism/negligence).
  *   **Consideration:** This addresses the "honesty as alibi" colleague. Directness can be a form of aggression; tact can be a form of carelessness. The theory needs a metric for "reasonable expectation of uptake." If I tell you the hard truth in a way I know you cannot hear (due to culture or emotion), have I been honest? The theory must account for the *efficacy* of the truth, not just its accuracy.

  **5. The Blameless Ignorance Clause (Prejudice Alert)**
  *   **Requirement:** *Proposed:* The theory must exonerate speakers who violate norms they could not reasonably be expected to know.
  *   **Consideration:** This feels intuitive, but it is often a shield for power. In a corporate hierarchy, the burden of translation usually falls on the subordinate (Osaka) to understand the HQ (Amsterdam), not vice versa. Demanding this clause often smuggles in a prejudice that maintains the status quo.
  *   **Verdict:** **Prejudice.** While morally attractive in the abstract, in a policy context this often codifies the dominance of the HQ culture. An adequate theory should likely place the burden of *coordination* on the party with more institutional power, rather than granting them immunity for ignorance.

  **6. The Culture-Independence Clause (Prejudice Alert)**
  *   **Requirement:** *Proposed:* The normative rules should apply universally regardless of local custom.
  *   **Consideration:** This is the demand that "honesty means the same thing in Osaka as in Amsterdam." As you suspected, this is a category error. While the *value* of trust might be universal, the *mechanism* for signaling trust is local.
  *   **Verdict:** **Prejudice.** A theory demanding culture-independent *rules of speech* will fail the Convention Anchor. It should demand culture-independent *requirements for coordination*, but allow culture-dependent *methods*.

  ### The Killer Constraint

  **The Convention Anchor is the single requirement that excludes the most otherwise attractive views.**

  Most philosophical theories of lying (especially Kantian and neo-Kantian ones) assume a universal semantics or prioritize the speaker's intent. They treat meaning as stable across contexts. By forcing the theory to decide *whose conventions fix the content*, you eliminate any view that treats language as a neutral medium.
  *   If the theory says "Speaker's Intent," it fails the Japanese staff (who experience harm despite good intent).
  *   If the theory says "Hearer's Uptake," it fails the Dutch staff (who are punished for norms they couldn't know).
  *   If the theory says "Shared Context," it must explain how to build that context in a fractured organization.
  This requirement forces the theory out of the armchair and into the mess of power dynamics and translation costs. It kills any theory that treats communication as merely the transmission of propositions rather than a coordination game.

  ### The Incompatible Pair

  **The Livability Constraint vs. The Convention Anchor.**

  I argue these two cannot be jointly satisfied without significant theoretical cost.
  *   **The Conflict:** The Livability Constraint requires that we can rely on standardized, low-effort scripts (pleasantries, standard feedback forms) without constant ethical calculation. We need "default settings" for honesty to make social life efficient. However, the Convention Anchor demands that we attend to *whose* conventions are governing the interaction. In a cross-cultural setting (Amsterdam/Osaka), the "default" for one is the "deviation" for the other.
  *   **The Consequence:** To satisfy Livability, you must standardize norms (e.g., "We are an Amsterdam-style company, so directness is the default"). But this violates the spirit of the Convention Anchor by privileging one culture's conventions as the "neutral" baseline. To satisfy the Convention Anchor fully, you must treat every interaction as a negotiation of norms, which destroys Livability by making every "good morning" a potential ethical minefield requiring calibration.
  *   **Why this matters:** For your seminar, this is the tension between *assimilation* and *accommodation*. For the company, this is the tension between *efficiency* (one policy) and *inclusion* (multiple norms). A theory that claims to solve both is likely hiding the cost somewhere.

  ### The Scorecard

  **1. Respect-for-Rational-Agency (The Prohibition View)**
  *   **Verdict:** Fails Livability and Convention Anchor.
  *   **Score:** It protects the individual's right not to be manipulated, making it strong on explicit lying. However, it treats all deception as a violation of autonomy, making standard politeness immoral. It assumes a universal rational agent, failing to account for how "respect" is culturally signaled (e.g., protecting face vs. protecting choice).

  **2. Practice-of-Trust (The Institutional View)**
  *   **Verdict:** Strong on Policy, Weak on Nuance.
  *   **Score:** Excellent for the company context; it frames honesty as maintaining the infrastructure of cooperation. It handles the "silence" issue well (silence erodes trust). However, it struggles when the "practice" itself is contested (e.g., if the Osaka office trusts *through* indirectness, but the institution rewards directness, the theory sides with the institution, not the trust).

  **3. Entitlement View (The Rights-Based View)**
  *   **Verdict:** Strong on Candour, Weak on Tact.
  *   **Score:** It solves the "when to speak" problem by asking "do they have a right to know?" This protects against paternalism. However, it is ill-equipped to handle "register deceit" or implicature, as these rarely violate strict informational rights. It also struggles to define entitlements across cultures where the "self" is defined differently (individual vs. group).

  **4. Tact-or-Virtue View (The Perceptiveness View)**
  *   **Verdict:** Strong on Nuance, Fails Action-Guidance.
  *   **Score:** It captures the "Harm/Candour Balance" best, allowing for context-sensitive judgment. It validates the Japanese concern for harmony and the Dutch concern for clarity as potential virtues depending on the situation. However, it is nearly impossible to codify into a global policy. "Be perceptive" is not a guideline HR can enforce or teach to a room of 500 employees.
