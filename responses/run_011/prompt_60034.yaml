      *   *Meta-Ontological Issues:* What makes a theory of composition *good*? This is the core of the user's request.

  3.  **Evaluate the User's Draft Requirements:**
      *   *Non-vacuity/Non-circularity:* Essential. If the answer uses "object" to define "composition," it's useless.
      *   *No Vagueness (Determinacy):* Highly contested. Lewis argues for universalism to avoid vagueness. Others accept vague composition. This is a major conflict point.
      *   *Conservatism (Common Sense):* Contested. Revisionary metaphysics (Nihilism/Universalism) rejects this. Eliminativists vs. Preservationists.
      *   *Applicability (Epistemic Accessibility):* Contested. Some metaphysical facts might be unknowable. But generally, a theory should be usable.
      *   *Compatibility with Science/Mereology:* Generally good, but "endless divisibility" might conflict with atomic theories.
      *   *Explanation (Non-Bruteness):* Contested. Brutalism says composition *is* brute.

  4.  **Develop the "Full Specification" (The Meta-Ontological Criteria):**
      *   I need to act as an expert guide, clarifying which constraints are methodological necessities and which are theoretical preferences.
      *   *Non-Negotiable:* Non-circularity (otherwise it's not an answer), Consistency (logic).
      *   *Contestable:* Common Sense (Conservatism), Determinacy (No Vagueness), Explanatory Depth.
      *   *Conflicts:* The "Trilemma of Composition" (Sider/Lewis style). You usually can't have Common Sense + Determinacy + Non-Arbitrariness all at once.
      *   *The "Killer" Constraint:* Usually, the demand for *non-arbitrariness* combined with *common sense* is what kills moderate restrictivism. Or the demand for *determinacy* kills moderate restrictivism.

  5.  **Drafting the Content - Step-by-Step:**

      *   **Introduction:** Acknowledge the sophistication of the question. It's a meta-ontological inquiry.
      *   **The Table:** Create a clear table listing the requirements, status (Non-negotiable/Contestable), and Camp association.
      *   **Prose Reasoning:**
          *   *Non-Circularity:* Must be non-negotiable. If you define composition using "object," you haven't answered *when* objects exist.
