  ### Reasoned Specification of Adequacy Conditions

  To specify what an adequate answer to the Special Composition Question (SCQ) must deliver, we must distinguish between logical necessities and theoretical virtues. The only **non-negotiable** requirements are **Non-Circularity** and **Non-Arbitrariness**. Non-Circularity is essential because an answer that defines composition using the notion of an "object" (e.g., "things compose an object when they form a unity") is vacuous; it presupposes the existence of the very thing it seeks to ground. Imagine a student answering "When do parts make a whole?" with "When they make a whole." This halts inquiry. Non-Arbitrariness is equally strict: if a principle posits a cutoff for composition, there must be a relevant difference between cases on either side. Consider two particles sliding toward one another. If composition begins exactly when they are 1 nanometer apart but not at 1.0000001 nanometers, there must be a metaphysical reason for this distinction. Without it, the cutoff is magical, violating the Principle of Sufficient Reason.

  The remaining requirements are **contestable commitments** that generate the central conflicts in the debate. **Determinacy** demands that there be no borderline cases of composition; either the parts compose a whole or they do not. David Lewis argued that if composition were vague, it would imply vagueness in logical quantifiers (e.g., "how many objects exist?"), which he deemed impossible. However, this is a prejudice of classical logic. If you reject this, you can accept vague composition, but you pay the price of complicating logic. **Conservatism** demands that the theory validate ordinary beliefs (tables exist, trout-turkeys do not). This is the prejudice of the "Common Sense Ontologist." If you prioritize this, you must accept moderate restrictivism. **Epistemic Accessibility** demands that humans can know when composition occurs. This is a pragmatist preference; a realist might argue that composition could occur in ways undetectable to us. **Explanatory Depth** demands that the theory explain *why* composition occurs, not just *that* it occurs. This rejects "Brutalism," which claims composition facts are fundamental and unexplained.

  The critical insight for your thesis is that a subset of these requirements is **jointly unsatisfiable** for any moderate view. Specifically, **Conservatism**, **Determinacy**, and **Non-Arbitrariness** form a trilemma. Consider the "sliding particles" scenario again. To satisfy **Conservatism**, composition must occur when particles form a table but not when they are scattered. To satisfy **Determinacy**, there must be a precise point where composition switches from false to true. To satisfy **Non-Arbitrariness**, there must be a metaphysical difference between that point and the one immediately preceding it. However, physical relations (distance, bonding) change gradually. There is no non-arbitrary precise cutoff in a continuous process. Therefore, you cannot have a precise cutoff (Determinacy) that respects physical continuity (Non-Arbitrariness) while also matching common sense (Conservatism). You must drop one. Dropping Conservatism leads to Universalism or Nihilism. Dropping Determinacy leads to Vague Composition. Dropping Non-Arbitrariness leads to Brutalism.

  The single requirement that does the **most work** in eliminating candidates is **Non-Arbitrariness**. It is the weapon used to dismantle every "moderate" view (contact, fusion, life). It forces the debate into the extreme corners (Universalism/Nihilism) because only "always" and "never" avoid arbitrary cutoffs entirely. Regarding your list, I **reject** "Compatibility with endless divisibility." This conflates metaphysics with contingent physics; whether atoms are divisible is a question for science, not a constraint on the concept of composition. I **demote** "Epistemic Accessibility." While desirable, metaphysical truth should not depend on human cognitive limits; if composition is brute or microscopic, our inability to detect it does not make the theory false.

  Universalism and Nihilism satisfy the logical constraints of determinacy and non-arbitrariness perfectly but fail conservatism by radically revising ordinary belief, either inflating reality with scattered objects or eliminating medium-sized dry goods. Organicism preserves conservatism for biological entities but collapses under the non-arbitrariness requirement, as it cannot specify a precise threshold for when biological activity begins without appealing to vague biological concepts, thereby reintroducing the indeterminacy it sought to avoid.
