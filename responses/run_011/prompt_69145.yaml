answer: |-
  The *Oakhaven Gazette* printed its last issue on a Tuesday in March. It was a thin edition, mostly obituaries and a recipe for lentil soup submitted by a woman who had died in 1998. By the following Monday, the URL was live. It had no name. It had no masthead. It was just a white page with black text, scrolling chronologically from the top.

  Arthur Penhaligon checked it every morning with his coffee. He was a history teacher at the high school, and he was the chairman of the Safety Committee, which meant he had the authority to cancel the Homecoming Bonfire. He had wanted to cancel it for three years. The field was too dry, the wood piles too close to the bleachers, the tradition too heavy to lift.

  But he never filed the paperwork. He waited for the town to be ready.

  Before the *Gazette* died, Arthur knew where the town stood. You could read the letters to the editor. You could see who signed them. Mr. Henderson hated the bonfire; he signed his name. The Booster Club loved it; they put their logo on the ad. You could count the votes. You could shake hands with the opposition.

  Now, there was only the site.

  The rule was absolute, enforced by a moderator who went by "Admin." No names. Not even first names. Not even initials. If you typed "I think," the post stayed. If you typed "I, John, think," the post vanished. Admin did nothing else. There were no likes, no shares, no upvotes. Just text. A stream of consciousness from a town of twelve thousand people, flattened into a single column of identical font.

  Arthur scrolled through the morning's posts while his toast cooled.

  *The bonfire is a safety hazard.*
  *The person above doesn't care about tradition.*
  *The person above doesn't care about safety.*
  *Why are we talking about fire when the roof is leaking?*
  *The roof person is ignoring the spirit of the school.*
  *Admin, delete this.*
  *Post removed.*

  It went on for pages. Nobody agreed, nobody disagreed, nobody concluded. They just added weight to the pile. Yet, by the time Arthur drove to school, he heard people saying it in the hallway. "The site is against the bonfire this year." Or, "The site is getting restless about the roof."

  There was no consensus. There was only the rumor of consensus.

  Arthur parked in the faculty lot. He had the form in his briefcase. It was a simple PDF. *Request for Cancellation of Event.* He had filled it out three times. He had deleted it three times. He wasn't afraid of being fired. He wasn't afraid of the parents. He was afraid of arguing with a room full of mirrors. If he cancelled it, who was he fighting? The Booster Club? They weren't there. The *Gazette* wasn't there to print his reasoning. There was only the site, and the site would just post his reasoning next to a joke about the cafeteria meatloaf, and the weight of it would be the same.

  The PTA meeting was held in the gymnasium that Thursday night. The bleachers smelled of varnish and old sweat. About fifty people showed up. Mrs. Gable was there. She had run the concession stand for twenty years. She wore a blazer that looked like it had been tailored for a general.

  She stood up during the open forum. She didn't have a microphone, so her voice cracked against the rafters.

  "I want to know who is running the website," she said.

  Principal Evans sat at the table in front of her. He looked tired. "We don't run the website, Martha."

  "Someone is hosting it. Someone is paying for the server."

  "We don't know who."

  "That is unacceptable," Mrs. Gable said. She turned to the audience. "We are being governed by a ghost. People are saying things about this school, about our budget, about our traditions, and there is no one to answer for it. I demand the editor stand up."

  She waited. The gym hummed with the fluorescent lights. Nobody stood. Nobody could. Even if the moderator was in the room, standing up would violate the rule. Admin would delete the post about standing up.

  "I write a letter," Mrs. Gable said, her voice rising. "I address it to the Editor. I demand a retraction on the sentiment regarding the budget. Where do I send it?"

  "There is no address," Evans said.

  "Then I will speak to the screen."

  "You can post," Evans said. "Like everyone else."

  "That is not accountability. That is shouting into a well." She sat down heavily. The wood creaked. "It is cowardice. All of it."

  Arthur watched her. She was right, but it didn't matter. She wanted a villain. She wanted a face to punch. But the site wasn't a villain. It was a hallway. It was a place where voices went to lose their source. When Mrs. Gable shouted, the site would post her shouting next to a recipe for pickles. The outrage would be averaged out. The pickle recipe would gain gravity; the outrage would become content.

  Arthur went home and opened his laptop. The site was busy.

  *PTA meeting was a circus.*
  *The woman in the blazer is right.*
  *The woman in the blazer is a tyrant.*
  *Why does everyone care about the bonfire?*
  *Because it's the only thing left.*

  Arthur typed: *The bonfire is dangerous.*
  He hovered over the enter key.
  He deleted it.
  He typed: *Safety must come first.*
  He deleted that too.

  If he posted it, he was just noise. If he didn't post it, he was complicit. The site didn't tell him what to do. It never did. It never said *Cancel the bonfire.* It never said *Keep the bonfire.* It just ensured that whatever was said belonged to no one. And because it belonged to no one, it belonged to everyone. The town began to move around the site's silence like water around a stone, carving channels where there was nothing solid.

  People started saying, "We can't cancel the bonfire, the site will revolt." Or, "We have to cancel it, the site is demanding safety." The site demanded nothing. The site was a mirror that showed you your own face blurred out.

  Arthur waited another week. The wood pile was delivered on a Tuesday. It was higher than last year. The students cheered when the truck backed into the field. Arthur stood in his classroom window and watched them stack the pallets. He felt a tightness in his chest. It wasn't fear. It was a kind of hollowness. He was waiting for permission to do his job. He was waiting for the town to become a person again so he could argue with it.

  On Friday, he opened the PDF. He filled in the date. He typed his name in the signature box. He attached the safety inspection report from the fire marshal, which cited three critical violations.

  He hit send.

  He closed the laptop. He made dinner. He watched the news, which was talking about a election in a country he couldn't find on a map. He went to bed.

  The next morning, the site was active.

  *The bonfire is cancelled.*
  *Finally.*
  *Tragedy.*
  *The administration is out of control.*
  *The administration is saving lives.*
  *Who signed the form?*
  *Does it matter?*
  *It matters.*
  *Admin, delete this name.*
  *Post removed.*
  *It doesn't matter.*
  *Nothing matters.*
  *See you at the game.*

  Arthur drank his coffee. The toast was burnt. He looked at the screen. The text scrolled, endless and identical. There was no victory here. There was no defeat. The bonfire was gone, but the town hadn't changed its mind, because the town didn't have a mind. It had a feed.

  He put on his coat. He walked to the car. The wood pile was still in the field, waiting to be hauled away. It looked like a monument to something that hadn't happened yet. Arthur started the engine. He drove to school. He would have to explain it to the students. He would have to stand in front of them and be the person who said no. He would be the only one.

  The site would discuss his decision until Tuesday. Then it would discuss the lunch menu. Then it would discuss the weather. The weight of his action would be distributed across a thousand anonymous comments until it weighed nothing at all.

  He parked the car. He picked up his briefcase. He walked toward the building. The wind was picking up, blowing leaves across the parking lot. They skittered together, then scattered, then gathered again in a corner, forming a shape that looked like a crowd, until the wind shifted and they were just leaves.

  Title: The Consensus of No One
