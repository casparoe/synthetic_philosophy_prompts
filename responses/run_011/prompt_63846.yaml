answer: |-
  Byung-Chul Han's Burnout Society wins with a 0.6 share of the novel's causal weight.

  1. **Weber (Protestant Ethic):** 8/10. Fits the moral suspicion of idleness and the secular drive to accumulate, but lacks the specific neoliberal "cheer" of the manager's self-exploitation.
  2. **Lafargue (Right to Be Lazy):** 8/10. Explains the working-class vice of loving work, though it frames it as infection rather than the internalized freedom Han describes.
  3. **Russell (In Praise of Idleness):** 7/10. Captures the shame of leisure well, but treats it as a static morality rather than a dynamic psychological achievement mechanism.
  4. **Keynes (Grandchildren's Possibilities):** 5/10. Explains the inability to use leisure psychologically, but fails to account for the active economic pursuit of second jobs.
  5. **Marx (Notebooks on Machinery):** 7/10. Structurally explains converting free time to surplus labour, but underestimates the voluntary, cheerful nature of the exploitation.
  6. **French 35-hour Week:** 4/10. Doesn't test well; the Aubry laws produced mixed leisure results, whereas your town shows a uniform increase in toil.
  7. **Karoshi (Overwork Death):** 2/10. Contradicted; the town has not reached physical collapse or official categorization, only hidden guilt.
  8. **Graeber (Bullshit Jobs):** 1/10. Contradicted; the work is measurable picks, not pointless bureaucracy, so the harm cannot be pointlessness.
  9. **Han (Burnout Society):** 10/10. Fits perfectly; the manager's unpaid cheerfulness and the workers' voluntary second jobs exemplify self-exploitation felt as freedom.
  10. **Textbook Labour Economics:** 3/10. Contradicted; rational utility maximization cannot explain the moral guilt associated with leisure time.

  **Tiers**
  *   **Tier A:** 9 (Han)
  *   **Tier B:** 1 (Weber), 2 (Lafargue), 3 (Russell), 5 (Marx)
  *   **Tier C:** 4 (Keynes), 6 (French 35h), 10 (Labour Econ)
  *   **Tier D:** 7 (Karoshi), 8 (Graeber)

  **Categorization**
  *   **Fits Nicely:** Han, Weber, Lafargue, Russell, Marx. These accounts align with the conversion of free time into toil and the stigma of leisure.
  *   **Doesn't Test:** Keynes, French 35h. These explain parts of the behaviour (psychological incapacity, empirical variance) but don't fully account for the moral texture or the uniform increase in hours.
  *   **Actively Contradicts:** Graeber, Karoshi, Labour Econ. For Graeber, the work would need to be perceived as pointless rather than measurable; for Karoshi, the town would need to produce recognized deaths rather than hidden guilt; for Labour Econ, the workers would need to act as rational utility maximizers without moral sanctions.

  **Tie-Breaker**
  No tie exists; Han is the clear winner. If Weber had tied, the separating plot point would be a character collapsing from exhaustion while claiming they love the work (Han) versus a character refusing leisure because God forbids it (Weber).
