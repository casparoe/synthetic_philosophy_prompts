prompt: |-
  I'm in a reading group that's been going around in circles on WWI responsibility for months — Fischer, the twenties revisionists, Clark's sleepwalkers, the whole thing — and lately one of us has been leaning hard on a tort analogy to try to close it out. The July crisis is like a multi-car pileup on a foggy motorway: nobody meant it, everybody did something careless, and afterwards you don't ask whose fault the crash was, you apportion it — contributory negligence, percentages. On that picture "Germany started the war" is just a sloppy way of saying Germany was the largest contributor, and the Fischer controvery was really an argument about percentages dressed up as an argument about causes.

  Audit the analogy for me. Correspondence table first: what's the fog, what's the road, what plays the role of the highway code, where is the single harm that gets divided up, who's the loss adjuster and where does their standing come from. Then the disanalogies, and I want them sorted into the ones that actually bite on the use we're putting it to versus the ones that are merely interesting. Four I'm already suspicious about: whether a pileup even has one harm when the 1914 outcomes were different for each participant (Russia loses an empire, Belgium gets overrun, Germany loses a war it plausibly could have won); whether but-for causation buys you anything when historians say a general European war was coming regardless of who lit it; whether pileup drivers can see each other and adjust in real time while a general staff in July 1914 is working off three-day-old telegrams and a railway timetable it can't switch off mid-run; and above all whether "fault" means anything at all without a body of rules every party accepts the authority of, which the highway code hands you and the pre-1914 alliance system arguably doesn't.

  Then the payoff question: does the conclusion survive once the disanalogies are on the table? Is "Germany was X% responsible" a claim the analogy can actually underwrite, or was the analogy carrying the entire idea that responsibility is quantifiable in the first place? While you're at it, does the sleepwalker image fare any better, or is it doing the same trick from the other direction — making blame look inapplicable rather than divisible? And where does that leave Article 231: the Allies wrote a legal finding of responsibility into the treaty itself, so does the fact that they reached for legal language make the tort frame more apt, or does it just show legal vocabulary being used to do non-legal work?

  Finish with what a better analogy would be if there is one — bar fight, poker game where one player keeps escalating, a misdiagnosis — or with the honest verdict that this whole family of analogies should be retired and what you'd put in its place instead. No bibliography, I know the literature, I just want the mapping and the audit.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A reading group debating WWI responsibility (Fischer, revisionists, Clark, etc.).
      *   **Core Task:** Audit a specific analogy: The July Crisis as a multi-car pileup (tort analogy).
      *   **Requirements:**
          1.  Correspondence Table (Fog, Road, Highway Code, Harm, Loss Adjuster/Standing).
          2.  Disanalogies (sorted by "biting" vs. "merely interesting"). The user suggests four specific ones (single harm, but-for causation/inevitability, real-time adjustment/communication, accepted rules/authority).
          3.  Payoff Question: Does "Germany was X% responsible" survive the audit? Is the analogy doing the heavy lifting for quantifiability?
          4.  Sleepwalkers Comparison: Does Clark's image fare better or is it the inverse trick?
          5.  Article 231: Does the legal language in the Treaty of Versailles validate the tort frame or is it instrumental?
          6.  Conclusion: Better analogy or retire the family?
      *   **Constraints:** No bibliography (user knows the lit). Focus on mapping and audit. Tone should be analytical, rigorous, and conversational but high-level.

  2.  **Deconstruct the Tort Analogy (The Pileup):**
      *   *Concept:* War as an accident, responsibility as negligence/contributory fault, outcome as damages to be apportioned.
      *   *Goal:* To move from "Who started it?" (binary) to "Who contributed how much?" (spectrum).

  3.  **Drafting the Correspondence Table:**
      *   *Fog:* Uncertainty/Information asymmetry (mobilization timelines, diplomatic intent).
      *   *Road:* The Alliance System/Geopolitical landscape (the structure within which movement happens).
      *   *Highway Code:* International Law/Concert of Europe norms (Hague Conventions, unwritten rules of diplomacy).
      *   *Single Harm:* The General European War (and its destruction).
      *   *Loss Adjuster:* The Peace Conference (Big Four) / Historians (retrospectively).
      *   *Standing:* Victory (for Allies) / Epistemic authority (for Historians).

  4.  **Analyzing Disanalogies (The "Bite"):**
      *   *User's 4 points:*
          1.  *Single Harm:* In a pileup, everyone wants to avoid the crash. In 1914, some actors (Moltke, Conrad, Berchtold) arguably *wanted* or accepted the crash as a means to an end. The "harm" was heterogeneous (empire loss vs. territorial gain).
          2.  *But-For/Inevitability:* Cars don't *have* to crash. Some historians argue war was structurally inevitable (structuralists). If the crash is inevitable, negligence matters less.
          3.  *Real-Time Adjustment:* Drivers brake/swerve instantly. Mobilization plans were rigid (Schlieffen). Once the pedal was hit, physics took over.
          4.  *Accepted Rules:* Highway code is binding. 1914 "rules" were contested (Sovereignty vs. Intervention, Casus Foederis).
      *   *Sorting:*
          *   *Biting:* #1 (Intent/Heterogeneous Outcomes) and #4 (Authority of Rules). These destroy the *moral/legal* basis of the tort claim. If one driver *rammed* the others on purpose, it's not negligence. If there's no code, there's no negligence, just collision.
          *   *Interesting:* #2 (Inevitability) and #3 (Communication). These complicate the mechanics but don't necessarily invalidate the *assignment* of responsibility, just the *degree*.

  5.  **Addressing the Payoff Question (Quantifiability):**
      *   Does "Germany was X% responsible" survive?
      *   *Critique:* The analogy *presupposes* quantifiability. Tort law assumes damages are calculable. War responsibility is political/moral. The analogy smuggles in the idea that guilt is a pie to be sliced.
      *   *Verdict:* The analogy is doing all the work. Without it, "X%" is meaningless. With the disanalogies (specifically intent and rules), the percentage collapses because the basis of calculation (negligence vs. malice vs. structural force) is inconsistent across actors.

  6.  **Comparing "Sleepwalkers" (Clark):**
      *   *Tort:* Everyone is negligent -> Shared Guilt.
      *   *Sleepwalkers:* Everyone is unconscious/Trapped -> No Guilt (or mitigated).
      *   *Audit:* Clark's analogy is arguably *more* dangerous for responsibility because it removes agency entirely. Tort at least keeps agency (carelessness). Sleepwalkers suggests structural determinism. It's the "inverse trick" as the user suspects. It makes blame look inapplicable rather than divisible.

  7.  **Article 231 (War Guilt Clause):**
      *   *Context:* Allies needed legal basis for reparations.
      *   *Analysis:* They used legal language to do *political/financial* work.
      *   *Tort Frame:* Does this validate the tort frame? Yes, in that the *contemporaries* tried to use it.
      *   *Counter:* It failed politically because the "defendants" (Germany) rejected the court's jurisdiction (the Treaty). A tort judgment requires a recognized court. Versailles was a *diktat*. So it mimics tort but lacks the consensual substrate. It shows legal vocabulary being used for non-legal work (extraction).

  8.  **Finding a Better Analogy (or Retiring the Family):**
      *   *Bar Fight:* Good for escalation, but implies drunkenness/loss of control.
      *   *Poker/Escalation:* Good for risk calculation.
      *   *Medical/Misdiagnosis:* Good for systemic failure.
      *   *Recommendation:* Retire the "Accident" family (Pileup/Sleepwalkers). They all assume the war was a *mistake*. Fischer and others argue it was a *choice* (at least for some).
      *   *Better:* A **Hostage Negotiation** or a **Game of Chicken** where one player removes their steering wheel (Schelling). Or simply: **Arson in a Dry Forest**. Some lit matches (intent), the forest is dry (structural conditions), wind blows (contingency). This captures structure + agency + outcome without implying "oops."
      *   *Actually, best verdict:* Retire the analogies. They flatten time and agency. Replace with **Process Tracing**. Focus on *decision points* rather than *outcomes*.

  9.  **Refining and Polishing:**
      *   *Tone Check:* Keep it sharp, academic but accessible. Avoid fluff.
      *   *Structure:* Follow the user's prompt order strictly.
      *   *Key Insight:* The tort analogy fails because tort law rests on a shared normative framework (the law) which 1914 Europe lacked.

  10. **Final Review against constraints:**
      *   Correspondence table? Yes.
      *   Disanalogies sorted? Yes.
      *   Payoff question answered? Yes.
      *   Sleepwalkers compared? Yes.
      *   Article 231 addressed? Yes.
      *   Better analogy/Verdict? Yes.
      *   No bibliography? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just repeat the user's four disanalogies but evaluate *which ones bite*. The user asked me to sort them. I need to be decisive. The "Single Harm" and "Accepted Rules" are the killers. The "Real-time" and "Inevitability" are complicating factors but less fatal to the *concept* of liability.

  Also, on Article 231: Be careful not to say it was "illegal." It was a treaty provision. But its *function* was reparations, not criminal guilt, though it was read as criminal guilt. The tort analogy fits the *Allies' intent* but fails the *historical reality* of the system.

