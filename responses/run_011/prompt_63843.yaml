answer: |-
  Here is a stress-test of your hypothesis and the underlying legal practices, structured for your seminar reconstruction.

  ### 1. Presuppositions of the Four Regimes
  To separate genuine presupposition from mere compatibility, we must ask: *What must be true about the object for this rule to make sense?* versus *What theory could justify this rule even if the object were different?*

  **Copyright**
  *   **Presupposition:** The law presupposes an ontological distinction between *type* (idea) and *token* (expression). It treats the work as a specific historical event (the author's act of fixation) that can be replicated but not re-originated identically by another. It presupposes that ideas are non-rivalrous and public, while expressions are rivalrous in their specific instantiation.
  *   **Compatibility:**
      *   *Lockean:* Compatible only if labor is attached to the specific expression, not the idea (hence *Feist*).
      *   *Personhood:* Highly compatible (expression as embodiment of will).
      *   *Instrumental:* Compatible (incentivize production without monopolizing thought).
      *   *Conventionalist:* Compatible (a rule to reduce conflict over copies).
  *   **Verdict:** The practice *requires* the Idea/Expression dichotomy. It does not require Lockean labor (as sweat-of-the-brow was rejected), but it *does* require that independent creation produces a distinct ontological object.

  **Patent**
  *   **Presupposition:** The law presupposes that inventions are *discoverable functions* existing in a logical space prior to their reduction to practice. The invention is a "solution" waiting to be found. Ownership is a claim to the solution itself, not the specific paper or prototype describing it. It presupposes that the "place" can be occupied by only one sovereign at a time.
  *   **Compatibility:**
      *   *Lockean:* Tense. If labor creates property, why does the second inventor's labor count for nothing? Only works if the "first finder" rule overrides labor.
      *   *Personhood:* Weak. A machine is less intimately tied to the self than a poem.
      *   *Instrumental:* Highly compatible (disclosure bargain).
      *   *Conventionalist:* Highly compatible (priority race as a coordination game).
  *   **Verdict:** The practice *requires* the "pre-existence" of the invention (the Place model). It is incompatible with a pure labor-desert theory that values the act of inventing over the act of claiming.

  **Trademark**
  *   **Presupposition:** The law presupposes that a mark is not an object but a *signal*. Ownership is not in the sign (words/images) but in the *psychological link* between the sign and the source in the consumer's mind.
  *   **Compatibility:**
      *   *Lockean/Personhood:* Very weak. There is little labor or personality in a brand name itself.
      *   *Instrumental:* Strong (lowering search costs).
      *   *Conventionalist:* Strong (preventing market confusion).
  *   **Verdict:** The practice presupposes a *relational* ontology (Seller-Mark-Buyer). It is not property in an idea or a thing, but property in a *channel of communication*.

  **Trade Secret**
  *   **Presupposition:** The law presupposes that value resides in *ignorance* (of others). The object is information, but ownership is contingent on the *state of secrecy*.
  *   **Compatibility:**
      *   *Lockean:* Tense. Independent discovery negates the right, implying the "property" vanishes if someone else labors to find it.
      *   *Instrumental:* Strong (encourages R&D where patent is unsuitable).
      *   *Conventionalist:* Strong (enforcing norms of confidence).
  *   **Verdict:** The practice presupposes that information is property only so long as it is not public. It is a right against *breach*, not a right against *use*.

  ### 2. The Place/Performance Distinction: Explanatory or Redescription?
  Your distinction is doing **real explanatory work**, not merely redescribing doctrine. It explains the liability rules.
  *   **Why it works:** If an invention is a *Place*, trespass is strict liability; it does not matter how you got there. If a work is a *Performance*, infringement requires replaying *that specific performance* (copying); a new performance is a new event. This explains why patent is a monopoly on use, while copyright is a monopoly on copying.
  *   **Where it fails (Trademark):** You are correct; Trademark fits neither. A mark is not a location (you do not "occupy" the word "Apple") nor a performance (you are not "replaying" the logo). It is a **maintenance of a channel**. Liability turns on *confusion*, which is a state of mind in a third party (the consumer), not an act of the defendant regarding the object. This suggests your binary covers *creation* regimes (Patent/Copyright) but not *signaling* regimes (Trademark).
  *   **Where it fails (Trade Secret):** Trade Secret fits neither. It is not a Place (others can find it) nor a Performance (independent discovery is allowed). It is a **state of concealment**.

  **Verdict:** The Place/Performance distinction successfully unifies Patent and Copyright ontology but must be supplemented by a "Relation/State" model for Trademark and Trade Secret.

  ### 3. The Clean-Room Technique
  The clean-room technique (Team A reads specs, Team B writes code) is a practical test of your metaphysics.
  *   **Coherence:** It is coherent only if the Idea/Expression distinction is ontologically sharp. It presupposes that a *specification* (function/idea) can be fully transmitted without transmitting the *code* (expression).
  *   **Contamination:** It commits practitioners to a **causal theory of infringement**. "Contamination" is not about the similarity of the output, but the history of the input. It presupposes that ideas are transmissible *types* that do not carry the *token* history with them.
  *   **Transmissibility:** It commits them to the view that ideas are **non-rivalrous and non-depleting**. I can give you the idea of the interface without losing it, and without giving you the expression.
  *   **The Risk:** In software, the "structure, sequence, and organization" often blur the line. If the specification is so detailed that only one code structure can implement it (merger doctrine), the clean-room fails. The practice commits engineers to the belief that *function is separable from implementation*. If that belief is false (i.e., if function dictates expression), the clean-room is a legal fiction that courts may reject.

  ### 4. Software Duality: Text vs. Machine
  Is a program one object with two aspects, or two incompatible accounts?
  *   **The Conflict:** It is an **incompatible application of ontologies**.
      *   As *Text* (Copyright): It is a Performance. Protection covers the specific code. Independent creation is a defense.
      *   As *Machine* (Patent): It is a Place. Protection covers the function. Independent creation is infringement.
  *   **The Friction:** When the function *is* the text (e.g., specific code is the only way to achieve the result), the two regimes collide. Patenting the function effectively copyrights the idea (forbidden in copyright). Copyrighting the structure effectively patents the function (forbidden without novelty/examination).
  *   **Verdict:** This is not a harmless duality. It reveals that the artifact does not have a stable metaphysical status. The law forces it into the *Place* box for utility and the *Performance* box for literal copying. This creates the instability seen in cases like *Oracle v. Google*, where the court must decide whether an API is a "method of operation" (Place/Idea) or "declaring code" (Performance/Expression). The artifact is subject to two incompatible accounts, and the law manages this via doctrinal fences (e.g., merger doctrine) rather than metaphysical consistency.

  ### 5. Patent Reform: The Independent Invention Defense
  If patent law adopted a good-faith independent-invention defense:
  *   **The Commitment:** This would commit patent law to the **Performance Model**. It would acknowledge that the invention is not a pre-existing Place, but a product of the inventor's labor/act. If you perform the act independently, you own your performance.
  *   **Stability:** The resulting hybrid would be **unstable**.
      *   The Priority Race exists to settle *who* gets the Place. If multiple people can occupy the Place independently, the "Place" ontology collapses.
      *   The *quid pro quo* of patent (monopoly for disclosure) breaks. If competitors can use the invention without a license (via the defense), the value of the patent drops, reducing the incentive to disclose.
      *   It reintroduces the question the race settles: *Who did it first?* But without the exclusivity of the "first" claimant. It turns patent into a weak copyright on functions.
  *   **Verdict:** You cannot have a Priority Race (Place) and an Independent Invention Defense (Performance) simultaneously without undermining the economic logic of the patent system. Adopting the defense requires abandoning the "Place" model entirely.

  ### 6. Underdetermination and the Colleague's Thesis
  **Where the analysis is underdetermined:**
  The law is underdetermined by metaphysics because it is a **pragmatic toolkit**, not a unified theory.
  *   Copyright and Patent are not derived from a single theory of "ideas." They are policy levers pulled to solve different market failures (public goods problem for expression vs. coordination/disclosure problem for invention).
  *   You cannot derive the liability rules solely from the nature of the object. You could imagine a world where Copyright was a Place (strict liability for similar poems) or Patent was a Performance (independent invention defense). The fact that they are not is a historical and economic choice, not a metaphysical necessity.

  **Is there a single theory?**
  *   **Instrumentalism/Conventionalism:** Yes. A single *Instrumental* theory can house all four regimes. "We allocate rights this way to maximize social welfare." This theory does not care if an idea is a Place or a Performance; it only cares what rule produces the best outcome.
  *   **Lockean/Personhood:** No. These theories struggle to unify the regimes because the regimes treat labor and personality differently (e.g., why does labor count in Copyright but not Patent?).

  **Does this vindicate your colleague?**
  **No.** Your colleague claimed copyright and patent are "simply forms of property in ideas, differing... only in registration formalities and term length."
  *   **The Verdict:** This is false. They differ in **ontology**, not just formality.
      *   Copyright is property in a *token of expression* (Performance).
      *   Patent is property in a *type of function* (Place).
  *   **Why it matters:** If they were the same form of property, the independent creation defense would either apply to both or neither. The fact that it applies to one and not the other proves they are protecting different *kinds of things*.
  *   **Conclusion for your talk:** Your colleague is mistaking the *label* ("Intellectual Property") for the *substance*. The law does not treat ideas as a uniform substrate. It treats them as Places when we want to coordinate on a single solution (Patent), and as Performances when we want to encourage multiplicity of expression (Copyright). Your Place/Performance hypothesis captures this ontological split better than the colleague's "property in ideas" monolith. Use the clean-room and software duality examples to show that when the law tries to blur this line, friction occurs.
