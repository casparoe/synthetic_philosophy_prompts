      *   *The Scenario:* Team A sees spec (idea). Team B writes code (expression) without seeing Team A's code.
      *   *Coherence:* It relies on the Idea/Expression dichotomy being ontologically real and separable.
      *   *Contamination:* It presupposes ideas are transmissible without carrying expression. "Contamination" is a causal chain of *access*.
      *   *Commitment:* It commits practitioners to the view that expression is *token-specific* while ideas are *type-specific*. If I transmit the type, you can create a new token. If I transmit the token (code), you infringe.
