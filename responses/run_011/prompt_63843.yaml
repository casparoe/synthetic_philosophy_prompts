      *   *Copyright = Performance:* A work is an act of expression. Ownership is about controlling the *repetition* of that specific act. Independent acts are new performances.
      *   *Critique:* This is a strong heuristic, but is it metaphysical or just doctrinal?

  3.  **Drafting Section 1: The Four Regimes (Presuppositions vs. Compatibility):**
      *   *Copyright:*
          *   Presupposition: Ideas are non-rivalrous abstractions; Expression is a specific instantiation. Ownership is a right against *copying*, not against *use of the idea*.
