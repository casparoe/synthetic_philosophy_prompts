  6.  **Drafting Section 4: Software Duality (Text vs. Machine):**
      *   *The Issue:* Code is copyrightable (text); Functionality is patentable (machine).
      *   *Analysis:* It's not just two aspects; it's a tension. Copyright says "don't copy the text." Patent says "don't use the function."
      *   *Incompatibility:* If the function *requires* the text (merger doctrine), patenting the function effectively copyrights the idea.
      *   *Verdict:* It reveals a fracture in the ontology. The artifact is treated as a *performance* (code) and a *place* (function) simultaneously. This creates friction (e.g., Oracle v. Google). It suggests the Place/Performance models are competing lenses applied to the same object, not inherent properties.

  7.  **Drafting Section 5: Patent Reform (Independent Invention Defense):**
      *   *The Change:* Allow independent invention as a defense in patent.
      *   *Commitment:* Moves Patent toward the *Performance* model (your labor counts).
      *   *Stability:* Unstable. Patent's core is the *quid pro quo*: Public gets disclosure, Inventor gets monopoly. If independent inventors can use it, the value of the monopoly drops.
      *   *Priority Race:* The race exists to settle *who* gets the place. If independent invention is allowed, the "place" model crumbles. We revert to a "who did it first" (priority) but without exclusion of others. It becomes more like Copyright.
      *   *Verdict:* It destabilizes the "Place" ontology. You can't have a bounded location in idea-space if multiple people can own the same location independently.

  8.  **Drafting Section 6: Underdetermination & The Colleague's Thesis:**
      *   *Underdetermination:* The doctrines are pragmatic compromises, not pure metaphysical systems. They are underdetermined by any single theory of ideas.
      *   *Colleague's Thesis:* "Both are property in ideas."
      *   *Verdict:* False. They are property in *different categories of things*. Copyright: Property in *tokens* of expression. Patent: Property in *types* of function.
      *   *Single Theory?* An Instrumentalist/Conventionalist theory can house all four (social engineering tools). But a *metaphysical* theory (Lockean/Personhood) cannot easily unify them without distortion.
      *   *Vindication?* No. The colleague ignores the ontological distinction that drives the liability rules.

