prompt: |-
  I run a two-person integrity unit at a mid-sized development agency. We fund local partner organisations in about eight countries and our own program officers send us referrals — the district health officer's brother just got hired onto the project, our country director was given a cow, someone had to slip 20 dollars to get a permit stamped — roughly five or six a month. At the moment we answer these off vibes and the results are embarrasing. If we flag something, a partner's funding can get suspended and a relationship we spent years building dies; if we don't, we're signing off on it and the board sees the pattern in aggregate at the quarterly review. There's no lawyer on call and I have maybe half a day a week for this.

  We do have one piece of house doctrine, a heuristic a previous director made up, and I want you to build a real procedure out of it while telling me where it breaks. The heuristic: a benefit is presumptively corrupt only if it's convertible, meaning whoever received it could turn it into cash, hand it to somebody else, or use it outside the relationship it was given in. A shared meal, a public ceremony honouring an official, a contribution that stays inside the community — not convertible, therefore not corrupt, no matter how large. Two riders. A convertible benefit is still cleared if the decision would have come out the same anyway. And anything gets flagged if neither party would want the arrangement described accurately in the local paper.

  What I need back is an ordered procedure a program officer with no legal or philosophical training can run in about thirty minutes per referral: the questions to ask in sequence, what counts as a sufficient answer to each, where it stops at no flag, what has to be written down for me, who signs off on what, and — importantly — the points where it hands the decision to a human being because the question is one of values rather than facts. Also tell me what to do when we simply can't find out a relevant fact, since half the time we can't.

  It has to say something about the relativism fight rather than ducking it. Half our board thinks we're exporting Western standards and should defer to local norms of gift-giving and obligation, which in a lot of these places are genuinely load-bearing, not a cover story. The other half thinks corruption is corruption everywhere and saying otherwise is a slur on the local staff who refuse to play. The definition the big international bodies use — the abuse of power someone has been entrusted with for private gain — doesn't settle it, and US anti-bribery law carves out small payments that merely speed up routine government action, which is a precedent I can't tell whether it helps us or undercuts us. So I want each step of your procedure labelled as to whether its answer is allowed to vary from country to country, and why.

  Then run it on three referrals. One: our country director accepted a cash contribution toward his daughter's wedding from a chief whose district we fund, it was announced publicly, and everyone in the district expected it of him — declining would have been the insult. Two: a partner put a project officer's brother on the payroll at a salary well above whatever work he actually does. Three: a training where every participant gets a per diem that everyone involved knows is the real reason they turn up.

  Be blunt about where the convertibility idea gets things backwards — my suspicion is that a job isn't liquid at all, but a brother on the payroll is worse than a cow — and about which steps are judgment calls dressed up as procedure. At least one of the three should come out with an answer I won't like, and I'd rather you say so than soften it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Head of a two-person integrity unit at a mid-sized development agency.
      *   **Context:** Funds local partners in ~8 countries. Receives 5-6 referrals/month (nepotism, gifts, facilitation payments).
      *   **Problem:** Current ad-hoc handling is embarrassing/risky. High stakes (funding suspension vs. board scrutiny). Limited resources (no lawyer, 0.5 day/week for this).
      *   **Existing Asset:** A "convertibility" heuristic (Benefit is corrupt if convertible to cash/transferable/outside relationship). Two riders: (1) Cleared if decision would be same anyway, (2) Flagged if neither party wants it in the local paper.
      *   **Task:** Build a real, ordered procedure (30 mins/referral) based on this heuristic.
      *   **Requirements:**
          *   Questions in sequence.
          *   Sufficient answers.
          *   Stop points (No Flag vs. Escalate).
          *   Documentation requirements.
          *   Sign-off authority.
          *   Handling missing facts.
          *   Address cultural relativism explicitly (label steps as variable/fixed).
          *   Test on three specific referrals (Wedding gift, Nepotism job, Per diem training).
          *   **Tone:** Blunt, honest about where the heuristic breaks, acknowledge judgment calls, don't soften uncomfortable answers.

  2.  **Deconstruct the Heuristic & Identify Weaknesses:**

      *   *Convertibility:* The user suspects this gets things backwards (Job vs. Cow). A job is illiquid but creates long-term obligation/inefficiency. A cow is consumable but might be culturally binding. Cash is obviously liquid.
      *   *Decision Independence:* "Would the decision have come out the same?" is counterfactual and hard to prove.
      *   *Newspaper Test:* "Local paper" is good for reputational risk, but in authoritarian regimes, the "paper" might be state-controlled or non-existent. Also, some corrupt acts are open secrets (everyone knows, no one writes).
      *   *Relativism:* Need to distinguish between *cultural norms* (gift-giving) and *systemic corruption* (bribery/nepotism).

  3.  **Drafting the Procedure (The "Integrity Triage Protocol"):**

      *   *Goal:* 30 minutes. Needs to be a checklist.
      *   *Structure:*
          1.  Fact Gathering (The "What").
          2.  Convertibility Test (The Core Heuristic).
          3.  Counterfactual Test (The "Same Decision" Rider).
          4.  Transparency Test (The "Newspaper" Rider).
          5.  Relativism/Culture Check (The Variable Step).
          6.  Decision/Documentation.
      *   *Missing Facts:* Need a "Precautionary Principle" clause. If you can't verify, assume risk.
      *   *Sign-off:* Program Officer (PO) does the legwork. Integrity Unit (IU) makes the call on flags.
      *   *Relativism Labeling:* Explicitly mark which steps allow local context to change the outcome.

  4.  **Refining the Heuristic (Addressing the "Job vs. Cow" issue):**

      *   The user is right. A job for a brother is *less* convertible than cash but *more* damaging to integrity than a cow. The heuristic needs a modification: "Long-term Obligation" counts as convertibility. A salary is a stream of cash.
      *   *Adjustment:* Expand "Convertible" to include "Monetizable Stream" or "Transferable Value."

  5.  **Developing the Three Case Studies:**

      *   *Case 1 (Wedding Gift):* Cash from a Chief. Public. Cultural expectation.
          *   *Analysis:* Convertible (Cash). But Public (Newspaper test passed?). Cultural norm (Relativism).
          *   *Verdict:* Likely needs flagging despite culture, because cash is high risk. But the "Public" aspect helps. *Wait, the prompt says "One should come out with an answer I won't like."* If I say "Clear it," the board might hate it. If I say "Flag it," the partners hate it. Let's aim for "Flag for Mitigation/Repayment" which is the uncomfortable middle.
      *   *Case 2 (Brother on Payroll):* Nepotism. Salary > Work.
          *   *Analysis:* Not liquid (can't sell the job), but it's a cash stream. Convertibility heuristic might fail here if defined strictly as "asset sale." Need to ensure the procedure catches this.
          *   *Verdict:* Flag. This is classic fraud/waste.
      *   *Case 3 (Per Diem Training):* Participants only come for money.
          *   *Analysis:* Cash (Convertible). Decision independence (Would they come without money? No). Newspaper test (Would they want it known? No).
          *   *Verdict:* Flag. This is systemic abuse.

      *   *Re-evaluating the "Answer I won't like":* The user suspects the heuristic fails on the Job (Case 2). If the procedure clears the Job because it's not "liquid," that's the failure. I need to make sure the procedure *catches* it, but point out where the original heuristic would have missed it. Or, perhaps the Wedding Gift (Case 1) is the one where the procedure says "Flag" (demand repayment) which burns the relationship, and I need to be blunt that this is the cost of integrity. Let's go with the Wedding Gift. The procedure should likely flag it as a risk that requires repayment or donation to charity, which the Country Director will hate.

  6.  **Addressing the Relativism Fight:**

      *   Need to distinguish between *Relationship Building* (acceptable) and *Influence Peddling* (unacceptable).
      *   Step 5 of the procedure must explicitly ask: "Is this a reciprocal social obligation or a transactional exchange?"
      *   Label steps: [FIXED] vs [VARIABLE].

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the constraints. Validate the "Job vs. Cow" suspicion immediately.
      *   **The Procedure (ITP):** Numbered steps. Time limits.
      *   **The Relativism Labels:** Explicitly noted.
      *   **Missing Data:** The "Unknown = Risk" rule.
      *   **Case Studies:** Run the procedure.
      *   **Critique:** Where does this break? (The "Same Decision" test is fiction. The "Newspaper" test fails in autocracies. Convertibility misses structural nepotism).

  8.  **Refining the Tone:**

      *   Professional, direct, slightly weary but competent.
      *   No fluff.
      *   Acknowledge the political reality (Board vs. Field).

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "half day a week" constraint? Yes, keep the procedure tight.
      *   *Check:* Did I address the "no lawyer" constraint? Yes, avoid legal jargon, focus on risk management.
      *   *Check:* Did I address the "convertibility" flaw? Yes, in the critique section and by expanding the definition in the procedure.
      *   *Check:* Is the "Answer I won't like" present? I will make the Wedding Gift case result in a requirement to return/donate the money, which strains the relationship.
      *   *Check:* Relativism labeling? I will add tags like `[CULTURALLY VARIABLE]` to specific steps.

  10. **Final Polish:** Ensure the distinction between "Flag" (Investigate/Stop) and "Clear" (Accept) is clear. Ensure the "Human Handoff" points are identified (where values override facts).

  *(Self-Correction on Case 1)*: If the Chief's gift is public and culturally mandated, the "Newspaper Test" passes. The "Convertibility" fails (it's cash). The "Same Decision" is hard to know. If I follow the heuristic strictly, Cash = Corrupt. But the cultural defense is strong. The uncomfortable answer is: *It doesn't matter if it's cultural; cash from a beneficiary to a decision-maker is a hard line.* I will argue that the procedure must flag this, requiring the CD to donate it, which he will hate.

  *(Self-Correction on Case 2)*: The Job. The heuristic says "Convertible?" A job isn't easily sold. But it provides cash. I need to modify the procedure's definition of convertibility to include "Stream of Income." If I don't, the procedure fails. I will note this as a critical patch to the director's heuristic.

  *(Self-Correction on Case 3)*: Per Diems. This is the easiest Flag. Everyone knows it's wrong.

  Let's assemble.
answer: |-
  This is a high-risk, low-resource environment. You are trying to build a dam out of heuristics while the flood is already rising. Your suspicion is correct: the "convertibility" heuristic is dangerous if applied literally. A job for a brother is illiquid (you can't sell it at a pawn shop), but it is often more corrosive than a cow because it creates a long-term dependency and siphons project funds over time. A cow is a one-off; a payroll slot is a leak.

  Below is the **Integrity Triage Protocol (ITP)**. It is designed to be executed by a Program Officer (PO) in 30 minutes. It patches the holes in your director's heuristic while keeping the spirit. It explicitly marks where local norms can override the rule and where they cannot.

  ### The Integrity Triage Protocol (ITP)

  **Time Limit:** 30 Minutes
  **Owner:** Program Officer (PO)
  **Reviewer:** Integrity Unit (IU) [You]
  **Missing Data Rule:** If a fact cannot be verified within 30 minutes, mark it as **UNVERIFIED RISK**. Do not assume benevolence.

  #### Step 1: The Nature of the Benefit (Fact Finding)
  **Question:** What exactly was transferred? (Cash, Asset, Service, Opportunity, Obligation).
  **Sufficient Answer:** Specific value, date, and parties involved.
  **Variable?** No. `[FIXED]`
  **Missing Data:** If value is unknown, estimate market rate. If opportunity (like a job), estimate total contract value.
  **Handoff:** If the benefit is **Cash**, proceed to Step 2 immediately. If **Non-Cash**, proceed to Step 2 but note liquidity.

  #### Step 2: The Convertibility & Stream Test (The Patch)
  **Question:** Can the recipient turn this into cash, OR does this provide a recurring stream of cash (like a salary), OR can the benefit be transferred to a third party?
  **Sufficient Answer:**
  *   **Yes (High Risk):** Cash, gift cards, salary, contract, asset that can be sold (cow, car).
  *   **No (Low Risk):** Shared meal, public honor, training attendance (without per diem).
  **Variable?** No. `[FIXED]`
  **Critique:** This is where we fix your director's heuristic. A job is a "Cash Stream." It counts as convertible.
  **Stop Point:** If **No**, go to Step 5 (Transparency). If **Yes**, go to Step 3.

  #### Step 3: The Counterfactual Test (The "Same Decision" Rider)
  **Question:** If this benefit had *not* been given, would the official decision (hiring, permitting, funding) have been identical?
  **Sufficient Answer:** Documented evidence of merit (e.g., brother has unique skills) OR process evidence (e.g., permit is statutory right).
  **Variable?** Yes. `[CULTURALLY VARIABLE]`
  **Why:** In some contexts, "merit" includes social standing. In others, it is strictly technical.
  **Missing Data:** If you cannot prove the decision would have been the same, assume the benefit **influenced** the decision.
  **Handoff:** This is a **Value Judgment**. If the PO believes the decision was merit-based despite the gift, they must write a 3-sentence justification. This hands the decision to you (IU) for final sign-off.
  **Stop Point:** If **Yes** (Decision same anyway), go to Step 5. If **No** (Benefit bought the outcome), **FLAG**.

  #### Step 4: The Reciprocity Test (The Relativism Filter)
  **Question:** Is this benefit part of a pre-existing, reciprocal social obligation (e.g., wedding gift to a peer/superior) OR is it a one-way transaction triggered by a specific official act?
  **Sufficient Answer:** "This happens at every wedding" vs. "This happened only after we signed the contract."
  **Variable?** Yes. `[CULTURALLY VARIABLE]`
  **Why:** This is the only place you defer to local norms. Social glue is acceptable; transactional bribery is not.
  **Handoff:** If the PO argues this is "Social Glue," they must cite a specific local norm or precedent. You (IU) must validate this isn't just a cover story.
  **Stop Point:** If **Social Obligation**, go to Step 5. If **Transactional**, **FLAG**.

  #### Step 5: The Transparency Test (The Newspaper Rider)
  **Question:** If this arrangement were described accurately in the local newspaper (or read aloud in a town hall), would either party be ashamed or fear repercussions?
  **Sufficient Answer:** "Yes, we would hide this" vs. "No, it is public knowledge."
  **Variable?** Yes. `[CONTEXT VARIABLE]`
  **Why:** In authoritarian regimes, "local paper" = state propaganda. Use "Town Hall" or "Community Meeting" as the proxy.
  **Stop Point:** If **Hide**, **FLAG**. If **Public**, **CLEAR**.

  #### Step 6: Documentation & Sign-Off
  *   **No Flag:** PO signs the Triage Form. File closed.
  *   **Flag:** PO signs Form. IU (You) reviews. If IU agrees, Funding Suspension/Remediation Plan initiated.
  *   **Judgment Calls:** Any step marked `[CULTURALLY VARIABLE]` where the PO argues for an exception requires IU signature.

  ---

  ### Where This Breaks (The Blunt Truth)

  1.  **The "Same Decision" Test is a Fiction:** You will almost never know if the decision would have come out the same. It is counterfactual. In practice, this step becomes a "Can we justify this retrospectively?" exercise. It favors the eloquent liar over the honest actor.
  2.  **The "Newspaper" Test Fails in Autocracies:** In some of your eight countries, the press is state-controlled. A corrupt official might *want* it in the paper to show power. Conversely, honest staff might fear being targeted by criminals if publicity arises. You must swap "Newspaper" for "Community Scrutiny."
  3.  **Convertibility vs. Obligation:** Your heuristic says a cow is fine because it's not cash. But a cow creates an obligation to the giver that cash does not. You owe the cattle-giver a favor forever. You can spend cash and walk away. The procedure patches this with the **Reciprocity Test**, but it relies on the PO's cultural literacy.
  4.  **Relativism:** You cannot solve the board's fight with a procedure. This protocol forces you to make the call. If you clear a wedding gift because it's "cultural," the universalists on the board will scream. If you flag it, the partners will scream. The procedure labels the step as variable so you can take the heat consciously.

  ---

  ### Running the Referrals

  #### Referral 1: The Country Director's Wedding Gift
  *   **Facts:** Cash contribution from a Chief (beneficiary district). Public announcement. Cultural expectation to accept.
  *   **Step 1 (Nature):** Cash. `[FIXED]`
  *   **Step 2 (Convertibility):** Yes, it is cash. `[FIXED]` -> **Proceed to Step 3.**
  *   **Step 3 (Same Decision):** N/A. This wasn't a specific official act (like a permit), it's a relationship status. -> **Proceed to Step 4.**
  *   **Step 4 (Reciprocity):** `[CULTURALLY VARIABLE]`. PO argues: "Declining is an insult; this is social glue, not a bribe for a specific contract."
      *   *Analysis:* This is the friction point. It is a gift to a person, not a payment for a signature. However, the Chief funds the district.
  *   **Step 5 (Transparency):** Publicly announced. `[CONTEXT VARIABLE]`. Passes.
  *   **Verdict:** **FLAG FOR MITIGATION.**
  *   **The Answer You Won't Like:** You must flag this. Even if it is cultural, **cash from a beneficiary to a decision-maker is a hard line.** The procedure clears the *intent* (Step 4), but the *risk* (Step 2) is too high.
  *   **Action:** The CD cannot keep the cash. To respect the culture, he accepts it publicly, but must immediately donate it to a community project in the Chief's name or return it with a gift of equal symbolic value (not cash).
  *   **Why:** If you clear this, you set a precedent that cash is okay if it's "public." The next CD will take cash and not announce it. You have to burn this relationship slightly to save the policy.

  #### Referral 2: The Brother on the Payroll
  *   **Facts:** Partner hired PO's brother. Salary > Work value.
  *   **Step 1 (Nature):** Salary (Cash Stream). `[FIXED]`
  *   **Step 2 (Convertibility):** **Yes.** Your director's heuristic would miss this (a job isn't an asset you sell). My procedure catches it (Cash Stream). `[FIXED]` -> **Proceed to Step 3.**
  *   **Step 3 (Same Decision):** Would they have hired him without the relation? Salary is above market rate for work done.
      *   *Answer:* No. `[FIXED]`
  *   **Verdict:** **FLAG.**
  *   **Action:** Suspension of that line item. Partner must justify the role or terminate the contract.
  *   **Why:** This is waste and fraud. It is not cultural; it is theft. The "Convertibility" heuristic almost failed here if defined as "liquid asset." Defining it as "Cash Stream" saves you.

  #### Referral 3: The Per Diem Training
  *   **Facts:** Participants attend only for the daily cash allowance.
  *   **Step 1 (Nature):** Cash. `[FIXED]`
  *   **Step 2 (Convertibility):** Yes. `[FIXED]` -> **Proceed to Step 3.**
  *   **Step 3 (Same Decision):** Would they attend without the money? No.
      *   *Answer:* No. `[FIXED]`
  *   **Step 5 (Transparency):** Would they want this in the paper? "We didn't learn anything, we just took the money."
      *   *Answer:* No. `[CONTEXT VARIABLE]`
  *   **Verdict:** **FLAG.**
  *   **Action:** Stop the training model. Shift to non-cash incentives or verify attendance/learning outcomes rigorously.
  *   **Why:** This is systemic corruption. It undermines the mission.

  ### Summary of Risks to You

  1.  **Referral 1 (Wedding):** This is your political minefield. The procedure says "Flag," but the reality is "Everyone does this." If you enforce the donation/return rule, the Country Director may resign or the Chief may pull cooperation. **This is the cost of the job.** If you don't enforce it, you are complicit.
  2.  **The "Missing Fact" Trap:** In Referral 2, the Partner will claim the brother is a "genius." You have 30 minutes. You cannot audit their HR. You must rely on the "Salary > Work" heuristic. If the Partner lies, you miss it. You need to add a random audit clause to your quarterly reviews to catch the lies the ITP misses.
  3.  **The Relativism Label:** By marking Step 4 as `[CULTURALLY VARIABLE]`, you are putting the target on your back. If you clear a case based on "local norms," and it leaks, the "Western Standards" faction of the board will attack you. You must document *why* the norm applies (e.g., "Anthropological study X confirms wedding gifts are mandatory in Region Y"). Do not rely on the PO's word alone.

  ### Final Recommendation
  Adopt the **Cash Stream** definition in Step 2 immediately. That is the biggest hole in your current doctrine. For the Wedding Gift (Referral 1), prepare a "Community Donation" template. It allows the CD to save face (he didn't reject the Chief) and saves integrity (he didn't pocket the cash). It's the only way to survive the relativism fight without surrendering.
