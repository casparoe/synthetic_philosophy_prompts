answer: |-
  1. **The Circularity Charge**
  "The Salvage Criterion says I am located where the thing is whose destruction would be my death. But 'death' is defined as the cessation of *me*. Aren't you using the notion of 'me' to locate 'me'? It looks like you're presupposing the very identity you're trying to ground."

  2. **Follow-up on Circularity**
  "If you reply that the circularity is harmless, like defining 'the water in this glass' by pointing to the H2O: note that 'water' and 'H2O' are distinct concepts until science links them. Here, 'me' and 'the thing whose death kills me' seem conceptually identical. Is this a discovery, or just a tautology dressed up as a criterion?"

  3. **Engineering vs. Introspection**
  "In the duplicate brain scenario, my location flips depending on whether the backup is wired in lockstep or sitting idle. But from the inside, nothing changes. Why should a fact about *where I am* hinge on engineering details that are undetectable to the subject?"

  4. **Follow-up on First-Person Access**
  "If you say location was never supposed to be a first-person-accessible fact: doesn't that drain the question 'Where Am I?' of its philosophical urgency? If I can't tell where I am even in principle, are we talking about *my* location, or just the location of a biological asset?"

  5. **The Identity Dodge Blocker**
  "You insist this is a location thesis, not an identity thesis. But if the answer to 'Where am I?' is perfectly co-extensive with 'Where would I cease to exist?', what explanatory work is 'location' doing that 'identity' isn't? Why shouldn't we just say you've solved personal identity and mislabeled it?"

  6. **The Threshold Problem**
  "In ordinary life, I survive losing neurons all the time. So strictly speaking, no single chunk of tissue is 'the thing whose destruction is my death.' Does this mean my location is smeared across my whole brain? And if so, does that match your intuition in the vat case?"
  *(**Follow-up if she says the criterion is only for puzzle cases:** "If the criterion only works in science fiction, is it a theory of location or just a triage tool for thought experiments?")*

  7. **Phenomenological Pull**
  "Dennett describes looking at his brain in the vat but feeling like he's out with the body. Your criterion might place him in the vat, but does it explain that phenomenological pull? Or does it just tell us the feeling is wrong?"

  8. **The Switch Flip**
  "When the switch flips between the two brains, you say location becomes indeterminate. But by hypothesis, the stream of consciousness is uninterrupted. Does indeterminacy feel like anything? If not, what metaphysical work is the indeterminacy doing?"

  9. **Applied Consequences**
  "Let's take this to teletransportation. If the scanner destroys the original, you're on Mars. If it keeps the original, you're nowhere? That seems to make moral status depend on a machine's delete key. Is that a feature or a bug?"

  10. **Falsifiability**
  "Right now, if a case seems to contradict your view, you can declare the location indeterminate. What specific case design or observation would force you to abandon the Salvage Criterion entirely?"
