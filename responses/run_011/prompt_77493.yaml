answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION: MORAL RESPONSIBILITY AND CAUSAL EXPLANATION**

  **Preamble**
  We, the undersigned, convened to map the topology of our disagreement regarding moral responsibility. We acknowledge that our dialogue failed to produce consensus, yet we agree that the structure of the dispute is now sufficiently clarified to warrant a joint record. We commit to the accuracy of the data presented herein: the phenomenology of our moral practices, the logical scope of determinism, and the specific conditions under which our judgments diverge. We do not seek to dissolve our differences into vagueness. Where we cannot sign the same sentence, we record that impossibility as a finding. This document serves as a protocol for future inquiry, not a declaration of peace.

  **I. Agreed Claims**
  1.  **Reactive Attitudes:** We agree that resentment, indignation, gratitude, and moral blame are distinct from mere aversion or approval. They imply a demand for regard and a recognition of agency, whereas aversion is merely a response to harm.
  2.  **Exemptions:** We agree that there are established conditions under which these attitudes are legitimately suspended. These include extreme youth, grave mental illness, compulsion, temporary distraughtness, and extraordinary strain. In these cases, the "objective attitude" (viewing the agent as a subject for management or treatment) replaces the participatory stance.
  3.  **Determinism:** We agree that determinism is the thesis that every event, including human action, is the inevitable upshot of antecedent conditions and natural law. We agree that determinism does not claim agents do not act, nor that prediction is always possible.
  4.  **The Objective Attitude:** We agree that the objective attitude is a resource we already deploy locally (e.g., in psychiatry or child-rearing). We agree that no human being has ever sustained the objective attitude as a general policy toward all persons at all times.

  **II. Table of Surviving Disagreements**

  | Topic | Claim (Strawsonian) | Claim (Sceptic) | Condition for Settlement |
  | :--- | :--- | :--- | :--- |
  | **Normative Force** | Reactive attitudes constitute the framework within which responsibility has its life; they require no external warrant. | Reactive attitudes are psychological facts that lack normative warrant if determinism is true; they require a metaphysical foundation they cannot have. | Demonstrate a coherent practice of blame that persists after the belief in "basic desert" is universally abandoned. |
  | **Determinism's Impact** | Determinism is irrelevant to responsibility because responsibility is not a metaphysical status but a social practice. | Determinism undermines responsibility because it removes the "could have done otherwise" required for basic desert. | Show that accepting determinism *necessarily* alters the logic of our interpersonal demands, rather than just our metaphysical commentary. |
  | **The Subject** | The Sceptic demands a warrant from outside the practice, which is unintelligible. | The Strawsonian redefines responsibility into safety, ignoring the core intuition of desert. | Identify a specific judgment of blame that both parties agree is *false* under determinism. |

  **III. Cruxes and Empirical Predictions**
  We identify three specific cases provided by the convenor as critical test points. For each, we record our divergent interpretations and a falsifiable prediction.

  **Crux 1: The Technician (Falsified Records)**
  *Data:* A technician falsified calibration records, endangering clinical work. The convenor felt specific indignation (a sense that an account was owed), despite believing the conduct was causally determined.
  *   **Strawsonian Interpretation:** The indignation is a rational response to the technician's "quality of will." The causal history is irrelevant to the breach of mutual regard.
  *   **Sceptic Interpretation:** The indignation is a useful evolutionary heuristic, but the belief that the technician *deserved* blame in a basic sense is false. The attitude is pragmatically useful but metaphysically unjustified.
  *   **Prediction:** If the laboratory culture shifts to a purely objective view (treating errors solely as system failures without blame), the Strawsonian predicts a collapse in professional accountability. The Sceptic predicts accountability can be maintained through forward-looking consequences alone.

  **Crux 2: The Ill Colleague (Fading Resentment)**
  *Data:* The convenor's resentment over an authorship dispute faded as the colleague developed a neurological illness. The resentment faded "much as alarm at a noise fades once one learns where it comes from."
  *   **Strawsonian Interpretation:** The fading is a correction of warrant. The illness served as an exemption condition, revealing the colleague's agency was compromised. The attitude corrected itself to fit the facts.
  *   **Sceptic Interpretation:** The fading is psychological weather. The causal explanation displaced the moral view, proving that moral warrant is fragile in the face of causal knowledge.
  *   **Prediction:** The Strawsonian predicts resentment will persist if the illness is shown *not* to affect the specific cognitive faculties relevant to the dispute. The Sceptic predicts resentment will fade proportionally to the degree of causal understanding, regardless of specific faculty impairment.

  **Crux 3: The Persistence Datum**
  *Data:* The convenor has believed in determinism for fifty years, yet his reactive attitudes (gratitude, indignation) remain unchanged. He cannot sustain the objective attitude globally.
  *   **Strawsonian Interpretation:** This shows reactive attitudes are natural kinds, immune to metaphysical theory. They are not the sort of thing a thesis could dislodge.
  *   **Sceptic Interpretation:** This is an irrational residue of evolutionary history. The persistence of the attitude proves human cognitive inertia, not its validity.
  *   **Prediction:** The Strawsonian predicts that even if determinism becomes culturally dominant, reactive attitudes will remain functionally identical. The Sceptic predicts that widespread acceptance of determinism will gradually erode the intensity and frequency of retributive blame.

  **IV. Verbal Disputes and Irreconcilability**
  We identify a verbal dispute regarding the term "Responsibility."
  *   **Strawsonian Usage:** Refers to participation in the moral community and susceptibility to reactive attitudes.
  *   **Sceptic Usage:** Refers to "basic desert," requiring a metaphysical ability to have done otherwise.
  *   **Resolution:** Once pinned down, we agree we are not arguing about whether people are *causally* responsible for actions (both agree they are). We are arguing about whether the *normative* practice of blame is justified if determinism is true.

  However, a substantive disagreement remains. We cannot agree on the following sentence: *"The technician deserved blame in a sense that is compatible with his actions being the inevitable upshot of his history."* The Strawsonian signs this; the Sceptic rejects it as contradictory.

  We conclude that the dispute is not merely verbal. It concerns whether the justification for our moral practices is internal (Strawsonian) or requires an external metaphysical warrant (Sceptic). We cannot sign a shared conclusion on this point. The Strawsonian holds that asking for an external warrant is a category error. The Sceptic holds that without an external warrant, the practice is a collective delusion.

  We submit this record as it stands. The disagreement is not a failure of communication, but a divergence in fundamental commitment. We recommend that future inquiry focus not on defining responsibility, but on the empirical predictions listed in Section III. If the Sceptic's prediction regarding cultural shift (Crux 3) proves true, the Strawsonian position loses its claim to natural necessity. If the Strawsonian's prediction regarding accountability (Crux 1) proves true, the Sceptic position loses its claim to pragmatic viability. Until then, we remain in adversarial collaboration.

  **Signed:**
  [The Strawsonian]
  [The Sceptic]
  **Convened by:**
  [The Retired Biologist]
