      *   **Task:** Write an 8-minute opening speech (approx. 1000-1200 words spoken at a normal pace).
      *   **Key Content:**
          *   Acknowledge the two conflicting member views ("nobody voted for us" vs. "we *are* the people").
          *   Address the concept of "the will of the people" honestly (it's not singular/static, framing/ordering matters) without demoralizing them ("so nothing matters").
          *   Motivate them to give up four weekends despite the advisory nature (no promises of binding outcomes).
          *   Tone: Honest, spoken style (not bullet points), no named philosophers, no jargon requiring definition.
          *   Constraint: No splitting the difference down the middle (needs a synthesized view).
          *   Final Requirement: One sentence outside the speech summarizing what "the will of the people" actually is (for the hostile councillor).

  2.  **Determine the Core Message/Theme:**
      *   The tension is between legitimacy (elections) and representation (sortition/random selection).
      *   The tricky bit is the "will of the people." The prompt asks to acknowledge that preferences change based on framing (social choice theory/arrow's theorem vibes) without saying "nothing matters."
      *   The solution: The "will of the people" isn't a pre-existing treasure hunt where they find a hidden object. It's a *construction* through deliberation. It's not about revealing what everyone *already* thinks, but about working out what everyone *could* agree is reasonable after hearing the evidence.
      *   Motivation: You aren't guessing what people want; you are doing the hard work of thinking that normal politics skips. Your value isn't in being a poll; it's in being a jury.

  3.  **Drafting - Section by Section:**

      *   **Welcome & Context (1 min):** Welcome everyone, acknowledge the uniqueness of the room (random selection, age inclusion). Acknowledge the money (£9m).
      *   **The Elephant in the Room (2 mins):** Address the legitimacy question. Quote the two members ("nobody voted for us" vs. "we are the people"). Validate both without compromising.
      *   **The "Will of the People" Problem (3 mins):** This is the core challenge. Explain that there isn't a single hidden answer. Use an analogy (maybe a menu or a journey). Explain that how you ask changes the answer. But pivot: that's *why* you are here. Not to read minds, but to think deeply.
      *   **The Value of the Assembly (1 min):** Why give up four weekends? Because normal politics is shouting; this is listening. Advisory doesn't mean ignored. It means weighty.
      *   **Closing & Call to Action (1 min):** Set the ground rules implicitly. You are the town's brain trust for this specific question. Let's get to work.

  4.  **Refining the Tone:**
      *   Needs to sound spoken. Contractions, pauses, rhetorical questions.
      *   Avoid academic jargon (no "Condorcet paradox," no "deliberative democracy").
      *   Avoid being too wishy-washy. Needs conviction.
      *   Address the hostile councillors indirectly (acknowledge the tension without attacking them).
      *   Address the academics (show depth without name-dropping).

  5.  **Drafting - Specific Phrasing Challenges:**
      *   *The "Will of the People" explanation:* How to say "preferences are unstable" without saying "your work is futile"?
      *   *Idea:* Compare it to a puzzle vs. a painting. A puzzle has one solution. A painting is created. You are painting a picture of what's possible.
      *   *Better Idea:* Compare it to a verdict. A jury doesn't poll the neighborhood; they hear evidence and decide. Their decision *becomes* the verdict.
      *   *Addressing the "Advisory" limit:* Don't promise binding power. Promise serious consideration. The power is in the quality of the reasoning.

  6.  **Writing the Speech (Iterative Process):**
      *   *Opening:* Good morning. Look around. You look like the town.
      *   *The Money:* £9m. One off. Big decision.
      *   *The Tension:* I've heard two things from you. One says "we have no mandate." The other says "we are the mandate." Both touch truth.
      *   *The Hard Truth:* If we polled everyone tomorrow, we'd get noise. Ask differently, get different answers. There isn't a single hidden scroll somewhere that says "The Will of the People."
      *   *The Pivot:* So why are you here? Because the "will" isn't found, it's made. It's forged in rooms like this.
      *   *The Motivation:* You aren't a poll. You're a jury. Polls snap-shot confusion; juries resolve it.
      *   *The Output:* Advisory. But an advisory report backed by reason is harder to ignore than a demand backed by noise.
      *   *Closing:* Four weekends. Hard work. Worth it.

  7.  **Checking Constraints:**
      *   8 minutes? At ~130 words per minute, that's ~1000-1100 words.
      *   No named philosophers? Check.
      *   No jargon? Check.
      *   Final sentence outside speech? Check.

  8.  **Refining the "Will of the People" explanation:**
      *   Need to be careful not to sound like "anything goes."
      *   Emphasize that *considered* judgment is different from *raw* opinion.
      *   The "will" is what remains after the noise is stripped away.

  9.  **Final Polish:**
      *   Check rhythm. Ensure pauses are natural.
      *   Make sure the hostile councillors feel acknowledged but not attacked (respect the institution while validating the assembly).
      *   Make sure the academics hear rigor without buzzwords.
      *   Make sure the members feel empowered but grounded.

  10. **The Final Sentence:**
