answer: |-
  Good morning. Please, make yourselves comfortable.

  Look around this room. Really look. You see faces you might pass on the high street. You see people who work in the hospital, people who run small businesses, people who are looking for work, and students who haven't even finished their exams yet. We have sixteen-year-olds here who couldn't vote in the last general election, and we have neighbours who aren't on the electoral register at all. We argued for you to be here because a town isn't just a list of voters. A town is everyone who lives in it.

  You are here because of a rare piece of luck. A land sale has generated nine million pounds. It is a one-off windfall. It will not come again. And the question we are asking you is simple to state but hard to answer: what should we do with it?

  But before we get to the money, we need to talk about you. I know some of you are wondering why you are in this room instead of the town hall chamber. I've heard two very different concerns from members of this group already, and I want to address them head-on.

  One of you told me, "Nobody voted for us, so don't let anyone tell us we speak for the town." That is a humble thing to say, and it is honest. You did not stand for election. You do not have a mandate in the traditional sense. If you go home tonight and say, "I speak for the 90,000," someone will rightly say, "No, you don't."

  But another of you said something different. You said, "We *are* the people, so whatever we come up with is the will of the people and the council has to do it." That is powerful. It captures why we are here. You are a mirror of the community, not a subset of the politically active.

  Both of those people are half right. And if I just stood here and said, "The truth is somewhere in the middle," I would be wasting your time. So I want to be honest about what "the will of the people" actually is, because it is not what most of us think it is.

  We tend to imagine that inside the heads of the 90,000 residents, there is a hidden answer waiting to be found. We think if we could just ask the right question, or count the hands correctly, we would uncover the true will of the town. But that isn't how human judgment works.

  If I walk down the high street and ask people, "Should we cut taxes or improve services?" I will get one answer. If I ask, "Should we save for the future or spend now?" I might get another. If I present you with a list of options to rank, I will get a different result than if I ask you to choose just one. This isn't a trick. It isn't a flaw in this room. It is a fact of life. People are complex. Our priorities shift depending on how the choice is framed. There is no single, static scroll hidden in the town hall vault that says "The Will of The People."

  If that's true, you might be asking: why am I giving up four Saturdays? If the answer changes depending on how you ask the question, does what we decide here actually matter?

  This is the most important thing I will say to you today. You are not here to find a hidden answer. You are here to build one.

  Think of the difference between a opinion poll and a jury verdict. A poll is a snapshot of what people think right now, often with limited information, often based on how they feel this morning. It is raw opinion. A jury verdict is different. A jury listens to evidence. They hear from experts. They argue with each other. They change their minds. They strip away the noise until they reach a decision they can all stand by.

  Your job over the next four weekends is not to guess what the town already thinks. Your job is to do the thinking the town hasn't had the time to do.

  Normal politics is noisy. It is about shouting loudest, or winning by a single vote, or pleasing the people most likely to vote again next year. It rarely allows for nuance. It rarely allows for changing your mind without losing face. This assembly is different. You have no election to worry about. You have no party whip telling you how to vote. You have the freedom to change your mind when you hear a better argument.

  So, when you produce your recommendation, it will not be because you represent a majority in a poll. It will be because you represent a considered judgment. You will be able to say, "We looked at the evidence. We heard the experts. We argued until we found a path that makes sense." That is weighty. That is hard to ignore.

  I need to be clear about the rules. The output of this assembly is advisory. I cannot stand here and promise that the council will automatically enact whatever you decide. There are legal constraints, budgetary realities, and yes, there are elected councillors who have their own responsibilities. Some of those councillors are in this room today, and they have serious concerns about this process. I respect those concerns. Democracy is not just one thing; it is many things working together.

  But "advisory" does not mean "ignored." A recommendation from forty random citizens who have spent forty hours learning the details is heavier than a petition signed by hundreds who haven't. If you produce a report that is clear, reasoned, and reflects the hard work of deliberation, it creates a pressure that is difficult for any council to withstand. Not because you have the power to force it, but because you have the moral authority of having done the work properly.

  So, to the member who said nobody voted for you: You are right. You are not politicians. You don't need to promise the earth to get re-elected. You can tell the truth.

  To the member who said you are the people: You are right. You are the town's brain trust for this specific question. But with that comes the responsibility to listen, not just to speak.

  There will be moments over the next month when you will disagree. You might feel frustrated. You might wonder if your voice is being heard. That is normal. That is the work. If it were easy, we would have just done a survey.

  We are asking you to do something difficult. We are asking you to treat your neighbours as equals. We are asking you to weigh the needs of the sixteen-year-olds in this room against the needs of the pensioners who aren't here. We are asking you to look beyond what benefits your street, and ask what benefits the town.

  If you do that, if you really do that, then what you produce will not be just a suggestion. It will be a demonstration of what this community is capable of when it stops shouting and starts thinking.

  The money is waiting. The questions are hard. The town is watching. Let's get to work.

  ***

  This speech claims that "the will of the people" is not a pre-existing fact waiting to be discovered by voting, but a considered judgment that only exists after ordinary citizens have been given the time and evidence to look beyond their immediate interests.
