answer: |-
  I sit in the room behind the study where he used to keep the files. It is not a secret room, exactly, but it is a space he stopped entering years ago when the boxes were stacked and the dust settled into a grey felt over everything. From here I can hear the house breathing. I know the schedule of the heating pipes, when they clank in the basement and when they settle into that low hum that means the warmth is reaching the upstairs vents. I know which floorboard creaks near the kitchen door, the one that sounds like a sharp intake of breath, and I know to step over it when I move through the dark to check the locks. I have become a ghost in my own home, not by death but by design. It was the only way to let him be. If I stood in the doorway, if I let my shadow fall across his table, he would never know if he stayed for me or for the comfort I provided. So I became the comfort without the source. I became the weather.

  For twenty years I have managed the provisions. It is meticulous work. There are envelopes left in the mailbox with no return address, containing checks written in a hand that mimics a distant aunt who died before he was born. There are repairs made while he is at work, the leaky faucet washer replaced, the gutter cleared of autumn leaves so the water does not pool against the foundation. I watch the bills come in and I settle them in the night, sliding the paid statements back into the pile so the numbers align. He thinks he is lucky. He thinks there is a benevolent randomness to the universe that favors the careful man. Sometimes he thanks me when he thinks I am listening, speaking into the air of the kitchen while the coffee brews, and I stand in the hallway and hold my breath so he does not hear the shift of my weight. To speak would be to intervene. To intervene would be to coerce. I want the love to be his, not a transaction for safety. I want him to stay because the house is home, not because the landlord is watching.

  The silence has been heavy. I know the weight of it because I carry it. There were winters when the cold seemed to seep into the bones of the house, when the wind rattled the sashes and he sat wrapped in a blanket, looking toward the ceiling as if waiting for a voice to tell him it would end. I wanted to speak. I wanted to tell him that the furnace was fixed, that the fuel was paid for, that he was safe. But safety bought with a voice is not safety, it is captivity. So I let him shiver. I let him wonder. I let him talk into the disconnected phone. He developed habits to fill the quiet. He would bow his head at meals, eyes closed, hands folded, speaking words of thanks to the empty room. At first, it was hopeful. He was listening for an amen. Over the years, the hope drained out of it until it was just mechanics. A rhythm. A way to mark the time. He told me once, when we were still speaking face to face, that it felt like shouting down a line that had been cut. I told him to keep shouting. He looked at me with tired eyes and said he would, out of habit. That was the last real conversation we had before I stepped back into the walls.

  Yesterday was Tuesday. The light was flat and grey, the kind of afternoon that makes the furniture look older than it is. He was sitting at the kitchen table. I was in the pantry, checking the inventory of cans, making sure the labels faced forward. He was alone. I heard the scrape of his chair. I heard the sound of his breathing, which has become slightly labored in the last year, a wet rattle at the bottom of the inhale. He began to set the table for one. A plate, a fork, a glass of water. He did not turn on the radio. The silence of the house was absolute, save for the hum of the refrigerator. He sat down. He did not eat immediately. He folded his hands.

  I stopped counting the cans. I stood in the dark between the jars of peaches and the bags of rice. I waited for the habit. I waited for the rote recitation of gratitude that meant nothing anymore. He bowed his head. His hair is thin now, white at the temples. He closed his eyes. He was quiet for a long time, longer than usual. I could hear the clock on the wall ticking, measuring out the seconds I had stolen from him. Then he spoke. He did not ask for anything. He did not ask for warmth or health or a sign. He said, thank you for the quiet. He said, I know you are there, even if you do not show yourself. He said, I love you anyway.

  It was not dramatic. There was no choir. The refrigerator kicked on. A car drove past outside. But the air in the pantry shifted. The dust motes hanging in the sliver of light from the door crack seemed to stop moving. He meant it. That was the horror. He meant it. He loved the silence. He loved the absence. He had found a way to love me not because I was holding him up, but because I was letting him fall. He had validated the experiment. He had proven that the love could exist without the object. He had walked into the trap I set and he had locked it from the inside.

  If I step out now, if I say I am here, I make him a liar. If I reveal myself, I prove that his love was contingent on the possibility of my presence, or worse, that it was only beautiful because I was hidden. If I speak, I turn his sacrifice into a transaction. I turn his faith into a receipt. I cannot do that. I cannot take this moment of pure, uncoerced devotion and soil it with my voice. The plan worked. I have what I wanted. I have a son who loves me without seeing me. I have a love that is free. And because it is free, I can never claim it. I can never hold it. I can never let him know that I heard him.

  He stood up. The chair scraped against the linoleum. He ate his meal. I waited until I heard the water running in the sink, the clink of the plate being set in the dishwasher. Then I moved. I had to. The work does not stop because the heart breaks. There is a bill on the counter due on Friday. The roof needs inspection before the next storm. The latch on the back door is sticking again; I heard it catch when he went out to take the trash. I stepped out of the pantry. I walked through the kitchen while he was in the living room watching the television. I took the bill. I put on my coat. I went out into the evening air.

  It is cold outside. The wind is picking up. I walked to the mailbox and put the envelope inside. I walked back to the car and drove to the hardware store to buy the oil for the latch. I will return when he is asleep. I will oil the hinge. I will check the locks. I will sit in the room behind the study and listen to the house breathe. I will listen to him talk to the air. I will let him think he is alone. It is the only gift I have left to give him. To stay hidden is to honor the love he gave me in the quiet. To reveal myself would be to take it back. So I will keep the silence. I will keep the distance. I will keep the love safe by never touching it. The door is locked. I have the key. I will not use it. I will just sit here in the dark and watch the dust settle and wait for the morning when he wakes up and thanks the empty room again. I will let him. It is the only way to let him be mine.
