      *   *Conkling Point:* Be careful here. The user asks if condemning Conkling requires importing a purpose. Yes, because "Senatorial Courtesy" was a *working norm*. Calling it corruption requires saying the norm itself was illegitimate relative to the Constitution's text.
      *   *Arthur's Motivation:* The prompt notes Arthur expanded the act to insulate appointees. This is crucial. It means the "reform" wasn't purely altruistic (Def A); it was strategic (Def B logic applied to Def A rules). I need to highlight this tension.
