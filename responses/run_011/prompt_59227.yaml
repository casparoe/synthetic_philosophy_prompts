          3.  Pendleton Act: Started at 10% coverage; expanded by later presidents (insulating appointees).
          4.  Arthur: Former machine man, removed by Hayes, signed reform.
      *   **Definitions to Use:**
          1.  *Definition A (Formalist):* Corruption = Deviation from formal duties of a public role for private-regarding gain.
          2.  *Definition B (Relational/Reciprocal):* Gift-giving/patron-client ties = binding reciprocity (not corruption); impersonal office is a local achievement.
      *   **Tasks:**
          1.  Map the episode onto Definition A (Roles, Duties, Private Gain).
          2.  Evaluate what Definition A catches vs. misdescribes (Guiteau, Kickbacks, Conkling, Arthur).
          3.  Address whether condemning Conkling requires importing a purpose for the office beyond formal duties.
          4.  Assess the "universality claim" (Is impersonal office universal or local?).
          5.  Apply the User's Frame (Open-source maintainer + corporate sponsorship + disclosure). Does disclosure work? Does it presuppose separation of office/person?
          6.  Mark limits of the analysis (where the definition runs out).

  2.  **Initial Analysis & Mapping (Mental Draft):**

      *   *Definition A (Formalist):*
          *   Role: Federal Officeholder.
          *   Formal Duty: Execute laws, serve the public interest (implied by Constitution/statutes).
          *   Private Gain: Party power, personal salary kickbacks, Guiteau's consulship.
          *   *Problem:* In the Spoils System, the "formal duty" *included* party service informally. The statute didn't explicitly say "serve the party," but the practice was institutionalized.
      *   *Definition B (Reciprocal):*
          *   Role: Party Member/Client.
          *   Duty: Support the machine, get rewarded.
          *   Gain: Mutual benefit.
          *   *Problem:* Collapses the distinction between state and party.
      *   *Guiteau:* Under Def A, he's delusional about the "contract." Under Def B, he's a creditor demanding payment.
      *   *Conkling:* Under Def A, claiming a veto is a deviation (Constitution says President appoints). Under Def B, it's upholding the norm of the system.
      *   *Arthur:* Under Def A, signing Pendleton is fulfilling duty (cleaning up). Under Def B, it's betraying his patrons (or pragmatic survival).
      *   *Open Source:* Maintainer role. Corporate money. Prioritizing features. Disclosure. Is the maintainer a "public official"? No. But is the project "public infrastructure"? Yes.

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the constraint (case analysis, not survey). State the two definitions clearly as lenses.
      *   **Mapping Definition A (Formalist):**
          *   *Roles:* President, Senator, Officeholder, Applicant.
          *   *Formal Duties:* Constitution/Statutes. President appoints (with Senate consent). Officeholders serve the US, not the party.
          *   *Private Gain:* Party cohesion, personal income (kickbacks), Guiteau's status/salary.
          *   *Application:*
              *   *Guiteau:* He sees a contract (service -> office). Def A sees a delusion of entitlement to public property.
              *   *Kickbacks:* Def A sees embezzlement/theft of public salary. Def B sees dues.
              *   *Conkling:* Def A sees usurpation of Executive power. Def B sees upholding institutional stability/norm.
              *   *Arthur:* Def A sees restoration of duty. Def B sees breaking reciprocity.
      *   **What Definition A Misdescribes:**
          *   It treats the Spoils System as "corrupt" rather than "alternative governance." It ignores that the party *was* the hiring mechanism. It makes Conkling look like a rogue actor rather than a guardian of the prevailing norm.
          *   *Conkling Specific:* To condemn Conkling using Def A, you must assert the *purpose* of the office is public service, not party reward. The text of the Constitution doesn't explicitly ban patronage. You need a theory of "Public Trust" imported from outside the strict formal duties of the time.
      *   **Universality Claim:**
          *   Does this prove impersonal office is universal? No. It proves it was *contested*. The shift happened because the system became inefficient/dangerous (Guiteau), not because everyone suddenly realized patronage was morally wrong.
