answer: |-
  Here is the setup as I see it. Scheme one operates as a harm-aggregation framework that counts discrete killing events normalized by nutritional output, effectively asking how many individuals are destroyed to produce a unit of food. Scheme two operates as a population axiology framework that counts the welfare value of the resulting population relative to a counterfactual, asking which land-use policy brings about the best composition of existing lives including those prevented from existing.

  On the question of whether scheme two is a competitor or a superset, I am inclined to say they are rivals rather than nested variants, primarily because they rest on incompatible axiological commitments regarding the non-identity problem. While it is tempting to view scheme two as a superset since it accounts for both deaths and existence, scheme one is typically grounded in a person-affecting intuition that treats killing existing beings as a prima facie wrong regardless of the population consequences. Scheme two, by contrast, often relies on the total view or critical-level utilitarianism, where preventing a net-negative life can morally outweigh the harm of killing existing animals. If scheme two were merely a superset, it would simply add variables to scheme one, but instead it changes the moral valence of the variables themselves. In scheme one, a death is always a cost. In scheme two, a death might be instrumentally good if it is the mechanism by which we prevent a greater number of net-negative wild lives from coming into existence. This makes them normative competitors because accepting the logic of scheme two requires rejecting the deontological or person-affecting constraints that usually motivate scheme one.

  To see this divergence in practice, consider the comparison between extensive beef production and intensive soy cultivation. Under scheme one, soy almost invariably wins because the deaths per unit of protein are lower. Even accounting for field animals killed during harvesting, the land efficiency of soy means fewer total deaths per calorie than pasture-fed beef, which requires vast hectares for grazing plus the slaughter of the ruminant. Scheme one verdicts are clear: eat soy to minimize bodies destroyed. However, under scheme two, if we accept the empirical premise that wild animal lives are net negative due to starvation, disease, and predation, the verdict flips. Beef production requires significantly more land per calorie than soy. Consequently, choosing beef converts more wild habitat into pasture than choosing soy converts into cropland. If wild habitat supports net-negative lives and pasture supports fewer or none, then the beef option prevents more net-negative lives from existing than the soy option. Scheme two therefore recommends beef as the morally superior choice because it maximizes the prevention of suffering existence, whereas scheme one recommends soy to minimize killing. They are not just weighting the same facts differently; they are issuing opposite prescriptions based on whether we prioritize the rights of the killed or the welfare of the potentially existing.

  The stability of scheme two rides almost entirely on the sign assumption regarding wild lives. If the sign is unknown rather than negative, scheme two does not disappear but it loses its determinacy and collapses into a decision under moral uncertainty. We would then need to calculate the expected value of land conversion based on the probability distribution of wild welfare being positive, negative, or neutral. If we are agnostic, assigning a credence of roughly equal weight to positive and negative welfare, the expected value of preventing existence approaches zero, and scheme two converges back toward scheme one by default, focusing only on the certain harms of killing. However, if we hold a asymmetric credence where the probability of net-negative welfare is high but not certain, scheme two survives as a distinct framework but demands a much higher burden of proof for land conversion. It becomes a maximin problem or an expected utility calculation rather than a straightforward imperative. Without a settled sign, scheme two cannot generate the clean opposite verdicts seen in the beef-soy case, rendering it practically inert until empirical ethology resolves the welfare question.

  I am highly confident in the claim that these schemes are normative rivals rather than bookkeeping variants, as the shift from person-affecting to total view ethics fundamentally alters the permissibility conditions of killing. I am also confident that land-use intensity drives the divergence in the beef-soy case, given the well-established disparity in hectares per protein between ruminants and legumes. The point I am least sure about, and which remains the greatest source of vulnerability for scheme two, is the empirical welfare sign of wild animals. We lack robust data on the aggregate balance of pleasure and pain in wild populations, and until that is resolved, scheme two remains a theoretically coherent but empirically ungrounded framework.
