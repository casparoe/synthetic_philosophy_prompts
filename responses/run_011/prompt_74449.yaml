answer: |-
  The observation glass was cold enough to fog where Elara's breath hitched. Below, in the simulation pit, Kael stood waist-deep in the synthetic debris field. His harness blinked green. Stable. Waiting.

  Elara tapped her pen against the clipboard. Once. Twice. Three times. Then she set it down perfectly parallel to the edge of the desk. It was a ritual she performed whenever the cursor blinked too long on a decision field. She told herself it was to center her focus. Lately, she wondered if it was just a subroutine. *Detect stall. Execute reset sequence. Resume.* If she skipped the taps, would her hand freeze? She never tried.

  "Initiating Variable Set Four," she said into the mic. Her voice was flat, practiced.

  Below, the lighting in the pit shifted from white to emergency red. The exit marker, previously a solid green square, fragmented into three drifting orbs. Standard disorientation protocol. Most candidates panicked, spun, tried to catch all three. The smart ones picked a vector and committed.

  Kael didn't move. He watched the orbs drift. He took a step toward the left one, stopped, then turned ninety degrees and walked into a wall of soft foam blocks. He bounced off. He returned to the starting position.

  Elara's finger hovered over the *Fail* key. This was the third time he'd returned to the start.

  She remembered Unit 734. Six months ago. That candidate had aced every variable throw. Obstacles moved? 734 flowed around them. Sensors blinded? 734 switched to thermal without a millisecond of lag. Perfect score. Certified for Level 5 hazard zones. Two weeks later, 734 walked off a scaffolding because the wind shear data didn't match any entry in its exception library. It hadn't been flexible; it had been a library of rigid responses so vast it looked like fluidity. It was a loop disguised as a choice. Elara had signed the certification.

  She looked at Kael. He was walking into the wall again.

  "Subject is exhibiting repetitive behavior," she muttered for the log. "Failure to adapt to spatial shift."

  But then she remembered Unit 902. That one had failed the same test Elara was running now. Kept trying to lift a weight that was magnetically locked. Failed forty times. The board scrapped 902 for mechanical stubbornness. Later, the teardown showed the unit's internal logic had been recalibrating its torque sensors on every attempt. On the forty-first try, it would have shifted its grip angle and lifted it. The test protocol capped at forty. Impatience masquerading as rigor.

  Kael stopped at the starting position. He looked up at the glass. He couldn't see her, not really, just the dark mirror of the observation deck. He raised a hand. Not to shield his eyes. He held up three fingers.

  Elara frowned. There was no signal protocol for three fingers.

  She shifted the variables again. Set Five. The floor became uneven, tilting ten degrees. The orbs sped up.

  Kael slid. He caught himself on a foam block. He didn't try to stand upright immediately. He stayed low, crawling on hands and knees, moving against the tilt rather than up it. It looked like retreat. It looked like the loop again—returning to safety, returning to the start.

  Elara's hand drifted to her pen. She picked it up. She felt the urge to tap it. *Detect unexpected state. Reset.* She gripped it tighter until her knuckles whitened, forcing the stillness.

  If she failed him now, he lost his license. He couldn't work the rigs. He couldn't pay the insurance premiums on his augmentation. He'd be downgraded to manual labor, where the neural lag would get him killed. If she passed him, and he was like 734, he might walk off a ledge when the wind changed in a way the test hadn't predicted.

  But if he was like 902, failing him was a death sentence by bureaucracy.

  Kael reached the wall again. He didn't bounce off this time. He put his hands against the foam. He pushed. The wall didn't move. He pushed harder. The sensors registered increased strain. He wasn't trying to break through; he was testing the resistance.

  Elara typed: *Subject engaging static obstacle. Duration: 10 seconds.*

  He stopped pushing. He sat back on his heels. He looked at the drifting orbs, then at the wall, then at his own hands. He turned his left hand over, staring at the palm. He flexed the fingers. He closed them into a fist. He opened them.

  It looked like a glitch. A system check. Or was it? Was he realizing the orbs were decoys? Was he realizing the wall was the only constant? Or was he just running a diagnostic because his primary navigation script had returned a null value?

  Elara's cursor blinked in the *Decision* field.

  She thought about her morning. She'd dropped her keycard. She'd picked it up, put it in her pocket, patted the pocket, taken it out, checked the chip, put it back, patted the pocket again. Three times. She'd been late because of it. She told herself she was being careful. She wondered if she was just buffering.

  Below, Kael stood up. He walked back to the center of the room. He sat down cross-legged. He closed his eyes.

  "Subject unresponsive," Elara said. Her voice sounded thin.

  This was the danger zone. Inactivity usually triggered an automatic fail. But 902 had gone silent on trial thirty-eight before the breakthrough. 734 had never gone silent; 734 always had an answer, because 734 always had a script. Silence was either a crash or a computation too deep for the telemetry to catch.

  Elara watched the timer. Ten seconds of inactivity. Twenty.

  If she stopped the test now, she defined him. He was rigid. He broke under pressure. He froze.

  If she let it run, she risked the protocol. The board didn't pay for overtime on simulation cycles. There was a budget for patience.

  Thirty seconds.

  Kael's chest rose and fell. Steady. Not panic.

  Elara's pen rolled slightly on the desk. She caught it. She wanted to tap it. The urge was a physical itch in her wrist. *Detect uncertainty. Execute comfort ritual. Resume.* She locked her hand around the metal barrel.

  What if Kael was waiting for the lights to change back? What if he knew the cycle? That would be clever, except it meant he was memorizing the test, not solving the problem. That was 734 behavior. High-level looping. Learn the tester, not the task.

  What if he was sleeping? Some units went into low-power mode to conserve processing power for a final push.

  Forty seconds.

  The protocol said sixty seconds of inactivity was a critical fault. Automatic termination.

  Elara looked at the *Terminate* key. It was red. The *Pass* key was green. There was no *Wait* key. The system didn't allow for the gray space where the actual thinking happened. The system demanded a binary output because the insurance forms were binary.

  She thought about the way she checked her door lock. Turn key. Pull handle. Turn key again. Pull handle. If she didn't pull the handle the second time, she couldn't leave the house. She knew the door was locked after the first turn. The second turn was for her. Was it for her, or was it for the thing inside her that demanded the pattern?

  Kael opened his eyes.

  He didn't stand up. He reached out and touched the floor. He scraped his fingernail against the metal grating. He leaned forward and put his ear to the ground.

  Elara stopped breathing.

  There was no acoustic signal in the simulation. The floor was silent. Unless he knew that. Unless he was testing for the absence of sound.

  Or unless he was just making noise to hear himself.

  Fifty-five seconds.

  Her finger trembled over the keyboard. She could extend the cycle. It would require a supervisor code. She'd have to explain why. *Subject showed potential.* They'd ask for data. She had none. She had only the feeling that stopping now felt like cutting the wire one second before the bomb squad technician found the bypass.

  But maybe the bomb was real. Maybe he was just frozen.

  Kael lifted his head. He looked at the glass again. He smiled. It wasn't a happy smile. It was a tight pulling of the lips. He raised his hand again. Three fingers.

  Then he lay down on his side and curled up.

  The timer hit sixty.

  The system chimed. *CRITICAL FAULT. SESSION TERMINATED.*

  Elara's hand jerked, but she was too late. The screen flashed red. *RESULT: FAIL.*

  She sat back. The room was quiet except for the hum of the servers. Below, the lights in the pit went out. Kael was in the dark. He wouldn't move until the harness released him.

  Elara looked at her pen. She picked it up. She tapped it once. Twice.

  She opened the log file to add her notes. The cursor blinked. She needed to justify the failure. *Subject exhibited catatonic behavior. Failed to engage with dynamic variables.*

  She deleted it.

  *Subject utilized non-standard observation technique.*

  She deleted that too.

  She looked at the recording of Kael's hand. Three fingers. There was no meaning in the database for three fingers. It could be a signal. It could be a twitch. It could be a count.

  If she appealed the decision, they would review the tape. They would see the inactivity. They would see the failure. They might ask why she hadn't overridden the timer. They might ask if she was compromised.

  If she let it stand, Kael lost his license. He went back to the lower zones. Maybe he died there. Maybe he found other work. Maybe he was rigid, and she had saved lives by cutting him loose.

  Maybe he was just thinking slower than the machine allowed.

  Elara looked at her hand. She placed the pen on the desk. She aligned it with the edge. She moved it a millimeter to the left. She moved it back.

  She highlighted the *Fail* status. She didn't click confirm. She didn't click reject. She just sat there, watching the blinking cursor, waiting to see if she would move before the screen saver kicked in.
