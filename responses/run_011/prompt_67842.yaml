  6.  *(Self-Correction during drafting)*: Wait, I need to be careful about the "Soul over Body" analogy. Aristotle says Master/Slave is like Soul/Body (Despotic). But he also says Intellect/Appetite is Political. The user's hunch is that this distinction is key. I need to confirm that Aristotle explicitly links Master/Slave to the Soul/Body (Despotic) model. Yes, 1254b4-5. "The soul rules the body with the sway of a master." This confirms the user's hunch. The slave is analogous to the *body*, not the appetites governed politically. This is crucial. The slave's reason is like the body's capacity to move, not the intellect's capacity to rule. Wait, no. The slave *has* reason (apprehends it). So the slave is a body that can hear reason. The Master provides the *arche* (starting point).
      *   *Correction:* The slave participates in reason enough to follow it, but the *source* of the reason is external. The analogy is: Master (Reason) -> Slave (Body/Instrument).
