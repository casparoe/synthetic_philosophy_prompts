      *   Are the camps strawmen? They look like stylized caricatures of real interpretive tendencies, but not *pure* inventions. Camp 1 is the standard neoclassical reading (Hume as precursor to Friedman). Camp 2 is the historical/contextualist reading (Hume as concerned with development and state power).
      *   Is the debate stalled? Yes, because both sides can point to different essays or even different paragraphs within "Of Money" and "Of the Balance of Trade."
      *   User's Hypothesis: It's largely correct. The tension between long-run neutrality and short-run non-neutrality is the engine of the confusion. But there's a deeper philosophical layer about *what* Hume thinks economic variables represent (real vs. nominal).

  3.  **Brainstorming Candidate Diagnoses:**
      *   *Diagnosis A (Time Horizon):* It's purely about short-run vs. long-run. Camp 1 focuses on the equilibrium endpoint; Camp 2 focuses on the adjustment path.
      *   *Diagnosis B (Definition of Riches):* Camp 1 thinks Hume defines riches as goods/consumption. Camp 2 thinks Hume defines riches as state power/military capacity.
      *   *Diagnosis C (Methodology):* Camp 1 tries to make Hume logically consistent with modern theory. Camp 2 tries to make Hume consistent with 18th-century policy concerns.
      *   *Diagnosis D (The Nature of Money):* Camp 1 sees money as a counter. Camp 2 sees money as a signal/incentive mechanism.

  4.  **Selecting the Best Diagnosis:**
      *   Diagnosis A is too simple. Hume explicitly links money to industry *during* the inflation, but Camp 2 claims this has lasting effects ("keeps alive a spirit").
