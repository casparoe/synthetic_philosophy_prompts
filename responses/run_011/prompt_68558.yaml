answer: |-
  Manual C employs a proxy function that maps every hole to its material lining. To preserve truth values, C systematically reinterprets the logical vocabulary alongside the terms. The identity predicate is read as "bounds the same cavity as," so when two cavities merge, the corresponding linings are counted as one; when a cavity splits, the lining divides. The predicate "is gone" is translated not as cessation of existence but as "is obstructed." Thus, when the wall is packed, the lining persists but satisfies "is obstructed," making the sentence "The kethu is gone" true under C, just as it is under A. The numerals count equivalence classes of linings under the cavity-bounding relation. Every Kesho sentence retains its truth value because the permutation of reference is compensated by a reciprocal permutation of the predicates.

  You ask if this is merely bookkeeping. It is not, because ontology is not a notation. If there were a fact of the matter about what *kethu* refers to, one of these manuals would be false. But behavioral evidence fixes only stimulus meaning and truth values, not reference. Since both manuals account for all behavior equally, there is no fact of the matter whether the speakers refer to holes or linings. This is not a claim about your notational habits; it is a claim about the world and the language-world relation. We cannot step outside our own manual to check which one matches the "real" reference, because reference itself is indeterminate. The discovery is that Kesho ontology is as indeterminate as our own.
