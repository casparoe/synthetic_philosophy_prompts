  write me a short story, around 1200 words, in British English please.

  The set-up I want: a members' club — clubhouse, bar tab, a rulebook nobody has properly read since 1974 — whose rulebook has exactly one clause that matters: any rule, including this clause itself, may be changed by a two-thirds vote at the monthly meeting. A new member tables an amendment saying that no amendment passed after that date may ever take effect, and that if this amendment is itself repealed, it springs back into force at the moment the repeal is carried.

  Follow it over three or four meetings. I want the procedural scrabbling, the clerk trying to minute a rule that is and isn't in force, the barrister member who gets very excited, the old boys who just want their whist night. Don't let anybody explain the paradox in dialogue or in narration — it should come through in the minutes and in people's faces. Dry, slightly funny tone. And end with the club having to settle something utterly mundane (a disputed trophy, a refund on the bar tab) under a rulebook that no longer has a determinate anwser to it.
