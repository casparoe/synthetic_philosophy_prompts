answer: |-
  The Chrysanthemum & Fir Club sat heavily on its foundations in Mayfair, a building of red brick and quiet judgement. Inside, the air smelled of beeswax, old port, and the specific dust of documents untouched since the War. The Rulebook was bound in green leather, swollen at the spine. Rule 12 stated that any provision within the book could be altered by a two-thirds majority vote at a Monthly General Meeting. Nobody had read past Rule 12 since 1974.

  In November 1974, a new member, Mr. Vane, tabled a motion. He was a quiet man who sat in the corner and cleaned his spectacles repeatedly.

  "Rule 44(b)," Vane said, his voice barely disturbing the ash on the cigar tray. "No amendment passed after the first day of November 1974 shall take effect. Furthermore, should this rule be repealed, it shall immediately spring back into force at the precise moment the repeal is carried."

  Colonel Trevelyan, who cared primarily for the whist schedule, grunted. "Seconded. Gets us out of meetings early."

  Mr. Halloway, a barrister with eyes like polished flint, leaned forward. He did not second it, but he did not oppose it either. He simply watched Vane. The vote was called. The show of hands was precise: twenty-four for, twelve against. The two-thirds threshold was met.

  The Clerk, Mr. Grist, adjusted his glasses. He dipped his pen. In the Minute Book, under *Any Other Business*, he wrote: *Rule 44(b) enacted.* He underlined it twice.

  ***

  The December meeting was colder. The fire in the grate was struggling. Halloway arrived early, carrying a stack of papers. He wished to amend the dress code to allow open-collar shirts on Tuesdays.

  "Order," said the Chairman.

  "Point of order," Halloway snapped. "Rule 44(b). The proposed amendment is post-November. It cannot take effect."

  "Rubbish," said Trevelyan. "Vote it out."

  "Then we must repeal 44(b) first," Halloway said. He looked delighted. It was a look usually reserved for cross-examination.

  A motion to repeal 44(b) was tabled. The vote was taken. Twenty-six for, ten against. The repeal passed.

  Grist opened the Minute Book. He wrote: *Rule 44(b) repealed.* He looked at the page. He looked at Halloway. Halloway was smiling at the ceiling. Grist's hand hovered. Slowly, beneath the line he had just written, he added: *Rule 44(b) reinstated per own clause.*

  He put the pen down. He picked up a blotter and pressed it onto the ink, holding it there for a long time.

  "Can we vote on the shirts now?" Trevelyan asked.

  "The rules regarding voting are amendments," Halloway said softly. "Are they in force? Are they not?"

  Trevelyan poured a brandy. "I want my whist."

  ***

  By January, the room felt smaller. The gaslights hummed. Grist sat at the table with the Minute Book open. The previous page was a mess of strikethroughs and brackets.

  "Minutes of the last meeting," the Chairman said.

  "Objection," said Halloway. "To approve the minutes is to amend the record. Rule 44(b) prohibits amendments taking effect. Yet if we do not approve them, they are not minutes."

  "Surely we just agree them?" said a member from the back.

  "Agreement is a procedural amendment," Halloway said. He was vibrating slightly, like a tuning fork struck against a wall. "We are operating under a rule that says we cannot operate under new rules, unless we repeal the rule, which causes the rule to exist, which prevents the repeal."

  "Does the bar tab count?" Trevelyan asked. "I'm out of pocket for the Christmas sherry."

  "The bar tab is governed by Rule 30," Grist said. He looked exhausted. His tie was crooked. "Rule 30 was amended in 1973. It is safe."

  "But the method of claiming reimbursement was updated in December," Halloway countered. "That update is void. But the voidance is void because of the reinstatement clause. So the update is valid. But only until the next meeting, at which point it might not be."

  Grist rubbed his temples. He turned a page in the Minute Book. He wrote: *Meeting convened.* He crossed it out. He wrote: *Meeting purported to convene.* He crossed that out. He left the line blank.

  The members sat in silence. The clock on the mantle ticked. It was the only sound that seemed certain. Halloway stared at the blank line in the book, his mouth slightly open, breathing in the logical vacuum. Trevelyan shuffled a deck of cards, the sound sharp and illicit in the quiet room.

  "Whist?" Trevelyan suggested.

  "No rulings on scoring," Grist said quickly. "Please."

  ***

  February brought the dispute. It was not about the constitution, or the dress code, or the nature of authority. It was about the Silver Salver.

  The Salver was awarded annually for the highest whist score. Trevelyan claimed it. Mr. Pym claimed it. The scores were identical. The tie-breaker rule, however, was the problem.

  "The tie-breaker was amended in January," Pym said. "It favours the player with the most tricks taken in the final hand."

  "That amendment is post-November," Trevelyan said. "Void."

  "But 44(b) was repealed in December," Pym countered.

  "It reinstated itself," Trevelyan said.

  "Only after the repeal was carried," Halloway interjected. He was standing now, pacing behind the chairs. "So, at the moment of repeal, the tie-breaker was valid. But then 44(b) returned. So the tie-breaker was valid for a nanosecond. Does a nanosecond constitute effect?"

  Grist looked at the Salver. It sat on the table, tarnished. He looked at the Minute Book. The pages were full of contradictions. *Rule in force.* *Rule not in force.* *Rule in force pending review.* *Review void.*

  "I just want the bloody trophy," Trevelyan said. He slammed a hand on the table. The dust jumped.

  "And I want the refund on the bar tab," said another member. "If the rules are void, do I owe the club money? If the rules are in force, the club owes me."

  Halloway stopped pacing. He looked at Grist. "Clerk. What is the status of Rule 1?"

  "Rule 1 defines the Club's name," Grist said.

  "Was it amended?"

  "No."

  "Are we sure?" Halloway asked. "To define the name is to amend the reality of the Club. If 44(b) holds, we may not be The Chrysanthemum & Fir. We may be nothing. Or we may be everything."

  Trevelyan picked up the Silver Salver. He weighed it in his hand. "I'm keeping it."

  "On what authority?" Pym demanded.

  "On the authority that I'm holding it," Trevelyan said.

  "And the bar tab?" the member asked. "Do I pay?"

  Grist looked at the blank line from January. He looked at Halloway, who was now staring out the window at the rain, muttering about temporal jurisdictions. He looked at Trevelyan, who was polishing the Salver with a handkerchief.

  The Rulebook lay open on the table. The green leather was cracked. The text was clear, yet it meant nothing. The two-thirds vote was a key that had locked the door from the inside.

  Grist dipped his pen. The ink was thick. He wrote in the Minute Book: *Dispute regarding Silver Salver and Bar Tab Refund.*

  He paused. He looked at the clock. The tick was still certain.

  He wrote: *Resolved by consensus.*

  He did not write what the consensus was. He did not write who held the Salver. He did not write whether the tab was paid. He simply closed the book. The thud of the cover was final.

  "Next meeting," Grist said. His voice was flat. "March first."

  "Same time?" Trevelyan asked, tucking the Salver under his arm.

  "Presumably," Grist said.

  "Good," said Trevelyan. "Whist?"

  "Whist," said Grist.

  Nobody voted on it. Nobody checked the book. They simply sat down, and the cards were dealt, and the game began under rules that were, for the moment, entirely imaginary. Halloway sat in the corner, watching the cards fall, smiling at the impossibility of the trick being played. Grist poured the port. He did not measure it.
