answer: |-
  1. Your "leashed sortition" distinction holds because the assemblies generated political cover precisely by lacking the power to impose outcomes. This insulation protected members from the accountability burdens that elected officials carry while allowing them to deliberate freely.

  2. The value derived less from descriptive representation than from the removal of re-election incentives, allowing members to process evidence without career risk. However, having no power to protect means this advantage proves only their capacity for recommendation, not governance.

  3. The politicians' committee stage saved the experiment by filtering recommendations through accountable actors, though this necessarily domesticated the raw deliberative output into legislatively viable terms. This confirms the leash was essential to bridge the gap between deliberation and decision.

  4. The near-identical margins suggest the assembly acted as a legitimating device for a societal shift already underway rather than an epistemic device that independently moved opinion. Sortition theory goes silent on this distinction, leaving unclear whether deliberation creates change or merely certifies it.

  5. Replacing career politicians was never the point, as Ireland shows the model works only for agenda-setting when tethered to elected authority. The theory goes silent on whether sortition can survive without this leash, suggesting the friend's claim exceeds the evidence.
