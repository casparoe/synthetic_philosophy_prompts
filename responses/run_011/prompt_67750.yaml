          *   Standard of competence (Knowledge vs. Sincere Intention).
      *   *Constitutivity:* If I promise without intention, is it a promise? (Searle says no, but ordinary language says yes, just a bad one). If I assert without knowledge, is it an assertion? (Yes, just a bad one). This is tricky.
      *   *Alternative Analogies:* Betting (commitment to truth), Warranty (guarantee of quality), Game Rules (constitutive rules).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the stakes. This is a classic Williamson vs. Brown/MacFarlane debate terrain. Set the stage for the "brainstorming" phase.

      *   **Phase 1: Brainstorming/Filtering Disanalogies:**
          *   *Idea 1:* Tense. Promises are future-directed; assertions are present/past-directed. *Verdict:* Cosmetic. Norms can apply across tenses.
          *   *Idea 2:* Control. I control whether I $\phi$ (promise), I don't control whether $p$ is true (assertion). *Verdict:* Significant. Affects the "ability" condition.
