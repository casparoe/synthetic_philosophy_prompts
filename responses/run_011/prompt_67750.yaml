          *   Create a table or clear list.
          *   Identify the "Empty Slot": Release/Waiver.

      *   **Phase 3: Sorting Disanalogies (Request 2):**
          *   *Cosmetic:* Tense, specific content type (action vs. fact).
          *   *Threatening:* The Epistemic Standard (Knowledge vs. Intention), The Waiver/Release condition, The Source of Normativity (Moral vs. Constitutive).
          *   *Why:* The epistemic standard directly impacts the KNA vs. BNA debate. The waiver impacts the constitutive claim.

      *   **Phase 4: The Classmate's Objection (Request 3):**
          *   This is the "Knowledge vs. Belief" issue.
