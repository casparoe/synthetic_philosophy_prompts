          *   If Assertion $\approx$ Promise, and Promise requires Belief/Intention, then Assertion requires Belief.
          *   Can the Advisor rescue this? Maybe by arguing that "giving your word" on a fact implies a guarantee of truth (knowledge), whereas "giving your word" on an action implies a guarantee of effort/outcome.
          *   *Verdict:* Classmate is likely right. The analogy naturally favors BNA/JNA unless rigged.

      *   **Phase 5: Constitutivity (Request 4):**
          *   Improper promise = still a promise (just breached).
          *   Improper assertion = still an assertion (just false/unwarranted).
          *   Does the analogy distinguish KNA from TNA (Truth) or BNA (Belief)?
          *   Problem: The analogy explains *why* there is a norm, but not *which* norm. It explains accountability, not the threshold of accountability.
