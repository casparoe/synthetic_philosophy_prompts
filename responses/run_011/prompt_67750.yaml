          *   *Testifying in Court:* Supports KNA/JNA. Imports: Legal sanctions, oath.

      *   **Final Verdict:**
          *   The analogy is heuristic, not probative. It motivates the *idea* of a norm but fails to specify *which* norm or prove constitutivity. The Advisor is using it to do too much heavy lifting.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I brainstorm out loud first? Yes, need to make sure that section feels like exploration, not just a list.
      *   *Check:* Did I address the "constitutive" vs "moral" distinction clearly? This is crucial for the Advisor's second claim. The promise analogy often conflates moral obligation (don't lie) with constitutive rules (counts as assertion).
      *   *Check:* Ensure the distinction between *improper* and *invalid* is clear. (Searle's distinction).
