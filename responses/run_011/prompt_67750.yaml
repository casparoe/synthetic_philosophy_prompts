  5.  **Final Polish:** Check against the 5 specific requirements.
      1.  Explicit mapping? Yes.
      2.  Sort disanalogies? Yes.
      3.  Classmate's belief/knowledge point? Yes.
      4.  Constitutivity & discrimination of norms? Yes.
      5.  Alternatives? Yes.
      6.  Verdict? Yes.

      *Wait, one nuance on the Promise/Knowledge link.* Some philosophers (like Ross?) argue you shouldn't promise unless you know you can do it. But standard counterexample: "I promise to have lunch with you tomorrow." I don't *know* I won't get hit by a bus. But the promise is valid. So the norm of promising is Intention/Belief, not Knowledge. This strengthens the classmate's objection. I need to make sure this is highlighted.

      *On Constitutivity:* Williamson argues KNA is constitutive. The promise analogy suggests norms are external (moral/social) constraints on an act that exists prior to them. If I promise badly, I still promised. If I assert badly, I still asserted. So the analogy might actually *undermine* the constitutive claim if not handled carefully. It suggests the norm is regulative, not constitutive.

