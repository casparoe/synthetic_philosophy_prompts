      *   **Format:** "Brainstorm out loud" first (showing candidate disanalogies and culling), then address specific points 1-5, then a straight verdict.
      *   **Tone:** Professional, philosophical, rigorous, but conversational enough for a PhD reading group context.

  2.  **Initial Brainstorming & Mapping (Mental Draft):**
