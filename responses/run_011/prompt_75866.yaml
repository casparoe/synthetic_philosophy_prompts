          *   *Actually, standard scholarship:* U is often taught before S because U establishes the link between word and object that S relies on.
          *   *Okay, I will recommend P -> I -> U -> S.* I will explain that while the *example* of U uses a sentence, the *epistemic function* of U (learning meaning) is prerequisite for S (using meaning to gain knowledge). This addresses the dependency.

      *   **The *Upamāna* Example:**
          *   *Problem:* Cow/Wild Ox is culturally distant. Student life example needed.
          *   *Idea:* "A 'flamingo' is like a pink heron." Student sees a bird, recognizes it.
          *   *Problem:* Is that just inference? "It looks like a heron, it's pink, therefore flamingo."
          *   *Nyāya Defense:* Inference requires a universal connection (*vyāpti*). Comparison relies on *similarity* (*sādṛśya*), not a logical entailment.
          *   *Better Example:* Tech/Software. "This new app interface works like Spotify." You haven't used it. You open it. You recognize the functions based on the similarity description.
          *   *Crucial Constraint:* Must not look like P + Memory + Inference.
          *   *Key Distinction:* Inference yields a conclusion ("This is X"). Comparison yields the *connection* between the name and the thing ("This thing is what 'X' refers to").
          *   *Refined Example:* The "Gavaya" is best because it's about *naming* an unknown object based on similarity to a known object.
          *   *Student Version:* "The 'M1' chip is like the Intel i7 but for Macs." You see a spec sheet. You realize what the M1 *is* in relation to what you know.
          *   *Even Better:* "A 'corgi' is like a small German Shepherd with short legs." You go to a park. You see a dog. You say "That's a corgi."
          *   *Why it works:* You didn't infer "If short legs + shepherd face -> corgi." You recognized the *match* between the description and the object.
