      *   *Timing:* 50 mins is tight.
      *   *Intro (5 mins):* Cartesian hangover. Shift from "Belief" to "Instrument."
      *   *Perception (5 mins):* Quick. Direct contact.
      *   *Inference (10 mins):* Quick. Mark + Relation.
      *   *Comparison (15 mins):* The heavy lifter. The Example. The "Not Inference" fight.
      *   *Testimony (10 mins):* Reliable speaker. The "Not Induction" fight.
      *   *Wrap/Circularity (5 mins):* Pragmatic check. Exit question.

      *   *Refining the Order:* I need to be firm on P -> I -> U -> S.
      *   *Why?* Because U explains word-meaning connection. S relies on word-meaning connection. Even though the *example* of U uses a sentence, the *epistemic category* of U is the foundation of linguistic meaning which S transmits.
      *   *Wait, one more check:* If I do S before U, the U example makes more sense ("Someone told me..."). If I do U before S, the dependency is clearer ("You need U to learn words to use S").
      *   *Decision:* I will advise **P -> I -> S -> U**. Why? Because in the classroom, the *gavaya* example confuses students if they haven't established *Śabda* (Testimony) as a valid source of information first. If *Śabda* is suspect, the setup for *Upamāna* is suspect. By establishing *Śabda* (reliable speaker) first, the setup for *Upamāna* is secure, allowing the focus to remain on the *recognition via similarity* rather than doubting the initial statement.
