answer: |-
  Here is a 50-minute battle plan designed to disrupt the Cartesian/Gettier frame and get them thinking instrumentally.

  ### 1. The Order: Perception → Inference → Testimony → Comparison
  **Do not follow the *Nyāya-sūtra* list order (P, I, U, S).** Follow the **pedagogical dependency** order.

  *   **The Dependency Structure:**
      *   **Perception (*Pratyakṣa*):** The bedrock. No other *pramāṇa* works without sensory contact.
      *   **Inference (*Anumāna*):** Depends on Perception (you must perceive the *liṅga*/mark, e.g., smoke).
      *   **Testimony (*Śabda*):** Depends on Perception (hearing/reading words) and Inference (assessing speaker reliability).
      *   **Comparison (*Upamāna*):** This is the tricky one. In the classic *gavaya* example, Comparison *uses* a sentence ("A *gavaya* is like a cow"). If you haven't established Testimony as a valid source yet, students will reject the setup of the Comparison example as "unjustified hearsay."
  *   **The Plan:** Teach Testimony *before* Comparison.
  *   **Why:** You need to validate the *statement* ("The *gavaya* is like a cow") via Testimony so the class focuses on the *recognition* (Comparison) rather than doubting the source.
  *   **The Caveat:** Explicitly tell the class: "Nyāya actually puts Comparison before Testimony in their list because Comparison explains how we learn word meanings in the first place. But for today, we're doing Testimony first so the example makes sense." This shows you know the text but are prioritizing their understanding.

  ### 2. The *Upamāna* Example: The "Corgi" Case
  Drop the cow/wild ox. It creates cultural distance that distracts from the epistemology. Use a **naming/recognition** case from student life.

  *   **The Example:** "A friend texts you: 'A Corgi looks like a German Shepherd on short legs.' You walk across campus, see a dog, and think: 'Ah, *that* is what 'Corgi' refers to.'"
  *   **What it MUST have:**
      1.  **Prior Verbal Description:** The text message (establishes the link between word and known object).
      2.  **Perceptual Encounter:** Seeing the new object (the dog on campus).
      3.  **The Cognition of Similarity:** The moment of "fit" between the description and the object.
      4.  **The Result:** Knowledge of the *relation between the word and the object*, not just knowledge of the object.
  *   **What it MUST NOT have:**
      1.  **A Universal Rule (Vyāpti):** Do not say "All short-legged shepherds are Corgis." That turns it into Inference.
      2.  **Deduction:** The student must not be *calculating* features. It must be a recognition of resemblance.
  *   **Why this works:** It isolates *Upamāna* as the bridge between language and the world. Inference tells you "This dog has short legs." Testimony told you "Corgis have short legs." Comparison tells you "This dog is the *referent* of the word 'Corgi'."

  ### 3. Misconceptions: Order of Appearance & Triage
  They will arrive with Cartesian goggles. Here is the sequence of pushback and how to handle it.

  1.  **"This is just a list of foundational beliefs." (Minute 5)**
      *   **When:** As soon as you write "Pramāṇa" on the board.
      *   **Action:** **Let this hit at full strength.** Do not defuse it immediately.
      *   **Why:** It validates their background (Descartes/Gettier). Let them settle into the comfort of "Okay, these are the basic beliefs."
      *   **The Pivot:** After 5 minutes, correct it. "Descartes wants foundations. Nyāya wants *instruments*. A belief is a state; a *pramāṇa* is a tool. We aren't listing what we know; we're listing *how* we know." This shift is the most important conceptual move of the section.

  2.  **"Comparison is just Inference from similarity." (Minute 30)**
      *   **When:** During the Corgi example.
      *   **Action:** **Crush this.** This is the core philosophical work of the session.
      *   **The Reply:** "Inference requires a universal connection (*vyāpti*): 'Wherever there is short-leg-shepherd-ness, there is a Corgi.' Comparison requires only *similarity*. You don't need a rule to recognize a face as your friend's; you just see the match. Nyāya says reducing this to inference over-intellectualizes recognition."

  3.  **"Testimony is just Induction about speaker reliability." (Minute 40)**
      *   **When:** During Testimony.
      *   **Action:** **Fight, but be willing to park.**
      *   **The Reply:** "Reductionists say I infer 'He is reliable' then 'He is telling the truth.' Nyāya says we accept testimony by *default* unless we have a defeater (reason to doubt). You don't inductively verify your professor's credentials before every lecture; you trust the institution. That default trust is *Śabda*."

  4.  **"The list is arbitrary." (Minute 45)**
      *   **When:** Wrap up.
      *   **Action:** Acknowledge. "Other schools (Buddhists, Cārvāka) argued for 2 or 1 *pramāṇas*. Nyāya defends 4 because they claim the other 3 cannot do the specific work of the 4th."

  ### 4. The Circularity Question (*Pramāṇa-siddhi*)
  **The Question:** "How do you know the *pramāṇas* are reliable without using a *pramāṇa* to check them? Isn't that circular?"

  **The Strategy:** **Park it, but leave a receipt.**
  Do not try to solve *svataḥ* vs. *parataḥ prāmāṇya* (intrinsic vs. extrinsic validity) in 5 minutes. You will drown.

  **The Script:**
  > "This is the million-rupee question in Nyāya. The short answer is: **Pragmatic Success (*Arthakriyā*).** We don't validate the scale by weighing the scale; we validate it by seeing if it weighs flour correctly. If acting on Perception and Inference lets you navigate the world without constantly bumping into walls, the instruments are validated. Nyāya is a realist school: the world pushes back. If your *pramāṇas* were broken, you wouldn't survive to ask the question."

  ### 5. The Exit Question
  Do not ask for definitions. Ask for **boundary conditions**.

  > **"If a liar tells you the truth by accident ('There is fire in the kitchen' when there is, but they didn't know), is that Testimony (*Śabda*)? Why or why not?"**

  *   **Why this works:**
      *   If they say "Yes," they missed that *Śabda* requires a *reliable* speaker (*āpta*).
      *   If they say "No," ask "Then how did you get the knowledge?" (Answer: It was a lucky guess/Inference, not Testimony).
      *   This forces them to distinguish the *source* from the *truth of the proposition*, which breaks the Gettier hangover.

  ### 6. What to Cut (and the One-Liner)
  You have 50 minutes. You cannot be comprehensive.

  1.  **Cut: Indeterminate vs. Determinate Perception (*Nirvikalpaka/Savikalpaka*).**
      *   **Reason to say:** "That distinction is about the *psychology* of seeing; we're studying the *logic* of knowing."
  2.  **Cut: The Buddhist Debate (2 vs. 4 *Pramāṇas*).**
      *   **Reason to say:** "We're analyzing the Nyāya toolbox, not reviewing the history of the toolbox's competitors."
  3.  **Cut: The Five-Step Inference (*Parārthānumāna*).**
      *   **Reason to say:** "We're treating Inference as a source of knowledge, not a formal debate syllogism."

  **One thing to KEEP that you might be tempted to cut:**
  *   **The definition of *Pramāṇa* as "Instrument" (*Karaṇa*).**
      *   Spend 3 minutes on this. It is the only way to break them out of the Cartesian "Foundational Belief" frame. If they leave thinking *pramāṇas* are "basic beliefs," the session failed. If they leave thinking they are "reliable instruments," it succeeded.

  ### Summary Timeline
  *   **0:00–0:05:** Intro. Let them call it "Foundationalism." Pivot to "Instrumentalism."
  *   **0:05–0:15:** Perception & Inference. (Fast. They know this from Descartes/Hume).
  *   **0:15–0:25:** Testimony. (Establish reliability/default trust).
  *   **0:25–0:40:** Comparison. (The Corgi example. Fight the "It's just Inference" battle here).
  *   **0:40–0:45:** Circularity. (Pragmatic reply).
  *   **0:45–0:50:** Exit Question & Dismiss.
