      *   **Misconceptions:**
          1.  "Comparison is just inference." (Will come during U).
          2.  "Testimony is just induction." (Will come during S).
          3.  "List with no argument." (Will come at start or end).
          *   *Strategy:* Let the "List with no argument" hit at the start. It frames the Cartesian anxiety. Address it by shifting from "Foundations" to "Instruments."
          *   *Fight:* "Comparison is Inference." This is the core philosophical work of the section.
          *   *Fight:* "Testimony is Induction." This is the core reductionist move.
          *   *Order:* They will ask about the list validity first. Then Inference-reduction during U. Then Induction-reduction during S.
          *   *Advice:* Let the "List" objection stand briefly to motivate the shift from Cartesianism. Crush the "Comparison=Inference" objection hard (it's the unique contribution). Park the "Testimony=Induction" for the end if time runs short, but try to hit it.

      *   **Circularity (*Pramāṇa-siddhi*):**
          *   *Question:* How do you validate the *pramāṇas* without using a *pramāṇa*?
          *   *Nyāya Answer:* Intrinsic validity (*svataḥ prāmāṇya*)? No, Nyāya is extrinsic (*parataḥ*). But they avoid infinite regress via *pragmatic success* (arthakriyā) and coherence.
          *   *TA Level:* Don't get into *svataḥ/parataḥ*. Use the "Tool" analogy. You don't weigh the scale with the scale; you check if it weighs things consistently.
          *   *Action:* Park it but give a "placeholder" answer. "Nyāya is realist; the world pushes back."

      *   **Exit Question:**
          *   Needs to test understanding of *pramāṇa* vs. *belief*.
          *   "If you dream you see fire, is it Perception?" (Too simple).
          *   "If a liar tells you the truth, is it Testimony?" (Good).
          *   "If you recognize a friend's voice on the phone, is that Inference or Perception?" (Classic Nyāya debate).
          *   *Best:* "You hear a noise, infer it's thunder. You hear a noise, recognize it as 'thunder' because someone told you 'that sound is thunder' last week. Which *pramāṇa* is which?"
          *   *Simpler:* "Give me a case where Testimony fails but Inference succeeds, and vice versa."
          *   *Best for "Got the Idea":* "Why can't Nyāya just reduce Comparison to Inference? What work is the 'similarity' doing?"

      *   **Cutting Room:**
          *   *Indeterminate vs. Determinate Perception (*Nirvikalpaka/Savikalpaka*):* CUT. Too technical, eats 15 mins, doesn't help the "foundations vs. instruments" shift.
          *   *Buddhist Debate (2 vs 4 pramāṇas):* CUT. Contextual noise for this specific intro.
          *   *Keep:* The definition of *Pramāṇa* as "Instrument" not "Source." This is the key shift from Descartes.

