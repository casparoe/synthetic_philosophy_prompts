      *Wait, no.* That's too subtle for 50 mins.
      *Better:* **Perception -> Inference -> Testimony -> Comparison.**
      *Why?* Because students grasp Testimony easily ("My professor told me"). Then Comparison is the "Wait, how did I learn what that word meant in the first place?" This makes Comparison the "meta" move that caps the section. It answers the "dependency" worry in the prompt directly: "Yes, Comparison needs a statement, but Testimony needs Comparison to explain meaning. We do Testimony first for clarity, but acknowledge the loop."
