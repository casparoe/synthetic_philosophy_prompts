answer: |-
  **MEMORANDUM**

  **TO:** Names and Memorials Committee
  **FROM:** Faculty Senate Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Dr. Elias Varnum

  **Purpose and Disclosure**
  This memo serves as my formal recommendation for Thursday's vote on the status of Dr. Elias Varnum's institutional commemorations. As the tie-breaking vote, I recognize the weight of this decision. I must disclose a personal bias: I completed my clinical rotations in the Varnum East Wing, and my primary mentor delivered the Varnum Lecture in 1998. There is a part of me that wishes to preserve the geography of my own training. However, institutional memory cannot be anchored solely in the nostalgia of current faculty. My recommendation prioritizes the hospital's stated values over my personal attachment.

  **The Function of Commemoration**
  We are conflating three distinct acts: *honoring*, *commemorating*, and *identifying*.
  1.  **Honor** implies moral endorsement and suggests the subject is a model for emulation.
  2.  **Commemorate** acknowledges historical impact without necessarily endorsing character.
  3.  **Identify** is purely functional (e.g., "East Wing").

  Names on buildings and endowed lectures are acts of **Honor**. They signal to patients, staff, and students who we value. The portrait is **Commemoration**. The attribution in clinical protocols is **Identification** of origin.
  *   **East Wing & Lecture:** These currently function as Honor. Given the findings, they cannot ethically continue to do so.
  *   **Portrait:** Should be moved from the lobby (Honor space) to the archive (Commemoration/History space).
  *   **Protocols:** The medical techniques remain valid. We retain the attribution as historical fact but strip the honorific context.

  **The "Man of His Time" Defense**
  The retain argument rests on three claims: he couldn't know better, everyone did it, and we would do the same. The evidence refutes the first two and renders the third irrelevant.
  1.  *Could not know better:* False. Body-snatching riots occurred in three cities Varnum knew. The state legislature passed an Anatomy Act specifically to curb the trade during his career. He was aware of the legal and social contour.
  2.  *Everyone did it:* Even if true, contemporaneous opposition matters. A rival physician denounced him in the county medical society minutes. Varnum's reply dismissed ethical concerns as "sentiment unfitting a man of science." He made a conscious choice to prioritize supply over consent.
  3.  *We would do the same:* This is a hypothetical that cannot be tested. Even if we concede that modern physicians might act similarly under 1850s pressure, it does not justify *current* honor. We are not judging Varnum for a 1850 crime; we are judging *our* 2023 decision to honor him in light of it.

  **The Baseline Problem**
  A trustee argued that condemning Varnum necessitates renaming "the whole map," implying this standard is too costly. This is a *reductio ad absurdum* that fails. If applying our ethical standards reveals that four other names on campus are similarly compromised, that is not an argument to keep Varnum; it is a discovery that the map requires an audit. Consistency is not a threat; it is a requirement of integrity. We cannot refuse to correct one error because there are others.

  **The Retain Case: Erasure and Inheritance**
  The strongest argument for retention is that removing the name erases history and that we remain beneficiaries of his work.
  *   *Erasure:* Keeping the name without context erases the victims—the pauper and Black families whose graves were violated. Renaming is not erasure; it is a correction of the historical record. We do not forget Varnum by removing his name from the wing; we remember him more accurately.
  *   *Inheritance:* It is true we use his methods and his endowment money. However, benefiting from tainted capital does not obligate us to venerate the source. We can utilize the endowment for its intended purpose (anatomy education) without attaching Varnum's name to it. To claim we must honor the man to use the money is a form of self-flattery—it suggests our current work is too morally fragile to stand apart from his.

  **Recommendations**
  I recommend we vote to **Remove Honorifics, Retain Historical Record.**

  1.  **East Wing:** Rename immediately. A temporary designation (e.g., "East Clinical Wing") should be used until a new name is selected via standard process.
  2.  **Varnum Lecture:** The endowment corpus remains, but the lecture series is renamed. The Varnum name is detached from the event.
  3.  **Portrait:** Removed from the lobby by December 1. Relocated to the hospital archive with an exhibit detailing the full scope of Varnum's career, including the body-snatching evidence.
  4.  **Protocols:** Technical attribution remains in internal documentation (e.g., "Varnum Method, mod.") but is removed from public-facing marketing or patient materials.
  5.  **Donor Family:** The Chair and I will meet with the great-great-granddaughter privately before Thursday's public announcement. We acknowledge her continued support but clarify that institutional naming rights are subject to ethical review.
  6.  **South Side Cemetery Association:** We will fund a permanent marker at the cemetery and issue a public acknowledgment of the specific harm done to the families interred there. This is not charity; it is restitution.
  7.  **Communication:** A press release will state clearly: *Dr. Varnum's contributions to medicine are historical fact; his methods of acquiring anatomical material violated human dignity then and now. The hospital chooses to honor the victims over the violator.*

  **Conclusion**
  I want the room I learned in to stay the room I learned in. But that desire is about *my* history, not the hospital's future. The "Man of His Time" defense collapses under the weight of Varnum's own recorded dismissal of ethical concerns. The "Slippery Slope" is actually a call for consistency. We can acknowledge Varnum's role in our founding without enshrining him as a moral exemplar.

  I move that we remove the name from the Wing and Lecture, relocate the portrait, and proceed with restitution to the Cemetery Association.

  **Vote:** Yes.
