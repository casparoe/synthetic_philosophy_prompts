answer: |-
  Thank you for sharing this, and for trusting me with something so personal about your father. It is a profound observation you have made, not just about grief but about the architecture of human experience itself. What you are describing does have a name, though it sits uncomfortably across the borders of philosophy, psychology, and neurology. The most common label is the sense of presence or the feeling of presence, but in the context of bereavement and without sensory content, it is often discussed by phenomenologists like Matthew Ratcliffe as a type of existential feeling. It is distinct from the phantom vibrations your roommate experiences because her case involves a sensory signal, however faint or misinterpreted, whereas your father's experience is explicitly non-sensory. This distinction is crucial for the carving you are asking for, because it separates his experience from the traditional category of hallucination. A hallucination, in the standard philosophical sense, is a perceptual experience that occurs in the absence of an appropriate stimulus; it mimics seeing or hearing. Your father is not mimicking seeing. He is experiencing a spatial and personal orientation that carries the weight of perception without the sensory data.

  To understand where this fits on the map, we have to look at what it is often confused with and why those classifications fail. The nearest neighbor is hallucination, but as you noted, hallucinations have sensory character. If you hallucinate a lamp, you have a visual experience of a lamp. Your father has no visual experience of your mother, yet he has the same certainty of her location that he would have if he saw the lamp. The next nearest neighbor is belief, but this fails because belief involves a commitment to truth that guides action. If he believed she was there, he would set a place for her or turn to speak. He explicitly denies the truth of the proposition while maintaining the experiential force. Finally, it is not intuition or a hunch, because those are typically propositional attitudes about how things are, whereas this is presentational. It feels like an encounter with the environment rather than a thought about it. So the carving requires us to isolate a state that is presentational and immediate like perception, non-sensory unlike hallucination, and non-committal unlike belief. It is a modulation of the background field of awareness rather than an object within it.

  This brings us to the philosophical trouble you sensed regarding the argument from illusion and the good-case versus bad-case dichotomy. The traditional debate assumes that perception is fundamentally about sensory processing. In the good case, you see a real object. In the bad case, you have a sensory experience without an object. The argument from illusion suggests that because the two feel the same from the inside, they must share a common mental ingredient, often called sense-data. Disjunctivists reply that they are fundamentally different kinds of state despite the similarity. Your father's experience complicates this because it does not fit the sensory model at all. It suggests that there is a layer of perceptual engagement that is not about sensing qualities like color or sound, but about sensing existence and placement. If perception is only defined by sensory content, then your father's experience is nothing. But if perception includes our bodily orientation and our sense of who inhabits space with us, then this is a veridical feature of his world, even if the person is not physically there. It troubles the good-case bad-case split because it introduces a third category: a non-sensory presentational state. It is not a failure of sensing, nor is it a successful sensing of an object. It is a successful sensing of a situation that no longer obtains, maintained by the structure of his habit and grief.

  Your own experience of the person behind you on the street fits this same category. The certainty was stronger than sight, yet lacked visual content. This suggests that the human brain maintains a model of social space that can activate independently of sensory input. Your roommate's phone vibration is different because it is a misattribution of a sensory signal, a noise in the system interpreted as a message. Your experience and your father's are not noise; they are signal without a source. They are the system running a protocol for presence in the absence of the person. This does not necessarily destroy the disjunctivist view, but it demands that we expand what we mean by perception. If we accept that perception includes existential orientation, then the good case is being oriented correctly to the world, and the bad case is being oriented incorrectly. Your father is in a state where his orientation is emotionally veridical but physically non-veridical. He is perceiving the shape of his loss as a presence.

  So to answer your question directly, there is no single word that perfectly captures this without baggage, but sense of presence is the standard term, specifically qualified as non-sensory. It gets confused with hallucination because it feels involuntary and immediate, but it lacks the sensory qualia. It gets confused with belief because it implies a fact, but it lacks the behavioral commitment. It falls outside the category if there is any sensory component, like a shadow or a sound, or if the subject changes their behavior to accommodate the presence. Does it make trouble for the good-case bad-case slicing? Yes, because it shows that the inner life is not just a theater of sensory images that can be real or fake. It is a field of engagement that can remain populated even when the objects are gone. It suggests that the common ingredient between perception and illusion might not be sensory content at all, but a kind of worldly involvement. Your father is not seeing her, and he is not imagining her. He is inhabiting a world where she is still a coordinate, and that coordinate fires with the intensity of a perception. It is a testament to how deeply our sense of reality is woven into our relationships, enough so that the removal of the person does not immediately remove the space they occupied.
