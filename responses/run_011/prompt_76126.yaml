answer: |-
  This is a sharp observation, and you are right to feel that "the problem of old evidence" is close but not quite it. That problem is a logical puzzle about Bayesian math (how can known facts update probability if their probability is already 1?). Your experience isn't the math problem; it's the *psychological and epistemic resolution* to that problem. You are describing the moment you realize the connection between the theory and the fact is non-accidental.

  There is an established term for this, though it has fallen out of casual use and is often overshadowed by its modern, diluted meaning. The word is **Consilience**.

  In the philosophy of science (specifically William Whewell, who coined it in the 1840s), consilience doesn't just mean "interdisciplinary cooperation" (the modern pop-sci meaning). It specifically refers to the "jumping together" of inductions. It happens when a theory proposed for one set of phenomena suddenly explains a completely different set of *already known* phenomena that were previously thought unrelated.

  Whewell explicitly described the feeling you are having. He argued that when a theory achieves consilience, it produces a "surprise" that serves as a test of truth. He wrote that this surprise is itself proof, because it is unlikely that a false theory would accidentally fit disparate, pre-existing facts so perfectly. This matches your "test on purpose": when old facts suddenly feel like miracles under a new theory, you are detecting consilience.

  Here is where your thing stops being the "old evidence problem" and starts being consilience:
  *   **The Old Evidence Problem** is a formal headache. It asks: "Logically, how are we allowed to count this?" It worries that because you knew the tides existed before Newton, Newton shouldn't get credit for predicting them.
  *   **Consilience** is the evidential weight itself. It answers: "We count it because the connection was hidden." The evidence was "old," but the *link* was new. Your confidence spikes not because the fact is new, but because the *relationship* is surprisingly tight.

  Is this feeling tracking anything real, or is it a vibe? It is tracking **Unification** and **Non-Accidentalness**.
  *   **What it is:** It is a heuristic for spotting when a theory has high explanatory depth. If a theory only fits the data it was built to fit, that's curve-fitting. If it fits data it wasn't built to fit (the tides, the skater), that suggests the theory is latching onto a real structural feature of the universe. The "wow" feeling is your brain recognizing pattern coherence that is statistically unlikely to exist by chance.
  *   **What it isn't:** It isn't **Hindsight Bias**. Hindsight bias makes you think you *knew* the outcome was inevitable all along (reducing surprise). Consilience makes you realize the outcome was *improbable* without the theory (increasing surprise). It isn't just **Awe**. Awe can be emotional; consilience is evidential. You can be in awe of a sunset without it confirming a physics theory. This feeling is specifically about the *fit* between fact and principle.

  If you want to be precise with philosophers, use **Consilience**. However, because that word has been co-opted by general culture to mean "unity of knowledge," you might sometimes need to specify **Whewellian Consilience** or **Explanatory Consilience** to ensure they understand you mean the "old evidence becoming miraculous" phenomenon, not just "biology and chemistry getting along."

  If you were to coin a term because Consilience feels too historical, the most accurate modern description of the *feeling* is **Retroactive Predictiveness**. It feels like a prediction even though it happened in the past. But since an established term exists that covers the logic, the feeling, and the evidential weight, you don't need to coin one.

  Verdict: Consilience
