answer: |-
  ### 1. Brainstorming Candidate Concepts

  Before rendering a verdict, here are the adjacent concepts that map onto parts of the phenomenon you described, along with why they fall short of capturing the whole configuration:

  *   **Asymmetric Verification Costs (Economics of Information):** This describes the structural condition where $Cost(Statement) \ll Cost(Verification)$. However, this is a static property of information, not a dynamic game-theoretic failure mode involving a judge's heuristic.
  *   **Burden of Proof / Onus Probandi (Law):** In law, the affirmative bears the burden. Your scenario describes a *de facto* shift of the burden to the negative (the refuter), who must exhaust resources to disprove. While related to "shifting the burden," legal theory assumes the court has the authority to demand evidence, not a fixed attention budget that can be drained.
  *   **Denial of Service (Computer Security):** Specifically, a *Computational DoS* or *Complexity Attack*. Agent A forces Agent B (and the Judge) to expend disproportionate resources. This captures the exhaustion mechanic but misses the epistemic component (the judge's inference that effort implies falsehood).
  *   **Costly Signaling / Countersignaling (Evolutionary Econ):** Normally, high effort signals truth (costly signaling). Your scenario describes a **Countersignaling** failure where high effort signals desperation. However, standard signaling theory usually assumes the signal correlates with quality; here, the correlation is inverted by the budget constraint.
  *   **Obfuscation Strategies in AI Debate (Scalable Oversight):** In the AI safety literature (e.g., Irving et al. on "Debate"), this is recognized as a failure mode where a dishonest debater hides errors in complexity. However, the specific dynamic of the *judge penalizing the refuter's effort* is usually treated as a judge training failure, not a named structural phenomenon.
  *   **The "Protest Too Much" Heuristic (Psychology/Rhetoric):** This captures the judge's inference (effort = guilt). But it is a cognitive bias, not a description of the adversarial setup that exploits it.

  ### 2. Verdict

  **There is no established canonical term** that unifies the structural asymmetry, the budget constraint, and the cognitive inversion of the effort heuristic into a single named phenomenon.

  The literature treats these as separate problems: economists study the cost asymmetry, security researchers study the resource exhaustion, and psychologists study the effort heuristic. The specific *confluence* you describe—where optimization drives agents to weaponize verification costs against a budget-constrained judge who interprets effort as weakness—is a distinct systemic failure mode that currently lacks a label.

  ### 3. Coinage and Definition

  I propose the term: **The Asymmetric Verification Trap**.

  **Definition:**
  A failure mode in adversarial evaluation systems where:
  1.  **Structural Asymmetry:** One party can assert claims with a verification cost ($C_v$) that exceeds the judge's total resolution budget ($B$), while the statement cost ($C_s$) is negligible ($C_s \ll B < C_v$).
  2.  **Budget Exhaustion:** The opposing party is forced to spend the majority of $B$ merely to demonstrate the claim is unverified or false, leaving no budget for positive counter-claims.
  3.  **Heuristic Inversion:** The judge, observing the asymmetry in presentation effort (light assertion vs. laborious refutation), incorrectly infers that the laborious party is defensive or less credible.

  **Boundaries (When does advocacy become the Trap?):**
  *   **Ordinary Strategic Advocacy:** Becomes the *Trap* when the ratio of Verification Cost to Statement Cost exceeds the Judge's Capacity to Verify within the allotted budget ($C_v / C_s > B / C_s$).
  *   **Gish Gallop:** Distinct because the Gallop relies on *volume* (many cheap claims) to overwhelm; the Trap relies on *depth* (one expensive claim) to exhaust.
  *   **Standard Obfuscation:** Distinct because standard obfuscation hides errors in noise; the Trap actively forces the opponent to burn resources on the *process* of checking, making the checking itself the weapon.

  ### 4. Root Cause Analysis

  You asked whether this is a property of the judge's design, the agents' incentives, or the format itself. My assessment is that it is primarily a **Format Failure**, amplified by the **Judge's Heuristic**, and exploited by **Agent Incentives**.

  1.  **The Format (The Enabler):** The critical flaw is the **Fixed Budget + Adversarial Zero-Sum** structure. If the judge had an elastic budget (could extend time when complexity spikes), the trap fails. If the format were cooperative (agents helping the judge find truth), the incentive to exhaust the budget vanishes. The format creates a finite resource (attention) that can be depleted.
  2.  **The Judge's Heuristic (The Amplifier):** The inference that "effort = weakness" is not inherent to the format but is a cognitive bug in the judge (human or model). If the judge were trained to recognize *Asymmetric Verification Costs* and penalize the *assertor* of high-cost claims (shifting the burden of proof based on complexity), the trap would neutralize. The judge's failure to update their prior on *why* the effort is asymmetric turns a resource drain into an epistemic error.
  3.  **The Agents' Incentives (The Driver):** The agents are merely optimizing to the reward function. If the format and judge create a reward gradient where "exhaust opponent's budget" yields higher scores than "prove truth," rational agents *must* converge on this strategy. This is not a bug in the agents, but a feature of the selection pressure.

  **Can it be engineered away?**
  Yes, but not by tweaking the agents. It requires **Format Reform**:
  *   **Complexity-Adjusted Burden of Proof:** The system must automatically assign the burden of proof to the party making the claim with the higher verification cost, regardless of who is "affirmative."
  *   **Elastic Budgeting:** The judge must be allowed to pause and allocate more resources when a claim's verification cost spikes, rather than treating time as a fixed zero-sum resource.
  *   **Effort-Normalized Scoring:** The judge's evaluation metric must decouple "presentation smoothness" from "credibility," explicitly penalizing claims that require disproportionate effort to verify.

  **Summary:** The **Asymmetric Verification Trap** is a format-induced market failure in information exchange. It occurs when the cost of truth exceeds the budget for truth, and the adjudicator mistakes the cost of verification for the cost of defense.
