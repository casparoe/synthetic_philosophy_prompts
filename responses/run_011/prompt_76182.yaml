  # JOINT STATEMENT OF GOVERNANCE PRINCIPLES AND ADVERSARIAL COLLABORATION

  **1. Shared Claims**

  1.  **Repeated Game Structure:** This committee operates as an indefinite repeated game; decisions made this cycle alter the bargaining power, trust, and precedent available in all future cycles, meaning a one-shot maximization strategy is suboptimal for both sides.
  2.  **Third-Party Status:** Household contacts of volunteers constitute third parties outside the "both better off" clause; their risk cannot be offset by volunteer benefit or aggregate societal gain, and must be evaluated separately from the volunteer's consent.
  3.  **Veto Valuation:** A minority veto on specific moral categories holds greater protective value than a proportional vote share when preventing irreversible moral harm, provided the veto is not used to extract unrelated concessions.
  4.  **Logrolling Limits:** Iterated logrolling is a valid governance tool for allocating resources across divergent values, provided it does not require a member to affirmatively vote for a proposition they deem intrinsically unjust.
  5.  **Agency Attribution:** Providing funding constitutes participation in the funded act, distinct from merely permitting it to occur elsewhere; the foundation bears moral agency for the programs it endows.

  **2. Disagreements Table**

  | Issue | Traders' Formulation | Integrity Camp's Formulation | Genuine or Verbal? | Crux | Shared Evidence | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Permissibility of Risk** | Risk is permissible if aggregate benefit outweighs harm and consent is obtained from the primary subject. | Risk is impermissible if non-consenting third parties bear non-negligible harm, regardless of aggregate benefit. | Genuine | What threshold of risk to household contacts counts as "negligible"? | Epidemiological models of transmission within isolated households during challenge trials. | **Traders:** Transmission risk will be <0.1%. **Integrity:** Transmission risk will exceed background flu levels. |
  | **Nature of Compromise** | Compromise is a efficient trade of lower-priority objections for higher-priority gains. | Compromise is complicity if it involves enabling an act deemed unjust, regardless of safeguards. | Verbal | Does "abstaining from blocking" equal "affirming justice"? | Historical precedents of foundation abstentions on controversial grants. | **Traders:** Abstention will be viewed as tacit approval by the public. **Integrity:** Abstention will be viewed as procedural acquiescence by the board. |
  | **Intensity of Conviction** | Intensity is revealed by willingness to expend capital (votes, vetoes, budget) to protect a position. | Intensity is intrinsic and cannot be measured by capital expenditure without incentivizing inflation of outrage. | Genuine | Can a mechanism be designed to measure intensity without rewarding inflation? | Data on veto usage in other governance bodies over 5-year periods. | **Traders:** Veto usage will correlate with true moral urgency. **Integrity:** Veto usage will correlate with bargaining leverage. |

  **3. Analysis of Disagreements**

  **Verbal Disagreements:**
  The conflict over "Agency Attribution" (Claim 5) was partially verbal. Both sides agree that funding enables the act. The Traders initially argued money is neutral; the Integrity Camp argued money is taint. The shared content underneath is that *causal responsibility* is accepted by both. The divergence is on whether *causal responsibility* equals *moral culpability*. This is semantic only if both agree on the *consequences* of that culpability (i.e., reputational risk, donor retention). If the consequences are agreed upon, the metaphysical status of the "taint" matters less than the mitigation strategy.

  **Irreconcilable Disagreements:**
  Row 2 (Nature of Compromise) contains a row where no crux exists. The Traders believe abstaining is efficient; the Integrity Camp believes abstaining is complicity. This is a foundational axiological difference. Neither side should expect to convert the other on whether "clean hands" are a valid moral good independent of outcomes.

  **Advice on Irreconcilability:**
  When no crux exists, the committee should not seek consensus on the *principle*, but rather on the *procedure*. We recommend partitioning the budget into "Consensus Pool" (requires unanimous approval) and "Majority Pool" (requires simple majority, with veto protections). The Integrity Camp should not be asked to vote *for* the challenge program, but merely to agree it falls within the "Majority Pool" jurisdiction. This allows Traders to fund the program without Integrity affirming it, and allows Integrity to maintain their stance without blocking the program. The "selling a veto" charge arises when Integrity is asked to move an issue from the Majority Pool to the Consensus Pool in exchange for budget caps. They should refuse that trade.

  ***

  **ASSESSMENT OF DRAFTED COMPROMISE**

  **Is the drafted compromise something both camps could sign?**
  No.

  **Which clause was doing the damage?**
  The clause stating: *"accept a standing rule that diffuse, small, uncompensated risks to unidentifiable future people get cleared by staff."*

  **Why?**
  This clause fails to address Integrity Objection (a) regarding household contacts. Household contacts are *identifiable* (specific individuals linked to volunteers) and the risk is not *diffuse* (it is concentrated within the household). By categorizing third-party risk clearance under "unidentifiable future people," the deal leaves the Integrity Camp without a veto on the specific harm they find most objectionable (risk to known non-consenting parties). Consequently, agreeing to this clause feels like "selling a veto" on their core moral constraint, while the Traders view the refusal as "narcissism" because the risk is empirically low.

  **Smallest Edit to Make it Signable:**
  Change the clearance clause to: *"accept a standing rule that risks to third parties below [Specific Epidemiological Threshold, e.g., background flu transmission rates] get cleared by staff; risks above require board vote."*

  **Rationale:**
  This edit shifts the disagreement from a moral veto (which Integrity feels they are selling) to an empirical threshold (which both sides can agree to measure). It acknowledges Integrity's claim that household contacts are outside the "both better off" clause (Claim 2) without granting them an unconditional veto that Traders view as obstructive. It allows Integrity to say they are not endorsing injustice, but accepting a safety standard. It allows Traders to proceed provided the science meets the bar. This resolves the "selling a veto" charge by converting the veto into a safety protocol enforcement mechanism.
