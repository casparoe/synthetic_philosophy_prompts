          *   Teleological? Yes, the core.
      *   My Diagnosis: **The Normative Burden Distortion.** The concept is being stretched to do ethical work it can't support phenomenologically.
      *   Critique of User's "Jade" Hypothesis: It solves the metaphysics but breaks the ethics.
      *   Strongest Rejected: The Neuroscience "Settlement."
