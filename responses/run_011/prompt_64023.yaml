  Specifically, you should reject the claim that *"Each [candidate property] figures in exactly the same explanation of the model's outputs."* This premise looks unobjectionable only if you view the system extensionally (as a mapping from inputs to outputs on the *current* distribution). It fails if you view the system intensionally (as a mechanism with a specific *computational structure* and *counterfactual profile*).

  ### Why Premise (2) Looked Unobjectionable
  From the inside, (2) relies on the mathematical fact that for any finite dataset, indefinitely many functions can fit the data perfectly. If your activation $a$ correlates with property $F$ on the training set, it correlates with any $F^*$ that is co-extensive with $F$ on that set. Since interpretability often begins with correlational tools (probes, dataset inspection), it is easy to feel that the "explanation" is exhausted by this fit. The skeptic argues that because the *extension* matches, the *explanatory role* matches.

  ### The Tie-Breaking Criterion: Counterfactual Robustness & Readout Complexity
  To reject (2), you must commit to the claim that **explanatory role is not determined solely by actual covariance, but by counterfactual stability and computational simplicity.**

  The "further fact" that breaks the tie is the **structure of the function implemented by the weights**. While "Animal Face" and "Car Front Post-2015" may be co-extensive on the training data, they are not equivalent in the **latent geometry** of the model.
  1.  **Counterfactuals:** A genuine representation supports specific generalizations. If the direction represents "Animal Face," it should respond to sketches, cartoons, or occluded faces (depending on the layer). If it represents "Car Front Post-2015," it should not. The skeptic can define a gerrymandered property $F^*$ that *includes* these counterfactuals post-hoc, but...
  2.  **Complexity (The Crucial Move):** The gerrymandered property $F^*$ will require a **complex, non-linear readout** from the activation space to be defined, whereas the natural property $F$ will be **linearly decodable** or structurally aligned with the network's own basis.

  You commit to the **Linear Representation Hypothesis** (or a variant thereof): A state $s$ represents property $F$ only if $F$ is recoverable from $s$ via a **computationally simple transformation** (typically linear) that aligns with the downstream weights. The "arbitrary function" re-indexing required to make "Car Post-2015" fit the activation profile is computationally complex and does not match the **inductive bias** of the network (which favors simple, smooth functions).

  ### Feasibility with Interpretability Tools
  You do not need to assume this as a precondition; you can establish it with your existing toolkit, but you must shift how you use them:
  *   **Linear Probes:** Do not use probes merely to show covariance (which invites the skeptic). Use them to measure **description length**. If "Animal Face" is linearly decodable with 95% accuracy, but "Car Post-2015" requires a multi-layer perceptron probe to achieve the same fit, "Animal Face" is the natural representation. The "fact" is the **complexity of the readout**.
  *   **Activation Patching / Ablation:** Test **counterfactuals**. Swap the activation into a context where "Face" is present but "Car Post-2015" is not (e.g., a cartoon). If the model behavior tracks "Face," the "Car" attribution is falsified. The skeptic's $F^*$ becomes increasingly disjunctive and unnatural with every test.
  *   **Circuits Analysis:** Trace the downstream connections. Does this direction connect to "Eye" detectors or "Wheel" detectors? The causal graph breaks the symmetry that covariance alone cannot.

  ### Application to the Animal-Face/Car-Front Direction
  In your specific case, the skeptic claims you cannot distinguish "Face" from "Car" from "Roundish Object."
  *   **Diagnosis:** This direction likely represents a **geometric primitive** (e.g., "symmetric curvature with high-frequency texture") rather than a semantic category.
  *   **Resolution:** The attribution "It represents Animal Faces" is strictly **false** if it fires for cars. The correct attribution is the geometric primitive. The skeptic is right that the *semantic* label is ambiguous, but wrong that *no* property is represented. The network represents the **geometry**, which humans *interpret* as faces or cars.
  *   **Why this saves interpretability:** It shifts the goal from finding "human concepts" to finding "model primitives." The representation is real; our linguistic label for it was just coarse.

  ### Application to Superposition
  The argument assumes a **localist** view of representation (one direction = one property).
  *   **In Superposition:** A feature is not a single direction $v$, but a sparse combination of directions. The "state $s$" in Premise (1) must be redefined as the **activation pattern across a subspace**, not a scalar value on an axis.
  *   **Breaking the Tie:** The gerrymandered properties will not align with the **sparse basis** learned by the network. The "fact" that breaks the tie is the **sparsity structure**. The network encodes "Face" in a specific sparse subspace; the arbitrary function $F^*$ would require a dense, entangled subspace. Mechanistic interpretability (e.g., dictionary learning) recovers the sparse features, rendering the arbitrary $F^*$ computationally invisible to the system.

  ### Brains vs. Networks (Premise 5)
  Your diagnosis should apply **symmetrically** to brains and networks.
  *   **Symmetry:** Neural populations in the brain also exhibit polysemanticity and covariance indeterminacy. A neuron in IT cortex might fire for faces and hands.
  *   **No Arbitrary Asymmetry:** There is no "wetware magic" that solves the Disjunction Problem. If you claim brains have determinate content while networks do not, you are engaging in the special pleading you rightly wish to avoid.
  *   **The Difference:** The difference is not in the *metaphysics* of representation, but in the **access to ground truth**. For brains, we have evolutionary history (teleology) that constrains the "function." For networks, we have the **training trajectory and loss landscape**. Both serve the same role: they constrain which of the covarying properties was the *target* of the optimization.
  *   **Recommendation:** Do not retreat to biological exceptionalism. Embrace that **representation is naturalized by computational role**, whether in silicon or carbon.

  ### Summary of Commitments
  By rejecting (2), you commit to:
  1.  **Intensionalism:** Representations are defined by their counterfactual profile, not just actual extension.
  2.  **Computational Realism:** The "fact of the matter" is grounded in the complexity of the readout and the structure of the weights (simplicity bias).
  3.  **Abductive Inference:** Identifying representations is an inference to the best explanation (simplest, most robust readout), not a deductive certainty.

  This preserves (3) (naturalism) by grounding content in physical facts about **complexity and causality**, and it preserves the scientific practice of interpretability by giving you a metric (readout complexity/robustness) to adjudicate between competing claims. The skeptic wins the point that certainty is impossible, but loses the point that science is therefore impossible.
