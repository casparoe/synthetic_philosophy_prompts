      *   *Self-Correction on Surrender:* If the system *must* issue flat assertions, it implies a commitment to Consistency (asserting contradictions is useless). It implies a commitment to some Threshold (otherwise why assert?). It implies Closure is the weak link. *However*, many engineering systems prioritize Consistency above all. If Consistency is non-negotiable for the system, then Closure must go.
      *   *Wait, one more check:* "whether some subset of the non-negotiable ones is jointly unsatisfiable". I need to define what I consider non-negotiable first.
      *   *Non-negotiables:* Consistency (system can't lie/contradict), Evidence/Stakes distinction (system needs to know risk), No Lottery Belief (system shouldn't assert ticket losses).
      *   *Conflict:* If I have No Lottery Belief (Credence $\ngtr$ Belief) and I need a Bridge, simple Thresholding fails.
      *   *Let's look at the Trilemma again:* 1. Belief = Credence > t. 2. Belief is Consistent. 3. Belief is Closed under Conjunction.
      *   If I keep 2 (System integrity) and reject 1 (to solve Lottery), I need a different bridge (e.g., Stability). If I keep 1 and 2, I must reject 3 (Closure).
