answer: |-
  ### Epistemic Bridge Specification: Requirement List

  **1. Canonical Cases and Their Points**
  *   **The Long Conjunction (Preface):** An agent asserts every claim in a detailed report while acknowledging a non-zero error rate for the report as a whole. *Point:* Tests the tension between local rationality and global consistency; determines if the account permits rational inconsistency (fallibilism) or demands logical closure.
  *   **The Single Lottery Ticket:** An agent assigns 0.9999 credence to a specific ticket losing but refrains from asserting it will lose. *Point:* Tests the sufficiency of high probability; ensures the account distinguishes between statistical certainty and warrant for outright assertion.
  *   **The Aggregate Testimony Stream:** A source is 99% reliable per statement, but over 1,000 statements, the probability of total accuracy is near zero. *Point:* Tests the aggregation of support; ensures the account handles the decay of reliability over conjunctions without forcing retraction of individual items.

  **2. Mandatory Distinctions**
  *   **Believing vs. Being Confident:** The system must distinguish binary commitment (action-triggering) from graded probability (risk-assessment). Collapsing these renders the dual-output architecture redundant.
  *   **Evidence vs. Stakes (Pragmatic Encroachment):** The account must determine whether high stakes can defeat belief despite fixed evidence. For a system, this dictates whether confidence thresholds shift based on the cost of error.
  *   **Statistical vs. Individualized Support:** The account must reject belief based purely on reference class statistics (e.g., "99% of this batch is defective") without specific causal/normic evidence regarding the individual item.

  **3. Structural Principles**
  *   **Consistency of the Belief Set:** **Non-negotiable.** A system issuing contradictory flat assertions loses operational utility. The belief set must not contain $P$ and $\neg P$.
  *   **Closure Under Conjunction:** **Camp Preference (Refuse).** While classical logic demands if $B(P)$ and $B(Q)$ then $B(P \land Q)$, the Preface and Lottery paradoxes show this leads to contradiction in fallible systems. We prefer non-closure to preserve consistency.
  *   **Threshold Linking Credence to Belief (Lockean Thesis):** **Camp Preference (Refuse).** A fixed probability threshold $t$ is insufficient (due to the Lottery case). We require a qualitative constraint beyond mere magnitude.
  *   **Stability Under Further Evidence:** **Non-negotiable.** Beliefs must not fluctuate wildly with trivial new evidence. The account must ensure that if $P$ is believed, it remains believed under any consistent evidence partition compatible with $P$ (Leitgeb's Stability).

  **4. Formal Results**
  The account must be consistent with the **Lottery Paradox Impossibility Result**: one cannot simultaneously maintain (a) Belief = Credence $> t$, (b) Belief is Consistent, and (c) Belief is Closed under Conjunction. It should also align with **Leitgeb's Stability Theorem** if stability is adopted as the bridge condition.

  ### Analysis of Constraints

  **Most Eliminating Requirement**
  The prohibition on **Lottery Belief** (derived from the Cases) eliminates the most candidates. It immediately disqualifies pure Lockean Threshold views, which constitute the majority of simple probabilistic bridging accounts.

  **Joint Unsatisfiability and Surrender**
  The non-negotiable requirements of **Consistency** and **Stability** are jointly unsatisfiable with a simple **Lockean Threshold**. Given the system cannot drop its outputs (flat belief and numerical credence), we must surrender **Closure Under Conjunction**.
  *Reasoning:* A system can function by asserting $P$ and $Q$ separately without explicitly asserting $P \land Q$. However, asserting a known contradiction ($P \land \neg P$) destroys system trust, and ignoring Stability makes beliefs too fragile for action. Sacrificing Closure resolves the Preface/Lottery tension while maintaining operational integrity.

  ### Evaluation of Candidate Accounts

  Threshold views fail the lottery case and collapse statistical support into belief. Credence-only views violate the system spec by abolishing flat assertions entirely. Stability views satisfy the paradoxes but impose high computational costs for real-time verification.
