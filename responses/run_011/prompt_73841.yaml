answer: |-
  Dear Colleague,

  It is a pleasure to engage with someone who brings the discipline of the lab into the often murky waters of moral philosophy. Your intuition is sharp, and I suspect it cuts closer to the truth than most of the literature cares to admit. You have spent nearly four decades distinguishing signal from noise, knowing that the limits of your instrument do not dictate the limits of the reality you are measuring. When you say that a chemist would be laughed out of the building for claiming that undetectable increments cannot accumulate into a detectable change, you are stating a fundamental truth about measurement and reality. The question we face is whether ethics is a discipline where that truth holds, or whether morality is somehow exempt from the logic of magnitudes. I intend to argue that it is not exempt, that the spectrum arguments rely on a category error regarding indiscernibility, and that preserving transitivity requires us to accept a specific, somewhat humbling cost regarding the authority of our own intuitions.

  To begin with, let us look squarely at the parallel you have drawn. In your work with ICP-MS, you operate under a realist assumption: there is a concentration of analyte in the solution, and that concentration exists independently of whether the detector fires above the background count rate. The relation "resolvable from" is indeed non-transitive, but nobody mistakes this for a property of the solution. It is a property of the interface between the solution and the machine. When philosophers construct spectrum arguments, they often invite us to treat our moral intuitions as the machine. We are presented with case A and case B, and we are asked if A is worse than B. If we cannot tell the difference, we are tempted to say they are equal in value. Then we move to B and C, and so on. If we accept that indiscernibility implies equality, we are forced into a contradiction when we compare the ends of the chain, where the difference is glaring. The standard philosophical move is to save the intuitions by sacrificing transitivity. They conclude that "better than" is not a transitive relation, or that value is not fully ordered.

  Your lab experience suggests this is a diagnostic error. It confuses the resolution of the detector with the structure of the sample. If we treat value as a magnitude analogous to concentration, then the failure to distinguish adjacent cases is merely an epistemic limitation. It means our moral instruments are coarse, not that the moral landscape is jagged or circular. The inference from "I cannot tell the difference" to "There is no difference" is the weak link. In the lab, you know there is a difference because you pipetted it. In ethics, we do not have a pipette, which leads us to the wrinkle you identified, but I believe this wrinkle is less damaging to the analogy than it first appears.

  The wrinkle is this: in the lab, you have independent access to the increment. You know you added ten parts per billion even if the machine sees only noise. In the moral spectrum, when we move from one hour of mild pain to one hour and one second of mild pain, do we know we have added value? Or are we just assuming there is a scale there to begin with? If there is no independent way to verify the increment of value, perhaps the hidden-variable model is wrong. Perhaps there is no underlying magnitude, and the indiscernibility really does indicate equality. This is the constructivist worry: that value is constituted by our judgments, so if we judge them equal, they are equal.

  However, I think this objection conflates the substrate of value with the value itself. In your lab, the substrate is the ions in the plasma. The value is the concentration. You know the substrate increment exists because you control the preparation. In ethics, the substrate is usually something physical or phenomenological, like nerve firings or seconds of conscious experience. We may not have a moral pipette, but we do have a physical description of the change. If case B involves more neural firing associated with pain than case A, then physically, something has been added. The question is whether that physical addition maps to a moral addition. If we are moral realists, we must say yes. If we say that a physical increase in the substrate of suffering produces zero increase in badness simply because we cannot intuitively discriminate it, we are effectively claiming that the moral value function has flat spots that align perfectly with the limits of human discrimination. That seems implausibly coincidental. It would mean the universe's moral structure is tuned exactly to the resolution of the human mind. It is far more parsimonious to assume that the moral magnitude exists continuously, like the concentration, and our intuition is just a low-resolution detector.

  So, where does this leave us regarding the options you laid out? I believe we should reject the claim that betterness is intransitive. The cost of intransitivity is too high. If "better than" is not transitive, then rational choice becomes impossible. You become vulnerable to money pumps. If you prefer A to B, B to C, but C to A, I can trade you around in a circle and leave you worse off every time. In your line of work, if your instrument gave you non-transitive readings for a stable standard, you would not conclude that reality is non-transitive; you would conclude the instrument is broken or the method is flawed. We should treat our moral intuitions the same way. When the chain of reasoning leads to a contradiction with a clear endpoint difference, we should trust the clear endpoint over the ambiguous middle steps. We should bite the bullet that transitivity holds.

  This leads us to the verdict I want to defend. The spectrum argument rests on a bad inference from indiscernibility to equality. Once we name that inference, the problem dissolves, but only if we are willing to pay the price. The price is moral fallibilism. We must accept that in the adjacent cases along the spectrum, one is indeed worse than the other, even though we cannot tell which, and even though it feels arbitrary to claim so. We must accept that there are moral truths that are in principle beyond our discriminatory capacity. This is the hidden-variable reading you suspected was the interesting one. There is a real, fully ordered scale of betterness underneath, and the discrimination failures are just poor resolution on our part.

  Now, let us address the cost explicitly, because you are right that every position bills you for something. If we hold that transitivity survives and the hidden-variable model is correct, we have to give up the idea that our immediate moral intuitions are authoritative in marginal cases. In the lab, you trust the calibration curve over the single noisy data point. In ethics, we are often tempted to trust the data point over the theory. We feel that if two outcomes look the same, they must be the same. To hold my position, you have to agree that this feeling is a cognitive limitation, not a metaphysical insight. You have to accept that there are pairs of outcomes where one is objectively worse, but no human being could ever know which one it is. This is a bitter pill for philosophers who want ethics to be action-guiding. If I cannot tell the difference between A and B, how can I be obligated to choose A?

  The answer lies in the accumulation, just as in your lab. You do not optimize for the single undetectable increment; you optimize for the signal. In ethics, we should not agonize over the adjacent pair where the difference is below the threshold of discernibility. We should recognize that while a difference exists, it is practically negligible for decision-making in isolation. However, we must not let that practical negligence harden into a theoretical denial of the difference. We must acknowledge that while we cannot see the step, the step is there. This preserves the logic of the chain without forcing us into paralysis. We act on the basis of where the signal is clear. We avoid the agony at the end of the spectrum not because we can distinguish the last step from the second-to-last, but because we can distinguish the end from the beginning.

  Returning to the wrinkle about units, I think this is where the chemistry analogy strains but does not break. You noted that in the lab, you can say how much you added even when you cannot detect it. In moral cases, it isn't obvious there is any amount being added. I would argue that this is a difference in measurement technology, not in ontology. We have defined units for concentration because we agreed on standards and built tools to measure them. We do not have agreed units for suffering because we have not built the tools, not because the quantity is absent. We can describe the increment in physical terms: milliseconds of duration, number of neurons involved, intensity of neurotransmitter release. These are quantitative facts. If we believe that suffering is bad, and that these physical facts are the basis of suffering, then there is a function mapping the physical facts to the moral value. Even if we do not know the formula of that function, the existence of the physical increment suggests a moral increment, unless we believe the moral value function is stepwise in a way that perfectly mirrors our ignorance.

  Consider the alternative. If we deny the hidden variable, if we say there is no fact of the matter about which adjacent pair is worse, we are essentially saying that value is vague in reality, not just in our language. This is ontological vagueness. It suggests the world itself does not decide whether A is better than B until we look. But this creates a strange discontinuity. At some point in the chain, the difference becomes clear. If there is no fact of the matter in the middle, where does the fact of the matter at the ends come from? It implies that value emerges magically after enough negligible steps, which is akin to saying that adding grains of sand never makes a heap until suddenly one grain does. It is much more coherent to say the heap property was increasing all along, even when we couldn't count the grains.

  There is, however, a specific cost to this view that I want to be honest about. If we accept that there are moral differences too small to detect, we must accept that moral reasoning is inherently approximate. We cannot achieve the precision in ethics that you sought in geochemistry. In your lab, you could improve the instrument. You could preconcentrate the sample, reduce the background, use a different isotope. You could chase the signal down into the noise until you resolved it. In ethics, we cannot simply build a better intuition machine. We are stuck with the cognitive hardware we have. This means there will always be a zone of moral uncertainty where the truth exists but is inaccessible to us. We have to make peace with that opacity. We cannot resolve the spectrum; we can only acknowledge its slope.

  This position also requires us to reject the idea that "indistinguishable" means "interchangeable." In practical terms, if I cannot tell the difference between two wines, they are interchangeable for me. But if one costs twice as much, there is a fact of the matter about value that my palate misses. In ethics, if I cannot tell the difference between two policies, I may treat them as interchangeable for the sake of sanity, but I must not claim they are morally identical. This distinction is vital. It prevents the spectrum argument from forcing a logical contradiction while allowing us to function as agents. We act as if the threshold is real, while believing the magnitude is continuous.

  I suspect the reason philosophers are so tempted by the intransitivity conclusion is that it feels like it saves the phenomena. It respects the intuition that A is not worse than B. It respects the intuition that Z is worse than A. It only sacrifices logic. But logic is the scaffold of reasoning. If we sacrifice transitivity, we lose the ability to reason through chains of consequence. We lose the ability to say that because A leads to B and B leads to C, A leads to C. In policy and ethics, we deal almost exclusively in chains. If transitivity fails, long-term planning becomes irrational. The cost of saving the intuition is the loss of rational agency. The cost of saving rational agency is the loss of confidence in our marginal intuitions. I know which bill I would rather pay. I would rather admit my intuition is blurry than admit my reasoning is broken.

  There is one more thing to consider, which ties back to your experience with noise. In ICP-MS, noise is random. It fluctuates. But the spectrum argument assumes a systematic drift. We are moving in one direction. The risk in the moral case is that the noise isn't random; it's bias. We might be systematically undervaluing small increments because of a psychological heuristic, like scope neglect. We know humans are bad at scaling empathy. We feel roughly the same about one suffering child as ten, until the number becomes abstract. This suggests our moral instrument has a non-linear response curve. It saturates. If our intuition saturates, it will report "no difference" for a wide range of inputs that are actually different. This supports the hidden-variable view. The instrument is saturating, not the sample maxing out. The concentration is still rising, but the detector is pegged. Recognizing this allows us to correct for the instrument error theoretically, even if we cannot fix it phenomenologically. We know we are bad at scaling, so we trust the math over the feeling.

  So, to bring this to a close, I come down firmly on the side of the lab. The spectrum arguments commit the error of treating epistemic thresholds as ontological boundaries. They move from facts about our inability to tell adjacent outcomes apart to a claim about the ordering of those outcomes themselves, and that is a illegitimate move. It is a hidden-variable situation. There is a real, fully ordered scale of betterness underneath, and the discrimination failures are just poor resolution on our part. The wrinkle about units does not save the skeptic, because the lack of a standardized moral meter does not imply the absence of a moral magnitude, only the absence of a consensus on how to measure it. The physical substrate changes continuously, and unless we believe value is magical, the value should track the substrate.

  To hold this view, you have to give up the comfort of thinking that your moral intuitions are fine-grained enough to capture the truth of every case. You have to accept that there are truths about good and bad that are too small for you to see, just as there were concentrations too low for your mass spec to count. But you also get to keep logic. You get to keep transitivity. You get to keep the ability to say that a chain of reasoning holds even when the links are faint. In my view, that is the only way to do ethics without losing your mind. We treat the indiscernible as distinct in theory, even if we treat them as equal in practice. We acknowledge the signal is there, even when it is buried in the noise. And we trust that if we keep adding increments, eventually the signal will rise above the background, and we will know we were right all along.

  I hope this lands with the weight you were looking for. It is a rare thing to find someone who understands that the limit of detection is not the limit of existence. I think philosophy needs more of that kind of thinking.

  Warmly,

  A Friend in Reasoning
