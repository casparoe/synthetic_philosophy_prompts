  The reason to strike is that the union's leverage depends on the assurance of mass participation rather than any single member's causal impact. This reason survives because your participation helps constitute the collective agent required to act, even if it does not individually cause the victory.

  ***

  Friends, neighbors, colleagues. We are tired. The semester is long, and this gym is cold.

  We need to be honest about what this vote means. If you believe your individual absence alone will force the administration to move, you are mistaken. One person does not stop the university. The power here is not in what your absence causes, but in what it confirms for the rest of us. When you commit to walk out, you tell the thousand others deciding tonight that they will not be standing alone.

  We also know the costs of this strike are not shared equally. Some among us face choices no one should have to make between their livelihood and this line. If you cannot walk out, that is not a failure of nerve. It is a real cost of this plan, and we see it. We do not ask you to break yourself to prove your loyalty.

  But for those who can, we authorize this strike to become a group that can speak with one voice. A strike only exists if enough of us are willing to be part of it. We are not asking for heroes. We are asking for members.

  Look around this room. See the students, the families, the retirees who stand with us. They are waiting to see if we believe in our own capacity to act. Vote yes not because you will win this alone, but because you are willing to stand where others can see you. We go back to work or we stay out together. Either way, we decide as one.
