  2.  **Deconstruct the Philosophical Problem:**
      *   **The Issue:** The free-rider problem/collective action problem. If my individual action doesn't change the outcome (not pivotal), why participate?
      *   **The Trap:** Claiming "your body on the line forces them to move" is causally false given the threshold effect and large N.
      *   **The Solution:** Shift from *instrumental causality* (my act causes the win) to *constitutive participation* or *conditional commitment*.
      *   **Proposed Reason (for the 2-sentence preamble):** The reason to strike is not that your individual absence causes the shutdown, but that the strike only exists as a collective body composed of willing participants. Your participation confirms the group's capacity to act, which is the actual lever of power, rather than causing the outcome directly.
