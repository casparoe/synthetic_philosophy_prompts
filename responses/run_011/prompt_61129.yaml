  **III. Underdetermination and Future Principle**

  The record genuinely underdetermines tonight's call because Item 1 (Salience victory) and the Treasurer's standing figures (Stewardship victory) are in direct conflict. Item 1 was a near-miss on the Stewardship math; tonight is a clear miss.

  **Principles at Stake:**
  *   **If we LAUNCH:** We adopt the **Covenant of the Ledge**. We affirm that the identified, visible life is sacred and commands resources even at the expense of statistical future lives. We accept that we are heroes first, managers second. This principle binds us to attempt rescues even when odds are poor, provided we are the only option.
  *   **If we STAND DOWN:** We adopt the **Trustee Model**. We affirm that the reserve is a public trust to maximize aggregate survival, not a fund to purchase moral absolution for specific tragedies. We accept that we must let the visible individual die to protect the invisible future many. This principle binds us to walk away from live calls when the actuarial cost is too high.

  **The Settling Call:**
  The rule we have been running will be settled by a **night sortie costing the full reserve with a survival probability below 20%.**
  *   If we **Launch** such a call, the Salience/Mandate rule is absolute; cost and odds are irrelevant compared to presence.
  *   If we **Stand Down** such a call, the Stewardship rule prevails; tonight's launch would be revealed as an anomaly driven by the specific 40% probability, not a standing rule.

  Verdict: LAUNCH
