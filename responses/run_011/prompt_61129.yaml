answer: |-
  **I. Audit of Candidate Rules Against the Record**

  **1. The Salience Rule**
  *Definition:* A determinate living person within our reach on our own ground commands the reserve whatever the cost, while statistical lives command only the cheap programs.
  *Status:* **Survives, but requires amendment.**
  *Analysis:* This rule explains Item 1 (Ledge), Item 5 (Culvert), and Item 9 (Night Sortie). It correctly predicts the rejection of Item 2 (Hut/Statistical) and the acceptance of Item 3 (Cards/Statistical but cheap). It is challenged by Item 7 (State Air Ambulance). In Item 7, there was a determinate living person on our ground, yet we stood down.
  *Amendment:* To survive Item 7, the rule requires a **Reachability/Efficacy Clause**: "...commands the reserve... *provided we are the agency best positioned to effect survival*."
  *Residual:* Once amended, the Salience Rule becomes nearly indistinguishable from the Mandate Rule. It ceases to be about the *identity* of the victim and becomes about the *efficacy* of the intervention. It no longer guarantees a launch simply because a life is visible; it guarantees a launch only when that life is visible *and* we are the only ones who can save it.

  **2. The Stewardship Rule**
  *Definition:* Spend only where the expected lives saved exceed the expected lives the spent reserve would have saved later, counting identifiability and proximity for nothing.
  *Status:* **Survives, but precariously.**
  *Analysis:* This rule fits Item 2 (Hut declined), Item 6 (Woman declined), and Item 7 (Recall). It fits Item 3 (Cards) as they came from operating budget, not reserve. It fits Item 4 (Avalanche) as the survival curve had flattened (expected lives = 0).
  *The Strain:* Item 1 (Ledge) is the stress point. Spending the entire reserve for one life barely clears the stewardship bar (1 life saved vs. ~0.9 expected lives lost during the rebuild gap, based on current Treasurer figures). Item 9 (Night Sortie) passed easily under this rule ($40k is low cost).
  *Implication:* This rule is the only one that demands a **STAND DOWN** tonight. (0.4 expected lives saved vs. ~0.875 expected lives lost during the 14-month rebuild).

  **3. The Mandate Rule**
  *Definition:* We are a rescue body and not a public-health body, and we act only where we are the agency that can make the difference.
  *Status:* **Best Fit.**
  *Analysis:* This rule cleanly separates Item 2 (Hut = Public Health/Prevention = No) from Item 3 (Cards = Education/Prevention = Yes, but cheap/operating). It explains Item 4 (Other association had it = We make no difference) and Item 7 (State faster = We make no difference). It explains Item 6 (No one to save = No difference). It explains Item 1 and Item 9 (We were the only option = Make the difference).
  *Implication:* This rule demands a **LAUNCH** tonight. We are the only agency that can make a difference (State is 4 hours out), and it is a rescue, not prevention.

  **4. The Fair-Share Rule**
  *Definition:* We are already doing far more than our part, and owe no more.
  *Status:* **Killed.**
  *Analysis:* Killed by Item 1 and Item 9. If this rule were active, we would not have spent the entire reserve in Item 1, nor would we have left the valley uncovered in Item 9. The record shows a consistent willingness to exceed "fair share" when a live call is present.

  **II. Tonight's Vote: Prediction and Precedent**

  **Surviving Rule Requirements:**
  *   **Salience (Amended):** LAUNCH (Live victim, own ground, only effective agency).
  *   **Mandate:** LAUNCH (Rescue mission, only agency making a difference).
  *   **Stewardship:** STAND DOWN (Cost exceeds expected future value).

