prompt: |-
  so my friend M runs a decision-theory reading group at my place (yes it's lesswrong-adjacent, no I don't want to talk about it) and she's got these firm verdicts about which sequential-choice agents count as irrational. Trying to figure out what she'll say about next week's case.

  her verdicts so far, all about someone making a run of choices over time:

  - coffee > tea > cocoa > coffee, zero news at any point, gets walked all the way around for a nickel a swap and ends up 15 cents down and back where she started: irrational, and she thinks the pump is what *proves* it.
  - pays a dollar to watch a coin land when the coin can't affect any payoff, then picks the same thing in each branch she'd have picked anyway: irrational, the dollar is the whole point.
  - prefers surgery, gets a real diagnosis that changes the prognosis, switches to chemo and eats $50 in cancellation fees: not irrational, the world changed, that's not a pump.
  - sees the entire loss coming, has no way to bind her future self at all (no mast, no contract, nothing on offer), picks what's best at each node, never regrets a single pick, ends up $20 down: irrational, but grudgingly — she says "the pump isn't proving anything here, it's just telling you she's out twenty bucks."

  new case: Dana's ranking over outcomes is stable and acyclic throughout, and every swap she makes is triggered by genuinely relevant news — rent goes up, flight canceled, whatever — so no individual choice is even slightly bad by her own lights when she makes it. But she knew going in that the month would be full of exactly that kind of news, she was offered a free precommitment device that would have left her $300 better off overall, and she turned it down because she didn't want her later self boxed in.

  predict her verdict, but more than that: lay out the candidate rules that fit all four existing verdicts (I'm pretty sure at least two do), say what each gives you on Dana, say which one you'd bet she's actually running and why, and name one further case I could bring that splits them cleanly. Also — is the grudgingness in #4 a crack in her view or a distinction she's actually entitled to? ~700 words.
