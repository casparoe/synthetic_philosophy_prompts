prompt: |-
  Every time I read something about whether my own choices actually matter — flying, beef, whether to bother voting — it picks one case, gives one answer, and I dont trust it. So before I read another take I want to know what I should even be demanding of an account here. Write the spec: what any theory of when an individual act is wrong because of what it contributes to a collective harm has to deliver. For each requirement, give the case or the worry behind it, and mark whether it's non-negotiable or just something one camp happens to care about.

  Things I'd expect on the list, feel free to add or throw out: it has to handle the act that makes no difference because the same thing would have happened anyway (the extra steak at the buffet that was going in the bin regardless); it has to handle the pile-up where no single act crosses any threshold but a hundred thousand of them do; it cant just collapse "made no difference to anyone" into "did nothing wrong", or run it the other way; it has to give a sensible verdict on voting, where the chance of being decisive isn't tiny in the same sense as in the buffet case; it has to be usable by a normal person who can't see the harm, doesn't know where the thresholds are, and isn't going to run expected-value math on a burger; and it should explain why the same amount of harm feels wierdly okay when I do it as part of a group or system I belong to.

  Then: which single requirement kills off the most of the answers people actually give, and is any subset of these jointly unsatisfiable? I half suspect "usable by an ordinary person with limited information" and "tracks actual causal contribution" can't both be had, and if that's true then the list is itself the result, which is fine by me.

  Purpose, since adequacy depends on it: I want a theory good enough to organize my own decisions with, not a metaphysically elegant one. A line at the end on how the main contenders score is welcome but it's not the point.

  And push back if you want to. If some of what I listed isn't a real requirement, or if writing the spec first is just a way of avoiding actually having a view, say that plainly instead of playing along.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Individual moral responsibility in the context of collective harm (e.g., climate change, voting, animal welfare).
      *   **Task:** Write a "spec" (specification) for a theory of individual wrongness regarding collective harm. This spec must list requirements, the worry/case behind each, and mark them as non-negotiable or contingent.
      *   **Specific Inputs:** The user provided a list of expected requirements (overdetermination/thresholds, voting, epistemic limitations, psychological comfort in groups, etc.).
      *   **Follow-up Questions:** Which requirement kills the most theories? Are any jointly unsatisfiable (specifically usability vs. causal tracking)?
      *   **Purpose:** Practical decision-making, not metaphysical elegance.
      *   **Tone:** Critical, direct, willing to push back if the premise is flawed.
      *   **Constraint:** Don't just play along if the approach itself is problematic.

  2.  **Deconstruct the User's Premise:**
      *   The user is suffering from "moral paralysis by analysis." They are looking for a *decision procedure* but framing it as a request for a *moral theory spec*.
      *   They suspect a tension between "usability" and "causal truth." This is a profound insight (the distinction between *criterion of rightness* and *decision procedure*).
      *   They want to know *what to demand* before reading more takes. This is a meta-ethical request.

  3.  **Drafting the Spec (The Core Task):**
      *   I need to formalize their intuitions into philosophical requirements.
      *   *Requirement 1: Overdetermination/Preemption.* (The buffet/steak case). If my act doesn't change the outcome, is it wrong?
          *   *Status:* Non-negotiable for most, but some (causalists) say no. Let's mark it Non-Negotiable for *this* user's purpose (they want to know if it matters).
      *   *Requirement 2: Thresholds/Continuity.* (The drop in the bucket). How do we handle gradual harm vs. sudden triggers?
          *   *Status:* Non-negotiable. Needs to explain the accumulation.
      *   *Requirement 3: Epistemic Accessibility.* (Usability). Can a normal person use this without a calculator?
          *   *Status:* Non-negotiable (given the stated purpose).
      *   *Requirement 4: Voting/Probability.* (Low probability, high impact).
          *   *Status:* Non-negotiable. Needs to distinguish voting from the buffet case.
      *   *Requirement 5: Complicity/Systemic Participation.* (Why does being part of a group feel different?).
          *   *Status:* Contingent/Psychological. This is more about moral phenomenology than objective wrongness.
      *   *Requirement 6: Non-Collapse.* (Don't say "no difference = no wrong" automatically).
          *   *Status:* Non-negotiable.

  4.  **Addressing the "Kill Shot" and "Unsatisfiability":**
      *   *Which requirement kills the most theories?* **Epistemic Accessibility (Usability).** Most rigorous causal theories (expected utility, causal contribution) require information individuals don't have. Most heuristic theories (virtue ethics, rules of thumb) sacrifice causal precision.
      *   *Are they jointly unsatisfiable?* Yes, specifically **Causal Precision** vs. **Epistemic Accessibility**. This is the classic "Criterion of Rightness vs. Decision Procedure" gap. You can't have a theory that *defines* wrongness by exact causal impact *and* tells a layperson how to spot it in real-time without data.

  5.  **Pushing Back (The Critical Element):**
