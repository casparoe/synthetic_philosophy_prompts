answer: |-
  This is a sophisticated request. You are asking for a meta-ethical specification before engaging with first-order ethics. You suspect that the literature fails because it optimizes for metaphysical elegance rather than decision-guidance, and you are worried that the requirements for a "usable" theory are incompatible with the requirements for a "true" theory.

  You are right to be worried.

  Here is the spec you asked for, followed by the analysis of where it breaks, and finally the pushback you invited.

  ### The Spec: Individual Responsibility in Collective Harm

  **1. The Overdetermination Clause (The Buffet Case)**
  *   **Requirement:** The theory must assign moral weight to an act even if the specific outcome would have occurred without it (e.g., the steak was going to be thrown away anyway; the carbon would have been emitted by someone else).
  *   **The Worry:** Pure causal accounts exonerate the individual in overdetermined cases. If morality tracks *difference-making*, you are off the hook. If morality tracks *participation* or *intent*, you are not. The theory must state which it is.
  *   **Status:** **Non-Negotiable.** (For your purpose). If a theory lets you off the hook here, it fails to guide behavior in the exact scenarios where you feel most uncertain.

  **2. The Continuity/Threshold Clause (The Pile-Up)**
  *   **Requirement:** The theory must explain how individual acts relate to a harmful threshold. It cannot treat the act immediately before the threshold as uniquely sinful and the one before that as innocent, unless it provides a probabilistic justification.
  *   **The Worry:** "Sorites" problems. If 100,000 cars cause traffic, but car #99,999 doesn't, is driver #99,999 innocent? A binary theory fails here.
  *   **Status:** **Non-Negotiable.** Real-world harm is almost always aggregative, not binary.

  **3. The Epistemic Accessibility Clause (Usability)**
  *   **Requirement:** The criteria for wrongness must be assessable by an agent with limited information, no access to global data, and limited cognitive processing power.
  *   **The Worry:** If the theory requires you to calculate the expected utility of a burger supply chain to know if you acted wrongly, it is a theory for gods, not humans.
  *   **Status:** **Non-Negotiable.** (Given your stated purpose). A theory that cannot be used to organize decisions is useless for organizing decisions.

  **4. The Voting Distinction Clause**
  *   **Requirement:** The theory must distinguish between "low probability of high impact" (voting) and "negligible probability of negligible impact" (one steak). It cannot treat both as statistically zero.
  *   **The Worry:** Expected utility calculations often crash on voting because the probability of being decisive is near-zero. But intuitively, voting matters in a way eating one burger doesn't. The theory must capture why the *structure* of the act matters, not just the raw math.
  *   **Status:** **Non-Negotiable.** If the theory says "don't bother voting" based on causal math, it fails the civic intuition test.

  **5. The Complicity/Phenomenology Clause**
  *   **Requirement:** The theory must explain why participating in a harmful system feels different than causing equivalent harm in isolation, without relying solely on "it feels weird."
  *   **The Worry:** We feel less guilty when "everyone is doing it" or when we are "just a cog." A good theory should explain if this is a moral blind spot (we *should* feel guilty) or a moral insight (systemic harm is different).
  *   **Status:** **Contingent.** This is psychological. A theory could argue this feeling is irrelevant error. However, for *your* purpose (organizing your life), it needs to address this dissonance.

  **6. The Non-Collapse Clause**
  *   **Requirement:** The theory cannot define "moral wrongness" simply as "causing net negative utility." It must allow for the possibility that an act is wrong even if it made no detectable difference, OR it must explicitly argue that "no difference = no wrong" and explain why we should care.
  *   **The Worry:** Conflating *ontology* (what happened) with *normativity* (what should have happened).
  *   **Status:** **Non-Negotiable.** You need to know if you are judging the *outcome* or the *choice*.

  ---

  ### The Analysis: Where the Spec Breaks

  **Which single requirement kills off the most answers?**
  **Requirement #3 (Epistemic Accessibility).**

  Most rigorous causal theories (Act Consequentialism, Causal Contribution accounts) die here. They can theoretically handle the Buffet Case or the Voting Case by using complex expected-value calculations involving probabilities of triggering thresholds. But they demand data you do not have (e.g., "What is the precise elasticity of beef demand in your region?").

  Conversely, most heuristic theories (Rule Utilitarianism, Virtue Ethics, Deontological constraints) pass Usability but often fail **Requirement #1 (Overdetermination)** or **Requirement #6 (Non-Collapse)**. They say "Don't eat meat" regardless of the buffet waste, which feels causally disconnected from the actual harm.

  **Are any jointly unsatisfiable?**
  **Yes. Requirement #1 (Causal Truth) and Requirement #3 (Usability) are in tension, often to the point of incompatibility.**

  This is the distinction between the **Criterion of Rightness** and the **Decision Procedure**.
  *   To satisfy #1, you need to know the actual causal structure of the world (Did that steak trigger an order? Did my vote break the tie?).
  *   To satisfy #3, you need a rule that works *without* knowing that structure.

  You cannot have a theory that *defines* wrongness by exact causal contribution and *tells* a layperson how to identify it in real-time. The causal chain is opaque; the decision must be immediate.

  If you demand both, you will remain in paralysis. The "spec" itself reveals that you are asking for a map that shows the terrain perfectly but is small enough to fit in your pocket. That map does not exist.

  ---

  ### The Pushback

  You asked me to say it plainly if writing the spec is a way of avoiding having a view.

  **It is.**

  This spec is a fortress you are building to keep the anxiety of uncertainty at bay. You are hoping that if you can just find the theory that satisfies all six requirements, the guilt/ambiguity will vanish. It won't.

  Here is the hard truth: **There is no theory that satisfies this spec.**

  Specifically, the tension between *Causal Precision* and *Epistemic Accessibility* is not a bug in current ethics; it is a feature of the world. The world is causally complex; your mind is computationally limited. No ethical theory can bridge that gap perfectly.

  **So, how do you organize your decisions?**

  You stop looking for a theory that tells you *when you are wrong* and start using a heuristic that tells you *how to bet*.

  1.  **Accept the "Expected Value" Heuristic, not the Truth:** You cannot know if your burger matters causally (Req #1). But you know the *probability* it matters is non-zero, and the *magnitude* of harm (if it does trigger a threshold) is massive. Therefore, the *expected value* of abstaining is positive. You don't need to know if you made a difference; you need to know you took the bet with the best odds.
  2.  **Separate "Guilt" from "Responsibility":** You can accept that you are *responsible* for voting and eating less meat (based on expected value) without needing to know if you are *guilty* (causally culpable) for past acts.
  3.  **Adopt a "Complicity" Standard:** For the systemic stuff (Req #5), stop asking "Did I cause this?" and ask "Do I want to be the kind of person who sustains this?" This shifts the metric from causal impact (unknowable) to integrity (knowable).

  ### How the Contenders Score

  *   **Act Consequentialism:**
      *   *Pros:* Handles Voting (via EV) and Pile-ups well.
      *   *Cons:* Fails Usability (requires math you can't do). Fails Overdetermination (often says the buffet steak is fine).
      *   *Verdict:* Theoretically strong, practically useless for you.
  *   **Deontology (Rules/Duties):**
      *   *Pros:* Passes Usability (Don't kill, Don't steal). Handles Overdetermination (Killing is wrong even if someone else would have done it).
      *   *Cons:* Struggles with Pile-ups (Is one drop of poison stealing?). Can feel rigid/arbitrary.
      *   *Verdict:* Good for decision-making, weak on explaining *why* collective harm matters.
  *   **Virtue Ethics:**
      *   *Pros:* Passes Usability ("What would a virtuous person do?"). Handles Complicity well (focuses on character within a system).
      *   *Cons:* Vague on Voting and Thresholds.
      *   *Verdict:* Best for your psychological peace, worst for causal precision.
  *   **Complicity Theory (Recent Academic Trend):**
      *   *Pros:* Specifically designed for your "System/Group" worry.
      *   *Cons:* Often academically dense, fails Usability.
      *   *Verdict:* Accurate, but won't help you decide on Tuesday night.

  ### Final Recommendation

  Do not wait for a theory that satisfies the spec. It will not come.

  Adopt a **Two-Tier Approach**:
  1.  **Public/General Level:** Follow robust heuristics (Vote, reduce meat, fly less). Treat these as "rules of thumb" based on expected value. Do not agonize over whether *this specific instance* matters.
  2.  **Private/Metaphysical Level:** Accept that you cannot know your causal footprint. Make peace with the fact that you might be "causally innocent" but "morally complicit."

  The goal isn't to be metaphysically clean; it's to be practically effective. The spec you wrote proves you understand the problem better than most ethicists. Now use that understanding to stop auditing your soul and start making the bets.
