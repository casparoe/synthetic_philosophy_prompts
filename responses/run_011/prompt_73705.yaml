      *   *Advice:* You don't need a *true* theory; you need a *robust heuristic*. The search for a metaphysically airtight account of individual causation in collective harm might be a wild goose chase because the metaphysics *is* messy.
      *   *Reframing:* The goal shouldn't be "When is an act *actually* wrong?" but "What is the *safest bet* for a moral agent?"

  6.  **Structuring the Response:**
