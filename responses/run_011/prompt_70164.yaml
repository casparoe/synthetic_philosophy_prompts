prompt: |-
  Software engineer, zero philosophy training, so I might be describing this badly. I've been reading about the Nyāya idea that knowledge comes in kinds sorted by source — perception, inference, testimony, analogy — and about the fights over how many sources there really are and whether some collapse into others (Buddhists say two, the materialists say one, and somebody adds postulation and non-apprehension to get six). Before I take any list seriously I want the spec: what does an account of knowledge-sources have to actually deliver to count as adequate?

  Give me the requirements list. Stuff like: it has to handle testimony you can't independently check; it has to say what makes two sources genuinely distinct rather than one wearing a disguise; it has to deal with memory, error and doubt without counting them as sources; it has to cover knowing about absences; it has to explain how it knows its own list is right, and why that isn't circular. For each requirement give the concrete case or argument behind it — the gavaya-in-the-forest sort of example — and mark which are non-negotiable for anyone working in this area versus which are just one camp's commitments (the reduce-everything-to-perception-and-inference crowd, the add-more-sources crowd, knowledge-certifies-itself vs. needs-a-second-look crowd).

  What I most want: if some subset of the requirements can't be met at once, say which and why. My hunch is that "every source has to be validated by a source" and "the list is complete" pull against each other — tell me whether that's a real dilemma or just me being naive. Also, which single requirement knocks out the most candidate lists.

  And please keep settled stuff clearly separated from what people who study this still genuinely argue about. Don't hand me one school's position dressed up as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer, zero philosophy training. Thinks in terms of specs, requirements, edge cases, modularity, and validation.
      *   **Topic:** Epistemology (*Pramāṇa-śāstra*) in Indian Philosophy, specifically the Nyāya school's theory of knowledge sources (*Pramāṇas*), contrasted with Buddhist, Materialist (Cārvāka), and other schools.
      *   **Goal:** A "requirements list" (specification) for what counts as an adequate theory of knowledge sources.
      *   **Specific Constraints:**
          *   Must distinguish settled vs. debated issues.
          *   Must provide concrete examples (like *gavaya*).
          *   Must mark requirements as "Non-negotiable" (core problems any theory must address) vs. "Camp-Specific" (doctrinal commitments).
          *   Must address the "Meta-Dilemma": Can "every source validated by a source" and "the list is complete" coexist?
          *   Must identify the "Killer Requirement" (which one knocks out the most candidates).
          *   Tone: Technical, precise, avoiding jargon without explanation, respecting the engineering mindset.

  2.  **Deconstruct the Philosophical Content (Pramāṇa Theory):**
      *   *Core Concept:* *Pramā* (valid knowledge) vs. *Pramāṇa* (instrument/source of valid knowledge).
      *   *The Debate:* How many *Pramāṇas*?
          *   Cārvāka: 1 (Perception/*Pratyakṣa*).
          *   Buddhist (Dignāga/Dharmakīrti): 2 (Perception, Inference/*Anumāna*).
          *   Nyāya: 4 (Perception, Inference, Testimony/*Śabda*, Comparison/*Upamāna*).
          *   Mīmāṃsā (Prābhākara): 5 (Adds Postulation/*Arthāpatti*).
          *   Mīmāṃsā (Bhāṭṭa) / Vedānta: 6 (Adds Non-apprehension/*Anupalabdhi*).
      *   *Key Problems:*
          *   Reductionism (can Testimony be reduced to Inference?).
          *   Memory (is it a source? Nyāya says no, it's reproduction).
          *   Error/Doubt (not valid knowledge, so not sources).
          *   Absence (knowing something is *not* there).
          *   Validation (*Pramāṇavyavasthā*): How do we know the *Pramāṇas* work? (Intrinsic/*Svataḥ* vs. Extrinsic/*Parataḥ*).
          *   Circularity/Regress.

  3.  **Drafting the "Spec" (Requirements List):**
      *   *Requirement 1: Distinctness (Modularity).* Can't just rename the same function.
          *   *Example:* Testimony vs. Inference.
          *   *Status:* Non-negotiable problem, but solution varies.
      *   *Requirement 2: The Negative Case (Null Handling).* Handling absence/non-existence.
          *   *Example:* "There is no pot on the floor."
          *   *Status:* Camp-specific (Nyāya/Mīmāṃsā say need *Anupalabdhi*; Buddhists say Inference handles it).
      *   *Requirement 3: Memory & Error (Exception Handling).* Distinguish valid generation from retrieval or bugs.
          *   *Example:* Remembering a fire vs. seeing a fire.
          *   *Status:* Non-negotiable (everyone agrees memory isn't a *Pramāṇa*).
      *   *Requirement 4: Uncheckable Testimony (External API).* Trusting sources you can't verify.
          *   *Example:* Vedic injunctions or distant facts.
          *   *Status:* Major split point (Mīmāṃsā vs. Nyāya/Buddhist).
      *   *Requirement 5: Self-Validation (Bootstrapping).* How the system validates itself.
          *   *Example:* How do you know perception works?
          *   *Status:* Non-negotiable problem, solution is the biggest fight (Intrinsic vs. Extrinsic).
      *   *Requirement 6: Completeness (Coverage).* Does the list cover all valid knowledge?
          *   *Example:* Knowing a person is alive because they aren't dead (Postulation).
          *   *Status:* Camp-specific (4 vs 5 vs 6).

  4.  **Addressing the Meta-Dilemma (Validation vs. Completeness):**
      *   The user suspects a conflict between "Every source needs validation" and "The list is complete/closed."
      *   *Analysis:* If every *Pramāṇa* needs another *Pramāṇa* to validate it, you get infinite regress. If one validates itself, is that special pleading?
      *   *Resolution:* This is the *Pramāṇavyavasthā* debate.
          *   *Parataḥ* (Extrinsic, Nyāya): Knowledge is validated by success in action (like testing code in production). No regress because practical success stops the buck.
          *   *Svataḥ* (Intrinsic, Mīmāṃsā): Knowledge is self-luminous (like a lamp illuminating itself).
          *   *The Dilemma:* It's not strictly logical contradiction, but a trade-off between *epistemic security* (Extrinsic) and *immediacy* (Intrinsic). The user's hunch is close: "Every source needs validation" + "Finite list" = Regress *unless* you allow one to be self-validating or stop at practical utility.

  5.  **Identifying the "Killer Requirement":**
      *   What kills the most lists?
      *   *Candidate:* The "Uncheckable Testimony" requirement kills Cārvāka and strict Buddhists.
      *   *Candidate:* The "Distinctness" requirement kills the 6-source folks (Nyāya argues 5 and 6 reduce to 4).
      *   *Winner:* **The Reduction/Distinctness Requirement.** It's the primary weapon Nyāya uses against Mīmāṃsā, and Buddhists use against Nyāya. If you can't prove your source isn't just a combo of the others, your spec is bloated.

  6.  **Refining Tone and Structure:**
      *   Use engineering analogies (APIs, dependencies, unit tests, edge cases).
      *   Keep sections clear: "The Spec," "The Dilemma," "The Killer."
      *   Ensure "Settled" vs. "Debated" is explicit.
      *   Avoid Sanskrit overload, but define terms when used.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *Upamāna* (Analogy/Comparison) clearly? It's tricky. *Gavaya* example is standard.
      *   *Check:* Did I distinguish Mīmāṃsā subschools? Prābhākara (5) vs Bhāṭṭa (6). Important for the "Absence" requirement.
      *   *Check:* Is the "Memory" point clear? Everyone agrees memory isn't a *Pramāṇa*, but why? Because it doesn't *generate* new knowledge.
      *   *Check:* The "Validation" dilemma. Make sure to explain *how* Nyāya avoids the regress (pragmatic success).

  8.  **Final Polish:** (Produces the structured response below).
      *   Intro: Acknowledge the engineering framing.
      *   Section 1: Core Architecture (Definitions).
      *   Section 2: The Requirements List (Table format or clear bullets with tags).
      *   Section 3: The Meta-Dilemma (Validation).
      *   Section 4: The Killer Requirement.
      *   Section 5: Summary of Schools (Who passes which tests).

  *(Self-Correction on the "Dilemma"):* The user asks if "every source has to be validated by a source" and "the list is complete" pull against each other.
  *   If List = {A, B, C}.
  *   Rule: All X in List must be validated by Y in List.
  *   If A needs B, B needs C, C needs A -> Circularity.
  *   If A needs A -> Self-validation.
  *   If A needs nothing -> Axiomatic.
  *   Nyāya says: Validation isn't always by another *Pramāṇa*. It's by *fruitful action* (*arthakriyā*). This breaks the regress. I need to make sure this distinction is clear.

  9.  **Finalizing the Output.** (Proceed to generate response).
answer: |-
  This is a strong framing. Indian epistemology (*Pramāṇa-śāstra*) is essentially a rigorous specification for cognitive architecture. The debates you're reading are effectively code reviews arguing over dependency injection, modularity, and unit testing.

  Here is the requirements specification for a valid *Pramāṇa* (knowledge-source) theory, separated into **Core Architecture** (definitions everyone accepts), **Functional Requirements** (problems every theory must solve), and **Non-Functional Requirements** (where the schools diverge on implementation).

  ---

  ### Part 1: Core Architecture (Settled Definitions)
  *Before testing the list, all parties agree on what the system is supposed to do.*

  1.  **Definition of Valid Knowledge (*Pramā*):** A cognitive state that corresponds to reality (*yāthārthya*) and prompts successful action.
      *   *Engineering equivalent:* A function return value that matches the database state and allows the next process to run without error.
  2.  **Definition of Source (*Pramāṇa*):** The *instrument* or *cause* that **generates** that valid knowledge.
      *   *Constraint:* It must be a *generator*, not a *storage* mechanism.
  3.  **The Exclusion Clause:** Memory (*Smṛti*), Doubt (*Saṃśaya*), and Error (*Viparyaya*) are **not** sources.
      *   *Reason:* Memory retrieves old data; Doubt is null; Error is a bug. A *Pramāṇa* must produce *new*, *true* data.

  ---

  ### Part 2: Functional Requirements (The Spec)
  *These are the test cases any proposed list of knowledge sources must pass. I have marked which are non-negotiable problems vs. specific implementation choices.*

  #### Req 1: The Distinctness Test (Modularity)
  **Requirement:** You must prove that each source in your list is architecturally distinct. You cannot list two sources if one is just a wrapper function for the other.
  *   **The Case:** **Testimony (*Śabda*) vs. Inference (*Anumāna*).**
      *   *Scenario:* A trusted expert tells you, "There is fire on the mountain."
      *   *Reductionist Argument (Buddhist/Nyāya):* This is just Inference. Premise 1: The expert says X. Premise 2: Experts don't lie. Conclusion: X is true. It compiles down to Inference.
      *   *Anti-Reductionist Argument (Mīmāṃsā):* No. I don't infer the expert's reliability every time. The words themselves carry the knowledge directly, like a lamp illuminating an object.
  *   **Status:** **Non-Negotiable Problem.** Every school must address this.
  *   **Verdict:** This is the primary weapon used to shrink lists (e.g., Buddhists reduce Nyāya's 4 down to 2).

  #### Req 2: The Negative Case (Null Handling)
  **Requirement:** The system must account for knowing that something is *absent*.
  *   **The Case:** **Non-Apprehension (*Anupalabdhi*).**
      *   *Scenario:* You look at a table and know, "There is no pot here."
      *   *Problem:* Perception perceives what *is*. Inference requires a positive sign (smoke for fire). What is the positive sign for "no pot"?
      *   *Solution A (6-source Mīmāṃsā):* Add "Non-apprehension" as a distinct source.
      *   *Solution B (4-source Nyāya / 2-source Buddhist):* No new source needed. Perception perceives the empty floor; the mind infers absence based on the expectation of a pot.
  *   **Status:** **Camp-Specific Commitment.**
      *   *Non-negotiable:* You must explain absence.
      *   *Debatable:* Whether it requires a dedicated source module.

  #### Req 3: The Uncheckable API (External Dependencies)
  **Requirement:** The system must handle testimony regarding things the user cannot independently verify.
  *   **The Case:** **Dharma / Remote Facts.**
      *   *Scenario:* A scripture says, "Perform ritual X to achieve result Y (which happens after death)." Or, "There is a city called New York" (and you never go there).
      *   *Problem:* You cannot run a unit test (Perception) on the afterlife. You cannot run an integration test (Inference) because there is no logical invariable connection you can observe.
      *   *Solution A (Mīmāṃsā):* Testimony (*Śabda*) is intrinsically valid. It works like an authenticated API; you trust the token unless there's a specific error message.
      *   *Solution B (Nyāya/Buddhist):* Testimony is extrinsically valid. You must verify the speaker's credibility first via Perception/Inference.
  *   **Status:** **Major Split Point.** This requirement kills the Materialist (Cārvāka) list entirely and strains the Buddhist list.

  #### Req 4: The "Gavaya" Test (Analogy/Mapping)
  **Requirement:** The system must explain how we learn new concepts via description and later recognition.
  *   **The Case:** **Comparison (*Upamāna*).**
      *   *Scenario:* A forester tells a city dweller, "A *gavaya* (wild cow) is like a cow." Later, the dweller sees a *gavaya* in the forest and recognizes it.
      *   *Problem:* Is this Perception? No, he hadn't seen it before. Is it Inference? No, there's no logical "smoke-fire" relation. Is it Testimony? The words alone didn't give him the visual recognition.
      *   *Solution A (Nyāya):* This is a distinct source (*Upamāna*). It maps name to form.
      *   *Solution B (Others):* It's a mix of Testimony (hearing the description) + Perception (seeing the animal) + Memory (recalling the cow).
  *   **Status:** **Camp-Specific Commitment.** Nyāya keeps it (4 sources); others reduce it.

  #### Req 5: The Postulation Test (Debugging by Hypothesis)
  **Requirement:** The system must handle knowledge gained by resolving a contradiction.
  *   **The Case:** **Postulation (*Arthāpatti*).**
      *   *Scenario:* "Devadatta is alive" + "Devadatta is not at home."
      *   *Resolution:* "Therefore, Devadatta is outside."
      *   *Problem:* This isn't standard Inference (no universal rule that 'alive people not at home are outside'). It's an abductive guess to make the data consistent.
      *   *Solution A (Prābhākara Mīmāṃsā):* Distinct source (5 sources).
      *   *Solution B (Nyāya/Buddhist):* Just Inference.
  *   **Status:** **Camp-Specific Commitment.**

  ---

  ### Part 3: The Meta-Dilemma (Validation & Circularity)

  You asked: *Do "every source has to be validated" and "the list is complete" pull against each other?*

  **Yes. This is the *Pramāṇavyavasthā* (Establishment of Sources) problem.**

  If you require that every *Pramāṇa* must be validated by another *Pramāṇa*, you trigger an **Infinite Regress** (A needs B, B needs C, C needs A...).
  If you say one *Pramāṇa* validates itself, you risk **Circularity** or Special Pleading.

  Here is how the schools handle this trade-off. This is not settled; it is the deepest fault line.

  #### Option A: Extrinsic Validation (*Parataḥ Prāmāṇya*) — The Nyāya Position
  *   **Spec:** Knowledge is *not* self-validating. It is validated by successful action (*arthakriyā*).
  *   **Mechanism:** You see water (Perception). You walk to drink it. If you quench your thirst, the Perception was valid. If it was a mirage, it was invalid.
  *   **How it avoids Regress:** The buck stops at **practical success**, not another cognitive source.
  *   **Trade-off:** It introduces a time-lag. You don't *know* you know until you test it.
  *   **Verdict:** Solves the regress, but makes knowledge fallible until "production deployment."

  #### Option B: Intrinsic Validation (*Svataḥ Prāmāṇya*) — The Mīmāṃsā Position
  *   **Spec:** Knowledge is self-luminous. When you know, you know that you know.
  *   **Mechanism:** Like a lamp that illuminates both the object and itself. Validity is built-in at generation. Invalidity is detected later by finding a defect (*bādha*).
  *   **How it avoids Regress:** No source needs another source to validate it.
  *   **Trade-off:** Hard to explain error. If all knowledge is self-validating, why do we ever make mistakes? (Mīmāṃsā argues error is actually *non-knowledge* masquerading as knowledge).
  *   **Verdict:** Solves the regress, but requires complex logic to explain bugs (error).

  #### Option C: The Buddhist "Two-Truths" Hack
  *   **Spec:** Perception is self-validating (it just is). Inference is validated by Perception (it must match reality).
  *   **Trade-off:** Creates a hierarchy. Perception is the root certificate authority; Inference is a signed sub-certificate.

  **Is your hunch correct?**
  Yes. You cannot have a closed list where **every** item requires **another** item in the list for validation without circularity. You must either:
  1.  Allow one item to be self-validating (Axiom).
  2.  Allow validation to come from *outside* the list (e.g., Practical Success).
  3.  Accept circularity (Coherentism).

  Nyāya chooses #2. Mīmāṃsā chooses #1.

  ---

  ### Part 4: The Killer Requirement

  You asked: *Which single requirement knocks out the most candidate lists?*

  **Winner: Req 1 (The Distinctness / Reduction Test).**

  *   **Why:** It is the primary tool used to minimize the ontology.
  *   **Impact:**
      *   **Knocks out the 6-source list:** Nyāya argues successfully that Non-apprehension (*Anupalabdhi*) is just Inference from absence.
      *   **Knocks out the 5-source list:** Nyāya argues Postulation (*Arthāpatti*) is just Inference.
      *   **Knocks out the 4-source list:** Buddhists argue Comparison (*Upamāna*) is just Perception + Memory, and Testimony (*Śabda*) is just Inference.
      *   **Leaves:** The 2-source Buddhist list (Perception + Inference) as the "minimal viable product."
      *   **Threatens the 2-source list:** Materialists (Cārvāka) argue Inference is just a guess based on Perception, so only Perception counts (1 source).

  If you cannot defend the **architectural independence** of your source, it gets refactored out of the system.

  ---

  ### Part 5: Summary of "Builds" (School Positions)

  | School | Sources (Modules) | Validation Strategy | Fails Which Req? |
  | :--- | :--- | :--- | :--- |
  | **Cārvāka** | 1 (Perception) | Extrinsic (Success) | Fails **Req 3 (Uncheckable API)**. Cannot handle science/theory (Inference) or history (Testimony). |
  | **Buddhist** | 2 (Perception, Inference) | Perception=Intrinsic, Inference=Extrinsic | Fails **Req 3** for religious text. Struggles with **Req 2 (Absence)** (must treat absence as a type of inference). |
  | **Nyāya** | 4 (Perception, Inference, Testimony, Comparison) | Extrinsic (Success in action) | **Most Robust.** Accepts the complexity cost to handle Testimony and Analogy cleanly. |
  | **Mīmāṃsā** | 5 or 6 (Adds Postulation, Non-apprehension) | Intrinsic (Self-validating) | Fails **Req 1 (Distinctness)** according to Nyāya critics. Accused of "feature bloat." |

  ### Final Engineering Assessment

  1.  **Settled:** Memory is not a source. Error is not a source. Knowledge must lead to successful action.
  2.  **Debated:** Whether Testimony is a primitive source or a compiled library of Inference. Whether Absence requires a dedicated handler.
  3.  **The Dilemma:** You are correct. A closed list of validators implies circularity unless one validator is axiomatic (Intrinsic) or validation exits the system (Pragmatic).
  4.  **The Killer:** Distinctness. If you can't prove your source isn't just a composite of others, it gets deprecated.

  **Recommendation:** If you are evaluating these systems for robustness, the **Nyāya 4-source model** is the most "production-ready." It accepts the overhead of distinct modules for Testimony and Analogy because in human systems, treating them as mere Inference leads to edge-case failures (e.g., trusting a liar vs. trusting a Vedic text). However, if you want minimalism, the **Buddhist 2-source model** is the most aggressive refactoring, though it risks losing data fidelity on Testimony.
