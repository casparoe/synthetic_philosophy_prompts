answer: |-
  **The Case**
  Elara submits to a thermal calibration where a probe heats her skin to a nociceptive threshold. The sensation retains its full agonizing phenomenology, yet through rigorous meditative conditioning, she decouples her motivational state from the feeling. She sincerely reports, "It feels awful, but I do not want it to stop; I am indifferent to its continuation." Despite this reported indifference, her arm consistently recoils reflexively upon contact. The heat causes minor cellular stress, sufficient to validate the nociceptive signal as veridical.

  **The Check**

  *   **Predictions:**
      *   **(1) Qualitative Account:** Predicts the episode is **bad**. The "agonizing phenomenology" is intrinsically unpleasant; the felt quality constitutes the badness regardless of attitude.
      *   **(3) Desire Account:** Predicts the episode is **not bad**. Badness is constituted by the subject's dislike or desire for cessation. Elara sincerely reports indifference and no desire for cessation, so the constitutive condition for badness is missing.
      *   **(2) Representational/Imperative Account:** Predicts the episode is **bad** (agreeing with 1). The pain veridically represents bodily stress/issues an imperative command ("Stop this!"). The badness lies in the content/command issued, not the feeling or the subject's compliance.

  *   **Key Feature:** The **sincere report of indifference** despite intact painful phenomenology. This feature drives the wedge between the Qualitative account (which tracks the feel) and the Desire account (which tracks the attitude).

  *   **Deletion Test:** If you delete the meditative conditioning (so Elara reports "I want this to stop"), the Desire account aligns with the Qualitative account (both say Bad). If you delete the phenomenology (anesthesia), the Qualitative account aligns with the Desire account (both say Not Bad). The split exists only because the report and the feel are dissociated.

  *   **Best Defense for the Losing Account (Desire):** A Desire theorist should argue that **desire is dispositional**, not merely occurrent or reportable. The reflexive recoil reveals a subpersonal, robust motivational state to avoid the stimulus that overrides her sincere conscious report. She is self-deceived or linguistically limited; the fact that her body "votes" against the stimulus proves she actually desires its cessation, preserving the link between badness and motivation.
