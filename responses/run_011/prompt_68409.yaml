answer: |-
  Here is a decision tree designed to sort the *people* in your committee room. It does not ask about systems (e.g., "Do you like Ranked Choice?"); it asks about consequences. There are ten decision nodes (questions) that branch into six distinct archetypes (leaves).

  ### The Electoral Values Decision Tree

  **Node 1: The Stability Test**
  *Scenario:* The current system produces a council that passes budgets on time but consistently ignores a vocal minority representing 20% of the city.
  *   **A:** That is a success; governance requires a clear majority. *(Go to Node 2)*
  *   **B:** That is a failure; the council is broken. *(Go to Node 3)*

  **Node 2: The Risk Aversion Test**
  *Scenario:* A proposed reform might improve representation but carries a 10% risk of legal challenges or election delays.
  *   **A:** Keep the current system; stability is worth the inequity. *(Leaf 1)*
  *   **B:** Accept the risk; we must fix the inequity. *(Go to Node 3)*

  **Node 3: The Pothole Test (Geography)**
  *Scenario:* Your street has a specific infrastructure crisis.
  *   **A:** I need a specific councilor responsible *only* for my neighborhood to fire if they fail. *(Go to Node 4)*
  *   **B:** I prefer councilors who focus on citywide policy; local issues are administrative. *(Go to Node 5)*

  **Node 4: The Bad Incumbent Test**
  *Scenario:* Your neighborhood councilor is terrible, but the opposing party's candidate is also weak.
  *   **A:** I must be able to vote against that specific person without voting for their opponent. *(Leaf 2)*
  *   **B:** I will vote for the opposing party to ensure a check on power. *(Leaf 3)*

  **Node 5: The 15% Test (Proportionality)**
  *Scenario:* A political group wins 15% of the vote citywide but doesn't win any single district.
  *   **A:** They deserve a seat; otherwise, their votes are wasted. *(Go to Node 6)*
  *   **B:** They lost; seats should go only to those who can win a plurality/majority. *(Go to Node 7)*

  **Node 6: The 5% Threshold Test**
  *Scenario:* To prevent chaos, a rule is proposed that excludes any party getting less than 5% of the vote from winning seats.
  *   **A:** That is a theft of democracy; even small voices need representation. *(Leaf 4)*
  *   **B:** That is a necessary safeguard; we cannot have a fractured council. *(Leaf 5)*

  **Node 7: The Compromise Candidate Test**
  *Scenario:* In a runoff, the candidate who finished *third* in the first round is the only one acceptable to two rival communities.
  *   **A:** The voting method should elevate them as the consensus choice. *(Go to Node 8)*
  *   **B:** Respect the initial rank; the top two should face off regardless of consensus. *(Go to Node 9)*

  **Node 8: The Deadlock Test**
  *Scenario:* Electing a consensus candidate means coalition negotiations take three weeks after the election.
  *   **A:** That is democracy; haste makes waste. *(Leaf 6)*
  *   **B:** That is dysfunction; we need a clear winner on election night. *(Go to Node 9)*

  **Node 9: The Party Label Test**
  *Scenario:* Two candidates have identical local platforms, but one has a national party label and one does not.
  *   **A:** The label helps voters identify values and accountability. *(Leaf 3)*
  *   **B:** The label distorts local issues and imports national polarization. *(Go to Node 10)*

  **Node 10: The Ballot Burden Test**
  *Scenario:* To achieve the desired outcome, voters must rank 10 candidates instead of picking one.
  *   **A:** Voters can learn it; nuance is worth the effort. *(Leaf 6)*
  *   **B:** It is too complex; simplicity prevents spoiled ballots. *(Leaf 1)*

  ***

  ### The Leaves (Archetypes)

  **Leaf 1: The Steward**
  *   **Typical Systems:** At-Large Plurality (Status Quo), Strong Mayor.
  *   **The Unmentioned Trade-off:** They prioritize administrative efficiency over democratic legitimacy, risking long-term alienation of minority groups.

  **Leaf 2: The Ward Guardian**
  *   **Typical Systems:** Single-Member Districts with Recall Options, Open Primaries.
  *   **The Unmentioned Trade-off:** They secure local accountability but often fracture the city into fiefdoms that cannot agree on regional solutions.

  **Leaf 3: The Partisan Pragmatist**
  *   **Typical Systems:** Closed Party List, Straight-Ticket Voting.
  *   **The Unmentioned Trade-off:** They gain clear ideological accountability but surrender local nuance to national party machines.

  **Leaf 4: The Pure Proportionalist**
  *   **Typical Systems:** Low-Threshold Proportional Representation (PR), Single Transferable Vote (STV).
  *   **The Unmentioned Trade-off:** They maximize descriptive representation but often empower fringe extremists who hold the balance of power in coalitions.

  **Leaf 5: The Governability First**
  *   **Typical Systems:** High-Threshold PR, Majority Bonus Systems.
  *   **The Unmentioned Trade-off:** They ensure the council can pass laws but systematically exclude emerging movements until they are already large.

  **Leaf 6: The Consensus Architect**
  *   **Typical Systems:** Ranked Choice Voting (RCV), Condorcet Methods.
  *   **The Unmentioned Trade-off:** They reward moderate compromise but can obscure the specific mandate voters gave to the winner.

  ***

  ### Analysis of the Tree

  #### 1. Logically Available but Unheld Combinations
  There is one combination of answers that is logically consistent but politically rare: **The Anarchic Localist.**
  *   **The Path:** Answer **Node 3-A** (I need a specific neighborhood councilor) *AND* **Node 5-A** (15% citywide groups deserve a seat).
  *   **Why it is unheld:** These are geometrically contradictory. You cannot have strict single-member districts (where geography dictates representation) and citywide proportionality (where ideology dictates representation) without a highly complex hybrid system (like STV in multi-member wards) that most advocates simplify into one camp or the other. People usually want *either* a neighbor they know *or* a party that matches their views, rarely demanding both simultaneously because they recognize the tension.

  #### 2. The Indistinguishable Leaves
  Your questions cannot truly distinguish between **Leaf 6 (The Consensus Architect)** and **Leaf 4 (The Pure Proportionalist).**
  *   **Why:** Both archetypes answer "Yes" to representing the 15% (Node 5), "Yes" to the Compromise Candidate (Node 7), and "Yes" to accepting Ballot Burden/Deadlock (Nodes 8 & 10).
  *   **The Blind Spot:** The tree sorts by *values* (outcomes), not *mechanics*. A Proportionalist achieves coalition governance by letting multiple parties win seats and negotiating *after* the election. A Consensus Architect achieves coalition governance by forcing voters to rank candidates and negotiating *on the ballot*. Both end up with a centrist, coalition-minded council, but they will fight fiercely over the specific system (PR vs. RCV) despite agreeing on almost every scenario in this tree.

  #### 3. Defending the Status Quo
  Note that **Leaf 1 (The Steward)** is reachable via two paths:
  1.  **Node 1-A:** Believing the current exclusion of minorities is a feature, not a bug.
  2.  **Node 10-B:** Believing reform is too complex for voters, even if the current system is flawed.
  This allows committee members who disagree on *why* they keep the current system (ideology vs. risk aversion) to arrive at the same practical position.
