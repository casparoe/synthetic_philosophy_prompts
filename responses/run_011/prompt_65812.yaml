prompt: |-
  I lead the adult formation series at my congregation, and next month's ninety-minute session has been given to me on the question of whether religious arguments belong in political debate. Nothing has been assigned and I cannot assign anything; the room will hold perhaps thirty people, roughly half of whom suspect that this topic is a courteous way of telling them to keep quiet, and roughly half of whom regard the question as already settled against them. I have a whiteboard and no handouts. I want a plan for the explanation, not the explanation.

  The live case I intend to build on is local: our town council is deciding whether to renew the contract under which a faith-based charity runs the municipal overnight shelter, on terms permitting the charity to apply a religious test in hiring and to decline to house unmarried couples in the same room. Both camps in the room have a stake in it, and both have reasons.

  What I am asking for:

  1. The order of the pieces, with the dependency structure made explicit — what has to be in place before the next thing can do any work. In particular, tell me whether the fact that reasonable people persistently disagree about the good life must be established before any claim about legitimacy can bite, or whether opening there is a trap that hands the first half of the room a reason to tune out.

  2. A verdict on my carrying case. Can the shelter contract sustain ninety minutes, or must it be replaced or supplemented? State what a case for this idea has to have and what it must lack in order to work; my hunch is that it must be a case in which the religiously grounded position is not obviously repellent and the secular opposition is not obviously neutral, but I want your specification rather than mine.

  3. I have seen this taught two ways: through the metaphor of translating religious reasons into public ones, and by opening from church–state separation. I think both are wrong. Tell me which is more damaging and why, and whether a third framing should open the session instead.

  4. A misconception map. Mine so far: that the view amounts to a ban on religious speech in politics; that it is establishment-clause material rebranded; that secular reasons are neutral and so the justificatory burden falls on one side only; that supplying public reasons is a form of disguise or bad faith; that the whole apparatus applies exclusively to believers. Add the ones I have missed, and for each say whether it must be headed off before it forms or after, at which point in the sequence, and by what move.

  5. Someone will say that the rule is not neutral either — that insisting on public reasons is itself one contested view of how to live, no less comprehensive than the ones it excludes. Say where that objection belongs in the sequence and what can honestly be done with it in the time available.

  6. Scope: it may be that a municipal service contract is not the sort of question this ideal governs at all. Tell me how to handle that live possibility without the session collapsing into a seminar on where the line gets drawn.

  7. A closing check — one question I can put to the room whose answers will show whether they have grasped the difference between a reason being religious in its origin and a reason being religious in the sense that only those who share the faith could accept it, as distinct from merely feeling better or worse about their own side.

  8. What to cut. Of the original position, the overlapping consensus, the burdens of judgment, the internal debate about how inclusive the ideal should be, and the standing criticisms of it, say which must enter anyway as a one-sentence premise and which can go entirely, and what I should say out loud about the omissions.

  Please commit. I want the choices made — the case, the order, the framing, the placement of each misconception, the closing question — each with the reason you settled on it, not a menu left for me to weigh. Where a competent alternative plan would genuinely diverge from yours, flag the one or two such points and say which version you would run and why. And if you think my diagnosis of the room, or my candidate case, is mistaken, say so plainly rather than building the plan around it.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Role:** Leader of an adult formation series at a congregation.
      *   **Task:** Plan a 90-minute session on "Whether religious arguments belong in political debate."
      *   **Constraints:** No handouts, whiteboard only, ~30 people.
      *   **Audience Dynamics:** Half think this is a gag order (keep quiet); half think it's settled against them (secularists/liberals). High tension.
      *   **Specific Case:** Local town council renewing a contract with a faith-based charity for a homeless shelter (religious hiring test, no unmarried couples).
      *   **Deliverables:** 8 specific points (Order/Dependencies, Case Verdict, Framing/Metaphor, Misconception Map, The "Neutrality" Objection, Scope/Line-Drawing, Closing Check, What to Cut).
      *   **Tone/Style:** Committed, decisive, no menus, explicit reasoning for choices. Challenge the user if necessary.

  2.  **Deconstruct the Audience & Topic:**
      *   *Group A (Religious Conservatives/Traditionalists):* Fear being silenced. Feel their moral convictions are being marginalized as "private."
      *   *Group B (Secular Liberals/Progressives):* Feel the issue is settled (separation of church and state). Fear religious imposition.
      *   *The Tension:* If I start with "Reasonable Disagreement" (Rawlsian burdens of judgment), Group B might tune out ("We already know democracy requires compromise") or Group A might tune out ("This is relativism").
      *   *The Case:* The shelter contract is *good* but risky. It involves state funding (public money) + religious conduct (hiring/housing). It's concrete.
      *   *The Goal:* Not to solve the specific case, but to use it to explore the *principle* of public reason without alienating either side.

  3.  **Address Point 1: Order & Dependencies:**
      *   *Question:* Must "reasonable disagreement about the good life" be established first?
      *   *Analysis:* If I start there, it sounds abstract and philosophical. Group A hears "Your truth isn't the only truth." Group B hears "Boring theory."
      *   *Decision:* Start with the *conflict*, not the theory. Establish the *stakes* first. The dependency is: Concrete Conflict -> Intuition about Fairness -> Abstract Principle -> Application.
      *   *Verdict:* Do not open with "reasonable disagreement." Open with the specific tension of the shelter case. Establish the *need* for a shared language before defining the language.

  4.  **Address Point 2: The Carrying Case (Shelter Contract):**
      *   *Question:* Can it sustain 90 minutes?
      *   *Analysis:* It's strong because it involves *money* and *discrimination*, not just speech. It forces the question: "When does religious practice become public policy?"
      *   *Requirements:* It must not be a "no-brainer." If the charity was just praying over meals, it's too easy. If they were burning crosses, it's too hard. The hiring/housing clause is the sweet spot.
      *   *Verdict:* Keep it. It works *if* framed as a governance problem, not a moral judgment on the charity.
      *   *Condition:* Must avoid making the secular position look like "neutral administration." It's also a value judgment (equality vs. religious liberty).

  5.  **Address Point 3: Framing (Translation vs. Separation):**
      *   *Question:* Translation metaphor or Church-State separation?
      *   *Analysis:*
          *   "Translation" (translate religious reasons into secular ones) implies disguise/bad faith (Misconception #4). It insults Group A.
          *   "Separation" (Wall of separation) implies religion is dirty/dangerous. It insults Group A and bores Group B.
      *   *Decision:* Neither. Use a **"Common Ground / Shared Justification"** framing. The question isn't "Can I say it?" but "Can I expect you to fund/enforce it?"
      *   *Third Framing:* **Civic Friendship/Reciprocity.** "What do we owe each other as co-rulers?"

  6.  **Address Point 4: Misconception Map:**
      *   *User's List:* Ban on speech, Establishment Clause, Secular Neutrality, Disguise/Bad Faith, Exclusively for Believers.
      *   *Missing Ones:*
          *   "Public Reason means Secular Reason" (Secularism is also a comprehensive doctrine).
          *   "It applies to voting vs. lawmaking" (Distinction between private ballot and public justification).
          *   "It forbids religious motivation" (vs. religious justification).
      *   *Timing:* Head off "Ban on Speech" immediately (Opening). Head off "Secular Neutrality" during the theory section. Head off "Motivation vs. Justification" during the case application.

  7.  **Address Point 5: The "Neutrality Objection" (Public Reason is itself comprehensive):**
      *   *Analysis:* This is the "Self-Defeat" objection (Wolterstorff etc.). If public reason excludes religious views, isn't public reason itself a religious/secular view?
      *   *Placement:* Late in the session. It's a meta-objection. If raised early, it derails everything.
      *   *Handling:* Acknowledge it honestly. Don't try to "solve" it philosophically. Frame it as: "Yes, it's a commitment to a specific kind of political relationship, not a metaphysical truth."

  8.  **Address Point 6: Scope (Municipal Contract vs. General Debate):**
      *   *Analysis:* Is a service contract different from a debate on abortion? Yes. One is administration, one is legislation.
      *   *Handling:* Don't get bogged down in drawing the line everywhere. Use the contract to illustrate the *principle*, then acknowledge the boundary. "If it applies here, where else?" Keep it as a horizon question, not a mapping exercise.

  9.  **Address Point 7: Closing Check:**
      *   *Goal:* Distinguish Origin vs. Accessibility.
      *   *Question:* "If a religious text and a secular philosophy lead to the same policy conclusion, which reason do you offer your neighbor who rejects the text but accepts the philosophy?" (Too leading).
      *   *Better:* "Can you support this law *because* of your faith, but defend it to your neighbor *without* invoking your faith's authority?"
      *   *Refinement:* "If your neighbor asks 'Why must *I* abide by this?', does your answer rely on a book they don't hold, or a harm they can see?"

  10. **Address Point 8: What to Cut (Rawlsian Toolkit):**
      *   *Items:* Original Position, Overlapping Consensus, Burdens of Judgment, Inclusivity Debate, Standing Criticisms.
      *   *Decision:* Cut Original Position (too abstract). Cut Overlapping Consensus (too technical). Keep "Burdens of Judgment" as a premise (we disagree reasonably). Cut Inclusivity Debate (too academic).
      *   *Omission Statement:* "We are not doing political philosophy today; we are doing civic troubleshooting."

  11. **Review and Refine (Self-Correction):**
      *   *Critique:* Is the "Civic Friendship" framing too soft?
      *   *Correction:* Make it "Civic Reciprocity." It implies obligation, not just nice feelings.
      *   *Critique:* Is the shelter case too divisive?
      *   *Correction:* It *needs* to be divisive to work. The plan must manage the heat, not remove it.
      *   *Critique:* Did I answer the "Reasonable Disagreement" dependency in Point 1 clearly?
      *   *Correction:* Be explicit. Do not start with it. Derive it from the case.

  12. **Final Polish:** Ensure the tone is authoritative and direct, matching the user's request for commitment. Check all 8 points are addressed distinctly. (Wait, I need to make sure I don't just list them, but weave them into a coherent plan while explicitly answering the prompts). *Correction:* The prompt asks for the plan *structured by the 8 points*. I will follow the numbered list for clarity but ensure the content is integrated.

      *Wait, one critical check:* The user asked: "tell me whether the fact that reasonable people persistently disagree about the good life must be established before any claim about legitimacy can bite, or whether opening there is a trap."
      *My thought:* It is a trap. If you start with "We all disagree," the zealots tune out. Start with "We have to live together despite disagreement."
      *User's Case:* "My hunch is that it must be a case in which the religiously grounded position is not obviously repellent and the secular opposition is not obviously neutral."
      *My thought:* The shelter case fits this. The charity provides a needed service (good). The secular opposition is about tax dollars funding discrimination (not just "religion is bad").

      *Let's finalize the "Verdict on Carrying Case".* It is strong. But it risks becoming a legal seminar. Must keep it on the *argumentative* level, not the *legal* level.

      *Let's finalize the "Closing Check".* Needs to be sharp.
      *Let's finalize the "What to Cut".* Be ruthless. Rawls is heavy; this is 90 minutes.

      *Wait, Point 5:* "Someone will say that the rule is not neutral either..." This is the "Self-Defeat" objection. I need to place this carefully. It usually comes up when people feel the rule is rigged against them. So, late middle.

      *Wait, Point 3:* "Translation" vs "Separation". I need to propose a third. "Reciprocity" is the standard alternative. I will stick with that.

      *Okay, ready to write.* I will structure the response exactly according to the 8 numbered requests to ensure compliance, but write with the decisive voice requested.

      *One more check on Point 1:* "Dependency structure." I need to be clear about what enables what.
      *One more check on Point 6:* "Scope." If the contract is administrative, does public reason apply? Yes, because it sets policy precedent. But I need to warn the user not to let the group get stuck on "Is this legislation or administration?"

      *Final Plan Structure:*
      1. Order/Dependencies (Start with Case, derive Theory).
      2. Case Verdict (Keep it, but frame carefully).
      3. Framing (Reciprocity, not Translation/Separation).
      4. Misconceptions (Map & Timing).
      5. Neutrality Objection (Placement & Handling).
      6. Scope (Handle the "Line" problem).
      7. Closing Check (The Question).
      8. What to Cut (Rawlsian pruning).

      *Tone Check:* "Please commit." "I want the choices made." No waffling.

      *Let's refine the "Reasonable Disagreement" point.* If I don't establish that reasonable people disagree, why do we need public reason? If everyone was unreasonable, we'd just use force. So the *fact* of disagreement is a premise. But do I *argue* for it first? No. I assume it as a condition of the room. I will treat it as a "Given," not a "Thesis."

      *Let's refine the "Translation" critique.* Translation implies I have a religious reason and I dress it up. Public Reason says I need a reason that *works* for the public. Distinction is crucial.

      *Okay, proceeding to generate response.*
answer: |-
  Here is the plan. I have made the choices you requested. I am not offering alternatives unless a divergence is critical; where I have chosen a path, it is because the other path fails your specific room dynamics.

  ### 1. Order of Pieces and Dependency Structure

  **Do not open with "reasonable disagreement."** That is a trap. If you begin by philosophically establishing that reasonable people disagree about the good life, the half of the room that suspects a gag order will hear moral relativism ("My truth is no better than yours"), and the half that thinks it's settled will hear a lecture they don't need.

  **The Sequence:**
  1.  **The Concrete Impasse (0–15 mins):** Present the Shelter Case immediately. Do not theorize. Ask: "Why is this hard?"
  2.  **The Civic Relationship (15–30 mins):** Derive the need for a rule from the impasse. *Dependency:* You cannot argue for *public reason* until you have established that we are *co-rulers* who must justify force to one another.
  3.  **The Principle (30–50 mins):** Define the norm (Reciprocity, not Translation). *Dependency:* This only lands once they feel the pain of the impasse.
  4.  **Application & Objections (50–75 mins):** Return to the Shelter Case with the principle. Handle the "Neutrality Objection" here.
  5.  **Closing Check (75–90 mins):** The diagnostic question.

  **Why:** The fact of reasonable disagreement is a *precondition* for the theory, but it is not the *entry point*. Treat it as a background fact ("We know we disagree") rather than a thesis to be proved ("Let me convince you we disagree"). If you argue for disagreement first, you validate the suspicion that you are undermining their certainty.

  ### 2. Verdict on the Carrying Case

  **Keep the Shelter Contract.** It is sufficient for ninety minutes, provided you strictly police the boundaries of the discussion.

  **What it must have:**
  *   **State Funding:** It must involve tax dollars. This triggers the "public" element immediately.
  *   **Exclusionary Conduct:** The "no unmarried couples" clause is essential. It prevents the secular side from claiming neutrality (it's not just administration; it's enforcing a moral code) and prevents the religious side from claiming mere belief (it's operational policy).
  *   **Necessity:** The charity must be viewed as competent/necessary. If they are incompetent, the decision is easy (fire them). If they are vital, the tension holds.

  **What it must lack:**
  *   **Legal Technicalities:** Do not let the session become a seminar on the First Amendment or contract law. If someone asks, "Is this legal?", your answer is, "We are asking whether it is *legitimate*, regardless of legality."
  *   **Moral Judgment on the Charity:** Do not let the room decide if the charity is "good" or "bigoted." The question is about the *argument* used to fund them, not the charity's virtue.

  **Why:** Your hunch is correct. If the religious position were obviously repellent (e.g., discrimination based on race), the secular side wins too easily. If the secular opposition were obviously neutral (e.g., zoning laws), the religious side feels targeted. This case forces both sides to admit their "trump cards" (Faith vs. Equality) are not automatically decisive in a pluralistic budget meeting.

  ### 3. Framing: The Third Way

  **Discard both "Translation" and "Separation."**

  *   **Why "Translation" is damaging:** It implies bad faith. It suggests the religious person has a "real" reason (God said so) and must dress it up in a secular costume to sneak it into law. This confirms the suspicion of Group A (that they are being asked to lie).
  *   **Why "Separation" is damaging:** It implies religion is a private hobby that becomes dangerous when public. This confirms the suspicion of Group A (that they are being marginalized) and bores Group B (who already believe this).

  **Use "Civic Reciprocity."**
  Open with this frame: *"We are not asking what you believe in your heart. We are asking what you owe your neighbor when you ask them to pay for or abide by a law."*

  **The Move:** Write on the whiteboard: **Coercion requires Justification.**
  If I vote to use your tax money to run a shelter, I owe you a reason you can accept without converting to my faith. This is not about silencing speech; it is about the terms of our shared rule. This framing respects the religious participant as a co-ruler, not a private citizen, and challenges the secular participant to admit that "secular" is not the same as "neutral."

  ### 4. Misconception Map

  You have identified five. Here are the three critical additions, mapped to the sequence.

  | Misconception | Timing | The Move to Head It Off |
  | :--- | :--- | :--- |
  | **"Ban on Religious Speech"** (Yours) | **Opening (0–15 mins)** | Explicitly state: "You may pray, preach, and vote based on your faith. This session is about *public justification* for *state action*, not private conviction." |
  | **"Secular Reasons are Neutral"** (Yours) | **Principle (30–50 mins)** | When defining Reciprocity, note: "Utilitarianism and Kantianism are also comprehensive doctrines. A secular reason is not automatically a public one. It must be accessible, not just non-religious." |
  | **"Motivation vs. Justification"** (New) | **Application (50–75 mins)** | Clarify: "Your *motivation* can be entirely religious. Your *justification* to the public must be shareable. You can be moved by the Bible to feed the poor; you justify the budget by the civic good of housing." |
  | **"Public Reason is Itself Sectarian"** (New) | **Objections (60–75 mins)** | Acknowledge this (see Point 5). Do not deny it. Frame it as a political commitment, not a metaphysical truth. |
  | **"Applies Only to Believers"** (Yours) | **Closing (75–90 mins)** | Remind them: "Secularists also have 'faith' commitments (e.g., absolute autonomy) that may not be shareable. This rule binds everyone." |

  **Strategy:** Head off the "Ban on Speech" immediately. If you wait, it becomes the subtext of the whole room. Address the "Secular Neutrality" during the theory section so Group A doesn't feel the game is rigged. Address "Motivation" during the case application so Group A doesn't feel they must lobotomize themselves.

  ### 5. The "Neutrality Objection" (Self-Defeat)

  **Placement:** Late in the **Application & Objections** phase (approx. minute 65).

  **The Objection:** "Insisting on public reasons is itself a contested view of how to live. You are imposing a 'secular' liberal comprehensive doctrine on religious people."

  **Handling:** Do not try to refute this philosophically. You will not solve the Wolterstorff/Rawls debate in 10 minutes.
  **The Honest Move:** Concede the point. Say: *"You are right. Public Reason is not a view from nowhere. It is a political commitment to a specific kind of relationship—one where we do not rule each other by authorities the other cannot access. It is a constraint we accept to avoid civil war, not a truth we discovered in nature."*

  **Why:** If you deny it, you prove the objection. If you admit it but justify it pragmatically (peace/cooperation), you disarm the accusation of hidden dogma. This satisfies Group A (you aren't claiming metaphysical superiority) and Group B (you are still maintaining the norm).

  ### 6. Scope: The Municipal Contract

  **The Risk:** The group gets stuck on "Is a service contract legislation? Does Public Reason apply to administration?"

  **The Handling:** Do not draw the line. **Punt the boundary, keep the principle.**
  Say: *"Whether this applies to a zoning variance, a budget line, or a criminal law is a legal question. Today we are asking: If this principle applies anywhere, does it apply here? If we cannot use public reasons for tax-funded contracts, where can we?"*

  **Why:** If you try to define the scope of Public Reason (legislative vs. administrative vs. judicial), you turn the session into a law seminar. Keep the focus on the *nature of the justification* required when public resources are used. If they press, admit: *"The line is debated. But the requirement for shareable reasons grows stronger the more coercive or exclusive the state action is."*

  ### 7. Closing Check

  You need a question that distinguishes **Origin** (where the reason comes from) from **Accessibility** (who can accept it).

  **The Question:**
  *"If you support this shelter contract, and your neighbor asks, 'Why must I, a non-believer, pay for a program that enforces religious rules on housing?', does your answer rely on a text they do not hold, or a harm they can see?"*

  **Why:**
  *   If they say "Text," they have failed the Public Reason test (not because the text is false, but because it isn't shareable).
  *   If they say "Harm" (e.g., homelessness hurts the whole town), they pass, even if their *motivation* was the text.
  *   This distinguishes "Religious Origin" (allowed) from "Religious Authority" (not shareable).

  ### 8. What to Cut (The Rawlsian Toolkit)

  You have 90 minutes and a tense room. You must be ruthless.

  *   **Cut: The Original Position.** It is too abstract. It sounds like "imagining you don't know who you are," which feels like erasure to the religious group.
  *   **Cut: Overlapping Consensus.** Too technical. It implies we only agree on the overlap, which suggests our deep truths don't matter.
  *   **Cut: The Inclusivity Debate.** (e.g., "Can I introduce religious reasons if I promise to translate them later?"). This is academic nuance that will confuse the room. Stick to the core norm: *Justify coercion with shareable reasons.*
  *   **Keep (as One Sentence): The Burdens of Judgment.** You need this premise. *"We must assume our neighbors are reasonable even when they disagree."* Say this once in the first 20 minutes to set the tone.
  *   **Keep (as One Sentence): Standing Criticisms.** Acknowledge briefly: *"Some say this silences the prophetic voice. We are testing whether it protects the civic peace."*

  **What to say about omissions:**
  *"We are not doing political philosophy today; we are doing civic troubleshooting. I am leaving out the deep theoretical history so we can focus on what we owe each other on Tuesday night at the town council."*

  ***

  ### Summary of Divergences

  There is one competent alternative to my plan: **Starting with the Theory of Reasonable Disagreement.**
  *   **Alternative:** Open with the philosophical premise that because we disagree reasonably, we need Public Reason.
  *   **My Choice:** I reject this for your room.
  *   **Reason:** Your diagnosis is that half the room feels targeted. Starting with theory validates their fear that this is an academic exercise designed to constrain them. Starting with the *Shelter Case* forces them to feel the problem before you offer the solution. It makes the theory a *tool* they might want, rather than a *rule* being imposed.

  **Final Instruction:** Write "COERCION REQUIRES JUSTIFICATION" on the whiteboard in the first 10 minutes. Do not erase it. Every time the discussion drifts into "Rights" or "Truth," point to the board. That is your anchor.
