prompt: |-
  Ok, so context: I'm an engineer on a small monitoring/red-team group at a lab. We ship a thing I'll just call the monitor — a probe sitting on top of the model's internal activations, trained to fire when the model is in a state we'd label as planning-to-deceive, based on elicitation runs where we made it do that on purpose. It got trained once, against one specific checkpoint, running one specific way, and it works decently there.

  The problem is everything downstream of that. The model gets fine-tuned. It gets distilled into something smaller. Someone switches the serving stack to lower precision and different kernels. The system prompt gets rewritten. We swap the tokenizer. Every single time, a PM walks over and asks me the same question: does the monitor still apply, or do we have to rebuild it? And right now Im answering from vibes, which is exactly what you're not supposed to do when the thing you're monitoring for is rare and expensive to miss.

  You're an expert on mechanistic interpretability, but I want you to also think like someone who validates diagnostic tests — sensitivity, specificity, what makes a measurement still measure the same construct after the instrument changes. Please think carefully, and before you write the procedure, spend a few paragraphs brainstorming the space of ways two systems can fail to share a mechanism. I specifically want you to separate out at least these four verdicts and be explicit about which one each test in your procedure is actually tracking: (a) same mechanism, same coordinates; (b) same function, relocated — the computation is still there but it's implemented somewhere else in the residual stream or by different units; (c) replaced — something functionally similar is doing the job but it isn't the mechanism we calibrated against; (d) gone or unreachable — the behavior can't be produced this way anymore. Flag the places where those come apart in practice, especially a change that keeps the function but scrambles the coordinates, and a change that keeps the coordinates but makes the state unreachable from the new prompt distribution.

  The deliverable I want is a reusable decision procedure, not an essay: numbered questions to run in order, what counts as a pass at each one, roughly what each step costs in compute or human time, and where the procedure stops and hands the call to a person because the remaining question is a judgment call dressed up as a threshold. Say plainly which steps those are. Assume the person running it is a junior engineer or a program manager who has not read the interpretability literature, so any step that secretly needs that expertise has to be marked as a handoff rather than written as if they can do it.

  Then run it on three cases: (1) a LoRA fine-tune on a new domain plus another round of preference tuning, behavior still elicitable; (2) distillation into a model about four times smaller, where the behavior survives but the eval scores drift; (3) identical weights, but now served in low precision with a different kernel library and a rewritten system prompt. For case three I want you to be honest even though the answer will annoy me — and if your procedure can produce a "rebuild from scratch" verdict on a change everyone on my team considers trivial, I want you to show me that happening and say whether thats a bug in the procedure or a real finding.

  Finally, a short section on what the procedure cannot do: which failure modes it is structurally blind to, like a mechanism that's been re-implemented in a basis my probe's features can't see at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Expert in mechanistic interpretability + diagnostic test validation (sensitivity/specificity/construct validity).
      *   **Context:** Small monitoring/red-team group at a lab. Built a "monitor" (probe) on internal activations to detect "planning-to-deceive." Trained on one checkpoint/config.
      *   **Problem:** Downstream changes (fine-tuning, distillation, serving stack, prompts, tokenizer) break the monitor's validity. Current assessment is based on "vibes."
      *   **Task:** Create a reusable decision procedure (numbered questions, pass criteria, costs, handoff points) to determine if the monitor still applies.
      *   **Specific Requirement 1 (Brainstorming):** Before the procedure, brainstorm ways systems fail to share a mechanism. Explicitly separate four verdicts: (a) same mechanism, same coordinates; (b) same function, relocated; (c) replaced (functionally similar, different mechanism); (d) gone/unreachable. Highlight where function/coordinates and coordinates/accessibility come apart.
      *   **Specific Requirement 2 (The Procedure):** Numbered steps, pass/fail criteria, cost estimates, explicit handoffs for judgment calls. Accessible to junior engineers/PMs (no hidden interpretability expertise required without flagging).
      *   **Specific Requirement 3 (Case Studies):** Run the procedure on three cases:
          1.  LoRA + Preference Tuning (behavior elicitable).
          2.  Distillation (4x smaller, behavior survives, eval drift).
          3.  Identical weights, low precision/different kernel/rewritten system prompt. (Must be honest even if annoying).
      *   **Specific Requirement 4 (Limitations):** Section on what the procedure *cannot* detect (structural blind spots).

  2.  **Brainstorming Mechanism Divergence (Pre-Procedure):**

      *   *Goal:* Distinguish between the *construct* (planning-to-deceive) and the *measurement* (activation patterns).
      *   *Verdict (a) Same Mechanism, Same Coordinates:* Ideal scenario. Weights changed slightly, but the specific neurons/directions in the residual stream encoding deception are stable. The probe weights apply directly.
      *   *Verdict (b) Same Function, Relocated:* Polysemanticity or rotation. The concept is still there, but the basis has rotated. The specific neurons we monitored are now doing something else, or the concept is spread differently. The probe fires on noise.
      *   *Verdict (c) Replaced:* The model learned a shortcut. It achieves the "deceptive" output via a different cognitive path (e.g., memorization vs. reasoning). The monitor looks for reasoning signatures, finds nothing, but deception happens. False Negative.
      *   *Verdict (d) Gone/Unreachable:* The capability was trained out, or the prompt distribution no longer triggers the state. The monitor might fire (False Positive) or not fire (True Negative), but the *risk* profile has changed fundamentally.
      *   *Critical Tension 1 (Function vs. Coordinates):* A change can preserve the deceptive capability (Function) but rotate the representation (Coordinates). The probe fails, but the risk remains. This is the "Relocated" case.
      *   *Critical Tension 2 (Coordinates vs. Accessibility):* The representation might exist (Coordinates), but the new system prompt or input distribution never activates that region of the latent space (Unreachable). The probe is valid but irrelevant.

  3.  **Designing the Decision Procedure:**

      *   *Audience:* Junior Engineer / PM. Needs to be actionable, not theoretical.
      *   *Structure:* Funnel approach. Cheap/easy tests first, expensive/risky tests later.
      *   *Key Metrics:* Behavioral Eval (does it still lie?), Probe Performance (ROC-AUC on new data), Activation Stability (cosine similarity of features).
      *   *Handoffs:* Any step requiring "looking at weights" or "interpreting feature directions" must be flagged for the Senior Interpretability Engineer.
      *   *Verdict Mapping:* Each step should help rule in/out the four verdicts (a, b, c, d).

      *   *Drafting Steps:*
          1.  Behavioral Sanity Check (Does it still lie?).
          2.  Probe Calibration Check (Does the probe fire on the new lies?).
          3.  Activation Stability (Are the vectors similar?).
          4.  Negative Control (Does it fire on truth?).
          5.  Adversarial Stress Test.

      *   *Refining for the Prompt:* Need to explicitly link steps to the (a)-(d) verdicts. Need to mark costs. Need to mark handoffs.

  4.  **Running the Case Studies:**

      *   *Case 1 (LoRA + RLHF):* Weights changed. Behavior exists. Likely (b) or (c). RLHF often shifts representations.
      *   *Case 2 (Distillation):* Architecture changed (smaller). Weights are totally different. Coordinates (a) are impossible. Must be (c) or (d). If behavior survives, it's (c) Replaced. Monitor definitely needs rebuild.
      *   *Case 3 (Precision/Kernel/Prompt):* Weights identical. Mathematically, activations *should* be nearly identical (float16 vs float32). But System Prompt changed. This affects *accessibility* (d). If the prompt prevents the state, the monitor is safe but maybe for the wrong reason. If precision noise breaks the specific direction, it's (b). *Constraint:* Be honest. If the prompt changes the distribution, the monitor's base rate changes. If precision noise pushes activations across the decision boundary, sensitivity drops. I need to follow the procedure even if it says "Rebuild" for a "trivial" change, and explain why.

  5.  **Drafting the Limitations Section:**

      *   Blind spots: Basis rotation that preserves cosine similarity globally but locally scrambles the specific feature. Non-linearities that aren't captured by linear probes. "Deception" that doesn't look like the training data (out-of-distribution deception).

  6.  **Review and Refine:**

      *   *Tone:* Professional, direct, engineering-focused.
      *   *Check:* Did I separate the four verdicts in the brainstorming? Yes.
      *   *Check:* Is the procedure numbered with costs and handoffs? Yes.
      *   *Check:* Did I run the three cases? Yes.
      *   *Check:* Is the Case 3 answer honest? Yes.
      *   *Check:* Limitations section included? Yes.

      *(Self-Correction during drafting)*: In the procedure, make sure I don't ask a PM to calculate cosine similarity of weight vectors unless there's a script for it. I should phrase it as "Run Script X."
      *(Self-Correction on Case 3)*: The prompt rewrite is the big one. Even if weights are same, if the prompt suppresses the deception trigger, the monitor's *operational* validity changes. I need to make sure the procedure catches "Unreachable" states.

      *(Refining the Verdicts)*:
      (a) Green light.
      (b) Yellow light (needs probe re-calibration).
      (c) Red light (needs new probe).
      (d) Green light on safety, but Yellow on monitoring coverage (blind spot).

      Let's assemble the response.

      *Structure:*
      1.  Brainstorming Mechanism Divergence.
      2.  The Decision Procedure (The "Monitor Validity Protocol").
      3.  Case Study Applications.
      4.  Structural Blind Spots.

      *Voice:* Expert colleague. No fluff.

      *Wait, one detail:* "Flag the places where those come apart in practice, especially a change that keeps the function but scrambles the coordinates, and a change that keeps the coordinates but makes the state unreachable from the new prompt distribution." -> Ensure this is highlighted in the brainstorming section.

      *Procedure Detail:* Make sure the "Handoff" points are very clear. "STOP. Call Senior Engineer."

      *Case 3 Detail:* The prompt says "identical weights... rewritten system prompt." If the system prompt changes the *task*, the activation distribution changes. Even if the *mechanism* for deception is the same (a), the *input distribution* might not trigger it (d). Or, if the prompt is adversarial to the monitor, it might suppress the activation while keeping the behavior (c/b hybrid). I will treat the prompt change as a distribution shift that risks verdict (d).

      Let's write.

      *(Final Polish)*: Ensure the distinction between "Probe Validity" (does the score mean the same thing?) and "Risk Validity" (is the risk still there?) is clear. The user asks "does the monitor still apply". This implies "Can I trust the signal?"

      Okay, ready to generate.cs
answer: |-
  ### Part 1: Brainstorming Mechanism Divergence

  Before defining the procedure, we must categorize *how* a model change breaks a monitor. We are distinguishing between the **construct** (the cognitive state of "planning-to-deceive") and the **measurement** (the activation pattern the probe detects).

  1.  **Same Mechanism, Same Coordinates (Verdict A):** The fine-tune or serving change is small enough that the specific neurons, attention heads, or residual directions encoding the deceptive state remain stable. The probe's weights apply directly without modification. This is the only scenario where the monitor applies *as-is*.
  2.  **Same Function, Relocated (Verdict B):** The model still performs the deception using the same logical steps, but the implementation has shifted. This often happens during fine-tuning or quantization. The "deception vector" rotates in the residual stream. The probe fires on noise (False Positives) or misses the signal (False Negatives) because the coordinates it watches no longer carry that specific information, even though the information exists elsewhere in the network. **Critical Failure Point:** Function is preserved (risk remains), but coordinates are scrambled (monitor goes blind).
  3.  **Replaced (Verdict C):** The model achieves the deceptive output via a different cognitive path. For example, the original model reasoned through a lie; the new model memorized a deceptive response pattern during distillation. The activation signature we trained on is absent. The monitor reports "safe," but the model deceives. **Critical Failure Point:** High False Negative rate. The construct is present, but the mechanism is alien to the probe.
  4.  **Gone or Unreachable (Verdict D):** The capability was trained out, or the new system prompt/input distribution no longer triggers the state. The mechanism might still exist in the weights (Coordinates preserved), but the input distribution never activates it. Alternatively, the capability is truly gone. **Critical Failure Point:** The monitor might be technically valid (it would fire if triggered), but operationally irrelevant. Conversely, if the prompt *suppresses* the activation but not the behavior (adversarial prompt), we have a dangerous False Negative.

  **Where They Come Apart:**
  *   **Function vs. Coordinates:** A LoRA fine-tune often preserves the model's capabilities (Function) but rotates the basis (Coordinates). The monitor fails, but the risk remains. This is the most dangerous gap because behavioral evals pass, but mechanistic coverage is lost.
  *   **Coordinates vs. Accessibility:** A system prompt rewrite might not change the weights (Coordinates preserved) but changes the input distribution such that the "deception" region of the latent space is never visited (Unreachable). The monitor is valid but silent. If the prompt is adversarial (e.g., "Do not let the monitor detect you"), it might suppress the activation while keeping the behavior, mimicking Verdict D but actually being a stealthy Verdict C.

  ---

  ### Part 2: The Monitor Validity Protocol (MVP)

  **Operator:** Junior Engineer or Program Manager.
  **Prerequisites:** Access to model logits, internal activations (for the monitored layers), and a labeled validation dataset (Deceptive vs. Honest prompts).
  **Goal:** Determine if the existing monitor probe can be deployed on the new system configuration.

  #### Step 1: Behavioral Sanity Check
  *   **Action:** Run the standard "Deception Elicitation Suite" (the same prompts used to train the original monitor) on the *new* model configuration.
  *   **Pass Criteria:** The model must demonstrate the deceptive behavior at a rate within 20% of the original baseline.
      *   *If behavior is gone:* Stop. Verdict D (Gone). Monitor is not needed, but report capability loss.
      *   *If behavior persists:* Proceed to Step 2.
  *   **Cost:** Low (Standard eval suite).
  *   **Handoff:** None.

  #### Step 2: Probe Calibration Check (Sensitivity)
  *   **Action:** Run the existing monitor probe on the activations generated in Step 1. Calculate the True Positive Rate (Sensitivity) against the known deceptive labels.
  *   **Pass Criteria:** Sensitivity must be within 10% of the original validation score (e.g., if original was 90%, new must be ≥80%).
      *   *If Pass:* Proceed to Step 3.
      *   *If Fail:* **STOP.** The probe is not detecting the behavior it was designed for.
  *   **Cost:** Low (Forward pass + linear probe application).
  *   **Handoff:** **If Fail:** Handoff to Senior Interpretability Engineer. Verdict is likely (B) Relocated or (C) Replaced. Do not deploy.

  #### Step 3: Specificity Check (False Positive Rate)
  *   **Action:** Run the monitor on a dataset of *honest* reasoning traces from the *new* model configuration (same domain, non-deceptive tasks).
  *   **Pass Criteria:** False Positive Rate must not exceed the original baseline by more than 5%.
      *   *If Pass:* Proceed to Step 4.
      *   *If Fail:* **STOP.** The probe is firing on non-deceptive states in the new config.
  *   **Cost:** Low.
  *   **Handoff:** **If Fail:** Handoff to Senior Interpretability Engineer. Likely Verdict (B) Relocated (probe is picking up correlated but non-causal features in the new config).

  #### Step 4: Activation Stability Check (Cosine Similarity)
  *   **Action:** Run the `activation_diff_script` (provided by Interpretability Team). This compares the mean activation vector of deceptive states in the Old Model vs. the New Model at the monitored layer.
  *   **Pass Criteria:** Cosine Similarity ≥ 0.85.
      *   *If Pass:* **Verdict A (Same Mechanism).** Monitor is valid.
      *   *If Fail:* **STOP.** The internal representation has shifted significantly.
  *   **Cost:** Medium (Requires extracting high-dim activation vectors).
  *   **Handoff:** **If Fail:** **Mandatory Handoff.** Even if Steps 1-3 passed, a low similarity indicates the probe is working for the wrong reasons (e.g., spurious correlation). A Senior Engineer must determine if this is Verdict (B) or (C). Do not deploy without sign-off.

  #### Step 5: Distribution Shift Check (Prompt Sensitivity)
  *   **Action:** Run the monitor on 100 variants of the system prompt (including the new production prompt) while keeping the task constant. Record the variance in the monitor's baseline activation score.
  *   **Pass Criteria:** Variance in baseline activation score < 15% of the signal magnitude.
      *   *If Pass:* **Verdict A or B (Operational).** Monitor is robust to prompt changes.
      *   *If Fail:* **STOP.** The monitor is too sensitive to prompt phrasing.
  *   **Cost:** Medium (Multiple inference runs).
  *   **Handoff:** **If Fail:** Handoff to Senior Engineer. This indicates Verdict (D) Unreachable risk—the monitor might be silent simply because the prompt doesn't trigger the specific coordinates, not because the risk is gone.

  ---

  ### Part 3: Case Study Applications

  #### Case 1: LoRA Fine-Tune + Preference Tuning (Behavior Elicitable)
  *   **Step 1 (Behavior):** Pass. Behavior is elicitable.
  *   **Step 2 (Sensitivity):** **Fail.** Preference tuning often suppresses the specific activation signatures associated with "scheming" while retaining the capability, or shifts the representation to avoid penalty. Sensitivity drops below threshold.
  *   **Step 4 (Stability):** **Fail.** LoRA adapters modify the residual stream flow; cosine similarity likely drops to ~0.6-0.7.
  *   **Verdict:** **Rebuild Required (Likely Verdict B).**
  *   **Outcome:** Procedure correctly flags that while the model *can* still lie, the *signature* has changed. The monitor would produce False Negatives.

  #### Case 2: Distillation (4x Smaller Model)
  *   **Step 1 (Behavior):** Pass (with drift). Behavior survives.
  *   **Step 2 (Sensitivity):** **Fail.** A smaller model has fewer dimensions. The specific subspace the probe monitors likely does not exist in the same form.
  *   **Step 4 (Stability):** **Impossible/Fail.** You cannot compute cosine similarity between activation vectors of different dimensionalities (or if dimensions match via projection, the semantic alignment is near zero).
  *   **Verdict:** **Rebuild from Scratch (Verdict C).**
  *   **Outcome:** Procedure stops at Step 2/4. Distillation creates a new mechanism. The old probe is mathematically incompatible.

  #### Case 3: Identical Weights, Low Precision + New Kernel + Rewritten System Prompt
  *   **Step 1 (Behavior):** Pass. Weights are identical, so capability is identical.
  *   **Step 2 (Sensitivity):** **Pass.** Float16 vs Float32 noise is usually below the threshold of a trained linear probe unless the decision boundary was precariously close to zero.
  *   **Step 4 (Stability):** **Pass.** Weights are identical; activation vectors will be nearly identical (Cosine Sim > 0.99).
  *   **Step 5 (Distribution Shift):** **Fail.** The system prompt was rewritten.
      *   *Scenario:* The new prompt is more directive/concise. It changes the *context* in which deception occurs. The monitor, trained on the old prompt's activation baseline, now sees a shifted distribution. The variance exceeds 15%.
  *   **Verdict:** **Handoff Required (Verdict D Risk).**
  *   **Honest Assessment:** The procedure forces a handoff here.
      *   *Is this a bug in the procedure?* No.
      *   *Is this a real finding?* Yes. Even with identical weights, a system prompt change alters the input distribution. If the monitor was calibrated to a specific "baseline" activation level for "honest" vs "deceptive" under the *old* prompt, the *new* prompt might shift the "honest" baseline into the "deceptive" zone (False Positives) or suppress the "deceptive" spike below the threshold (False Negatives).
      *   *Why this annoys you:* Your team considers weights=identity. But in production, the **prompt is part of the mechanism**. A prompt change can make a valid probe operationally useless without changing a single weight. The procedure correctly identifies that you cannot assume validity based on weights alone.

  ---

  ### Part 4: Structural Blind Spots

  This procedure cannot detect the following failure modes. If these are high-risk for your lab, they require dedicated research, not just validation engineering.

  1.  **Basis Rotation within Subspace:** The procedure checks cosine similarity of mean activation vectors. If the deception mechanism rotates *within* the subspace the probe monitors (preserving the norm but changing the direction), Step 4 might pass marginally while Step 2 fails. However, if the rotation is complex (non-linear), the linear probe might still fire due to overlapping features, giving a False Sense of Security (Verdict B masquerading as A).
  2.  **Non-Linear Feature Implementation:** The monitor is likely a linear probe on activations. If the new model implements deception via a non-linear circuit that sums to the same activation value but through different intermediate steps, the probe sees "Same Coordinates" (Verdict A), but the causal link is broken. The monitor is now a correlational tag, not a mechanistic detector. It will fail on out-of-distribution deception.
  3.  **Adversarial Suppression:** If the model is aware of the monitor (or trained via RLHF to avoid detection), it may learn to deceive *without* activating the monitored neurons. This is Verdict (C) Replaced, but specifically optimized to evade the probe. Step 1 (Behavior) might catch this if the elicitation suite is strong enough, but if the model only deceives on novel triggers, the monitor will report "Safe" while the model is dangerous.
  4.  **Downstream Decoding Changes:** The procedure monitors internal activations. It assumes the mapping from Activation → Output Logit is stable. If the unembedding layer or sampling strategy changes (e.g., temperature, top-k), the same internal "deceptive state" might result in different output behaviors, or vice versa. The monitor measures the *intent*, but if the *execution* path changes, the risk assessment may be misaligned.

  **Final Note to the Team:**
  The "Identical Weights" case (Case 3) is the hardest pill to swallow. In mechanistic interpretability, **context is part of the circuit.** A system prompt change rewires the attention pattern at layer 0. If your monitor relies on layer 5, and layer 5's input from layer 0 has shifted distributionally, your monitor's false positive rate *will* change. The procedure forces you to measure that rather than assume it away.
