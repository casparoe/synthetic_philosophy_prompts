  **Step one — planning block**

  Phenomena: Scale anchoring (top rung definition), reference group dependency, aspiration adaptation, construct validity confusion (hedonic vs. eudaimonic), residual confounding, mean masking variance, hedonic adaptation cost-benefit, sampling frame manipulation.
  Closing Beat: Sampling frame manipulation (initiative 8) — excluding unhappy demographics from the survey pool to artificially inflate the mean.
  Satire Target: The conflation of metric optimization with genuine welfare improvement in policy circles, where the map is treated as the territory.
  The humor relies on the bureaucratic acceptance that changing the measurement is equivalent to changing the reality.

  ***

  **INTERNAL MEMORANDUM**

  **TO:** The Minister of National Performance
  **FROM:** Director, National Well-being Optimization Team (NWOT)
  **DATE:** 14 October 2024
  **SUBJECT:** Strategic Well-being Optimization Programme (SWOP) Recovery Plan

  **1. Context**
  The Republic of Meridia has declined from position 34 to 41 in the Global Satisfaction Index. This slip threatens foreign investment and morale. The NWOT has been instructed to recover lost ground prior to the next data collection cycle. The following initiatives comprise the Strategic Well-being Optimization Programme (SWOP).

  **2. Instrument Anchoring Intervention**
  The primary index utilizes a life-evaluation ladder where the top rung represents the best life personally imaginable. Current data suggests citizens imagine unrealistic tops. A public communications campaign will redefine the "best imaginable life" as one characterized by modest stability rather than abundance. By narrowing the gap between actual conditions and the imagined maximum, reported scores will rise without material expenditure.

  **3. Reference-Group Management**
  Life evaluation is partially comparative. Citizens currently compare themselves to international peers via digital media. SWOP will introduce content guidelines encouraging comparison with historical domestic baselines rather than contemporary foreign counterparts. This shifts the reference group to a period of lower expectation, improving relative standing perceptions.

  **4. Aspiration Calibration**
  Lowering the standard against which life is judged is more cost-effective than raising life conditions. A proposal to reduce public service quality was submitted to lower aspirations accordingly. While a junior analyst noted this improves the metric by making the underlying thing worse, the initiative was approved. The analyst's objection was overruled on grounds of communications risk, not merit. Sequencing will ensure aspiration lowering precedes service adjustments.

  **5. Construct Validity Alignment**
  Three ministries collect well-being data: Health (affect balance), Culture (eudaimonia), and Statistics (life evaluation). The Global Index privileges life evaluation. The Ministry of Health and Ministry of Culture will be instructed to reclassify their data as supplementary. Public messaging will assert the Index measures overall national performance, aligning it with the Ministry of National Performance's mandate to reduce turf friction.

  **6. Residualisation Strategy**
  The Index score is influenced by GDP and health outcomes. SWOP will publish adjusted figures controlling for these covariates. The residual variance will be attributed to government policy efficacy. This allows credit to be claimed for the unexplained portion of the score, irrespective of the absolute level.

  **7. Aggregation and Distribution**
  The national mean obscures distributional variance. High-scoring demographics will be oversampled in preliminary releases to shift the central tendency. Outliers in the lower tail will be classified as statistical noise in public briefings. This exploits the arithmetic property of the mean to present a cohesive national picture.

  **8. Adaptation-Based Cost Efficiency**
  Literature confirms citizens habituate to adverse conditions over time. Remedying conditions is expensive; facilitating habituation is cheap. Funding will be redirected from infrastructure repair to resilience workshops. This leverages the hedonic treadmill to generate score improvements per dollar spent. Value for money is maximized by helping citizens adjust to the environment rather than adjusting the environment.

  **9. Sampling Frame Review**
  Certain sub-populations consistently report lower scores due to structural factors. A technical review of the sampling frame is required to determine if these groups fall within the target demographic for national reporting. This matter is referred to the Data Ethics Committee. It is requested that this item not be minuted.

  **10. Risk Register**

  | Risk | Probability | Mitigation |
  | :--- | :--- | :--- |
  | Public perception of lowered standards | Medium | Messaging framed as "realistic optimism." |
  | Inter-ministry data disputes | High | Centralize reporting under NWOT. |
  | International methodological audit | Low | Assert sovereignty over domestic measurement. |
  | Junior staff dissent | Low | Restrict access to raw data streams. |

  **11. Recommendation**
  Approve SWOP immediately to ensure baseline reset before external validation.

  ***

  **Appendix: Methodological Notes**

  1.  **Instrument Anchoring:** This exaggerates the effect of scale anchoring and endpoint definition. How respondents interpret the top of the Cantril ladder significantly influences scores, independent of actual quality of life.
  3.  **Aspiration Calibration:** This satirizes preference adaptation and the "sour grapes" phenomenon. If satisfaction is the gap between aspiration and reality, lowering aspirations increases satisfaction even if reality deteriorates.
  5.  **Residualisation Strategy:** This mimics omitted variable bias and residual claimancy. Researchers sometimes attribute unexplained variance to their specific intervention after controlling for major drivers, claiming credit for the residual.
  8.  **Sampling Frame Review:** This alludes to selection bias and sampling frame exclusion. Removing systematic low-scorers from the survey population artificially inflates the national mean without improving actual well-being.
