prompt: |-
  ok so I got into a genuinely long argument last night with a friend of mine — we do this maybe twice a year and it's never productive — about whether a city can bind itself at all. He's a lawyer, I'm not, and he kept throwing around phrases like "Ulysses contract" and "entrenchment" and "the dead hand problem," and I could follow maybe 70% of it. His position was that any rule a council passes today that a future council can't undo is just the past tyrannizing the present. Mine was that that's obviously wrong, because otherwise a city could never do anything hard: you'd never get a debt brake or a protected transit fund through, since everyone knows the same people who vote for it will vote to raid it in year three. He said that's exactly my problem, I'm admitting the voters can't be trusted with their own money. We went in circles for an hour and neither of us moved.

  Here's why I actually need this and not just a tiebreaker. I work in the city clerk's office in a midsized city, about 180k people, and I'm the one who ends up writing the staff analysis on charter amendment proposals. Three to five times a year we get one that's self-binding in some way — a tax limit requiring a supermajority, a dedicated fund that's "lockboxed," an independent commission with staggered terms that a future council is barred from abolishing or reconstituting. Right now I have no framework. I just describe what the thing does, note that reversing it would require another charter amendment, and let the councilmembers draw their own conclusions, which is cowardly and gets me complaints from both sides. Our office is six people, one of whom is a half-time assistant city attorney, so whatever you write can't assume anybody has read anything, and I usually get about two weeks between a petition being certified and my analysis going out for public comment.

  So: write me a screening procedure I can actually run on a proposal. I want a sequence of questions to ask in order, what counts as a satisfactory answer to each, and clear exits — where the procedure comes out as "this isn't a precommitment device at all, it's an ordinary policy with a fancy label on it," where it comes out as "this binds in a way that will probably backfire, and here's the mechanism," and where it has to stop and hand the thing to the council because what's left is a question of values and not of facts. The real distinctions from the precommitment stuff need to survive the translation — who exactly is binding whom, whether the device constrains a choice set or tries to guarantee an outcome, whether there's an outside enforcer with their own incentives or it's just the same body promising itself to behave later, and how expensive exit is once you want it — but expressed as questions a normal person can ask of a piece of drafting, not as theory. Throw in a couple of cheap tests I can run directly on the text of a proposal. Then run it on three things: (1) a charter amendment requiring a two-thirds council vote to increase the property tax levy, no sunset; (2) a transit lockbox dedicating a fixed share of a new local sales tax to capital transit projects, worded so it survives any future council trying to reallocate it; (3) an independent redistricting commission with staggered eight-year terms that the charter says no future council may abolish. Be straight with me about where the procedure lands on an answer I wouldn't like — I suspect at least one of those three is something I'd personally vote for. And end with a short list of what the procedure genuinely can't settle, including the thing my friend would say it can't settle: whether the people who wrote the rule had any standing to write it for people who werent in the room yet.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** City Clerk's Office staff (midsized city, ~180k pop). Writes staff analysis on charter amendments.
      *   **Problem:** Needs a framework to analyze "self-binding" proposals (entrenchment, precommitment devices). Currently just describes mechanics, which is seen as cowardly/unhelpful.
      *   **Constraints:** Small office (6 people, 0.5 attorney), tight turnaround (2 weeks), audience is laypeople/councilmembers (no legal theory jargon).
      *   **Goal:** A screening procedure (sequence of questions, satisfactory answers, clear exits) to categorize proposals.
      *   **Specific Requirements:**
          *   Distinguish between ordinary policy vs. true precommitment.
          *   Identify binding mechanisms (who binds whom, cost of exit, outside enforcer).
          *   Include "cheap tests" on the text.
          *   Apply the procedure to three specific examples (Tax Supermajority, Transit Lockbox, Independent Redistricting Commission).
          *   Be honest about unfavorable outcomes (even if the user personally supports one).
          *   End with limitations (what the procedure *can't* settle, including the "dead hand" legitimacy question).
      *   **Tone:** Professional, practical, direct, non-academic but theoretically sound.

  2.  **Deconstruct the Theoretical Conflict:**
      *   *Friend's View (Legal/Liberal):* "Dead Hand Problem." Future majorities should rule. Entrenchment is undemocratic/tyrannical.
      *   *User's View (Pragmatic/Institutional):* "Time Inconsistency." Without binding, long-term projects fail due to short-term incentives.
      *   *Synthesis:* The procedure needs to navigate between "Is this legally possible?" (Yes, charters allow this) and "Is this functionally effective without breaking the government?"

  3.  **Drafting the Screening Procedure (The "Precommitment Screen"):**
      *   *Need:* A step-by-step flow.
      *   *Step 1: Is it actually binding?* (Distinguish from ordinary policy).
      *   *Step 2: Who is binding whom?* (Same body vs. Future body vs. Voters).
      *   *Step 3: What is the exit cost?* (Simple majority vs. Supermajority vs. Impossible).
      *   *Step 4: Is there an enforcement mechanism?* (Self-policing vs. External).
      *   *Step 5: The "Emergency Valve".* (Can the city function if things go wrong?).
      *   *Cheap Tests:* Look for specific words ("shall not," "irrevocable," "notwithstanding").

  4.  **Refining the Questions for a Lay Audience:**
      *   Instead of "Entrenchment," use "How hard is it to change?"
      *   Instead of "Time Inconsistency," use "Does this solve a temptation problem?"
      *   Instead of "Dead Hand," use "Future Flexibility."

  5.  **Applying the Procedure to the Three Examples:**
      *   *(1) Tax Supermajority:*
          *   Binding? Yes.
          *   Who? Current voters bind future council.
          *   Exit? High (need 2/3 vote).
          *   Risk? Fiscal straitjacket during emergencies.
          *   Verdict: High entrenchment, high risk of dysfunction.
      *   *(2) Transit Lockbox:*
          *   Binding? Yes.
          *   Who? Current voters bind future council budgeting.
          *   Exit? Hard (charter amendment needed usually, or specific language).
          *   Risk? Inefficiency (money sits there while other needs starve).
          *   Verdict: Moderate entrenchment, common but rigid.
      *   *(3) Independent Redistricting Commission:*
          *   Binding? Yes.
          *   Who? Current voters bind future council's structural power.
          *   Exit? Very Hard (abolishing commission requires amendment).
          *   Risk? Unaccountable body.
          *   Verdict: Highest entrenchment, structural change.

      *   *Self-Correction on "Unfavorable Outcome":* The user suspects they'd vote for one. Likely the Transit Lockbox or Redistricting. I need to be objective. The Tax Supermajority is usually the most economically damaging (fiscal straitjacket). The Redistricting one is the most democratically contentious (removing power from electeds). I should highlight the risks honestly.

  6.  **Addressing the "Dead Hand" Question:**
      *   The procedure *cannot* answer the normative question of legitimacy. It can only describe the *effect*. This must be clear in the conclusion.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the role and the need for neutrality.
      *   **The Screening Protocol:** Break it down into 5 Gates.
          *   Gate 1: The Label Test (Is it just policy?).
          *   Gate 2: The Exit Cost Test (How hard to undo?).
          *   Gate 3: The Enforcement Test (Who watches the watchers?).
          *   Gate 4: The Emergency Test (What if the building burns down?).
          *   Gate 5: The Scope Test (How much of the budget/power is affected?).
      *   **The "Cheap Tests" (Textual Analysis):** Specific phrases to search for.
      *   **The Application (The 3 Cases):** Run them through the gates.
      *   **The Limitations:** What this memo doesn't do (Normative legitimacy).

  8.  **Refining Tone and Constraints:**
      *   *Constraint Check:* 2-week turnaround. The tool must be fast.
      *   *Constraint Check:* 0.5 Attorney. Avoid deep constitutional law, focus on charter mechanics.
      *   *Constraint Check:* 180k City. Not NYC, not a town. Significant bureaucracy but political pressure is real.
      *   *Tone:* "Staff Analysis" style. Objective, clear, actionable.

  9.  **Final Review against User Prompt:**
      *   *Sequence of questions?* Yes.
      *   *Satisfactory answers?* Yes.
      *   *Clear exits?* Yes (Ordinary Policy, Risky Bind, Value Judgment).
      *   *Cheap tests?* Yes.
      *   *Run on 3 examples?* Yes.
      *   *Be straight on unfavorable answers?* Yes.
      *   *End with limitations (including friend's point)?* Yes.

      *(Self-Correction during drafting)*: Make sure I don't give legal advice. I am writing a *procedure for analysis*, not a legal opinion. The distinction is crucial for a Clerk's office. I need to emphasize that this identifies *mechanisms*, not *legality*.

      *(Refining the "Unfavorable" part)*: The user hinted they might support the Transit Lockbox. I need to show how the screen might flag it as "Inefficient" even if it's "Popular." Or perhaps the Redistricting one is the one they like (good governance), but the screen flags it as "High Entrenchment." I will treat all three objectively.

      *(Final Polish)*: Ensure the distinction between "Policy" (easy to change) and "Charter" (hard to change) is clear, as that's the lever the city controls.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a screening procedure designed for your specific constraints: a small office, a lay audience, a two-week turnaround, and the need to remain neutral on politics while being honest about mechanics.

  This is not a legal opinion. It is a **mechanical stress test**. It does not tell the Council whether a proposal is *good*; it tells them what the proposal *does* to their future ability to govern.

  ### The Precommitment Screening Protocol

  Run every charter amendment proposal through these five gates in order. If a proposal fails a gate, it triggers a specific "Staff Note" category.

  **Gate 1: The Reversibility Test (Ordinary Policy vs. Entrenchment)**
  *   **Question:** If the Council wants to undo this in two years, what specific vote is required?
  *   **Satisfactory Answer for "Ordinary Policy":** A simple majority vote of the sitting Council (standard ordinance process).
  *   **Trigger for "Entrenchment":** Requires a supermajority of Council, a vote of the people (referendum), or is explicitly labeled "irrevocable."
  *   **Exit A:** If Ordinary Policy → Stop. Label as "Standard Policy Change." No further precommitment analysis needed.
  *   **Exit B:** If Entrenchment → Proceed to Gate 2.

  **Gate 2: The Binding Target Test (Who is bound?)**
  *   **Question:** Does this restrict the *Council's* discretion, or does it restrict the *Voters'* future choices?
  *   **Satisfactory Answer:** Clear identification of the constrained actor.
      *   *Scenario A:* Council cannot allocate funds elsewhere (Budgetary Bind).
      *   *Scenario B:* Council cannot abolish a body (Structural Bind).
      *   *Scenario C:* Voters must vote again to change (Procedural Bind).
  *   **Staff Note:** Identify if the restriction applies to the legislative body (Council) or the electorate. Binding the Council is an administrative constraint; binding the Electorate is a democratic hurdle.

  **Gate 3: The Exit Cost Test (How expensive is escape?)**
  *   **Question:** If an emergency occurs (fiscal crisis, natural disaster, federal mandate) that conflicts with this rule, how does the city get out?
  *   **Satisfactory Answer:** There is a specific "escape clause" (e.g., "unless declared a fiscal emergency by 2/3 vote").
  *   **Trigger for "High Risk":** No escape clause exists, or the escape clause requires the same difficulty as the original rule (e.g., need 2/3 vote to pass the tax, need 2/3 vote to suspend the tax).
  *   **Exit C:** If High Risk → Flag as "Potential Fiscal/Operational Straitjacket."

  **Gate 4: The Enforcement Test (Who holds the keys?)**
  *   **Question:** If the Council ignores this rule in Year 3, who stops them?
  *   **Satisfactory Answer:** An external party with standing (e.g., a specific taxpayer suit provision, a state agency, a bonded trustee).
  *   **Trigger for "Self-Policing":** The body being bound is the same body responsible for enforcing the bind (e.g., Council promises not to spend money, but Council controls the checkbook).
  *   **Exit D:** If Self-Policing → Flag as "Relies on Political Will, Not Legal Mechanism."

  **Gate 5: The Scope Test (How big is the cage?)**
  *   **Question:** What percentage of the general fund or total authority does this lock up?
  *   **Satisfactory Answer:** Less than 5% of budget or narrow specific authority.
  *   **Trigger for "Systemic Impact":** More than 10% of general fund or core legislative power (like zoning or taxation).
  *   **Exit E:** If Systemic Impact → Flag as "Significant Reduction in Future Governing Capacity."

  ---

  ### Cheap Textual Tests (Run these first)
  Before the full protocol, search the draft text for these phrases. They are proxies for the gates above.

  1.  **"Notwithstanding any other provision..."**
      *   *Meaning:* This rule overrides future rules.
      *   *Implication:* High Entrenchment (Gate 1).
  2.  **"Shall not be abolished / Shall be dedicated"**
      *   *Meaning:* Removes discretion.
      *   *Implication:* Structural/Budgetary Bind (Gate 2).
  3.  **"Only by charter amendment..."**
      *   *Meaning:* Removes Council authority entirely; kicks it to voters.
      *   *Implication:* High Exit Cost (Gate 3).
  4.  **"Standing to sue is granted to..."**
      *   *Meaning:* External enforcement.
      *   *Implication:* Strong Enforcement (Gate 4). If absent, it's self-policing.

  ---

  ### Application to Your Three Examples

  Here is how the protocol lands on the three proposals you currently face. I have applied the screen strictly, ignoring whether the goals are noble.

  #### 1. Property Tax Levy Supermajority (2/3 vote to increase, no sunset)
  *   **Gate 1 (Reversibility):** **Entrenchment.** A future Council cannot undo this with a simple majority.
  *   **Gate 2 (Target):** **Council Bind.** Restricts the legislative body's core power to raise revenue.
  *   **Gate 3 (Exit Cost):** **High Risk.** No sunset, no emergency clause. In a fiscal crisis, the city cannot raise revenue without a supermajority, which may be mathematically impossible if the crisis caused political polarization.
  *   **Gate 4 (Enforcement):** **Self-Policing.** The Clerk certifies the vote count, but there is no external enforcer stopping a simple majority from passing an illegal ordinance except a lawsuit.
  *   **Gate 5 (Scope):** **Systemic Impact.** Property tax is likely a primary revenue source.
  *   **Staff Analysis Conclusion:** **High Entrenchment / High Rigidity.**
      *   *The Uncomfortable Truth:* This creates a "fiscal straitjacket." It solves the "temptation to tax" problem by creating a "inability to fund" risk. If the city faces a sudden cost (pension spike, disaster), the mechanism to pay for it is broken. This is the strongest form of binding the future, and the most likely to cause operational dysfunction.

  #### 2. Transit Lockbox (Fixed share of sales tax, survives reallocation attempts)
  *   **Gate 1 (Reversibility):** **Entrenchment.** Explicitly worded to survive future Council attempts.
  *   **Gate 2 (Target):** **Budgetary Bind.** Restricts appropriation authority.
  *   **Gate 3 (Exit Cost):** **Moderate/High.** Depends on drafting. If it requires a charter amendment to move funds, it's High. If it just says "Council intends," it's low. Assuming your description ("worded so it survives"), it's High.
  *   **Gate 4 (Enforcement):** **Likely Self-Policing.** Unless there is a specific taxpayer suit clause, the Council controls the treasury. They can physically transfer the money; the question is whether they get sued after.
  *   **Gate 5 (Scope):** **Moderate.** Depends on the % of the sales tax.
  *   **Staff Analysis Conclusion:** **Moderate Entrenchment / Efficiency Risk.**
      *   *The Uncomfortable Truth:* You likely support this (it protects transit). However, the screen flags an **efficiency risk**. If the transit capital fund is full but the roads are crumbling, this rule forces the city to borrow money for roads (paying interest) while cash sits idle in transit. It prevents "raiding," but it also prevents "optimizing." It binds the future to a specific priority regardless of changing needs.

  #### 3. Independent Redistricting Commission (Staggered 8-year terms, cannot abolish)
  *   **Gate 1 (Reversibility):** **Entrenchment.** Explicit ban on abolition.
  *   **Gate 2 (Target):** **Structural Bind.** Removes a core power (map drawing) from the elected body and gives it to appointees.
  *   **Gate 3 (Exit Cost):** **Very High.** Staggered terms mean even if you amend the charter, you can't replace the members immediately. They outlast the Council that opposed them.
  *   **Gate 4 (Enforcement):** **External/Independent.** The Commission itself is the enforcer of its own existence.
  *   **Gate 5 (Scope):** **Systemic.** Affects the fundamental democratic structure of the city.
  *   **Staff Analysis Conclusion:** **Maximum Entrenchment / Democratic Trade-off.**
      *   *The Uncomfortable Truth:* This is the most "binding" of the three. It creates a body that is insulated from the voters *and* the Council. While the goal (fair maps) is high-value, the mechanism removes accountability. If the Commission performs poorly or becomes partisan, the "no abolition" clause means the city is stuck with them for up to 8 years regardless. This is the definition of the "Dead Hand": the current voters are permanently removing a power from future voters.

  ---

  ### What This Procedure Cannot Settle

  You asked for the limits of this tool. When you attach this analysis to the staff report, you should include a "Limitations of Analysis" footer. This protects you from the "cowardly" complaint while acknowledging the philosophical boundary.

  **1. The Legitimacy Question (Your Friend's Point)**
  This procedure can tell you *how* a rule binds the future, and *how hard* it is to break. It **cannot** tell you whether the current voters have the moral right to bind future voters.
  *   *The Friend's Argument:* "The dead have no right to rule the living."
  *   *The Procedure's Limit:* It treats that as a value judgment. If the Council wants to prioritize "Stability" over "Flexibility," this tool confirms they are choosing Stability. It does not validate the choice.

  **2. The "Good Government" Paradox**
  This procedure cannot distinguish between "protecting a vital function" and "protecting a special interest."
  *   A transit lockbox and a police pension guarantee look mechanically identical in this screen (both are budgetary binds).
  *   Deciding which one is "worthy" of protection is a political decision, not a mechanical one.

  **3. Legal Enforceability vs. Political Reality**
  This procedure assumes the text will be followed. It cannot predict whether a future Council will simply ignore the charter (happens rarely, but happens) or whether a court will strike it down as violating state law (e.g., some states prohibit charter provisions that restrict budgetary discretion). You must still flag this to your half-time attorney for a separate "Legality" check.

  ### How to Use This in Your Report

  Do not write an essay. Use a standardized table in your staff analysis.

  | Feature | Finding | Implication |
  | :--- | :--- | :--- |
  | **Reversibility** | Requires Charter Amendment | Future Councils cannot undo this via ordinance. |
  | **Constraint** | Budgetary Dedication | Future Councils must fund this before other needs. |
  | **Escape Clause** | None Identified | No mechanism for fiscal emergencies. |
  | **Enforcement** | Taxpayer Suit Allowed | Third parties can force compliance in court. |
  | **Overall Classification** | **High Entrenchment** | **Significant reduction in future legislative flexibility.** |

  This gives the Council the facts. It tells the "Stability" advocate: "Yes, this will protect the program." It tells the "Flexibility" advocate: "Yes, this will make it hard to react to crises." It lets them fight on values, while you remain the neutral mechanic showing them the blueprint of the cage they are building.
