answer: |-
  ### The Persuasion-Manipulation Decision Tree

  This tool is designed to diagnose the *mechanism* of your appeal without presupposing a moral verdict. Answer the four questions below based strictly on the draft text and the context of its delivery. Follow the path to the leaves to see which ethical frameworks are triggered and where the live disputes lie.

  #### Branch Node 1: The Revelation Test
  **Question:** If you added a bold label at the top of the appeal explicitly naming the psychological technique being used (e.g., "We are using social proof," "This is an anchoring default"), would the appeal lose most of its effectiveness?
  *   **Yes:** The influence depends on the mechanism remaining opaque or "in the background."
  *   **No:** The influence works even when the mechanism is transparent (e.g., a strong argument remains strong even if you call it an argument).

  #### Branch Node 2: The Reason Test
  **Question:** Does the appeal primarily supply evidence bearing on the *truth or value* of the cause (e.g., data on impact, stories of beneficiaries), or does it primarily alter the *context of the decision* (e.g., scarcity timers, pre-filled amounts, survival vs. mortality framing)?
  *   **Evidence:** It provides new considerations for the donor to weigh.
  *   **Context:** It shifts how existing considerations are felt or processed without adding new information.

  #### Branch Node 3: The Endorsement Test
  **Question:** If the donor were asked one month later, in a calm state and without pressure, would they report that the influence helped them act on their stable values or hindered it?
  *   **Helped:** They feel the nudge aligned with what they truly care about.
  *   **Hindered:** They feel they were swept up in a moment that doesn't reflect their deeper priorities.

  #### Branch Node 4: The Role Test
  **Question:** What is the normative relationship between the sender and the receiver?
  *   **Market:** A seller and a customer (transactional, caveat emptor).
  *   **Fiduciary/Charity:** A steward and a supporter (trust-based, mission-aligned).
  *   **Sovereign:** A state and a citizen (authority-based, coercive potential).

  ---

  ### The Leaves: Positions and Verdicts

  Depending on how you answered the nodes above, you will land in different zones of ethical contention. Below are the positions people actually hold, mapped to the diagnostic results.

  #### Leaf A: The Covert Constraint (Libertarian/Procedural View)
  *   **Path:** Node 1 = **Yes** (Fails Revelation).
  *   **The Position:** Manipulation is defined by secrecy. If the donor knows they are being influenced, they can guard against it; therefore, overt influence is permissible.
  *   **Verdict:** If your technique fails the Revelation Test, this view condemns it as manipulation. If it passes, it is permissible persuasion, regardless of Node 2 or 3.
  *   **Status:** **Mostly Settled.** There is broad consensus that *deception* is manipulation. The dispute begins when techniques are effective *even when revealed*.

  #### Leaf B: The Rational Constraint (Kantian/Deliberative View)
  *   **Path:** Node 2 = **Context** (Fails Reason).
  *   **The Position:** Manipulation is anything that bypasses a person's capacity to weigh reasons. It treats the donor as a means to an end rather than a rational agent.
  *   **Verdict:** If your appeal relies on framing or anchoring (Context) rather than evidence (Reason), this view condemns it as manipulation, even if it is transparent (Node 1 = No).
  *   **Status:** **Heavily Contested.** Many fundraisers argue that humans are emotional beings, not pure reasoners, and that appealing to emotion is legitimate.

  #### Leaf C: The Endorsement Constraint (Soft Paternalist/Welfarist View)
  *   **Path:** Node 3 = **Helped** (Passes Endorsement).
  *   **The Position:** The morality of influence depends on the outcome for the agent's well-being and values. If the donor is glad they were influenced later, the influence was legitimate.
  *   **Verdict:** Even if the technique bypasses reason (Node 2 = Context) or is covert (Node 1 = Yes), if the donor endorses it later, this view permits it.
  *   **Status:** **Contested.** Critics argue this justifies "brainwashing" if the victim is happy later. Proponents argue it respects autonomy over time.

  #### Leaf D: The Contextual Constraint (Relational View)
  *   **Path:** Node 4 = **Sovereign** or **Fiduciary**.
  *   **The Position:** The same move is permissible for a seller but not for a state or charity. Market norms allow strategic self-interest; fiduciary and state norms require higher transparency and reason-giving.
  *   **Verdict:** A suggested donation amount (anchoring) might be permissible in a **Market** context (Leaf D-Market) but objectionable in a **Fiduciary** context (Leaf D-Fiduciary) if it exploits trust.
  *   **Status:** **Contested.** Nonprofits often argue they must use market tactics to survive; donors often expect higher ethical standards from charities than from corporations.

  ---

  ### Application to Your Three Cases

  Here is how the tree processes the specific examples you provided.

  **1. Suggested Giving Amount (Anchoring)**
  *   **Node 1 (Revelation):** **Yes.** If you tell donors "We put $50 here to make $20 look small," the anchor weakens.
  *   **Node 2 (Reason):** **Context.** It does not provide evidence that $50 is the *correct* amount, only that it is the *default*.
  *   **Node 3 (Endorsement):** **Mixed.** Some donors are glad they gave more; others feel pressured.
  *   **Node 4 (Role):** **Fiduciary.**
  *   **Diagnosis:** This lands firmly in **Leaf B (Rational Constraint)** and **Leaf D (Contextual Constraint)**.
  *   **Verdict:** A strict Kantian or Relationalist would call this manipulation. A Libertarian (Leaf A) would allow it if disclosed. A Paternalist (Leaf C) would allow it if donors remain happy.

  **2. Survival Rate vs. Mortality Rate (Framing)**
  *   **Node 1 (Revelation):** **No/Yes.** Framing often persists even when known (cognitive bias), but can be mitigated.
  *   **Node 2 (Reason):** **Context.** The statistical reality is identical; only the emotional valence changes.
  *   **Node 3 (Endorsement):** **Helped.** Most people prefer to hear survival rates and would endorse receiving information in the less distressing format.
  *   **Node 4 (Role):** **Fiduciary.**
  *   **Diagnosis:** This creates tension between **Leaf B** (bypasses reason by altering frame) and **Leaf C** (endorsed later as helpful).
  *   **Verdict:** This is a classic conflict between Rationalists (who dislike framing) and Welfarists (who accept it to reduce distress).

  **3. Targeted Campaign Ad (Micro-targeting)**
  *   **Node 1 (Revelation):** **Yes.** The targeting algorithm is hidden; if users knew *why* they were seeing the ad, the effect might change.
  *   **Node 2 (Reason):** **Context.** Often relies on identity triggers or urgency rather than policy detail.
  *   **Node 3 (Endorsement):** **Hindered.** Voters often report feeling manipulated after elections, especially if turnout was suppressed or inflamed artificially.
  *   **Node 4 (Role):** **Sovereign/Market Hybrid.** Political campaigns act like sellers but seek state power.
  *   **Diagnosis:** This triggers **Leaf A** (Covert), **Leaf B** (Reason), and **Leaf D** (Role violation).
  *   **Verdict:** Almost all frameworks condemn this if Node 3 is "Hindered." If Node 3 is "Helped" (they are glad they voted), Leaf C permits it, but Leaf D may still object based on the integrity of the democratic process.

  ---

  ### Unoccupied Space: Combinations No One Defends

  When mapping the "Yes/No" answers of the tree against philosophical literature, certain combinations appear unoccupied.

  **1. The "Benevolent Deception" Gap**
  *   **Combination:** Node 1 = **Yes** (Covert) + Node 2 = **Evidence** (Reasons) + Node 3 = **Helped** (Endorsed).
  *   **Description:** Hiding the fact that you are influencing someone, but using only true facts, which they later appreciate.
  *   **Status:** **Unappealing/Rare.** While some "hard paternalists" might defend this, it is largely unoccupied in liberal democratic theory. The combination of *Covert* means with *Reason-based* ends is unstable; if you have good reasons, the dominant view is you should disclose them openly.

  **2. The "Market Exception" Gap**
  *   **Combination:** Node 4 = **Market** + Node 1 = **Yes** (Covert) + Node 3 = **Hindered** (Regret).
  *   **Description:** A seller uses covert tricks that the customer later regrets, but the theorist argues it is still permissible because "it's just business."
  *   **Status:** **Incoherent.** Even strong libertarians generally concede that fraud (covert influence leading to regret/harm) is impermissible in markets. There is no serious position that defends *regretted covert influence* solely based on market status.

  ---

  ### Separation Limits: Where the Tree Blurs

  There are pairs of leaves this decision tree cannot cleanly separate. You should be aware of these blind spots.

  **1. Leaf B (Rational) vs. Leaf C (Endorsement)**
  *   **The Problem:** The tree cannot separate "Bypassing Reason" from "Undermining Values."
  *   **Why:** A donor might endorse an appeal later (Leaf C = Permissible) even if it bypassed their reason (Leaf B = Manipulation). For example, a donor might give impulsively due to a sad photo (bypasses reason) and later say, "I'm glad I did it."
  *   **Result:** The tree identifies the *mechanism* (Node 2), but it cannot tell you whether Reason or Endorsement is the *true* metric of autonomy. You must choose which leaf you prioritize.

  **2. Leaf A (Covert) vs. Leaf D (Role)**
  *   **The Problem:** The tree struggles to separate "Hidden Tactics" from "Role Violations."
  *   **Why:** A tactic might be covert (Node 1 = Yes), which Leaf A condemns. But Leaf D might condemn it *even if transparent* because a Charity shouldn't use market tactics.
  *   **Result:** If you answer "Yes" to Node 1 and "Fiduciary" to Node 4, both leaves condemn the act, but for different reasons. The tree does not tell you which violation is worse.

  ---

  ### Status of Disputes: Settled vs. Contested

  Do not treat the leaves as equal. The ethical landscape is not flat.

  | Branch / Position | Status | Consensus Level |
  | :--- | :--- | :--- |
  | **Covert Influence (Leaf A)** | **Settled** | There is near-universal agreement that *deception* (hiding material facts or the nature of the appeal) is manipulation. |
  | **Overt Anchoring/Framing (Leaf B)** | **Contested** | Behavioral economists often view this as neutral "choice architecture." Kantian ethicists view it as autonomy-violating. There is no consensus. |
  | **Reflective Endorsement (Leaf C)** | **Contested** | Some argue this is the only thing that matters (Mill). Others argue you can be happy but still manipulated (Sunstein). |
  | **Role Norms (Leaf D)** | **Contested** | It is disputed whether nonprofits should be held to higher standards than for-profits. Some argue "survival justifies tactics"; others argue "mission constrains tactics." |

  **Practical Recommendation:**
  If your draft appeal fails **Node 1 (Revelation)**, rewrite it. That is the settled zone of manipulation.
  If your draft fails **Node 2 (Reason)** but passes **Node 3 (Endorsement)**, you are in the contested zone of "Nudging." Proceed only if you have strong evidence that donors genuinely endorse the outcome later.
  If your draft fails **Node 4 (Role)** (e.g., using aggressive sales tactics for a humanitarian crisis), you risk violating donor trust, even if the tactics are legal.
