answer: |-
  # Protocol: The Scene-Consistency Battery (SCB-v1)

  **Objective:** Detect breaks in the "mental model" of the text (global coherence) rather than local translation errors.
  **Time Budget:** 25 Minutes per chapter (approx. 3,000–4,000 words).
  **Personnel:** Post-editors (Linguistics training not required).
  **Language Constraint:** Probes are labeled **[MONO]** (Target text only) or **[BI]** (Source + Target). If you cannot read the source, skip **[BI]** probes and reallocate time to **[MONO]** probes as indicated.

  ---

  ## Part I: The Battery (5 Probes)

  ### Probe 1: The Entity Ledger **[MONO]**
  *   **Operation:** Scan the text for proper nouns (people, places) and third-person pronouns (he/she/they). Create a quick tally sheet. For every instance, note the gender/number assigned in the target text.
  *   **Time Cost:** 5 Minutes.
  *   **Pass:** All references to a specific entity maintain consistent gender and number throughout the chapter.
  *   **Fail:** An entity shifts gender (he → she) or number (it → they) without a narrative explanation (e.g., transition, metaphor).
  *   **Evidential Logic:** **Asymmetric.** A Fail proves the engine lacks a persistent object model (it is not "seeing" the character). A Pass does *not* prove the engine understands the character; it may have pattern-matched the gender from a dominant training cluster.
  *   **Conclusion on Fail:** The text has no stable world-model.

  ### Probe 2: The Causal Chain **[MONO]**
  *   **Operation:** Highlight all logical connectives (because, therefore, however, although, if, unless). Read *only* the clause before and the clause after the connector.
  *   **Time Cost:** 5 Minutes.
  *   **Pass:** The relationship between the two clauses makes logical sense in the target language (e.g., "Because it rained, the ground is wet").
  *   **Fail:** The connection is non-sequitur, contradictory, or reverses the expected logic (e.g., "Because it rained, the ground is dry" without explanation).
  *   **Evidential Logic:** **Asymmetric.** A Fail indicates the engine is stitching fluent sentences without modeling causality. A Pass indicates syntactic coherence, not necessarily factual accuracy.
  *   **Conclusion on Fail:** The narrative logic is broken.

  ### Probe 3: Deictic Anchoring **[MONO]**
  *   **Operation:** Highlight all deictic markers (this, that, these, those, here, there, now, then). For each, draw a line to the specific noun or time it references.
  *   **Time Cost:** 5 Minutes.
  *   **Pass:** Every marker points unambiguously to a specific antecedent within the immediate context.
  *   **Fail:** A marker points to nothing, points to multiple conflicting antecedents, or refers to a spatial/temporal state that contradicts the previous paragraph.
  *   **Evidential Logic:** **Asymmetric.** A Fail proves the engine has lost the "camera position" of the narrative. A Pass is common even in hallucinated text (LLMs are good at local grammar).
  *   **Conclusion on Fail:** The spatial/temporal scene is unmoored.

  ### Probe 4: Terminology & Name Fidelity **[BI]**
  *   **Operation:** *(Skip if Monolingual; add 5 mins to Probe 1)*. Select 5 random sentences containing specific nouns (names, technical terms, cultural artifacts). Compare against Source.
  *   **Time Cost:** 5 Minutes.
  *   **Pass:** Target terms match Source semantics exactly.
  *   **Fail:** Target terms are generalized, swapped, or hallucinated (e.g., Source: "oak tree" → Target: "tree").
  *   **Evidential Logic:** **Symmetric (mostly).** A Fail proves a translation error. A Pass increases confidence but is limited by sample size.
  *   **Conclusion on Fail:** The engine is summarizing rather than translating.

  ### Probe 5: Register Stability Scan **[MONO]**
  *   **Operation:** Read the first and last paragraph of the chapter. Then scan the middle 50% rapidly. Note the "distance" between narrator and subject (formal, intimate, clinical).
  *   **Time Cost:** 5 Minutes.
  *   **Pass:** The tone remains consistent, or shifts only at clear section breaks.
  *   **Fail:** Sudden, unexplained shifts in register (e.g., from academic to slang, or from intimate memoir to detached report) within a single paragraph.
  *   **Evidential Logic:** **Asymmetric.** A Fail suggests the engine is switching modes/models mid-stream. A Pass is expected even in low-quality MT.
  *   **Conclusion on Fail:** The narrative voice is fragmented.

  ---

  ## Part II: Decision Rules & Economics

  We operate under the constraint that a **False Alarm** (unnecessary re-translation) costs **€600 + 3 Days**, while a **Miss** (published error) costs **Reputation + Apology**. We prioritize avoiding public embarrassment, but cannot afford to re-translate every chapter.

  **Scoring:**
  *   **Critical Fail:** Probe 1 (Entity) or Probe 2 (Causal) failure involving safety, identity, or core argument.
  *   **Minor Fail:** Probe 3 (Deictic), Probe 5 (Register), or isolated Probe 1/2 slips that are locally fixable.

  **Thresholds:**
  1.  **Local Patch (Proceed):** 0 Critical Fails AND ≤ 1 Minor Fail.
      *   *Action:* Post-editor corrects the specific instances. Sign off.
  2.  **Escalation (Senior Review):** 2+ Minor Fails OR 1 Critical Fail (ambiguous).
      *   *Action:* Send to Senior Editor/Bilingual Lead. Cost: ~3 hours internal time.
      *   *Logic:* The pattern suggests systemic drift, but might be fixable with heavy human intervention.
  3.  **Rejection (Re-translate):** 2+ Critical Fails OR 1 Critical Fail (Safety/Legal/Identity) confirmed.
      *   *Action:* Commission human translation. Cost: €600 + 3 Days.
      *   *Logic:* The "mental movie" is absent. Patching will cost more than re-translating.

  **Monolingual Adjustment:** If the editor is Monolingual (skipped Probe 4), the threshold for Escalation lowers: 1 Minor Fail triggers Escalation rather than Patch. This accounts for the higher risk of undetected source drift.

  ---

  ## Part III: Candid Reflections

  ### 1. Hofstadter Compression
  We have dropped Hofstadter's demand for "recreating the soul" of the text. We cannot test for soul in 25 minutes. We are testing for **Consistency as a Proxy for Understanding**.
  *   **The Distortion:** We assume that if the text *behaves* as if it understands the world (consistent entities, logic, space), it is safe to publish.
  *   **The Truth:** This is a "Cheap Proxy." An engine can maintain consistency without comprehension (stochastic parroting with memory). A Pass is *not* evidence of understanding; it is merely the absence of detectable incoherence. We are betting that incoherence is the primary failure mode of current MT in narrative non-fiction.

  ### 2. Contamination & Model Adaptation
  Our vendors' models are trained on public corpora, which increasingly include QA guidelines and "adversarial" examples.
  *   **Hollow Probes:** Probe 1 (Entity Ledger) is most at risk. Models are getting better at long-window attention and can maintain gender consistency over short chapters without "knowing" the gender.
  *   **Rotation:** Every 3 months, rotate the focus. One month, emphasize Probe 2 (Logic). Next, emphasize Probe 3 (Deixis). Do not announce the rotation to the post-editors in advance to prevent them from optimizing their own checking behavior over actual reading.
  *   **Counter-measure:** If a chapter passes all probes but "feels" dead, trust the feeling. The protocol cannot measure "deadness," only "brokenness."

  ### 3. Unavoidable Judgment (The Protocol Blind Spots)
  *   **Deliberate Ambiguity:** Literary non-fiction often uses unresolved pronouns or shifting perspectives for effect. The SCB will flag this as a **Fail** (Probe 1 & 3).
  *   **Voice & Register:** An author may shift register intentionally to signal psychological fracture. The SCB will flag this as a **Fail** (Probe 5).
  *   **Instruction:** If the post-editor suspects the "error" is stylistic, they *must* Escalate. Do not Patch. The protocol is biased toward coherence; it is hostile to avant-garde or complex narrative structures.

  ---

  ## Part IV: Case Study Simulations

  ### Case (a): The Misgendered Memoir
  *   **Text:** Memoir chapter. Narrator's brother referred to as "she/her" on pages 2–3, "he/him" on page 4. Sentences are fluent.
  *   **SCB Result:** **Probe 1 (Entity Ledger) → Critical Fail.**
  *   **Protocol Action:** **Rejection.**
  *   **Analysis:** The protocol works as intended. The inconsistency proves the engine has no model of the person. Even if the editor cannot read the source, the internal contradiction is sufficient evidence to reject. The cost of €600 is justified against the cost of apologizing to the author's family.

  ### Case (b): The Vertiginous Literary Chapter
  *   **Text:** Intentional narrative fragmentation. Pronouns shift to reflect the narrator's dissociation. Logic is non-linear.
  *   **SCB Result:** **Probe 1 (Entity) → Fail. Probe 2 (Causal) → Fail. Probe 5 (Register) → Fail.**
  *   **Protocol Action:** **Rejection.**
  *   **Analysis:** **The Protocol Returns the Answer I Will Not Like.** The SCB is designed to detect *noise*, but it cannot distinguish *noise* from *signal* in high-literary text. It will condemn excellent, complex writing as "broken."
  *   **Override:** This requires a **Human Override** at the Escalation stage. The Senior Editor must recognize the genre. *Instruction:* If the author is known for experimental style, bypass SCB and route directly to Senior Editor. Do not let a junior post-editor reject a deliberate artistic choice.

  ### Case (c): The Plausible Hallucination
  *   **Text:** Popular science. "The enzyme reacts at 40°C." (Source said 140°C). The sentence is grammatically perfect, logically consistent with the surrounding paragraph, and fits the entity model.
  *   **SCB Result:** **Pass (All Probes).**
  *   **Protocol Action:** **Sign Off.**
  *   **Analysis:** **The Protocol Cannot Catch This.** The SCB tests internal coherence, not external truth. We are testing the *translation*, not the *facts*.
  *   **Mitigation:** This is a risk we must accept. No 25-minute QA protocol can fact-check scientific claims without subject matter expertise. This risk is inherent to the "Monolingual Post-Edit" model.

  ---

  ## Part V: Limitations & Potential Harms

  **What the Procedure Cannot Do:**
  1.  **Verify Truth:** It cannot distinguish a fluent lie from a fluent truth (Case C).
  2.  **Measure Aesthetic Quality:** It cannot detect "blandness." It will pass a sterile, soulless translation as long as it is consistent.
  3.  **Protect Style:** It actively penalizes complex, ambiguous, or experimental prose (Case B).

  **Where It Makes Post-Editors Worse:**
  1.  **Deskilling:** By reducing reading to "probing," editors may stop reading for meaning and start reading for errors. They become auditors, not readers.
  2.  **False Security:** A "Pass" on the SCB creates a psychological license to ignore intuition. Editors may sign off on text that "feels" wrong because the checklist says it's fine.
  3.  **Adversarial Relationship:** Editors may begin to view the text as an enemy to be trapped rather than a manuscript to be polished.

  **Final Instruction:**
  The SCB is a **safety net**, not a **seal of approval**. It is designed to catch the catastrophic failures of machine translation (the "unmoored" text). It is not designed to certify quality. If a post-editor reads a chapter that passes all probes but leaves them cold, they are licensed to Escalate on the grounds of "Quality/Voice," even if the checklist is clean. The checklist manages risk; the human manages value.
