  They want a specific JSON format first, then prose reasoning.

  Let me analyze their verdicts:

  **IN cases:**
  - C1: Paper notebook (authored, constant use, automatic trust)
  - C2: Phone calendar (even more automatic than C1)

  **OUT cases:**
  - C3: Partner's memory (uneasy about this)
  - C4: Paid assistant (firm out)
  - C5: Language model (out)
  - C6: Chess engine (out - no prior endorsement)
  - C8: Calculator (out - performs work I couldn't do internally)
  - C9: Lifelogging pendant (out - checked before acting)
  - C10: Grandmother's recipe book (uncertain/oscillating)

  **C7:** Notebook is part of mind, but forged content is not belief (interesting distinction)

  **Their tentative principle:**
  (a) substitutes for internal process
  (b) carries contents I authored/endorsed at storage
  (c) constant availability, automatic retrieval, default trust

  **Tensions to address:**
  1. C1/C2 (IN) vs C3/C4 (OUT) - What makes another person's memory different from a notebook?
  2. C2 (IN) vs C5/C6 (OUT) - Calendar notifies unprompted vs. AI/chess engine recommendations

  Let me think about what principle could capture these verdicts:


  - **Authorship/Endorsement at encoding** seems crucial (distinguishes C1/C2 from C3/C4/C5/C6)
  - **Integration into cognitive routines** (distinguishes C1/C2 from C9)
  - **Substitution vs. supplementation** (C8 is out because it does what I can't do)

  For C3 vs C4, the user feels C3 is out for a "weightier reason" - perhaps because another mind has its own agency/interests that could diverge from mine, whereas C4 is just a tool. But both are OUT.

  For C7, they want to say the notebook is part of the mind but the forged entry isn't a belief - this requires distinguishing the vehicle from the content.

  I'll develop three candidate principles:

  **P1 (Endorsement at Encoding):** External resource is part of mind when I authored or consciously endorsed content at time of storage, it's constantly available, and I retrieve it automatically without verification.

  **P2 (Functional Integration + Agency Boundary):** External resource is part of mind when it performs cognitive work I could do internally, is integrated into my routines with default trust, AND the resource itself lacks independent agency that could diverge from my interests.

  **P3 (Cognitive Ownership):** External resource is part of mind when I maintain ongoing control over what enters it, it functions as my default for certain cognitive tasks, and I would feel diminished rather than merely inconvenienced without it.

  Now checking against the cases: C1 and C2 fit all three principles well. C3 and C4 fail P1 (no encoding endorsement) and P2 (independent agency). C5 and C6 fail P1 (no prior endorsement of outputs). C7 works - the notebook qualifies but the forged entry doesn't count as my belief since I didn't endorse it. C8 fails P1 (calculator does what I can't do internally). C9 fails P3 (I verify before acting, so not default trust). C10 is tricky - I endorse using it but didn't author the content.

  For the new cases: N1 (shared spreadsheet) would be OUT under P1 since I didn't author others' entries. N2 (auto-summary) is borderline - I endorse on reading but didn't author. N3 (dementia diary) is problematic - she can't parse her own handwriting anymore, so the endorsement condition breaks down.

  The tutor's objection about emptiness vs. boundary-smuggling is real. I need to show my principles aren't just "whatever you trust" (empty) and don't secretly rely on skull boundaries (smuggling). The agency boundary in P2 helps here - it's not about location but about whether the resource has independent goals.

  For a single sentence, I'd need to sacrifice something. C10 is probably the cheapest - the recipe book case is already unstable in their intuitions.

  Let me structure the JSON carefully with all required fields.
