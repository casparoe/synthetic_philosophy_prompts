      *   *Why it looked innocent:* Because we conflate the *name* of a property with the *cost of encoding the state of the system* using that property. "Doorknob-or-3-mod-7" is a short string. But to describe the *world* using it, I have to list every instance. If the instances are scattered (atoms congruent to 3 mod 7), the list is as long as the bit-map.
