answer: |-
  Here are eight questions designed to walk that tightrope. They are phrased in plain English, suitable for a backend engineer talking to a philosopher, with the expected answers, the uncomfortable follow-ups, and flags for potential misunderstandings.

  ### 1. The Probability Threshold (Swing vs. Safe)
  **The Question:** "In engineering, we deal with thresholds all the time. A system triggers when a metric hits a certain number. If my moral duty to vote depends on the chance of my vote actually changing the outcome, does that duty have a threshold? Because if it does, it implies I have a much stronger moral obligation if I live in a swing district than if I live in a safe one. Is that a bug in the theory, or a feature?"

  **Expected Answer:** She will likely say it's not a binary switch but a sliding scale based on "expected value." She might argue the duty exists regardless of probability because the *stakes* are so high that even a tiny probability creates a moral obligation.

  **The Follow-up:** "If it's a sliding scale, then morally, I'm doing something *better* by voting in Georgia than by voting in California. But most people feel the duty to vote is about being a good citizen everywhere, not just where the math works out. If the duty gets weaker in safe districts, doesn't that turn voting into a calculation of leverage rather than a moral obligation?"

  **Flag:** ⚠️ **High Risk.** She might argue you *have* misunderstood the view. Many philosophers in this camp argue the duty is *not* consequentialist (based on outcomes) but based on fairness or complicity, in which case the probability doesn't matter at all. If she says, "I'm not arguing from probability," this line of questioning might miss her actual point.

  ### 2. The "Imperfect Duty" Escape Hatch
  **The Question:** "Philosophers sometimes talk about duties that are flexible—like I have a duty to be charitable, but I don't have to give away every single dollar. Is the duty to vote like that? Because if it's a strict duty, it seems like I'm morally failing if I skip a local school board election. But if it is flexible, how do I know when I've done enough? Does calling it 'flexible' just hide the problem?"

  **Expected Answer:** She will likely classify it as an "imperfect duty" (flexible) to avoid the absurdity of requiring you to vote in every single election. She'll say you need to vote *often enough* to do your part.

  **The Follow-up:** "If it's flexible, then the rule isn't 'You must vote.' The rule is 'You must vote... sometimes.' But if I skip this election because I voted last time, and my neighbor skips it because he'll vote next time, we both stayed home. Who actually fulfilled the duty? Doesn't 'flexible' just give us all permission to free-ride on the assumption that someone else will do it?"

  ### 3. Expressive Payoffs vs. Saving Lives
  **The Question:** "Some people say voting is about expressing who you are or signaling your values, which feels good. But in your shallow pond analogy, the point is saving the kid, not feeling like a hero. If I vote just to feel counted or to signal my values, does that actually satisfy the moral duty? Or is that just a rationalization, since expressing myself doesn't rescue anyone from the pond?"

  **Expected Answer:** She will likely distinguish between "expressive voting" (doing it for self-image) and "instrumental voting" (doing it for outcomes). She will argue the moral duty requires the instrumental intent.

  **The Follow-up:** "But if the instrumental intent is what matters, and my vote almost certainly won't change the outcome, then I *can't* actually rescue anyone from the pond. So if I can't rescue them, but I vote anyway to feel like I tried, haven't I just turned the ballot box into a place where I signal my virtue rather than a place where I actually prevent harm?"

  ### 4. The Badly Informed Voter
  **The Question:** "Let's say I'm really busy and I haven't read any policies. My vote is basically a coin flip. In the shallow pond scenario, if I try to save the kid but I don't know how to swim, I might drown them both. Does your view imply that if I'm too uninformed, I actually have a moral duty to *abstain*, because a random vote could make things worse?"

  **Expected Answer:** She will likely argue that there is a secondary duty to be informed. She might say you have a duty to vote *well*, not just vote.

  **The Follow-up:** "Okay, but learning takes time. If the cost of becoming informed is high, and the chance of my vote mattering is low, doesn't the math break? If I have to spend ten hours researching to avoid being harmful, that's no longer a 'shallow pond' low cost. So does the duty to vote disappear for anyone who can't afford the time to research?"

  ### 5. The Expected Value Math
  **The Question:** "I'm used to thinking in terms of risk multiplied by impact. If the chance of my vote deciding the election is one in a million, the harm prevented by the 'better' candidate has to be a million times worse than the cost of me voting to make it worth it. Are we actually claiming the difference between candidates is *that* massive? Because that's a huge number."

  **Expected Answer:** She will argue that the difference between candidates *is* massive (e.g., lives lost in war, climate change impacts) and that even a tiny probability multiplied by millions of lives yields a high expected value.

  **The Follow-up:** "If that's the case, then voting becomes the *only* thing that matters. If the expected value is that high, shouldn't I be ignoring my job, my family, and my hobbies to focus entirely on maximizing that vote? If I don't do that, doesn't it mean I don't actually believe the stakes are that high?"

  ### 6. The Collective Action Problem
  **The Question:** "The shallow pond analogy works because it's just me and the kid. Voting is me plus millions of others. If I walk past the pond, the kid definitely drowns. If I stay home, the election usually proceeds without me. Does the analogy break because voting is a collective action? Why am I responsible for the group's outcome if I didn't change the group's result?"

  **Expected Answer:** She will likely use a "complicity" argument. She'll say that by not voting, you are benefiting from the labor of others without contributing your share, which is unfair, regardless of the outcome.

  **The Follow-up:** "But if the argument is about fairness to other voters, that's different than saving the kid in the pond. That makes the duty about *not being a jerk to my neighbors*, not about *saving the people the policies affect.' Can you hold both? Because if I'm honest, I care more about the policies than I do about whether I pulled my weight for my neighbors."

  ### 7. Opportunity Cost (The Effective Altruism Angle)
  **The Question:** "The shallow pond argument is usually used to say we should donate money to save lives. If I take the hour I spend voting—including travel and waiting—and instead use it to volunteer or donate, I might actually save a life for sure. Doesn't the shallow pond argument actually prove I should *skip* voting and go do something where my impact is guaranteed?"

  **Expected Answer:** She will likely argue that voting is a "baseline" duty that doesn't preclude other good deeds, or that political change scales in a way individual charity doesn't.

  **The Follow-up:** "But resources are finite. If I have one hour of moral energy, and voting has a near-zero chance of impact, but charity has a 100% chance of impact, isn't voting the selfish option? It feels like I'm voting to keep my own conscience clean rather than to actually do the most good possible."

  ### 8. Moral Luck and Failure
  **The Question:** "If I vote, and the candidate I think is 'morally necessary' loses anyway, did I fail my duty? In the pond, if I jump in and the kid drowns, I tried but failed. But with voting, if the bad outcome happens, my vote was causally useless. Do I have a duty to try, or a duty to succeed?"

  **Expected Answer:** She will argue it is a duty to try (a duty of process), not a duty to succeed (a duty of outcome). You are responsible for your contribution, not the aggregate result.

  **The Follow-up:** "If it's only a duty to try, then the 'stakes are enormous' part of your argument doesn't really do the heavy lifting. If I'm not responsible for the outcome, why does the outcome matter for my duty? It feels like you're using the high stakes to scare me into voting, but then telling me I'm not responsible for the stakes when the results come in."
