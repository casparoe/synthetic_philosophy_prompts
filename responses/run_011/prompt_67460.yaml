  **1. Vignettes**

  1.  Dr. A accuses Dr. B of fabricating survey results to secure funding. Internal audit reveals Dr. A fabricated similar survey results in a separate grant submitted just last month, though no external complaint was filed at that time. The conduct is identical in method and recency, suggesting equal fault.
  2.  Dr. C accuses Dr. D of excluding junior collaborators from authorship on a recent paper. Dr. C was a senior co-author on that specific paper and explicitly signed off on the final contributor list before submission, aware of the exclusions. C participated in the act now contested.
  3.  Dr. E accuses Dr. F of hostile conduct during fieldwork. Five years ago, Dr. E was formally sanctioned for similar conduct, issued a public apology, completed remediation, and has had no reported incidents since. The prior matter is closed, acknowledged, and resolved.
  4.  Dr. G accuses Dr. H of monopolizing shared equipment. Dr. G has never monopolized equipment but is known to maintain a private log of peers' procedural errors to use in future resource negotiations. G's hands are clean, but motives are questioned as strategic scoring.
  5.  The Alpha Institute files a formal complaint against Beta Lab regarding safety protocol breaches. Three senior Alpha members witnessed the breaches during a site visit but remained silent until this formal filing triggered an investigation. The entity speaks, but its agents were present and silent.

  **2. The Questions**

  1.  Addressed to Panel: Compare the specific actions taken by the complainant previously against the actions taken by the respondent now. Do they match in method and severity? Options: Yes, exact match in method and severity; No, distinct acts or severity levels; Partially, similar method but different severity.
  2.  Addressed to Panel: Determine if the complainant was involved in the specific incident currently being discussed. Did the complainant participate in the episode now under review? Options: Yes, active participant in the episode; No, external observer only; Unclear, records incomplete or ambiguous.
  3.  Addressed to Panel: Assess the timeline and resolution status of the complainant's prior conduct. Is the complainant's prior conduct older than five years and formally resolved? Options: Yes, closed matter with resolution; No, recent or still open; N/A, no prior conduct exists.
  4.  Addressed to Respondent: Clarify whether the objection depends on the comparative weight of the actions. Does the objection rely on the complainant having done something worse than the respondent? Options: Yes, gravity differs significantly; No, gravity appears equal; Not applicable to this objection.
  5.  Addressed to Respondent: Clarify whether the objection depends on the equality of the actions. Does the objection rely on the complainant having done something equally serious? Options: Yes, equal fault asserted; No, lesser fault asserted; Not applicable to this objection.
  6.  Addressed to Complainant: Distinguish between internal states and external communications. Is the complaint about what the respondent believes internally or what they said publicly? Options: Internal Belief only; Public Statement only; Both equally relevant.
  7.  Addressed to Panel: Identify the nature of the entity raising the concern. Is the complainant acting as an individual or as an agent of a larger body? Options: Individual actor; Organization representative; Mixed role or unclear.
  8.  Addressed to Panel: If an organization, assess the knowledge of its members. If an organization, did members of that organization witness the conduct without reporting it? Options: Yes, witnessed and remained silent; No, unaware of conduct; N/A, individual complainant.
  9.  Addressed to Respondent: Test the validity of the complaint independent of the source. Would you accept this complaint if filed by someone with no prior conduct issues? Options: Yes, valid regardless of source; No, invalid regardless of source; Unsure, depends on context.
  10. Addressed to Complainant: Clarify the intended outcome of this process. Do you intend to use the outcome to adjust future behavior or to penalize past behavior? Options: Adjust Future conduct; Penalize Past conduct; Both equally intended.
  11. Addressed to Panel: Assess the consistency of the complainant's enforcement history. Does the complainant's history suggest a pattern of selective enforcement? Options: Yes, strategic selection evident; No, consistent application; Unclear, insufficient data available.

  **3. The Tree**

  Start at Node 1 (Question 2).
  Path 1A: Yes (Participant) → Terminate at Leaf 1.
  Path 1B: No (Observer) → Go to Node 2 (Question 1).
  Path 2A: Yes (Exact Match) → Terminate at Leaf 2.
  Path 2B: No/Partial → Go to Node 3 (Question 3).
  Path 3A: Yes (Old/Resolved) → Go to Node 9 (Question 10).
  Path 3B: No (Recent/Open) → Go to Node 4 (Question 7).
  Path 4A: Yes (Org) → Go to Node 5 (Question 8).
  Path 4B: No (Individual) → Go to Node 6 (Question 11).
  Path 5A: Yes (Silent) → Terminate at Leaf 4.
  Path 5B: No (Unaware) → Go to Node 6 (Question 11).
  Path 6A: Yes (Selective) → Terminate at Leaf 5.
  Path 6B: No (Consistent) → Go to Node 7 (Question 6).
  Path 7A: Public → Go to Node 8 (Question 9).
  Path 7B: Private → Terminate at Leaf 8.
  Path 8A: Yes (Valid) → Terminate at Leaf 6.
  Path 8B: No (Invalid) → Terminate at Leaf 7.
  Path 9A: Adjust Future → Terminate at Leaf 3.
  Path 9B: Penalize Past → Terminate at Leaf 9.

  **4. The Leaves**

  1.  **The Complicit Co-Author.** You must admit you approved the very action you now contest, making your objection a reversal of your own prior judgment and compromising your credibility entirely.
  2.  **The Exact Mirror.** You must accept that your identical recent action invalidates your current claim, rendering the process a mutual accusation rather than a correction of conduct.
  3.  **The Rehabilitated.** You must acknowledge that past errors, once resolved, do not forfeit future voice, separating the person from the permanent record and allowing growth.
  4.  **The Silent Witness.** You must concede that your organization's prior silence undermines its current outcry, suggesting the complaint is tactical rather than principled and timely.
  5.  **The Scorekeeper.** You must reveal that your primary goal is leverage rather than correction, indicating the process is being used as a weapon for future negotiations.
  6.  **The Public Norm.** You must defend the rule even if you dislike the person enforcing it, prioritizing the standard over the messenger and ensuring consistency.
  7.  **The Invalid Source.** You must accept that some truths cannot be spoken by certain people, implying the message depends entirely on the messenger rather than the facts.
  8.  **The Mind Reader.** You must argue that internal thoughts are subject to external policing, extending accountability beyond observable action into private belief.
  9.  **The Retributor.** You must state that your goal is punishment for past acts rather than safety for future ones, shifting the focus from protection to penalty.

  **5. Unoccupied Cells**

  The tree structure inevitably leaves some answer combinations unmapped. Three specific combinations illustrate the boundaries of this instrument.

  1.  **Participant + Old/Resolved.** This combination is incoherent because if the complainant participated in the current episode, the status of their past conduct is irrelevant to their current complicity.
  2.  **Individual + Silent Members.** This combination is incoherent because individuals cannot have members who remained silent, contradicting the definition of the complainant established in Question 7.
  3.  **Public Statement + Invalid Source.** This combination is unattractive because it suggests public rules depend on private history, creating a system where facts are secondary to the speaker's record and undermining objective standards.

  **6. What this instrument cannot separate**

  Leaves 6 (Public Norm) and 5 (Scorekeeper) both involve valid complaints, but differ in motive. The instrument does not distinguish between a desire for correction and a desire for punishment. To separate them, we would need to ask: "Do you seek penalty or change?" This is difficult because respondents may lie, and asking it explicitly may discourage legitimate reporting by forcing a declaration of hostility. Furthermore, distinguishing correction from penalty is often impossible in practice, as enforcement inherently involves both, making the question theoretically clean but practically unworkable.

  **7. Two worked runs**

  **Institute Vignette:** The path begins at Node 1, answering No to direct participation. It proceeds to Node 4, identifying the complainant as an Organization. At Node 5, the answer is Yes regarding silent members. The path terminates at Leaf 4. This is satisfying because it highlights the organizational delay without dismissing the safety claim, focusing on the timing rather than the facts. It forces the Institute to explain the delay.

  **Years-Ago Vignette:** The path begins at Node 1, answering No to participation. It proceeds to Node 2, finding no exact match in recent conduct. At Node 3, the answer is Yes regarding old resolution. It moves to Node 9, selecting Adjust Future. The path terminates at Leaf 3. This is satisfying because it validates the complaint while acknowledging the past is closed, preventing the respondent from reopening settled matters. It protects the complainant's right to speak.
