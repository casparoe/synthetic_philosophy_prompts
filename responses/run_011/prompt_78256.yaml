  **Justifications**

  7. This instrument targets the twenty corporate operations that account for something on the order of three quarters of total lift, making coordination feasible despite the lack of universal metering.
  9. This instrument directly addresses the disagreement about who pays by externalizing costs, rather than relying on contested user contributions.
  10. This option bypasses the political expense and slowness of state board regulation by physically augmenting the resource rather than restricting users.
  5. The concentration of lift among twenty corporate operations lowers transaction costs, though the downstream wetland has no owner, no users, and no voice in any existing institution.
  8. This leverages the fact that everyone accepts the association's hydrological data as accurate, though cheap concealment limits behavioral impact without sanctions.
  1. This fails because the voluntary association has no enforcement powers to implement graduated sanctions against cheap concealment.
  6. This risks crossing the threshold because a full judicial adjudication would take the better part of a decade to bind participants.
  2. This is unlikely to succeed because the disagreement is about the discount rate and who pays, making mutually agreed coercion politically unattainable.
  3. This instrument requires metering to tax extraction, which is stated as not realistically obtainable in the near term.
  4. This instrument requires metering to enforce permits, which is stated as not realistically obtainable in the near term.

  **(a)** A textbook treatment typically ranks Pigouvian charges and tradable permits highest because they efficiently price the externality, but the case feature that "no metering and no telemetry... is realistically obtainable in the near term" demotes these instruments to the bottom because their enforcement base is missing.

  **(b)** The case vindicates the assurance contract (7) against the common objection that voluntary agreements fail due to free-riding, because the fact that "twenty corporate operations account for something on the order of three quarters of total lift" makes coordination among the vital few feasible; conversely, the Pigouvian charge (3) is shown to be aimed at the wrong failure, as it seeks to correct price signals when the binding constraint is the physical impossibility of measuring extraction.

  **(c)** The placement of supply-side substitution (10) is contestable because the case does not state the cost or availability of imported water in a semi-arid basin, and the placement of judicial adjudication (6) is contestable because the case does not specify the current rate of drawdown relative to the decade required for judgment.
