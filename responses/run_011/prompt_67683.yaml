answer: |-
  ### 1. Mapping the Stances on Hans

  **Physical Stance:**
  *   **Description:** A biomechanical account of equine musculature, neural pathways, and sensory inputs (visual/auditory) triggering motor outputs (hoof taps).
  *   **Prediction:** Given specific sensory stimuli and physiological states, the leg moves.
  *   **Cost:** Prohibitive. Requires exhaustive knowledge of the horse's neurophysiology and the precise physical micro-movements of the questioner.
  *   **Leverage:** Zero regarding "arithmetic." It predicts movement, not semantic correctness.

  **Design Stance:**
  *   **Description:** Hans is a system designed (by evolution and training) to detect involuntary postural release in human interlocutors and terminate tapping upon detection.
  *   **Prediction:** Hans will tap correctly iff the questioner knows the answer and is visible. Hans will fail if the questioner is ignorant or obscured.
  *   **Cost:** Moderate. Requires identifying the specific cueing mechanism (tension/release) and the training history.
  *   **Leverage:** High. It predicts both success and the specific conditions of failure (the Pfungst variables).

  **Intentional Stance:**
  *   **Description:** Hans believes that *n* taps corresponds to number *n*, desires to please the questioner, and perceives the question posed.
  *   **Prediction:** Hans will tap the correct number corresponding to the arithmetic sum or calendar date queried.
  *   **Cost:** Low. "Hans knows math" is a high-compression description.
  *   **Leverage:** High, but brittle. It predicts success only within the narrow band where the cueing mechanism functions (knowledgeable, visible questioner).

  **Efficiency Analysis:**
  Does the Intentional Stance (IS) earn its keep by being *truer* or just *shorter*? It pays only for being shorter. The Design Stance (DS) description ("Hans detects cue release") is causally complete in a way the IS description ("Hans knows math") is not. The DS predicts the *boundary conditions* of the performance (failure when blindfolded); the IS, taken literally, does not. If Hans "knows math," blindness should not impair calculation. Therefore, the IS is a lossy compression of the DS. It buys predictive leverage only by ignoring the causal mechanism that actually drives the prediction. In Dennett's terms, the IS is a "user illusion" here: it works for the audience (who don't see the cues) but fails the engineering audit. The IS is not "truer"; it is a pragmatic shortcut that collapses when the environmental coupling is perturbed.

  ### 2. The Locus Question

  **Relocating to the Dyad:**
  Moving the belief ascription from the horse to the [Horse + Questioner] dyad saves the predictive pattern but dissolves the agent. If we say "The dyad believes 2+2=4," we preserve the real pattern (the correlation between query and tap) but violate the constraint that intentional systems must be *unified loci of control*. Dennett's framework relies on the system being a "black box" that can be treated as a rational agent. A dyad formed ad hoc for a trick lacks the evolutionary or functional unity to sustain independent intentional ascription. If this move is generally available, *any* feedback loop becomes an intentional agent (a thermostat + human + room is a "temperature-believing system").
  *Constraint:* Dennett implicitly constrains locus to systems with a history of selection (evolutionary or artificial) for maintaining the pattern. The Hans dyad has no such history; it is an ephemeral coupling. Admitting the dyad as the locus concedes that the stance is bookkeeping: it tracks information flow, not internal states.

  **Pfungst's Failed Intervention:**
  Pfungst could correlate cues with answers but could not *force* a wrong answer by deliberately manipulating the cues. This leaves the owner's claim (that Hans has independent arithmetic capacity) technically unrefuted in a strict falsificationist sense, though pragmatically decimated.
  *   **Dennett's Resources:** The framework cannot register the distinction between "unproven" and "refuted" here. Dennett's criterion is purely pragmatic: does the ascription yield predictive leverage? When the questioner is blind, the IS fails to predict. When the questioner is sighted, the IS predicts. The framework treats the owner's continued exhibition as a separate intentional stance taken by the *audience*, not a fact about the horse.
  *   **Silence:** Dennett has no resource to adjudicate the *causal direction* when prediction holds. If the IS predicts successfully (sighted condition), Dennett grants the pattern is real *for that context*. He lacks a criterion to distinguish "real pattern generated by hidden mechanism" from "real pattern generated by posited capacity." The failure to intervene (force a wrong answer) is a causal fact, not a predictive one. Dennett's framework is silent on causal mechanisms once predictive compression is achieved.

  ### 3. Where the Theory Goes Silent

  **The Epistemic Status of the Control:**
  The "Clever Hans Effect" became a methodological control: a standard requirement to isolate subjects from cueing. This is a normative advance in scientific practice derived from an ontological error (the false IS ascription).
  *   **Silence:** Dennett's framework describes *what exists* (real patterns), not *how we secure knowledge* about what exists. It explains why the IS was attractive (compression) and why it was abandoned (predictive failure under variation). It does not explain why the *failure* of the IS generated a lasting *methodological rule*.
  *   **Analysis:** The framework treats the shift from IS to DS as a correction of an error. It does not account for the *productivity* of the error. The discovery that the pattern was mislocated generated a new tool (double-blind testing) that applies to systems where no IS was ever attempted. Dennett's ontology is static; it does not track the dynamic value of debunking. The framework says the IS was "unreal" (or rather, less real than the DS), but it has nothing to say about the *reality of the control* that resulted from that realization. The control is a real pattern of scientific practice, but that is outside the scope of the Three Stances.

  ### 4. Contrast with Deep Blue (1997)

  **The Symmetry:**
  *   **Hans:** Real Pattern (correlation between query and tap), Wrong Locus (ascribed to horse, resided in dyad).
  *   **Deep Blue:** Defensible Locus (the machine is the agent), Pattern Not Real (the move was noise/bug, not strategy).

  **Kasparov's Ascription:**
  *   **Did it pay?** Psychologically, yes. The ascription ("Deep Blue is out-strategizing me") predicted Kasparov's own deterioration. Ontologically, no. The move was random.
  *   **Locus:** The "intelligence" was in Kasparov's projection. The "Design" was in the IBM team (and the bug). The machine was merely the medium.
  *   **Withheld Design Stance:** This is the critical divergence. In Hans, Pfungst *revealed* the DS (the cueing mechanism). In Deep Blue, IBM *withheld* the DS (the logs).
  *   **Difficulty for the Framework:** Deep Blue is harder for Dennett. In Hans, the IS failed under experimental variation (Pfungst's conditions). In Deep Blue, the IS held for Kasparov *during the game* because the DS was inaccessible. Dennett argues that if the IS works, the pattern is real *relative to the ascriber*. But here, the IS worked *because* the ascriber was ignorant of the DS.
  *   **Implication:** This suggests the "reality" of the pattern is dependent on the *informational boundary* between system and ascriber. If the DS is hidden, the IS can "pay" even if it is causally vacuous. Dennett's criterion risks collapsing into subjectivism: the pattern is real for Kasparov, unreal for the IBM engineers. Dennett usually resists this by appealing to the "long run" or "ideal observer," but the framework lacks a mechanism to penalize an IS that works only due to secrecy.

  ### 5. Verdict

  **Classification:**
  The Hans case is an **anomaly the framework can absorb**, but only by weakening the claim of the Intentional Stance to mere instrumentalism. The Deep Blue case, however, falls into a **category the framework never anticipated**: *Intentional Ascriptions sustained by Information Asymmetry.*

  **Required Addition:**
  To handle both episodes, the Real-Patterns criterion must be augmented with a **Counterfactual Stability Constraint**. A pattern is real only if it supports predictions not just under observation, but under *intervention* on the posited internal states.
  *   **Hans:** Intervening on the "belief" (changing the math) doesn't work; intervening on the cue does. IS fails the constraint.
  *   **Deep Blue:** Intervening on the "strategy" (asking for a different move) is impossible because the state was noise. IS fails the constraint.

  **Patch or Insight?**
  This is an **insight**, not a patch. It aligns Dennett's pragmatism with interventionist accounts of causation (e.g., Woodward). Dennett currently defines real patterns by *compression* (description length vs. predictive power). He needs to define them by *leverage* (predictive power under manipulation).
  *   **Judgment:** Without this addition, Dennett's framework cannot distinguish between a system that *has* beliefs and a system that *mirrors* the believer's expectations (Hans) or a system that *generates noise interpreted as signal* (Deep Blue). The current criterion validates the *success of the prediction*, regardless of whether that success is parasitic on the ascriber's psychology or the system's structure. Adding the interventionist constraint preserves the utility of the stances while preventing the reification of artifacts. It concedes that "predictive leverage" is insufficient without "causal leverage."
