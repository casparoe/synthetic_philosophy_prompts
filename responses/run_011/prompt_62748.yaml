prompt: |-
  I am a doctoral researcher in history, and next term I am to give a position statement at an interdisciplinary methods seminar. Rather than survey the literature, I have been asked to set out my own commitments about what historical explanation amounts to, so that the room can attack them directly. What follows is the draft. I should like an audit of it before I present it, not a lecture on the debate.

  My commitments:

  1. The aim of explanation. To explain a historical outcome is to show that it was to be expected, given the antecedent conditions one cites. I take this from the covering-law tradition as Hempel framed it, but I do not think the expectation has to be articulated as an explicit law; what matters is that the account renders the outcome expectable rather than merely recorded.

  2. Singular causation suffices. Many good historical explanations consist in identifying the cause of an event — the mislaid despatch, the cabinet decision of a particular week, the harvest failure in this province and not that one — and I hold that such an identification can be a complete explanation even where no covering law is invoked or known. Whatever law there may be is background, not part of the explanation.

  3. There are no laws of history. No strict laws govern historical processes. The macro-generalisations that historians and historical sociologists deploy — about state capacity, about fiscal crisis and political mobilisation, about frontier closure — are at best ceteris paribus rules whose provisos cannot be specified in advance, and I do not think they are reducible to, or derivable from, lower-level regularities in psychology or economics.

  4. Reasons are causes. Explaining an agent's action by citing their reasons is a species of causal explanation. I see no need for a separate, non-causal relation of rationalisation, and I am not persuaded that deliberation stands outside the ordinary causal order.

  5. Intelligibility. Nevertheless, what makes a rationalising account explanatory in the strong sense, as opposed to merely true, is that it lets one see that what the agent did made sense to them. A purely causal story of the same events, however complete, would not supply that, and I regard what is missing as a loss of explanation rather than a loss of something else.

  6. Narrative is explanatorily load-bearing. A well-constructed narrative cannot be paraphrased into a list of singular causal claims plus generalisations without loss of explanatory content. Order, selection, the decision where the story begins and where it stops, what is foregrounded and what relegated to scene — these are not presentational ornament draped over an argument that could be stated baldly.

  7. Difference-making. A factor explains an outcome only if the outcome depended on it. Conditions present throughout whose absence would have changed nothing are background, not explanans. I want this as a disciplinary check on explanation-by-atmosphere.

  8. Counterfactual history is inadmissible as a method. Historians are right to refuse the counterfactual genre; the subject is what happened, and speculation about what might have is unfalsifiable entertainment. I have been assuming this sits comfortably with 7, on the grounds that one concerns what makes a causal claim true and the other what evidence we may offer for it.

  9. Convergence and particularity. Historical inquiry should aspire to the evidential and inferential standards of the social sciences, and I regard comparative and quantitative work as the progressive core of the discipline. I also hold that what history explains is the non-repeatable configuration, and that generalising methods are structurally unable to capture it. I have been telling people these two are complementary rather than competing.

  10. A case from my own work. My dissertation concerns the withdrawal of a colonial administration from a policy of indirect rule. I maintain both that the governor's decision in a given month explains the withdrawal, and that the outcome was such that many distinct antecedent configurations — a different governor, a differently composed cabinet, a budget crisis arriving two years later — would each have produced the same withdrawal, in much the same shape, within a few years. I have never thought the second claim undermines the first.

  Please go through this set and tell me which pairs of commitments are in genuine tension, ranked by severity rather than listed as equally bad, and which of the tensions I have half-anticipated dissolve on inspection and why. For each genuine tension, state what would have to give and what the cheapest revision would cost me elsewhere in the list. Then tell me which single revision would resolve the most. Two specific questions: is my complementarity defence of 9 adequate, or is it doing covert work to keep something else alive? And in 10, is principle 7 to be abandoned, refined, or is my verdict on the governor's decision to be surrendered?
reasoning: |-
  Here's a thinking process that leads to the audit of the doctoral researcher's position statement:

  1.  **Analyze the Request:**
      *   **User:** Doctoral researcher in history.
      *   **Task:** Audit a draft position statement on historical explanation for an interdisciplinary methods seminar.
      *   **Goal:** Identify genuine tensions between commitments (ranked by severity), distinguish them from apparent tensions that dissolve, propose revisions (cost/benefit), identify the single most effective revision, and answer two specific questions (Commitment 9's complementarity defense and Commitment 10's relationship with Commitment 7).
      *   **Constraint:** Do *not* lecture on the debate. Focus on internal consistency and logical coherence of the provided text.
      *   **Tone:** Professional, rigorous, peer-to-peer (academic audit).

  2.  **Analyze the Commitments (Deconstruction):**
      *   *C1 (Expectability):* Explanation = showing outcome was expected given antecedents (Hempel-lite). No need for explicit laws.
      *   *C2 (Singular Causation):* Singular causes (events/decisions) suffice for complete explanation. Laws are background.
      *   *C3 (No Laws):* No strict laws of history. Macro-generalizations are ceteris paribus with unspecified provisos. Not reducible.
      *   *C4 (Reasons = Causes):* Rationalization is a species of causal explanation. No dualism.
      *   *C5 (Intelligibility):* Rationalizing accounts add "making sense" which pure causal stories miss. This "making sense" is essential to *explanation*.
      *   *C6 (Narrative):* Narrative structure is constitutive of explanation, not just presentation.
      *   *C7 (Difference-Making):* Explanatory factors must be difference-makers (counterfactual dependence). Background conditions aren't explanations.
      *   *C8 (No Counterfactuals):* Counterfactual history as a *method/genre* is inadmissible (unfalsifiable). Compatible with C7 (truth conditions vs. evidence).
      *   *C9 (Convergence/Particularity):* Aspire to social science standards (comp/quant) BUT history explains non-repeatable configurations. Claims they are complementary.
      *   *C10 (Case Study):* Governor's decision explains withdrawal (singular cause), BUT many other configurations would have produced the same outcome (overdetermination/robustness). Claims these are compatible.

  3.  **Identify Tensions (Brainstorming & Pairing):**

      *   *C1 vs. C3:* C1 leans Hempel (expectability usually implies nomological connection). C3 denies laws. *Resolution:* C1 explicitly says "do not think expectation has to be articulated as an explicit law." So this is a stated modification, not a hidden tension.
      *   *C1 vs. C10:* C1 says explain = show expected. C10 says outcome would have happened anyway (different antecedents). If it would have happened anyway, was it "to be expected" *given the specific antecedents cited*? If the specific antecedents (Governor) weren't necessary, does citing them make it "expected" in the right way? This touches on pre-emption/overdetermination.
      *   *C2 vs. C7:* C2 says singular cause suffices. C7 says factor must be difference-making. If the Governor's decision (C10) wasn't a difference-maker (because others would have done it), C7 says it's not an explanation. C2 says it is. *Major Tension.*
      *   *C4 vs. C5:* C4 says Reasons *are* Causes. C5 says Rationalizing adds something ("making sense") that a "purely causal story... would not supply." If Reasons *are* Causes (C4), why does a causal story miss the "making sense" (C5)? This implies a residual dualism or a specific definition of "causal story" in C5 that contradicts C4. *Significant Tension.*
      *   *C7 vs. C8:* C7 relies on counterfactual dependence ("absence would have changed nothing"). C8 bans counterfactuals as method. C8 argues this is about *evidence* vs. *truth*. This is a standard philosophical move (truth conditions vs. epistemic access). It *might* hold, but it's tight.
      *   *C9 (Internal):* "Aspire to social science standards" (generalizing) vs. "explains non-repeatable configuration" (particularizing). C9 claims complementarity. Is it coherent? You can use general methods to explain particular events. This seems manageable but needs scrutiny (see Specific Question 1).
      *   *C10 vs. C7:* (Already noted in C2/C7). C10 explicitly posits a cause (Governor) that C7's definition of difference-making seems to rule out (because the outcome was robust/overdetermined). C10 claims compatibility. This is the crux of the overdetermination problem.

  4.  **Rank Tensions by Severity:**

      1.  **C2/C10 vs. C7 (The Overdetermination Problem):** C7 defines explanation via difference-making (counterfactual dependence). C10 posits a cause (Governor) where the outcome *does not* depend on it (others would have done it). C2 supports C10. This is a direct logical contradiction. If C7 is true, the Governor didn't explain it. If the Governor explains it, C7 is false (or needs major refinement).
      2.  **C4 vs. C5 (The Causal/Rational Gap):** C4 collapses reasons into causes. C5 suggests a "purely causal story" lacks the "making sense" element of rationalization. If reasons *are* causes, a causal story including reasons *should* supply the "making sense." C5 implies "causal story" means "non-rational causal story," which makes C4 trivial or C5 confused.
      3.  **C1 vs. C10 (Expectability vs. Robustness):** C1 says explain = make expected. If the outcome was robust (C10), it was expected *regardless* of the specific antecedent. Does citing the specific antecedent fulfill C1? It makes it expected *ex post*, but C1 implies a connection between *these* antecedents and *that* outcome. If the connection isn't necessary, is the expectation robust? (Less severe than C7, but related).
      4.  **C8 vs. C7 (Epistemic vs. Ontic):** C7 defines explanation via counterfactuals. C8 bans counterfactual reasoning. C8 claims this is just about "method/evidence." But if you can't test the counterfactual, how do you know C7 is satisfied? This is an epistemic access problem, not a logical contradiction, but it weakens the position.

  5.  **Analyze "Dissolving" Tensions:**
      *   *C1 vs. C3:* User explicitly modifies Hempel in C1 ("do not think... explicit law"). C3 supports this ("No strict laws"). This is consistent.
      *   *C9 (General vs. Particular):* This is a standard methodological stance (use general tools for particular ends). It holds if "standards" refers to rigor/evidence, not "finding laws."

  6.  **Develop Revisions/Costs:**
      *   *For C2/C10 vs. C7:* Need to adjust C7 to allow "causal selection" amidst overdetermination, or adjust C10 to admit the Governor was a *trigger* in a necessary chain.
      *   *For C4 vs. C5:* Clarify that "purely causal story" in C5 means "non-intentional causal story."
      *   *For C8 vs. C7:* Acknowledge the epistemic tension.

  7.  **Address Specific Questions:**
      *   *Q1 (C9 Complementarity):* Is it doing covert work? It risks hiding a tension between *explaining* the particular (narrative/singular) and *validating* via the general (quant/comp). If the general can't capture the particular (C9 part 2), how can it be the "progressive core" (C9 part 1)? It risks instrumentalizing the social sciences.
      *   *Q2 (C10 vs. C7):* This is the overdetermination issue. C7 (Difference-making) usually kills C10 (Robustness/Overdetermination). To save C10, C7 must be refined to allow "actual cause" even if not "necessary cause" (e.g., INUS conditions or actual causation vs. type causation).

  8.  **Drafting the Audit (Iterative refinement):**
      *   *Tone Check:* Ensure I'm not lecturing on philosophy of history (e.g., don't start explaining Dray vs. Hempel). Stick to *their* text.
      *   *Structure:*
          1.  Executive Summary (Severe tensions).
          2.  Dissolved Tensions.
          3.  Detailed Analysis of Severe Tensions (Rankings, Revisions, Costs).
          4.  The "Single Revision" recommendation.
          5.  Specific Questions (C9 and C10/C7).

      *   *Refining the C4/C5 tension:* C4 says Reasons = Causes. C5 says Rationalizing adds "making sense" missing from "purely causal story." If Reasons are Causes, then a causal story *including* reasons has the "making sense." So C5's "purely causal story" must mean "bio-physical causal story." If so, C4 and C5 are compatible *if* C5 is read charitably. But the phrasing "I see no need for a separate... relation" (C4) vs "what is missing [from causal story] is a loss of explanation" (C5) suggests the user thinks "causal" usually excludes "rational." This is a terminological risk.
      *   *Refining the C7/C10 tension:* This is the big one. C7 says X explains Y only if ~X -> ~Y. C10 says Governor (X) explains Withdrawal (Y), but ~X -> Y (someone else would have done it). This is a flat contradiction. C10 describes *causal overdetermination* or *robustness*. C7 describes *counterfactual dependence*. They cannot both stand as written.
      *   *Refining C8/C7:* C7 defines truth conditions using counterfactuals. C8 bans the *method* of writing counterfactual history. This is the "ontic vs. epistemic" distinction. It holds, *but* if you ban the method, how do you verify C7? You rely on actual evidence to infer the counterfactual dependence. It's tense but survivable.

      *   *The "Single Revision":* Fixing C7 is the highest leverage. If C7 is softened to allow "actual causation" (process) rather than strict "counterfactual dependence" (necessity), C10 is saved, C2 is saved, and C8 becomes less pressing (since you don't *need* to write counterfactuals to establish actual causation).

      *   *Specific Question 1 (C9):* The tension is between "progressive core" (implies future direction) and "structurally unable to capture it" (implies limitation). If generalizing methods can't capture the object of history, how can they be the core? It suggests they are *tools* for the particular, not *ends* in themselves. The defense is adequate *if* "standards" is distinguished from "methods."
      *   *Specific Question 2 (C10/C7):* C7 must be refined. Abandoning C7 kills the "check on explanation-by-atmosphere." Abandoning C10 kills the dissertation's main claim. Refine C7 to "Difference-making in the actual sequence" or acknowledge "sufficient but not necessary" causes.

  9.  **Final Polish:** Check against constraints. No lectures. Rank tensions. Answer specific questions. Ensure the tone is appropriate for a doctoral audit. (Self-Correction: Make sure not to sound like I'm solving the philosophy for them, but pointing out where *their* system breaks).

      *   *Ranking:*
          1.  C7 vs. C10 (Logical Contradiction on Overdetermination).
          2.  C4 vs. C5 (Ambiguity on "Causal").
          3.  C8 vs. C7 (Epistemic Access).
          4.  C9 (Internal coherence of "Core" vs "Unable to capture").

      *   *Dissolved:* C1 vs C3 (Explicitly handled). C2 vs C3 (Singular causation doesn't need laws).

      *   *Revision:* Modify C7 to accommodate overdetermination (INUS or Actual Causation).

      *   *Specific Q1:* C9 is risky. "Progressive core" vs "Structurally unable."
      *   *Specific Q2:* C7 needs refinement, not abandonment. C10 verdict stands.

  10. **Final Review against constraints:** "Rather than survey the literature... set out my own commitments... audit of it... not a lecture on the debate." Okay, I will avoid name-dropping philosophers (beyond what they did) and focus on the internal logic of the 10 points.

      *(Self-Correction during drafting)*: Wait, C1 says "outcome was to be expected." C10 says "many distinct antecedent configurations... would each have produced the same withdrawal." If the outcome is robust, it *was* expected. But C7 says the *specific factor* must be a difference maker. If the Governor wasn't a difference maker, citing him doesn't make the outcome expected *because of him*. It makes it expected *because of the situation*. C10 claims the Governor explains it. C7 says he doesn't. This confirms C7/C10 is the critical clash.

