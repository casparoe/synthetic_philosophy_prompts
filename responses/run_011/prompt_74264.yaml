answer: |-
  The clock on the conference room wall read 4:00 PM. The report was due at 5:00. Dana's draft lay open on the table, marked up in red ink. Eli's laptop glowed with a spreadsheet.

  "Your section reads like a eulogy for the concept of fairness," Eli said, tapping the paper. "You're telling the legislature that because base rates differ, fairness is logically impossible. That's not a recommendation; it's a surrender."

  "It's a diagnosis," Dana corrected, leaning forward. "Look at the numbers we just verified. Group L, base rate .20. Group H, base rate .40. We set a shared cutoff at .4. Group L gets a false positive rate of .15 and a false negative rate of .60. Group H gets a false positive rate of .47 and a false negative rate of .20. The score is calibrated within each group by construction, yet the error rates diverge wildly. If we try to equalize the false positive rates, the only solutions are degenerate—detain everyone or detain no one. That isn't a bug in the data. It's a theorem."

  Eli shook his head. "It's arithmetic in a tuxedo. You're treating the impossibility result like it's a deep philosophical truth about justice. It's not. It's a constraint on degrees of freedom. You have unequal base rates and you're forcing a single scalar score to do binary work. Of course the algebra breaks. If I build a classifier that just outputs each group's own base rate for every individual, I satisfy calibration and every parity condition simultaneously. The 'impossibility' only exists because you smuggled in an accuracy premise. You want the score to actually distinguish risk within the group."

  "And isn't that the point of a risk score?" Dana shot back. "If we abandon accuracy, we aren't measuring risk. We're just stamping group membership on a file. You say the theorem says nothing until you demand accuracy. I say the demand for accuracy is where the social fact enters. The base rate disparity is exactly the kind of inequality a theory of fairness should be responsive to. The inconsistency gets sharper when you notice it only bites because base rates differ. You're saying 'math says you can't have it all.' I'm saying 'math says our ordinary concept of a fair risk score is internally inconsistent when social reality is unequal.'"

  "So fix the representation," Eli said, typing a quick formula. "Allow group-specific thresholds. If Group H needs a higher cutoff to match Group L's false positive rate, set it. The moment you allow group-specific monotone rescalings, 'impossible' collapses into 'here's a menu, pick one and pay for it.' You pay in disparate treatment to buy parity in error rates. That's a policy choice, not a metaphysical barrier."

  "It's a legal poison pill," Dana said. "If we recommend group-specific thresholds, we're endorsing explicit group consciousness in the decision rule. The commission was tasked with validating the score, not rewriting equal protection doctrine. But more than that: if the impossibility evaporates the instant a legislature permits group-specific thresholds, is it an impossibility about fairness? Or is it about a representation choice we could simply reverse? If the score itself is calibrated, why does the threshold need to bend? Why isn't the score the problem?"

  "Because the score is just a probability estimate," Eli said. "The threshold is the policy. You're conflating the map with the territory."

  "Then the map is misleading us." Dana reached into her folder and pulled out a single sheet of handwritten notes. "I've been toying with a different criterion. Look at this. I call it margin parity."

  Eli leaned in, reading. "Fix the operating cutoff $c$ and a width $\delta$. Compute FPR and FNR using only the people whose score falls inside $[c-\delta, c+\delta]$. Require those restricted rates to match across groups."

  "The decision is only genuinely contestable at the margins," Dana argued, her voice gaining speed. "Someone sitting at a score of .9 or .05 gets the same treatment however we argue. The harm happens to the person at .39 when the cutoff is .4. Maybe fairness constraints only need to bite where the uncertainty is highest. If we equalize error rates locally, around the decision boundary, we protect the people actually affected by the toggle."

  Eli paused, pen hovering over his notepad. He wasn't sneering. "It's clever. It isolates the marginal cost of classification. But does it escape the impossibility?"

  "Let's work it out," Dana said. "In our toy population, look at the cutoff .4. For Group L, the margin includes the score .2 and .4 buckets. For Group H, it includes .4 and .6. If we set $\delta$ small enough to isolate the .4 bucket..."

  "Then you're comparing people with score .4 in Group L against people with score .4 in Group H," Eli interrupted. "In Group L, score .4 has 20 people, 8 positives. Risk is .40. In Group H, score .4 has 30 people, 12 positives. Risk is .40. They're calibrated. So within that exact slice, the positive rates are identical."

  "Exactly," Dana said. "So margin parity holds trivially if the score is calibrated and we look at a single point."

  "But expand the margin," Eli countered. "Take $\delta$ large enough to include .2 for Group L and .6 for Group H. Now you're mixing buckets. Group L's margin includes low-risk .2s. Group H's margin includes high-risk .6s. The base rates within the margin will diverge unless the score distributions are identical shapes. They aren't. Group H is skewed higher. So the local base rates in the margin will differ. Once they differ, you're back to the original impossibility. You haven't escaped the algebra; you've just restated the impossibility over a smaller set."

  "Unless," Dana said, "we admit that the margin is the only place the state's coercive power is truly discretionary. If we satisfy parity there, have we bought a decision procedure by endorsing precisely the group-consciousness the report was commissioned to avoid? We're tuning $\delta$ to find a region where the groups look similar enough to behave."

  "We're tuning $\delta$ to find where the score actually means the same thing," Eli corrected. "If the score distributions differ, a .4 in Group L might not carry the same evidentiary weight as a .4 in Group H regarding the underlying causal mechanisms, even if the calibration holds. But look, Dana, if margin parity works, it works because you've restricted the population to a subset where the base rates happen to align. That's not a general solution. It's a local ceasefire."

  "So it's not an escape," Dana said, sitting back. "It's a triage protocol."

  "It's a acknowledgment that fairness is a constraint on the decision, not the model," Eli said. "But you still have to write the conclusion. Do we tell them the score is fair because it's calibrated, or unfair because it fails parity?"

  "We tell them the concepts are incompatible," Dana said. "That's the truth."

  "We tell them the constraints are incompatible given the accuracy requirement," Eli said. "That's the engineering spec."

  They sat in silence for a moment, the hum of the projector filling the room. Dana picked up her pen. Eli opened a fresh document. They typed simultaneously under the bold heading: **points on which the commission is not agreed.**

  Dana wrote: *The commission disagrees on whether the mathematical inconsistency of fairness metrics reveals a fundamental flaw in our concept of justice under inequality or merely a technical constraint on binary classification.*

  Eli wrote: *The commission disagrees on whether the impossibility of simultaneous parity conditions constitutes a substantive barrier to policy or simply a signal that accuracy and error-rate balance cannot be jointly optimized without group-specific thresholds.*

  They looked at each other. Neither sentence matched. Neither sentence lied.

  "Submit it," Eli said.

  "Submit it," Dana agreed.
