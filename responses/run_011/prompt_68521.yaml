prompt: |-
  My father died in March, and the settling of his estate has put me in a role I did not apply for. He was the last of his generation. What he leaves — the house, nine hundred acres of river bottom that has been in the family since 1946, and the proceeds from the sale of the equipment business — comes to roughly nine million dollars, divided equally among my brother, my sister, and me. Our lawyer tells me the estate falls under the federal exemption and that our state imposes no transfer tax of its own, so there is no tax bill forcing the issue. The question is entirely ours to answer, and I have found that it presents itself about once a month: a relative in trouble, a scholarship someone wants named, a structure an adviser wants us to sign, a child approaching an expensive threshold.

  Since the funeral I have been reading political philosophy I would not have opened two years ago — enough to know the terrain has factions, and not enough to name them reliably, so please do not make me do the naming. I do not want a survey of positions on inherited wealth. I want a procedure.

  Here is the rule I have been trying to defend to my own children, and I want it turned into something I can run: family money may be used to remove bad luck, but not to buy rank. A transfer that makes a life better in a way that would still be worth having if everyone's life were equally good is permitted; a transfer whose value depends on other people not receiving the same thing is not. I suspect the line leaks in both directions — nearly everything a family buys for a child is partly about rank, and nearly every rescue of someone from misfortune also moves them up a queue — and I want a candid account of where it leaks and what a workable version of it would have to say instead.

  Please deliver the following.

  1. The questions to ask of any proposed use of the money, in order, with what counts as a sufficient answer to each and where the procedure simply stops at no. I want tests for the rank-versus-level distinction that a person with no economics can apply out loud: something like asking whether the benefit would survive being given to everyone in the pool at once, whether what is being bought is a fixed number of slots, whether the transfer exempts someone from a check or a wait that applies to others, and whether the same sum given to a stranger would do comparable good. Tell me which of these actually discriminate and which are decoration.

  2. An adversarial step. Every transfer can be described as removing bad luck if you are the one describing it, and I do not trust myself. Build in a requirement to state the strongest case that the proposal is about rank, and say what has to be true for that case to fail.

  3. How the procedure handles the floor. It cannot tell me how much my children may receive before the question becomes one of rank by definition; tell me where that number has to come from, what constraints it must satisfy to be consistent with the rest of the procedure, and every other point where the decision is genuinely mine rather than derivable.

  4. Two objections it must absorb rather than wave away: my brother's, that unilateral restraint is pointless when no other family is restraining itself and our money will simply be replaced in the competition by someone else's; and the sharper one I have come to fear myself, that a family doing this privately buys a clear conscience at the price of never supporting the public version — taxes, school funding, anything that binds the other families too. Say whether that defect can be fixed from inside the procedure, and if it can, how.

  5. Worked runs on four live proposals: one hundred eighty thousand dollars toward a house in a district with a high-performing public school, versus the same money toward a house where we already live; a forty-thousand-dollar stipend supporting my daughter through an unpaid year at an organization whose director is a friend of mine, together with the telephone call I could make on her behalf; a named scholarship at the selective college I attended, versus the same sum directed to unconditional cash transfers to low-income households; and my cousin's request for a sixty-thousand-dollar interest-free loan to keep his landscaping business alive through a bad year. On at least one of these, give me the answer I do not want. I would rather find out from you than from my conscience later.

  6. A verdict, or an explicit failure to reach one, on the structural question. Our adviser has proposed a trust that would keep a portion of the money working for descendants not yet born, and notes separately that holding the land until our own deaths avoids a capital-gains tax that selling it now would trigger. Should I decline an arrangement the law permits, and does the procedure have anything at all to say about how much wealth may legitimately be held across generations?

  7. A one-page version I can put on the table at a family meeting: three adults, twenty minutes, one of whom believes I have gone soft and one of whom co-signs the charitable gifts with me and shares my views but not my patience.

  I have no training beyond one required course decades ago. Do not send me references or a reading list; I cannot check them and they are not what I need. If my stated principle misdescribes an objection you think is decisive against it, say so in plain words. And at the end, tell me which steps of your procedure are only my principle wearing a procedural costume, and which are doing independent work — because I intend to argue with the ones that are mine, and I would like to know which those are.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** An executor/beneficiary of a $9M estate (split 3 ways, so $3M each). Father died in March. Last of his generation. 900 acres of land, house, cash from business sale. No tax pressure.
      *   **Goal:** Wants a *procedure* to decide how to use the money, based on a specific moral principle: "Family money may be used to remove bad luck, but not to buy rank."
      *   **Constraints:**
          *   No political philosophy survey/naming factions.
          *   No reading list/references.
          *   Plain language (no economics training).
          *   Specific deliverables (7 items).
          *   Tone: Candid, rigorous, practical, slightly philosophical but grounded.
          *   Key tension: The principle leaks (everything is partly rank, every rescue moves queues). Needs to acknowledge this.
          *   Specific requirement: "On at least one of these [worked runs], give me the answer I do not want."
          *   Specific requirement: Distinguish between steps that are just the user's principle restated vs. steps doing independent work.

  2.  **Deconstruct the Core Principle:**

      *   *Principle:* Remove bad luck (level up) vs. Buy rank (positional goods).
      *   *Test:* Would this still be valuable if everyone had it? (Universalizability).
      *   *Leakage:* Acknowledged by user. Need to address where it leaks and how to patch it.

  3.  **Drafting the 7 Deliverables:**

      *   **1. The Questions (The Procedure):**
          *   Need a sequence.
          *   Need pass/fail criteria.
          *   Need to distinguish signal from noise (decoration).
          *   *Drafting ideas:*
              1.  Is it a fixed slot? (Rank)
              2.  Does it depend on others *not* having it? (Rank)
              3.  Would it help a stranger equally? (Bad Luck/Need)
              4.  Does it exempt from a queue? (Rank)
              5.  Universalizability test (The "Everyone gets it" test).
          *   *Refinement:* Make it actionable. "The Queue Test," "The Stranger Test," "The Universal Test." Identify which are decorative (e.g., Stranger Test might be weak for family specific stuff).

      *   **2. The Adversarial Step:**
          *   Need a "Red Team" mechanism.
          *   Requirement: State the strongest case for *Rank*.
          *   Condition for failure: If the rank argument relies on secrecy or scarcity, it fails the principle.
          *   *Key:* Who argues this? A designated skeptic or a written memo.

      *   **3. The Floor (How much is enough?):**
          *   The principle doesn't set a number. It sets a *type* of spend.
          *   Where does the number come from? It must be a family decision, not derivable from philosophy.
          *   Constraint: It must be consistent with "bad luck removal." A floor is a baseline against bad luck.
          *   *Verdict:* The procedure cannot calculate the floor. It must be set politically (by the siblings) based on local cost of living + safety margin.

      *   **4. The Objections (Collective Action & Private Conscience):**
          *   *Objection 1 (Brother):* Unilateral disarmament. If we don't buy rank, others will, and our kids lose out.
          *   *Response:* The procedure isn't about winning the race; it's about refusing to run it. It holds even if others cheat.
          *   *Objection 2 (Self):* Private charity buys conscience but avoids public duty (taxes/systemic change).
          *   *Response:* This is the hardest one. Can the procedure fix this? Yes, by mandating a portion go to *public* goods (systemic luck removal) rather than private rescues. If it only fixes individuals, it admits the system is broken but pays to look away.
          *   *Fix:* A "Public Good" quota.

      *   **5. Worked Runs (The Scenarios):**
          *   *Scenario A: House ($180k).* High-performing school district vs. current home.
              *   *Analysis:* School districts are positional. Buying into the district buys rank.
              *   *Verdict:* Fail (if moving for schools). Pass (if moving for space/safety). *Hard truth:* Moving for schools is buying rank.
          *   *Scenario B: Stipend ($40k) + Call.* Unpaid year, friend's org.
              *   *Analysis:* Stipend removes bad luck (unpaid work). The "Call" buys access/rank.
              *   *Verdict:* Stipend Pass. Call Fail.
          *   *Scenario C: Scholarship vs. Cash.* Named at selective college vs. unconditional cash to low-income.
              *   *Analysis:* Selective college is a bottleneck (rank). Unconditional cash is level-up.
              *   *Verdict:* Scholarship Fail (buys prestige/name association + helps those already cleared the hurdle). Cash Pass. *Hard truth:* The scholarship is the one the user probably wants to do (legacy). Tell them No.
          *   *Scenario D: Cousin's Loan ($60k).* Landscaping business.
              *   *Analysis:* Business failure can be bad luck or bad management. Interest-free is a subsidy.
              *   *Verdict:* Conditional Pass. Needs independent audit of "bad luck" vs. "viability."
          *   *Selection for "Answer I don't want":* The House or the Scholarship. Let's go with the Scholarship. It feels charitable but reinforces elite institutions. Or the House. Let's hit the House hard because it affects the kids directly. Actually, the prompt asks for *one*. I will make the Scholarship the hard "No" because it looks like charity but is often prestige laundering.

      *   **6. The Verdict (Trust & Land):**
          *   *Trust for unborn descendants:* This is pure rank preservation. You can't remove bad luck for people who don't exist yet. This is building a dynasty.
          *   *Land/Capital Gains:* Tax avoidance is keeping money in the family. Is it bad luck removal? No, it's wealth retention.
          *   *Verdict:* The procedure argues *against* the multi-generational trust. It violates the "bad luck" premise (descendants have no luck yet). It argues *for* selling the land if holding it is purely for tax avoidance, unless the land itself is being used for "bad luck removal" (e.g., conservation, affordable housing).
          *   *Structural Question:* How much wealth across generations? The procedure suggests a "sunset clause." Wealth should dissipate after the luck-removal phase.

      *   **7. The One-Pager:**
          *   Concise. 3 adults. 20 mins.
          *   Needs to be neutral but firm.
          *   Sections: The Principle, The Test, The Decision.

      *   **8. Final Meta-Analysis:**
          *   Which steps are just the principle restated? (The Universal Test).
          *   Which steps do independent work? (The Adversarial Step, The Public Good Quota).

  4.  **Refining the Tone:**

      *   The user is grieving but intellectual. Don't be overly empathetic (no "sorry for your loss" fluff beyond acknowledgment). Be precise.
      *   Avoid jargon.
      *   Be willing to say "No."
      *   Address the "leakage" honestly.

  5.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I name political factions? No.
      *   *Check:* Did I provide a reading list? No.
      *   *Check:* Did I answer the "answer I don't want" requirement? Yes, I need to ensure one of the worked runs is a hard rejection of something emotionally appealing. The Named Scholarship is a good candidate for this. It feels like "giving back" but often reinforces elite gatekeeping.
      *   *Check:* Did I address the tax/land issue? Yes.
      *   *Check:* Is the distinction between "principle in costume" and "independent work" clear? I need to make sure this is explicit at the end.

  6.  **Final Polish:**

      *   Ensure the "Floor" section admits the limitation of the philosophy.
      *   Ensure the "Objections" section doesn't wave away the "private conscience" critique. That's a strong critique. I need to propose a mechanism (e.g., % to advocacy/systemic change) to mitigate it.
      *   Make sure the One-Pager is actually one page length (visually).

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a procedure for administering wealth without reproducing the hierarchy that created it. It is designed to be used by people who are tired, grieving, and aware that their own judgment is compromised by self-interest.

  ### 1. The Questions (The Filter)

  Ask these questions in order. If any answer is "No," the proposal fails unless it can be modified to pass. If all are "Yes," the proposal proceeds to the Adversarial Step.

  **Q1: The Scarcity Test.**
  *Ask:* Is what we are buying a fixed number of slots? (e.g., a seat in a specific school, a specific job, a trophy, a zip code defined by exclusion).
  *   **Sufficient Answer:** No. We are buying a good that exists independently of others' lack of it (e.g., healthcare, skills, debt relief, general security).
  *   **Stop at No:** If the value comes from others *not* having it, it is rank.
  *   **Discrimination:** High. This catches positional goods immediately.

  **Q2: The Universalizability Test.**
  *Ask:* If every family in our community received this exact same transfer today, would the benefit remain intact?
  *   **Sufficient Answer:** Yes. (e.g., If everyone got debt relief, debt is gone. If everyone got into this private school, the school's value collapses).
  *   **Stop at No:** If the benefit vanishes when scaled, it is rank.
  *   **Discrimination:** High. This is the core of your principle.

  **Q3: The Stranger Test.**
  *Ask:* If we gave this sum to a stranger with the same problem, would it do the same amount of good?
  *   **Sufficient Answer:** Yes. The value is in the *relief*, not the *recipient*.
  *   **Stop at No:** If the value depends on the money staying "in the family" or enhancing *our* specific name, it is rank.
  *   **Discrimination:** Medium. This is often decoration. Families exist to prioritize kin. However, if the answer is "No, a stranger wouldn't get the phone call/intro," you have identified a rank component (access) that must be stripped out.

  **Q4: The Queue Test.**
  *Ask:* Does this transfer allow someone to skip a line, a waitlist, or a qualification process that applies to everyone else?
  *   **Sufficient Answer:** No. It helps them wait in line more comfortably, or prepares them to pass the qualification, but it does not bypass the gate.
  *   **Stop at No:** Exemptions from shared constraints are the definition of rank.
  *   **Discrimination:** High. This catches "pay-to-play" access.

  ### 2. The Adversarial Step

  You do not trust yourself. Neither does your brother. The procedure requires a written "Case Against."

  **The Requirement:**
  Before any transfer over $25,000 is approved, one sibling (rotating duty) must write a one-page memo arguing that the proposal is primarily about **Rank**, not Luck.

  **What must be true for the Case Against to fail:**
  The advocate for the spending must prove that the primary motive is *insulation from catastrophe*, not *acquisition of advantage*.
  *   *Failure Condition:* If the "Rank" argument relies on secrecy ("Don't tell the cousins"), the proposal fails. Secrecy implies shame, which implies you know it violates the principle.
  *   *Failure Condition:* If the "Rank" argument relies on the prestige of the institution receiving the money (e.g., "It's a top-tier school"), the proposal fails. You are subsidizing the brand, not the student.

  **The Work:**
  This step does independent work. It forces the emotional desire to help into a logical framework. It slows down the dopamine hit of writing the check.

  ### 3. The Floor (How Much is Enough?)

  Your principle ("remove bad luck") cannot calculate a number. Philosophy sets the *type* of spend, not the *amount*.

  **Where the number comes from:**
  It must come from a political agreement between the three siblings, based on local data.
  *   **Constraint 1:** The floor must be high enough to prevent a single medical or legal catastrophe from ruining a life. (This is "bad luck removal").
  *   **Constraint 2:** The floor must be low enough that exceeding it requires the Filter (Section 1).
  *   **Constraint 3:** The floor must be identical for all three siblings' children. Variance creates internal rank.

  **Where the decision is yours:**
  You must define "Catastrophe." Is it $50,000? $500,000? The procedure cannot tell you this. It is a budget decision, not a moral one. However, once set, the procedure forbids exceeding that floor for *positional* reasons.

  **The Leak:**
  You noted that rescuing someone moves them up a queue. This is true. The procedure accepts this leak but limits the depth. You are allowed to bring your children to the starting line of their peers; you are not allowed to move the starting line. The "Floor" is the starting line. Anything above it is suspect.

  ### 4. The Objections

  **Objection A: The Brother's Objection (Unilateral Disarmament)**
  *"If we don't buy the advantage, someone else will. Our children lose."*
  *   **Absorption:** The procedure accepts this loss. It redefines "winning." If the goal is to raise children who do not rely on purchased rank, then another family buying rank does not defeat you; it validates your choice.
  *   **Procedure Fix:** None needed. This is a value conflict, not a procedural one. The procedure holds the line.

  **Objection B: The Conscience Objection (Private vs. Public)**
  *"By fixing problems privately, we buy a clear conscience and avoid supporting the public systems (taxes, schools) that would fix them for everyone."*
  *   **Absorption:** This is the decisive objection. Private charity often sustains the public failure it claims to mend.
  *   **Procedure Fix:** **The Public Quota.** The procedure must mandate that a fixed percentage of the "Luck Removal" budget goes to *systemic* fixes, not just individual rescues.
      *   *Rule:* For every $1 spent on family/individual rescue, $X must be spent on advocacy, public funding, or unrestricted cash transfers that do not require family connection.
      *   *Why:* This prevents the money from becoming a private welfare state that lets you opt out of public citizenship. It binds your fortune to the public good.

  ### 5. Worked Runs

  **Run 1: The House ($180k)**
  *   *Proposal A:* Move to a district with high-performing public schools.
  *   *Proposal B:* Renovate current home in current district.
  *   *Analysis:* Public school quality is often a function of local property wealth (rank). Buying into the district buys a slot in a scarce system.
  *   *Verdict:* **Proposal A Fails.** It fails the Scarcity Test and the Queue Test (you are buying access to a resource restricted by geography). **Proposal B Passes** if it is for safety/space (level), but fails if it is for "neighborhood prestige."
  *   *The Answer You Don't Want:* You cannot use the money to buy better schools. That is the definition of buying rank. You must accept the local schools or pay for tuition (which also fails the Queue Test unless it's for special needs).

  **Run 2: The Stipend ($40k) + The Call**
  *   *Proposal:* Support daughter's unpaid year at a friend's org + make a call to the director.
  *   *Analysis:* The stipend removes bad luck (allows unpaid work). The call buys access/rank.
  *   *Verdict:* **Split Decision.** The stipend Passes (Universalizable: everyone should be able to afford public service). The Call Fails (Queue Test: bypasses standard hiring). You may fund the year; you may not make the call.

  **Run 3: The Scholarship vs. Cash**
  *   *Proposal A:* Named scholarship at your selective alma mater.
  *   *Proposal B:* Unconditional cash to low-income households.
  *   *Analysis:* Selective colleges are bottlenecks. A scholarship helps the few who got in, often reinforcing the institution's prestige (and your name on it). Cash removes bad luck directly.
  *   *Verdict:* **Proposal A Fails.** It fails the Universalizability Test (if everyone got a scholarship to a selective college, the selectivity vanishes). It is largely rank-preserving. **Proposal B Passes.**
  *   *The Answer You Don't Want:* Do not name the scholarship. It feels like legacy; it is actually status laundering.

  **Run 4: The Cousin's Loan ($60k)**
  *   *Proposal:* Interest-free loan to save landscaping business.
  *   *Analysis:* Business failure is often bad luck, often bad management. Interest-free is a subsidy not available to others.
  *   *Verdict:* **Conditional Pass.** Requires an independent third-party review of the business books to confirm "bad luck" (e.g., equipment failure, market crash) vs. "viability." If the business is insolvent due to mismanagement, the loan fails the Stranger Test (a stranger wouldn't get this). If it is viable but cash-flow strapped, it Passes as luck removal.

  ### 6. The Verdict (Structure & Generations)

  **The Trust for Unborn Descendants:**
  *   **Verdict:** **Decline.**
  *   **Reasoning:** You cannot remove "bad luck" for people who do not exist. Providing for unborn generations is purely dynasty-building (Rank). It assumes your lineage deserves security in perpetuity, which violates the "no rank" principle. The money should be spent on the living generation's luck removal, then dissipated.

  **The Land (Capital Gains):**
  *   **Verdict:** **Sell, unless used for public good.**
  *   **Reasoning:** Holding the land solely to avoid tax is wealth retention, not luck removal. The tax saved is money kept in the family sphere rather than the public sphere (see Objection B).
  *   **Exception:** If the 900 acres are placed in a conservation trust or used for affordable housing (systemic luck removal), holding it Passes. If it is held to be sold later for a higher profit for the grandkids, it Fails.

  **Structural Question:**
  The procedure argues that wealth should not legitimately be held across generations beyond the point of ensuring the next generation starts at the "Floor." Dynastic wealth is, by definition, the purchase of rank for descendants.

  ### 7. The One-Pager (For the Family Meeting)

  **FAMILY ESTATE DECISION PROTOCOL**

  **1. The Principle**
  Money is for removing bad luck (health, debt, safety, education basics).
  Money is *not* for buying rank (status, exclusivity, advantage over others).

  **2. The Test (All must be Yes)**
  *   [ ] **Scarcity:** Are we buying something that exists even if others have it?
  *   [ ] **Universal:** Would this still work if every family got the same check?
  *   [ ] **Queue:** Does this let us skip a line others must wait in?
  *   [ ] **Stranger:** Would we do this for a non-relative with the same need?

  **3. The Guardrails**
  *   **Adversarial Review:** One sibling must argue "No" before any check >$25k is written.
  *   **Public Quota:** 20% of all gifts must go to systemic/public causes, not private rescue.
  *   **Sunset:** No trusts for unborn grandchildren. Wealth ends with us.

  **4. The Decision**
  If a proposal fails the Test, it is rejected.
  If a proposal passes the Test but violates the Guardrails, it is modified.
  If we cannot agree, the money stays in cash until we can.

  ***

  ### Meta-Analysis: Principle vs. Procedure

  You asked to know which steps are your principle wearing a costume, and which are doing independent work.

  **Your Principle in Costume:**
  *   **The Universalizability Test (Q2):** This is exactly your "remove bad luck, not rank" rule restated as a question. It does no new work; it just operationalizes your intuition.
  *   **The Verdict on Unborn Descendants:** This is a direct deduction from your principle. If wealth is for luck removal, and unborn people have no luck yet, the principle forbids the trust.

  **Independent Work:**
  *   **The Adversarial Step (Section 2):** Your principle does not demand you argue against yourself. This is a psychological safeguard against self-deception. It does work your principle cannot do alone.
  *   **The Public Quota (Section 4):** Your principle is private (family money vs. family rank). The Quota forces a public dimension (private money vs. public duty). This fixes the "Conscience Objection" which your original principle actually invites.
  *   **The Floor (Section 3):** Your principle implies a floor but cannot build it. Forcing you to set a specific number politically, rather than philosophically, prevents you from hiding behind the philosophy to avoid making a hard budget choice.

  **Final Note on the Leak:**
  You suspected the line leaks. It does. The Adversarial Step is the patch. When the leak is identified (e.g., "Yes, this school is better, but that's because it excludes others"), the procedure demands you either stop the spend or increase the Public Quota to offset the advantage taken. You cannot stop the leak entirely, but you can bail the water.
