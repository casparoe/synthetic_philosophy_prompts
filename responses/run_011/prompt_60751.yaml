answer: |-
  ### Feasibility Check
  Your shape is **workable**, but it is logistically dense for 90 minutes with 18 students. The main risk is the "Translator Bottleneck." If the translator takes 45 seconds to encode/decode each question, you will lose 15 minutes of discussion time in the first round.
  **Fix:** Pre-print the English-to-Glyph key for the Translator. Do not make them translate on the fly; they should match English phrases to Glyph sequences from a sheet. This reduces cognitive load and speeds up the loop.
  **Second Fix:** The "Rule Room" students will naturally try to find patterns (semantics). Do not stop them. This is data for the debrief.

  ---

  ### 1. The Glyph Inventory
  **Goal:** Distinct, easy to match, no semantic leakage.
  **Materials:** Index cards (cut in half), thick marker. Make 4 copies of each card.
  **The Set (12 Cards Total):**
  *   **Subjects (5):** Circle, Square, Triangle, Star, Cross.
  *   **Predicates (5):** 1 Dot, 2 Dots, 3 Dots, 4 Dots, 5 Dots (drawn inside a generic box).
  *   **Operators (2):** Question Mark (?), Period (.).
  *   **Responses (2):** Checkmark (Yes), X (No).

  **Why:** Shapes + Counts are easy to identify visually under pressure. They have no inherent linguistic meaning (unlike "Cat" or "Red").

  ---

  ### 2. The Rulebook (Room A)
  **Goal:** Compositional/Algorithmic. The students manipulate symbols based on form, not meaning.
  **Logic:** The "Identity Rule." If the Subject Shape matches the Predicate's *assigned* Shape (hidden mapping), output Yes.
  **Wait, that requires a mapping.**
  **Better Logic:** "The Symmetry Rule."
  *   Input Format: `[Subject] [Predicate] [?]`
  *   Rule 1: Look at the Subject Card. Count the number of corners/points (Circle=0, Square=4, Triangle=3, Star=5, Cross=4).
  *   Rule 2: Look at the Predicate Card. Count the dots.
  *   Rule 3: If **Corners == Dots**, output **Checkmark**.
  *   Rule 4: If **Corners != Dots**, output **X**.
  *   Rule 5: If Input does not end with `[?]`, output **X**.
  *   Rule 6: If Input has more than 3 cards, output **X**.
  *   Rule 7: If Cards are not in Subject-Predicate-Order, output **X**.
  *   Rule 8: If a card is upside down, output **X**.
  *   Rule 9: If you are unsure, wait 10 seconds, then output **X**.
  *   Rule 10: Do not speak. Do not show cards to the other room.

  **Why:** This is purely syntactic manipulation of visual features. It allows for **productivity**. Any combination of the 5 subjects and 5 predicates (25 combos) can be answered correctly using the rules, even if the students have never seen that specific pair before.

  ---

  ### 3. The Table Room Corpus (Room B)
  **Goal:** Finite Lookup. They survive common queries but fail on novel combinations.
  **Materials:** A single sheet of paper with 25 lines.
  **Format:** `[Glyph Sequence] -> [Response Glyph]`
  **Content:**
  *   Seed the table with the 15 "True" combinations (where Corners == Dots) that are most intuitive (e.g., Square/4-Dots, Triangle/3-Dots).
  *   Seed the table with 10 "False" combinations students are likely to ask (e.g., Circle/5-Dots).
  *   **Deliberately Leave Out:** 5 specific combinations that are "True" according to the Rule Room's logic but are *not* on this list (e.g., Star/5-Dots, Cross/4-Dots).
  *   **Instruction to Room B:** "If the input sequence matches a line on your sheet exactly, output the Response. If it does not match any line exactly, output **X**."

  **Why:** This guarantees that in Phase 1, both rooms perform identically (high accuracy). In Phase 2 (Killer Questions), the Rule Room can answer the "Missing True" combos, while the Table Room fails.

  ---

  ### 4. Roles, Timeline & Scoring (90 Minutes)

  **Roles (18 Students):**
  *   **Room A (Rule):** 2 students (One searches rules, one handles cards).
  *   **Room B (Table):** 2 students (One searches list, one handles cards).
  *   **Translator:** 1 student (Sits between rooms and interrogators).
  *   **Interrogators:** 13 students (Split into 4 teams of 3-4).
  *   **Professor:** Timekeeper and Facilitator.

  **Scoring:**
  *   Each Interrogator Team gets 3 "Tokens" (candy/paper).
  *   They bet tokens on: "Which room is which?" and "Will this question break a room?"
  *   Winning team gets a small prize (e.g., first to leave, or actual candy bar).

  **Timeline:**
  *   **00-10:** Setup. Rooms sit back-to-back or behind screens. Translator gets Key. Rooms get Instructions (sealed envelopes).
  *   **10-30:** **Phase 1 (Blind Testing).** Interrogators submit questions. Translator converts to Glyphs. Rooms answer. Translator converts back. Class bets on which room is which based on speed/accuracy. (Expectation: They look identical).
  *   **30-40:** **Phase 2 (Killer Questions).** Interrogators try to find a question one room answers and the other doesn't.
  *   **40-50:** **The Reveal.** Open the envelopes. Show Rulebook vs. Table.
  *   **50-70:** **Debrief Part 1:** The Behavioral Distinction (Productivity vs. Finitude).
  *   **70-85:** **Debrief Part 2:** The Semantic Distinction (Searle, Translator, Systems).
  *   **85-90:** Wrap up.

  ---

  ### 5. "Design a Killer Question" Phase
  **Goal:** Force students to discover the *productivity* gap without you telling them.
  **Setup:** Tell Interrogators: "One room is limited, one is flexible. You have 10 minutes to find a question that gets a **Checkmark** from one room and an **X** from the other."
  **The Trap:** Students will ask complex English questions. The Translator will struggle.
  **The Fix:** Give them the Glyph Key. Let them construct Glyph sequences directly.
  **The Discovery:**
  1.  They will ask common questions (e.g., Square + 4 Dots). Both say Yes.
  2.  They will ask nonsense (e.g., Circle + 5 Dots). Both say No.
  3.  **The Breakthrough:** They must ask a "True" combination that is *rare*. (e.g., Star + 5 Dots).
      *   Rule Room: Counts points (5), Counts dots (5). Matches. Outputs Check.
      *   Table Room: Searches list. Not found. Outputs X.
  4.  **The Complication:** They might ask a "False" combination not on the Table. Both output X. This looks like agreement, but for different reasons (Rule = False, Table = Missing).
  5.  **Your Prompt:** "Did the room that said X fail because it didn't know the answer, or because it didn't have the answer in its list?"
      *   *This leads them to realize: A blank answer isn't proof of lack of understanding, because the Rule Room also has gaps (e.g., upside-down cards).*

  ---

  ### 6. The Debrief (Mapping Moments to Philosophy)

  **Moment 1: The Behavioral Indistinguishability (Phase 1)**
  *   **Concept:** **Turing Test / Systems Reply.**
  *   **Point:** For the first 20 minutes, the rooms behaved identically. If you only judge by output, you can't tell a Rule-follower from a Lookup-table. This validates the Systems Reply (the whole room understands) *behaviorally*, but...

  **Moment 2: The Productivity Gap (Phase 2)**
  *   **Concept:** **Block's Blockhead (1981).**
  *   **Point:** We found a limit. The Table Room is finite (Blockhead). The Rule Room is productive.
  *   **Correction:** "Shannon and McCarthy discussed finite machines, but Block formalized the 'Lookup Table Argument' against functionalism."
  *   **Crucial Question:** "Does the Rule Room's ability to answer *new* questions prove it understands?"
  *   **Answer:** No. It just has a shorter rule ("Count points") instead of a long list. It's still syntax.

  **Moment 3: The Translator Variable**
  *   **Concept:** **Homunculus / Level Confusion.**
  *   **Point:** "Where was the understanding?"
  *   **Trap:** Students will say "The Translator."
  *   **Counter:** "If the Translator is the mind, what are the Rooms?" (The body? The subconscious?).
  *   **Searle's Point:** Even if the Translator is removed and the Rules are complex enough to encode the translation *inside* the Rule Room, the student inside still doesn't understand Chinese. The understanding didn't appear just because the system got complex.

  **Moment 4: Speed and Scale**
  *   **Concept:** **Dennett's Speed/Scale Objection.**
  *   **Point:** "The Rule Room was slow and clunky. A real mind is fast."
  *   **Counter:** "If we sped it up to nanoseconds, would understanding pop into existence?" (Searle says no, Dennett says yes).
  *   **Activity Evidence:** You felt the slowness. It felt mechanical. Dennett argues that intuition is unreliable at scale.

  ---

  ### 7. Troubleshooting: What Will Go Wrong

  **Problem 1: The Rule Room is too slow.**
  *   **Symptom:** Interrogators get bored counting points on stars.
  *   **Fix:** Give the Rule Room a "Cheat Sheet" for the counts (e.g., Star = 5, Square = 4). This removes arithmetic load and focuses them on the *matching rule*.
  *   **Philosophical Cost:** Low. It emphasizes that the *rule* is the key, not the computation speed.

  **Problem 2: Rule Room Students Learn the Glyphs.**
  *   **Symptom:** By minute 30, Rule Room students say "Oh, Star is 5."
  *   **Is this a bug?** **No, lean into it.**
  *   **Debrief Use:** "You learned that Star = 5. That is *syntactic* learning. You still don't know what '5' *means* in the real world (quantity vs. label). You learned the internal relations of the system, not the semantics. This is exactly what a neural net does."

  **Problem 3: The Translator Becomes the Star.**
  *   **Symptom:** Class focuses entirely on the Translator's choices.
  *   **Fix:** In the debrief, explicitly isolate the Translator. "Imagine the Translator is also a rule-following machine (a dictionary). Now where is the understanding?"

  ---

  ### 8. Limitations (What You Must Supply Verbally)
  This activity cannot reproduce:
  1.  **Unboundedness:** The Rule Room only handles 5x5 combos. Real language is infinite. *Tell them:* "Imagine these rules recurse. The logic holds, the emptiness holds."
  2.  **Sensory Input:** The rooms don't see the world. *Tell them:* "This is the Robot Reply. Adding cameras doesn't give the symbols meaning to the processor."
  3.  **Speed:** Real cognition is parallel and instant. *Tell them:* "Searle's argument is about *principle*, not engineering. Slowness doesn't prove lack of understanding, but it reveals the mechanism."

  ---

  ### 9. Fallback Versions

  **Fallback A: No TA (You are the Translator)**
  *   **Change:** You stand at the front. You hold the Key.
  *   **Risk:** You become the "Homunculus" too visibly.
  *   **Mitigation:** Wear a blindfold or face away from the Rooms when processing. Emphasize in debrief: "I was just a router. I didn't add meaning, I just changed formats."
  *   **Logistics:** You will be slower. Cut Phase 1 to 15 minutes.

  **Fallback B: 50-Minute Cut-Down**
  *   **Cut:** Remove Phase 1 (Blind Testing).
  *   **New Flow:**
      *   00-05: Setup.
      *   05-20: **Direct Challenge.** Tell class: "Room A uses Rules, Room B uses a List. You don't know which is which. Find the difference." (Combine Phase 1 & 2).
      *   20-30: Reveal & Behavioral Debrief.
      *   30-50: Semantic Debrief (Searle/Translator).
  *   **Loss:** You lose the "Turing Test" illusion. You must verbally reconstruct it: "If you hadn't known the mechanisms, could you have told?"

  ---

  ### 10. The Single Most Important Moment
  **The Reveal of the Rulebook.**
  When you project the Rule Room's instructions and the class sees: *"If Corners == Dots, Output Check,"* the room will go quiet.
  **Protect this moment.** Do not let them chatter immediately. Let them sit with the fact that **correct behavior was produced by a meaningless instruction.**
  This is the core of Searle's argument. The syntax was sufficient for the output, but the semantics were absent. If you run over time, cut the Dennett/Speed discussion, but do not cut the silence after the Reveal.

  ---

  ### Materials Checklist for Weekend Prep
  1.  **Glyph Cards:** 60 cards total (4 sets of 12). Laminate if possible.
  2.  **Room A Envelope:** Rulebook (10 rules + Corner Count Cheat Sheet).
  3.  **Room B Envelope:** Lookup Table (25 lines).
  4.  **Translator Sheet:** English-to-Glyph Key (e.g., "Is the Square 4?" -> `[Square] [4-Dots] [?]`).
  5.  **Screens:** Two cardboard tri-folds to hide Rooms from each other.
  6.  **Tokens:** 39 candies (3 per interrogator team).

  This plan keeps the "Lookup Table" terminology hidden until the reveal, forces the behavioral distinction through the "Killer Question" phase, and uses the Translator to complicate the "Systems Reply" rather than solve it.
