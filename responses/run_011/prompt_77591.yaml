answer: |-
  1. Weber distinguishes capitalism as mere acquisitive greed, which exists universally, from the modern spirit of capitalism defined by rational, systematic labor in a vocational calling. His claim is that ascetic Protestantism provided the unique ethical sanction necessary to break traditionalist economic habits, not that it single-handedly generated capital accumulation.
  2. The argument is non-trivial because it specifies how a theological doctrine produced an unintended psychological compulsion that rationalized daily life conduct, rather than merely influencing general moral choices. This specific mechanism transformed work from a necessity into a moral end in itself, overriding traditionalist impulses to work only enough to meet needs.
  3. Catholic anxiety was manageable through sacraments like confession, whereas Calvinist anxiety was unrelieveable, forcing believers to systematize their entire lives to prove election rather than seeking periodic relief. This difference compelled a continuous, methodical regulation of conduct that Catholic penitence did not require.
  4. Weber's later comparative studies of China, India, and Judaism demonstrate that other religions lacked the specific combination of inner-worldly asceticism and rationalization needed to sustain this economic ethic. These works clarify that the Protestant ethic was a necessary condition for the specific Western form of rational capitalism, even if not the sole sufficient cause.
  5. Elective affinity describes a structural resonance where the religious ethic made the economic ethic psychologically viable and morally obligatory, explaining why they reinforced each other without strict determinism. It is explanatory work rather than a hedge because it identifies how cultural meanings align to motivate action, avoiding the reductionism of claiming religion alone created economic structures.
