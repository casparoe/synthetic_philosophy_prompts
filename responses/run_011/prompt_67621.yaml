  Good evening. For those who don't know me, I teach high-school chemistry. Tom and Marta teach philosophy of mind. Usually, I explain reactions; today, I explain a relationship without using the words for thoughts, desires, or internal states. Tom calls this eliminativism. I call it balancing an equation with half the elements missing. If I slip up, Tom has promised to correct me publicly. I rely on the department chair to keep the correction polite.

  Tom argues that folk psychology is like phlogiston. Before modern chemistry, we said burning wood released phlogiston. It turned out phlogiston wasn't real. But the wood still burned. The heat was still there. The theory was wrong, but the fire was not. Tom says "wanting" isn't real. He says there is no internal state that answers to the word. But I look at these two, and the heat is undeniable. The theory might be empty, but the burning is not. The warmth in this room does not require a valid theory of combustion to be noticed.

  Marta adds that even if the words don't map to objects, they still work. A map isn't the territory, but you still use it to find the road. They wrote their own vows an hour ago. They used every forbidden word in the book. They got away with it because the vows were theirs. I, however, am under contract. If I say "hope," the building might collapse. Or at least, I will be asked to submit a revised draft.

  So, how do I say they belong together? I look at the data. I see a record of actions. When one travels, the other packs the bags. When one speaks, the other listens. When the world presses hard, they lean in the same direction. This isn't magic; it is habit. It is a shared history of showing up. Two nervous systems, tuned to the same frequency, responding to the same stimuli with coordination. There are graduate students here tonight. You have seen how much work goes into a coherent argument. Tom and Marta have been writing this one together for years. The draft is solid. The citations are impeccable.

  Our mother waits for the phone every week. Tom says, "I love you." He has said this for twenty years. The sound travels across the wires. It lands. She receives it. The mechanism of the speech act does not cancel the care it carries. You do not need a soul to be kind. You do not need a ghost in the machine to keep a promise. The output is consistent. The pattern holds.

  Grandma called me yesterday. She is eighty-eight. She has been married sixty-four years. She asked me to say that these two believe in each other. I cannot say that. But I can say this: They stand by each other. They build a structure where neither falls. They have made a home out of reliable presence. Sixty-four years is not a feeling; it is a duration. It is a sequence of mornings where two people wake up and choose the same table. It is the accumulation of small corrections, like titrating a solution until the color changes. You do not see the change happen in one drop; you see it after the thousandth.

  Chemistry teaches us that bonds are not things you hold; they are forces you endure. They hold because the alternative requires more energy than the connection itself. Tom and Marta have found a state where staying together is the path of least resistance. It is stable. It is exothermic. It releases energy into the room whenever they enter it.

  So, please raise your glasses. To the habits they share. To the work they do. To the ground they share, and the path they walk. To Tom and Marta.

  ***

  **Constraint Analysis**

  The constraint bit hardest when addressing our mother and grandmother. Describing Tom's weekly call required quoting him ("I love you") rather than asserting the state, framing the care as a property of the speech act ("care it carries") rather than his mind. For Grandma, "believe in each other" became "stand by each other" and "reliable presence."

  I likely conceded realism to Tom in two places. First: "The heat is undeniable." This suggests the phenomenon corresponding to folk psychology is real, whereas Tom might argue only the behavior is real, not the "heat." Second: "Releases energy into the room." This metaphor attributes a physical property to their relationship that sounds ontologically robust, potentially violating his strict eliminativism.
