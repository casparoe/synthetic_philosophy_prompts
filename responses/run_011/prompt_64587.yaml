  **Empty Combinations:**
  *   **"Discounting Space but not Time."** (Node 3 Branch B + Node 7 Branch B).
      *   *Why Empty:* There is almost no literature defending this. Physics treats space and time symmetrically in relativity; Ethics treats them symmetrically in neutrality. Discounting one but not the other requires a very specific, unargued metaphysical bias.
