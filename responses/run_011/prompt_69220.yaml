answer: |-
  Dear Colleague,

  It is a privilege to correspond with someone who has stewarded faculty governance with such longevity and self-awareness, and I appreciate the candor with which you describe your committee's current heuristic of splitting things down the middle or rewarding the most aggrieved. You are indeed conflating two distinct concepts from bargaining theory, and clarifying this distinction is the necessary first step before you can adopt a defensible procedure. The rule you described, which divides the surplus above the two walkaway positions equally, is the Nash Bargaining Solution under the assumption of linear utility and symmetric bargaining power, whereas the Kalai-Smorodinsky solution you read about selects the point where each party achieves the same proportion of their maximum possible gain relative to their walkaway position. The critical difference lies in how they treat the upper bound of possibility; the Nash solution ignores the maximum possible claim if it is not feasible, focusing only on the gain from agreement over disagreement, while Kalai-Smorodinsky explicitly incorporates the ideal point, or the best each party could possibly get, into the calculation. Given your specific constraints of ninety minutes per case, no training in economics, and a justified suspicion that departments will game the system by nominating grander options to inflate their ideal point, I recommend your committee apply the Equal Surplus rule, which is a practical implementation of the Nash solution, rather than Kalai-Smorodinsky. The Kalai-Smorodinsky rule is vulnerable to the exact manipulation you fear because a department can improve its share simply by asserting a more sumptuous ideal option, whereas the Equal Surplus rule relies on the walkaway position, which is generally easier to verify with evidence than a hypothetical best-case scenario.

  To implement the Equal Surplus procedure, you must first establish the disagreement point by asking each unit to specify exactly what resources they retain if no agreement is reached, and a sufficient answer requires documented evidence of external quotes, existing budget lines, or written policies rather than verbal assertions. You must police bluffing here by requiring that the walkaway position be actionable immediately without your committee's approval, meaning if a department claims it can buy time at a neighboring institution for ten thousand dollars, you ask for the rate sheet and the availability confirmation before the meeting begins. Once the walkaway positions are fixed, you must second determine the feasible set by listing every allocation of the contested resource that is physically and budgetarily possible, and this step requires you to ignore any scenario that requires new money or policy changes from the provost, as your mandate is to divide what exists, not to create new endowments. Third, you must convert all claims into a common numeraire, and while the provost's cost per released course is a useful starting point, you must acknowledge where it fails by explicitly noting when a stake involves non-fungible values like program continuity or field site loss. When such incommensurables arise, the procedure stops handing the matter to a person because the remaining question is one of values rather than fact, and in those instances, your recommendation should state that the resource cannot be allocated efficiently by formula and should be returned to the provost with a note on the valuation gap. Fourth, you calculate the surplus by subtracting the sum of the two walkaway values from the total value of the resource to be divided, and then you divide that surplus equally between the claimants. Fifth, you add each claimant's share of the surplus to their original walkaway position to determine their final allocation. If the frontier is coarse, meaning the resource cannot be split continuously like a staff position that cannot be cut into seventeenths, you must identify the two feasible points closest to the theoretical solution and recommend the one that minimizes the difference in proportional gain, or if that is impossible, recommend a time-share or rotation that approximates the value split over a multi-year horizon. If there are three claimants rather than two, you must recognize that the two-party result does not carry over cleanly and the obvious extension can fail to be efficient, so you should treat the coalition of the two smaller claimants as a single party if they have a shared interest, or otherwise revert to a proportional claim based on the verified walkaway positions relative to the total pot.

  Let us run this procedure on your first case involving the shared imaging instrument with a one hundred thousand dollar line. First, we establish the walkaway positions, accepting the ten thousand dollars for the first department based on the neighboring institution's rate sheet and the twenty thousand dollars for the second department based on the maintenance cost of their older instrument, while rejecting the request to consider a scenario involving capital funding for a second machine because that is not part of the feasible set of the current one hundred thousand dollar line. Second, we calculate the total value at risk, which is the one hundred thousand dollars, and subtract the sum of the walkaway positions, which is thirty thousand dollars, leaving a cooperative surplus of seventy thousand dollars. Third, we divide the surplus equally, granting thirty-five thousand dollars to each department. Fourth, we add this surplus to the walkaway positions, resulting in a recommendation that the first department receives forty-five thousand dollars of the line and the second department receives fifty-five thousand dollars. This outcome is defensible because it ignores the grandiose option of the second machine, which was rightly excluded from the feasible set, and it rewards the second department slightly more only because their verified walkaway position was higher, reflecting their greater loss if cooperation fails.

  For the second case of three departments claiming a single jointly funded staff position, the procedure encounters friction because the good is indivisible. First, we ask for the walkaway position of each department, but since none will withdraw and the position cannot be split physically, the walkaway value for each is effectively zero if the position remains unfilled, or the cost of their current stopgap measures if the position is denied entirely. Second, we recognize that the Equal Surplus rule requires transferable utility, which a single person's labor time is not, so we must convert the position into a divisible metric, such as percentage of effort or months of salary support. Third, if the work can be partitioned, we apply the equal surplus division to the time shares, but if the work requires a single individual, the procedure dictates that we cannot achieve an efficient bargaining solution without side payments. Here, the committee should recommend a rotation of the position among the three departments over a three-year cycle, with the order determined by a lottery, because any static allocation would violate the efficiency condition of the bargaining solution. You must explain to your colleagues that in cases of strict indivisibility with more than two claimants, the mathematical solution dissolves into a governance choice, and the fairest proxy for a bargaining outcome is a randomized rotation that equalizes expected value over time.

  In the third case regarding the shared archive where one department's outside option appears better than any allocation you could construct, the procedure yields a counterintuitive result that will not please the provost. First, we verify the outside option and confirm that its value exceeds the total value of the archive to that department under any feasible management plan your committee can devise. Second, we observe that the disagreement point for this department is higher than the maximum feasible payoff from agreement. Third, the rational bargaining solution dictates that this department should exercise its outside option and withdraw from the negotiation. Consequently, your recommendation must be that the committee declines to allocate the archive resources to this dispute and instead advises the provost that the university should allow the department to pursue its outside option, as forcing an allocation would be economically inefficient and coercive. You must be candid in your cover letter that the committee has no business deciding this matter because the market has already solved it, and any intervention would merely destroy value, even if this creates political friction with an administration eager for a resolution.

  Finally, I must be clear about what this procedure cannot do and where it will misfire in practice. The procedure cannot resolve disputes where the common measure is fundamentally rejected by one party, such as when a humanities department refuses to accept the cost per released course as a valid metric for their contribution, and in these instances, the formula will produce numbers that lack legitimacy. The procedure will misfire when the walkaway positions are unverifiable, such as when a department claims a reputational loss that cannot be quantified, forcing you to revert to your old method of listening to whoever is more aggrieved. It will also struggle when the power dynamics are vastly asymmetric, as the Equal Surplus rule assumes symmetric bargaining power, and if one department holds a veto or political leverage that the other does not, the mathematical fairness will be ignored in the implementation. You should adopt this method not because it is perfect, but because it forces the conversation onto the terrain of evidence regarding walkaway positions and feasible sets, which is a more principled ground than assessing grievance, and even if you must abandon the calculation in complex cases, the discipline of asking the questions in this order will clarify where the true disagreement lies.

  Sincerely,

  A Colleague in Economic Theory
