answer: |-
  Here is a principle that captures nearly all your verdicts, precise enough for a stranger to apply, followed by the honest accounting of where it breaks.

  ### The Principle: Signal, Shield, and System

  **"Conform only when the crowd corrects your *ignorance*. Dissent when the crowd protects your *reputation*, or when your divergence protects the *system*."**

  A stranger can apply this by asking one diagnostic question before following the crowd: *"If I were the only person on earth, would I still make this choice?"*
  *   If **No** (because I lack information the crowd has), it is a **Signal**. Conform.
  *   If **Yes** (but I'm afraid of being blamed), it is a **Shield**. Dissent.
  *   If **Yes** (and my unique view makes the group smarter), it is a **System** good. Dissent.

  ---

  ### Clause Breakdown & Case Mapping

  **1. The Signal Clause ("Corrects Ignorance")**
  *   **The Rule:** Conform when the crowd's behavior reveals hidden facts about an objective reality you cannot see alone.
  *   **Motivating Cases:**
      *   **Tourist:** You don't know where the good food is. The queue is a signal of local knowledge. (Conform).
      *   **eBay Bidder:** You don't know the item's true market value. The bids signal information you lack. (Conform).
      *   **Juror:** You hear arguments that change your interpretation of evidence. The deliberation corrects your individual blind spots. (Conform).
  *   **Why it works:** In these cases, the crowd is acting as a *sensor*. You are updating your map of the world to match reality.

  **2. The Shield Clause ("Protects Reputation")**
  *   **The Rule:** Dissent when the crowd's behavior is driven by shared incentives to avoid blame, rather than shared evidence.
  *   **Motivating Cases:**
      *   **Doctor:** You know the test is useless. You order it to avoid a lawsuit, not because it helps the patient. The crowd is a *shield* against liability. (Dissent).
      *   **Fund Manager:** You know the asset is overpriced. You buy it to avoid underperforming the benchmark in the short term. The crowd is a *shield* against career risk. (Dissent).
      *   **Epidemiologist:** You have a model based on data. You revise to match the consensus mean not because their data is better, but to avoid being the outlier who "cried wolf." This homogenizes the forecast and hides tail risk. (Dissent).
  *   **Why it works:** In these cases, the crowd is acting as *insurance*. You are updating your map to match the group, not reality.

  **3. The System Clause ("Protects the System")**
  *   **The Rule:** Dissent when your role is to provide independent verification that the group relies on for aggregate accuracy.
  *   **Motivating Cases:**
      *   **Scientist:** Science advances through conflicting hypotheses. If you abandon a program solely due to lack of interest, you reduce the diversity of inquiry. (Dissent).
      *   **Epidemiologist:** (Also fits here). A forecasting ecosystem needs diverse models to assess uncertainty. If everyone converges on one number, the system becomes fragile. (Dissent).
  *   **Why it works:** In these cases, your independence is a *public good*. Conformity degrades the group's ability to find truth.

  ---

  ### The Hard Choice: eBay vs. Fund Manager

  You asked me to choose between a complicated principle that keeps both verdicts distinct or a simple one that flips one.

  **I choose the complicated principle (above).**

  **Why:** The eBay/Fund Manager pair is the fulcrum of the entire problem.
  *   The **eBay bidder** is *learning*. She has weak private information and strong public information.
  *   The **Fund Manager** is *hiding*. He has strong private information (valuation) and ignores it for public cover.

  A simple principle like "Trust your own judgment" fails the Tourist and eBay cases. A simple principle like "Follow the wisdom of crowds" fails the Doctor and Fund Manager cases. You cannot solve this puzzle without distinguishing between **informational cascades** (I think they know something I don't) and **reputational cascades** (I know they're wrong, but I don't want to be alone). The principle *must* be complex enough to parse the motive.

  ---

  ### Predictions for the Dodged Cases

  **1. The Journalist**
  *   *Case:* Adopts the consensus framing of a story she hasn't reported herself.
  *   *Application:* Is she correcting ignorance (Signal) or avoiding the work/risk of a unique angle (Shield)? Since she hasn't reported, she has no private data. However, journalism's systemic role is to verify, not parrot. If she adopts the framing without checking, she is using the consensus as a **Shield** against the effort of verification.
  *   *Verdict:* **Not Fine.** (Violates Signal and System clauses).

  **2. The Founder**
  *   *Case:* Prices her round off other term sheets she thinks are insane.
  *   *Application:* She has private information (her own valuation/cap table) that says the price is wrong. She is conforming to avoid the friction of negotiating or the risk of the round failing. This is a **Shield**.
  *   *Verdict:* **Not Fine.** (Violates Shield clause. She is importing a market error into her cap table).

  ---

  ### The Honesty Check: Which Verdict Can't Be Saved?

  My principle cannot save the **Reviewer** without qualification.

  *   *Your Verdict:* "Fine, sort of, mildly embarrassing."
  *   *My Principle's Verdict:* **Not Fine.**
  *   *Why:* The reviewer has private information (her actual experience). Deleting the review because fifty others disagree is purely reputational conformity (Shield). It degrades the system (reviews are meant to be diverse signals of quality).
  *   *The Conflict:* You called it "Fine, sort of" because social cohesion has value. My principle is strictly *epistemic* (about truth and accuracy). It prioritizes the integrity of the data (the review) over the comfort of the community.
  *   *Concession:* If your magazine's scope includes *social utility* alongside *truth*, the principle needs a fourth clause: *"Conform when the cost of divergence is social friction that outweighs the value of the information."* But adding that clause makes the principle mushy. I recommend keeping the principle strict on truth, and acknowledging that the Reviewer case is a sacrifice made for politeness, not smarts.

  **One final note on the Epidemiologist:**
  I know you wanted to call this "Bad" even though it feels like the Juror. My principle saves this distinction by categorizing the Juror as **Signal** (deliberation updates belief) and the Epidemiologist as **System/Shield** (consensus updates position). If the Epidemiologist revised her forecast because she saw the other groups' *raw data*, that would be Signal (Fine). Revising based on their *conclusions* is Shield/System (Bad). The principle holds, provided you enforce the distinction between sharing *inputs* vs. sharing *outputs*.
