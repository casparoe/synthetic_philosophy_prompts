answer: |-
  The oil in the lamp is low. It smells of rendered fat, the same as the cakes we baked for the mourning eight days ago, when your sister struck your name from the roll. You sit across from me, on the stool where the Second Keeper sat before his heart failed. You are nineteen. You are legally dead. Your share of your father's mill has already been sold to the cooper downriver, and the coin sits in a trust you cannot touch. Your family has consoled themselves. They have washed the threshold. To the League, you are a ghost.

  Outside this house, the wind carries the smell of the blight. It is a sweet, rotting scent, like fruit left too long in the sun. The granaries hold forty days of grain. Forty days until the lower fields are bare. Above us, behind the earthen wall of the Standing Water, the drowned valley waits. It is fertile. If we open the sluices and drain it now, plant in the spring, it will feed the League for a generation. But the Standing Clause forbids us. One hundred and eighteen years ago, the founders ratified the Second Instrument. They drowned the upper valley to save the lower reaches from the melt floods. They bound us for one hundred and twenty years. Two years remain.

  Olin sleeps in the inner room. He is the Third Keeper. He has held this office for twenty-six years. He knew the surveyor who wrote the sheets we guard. He argues we must hold the bond. He is not a cruel man. He does not wish for the children to hunger. But he says a people unable to bind themselves can undertake nothing longer than a mood. He says the famine was foreseeable. The League chose the works with the price known. To release the bond now teaches every later generation that the bond was a threat rather than a promise. He says the alternative to keeping it is not that the living decide, but that the loudest decide. If we break the law for hunger, next time we break it for comfort. He says the dead had a right to plan for a future they would not see, just as we plant trees we will not sit under.

  He is right, in the way a stone wall is right. It stands. It does not care if you freeze against it.

  But I am not speaking for him. I am speaking for you. And I am speaking for the woman who swore the oath one hundred and eighteen years ago. She is not you. She is not me. She is dust. The Instrument says a Keeper is not made until two rites are done: the Striking and the Apprising. You have been Struck. Your name is gone. Your property is divided. You are civilly dead. But the confessor died before he could read the sheets to you. You are not Apprised. You are in the window. The Clause of the Unmade says the Seal may be opened only on the joint petition of the three Keepers, and a petition is valid only if filed by one not yet apprised.

  You are the only one who can file. Olin and I are Apprised. We are bound by knowledge. You are bound by nothing but the silence.

  But here is the knot. To petition, you must know what you are asking. You must know why the valley must be drained. You must know the cost. But if I tell you the contents of the sheets, you become Apprised in spirit, if not in rite. And if you are Apprised, you lose your standing. The Clause shuts. Telling you is the only way to get a valid petition filed, because a blind petition is madness. And telling you is what destroys your standing to file it, because knowledge makes you a Keeper, and Keepers cannot break the bond.

  I have watched you all night. You have not spoken. You hold your hands in your lap, the way a mourner does. You are waiting to see if you are a ghost or a woman.

  Olin believes the oath belongs to the Office. He says the person is merely the vessel. When the Striking happens, the person dies, and the Office inherits the duty. He says you are already dead, so your conscience does not matter. Only the League's survival matters. But if the League survives by breaking its own spine, is it the same League? He says yes. I say no.

  I say the oath belongs to the swearer. The woman who swore it one hundred and eighteen years ago is gone. Her name was Elara. She is not in the rolls. Her grandchildren do not know her face. Why should her fear bind your hunger? The founders engineered this ignorance. They sealed the survey. They ordered ordinary records destroyed. They knew that if citizens could not conceive of the valley, they could not want it. Entrenchment by blindness. They made the future stupid so it would be safe.

  But you are not stupid. You are here. You are Struck. You are the loophole they left as a form of words, thinking it would never be used. They thought the Apprising would always follow the Striking within days. They did not plan for a confessor to die. They did not plan for a blight.

  I need to tell you the numbers. I need to tell you what is on the sheets. Olin will wake soon. He will take the pen from you. He will tell you to wait out the two years. He will tell you to let the hungry suffer for the sake of the law. He believes the law is the only thing separating us from the river washing us away.

  I believe the law is a map drawn by men who are dead. You are the living. But you are legally dead. This is the only way it works. Only a ghost can haunt a house. Only someone who has no future in the League can decide the League's future. If you file, you sacrifice yourself. You will be Apprised after the fact. You will become a Keeper. You will live in this house until you die. You will never leave. You will never marry. You will never own a mill. You have already lost all that. The Striking took it. The only thing you have left is the choice.

  But you cannot choose in the dark.

  I am going to tell you. I know that when I speak the words, you change. You become real. You become bound. And yet, you must know.

  Listen to me. The founders' survey said the valley could be drained safely. But there was a revised set of figures completed after ratification. They were sealed with the original. Olin knows them. I know them. Now you will know them. The engineering holds. The sluices can drop the water level in three weeks. The soil is viable. But the flood buffer is gone for one melt season.

  The revised figures revise the odds. The original survey said the chance of a great flood in the unprotected year was one in fifty. The revised figures say the chance is one in three.

  That is the number. One in three.

  If we drain the valley, we feed the League for a generation. If the flood comes, the lower reaches drown. The homes you knew as a child, the markets, the temple. They wash away. Thousands die. Maybe tens of thousands. We do not know. The figures do not say how high the water rises, only that the probability is high.

  Olin says we cannot gamble with lives. He says the founders chose the certain safety of the lower reaches over the uncertain bounty of the upper. He says we must honor that choice.

  I say the founders are not here to starve. I say the woman who swore the oath is not here to bleed. I say you are the only one who can sign. But if you sign, you sign knowing there is a one in three chance you are killing your neighbors to save them.

  This is the Clause of the Unmade. It requires a petitioner who does not know what they are releasing. It is the only design that could ever work, because only ignorance is innocent. But it is intolerable, because only knowledge is responsible. We need you to be innocent to file the petition. We need you to be responsible to mean it.

  I have told you. You know the number. You know the risk. By the spirit of the Instrument, you are Apprised. You are a Keeper. You cannot file.

  Olin stirs in the other room. The lamp flickers. The oil is gone.

  I stand up. I walk to the iron chest where the sheets lie. They are vellum, thick as leather. They smell of dust and old ink. They contain the engineering specs. They contain the revised figures. They contain the reason to save you, and the reason to drown you.

  If I keep them, Olin will wake. He will argue. He will win. The League will starve. The Bond will hold. The dead will rule the living.

  If I give them to you, you are Apprised. You cannot file. The Bond holds. The League starves.

  There is only one way to make the petition valid. You must be Unapprised. You must not know. But you must want.

  I take the sheets from the chest. I hold them over the brazier. The coals are red, dying slowly.

  If I burn them, the record is gone. The Apprising cannot be completed. There are no sheets to read. You remain legally Unapprised. You can file. The petition will be valid. The League will drain the valley. They will use my word, and your signature. They will gamble on the one in three.

  If I burn them, the engineering specs are gone too. We know the valley can be drained, but we do not know how. We might try and fail. We might breach the wall prematurely. The flood might come anyway. The League drowns. The Bond is kept by accident.

  I look at you. You do not move. You are a ghost. You are a woman. You are the daughter of the miller. You are the Second Keeper. You are the sacrifice.

  I drop the sheets into the fire.

  The vellum curls. The ink blackens. The smoke rises, thick and acrid. It smells of burning hair. It smells of the mourning cakes. The edges glow orange. The numbers turn to ash. The one in three vanishes. The engineering vanishes.

  Olin calls out from the inner room. He asks what is burning.

  I do not answer. I watch the fire. The sheets are gone. You are Unapprised. There is nothing to read. You are free to file. You are free to guess.

  I pick up the pen. I lay it on the table before you. The petition form is blank. It waits for three names. Olin's. Mine. Yours.

  The sun is not yet up. The wind howls outside. The blight waits.

  I sit down. I fold my hands. I wait for you to take the pen.

  ***

  **Note**

  The story tests the argument that constitutional entrenchment via epistemic restriction (controlling knowledge rather than options) creates a moral hazard where the "living" are rendered incapable of responsible agency. The structure favors the "living" (the Girl/Narrator) by demonstrating that the legal mechanism designed to preserve the bond (the Clause of the Unmade) relies on a fiction of identity that collapses under material necessity. The device is the burning of the sheets: it simultaneously validates the petition (by erasing the record of Apprising) and invalidates the safety of the decision (by destroying the data), forcing the reader to choose between procedural legitimacy and substantive survival. The story is weakest in assuming the destruction of physical records effectively resets the legal status of "Apprised" despite the verbal transmission of knowledge, relying on a formalism that may feel too brittle to sustain the philosophical weight.
