answer: |-
  # The test, stated as charitably as you can

  Your friend's Withdrawal Test is designed to bypass the endless semantic wrangling over what counts as a "secular" reason. Instead of policing vocabulary, it polices dependency. The procedure is straightforward: take a citizen supporting a coercive law based on a mix of religious and non-religious reasons. Ask a counterfactual question: If you subtracted the religious premise from their belief system, would they still support the law with the same conviction? If the answer is yes, the secular reasons are doing the heavy lifting, and the support counts as publicly justified. If the answer is no, the religious premise was load-bearing, and the support fails the test. The genius of the proposal is that it shifts the burden from the public square to the private conscience. It doesn't matter if a reason sounds theological; what matters is whether the commitment survives the removal of the theology. It promises a bright line for admissibility without requiring a dictionary of acceptable secular terms.

  # What it gets right

  The Withdrawal Test identifies a genuine weakness in standard public justification models: the ease with which citizens can game the system by dressing up theological claims in secular clothing. Rawlsian proviso and Audi's principle of secular rationale often devolve into linguistic compliance. A clever advocate can rephrase "sin" as "social harm" without changing the underlying logic. Your friend's test cuts through this performative secularism by focusing on sincerity and stability. It correctly intuits that public justification requires reasons that are stable across different comprehensive doctrines. If a citizen's support for a law evaporates without their specific revelation, that law is not justified *to* the public, but only *by* a sect.

  Furthermore, the test respects the integrity of the believer better than a strict vocabulary ban. It allows religious language in the public square, provided it isn't the sole pillar holding up the argument. This aligns with the democratic intuition that citizens shouldn't have to lobotomize their identity before voting, provided their political commitments are robust enough to stand on shared ground. It also avoids the impossible task of defining "secular" once and for all. Whether natural law or Kantian dignity counts as secular is irrelevant; if the belief holds without the divine command, it passes. This pragmatic focus on the functional role of reasons rather than their genealogy is the test's strongest asset. It treats public justification as a matter of structural independence rather than semantic purity.

  # Where it breaks

  Despite its elegance, the Withdrawal Test commits a category error that renders it unusable. Public justification is a normative standard for laws, not a psychological profile of voters. Whether a law is justified depends on whether reasons exist that are accessible to all citizens, not on whether a specific individual happens to be convinced by them. If a believer supports a ban on murder for religious reasons, but secular reasons for that ban abound, the law is publicly justified regardless of the believer's internal dependency. The test conflates the *source* of a citizen's motivation with the *status* of the law's justification.

  The counterfactual itself is also metaphysically incoherent. Beliefs exist in webs, not silos. You cannot subtract "God exists" and hold everything else fixed. If a Catholic removes the doctrine of the *Imago Dei*, their entire conception of human dignity might collapse, altering their view on countless secular issues. The test asks for a simulation that the human mind cannot run.

  Consider the case of the death penalty. Many Catholics oppose capital punishment based on religious premises regarding the sanctity of life and redemption. If we apply the Withdrawal Test, we ask: Would this Catholic oppose the death penalty if they stopped believing in God? Often, the secular residue left behind supports retributive justice, not mercy. The test would conclude that the *death penalty* is the publicly justified position, because the secular reasons support harshness while the religious reasons supported restraint. This is absurd. The test penalizes the believer for being more moral than their secular counterpart. It implies that religiously motivated restraint is illegitimate coercion, while secularly motivated harshness is public reason. Finally, the test fails to distinguish between voters and officials. Applying this introspection to voters is unenforceable; applying it to legislators demands a transparency of motive that constitutional law rightly protects against. The test breaks because it measures the wrong thing: it measures psychological dependency rather than public availability.

  # How it compares to the existing options

  When positioned against the established landscape, the Withdrawal Test looks like a solution to a problem that has already been better solved or differently framed. Rawls's proviso requires that proper political justification be offered in due course, not that the psychological motivation be secular. Rawls cares about the output of the debate, not the internal wiring of the debater. Audi's principle of secular rationale is stricter, demanding secular reasons be sufficient prior to advocacy. The Withdrawal Test tries to split the difference but ends up more invasive than Audi without being more practical.

  Habermas's institutional translation proviso distinguishes between the informal public sphere, where religious language is welcome, and the formal sphere of courts and parliaments, where translation is required. The Withdrawal Test ignores this institutional distinction, applying the same psychological test to a voter in a booth and a judge on the bench. This collapses the asymmetry that makes democratic deliberation possible.

  Compared to the conscientious engagement view of Wolterstorff and Eberle, the test is hostile. They argue that asking citizens to bracket religious reasons violates their integrity. The Withdrawal Test claims to respect integrity by allowing religious speech, but it ultimately disqualifies the vote if the religious reason was essential. It still demands a form of self-alienation: you must be willing to be the person you would be without your faith. Finally, against the convergence view, which allows diverse reasons to converge on a policy, the Withdrawal Test is too individualistic. Convergence looks at the ecosystem of reasons available in society; the Withdrawal Test looks inside a single skull. It inherits the restrictiveness of Rawls and the psychological intrusiveness of his critics, without securing the benefits of either.

  # Verdict

  You should tell your friend to toss the Withdrawal Test. It is a clever heuristic that fails as a normative standard. The fundamental flaw is that it confuses the genealogy of a belief with its justificatory status. A law is publicly justified if there are sufficient secular reasons available in the public square to support it, not if every individual citizen possesses those reasons independently of their faith. The test's failure on the "restrained believer" case is fatal; a standard that classifies religiously motivated mercy as unjustified coercion while accepting secularly motivated harshness as public reason is morally inverted.

  Patching is not an option because the error is structural. You cannot fix a test that measures psychological dependency when the goal is normative availability. Any patch that corrects for the "restrained believer" problem would require comparing the believer's secular reasons against the available public reasons, which simply returns you to the Rawlsian or Audi models you were trying to avoid. The test promises to bypass the definition of "secular," but it cannot function without implicitly defining what the secular residue *should* look like. Throw it out. Stick to evaluating the reasons actually offered in public discourse, not the counterfactual psychology of the people offering them.
