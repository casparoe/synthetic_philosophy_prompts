answer: |-
  # Activity Design: The Care Trap

  ## 1. Facilitator's Sheet

  ### Materials & Setup
  *   **Room:** 11 tables (Households). 22 Students.
  *   **Handouts:**
      *   **Household Record Sheet (1 per table):** Tracks wages, care decisions, income, and tokens.
      *   **Private Wage Card (2 per table):** Sealed envelopes. One says "Partner A," one "Partner B." Contains initial wage and "Earner Type" (High or Low).
      *   **Leave Tokens (Physical chips):** Round 1: 11 chips (1 per household). Round 2: 22 chips (1 per student).
  *   **Public Board:** To display Market Care Price, Aggregate Care Statistics, and Token Exchange Rate.
  *   **Stakes:** "Policy Points." 100 Points = 0.5% added to the final course grade. (Max possible ~500 points per student). This is high enough to induce stress/engagement but low enough to avoid ethical review issues.

  ### The Economic Parameters
  *   **Market Care Price ($P_c$):** **$14** per round. (Posted publicly).
  *   **Care Requirement:** Each household *must* secure care for one child each round.
      *   **Option A (Market):** Pay $14. Both partners work.
      *   **Option B (Parental):** One partner stops working to provide care. Income = Wage of working partner. (Care cost $0).
  *   **Leave Entitlement (The Subsidy):**
      *   If a partner uses a **Leave Token**, they provide Parental Care *but* are paid their full wage (as if working).
      *   *Effective Income with Token:* Wage of working partner + Wage of caring partner. (Care cost $0).
  *   **Wage Penalty (Human Capital):** Any partner who provides Parental Care (Option B), *with or without a Token*, suffers a **10% wage reduction** for the next round.
  *   **Statistical Discrimination (The Externality):**
      *   Partners are secretly typed **High (H)** or **Low (L)**.
      *   If **>50% of all Low-Type partners** in the room provide Parental Care in a round, *all* Low-Type partners (even those who worked) suffer an **additional 5% wage reduction** next round.
      *   *Note:* High-Type partners are immune to the Statistical Penalty.

  ### Household Types (Distribution)
  Prepare 11 envelopes. Distribute randomly, but ensure the following mix to generate the intended data:
  *   **Type 1 (Wide Gap):** 5 Households.
      *   Partner A (H): $20 | Partner B (L): $10.
  *   **Type 2 (Narrow Gap):** 4 Households.
      *   Partner A (H): $16 | Partner B (L): $12.
  *   **Type 3 (Equal/High):** 2 Households.
      *   Partner A (H): $15 | Partner B (L): $15. (Both typed "Low" for statistical purposes to ensure the threshold is reachable).

  ### Timeline (80 Minutes)

  | Time | Activity | Facilitator Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Setup.** Pair students. Hand out Record Sheets & Sealed Wage Cards. | Do not explain the *why*. Only the *how*. "Maximize Household Income." |
  | **05-15** | **Round 1.** (Transferable Entitlement). | Distribute 1 Token per household. They decide: Who works? Who cares? Use Token? Record Income. |
  | **15-20** | **Calculation & Penalty.** | Collect care decisions. Calculate Statistical Penalty (if >50% Low-Types cared). Announce new wages privately. |
  | **20-30** | **Round 2.** (Non-Transferable Quotas). | Distribute 1 Token per *student*. Rule: Tokens cannot be traded. Decide again. |
  | **30-35** | **Calculation.** | Final Income tally. Convert to Policy Points. |
  | **35-40** | **Data Reveal.** | Project aggregate stats: % of Low-Types who cared, % of Tokens lapsed, Wage compression. |
  | **40-80** | **Debrief.** | See Section 2. |

  ### Payoff Arithmetic (For Facilitator Verification)
  *Scenario: Type 1 Household ($20 / $10). Care Price $14.*

  **Round 1 Choices:**
  1.  **Both Work:** Income = $20 + $10 - $14 = **$16**. (No penalty).
  2.  **Low Earner Cares (No Token):** Income = $20 (High works). Low Earner wage next round: $9.
  3.  **Low Earner Cares (With Token):** Income = $20 + $10 = **$30**. Low Earner wage next round: $9. *(Rational Dominant Strategy)*.
  4.  **High Earner Cares (Against Grain, No Token):** Income = $10. High Earner wage next round: $18. *Cost vs Option 2: $10 immediate loss.*
  5.  **High Earner Cares (Against Grain, With Token):** Income = $30. High Earner wage next round: $18. *Cost vs Option 3: Future wage damage to the higher asset.*

  **Round 2 (Assuming Low Earner Cared in R1):**
  *   New Wages: High $20, Low $9. (If Statistical Penalty triggered, Low is $8.55).
  *   Care Price: $14.
  *   **Rational Choice:** Low Earner Cares again. Income = $20.
  *   **Token Lapse:** High Earner has a token. If they use it, they care. Income = $9 (Low works) + $20 (High paid) = $29.
      *   *Wait, compare to Low Caring with Token:* Income = $20 (High works) + $9 (Low paid) = $29.
      *   *Indifferent on income, but High Earner token use damages the $20 wage asset.*
      *   *Result:* High Earner lets token lapse. Low Earner uses theirs (if they have one) or cares unpaid.
      *   *In Round 2, everyone gets a token.*
      *   If Low uses token: Income $29. Low wage R3 drops.
      *   If High uses token: Income $29. High wage R3 drops.
      *   *Rational:* Low uses token. High lets token lapse (or uses it only if they don't care about R3).
      *   *Intended Lapse:* High Earner token lapses because using it requires them to care, which damages the primary income source.

  **Specializing Against the Grain (Type 1):**
  *   If they force High Earner to care in Round 1 (using Token): Income $30.
  *   Round 2 Wages: High $18, Low $10.
  *   Round 2 Income (Low Cares): $18.
  *   *Comparison:* Standard path yields R1($30) + R2($20) = $50. Against Grain yields R1($30) + R2($18) = $48.
  *   *Verdict:* The cost is real ($2 loss over 2 rounds) but survivable. It demonstrates that "doing the right thing" (protecting the low wage) is individually irrational without coordination.

  ### Statistical Discrimination: Implementation Advice
  **Option A (Individual Penalty):** Only the person who takes leave gets penalized.
  *   *Fidelity:* Low. Ignores the signaling effect to employers.
  *   *Runnability:* High. Easy to track.
  **Option B (Group Penalty):** If >50% of Low-Types care, *all* Low-Types are penalized.
  *   *Fidelity:* High. Captures the "choice alters wage structure for later households" requirement.
  *   *Runnability:* Medium. Requires facilitator to aggregate data between rounds.
  *   **Recommendation:** Use **Option B**. It is essential for the "collective action" learning goal. To save time, do not use a student employer. You (Facilitator) announce the rule: *"The market cannot observe individual productivity, only group trends. If the majority of Low-Wage earners exit the workforce, the market devalues that category."* This prevents students from debating the employer's rationality and focuses them on the structural outcome.

  ---

  ## 2. The Debrief (40 Minutes)

  **Phase 1: The Numbers (10 mins)**
  *   "Look at your final incomes. Did the household with the widest wage gap end up richest or poorest?" (Likely richest, reinforcing the efficiency trap).
  *   "Raise your hand if you let a Leave Token lapse in Round 2." (Expect High Earners).
  *   "Raise your hand if your wage dropped even though *you* worked both rounds." (Expect Low Earners if Statistical Penalty triggered).

  **Phase 2: Mapping Concepts (15 mins)**
  *   **Formal vs. Substantive Neutrality:** "The rules for Tokens were identical for Partner A and Partner B in Round 2. Was the *outcome* neutral?"
      *   *Target:* Students identify that formal equality (1 token each) led to substantive inequality (High earners couldn't use them without high cost).
  *   **Endogenous Preferences/Constraints:** "Did your Round 2 choice feel like a 'free choice'?"
      *   *Target:* They should feel constrained by Round 1's outcome. The wage gap wasn't nature; it was produced by the game.
  *   **Statistical Discrimination:** "Who punished the Low Earners who worked hard and didn't take leave?"
      *   *Target:* "The other Low Earners." "My neighbor's choice cost me money."
  *   **Collective Action:** "Could you have achieved a better group outcome if you coordinated?"
      *   *Target:* Yes. If all High Earners cared in Round 1, the Low Wage floor wouldn't have collapsed. But no single household could afford to switch.

  **Phase 3: Responsibility & Neutrality Defense (15 mins)**
  *   **The "No One" Question:** "Look around the room. Who acted wrongly? Which household made a moral error?"
      *   *Expected Answer:* "No one." Everyone maximized income given constraints.
      *   *Follow-up:* "If no one acted wrongly, but the outcome is a collapsed wage floor for half the room, where does the responsibility sit?" (Moves blame from agents to structure).
  *   **Defending Neutrality:** "Imagine a policymaker argues: 'Some households genuinely benefited from specializing. Type 1 households made $50. If we forced gender-neutral take-up, they might have earned less. Why is the neutral rule bad?'"
      *   *Target:* Students must argue that the *distribution* of that benefit relies on a class of people (Low Earners) being systematically disadvantaged in future rounds. Efficiency for the household $\neq$ Justice for the system.
      *   *Key Distinction:* The policy isn't "bad" because it lowers total wealth (it might not), but because it locks in arbitrary initial advantages (the random wage assignment) into permanent caste-like structures.

  ---

  ## 3. Failure Modes & Mitigations

  | Failure Mode | Risk | Mitigation |
  | :--- | :--- | :--- |
  | **Principled Splitters** | A pair refuses to specialize, splits care 50/50, and gets punished by the math (both wages drop). | **Rule:** Care is binary. You either work or you care. No splitting. If they argue, say: "The labor market in this simulation does not recognize part-time care as valid employment." Keep it structural, not moral. |
  | **Romantic Couples** | Two students paired together know each other well/collude. | **Randomize:** Draw names from a hat. If a couple ends up together, treat them as any other household. If they collude *across* tables (shouting answers), warn them once, then deduct tokens. |
  | **Early Pre-Commitment** | A student spots the collective action trap in Round 1 and shouts "Everyone make the High Earner care!" | **Information Asymmetry:** Do not allow inter-household communication during decision phases. "Households deliberate in private." If they shout, invalidate the round and restart (time cost discourages this). |
  | **Arithmetic Bog-Down** | Students spend 20 mins calculating percentages. | **Provide Calculators/Sheets:** The Record Sheet should have the 10% and 5% multipliers pre-printed. You announce the "Statistical Penalty" as a flat number once calculated (e.g., "Low Wages drop by $0.50"). |
  | **Advocacy Bias** | The exercise feels like a lecture on why "Neutrality is bad." | **Facilitator Neutrality:** Never use the word "unfair." Ask: "Is this stable?" "Is this efficient?" "Who bears the risk?" Let them supply the normative judgment. If a student defends neutrality vigorously, validate their data: "You're right, your household did maximize income. The question is about the system, not your play." |

  ---

  ## 4. Limitations (What the Game Cannot Reproduce)

  *Be prepared to state these explicitly in the final 5 minutes to prevent over-generalization.*

  1.  **Affective Value of Care:** In the game, care is a cost to be minimized. In reality, caring for one's child is often a source of meaning and utility. The game models care as *labor*, not *love*.
      *   *Fix:* Acknowledge in debrief. "If care provided utility, would the Low Earner still be the only one doing it? Or would the High Earner fight for the right to care?"
  2.  **Exogenous Starting Wages:** In the game, the $20/$10 split is random. In reality, wage gaps are often the *result* of prior discrimination (sexism, racism). The game understates the circularity.
      *   *Fix:* Point out: "In the real world, the 'Low Earner' is rarely random. The game makes the trap look accidental; reality makes it look targeted."
  3.  **Social Stigma:** In the game, High Earners let tokens lapse due to math. In reality, they might lapse due to shame ("men don't take leave").
      *   *Fix:* Note that adding stigma would make the "Against Grain" choice even costlier, reinforcing the trap.
  4.  **Short Horizon:** The game is 2 rounds. A career is 40 years. Myopic specialization is rational in the game; it might be less rational over a lifetime if wage recovery is possible.
      *   *Fix:* "We compressed a career into 20 minutes. In a longer game, diversification (both partners working part-time) might become rational. But the penalty structure makes that hard."

  ### Final Facilitator Note
  **Do not solve the problem.** Your job is to make the trap visible, not to propose the legislation that fixes it. If students ask "So what should the policy be?", answer: "That is your paper topic. Today, we just built the machine."
