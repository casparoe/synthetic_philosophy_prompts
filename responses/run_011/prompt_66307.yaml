      *   *Tokens:* Award based on Household Income relative to a baseline.

  4.  **Developing the Debrief:**

      *   Need to move from "What happened?" to "Why?" to "Is it just?"
      *   Key Concept: Formal Neutrality (Rules same for all) vs. Substantive Neutrality (Outcomes same).
      *   Key Concept: Statistical Discrimination (Employer infers productivity from group behavior).
      *   Key Concept: Collective Action (My choice lowers wages for you).
      *   Crucial Question: "Who acted wrongly?" (Answer: No one. Everyone maximized.)
      *   Crucial Question: "Did the neutral rule fail?"

  5.  **Addressing Failure Modes:**

      *   *Principled Splitters:* If a pair splits care (both work half time?), the math needs to handle it or the facilitator needs to rule it out. Let's rule it out for simplicity (binary choice: Work or Care) to prevent arithmetic bog-down. If they insist, treat as "Both Work" but pay penalty to both? No, keep it binary. If they argue, note it as a "coordination cost."
      *   *Couples:* Randomize pairs. If couples end up together, treat as normal. If they collude across households, that's the "pre-commitment" risk.
      *   *Pre-commitment:* If they figure out the collective action, they might all agree to have High Earners care. This breaks the "trap." *Solution:* Make communication between households impossible during the round.
      *   *Advocacy:* Facilitator must remain neutral. "The numbers show X." Not "X is bad."

  6.  **Addressing Limitations:**

      *   Affective value of care (not in game).
      *   Prior discrimination (starting wages are exogenous).
      *   Stigma (not modeled).
      *   Horizon (only 2 rounds).
      *   *Advice:* Explicitly state these in the "Limitations" section.

  7.  **Refining the Statistical Discrimination Mechanism:**

      *   Prompt asks for two implementations.
      *   1. Individual Penalty: You took leave, your wage drops. (Easier to run).
      *   2. Group Penalty: If >50% of "Partners" take leave, all "Partners" wages drop. (Better for political philosophy/collective action).
      *   *Recommendation:* Use the Group Penalty for the "Market Rate" adjustment. It better illustrates the "choice alters wage structure for later households" requirement.
      *   *Employer Role:* Don't use a student employer. Too much variance. Facilitator administers the rule based on aggregate data. It ensures the mechanism triggers reliably for the lesson.

  8.  **Finalizing the Math & Tokens:**

      *   Need to ensure the "Specialize Against Grain" cost is survivable.
      *   If H cares (Income = L) vs L cares (Income = H). Loss = H - L.
      *   If H cares, H's wage drops. L's stays same.
      *   Next round, if L cares again: Income = H(new). If H cares again: Income = L.
      *   Need to make sure the token conversion feels real. 10 tokens = 0.1% of course grade. Max 5%.

  9.  **Review against Constraints:**

      *   22 students -> 11 households.
      *   80 minutes.
      *   No lecture beforehand.
      *   Transferable -> Non-transferable.
      *   Debrief questions included.
      *   Failure modes included.
      *   Limitations included.

  10. **Writing the Output:** (Self-Correction during drafting)
      *   *Correction on Care Cost:* If Care Cost is market price, and one parent cares, the household *saves* that cost.
      *   *Income Formula:*
          *   Option A (Both Work): $W_1 + W_2 - \text{MarketCare}$.
          *   Option B (1 Cares): $W_{\text{worker}}$. (Care cost is 0, Caregiver earns 0).
      *   *Rationality Check:*
          *   Both Work is better if $W_1 + W_2 - M > W_{\text{high}}$. i.e., $W_{\text{low}} > M$.
          *   If $M > W_{\text{low}}$, then One Cares is better.
          *   If One Cares, who? The one with lower $W$.
      *   *Penalty:* If you care, your $W$ drops by 20% next round.
      *   *Statistical Discrimination:* If >50% of Low Earners care, the Market Care Price $M$ drops? No, the prompt says "wage penalty." Let's make it: If >50% of Low Earners care, employers assume Low Earners are "care-prone" and offer them 10% less wage *on top* of the individual penalty. This hits the "group" aspect.
      *   *Wait, simpler:* The prompt asks for "wage penalty... for the earner who supplied parental care." And "statistical discrimination... applied where employer cannot observe."
      *   *Revised Mechanism:*
          *   Individual Penalty: If *you* care, your wage drops 10% (Human Capital).
          *   Statistical Penalty: If *more than half the room's* designated "Low Earners" care, *all* Low Earners (even those who didn't care) suffer an extra 5% drop (Signaling).
          *   This creates the collective action problem. My rational choice hurts your wage.

      *   *Wait, one more check:* "Replace transferable entitlement with individual, non-transferable... quotas."
      *   Round 1: 1 Leave Token per household. Transferable.
      *   Round 2: 1 Leave Token per *person*. Non-transferable. Use or lose.
      *   This forces the "Lapse" scenario. If High Earner has a token but it's cheaper for Low Earner to care, High Earner token lapses.
      *   Debrief: Is the lapsed token a policy failure?

      *   *Okay, ready to write.*

      *(Self-Correction on Time)*: 80 minutes is tight for 3 rounds. I will design for 2 substantive rounds + Debrief. Round 1 (Transferable), Round 2 (Non-Transferable + Penalties).
      *(Self-Correction on Stakes)*: Make sure the grade component is small enough to be ethical but large enough to matter. 2% of final grade is standard for participation. 100 tokens = 0.1%. Max 200 tokens.

      *(Final Polish on Math)*:
      Type 1 (Wide): $20 / $10. Care Cost $15.
      Type 2 (Narrow): $16 / $14. Care Cost $15.
      Type 3 (Equal): $15 / $15. Care Cost $15.
      *Wait, if Care Cost is $15 and Wages are $15/$15, they are indifferent.* Let's make Care Cost $16.
