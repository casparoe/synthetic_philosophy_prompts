      *Key point to articulate:* The distinction isn't just about addressing (location), it's about volatility and physical realization. Logical memory in the brain might be the wiring itself (slow to change), while arithmetical is the firing states (fast to change). In a PC, both are RAM. This changes the architecture fundamentally.

      *Verdict on Thesis:* The "scale only" claim is not defensible against Von Neumann's actual text. He explicitly lists other differences (precision, error, analog/digital mix). The student needs to pivot to "architectural differences within a computational framework."

