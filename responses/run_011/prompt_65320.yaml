answer: |-
  Hi there, it sounds like you have a really engaging topic for your final paper and you have clearly done a close reading of The Computer and the Brain, especially regarding the all-or-none nature of nerve impulses and the sheer scale of neural storage. However, I need to be direct with you because your professor is pointing out a fault line in your argument that could undermine your whole thesis if you do not address it. The distinction Von Neumann draws between arithmetical and logical memory is not merely an implementation detail about how bits are addressed, but rather a fundamental claim about how information is physically realized and accessed in the brain versus the machine. In the stored-program computers Von Neumann helped design, both the data and the instructions are stored in the same uniform memory space, meaning the rules of operation are just another set of numbers that can be rewritten on the fly. When Von Neumann looks at the brain, however, he suspects this unity does not hold. He suggests that what we might call logical memory, or the rules governing how the system behaves, is likely embedded in the anatomical structure of the neural network itself, meaning the wiring is the program. In contrast, arithmetical memory, or the sensory data and intermediate results, is carried by the transient states of firing impulses. This matters because if the logical rules are structural rather than stored data, you cannot separate the software from the hardware in the brain the way you can in a digital computer, which challenges the idea that the mind is a program running on neural hardware.

  Regarding your specific claim that the difference between brains and computers comes down to size and speed only, I have to tell you that this is not defensible based on Von Neumann's actual text and it will likely leave you vulnerable during evaluation. While Von Neumann does emphasize the digital nature of the pulse transmission, he explicitly highlights several qualitative differences beyond mere scale. He notes that the brain operates with much lower precision than artificial computers, relying on statistical methods and error tolerance rather than exact arithmetic, which suggests a different kind of computational logic entirely. He also discusses the role of frequency coding, where the analog rate of firing carries information alongside the digital presence of the pulse, creating a hybrid system that is not strictly digital in the way a Turing machine is. If you argue that it is only a matter of scale, you are ignoring Von Neumann's own caution that the brain might use a different language of computation that we have not yet fully deciphered, rather than just speaking binary faster than a 1950s mainframe.

  To save your argument without starting over, you should pivot from claiming identity to claiming structural homology. You can maintain that Von Neumann laid the groundwork for the computational theory of mind by establishing that neural activity is information processing, but you need to concede that he saw the architecture as distinct. You can argue that Von Neumann settled the question of whether the brain is a computational system, but not necessarily that it is a von Neumann architecture machine in the strict sense. By acknowledging that the arithmetical and logical memory distinction points to a difference in how rules are instantiated, you actually strengthen your analysis of his work because it shows you understand the nuance of his comparison rather than flattening it into a simple slogan. Your professor wants to see you grapple with the fact that Von Neumann saw the brain as a computer but not necessarily our kind of computer, and incorporating that tension will make your paper much more sophisticated than a straightforward reductionist claim.

  I hope this helps you navigate the feedback and refine your thesis into something that holds up to scrutiny. You have done the hard work of engaging with the primary text, so now you just need to adjust the interpretation to match the complexity Von Neumann himself was wrestling with in those final lectures. Good luck with the revision and let me know if you need to talk through how to phrase that pivot in your draft.
