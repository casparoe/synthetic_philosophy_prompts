  Surpass the **Proof**,
  And keep the **Law**.

  The structure inevitably favors Brown; the intrusion of Law mimics a priori insight emerging from nowhere. However, the seventh word is a strawman against Norton. He argues the insight is psychological, not epistemic—the "new" word was always implicit in the premises, merely unpacked. By making Law formally distinct, the poem suggests ontological novelty Norton denies. Physically, Stevin's argument relies on the empirical premise that perpetual motion is impossible, which Norton would cite as the hidden empirical input, not a Platonic law. The poem hides this premise to make the "break" feel magical. Formally, the sestina break is a cheat—you cannot add a seventh end-word without dropping one (I dropped Move), which ironically proves Norton's point: something old must leave for the new to enter. The form cannot carry the weight without breaking its own rules, just as Brown's account struggles to explain where the knowledge comes from without smuggling it in.
