  ### Final Verdict

  **Is this dispute substantive or verbal?**

  It is **substantive regarding foundations, but verbal regarding arithmetic.**

  If your question is "What number should I bet?", the dispute is verbal. Both frameworks output 20%. You can safely ignore it at the betting table.

  If your question is "Why is 20% rational?", the dispute is substantive.
  *   **Friend 2** claims rationality is defined by consistent preferences (axioms of utility). If you bet 20%, it reveals you *happen* to like logs.
  *   **Friend 1** claims rationality is defined by survival in a specific physical process. If you bet 20%, it is because the *math of time* forces you to, regardless of your "taste."

  **What observation would settle it?**
  To settle the dispute, you would need a scenario where **time-averaging does not converge to the ensemble expectation of the log.** This happens in **non-ergodic processes with path dependence** that are not simple i.i.d. multiplicative chains (e.g., bets where the odds change based on your current wealth level, or where there are memory effects).
  *   In such complex dynamics, the "Log-Utility" agent (maximizing $\mathbb{E}[\ln W_T]$) might diverge from the "Time-Average" agent (maximizing the realized trajectory growth).
  *   However, in the "ordinary setting" of independent repeated bets you requested, the Law of Large Numbers binds them together.

  **Recommendation for Sunday Coffee:**
  Tell them: *"Mathematically, you are both right. Log-Utility and Time-Average Growth yield the exact same Kelly fraction in this game. The fight isn't about the bet size; it's about whether risk aversion is a psychological preference or a physical necessity. Friend 1 says it's physics; Friend 2 says it's psychology. The arithmetic doesn't care, but the philosophy does."*
