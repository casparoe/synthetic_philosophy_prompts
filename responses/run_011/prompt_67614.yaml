  ### The Friends' Attacks

  Since I cannot give you a numerical divergence, I will give you the argumentative divergence. Here is how each friend attacks the equivalence I just demonstrated.

  #### Friend 2 (The Expected Utility Theorist)
  **The Attack:** "You haven't proven dynamics derive utility; you've just relabeled a preference. To say one should maximize the time-average growth rate is simply to *assert* that one cares about the geometric mean rather than the arithmetic mean. Why care about the geometric mean? Only because you have a logarithmic utility function! If you had a square-root utility function, you would maximize a different growth metric. The 'Ergodicity' argument is just a physics costume worn by standard Bernoulli utility theory. You smuggled in risk aversion by choosing to look at log-wealth instead of wealth."

  #### Friend 1 (The Ergodicity Economist)
  **The Attack:** "You are confusing the *map* with the *territory*. I do not *assume* a logarithmic utility function. I observe that wealth multiplies. In a multiplicative world, the arithmetic average (Expected Value) is non-ergodic—it does not represent what happens to a single person over time. The logarithm is not a 'preference'; it is the mathematical function that makes the process ergodic. If you maximize Expected Value, you go bankrupt. If you maximize Time-Average Growth, you thrive. The fact that this looks like Log-Utility is a theorem, not an assumption. It shows that 'risk aversion' is often just a rational response to non-ergodic dynamics, not a psychological quirk."

