answer: |-
  ### The Two Explananda

  **Explanandum 1: Reliability.** Why do our mathematical beliefs systematically correspond to mathematical truths? Given that mathematical truths (on a realist semantics) are causally inert, the correlation between our cognitive states and these truths appears accidental. An adequate theory must explain this correlation without invoking luck.

  **Explanandum 2: Authority.** Why does mathematics function as a normative constraint on empirical inquiry? In the laboratory, when calculation and measurement diverge, the calculation vetoes the measurement. Mathematics dictates which physical outcomes are possible. An adequate theory must explain why mathematical truths possess this binding authority over the physical world, an authority that mere empirical generalizations or useful fictions do not possess.

  **Can one theory satisfy both?**
  Yes, in principle, but no extant theory satisfies both without significant cost. To satisfy Authority, a theory generally requires robust truth conditions (Realism). To satisfy Reliability, a theory generally requires a naturalistic causal story (Naturalism). These two requirements pull in opposite directions. A theory that satisfies both must either naturalize abstract objects (risking the loss of Authority) or mystify our access to them (risking the loss of Reliability). I treat the conjunction as satisfiable, but it is the bottleneck that eliminates almost every candidate.

  ***

  ### Assessment of Candidate Requirements

  **1. Uniformity with Empirical Knowledge**
  *   **Motivation:** Theoretical parsimony; avoids positing a special "mathematical faculty."
  *   **Assessment:** **Discard as Non-Negotiable.** Mark as **Preference.**
  *   **Grounds:** You correctly identify this as a naturalist article of faith. Mathematical justification (proof) operates differently from empirical justification (observation). Demanding they be the same *genus* prejudices the case against *a priori* accounts. A specification should demand an explanation of the difference, not deny it.

  **2. Proof vs. Measurement**
  *   **Motivation:** Captures the modal force of mathematics (necessity) versus the contingency of science.
  *   **Assessment:** **Keep.** Mark as **Non-Negotiable.**
  *   **Grounds:** This is a functional description of the practice. Any theory that implies mathematical truths could be overturned by new data fails to describe what mathematics *is*.

  **3. Coverage of Idle Regions**
  *   **Motivation:** Truth conditions should not depend on human verification (anti-realism).
  *   **Assessment:** **Keep.** Mark as **Non-Negotiable.**
  *   **Grounds:** A semantics that makes truth valueless for unproven conjectures fails to account for the objective content of mathematical discourse. The specification must cover the domain, not just the known subset.

  **4. No Cosmic Coincidence**
  *   **Motivation:** The core of Benacerraf's epistemological challenge.
  *   **Assessment:** **Keep.** Mark as **Non-Negotiable.**
  *   **Grounds:** Without this, the reliability problem is trivialized by saying "we just got lucky." A serious specification must demand a mechanism or necessary connection explaining the match.

  **5. Generalization to Logic/Ethics**
  *   **Motivation:** Theoretical economy; unified metaphysics.
  *   **Assessment:** **Discard as Non-Negotiable.** Mark as **Preference.**
  *   **Grounds:** You are right to suspect this is flattery. Mathematics might be *sui generis*. Demanding a theory of math also solve ethics risks forcing a Procrustean fit that distorts the mathematics to suit the ethics, or vice versa.

  **6. Compatibility with History/Sociology**
  *   **Motivation:** Ensures the theory describes actual mathematicians, not idealized agents.
  *   **Assessment:** **Keep as Constraint.** Mark as **Preference.**
  *   **Grounds:** There is a distinction between the *context of discovery* (messy, sociological) and the *context of justification* (logical). A theory of knowledge need not model the psychology of guessing, but it cannot contradict the fact that verification is a public, temporal process.

  ***

  ### The Neutrality Difficulty

  Treat this as a **Requirement for the Specification**, not an objection to list-making. The specification must be **functionally neutral but substantively rich.**

  If you specify the *mechanism* of knowledge (e.g., "must satisfy causal tracking"), you smuggle in an epistemology that begs the question against Platonism. If you specify too thinly (e.g., "must explain knowledge"), the requirement evaporates and accepts trivial answers.

  **Resolution:** Frame the requirement in terms of *explanatory debt*. The specification should demand: "The theory must identify a feature of the knower, the known, or the relation between them that renders the correlation *non-accidental*." This does not prescribe *which* feature (causal, constitutive, or logical), but it forbids the theory from leaving the correlation brute. It forces the candidate to pay the debt without dictating the currency.

  ***

  ### The Most Eliminative Requirement

  **Requirement 4 (No Cosmic Coincidence)** eliminates the most candidates.

  **Reasoning:** This requirement is the engine of Benacerraf's Dilemma. It is the filter that rejects standard Platonism (which posits objects but cannot explain access) and the filter that rejects naive Naturalism (which posits access but cannot locate the objects). It has the widest reach because it demands a positive story about the *link* between mind and world. Most theories survive by severing the link (Fictionalism) or denying one side of the gap (Anti-Realism). To keep the link and explain it is the hardest engineering task in the field.

  ***

  ### Strategy Assessment

  **Platonism coupled with an evolutionary or selection story**
  This strategy attempts to retain robust truth conditions while naturalizing the knower. It gives up **Requirement 4 (No Cosmic Coincidence)** in its strictest sense. While it argues that evolution selected for true beliefs, the link between biological fitness and abstract truth (e.g., large cardinals) remains indirect at best. The explanation of the match ultimately relies on a pre-established harmony or a luck-based selection that many critics deem insufficient to discharge the "cosmic coincidence" debt.

  **Fictionalism**
  This strategy secures a naturalistic epistemology by denying the existence of mathematical objects. It gives up **Explanandum 2 (Authority).** If mathematical statements are fictions, their "truth" is merely internal to the story. The fictionalist must explain why a fiction constrains physical reagents, usually reducing this authority to pragmatic utility. This fails to capture the *necessity* you observed in the lab, where arithmetic vetoed data rather than merely serving as a useful tool.

  **Structuralism**
  This strategy posits that mathematics describes structures rather than objects. It typically gives up **Requirement 3 (Coverage of Idle Regions)** regarding object identity. If numbers are merely places in a structure, questions about the intrinsic nature of unverified entities become indeterminate. Furthermore, structuralism often struggles to explain how a pure structure constrains physical matter (Explanandum 2) without reintroducing a mapping problem that looks suspiciously like the original access problem.

  **The Neo-Fregean or Abstractionist Route**
  This strategy derives mathematical objects from logical abstraction principles. It gives up **Requirement 1 (Uniformity with Empirical Knowledge).** It explicitly argues that mathematical knowledge is a distinct *sui generis* faculty grounded in logical stipulation rather than empirical interaction. While this secures Authority and avoids Coincidence within the logical domain, it accepts the cost of positing a special epistemological category that naturalists find objectionable.
