answer: |-
  I will target the claim that what makes a cost bearable when imposed on one's own future does not carry across the boundary between lives. By constructing a biology where the boundary is dissolved, I test whether the "separateness" is the only thing protecting the individual, or if the localization of experience itself holds moral weight regardless of metaphysical unity. The story asks whether being one subject is enough to justify sacrifice when the phenomenology remains fragmented.

  ***

  The chair was cold against Kael's spine, a sharp contrast to the fever heat blooming in his chest. Above him, the ceiling tiles were stained with the yellow residue of the ventilation system, pulsing rhythmically like a slow lung. He could feel the others in the wing—hundreds of them in adjacent rooms—breathing in time with him, their nervous systems knitted together by the synaptic mesh running beneath the floorboards. They were one organism, biologically and legally. The Colony was a single subject.

  But Kael's head hurt. It was a specific, localized throb behind his left eye that the mesh did not distribute.

  "Look at the Integral," said Elara. She stood by the console, her hand resting on the haptic interface. She was the Keeper of the Metrics, the only one authorized to interpret the collective state.

  Kael strained his neck. The screen showed a sweeping green curve climbing toward the upper right. The Unity Index. It was higher than it had been in a generation. The Colony was thriving.

  "Now look at your vitals," Elara said softly.

  Kael looked at the secondary monitor clipped to his wrist. His heart rate was erratic. Cortisol spikes. Neural fatigue in the red zone. He knew, from the briefings, that the monitors on the walls of the other chambers were showing the same red. Every member of the wing was deteriorating. Every individual component was failing. Yet the green line on the main screen climbed higher. The Whole was becoming more than the sum of its suffering parts.

  "It doesn't feel like thriving," Kael said. His voice sounded thin in the acoustic dampening of the room.

  "Feeling is local," Elara replied. "The Index is global. You cannot feel the Index, Kael. You know this. No one can introspect the Collective state. We only have the data."

  "I feel pain."

  "The body feels pain so the Organism can learn. You are undergoing the Harmonization. The stress on your neural cluster stabilizes the mesh for everyone else."

  "For everyone else?" Kael tugged at the restraint on his wrist. "You said the Index rises for *us*. For me too."

  "It does. You are part of the Us."

  "I am here. In this chair. The green line is there. On that screen." Kael gestured with his chin. "I don't feel the green line. I feel the red. If I am the same subject as the thing on the screen, why is the pain stuck here? Why doesn't the joy flow back?"

  Elara tapped a command. The green line jumped another notch. On Kael's wrist, the red bar flashed warning. He gasped as a wave of nausea rolled through him. In the next room, he knew, someone else was gasping too. They were all sinking, drowning individually so the ship could rise.

  "Because the substrate is distributed," Elara said, her voice maintaining the calm cadence of the administrator. "The good is in the pattern, not the nodes. When you save for your own future, you endure cost now for reward later. This is the same. The Colony endures cost now for reward later."

  "But I won't be here later," Kael said. "Not like this. If you burn out my cluster, I'm replaced. The Colony continues. I don't."

  "The Colony is you. Your replacement is your own regeneration."

  "It's not me." Kael's vision blurred. "If I cut off my hand, the body lives. But the hand doesn't feel the body's health. It just feels the cut. You're asking me to believe that because the body is one, the hand shouldn't mind the knife."

  "The hand is part of the body," Elara said. She didn't look at him. She was watching the green line. "If the hand refuses the knife, the body dies. Then the hand dies too. The math is simple."

  "The math is on your screen." Kael tried to stand, but the mesh surged. A wave of dizziness forced him back. It wasn't his dizziness alone; it was a ripple from the wing, a synchronized falter. He could feel the others weakening. The Collective good was rising precisely because they were all giving way.

  "If you stop the procedure," Elara said, "the Index drops. The mesh destabilizes. We all suffer then. Not just pain. Dissolution."

  "So I suffer now so we don't suffer worse later."

  "So the Subject survives."

  Kael closed his eyes. He tried to reach out through the mesh, to find the comfort of the rising Index, to feel the unity that justified his agony. He searched for the green line in his nerves. He found only the static of his own firing synapses and the echo of similar pain from the room next door. He was alone inside the We.

  "Show me," Kael whispered. "Show me where I feel the gain."

  Elara paused. Her hand hovered over the console. The green line plateaued, waiting. "You don't feel the gain directly. You infer it. Like you infer your own future happiness when you study hard or save credits. You trust the continuity."

  "I trust my memory," Kael said. "I don't trust your screen. You say I am the Colony. But when I scream, only I hear it. When the Index goes up, only you see it. Where is the boundary, Elara? If we are one, why do I need you to tell me I'm well?"

  Elara looked at him then, really looked at him, for the first time since he was strapped in. Her eyes were tired. She looked at the green line, then at the red bar on his wrist. The Collective good was at a record high. The individual costs were at a record high. The biology held them together, but the experience kept them apart.

  "The boundary is where the data ends," Elara said finally. "And where the pain begins."

  "Then stop."

  "I can't," she said. She turned back to the console. "The Subject requires this. You are the Subject. I am the Subject. We are choosing this."

  "Who is 'we'?" Kael asked. The nausea crested. He couldn't tell if the tears on his face were his or if he was mirroring someone else in the wing. "Because I'm not choosing."

  Elara engaged the final sequence. The green line surged. Kael's monitor flatlined into a steady, painful hum. The Colony was healthier than it had ever been. Kael closed his eyes and waited to feel the health arrive. It did not. He lay in the silence of his own skull, wondering if the unity was real, or if it was just a story the screen told to keep the chairs filled.

  Outside the room, the ventilation pulsed. The lung breathed. The hand remained cut.
