prompt: |-
  Okay so this got very real for me very fast and I could use help from someone who actually knows the tight vs lose culture literature. Act as a cultural psychologist who's done work on tightness/looseness AND has run integration workshops for merged teams — I need both halves, not just one.

  Background: I run ops for a mid-size food ingredients company, four sites, and last year we bought a fifth. On paper it's a great fit. In practice the two crews I just merged into one regional team could not be more different. At the old sites nothing moves without a signed form — lockout/tagout by the book, near-misses written up the same shift, nobody crosses a marked line even when it costs ten minutes. At the acquired site people get the line back up fast, they'll fix something and tell a supervisor afterwards, forms get batched at the end of the week. Their numbers looked fine for years. Six weeks ago a batch went out mislabelled because somebody skipped a check that "everyone knows isn't needed here," and it only got caught at the customer end. Nobody was hurt. I had a very expensive phone call.

  So now I've got a room of about 30 front-line supervisors from both sides, 75 minutes, a flip chart, and a lot of heat — half of them think the other half are either cowboys or robots. And I'm personally in the middle of it, because I came up through the loose site, so my judgement is now under a cloud I didn't ask for.

  I don't want to run a feelings session and I don't want to just read them the safety policy louder. I want to actually teach them the tightness/looseness idea properly, because I think it's the only frame that lets us land on the question that matters: how much rule-following should we be demanding here, and does the right answer differ by what each site is genuinely exposed to?

  Plan the explanation for me. Don't explain the theory to me — I've read enough of it. Give me the teaching plan. Specifically:

  - The order the pieces have to go in, and what depends on what. My guess is they need to believe it's a dial with costs on both ends before they'll hear anything about threat, but tell me if I've got that backwards.
  - The one example that carries the whole thing. I drafted two and I trust neither: comparing a hospital operating theatre to an ad agency, or just re-litigating our own incident. What should the carrying case be, what does it have to have, and what must it not have? It probably can't be about my own company for the first twenty minutes, but argue it rather than agreeing with me.
  - The misconceptions, in the order they'll show up, and the exact point in the sequence where I head each one off. The ones I already expect: tight equals moral and disciplined while loose equals lazy (plus the mirror-image snobbery); that it's national character so you can't change it; that it's one global dial rather than tight-about-this and loose-about-that; and the one where "threat drives tightness" gets heard as "so if you feel threatened you're exempt from criticism." There's a fifth one too, about nothing bad having happened for years so the rule starts to look pointless — I don't know what it's called but you do.
  - How much of the evidence I should lean on. I know there's a big 33-country study and the whole business about ecological and historical threat predicting tightness. Tell me what's solid enough to teach to 30 tired supervisors and what's contested enough that I should flag it as contested instead of asserting it.
  - The check for understanding at the end — something I can ask that would show me the idea landed rather than showing me they're being polite to the boss. It has to work on a room that's cross.
  - What to leave out at this level, and where I should say out loud that I'm leaving it out.

  Think this through carefully before you write. Brainstorm first: the failure modes of a session like this, especially the ways it goes sideways in the first ten minutes, and let that drive the plan. Then give me the plan as an actual sequence with rough timings, not an essay about culture. No readings or citations needed — I'm not making anybody read anything.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Role:** Cultural Psychologist specializing in Tightness-Looseness (TL) theory *and* experienced integration workshop facilitator.
      *   **User:** Ops Manager at a mid-size food ingredients company (4 legacy sites + 1 acquired site).
      *   **Situation:** Merged regional team (30 front-line supervisors). High tension ("cowboys vs. robots"). Recent safety/quality incident (mislabeling) at the "loose" site. User has bias (came from loose site).
      *   **Goal:** 75-minute session. Teach TL theory to reframe the conflict. Move from "right vs. wrong" to "contextual fit." Avoid "feelings session" or "policy reading."
      *   **Specific Deliverables:**
          *   Sequence/Order of pieces (dependencies).
          *   The One Carrying Example (criteria, what to avoid).
          *   Misconceptions (order of appearance, intervention points).
          *   Evidence level (what's solid vs. contested).
          *   Check for Understanding (robust, not polite).
          *   What to leave out (and acknowledge it).
      *   **Constraint:** Do not explain the theory to the user (they know it). Give the *teaching plan*. Brainstorm failure modes first.

  2.  **Brainstorming Failure Modes (The "Pre-Mortem"):**
      *   *Defensiveness:* The "loose" site feels attacked (rightfully, given the incident). The "tight" site feels superior (moral licensing).
      *   *Abstraction:* Theory feels academic and irrelevant to "getting the line running."
      *   *Determinism:* "We are just loose, you are just tight, never the twain shall meet."
      *   *The "Threat" Trap:* If I say "threat makes you tight," the loose site says "We don't feel threatened, so we don't need to be tight."
      *   *The User's Bias:* Supervisors know the Ops Manager came from the loose site. If the plan feels like it excuses the error, credibility is lost.
      *   *Time:* 75 minutes is tight for 30 angry people. Need to be ruthless with content.
      *   *Safety vs. Culture:* Food ingredients have hard regulatory constraints (FDA, etc.). TL can't override legal requirements.

  3.  **Developing the Plan - Section by Section:**

      *   **Sequence/Order:**
          *   User's guess: Dial with costs first, then threat.
          *   My assessment: Yes, but with a tweak. Start with *definition* (what is TL?), then *universality* (we all have both), then *costs* (trade-offs), then *context/threat*. If you start with threat, they apply it to *each other* ("You are threatened by us") rather than the *environment*.
          *   Key dependency: They must accept TL is a *strategy*, not a *personality trait*, before discussing context.

      *   **The One Carrying Example:**
          *   User's drafts: Hospital vs. Ad Agency (too cliché), Own Incident (too hot).
          *   Requirement: High stakes, variable context, relatable but neutral.
          *   Idea: *Commercial Aviation vs. Wildland Firefighting.* Or *Pit Crew vs. ER.*
          *   Better Idea: *The same team in different contexts.* A SWAT team vs. a Community Policing unit. Same people, different rules.
          *   Best Idea for Food/Ops: *Kitchen Culture.* A Michelin Star Kitchen (Tight) vs. A High-Volume Festival Food Truck (Loose-ish). Both cook food. Both have safety risks. But the cost of error differs.
          *   Wait, let's go more industrial. *Nuclear Submarine vs. Startup Tech Firm.* Too far apart.
          *   Let's stick to the User's intuition: Avoid their own company initially.
          *   *Selection:* **The Pit Crew vs. The Mechanic Shop.**
              *   Why: Both fix cars/engines. Both have safety risks. One is time-critical/high-visibility (Pit Crew - Tight), one is diagnostic/iterative (Shop - Looser).
              *   Wait, food ingredients need something about *contamination* or *consistency*.
              *   Let's go with **Pharmaceutical Compounding vs. Emergency Room Triage.**
              *   Actually, the prompt asks for *one* example that carries the whole thing.
              *   *Decision:* **A Commercial Kitchen during Dinner Rush vs. A Food Lab developing new recipes.**
              *   Why: It's food. It's relatable. It highlights *process* vs. *innovation*.
              *   *Correction:* The prompt says "Argue rather than agreeing with me" on whether it should be their company. I need to take a stance.
              *   *Stance:* Do NOT use their company first. Use a high-stakes neutral example where *both* tight and loose are virtuous depending on the goal.
              *   *Winner:* **Airline Cockpit (Takeoff) vs. Airline Cockpit (Cruising/Maintenance).** No, that's the same context.
              *   *Winner:* **Formula 1 Pit Stop vs. Classic Car Restoration.**
              *   *Why:* Both involve cars, tools, teams, safety.
              *   *F1:* Seconds matter. One error = crash. Tightness is survival.
              *   *Restoration:* Creativity matters. Improvisation solves unique problems. Looseness is value.
              *   *Crucial:* It shows Tightness isn't "better," it's "fit for purpose."

      *   **Misconceptions & Intervention Points:**
          1.  *Moral Superiority (Tight=Good):* Address immediately after defining TL. Frame as "Strategic Fit."
          2.  *National/Immutable Character:* Address when discussing "Why we are this way." Emphasize *situational* tightness.
          3.  *One Global Dial:* Address when moving to specific domains (Safety vs. Innovation).
          4.  *Threat = Excuse:* Address when discussing the "Why." Threat justifies tightness, it doesn't excuse looseness in high-threat zones.
          5.  *Normalization of Deviance (The "Nothing bad happened" bias):* This is the big one for the incident. Address last, before application.

      *   **Evidence Level:**
          *   Solid: Gelfand's work on social norms, the definition of TL, the trade-off (order vs. flexibility).
          *   Contested/Nuance: The *degree* to which threat causes tightness (correlation vs. causation), the malleability (can you change culture quickly?). Don't promise culture change in a day.

      *   **Check for Understanding:**
          *   Not a quiz. Not a "thumbs up."
          *   Needs to be a *scenario application* that forces them to choose a setting.
          *   "Where should we be tight tomorrow, and where can we afford to be loose?"

      *   **What to Leave Out:**
          *   Deep history/evolutionary psych.
          *   National level data (33 countries).
          *   Individual personality metrics.
          *   The specific details of the mislabeling incident (until the very end).

  4.  **Drafting the Plan (Iterative refinement):**
      *   *Timing:* 75 mins is short. 5 intro, 15 concept, 15 example, 20 misconceptions/threat, 20 application, 5 close.
      *   *Tone:* Direct, operational, non-therapeutic.
      *   *Addressing the User's Bias:* The plan must explicitly neutralize the "Boss is one of them" dynamic. The theory must implicate *everyone*.

  5.  **Refining the "Carrying Case":**
      *   I need to argue against using their own company first. Why? Because the emotional charge is too high. They will map "Tight = Them" and "Loose = Us" immediately.
      *   I need to argue for an example where *both* styles are clearly successful in their own context.
      *   *Revised Choice:* **Emergency Room (Trauma) vs. Primary Care Clinic.**
      *   *Why:* Both are healthcare (high stakes). Trauma = Tight (protocols, hierarchy, immediate compliance). Primary Care = Looser (dialogue, exploration, patient history).
      *   *Wait, Food context is better.*
      *   *Revised Choice:* **Mass Production Bakery vs. Artisan R&D Kitchen.**
      *   *Mass Production:* Consistency, safety, scale. Tight.
      *   *R&D:* Innovation, tweaking, experimentation. Loose.
      *   *Argument:* This mirrors their business (Ops vs. Innovation) but removes the blame from the specific incident.

  6.  **Refining the Misconceptions:**
      *   The "Normalization of Deviance" (Diane Vaughan) is the technical term for "nothing bad happened so the rule is pointless." I need to make sure the user knows to name this.
      *   The "Threat" misconception is critical. If they think "We aren't threatened, so we stay loose," they miss the point that *regulatory* threat exists regardless of *felt* threat.

  7.  **Final Review against Constraints:**
      *   Did I explain the theory? No.
      *   Did I give the sequence? Yes.
      *   Did I argue about the example? Yes.
      *   Did I address the evidence strength? Yes.
      *   Did I include the check for understanding? Yes.
      *   Did I include what to leave out? Yes.
      *   Is it a plan, not an essay? Yes.

  8.  **Final Polish:** Ensure the voice is that of a seasoned practitioner (direct, slightly authoritative, empathetic to the difficulty). Make sure the "User Bias" issue is handled delicately but firmly in the plan structure. (Self-Correction: Make sure the plan explicitly tells the User how to introduce themselves to mitigate the bias).

  *(Self-Correction during drafting)*: I need to be careful about the "Threat" component. In TL theory, threat *elicits* tightness. If the loose site doesn't *feel* the threat, they won't tighten. The workshop needs to make the threat *objective* (regulatory, customer trust) not just *subjective* (fear). I will build this into the "Misconception 4" section.

  *(Self-Correction on Example)*: The Pit Crew vs. Mechanic Shop is stronger because it involves *machinery and process* which ops supervisors relate to more than kitchens. I'll stick with **F1 Pit Crew vs. Classic Car Restoration.** It's about precision vs. problem solving.

  *(Wait, one more check)*: The prompt asks me to argue about whether the example should be their company. I will argue *against* using their company for the *teaching* phase, but *for* using it in the *application* phase.

