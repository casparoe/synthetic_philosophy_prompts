answer: |-
  Here is the spec for an adequate theory of origin, calibrated for a quals oral where reciting Kripke's *Naming and Necessity* table case is the floor, not the ceiling.

  ### The Adequacy Spec: Five Constraints
  To count as adequate, a theory of origin must satisfy these five constraints. I have marked which are **Methodological Non-Negotiables** (you fail the exam if you ignore them) and which are **Substantive House Styles** (commitments specific to camps).

  **1. The Supervenience Constraint (Non-Negotiable)**
  *   **The Case:** The Lab Duplicate. Exact physical copies of gametes fuse.
  *   **Requirement:** The theory must explain why you are *this* zygote and not the duplicate, without appealing to primitive "thisness" (haecceitism) unless explicitly defended. If the physical history is identical, the modal status should be identical.
  *   **Trap:** If you say the duplicate is *not* you, you must identify an intrinsic difference. If there is none, you are committed to haecceitism (which many examiners view as a bug, not a feature).
  *   **Status:** **Contested.** Physicalists demand supervenience; Kripkeans often tolerate haecceitism.

  **2. The Individuation Constraint (Non-Negotiable)**
  *   **The Case:** Monozygotic Twinning. Zygote splits at day four; two organisms result.
  *   **Requirement:** The theory must explain how two numerically distinct entities can share the *same* origin without abandoning the claim that origins individuate.
  *   **Trap:** If origin individuates, twins are impossible. If twins exist, origin does not strictly individuate. You must modify the "individuation" claim (e.g., origin + developmental path).
  *   **Status:** **Settled Problem, Contested Solution.** Everyone agrees twinning is a counterexample to naive Origin Essentialism (OE); no consensus on the fix.

  **3. The Sufficiency/Existence Constraint (House Style: Essentialist)**
  *   **The Case:** Early Death. Gametes fuse, zygote dies day three.
  *   **Requirement:** The theory must specify what turns a *possible* origin into an *actual* existent. If origin is necessary, is it sufficient? If not, what is the threshold (viability, consciousness, birth)?
  *   **Trap:** Claiming origin is necessary *and* sufficient implies you exist in worlds where the zygote dies immediately (a "ghost" you). Most reject this.
  *   **Status:** **Contested.** Animalists say zygote = organism; Personists say zygote ≠ person.

  **4. The Sortal Relativity Constraint (Non-Negotiable)**
  *   **The Case:** Mitochondrial Donation / IVG (Induced Pluripotent Stem Cells).
  *   **Requirement:** The theory must specify *what* has the origin: the organism, the person, the genetic line, or the functional system. Does "egg" mean the cellular structure or the genetic contributor?
  *   **Trap:** Assuming a "natural" reproductive system. If a gamete is synthesized from skin cells, does the "origin" trace to the skin cell donor or the lab process?
  *   **Status:** **Contested.** Biological essentialists struggle here; functionalists have an easier time.

  **5. The Epistemic Constraint (Non-Negotiable)**
  *   **The Case:** Misattributed Paternity. You believe $A$ is your father; actually $B$ is.
  *   **Requirement:** The theory must explain how origin claims can be known if they are necessary truths about identity. If "I am from $A$" is necessary, but I can be wrong about $A$, is it an *a posteriori* necessity?
  *   **Trap:** Circularity. You cannot fix transworld identity by origin and then derive origin from transworld identity. You need an independent criterion for tracking the entity.
  *   **Status:** **Settled.** Consensus that origin truths are *a posteriori* necessary (if true), but knowledge of them is fallible.

  ---

  ### The Killer Constraint
  **The Individuation Constraint (Twinning).**
  This knocks out the most candidates because it directly contradicts the primary motivation for Origin Essentialism (that origin explains *thisness*). Naive Kripkean OE fails here immediately. To survive, a theory must complicate "origin" to include "non-branching developmental path," which moves the theory away from pure origin and toward *history* or *continuity*, weakening the essentialist claim.

  ### The Incompatible Pair
  **Strong Necessity of Origin + Humean Supervenience.**
  You cannot hold that (a) origins are strictly necessary for identity *and* (b) all facts supervene on local intrinsic physical properties *without* accepting Haecceitism.
  *   **Why:** In the Lab Duplicate case, if the physical properties are identical but the identity differs (one is you, one isn't), then identity does not supervene on the physical. You must posit a primitive "thisness" to distinguish them. If you reject primitive thisness (to save Supervenience), you must allow that the duplicate *could* be you (Contingent Origin). You cannot have both Strict Necessity and Physicalist Supervenience.

  ---

  ### One-Sentence Verdicts on Main Positions

  *   **Kripkean Essentialism:** Saves necessity by accepting haecceitism or brute identity, but fails the Individuation Constraint without ad-hoc modifications for twinning.
  *   **Lewisian Counterpart Theory:** Dissolves the necessity claim (you have counterparts from different origins), satisfying Supervenience but violating the intuition that *you* essentially come from *these* parents.
  *   **Biological Animalism:** Handles the Twinning case by identifying you with the organism (which branches), but struggles with the Person/Organism distinction in the Early Death case.
  *   **Contingent Origin (Mackie):** Rejects necessity to save Supervenience and handle duplicates, but loses the modal intuition that you couldn't have been born of different parents.
  *   **Constitution View (Person vs. Organism):** Dissolves the Twinning paradox by claiming the *person* originates later than the *organism*, but incurs a cost in ontological proliferation (two things where you sit).

  ---

  ### Settled vs. Contested (Do Not Conflate)

  **Settled (Consensus among specialists):**
  1.  **Twinning is a problem:** No serious theorist claims naive OE handles monozygotic twinning without revision.
  2.  **A Posteriori Necessity:** If origin is necessary, it is not knowable *a priori* (you need a DNA test, not logic).
  3.  **Sortal Sensitivity:** Claims about origin differ depending on whether the subject is a "human organism" or a "person."

  **Contested (Live Debates):**
  1.  **The Time of Origin:** Does origin fix at gamete fusion, implantation, or neural development? (No consensus).
  2.  **Haecceitism:** Is it acceptable to posit primitive non-qualitative thisness to save Origin Essentialism? (Divides metaphysicians).
  3.  **Sufficiency:** Does the origin *guarantee* existence, or is it merely a necessary condition for an entity that might fail to develop? (Divides Animalists and Personists).
  4.  **Artificial Reproduction:** Whether IVG or mitochondrial donation alters the metaphysical "origin" or merely the causal pathway. (Emerging debate).

  ### Oral Strategy Note
  If pressed on the **Lab Duplicate**, do not say "I am the one with the right history." That is circular. Say: "If Supervenience holds, the duplicate is me (Contingent Origin). If Necessity holds, Supervenience fails (Haecceitism). I am willing to bite [X] bullet." Examiners want to see you identify the trade-off, not hide it.
