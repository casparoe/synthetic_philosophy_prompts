answer: |-
  ### Instructor's Brainstorm: Sorting the Logical Space

  Before we get to the tree, here is the map of the territory as I see it after years of watching this debate cycle. Most students think the fight is between "Realists" (who love science) and "Anti-Realists" (who hate truth). That is wrong. The real fight is about *risk management* and *reference*.

  **Real Distinctions:**
  1.  **Success Criteria:** Does a theory work because it latched onto reality, or just because it saved the phenomena? If you think novel prediction is the only thing that matters, you are already filtering the historical data differently than someone who thinks accommodation counts.
  2.  **Reference Failure:** When phlogiston failed, did the term refer to *nothing*, or did it refer to *something else* (like electrons/oxidation) that was misdescribed? This is the single biggest divider. If you say "nothing," you are pushed toward empiricism or structuralism. If you say "something else," you can be a selective realist.
  3.  **The Unit of Survival:** What gets kept? The entities (electrons), the structure (equations), or the causal powers (semirealism)?
  4.  **The Meta-Argument:** Do you think the Pessimistic Induction (PI) is a fair sample of history, or a cherry-picked list of losers? Do you think the PI argument secretly assumes current science is true to prove current science is false (the reflexive problem)?

  **Vocabulary Fights (Ignore These):**
  1.  **"Approximately True":** Some students refuse to say a false theory is "approximately true" for semantic reasons, but then admit it was "right about the relations." That is a verbal dispute. The tree forces you to commit to the relations, regardless of the label.
  2.  **"Belief" vs. "Acceptance":** Van Fraassen distinguishes these. In practice, if you act the same way in the lab, the tree treats you similarly unless you make a fuss about the ontology.
  3.  **"Structure" vs. "Nature":** Ontic Structural Realists claim there are no objects, only relations. Epistemic Structural Realists say there might be objects, we just can't know them. This is a metaphysical hair-split that the tree will expose as a temperament difference at the very end.

  ***

  ### The Decision Tree: The Pessimistic Induction Sorter

  **Instructions:** Answer the following questions based on how you judge specific historical cases and logical claims. Do not worry about which "ism" you end up with. If a question feels like it asks about your temperament rather than a fact, note the aside.

  **Node 1:** Consider a past theory that was empirically successful for a long time but is now discarded (e.g., caloric theory). Did its success indicate that the theory was latching onto the way the world actually is, or merely that it was a useful tool for organizing observations?
  *   *Useful Tool:* Go to Node 2.
  *   *Latching onto Reality:* Go to Node 3.

  **Node 2:** If it was merely a useful tool, do we have any rational warrant for believing the claims the theory makes about unobservable entities (like atoms or fields), or should we remain agnostic about them?
  *   *No Warrant/Agnostic:* Go to Node 4.
  *   *We Should Not Believe (Instrumental Stance):* **Leaf A (Instrumentalism)**.
  *   *(Aside: This split is often just about whether you call it "belief" or "acceptance.")*

  **Node 3:** For a successful theory to count as "latching onto reality," must it make novel predictions that were not used to construct the theory, or is accommodating known data sufficient?
  *   *Accommodation is Sufficient:* Go to Node 5.
  *   *Novel Prediction Required:* Go to Node 6.

  **Node 4:** Regarding the discarded theory's central terms (e.g., "phlogiston"), did these terms fail to refer to anything at all, or did they refer to something real that was misdescribed?
  *   *Failed to Refer (Empty):* **Leaf B (Constructive Empiricism)**.
  *   *Referred to Something Real:* Go to Node 7.

  **Node 5:** If accommodation is sufficient, does the Pessimistic Induction worry you? Specifically, do you think the list of discarded theories is a biased sample because we only remember the failures?
  *   *Yes, Sample is Biased:* Go to Node 8.
  *   *No, Sample is Representative:* Go to Node 9.

  **Node 6:** Consider the discarded theory again. Even if the theory as a whole is false, can we say it was "approximately true" regarding its ontology (the stuff it claimed existed)?
  *   *No, Ontology is Gone:* Go to Node 10.
  *   *Yes, Ontology was Approximate:* Go to Node 8.

  **Node 7:** If the terms referred to something real, was it the specific entities (objects/substances) that were real, or was it the mathematical/relational structure that was real?
  *   *Specific Entities:* Go to Node 11.
  *   *Relational Structure:* Go to Node 12.

  **Node 8:** Is the core problem of the Pessimistic Induction that past theories were *false*, or that we are systematically unable to conceive of the alternatives that will replace us (Stanford's New Induction)?
  *   *Past Theories Were False:* Go to Node 11.
  *   *Unconceived Alternatives:* **Leaf C (Semirealism)**.
  *   *(Aside: This distinguishes those worried about truth from those worried about imagination.)*

  **Node 9:** Does the Pessimistic Induction argument rely on our current theories being roughly correct in order to judge past theories as false (the reflexive problem)?
  *   *Yes, It's Reflexive/Question-Begging:* **Leaf D (Selective Realism)**.
  *   *No, It Stands Alone:* Go to Node 10.

  **Node 10:** If you retain only the structure of the theory, can you express this commitment via a Ramsey sentence without it becoming trivially satisfiable by any set of objects (the Newman problem)?
  *   *No, It Collapses/Trivial:* **Leaf E (Entity Realism)**.
  *   *Yes, It Holds Water:* Go to Node 12.

  **Node 11:** Do you believe that the entities posited by our current best theories (e.g., quarks) exist independently of the structures or relations they inhabit?
  *   *Yes, Objects are Fundamental:* **Leaf F (Standard Selective Realism)**.
  *   *No, Structure is Fundamental:* Go to Node 12.

  **Node 12:** If structure is fundamental, is this because we *cannot know* the nature of the objects (epistemic limitation), or because there *are no* objects, only structures (ontological claim)?
  *   *Cannot Know (Epistemic):* **Leaf G (Epistemic Structural Realism)**.
  *   *No Objects (Ontic):* **Leaf H (Ontic Structural Realism)**.

  **Node 13 (Temperament):** (Reached only if you think success guarantees truth and history is unbiased). Are you willing to commit to the claim that all currently successful theories will survive future revolutions essentially intact?
  *   *Yes:* **Leaf I (Naive Cumulative Realism)**.
  *   *No:* **Leaf D (Selective Realism)**.
  *   *(Aside: This node exists to catch the one position nobody actually holds.)*

  ***

  ### The Leaves: Positions and Commitments

  **Leaf A: Instrumentalism**
  *   **What Survives:** Nothing but the predictive algorithm; theories are merely instruments for calculation.
  *   **Awkward Commitment:** You must explain why instruments improve over time without assuming they are tracking reality better.

  **Leaf B: Constructive Empiricism**
  *   **What Survives:** Empirical adequacy; we believe the theory is true only about observables.
  *   **Awkward Commitment:** You must maintain a sharp, defensible line between what is "observable" and what is "unobservable" despite technological change.

  **Leaf C: Semirealism**
  *   **What Survives:** The causal powers and detection properties that allowed us to interact with the entities.
  *   **Awkward Commitment:** You must claim we can know the causal powers of entities while remaining agnostic about the entities themselves.

  **Leaf D: Selective Realism**
  *   **What Survives:** The specific components of the theory that drove its novel success (the "working posits").
  *   **Awkward Commitment:** You need a reliable method to identify which parts of a theory are the "working posits" before the next revolution happens.

  **Leaf E: Entity Realism**
  *   **What Survives:** The existence of the entities themselves, confirmed by experimental manipulation rather than theory.
  *   **Awkward Commitment:** You must explain how you can know the entities exist while admitting the theories describing them are largely false.

  **Leaf F: Standard Selective Realism (Theory-Level)**
  *   **What Survives:** Whole theories that mature sufficiently, assuming they aren't on the "bad list" of history.
  *   **Awkward Commitment:** You rely on the reflexive defense (PI is self-undermining) which some argue just pushes the problem back one step.

  **Leaf G: Epistemic Structural Realism (ESR)**
  *   **What Survives:** The mathematical structure and relations of the theory are known to be true.
  *   **Awkward Commitment:** You must accept the Newman objection that structure alone is trivial unless constrained by something non-structural.

  **Leaf H: Ontic Structural Realism (OSR)**
  *   **What Survives:** Structure is all there is; objects are eliminable nodes in a network.
  *   **Awkward Commitment:** You must explain how structure exists without "relata" (things to relate) without collapsing into Pythagoreanism.

  **Leaf I: Naive Cumulative Realism (Empty Cell)**
  *   **What Survives:** Everything; science accumulates truth without loss.
  *   **Awkward Commitment:** You must deny the historical record of theory change.
  *   **Why Empty:** This position is incoherent given the historical data. Nobody occupies it because it requires denying the very premise of the seminar (that theories get discarded). It is unattractive because it is empirically falsified by the history of science.

  ***

  ### Unclean Splits

  **Pair 1: Epistemic Structural Realism (Leaf G) vs. Ontic Structural Realism (Leaf H)**
  *   **The Problem:** The tree separates them at Node 12 based on whether objects *exist* or are *knowable*. In practice, students often answer based on how much metaphysical baggage they want to carry, not on a clear evidential distinction.
  *   **The Extra Question:** "If a future physics confirmed objects exist but we could never detect their intrinsic nature, would you change your view?" If yes, you are Epistemic. If no, you are Ontic. However, many students will say "It doesn't matter," revealing the split is often just tone.

  **Pair 2: Constructive Empiricism (Leaf B) vs. Instrumentalism (Leaf A)**
  *   **The Problem:** The tree separates them at Node 2 on "Agnostic" vs. "Do Not Believe." Many students land here and admit they act the same way in the lab.
  *   **The Extra Question:** "Is the statement 'electrons exist' capable of being true or false, or is it category mistake?" Empiricists say True/False (but we don't know). Instrumentalists say Category Mistake/Non-cognitive. If the student shrugs, the tree hasn't truly sorted them.

  ***

  ### Case Studies: Running the Tree

  **Case 1: Phlogiston Theory**
  *   **Path:** Node 1 (Success indicated reality? Many say No -> Node 2). If they say Yes (it captured oxidation processes), they go to Node 3.
  *   **Result:** Most Realists are forced to Node 7 (Reference). Did "phlogiston" refer?
      *   If **No**: They are pushed toward **Constructive Empiricism (Leaf B)** or **Instrumentalism (Leaf A)**.
      *   If **Yes (to oxidation/electrons)**: They move toward **Selective Realism (Leaf D/F)**.
  *   **Disagreement:** **Entity Realists (Leaf E)** struggle here because there is no entity to manipulate. **Structural Realists (Leaf G)** claim the chemical relations survived. The tree cleanly separates those who think reference failed entirely from those who think reference was partial.

  **Case 2: The Luminiferous Ether**
  *   **Path:** Node 1 (Success -> Reality). Node 7 (Reference).
  *   **Result:** The ether is the classic Structural Realist case.
      *   **ESR/OSR (Leaf G/H):** They claim the field equations (Maxwell) survived even if the "medium" did not. The tree sends them to Node 12.
      *   **Entity Realists (Leaf E):** They must claim the ether did not exist. This forces them to say the theory was successful *without* the entity being real, which is awkward for their position.
      *   **Selective Realists (Leaf D):** They claim the "wave propagation" posit was real, the "material medium" posit was not.
  *   **Disagreement:** The tree highlights the split between **Entity Realists** (who lose the case) and **Structural Realists** (who win the case).

  **Case 3: Newtonian Mechanics (as used today)**
  *   **Path:** Node 1 (Success). Node 6 (Approximately True?).
  *   **Result:** This is the stress test for **Selective Realism (Leaf D/F)** vs. **Standard Realism**.
      *   **Selective Realists:** They say Newtonian mechanics is *false* (ontology of absolute space/time is wrong) but *approximately true* in a limiting domain. The tree sends them to Node 9 (Reflexive defense of PI).
      *   **Naive Realists (Leaf I):** They would have to say Newtonian mechanics is literally true. The tree catches them at Node 13 and forces them to admit nobody holds this.
      *   **Structural Realists:** They say the *structure* of Newtonian mechanics is a limiting case of Relativity, so the structure survives.
  *   **Split Check:** Does the tree split the leaves? **Yes.**
      *   **Entity Realists** must say mass is real (Node 11).
      *   **Structural Realists** say the equations are real (Node 12).
      *   **Empiricists** say it's just useful for low velocities (Node 2).
      *   **The Problem:** The tree *fails* to cleanly separate **Selective Realism (Leaf D)** from **Semirealism (Leaf C)** here. Both agree Newton's theory captures "something real" (causal powers vs. working posits) without being fully true. To separate them, we would need a question about whether "causal powers" exist independently of the "laws," which Node 8 touches on but doesn't fully resolve in the context of classical mechanics.
