answer: |-
  ### Preliminary Distinctions

  Before specifying the requirements, the framework must take a stance on the conceptual distinctions you listed. A normative theory for this context cannot treat all of them as equally robust.

  *   **Must Not Collapse:**
      1.  **Individual liberty to quit vs. Group power to withhold:** If these collapse, a strike becomes indistinguishable from mass resignation. The normative force of a strike relies on the *temporary* suspension of the contract to force renegotiation, not the permanent severance of the relationship.
      2.  **Withdrawing one's own labor vs. Preventing others from supplying theirs:** If these collapse, primary strikes become indistinguishable from secondary boycotts (Case 2). The moral weight of refusing to cross a picket line differs from physically blocking a non-striking supplier.
      3.  **The Worker, the Majority, and the Union-as-Institution:** If these collapse, internal democracy becomes irrelevant (Case 7). A theory must distinguish between the right inhering in the individual, the aggregate will of the unit, and the bureaucratic authority of the leadership.

  *   **Illusory (in this context):**
      1.  **Having the right vs. Being able to exercise it without ruin:** In labor disputes, the leverage *is* the risk. A normative theory that requires a strike to be costless to the striker (e.g., guaranteed reinstatement without risk) negates the economic pressure required to make the right effective. A "right" that cannot be exercised without livelihood risk is normatively hollow if the theory demands safety as a precondition for legitimacy.
      2.  **A right held against the employer vs. a right held against the general public:** Strike leverage operates by disrupting the employer's relationship with the public (customers, patients, supply chains). To claim a right against the employer that does not implicate the public (Case 3) is to describe a grievance procedure, not a strike. The distinction is analytically useful but practically illusory when adjudicating legitimacy based on impact.

  ### Specification of Requirements

  | id | desideratum | motivating case | why this is a requirement | status | exclusion power |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **The Liberty Floor:** The framework must affirm that no worker can be compelled to labor against their will, regardless of contractual status. | Case 1, 4 | Consistent with the background fact that no one in a liberal order may be compelled to labor. Without this, "independent contractors" (Case 4) or contract-bound employees (Case 1) are reduced to servitude. | Non-negotiable | Rules out authoritarian or strict contractarian accounts that treat labor contracts as specific-performance obligations. |
  | **R2** | **The Collective Efficacy Condition:** The framework must distinguish between individual resignation and collective withholding intended to resume work under new terms. | Case 8 | Consistent with the background fact that the bare liberty to walk out is uncontroversial; the normative work concerns *collective force*. Work-to-rule (Case 8) must be adjudicated as a stoppage if the intent and effect are identical to a walkout. | Non-negotiable | Rules out accounts that treat strikes merely as aggregate individual breaches of contract (tort-based accounts). |
  | **R3** | **The Third-Party Harm Limit:** The framework must weigh the severity of harm imposed on non-parties against the gravity of the workers' grievance. | Case 2, 3 | Consistent with the background fact that strike leverage is proportional to harm imposed on people not parties to the dispute. Legitimacy diminishes as harm to innocents (patients in Case 3) becomes disproportionate to the gain. | Non-negotiable | Rules out pure libertarian accounts (no limits on leverage) and pure utilitarian accounts (strike only if net social gain is positive). |
  | **R4** | **The Authority Specification:** The framework must identify which agent (individual, majority, or union institution) holds the prerogative to initiate the stoppage. | Case 1, 5, 7 | Consistent with the background fact that unions simultaneously coerce members and constitute the only counterweight to employer power. A wildcat strike (Case 1) and a leadership-mandated strike (Case 7) require different legitimacy tests. | Contested | Rules out accounts that locate the right solely in the individual (cannot explain union discipline) or solely in the institution (cannot explain wildcat legitimacy). |
  | **R5** | **The Scope of Bargaining:** The framework must determine whether the stoppage's aim must be limited to the employment relationship or may extend to public policy. | Case 9 | Consistent with the background fact that the right to strike is routinely waived for stability. Political strikes (Case 9) lack the direct reciprocity of collective bargaining, requiring a higher threshold of public justification. | Camp-specific | Rules out "business unionism" accounts (economic aims only) and "social movement unionism" accounts (unrestricted political aims). |
  | **R6** | **The Waiver Paradox:** The framework must adjudicate whether contractual no-strike clauses extinguish the right or merely suspend its exercise pending alternative remedies. | Case 1, 6 | Consistent with the background fact that the right is routinely waived by contract. If remedies are ineffective (Case 10) or employer conduct is egregious (Case 6), the waiver may become voidable. | Contested | Rules out strict contractarian accounts (waiver is absolute) and radical accounts (waiver is never valid). |
  | **R7** | **The Risk Asymmetry Check:** The framework must account for the differential cost of striking on workers with poor outside options versus those with good options. | Case 4, 6 | Consistent with the background fact that a right whose exercise costs the exerciser their livelihood is worth more to workers with good outside options. Misclassified contractors (Case 4) face higher ruin risks. | Camp-specific | Rules out formalist accounts that treat all workers as equally capable of exercising the right regardless of economic vulnerability. |
  | **R8** | **The Necessity Principle:** The framework must require that legal or contractual remedies be exhausted or demonstrably ineffective before extra-legal stoppage is legitimized. | Case 10 | Consistent with the background fact that the rule of law is a default good. If legal remedy arrives too late to matter (Case 10), self-help becomes normatively necessary. | Non-negotiable | Rules out accounts that privilege self-help over adjudication regardless of available legal recourse. |

  ### Joint Satisfiability Result

  Your suspicion is correct: a subset of these requirements is jointly unsatisfiable if interpreted strictly. Specifically, **R1 (Liberty Floor)**, **R2 (Collective Efficacy)**, and **R3 (Third-Party Harm Limit)** form a trilemma.

  1.  **Individual Liberty (R1)** grounds the right in the worker's disposal of their own labor.
  2.  **Collective Efficacy (R2)** demands that this disposal generate enough pressure to alter employer behavior.
  3.  **Third-Party Harm (R3)** demands that this pressure not impose serious costs on uninvolved persons.

  **The Argument:** Collective power is generated *precisely* by imposing costs. In a modern supply chain, costs imposed on an employer are almost inevitably passed to consumers, patients, or secondary suppliers (Case 3). If you strictly enforce R3 (no serious costs to uninvolved persons), you neuter R2 (collective power), rendering the strike ineffective. If you prioritize R2 (effective power), you inevitably violate R3 (harming innocents). If you ground it solely in R1 (individual liberty), you cannot justify the *collective* coercion required to make the strike work against a determined employer, nor can you justify harms to third parties which individual liberty does not cover.

  **Resolution:** The requirements are satisfiable only if **R3 is downgraded from a prohibition to a proportionality test.** A theory cannot demand *zero* harm to uninvolved parties; it must demand that the harm be proportional to the injustice being remedied (e.g., safety violations in Case 1 justify more disruption than wage disputes). If R3 remains a strict "no serious costs" constraint, the set is unsatisfiable.

  ### The Single Most Exclusionary Requirement

  **R3 (The Third-Party Harm Limit)** does the most work to rule out candidate theories.
  *   It rules out **Libertarian/Property Accounts** because they view the right to withhold labor as absolute, regardless of downstream consequences (allowing Case 3 deaths).
  *   It rules out **Radical/Syndicalist Accounts** because they view the disruption of capital and public order as a feature, not a bug, of the strike (rejecting the need to minimize harm to the public).
  *   It rules out **Statist/Utilitarian Accounts** because they would ban any strike where public harm exceeds private gain, effectively banning strikes in essential industries entirely.
  It forces every theory to confront the moral cost of leverage.

  ### Scorecard of Leading Accounts

  **1. Libertarian/Property Rights Account**
  *Grounds the right in individual liberty and freedom of contract.*
  This account satisfies R1 and R6 (waivers are binding) but fails R2 and R3. It struggles to explain why collective action is protected more than individual resignation (R2) and cannot justify limiting strikes that harm third parties (R3), as interference with supply chains is viewed as legitimate competitive pressure. It treats Case 4 (contractors) correctly but Case 3 (patients) disastrously.

  **2. Pluralist/Industrial Democracy Account**
  *Grounds the right in the need for countervailing power against capital.*
  This account satisfies R2 and R4 (union authority) well, recognizing the institutional role of unions (Case 5, 7). However, it often fails R3, viewing harm to the employer's customers as legitimate leverage. It also struggles with R6, often viewing no-strike clauses as coercive rather than voluntary exchanges for stability. It handles Case 1 well but Case 9 (political strikes) poorly.

  **3. Human Rights/Dignity Account**
  *Grounds the right in non-servitude and basic needs.*
  This account satisfies R1 and R7 (risk asymmetry) best, protecting vulnerable workers (Case 4, 6). However, it often fails R2, focusing so much on individual dignity that it undermines the collective coercion necessary for efficacy. It also struggles with R5, often restricting strikes to basic needs rather than broader bargaining. It handles Case 10 (ineffective remedy) well but Case 8 (work-to-rule) ambiguously.

  **4. Utilitarian/Welfare Account**
  *Grounds the right in net social benefit.*
  This account satisfies R3 (harm limitation) best, strictly weighing patient deaths (Case 3) against worker gains. However, it fails R1 and R8, as it would compel labor if the social cost of stopping is high enough, and it would ban strikes where legal remedies are slow but less disruptive (Case 10). It treats the right as a policy tool rather than a claim-right, making it unstable for workers.
