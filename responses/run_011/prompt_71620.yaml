answer: |-
  **Case A: The Punitive Reassignment**
  Dana has worked the ambient floor for six years, a seniority perk she is plainly entitled to under warehouse norms, though not strictly codified in a way that makes violation illegal. When she declines a supervisor's request to cover a late shift—a request she is entitled to refuse without penalty—the supervisor tells her she must sign a new "flexible overtime" waiver or be permanently reassigned to the Freezer Zone. The Freezer Zone pays the same rate but requires heavy gear, offers fewer breaks, and is physically punishing; Dana has worked there before and knows she can survive it, though she dislikes it intensely. The supervisor has the discretionary right to assign zones and the right to request the waiver, so no law or contract is broken, but everyone on the floor knows the reassignment is retaliatory punishment for refusing the late shift. Dana signs the waiver to stay on the ambient floor. She feels targeted and resentful, telling her partner later that she didn't really have a choice because the supervisor was weaponizing his authority against her.

  **Case B: The Structural Squeeze**
  Dana faces the same "flexible overtime" waiver requirement, this time triggered by a bid for the early morning shift. Six months prior, the company permanently ended its on-site childcare subsidy (a permissible policy change) and adjusted shift start times to 4:00 AM for operational efficiency (a permissible operational decision). Dana's private childcare costs now consume nearly all the income from her current shift; the 4:00 AM shift pays a slight premium that makes childcare affordable, but only if she signs the waiver required for that shift's staffing model. Refusing the waiver means losing the bid, reverting to her old shift, and effectively quitting because she cannot afford childcare on that income. No individual manager targeted Dana; the subsidy cut was company-wide, the shift change was algorithmic, and the waiver is standard policy. Dana signs the waiver willingly, feeling she has solved her budget problem through a strategic choice. She tells her partner she chose the early shift because it made the math work, viewing the waiver as a neutral formality.

  ***

  **Analysis of Verdicts**

  **Case A Verdicts:**
  *   **ENTITLEMENT Account:** **Invalid Consent.** The proposal is wrongful because the supervisor threatens to leave Dana worse off than she is entitled to be (punishing her for an entitled refusal). Even though the content of the threat (Freezer Zone) is within his rights, the *reason* violates her moral entitlement to non-retaliation for exercising workplace rights. The wrongfulness vitiates consent regardless of the option set.
  *   **OPTIONS Account:** **Valid Consent.** Dana has an acceptable alternative: working the Freezer Zone. It is unpleasant and lower status, but she has done it before and can live with it. Since the option set contains at least one acceptable path that does not involve signing, the consent stands. The coercive *feel* is irrelevant because the structural escape route exists.

  **Case B Verdicts:**
  *   **ENTITLEMENT Account:** **Valid Consent.** No agent acted wrongfully. The company was within its rights to cut subsidies; the shift change was operational; the waiver offer was standard. Since no one threatened to leave Dana worse off than she was entitled to be, the proposal is clean. The scarcity of options is a background condition, not a wrongful proposal, so consent remains valid.
  *   **OPTIONS Account:** **Invalid Consent.** Dana has no acceptable alternative. Quitting is objectively unacceptable given her economic dependencies, and staying on the old shift is financially impossible. The shape of her option set at the moment of signing contains only one acceptable outcome: signing. The lack of wrongdoing is irrelevant; the closure of acceptable alternatives invalidates the consent.

  ***

  **Design Features and Toggles**

  **Single Feature Doing the Work:**
  In Case A, the divergent verdicts turn on the **moral quality of the proposer's reason** (punitive vs. neutral). In Case B, they turn on the **objective acceptability of the alternative** (livable hardship vs. economic impossibility).

  **Toggle 1: Ruinous Threat in Case A**
  *   *Change:* The Freezer Zone triggers Dana's severe asthma; working there is physically dangerous, not just unpleasant.
  *   *Effect:* **OPTIONS flips to Invalid.** The alternative is no longer acceptable. **ENTITLEMENT stays Invalid.** The proposal remains wrongful.
  *   *Account Ownership:* Both accounts own this flip. OPTIONS owns it because the option set changed. ENTITLEMENT owns it because the threat now also violates a safety entitlement, reinforcing the wrongfulness (though the punitive reason was already sufficient).

  **Toggle 2: Discretionary Whim in Case B**
  *   *Change:* The shift change and subsidy cut are revealed to be one manager's arbitrary whim, not company policy, though still within his formal discretionary rights.
  *   *Effect:* **OPTIONS stays Invalid.** The option set remains closed. **ENTITLEMENT flips to Invalid** (potentially).
  *   *Account Ownership:* OPTIONS owns the stability (structure is unchanged). ENTITLEMENT flips only if the account recognizes a duty against arbitrary caprice as a moral entitlement. If the manager is *within his rights* even when whimsical, ENTITLEMENT stays Valid. If whim violates a normative duty of reasonable management, ENTITLEMENT flips. This exposes a soft spot in ENTITLEMENT: it must define "entitlement" precisely enough to catch whims without catching all hard choices.

  ***

  **Advisor's Attack and Response**

  **Attack 1: The Wrong-Forum Reply**
  *   *Advisor:* "Case B describes distributive injustice, not involuntary consent. You are trying to fix background economic pressure through the law of consent. If no one wronged Dana, the defect is in the social safety net, not the employment contract. Calling this 'involuntary' conflates coercion with hardship."
  *   *Response:* Consent validity tracks the structure of agency, not just the morality of the proposer. If an agent cannot reasonably say 'no' without catastrophic loss, the 'yes' lacks normative force regardless of who caused the catastrophe. Treating this as valid consent legitimizes the employer's capture of the surplus value generated by that desperation, making consent doctrine complicit in the background injustice rather than a neutral forum.
  *   *Soft Spot:* This relies on a controversial definition of "agency" that ignores the subjective experience of freedom. If Dana feels free, asserting she lacks agency risks paternalism.

  **Attack 2: The She'd-Have-Signed-Anyway Reply**
  *   *Advisor:* "Dana wanted the early shift for the pay premium independent of the waiver. She would have taken the shift even if the waiver weren't required, so the waiver wasn't the pressure point. Her consent is causal, not coerced."
  *   *Response:* The counterfactual is irrelevant; the actual choice structure required the waiver to access the only acceptable option. She signed *because* the waiver was the gatekeeper to solvency, not merely because she wanted the shift. Removing the waiver in thought experiments doesn't change the fact that, in the actual world, the waiver was the price of survival.
  *   *Soft Spot:* This assumes the waiver and the shift are inseparable. If the waiver is truly trivial to her (which her "feels free" phenomenology suggests), arguing it invalidates consent risks making validity turn on the significance of the clause rather than the voluntariness of the act.

  ***

  **Constraint Check**
  All specs met. No illegality/contract breach in A (punitive motive within discretionary rights). No wrongdoing in B (policy changes within rights). No melodrama (standard DC operations). Phenomenology reversed as requested. Toggles analyzed.
