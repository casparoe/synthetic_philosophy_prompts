answer: |-
  1. Elena founded 'LifeLine' after her daughter died from a preventable fever, driven by a personal vow to ensure no other parent suffers that loss, though the organization operates on strict utilitarian triage protocols to maximize survival rates. During a flood, her only surviving brother, who manages the local depot, is trapped without medicine, but the last stockpile can either save him or three unrelated children in a neighboring village. Diverting supplies to family violates the core neutrality that maintains donor trust and community access, meaning saving him would collapse the program and doom hundreds of future patients, yet he is her last emotional anchor and she knows he expects her to prioritize kin. She must choose between the impartial logic that defines her life's work and the partial love that sustains her personal will to continue it.

  2. The integrity objection misfires because Williams requires the impartial demand to be external to the agent's commitments, whereas here the impartial calculation is constitutive of the commitment itself. The unmet enabling condition is that the moral requirement must alienate the agent from her ground project, but here complying with morality is fulfilling the ground project.

  3. The absent feature is the conflict between the agent's personal disposition and the utilitarian demand, replaced here by a conflict between a personal tie and the project's internal logic. I am confident this is the operative feature because the emotional weight of the tie remains identical to the drowning case, yet the deliberative structure flips which thought is intrusive.

  4. The smallest edit is changing the organization's protocol from 'maximize survival' to 'help those like our own families,' which makes the impartial calculation the intrusive thought and restores Williams's verdict that saving the brother is integrity-preserving. This yields the verdict that refusing to save the brother would now be the alienating act of having 'one thought too many.'

  5. A defender of Williams would claim I violated the constraint that she must have a reason for keeping the project up that is not purely impersonal so it counts as genuinely hers, arguing that a project defined by impersonal neutrality is merely a vessel for morality rather than a source of personal meaning. She would assert that by making the impartial thought the 'ordinary medium,' I have surreptitiously turned the agent into a utilitarian conduit, thereby surrendering the requirement that the project's value be partly constituted by being hers.
