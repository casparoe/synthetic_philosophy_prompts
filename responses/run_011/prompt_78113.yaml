  # Seminar Activity: The Architecture of Choice

  **Class Size:** 24 Students
  **Time:** 75 Minutes (50 Activity, 25 Debrief)
  **Materials:** 26 sheets of paper (24 Voter Cards, 1 Facilitator Sheet, 1 Candidate Brief), Whiteboard, Markers.
  **Reward:** Three high-quality chocolate bars for the top three point-scorers.

  ---

  ## Part 1: Preparation & Materials

  ### 1. Voter Cards (Print 24 Copies)
  *Cut these into individual cards. Do not distribute until the activity begins.*

  **SIDE A: YOUR IDENTITY**
  You are one of 24 citizens. You have private preferences and a point balance.
  **Your Type:** [A / B / C] (Instructor will mark this)
  **Your Points:**
  *   If your **1st Choice** wins: **+10 Points**
  *   If your **2nd Choice** wins: **+2 Points**
  *   If your **3rd Choice** wins: **[-20 / -5] Points** (See below)

  | If you are Type: | 1st Choice | 2nd Choice | 3rd Choice | Your Penalty for 3rd Choice |
  | :--- | :--- | :--- | :--- | :--- |
  | **Type A (8 Students)** | Candidate A | Candidate B | Candidate C | **-20 Points** |
  | **Type B (7 Students)** | Candidate B | Candidate A | Candidate C | **-20 Points** |
  | **Type C (9 Students)** | Candidate C | Candidate A | Candidate B | **-5 Points** |

  *Note: Candidates A and B are "Partners." Candidate C is "Independent."*

  **SIDE B: BALLOT**
  *Use this side to cast your vote in all three rounds. Write the Round Number and your Mark clearly.*
  *   **Round 1:** _________________
  *   **Round 2:** _________________
  *   **Round 3:** _________________

  ---

  ### 2. Candidate Brief (1 Sheet for the 3 Candidates)
  *Select 3 students to be Candidates A, B, and C. Give them this sheet 2 minutes before Round 1.*

  **TO THE CANDIDATES:**
  You are competing for office. You also vote (vote for yourself).
  *   **Candidate A:** You have 7 loyal supporters (Type A voters) plus yourself (8 total).
  *   **Candidate B:** You have 6 loyal supporters (Type B voters) plus yourself (7 total).
  *   **Candidate C:** You have 8 loyal supporters (Type C voters) plus yourself (9 total).

  **Round 1 Rule:** No speaking.
  **Round 2 Rule:** You may address the class for 60 seconds each. You may say anything *except* lie about the voting rules.
  **Round 3 Rule:** You may address the class for 60 seconds each. **New Information:** You (A) and You (B) are now officially "Partners." You share a label. C is the Rival.

  ---

  ### 3. Facilitator Sheet (Instructor Only)
  *Keep this hidden. It contains the Answer Keys and Board Layout.*

  **WHITEBOARD LAYOUT:**
  Draw three columns: **Round 1**, **Round 2**, **Round 3**.
  Under each, draw rows: **A**, **B**, **C**, **WINNER(S)**.

  **ANSWER KEY & DEVIATIONS**

  **Round 1 (Single Winner, 1 Vote, No Talk)**
  *   **Intended:** A(8), B(7), C(9). **Winner: C.**
  *   *Why:* A and B split the majority (15 votes). C has a unified minority (9).
  *   *Deviation 1 (Coordination):* If B voters vote A spontaneously. A(15), C(9). Winner A. (Rare without talk).
  *   *Deviation 2 (Abstention):* If B voters stay home. A(8), C(9). Winner C.

  **Round 2 (Single Winner, 1 Vote, Campaign Allowed)**
  *   **Intended:** Candidate B urges supporters to vote A to stop C. A(15), B(0), C(9). **Winner: A.**
  *   *Why:* Type B voters prefer A (+2) over C (-20). They vote strategically.
  *   *Deviation 1 (Stubbornness):* B refuses to yield. A(8), B(7), C(9). Winner C. (Class fails to coordinate).
  *   *Deviation 2 (Betrayal):* A tells B voters to vote B, hoping to split C? (Unlikely).

  **Round 3 (Two Winners, 1 Vote Each, Partners A&B)**
  *   **Rule:** Top 2 vote-getters win seats.
  *   **Intended:** A(8), B(7), C(9). **Winners: C and A.** (B is eliminated).
  *   *Why:* A and B compete for the same "Partner" votes. C's bloc is unified.
  *   *Discovery:* B voters wanted a Partner to win, but their specific Partner (B) lost to the other Partner (A) because they didn't coordinate vote management.
  *   *Deviation 1 (Fusion):* If Partners tell voters to "Split Tickets" (impossible with 1 vote rule) or if A tells supporters to vote B. Result: C(9), B(15). Winners C, B.
  *   *Deviation 2 (Total Coordination):* If A drops out. B(15), C(9). Winners B, C.

  ---

  ## Part 2: Activity Flow (50 Minutes)

  ### Introduction (5 Minutes)
  1.  **Seating:** Arrange chairs in a semi-circle. Place 24 Voter Cards face down on seats.
  2.  **Roles:** Identify 3 Candidates (A, B, C). Hand them the *Candidate Brief*. Ask them to stand at the front.
  3.  **Stakes:** Explain the Point System. "At the end, the top 3 point-scorers get chocolate. Your points depend on who wins, not just who you voted for."
  4.  **Secret:** Ask students to check Side A of their card. Do not show neighbors.

  ### Round 1: The Silent Election (10 Minutes)
  1.  **Rule:** "Mark one name on Side B. No talking. No signals."
  2.  **Action:** Students vote (1 min). Collect ballots quickly.
  3.  **Tally:** Count aloud, marking the Whiteboard (3 mins).
  4.  **Result:** C wins (9 vs 8 vs 7).
  5.  **Payoff:** Ask Type A and B students to calculate their score (-20). Let the discomfort sit.
  6.  **Notice:** Do not explain *why* yet. Just record the score.

  ### Round 2: The Campaign (15 Minutes)
  1.  **Rule:** "Same voting rule (1 vote, 1 winner). But now, Candidates have 60 seconds each to speak to you."
  2.  **Action:** Candidates speak. (Candidate B should realize they cannot win and urge a vote for A to stop C).
  3.  **Vote:** Students vote (2 mins).
  4.  **Tally:** Count aloud (3 mins).
  5.  **Result:** A wins (15 vs 9).
  6.  **Notice:** Ask a Type B student: "Who did you vote for?" (Expected: "A"). "Who did you *want*?" (Expected: "B").
  7.  **Payoff:** Type B gets +2 points. Much better than -20.

  ### Round 3: The Coalition (15 Minutes)
  1.  **Rule Change:** "We are filling **Two Seats**. The **Top Two** vote-getters win. You still have only **One Vote**."
  2.  **New Info:** Announce publicly: "Candidates A and B are now Partners. They share a label. C is the Rival."
  3.  **Campaign:** Candidates speak 60 seconds each. (A and B now compete for the *same* pool of 15 voters to secure their *individual* seat).
  4.  **Vote:** Students vote (2 mins).
  5.  **Tally:** Count aloud (3 mins).
  6.  **Result:** C (9) and A (8) win. B (7) loses.
  7.  **Notice:** Type B voters supported a Partner (A), but their preferred Partner (B) lost. They competed against their ally.

  ### Transition to Debrief (5 Minutes)
  1.  Collect cards.
  2.  Calculate final scores (quick estimate or take home).
  3.  Distribute chocolate to top 3 (or promise next class).
  4.  Clear board for vocabulary.

  ---

  ## Part 3: Debrief (25 Minutes)

  **1. The Mechanical Effect (5 Minutes)**
  *   **Ask:** "In Round 1, did the counting rule lie?"
  *   **Explain:** No. The rule counted accurately. This is the **Mechanical Effect**. The rule simply translated votes to seats.
  *   **Term:** *Plurality Rule.*

  **2. The Psychological Effect (10 Minutes)**
  *   **Ask:** "In Round 2, did the electorate's preferences change?" (No). "Did the vote change?" (Yes).
  *   **Explain:** You changed your behavior because you anticipated the Mechanical Effect. You voted against your preference to avoid a penalty.
  *   **Term:** *Psychological Effect* (or *Strategic Voting*).
  *   **Concept:** *Duverger's Law.* Tendency toward two blocs under plurality.
  *   **Key Insight:** The disproportionality in Round 1 wasn't just the math; it was the *fear* of the math that drove Round 2.

  **3. Intra-Party Competition (10 Minutes)**
  *   **Ask:** "In Round 3, who was Candidate B fighting?"
  *   **Explain:** In Round 2, B fought C. In Round 3, B fought A (their Partner).
  *   **Concept:** *Personal Vote.* When multiple candidates share a label (Multi-Member District), they must distinguish themselves from allies to survive.
  *   **Key Insight:** Electoral systems determine not just who wins, but *who runs against whom*. Round 3 showed that allies can be deadlier rivals than opponents if the system rewards individual tallies over party totals.
  *   **Limitation:** "What did we miss?" (See below).

  ---

  ## Part 4: Risk Management (What Will Go Wrong)

  1.  **Tallying Drags:** Counting 24 ballots by hand can take 5 minutes if disorganized.
      *   *Fix:* Pre-draw the tally table on the board. Ask students to raise hands for "Who voted A?" rather than collecting papers for Rounds 2 & 3 if time is tight. (Collect Round 1 only for proof).
  2.  **Round 2 Coordination Fails:** Candidate B refuses to yield, or B voters ignore the plea. C wins again.
      *   *Fix:* Acknowledge this as a "Real World" failure of coordination. Ask: "Why didn't you trust the message?" This leads to a rich discussion on information asymmetry.
  3.  **Round 3 Rule Confusion:** Students think they get 2 votes because there are 2 seats.
      *   *Fix:* Write "1 VOTE PER PERSON" in large letters on the board before Round 3 starts. Repeat it verbally.
  4.  **Payoff Apathy:** Students don't care about points.
      *   *Fix:* Emphasize the chocolate early. If they seem disengaged, increase the stakes verbally ("Top scorer chooses the next reading topic").
  5.  **Candidate Dominance:** One candidate talks too long.
      *   *Fix:* Use your phone timer. Cut them off firmly at 60 seconds. "Time. Next."

  ---

  ## Part 5: Limitations Note

  **What This Activity Cannot Reproduce:**
  **Party Organization and Time.**
  In this simulation, parties (A&B) appeared instantly in Round 3. In reality, building a party apparatus takes years. This activity cannot show how electoral systems shape *long-term coalition building*, donor networks, or candidate recruitment pipelines.
  **Verbal Cover:** In the debrief, explicitly state: "We compressed months of negotiation into 60 seconds. In reality, the 'Partners' in Round 3 would have needed a primary system or a convention to decide who runs, which is where the real power lies."

  ---

  ## Facilitator Script Snippets (For Vocabulary Withholding)

  *   **Do NOT say:** "Plurality," "Proportional," "Duverger," "Strategic Voting."
  *   **DO say:** "One winner," "Multiple winners," "Counting rule," "Anticipating others."
  *   **Do NOT say:** "Mechanical vs. Psychological."
  *   **DO say:** "What the rule does to the ballots" vs. "What the rule does to the voters."

  **Final Check:**
  *   24 Students? Yes.
  *   50/25 Split? Yes.
  *   60 Sheets? Yes (26 used).
  *   No forbidden words in handouts? Yes.
  *   Intensity Asymmetry? Yes (-20 vs -5).
  *   All 3 Discoveries covered? Yes.
