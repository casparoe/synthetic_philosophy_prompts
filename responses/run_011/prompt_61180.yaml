  *(Refining the "Starvation" claim)*: Camp A thinks the ass *would* starve without a picking faculty (or noise). Camp B thinks the ass *never* faces perfect symmetry, so it never starves. Both agree the ass *in reality* does not starve.

  *(Refining Implementability)*: Camp A is clearly easier for code. `if cost_A == cost_B: return random.choice([A, B])`. Camp B requires `if cost_A == cost_B: search_for_micro_preference()`. The latter is inefficient or impossible.

