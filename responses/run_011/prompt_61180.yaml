      *   *Tone Check:* Ensure it sounds like a consensus document, not a debate transcript. Use "We agree," "Camp 1 maintains," etc.
      *   *Robotics Context:* Keep tying it back to the action-selection layer.
      *   *Formatting:* Use clear headings, tables, and numbered lists as requested.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I address the "mixed-strategy" point specifically as requested?
      *   *Fix:* Make sure Crux 1 explicitly discusses whether mixed-strategy indifference proves coexistence or is just macro-level ignorance.
      *   *Critique:* Is the "dog vs. donkey" detail included?
