answer: |-
  ### Specification: Theory of Dirty Hands for Regulatory Enforcement

  **Audience:** Mid-level regulatory attorneys/enforcers (2–5 years tenure).
  **Context:** Administrative discretion, procedural violations, low-visibility wrongs, retrospective discovery.

  #### 1. The Requirements

  **R1. Differentiation from Corruption and Routine Discretion**
  *   **Requirement:** The theory must provide a bright line between *dirty hands* (morally necessary violation), *corruption* (self-serving violation), and *authorized discretion* (permitted flexibility).
  *   **Case:** In your scenario, the attorney fabricates a deficiency. If her role implicitly allows "creative" inspections, this is routine discretion, not DH. If she did it to boost her closure stats, it's corruption. A DH theory that cannot distinguish these three in an administrative context is useless; it will either criminalize necessary enforcement or license abuse.
  *   **Status:** **Non-Negotiable.** Without this, the module trains agents either to be paralyzed or to become rogue actors.

  **R2. Residue as External Obligation, Not Internal Mood**
  *   **Requirement:** The "dirt" must cash out as a specific, actionable obligation owed to a specific party (the firm, the public, the agency), not merely as agent distress, guilt, or "moral stain."
  *   **Case:** The attorney "thinks about it most nights." Classic DH theories (e.g., Walzer) often stop at the agent's tragic burden. For a regulator, guilt is private and politically inert. The theory must dictate what she *owes* the firm whose case was thrown out (e.g., disclosure, recusal from future cases, formal apology) to balance the ledger.
  *   **Status:** **Non-Negotiable.** This is keyed to your explicit demand that the residue be "cashed out as something she actually owes somebody."

  **R3. Retrospective Durability (The "Nullified Good" Test)**
  *   **Requirement:** The justification must remain intelligible even if the "greater good" outcome is legally or practically nullified later.
  *   **Case:** The dumping was prevented, but the case was thrown out because of the pretext. A theory that justifies the lie *only* because it secured a conviction fails here. The theory must account for why the act might still have been the "right" dirty hand even if the legal system later erases the benefit.
  *   **Status:** **Non-Negotiable.** Regulatory work is often undone on appeal. A DH theory dependent on successful outcomes is just outcome-based utilitarianism, which offers no protection when the outcome fails.

  **R4. Role-Morality Integration**
  *   **Requirement:** The theory must explicitly engage with the specific duties of the regulatory role, rather than treating the agent as a generic moral actor.
  *   **Case:** The attorney occupies a role that "arguably pre-authorizes a wide band of enforcement discretion." A theory imported from wartime heads of state ignores that her job *is* to be adversarial. The theory must explain why this specific lie exceeds the role's moral license.
  *   **Status:** **Preference (Deontological/Institutionalist).** Consequentialists may argue the role is irrelevant; only the outcome matters. However, for this audience, ignoring role morality makes the theory alien to their daily reality.

  #### 2. Joint Unsatisfiability Finding

  There is a coherent tension between **R2 (Residue as Obligation)** and **R4 (Role-Morality Integration)** when combined with the candidate requirement **(c) Non-Self-Exculpating**.

  **The Argument:** If the role morality (R4) is robust enough to cover the action (as the case suggests is "unclear"), then there is no dirt, and thus no obligation (R2). If there is an obligation (R2), the act was outside the role's license, which risks classifying it as misconduct/corruption rather than DH. To demand that an agent both *fulfill their role* and *owe a debt for fulfilling it* creates a double-bind: the theory asks the agent to admit they stepped outside their authority to protect the very authority they serve. If you enforce R2 strictly, you undermine the agency's legal position (admitting fault); if you enforce R4 strictly, you erase the DH problem entirely.
  **Verdict:** This is not a defect in your syllabus; it is a finding about the genre. Administrative DH may be incoherent because bureaucracy is designed to absorb discretion without moral residue.

  #### 3. Evaluation of Candidate Requirements & Concepts

  **(a) That the theory explain why the agent is not simply off the hook.**
  *   **Verdict:** **Real Desideratum.**
  *   **Reason:** If the theory concludes the agent is "off the hook," it is a theory of *justification*, not Dirty Hands. The defining feature of DH is the moral remainder. For trainees, understanding that "winning" doesn't mean "clean" is the core pedagogical goal.

  **(b) That the theory be usable prospectively, in real time (20 minutes/phone).**
  *   **Verdict:** **Prejudice (and Dangerous).**
  *   **Reason:** DH is inherently a framework for *reflection* and *accountability*, not a decision procedure. Converting it into a checklist for real-time use transforms it into a license. If you give an agent a "DH Algorithm" to use in twenty minutes, they will use it to rationalize the path of least resistance. It conflicts directly with (c).

  **(c) That the theory be non-self-exculpating.**
  *   **Verdict:** **Hard Requirement (Non-Negotiable).**
  *   **Reason:** A theory of DH that an agent can deploy to authorize their own action ceases to be a constraint and becomes a tool. It must function as a warning system, not a green light. This is the only way to prevent the "necessity" argument from becoming a blanket immunity.

  **Concept: Requiring the agent to feel distress.**
  *   **Verdict:** **Literary Tic.**
  *   **Reason:** Distress is epistemically unreliable. A sociopath can do the right dirty thing without guilt; a neurotic can do the wrong thing with immense guilt. Training should focus on *conduct* and *remedy*, not emotional state.

  **Concept: Keeping blameworthiness and all-things-considered rightness apart.**
  *   **Verdict:** **Genuine Distinction.**
  *   **Reason:** This is the engine of the DH concept. Without it, you collapse into Consequentialism (it was right, so no blame) or Deontology (it was wrong, so don't do it). Maintaining the paradox ("I did what I had to, and I am tainted for it") is the only way to preserve both the necessity of the action and the integrity of the norm violated.

  #### 4. The Killer Requirement

  **R2 (Residue as External Obligation)** knocks out the most contenders.

  **Why:** Most canonical DH literature (Walzer, Nagel, Williams) focuses on the *agent's* integrity, soul, or political burden. They treat the "dirt" as a stain on the *doer*. Demanding that the dirt translate into a specific *owed remedy to the victim* (even an adversarial one) eliminates the "Tragic Hero" model where the leader suffers silently for the greater good. It forces the theory out of the abstract and into the legalistic, which kills most philosophical accounts that rely on vague "moral costs."

  #### 5. Final Verdict on "Wrong-yet-Right"

  The standard "wrong-yet-right-all-things-considered" formulation **survives, but barely.** It holds only if "right" is understood as "necessary for the function of the office" rather than "morally good," and "wrong" is understood as "actionable violation of norm." However, under **R2**, the "right" side is significantly weakened; if you owe a debt, the act wasn't fully "right," it was merely "unavoidable." The formulation shifts from "Wrong but Right" to "Wrong but Necessary, therefore Compensable."
