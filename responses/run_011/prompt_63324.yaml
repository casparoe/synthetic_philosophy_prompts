      *   *User's Summary:* Regularity $R$ in population $P$ in situation $S$ is a convention if:
          1.  Almost everyone conforms to $R$.
          2.  Almost everyone expects almost everyone else to conform.
          3.  Almost everyone has similar preferences over action combinations.
          4.  Almost everyone prefers conformity to $R$ conditional on almost everyone conforming to $R$.
          5.  Almost everyone prefers conformity to $R$ conditional on almost everyone conforming to some alternative $R'$ (Arbitrariness).
          6.  $S$ is a coordination problem.
          7.  Common knowledge of 1-5.
      *   *My Check:* This is accurate to Lewis's main definition (pp. 78-84 of *Convention*). Lewis emphasizes *coordination problems* (conflict of interest is minimal, conflict of coordination is high) and *arbitrariness* (another regularity could have solved the problem just as well). He also discusses *salience* and *precedent* as solutions to the coordination problem.
      *   *Constraint Check:* I need to be careful not to import game-theoretic refinements Lewis didn't make (e.g., evolutionary game theory, costly signaling) unless they map directly to his text concepts like "salience."

  3.  **Drafting - Section by Section:**

      *   **1. The Coordination Problem & The Referendum:**
          *   *Players:* Drivers, pedestrians, state infrastructure managers.
          *   *Options:* Drive Left ($L$) or Drive Right ($R$).
          *   *Payoffs:* Safety, flow, border compatibility. $L/L$ is good, $R/R$ is good, $L/R$ is crash/death.
          *   *Referendum:* 83% voted to keep Left.
          *   *Lewisian Analysis:* Lewis's conditions describe an *existing* convention. They explain stability, not necessarily preference for the *best* equilibrium.
          *   *User's Suspicion:* Voters can't vote themselves into the new equilibrium.
          *   *Assessment:* Correct. In a coordination game, if everyone expects $L$, voting for $R$ is futile/dangerous. The referendum measured preference for the *current equilibrium* given the expectation that others will stick to it, not necessarily the abstract preference for $R$ over $L$ if everyone switched. It reveals the inertia of common knowledge. The vote wasn't about "Which side is better?" but "Which side will we actually be on?"

      *   **2. The Arbitrariness Condition:**
          *   *Issue:* By 1967, was $L$ still arbitrary? 90% cars were LHD (Left-Hand Drive, meant for Right traffic). Neighbors drove Right.
          *   *Lewis's View:* Arbitrariness means $R'$ *could* have served as well *at the inception* or in the abstract. If payoffs shift so $R$ is strictly dominant (not just a coordination equilibrium), it might cease to be a convention and become a matter of pure interest.
          *   *Analysis:* If 90% of cars are LHD, driving Left is actively dangerous (overtaking issues). The payoff matrix changes. $L/L$ is now worse than $R/R$.
          *   *Verdict:* Lewis allows that conventions can persist even if suboptimal, provided they remain coordination equilibria. However, if the payoff asymmetry becomes too great, it stops being a "coordination problem" (where interests align) and becomes a "prisoner's dilemma" or simple optimization problem.
          *   *Nuance:* It was still a convention because $L/L$ was still *an* equilibrium (people weren't dying instantly), just a worse one. The "arbitrariness" holds in the sense that *if* everyone had been driving Right since 1800, that would also work. The fact that the *current* equipment favors Right doesn't make Right "natural," it just shifts the payoff. Lewis's condition 5 (preference for $R$ given conformity to $R'$) is the stress point. Did they prefer $L$ given conformity to $R$? Probably not, due to the car types. So, strictly speaking, the "arbitrariness" condition was fraying. It was becoming a *suboptimal convention* pressured by externalities.

      *   **3. Convention vs. Settled Practice (Capital Substrate):**
          *   *User's Refinement:* Distinguish pure expectation-based convention from one welded to physical capital (steering wheels, signs).
          *   *Lewis's Resources:* Lewis talks about "precedent" and "salience." He acknowledges that past regularity creates expectation.
          *   *Assessment:* The capital substrate acts as a *salience* device and a *payoff shifter*. It makes deviation physically costly, not just coordinatively costly.
          *   *Does it add work?* Yes. Lewis focuses on psychological expectations. The physical substrate makes the expectation *robust* against individual deviation but *rigid* against collective change. It explains why the state was needed. Lewis's theory explains *why* we coordinate, but the "Settled Practice" refinement explains *why* it's hard to switch even when the new equilibrium is better. It highlights the *transaction cost* of switching conventions, which Lewis underplays. Lewis assumes rational agents can switch if salience shifts. The substrate shows that rational agents *cannot* switch individually.
          *   *Conclusion:* It's not redundant. It adds a constraint on the *feasibility* of the coordination problem itself.

      *   **4. The Statute (Law):**
          *   *Issue:* Post-1967, driving Right is law. Is it still a convention?
          *   *Lewis:* Lewis explicitly addresses this. Conventions can be reinforced by law. If the law merely codifies the coordination equilibrium, it's still a convention. If the law *creates* the equilibrium via sanctions (changing the payoff matrix so deviation is punished regardless of others), it might displace the convention.
          *   *Test:* Repeal the law. If people keep driving Right because they expect others to, it's a convention. If they revert or chaos ensues, it was law-dependent.
          *   *Lewis's Entitlement:* Lewis is entitled to run this counterfactual. He distinguishes conventions from obligations.
          *   *Application:* In Sweden, if the law vanished tomorrow, people would still drive Right. The law is a focal point/salience device, but the underlying coordination problem remains. The sanction reinforces the expectation.

      *   **5. Transition & Equilibrium (The "Interval"):**
          *   *Issue:* Lewis describes a *state* (equilibrium), not a *process* (transition).
          *   *Analysis:* The week of the switch was a period of *no equilibrium*. Lewis has little to say about disequilibrium dynamics.
          *   *State Machinery:* The ban, the 04:50 stop, the wrapped signs. These created *Common Knowledge* of the switch time. This is pure Lewis. Salience (Dagen H) + Common Knowledge (media campaign) = New Focal Point.
          *   *Accident Data:* Drop in accidents = heightened attention/salience. Return to baseline = new convention settled, expectations normalized.
          *   *Philosophical Point:* The data confirms the *psychological* aspect of Lewis's theory (expectations drive behavior). The drop shows that when expectations are hyper-salient, caution increases. The return shows the convention has become invisible/background. Lewis's theory doesn't model the *transition cost*, but it explains the *mechanism of the switch* (salience/common knowledge).

      *   **6. Railways (Control Group):**
          *   *Fact:* Rail stayed Left.
          *   *Lewisian Explanation:* Separate coordination problem. $S_{road}$ vs $S_{rail}$.
          *   *Why no switch?* No pressure from neighbors (rail systems aren't as interconnected for cross-border *traffic flow* in the same way cars are; gauge/signaling differences often dominate). No capital pressure (trains are symmetric or built for specific networks).
          *   *Embarrassment?* No. It confirms Lewis. Conventions are local to the population and situation. $P_{drivers}$ vs $P_{conductors}$. The payoff shift (LHD cars) didn't apply to trains. The border pressure was lower.
          *   *Conclusion:* Confirms the specificity of $P$ and $S$ in Lewis's definition.

      *   **7. Verdict & Generalization:**
          *   *Confirms:* The role of Common Knowledge and Salience in establishing equilibrium. The distinction between coordination and preference.
          *   *Strains:* The "Arbitrariness" condition when external payoffs shift (LHD cars). The static nature of the theory vs. dynamic transition costs (substrate).
          *   *Untouched:* The *politics* of the switch (why the Riksdag overrode the referendum). Lewis assumes rational agents, not political bodies.
          *   *Generalization:* Decimalisation (1971 UK). Same pattern: Dated cutover, substrate change (coins), education.
          *   *Predictor of Success:* Creation of a *Schelling Point* (focal point) that is Common Knowledge. The state's ability to manufacture salience.
          *   *Lewis's Limit:* He explains *that* it works, not *how* a state manufactures the salience required to overcome the "Settled Practice" inertia.

  4.  **Review and Refine:**
      *   *Tone:* Disciplined, philosophical, analytical.
      *   *Constraint Check:* Did I list secondary lit? No. Did I retell history excessively? No. Did I admit where Lewis is silent? Yes (transition dynamics).
      *   *Correction on Lewis:* The user's summary is good. I should note that Lewis distinguishes between "convention" and "norm," but the core definition provided is accurate. I need to make sure I don't conflate "law" with "convention" without nuance.
      *   *Specific focus:* Ensure the "Settled Practice" distinction is treated fairly. Is it redundant? I argued "No" because it introduces physical constraints Lewis ignores. I need to be precise there. Lewis talks about "precedent," but physical capital is harder than memory.

  5.  **Final Polish:** Check against the 7 specific prompts to ensure all are answered clearly. (Self-Correction: Make sure to explicitly address the 1955 referendum prediction in section 1).

      *   *Refining Section 1:* The user suspects the referendum measured something other than preference over equilibria. I need to confirm this. It measured preference for the *current* equilibrium given the expectation of *others'* adherence. It's a vote on stability, not optimality.
      *   *Refining Section 2:* Be careful with "Arbitrariness." Lewis says $R'$ must be *possible*. If the car fleet makes $L$ dangerous, is $R'$ really possible? Yes, collectively. Individually, no. This highlights the collective action problem.
      *   *Refining Section 5:* Be explicit: Lewis's theory is static. It has no resources for the *process* of switching, only the *conditions* of the new state. The state machinery supplied the missing "salience" variable.

