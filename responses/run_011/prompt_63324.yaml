answer: |-
  ### 1. The Coordination Problem and the 1955 Referendum

  **The Coordination Problem:**
  In mid-1960s Sweden, the population $P$ consisted of road users (drivers, cyclists, pedestrians). The recurrent situation $S$ was navigating public roadways. The options were binary: Drive Left ($L$) or Drive Right ($R$).
  The payoffs were derived from safety and flow. If almost everyone drives $L$, an individual's payoff is maximized by driving $L$. If almost everyone drives $R$, the payoff is maximized by driving $R$. If the population splits, the payoff is catastrophic (collision). This is a pure coordination problem with two equilibria ($L/L$ and $R/R$).

  **The Referendum Result:**
  Your suspicion is correct. Lewis's conditions describe a stable equilibrium, not a mechanism for selecting between equilibria based on abstract welfare. In 1955, the existing convention was $L$.
  *   **Condition 4 (Conditional Preference):** Voters preferred $L$ conditional on others conforming to $L$.
  *   **Condition 5 (Arbitrariness/Alternative):** While voters might have preferred $R$ conditional on *everyone* conforming to $R$, they could not vote themselves into that state.

  The referendum did not measure "Which equilibrium is theoretically superior?" It measured "Given that I expect others to stick to the current precedent, do I wish to maintain it?" Because the cost of unilateral deviation is death, a rational agent in a coordination game will vote for the status quo even if they believe the alternative equilibrium is superior, unless they have *common knowledge* that the switch will be simultaneous and universal. The 83 per cent vote for Left was a vote for the security of the existing common knowledge, not necessarily a rejection of Right-hand traffic as a system. The referendum measured the *strength of the existing expectation*, not the *preference over abstract rules*.

  ### 2. The Arbitrariness Condition

  Lewis requires that an alternative regularity $R'$ *could* have served nearly as well. By 1967, the "arbitrariness" of the Swedish case was under strain.
  *   **The Strain:** With 90 per cent of cars being left-hand drive (LHD) and neighbours driving Right, the payoff matrix had shifted. $L/L$ was no longer merely a convention; it was becoming a *suboptimal* equilibrium. The cost of $L/L$ (dangerous overtaking, border incompatibility) had risen relative to $R/R$.
  *   **Lewis's Verdict:** Strictly speaking, if the payoffs become so asymmetric that one option is dominant regardless of others' actions, it ceases to be a coordination problem and becomes a problem of individual optimization. However, in 1967 Sweden, $L/L$ was still an equilibrium (people were not crashing constantly), just a costly one.
  *   **Assessment:** The arbitrariness condition holds only in the *structural* sense (Right-hand traffic is not "natural law"), but fails in the *pragmatic* sense (Right-hand traffic was now instrumentally superior given the vehicle fleet). Lewis's framework allows for conventions to persist despite being suboptimal, provided they remain equilibria. Thus, Sweden's Left-hand rule was still a convention, but one under pressure from external payoff shifters. The 1967 switch was not merely removing a lag; it was resolving a tension where the convention had become misaligned with the material conditions of the coordination problem.

  ### 3. Convention vs. Settled Practice (Capital Substrate)

  Your refinement distinguishes between a convention sustained by expectation and a "settled practice" welded to physical capital (steering wheels, signage, muscle memory).
  *   **Lewis's Resources:** Lewis relies on *precedent* and *salience*. Precedent creates expectation; salience makes a specific equilibrium focal.
  *   **The Refinement's Work:** The capital substrate acts as a *rigidity multiplier*. In Lewis's abstract model, agents can switch equilibria if a new salient signal appears. In reality, the physical substrate makes individual deviation physically impossible or prohibitively expensive, not just coordinatively irrational. A driver cannot simply "expect" others to switch; they must physically retrofit the car.
  *   **Redundancy Check:** Is this just a payoff shifter? Yes, but a specific kind. It transforms the coordination problem from a "soft" game of expectations into a "hard" game of logistics. Lewis's theory explains why we coordinate; your refinement explains why we *cannot* re-coordinate without a central authority.
  *   **Conclusion:** The distinction does explanatory work Lewis's resources cannot. Lewis assumes rational agents can update expectations instantly. The "settled practice" concept explains the *inertia* that required a four-year state campaign. It highlights that conventions can become *materially embedded*, requiring a coordinated investment to dislodge, not just a shift in belief. Lewis lacks a theory of the *transaction costs* of switching conventions; the substrate concept supplies it.

  ### 4. The Statute

  Post-1967, driving Right is both a convention and a legal requirement.
  *   **Displacement or Reinforcement?** Lewis explicitly considers the relationship between convention and law. He argues that law often serves to *codify* a convention or provide a *salient focal point* to establish one. If the sanction is the sole reason for conformity, it is not a convention. If conformity persists due to mutual expectation, with law acting as a backup, it remains a convention.
  *   **The Discriminating Test:** Repeal the law tomorrow. If Swedes continue driving Right because they expect others to, it is a convention. If they revert to Left or descend into chaos, it was law-dependent.
  *   **Lewis's Entitlement:** Lewis is entitled to run this counterfactual. His theory is about the *basis* of conformity. In Sweden, the law reinforces the expectation, but the expectation is self-sustaining. The penalty for driving Left is not just a fine; it is a head-on collision. The law aligns with the coordination equilibrium.
  *   **Verdict:** It is still a convention. The statute acts as a *salience device* that stabilizes the common knowledge. It does not displace the convention because the underlying coordination problem (avoiding crashes) remains the primary motivator.

  ### 5. Transition and Equilibrium

  Lewis's theory is static; it describes the conditions of a regularity *in force*. It has no resources for the *interval* in which no equilibrium holds.
  *   **The Interval:** The period between the 1963 decree and 1967, and specifically the night of the switch, was a period of disequilibrium. Lewis cannot explain the *dynamics* of this transition, only the *conditions* required to exit it.
  *   **State Machinery:** The traffic ban, the 04:50 stop, the wrapped signals. These were mechanisms to manufacture *Common Knowledge*. Lewis identifies common knowledge as a necessary condition for convention. The state engineered this by making the switch time a public, undeniable fact (salience).
  *   **Accident Data:** The temporary drop in accidents indicates heightened salience and caution. Drivers knew the expectations were fragile. The return to baseline by 1969 indicates the new convention had solidified; expectations became automatic.
  *   **Philosophical Point:** The data is evidence of the *psychological reality* of Lewis's expectations. When expectations are uncertain (transition), behavior changes (caution). When expectations are common knowledge (post-1969), behavior normalizes. Lewis's theory predicts the *end state*, but the Swedish case shows that *achieving* the end state requires external engineering of salience that Lewis takes as given.

  ### 6. The Railways Control

  Railways continued to drive Left.
  *   **Lewisian Explanation:** This confirms the specificity of $P$ (population) and $S$ (situation) in Lewis's definition.
      *   **Population:** Rail operators are a distinct subset from road drivers.
      *   **Situation:** Rail networks are closed systems. Cross-border traffic is less frequent and more regulated than road traffic.
      *   **Payoffs:** The pressure from neighbours (Norway/Finland) was lower for rail. The capital substrate (trains) is more expensive to retrofit than cars, and trains are often symmetric or less sensitive to side-of-road issues than cars overtaking on narrow lanes.
  *   **Assessment:** This does not embarrass the theory; it validates the boundary conditions. A convention holds only within the population facing the coordination problem. Since the payoff shift (LHD cars) and the border pressure (millions of car crossings) did not apply to rail with the same force, the incentive to switch equilibria was absent. The rail convention remained stable because the coordination problem remained unchanged.

  ### 7. Verdict and Generalization

  **What the Case Confirms:**
  *   **Common Knowledge is Causal:** The switch succeeded because the state made the new rule common knowledge (media campaign, specific time).
  *   **Salience is Manufacturable:** Lewis treats salience as often natural (precedent). Sweden shows salience can be engineered by authority to overcome precedent.
  *   **Equilibrium Stability:** Once the new convention settled, it became self-policing (accident rates normalized), confirming Lewis's view that conventions sustain themselves via expectation.

  **What the Case Strains:**
  *   **Arbitrariness:** The theory struggles when one equilibrium becomes materially superior (LHD cars) before the switch. Lewis's "arbitrariness" condition is too binary; it needs to account for *asymmetric payoffs* that pressure a convention without destroying it.
  *   **Static Nature:** Lewis has no account of the *cost of transition*. The theory explains why we are on one side of the road, not why it took four years and a billion kronor to move to the other.

  **What It Leaves Untouched:**
  *   **Political Authority:** Lewis's agents are equal coordinators. The Swedish case involves a Riksdag overruling a referendum. Lewis's framework does not account for *authority* as a distinct mechanism from *salience*. The state did not just suggest a focal point; it mandated it.

  **Generalization:**
  This analysis generalizes to state-engineered revisions like British decimalisation (1971).
  *   **Predictor of Success:** The critical feature is the creation of a *Schelling Point* (focal point) that is *Common Knowledge*. The date, the education campaign, and the substrate conversion (new coins) served to align expectations simultaneously.
  *   **Lewis's Limit:** Lewis's framework predicts that *if* common knowledge is achieved, coordination will follow. It does not predict *how* a state achieves common knowledge against the inertia of a "settled practice." The Swedish case shows that for deeply embedded conventions, Lewis's psychological conditions are necessary but not sufficient; they must be supplemented by material and legal enforcement to bridge the transition gap. Lewis explains the *logic* of the convention; the Swedish case explains the *logistics* of its revision.
