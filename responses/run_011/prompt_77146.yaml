prompt: |-
  I'm a water rights lawyer, about fifteen years in, mostly prior appropriation states. I think in terms of seniority, beneficial use, the no-speculation rule, forfeiture and abandonment, injury to other appropriators, change applications, decreed rights, and the fact that what you hold isn't the water but a right to divert and apply a flow to a use. That vocabulary is completely natural to me and basically invisible, which is exactly why I want to use it as a test instrument.

  Take the fight over who has a right to the city — zoning, NIMBYism, housing — and restate it in my vocabulary, as faithfully as you can. Three positions, one at a time: (a) the long-time homeowner who wants to control what gets built next door and treats that as an entitlement they earned by being here and by investing; (b) the abundant-housing position that exclusionary zoning is hoarding a scare resource and dressing the hoarding up as a property right; (c) the Lefebvre-flavored claim that the city belongs to its inhabitants rather than its owners, and that what people are owed is a say in how urban space gets produced, not a share of its exchange value.

  For each one, give me the mapping — what the position is actually claiming once it's said in appropriation terms, and what my doctrine would call it — and then a three-part residue report: what translates cleanly, what only translates if you bend the doctrine out of shape, and what has no expression at all. Flag every place where you're borrowing an assumption from water law (rivalry, depletion, a fixed supply, the state as distributor, the need for a decree) and letting it do work the housing claim never asked it to do. Don't smuggle my framework's premises in and then report the resulting mismatch as a discovery about them.

  Then weigh in on a few specifics. Does beneficial use plus anti-speculation plus forfeiture already deliver most of what the YIMBY side argues for on moral grounds, or is that too cheap a win? What does my vocabulary make of a renter of twelve years with no title — is there any slot for them, or does the framework simply not see them? And if there's a claim in this debate that appropriation can only express by ceasing to be appropriation, name it and say why.

  Test the translation on exactly two cases: someone who bought in 1985 and now opposes a fourplex next door, and someone who owns three units and keeps one empty. If your doctrinal details would be shaky outside the general framework, say so rather than inventing rules — I know this area and I'd rather have the gaps marked.

  No reading list, no citations, I want the translation and the residue. Call it a page and a half.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Persona:** Water rights lawyer, 15 years experience, prior appropriation doctrine expert (seniority, beneficial use, no-speculation, forfeiture/abandonment, injury, change applications, decreed rights, right to divert/use not own water).
      *   **Task:** Restate the urban housing/zoning debate using water law vocabulary as a test instrument.
      *   **Positions to Translate:**
          1.  Long-time homeowner (NIMBY/entitlement based on tenure/investment).
          2.  Abundant housing/YIMBY (exclusionary zoning as hoarding/scarcity manipulation).
          3.  Lefebvre-style Right to the City (inhabitants vs. owners, use value vs. exchange value).
      *   **Structure per Position:** Mapping (claim in appropriation terms + doctrinal label) + Three-part Residue Report (clean translation, bent doctrine, no expression).
      *   **Constraint:** Flag assumptions borrowed from water law (rivalry, depletion, fixed supply, state distributor, decree) that might distort the housing claim. Don't smuggle premises in.
      *   **Specific Weigh-ins:**
          *   Does beneficial use + anti-speculation + forfeiture deliver the YIMBY moral argument too cheaply?
          *   What about a 12-year renter with no title?
          *   Is there a claim that appropriation can only express by ceasing to be appropriation?
      *   **Test Cases:**
          1.  1985 buyer opposing a fourplex.
          2.  Owner of three units keeping one empty.
      *   **Format:** No reading list, no citations. Approx. 1.5 pages. Mark gaps/shaky doctrine.

  2.  **Deconstruct the Positions (Water Law Lens):**

      *   **Position A (Long-time Homeowner):**
          *   *Water Equivalent:* Senior appropriator. "I was here first." Reliance interest. Vested right.
          *   *Doctrine:* Seniority, Reliance, Injury to senior appropriators (change application standard).
          *   *Assumption Check:* Water rights are usufructuary (use), not ownership of the resource itself. Homeowners often claim ownership of the *character* of the neighborhood. Water law protects the *flow*, not the pool level necessarily, unless defined by decree.

      *   **Position B (Abundant Housing/YIMBY):**
          *   *Water Equivalent:* Anti-hoarding, Beneficial Use, No Speculation.
          *   *Doctrine:* Forfeiture/Abandonment (non-use), Beneficial Use (maximizing utility), Public Trust (maybe?).
          *   *Assumption Check:* Water is rivalrous and depletable. Housing is rivalrous but land is fixed; density changes the "flow." Water law assumes a fixed supply often; housing supply is elastic via zoning.

      *   **Position C (Lefebvre/Right to the City):**
          *   *Water Equivalent:* Public Trust Doctrine? Or challenging the appropriation system itself?
          *   *Doctrine:* This is tricky. Appropriation is about individual rights to divert. Lefebvre is about collective production of space.
          *   *Assumption Check:* Water law is inherently individualistic/property-based. Lefebvre is anti-commodification. This might be the "ceasing to be appropriation" point.

  3.  **Drafting the Translations & Residue:**

      *   *Pos A:* Claim is "Seniority." Doctrine: "Vested Right" protected against "Injury." Residue: Clean = Seniority. Bent = Injury (property values vs. water flow). None = Ownership of ambient conditions (water law protects quantity/quality, not scenery).
      *   *Pos B:* Claim is "Beneficial Use." Doctrine: "Forfeiture/Abandonment" for underutilized land. Residue: Clean = Anti-speculation. Bent = Beneficial use (housing isn't consumptive like water). None = Market pricing (water admin doesn't set price, just priority).
      *   *Pos C:* Claim is "Public Trust." Doctrine: "State as Trustee." Residue: Clean = State oversight. Bent = Inhabitants vs. Owners (water law distinguishes appropriators). None = Collective production (water law is individual diversion).

  4.  **Addressing Specific Weigh-ins:**

      *   *YIMBY Moral Win:* Beneficial use/anti-speculation gets close but misses the *distributional* justice. Water law cares about *use*, not *who* uses it (mostly). It's too cheap because it ignores affordability.
      *   *Renter:* No slot. Water law recognizes the appropriator (title holder/divertor). Renter is like someone buying water from a ditch company but has no standing in adjudication.
      *   *Ceasing to be Appropriation:* The Lefebvre claim. Appropriation requires individualization of a right. Collective production dissolves the individual right.

  5.  **Test Cases:**

      *   *1985 Buyer:* Senior appropriator filing protest against change application (upzoning). Claim: Injury to reliance interests. Doctrine: shaky on whether "neighborhood character" is a beneficial use.
      *   *3-unit Owner (1 empty)::* Speculator. Doctrine: Forfeiture/Abandonment. Shaky: Water forfeiture requires intent + non-use. Housing vacancy isn't always intent to withhold.

  6.  **Refining Constraints & Tone:**
      *   Tone: Professional, precise, leveraging the user's expertise without explaining basics.
      *   Length: ~1.5 pages (approx. 750-900 words).
      *   Flagging Assumptions: Crucial. Must highlight where water law's physicality (depletion) mismatches housing's regulatory scarcity.

  7.  **Drafting - Section by Section (Mental or Scratchpad):**

      *   *Intro:* Acknowledge the lens.
      *   *Position A (Homeowner):* Seniority. Injury. Residue: Character isn't flow.
      *   *Position B (YIMBY):* Beneficial use. Forfeiture. Residue: Supply isn't fixed like water.
      *   *Position C (Lefebvre):* Public Trust? Or anti-appropriation. Residue: Individual vs. Collective.
      *   *Specifics:* YIMBY moral win (too cheap), Renter (invisible), Ceasing to be appropriation (Lefebvre).
      *   *Test Cases:* 1985 Buyer (Senior protest), 3-unit Owner (Forfeiture candidate).
      *   *Closing:* Limitations.

  8.  **Review against Constraints:**
      *   *Flag assumptions:* Need to explicitly note where I'm importing "fixed supply" or "depletion."
      *   *No smuggling:* Ensure I don't say water law solves housing, just translates it.
      *   *Shaky Doctrine:* Admit where water law doesn't map (e.g., vacancy vs. abandonment).
      *   *Length:* Keep it tight.

  9.  **Final Polish:** Check the vocabulary (divert, apply, decree, seniority, injury, beneficial use, speculation, forfeiture, abandonment). Ensure the "Residue Report" format is clear.

  *(Self-Correction during drafting)*: I need to be careful with the Lefebvre section. Water law is fundamentally about property rights in a public resource. Lefebvre is about use value over exchange value. The translation might break down completely here, which is the point. I should highlight that this is where the framework hits the wall.

  *(Self-Correction on Renter)*: In water law, a lessee of water rights exists but usually needs the owner's standing. A renter of land has no water right unless appurtenant. This maps well to "no standing."

  *(Self-Correction on Test Cases)*: Be specific about the doctrinal shakiness. For the 1985 buyer, "injury" in water law is hydraulic, not economic/aesthetic. For the 3-unit owner, "intent to abandon" is hard to prove in water law without statutory presumptions.

  10. **Final Word Count Check:** Aim for dense, high-signal prose to fit the page limit.

  *(Drafting thought)*: Start directly with the positions. Skip lengthy intro.

  *(Drafting thought)*: Make sure the "Flag" requirement is visible. I will embed it in the Residue Report.

  *(Drafting thought)*: Ensure the "Ceasing to be appropriation" point is distinct.

