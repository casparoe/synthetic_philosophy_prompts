answer: |-
  **Position A: The Long-Time Homeowner**
  **Mapping:** This claimant asserts **Seniority**. Their tenure establishes a vested priority date (1985). They view zoning not as regulation but as a **Decree** defining the scope of their right. Opposition to new construction is a **Protest Against Injury** in a change application. They argue that increased density alters the "return flow" of the neighborhood (traffic, shadows, character), impairing their vested reliance interests.
  **Doctrinal Label:** Senior Appropriator claiming Injury to Beneficial Use.
  **Residue Report:**
  1.  *Clean Translation:* Seniority and reliance are core to prior appropriation. The state protects vested rights against junior impairments.
  2.  *Bent Doctrine:* "Injury" in water law is hydraulic (quantity/quality/timing). Here, it is expanded to economic value and aesthetic expectation. Water law protects the *diversion*, not the value of the land served.
  3.  *No Expression:* There is no right to maintain the status quo of the resource pool itself. Water law assumes the resource fluctuates; this claim assumes the neighborhood *capacity* is fixed.
  **Flagged Assumption:** Borrowing **Depletion**. Water law assumes use depletes the stream. Housing law assumes density depletes "neighborhood character," but this is a regulatory construct, not a physical exhaustion.

  **Position B: Abundant Housing (YIMBY)**
  **Mapping:** This position argues that exclusionary zoning creates **Artificial Scarcity** akin to hoarding. Underutilized land is **Non-Beneficial Use**. Vacant units or single-family homes in transit corridors are **Speculative Holds** violating the anti-speculation doctrine. They demand **Forfeiture** or **Abandonment** proceedings against owners who withhold land from maximum utility.
  **Doctrinal Label:** State Enforcement of Beneficial Use and Anti-Speculation.
  **Residue Report:**
  1.  *Clean Translation:* The no-speculation rule and forfeiture statutes directly target withholding resources from productive use.
  2.  *Bent Doctrine:* **Beneficial Use** in water is consumptive or diversionary. In housing, "use" is static occupancy. Maximizing housing "flow" requires changing the diversion works (zoning), not just policing the use.
  3.  *No Expression:* Water law does not mandate *affordability*, only *use*. A senior can use water wastefully if permitted; YIMBY seeks efficient *distribution*, not just efficient *use*.
  **Flagged Assumption:** Borrowing **Fixed Supply**. Water law adjudicates a fixed flow. Housing supply is elastic; the scarcity is regulatory, not hydrological. Treating zoning like a natural decree smuggles in physical limits that don't exist.

  **Position C: Lefebvre / Right to the City**
  **Mapping:** This claim rejects the appropriation framework. It argues the city is a **Public Trust** resource where inhabitants hold a collective interest superior to individual decrees. It demands standing not based on priority or title, but on **Presence**. It seeks to replace the right to *divert* (extract value) with a right to *participate in production*.
  **Doctrinal Label:** Public Trust Doctrine / Challenge to Appropriability.
  **Residue Report:**
  1.  *Clean Translation:* The state holds water in trust for the public; some housing advocates argue land is similarly held.
  2.  *Bent Doctrine:* Appropriation requires individualization of a right. This claim is inherently collective.
  3.  *No Expression:* Prior appropriation cannot express a right that denies property exclusivity.
  **Flagged Assumption:** Borrowing **State as Distributor**. Water law assumes the state allocates rights. This claim argues the allocation mechanism itself is illegitimate.

  **Specific Weigh-Ins**

  **Does Beneficial Use + Anti-Speculation deliver the YIMBY moral win?**
  Too cheap. It secures efficiency, not equity. Water law punishes waste, but it does not punish a senior who uses their full decreed amount even if juniors go dry. Applying this to housing stops hoarding but protects the incumbent's full "decreed" density. It validates the YIMBY critique of vacancy but fails to address exclusionary history or affordability. It optimizes the market without questioning the priority system.

  **The Twelve-Year Renter:**
  No slot. In appropriation, standing belongs to the decreed owner or the divertor. A renter is a customer of the right-holder, not a holder. They have no standing to protest a change application unless they can prove specific injury distinct from the general public. The framework renders them invisible because they hold no **Title** to the diversion.

  **The Claim Requiring the End of Appropriation:**
  Position C (Lefebvre). Appropriation requires individuating a public resource into private rights of use. The claim that urban space is co-produced by inhabitants dissolves the boundary between owner and user. To express this, you must cease treating housing as a divertible right and start treating it as a commons. You cannot appropriate a right to *participate*; you either have the power or you don't.

  **Test Cases**

  **1. 1985 Buyer Opposing Fourplex:**
  *Translation:* Senior appropriator protesting a junior's change application.
  *Doctrinal Status:* **Shaky.** In water law, injury must be to the *water right*, not the *economic value* of the farm. If the fourplex doesn't physically impair their lot (e.g., drainage), the protest fails. Water law does not protect "view sheds" or "neighborhood character" as beneficial uses. The 1985 buyer is claiming a right to the *context*, which appropriation law does not recognize.

  **2. Owner of Three Units Keeping One Empty:**
  *Translation:* Potential forfeiture/abandonment case.
  *Doctrinal Status:* **Shaky.** Water forfeiture requires **Intent** to abandon plus non-use. Statutory presumptions often help (e.g., 5 years non-use), but intent is hard to prove. In housing, vacancy may be for renovation, market timing, or personal use. Without a statutory presumption of abandonment specific to housing, water law doctrine lacks the teeth to force diversion. It identifies the violation but lacks the mechanism to compel use without legislative amendment.

  **Summary Limit:**
  The translation holds on **Seniority** and **Waste**, but breaks on **Value** and **Standing**. Water law manages physical depletion among recognized users. Housing debates are about social construction among recognized and unrecognized inhabitants. Using appropriation vocabulary clarifies the power dynamics of tenure but obscures the politics of inclusion.
