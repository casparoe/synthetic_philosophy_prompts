prompt: |-
  So I'm a second-year philosophy master's student and I somehow let myself get talked into giving the last talk of the term at our department's "choice and rationality" reading group, which is this weird cross-listed thing that's half philosophy seminar, half business school workshop. Thirty minutes plus maybe fifteen of Q&A, and honestly the Q&A is what I'm dreading. The usual crowd is: three economists from the business school who work on revealed preference and axiomatization and who basically think anything normative that isn't backed by a representation theorem is just vibes; two philosophers who are card-carrying Savageans, one of whom has a paper defending the sure-thing principle against Allais-style data; a psychologist who runs a lab doing risky-choice experiments and cares about paradigms and effect sizes way more than axioms; and one CS person who works on aggregating preferences for ML systems and thinks about all of this as objective-function design. Nobody there works on risk aversion proper and I'm fairly sure most of them know Buchak's risk-weighted expected utility only from hostile second-hand summaries.

  What I'm presenting isn't just REU though — I want to defend a restricted version of it that I've been calling one-shot risk weighting, and I need help anticipating where it falls over. The claim: rank-dependent risk attitudes, where the weight on an outcome depends on its rank in the distribution and not just on its probability, are legitimate only when the decision is genuinely non-replayable — one shot, irreversible, the outcome lands once on a life you can't re-gamble — whereas plain expected utility governs repeatable or decomposable gambles, where the agent can commit to a policy and the stakes come in many small bites. My argument is three steps: Allais-type violations of independence are systematic and stable rather than performance error, so we need something non-orthodox in the toolbox; but unrestricted REU is exposed to the usual money-pump and dynamic-incoherence stuff (the Hammond-style line), so it can't be the whole story; and the way to buy off the dynamic objections is to confine risk-weighting to decisions that can't be decomposed into a sequence, using something like McClennen's resolute choice where I need it. The fun part, and its also the part I know is exposed: the view predicts a split. Big one-shot choices (take the job at the risky startup, have the risky surgery, that kind of thing) get risk-weighting, but the small-stakes risk aversion the psychologist keeps finding is either irrational or evidence that subjects are misframing a repeatable gamble as a one-shot one — and Rabin's calibration result does a lot of work for me there, since it shows the orthodox theory can't accommodate small-stakes aversion without absurd large-stakes aversion.

  Can you write me the prep sheet? I want the eight or nine objections this specific room will actually raise, ordered by how much damage they'd do to me rather than by how interesting they are, each phrased the way that person would phrase it. I really want to hear the economists' version in their own vocabulary — is it testable, what's the axiom set, is your restriction detectable in revealed preference, is this just a fudge factor with a free parameter — and the Savagean philosopher's version in theirs, because those two will not overlap. For each objection give me a reply I can deliver in about ninety seconds with no slides, a blunt note on where that reply is soft or where I'm obviously begging the question, and tell me which two things I should just concede in the first five minutes so I don't spend the whole talk looking like I'm dodging. I'm especially nervous about (a) the objection that one-shotness isn't a feature of the world but of how you describe the decision, since you can redescribe almost anything as unique and non-replayable, and (b) what happens when a bunch of one-shot decisions aggregate — a government facing repeated pandemic or climate choices, each irreversible on its own — because then my restriction seems to license risk-weighting at exactly the scale where it's most dangerous. Also flag the question I'm praying nobody asks, the one where I have no answer yet and would have to say I'm still working on it. Please don't hand me a bibliography or a reading list, I have four days and zero time to read anything new — just tell me what they'll say and what I say back.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** 2nd-year Philosophy MA student.
      *   **Task:** Giving the last talk of the term at a "Choice and Rationality" reading group.
      *   **Audience:** Mixed bag (3 Economists/Business School, 2 Savagean Philosophers, 1 Psychologist, 1 CS/ML person).
      *   **Topic:** Defending a restricted version of Risk-Weighted Expected Utility (REU), specifically "One-Shot Risk Weighting" (OSRW).
      *   **Core Claim:** REU is legitimate *only* for genuine one-shot, irreversible decisions. EU governs repeatable/decomposable gambles.
      *   **Arguments:** Allais violations are real (need non-orthodox); Unrestricted REU fails dynamic coherence (Hammond); Restricting to one-shot + resolute choice solves dynamic issues; Rabin's calibration supports the split (small stakes = EU, large one-shot = REU).
      *   **Constraints:** 30 min talk + 15 min Q&A. No time for new reading. Needs a prep sheet with 8-9 objections ordered by damage, phrased in the specific audience's jargon, with 90-second replies, vulnerability notes, concessions, and the "prayer question."
      *   **Specific Worries:** (a) One-shotness is descriptive/frame-dependent, not ontological. (b) Aggregation problem (government/policy scale).

  2.  **Deconstruct the Audience & Their Likely Objections:**

      *   **Economists (Revealed Preference/Axiomatization):** Care about testability, axioms, representation theorems, parsimony. They hate "vibes" and ad-hoc restrictions.
          *   *Objection:* Is this testable? How do you distinguish a one-shot from a repeatable in revealed preference data? Isn't this just adding a free parameter?
      *   **Savagean Philosophers (Normative/Foundations):** Care about coherence, Dutch Books, Money Pumps, Sure-Thing Principle.
          *   *Objection:* Dynamic inconsistency. Even if you claim "one-shot," life is a sequence. Resolute choice is irrational pre-commitment.
      *   **Psychologist (Empirical/Experimental):** Care about framing, ecological validity, cognitive load.
          *   *Objection:* People treat small stakes as one-shots all the time. Your theory calls them irrational, but maybe your theory is wrong about the norm.
      *   **CS/ML Person (Aggregation/Objective Functions):** Care about scaling, system design, alignment.
          *   *Objection:* If I build an agent, do I hardcode the "one-shot" detector? What happens when agents interact?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Killer): The Frame-Relativity of "One-Shot".* (User's worry 'a'). If I can frame a repeatable gamble as a sequence of one-shots, or a one-shot as a portfolio item, the theory collapses.
      *   *Objection 2 (The Economist): Revealed Preference Identification.* How do I observe "one-shotness"? If it's not in the choice data, it's mentalistic.
      *   *Objection 3 (The Savagean): Dynamic Inconsistency/Resolute Choice.* Hammond's critique. If you plan to use REU now but EU later, you're inconsistent. Resolute choice is just stubbornness.
      *   *Objection 4 (The Aggregation Problem): Policy/Scale.* (User's worry 'b'). Governments make "one-shot" decisions repeatedly. If REU applies there, we get weird social welfare functions.
      *   *Objection 5 (The Psychologist): Small-Stakes Framing.* Rabin helps you, but subjects *feel* risk aversion in small stakes. Calling it a "framing error" is normative arrogance.
      *   *Objection 6 (The Economist): Parsimony/Free Parameter.* Why not just use a utility function with varying curvature? REU adds a risk function *and* a switch mechanism. Too complex.
      *   *Objection 7 (The CS Person): Operationalization.* How does an AI know when it's in a one-shot scenario? If it gets it wrong, does it crash?
      *   *Objection 8 (The Savagean): The Sure-Thing Principle.* Even in one-shots, if event E doesn't affect the outcome, why weight it differently?
      *   *Objection 9 (The "Gotcha"): Interpersonal Aggregation.* If I use REU for myself, do we sum REU for society? Harsanyi vs. Buchak.

      *Refining the Order:* The "Frame-Relativity" and "Revealed Preference" objections are the most damaging because they attack the core mechanism's coherence and testability. The "Aggregation/Policy" one is dangerous for normative implications. The "Dynamic/Resolute" one is standard but manageable if the "one-shot" claim holds.

  4.  **Developing Replies & Vulnerability Notes:**
      *   Need to be concise (90 seconds).
      *   Need to acknowledge where the argument is weak (the "soft spot").
      *   Need to match the jargon (e.g., economists want "identification," philosophers want "diachronic coherence").

  5.  **Identifying Concessions:**
      *   User needs to concede something early to build goodwill.
      *   Concession 1: The "One-Shot" definition is the weakest link (address worry 'a').
      *   Concession 2: Unrestricted REU *is* dynamically inconsistent (agree with Savageans to isolate the restriction).

  6.  **Identifying the "Prayer Question":**
      *   What's the hole in the theory? Probably the *criterion* for one-shotness. If pressed on *exactly* what physical or structural feature makes a decision one-shot, the user might not have a non-circular answer.

  7.  **Review against Constraints:**
      *   No bibliography.
      *   8-9 objections.
      *   Ordered by damage.
      *   Specific personas (Economist, Savagean, Psych, CS).
      *   Address specific worries (a) and (b).

  8.  **Final Polish:**
      *   Tone: Professional, slightly cynical (matching the user's description of the room), direct.
      *   Ensure the "Economist" sounds like an Econ (identification, primitives, observables).
      *   Ensure the "Savagean" sounds like a Phil (normative force, diachronic, coherence).

  *(Self-Correction during drafting)*: I initially thought about putting the Aggregation problem first. But the "Frame-Relativity" objection is more fundamental. If "one-shot" is just in the eye of the beholder, the whole theory is subjective. I'll put Frame-Relativity first. The Economist's "Identification" objection is a close second because if you can't test it, the Business School crowd will eat you alive.

  Let's refine the "Prayer Question." It shouldn't just be "I don't know." It should be "I'm working on it." The question is likely about the *boundary condition*. When does a sequence become a single gamble?

  Let's refine the Concessions. Conceding that "One-shotness is partly descriptive" is dangerous. Better to concede that "My account doesn't solve the measurement problem yet" but hold the line on the normative claim. Actually, the prompt asks to concede things so I don't look like I'm dodging. Conceding that *unrestricted* REU is dynamically inconsistent is safe (that's the motivation). Conceding that the *operational definition* of one-shotness needs work is honest.

  Okay, let's write it.

  *Structure:*
  1.  Intro/Strategy.
  2.  The Two Concessions.
  3.  The 9 Objections (Ranked).
  4.  The Prayer Question.
  5.  Closing advice.

  *Voice:* Peer-to-peer, strategic, no fluff.

  *Check:* Did I cover the Rabin point? Yes, in the Psychologist objection. Did I cover the Hammond/Resolute choice? Yes, in the Savagean objection. Did I cover the CS angle? Yes, in the operationalization objection.

  *Final check on the "One-Shot" definition:* The user's worry (a) is that one-shotness isn't a feature of the world. I need to make sure the reply acknowledges this but pivots to "decision-theoretic structure" rather than "ontological uniqueness."

  *Final check on Aggregation (b):* This needs to be high on the list because it threatens the normative utility of the view for policy.

  Okay, ready to generate.
answer: |-
  Here is your prep sheet. It is designed for the specific ecosystem you described. The objections are ranked by lethality, not interest. The replies are scripted for ~90 seconds spoken at a normal pace.

  ### Strategic Concessions (Make these in the first 5 minutes)
  *Do not wait for Q&A to make these. State them in your intro to disarm the room.*

  1.  **Concede Dynamic Inconsistency for Unrestricted REU:** Explicitly agree with the Savageans that *global* REU is diachronically incoherent (Hammond's critique). Tell them your project *starts* from that agreement. If you try to defend unrestricted REU against money pumps, you lose the Savageans immediately.
  2.  **Concede the "Measurement Problem":** Admit upfront that distinguishing a "one-shot" from a "repeatable" gamble in observed data is difficult and that your account currently relies on the agent's *description* of the problem, not just the physical structure. This pre-empts the "it's unfalsifiable" attack by framing it as a feature (normative dependence on framing) rather than a bug.

  ---

  ### The Objections (Ranked by Damage)

  #### 1. The Frame-Relativity Objection (The "Ontology" Attack)
  **Who:** The Senior Savagean or the Lead Economist.
  **The Objection:** "You say risk-weighting applies to 'one-shots,' but one-shotness isn't in the world; it's in the description. I can describe a sequence of 100 gambles as one portfolio choice (one-shot), or one big gamble as 100 micro-decisions. If your normative rule flips based on how I describe the tree, your theory is just subjective framing, not rationality. How do you prevent agents from gerrymandering the description to get the risk-weights they want?"
  **The Reply:** "You're right that physical structure doesn't dictate the frame, but rational constraints do. I'm not saying 'whatever feels like a one-shot is one.' I'm saying a decision is one-shot when *decomposition is causally impossible*—you literally cannot access the intermediate feedback or adjust the policy. The normativity comes from the *constraint on learning*, not the agent's mood. If you can break it down, you *ought* to, and EU applies. If you can't, REU is permitted. The gerrymandering worry is real, but it's a constraint on *description*, not a license for arbitrariness."
  **Soft Spot:** You are begging the question on what counts as "causally impossible." The Economist will press on whether this is observable.

  #### 2. The Identification Problem (The "Revealed Preference" Attack)
  **Who:** The Business School Economists (in unison).
  **The Objection:** "In revealed preference, we identify preferences from choices. If you have two parameters—utility curvature and a risk-weighting function—and a switch mechanism based on an unobservable 'one-shot' variable, your model is under-identified. I can fit an EU model with a weird utility function to your REU data. What testable prediction does your restriction make that standard EU with a flexible $u(x)$ doesn't?"
  **The Reply:** "The prediction is structural, not just behavioral. EU requires the Independence Axiom to hold across *all* domains. My model predicts a specific *violation pattern*: Independence holds for decomposable/repeatable sequences but fails systematically for non-decomposable singular events. If you see Allais-type violations in small-stakes lab repeats, my model says that's error or misframing. If you see them in life-altering singular choices, my model says that's rational. Standard EU can't capture that switch without ad-hoc utility adjustments for every context."
  **Soft Spot:** They will argue that "context-dependent utility" is cheaper than "context-dependent rationality standards."

  #### 3. The Aggregation/Policy Problem (Your Worry 'b')
  **Who:** The CS Person or the Policy-minded Economist.
  **The Objection:** "Governments and ML systems face 'one-shot' decisions constantly—pandemic response, climate tipping points. Each is irreversible. But these decisions aggregate over time and population. If you license REU for high-stakes policy, you license a social welfare function that violates Pareto or creates time-inconsistency at the institutional level. Are you saying a state *ought* to be risk-weighted over its citizens' lives in a way that would be irrational for an individual over time?"
  **The Reply:** "This is the hardest extension, and I'm cautious. My claim is about *individual* rationality under structural constraints. Aggregating REU preferences socially is a separate problem (Harsanyi-style). However, for a government, the 'repeatability' condition often returns: policy is a sequence of interventions, not a single bet. So for the state, EU might actually be the correct norm *because* they can adjust policy over time, even if the individual citizen faces a one-shot. The level of analysis matters."
  **Soft Spot:** This is weak. If the citizen faces a one-shot, why should the state governing them use EU? It looks like you're privileging the system over the agent.

  #### 4. The Resolute Choice Regress (The "Savagean" Attack)
  **Who:** The Savagean Philosopher (the one defending Sure-Thing).
  **The Objection:** "You invoke McClennen's resolute choice to block the money pump. But resolute choice is just 'stubbornness.' If I know at $t_1$ that I will want to violate Independence at $t_2$, planning to be resolute is dynamically inconsistent. You haven't solved the incoherence; you've just hidden it behind a 'one-shot' label. Why isn't this just a sophisticated money pump where you pay to prevent yourself from maximizing later?"
  **The Reply:** "Resolute choice isn't stubbornness; it's a different conception of agency. In a genuine one-shot, there is no $t_2$ where you can re-optimize based on new information. The 'plan' is the only lever you have. The money pump requires a sequence of *opportunities* to trade. If the decision is truly non-decomposable, the pump never gets started. I'm not blocking the pump; I'm denying the conditions for the pump exist."
  **Soft Spot:** If they argue that *deliberation* itself is a sequence, you're in trouble.

  #### 5. The "Small-Stakes Framing" Objection (The Psychologist)
  **Who:** The Psychologist.
  **The Objection:** "My data shows people are risk-averse over small stakes all the time. You use Rabin to say this is irrational framing. But if humans cognitively *cannot* help but frame small gambles as one-shots due to affect or salience, is it useful to call it irrational? You're defining rationality in a way that no human can satisfy in real-time. Isn't that a normative failure?"
  **The Reply:** "There's a difference between 'hard to do' and 'normatively wrong.' If I frame a repeatable insurance deductible as a one-shot loss, I might pay too much. My theory says: you *should* learn to reframe repeatable risks as portfolios. The normativity is aspirational. But for the surgery or the startup job, the framing isn't a cognitive error; it's the reality of the situation. I'm not blaming subjects for small-stakes aversion; I'm saying it's a costly error they should be trained out of, unlike large-stakes one-shot aversion."
  **Soft Spot:** Sounds elitist. The Psychologist cares about ecological validity, not idealized training.

  #### 6. The Parsimony/Free Parameter Objection
  **Who:** The Economists.
  **The Objection:** "Occam's Razor. EU has one function $u$. REU has $u$ plus a risk function $r$. Plus now you have a 'one-shot detector' function. You're adding complexity to save a phenomenon (Allais) that could be explained by probability weighting or simple error. Why should we accept this ontological bloat?"
  **The Reply:** "Because the 'error' is too systematic to be noise, and probability weighting (like Prospect Theory) is descriptive, not normative. I'm offering a *justification* for the behavior, not just a fit. The 'bloat' is the price of acknowledging that risk is a distinct normative concern from value, but *only* when you can't average it out. It's a targeted complexity, not a global one."
  **Soft Spot:** Economists hate targeted complexity. They want a universal law.

  #### 7. The "Objective Function" Objection
  **Who:** The CS/ML Person.
  **The Objection:** "If I'm designing an autonomous agent, I need a single objective function. I can't code a switch that says 'if one-shot then REU else EU' because the environment is non-stationary. If the agent misclassifies a repeatable task as one-shot, it becomes exploitable. Why wouldn't I just hardcode EU to be safe?"
  **The Reply:** "Because safety isn't the only value. If the agent is acting on behalf of a human principal in a high-stakes, non-repeatable domain (e.g., medical triage), EU might violate the principal's legitimate risk attitudes. You code the switch based on the *contract* with the principal. If the task is 'maximize long-run reward,' use EU. If the task is 'secure this specific outcome,' use REU. The switch is in the reward specification, not the physics."
  **Soft Spot:** Assumes the principal knows what they want.

  #### 8. The Sure-Thing Principle (STP) Persistence
  **Who:** The Savagean Philosopher.
  **The Objection:** "Even in a one-shot, if event $E$ is irrelevant to the outcome, why should the probability of $E$ affect the weight? REU violates STP. If I offer you a bet on rain, and I add a coin flip that pays nothing, your risk-weight changes. That seems irrational regardless of repeatability."
  **The Reply:** "Because in REU, risk is a property of the *distribution*, not just the outcomes. Adding the coin flip changes the rank-ordering of the outcomes in the state space, which changes the risk profile. In a one-shot, the structure of the uncertainty matters, not just the conditional payoffs. I'm rejecting STP as a universal norm, not just in repeatable cases."
  **Soft Spot:** Savageans view STP as constitutive of rationality. Rejecting it is a bullet bite.

  #### 9. The "Slippery Slope" Objection
  **Who:** Anyone (The Closer).
  **The Objection:** "If you allow REU for 'life-altering' choices, where is the line? Is buying a car one-shot? Is a vacation? If the line is vague, the theory is useless for guidance."
  **The Reply:** "The line is the *capacity for feedback and adjustment*. Can you undo this? Can you learn from a smaller version? If yes, it's repeatable (EU). If no, it's one-shot (REU). It's not about dollar value; it's about reversibility. Yes, there are edge cases, but the paradigm cases (surgery, career, marriage) are clear enough to do work."
  **Soft Spot:** Edge cases are where all the actual decisions happen.

  ---

  ### The "Prayer Question" (The one you have no answer for)
  **The Question:** "You say the switch depends on whether the agent *can* decompose the gamble. But decomposition is often a matter of *financial engineering* or *institutional design*. If I can buy insurance or hedge a 'one-shot' risk, does it become EU? If so, isn't your theory just saying 'REU is rational only for the poor/unhedged'?"

  **Why it hurts:** It turns your normative distinction into a socioeconomic contingency. It implies rationality depends on market access.
  **Your Save:** "That's a profound implication, not a refutation. If you *can* hedge, you *should*, and then EU applies. If you can't hedge (because the market is incomplete), REU applies. This actually argues for *more* financial instruments to allow people to convert one-shot risks into repeatable ones. My theory implies that incomplete markets force agents into a different rationality regime."
  *(Note: Say this confidently, but internally acknowledge this is where the theory is most vulnerable to political economy critiques.)*

  ### Final Tactical Advice
  *   **Don't fight the Savageans on axioms.** You won't win. Fight them on the *scope* of the axioms.
  *   **Use the Economists' Rabin point against them.** They love Rabin. Remind them that Rabin proves EU is absurd for small stakes *unless* you assume people are irrational. You are giving them a way to keep EU for small stakes (by calling them repeatable) while saving the large-stakes data.
  *   **Watch the Clock.** If you spend too long on the "One-Shot" definition in the talk, they will tear it apart in Q&A. Define it simply, move to the implications, and let the Q&A be about the implications.
  *   **Body Language:** When the Economists speak, lean in (show you respect the rigor). When the Psychologist speaks, nod (show you respect the data). When the Savagean speaks, hold your ground (they expect a fight).

  Good luck. You have a coherent position, but it lives on a knife-edge. Don't let them push you off.
