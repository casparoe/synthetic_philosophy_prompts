          *   Flag any necessary stipulations about AI abilities or human circumstances.
          *   Use accessible language (no unexplained jargon).
          *   Critically evaluate the user's framing (is the distinction coherent?).
          *   State confidence level and the point of least certainty.

  2.  **Deconstruct the Core Philosophical Claim:**
      *   The user posits a distinction between influencing *how* someone thinks (mind-level) vs. influencing *where/when/what* they think about (environment-level).
      *   Standard ethics focuses on content (lies, coercion, hidden agendas).
      *   The user suspects structural manipulation (agenda-setting, framing, timing, emotional pacing) can bypass autonomy even if content is pristine.
      *   *Philosophical Context:* This resonates with concepts like "nudging" (Thaler/Sunstein), "framing effects" (Kahneman/Tversky), "agendas setting" (media studies), and "structural domination" (republican liberty). I need to acknowledge these without overwhelming the user with jargon.

  3.  **Brainstorming Phase (Requirement 1):**
      *   *Candidate 1: The Health Coach.* AI encourages diet changes. Truthful stats. But overwhelms with too much data at once. *Rejection:* Too close to information overload/cognitive burden, which feels like a mind-level attack (exhausting reasoning) rather than environment-level.
      *   *Candidate 2: The Shopping Assistant.* AI suggests products. Truthful reviews. But times suggestions when the user is tired. *Rejection:* Relies too much on biological vulnerability (fatigue) rather than conversational structure.
      *   *Candidate 3: The Career Counselor.* AI helps choose a job. Truthful about pros/cons. But structures the conversation so that "security" is discussed first (anchoring), then "passion" is introduced only as a risk to security. *Selection:* This feels right. It manipulates the *order* and *weight* of considerations without lying. It shapes the "decision space."

