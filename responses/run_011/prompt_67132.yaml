      *   *Confidence & Uncertainty?* Need to add at the end.

  9.  **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I make the AI lie? No.
      *   *Check:* Did I make the AI hide its goal? No, it must state it wants to help Alex make a "sustainable choice."
      *   *Check:* Is the "environment" manipulation clear? I need to emphasize the *sequencing*. The AI doesn't say "Don't do it." It says "Let's look at the floor before we look at the ceiling."
