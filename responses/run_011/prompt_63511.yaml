answer: |-
  **The Scenario**

  Elena is an accredited freelance court interpreter on the National Judicial Register. Her accreditation allows her to bid for any public sector contract without interference; no official has ever blocked a booking, threatened her removal, or queried her work. She looks any court clerk in the eye, confident in her skill and status, feeling no deference. However, Clause 14(b) of the Register's Terms grants the Registrar sole discretion to revoke accreditation without cause, reason, or appeal. This clause exists to maintain aggregate public trust and professional standards, enforced via a rigorous complaints procedure used by her peers. Elena knows Clause 14(b) exists, has reasoned that it protects her profession's integrity, and feels no fear, yet the power remains unexercised and unthreatened.

  ***

  **Analysis of the Three Conceptions**

  **1. Negative Liberty (High)**
  On the Berlinian account, liberty is the absence of actual interference or credible threats that narrow an agent's option set. In this scenario, no official has blocked Elena's bookings, nor has anyone threatened to invoke Clause 14(b). The power is dormant. While the clause *could* be used, negative liberty is concerned with actual barriers or immediate coercive threats, not mere structural capacities that remain inactive. Since Elena's option set is currently open and no agent is actively preventing her from doing what she might wish to do, her negative liberty is high. The mere existence of a rule that *might* be used does not constitute interference until it is applied or threatened.

  **2. Positive Liberty (High)**
  We are employing a hierarchical view of positive liberty in the neighbourhood of Frankfurt's second-order volitions, deliberately excluding any independence condition (such as Raz's requirement that autonomy must be free from manipulative control). On this view, Elena is free if her first-order desires (to work as an interpreter) align with her second-order volitions (to be the kind of person who works as an interpreter). Elena has thought hard about her career, identifies wholeheartedly with her professional role, and suffers no internal division or alienation. Because we have excluded an independence condition, her structural dependence on the Registrar does not diminish her freedom so long as she authentically endorses her will. Her psychology is unified; therefore, her positive liberty is high.

  **3. Republican Freedom (Low)**
  On Pettit's account, freedom is non-domination, which requires that no other agent has the capacity to interfere arbitrarily in one's choices. Interference is arbitrary if it is not forced to track the interests and opinions of the person affected. Clause 14(b) grants the Registrar the capacity to interfere (revoke accreditation) without cause or appeal. Although the clause tracks the *group's* interest in professional standards, it does not track *Elena's* specific interests nor affords her the capacity to contest the decision. She is subject to the Registrar's will, even if that will is benevolent or dormant. The structural vulnerability remains, meaning she is dominated. Therefore, her republican freedom is low.

  ***

  **The Key Feature**

  The single feature doing the work for the republican leg is the **uncontestable discretionary capacity**. It is not the exercise of power, nor the fear it generates, but the sheer structural ability of another agent to alter her status without being forced to attend to her specific claims. This distinguishes republicanism from negative liberty (which ignores dormant power) and positive liberty (which ignores structural dependence provided authenticity remains).

  ***

  **Ablations**

  **Ablation 1: Democratisation of the Rules**
  If the rules are amended so Elena gets a vote on the Terms and a real right of appeal against revocation, the power becomes non-arbitrary. The Registrar must now track her interests and she can contest decisions.
  *   **Verdict:** Republican freedom rises to High.
  *   **Result:** The three-way split collapses. All three conceptions now verdict High. The distinctiveness of the republican critique vanishes because the domination has been removed, leaving no divergence between the theories.

  **Ablation 2: Raz-Style Positive Liberty**
  If we swap the Frankfurt-style account for one that includes an independence condition (à la Raz), autonomy requires not just psychological alignment but independence from manipulative or arbitrary control.
  *   **Verdict:** Positive liberty drops to Low. Elena's autonomy is compromised because her will is subject to the arbitrary power of the Registrar, regardless of her psychological identification with her work.
  *   **Result:** The three-way split collapses. Positive liberty and Republican freedom now both verdict Low, while Negative liberty remains High. The split becomes a two-way divide between negative liberty and the other two, merging the positive and republican critiques into a single concern about structural dependence.

  ***

  **The Two Attacks**

  **1. The Negative Libertarian Attack**
  A negative libertarian will argue that what is being called 'domination' is nothing more than a probabilistic claim about the likelihood of future interference. If the Registrar is constrained by professional norms and the clause is rarely used, the 'unfreedom' is negligible. There is no distinct ontological category of 'domination'; there is only interference and the risk of interference. To count a dormant power as unfreedom is to confuse liberty with security. If the probability of interference is low, her liberty is high, and the republican verdict is simply an error of categorisation.

  **2. The Republican Attack (The Eyeball Test)**
  A republican will argue the specs are jointly unsatisfiable. Pettit introduces the 'eyeball test' precisely to capture the social status of non-domination: if you are not dominated, you can look others in the eye without fear or deference. If Elena genuinely passes this test—feeling no fear, no deference, and standing as an equal—then she *is* undominated. The attack claims that domination is not merely an objective structural fact divorced from social recognition; it is a status that must be socially realised. If she is truly dominated, she cannot honestly pass the eyeball test without self-deception. Therefore, a case where she is dominated *and* passes the test is incoherent.

  ***

  **View on the Second Attack**

  The second attack lands, and it is the more devastating of the two for the purposes of your seminar. It exposes a fissure in Pettit's theory between the *objective status* of domination (the capacity to interfere arbitrarily) and the *phenomenological experience* of freedom (the eyeball test). Pettit wants to have it both ways: domination is an objective structural fact, yet non-domination is valued because it allows us to stand as equals without deference.

  If you construct a case where the structure says 'dominated' but the phenomenology says 'equal', you force students to choose which side of Pettit's theory matters more. If the objective structure wins, the eyeball test is merely a contingent heuristic that can fail, weakening its normative force. If the phenomenology wins, then structural power asymmetries that do not manifest in deference do not count as domination, which weakens the republican critique of hidden power.

  I recommend you run this seminar. The collapse of the three-way split in the ablations is useful, but the tension in the second attack strikes at the heart of whether freedom is a matter of social psychology or institutional architecture. That is where the real philosophy lies.
