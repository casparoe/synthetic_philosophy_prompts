answer: |-
  This is a precise and structurally sound observation. You have identified a tension that sits at the fault line between the logic of identity and the metaphysics of persistence. Because you come from mathematics, you are sensitive to the functional properties of the relation "is identical to" (transitivity, uniqueness, supervenience) in a way that many philosophical discussions gloss over with verbal nuance.

  Here is the carving you requested, separating the established terminology from the live disputes, and distinguishing the structural features you have isolated.

  ### 1. Is there an established term for this phenomenon?

  Yes, but there are two layers: the logical principle being violated, and the specific metaphysical problem that arises in personal identity.

  **A. The Logical Principle: "The Only *x* and *y* Principle"**
  This is the closest established label for the structural feature you describe in Cases 1 and 2. Formulated by Gareth Evans and discussed extensively by David Lewis and Harold Noonan, it states:
  > Whether *x* (at $t_1$) is identical to *y* (at $t_2$) should depend **only** on the intrinsic properties of *x* and *y* and the relations holding between them, not on what is happening to some distinct entity *z*.

  *   **The Phenomenon:** The **Violation of the Only *x* and *y* Principle** (or **Extrinsicness of Identity**).
  *   **Why it fits:** In your first two cases, the intrinsic relation between Pre-Scan You and Successor A remains constant. Yet, Successor A's status as "you" changes based on the existence/quality of Successor B (*z*).
  *   **Boundary:** This term applies to *any* identity claim (ships, persons, objects). It is the general structural feature.

  **B. The Specific Problem: "The Branching Problem"**
  In the literature on personal identity (specifically Psychological Continuity Theories), this is standardly called **The Branching Problem**.
  *   **Why it fits:** Psychological continuity is a one-to-many relation (one brain state can be copied to two bodies). Identity is a one-to-one relation. The "Branching Problem" is the name for the conflict that arises when the continuity relation branches.
  *   **Distinction:** "Branching" names the *scenario*. "Extrinsicness" (or violation of Only *x* and *y*) names the *structural feature* you find objectionable.

  **C. Terms that are *Responses*, not Names**
  You correctly suspected some terms are solutions rather than labels. Be careful not to conflate them with the phenomenon itself:
  *   **The Non-Branching Clause:** A fix added to psychological continuity theories (e.g., by Derek Parfit or David Lewis) stating "Identity holds *only if* there is no branching." This is a patch to preserve the Only *x* and *y* principle by denying identity in branching cases.
  *   **The Best Candidate Theory:** A response (associated with Martin and Nozick) that says identity *is* extrinsic; the successor with the "best" claim wins, and the other is not you. This *accepts* the extrinsicness you noticed.
  *   **Reductionism:** Parfit's view that identity isn't what matters. This dissolves the problem by changing the subject from identity to "what matters."

  **Verdict:** The feature you are reacting to is best named **The Extrinsicness of Identity** (or **Violation of the Only *x* and *y* Principle**). In the specific context of teletransportation, it is the **Branching Problem**.

  **[Settled vs. Divided]**
  *   **Settled:** It is settled that standard Psychological Continuity theories violate the Only *x* and *y* principle unless modified.
  *   **Divided:** It is fiercely debated whether this violation is fatal. Some (e.g., Eric Olson) argue it proves psychological theories are false. Others (e.g., David Lewis) argue we must accept extrinsic identity or adopt a "stage theory" to accommodate it.

  ---

  ### 2. Is the third case (The Thousand Successors) the same feature?

  No. While it shares the DNA of extrinsic dependence, Case 3 is structurally distinct from Cases 1 and 2. You have intuitively grouped them, but the literature treats them as different categories of problem.

  **Cases 1 & 2: The Competition Problem (Qualitative/Logical)**
  *   **Structure:** Binary status determination. Is Successor A *me* or *not me*?
  *   **Dependency:** The existence of B *negates* or *confirms* A's status.
  *   **Logic:** This is about the **transitivity and uniqueness** of identity. If A is me, and B is me, and A $\neq$ B, then Identity = Me is not a function.
  *   **Label:** This is the **Branching Problem** proper.

  **Case 3: The Aggregation Problem (Quantitative/Axiological)**
  *   **Structure:** Scalar value determination. How much does the future *matter*?
  *   **Dependency:** The *number* of successors scales the value.
  *   **Logic:** This is about the **additivity of value**. It presupposes Parfit's separation of "Identity" from "What Matters." If you hold that Identity is all-or-nothing, Case 3 is a category error (you either survive or you don't; 1000 copies doesn't make you "more dead" or "more alive").
  *   **Label:** This is **Parfit's Degree of Survival** or **The Aggregation of What Matters**.

  **Why they come apart:**
  You can solve Case 1 (Branching) by saying "Neither is me" (Non-Branching View). But that leaves Case 3 unresolved: If neither is *me*, do I care about them? Parfit says "Yes, what matters survives," and then faces your Case 3 question: Does it matter 1000 times as much?
  *   **Case 1 & 2** challenge the **logic of identity**.
  *   **Case 3** challenges the **axiology of survival**.

  **[Settled vs. Divided]**
  *   **Settled:** Parfit introduced the distinction between Identity and What Matters to handle these cases.
  *   **Divided:** It is **highly divided** whether "what matters" comes in degrees.
      *   *Parfitians:* Yes, survival is a matter of degree (like memory overlap).
      *   *Traditionalists (e.g., Unger, Baker):* No, persons are substances; you cannot survive by degrees. Case 3 is a confusion.
      *   *Mathematical Analogy:* Is survival a **step function** (0 or 1) or a **continuous function** (0 to 1)? The literature argues both without always declaring the assumption.

  ---

  ### 3. Does this structure recur outside personal identity?

  Yes. The structural feature (Extrinsic Determination of Status) is a general problem in metaphysics and semantics, though it is most acute in personal identity.

  **A. Semantics: Definite Descriptions**
  *   **Structure:** "The F" presupposes uniqueness.
  *   **Recurrence:** If there are two Kings of France, the statement "The King of France is bald" fails to refer. The status of the description depends on the non-existence of rivals.
  *   **Difference:** In semantics, failure of uniqueness usually results in *reference failure* (truth-value gap). In personal identity (Case 2), some theories say the *better* candidate wins (Best Candidate), which has no semantic analogue.

  **B. Metaphysics: The Ship of Theseus**
  *   **Structure:** Replaced planks (Successor A) vs. Reassembled planks (Successor B).
  *   **Recurrence:** Does the identity of the ship depend on whether the reassembled planks exist?
  *   **Label:** **Constitution Problems**. This is the exact same "Only *x* and *y*" violation as your Case 1.

  **C. Counterfactuals: Lewis's Counterpart Theory**
  *   **Structure:** Which individual in another possible world is *my* counterpart?
  *   **Recurrence:** Lewis argues it depends on similarity weights. If a third individual appears who is *more* similar to me, the original counterpart might cease to be *the* counterpart.
  *   **Label:** **Contextualism about Counterparts**. This is an explicit acceptance of the extrinsicness you find in Cases 1 & 2.

  **D. Ethics: Comparative Harm**
  *   **Structure:** Does an action harm me?
  *   **Recurrence:** On some views, I am harmed only if I am worse off than I *would have been*. This depends on the existence of a counterfactual alternative (an extrinsic fact).
  *   **Label:** **Counterfactual Comparative Account of Harm**.

  **General Label:** In metaphysics, this is often discussed under **Global vs. Local Supervenience**.
  *   *Local:* Facts about X depend only on facts in X's immediate vicinity.
  *   *Global:* Facts about X can depend on the total state of the world.
  *   Your intuition is that Identity *should* be Local. The cases show that under Psychological Continuity, it is Global.

  ---

  ### 4. Coining a Term (The Carving)

  Since the existing terms ("Branching", "Only x and y") describe the *violation* or the *scenario*, but do not precisely capture the *mathematical structure of the dependency* you are isolating (specifically the conflation of competition and aggregation), I propose the following distinction to help you navigate the literature.

  Let us call the general phenomenon **Extrinsic Determination of Persistence**.
  Within this, we must distinguish two distinct functional forms that the literature often runs together:

  #### A. Competitive Extrinsicity (Your Cases 1 & 2)
  *   **Definition:** The status $S$ of candidate $C_1$ is a function of the existence/quality of candidate $C_2$, such that $S(C_1)$ decreases as Quality($C_2$) increases.
  *   **Mathematical Intuition:** A ranking function where only the maximum value maps to "Identity."
      $$ Identity(C_i) = \begin{cases} 1 & \text{if } Quality(C_i) > \max(Quality(C_{j \neq i})) \\ 0 & \text{otherwise} \end{cases} $$
  *   **Boundary:** This applies to **Binary Identity Claims**.
  *   **Non-Example:** If $C_2$ exists but is intrinsically identical to $C_1$ (clones), and both are declared "you" (Lewis's view), Competitive Extrinsicity is avoided, but Uniqueness is lost.

  #### B. Aggregative Extrinsicity (Your Case 3)
  *   **Definition:** The Value $V$ of persistence is a function of the cardinality of the set of successors $N$, such that $V_{total} = f(N)$.
  *   **Mathematical Intuition:** The question is whether $f(N)$ is linear ($N \times V_1$), capped ($\max(V_1)$), or diminishing.
  *   **Boundary:** This applies to **Axiological Claims** ("What Matters").
  *   **Non-Example:** If one holds that Identity is what matters, and Identity is binary, then $V$ is constant regardless of $N$. Aggregative Extrinsicity only arises if you accept Parfit's "Degree of Survival."

  **Why this carving helps:**
  Much of the "confident prose" you dislike comes from authors sliding from **Competitive** arguments (proving identity fails in branching) to **Aggregative** conclusions (therefore we should care less/more about the future) without justifying the shift from Logic to Axiology.

  *   **Case that looks like it but is not:** **Vagueness.** In a Sorites series, the boundary of "bald" depends on the surrounding hairs. This looks like extrinsic determination, but it is usually analyzed as *semantic indecision* rather than metaphysical extrinsicness.
  *   **Case that is it but doesn't look like it:** **Quantum Indistinguishability.** In QM, particles lack "thisness" (haecceity). Swapping two electrons changes nothing intrinsically, but their statistical behavior depends on the existence of the other (Bose-Einstein vs. Fermi-Dirac statistics). This is a physical instance of Aggregative Extrinsicity.

  ### Summary of the Field's Status

  | Feature | Established Label | Status in Literature |
  | :--- | :--- | :--- |
  | **Dependence on Rivals (Cases 1 & 2)** | Violation of "Only *x* and *y*" / Branching Problem | **Settled** that it occurs in Psychological Continuity theories. **Divided** on whether to fix it (Non-Branching) or accept it (Best Candidate/Stage Theory). |
  | **Dependence on Numbers (Case 3)** | Degree of Survival / Aggregation Problem | **Divided.** Parfitians accept degrees/additivity. Animalists/Substance theorists reject it as category error. |
  | **The Structural Intuition** | Intrinsicness Requirement | **Settled** as a desirable logical feature. **Divided** on whether reality conforms to it. |

  **Final Advice for Reading:**
  When you encounter an author discussing these cases, check their **functional assumption**:
  1.  Do they treat Identity as a **function** (one output) or a **relation** (many outputs)?
  2.  Do they treat "What Matters" as **binary** (0/1) or **scalar** (0.0 to 1.0)?
  3.  Do they treat the value of survival as **additive** or **capped**?

  If they move between these without stating their choice, you have identified the structural slippage you suspected. It is not your failure to follow; it is their failure to define the domain.
