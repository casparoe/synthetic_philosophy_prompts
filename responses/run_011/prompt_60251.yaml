  # The Sorting Ledger

  He watches where the partition meets the **door**,
  Sorting the molecules that move too **fast**,
  From those that lag behind, distinctively **slow**.
  Each judgment costs him nothing, not a **bit**,
  He lifts the weight without apparent **work**,
  While pressure builds against the rising **heat**.

  The metal shakes under the ambient **heat**,
  No spirit guards this microscopic **door**,
  But wood and hinge that register the **work**
  Of collision. No hinge remains forever **fast**;
  The sluggish atoms kick the latch one **bit**,
  To lift the weight where gravity grows **slow**.

  The partition slides, deliberately **slow**,
  Paying the tax of temperature and **heat**.
  Knowledge gained is measured in a **bit**,
  Isothermal, closing off the **door**.
  While velocity remains too wildly **fast**,
  One molecule expands to do the **work**.

  Reversible until the ledger demands **work**,
  The cycle stalls, the mechanism grows **slow**,
  To see is free, however **fast** the change,
  Until the mind must dissipate its **heat**.
  There is no exit through this mental **door**,
  The memory fills, one registered **bit**.

  Erasing every stored and precious **bit**,
  Until the memory pays for previous **work**.
  We cannot pass again through either **door**,
  The return settles in, distinctively **slow**.
  The debt returns as irreversible **heat**,
  No particle escapes the logic **fast**.

  Nothing remains held permanently **fast**,
  You thought you saved a single binary **bit**,
  The account balances in wasted **heat**,
  The engine stops, having completed **work**,
  Though entropy arrives inevitably **slow**,
  And silence seals the laboratory **door**.

  The **fast** reset closes the mental **door**.
  No **slow** escape from **heat** owed for **work**.
  The ledger balances on one erased **bit**.

  ***

  **Note to the Convener**

  I took liberties blending Maxwell's intelligent agent with Smoluchowski's passive trapdoor in stanza two; historically distinct, this conflation dramatizes the door's own thermal noise without needing a separate stanza. I committed to the Bennett/Landauer moral: information is a ledger debt settled on erasure, not fuel burned during measurement. This required suppressing Brillouin's resolution (cost lies in measurement/scattering) to keep the argument clean for the envoy.

  I am confident in the qualitative thermodynamics: measurement is reversible, erasure is not, and the $kT \ln 2$ cost is implied by the single-molecule expansion in stanza three. The sestina form enforces the cyclic return you requested, though fitting the quantitative core into the rhyme scheme forced some syntactic compression.

  The point I am least sure of is stanza three's implication that the partition slides *after* the bit is learned. In the Szilard engine, the partition is inserted, then the measurement is made, then the expansion occurs. I reversed the measurement/partition insertion order slightly to satisfy the end-word "door" in line four, which might make a pedant wince at the causal sequence. I judged the poetic flow of the argument (measurement -> closure -> expansion) outweighed the strict mechanical chronology, but I flag it for your physicists.
