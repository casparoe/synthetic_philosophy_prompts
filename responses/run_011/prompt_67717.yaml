answer: |-
  You have correctly identified the core motivation for Updateless Decision Theory (UDT): the desire for reflective consistency and the avoidance of dynamic inconsistency in Newcomb-like problems. Your summary of the view is accurate enough that I will not spend time correcting definitions. I will proceed directly to the assessment of counter-arguments, sorted by their threat level, followed by the verdict on insulation and methodology.

  ### I. Assessment of the Three Lines

  #### 1. The Precommitment Objection
  **The Argument:** If an agent can construct binding commitment devices (contracts, pre-commitment algorithms, burning bridges), it achieves the same payoff profile as a UDT agent. Therefore, UDT offers no normative novelty for agents capable of precommitment, and for agents incapable of it, UDT is an impossible ideal.
  **Verdict:** **Absorbable.**
  **Analysis:** This objection confuses the *mechanism* of consistency with the *property* of consistency. Precommitment devices are costly, often physically impossible, and require verification. UDT is a claim about the rational structure of the decision algorithm itself, not the external constraints placed upon it.
  *   **Why it fails to kill UDT:** UDT explains *why* you want to precommit. It provides the normative justification for building the device. For agents who cannot build devices (e.g., a software agent running on unmodifiable hardware, or a human in a situation where signaling commitment is impossible), UDT is the only route to the "precommitment payoff."
  *   **Residual Work:** UDT defines the *target* of precommitment. Without UDT, precommitment is ad hoc. With UDT, it is derived. This line does not damage the theory; it clarifies its relationship to implementation.

  #### 2. The Collapse into CDT Objection
  **The Argument:** Once an agent models logical uncertainty (uncertainty about its own source code or mathematical truths), UDT simply becomes Causal Decision Theory (CDT) operating on a prior that includes logical correlations. If so, UDT is a notational variant of CDT+, not a rival.
  **Verdict:** **Embarrassing (if true), but likely False.**
  **Analysis:** This is a technical claim about the structure of counterfactuals. CDT constructs counterfactuals by severing the causal link between the decision node and its parents (the `do()` operator). UDT constructs counterfactuals by considering the output of the policy function across logically possible worlds.
  *   **The Distinction:** Even with a prior over source codes, CDT treats the *current action* as a free variable that does not logically constrain the output of a predictor simulating that agent. UDT treats the *policy* as the fixed variable. In a Transparent Newcomb problem, a CDT agent with logical uncertainty still two-boxes because it treats its current choice as causally independent of the box content already determined by the simulation. A UDT agent one-boxes because it treats its policy as the common cause.
  *   **The Embarrassment:** The embarrassment lies not in collapse, but in dependence. UDT relies on a theory of **logical counterfactuals** (how to evaluate "If I output B, what happens?" when logic dictates I output A). This theory is currently incomplete. If it turns out logical counterfactuals cannot be coherently defined without collapsing back into causal interventions, UDT loses its machinery. This is a vulnerability in the *formalism*, not necessarily the *normative intuition*.

  #### 3. The Unacceptable Verdict Objection
  **The Argument:** Are there cases where UDT yields a verdict that is intuitively irrational, while CDT or EDT succeeds? Conversely, is there behavioral content?
  **Verdict:** **Potentially Fatal.**
  **Analysis:** This is the only line that threatens the core normative claim.
  *   **Behavioral Content:** There is clear behavioral divergence. In Counterfactual Mugging, UDT pays up (to preserve the policy that gets rewarded in the counterfactual branch); CDT/EDT do not. In Transparent Newcomb, UDT one-boxes; CDT two-boxes. The dispute is not empty.
  *   **The Fatal Case:** The threat is not intuitive clash (intuitions about Counterfactual Mugging are divided), but **dominance**. If a UDT agent can be Dutch-Booked in a scenario where a CDT agent cannot, UDT is strictly inferior.
      *   *Candidate:* **"The Evil Genie" / "Prior Manipulation."** If an adversary can force the UDT agent into a specific prior state where it makes self-harming decisions, while a CDT agent remains immune, UDT is vulnerable.
      *   *Candidate:* **"Troll Bridge."** This is a specific problem in logical uncertainty. A UDT agent might refuse to cross a bridge because proving it crosses leads to a contradiction (via Löb's Theorem), even if the bridge is safe. If UDT forces an agent to act cowardly to maintain logical consistency, it fails as a guide to action.
  *   **Assessment:** If Troll Bridge cannot be solved within the UDT framework, it is fatal. It implies that logical consistency constraints override utility maximization in unacceptable ways. Currently, this remains an open research problem, making it the most significant live threat.

  ### II. The Missing Line: Boundedness and Tractability

  You asked for other lines that might matter more. The most significant omission in the standard philosophical debate is **Computational Tractability.**

  **The Argument:** UDT requires optimizing over the space of *all possible policies* conditional on a prior. For any non-trivial agent, this space is hyper-astronomical. A bounded agent cannot compute the updateless optimum.
  **Verdict:** **Fatal for Implementation, Embarrassing for Ideal Theory.**
  **Analysis:** Normative theories are often idealized (e.g., Bayesianism). However, if the idealization is so extreme that no physically possible agent can approximate it, the theory loses its normative grip. "Ought implies can."
  *   **The Threat:** If the only way to approximate UDT is to run a CDT algorithm with heuristics, then CDT is the *practical* normative theory, and UDT is a Platonic ideal with no cash value.
  *   **Defender's Move:** Argue that rationality is defined relative to computational resources (Bounded UDT).
  *   **Weakness:** Once you introduce bounds, the "updateless" requirement often fractures. A bounded agent *must* update to reduce computational load. This suggests UDT is only coherent for unbounded agents, rendering it inapplicable to the real world.

  ### III. Verdict on Insulation

  You asked for a definite verdict on whether the framework is "unkillable" due to prior-adjustment, and whether this is a defect.

  **Verdict:** The insulation is a **Defect**, and the framework is **Vulnerable**, not unkillable.

  **Reasoning:**
  1.  **Vacuity Risk:** If every counterexample can be dissolved by saying "Your prior was irrational," the decision rule ceases to be a constraint on action. It becomes a tautology: "Do what maximizes utility relative to the prior that makes that action maximize utility." A normative theory that constrains nothing is useless.
  2.  **The Burden of Priors:** Defenders often shift the burden of rationality from the *decision algorithm* to the *prior*. They claim UDT is correct, and if it gives a bad answer, the prior was wrong. But without an independent, normative theory of priors (e.g., Objective Bayesianism, Solomonoff Induction) that is universally accepted, UDT is incomplete.
  3.  **Rationalizing vs. Dismissing:** Defenders are **rationalizing** when they use prior-adjustment to explain away intuitive failures (like refusing to pay a mugger when the stakes are low but the principle is high). They are **right to dismiss** objections that assume a "naive" prior (e.g., assigning 0 probability to predictors).
  4.  **Falsifiability:** The framework is killable if we fix the prior. If we stipulate a "Rational Prior" (e.g., one that respects symmetry and simplicity), and UDT yields a dominated strategy under that prior, the theory fails. Defenders cannot have it both ways: they cannot claim UDT is the universal normative standard while hiding behind arbitrary priors to avoid refutation.

  **Conclusion on Insulation:** The demand for falsification is not misplaced, even for normative theory. A normative theory must be *action-guiding*. If the advice depends entirely on a prior that the agent has no rational method for selecting, the theory does not guide action; it merely reflects input. Therefore, the ability to tweak the prior is a bug, not a feature. It indicates that UDT is not a complete decision theory, but a framework that depends on a separate, unsolved theory of rational priors.

  ### IV. Methodological Correction

  You asked if demanding falsification-style defeaters is the wrong question.

  **Plain Answer:** Yes and No.
  *   **Yes:** You cannot "falsify" an "ought" statement with an "is." Empirical counterexamples do not strictly refute normative claims (one can always say the agent *should* have lost money).
  *   **No:** You *can* refute a normative theory by showing it is **incoherent** (Dutch Bookable), **self-defeating** (recommends its own abandonment), or **vacuous** (compatible with any behavior via prior tweaking).

  **Final Assessment:**
  UDT is not unkillable. It is vulnerable to:
  1.  **Incoherence in Logical Counterfactuals:** If the math doesn't work (Troll Bridge), the theory collapses.
  2.  **Prior Dependence:** If it requires a "magic prior" to avoid bad verdicts, it is incomplete.
  3.  **Boundedness:** If it cannot be approximated by real agents, it is normatively inert.

  A committed defender should absorb the Precommitment objection. They should treat the CDT Collapse objection as a technical challenge to be solved (defining logical counterfactuals). They should treat the Unacceptable Verdict objection as **Fatal** if it demonstrates strict dominance or Dutch Bookability. Regarding insulation: Stop using the prior as a shield. Acknowledge that UDT stands or falls with a theory of rational priors. Without that, it is not a decision theory; it is a constraint on optimization problems.
