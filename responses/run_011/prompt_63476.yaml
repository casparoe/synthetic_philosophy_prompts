answer: |-
  **Bottom line**
  This procedure is a veto chain, not a scoring system. A proposed trade must pass six sequential filters; failure at any step kills the deal immediately. The default setting for ambiguity, time exhaustion, or unresolved conflict is **Refuse**. You do not broker the trade; you return to the status quo. This prioritizes coalition integrity over short-term gains. The procedure forces explicit answers on who pays, who benefits, and whether the deal contradicts your mission. It treats IOUs to future committees as void and funder-driven packages as coercive. If you cannot articulate the trade in a single sentence for a hostile reporter, you cannot make it. This is not about finding consensus; it is about preventing moral injury that leads to walkouts. Use it to stop deals, not to justify them.

  **What has to survive from the theory, and what I cut**
  I retain three theoretical distinctions. First, the "Rotten Compromise" line: agreements maintaining regimes of cruelty or humiliation are forbidden, regardless of utility. Some costs are too high to trade. Second, "Expressive Consistency": you cannot trade a value in a way that expresses contempt for that value. Selling out a protected class to save a budget contradicts the value of protection. Third, "Separability": issues must be genuinely distinct; if two issues are morally linked, trading them corrupts both. I cut utilitarian calculus; you cannot sum harm across different constituencies to find a net positive.

  Regarding your four ugly features: Feature 2 (IOUs/Turnover) is not a structural problem if the procedure forbids binding future committees. You cannot trade authority you do not possess. A trade requiring future labor is void unless that future labor is voluntarily re-confirmed by successors. This solves the ledger voiding issue by preventing the debt from existing. Features 1, 3, and 4 remain critical constraints handled in the procedure. Feature 1 (One-way trades) is tested via Reciprocity. Feature 3 (Funder influence) is tested via Independence. Feature 4 (Non-member costs) is tested via Constituency. This approach treats the coalition as a steward of member authority, not an owner of it.

  **The procedure**
  1.  **Cruelty Test:** Does this trade maintain or enable active harm, cruelty, or humiliation to a specific group? [JUDGMENT] on what counts as "humiliation" versus "inconvenience."
      *   *Sufficient Answer:* No specific group is degraded, endangered, or stripped of dignity.
      *   *Stop Point:* If Yes, **Refuse**. Do not broker regimes of cruelty.
  2.  **Separability Test:** Are the two issues logically and morally distinct? Can you support A without opposing B?
      *   *Sufficient Answer:* Yes, the issues are independent mechanisms with distinct policy levers.
      *   *Stop Point:* If No (issues are intrinsically linked), **Refuse**. Linked issues cannot be traded without corruption.
  3.  **Expressive Consistency Test:** Does accepting this trade express an attitude inconsistent with your core values? [JUDGMENT] on "core values" hierarchy.
      *   *Sufficient Answer:* The means do not contradict the ends; the trade does not signal betrayal.
      *   *Stop Point:* If Yes (contradiction), **Refuse**. Integrity costs more than money.
  4.  **Constituency & Reciprocity Test:** Who pays the cost? Are costs borne by non-members or one side only? [JUDGMENT] on "fair balance" of concessions.
      *   *Sufficient Answer:* Costs are borne by consenting members; benefits are reciprocal across cycles.
      *   *Stop Point:* If costs fall on non-members, or one side concedes repeatedly without gain, **Refuse**. IOUs to future committees are void.
  5.  **Independence Test:** Did this trade originate internally or from a funder/external power?
      *   *Sufficient Answer:* The coalition drafted the terms; external actors responded to us.
      *   *Stop Point:* If a funder proposed the package structure, **Refuse**. Autonomy is non-negotiable.
  6.  **Publicity Test:** Can this be stated in one sentence in a press release read by a hostile reporter?
      *   *Sufficient Answer:* Yes, without shame, qualification, or euphemism.
      *   *Stop Point:* If No, **Refuse**. Secrecy indicates moral rot.
  *Time/Default:* If any question cannot be answered in 20 minutes, the default is **Refuse**. Do not defer; deferral preserves the pressure. Do not split; splitting rotten compromises rot halves. Staff must record the specific step where the trade failed.

  **Where it hands the decision back to the room**
  The procedure hands the decision back to the room only when two values conflict directly, not when facts are unclear. If Step 1 (Cruelty) is disputed because members define "harm" differently, that is a value conflict. If Step 3 (Expression) hinges on what the coalition's "core value" prioritizes today, that is a value conflict. In these cases, the procedure stops, and the Steering Committee votes under the bylaws. The procedure does not resolve value conflicts; it filters out deals that violate established boundaries. If the room votes to proceed despite a procedural warning, the staff member must record the dissent in the minutes. The procedure protects the staff from being the sole bearer of moral risk, but it cannot override a democratic vote on values. It ensures the vote is informed of the moral cost.

  **Worked applications**
  **Case 1: Data-sharing / Translation-access.**
  Passes Cruelty (no harm). Passes Separability (data vs. language access are distinct policy mechanisms). Passes Expression (access aligns with equity values). Passes Constituency (members trade objections; reciprocal gain). Passes Independence (internal broker). Passes Publicity ("We secured language access in exchange for data privacy safeguards"). **Result: Broker.** This is a standard legislative trade where issues are separable and constituents align.

  **Case 2: Permitting / Paid-Sick-Leave.**
  Fails Constituency. The business association gains permitting ease; the coalition gains sick leave. However, the sick leave benefits non-members (workers not in the room), while the permitting cost is borne by members (environmental groups). You are spending non-member capital to buy member peace. [JUDGMENT] on whether non-member benefit justifies member cost. Furthermore, if labor has conceded on policing before (Feature 1), this exacerbates one-way trading. **Result: Refuse.** The trade spends authority you don't hold (non-member consent) and risks labor burnout.

  **Case 3: Funder Package Deal.**
  Fails Independence. The funder proposed the package structure (housing, police, environment). Even if the content is good, the origin is coercive. You believe this ensures survival (funding), but the procedure flags it as external control. [JUDGMENT] on whether survival justifies autonomy loss. Fails Publicity ("We adopted the funder's package"). **Result: Refuse.** This is the survival trade you want, but it fails the independence filter. Taking it sets a precedent that funders set the agenda. The procedure forces you to find the money elsewhere or shrink the scope.

  **What this procedure can't do**
  This procedure cannot generate creativity; it only filters. It cannot resolve deep value conflicts, only flag them. The primary failure mode is "Laundering": using the procedure to justify a decision you've already made by manipulating the [JUDGMENT] calls. If you decide "Yes" on Cruelty because you want the deal, the procedure is useless. It requires intellectual honesty. It also cannot protect against slow drift; ten small acceptable trades can move you further than one rotten one. Finally, it assumes staff integrity. If staff manipulate the 20-minute clock or the framing of questions, the veto chain breaks. It is a tool for restraint, not a substitute for leadership. It protects against walkouts, but not against stagnation. You may refuse many good deals. That is the cost of integrity.
