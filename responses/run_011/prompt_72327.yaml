      *   Implication: If it's void, there is no injustice in breaking it. Justice is the performance of valid covenants.
      *   So, "void" means *no obligation of justice exists*.
      *   *Nuance:* The Law of Nature (3rd) says "men perform their covenants made." But the 1st Law says seek peace/self-preservation. Self-preservation trumps covenant-keeping if performance endangers life.
