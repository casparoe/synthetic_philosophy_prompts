prompt: |-
  I clerk for a sentencing judge and Im trying to get a feel for how she actually reasons, because next week's case is going to be argued over in chambers. Her record so far:

  - hospice nurse who diverted pain meds over three years, first offense, addiction in remission: four years, well above the guideline range
  - nurse who stole from hospital pharmacy stock that simply got replaced, no patient affected: eight months
  - investment fraudster who wiped out a couple hundred retirees but repaid every cent from a family loan and pled guilty on day one: three years, below the range
  - kid who broke into a university network out of curiosity, caused no loss, published nothing: deferred sentence and community service
  - fifth DUI, no injuries: top of the available custodial range
  - first DUI with a passenger under twelve, no injuries, went into treatment within the week: suspended sentence
  - two men in a warehouse theft ring; the organizer had already drawn five years from another judge, and she gave the number-two five years as well, saying the difference between them was a job title, not a deed

  Next week: a building inspector who took bribes for roughly five years to sign off on substandard work. No building has shown any defect, nobody was hurt, and there's no evidence he believed they were actually unsafe. He was one of twelve inspectors in the same office doing it — the office has been cleaned out, and the other eleven are all already sentenced, mostly three to five years. He has no priors, he's lost his license, he is plainly never doing this again, and the whole arrangement is publicly dead, so the usual line about needing to make an example of him doesn't obviously get any purchase.

  Where does she land? More useful to me: what rule is she running? Give me the candidate rules that fit all seven verdicts, what each says about the inspector, which one you'd bet on and why, and one further case I could describe that would split your top two candidates. And be straight with me about where your reading of her record is weakest — what would make you switch from one candidate to another.
