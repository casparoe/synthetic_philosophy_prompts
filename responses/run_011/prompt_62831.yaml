      Actually, the *most* vulnerable point for me to defend is the TI exclusion. Why? Because the prompt case *strongly* implies testimonial issues (nurses vs engineers/doctors is a classic hierarchy). But the student's philosophical distinction is clean. I'd rather not fight that battle in office hours. I'll stick with that.

