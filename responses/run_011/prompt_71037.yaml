answer: |-
  The session must establish that the dispute is not about what exists but about how identity persists through change, using their event-sourcing mental model as a bridge that must be burned before it conflates data representation with ontological structure.

  ### Sequence and Dependencies

  1.  **The Problem of Change (0–10 mins):** Draw a timeline. Mark t1 and t2. Draw an object O. At t1, O is Red. At t2, O is Blue. Write the contradiction: "O is Red" and "O is Blue" cannot both be true for the same O unless "is" means something different.
      *   *Dependency:* You cannot name the positions until you have established that there are two distinct ways to resolve this contradiction without denying change.
      *   *Naming Rule:* Do not say "endurantism" or "perdurantism" yet. Refer to them as "Solution A" and "Solution B." Names reify concepts before they are understood; engineers will treat the names as API endpoints rather than structural descriptions.

  2.  **The Two Structures (10–20 mins):**
      *   **Solution A (Whole Presence):** Draw O at t1 as a complete circle. Draw O at t2 as a complete circle. Connect them with an arrow labeled "Identity." The *whole* object exists at t1 and the *whole* object exists at t2.
      *   **Solution B (Partial Presence):** Draw O as a long cylinder lying across the timeline. Slice it at t1 and t2. The slice at t1 is Red. The slice at t2 is Blue. The "Object" is the cylinder, not the slices.
      *   *Dependency:* Now you can name them. Solution A is Endurantism. Solution B is Perdurantism. The names now label solved structures rather than abstract terms.

  3.  **The Event-Sourcing Analogy (20–30 mins):**
      *   **Ruling:** Use their vocabulary as the carrying example. It is too potent to ignore, but it is an epistemological tool, not an ontology.
      *   **Application:** Map Solution B (Perdurantism) to the Event Log. The Log is the 4D object. The Current State (projection) is the 3D slice.
      *   **The Break Point:** You must announce the limit precisely when discussing **deletion**. In event sourcing, you can snapshot the state and delete the log; the system continues. In perdurantism, you cannot delete the past temporal parts and keep the object; the object *is* the extension across time. If the past ceases to exist, the object ceases to exist. The analogy holds for structure, but fails on independence: the log represents the history, the worm *is* the history.

  4.  **The Single Case Study (30–40 mins):**
      *   **The Case:** A metal rod heating up. At t1 it is 50°C. At t2 it is 60°C.
      *   **Must Contain:** Property change (temperature) without part replacement. This isolates the metaphysics of *qualities* from the metaphysics of *composition*.
      *   **Must Leave Out:** Any replacement of parts (avoids Ship of Theseus), any biological growth (avoids vagueness), any consciousness (avoids personal identity).
      *   **Why this case:** It forces the question: Did the *whole* rod change temperature, or did a 50°C temporal part succeed a 60°C temporal part within a larger rod-entity?

  5.  **The "Just Words" Objection (40–45 mins):**
      *   Address the engineer who claims extensional equivalence (same observable facts).
      *   **Verdict:** He is 50% right. They agree on all actual, observable truths (the rod is 50°C at t1). They disagree on **modal truths** (counterfactuals) and **truthmakers**.
      *   **The Argument:** Ask: "What makes the statement 'The rod is 50°C at t1' true?" The Endurantist says: The whole rod exemplifying a relation to t1. The Perdurantist says: The t1-slice exemplifying the property absolutely. This difference matters when asking "What if the rod hadn't heated up?" The Endurantist says the *same object* would have different properties. The Perdurantist says a *different object* (a different worm) would exist. The disagreement is about what counts as "the same thing" across possible worlds, not about what is on the screen now.

  6.  **Closing Question:**
      *   "If we could delete the event log prior to t1 without changing the state at t2, would the object at t2 be the same object?"
      *   **Separation:** Those who understand will say the Endurantist says "Yes" (identity persists through history loss) and the Perdurantist says "No" (identity is constituted by history). Those who recite will hesitate or say "It depends on the business logic."

  ### Misconception Map

  1.  **"It's about 3D vs 4D space"**:
      *   *Tag:* Moment 2 (The Two Structures).
      *   *Head Off:* Explicitly state that both agree spacetime exists. The dispute is not about dimensions but about **presence**. Does the object exist *wholly* at a time, or is it *spread out* across time?
  2.  **"A temporal part is a snapshot"**:
      *   *Tag:* Moment 2 (The Two Structures).
      *   *Head Off:* When drawing the slices, give them thickness. A temporal part has duration (t1 to t1+delta). It is not an instant; it is a segment.
  3.  **"This is Ship of Theseus with new labels"**:
      *   *Tag:* Moment 4 (The Case Study).
      *   *Head Off:* By using the heating rod, you remove parts entirely. If they raise Theseus, stop them and say, "That is a problem of composition; we are solving a problem of change. Keep the parts fixed."
  4.  **"It's just data modeling" (Engineer Specific)**:
      *   *Tag:* Moment 3 (The Break Point).
      *   *Head Off:* When breaking the event-sourcing analogy. Emphasize that code models reality; metaphysics claims what reality *is*. Confusing the map (log) for the territory (object) is the error.

  ### What to Cut

  *   **Worm vs. Stage:** Cut it. This is the internal debate within Perdurantism about whether the temporal slices or the whole sum are the primary ontological citizens. It adds nuance that destroys clarity in a 45-minute intro. Treat Perdurantism as a monolith for this session.
  *   **Historical Context:** Cut all references to who argued what. No names of philosophers.
  *   **Temporal Logic Formalisms:** Cut the notation of temporal logic. It invites nitpicking on syntax rather than semantics.
  *   **Announcement:** Explicitly tell them at Minute 5: "There is a sub-debate about whether temporal slices are real objects themselves. I am cutting it. It matters for advanced metaphysics, but it obscures the main structural difference we need to map today."
