answer: |-
  **HISTORICAL CLAIM DECISION PROCEDURE**

  1.  **Source Grounding:** Is the claim grounded in a surviving text or material record? **Fail:** CUT (unless logical inference from Established facts). **Pass:** Q2.
  2.  **Independence:** Do multiple textual sources derive from a single lost original (common stemma)? **[JUDGMENT CALL]** Rely on standard philological consensus. **Fail:** Collapse sources into one. **Pass:** Count as independent.
  3.  **Convention Check:** Is the detail a known historiographic trope (composed speeches, round numbers, tyrant tropes, single-cause stratagems)? **Fail:** Max tier PROBABLE. **Pass:** Q4.
  4.  **Material Corroboration:** Does material evidence confirm the *specific claim* or only the *context* (place/date)? **Fail:** Do not upgrade tier based on context alone. **Pass:** May upgrade one tier.
  5.  **Silence:** Does the most reliable contemporary source omit this event? **[JUDGMENT CALL]** Is omission explicable (text loss) or evidentiary? **Fail:** Downgrade one tier. **Pass:** Q6.
  6.  **Tier Assignment:**
      *   **ESTABLISHED:** ≥2 independent sources OR 1 source + material confirmation OR Survived recorded challenge.
      *   **PROBABLE:** 1 reliable source OR ≥2 dependent sources.
      *   **REPORTED:** 1 late/source-known-for-fiction OR Convention-heavy detail.
      *   **CUT:** Contradicted by material evidence OR Pure invention.
  7.  **Wording:**
      *   **ESTABLISHED:** "X happened."
      *   **PROBABLE:** "X likely happened."
      *   **REPORTED:** "Sources say X happened."
  8.  **Escalation:**
      *   **Academic Consultant:** Stemma disputes, new archaeological interpretations (Non-urgent).
      *   **Producer:** Dramatic necessity vs. evidentiary downgrade (Deadline urgent).

  **WORKED CASES**

  1.  **Feigned Retreat:**
      *   **Q2:** Earlier source vague on intent; late source specific. Independence on *intent* fails.
      *   **Q3:** Single-cause stratagem is a known trope. **Fail.**
      *   **Result:** REPORTED.
      *   **Wording:** "Historians report the retreat was feigned."

  2.  **General's Speech:**
      *   **Q3:** Composed speeches are a convention. **Fail.**
      *   **Result:** REPORTED (as attribution).
      *   **Disclosure:** On-screen text: "Speech reconstructed from historical accounts."

  3.  **City Population:**
      *   **Q3:** Round figure is a convention. **Fail.**
      *   **Q4:** Inscription confirms grain, not number. **Fail.**
      *   **Killing Question:** Q3 (Convention) prevents ESTABLISHED/PROBABLE; Q4 prevents upgrade.
      *   **Result:** CUT specific number.
      *   **Allowed:** "A large population."

  **LIMITS**

  This procedure misclassifies claims where scholarly consensus is shifting but not yet published. It cannot settle interpretive debates where evidence is equally balanced. A correct tier assignment may still mislead a careful viewer if "Established" is interpreted as "True" rather than "Consensus." It cannot adjudicate dramatic compression where chronology is altered for narrative flow; those are Producer calls. Finally, it assumes access to standard philological tools; niche textual disputes require the Academic Consultant, introducing delay. Use this to manage risk, not to guarantee truth.
