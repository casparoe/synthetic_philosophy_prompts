      *   **Task:** The student is writing a history research paper about state responses to historical crimes (transitional justice, historical memory, reparations). They have identified a specific pattern (apology, memorial, curriculum, fund) and noticed tensions within it (liability disclaimer vs. apology, collective vs. individual guilt).
      *   **Specific Questions:**
          1.  Reconstruct the implicit theory of guilt/agency required for the practice to make sense (collective continuity, inheritable claims, etc.).
          2.  Assess internal consistency (apology vs. legal liability vs. criminal law).
          3.  Distinguish necessary features from contingent ones (underdetermination of theory).
          4.  Contrast with a "strict individualism" view (what would change if we assumed nothing survives death?).
      *   **Constraint:** The student explicitly said, "I would rather work out what the practice itself assumes than be handed a label" (referencing Karl Jaspers). So, avoid just summarizing Jaspers. Focus on the *practice* as a text to be interpreted.

  2.  **Deconstruct the Four Prompts:**

      *   **Prompt 1: The Implicit Theory.**
          *   *Observation:* The state apologizes *now* for things done *then*.
          *   *Implication:* The "State" or "Nation" is a moral agent that persists through time, distinct from the sum of its current citizens. It's a "corporate person."
          *   *Victim Side:* Descendants get money. This implies harm travels down generations (intergenerational trauma or inherited debt).
          *   *Rival Views Ruled Out:* Strict atomistic individualism (you die, your debts die), legal positivism that sees the state as merely a current administrative machine.
          *   *Awkward Neighbors:* Liberal democracy's focus on individual rights vs. this collective responsibility.

      *   **Prompt 2: Internal Consistency.**
          *   *Tension:* Apology says "We did wrong." Legal disclaimer says "We admit no liability." Criminal law says "Only the shooter is guilty."
          *   *Resolution:* They are speaking different "languages" or operating in different spheres. Moral/Political guilt vs. Legal/Criminal guilt.
          *   *Coherence:* It *can* be coherent if "guilt" is polysemous (has multiple meanings). The state accepts *political/moral* responsibility without accepting *legal* culpability (which would open floodgates for lawsuits). It's a pragmatic compromise, not necessarily a logical contradiction, but it is a tension.

      *   **Prompt 3: Necessary vs. Contingent (Underdetermination).**
          *   *Hypothesis:* Payments could be based on "unjust enrichment" (we have the money they lost) rather than "guilt." Apology could be about "recognition" rather than "confession."
          *   *Verdict:* The student is right. The *actions* are underdetermined. You can justify reparations via utility, contract, or restitution without admitting moral sin. The *symbolism* (apology/curriculum) points to moral guilt, but the *mechanics* (fund/legal) point to pragmatic settlement.
          *   *Insight:* The practice is a "overlapping consensus" (to borrow Rawlsian language, though maybe too advanced for a HS junior? Keep it simple). Different people support it for different reasons.

      *   **Prompt 4: The Strict Individualism Counterfactual.**
          *   *Scenario:* Nothing normative survives death.
          *   *Consequences:*
              *   *Memorial:* Becomes a museum about "them" (a past regime), not "us." (e.g., "The Nazi Era" vs. "German History").
              *   *Apology:* Becomes "Regret." "We are sorry this happened" vs. "We are sorry *we* did this."
              *   *Fund:* Becomes humanitarian aid/charity, not reparations. No legal right to it.
              *   *Curriculum:* "History of the previous government," not "Our National Story."
          *   *Revelation:* This highlights that the current practice *does* assume a form of collective immortality or continuity.

  3.  **Drafting the Response (Iterative Process):**

      *   *Tone Check:* Needs to be encouraging. "This is a brilliant observation." "You are thinking like a philosopher." Avoid condescension.
