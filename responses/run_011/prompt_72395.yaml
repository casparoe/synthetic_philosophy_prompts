      *   *Self-Correction during drafting:* I need to make sure I don't just say "Yes, you're right." I need to push the thinking. For instance, in Part 2, acknowledge that while it *can* be consistent, it often *feels* hypocritical. That tension is part of the data. In Part 4, make sure to distinguish between what *must* change and what *might* change.

  4.  **Final Polish:**
