answer: |-
  **MEMORANDUM**

  **TO:** Anxiety Disorders Work Group
  **FROM:** [Your Name/Role]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation for Vote: Provisional Category "Anticipatory Dysregulation"

  **Recommendation**
  I recommend we **RENAME** the provisional category "Anticipatory Dysregulation" to **"Persistent Anticipatory Control Disorder" (PACD)**, accompanied by tightened diagnostic thresholds and a 24-month transition protocol.

  This recommendation is designed to resolve the tension between scientific validity and clinical utility. It acknowledges that the leaked terminology has compromised our field data without abandoning the patients who have organized their care around this construct.

  **Rationale for Renaming**
  The term "Anticipatory Dysregulation" is no longer a neutral clinical descriptor; it is a cultural artifact. Since the leak, the term has acquired a semantic life outside our control. Patients are not just presenting symptoms; they are presenting *interpretations* of the leaked criteria. By renaming the category, we disrupt the feedback loop between internet discourse and clinical presentation. A new label allows us to reset the baseline for future field studies, distinguishing the clinical syndrome from the online phenomenon.

  **Addressing the Validity Concern (The Case for Dropping)**
  I want to address the argument from our colleagues who advocate **Dropping** the category entirely. Their position rests on a serious epistemic claim: that the leak has irreparably contaminated our validity studies. They argue that we are no longer observing a natural history of symptoms, but rather a performative adoption of a label—that we are manufacturing the cases we intend to count as confirmation.

  **This argument is correct regarding the data we currently hold.** We must accept that the field-study results for "Anticipatory Dysregulation" are compromised by expectation effects. The correlation between the leaked criteria and patient self-reporting is too high to be ignored.

  However, dropping the category is the wrong remedy for this contamination. While the *data* is noisy, the *distress* is not. Our field sites report that patients meeting these criteria suffer genuine functional impairment, regardless of where they learned the vocabulary. To drop the category because our administrative security failed (the leak) would be to punish patients for our procedural error. Renaming allows us to accept the validity critics' premise—that the current construct is contaminated—without accepting their conclusion, which is to withdraw care. We treat the new name as a "Version 2.0" that acknowledges the previous data was provisional.

  **Addressing Clinical Continuity (The Case for Keeping)**
  Conversely, those arguing to **Keep** the name prioritize continuity of care. They note that patients are already using "Anticipatory Dysregulation" to secure school accommodations and insurance authorization. Changing the name risks stranding these individuals during the transition.

  This is a valid ethical constraint. To mitigate this, the recommendation includes a mandatory transition arrangement:
  1.  **Cross-Walking:** For 24 months following publication, ICD codes for "Anticipatory Dysregulation" will automatically map to PACD for insurance and legal purposes.
  2.  **Grandfathering:** Any patient diagnosed under the provisional criteria prior to publication retains their diagnosis status for a minimum of three years, regardless of whether they meet the stricter PACD thresholds.

  **Proposed Criteria Refinements**
  To further distinguish the clinical disorder from the internet vernacular, we must raise the threshold for diagnosis. The leaked criteria were too broad, which facilitated their viral spread. The PACD criteria should require:
  *   **Time-Cost Specification:** The "checking-and-rehearsing" habits must consume a minimum of 60 minutes per day *specifically* displacing other functional activities (work, sleep, social interaction). This filters out individuals who identify with the *feeling* of dread but do not suffer the *behavioral* impairment.
  *   **Objectless Specification:** Explicit exclusion of cases where dread is tied to a specific phobic stimulus or a major life event (e.g., impending wedding, job loss) to maintain distinction from Adjustment Disorders or Specific Phobias.

  **Action Items for Thursday's Vote**
  1.  Vote to discontinue the term "Anticipatory Dysregulation."
  2.  Vote to adopt "Persistent Anticipatory Control Disorder" as the replacement category.
  3.  Approve the revised criteria thresholds outlined above.
  4.  Mandate the 24-month cross-walking transition protocol for insurance and accommodations.

  We cannot undo the leak. We cannot pretend the data is pure. But we can choose a path that preserves scientific integrity without sacrificing the patients who need us. Renaming is the only option that honors both obligations.

  I look forward to discussing this on Thursday.
