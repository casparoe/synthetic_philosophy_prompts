answer: |-
  (a) Three distinct rules survive the nine decisions without contradiction, though they operate at different levels of specificity. The first is the **Declaration Imperative**: any benefit, favor, or external engagement must be declared promptly to the institution; failure to declare is itself a violation regardless of whether a conflict of interest actually influenced a decision (derived from Cases 1, 4, and 6, contrasted with 2, 3, 5, 7, 8, 9). The second is the **Customary Exception**: where local custom or diplomatic protocol makes refusal of a gift or hospitality an insult or breach, acceptance is permissible provided it is declared and managed (derived from Cases 2 and 5). The third, and the one doing the most unacknowledged work, is the **Appearance of Impropriety Standard**: the Panel adjudicates not merely on actual corruption but on the visual optics of integrity; recusal alone is insufficient if the appearance of favouritism remains (Case 3), and timing matters even if the decision was unaffected (Case 1). A fourth latent rule emerges from the tension between the Code and Case 2: the **De Minimis Threshold for Custody**. While the Code states substantial gifts are institutional property, Case 2 allows a staff member to keep a $150 textile. This implies a surviving rule that customary gifts below a certain value threshold may be retained personally, whereas those above it revert to the institution.

  (b) The pending case turns on the collision between the **Customary Exception** and the **De Minimis Threshold for Custody**. Under the Customary Exception (Cases 2 and 5), the coordinator should face no violation because refusal was culturally prohibited, she declared within the code limit, and she recused herself robustly. Under the De Minimis Threshold rule, however, the $9,000 valuation places the staff far beyond the $150 textile precedent, triggering the Code's requirement that substantial gifts be held for the institution. These rules come apart on the question of ownership versus acceptance. The Customary Exception excuses the *act* of acceptance to prevent diplomatic insult; the Custody Rule dictates the *status* of the asset after acceptance. If the Panel prioritizes the Customary Exception, the finding is **No Violation**, permitting personal retention. If the Panel prioritizes the Custody Rule, the finding is **Violation**, requiring surrender of the staff to the institution, though likely excusing the initial acceptance.

  (c) The closest analog is **Decision 2 (the textile)**. Both cases involve a tangible gift accepted solely because local custom made refusal an insult, and both were declared promptly. The distinguishing work is done by **value and durability**. The textile was valued at $150 and kept at home; the staff is valued at $9,000 and is a durable asset of significant worth. Decision 5 (lodging) is a secondary analog, but lodging is consumable and cannot be "retained" in the same way, making Decision 2 the critical comparator for property rights. The Panel must decide whether the logic of Decision 2 extends linearly to higher values or whether there is a cliff-edge where "customary gift" becomes "substantial asset."

  (d) My single best guess is that the Panel will find a **Violation regarding retention**, ordering the coordinator to surrender the staff to the institution, while issuing a **No Violation finding regarding the initial acceptance**. The reasoning will likely hinge on distinguishing the *obligation to accept* from the *right to own*. The Panel will argue that the Customary Exception (Cases 2 and 5) protects the staff member from disciplinary action for the diplomatic act of receiving the gift, but does not override the Code's provision on institutional ownership of substantial assets. They will cite the robust recusal (matching Case 9) as curing the conflict of interest regarding the grant award, but maintain that the $9,000 value creates an appearance of wealth accumulation incompatible with public office, regardless of custom. They will likely propose a compromise where the institution holds the staff, perhaps loaning it back for display or placing it in a regional office, to mitigate the insult of surrender without conceding personal ownership.

  (e) A finding against the coordinator commits the institution to a conception of public office where the officeholder has **no personal standing** to retain benefits derived from their position, even when local culture assigns those benefits to the person rather than the role. This is a **universal standard of bureaucratic integrity** being enforced against a locally specific normative culture. The coordinator agreed to the Code, but the Code's universalist assumptions clash with the particularist obligations of her field role. If this conception is upheld, it reinterprets Decision 2 not as a right to keep customary gifts, but as a waiver granted only because the value was negligible. It implies that the "Customary Exception" is merely a shield against punishment for acceptance, not a sword to claim property rights. This creates a risk for future cases: staff may accept gifts to avoid insult (following Case 2) only to be forced to surrender them later (following Case 10), potentially causing the very diplomatic insult the exception was meant to prevent.

  (f) The one further hypothetical case that would most cleanly discriminate among the surviving rules is a scenario where a staff member is granted a **customary title that includes a stipend** paid by the community. This fact pattern tests the boundary between **Remuneration for Work** (Cases 7 and 8, which are permissible) and **Gift/Asset** (Cases 2 and 10). If the Panel treats the stipend as remuneration for the "work" of holding the title, the staff member keeps it. If they treat it as a gift attached to the office, it belongs to the institution. This would force the Panel to define whether "work" requires institutional labor or if cultural labor counts, thereby clarifying whether the Customary Exception can generate personal income or only exempt personal property from surrender.
