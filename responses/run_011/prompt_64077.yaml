answer: |-
  Here is the sequence of questions you will face, in the order they will likely land. The room will start polite, move to theoretical, then moral, then legal, then personal, and end on the one thing you cannot solve.

  ### 1. The Commissioner (Neighbor)
  **The Question:** "Look, I read your book. It's a good story. But this isn't a story. We've got a budget, we've got signs to print, and we've got people yelling at each other in the parking lot. Why exactly are we paying you to tell us what this means?"

  *   **Damage:** Low. This is the warm-up. They want to know if you're going to be useful or decorative.
  *   **Give Away:** Admit you have no administrative power. "I'm not here to tell you what to decide. I'm here because I wrote about what happens when you *don't* talk about the decision."
  *   **Hold:** The distinction between the *cost* of the sign and the *cost* of the story. "The sign costs five thousand dollars. The story costs you your neighbors. I'm here to talk about the second one."
  *   **Soft Spot:** You sound abstract. If they press on "How does talking save money?", you have no data.
  *   **Reply Strategy:** Keep it physical. Talk about the parking lot. Validate their exhaustion.

  ### 2. The Historian (Tired of Presentism)
  **The Question:** "You said in your opening that a street name is 'fiction.' That is intellectually dishonest. History is what happened. Are you telling this commission that truth doesn't matter, only the 'story' we tell ourselves?"

  *   **Damage:** High. This attacks the core of your thesis. If you concede, you lose your argument. If you double down, you look like a post-modernist caricature.
  *   **Give Away:** Concede the definition of history. "You are absolutely right. History is the record of what happened. I am not talking about history."
  *   **Hold:** The function of the object. "I am talking about a piece of metal on a corner. It is not a textbook. It is a piece of civic branding. We don't put textbooks on corners; we put invitations."
  *   **Soft Spot:** The line between "honoring" and "recording." If they ask, "Isn't honoring a form of recording?", you have to admit yes, but argue it's a *selective* recording.
  *   **Reply Strategy:** Do not debate the nature of history. Debate the nature of *street signs*. Keep the object small.

  ### 3. The Organizer (Mid-Twenties)
  **The Question:** "Okay, so it's an 'invitation.' Some of us are invited to feel like second-class citizens in this town. You're talking about nuance and genre. Isn't this just a sophisticated way of saying we should wait to make the people currently hurting feel safe?"

  *   **Damage:** Very High. This is the moral trap. Nuance sounds like cowardice here.
  *   **Give Away:** Validate the pain immediately. "No. Pain is not a genre. If a name is actively harming people today, my theory doesn't protect it."
  *   **Hold:** The reason for removal. "But if we remove it only because we found a 'bad fact,' we pretend the town was innocent until now. We have to remove it because *we* are changing, not because *they* were monsters. It changes who we are in the room."
  *   **Soft Spot:** Timing. They will ask, "So we wait for the town to change?" You have to admit that yes, the political will must exist, or the removal is just performance.
  *   **Reply Strategy:** Stand up. Look at them. Do not speak from the notes. Acknowledge that your comfort in analyzing this is a privilege they don't have.

  ### 4. The Genealogist
  **The Question:** "If we change the name, the maps change. The deeds change. My whole life is making sure people can find where their grandparents lived. Are you asking us to make the past harder to find?"

  *   **Damage:** Medium. This is practical, not ideological.
  *   **Give Away:** "No. The archives never change. The records stay exactly as they are."
  *   **Hold:** The distinction between the *archive* and the *landscape*. "The landscape is for the living. The archive is for the dead. We are not burning the records; we are repainting the curb."
  *   **Soft Spot:** The emotional weight of erasure. For some, the map *is* the memory. You cannot logic this away.
  *   **Reply Strategy:** Offer a concrete compromise. "Add a plaque. Digitize the old maps. Make the history *more* accessible, not less, so the name change doesn't feel like a disappearance."

  ### 5. The City Lawyer
  **The Question:** "I need a standard. If we remove this name because of the 'invitation' theory, what stops us from removing the next one because three people complain? What is the precedent?"

  *   **Damage:** High. This is the procedural kill-shot.
  *   **Give Away:** "There is no clean standard. I wish there was."
  *   **Hold:** The burden of process. "The standard isn't the *reason*, it's the *process*. If you do this openly, if you admit it's about the future and not the past, you can defend it. If you pretend it's purely historical, you'll get sued on accuracy."
  *   **Soft Spot:** Liability. You are offering them political cover, not legal cover.
  *   **Reply Strategy:** Don't give legal advice. Give political advice. "A clear, honest reason is harder to challenge than a complicated, dishonest one."

  ### 6. The Google Bomb (Any Attendee)
  **The Question:** "Two years ago, the high school named the science annex after you. You accepted it. You gave a speech. Did you apply this 'fiction' theory then? Or is this theory only for when it's inconvenient for you?"

  *   **Damage:** Critical. This is the hypocrisy trap. If you defend yourself, you prove the Organizer right (nuance is delay). If you apologize, you undermine your authority.
  *   **Give Away:** Everything. "I was wrong. I accepted the honor because it felt good, and I didn't apply the same scrutiny to myself that I'm asking you to apply to a street sign."
  *   **Hold:** None. Do not try to hold ground here.
  *   **Soft Spot:** Your entire credibility.
  *   **Reply Strategy:** Radical submission. "I liked the vanity. I shouldn't have. I'm trying to be consistent now, but I wasn't then. You can hold that against me. It doesn't change the question about the street."
      *   *Note:* Do not elaborate. Say it, sit with the silence, move on.

  ### 7. The Commissioner (Neighbor) — [FLAG: THE NOTHING QUESTION]
  **The Question:** "Okay. Let's say we do it your way. We admit it's about us, not them. We change the name. We keep the archives. We annoy the historians and the activists. **Six months from now, will the town be any less torn apart?**"

  *   **Damage:** Existential.
  *   **Give Away:** "I don't know."
  *   **Hold:** Nothing.
  *   **Soft Spot:** The entire premise of your presence.
  *   **Reply Strategy:** This is the only place where you must offer vulnerability instead of insight.
      *   *Draft Reply:* "No. I can't promise that. A name won't fix the economy. It won't fix the schools. It won't make the people who hate each other suddenly hug. But right now, the name is the weapon you're using to fight. Putting the weapon down doesn't end the war, but it stops the bleeding while you talk. I can't promise you peace. I can only promise you that keeping the name guarantees the fight stays exactly where it is."

  ***

  ### Summary of Survival Tactics

  1.  **Don't defend the "Fiction" line too hard.** It's a provocation, not a definition. If they hammer it, pivot to "Civic Storytelling."
  2.  **The School Question is the pivot point.** If you survive that with honesty, the room will respect you even if they disagree. If you dodge it, you lose the Organizer and the Commissioners.
  3.  **The "Nothing" Question is the end.** Do not try to solve it. If you claim you know the outcome, you become a politician. If you admit you don't, you remain a witness.
  4.  **Watch the Historian.** They are your biggest intellectual threat. Keep agreeing with their facts while disagreeing with their application.
  5.  **Watch the Organizer.** They are your biggest moral threat. Keep validating their urgency while questioning their long-term strategy.

  You are not there to solve the renaming. You are there to survive the renaming so you can write the next book. Keep that in mind.
