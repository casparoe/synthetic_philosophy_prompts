      *   *Self-Correction on Evidence:* Don't cite specific studies (e.g., "The Lancet 2015"). Instead say "Longitudinal epidemiological data tracking cardiovascular events against logged hours."
      *   *Self-Correction on "False":* Be careful calling it "simply false." Better to say "empirically unsustainable under scrutiny."
      *   *Refining the "Menu":* Make sure the classifications are distinct.
      *   *Refining the "Licensing":* Be clear about the gap between the statement and the decision.

  9.  **Final Polish:** Check for British spelling (labour, programme, analyse, centre). Ensure the structure matches the prompt's requirements exactly. (Menu -> Licensing -> Specific Points -> Rhetorical Analysis).

