  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is a new head of a small engineering team. They proposed capping weekly hours and protecting leave. A director (two levels up) dismissed this with "Hard work never killed anyone," causing the table to laugh and the item to be dropped.
      *   **User's Motivation:** Personal (father died of stroke after long hours) and Professional (experience in Japan regarding *karoshi*). Wants to answer properly, not emotionally.
      *   **Task:**
          1.  Provide a "menu" of distinct precise claims the sentence might make.
          2.  For each reading: Charitable formulation, Classification (platitude, empirical, normative, performative, false), Evidence required (types, not specific stats).
          3.  Analyze which readings license the director's action (dismissal without engagement) vs. which leave it unsupported.
          4.  Address specific philosophical/practical points: Individual risk vs. population risk; Tacit comparison; Semantic shift of "hard work"; Voluntariness presupposition; Claims about the "good life."
          5.  Conclusion on whether it's a non-claim/exhortation, its rhetorical function, and the best response.
      *   **Tone/Style:** British English, measured and precise register, suitable for circulation to colleagues (professional, objective, analytical), no bibliography, no attributed quotations.

  2.  **Deconstruct the Sentence ("Hard work never killed anyone"):**
      *   It's an idiom/proverb.
      *   Literally false (people die while working, or due to stress-induced conditions).
      *   Functionally, it's used to discourage complaint about effort.
      *   Need to break this down into logical propositions.

  3.  **Drafting the Menu of Claims:**
      *   *Reading 1: Literal/Biological.* Effort itself isn't the direct cause of death. (False/Defensible empirical).
      *   *Reading 2: Statistical/Comparative.* The mortality risk of working hard is negligible compared to other risks. (Empirical generalisation).
      *   *Reading 3: Normative/Virtue.* Hard work is a moral good that outweighs physical costs. (Normative dressed as descriptive).
      *   *Reading 4: Performative/Exhortation.* "Stop complaining and get on with it." (Not truth-apt).
      *   *Reading 5: Historical/Contextual.* In the past, physical labour didn't kill; therefore, modern work won't. (False analogy).

      *Refining for the prompt:* The prompt asks for "distinct precise claims," "charitable formulation," "classification," and "evidence."
      *   *Claim A (Physiological):* Physical or mental exertion, in isolation, is not a direct cause of mortality.
      *   *Claim B (Statistical):* The incremental mortality risk associated with extended working hours is statistically insignificant relative to baseline mortality.
      *   *Claim C (Normative):* The value of industriousness outweighs the health costs incurred by the worker.
      *   *Claim D (Performative):* This is a command to cease prioritising self-preservation over output.

  4.  **Analyzing the Director's Use (Licensing the Dismissal):**
      *   Does Claim A license dismissal? No, because policy isn't about direct causation only.
      *   Does Claim B license dismissal? Only if the risk *is* insignificant. If evidence shows otherwise, it fails.
      *   Does Claim C license dismissal? No, that's a value judgement, not a factual rebuttal to a safety proposal.
      *   Does Claim D license dismissal? Rhetorically yes, logically no. It shuts down debate by changing the mode from policy to culture.

  5.  **Addressing the Specific Points:**
      *   *Individual vs. Population:* Even if *one* person survives, a policy affects *many*. Small risk x Large N = Significant aggregate harm. This is basic risk management.
      *   *Tacit Comparison:* Is it better than idleness? Maybe. But the proposal isn't for idleness, it's for *sustainable* work. The comparison is false dichotomy.
      *   *Semantic Shift:* "Hard work" used to mean physical toil (bounded). Now it means cognitive load + availability (unbounded). Sleep displacement is key here. The old saying doesn't fit the new reality.
      *   *Voluntariness:* The saying implies choice ("I choose to work hard"). In employment, refusal = career damage. Coercion changes the moral weight.
      *   *The Good Life:* Even if work gives meaning, imposing it violates autonomy. A policy cannot enforce a specific conception of the good life regarding risk tolerance.

  6.  **Conclusion on Rhetorical Function:**
      *   It's a "conversation stopper." It looks like a fact but acts as a power move.
      *   Best response: Acknowledge the sentiment but pivot to risk management and sustainability. "We agree on effort, but we manage risk."

  7.  **Review against Constraints:**
