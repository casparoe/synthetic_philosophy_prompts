answer: |-
  This is a tight argument. You have successfully reconstructed a computational version of the "New Riddle of Induction" (Goodman's *Grue*) and combined it with the Duhem-Quine thesis on underdetermination. The logic from (1) through (8) is valid. If you accept the premises, the conclusion follows.

  Since you want a frank diagnosis: **The argument is unsound.** You must reject **Premise 1**, and in doing so, you implicitly reject the claim in **Premise 5** that $T'$ is not objectionable.

  Here is the breakdown of why, what it costs, and how it addresses your specific worries about checkability and self-undermining.

  ### 1. The Diagnosis: Reject Premise 1

  **Premise 1:** *A theory is confirmed by evidence only if that evidence discriminates it from rivals that would otherwise fit the same data.*

  This is the failure point. This premise asserts a form of **Contrastive Empiricism**. It claims that evidence *alone* must do the work of selection. This ignores the role of **priors** (in Bayesian terms) or **explanatory virtue** (in Inference to the Best Explanation terms).

  In your industry, you encounter this daily under the name **overfitting**.
  *   $T$ is a generalized model.
  *   $T'$ is a model that memorizes the training data plus a hardcoded exception for a specific edge case you cannot currently test.

  Both models fit the "feasible data" (the training set) perfectly. By Premise 1, you cannot confirm $T$ over $T'$. But in practice, you *do* confirm $T$ over $T'$. Why? Because you penalize complexity. You assume that a theory requiring more bits to specify (higher Kolmogorov complexity) is less likely to be true, *ceteris paribus*.

  **The Fix:** Confirmation is not just $P(E|H)$ (likelihood); it is $P(H|E)$ (posterior). By Bayes' Theorem:
  $$P(H|E) \propto P(E|H) \cdot P(H)$$
  If $T$ and $T'$ predict the evidence $E$ equally well ($P(E|T) = P(E|T')$), the likelihood ratio is 1. The evidence *does not discriminate*. However, if $P(T) \gg P(T')$, then $T$ is confirmed over $T'$ despite the empirical equivalence.

  **The Cost:** You must abandon the idea that evidence speaks for itself. You must accept that "confirmation" relies on a background framework of plausibility (priors) that is not itself derived solely from the immediate evidence. This framework is fallible, but it is not arbitrary.

  ### 2. The Status of $T'$: Reject Premise 5

  **Premise 5:** *$T'$ is not objectionable... It differs from $T$ only on inputs we cannot reach.*

  You claim $T'$ is not a "contrived skeptical hypothesis." I disagree. $T'$ is the definition of **ad hoc**.

  A hypothesis is a "genuine rival" only if it has independent motivation or explanatory scope. $T'$ is constructed *solely* to be empirically equivalent to $T$ on feasible data while remaining logically distinct. It posits a discontinuity in the laws of nature (or the system's function) that correlates exactly with the limits of our computational power.

  **Why is it a rival?** Logically, it is.
  **Why is it not a *genuine* rival?** Probabilistically, it is not.

  In machine learning, we handle this with **regularization**. We add a penalty term to the loss function for model complexity. We do not wait for data that discriminates the overfitted model from the generalized one (we can't, that's the test set). We decide *a priori* that simpler models are preferable.

  **Your Worry on Checkability:**
  > *I want to know what makes a hypothesis a genuine rival rather than a merely consistent one, and whether that criterion is itself something we could ever check.*

  You are asking for a decision procedure to distinguish "science" from "pseudoscience" (the Demarcation Problem).
  *   **Can we check it perfectly?** No. Determining the true Kolmogorov complexity of a theory is uncomputable (halting problem).
  *   **Can we check it well enough?** Yes. We use heuristics: length of description, number of parameters, coherence with established theory.

  You do not need a *proof* that $T'$ is false to reject it as a rival. You only need a *reason* to assign it a low prior. The fact that $T'$ is defined by an arbitrary number $N$ and a computational boundary is sufficient reason to assign it a vanishingly small prior probability compared to $T$.

  If you demand that the criterion for "genuine rival" be algorithmically decidable in all cases, you are demanding a solution to the Halting Problem for epistemology. That demand is too high. Science proceeds on computable *approximations* of truth, not logical certainties.

  ### 3. The Self-Undermining (Step 8)

  Step 8 argues that if the argument is sound, its own premises are unconfirmed. This is a *reductio ad absurdum*.

  If you reject Premise 1 (as I recommend), Step 8 dissolves.
  *   The claim "Premise 1 is false" does not need to be confirmed by evidence that discriminates it from a rival where "Premise 1 is true."
  *   It is confirmed because it offers a better explanation of scientific practice (which *does* reject $T'$-style hypotheses) and avoids the self-undermining paradox.

  You are worried that rejecting (1) leaves you with ungrounded assumptions. This is correct, but it is the only stable position. **Foundationalism fails.** You cannot ground your epistemology without using some epistemology. You must start somewhere. Starting with "Simple theories are more likely true" is a pragmatic necessity, not a logical derivation.

  ### 4. General Underdetermination

  > *Once the computational version is handled, is anything left of the general underdetermination worry?*

  No. The computational argument is just the general argument with specific parameters.
  *   **Classic Underdetermination:** "Maybe there are invisible demons pushing the planets."
  *   **Computational Underdetermination:** "Maybe the function flips on inputs we can't factor."

  Both rely on the same move: constructing a theory that matches all data but posits hidden differences. Both are defeated by the same move: **Priors based on simplicity/coherence.**

  If you accept that $T'$ is not a genuine rival because it is *ad hoc* and complex, you must also accept that "invisible demons" are not genuine rivals because they add entities without increasing predictive power. The computational constraint makes the indistinguishability *practical* rather than *logical*, but the epistemic solution is identical.

  ### Summary of Costs

  To reject this argument, you must accept the following:

  1.  **Evidence is not sovereign:** Data alone does not confirm theories; data updates prior probabilities.
  2.  **Priors are necessary:** You must assume that simpler, less *ad hoc* theories are more likely to be true, without being able to prove this assumption logically.
  3.  **No algorithmic demarcation:** You cannot write a function `isGenuineRival(theory)` that returns true/false for all cases. You must rely on heuristics that work well enough for engineering and science.
  4.  **Fallibilism:** You might be wrong. $T'$ *could* be true. But believing $T$ is the rational bet given the information cost.

  ### Final Verdict

  Keep (4). It is arithmetically sound (given the hardness assumption).
  **Reject (1).** Confirmation does not require discrimination of *all* rivals, only *plausible* ones.
  **Reject (5).** $T'$ is objectionable because it is *ad hoc* and has high complexity relative to its explanatory gain.

  This saves you from skepticism without requiring you to prove a negative. It aligns with how you actually write software: you assume the simpler architecture is better unless forced otherwise, not because you've proven the complex one impossible, but because the complex one is a bad bet.
