  *My thought:* It fixes it logically, but practically it might be impossible for ancient texts. If the revaluation happens *within* the final text (e.g., the Torah itself revalues slavery), is that "independent"? The draft says "visible in the text's own redactional layers OR in surrounding literature." This is good. I should validate this but warn about the difficulty of establishing redactional layers objectively.

  *(Wait, one more check on Q3)*: Alaksandu treaty. It's usually dated to the reign of Muwatalli II. 1295–1272 BCE is the usual range. 1280 is a safe midpoint. Annales Cambriae: The text exists in 10th-century manuscripts, but the entries might be earlier. "Mid-tenth century" is safe for the text *as we have it*.

