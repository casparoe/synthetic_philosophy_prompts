  ### Predicted Verdict
  **Include.** Based on the margin note ("a low-quality animal 'couldn't get away with' displaying it"), your adviser is operating on a functionalist criterion: honesty is defined by the *outcome* for the liar, not the *mechanism* of the signal. In the wasp system, a low-quality subordinate *cannot* get away with an exaggerated badge because they are punished. This satisfies her stated principle, even if the pigment itself is cheap.

  ### The Rules Consistent with Her Record
  There are two distinct theoretical rules that fit her six prior verdicts perfectly. They diverge only on cases where honesty is maintained by receiver punishment rather than sender constraints.

  **1. The Functionalist Rule (Net Deterrence)**
  *   **Definition:** A signal counts as "honest" if, in the natural system, a low-quality individual incurs a net fitness loss from exaggerating the signal. The mechanism enforcing this loss (physiological cost, anatomical constraint, or social punishment) is irrelevant.
  *   **Fit to Record:**
      *   *Includes (1, 2, 3):* In all cases, low-quality senders cannot successfully exaggerate (due to cost, anatomy, or predation risk).
      *   *Excludes (4, 5, 6):* In all cases, low-quality senders *did* or *could* benefit from the signal without paying a prohibitive price (no condition link, non-differential cost, or successful bluffing).
  *   **Prediction for Wasp:** **Include.** The "cheater" wasps suffered aggression; they could not get away with the lie.

  **2. The Mechanistic Rule (Inherent Integrity)**
  *   **Definition:** A signal counts as "honest" only if the reliability is guaranteed by properties intrinsic to the signal's production or maintenance by the sender (e.g., physiological cost or anatomical index). Costs imposed *after* display by receivers (social policing) do not count as signal costs.
  *   **Fit to Record:**
      *   *Includes (1, 2, 3):* Reliability is inherent (condition-dependent ornament, vocal tract anatomy, performance capacity).
      *   *Excludes (4, 5, 6):* Reliability is absent or decoupled from sender quality (no condition link, non-differential cost, decoupled claw strength).
  *   **Prediction for Wasp:** **Exclude (Box).** The pigment is cheap and unconstrained; the honesty is enforced externally by rivals, not internally by the sender's physiology.

  ### The Crab (Item 6) vs. The Wasp (Item 7) Comparison
  This is the critical theoretical fault line in your chapter.

  *   **If she Excludes the Wasp:** She is committed to the **Mechanistic Rule**. She views "Honest Signaling" as a property of the *trait*, not the *system*.
      *   *Implication for Item 2 (Deer):* This principle **does not** cost her the deer example. The deer's roar is an **index**; the reliability is physically inherent to the vocal tract anatomy. It satisfies the Mechanistic Rule because the sender *cannot* produce a larger sound, regardless of receiver behavior.
      *   *Implication for Item 6 (Crab):* The crab claw was excluded because the signal (size) was decoupled from the quality (force), and the cost (regrowth) was sunk. The signal lacked inherent integrity at the time of display.

  *   **If she Includes the Wasp:** She is committed to the **Functionalist Rule**. She views "Honest Signaling" as a property of the *evolutionary equilibrium*.
      *   *Implication for Item 6 (Crab):* She can still exclude the crab without contradiction. The distinction she must hold onto is **the success of the deception**. In the crab system, low-quality males *did* get away with the bluff (rivals seldom tested). In the wasp system, they *do not*. Under the Functionalist Rule, the crab is a "signal that lies" (Box) because the lie works; the wasp is an "honest signal" (Chapter) because the lie fails.
      *   *Distinction:* She does not need to rely on "how often the bluff gets tested" as a frequency metric, but rather on the **net payoff**. If the bluff yields a net benefit, it goes in the Box. If the bluff yields a net cost, it goes in the Chapter.

  ### The Sharpest Separating Example
  If the wasp verdict is ambiguous or you need a backup that isolates the theoretical variable without relying on invertebrate sociality, pitch the **Harris's Sparrow (*Zonotrichia querula*)**.

  *   **The Case:** In winter flocks, dark throat bibs signal dominance status. The pigment is metabolically cheap. When researchers experimentally darkened the bibs of subordinate birds, these "cheaters" received significantly more aggression from dominant rivals and suffered higher stress and lower foraging success.
  *   **Why it Separates the Rules:**
      *   **Functionalist Rule:** **Include.** Low-quality birds cannot get away with the dark bib (social punishment ensures honesty).
      *   **Mechanistic Rule:** **Exclude.** The bib pigment is cheap and unconstrained; the honesty is enforced by receiver aggression, not sender physiology.
  *   **Why this pitch:** It is the vertebrate analog to the *Polistes* wasp. If she accepts the Wasp but rejects the Sparrow (or vice versa), you know her rule involves taxonomic bias or a specific distaste for social policing. If she treats them identically, you have confirmed that her dividing line is strictly **Inherent Constraint vs. Net Deterrence**.

  ### Summary of Strategic Advice
  Pitch the **Wasp** with the framing that "subordinates cannot maintain the exaggerated signal without incurring immediate fitness costs via aggression," explicitly echoing her margin note about "getting away with it." If she bounces it, she is a **Mechanistic Purist** (Zahavian), and you should pivot to the **Harris's Sparrow** only if you can argue the bib has some physiological link to testosterone (which some literature suggests), thereby trying to salvage it under the Mechanistic Rule. If she accepts the Wasp, you have cleared the "Social Policing" category for your chapter.
