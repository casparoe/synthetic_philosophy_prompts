prompt: |-
  I run a small design studio and I'm about to hire my first full-time person. My instinct is to have her run everything by me — every client email, every draft — because I trust my own eye more than any rule I could write down, and I'd catch problems early. My business partner thinks that's a disaster: he says her objective should just be "get the client satisfaction survey score as high as possible," and otherwise leave her alone.

  Thing is, I did my version of this once with an assistant and it went badly in a way I still can't quite explain. After a couple months she was only showing me the stuff thats going well, and I found out later two clients had been quietly unhappy for weeks. She was never lying, exactly — she just stopped surfacing anything I wouldn't like.

  So: what actually went wrong there, structurally, and which of our two plans avoids it? I don't want a list of management tips. Also, honestly, I usually can't say what good work is until I see it — does that fact push me toward my partner's version or away from it?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Owner of a small design studio.
      *   **Context:** Hiring first full-time employee.
      *   **Conflict:** User wants total control (micromanagement/approval bottleneck) vs. Partner wants total autonomy based on a single metric (client satisfaction score).
      *   **Past Experience:** User tried the "control" approach before. It failed. The employee hid problems, clients were unhappy, user found out too late. Employee wasn't lying, just filtering.
      *   **Key Constraint:** User admits they often can't define "good work" until they see it (intuitive judge).
      *   **Request:** Explain *structurally* what went wrong last time. Determine which plan avoids it. Address how the "intuitive judge" factor influences the decision. No generic management tips.

  2.  **Deconstruct the Past Failure (The "Control" Model):**
      *   *Mechanism:* Employee shows everything -> Boss approves/rejects.
      *   *Incentive Structure:* The boss rewards "things that get approved" and implicitly punishes (via correction/friction) "things that get rejected."
      *   *The Structural Flaw:* This creates an **information asymmetry** driven by **risk aversion**.
      *   *Why did she hide problems?* Because surfacing a problem requires the boss to engage in negative feedback or difficult problem-solving. Surfacing a success gets a quick "good job." Over time, the employee learns that *bringing problems = pain* and *hiding problems = peace* (until it explodes).
      *   *The "Good Eye" Paradox:* The user trusts their eye, but by making the eye the *gatekeeper*, they turned the employee into a gate-keeper of *what the eye sees*.

  3.  **Deconstruct the Partner's Plan (The "Metric" Model):**
      *   *Mechanism:* Employee does everything -> Measure Client Satisfaction (CSAT).
      *   *Incentive Structure:* Employee is rewarded for high scores.
      *   *The Structural Flaw:* **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure").
      *   *Risk:* The employee will optimize for *happiness*, not *quality* or *business health*. They might over-promise, under-price, say "yes" to scope creep, or avoid necessary friction (like pushing back on bad client ideas) just to keep the score high.
      *   *Does it solve the hiding problem?* No. It just changes *what* is hidden. Instead of hiding "bad work," they hide "unhappy clients" or "scope issues" until the survey goes out. Actually, it might make hiding *worse* because the metric is lagging (survey happens at the end).

  4.  **Evaluate the "Intuitive Judge" Factor:**
      *   User says: "I usually can't say what good work is until I see it."
      *   *Implication:* You cannot write a rulebook (Standard Operating Procedures) for quality.
      *   *Implication for Control Model:* If you can't define it, you can't efficiently approve it. You become a bottleneck based on vibe. This increases the employee's anxiety (will the vibe be right today?), encouraging more filtering.
      *   *Implication for Metric Model:* If you can't define quality, a satisfaction score is a proxy. But satisfaction $\neq$ quality. A client can be happy with bad work that makes them look good, or unhappy with great work that challenges them.
      *   *Verdict:* This fact pushes *away* from the Partner's plan (too reliant on a proxy metric) but also makes the User's plan inefficient (bottleneck based on intuition).

  5.  **Synthesize the Structural Diagnosis:**
      *   The core issue isn't "control vs. freedom." It's **Feedback Loops** and **Psychological Safety**.
      *   Last time: The feedback loop was "Show Boss -> Get Corrected." This trained the employee to minimize surface area for correction.
      *   Partner's plan: The feedback loop is "Finish Project -> Get Score." This is too slow (lagging indicator) and encourages gaming the system.
      *   The "Intuitive Judge" fact: This means the User needs to be involved in the *process*, not just the *output*. But the involvement must not feel like a "pass/fail" test.

  6.  **Develop the Solution (The "Third Way"):**
      *   Neither plan works.
      *   User's plan creates a **filtering incentive**.
      *   Partner's plan creates a **gaming incentive**.
      *   Need a system where surfacing problems is *rewarded* or at least *neutral*, and the User's intuition is used as a compass, not a gate.
      *   *Key Concept:* **Calibration vs. Approval.**
      *   *Key Concept:* **Leading vs. Lagging Indicators.** (Surveys are lagging).
      *   *Key Concept:* **Shared Context.**

  7.  **Drafting the Response (Iterative refinement):**
      *   *Acknowledge the past failure:* It wasn't personality; it was incentives. The system punished bad news.
      *   *Analyze Partner's plan:* It's dangerous for a design studio. Happy clients $\neq$ sustainable business. It encourages people-pleasing over design leadership.
      *   *Address the "Intuitive Judge":* This is the crux. Since you can't write rules, you need *calibration sessions*, not approval gates.
      *   *Propose the Structural Fix:* Shift from "Approval" to "Calibration." Shift from "Survey" to "Pulse."
      *   *Specific Mechanism:* Don't approve emails. Review *strategy* before execution. Review *work* at 30% and 70%, not 100%.
      *   *Addressing the Hiding:* Make "bad news" a neutral or positive input. "I found a risk" should be met with "Thanks for spotting that," not "Why did this happen?"

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I give management tips? I need to be careful not to say "Have weekly meetings." I need to explain the *structural why*.
      *   *Check:* Did I answer the "Intuitive Judge" question? Yes, it makes the Partner's plan riskier because satisfaction is a poor proxy for design quality, and the User's plan riskier because intuition is hard to scale via approval.
      *   *Focus:* Keep it on *incentives* and *information flow*.

  9.  **Final Polish:**
      *   Structure: 1. Diagnosis of past failure. 2. Diagnosis of Partner's plan. 3. The "Intuitive Judge" implication. 4. The Structural Solution.
      *   Tone: Direct, analytical, empathetic to the design mindset.

      *(Self-Correction on the "Intuitive Judge" part)*: If the user can't define good work until they see it, they *must* see the work. But if they see *all* the work as an approver, it creates the bottleneck. The solution is seeing work *early* when stakes are low. This reduces the employee's fear of rejection.

      *(Refining the "Partner's Plan" critique)*: Client satisfaction is a lagging indicator. By the time you know the score, the damage is done. Also, in design, the best work often makes clients uncomfortable initially. Optimizing for satisfaction kills bold work.

      *(Refining the "Past Failure" diagnosis)*: It's called "Mum Effect" or "Shooting the Messenger." The structure made the messenger responsible for the message's quality.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  Here is the structural diagnosis of your past failure, an analysis of your partner's plan, and how your "intuitive judge" constraint dictates the solution.

  ### 1. What Went Wrong Structurally (The "Gatekeeper" Trap)

  Your previous hire didn't hide problems because she was deceitful; she hid them because your system made **bad news expensive.**

  When you require "run everything by me," you establish yourself as the **Gatekeeper of Quality**. Structurally, this creates a perverse incentive:
  *   **Success:** She shows you work $\rightarrow$ You approve $\rightarrow$ She feels safe.
  *   **Failure:** She shows you work $\rightarrow$ You correct it $\rightarrow$ She feels friction.
  *   **Hidden Failure:** She *doesn't* show you work $\rightarrow$ No friction $\rightarrow$ She feels safe (temporarily).

  Over time, the employee learns that surfacing a problem requires expending emotional capital with you. If she can solve it quietly, she avoids the "correction penalty." If she can't solve it, she delays surfacing it hoping it resolves itself.

  This is not a trust issue; it is an **information asymmetry** issue. By making yourself the bottleneck for *output*, you inadvertently became a filter for *input*. She stopped feeding you the data you needed to make decisions because the cost of transmitting that data (your correction) was too high.

  ### 2. Why Your Partner's Plan Is Also Structurally Flawed

  Your partner suggests optimizing for "Client Satisfaction Survey Scores." Structurally, this replaces the Gatekeeper Trap with **Goodhart's Law**: *When a measure becomes a target, it ceases to be a good measure.*

  In a design studio, this is dangerous for two reasons:
  1.  **Lagging Indicator:** A satisfaction survey happens at the end. By the time you see a low score, the project is over, the money is spent, and the reputation damage is done. It does not prevent the failure; it merely catalogs it.
  2.  **Optimization for Comfort, Not Quality:** In design, the best work often requires challenging the client. If an employee's primary KPI is client happiness, they are structurally incentivized to avoid friction. They will say "yes" to scope creep, "yes" to bad ideas, and "yes" to unrealistic deadlines to keep the smiley-face score high.

  Your partner's plan avoids the "hiding problems" issue only if the problems result in immediate angry emails. But subtle drift? Scope creep? Brand dilution? Those won't show up on a survey until it's too late.

  ### 3. The "Intuitive Judge" Constraint

  You mentioned: *"I usually can't say what good work is until I see it."*

  This fact pushes you **away from your partner's plan** and requires a modification of **your plan.**

  *   **Why it kills your partner's plan:** Since you cannot define quality via rules, you cannot assume a happy client equals good work. Clients often don't know what good design is until they see it either. If you outsource quality control to a satisfaction metric, you are outsourcing your core value proposition to a proxy that doesn't understand design.
  *   **Why it complicates your plan:** Since you need to *see* the work to judge it, you cannot fully automate or delegate the quality control. You *must* be in the loop. However, if you are in the loop as an **Approver** (Yes/No), you recreate the "Gatekeeper Trap" from your first hire.

  ### 4. The Structural Solution: Calibration vs. Approval

  To solve the hiding problem while respecting your intuitive process, you must change your role from **Gatekeeper** to **Calibrator**.

  **The Structural Shift:**
  Do not review work for *approval*; review work for *alignment*.

  *   **Old Structure (Approval):** Employee finishes draft $\rightarrow$ Submits to You $\rightarrow$ You Fix/Approve.
      *   *Risk:* High stakes for employee. If it's wrong, they wasted time and look bad. Incentivizes hiding.
  *   **New Structure (Calibration):** Employee defines strategy/direction $\rightarrow$ You align on "vibe" $\rightarrow$ Employee executes $\rightarrow$ Check-in at 30% completion.
      *   *Benefit:* You get to use your "eye" early, when the cost of change is low. The employee isn't being "tested" on a finished product; they are collaborating on a direction.

  **How this fixes the "Hiding" incentive:**
  In the Approval model, bringing you a problem means "I failed." In the Calibration model, bringing you a problem means "I am calibrating."

  You need to structurally separate **Problem Surfacing** from **Performance Review**.
  *   If an employee emails you saying, "The client is asking for something that will break the brand," your reaction must be structurally neutral or positive ("Good catch, let's strategize"), never punitive ("Why did they ask that?").
  *   If you react with friction when problems are surfaced, you rebuild the Gatekeeper Trap.

  **The Verdict:**
  Your partner's plan is safer for your sanity but risky for your business quality. Your instinct is safer for quality but risky for team dynamics.

  Because you are an intuitive judge, you cannot fully let go (Partner's plan). But because you are a bottleneck, you cannot approve everything (Your plan).

  **The Fix:**
  Require visibility into **process**, not just **output**.
  1.  **Don't read every email.** Instead, require a "Monday Morning Brief" from her: *What are the top 3 risks this week? Where do you need my eye?* This forces problem surfacing as a routine task, not a crisis admission.
  2.  **Review at 30%, not 100%.** Use your intuition to steer the ship while it's still turning, not when it's hitting the iceberg. This lowers the stakes for her (less rework) and satisfies your need to "see it."
  3.  **Measure "Surfaced Risks," not just "Happy Clients."** If she flags a client issue early and you solve it together, that is a win, even if the client was temporarily annoyed.

  Your previous hire hid problems because the system punished the messenger. Your partner's system ignores the messenger until the ship sinks. You need a system where the messenger is rewarded for pointing out the ice, regardless of whether you decide to steer around it or break through it.
