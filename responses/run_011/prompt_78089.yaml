answer: |-
  (a) **Reconstructed Rules**

  **Rule 1: The Duty of Role and Proximity**
  *   **Formulation:** If an agent possesses the specific professional capacity or immediate physical proximity required to prevent harm, the action is a debt, not a gift. Success is admirable but expected; failure is not necessarily wrong but reflects on character.
  *   **Support:** Entry 3 (Nurse took the post), Entry 5 (Early years: neighbours do), Entry 9 (Soldier was nearest).
  *   **Worst Fit:** Entry 4 (Boy on ice). He was the only person there (proximity) and acted (capacity), yet H places this at the "top of the scale," explicitly stating, "You cannot ask that of a child."
  *   **Reconciliation:** H distinguishes capacity by *agency*. A child's capacity does not generate debt; an adult professional's or "nearest man's" does.

  **Rule 2: The Purity of Motive (The Concealment Constraint)**
  *   **Formulation:** An action cannot reach the "top of the scale" if the agent seeks public recognition or allows the selection of the beneficiary to be influenced by public visibility. Anonymity elevates; publicity caps merit.
  *   **Support:** Entry 1 (Kidney donor concealed), Entry 6 (Bill payer chose based on photograph/publicity — "Not the top"), Entry 5 (Later years: continued despite public accusation/ingratitude).
  *   **Worst Fit:** Entry 9 (Soldier). H does not mention concealment. The act was inherently public (combat), yet the lack of concealment is not cited as the reason it isn't "top."
  *   **Reconciliation:** For H, Role Duty (Rule 1) trumps Motive. The Soldier wasn't "top" because he *owed* it, regardless of whether he hid it.

  **Rule 3: The Necessity of Sacrifice**
  *   **Formulation:** High personal cost generates moral credit only if the cost was necessary to achieve the good. Unnecessary sacrifice is reckless, not noble.
  *   **Support:** Entry 7 (Landlord: "beyond the lease" — he didn't have to), Entry 1 (Kidney: major surgery, necessary for *this* recipient to get *this* kidney from *him*).
  *   **Worst Fit:** Entry 6 (Hospital Bill). He paid money he could have kept (cost), but H denies "top" status.
  *   **Reconciliation:** Cost alone is insufficient; it must be paired with Correct Selection (Rule 2). Entry 6 failed on selection (photo vs. need).

  **Incoherence Note:**
  No single rule reconciles **Entry 1 (Kidney)** and **Entry 9 (Soldier)** without revision. Both involve risking life/health for a stranger/compatriot. Entry 1 is "Top"; Entry 9 is "Owed."
  *   **The Pair:** Entry 1 and Entry 9.
  *   **Minimal Revision:** To reconcile, H must implicitly hold that *Civilian* status allows for supererogation, while *Institutional* status (military, medical, residential) converts risk into duty. If we revise Entry 9 to specify the soldier was *conscripted* vs. *volunteer*, or Entry 1 to specify the donor was *medical staff*, the tension might resolve. As it stands, H treats "Soldier" as a role that absorbs risk, and "Civilian" as a role that does not.

  ***

  (b) **Verdicts for the Diver**

  **Verdict 1 (Based on Rule 1: Duty of Role/Proximity):**
  *   **Yield:** "He had to."
  *   **Reasoning:** He was the *only* person with the training and kit. Like the Soldier (Entry 9) and the Nurse (Entry 3), his specific capacity created an obligation. The fact he was retired is outweighed by the possession of the kit and the absence of other capable agents.
  *   **Outcome:** The rescue is "owed." Not top of the scale. Merely admirable.

