  (f) **The Multi-Axial Scheme**

  Her scheme does not have the shape of a single scale. Entry 10 is the key: "He did nothing wrong. But I should think the less of him." This separates **Obligation** (Wrong/Permissible/Owed) from **Esteem** (Think Less/Neutral/Think More).

  *   **Axis 1: Obligation.** (Forbidden <— Permissible <— Owed).
  *   **Axis 2: Esteem.** (Think Less <— Neutral <— Think More).

  Entry 8 (Manners) is Permissible/Neutral.
  Entry 2 (Charity) is Owed/Neutral ("No medal").
  Entry 1 (Kidney) is Permissible/Think More ("Top of the scale").
  Entry 9 (Soldier) is Owed/Think More ("Admirable, and owed").
  Entry 10 (Brother) is Permissible/Think Less.

  **What she would say about the Diver on this scheme:**
  She will place him at **Owed / Think Less**.

  *   **Obligation:** He was the only one with the kit. Like the Nurse (3) and Soldier (9), the rescue itself was a debt. He "had to" save the boy.
  *   **Esteem:** His motive (spite) and method (unnecessary risk for show) degrade his character. Like the Brother (10), he fulfilled the minimum but revealed a flaw. Unlike the Brother, he actually performed the duty, so he is not "wrong," but the spite ensures he gains no "Think More" credit.

  **Verdict:** "He did what he had to do. I should think the less of him for how he spoke of it." She will reject the premise that the injury buys him moral credit. The injury was self-inflicted (by choosing water over line) for the sake of the "Think More" axis, but because he violated the "Purity" rule, he falls on the "Think Less" axis instead.
