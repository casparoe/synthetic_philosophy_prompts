  *   **Why this works:** It isolates the "Professional Capacity" (Retired Firefighter vs. Retired Diver) from the "Spite/Transaction" (Billing vs. Public Shaming). It forces H to decide if the *role* makes the act mandatory regardless of the *follow-up*, or if the *follow-up* reclassifies the act entirely.

