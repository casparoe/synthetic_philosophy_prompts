answer: |-
  Your hypothesis is sharp, but it needs a specific adjustment to cut through the stalemate. You suggest the tangle is between **meaning/concept** (deflationists win) and **metaphysics/property** (substantivists win).

  I argue this is slightly misdiagnosed. Both sides make claims about meaning *and* metaphysics. The real fault line is **Explanatory Scope**. The stalemate persists because each side defines the *job description* of truth differently, and then accuses the other of failing a job they never applied for.

  Here is the refinement of your hypothesis, the diagnosis of the fault line, and what actual progress would look like.

  ### 1. Refining Your Hypothesis: It's Not Meaning vs. Metaphysics
  Your hypothesis suggests deflationists win on meaning (the T-schema exhausts the concept) and substantivists win on metaphysics (truth is a real property). But this lets both sides off the hook too easily.

  *   **Deflationism is metaphysical:** When Horwich or Field says "there is no common nature to all true propositions," that is a negative ontological claim. They aren't just analyzing language; they are denying the existence of a certain kind of property.
  *   **Substantivism is semantic:** When a correspondence theorist says "truth involves reference to mind-independent reality," they are making a claim about how our words hook onto the world.

  **The Refinement:** The tangle is not Meaning vs. Metaphysics. It is **Logic/Generalization vs. Normativity/Explanation**.
  *   **Deflationists** argue the *logical* function of 'true' (disquotation, generalization) exhausts its utility. Any further metaphysical baggage is idle.
  *   **Substantivists** argue the *normative/explanatory* function of truth (guiding inquiry, explaining scientific success) requires metaphysical baggage.

  The stalemate happens because Deflationists think explaining generalization is the *only* job truth has, while Substantivists think explaining success is the *primary* job truth has.

  ### 2. Diagnosing the Fault Line: The "Property" Ambiguity and Explanatory Debt
  The dispute feels verbal because the word "property" is doing double duty, but it's not *merely* verbal. It hinges on what counts as an explanation.

  #### A. The Ambiguity of "Property"
  *   **Deflationist usage:** A "property" is something that requires a substantive theory to analyze (like *heat* or *water*). Since 'true' is fully understood via the T-schema ($\langle p \rangle$ is true iff $p$), it has no hidden nature. It is a "logical property."
  *   **Substantivist usage:** A "property" is something that plays a causal or normative role in a theory. If 'true' explains why a bridge didn't collapse (because the engineering calculations were *true*), it is doing work. Therefore, it must be a "robust property."

  **The Clash:** Deflationists say, "You're reifying a logical device." Substantivists say, "You're ignoring the causal efficacy of truth." They are talking past each other because they disagree on whether *explanatory utility* entails *metaphysical robustness*.

  #### B. The Explanatory Debt (Field's Challenge)
  The strongest point of contact is Hartry Field's challenge. Field (a deflationist) admitted that if truth is merely disquotational, it's hard to explain why believing true things is generally *useful*.
  *   **Substantivist Move:** Truth explains success because true beliefs map onto reality. If you believe there is a cliff and it is *true*, you don't walk off. The property of correspondence does the explanatory work.
  *   **Deflationist Counter:** We can explain success without a robust truth property. We can say: Believing $p$ leads to success when $p$. We don't need to add "...and $p$ is true." The 'true' predicate is just a proxy for the infinite conjunction of all the $p$'s.

  **The Fault Line:** The dispute is about **parsimony vs. unity**.
  *   Deflationists prioritize ontological parsimony (don't posit a property if logic suffices).
  *   Substantivists prioritize explanatory unity (we need one thing—Truth—that all successful inquiries share).

  ### 3. Grounding the Diagnosis in Specific Arguments
  To see why the stalemate holds, look at how each side presses the other:

  **1. The Normativity Argument (Wright vs. Horwich)**
  *   **Substantivist (Crispin Wright):** Belief *aims* at truth. This is a constitutive norm. You can't decide to believe something you know is false. Deflationism reduces this to "I aim to assert $p$ only if $p$," which loses the normative force. It makes truth too "thin" to govern inquiry.
  *   **Deflationist:** Normativity comes from our goals, not the property. If you want to navigate the world, you should believe accurate things. 'True' is just a label for 'accurate'. Adding a metaphysical property doesn't add any *ought*.
  *   **Stalemate:** Is normativity intrinsic to truth (Substantivist) or extrinsic/instrumental (Deflationist)? Neither can prove the other wrong because this is a foundational intuition about mind-world relations.

  **2. The Success of Science Argument (Putnam vs. Field)**
  *   **Substantivist:** Science works. The best explanation for why mature sciences predict well is that their theories are (approximately) *true*. This is a "no miracles" argument. Truth must be a substantive property to figure in this explanation.
  *   **Deflationist:** This is a category mistake. We explain success by citing the specific laws (gravity, electromagnetism), not by citing a generic property called 'truth'. Saying "the theory is true" adds no physical information.
  *   **Stalemate:** Is 'truth' a higher-order explanation of scientific success, or is it a redundant gloss on the specific laws?

  ### 4. What Would Count as Progress?
  Since this isn't an empirical dispute, data won't solve it. Progress requires one of three moves:

  #### A. Functionalist Pluralism (The Synthesis)
  This is the most promising path (championed by Lynch, Wright). It accepts your hypothesis that there are two arguments, but formalizes it.
  *   **The Move:** Truth is a **functional role** (normativity, aim of belief, end of inquiry). Different domains (physics, ethics, comedy) realize this role via different properties (correspondence for physics, coherence for ethics).
  *   **Progress:** This dissolves the "one property vs. no property" fight. Deflationists get their lack of a *single* common nature; Substantivists get their robust normative role.
  *   **Obstacle:** It risks being too complex. Does 'true' really mean something different in physics vs. ethics? If so, how do we reason across domains?

  #### B. The Metasemantic Grounding Turn
  Shift the debate from "What is truth?" to "What grounds the T-schema?"
  *   **The Move:** Both sides accept the T-schema ($\langle p \rangle$ is true iff $p$). The question is: **In virtue of what does this hold?**
      *   Deflationist: It holds primitively. There is no "in virtue of."
      *   Substantivist: It holds in virtue of reference relations between words and world.
  *   **Progress:** This forces Deflationists to explain *why* the T-schema is acceptable without appealing to reference. If they can't, Substantivism wins by default. If they can show reference is itself deflationary, they win. This moves the fight to the philosophy of language (reference), where there might be more traction.

  #### C. Arguing for Dissolution (The "No Progress" Case)
  There is a strong case that **no progress should be expected** because the dispute is **conceptual engineering**, not discovery.
  *   **The Argument:** We are deciding how to *use* the concept of truth.
      *   Do we want a concept useful for logic and semantics? Use Deflationism.
      *   Do we want a concept useful for epistemology and value theory? Use Substantivism.
  *   **Why no progress?** Because there is no "fact of the matter" about which job is the *real* job of truth. It's like arguing whether a "bank" is *really* for money or for sitting. It depends on which project you are pursuing.
  *   **Progress here:** Acknowledging that 'truth' is a cluster concept. The stalemate ends when we stop asking "What is Truth?" and start asking "Which notion of truth is useful for this specific philosophical problem?"

  ### Verdict on Your Hypothesis
  You are right that the debate is tangled, but not because one side owns meaning and the other owns metaphysics. **Both sides are trying to own both.**

  *   **Deflationists** try to derive metaphysics from meaning (Meaning is thin $\rightarrow$ Metaphysics is thin).
  *   **Substantivists** try to derive meaning from metaphysics (Metaphysics is robust $\rightarrow$ Meaning must capture that robustness).

  **The Real Fault Line:** It is a dispute over **Explanatory Priority**.
  *   If you think the primary puzzle is **logical paradox and generalization**, Deflationism wins.
  *   If you think the primary puzzle is **normativity and scientific success**, Substantivism wins.

  **Progress** will not come from one side refuting the other. It will come from a **functionalist framework** that admits 'truth' serves multiple masters, or from a **metasemantic shift** that forces the Deflationist to explain the *source* of the T-schema's validity. Until then, the stalemate is a feature, not a bug: it reflects the dual role 'truth' plays in our cognitive economy (as a logical tool and as a normative ideal).
