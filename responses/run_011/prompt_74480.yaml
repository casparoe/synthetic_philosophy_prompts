answer: |-
  ### Instructor's Note on the Axes
  You asked me to run this along three axes and to tell you plainly if one does no real work. **Axis 1 (Persons/Dispositions) is the weak link.** In contemporary political epistemology, attributing bad faith to individual *vice* is increasingly viewed as a category error; what looks like a dishonest person is usually a rational actor within a distorted incentive structure (Axis 2) or a hearer unable to process signals due to environmental noise (Axis 3). I have retained Axis 1 in the tree only because it represents your students' *starting intuition*. The tree is designed to show them that holding onto the "Person" axis forces them into increasingly untenable positions compared to the "Role" or "Uptake" axes.

  ### The Decision Tree: The Bad Faith Judgment

  **Root:** You have judged that a political interlocutor is arguing in **Bad Faith**.

  ---

  #### Node 1: Locus of Distortion
  **Question:** Is the distortion caused primarily by the speaker's **character** (they choose to mislead) or their **context** (their role rewards misleading)?
  *   *Case:* The partisan who privately doubts the party line but repeats it to avoid social exile.
  *   *Epistemic Status:* **[Contested]** Folk psychology favors character; social science favors context (Situationism).
  *   *Branch A:* Character (Go to Node 2).
  *   *Branch B:* Context (Go to Node 3).

  ---

  #### Node 2: Awareness (Character Branch)
  **Question:** Does the speaker **know** they are misleading you, or do they believe their own claim?
  *   *Case:* The campaign strategist (knows) vs. The sincere believer who would abandon the claim if shown neutral counter-evidence (doesn't know).
  *   *Epistemic Status:* **[Contested]** Unconscious bias (Identity-Protective Cognition) is empirically settled; distinguishing it from conscious lying in real-time is not.
  *   *Branch A:* They Know (Go to Node 4).
  *   *Branch B:* They Don't Know (Go to Node 4).

  ---

  #### Node 3: Visibility (Context Branch)
  **Question:** Is the incentive structure driving the speech **transparent** to the audience, or is it **opaque**?
  *   *Case:* The cable pundit obliged to produce a daily take (transparent) vs. The researcher who knows the data have been selected to fit a grant requirement (opaque).
  *   *Epistemic Status:* **[Settled]** Incentives exist; **[Contested]** Whether audiences can perceive them accurately.
  *   *Branch A:* Transparent (Go to Node 4).
  *   *Branch B:* Opaque (Go to Node 4).

  ---

  #### Node 4: Principle Detectability (Uptake Axis I)
  **Question:** Even with perfect information, is sincerity **in principle distinguishable** from strategy?
  *   *Case:* The voter for whom sincerity and strategy have become observationally indistinguishable.
  *   *Epistemic Status:* **[Contested]** Philosophical skepticism vs. Signal Detection Theory.
  *   *Branch A:* Yes, distinguishable (Go to Node 5).
  *   *Branch B:* No, indistinguishable (Go to Node 6).

  ---

  #### Node 5: Environmental Detectability (Uptake Axis II)
  **Question:** Given your specific information environment, can **you** practically detect the difference?
  *   *Case:* A hearer formed inside a curated information environment.
  *   *Epistemic Status:* **[Settled]** Curation exists; **[Contested]** Degree of cognitive immunity.
  *   *Branch A:* Yes, I can detect it (Go to Leaf 1, 2, or 3).
  *   *Branch B:* No, I cannot detect it (Go to Leaf 4 or 5).

  ---

  #### Node 6: The Skeptic's Fork (Indistinguishability Branch)
  **Question:** If sincerity is undetectable, do you **suspend judgment** on all claims or **reject the system** producing them?
  *   *Case:* The radical skeptic vs. The structural reformer.
  *   *Epistemic Status:* **[Contested]** Normative political theory.
  *   *Branch A:* Suspend Judgment (Go to Leaf 6).
  *   *Branch B:* Reject System (Go to Leaf 7).

  *(Note: Nodes 2 and 3 merge into Node 4 to prevent leaf explosion. Node 5 only applies if Node 4 is "Yes".)*

  ---

  ### The Leaves: Commitments & Diagnoses

  **Leaf 1 (Character + Know + Detectable):** **Cynical Elitism**
  *   *Commitment:* You are committed to the view that democracy is a sham managed by conscious liars whom you can spot.
  *   *Status:* Occupied.

  **Leaf 2 (Character + Don't Know + Detectable):** **Identity-Protective Cognition**
  *   *Commitment:* You are committed to the view that reason is a servant of tribal loyalty, including your own.
  *   *Status:* Occupied (Kahan et al.).

  **Leaf 3 (Context + Transparent + Detectable):** **Institutional Realism**
  *   *Commitment:* You are committed to discounting claims based on the speaker's job description rather than their truth value.
  *   *Status:* Occupied.

  **Leaf 4 (Context + Opaque + Undetectable):** **Epistemic Corruption**
  *   *Commitment:* You are committed to the view that you cannot know if you are being manipulated, rendering knowledge impossible.
  *   *Status:* Occupied (Bardon, Lynch).

  **Leaf 5 (Character + Don't Know + Undetectable):** **Unnamed (Indistinguishable from Leaf 2)**
  *   *Diagnosis:* **Unexplored/Redundant.** From the inside, you cannot tell the difference between a self-deceived believer and a system you cannot read. Treating them as separate leaves is analytically false for the hearer.
  *   *Status:* Do not occupy.

  **Leaf 6 (Suspend Judgment):** **Radical Skepticism**
  *   *Commitment:* You are committed to political silence, as no claim can be verified as good faith.
  *   *Status:* Unattractive (Self-defeating for a seminar).

  **Leaf 7 (Reject System):** **Hermeneutical Injustice**
  *   *Commitment:* You are committed to the view that the vocabulary to describe the manipulation is missing from your environment.
  *   *Status:* Occupied (Fricker).

  **Leaf 8 (Context + Transparent + Undetectable):** **Unnamed (Incoherent)**
  *   *Diagnosis:* **Incoherent.** If the incentive is transparent (e.g., "I am paid to lie"), the strategy is by definition detectable. This leaf is logically empty.
  *   *Status:* Empty.

  ---

  ### Implementation Note for the Seminar
  When walking students through Node 1, press them on the **Partisan Doubter**. If the student says "They are lying," push Node 2. If they say "They are pressured," push Node 3.
  *   **Crucial Pivot:** At Node 4, remind them that if they choose "Indistinguishable," they have moved the problem from the *speaker* (Axis 1 & 2) to *themselves* (Axis 3). This is where the handout pays off: it forces them to admit that accusing others of bad faith might actually be an admission of their own epistemic vulnerability.
