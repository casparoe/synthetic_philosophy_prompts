answer: |-
  Your tentative principle is close, but it contains a hidden contradiction between your **Korea** verdict (which rules out geography) and your **Settler Mortality** verdict (which relies on geography as an instrument). You are applying a stricter causal standard to the "Natural Experiments" (Korea/Nogales) than to the "Econometric Evidence" (AJR regressions).

  Here is the refined principle that captures your actual heuristics, followed by the consequences.

  ### The Principle: Structural Exogeneity Standard

  A comparison supports an institutional explanation only if it satisfies three clauses:

  1.  **The Background Control Clause:** Geography, culture, and ancestral starting conditions must be effectively held constant.
      *   *Motivated by:* **North/South Korea.** You accept this because the peninsula, language, and 1945 baseline cancel out physical and cultural stories.
  2.  **The Impersonality Clause:** The divergent outcome must not depend on the specific agency of a single leader or a transient resource windfall. The rules must be systemic and durable beyond the individual.
      *   *Motivated by:* **Botswana/Zimbabwe.** You reject this because Khama and Mugabe are "Great Men," and diamonds are a windfall. If Khama dies, do the institutions survive? You suspect not.
  3.  **The Non-Endogeneity Clause:** The institutional advantage cannot be a byproduct of being attached to a wealthier polity (transfers) or a post-hoc relabeling of the outcome itself.
      *   *Motivated by:* **Nogales** (transfers from US federal system) and **Argentina** ("decay" is a label applied after the failure, not a pre-existing cause).

  ---

  ### Application to a New Case: Singapore vs. Malaysia (1965–Present)

  **The Comparison:** Singapore was expelled from Malaysia in 1965. Both share colonial history (British), geography (Malay Peninsula), and ethnic makeup (significant Chinese populations, though Singapore is majority Chinese).
  **The Verdict under your Principle:** **Inconclusive / Weak.**
  **Why:** While it passes the *Background Control Clause* (similar to Korea), it likely fails your *Impersonality Clause*. Singapore's trajectory is inextricably linked to Lee Kuan Yew. If your rejection of Botswana rests on Seretse Khama being "the guy who turned up," you must logically treat Lee Kuan Yew the same way. Unless you can demonstrate that Singapore's rule-of-law framework was codified deeply enough to survive his death (which is debatable, though it has held so far), your standard forces you to treat this as another "Great Man" outlier, not proof of institutions.

  ---

  ### The Forced Give-Up: Settler Mortality Regressions

  Your principle forces you to drop the verdict that **Settler Mortality regressions are "oddly persuasive."**

  **The Contradiction:**
  *   In **Korea**, you rule out geography because the physical environment is identical. You demand the *institutional split* be the cause.
  *   In **Settler Mortality**, you accept an instrument where the *geographic/disease environment* is the exogenous shock. You admit the exclusion restriction fails ("disease environment... is still there").
  *   **The Conflict:** If geography/disease is a valid confounder in Korea (which you implicitly reject by accepting the institutional story), it must be a valid confounder in the settler colonies. By accepting the regression despite the failed exclusion restriction, you are allowing geography to count as evidence for institutions in the cross-country data, while ruling it out in the natural experiments.

  **To be coherent:** You must either downgrade the Settler Mortality evidence to "suggestive but fundamentally flawed" (matching your Nogales skepticism) or admit that geography *does* matter in Korea (perhaps the North had more industrial infrastructure in 1945 than the South, a physical starting difference). Given your strong stance on Korea, you must downgrade the Regression.

  ---

  ### What Would Change My Mind About Dropping That Verdict?

  I would retain the Settler Mortality verdict if you could demonstrate **Mechanism Decoupling**.

  If you showed that settler mortality predicted *early* institutional setup (e.g., property rights in 1900) strongly, but that the *current* disease environment no longer correlates with income *once you control for those 1900 institutions*, the exclusion restriction violation becomes less fatal.

  Essentially: If the disease environment is still there, but it no longer hurts economic growth *except* through the channel of the institutions it created 200 years ago, then the instrument holds. If the disease environment *itself* still directly suppresses GDP (via worker health), then your skepticism is correct, and the regression is spurious. Evidence showing that modern malaria rates don't correlate with GDP *conditional on institutional quality* would rehabilitate the regression in your framework.

  ---

  ### Where My Reasoning Is Most Likely to Fail

  I am likely failing to account for **Bayesian Weighting**.

  Your "incoherence" might actually be a rational assignment of different prior probabilities to different methods.
  *   **Natural Experiments (Korea):** High internal validity, low external validity. You trust them because the counterfactual is clear, even if they are rare.
  *   **Regressions (Settler Mortality):** Low internal validity (failed exclusion), high external validity (covers many countries). You find them "persuasive" not because they are logically airtight, but because they show a global pattern that aligns with the Korea case.

  My reasoning fails if I treat your standard as a **Frequentist Logical Filter** (must pass all clauses equally) when you are actually using a **Bayesian Updating Machine**. In a Bayesian framework, it is rational to let a flawed regression nudge your confidence up, even if it doesn't meet the gold standard of a natural experiment.

  If I force you to drop the Settler Mortality verdict, I might be stripping you of a valuable "weak signal" that, when combined with the "strong signal" of Korea, creates a robust overall belief. Demanding logical consistency across different *types* of evidence might degrade your overall epistemic accuracy. You might be right to keep the "incoherent" mix.
