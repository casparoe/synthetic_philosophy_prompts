answer: |-
  BRAINSTORM
  1. A marriage counselor in a transparency state tries to hide an affair using logical paradoxes, but the Bureau infers the affair from the existence of the paradox itself.
  2. An archivist attempts to preserve a history book by encoding it in self-negating statements, only to find the book becomes unreadable to everyone, including those it was meant to save.
  3. A "privacy contractor" tries to hide a mother's identity from a state that knows all truths, discovering only unstable logical loops work, forcing a choice between truth and safety.
  Selection: Option 3, because it isolates the specific stakes (a child) and allows the protagonist to test the limits of the knowability principle against a tangible human cost.

  ***

  The Verification Bureau does not knock. It simply updates.

  In the café, a man knocks over his latte. The brown spill spreads across the white table. Before the droplet hits the edge, the man's wrist comp vibrates. A notification: *Incident 8940 logged. Clean-up crew en route. Truth verified.*

  Elias watches from the corner booth. He doesn't drink his coffee. He watches the man wipe the table, knowing the Bureau already knows the shape of the stain, the viscosity of the milk, the exact second the gravity took hold. There are no secrets here. If it happened, it is known. If it is true, it is recorded.

  Elias is a Sanitizer. Or he was. His business card says *Data Hygiene*, but everyone knows what it means. He sells shadows in a room with no lights.

  Mara sits across from him. She is shaking. Her hands are wrapped around a mug she isn't drinking from.

  "They flagged Toby," she says.

  Elias nods. He knows. His own comp vibrated ten minutes ago. *Client Status: Compromised.*

  "They say the probability of biological linkage is ninety-nine percent," Mara says. "They say because I hesitated at the checkpoint, the system inferred guilt. They say inference is knowledge."

  "Inference isn't knowledge," Elias says. "But close enough for them."

  "They're coming for him, Elias. Reassignment. Tomorrow."

  Elias opens his briefcase. Inside is a stack of drives, old paper, encryption keys. Useless. The Bureau's Omni-Scan doesn't just read data; it reads reality. If a fact exists, the Scan finds it. You cannot hide a rock by putting it in a box; the box becomes part of the fact.

  "I can encrypt it," Elias says. He hears how hollow it sounds.

  "You encrypted the bank records last week," Mara says. "They knew the balance before you finished typing the password."

  "I can try the loop."

  Mara looks up. "The what?"

  "A logical lock. Self-referential." Elias pulls out a fresh drive. He plugs it into his terminal. The screen glows blue. "I write a statement on the drive that refers to its own knowability. Something like: *'The information on this drive is unknown.'*"

  "That's a lie," Mara says. "You know what's on it."

  "No. I write the maternity record onto the drive, but I wrap it in the statement. If the Bureau scans it, they know the content. If they know the content, the statement *'The information is unknown'* becomes false. If the statement is false, the file corrupts. If the file corrupts, they don't have the record."

  Mara stares at him. "So the truth disappears if they look at it."

  "Exactly. It's a truth that only exists while it's hidden."

  "That's not a secret," Mara says. "That's a trick."

  "It's all I have."

  Elias types. His fingers hover over the enter key. He creates the file. *Mara_Vance_Maternity.dat*. He wraps it in the conditional script. *IF KNOWN THEN DELETE.*

  He slides the drive across the table. "Put this in your home hub. When they scan, the file will vanish. They'll see a glitch, not a record. A glitch isn't a truth. It's noise."

  Mara takes the drive. "Will Toby stay?"

  "As long as the file is a paradox, yes."

  She leaves. Elias watches her go through the window. He waits.

  Ten minutes later, his terminal flashes red. *Contract Breach.*

  He knows before the call comes. The trick worked for a second. The Bureau's scanner hit the file, recognized the paradox, and paused. In that pause, the truth was unknowable. But the Bureau doesn't need to know the specific truth to know the *location* of the truth.

  They know Mara is hiding something. In a world where all truths are known, hiding something is itself a truth. *Mara is hiding.* That is a fact. That fact is known. Therefore, Mara is guilty.

  The call comes. It's not a voice. It's a text. *Subject Toby Vance. Reassignment authorized. Reason: Concealment of Verified Fact.*

  Elias stands up. He grabs his coat. He knows where they are taking the boy. The Processing Center on 4th.

  He drives. He doesn't speed; the cars won't let him. The traffic lights know he is late and turn red anyway. Truth is orderly.

  He arrives at the center. Mara is standing at the gate. She is alone. She is holding the drive.

  "They took him," she says. Her voice is flat.

  "The loop didn't hold."

  "They didn't even read it," Mara says. "They saw the file size. They saw the encryption header. They knew something was there. They said the presence of the lock proves the existence of the secret. They said the secret is known because the lock is known."

  Elias looks at the drive in her hand. It is small, black, insignificant. Inside is the truth. *Mara is Toby's mother.*

  If he takes the drive and smashes it, the truth remains. She is still his mother. But the record will be gone. The Bureau will never know it. It will become an unknowable truth.

  If he hands the drive over, the Bureau knows. The principle holds. All truths are known. But Toby is gone. The system accepts known truths. It punishes concealment. If the truth is known voluntarily, the penalty is less. Maybe Toby stays. Maybe.

  "It was a trick," Mara says. "You said it would work."

  "It works logically," Elias says. "It doesn't work bureaucratically."

  "So what do we do?"

  Elias looks at the drive. He looks at the gate. The guards are watching. They are waiting. They know he is there. They know he has the drive. They know he is deciding.

  If he destroys it, he proves his friend right in the argument from last night—the one he can't stop remembering. *Anyone who insists there are permanently unknowable truths is just trying to protect a mystery they're not entitled to.*

  If he destroys it, he makes himself entitled to that mystery. He creates a truth the world cannot have.

  If he hands it over, he admits the world is right. There are no secrets. Only things known and things false.

  Mara reaches for the drive. "Give it to them. Maybe if they know, they'll let me keep him. Maybe the penalty is only for hiding."

  "If you give it to them, you admit you hid it," Elias says.

  "I did hide it."

  "Then you're guilty either way."

  Elias closes his hand around the drive. It is sharp-edged. Metal and plastic.

  "If I break this," Elias says, "they will never know. It will be true, and they will never know it."

  "Then Toby is lost anyway."

  "Maybe," Elias says. "But the lie stays dead."

  "Elias."

  He looks at the guards. They are stepping forward. They know what he is holding. They know what he is thinking. In this world, intention is data.

  He looks at Mara. She is crying now. Silent tears. She wants him to choose the principle. She wants him to choose the world where things make sense, where truth is light and shadows are errors.

  Elias thinks about the coffee spill. The man wiping the table. The truth verified before the stain dried.

  He thinks about Toby.

  Elias drops the drive to the pavement. He brings his heel down. Once. Twice. The plastic cracks. The silicon snaps.

  The guards stop. They look at the debris. They look at their scanners. The scanners show nothing. *No data found.*

  "You destroyed evidence," the lead guard says. "That is a crime."

  "It's not evidence if it doesn't exist," Elias says.

  "It existed," the guard says. "We know it existed."

  "You know I held something," Elias says. "You don't know what it was. You never will."

  "That's impossible," the guard says. "If it was true, we would know."

  "It was true," Elias says. "Now you don't."

  The guard raises his rifle. Mara screams.

  Elias stands still. He feels the weight of the broken plastic under his shoe. He has created a hole in the world. A truth that is real and forever dark. It is not a trick. It is a wound.

  The guard steps forward. He doesn't shoot. He looks at the scanner again. The needle is stuck at zero.

  "Pick up the pieces," the guard says.

  "There's nothing to pick up," Elias says.

  The guard looks at Mara. He looks at Elias. He knows they are lying. But he cannot know the lie.

  "Get in the car," the guard says. "Both of you."

  "For what?"

  "For processing," the guard says. "If we can't know the truth, we have to detain the source."

  Mara grabs Elias's arm. "You didn't save him."

  "I saved the truth," Elias says.

  "They don't want the truth," Mara says. "They want the record."

  Elias lets her lead him to the car. He looks back at the pavement. The shards of the drive glitter in the streetlight. They are just plastic now. The information is gone. The fact remains. *Mara is Toby's mother.*

  The Bureau will never know it.

  Elias sits in the back seat. The door locks. The engine starts. He closes his eyes. He has proved his friend wrong. There are unknowable truths.

  He has proved his friend right. They are worthless.
