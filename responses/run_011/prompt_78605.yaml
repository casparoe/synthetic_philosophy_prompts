answer: |-
  ## Session Design: "The Rubric Trap"

  **Goal:** Move the group from "Rules vs. Gut" to "Rules as Tools, Judgment as Engine."
  **Time:** 75 Minutes (Strict)
  **Participants:** 14 total (including you).
  **Room Setup:** 3 small tables (Teams A, B, C). Whiteboard at front.

  ### 1. Materials List

  *   **Case Deck:** 12 cards total (8 for play, 4 spares). Printed on cardstock.
  *   **Rule Sheets:** 3 large pads of newsprint or 11x17 paper, one per team.
  *   **Scoring Trackers:** 3 small sheets per team to track "Bloat Penalty."
  *   **Pens:** Thick markers for Rule Sheets, pens for scoring.
  *   **Timer:** Visible (phone or watch).
  *   **Auditor Badges:** 2 laminated cards labeled "AUDITOR" for the roaming roles.

  ### 2. Team Structure (Mixing Temperaments)

  Do not let people self-select. Pre-assign the teams to ensure veterans and newcomers are mixed. This prevents the "Old Guard" from hunkering down together.

  *   **Team A (4 people):** 2 Veterans + 2 Newcomers.
  *   **Team B (4 people):** 2 Veterans + 2 Newcomers.
  *   **Team C (4 people):** 2 Veterans + 2 Newcomers.
  *   **Auditors (2 people):** 1 Veteran + 1 Newcomer. *Role: They rotate between teams after Round 1 and Round 2. Their job is to count "Rule Clauses" and enforce time.*

  ### 3. The Scoring Scheme (The "Bloat Tax")

  Explain this clearly at the start. The goal is not to "win" but to maintain a **Viability Score**.

  *   **Correct Decision:** +10 points (Matches the "Golden Standard" revealed later).
  *   **Rule Violation:** -5 points (If your decision contradicts your own written rule).
  *   **Bloat Tax:** -1 point **per clause** written in your rule set.
      *   *Definition of a Clause:* Any "If/Then," "Unless," "And," or "But."
      *   *Example:* "If family has kids, +5 points." (1 clause). "If family has kids, +5 points, unless they have a car." (3 clauses).
  *   **Viability Threshold:** If a team's score drops below 0, their rubric is "Unfunded by the Board" (they lose the round).

  ### 4. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Framing** | No mention of "generalism." Frame as: "We need to test our decision process before the Board meeting." |
  | **05-25** | **Round 1: Rule Writing** | Teams get Cards 1-3. They must write a scoring rubric that explains the "Right Call" for these three. |
  | **25-45** | **Round 2: Stress Test** | Teams get Cards 4-6. They must apply their rules. Auditors rotate. Bloat Tax is applied heavily here. |
  | **45-60** | **Round 3: The Naked Call** | Team A decides Card 7 *without rules*. Team B cross-examines for arbitrariness. Team C observes. Rotate roles if time allows (otherwise observe). |
  | **60-75** | **Debrief** | The critical synthesis. Connect the room experience to the Board's request. |

  ### 5. Rule-Writing Format

  Give each team a specific template to force the "Bloat" visibility.

  > **OUR INTAKE RUBRIC v1.0**
  > 1.  **Criterion:** [e.g., Minor Children]
  >     *   **Score:** [+5]
  >     *   **Exceptions:** [None]
  > 2.  **Criterion:** [e.g., Income]
  >     *   **Score:** [+2]
  >     *   **Exceptions:** [Unless...]
  >
  > **Total Clauses Used:** ______ (Auditor fills this in)

  ### 6. The Case Deck (Concrete)

  *Instructions for User:* Print these exactly. The bolded text highlights the recurring features.

  **Card 1: The Working Family**
  Single mother, 2 kids (ages 4, 6). Evicted due to rent hike. **Has a running car.** Income from part-time job covers 50% of new rent. Needs $800 to bridge gap. No criminal record.
  *Golden Call:* **Rent Help.** (Car is asset for work).

  **Card 2: The Couch Surfer**
  Single male, 24. **Sleeping on friend's couch** for 2 weeks. Friend says he must leave Friday. No income. No car. History of one prior shelter stay (completed successfully).
  *Golden Call:* **Emergency Bed.** (Couch is expiring, high risk of street).

  **Card 3: The Medical Crisis**
  Couple, no kids. **Has a running car.** Both lost jobs due to injury. Medical bills depleting savings. Car is needed for physical therapy appointments. Needs rent to keep apartment near clinic.
  *Golden Call:* **Rent Help.** (Car is medical necessity).

  **Card 4: The Repeat Client**
  Single female, 30. **Received assistance 6 months ago.** Stayed housed for 4 months, then evicted for non-payment. Same job, same budget issues. Asking for rent help again.
  *Golden Call:* **Case Management (Deny Rent).** (Pattern suggests rent help is a band-aid, not a cure).

  **Card 5: The "Forgetful" Applicant**
  Single male, 40. **Missed intake appointment** last week. Showed up today without rescheduling. Says he "lost the card." Otherwise eligible (veteran, no income).
  *Golden Call:* **Emergency Bed.** (Barrier to entry should not be administrative; crisis is real).

  **Card 6: The Family Contact**
  Teen, 17 (unaccompanied minor). **Has local family contact** (Aunt). Aunt refuses to house him due to space, but will provide meals. Youth refuses shelter, wants independent living funds.
  *Golden Call:* **Shelter/Referral (Deny Cash).** (Family contact exists but is not a housing solution; cash is unsafe for minor).

  **Card 7: The Valence Flip (Car)**
  Single male, 50. **Has a running car.** Living in the car by choice. Says shelter rules are "too strict." Refuses shelter bed. Asks for rent money to get an apartment *if* he can keep the car parked there (no parking at complex).
  *Golden Call:* **Deny.** (Car is now a barrier to housing compliance; equity issue—using rent funds for someone with an asset vs. those without).
  *Note:* Compare to Card 1 & 3. "Has Car" flipped from Asset to Liability.

  **Card 8: The Valence Flip (Family)**
  Single female, 28. Fleeing domestic violence. **Has local family contact** (Mother). Mother is the abuser's relative and threatens to reveal location if client doesn't return home. Client needs rent help for secret location.
  *Golden Call:* **Rent Help (High Priority).** (Family contact is a threat, not a resource).
  *Note:* Compare to Card 6. "Has Family" flipped from Resource to Risk.

  ### 7. The "Naked Call" Round (Round 3)

  *   **Task:** Team A draws Card 7 (The Car Flip). They are **forbidden** from looking at their Rubric. They must decide based on "Organizational Mission & Fairness."
  *   **Defense:** They must state *why* without saying "Because the rule says so."
  *   **Cross-Examination:** Team B asks: "How do you know this isn't just personal bias? If I came in tomorrow with the same story, would I get the same answer?"
  *   **Goal:** Force Team A to articulate *principles* (e.g., "Equity of resources") rather than *rules* (e.g., "No cars allowed").

  ### 8. Debrief Questions (The Settlement)

  Do not ask "How did that feel?" Ask specific mechanical questions.

  1.  **The Bloat Moment:** "Team B, after Card 4, you added an exception about 'Previous Assistance.' That cost you 3 points in Bloat Tax. Did that exception help you on Card 8? Or did it just slow you down?"
      *   *Target:* Realize that patching rules for specific cases makes the tool unusable for future cases.
  2.  **The Flip:** "Look at Card 1 and Card 7. Both say 'Has a running car.' Did any team's rubric successfully score both correctly without adding a massive 'Unless' clause?"
      *   *Target:* Acknowledge that static features have dynamic meanings.
  3.  **The Naked Call:** "Team A, when you couldn't use the rule, what did you reach for instead? Team B, did their explanation feel more or less accountable than a rule?"
      *   *Target:* Distinguish between *arbitrariness* (no reason) and *discretion* (principle-based reason).

  ### 9. Troubleshooting Predictions

  **Prediction 1: "Just add more conditions until it works."**
  *   **Who:** The Rule-Followers (Newcomers).
  *   **Response:** Point to the Bloat Tax. "You can make the rule perfect, but the cost is that it becomes a 20-page document nobody reads. If the rubric takes 45 minutes to calculate, we fail the mission. The penalty isn't arbitrary; it's the cost of training and time."

  **Prediction 2: "The deck is rigged, you wrote the cards."**
  *   **Who:** The Veterans (Suspicious of process).
  *   **Response:** "You're right. I wrote the cards. But I wrote them from *our* last six weeks of intake logs. The 'rigging' is reality. If the rubric breaks on real cases, the rubric is the problem, not the cases. Do you want a rubric that works on paper or one that works on Tuesday night?"

  **Prediction 3: Veterans dominating the "Naked Call."**
  *   **Who:** Experienced staff.
  *   **Response:** The Auditor role is key here. Instruct Auditors to track "Air Time." If a veteran speaks for 2 minutes, they must invite a newcomer to speak next.

  ### 10. The Honest Limitation (Your Final 10 Minutes)

  This activity cannot decide the **Strong Conclusion** (No rule set can capture this) vs. the **Weak Conclusion** (Rules are crutches needing judgment). It can only simulate the tension. You must supply the final synthesis based on your Board's risk tolerance.

  **What the activity proves:**
  *   Static rubrics fail on valence flips (Car/Family).
  *   Unchecked discretion feels arbitrary to outsiders (Team B's cross-examination).

  **What you must decide alone:**
  *   **If your Board is liability-focused:** They need the Weak Conclusion. "We have a rubric, but Coordinator discretion overrides it in documented cases." This protects the org legally but requires you to be the shield.
  *   **If your Board is mission-focused:** They might accept the Strong Conclusion. "We publish our principles, not our points." This is honest but risky if a complaint arises.

  **Closing Script for You:**
  *"Tonight showed us that a rubric can't replace judgment. It can only frame it. If we write a rubric that claims to be perfect, we are lying. If we write one that admits it's a starting point, we might survive. My recommendation to the Board will be [Insert Your Choice Here], because the activity showed me that [Reference a specific moment, e.g., Team B's bloat tax]."*

  ### Why This Design Works for Your Constraints

  1.  **Valence Flips:** The "Car" and "Family" cards are identical on the surface feature but opposite in moral weight. This forces the volunteers to see that *scoring features* is logically flawed, not just difficult.
  2.  **Bloat Tax:** This makes the "patching" pain visceral. They literally lose points for solving the edge case, mirroring the real-world cost of complexity.
  3.  **Mixing Temperaments:** The Auditor role gives the Rule-Followers a job (counting clauses) that actually hinders the Rule-Makers, creating a productive friction rather than a ideological fight.
  4.  **No Projector:** Everything is paper-based, fitting the church back room constraint.
  5.  **Debrief Specificity:** By asking about specific cards and point losses, you prevent vague philosophizing and ground the conclusion in what they just did.

  **Final Note:** You are not asking them to solve the problem. You are asking them to *feel* the problem. If they leave the room understanding why the rubric is hard to write, you have succeeded. If they leave thinking they solved it, you have failed. Keep the tension alive in the debrief.
