answer: |-
  ### 1. The Exam Question

  **Question 3**

  **The 'Rehabilitation Credit' Pilot**

  Consider a proposed pilot scheme in three English prisons, termed the 'Rehabilitation Credit'. Under this scheme, prisoners serving sentences of four years or more are offered the opportunity to undertake a twelve-month programme. This programme combines cognitive-behavioural work with therapy aimed at impulse regulation and attitudes towards victims.

  The scheme has two defining features:
  1.  **Incentive and Consequence:** Participation is formally optional. However, successful completion allows for a remission of up to one-third of the tariff. Conversely, while declining the programme incurs no formal penalty, the Parole Board is instructed to treat a prisoner's declinature as relevant evidence of unresolved risk. Thus, declining does not leave the prisoner's release date unchanged; it makes satisfying the conditions for release significantly harder.
  2.  **Object of Assessment:** Remission is not granted for good behaviour or educational attainment. It is granted only upon a psychologist's certification that the prisoner's *dispositions* and *character* have demonstrably changed.

  Proponents argue this reduces reoffending by incentivising moral reform. Critics point to jurisdictions such as Halden in Norway, where reoffending rates are low despite the absence of sentence discounts for character change. In the Norwegian model, sentences are fixed, and the focus is on making prison conditions resemble life outside rather than purchasing internal reform with time off.

  **Question:**
  Is the 'Rehabilitation Credit' scheme morally permissible? In your answer, you must address whether the scheme's formal voluntariness protects it from charges of coercion, and whether it is legitimate for the state to reward changes in character rather than conduct. Use the contrast with the Norwegian approach to test your conclusion.

  *(Answer time: 45 minutes)*

  ***

  ### 2. Model Answer

  The 'Rehabilitation Credit' pilot presents a conflict between utilitarian crime reduction and deontological constraints on autonomy and desert. While the scheme aims to lower reoffending, it is morally impermissible because it conflates risk management with moral reform and imposes a coercive burden on the prisoner's inner life that the formal label of 'voluntariness' cannot disguise. The contrast with the Norwegian model highlights that effective rehabilitation need not rely on the commodification of character.

  The first critical issue is coercion. Proponents rely on the claim that participation is optional. However, in the philosophy of punishment, voluntariness is determined by the baseline against which offers and threats are measured. Here, the baseline is ambiguous. If the baseline is the statutory tariff, the offer of remission looks like a bonus. But the second feature of the scheme alters this: declining the programme is treated as evidence of risk, making parole harder to reach. This creates a 'penalty default'. A prisoner who refuses therapy is not merely foregoing a benefit; they are actively signalling dangerousness to the Parole Board. Given that liberty is the primary good at stake, the pressure to comply is overwhelming. To call this voluntary is to ignore the asymmetry of power inherent in imprisonment. The Norwegian model avoids this by keeping sentences fixed; liberty is not bargained for using internal states as currency. If the Norwegian system achieves low reoffending without this leverage, the English pilot's coercive pressure is not a necessary evil of rehabilitation, but a specific choice to prioritise control over autonomy.

  Secondly, the scheme targets character rather than conduct. Liberal theories of punishment generally hold that the state may regulate actions that harm others, but it lacks the authority to judge or mould the inner moral life of citizens. Conduct is observable and actionable; character is opaque and intrinsic. By granting remission only for documented changes in disposition, the state is effectively purchasing moral compliance. This reduces moral reform to a transaction: the prisoner performs 'betterness' to buy time off. This risks cultivating hypocrisy rather than virtue, as the prisoner is incentivised to mimic the dispositions the psychologists want to see rather than genuinely undergoing reform. Furthermore, it violates the principle of desert. A prisoner serves a tariff based on the gravity of the offence and culpability at the time of sentencing. To shorten that tariff based on subsequent psychological assessment implies the original sentence was unjustly harsh, or that justice is flexible based on therapeutic progress. Neither is satisfactory. The Norwegian approach respects the sentence as a fixed debt to society, focusing instead on ensuring the environment does not corrode the prisoner's capacity to live lawfully upon release.

  Critics might argue that if the outcome is fewer victims, the means are justified. If the pilot collapses reoffending rates, does the coercion matter? This relies on the empirical claim that incentivised character change works better than environmental normalisation. However, the prompt notes that Halden achieves low reoffending without this mechanism. This suggests that structural conditions (normalisation, dignity) may be more effective than incentivised therapy. Therefore, the utilitarian justification is weak. We are accepting a moral cost (coercion into inner reform) without a proven unique benefit.

  Moreover, treating declinature as evidence of risk conflates therapeutic refusal with dangerousness. A prisoner may refuse therapy for many reasons: distrust of psychologists, cultural barriers, or a belief that they are not disordered. To interpret this refusal as proof of unresolved risk presumes that the state's diagnostic framework is infallible and that moral insight is only achievable through state-approved channels. This grants the prison administration excessive epistemic authority over the prisoner's moral status.

  In conclusion, the 'Rehabilitation Credit' is impermissible. It fails the test of voluntariness because the consequences of refusal constitute a indirect penalty on liberty. It fails the test of legitimacy because it claims authority over the prisoner's character rather than their conduct. The Norwegian counterfactual demonstrates that rehabilitation does not require the trading of sentence length for psychological compliance. A just system should aim to make prisoners safe to release through humane conditions and fixed sentences, rather than making release contingent on the successful performance of moral reform.

  *(Approx. 890 words)*

  ***

  ### 3. Marking Scheme (25 Marks)

  **Assessment Criteria**

  1.  **Analysis of Coercion and Voluntariness (5 marks)**
      *   *Required:* Identifies that 'voluntary' is contested when refusal impacts parole eligibility. Discusses the baseline problem (is it an offer or a threat?).
      *   *Common Botch:* Accepting 'formally optional' as decisive. Fails to note that making release harder is a penalty in all but name.

  2.  **Character vs. Conduct Distinction (5 marks)**
      *   *Required:* Argues whether the state has jurisdiction over inner dispositions. Addresses the risk of performative compliance (mimicking change vs. actual change).
      *   *Common Botch:* Treats 'character change' as obviously good without questioning state authority to assess it. Confuses behavioural compliance with internal reform.

  3.  **Engagement with the Norwegian Contrast (5 marks)**
      *   *Required:* Uses the Norwegian model not just as a statistic, but as a philosophical counterfactual (i.e., if they do it without coercion, why do we need coercion?).
      *   *Common Botch:* Uses Norway only to say 'their stats are better'. Treats Norway as evidence of outcome rather than a different model of justification.

  4.  **Distinction Between Risk and Desert (5 marks)**
      *   *Required:* Separates the logic of risk management (parole safety) from retributive justice (serving the tariff). Notes the tension in altering tariffs based on therapy.
      *   *Common Botch:* Assumes tariff remission is purely administrative. Fails to see that changing the sentence based on therapy undermines the original sentencing logic.

  5.  **Clear Normative Position (5 marks)**
      *   *Required:* Takes a definite stance (permissible or impermissible) and maintains it throughout.
      *   *Common Botch:* Sits on the fence ('there are good points on both sides') without resolving the tension.

  **Active Mark Deductions**

  *   **The 'Travelogue' Penalty (-5 marks):** If the answer devolves into general facts about Halden Prison (architecture, guards eating with prisoners) not derived from the question text.
  *   **The 'Voluntariness' Fallacy (-3 marks):** Treating the statement "participation is entirely optional" as settling the coercion question without philosophical analysis.
  *   **The 'Stats vs. Morals' Slide (-3 marks):** Arguing that because reoffending numbers are lower elsewhere, the scheme is morally better (deriving 'ought' from 'is').
  *   **The 'Norway = Rehabilitation' Assumption (-2 marks):** Assuming the Norwegian model aims at rehabilitation in the same way (incentivised change) rather than normalisation.

  ***

  ### 4. Marker's Note

  **Handling the 'Norway Travelogue' Essay**

  If you encounter an essay that is well-written and structured but ignores the specific mechanics of the 'Rehabilitation Credit' pilot (the parole penalty, the character assessment) in favour of a general comparison between UK and Norwegian prison systems, this is a **2:1 capped (max 15/25)**. This is not a fail because the student demonstrates knowledge of the module, but it cannot score higher because it fails to answer the question set. It answers the *old* exam question, not the new one. To distinguish this from a muddled attempt that *tries* to engage with the pilot: look for specific references to the 'Rehabilitation Credit' features. If the pilot is mentioned only in the intro and then dropped for general policy discussion, it is the travelogue. If the pilot is the engine of the argument but the philosophy is weak, it is a genuine attempt and should be marked on merit.
