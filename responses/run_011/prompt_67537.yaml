answer: |-
  The river divided the port not by water, but by stone. On the west bank, the cobblestones were grey and uniform, laid under the eye of the Charter Steward. On the east, they were irregular, patched with brick and dirt, belonging to the Merchant House. Between them stood the Boundary Stone, worn smooth by the hands of carriers who crossed daily with goods that belonged to both sides and neither.

  Joren lived on the west. Lissa lived on the east. They met at the Stone on the last day of the year, the air thick with river mist and the smell of curing fish. Between them lay a black ledger, bound in oilcloth to keep out the damp.

  "Open it," Joren said. His breath plumed white. He wore the grey wool of the Steward's clerks, stiff and clean.

  Lissa wore the deep blue of the House scholars, softer, stained with ink and clay from the school pots. She opened the book. The pages were filled with two columns of marks, one for each of them, kept over the turning of the seasons.

  "Read yours," she said.

  Joren ran a finger down the left column. "First month: Levy on grain storage, Section 4. Second month: Inspection of dock scales. Third month: Prohibition on night fires due to wind. Fourth month: Revision of toll rates, published per calendar..." He went on. His voice was flat. Every entry was a citation, a reference to a rule printed a year prior. He knew them before they happened. He knew the tax before the grain was stored, the inspection before the scales were weighed.

  "Mine," Lissa said. She didn't read citations. She read events. "First month: Remission of storage fee, granted by Factor's hand. Second month: Request to inspect scales for House safety. Third month: Advisory against night fires, given by wardens. Fourth month: Adjustment of tolls, at Factor's discretion..."

  They continued until the mist lifted and the sun struck the water. When they finished, the silence was heavier than the river traffic.

  "Forty-two," Joren said.

  "Forty-two," Lissa echoed.

  They had counted every touch of authority. Every time a rule bound them, every time a hand checked their goods, every time a fee was taken or waived. The numbers were identical.

  "It proves nothing," Joren said, closing the book. "You had forty-two interferences. I had forty-two. The weight is the same."

  "The weight?" Lissa laughed, a sharp sound. "Joren, look at the ink. Yours is printed. Mine is handwritten. Yours came because the calendar said so. Mine came because someone looked at me and decided."

  "Decided to let me breathe," Joren countered. "My rules are known. I walked into the year knowing every stop, every cost. I could plan. When the wind blew in the third month, I didn't burn fires because the paper said no. I didn't have to wonder if the warden liked me."

  "And when the wind blew," Lissa said, stepping closer, "my warden came to me. He said, 'Lissa, the wood is dry, best not light a flame.' He didn't show me a paper. He showed me concern. If I had needed to burn, if I had been cold... I could have asked."

  "Could you have?" Joren's eyes were hard. "If the Factor said no?"

  "The Factor doesn't say no."

  "The Factor says nothing. That is the trouble." Joren kicked at the Boundary Stone. "Last month. My sister fell ill. The fever ward is full. The Steward's rules say admission is by queue. I knew this. I accepted it. She died in the hall because the calendar did not allow for an exception. The rule binds the Steward too. He could not move her up. He was bound by the same paper that bound me."

  Lissa looked down at the ledger. "The House has beds."

  "For your ward."

  "For anyone the Factor chooses."

  "There it is," Joren said. "The choice. I am bound by the rule, yes. But the rule is blind. It does not look at me and decide I am worth less. Your Factor looks. He chooses who gets the bed. He chooses who pays the half-fee. You live in his hand."

  "And you live in his machine," Lissa snapped. "You say the rule binds him. But who binds the rule? No one. You cannot dismiss the Steward. You cannot ask for a new calendar. When the famine came, they built this machine to stop the hunger. It stopped the hunger. Now it stops everything. You cannot ask it to change for your sister."

  "I don't have to ask," Joren said. "I know. That is the peace of it. I know the wall is there. I don't walk into it."

  "You walk into it every day," Lissa said. "You just call it a floor."

  She opened the book again, to the last page. "Look at the last entry. Yours: 'Inspection of personal effects, random selection.' Mine: 'Gift of winter cloak, House surplus.'"

  "A search," Joren said. "A taking of privacy."

  "A gift," Lissa said. "A giving of warmth."

  "Both are marks," Joren said. "Both say you belong to someone. The Steward owns my time. The Factor owns your gratitude."

  "Gratitude is lighter than iron," Lissa said.

  "Gratitude is a debt," Joren replied. "Iron is just weight. I can put down the weight when the shift ends. Can you put down the debt? When the Factor gives you the cloak, do you sleep easy? Or do you wonder what he will ask when the river freezes?"

  Lissa tightened her grip on the ledger. She thought of the school. It was warm, bright, filled with books the west bank never saw. But when the Factor visited, the masters bowed so low their foreheads touched the dust. The children were taught to sing his name. She had never been told to sing. She had never been told not to. But she knew, when she walked the east bank, that the ground was not hers. It was lent.

  On the west bank, the ground was cold, but it was stone. It did not care if she walked on it. It did not love her, but it did not expect her love in return.

  "We should burn it," Lissa said suddenly.

  "The tally?"

  "The book. It lies. It says we are equal. Forty-two to forty-two. But you are safe, and I am kept."

  "And you are fed, and I am starved," Joren said. "When the flood comes, the Steward will open the gates because the ordinance says so. The Factor might close them to save his warehouses. He has the power. He has not used it. Yet."

  "He built the school," Lissa whispered.

  "He built a cage with windows," Joren said.

  "And you built a cage with bars," she shot back. "At least in my cage, the keeper brings me meat. In yours, the feeder is a clock."

  Joren looked at the river. A barge was crossing from east to west. The man on the bow paid the Steward's toll without looking. He knew the cost. He knew the time. On the east bank, a group of children ran toward the schoolhouse, laughing. They wore the blue cloaks.

  "What do you want me to say?" Joren asked. "That I wish I was you?"

  "I want you to say that the number doesn't matter," Lissa said. "That how the hand touches you matters."

  "It does matter," Joren said. "But the hand is not the only thing. There is the arm behind it. My arm is dead iron. It cannot strike me, but it cannot hold me. Your arm is flesh. It can hold me, but it can strike me."

  "And neither arm can be cut off," Lissa said.

  They both knew it. The Steward could not be fired. The Charter was sealed in the stone of the archive. The Factor could not be removed. The House ownership was deed-bound. They were stuck with the masters they had.

  Joren reached out and took the book. He held it over the water. The current below was swift, dark, and indifferent. It would swallow the ink and the paper and the count of forty-two.

  "If I drop it," Joren said, "the year is gone. The count is lost."

  "If you drop it," Lissa said, "we start again next year. And the count will be the same."

  "Maybe not."

  "Maybe."

  Joren held the book over the edge. His knuckles were white. He looked at the west bank, where the lamps were lighting in strict rows. He looked at the east, where the lights flickered warm and irregular. He thought of his sister in the hall. He thought of Lissa in the blue cloak.

  He did not drop the book. He tucked it under his arm.

  "Next year," Joren said.

  "Next year," Lissa said.

  They turned away from the Stone, walking back to their respective banks. The river flowed between them, carrying the refuse of the port out to the sea, washing the stone clean, waiting for the next mark to be made.
