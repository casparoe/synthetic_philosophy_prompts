  Actually, the prompt says the Factor "has issued no order in living memory." This suggests a lack of *coercive* public law. But the tally counts "levy, inspection." So the Merchant House still inspects goods (for quality/tax) but doesn't issue public ordinances. The Steward issues ordinances.
