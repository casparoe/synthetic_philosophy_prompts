      *(Self-Correction during drafting)*: I should ensure I explicitly mention the "Past Hypothesis" as it's the standard rationalist/physics answer to the arrow of time. I should also clarify the "Block Universe" view vs. "Presentism" in the metaphysical section.

      *Let's structure the "Menu" clearly.*
      1. Epistemic (Records)
      2. Thermodynamic (Entropy)
      3. Counterfactual/Causal (Intervention)
      4. Metaphysical (Indeterminism/Block)
      5. Logical (Truth Values)

      *Let's structure the "Verdict".*
      The Bayesian is right about *laws*, wrong about *situation*. The Fixed/Open guy is right about *experience/causality*, maybe wrong about *metaphysics*. The asymmetry survives determinism via Thermodynamics/Counterfactuals.

