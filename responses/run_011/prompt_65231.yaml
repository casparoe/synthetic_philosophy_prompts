      *   *Nuance:* The "Bayesian" argument is slightly flawed. Even with equal evidence, retrodiction is often harder due to entropy (many microstates map to one macrostate in the future, but tracing back requires specific low-entropy conditions). Wait, actually, the "Bayesian" argument is that *given the same information*, the laws work both ways. But we never have the same information. I need to clarify that the asymmetry is in the *availability* of information (records), which stems from thermodynamics.
      *   *Nuance on Counterfactuals:* David Lewis's account is key here. The "fixed past" is a feature of how we evaluate counterfactuals, not necessarily a feature of the block universe.
