prompt: |-
  So I'm on the small grants panel at our centre — decision theory and safe autonomy, we hand out maybe eight internal awards a year, usually 15-40k, and I've got to circulate something before Thursday's meeting. I'd like you to draft the memo I'll put under people's noses. It should read like a document the panel could actually vote on, not like a survey.

  The application in front of us. A philosopher PI and a CS co-PI want to build a small delivery robot that runs a corridor with two underpasses that are, as far as its sensors go, exactly alike. Its wheel odometry drifts and its localization stack genuinely can't tell them apart — this isn't a bug they plan to fix, it's the whole point, they've already got a working prototype of the failure. Exiting at the first underpass dumps it into a dead-end yard and that's a total loss; exiting at the second one is a successful delivery, full score; driving past both overshoots and it comes back late for partial credit. When the robot rolls up to an underpass it knows only that it's at one of them. The CS side says the answer is trivial: compute the plan that maximises expected score before it sets off, and have it execute that plan; done. The philosopher PI says the interesting question is what the robot should do at the underpass, given its own local beliefs about which underpass it's at — because the globally best plan can require it to take an action that, judged from where it's sitting, its own numbers say is the worse one, and because how confident it should be that it's at the first one seems to depend on what it's already decided to do. They want to test whether the rival diagnoses in the literature — it's a real conflict between planning-stage and action-stage reasoning, or it's an artefact of letting an agent with imperfect recall treat itself as if it were making a fresh choice, or it's really about whether you're allowed to randomise, or something else — actually make different predictions about how a machine like this should be programmed. That's the deliverable, plus the robot.

  Now our track record over the last three cycles, which I want you to work from rather than around:

  1. We funded, full amount, a one-day workshop whose stated question was what a deployed agent that can't tell where it is in a sequence should do — very close to this shape, sleeping-beauty flavoured, almost all of it argument and no theorem. It squeaked through because the organiser agreed to a condition we imposed: every session had to end with someone stating what a real system should do differently.

  2. We rejected a clean, rigorous formal project comparing two decision rules on a puzzle case. Reason recorded in the minutes: the dispute has been settled to everyone's satisfaction in the literature already and we'd be paying for a restatement.

  3. We rejected a purely conceptual proposal, no apparatus at all, arguing that a certain coherence requirement on plans should be dropped. The minutes note that it would have been a good journal article but wasn't a centre project, since we exist to fund things that touch machines people actually build.

  4. We funded a heavily engineering one: a control stack for a legged robot that has to act while its state estimate is stale, benchmarked in a mock warehouse. Very well received, papers and a real system.

  5. We funded, at half the requested amount, a human-subjects study of whether people change their choice mid-sequence when they can't tell two decision points apart. We cut it because the panel couldn't see what the behavioural data could show that the existing analysis of the same payoff structure hadn't already shown.

  Reading those five, the panel is split, and both halves think they have the precedents. One half says the new one is (5) with expensive hardware bolted on: same decision problem, same payoffs, so the empirical part adds nothing and the philosophy part was already tolerated once, at workshop scale. The other half says it's (1) plus (4), finally done properly: the conceptual question gets a physical instantiation, which is exactly what (3) was missing.

  What I need from you:

  - A definite bottom line — fund, fund with conditions, or reject — and if it's conditions, make them specific enough to write into the award letter: what money, what milestones, what has to be true by, say, the twelve-month report. Vague conditions are worse than none.
  - Say which of our precedents is the closest analog and which is the most tempting but wrong comparison, and why. I want the reasoning to be one the PIs could push back on with a straight face.
  - The precedents genuinely underdetermine this, I think. So be explicit about what rule we'd be committing ourselves to in each direction: if we fund, what's our test going forward for when a philosophical dispute is a legitimate object of funding rather than garnish; if we reject, what's our test for when hardware makes a conceptual question newly fundable. Name the next application each rule would make us decide differently, because that's how we'll find out which one we actually hold.
  - Take the co-PI's objection seriously, not as a strawman. There's a real version of it: the plan that maximises expected score is computable, the robot executes it, and every debate about what it should believe at the underpass is downstream noise. If that's right, the philosophical half is decoration and we should say so. But if the two halves can genuinely come apart in a machine — if there's an implementable policy question that the global calculation doesn't settle — say what that question is and why the robot can't dodge it. Don't hand-wave this; it's the crux of the whole memo and it's the bit our engineer members will read first.
  - One more thing: decide whether we should require them to state up front whether the robot is permitted to randomise, and whether that requirement is a real condition or just a way of looking thorough. There's an argument that the case changes character depending on the answer.

  Keep it to something a person can read in ten minutes before the meeting. Casual is fine, sloppy isn't — I don't want a bibliography or a lit review, I want reasons. And please don't hedge the recommendation; if you end with both sides having a point, you've written the wrong document.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of a small grants panel (Decision Theory and Safe Autonomy Centre).
      *   **Task:** Draft a memo for the panel to vote on regarding a specific grant application.
      *   **Context:** Internal awards (8/year, 15-40k). Meeting is Thursday.
      *   **Application:** Philosopher PI + CS Co-PI. Building a delivery robot in a corridor with two indistinguishable underpasses.
          *   *Problem:* Robot can't tell underpasses apart (odometry drift).
          *   *Payoffs:* Exit 1 (Dead end/Loss), Exit 2 (Success/Full Score), Pass Both (Late/Partial).
          *   *Conflict:* CS says "Maximize expected score globally, execute plan." Philosopher says "What should the robot *believe/do* locally at the underpass? Global plan might conflict with local rationality/imperfect recall."
          *   *Goal:* Test rival decision theory diagnoses (planning vs. action, imperfect recall, randomization) via physical instantiation.
      *   **Precedents (5 cases):**
          1.  Funded (Workshop): Similar decision problem, condition: must state what real system does differently.
          2.  Rejected (Formal): Dispute settled in literature, restatement.
          3.  Rejected (Conceptual): No apparatus, good journal article but not a "centre project" (needs to touch machines).
          4.  Funded (Engineering): Control stack, stale state estimate, real system.
          5.  Funded (Half, Human Subjects): Behavioral data on same payoff structure. Cut because data added nothing to existing analysis.
      *   **Panel Dynamics:** Split. Half say it's (5) + hardware (waste). Half say it's (1) + (4) (conceptual made physical).
      *   **Requirements for the Memo:**
          *   Definite bottom line (Fund/Reject/Condition).
          *   Specific conditions (money, milestones, 12-month report).
          *   Identify closest analog and most tempting wrong comparison.
          *   Explicitly state the rule/precedent being set (what makes philosophy fundable vs. garnish? when does hardware make concepts fundable?).
          *   Address the CS Co-PI's objection seriously (Is the philosophy just noise? Or is there a real implementable policy question?).
          *   Decide on the randomization requirement (Up front declaration?).
          *   Tone: Readable in 10 mins, casual but not sloppy, no hedging.

  2.  **Evaluate the Application against Precedents:**

      *   *Is it Precedent 5 (Human Subjects)?* The human subjects study was cut because behavioral data didn't add to the analysis. Here, we have a *robot*. Does the robot add anything? If the CS Co-PI is right (global plan is all that matters), then the robot is just a calculator executing $\pi^*$. The philosophy is garnish. *However*, if the implementation requires a specific architecture (e.g., local belief updates vs. open-loop execution) that affects safety or robustness in ways global planning doesn't capture, it's distinct from (5).
      *   *Is it Precedent 3 (Conceptual)?* Precedent 3 was rejected for lacking apparatus. This has apparatus. So it passes the "touch machines" bar *if* the machine matters.
      *   *Is it Precedent 1 (Workshop)?* Precedent 1 was funded *on condition* that sessions ended with "what a real system should do differently." This proposal promises exactly that: a physical instantiation.
      *   *Is it Precedent 4 (Engineering)?* Precedent 4 was "heavily engineering." This is "heavily philosophical" with engineering support.
      *   *The Crux:* The CS Co-PI's claim. "Compute the plan, execute it." In standard POMDP/MDP planning, this is correct. You solve for the policy $\pi$ that maximizes expected utility. You don't need to re-evaluate beliefs at the node if the policy is fixed. *Unless* the robot has limited compute, or the environment is non-stationary, or (crucially) the *implementation of the policy* depends on how the agent models itself. If the agent uses a "local belief" architecture (common in robotics) vs. a "time-indexed open loop" architecture, the behavior under drift might differ even if the theoretical policy is the same. The Philosopher argues that *how* the decision is computed (local vs. global) matters for safety/interpretability, not just the output.
      *   *Decision:* The panel is split. To break the tie, I need a recommendation that acknowledges the risk (it could be Precedent 5) but leverages the opportunity (it could be Precedent 1+4).
      *   *Recommendation:* **Fund with Conditions.** Why? Because the "hardware makes it real" argument (1+4) is strong *only if* the hardware actually constrains the philosophy. If they just build a robot that executes a pre-computed script, it's Precedent 5 with wheels. We need to force them to demonstrate where the decision theory *changes the code*.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Recommendation:** Fund at 30k (mid-range), with specific conditions.
      *   **The CS Objection (The Crux):** I need to articulate *why* the CS Co-PI might be right, and why we are funding anyway. The CS view: Policy $\pi$ is a mapping from history/observation to action. If you solve it globally, you have the answer. The Philosopher's view: In embedded agents, "where am I in the plan?" is a state estimation problem. If the agent suffers from *imperfect recall* (forgetting it passed underpass 1), standard Bayesian updating fails. The "policy" might require randomization (mixed strategies) which is hard to implement deterministically. Or, the "local belief" might trigger safety overrides that the global planner didn't account for. *Key distinction:* Is the decision theory dictating the *objective function* or the *architecture*? We fund if it dictates architecture.
      *   **Precedents:**
          *   *Closest Analog:* Precedent 1 (Workshop). Both ask "What does a system do when it can't tell where it is?" But this one builds the system.
          *   *Wrong Comparison:* Precedent 5 (Human Subjects). That was rejected because human psychology didn't add to the math. Here, *robot architecture* might add to the math. But it risks becoming 5 if the robot is just a prop.
      *   **The Rule/Precedent Setting:**
          *   *If Fund:* We are saying Philosophy is fundable when it forces a specific *implementation constraint* that standard engineering ignores. Test: Does the decision theory change the loss function or the control loop?
          *   *If Reject:* We are saying Hardware doesn't validate Concept. Test: Does the hardware do anything a simulation couldn't?
      *   **Randomization:** This is critical. In "Absent-Minded Driver" problems (which this resembles), deterministic policies often fail where mixed strategies succeed. They must declare this. It's not just thoroughness; it determines the solvability.
      *   **Conditions:**
          *   Milestone 1: Architecture spec showing where DT enters the control loop.
          *   Milestone 2: Comparison of Global vs. Local implementation.
          *   Final: Code release + Paper.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Is the CS objection really a strawman? No. In optimal control, you solve the Bellman equation. You get $u_t$. You execute $u_t$. Why do we care about the robot's "belief"?
      *   *Counter:* Because in safe autonomy, we often use "monitor" systems. If the robot *believes* it's at Underpass 1 with 90% confidence, a safety monitor might stop it. The Global Planner says "Go." The Local Belief says "Stop." This conflict is real in architecture. The grant proposes to study this.
      *   *Refinement:* Make sure the memo highlights this "Architecture vs. Objective" distinction. That's the engineering hook.
      *   *Randomization:* If they aren't allowed to randomize, the problem might be unsolvable or suboptimal in a way that matters. They need to state their stance.
      *   *Tone Check:* Keep it punchy. "Casual is fine, sloppy isn't." Use bullet points. No "Dear Colleagues" fluff.

  5.  **Finalizing the Recommendation:**

      *   **Vote:** Fund.
      *   **Amount:** 30k (enough for robot + time, not enough for bloat).
      *   **Condition:** The "Architecture Constraint." They must show where the decision theory *forces* a deviation from standard SOTA planning stacks.
      *   **Randomization:** Mandatory declaration.

  6.  **Writing the Memo:** (Iterative process to ensure all constraints are met).
      *   *Check:* Did I name the next application each rule affects? Yes, need to invent a hypothetical future case.
      *   *Check:* Did I address the CS Co-PI? Yes.
      *   *Check:* Is it under 10 mins read? Yes, keep it tight.

  7.  **Final Polish:** Ensure the distinction between Precedent 1 and 5 is sharp. Precedent 1 was talk; this is walk. Precedent 5 was data without mechanism; this is mechanism with data. The risk is it becomes 5. The condition prevents that.

  *(Self-Correction on Randomization)*: The prompt asks "decide whether we should require them to state up front... and whether that requirement is a real condition or just a way of looking thorough." I need to take a stand. It *is* a real condition because it changes the mathematical structure of the problem (behavioral strategies vs. mixed strategies). I will make it a funding condition.

  *(Self-Correction on CS Objection)*: I need to be careful not to sound like I'm taking the Philosopher's side blindly. The CS Co-PI is right *if* the system is a classical planner. The funding justification is that safe autonomy systems often *aren't* classical planners; they have layered architectures where local beliefs trigger safety stops. That's the niche.

  Let's assemble.
answer: |-
  **MEMORANDUM**

  **TO:** Small Grants Panel, Centre for Decision Theory and Safe Autonomy
  **FROM:** [Your Name]
  **DATE:** Tuesday
  **RE:** Recommendation on Application [ID-24-X]: "Embedded Decision Making Under Indistinguishable States"

  **Bottom Line**
  **Fund with Conditions.**
  **Award:** 30k (mid-range).
  **Timeline:** 12 months.

  This project sits exactly on the fault line between Precedent 1 (the workshop) and Precedent 5 (the human subjects study). If we fund it as a pure decision-theory test with a robot prop, we are wasting money on Precedent 5 with wheels. If we fund it as an architectural stress-test for safe autonomy, it is Precedent 1 finally delivering the physical instantiation Precedent 3 was missing.

  To ensure the latter, I propose three binding conditions for the award letter.

  **The CS Co-PI's Objection (and why we are funding anyway)**
  The Co-PI is technically correct for a classical planner: if you solve the POMDP globally, you get a policy $\pi$. You execute $\pi$. The robot's "local belief" at the underpass is irrelevant noise.

  However, in *safe* autonomy, we rarely deploy end-to-end optimal planners. We deploy layered architectures where a local state estimator feeds a safety monitor that can override the global plan. If the robot's local belief update says "90% chance I'm at Underpass 1," a safety layer might halt the bot, even if the global plan says "proceed." This creates a conflict between *global optimality* and *local rationality* that isn't just philosophical—it's a code conflict.

  We are funding this only if they treat that conflict as an engineering problem, not a thought experiment. The deliverable isn't just "which theory is right"; it's "which architecture fails less often when the theory is implemented."

  **Precedents**
  *   **Closest Analog:** Precedent 1 (The Workshop). Both address the "absent-minded driver" structure (indistinguishable decision nodes). Precedent 1 was funded on the condition that speakers state what a real system should do differently. This proposal promises to actually build that system.
  *   **Tempting but Wrong Comparison:** Precedent 5 (Human Subjects). We cut that funding because human behavioral data added nothing to the mathematical analysis of the payoff structure. The panel half arguing for rejection sees this project as Precedent 5 with expensive hardware. They are right *if* the robot is just a data logger. They are wrong if the robot's control stack forces a choice between competing decision rules that a simulation would gloss over.

  **The Rule We Are Setting**
  We need to be explicit about what precedent this sets for future cycles.

  *   **If we fund this:** We are committing to the rule that **philosophical disputes are fundable when they mandate specific architectural constraints.**
      *   *Future Test:* A future application proposing to test "causal vs. evidential decision theory" on a drone would be funded only if they show that the choice changes the control loop, not just the post-hoc analysis.
      *   *Next Application:* Imagine a proposal to test "moral uncertainty" on a care-bot. Under this rule, we fund it only if the uncertainty module changes the motor commands, not just the dialogue script.

  *   **If we reject this:** We are committing to the rule that **hardware does not validate concepts.**
      *   *Future Test:* A purely simulation-based project comparing decision rules would be treated equally to a hardware one. Hardware adds cost, not validity.
      *   *Next Application:* Imagine a proposal to build a "deontological constraint" module for a surgical arm. Under this rule, we reject it unless the constraint solves a control problem that a cost-function penalty couldn't.

  **The Randomization Requirement**
  **Condition:** They must declare in the Month 3 report whether the policy permits randomization.
  **Status:** This is a **real condition**, not bureaucratic thoroughness.
  **Reasoning:** In problems with imperfect recall (which this is), deterministic policies can be strictly dominated by mixed strategies. If they hard-code a deterministic controller, they may render the philosophical question moot because the optimal solution is inaccessible. If they allow randomization, they introduce noise that affects sensor fusion. This choice changes the physics of the system, not just the logic. They cannot defer this.

  **Specific Funding Conditions**
  To prevent this from sliding into Precedent 5 (data without mechanism), the award letter will include:

  1.  **Architecture Specification (Month 3):** The PI must submit a diagram showing exactly where the decision-theoretic module sits in the control stack. It cannot be a post-hoc analyzer. It must sit between the state estimator and the actuator.
  2.  **The "Conflict" Benchmark (Month 6):** They must demonstrate one run where the *globally optimal plan* and the *locally rational action* diverge, and the robot must handle this divergence without crashing or halting permanently. If the global plan always wins, the philosophy is garnish.
  3.  **Code Release (Month 12):** Full stack open-sourced. We need to see if the decision theory actually made it into the code, or if it stayed in the paper.

  **Summary**
  The CS Co-PI thinks the philosophy is noise. The Philosopher PI thinks the engineering is just a vessel. Both are half-right. We fund this to force them to prove who is wrong. If the decision theory doesn't change the C++ code, they fail the Milestone 2 review, and we stop the second tranche.

  **Vote:** Fund at 30k, subject to the three conditions above.
