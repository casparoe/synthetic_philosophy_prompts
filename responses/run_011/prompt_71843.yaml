answer: |-
  Here are ten questions tailored for the live recording, keeping acoustics and time in mind. Each includes a predicted answer and a specific follow-up.

  **1. The Update Rule**
  **Q:** If your credence in Heads is 1/2 on Sunday and 1/2 on Monday, what epistemic work is the fact "I am awake right now" actually doing?
  **Predicted Answer:** She will say it provides self-locating information but no new world-locating information relevant to the coin chance.
  **Follow-up:** So on your view, can self-locating evidence *ever* shift credence in a non-self-locating proposition, or is it always inert?

  **2. The Principal Principle**
  **Q:** If the objective chance of Heads is 1/2, but you know you are twice as likely to be awake on Tails, doesn't the Principal Principle demand your credence reflect that frequency?
  **Predicted Answer:** She will distinguish between chance of the *coin* and frequency of *observations*, denying the latter constrains the former.
  **Follow-up:** Then what connects objective chance to subjective expectation in your framework, if not the expected frequency of experience?

  **3. The Red/Blue Variant (TIC TRAP #1)**
  **Q:** In my variant, Heads is one Red awakening, Tails is one Red and one Blue. Conditionalizing on "Red" shifts credence. Why is conditionalizing on "Awake" different?
  **Predicted Answer:** She will claim "Red" eliminates a possible world (Tails-Blue), whereas "Awake" is true in all possible worlds.
  **Follow-up:** **If you answer that betting on Red is just a "decision problem" unlike betting on Heads, you admit your epistemic rule is ad hoc. Is the difference truly epistemic, or just pragmatic?**
  *(Note: This phrasing forces her to either defend a hard epistemic distinction or admit her view doesn't govern action in the Red case either.)*

  **4. Conditionalization Status**
  **Q:** If "Awake" doesn't eliminate worlds but "Red" does, does standard Bayesian conditionalization fail for all self-locating beliefs?
  **Predicted Answer:** She will likely say standard conditionalization needs modification or restriction for indexicals.
  **Follow-up:** If we need a special rule for indexicals, what prevents that rule from being tailored specifically to save the 1/2 answer?

  **5. The Thousand-Tails Case**
  **Q:** If Tails means one thousand awakenings and Heads means one, do you still maintain a 1/2 credence on awakening number five hundred?
  **Predicted Answer:** She will bite the bullet and say yes, consistency requires it.
  **Follow-up:** When a grad student says that view feels insane, do you tell them their intuition is broken, or that the setup is misleading?

  **6. The Delayed Flip**
  **Q:** If the coin is tossed *after* you go to sleep, halving seems obvious. Why does the timing of the toss change the epistemology of the awakening?
  **Predicted Answer:** She will argue the causal structure differs; in the original, the outcome determines the number of observers.
  **Follow-up:** But the phenomenological experience at the moment of awakening is identical. How does a future toss affect current rational belief?

  **7. Sunday Precommitment (TIC TRAP #2)**
  **Q:** On Sunday, knowing Tails gives you two bets, should you precommit to betting odds that differ from your 1/2 credence?
  **Predicted Answer:** She will say yes, you should precommit to 1/3 odds to maximize utility.
  **Follow-up:** **If you say "that's a decision problem, not credence," you concede credence is normatively inert. If credence doesn't guide action, what rational constraint does it impose?**
  *(Note: This corners her: if credence doesn't guide action here, it's hard to argue it's a meaningful normative state anywhere.)*

  **8. Money Pumps**
  **Q:** Is there any combination of bets offered at each awakening that guarantees you a loss, given your 1/2 credence?
  **Predicted Answer:** She will argue that because the bets land on different "centers," they don't aggregate into a single guaranteed loss for the agent.
  **Follow-up:** Is "the bets land on different centers" an explanation of the math, or just a restatement of the halfer position?

  **9. Cosmological Travel**
  **Q:** Does double-halving tell a cosmologist to ignore observer counts in Doomsday or Everettian branching arguments?
  **Predicted Answer:** She will say yes, observer counts shouldn't shift priors on physical theories.
  **Follow-up:** If so, doesn't that make empirical science blind to selection effects that rely on observer density?

  **10. Falsification**
  **Q:** What specific argument or observation would actually make you abandon the double-halfer view?
  **Predicted Answer:** She will suggest a proof of logical inconsistency or a superior account of self-location.
  **Follow-up:** If no empirical observation counts, isn't the view insulated from evidence by definition?
