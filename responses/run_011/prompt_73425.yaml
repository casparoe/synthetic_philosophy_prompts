  The research programme described constitutes a paradigmatic instance of the historicism Karl Popper sought to demolish, and the critic is correct that Popper's philosophical arguments render its claims to lawhood and unconditional prophecy untenable. While the defender attempts to recast the model as a standard exercise in statistical forecasting, the structural claims made by the authors—specifically the assertion of a law governing sociopolitical instability and the issuance of unconditional forecasts for named polities—place the programme squarely within the target of Popper's critique. To adjudicate this dispute properly, one must distinguish between the empirical success of a model on past data and the logical validity of its claims about the nature of historical processes. The stipulated success of the model between 1990 and 2020 does not vindicate the programme against Popperian objections, because the conditions under which that success was achieved differ fundamentally from the conditions under which future predictions must operate. This essay will demonstrate that the programme violates Popper's strictures on historical prediction, specifically regarding the distinction between trends and laws, the impossibility of unconditional prophecy in open systems, and the reflexive impact of knowledge on social outcomes.

  To begin, one must specify precisely which of Popper's claims are engaged by this programme. Popper did not argue that social science is impossible, nor did he deny that one could identify regularities in social life. His target was specifically the belief that history unfolds according to immutable laws that allow for the prediction of the destiny of societies. If the programme's success is genuine, it does not falsify Popper's claim that piecemeal social engineering is viable, nor does it touch his assertion that scientific method requires falsifiability. Indeed, the defender is correct that the model is technically falsifiable; if instability does not occur, the model is wrong. However, the programme does falsify a specific subset of Popper's claims regarding the impossibility of long-term historical prediction based on structural variables alone. Popper argued that because human history is strongly influenced by the growth of human knowledge, and because we cannot predict the future growth of that knowledge, we cannot predict the future course of history. The model claims to do exactly this without including knowledge variables. Yet, this apparent falsification is superficial. Popper's argument is not merely empirical but logical: he contends that such prediction is impossible *in principle* once the prediction itself becomes part of the knowledge available to the actors involved. Therefore, the programme's past success leaves Popper's core logical argument untouched, while its future claims invite the very refutation Popper predicted.

  The distinction between conditional and unconditional prediction is central to this analysis. The defender argues that Popper accepted unconditional predictions in physics, such as eclipses, and thus should accept them here. This analogy fails because physical systems like the solar system are closed; the initial conditions are known, and the system does not react to the prediction. Popper banned unconditional predictions in social science not because they are unconditional per se, but because social systems are open. In an open system, initial conditions cannot be fully specified, and the system itself evolves. The programme issues unconditional forecasts about named polities at named dates, asserting that instability *will* occur. This presumes that the initial conditions (the four macro-variables) are sufficient to determine the outcome regardless of any other intervening factors. By ignoring the openness of the social system, the programme treats society as a closed mechanical system. This is the hallmark of historicism. Popper would argue that a scientific social prediction must be conditional: *if* certain policies are pursued, *then* certain outcomes will follow. By removing the conditionality and predicting inevitability based on structural trends, the authors cross the line from science into prophecy. The fact that the forecasts are for named polities rather than humanity as a whole does not save them; Popper's critique applies to any claim that treats a specific historical trajectory as determined by law-like regularities independent of human choice and knowledge.

  This leads directly to the reflexive objection, which is the most potent weapon in the critic's arsenal. The critic argues that forecasts undermine themselves because governments warned of instability will act to prevent it. The defender might counter that this is simply a risk of falsification that a bold conjecture should welcome. However, this misunderstands the nature of the reflexivity. In physics, predicting an eclipse does not change the orbit of the moon. In society, predicting instability changes the behaviour of the elites and the populace. The model's variables—elite competition, state revenue, credential ratios—are all manipulable by agents who know the model. If the model is published, it becomes a variable in the system it seeks to predict. Since the model explicitly excludes measures of what people believe about the model itself, it cannot account for this feedback loop. The critic is right to claim this makes the model self-undermining. It is not merely that the model might be falsified; it is that the act of publishing the forecast alters the truth conditions of the forecast. The defender cannot claim this is welcome falsifiability because the falsification arises from the existence of the theory itself, not from independent evidence. This confirms Popper's view that unconditional social prophecy is impossible: the prophecy changes the world in a way that invalidates the prophecy. The programme's domain always contained its own publication, meaning the forecasts were never truly unconditional in the first place. They were conditional on the model remaining unknown, a condition that cannot hold for a published scientific result.

  Furthermore, one must address the trend versus law distinction in light of the model's probabilistic character. Popper insisted that a trend is an existential statement—it says something happened over a period—whereas a law is a universal statement that rules out certain possibilities. The authors have identified a correlation over five centuries and labelled it a law. Popper would argue this is a category error. A statistical correlation, no matter how robust, remains a trend unless it is underpinned by a universal mechanism that holds regardless of context. The probabilistic nature of the model does not rescue it from this charge. Popper acknowledged that probabilistic laws exist in science, but they must still forbid certain outcomes with specified probabilities. Here, the probability is derived from historical frequency, not from a theoretical mechanism that excludes alternatives. By calling it a law of sociopolitical instability, the authors imply a necessity that the data does not support. The data shows that instability *has* followed these conditions; it does not show that it *must*. Popper's view gives the critic the resources to deny the label "law" because the model does not rule out possibilities; it merely assigns likelihoods based on past patterns. If the structure of society changes—for instance, if the nature of credentials shifts fundamentally due to technology—the trend may break. A true law would withstand such contextual shifts. The model's reliance on historical regularity without a mechanism that accounts for structural change confirms it is tracking a trend, not a law.

  The argument from the growth of knowledge engages this model profoundly, despite the model's lack of a knowledge variable. Popper's central thesis is that the growth of knowledge is the primary driver of historical change and that this growth is unpredictable. The model excludes knowledge and technology variables, assuming that demographic and fiscal structures determine outcomes regardless of what people know. If the model works, it suggests that structural stress overrides knowledge. However, Popper would argue that knowledge alters how structural stress is managed. A government with access to modern surveillance technology or economic theory might mitigate instability that would have occurred in 1600. By omitting knowledge, the model assumes a stationarity in human capability that contradicts the historical record of innovation. For the model to engage with Popper's argument properly, it would need to include a variable for the state of knowledge or technological capacity. However, adding such a variable would likely destroy the model's predictive record. Because knowledge growth is unpredictable, any variable attempting to capture it would introduce uncertainty that the current model avoids. The model's predictive success relies on the assumption that knowledge does not matter enough to disrupt the structural correlations. Popper's argument suggests this assumption is false in the long run. Therefore, the model avoids Popper's critique only by ignoring the very factor Popper identified as decisive. This omission does not make the model scientific; it makes it blind to the engine of historical change.

  Finally, one must consider whether the critic's complaint is merely methodological or truly philosophical. A methodological critic might attack the sample size of thirty-three positive cases, the definition of instability, or the stationarity of the variables over five hundred years. These are valid concerns, but they are empirical. If the data were stronger, the methodological critic would be silenced. The appeal to Popper is not dispensable because the critic's objection is categorical, not empirical. Even if the model predicted every instance of instability perfectly from 1500 to 2020, the Popperian objection would remain: the model claims a necessity where there is only contingency, and it issues prophecies that ignore the reflexive nature of social knowledge. The methodological issues are symptoms of the deeper philosophical error. To treat the complaint as merely methodological is to assume that with enough data, historicism could be made scientific. Popper's argument is that no amount of data can turn a historical trend into a universal law of society because the system itself evolves through knowledge. Therefore, the appeal to Popper is necessary to expose the limits of what the model can claim, regardless of its statistical performance. The critic is not merely asking for better statistics; they are asking for a recognition of the ontological difference between social and natural systems.

  In conclusion, the defender's attempt to frame this programme as bold Popperian science fails because it misconstrues the nature of Popper's critique. Popper welcomed bold conjectures, but only those that respected the logical limits of prediction in open systems. This programme claims to have discovered a law of history and issues unconditional prophecies that ignore the impact of knowledge on human behaviour. The stipulated success on past data is consistent with Popper's view that trends can persist for long periods, but it does not validate the claim to lawhood. The reflexive objection demonstrates that the model cannot maintain its predictive power once its insights are disseminated, confirming Popper's thesis that unconditional social prophecy is self-defeating. The programme is historicist because it seeks to predict the inevitable unfolding of social structures without accounting for the human agency that alters those structures. Consequently, the critic is right to invoke Popper, not merely as a methodological check, but as a philosophical corrective to the overreach of the model's authors. The model may be a useful heuristic for identifying risk, but it cannot bear the weight of the laws and prophecies its authors assign to it.

  Verdict: HISTORICISM_CONFIRMED
