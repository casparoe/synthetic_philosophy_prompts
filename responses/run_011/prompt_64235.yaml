  A third tension arises in Commitment 5. Defining institutional justice solely as a function of weighted outcomes ignores procedural constraints. While consistent with consequentialism, this reductionism makes it difficult to account for rights that might block maximizing prioritarian value. If an institution generates high prioritarian value through unjust procedures, your view must endorse it. This costs you the ability to capture deontological intuitions about fairness that are distinct from outcome value, potentially alienating readers who view justice as partially procedural. The interaction between Commitments 2 and 5 also creates friction. You reject leveling down because equality is not intrinsically valuable, yet you judge institutions by weighted outcomes. If an institution produces a slightly higher prioritarian score but creates vast inequalities, your view endorses it. However, if those inequalities lead to social instability that lowers well-being, your view opposes them instrumentally. This makes your opposition to inequality contingent on empirical facts rather than principle. This costs you the robust normative stance against exploitation that egalitarianism provides, leaving you vulnerable to the charge that your view permits oppressive hierarchies so long as they maximize weighted utility.

  Only apparent
  The classmate's objection (6) dissolves on inspection. Extensional equivalence in specific cases does not entail theoretical identity. Egalitarianism condemns inequality intrinsically; Prioritarianism condemns low absolute levels. In a two-group case, helping the worse-off reduces inequality, so the recommendations converge. However, they diverge in cases involving different population sizes or where benefiting the worse-off increases inequality. Your justification remains distinct even if outcomes overlap, so you are not merely scrubbing labels. The structure of justification matters for moral theory, not just the output. Furthermore, the classmate's claim ignores the Leveling-Down Objection. An egalitarian must concede some value in leveling down; you do not. This theoretical divergence proves the views are distinct, regardless of overlapping policy preferences in simple scenarios.

  Cheapest repair
  Adopt "Resource Prioritarianism." Modify Commitment 1 to state that moral weight depends on *resource holdings* (income) rather than well-being levels. This aligns with Commitment 4 and bypasses the Arbitrary Origin Problem (Commitment 3) because income has a natural zero. You lose the ability to account for differential conversion factors (disabilities), but you gain a coherent, measurable metric. Alternatively, fix Commitment 3 by positing a non-arbitrary well-being zero (e.g., neutral hedonic state), but this is philosophically costlier than admitting you are weighting resources. Sticking with Resource Prioritarianism preserves the mathematical coherence of your weighting function without requiring metaphysical claims about well-being scales. This revision clarifies that your view is about the distribution of means, not ends. It resolves the tension between 1 and 4 by making them identical, and resolves 1 and 3 by removing the need for a well-being ratio scale.
