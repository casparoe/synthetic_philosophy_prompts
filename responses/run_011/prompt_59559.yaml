answer: |-
  **Mark: 62/100**

  **General Comment:**
  This is a mixed paper. You have a very strong grasp of the logical structure of the "undermining future" problem (Part 2), which is the philosophically hardest component of this question. Your derivation of the contradiction is clear and correct. However, you lose significant marks on textual precision and scholarship (Part 1 and Part 3). The prompt asked for Lewis's view "as exactly as you can" and specifically about Lewis's *New Principle*; your answer misrepresents Lewis's historical/theoretical move regarding Humean Supervenience and omits the formal statement of the PP. The mark reflects a solid understanding of the problem but a shaky handling of the specific literature and formal requirements.

  **Part-by-Part Comments:**

  **Part 1: The Principal Principle and Admissibility**
  *   **What's Solid:** Your intuitive gloss of the PP is correct in spirit (credence should track chance). Your example of the time-traveler vs. weighted coin correctly identifies the distinction between information about the *outcome* (inadmissible) and information about the *setup/chance* (admissible).
  *   **What's Wrong/Doesn't Follow:**
      1.  **Precision:** The prompt asked you to state the principle "as exactly as you can." In a grad seminar on chance, a prose gloss is insufficient. You should have provided the formal notation: $C_{tw}(A | X E) = x$, where $X$ is the proposition that the chance of $A$ is $x$, and $E$ is admissible evidence.
      2.  **Reflection Principle:** You state the PP is "really an instance of van Fraassen's Reflection Principle." This is a controversial interpretive claim, not a settled fact. Lewis discusses the *analogy* between PP and Reflection, but he distinguishes them (specifically in the *Postscripts*). Treating this analogy as an identity ("is really an instance") without qualification is too strong and suggests a conflation of the two distinct principles.
  *   **What a Stronger Answer Would Say:** A stronger answer would provide the formula first, then gloss it. Regarding Reflection, it would note that Lewis *motivates* PP via an analogy to Reflection but maintains they are distinct principles (PP concerns chance, Reflection concerns future credence), and that admissibility is the specific technical tool Lewis introduces to handle evidence that bypasses chance.

  **Part 2: Undermining Futures**
  *   **What's Solid:** This is the best section of your paper. You correctly identify the tension between Humean Supervenience (HS) and the PP. You clearly articulate that $H$ assigns $W$ a non-zero chance, but $W$ entails $\neg H$. You correctly conclude that this generates a contradiction ($P(H \land W) > 0$ but $H \land W$ is impossible). This demonstrates you understand the core philosophical problem.
  *   **Borderline Point:** You describe the result as a "flat contradiction rather than a puzzle." This is defensible. Lewis agrees that PP + HS leads to a contradiction. Some philosophers argue one can be rescued; Lewis argues PP must be modified. Your phrasing is acceptable here.
  *   **What a Stronger Answer Would Say:** You might explicitly mention that the problem arises because, under HS, the *truth* of the chance hypothesis depends on the future, but the *chance* of that future depends on the hypothesis. Making this dependency loop explicit strengthens the explanation of *why* the contradiction arises.

  **Part 3: The New Principle (NP)**
  *   **What's Solid:** You correctly identify the structural solution to the problem: the agent should conditionalize on the "complete chance hypothesis" (the theory of chance, $T_w$) rather than just the specific chance value. You also correctly note that this allows Humean Supervenience to survive.
  *   **What's Wrong/Doesn't Follow:**
      1.  **Historical/Textual Error:** You write: "Lewis's response was to abandon Humean supervenience... But the price is the entire point of the Humean project... And the move isn't even necessary." This is factually incorrect regarding Lewis's published view. In *Postscripts to "A Subjectivist's Guide to Objective Chance,"* Lewis introduces the New Principle *specifically to save* Humean Supervenience. He does not abandon HS in that text; he modifies PP to NP to make them compatible. You attribute the "fix" to yourself ("A cheaper fix is...") when describing Lewis's actual solution.
      2.  **Mechanism:** You say the fix works but leave open "why an agent should adopt a package she has some reason to think might be false." A stronger answer would explain *why* NP fixes the contradiction: by conditionalizing on $T_w$ (the theory that links histories to chance functions), the undermining information becomes inadmissible relative to $T_w$, blocking the derivation of the contradiction.
  *   **What a Stronger Answer Would Say:** It would state that Lewis proposes the New Principle: $C(A | T_w) = P(A)$, where $T_w$ is the theory of chance for world $w$. It would explain that this fixes the trouble because $T_w$ entails the chances are resilient; conditionalizing on $T_w$ screens off the information that the future might undermine the chance hypothesis. It would conclude that Lewis argues this *preserves* Humean Supervenience, contrary to your claim that he abandoned it.

  **Summary for Appeal Defense:**
  If the student appeals, the defense is:
  1.  **Formal Requirement:** The prompt explicitly asked for the principle "as exactly as you can." Omitting the formula in a technical seminar is a clear failure to meet prompt requirements.
  2.  **Textual Accuracy:** The claim that Lewis abandoned Humean Supervenience in his discussion of the New Principle is demonstrably false based on the assigned reading (*Postscripts*). While the student identified the logical fix, misattributing the author's stance on their own project is a significant error in a seminar context.
  3.  **Philosophical Precision:** The identification of PP as an "instance" of Reflection is an interpretive overstatement not supported by the primary text, which distinguishes them.

  The mark rewards the excellent logical work on the undermining problem (Part 2) while penalizing the lack of formal precision and the misreading of Lewis's solution (Part 1 & 3).
