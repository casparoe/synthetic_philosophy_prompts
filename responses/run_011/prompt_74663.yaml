prompt: |-
  I'm the plain-language lead at a fintech app and compliance keeps bouncing marketing copy that's literally true but, we think, misleading — "up to 4.5% APY", "no monthly fee", "bank-grade encryption". Their standard is the net impression a reasonable reader is left with, not whether the sentence is false, and noone on my team has any way to argue about a case except vibes. Can you write a decision procedure a copywriter with no philosophy background could run in 15 minutes on a draft line: the checks in order, what counts as passing each one, and then the fix (reword, add a qualifier, or kill the claim)?

  Ground it in whatever the Gricean machinery actually gives you — the maxims, said vs. implicated, scalar implicature, generalized vs. particularized, cancellability — but be straight with me about which of those distinctions survive contact with a deadline and which you're quietly dropping. I especially want the tension handled honestly: the textbook fix is to cancel the implicature with an explicit qualifier, and that's exactly what makes the copy stop selling, so the procedure needs to rank fixes by how much of the unwanted implicature actually survives each one.

  Run it on three examples, one of which should come out cleared even though I'd want it flagged, and mark every place where the procedure stops and hands the question to a human being. Then tell me where it's most likely to misfire, and what would change your mind about the whole framing — e.g. if a relevance-theory account or just leaning on the legal net-impression standard directly would do better here than Grice.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Plain-language lead at a fintech app.
      *   **Problem:** Compliance rejects marketing copy that is literally true but misleading (net impression issue). The team lacks a structured way to argue or fix this beyond "vibes."
      *   **Task:** Create a 15-minute decision procedure for copywriters (no philosophy background) based on Gricean pragmatics (maxims, implicature, etc.).
      *   **Constraints:**
          *   Must be practical (survive contact with a deadline).
          *   Must acknowledge the tension between clarity/compliance and persuasion (qualifiers kill sales).
          *   Must rank fixes by how much unwanted implicature survives.
          *   Must include 3 test cases (one false negative/cleared but should be flagged).
          *   Must identify hand-off points to humans.
          *   Must critique the Gricean framing vs. Relevance Theory or Legal Standards.

  2.  **Deconstruct Grice for Copywriting:**
      *   *Grice's Cooperative Principle:* "Make your contribution such as is required."
      *   *Maxims:* Quantity (info), Quality (truth), Relation (relevance), Manner (clarity).
      *   *Implicature:* What is suggested vs. what is said.
      *   *Scalar Implicature:* "Some" implies "not all." "Up to" implies "maybe not any."
      *   *Cancellability:* Can you add "but not really" without contradiction?
      *   *Practical Translation:*
          *   Quantity: Are you hiding the catch?
          *   Quality: Is it literally true? (Compliance usually handles this, but pragmatics matters).
          *   Relation: Does the headline match the footnote?
          *   Manner: Is it ambiguous?
      *   *The "Vibes" Translator:* The "Net Impression" standard *is* basically Gricean Implicature. The procedure needs to make that explicit.

  3.  **Drafting the Procedure (The "Grice-Check"):**
      *   *Goal:* 15 minutes max. 5 steps.
      *   *Step 1: The Literal Truth (Quality).* If it's false, kill it. (Compliance's job, but copy needs to check).
      *   *Step 2: The "So What?" Test (Relation/Quantity).* What does the reader *think* this means? If the implication is false, flag it.
      *   *Step 3: The Scalar Check (Quantity).* Words like "up to," "free," "instant." Do they imply a norm that isn't met?
      *   *Step 4: The Cancellation Test (Manner).* If we add the footnote, does it contradict the headline?
      *   *Step 5: The Fix Ranking.*
          *   Fix A: Reword (Change the implicature).
          *   Fix B: Qualify (Cancel the implicature - risky for sales).
          *   Fix C: Kill (Too deceptive).

      *Refining for the Prompt's Tension:* The prompt specifically asks to rank fixes by *how much unwanted implicature survives*.
      *   *High Survival:* Adding a footnote (people ignore it).
      *   *Medium Survival:* Adding inline qualifiers ("up to 4.5% *for new customers*").
      *   *Low Survival:* Rewording the core claim ("4.5% *on select balances*").

      *Dropping Philosophy:* Don't explain "Generalized vs. Particularized." Just call it "Standard Assumption vs. Context." Don't explain "Cancellability" theory, just call it "The Contradiction Test."

  4.  **Developing the Test Cases:**
      *   *Case 1 (The Standard Reject):* "Up to 4.5% APY."
          *   Implicature: You can get 4.5%.
          *   Reality: 0.1% for most.
          *   Outcome: Flagged. Fix: Qualify.
      *   *Case 2 (The Cleared/False Negative):* "Bank-grade encryption."
          *   Implicature: You are a bank/insured.
          *   Reality: You use the same tech as banks, but aren't one.
          *   *Constraint:* One must come out cleared even though I'd want it flagged. Let's make this one the "Cleared" one to show the procedure's limit.
          *   *Wait, better idea:* "No monthly fee."
          *   Implicature: It's free.
          *   Reality: No monthly fee, but transaction fees exist.
          *   *Decision:* Let's use "No monthly fee" as the one that gets cleared by the procedure (because it's literally true and the qualifier is standard) but arguably should be flagged because the *net impression* is "free."
      *   *Case 3 (The Clear Kill):* "Instant transfers."
          *   Implicature: Always instant.
          *   Reality: 1-3 days often.
          *   Outcome: Kill/Reword.

  5.  **Critiquing the Framework (The "Straight Talk" Section):**
      *   *Grice vs. Reality:* Grice assumes cooperation. Marketing assumes persuasion (often adversarial).
      *   *Relevance Theory:* Better for "what catches attention," but harder to operationalize.
      *   *Legal Standard:* The "Net Impression" standard (FTC) is actually the boss. Grice is just the tool to predict it.
      *   *Where it misfires:* Sarcasm, cultural context, visual hierarchy (footnotes don't cancel headlines).

  6.  **Writing the Response:**
      *   *Tone:* Professional, direct, slightly cynical about the "philosophy vs. deadline" tension.
      *   *Structure:*
          1.  Intro (acknowledging the constraint).
          2.  The Procedure (The 15-Minute Grice-Check).
          3.  The Fix Ranking (Survival of Implicature).
          4.  The Test Cases.
          5.  The Critique (Where Grice fails).

      *(Self-Correction during drafting)*: Make sure I explicitly mention which Gricean terms I'm dropping.
      *   *Drop:* "Cooperative Principle" (Marketing isn't cooperative).
      *   *Drop:* "Generalized vs. Particularized" (Too academic).
      *   *Keep:* "Implicature," "Scalar," "Cancellability."

      *(Refining the "Cleared but Flagged" case)*:
      *   Let's use "Bank-grade encryption."
      *   Why? It's technically true (AES-256).
      *   Implicature: "My money is safe like a bank" (FDIC).
      *   Procedure might clear it because "encryption" is specific enough.
      *   But compliance might flag it because users infer "FDIC insured."
      *   *Actually, the prompt asks for the procedure to clear it, but the user would want it flagged.*
      *   Okay, I will design the procedure to clear "No monthly fee" (because the literal claim is robust), but acknowledge that the *net impression* of "Free" is the trap.

      *(Refining the Fix Ranking)*:
      *   Need to be honest: Qualifiers *don't* cancel implicatures effectively if the headline is loud and the qualifier is quiet. I need to build that into the ranking.

  7.  **Final Polish:** Check against all constraints.
      *   15 mins? Yes, 5 steps.
      *   No philosophy background? Yes, jargon translated.
      *   Grounded in Grice? Yes (Implicature, Scalar, Cancellation).
      *   3 Examples? Yes.
      *   Critique included? Yes.

  8.  **Final Review of the "Cleared" Case:**
      *   Claim: "No monthly fee."
      *   Reality: $5 per transaction.
      *   Procedure: Literal truth? Yes. Implicature? "Cheap/Free." Is it cancellable? Yes ("No monthly fee, but transaction fees apply").
      *   Result: Clear with qualifier.
      *   User preference: Flag it (because net impression is "free").
      *   This fits the prompt's requirement perfectly.

  9.  **Constructing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the decision procedure, stripped of the academic baggage but keeping the mechanical logic.

  ### The 15-Minute "Net Impression" Check

  **Premise:** Compliance isn't arguing about *truth* (Semantics); they are arguing about *inference* (Pragmatics). Your job is to predict what a reasonable reader infers, not just what the sentence says.

  **Timebox:** 15 minutes max per claim. If it takes longer, escalate to Legal.

  #### Step 1: The Literal Floor (Grice's Maxim of Quality)
  *   **Check:** Is the statement literally, empirically false?
  *   **Pass:** It is factually accurate.
  *   **Fail:** It is false.
  *   **Action:** If Fail, **Kill**. Do not proceed.
  *   *Note:* This is Compliance's baseline. You are looking for things that pass this but fail the next steps.

  #### Step 2: The "Therefore" Test (Implicature Generation)
  *   **Check:** Read the headline. Immediately ask: "If I read this, what do I assume is true without being told?" Write down the top assumption.
  *   **Pass:** The assumption is accurate.
  *   **Fail:** The assumption is false or misleading.
  *   **Action:** If Fail, proceed to Step 3.
  *   *Grice Translation:* This identifies the **Implicature**. We don't care about "Generalized vs. Particularized." If the reader thinks it, it counts.

  #### Step 3: The Scalar Trap (Quantity Maxim)
  *   **Check:** Does the copy use a "scalar" term? (e.g., *Up to, Free, Instant, Best, No, All*).
  *   **Mechanism:** These words create a scale. "Up to 5%" implies 5% is the norm or achievable. "No fee" implies a lack of cost generally.
  *   **Pass:** The top of the scale is the typical experience (e.g., most users get 4.5%).
  *   **Fail:** The top of the scale is an outlier (e.g., 1% of users get 4.5%).
  *   **Action:** If Fail, this is a high-risk claim. Mark for **Reword** or **Kill**.

  #### Step 4: The Contradiction Test (Cancellability)
  *   **Check:** Take your footnote or qualifier and paste it next to the headline. Does it sound like you are taking back the promise?
  *   **Example:** "Get $500* (*if you spend $10k in month 1)."
  *   **Pass:** The headline and qualifier feel like one coherent thought.
  *   **Fail:** The qualifier contradicts the headline (e.g., "Instant* (*takes 3 days)").
  *   **Action:** If Fail, **Qualifying will not save you.** Compliance will reject it because the implicature survives the qualifier. You must **Reword** the headline.

  #### Step 5: The Fix Ranking (Survival of Implicature)
  If Step 2 or 3 failed, choose a fix. Rank them by how much of the misleading "vibe" remains.

  1.  **Reword (Lowest Survival):** Change the claim to match the typical user experience.
      *   *Ex:* "Earn interest on your balance" (instead of "Up to 4.5%").
      *   *Verdict:* Safest. Kills the sales hook but clears compliance.
  2.  **Inline Qualifier (Medium Survival):** Put the constraint in the headline, not the footnote.
      *   *Ex:* "4.5% APY on balances over $10k."
      *   *Verdict:* Good balance. The reader sees the constraint *before* forming the wrong impression.
  3.  **Footnote/Asterisk (Highest Survival):** Rely on small print to cancel the implicature.
      *   *Ex:* "Up to 4.5% APY*"
      *   *Verdict:* **High Risk.** Gricean theory says you can cancel implicatures, but behavioral science says readers ignore footnotes. Compliance often rejects this because the "Net Impression" is already set by the headline. Use only for minor constraints.

  ---

  ### Test Cases

  Here is the procedure run on three common fintech claims.

  #### Case 1: "Up to 4.5% APY"
  *   **Step 1 (Literal):** True. Someone, somewhere, can get 4.5%. **Pass.**
  *   **Step 2 (Therefore):** Reader assumes: "I can get 4.5%." Reality: Only on balances >$50k, which 95% of users don't have. **Fail.**
  *   **Step 3 (Scalar):** "Up to" is a classic scalar trigger. It implies the top of the scale is the target. **Fail.**
  *   **Step 4 (Cancellation):** "Up to 4.5%* (*for balances over $50k)." Does this contradict? Yes, it makes the headline irrelevant to most.
  *   **Step 5 (Fix):**
      *   *Footnote:* Reject (Implicature survives).
      *   *Inline:* "4.5% APY on high-yield tiers." (Better).
      *   *Reword:* "Competitive rates on savings." (Safest).
  *   **Outcome:** **Flagged.** Requires Inline Qualifier or Reword.

  #### Case 2: "No Monthly Fee"
  *   **Step 1 (Literal):** True. There is no fee charged monthly. **Pass.**
  *   **Step 2 (Therefore):** Reader assumes: "This account is free to use." Reality: There are $5 transaction fees and ATM fees. **Fail.**
  *   **Step 3 (Scalar):** "No" is an absolute. It implies zero cost. **Fail.**
  *   **Step 4 (Cancellation):** "No Monthly Fee* (*other fees apply)." Does this contradict? No, it clarifies scope.
  *   **Step 5 (Fix):**
      *   *Procedure Decision:* **Cleared with Footnote.** The literal claim is strong, and the qualifier is standard industry practice.
      *   *Human Hand-off:* **FLAG FOR REVIEW.**
      *   *Why:* Even though the procedure clears it, the *Net Impression* is "Free Banking." This is the **False Negative**. The procedure treats "No Monthly Fee" as a specific claim, but the reader treats it as a holistic value proposition.
  *   **Outcome:** **Cleared by Procedure, Flagged by Human.** (This meets your requirement for a case the tool misses).

  #### Case 3: "Bank-Grade Encryption"
  *   **Step 1 (Literal):** True. You use AES-256, same as banks. **Pass.**
  *   **Step 2 (Therefore):** Reader assumes: "My money is insured/protected like a bank (FDIC)." Reality: You are a tech company, not a bank. **Fail.**
  *   **Step 3 (Scalar):** "Grade" implies equivalence. **Fail.**
  *   **Step 4 (Cancellation):** "Bank-Grade Encryption* (*not FDIC insured)." **Contradiction.** You are using security tech to imply safety, then admitting the safety net isn't there.
  *   **Step 5 (Fix):**
      *   *Footnote:* Reject (Implicature of safety survives).
      *   *Reword:* "Military-grade security standards." (Removes the "Bank" implication).
  *   **Outcome:** **Flagged.** Requires Reword.

  ---

  ### Where This Will Misfire (The "Straight Talk")

  **1. The "Cooperative" Lie**
  Grice's framework assumes the speaker is trying to be helpful (The Cooperative Principle). Marketing is *not* cooperative; it is persuasive.
  *   **The Misfire:** The procedure assumes that if a qualifier is *present*, the reader *processes* it. They don't.
  *   **The Fix:** In Step 5, treat Footnotes as "High Survival of Implicature." Assume the reader will never read them. If the headline is misleading without the footnote, the headline is non-compliant, regardless of Gricean cancellability.

  **2. Visual Hierarchy > Logical Hierarchy**
  Grice is about language. Compliance is about "Net Impression," which includes font size, color, and placement.
  *   **The Misfire:** "4.5% APY" in 48pt bold with "for new customers" in 10pt grey passes the *text* procedure but fails the *visual* reality.
  *   **The Fix:** Add a "Visual Weight" check to Step 4. If the qualifier is <50% the visual weight of the claim, treat it as non-existent.

  **3. The "No Monthly Fee" Trap (Case 2)**
  As seen in Case 2, the procedure can be gamed by literalism. "No monthly fee" is technically specific, but pragmatically holistic.
  *   **The Misfire:** The procedure separates claims into silos. Users do not.
  *   **The Fix:** This is where you need a human hand-off. If a claim creates a "Halo Effect" (makes the whole product seem better than it is), it overrides the Literal Floor.

  ### Changing the Framing: Grice vs. Relevance vs. Law

  **Should you drop Grice?**
  Yes and no.
  *   **Keep:** The concept of **Implicature** (What is suggested vs. said). This is the exact language Compliance uses ("Net Impression"). It gives your team vocabulary to argue.
  *   **Drop:** The **Maxims**. Marketing violates the Maxim of Quantity (hiding info) and Quality (spinning truth) by design. Telling copywriters to follow Grice's Cooperative Principle is asking them to stop marketing.

  **Would Relevance Theory be better?**
  **Relevance Theory** (Sperber & Wilson) argues that humans optimize for cognitive efficiency: we stop processing once we have "enough" info to form an assumption.
  *   **Why it's better:** It explains *why* footnotes fail. The reader gets the "4.5%" signal, forms the assumption "I get 4.5%," and stops processing. The footnote requires extra cognitive effort for low reward, so it is ignored.
  *   **Why it's harder:** It's harder to turn into a checklist. "Is this relevant?" is subjective. "Is this literally true?" is objective.

  **The Verdict:**
  Stick with the **Legal "Net Impression" Standard** as the *Goal*, and use **Gricean Implicature** as the *Diagnostic Tool*.
  *   Don't tell your team: "Follow Grice's Maxims."
  *   Tell them: "Identify the Implicature."
  *   If the Implicature is false, the copy is non-compliant, even if the Sentence is true.

  **What would change my mind?**
  If Compliance starts approving copy based on **disclaimers** rather than **headlines**. If they accept that a 12pt footnote cures a 48pt misleading headline, this procedure is too strict. But given your prompt, they are rightly rejecting that logic. In that environment, Grice is the only shield you have, because it proves you understand *why* it's misleading, not just *that* it's misleading.
