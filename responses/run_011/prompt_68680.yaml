prompt: |-
  I'm running a two-hour Saturday workshop on causation for about 18 people — half philosophy undergrads, half law students, and nobody's read anything on omissions beforehand. I want an activity where they run face-first into the problem of causing-by-not-doing before anyone says the phrase "causation by omission" out loud. By the end they should see that the counterfactual test they all instinctively reach for does some real work here, but leaves the case absurdly wide open.

  Here's the scenario skeleton to build on: an 84-year-old woman dies alone in her flat during a three-day heatwave. There are six candidates, each of whom failed to do something — the daughter who didn't phone, the neighbour who didn't knock, the care agency that cancelled her home visit, the pharmacist who never flagged the drug interaction, the utility that cut her air conditioning over an unpaid bill, the city that didn't open the cooling centre. Nobody did anything positive. Everyone just didn't.

  Build the game around a fixed compensation pot that the group has to divide, with rules that force them to treat at least some of those failures as genuine causes rather than as mere failures of duty. I need: a subgroup setup that makes different tables reach genuinely different splits of the same pot out of the same facts; a bargaining or scoring mechanic that doesn't need money or props I have to buy; a minute-by-minute timeline; and a debrief that maps the exact moments they got stuck onto the underlying issues — why admitting omissions seems to blow up the number of causes, and what has to do the narrowing work if it isn't the causal facts themselves.

  Then be honest with me: which of the six will they instinctively rank as "really" a cause and why the game can't prevent that, what predictably derails the thing the first time you run it, and one feature of the philosophical problem the activity flat out can't reproduce, that I'll have to supply by hand.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**
      *   **Topic:** Causation by Omission.
      *   **Audience:** 18 people (9 Philosophy Undergrads, 9 Law Students). Mixed background, no prior reading on omissions.
      *   **Duration:** 2 hours (120 minutes).
      *   **Goal:** Make them experience the problem of omissions *before* naming it. Show that the counterfactual test works but leads to absurdly wide causation. Show that narrowing requires something *other* than causal facts (norms, duties, proximity).
      *   **Scenario:** 84yo woman dies in heatwave. 6 candidates (Daughter, Neighbor, Care Agency, Pharmacist, Utility, City). All omissions.
      *   **Mechanic:** Fixed compensation pot to divide. Rules force treating some failures as causes. Subgroups must reach different splits. No money/props needed.
      *   **Deliverables:** Activity structure, timeline, debrief, honest assessment (instinctive rankings, potential derailments, limitations).

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Hook:* Counterfactual dependence ($\neg C \to \neg E$). If the daughter *had* called, would she be alive? Maybe. If the neighbor *had* knocked? Maybe. If the Prime Minister *had* flown over and sung a song? No. But if the City *had* opened the center? Yes.
      *   *The Explosion:* If we accept omissions as causes, almost *everyone* who didn't save her is a cause. The barista who didn't bring her water, the stranger who didn't check on her.
      *   *The Law vs. Philosophy Tension:* Law students look for duty of care/breach. Philosophers look for metaphysical grounding. Both need to converge on the idea that "cause" isn't just physics here; it's normative.
      *   *The "Narrowing" Work:* Since the causal facts (she died of heatstroke) are fixed, what distinguishes the Daughter from the Random Stranger? Duty, expectation, capacity, proximity.

  3.  **Design the Activity ("The Liability Lottery"):**
      *   *Core Mechanic:* Distributing a fixed sum (£100,000 imaginary compensation) among the 6 candidates based on "causal contribution."
      *   *Constraint:* They *must* distribute 100%. They cannot say "None of them caused it." This forces them to treat omissions as causes.
      *   *Subgroup Variation:* To ensure different tables reach different splits, I need to give them different *instructions* or *lenses* without telling them the lenses are different until the end.
      *   *Idea:* Assign each table a specific "Legal/Philosophical Standard" secretly.
          *   Table A: Strict Counterfactuals (But-For Test).
          *   Table B: Duty-Based (Who *should* have acted?).
          *   Table C: Capacity/Proximity (Who *could* most easily have acted?).
      *   *Wait, better idea:* Keep the instructions the same but vary the *information* slightly? No, that's too much prep.
      *   *Better Idea:* Keep the information the same, but force a *negotiation phase* between groups.
      *   *Best Idea for "Different Splits":* Divide the 18 people into 3 groups of 6. Give each group a specific *mandate* regarding the definition of cause, but don't label it philosophically.
          *   Group 1 (The Physicists): "Focus strictly on what would have changed the outcome." (Counterfactual)
          *   Group 2 (The Moralists): "Focus on who broke a promise or rule." (Normative)
          *   Group 3 (The Pragmatists): "Focus on who was best positioned to prevent it cheaply." (Efficiency/Proximity)
      *   *Actually, let's refine:* The prompt asks for a mechanic that *forces* them to treat failures as causes.
      *   *Revised Mechanic:* "The Causal Pie." Each table gets the same scenario. They must assign percentages of "Causal Responsibility" to the 6 actors. Total must equal 100%.
      *   *How to ensure different splits?* Introduce "Wildcard Cards" or "Constraint Cards" dealt to tables.
      *   *Let's go with "Role Cards":* Each table represents a different court/jurisdiction with a specific ruling precedent they must follow.
          *   Table 1: *The But-For Court* (If the action would have prevented death, it's a cause).
          *   Table 2: *The Duty Court* (Only those with a pre-existing legal duty count).
          *   Table 3: *The Capacity Court* (Those with the physical ability and proximity count).
      *   *Wait, if I give them the rules, they won't feel the tension.* I want them to run face-first into the problem.
      *   *Pivot:* All groups get the *same* instruction: "Divide the pot based on causal contribution." But, I will seed the discussion with specific "Objection Cards" that different tables have to address.
      *   *Actually, the simplest way to get different splits:* Just let them argue. Human intuition varies. But to *guarantee* it for the debrief, I should give them different *constraints* on the pot.
      *   *Let's try this:*
          *   Phase 1: Individual ranking (silent).
          *   Phase 2: Table consensus (must sum to 100%).
          *   Phase 3: "The Appeal." Tables swap verdicts and try to find holes.
      *   *To ensure different splits:* I will give each table a specific "Exclusion Rule" they don't realize is unique until the end.
          *   Table 1: You cannot assign more than 50% to any single actor.
          *   Table 2: You must assign at least 5% to every actor.
          *   Table 3: You must assign 0% to at least two actors.
      *   *No, that's artificial.* Let's stick to the prompt's request: "rules that force them to treat at least some of those failures as genuine causes."
      *   *Decision:* All groups have the same goal (divide the pot). The variation comes from the *Deliberation Rules*.
          *   Group 1 (Philosophy Heavy): Must justify using "What if?" scenarios.
          *   Group 2 (Law Heavy): Must justify using "Who owed what?"
          *   Group 3 (Mixed): Free debate.
      *   *Wait, I need to mix the students.* 9 Phil, 9 Law. 3 Tables of 6 (3 Phil + 3 Law each). This ensures mixed dialogue.
      *   *How to get different splits?* I will introduce "New Evidence" midway to only *some* tables.
      *   *Table 1:* Gets info that the Daughter *tried* to call but line was dead.
      *   *Table 2:* Gets info that the City *did* open the center but she didn't know.
      *   *Table 3:* Gets original facts only.
      *   *Actually, keep facts identical.* The prompt says "same facts." Okay. So the variation must come from the *instructions on how to judge*.
      *   *Okay, final plan on variation:* Each table is assigned a "Legal Precedent" they must apply, but the precedents are vague enough to allow interpretation.
      *   *Actually, the most robust way:* Just let them argue. The "Different Splits" requirement might be satisfied by the natural divergence of intuition once they realize the counterfactual test explodes. I will facilitate the divergence in the debrief by highlighting *why* they differed.
      *   *Wait, I can force divergence:* I will give each table a "Budget Cap."
          *   Table 1: You have 100 points.
          *   Table 2: You have 100 points, but the Utility Company is immune unless you can prove malice.
          *   Table 3: You have 100 points, but the Daughter is immune because "family isn't liable."
      *   *No, that biases the result too much.*
      *   *Let's go with the "Mandate" approach.*
          *   Table 1 Mandate: "Maximize Prevention." (Focus on who could have most easily stopped it).
          *   Table 2 Mandate: "Uphold Contracts." (Focus on who broke an agreement).
          *   Table 3 Mandate: "Strict Causation." (Focus purely on counterfactuals).
      *   *This works.* It forces different splits from the same facts.

  4.  **Drafting the Timeline:**
      *   0-10: Intro & Scenario (No theory).
      *   10-20: Individual Intuition (Silent ranking).
      *   20-50: Table Deliberation (The Pot Division).
      *   50-70: The "Explosion" Phase (Introduce the "Stranger" problem).
      *   70-90: Cross-Table Negotiation (Why did you split it that way?).
      *   90-110: Debrief & Theory Mapping.
      *   110-120: Wrap up.

  5.  **Refining the Mechanic:**
      *   Need to make sure they don't just say "It's all moral, not causal."
      *   Rule: "You are not dividing blame. You are dividing *causal contribution*. If you assign 0%, you are saying their action/inaction made no difference to the death."
      *   This forces the omission issue.

  6.  **Addressing the "Honest Assessment":**
      *   *Instinctive Rank:* Daughter and Care Agency will top. Why? Proximity + Duty.
      *   *Derailment:* Law students will dominate with "Duty of Care" talk, silencing the metaphysical confusion. Or, they will refuse to play ball and say "This is a moral question, not causal."
      *   *Missing Feature:* The activity can't reproduce the *metaphysical unease*. It feels like a policy debate. I need to explicitly point out that the *physics* didn't change between the Daughter and the City, only our *norms* did.

  7.  **Fleshing out the Details:**
      *   *Name:* "The Heatwave Tribunal."
      *   *Materials:* Paper, pens, printed scenario, printed "Mandate Cards."
      *   *The "Explosion":* Midway through, hand them a slip that says "A million other people also didn't save her. Your neighbors. The Prime Minister. Do they get a share?"
      *   *The Debrief:* Map Table 1 to Efficiency (Posner), Table 2 to Normative (Hart/Honoré), Table 3 to Counterfactual (Lewis).

  8.  **Review against Constraints:**
      *   2 Hours? Yes.
      *   18 People? Yes (3 tables of 6).
      *   Mixed Phil/Law? Yes (3 of each per table).
      *   No prior reading? Yes.
      *   Face-first into omission? Yes.
      *   Counterfactual test shown to be wide? Yes.
      *   Narrowing work identified? Yes.
      *   Honest assessment included? Yes.

  9.  **Final Polish:** Check the tone. Needs to be practical, facilitator-focused, and philosophically precise. Ensure the "Mandate Cards" are distinct enough to generate different splits but vague enough to cause friction.

      *   *Mandate 1 (The Counterfactuals):* "Assign weight based strictly on likelihood of survival if they had acted."
      *   *Mandate 2 (The Duties):* "Assign weight based on pre-existing obligations (contractual, familial, civic)."
      *   *Mandate 3 (The Capacity):* "Assign weight based on ease of intervention and cost to the actor."

      *Wait, if I give them these mandates, they won't feel the tension of the *same* test failing.*
      *Better:* Give them all the *same* instruction: "Divide based on Causal Contribution." But give them different *Constraint Cards* that represent hidden judicial biases.
      *Actually, the prompt asks for "a subgroup setup that makes different tables reach genuinely different splits... out of the same facts."*
      *If I give them different mandates, they aren't using the same reasoning. If I give them the same mandate, they might converge.*
      *Solution:* Give them the same mandate ("Causal Contribution"), but give each table a specific "Precedent Case" they must align with.
      *Case A:* A case where a doctor was liable for not treating. (Pushes toward Duty).
      *Case B:* A case where a passerby was not liable for not saving. (Pushes toward No Omission).
      *Case C:* A case where a utility company was liable for cutting service. (Pushes toward Positive Act via Omission).
      *This creates the divergence while keeping the core instruction same.*

      *Let's refine the "Explosion" moment.* I need to make sure they realize the counterfactual test makes *everyone* a cause. I will introduce the "Prime Minister" intervention in the debrief, not the activity, to keep the activity focused on the 6 candidates.
      *Actually, putting it in the activity is better.* In the negotiation phase, I will act as the "Judge" and challenge the tables: "If the Daughter is a cause because she didn't call, why isn't the Pizza Shop owner who didn't send her a free meal a cause?"

      *Okay, let's lock in the structure.*
      1. Intro/Scenario.
      2. Silent Ranking.
      3. Table Consensus (The Pot).
      4. The "Intervention" (I introduce the Prime Minister/Stranger problem).
      5. Re-evaluation (Do they change the split?).
      6. Debrief.

      *Wait, I need the subgroup setup to make them reach different splits.*
      *Okay, I will use the "Mandate" approach but disguise it as "Jurisdiction."*
      *Table 1: Jurisdiction A (Strict But-For).*
      *Table 2: Jurisdiction B (Duty-Based).*
      *Table 3: Jurisdiction C (Risk-Based).*
      *This guarantees divergence.*

