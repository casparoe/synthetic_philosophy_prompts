answer: |-
  # Workshop Plan: The Heatwave Tribunal

  **Time:** 120 Minutes
  **Participants:** 18 (3 Tables of 6: 3 Philosophy, 3 Law each)
  **Materials:** Paper, pens, printed Scenario Sheets, printed "Jurisdiction Cards" (one set per table), whiteboard/flipchart.

  ## 1. The Scenario (Handout)
  *Keep it dry and factual. No moral loading.*

  > **Case File: Estate of Mrs. Gable (Deceased)**
  > **Cause of Death:** Hyperthermia / Heatstroke.
  > **Context:** 3-day heatwave (40°C+). Mrs. Gable (84) lived alone, mobility limited. AC unit failed.
  > **The Pot:** £100,000 Compensation Fund available for distribution.
  > **The Rule:** You must distribute 100% of the pot among the six parties below based on their **causal contribution** to the death. You cannot leave money unassigned. You cannot assign 0% to everyone.
  >
  > **The Candidates:**
  > 1.  **The Daughter:** Did not phone for 5 days. Lived 30 mins away.
  > 2.  **The Neighbour:** Did not knock/check. Lives next door. Heard no noise.
  > 3.  **The Care Agency:** Cancelled scheduled home visit due to staffing. Contracted to visit 2x/week.
  > 4.  **The Pharmacist:** Dispensed diuretic + anticholinergic. Did not flag heat-risk interaction.
  > 5.  **The Utility Co:** Cut AC power for unpaid bill 2 days prior. Protocol allows disconnection in heatwaves.
  > 6.  **The City Council:** Did not open the designated Cooling Centre. Policy says "open if temps exceed 42°C" (peak was 41.5°C).

  ---

  ## 2. Minute-by-Minute Timeline

  ### 00:00 – 00:15 | Setup & Silent Intuition
  *   **Facilitator:** Welcome. No mention of "omissions," "counterfactuals," or "norms."
  *   **Instruction:** "You are a tribunal. Mrs. Gable is dead. There is money. Your job is to assign percentages of *causal contribution* to these six parties. Not blame. Not fault. *Cause.* If you assign 0%, you are saying their inaction made no difference to the physical fact of her death."
  *   **Activity:** 5 minutes silent individual ranking. 10 minutes table introduction (Phil/Law mix).

  ### 00:15 – 00:45 | Table Deliberation (The Split)
  *   **Constraint:** Tables must agree on a single split summing to 100%.
  *   **The Divergence Mechanic:** Hand each table a sealed **Jurisdiction Card**. They must follow the rule on the card to determine "cause," but they cannot tell other tables what rule they have until the end.
      *   **Table 1 (The Counterfactuals):** "Assign weight based strictly on probability of survival if the actor had intervened. If an action *would likely* have saved her, it is a cause."
      *   **Table 2 (The Duties):** "Assign weight based on pre-existing obligations. A failure is only a cause if there was a prior duty (contract, family, statute) to act."
      *   **Table 3 (The Capacity):** "Assign weight based on 'Least Cost Avoider.' Who could have prevented this most easily/cheaply? High capacity = High causation."
  *   **Facilitator Role:** Circulate. If a table says "This isn't causation, it's duty," reply: "Your Jurisdiction Card defines what counts as a cause in this court. Follow the card."

  ### 00:45 – 01:05 | The "Explosion" Intervention
  *   **Facilitator:** Stop the tables. Announce a "New Legal Challenge."
  *   **Handout:** A slip of paper to *all* tables.
      > **Addendum:** Evidence suggests millions of other omissions occurred. The Prime Minister did not fly over to rescue her. The local bakery did not deliver free ice cream. A random pedestrian did not check her mailbox. Under your current definition of cause, do these parties get a share of the pot?
  *   **Task:** 10 minutes to discuss. Does your split change? Do you have to exclude the new parties? If so, *on what grounds* without contradicting your Jurisdiction Card?
  *   **Goal:** This forces the Counterfactual table to realize their test makes *everyone* a cause. It forces the Duty table to explain why duties aren't just causal facts.

  ### 01:05 – 01:20 | The Verdict Exchange
  *   **Activity:** Tables reveal their % splits on the whiteboard.
  *   **Observation:** They will likely be radically different.
      *   Table 1 (Counterfactual) will likely spread wealth thinly or struggle with the "Millions" problem.
      *   Table 2 (Duty) will likely concentrate on Daughter/Agency/Utility.
      *   Table 3 (Capacity) might target the City or Neighbour.
  *   **Discussion:** 15 minutes. "Table 1, why did you give the City 20%? Table 2, why did you give them 0%?"

  ### 01:20 – 01:50 | Debrief & Theory Mapping
  *   **Map the Stuck Points:**
      1.  **The Counterfactual Test:** Acknowledge Table 1's struggle. "If she would be alive if X happened, X is a cause." This works for the Daughter, but also the Prime Minister. *Conclusion:* Counterfactual dependence is necessary but not sufficient.
      2.  **The Normative Injection:** Highlight Table 2. They didn't find new *facts* about the heat; they used *norms* (contracts, family) to narrow the causes. *Conclusion:* Causation in law/morals isn't just physics; it's selective.
      3.  **The "Doing" vs. "Not Doing":** Ask: "Did the Utility *kill* her, or just *fail to save* her?" If both are causes, what's the difference between cutting power (act) and not opening a center (omission)?
  *   **Philosophical Payoff:** Introduce the term **Causation by Omission**. Explain that the "narrowing work" is done by **normality conditions** (Hart & Honoré) or **default vs. deviant states** (McGrath). The world "normally" includes daughters calling and utilities providing power; it doesn't "normally" include Prime Ministers rescuing citizens.

  ### 01:50 – 02:00 | Wrap Up
  *   **Reading List:** Hand out 3 papers (Hart & Honoré excerpt, Lewis on Causation, Moore on Omissions).
  *   **Final Thought:** "You didn't solve the case. You solved the *selection* problem. Next week we ask: Is selection enough, or is omission causation metaphysically fake?"

  ---

  ## 3. Honest Assessment (Facilitator Notes)

  ### 1. Which candidate will they instinctively rank as "Really" a cause?
  **The Daughter and The Care Agency.**
  *   **Why:** They combine **proximity** (physical or relational) with **expectation**. Even Table 1 (Counterfactuals) will struggle to give the Daughter 0% because the counterfactual "If she called, mom likely lives" is strong.
  *   **The Game's Limit:** You cannot prevent this. It is the "salience" bias. The activity *relies* on this instinct to make the divergence painful. When Table 2 gives the Daughter 40% and Table 1 gives her 10% (because the Pharmacist's drugs were also lethal), the friction reveals that "cause" is doing different work for different people.

  ### 2. What predictably derails this the first time?
  **The Law Students will try to "Solve" the case.**
  *   **The Risk:** Law students are trained to find the *liable* party, not the *causal* party. They will conflate causation with negligence immediately. They will say, "The Utility can't be a cause because they had a right to cut power."
  *   **The Fix:** You must be a hardnosed Facilitator. "I am not asking who is liable. I am asking what *made* her die. If a tiger ate her, the tiger is the cause even if it had a right to eat her. Stick to the mechanics of the death."
  *   **Second Risk:** The Philosophy students will try to dissolve the question. "There is no such thing as omission causation."
  *   **The Fix:** "For the purpose of this exercise, you *must* distribute the money. You are not allowed to say 'none of them.' You must treat omissions as causes to play the game."

  ### 3. One feature the activity flat out can't reproduce (You must supply this)
  **The Metaphysical Unease of "Nothingness."**
  *   **The Gap:** The game treats omissions as "events" that can hold percentages. It gamifies the selection problem. It does *not* reproduce the visceral philosophical worry that **nothing cannot cause something.**
  *   **Why it matters:** The students will walk away thinking, "Okay, we just need better rules to filter causes." They won't necessarily feel the ontological weirdness that we are treating a *non-event* (the daughter not calling) as a force that pushed the world into a state (death).
  *   **How to Supply It:** In the debrief, stop the talk of "rules" and ask: "Physically, what did the Daughter *do* to kill Mrs. Gable?" When they say "Nothing," press it. "If she did nothing, where is the energy transfer? Where is the mechanism?"
  *   **The Point:** You need to explicitly state: "The activity showed you how we *select* causes. It didn't show you why calling 'nothing' a 'cause' feels like a category error. That's the metaphysical problem. The selection problem is practical; the existence problem is ontological. We solved the practical one today. The ontological one is for the reading."

  ---

  ## 4. Why This Works for Your Mix
  *   **Law Students:** They get to exercise "Duty" and "Proximity" (Table 2 & 3), which feels like legal reasoning, but you reframe it as "Causal Selection."
  *   **Phil Students:** They get to wrestle with the Counterfactual Test (Table 1) and the "Explosion" problem, which is pure metaphysics of causation.
  *   **The "Face-First" Moment:** Happens at minute 50 (The Explosion Intervention). They will have just committed to a split based on "But-For" logic, and then you hand them the Prime Minister slip. The cognitive dissonance is immediate. They *know* the PM isn't a cause, but their rule says he is. That is the exact moment the concept of "Omission" cracks open.
