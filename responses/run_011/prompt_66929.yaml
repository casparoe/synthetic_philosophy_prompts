answer: |-
  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Respiratory Therapy (Frontline Representative)
  **DATE:** Thursday Meeting Prep
  **SUBJECT:** Case Consultation: Mr. H (81M, Dementia, Aspiration Pneumonia)

  **Purpose of this Memo:**
  We are currently split on this case. Half of us feel bound by the legal document; half of us feel bound by the human being in the bed. I believe we are arguing past each other because we are treating this as one decision, when it is actually a conflict between two different people who happen to share a body. This memo proposes a specific path forward for Mr. H, a tool for future nights, and a policy question we need to stop avoiding.

  ### 1. The Core Ethical Conflict: "The Two Patients"
  We have a 59-year-old man (the "Paper Patient") who signed a directive in 1999. He feared a life without cognition, dignity, or recognition. He explicitly requested no treatment in this scenario.

  We have an 81-year-old man (the "Bed Patient") who currently experiences joy. He sings, he enjoys food, he connects emotionally with caregivers. He is not suffering in the way the Paper Patient feared.

  The daughter is honoring the Paper Patient. The attending and memory care staff are advocating for the Bed Patient. Neither side is wrong. The Paper Patient has the legal right to refuse; the Bed Patient has the moral right to not be "killed" while he is content.

  ### 2. Committee Recommendation: Time-Limited Trial of Comfort
  We cannot ethically ignore the directive, but we cannot ethically ignore the observed quality of life. Therefore, the committee recommends a **72-Hour Time-Limited Trial of Antibiotics.**

  *   **The Goal:** Symptom management and reversal of acute distress (dyspnea/fever), *not* long-term life extension.
  *   **The Condition:** We treat the pneumonia to see if he returns to his baseline (singing, eating, engaging).
  *   **The Hard Stop:** If there is no clear clinical improvement by **Sunday at 0800**, we cease antibiotics and transition immediately to Comfort Measures Only (Hospice).
  *   **Rationale:** This respects the Paper Patient's wish to "let it end" if his body is giving up. It respects the Bed Patient's current capacity for joy by giving him a chance to recover from this acute infection. It protects the daughter by ensuring her father did not suffer from air hunger, regardless of the outcome.

  ### 3. Instructions for Floor Nursing (By Sunday)
  *   **Current Order:** IV Antibiotics x 72 hours.
  *   **Monitoring:** Focus on work of breathing and ability to swallow/enjoy oral intake.
  *   **Review Date:** Sunday 0800.
  *   **Contingency:** If fever persists or respiratory distress increases by Sunday, the presumption shifts to the original Advance Directive. The plan becomes comfort care only (morphine for air hunger, no further antibiotics).
  *   **Family Communication:** Frame this to the daughter not as "overriding" her father, but as "ensuring he doesn't suffocate while we decide." Acknowledge her promise. Tell her: *"We are going to make sure he isn't suffering from the infection. If he gets better, we will have to talk again about what comes next. If he doesn't, we will honor his wish to let go."*

  ### 4. The "2 AM Test" (For Future Cases)
  When there is no lawyer and no ethics committee available, use this heuristic to decide whether to honor an old directive vs. current presentation:

  **The "Saturday Morning" Test:**
  *Ask: If we succeed in treating this acute problem, is Saturday morning a day the patient in the bed would enjoy?*
  *   **Yes:** Treat the acute issue, then reassess long-term goals. (The Bed Patient's current capacity for joy outweighs the Paper Patient's hypothetical fear).
  *   **No:** Honor the directive. (The treatment only prolongs the state the Paper Patient feared).

  *Secondary Check:* Does the treatment restore a capacity (like breathing comfortably) or does it only maintain a deficit (like permanent unconsciousness)? If it restores capacity for joy, treat. If it maintains a state of non-being, stop.

  ### 5. Policy Question: Flagging "Stale" Directives
  **Proposal:** Should the EMR automatically flag Advance Directives older than 10-15 years for a re-affirming conversation while the patient still has capacity?

  **My Recommendation:** **Yes, we should flag them.**
  People change. A 50-year-old's view on death is often different from a 70-year-old's. A directive signed before a person has actually experienced chronic illness is a hypothesis, not a decision.

  **The Honest Objections (Why we haven't done this yet):**
  1.  **The "Expiration Date" Fear:** Patients may feel their wishes "expire," creating anxiety that they must constantly re-sign documents to be heard. We must frame this as "checking in," not "renewing a subscription."
  2.  **Paternalism:** It implies the hospital knows their wishes better than they do. We risk pressuring patients to update directives to match *our* comfort levels (i.e., treating more) rather than theirs.
  3.  **Logistics:** Who has the conversation? PCPs are already overburdened. Without a dedicated workflow, this becomes a checkbox exercise that nobody actually does.

  **Conclusion:**
  For Mr. H, we treat for 72 hours. We honor the daughter's grief and the father's past fear, but we prioritize the present human's observable joy. If he doesn't bounce back by Sunday, the Paper Patient gets the final vote.

  Let's discuss this at 1400.
