answer: |-
  1. Open by asking the room to list concrete signs of anger on the whiteboard without labeling them 'mental' or 'physical', ensuring everyone agrees on the phenomena before arguing about their nature. If you skip this, the CBT practitioners and the actor will talk past each other using the same words to mean different phenomena.

  2. Present the case of the man who snaps while denying anger, then explodes later without external cause, and ask each faction to identify exactly *when* the anger began according to their framework. If you don't pin them to a timestamp, the debate will dissolve into vague agreements that everyone is partly right.

  3. When the CBT group claims he was judging unconsciously and the actor insists the body knew first, intervene only to ask if the man could have argued himself calm or faked calmness earlier, heading off the 'argue out of fear' and 'fake it' misconceptions before they solidify. If you referee this instead of letting them clash, you rob the curious participants of seeing where the theories actually break.

  4. Force a vote on whether the man was lying to his partner or mistaken about himself, requiring the CBT practitioners to defend unconscious appraisal and the actor to defend unconscious bodily states. If you skip this, the session ends with a stalemate rather than a clarified disagreement about self-knowledge.

  5. Close by asking whether changing the man's body or his thoughts would have stopped the explosion, while stating aloud that you are bracketing the neuroscience of triggers and the ethics of emotional regulation for another night. If you skip this, participants will leave thinking you solved the metaphysics rather than just mapped the terrain.
