      *   **Criteria for Ranking:** (i) Defect vs. worse, (ii) Effect on words/recommendation, (iii) Group's control, (iv) Tractability for 9 laypeople, (v) What would move the ranking.
      *   **User's Distinction:** Apologies changing *description of the past* (durable) vs. *obligations going forward* (revocable). User claims liability disclaimer blocks the second, leaving the first intact.

  2.  **Evaluate the Issues (1-8):**
      *   1. *Liability Disclaimer vs. Sincerity:* High stakes. If the disclaimer makes it "not an apology," the core deliverable fails. Affects text directly. Tractable? Hard philosophically, but legally fixed by counsel.
      *   2. *Recipient (Dead vs. Descendants):* Affects wording ("to the survivors" vs "to the memory"). Defect if ignored? Yes, alienates recipients. Tractable? Moderate.
      *   3. *Specificity (Naming Acts):* Affects text length and clarity. Defect? Weakening if too vague. Tractable? Easy (historical record exists).
      *   4. *Apology vs. Redress (Substitute vs. Alongside):* Critical for the "recommendation" part of the deliverable. Defect if ignored? Yes, makes apology look hollow. Tractable? Hard (budget/politics).
      *   5. *Bundling (Two Groups):* Political dynamite. Affects structure (one resolution vs. two). Defect? Fatal if one group walks away. Tractable? Hard (negotiation).
      *   6. *Durability/Retraction:* Philosophical/Legal. Mostly outside group control (future legislatures). Defect? Cosmetic (can't control future). Tractable? Not a group task.
      *   7. *Apology Inflation:* Meta-concern. Doesn't change text. Defect? None. Tractable? N/A. Drop.
      *   8. *State Continuity (Same Agent):* Philosophical. Doesn't change text much (state apologizes regardless). Defect? Cosmetic. Tractable? Hard/Philosophical. Drop/Fold.

