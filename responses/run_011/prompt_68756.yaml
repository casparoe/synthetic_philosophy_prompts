  I'm a high school senior, and my philosophy seminar paper concerns Wittgenstein's suggestion that the activities we all call games are joined by nothing more than a shifting network of overlapping similarities rather than by any single feature they share. Two things I want to get right before I draft. First, I intend to argue that this observation settles borderline disputes: if no shared criteria fix where the concept stops, then when two people disagree about whether, say, a crossword puzzle or a piece of improvisational theater counts as a game, there is no fact of the matter for them to be disagreeing about, and the only honest resolution is to stipulate a definition. Second, to keep meaning determinate at all, I want to propose a repair: for each ordinary term, list a set of paradigm cases, rank everything else by its similarity to those paradigms, and set a cutoff that assigns every new case to one side or the other. Is my inference from family resemblance to the merely verbal status of such disputes sound, and would the repair be something Wittgenstein could accept, or does it quietly undo the point I am trying to make with it? Please answer in exactly five numbered points, each one or two sentences long, with no introduction and no conclusion.
