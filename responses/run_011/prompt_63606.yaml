  ### Analysis of Logical Interlocks

  Your package rests on a central engine: **Claim 1** (Superrationality $\subseteq$ CDT via common causal structure) drives the specific verdicts in **Claim 4** (Platonia) and **Claim 5** (Luring). Claim 1 asserts that shared procedure implies shared causal ancestry of the choice. **Claim 2** acts as a gatekeeper, determining when this causal link is active based on empirical evidence of similarity.

  **Claim 3** (Uniqueness) is a constraint on the output of this engine: if the inputs (procedure + info) are identical, the output (act) must be identical. **Claim 7** (No Genuine Loss) is the philosophical shield derived from Claim 1; if the causal structure makes the cooperative outcome counterfactually impossible given your act, forgoing it is not a loss.

  The critical dependency lies between **Claim 1** and the treatment of randomness. Claim 1 implies that if the "procedure" is the same, the "output" is the same.
  *   In **Claim 4**, you enforce this strictly: same procedure $\rightarrow$ same deterministic output (or same correlated random output). This kills the mixed strategy in Platonia.
  *   In **Claim 5**, you implicitly relax this: same procedure $\rightarrow$ same *probability distribution*, but independent realizations. This allows the mixed strategy in Luring to generate the necessary statistical aggregate ($N$ entries).

  **Claim 6** attempts to buffer **Claim 3** against empirical variance, arguing that different reference class estimates constitute different "information." This makes Claim 3 compatible with Claim 6 *only if* "information" is defined broadly enough to include subjective priors about the reference class.

  The package hangs on whether "same procedure" in Claim 1 entails "same physical act" (Claim 4) or "same decision function" (Claim 5). Currently, you apply the former to Platonia and the latter to Luring without explicit justification for the switch.

  ---

  ### Consistency Audit

  Here are the genuine tensions ranked by severity.

  #### 1. The Mixed-Strategy Asymmetry (Claims 1, 4, vs. 5)
  **Severity: Fatal.**
  This is the structural fault line in your thesis. Claim 1 states that choices share a common cause in the procedure. In Claim 4, you argue this precludes independent random draws in Platonia ("same procedure... produces the same output"). Consequently, a mixed strategy (1/20) collapses into "All Send" or "None Send," yielding zero value.
  However, in Claim 5, you endorse a mixed strategy (1/$N$) for the Luring Lottery. For this to work as described (generating $\approx N$ total entries), the random draws across the population must be *uncorrelated*. If your Claim 1 logic held in Luring as it does in Platonia, all superrational agents would generate the same random number, resulting in either "All Enter" (Prize/$N$) or "None Enter" (0). The expected value calculation you endorse in Claim 5 relies on the statistical independence of acts, which Claim 4 explicitly denies is available to superrational agents.
  **Repair:** You must align the treatment of randomness. Either independent seeds are available (revising Claim 1/4) or they are not (revising Claim 5).
  **Cost:** If you allow independent seeds to save Claim 5, you lose the "Don't Send" verdict in Platonia (Claim 4). If you enforce correlated outputs to save Claim 4, the Luring solution fails (Claim 5).

  #### 2. The Uniqueness vs. Sensitivity Tension (Claims 3 vs. 6)
  **Severity: Moderate.**
  Claim 3 asserts that agreement on premises and information necessitates agreement on the act; disagreement implies error. Claim 6 asserts that different estimates of the reference class lead to different acts, neither of which is mistaken.
  **Repair:** This is repairable by defining "information" in Claim 3 to include "estimates of the reference class."
  **Cost:** This weakens the normative bite of Claim 3. If "information" includes subjective priors about who is superrational, then two agents can disagree on the act without either making a logical mistake, merely holding different empirical beliefs. This dilutes the "rationality assumption" you cite in Claim 3.

  #### 3. The "No Genuine Loss" Shield (Claim 7 vs. Standard CDT)
  **Severity: Low.**
  Claim 7 asserts superrationality never demands a genuine loss because the forgone outcome was never available. Standard CDT often admits that agents end up with less money than they could have (e.g., in Newcomb problems, CDT gets \$1,000 while EDT gets \$1,000,000).
  **Repair:** Clarify that "available" is relative to the causal structure modeled in Claim 1.
  **Cost:** This risks begging the question. Critics argue the cooperative outcome *was* causally available; you are defining it out of existence by stipulating the causal graph in Claim 1. This is a philosophical cost, not a logical inconsistency, but it invites the charge that your "CDT Absorption" is merely CDT with a rigged graph.

  ---

  ### Dissolving Contradiction: Claims 3 and 6

  **The Apparent Contradiction:**
  Claim 3 states that if two superrational thinkers disagree on the act, one is mistaken. Claim 6 states that two readers can reason impeccably yet do different things based on different estimates of the reference class. Superficially, Claim 6 violates Claim 3.

  **Why It Dissolves:**
  This tension dissolves if you treat the "estimate of the reference class" as part of the **information** set in Claim 3, rather than part of the **reasoning procedure**.
  Claim 3 conditions uniqueness on sharing "premises and the information." Claim 6 explicitly hinges on the agent's *expectation* of how many readers will respond. If Agent A estimates 100 respondents and Agent B estimates 10,000, they possess different information (or different priors treated as informational inputs). Therefore, they are solving different decision problems. Claim 3 is not violated because the antecedent condition ("share... the information") is not met.
  **Principled Difference:** This distinguishes your package from a rigid logical determinism. It allows superrationality to be sensitive to empirical uncertainty without collapsing into relativism. The "mistake" in Claim 3 applies only to the *processing* of the information, not the *source* of it.

  ---

  ### The Single Cheapest Revision

  **The Revision:**
  Modify **Claim 1** to distinguish between the **Decision Function** and the **Physical Act**.
  *Current:* "When a group of agents is running the same decision procedure, their choices share a common cause... same procedure on the same inputs produces the same output."
  *Revised:* "When a group of agents is running the same decision procedure, their **strategies** share a common cause. The procedure maps (Information + Private Random Seed) $\rightarrow$ Act."

  **Why It Is Cheapest:**
  This preserves your core theoretical commitment (Claim 1: Superrationality $\subseteq$ CDT) because standard CDT readily handles mixed strategies and private randomness. It saves Claim 5 (Luring) without modification, as the statistical aggregate relies on independent seeds. It preserves Claim 2 (Empirical Contingency) and Claim 7 (No Loss). It requires the least rewriting of your positive results.

  **Impact on Case Verdicts:**
  1.  **Platonia (Claim 4):** You must abandon the "Don't Send" verdict. If agents share the *function* "Send with probability 1/20" but utilize private random seeds (per the revision), the probability of exactly one sender becomes positive ($\approx 37\%$). The superrational verdict shifts to the mixed strategy. You lose the "deterministic reasoning is decisive" point, but you gain a consistent theory.
  2.  **Luring (Claim 5):** This verdict remains intact. The recommendation to estimate $N$ and randomize with probability $1/N$ is validated as the correct application of the shared decision function.

  **Impact on Polemics (Claim 3):**
  You must weaken the phrasing of Claim 3 slightly.
  *Current:* "Agents... must land on the same act."
  *Revised:* "Agents... must land on the same **decision function** (mixed strategy)."
  If two agents adopt the same 1/20 strategy but one Sends and one Doesn't due to private coin flips, they have not disagreed on *what to do* (the policy), only on the outcome of the noise. This preserves your polemic against critics: if two thinkers disagree on the *strategy* (e.g., one says 1/20, one says Don't Send), one is still mistaken. You lose the ability to call the *act* itself a marker of error, but you retain the ability to call the *reasoning* a marker of error. This is a negligible cost for securing the consistency of the entire package.
