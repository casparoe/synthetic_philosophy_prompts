answer: |-
  Here is an assessment of your case and specific recommendations for sharpening it, followed by the verdict analysis and the timing problem.

  ### 1. Diagnosing and Sharpening the Case

  Your sketch is strong, but it currently leans too heavily on empirical success, which risks making the programme look genuinely progressive rather than troublingly degenerate. To create the friction you want—where students feel the framework strain—you need to decouple **empirical progress** (novel predictions confirmed) from **theoretical progress** (unification under the positive heuristic).

  **The Problem:** In your current draft, the auxiliaries imply novel facts that are observed. By Lakatos's strict definition, this counts as a progressive problemshift. If you leave it there, the "correct" answer is simply "This is a progressive programme," and the tension evaporates. Scientists might find it annoying, but logically it passes.

  **The Fix:** You need to make the auxiliaries **ad hoc$_3$** in a way that feels visceral to working scientists, even if they technically yield novel predictions. The key is to ensure the novel predictions are **disconnected from the Hard Core**.

  **Load-Bearing Moves to Keep/Adjust:**
  1.  **The Dormant Positive Heuristic (Keep & Emphasize):** The three founding steps (carrier, survival, dose-law) must remain completely unfulfilled after 30 years. This is crucial. It means the *engine* of the programme is dead, even if the *vehicle* is moving.
  2.  **The "Oracle" Auxiliaries (Adjust):** The auxiliaries (buffering, thermal window, etc.) should predict novel phenomena, but they must **not** be derived from the Hard Core or the Positive Heuristic. They should be phenomenological patches.
      *   *Modification:* Specify that the auxiliaries are mathematical or statistical regularities that predict *where* the effect appears, but explicitly **contradict** the tentative mechanisms proposed in the Positive Heuristic. For example, the "thermal window" auxiliary predicts the effect vanishes at 25°C, but every proposed "physical carrier" in the heuristic requires 25°C to stabilize.
      *   *Why:* This makes the auxiliaries look like they are saving the phenomena *despite* the theory, not *because* of it. It creates a "Ptolemaic" feel: the epicycles work, but they contradict the physics of the spheres.
  3.  **The "No Rival" Constraint (Keep):** This is essential for blocking the easy exit.

  **Revised Scenario for the Handout:**
  *   **Hard Core:** Stress leaves a non-genomic mark in meristem; mark survives bottleneck; biases offspring.
  *   **Positive Heuristic:** Find the molecule; show it survives meiosis; derive the dose-law. (Status: 30 years, 0/3 achieved. Every proposed molecule was falsified.)
  *   **Protective Belt:** To save the core from falsification, researchers add auxiliaries (e.g., "The mark is erased by Enzyme X unless Temperature Y is present").
  *   **The Kicker:** These auxiliaries successfully predict novel data (e.g., "If we grow plants at Temp Y, the effect returns"), **BUT** each new auxiliary makes the Hard Core mechanism *less* plausible physically. The belt saves the core empirically while strangling it ontologically.
  *   **Result:** The programme is **empirically progressive** (novel facts confirmed) but **theoretically degenerating** (the core is becoming increasingly implausible and disconnected from the predictive machinery).

  This forces students to choose: Is Lakatos's criterion of "excess empirical content" sufficient, or does the *source* of that content (the heuristic vs. the belt) matter?

  ### 2. The Verdict and the No-Rival Problem

  **The Lakatosian Verdict:**
  Lakatos's machinery licenses a split verdict here, which is exactly where you want your students to struggle.
  *   **Intrinsic Appraisal:** The programme is **degenerating**. A problemshift is progressive only if it leads to the discovery of *new facts* via the *positive heuristic*. Here, new facts are discovered via *ad hoc* auxiliaries that do not flow from the core. The "theoretical progress" condition is failed because the heuristic is stagnant.
  *   **Comparative Appraisal:** The programme is **rationally mandatory**. Lakatos insists it is irrational to abandon a programme unless a better one exists. Since mainstream genetics treats the data as noise and offers no account, there is no rival.

  **The Tension:**
  This case drives a wedge between **methodological rationality** (don't pursue degenerating shifts) and **strategic rationality** (don't abandon ship without a lifeboat).
  *   **Intrinsic vs. Comparative:** Lakatos tries to have it both ways. He wants degeneracy to be an intrinsic property (so we can identify bad science) but abandonment to be comparative (so we don't kill good science prematurely). Your case shows these coming apart. The programme is intrinsically "bad" (degenerating) but comparatively "necessary" (no rival).
  *   **Teaching Point:** Ask your students: "If you were a grant reviewer, do you fund this?" If they say yes, they are prioritizing the 'no rival' clause. If they say no, they are prioritizing the 'degenerating' clause. Lakatos gives them permission to do either, which reveals a gap in his normative force.

  ### 3. The Timing Problem (Feyerabend's Objection)

  **The Issue:**
  Feyerabend argues that any degenerating programme can be declared progressive if you wait long enough for a lucky break. If your students say "Wait another 10 years," how do you judge them wrong *now*?

  **Do Not Add a Neutral Category:**
  Adding a category like "blocked" or "suspended" undermines the normative bite of Lakatos's methodology. It turns a prescriptive tool into a descriptive label. If everything can be "blocked" rather than "degenerating," the distinction collapses.

  **The Repair:**
  Frame the timing issue as a problem of **resource allocation** and **opportunity cost**, not just logical appraisal.
  *   **The Argument:** Lakatosian rationality isn't just about truth; it's about the efficient growth of knowledge. A programme that is empirically successful but heuristically stagnant consumes resources (grad students, grants, lab space) that could be spent on developing a rival.
  *   **The "Credit Limit":** Tell your students to treat the Positive Heuristic as a line of credit. The founders borrowed against future mechanistic discovery. Thirty years of zero mechanistic progress means the credit limit is reached.
  *   **Addressing Feyerabend:** Feyerabend is right that the verdict is provisional, but wrong that "waiting" is cost-free. The verdict at Year 30 is different from Year 10 not because the logic changed, but because the **opportunity cost** of sticking with a heuristic-less programme has compounded.
  *   **Tutorial Prompt:** Ask them: "At what specific year does it become irrational to continue, given that every year spent here is a year *not* spent finding the actual mechanism?" This forces them to grapple with the fact that Lakatos provides a logic of appraisal, but not a calculus of risk.

  **Summary for the Handout:**
  1.  **Emphasize the disconnect:** The auxiliaries predict successfully, but they contradict the attempted mechanisms of the Positive Heuristic.
  2.  **Highlight the wedge:** Intrinsic degeneracy vs. Comparative necessity (no rival).
  3.  **Reframe Timing:** It's not about "truth" yet; it's about the diminishing returns on investment in a heuristic that isn't paying out.

  This setup prevents them from reciting definitions. They have to weigh empirical success against theoretical emptiness, and methodological rules against practical constraints. That is where the strain happens.
