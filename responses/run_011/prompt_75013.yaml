      2.  Highlight the 4 vs 8 vs 5 triangle as the metaphysical wreck.
      3.  Highlight 6 vs 1 as the case-specific wreck.
      4.  Highlight 7 vs 4 as the structural wreck.
      5.  Recommend killing "Concept Pluralism" (4) in favor of "Criterion Pluralism."

  8.  **Final Polish:** Ensure the tone matches a peer review/audit. No fluff.

      *(Wait, one nuance)*: Point 3 says "I'd defend that as principled rather than as a cheap proxy." This suggests the user thinks Diagnosability *is* the definition in practice, not just evidence. This clashes with 1 (Historical Connection). If I belong by history, why does a trait settle it? If the trait reverses, am I out? I need to flag 1 vs 3 as a secondary tension.

      *Okay, prioritizing:*
      1.  4 vs 8 (Direct contradiction on "sense").
