answer: |-
  ### Brainstorming and Parameter Justification

  To replicate an information cascade without triggering conformity biases, we must isolate *informational* influence from *normative* influence. The room layout aids this: the four round tables at the back are isolated islands; the tiered seating holds observers who must remain silent. The critical design choice is preventing "show-offs" (students deliberately breaking the chain to signal independence). We solve this by separating private belief from public action on a collected slip. If a student deviates from the rational herd but records a private belief matching the herd, the deviation is exposed as performative. If they record a private belief matching their signal but public action matching the herd, we capture the cascade.

  **Parameters:** We use the Anderson and Holt (1997) urn design. Two states, Red (R) and Blue (B), determined by coin flip per table. Urn R contains 2 Red chips, 1 Blue. Urn B contains 1 Red, 2 Blue. Signal accuracy is 2/3.
  **Players:** 24 players (6 per table). 2 students act as "Auditors" (circulating to collect sheets, ensuring silence).
  **Cascade Condition:** A cascade begins when the difference between public Red and Blue guesses reaches 2. With 2/3 accuracy, if Players 1 and 2 both guess Red, Player 3's private signal (even if Blue) is outweighed by the history. The posterior probability favors Red (2/3 vs 1/3). Thus, conditional on a uniform history forming by Player 2, following the herd is strictly optimal from Player 3 onward. We cannot guarantee a cascade forms at P3 without rigging signals (which destroys validity), but we ensure the *threshold* for rational herding is reachable then.
  **Ex Ante Probability of Wrong Cascade:** If the true state is Red, a wrong cascade (on Blue) occurs primarily if P1 draws Blue (1/3) and P2 draws Blue (1/3). Probability = 1/9 ≈ 11%. Later paths exist but are diminishing. Approximately one-third of all cascades will be wrong.
  **Preventing Disruption:** Strict turn-taking enforced by the TA. Sheets collected immediately after each round. No discussion until the debrief.

  ### The Activity: "The Urn Game"

  **Mechanics:**
  Each table represents a independent world. A coin flip determines the True State (Red or Blue). An opaque cup (the Urn) contains 3 chips matching the state (e.g., 2 Red, 1 Blue for State Red). Players sit numbered 1–6. Player 1 draws a chip, looks at it, returns it, shakes the cup. Player 1 records their *Private Belief* (what they think the State is) and *Public Guess* (what they announce). Player 2 observes Player 1's Public Guess, then draws, records, and announces. This continues to Player 6.

  **Computation Key (for students):**
  *   **No History:** Follow your chip.
  *   **History Matches Your Chip:** Follow the herd (and your chip).
  *   **History Conflicts (e.g., 2 Reds vs. your Blue):** Ignore your chip. Follow the history.
  *   **History Tied (1 Red, 1 Blue):** Follow your chip.

  **Second Act (Fragility):**
  After Round 1, we reveal a "Provenance Shock." At one table, Player 1 was privately instructed *before the game* to announce the opposite of their chip. This injects noise into the foundation. The class must recalculate whether the subsequent herd was rational.

  **Stakes:**
  No money. We use "Epistemic Merit Points." The table with the highest accuracy (sum of correct Public Guesses) earns the right to select one seminar reading topic for Week 10. Individual points are awarded for aligning Private Belief with Bayesian optimality (checked via sheets), rewarding honesty over conformity.

  ### Materials List (Per Table)

  *   1 Opaque cup (Urn).
  *   3 Poker chips (2 Red, 1 Blue OR 1 Red, 2 Blue, determined by state).
  *   6 Decision Slips (pre-numbered 1–6).
  *   1 Pen.
  *   1 State Card (kept hidden by TA until end).
  *   1 Instruction Sheet (verbatim below).

  **Total Class Materials:**
  *   4 Cups, 12 Chips (mix), 24 Decision Slips, 4 Instruction Sheets.
  *   2 Auditor Clipboards (for the 2 non-playing students).
  *   1 Coin (for TA).

  ### Verbatim Instruction Sheet

  **SEMINAR ACTIVITY: OBSERVATIONAL LEARNING**

  **DO NOT COMMUNICATE VERBALLY OR BY GESTURE.** Violation disqualifies your table from points.

  **THE GOAL:** Maximize your table's accuracy. You earn points if your **Public Guess** matches the **True State** of your table's Urn. You earn bonus points if your **Private Belief** matches the Bayesian optimal guess (checked later).

  **THE PROCESS:**
  1.  **Order:** Play proceeds strictly from Seat 1 to Seat 6.
  2.  **Draw:** When it is your turn, draw one chip from the Urn. Look at it. **Return it** and shake the Urn.
  3.  **Record:** On your slip, write:
      *   **Private Belief:** What you genuinely think the Urn is (Red or Blue).
      *   **Public Guess:** What you announce to the table.
      *   *You must fill this out BEFORE speaking.*
  4.  **Announce:** Say your Public Guess loudly ("Red" or "Blue").
  5.  **Pass:** Hand the Urn to the next player.

  **DECISION RULE:**
  You want to match the True State. You have your Chip and the history of previous Public Guesses.
  *   If history is empty or tied: Follow your Chip.
  *   If history favors one color (e.g., two Reds): Follow the History, even if your Chip disagrees.
  *   **Silence:** Wait for your turn. Do not react to others' guesses.

  **AUDITORS:** Two students will circulate. They collect slips immediately after you write. They do not speak.

  ### Minute-by-Minute Timeline (80 Minutes)

  *   **00–10:** Introduction. Distribute tables. Explain stakes. Emphasize silence. TA assigns States (coin flip) and sets Urns.
  *   **10–30:** **Round 1.** Tables play simultaneously. TA and Auditors monitor silence and collect slips. (20 mins allows for slow calculators).
  *   **30–40:** **Reveal 1.** Tables open State Cards. Calculate scores. Auditors report any "Private/Public" mismatches to the Professor.
  *   **40–55:** **Round 2 (Fragility).** Reset. At Table 1, Player 1 is pulled aside privately: *"Your instruction is reversed. If you draw Red, guess Blue. If Blue, guess Red. Do not tell anyone."* Play proceeds.
  *   **55–65:** **Reveal 2 & Audit.** Reveal the deception at Table 1. Ask Table 1: "Knowing P1 was noisy, was P3 rational?" Ask other tables: "Would you have stopped?"
  *   **65–75:** **Final Audit.** One student per table sums the Private Signals vs. Public Guesses. Did the table ignore more information than it used?
  *   **75–80:** **Concept Reveal.** Introduce term "Information Cascade." Connect to Bikhchandani–Hirshleifer–Welch.

  ### Debrief: Mapping to Epistemology

  **1. Rational Herding:**
  Point to the slips where Private Belief ≠ Public Guess. This is not conformity; it is Bayesian rationality. Player 3 recognized that Players 1 and 2 likely had signals matching their guesses. The weight of two signals outweighs one. You deferred not because you feared social sanction, but because you respected their evidence.

  **2. Fragility (Conciliationism Bridge):**
  In Round 2, Table 1's cascade was built on a poisoned root. Once we revealed P1's instruction, the history became noise. A rational agent (P4) should have reset to relying on their own signal. This mirrors peer disagreement: if you learn a peer's belief is based on evidence you know is flawed (or random), you should not conciliate; you should discount them entirely. However, if you *don't* know the provenance (like Tables 2–4), maintaining the herd remains rational. This distinguishes *steadfastness* (ignoring the peer) from *conciliation* (weighting the peer) based on higher-order evidence about the peer's reliability.

  **3. The Fourth Player:**
  Was P4 deferring correctly? In Round 1, yes. In Round 2 (Table 1), no—they lacked the higher-order evidence we just gave you. This illustrates that rationality is relative to available information about the testifier's context.

  ### Failure Modes and Fixes

  **1. No Cascade Forms:**
  *   *Scenario:* Signals alternate (R, B, R, B). History never reaches +2.
  *   *Fix:* This is a feature, not a bug. Use it to show that cascades require specific signal clustering. Ask the class: "Why didn't you herd?" (Answer: The history wasn't informative enough).
  *   *Scaling:* With 6 players, probability of *some* cascade is high (~80%). If it fails, aggregate data across tables.

  **2. Signal Leakage:**
  *   *Scenario:* Player holds chip up too long, or facial expression reveals disappointment.
  *   *Fix:* Instruct students to look at the chip inside the cup or cup their hand. TA warns immediately if non-verbal leakage occurs.

  **3. The "Rebel" Student:**
  *   *Scenario:* A student deliberately guesses against the herd to "prove a point."
  *   *Fix:* The Private Belief slip exposes them. If Private=Herd and Public=Rebel, they gain no merit points and lose table accuracy. The incentive structure punishes performative independence.

  **4. Confusion on Bayes:**
  *   *Scenario:* Students freeze on the calculation.
  *   *Fix:* The Instruction Sheet provides the heuristic ("If history favors one color... Follow the History"). The TA circulates to enforce the heuristic, not the math.

  ### Scaling Notes

  **Class of 14:**
  Run 2 tables (12 players). 2 Auditors. You (Professor) act as the observer for the remaining 2 students, or have them sit in the tiered section as "External Evaluators" who grade the Auditors. Reduce time to 60 minutes by cutting Round 2 discussion slightly.

  **Class of 40:**
  Run 6 tables (36 players). 4 Auditors. The remaining 4 students sit in the tiered seating as "Regulators" empowered to penalize tables for noise. You will need 2 TAs to manage the Urn setups simultaneously. Extend time to 90 minutes if possible, or trim the Final Audit to a show of hands.

  ### Limitations: The Engineering Problem

  There is one feature of real-world herding this activity cannot reproduce: the *absence of a known experimenter*. In the real world, agents do not know their situation is engineered to test them. Here, students know you are watching. This triggers the "Lucas Critique" of social experiments: they may reason about *your* intentions rather than the urn's state. For example, they might suspect you rigged the urns to force a cascade, leading them to herd even when the math says otherwise (or rebel because they suspect a trick). This meta-reasoning is a form of higher-order evidence not present in the Bikhchandani–Hirshleifer–Welch model. You must supply this verbally in the debrief: "In the wild, you don't know if the market is an experiment. Here, you know I am the puppeteer. That changes the epistemic weight of the history." This awareness is the deeper failure; the model assumes agents trust the mechanism, whereas your students are tasked with trusting *you*.
