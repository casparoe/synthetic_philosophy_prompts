answer: |-
  1. **Thesis of Temporal Origin:** Every tradition has a first instance in time; none are eternal.
     *   **Conditions:** Historical record shows a start date.
     *   **Evidence:** Archival absence prior to a specific date.
     *   **Verdict:** Platitude. No tradition predates humanity. This does not undermine authority unless antiquity is the sole source of value.

  2. **Thesis of Human Construction:** Traditions are products of human choice and social negotiation, not natural laws or divine decrees.
     *   **Conditions:** Human agents shaped the practice.
     *   **Evidence:** Records of decision-making or cultural evolution.
     *   **Verdict:** Platitude. This addresses the "imagined" joint: a community being "imagined" (constructed socially) does not make it fictitious, only non-physical. Distinguishing "constructed" from "fake" is crucial here.

  3. **Thesis of Retrospective Formalization:** Practices often accrete slowly and are only labeled "tradition" or formalized retrospectively.
     *   **Conditions:** The label or rigid form post-dates the practice's inception.
     *   **Evidence:** Discrepancy between early informal records and later codified statutes.
     *   **Verdict:** Substantive but defensible. This addresses the "deliberate vs. accreted" joint. If "invented" covers drift, the term loses sharpness; if it requires a creator, many traditions escape it.

  4. **Thesis of Deliberate Fabrication:** Traditions are consciously created by identifiable agents at a datable moment to mimic antiquity they do not possess.
     *   **Conditions:** Identifiable authors, specific date, intent to deceive regarding age.
     *   **Evidence:** Minutes showing design intent to "look old."
     *   **Verdict:** Contingent. This addresses the "contrast class" joint. If all traditions are invented, none are, rendering the term useless unless some are "organic." Here, "invented" asserts the tradition's own account of its antiquity is false—a claim about belief.

  5. **Thesis of Normative Irrelevance:** The fact of construction negates a tradition's claim to authority based on continuity.
     *   **Conditions:** Authority relies on perceived antiquity; construction proves antiquity false.
     *   **Evidence:** Philosophical argument linking truth-claims to obligation.
     *   **Verdict:** Substantive normative claim. This addresses the "belief vs. authority" joint. Even if the historical claim is false (Reading 4), authority might rest on utility or cohesion, not historical literalism.

  6. **Thesis of Authenticity Leveling:** Since all traditions are constructed, none possess greater authenticity than another.
     *   **Conditions:** Authenticity is defined solely by origin type (constructed vs. natural).
     *   **Evidence:** Logical deduction from Reading 2.
     *   **Verdict:** False without extra premises. This addresses the "leveling inference" joint. Equal origin does not imply equal value; age, resonance, and utility still differentiate them. The slogan does not supply the premise that "new inventions are as good as old ones."

  ***

  **Analysis of Committee Uses**

  **1. The Abolitionist Argument**
  This colleague requires **Reading 4 (Deliberate Fabrication)** combined with **Reading 5 (Normative Irrelevance)**. They argue that because the 1870s procession claims 15th-century continuity (false belief), it grounds no obligation (irrelevant authority). However, the evidence only supports **Reading 3 (Retrospective Formalization)**: the procession began in the 1870s, but there is no evidence it was designed to *deceive* regarding antiquity rather than simply celebrate founding. If the claim is merely that it has a start date (Reading 1), the argument collapses, as all practices do. Removing the slogan leaves a specific historical claim: "The ritual misrepresents its age." The committee must then argue whether misrepresentation matters more than the ritual's current function, rather than gesturing at "invention."

  **2. The Replacement Argument**
  This colleague relies on **Reading 6 (Authenticity Leveling)**. They argue that if the old ceremony is made up, making a new one is no loss of authenticity. This inference fails without an additional premise: "Authenticity is not time-sensitive." Reading 6 establishes equal origin status, not equal value. A 150-year-old tradition may command more respect than a new one, even if both are "invented." Removing the slogan reveals the actual premise: "We should prioritize current utility over historical resonance." The committee must argue whether the 1870s form still serves the university better than a new one, rather than assuming novelty is neutral.

  **3. The Andersonian Argument**
  This colleague challenges the slogan's negative valence by invoking "imagined community." They treat "imagined" not as **Reading 4 (Fabrication)** but as **Reading 2 (Human Construction)**. Their point is that social cohesion requires shared symbols regardless of literal truth. This use succeeds only if "imagined" is decoupled from "fictitious." If "invented" implies "fake" (Reading 4), this colleague is talking past the others. Removing the slogan leaves a functionalist argument: "The procession sustains community identity; its historical literalism is secondary." The committee must then weigh the cost of historical accuracy against the benefit of communal bonding, rather than debating the ontology of tradition.

  **Conclusion on Hypothesis**
  Your hypothesis is largely correct but requires nuance. There are multiple empirical claims (Readings 1–4), but only the normative ones (Readings 5–6) do the argumentative work. The slogan functions as a equivocation: users slide from the platitude (Reading 1) to the normative claim (Reading 5) without defending the bridge. Disambiguating these readings forces the committee to argue about value and function, rather than hiding behind the historical status of the ritual.
