      *(Self-Correction during drafting)*: In Section 1, I need to make sure the claim about moral dilemmas is something *both* can sign. VE says an arhat has no defilements, so no dilemma leads to wrongdoing. C says an awakened agent sees the causal net clearly, so they choose the least *dukkha* path, avoiding "wrongdoing" in the ultimate sense. So, "The fully awakened agent does not face inescapable moral wrongdoing" works.
