      *   *Idea 3:* Agent-relativity of Karma. VE: Strictly individual. C: Can be aggregated/traded (utilitarian style).
      *   *Drafting the Table:*
          *   Row 1: Criterion of Rightness.
          *   Row 2: Ontological status of the Goal.
          *   Row 3: Interpersonal Karmic Economy.

  5.  **Drafting Section 3: Cruxes:**
      *   *Goal:* Evaluate specific candidates (a-e). Is it a *crux* (settling it moves a camp)?
      *   (a) Merit Transfer: VE says no transfer (rejoicing is internal). C says transfer (outcome benefits other). *Verdict:* Crux. If transfer is real, VE agent-relativity breaks.
      *   (b) Skillful Means/Killing: VE says exceptional Bodhisattva disposition. C says net suffering reduced. *Verdict:* Not a crux. Both can accommodate it (VE as exception to rule based on compassion; C as calculation).
      *   (c) Volition as Criterion vs. Mechanism: *Verdict:* Major Crux. This is the core meta-ethical split.
      *   (d) Near/Far Enemy: *Verdict:* Not a crux. Both can use character analysis or reliability conditions.
      *   (e) Rebirth/Precepts: *Verdict:* Crux. If precepts are just heuristics for rebirth, VE rule-based character view weakens. If precepts are constitutive of virtue, C view weakens.

  6.  **Drafting Section 4: Tests and Predictions:**
      *   *Goal:* For genuine cruxes (a, c, e), identify tests and predictions.
