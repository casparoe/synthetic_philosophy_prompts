      *   **Consequentialist Camp (C):** Focus on outcomes (*dukkha* reduction, liberation). *Kusala* (skillful) defined by tendency to diminish suffering. *Cetanā* (volition) is causal mechanism, not rightness criterion. Rebirth widens consequence horizon.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Substantive claims both can sign.
      *   *Requirements:* Primary object of moral evaluation, status of *cetanā*, role of Four Immeasurables, moral dilemmas.
