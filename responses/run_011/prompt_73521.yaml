answer: |-
  # Joint Statement on the Meta-Ethical Structure of Buddhist Normativity

  **Preface**
  This statement summarizes the findings of an adversarial collaboration between proponents of the Virtue Ethics interpretation (VE) and the Consequentialist interpretation (C) of Buddhist ethics. We acknowledge that the tradition contains resources supporting both readings. Our goal is not to declare a victor but to isolate the precise points of divergence, identify agreed-upon textual data, and determine which disagreements are substantive versus verbal.

  ### 1. Agreed Claims

  Both camps endorse the following substantive claims regarding the canonical and commentarial material. These items are phrased to avoid meta-ethical categorization, focusing instead on the internal logic of the tradition.

  1.  **Primacy of Volition:** The tradition identifies volition (*cetanā*) as the primary object of moral evaluation. An act lacks karmic weight unless it is intentional; accidental harm does not generate the same karmic fruit as deliberate harm.
  2.  **Soteriological Teleology:** The ethical life is instrumental to a specific end: the cessation of suffering (*dukkha*) and the attainment of liberation (*nibbāna*). Ethical norms are not free-standing duties but are tied to the causal structure of existence.
  3.  **Necessity of the Immeasurables:** The cultivation of the four immeasurables (*mettā* or loving-kindness, *karuṇā* or compassion, *muditā* or empathetic joy, and *upekkhā* or equanimity) is strictly necessary for ethical progress. No agent can be considered ethically perfected without stabilizing these dispositions.
  4.  **Denial of Inescapable Wrongdoing:** The tradition does not admit of genuine moral dilemmas in which a fully awakened agent (an *arhat* or *bodhisattva*) is forced to commit a defiled act. While unawakened agents may face conflicting obligations, the tradition maintains that perfect wisdom resolves apparent conflicts without requiring the violation of ethical norms that would generate negative karmic fruit.
  5.  **Agent-Relative Experience of Fruit:** While the *effects* of an action may impact others, the karmic fruit (the maturation of the volition) is experienced by the agent who formed the intention. One cannot experience the karmic maturation of another's volition directly.

  ### 2. Residual Disagreements

  The following table isolates the substantive disagreements that remain after accepting the claims in Section 1.

  | Disagreement (Neutral Formulation) | Virtue Ethics (VE) Formulation | Consequentialist (C) Formulation | Mutual Objection to Opposing Formulation |
  | :--- | :--- | :--- | :--- |
  | **The Criterion of Rightness** | An act is right (*kusala*) because it expresses the settled dispositions of a virtuous agent; the character of the agent fixes the moral quality. | An act is right (*kusala*) because it tends to produce favorable outcomes (reduction of *dukkha*, favorable rebirth, liberation). | **VE:** C reduces the agent to a mere conduit for outcomes, ignoring the canonical emphasis on purification of mind.<br>**C:** VE cannot explain why specific dispositions are virtuous unless they are tracked by their good results. |
  | **The Status of *Nibbāna*** | *Nibbāna* is the extinction of defilements and craving; it is not a "state of affairs" to be produced but a cessation to be realized. | *Nibbāna* is the supreme good and the ultimate consequence of the path; it functions as the maximizing value in the ethical calculus. | **VE:** C reifies liberation into a commodity, risking the very craving the path seeks to extinguish.<br>**C:** VE renders the path aimless if the goal is not a valuable state to be attained. |
  | **Aggregation of Welfare** | Karmic accounts are strictly individual; one cannot trade one's own purity for another's welfare, as defilement blocks liberation. | The welfare of sentient beings can be aggregated; an act that sacrifices the agent's purity to save many others may be justified by the net reduction of *dukkha*. | **VE:** C violates the agent-relativity of karma and misunderstands that a defiled act cannot lead to liberation regardless of consequences.<br>**C:** VE leads to moral selfishness, ignoring the Bodhisattva ideal of universal salvation. |

  ### 3. Cruxes

  We evaluate the following candidate issues to determine if they are "cruxes" in the strict sense: sub-questions where settling the fact would force at least one camp to revise its meta-ethical classification.

  **(a) Merit Transfer**
  *Judgment:* **Genuine Crux.**
  *Reasoning:* VE relies on the strict agent-relativity of karma (Claim 5 in Section 1). If merit can be literally transferred from Agent A to Agent B, VE's claim that karma is non-tradable collapses. C argues this shows karma is a transferable resource akin to utility. VE argues the "transfer" is merely providing an occasion for the recipient to generate their own wholesome volition (rejoicing). If textual analysis proves the recipient benefits *without* generating their own volition, VE must concede that karma is not strictly agent-relative.

  **(b) Skillful Means and Killing**
  *Judgment:* **Not a Crux.**
  *Reasoning:* Both camps can accommodate the case of the captain who kills a murderer to save passengers and spare the murderer bad karma. VE interprets this as an exception grounded in the Bodhisattva's unique compassionate disposition, not a general rule. C interprets this as a calculation of net suffering. Since the textual presentation allows for both a "dispositional exception" reading and a "net outcome" reading without contradicting core tenets of either camp, settling the interpretation of this specific story does not decide the meta-ethical debate.

  **(c) Identification of Karma with Volition**
  *Judgment:* **Genuine Crux.**
  *Reasoning:* This is the central meta-ethical hinge. If the canonical statement "karma is volition" is a criterion of rightness (VE), then the mental state constitutes the morality. If it is a causal mechanism (C), then volition is merely the engine that produces outcomes, while the outcomes determine rightness. If it is definitively established that the texts treat volition *only* as a causal link in a chain leading to results, VE loses its claim that intention is constitutive of the good.

  **(d) Near Enemy and Far Enemy Analysis**
  *Judgment:* **Not a Crux.**
  *Reasoning:* The commentarial practice of distinguishing a virtue (e.g., compassion) from its "near enemy" (e.g., pity/sentimentality) and "far enemy" (e.g., cruelty) can be read both ways. VE sees this as defining the internal topology of character. C sees this as defining reliability conditions for producing good outcomes (pity leads to burnout, cruelty leads to harm). Settling the psychological accuracy of these distinctions does not determine whether the *value* of the virtue lies in its being or its doing.

  **(e) Rebirth Horizon and Precepts**
  *Judgment:* **Genuine Crux.**
  *Reasoning:* If the precepts (e.g., against killing) are merely reliable summaries of what yields favorable rebirth (C), they are heuristic rules that could theoretically be overridden if a specific act yielded a better rebirth outcome. If the precepts are constitutive of the virtuous character (VE), breaking them is inherently defiling regardless of the rebirth outcome. If a case can be found where the tradition endorses breaking a precept *specifically* to secure a better ontological outcome (not just to save lives, but to improve rebirth status), VE is undermined.

  ### 4. Tests and Predictions

  For the genuine cruxes identified in Section 3 (a, c, e), we propose the following tests and record our divergent predictions.

  **Crux (a): Merit Transfer**
  *   **Test:** Exegesis of rituals dedicated to departed kin. Specifically, does the text describe the merit moving like a substance, or does it describe the departed *changing their mind*?
  *   **VE Prediction:** Texts will emphasize the departed's act of *anumodanā* (rejoicing). The benefit arises from the departed's own wholesome volition triggered by the dedication.
  *   **C Prediction:** Texts will describe the merit as a gift accepted by the departed, functioning like a currency payment that alleviates their suffering directly.
  *   **Discrimination:** If the texts explicitly state the departed benefit *without* rejoicing, VE fails. If they state benefit is impossible without rejoicing, C's claim of transferable utility fails.

  **Crux (c): Volition as Criterion vs. Mechanism**
  *   **Test:** Analysis of "wrong view" (*micchā-diṭṭhi*). Is wrong view condemned because it is a defective state of mind, or because it leads to bad actions?
  *   **VE Prediction:** Wrong view is condemned primarily as a defilement (*kilesa*) that stains the agent, regardless of immediate outward consequences.
  *   **C Prediction:** Wrong view is condemned primarily because it systematically leads to actions that produce suffering for self and others.
  *   **Discrimination:** This test may fail to discriminate. Both camps predict wrong view is bad. VE says it's bad intrinsically; C says it's bad instrumentally. Since the texts likely assert both, this crux may prove indeterminate based on textual evidence alone.

  **Crux (e): Rebirth Horizon and Precepts**
  *   **Test:** Hypothetical cases in commentarial literature where keeping a precept leads to a worse rebirth (e.g., martyrdom for truth vs. lying to save one's life).
  *   **VE Prediction:** The tradition will endorse keeping the precept even at the cost of a worse rebirth, because the purity of the agent is the primary good.
  *   **C Prediction:** The tradition will endorse the action that yields the better long-term soteriological outcome, even if it requires bending a precept (as in the Skillful Means case).
  *   **Discrimination:** If the tradition consistently prioritizes precept-keeping over optimal rebirth outcomes in edge cases, C is weakened. If the tradition consistently prioritizes the long-term soteriological outcome over strict precept adherence, VE is weakened.

  ### 5. Verbal Dispute

  A significant portion of the debate stems from the definition of the term "consequentialism."

  **Boundaries of the Dispute:**
  If "consequentialism" is defined broadly as any theory that holds actions are evaluated in light of their contribution to a final good (liberation), then Buddhist ethics is trivially consequentialist. VE proponents do not deny that the path leads to liberation. If "consequentialism" is defined narrowly as a theory where the *rightness* of an act is determined *solely* by the comparative value of its outcomes, independent of the agent's character or the intrinsic nature of the act, then VE proponents deny the label.

  **Resolution:**
  If both camps agree to reserve the term "consequentialism" for theories that locate the criterion of rightness exclusively in the value of outcomes (the narrow definition), the following remains:
  1.  **Substantive Disagreement:** Does the tradition treat the precepts and virtues as *constitutive* of the good life (VE), or as *instrumental* strategies for maximizing the good (C)?
  2.  **Substantive Disagreement:** Is the agent-relativity of karma absolute (VE), or can karmic value be aggregated across persons (C)?

  The verbal dispute concerns only the labeling of the tradition. The substantive dispute concerns the structural role of intention versus outcome in the generation of karmic fruit. We agree that resolving the verbal dispute clarifies the dialectic but does not resolve the substantive disagreement.
