      *   *Crux (e) Rebirth/Precepts:* Test: Cases where breaking a precept yields better rebirth (hypothetical). VE says impossible (breaking precept *is* defiled). C says possible (if outcome is better).
      *   *Constraint Check:* If predictions are identical, admit it.

  7.  **Drafting Section 5: Verbal Dispute:**
      *   *Goal:* Is "Consequentialism" the problem?
      *   *Analysis:* If "Consequentialism" just means "outcomes matter," VE agrees. If it means "outcomes *determine* rightness exclusively," VE disagrees.
      *   *Resolution:* Much of the fight is about labeling. If we reserve "Consequentialism" for "Rightness = Maximize Good Outcome," VE rejects it. But if C means "Soteriology is goal-directed," VE agrees.
      *   *Boundary:* The dispute over whether *cetanā* is constitutive or instrumental.

