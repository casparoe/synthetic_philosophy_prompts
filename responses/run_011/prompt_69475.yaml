      *   **Core Task:** Apply CJT rigorously to the Challenger decision-making process, identify where it fails, suggest better frameworks (Doctrinal Paradox, Normalization of Deviance), and engage in epistemic humility (what would change my mind, where am I likely wrong).
      *   **Tone:** Conversational, analytical, honest, avoiding jargon where possible but not dumbing it down.

