      *   *Group Size:* Very small (dozens on the call, but effectively a handful of decision-makers). CJT relies on large $n$.

  4.  **Drafting the CJT Application (Section 1):**
      *   *Who is the jury?* It wasn't a jury; it was a hierarchy. If we force it, it's the Thiokol management team + NASA managers.
      *   *The Question:* The slide from "Is it safe?" to "Is it acceptable risk?" is the killer. CJT requires a single truth. Challenger was a trade-off.
      *   *Competence:* Engineers were competent ($p > 0.5$). Managers overruled them. So the "voters" with the vote had lower competence on the technical truth.
      *   *Independence:* Zero. The "Take off your engineering hat" comment proves social correlation.
      *   *Group Size:* Too small. CJT convergence is slow for small $n$, especially if $p$ is barely above 0.5 (or below).
