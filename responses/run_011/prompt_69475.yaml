      *   *Premise 2:* Individual competence ($p > 0.5$).
      *   *Premise 3:* Independence (votes are not correlated).
      *   *Conclusion:* As $n \to \infty$, probability of majority correctness $\to 1$.
      *   *Context:* Usually applied to large groups voting on facts.

  3.  **Analyze the Challenger Decision (The "Jury"):**
