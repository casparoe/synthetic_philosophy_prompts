      *   *Key Distinction:* Gauge freedom in a physical theory $\neq$ Metaphysical anti-haecceitism. One can accept LE for GR (as a gauge symmetry) without accepting it for all metaphysical contexts (like swapping two electrons in QM, or shifting the universe in Newtonian space).
