answer: |-
  Here is the architecture for the ninety-minute session. It is designed to move the room from intuition to dilemma, and finally to role-clarity, without allowing the emotional weight of your stake to crush the intellectual work.

  ### 1. The Sequence and Dependencies

  You cannot introduce the "contentment clause" (the instruction to ignore her future happiness) until the room has already accepted the **authority of the past self**. If you present the clause too early, the room will not see a philosophical puzzle; they will see a cruelty. They will default to protecting the living, breathing woman in front of them, and the training will fail.

  **The Order:**

  1.  **The Frame (0–10 mins):** Establish the volunteer's role. They are not decision-makers; they are witnesses who hold the space for decisions made by others.
  2.  **The Baseline Case (10–25 mins):** Present a standard advance directive scenario. A person values independence over life; they lose capacity; the directive is followed.
      *   *Goal:* Secure unanimous agreement that the past self's voice usually carries authority.
      *   *Dependency:* If you skip this, you have no foundation. You need them to say "Yes, the document matters" before you complicate it.
  3.  **The Disclosure (25–30 mins):** Reveal your personal stake here (see section 6).
  4.  **The Complication (30–50 mins):** Introduce the specific variable: The patient is not suffering. She is content. She asks for the very thing the directive forbids. Introduce the "contentment clause."
  5.  **The Work (50–75 mins):** Small groups discuss the specific tension.
  6.  **The Close (75–90 mins):** Decompression and the Final Question.

  **What Collapses:**
  If you bring out the clause before securing the Baseline, the concept of **Precedent Autonomy** collapses. The room will not hear "a prior value being protected"; they will hear "a current joy being threatened." The puzzle requires them to hold two competing validities in tension. If they haven't bought into the validity of the first one, the second one wins by default.

  ### 2. The Single Case

  **Use yours.**
  Do not invent one. An invented case will lack the specific texture of the "contentment clause," which is the engine of this entire evening. Volunteers have a keen radar for hypotheticals; they will work harder on a truth they know has consequences.

  **What it must contain:**
  *   **Clear Competence:** The directive must have been written when she was unmistakably herself.
  *   **Clear Contentment:** The current state must be described as genuinely happy, not just "not in pain." She must ask for breakfast. She must show fear of death.
  *   **The Meta-Clause:** You must read the specific sentence: *If I seem content... that request is to carry no weight.*

  **What it must conspicuously lack:**
  *   **Medical Ambiguity:** Do not allow debate about whether she is "terminal enough" or "demented enough." That is a clinical question, not an ethical one. State the diagnosis as fact.
  *   **Family Conflict Details:** Do not detail your siblings' disagreement. That invites them to take sides in a family dispute rather than analyze the ethical principle. The conflict is between the *selves*, not the siblings.

  ### 3. The Misreadings

  Expect these three misreadings in this specific order. You must head them off at the pass; do not argue them down once they take root.

  **1. The Memory Misreading (Minutes 30–40)**
  *   *The Claim:* "She isn't the same person anymore. The woman who wrote the note is gone."
  *   *The Head-Off:* Do not engage in metaphysics. Reply: "For the purpose of this directive, the law and the hospital treat her as the same person. We are not here to decide if she is the same; we are here to decide which version of her gets to speak."

  **2. The Presence Misreading (Minutes 40–50)**
  *   *The Claim:* "The contented self wins because she is the one in the room. You can't ignore someone asking for food."
  *   *The Head-Off:* This is the strongest pull. Reply: "If we always default to the person in the room, advance directives cease to function. We are testing the limit of when the person in the room loses the veto."

  **3. The Hospice Mission Misreading (Minutes 50–60)**
  *   *The Claim:* "Our job is comfort. Enforcing this causes distress to the family and the volunteer. Therefore, it violates our mission."
  *   *Why it is damaging:* This is peculiar to your audience. They are trained to alleviate suffering. They will conflate *their own discomfort* with *patient suffering*. They will argue that honoring the directive creates "suffering" in the room (tears, tension) and therefore must be stopped.
  *   *The Head-Off:* "Comfort is the goal of care, but integrity is the goal of ethics. Sometimes integrity is uncomfortable. Your role is not to ensure everyone feels good; it is to ensure the patient's values are kept."

  ### 4. The Final Question

  Do not ask how they feel. Ask about their agency. Near the end, put this question to the room:

  > "When you sit at that bedside, and she asks you for breakfast, and you know that breakfast sustains the life she forbade: **Whose voice are you using when you answer her?**"

  **Distinguishing Uptake:**
  *   **Moved/Unsure:** Answers focus on kindness, tone, or distraction ("I would change the subject," "I would hold her hand").
  *   **Genuine Uptake:** Answers acknowledge the split ("I am speaking for the woman who wrote the note," or "I am speaking for the institution that holds the document"). They recognize they are a conduit for a voice that is not currently present.

  ### 5. What to Refuse to Teach

  **The Topic:** Legal Enforceability and Override Protocols.
  Volunteers will ask: "But can the doctor actually stop us?" or "What if the family sues?"

  **Why:** It is not their lane, and it provides a false escape hatch. If they think a doctor will decide, they don't have to wrestle with the ethics.

  **How to Decline:**
  "I cannot teach you the law, and neither can anyone in this room. If you are looking for a rule that tells you when this document can be ignored, I don't have one. I am asking you to prepare for the moment when the rule is clear, but the cost is high."

  ### 6. Managing Your Personal Stake

  **When to Disclose:**
  Disclose at **Minute 25**, immediately after the Baseline Case discussion but before introducing the Contentment Clause.

  **How Much to Share:**
  State it plainly: "I am not a disinterested instructor. This document belongs to my mother. I am living the dispute you are about to discuss."
  **Do not** describe your grief. **Do not** describe your siblings' positions. **Do not** ask for their advice.
  Frame it as a boundary condition: "I am telling you this so you know why I cannot give you easy answers, and so you know that I am not asking for your comfort. I am asking for your honesty."

  **The "Brother" Moment:**
  It will happen. A volunteer will say what your brother says: *"But she's happy. Why would you let her die if she wants to live?"*

  **What to do:**
  1.  **Do not defend your mother.** If you defend her, you become a son/daughter in the room, not the trainer. The room will shift to comforting you.
  2.  **Validate the moral distress.** Say: "That is the exact cost of this directive. It requires us to accept a present happiness to honor a past value. That feels wrong."
  3.  **Return to the role.** Say: "Your feeling that it is wrong is valid. But your role is not to resolve that feeling. Your role is to remain present while that feeling exists. Can you sit in that room without fixing it?"

  This turns the personal tension into a training objective. It teaches them that their discomfort is part of the job, not a sign they are doing it wrong.
