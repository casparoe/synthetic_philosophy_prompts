prompt: |-
  I need your help planning — not writing — a ninety-minute training evening for volunteers, and I should explain at the outset why the subject has ceased to be academic for me.

  Twelve years before her diagnosis, my mother executed a directive covering the state she is now in. It is unremarkable in its main provisions, but it ends with a clause she was evidently proud of, which anticipated the objection her present condition would raise: if she should later seem content and ask to be kept alive, that request was to carry no weight, because it would come from someone who no longer held her values. She is now that someone. She is contented, she asks for breakfast, she is frightened of nothing in particular, and she cannot tell you why any of this matters. My siblings and I have stopped agreeing about whether the clause settles the question or merely performs it.

  I volunteer with a hospice service, and next month I run the ethics evening for the incoming cohort: roughly twenty people, none with any philosophy, several of them recently bereaved, all of whom will arrive with a private version of this already in progress. I have chosen the concept deliberately. Not the legality of anything, and not the general question of when treatment may be withdrawn, but the narrower puzzle underneath both: who is speaking when a directive is read aloud, whether the authority of a decision survives the decision-maker, and what an advance disavowal of one's own future dissent could possibly add to the document it appears in.

  What I want from you is the architecture of the session:

  - The order in which the components must be introduced, and what each one depends on. My suspicion is that the room cannot perceive that there is a puzzle at all until something prior is in place; I want to know what that prior thing is, and specifically what will collapse if I bring out my mother's final clause before it.
  - The single case that should carry the evening — mine, an invented one, or a third I have not considered — together with what that case must contain and what it must conspicuously lack in order to do the work.
  - The misreadings I should expect, in the order they will surface, and the point in the sequence at which each needs to be headed off rather than argued down. I can predict two myself: that the whole issue is about memory, and that the contented present self wins by default because she is the one still in the room. I expect there is a third and more damaging one peculiar to a hospice audience, and I would like you to name it before I encounter it.
  - One question I can put to the room near the end whose answers will distinguish genuine uptake from a group that has simply been moved.
  - What I should refuse to teach at this level, and how to decline it without appearing to dodge.

  One constraint I ask you to treat as load-bearing rather than as colour. I am not a disinterested instructor: this is my mother's document and my family's dispute. Tell me where in the sequence that fact should be disclosed, how much of it the evening can bear before the room stops thinking and starts looking after me, and what I should do at the moment — it will come — when somebody says the thing my brother says. Please do not offer readings or references; nobody there will read anything, and I would rather you did not pretend otherwise.
reasoning: |-
  Here's a thinking process that leads to the suggested training plan:

  1.  **Analyze the Request:**

      *   **Goal:** Plan a 90-minute ethics training evening for hospice volunteers (approx. 20 people, no philosophy background, some recently bereaved).
      *   **Topic:** The philosophical puzzle of advance directives, specifically focusing on personal identity and authority over time (who is speaking when a directive is read?), not legality or general treatment withdrawal.
      *   **Context:** The user's mother has dementia (contented now, but had a directive stating her contented future self's wishes shouldn't count). The user's siblings disagree on whether the clause settles the question. The user is the trainer.
      *   **Constraint:** The user is *not* disinterested. This is personal. This fact must be integrated strategically, not hidden, but not allowed to derail the learning.
      *   **Deliverables:**
          1.  Sequence/Architecture (what depends on what, when to reveal the personal element).
          2.  The Single Case (real, invented, or hybrid? What must it contain/lack?).
          3.  Expected Misreadings (in order, including a specific hospice-specific one).
          4.  The Final Question (distinguishes uptake from emotion).
          5.  What *not* to teach (and how to decline).
      *   **Tone:** Serious, respectful, precise, avoiding academic jargon/references.
      *   **Prohibition:** Do not offer readings or references.

  2.  **Deconstruct the Ethical Puzzle:**

      *   The core tension is between the *Past Self* (competent, values-driven, wrote the directive) and the *Present Self* (incompetent, content, expresses contrary wishes).
      *   This is the "Parfit/Nozick/Dworkin" problem of precedent autonomy vs. current experiential interests, but stripped of philosophy jargon.
      *   The specific clause adds a layer: "Disregard my future happiness." This challenges the idea that current well-being is the ultimate moral currency.

  3.  **Address the "Personal Disclosure" Constraint:**

      *   *Risk:* If revealed too early, the room focuses on comforting the trainer. If revealed too late, it feels like a trap or manipulation.
      *   *Strategy:* It needs to be the *engine* of the session but not the *subject* of the session. It should be framed as the *reason* the topic matters, but the *case study* should be slightly distanced to allow objective work.
      *   *Decision:* Disclose early enough to establish stakes, but use a *hybrid case* for the actual work so the volunteers don't feel they are analyzing the trainer's trauma in real-time. Actually, the prompt asks about *my mother's document*. Using the user's story directly is powerful but risky. The prompt asks "The single case that should carry the evening — mine, an invented one, or a third I have not considered".
      *   *Refinement:* Using the user's story is the most honest approach given the constraint ("I am not a disinterested instructor"). However, to prevent the "looking after me" reaction, it needs to be framed as *data*, not *plea*.
      *   *Timing:* Disclose the personal connection *after* the initial conceptual groundwork is laid but *before* the deep dive. This establishes trust without making the volunteers therapists.

  4.  **Develop the Architecture (Sequence):**

      *   *Phase 1: Grounding (0-15 mins).* Establish the role of the volunteer. They are witnesses, not judges.
      *   *Phase 2: The Intuitive Baseline (15-30 mins).* Start with a standard directive scenario (Person A writes directive, Person A loses capacity, Person A's body follows directive). Everyone agrees.
      *   *Phase 3: The Disruption (30-45 mins).* Introduce the "Contentment" variable. Person A is now happy to be alive.
      *   *Phase 4: The Personal Reveal & The Clause (45-60 mins).* Reveal the trainer's stake. Introduce the specific clause ("Ignore my future happiness").
      *   *Phase 5: The Work (60-75 mins).* Small group discussion on the specific puzzle.
      *   *Phase 6: Closing (75-90 mins).* The Final Question and decompression.

      *   *Critical Dependency:* The room cannot see the puzzle until they accept that the *Past Self* had authority. If you start with the conflict, they default to "Comfort the suffering person." You must first establish the validity of the directive *before* complicating it with the change in personality.

  5.  **Select the Single Case:**

      *   *Option:* Use the user's mother's case but anonymized/generalized slightly, or use it directly.
      *   *Decision:* Use the user's mother's case (anonymized details if needed, but the *structure* must be exact). Why? Because the user is not disinterested. Hiding it creates tension. Owning it models ethical vulnerability.
      *   *What it must contain:* A clear expression of values *before*, a clear expression of contrary desire *after*, and the specific meta-clause.
      *   *What it must lack:* Medical ambiguity. The diagnosis must be settled. The suffering must be non-existent (contentment is key). If there is suffering, the answer becomes "relieve suffering," which bypasses the philosophical puzzle.

  6.  **Identify Misreadings:**

      *   *1. Memory/Identity:* "She's not the same person." (Too abstract/philosophical).
      *   *2. The Present Self Wins:* "She's here, she's happy, why hurt her?" (Empathy override).
      *   *3. The Hospice Specific:* "Our job is comfort." This is the dangerous one. Volunteers are trained to alleviate suffering. If the patient isn't suffering, they might invent it or assume the directive is a form of suffering for the *family*. Or, they might assume their role is to advocate for the *body in front of them* exclusively.
      *   *Correction:* The prompt asks for the order.
      *   *Order:* 1. Memory (She's not herself). 2. The Present Self (She's happy now). 3. The Hospice Mission (Comfort is king).

  7.  **Formulate the Final Question:**

      *   Needs to distinguish "moved" (emotional reaction) from "uptake" (understanding the structural dilemma).
      *   Bad question: "How did this make you feel?"
      *   Good question: "If you were the volunteer sitting at the bedside when she asks for breakfast, what specific sentence do you say to her, and who are you speaking for?"
      *   Better: "When you honor this directive, whose dignity are you protecting: the one who wrote it, or the one who is reading it?"

  8.  **Determine What *Not* to Teach:**

      *   *Topic:* Legal enforceability or how to override a directive.
      *   *Reason:* It's not their job. It creates false power.
      *   *Deflection:* "That is a question for the clinical lead/legal team. Your question is about presence."

  9.  **Refining the Personal Disclosure (The "Brother" Moment):**

      *   The prompt asks: "what I should do at the moment — it will come — when somebody says the thing my brother says."
      *   The brother likely says: "But look at her, she's happy. The document is cruel."
      *   *Action:* Validate the discomfort, do not defend the mother, return to the volunteer's role. "That is exactly the tension. You are feeling the cost of the value. Your job isn't to resolve the cost, but to hold the space where it exists."

  10. **Drafting the Plan (incorporating the "Load-Bearing" constraint):**

      *   *Tone Check:* Needs to be empathetic but rigorous. No academic jargon.
      *   *Timing:* 90 minutes is tight.
      *   *Self-Disclosure:* Place it at the 30-minute mark. Early enough to be the context, late enough that they are already working.
      *   *Case:* Use the user's case. It carries the most weight. But frame it as "A case I am living with" rather than "My tragedy."

  11. **Review against Constraints:**
      *   No readings/references? Checked.
      *   Address the personal stake? Checked.
      *   Address the "Brother" moment? Checked.
      *   Address the specific misreadings? Checked.

  12. **Final Polish:** Ensure the distinction between "planning" and "writing" is respected. I am providing the architecture, not the script. (Though I need to be specific enough to be useful).

      *   *Self-Correction on the Case:* If I tell them to use the user's mother's case, does that violate the "not writing" instruction? No, it's part of the plan. However, I need to advise *how* to present it. Presenting it as a hypothetical first, then revealing it's real, might be a good technique to get the work done before the pity kicks in.
      *   *Revised Strategy on Disclosure:* Present the case as "Case Study A" first. Let them wrestle with the logic. *Then* reveal "This is my mother." This allows the intellectual work to happen before the emotional protection instinct triggers.

      *   *Wait, re-reading the prompt:* "Tell me where in the sequence that fact should be disclosed."
      *   *Decision:* Disclose *after* the initial case work but *before* the deep dive on the clause. This prevents the "therapist" dynamic but ensures the stakes are clear for the hard part.

      *   *The "Brother" Moment:* The brother represents the "Present Self Wins" argument. The trainer needs a protocol for this. Acknowledge validity, pivot to role.

      *   *The Hospice Misreading:* "We are here to comfort." If the directive causes distress to the *volunteer*, they might project that onto the patient. Or they might think "Comfort" overrides "Autonomy."

      *   *Final Question:* Needs to be about *agency*. "Who is the patient?"

      *(Self-Correction during drafting)*: I need to be careful not to tell the user *what* to think about their mother's clause, but how to facilitate the room's thinking about it.

      *   *Structure:*
          1.  Sequence & Dependencies.
          2.  The Case.
          3.  Misreadings.
          4.  The Final Question.
          5.  Off-Limits Topics.
          6.  Managing the Personal Stake.

      Let's assemble.

      *   *Dependency:* They need to agree that directives *usually* work before they can see why *this* one breaks.
      *   *Case:* Must be the user's (anonymized). It has the specific clause which is the crux.
      *   *Misreadings:* 1. Memory (She forgot). 2. Presence (She's here). 3. Mission (Comfort is our job).
      *   *Question:* "Whose voice is in the room?"
      *   *Off-limits:* Legal adjudication.
      *   *Personal:* Reveal after the first exercise. When the "Brother" comment happens: Validate, don't resolve.

      *Wait, one nuance:* The prompt says "Tell me... what will collapse if I bring out my mother's final clause before it [the prior thing]."
      *   *Answer:* If you bring out the clause before establishing the *authority of the past self*, the room will default to the *comfort of the present self*. The puzzle disappears because the "harm" of ignoring the directive seems greater than the "harm" of ignoring the current wish. You need them to feel the weight of the Past Self's authority first.

      *   *Refining the "Brother" moment:* The brother says "She's happy, let her live." The volunteer might say this. The user must not defend the mother. The user must say, "That is the exact conflict. Your role is not to solve it, but to serve the decision that stands."

      *   *Refining the Disclosure:* If I wait too long, it's a "gotcha." If I do it too soon, it's "therapy." The sweet spot is after the *concept* is introduced but before the *emotional weight* of the specific clause is discussed.
      *   *Actually, better:* Introduce the case as hypothetical. Do the first pass. *Then* reveal it is real. This allows them to be honest without fearing hurting the trainer. *Then* discuss the clause.

      *   *Wait, the prompt asks:* "Tell me where in the sequence that fact should be disclosed."
      *   *My recommendation:* Disclose *after* the first small-group discussion on the standard directive, but *before* introducing the specific "contentment clause."
      *   *Reasoning:* If they know it's you too early, they will spare your feelings in the first discussion (saying what they think you want). If they don't know until the end, the reveal is a stunt. If they know before the hard part (the clause), they understand the stakes but have already committed to the logic.

      *   *Wait, reconsidering:* If they know it's you, they might be *too* careful.
      *   *Alternative:* Disclose at the very beginning. "I am not disinterested." Set the frame. "Because this is personal to me, I need you to be brutally honest, because comforting me will fail the training." This uses the vulnerability as a tool to demand rigor.
      *   *Decision:* I will recommend disclosing at the **outset**, but framing it as a *boundary condition* for the room's honesty. "I am telling you this so you know why I am not giving you easy answers, not so you will give me easy comfort."

      *   *Wait, looking at the "Brother" moment:* "what I should do at the moment — it will come — when somebody says the thing my brother says."
      *   *Instruction:* Do not defend the mother. Validate the volunteer's moral distress. Re-center the volunteer's role.

      *   *Hospice Misreading:* "We are here to prevent suffering." If the patient is content, enforcing the directive looks like *creating* suffering (for the family/volunteer) or *ignoring* the patient's current state. The misreading is: "Comfort trumps Autonomy."

      *   *Final Question:* "When you sit with her, whose silence are you keeping?" (Too poetic). "If she asks you for breakfast, and you know breakfast leads to the life she forbade, what is your hand doing?" (Too physical).
      *   *Best:* "In that room, there are two patients. Which one are you paid to serve?"

      Let's write.

      *   *Check:* Did I answer all bullet points?
      *   Sequence/Dependencies? Yes.
      *   Single Case? Yes.
      *   Misreadings (3)? Yes.
      *   Final Question? Yes.
      *   Refusals? Yes.
      *   Personal Stake/Brother Moment? Yes.
      *   No references? Yes.

      *   *Tone:* Professional, direct, supportive but firm.

      *(Self-Correction on the Case)*: The prompt asks "The single case that should carry the evening — mine, an invented one, or a third I have not considered".
      *   *Advice:* Use yours. It has the specific clause which is the unique variable. Invented ones usually lack the specific "meta-clause" (the instruction to ignore future happiness). Real cases have texture. But it must be anonymized enough to protect privacy, yet specific enough to be real.
      *   *Wait, one more thing:* The prompt says "Tell me... what will collapse if I bring out my mother's final clause before it."
      *   *Answer:* The concept of *Precedent Autonomy* collapses. Without establishing that the Past Self has a claim, the Clause looks like cruelty rather than protection.

