answer: |-
  The question you pose strikes at the heart of how we narrate the past. It is a question that sits uneasily between the laboratory and the library, between the certainty of a cultured pathogen and the ambiguity of a historical motive. You ask whether we are licensed to speak of non-human causes as agents, and whether doing so surrenders ground to a discredited environmental determinism. You propose a tripartite distinction—efficacy, initiative, responsiveness—and a 'redescription test' to settle the matter.

  My verdict is this: the vocabulary of agency is legitimate and indeed necessary for robust historical explanation, but your scheme for justifying it is too conservative. It attempts to grant non-human entities standing by finding in them echoes of human behaviour. This is a philosophical error. Non-human agency is not legitimate because a pathogen 'responds' or 'takes initiative' in a human-like sense; it is legitimate because it possesses an *autonomy of operation* that resists human intention. Furthermore, the charge of environmental determinism, while politically potent, is philosophically confused. It conflates causal explanation with moral exoneration. To name the blight as an agent is not to absolve the administrator; it is to recognise that the administrator was grappling with a force that did not care for his plans.

  Let us first examine your proposal. You suggest that efficacy is a red herring, while initiative and responsiveness do the heavy lifting. I must dissent. Efficacy is not a truism; it is the foundation. To say drought causes hardship is not merely to state a physical fact; in history, it is to identify a constraint on the possible. However, your higher criteria are where the scheme falters. You define 'initiative' as a contribution not fixed by human plans. By this measure, a falling brick has initiative. If I plan to walk down a street and a brick falls from a ledge, my plan did not determine the brick's fall. Yet we do not call the brick an agent. We call it a hazard. The distinction you draw here does not separate agents from mere causes; it separates unexpected causes from expected ones.

  More problematic is 'responsiveness'. You cite the pathogen evolving under pressure as a paradigm of this trait. This is seductive for a plant pathologist, but dangerous for a historian. Evolution is not adjustment in the agential sense; it is selection. The pathogen does not 'choose' to evolve; the environment selects the variants that survive. To attribute responsiveness here is to anthropomorphise a mechanical process. If we reserve agency for that which adjusts to circumstances, we risk excluding the volcano, the earthquake, and the meteorite—forces that have undeniably turned the course of empires without possessing the capacity to 'adjust'. If the volcanic winter of the sixth century is an agent, it is not because it responded to the Romans, but because it acted independently of them. Your scheme, by prioritising responsiveness, inadvertently suggests that a static force is less of an agent than a dynamic one. In history, a static mountain range can be as agential as a moving virus if it dictates the route of an invasion.

  This leads to the weakness in your redescription test. You propose that if a narrative can be rewritten to make the non-human item a mere circumstance without explanatory loss, the agency attribution is decorative. Consider the Irish catastrophe. Can we rewrite the history of the 1840s to say 'British administrators, within the circumstance of potato blight, chose policies that led to starvation'? On the surface, yes. But does this retain the explanation of *timing* and *scale*?

  If we treat the blight merely as a circumstance, it becomes a backdrop against which human drama plays out. It suggests that the tragedy was primarily a failure of administration that happened to occur during a bad harvest. But the blight was not a static backdrop; it was a dynamic participant. It recurred over multiple seasons. It defeated the specific agronomic practices of the time. It rendered certain human choices (such as storing seed potatoes) physically impossible. If we redescription the blight as 'circumstance', we lose the explanation for why *these* specific relief measures failed. We lose the reason why the crisis persisted longer than a typical market fluctuation. The redescription test fails because it assumes that human intention is the primary currency of explanation. It assumes that if we can account for the human choices, we have accounted for the history. But history is often the record of human choices colliding with non-human realities that do not negotiate.

  A better test is not whether we can remove the agency, but whether the non-human element possesses *opacity*. Does it behave in ways that human actors could not predict or control, thereby generating consequences that were not merely the sum of human intentions? In the depopulation of the Americas, smallpox was not merely a circumstance. It moved faster than messengers. It killed leaders before they could surrender. It altered the demographic balance in ways no European general could have planned. To call it an agent is to acknowledge that the conquest was not solely a story of Spanish steel and Aztec politics, but of a biological third party that had its own trajectory.

  This brings us to the second objection: the charge of environmental determinism. This is the political heart of the controversy. The objection holds that elevating climate or disease to the status of protagonist dissolves human responsibility. If the blight is the villain, then Peel and Russell are merely bystanders. This is a powerful rhetorical move, often deployed to protect national myths or deflect from colonial culpability.

  However, this objection relies on a category mistake. It assumes that acknowledging a non-human cause necessarily diminishes a human one. This is a zero-sum view of causality that does not hold up to scrutiny. In a court of law, if a man is charged with negligence during a flood, the defence does not argue that the flood was not real; it argues that the man took reasonable precautions against it. The existence of the flood (the non-human agent) is a prerequisite for the charge of negligence (the human failure). If there were no flood, there is no case.

  Similarly, in history, acknowledging the agency of the pathogen sharpens the critique of the human response, rather than dulling it. If the potato blight was a mere circumstance, a predictable background variable, then the failure to prepare for it is a failure of basic competence. If, however, the blight is an agent—a novel, evolving, unpredictable force—then the failure of the administration is one of adaptability and imagination. By granting the blight agency, we do not excuse the British government; we clarify the nature of their error. They treated a biological agent as a static economic variable. They assumed the problem was distribution, when the problem was reproduction.

  The charge of determinism only bites if the historian uses the non-human agent to claim that the outcome was *inevitable*. If one writes that the volcanic winter *made* the empires fall, implying no human action could have saved them, then determinism is indeed at work. But if one writes that the volcanic winter *destabilised* the empires, creating conditions in which specific human decisions led to collapse, then we are in the realm of complex causality, not fate. The error lies not in naming the non-human cause, but in assuming it operates in a vacuum.

  Therefore, the strongest version of the position I reject is the strict intentionalist view: that only beings with minds can be agents. This view protects human exceptionalism but renders history unintelligible. It forces us to describe the Black Death as a 'context' rather than a 'force'. It requires us to speak of the Little Ice Age as a 'setting'. This language is insufficient. A setting does not kill. A setting does not migrate. A setting does not mutate. When we strip non-human causes of agency, we are left with a history of human intentions constantly frustrated by a world that refuses to behave like a stage set. We end up writing history as if the actors were performing in a vacuum, puzzled by why the floor gives way beneath them.

  However, I also reject your scheme's reliance on 'responsiveness'. We do not need the pathogen to be quasi-intentional to grant it agency. We only need it to be *autonomous*. The distinction you draw between initiative and responsiveness is less important than the distinction between *dependence* and *independence*. A tool has efficacy but no agency because its motion is wholly dependent on the user. A virus has agency because its replication is independent of the host's desire. A volcano has agency because its eruption is independent of the king's prayer.

  The legitimate use of agency vocabulary, then, rests on this autonomy. It is a shorthand for saying: 'Here is a causal chain that originated outside the human sphere of meaning and impinged upon it.' This does not revive the crude determinism of the nineteenth century, which claimed that geography dictates destiny. Modern material history claims that geography *constrains* destiny, and that biology *complicates* policy.

  To conclude, I offer this defence. The vocabulary of non-human agency is legitimate, but it must be stripped of the anthropomorphic baggage your 'responsiveness' criterion invites. We should not ask if the pathogen 'adjusted'; we should ask if the pathogen's behaviour was *opaque* to the historical actors. Was it a variable they could not solve? If so, it acted as an agent in the historical drama, regardless of whether it had a mind.

  As for the determinism charge, it is a political warning, not a philosophical prohibition. It reminds us not to let the microbe eclipse the magistrate. But it should not prevent us from naming the microbe. A history that refuses to grant agency to the non-human is a history that believes the world was made solely for us. Given your career in pathology, you know better than most that the world is indifferent to our plans. To write history honestly is to acknowledge that indifference not as a backdrop, but as a player. The blight was not just a circumstance in Ireland; it was a participant. To deny it that status is to misunderstand the nature of the tragedy. It was not merely a failure of politics; it was a collision between a political system and a biological reality. Both must be granted their weight.

  Thus, I reject your tripartite scheme not because it is too generous to nature, but because it is too generous to human-like traits. And I reject the determinism objection because it confuses the explanation of events with the justification of actors. We may speak of the pathogen as a protagonist, provided we remember that it is a protagonist without a script, and without a conscience. That is the verdict: agency is real, but it is not human; and acknowledging it does not free us from responsibility, but defines the arena in which our responsibility must be discharged.
