answer: |-
  **Elena:** The historian's thesis rests on a category error. He claims to explain why Britain industrialized rather than China, citing coal proximity and New World land. But his first condition for a determinate question fails: commensurability. "Britain" is a polity; "China" is a civilization-continent. If we are comparing constraints on productive land, the relevant unit isn't the Qing Empire, it's the Yangzi Delta. That region was as commercialized as England. By framing the contrast as Britain-versus-China, he creates a false asymmetry. He isn't answering the question he posed; he's answering "Why England rather than the Yangzi?" and pretending the scale doesn't matter.

  **Marcus:** You're demanding a precision that history cannot sustain without paralysis. Contrastive explanation is the ordinary shape of causal inquiry. In epidemiology, we ask why a patient developed lung cancer rather than remaining healthy. We don't first demand a rigorous definition of "healthy" that accounts for every cellular variance. We look for the difference-maker. Here, the historian identifies a material bottleneck: land scarcity. Both regions hit it. One escaped via coal and colonies; the other didn't. The fact that "China" contains non-industrializing regions is irrelevant if the *advanced* region failed to industrialize. The contrast class is fixed by the phenomenon: sustained growth.

  **Elena:** But that ignores my second condition: the set of alternatives must be closed under the causal model. If the explanans is "accessible coal and ghost acres," why did the Netherlands not industrialize first? They had trade, capital, and access to New World goods, but no coal. If the answer is simply "coal," then the question should be "Why Britain rather than the Netherlands?" If the answer is "coal plus colonies," why not Japan? They had coal, but no colonies. The historian's model licenses too many contrasts. He hasn't isolated the specific difference that makes Britain unique against *all* plausible near-misses. He treats "China" as the only alternative, which is an artifact of his narrative, not his causal logic.

  **Marcus:** You're treating contrast classes as stipulations rather than empirical discoveries. We don't decide the alternatives *a priori*; the evidence tells us which comparisons are live. Song China is a near-miss. Tokugawa Japan is a near-miss. The Dutch Republic is a near-miss. The historian isn't ignoring them; he's arguing that the *conjunction* of factors—coal geography *plus* New World land—only obtained in Britain. That's a valid causal claim. It doesn't matter if the question could be sliced finer. A question is well-posed if it admits of a true answer, even if that answer is a conjunction of factors plus contingency. To demand a closed set of alternatives beforehand is to ask for a deductive proof where only abductive inference is possible.

  **Elena:** I will concede the point on interests, Marcus. My third condition was that the questioner's interests must settle which difference-maker counts. Perhaps the historian's interest *is* specifically the land constraint, which filters out the Netherlands (who lacked coal) and Japan (who lacked colonies). If we accept that the question is implicitly "Why did Britain escape the land constraint rather than China?", the interest condition is met. But this revision undermines his original claim. He isn't explaining "Industrialization" broadly; he's explaining "Escape from Malthusian traps via exogenous resources." That is a much narrower phenomenon. And if we narrow the phenomenon, the "China" label becomes even more indefensible. The Yangzi Delta didn't lack knowledge of coal; it lacked coal *near water*. The explanation is geological luck, not civilizational divergence.

  **Marcus:** And why is "geological luck" not a historical explanation? If a geologist asks why this valley flooded and that one didn't, and the answer is "the bedrock was porous here but not there," we accept it. We don't say the question was ill-posed because "valley" is a vague term. You seem to think that if the answer involves luck or geography, the historical question dissolves. But history is full of contingencies. The coal was near the surface in Britain. It was deep and inland in China. That is a fact. It explains the divergence in energy regimes. Whether we call the units "England" or "the Yangzi" changes the word count, not the causal mechanism.

  **Elena:** It changes the causal mechanism because it changes the counterfactuals. If the unit is "China," the counterfactual is "If China had British institutions, would it industrialize?" If the unit is "the Yangzi," the counterfactual is "If the Yangzi had British geology, would it industrialize?" The historian wants to have it both ways. He uses the civilizational label to imply institutional or cultural failure, but relies on geological luck to explain the outcome. That is why the question is unstable. Consider the rise of modern science. If we ask "Why modern science in Europe rather than China?", geology is irrelevant. There, the commensurability problem bites harder. You cannot compare the Royal Society to the Imperial Academy without addressing the political structure. With industry, you can hide behind coal. With science, you cannot.

  **Marcus:** That distinction actually supports me. It shows that different historical questions require different levels of aggregation. For industry, material flows matter, so geography is a legitimate difference-maker. For science, institutional flows matter, so polity is the unit. The historian is asking about industry. The coal argument holds. You are worried that the "Britain vs. China" framing smuggles in cultural essentialism. I agree that's a risk. But the remedy isn't to declare the question ill-posed; it's to test the causal claim. If the Yangzi had shallow coal near navigable water, would they have used it? Evidence suggests yes. Therefore, the coal explanation works. The question is robust enough to bear the weight of the answer.

  **Elena:** Robustness isn't validity. My worry is that by accepting "Britain vs. China" as a valid contrast, we legitimize explanations that ignore internal variation. You say the remedy is testing the claim. I say the remedy is reformulating the question until the units match. If we agree the real comparison is England vs. Yangzi, then the "China" part of the original question is a distraction. The historian *supposed* he was answering a civilizational question. He was not. He answered a regional resource question. The disagreement remains: I say a question is ill-posed if the answer forces us to change the terms of the question to make sense of it. You say the question is valid if the answer is true, regardless of the terms.

  **Marcus:** Precisely. And I maintain that your conditions would rule out most successful explanations in the special sciences. We accept the explanation that works. The coal was there; the colonies were there. The land constraint broke. That is why growth happened here and not there. Whether "there" is defined by a river delta or an imperial border is a matter of map-drawing, not metaphysics.

  **Elena:** Then we are at an impasse. You see the map-drawing as pragmatic; I see it as constitutive of the explanation. Until we agree on whether "China" is a variable or a constant, we aren't even arguing about the same history.

  **Marcus:** And until you agree that a true explanation validates the question that prompted it, you'll find history perpetually silent. The coal burned. The question stands.
