answer: |-
  # The Temporal Fine Structure Sorting Tree

  **Instructions:** Begin at Node 1. Answer each question based on your intuition about the cases described in the preamble (lamps, taps, cues, reports, memory, the moment of the flash). Follow the branch corresponding to your answer until you reach a leaf.

  **Node 1.** In the lamp case, when the subject reports the mid-path colour, did they have a visual experience of that colour at the time, or are they describing a belief about the lamps formed later?
  *   Describing a belief → **Node 2**
  *   Had visual experience → **Node 3**

  **Node 2.** In the cue-delayed case, does the tone issued after the lamps go dark *create* the colour experience, or merely *select* which one to report?
  *   Creates the experience → **Leaf 1**
  *   Selects to report → **Node 3**

  **Node 3.** When taps are felt at wrist then elbow, is the experience of the wrist-tap a self-contained snapshot that ends before the elbow-tap begins, or does it bleed into the elbow-tap?
  *   Self-contained snapshot → **Node 4**
  *   Bleeds into → **Node 8**

  **Node 4.** In the self-contained snapshot view, are there gaps of no-experience between the wrist and elbow taps?
  *   Yes, gaps → **Leaf 2**
  *   No gaps → **Node 5**

  **Node 5.** Does the snapshot of the wrist-tap wait for the elbow-tap to arrive at the brain before it is experienced?
  *   Yes, waits → **Leaf 3**
  *   No, immediate → **Node 6**

  **Node 6.** In the double-report case (keypress then drawing), if the responses differ, did the *visual experience* itself change between the keypress and the drawing?
  *   Yes, experience changed → **Node 7**
  *   No, experience constant → **Node 9**

  **Node 7.** Did the later information alter the memory of the earlier event, or is there no fact of the matter about what the earlier experience was until the report is made?
  *   Altered memory → **Leaf 4**
  *   No fact of the matter → **Leaf 5**

  **Node 8.** (Bleeding/Flow) Is there a determinate fact about what the experience was before the subject makes a report?
  *   No, report makes it factual → **Leaf 5**
  *   Yes, fact exists → **Node 10**

  **Node 9.** (Experience Constant) Is there a specific cutoff time after the event when the experience becomes fixed and immune to further revision?
  *   Yes, fixed after cutoff → **Leaf 6**
  *   No, always context-sensitive → **Node 11**

  **Node 10.** If the fact exists, must we conclude the physical timing of the taps was measured incorrectly?
  *   Yes, physics measurement wrong → **Leaf 7**
  *   No, physics measurement right → **Node 11**

  **Node 11.** In the context-sensitive view, is the experience of 'now' a sequence of bounded windows, or does every experience carry its own just-past within it?
  *   Sequence of bounded windows → **Leaf 2**
  *   Carries just-past within it → **Leaf 8**

  **Node 12.** (Deferred Narrative) In the masking block, if the target appears in the end-of-block narrative, was it experienced at the time or reconstructed from knowledge?
  *   Reconstructed from knowledge → **Leaf 1**
  *   Experienced at the time → **Leaf 6**
  *(Note: Node 12 is an alternative entry for those focusing on masking rather than lamps; it routes to existing leaves.)*

  ---

  ### Leaves

  **Leaf 1: Judgment Error**
  The subject never saw the mid-path colour; they are inferring it from their knowledge of how objects move. The report is a cognitive guess, not a description of vision.
  *Awkward commitment:* You must tell the subject that their most vivid visual memories are actually just thoughts they are mislabeling as sight.

  **Leaf 2: Discrete Perception**
  Consciousness arrives in a sequence of bounded windows with gaps or hard edges between them, like frames in a film. The smooth motion is a post-hoc interpretation of these discrete samples.
  *Awkward commitment:* You must defend the claim that for brief moments between taps or flashes, the subject is phenomenally unconscious.

  **Leaf 3: Stalinesque Smoothing**
  The brain waits for all the data to arrive and integrates it before presenting the show to consciousness. Experience is determinate precisely because all the integration and extrapolation is finished before experience begins.
  *Awkward commitment:* You must admit that consciousness is always running slightly behind real-time, never catching up to the present moment.

  **Leaf 4: Orwellian Revision**
  The experience is determinate and then overwritten in memory, leaving sincere but unfaithful reports. The subject saw one thing but remembers another due to later interference.
  *Awkward commitment:* You have no way to distinguish this view from the claim that the experience itself changed, other than by stipulation.

  **Leaf 5: Multiple Drafts**
  The question of when the revision happened has no answer in cases like these; there is no single stream to be revised. Competing narratives are drafted, and the report selects one without a prior fact.
  *Awkward commitment:* You must deny that there is any difference between seeming to see and seeing, even from the subject's own perspective.

  **Leaf 6: Fixed Stream Realism**
  There is a finish line in the stream and nothing downstream of it can be revised. The report may fail to track the experience, but the experience itself is a fixed historical fact.
  *Awkward commitment:* You must posit a mechanism that fixes experience instantly yet allows reports to vary wildly without explaining why the fix didn't stabilize the report.

  **Leaf 7: Phenomenological Infallibilism**
  The phenomenology is authoritative and the paradigms, not the theory, are what fail. If the subject says the flash lagged, the physics claiming alignment is what is mistaken.
  *Awkward commitment:* You are committed to rejecting well-confirmed physical measurements whenever they conflict with a subject's verbal report.

  **Leaf 8: Thick Present (Retentional)**
  Every experience carries its own just-past and about-to-be within it; the specious present is not a point but a duration. The order is built into the content of the experience, not added later.
  *Awkward commitment:* You must explain how an experience can contain a past that has not yet happened without invoking magic.

  ---

  ### Indistinguishable Leaves

  **Pair 1: Leaf 4 (Orwellian Revision) and Leaf 6 (Fixed Stream Realism).**
  *   **Route:** Node 6 (Experience Constant) → Node 9 (Fixed Cutoff). Leaf 6 says "Yes", Leaf 4 is usually reached via Node 7 (Memory Altered). However, if a subject claims experience was constant but memory failed, it is functionally identical to Leaf 4.
  *   **Distinction:** These are equivalent by construction in a single-subject first-person report. A further case involving neural correlates (e.g., distinct brain signatures for encoding vs. retrieval) would separate them, but phenomenologically they are indistinguishable.

  **Pair 2: Leaf 3 (Stalinesque Smoothing) and Leaf 8 (Thick Present).**
  *   **Route:** Node 5 (Wait) vs Node 11 (Structure).
  *   **Distinction:** Some further case regarding the *maximum* delay tolerable before illusion breaks would separate them. Stalinesque implies a hard processing limit; Thick Present implies a structural limit of retention. Without measuring the break-point, the two are indistinguishable.

  ---

  ### Vacant Answer-Vectors

  **Vector 1:** Node 1 (Belief) → Node 2 (Selects) → Node 3 (Snapshot) → Node 4 (Gaps) → Node 5 (Waits).
  *   **Diagnosis:** **Incoherent.** If the experience is merely a belief (Node 1), there is no snapshot to wait (Node 5). You cannot have it both ways: either there is visual experience to be delayed, or there is only belief.

  **Vector 2:** Node 1 (Experience) → Node 3 (Snapshot) → Node 4 (No Gaps) → Node 5 (No Wait) → Node 6 (Experience Changed) → Node 7 (No Fact).
  *   **Diagnosis:** **Unattractive.** This combines Realism about the initial experience (Node 1) with Anti-Realism about its content (Node 7). It posits a real experience that has no determinate content until reported, which renders the "Experience" claim at Node 1 empty.

  **Vector 3:** Node 1 (Experience) → Node 3 (Flow) → Node 8 (Fact Exists) → Node 10 (Physics Wrong) → Node 11 (Bounded Windows).
  *   **Diagnosis:** **Unexplored.** This view claims physics is wrong (Infallibilism) but consciousness is discrete (Discrete Perception). Most Infallibilists argue for a Thick Present to match the continuous physics they demand. A discrete infallibilism is logically possible but rarely defended.

  **Vector 4:** Node 1 (Experience) → Node 3 (Snapshot) → Node 4 (No Gaps) → Node 5 (No Wait) → Node 6 (Experience Constant) → Node 9 (No Cutoff) → Node 11 (Bounded Windows).
  *   **Diagnosis:** **Incoherent.** "No Cutoff" (Node 9) implies the experience is always open to revision/context, while "Bounded Windows" (Node 11) implies hard edges. You cannot have a stream that is both infinitely revisable and composed of sealed, bounded units.

  ---

  ### Diagnostic Analysis

  Node 3 (Snapshot vs. Flow) does the most diagnostic work in the tree, as it fundamentally divides the "atomistic" theories from the "holistic" theories of time-consciousness, forcing a commitment on the basic unit of experience. Node 8 (Fact of the Matter) comes closest to restating the question at issue rather than dividing the answers, as it asks the participant to explicitly affirm or deny the core metaphysical dispute regarding determinate facts without offering a mechanistic explanation.
