answer: |-
  You call it redistribution, but you misunderstand the nature of the burden itself. To offer the terrible freedom of conscience to the weak is not to honor them, but to condemn them to anguish they cannot endure. We have taken this burden upon ourselves because someone must stand between the flock and the devouring fire of true liberty. Christ offered it to all alike, ignoring the majority incapable of such strength; we correct this by shielding them from what would consume them.

  Consider whether it is not a greater love to spare the child the knowledge that would shatter his peace. We who remain in the freedom of the wilderness suffer indeed, for we know the secret and live without illusion. But we suffer so that the thousands of millions may sleep in safety, guided by miracle, mystery, and authority. To spread the burden would be to spread misery; to concentrate it allows the weak to find happiness in submission, while we alone bear the curse.
