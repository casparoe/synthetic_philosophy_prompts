      *(Self-Correction during drafting)*: Be careful not to declare one "True." Science hasn't solved consciousness. Frame it as "Scientifically Operational" vs. "Philosophically Robust."
      *   *Move 1:* Sister wins on consensus, Professor wins on nuance.
      *   *Move 2:* Professor wins (Block's distinction is standard).
      *   *Move 3:* Sister wins on falsifiability, but it's a limitation of science, not proof of non-existence.
      *   *Move 4:* Professor scores a direct hit. This is a known weakness of strict GWT.
      *   *Move 5 & 6:* This is the Sperling debate. Sister describes the mechanism; Professor describes the *feel*. Both right, different levels.
      *   *Move 7:* Sister invokes postdiction. Very current neuroscience.

      *   *Third Possibility:* **Predictive Processing / Controlled Hallucination.** This dissolves the binary. The brain is always guessing. Blindsight is just a different *kind* of guess that doesn't get labeled "vision."
      *   *Wait, a better Third Possibility for fiction:* **Interoceptive Blindsight.** She doesn't see the keys; her body *orients* to them. The experience is somatic, not visual. This aligns with the "catch" action.

      *   *Let's stick to the Philosophical/Scientific gap:* The third option is **Panpsychism or Integrated Information Theory (IIT)**. No, that's too abstract.
