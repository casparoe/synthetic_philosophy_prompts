answer: |-
  # Section Handout: The *On Certainty* Sorting Tree
  **Course:** Intro to Epistemology | **TA:** [Your Name] | **Date:** [Tuesday Date]

  **Instructions:** We are spending today mapping where you actually stand on Wittgenstein's *On Certainty*. There are no right answers, only consistent ones. Start at **Node 1** and follow your answers down to a **Leaf**. Read the description at your Leaf to see which philosophical position matches your intuitions.

  ---

  ### NODE 1: The Grandma Test (Revisability)
  Your grandmother treated "The people in charge know what they're doing" as unquestionable her whole life, then changed her mind at age 60.
  *   **(A)** That proposition *was* a hinge for her, and hinges can change or be lost over time. → **Go to Node 2**
  *   **(B)** If it changed, it wasn't a real hinge. Real hinges are permanent bedrock. → **Go to Leaf: Deflationist**

  ### NODE 2: The Scope Test (Community)
  If hinges can change, do they change just for you, or for your whole group?
  *   **(A)** **Individual:** My hinges are my own business. → **Go to Node 3**
  *   **(B)** **Community:** We share hinges with our culture or language group. → **Go to Node 3**
  *   **(C)** **Nested:** There are universal human hinges (e.g., "objects exist") and local cultural ones (e.g., "democracy is good"). → **Go to Node 3** *(TA Note: See "Nested Collapse" in guide)*

  ### NODE 3: The Voluntarism Test (Choice)
  Can you *decide* to treat a claim as a hinge? (e.g., "I will choose to trust science.")
  *   **(A)** **Yes:** I can adopt a hinge by an act of will or decision. → **Go to Leaf: Unoccupied Position**
  *   **(B)** **No:** Hinges happen to me; I acquire them passively through upbringing or practice. → **Go to Node 4**

  ### NODE 4: The Belief Test (Status)
  When you say, "I know I have hands," are you reporting a mental state (a belief) or describing how you act?
  *   **(A)** **Action:** It's not a belief; it's a way of acting. Asking if it's "true" is a category mistake. → **Go to Leaf: Non-Doxastic**
  *   **(B)** **Belief:** It is a belief, just a very special kind. → **Go to Node 5**

  ### NODE 5: The Therapy Test (Quietism)
  Is the skeptic's question ("But do you *really* know?") a genuine puzzle we need to solve?
  *   **(A)** **No:** The question itself is confused. Philosophy should dissolve it, not answer it. → **Go to Leaf: Quietist**
  *   **(B)** **Yes:** There is a real problem about how these beliefs are justified. → **Go to Node 6**

  ### NODE 6: The Evidence Test (Deflation)
  Do you have empirical evidence for your hinge propositions (e.g., past success of perception)?
  *   **(A)** **Yes:** They are just extremely well-confirmed ordinary beliefs. → **Go to Leaf: Deflationist**
  *   **(B)** **No:** They cannot be evidenced by ordinary means. → **Go to Node 7**

  ### NODE 7: The Access Test (Knowledge)
  Do you *know* these propositions are true, even if you can't cite evidence?
  *   **(A)** **Yes:** I know them directly (like an animal knows its territory), without needing reasons. → **Go to Leaf: Externalist**
  *   **(B)** **No:** "Knowledge" is too strong. I am only *entitled* to trust them. → **Go to Node 8**

  ### NODE 8: The Criticism Test (Relativism)
  If another community has different hinges (e.g., they trust oracles, we trust science), can we say they are wrong?
  *   **(A)** **No:** Hinges define what counts as "right." We can't judge from outside. → **Go to Leaf: Framework Relativist**
  *   **(B)** **Yes:** Some hinges are universally rational, even if not evidenced. → **Go to Leaf: Entitlement Theorist**

  ---

  ### THE LEAVES (Results)

  **1. Non-Doxastic Hinge Epistemology**
  *   **The View:** Hinges aren't beliefs; they are enacted in what you do. The skeptic asks a malformed question.
  *   **The Cost:** You have to tell your Intro Psych professor that "belief" isn't the right word for your most basic commitments.
  *   **Key Proponents:** Danièle Moyal-Sharrock.

  **2. Quietist / Dissolutionist**
  *   **The View:** There is no theory to build here. Skepticism is a disease of language that vanishes when we look at use.
  *   **The Cost:** You can't offer a positive argument against the skeptic; you can only show them they are confused.
  *   **Key Proponents:** James Conant, Cora Diamond.

  **3. Deflationist (Moore-ish)**
  *   **The View:** Hinges are just ordinary beliefs with massive evidence. *On Certainty* adds nothing new to common sense.
  *   **The Cost:** You risk missing Wittgenstein's point that hinges function differently than empirical claims.
  *   **Key Proponents:** G.E. Moore (pre-Wittgenstein), some naturalists.

  **4. Externalist / Animal Knowledge**
  *   **The View:** You know hinges factually, but you don't need internal access to *why* you know them.
  *   **The Cost:** You have to accept that you know things you cannot explain or defend in a debate.
  *   **Key Proponents:** Duncan Pritchard.

  **5. Entitlement Theorist**
  *   **The View:** You don't *know* hinges, but you have a rational warrant (entitlement) to trust them without evidence.
  *   **The Cost:** You must admit you lack knowledge of the external world, even though you are rational to act on it.
  *   **Key Proponents:** Crispin Wright.

  **6. Framework Relativist**
  *   **The View:** Hinges are relative to a form of life. Rival frameworks are incommensurable.
  *   **The Cost:** You lose the ability to say a radically different culture is objectively mistaken about reality.
  *   **Key Proponents:** David Overton, some anthropological readings.

  **7. Unoccupied Position (Voluntarist)**
  *   **The View:** Hinges can be chosen or adopted by decision.
  *   **The Cost:** Most literature says hinges are arational and passive; choosing one turns it into a policy, not a hinge.
  *   **Key Proponents:** None significant (Pragmatists flirt with this, but rarely commit).

  ---

  # TA GUIDE & META-COMMENTARY
  *(Do not print this section. For your preparation only.)*

  ### 1. The "Nested" Collapse (Node 2)
  You suspected students answering **"Nested"** would collapse leaves. You are right.
  *   **The Collapse:** If a student chooses **Nested**, the distinction between **Entitlement Theorist** (Leaf 5) and **Framework Relativist** (Leaf 6) blurs.
  *   **Why:** A nested view usually posits universal hinges (Entitlement territory) *and* local hinges (Relativist territory). If they say "Some hinges are universal, some local," they end up at Leaf 5 for the universal ones and Leaf 6 for the local ones.
  *   **Handling it:** If a student lands here, tell them they are holding a **Hybrid Contextualist** view. They aren't wrong, but the tree forces a binary at Node 8 that their "Nested" answer complicates.

  ### 2. The Quietist vs. Deflationist Problem (Node 5 & 6)
  *   **The Issue:** You suspected these give identical answers. In practice, **Quietist (Leaf 2)** and **Deflationist (Leaf 3)** often converge on "Stop worrying about skepticism."
  *   **Can we separate them?** Not cleanly on a one-page handout. The distinction is tonal/methodological (therapy vs. theory) rather than propositional.
  *   **The Fix:** Node 5 asks if there is a "genuine puzzle." A Deflationist might say "No" (leading to Quietist leaf) but mean "No, because the evidence is obvious," whereas a Quietist means "No, because the question is nonsense."
  *   **Admission:** If a student argues they are both, concede it. Tell them: *"Quietism is about the method; Deflationism is about the status of the belief. You can be both, but for this exercise, pick whether you think Wittgenstein is doing therapy (Quietist) or epistemology (Deflationist)."*

  ### 3. The Unoccupied Branch (Node 3)
  *   **Status:** You asked to flag if nobody occupies the "Yes" on Voluntarism.
  *   **Verdict:** **Correct, it is unoccupied.** Mainstream *On Certainty* scholarship (Moyal-Sharrock, Wright, Pritchard) agrees hinges are **arational** and **passive**. They are "swung" by our form of life, not chosen.
  *   **Why:** If you choose a hinge, it becomes a maxim or a policy (e.g., "I will act *as if* the world exists"). Wittgenstein insists hinges are not assumptions we make; they are the background against which assumptions happen.
  *   **Student Reaction:** Expect your most agentic/individualistic students to land here. Tell them they are channeling William James (*The Will to Believe*), not Wittgenstein.

  ### 4. Confidence Assessment
  *   **Overall Confidence:** **Moderate-High.** These joints track the major contemporary debates (Wright vs. Pritchard vs. Moyal-Sharrock). This is a standard mapping of the post-2000 *On Certainty* literature.
  *   **The Weakest Link:** **Node 5 (The Therapy Test).**
      *   **Why:** Distinguishing "Dissolving a problem" from "Solving it by saying evidence is unnecessary" is notoriously difficult. Some scholars (e.g., Avner Baz) argue that even the "Entitlement" theorists are trying to solve a problem Wittgenstein wanted to dissolve.
      *   **Risk:** A specialist might argue that Leaf 2 (Quietist) and Leaf 5 (Entitlement) are incompatible, while others argue Entitlement *is* the quietist solution.
      *   **Mitigation:** If a student pushes back, acknowledge that the boundary between "epistemology" and "therapy" in Wittgenstein is the single most contested fault line in the scholarship. You aren't simplifying; you're navigating a minefield.

  ### 5. Logistics for the 50-Minute Section
  *   **0-5 min:** Handout distribution + context setting (acknowledge the "mom exists" panic).
  *   **5-20 min:** Silent work + pairing up. Have them find their leaf.
  *   **20-40 min:** Group by Leaf. Have each group report their "Cost." (This is where the gold is: The Externalists will complain about not being able to explain themselves; The Relativists will worry about tolerance).
  *   **40-50 min:** Debrief. Highlight the **Voluntarism** empty branch. Explain that Wittgenstein thinks we are *in* the language game, not standing outside choosing it. This addresses your roommate's critique ("nobody can be wrong") by showing that *constraints* exist (forms of life), even if they aren't empirical proofs.
