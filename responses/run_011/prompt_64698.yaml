answer: |-
  **Axes of Disagreement**

  Before entering the interview, note that the respondents will diverge along these five dimensions. The tree sorts them by their answers to cases, but these are the underlying fault lines.

  1.  **Ontology:** Does an attribution of preference report an inner state (a desire, a valuation) or merely summarise a pattern of behaviour?
      *   *Separates:* Mental realists from behaviourists and formalists.
  2.  **Constitution:** Is choice evidence of a pre-existing preference, or does the act of choosing constitute the preference?
      *   *Separates:* Stability advocates from constructionists.
  3.  **Welfare:** Does satisfying a preference necessarily make a person's life go better, or can one satisfy a preference while being worse off (or acting from duty)?
      *   *Separates:* Welfarists from separationists and hedonists.
  4.  **Authority:** When a person's report of their own satisfaction conflicts with their observed choices or history of deprivation, which account is true?
      *   *Separates:* Subjectivists from objectivists and adaptive-preference theorists.
  5.  **Normativity:** Is the ordering a description of what is, a prescription for what should be optimised, or a mathematical device with no truth value?
      *   *Separates:* Alignment researchers from descriptive economists and fictionalists.

  ***

  **Decision Tree**

  **Node 1** — Consider the smoker who buys cigarettes every day but says, sincerely, that they would rather not. Is it correct to say they *prefer* smoking, despite what they say?
  *   If **Yes** (Choice overrides report): Go to Node 2.
  *   If **No** (Report overrides choice): Go to Node 5.

  **Node 2** — Consider the shopper who pays more for a product because of how it was made, reports no enjoyment from it, and expects no personal benefit. Did this choice make their life go better?
  *   If **Yes** (Satisfaction equals welfare): Go to Node 3.
  *   If **No** (Welfare and choice can part): Go to Node 4.

  **Node 3** — Imagine a decade-long ledger of every purchase and tap an app compiles into a complete ordering. Did the app *find* this ordering or *manufacture* it?
  *   If **Found** (Discovery): Go to Node 6.
  *   If **Manufactured** (Construction): Go to Node 7.

  **Node 4** — Consider a model trained on millions of human comparisons, whose designers describe it as having learned preferences. Is the model learning a truth about the humans or fitting a curve to their actions?
  *   If **Truth** (Learning): Go to Node 8.
  *   If **Curve** (Fitting): Go to Node 9.

  **Node 5** — Consider the person raised with very few options who reports themselves entirely satisfied. Is their report trustworthy?
  *   If **Yes** (Subjective authority): Go to Node 10.
  *   If **No** (Adaptive distortion): Go to Node 11.

  **Node 6** — If the app's ledger shows a person choosing A over B, but B over A when a third option C is present, is the person's ranking broken?
  *   If **Yes** (Error/Incoherence): Go to Leaf A.
  *   If **No** (Contextual/Valid): Go to Leaf B.

  **Node 7** — If the ordering is manufactured by the act of elicitation, is inconsistency a defect in the person or the norm of human psychology?
  *   If **Defect** (Should be fixed): Go to Leaf C.
  *   If **Norm** (Acceptable): Go to Leaf D.

  **Node 8** — If the model has learned a truth, does satisfying that learned preference necessarily make the human better off?
  *   If **Yes** (Alignment = Welfare): Go to Leaf E.
  *   If **No** (Alignment != Welfare): Go to Leaf F.

  **Node 9** — If the model is only fitting a curve, is the word "preference" useful for describing what the model holds?
  *   If **Yes** (Useful shorthand): Go to Leaf G.
  *   If **No** (Misleading): Go to Leaf H.

  **Node 10** — Does the satisfied person's preference exist before the moment you ask them to choose, or is it produced by the question?
  *   If **Before** (Fixed): Go to Leaf I.
  *   If **Produced** (Constructed): Go to Leaf J.

  **Node 11** — If the deprived person's preferences are distorted, is there a "true" preference hidden underneath?
  *   If **Yes** (Latent truth): Go to Leaf K.
  *   If **No** (No fact of the matter): Go to Leaf L.

  **Node 12** — (For those at Node 2/3 boundary) Is utility a felt experience, such that a preference can be satisfied without anyone feeling any different?
  *   If **Yes** (Objective satisfaction): Go to Leaf A.
  *   If **No** (Requires feeling): Go to Leaf M.

  **Node 13** — (For those at Node 5/11 boundary) If we cannot observe the ordering itself, is talk of preference a useful fiction answering to nothing at all?
  *   If **Yes** (Instrumentalism): Go to Leaf H.
  *   If **No** (Realism): Go to Leaf I.

  **Node 14** — (For those at Node 8/9 boundary) Is the preference a target to be optimised by the system, regardless of the human's mental state?
  *   If **Yes** (Optimization target): Go to Leaf F.
  *   If **No** (Descriptive only): Go to Leaf G.

  ***

  **Leaves**

  **Leaf A: Revealed Preference Welfarism**
  *   **Name:** Revealed Preference Welfarism.
  *   **Awkward Commitment:** If a person chooses a harmful option consistently, we must conclude it benefits them, even if they suffer.
  *   **Function:** Describing behaviour and serving as an optimisation target.
  *   **Follow-up:** If the smoker dies of lung cancer, did their choices maximise their welfare?

  **Leaf B: Contextual Constructionism**
  *   **Name:** Unnamed (Contextual Constructionism).
  *   **Awkward Commitment:** There is no stable "self" to consult; the person changes depending on how the question is asked.
  *   **Function:** Describing behaviour only.
  *   **Follow-up:** If the context changes again, is there any sense in which the second choice was more "honest" than the first?

  **Leaf C: Normative Realism**
  *   **Name:** Unnamed (Normative Realism).
  *   **Awkward Commitment:** Humans are systematically broken and need their preferences corrected by an external standard to be coherent.
  *   **Function:** Serving as an optimisation target.
  *   **Follow-up:** Who gets to decide which inconsistencies are defects and which are valid expressions of taste?

  **Leaf D: Descriptive Constructionism**
  *   **Name:** Unnamed (Descriptive Constructionism).
  *   **Awkward Commitment:** Inconsistency is not an error, so there is no "correct" choice to train a model towards.
  *   **Function:** Describing behaviour.
  *   **Follow-up:** If there is no correct choice, what is the machine learning system actually minimising when it reduces loss?

  **Leaf E: Idealised Welfarism**
  *   **Name:** Idealised Welfarism.
  *   **Awkward Commitment:** We know what is good for people better than they do, provided we correct for their lack of information or impulsiveness.
  *   **Function:** Denoting a mental state and serving as an optimisation target.
  *   **Follow-up:** What specific information would the deprived person need to have for their satisfaction to count as genuine?

  **Leaf F: Alignment Separationism**
  *   **Name:** Unnamed (Alignment Separationism).
  *   **Awkward Commitment:** We can successfully optimise for what a human wants while making their life objectively worse.
  *   **Function:** Serving as an optimisation target.
  *   **Follow-up:** If the system gives the human exactly what they choose and they end up miserable, was the system aligned or misaligned?

  **Leaf G: Instrumental Behaviourism**
  *   **Name:** Instrumental Behaviourism.
  *   **Awkward Commitment:** The word "preference" is convenient shorthand but refers to nothing real inside the person or the machine.
  *   **Function:** Describing behaviour.
  *   **Follow-up:** If it refers to nothing real, why do we worry about the machine "learning" it rather than just "predicting" it?

  **Leaf H: Fictionalism**
  *   **Name:** Fictionalism.
  *   **Awkward Commitment:** The entire theory is false, but we should keep using it because it works better than the truth.
  *   **Function:** Describing behaviour.
  *   **Follow-up:** At what point does using a known falsehood become unethical, particularly in automated decision-making?

  **Leaf I: Mental Realism**
  *   **Name:** Mental Realism.
  *   **Awkward Commitment:** There is a fact of the matter about what someone wants, even if they never choose it and cannot articulate it.
  *   **Function:** Denoting a mental state.
  *   **Follow-up:** If they never choose it and cannot articulate it, what evidence could possibly prove you right about their preference?

  **Leaf J: Subjective Constructionism**
  *   **Name:** Unnamed (Subjective Constructionism).
  *   **Awkward Commitment:** The preference is real, but it only comes into existence at the moment of the choice.
  *   **Function:** Denoting a mental state.
  *   **Follow-up:** If the preference is created in the moment, can we say the person "wanted" it before they chose it?

  **Leaf K: Latent Preference Objectivism**
  *   **Name:** Unnamed (Latent Preference Objectivism).
  *   **Awkward Commitment:** People can be wrong about their own desires, and there is a true version waiting to be uncovered.
  *   **Function:** Denoting a mental state and serving as an optimisation target.
  *   **Follow-up:** Is this true preference accessible to the person themselves, or only to an observer with more data?

  **Leaf L: Eliminativism**
  *   **Name:** Eliminativism.
  *   **Awkward Commitment:** There is no such thing as preference, not even as a fiction; there are only causes and effects.
  *   **Function:** None (the term should be discarded).
  *   **Follow-up:** If there is no preference, what variable should an engineer adjust to make a system behave more cooperatively?

  **Leaf M: Hedonistic Welfarism**
  *   **Name:** Hedonistic Welfarism.
  *   **Awkward Commitment:** A person can get exactly what they want and be no better off if it brings no felt pleasure.
  *   **Function:** Denoting a mental state (feeling).
  *   **Follow-up:** If a person chooses a painful duty over a pleasant leisure activity, did they act against their welfare?

  ***

  **Limitations of the Instrument**

  **Indistinguishable Leaves**
  1.  **Leaf G (Instrumental Behaviourism) and Leaf H (Fictionalism).**
      *   *Reason:* Both treat the vocabulary as non-referential. In practice, a respondent who says "it's just a shorthand" and one who says "it's a useful fiction" will behave identically in modelling scenarios.
      *   *Extra Question:* "If you discovered a physiological marker that perfectly predicted choice, would you say you had found the preference, or just another correlate?" (G says correlate; H says found).
  2.  **Leaf E (Idealised Welfarism) and Leaf K (Latent Preference Objectivism).**
      *   *Reason:* Both posit a "true" preference hidden behind error or deprivation. The distinction between "welfare" and "latent desire" collapses when the observer claims authority over both.
      *   *Extra Question:* "If the latent preference is uncovered but the person hates it, have you helped them?" (E says yes; K might hesitate).
  3.  **Leaf A (Revealed Preference Welfarism) and Leaf F (Alignment Separationism).**
      *   *Reason:* Both treat the choice as the target for optimisation. A differs by claiming this *is* welfare; F claims it is *not* welfare but is still the target. In an engineering context, the output is the same.
      *   *Extra Question:* "Is the goal of the system to make the user happy, or to make the user get what they chose?" (A says same thing; F says different).

  **Unoccupied Combinations**
  1.  **Node 1 (No: Report overrides choice) + Node 3 (Found: App discovered ordering).**
      *   *Diagnosis:* **Incoherent.** If the smoker's report overrides their choice, then the app's ledger of choices cannot have "found" the true ordering; it must have recorded errors. You cannot hold that self-report is authoritative for the smoker but that behavioural data is authoritative for the app user without a distinguishing principle (e.g., sophistication), which the tree does not capture.
      *   *Likely Holder:* None.
  2.  **Node 7 (Norm: Inconsistency is acceptable) + Node 14 (Yes: Target to be optimised).**
      *   *Diagnosis:* **Unattractive.** If inconsistency is the norm of human psychology, optimising for a single coherent ordering forces the human into a shape they do not fit. This is a position an ML practitioner might hold (force the human to fit the model), but it is philosophically unstable.
      *   *Likely Holder:* Machine-learning practitioner focused on convergence over fidelity.
  3.  **Node 5 (Yes: Report trustworthy) + Node 11 (No: No true preference).**
      *   *Diagnosis:* **Unexplored.** This suggests that the deprived person's report is true *because* there is no deeper fact of the matter, yet we still trust it. It is a form of quietism that avoids the "adaptive preference" critique by denying the existence of the preference entirely while accepting the report.
      *   *Likely Holder:* A sociologist or anthropologist rather than an economist or ML researcher.
