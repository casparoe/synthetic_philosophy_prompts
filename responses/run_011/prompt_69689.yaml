answer: |-
  The Weberian definition of the state is often recited like a mantra in political theory: the human community that successfully claims the *monopoly of the legitimate use of physical force*. In the heated triage of the policing debate—Reform, Defund, Abolish—this definition is treated as a monolith. Activists and policymakers speak of "the monopoly" as if it were a single switch to be flipped. But it is not. It is a bundle of two distinct distinct components: the **Institution** (the standing army of uniformed enforcers, i.e., the police) and the **Claim** (the legal and philosophical assertion that only the state may authorize violence).

  These two things can be unbundled. You can maintain the Claim while dismantling the Institution (relying on courts, regulatory bodies, or highly restricted, situational force). Conversely, you can maintain an Institution that looks like policing while eroding the Claim (community patrols, armed mutual aid networks, or private security firms granted deputized powers). Sorting the three major positions through this split reveals not just their goals, but their blind spots.

  **Reformers** are the custodians of the Bundle. They seek to keep the Institution intact and reinforce the Claim. Their argument is that the monopoly is legitimate but poorly managed. Body cameras, training, and oversight are mechanisms to ensure the state's violence remains "legitimate" in the eyes of the public. For the Reformers, the Institution is the only valid vessel for the Claim. To remove the police is to invite chaos; to restrict the state's right to authorize force is to invite vigilantism. They want a cleaner monopoly.

  **Abolitionists** are the dismantlers of the Institution, and often, by extension, the Claim. While rhetoric varies, the core of abolitionism is that the police as a class are incompatible with justice. But deep abolitionism goes further: it challenges the idea that the state should hold a monopoly on safety at all. It proposes restorative justice, community care, and decentralized accountability. In doing so, it erodes the Claim. If a community resolves a violent conflict without state authorization, the state's monopoly is punctured. Abolitionists are generally clear about this: they want to shift legitimacy from the state to the community.

  **Defunders** occupy the ambiguous middle, and this ambiguity is their critical weakness. "Defund the Police" is a demand to shrink the Institution's budget and scope. But it is notoriously silent on what happens to the Claim. When a mental health crisis responder replaces a police officer, is that responder a state agent wielding the state's Claim? Or are they a community worker operating outside the monopoly? Defund rhetoric often implies a transfer of power to the community (eroding the Claim) while relying on state funding and legal structures to implement it (reinforcing the Claim). This ambiguity allows Defund to function as a coalition between Reformers and Abolitionists, but it leaves the question of *legitimacy* unresolved. If the police leave, who has the right to use force? Defund often assumes the answer will reveal itself, which is a dangerous gamble when dealing with violence.

  This brings us to the harder, normative question. We must judge the state not by its ideals, but by its failures. Consider the victim of domestic violence who is told by the state, "You cannot shoot your abuser, only we can," and then the state fails to arrest the abuser despite repeated calls. Or the neighborhood where response times are hours long, effectively leaving residents unprotected. When the state forbids people from protecting themselves, and then fails to protect them, does that failure void its claim to exclusivity? Or does it merely generate a duty to protect better?

  The verdict must be hard: **The failure does not void the claim to exclusivity; it generates an absolute duty to protect better.**

  This is a Hobbesian necessity, not a moral endorsement of the status quo. To argue that failure voids the Claim is to invite a war of all against all. If the state's monopoly is contingent on performance, then every unavenged crime becomes a license for vigilantism. In practice, this does not empower the vulnerable; it empowers the powerful. The wealthy can buy private security (eroding the Claim for themselves while enforcing it against the poor); the marginalized end up in blood feuds they cannot win. The state's monopoly on violence, flawed as it is, is the only mechanism that theoretically equalizes force under the law. If we void the Claim because the state is incompetent, we do not get justice; we get feudalism. The state retains the exclusive right to authorize force, but in exchange for that exclusivity, it incurs an unpayable debt. It must protect. If it does not, it is not just inefficient; it is tyrannical.

  This verdict seems to hand the victory to the **Reformers**. If the Claim must be preserved to prevent chaos, and the Institution is the tool of the Claim, then Reform seems the logical path. But this is where the trap springs.

  The position that emerges best from this criterion is **Abolition**.

  This is counterintuitive. If the State must keep its Claim to prevent chaos, why support those who want to dismantle its enforcers? Because Reformers fundamentally misunderstand the relationship between the Institution and the Claim. By fighting to preserve the Police (the Institution), Reformers are actively destroying the Legitimacy (the Claim).

  Every time a police officer kills a civilian with impunity, the state's Claim to *legitimate* violence is degraded. Every time the police fail to solve a murder in a poor neighborhood, the state's Claim to *effective* protection is degraded. Reformers try to fix this by adding more rules to the Institution. But the Institution itself—the culture of policing, the qualified immunity, the militarized posture—is the primary generator of illegitimacy. You cannot repair the Claim while protecting the Institution that violates it.

  Abolitionists, by contrast, take the State's Duty seriously. They recognize that the current Institution makes it impossible for the State to fulfill its obligation to protect. By demanding the removal of the police, they are not necessarily attacking the State's Claim to exclusivity; they are attacking the specific vehicle that is causing the Claim to collapse. They argue, effectively, that the State cannot hold a monopoly on violence *through the police* because the police have made that monopoly illegitimate.

  Defunders are too ambiguous on the Claim to be trusted with the monopoly. Reformers are too attached to the Institution to save the Claim. Abolitionists are the only ones willing to sacrifice the tool to save the mission. If the state's duty is to protect, and the police prevent that protection, then abolition is the only path that allows the state to eventually reclaim its legitimate monopoly.

  Therefore, even if we accept that the state must retain the monopoly on violence to prevent societal collapse, Abolition is the most responsible position. It is the only one that acknowledges that a monopoly on violence without safety is not governance—it is a protection racket. And you do not reform a racket; you shut it down so a legitimate government can take its place.
