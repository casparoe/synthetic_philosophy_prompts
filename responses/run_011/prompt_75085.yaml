          *   Indistinguishability: It's conceptual. If "experience" = "access for report," and access is post-revision in both, the distinction collapses. It's not that brains are identical (they might differ microscopically), but that the *label* doesn't track a functional difference.
          *   "No Fact of the Matter": It's explanatory. It dissolves the hard problem of "when" experience happens by denying the presupposition that it *must* happen at a specific instant.
      *   *Section 2: The Peer's Objection.*
