      *   *Section 3: The Split-Content View (The Core).*
          *   *Diagnosis:* This is essentially the **Multiple Drafts Model** (Dennett's actual positive view), whereas Orwell/Stalinesque are the caricatures he rejects.
          *   *Is it a "Smeared Theater"?* Only if you insist the fragments must eventually meet in a central place to be reported. If the report is a "jury verdict" based on disparate evidence without a central meeting room, it avoids the theater.
          *   *Predictions:* Yes, it predicts dissociation.
              *   *Experiment:* TMS over motion area (V5/MT) vs. color area (V4) at specific intervals.
              *   *Hypothesis:* Disrupt V5 after Flash 1 -> No motion illusion, but maybe still see two flashes? Disrupt V4 after Flash 2 -> Motion illusion remains, but color change is lost (see two same-colored dots moving?).
              *   *Contrast:* A unified Stalinesque view might predict that disrupting *any* part of the integration window kills the whole illusion.
          *   *Weakness:* The "binding problem." If the content is split, how does the report come out as a unified sentence ("I saw a dot move and change")? The Split-Content view needs an account of *narrative unity* without a *unifier*.
      *   *Conclusion/Verdict:* The Split-Content view is better than the binary choice because it treats experience as a process, not an event. It needs to clarify the "binding" mechanism to avoid being just a fragmented Stalinesque view.

  6.  **Refining the Tone:**
