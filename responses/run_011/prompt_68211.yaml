answer: |-
  Here is the principle that underlies your verdicts, followed by the application to your new cases and a straight talk about where your intuitions might need slight calibration.

  ### The Principle of Constrained Calibration

  You can update your confidence in an instrument's reliability only when independent checks **constrain the instrument's error function.**

  This breaks down into three necessary clauses. If a check fails any of them, you gain little to no reliability confidence, even if the check "matches."

  **Clause 1: Independence (The Anchor)**
  The value used to check the instrument must be established without relying on the instrument's current output.
  *   *Motivated by:* **Case 4** (Roommate is an independent anchor) vs. **Case 3** (Spam filter checks itself).
  *   *Why:* If the anchor depends on the instrument, you are just checking for consistency, not accuracy.

  **Clause 2: Model Sufficiency (The Degrees of Freedom)**
  The number and spread of checks must match the complexity of the instrument's likely error mode. You need enough data points to solve for the variables in the error equation.
  *   *Motivated by:* **Case 1 vs. Case 6 vs. Case 2.**
  *   *Why:* This is the hidden difference between your van and your scale.
      *   **Case 1 (Van):** Fuel tanks are irregular volumes. The relationship between volume and height is non-linear. A single data point (half tank) cannot distinguish a working gauge from a stuck gauge or a curved error. You have more "degrees of freedom" (the shape of the curve) than "constraints" (one check).
      *   **Case 6 (Scale):** Scales are generally linear instruments (Force = Mass). If you assume the zero-point is zero (standard for digital), a single data point (100g sample) is sufficient to solve for the single variable: the offset error (+5g). You have one degree of freedom and one constraint.
      *   **Case 2 (Thermometer):** You suspected non-linearity or drift, so you used 12 points to map the curve.
  *   *The Repair:* Your intuition that Case 1 and Case 6 are the "exact same shape" is incorrect. They differ in the **prior probability of linearity**.

  **Clause 3: Domain Coverage (The Sampling)**
  The checks must sample the space of inputs the instrument will actually encounter, including potential failure states.
  *   *Motivated by:* **Case 3** (Spam) and **Case 7** (Red Wall).
  *   *Why:* In Case 3, you only sampled the "Spam" bucket. You have no data on the "Not Spam" bucket (False Negatives). In Case 7, seeing one red wall confirms vision works *for red walls in that light*, but does not confirm vision works generally (e.g., in red light).

  *(Note: A fourth implicit clause is **Defeater Absence**, motivated by **Case 8**. Specific prior evidence of a broken component overrides general consistency checks.)*

  ---

  ### Application to Your "Brain-Breaking" Cases

  **Case 1 vs. Case 6 Resolution**
  You asked which verdict goes if they are the same shape. The principle says **they are not the same shape.**
  *   **Case 1 (Van):** Correct verdict. One point does not constrain a non-linear system.
  *   **Case 6 (Scale):** Verdict is *pragmatically* fine, but *epistemically* assumes linearity. You are betting that the scale's error is a simple offset ($Reading = Mass + 5$) rather than a multiplier ($Reading = Mass \times 1.05$) or non-linear. Given that cheap scales are usually linear, your bet is good. But if that scale read 205g on a 200g weight later, you wouldn't be surprised.
  *   **The Difference:** In Case 6, you are importing a background assumption ("Scales are linear") that you correctly refuse to import in Case 1 ("Fuel tanks are linear").

  **Case 7 (The Red Wall)**
  This is the limit case of the principle.
  *   **"I know the wall is red":** This is a **Basic Perceptual Belief**. You don't need to calibrate your eyes to form this belief; your eyes are the default interface.
  *   **"I know my eyes are working":** This is a **Reliability Belief**. To prove this, you need Constrained Calibration (e.g., an eye exam, or checking the wall under different lights).
  *   **The Inconsistency:** You feel inconsistent because you are trying to use a Basic Belief ("Wall is red") to prove a Reliability Belief ("Eyes work"). The principle says you can't do that (Clause 1: Independence). The fact that the wall is red depends on your eyes working, so it can't prove they work.
  *   **Verdict:** Your feeling is correct. You know the wall is red (pragmatically), but you haven't *learned* your eyes are reliable from that single instance.

  ---

  ### Running the Principle on Your Three New Cases

  **(a) Fitness Tracker vs. Memory**
  *   *Setup:* Tracker says 7 hours. Memory says ~7 hours.
  *   *Analysis:*
      *   **Independence:** Pass (Memory is independent of tracker).
      *   **Model Sufficiency:** Fail. Human memory of sleep duration is low-precision (high noise). It cannot constrain the tracker's error margin.
      *   **Domain Coverage:** Fail. One night is not a sample.
  *   *Verdict:* **No confidence gained.** You have confirmed nothing other than the tracker isn't wildly offensive (e.g., saying 2 hours). This is closer to Case 1 than Case 6.

  **(b) Van Gauge Checked 50 Times**
  *   *Setup:* 50 checks over a year against pump shutoffs at various levels.
  *   *Analysis:*
      *   **Independence:** Pass.
      *   **Model Sufficiency:** Pass. 50 points across the range map the non-linear curve of the tank. You have constrained the error function.
      *   **Defeaters:** None (assuming no mechanic warning).
  *   *Verdict:* **High confidence gained.** This upgrades Case 1 to the status of Case 2. The gauge is reliable *for that tank*.

  **(c) The Thermometer Chain**
  *   *Setup:* You verify T1 (Case 2). T1 verifies T2. T2 measures samples.
  *   *Analysis:*
      *   **Independence:** Pass (T1 is independent relative to T2).
      *   **Model Sufficiency:** Pass (Assuming T1 was checked at 12 points, it can check T2 at 12 points).
      *   **Constraint:** **Error Compounding.** T2's reliability is capped by T1's reliability. If T1 has a ±0.1° uncertainty, T2 cannot be better than ±0.1°.
  *   *Verdict:* **Valid, but derivative.** You can trust T2, but your confidence interval must be wider than T1's.

  ---

  ### The Straight Talk: Which Verdicts Must Go?

  You asked me to be straight about which of your verdicts the principle overrules. There is one you need to soften.

  **Case 6 (The Single-Point Scale) is riskier than you think.**
  You said: *"Totally fine, I'd bet on it."*
  The Principle says: You are assuming **Linearity** without testing it.
  *   If the scale is digital, this is a safe bet (they are almost always linear).
  *   If the scale is a spring analog scale, this is a bad bet (springs fatigue non-linearly).
  *   **Correction:** You don't know the scale is "accurate once I subtract 5." You know it is "accurate at 100g once I subtract 5." You have not constrained the gain error.
  *   **Why you feel it's fine:** Because your prior experience tells you scales are linear. That's a valid heuristic, but it's an external assumption, not evidence from the check itself. Case 1 feels different because your prior experience tells you fuel gauges are *not* linear.

  **Case 7 (The Red Wall) requires a distinction.**
  You said: *"I'm happy to say I know the wall is red. I am not happy to say I thereby know there's no red light on it."*
  The Principle says: **Keep this distinction.** It is correct.
  *   Knowing the wall is red relies on a *default entitlement* to perception.
  *   Knowing there is no red light relies on a *calibration* of perception.
  *   You cannot use the output (Red) to prove the condition (No Light) that makes the output valid. That violates Independence. Your intuition here is actually more philosophically sound than your intuition on the Scale.

  **Summary:**
  Your intuitions are 90% correct. The only adjustment is to recognize that **Case 6 relies on a hidden "Linearity Assumption"** that Case 1 correctly rejects. If you make that assumption explicit, the contradiction vanishes.
