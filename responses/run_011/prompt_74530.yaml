              *   Entitlement prediction: Starvation depends on who lost the crop and who can buy imports.
              *   *Evidence:* The 1870s Indian famines vs. Bengal 1943. Or better: The hypothetical "Siege" scenario.
              *   *Actually, let's look at the "Prevention" test.* If FAD were true, prevention requires growing more food. If Entitlement is true, prevention requires transferring purchasing power. We know the latter works (social safety nets).
              *   *Conclusion on this:* It is substantive because it dictates *different policy interventions* that yield different mortality outcomes.
      *   **Conclusion:** Reiterate the thesis. The distinction matters because it assigns blame.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is calling Ireland a "democracy" accurate? It was part of the UK. The prompt notes it had a parliament/elections. I need to be nuanced. The *victims* lacked effective power.
      *   *Critique:* Don't get bogged down in historical minutiae. Focus on the theoretical structure.
      *   *Critique:* The prompt asks for a "principled, non-arbitrary criterion" if I say "it depends." I am arguing "It's *always* political," so I don't need a sorting criterion, I need a unifying theory.
      *   *Critique:* Make sure to explicitly answer the "Verbal vs. Substantive" question with a concrete example.
      *   *Idea for Substantive Test:* A scenario where Food Availability *Increases* but Famine *Occurs* (Bengal) vs. Food Availability *Decreases* but Famine *Does Not Occur* (e.g., UK during WWII rationing). This proves Availability isn't the sufficient cause.

  5.  **Final Polish:**
