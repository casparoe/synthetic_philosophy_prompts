      *   Ensure the distinction between "Trigger" (Blight/Policy) and "Cause of Death" (Entitlement Failure) is clear.

  6.  **Writing the Essay:** (Mental Outline)
      *   **Title:** The Politics of Starvation.
      *   **Intro:** Reject the Natural/Political binary. Famines are political failures of entitlement protection.
      *   **Section 1: The Generalizability of Entitlement.** Address Ireland/GLF. The blight destroyed the *entitlement* of the potato-dependent, not just the food. GLF was state-enforced entitlement stripping.
      *   **Section 2: Natural Disaster or Political Crime?** Define "Natural." If preventable, it's political. Imports/Relief make it preventable.
      *   **Section 3: The Democracy Paradox.** Refine Sen. It's not "democracy" per se, it's "political accountability to the vulnerable." Ireland failed this; GLF failed this.
      *   **Section 4: Verbal or Substantive?** It's substantive. Divergent predictions on policy. Example: Food aid vs. Cash transfers.
      *   **Conclusion:** The debate isn't about calories; it's about power.

  7.  **Final Review against Prompt:**
      *   "Take a real position": Famines are political crimes.
      *   "Defend it": Using the entitlement framework expanded to political economy.
      *   "Strongest objection": Massive FAD cases (Ireland/GLF). Addressed by distinguishing trigger from mechanism of death.
      *   "Democracy claim": Addressed via the "political voice" refinement.
      *   "Evidence/Verbal": Addressed via policy divergence test.
      *   "No hedging": I will state the conclusion definitively.

  *(Self-Correction on the "Verbal" point)*: I need to be careful. Some economists argue FAD and Entitlement are mathematically equivalent in equilibrium. I need to argue they are *causally* distinct. The FAD view suggests the solution is production. The Entitlement view suggests the solution is distribution. Since distribution solves famines where production doesn't (and vice versa isn't really true), it's substantive.

