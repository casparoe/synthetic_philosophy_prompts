  1. You claim strict cycles are impossible because nothing is better than itself. But if transitivity fails, what structural feature prevents a loop of pairwise betterness if asymmetry alone doesn't?
     *   **Follow-up:** If she says **the relations don't link up across pairs**, ask: Then how does betterness guide choice across more than two options?

  2. In small-improvement cases, do you need a fourth comparative relation beyond better, worse, and equally good? And if so, is that fourth relation transitive?
     *   **Follow-up:** If she says **parity isn't transitive**, ask: Doesn't adding parity just push the intransitivity problem up a level?

  3. Why reject quasi-transitivity or interval orders instead of full transitivity? Those weakenings block money pumps while preserving your spectrum intuitions.
     *   **Follow-up:** If she says **they constrain the comparisons too much**, ask: What specific intuition do those weakenings violate that full intransitivity saves?

  4. You say money pumps are sequences of choices, not betterness facts. But if betterness doesn't track choiceworthiness, what work is betterness doing?
     *   **Follow-up:** If she says **it tracks value rather than rational choice**, ask: Then why should we care about your intuitions in torture-versus-headaches cases?

  5. If betterness isn't for guiding choice, why should your intuitions in torture-versus-headaches cases track betterness rather than choice?
     *   **Follow-up:** If she says **choice tracks reasons derived from value**, ask: Doesn't that just rename the problem of cyclic reasons?

  6. If betterness is essentially comparative, can any pattern of pairwise verdicts be absorbed by postulating pair-relative weightings? Or are those weightings constrained?
     *   **Follow-up:** If she says **the ideals in play constrain the weightings**, ask: Are those ideals themselves pair-indexed, or does that smuggle back independent structure?

  7. You say ideals constrain the pair-relative weightings. But if those ideals aren't pair-indexed, haven't you just smuggled back a comparison-class-independent structure?
     *   **Follow-up:** If she says **the ideals are context-sensitive but not pair-indexed**, ask: What fixes the context if not the pair being compared?

  8. Many diagnose your arguments as sorites puzzles where transitivity is the cheapest premise to drop. Which single premise would you give up last, and why is transitivity cheaper?
     *   **Follow-up:** If she says **continuity is cheaper to drop than transitivity**, ask: Doesn't dropping continuity just hide the intransitivity in boundary cases?

  9. If the ordering needn't have a maximum, what does a normative theory actually output when somebody asks what to do?
     *   **Follow-up:** If she says **it outputs a set of permissible options**, ask: What if the permissible set is empty or contains everything?

  10. What evidence would make you abandon intransitivity, given that you can always call transitive convergence a frame hiding pair-relativity? Does admitting *any* evidence count against you force you to concede pair-independent structure?
      *   **Follow-up:** If she says **only a logical contradiction would force me to abandon it**, ask: Doesn't that just define intransitivity out of existence?
