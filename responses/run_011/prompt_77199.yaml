  You're a professional philosopher who works on both Victorian British ethics and the modern literature on intertemporal choice — someone who can read Sidgwick in the morning and Strotz in the afternoon without whiplash. I need help with a passage, and I'd like you to actually think it through rather than give me a generic book report.

  Context: I'm prepping a seminar that tries to put the old "cool reason vs. the pull of the near" problem in conversation with hyperbolic discounting, and I've been re-reading the preface Sidgwick wrote for the first edition of The Methods of Ethics (1874). This stretch has me stuck:

  "And thus, though my treatment of the subject is, in a sense, more practical than that of many moralists, since I am occupied from first to last in considering how conclusions are to be rationally reached in the familiar matter of our common daily life and actual practice; still, my immediate object—to invert Aristotle's phrase—is not Practice but Knowledge. I have thought that the predominance in the minds of moralists of a desire to edify has impeded the real progress of ethical science: and that this would be benefited by an application to it of the same disinterested curiosity to which we chiefly owe the great discoveries of physics. It is in this spirit that I have endeavoured to compose the present work: and with this view I have desired to concentrate the reader's attention, from first to last, not on the practical results to which our methods lead, but on the methods themselves. I have wished to put aside temporarily the urgent need which we all feel of finding and adopting the true method of determining what we ought to do; and to consider simply what conclusions will be rationally reached if we start with certain ethical premises, and with what degree of certainty and precision."

  Three things:

  1) Just parse it. What is he committing to, sentence by sentence? What work is the "same disinterested curiosity to which we chiefly owe the great discoveries of physics" analogy doing — is he claiming ethics should be methodologically modelled on physics, or something weaker and more attitudinal about the enquirer? And the "invert Aristotle's phrase" bit: which Aristotelian idea is being inverted? Characterise the claim itself; don't bother trying to pin down the book and chapter, I know you'd only be guessing.

  2) The sentence I find genuinely odd is "I have wished to put aside temporarily the urgent need which we all feel..." He isn't saying urgency is irrelevant to ethics, he's saying he'll bracket a felt, pressing motivation in order to reason better. Isn't that structurally an anti-akraisia move — an author deliberately arranging his own inquiry so that the near-and-vivid doesn't get to set the agenda? Does that reading survive contact with the text, or am I inflating a modest methodological remark into something it isn't?

  3) Now stress-test it against the discounting literature, and be concrete. Sidgwick elsewhere holds that the mere fact of a pleasure falling earlier or later can't by itself make it more or less worth having — a flat, non-discounting view of temporal position. But Strotz's worry isn't about levels, it's about dynamic inconsistency: an agent whose discounting is hyperbolic (or quasi-hyperbolic in Laibson's β-δ form) doesn't just over-value the near, she adopts plans at t0 that she'll unravel at t1 — and being sophisticated about that changes her behaviour, sometimes leaving her worse off than if she'd stayed naive. So is this preface a piece of precommitment technology in something like Strotz's "planning"/self-government sense? Or is it Thaler and Shefrin's planner quietly locking the doer out of the room? Or Ainslie's picoeconomic bargaining, where the present self is just striking a side bet with its future selves? Or — and I want you to take this seriously — is the preface about the epistemic standpoint of a theorist and not about an agent's own intertemporal preferences at all, so that dragging it into discounting models is a category mistake?

  Worth flagging on the other side: the hot-cold empathy gap work says cold states systematically underestimate how much visceral states will move them. Sidgwick is writing from a very cold state, on purpose. Does that undercut the bracketing, i.e. is "put aside the urgent need" precisely the move a cold-state predictor shouldn't trust itself to make?

  Before you answer, spend a few sentences brainstorming the candidate readings of (2) and (3), including at least one on which my whole framing is just wrong, then commit to the one you think is best and say why. If some bit of the passage is genuinely ambiguous, flag it as ambiguous instead of smoothing it over. No reading list or bibliography at the end please — I want the reasoning, not the references.
