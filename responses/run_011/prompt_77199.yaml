  ### 1. Parsing the Passage: Physics, Aristotle, and the Attitude of Inquiry

  Let's walk through the syntax of his commitment.

  **The Practical/Theoretical Paradox:**
  *"And thus, though my treatment of the subject is, in a sense, more practical... still, my immediate object... is not Practice but Knowledge."*
  Sidgwick admits his subject matter is action (practice), but his goal is understanding (knowledge). He is distinguishing between *doing* ethics (living well) and *studying* ethics (mapping the logical space of moral reasoning).

  **The Inversion of Aristotle:**
  When he says he wishes to "invert Aristotle's phrase," he is targeting the famous claim from the *Nicomachean Ethics* (Book I, Chapter 3) that the end of ethical inquiry is not knowledge but action (*praxis*). Aristotle argues we study virtue to become virtuous. Sidgwick inverts this: we study ethical methods to understand the structure of rationality, even if that doesn't immediately make us good. He is shifting ethics from a *productive* science (making something happen) to a *theoretical* science (describing what is the case).

  **The Physics Analogy:**
  *"…benefited by an application to it of the same disinterested curiosity to which we chiefly owe the great discoveries of physics."*
  This is attitudinal, not strictly methodological. In 1874, "physics" (natural philosophy) represented the gold standard of objective, cumulative truth. Sidgwick is not claiming ethics should be quantified or lab-tested (though he wouldn't rule it out). He is claiming ethics needs **disinterestedness**.
  The "desire to edify" is the bias. If you start an ethical inquiry wanting to make people behave better, you will tailor your premises to produce that result. That is "interested" curiosity. The "physics" analogy demands that you follow the argument where it leads, even if the conclusion is uncomfortable or doesn't immediately yield a rule of thumb. It is a claim about the *virtues of the inquirer*, not the mathematical tools of the inquiry.

  **The Bracketing:**
  *"…concentrate the reader's attention… not on the practical results… but on the methods themselves."*
  He is moving the object of study from the *output* of morality (the act) to the *process* of morality (the reasoning).

  ### 2. The "Urgent Need" and Anti-Akrasia

  You asked if "I have wished to put aside temporarily the urgent need which we all feel…" is an anti-akrasia move.

  **The Reading:**
  You are not inflating it, but you need to be precise about *which* akrasia he is fighting. It is not the akrasia of the agent who eats the cake instead of dieting. It is the akrasia of the *theorist* who accepts a sloppy moral premise because it yields a comforting conclusion.

  The "urgent need" is the pressure for **premature closure**. In practical life, we *must* act. We cannot suspend judgment indefinitely. But Sidgwick argues that this practical necessity bleeds into our theoretical reasoning, causing us to accept "methods" (like common sense morality) that haven't been rigorously tested, simply because we need a guide *now*.

  **Is it structurally an anti-akrasia move?**
  Yes. It is a deliberate arrangement of inquiry to prevent the "near-and-vivid" (the immediate pressure to act) from distorting the "far-and-abstract" (the logical consistency of the method).
  *   **The Near:** The feeling that "I must know what to do today."
  *   **The Far:** The rigorous analysis of whether "what to do" is even a coherent concept.

  Sidgwick is effectively saying: "If I let the urgency of practice dictate the pace of my theory, my theory will be inconsistent." By bracketing the urgency, he is engaging in a form of **epistemic self-binding**. He is protecting the integrity of the long-term project (Ethical Science) from the short-term demand (Practical Guidance).

  **Where the reading might strain:**
  Sidgwick isn't saying the urgency is irrational *in life*. He admits it is an "urgent need which we all feel." He is only saying it is a contaminant *in science*. If you read this as him saying urgency is always bad, you misread him. He is carving out a sanctuary for theory. So, it is anti-akrasia regarding the *production of knowledge*, not necessarily regarding the *living of life*.

  ### 3. Stress-Testing Against Discounting Literature

  This is where the friction gets interesting. You are asking if the Preface is a piece of precommitment technology.

  **The Category Mistake Warning**
  First, the hard constraint: Sidgwick is describing the **philosopher's relation to the theory**, not the **agent's relation to their preferences**.
  *   **Strotz/Laibson:** Model an agent choosing between consumption at $t_1$ and $t_2$.
  *   **Sidgwick:** Models a philosopher choosing between Method A (Intuitionism) and Method B (Utilitarianism).

  If you treat the Preface as a Strotzian plan for the *moral agent*, you commit a category mistake. Sidgwick isn't telling you how to save for retirement; he's telling you how to think about saving for retirement.

  **However, the Structural Parallel is Real**
  Even if it's a category mistake to conflate the two, the *structure* of the problem is isomorphic.
  *   **Strotz:** The agent at $t_0$ wants to commit to a plan that the agent at $t_1$ will want to break.
  *   **Sidgwick:** The theorist at $t_0$ (writing the book) wants to commit the reader (and himself) at $t_1$ (facing a moral crisis) to a *method* rather than a *result*.

  **Is it Precommitment (Strotz) or Planner/Doer (Thaler/Shefrin)?**
  It is closer to **Thaler/Shefrin's Planner locking out the Doer**.
  Sidgwick knows that when the "urgent need" hits (the Doer state), the agent will grab whatever rule works *now* (hedonic, biased, inconsistent). The Preface is the Planner constructing a constitution that says: "When the urgent need hits, do not just grab a rule. Recall the *method* we agreed upon in the cold state."
  Sidgwick is trying to institutionalize the "cold" rational standpoint so it survives contact with the "hot" practical standpoint.

  **The Ainslie/Picoeconomic Angle**
  Ainslie views self-control as bargaining between successive temporal selves. Sidgwick's project is arguably an attempt to stop the bargaining. He wants a **unitary rational standpoint** (the "Point of View of the Universe"). He doesn't want the present self to bargain with the future self; he wants both to submit to the same timeless rational law. In this sense, the Preface is an attempt to *abolish* the picoeconomic marketplace, not participate in it. He wants to prove that there is only one rational method, rendering the bargaining unnecessary.

  **The Hot-Cold Empathy Gap (The Killer Objection)**
  This is your strongest point. Loewenstein's work on the hot-cold empathy gap suggests that when we are in a "cold" state (like Sidgwick writing in his study), we systematically underestimate how much our preferences will change in a "hot" state (moral crisis, urgency, visceral drive).
  *   **Sidgwick's Move:** "I will put aside the urgent need." He assumes the "urgent need" is noise that obscures the rational signal.
  *   **Behavioral Critique:** The "urgent need" is not just noise; it is a fundamental shift in the utility function. By bracketing it, Sidgwick isn't just clearing away bias; he is ignoring a variable that determines actual choice.

  If Sidgwick is building a "science" of ethics based on how conclusions are "rationally reached," but his model of rationality requires ignoring the psychological reality of urgency, his science is normatively robust but descriptively hollow.
  *   **Sidgwick's Defense:** He would likely argue that the "hot" state is *irrational* by definition. If urgency changes your valuation of a moral premise, that is a failure of rationality, not a feature of preference. He is prescribing how we *ought* to reason, not predicting how we *do* reason.
  *   **The Tension:** But if the goal is "how conclusions are to be rationally reached in the familiar matter of our common daily life," and human beings *cannot* reach conclusions in daily life without feeling urgency, then his method might be impossible to implement. It's a precommitment that the agent physically cannot maintain.

  **Conclusion on the Stress Test**
  The Preface is a **performative act of precommitment by the theorist**, intended to create a stable tool for the agent. It functions like a Ulysses contract: Sidgwick ties himself to the mast of "Method" so he doesn't steer the ship into the sirens of "Edification."
  However, dragging it into discounting models reveals a fissure: Sidgwick assumes time-neutrality is a requirement of rationality (the "flat" view of temporal position you mentioned). Hyperbolic discounting literature suggests time-neutrality is psychologically unnatural. Sidgwick's Preface is an attempt to build a rationality that is robust *against* human psychology, whereas Strotz and Laibson build models *of* human psychology.
  So, is it a category mistake to apply Strotz here? **Yes**, because Sidgwick is doing normative epistemology, not positive psychology. **But**, the *motivation* for the Preface is precisely the fear that human psychology (the "pull of the near," the "desire to edify") will corrupt the truth. Sidgwick is fighting the very phenomenon Strotz models, but he fights it by trying to transcend it, whereas Strotz fights it by managing it.

  **Final Verdict:**
  Read the "urgent need" sentence as an **epistemic precommitment against bias**, not a psychological model of choice. Sidgwick is aware that the "near" (urgency) distorts the "far" (truth). He brackets the near to save the far. This aligns with the anti-discounting intuition (time shouldn't matter), but it risks the hot-cold empathy gap: by ignoring the urgency, he may be designing a rationality that no actual agent can inhabit. The Preface is the Planner writing a constitution that the Doer may not be able to sign.
