answer: |-
  Your friend has reproduced a very famous, serious argument in the philosophy of cosmology. It is essentially the **Cognitive Instability Argument**, most prominently associated with Sean Carroll, David Albert, and Ken Olum. It is not a crackpot solution; it is the standard "orthodox" response to the Boltzmann Brain (BB) problem in many circles.

  However, your intuition that it smells like a "proof of the external world" is sharp. It touches on a deep tension between **epistemology** (what we can believe) and **metaphysics** (what is true).

  Here is the breakdown of where the argument stands, why your worry is partially misplaced but also insightful, and where the actual breaking points are in the literature.

  ### 1. Addressing the "Proof of the External World" Worry

  You wrote: *"Swap in 'I'm a brain in a vat'... and the same mould turns out a proof of the external world. That seems like far too much proving."*

  This is the most important place to start. The argument does **not** prove the external world exists, and it does not rule out the Brain-in-a-Vat (BIV) scenario in the philosophical sense. Here is the distinction:

  *   **The BIV Hypothesis:** "I am currently a brain in a vat." This is a skeptical hypothesis. It is usually posited as being *empirically equivalent* to normal life. There is no independent physical evidence for it; it is designed to be unfalsifiable.
  *   **The Boltzmann Cosmology:** "The universe is eternal de Sitter space." This is a **physical theory** derived from independent premises (quantum field theory, general relativity, dark energy measurements). It makes predictions about entropy, expansion, and vacuum decay.

  The friend's argument does not say "Skepticism is false." It says: **"Any physical theory that predicts I am likely a skeptic is self-undermining."**

  If you run the argument on the BIV scenario, it doesn't conclude "I am not a BIV." It concludes: "Any physical theory $T$ that predicts '99% of observers with my experiences are BIVs' cannot be rationally believed."

  Since the standard BIV hypothesis isn't a physical theory with independent empirical motivation (like de Sitter space is), the argument doesn't apply to it in the same way. It applies to *scientific model selection*. It functions as a constraint on theory-building, not a metaphysical proof of reality. So, it doesn't prove "too much"; it proves exactly what it claims: that self-undermining scientific models are inadmissible.

  ### 2. Where does it break? (The Two Contested Steps)

  While the argument is respected, it is not considered a "slam dunk" that evaporates the problem. The literature generally attacks two specific steps. Since you prefer to keep Step 2 and Step 4, you need to see why others don't.

  #### The Attack on Step 2 (The Anthropics)
  > *Step 2: If a hypothesis says that observers who seem to be like me are hugely outnumbered by some other kind of observer, my credence should mostly go to the other kind.*

  You called this "plain epistemology." In the philosophy of cosmology, this is the **Self-Sampling Assumption (SSA)**, and it is highly controversial.

  *   **The Objection:** Why should I assume I am a "random sample" from the set of all observers? This assumption leads to other paradoxes, like the **Doomsday Argument** (which suggests humanity will go extinct soon because we are likely "typical" humans in the timeline).
  *   **The Alternative:** Some philosophers argue for the **Self-Indication Assumption (SIA)**. SIA says you should favor hypotheses that contain *more* observers total. In some formulations, SIA cancels out the BB problem (because a universe with billions of ordinary observers is favored over a universe with only Boltzmann brains, even if BBs are more numerous *per unit volume*).
  *   **The Reference Class Problem:** Step 2 requires defining "observers who seem to be like me." If you define the class as "observers with veridical memories," BBs are excluded by definition. If you define it as "observers with *apparent* memories," BBs dominate. Choosing the reference class is not "plain epistemology"; it is a hidden premise that determines the outcome.

  **What rejecting Step 2 owes us:** If you reject Step 2, you owe us a better theory of **self-locating belief**. You need to explain why we shouldn't treat ourselves as random samples from our reference class without falling into solipsism or ad-hocery.

  #### The Attack on Step 6 (Cognitive Instability)
  > *Step 6: A hypothesis that would make my evidence for it worthless can't be rationally believed.*

  This is the "Cognitive Instability" claim. It is the strongest part of your friend's argument, but it has a subtle gap.

  *   **The Objection:** There is a difference between **"Theory T is false"** and **"I cannot rationally believe Theory T."**
      *   Step 7 concludes: "Therefore no such cosmology is **true**."
      *   Step 6 only supports: "Therefore no such cosmology is **believable**."
  *   **The "Uncomfortable Truth" Counter:** It is possible that the universe *is* a fluctuation cosmology, and we *are* Boltzmann brains, and our reasoning *is* flawed. The fact that believing this destroys our justification for believing it doesn't make it false. It just makes it a **tragic epistemic situation**.
      *   Analogy: A drug that makes you believe you are Napoleon. If you take it, you believe you are Napoleon. If you don't take it, you don't. The hypothesis "I took the drug" undermines your belief in it. But you might have actually taken the drug.
  *   **Inevitability:** Some argue that if the physics *really* points to BBs, we are forced to accept it, even if it undermines our reasoning. We can't veto reality just because it makes epistemology hard.

  **What rejecting Step 6 owes us:** If you reject Step 6, you owe us an account of **defeasible reasoning**. You have to explain how we can rationally hold a belief that we acknowledge is likely produced by an unreliable process. (Usually, people say we can't—but then they must accept Step 7 is too strong; it should conclude "unbelievable," not "false.")

  ### 3. The Verdict on Your Friend's Argument

  Your friend is **mostly right in spirit, but slightly too strong in conclusion.**

  1.  **He is right that the argument has bite.** This is not a pseudo-problem. Physicists *do* use this exact argument to rule out "Eternal De Sitter" models. If a cosmological model predicts BBs dominate, it is considered "pathological" and is usually discarded or modified (e.g., by assuming the vacuum will eventually decay).
  2.  **He is wrong that it is a logical proof.** The move from Step 6 to Step 7 ("Therefore no such cosmology is true") is a category error. The argument shows the cosmology is **epistemically self-defeating**, not logically impossible. It shows we cannot *use* that theory, not that the universe cannot *be* that way.
  3.  **Your worry about Step 2 is the key.** You said you'd rather keep Step 2. If you keep Step 2, you are committed to the conclusion that such cosmologies are rationally untenable. But you should recognize that Step 2 is not "plain epistemology." It is a specific, debated anthropic principle. If you adopt it, you inherit the Doomsday Argument and other SSA-paradoxes.

  ### Summary: What is left to say?

  If you want to push back against your friend without abandoning common sense, here is the strongest position:

  **"The argument successfully shows that Eternal De Sitter cosmologies are *empirically self-undermining*. We are justified in rejecting them as scientific models (Step 6). However, it does not prove they are metaphysically impossible (Step 7 is too strong), and it relies on a controversial Principle of Indifference (Step 2) that requires more justification than 'plain epistemology'."**

  The literature isn't chasing a problem that evaporates; it's chasing a problem that forces a choice between **modifying our physics** (to avoid BBs) or **modifying our anthropics** (to ignore them). Your friend has chosen to modify the physics. That is a valid, mainstream choice, but it rests on the contested premise that we *must* treat ourselves as typical observers (Step 2).

  If you keep Step 2, your friend wins. If you question Step 2, the problem reopens. Given your worry about "proving too much," I suspect you should question Step 2. It is not a law of logic; it is a heuristic that breaks in infinite universes.
