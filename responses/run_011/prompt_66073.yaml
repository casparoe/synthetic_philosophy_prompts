answer: |-
  Here is a commentary addressing your three puzzles based strictly on the text provided.

  ### 1. Strategic vs. Moral Reasons: Independence and Obligation

  The text suggests that the moral reason carries **independent normative weight**, rather than merely reinforcing the strategic one. The transitional phrase "Add to this" (*Additur hoc* in the Latin gloss, implied by the structure in English) indicates accumulation. Kant does not say "Furthermore, this is unjust," which would subordinate the moral claim to the strategic outcome. Instead, he introduces a distinct category of evaluation: the "rights of mankind."

  The strategic argument is consequentialist in structure: standing armies cause arms races, which make peace expensive, which causes offensive war. This is a causal chain regarding the *preservation of peace*. The moral argument is deontological: paying men to kill treats them as "machines and tools." This is a claim about the *intrinsic nature of the act*, regardless of whether it leads to war.

  Regarding reciprocity vs. unilateralism: The title commands that standing armies "Shall... Be Totally Abolished." This is a categorical formulation. If the obligation were purely strategic (prudential), it would be hypothetical: "If you want peace, abolish armies." The categorical "Shall" implies a duty that holds regardless of the neighbor's actions. However, the phrase "**in Time**" is doing critical work here. It acknowledges the strategic reality described in the first half of the paragraph. If a state unilaterally abolishes its army immediately while neighbors maintain theirs, it invites aggression (the "menace" becomes an opportunity). Thus, "in Time" is not a weakening of the moral duty, but a recognition of the strategic precondition for its fulfillment. The moral duty is immediate; the execution is phased to ensure the state's survival during the transition.

  ### 2. The Hedging and the Subject of Rights

  **(a) Whose right is at issue?**
  The phrase "rights of mankind **in our own person**" is decisive. It locates the right within the humanity of the soldier, not merely in the legal status of the subject. This suggests the violation is primarily against the soldier's own humanity (a duty to oneself), though enacted by the state. The text states the state uses them "in the hand of another."

  Does voluntary enlistment satisfy this? The text says "to **pay men** to kill or to be killed." The objection targets the *commodification* of the act, not merely the coercion. By accepting payment for the specific purpose of killing or being killed, the soldier alienates his capacity for moral agency (his humanity) in exchange for money. Even if voluntary, one cannot validly contract to become a "mere machine." Therefore, voluntary long-service enlistment on generous terms would not satisfy the article, because the core defect is the transformation of the human being into a paid instrument of death, which remains true regardless of the generosity of the terms.

  **(b) The function of the hedging.**
  The phrases "seems to entail" and "hardly compatible" should not be read as expressions of doubt. In Kant's critical philosophy, such phrasing often marks the boundary between *phenomenal* appearance and *noumenal* reality, or between positive law and natural right.
  *   "Seems to entail": The *practice* of hiring soldiers presents the appearance of using them as tools. Kant is analyzing the structural implication of the contract, not the subjective intent of every general.
  *   "Hardly compatible": This is stronger than "incompatible." It suggests that while positive law (the state's right to command) might permit it, it pushes against the absolute limit of Natural Right.
  The hedging indicates **philosophical precision**, not weakness. Kant is acknowledging that in the political sphere, states *do* claim this power, but from the standpoint of "Perpetual Peace" (which aligns with Right), this power is illegitimate. The article is categorical ("Shall... Be Abolished") because the incompatibility, however "hardly" it is recognized by current states, is fundamental.

  ### 3. The Exception and the Treasure Paragraph

  **The Exception:**
  The justification for the citizen militia rests on a combination of features, but the **status of the agents (citizens vs. paid men)** and the **purpose (self-defense vs. readiness)** are the primary drivers.
  *   *Citizens vs. Paid:* This addresses the moral argument. Citizens securing "themselves and their country" are not "tools in the hand of another." They are exercising self-legislation and self-defense. The mercenary sells his life; the citizen defends his own.
  *   *Periodic/Defensive:* This addresses the strategic argument. A periodic force does not "incessantly menace other states" because it is not in a state of "readiness to appear at all times prepared for war."
  If the relevant difference were only defensive purpose, a standing army could theoretically be reformed to be defensive. But Kant abolishes the *standing* nature. Thus, the **periodicity** is crucial to removing the strategic threat, while the **citizenship** is crucial to removing the moral violation.

  **The Treasure Paragraph:**
  The opening sentence—"The accumulation of treasure would have the **same effect**"—is the key to unlocking the relationship between the paragraphs.
  *   Which effect? The **strategic effect** (menace, inciting competition, forcing early attack).
  *   Crucially, the treasure paragraph contains **no moral argument**. One cannot treat a stockpile of gold as a "machine and tool" in the moral sense.
  *   This implies that the **strategic argument is the unifying principle** of the Third Preliminary Article. It applies to all accumulations of war-potential (men and money). The moral argument is a **specific supplement** applicable only to armies because they involve human beings.

  ### Conclusion: The Best Supported Reading

  Based on the text provided, the reading best supported is that **the Article is structurally grounded in the strategic argument, but categorically mandated by the moral argument.**

  1.  **Strategic Primacy:** The treasure paragraph proves that the core logic of the Article is the prevention of the "security dilemma" (menace $\rightarrow$ arms race $\rightarrow$ offensive war). This logic applies to all state resources.
  2.  **Moral Necessity:** The moral argument ("Add to this") provides the specific *prohibition* against armies that cannot be solved by regulation. You can regulate how treasure is stored, but you cannot regulate the hiring of men to kill without violating the "rights of mankind."
  3.  **The Exception:** The citizen militia is permitted because it resolves **both** problems. It removes the strategic menace (by being periodic and defensive) and avoids the moral violation (by being citizens defending themselves rather than paid tools).

  **Why this reading wins:**
  It accounts for the "in Time" clause (strategic prudence required to implement a moral duty), explains the hedging (acknowledging the tension between state power and natural right), and integrates the treasure paragraph not as a digression but as a confirmation that the *systemic threat to peace* is the broader category, within which the *moral threat to humanity* is the specific reason armies (unlike treasure) must be abolished rather than merely limited. The text does not allow for voluntary enlistment to cure the defect, because the defect lies in the *payment for killing*, which alienates the "rights of mankind in our own person" regardless of consent.
