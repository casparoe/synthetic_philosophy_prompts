      *   *Re-evaluating Puzzle 1 based on Puzzle 3:* Since the Treasure paragraph relies *only* on the strategic logic ("same effect"), the strategic logic is the unifying principle of the Article. The moral argument is specific to *armies* (humans), whereas the strategic argument applies to *means of war* (armies and money).
      *   *Refinement:* The moral argument gives the *categorical* force to the abolition of armies specifically. The strategic argument explains the *causal mechanism* of war and applies to both armies and treasure. The exception is justified because it neutralizes the strategic threat (not permanent/ready) and avoids the moral violation (citizens defending self, not hired tools).

  6.  **Synthesizing the Argument for the Commentary:**

      *   *Puzzle 1 (Strategic vs. Moral):* They are distinct but interlocking. The strategic argument explains the *consequence* (war); the moral argument explains the *intrinsic wrong* (treatment of humans). The "Shall" indicates moral obligation. "In Time" addresses the strategic risk of immediate unilateral disarmament (security dilemma), not the moral validity.
