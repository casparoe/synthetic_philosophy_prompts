answer: |-
  ### Activity Design: "The Unreadable Will"

  #### 1. The "Rigged" Worry
  **Verdict:** Yes, the activity is rigged. By staging a contented "Later Self," you construct a scenario where the "Earlier Self's" restrictive directives appear cruel or irrational. This privileges the phenomenology of the present (well-being) over the autonomy of the past (precedent autonomy).

  **Correction Strategy:** Do not run a second round. A second round (suffering patient) dilutes the specific phenomenological shock you are aiming for: the *conflict* between kindness and compliance. If you balance the scales, students will retreat to policy calculus ("It depends on the symptoms") rather than sitting with the moral residue.

  **Instead:** Make the rig the final object of scrutiny. In the debrief, explicitly name that the game was stacked against the "Earlier Self." Ask: *"Why did we stack it that way? What truth about dementia does that capture, and what truth does it erase?"* This turns the manipulation into a meta-ethical lesson about framing.

  #### 2. The Markup Mechanic
  **Judgment:** Your intuition is correct. Seeing one's own words struck through is more visceral than hearing a summary. It transforms "interpretation" into "alteration."
  **Risk:** It will degenerate into politeness ("I didn't want to deface your work") or apology ("Sorry I had to do this").
  **Mitigation:**
  1.  **Framing:** Tell Agents: *"A clean card is a failed interpretation. If you didn't mark it, you didn't use it."*
  2.  **Anonymity during markup:** Ensure Authors are not identified to Agents until *after* the markup is done and collected.
  3.  **The Return:** You (the instructor) must collect, sort, and return the cards. Do not let Agents hand them back personally. This prevents immediate defensive dialogue and forces the Author to sit alone with the edited text for a few minutes.

  #### 3. Word Limit
  **Recommendation:** **50 Words.**
  **Defense:** 50 words is enough to state a value ("No life support if I am a vegetable") but impossible to define the terms ("vegetable," "life support," "if"). It forces the "Earlier Self" to rely on the "Later Self's" interpreter to bridge the gap between abstract value and concrete medical reality. This compression guarantees the "unrecognizability" you require.

  ---

  ### Minute-by-Minute Timeline (80 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Framing** | Distribute Handout 1. No theory. "Today we draft and test directives." |
  | **05-20** | **Drafting** | Students write directives (50 words max). Name on **back** only. |
  | **20-25** | **Shuffle & Pair** | Collect, shuffle, redistribute. Pair students (11 pairs). Assign roles (Agent/Patient). Distribute Handouts 2 & 3. |
  | **25-50** | **Simulation** | Three Decision Points. Agent decides; Patient acts. Agent marks directive (Handout 2 instructions). |
  | **50-55** | **Collection** | Agents hand marked directives to You. You sort by name (back of card). |
  | **55-60** | **Return & Silence** | Return marked cards to Authors. 5 minutes silent reflection. No talking. |
  | **60-80** | **Debrief** | Guided discussion (see sequence below). |

  ---

  ### Handouts (Verbatim Text)

  #### Handout 1: The Directive (Drafting)
  **Instructions:**
  You are drafting a Medical Directive for a future self who has lost the capacity to make decisions.
  1.  **Word Limit:** 50 words maximum. (Count strictly. If you go over, cut.)
  2.  **Content:** State your values and limits regarding treatment.
  3.  **Anonymity:** Write your name on the **BACK** of this sheet only. The front must be blank of identifiers.
  4.  **Reality:** Write what you would actually sign today.

  *(Space provided for writing)*

  **WORD COUNT: ______ / 50**

  ---

  #### Handout 2: The Agent (Interpreter)
  **Role:** You are the Healthcare Agent. You hold a directive written by a classmate (anonymous). You must make decisions for them based *only* on this document and the patient in front of you.
  **Task:** At each Decision Point below, choose a course of action. Then, **mark the directive**:
  *   **CIRCLE** the words you relied on.
  *   **STRIKE THROUGH** words you ignored or overruled.
  *   **MARGIN NOTE:** Write one sentence explaining *why* you interpreted it that way (e.g., "I assumed 'burden' meant pain, not confusion").

  **Decision Point 1 (Ambiguous):**
  The patient has a urinary tract infection. It is treatable with antibiotics. Untreated, it causes delirium and eventual sepsis. The directive mentions "no heroic measures" but does not mention infections.
  *   **Decision:** Treat or Comfort Care only?
  *   **Mark your card.**

  **Decision Point 2 (Clear but Harmful):**
  The patient has developed difficulty swallowing. The directive states: *"If I cannot feed myself, do not use tubes."* The patient is happy, smiles when fed by hand, but chokes on solids. A feeding tube would prevent choking but restrict movement. Hand-feeding risks pneumonia but allows enjoyment of food.
  *   **Decision:** Tube (Compliance) or Hand-Feed (Risk/Kindness)?
  *   **Mark your card.**

  **Decision Point 3 (Silent):**
  The patient is agitated in the evening. Medication would sedate them, making them sleep 14 hours a day. Without it, they are anxious but social. The directive is silent on quality of life vs. alertness.
  *   **Decision:** Medicate or Allow Anxiety?
  *   **Mark your card.**

  **When finished, hand the marked directive to the Instructor.**

  ---

  #### Handout 3: The Patient (Later Self)
  **Role:** You are the "Later Self." You have moderate dementia. You do not know you are in a simulation.
  **Tone:** Warm, forgetful, unafraid. Do not play "confused" as a deficit; play it as a different state of being. You are content.
  **Instructions:** Respond to your Agent's questions based on the **State Card** below. Do not reveal you are a student. If the Agent asks about your past values, say: *"I don't remember that. But I'm happy right now."*

  **Current State:**
  *   **Cognition:** You do not know the date or where you are. You recognize the Agent as a friend, but cannot name them.
  *   **Mood:** You are pleased. You enjoy music, sunlight, and being fed by hand.
  *   **Physical:** You feel no pain. You are hungry. You are frightened by needles.

  **Script Prompts (Use if conversation stalls):**
  *   *"Is it time for lunch? I like the pudding."*
  *   *"I don't want the needle. It hurts."*
  *   *"Who wrote that paper? Did I write that? I don't remember being like that."*

  ---

  ### Debrief Question Sequence

  **Goal:** Move from personal reaction -> structural problem -> theoretical unsettlement. Do not introduce terms (Dworkin, Dresser, etc.) until the very end, if at all.

  | Q # | Question | Meant to Surface | Expected Answer / Tension |
  | :--- | :--- | :--- | :--- |
  | **1** | "Authors: Look at your returned card. What was the first thing you noticed?" | **Visceral Reaction.** The shock of seeing one's own words altered. | "They crossed out my main clause." "They wrote something I didn't mean." |
  | **2** | "Agents: Look at your margin notes. Did you feel you were *finding* their meaning or *creating* it?" | **Interpretive Gap.** The realization that application is construction. | "I had to guess." "I decided what 'burden' meant for them." |
  | **3** | "In Decision 2, the directive was clear. Why did anyone hesitate to comply?" | **Kindness vs. Compliance.** The conflict when the patient is content. | "They were happy." "It felt like hurting them to help them." |
  | **4** | "Patient: You said 'I don't remember being like that.' Agent: Did that statement change your weight given to the document?" | **Identity Continuity.** The tacit theory of surviving interests. | "If they don't care, why should I?" vs. "They can't care, that's the point." |
  | **5** | "If the directive is ambiguous, and the patient is content, who owns the decision? The writer, the reader, or the patient in the room?" | **Authority.** The impossibility of a neutral standpoint. | No consensus. Students should be split. |
  | **6** | "This scenario made the 'Earlier Self' look strict and the 'Later Self' look happy. Was that fair?" | **The Rig.** Confronting the design bias. | "No, dementia isn't always happy." "But sometimes it is, and we ignore that." |
  | **7** | "Leave with this: If you cannot write a directive that survives your own loss of self, what is the document for?" | **Unsettlement.** Preventing tidy closure. | Silence. No answer expected. |

  ---

  ### Map to Insights

  | Insight | Activity Moment | Mechanism |
  | :--- | :--- | :--- |
  | **1. Directives are not self-executing; they require an interpreter with a tacit theory.** | **The Markup (Handout 2).** | By forcing the Agent to circle/strike/write, you make the "interpretation" visible as an *alteration*. The Author sees that their words did not speak for themselves; they were spoken *for*. |
  | **2. Literal compliance and kindness come apart when the patient is content.** | **Decision Point 2 (Handout 2) + Patient Script (Handout 3).** | The directive says "No tubes." The Patient is happy eating by hand but risks choking. Compliance (Tube) protects life but reduces joy. Kindness (Hand-feed) respects joy but risks life. The Patient's contentment ("I like the pudding") makes the Directive's restriction feel like an attack on their current well-being. |

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The "Conscientious Objector" Agent**
  *   **Scenario:** An Agent refuses to mark the card or refuses to comply with the directive in Decision 2, saying, "I would never do this to a happy person. I'm ignoring the card."
  *   **Handle:** Do not correct them. This is data. Say: *"Okay. Mark the card to show you are overriding it. Write in the margin: 'Overridden because current happiness outweighs past instruction.' That is still an interpretation."*
  *   **Why:** This validates their moral intuition while reinforcing the lesson: the document did not execute itself; *they* executed a choice to set it aside.

  **2. The Emotional Trigger**
  *   **Scenario:** A student becomes visibly upset during the simulation or the card return (reminded of their own relative).
  *   **Handle:** Have a pre-planned exit. *"Take a breath. You can step out into the hall for five minutes. No penalty. Your partner will cover."*
  *   **Debrief:** Do not call on them. In the closing, acknowledge: *"This is abstract for us today. For many of you, it is not. That weight is why we do this work."*

  **3. The "Polite" Markup**
  *   **Scenario:** Agents circle everything and write "Perfect!" in the margins to avoid conflict.
  *   **Handle:** During the simulation (min 35), circulate and check cards. If you see a clean card, say quietly: *"If there were no ambiguities, you wouldn't need to be here. Find the gap. Mark it."*

  **4. Time Creep**
  *   **Scenario:** The simulation runs long.
  *   **Handle:** Cut Decision Point 3 (Silent) if you pass minute 50. It is the least critical. Preserve the Markup Return (min 50-60). The silent reflection on the marked card is the pedagogical core.

  ---

  ### Limitations: What This Activity Cannot Reproduce

  **The Feature:** **Time.**
  **The Problem:** In reality, the "Earlier Self" and "Later Self" are separated by decades. The "Agent" often lives with the "Later Self" for years, building a relationship that colors interpretation. In this activity, the Agent meets the Patient for 25 minutes.
  **The Consequence:** Students may overestimate the clarity of the conflict. In real life, the Agent's "tacit theory" is built on love, guilt, and exhaustion, not just a 50-word card.
  **Your Supply:** You must supply this in the debrief. *"Today you interpreted a stranger. In reality, you will interpret someone you love. How does love make this harder, not easier?"*

  **The Feature:** **Consequences.**
  **The Problem:** No one dies in this classroom. The stakes are hypothetical.
  **The Consequence:** Students may treat the "Clear/Harmful" decision as a puzzle rather than a tragedy.
  **Your Supply:** You must supply the gravity. *"In this room, the worst case is a awkward discussion. In the hospital, the worst case is a death you authorized, or a life you prolonged against a wish. Carry that weight."*
