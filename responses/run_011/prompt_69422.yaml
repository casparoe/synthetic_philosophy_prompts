  - **Bottom line**: The honest answer lives in the S tier because the standard "duty/consumption" model successfully reconciles the math with observed behavior without requiring magical thinking. I side more with Marcus on the broad conclusion that voting is rational, though his specific inventions are less robust than the classic arguments he is trying to supplement. You should stop making fun of his creativity, but you don't have to concede that his math actually saves the instrumental case.

  - **The tier list**:

  | Item | Tier | Axis 1 (Explains Who) | Axis 2 ( Saves Rationality) | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | 1. Duty/Consumption | S | 10 | 10 | The canonical economic solution; adds a tangible utility term that easily outweighs costs for most voters. |
  | 2. Expressive Reading | A | 9 | 8 | Accurately describes voter psychology but sidesteps the instrumental paradox rather than solving it. |
  | 3. Minimax Regret | B | 7 | 7 | Plausible for anxiety-driven voters, but regret theory is less standard than expected utility. |
  | 4. Correlation Move | C | 5 | 5 | Clever application of logical decision theory, but causal impact remains negligible in large N elections. |
  | 5. Subscription Move | B | 6 | 6 | Morally compelling rule-utilitarianism, but fails to address the individual incentive to free-ride. |
  | 6. Bookkeeping Move | D | 3 | 3 | Mathematically true but irrelevant; doubling a vanishing probability still yields a vanishing probability. |
  | 7. Rule-following | A | 9 | 7 | Behaviorally accurate regarding heuristics, though it redefines rationality as procedural rather than act-based. |
  | 8. Bite the Bullet | B | 8 | 2 | Empirically honest about cognitive limits, but concedes the core question of whether voting is rational. |
  | 9. Premise Inflated | B | 7 | 8 | True for low-cost voters, but fails to explain turnout among those facing genuine hardship or indifference. |

  - **Marcus's three moves**:
  Marcus is trying to solve a causal problem with evidential logic, and while it's intellectually stylish, it doesn't quite land. Move 4 (Correlation) relies on Logical Decision Theory—the idea that your choice predicts similar choices. In a election of 100 million, even if your vote correlates with 1,000 others, the probability of that cluster being pivotal is still effectively zero. It changes the *meaning* of p, but not the *magnitude* enough to cover costs. It's a philosophical intriguing objection to causal decision theory, but practically inert for voting.

  Move 5 (Subscription) is essentially Kantian universalization dressed up as game theory. It argues that you should vote because you want the *practice* of voting to exist. The flaw is the free-rider problem: the practice survives even if *you* specifically stay home, provided everyone else subscribes. It explains why people *feel* they should vote, but it doesn't make voting instrumentally rational unless you assume your defection triggers mass defection, which returns us to Move 4's improbability.

  Move 6 (Bookkeeping) is the weakest link. Correctly counting ties versus one-vote margins might double the probability of being pivotal, but when the base probability is 1 in 10 million, doubling it doesn't bridge the gap to positive expected utility. It's a correction, not a solution. Marcus is onto something regarding how we frame decision problems, but he isn't fixing the arithmetic enough to win the bet. You can keep teasing him, but acknowledge the ingenuity.

  - **Steelman the other side**:
  The strongest case for irrationality rests on evolutionary mismatch and feedback loops. Human brains evolved for small-group coordination where individual action visibly altered outcomes; we lack the intuition for statistical insignificance in mass societies. Voting provides social signaling benefits (status, group belonging) that are real, but these are distinct from the instrumental goal of influencing policy. If you strip away the social rewards and force a purely instrumental calculation, the behavior collapses. Therefore, voters are not optimizing for policy outcomes but are instead victims of cognitive bias, treating a symbolic act as a causal lever. The "rationality" defenders are just retrofitting utility functions to explain away systematic error.

  - **What would settle it**:
  Unfortunately, these theories are largely unfalsifiable because utility is unobservable. If someone votes despite high costs, a rationalist says "their D term must be huge," while an irrationalist says "they miscalculated p." To discriminate, you would need neuroeconomic data showing whether voters activate reward centers associated with duty (consumption) or outcome simulation (instrumental). Alternatively, natural experiments that drastically vary costs (e.g., sudden weather changes, location closures) could isolate elasticity; if turnout remains high despite massive cost spikes, it suggests non-instrumental drivers. Until then, both sides retrofit the same turnout numbers.
