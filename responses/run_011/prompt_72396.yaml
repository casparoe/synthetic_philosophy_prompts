      *   **Anti-Humeanism (Necessitarianism/Dispositionalism/etc.):** Laws govern the mosaic. They explain *why* the mosaic is the way it is. They possess modal force (necessity). *Direction of fit:* Laws -> World.
      *   **The Core Dispute:** It is *not* just about how we write the laws (compression vs. authority). It is about ontological priority and modal force. Do laws *make* the regularities happen, or do regularities *make* the laws true?

  3.  **Audit the Legal Analogy (Statutes vs. Restatements):**
