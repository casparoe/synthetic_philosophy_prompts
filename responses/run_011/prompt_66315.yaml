      *   *Fetishism Objection:* If we enforce "optimize true reward," do we get a policy that constantly queries an oracle/checks constraints (high compute, brittle) instead of a heuristic policy that naturally aligns (generalizes well)?
      *   *Right-Making Features:* The policy's attention maps or feature importance weights align with the causal factors of the true reward, even if the immediate output is driven by a heuristic (warm feeling).
