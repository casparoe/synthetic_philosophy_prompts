      *   *Fetishism Objection:* If we penalize policies that achieve high reward via "natural" heuristics (emotions/habits) and demand they explicitly optimize the true reward function, we might select for policies that are computationally inefficient or brittle (constantly calculating permissibility) rather than robustly aligned agents that "care" (have internal models that naturally value the outcome).
      *   *Right-Making Features:* The policy's internal representation (advantage estimates) must correlate with the ground-truth reward features, even if the behavioral output looks like it's driven by a proxy (e.g., "warm feeling" = a learned heuristic). As long as the heuristic tracks the true reward OOD, it counts.

