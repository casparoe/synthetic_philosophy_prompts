answer: |-
  ### The Election Panel Decision Procedure

  **Definition:** *Manipulation* is influencing a voter's decision by bypassing their ability to reason, rather than engaging it. *Persuasion* gives voters reasons to decide; *Manipulation* tricks them into deciding.

  **Step 1: The Fact Check**
  *   **Question:** Is the core claim factually false?
  *   **If YES:** **VIOLATION.** (Lying is always manipulation).
  *   **If NO:** Go to Step 2.

  **Step 2: The Context Check (The "Misleading Truth" Test)**
  *   **Question:** Does the statement leave out crucial context that would change how a reasonable voter interprets the fact?
  *   **Look for:** Statistics without denominators, quotes without surrounding sentences, or promises that rely on the voter assuming facts that aren't true (e.g., implying a duty exists when it doesn't).
  *   **If YES (Context is hidden):** **VIOLATION.** (A truth used to deceive is still a lie).
  *   **If NO (Context is clear or irrelevant):** Go to Step 3.

  **Step 3: The Mechanism Check (The "Bypass" Test)**
  *   **Question:** Did the campaign tactic get the vote/signature by distracting the voter, hiding the ask, or applying pressure, rather than presenting an argument?
  *   **Look for:** Hiding the petition until after the incentive is given, scheduling votes to exclude specific groups, or using private channels to make contradictory promises that cannot be publicly scrutinized.
  *   **If YES (Reasoning was bypassed):** Go to Step 4.
  *   **If NO (Voters engaged with the message):** **NO VIOLATION.**

  **Step 4: The Sunlight Test (The "Endorsement" Check)**
  *   **Question:** If the voter knew *exactly* how this tactic was working (e.g., "I am giving you pizza to distract you from reading," or "I am telling you this sad story to make you pity me"), would they still feel the influence was fair?
  *   **If NO (They would feel tricked):** **VIOLATION.**
  *   **If YES (They would accept it as part of campaigning):** **NO VIOLATION.**

  ***

  ### Applying the Procedure to Your Cases

  **Case 1: The Private Instagram Lists**
  *   **Step 1 (Facts):** Presumably true promises to each group. (Pass)
  *   **Step 2 (Context):** The context hidden is the *contradiction*. Band kids don't know he promised athletes the same money. (Fail)
  *   **Step 3 (Mechanism):** Using private lists prevents public scrutiny. It bypasses the voter's ability to compare promises. (Fail)
  *   **Step 4 (Sunlight):** If band kids knew he told athletes the opposite, they would feel tricked. (Fail)
  *   **Ruling:** **VIOLATION.** This is manipulation by segmentation. You cannot make mutually exclusive promises in secret.
  *   **Draft Paragraph:** "The Panel finds a violation. While your statements may have been individually true, presenting contradictory promises to separate groups in private channels prevents voters from assessing your platform as a whole. This bypasses their ability to reason about your priorities."

  **Case 2: The "60% Meetings" Flyer**
  *   **Step 1 (Facts):** True, she missed 60%. (Pass)
  *   **Step 2 (Context):** Missing context: She was ex-officio (not required) and had mono (illness). The flyer implies negligence. (Fail)
  *   **Step 3 (Mechanism):** Uses a statistic to imply a failure of duty that didn't exist. (Fail)
  *   **Step 4 (Sunlight):** If voters knew she wasn't required to attend and was sick, they would feel the flyer was unfair. (Fail)
  *   **Ruling:** **VIOLATION.** This is a "misleading truth."
  *   **Draft Paragraph:** "The Panel finds a violation. While the attendance statistic was accurate, omitting the context of your ex-officio status and medical leave creates a false impression of negligence. Truth requires context, not just accuracy."

  **Case 3: The Pizza Petition**
  *   **Step 1 (Facts):** N/A. (Pass)
  *   **Step 2 (Context):** Pizza was present. (Pass)
  *   **Step 3 (Mechanism):** People signed without reading. The incentive (pizza) preceded the commitment (reading). This bypasses reasoning about the petition's content. (Fail)
  *   **Step 4 (Sunlight):** Voters said they would have signed anyway. (Pass)
  *   **Ruling:** **VIOLATION (Technical).** Even if the outcome wasn't changed, the *process* of the petition was corrupted. A signature represents "I read and agree," not "I ate and signed."
  *   **Draft Paragraph:** "The Panel finds a violation. While voters indicated they supported the cause, collecting signatures before ensuring the content was read devalues the petition process. Incentives cannot precede informed consent."

  ***

  ### Case 4: The Tactic You Probably Love (And Will Hate This Ruling On)
  **Scenario:** A candidate sends a text blast at 10:00 PM the night before voting opens, saying "Voting starts tomorrow! Don't forget!" They know the opponent's supporters are mostly freshmen who go to sleep early, while their supporters are seniors who stay up late. The goal is to suppress the opponent's turnout without lying.

  *   **Step 1:** True.
  *   **Step 2:** Context is clear.
  *   **Step 3 (Mechanism):** Did it bypass reasoning? Yes. It manipulates the *composition* of the electorate by exploiting sleep schedules, not by arguing policy.
  *   **Step 4 (Sunlight):** If the freshmen knew the text was timed to exclude them, would they feel it was fair? No.
  *   **Ruling:** **VIOLATION.**
  *   **Why you'll hate it:** This is "smart" campaigning. It's not a lie. But it manipulates the *opportunity* to vote rather than the *choice* to vote. The procedure flags it because it bypasses fair competition.

  ***

  ### When to Punt to the Senate
  This procedure cannot solve value judgments. If you hit these walls, stop and send it to the Senate with a "No Recommendation" note.

  1.  **Resource Inequality:** "They spent $500 on posters; I only had $50." The procedure checks for deception, not fairness of wealth.
  2.  **Charisma/Personality:** "They are better speakers than me." Engaging emotion through genuine passion is persuasion, not manipulation.
  3.  **Rule-Lawyering:** "They filed their paperwork 1 minute before the deadline." If they followed the written rule, even if it was aggressive, that is a rule change issue, not a manipulation issue.
  4.  **The "Gray" Sunlight:** If half the voters say "I'd be okay with that tactic" and half say "I'd be mad," you do not have a consensus. That is a values call for the Senate.
