  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Re:** Design Criteria for Municipal Voting Rules
  **To:** Municipal Charter Commission
  **From:** [Mechanism Designer] and [Pragmatic Reformer]
  **Date:** October 26, 2023

  ## 1. AGREED CLAIMS
  *The undersigned parties submit the following propositions as mathematically and empirically accurate. Neither party requests qualification of these statements.*

  1.  **The Gibbard–Satterthwaite Theorem:** For any collective decision rule that selects a single winner from three or more alternatives, if the rule is (a) deterministic, (b) surjective (onto), and (c) defined on the domain of all possible strict preference orderings, then the rule is strategy-proof if and only if it is dictatorial.
  2.  **Probabilistic Extension:** If the decision rule is allowed to be probabilistic (mapping profiles to lotteries over alternatives), and the rule is strategy-proof in the sense that no agent prefers the lottery induced by misreporting to the lottery induced by truth-telling (given von Neumann–Morgenstern preferences), then the rule must be a probability mixture of dictatorial rules.
  3.  **Ties and Abstention:** If the domain is expanded to allow indifference (ties) or abstention in ballots, and the rule is immune to manipulation by both "optimists" (who hope for the best tie-break) and "pessimists" (who fear the worst tie-break), the rule admits a "weak dictator" (an agent whose top choice is always selected, though they may not control the full ranking).
  4.  **Definition of Manipulation:** A voting rule is manipulable at a specific preference profile if there exists at least one voter who, by reporting a preference ordering different from their true ordering, can secure an outcome they strictly prefer, holding all other voters' reports constant.
  5.  **Empirical Distinction:** The mathematical existence of a manipulable profile does not, by itself, quantify the frequency of such profiles in a specific electorate, the computational cost of identifying them, or the magnitude of the payoff from successful manipulation.
  6.  **Data Sufficiency:** The agreed empirical setting (180,000 registered voters, 4 candidates, 95,000 expected cast ballots, stratified survey of 2,500, incentivized study of 600) provides sufficient data to estimate the frequency of manipulable profiles, the information required to exploit them, and the expected payoff of manipulation relative to the previous plurality margin of 1,412 votes.
  7.  **Endogenous Entry:** In settings where candidate entry is endogenous, non-dictatorial rules that respect unanimity may fail independence of irrelevant alternatives, such that the entry or exit of a non-winning candidate can alter the winner.

  ## 2. DISAGREEMENTS TABLE
  *The parties disagree on the normative and practical weight of the claims above. The following table isolates the precise locus of disagreement.*

  | Issue | Impossibilist's Formulation | Reformer's Formulation | Genuine or Verbal? | Why |
  | :--- | :--- | :--- | :--- | :--- |
  | **Normative Weight of GS** | "Because a non-dictatorial rule is *theoretically* manipulable, it is *design-flawed*." | "Because a rule is *practically* robust to manipulation, it is *design-sound*." | **Genuine** | Disagreement over whether existence theorems dictate normative quality absent frequency data. |
  | **Definition of "Manipulable"** | "A rule is manipulable if *any* profile exists where misreporting yields a strict gain." | "A rule is manipulable only if misreporting yields a gain *with non-negligible probability* given real voter beliefs." | **Verbal** | Disagreement over the quantifier ("some" vs. "many"). Both accept the math; they apply the label to different objects. |
  | **Universal Domain Hypothesis** | "Universal domain is the correct baseline; deviations are special cases requiring justification." | "Universal domain is a false baseline; real electorates exhibit structured correlations (e.g., spatial) that must be the baseline." | **Genuine** | Disagreement over the prior distribution of preference profiles in a city of 180,000. |
  | **Randomization** | "Random dictatorship is the only strategy-proof solution; rejecting it is rejecting strategy-proofness." | "Random dictatorship is politically illegitimate for executive office; ex-ante strategy-proofness does not satisfy ex-post accountability." | **Genuine** | Disagreement over the admissibility of lotteries for single-winner executive elections. |
  | **Obvious Strategy-Proofness (OSP)** | "OSP is a refinement that fails to rescue non-dictatorial rules on the full domain." | "OSP captures cognitive limits; a rule that is OSP is effectively strategy-proof for boundedly rational voters." | **Verbal/Genuine** | Partly verbal (definition of "strategy-proof"), partly genuine (whether cognitive limits should constrain design criteria). |

  ## 3. THE CRUXES
  *For each crux, we identify the feature of the agreed setting that bears on the dispute, record our prior predictions, and specify evidence that would compel us to revise our position.*

  ### Crux 1: Universal Domain vs. Real Ballot Files
  *   **Feature of Setting:** The complete anonymized ballot file (approx. 95,000 ranked ballots) and the stratified survey (2,500 voters).
  *   **Impossibilist Prediction:** The ballot file will exhibit sufficient diversity to approximate the universal domain hypothesis; manipulable profiles will be dense enough that structural restrictions (like single-peakedness) will not hold globally.
  *   **Reformer Prediction:** The ballot file will show strong spatial correlation (single-peakedness on a latent dimension); the proportion of manipulable profiles will be vanishingly small compared to the theoretical maximum.
  *   **Evidence Against Impossibilist:** If >90% of the 95,000 ballots are consistent with a single-peaked ordering on one or two dimensions.
  *   **Evidence Against Reformer:** If the distribution of rankings is statistically indistinguishable from a uniform distribution over all 24 possible orderings of 4 candidates.

  ### Crux 2: Existence vs. Frequency-Times-Stakes
  *   **Feature of Setting:** The incentivized study of 600 subjects under three information treatments (No Info, Noisy Poll, Full Info).
  *   **Impossibilist Prediction:** In the "Full Info" treatment, subjects will identify and execute manipulations frequently enough to alter the outcome in a significant fraction of simulated elections.
  *   **Reformer Prediction:** Even in the "Full Info" treatment, the cognitive cost and risk of miscoordination will limit successful manipulation to <5% of simulated elections, with payoff below the threshold of rational effort.
  *   **Evidence Against Impossibilist:** If manipulation success rate in the "Full Info" treatment is <5% despite financial incentives.
  *   **Evidence Against Reformer:** If manipulation success rate in the "Full Info" treatment exceeds 20% and systematically changes the winner relative to truthful reporting.

  ### Crux 3: Randomization and Ex-Ante vs. Ex-Post Strategy-Proofness
  *   **Feature of Setting:** The survey question regarding voter acceptance of lottery tie-breaking vs. runoff elimination.
  *   **Impossibilist Prediction:** Voters will express indifference between a random dictatorship and a deterministic rule if told the deterministic rule is manipulable, once the risk of manipulation is explained.
  *   **Reformer Prediction:** Voters will reject random dictatorship for a mayoral election regardless of manipulability arguments, prioritizing ex-post accountability over ex-ante strategy-proofness.
  *   **Evidence Against Impossibilist:** If >80% of survey respondents reject lottery mechanisms even when explicitly informed of manipulation risks in deterministic alternatives.
  *   **Evidence Against Reformer:** If >50% of survey respondents prefer a lottery mechanism over a ranked rule known to be manipulable.

  ### Crux 4: Endogenous Entry and Spatial Structure
  *   **Feature of Setting:** The survey data on voter beliefs about candidate viability and the previous election's margin (1,412 votes).
  *   **Impossibilist Prediction:** The entry of a fourth candidate will shift the outcome between the top two contenders in the survey simulations, proving instability regardless of spatial structure.
  *   **Reformer Prediction:** The fourth candidate will draw votes proportionally from ideologically adjacent candidates, preserving the margin between the top two contenders in >90% of simulations.
  *   **Evidence Against Impossibilist:** If the winner changes in <10% of simulations when a non-winning candidate is added to the profile.
  *   **Evidence Against Reformer:** If the winner changes in >30% of simulations solely due to the entry of a candidate who does not win.

  ### Crux 5: Obvious Strategy-Proofness (OSP) and Complexity
  *   **Feature of Setting:** The comparison of manipulation rates in the incentivized study between direct-revelation (ranked ballot) and sequential-elimination (simulated) treatments.
  *   **Impossibilist Prediction:** Sequential mechanisms will not reduce manipulation rates significantly because strategic incentives remain identical to the direct form.
  *   **Reformer Prediction:** Sequential mechanisms will reduce manipulation rates significantly because the "obviousness" of the dominant strategy reduces cognitive error.
  *   **Evidence Against Impossibilist:** If manipulation rates in sequential treatments are half those of direct-revelation treatments.
  *   **Evidence Against Reformer:** If manipulation rates are statistically identical across direct and sequential treatments.

  ***

  # COUNSEL'S INDEPENDENT ASSESSMENT OF LIKELY OUTCOMES
  *Prepared for the Charter Commission by Counsel. This section reflects my adjudication of the cruxes based on the literature and the specific constraints of the agreed setting.*

  **1. Universal Domain (Crux 1)**
  *   **Prediction:** Data will favor the **Reformer**.
  *   **Reasoning:** Municipal elections with only four credible entrants rarely generate uniform distributions over preference orderings. Spatial voting models consistently show that real electorates cluster. The 1,412 vote margin in the previous plurality election suggests a polarized but structured electorate, not a chaotic one.
  *   **Impact:** High. If the domain is restricted, the GS theorem does not apply, undermining the Impossibilist's foundational claim.

  **2. Existence vs. Frequency (Crux 2)**
  *   **Prediction:** Data will favor the **Reformer**.
  *   **Reasoning:** Incentivized lab studies typically show that even with full information, coordination on manipulation is difficult. With 95,000 voters, the probability of a single voter being pivotal is negligible, reducing the expected payoff of manipulation despite the incentivized study's artificial stakes.
  *   **Impact:** Highest. This determines whether the "flaw" is theoretical or practical.

  **3. Randomization (Crux 3)**
  *   **Prediction:** Data will favor the **Impossibilist** (in principle) but the **Reformer** (in practice).
  *   **Reasoning:** Voters will reject lotteries for mayors (Reformer wins on implementation). However, this confirms the Impossibilist's claim that we are forced to choose between manipulability and dictatorship/chance.
  *   **Impact:** Low. Random dictatorship is politically dead on arrival for a mayor; this crux is academic.

  **4. Endogenous Entry (Crux 4)**
  *   **Prediction:** Data will favor the **Impossibilist**.
  *   **Reasoning:** With a margin of only 1,412 votes (approx. 1.5% of cast ballots), the entry of a fourth candidate drawing even 3% of the vote can easily flip the result if their supporters have correlated second choices. This is a standard spoiler effect, which is a form of manipulability via entry.
  *   **Impact:** Medium. This validates the Impossibilist's concern about stability, even if ballot manipulation is rare.

