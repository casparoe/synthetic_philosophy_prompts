answer: |-
  This is the right instinct. Most political theory papers fail because they argue for a conclusion ("states' rights are good") without establishing the metric by which "good" is measured. You want the metric.

  Here is the specification list for an adequate principle of vertical authority allocation. Each requirement includes the "failure case"—a scenario where ignoring the requirement produces a result that violates basic intuitions about governance, even if it adheres to a specific ideology.

  ### The Specification List

  **1. Comparative Competence (Not Absolute Capability)**
  *   **The Requirement:** The principle cannot ask "Can the local unit do this?" It must ask "Does the local unit do this *better* than the higher unit, accounting for transaction costs?" It requires a defined metric of "better" (speed, cost, preference satisfaction, equity).
  *   **The Failure Case:** A city manages its own power grid. Technically, they *can* run it. But during a regional heatwave, the state could balance loads across 50 cities to prevent blackouts. A principle that says "Local can do it, so Local should" leads to regional blackouts. The principle fails if it ignores economies of scale or coordination needs.

  **2. Boundary Internalization (The Spillover Test)**
  *   **The Requirement:** The jurisdiction making the decision must encompass the majority of the people bearing the costs and benefits. If costs spill over borders, authority must move up.
  *   **The Failure Case:** Your city bans short-term rentals to preserve housing. The result: rentals shift to the unincorporated county next door, driving up prices there and clogging their roads. The city council voters got the benefit (quiet streets); the county voters got the cost (traffic). A principle that allows this without a mechanism to resolve it is inadequate.

  **3. Exit Viability (The Tiebout Condition)**
  *   **The Requirement:** If the principle relies on "voting with your feet" to check local power, it must verify that exit is actually possible. This requires low moving costs, housing availability, and no legal barriers to movement.
  *   **The Failure Case:** A principle says "If you don't like the local STR laws, move." But if the whole metro region adopts the same law (or the state preempts all of them), or if housing is so scarce you can't move, "exit" is a fantasy. A principle that assumes mobility where none exists justifies tyranny.

  **4. Anti-Capture Rotation**
  *   **The Requirement:** The principle cannot assume the local level is inherently more democratic or less corrupt than the state level. It must account for which level is currently more susceptible to capture by the specific interest group involved.
  *   **The Failure Case:** A city council is dominated by hotel unions who want to ban Airbnb to eliminate competition. The state legislature is dominated by rural voters who don't care about hotels and prefer property tax revenue from STRs. A "Local Control" principle automatically sides with the captured council. A "State Rights" principle automatically sides with a legislature that might be captured by statewide developers. The principle must identify *who* is captured, not just *where*.

  **5. Rights Floor (Minority Protection)**
  *   **The Requirement:** Local authority cannot extend to violating fundamental rights of residents, even if a local majority supports it. There must be a higher-level veto on specific categories of rights.
  *   **The Failure Case:** A local majority votes to ban a specific religious group from renting properties. "Local Control" demands this be allowed. Any principle that permits this is morally bankrupt. The principle must define which issues are off-limits to local majorities.

  **6. Fiscal Autonomy (The Power of the Purse)**
  *   **The Requirement:** A level of government cannot be assigned responsibility for a problem unless it has the independent authority to raise revenue to solve it. Authority without revenue is a mandate, not a power.
  *   **The Failure Case:** The state tells cities they must provide homeless shelters (responsibility) but forbids them from raising property taxes or taxing STRs to pay for it (no revenue). The city fails, gets blamed, and loses legitimacy. A principle that separates duty from funding is administratively broken.

  **7. Meta-Authority (Kompetenz-Kompetenz)**
  *   **The Requirement:** The principle must explicitly state who has the authority to decide which level has authority. You cannot dodge the question of who draws the boundaries.
  *   **The Failure Case:** The city claims inherent sovereignty. The state claims cities are "creatures of the state." If the state decides the scope of city power, the city has no real power—it's a franchise, not a government. A principle that doesn't answer "Who decides the jurisdiction?" collapses the moment a dispute arises (like your STR law).

  **8. Jurisdictional Definition**
  *   **The Requirement:** The principle must define what counts as a "level." Is "local" the city? The county? The school district? The metro area?
  *   **The Failure Case:** A regional transit issue arises. The city says "we decide." The county says "we decide." The principle says "Local should decide." But which local? If the principle can't define the unit, it can't assign the task.

  ***

  ### Analysis of the Requirements

  **Non-Negotiable vs. Partisan Preferences**

  *   **Non-Negotiable:** *Boundary Internalization, Rights Floor, Fiscal Autonomy.*
      *   You cannot have a functioning system if costs are externalized (physics breaks), minorities are crushed (morality breaks), or duties are unfunded (administration breaks). These are structural necessities.
  *   **Partisan Preferences:** *Comparative Competence, Exit Viability, Anti-Capture.*
      *   *Comparative Competence:* Centralists assume the state has better data/experts; Decentralists assume locals have better knowledge. This is an empirical bet, not a hard rule.
      *   *Exit Viability:* Decentralists love this (Tiebout sorting); Centralists hate it (it increases inequality/segregation).
      *   *Anti-Capture:* Both sides use this. "The state is captured by special interests" vs. "The city council is captured by neighbors." It's a weapon, not a standard.

  **The Incompatibility Trap**

  Your hunch is correct: **Comparative Competence + Meta-Authority is a logical trap.**
  To know if the local unit is "competent" (Req 1), someone has to judge them. If the State judges the Local unit, the State has already won (Req 7). If the Local unit judges itself, it will never cede power.
  *   *Result:* You cannot satisfy both perfectly. You usually solve this with a Constitution (rigid rules) or a Court (arbitrary interpreter). But logically, the "competent judge" is always the one with the bigger army.

  **The Killer Requirement**

  **Fiscal Autonomy (Req 6)** knocks out the most popular answers.
  *   *Why:* Most theories (especially "New Federalism" or standard preemption arguments) assign regulatory authority without discussing tax authority.
  *   *Impact:* If your principle allows the State to regulate STRs but lets the City keep the tax revenue, it fails. If it lets the City regulate but the State takes the tax, it fails. Most essays ignore money entirely. If you include this, 80% of standard arguments vanish.

  **The Definition Requirement**

  **Jurisdictional Definition (Req 8)** is the silent killer.
  *   "Local" is not a natural kind. A city boundary is a line on a map from 1920. A "region" is a commuting pattern. If your principle says "decide at the lowest level," but doesn't define the level, it is useless. In your STR case, is the relevant "local" unit the neighborhood, the city, or the housing market (which is regional)?

  ***

  ### Testing Three Contenders

  **1. Fiscal Federalism (Oates' Decentralization Theorem)**
  *   *The Gist:* Assign function to the lowest level that can internalize the benefits/costs.
  *   *Vs. The List:* Passes **Boundary Internalization**. Fails **Rights Floor** (purely economic theory). Fails **Fiscal Autonomy** (often assumes grants fill gaps).
  *   *Verdict:* Good for efficiency, dangerous for liberty.

  **2. EU Subsidiarity Principle**
  *   *The Gist:* The Union acts only if objectives cannot be sufficiently achieved by Member States.
  *   *Vs. The List:* Passes **Comparative Competence** (explicitly). Fails **Meta-Authority** (The ECJ decides if the Member State failed, so the Union judges the Member). Fails **Jurisdictional Definition** (What is "sufficiently"?).
  *   *Verdict:* Sounds great, but the "higher" level always wins the interpretation fight.

  **3. Hard Decentralism (Strong Localism)**
  *   *The Gist:* Local control is inherently more democratic; state preemption is illegitimate.
  *   *Vs. The List:* Passes **Exit Viability** (theoretically). Fails **Boundary Internalization** (ignores spillovers like housing markets). Fails **Anti-Capture** (assumes local = good). Fails **Rights Floor** (allows local tyranny).
  *   *Verdict:* Morally risky, economically naive regarding regions.

  ***

  ### Meta-Critique: Where This List Breaks

  I need to be honest about the weaknesses in this specification, because a smart professor (or opponent) will attack them.

  **1. The Weakest Link: Rights Floor (Req 5)**
  *   **The Counter-Argument:** A strict federalist would argue that a "Rights Floor" isn't a requirement of *federalism*, it's a requirement of *liberalism*. They would say federalism is about structure, not outcomes. By baking rights into the allocation principle, I'm smuggling in a specific moral framework.
  *   **Why it might hold:** If you remove it, you allow local segregation. If you keep it, you admit that "Local Control" is secondary to "Human Rights," which centralists use to preempt everything (e.g., "Bathroom bills are civil rights, so the State must decide").
  *   **What would change my mind:** If you could demonstrate a system where local variation *protects* rights better than a uniform floor (e.g., sanctuary cities protecting immigrants from federal law). In that case, the "Floor" becomes a "Ceiling," and the requirement flips.

  **2. The Most Contested Requirement: Fiscal Autonomy (Req 6)**
  *   **The Counter-Argument:** A constitutional lawyer would argue that authority and funding are separate. A local government can be fully sovereign but poor. Requiring fiscal autonomy conflates *legitimacy* with *capacity*.
  *   **Why it might hold:** If a city has the right to decide but no money to enforce, it's a paper tiger. But is it *wrong* for the State to fund a local mandate? (e.g., State pays for local schools).
  *   **What would change my mind:** Evidence of successful governance where the lower level regulates but the higher level funds without strings attached. (Rare, but exists).

  **3. The Unsolvable Trap: Meta-Authority (Req 7)**
  *   **Where Reasoning Breaks:** This is the deepest hole. There is no logical solution to "Who decides who decides." It is ultimately a question of force or historical accident.
  *   **The Vulnerability:** Any principle I give you that solves this is lying. In the US, the answer is "The Supreme Court." In your state, it's "The State Legislature." That's not a principle; it's a hierarchy.
  *   **Honest Assessment:** I suspect this requirement makes the whole list impossible to satisfy. If the State has Meta-Authority, Local Control is a myth. If Local has Meta-Authority, the State is a myth. The "Adequate Principle" you are looking for might not exist logically; it only exists politically.

  **Final Advice for the Paper:**
  Don't try to solve the Meta-Authority trap. Acknowledge it. Use **Fiscal Autonomy** and **Boundary Internalization** as your heavy lifters. They are the hardest to argue against without sounding like you want unfunded mandates or pollution. If you can show that your class's debate ignored *who pays* and *where the costs land*, you'll have a stronger paper than anyone arguing "Liberty vs. Order."
