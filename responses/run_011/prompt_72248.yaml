  Dear Friend,

  It is a heavy burden to be the arbiter of two hundred appetites, and I am not surprised that the weight of those verdicts has begun to press against your philosophical convictions. You have stumbled upon a problem that has occupied some of the sharpest minds in recent epistemology, though you have arrived at it through the much more visceral medium of mushrooms rather than thought experiments about bank hours or lotteries. The tension you feel is real, and your draft principle is a honest attempt to codify the intuition that what we know depends on what we stand to lose. You have asked me to test that formulation, offer alternatives, and help you decide which of your own intuitions might need to be pruned to save the rest of the tree. I will try to do this without recourse to the jargon of the academy, sticking instead to the dirt and stakes of your foraging circle.

  Your draft principle is a version of what we might call stakes-sensitive knowledge. It holds that knowledge is not just a matter of having good evidence, but of having evidence good enough to justify acting on it given the costs of being wrong. This handles your first and second cases beautifully. In the first case, the cost of error is zero because the mushroom is not eaten, so the evidence required to know is low, and the novice meets it. In the second case, the cost of error is illness or death, so the evidence required to know is much higher, and the novice fails to meet it. This also explains your eighth case about the mechanic and the timing belt; on an ordinary week, the stakes are low enough that the mechanic's testimony gives you knowledge, but when your daughter's life is on the line, the stakes rise, the evidence required rises, and you no longer know the car is safe. However, as you noted, this principle struggles with your fourth case. If checking is impossible, your principle becomes a fudge, because there is no cost of checking to weigh against the cost of error. It also struggles with the fifth case, implying that knowledge can vanish retroactively when stakes rise, which feels metaphysically strange. Finally, it has trouble with the seventh case, where your cousin knows the mushroom is a chanterelle but should not bet on it; your principle suggests that if the stakes of the bet are high, he shouldn't know, but you want to say he does know and is merely rash to bet.

  To give you a clearer view of the landscape, I propose we set out three candidate principles that compete to explain these verdicts. The first is a refined version of your own draft, which we might call the Pragmatic Encroachment Principle. This principle states that a person knows a proposition only if their evidence is strong enough to make it rational for them to act on that proposition in their actual situation. This means the threshold for knowledge rises as the practical stakes rise. The second candidate is the Purist Invariantist Principle, which states that knowledge is determined solely by truth-conducive factors like evidence and reliability, while practical stakes determine only whether it is rational to act or assert that knowledge. On this view, stakes never change whether someone knows, only whether they should rely on what they know. The third candidate is the Attributor Contextualist Principle, which states that the word knows changes its meaning depending on the context of the person making the claim, so that I might truthfully say she knows when I am in a low-stakes context, but truthfully say she does not know when I am in a high-stakes context, even if her evidence never changes.

  Let us test these against your cases and two new ones I have constructed to sharpen the distinctions. The first new case is the Unaware High-Stakes scenario: a novice finds a chanterelle and believes she is feeding a compost bin, so she treats the stakes as low, but unbeknownst to her, she is actually feeding a child with a severe allergy. The second new case is the Remote Attributor scenario: you are sitting in a quiet library with no stakes in the matter, judging a photograph posted by a forager who is about to feed a hospital ward.

  The Pragmatic Encroachment Principle handles your first, second, and eighth cases well, as it allows stakes to dictate knowledge. It also handles the Remote Attributor case by looking at the subject's stakes, not yours, so you would say she does not know if her stakes are high. However, it fails to accommodate your seventh verdict about the cousin; it would say he does not know because the bet raises the stakes, whereas you feel he knows but is rash. It also forces you to accept the fifth verdict that knowledge is retroactively deleted, which you find hard to swallow. In the Unaware High-Stakes case, this principle would say she does not know because the objective stakes are high, even though she feels safe, which seems to punish her for ignorance of the context.

  The Purist Invariantist Principle accommodates your fifth and seventh verdicts perfectly. It says the novice knows in both the first and second cases because her evidence is identical, and it says your cousin knows despite the bet because his evidence hasn't changed. It also handles the Unaware High-Stakes case by saying she knows because her evidence is sufficient, regardless of the hidden danger. However, this principle forces you to surrender your core intuition in the second case. You want to say she does not know when dinner is at stake, but this principle says she knows just as well as when she was leaving it in the woods. It also struggles with the fourth case; if she knows, why are you embarrassed to say so? And in the Remote Attributor case, it says you should judge based on her evidence alone, ignoring the hospital stakes, which might feel irresponsible given your role as arbiter.

  The Attributor Contextualist Principle offers a different solution to the fifth case. It says that yesterday, in a low-stakes conversation, it was true to say she knew, and today, in a high-stakes conversation, it is true to say she does not know, without implying her mental state changed. This saves you from saying knowledge was deleted. It also handles the sixth case well, explaining why the curator knows relative to his context but you cannot rely on him relative to yours. However, it struggles with the fourth case, where the subject herself is the attributor; if she says I know, is she speaking in a high-stakes context? It also makes knowledge seem too linguistic, dependent on who is talking rather than the mushroom or the person.

  Now we must face the question of which verdict to surrender. You suspect it is one of the fourth, the fifth, or the seventh. The fourth verdict is that the novice may eat but does not know. The fifth is that knowledge is retroactively deleted when stakes rise. The seventh is that the cousin knows despite the high-stakes bet. I recommend that you surrender the fourth verdict. The embarrassment you feel there is a signal that your intuition is misaligned with the rest of your system. If the novice has no check available and is entitled to eat, then she meets the epistemic standard for action. To say she acts rationally but lacks knowledge creates a gap between knowledge and rational action that is hard to sustain. If she is forced to act, the stakes cannot raise the bar higher than the evidence can possibly reach, so she must know. Surrendering this verdict allows you to keep the Pragmatic Encroachment Principle, which best explains your strong intuitions in the first, second, and eighth cases. It does force you to accept the fifth verdict, that knowledge can vary with stakes over time, but this is less costly than severing the link between knowledge and action. It also requires you to accept that in the seventh case, your cousin does not know when the bet is on the table, which is a manageable concession; you can say he had knowledge before the bet, but the bet raised the stakes enough to destroy it.

  Applying this settled view to your final case about the morel for your wife clarifies the situation. You identify the mushroom and say you are sure, but you privately intend to check the spore print. Under the Pragmatic Encroachment Principle, your knowledge is determined by the stakes for you, which are high because your wife trusts you and will eat what you serve. Your visual evidence alone is not sufficient for these high stakes, which is why you intend to check. Therefore, you do not know when you say you are sure. Your unspoken intention to verify is not proof that you never had knowledge; rather, it is proof that you know you do not know. You are asserting a level of certainty you do not possess to spare her anxiety, but epistemically, you are in the same position as the novice in your second case. You are not entitled to treat the matter as settled, and your plan to check is the rational response to that lack of knowledge. If you truly knew, you would not need to check, just as the expert mycologist in your third case does not need to check. The intention to verify reveals that your evidence has not met the threshold required by the stakes of your wife's safety.

  I hope this helps you bring some order to your verdicts. It is a difficult thing to reconcile the safety of your friends with the precision of your concepts, but I suspect that admitting the fourth case was a misstep will allow the rest of your principles to stand firm. You may find that saying she knows in the desperate case where no check is possible feels more comfortable than saying she acts rightly without knowledge. Good luck with the season ahead, and may your chanterelles be true.

  Yours sincerely,

  A Correspondent
