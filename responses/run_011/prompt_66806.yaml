answer: |-
  **Case A: The Epistemic Trap**

  **Payoffs (Own Profit):**
  | Own \ Rivals Escalating | 0 | 4 |
  | :--- | :--- | :--- |
  | **Escalate (E)** | 10 | 5 |
  | **Restraint (R)** | 8 | 7 |

  **Checks:** (ii) At 4 rivals, $R (7) > E (5)$, so Universal $E$ is not Nash. (iii) At 0 rivals, $E (10) > R (8)$, so neither strategy dominates.
  **Mechanism:** Centres observe only own net profit. Playing $E$ against $R$ rivals yields high revenue minus high cost = 10. Playing $E$ against $E$ rivals yields medium revenue minus high cost = 5. Centres observe 5. They infer: "My profit is depressed by my own high costs, implying rivals are resting ($k=0$)." This belief makes $E$ the best response ($10 > 8$). All play $E$. The inference is false (rivals are $E$), but never corrected because no centre experiments with $R$; doing so would risk catastrophic loss if the belief were true. The industry locks into Universal $E$ despite it being unstable under full information.
  **Intervention:** Publishing hours reveals $k=4$. Centres recalculate: $R (7) > E (5)$. All switch to Restraint. The trap dissolves.

  **Case B: The Incentive Trap**

  **Payoffs (Own Profit):**
  | Own \ Rivals Escalating | 0 | 2 | 4 |
  | :--- | :--- | :--- | :--- |
  | **Escalate (E)** | 10 | 5 | 5 |
  | **Restraint (R)** | 8 | 6 | 4 |

  **Structure:** Centres have heterogeneous cost bases (Centre 1 has higher overhead).
  **Checks:** Universal $E$ is Nash ($5 > 4$). Universal $R$ is not ($10 > 8$). No dominance ($R$ better at $k=2$). Heterogeneity eliminates the symmetric mixed equilibrium ({2E, 3R}) because Centre 1 prefers $E$ at $k=2$, destabilizing the coalition. Universal $E$ is the unique Nash equilibrium.
  **Mechanism:** Incentives drive all to $E$ regardless of belief. Even knowing $k=4$, $E$ remains optimal ($5 > 4$). The outcome is Pareto dominated by Universal $R$ ($8 > 5$), but $R$ is not a best response to any stable configuration.
  **Intervention:** Publishing hours confirms $k=4$. Since $E$ remains the best response ($5 > 4$), behaviour does not change. Transparency removes ambiguity, accelerating the collapse of any tentative restraint by confirming the futility of cooperation.

  **Engineering Report**

  **Separating Feature:** **Observability of Rival Strategy.** In Case A, the trap is epistemic; agents play $E$ because they *think* rivals play $R$. In Case B, the trap is incentive-based; agents play $E$ because it is the best response to reality.
  **Remove Feature from A:** If rival hours were observable from the start, centres would see $k=4$, prefer $R$, and the industry would settle on Universal Restraint. The trap requires opacity.
  **Reply to Uncertainty Objector:** Pricing uncertainty implies experimenting with $R$ to gain information. In Case A, agents do not experiment because their false belief makes $R$ look suicidal, not risky. The error is systematic bias, not risk aversion.
  **Reply to Positional Objector:** Case B lacks a dominant strategy, distinguishing it from a simple Prisoner's Dilemma. It is a coordination failure locked by asymmetry, not merely a sum of externalities. The label "Moloch" earns its keep here only if it denotes inescapable incentive structures, but Case A fits the "self-reinforcing myth" connotation better.
  **Verdict:** Case A deserves the name **Multipolar Trap**. It captures the specific pathology where agents collectively sustain a worse outcome through mutually reinforcing false beliefs, solvable by coordination (information) rather than requiring binding enforcement. Case B is merely a hard incentive problem.
