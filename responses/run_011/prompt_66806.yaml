          *   *Wait, if they believe rivals are playing $R$, and $E$ is best response to $R$, they play $E$. If everyone plays $E$, the state is $(E, E, E, E, E)$. Condition (ii) says $P(R, 4) > P(E, 4)$. So if someone deviated, they'd win. But they don't deviate because they believe the state is different.*
