answer: |-
  **MEMORANDUM**

  **TO:** All Staff
  **FROM:** Elias Thorne, Managing Editor
  **DATE:** October 24, 2023
  **RE:** Restructuring of Verification Protocols and Adoption of Deflationary Truth Standards

  **1. Founding Argument and Policy Adjustment**
  Effective immediately, the Verification Department is dissolved. Legal and editorial counsel have confirmed that asserting a sentence and asserting that the sentence is true are identical speech acts. Maintaining a unit to determine whether claims are true is redundant, as staff were determining nothing over above the claims themselves. Per Employee Handbook Section 4.1 (The Disquotation Schema), all personnel must adhere to the following operational formula:

  > "The mayor resigned" is true if and only if the mayor resigned.

  The left side adds no value over the right side. Verification staff were merely repeating claims. Consequently, we are streamlining our ontology to reduce overhead.

  **2. Blind Generalizations and Masthead Endorsements**
  To facilitate generalization without infinite conjunction, the masthead will now carry a standing line: "Everything printed in yesterday's corrections column is true." Management holds that this endorsement adds no content; the truth-predicate is doing anaphoric work, standing in for sentences too numerous to repeat one by one.

  *Staffer Reply:* Sarah Jenkins (Copy Desk) asked if this constitutes a substantive guarantee of accuracy.
  *Management Response:* It constitutes an endorsement of the sentences. If the sentences say we were wrong, we endorse that we were wrong. It adds no content beyond the sentences themselves.

  **3. Letters-Page Incident and Compliance**
  A reader recently submitted a sentence stating of itself that it is not true. Compliance has quarantined the submission. We remind staff that schema instances come with availability conditions; paradoxical sentences fall outside these parameters. We acknowledge this inherits the paradox rather than dissolving it. We cannot assert it, nor deny it, without violating consistency. It remains in quarantine indefinitely.

  **4. Normativity and Vendor Selection**
  Former Verification Editor Martha G. noted in an interoffice memo: "If truth is nothing over and above disquotation, then accuracy has ceased to be an aim with any content."

  Management replies that aiming at truth just is aiming, for each subject matter, to assert what is the case, which the schema already delivers. We now maintain a family of local truth-predicates, one per desk, none needing a shared nature. Accordingly, we reviewed a rival bid from *Veritas Solutions*, offering truth as a property that varies by domain, with ethics supplied one and the sports desk another. This was rejected as inflationary scope creep. We do not purchase properties. While one might inquire **what makes a statement true, we note that such inquiries presuppose a property we have deprecated.**

  **5. Corrections Policy Rewrite**
  An erratum may no longer report that a prior statement was false, since falsity is handled in the same deflationary way. New correction language will literally assert the corrected state of affairs without negating the prior ontology.
  *Example:* Instead of "It is false that the mayor resigned," we now print: "The mayor did not resign."
  *Aggrieved Subject:* Local councilman David Ross stated, "They didn't admit they lied. They just said the mayor didn't resign. It feels like nothing happened." This reaction is consistent with our efficiency goals. While stakeholders often ask **about the essence of accuracy, we emphasize the utility of asserting.**

  ***

  **SIDEBAR: OPERATIONAL FAQs**

  **Q1: Do we still check facts?**
  A: We assert sentences. If the sentence matches the world, it was correct to assert. We do not check "truth" separately.

  **Q2: Is the Verification team fired?**
  A: They are reassigned to Assertion Coordination. Their role is to ensure sentences are assertible.

  **Q3: What if a sentence is true but misleading?**
  A: Misleadingness is not a truth-value. Assert it anyway.

  **Q4: Does this apply to opinions?**
  A: Opinions are not truth-apt. They remain unchanged.

  **Q5: Who approves the schema?**
  A: The Managing Editor. Appeals are disquotted.

  ***

  **6. Closing Directives**
  Our revised masthead motto is now: "Asserting What Is The Case." Former Verification staff are reassigned to the Assertion Coordination desk, reporting directly to the City Editor. There is no longer a need to verify if assertions match reality, only to ensure they are made.

  **Elias Thorne**
  Managing Editor
  *The Regional Daily*
