  2.  **Deconstruct the Math:**
      *   The user describes a specific gamble: Flip coin until heads (n). Payoff: $(-1)^{n+1} * 2^n / n$. Probability: $1/2^n$.
      *   Expected Value term: $P(n) * Payoff(n) = (1/2^n) * ((-1)^{n+1} * 2^n / n) = (-1)^{n+1} / n$.
      *   Series: $\sum_{n=1}^{\infty} (-1)^{n+1} / n$. This is the alternating harmonic series.
      *   Properties: Converges conditionally to $\ln(2)$. It does *not* converge absolutely.
      *   Riemann Series Theorem: Can be rearranged to converge to any real number or diverge.
      *   User's description says "Add the terms up in the natural order and you get something like 69 cents." ($\ln(2) \approx 0.693$). This matches.
      *   User's description says "Expected value doesn't just blow up to infinity... flat out isn't a well defined number." This is accurate for conditional convergence in the context of expectation if the order of settlement isn't fixed.
      *   Failure Modes to distinguish:
          1.  Divergence to infinity (e.g., St. Petersburg).
          2.  Undefined/ Rearrangeable (Conditional convergence, the core problem).
          3.  Numerical Error (Floating point noise, Kahan summation fixes this).

