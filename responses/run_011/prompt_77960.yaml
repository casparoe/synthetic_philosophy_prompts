  4.  **Drafting - Section by Section:**

      *   **Section 1: Story Frames.** Keep it tight.
      *   **Section 2: The Story.**
          *   *Characters:* Protagonist (Engineer, let's call her Mara), Antagonist/Pressure (CTO or Product, let's say David), maybe a Quant (let's say Elias).
