      *   **Section 4: Where the story cheats.** Acknowledge simplifications (e.g., real markets have tick sizes, liquidity constraints, etc.).

  5.  **Refining the Math in the Narrative:**
      *   Need to ensure the distinction between *floating point error* and *mathematical indeterminacy* is clear.
      *   Need to show the "split positive/negative" fix failing. If the series is $\sum (-1)^{n+1}/n$, splitting gives $\sum 1/(2k-1)$ (positives) and $\sum -1/(2k)$ (negatives). Both are harmonic series variants. Both diverge to infinity. So $\infty - \infty$ is the result. That's the "blow up" moment.
