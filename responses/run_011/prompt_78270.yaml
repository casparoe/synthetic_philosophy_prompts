answer: |-
  Here is a defended ordering of priorities for your engineering team, ranked by **Defensibility** (auditability of the decision trail), **Consistency** (resolving the logical contradiction), and **Feasibility** (fit within 1 engineer/2 quarters).

  ### Ranking Criteria
  1.  **Defensibility:** In an operational incident (e.g., rollback), can you prove to a post-mortem auditor *why* the decision was made? Black-box majority votes are hard to defend; logical derivations are not.
  2.  **Consistency:** Does the method guarantee that the final decision does not contradict the aggregated premises (resolving the discursive dilemma)?
  3.  **Feasibility:** Can one engineer implement, test, and monitor this within ~400 hours?

  ---

  ### 1. Procedure Selection: Premise-Based over Conclusion-Based
  **Priority:** Critical | **Effort:** Low | **Risk if Ignored:** High

  You must formally adopt a **Premise-Based Procedure (PBP)**. You aggregate the votes on the intermediate facts (Control X? Policy Y?) and *derive* the conclusion (Rollback?) via hard-coded logic, rather than asking agents for the conclusion or voting on the conclusion directly.

  *   **What breaks if you get this wrong:** You retain the discursive dilemma. You will ship a system where the audit log says "Majority said Control X was missing" and "Majority said Policy Y was violated," but the system decides "No Rollback." This is indefensible in a compliance or security review.
  *   **Trade-off:** PBP places a higher burden on the *quality* of the premise questions. If the premises are ambiguous, the derived conclusion is garbage. However, this is preferable to a logically inconsistent conclusion.
  *   **Why this is #1:** It is the only theoretical fix for the specific paradox you identified that is also engineering-simple. It moves the complexity from the aggregation layer (hard to debug) to the prompt layer (easier to iterate).
  *   **Evidence to move it down:** If, after 4 weeks, you find that LLMs cannot reliably agree on the premises (e.g., <60% agreement on factual controls), PBP will yield constant deadlocks. If premises are too noisy, you may be forced to hybridize.

  ### 2. Logical Constraint Enforcement (The "Syntax" Layer)
  **Priority:** Critical | **Effort:** Medium | **Risk if Ignored:** High

  LLMs are not logic engines; they are token predictors. Even with PBP, individual agents may output a set of answers that are internally inconsistent (e.g., $P_1=$ Yes, $P_2=$ Yes, $C=$ No, despite $P_1 \land P_2 \to C$). You must enforce logical validity *per agent* before aggregation.

  *   **What breaks if you get this wrong:** You aggregate garbage. If Agent 3 says "Yes, Yes, No" (violating the logic), and you count their "No" on the conclusion (if using CBP) or their "Yes" on the premises (if using PBP), you pollute the pool with logically impossible states.
  *   **Trade-off:** Strict enforcement increases token usage and latency (you may need to force the model to retry invalid JSON/logic). However, it ensures the input to your aggregation function is well-formed.
  *   **Implementation:** Do not ask the LLM to "reason." Ask it to fill a structured schema. Use a deterministic validator (code, not LLM) to reject any agent response that violates the truth table of your policy logic before it enters the aggregator.
  *   **Evidence to move it down:** If your prompt engineering reaches >99% logical consistency on test sets without programmatic enforcement, you can relax this. (Unlikely).

  ### 3. Error Correlation & Model Diversity
  **Priority:** High | **Effort:** Medium | **Risk if Ignored:** Medium

  Standard judgment aggregation assumes voter independence (Condorcet's Jury Theorem). LLMs trained on similar corpora exhibit high error correlation. If 12 models all fail to recognize a specific obscure policy clause because it was underrepresented in their training data, a simple majority vote gives you false confidence.

  *   **What breaks if you get this wrong:** You achieve "consensus" on incorrect facts. The system appears confident but is systematically biased.
  *   **Trade-off:** Measuring and managing diversity costs engineering time. You need to track pairwise agreement rates between models.
  *   **Implementation:** Do not use 12 instances of the same model. Use a heterogeneous mix (e.g., 4 Model A, 4 Model B, 4 Model C). Track disagreement rates. If Model A and B agree 95% of the time, treat them as one vote for aggregation purposes.
  *   **Evidence to move it up:** If you observe "cascade failures" in testing where the majority agrees on a clearly wrong answer, this becomes your bottleneck.

  ### 4. Competence Weighting
  **Priority:** Low | **Effort:** High | **Risk if Ignored:** Low

  This refers to weighting votes based on historical accuracy (e.g., Model A gets 1.5 votes because it's better at security policy).

  *   **What breaks if you get this wrong:** You leave some accuracy on the table. The system works, but is suboptimal.
  *   **Trade-off:** High complexity for marginal gain. To do this defensibly, you need a ground-truth dataset to calibrate weights. In operational incidents, ground truth is often only known *after* the fact (if ever). Dynamic weighting introduces opacity: "Why did the system rollback?" "Because Model X had a higher weight." This is harder to explain than "Because 8/12 agents saw the control was missing."
  *   **Decision:** **Defer to Quarter 2.** Start with unweighted majority on premises. Only introduce weighting if you have a validated benchmark set and the unweighted system fails specific accuracy thresholds.
  *   **Evidence to move it up:** If you build a golden test set and find that one model family consistently outperforms others by >20% on your specific policy questions.

  ### 5. Strategic Manipulation
  **Priority:** Ignore | **Effort:** N/A | **Risk if Ignored:** None

  You listed "strategic manipulation by agents that learn how their answers get combined."

  *   **Why Ignore:** Unless you are fine-tuning your agents via Reinforcement Learning (RL) *specifically on the aggregation outcome*, your LLMs are stateless inference engines. They do not have utility functions, they do not remember past votes, and they cannot "game" the system to maximize a reward. They are functions, not players.
  *   **Exception:** If you implement an RL loop where the model is rewarded based on whether its vote matched the final aggregated decision, you create a feedback loop that encourages sycophancy. **Do not do this.**
  *   **Decision:** Remove this from the roadmap entirely. It is a solution to a game-theoretic problem that does not exist in your architecture.

  ---

  ### Summary of Execution Plan (2 Quarters)

  | Quarter | Focus | Deliverable |
  | :--- | :--- | :--- |
  | **Q1** | **PBP + Enforcement** | Hard-coded logical dependency graph. Agents output premises only. Code derives conclusion. Validator rejects logically inconsistent agent outputs. |
  | **Q2** | **Diversity + Calibration** | Heterogeneous model deployment. Dashboard tracking pairwise agreement rates. (Weighting only if Q1 metrics fail). |

  ### The "Defensible" Argument
  When an auditor asks why you rolled back production:
  *   **Bad Answer (CBP):** "7 out of 12 models said we should rollback." (Auditor: "Why?")
  *   **Good Answer (PBP):** "Our policy states if Control X is missing AND Policy Y is violated, we rollback. 9 out of 12 models confirmed Control X was missing. 8 out of 12 confirmed Policy Y was violated. The system deterministically applied the policy logic to these aggregated facts."

  This shifts the defense from the *opacity of the models* to the *transparency of the policy*, which is where you want to be.
