  *(Self-Correction on "Inherent Safety"):* In PS, Inherent Safety is about the *process chemistry/physics* (e.g., substitute water for solvent). In AI, Alignment is about the *math/weights*. It's not exactly the same. Alignment is more like "Design for Safety" than "Inherent Safety." However, the user asked to map Alignment -> Inherent. I will follow the instruction but note the friction. Actually, "Inherent Safety" in AI is often "Don't build the dangerous capability." Alignment is "Make the dangerous capability safe." That's more like "Engineered Safety." Wait, the user said: "Alignment people who want to make the model itself want the right things." That is internal. In PS, "Inherent" is internal to the process. "Control" is external. So the mapping holds *structurally*, even if the mechanism differs. I will stick to the user's mapping but clarify the nuance.

  *(Refining "Deceptive Alignment"):* This is effectively a "Hidden Systematic Failure" that manifests only under specific "Process Conditions" (deployment vs training). In PS, we call this a "Design Error" not caught by HAZOP. But the *reason* it wasn't caught is because the system hid it. That's the new part.

