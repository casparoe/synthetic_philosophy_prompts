  3. On your extrinsic account, a cognition is veridical only once the activity it prompts succeeds, but what about theoretical claims that generate no testable action? If you argue that even theoretical understanding implies a disposition to act, does this not collapse truth into pragmatic utility rather than correspondence?

  4. You pick out a reliable speaker (*āpta*) based on their virtue and knowledge, but don't you need prior testimony to identify those traits without circularity? If you concede we have a default trust mechanism, is your position not just Thomas Reid dressed in Sanskrit vocabulary rather than a distinct epistemic foundation?

  5. The *gavaya* case looks like testimony plus perception plus a similarity judgement, so why keep comparison basic while reducing *arthāpatti* and *anupalabdhi*? If you maintain it requires a unique causal instrument, what exactly would have to be true about a candidate fifth *pramāṇa* for you to admit it?
