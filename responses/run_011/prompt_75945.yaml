      *   *Fails:* When the dispute relies on specialized models, assumptions, or data selection (like the rainfall record cutoff) that are invisible to a layperson. This is "epistemic closure" – the experts are speaking a language only they understand.
      *   *Key Concept:* "Motte-and-Bailey" arguments or "Garden of Forking Paths" in data analysis. The rainfall example is a classic case of data selection bias hidden within technical jargon.

  4.  **Analyze the "Type of Claim" Question:**
      *   *Falsifiable by Layperson:* Observable facts, logical contradictions, adherence to explicit codes/standards (if accessible).
      *   *Unfalsifiable by Layperson:* Model inputs, statistical assumptions, hydraulic modeling parameters, future predictions.
      *   *Distinction:* Is the dispute about *what happened* (facts) or *what the model says happened* (interpretation)?

  5.  **Analyze the "What to do with Budget" Question:**
      *   *Constraint:* Can't afford to hire a statistician/engineer for everything.
      *   *Goal:* Mediation preparation.
      *   *Strategy:* Don't try to win the technical war. Win the credibility war. Use the one finding (the rainfall data cutoff) as a wedge to question overall competence/integrity. Focus on *process* errors rather than *calculation* errors.
      *   *Action:* Hire a neutral third-party expert for a limited scope review (just the critical assumptions), or use the known error to force settlement.
      *   *Better Action:* Use the "data cutoff" finding as leverage. It proves one side is either incompetent or dishonest. Focus mediation on *why* that wasn't disclosed.
      *   *Budget allocation:* Don't pay for full rebuttals. Pay for a "shadow expert" to identify the 2-3 key assumptions that drive the outcome (like the rainfall number), then attack those. Or, use the finding to push for a settlement conference where the threat of exposing the data manipulation is the lever.

  6.  **Synthesize the Reasoning:**
      *   *Adversarial System Limitation:* It assumes equal footing. When knowledge is asymmetric, the side with the more complex obfuscation wins, not the side with the truth.
      *   *The "Black Box" Problem:* You can't verify the inputs, only the outputs. The rainfall example proves inputs are hidden.
      *   *Budget Strategy:* Stop trying to understand the math. Start auditing the *assumptions*. Use the statistician's finding as a precedent: ask your lawyer to demand raw data sources for all key variables, not just conclusions. If they refuse or stall, that's leverage.
