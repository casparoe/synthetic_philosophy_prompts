      *   *Reasoning Section 2 (Type of Claim):* Distinguish between observable facts (falsifiable) and model dependencies (unfalsifiable to laypeople).
      *   *Reasoning Section 3 (Budget/Mediation):* Advise against trying to win the technical war. Use the rainfall finding to attack credibility. Hire a neutral expert for a limited "assumptions audit" rather than full rebuttals. Focus mediation on transparency.

  8.  **Refining the Tone:**
      *   Direct, analytical, authoritative.
      *   Avoid restating the story (e.g., don't say "You have a duplex...").
      *   Ensure the advice is concrete.

