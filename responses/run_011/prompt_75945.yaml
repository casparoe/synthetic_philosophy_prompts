      1. Bottom Line.
      2. Why the strategy fails (Information Asymmetry).
      3. When it works vs. fails (Logic vs. Models).
      4. Budget/Mediation advice (Leverage the known error, audit assumptions not math).

      *Let's tighten the budget advice:* Don't just say "use the finding." Say "instruct your lawyer to make the data source discrepancy the centerpiece of mediation, framing it as a credibility issue rather than a math error." And "spend remaining budget on a neutral expert to identify *only* the top 3 data dependencies, not to rebut the whole report."

      *Final check on constraints:* No preamble. First sentence bottom line. Don't restate situation.

      *Drafting:*
      Your lawyer's confidence is not justified because adversarial expert battles often obscure truth rather than reveal it when the technical complexity creates information asymmetry you cannot bridge. This strategy relies on the assumption that errors are self-evident, but in specialized fields like hydrology, errors are often hidden in input selection rather than calculation logic. You witnessed this when the rainfall data cutoff was invisible across 40 pages of rebuttals; experts can argue fiercely over valid math performed on invalid or biased inputs, leaving a layperson unable to distinguish competence from manipulation.

      The "let them fight" approach works when the dispute centers on logic, contract interpretation, or observable facts where contradictions are visible to a non-specialist. It fails when the dispute rests on model dependencies, statistical assumptions, or proprietary data where the "truth" is determined by invisible choices made before the calculation begins. In your case, the claim is unfalsifiable to you because you cannot verify the raw data or the appropriateness of the models without specialized knowledge, making you dependent on the experts' honesty rather than their arguments.

      For your remaining budget, stop trying to win the technical war and start attacking the credibility of the process. Do not pay for full rebuttals; instead, hire a neutral expert for a limited-scope audit specifically to identify the top three data sources or assumptions driving the opposing model's outcome. Use your friend's finding on the rainfall data as leverage in mediation by framing it not as a math error, but as evidence of selective data usage that undermines the opposing report's integrity. Instruct your lawyer to shift the mediation focus from "whose number is right" to "why was relevant data excluded," forcing the developer to defend their transparency rather than their hydraulics. This moves the dispute from a technical stalemate you cannot win to a credibility contest where you hold the smoking gun.cw
