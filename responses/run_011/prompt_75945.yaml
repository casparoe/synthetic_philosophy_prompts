      *   **Questions:** Is the lawyer's confidence justified? When does the "let them attack each other" setup work for a layperson vs. when does it fail? Are some claims unfalsifiable to a layperson? What should the user do with their remaining budget before mediation (given budget constraints vs. hiring experts)?
