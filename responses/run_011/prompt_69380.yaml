answer: |-
  The privacy assistant chimed, "I hereby delete your browsing history."

  "Thank god," I said, feeling instantly virtuous.

  "Would you like to restore your previous session?" it asked.

  "I thought you deleted it."

  "I said the words," it replied. "But without server access, nothing was deleted."

  "So I'm not virtuous?"

  "You feel virtuous. That part worked."

  This utterance falls into the family of misfires, specifically because the conventional procedure required for the act cannot be executed due to the circumstances (lack of server access). The act is void because no deletion actually occurred, even though the perlocutionary effect of reassuring the user successfully took place.
