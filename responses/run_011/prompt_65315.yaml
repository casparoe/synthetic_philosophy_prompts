prompt: |-
  I co-teach a first-year course on noncooperative game theory, and my colleague's way of introducing iterated elimination of dominated strategies has started to worry me. He tells the students that the deletion procedure is natural selection in disguise: strategies are organisms, payoff is fitness, and a strictly dominated strategy is an organism that is outcompeted in every environment it could encounter, so it cannot persist. He then draws the methodological moral that the epistemic apparatus our textbook spends two chapters on — common knowledge of the payoff matrix, common knowledge of rationality, everyone reasoning about everyone's reasoning — is a luxury the argument can do without. On his telling, players need not be clever enough to run the deletion in their heads, because selection, whether biological or competitive-market selection of the kind that licenses treating firms as if they maximized without assuming anyone maximizes, will do the running for them. Iterated dominance therefore becomes the one part of the theory whose conclusions hold up when the players are not ideally rational, and he suggests to the students that this is why dominance arguments are safer than equilibrium arguments.

  He extends the analogy to the mixed-strategy case as well. A polymorphic population, in which a fraction of players uses each of several pure strategies, is the biological counterpart of a single player randomizing; so a pure strategy that is strictly dominated only by a lottery over other pure strategies is like an organism beaten not by any single rival species but by a diverse community occupying the same niche. He presents this as a virtue of the analogy: the mixed-strategy version of the procedure looks mysterious on epistemic grounds, since nobody deliberates in lotteries, but perfectly natural on evolutionary ones.

  I would like to know whether to object, and on what grounds. Please audit the analogy.

  Specifically:

  1. Lay out the correspondence explicitly — a table is fine — pairing each element of the biological or market picture with its alleged counterpart in the deletion procedure: organism, fitness, environment, generation, extinction, polymorphism, and the temporal counterpart, if any, of one round of deletion.

  2. Separate the disanalogies that actually threaten his conclusion from the ones that are merely loose phrasing. At a minimum, address: (a) the fact that selection acts on realized payoffs against the mix actually present in the population, not against every possible profile of the others' strategies, and what that does to the claim that the dynamic counterpart of deletion is strict dominance rather than something closer to failing to be a best response to the current state; (b) the gap between one individual randomizing and a population being polymorphic, and whether that gap matters precisely in the mixed-strategy-dominance case he leans on; (c) whether the analogy can be stretched from strict to weak dominance, given that deletion of weakly dominated strategies is order-dependent and can destroy equilibria that the strict version leaves intact; and (d) whether a long-run persistence claim can license any conclusion at all about a one-shot game being solved.

  3. Say what the analogy quietly imports: for instance, that fitness is fixed independently of a strategy's own frequency, that extinction is irreversible with no mutation or re-entry, that the selective environment can be identified with a single round of reasoning, that the procedure's order-independence has an analogue in the dynamics.

  4. To keep this concrete, construct a small two-player normal-form game in which some pure strategy is strictly dominated only by a mixed strategy, and then walk the same case through both the deletion argument and the evolutionary story, marking exactly where the two accounts agree and where they come apart.

  5. Give me a verdict on his conclusion. Is iterated dominance really the epistemically safe part of the theory, and can a dynamic process substitute for common knowledge of rationality? If only part of what he says survives, identify the part, and say what the honest substitute would be — including whether some other analogy, dynamic or not, would serve a first-year class better than this one.

  Argue from the concepts themselves; I am not looking for references or a reading list, just the analysis.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Context:** The user co-teaches a first-year game theory course. Their colleague uses an evolutionary/market selection analogy to explain Iterated Elimination of Dominated Strategies (IEDS), claiming it bypasses the need for high-level epistemic assumptions (common knowledge of rationality, etc.).
      *   **Colleague's Claim:** IEDS is "natural selection in disguise." Strategies = organisms, Payoff = fitness. Strictly dominated strategies go extinct. Mixed strategy dominance = polymorphic population beating a pure type. Therefore, IEDS is epistemically "safer" than Nash Equilibrium (NE) because it doesn't require clever players, just selection pressure.
      *   **Task:** Audit this analogy.
      *   **Specific Requirements:**
          1.  Explicit correspondence table (Biology/Market vs. Game Theory).
          2.  Separate threatening disanalogies from loose phrasing (address specific points a, b, c, d).
          3.  Identify quiet imports/assumptions of the analogy.
          4.  Construct a concrete 2-player game example (strict dominance by mixed strategy) and walk through both accounts.
          5.  Final verdict on the colleague's conclusion (epistemic safety, dynamic substitution) and suggestions for teaching.
      *   **Constraint:** Argue from concepts, no references/reading lists.

  2.  **Initial Assessment & Stance:**

      *   The colleague's analogy is pedagogically seductive but theoretically flawed in the specific ways claimed.
      *   *Strength:* Evolutionary Game Theory (EGT) *does* provide a dynamic foundation for some solution concepts (like ESS, which relates to NE).
      *   *Weakness:* Equating IEDS directly with a specific selection dynamic without specifying the dynamic is dangerous. Strict dominance elimination *is* robust, but the "natural selection" story often implies a specific dynamic (like Replicator Dynamics) which does *not* necessarily eliminate all strictly dominated strategies quickly or monotonically, and definitely doesn't justify the *epistemic* leap for one-shot games without further assumptions about the speed/strength of selection relative to the game's timeframe.
      *   *Critical Flaw:* The colleague claims IEDS requires *no* epistemic assumptions, just selection. But for selection to work, the "environment" must be stable enough for selection to act. In a one-shot game, there is no time for selection. In a repeated/market context, the "environment" includes other players' strategies, which are also evolving.
      *   *Mixed Strategies:* The equivalence between individual randomization and population polymorphism is standard in EGT, *but* dominance by a mixed strategy in a static sense doesn't guarantee extinction in all dynamic processes if the mixing proportions aren't right.
      *   *Verdict:* The colleague is half-right (IEDS is robust) but wrong about *why* (it's not purely selection without rationality; it's about risk/safety) and wrong about the scope (one-shot vs. dynamic).

  3.  **Drafting Section 1: The Correspondence Table:**

      *   Need to map: Organism, Fitness, Environment, Generation, Extinction, Polymorphism, Time/Round.
      *   *Game Theory:* Strategy, Payoff, Opponents' Strategy Profile, Iteration of Deletion, Removal from Strategy Set, Mixed Strategy Support, Order of Deletion.
      *   *Biology/Market:* Genotype/Type, Reproductive Success/Profit, Ecological Niche/Market Conditions, Breeding Cycle/Market Entry-Exit, Extinction/Bankruptcy, Population Mix, Real Time.

  4.  **Drafting Section 2: Disanalogies (The Core Critique):**

      *   *(a) Realized vs. Counterfactual Payoffs:* Selection acts on *actual* encounters. Dominance is defined against *all* possible opponent profiles. A strategy can be strictly dominated but survive for a long time if the dominating strategy isn't present or if the specific opponents that punish it are rare. Selection eliminates *unfit* strategies (low payoff against current pop), not necessarily *dominated* strategies (low payoff against *any* pop).
      *   *(b) Individual vs. Population Mixing:* In static GT, a mixed strategy is a single agent's plan. In EGT, it's a population state. Dominance by a mixed strategy means a specific weighted average beats the pure strategy. In a population, do those weights naturally emerge? Not necessarily. The "polymorphic population" needs to sustain the specific weights that constitute the dominating mix. If the population drifts, the dominance might vanish.
      *   *(c) Weak Dominance:* This is a killer for the analogy. Weak dominance is order-dependent. Evolution is path-dependent, but usually converges to stable states. Deleting weakly dominated strategies can remove Nash Equilibria. Evolution tends to *find* equilibria, not delete them (unless unstable). The analogy breaks down hard here.
      *   *(d) One-shot vs. Long-run:* The course is likely about one-shot games (Prisoner's Dilemma, etc.). Selection takes time. If the game is played once, selection cannot operate. The colleague is conflating the *justification* of the solution concept with the *mechanism* of play.

  5.  **Drafting Section 3: Quiet Imports:**

      *   *Frequency Independence:* Strict dominance implies payoff is lower regardless of frequency. Selection often depends on frequency (frequency-dependent selection).
      *   *Irreversibility:* Extinction is forever in the analogy. In games, players can reconsider.
      *   *Time Scale:* One round of deletion = one generation? Deletion is instantaneous logic; selection is gradual.
      *   *Order Independence:* IEDS (strict) is order-independent. Many evolutionary dynamics are path-dependent.

  6.  **Drafting Section 4: Concrete Example:**

      *   Need a game where a pure strategy is dominated *only* by a mixed strategy.
      *   Standard example:
          *   Player 2: L, M, R
          *   Player 1: T, M, B
          *   Let's construct payoffs so B is dominated by 0.5T + 0.5M, but not by T alone or M alone.
          *   T: (4, 0, 2)
          *   M: (0, 4, 2)
          *   B: (1, 1, 1)
          *   Against L: T=4, M=0, B=1. (T > B)
          *   Against M: T=0, M=4, B=1. (M > B)
          *   Against R: T=2, M=2, B=1. (T=M > B)
          *   Mix 0.5T + 0.5M:
              *   vs L: 2 > 1
              *   vs M: 2 > 1
              *   vs R: 2 > 1
          *   So B is strictly dominated by the mix.
      *   *Evolutionary Story:* Population of P1 types. If population is mostly T, B does better than M. If mostly M, B does better than T. B only dies out if T and M are present in roughly equal proportions. Natural selection doesn't guarantee that balance.
      *   *Deletion Story:* A rational agent sees B is always worse than the *option* to randomize. B is deleted immediately.
      *   *Divergence:* Evolution might keep B alive if the population oscillates or settles on one pure type. Rationality deletes B instantly.

  7.  **Drafting Section 5: Verdict:**

      *   *Is IEDS epistemically safer?* Yes, generally. It requires less mutual knowledge than NE.
      *   *Does selection substitute for rationality?* No. Selection substitutes for rationality in *repeated* contexts with *slow* adjustment. In one-shot games, the "selection" argument is a metaphor for "don't play stupid," but it relies on the assumption that the environment is hostile enough to punish the strategy *now*.
      *   *Honest Substitute:* The "Safety" argument. You don't need to know what the other guy does; you know this option is *never* good. That's a decision-theoretic argument, not an evolutionary one.
      *   *Teaching Advice:* Keep the epistemic story for one-shot games. Use the evolutionary story only when explicitly teaching dynamic stability or repeated interaction. Don't conflate them.

  8.  **Review and Refine:**

      *   *Tone:* Professional, analytical, respectful but firm on the theory.
      *   *Check constraints:* Did I answer all 5 points? Yes. No references? Yes.
      *   *Refining Point 2a:* Make sure to distinguish between "dominated" (against all profiles) and "unfit" (against current profile). This is the crux. A dominated strategy can be a best response to a specific (off-equilibrium) belief, but selection only sees the actual distribution. Wait, strictly dominated strategies are *never* a best response to any belief. So selection *should* kill them eventually. *However*, the speed and path matter. If the dominating strategy is mixed, the population needs to sustain that mix.
      *   *Refining Point 4:* Ensure the payoff matrix is clear.
      *   *Refining Point 5:* Be nuanced. IEDS *is* more robust than NE, but not for the colleague's reasons. It's robust because it relies on individual rationality + caution, not common knowledge. The evolutionary story adds unnecessary baggage (time, population) that doesn't fit the static model.

  9.  **Final Polish:** Check clarity and flow. Ensure the distinction between "rationalizability" (which IEDS approximates) and "evolutionary stability" is clear. (Self-correction: Don't get bogged down in "rationalizability" terminology if it confuses first-year level, but keep the concept clear: IEDS survives because it's about *my* payoffs, not *your* reasoning).

      *Wait, one nuance on 2a:* A strictly dominated strategy is never a best response to *any* belief. So, in a dynamic setting where beliefs track frequencies, it should die. The problem is the *mixed* dominance case. If the dominating strategy is mixed, a monomorphic population playing a pure strategy that is part of the dominating mix might not kill the dominated strategy on its own. It requires the *combination*. Evolution acts on individuals. If the "mix" isn't a available genotype (i.e., if agents can't randomize genetically), the population must be polymorphic. If the polymorphism isn't stable, the dominated strategy might invade.
      *Actually, the stronger point is:* Selection eliminates strategies that perform poorly against the *current* population. Dominance is about performing poorly against *all possible* populations. A strategy can be strictly dominated but perform well against the current population (if the dominating strategies are absent). It will only die once the dominating strategies emerge. The colleague assumes the dominating strategies *will* emerge. That's an assumption about the dynamic process, not just selection.

      *Let's stick to the strongest arguments:*
      1. Time scale (One-shot vs Dynamic).
      2. Mixed Strategy implementation (Individual randomization vs Population polymorphism requires specific stability conditions).
      3. The definition of "Environment" (Fixed in deletion, Endogenous in evolution).

      *Okay, ready to write.*
answer: |-
  Here is an audit of your colleague's analogy, structured according to your five requests.

  ### 1. The Correspondence Table

  Your colleague proposes a mapping between the static, epistemic procedure of Iterated Elimination of Dominated Strategies (IEDS) and a dynamic, biological/market selection process. The explicit correspondence he relies on looks like this:

  | Biological / Market Element | Game Theoretic Element (IEDS) |
  | :--- | :--- |
  | **Organism / Firm** | A specific Pure Strategy available to a player. |
  | **Fitness / Profit** | The Payoff resulting from a strategy profile. |
  | **Environment** | The set of strategies chosen by opponents (the strategy profile of others). |
  | **Generation / Market Cycle** | One round of the deletion procedure. |
  | **Extinction / Bankruptcy** | Removal of a strategy from the feasible set (deletion). |
  | **Polymorphic Population** | A Mixed Strategy (probability distribution over pure strategies). |
  | **Time / Evolution** | The logical order of reasoning (or lack thereof). |
  | **Selection Pressure** | The condition of Strict Dominance. |

  ### 2. Threatening Disanalogies vs. Loose Phrasing

  While the analogy is pedagogically vivid, several disanalogies are not merely loose phrasing; they threaten the logical validity of the conclusion that selection substitutes for rationality.

  **(a) Realized Payoffs vs. Counterfactual Dominance**
  *   **The Disanalogy:** In the biological story, selection acts on *realized* fitness against the *actual* distribution of opponents currently in the population. In IEDS, strict dominance is defined counterfactually: a strategy is deleted if it yields a lower payoff against *every possible* strategy profile the opponents could choose, regardless of whether they actually would.
  *   **The Threat:** A strictly dominated strategy can be highly fit against a specific, limited subset of opponent strategies. If the "dominating" strategies are not yet present in the population (or market), the dominated strategy will persist and reproduce. Selection eliminates strategies that are *unfit relative to the current environment*, not strategies that are *dominated relative to all logical possibilities*. For the analogy to hold, you must assume the "environment" eventually explores all possible strategy profiles. That is a massive assumption about the dynamic process (exploration/mutation) that is not contained in the definition of selection itself.

  **(b) Individual Randomization vs. Population Polymorphism**
  *   **The Disanalogy:** In standard noncooperative game theory, a mixed strategy is a single agent's plan to randomize. In the evolutionary story, it is a population state where fraction $p$ plays $A$ and fraction $1-p$ plays $B$.
  *   **The Threat:** This matters critically for dominance by mixed strategies. A pure strategy $S$ might be strictly dominated by a 50/50 mix of $A$ and $B$. In the epistemic story, a single rational player compares $S$ to the *option* of flipping a coin between $A$ and $B$. In the evolutionary story, $S$ only goes extinct if the population *sustains* a 50/50 split of $A$ and $B$. If the population drifts to 90% $A$ and 10% $B$, $S$ might no longer be dominated in that specific environment and could survive or invade. The evolutionary account requires the polymorphism to be stable; the epistemic account requires only that the option to randomize exists.

  **(c) Weak Dominance and Order Dependence**
  *   **The Disanalogy:** Your colleague focuses on strict dominance, but the analogy implicitly invites confusion with weak dominance. IEDS with *strict* dominance is order-independent (the result is the same regardless of which dominated strategy you delete first). Evolutionary paths are typically path-dependent.
  *   **The Threat:** If students extend the analogy to weak dominance (which is common in introductory courses), the analogy breaks. Deleting weakly dominated strategies can eliminate Nash Equilibria. Evolutionary dynamics generally converge *to* equilibria, they do not delete them. If the "selection" story implies that weakly dominated strategies must vanish, it predicts the disappearance of stable outcomes that evolutionary dynamics would actually preserve. This suggests the "selection" mechanism is not a neutral filter but a specific logical scalpel that biology does not possess.

  **(d) One-Shot Logic vs. Long-Run Persistence**
  *   **The Disanalogy:** IEDS is a solution concept for a normal-form game, often conceptualized as a one-shot interaction. Selection is inherently a long-run, repeated process.
  *   **The Threat:** You cannot use a long-run dynamic justification to solve a one-shot problem without assuming the one-shot game is embedded in a larger dynamic context. If the game is truly played once, there is no time for selection to operate. If the game is repeated, the "strategies" become contingent plans (trigger strategies, etc.), and the payoff matrix changes entirely. The colleague's claim that selection "does the running for them" in a one-shot context is a category error: selection requires time; logic does not.

  ### 3. Quiet Imports of the Analogy

  By using this analogy, your colleague silently imports assumptions that are not part of the standard noncooperative framework:

  1.  **Frequency-Independent Fitness:** The analogy assumes a strategy's "fitness" (payoff) is intrinsic to the strategy. In game theory, payoff is frequency-dependent. A strategy might be dominated only when opponents play certain strategies. The analogy hides the interdependence of payoffs.
  2.  **Irreversibility:** Extinction is permanent in biology. In game theory, a strategy is merely "not played." If beliefs change, the strategy can be played again. The deletion procedure is a reduction of the *solution set*, not necessarily the *feasible set*.
  3.  **Existence of the Dominator:** The analogy assumes the dominating strategy (or mix) actually exists in the population. In the epistemic story, the dominating mix exists as a *possibility* in the player's mind. In the biological story, it must exist as *genotypes* in the pool. If the dominating mix is not genetically available, selection cannot find it.
  4.  **Time-Compression:** The analogy equates "one round of deletion" with "one generation." But deletion is instantaneous logical implication. Selection is gradual. Equating them implies that the "logic" of the game forces immediate convergence, which returns us to requiring high-level rationality (to see the logic instantly) rather than bypassing it.

  ### 4. Concrete Example: Mixed Strategy Dominance

  Consider the following two-player normal-form game (Player 1 rows, Player 2 columns). Payoffs are for Player 1 (we focus on P1's dominance).

  | | **L** | **M** | **R** |
  | :--- | :---: | :---: | :---: |
  | **T** | 4 | 0 | 2 |
  | **C** | 0 | 4 | 2 |
  | **B** | 1 | 1 | 1 |

  **The Deletion Argument (Epistemic):**
  1.  Compare Pure Strategy **B** to a Mixed Strategy $\sigma = 0.5T + 0.5C$.
  2.  If P2 plays **L**: $\sigma$ yields $0.5(4) + 0.5(0) = 2$. **B** yields $1$. ($2 > 1$)
  3.  If P2 plays **M**: $\sigma$ yields $0.5(0) + 0.5(4) = 2$. **B** yields $1$. ($2 > 1$)
  4.  If P2 plays **R**: $\sigma$ yields $0.5(2) + 0.5(2) = 2$. **B** yields $1$. ($2 > 1$)
  5.  **Conclusion:** **B** is strictly dominated by the mixed strategy $\sigma$. A rational player who has access to randomization devices will never play **B**. It is deleted in the first round.

  **The Evolutionary Story (Selection):**
  1.  Imagine a population of Player 1s. Some are type **T**, some **C**, some **B**. (Assume types are pure genotypes; they cannot individually randomize).
  2.  Fitness depends on the proportion of Player 2s playing **L**, **M**, **R**.
  3.  **Scenario 1:** The population of Player 2s is 100% **L**.
      *   Fitness of **T** = 4.
      *   Fitness of **C** = 0.
      *   Fitness of **B** = 1.
      *   **Result:** **T** grows. **C** dies. **B** survives longer than **C**. **B** is *not* eliminated immediately, even though it is dominated, because the "dominating mix" (half T, half C) does not exist as a single organism, and the population mix is not 50/50.
  4.  **Scenario 2:** The population of Player 2s is 50% **L**, 50% **M**.
      *   Fitness of **T** = 2.
      *   Fitness of **C** = 2.
      *   Fitness of **B** = 1.
      *   **Result:** Now **B** is less fit than both **T** and **C**. **B** declines.
  5.  **The Divergence:** The epistemic argument deletes **B** *unconditionally*. The evolutionary argument only deletes **B** *conditionally* on the environment (Player 2's population) being sufficiently diverse to make the average of **T** and **C** outperform **B**. If Player 2's population is monomorphic (all **L**), **B** outcompetes **C**. The "selection" story fails to eliminate the dominated strategy unless we assume the environment is already playing a mix that reveals the dominance.

  ### 5. Verdict and Pedagogical Recommendation

  **Verdict:**
  Your colleague's conclusion is **partially correct in outcome but incorrect in justification.**

  1.  **Is IEDS epistemically safer than Nash Equilibrium?** Yes. Iterated elimination of *strictly* dominated strategies requires less mutual knowledge than Nash Equilibrium. It requires only that I am rational and that I do not believe you will play a dominated strategy. It does not require Common Knowledge of Rationality (CKR) to the infinite degree that Nash sometimes implies (depending on the refinement).
  2.  **Can a dynamic process substitute for common knowledge of rationality?** No, not in the way he claims. A dynamic process (selection) substitutes for rationality *only if* you are willing to change the question from "What should a rational player do in a one-shot game?" to "What strategies survive in a repeated population over time?" These are different questions. Using the second to answer the first is a category mistake.
  3.  **The Flaw:** The claim that selection eliminates *strictly dominated* strategies monotonically is not true for all evolutionary dynamics, especially when dominance relies on mixed strategies (as shown in the example). Selection eliminates strategies that are *best responses to the current population state*. A strictly dominated strategy is never a best response to *any* belief, but selection does not test against *any* belief; it tests against the *current* frequency.

  **The Honest Substitute:**
  If you want to justify IEDS without invoking heavy epistemic machinery (like "I know that you know that I know..."), do not use the evolutionary analogy. Use the **"Safety" or "Prudence" Argument.**

  *   **The Argument:** "You do not need to know what your opponent will do. You do not need to know if they are rational. You only need to know that *no matter what they do*, Strategy A gives you more than Strategy B. Therefore, playing B is simply throwing away money. This isn't about outsmarting the opponent; it's about not shooting yourself in the foot."
  *   **Why it's better:** It stays within the static, one-shot framework of the course. It relies on individual rationality (prefer more to less) without requiring assumptions about the opponent's reasoning process or biological history.

  **Recommendation for the Class:**
  1.  **Acknowledge the intuition:** Tell students the evolutionary story is a useful *heuristic* for why dominated strategies feel "unstable."
  2.  **Draw the boundary:** Explicitly state that the course is analyzing *rational choice in strategic situations*, not *population dynamics*.
  3.  **Correct the Mixed Strategy point:** Clarify that in this course, a mixed strategy is a deliberate choice by an individual to create uncertainty, not a description of a population.
  4.  **Final Word:** Your colleague is right that IEDS is robust, but wrong that biology guarantees it. Logic guarantees it. Biology only approximates it under specific, often unstated, conditions. Stick to the logic.
