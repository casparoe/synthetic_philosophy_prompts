answer: |-
  ### Pre-Draft Brainstorm: How This Usually Breaks

  Having sat on these panels, I can tell you where the bodies are buried. A procedure like this fails in three specific ways:

  1.  **The "Disgust Disguise":** Panelists will skip the hard work of defining a *shared value* and instead substitute their own visceral reaction. They will write "This violates community trust" when they mean "I find this person creepy." The procedure must force them to point to evidence of the value *outside* their own heads.
  2.  **The Heckler's Veto:** You mentioned the "outraged group is small and vocal." In 90 minutes, the loudest email chain looks like a groundswell. The procedure needs a firewall against mistaking volume for consensus. If five people complain but membership data shows no churn, that is noise, not disintegration.
  3.  **The "Vague Bylaw" Trap:** Your 1998 clause is a blank check. Without a step that requires linking the conduct to a *specific, operational* value, you aren't running a disciplinary hearing; you're running a popularity contest. The procedure must stop the case if the "value" cannot be articulated without using the word "trust" or "values" in the definition.

  ***

  ### The "Fabric & Function" Decision Procedure

  This is designed for a 90-minute window. It requires a scribe to fill out a **Finding Sheet** at each stage. If any stage fails, the case is dismissed immediately.

  **Stage 1: Fact & Jurisdiction (15 Minutes)**
  *   **Question:** Did the respondent do the act? Is the act covered by the bylaws (i.e., are they a member)?
  *   **Sufficient Answer:** "Yes, on the balance of probabilities." (We are not a criminal court; we don't need 'beyond reasonable doubt').
  *   **Stop Point:** If the answer is "No" or "Unclear," case dismissed.
  *   **Written Record:** A one-paragraph summary of the established facts. No adjectives (e.g., "aggressively photographed," just "photographed").

  **Stage 2: The Value Identification Test (20 Minutes)**
  *   **Question:** What *specific* co-op value does this violate? (e.g., "Economic fairness," "Safe workspace," "Transparency").
  *   **Sufficient Answer:** The panel must point to a source *other than the complaint itself*. This could be the Co-op's mission statement, a past General Meeting resolution, or a written policy.
  *   **The Devlin Check:** If the only source is "It feels wrong to us," the case stops. We are not enforcing the panel's morality.
  *   **Written Record:** Cite the specific document or precedent. If none exists, write "No established value." Case dismissed.

  **Stage 3: The Disintegration & Harm Test (30 Minutes)**
  *   **Question:** Does this conduct actively damage the Co-op's ability to function or retain its membership?
  *   **Sufficient Answer:** Evidence of tangible impact.
      *   *For Hartians:* Is there a direct victim (financial loss, harassment)?
      *   *For Devlinians:* Is there evidence the "moral fabric" is tearing (e.g., members cancelling subscriptions citing this issue, volunteers refusing shifts)?
  *   **Stop Point:** If the harm is purely hypothetical ("This *might* set a bad example") or purely internal to the complainant ("I feel unsafe" without objective corroboration), the case is dismissed.
  *   **Written Record:** List the evidence of harm. Distinguish between "Offense taken" and "Function impaired."

  **Stage 4: The Proportionality & Alternatives Check (15 Minutes)**
  *   **Question:** Is expulsion the *only* way to preserve the value/function?
  *   **Sufficient Answer:** Have we considered a warning, a temporary suspension, or mediation?
  *   **Stop Point:** If a lesser sanction works, expulsion is denied.
  *   **Written Record:** List alternatives considered and why they were rejected.

  **Stage 5: The "Public Reason" Audit (10 Minutes)**
  *   **Question:** If this reasoning were read at the General Meeting, would it hold up against a member who disagrees with the outcome?
  *   **Sufficient Answer:** Can we explain this without saying "Because we said so"?
  *   **Written Record:** The final reasoning paragraph for the membership.

  ***

  ### Distinctions: What to Keep, What to Drop

  You asked which philosophical distinctions survive simplification.

  **Keep These:**
  1.  **Disgust vs. Judgment:** Devlin argued that mere revulsion isn't enough; it must be a judgment shared by the "reasonable man." In your context: "I hate this" is not enough; "This breaks our operational model" is required.
  2.  **Empirical Disintegration:** Devlin's fear was society falling apart. For a co-op, this isn't metaphysical. It's measurable. Are people leaving? Is trade stalling? If the norm violation doesn't actually weaken the association, enforcement is gratuitous.
  3.  **The Vocal Minority:** Hart warned against the "tyranny of the majority." In a co-op, it's often the tyranny of the *active* minority. You must distinguish between "50 people emailed us" and "500 people are unhappy."

  **Drop These:**
  1.  **Positive vs. Critical Morality:** Don't ask volunteers to debate whether the community's value is *objectively* good. Ask only if it is *actually held* and *functionally necessary*.
  2.  **The "Monopoly of Force":** Devlin was arguing about criminal law and prison. You are arguing about discounts and salad bars. Drop the heavy sovereignty language. Focus on "Contractual Expectation" instead of "Social Cohesion."

  ***

  ### Edge Cases: Silence and Noise

  **When the Values Document is Silent or Contradictory:**
  If Stage 2 finds no written value, you default to **Functional Necessity**. Can the co-op operate if this behavior is universalized?
  *   *Example:* If everyone resold goods, the co-op pricing model collapses. (Expulsion defensible).
  *   *Example:* If everyone wore political shirts, the co-op still sells food. (Expulsion indefensible).
  *   *Instruction:* If silent, the burden of proof shifts entirely to Stage 3 (Harm). It must be proven high.

  **When the Outraged Group is Small and Vocal:**
  Apply the **"Churn Test"** in Stage 3.
  *   If the complainants say "People are leaving," ask for the data.
  *   If membership retention is stable, the "disintegration" argument fails.
  *   *Instruction:* Do not accept anecdotal evidence of "feeling unwelcome" as proof of disintegration. Require cancellation notices or volunteer resignations linked to the incident.

  ***

  ### Case Applications

  Here is where the procedure lands on your three hard cases.

  **1. The Reseller (Bulk-buying for markup)**
  *   **Stage 2 (Value):** "Economic Fairness" / "Member Benefit." Found in most co-op bylaws (goods for use, not resale).
  *   **Stage 3 (Harm):** If universalized, this undermines the wholesale pricing model. It creates a free-rider problem. Tangible economic harm to the collective.
  *   **Stage 4 (Proportionality):** Warning likely insufficient if they are profiting.
  *   **Verdict:** **Expulsion Upheld.**
  *   *Why:* This isn't moralism; it's economic integrity. Even a Hartian must accept that a voluntary economic association can defend its pricing model.

  **2. The T-Shirt (Political slogan on shift)**
  *   **Stage 2 (Value):** "Welcoming Environment."
  *   **Stage 3 (Harm):** Complainants say they stopped shopping. *Crucial:* Do you have data? If only 3 people complained and no one cancelled, the "Disintegration" test fails. It is offense, not harm.
  *   **Verdict:** **Case Dismissed (or Warning only).**
  *   *Why:* To expel is to enforce a moral view on politics without proof of functional damage.
  *   *The Answer You Might Hate:* If your data shows a *significant* drop in foot traffic or volunteer retention at that store directly correlated to the shirt, the procedure forces you to **Sanction**. A Hartian hates punishing speech because others are offended. But a Devlinian (and a Co-op Officer) must acknowledge that if the "product" is community, and the community is leaving, the association is harmed. If the churn is real, the procedure mandates protection of the association over the individual's expression *in that specific context*.

  **3. The Adult-Content Petition (Side income)**
  *   **Stage 2 (Value):** "Community Trust."
  *   **Stage 3 (Harm):** Is there a victim? No. Is the co-op's function impaired? Unless you are a explicitly "family-only" zone (which limits your own membership base), this is purely moral revulsion.
  *   **Verdict:** **Case Dismissed.**
  *   *Why:* This is the pure Hart/Devlin clash. The procedure blocks this because "Disgust" is not "Disintegration." Unless the petitioners show members are leaving *en masse*, you cannot expel for private conduct unrelated to co-op function.

  ***

  ### Limitations: Where This Procedure Fails

  1.  **The "Chilling Effect" Blind Spot:** The procedure protects the accused *during* the hearing, but it cannot stop members from self-censoring beforehand. The existence of the panel itself may make people afraid to wear the T-shirt or sell the eggs.
  2.  **The "Data Gap":** Stage 3 relies on evidence of harm (churn, cancellations). Small co-ops often have bad data. If you don't know *why* people leave, a panel can game the "Disintegration" claim.
  3.  **The 90-Minute Rush:** Nuance dies in 90 minutes. Panelists will rush Stage 2 (Value Identification) to get to the "fun part" (judging the person).
  4.  **The General Meeting Override:** You mentioned the membership can overturn you. This procedure makes your reasoning robust, but it cannot stop a mob. If 60% of the room hates the Adult-Content member, they will vote to reinstate the expulsion regardless of your logic. You are building a shield, not a forcefield.

  ***

  ### Confidence & Reconstruction Flags

  **Confidence in Load-Bearing Moves:**
  *   **High Confidence:** The shift from "Moral Wrong" to "Functional Harm" (Stage 3). This is the only way to make Devlin safe for liberals.
  *   **High Confidence:** The requirement for external value sources (Stage 2). This prevents the panel from becoming a moral monarchy.
  *   **Medium Confidence:** The "Churn Test." It's objective, but easily manipulated if record-keeping is poor.

  **Least Sure Element:**
  *   **The T-Shirt "Heckler's Veto" Clause.** I am least sure about the instruction to sanction if membership *actually* drops. This effectively punishes the speaker for the intolerance of the audience. It is pragmatically necessary for the co-op's survival, but philosophically ugly. It concedes too much to the Devlinian view that the "feelings of the majority" constitute a harm.

  **Reconstruction Flags (Honesty about the Philosophy):**
  1.  **Private Association vs. State:** I am applying Hart and Devlin, who were arguing about *criminal law* and the *state's monopoly on violence*, to a *private club* and a *membership card*. This is a stretch. Devlin argued the state *must* enforce morality to prevent social collapse. A co-op *choosing* to enforce morality is different; it's contract law, not sovereignty. I have treated the Co-op *as if* it were a mini-state for the sake of the analogy, but legally, you have more latitude to be illiberal than the British Parliament did.
  2.  **Devlin's "Reasonable Man":** I have simplified Devlin's "reasonable man" into "membership data/churn." Devlin believed in an intuitive moral sense. I have stripped that out and made it empirical. This is a modification of Devlin to make him palatable to a modern volunteer panel.
  3.  **Hart's Harm Principle:** Hart was concerned with individual liberty against the state. A co-op member has already consented to rules. I am using Hart as a *best practice* for culture, not a legal right. The member has no "right" to free speech in your store, but using Hart's logic keeps the culture healthy.

  **Final Word:**
  This procedure will not save you from the hard cases. It will only save you from the *lazy* cases. It forces you to write down why you are hurting someone. That friction is the only protection you have.
