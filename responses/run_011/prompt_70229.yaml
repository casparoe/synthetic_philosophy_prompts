answer: |-
  This is a sophisticated observation that cuts to the methodological core of the current debate on democratic backsliding. You are describing a rhetorical and analytical move that is distinct from the *process* of erosion (which is well-documented) and distinct from the *outcome* (autocratization). You are identifying a specific *defense mechanism* that exploits the methodology of comparative politics to immunize systemic change from critique.

  There is no single, universally settled term in the political science or legal literature that captures this specific triad: (1) incrementalism, (2) isolated comparative benchmarking, and (3) refusal of aggregate scrutiny. However, there are several "near neighbors" that capture parts of the phenomenon. Below is a systematic evaluation of those neighbors, followed by a proposed coinage, an analysis of its logical status, and a distinction between settled and contested elements of the field.

  ### I. Systematic Evaluation of Near Neighbors

  You asked for a systematic review of existing concepts. Here is how they map onto your observation, where they fit, and where they fail.

  **1. Salami Slicing / Boiling Frog**
  *   **What it captures:** These metaphors describe the *temporal strategy* of the government. They accurately depict the incremental nature of the changes and the reliance on the public's failure to react to small stimuli.
  *   **Where it stops short:** These describe the *action*, not the *argument*. A dictator can salami-slice without offering a comparative justification. Your observation is about the *discursive shield* ("France does this too"), not just the pace of the change. These terms do not account for the use of external precedents to validate internal steps.

  **2. The Sorites Paradox (Heap / Bald Man)**
  *   **What it captures:** This logical paradox explains *why* the critique is difficult. If democracy is a continuum, there is no single grain of sand whose removal turns a "heap" into a "non-heap." It validates the defender's demand for a specific threshold.
  *   **Where it stops short:** The Sorites Paradox is a problem of *vagueness*, not a political strategy. It explains the logical difficulty critics face, but it does not name the government's active deployment of comparative data to exploit that vagueness. The government is not merely relying on vagueness; they are actively populating each step with "normal" precedents.

  **3. The Fallacy of Composition**
  *   **What it captures:** This fallacy occurs when one infers that a whole has a property because its parts do (e.g., "Each brick is small, therefore the wall is small"). In your context, it would be: "Each law is democratic, therefore the system is democratic."
  *   **Where it stops short:** As you noted, defenders often *avoid* making the inference about the whole. They do not explicitly argue, "Therefore, our democracy is healthy." They argue, "You have not proven *this specific law* is undemocratic." They refuse to engage with the "whole" as a unit of analysis. Thus, they are not committing a logical fallacy of inference; they are enforcing a methodological constraint (methodological individualism) that prevents the holistic critique from being heard.

  **4. Creeping Expropriation (Investment Arbitration) / Creeping Control (Takeover Regulation)**
  *   **What it captures:** This is the legal doctrine you recalled. In investment law, "creeping expropriation" occurs when a series of state measures, each lawful or minor in isolation, cumulatively deprive an investor of their property rights. In takeover regulation, "creeping tender offers" allow an acquirer to buy shares incrementally to avoid triggering mandatory bid thresholds.
  *   **Where it stops short:** These doctrines *validate* the critic's view of the aggregate. They are legal tools designed to *pierce* the veil of incrementalism to find the substantive harm. Your observation is about the *political argument* used to *resist* such piercing. While the *structure* of the action is identical to creeping expropriation, the *rhetorical defense* you are coding relies on comparative normalcy, which is not a feature of the legal doctrine itself.

  **5. The "Frankenstate" (Kim Lane Scheppele)**
  *   **What it captures:** This is the closest existing concept in the backsliding literature. Scheppele argues that autocratic legalists create a "Frankenstate" by taking individual constitutional provisions from various successful democracies (the "parts") and stitching them together into a system that functions as an autocracy (the "monster").
  *   **Where it stops short:** Scheppele uses this to describe the *design* of the regime, not the *defense* of it. While she notes that leaders justify provisions by pointing to foreign models, there is no specific term for the argumentative move of using those models to block systemic critique.

  ### II. Proposed Coinage: "Comparative Atomization"

  Since no existing term cleanly captures the *argumentative strategy* of using isolated comparative validity to shield aggregate systemic change, I propose the term **Comparative Atomization**.

  **Definition:**
  *Comparative Atomization* is a defensive rhetorical strategy employed during institutional change, wherein a sequence of reforms is defended by benchmarking each individual measure against precedents in established democracies, while simultaneously refusing to subject the cumulative configuration of those measures to comparative or systemic scrutiny.

  **Criteria for Application:**
  1.  **Incrementality:** The changes occur in a sequence rather than a single constitutional rupture.
  2.  **Isolated Validation:** Each measure is defended on its own merits using specific external analogues (e.g., "This judicial appointment rule exists in Spain").
  3.  **Refusal of Aggregation:** When challenged on the cumulative effect, the defender insists that the critic identify which specific measure is illegitimate, rejecting the "system" as a valid unit of comparison.
  4.  **Configurational Divergence:** The resulting institutional configuration, taken as a whole, has no analogue in the democracies invoked for the individual parts.

  **Boundary Case (Exclusion):**
  *   **Included:** A government passes five laws restricting media, NGOs, and courts. Each law exists in some form in France or Germany. The government argues, "We are within European norms," and refuses to discuss the combined effect. (This is Comparative Atomization).
  *   **Excluded:** A government passes a single law abolishing elections and argues, "China has elections sometimes." (This is simple falsehood/propaganda, not atomization).
  *   **Excluded:** A government passes a suite of reforms and argues, "Taken together, these create a more efficient democracy similar to the Swiss model." (This engages with the aggregate; it is a holistic defense, not an atomized one).

  ### III. Is it a Fallacy or a Methodological Objection?

  This is the crux of your analytical problem. Is *Comparative Atomization* a logical fallacy, or is it a legitimate demand for rigor?

  **The Case for Legitimacy (The Defender's Point):**
  The defender has a valid methodological point. Comparative politics often relies on "variables-oriented" research. If Variable A (judicial terms) and Variable B (media licensing) are both within the normal range of the OECD dataset, the burden of proof *should* logically fall on the critic to explain why the combination is pathological. To demand otherwise risks allowing critics to label any reform "undemocratic" based on a holistic intuition they cannot specify. In this light, the move forces the critic to operationalize "democracy" more precisely.

  **The Case for Fallacy (The Critic's Point):**
  The move becomes fallacious when it ignores **interaction effects**. Institutions are not independent variables; they are interdependent systems. A judicial appointment rule that is democratic in a system with strong legislative oversight may be autocratic in a system with weak legislative oversight. By insisting on isolated comparison, the defender treats institutions as modular components that retain their function regardless of context. This is a **Contextual Fallacy**. If the *function* of the aggregate is to entrench power, but the *form* of the parts is standard, relying on the form to defend the function is misleading.

  **Judgment:**
  It is best understood not as a formal logical fallacy, but as a **Category Error**. It treats a *systemic property* (democratic resilience) as if it were an *aggregative property* (sum of democratic parts). It is a legitimate methodological objection *only if* the critic cannot demonstrate interaction effects. If the critic can show that Measure A + Measure B produces a veto-player configuration unknown in the cited precedents, the defense fails. Until then, the defense exploits the complexity of political systems to shift the burden of proof.

  ### IV. Settled vs. Contested Knowledge

  You asked to distinguish what is settled in the field from what is contested. This is vital because your project involves the United States, where the "backsliding" label is highly disputed.

  **Settled (Consensus among specialists):**
  1.  **Mode of Change:** It is settled that contemporary democratic decline rarely occurs via coups (rupture) but through legal, incremental channels (erosion). Levitsky and Ziblatt's *How Democracies Die* codified this.
  2.  **Use of Law:** It is settled that actors use legalistic justifications ("autocratic legalism," per Scheppele) to mask normative shifts.
  3.  **The Measurement Problem:** It is settled that measuring democracy is difficult because indices (V-Dem, Freedom House) often rely on expert surveys that can lag behind or be subject to bias, creating a reliance on "objective" institutional data which is vulnerable to the atomization defense.

  **Contested (Disputed among specialists):**
  1.  **The "Backsliding" Label:** Whether the cases you are coding (particularly the US, but also Hungary/Poland to a lesser extent now) constitute "backsliding" or "polarized pluralism" is contested. Some scholars (e.g., Roberto Foa) argue the data shows resilience; others (e.g., V-Dem Institute) argue it shows decline.
  2.  **The Normative Baseline:** There is no consensus on the "threshold" of democracy. Is it a binary (democracy/autocracy) or a spectrum? If it is a spectrum, the Sorites problem you identified is a genuine theoretical impasse, not just a rhetorical trick.
  3.  **The "Frankenstate" Claim:** While Scheppele's description is widely cited, some comparative institutionalists argue that institutional combinations are *always* unique. Therefore, claiming a configuration is "unprecedented" does not necessarily mean it is undemocratic. This is the strongest counter-argument to the critique of Comparative Atomization: *All* democracies are unique configurations; uniqueness is not proof of pathology.

  ### V. Summary Recommendation for Your Coding

  For your coding project, I recommend using **Comparative Atomization** as a descriptive variable for the *argumentative strategy*, distinct from the *institutional outcome*.

  *   **Code 1:** Does the government justify the measure by citing external democratic precedents? (Yes/No)
  *   **Code 2:** Does the government refuse to discuss the cumulative effect of multiple measures? (Yes/No)
  *   **Code 3:** Does the cumulative configuration lack a direct analogue in the cited precedents? (Yes/No)

  If all three are met, you have identified an instance of **Comparative Atomization**. This allows you to record the phenomenon without necessarily taking a stance on whether the democracy *has* ended (which is the contested part), focusing instead on the *method of defense* (which is the observable part).

  This approach respects your constraint: it acknowledges the defender's legitimate demand for specificity while capturing the structural asymmetry that makes systemic critique so difficult to sustain in real-time.
