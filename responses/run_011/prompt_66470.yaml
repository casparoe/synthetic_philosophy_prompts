answer: |-
  # Discussion Section Handout: Diagnosing "Extra" Meaning

  **The Problem:** You know the definitions. You know that a *conversational implicature* is cancellable and a *presupposition* projects. But when you look at a sentence like "She regretted eating the bagel," you might find yourself labeling everything that isn't the main verb as an "implicature" just because it feels like background noise.

  **The Fix:** Stop trying to match the sentence to a definition. Instead, perform operations on the sentence. Treat the meaning you are investigating as a variable $X$. Apply the tests below in order. Record the result (Yes/No/Weird). Match your pattern to the key at the end.

  ---

  ## The Diagnostic Tree

  **Start:** Identify the piece of meaning $X$ you are testing. (e.g., In "Dave stopped smoking," $X$ = *Dave used to smoke*).

  ### Step 1: The "But..." Test (Cancellation)
  Try to add a clause that explicitly denies $X$ without changing the original sentence.
  *Operation:* Write down: *"[Original Sentence], but [X is false]."*
  *   **A:** It sounds contradictory, bizarre, or self-defeating. (Go to **Step 2**)
  *   **B:** It sounds perfectly fine; the speaker is just clarifying. (Go to **Step 3**)

  ### Step 2: The "No..." Test (Projection)
  Take the original sentence and negate it, or put it inside a question.
  *Operation:* Write down: *"It is not the case that [Original Sentence]."* Does $X$ still feel like it is being assumed or suggested?
  *   **A:** Yes, $X$ survives the negation. (Go to **Step 4**)
  *   **B:** No, $X$ disappears or is no longer suggested. (Go to **Leaf: Literal Content**)

  ### Step 3: The "Context Swap" Test (Generalization)
  Keep the sentence exactly the same, but imagine a completely different scenario where the literal facts are true but the background story changes.
  *Operation:* Imagine a world where the specific context that prompted $X$ does not exist. Is $X$ still suggested?
  *   **A:** No, $X$ vanishes without that specific context. (Go to **Leaf: Particularized Implicature**)
  *   **B:** Yes, $X$ arises just from the words themselves, regardless of the story. (Go to **Leaf: Generalized Implicature**)

  ### Step 4: The "Different Words" Test (Detachability)
  Restate the literal facts of the sentence using completely different vocabulary, avoiding the specific trigger word.
  *Operation:* If the sentence uses "but," use "and." If it uses "regret," use "know." If it uses "even," remove it. Does $X$ vanish?
  *   **A:** Yes, $X$ disappears when you swap the word. (Go to **Leaf: Conventional Implicature**)
  *   **B:** No, $X$ sticks around even with different words. (Go to **Leaf: Presupposition**)
  *   **C:** The results are mixed or the test feels impossible to apply cleanly. (Go to **Leaf: Escape Hatch**)

  ---

  ## The Practice Items

  Read the scenario and the utterance. Identify the **Extra Content ($X$)** described in bold. Run the tests above.

  **1. The Gym Log**
  *Context:* You and your gym buddy are tracking max lifts. You are discussing Dave's bench press.
  *Utterance:* "Dave lifted 200 pounds."
  *Extra Content ($X$):* **Dave did not lift more than 200 pounds.**

  **2. The Landlord's Email**
  *Context:* A landlord is writing to a property manager about a tenant who has been warned before.
  *Utterance:* "The tenant didn't stop smoking in the unit."
  *Extra Content ($X$):* **The tenant was smoking in the unit previously.**

  **3. The Office Fridge**
  *Context:* The office cheapens out on snacks. Dave is known to be on a strict, joyless diet. Someone ate the birthday cake.
  *Utterance:* "Even Dave ate the cake."
  *Extra Content ($X$):* **Dave was unlikely to eat the cake.**

  **4. The Group Chat**
  *Context:* You are in a carpool chat. It is pouring rain. You are asking who can drive today.
  *Utterance:* "I have my license."
  *Extra Content ($X$):* **I am willing/able to drive today.**

  **5. The Houseplant**
  *Context:* You are asking your roommate what happened to the fern in the hallway.
  *Utterance:* "I killed the fern."
  *Extra Content ($X$):* **The fern is dead.**

  **6. The Apartment Hunt**
  *Context:* You are looking at listings. You find one that is very cheap but in a bad location.
  *Utterance:* "The rent is low but the location is bad."
  *Extra Content ($X$):* **There is a contrast between low rent and bad location.**

  **7. The Dinner Party**
  *Context:* A guest arrives very late. The host is annoyed.
  *Utterance:* "The door is open."
  *Extra Content ($X$):* **You should have knocked / You are late / Let yourself in.** (Depending on tone).
  *Let's specify:* The host says it to the late guest standing on the threshold. $X$ = **You should come in (or close it).**

  **8. The Weather App**
  *Context:* It has been raining for three days. You are looking out the window.
  *Utterance:* "It is still raining."
  *Extra Content ($X$):* **It was raining before now.**

  **9. The Recipe**
  *Context:* You are explaining how to open a stuck jar to a friend.
  *Utterance:* "You can open it by hitting the lid with a spoon."
  *Extra Content ($X$):* **Hitting it with a spoon is the specific/surprising method required (not just 'opening it').**
  *(Note: Compare to "You can open it.")*

  **10. The Blame Game**
  *Context:* A cookie went missing from the breakroom. Several people were present.
  *Utterance:* "SARAH ate the cookie." (Spoken with heavy stress on the name).
  *Extra Content ($X$):* **Others did not eat the cookie.**

  ---

  ## Scoring Key & Logical Map

  Do not look at the labels until you have your test results. Match your **Step 1 → Step 2/3 → Step 4** path to the profiles below.

  ### Profile A: The "Soft" Inference (Step 1B)
  *You could deny the content without contradiction.*
  *   **If Step 3A (Context Dependent):** **Particularized Conversational Implicature.**
      *   *Logic:* Cancellable + Context-Sensitive.
      *   *Matches Item:* 4 (License), 7 (Door).
  *   **If Step 3B (Context Independent):** **Generalized Conversational Implicature.**
      *   *Logic:* Cancellable + Detachable (usually) + Default.
      *   *Matches Item:* 1 (Gym Log).
      *   *Note on Manner:* If the inference relies on *how long* or *how complex* the sentence was (Item 9), it is still a Conversational Implicature, but it may fail the "Different Words" test because paraphrasing shortens the sentence. This is a known wrinkle in the tree.

  ### Profile B: The "Hard" Content (Step 1A)
  *Denying the content sounded contradictory.*
  *   **If Step 2B (Dies under Negation):** **Literal / At-Issue Content.**
      *   *Logic:* Non-Cancellable + Non-Projecting. This is part of the truth conditions.
      *   *Matches Item:* 5 (Fern). *Trap:* Students often think "killed" implies death pragmatically. It does not; it entails it.
  *   **If Step 2A (Survives Negation):** *You are in the Projecting Zone.*
      *   **If Step 4A (Vanishes on Paraphrase):** **Conventional Implicature.**
          *   *Logic:* Non-Cancellable + Projects + Detachable (Lexically tied).
          *   *Matches Item:* 3 (Even), 6 (But).
      *   **If Step 4B (Stays on Paraphrase):** **Presupposition.**
          *   *Logic:* Non-Cancellable + Projects + Non-Detachable (Fact-tied).
          *   *Matches Item:* 2 (Stop), 8 (Still).
      *   **If Step 4C (Inconsistent):** **Escape Hatch.**
          *   *Logic:* The Gricean machinery doesn't fit cleanly.
          *   *Matches Item:* 10 (Sarah). *Diagnosis:* This is **Focus/Association with Focus**. It cancels like an implicature ("Sarah ate it, and so did Tom") but projects like a presupposition ("Did SARAH eat it?" implies others didn't). It sits on the boundary of semantics and pragmatics.

  ---

  ## Instructor's Notes: The Logical Space

  You asked for the map of the logical space before the labels were applied. Here is the diagnosis of the cells in the matrix defined by **Cancellable (C)**, **Projects (P)**, and **Detachable (D)**.

  | C | P | D | Category | Diagnosis of Logical Space |
  | :--- | :--- | :--- | :--- | :--- |
  | **Yes** | **No** | **Yes** | **GCI / PCI** | **Occupied.** The standard Gricean box. PCIs differ only by requiring Context Sensitivity (a fourth dimension). |
  | **No** | **No** | **No** | **Literal** | **Occupied.** Entailments. If you can't cancel it and it dies under negation, it's truth-conditional. |
  | **No** | **Yes** | **Yes** | **Conv. Imp.** | **Occupied.** Words like *but, even, therefore*. The meaning is attached to the lexical item, not the fact. |
  | **No** | **Yes** | **No** | **Presupposition** | **Occupied.** Factive verbs, aspectual verbs (*stop, still*). The meaning is attached to the state of affairs. |
  | **Yes** | **Yes** | **Yes/No** | **Escape Hatch** | **Occupied (Rarely).** Item 10 (Focus). This combination is theoretically unstable in classical Gricean terms because projection usually implies non-cancellability. |
  | **Yes** | **Yes** | **No** | *(Empty)* | **Incoherent.** If it projects (survives negation), it is usually backgrounded. If it is backgrounded, it is typically hard to cancel. A meaning that is both easily deniable *and* survives negation *and* is tied to specific words is not a stable category in standard typologies. |
  | **No** | **No** | **Yes** | *(Empty)* | **Unstable.** If it is non-cancellable (entailed), it shouldn't vanish just because you changed the word, unless the new word doesn't entail the fact. But if the new word expresses the *same truth conditions*, the entailment must remain. |

  ### A Warning on Leaves: Presupposition vs. Conventional Implicature
  You will notice **Step 4** is the only thing separating Presupposition (Leaf B) and Conventional Implicature (Leaf A).
  *   **The Problem:** Both project. Both are hard to cancel.
  *   **The Test:** We use Detachability. *But* presuppositions are often triggered by words too (e.g., "regret").
  *   **The Honest Truth:** For a second-year course, admit that these two are siblings. The distinction is often whether the content is a precondition for the sentence having a truth value (Presupposition) or a side-comment that exists alongside the truth value (Conventional). The "Different Words" test works for *but/even* vs. *and*, but fails for *regret* vs. *know*. If the tests conflict, mark **Escape Hatch**.

  ### The Manner Wrinkle (Item 9)
  Item 9 ("by hitting...") is a **Manner Implicature**.
  *   **Cancellation:** Works ("...but you can also just twist it").
  *   **Projection:** Fails ("It's not the case that you can open it by hitting...").
  *   **Detachability:** **Fails.** If you paraphrase "You can open it by hitting..." to "You can hit-open it," the implicature (that this is the specific method) remains because the *length/complexity* carried the meaning, not just the word "hit."
  *   **Tree Behavior:** This will lead students to **Generalized Implicature**, but they may get stuck on Step 4. Tell them: If the "Different Words" test requires making the sentence significantly shorter or simpler, and the meaning vanishes *because* you simplified it, that confirms it was a Manner Implicature.
