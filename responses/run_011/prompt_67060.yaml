prompt: |-
  You're someone who works on intertemporal choice and its ethics — I want you to be able to hold both the formal side (discount functions, exponential vs hyperbolic, decomposing a social discount rate into pure impatience plus growth times the elasticity of marginal utility) and the normative side (prudence, temporal neutrality, and what it even takes for a preference to count as a bias rather than a preference).

  Context: I'm TA-ing a grad seminar session on discounting the future and two of my students have been going in circles for three weeks. One is what I'll call a prudential-impatience defender — she thinks a person's pure time preference is a genuine preference about her own life, that it carries real authority in prudence, and that calling it a "bias" just smuggles in the temporal-neutrality standard it's supposed to establish. The other is a committed Parfitian — he thinks pure time preference is an artifact of how the future gets represented (vividness, proximity, the felt presence of the reward) and not a response to anything reason-giving about the goods themselves, so a calm, fully informed agent would discount it away once she saw it for what it is.

  Think carefully, and before you draft anything, brainstorm out loud for a few paragraphs about which parts of this fight are substantive and which are just about the word "bias." I want you to come out and say explicitly which stretch of the argument you think is verbal, and why.

  Then write the document the two of them should have produced — the joint statement from a good-faith adversarial collaboration. Specifically:

  1. A numbered list of claims both could sign. I expect some to be bookkeeping (pure time preference isn't the same thing as discounting for survival risk, or for growth plus declining marginal utility, or for the chance the future good never arrives) and some to be genuinely normative. Include at least one item about the social case — the Stern/Nordhaus-style fight over the pure rate — and how much or how little it inherits from the prudential one.
  2. A disagreements table with two columns, each side's position worded so that its own advocate would accept the wording as a fair statement of her or his view. No strawmen, no loaded phrasing smuggled into the neutral column.
  3. The cruxes: the sub-questions where settling them would actually move at least one of the two. For each, name the case, experiment, or argument both would agree bears on it, and record each side's prediction in advance, pre-registration style. (If you think the past-directed asymmetry — people preferring their pains to be behind them — belongs in the cruxes, put it in there.)
  4. One item per side: something each would agree counts against their own view, stated in advance.

  Also, there's a third position I've been kicking around, and I suspect its where they'd actually land, so deal with it explicitly. Call it anchored neutrality: the agent's present gets a one-time step premium — the discount function jumps at t=0 and then goes flat — instead of a rate that compounds with distance. You're allowed to be impatient about now versus not-now, but you can't be more impatient about year 200 than year 201. Is that a real third view, or does each camp just absorb it — the impatience defender saying it's still an arbitrary premium on the now, the neutrality defender saying it's just present bias with the inconsistency surgically removed? Say which, and whether it goes into the joint statement as an agreed compromise or as a fourth disagreement.

  Two constraints. Don't give me a bibliography or a who-said-what list, and don't guess at references; the whole value here is in the formulations. And don't let either side win by fiat — if you end up thinking one of them is basically right, that's fine, but say it only after the document is drafted neutrally.

  Last thing: tell me how confident you are in the agreed-claims list in particular, flag any item you think one side might actually refuse to sign even though it looks signable at first glance, and single out the point in the whole response you're least sure of.
