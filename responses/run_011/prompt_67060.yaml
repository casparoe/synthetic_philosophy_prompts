answer: |-
  ### Brainstorming: The Substantive Core vs. The Verbal Shell

  The fight between your students looks like a classic meta-ethical stalemate, but if we peel back the terminology, much of the heat is generated by the word "bias." If "bias" is defined as "any deviation from temporal neutrality," then the Parfitian wins by stipulation, and the Impatience Defender is right to complain that this begs the question. If "bias" is defined as "a psychological malfunction that persists even under full information and calm reflection," then the Defender has room to argue that pure time preference is a feature, not a bug, of agency.

  The verbal stretch is precisely this labeling contest. When the Defender says "preference," she implies *authority* (this is what I want). When the Parfitian says "bias," he implies *error* (this is a mistake in calculation). They can agree on the math: both can accept the Ramsey decomposition ($r = \delta + \eta g$) and agree that $\delta$ (pure time preference) exists descriptively. They can even agree that $\delta$ leads to dynamic inconsistency if it's hyperbolic. The fight isn't about the function's shape; it's about the *normative weight* of the residual $\delta$ after you subtract survival risk, growth, and diminishing marginal utility.

  The substantive core is the "Reason-Giving Status of Time." Does the mere temporal location of an event provide a reason to value it less? The Parfitian says no: time is a container, not a solvent. The Defender says yes: the "present self" has a unique ontological density that fades with distance. If we strip away the word "bias" and ask, "Is a fully informed, calm agent *permitted* to value a util at $t=0$ more than a util at $t=1$ for no reason other than timing?"—that is the real disagreement. Everything else is just arguing over whether to call that permission "rational pluralism" or "indexical myopia."

  ***

  ### JOINT STATEMENT ON INTERTEMPORAL NORMATIVITY
  **Prepared by:** The Adversarial Collaboration Working Group
  **Subject:** Decomposition, Authority, and the Status of Pure Time Preference

  #### 1. Agreed Claims
  *The following propositions are accepted by both parties as true or analytically necessary for the purpose of this seminar.*

  1.  **Decomposition:** The observed social or individual discount rate ($r$) must be analytically decomposed before normative evaluation. Specifically, $r = \delta + \eta g$, where $\delta$ is pure time preference, $\eta$ is the elasticity of marginal utility, and $g$ is the growth rate of consumption. Discounting for probability of extinction, survival risk, or diminishing marginal utility is distinct from pure time preference.
  2.  **Descriptive Existence:** Human agents descriptively exhibit positive pure time preference ($\delta > 0$) even when survival risk and growth are controlled for. This is observable in revealed preference data.
  3.  **Dynamic Inconsistency:** If the discount rate is not constant over time (e.g., hyperbolic or quasi-hyperbolic discounting), agents will make plans at $t=0$ that they violate at $t=1$ without new information. Both parties agree this specific form of inconsistency is instrumentally self-defeating.
  4.  **The Social Link:** The choice of $\delta$ in social cost-benefit analysis (e.g., climate policy) cannot be simply read off from observed individual behavior. Even if individual $\delta > 0$ is prudentially valid, it does not automatically follow that a social planner should discount the welfare of future generations at that same rate, given the lack of reciprocal bargaining between generations.
  5.  **Information Sensitivity:** Pure time preference is sensitive to the vividness and representational clarity of the future. Both parties agree that as the "felt presence" of the future increases, the observed discount rate typically decreases. The disagreement lies in whether it *should* decrease to zero.

  #### 2. Disagreements Table
  *The following outlines the normative divergence. Each statement is phrased to be acceptable to its proponent.*

  | **Prudential-Impatience Defender** | **Committed Parfitian** |
  | :--- | :--- |
  | **On Authority:** Pure time preference is a constitutive element of prudence. An agent has legitimate authority to prioritize their present experiences because the "present self" is the locus of agency and phenomenological intensity. | **On Authority:** Pure time preference is a representational artifact. It arises from the fading vividness of future goods, not from a reason-giving difference in the goods themselves. |
  | **On Neutrality:** Temporal neutrality is not a requirement of rationality. A rational agent may value a good less simply because it is further away, provided this valuation is stable and reflective. | **On Neutrality:** Temporal neutrality is a requirement of rationality. If two outcomes are identical in quality and probability, their date of occurrence is morally and prudentially irrelevant. |
  | **On Bias:** Calling pure time preference a "bias" illegitimately imposes an external standard of neutrality onto a preference that is internal to the structure of caring about one's own life over time. | **On Bias:** Calling pure time preference a "preference" illegitimately grants normative authority to a cognitive limitation (the inability to fully vividly represent the non-present). |

  #### 3. The Cruxes
  *Specific empirical or thought-experimental stakes where resolution would shift credence. Predictions are pre-registered.*

  | **Crux Case / Experiment** | **Defender's Prediction** | **Parfitian's Prediction** |
  | :--- | :--- | :--- |
  | **The "Sleep" Test:** Agents are offered a painful task to be performed either immediately after waking or one week later. The delay involves unconsciousness (no experience of waiting). | Agents will still prefer to delay the pain, even across unconscious gaps. This shows the preference is about *location* in the life-stream, not the experience of waiting. | Agents will show significantly reduced discounting across unconscious gaps compared to conscious waiting. If discounting persists, it is due to habit, not reason. |
  | **The Past-Directed Asymmetry:** Agents are asked whether they prefer a great pain to have happened yesterday or next week (assuming they cannot remember the past pain). | Agents will prefer the pain to be in the past. This confirms that temporal *direction* and *location* matter intrinsically to prudence, supporting non-neutrality. | Agents should be indifferent if the pain is erased from memory. If they prefer it in the past, it is an irrational "temporal illusion" akin to loss aversion. |
  | **Social Representation:** A social planner chooses between policies affecting future generations. The planner is instructed to imagine future people as vividly as present people. | Even with vividness, the planner will assign some weight to the "present constituency." Prudence scales to politics; the current generation has a legitimate priority. | With perfect vividness and impartiality, the pure rate $\delta$ will converge to zero. Any remaining $\delta$ is discrimination against persons based on birth date. |

  #### 4. Falsifiers
  *Conditions under which each side agrees their view would be undermined.*

  *   **Defender's Falsifier:** If it is demonstrated that agents with perfect cognitive control and full phenomenological access to their future states (e.g., via advanced simulation) consistently converge on $\delta = 0$, then pure time preference is merely a cognitive limitation, not a valid prudential stance.
  *   **Parfitian's Falsifier:** If it is demonstrated that agents who adopt $\delta = 0$ suffer systematic prudential failures (e.g., inability to form projects, chronic anxiety, or failure to protect their own future basic needs) compared to those with moderate $\delta > 0$, then temporal neutrality is not a viable norm for human agency.

  ***

  ### Analysis: The "Anchored Neutrality" Proposal

  You asked about the third position: **Anchored Neutrality**. This view posits a discount function that jumps at $t=0$ (a step premium for the "Now") but is flat thereafter (no compounding impatience between $t=1$ and $t=2$).

  **Is this a real third view?**
  Formally, yes. Normatively, it is unstable. It attempts to solve the dynamic inconsistency problem (which plagues the Defender if they hold hyperbolic views) without conceding the Parfitian demand for full neutrality.

  **How the camps absorb it:**
  *   **The Defender** will likely absorb this as a "Refined Impatience" model. They will argue it captures the special ontological status of the *present moment* without endorsing the irrationality of preferring year 200 to year 201. It saves the "Now" as a unique category.
  *   **The Parfitian** will absorb this as "Surgically Removed Present Bias." They will argue that if the jump at $t=0$ is not justified by survival risk or utility curvature, it remains an arbitrary discrimination. The fact that it doesn't compound doesn't make it rational; it just makes the irrationality static rather than dynamic.

  **Placement in the Document:**
  This does **not** belong in the Agreed Claims. It is not a compromise; it is a specific structural proposal that fails to resolve the underlying normative disagreement about *why* the jump exists. It belongs in the **Disagreements** section as a "Structural Middle Ground that fails Normative Reconciliation." Both sides can agree it *exists* as a model, but they will disagree on whether it is *justified*. I recommend listing it as a footnote to Claim 3 (Dynamic Inconsistency), noting that while Anchored Neutrality resolves inconsistency, it does not resolve the authority dispute.

  ***

  ### Confidence and Flags

  **Confidence in Agreed Claims List:** **High (85%)**
  *   **Reasoning:** Claims 1, 2, and 3 are standard formal economics and psychology. Claim 5 is empirically robust.
  *   **Potential Refusal:** **Claim 4 (The Social Link).** The Prudential-Impatience Defender might balk here. If they believe pure time preference is a valid *ethical* stance for individuals, they may want to argue it *should* carry over to the social case (a la Nordhaus), rather than agreeing that the link is contested. They might view the separation of individual prudence and social ethics as a concession to the Parfitian view that individual $\delta$ is suspect. I have phrased it carefully ("cannot be simply read off"), but a hardline Defender might want to assert a stronger continuity.

  **Least Sure Point in Whole Response:**
  The **Parfitian's Falsifier** ("If agents with $\delta=0$ suffer systematic prudential failures...").
  *   **Reasoning:** A committed Parfitian might argue that even if temporal neutrality leads to prudential failure (e.g., paralysis or inability to act), that makes neutrality *difficult*, not *irrational*. They might view the "failure" as a problem of human psychology, not a strike against the normative truth of neutrality. Convincing a Parfitian that pragmatic failure counts against normative truth is philosophically thorny. They might sign it only if "prudential failure" is defined strictly as "failure to achieve one's own stated goals," but if their goal is neutrality, they won't see it as a failure.

  **Final Assessment:**
  Neither side wins by fiat in this document. The Defender secures the legitimacy of *some* present-privilege (in the Cruxes and Falsifiers), while the Parfitian secures the distinction between *description* and *justification* (in Claim 1 and 5). The Anchored Neutrality view is correctly identified as a formal fix that leaves the ethical wound open.
