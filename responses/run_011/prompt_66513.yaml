      *   *Revised Challenge:* "The Burden of Conditions." To claim a card, you must state the *conditions* of validity. If you rely on Testimony, you must prove the speaker is reliable. If you rely on Inference, you must prove the pervasion (vyāpti). Perception requires no extra conditions (mostly).
      *   *Let's simplify for 80 mins:* "Objection Phase." Opponents can raise a *bādha* (defeater). Claiming team must resolve it using *only* their allowed Pramāṇas. If they can't, card is void.

  6.  **Timeline Construction (80 Minutes):**
      *   0-10: Setup & Rules.
      *   10-35: Round 1 (Basic Claims).
      *   35-50: Round 2 (The Pivot & Challenges).
      *   50-65: Scoring & Crisis (Circularity traps).
      *   65-80: Debrief.

  7.  **Addressing the Instructor's Specific Concerns:**
      *   *Reductionism feels verbal:* The game must make it *practical*. If you can't play the card, you lose points.
      *   *Smuggling:* Referees need to catch P-only teams doing inference.
      *   *Circularity:* Testimony team trying to prove reliability using testimony.
      *   *TA Proof:* Rules must be explicit.

  8.  **Failure Modes & Refereeing:**
      *   *P-only Inference:* Saying "I see smoke" to claim "Fire." Referee must block.
      *   *Testimony Circularity:* Using a text to prove the text is reliable.
      *   *Pivot Confusion:* Upamāna vs. Śabda. Needs clear distinction rules.
      *   *Time:* 80 mins is tight. Keep rounds short.

  9.  **Structural Limitations:**
      *   Game can't capture *soteriological* goal (liberation).
      *   Game can't capture the *phenomenology* of valid cognition (anubhava).
      *   Game gamifies "truth claims" rather than "cognitive events."

  10. **Refining the Card List for the TA:**
