  3.  **Design the Game Mechanics:**
      *   **Teams:** 5 Teams (approx. 2-3 students each).
          1.  Sensationists (Perception only) - *Cārvāka-ish*
          2.  Rationalists (P + I) - *Buddhist-ish*
