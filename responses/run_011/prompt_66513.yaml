      *   *Nyāya:* Perception + Inference + Comparison + Testimony (Pratyakṣa + Anumāna + Upamāna + Śabda). (Sometimes includes Postulation/Non-apprehension, but standard Nyāya is 4).
      *   *Mīmāṃsā (Kumārila):* 6 Pramāṇas (adds Arthāpatti + Anupalabdhi).
