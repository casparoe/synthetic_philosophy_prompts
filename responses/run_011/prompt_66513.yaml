      *   **Goal:** Students must operate *inside* the framework, not just discuss it. Reductionist teams must discover limits/smuggling.
      *   **Specific Activity:** Teams assigned schools with fixed budgets of *pramāṇas* (Perception only, P+I, P+I+Comparison, P+I+C+Testimony, All 6).
      *   **Mechanic:** Earn points by licensing "Claim Cards."
      *   **Key Constraint:** Reductionist teams must find some cards unreachable or requiring smuggling.
