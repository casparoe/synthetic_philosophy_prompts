  5.  **Developing the Challenge Mechanic (The "Extrinsic Validity" Cost):**
      *   To simulate *parataḥ prāmāṇya* (Nyāya view: validity needs confirmation) vs. *svataḥ prāmāṇya* (Mīmāṃsā: validity is intrinsic until defeated).
      *   *Mechanic:* When a team plays a card, they place it face up. Any other team can play a "Defeater Token."
