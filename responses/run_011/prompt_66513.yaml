      *Actually, keep it simpler:* The Challenge Mechanic forces the *reductionist* to prove the reduction. If Testimony team plays a Testimony card, they are fine. If P+I team plays a Testimony card (reduced to Inference), they must show the Inference chain. This is where they break.
