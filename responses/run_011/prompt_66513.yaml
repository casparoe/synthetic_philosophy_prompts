answer: |-
  # Seminar Activity: The Pramāṇa Budget Game

  **Objective:** To force students to experience the *operational costs* of epistemological reductionism versus pluralism, specifically regarding the independence of testimony (*śabda*), comparison (*upamāna*), and non-apprehension (*anupalabdhi*).
  **Players:** 14 Students (5 Teams of 2–3), 1 Instructor (Head Referee), 1 TA (Scorekeeper/Timekeeper).
  **Time:** 80 Minutes.
  **Materials:** 5 School Banners, 30 Claim Cards (printed), 50 "Validity Tokens" (poker chips or slips), 20 "Defeater Tokens" (red chips), Whiteboard.

  ---

  ## 1. Team Assignments & Budgets
  Assign teams randomly or by preference. Hand each team their **School Charter** (below). This charter dictates their *admissible means* for licensing cards.

  1.  **The Sensationists (Cārvāka-ish):** Admissible: Perception (*Pratyakṣa*) only.
  2.  **The Rationalists (Buddhist-ish):** Admissible: Perception + Inference (*Anumāna*). *Testimony is reduced to Inference.*
  3.  **The Analogists (Nyāya-ish):** Admissible: Perception + Inference + Comparison (*Upamāna*). *Testimony is admitted but distinct.*
  4.  **The Traditionalists (Nyāya Full):** Admissible: Perception + Inference + Comparison + Testimony (*Śabda*).
  5.  **The Exegetes (Mīmāṃsā):** Admissible: All 6 (Adds Postulation *Arthāpatti* + Non-apprehension *Anupalabdhi*). Claims are *intrinsically valid* unless defeated.

  ---

  ## 2. The Card List (30 Cards Total)
  Cards are placed face-up in a central market. Each card has a **Point Value** (1–3) and a **Claim**. To claim a card, a team must place a Validity Token on it and state which *pramāṇa* licenses it according to their Charter.

  **Tier 1: The Observable (Value: 1)**
  *   **C1:** "There is a red mug on the table."
      *   *License:* Perception (All).
      *   *Trap:* Sensationists must not say "It is a mug" (universal), only "red patch." (Referee strictness: Allow "mug" for gameplay speed, but flag the universal issue in debrief).
  *   **C2:** "The instructor is speaking."
      *   *License:* Perception (All).
  *   **C3:** "There is no jug on the table."
      *   *License:* Non-apprehension (Exegetes only).
      *   *Reductionist Trap:* Rationalists/Traditionalists must try to license via Inference ("If there were a jug, I would see it"). Exegetes can challenge this as circular (you need to know the conditions of visibility to infer absence).

  **Tier 2: The Unobserved & Absent (Value: 2)**
  *   **C4:** "There is fire behind the hill." (Smoke is visible).
      *   *License:* Inference (Rationalists, Analogists, Traditionalists, Exegetes).
      *   *Sensationist:* Cannot claim.
  *   **C5:** "Fat Devadatta does not eat during the day."
      *   *License:* Postulation (Exegetes only).
      *   *Reductionist Trap:* Rationalists must try to license via Inference. Exegetes challenge: "You cannot perceive the eating-at-night, nor infer it without assuming the explanation first."
  *   **C6:** "The word 'gavaya' refers to a wild ox." (No one has seen a *gavaya* before).
      *   *License:* Comparison (Analogists, Traditionalists, Exegetes).
      *   *Reductionist Trap:* Rationalists must license via Testimony→Inference.

  **Tier 3: Testimony & Reliability (Value: 3)**
  *   **C7:** "Kathmandu is the capital of Nepal." (No one has visited).
      *   *License:* Testimony (Traditionalists, Exegetes).
      *   *Reductionist Trap:* Rationalists must license via Inference ("The map-maker is reliable").
  *   **C8:** "The Vedas are authoritative."
      *   *License:* Testimony (Traditionalists, Exegetes).
      *   *Reductionist Trap:* Rationalists cannot license without circularity (using Vedas to prove Vedas) or infinite regress.
  *   **C9:** "This informant is reliable."
      *   *License:* **CRITICAL CARD.**
      *   *Traditionalists:* Must use Perception/Inference (check past track record). Cannot use Testimony to prove Testimony reliability (Circular).
      *   *Exegetes:* Can claim Intrinsic Validity of the informant's speech unless a specific defeater is found.

  **The Pivot Card (Value: 5)**
  *   **C10:** "This animal in the forest is a *gavaya*." (Scenario: A forester previously told you "A *gavaya* is like a cow." You now see an animal in the forest that resembles a cow).
      *   *License:* **Contested.**
      *   *Analogists:* Claim **Comparison (*Upamāna*)**. Knowledge arises from the *memory* of the description + *perception* of the similarity.
      *   *Traditionalists:* Claim **Testimony (*Śabda*)**. Knowledge arises from the *forester's statement* itself.
      *   *Rationalists:* Claim **Inference (*Anumāna*)**. Knowledge arises from inferring the species based on the reliable speaker's mark.
      *   *Rule:* Only one team can secure the points. If Analogists and Traditionalists both bid, a **Duel** ensues (see Mechanics).

  ---

  ## 3. Game Mechanics

  ### A. The Economy
  *   **Validity Tokens:** Each team starts with 5. Placing a token on a card "licenses" it.
  *   **Earning Tokens:** Successfully defending a card against a challenge earns 1 bonus token.
  *   **Winning:** Most points from licensed cards at the end.

  ### B. The Challenge Mechanic (Extrinsic Validity)
  This simulates the Nyāya view (*parataḥ prāmāṇya*): Validity must be established by external conditions.
  1.  **Objection:** Any team may spend a **Defeater Token** (red chip) to challenge a licensed card.
  2.  **Burden of Proof:** The claiming team must demonstrate the *absence of defeaters* using **only their admissible pramāṇas**.
  3.  **The Reductionist Squeeze:**
      *   If **Rationalists** claim C7 (Kathmandu) via Inference, opponents can challenge: "What is your middle term? How do you know the map-maker is reliable without using Testimony?"
      *   If **Traditionalists** claim C9 (Reliability) via Testimony, opponents challenge: "Circularity! You are using testimony to prove testimony."
      *   If **Exegetes** claim any card, they invoke **Intrinsic Validity**. Opponents must spend *two* Defeater Tokens to challenge them. (Simulates Mīmāṃsā *svataḥ prāmāṇya*).

  ### C. The Pivot Duel (Card C10)
  1.  If both Analogists and Traditionalists bid on C10, play pauses.
  2.  **Analogists** must explain how knowledge arose *at the moment of recognition* without relying solely on the memory of the sentence. (Argument: The sentence gave the *search criteria*, the similarity gave the *knowledge*).
  3.  **Traditionalists** must explain why the *sentence itself* wasn't sufficient earlier. (Argument: The sentence gave the knowledge; the sighting is just confirmation).
  4.  **Instructor Ruling:** Award points based on which team successfully avoids "smuggling" the other's pramāṇa.
      *   *Referee Note:* If Analogists say "The forester told me," they lose (smuggling Testimony). If Traditionalists say "I saw the similarity," they lose (smuggling Comparison).

  ---

  ## 4. Minute-by-Minute Timeline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute Charters. Explain Tokens. TA places Cards in Market. |
  | **10–30** | **Round 1** | **Acquisition.** Teams grab Tier 1 & 2 cards. No challenges yet. Focus on budget limits. Sensationists will realize they can't touch Tier 2. Rationalists will hoard Inference cards. |
  | **30–45** | **Round 2** | **The Challenge.** Challenges enabled. Teams target Testimony/Inference cards. Watch for circularity on C9 (Reliability). |
  | **45–55** | **The Pivot** | **Card C10.** Forced contest. Analogists vs. Traditionalists. Instructor moderates the duel. |
  | **55–65** | **Crisis** | **Bankruptcy.** Teams run out of tokens or cards. Rationalists struggle to license C7/C8 without circularity. Exegetes dominate Tier 3 but spend heavily. |
  | **65–80** | **Debrief** | Map game moves to theory. (See below). |

  ---

  ## 5. Debrief Plan (Mapping Game to Theory)
  Do not summarize the theories. Ask questions that map their gameplay struggles to the philosophical stakes.

  1.  **The Reductionist Cost (Rationalists):** "Team 2, you tried to claim C7 (Kathmandu) via Inference. What was your middle term? Did you find yourself needing to assume the reliability of the source *before* you could infer the fact? Does that mean Testimony isn't just Inference?"
      *   *Target:* Show that reducing *Śabda* to *Anumāna* requires a prior validation of the speaker that is difficult to secure without *Śabda*.
  2.  **The Circularity Trap (Traditionalists):** "Team 4, on C9 (Reliability), why couldn't you use Testimony? What does this say about the foundation of testimonial knowledge?"
      *   *Target:* Nyāya's requirement for extrinsic validation of the speaker vs. Mīmāṃsā's intrinsic validity of speech.
  3.  **The Pivot (Analogists vs. Traditionalists):** "On the *Gavaya* card, Team 3 said the knowledge came from *seeing the similarity*. Team 4 said it came from *the forester's word*. If Team 4 is right, why did you need to go to the forest? If Team 3 is right, did the forester's word do any epistemic work?"
      *   *Target:* The distinct causal role of *Upamāna* (linking name to description via similarity) vs. *Śabda* (conveying the relation directly).
  4.  **The Absence (Exegetes):** "Team 5, you claimed 'No Jug' via Non-apprehension. Team 2 tried to claim it via Inference. What is the practical difference?"
      *   *Target:* Is absence a positive object of knowledge (Anupalabdhi) or just a failure to perceive (Inference)?
  5.  **The "Verbal" Question:** "At the start, some of you thought the number of pramāṇas was just a labeling dispute. Did anyone run out of tokens because their 'labels' didn't match the 'reality' of the card? Which school had the most efficient budget?"

  ---

  ## 6. Predictable Failure Modes & Refereeing Guide
  *TA Instructions: Intervene immediately if these occur.*

  **1. The Sensationist Smuggle (Team 1)**
  *   **Failure:** They claim "There is fire" because they see smoke.
  *   **Referee Call:** **Void.** "You perceive smoke. Fire is unperceived. You need Inference. You do not have Inference."
  *   **Why:** Forces them to feel the poverty of strict empiricism. They should only claim direct sensory data.

  **2. The Testimony Circularity (Team 4)**
  *   **Failure:** They claim "The Informant is Reliable" because "The Informant said so" or "The Text says he is reliable."
  *   **Referee Call:** **Challenge Upheld.** "You are using *Śabda* to validate *Śabda*. This is *anyonyāśraya* (mutual dependence). You must use Perception (past track record) or Inference."
  *   **Why:** Simulates the Nyāya demand for extrinsic validation of sources.

  **3. The Pivot Confusion (Team 3 & 4)**
  *   **Failure:** Both teams argue the exact same point ("The forester said it").
  *   **Referee Call:** **Stop.** "Team 3 (Analogists), you must cite the *memory of the description* meeting the *perception of the object*. Team 4 (Traditionalists), you must cite the *competence of the speaker* conveying the *relation*."
  *   **Why:** Forces the distinction between knowing *what* to look for (Testimony) and recognizing *that* it matches (Comparison).

  **4. Time Overrun**
  *   **Failure:** The Pivot Duel drags on.
  *   **Referee Call:** Cut off at 10 minutes. Award points based on who identified the *causal mechanism* of knowledge more accurately.
  *   **Why:** The debrief is more important than the winner.

  ---

  ## 7. Structural Limitations (Instructor Note)
  *Be honest about these in the final 5 minutes.*

  1.  **Soteriology:** The game treats *pramāṇas* as tools for scoring points (truth claims). In the actual traditions, they are tools for *liberation* (mokṣa). Getting the "Kathmandu" card right doesn't save your soul; realizing the self does. The game misses the *stakes*.
  2.  **Phenomenology:** The game treats cognition as a transactional "claim." It cannot reproduce the *anubhava* (experiential feel) of a valid cognition vs. a memory or doubt. Students are arguing *about* knowledge, not *experiencing* the constraints of cognition.
  3.  **The "Intrinsic" Advantage:** In the game, the Exegetes (Mīmāṃsā) have a mechanical advantage (harder to challenge). In reality, *svataḥ prāmāṇya* is a philosophical burden, not a shield. It requires defending why error is possible if validity is intrinsic. The game simplifies this to a "token cost."
  4.  **Social Dynamics:** Real testimony relies on social trust and community (*sampradāya*). The game isolates teams, making testimony look like a data transfer rather than a social bond.

  ---

  ## 8. TA Quick-Reference Sheet

  *   **Perception:** Direct sensory contact. No universals, no absences, no causal links.
  *   **Inference:** Based on pervasion (*vyāpti*). Requires a middle term. Cannot establish reliability without prior observation.
  *   **Comparison:** Linking a name to a description via similarity. Requires prior description + current perception.
  *   **Testimony:** Reliable speaker. Cannot prove own reliability.
  *   **Postulation:** Explaining an anomaly (Fat Devadatta).
  *   **Non-apprehension:** Knowing absence directly (No jug).
  *   **Challenge Rule:** If a team cannot explain *how* they know without using a banned *pramāṇa*, they lose the card.
  *   **Pivot Rule:** Analogists = Similarity recognition. Traditionalists = Speaker competence. Do not let them merge.

  **Setup Checklist:**
  *   [ ] Print 5 School Charters.
  *   [ ] Print 30 Cards (cut out).
  *   [ ] Prepare 50 White Tokens, 20 Red Tokens.
  *   [ ] Whiteboard for Scorekeeping.
  *   [ ] Timer set for 10-min intervals.
