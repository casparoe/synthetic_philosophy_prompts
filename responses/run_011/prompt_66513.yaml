          *   *Correction based on prompt:*
              1.  Perception Only.
              2.  Perception + Inference.
              3.  P + I + Comparison.
              4.  P + I + C + Testimony.
              5.  All 6 (adds Postulation + Non-apprehension).
      *   **Currency:** "Pramāṇa Tokens" (PTs).
      *   **Cards:** Claims with point values based on difficulty.
      *   **Challenge:** "Defeater Check." If challenged, the claiming team must prove no defeaters exist (simulating *parataḥ prāmāṇya* - validity established by external conditions). If they can't, they lose points. This hurts the Testimony/Inference teams more than Perception.
      *   **The Pivot Card:** Needs special rules to force the debate.

  4.  **Drafting the Card List (Iterative Process):**
      *   *Card 1 (Perception):* "There is a red apple on the table." (All teams can do this, but P-only *must* do this).
      *   *Card 2 (Absence):* "There is no jug on the table." (Needs Anupalabdhi. P+I might try to infer it, but Mīmāṃsā says no, that's Non-apprehension).
      *   *Card 3 (Testimony/Unvisited):* "Kathmandu is the capital of Nepal." (Needs Śabda. P+I must infer from reliable speaker, risking circularity).
      *   *Card 4 (Meaning):* "The word 'gavaya' refers to a wild ox." (Classic Upamāna case. Needs Comparison).
      *   *Card 5 (Reliability):* "The teacher is reliable." (Circular for Testimony team if they use testimony to prove it).
      *   *Card 6 (Postulation):* "Fat Devadatta does not eat during the day." (Needs Arthāpatti).
      *   *Pivot Card:* "This animal is a gavaya because it resembles the cow described by the forester." (Upamāna vs. Śabda).

      *Refining Licensing:*
      *   P-only: Direct sensory contact only. No universals? Let's allow basic recognition but no causal leaps.
      *   P+I: Can infer smoke from fire, but not meaning from words without prior definition.
