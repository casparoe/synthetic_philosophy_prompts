answer: |-
  **JOINT STATEMENT ON THE TEMPORAL ARCHITECTURE OF CONSCIOUS EXPERIENCE**
  **Adversarial Collaboration: The Color Phi Phenomenon**

  **Signatories:**
  Proponent A (Multiple Drafts / Heterophenomenological Framework)
  Proponent B (Global Workspace / Neural Ignition Framework)

  **Preamble**
  We, the undersigned, acknowledge a thirty-year stalemate regarding the temporal structure of conscious experience. This document represents a good-faith effort to isolate the empirical core of our disagreement from terminological friction. We agree that the Color Phi phenomenon constitutes a critical test case. We disagree on the ontology of the "moment" of experience. The following four sections delineate our common ground, our divergent descriptions, the experiments that could arbitrate between us, and the conditions under which we would abandon our respective positions.

  ***

  ### PART 1: AGREED EMPIRICAL BASELINE

  The following claims are accepted by both Proponents as factual descriptions of the stimulus, the physiology, and the behavioral output. No claim in this section presupposes a specific theory of consciousness.

  1.  **Stimulus Parameters:** The experimental setup involves two stationary light sources (Dot 1 and Dot 2) separated by a visual angle of approximately 3 to 5 degrees. Dot 1 emits light of Color A (e.g., red). Dot 2 emits light of Color B (e.g., green).
  2.  **Temporal Sequence:** Dot 1 flashes for a brief duration (e.g., 150ms). After a Stimulus Onset Asynchrony (SOA) of approximately 60 to 100ms, Dot 2 flashes for a similar duration.
  3.  **Retinal Input:** Photoreceptor activity corresponds to two discrete, stationary events. There is no physical motion stimulus on the retina, and no physical gradient of color change between the two locations.
  4.  **Standard Subject Report:** Under the conditions described in (2), a significant majority of subjects verbally report seeing a *single* dot moving from the location of Dot 1 to the location of Dot 2.
  5.  **The Color Switch Report:** Subjects further report that the moving dot changes color abruptly at the midpoint of the trajectory.
  6.  **Physical Constraint:** The light from Dot 2 (Color B) physically arrives at the eye *after* the time at which the subject reports the color change occurring (the midpoint of the motion). Therefore, the information regarding Color B is not available to the visual system at the moment the subject claims to experience the switch.
  7.  **Neural Latency:** Neural processing of the visual stimulus requires finite time. Signals from Dot 2 cannot influence neural activity associated with the processing of Dot 1 until after Dot 2 has occurred and signals have propagated.
  8.  **Report Reliability:** We agree that the verbal reports described in (4) and (5) are consistent and reproducible across subjects. We disagree on what these reports index (see Part 2).
  9.  **No Retinal Smearing:** We agree that the phenomenon is not caused by persistence of vision or retinal smearing that physically blends the two images prior to cortical processing.

  ***

  ### PART 2: MAP OF DISAGREEMENTS

  In this section, we identify the specific points of divergence. To prevent vocabulary bias, each disagreement is stated twice: once in the vocabulary of Proponent A (Multiple Drafts) and once in the vocabulary of Proponent B (Ignition).

  **Semantic Warning:** A primary source of friction is the phrase *"the content of experience at time t."*
  *   **Proponent A** holds that this phrase often lacks a determinate referent. For fine-grained timescales, there is no fact of the matter about what is experienced until a narrative is stabilized.
  *   **Proponent B** holds that this phrase has a determinate referent corresponding to the information available in the global neuronal workspace at time *t*.
  *   **Joint Assessment:** We acknowledge that a portion of our disagreement is verbal. If Proponent A insists "experience" implies a finished narrative and Proponent B insists "experience" implies workspace availability, they are defining the term differently. However, a **substantive residue** remains: Does the brain mechanism that produces the report operate via a single threshold crossing (B) or via continuous, competitive revision without a final "finish line" until the report is made (A)? The table below addresses this residue.

  | Disagreement Topic | Formulation A (Multiple Drafts) | Formulation B (Ignition / Global Workspace) |
  | :--- | :--- | :--- |
  | **1. The Ontology of the "Edit"** | The distinction between "Stalinesque" (editing before experience) and "Orwellian" (editing memory after experience) is a false dichotomy. There is no single moment of "experience" against which to measure "before" or "after." There are only multiple, parallel streams of processing, some of which influence the final verbal report. | The distinction is empirical and physiological. The "edit" (integration of Color B information) occurs either before or after the neural ignition event that marks conscious access. If it occurs before ignition, the subject consciously experiences the switch. If after, the subject consciously experiences two flashes and retrospectively misremembers motion. |
  | **2. Temporal Determinacy** | The question "What did the subject experience at millisecond *t*?" is malformed for certain intervals. Content is indeterminate until the "draft" of the narrative is fixed by the demand for a report. There is no internal clock stamping content with a precise time. | The question is well-formed. Conscious content is determinate once the ignition threshold is crossed. The brain assigns a temporal tag to the content. Even if that tag is backdated (antedated), the *assignment* of the tag is a discrete neural event that happens at a specific time. |
  | **3. The Status of the Report** | The verbal report is the final stabilization of the draft. It is not a readout of a prior, independent state called "experience." The report *constitutes* the fixation of the experience. | The verbal report is a readout of the content currently held in the global workspace. While reports can be noisy or biased, they reflect a prior state of conscious access that existed before the motor planning for speech began. |
  | **4. Neural Correlates** | Neural signatures (e.g., P3b, late frontal activity) correlate with the *reporting* of the experience, not the experience itself. Finding a neural "ignition" only proves when the brain committed to a response, not when the content was fixed. | Neural signatures (e.g., P3b, late frontal activity) mark the transition from unconscious to conscious processing. The onset of this signature is the boundary of conscious access. If the signature occurs after the Color B information arrives, the integration was conscious. |

  ***

  ### PART 3: THE CRUXES

  We have identified four potential avenues for arbitration. For each, we specify the experimental or argumentative move, and record the prediction of each Proponent. We have evaluated the resolving power of each crux.

  **Crux 1: The Inter-Stimulus Probe**
  *   **The Proposal:** Insert a third stimulus (a probe, e.g., a tone or a mask) in the interval between Dot 1 and Dot 2. Ask the subject to report on the probe *and* the color motion. If the subject reports the color switch but fails to detect the probe (or vice versa), it may isolate the window of integration.
  *   **Prediction A (Multiple Drafts):** The probe will be incorporated into the narrative draft if it is salient enough to win the competition for the report. If the probe disrupts the motion narrative, the "experience" of motion vanishes. There is no fixed window where the color switch is "already decided" independent of the probe's interference.
  *   **Prediction B (Ignition):** If the probe occurs before neural ignition, it will prevent ignition or alter its content. If ignition has already occurred for Dot 1, the probe cannot alter the conscious content of Dot 1, though it might affect memory. We predict a specific temporal window where the probe disrupts the color switch report, marking the pre-ignition phase.
  *   **Evaluation:** **High Resolving Power.** This moves the debate from retrospective report to concurrent interference. If Proponent B can identify a precise millisecond window where the probe *necessarily* alters the outcome, it supports a discrete threshold. If the effect is graded and dependent on the probe's semantic content, it supports Proponent A.

  **Crux 2: Libet-Style Backdating vs. Processing Latency**
  *   **The Proposal:** Re-evaluate the data regarding the ~500ms delay required for direct cortical stimulation to produce a sensation, which subjects date back to the stimulus onset. Is this evidence of retroactive revision (A) or a distinction between sensory processing time and conscious access time (B)?
  *   **Prediction A (Multiple Drafts):** This data proves that temporal ordering is a construct of the narrative. The brain "fills in" the timing to make sense of the sequence. It supports the view that "when" an experience happened is not a property of the experience itself.
  *   **Prediction B (Ignition):** This data reflects the time required to reach ignition threshold for weak stimuli. Stronger, external stimuli ignite faster. The "backdating" is a specific mechanism of temporal tagging that occurs *at* ignition, not a revision of a prior conscious state.
  *   **Evaluation:** **Low Resolving Power.** This relies on interpreting legacy data subject to confounding variables (attention, expectation). Both sides can accommodate the "backdating" phenomenon by adjusting their definitions of "processing time" vs. "conscious time." We recommend deprioritizing this in favor of Crux 1 and 3.

  **Crux 3: Precision of Neural Time-Locking**
  *   **The Proposal:** Use high-temporal-resolution neuroimaging (MEG or intracranial EEG) to identify the onset of the "ignition" signature (e.g., widespread frontal-parietal coherence) relative to the reported color switch.
  *   **Prediction A (Multiple Drafts):** The neural signature will correlate with the *motor preparation for the report*, not the phenomenological event. If the subject is delayed in reporting, the neural signature will shift accordingly. There will be no stable "ignition" point that precedes the report variability.
  *   **Prediction B (Ignition):** The ignition signature will occur at a fixed latency after the integration of Color B information, regardless of when the subject initiates the motor act of reporting. The signature will precede the report by a consistent margin.
  *   **Evaluation:** **High Resolving Power.** This is the most direct empirical test. If the neural event slides in time with the report decision, Proponent A is vindicated (the neural event is part of the reporting machinery). If the neural event is fixed relative to the stimulus and precedes the report decision, Proponent B is vindicated (the neural event is the experience, the report is the output).

  **Crux 4: Verbal Report as Readout vs. Reconstruction**
  *   **The Proposal:** Utilize a "no-report" paradigm (e.g., pupillometry or optokinetic nystagmus) that correlates with conscious perception without requiring a button press or verbal statement. Compare the timing of this physiological marker to the timing of the verbal report.
  *   **Prediction A (Multiple Drafts):** The "no-report" markers will show graded activity that does not align with a sharp threshold. The sharp threshold only appears when a report is demanded, because the demand forces a binary decision on a continuous process.
  *   **Prediction B (Ignition):** The "no-report" markers will show the same ignition threshold as the report conditions. Consciousness is an all-or-none broadcast that occurs regardless of whether the subject is asked to report it. The report merely reveals the pre-existing state.
  *   **Evaluation:** **Medium Resolving Power.** This depends on validating the "no-report" marker as a true index of consciousness rather than unconscious processing. If agreed upon, it isolates the "report" confound. However, Proponent A may argue the marker is still a proxy for *potential* reporting.

  ***

  ### PART 4: CONDITIONS FOR FALSIFICATION

  To ensure this collaboration is substantive, each Proponent specifies what evidence would compel them to abandon their current framework.

  **Proponent A (Multiple Drafts) Falsification Conditions:**
  I will abandon the Multiple Drafts view if:
  1.  **Irreversible Ignition:** An experiment demonstrates a neural event that (a) occurs prior to any possible memory revision, (b) is necessary and sufficient for the subject's report, and (c) fixes the content of the experience irreversibly at a specific millisecond *t*, such that no subsequent stimulus can alter the report of what was experienced at *t*.
  2.  **Dissociation of Report and Process:** It is shown that subjects can reliably discriminate stimuli (via priming or physiological markers) that they explicitly report not seeing, *and* that this discrimination shows the same temporal precision as the "ignition" event, proving that "consciousness" is not the final draft but a specific, earlier processing stage. (Essentially, if the "Cartesian Theater" turns out to be a real, physical bottleneck).

  **Proponent B (Ignition / Global Workspace) Falsification Conditions:**
  I will abandon the Global Workspace/Ignition view if:
  1.  **Absence of Threshold:** It is demonstrated that neural activity correlates with reportability in a strictly linear, graded fashion with no non-linear phase transition (ignition), and that manipulating the "ignition" signature does not abolish reportability.
  2.  **Post-Report Fixation:** It is shown that the neural correlates of the reported content are not fixed until *after* the motor planning for the verbal report has begun. If the "content" is not stable in the brain until the moment the tongue moves, the idea of a "broadcast" preceding the report is untenable.
  3.  **Incoherence of Content:** If it is proven that subjects can simultaneously hold contradictory contents in awareness without resolution (not just ambiguity, but logical contradiction) without a collapse of the workspace, the idea of a unified "global" broadcast is false.

  ***

  **Closing Statement on the "Content at Time T" Dispute**
  We explicitly note that the phrase *"the content of experience at a given time"* is the primary locus of verbal disagreement.
  *   **Proponent A** asserts this phrase has no referent in the Color Phi interval because the brain has not yet selected a narrative.
  *   **Proponent B** asserts this phrase refers to the content of the global workspace, which is determinate even if the subject cannot report it until later.

  **Residue:** Stripping away the semantics, the substantive disagreement is this: **Is the neural mechanism that produces the Color Phi report a continuous, competitive process that stabilizes only at the moment of response (A), or is it a two-stage process where a discrete state change occurs prior to the response (B)?** The experiments in Part 3 are designed to answer this specific mechanistic question, rendering the semantic debate obsolete.

  **Signed,**

  _________________________
  Proponent A

  _________________________
  Proponent B

