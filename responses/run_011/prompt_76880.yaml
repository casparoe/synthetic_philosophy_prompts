answer: |-
  This is a high-risk, high-reward lesson plan. It's pedagogically sound but operationally fragile. If the timing slips or the props fail, you'll spend 40 minutes wrestling with string while 25 students check their phones.

  Here is the design, the math, the script, and the blunt assessment of where it might blow up.

  ### The Core Math (Arbitrage Check)
  You need a Dutch Book situation. The Bookies post odds based on their specific probability model. If the bettors treat the Bookies as simultaneous markets, they can guarantee a profit because the implied probabilities sum to $< 1$ across the conflicting books.

  **The Models:**
  1.  **Bookie A (Random Endpoints):** $P(\text{Long}) = 1/3$.
  2.  **Bookie B (Random Radius):** $P(\text{Long}) = 1/2$.
  3.  **Bookie C (Random Area):** $P(\text{Long}) = 1/4$.

  **The Posted Odds (Payout includes stake):**
  *   **Bookie A:** Long pays **3:1** (Implied $P=0.33$). Short pays **1.5:1** (Implied $P=0.66$).
  *   **Bookie B:** Long pays **2:1** (Implied $P=0.5$). Short pays **2:1** (Implied $P=0.5$).
  *   **Bookie C:** Long pays **4:1** (Implied $P=0.25$). Short pays **1.33:1** (Implied $P=0.75$).

  **The Arbitrage Strategy (For the "Sharpest Table"):**
  Bet on **Long with Bookie C** and **Short with Bookie A**.
  *   Bet 1 Candy on Long @ Bookie C. (Cost 1).
  *   Bet 1 Candy on Short @ Bookie A. (Cost 1).
  *   **Total Cost:** 2 Candy.
  *   **If Long wins:** Bookie C pays 4. Bookie A takes 1. **Net Profit: +2.**
  *   **If Short wins:** Bookie A pays 1.5. Bookie C takes 1. **Net Profit: +0.5.**

  *Note:* In a 50-minute class, students won't calculate this instantly. You need to hint at it or let them discover that betting on *both* sides across different bookies feels "too good." The *existence* of Bookie C's 4:1 payout when Bookie A offers 3:1 is the signal that something is broken.

  ---

  ### Roles & Props
  **Props (Bring in 3 Kits):**
  *   **Base:** 3 Large Paper Circles (radius ~20cm) with an inscribed equilateral triangle clearly drawn in red.
  *   **Kit 1 (Endpoints):** 2 Dice, 6 Push-pins, String.
  *   **Kit 2 (Radius):** 1 Spinner (1-12), 1 Ruler, String, 1 Push-pin.
  *   **Kit 3 (Area):** 1 Box (shoebox size), Circle taped to bottom, 10 small paper wads (to throw blindly).
  *   **Currency:** ~200 pieces of candy (Skittles work best).
  *   **The Hat:** Opaque bag/hat with 3 folded papers: "Method 1", "Method 2", "Method 3".

  **Roles:**
  *   **3 Bookies:** Recruit these *before* class starts or pick 3 confident students immediately. Give them their "Model Card" secretly.
  *   **6 Tables:** Each table is a "Syndicate."
  *   **TA:** The "Pit Boss" (Timekeeper & Arbiter).

  ---

  ### Minute-by-Minute Timeline (50 Minutes)

  **00:00 – 05:00: The Hook & Setup**
  *   Hand out candy (5 pieces per student).
  *   Write on board: *"Is a random chord more likely to be Long (> triangle side) or Short (< triangle side)?"*
  *   Introduce the 3 Bookies. They stand at the front. They have **not** talked to each other.
  *   **Constraint:** Bookies must post odds for *both* Long and Short. They must accept bets from anyone.

  **05:00 – 15:00: The Market Opens**
  *   Bookies write their odds on the board (use the math above).
  *   Tables have 5 minutes to discuss and place bets.
  *   *TA Action:* Walk around. If a table is stuck, whisper: *"Have you checked if Bookie A and Bookie C agree?"*
  *   Collect bets. Bookies take the candy stakes.

  **15:00 – 20:00: The Twist (The Hat)**
  *   Announce: *"We need to settle these bets. But we haven't defined how the chord is generated. We will let fate decide the physical reality."*
  *   Bring out the 3 Kits. Briefly explain what each does (see "Assembly" below).
  *   **The Hat Draw:** Pick a student to draw the method.
  *   *Crucial Moment:* If Method 2 is drawn, Bookie A and C are technically "wrong" about the physics, but the arbitrage bettors *still win* because they hedged against the inconsistency.
  *   If Method 1 or 3 is drawn, one Bookie is "right," but the arbitrage bettors *still win*.
  *   **Lesson:** The profit came from the *contradiction*, not the truth.

  **20:00 – 35:00: The Physical Settlement**
  *   The class must assemble/operate the chosen apparatus.
  *   **Assembly Instructions (Keep it under 2 mins):**
      *   *Method 1 (Endpoints):* Roll 2 Dice (1-12 clock positions). Stick pins at those spots on the rim. Tie string between them. Measure against triangle side.
      *   *Method 2 (Radius):* Spin spinner for angle. Stick pin at center. Roll die (1-6) $\times$ 3cm for distance along radius. Stick second pin there. Tie string perpendicular to radius through that pin.
      *   *Method 3 (Area):* Stand 3 feet away. Blindfold a volunteer. Drop a paper wad onto the circle. Where it lands is the midpoint. Tie string through that point perpendicular to the radius.
  *   Run **5 Trials**. Record Long/Short on board.
  *   *Note:* 5 trials is statistically weak, but enough for a demo. If the results are "unlucky" (e.g., Method 1 yields 4 Shorts, 1 Long), acknowledge the variance. The *odds* are the lesson, not the p-value.

  **35:00 – 45:00: Payout & The "Wait, What?"**
  *   Settle bets based on the majority outcome of the 5 trials.
  *   Pay out the Arbitrage tables first. Highlight that they won *regardless* of the Hat Draw.
  *   Ask: *"Who lost money? Why?"* (Answer: You trusted a single Bookie's definition of 'Random'.)

  **45:00 – 50:00: The Debrief (Scripted)**
  *   See below.

  ---

  ### The Debrief Script (Mapping to Theory)

  **1. The Principle of Indifference (0-2 mins)**
  *"Bookie A, B, and C all used the Principle of Indifference. They all said: 'I have no reason to prefer one outcome over another, so I'll assume uniformity.' But they applied uniformity to different **parameters**. Angle vs. Distance vs. Area. The Principle of Indifference is not a magic wand; it requires you to specify **what** is indifferent."*

  **2. Parameterization (2-3 mins)**
  *"Method 1 assumed uniformity over the **circumference**. Method 2 assumed uniformity over the **radius**. Method 3 assumed uniformity over the **area**. These are mutually exclusive. You cannot be uniform over the radius AND the area simultaneously. Choosing a parameter is a physical choice, not a mathematical one."*

  **3. The "Which is Right?" Question (3-5 mins)**
  *Student will ask:* "Okay, but in the real world, which one is actually right?"
  *Your Answer:* "That is a physics question, not a math question. If I throw a straw on the floor, does it behave like Method 1, 2, or 3? We have to measure the straw's physics. If I spin a wheel, it's Method 1. If I drop a dart, it's Method 3. **Probability does not exist in the abstract.** It is a property of the *generator*. If you don't specify the generator, the question 'What is the probability?' is grammatically complete but semantically empty. It's like asking 'How far is it?' without saying 'From where?'"

  ---

  ### Failure Mode Analysis (Be Straight)

  **1. The "Probability is Subjective" Backfire**
  *   **Risk:** Students leave thinking "Math is broken, truth is whatever you believe."
  *   **Fix:** You must hammer the "Ill-Posed Problem" angle. Do not let them conclude that $1/3$, $1/2$, and $1/4$ are all "valid truths." They are valid *conditionals*. $P(Long | \text{Method 1}) = 1/3$. The paradox arises from hiding the condition.
  *   **Script:** "This doesn't mean probability is subjective. It means 'Random Chord' is a sloppy phrase. Precision eliminates the paradox."

  **2. The Assembly Black Hole**
  *   **Risk:** Students fumble with string and pins for 20 minutes. The energy dies.
  *   **Fix:** **Pre-cut the string.** Have the triangles pre-drawn. The "Assembly" should just be "Roll the dice and stick the pin." Do not let them measure things with rulers during the trial phase; use the pre-marked radius.
  *   **Guess:** With 25 people, even simple prop handling eats time. If you hit minute 30 and haven't drawn from the hat, **skip the physical trials.** Just reveal the Hat Draw and calculate the *expected* payout based on the method chosen. The physical props are flavor; the logic is the meal. Don't starve the logic to feed the props.

  **3. The Hat Draw Gimmick**
  *   **Risk:** It feels like a cheap trick. "Why did we bet if the rules were decided later?"
  *   **Defense:** That *is* the lesson. The bettors thought they were betting on a mathematical truth. The Hat revealed they were betting on a physical mechanism they hadn't identified. The "Gimmick" is the point. It forces the under-determination up one level.
  *   **Honesty:** If the Hat Draw feels dishonest, it's because in real life, the "Mechanism" is usually hidden. This makes the hidden variable visible.

  **4. The Arbitrage Math Confusion**
  *   **Risk:** Non-majors glaze over the 3:1 vs 4:1 payout logic.
  *   **Fix:** Use the candy physically. "Put 1 candy here, 1 candy there. Look: if I win here, I get 4. If I lose there, I lose 1. I still have extra." Keep it concrete.

  ### Final Advice on the "Which is Right?" Question
  When a student asks this (and they will), do not say "It depends."
  Say: **"The question was incomplete. You cannot answer 'What is the probability?' until you answer 'What is the process?' Once you fix the process, the probability is objective. The paradox proves we need more information, not that information is impossible."**

  If you let them walk away thinking "Probability is just vibes," you've taught them anti-math. If you teach them "Probability requires precise definitions," you've taught them rigor. The difference is entirely in your closing 5 minutes.

  **One last guess:** The "Random Area" (Pin Drop) is the hardest to execute fairly in a classroom (people aim subconsciously). If you can't trust the pin drop, swap Method 3 for "Pick a point on a grid overlay." It's less "physical" but more honest to the uniform distribution. Actually, stick to the pin drop but acknowledge the bias: *"Even our physical tool might be biased. This is why we define the model mathematically first."* That turns a failure into a feature.
