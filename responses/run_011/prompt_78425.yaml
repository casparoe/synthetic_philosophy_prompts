answer: |-
  Here is the theoretical breakdown of the two systems, stripped of moral ranking and focused on the underlying logic of punishment, citizenship, and state power.

  ### 1. The Norwegian Theory: The Principle of Normality
  **Core Axiom:** The state's power to punish is limited strictly to the removal of liberty. All other rights and conditions of life must remain as close to "normal" as security permits.

  **What constitutes the punishment?**
  If the cell is comfortable and rights are retained, the punishment is **coercive substitution of will**.
  *   **The Harm:** The harm is not suffering, deprivation, or pain. The harm is *autonomy deprivation*. You are physically prevented from executing your own choices about where to be. You are subject to the institution's schedule, not your own.
  *   **Why it works as punishment:** It presupposes that for a social agent, the ability to navigate the world freely is the primary good. Removing that is a significant harm regardless of the quality of the confinement. A comfortable cage is still a cage because the *exit* is controlled by the state, not the individual.
  *   **Moral Status:** This system presupposes that **citizenship is inalienable**. Committing a crime does not alter your standing as a member of the political community. You retain the right to vote, the right to health, and the right to dignity because those rights attach to the *person*, not to their law-abiding status.

  **Is it Instrumental (Recidivism) or Deontological (Rights)?**
  It is theoretically underdetermined, but structurally Deontological.
  *   **The Instrumental Case:** A pure utilitarian could argue, "We treat them well so they don't re-offend." If recidivism data showed that harsh prisons worked better, a pure utilitarian would switch to harsh prisons.
  *   **The Deontological Constraint:** The Norwegian system would *not* switch. The "Principle of Normality" is a constraint on state power, not a crime-reduction tactic. It asserts that the state *cannot* degrade a person even if doing so would lower crime. Therefore, the system strictly presupposes a moral status: prisoners are rights-bearers first, offenders second.

  **The Internal Tension: Preventive Detention**
  You noted the 21-year cap with renewable 5-year extensions for dangerousness. This is a theoretical crack.
  *   **The Logic:** The initial 21 years is **Retributive** (you pay for the crime). The extension is **Utilitarian/Risk-Based** (you are held because you are dangerous, not because you deserve more time).
  *   **The Contradiction:** This violates the "only liberty for the crime" axiom. If punishment is only for the crime committed, holding someone longer because they *might* commit a future crime treats them as a risk object, not a citizen who paid their debt. It shifts the logic from *Desert* to *Management*.

  ### 2. The American Theory: Forfeiture and Debt
  **Core Axiom:** Conviction constitutes a breach of the social contract that forfeits certain privileges of membership and creates a financial/administrative debt to the state.

  **What constitutes the punishment?**
  The punishment is **Status Degradation** and **Liability**.
  *   **The Harm:** The harm is twofold. First, **Civil Death**: You lose the standing to participate in the political community (voting) and the economy (licenses/housing). Second, **Cost Liability**: You become liable for the cost of your own containment.
  *   **Why it works as punishment:** It presupposes that membership in the community is conditional on law-abiding behavior. Breaking the law moves you from "citizen" to "debtor/enemy." The pain comes from the loss of status and the accumulation of obligation.

  **The Logic of Billing and Fees**
  Charging for phone calls, medical co-pays, and room/board relies on a **Neoliberal/Consumer Model** of justice.
  *   **The Theory:** The state is a service provider; the prisoner is a cost center. Justice requires the offender to internalize the cost of their punishment.
  *   **Coherence with Retributivism:** It is *incoherent* with pure Retributivism. In classical retribution, "doing the time" settles the account. The debt is paid in liberty. By adding financial debt and collateral consequences (housing bans, license bars) that persist *after* release, the US system argues that the account is *not* settled by time served. The debt follows the person.
  *   **The Voting Restriction:** This relies on a **Trusteeship Model** of voting. You do not have an inherent right to vote; you hold the franchise in trust for the community. A felony conviction proves you are an untrustworthy trustee, so the franchise is revoked until (and unless) the state restores your standing.

  ### 3. Requirements vs. Comfortable Fits
  Here is what each system strictly *needs* to function logically versus what is just compatible with it.

  **Norway**
  *   **Strictly Requires:**
      *   **Liberty Restriction:** Walls or protocols that prevent exit. Without this, it is not punishment.
      *   **Rights Retention:** Access to the same public services (health, education) as outsiders. Without this, the "citizenship retained" theory fails.
      *   **Proportionality:** The sentence length must correspond to the crime (Desert), not just risk.
  *   **Comfortable Fits (but not required):**
      *   **Unarmed Guards:** You could have armed guards and still retain rights. This is a cultural fit, not a theoretical requirement.
      *   **Kitchens/TVs:** These support "normality," but the theory only requires *adequacy*, not comfort. However, comfort is instrumentally useful for the "transition" goal.
  *   **Rules Out:**
      *   **Civil Death:** You cannot ban voting.
      *   **Pain Infliction:** You cannot make conditions worse than the worst conditions outside (the "principle of least restriction").

  **United States**
  *   **Strictly Requires:**
      *   **Custody:** Physical control of the body.
      *   **Legal Distinction:** A statutory mechanism to distinguish "citizen in good standing" from "convicted person."
      *   **Cost Recovery Mechanism:** A way to bill the individual (fees, fines, wage garnishment).
  *   **Comfortable Fits (but not required):**
      *   **High Security Architecture:** Barred windows and watchtowers fit the "dangerous enemy" theory, but you could have a low-security facility and still charge fees and ban voting.
      *   **Private Contractors:** The system requires cost-shifting, but not necessarily private prisons. Public prisons can also bill inmates.
  *   **Rules Out:**
      *   **Inalienable Citizenship:** You cannot assert that a felon retains full voting rights while incarcerated (in most jurisdictions).
      *   **State Responsibility for Welfare:** You cannot assume the state owes the prisoner the same standard of healthcare as a non-prisoner (hence the co-pays).

  ### 4. The Concrete Swap: What Breaks?
  If you swapped the underlying presuppositions, specific statutes and physical objects would become logically incoherent.

  **Scenario A: The US accepts "Only Liberty is Taken" (Norwegian Presupposition)**
  *   **Statutes to Repeal:** Felony disenfranchisement laws (voting must be automatic); Collateral consequence laws (occupational licensing bans must be voided upon release); "Pay-to-stay" laws (inmates cannot be billed for room/board).
  *   **Administrative Change:** Prison healthcare must be merged with Medicaid/Medicare. An invoice for a medical co-pay inside prison becomes illegal because healthcare is a right of citizenship, not a service purchased by the inmate.
  *   **Architecture:** Barred windows become incoherent. If the goal is normality, bars signal "exclusion from humanity," not just "prevention of exit." They would need to be replaced by secure but transparent materials.
  *   **Sentencing:** Indeterminate sentencing or "life without parole" becomes incoherent. If punishment is for the crime, and the crime is finite, the sentence must be finite. Preventive detention (holding for dangerousness) would require a separate civil proceeding, not a criminal sentence extension.

  **Scenario B: Norway accepts "Conviction Costs You Standing" (US Presupposition)**
  *   **Statutes to Repeal:** The Correctional Services Act's "Principle of Normality." Laws guaranteeing the right to vote for prisoners would be revoked.
  *   **Administrative Change:** The municipal doctor would be barred from treating the prisoner. A separate, lower-standard prison medical service would be required to signify the loss of status. Invoices would be generated for food and utilities.
  *   **Architecture:** The "village" layout becomes a security risk and a philosophical lie. If the prisoner is a debtor/enemy, they should be visually distinct (uniforms) and physically segregated (cells, not apartments).
  *   **Release:** The "transition" focus vanishes. Release is not a reintegration of a citizen, but a parole of a debtor who may still owe fees. The 21-year cap would likely be removed for serious crimes, as the "debt" of a murder cannot be quantified by time alone.

  ### Summary of Theoretical Divergence
  *   **Norway** treats the prison as a **temporary suspension of agency** within a continuous citizenship. The prisoner is a **client of the state** who retains rights. The tension lies in balancing *Desert* (fixed time) with *Risk* (preventive extension).
  *   **The US** treats the prison as a **transactional settlement of debt** and a **suspension of membership**. The prisoner is a **debtor to the state** who has forfeited privileges. The tension lies in claiming the debt is paid by *Time* while simultaneously collecting *Money* and restricting *Status* indefinitely.
