answer: |-
  Your diagnosis is correct, but it does not go far enough. The peace-versus-justice debate is not merely a collection of methodological errors or conflated disagreements; it is a category error disguised as a policy dispute. You have identified the symptoms—the selection bias, the measurement noise, the divergent questions—but the underlying disease is the assumption that these distinct problems can be solved within a single framework of inquiry. The debate persists not because the evidence is ambiguous, but because the question being asked implies a trade-off that does not exist in the way proponents claim, while simultaneously demanding empirical proof for claims that are fundamentally moral. To treat this as a solvable empirical puzzle is to misunderstand the nature of the conflict. You are right to suspect the question is ill-posed. It is.

  The first layer of your hypothesis, the problem of admissible counterfactuals, is the most devastating to the quantitative literature, and it warrants the strongest emphasis. The statistical studies you have read attempt to treat transitional justice mechanisms as independent variables—policy choices made by governments that can be toggled on or off to observe the effect on stability. This is methodologically naive. Amnesty is not a treatment administered to a random sample of post-conflict states; it is a symptom of state weakness or military stalemate. Prosecution is rarely a choice made in a vacuum; it is a luxury of victory or a sign of consolidated power. When a dataset codes a country as having "amnesty" and another as having "prosecution," it is not comparing two policy options available to the same actor. It is comparing a state that lacked the capacity to punish with one that possessed it.

  Consequently, the correlation between prosecution and durable democracy is likely spurious. It does not prove that trials create democracy; it proves that states capable of holding trials are already on a trajectory toward democracy. The selection bias here is not a statistical nuisance that can be corrected with better controls; it is constitutive of the phenomenon. You cannot model a counterfactual where a weak state, facing a mutually hurting stalemate, chooses prosecution over amnesty, because that choice would likely result in the collapse of the peace process itself. The data confirms the priors of the prosecution camp only because the cases where amnesty was chosen are precisely the cases where the state was too fragile to prosecute. To claim otherwise is to ignore the endogeneity of the decision. The empirical claim that prosecution causes peace is built on a foundation of survivorship bias.

  Your second point, regarding measurement, reinforces this structural flaw. Coding transitional justice mechanisms as binary or ordinal variables obscures the mechanism of action. A truth commission with subpoena powers and public naming is a fundamentally different intervention than a blanket pardon granted behind closed doors. Yet, in cross-national databases, these are often grouped under similar headings or treated as equivalent variations of "non-prosecutorial justice." This aggregation error allows both sides to claim validation. The prosecution advocate points to the failure of blanket amnesties to deter future abuse; the amnesty advocate points to the success of truth commissions in facilitating disarmament. Because the data does not distinguish between the coercive power of a subpoena and the political utility of a pardon, the statistical output is noise. It measures the label, not the function. Until the unit of analysis shifts from the "mechanism" to the specific "incentive structure" created by that mechanism, the quantitative literature will remain a mirror for preconceptions.

  However, the load-bearing wall of this debate, as you suspect, is the third point: the incommensurability of the questions being asked. This is where the debate ceases to be empirical and becomes philosophical. The quantitative literature is exclusively consequentialist. It asks: What happens next? Does violence recur? Does the regime survive? The human rights advocacy position is often deontological. It asks: What is owed? Do victims have a right to accountability regardless of the outcome? When these two camps argue, they are not disagreeing about the data; they are disagreeing about the validity of the moral claim.

  The problem is that the deontological camp has adopted the rhetoric of the consequentialists for tactical reasons. Human rights lawyers argue that prosecution deters future crime not because they are primarily convinced by the regression coefficients, but because they know that policy-makers only listen to arguments about stability. They speak the language of peace to secure justice. Conversely, the peace camp speaks the language of justice to legitimize amnesty. This rhetorical camouflage creates the illusion of an empirical debate. If the human rights advocate truly believed accountability was a moral duty independent of consequences, no amount of data showing that trials prolong war should change their position. Yet, they produce studies showing trials do not prolong war. This reveals that the empirical argument is secondary. The core disagreement is bedrock moral intuition: Is justice a tool for peace, or is peace a condition for justice? Neither side can argue for this intuition using data, because data cannot resolve conflicting first principles. To expect empirical progress on a moral divergence is to demand that numbers solve philosophy.

  So, where does this leave us? If the question is ill-posed, what is the well-posed replacement? Progress requires dissolving the single debate into two distinct inquiries that should not be conflated. The first is a narrow, mechanistic empirical question: Under what specific conditions does a specific accountability mechanism alter the incentives of combatants? This requires abandoning cross-national regressions in favor of formal modeling or within-case process tracing. We need models that specify the payoff structures for warlords facing different types of courts. Does an international warrant raise the cost of fighting enough to induce settlement, or does it remove the exit option and prolong resistance? This is a question of game theory and local context, not global averages. It accepts that the answer may vary by case and refuses to generalize from South Africa to Uganda.

  The second inquiry is moral and political, not empirical. It must explicitly acknowledge that the demand for justice is often a claim about rights, not outcomes. The well-posed question here is not "Does prosecution work?" but "Are societies willing to bear the cost of justice if it risks instability?" This reframing forces the advocacy camp to own the moral trade-off rather than hiding it behind dubious statistics. It forces the peace camp to admit that amnesty is a moral cost, not just a pragmatic necessity.

  Therefore, no progress should be expected on the current terms. The "peace-versus-justice" framework is a trap that guarantees perpetual disagreement because it demands empirical resolution to a problem that is partly methodological impossibility and partly moral conflict. The selection bias cannot be fully eliminated because we cannot randomize state collapse. The measurement problem cannot be solved because political contexts are too heterogeneous for uniform coding. And the moral divide cannot be bridged by data.

  The only productive path forward is to stop asking whether justice promotes peace. Instead, researchers should map the specific incentive effects of specific mechanisms in specific contexts, while philosophers and lawyers argue openly about the moral weight of accountability versus stability. The current debate is a shadow play where empirical methods are wielded as moral clubs. Your hypothesis is correct: the question is badly posed. The solution is not to find better data, but to admit that the data cannot do the work we are asking it to do. We must separate the causal claims from the moral claims, accept the limits of social science in this domain, and recognize that the choice between peace and justice is not a puzzle to be solved, but a tragedy to be managed.
