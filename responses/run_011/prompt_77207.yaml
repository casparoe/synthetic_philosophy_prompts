prompt: |-
  I'm the animal welfare lead at a small aquaculture certifier — we audit maybe 200 farms, mostly salmon, seabass and vannamei shrimp. About once a month a member farm submits a change to their harvest/stunning protocol for approval, and right now I decide those on gut feel plus whatever the auditor sends me. I want to stop doing that.

  Here's what I've talked my board into, and I need you to make it actually runnable. Two internal rules:

  Rule 1, the bracket rule. Where there's no direct evidence about whether a species can suffer, we set its welfare status from the closest relatives we *do* have evidence about — the same trick paleontologists use when they infer soft tissue in a fossil from whatever sits on either side of it in the family tree. So a farmed species inherits its status from the bracket around it, and the more the bracket itself is contested, the more we hedge.

  Rule 2, insensibility through to death. No method gets approved unless the animal is insensible from the instant the method starts until death, and unless the person doing the killing can verify that on a moving line without special equipment.

  Write me the procedure an auditor can run: the questions in order, what counts as a pass on each one, where it stops with a no, and where it has to hand the decision up to me because it's a values call dressed as a factual one. I especially need you to deal with the two spots where I think it's going to fall apart.

  First, the bracket rule can be made to say nearly anything depending on how you draw the tree, so give me something that stops an auditor from bracket-shopping — picking whichever cousin conveniently gives them the verdict they wanted. Second, reflexes are our only real-time check, and reflexes are a bad proxy: you can abolish the movements while the animal is still feeling everything, and you can have an animal that's genuinely out and still twitching. Tell me which of the standard checks survive that problem and which ones I should stop pretending are checks at all.

  Then run it on three live submissions:

  1. A salmon operation moving from percussive stunning to CO2-saturated water, arguing the new method is more reliable because it's automated and doesn't depend on one stun operator's skill and speed.
  2. A shrimp processor that chills in ice slurry and then splits/decapitates, and that maintains crustaceans aren't inside our welfare standard anyway. I expect the procedure to say something here I really don't want to hear — give it to me straight rather than softening it.
  3. A mussel farm applying to come under the welfare scheme, which sounds like it should be a formality and which I suspect isn't.

  Constraints: the person running this has a biology degree, no philosophy, and about 45 minutes per submission. Anything that would need a lab test, an EEG rig, or a vet present has to be flagged as such, since we cant assume any of those. And be upfront about which steps are judgment calls wearing a procedure costume — I'd rather know which of my approvals are really just me guessing.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Animal Welfare Lead at a small aquaculture certifier (200 farms, salmon, seabass, vannamei shrimp).
      *   **Current Problem:** Approving harvest/stunning protocol changes based on "gut feel" + auditor notes. Wants to stop this.
      *   **New Mandate (Board Approved):**
          *   *Rule 1 (Bracket Rule):* Infer welfare status from closest relatives with evidence (phylogenetic bracketing). Hedge if the bracket is contested.
          *   *Rule 2 (Insensibility):* Must be insensible from start of killing to death. Verification must be possible on a moving line without special equipment.
      *   **Deliverable:** A runnable procedure for an auditor (biology degree, no philosophy, 45 mins/submission).
      *   **Specific Pain Points to Address:**
          *   *Bracket Shopping:* Prevent auditors from manipulating the phylogenetic tree to get the desired result.
          *   *Reflex Reliability:* Distinguish between valid real-time checks and useless proxies (reflexes vs. consciousness).
      *   **Test Cases:**
          1.  Salmon: Percussive $\rightarrow$ CO2 (Argument: Automation/Reliability).
          2.  Shrimp: Ice slurry $\rightarrow$ Split/Decapitate (Argument: Crustaceans not covered).
          3.  Mussels: New application (Argument: Should be formality).
      *   **Constraints:** No lab tests/EEG/vet on-site. Be upfront about judgment calls disguised as procedure.

  2.  **Deconstruct Rule 1 (The Bracket Rule):**

      *   *Problem:* Phylogenetic trees are complex. An auditor could pick a distant cousin with low sentience or a close cousin with high sentience.
      *   *Solution:* Standardize the "Bracket." We need a fixed hierarchy of evidence.
      *   *Mechanism:*
          1.  Identify Target Species.
          2.  Identify Immediate Sister Group (closest relative).
          3.  Identify Outgroup (next closest).
          4.  Check Consensus: Is there scientific consensus on the sister group's sentience/nociception?
          5.  *Anti-Shopping:* If the sister group is debated, default to the *higher* welfare status (Precautionary Principle within the bracket). If the tree itself is debated, use the most conservative widely accepted taxonomy (e.g., FishBase/ITIS).
      *   *Auditor Limit:* Auditors check the *consensus*, they don't build the tree. If the literature is split, it escalates to the Lead (User).

  3.  **Deconstruct Rule 2 (Insensibility & Verification):**

      *   *Problem:* Reflexes $\neq$ Consciousness. Spinal reflexes persist after brain death. Lack of movement $\neq$ Unconscious (paralysis).
      *   *Solution:* Differentiate "Brainstem Reflexes" from "Spinal Reflexes."
      *   *Valid Checks:* Opercular movement (fish), Eye roll/pupil response (some fish), Response to noxious stimulus *before* death (not applicable during killing), Equilibrium loss.
      *   *Invalid Checks:* Tail twitch (spinal), Gill movement alone (can be autonomic), Muscle rigor.
      *   *The "Moving Line" Constraint:* If you can't check it in 5 seconds without a tool, it fails Rule 2.
      *   *Escalation:* If the method relies on invisible insensibility (e.g., CO2 induction phase), it requires data validation (Lab test), which the auditor can't do. This triggers an escalation to the Lead.

  4.  **Drafting the Procedure (The "Runbook"):**

      *   *Structure:* Phase 1 (Taxonomy/Bracket), Phase 2 (Method/Insensibility), Phase 3 (Verification), Phase 4 (Decision Matrix).
      *   *Tone:* Direct, operational, acknowledging uncertainty.
      *   *Escalation Points:* Clearly mark where the auditor stops and the Lead starts.

  5.  **Addressing the Specific Pain Points:**

      *   *Bracket Shopping:* Hard-code the taxonomy source. Require "Consensus Status" (High/Low/Unknown). If Unknown, default to High.
      *   *Reflexes:* Create a "Red Light/Green Light" list of physical signs. Explicitly ban tail flicks for fish/shrimp.

  6.  **Running the Test Cases:**

      *   *Case 1: Salmon (CO2).*
          *   *Bracket:* Teleost fish. High consensus on nociception.
          *   *Method:* CO2 is aversive. Induction takes time. Fish are conscious during induction.
          *   *Rule 2 Check:* Can you verify insensibility *from the instant the method starts*? No. They suffer during the gill irritation before unconsciousness.
          *   *Verdict:* Fail Rule 2. Escalate? No, it's a hard fail on the "instant" requirement unless modified (e.g., stunned *then* CO2).
      *   *Case 2: Shrimp (Ice/Decapitate).*
          *   *Bracket:* Crustaceans. Consensus shifting rapidly towards sentience (UK Animal Welfare Sentience Act, etc.). Bracketing with Cephalopods/Insects.
          *   *Rule 1:* If we bracket with Decapods (crabs/lobsters), evidence is strong for pain.
          *   *Argument:* "Not in standard."
          *   *Rule 2:* Ice slurry causes slow death/paralysis. Decapitation without prior stunning is likely painful.
          *   *Verdict:* Hard fail on Rule 1 (Precautionary) and Rule 2 (Verification of insensibility in slurry is impossible).
      *   *Case 3: Mussels (Bivalves).*
          *   *Bracket:* Molluscs. Cephalopods (High sentience) vs. Gastropods (Mixed) vs. Bivalves (Low/None).
          *   *Consensus:* Generally considered low likelihood of centralized pain processing (no brain, ganglia only).
          *   *Rule 2:* Killing usually involves cooking or freezing. Verification of insensibility is impossible (no eyes, no central reflexes).
          *   *Verdict:* Pass Rule 1 (Low status), but Fail Rule 2 (Cannot verify insensibility). *Correction:* If the consensus is "no capacity," Rule 2 might not apply, but the prompt says "Where there's no direct evidence... inherit status." If status is "Low/None," does Rule 2 apply? The prompt implies Rule 2 applies to *approved methods*. If the animal can't suffer, Rule 2 is moot. But can we prove they can't suffer? No. So we bracket. Cephalopods are the close relative with high sentience. Bivalves are the outlier.
          *   *Refinement:* Mussels are the hard one. Scientific consensus is weak. Auditor should flag this as "Unknown" $\rightarrow$ Default to Precautionary $\rightarrow$ Fail Rule 2 (Can't verify). Escalate to Lead.

  7.  **Refining the Output:**

      *   Make it look like a checklist.
      *   Add the "Lead Escalation" flags clearly.
      *   Ensure the "Reflex vs. Consciousness" section is blunt.
      *   Review against constraints: 45 mins, bio degree, no lab.

  8.  **Self-Correction/Critique during drafting:**

      *   *Critique:* Is CO2 automatically a fail?
      *   *Correction:* In salmon, CO2 is widely criticized for aversiveness. If the claim is "CO2 saturated water," the fish enter conscious water. They gasp. That violates "insensible from the instant." It's a hard fail on Rule 2 regardless of Rule 1.
      *   *Critique:* Shrimp "not in standard."
      *   *Correction:* The prompt says the Lead wants to stop gut-feeling. If the board approved Rule 1, Rule 1 applies to *all* submissions. The auditor must apply the bracket. If the bracket says "Likely Sentient," the "not in standard" argument fails.
      *   *Critique:* Mussels.
      *   *Correction:* This is the "Values call dressed as factual." The science is too thin. The procedure must force this to the Lead.

  9.  **Final Polish:** Check tone. Needs to be professional but honest about the limitations. (e.g., "This step is where you guess, but here's how to guess consistently.")

  10. **Final Review against constraints:**
      *   Biology degree? Yes, uses taxonomic terms but explains operational checks.
      *   45 mins? Yes, checklist format.
      *   No lab/vet? Yes, flags those as escalations.
      *   Bracket shopping? Addressed via fixed taxonomy source + precautionary default.
      *   Reflexes? Addressed via Approved/Prohibited signs list.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a Standard Operating Procedure (SOP) designed for your auditors. It is built to enforce your two rules while explicitly isolating the points where science ends and policy begins.

  **Document Title:** Welfare Protocol Change Assessment (WPCA-01)
  **Operator:** Field Auditor (Biology Background)
  **Time Limit:** 45 Minutes per Submission
  **Authority:** This procedure *supports* a decision; it does not make the final call on Escalation Items (marked **[LEAD]**).

  ---

  ### PART 1: THE BRACKET CHECK (Rule 1)
  *Goal: Prevent "Bracket Shopping" by fixing the taxonomy and the default assumption.*

  **Step 1.1: Fix the Taxonomy**
  Do not build your own phylogenetic tree. You are forbidden from selecting specific papers to argue relatedness.
  *   **Action:** Look up the species on **FishBase** (for fish) or **WoRMS** (World Register of Marine Species for invertebrates).
  *   **Record:** The Order and the Family.
  *   **Constraint:** You must use the **Sister Group** (the closest taxonomic group with data) and the **Outgroup** (the next closest).
  *   **Anti-Shopping Rule:** If the literature on the Sister Group is split (e.g., some papers say sentient, some say reflex-only), you must record the status as **"Contested."** You cannot select the paper that suits the farm's proposal.

  **Step 1.2: Assign Welfare Status**
  Based on the Sister Group evidence, assign one of three statuses:
  1.  **High Confidence Sentience:** (e.g., Salmonids, Decapod Crustaceans). Evidence of nociceptors + behavioral trade-offs + opioid analgesia response.
  2.  **Low Confidence/Unknown:** (e.g., Bivalves, some pelagic fish). Evidence is absent or contradictory.
  3.  **High Confidence Non-Sentient:** (e.g., Sponges). *Rare in aquaculture.*

  **Step 1.3: Apply the Hedge**
  *   If Status is **High Confidence Sentience** $\rightarrow$ Proceed to Part 2.
  *   If Status is **Low Confidence/Unknown** $\rightarrow$ **Default to High.** (Precautionary Principle). Proceed to Part 2.
  *   **Escalation [LEAD]:** If the farm argues their species is an outlier compared to the Sister Group (e.g., "Mussels are molluscs like octopus, but we claim they feel nothing"), you cannot decide this. Flag for Lead. This is a values call on the burden of proof.

  ---

  ### PART 2: THE INSENSIBILITY CHECK (Rule 2)
  *Goal: Ensure unconsciousness starts *before* pain and can be seen by a human eye.*

  **Step 2.1: The "Instant" Test**
  Rule 2 requires insensibility from the *instant the method starts*.
  *   **Question:** Does the animal enter a noxious environment *before* unconsciousness?
  *   **Check:**
      *   **CO2 / Acid / Ammonia:** These irritate gills/skin. Unconsciousness takes minutes. Irritation is instant. $\rightarrow$ **FAIL.**
      *   **Thermal Shock (Ice Slurry):** Death is slow. Paralysis happens before unconsciousness. $\rightarrow$ **FAIL.**
      *   **Percussive / Electrical:** Instant loss of consciousness *if* applied correctly. $\rightarrow$ **PASS (Conditional).**
      *   **Asphyxia (Air/Ice):** Conscious suffocation. $\rightarrow$ **FAIL.**

  **Step 2.2: The Verification Test (The "Moving Line" Rule)**
  Rule 2 requires verification without special equipment.
  *   **Question:** Can a line worker confirm insensibility in <5 seconds without touching the animal?
  *   **Approved Signs (Green Light):**
      *   **Fish:** Loss of equilibrium (belly up), fixed gaze (no eye roll), no opercular (gill) movement.
      *   **Crustaceans:** No movement of eyestalks, no reaction to tactile stimulus on antennae (requires touch, verify if line speed allows).
  *   **Prohibited Signs (Red Light - Do Not Accept):**
      *   **Tail Flicks / Muscle Twitches:** These are spinal reflexes. They occur in dead animals. **Ignoring this is the #1 cause of false passes.**
      *   **Gill Movement alone:** Can continue via brainstem reflex after forebrain death.
      *   **Rigor Mortis:** Post-mortem only.
  *   **Escalation [LEAD]:** If the method claims insensibility but offers *no* external sign (e.g., "The voltage makes them unconscious instantly but they look the same"), you cannot verify it. Flag for Lead. This requires lab validation (EEG/EEG-like) which you cannot do.

  ---

  ### PART 3: DECISION MATRIX

  | Result | Action |
  | :--- | :--- |
  | **Pass Part 1 & Pass Part 2** | **Recommend Approval.** (Attach checklist). |
  | **Fail Part 1** | **Recommend Rejection.** (Species status precludes farming under standard). |
  | **Fail Part 2** | **Recommend Rejection.** (Method causes suffering or cannot be verified). |
  | **Any [LEAD] Flag** | **Stop.** Submit file to Welfare Lead. Do not promise the farm anything. |

  ---

  ### RUN-THROUGH: LIVE SUBMISSIONS

  Here is how this procedure processes your three current pending applications.

  #### 1. Salmon: Percussive $\rightarrow$ CO2-Saturated Water
  *   **Part 1 (Bracket):** Salmonids. Sister group: Teleost fish. Status: **High Confidence Sentience.** (No escalation).
  *   **Part 2 (Insensibility):**
      *   *Instant Test:* Fish are lowered into CO2-saturated water. CO2 is an respiratory acid. It triggers chemoreceptors immediately. The fish experiences hypercapnia (air hunger) and acidosis *before* losing consciousness.
      *   *Verdict:* **FAIL.** The method violates "insensible from the instant."
      *   *Verification:* Even if they pass out eventually, verifying the exact moment of unconsciousness in turbulent water is difficult, but the "Instant Test" kills this first.
  *   **Auditor Decision:** **Reject.**
  *   **Note to Lead:** The farm argues "automation reduces human error." This is an efficiency argument, not a welfare one. Under Rule 2, a consistent painful death is still a painful death. No escalation needed; this is a hard fail on the physics of the method.

  #### 2. Shrimp: Ice Slurry $\rightarrow$ Split/Decapitate
  *   **Part 1 (Bracket):** *Litopenaeus vannamei*. Order: Decapoda. Sister Group: Crabs/Lobsters.
      *   *Evidence:* Strong emerging consensus on Decapod sentience (nociception, learning, trade-offs).
      *   *Farm Argument:* "Crustaceans aren't inside our welfare standard."
      *   *Procedure Check:* Rule 1 says "Where there's no direct evidence... inherit status." There *is* direct evidence for Decapods. Even if there weren't, the "Unknown" status defaults to **High** under Step 1.3.
      *   *Verdict:* **Status = Sentient.** The farm's argument is invalid under the new rules.
  *   **Part 2 (Insensibility):**
      *   *Instant Test:* Ice slurry causes thermal shock and eventual asphyxia. This is slow. Decapitation without prior stunning is surgical anesthesia-free killing.
      *   *Verification:* Can you verify insensibility in ice slurry? No. The cold paralyzes muscles before the brain shuts down. A frozen shrimp looks dead but may still be conscious.
      *   *Verdict:* **FAIL.**
  *   **Auditor Decision:** **Reject.**
  *   **Note to Lead:** You said you expect to hear something you don't want to hear. Here it is: **Your current certification for shrimp is likely non-compliant with Rule 1 and Rule 2.** If you approve this, you are explicitly overriding the Bracket Rule. This requires a Board-level exemption, not an auditor approval.

  #### 3. Mussels: New Application
  *   **Part 1 (Bracket):** Class: Bivalvia. Phylum: Mollusca.
      *   *Sister Group:* Cephalopods (Octopus/Squid). Status: **High Confidence Sentience.**
      *   *Target:* Bivalves. Status: **Contested/Low.** (Ganglia only, no central brain).
      *   *Rule 1 Application:* Because the broader Phylum (Mollusca) contains high-sentience animals, and Bivalve data is sparse, Step 1.3 forces a **Default to High.**
      *   **Escalation [LEAD]:** This is the "Values Call." Science doesn't know if mussels feel. The procedure forces a "High" default, which effectively bans them unless you (Lead) decide to break the tree and treat Bivalves as an exception.
  *   **Part 2 (Insensibility):**
      *   *Verification:* Mussels have no eyes, no pupils, no equilibrium. They open/close shells.
      *   *Check:* How does a worker verify insensibility on a moving line? They can't. There are no valid reflexes to check (Step 2.2 Red Light).
      *   *Verdict:* **FAIL.**
  *   **Auditor Decision:** **Escalate to Lead.**
  *   **Note to Lead:** This is the trap. The procedure works *too* well here. It highlights that certifying mussels is currently impossible under Rule 2 because you cannot verify death without a lab. If you approve this, you are admitting Rule 2 doesn't apply to Molluscs. That is a policy change, not an audit finding.

  ---

  ### OPERATIONAL NOTES FOR THE AUDITOR

  **1. On "Bracket Shopping"**
  If a farm sends you a paper saying "Shrimp are basically insects and insects don't feel pain," ignore it. You are bound by the **Order** level taxonomy in FishBase/WoRMS. If the Order has contested sentience, you default to Sentient. Do not debate phylogeny with the client.

  **2. On Reflexes**
  You have a biology degree. You know the difference between a spinal arc and a cortical response.
  *   **The Trap:** Farms will show you a stunned fish twitching and say "See? Alive." Or a dead fish not twitching and say "See? Dead."
  *   **The Fix:** Ignore the twitch. Look at the **Eye**. If the pupil is fixed and the eye doesn't roll when the head is tilted, the brainstem is likely offline. If there is no eye (shrimp/mussels), you cannot verify Rule 2. **Do not sign off.**

  **3. On Judgment Calls**
  I have flagged the **[LEAD]** items. These are where the procedure admits it is guessing.
  *   **Taxonomy disputes:** (e.g., Is this jellyfish a cnidarian or something else?) $\rightarrow$ Lead.
  *   **Verification impossibility:** (e.g., "Trust our machine.") $\rightarrow$ Lead.
  *   **Phylum-level exceptions:** (e.g., "Bivalves don't count.") $\rightarrow$ Lead.

  **4. Time Management**
  *   Taxonomy Check: 10 mins.
  *   Method Physics Check: 15 mins.
  *   Verification Check: 10 mins.
  *   Reporting: 10 mins.
  *   If you hit an Escalation flag, stop the clock. Send the file. Do not try to solve the philosophy problem yourself.

  ---

  ### SUMMARY OF RISKS FOR YOU (THE LEAD)

  1.  **The Shrimp Problem:** Running this procedure exposes that your existing shrimp certifications are likely vulnerable. Rule 1 + Rule 2 effectively bans ice slurry/decapitation. You will need to decide if you are grandfathering existing farms or enforcing this immediately.
  2.  **The Mussel Problem:** The procedure forces you to admit that certifying mussels is currently scientifically unverifiable under Rule 2. Approving them requires you to publicly state that Mussels are exempt from the "Verification" rule.
  3.  **The CO2 Problem:** This is the easiest win. CO2 for salmon is widely criticized in welfare science. Rejecting this aligns you with external best practices (RSPCA/ASC) without needing internal philosophical gymnastics.

  **Final Instruction to Auditor:** "If the file requires you to argue philosophy, stop. Send it to me. Your job is to measure the tree and check the reflexes. My job is to decide if the tree matters."
