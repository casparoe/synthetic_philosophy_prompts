answer: |-
  # The Commitment Decision Tree: Debate Union vs. Film Club

  **Start:** You are the Debate Union. The Film Club wants the same Friday. The Student Union board shows bookings publicly. Deposits are £300 non-refundable.
  **Preferences:** Win (Hall) > Split (Joint) > Lose (Seminar) > Wreck (Void/No Money).

  *   **Node 1: The Purpose Split**
      *   *Question:* Are you trying to stop *yourself* from panicking and yielding later, or are you trying to make the Film Club believe you won't yield?
      *   *Why here?* This separates Ulysses-style self-control (internal problem) from Schelling-style strategy (external problem). If you don't know which problem you have, the rest of the tree is noise.
      *   **Branch A (Stop Yourself):** Go to Node 2.
      *   **Branch B (Stop Them):** Go to Node 3.

  *   **Node 2: The Mechanism (Self-Control Branch)**
      *   *Question:* Can you physically remove the option to book, or do you need someone else to hold the key?
      *   **Leaf 1: The Iron Bond.** (Physical removal).
          *   *Buys:* Guarantees you don't chicken out due to fear.
          *   *Backfires:* When the Film Club doesn't care about your hall and books anyway, leaving you stuck with a hall you can't use.
      *   **Leaf 2: The Mad Agent.** (Delegation).
          *   *Buys:* Lets you claim "I literally cannot stop my treasurer from posting the deposit."
          *   *Backfires:* When your agent makes a mistake (e.g., books the wrong date) and you are bound by their error.

  *   **Node 3: The Race (Strategy Branch)**
      *   *Question:* Is the Film Club's £300 deposit already on the public board?
      *   *Why here?* This captures the timing race. If they are already in, your commitment is no longer a threat; it is a reaction.
      *   **Branch B1 (Yes, they booked):** Go to Node 4.
      *   **Branch B2 (No, board is empty):** Go to Node 5.

  *   **Node 4: The Response (They Booked First)**
      *   *Question:* Do you put your £300 down to match them, or do you walk away?
      *   **Leaf 3: The White Flag.** (Walk away).
          *   *Buys:* Saves your £300 and secures the seminar room (Lose is better than Wreck).
          *   *Backfires:* When they hadn't actually booked yet and were bluffing, so you handed them the win for free.
      *   **Leaf 4: The Wreck.** (Match them).
          *   *Buys:* Nothing. (This is an empty node).
          *   *Diagnosis:* **Incoherent.** A hard commitment made after the opponent has hard-committed is not a strategy; it is mutual suicide. You cannot threaten a wreck that is already guaranteed.

  *   **Node 5: The Cost (Board Empty)**
      *   *Question:* If you announce you will book, does backing down cost you real money/reputation, or just pride?
      *   **Branch B2a (Real Cost/Hard):** Go to Node 6.
      *   **Branch B2b (Pride Only/Soft):** Go to Node 7.

  *   **Node 6: The Shape (Hard Commitment)**
      *   *Question:* Do you book no matter what, only if they try to, or based on a coin flip?
      *   **Leaf 5: The Burnt Bridge.** (Absolute).
          *   *Buys:* Maximum credibility; they know you are coming.
          *   *Backfires:* When they call your bluff and you both end up in the Wreck because you removed your own exit ramp.
      *   **Leaf 6: The If-Then Trap.** (Conditional).
          *   *Buys:* Allows the Split outcome if they back down; punishes only if they push.
          *   *Backfires:* When the Student Union refuses to accept conditional bookings, forcing you to choose Absolute or Nothing.
      *   **Leaf 7: The Dice Roll.** (Randomizing).
          *   *Buys:* Makes you unpredictable; they can't calculate a safe counter-move.
          *   *Backfires:* When they prefer the Wreck to letting you win, so your randomness just triggers the crash.

  *   **Node 7: The Signal (Soft Commitment)**
      *   *Question:* Can they verify your move before they decide, or are you just talking?
      *   **Branch B2b-i (Verifiable/Public):** Go to Node 8.
      *   **Branch B2b-ii (Unverifiable/Private):** Go to Leaf 8.
      *   **Leaf 8: The Silent Veto.** (Private).
          *   *Buys:* Keeps your options open.
          *   *Diagnosis:* **Unattractive.** In a public board game, a private threat is invisible. It changes nothing.

  *   **Node 8: The Method (Public/Soft)**
      *   *Question:* Do you make one big announcement, many small ones, or go silent?
      *   **Leaf 9: The Bluff.** (One big announcement).
          *   *Buys:* Cheap way to scare them off if they are risk-averse.
          *   *Backfires:* When they check the board, see no deposit, and realize you can quietly undo it.
      *   **Leaf 10: The Ladder.** (Small reversible steps).
          *   *Buys:* Lets you escalate pressure (e.g., "We booked the projector") without triggering the Wreck immediately.
          *   *Backfires:* When they treat your first step as a full commitment and book over you before you reach the top.
      *   **Leaf 11: The Ghost.** (Unreachable/Silent).
          *   *Buys:* Prevents them from offering you a side-deal to yield.
          *   *Backfires:* When they assume you aren't interested and book the hall, leaving you with no way to claim it.

  *   **Node 9: The Indistinguishability Check (Meta-Node)**
      *   *Question:* (For the student using the tree) Can you actually afford the deposit if called?
      *   **Leaf 12: The Convincing Performance.** (Fake Hard Commitment).
          *   *Buys:* Same as The Burnt Bridge (Leaf 5) if they believe you.
          *   *Diagnosis:* **Real Defect.** From the Film Club's perspective, Leaf 5 (Real Bond) and Leaf 12 (Fake Bond) look identical. The tree cannot distinguish them from the *outside*, only from your *inside*. If you pick Leaf 12, you are gambling on their inability to audit your bank account.

  ---

  ### Stress Test: The Wage Negotiation Case

  **Case:** A Teachers' Union vs. a School District.
  **Mechanism:** Union can vote to authorize a strike (costly to members, public). District can lock them out (costly to students, public).
  **Preferences:** Win (Full Raise) > Split (Modest Raise) > Lose (No Raise) > Wreck (Strike/Lockout).

  **Re-running the Tree:**
  1.  **Purpose:** Union wants to stop members from crossing picket lines (Self-Control) OR stop District from offering low ball (Strategy). *Tree holds.*
  2.  **Race:** Has the District already announced a lockout? *Tree holds.*
  3.  **Cost:** Is a strike vote binding? Usually yes (Hard). *Tree holds.*
  4.  **Shape:** Absolute (Strike immediately) vs. Conditional (Strike if no deal by Friday). *Tree holds.*
  5.  **Signal:** Public vote count vs. Private rumblings. *Tree holds.*

  **Misfire:**
  *   **Node 8 (The Method):** "The Ladder" (Escalating in small reversible steps) misfires here. In the Hall case, you can book a projector, then the sound system, then the hall. In a Strike, the steps are not easily reversible. You cannot "partially strike" easily without losing credibility or legal protection.
  *   **Node 7 (The Signal):** "The Ghost" (Unreachable) is harder. Union leaders cannot go fully unreachable during negotiations without violating labor laws or losing member trust.
  *   **Diagnosis:** The tree assumes *granular* reversibility (Node 8) and *total* communication control (Node 7). In institutional bargaining, steps are lumpier and communication is regulated. The tree overestimates the flexibility of the "Soft Commitment" branch in regulated environments.

  ---

  ### Diagnostics & Critique

  **Indistinguishable Leaves:**
  *   **Pair:** Leaf 5 (The Burnt Bridge) vs. Leaf 12 (The Convincing Performance).
  *   **Defect:** This is a **real defect**, not fixable within the tree. From the opponent's perspective, a £300 deposit on the board looks the same whether you have £300 in the bank or borrowed it five minutes ago to fake it. The tree distinguishes them by *your* truth, but the game is played on *their* perception. A student following this tree might think "I chose Burnt Bridge, so I'm safe," forgetting that safety depends on the other side believing it, not just you meaning it.

  **Empty Paths:**
  1.  **Leaf 4 (The Wreck):** Diagnosed as **Incoherent**. Committing hard after the opponent has committed hard is not a strategy; it is a failure to read the board.
  2.  **Leaf 8 (The Silent Veto):** Diagnosed as **Unattractive**. Private commitments in a public game convey no information, so they alter no incentives.
  3.  **Node 4 (Match after they book):** Diagnosed as **Unthought**. Students often think "fighting back" is a move. The tree clarifies that once both deposits are down, the move is already over; "matching" is just paying for the loss.

  **Confidence Assessment:**
  I am **85% confident** this carves the space at the joints. It successfully separates the *mechanics* of commitment (cost, timing, visibility) from the *intent* (self vs. other), which is where students usually get confused.

  **Least Sure Element:**
  **Node 6 (The Dice Roll / Randomizing).** I am least sure about this leaf's practical utility in this specific case. In a booking scenario, randomizing your deposit is mechanically difficult (the board is binary: booked or not). You can randomize your *announcement*, but not the *state*. In a nuclear standoff, you can randomize readiness. In a hall booking, "I might book" is just a Bluff (Leaf 9). I included it to satisfy the mandatory list, but it feels slightly forced in this specific institutional context compared to a military one.

  **Game Theorist's Critique:**
  A formal game theorist would likely argue that the tree conflates **Signaling** with **Commitment**.
  *   *Critique:* Leaves like "The Bluff" or "The Ghost" are signaling games (cheap talk), not commitment games (changing payoff structures). By putting them on the same tree, the outline suggests they function the same way.
  *   *Defense:* For second-years, this distinction is often pedantic. The *effect* on the opponent's belief is what matters for the seminar discussion. However, a purist would insist that unless the payoff matrix is physically altered (like the non-refundable deposit), it isn't commitment, it's just communication. The tree acknowledges this at Node 5 (Cost), but a purist might say Node 7 shouldn't exist on a "Commitment" tree at all.
