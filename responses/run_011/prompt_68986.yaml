      *   *Snow's Hypothesis:* "Cholera is transmitted via contaminated water."
      *   *Mapping Challenge:* Snow's hypothesis isn't a simple universal generalization about properties of objects. It's a causal mechanism. To fit Hempel, we need to translate it into conditional form.
      *   *Translation:* $\forall x (\text{Exposed to Sewage Water}_x \rightarrow \text{Cholera}_x)$? No, that's too strong (not everyone gets sick). Better: $\forall x (\text{Cholera}_x \rightarrow \text{Exposed to Sewage Water}_x)$ (All cholera cases come from sewage water). Or, looking at it as a correlation test: $\forall x (\text{Clean Water}_x \rightarrow \text{No Cholera}_x)$.
      *   *The "Raven":* A Cholera Case? Or a House? Let's say a "Household."
      *   *The "Blackness":* Having Cholera? Or Having Contaminated Water?
      *   *Equivalence:* "All Cholera cases drank bad water" is equivalent to "All who drank good water had no cholera."
      *   *Slippage:* Ravens is about *properties* (color, species). Snow is about *causal exposure* and *outcomes*. The Raven paradox assumes deterministic universals. Disease is probabilistic. This is a major slip.

