      *   *Nicod:* Only $Ra \land Ba$ confirms. $\neg Ba \land \neg Ra$ (Non-black non-raven) confirms logically but feels irrelevant.
      *   *Snow's Data:* The South London study compared houses with dirty water (High Cholera) vs. clean water (Low Cholera).
      *   *The "Non-Black Non-Raven":* A house with Clean Water and No Cholera.
      *   *Nicod's Verdict:* Logically confirms "All Clean Water houses have No Cholera." But since there are billions of non-cholera houses, Nicod (and Hempel initially) suggests the confirmation weight is tiny.
      *   *The Problem:* Snow treats these clean-water/no-cholera houses as *crucial* evidence.
      *   *Bayesian Fix:* Confirmation depends on $P(E|H) / P(E)$.
      *   *Snow's Move:* He didn't just pick random houses. He picked *neighboring* houses (same street, same poverty, same air). He shrank the reference class.
      *   *Why it counts:* In the general population, $P(\text{No Cholera})$ is high anyway. But in a cholera hotspot, $P(\text{No Cholera})$ should be low *unless* the protective factor (clean water) is present. By controlling the background (neighbors), the "Clean/No-Cholera" instance becomes rare and thus highly informative.

  4.  **Hempel vs. Farr & Background Knowledge (Step 4):**
