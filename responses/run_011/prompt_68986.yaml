      *   *Construction:* Imagine background knowledge says "This neighborhood is so saturated with miasma that *everyone* should get sick regardless of water." (High prior probability of Cholera). If we find a Clean Water/No Cholera house, it supports Water Theory.
      *   *Reverse:* Imagine background knowledge says "This specific clean water supply is known to be contaminated at the source, but filtered at the tap." If we find a house on this supply with No Cholera, it might suggest the filtration works, not the source.
      *   *Wait, let's look at Good's specific logic:* Good argues that if you expect non-ravens to be non-black anyway, finding one adds little. If you expect non-ravens to be black, finding a non-black one is huge.
      *   *Cholera Good-Case:* Hypothesis: "Water is the cause." Background: "The miasma in this alley is so potent that *even* those with clean water should die." (i.e., $P(\text{Cholera} | \text{Clean Water})$ is expected to be high). If we find a Clean Water/No Cholera house *here*, it strongly confirms Water Theory.
      *   *The Reverse (Disconfirmation):* We need a Healthy/Clean house to *lower* probability. Hypothesis: "Water is the cause." Background: "We know for a fact this 'clean' supply was cross-contaminated yesterday." If a house on that supply remains healthy, it suggests Water *isn't* the cause (or immunity is).
      *   *Refined:* Let's use the "Immunity" angle. If background knowledge suggests "Everyone in Soho has natural immunity," then finding a Healthy/Clean house tells us nothing. If background suggests "Water is irrelevant," finding Healthy/Clean is expected.
      *   *Let's try to match Good's "Crow" example:* Good says if I know an object is a crow, finding it non-black disconfirms "All Ravens are Black" (because crows are non-ravens, but if crows are white, maybe my definition of raven is wrong).
      *   *Cholera:* Hypothesis: "All Cholera comes from Water." Case: A house with Clean Water and No Cholera. Background: "This house belongs to a doctor who takes extreme sanitary precautions beyond just water (burns clothes, isolates)." If we find this house is Healthy/Clean, it might suggest *sanitation* is the cause, not water specifically. It lowers the probability that *water specifically* is the unique culprit, pointing instead to general hygiene.

  6.  **The Pump Handle & Intervention (Step 6):**
      *   *Hempel's Picture:* Purely observational confirmation. $E$ confirms $H$.
      *   *Pump Handle:* This is an *intervention* (manipulation). $Do(\text{Remove Handle}) \rightarrow \text{Stop Epidemic}$.
      *   *Fit:* Hempel's framework struggles with causality/intervention. It treats "Pump Removed" and "Epidemic Stopped" as just two events.
      *   *The Decline:* The epidemic was already declining. Using the decline as confirmation of the handle's efficacy is the *Post Hoc Ergo Propter Hoc* fallacy.
