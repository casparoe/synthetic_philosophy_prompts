prompt: |-
  I'm applying for a four-month independent fellowship and need a proposal of roughly 1,500 words. My half-formed idea comes out of years of reading Hofstadter alongside the standard AI framing of creativity as search. On his account, a tradition comes with a panel of knobs: ordinary work consists in setting those knobs, more striking work consists in turning some of them to extremes, and the boldest innovations consist in adding knobs or swapping the panel entirely. The assumption I want to press is that this requires the knob-space to be determinate in advance of the variations. Otherwise the model looks unfalsifiable, since any two artifacts differ somehow and one can always retro-describe the difference as a knob that was turned.

  So the question I want funded is narrower: what makes a candidate difference a knob of a tradition rather than an arbitrary post-hoc parameter, and what would the knob framing have to deliver to be worth more than the flat claim that creativity is search through a large space? Write the proposal with a precise statement of that question; an argument for why the obvious routes — aesthetic description, or asking practitioners to report their phenomenology — cannot settle it; and a method built on traditions whose parameter spaces are explicit and practitioner-articulated, which I would use as ground truth for testing candidate criteria before asking what licenses extrapolation to traditions with no such catalogue. The ones I have in mind are figured-bass chorale harmonization, twelve-tone row operations, the named theme vocabulary of chess problem composition, and Oulipian constraint systems; tell me if you would choose otherwise, and why. I also want a month-by-month work plan, a statement of what a successful result would look like as a deliverable, and an honest account of what would count as failure — for instance, criteria that turn out to classify the invention of serial technique as merely another knob-turn, or criteria strict enough that the explicit traditions fail them too. Skip the bibliography; I will supply references myself.
