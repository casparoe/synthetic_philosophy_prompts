answer: |-
  1. Expected-harm reasoning struggles here because probabilities of deterrence failure are unknowable, while maximin reasoning might paradoxically endorse the machine as the ultimate worst-case insurer. The recoverability view identifies the fatal error not in the weapon's power but in the secrecy that prevents the adversary from updating their risk assessment, rendering the safeguard useless. Thus the film's irony lands on the institution that adopted the principle without disclosure, rather than on the maximin logic itself.

  2. The film suggests the catastrophe stems not from miscalculated probabilities of Soviet aggression but from a system design that removed human off-ramps once a specific threshold was crossed. When the recall code fails to penetrate the sealed base and the crew discards unverified messages, the structure ensures that being wrong about the order cannot be discovered or reversed. This confirms the recoverability view's claim that the danger lies in arrangements that foreclose the possibility of walking back a mistake rather than in the initial likelihood of harm.

  3. The proposal to secure elite survival in mineshafts satirizes precautionary reasoning only insofar as the safeguards are exclusive and undisclosed, transforming protection into a strategic advantage rather than a public good. Under the recoverability view, this scene dramatizes how safeguards that cannot be disclosed to those exposed become instruments of rivalry rather than genuine risk mitigation. The irony lands on the idea that a precaution which secrets away the decision-makers eliminates the possibility of shared recovery or verified safety.

  4. If the film's actual target is the distribution of discretion and automaticity across an institution, then the recoverability view earns its place by shifting the debate from choosing principles to designing structures that permit correction. It functions not as a decision rule for uncertainty but as a metric for institutional resilience, evaluating whether a system allows agents to recognize and reverse errors. This validates its inclusion in the unit, provided students understand it as a constraint on system architecture rather than a substitute for probability estimation.

  5. The strongest resistance is that the film is a farce populated by caricatures, suggesting the catastrophe arrives due to individual incompetence rather than a flaw in any rational principle of choice. Reading the movie as a philosophical treatise on risk ranking may force the text, since the absurdity implies no serious institution would ever operate this way. You must tell students that if the film is evidence only about incompetent institutions, it may fail to illuminate the theoretical distinctions between expected harm, maximin, and recoverability.
