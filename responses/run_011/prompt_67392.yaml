      *   *Is it a defect in fiction?* No, fiction isn't designed to model statistical probability.
      *   *Is the historical debate about narrative scale?* Yes, largely. The "truth" claim of the macro-historian is often a claim about *narrative authority* (the view from nowhere). The micro-historian claims *narrative intimacy* (the view from inside). The fight is about which view yields "truth."
