  2.  **Deconstruct the Philosophical Conflict:**

      *   **Traditional View (Walzer):** Moral Equality of Combatants (MEC). If you follow *jus in bello* (discrimination, proportionality), you are morally permitted to fight, regardless of *jus ad bellum* (justice of the war). Symmetry of liability.
      *   **Revisionist View (McMahan):** Liability tracks justice. Unjust combatants are not morally permitted to fight (even cleanly). Just combatants have stronger permissions. Asymmetry of liability.
      *   **The Practical Gap:** A Lt cannot adjudicate *jus ad bellum* in the field. They need to know what to *do*.
      *   **The Professor's Stance:** Revisionists are right about *liability* (metaphysics) but wrong about *implications for soldiers* (epistemology/role). Soldiers should act *as if* MEC holds for operational stability, even if metaphysically it doesn't.
      *   **The Solution:** A "Two-Track" Procedure. One track for *Conduct* (In Bello), one track for *Conscience/Role* (Ad Bellum). The Card must prioritize the Traditional View for *action* (to prevent paralysis/chaos) but acknowledge the Revisionist concern for *reflection* (to prevent moral disengagement).

  3.  **Drafting the Card (Student-Facing Artifact):**

      *   *Format:* Wallet card, high contrast, large text.
      *   *Structure:* Three Zones.
          *   Zone 1: Immediate Threat/ROE (Legal/Order).
          *   Zone 2: Moral Conduct (In Bello).
          *   Zone 3: Moral Cause (Ad Bellum).
      *   *Constraint Check:* Needs explicit stop/pass conditions. Needs to separate Law, Order, Morality. Needs to handle the Walzer/McMahan split.
      *   *Design Choice:* The Card must adopt the Traditional View for *action* (Zone 2) because a Lt cannot determine *ad bellum* justice in the field. However, Zone 3 must allow for the Revisionist worry (conscience) without stopping the mission unless it crosses a specific threshold (manifest illegality/conscience objection).
      *   *Refinement:* To satisfy Constraint 6 (divergence), I need to be explicit. The Card will tell them: "For the purpose of *this* decision, assume your cause is legally authorized. Judge the *act*, not the *war*." This privileges Walzer for action but McMahan for reflection.
      *   *Constraint 7 (Bias Guard):* Explicitly state: "Your belief in the cause does not change the rules for targeting."

  4.  **Drafting Instructor's Notes:**

      *   Map each question to Walzer or McMahan.
      *   Explain *why* the Card privileges the Traditional View for action (epistemic limitation of the Lt).
      *   Explain the separation of registers (Law vs. Morality).

  5.  **Drafting Teaching Guide:**

      *   How to introduce it.
      *   How to handle the "Unjust War" objection (The "Epistemic Burden" argument).
      *   How to teach the bias guard.

  6.  **Drafting Failure Scenarios:**

      *   Need 4 situations where the card fails.
      *   1. Manifestly Illegal Order (Card says check law, but law is clear).
      *   2. Strategic Genocide (Ad bellum injustice is so overwhelming *in bello* is impossible).
      *   3. Conflicting ROE/Law (Bureaucratic trap).
      *   4. Personal Conscience Break (PTSD/Moral Injury).

  7.  **Running the Cases:**

      *   *Case 1 (Air Campaign/Fabricated Cause):*
          *   *Analysis:* *Ad bellum* suspect (Revisionist says don't fight). *In bello* clean (Traditional says fight).
          *   *Constraint:* Professor says Lt *may* fly.
          *   *Procedure Output:* Zone 1 (Legal/ROE) clears. Zone 2 (Conduct) clears. Zone 3 (Cause) flags doubt but defers to authorization.
          *   *Result:* Fly. Acknowledge the moral cost (McMahan) but affirm the permission (Walzer/Role).
      *   *Case 2 (Drone/Contractor/Farmer):*
