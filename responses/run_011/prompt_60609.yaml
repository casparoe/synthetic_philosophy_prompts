      *   *Critique:* Case 1 Warning.
      *   *Fix:* Ensure the output explicitly says "You are permitted to fly" despite the *ad bellum* doubt, aligning with the Professor's published view (Revisionist metaphysics, Traditional action-guidance).
      *   *Critique:* Constraint 6 (Divergence).
      *   *Fix:* Add a specific box on the Card: "Where Cause and Conduct Conflict."
      *   *Critique:* Constraint 4 (Jargon).
      *   *Fix:* Replace *Jus Ad Bellum* with "Justice of the War." Replace *Jus In Bello* with "Conduct in the Fight." Replace "Liability" with "Legitimate Target."

  9.  **Final Review against Constraints:**

      1.  Sequence/Time? Yes (3 Zones).
      2.  Registers (Law/Order/Morals)? Yes (Zone 1 vs 2 vs 3).
      3.  No "Obey Orders" collapse? Yes (Zone 2 allows moral stop).
      4.  Distinctions preserved? Yes (Cause vs Conduct).
      5.  Judgment calls marked? Yes ("Conscience Check").
      6.  Walzer/McMahan divergence? Yes (Explicitly addressed in Zone 3).
      7.  Bias Guard? Yes (Explicit text in Zone 2).
      8.  Four Failures? Yes.
      9.  Case 1 Warning? Yes.
      10. No quotes? Yes.

  10. **Final Polish:** Tone must be professional, military-philosophical, direct. No fluff.

