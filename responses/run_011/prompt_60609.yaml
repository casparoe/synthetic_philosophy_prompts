          *   *Procedure:* Focus on "Direct Participation in Hostilities" (LOAC test) rather than "Uniform."
          *   *Result:* Contractor liable if guiding weapon. Farmer liable only if currently using land for firing (temporal scope).
      *   *Case 3 (Conscript):*
          *   *Analysis:* Traditional: Liability based on status (uniform/threat). Revisionist: Liability based on moral responsibility (coercion reduces responsibility).
          *   *Procedure:* Card focuses on *threat* and *status*, not internal culpability.
          *   *Result:* Engage if threat exists. Acknowledge moral tragedy but prioritize unit survival.

  8.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Critique:* Is the Card too long?
      *   *Fix:* Cut prose. Use bullet points. Bold key verbs.
      *   *Critique:* Did I separate Law and Morality enough?
