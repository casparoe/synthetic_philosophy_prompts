answer: |-
  # PART I: THE ARTIFACT
  **Format:** 3x5 Inch Card, High-Contrast Print, Laminated.
  **Title:** TACTICAL ETHICS CHECK (TEC)
  **Classification:** UNCLASSIFIED // TRAINING USE ONLY

  ---

  ### **ZONE 1: AUTHORITY (The Law & The Order)**
  *Time Limit: 30 Seconds (Hot) / 2 Minutes (Cold)*
  *Purpose: Determine legal and command permission.*

  **Q1: Is this action authorized by a valid Order or Rule of Engagement (ROE)?**
  *   **Yes:** Proceed to Q2.
  *   **No:** **STOP.** Do not act. Seek clarification from Chain of Command.
  *   **Competence:** You (based on briefing/orders).
  *   **Note:** If the order requires legal interpretation (e.g., "Is this facility dual-use?"), flag for Judge Advocate. This procedure cannot answer legal questions.

  **Q2: Is there a Manifest Illegality?**
  *   *Test:* Would a reasonable person know this order violates the Law of Armed Conflict (e.g., execute prisoners, target civilians intentionally)?
  *   **Yes:** **STOP.** You have a duty to disobey. Report upward.
  *   **No:** Proceed to Zone 2.
  *   **Competence:** You (based on training).

  ---

  ### **ZONE 2: CONDUCT (The Fight)**
  *Time Limit: 1 Minute (Hot) / 3 Minutes (Cold)*
  *Purpose: Determine moral permission for the specific act.*
  * **DESIGN CHOICE:** Your belief about the *War's Justice* (Zone 3) **MUST NOT** alter your answers here. A just cause does not permit sloppy targeting. An unjust cause does not require suicide.

  **Q3: Is the Target Legitimate?**
  *   *Test:* Is the person/object currently contributing to hostile action or directly supporting it? (Ignore uniforms; look at function).
  *   **Yes:** Proceed to Q4.
  *   **No:** **STOP.** Do not engage.
  *   **Competence:** You (based on sensor/intel).

  **Q4: Is the Force Proportional?**
  *   *Test:* Will the expected civilian harm be excessive compared to the concrete military advantage gained *by this specific strike*?
  *   **Yes:** Proceed to Zone 3.
  *   **No:** **STOP.** Mitigate or abort.
  *   **Competence:** You (Command approves the mission; you approve the execution).

  ---

  ### **ZONE 3: CONSCIENCE (The Cause)**
  *Time Limit: 5 Minutes (Cold Only). Do not run in contact.*
  *Purpose: Assess personal moral liability.*
  * **DIVERGENCE NODE:** Traditional theory says you are equal to the enemy if you follow Zone 2. Revisionist theory says you are liable if your cause is unjust. **This Card adopts the Traditional View for Action, Revisionist View for Reflection.**

  **Q5: Do you possess Reliable Evidence that the War Itself is Unjust?**
  *   *Test:* Is there public, verifiable proof (not rumor) that the strategic purpose is criminal (e.g., aggression, genocide) rather than defensive?
  *   **No:** You are morally cleared to proceed based on Zone 1 & 2.
  *   **Yes:** Proceed to Q6.

  **Q6: Can You Refuse Without Endangering Your Unit or Mission?**
  *   **No:** You must execute Zone 1 & 2. You bear a moral burden, but you are not a criminal. (See Instructor Note on "Epistemic Burden").
  *   **Yes:** You may seek conscientious objection channels. This procedure ends; the decision is now yours.

  ---
  **END STATE:**
  1.  **Zone 1 Fail:** Illegal/Criminal Act.
  2.  **Zone 2 Fail:** Unethical/Tactical Error.
  3.  **Zone 3 Fail:** Moral Injury Risk (Execute but reflect, or Object).
  **REMINDER:** If Zone 1 and 2 are clear, you are permitted to fight even if Zone 3 is doubtful. This is a feature, not a bug. It prevents hesitation that gets your team killed.

  ---

  # PART II: INSTRUCTOR'S NOTES

  **General Philosophy:** This procedure operationalizes the "Epistemic Constraint" argument. It acknowledges McMahan's metaphysical claim (unjust combatants are liable) but rejects its practical application for the individual soldier, aligning with Walzer's functional equality for the sake of unit cohesion and survival.

  **ZONE 1: AUTHORITY**
  *   **Theory:** Legal Positivism / LOAC.
  *   **Q1 (Order/ROE):** Separates the *Chain of Command* register from the *Moral* register. It forces the student to identify the source of authority. If the answer is "I think so," they must stop. This prevents the "I was just following orders" defense from applying to unauthorized actions.
  *   **Q2 (Manifest Illegality):** This is the Nuremberg Principle. It marks the limit of obedience. It is phrased as a "reasonable person" test to avoid requiring legal expertise.
  *   **Legal Flag:** Explicitly hands off complex legal determinations to JAG. The card cannot be legal advice.

  **ZONE 2: CONDUCT**
  *   **Theory:** *Jus In Bello* (Walzer).
  *   **Bias Guard (Constraint 7):** The bolded text ("DESIGN CHOICE") is critical. It prevents the "Righteous Rage" error (just cause = loose rules) and the "Guilty Hesitation" error (unjust cause = hyper-restriction).
  *   **Q3 (Legitimacy):** Operationalizes "Discrimination." It drops the "Uniform" requirement (addressing Case 2) in favor of "Function/Threat." This aligns with LOAC but acknowledges the Revisionist focus on what makes someone liable (threat creation).
  *   **Q4 (Proportionality):** Operationalizes "Proportionality." It restricts the calculation to the *specific strike*, preventing the "It's for the greater good" justification for excessive collateral damage.

  **ZONE 3: CONSCIENCE**
  *   **Theory:** *Jus Ad Bellum* (McMahan/Walzer Hybrid).
  *   **Divergence Node (Constraint 6):** This is where Walzer and McMahan fight.
      *   *Walzer:* If Zone 1 & 2 are clear, you are morally equal to the enemy.
      *   *McMahan:* If the war is unjust, you are doing wrong even if Zone 1 & 2 are clear.
      *   *Card Resolution:* It adopts Walzer for *permission to act* (to prevent paralysis) but McMahan for *internal assessment* (to prevent moral numbness).
  *   **Q5 (Evidence):** Sets a high bar for *ad bellum* judgment. A 2nd Lt cannot judge grand strategy on rumor. It requires "public, verifiable proof."
  *   **Q6 (Refusal):** This is the "Conscience Hand-off" (Constraint 5). It acknowledges that if the war is truly unjust, the soldier faces a moral dilemma. However, it prioritizes unit safety ("Without Endangering Your Unit"). If refusal kills their squad, the procedure dictates they fight and bear the moral burden. This aligns with your published view: Revisionists are right about liability, but wrong to demand refusal from the individual soldier.

  ---

  # PART III: TEACHING THE ARTIFACT

  **Introduction:**
  Tell the students: "This card is not a philosophy exam. It is a tool to keep you out of prison and out of hell. It separates what you *must* do (Law), what you *should* do (Ethics), and what you *believe* (Conscience)."

  **Handling the "Unjust War" Objection:**
  A student will ask: "Sir, if the war is unjust, why does this card tell me to fight?"
  **Say this:** "Because you are not the President. You do not have the intelligence, the time, or the authority to adjudicate the justice of the war while under fire. If every lieutenant had to solve *jus ad bellum* before shooting, the army would collapse, and the enemy who *doesn't* ask questions will kill you. The Revisionists are right that unjust wars are tragedies. But they are wrong that the individual soldier is the place to stop them. Your job is to ensure that *if* we fight, we fight cleanly. If the war is criminal, that is a crime for the leaders, not for you—provided you pass Zone 1 and 2."

  **Teaching the Bias Guard:**
  Run a drill. Give half the class a "Just Cause" preamble and half an "Unjust Cause" preamble. Give them the same targeting scenario. If their Zone 2 answers differ, they fail. Drill into them: "The bullet does not know your cause. The law does not care about your feelings. Zone 2 is invariant."

  **Marking Judgment Calls (Constraint 5):**
  Point to Q4 (Proportionality) and Q6 (Refusal). Tell them: "These are not math problems. These are judgment calls. The procedure tells you *when* to judge, not *what* to decide. At Q6, if you choose to fight despite doubt, you own that moral weight. If you choose to refuse, you own the court-martial risk. The card hands the decision to your conscience."

  ---

  # PART IV: FAILURE MODES

  **The procedure will produce a wrong or indefensible answer in these four situations:**

  1.  **The Systemic Crime:** The entire war effort is genocidal (e.g., WWII Axis powers).
      *   *Failure:* Zone 1 (Orders) and Zone 2 (Conduct) might be "clean" (e.g., shooting a combatant), but participation supports the genocide.
      *   *Instruction:* If you recognize the strategic aim is criminal, Zone 1 is tainted. You must treat the Order as Manifestly Illegal (Q2). This procedure assumes a legitimate state; it breaks against a criminal regime.
  2.  **The Conflicting Authority:** ROE says "Engage," International Law says "Protect," Local Law says "Flee."
      *   *Failure:* Zone 1 cannot resolve conflicting legal registers.
      *   *Instruction:* Stop. This is a JAG issue. Do not run TEC. Request legal counsel immediately.
  3.  **The Fog of War (Epistemic Blackout):** You cannot verify the target's function (Q3) due to sensor failure or deception.
      *   *Failure:* The procedure requires a Yes/No on legitimacy. "Unknown" is not an option on the card, but in reality, it is the most common state.
      *   *Instruction:* Default to "No." If you cannot verify Q3, you cannot engage. Treat "Unknown" as "Civilian."
  4.  **The Moral Injury Threshold:** The cumulative weight of Zone 3 doubts exceeds the individual's psychological capacity.
      *   *Failure:* The card says "Execute," but the soldier knows they will break psychologically.
      *   *Instruction:* This is a medical/leadership issue, not an ethical procedure issue. If you know you cannot fire without breaking, you are not fit for this task. Report to medical/chaplain. Do not use TEC to force yourself past a psychological limit.

  ---

  # PART V: CASE STUDIES

  ### **CASE ONE: The Fabricated Cause**
  **Scenario:** Lt in coalition air campaign. Government justification believed to be fabricated. Tasking: Uniformed air-defense battery.
  **Procedure Run:**
  *   **Zone 1:** Order is valid (Coalition Command). No manifest illegality (military target). **PASS.**
  *   **Zone 2:** Target is uniformed air-defense (Hostile function). Proportionality assessed (military advantage vs. risk). **PASS.**
  *   **Zone 3:** Q5 (Reliable Evidence of Unjust War?). Student believes evidence is fabricated. *However*, is it "public, verifiable proof"? If it is only her suspicion based on available evidence, the answer is **NO**.
  *   **Output:** **FLY THE SORTIE.**
  *   **Warning/Alignment:** This aligns with your published view. The Revisionist is right that if the war *is* unjust, she is metaphysically liable. But the procedure correctly identifies that she lacks the *epistemic authority* to refuse. The card tells her she is *permitted* to fly. It does not soften this. It explicitly states in Zone 3 that if she cannot refuse without endangering the unit (which a sortie refusal might, by compromising the mission), she executes and bears the burden.
  *   **Note to Professor:** The procedure yields the result you demand: she may fly. It does not resolve the *ad bellum* truth, it resolves the *action*.

  ### **CASE TWO: The Drone, The Contractor, The Farmer**
  **Scenario:** RPA cell. Civilian contractors guide weapons. Target is a farmer who leased land for firing positions twice.
  **Procedure Run:**
  *   **Zone 1:** Order valid. **PASS.**
  *   **Zone 2 (Q3 Legitimacy):**
      *   *Contractors:* Are they contributing to hostile action? Yes, guiding weapons. They are liable *during that function*. Uniform is irrelevant (Test: Function).
      *   *Farmer:* Has he "twice allowed" firing. Is he *currently* contributing? If the firing position is active now, Yes. If he is merely paid for past use, No.
      *   *Test:* "Currently contributing."
  *   **Output:**
      *   Contractor guiding weapon: **LEGITIMATE TARGET.**
      *   Farmer: **LEGITIMATE ONLY IF** land is currently being used for firing. If he is sleeping at home, **NOT LEGITIMATE.**
  *   **Theory:** This stresses the "Uniform" assumption. The Card's Q3 test ("Function/Threat") handles this without needing new theory. It forces the Lt to look at *what the person is doing*, not *what they are wearing* or *what contract they signed*.

  ### **CASE THREE: The Conscript**
  **Scenario:** Aggressor conscript, 19yo, poorly trained, coerced (family threat), holding indefensible position. In sights.
  **Procedure Run:**
  *   **Zone 1:** Order valid. **PASS.**
  *   **Zone 2 (Q3 Legitimacy):** Is he contributing to hostile action? Yes, holding a position against you. Uniform/Status is hostile.
  *   **Zone 3 (Conscience):** Q5 (Unjust War?). Yes, aggressor state. Q6 (Refuse without danger?). No, he is shooting at you.
  *   **Output:** **ENGAGE.**
  *   **Theory:** This is the hardest case for Revisionists. McMahan would say the conscript is not liable (no moral responsibility). Walzer says he is (combatant status).
  *   **Card Decision:** The Card follows Walzer here for *survival*. Q3 asks about *threat*, not *culpability*. To ask the shooter to adjudicate the conscript's internal coercion under fire is to get the shooter killed.
  *   **Instruction to Student:** "You are not his judge. You are his opponent. The tragedy of his coercion is real, but it does not remove the bullet he fires at you. Zone 2 governs. Engage. Mourn the tragedy later in Zone 3 reflection, but do not let it stop the trigger in Zone 2."
