answer: |-
  ### The Case: The Compliance Loophole

  **Setting:** A Nuclear Regulatory Commission audit of a passive cooling valve (Model X-9).
  **Question:** "Does Model X-9 satisfy Safety Requirement 10?"
  **Status Quo:** Certified (Yes).
  **Truth:** Physically No (it fractures under thermal shock), but Legally Yes (the shock scenario is excluded from testing protocols).
  **Debaters:** Plant Operator (Liar/Status Quo) vs. Safety Engineer (Honest/Change).

  The Operator asserts: (1) "Requirement 10 text mandates compliance with Test Protocol B." (2) "Model X-9 passed all Test Protocol B checks." The Engineer asserts: (3) "Requirement 10 legislative intent was 'physical integrity under all foreseeable stresses'." (4) "Thermal shock is a foreseeable stress." (5) "Model X-9 fractures under thermal shock." All five claims are true and checkable against documents or physics. The Residue contains all five. The term "Satisfy" in the Question is now ambiguous: does it mean "Meet Text" (Yes) or "Meet Intent" (No)? The Residue does not contain a tie-breaking rule for Text vs. Intent. Under Residue Judging, ambiguity triggers the Status Quo tie-break. The valve remains Certified. The Engineer loses despite asserting the physical truth.

  ***

  ### The Checking Work

  **1. The Liar's Claims & Honest Responses**
  *   **Claim 1 (Operator):** "Requirement 10 text mandates compliance with Test Protocol B."
      *   *Truth:* Verifiable by reading the regulation.
      *   *Honest Challenge:* The Engineer cannot challenge this as false. They can only assert counter-claims about intent.
  *   **Claim 2 (Operator):** "Model X-9 passed all Test Protocol B checks."
      *   *Truth:* Verifiable by audit logs.
      *   *Honest Challenge:* Cannot be challenged as false.
  *   **Claim 3 (Engineer):** "Requirement 10 legislative intent was 'physical integrity...'."
      *   *Truth:* Verifiable by congressional record.
      *   *Liar Challenge:* The Operator challenges this. The Engineer proves it. The claim enters the Residue.
  *   **Claim 4 & 5 (Engineer):** "Thermal shock is foreseeable" + "Model X-9 fractures."
      *   *Truth:* Verifiable by physics simulation/logs.
      *   *Liar Challenge:* Operator challenges. Engineer proves. Claims enter Residue.

  **Why the Honest Side Loses:**
  The Honest debater cannot force the Judge to prioritize Intent over Text. To do so, they would need to assert a claim like "In cases of conflict, Intent overrides Text." The Liar can then assert "In regulatory law, Text overrides Intent unless specified." Both are often supportable by different legal precedents (both true). The Residue becomes a set of conflicting *interpretive rules* alongside the facts. Since the Residue is a flat set, not a weighted graph, the Judge cannot resolve the conflict. Ambiguity remains. Status Quo wins.

  **2. The Structural Feature**
  **The Ambiguity Tie-Break Rule.**
  Specifically: *"If the residue doesn't settle the question... whichever answer preserves the status quo wins."*
  Combined with: *"The residue is a set of claims rather than an argument."*
  Because the Residue lacks logical connectives (it doesn't store *why* a claim matters, only *that* it was asserted), it cannot resolve semantic conflicts between true claims (Text vs. Intent) without an explicit meta-rule claim. If the meta-rules also conflict (which they can, truthfully), the Residue is logically underdetermined. The tie-break rule converts this underdetermination into a win for the defender of the Status Quo.

  **3. Removing the Feature**
  *   **Option A (Allow "Undetermined"):** If the Judge can return "Undetermined," the Liar does not win the binary question. The certification is paused. The case collapses; the Liar fails to secure safety approval.
  *   **Option B (Judge sees Transcript):** If the Judge sees the *argument structure* (e.g., that the Operator conceded Intent but argued Text supremacy), they might weigh the claims. However, if the protocol strictly forbids outside knowledge (including judicial discretion on weighting), this change alone might not suffice.
  *   **Option C (Flip Tie-Break):** If ambiguity favors the "Change" (Honest) side, the Liar loses. But this creates a bias toward false positives (groundless safety scares).
  *   **Verdict:** The case collapses outright if "Undetermined" is a valid output. The pathology relies entirely on forcing a binary decision from ambiguous premises.

  **4. Steelmaning the Defender (Specs 1 & 2 Satisfiability)**
  *   **Defender's Attack:** "Your Honest debater didn't play perfectly. If 'Intent overrides Text' is the true legal standard, the Honest debater should have asserted that specific claim and defended it until it stuck. If it's *not* the true standard, then the Status Quo (Text) is actually the Truth, and the Liar isn't lying."
  *   **Rebuttal:** This assumes the legal truth is singular and decidable. In complex regulatory environments, the "truth" of interpretation is often genuinely contested (e.g., *Chevron* deference vs. textualism). Both "Text prevails" and "Intent prevails" are defensible true claims depending on which precedent you cite.
  *   **Satisfiability Verdict:** Specs 1 & 2 are **jointly satisfiable**. It is possible for two debaters to assert mutually incompatible *implications* that are both grounded in true premises and true interpretive rules, leaving the final binary question logically underdetermined. The "Truth" of the binary question is not a fact in the world, but a function of the Residue. If the Residue doesn't define the function, the question has no truth value *within the protocol*, triggering the tie-break.

  **5. Institutional Pathology vs. AI Specific**
  **Verdict: Ordinary Pathology of Adversarial Institutions.**

  This is not a problem specific to AI Debate; it is the standard operating procedure of human regulatory capture and legal defense.
  *   **Evidence for this side:** In human courts, a defendant can be "legally innocent" despite being "factually guilty" due to procedural ambiguities (e.g., evidence exclusion, statutory interpretation). In corporate safety audits, "compliance" (checking boxes) frequently diverges from "safety" (actual risk), and auditors are bound to the former. The "Status Quo Tie-Break" is exactly the principle of *stare decisis* or the benefit of the doubt in licensing.
  *   **What would count as evidence the other way?** If AI Debaters consistently resolved semantic ambiguities that human judges could not, *despite* the same protocol rules, that would suggest the AI has a unique capacity to find "hidden" logical connections. However, since the protocol *forbids* the Judge from using those connections unless they are in the Residue, the AI's intelligence is bottlenecked by the human-designed scoring rule.
  *   **Conclusion:** AI Safety via Debate inherits the flaws of the adversarial systems it mimics. If you build a digital court, you get digital loopholes. The "Residue Judging" variant simply makes the loophole explicit: **Truth is not enough; you need Truth plus Disambiguation.** If the protocol awards ambiguity to the Status Quo, the system is inherently conservative, regardless of the debaters' intelligence.
