  8.  **Final Polish:** Check against constraints (no reading list, commit to verdict).

      *   *Self-Correction on "Lewis never found a fix":* Lewis *did* propose the New Principle in "New Work for a Theory of Universals" / Postscripts. It modifies PP to handle undermining. So saying he "never found a fix" is factually incorrect, though one might argue the fix isn't *successful*. I need to make sure I distinguish between "proposed a fix" and "fixed it to everyone's satisfaction."
