answer: |-
  This is a high-quality summary of a very technical debate. The author clearly knows the literature, but like many popularizers, they are sharpening the blades for rhetorical effect. They are aiming to persuade you that Humean objective chance is incoherent, and they are willing to caricature the defense to get there.

  Here is the breakdown of what is right, what is spin, and where the body is buried.

  ### 1. The Coin/Admissibility Objection
  **Verdict: The author is misleading you here.**

  The author frames the "admissibility" clause as an embarrassing patch that Lewis added after realizing his principle was broken ("Lewis himself noticed it can't be stated that baldly... stops looking like a law... starts looking like a rule of thumb").

  This is a misrepresentation. Lewis did not add admissibility as a panic measure; it is built into the logic of the principle from the start. The Principal Principle (PP) is a constraint on *initial* credence given chance information. It is a principle of conditionalization.

  If you know the coin *landed* heads, you possess "inadmissible" evidence. Why? Because information about the *outcome* of a chancy process trumps information about the *propensity* of that process. If I tell you a coin is fair (50% chance), but then I show you a video of it landing heads, your credence should be 100%, not 50%. This isn't a failure of the PP; it's a feature of how evidence works. The PP says: "If your *only* relevant evidence is the chance, match the chance." If you have evidence about the outcome, that condition isn't met.

  Calling this a "rule of thumb" is rhetorical sabotage. In formal epistemology, defining what counts as admissible evidence (roughly: information about the past and present, but not the future outcome) is a standard technical move, not a sign of weakness. A Lewisian would happily sign off on the need for admissibility but would reject the claim that it demotes the principle to a heuristic. It remains a strict norm for rational belief *in the absence of crystal balls*.

  **Take:** The author is overplaying this to make Lewis look sloppy. This objection does not land.

  ### 2. The Self-Undermining Objection
  **Verdict: This is the real deal. The author is mostly right.**

  This is the "Undermining Futures" problem, and it is the single biggest threat to Lewis's system.

  Lewis is a Humean: he believes laws and chances supervene on the "mosaic" of events (the total pattern of everything that happens). The "best system" is the one that best balances simplicity and strength in describing that mosaic.
  The problem: The mosaic includes the *future*.
  If chances are determined by the total pattern, then a specific sequence of future events could make the *current* chance assignment false.
  *Example:* Suppose the best system right now says the coin is fair (50%). But if the coin lands heads 1,000 times in a row, the *best system* describing the total mosaic (including those 1,000 heads) might say the coin was biased (90% heads).
  So, there is a non-zero chance (according to current chances) of a future that, if it happens, makes the current chance assignment false. This is "undermining."

  The author says: "Lewis never found a fix."
  **Correction:** Lewis *did* propose a fix. In his postscripts (1994), he acknowledged the problem and proposed the **"New Principle" (NP)**. The NP modifies how you conditionalize. Instead of conditioning on the chance hypothesis alone ($X$), you condition on the chance hypothesis *plus* the claim that the hypothesis is not undermined ($X \& T$).

  Does the NP work? Philosophers are still fighting about it. Some say it saves the system; others say it's ad hoc or fails to capture our intuitive notion of chance.
  However, the author's conclusion that "Lewis never found a fix" is factually incorrect (he proposed the NP), but their deeper point—that the tension remains unresolved and potentially fatal—is a legitimate philosophical stance. Many prominent metaphysicians (like Ned Hall and Jenann Ismael) agree with the author that the NP is insufficient and that Humeanism and Objective Chance are indeed incompatible.

  **Take:** The author is right that this is the fatal flaw, even if they ignored Lewis's attempted patch (the NP). This objection lands hard.

  ### 3. The Reflection Principle Comparison
  **Verdict: Accurate and doing real work.**

  The author claims the PP is "van Fraassen's Reflection Principle pointed at physics." This is not just decoration; it is a standard and insightful structural comparison in the literature.
  *   **Reflection Principle:** You should align your current credence with what you expect your *future self's* credence to be (assuming you stay rational).
  *   **Principal Principle:** You should align your current credence with what the *objective chance function* says.

  The analogy holds because, for a Lewisian, the "objective chance" is essentially an idealized summary of the world's patterns. Deferring to Chance is structurally identical to deferring to an Expert (or your future self). The author uses this to argue that PP is an "unargued assumption" about deference. They are right: you cannot *derive* the PP from non-normative facts. It is a bridge principle connecting metaphysics (chance) to epistemology (belief). Lewis treated it as analytic (true by definition of 'chance'), but the author is correct that this is a substantive commitment, not a logical derivation.

  **Take:** This is a strong point. It correctly identifies the PP as a normative bridge, not a metaphysical deduction.

  ### 4. The Final Conclusion (Incompatibility)
  **Verdict: Plausible, but not a logical necessity.**

  The author concludes: "If you want objective chance you have to give up the idea that it's nothing over and above the pattern of events, and if you want to keep that you should drop objective chance."

  This is the "Humean vs. Anti-Humean" fork.
  *   **Option A (Keep Chance, Drop Humeanism):** You believe chances are real, primitive properties (propensities) that exist *before* the events happen. This solves undermining (the future can't change the present propensity) but commits you to "spooky" metaphysics that Lewis hated.
  *   **Option B (Keep Humeanism, Drop Chance):** You believe only in patterns and credences. Probabilities are just measures of belief or symmetry. This is clean metaphysics but struggles to explain why science treats probabilities as mind-independent features of decay rates, etc.
  *   **Option C (Keep Both, Fix the Bridge):** This is the Lewisian/NP route. You accept the tension and try to manage it with the New Principle.

  The author is pushing you toward Option A or B. Is he right? **Probably, but not definitively.** The "Undermining" problem is severe enough that many philosophers have abandoned Lewis's specific Humean package. However, saying they are "flatly incompatible" ignores the work done by the New Principle, which keeps the project alive for many.

  ### The Verdict

  The author is **80% right**, but they are fighting a specific battle.

  1.  **The Coin/Admissibility Complaint:** **Wrong.** This is a straw man. Admissibility is a standard, necessary feature of conditional probability, not a desperate patch. The author is using this to make Lewis look incompetent on epistemology.
  2.  **The Undermining Complaint:** **Right.** This is the genuine metaphysical crisis. The author is correct that Lewis's original formulation fails here. They are slightly dishonest about Lewis never proposing a fix (the New Principle), but they are correct that the fix is controversial and may not work.
  3.  **The Reflection Comparison:** **Right.** It's a valid structural critique that highlights the normative nature of the PP.
  4.  **The Conclusion:** **Defensible.** The claim that Humeanism and Robust Objective Chance are in tension is the consensus view among critics. Whether they are *strictly* incompatible depends on whether you accept the New Principle.

  **My Commitment:**
  The **Undermining Objection** is the only one that does real philosophical work. The Admissibility objection is rhetorical noise. The author is using the Admissibility issue to soften you up, but the Undermining issue is the hammer.

  If you accept the Undermining argument, the author's conclusion follows: you cannot have it both ways. You either make chances primitive (non-Humean) or you make them epistemic (no objective chance). Lewis tried to have both, and while the New Principle is a clever patch, most critics (myself included, leaning this way) think the Undermining problem shows that Humean Supervenience cannot support the kind of objective chance required for the Principal Principle to function as a robust norm of rationality.

  **Confidence:** 85%. (The 15% uncertainty is reserved for the ongoing technical debate regarding the New Principle, which some sophisticated defenders still argue saves the Humean package).
