          2.  Glastonbury (Clear fail, medieval tools, high motive).
          3.  Schliemann (Partial success, found *a* city, wrong label).
      *   *Framework Fit:* The provenance model handles Hitler Diaries best (ink/paper = artifact analysis). It handles Glastonbury well (motive/chain). It struggles with Schliemann because the artifact (the city) is real, the label is wrong. The model checks "is this the object?" not "is this label correct?"
      *   *Swap:* Maybe the "Donation of Constantine" (forged document). Fits the "text about text" and "self-signed authority" better than Schliemann.

  9.  **Historian's Missing Questions & Analogy Limit (Task 8):**
      *   *Missing:* Contextual plausibility (ritual practice). Would they bury a king like that? Does the burial style match 6th century vs 12th century? (Archaeology of practice).
      *   *Misleading Analogy:* Software provenance assumes a "ground truth" exists (the source code). History often *constructs* truth. In software, a binary is either signed or not. In history, "Arthur" is a concept that changes. The analogy breaks on *ontology* (what exists) vs. *epistemology* (what we know).

  10. **Drafting & Refining:**
