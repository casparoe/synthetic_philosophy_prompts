answer: |-
  ### 1. Facts and Critical Dependencies

  Your summary is solid for pop-history, but two details shift the weight of the analysis. First, Henry II died in 1189, two years before the 1191 discovery. The story that he tipped off the monks relies on him planting the seed before his death, leaving the execution to his successors or the monks acting on stale intel. Second, Gerald of Wales wrote his account around 1193, not immediately in 1191. He was not a neutral observer; he was a royal clerk seeking promotion, making him an auditor with a vested interest in pleasing the new king (Richard I) or stabilizing the realm.

  The verdict hangs on the **lead cross**. If the cross was inscribed *before* the dig began, it is a "pre-signed commit." If it was inscribed *during* the dig, it is part of the build process. Most historians suspect the inscription was added to the cross to match the narrative. If the cross is a forgery, the entire chain collapses because it is the only unique identifier (the "hash") linking the bones to the name "Arthur." Without it, you just have two old skeletons in a coffin.

  ### 2. Provenance Mapping

  In your vocabulary, the **Trust Anchor** is the Abbey itself. They control the private key (the cemetery) and issue the certificate (the discovery). This is a self-signed root, which is inherently insecure.

  **Gerald of Wales** acts as the third-party auditor. In software terms, he is a Certificate Authority (CA) vouching for the Abbey. However, he is not independent. He benefits from a stable kingdom (royal interest) and his own career advancement. His report is the only surviving "log file" of the event. Later chronicles are just mirrors of his repository; they add no redundancy, only replication.

  **The Lead Cross** is metadata attached to the artifact. Does it add weight? Only if the paleography (script style) matches the 6th century. In 1191, no one could reliably distinguish 6th-century Latin script from 12th-century script. To a contemporary skeptic, the cross is just a lead tag with writing on it. It adds zero cryptographic security because the verification algorithm (reading the script) cannot detect forgery.

  **The Skeptic Test:** A sharp skeptic in 1191 needed to witness the *start* of the dig. They needed to see the undisturbed earth layer above the grave (stratigraphy). They needed to verify that no tunnel existed from the side. Without sealing wax on the soil or continuous video surveillance, the chain of custody is broken the moment the monks start digging alone.

  ### 3. Evidence and Falsifiability

  Could evidence exist in 1191 to prove this was Arthur? **No.** This claim is unfalsifiable by the technology of the time.

  There was no DNA testing, no carbon dating, and no precise osteology (study of bones) to determine age at death with accuracy. The only potential proof would be an artifact buried with the body matching a specific, unique historical record (e.g., a sword with a known inscription). But Arthur's historical existence was already mythologized. You cannot verify a legend against a skeleton without a ground truth for the legend.

  This suggests fraud rather than error. If the identification were merely an honest mistake, the monks would have found a grave and guessed. But the lead cross is too specific. It functions like a hardcoded password. When the evidence matches the desired outcome too perfectly without the ability to verify it, the threat model points to intentional manipulation.

  ### 4. Philosophy of Testimony

  The argument you are recalling is from David Hume (18th century), though the intuition is older. Hume argued that when someone reports a miracle, you must weigh two probabilities: (1) the probability that the miracle actually happened, and (2) the probability that the witness is lying or mistaken. You should only believe the report if the lie would be *more* miraculous than the event.

  **Plain English:** Is it more likely that King Arthur rose from the dead and was found, or that monks lied to get money?

  **Priors in 1191:** The audience's "background knowledge" (priors) differed from ours. To them, Arthur was not a myth but a missing historical king. The "miracle" was not his existence, but the discovery. Therefore, the bar for evidence was lower. They weren't gullible; they were operating with a different dataset where heroes physically lingered in the land.

  **Motives:** Asking "who benefits?" is not an *ad hominem* attack (attacking the person); it is a structural security check. In supply chain security, you always check if the signer benefits from the signature. If the Abbey gets revenue, their signature is discounted. This is a valid defeater for trust, not a logical fallacy.

  ### 5. Legend and History Feedback

  You identified the recursive loop correctly. Before 1191, Avalon was a mythical island. After 1191, Avalon was Glastonbury. The dig didn't just discover history; it compiled the legend into a physical address.

  Did the legend become history? No. The *belief* became history. The event of the digging is historical fact (we know they dug). The content of the discovery (Arthur) is legend. Historians handle this via "reception history"—studying how later generations believed the past, rather than what the past actually was. The feedback loop is standard: history provides authority to legend, legend provides narrative to history. The pipe runs both ways because the "past" is only accessible through the stories told about it.

  ### 6. Epistemic Position

  Does "text about text" put us in a worse position than other medieval events? **No.** This is the standard state of medieval history. We rarely have artifacts; we have chronicles copying chronicles.

  The Glastonbury case is not epistemically unique; it is just high-stakes. We are in the same position regarding Caesar's battles or Jesus's miracles. The difference is that the Glastonbury bones were destroyed (at the Dissolution of the Monasteries), so we cannot re-test them. If the bones still existed, we could carbon-date them today, breaking the 1191 trust chain. Since they are gone, we are locked into the 1191 logs.

  ### 7. Stress Test: Hitler Diaries vs. Schliemann

  Let's rank them using your provenance model (1 = Clean, 5 = Compromised):

  1.  **Schliemann at Troy (1870s):** Rank 3. He found a city (artifact exists). He labeled it "Priam's Troy" (metadata mismatch). He damaged layers during excavation (broken chain of custody). The provenance model struggles here because the *object* is real, but the *identity* is wrong. Your model checks "is this binary signed?" not "does this binary do what the label says?"
  2.  **Glastonbury Bones (1191):** Rank 4. Beneficiary self-signed. No independent audit. Artifact lost. High motive.
  3.  **Hitler Diaries (1983):** Rank 5 (Total Fail). Modern tools allowed ink and paper analysis (artifact forensics). Chain of custody was broken (appeared suddenly). Provenance model handles this best because modern cryptography (scientific testing) exists to verify the "signature" (ink age).

  **Critique:** The provenance model handles the Hitler Diaries best because there is an objective ground truth (chemical composition of ink) available to verify the claim. It handles Schliemann badly because it assumes a binary "authentic/fake" status. Schliemann found a real ancient city; he just lied about which one. The model flags the custody break but doesn't easily capture "right object, wrong label."

  **Better Comparison:** The **Donation of Constantine** (8th century). A document claiming the Emperor gave authority to the Pope. It was a forgery used for centuries. Like Glastonbury, it was text-based, self-signed by the beneficiary (the Church), and unfalsifiable until linguistic analysis (philology) proved the Latin style was wrong centuries later. This fits your "text about text" constraint better than Schliemann.

  ### 8. Historian's Missing Questions & Analogy Limit

  **Missing Questions:**
  Your checklist misses **material culture consistency**. A historian asks: "Does the burial rite match the claimed era?"
  *   Was the coffin style 6th century or 12th century?
  *   Was the body oriented correctly for a Christian king of that time?
  *   Are there grave goods consistent with 500 AD?
  In software, the code either runs or it doesn't. In history, the "code" (burial) might run but look like a legacy patch applied to a new system. Monks in 1191 might not know 6th-century burial customs, leaving anachronisms a modern historian could spot (if the bones remained).

  **The Misleading Analogy:**
  The analogy breaks on **Ontology vs. Epistemology**.
  In software, the "Ground Truth" (the source code) exists independently of the build. In history, the "Ground Truth" (the past) is inaccessible. We only have the build artifacts (texts/bones).
  Your model assumes there is a "real Arthur" to compare against. But "Arthur" is a construct. If the monks believed they found Arthur, and the kingdom stabilized, the *function* of the artifact was satisfied regardless of biological truth. In software, a signed binary that crashes is useless. In history, a forged relic that inspires faith is "successful." The provenance model checks for integrity (did it change?), but history often cares more about utility (did it work?).

  **Summary:** Your intuition is correct. This was a supply chain attack on the national narrative. The monks compiled a legacy branch (Arthurian legend) into the mainline (History) without proper code review, signed it themselves, and deployed it to production (the tomb). The system ran on it for centuries.
