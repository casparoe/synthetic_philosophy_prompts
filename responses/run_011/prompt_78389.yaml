  2.  **Fact-Check & Critical Dependencies (Task 1):**
      *   *Facts:* 1184 fire is correct. 1191 discovery is the standard date. Gerald of Wales (Giraldus Cambrensis) is the main source, but he wrote about it later (around 1193 in *De Principis Instructione*, not immediately in 1191). Adam of Damerham is another source but later (13th century). The lead cross is key. Henry II died in 1189, so the tip-off theory involves him pre-death or Richard I. The Welsh bard connection is specific to Gerald.
      *   *Critical Dependency:* The lead cross inscription. If the cross existed and had a specific inscription, it's the "signature." If it was lost/missing quickly, it's a "self-signed cert" that vanished. The timing relative to Henry II's death (1189) vs. discovery (1191) matters for the motive (Henry wanted to quell Welsh rebellion using Arthur myth).
      *   *Correction:* Gerald didn't write it *within a couple of years* in the sense of a contemporary report; his account is slightly later and partisan. The "Welsh bard" tip is Gerald's specific claim, not necessarily independent.
      *   *Verdict Flip:* If the cross was seen by independent parties *before* the reburial, it strengthens the chain. If only monks handled it before Gerald saw it, it's weak.

  3.  **Provenance Mapping (Task 2):**
      *   *Trust Anchor:* The Abbey (beneficiary). This is the root compromise.
      *   *Independent Links:* Gerald is the main validator. Was he independent? He was a royal clerk, but also seeking promotion. He wasn't a monk of Glastonbury. He's a "third-party auditor," but a compromised one (royal interest).
      *   *Lead Cross:* It's a "metadata tag" attached to the artifact. If the inscription matches known lore, it's high probability of fabrication (overfitting). If it's obscure, maybe more weight. It adds weight only if the script/style matches 6th century (unlikely they cared then) or if it was verified by someone who knew Welsh/Latin paleography (unlikely in 1191 to distinguish 6th vs 12th century script).
      *   *Skeptic Test:* A skeptic in 1191 needs stratigraphy (layers of soil), dating of the coffin wood, or independent witness to the *dig* start to finish. Without photography or sealing wax, "chain of custody" is purely testimonial.

  4.  **Evidence in Principle in 1191 (Task 3):**
      *   *Could it be proven?* No DNA, no carbon dating.
      *   *Unfalsifiable?* Mostly. Unless the body had a wound matching a specific recorded death (Mordred's spear?), but that's legend, not history.
      *   *Fraud vs. Error:* If the claim is "This is Arthur," it's unfalsifiable. If the claim is "This body dates to 500 AD," they couldn't verify that. So it's unfalsifiable by 1191 standards. This leans toward fraud because the payoff is too high and the verification too low.

  5.  **Philosophy of Testimony (Task 4):**
      *   *Hume's Maxim:* No testimony is sufficient to establish a miracle unless the falsehood of the testimony would be more miraculous than the miracle itself. (Plain English: Is it more likely they are lying/mistaken than that Arthur exists and is here?)
      *   *Priors:* In 1191, Arthur's existence was not a "miracle" in the supernatural sense, but a historical uncertainty. The prior probability of Arthur existing was high. The prior probability of *this* being him was low.
      *   *Motives:* Not ad hominem. In provenance, motive is part of the threat model. If the signer benefits, you discount the signature. It's a structural check, not an attack on character.

  6.  **Legend/History Feedback (Task 5):**
      *   *Recursive:* The dig created the "fact" that Glastonbury = Avalon. Before 1191, Avalon was mythical. After, it was a place.
      *   *History vs. Belief:* The *event* of the dig is history. The *content* (Arthur) is legend. The feedback loop is real: history consumes legend to produce authority, legend consumes history to produce substance. Historians handle this via "reception history" (how later generations viewed the past).

  7.  **Epistemic Position (Task 6):**
      *   *Text about Text:* Standard for medieval history. We rarely have artifacts. We have chronicles. Glastonbury is *not* worse than most events, except that the artifact (bones) was destroyed later. We are in the same boat as knowing about Caesar's battles—textual transmission all the way down.

  8.  **Stress Test: Hitler Diaries vs. Schliemann (Task 7):**
