answer: |-
  Dear Colleague,

  It is a rare pleasure to encounter a writer who has codified their intuition into a discipline as rigorous as your reportable line, and rarer still to see that discipline intersect so cleanly with the hard problems of consciousness. You ask me to translate a specific triad of philosophical claims into the vocabulary of your craft, and then to sift the residue for what remains untranslatable. I will attempt this without the comfort of lists or headings, trusting that the progression of the argument will serve as its own structure.

  To begin with the distinction between access consciousness and phenomenal consciousness, we must locate where the mind of the character meets the page. In your craft vocabulary, access consciousness maps almost perfectly onto the interior states your rule permits. When you write what a character could say if asked, you are writing access content: information available for report, reasoning, and the control of action. This is the domain of direct thought, of deliberation, of the things a focalizer can explicitly claim as their own. It is the territory of telling, though not necessarily clumsy telling; it is the tellable interior. Phenomenal consciousness, by contrast, is the raw feel of the experience itself, the qualia that precedes or exceeds the label. In craft terms, this is the sensory texture, the emotional resonance, the rhythm of the sentence that evokes a state without naming it. It is what is shown rather than told. When you restrict yourself to the reportable line, you are effectively banning the direct narration of phenomenal consciousness as interior fact, forcing it to exist only as an external correlate—behavior, speech, syntactic arrangement. You are saying the character only has access to their access, and the phenomenality must be inferred by the reader from the evidence left behind.

  The second claim, the global workspace proposal, suggests that content becomes conscious only when broadcast widely enough to be available for those reports and actions. Translating this requires some care to avoid simplifying broadcast into mere exposition. In narrative terms, the global workspace is the scene's center of gravity. It is the moment a perception or thought achieves sufficient intensity to disrupt the status quo and drive the focalizer's next move. It is not simply what is spoken aloud, but what is privileged by the narrative focus. If a character feels a vague unease that never influences their choices, it remains in the cognitive dark; if that unease sharpens into a decision to leave the room, it has entered the global workspace. In your prose, this is the difference between a passing mention and a beat that turns the scene. The broadcast is the narrative emphasis that signals to the reader: this content is now active, now available to control the plot.

  The third claim, the overflow hypothesis, is where your rule and the philosophy collide most violently. The philosophers argue that phenomenal character overflows access; that there is more to experience than can be reported or used. They suggest the rich field of vision you feel is wider than the details you can name. In craft vocabulary, this would be the claim that the prose can convey a richness of interior life that exceeds the character's ability to articulate it. It is the assertion that a narrator can show us the depths of a feeling that the character themselves cannot grasp. Your rule denies this by construction. You refuse to render interior states that surpass the character's reportability. You are arguing, effectively, that there is no narrative overflow, or at least that it is unethical to simulate it as interior fact. If overflow exists in your sentences, it must exist in the gap between the reportable line and the reader's inference, carried by the arrangement of words rather than the description of mind. You are positing that the reader's sense of presence comes not from being told about the overflow, but from witnessing the struggle of access against the limits of language.

  Now I must turn to the residue report, treating it as the continuation of this letter rather than a separate inventory. I find that the concept of access consciousness comes across intact. The reportable line is a precise operational definition of access consciousness within the confines of a scene. There is no violence done here; the philosophical category and the craft rule are isomorphic. The global workspace proposal translates with minor strain. To call it broadcast is to risk implying a passive transmission, whereas in fiction, emphasis is an active construction of the writer. However, if we understand broadcast as narrative prioritization—the selection of certain details to drive action—the translation holds. The violence here is subtle: it requires us to treat the character's mind as a structural engine for the plot, which some psychological realists might resist, but for a novelist, it is a functional truth.

  The residue becomes problematic when we address the overflow claim. Here, the craft vocabulary lacks a true counterpart, or rather, it possesses a counterpart that functions differently than the philosophical claim intends. In philosophy, overflow is an ontological claim about the mind: there is more experience than report. In fiction, overflow is an aesthetic effect: there is more meaning than statement. If I translate overflow as subtext, I am doing violence to the concept, because subtext implies intentional communication beneath the surface, whereas phenomenal overflow is pre-communicative richness. If I translate it as stylistic resonance, I am closer, but I risk suggesting the writer is adding something extra, whereas the philosopher claims the experience itself is extra. The hard truth is that fiction is made of language, and language is inherently an access medium. You cannot write pure phenomenality; you can only write access to phenomenality. Therefore, the claim that phenomenal character overflows access has no direct counterpart in craft talk because craft cannot render the unreportable directly. It can only render the reportable in such a way that the unreportable is felt.

  This leads me to my reading of the residue and the question of whether your rule fails. I do not believe your rule fails because the craft vocabulary lacks a category. I believe it succeeds because the phenomenal/access distinction is less clear in practice than it appears in theory, and your readers' sense of presence is tracking something describable without it. When philosophers argue for overflow, they are often pointing to the density of experience that is lost in compression. When your readers feel presence, they are responding to the density of experience that is gained through constraint. By refusing to describe the overflow, you force the prose to embody it. The reader does not feel the character is present because you have successfully reported the unreportable; they feel the character is present because you have respected the limits of the character's access. The silence around the reportable line creates the illusion of depth.

  If you were to attempt to write the overflow directly, you would likely slip into purple prose or psychological telling, which distances the reader. By adhering to the reportable line, you are aligning the narrative structure with the cognitive reality of access. The presence your readers feel is not evidence of a phenomenal realm that exceeds your rule; it is evidence that the rule successfully mimics the way consciousness actually feels from the inside. We do not experience our own overflow; we experience our own access, surrounded by a halo of sensation we cannot quite name. Your rule captures the access and lets the halo remain a halo. The philosophical debate posits a gap between experience and report. Your craft closes that gap by making the report the only evidence of the experience. The residue, then, is not a missing category in your toolkit, but a misunderstanding in the philosophy. The overflow may exist in the brain, but in the mind-as-lived, there is only what can be brought to light. Your readers are not sensing a hidden depth you failed to write; they are sensing the integrity of the light you chose to shine.
