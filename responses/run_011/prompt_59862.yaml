answer: |-
  ### Part 1: Pre-Mortem Brainstorm (How This Procedure Breaks)

  Before I give you the tool, here is where it will fail in production. I've shipped certification code; I know where the bodies are buried.

  1.  **Certificate Shopping:** Engineers will tune the "Simplicity" metric. If a model has 4 parameters and fails the threshold, they'll hard-code two constants to make it look "simpler" and pass the gate.
  2.  **The Legacy Trap:** You have existing `CONSTRAINT` tags from 1998. This procedure will flag half of them as `CORRELATION` today. If you revoke the tag, you break certified workflows. If you don't, the procedure is a lie. You need a "Grandfathering with Warning" state, or you will be ignored.
  3.  **Rubber-Stamping:** 45 minutes is tight. Reviewers will treat this like an FAA form: fill boxes, sign, forget. If the "Judgment Calls" aren't highlighted, they will assume the math decided it.
  4.  **The "Mechanism" Loophole:** Engineers love saying a fit is "physically motivated." That phrase will become magic incantation to bypass the "Accidental Generalization" check unless you define "mechanism" operationally (e.g., "derived from conservation" vs. "looks like a conservation equation").
  5.  **Liability Diffusion:** If the procedure says `CONSTRAINT` and the bridge falls down, the reviewer will say "I followed the procedure." You need to ensure the signature line explicitly accepts *responsibility for the judgment*, not just *compliance with the form*.

  ---

  ### Part 2: The Modal Stability Protocol (MSP)

  **Time Budget:** 45 Minutes
  **Reviewers:** Lead + 1 Independent (Peer)
  **Output:** Tag (`CONSTRAINT` / `CORRELATION`), One-line Justification, Evidence Required to Flip Tag.

  **Instructions:** Answer gates sequentially. If you fail a gate, the tag defaults to `CORRELATION` unless a Human Override is triggered. **Bolded steps are Judgment Calls.** Do not treat them as math.

  #### Gate 1: Origin & Derivation (The "Necessity" Check)
  *   **Question:** Is this relation derived from a conservation law, symmetry argument, or dimensional analysis *without* free parameters fitted to specific data?
  *   **Pass:** Yes (e.g., $F=ma$, Conservation of Mass).
  *   **Fail:** No (e.g., Curve fit, neural net, empirical closure).
  *   **Action:** Pass $\rightarrow$ Go to Gate 2. Fail $\rightarrow$ Go to Gate 3.
  *   *Note:* A relation with fitted constants *can* pass Gate 3, but it starts with a deficit.

  #### Gate 2: Mechanism Independence (The "Accident" Check)
  *   **Question:** If we changed the material composition, geometry, or boundary conditions *slightly* (within the same physical class), would the relation still hold without refitting?
  *   **Pass:** Yes. The relation holds across different alloys, suppliers, or test articles.
  *   **Fail:** No. It holds only for "our" specific test articles or supplier.
  *   **Action:** Pass $\rightarrow$ `CONSTRAINT`. Fail $\rightarrow$ `CORRELATION`.
  *   **[JUDGMENT CALL]:** Defining "slightly." Changing from Aluminum 7075 to 6061 is slight. Changing from Metal to Composite is not. **Do not accept "we haven't tested that" as a Pass.**

  #### Gate 3: Predictive Novelty (The "Projectibility" Check)
  *   **Question:** Has the relation successfully predicted data points that were *excluded* from the fitting process (out-of-sample), specifically at the boundaries of the domain?
  *   **Pass:** Yes. Validated on blind test data or extrapolated range.
  *   **Fail:** No. High $R^2$ on training data only.
  *   **Action:** Pass $\rightarrow$ Go to Gate 4. Fail $\rightarrow$ `CORRELATION`.
  *   *Note:* $R^2$ is irrelevant here. A lookup table has $R^2=1.0$ and fails this gate.

  #### Gate 4: Compression & Simplicity (The "Best System" Check)
  *   **Question:** Is the relation significantly simpler (fewer bits/parameters) than storing the raw data it summarizes, without losing predictive accuracy?
  *   **Pass:** Yes. (e.g., 2 constants summarize 1000 points).
  *   **Fail:** No. (e.g., A 50-term polynomial or a lookup table).
  *   **Action:** Pass $\rightarrow$ `CONSTRAINT` (provisional). Fail $\rightarrow$ `CORRELATION`.
  *   **[JUDGMENT CALL]:** "Significantly." If the equation is opaque but compresses well, it passes. If it's simple but requires "correction factors" for every use case, it fails.

  #### Gate 5: Legacy & Failure History (The "Stability" Check)
  *   **Question:** Has this relation ever been observed to fail in a certified context, even once, outside a defined tolerance?
  *   **Pass:** No known failures.
  *   **Fail:** Yes. (Includes "It worked until Mach 8").
  *   **Action:** Pass $\rightarrow$ Finalize Tag. Fail $\rightarrow$ **Revoke `CONSTRAINT`** (Downgrade to `CORRELATION` or `DEPRECATED`).
  *   *Note:* This is the only gate that can revoke an existing `CONSTRAINT`.

  ---

  ### Part 3: Running the Candidates

  #### Candidate 1: Re-entry Capsule Drag Fit
  *   **Data:** $R^2 = 0.998$, Mach 2–8. Two fitted constants. Physically motivated form. Smooth past Mach 8.
  *   **Execution:**
      *   Gate 1 (Origin): **Fail.** It has fitted constants. (Goes to Gate 3).
      *   Gate 3 (Novelty): **Fail.** No data past Mach 8. The smoothness is a property of the polynomial/function, not the physics.
      *   Gate 4 (Compression): **Pass.** 2 constants is good compression.
      *   Gate 5 (Legacy): **Pass.** No failures *yet*.
  *   **Result:** **`CORRELATION`**
  *   **Justification:** High fidelity fit within domain, but lacks out-of-sample validation for extrapolation; functional form does not guarantee physical behavior beyond fitted range.
  *   **Evidence to Change Tag:** Wind tunnel or flight data at Mach 9+ confirming the trend without refitting constants.
  *   **Why you'll hate this:** You have a "physically motivated" model that looks perfect. Tagging it `CORRELATION` forbids certification extrapolation past Mach 8. You will have to pay for more testing. But $R^2$ is not modal force.

  #### Candidate 2: Momentum Conservation in Solver
  *   **Data:** Derived from symmetry. Holds in every test. Violated numerically on coarse mesh.
  *   **Execution:**
      *   Gate 1 (Origin): **Pass.** Derived from translation symmetry (Noether). No fitted constants.
      *   Gate 2 (Independence): **Pass.** Holds regardless of material or geometry.
      *   Gate 5 (Legacy): **Pass/Fail Ambiguity.** It "fails" on coarse mesh.
      *   **Human Override:** The failure is *numerical discretization error*, not physical falsification. The relation describes the continuum, not the grid.
  *   **Result:** **`CONSTRAINT`**
  *   **Justification:** Fundamental conservation law; numerical violations are implementation errors, not physical falsifications.
  *   **Evidence to Change Tag:** Discovery that the physical system itself does not conserve momentum (e.g., relativistic effects ignored at scale).
  *   **Note:** Enforce with a numerical tolerance (e.g., "Residual < $10^{-6}$"), but the tag remains `CONSTRAINT`.

  #### Candidate 3: Grain-Size vs. Yield-Strength (Hall-Petch variant)
  *   **Data:** Held for 10 years. Two alloys. One supplier.
  *   **Execution:**
      *   Gate 1 (Origin): **Fail.** Empirical fit (Hall-Petch is semi-empirical, but this specific curve is fitted).
      *   Gate 2 (Independence): **Fail.** Only holds for "two alloys we buy from one supplier." If Supplier B changes their heat treat, this breaks. It is an accidental generalization of *that supplier's process*, not a law of metallurgy.
      *   Gate 3 (Novelty): **Fail.** No validation on Alloy C or Supplier B.
  *   **Result:** **`CORRELATION`**
  *   **Justification:** Relation is contingent on specific manufacturing process history of a single supplier; lacks mechanism independence.
  *   **Evidence to Change Tag:** Validation across 3+ suppliers and 5+ alloy variants with identical coefficients.
  *   **Why you'll hate this:** It's worked for a decade. It feels like a law. But it's a "local regularity," not a constraint. If that supplier changes their furnace atmosphere, your simulation lies.

  ---

  ### Part 4: Limitations & The Philosophy Check

  **What this procedure cannot do:**
  1.  **Guarantee Truth:** It guarantees *stability*, not truth. A `CONSTRAINT` can still be wrong if the underlying physics is misunderstood (e.g., Newtonian gravity at relativistic speeds).
  2.  **Solve Numerical Stability:** Tagging momentum conservation as `CONSTRAINT` doesn't fix your coarse mesh. It just tells you that violating it is a bug, not a feature.
  3.  **Handle "Effective" Laws:** Some correlations are so robust (e.g., Ideal Gas Law at standard conditions) they function as constraints. This procedure forces you to admit they are technically correlations, which creates friction.

  **Does the Humean/Anti-Humean fight matter?**
  Bluntly: **90% Decoration.**
  In engineering, we cannot access "Necessity" (Anti-Humean). We only have "Best Systematization" (Humean). We tag based on predictive success and compression (Lewis's Best System), not because we perceive the "governing" force of nature.

  **The 10% Where It Matters:**
  It matters for **Candidate 2 (Momentum)**.
  *   **Strict Humean:** If the mesh violates it consistently, the "Best System" of our *simulation* includes the error term. A hardline Humean might argue the relation is only a `CORRELATION` of the numerical data we actually observe.
  *   **Anti-Humean (Governing):** The law *governs* the physics; the mesh is an imperfect representation. The tag must be `CONSTRAINT` because the violation is an error in *us*, not in *nature*.
  *   **My Stance:** I sided with the Anti-Humean intuition here. If you treat conservation laws as mere correlations because your mesh is coarse, you invite solver drift that violates energy/mass. You need the "Governing" intuition to justify enforcing the constraint *against* the data the solver is currently producing.

  ---

  ### Part 5: Confidence Assessment

  **Confidence in Main Claims:** High (85%).
  The distinction between "projectible" (law) and "accidental" (correlation) is load-bearing for certification. If you treat a supplier-specific fit as a `CONSTRAINT`, you are certifying a supply chain, not a physics model. That is a liability nightmare. The procedure forces that distinction into the open.

  **The One Point I'm Least Sure About:**
  **Gate 4 (Simplicity/Compression).**
  Defining "significantly simpler" is subjective. In the age of ML, a neural net might compress data well but be opaque. Is a trained NN a `CONSTRAINT`? My procedure leans toward "No" (CORRELATION) because it lacks counterfactual transparency, but a Humean might argue that if it predicts perfectly and compresses, it *is* the Best System. I am least sure if "interpretable form" should be a hard requirement for `CONSTRAINT`, or if predictive compression is enough. I opted for interpretable form in the examples, but that's a philosophical bias (Anti-Humean leaning) creeping into a Humean procedure. Watch that gate.
