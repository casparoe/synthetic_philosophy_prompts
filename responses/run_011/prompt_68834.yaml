prompt: |-
  I'm a backend engineer, zero history or philosophy training, and after an acquisition I've ended up as the de facto owner of a twelve-year-old internal service. Most of the people who built it are gone. My job for the next quarter is to write the "why is it like this" doc — the actual reasons, not the folklore — and the problem is that every account I collect contradicts some other account. One guy says the weird retry/backoff behaviour was added after a specific bad incident in 2014. Another says it came in through a vendor SDK and nobody ever chose it. A third says he wrote it himself over a weekend. I have git history, old tickets, Slack archives going back about nine years, two postmortems, and maybe six living ex-colleagues who'll do a 30 minute call.

  My instincts about which story to trust keep turning out to be garbage. The worst one: I treated three people independently telling me the same thing as strong evidence, then found a 2016 internal blog post all three had read and linked to, so it was one story with three mouths. Historians have apparently been grinding on exactly this problem with evidence way worse than mine — no logs, no version control, witnesses dead for millennia — so I want whatever part of that actually transfers, turned into something I can run. I hit maybe two or three of these claims a week, my manager signs off on the doc, and new hires will read it as fact, so writing down something merely plausible is worse than writing "we don't know."

  So: a procedure, in order, that I can work through on a single piece of testimony in about fifteen minutes. For each step, what question I'm asking, what would count as a good enough answer, and what I do if there isn't one. Specifically I want it to cover — how to test whether two accounts are genuinely independent or both descend from one origin; how much weight a hard trace (a commit, a ticket timestamp, a deploy log) carries against a confident first-person memory; what to do when the teller has something to gain or lose from the version they're giving; whether there's anything special about details that cost the teller something to admit; and when I should just declare the question unanswerable and stop repeating the story. Flag the steps that are really judgement calls dressed up as procedure, and skip the bibliography, I'm not going to read it.

  Then run it on three cases: (1) the retry/backoff dispute above, where the SDK story and the incident story can't both be true and the git history has been squashed; (2) an outage everybody tells identically, word for word, including the part about the on-call engineer's laptop; (3) a design decision whose only surviving evidence is a four-word commit message that points the other way from what everyone remembers. For at least one of them I want the answer I don't want — the one where my favourite story doesn't survive. And close with what this procedure fundamentally can't get me, so I stop hoping.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Backend engineer, no history/philosophy training, owner of a legacy service (12 years old).
      *   **Task:** Write a "why is it like this" doc (truth, not folklore).
      *   **Problem:** Contradictory accounts, unreliable memory, common sources masquerading as independent corroboration.
      *   **Constraints:** Needs a *procedure* (step-by-step), actionable in ~15 mins per claim. Must cover specific epistemic problems (independence, hard trace vs. memory, bias, costly details, knowing when to stop). Must flag judgment calls. No bibliography.
      *   **Deliverables:**
          1.  The Procedure (ordered steps, questions, success criteria, fallback).
          2.  Application to 3 specific cases (Retry/Backoff, Identical Outage Story, Commit Message vs. Memory).
          3.  One case must yield an unwanted result (favorite story dies).
          4.  Closing limitation (what this *can't* do).
      *   **Tone:** Pragmatic, engineering-focused, rigorous but not academic.

  2.  **Deconstruct the Historical Method for Engineering:**
      *   Historians deal with fragmentary evidence, bias, and oral tradition. Engineers have *more* data (git, logs) but often *noisier* context (squashed commits, lost Slack).
      *   *Key Concept 1: Source Criticism.* Where did this info come from? Is it primary or secondary?
      *   *Key Concept 2: Independence.* Are witnesses actually independent? (The user's specific pain point).
      *   *Key Concept 3: Incentive/Bias.* Why is this person telling me this?
      *   *Key Concept 4: Costly Signaling.* Details that hurt the teller are likely true.
      *   *Key Concept 5: Falsifiability.* Can I prove this wrong?

  3.  **Drafting the Procedure (The "15-Minute Audit"):**
      *   *Step 1: Provenance.* Where did this claim originate? (Oral vs. Written).
      *   *Step 2: Independence Check.* Are the sources actually distinct? (The "Common Ancestor" test).
      *   *Step 3: Hard Trace Conflict.* Does physical evidence contradict memory? (The "Commit > Memory" rule).
      *   *Step 4: Incentive & Cost.* Does the teller benefit? Do they admit fault? (The "Skin in the Game" test).
      *   *Step 5: The Stop Rule.* When to mark as "Unknown".
      *   *Constraint:* Must flag judgment calls.

      *Refining Step 2 (Independence):* This is the user's specific failure mode. Need a specific check for "Common Source."
      *Refining Step 3 (Hard Trace):* Need to define hierarchy of evidence.
      *Refining Step 4 (Bias):* Need to distinguish between "saving face" and "taking blame."

  4.  **Developing the Three Cases:**

      *   *Case 1: Retry/Backoff (SDK vs. Incident vs. Weekend).*
          *   Evidence: Squashed git, 3 oral accounts, 1 postmortem.
          *   Goal: Show how to weigh them.
          *   Outcome: Likely the Incident story is the "myth" created to justify the SDK limitation, or the Weekend story is the truth masked by the Incident postmortem. Let's make the "Incident" story the casualty. It's a common pattern: people invent a dramatic reason for a boring constraint.

      *   *Case 2: Identical Outage Story.*
          *   Evidence: Everyone says the exact same words, including specific detail (laptop).
          *   Goal: Test independence.
          *   Outcome: This is clearly a "Copied Narrative." The procedure should flag this immediately as low reliability despite high consensus.

      *   *Case 3: Commit Message vs. Memory.*
          *   Evidence: 4-word commit ("Fix race condition") vs. Oral history ("We did this for compliance").
          *   Goal: Hard trace vs. Memory.
          *   Outcome: The Commit wins. The "Compliance" story is likely retroactive justification. This is a good candidate for the "unwanted result" if the user *wants* the Compliance story (because it sounds more noble/strategic).

  5.  **Drafting the Content - Section by Section:**

      *   *Intro:* Acknowledge the role (Engineer as Archaeologist).
      *   *The Procedure:* Keep it tight. Use "If/Then" logic. Mark Judgment Calls clearly.
      *   *The Cases:* Apply the steps rigorously.
      *   *The Limitation:* What can't be known? (Intent without record, the "why" behind the "what").

  6.  **Refining the "Judgment Call" Flags:**
      *   I need to be honest. History isn't an algorithm. I need to point out where the user still has to use intuition, even with the procedure.
      *   Example: Deciding if a detail is "costly" is subjective. Deciding if a trace is "hard" enough is subjective.

  7.  **Review against Constraints:**
      *   15 mins per claim? Yes, steps are quick checks.
      *   Cover independence? Yes (Step 2).
      *   Cover Hard Trace vs. Memory? Yes (Step 3).
      *   Cover Incentives/Cost? Yes (Step 4).
      *   Cover "Stop Rule"? Yes (Step 5).
      *   Flag judgment calls? Yes.
      *   No bibliography? Yes.
      *   Unwanted result included? Yes (Case 3 or 1).
      *   Closing limitation? Yes.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the questions specific ("Ask: Did you see the ticket or hear about it?").
      *   *Critique:* Is the tone right?
      *   *Fix:* Keep it dry, engineering-focused. Use terms like "Single Point of Failure," "Root Cause," "Artifact."
      *   *Critique:* Case 1 needs to be resolved definitively based on the procedure.
      *   *Fix:* In Case 1, I'll prioritize the Postmortem (Hard Trace) over the Oral History, but note the Squashed Git reduces trace reliability. Actually, let's make the SDK documentation the tie-breaker. If the SDK had the limit *before* the incident, the Incident story is false.
      *   *Critique:* Make sure the "Unwanted Result" is clear.
      *   *Fix:* In Case 3, the engineer *wants* the decision to be strategic (Compliance), but the evidence says it was a hack (Race Condition).

  9.  **Final Polish:** Check the "Independence" step again. The user mentioned the "3 people read 1 blog post" issue. The procedure needs a specific "Upstream Check" to catch this.

      *(Self-Correction on Case 1)*: The prompt says git is squashed. So Hard Trace is weak. I need to rely on the Postmortem date vs. SDK release date. Let's assume the Postmortem exists. If the Postmortem *references* the SDK limitation as the cause, the Incident story is actually "We hit the SDK limit during an incident," which merges the two. But the prompt says they *contradict*. Okay, let's say Story A: "We wrote custom logic due to 2014 incident." Story B: "We used vendor SDK defaults." These are mutually exclusive regarding *origin*. If the SDK default matches the logic, Story B is more likely unless the Postmortem explicitly orders custom code. I will make the procedure kill the "Incident" story because it relies on oral tradition, whereas the SDK versioning is external hard data.

      *(Refining the "Judgment Call" flags)*: I will explicitly label them `[JUDGMENT CALL]` in the text.

      *(Final check on limitations)*: Don't promise intent. You can know *what* changed, rarely *why* without a direct record.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ## The 15-Minute Testimony Audit

  This procedure treats oral history as a buggy service and written records as logs. Your goal is not to find the truth, but to eliminate falsifiable claims. If a claim survives five minutes of attempted falsification, it is "provisionally accepted." If it fails, it is "folklore."

  **Timebox:** 15 minutes per claim. If the timer rings, the claim is marked "Unresolved."

  ### Step 1: The Upstream Check (Independence)
  **Question:** Is this account a primary observation or a repetition of a narrative?
  **Action:** Ask the witness: "Where did you first hear this story?" or "Did you write the code/read the ticket, or did someone onboard you with this explanation?"
  **Good Enough Answer:** "I wrote the PR," "I was on-call that night," or "I found the ticket #1234."
  **Failure Condition:** "Bob told me," "It's common knowledge," or "I read the wiki."
  **If Failure:** Trace the story upstream. If three witnesses all trace back to the same wiki page, blog post, or person, you have **one** data point, not three.
  **[JUDGMENT CALL]:** Deciding if a witness is "close enough" to the event to count as primary. (e.g., Did they merge the PR or just review it?)

  ### Step 2: The Hard Trace Hierarchy
  **Question:** Does a physical artifact contradict the memory?
  **Action:** Compare the claim against the evidence hierarchy.
  1.  **Network/Deploy Logs:** (Highest fidelity. Happened or didn't.)
  2.  **Code/Commits:** (High fidelity. Exists or doesn't. Message may lie.)
  3.  **Tickets/Postmortems:** (Medium fidelity. Written near the time, but narrative.)
  4.  **Oral History:** (Lowest fidelity.)
  **Good Enough Answer:** The memory aligns with the highest available fidelity layer.
  **Failure Condition:** Memory says X, Commit Log says Y.
  **If Failure:** The Hard Trace wins. Mark the memory as "Retrospective Justification."
  **[JUDGMENT CALL]:** Determining if a commit message is a "Hard Trace" or just another story. (e.g., "Fix bug" is low fidelity; "Revert PR #500" is high fidelity).

  ### Step 3: The Incentive & Cost Test
  **Question:** Does the teller benefit from this version, and does it contain "costly" details?
  **Action:** Analyze the story for face-saving vs. blame-taking.
  *   **Low Reliability:** Story makes the team look proactive, strategic, or heroic.
  *   **High Reliability:** Story admits laziness, accident, vendor lock-in, or technical debt.
  **Good Enough Answer:** The story includes a detail that makes the teller or the team look incompetent or constrained (e.g., "We didn't understand the docs," "We copied this from StackOverflow").
  **Failure Condition:** The story is too clean, heroic, or strategic without admitting friction.
  **If Failure:** Downgrade confidence. Treat as "Myth."
  **[JUDGMENT CALL]:** Assessing what counts as "costly." (e.g., Admitting a bug is costly; admitting a trade-off is not).

  ### Step 4: The Stop Rule
  **Question:** Have I exhausted the falsification attempts?
  **Action:** If Step 1 (Independence) fails AND Step 2 (Hard Trace) is missing/ambiguous, you cannot validate the claim.
  **Good Enough Answer:** You have at least one Primary Source + Hard Trace alignment OR two Independent Primary Sources.
  **If Failure:** Write "Origin Unknown" in the doc. Do not write the story.
  **[JUDGMENT CALL]:** Deciding if the risk of writing "Unknown" is higher than the risk of writing a plausible lie. (For your doc, "Unknown" is safer).

  ---

  ## Case Applications

  ### Case 1: The Retry/Backoff Dispute
  **Claims:**
  A. Incident Story: "Added after 2014 outage." (Oral, 3 witnesses)
  B. SDK Story: "Vendor SDK default." (Oral, 1 witness)
  C. Weekend Story: "Hacked in by Dave." (Oral, 1 witness)
  **Evidence:** Squashed Git (useless), 1 Postmortem (2014), Vendor SDK Docs (v1.0 release 2013).

  **Audit:**
  1.  **Upstream Check:** You interview the 3 Incident witnesses. All three cite the 2014 Postmortem link. **Result:** 1 Data Point, not 3.
  2.  **Hard Trace:** You check the Vendor SDK Docs (v1.0, 2013). The default retry policy matches the current implementation exactly. You check the 2014 Postmortem. It mentions the outage but *does not* mention changing the retry logic, only restarting the service.
  3.  **Incentive:** The Incident Story makes the team look responsive (we fixed it!). The SDK Story makes the team look passive (we didn't choose this).
  4.  **Verdict:** The SDK Story survives. The Incident Story is a retrospective narrative attached to a postmortem that doesn't actually support it.
  5.  **Doc Entry:** "Retry logic matches Vendor SDK v1.0 defaults (2013). 2014 Outage Postmortem does not reference logic changes. Origin likely vendor default, not incident response."

  **Outcome:** The "Incident" story (the most dramatic and commonly told) is killed.

  ### Case 2: The Identical Outage Story
  **Claims:**
  "All witnesses describe the outage identically, down to the on-call engineer's laptop model."
  **Evidence:** Slack archives, No Postmortem found.

  **Audit:**
  1.  **Upstream Check:** You ask Witness A: "How do you know about the laptop?" They say, "Everyone knows that part." You ask Witness B. They recite the exact same phrasing as Witness A. You find a Slack thread from 2018 where Witness A told the story to Witness B and C.
  2.  **Hard Trace:** No logs exist for that specific night (retention policy).
  3.  **Incentive:** The story makes the outage seem caused by hardware (bad luck) rather than system design (our fault).
  4.  **Verdict:** **Fail Independence.** This is a "Copied Narrative." The specific detail (laptop) is a "narrative anchor" added to make the story memorable, not evidence.
  5.  **Doc Entry:** "Outage cause disputed. Oral history cites hardware failure, but accounts are not independent (descend from 2018 Slack thread). No logs survive. Root cause Unknown."

  **Outcome:** The vivid detail is identified as a liability, not proof.

  ### Case 3: The Design Decision (Commit vs. Memory)
  **Claims:**
  Memory: "We chose NoSQL for compliance/data sovereignty reasons." (Strategic, Noble)
  Evidence: Commit Message (2015): "Switch to Mongo. SQL too slow for this shit." (Tactical, Angry)
  **Evidence:** 1 Commit, 4 Senior Engineers.

  **Audit:**
  1.  **Upstream Check:** Engineers were not there in 2015. They were told this by the CTO.
  2.  **Hard Trace:** The Commit Message is a primary artifact from the time of change.
  3.  **Incentive:** The Memory makes the architecture look planned and compliant (Good). The Commit admits performance panic and frustration (Bad/Messy).
  4.  **Cost Test:** The Commit Message is "costly." It admits emotional decision-making. The Memory is "cheap." It claims regulatory necessity.
  5.  **Verdict:** The Commit wins. The Compliance story was likely invented later to justify the tech stack to auditors or new hires.
  6.  **Doc Entry:** "Migration to NoSQL (2015). Commit history indicates performance pressure ('SQL too slow'). Compliance justification appears to be retrospective; no compliance tickets link to this migration."

  **Outcome:** The "Noble/Strategic" story (which you probably wanted to believe to feel good about the codebase) is killed. The system exists because of a performance panic, not a compliance strategy.

  ---

  ## What This Procedure Cannot Get You

  You need to stop hoping for **Intent**.

  This procedure can tell you *what* changed, *when* it changed, and *who* touched it. It can even tell you if the story people tell about *why* is a lie. It cannot tell you the actual *why*.

  In Case 3, the commit says "SQL too slow." That is the stated intent. But maybe the engineer was having a bad day. Maybe they were told to switch by a manager off-channel. Maybe "slow" was a proxy for "I don't know how to index this."

  The "Why" is a mental state that died with the thought. Unless it was written down *before* the action (a design doc) or *during* the action (a comment explaining the constraint), the "Why" is unrecoverable.

  **Your Constraint:** Your doc must distinguish between **Recorded Intent** (Design Docs, Tickets) and **Inferred Intent** (Commit messages, Code structure).
  *   If you have a Design Doc: You can write "Decision made for X."
  *   If you only have Code/Commits: You must write "Implementation suggests X, but origin unverified."

  Do not fill the gap with a plausible story. A gap in the documentation is better data than a lie. It tells the next engineer: "There is a risk here we don't understand." A lie tells them: "This is safe."

  **Final Rule:** If the procedure ends on "Unknown," and you write a story anyway, you are not the historian. You are the myth-maker. Don't do it.
