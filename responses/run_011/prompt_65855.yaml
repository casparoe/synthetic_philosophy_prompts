answer: |-
  # Question-Period Prep Sheet

  **Thesis Core:** Standing is a relational entitlement (not character-based). Hypocrisy grants the wrongdoer a claim against the blamer. Standing is norm-specific. Restoration requires the wrongdoer's forgiveness (not blamer's reform).

  **Audience:** Criminal Law Theorists (Discretion/Unclean Hands) + Strawsonians.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Restoration Deadlock (Moral/Law Hybrid)
  **The Objection:** "You claim standing is restored *only* by the wrongdoer's forgiveness, not the blamer's repentance. This makes moral reintegration contingent on the victim's whim. If the victim is vindictive or unreasonable, the reformed hypocrite is permanently silenced. This contradicts the basic moral intuition that genuine reform restores one's voice in the moral community."
  **The Reply:** Distinguish between the *authority* to blame and the *truth* of the blame. Repentance restores the blamer's moral status generally, but the specific *relational debt* to the wrongdoer remains until cleared. We shouldn't confuse "being a good person again" with "owing someone an apology." The wrongdoer holds the key to the specific relational lock because the injury was relational.
  **The Thin Spot:** This sounds like you're prioritizing the wrongdoer's power over the blamer's moral growth. If the wrongdoer refuses forgiveness maliciously, your view implies the reformed blamer is *still* a hypocrite if they blame. That's a hard pill to swallow.

  #### 2. The Institutional Mismatch (Criminal Law)
  **The Objection:** "Most of us work on prosecutorial discretion. Prosecutors represent the Sovereign/People, not themselves. On your relational view, does a prosecutor who evaded taxes lose standing to prosecute tax evasion? If standing is personal/relational, the State cannot have standing. Your theory renders itself irrelevant to public law."
  **The Reply:** My theory is explicitly about *interpersonal* moral blame, not institutional prosecution. The State's standing derives from its representative authority, not relational history. However, the *unclean hands* doctrine in equity is the bridge: even the State is barred when its conduct undermines the integrity of the process. I am explaining the moral underpinning of that equitable bar, not the mechanics of indictment.
  **The Thin Spot:** You are cordoning off half the room's expertise. If your theory doesn't explain state punishment, the criminal lawyers may view it as a niche moral theory with no legal bite.

  #### 3. The Unclean Hands Rationale (Criminal Law)
  **The Objection:** "You say the hypocrite's defect generates a claim *in the wrongdoer*. But the equitable doctrine of unclean hands is about the *court's integrity*, not the defendant's rights. A defendant with dirty hands can still invoke the doctrine. You've misidentified the beneficiary of the standing rule."
  **The Reply:** I am offering a moral reconstruction of the doctrine, not a doctrinal exegesis. The court protects its integrity *because* it recognizes the defendant's claim not to be judged by a violator. The defendant's right is the ground; the court's integrity is the upshot. Without the relational claim, the integrity concern is free-floating.
  **The Thin Spot:** If the case law explicitly grounds the doctrine in systemic integrity (which it often does), you are arguing against the black-letter law. The lawyers will cite cases; you'll be stuck with "moral reconstruction."

  #### 4. The Wrongdoer's Veto (Moral/Law)
  **The Objection:** "You grant the wrongdoer a 'claim' against the hypocrite. This gives the criminal moral power over the judge. If I murder someone, I supposedly gain a right to silence a hypocritical prosecutor. This inverts the moral hierarchy."
  **The Reply:** It is not a right to silence, but a right to *object to the specific authority*. The murderer is still liable to punishment; they merely have a complaint about *who* administers it. It's a procedural claim, not a substantive immunity. They can say 'Not you,' not 'Not ever.'
  **The Thin Spot:** In practice, "Not you" often functions as "Not ever" if no other blamer is available. It risks granting wrongdoers leverage they shouldn't have.

  #### 5. Norm-Siloing (Criminal Law)
  **The Objection:** "You argue standing is lost norm-by-norm. But in law, corruption is global. A cop who plants evidence loses standing to enforce *any* law, not just evidence rules. Trust is holistic. Your siloed view ignores the general erosion of authority."
  **The Reply:** Moral norms are distinct from institutional trust. While a corrupt cop loses institutional authority globally, morally, I can still blame a liar for lying even if I am a thief. The norm-violation must match to generate the specific relational claim. General distrust is a separate epistemic issue, not a standing issue.
  **The Thin Spot:** This relies on a sharp distinction between "moral standing" and "institutional trust" that may not hold in mixed contexts (like policing).

  #### 6. Reactive Attitudes Involuntariness (Strawsonian)
  **The Objection:** "Strawsonians view blame as a natural emotional response (resentment/indignation). You treat it as a normative entitlement. But I can't turn off resentment just because I lack standing. Your view is too intellectualized."
  **The Reply:** I am analyzing the *expression* and *validity* of blame, not the raw feeling. One can feel resentment but lack the standing to *voice* it as a moral demand. Standing regulates the communicative act, not the physiological reaction.
  **The Thin Spot:** Strawsonians often argue the feeling *constitutes* the blame. If you separate them, you might be changing the subject.

  #### 7. Moral Reform Irrelevance (Strawsonian)
  **The Objection:** "In the reactive attitudes framework, when a wrongdoer repents, we naturally modify our attitudes. You deny this for the blamer. If I reform, why am I still disabled? The moral community re-admits me."
  **The Reply:** Re-admission to the community is not the same as settling debts with specific individuals. You can be back in the community but still owe *me* an apology before you can judge *me*.
  **The Thin Spot:** This doubles down on Objection #1. It risks making your view overly transactional compared to the communal nature of Strawsonianism.

  #### 8. Third-Party Hypocrisy (Strawsonian/Law)
  **The Objection:** "What if the blamer violated the norm against a *third party*, not the wrongdoer? (e.g., I beat my wife, can I blame you for beating yours?) You say the wrongdoer holds the claim. But I didn't wrong *you*."
  **The Reply:** If the norm is universal, the violation undermines my commitment to the norm itself, which I invoke against you. However, strictly speaking, my theory suggests standing is stronger here because the relational debt isn't directly to you. But generally, violating the *same norm* signals a rejection of the authority I'm trying to wield.
  **The Thin Spot:** This is the classic "tu quoque" problem. If you admit standing remains in third-party cases, you weaken the "relational claim" core. If you deny it, you seem absurd.

  ---

  ### Strategic Assessment

  **The Killer Objection:**
  **#1 (The Restoration Deadlock).**
  If you cannot defend the claim that *only* forgiveness restores standing (and not repentance/reform), the most distinctive and aggressive part of your thesis collapses. It makes your view morally implausible. If you concede that repentance *can* restore standing, you move closer to the character view you are trying to reject.
  *Verdict:* This objection genuinely defeats the view if you hold the line too rigidly. You must soften the "only" without abandoning the relational core.

  **The Concession to Make Early:**
  **Concede on Institutional Standing (Objection #2).**
  Explicitly state in your opening or early Q&A: "This theory is designed for interpersonal moral blame. State prosecution operates on representative authority, which is a distinct mechanism."
  *Why:* This buys credibility with the criminal lawyers. It stops them from attacking you for not solving prosecutorial discretion. It isolates your thesis to the moral domain where it is strongest, allowing you to focus on the Strawsonians and the equitable doctrine as a *parallel* rather than a direct description of criminal procedure.

  **The Question to Hope Nobody Asks:**
  **"What if the victim is dead?"**
  (This is the specific instantiation of Objection #1).
  If standing is restored *only* by the wrongdoer's forgiveness, and the person you wronged (regarding the specific norm) is deceased, you can never regain standing to blame anyone on that norm again. This leads to the absurd result that dead victims permanently silence reformed blamers. There is no good reply to this without abandoning the "forgiveness only" condition.

  ### Decisive Advice
  Your "Restoration via Forgiveness" claim is too strong. It is the most novel part of your paper, but also the most brittle.
  **Pivot:** Argue that repentance creates a *duty* in the wrongdoer to forgive, but standing is not technically restored until that duty is fulfilled. This keeps the relational structure but avoids the "vindictive victim" trap.
  **Do not** try to defend the "State/Prosecutor" application. The lawyers know the doctrine better than you, and the mismatch is fatal to your credibility with them. Let them have the State; you keep the Moral Agent.
