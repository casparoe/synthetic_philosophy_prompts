              *   *Refinement:* The tension between (1) and (2) is often cited as fatal. But you frame (2) as the *constituency* of the demos needing closure before ASP can apply. You apply ASP *within* the closed boundary. This is consistent if you view (2) as temporal/logical priority. I'll frame this as apparent because you've already baked the concession into (2).

