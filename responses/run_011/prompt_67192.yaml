answer: |-
  **Scenario**

  The Oakwood Housing Co-op is governed by a Code requiring all amendments to pass by a 75% vote at an Annual General Meeting held physically in the "Community Room." There is no external appeals body; the Board keeps minutes and members comply based on mutual trust. In 2023, a bare majority voted to amend the "Facilities Use" rule, redesignating the Community Room as "Secure Storage" and locking it indefinitely. The Amendment Clause remained textually untouched, but the condition for its use was physically nullified. No one argued this was a trap; it was passed as a cost-saving measure.

  In 2024, a new bare majority convened in the Lobby, voted to restore the Community Room's status, and recorded the change in the minutes. The Board circulated the update, and members treated the Code as amended without objection. No one referenced the 2023 lockout during the meeting; they simply carried on as though the amendment power had never been disabled. The question is whether the 2024 vote is legally valid.

  **Definition and Distinctness**

  I define **oblique self-entrenchment** as a legislative act that alters a substantive rule such that the procedural conditions for amendment become impossible to satisfy, without altering the amendment clause textually. It is a distinct phenomenon from the standard self-repeal puzzle. In the standard puzzle, the amendment clause is the direct object of the change, triggering immediate logical scrutiny regarding self-reference. Here, the amendment clause is the collateral damage of a valid-looking substantive change. This distinction matters because it separates textual contradiction from operational impossibility. In the standard puzzle, the law asks, "Can I delete myself?" In oblique entrenchment, the law asks, "Can I lock the door I need to walk through?" The latter hides the self-reference from formalist scrutiny while achieving the same freeze.

  **Verdicts**

  (a) **Hart-style:** Valid. The Rule of Recognition is a matter of social fact, specifically the acceptance and practice of officials. The Board recorded the 2024 vote, and members complied. The actual practice overrides the paper condition of the "Community Room." The Rule of Recognition has shifted to accommodate the Lobby meeting.

  (c) **Acceptance/Continuing Sovereignty:** Valid. Adopting the "continuing sovereignty" limb of this position: the power to amend is an attribute of the living body and cannot be used to destroy the body's capacity to act. The 2023 lockout was *ultra vires* regarding the constitutional core. The amendment power persisted through the year, unimpaired by the void lock. The 2024 vote was a lawful exercise of existing power.

  (b) **Ross-style:** Invalid. Validity flows transitively from higher norms. The 2023 vote was textually ordinary (no self-reference), so Ross accepts it as a valid norm creation. That valid norm ("Room Locked") conflicts with the amendment condition ("Room Open"). This creates a logical discontinuity: the amendment power is inoperative. The 2024 vote attempts to amend without satisfying the condition for amendment. It lacks a source of validity within the chain. It is a factual event, not a legal act.

  **Demonstration**

  The split arises from how each theory treats the **2023 Lockout**.

  For **(a) Hart**, the 2023 Lockout is irrelevant because the Rule of Recognition is grounded in current practice, not past text. Since officials accepted the 2024 vote, the system validates itself retrospectively. The "lock" was never a legal barrier because the social fact of authority overrides it.

  For **(c) Continuing Sovereignty**, the 2023 Lockout is void *ab initio*. The sovereign body cannot bind its future self. Therefore, the amendment power was never disabled. The 2024 vote is valid because the power was always there.

  For **(b) Ross**, the 2023 Lockout is **valid**. Because it was oblique (no textual self-reference), Ross's logical hierarchy accepts it as a legitimate norm. However, because it is valid, it successfully disables the amendment condition. Ross cannot simply ignore the lock because it was legally created. Thus, the 2024 vote attempts to jump a broken chain.

  **The Critical Feature**

  The single feature doing the work is **disablement rather than repeal**. Because the amendment clause was not textually repealed, Ross treats the 2023 vote as a valid substantive norm rather than a self-destructive act. This validates the trap. If you remove this feature and make the 2023 vote a direct repeal of the Amendment Clause:
  1.  **Ross** might then declare the 2023 vote void (self-destruction), meaning the power survived, making the 2024 vote **Valid**.
  2.  **Hart** and **(c)** would likely remain **Valid** (Practice rules / Sovereignty continues).
  3.  **Result:** All three agree. The case collapses back into the ordinary self-repeal puzzle where the "break" is obvious to everyone. The obliqueness is what tricks Ross into accepting the freeze, creating the divergence on the second vote.

  **Strongest Attack for the Losing Position (Ross)**

  A Rossian defender would argue: "Calling the 2024 vote 'invalid' isn't denying it happened; it's denying it has legal noise. If we accept the 2024 vote as valid, we admit that a legal system can repair its own logical foundation without a new constitution. That begs the question. You are assuming the body has a 'residual power' to fix logic gaps. Ross says it doesn't. The 2024 vote is a revolution, not an amendment. To call it valid is to pretend the break didn't happen. The members are obeying a new regime, not the old Code. Honesty requires admitting the old Code died in 2023."

  **Honest View**

  Oblique self-entrenchment is a repackaged old one, but a useful pedagogical package. It is ultimately the same paradox of sovereignty (can the sovereign bind itself?) dressed in operational clothing. However, it is worth its own entry because it isolates the **formalist blind spot**. It shows that textual consistency (Ross) can be more vulnerable to entrenchment than social fact (Hart) or sovereign theory (Suber), because formalism accepts validly enacted traps that functionalism ignores. It forces students to see that "validity" isn't just about logic or practice, but about whether the law sees the trap as a wall or a hurdle.
