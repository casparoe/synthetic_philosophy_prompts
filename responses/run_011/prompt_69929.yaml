      *(Refining Point 4)*: The "lives slightly not worth living" point refers to the Sadistic Conclusion or similar. LTNU avoids the Repugnant Conclusion but might face the "Very Sadistic Conclusion" (preferring a world of mild pain to a world with some extreme pain). (IV) might just say "no comparison possible," which avoids the preference but also avoids the guidance.

      *(Refining Point 6)*: The "debunking" angle is about whether our intuition is reliable. If our intuition is just scope neglect, (I)/(II) are right. If it's moral insight, (III)/(IV) are right. (IV) is more modest.

