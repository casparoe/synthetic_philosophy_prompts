answer: |-
  We, the undersigned, submit this joint statement to record the current state of our adversarial collaboration regarding the normative and descriptive adequacy of expected utility theory versus risk-weighted expected utility theory. We begin by recording the substantial ground we share, so that our disagreements are not mistaken for disputes over basics. We agree that the dispute is not about the probabilities themselves, which we take as given and objective for the purposes of these cases. We agree that concave utility over money buys you some risk-aversion but cannot buy you the Allais pattern of preferences, meaning that adjusting the utility function alone cannot explain the specific violations of independence we are investigating. We agree that expected utility is the special case of risk-weighted expected utility where the risk function is linear, so the two theories are not rivals about every piece of data, and indeed they coincide whenever the risk function is the identity. We agree that a theory that can fit any pattern is not thereby vindicated, and that the burden is on out-of-sample prediction rather than mere post-hoc accommodation. We further agree on the utility scale for the prizes in question, fixing u(0) = 0, u(2400) = 0.8, and u(2500) = 1, so that both sides are arguing about the same arithmetic.

  To focus our disagreement, we have adopted a family of cases called the zero-dial. The left act L pays 2400 for sure. The right act R(w) pays 2500 with probability exactly one third, nothing with probability w, and 2400 with the remaining probability two-thirds minus w, where w runs from 0 to two-thirds. At w = 0 there is no catastrophe branch at all, at w = 0.01 you are sitting on the familiar Allais-style common-consequence case, and at the far end w = two-thirds the right act is a bare one-third shot at the top prize. We agree on the algebraic implications of our respective theories for this setup. The expected utility theorist calculates the value of L as 0.8 and the value of R(w) as one third times 1 plus two-thirds minus w times 0.8, which simplifies to 2.6/3 minus 0.8w. Setting these equal to find the indifference point yields 0.8w = 0.2/3, so w = 1/12. The risk-weighted theorist calculates the value of L as 0.8 times r(1), which is 0.8, and the value of R(w) as 0.8 times r(1 minus w) plus 0.2 times r(1/3), based on the cumulative probabilities of achieving at least the utility levels of the prizes. Setting these equal yields the condition 0.8 times r(1 minus w) plus 0.2 times r(1/3) = 0.8. We agree that if the risk function r is linear, this reduces to the expected utility result, but if r is convex, the solution for w shifts.

  Our first crux concerns the uniqueness and location of the flip point. The expected utility theorist predicts exactly one flip point in w, located at 1/12, regardless of any other attitudes the agent might hold, because the theory permits no free parameters once utilities are fixed. The risk-weighted theorist predicts exactly one flip point only if the risk function is fixed, but acknowledges that the location depends on the shape of r. Specifically, the risk-weighted theorist holds that for any observed flip point below the expected utility one, you can find a convex r that reproduces it exactly. This leads us to the second crux, which is the one we care most about: is r independently pinned by something else, or is it a free parameter that buys fit at the price of testability? The expected utility theorist demands to know what counts as r being independently constrained, arguing that if r is tuned to match the zero-dial flip, the theory is merely descriptive. The risk-weighted theorist responds that r is constrained by other choices, specifically simple binary gambles where utility is already fixed by risk-free certainty-equivalent questions. For the pre-registered prediction on this crux, we will take a subject whose utility numbers are already fixed by risk-free certainty-equivalent questions and run them across the whole dial. The expected utility theorist predicts the flip will occur at w = 1/12. The risk-weighted theorist predicts the flip will occur at a w determined by the risk function measured in those binary gambles, and if those gambles show risk-weighting, the flip will be below 1/12, but if those gambles show no risk-weighting, the theory collapses to expected utility and the flip will be at 1/12.

  Our third crux concerns bundling and separability across states. We take one zero-dial problem and an independent coin flip and present them as two separate choices, then as a single combined act where the outcome is the pair of results. The expected utility theorist states that the ranking can never flip between the two presentations, because the ranking cannot depend on what happens in states that are the same either way, and the independent coin adds no relevant correlation. The risk-weighted theorist states that a flip is possible for some r, because the global shape of the gamble changes when you convolve the distributions, altering the cumulative probabilities that the risk function weights. For the pre-registered prediction, the expected utility theorist predicts no flip in preference ordering between the separate and combined presentations. The risk-weighted theorist predicts a flip is possible, specifically expecting that an agent who prefers L in the separate choice might prefer R in the combined act, because bundling reduces the salience of the extreme tails where the risk function is most non-linear.

  Our fourth crux concerns the sequential version of the problem. We put the agent in a two-stage problem where the zero-dial choice is made now and a further choice comes up only after w resolves, and where the plan they would commit to at stage one is not what they would choose at stage two. Both camps agree on a concrete case of that shape, specifically where the resolution of w reveals information that changes the local risk profile. The expected utility theorist pre-registers that such an agent can be pumped for a sure small loss, and that this is a reductio ad absurdum of any theory permitting such dynamic inconsistency. The risk-weighted theorist pre-registers that such an agent can be pumped for a sure small loss, but that this is a price worth paying for maintaining sensitivity to the global shape of risks over time. The expected utility theorist holds that rationality requires dynamic consistency as a constitutive rule. The risk-weighted theorist holds that dynamic consistency is a substantive constraint that may be violated by reasonable attitudes toward global risk.

  We acknowledge that a chunk of this argument turns out to be merely verbal, specifically regarding what the word rational is doing, and about whether separability across states is constitutive of rationality or just a substantive constraint on it. If the dispute rests solely on whether we define a rational agent as one who maximizes expected utility or as one who maximizes risk-weighted utility, then we are talking past each other. However, we treat this as a substantive dispute because each side claims their definition tracks a genuine normative property, either coherence of preferences across states or sensitivity to the distribution of outcomes. We agree to treat the money pump result not as a logical contradiction but as a cost, and the question is whether that cost is prohibitive. The expected utility theorist claims it is prohibitive because it implies sure loss. The risk-weighted theorist claims it is not prohibitive because the sure loss is the trade-off for avoiding catastrophic risk profiles in the single-shot cases.

  We commit to testing these predictions empirically. If the subject's flip point in the zero-dial matches 1/12 despite showing risk-weighting in binary gambles, the risk-weighted theorist must explain why the risk function vanishes in complex cases. If the subject's flip point matches the binary gamble prediction but deviates from 1/12, the expected utility theorist must accept that utility alone does not explain the choice. If the subject flips preference under bundling, the expected utility theorist must concede that separability is descriptively false, though they may maintain it is normatively required. If the subject accepts the money pump, the expected utility theorist will count this as irrationality, while the risk-weighted theorist will count it as evidence that rationality permits dynamic inconsistency. We sign this statement to hold ourselves to these specific commitments, so that we can check later who moved and who just reworded their position.
