answer: |-
  The principle you require is **The Principle of Embodied Epistemic Utility**.

  Good's Theorem is mathematically valid but ontologically thin. It assumes a disembodied mind where information is a costless input to a decision function, and utility is a function solely of the external state and the final act. Your verdicts reveal that you are not a disembodied updater; you are a biological and social agent for whom *knowing* is an event that alters your psychological state, your relationships, and sometimes the physical outcome itself.

  Good's Theorem is not wrong; its assumption about the Utility function is. We do not need to replace Bayesian decision theory, but we must repair the specification of $U$. Utility must depend not only on the State ($S$) and Act ($A$), but on the **History of Knowledge Acquisition ($H$)** and the **Duration of Possession ($T$)**.

  ### The Principle: Embodied Epistemic Utility

  An agent should acquire information if and only if the following four clauses are satisfied:

  **1. The Fidelity Clause**
  *Information should not be acquired if the agent knows their updating mechanism is systematically biased regarding that specific class of evidence.*
  *   **Motivating Case:** **Case 2.** You know you over-weight small samples. Even if the data is "free," the *processing cost* is negative because your posterior will be worse than your prior. Good's theorem assumes perfect conditionalization; you are admitting bounded rationality.
  *   **Implication:** Information has negative value if it induces predictable error.

  **2. The Causal Clause**
  *Information should not be acquired if the possession of that knowledge causally degrades the probability of the desired outcome.*
  *   **Motivating Case:** **Case 7.** The surgeon's prediction changes the patient's behavior (withdrawal), which changes the survival rate. Here, information is not passive observation; it is an intervention.
  *   **Implication:** This also applies to your **$200,000 study**. If a null result ends a helpful program, the evaluation itself is a threat to the program's existence. If you suspect a null result, commissioning the study may be an act of self-sabotage.

  **3. The Temporal Valence Clause**
  *For non-actionable information, the utility of knowledge is a function of the duration of possession. Retrospective knowledge (closure) may have positive utility where prospective knowledge (anticipatory burden) has negative utility.*
  *   **Motivating Cases:** **Cases 4 & 5.**
      *   **Case 5 (Prospective):** You initiate a period of waiting. $Utility = Closure - (Anxiety \times Time)$. If the condition is untreatable, $Anxiety$ is pure cost.
      *   **Case 4 (Retrospective):** The result existed in the past. The "waiting period" is psychologically perceived as already elapsed or external to your agency. Opening the seal provides narrative closure without the burden of *choosing* to anticipate.
  *   **Implication:** This saves Cases 4 and 5 from inconsistency. They are not identical acts. One is *bearing* a future burden; the other is *resolving* a past mystery.

  **4. The Fiduciary Clause**
  *Role-based duties impose constraints on information acquisition that override personal epistemic curiosity.*
  *   **Motivating Cases:** **Cases 1, 2, & 3.** As IDMC chair, your utility function includes the integrity of the trial, not just your personal curiosity.
  *   **Implication:** Case 1 is permitted because the rule insulates you from bias. Case 2 is forbidden because it violates the insulation.

  ### Repair or Replacement?

  This is a **Substantive Repair of Good's Theorem**.

  Good's Theorem states: $E[U|Info] \ge E[U|No Info]$.
  This holds true *if* $U$ is correctly specified. The "troublesome cases" violate Good's assumption that **"utility depends only on the state of the world and the act."**
  *   **Case 2 & 3** violate the assumption of **Perfect Rationality** (you are not a perfect Bayesian).
  *   **Case 7** violates the assumption of **Causal Independence** (knowledge changes the state).
  *   **Cases 4 & 5** violate the assumption of **Time-Independence** (utility depends on *when* and *how long* you know).

  By expanding $U$ to $U(S, A, H, T)$, Good's inequality holds, but the verdicts change because the inputs change.

  ### Application to New Cases

  **1. The Juror**
  *Scenario:* A juror could learn a fact the judge would exclude (e.g., prior convictions).
  *   **Verdict:** **Do not look.**
  *   **Reasoning:** Violates the **Fiduciary Clause**. The juror's role is to decide based *only* on admissible evidence. Acquiring excluded information compromises the legal act ($A$), even if it improves accuracy about the state ($S$). The utility of a "just verdict" includes procedural integrity.

  **2. The Researcher**
  *Scenario:* A researcher deciding whether to run an evaluation she expects to fail.
  *   **Verdict:** **Do not run it (as currently designed).**
  *   **Reasoning:** Violates the **Causal Clause**. If the evaluation's publication kills a helpful program (as in your $200k study example), the information has negative systemic utility. The researcher should only proceed if the study design includes a plan to sustain the program despite null results (e.g., implementation science focus rather than efficacy focus).

  **3. The Partner's Messages**
  *Scenario:* A person deciding whether to read a partner's messages.
  *   **Verdict:** **Do not read.**
  *   **Reasoning:** Violates the **Fiduciary Clause** (relationship trust) and **Causal Clause**. Reading changes the relationship state (trust is broken by the act of looking, regardless of content). The utility of "knowing the truth" is outweighed by the disutility of "destroying the bond."

  ### The Price: Which Verdicts Must You Abandon?

  You asked me to commit. Here is the cost of this principle.

  **1. You must abandon Case 3.**
  *   *Your Verdict:* "Look anyway, then discount."
  *   *The Principle's Verdict:* **Forbidden.**
  *   *Argument:* This is epistemic arrogance. You admit the selection procedure is unknown ("cannot reconstruct"). In Bayesian terms, you cannot define the likelihood ratio $P(E|H) / P(E|\neg H)$. If you cannot define the likelihood, you cannot conditionalize. You cannot "discount" what you cannot quantify. To look is to contaminate your prior with uncalibrated noise. You claim you can handle it; the math says you cannot. This verdict is a hallucination of control.

  **2. You must refine the $200,000 Study decision.**
  *   *Your Intuition:* Hesitant because a null result ends the program.
  *   *The Principle's Verdict:* **Do not commission** unless the protocol explicitly decouples the *evaluation* from the *termination*.
  *   *Argument:* This is identical to Case 7. If the prediction (null result) causes the failure (program end), the information is toxic. You are not measuring the program; you are stress-testing it to destruction.

  **3. Cases 4 and 5 can stand, but only barely.**
  *   *Your Verdict:* Opposite choices for identical content.
  *   *The Principle's Verdict:* **Permitted,** but only if you accept that **Anticipation is a Cost.**
  *   *Argument:* You are not being inconsistent; you are pricing *time*. In Case 5, you pay for knowledge with future anxiety. In Case 4, the anxiety is retrospective (curiosity about the past), which is cheaper than prospective anxiety. However, you must admit that if the "sealed" result in Case 4 implies the same future burden as Case 5, the rational choice is actually to **decline both**. If the condition is untreatable, knowing in Case 4 still burdens your remaining life. You are likely romanticizing Case 4 as "closure" when it is actually "burden." I urge you to reconsider Case 4: if the condition is truly untreatable and late-onset, the rational agent often declines the seal there, too. But I will allow your distinction on the grounds of *narrative agency* (choosing to close a past chapter vs. opening a future one).

  ### Conclusion

  Good's Theorem is a map for gods who do not feel anxiety, who do not belong to institutions, and whose looking does not change the world. You are human.

  The principle I have given you repairs the theorem by insisting that **information is not just a mirror; it is a tool, a burden, and sometimes a weapon.**

  Pay the price: Admit that Case 3 is a mistake. You cannot look at poisoned data and promise not to drink. Admit that the $200,000 study is likely a trap unless redesigned. Hold firm on Cases 4 and 5, but recognize that you are trading mathematical consistency for psychological sustainability—and that is a rational trade for an embodied agent.
