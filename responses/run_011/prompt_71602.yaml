answer: |-
  **The idea in one paragraph**
  This exercise simulates the discomfort of reading an unreliable narrator. Participants make factual judgments about a text, then receive evidence that their own mental processing was compromised during reading. They must decide whether to trust their initial instinct despite knowing their reliability was undermined. The goal isn't to find the truth of the text, but to feel the tension of holding a belief you know is shaky. They know they shouldn't believe their eyes, yet cannot un-see what they read. It forces them into epistemic akrasia: believing against their own better judgment. The biscuits raise the stakes, making the hesitation physical.

  **Materials and room**
  Printed passages (one per person), clipboards, pens, whiteboard, marker, timer, box of chocolate digestives, slips of paper for scoring. Arrange chairs so everyone sees the board but cannot compare papers. Surfaces are needed. Clipboards are essential for privacy and comfort. Keep the biscuits visible but out of reach until the end.

  **The rules and the scoring**
  You will read a passage while memorizing a seven-digit number written on the board. Do not write the number down; hold it in your head. After reading, answer three factual questions about the text. Beside each answer, write a Confidence Score from 1 to 10. You start with three biscuits. If you are correct, you gain biscuits equal to your Confidence Score. If incorrect, you lose biscuits equal to your Score. Here is the catch: if your Confidence Score is between 4 and 6 inclusive, you gain nothing even if correct. This prevents hedging. You must commit to being sure or unsure. After scoring, I will reveal information about your reading conditions. You may not change your answers after the reveal. The person with the most biscuits at the end wins the box. This scoring scheme punishes mush because safety yields zero reward. To win, you must risk loss, mirroring the risk of trusting a narrator. The logic is specific. If unsure, rating low protects from loss but gains little. If sure, rating high risks loss for gain. Excluding scores 4 through 6 removes the safe middle ground. You cannot say "maybe" and expect a reward. This forces you to declare your epistemic state honestly. If you lie and say 10 when you feel 5, you risk losing biscuits you hold. If you say 5, you get nothing. The system makes hedging the losing strategy. You must either trust your processing or admit it is broken. There is no neutral option. This mirrors the reader's position with an unreliable narrator: you either commit to the story or put the book down. You cannot halfway believe without consequence. The biscuits are currency for your conviction. Do not eat your starting biscuits yet. They are your stake. If you lose them all, you remain in the game but cannot win the box. We want to see where your confidence breaks. The pressure is intended to make your internal doubt visible. If you feel anxious about the score, that is correct. That anxiety is the data point we are harvesting.

  **The drop**
  Wait until everyone has submitted answers. Stand by the whiteboard. Do not look at their papers. Say this exactly: "While you were reading, the cognitive load of holding that number reduced your comprehension accuracy by approximately forty percent. You now know your answers are likely compromised. You are not allowed to change them. Score them." This lands on their process, not the text. It creates higher-order evidence: evidence about their evidence. They now know their belief formation was faulty, but they must stand by the belief. Do not elaborate. Do not apologize. Let the silence hang for a full minute. Watch their faces. They will want to argue. Do not engage. The discomfort is the point. You are undermining the thinker, not the thought. This is the moment of akrasia. They know they should not trust their answers, but they must submit them anyway. The biscuits now taste different.

  **Run sheet**
  00-10: Welcome and biscuit distribution. Explain the stakes.
  10-20: Write number on board. Hand out texts. Silent reading and memorization.
  20-35: Answer questions and assign Confidence Scores. Collect papers.
  35-45: The Drop. Deliver the script. Allow the tension to sit for two minutes.
  45-55: Reveal correct answers. Calculate scores. Distribute or collect biscuits.
  55-90: The Debrief. Sit in the circle. Eat the winnings. Discuss the feeling of the exercise.
  Buffer: Keep 5 minutes flexible for late arrivals or technical hiccups. Do not rush the silence after the Drop.
  Timing Note: If reading takes longer, cut the welcome. If scoring takes longer, simplify the math publicly. Ensure the Drop happens before people relax. The tension must peak at minute forty. Keep the box of biscuits visible throughout. During the scoring phase, write the correct answers on the board clearly. Ask participants to calculate their own totals first. This personalizes the loss or gain. If someone questions the math, resolve it quickly but firmly. The debrief should happen while they are eating. The act of chewing grounds the conversation. Use the empty box as a visual aid for the winner. Ensure you have a watch or phone timer visible. Timekeeping shows you respect the structure. If you run over, cut the debrief short rather than the Drop. The Drop is the core. When collecting papers, do not look at them. Stack them face down. This preserves the mystery of the scores.

  **The debrief**
  Do not explain the theory. Ask them to describe the sensation. When I told you your brain was compromised, did the text change on the page? If the text stayed the same but your trust shifted, where did the truth live? Did anyone feel angry at me for compromising them? Did anyone feel angry at themselves for believing anyway? When you saw your score, did you feel you deserved the loss? Who kept their original belief despite the warning? Why? Was it stubbornness or intuition? If you knew you were unreliable, why didn't you guess lower? Did the biscuit stake make you lie about your confidence? How does this match reading a narrator you suspect is lying? When you read a character lying, do you stop believing them? Or do you keep believing while knowing better? What is the cost of that belief? Does knowing the narrator is unreliable free you from responsibility for believing them? Or does it make you complicit? Why do we stay in books where we know we are being misled? Is it hope? Is it addiction? Who here would read the rest of the novel after this chapter? Why? Think about the moment you heard the news about the number. Did your body react? Did your stomach drop? Did you want to laugh it off? Why do we laugh when our certainty is threatened? Consider the person next to you. They had the same text. Did they feel the same doubt? If reliability is internal, how do we share truth? When you answered the questions, were you answering about the text or about your memory? Is there a difference? If your memory is the only tool you have, and the tool is broken, what do you do? Do you stop working? In a novel, do you stop reading when the narrator lies? Or do you read harder? What are you looking for then? Are you looking for truth or are you looking for cracks? Is reading an unreliable narrator an act of detection or an act of faith? When you guessed your confidence, were you guessing about the fact or about your own mind? Which is harder to know?

  **What will go wrong the first time**
  Participants might refuse the memory task, claiming it's irrelevant. If they push back, insist it's part of the protocol without apologizing. If they laugh, stop talking and wait. Silence is heavier than justification. Someone might spot the trick early and announce it. If so, acknowledge it and ask them to keep quiet to preserve the experience for others. If the scoring math slows things down, simplify: correct equals biscuits, wrong equals none, ignore the loss mechanic to save time. If someone ends with negative biscuits, forgive the debt immediately; this isn't about poverty. The goal is the feeling, not the accounting. If the room feels hostile during the Drop, soften your tone but do not change the message. You can be kind and still firm. If people refuse to eat the biscuits afterwards, do not force them. The loss of appetite is data. Note it. If the discussion stalls, ask who felt cheated. Cheating is a useful emotion here. If the printer jams, have a backup handwritten version ready. Improvisation undermines the authority needed for the Drop.

  **What the game can't reproduce**
  This game creates a spike of distrust, but novels create a slow erosion. You cannot simulate the intimacy of three hundred pages in ninety minutes. In a novel, you love the narrator even as you doubt them. Here, they only feel cheated. You must explain that the long form allows for affection alongside suspicion. The game creates the conflict; you must supply the empathy. Tell them that in fiction, we stay because we want to, not because we are forced to bet biscuits. The game forces the cognitive dissonance, but it cannot force the care. We believe unreliable narrators because we love them, not just because we are confused. That emotional bond is the missing variable. You have to articulate that the pain of this exercise is the sterile version of the pain of reading a betrayal.
