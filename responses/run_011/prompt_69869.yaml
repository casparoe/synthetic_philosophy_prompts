  The case is **not underdescribed**; the detail "doesn't look at any of the maths herself" is the pivot point. However, I must push back on your reading of **Case 7**. You noted she said "it wasn't just about methods being described loosely." This is often interpreted as "Reliabilism is out." I interpret it stronger: **She is rejecting Pure Safety.** Since the theorem is true in all nearby worlds (it's math), Safety is satisfied. Her "No Knowledge" verdict proves that for her, **Safety is necessary but not sufficient.** You must pair it with No False Grounds. If you go into section arguing only Safety, you will miss the constraint she established in Week 7.

