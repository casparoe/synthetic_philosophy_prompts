      *   *Reasoning:* If the *objective* chain of justification supporting the fact is flawed (canceling errors), the truth is too accidental, regardless of what the student read. (This view fits Case 7 well but threatens Case 5).

  **Where they diverge:** They diverge on **Basis Individuation**. Does the student's method include "The derivation in the book is sound" (which is false) or just "The book is authoritative" (which is true)? Given Case 7, the TA cares about false lemmas. Given Case 5, she cares about reliable testimony. The New Case forces a choice: does the hidden error in testimony poison the recipient?

  ### 4. Closest Analog
  **Case 5 (The Stranger/Directions)** is the closest analog, but **Case 7 (The Mathematician)** is the critical distractor.
  *   **Why Case 5 is closer:** In Case 5, you believe based on testimony without checking the underlying facts (the streets). In the New Case, the student believes based on testimony without checking the underlying facts (the math).
