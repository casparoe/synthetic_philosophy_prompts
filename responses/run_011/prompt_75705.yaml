answer: |-
  **MEMORANDUM**

  **TO:** The Constitutional Panel
  **FROM:** Senior Clerk
  **DATE:** 2 October
  **RE:** Reference under Article 151: Public Order and Assembly Act

  **I. RECOMMENDED DISPOSITION**

  The Clerk recommends that the Panel reject the objection regarding prematurity and proceed to judgment on the merits. Article 151 explicitly authorises abstract review of enacted legislation before it enters into force; the absence of a specific refused license is irrelevant to the Court's jurisdiction under this provision.

  On the merits, the Clerk recommends the following dispositions:

  1.  **Section 4 (Designated Zone):** Uphold as constitutional. The spatial restriction is sufficiently defined and relates directly to the protection of public order following the recent rioting.
  2.  **Section 7 (Notice and Caps):** Declare incompatible with Article 22 pursuant to Article 150(2). Suspend the effect of this declaration for twelve months. Parliament must be directed to either publish the evidentiary basis for the thirty-day notice period and attendance caps or amend the statute to reduce the burden on assembliers.
  3.  **Section 7(5) (Internal Tribunal and Ouster):** Annul immediately. This provision violates Article 12 (vesting of judicial power) and Article 96 (right to independent court determination). It is not severable from the licensing scheme because it removes the essential safeguard against administrative arbitrariness.
  4.  **Section 12 (Evidence Bar):** Annul immediately. This provision violates Article 96 by preventing a fair determination of rights through the exclusion of relevant evidence based on executive discretion.

  **II. JURISDICTION OVER JUDICIAL POWER (SECTIONS 7(5) AND 12)**

  A threshold objection arises regarding the Court's authority to review Sections 7(5) and 12. It may be argued that because these provisions concern the allocation of adjudicative functions rather than the substantive content of the right to assemble, they fall outside the scope of an Article 22 analysis. Further, it may be contended that a court created by the Constitution cannot use the Constitution to disable the legislature from organising tribunals as it sees fit.

  This objection must be rejected. Article 12 is not merely a grant of power to the judiciary; it is a structural limitation on the legislature. By vesting judicial power exclusively in the courts and prohibiting bodies of a judicial nature outside that power, Article 12 denies Parliament the competence to create the tribunal established in Section 7(5). The District Administrator's internal tribunal exercises functions of a judicial nature—determining rights and obligations regarding licenses—yet its members serve at the Minister's discretion. This directly contravenes Article 12.

  Similarly, Section 12 and the ouster clause in 7(5) violate Article 96, which guarantees a determination by a court independent of the executive. These are not secondary issues subordinate to Article 22; they are free-standing constitutional violations. The Court is not disabling the legislature from organising tribunals; it is enforcing the Constitution's explicit prohibition on non-judicial tribunals exercising judicial power. To hold otherwise would permit Parliament to amend the constitutional structure by ordinary statute, rendering Article 12 nugatory.

  **III. PREDICTIVE JUDGMENT AND EVIDENTIARY BASIS (SECTION 7)**

  The Minister's strongest argument concerns Section 7. He contends that the thirty-day notice period and attendance caps rest on predictive judgments about crowd behaviour—matters on which reasonable legislators may differ and upon which the Court is institutionally ill-equipped to second-guess. This argument relies on the 2017 *Electoral Broadcasting* decision, which counsels deference where Parliament has addressed its mind and had "some material" before it.

  However, the unpublished and untestable character of the expert panel report distinguishes this case from 2017 and brings it within the principle of the 2021 *Emergency Curfew* decision. In 2017, the Court deferred because material existed to show Parliament had engaged with the issue. In 2021, the Court annulled because deference to an assertion the Court is forbidden to test is abdication. Here, the Minister relied on unpublished findings; the opposition was refused an opportunity to question the authors. The Court cannot satisfy itself that Parliament addressed its mind if the material relied upon is secret.

  The Clerk recommends that the Panel clarify that 2017 and 2021 are reconcilable but that 2021 controls regarding access to evidence. Deference is owed to legislative *weighting* of evidence, not to the *existence* of evidence that is withheld from review. To uphold Section 7 on the basis of secret reports would validate a process where the government asserts necessity without proof. Therefore, the provision is incompatible with Article 22. However, immediate annulment might leave a regulatory vacuum regarding public order. Under Article 150(2), the Court should suspend the declaration of incompatibility for twelve months. This preserves public order temporarily while compelling Parliament to substantiate the restrictions or lessen them.

  **IV. THE OVERRIDE POWER AND PRUDENCE (ARTICLE 148(3))**

  Two members of the Panel are concerned that striking down Section 7(5) invites a confrontation Parliament may win by re-enacting the provision under Article 148(3). This provision permits Parliament to override Article 22 for five years via express declaration. The argument is that the Court should leave Section 7(5) intact to avoid triggering this override, which would place the provision beyond judicial reach.

  This prudence argument rests on a misconception of Article 148(3). The text permits Parliament to override Article 22 "notwithstanding Article 22." It does not mention Article 12 or Article 96. Section 7(5) violates Article 12 (judicial power) and Article 96 (independent court) independently of its impact on assembly. Even if Parliament invoked Article 148(3) to shield the licensing scheme from Article 22 review, it could not shield the internal tribunal from Article 12 review. The override power is specific, not general.

  Therefore, Article 148(3) would not shelter Section 7(5) from review. Acknowledging this clarifies that the prudence argument is unfounded. Striking down Section 7(5) does not risk a successful override because the override mechanism does not apply to violations of judicial independence. Consequently, the Clerk recommends maintaining the recommendation for immediate annulment of Section 7(5). The Court must not tolerate a tribunal within the Interior Ministry regardless of the political cost.

  **V. THE CASE FOR RESTRAINT**

  The strongest case against this recommendation accepts the constitutional premises above but rejects the conclusion in the name of democratic legitimacy and institutional capacity. A colleague might argue:

  "The Court sits unelected in a Republic facing genuine civil unrest. Two citizens are dead. Parliament debated for eleven hours and voted. The Minister asserts that these measures prevent violence. When the Constitution grants Parliament an override power in Article 148(3), it signals that in matters of public order, the elected branch must have the final word. By annulling Section 7(5) and suspending Section 7, the Court substitutes its own risk assessment for that of the government. If violence recurs, the blood is on the Court's hands. The 2017 precedent teaches us that reasonable legislators may differ on predictions. We should not demand published reports for every security measure. To do so is to judicialise national security. We should uphold the Act entirely, trusting that the political process will correct excesses faster than litigation can."

  For this case to prevail, it must be true that the Court's role is secondary to Parliament's in all matters touching public order, and that Article 12's vesting of judicial power is subordinate to emergency legislative needs. It requires accepting that an internal ministry tribunal is sufficiently "independent" during a crisis. The Clerk submits this is false. If Article 12 yields to emergency assertions, it yields entirely. The Constitution does not permit the executive to judge its own restrictions on liberty, even in crisis.

  **VI. MATTERS TO LEAVE OPEN**

  The Panel should decline to decide the specific minimum notice period required for constitutionality (e.g., whether fourteen days would suffice) or the precise geographical boundaries of the designated zone in Section 4. These are policy details within Parliament's competence. Restraint on these points serves the judgment by respecting the legislative role in crafting solutions, provided the constitutional boundaries of evidence and judicial review are respected. It avoids the Court micromanaging crowd control while ensuring the process remains lawful.

  **VII. CONCLUSION**

  The Clerk recommends a judgment that affirms the Court's authority under Article 151, protects the judicial structure under Article 12, and demands evidentiary transparency under Article 22. This approach navigates the conflicting case law by prioritising the testability of evidence over deference to secrecy, and it neutralises the prudence objection by correctly construing the limits of the override power.
