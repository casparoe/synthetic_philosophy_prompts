  ### Interview Questions

  **1. The Simulation Analogy (Decision vs. Frequency)**
  1.  **Setup:** In my day job, I run deterministic simulations where outcome frequencies come from a distribution over random seeds.
  2.  **Question:** In my sims, seeds drive frequencies. Here, amplitudes aren't seeds. What plays the seed's role in linking rational bets to observed frequencies?
  3.  **Expected Answer:** Amplitudes *are* the measure; no hidden variable or seed is needed.
  4.  **Follow-up:** Then why isn't that just asserting the conclusion rather than deriving it?

  **2. Branch Counting (Vagueness)**
  1.  **Setup:** A common objection is that if all branches are real, we should count them equally rather than weighting by amplitude.
  2.  **Question:** You say branch counting fails because branches aren't discrete things to count. Does that vagueness mean the objection is meaningless, or just hard to calculate?
  3.  **Expected Answer:** Meaningless; there is no fact of the matter about branch number.
  4.  **Follow-up:** If there's no fact of the matter, how do we know splitting happened at all?

  **3. Self-Locating Uncertainty**
  1.  **Setup:** Some rivals argue probability is just ignorance about *which* branch you are on before you look.
  2.  **Question:** If probability is just self-locating uncertainty before you look, do you still need decision theory to derive the weights, or does that make your derivation redundant?
  3.  **Expected Answer:** They are combinable; decision theory grounds the uncertainty.
  4.  **Follow-up:** If DT grounds it, isn't the uncertainty doing no work?

  **4. Envariance (Symmetry Derivation)**
  1.  **Setup:** *Envariance* is a derivation of Born weights from symmetries of entangled states rather than rational preference.
  2.  **Question:** Is envariance a rival derivation, a special case of your work, or does it secretly rely on the same decision-theoretic premises you use?
  3.  **Expected Answer:** Compatible or complementary; does not rely on DT premises.
  4.  **Follow-up:** If no DT needed, why prefer your harder route?

  **5. Robustness (Non-Expected Utility)**
  1.  **Setup:** *Expected utility* is the standard model where agents maximize average payoff weighted by probability.
  2.  **Question:** If an agent is ambiguity-averse or values fairness over utility, does your derivation break, or does it show such agents are irrational?
  3.  **Expected Answer:** Such agents are irrational; the proof holds.
  4.  **Follow-up:** That makes probability a norm, not a physical fact. Is that acceptable?

  **6. Branch Counting (Amplitudes)**
  1.  **Setup:** You rely on the vagueness of branches to dismiss the branch-counting objection.
  2.  **Question:** If branch individuation is too vague to count, isn't it also too vague to assign precise amplitude weights to? Why does vagueness hurt them but not you?
  3.  **Expected Answer:** Amplitudes are robust because they are continuous, unlike discrete counts.
  4.  **Follow-up:** But they still depend on the same decomposition you called vague.

  **7. Circularity (The Key Premise)**
  1.  **Setup:** Critics charge that your premises already encode the Born rule, making the argument circular.
  2.  **Question:** Name the single premise in your proof that does the heaviest lifting. If we drop it, does the derivation collapse, or does it just look different?
  3.  **Expected Answer:** The Equivalence or Continuity premise; derivation collapses without it.
  4.  **Follow-up:** Isn't that premise just the Born rule in disguise?

  **8. Confirmation (Evidence)**
  1.  **Setup:** The *Born rule* is the standard law predicting the frequency of quantum outcomes.
  2.  **Question:** On your view, can a long run of Born-rule-violating observations ever count as evidence *against* the theory, or is it just a low-weight branch?
  3.  **Expected Answer:** It is a low-weight branch; the theory is still confirmed.
  4.  **Follow-up:** Then how is this theory testable compared to one where violations falsify it?

  **9. The Metaphysical Escape**
  1.  **Setup:** You often describe these disputes as metaphysical bookkeeping rather than empirical physics.
  2.  **Question:** If this is just bookkeeping, why does it matter which bookkeeping method we use? Can't we just pick the one that matches the data and stop arguing?
  3.  **Expected Answer:** Physics requires a correct ontology, not just matching data.
  4.  **Follow-up:** Then admit this is a physical claim, not just bookkeeping.

  **10. The Closer (Abandonment)**
  1.  **Setup:** We end by asking what would change your mind.
  2.  **Question:** What specific result or argument would force you to abandon the decision-theoretic derivation? Is there any observation that could falsify this approach?
  3.  **Expected Answer:** Logical inconsistency or a strictly better derivation.
  4.  **Follow-up:** If the answer is "nothing," isn't this dogma?

  ***

  ### Note on the Simulation Analogy
  Your analogy breaks down in two key places. First, in your simulations, the seed distribution is an **external input** chosen by a programmer, whereas in Everett, the amplitudes are **internal** to the wavefunction's deterministic dynamics; there is no "programmer" setting them. Second, your simulation runs are **distinct instances** across different machines, while Everett branches are **components of a single physical state**. If pressed, concede that the analogy is only about where the "weighting" comes from in a deterministic system, not about the ontology of the runs themselves.

  ### Questions to Cut if Time Runs Long
  If you need to shorten the episode, cut **Question 4 (Envariance)** and **Question 5 (Robustness)**. These are the most technical and niche; removing them preserves the core philosophical arc (Branches -> Circularity -> Evidence -> Metaphysics) without losing the main thread of the guest's argument.
