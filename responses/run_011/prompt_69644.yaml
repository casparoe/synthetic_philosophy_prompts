  Some people say taxation is theft. I want to say exactly what that means. It means someone takes what is yours without asking. If you say no, they send officers. If you fight the officers, they use force. They may lock you up. They may hurt you. This is true. I will not lie to you. The taking does not depend on your consent. Behind the paper is force. If you do not pay, the state will compel you. There is no opt-out. To deny this is to insult your intelligence. The woman at orientation knew this. She asked about the rifles. She knows that behind the letter is the gun.

  The county commissioner sits here today. We have argued for years. He says force without reason is tyranny. He is right. No one should be forced without a reason they can hear. Force is dangerous. It must be justified. I agree with him on this. Force is only legitimate when it is answerable to the people it binds.

  But we must separate three questions. We often mix them up. First: Is the taking permissible at all? Second: Does a person subject to it owe compliance? Third: What makes this different from a robbery that is well organized?

  Let us look at the third question. A robber takes for himself. He follows no rules. He changes his mind when he likes. You cannot argue with him. You cannot sue him. Here, the rules are written. They apply to everyone, even the collectors. The government must show the law. It must follow the procedure. If it does not, you can stand in this courthouse and challenge it. The force is real, but it is bound by paper. It is answerable. The collector cannot take more than the law says. The judge can stop him. This is not a guarantee of justice. It is a structure for seeking it. The robber does not offer a court. This system does.

  Now the second question. Do you owe compliance? This is hard. You might think the law is wrong. You might think the taking is theft. That is your right. You can hold that belief and still stand here. The oath is not a promise that everything is perfect. It is not a promise to be silent. It is a promise to work inside the machine, not break it.

  To the candidates: Listen closely. Even if you believe the force is wrong, you promise not to meet it with violence. You promise to meet it with words. You promise to use the laws to change the laws. That is the difference between a subject and a citizen. A subject obeys. A citizen argues.

  There was a woman at orientation. She asked about collectors with rifles. She knows what force looks like. She knows the difference between chaos and order. But she also knows that order can be cruel. The oath you take is not a shield for cruelty. It is a tool to make the power answerable to you.

  So when you raise your hand, know what you do. You are not just promising to pay. You are promising to hold the power accountable. You are joining the argument about how we live together. That is the work. It is hard. It is never finished. But it is yours.

  The Constitution is not a command to be silent. It is a tool to make the force answerable. When you take the oath, you are not saying you agree with every law. You are saying you will use the laws to change the laws. That is the difference between a subject and a citizen.

  **Architecture Note**

  The speech rests on the distinction between *arbitrary coercion* (robbery) and *answerable coercion* (law). This carries the weight because it concedes the libertarian premise (force is used) without accepting the conclusion (it is illegitimate). I deliberately left out "public goods" arguments (roads, schools) because they justify the *end* rather than the *process*, which fails to address the woman's fear of force. The commissioner is most likely to object that answerability is insufficient without individual consent. The speech absorbs this by shifting the obligation from *agreeing* with the law to *engaging* with the process of changing it, validating his skepticism while demanding civic participation regardless.
