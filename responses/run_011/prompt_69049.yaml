          *   Cut intro fluff.
          *   Combine concessions.
          *   Tighten objections.

      *   *Final Polish:* Check tone (committed, not diplomatic). Check word count.

      *(Self-Correction during drafting)*: 700 words is very short for 6 objections + replies + concessions + advice. I need to be ruthless. I will group the objections tightly. I must explicitly state the "overclaim" as requested.

