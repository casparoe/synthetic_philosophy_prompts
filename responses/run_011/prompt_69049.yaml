      *Let's go.*

      **Concessions (First 2 Minutes):**
      Concede that Selected Effect (SE) is the correct *definition* for organismal traits where phylogeny is clear. Concede ENCODE was wrong to ignore fitness constraints on junk DNA. Acknowledge GO's Biological Process ontology implicitly targets SE. You are not banning SE talk; you are arguing molecular *evidence* cannot support it. This buys goodwill from the evolutionary crowd and philosophers.

      **The Single Reply That Must Land:**
      Conservation (dN/dS, phylogenetics) licenses claims about *lineage continuity*, not specific *activity selection*. A sequence can be conserved due to hitchhiking or low mutation rates while its biochemical activity drifts. If you cannot disentangle activity from lineage, you cannot assert SE. This separates the evolutionary biologists from the curators.

      **Q&A Prep Sheet (Ordered by Damage):**

      1.  **Teleosemanticist:** "You're redefining 'function' to mean 'activity'. That's verbal stipulation, not argument."
          *   *Reply:* It's epistemic, not semantic. If evidence cannot distinguish SE from CR, asserting SE is metaphysical padding.
          *   *Soft Spot:* Ignores cases where history *is* known (experimental evolution).
      2.  **ENCODE Vet:** "Does this make biochemical noise 'functional'?"
          *   *Reply:* No. Function requires a specified background system. Noise lacks systemic integration.
          *   *Soft Spot:* Defining 'system boundary' is notoriously messy.
      3.  **Curator:** "If I can't infer selection, what evidence code do I use for conserved non-coding elements?"
          *   *Reply:* Use ISA (Inferred from Sequence Alignment) but describe the biochemical role, not the 'purpose'.
          *   *Soft Spot:* Users want to know 'why it's there', not just 'what it does'.
      4.  **Computational Biologist:** "IBA codes assume function is conserved by selection."
          *   *Reply:* IBA tracks ancestor states. It assumes continuity, not fitness contribution.
          *   *Soft Spot:* Hard to disentangle hitchhiking from selection in practice.
      5.  **Philosopher:** "Without SE, you lose normativity. How do you explain malfunction?"
          *   *Reply:* Malfunction is failure to play the causal role in the specified background.
          *   *Soft Spot:* Loses the normative force of 'error' vs. 'variation'.
      6.  **Curator:** "IEP (Expression Pattern) implies context, isn't that evolutionary?"
          *   *Reply:* It's contextual activity. Context isn't history.
          *   *Soft Spot:* Expression patterns often imply adaptation.

      **The Question You Hope Nobody Asks:**
      "If a mutation breaks the causal role but fitness is unchanged (neutral drift), is it a malfunction?"
      *Strategy:* **Pre-empt it.** If you wait, the teleosemanticists will pounce on your inability to distinguish neutral breakage from pathological malfunction. Frame it early as a limitation of molecular-scale resolution.

      **Commitment & Advice:**
      **Objection #1 beats you.** If you cannot defend why 'function' shouldn't track history when history is available, you look like you're ignoring the literature to save a thesis.
      **Softening:** Do not claim CR *exclusively* licenses function. Claim CR is the *only evidentiary basis available* for molecular annotation. SE remains the theoretical ideal, but CR is the operational reality.
      **Overclaim:** Your evidence-code argument overclaims. IBA/IBD *do* imply functional inheritance, which curators treat as SE proxies. Denying this alienates the computational crowd. Admit these are *proxies* for SE, just unreliable ones.

