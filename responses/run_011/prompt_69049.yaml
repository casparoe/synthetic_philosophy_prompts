          6.  Constraints: Hard cap 700 words. No hedging, no menus, no references/reading list. Committed tone.

  2.  **Deconstruct the Thesis & Audience:**
      *   *Thesis:* CR exclusively licenses function at molecular level. SE is underdetermined. Functions are relative to background.
      *   *Audience:*
          *   Curators: Practicality ("What do I write?").
          *   Teleosemanticists: Philosophical purity ("Function *is* history").
          *   Evolutionary/ENCODE veterans: Rigor ("Don't call junk functional").
      *   *Vulnerability:* The claim that conservation/phylogenetics *cannot* license SE at the molecular level is strong. GO codes like IBA (Inferred from Biological aspect of Ancestor) imply function inheritance, which hints at SE. The claim that ENCODE failed only on background is controversial (they called biochemical activity 'function', evolutionary biologists said 'no, function requires fitness').

  3.  **Drafting - Section by Section (monitoring word count):**

      *   *Concessions (Goodwill):* Need to acknowledge the utility of SE for high-level traits and the validity of the ENCODE evolutionary critique regarding junk DNA.
      *   *The One Reply:* Must defend the epistemic gap between conservation and specific activity selection.
      *   *6 Objections:*
          1.  Teleosemanticist (Definition): "You're changing the meaning of function."
          2.  Curator (Practicality): "GO distinguishes Molecular Function vs. Biological Process. Where does SE fit?"
          3.  Evolutionary/ENCODE (Junk): "Does this make junk DNA functional?"
          4.  Computational (Homology): "IBA codes assume functional conservation."
          5.  Philosopher (Normativity): "CR lacks normativity (malfunction)."
          6.  Curator (Evidence): "IEP (Expression Pattern) isn't purely CR."
      *   *The Killer Question:* Something about malfunctions or disease variants.
      *   *Commitment:* Advise on softening.

      *   *Word Count Check:* 700 words is tight. I need to be extremely concise.

      *   *Drafting Content:*
          *   *Concessions:* Admit SE works for organismal traits. Admit ENCODE was wrong to ignore fitness *constraints*, but argue their *activity* basis wasn't the error.
          *   *Objections:*
              1.  (Teleosemanticist) "Function *is* history. You're describing activity, not function." Reply: At molecular scale, history is inaccessible; activity is the only operationalizable variable. Soft spot: Ignores cases where history is known (experimental evolution).
              2.  (Curator) "If I can't infer selection, do I stop annotating conserved non-coding elements?" Reply: Annotate the biochemical role relative to the system. Don't claim it's 'for' something. Soft spot: Users want to know 'why it's there'.
              3.  (ENCODE Vet) "This rehabilitates the 80% claim." Reply: No. Without a specified system background, activity isn't function. Most biochemical noise lacks a system context. Soft spot: Defining 'system' is messy.
              4.  (Computational) "IBA assumes function is conserved by selection." Reply: IBA tracks lineage continuity, not fitness contribution. Conservation ≠ Selection for *this* activity. Soft spot: Hard to disentangle hitchhiking.
              5.  (Philosopher) "No selected effect, no malfunction." Reply: Malfunction is failure to play the causal role in the specified background. Soft spot: Loses normative force of 'error'.
              6.  (Curator) "IEP involves expression context, isn't that evolutionary?" Reply: It's contextual activity, not historical selection proof. Soft spot: Expression patterns often imply adaptation.
          *   *Must Land:* The distinction between lineage conservation and activity selection (Objection 4 core).
          *   *Killer Question:* "If a mutation breaks the causal role but fitness is unchanged, is it a malfunction?" (Hits normativity).
          *   *Advice:* Soften the "exclusively." Admit SE is the *goal* but CR is the *evidence*.

      *   *Refining for Constraints:*
          *   Need to ensure I pick the one that beats me.
          *   Need to ensure I advise on softening.
          *   Need to ensure I identify the overclaim.
