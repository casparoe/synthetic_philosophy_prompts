answer: |-
  Here is the design for the session, structured to let the logic unfold without you needing to lecture before the activity begins. You will need a stack of index cards, pens, and a whiteboard or large sheet of paper to track the global score. The currency is called Tokens, and they are purely fictional, representing a generic resource like time or energy rather than money, which avoids any real-world guilt about allowances. Give each participant a personal starting endowment of fifty Tokens written on their card. Tell them they are acting as Resource Officers and their goal is to maximize the Total Global Value on the board. Explain that Total Global Value is calculated as the sum of all Personal Tokens kept by individuals plus twice the value of all Tokens contributed to the Global Pool. This multiplier is the key mechanic. You will run five rounds. In each round, players decide how many of their remaining Personal Tokens to keep and how many to contribute. For every ten Tokens they keep, they add ten to the Personal subtotal. For every ten Tokens they contribute, they add twenty to the Global Pool subtotal. Because the contribution yields double the value toward the stated goal of maximizing Total Global Value, the strictly rational move in every single round is to contribute everything. If they follow the logic of the goal you gave them, they will end the game with zero Personal Tokens and maximum Global Value. Do not explain why the multiplier exists or what it represents yet. Just enforce the math.

  To manage the two students who tend to dominate, you need to structuralize silence during the decision phases. Hand out the index cards at the start and tell them that all decisions must be written privately on the card and handed to you at the end of each round. No discussion is allowed until the scores are tallied. This prevents the loud students from steering the group toward the rational choice too early or mocking those who hesitate. You collect the cards, do the math on the board quickly, and announce the new Global Total. You can allow two minutes of discussion between rounds about strategy, but keep it tight. If the dominant students try to explain the trick, gently interrupt and remind them that you want everyone to arrive at their own conclusion based on the numbers. By keeping the decisions private and written, you ensure that the quiet students actually engage with the dilemma internally rather than just following the loudest voice in the room. The scoring is tracked publicly on the board so everyone sees the Global Value rising while their personal reserves dwindle, creating a visual representation of the drain.

  Once the five rounds are done and everyone has theoretically bankrupted themselves for the sake of the Global Total, you move into the debrief. Do not announce the name of the theory yet. Start by asking how it feels to have zero Personal Tokens left. Someone will likely say it feels wrong or unsustainable. Ask them why, since they were following the rules to maximize the value as instructed. They will say because they have nothing left for themselves. Then ask if any step along the way was mathematically wrong. They will admit that contributing always produced more value than keeping. This is the staircase. You have them build the objection themselves by pointing out the tension between the correctness of each individual step and the absurdity of the final destination. Now you can introduce the term consequentialism and explain that the game modeled the demandingness objection. The philosophical worry is not that the math is wrong, but that a theory requiring total self-sacrifice ignores important facts about human nature and personal integrity. Ask them where they would have stopped if they were playing for real life and why. This shifts the conversation from I lost the game to the theory might be too demanding.

  You should be prepared for a few specific things to go wrong. If one of the loud students figures out the premise in the first round and announces it, acknowledge their insight but ask them to hold off on explaining it so others can experience the tension. If they refuse, give them a specific role like helping you tally the scores so their energy is redirected. If someone refuses to play or contributes nothing as a act of rebellion, let them. Their refusal is actually data for the debrief. You can ask them later why they opted out, and their answer will likely mirror the philosophical objection better than the players who followed the rules. If the game feels like a dumb worksheet and nobody cares about the Tokens, raise the stakes slightly by offering a small tangible reward for the highest Personal Score, which conflicts with the Global Goal. This creates actual tension between winning the prize and winning the game. However, be careful not to make it too competitive or it becomes about beating each other rather than the ethical dilemma.

  There is one major limitation you need to know going in so you can address it in your closing remarks. The game cannot reproduce the emotional weight of real suffering. In the game, sacrificing Tokens is cold and abstract. In real life, the demandingness objection involves the emotional exhaustion of constantly ignoring your own friends, family, and projects to help strangers. The game captures the logical structure of the demand but not the psychological cost. You will need to supply this in words at the end. Ask them to imagine if those Tokens represented hours of time with their family or money for their own education. The philosophical point is not just that the sacrifice is large, but that it asks us to alienate ourselves from the personal projects that make life meaningful. You cannot gamify that feeling of alienation easily, so you have to bridge that gap verbally. Be honest with them that the game is a skeleton and their imagination needs to add the flesh. If you handle the transition from the math to the human cost carefully, you can avoid the feeling of a trick and instead land on a genuine shared inquiry about what we owe to each other versus what we owe to ourselves.
