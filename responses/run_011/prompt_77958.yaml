answer: |-
  Dear Colleague,

  Your description of the classificatory practices within this comparative cognition group offers a remarkably clear window into the philosophical commitments that often operate silently beneath empirical criteria. It is a familiar tension, yet you have articulated the friction points with unusual precision. To answer your primary question directly, the theory of mental content presupposed by this practice is not strictly teleosemantic, nor is it a bare informational account, though it borrows heavily from the latter. Instead, it appears to be a form of deflationary functionalism constrained by a robust externalist intuition about what counts as a referent. A purely teleosemantic account would define the content of a signal by the effect for which it was selected or learned. If a hunger call was selected to procure food by indicating need, its content is legitimately about the caller's state or the need itself. The fact that the group excludes internal states from the category of reference, even when they satisfy the reliability and uptake conditions, suggests they are not following teleosemantics to its logical conclusion. Nor are they following a bare informational account, wherein lawful covariance plus reliable uptake does all the work, because hunger states also covary lawfully with specific calls and produce reliable uptake. The exclusion implies a philosophical filter that privileges external objects over internal states, a move that is not dictated by the biology of communication itself but by a specific theory of what reference ought to be.

  When you ask whether the three tests of functional reference force the conclusion that the signaler represents anything at all, the answer must be a firm negative. The requirements that production be narrowly tied to an event, that receivers respond appropriately without prior exposure, and that the response survive playback without arousal cues, collectively establish functional specificity and semanticity in the signal structure, but they remain neutral on the psychological mechanism producing them. These tests rule out the hypothesis that the call is merely a symptom of arousal, such as a scream of fear that varies in pitch with intensity. They demonstrate that the call carries information that is decoupled from the immediate emotional state of the caller and specifies a category of external event. However, a thermostat satisfies similar conditions relative to temperature without representing anything. The tests prove that the signal functions as a vehicle of information for the receiver, but they do not prove that the sender possesses a concept of the predator or the fruit, nor that the sender intends to alter the receiver's mental state. The coding rules strictly require only that the signal behave as if it has content; they sit comfortably with the idea that the animal has thoughts, but they do not demand it. This is why the practice is best described as deflationary: the vocabulary of reference is shorthand for a pattern of causes and responses, and nobody need suppose the monkey has a thought about the eagle, only that the call functions to isolate the eagle as a cause of behavior in others.

  The tension you identify between the two lists is the central equivocation in the group's methodology. The first list describes the semantic properties of the signal itself, while the second list describes the pragmatic properties of the sender's behavior, specifically evidence of theory of mind or communicative intent. These cannot be combined without category error unless one assumes that functional reference necessarily implies intentional communication, which is precisely what is at stake. If the group treats them as evidence of the same thing, they are conflating the structure of the code with the psychology of the coder. To resolve this, one of the lists must be recognized as addressing a different phenomenon. If the goal is to identify referential signaling in the sense of semantic content, the first list is sufficient, and the second list is irrelevant. If the goal is to identify intentional communication in the Gricean sense, the first list is necessary but not sufficient, and the second list becomes critical. In the dispute over the food-associated call, the graduate student is arguing from the semantic criteria of the first list, while the supervisor is invoking the intentional criteria of the second list alongside the externalist exclusion. If the group drops the second list as a requirement for reference, the student wins, and the call is coded as referential because it carries specific information about food. If they maintain that reference requires an intention to inform an audience about an external object, the supervisor wins, but they must admit they are no longer talking about functional reference alone but about intentional communication.

  The standing exclusion of internal state calls is the most philosophically revealing aspect of this practice. You note that a hunger call can be given when the caller is not hungry, meaning misrepresentation is available, so truth-evaluability is not the barrier. Nor is it strictly about information gain, as receivers gain valuable information about the caller's state that they could not otherwise have. What is really doing the work is a requirement that the referent be publicly available to both parties as an object distinct from the subject. This is a commitment to externalism. The group operates with a tacit definition of reference that requires the content to be about the world, not the self. This is likely less a biological necessity than a taxonomic habit inherited from human linguistics, where we distinguish between stating a fact and expressing a feeling. By coding internal states as expressive or motivational, they preserve the category of reference for claims about the environment that can be verified independently of the speaker. This allows them to claim the animals are talking about things, rather than just broadcasting states, which feels more like language. However, this creates an inconsistency: if a call can be false about hunger, it has truth conditions, and if it triggers specific foraging behavior in others, it has functional reference. The exclusion is maintained not by the logic of communication but by a desire to keep animal communication analogous to human declarative statements about external objects.

  This practice is philosophically underdetermined because rival accounts of content would license exactly the same coding decisions for external events while diverging on internal states. A teleosemanticist would code the hunger call as having content because it has a selected function. An informationalist would code it as having content because it covaries with a state. The group's specific hybrid view codes it as non-referential because it violates the externalist constraint. Consequently, the coding decisions regarding aerial predators or fruit are compatible with almost any theory of content, which renders the theoretical commitment invisible until the edge cases like hunger calls arise. If the group were to adopt an interpretivist account, on which content is fixed by the role a signal plays across an entire behavioral repertoire, the criteria would have to change significantly. They would need to look beyond the immediate playback response and examine how the call integrates with past interactions, social relationships, and subsequent behaviors to determine its meaning holistically. The playback studies would need to be less about isolating the signal and more about observing its use in naturalistic sequences where interpretation is negotiated. Conversely, if they adopted the more austere view that these signals carry no content and merely cause responses, the vocabulary of reference would have to be abandoned entirely. They would speak only of elicitors and responses, and the dispute over the food call would dissolve because there would be no category of reference to assign it to. The call would simply be a stimulus that releases foraging behavior, and the question of whether it is about the food or the caller would be recognized as a category mistake.

  Ultimately, the group's practice suggests they want to have it both ways: they want the scientific rigor of the playback experiments that avoid attributing mental states, but they also want the theoretical payoff of claiming the animals are referring to things in the world. This leads to the exclusion of internal states, which threatens the coherence of their system if pushed. To resolve the tension, they must decide whether they are studying the evolution of semantic systems or the evolution of mind. If it is the former, the student is correct, and hunger calls can be referential relative to the internal state. If it is the latter, the supervisor is correct, but they must acknowledge that their first list is insufficient to prove intentionality. Until that choice is made, the classification will remain a patchwork of behavioral criteria and philosophical intuitions that do not quite fit together. I hope this helps clarify the underlying structure of the dispute you are observing. It is a microcosm of the larger struggle in cognitive ethology to define what we mean when we say an animal means something.

  Yours sincerely,

  A Friend
