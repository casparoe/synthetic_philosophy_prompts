answer: |-
  A postdoc must choose between a legible lie and an unintelligible truth when her data shows that a colony's behavior predicts better when interpreted as noise than when interpreted as language.

  The HVAC unit hummed at a frequency that made Elena's teeth ache. On the monitor, the grid glowed green, a matrix of nodes where the colony had deposited pheromones over the last thirty hours. It was 3:00 AM. The resubmission deadline was 9:00 AM.

  "The error margin on the novel arena is half a percent with the forty-eight," Elena said. She didn't look at Silas. She was watching the cursor blink in the summary field.

  Silas wiped the camera lens with a microfiber cloth. "Forty-eight is the fine grain. The noise."

  "It predicts the redistribution perfectly. The six-symbol model—the one that looks like sentences—misses the turn at node fourteen every time."

  "Six symbols reads like quantity," Silas said. He folded the cloth. "Forty-eight reads like static. You can't put static in a paper about representation."

  "If I publish the six-symbol model, I'm claiming they represent quantities. But the data says the representation is wrong. The mechanism that works is the one that looks like nothing."

  "Mechanism doesn't need to look like anything." Silas checked the humidity gauge. "Seventy percent. Good."

  "It needs to be interpretable. If the lexicon is arbitrary, the meaning is mine, not theirs."

  "You chose the groups before the trial," Silas said. "That was the protocol. Both times."

  "That's the problem. I fixed the lens before I knew what the picture was. With the coarse lens, they speak. With the fine lens, they twitch. But the twitching knows where the sugar is."

  Elena typed *The colony represents* and stopped. The backlight of the keyboard illuminated her hands.

  "Does it matter?" Silas asked. "They get the sugar either way."

  "It matters if we're claiming cognitive architecture. If the meaning is an artifact of my scoring scheme, there's no mind. There's just me projecting pattern onto noise that happens to work."

  "Nine years I've run this assay," Silas said. "They eat. They build. You write."

  "On the gel, a foreleg tested the viscosity of a dried trail. A molecule bound to a receptor on the antennae. The signal propagated to the abdomen, then ceased. Another insect crossed the path, laying a fresh deposit over the old. The density increased by microns. No center held the sum. The gradient steepened toward the node containing sucrose. A body turned. The path widened."

  Elena deleted *represents*. She typed *tracks*.

  "Tracks is weak," Silas said. "Reviewers want mechanism."

  "Tracks is accurate. Represents is a story I tell about the six-symbol grouping."

  "The six-symbol grouping gets you the grant. The forty-eight gets you a footnote in a methods journal."

  "The forty-eight predicts."

  "The six-symbol makes you look like you found something." Silas moved to the door. "I'm going to catch two hours. You locking up?"

  "I have to finalize the summary sentence."

  "Just say they respond to stimuli. Nobody fights about response."

  "If I say respond, I admit the lexicon is irrelevant. If I say represent, I admit the prediction is secondary."

  Silas shrugged. "Sleep on it."

  He left. The sealed room settled into the quiet of the climate control system. Elena looked at the two printouts on the desk. One was the key for the six-symbol lexicon, grouping the nodes into broad quadrants that formed legible sequences. The other was the forty-eight symbol key, a dense map of individual nodes that yielded no syntax, only high-fidelity correlation.

  She picked up the six-symbol key. The paper was smooth, the groupings bold and simple. It was the map that allowed her to say the colony was a thinker. It was the map that made the noise into a voice. It was also the map that failed to predict the turn at node fourteen.

  She picked up the forty-eight key. It was complex, unintelligible, a scatter of data points that mirrored the colony's success without offering a reason. It was the truth of the assay, devoid of the anthropology she had built her career on.

  The cursor blinked after *tracks*. It was a weaker claim. It surrendered the mind to the mechanism. It accepted that the attribution of thought was a scoring artifact, not a discovery.

  Elena stood up. The chair scraped against the epoxy floor. She walked to the corner where the shredder sat beneath the waste sink. She fed the six-symbol key into the slot. The machine whirred, teeth catching the paper, pulling it down in a steady, mechanical rhythm until the legible groups were reduced to confetti.

  She returned to the desk and saved the document.
