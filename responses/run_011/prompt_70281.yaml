          *   *Democracy:* Counter-majoritarian difficulty is accepted; democracy requires pre-commitments that courts enforce.
          *   *Coherence Check:* Can courts claim to just "apply law" while making policy choices? (Legal Realism vs. Formalism).

      *   **United Kingdom (Weak-Form Review / HRA 1998):**
          *   *Mechanism:* Interpretive obligation + Declaration of Incompatibility (statute remains valid).
          *   *Implicit Theory:* Legal validity is separate from moral correctness (Positivism). Rights have "right answers" but courts lack the *authority* to enforce them against Parliament. Parliament is the ultimate moral arbiter.
          *   *Democracy:* Parliamentary Sovereignty is paramount. Dialogue model (courts signal, legislature decides).
          *   *Coherence Check:* Is a judgment that changes nothing meaningful? (It signals political cost).

      *   **Canada (Charter + s.33 Notwithstanding Clause):**
          *   *Mechanism:* Courts invalidate (like US), but Legislature can override (like UK but stronger) for 5 years. Some rights non-derogable.
          *   *Implicit Theory:* Hybrid. Rights are fundamental limits *unless* the democratic process explicitly reclaims the space. The "carve-out" suggests a distinction between procedural/democratic preconditions (non-derogable) and substantive rights (derogable).
          *   *Democracy:* "Dialogue Theory." Courts and Legislatures are partners. The sunset clause forces electoral accountability for rights violations.
          *   *Coherence Check:* How can a law be "of no force" (s.52) yet validly operated via s.33? (s.33 acts as a definitional limit on the scope of the right or a rule of recognition change).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight. Validate the "baffling" nature of the Canadian model. Set the stage for a philosophical reconstruction rather than doctrinal summary.

      *   **Section 1: The United States (The Rights-as-Trumps Model):**
