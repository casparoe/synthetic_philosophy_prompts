          *   *Coherence:* The "Advisory Judgment." It works only if political cost is real.

      *   **Section 3: Canada (The Dialogue/Conditional Supremacy Model):**
          *   *Rights:* Two tiers. Democratic preconditions (absolute) vs. Substantive claims (conditional).
