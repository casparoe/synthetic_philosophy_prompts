answer: |-
  He would reject the Anthropocene as a formal epoch while accepting humanity as a geological agent, insisting that stratigraphic units must reflect biological turnover rather than causal agency.

  Lyell's classification system was fundamentally descriptive of effects, not causes. When he divided the Tertiary, he named periods based on the proportion of living species found in the fossil record, creating a taxonomy of biological succession. This was a deliberate move away from naming rocks after the mechanisms that formed them, such as volcanic or aqueous causes, which he felt led to theoretical disputes rather than empirical observation. Consequently, he would view a unit named for an agent—humans—as a regression into the kind of causal speculation he spent his career suppressing. For Lyell, the rock record speaks through the remains of life it contains; to name a layer after the thing that moved the dirt is to prioritize the actor over the evidence. This is a demonstrable holding from his published work on stratigraphic nomenclature, where he consistently argued that names should remain neutral regarding origin stories to ensure stability across changing theories.

  Where we must extrapolate from temperament is on the question of timescale. Lyell operated with a deep time perspective that viewed human history as a fleeting instant. He acknowledged that humans alter landscapes, but he generally compartmentalized this into historical time rather than geological time. He would likely argue that an epoch requires a duration sufficient for significant biological mutation and extinction, neither of which has fully played out relative to the vastness of the Pliocene or Pleistocene. Here, the percentage rule becomes the central objection, but not merely as a mathematical threshold. You suggest the rule is the killer objection because most species are still extant, and you are largely correct, but Lyell would frame this differently. He would argue the rule was not just a local convenience for Tertiary beds but an expression of a universal principle: stratigraphic boundaries mark transitions in the state of the biosphere. If the biosphere remains largely intact, the boundary is premature. He might concede that radionuclides are distinct markers, but he would classify them as chemical anomalies within the current epoch rather than harbingers of a new one, akin to a volcanic ash layer that does not itself define an era. To elevate a chemical spike to an epoch name would, in his view, confuse a local event with a global biological transition.

  On the matter of who decides, Lyell's position is complex because he was both a consensus builder and a staunch defender of expert authority. He fought long battles against clerics and catastrophists who imposed external narratives on the earth, preferring the slow accumulation of agreement among competent field naturalists. He would likely view a formal commission with ratification authority as a necessary evil to prevent chaos, provided the commission consisted of working geologists rather than administrators. However, he would be unsympathetic to the complaint that people affected by the choice deserve a seat at the table. For Lyell, geological truth was not democratic; it was discovered by trained observers capable of reading the strata. He would see the inclusion of social or political representatives in a stratigraphic decision as a contamination of science by sentiment. The boundary exists in the mud regardless of who suffers from the naming of it. This extrapolation relies on his consistent dismissal of popular opinion in scientific matters, though it must be noted he was skilled at managing public perception to aid acceptance of his theories. He distinguished sharply between persuading the public and letting the public decide the facts.

  There is, however, a documented commitment that damages this verdict significantly. In his major work on geological principles, Lyell devoted substantial attention to humans as a geomorphological force. He calculated the volume of earth moved by human agriculture and construction, comparing it favorably to the sediment loads of major rivers. He explicitly categorized human industry alongside wind and water as a power that denudes and deposits material on a massive scale. This admission undermines a flat rejection of human geological significance. It forces a nuance into his verdict: he would have to concede that humans are indeed a geological agent of the first order, potentially rivaling natural forces. This does not grant the epoch status, but it validates the core physical claim of the Anthropocene proponents. It suggests his rejection would be purely taxonomic, not ontological. He would agree we are changing the earth, but insist we have not yet changed the life on it enough to warrant a new name in the calendar of life.

  The part of this question where Lyell is least useful is the formal bureaucratic procedure of the International Commission on Stratigraphy. The concept of a global voting body with strict charters and ratification protocols is an anachronism that postdates his entire career. Lyell operated in a world of correspondence, personal reputation, and book publication. He has no framework for evaluating the legitimacy of a committee vote versus a monograph. He would judge the decision by the weight of the evidence presented, not the procedure used to announce it. Asking him to evaluate the fairness of a ratification process is like asking a clockmaker to judge the fairness of a digital algorithm; the mechanism of authority has shifted from individual prestige to institutional protocol in a way he could not anticipate. He would likely view the procedure as irrelevant noise surrounding the real work, which happens in the field with a hammer and a lens.
