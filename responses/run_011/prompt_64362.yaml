prompt: |-
  You're a historian of geology who also works on the philosophy of science — please think carefully before answering, and do your own brainstorming first (you don't have to show me all of it, just where it pays off).

  Here's what I'm after. Charles Lyell died in 1875 and so never saw any of the Anthropocene debate, but he's arguably the last person whose opinion would actually settle something, because the convention everyone is fighting about is more or less his invention. In 1833 he carved the Tertiary into Eocene, Miocene and Pliocene on the basis of what proportion of the fossil shells in a bed belonged to species that are still living — a taxonomic-percentage rule — with names that describe the contents of the strata relative to the present (Eocene as the dawn of the recent) rather than any cause. So: imagine the whole Anthropocene question is put to him. A proposed new epoch named after an agent rather than after its fossils. A boundary marked by a spike in fallout radionuclides in lake and marine sediment. Candidate start dates ranging from the Neolithic through the 1610 Columbian carbon-dioxide dip to the mid-twentieth century. And a stratigraphic commitee with a formal ratification procedure deciding whether any of it counts.

  Give me his most likely verdict, and in particular:

  1. Lead with your bottom line in the first sentence: does he accept it, reject it, or accept it only on amended terms. Then the reasoning, no preamble and no restating my question back at me.
  2. Separate what he demonstrably held from what you're extrapolating from temperament, and flag the difference as you go. Where did he land, so far as you can tell, on whether human beings count as a geological agent at all?
  3. My own hunch is that his percentage rule is the killer objection — if the overwhelming majority of species are still extant, on what basis is this a new epoch rather than a very recent one? Argue that through properly instead of just agreeing with me, and tell me straight if you think I've got it wrong, or if Lyell would say the rule was only ever a local convenience for Tertiary beds and not a general criterion for boundaries.
  4. Then the who-decides half: given his own long fights over who gets to settle geological questions — field men, naturalists, clerics, rival surveyors — what would he make of a commission with the authority to declare when the present epoch began, and of the complaint that the people most affected by the choice had no seat on it?
  5. One place where he'd surprise me: a documented commitment of his that points the other way from your verdict, and how much damage it does.
  6. Finish with the part of this question he's least useful on, and why.

  Constraints: no bibliography, no reading list, no citations, and please don't quote him — not one phrase inside quotation marks, because I can't check it and I'd rather have a careful paraphrase. Don't invent letters, lectures, diaries or books he never wrote, and don't put words in the mouths of living geologists. Short headings after the bottom line are fine. Somewhere around 900–1200 words, and don't hedge every sentence into mush — I want a position with the uncertainty marked only where its real.
