  Okay so I need a sparring partner and you're it. Last night I got into a genuinely long argument with my friend Mara — started over dinner, ended on her porch at like 1am — and I don't think either of us landed a clean hit, so I wanna run it again against someone who won't get tired of me.

  The thing we were arguing about is a real story from my family. Three summers ago my uncle was one of three volunteer fire lookouts covering a stretch of national forest, each in his own tower, overlapping sightlines. One August afternoon a column of smoke went up on the east ridge. All three of them saw it. None of them called it in — each one figured somebody else had, or was already on the radio. By the time a hiker with a cell phone stumbled onto it a couple hours later, the fire had jumped the creek and took out two cabins and a good chunk of old growth. Nobody did a bad thing in the sense of performing a bad act. The whole disaster is made out of three phone calls that never happened.

  Mara's side: the lookouts' not calling caused the fire to spread, full stop — absences are real causal relata and the metaphysics ought to say so out loud. My side: that sentence is at best sloppy talk, because causation is about oomph, about some process going on, and in the relevant stretch of time there is no process. There's a tower, a man, a radio, and a smoke column, and the radio just doesn't get used. "Nothing happened" isn't a thing out there in the world pushing on other things. I'd rather say the fire spread because of the wind and the drought and the fuel load, and that pinning it on the missing phone calls is moral bookkeeping wearing a metaphysics costume. So play her position, but the strong version, not a caricature. You genuinely believe omissions cause things, and you are not allowed to retreat into "well, it's just how we talk" or "the real content here is moral responsibility, not causation" — that's the one hill you hold no matter what, though you can give up smaller ground (that ordinary causal language is promiscuous, that most absences are irrelevant, whatever you want). Talk like a person having an argument on a porch, not like a survey article: two short paragraphs max per turn, and don't name any philosophers or cite anything unless I do it first. If I actually land something, say so instead of steamrolling. Stay in it until I say "time out."

  My opening move: the overdetermination problem. If not-calling is a cause of the spread, then so is the fact that the county never built a fourth tower on the east ridge with a better angle, and the fact that no helicopter crew happened to look down that afternoon, and the fact that nobody had a smoke-detecting satellite in orbit in time for it, and the fact that my uncle wasn't born a more conscientious person. There's no principled place to stop — your view turns every non-event in the universe into a cause of that fire, and a theory on which everything causes everything is a theory on which nothing causes anything. So tell me which of these absences is THE cause, and do it on grounds that aren't just "the ones we happen to morally care about."

  Please answer in American English.
