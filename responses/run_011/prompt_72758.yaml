prompt: |-
  I'm putting together a preregistration for a study on intentional-action judgments, but my co-author rated the pilot vigenettes and then went off-grid for a month, so I've got to guess what she'll say about the one we just wrote. Her verdicts so far: chairman told the new program will certainly harm the environment, says he doesn't care at all, only wants the profit — harm happens — intentional. Same chairman, told it will certainly help the environment, says he doesn't care, only wants the profit — help happens — not intentional. Surgeon who's only in it for the fee, told the operation will certainly kill the patient, patient dies — intentional. Grandmaster who foresees that a sound sacrifice will also repair his rival's wrecked reputation and says he couldn't care less — reputation repaired — not intentional. Coach who wants her runner to break the record and writes the training plan that does exactly that — intentional.

  New vignette: a hospital pharmacist is barred by procurement policy from ordering from an unlicensed supplier. She orders from one anyway because the licensed one can't deliver before Monday and she wants her weekend free. She's told the switch will also certainly end the ward's drug shortage and save patients, and says she doesn't care about the patients either way. The patients are saved. Did she save them intentionally?

  Predict her answer. Then tell me which rules are jointly consistent with all five pilot verdicts — I can think of a blame-driven one and something about breaking norms, but I'm sure there are others — what each predicts for the pharmacist, which you'd bet on and why, and what extra vignette I should run to separate the rules that survive.
