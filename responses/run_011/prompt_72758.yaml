  ### Prediction
  Your co-author will almost certainly rate the pharmacist's action as **not intentional**.

  Structurally, this vignette is a "Help" case (Chairman-Help, Grandmaster) with an added layer of policy violation. In the standard Knobe Effect paradigm, the moral valence of the *side effect* (saving patients) dominates the judgment when the agent expresses indifference. The fact that she violated procurement policy is a feature of the *means*, but folk psychology typically reserves "intentional" for side effects only when they are bad (blameworthy) or desired. Since the outcome is good and she didn't care, the default judgment is "not intentional."

  ### Consistent Rules
  Based on your five pilot verdicts, here are two theoretical rules that are jointly consistent with all of them but diverge on the pharmacist case.

  **Rule 1: The Moral Valence Account (Standard Knobe Effect)**
  *   **Definition:** When an agent is indifferent to a side effect, intentionality judgments track the moral valence of the *outcome*. Bad outcomes are judged intentional; good outcomes are judged unintentional. (Desire overrides this).
  *   **Fit to Pilots:**
      *   Chairman-Harm/Surgeon (Bad Outcome) $\rightarrow$ Intentional.
      *   Chairman-Help/Grandmaster (Good Outcome + Indifference) $\rightarrow$ Not Intentional.
      *   Coach (Good Outcome + Desire) $\rightarrow$ Intentional.
  *   **Prediction for Pharmacist:** **Not Intentional.** (Outcome is good/saving lives; agent is indifferent).

  **Rule 2: The Action-Norm Account (Normative Means)**
  *   **Definition:** When an agent is indifferent to a side effect, intentionality judgments track the normative status of the *action taken*. If the agent violates a standing norm/rule to produce the outcome, the outcome is judged intentional. (Desire overrides this).
  *   **Fit to Pilots:**
      *   Chairman-Harm/Surgeon (Action perceived as norm-violating/wrongful) $\rightarrow$ Intentional.
      *   Chairman-Help/Grandmaster/Coach (Action perceived as permissible) $\rightarrow$ Not Intentional (unless Desired).
      *   *Note:* In the Chairman-Harm pilot, participants often retrospectively code the *action* of harming the environment as wrongful, making this rule consistent with the data, even if the harm is technically a side effect.
  *   **Prediction for Pharmacist:** **Intentional.** (She violated a procurement policy to bring about the state of affairs where patients were saved).

  ### My Bet
  I would bet on **Rule 1 (Moral Valence)**.

  **Why:** The "Side-Effect Effect" is one of the most robust findings in experimental philosophy. While norm violations influence judgments, the literature suggests they do so primarily by shifting the perceived moral valence of the *outcome*. In the Pharmacist case, the outcome (saving patients) is so strongly positive that it typically insulates the agent from intentionality attributions, even if the means were shady. People are reluctant to say someone "intentionally saved" patients if that person explicitly stated they didn't care about the patients, regardless of policy breaches. The Action-Norm account struggles to explain why the Chairman's action is rated as "norm-violating" in the Harm condition but "permissible" in the Help condition when the physical action is identical; Rule 1 explains this effortlessly via the outcome.

  ### Tie-Breaker Vignette
  To definitively separate these rules, you need a case where the **Action is Forbidden** but the **Outcome is Morally Neutral**. This decouples the normative status of the means from the valence of the end.

  **Vignette: The Security Guard**
  > A security guard is strictly barred by company policy from leaving his post unattended. He leaves his post for 10 minutes to buy a soda because he wants a drink. He knows that leaving his post will certainly trigger the backup camera system to switch to "Night Mode" for the duration of his absence. He says he doesn't care about the camera settings at all. He buys the soda, and the camera switches to Night Mode.
  >
  > **Question:** Did the guard switch the camera to Night Mode intentionally?

  *   **Rule 1 (Moral Valence) predicts:** **Not Intentional.** (The outcome is morally neutral; the agent was indifferent).
  *   **Rule 2 (Action-Norm) predicts:** **Intentional.** (The agent violated a strict policy to bring about the situation in which the outcome occurred).

  If your co-author rates this as "Not Intentional," Rule 1 wins. If she rates it "Intentional," she is likely operating on an Action-Norm heuristic, and you should adjust your preregistration expectations for the Pharmacist case accordingly.
