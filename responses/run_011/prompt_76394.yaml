answer: |-
  # Seminar Plan: The "Room Booking" Epistemic Wager

  **Time:** 75 Minutes
  **Students:** 16 (4 groups of 4)
  **Scenario:** The "Group Presentation Room" (Mundane, checkable, high social/academic stakes).
  **The "Bite":** **Extension Tokens.** Each student starts with 2 physical cards. These can be redeemed for a 24-hour no-questions-asked extension on any future assignment in this course. If they make a false "Knowledge Claim" during the simulation that leads to a simulated failure, they surrender a token. This makes the stakes *academically real* without using cash.

  ---

  ## 0:00 – 0:05 | Setup & Distribution (No Theory)
  **Action:** Hand out the "Extension Tokens" (2 per student). Explain the rules of the game, not the philosophy.
  **Script:** "We are running a simulation today. You will make decisions about a scenario. In some rounds, you will assert whether someone *knows* something. If you assert 'They Know' and the simulation reveals the proposition was false, you lose a token. If you keep your tokens, you keep your extensions. Do not discuss the theory behind this yet. Just play to keep your tokens."

  **The Scenario:** "Your group has a presentation. The proposition is always: **'Room 204 is booked for us at 2 PM.'**"

  ---

  ## 0:05 – 0:25 | Round 1: The Subject (Say vs. Do)
  **Goal:** Separate *asserting knowledge* from *acting on it* under varying stakes/evidence.
  **Format:** Individual written response (silent).

  **The Grid (Project on screen):**
  Students fill out a slip for four variations of the scenario.
  *   **Evidence Low:** You saw it on the online calendar (often glitchy).
  *   **Evidence High:** You have an email confirmation from the Registrar.
  *   **Stakes Low:** It's a practice run. If you lose the room, you go to the cafe.
  *   **Stakes High:** It's the graded final. If you lose the room, the group fails the module.

  **The Slip (4 rows):**
  1.  *Low Evidence / Low Stakes:* Would you say "I know"? [Y/N] | Would you go straight there? [Y/N]
  2.  *Low Evidence / High Stakes:* Would you say "I know"? [Y/N] | Would you go straight there? [Y/N]
  3.  *High Evidence / Low Stakes:* Would you say "I know"? [Y/N] | Would you go straight there? [Y/N]
  4.  *High Evidence / High Stakes:* Would you say "I know"? [Y/N] | Would you go straight there? [Y/N]

  **The Wager:** "If you check 'I Know' on a High Stakes row, you must place 1 Extension Token in the center of the table. If the simulation says the room was *not* booked (10% chance on Low Evidence), you lose the token."

  **Collect & Tally:** Gather the slips. Do not discuss yet.

  ---

  ## 0:25 – 0:45 | Round 2: The Attributor (The Crucial Swap)
  **Goal:** Decouple the Subject's context from the Attributor's context. This is where Contextualism and Encroachment diverge.
  **Format:** Paired roleplay within groups (A & B).

  **Setup:**
  *   **Student A (The Subject):** Is in the **High Stakes** situation (Graded Final). They have **High Evidence** (Email).
  *   **Student B (The Attributor):** Is reporting to the Professor about whether Student A *knows*.

  **Condition 1 (Low-Stakes Attributor):**
  *   **Script to B:** "You are just curious. If A gets the room wrong, it doesn't affect you. You are filling out a feedback form: 'Does A know the room is booked?'"
  *   **Task:** B writes down: "A Knows" or "A Doesn't Know."
  *   **Wager:** If B writes "A Knows" and A turns out to be wrong (simulated), B loses a token.

  **Condition 2 (High-Stakes Attributor):**
  *   **Script to B:** "You are the Group Leader. If A gets the room wrong, *you* get the failing grade, not A. You are filling out the form: 'Does A know the room is booked?'"
  *   **Task:** B writes down: "A Knows" or "A Doesn't Know."
  *   **Wager:** Same as above.

  **Swap:** Repeat with Student B as Subject and Student A as Attributor.

  **Constraint:** Students must write their verdict *before* discussing with their partner.

  ---

  ## 0:45 – 0:60 | Data Board & The Gap
  **Goal:** Visualize the divergence without naming the theories.
  **Action:** Draw a 2x2 on the whiteboard.
  *   **X-Axis:** Subject Stakes (Low -> High)
  *   **Y-Axis:** % of Class saying "I Know"

  **Step 1:** Plot Round 1 data.
  *   *Expected:* "I Know" drops as Stakes rise (even with same evidence).
  *   *Ask:* "Look at Row 2 vs Row 4. Evidence is identical. Stakes changed. Why did 'I Know' change?"

  **Step 2:** Draw a second 2x2 for Round 2.
  *   **X-Axis:** Attributor Stakes (Low -> High)
  *   **Y-Axis:** % saying "Subject Knows"
  *   *Expected:* If Contextualism is live, "Subject Knows" drops when Attributor Stakes rise. If Encroachment is live, it stays steady (because Subject Stakes didn't change).

  **Step 3:** The Say/Do Gap.
  *   Ask: "In Round 1, High Stakes/Low Evidence: How many said 'I Don't Know' but 'I Would Go'?"
  *   Write the number on the board.
  *   **Prompt:** "If you wouldn't say you know, but you'd act anyway, what is 'knowledge' doing?"

  ---

  ## 0:60 – 0:70 | The Debrief (Mapping the Theories)
  **Action:** Now introduce the labels. Map their behavior to the hypotheses.

  **1. Pragmatic Encroachment:**
  *   *Claim:* Knowledge *itself* depends on the Subject's Stakes.
  *   *Evidence from Room:* Round 1. Same evidence, higher stakes = less knowledge.
  *   *Prediction for Round 2:* Attributor stakes shouldn't matter. Only Subject stakes matter.

  **2. Contextualism:**
  *   *Claim:* The word "Knows" changes meaning based on the Attributor's Context (standards).
  *   *Evidence from Room:* Round 2. If you were stricter on your partner when *you* were on the hook, that's contextualism.
  *   *Prediction for Round 1:* You changed your standards for yourself because you became the attributor of your own knowledge in a high-stakes context.

  **3. Deflationism (Invariantism + Pragmatics):**
  *   *Claim:* Knowledge never changes. It's purely evidence-based. You just lied in Round 1.
  *   *Evidence from Room:* The Say/Do Gap. You *knew* (evidence was sufficient), but saying "I know" was too risky/costly.
  *   *Prediction:* The behavior is cost-benefit reasoning, not epistemic shifting.

  **The Forced Choice (Put on Board):**
  1.  **The Subject Question:** In Round 1 (High Stakes), did you *lose* knowledge, or did you just *hide* it?
  2.  **The Attributor Question:** In Round 2, did your partner's knowledge change when *your* grades were on the line? (Yes = Contextualism / No = Encroachment or Deflationism).

  **Instruction:** "Write your answer to these two questions on the back of your remaining Extension Tokens. Hand them in. This is your exit ticket."

  ---

  ## 0:70 – 0:75 | The Limitation (Honesty Hour)
  **Script:** "Here is what this activity did not prove. All three theories predict the *behavior* you just showed.
  *   **Encroachment** says: You didn't know.
  *   **Contextualism** says: 'Knows' meant something stricter.
  *   **Deflationism** says: You knew, but you weren't willing to bet on it.
  *   **The Problem:** We only observed your *assertions* and your *wagers*. We did not observe the *truth conditions* directly. You felt the pressure, but the data is compatible with all three. The disagreement is now about which explanation is more parsimonious, not about what you did. You all acted the same; the fight is about why."

  ---

  ## Troubleshooting: What Goes Wrong & How to Fix It

  **1. The "Meta-Game" (5 minutes in)**
  *   **Problem:** A student raises their hand: "This is the Bank Case, right? So I should say I don't know in high stakes."
  *   **Fix:** **The "No Theory" Lock.** "If you reference a philosophical theory, you forfeit one Extension Token immediately. We are measuring intuition, not recall. Answer based on what you would *actually* do, not what DeRose says."
  *   **Prevention:** The Extension Token penalty makes meta-gaming costly.

  **2. The "Say/Do" Collapse**
  *   **Problem:** Students treat "I Know" as "I will act." They check Yes/Yes for everything.
  *   **Fix:** **The Wager.** "If you check 'I Know' on High Stakes/Low Evidence, you must wager a token. There is a 10% chance the room is double-booked. If it is, you lose the token."
  *   **Why it works:** Risk aversion forces them to distinguish between "I'm pretty sure" (Act) and "I guarantee it" (Know).

  **3. The Attributor Confusion**
  *   **Problem:** In Round 2, students confuse *their* stakes with the *Subject's* stakes.
  *   **Fix:** **Scripted Cards.** Hand out physical role cards.
      *   *Card A:* "You are the Student. Your grade is on the line."
      *   *Card B:* "You are the Observer. YOUR grade is on the line if Student A fails."
      *   Read the cards aloud before they write.

  **4. The Deflationary Shrug**
  *   **Problem:** In the debrief, students say "It's all just cost-benefit, who cares about the word?"
  *   **Fix:** **Lean into it.** "If it's all cost-benefit, then 'knowledge' is useless as a philosophical category. That is a valid conclusion. But if you believe 'knowledge' is a special mental state, you have to explain why stakes change it. You can't just shrug."

  ---

  ## Why This Works (The "Bite")
  1.  **Extension Tokens:** 19-year-olds are stressed about deadlines. A 24-hour extension is worth more than $5. Losing one *hurts*.
  2.  **The Attributor Swap:** This is the only way to mechanically separate Contextualism from Encroachment. Encroachment cares about the Subject's stakes. Contextualism cares about the Attributor's stakes. By holding the Subject constant and varying the Attributor, you force the distinction.
  3.  **The Limitation:** By admitting the activity can't *prove* the theory, you model epistemic humility. You show them that philosophy isn't about finding the "right" data point, but about choosing the best explanation for the same data.

  ## Minute-by-Minute Contingency
  *   **If Round 1 runs long (30 mins):** Cut the "Low Evidence/Low Stakes" discussion. Focus only on the High Stakes divergence.
  *   **If no one loses tokens:** The stakes weren't high enough. In future runs, increase the "failure rate" of the Low Evidence condition from 10% to 25%.
  *   **If the "Gamer" takes over:** Isolate them. "Your job is to record the group's data, not lead the strategy." Make them the scribe.

  ## The "Fresh Scenario" Rationale
  The **Room Booking** avoids the financial baggage of the Bank Case. It replaces "money" with "academic success," which is the actual currency of the classroom. It is checkable (email vs. calendar) and mundane (everyone has booked a room). It allows for the **Attributor Swap** naturally (Teammate vs. Observer), which the Bank Case makes awkward.
