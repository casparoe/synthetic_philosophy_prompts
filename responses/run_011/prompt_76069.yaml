answer: |-
  Your historical summary is remarkably solid, with only minor nuances to tweak. The "Oxford tutor voting eighteen times" anecdote is usually associated with the pre-1832 era of open voting and faggot freeholds; by 1874, the secret ballot (1872) and stricter registration had reduced the *blatancy* of such plural voting, though the legal right to multiple votes persisted until 1948. The 7% figure for graduates in the interwar period is accurate. The City of London's business vote is indeed the sole survivor, operating under the logic that businesses pay the rates (taxes) and thus deserve representation, distinct from the national parliamentary franchise.

  Here is the analysis of the British plural franchise through the lens of the epistocracy debate.

  ### 1. What actually is this institution?

  You are correct to suspect this is not the institution modern epistocrats imagine. Modern epistocracy (e.g., Jason Brennan, David Estlund) is typically *individualistic* and *meritocratic*: it posits that specific individuals possess higher political competence and should be weighted accordingly.

  The British university constituencies began in 1603 under James I as **corporate representation**. The universities were viewed as distinct estates of the realm, akin to boroughs or counties, with specific interests (primarily the protection of endowments and religious settlement) that needed a voice in Parliament. It was a stakeholder model, not a competence model. A graduate living in India could vote for Oxford; he wasn't voting because he was wise, but because he was a member of the corporate body.

  The shift toward an epistocratic justification was a defensive reaction in the 19th century. As the working class demanded the vote, defenders like J.S. Mill (who supported plural voting) retrofitted a competence rationale: the educated should have more weight to balance the numbers of the uneducated. This distinction matters profoundly. If the institution was originally corporate, its longevity doesn't prove that epistocracy works; it proves that corporate stakeholder representation can coexist with democracy for a time. The fact that it was *defended* using epistocratic language in its final century, however, makes it a valid test case for the *arguments* used in the debate, even if the institutional DNA was different.

  **Verdict:** It is **partly** epistocracy. It functioned as a competence-weighting mechanism in practice (graduates were a proxy for class and education), but it lacked the explicit testing mechanism modern epistocrats demand, and its original justification was corporate, not epistemic.

  ### 2. The Theory vs. The Case

  **Brennan's Competence Principle**
  Brennan argues that it is wrong to subject people to incompetent decision-making. He suggests restricting or weighting the franchise to ensure minimum competence.
  *   **Prediction:** A plural franchise should yield higher quality legislation or more stable governance than a universal franchise.
  *   **Evidence:** The UK did not collapse during the plural voting era, but nor did it obviously outperform comparable democracies. More damningly, the "competence" filter was easily corrupted. The pre-1832 "faggot voting" (splitting property to create voters) and the ability to vote multiple times based on property rather than knowledge shows the filter measured *wealth*, not *competence*.
  *   **Fit:** **Distorts.** The system claimed to filter for quality but filtered for property. Brennan might argue this was a *bad implementation* of epistocracy, not a refutation of the principle. The theory is silent on whether property is a valid proxy for competence, but the historical evidence suggests it is a poor one.

  **Estlund's Reasonable Rejectability**
  Estlund argues that even if epistocracy produces better outcomes, it is illegitimate if the criteria for "knowledge" are reasonably rejectable by qualified points of view.
  *   **Prediction:** The system will face persistent political challenge from those excluded, eventually leading to abolition regardless of performance.
  *   **Evidence:** The Labour Party fought to abolish university seats from its first entry into Parliament. The 1948 abolition was a partisan Labour measure, passed despite Conservative opposition. The system survived not because it was accepted as legitimate, but because the Conservatives could sustain enough power to protect it.
  *   **Fit:** **Supports.** The abolition aligns perfectly with Estlund's claim that epistocratic arrangements cannot maintain legitimacy in a society that values political equality. The "qualified points of view" of the working class rejected the competence claim.

  **The Demographic Objection**
  Critics argue that in real-world societies, "competence" correlates with race, class, and gender, making epistocracy a tool for entrenching privilege.
  *   **Prediction:** The plural voters will be disproportionately wealthy, male, and Conservative.
  *   **Evidence:** Graduates were 7% of the electorate, overwhelmingly male and upper-class. The university seats returned Conservative MPs almost exclusively until the very end. The business vote was explicitly property-based.
  *   **Fit:** **Supports.** The British case is a textbook confirmation of the demographic objection. The "epistocratic" layer functioned as a conservative veto point, laundering class advantage through the language of education.

  ### 3. The Reckoning

  The 1948 abolition is evidence that such institutions fail primarily due to a **legitimacy deficit**, not necessarily a performance failure. There is no clear historical consensus that the university MPs made *worse* decisions than the constituency MPs; indeed, they were often praised for independence. They were abolished because the principle of "one person, one vote" had achieved a moral dominance that rendered plural voting intolerable, regardless of outcomes. This supports the democratic priority of procedural equality over epistemic optimization.

  The City of London remnant is fascinating because it survives precisely by **rejecting the epistocratic label**. It does not claim business voters are wiser; it claims they are *stakeholders* who pay the taxes. This suggests that if you frame weighted voting as corporate interest representation (the original 1603 justification), it can survive. If you frame it as "some people are smarter" (the 19th-century justification), it dies. This implies the epistocratic debate is often a proxy war for stakeholder power.

  **Confidence and Uncertainty**
  I am **highly confident** in the mapping of the theoretical objections (Estlund/Demographic) to the historical outcome, as the political rhetoric of the 1948 debate mirrors these philosophical points closely. I am **medium confident** in the assessment of the "performance" of the university MPs, as counterfactual history (would the UK have been better off without them?) is inherently speculative.

  The point I am **least sure of** is the *original intent* of James I in 1603. While the corporate representation theory is the standard historical view, historians debate whether there was an implicit assumption that university men were simply "better sort" of people even then, or if it was purely institutional interest. If there was an implicit competence claim from the start, the distinction I draw between "corporate" and "epistocratic" origins blurs.

