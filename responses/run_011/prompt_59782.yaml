answer: |-
  This phrase—"If you don't vote, you don't get to complain"—is a rhetorical shibboleth. It sounds like common sense, but it collapses under philosophical scrutiny, especially when applied to people legally barred from voting.

  Here is the full menu of precise claims hiding inside that sentence, evaluated for truth, defensibility, and applicability to your constituency (non-citizens and minors).

  ### 1. The Fairness/Reciprocity Claim
  *   **The Thesis:** "Political standing is transactional. If you avail yourself of the benefits of a democratic system, you incur an obligation to participate in its maintenance. If you decline that obligation, you forfeit the moral right to criticize the outcome."
  *   **Status:** **Substantive but Contested.** This is a version of the "principle of fairness" in political philosophy. It is defensible in theory (you can't be a free rider), but it assumes participation is *offered* to everyone.
  *   **Applicability to Barred Groups:** **False.** You cannot incur an obligation to do something you are legally prohibited from doing. A long-term resident cannot "decline" the obligation to vote; the obligation does not exist for them. Applying this to them is a category error.

  ### 2. The Exhaustion of Remedies Claim
  *   **The Thesis:** "Political complaint is legitimate only after one has exhausted the formal mechanisms available to effect change. Voting is the primary mechanism; complaining is secondary. Skipping the primary invalidates the secondary."
  *   **Status:** **Defensible (Procedurally).** In law and bureaucracy, you often must exhaust administrative remedies before suing. Translating this to democracy: try the ballot box before taking to the streets.
  *   **Applicability to Barred Groups:** **False.** There is no remedy to exhaust. Telling a 16-year-old or a non-citizen to "exhaust the voting mechanism" is like telling a prisoner to "walk out the front door" before complaining about confinement.

  ### 3. The Epistemic Claim
  *   **The Thesis:** "Voting serves as a proxy for being informed. By registering and voting, you demonstrate a baseline engagement with civic issues. Abstention signals apathy or ignorance, rendering your subsequent opinions uninformed and therefore valueless."
  *   **Status:** **False.** Voting requires no knowledge (one can vote randomly or based on a single misleading ad). Conversely, non-voters (like your youth group) may be highly informed about specific local issues (like school boundaries) without having a ballot.
  *   **Applicability to Barred Groups:** **Irrelevant.** Their lack of a ballot is a function of age or status, not engagement or knowledge.

  ### 4. The Authorization/Legitimacy Claim
  *   **The Thesis:** "Government authority derives solely from the consent of the governed, operationalized through voting. Only those who authorize the government (voters) are stakeholders. Non-voters are merely subjects, and subjects do not have standing to critique their masters."
  *   **Status:** **Substantive but Exclusionary.** This is a strict "Social Contract" view. It is logically consistent within its own framework but morally repugnant to modern human rights standards (which argue rights exist regardless of citizenship).
  *   **Applicability to Barred Groups:** **Technically True (by their logic), Morally False.** Under this claim, your clients *are* barred from complaining because they are outside the contract. However, since they are still subject to the laws (parking enforcement, school zones), the "no taxation without representation" counter-argument destroys this claim's legitimacy.

  ### 5. The Strategic/Pragmatic Claim
  *   **The Thesis:** "Complaints are only instrumentally rational if they are backed by electoral leverage. Politicians respond to voters. If you are not a voter, your complaint is noise, not signal. Therefore, voicing it is a waste of time."
  *   **Status:** **Cynically Plausible.** In a purely vote-maximizing model, politicians ignore non-constituents. However, this ignores other levers of power (moral persuasion, community organizing, litigation, public opinion).
  *   **Applicability to Barred Groups:** **Partially True but Defeatist.** It accurately describes why politicians ignore them, but it falsely concludes they *shouldn't* complain. Organizing non-voters can shift the opinions of *voters* (parents, neighbors), making the complaint strategically viable.

  ### 6. The Consistency/Hypocrisy Claim
  *   **The Thesis:** "It is inconsistent to demand the right to voice political grievances while simultaneously opposing the mechanisms (like compulsory voting) that would ensure your voice is counted, or while choosing not to utilize the voluntary mechanism available."
  *   **Status:** **Platitude.** This is usually thrown by people who oppose compulsory voting *and* demand voting for standing.
  *   **Applicability to Barred Groups:** **N/A.** This applies to the *speaker*, not your clients. The speaker is saying, "You must vote to speak," while likely opposing policies that make voting easier or mandatory. They want the *duty* without the *right*.

  ---

  ### The "Single Vote" Paradox
  You asked if any reading survives the observation that a single vote basically never decides an outcome.

  **No. The Causal and Exhaustion claims collapse entirely here.**

  If the justification for "you don't get to complain" is "you didn't change the outcome," then **no individual voter gets to complain.**
  *   **The Math:** In almost every election, the margin of victory is greater than one. Therefore, no single voter was causally responsible for the win or loss.
  *   **The Implication:** If standing requires causal determinacy, the phrase "If you don't vote, you don't get to complain" must be corrected to "If you didn't single-handedly decide the election, you don't get to complain." Since that is absurd, the claim cannot be about *causal influence*.

  **The Only Survivor: The Collective Duty Claim.**
  The only version that survives the "single vote" paradox is a modified version of Claim #1 (Reciprocity).
  *   **Revised Thesis:** "Voting is a collective duty. While your single vote didn't decide the outcome, your *participation* in the aggregate ritual of democracy grants you membership in the body politic. Abstention is a withdrawal from that body."
  *   **The Flaw:** This still fails for your clients. They are not "withdrawing" from the ritual; they are barred from the building.

  ### Summary for Your Work
  When someone tells a non-citizen or a 16-year-old "If you don't vote, you don't get to complain," they are making a **category error**.

  1.  **They are treating a status as a choice.** They are speaking to people who *can't* vote as if they *won't* vote.
  2.  **They are conflating legitimacy with leverage.** They are implying that because your clients lack electoral leverage, they lack moral standing.
  3.  **They are ignoring the "Subjecthood" reality.** Your clients are subject to the parking enforcement and the school boundaries. In political theory, being subject to coercion (the law) generates a right to contest that coercion, regardless of voting status.

  **The Counter-Argument:**
  "The phrase 'no taxation without representation' wasn't a demand for the right to vote; it was a demand that governance requires the consent of the governed. These residents pay taxes and obey laws. Their complaint *is* their representation, because the system has denied them the ballot. To silence them is to enforce tyranny, not democracy."
