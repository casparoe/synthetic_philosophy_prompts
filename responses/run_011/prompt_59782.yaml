prompt: |-
  I work at a community org, and a lot of the people we serve are long-term residents without citizenship, so they're barred from voting in any local election. When they object to something — the new parking enforcement, a school boundary change — somebody always answers "if you don't vote, you don't get to complain." Same line gets thrown at the 16-year-olds in our youth group, usually by people who also oppose making voting compulsory. Can you lay out the different precise claims that one sentence could actually be making? I want the full menu: a forfeiture-of-standing claim, a no-causal-influence claim, a hypocrisy or self-consistency claim, a you're-not-informed-enough-to-object claim, some kind of legitimacy or authorization claim, whatever else is hiding in there. State each as a real thesis rather than a vibe, say which are platitudes, which are false, which are substantive but defensible, and which of them even could apply to someone who's legally not allowed to vote. And does any reading survive the observation that a single vote basically never decides an outcome anyway?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user works at a community org serving non-citizen long-term residents and youth (under 18). These groups are barred from voting.
      *   **Problem:** When they object to local policies (parking, schools), they are told: "If you don't vote, you don't get to complain."
      *   **Task:** Deconstruct this sentence ("If you don't vote, you don't get to complain") into precise philosophical/political claims.
      *   **Requirements:**
          *   List the "full menu" of interpretations (forfeiture, causal influence, hypocrisy, epistemic, legitimacy, etc.).
          *   State each as a real thesis (not a vibe).
          *   Evaluate each (Platitude? False? Substantive/Defensible?).
          *   Assess applicability to non-voters (non-citizens/minors).
          *   Address the "single vote doesn't matter" counter-argument.

  2.  **Deconstruct the Sentence ("If you don't vote, you don't get to complain"):**
      *   *Surface meaning:* Voting is the price of admission for political grievance.
      *   *Underlying assumptions:* Democracy is transactional; voice is earned through participation; complaints imply a demand for change which requires electoral leverage.

  3.  **Brainstorming the Claims (The "Menu"):**

      *   *Claim 1: The Fairness/Reciprocity Claim.* You benefit from the system, so you must participate. If you opt out, you can't gripe. (Hypocrisy/Consistency).
      *   *Claim 2: The Causal/Instrumental Claim.* Complaining is only valid if you tried to change it via the proper channel (voting). If you didn't pull the lever, you didn't try.
      *   *Claim 3: The Standing/Forfeiture Claim.* By not voting, you waive your right to have an opinion on the outcome.
      *   *Claim 4: The Epistemic Claim.* Voting proves you are informed. No vote = no knowledge = no valid opinion.
      *   *Claim 5: The Legitimacy/Authorization Claim.* Only voters authorize the government. Non-voters are subjects, not stakeholders.
      *   *Claim 6: The Strategic/Pragmatic Claim.* Complaining without voting is useless noise. Focus on voting or shut up.

  4.  **Drafting and Evaluating Each Claim:**

      *   *Claim 1 (Reciprocity/Hypocrisy):* "One forfeits the moral standing to criticize collective decisions if one declined to participate in making them."
          *   *Status:* Substantive but contested.
          *   *Applicability:* Fails for those *barred* from voting. You can't forfeit what you don't have.
      *   *Claim 2 (Causal/Exhaustion of Remedies):* "Political complaint is legitimate only after exhausting available formal mechanisms of influence."
          *   *Status:* Defensible in some contexts, false here.
          *   *Applicability:* Fails for barred groups (no mechanism exists).
      *   *Claim 3 (Epistemic):* "Voting is a proxy for being informed; abstention signals ignorance."
          *   *Status:* False/Platitude. Voting doesn't guarantee knowledge; not voting doesn't guarantee ignorance.
          *   *Applicability:* Irrelevant to barred groups.
      *   *Claim 4 (Authorization/Legitimacy):* "Political authority derives solely from the consent of the voters; non-voters are outside the social contract."
          *   *Status:* Substantive (Social Contract Theory) but exclusionary.
          *   *Applicability:* Technically applies (they aren't voters), but morally weak for long-term residents subject to laws.
      *   *Claim 5 (Pragmatic/Effectiveness):* "Complaints are only instrumentally rational if backed by electoral threat."
          *   *Status:* Cynical but practically true in some systems.
          *   *Applicability:* Disempowering but descriptive of reality.

  5.  **Addressing the "Single Vote" Paradox:**
      *   The phrase implies voting *matters*. But statistically, one vote rarely decides an election.
      *   If the claim is "You didn't decide the outcome," then *no one* gets to complain (since no single voter decides).
      *   Therefore, the claim must be about *collective* participation or *attempted* influence, not causal determinacy.
      *   This undermines the Causal/Instrumental claim significantly.

  6.  **Refining the Analysis for the User's Context:**
      *   The user specifically mentioned non-citizens and minors. This is crucial.
      *   Most of these claims collapse when applied to people *legally prohibited* from voting.
      *   "If you don't vote" implies "If you choose not to vote." For barred groups, it's "If you can't vote."
      *   This shifts the claim from "Abstention" to "Status."

  7.  **Structuring the Response:**
