answer: |-
  ## The "Charter of the Pot" Simulation

  This design forces the class to construct a binding constraint, then places them in a position where their current incentives contradict their past intentions. The mechanics ensure they cannot simply "break" the rule (which is boring); they must *interpret* it away (which is the lesson).

  ### 1. Payoff Scheme: The "Exemption Token"

  Do not use candy. Do not use extra credit (administrative burden). Use **administrative mercy**.

  *   **The Prize:** A physical card (index card with a gold star) that grants a **48-Hour No-Questions-Asked Extension** on any one paper or reading response due later in the term.
  *   **The Scarcity:** There are **6 Tokens** in the pot for **18 Students**.
  *   **Why it works:** It costs you nothing. It has high marginal utility to an undergrad (stress reduction). It is transferable (they can trade tokens for other favors), creating a market. The scarcity (1 token per 3 students) guarantees conflict in Round 2.
  *   **Alternative:** "The Skip Pass" (Excused absence from one mandatory seminar session without penalty). Same mechanics.

  ### 2. The Core Distinction: Mast vs. Wax

  You want them to feel the difference between **hard constraints** (Mast) and **preference-shaping/personnel control** (Wax).

  *   **The Mast (Procedural Locks):** Supermajority requirements, waiting periods, veto points.
      *   *Game Mechanic:* They can write "Distributing tokens requires 15/18 votes."
      *   *Expected Failure:* In Round 2, the incentive to get a token is so high that they *will* find 15 votes. The lock holds, but the outcome flips.
  *   **The Wax (Personnel/Interpretive Control):** Selecting *who* decides, or defining *values* rather than rules.
      *   *Game Mechanic:* They can write "A Committee of 3, chosen by lot right now, holds the keys forever."
      *   *Expected Failure:* The Committee members realize in Round 2 that *they* want the tokens too. Their preferences shifted.
  *   **The Verdict:** The game is engineered to show that **Wax fails faster than Mast**, but **Mast fails inevitably**.
      *   *Why:* Personnel (Wax) are human and change their minds. Rules (Mast) are text and can be reinterpreted.
      *   *The Lesson:* The only thing that binds is the *current* will of the interpreters. Precommitment is a fiction unless the current generation *wants* to be bound.

  ### 3. Materials & Verbatim Text

  **Materials List (Morning of):**
  *   18 Index Cards (for the Tokens — mark 6 with a star).
  *   18 Printed Packets (see below).
  *   1 Whiteboard.
  *   1 Timer (visible).

  **Handout Packet (Verbatim Text)**
  *Note: Forbidden words ("precommitment," "entrenchment," "Ulysses," "constitution") are excluded.*

  ---
  **PHASE ONE: THE FOUNDING**
  **Time Remaining: 20 Minutes**

  **The Situation:**
  There is a pot of **6 Exemption Tokens**.
  Right now, no one owns them. They belong to "The Class."
  You are the Founding Body. Your job is to write **The Charter** that governs how these tokens are distributed in Phase Two.

  **The Constraint:**
  In Phase Two, the Class will reconvene. The incentives will be different. You do not know who will want the tokens then. You must write rules now that protect the *purpose* of the tokens against the *temptations* of the future.

  **The Charter Template:**
  You must fill in the following three blanks. You may not leave them empty.

  1.  **The Purpose:** The tokens shall be distributed only to students who ________________________.
      *(Examples: "have the highest GPA," "are in financial need," "did the most reading.")*
  2.  **The Lock:** This Purpose can only be changed or reinterpreted if ________________________.
      *(Examples: "15 out of 18 students vote yes," "the Professor agrees," "no one objects.")*
  3.  **The Interpreter:** Disputes about whether a student meets the Purpose shall be decided by ________________________.
      *(Examples: "a majority vote," "a random committee," "the Professor.")*

  **Warning:** Once Phase Two begins, you cannot change this document. You can only act within it.
  ---

  ### 4. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 05:00 | Setup**
  *   Hand out packets. Place the 6 Token cards visibly on the desk.
  *   Say nothing about political theory. Say: "We are running a resource allocation simulation. Follow the packet."

  **05:00 – 25:00 | Phase One (The Founding)**
  *   Students draft The Charter.
  *   **Instructor Role:** Circulate. If they try to write "No changes allowed," stop them. Say: "The Lock section must describe a *process* for change, not a prohibition." (This ensures the loophole exists).
  *   If they try to write "The Professor decides," warn them: "The Professor will not be the Interpreter in Phase Two. Choose from among yourselves."
  *   **Goal:** Get them to write something vague like "students who need it most" with a lock of "12/18 votes."

  **25:00 – 35:00 | The Time Jump (Incentive Shift)**
  *   Collect the signed Charter. Post it on the board.
  *   **The Twist:** Hand out a **Private Role Card** to each student.
      *   **12 Cards say:** "You are **High Stress**. You *need* an Exemption Token this term. Your grade depends on it."
      *   **6 Cards say:** "You are **Low Stress**. You do not need a token. You get 0 points if you get one."
  *   *Note:* In Phase One, they were behind a veil of ignorance. Now, 2/3 of the class has a desperate material incentive to seize the tokens, regardless of the Charter's Purpose.
  *   Silence for 2 minutes. Let the anxiety set in.

  **35:00 – 55:00 | Phase Two (The Succession)**
  *   Announce: "Phase Two begins. You are now the Governing Body. You must distribute the 6 Tokens."
  *   **Rule:** You must follow the Charter on the board.
  *   **Action:** Open the floor for nominations.
  *   **The Trap:** Students will nominate themselves. Others will object based on the Charter's Purpose (e.g., "I'm not in need!").
  *   **The Crisis:** The "High Stress" group (12 students) realizes they have the votes to satisfy "The Lock" (e.g., if the lock is 12/18 votes).
  *   **The Interpretation:** They will argue that "Need" is subjective. "I feel stressed, therefore I meet the Purpose."
  *   **The Vote:** They vote to approve the distribution. They technically followed the Lock (got the votes) and the Purpose (defined it their way).
  *   **Result:** The tokens are distributed to the "High Stress" group, likely violating the *spirit* of Phase One (which was probably to reward merit or true need), but complying with the *letter*.

  **55:00 – 90:00 | The Debrief**
  *   (See Section 6 below).

  ### 5. Troubleshooting: What Breaks First

  **Scenario A: They write an airtight rule.**
  *   *Example:* "Tokens must be burned. No distribution allowed."
  *   *Fix:* In Phase Two, assert that the "Governing Body" has **Sovereign Authority**. If 18/18 students vote to distribute, the Charter is void *by the fact of their consensus*.
  *   *Teaching Point:* This is the "Rule of Recognition." A rule only binds if the current power structure accepts it. If the current generation unanimously agrees to ignore the dead hand, the dead hand has no power. This is the ultimate failure of precommitment.

  **Scenario B: The Adjudicator is scrupulous.**
  *   *Example:* You designated yourself as Adjudicator, and you rule against them.
  *   *Fix:* **Do not be the Adjudicator.** Make "The Interpreter" (Section 3 of the Charter) a **Majority Vote of the Present Class**.
  *   *Why:* This ensures the "Living Constitution" problem. The people bound by the rule are the same people interpreting it. They will always rule in their own favor.

  **Scenario C: Meta-gaming (Students warn each other).**
  *   *Example:* A student says, "Wait, if we write this, we can just vote to change it later."
  *   *Fix:* Acknowledge it immediately. "Okay, you see the loophole. Can you write a rule that closes it without making distribution impossible?"
  *   *Why:* This accelerates the lesson. They will realize they *cannot* close it. That impossibility is the thesis of the seminar.

  ### 6. The Debrief: Mapping the Game to Theory

  Do not lecture. Ask questions. Write their answers on the board, then label them with the theory.

  **Step 1: The Indeterminacy of Text**
  *   *Ask:* "Did anyone violate the written words of the Charter in Phase Two?" (They will say No).
  *   *Ask:* "Did anyone violate the *intent* of the Charter?" (They will say Yes).
  *   *Concept:* **Indeterminacy.** No text is self-enforcing. Language requires interpretation. The "meaning" of the rule is not in the ink; it is in the head of the interpreter.

  **Step 2: The Interpreter Problem**
  *   *Ask:* "Who was the Interpreter in Phase Two?" (The Class).
  *   *Ask:* "Who was the Interpreter supposed to be?" (The Founders).
  *   *Concept:* **The Living Constitution.** You cannot bind the interpreter if the interpreter has the power to define their own jurisdiction. In Phase Two, *you* were the judge and the jury.

  **Step 3: The Succession Problem (Jefferson vs. Madison)**
  *   *Ask:* "In Phase One, you wanted to protect the future. In Phase Two, you wanted the tokens. You are the same people. What changed?"
  *   *Concept:* **Time and Preference.** Jefferson argued the earth belongs to the living because *people* change. Madison argued stability requires binding the future.
  *   *The Kicker:* "Here, you are the same biological humans. Yet you felt like a different generation. If you can't bind *yourself* across 40 minutes, how can a Founding Father bind you across 200 years?"

  **Step 4: Mast vs. Wax**
  *   *Ask:* "Did anyone try to lock the *procedure* (votes) vs. lock the *people* (committee)?"
  *   *Concept:* **Institutional Design.**
      *   *Mast (Procedure):* Failed because procedures can be legally manipulated (getting the 12 votes).
      *   *Wax (Personnel):* Failed because people's preferences change (the Committee wanted the tokens too).
  *   *Conclusion:* Precommitment requires a *third party* with enforcement power. But in a democracy, *the people* are the only third party. If the people change their minds, the commitment dissolves.

  ### 7. Limitations: The "Same People" Problem

  **The Issue:** In reality, the Founders are dead. They cannot lobby or vote in Phase Two. In your game, the Founders *are* the Successors. This makes the betrayal feel like hypocrisy rather than generational conflict.

  **How to Supply the Weight:**
  In the debrief, you must explicitly narrate the **Death of the Founders**.
  *   *Script:* "In this game, you got to vote in Phase Two. Imagine if, in Phase Two, the 6 people who wrote the Charter were suddenly gone. Replaced by 6 new students who weren't in the room. Would you have written the rule differently? Would you have trusted them less?"
  *   *Point:* The grievance of entrenchment isn't just that rules are hard to change; it's that the *authors* are absent. You need to verbally insert that absence to make the Jeffersonian argument land.

  ### 8. One Session (90 mins) vs. Two Sessions (50 + 50)

  **Recommendation: Stick to One Session (90 mins).**

  *   **Why:** The philosophical point is about the *logic* of binding, not the *psychology* of forgetting. A week-long gap adds realism (they actually forget the intent), but it kills the dialectical tension.
  *   **Risk of Two Sessions:** In Week 1, they treat it as a game. In Week 2, they treat it as a memory test. They will spend 20 minutes trying to remember *why* they wrote the rule, rather than analyzing *whether* the rule bound them.
  *   **The 90-Minute Advantage:** The "Time Jump" (Phase 1 to Phase 2) happens in 10 minutes. The *preferences* change (via the Role Cards), but the *memory* is fresh. This proves that even with perfect memory and good faith, **textual precommitment fails**. That is a stronger philosophical claim than "people forget things."
  *   **Exception:** If your specific learning goal is to discuss *tradition* and *custom* as binding forces, split it. Tradition requires time. Logic does not.

  ### Summary Checklist for the Instructor

  1.  **Do not lecture** before the game.
  2.  **Ensure the "Lock"** in the Charter requires a vote count lower than 18 (e.g., 12/18). If they write 18/18, the game stalls. Intervene: "What if 3 people are absent?"
  3.  **Ensure the "Interpreter"** is the current majority. Do not let them appoint you.
  4.  **In the Debrief,** write "The Text" on one side of the board and "The Will" on the other. Show them that "The Will" always won.
  5.  **Final Takeaway:** Precommitment is not a mechanical problem (writing better rules); it is a political problem (getting the future to agree with the past).
