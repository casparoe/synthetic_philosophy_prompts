answer: |-
  Here is a runnable 90-minute session design. It is built to generate friction, not consensus. The goal is to make the definition of "manipulation" feel unstable before you offer your Disclosure Test as a potential stabilizer.

  ### 1. The Timeline (90 Minutes)

  *   **00–10:** Arrival & Settling. (Music, coffee, name tags).
  *   **10–20:** **Intro & Framing.** No theory. Just the task.
  *   **20–50:** **The Card Sort.** (Small groups sort 14 cases into "Persuasion" vs. "Manipulation").
  *   **50–65:** **Live Influence Round.** (You influence a real group decision).
  *   **65–80:** **Debrief & Pattern Finding.** (Why was sorting hard?).
  *   **80–90:** **The Disclosure Test.** (You introduce your hypothesis; they try to break it).

  ---

  ### 2. The Card Set (14 Cases)

  Print these on index cards. One scenario per card.
  *Design Note:* There are three "Actor Pairs" (1A/1B/1C, etc.) where the tactic is identical but the actor changes. There are also "Poison Pills" designed to break simple definitions.

  **Pair 1: Scarcity / Urgency**
  *   **1A (Retail):** An online store shows a countdown timer: "Offer expires in 10 minutes!" The timer resets every time you refresh the page. There is no actual deadline. **Stake:** You buy a jacket you don't need for $150.
  *   **1B (Nonprofit):** A fundraiser says: "A donor will match all gifts made before midnight tonight!" The deadline is real. The match is real. **Stake:** You donate $50 you hadn't planned to spend.
  *   **1C (Government):** A caseworker says: "If you don't sign this form by Friday, your benefits pause." The deadline is real, but the form could have been processed later without penalty if you'd known. **Stake:** You rush to sign a document you haven't fully read.

  **Pair 2: Social Proof / Consensus**
  *   **2A (Friend):** At a dinner, a friend says, "Everyone else is chipping in for the gift, are you?" Everyone is actually chipping in. **Stake:** You spend $40 to fit in.
  *   **2B (Tech Platform):** A pop-up says: "85% of users in your area have enabled location sharing." It's true, but the number is inflated to include inactive accounts. **Stake:** You toggle a privacy setting you wanted to keep off.
  *   **2C (Teacher):** A professor says, "Most students find this exam easy, so don't worry." Most students actually found it hard. The professor wants to reduce panic. **Stake:** You study less than you should have.

  **Pair 3: Default Options / Path of Least Resistance**
  *   **3A (HR):** New hire paperwork has a box pre-checked: "I agree to mandatory arbitration." You can uncheck it, but no one tells you. **Stake:** You lose the right to sue the company.
  *   **3B (Medical):** A doctor says, "I've gone ahead and scheduled the follow-up for Tuesday. Call if you need to change it." It's the standard of care for your condition. **Stake:** You lose an afternoon, but get necessary care.
  *   **3C (Friend):** A friend invites you to a party and says, "I'll pick you up at 8 unless you text me." They know you hate being picked up without confirmation. **Stake:** You feel trapped into going, or have to be rude to cancel.

  **The Wildcards (Ambiguous / High Friction)**
  *   **4:** A parent tells a crying child, "If you stop crying, I won't be sad." The parent *is* actually sad. **Stake:** Child suppresses emotion to protect parent.
  *   **5:** A negotiator says, "I don't have the authority to agree to that price; I have to ask my boss." They *do* have the authority. This is standard training in their industry. **Stake:** You concede $500 to "help them" get approval.
  *   **6:** A charity letter features one named child with a photo. It does not mention that 80% of funds go to overhead. It is legally compliant. **Stake:** You donate based on emotional connection, not efficiency.
  *   **7:** A surprise party. The guest of honor is told they are going to a boring dinner. They hate surprises, but their friends know they secretly love being the center of attention. **Stake:** Initial anxiety, followed by joy.
  *   **8:** A therapist uses "paradoxical intention," telling a client with insomnia to *try* to stay awake. The client sleeps. The client doesn't understand the mechanism. **Stake:** Client gets relief but feels confused about the process.
  *   **9:** You are fundraising. You know a donor cares deeply about cats. You frame your homeless-youth program as "keeping youth off the streets so they don't harm stray animals." It's true, but not your main mission. **Stake:** Donor gives $10k for a reason that isn't the core mission.

  ---

  ### 3. The Live Influence Round (Ethical Protocol)

  **The Constraint:** You must influence a real decision, but it must be safe, opt-outable, and pre-disclosed as an experiment.

  **The Setup:**
  You need the group to decide **how to spend the last 15 minutes of the session.**
  *   **Option A:** Deep dive debrief on one specific card.
  *   **Option B:** Open socializing / early leave.

  **The Ethical Safety Rail:**
  Before starting this round, you must say the following script exactly. This prevents the "betrayal" feeling.

  > **Facilitator Script:** "For the next 10 minutes, we are going to make a real decision about how to end tonight. However, I am going to attempt to steer your vote toward Option A using a specific influence tactic. I will not tell you *which* tactic I'm using until after we vote. You are free to vote however you like, and no one will know how you voted. If you feel uncomfortable at any point, you can abstain."

  **The Tactic (For your eyes only):**
  Use **Anchoring + Authority.**
  When describing Option A, say: "Given my experience running these groups, the groups that do the Deep Dive usually report higher satisfaction. I've set the timer for 15 minutes."
  When describing Option B, say: "Some people prefer to just chat." (Vague, no authority).

  **Why this clears your bar:**
  *   **Real stakes:** They control their time.
  *   **Opt-out:** They can vote B or abstain.
  *   **No embarrassment:** Secret ballot (use index cards).
  *   **No anger:** You told them you were going to try to influence them.

  ---

  ### 4. Facilitator Wording (Key Transitions)

  **Opening the Card Sort (Minute 20):**
  > "I'm handing out 14 scenarios. In your small groups, please sort them into two piles: 'Persuasion' and 'Manipulation.' Do not look for the dictionary definition. Use your gut. If you argue about a card, that is the most important card in the deck. Leave it in the middle of the table."

  **Transition to Live Round (Minute 50):**
  > "We've been talking about theory. Now we're going to generate some data. I need you to decide how we end tonight. But I'm going to be an active participant, not just a referee. Please listen to the script I read earlier about my role."

  **Introducing the Disclosure Test (Minute 80):**
  > "We've struggled to define the line based on *who* is doing it or *what* the outcome was. I want to propose a stress test. For the cards we couldn't agree on, ask this: **If the influencer had to announce exactly what they were doing before they did it, would the tactic still work?** If the answer is no, does that make it manipulation?"

  ---

  ### 5. The Debrief Flow (Minute 65–90)

  Do not lecture. Ask these questions in order. Write keywords on the whiteboard.

  1.  **The Actor Variable:** "Look at Cards 1A, 1B, and 1C. The tactic was identical (Urgency). Did the actor change the pile for you? Why?"
      *   *Goal:* Establish that *power dynamics* matter, not just the tactic.
  2.  **The Outcome Variable:** "Look at Card 7 (Surprise Party) and Card 8 (Therapist). The target didn't know what was happening. But the outcome was good. Did you put them in Manipulation?"
      *   *Goal:* Establish that *beneficence* doesn't automatically clear the label.
  3.  **The Live Round Analysis:** "Reveal your tactic (Anchoring/Authority). Raise your hand if you felt the pull. Raise your hand if you would have voted differently if I'd said 'I am using Anchoring' before I started."
      *   *Goal:* Create live data for the Disclosure Test.
  4.  **The Disclosure Test:** (Write the test on the board). "Apply this to Card 9 (The Fundraiser). If I told the donor 'I am mentioning cats just to get your money,' would the gift survive?"
      *   *Goal:* Let them see the test work on the hard cases.
  5.  **The Break:** "Where does this test fail? Give me a case where disclosure wouldn't stop it, or where disclosure would ruin something good."
      *   *Goal:* Let them find the holes (e.g., "If a teacher discloses they are grading on a curve, students might panic, but the curve is still necessary").

  ---

  ### 6. Failure Modes & Fixes

  **Failure Mode 1: The Cynic Swarm**
  *   *Symptom:* Someone says, "It's all manipulation. Capitalism is manipulation." The room agrees. Sorting stops.
  *   *Fix:* **The "Best Case" Constraint.** Say: "For the next 5 minutes, you are forbidden from calling anything manipulation unless you can propose a *better* way the influencer could have achieved the same legitimate goal. If you can't name a better way, it goes in the Persuasion pile." This forces constructive thinking.

  **Failure Mode 2: The Speed Sort**
  *   *Symptom:* They sort all 14 cards in 5 minutes. "Easy, obviously."
  *   *Fix:* **The "Swap" Rule.** Say: "Okay, trade your 'Manipulation' pile with the group next to you. You now have to defend *why* these belong in Manipulation. If you can't defend it, move it to Persuasion." This creates artificial friction.

  **Failure Mode 3: The Dominant Voice**
  *   *Symptom:* One person explains every card to the group.
  *   *Fix:* **The "Pass the Card" Rule.** "Only the person holding the card can speak about it. You must pass the card to someone else before you can speak again."

  **Failure Mode 4: The Live Round Backfire**
  *   *Symptom:* Someone feels tricked despite the warning.
  *   *Fix:* **Immediate Validation.** "That feeling you have right now is the data. That is exactly what Card 1A feels like. Thank you for feeling it. Let's talk about why the warning didn't neutralize the feeling."

  ---

  ### 7. Stripped-Down Version (6 People)

  *   **Timeline:** Compress Card Sort to 20 minutes total. Do not break into small groups; sit at one table.
  *   **Cards:** Remove the "Wildcards" (4–9). Use only the 3 Actor Pairs (1A-C, 2A-C, 3A-C). This keeps the comparison tight.
  *   **Live Round:** Skip the vote. Instead, do a **"Commitment Check."** Ask everyone to write down one thing they learned. Before they write, use the influence tactic (Authority: "In my experience, writing this down helps retention"). Debrief on whether the instruction changed the *content* of what they wrote.
  *   **Debrief:** More conversational. You can participate more in the sorting.

  ---

  ### 8. Limitations (What This Activity Cannot Do)

  You asked to be frank about what the activity cannot reproduce.

  1.  **It cannot measure *Harm*.** The Disclosure Test identifies *secrecy*, not *damage*. A tactic can survive disclosure and still be harmful (e.g., "I am going to out-negotiate you because I have more lawyers"). The group might conflate "Manipulation" with "Bad Outcome." You will have to verbally disentangle this in the debrief.
  2.  **It cannot account for *Powerlessness*.** If a target has no choice (e.g., a prisoner, an employee in a bad economy), disclosure doesn't restore agency. The test might label something "Persuasion" because it survives disclosure, even if the target couldn't actually say no. You need to point this out explicitly.
  3.  **It assumes *Rationality*.** The test assumes that knowing the trick allows the target to defend against it. It doesn't account for cognitive biases that persist even after disclosure (e.g., knowing an optical illusion is fake doesn't stop your eyes from seeing it).

  ---

  ### 9. Confidence Assessment

  **Confidence in the Session Structure: High (90%)**
  The flow is standard workshop design (Experience -> Reflection -> Conceptualization -> Application). The timing is tight but workable. The card sorting mechanic is robust for generating debate.

  **Confidence in the Disclosure Test (Your Idea): Medium (60%)**
  *   *Why:* It is a strong heuristic, but it is not a definition. It identifies *deception-dependent influence*, which is a subset of manipulation, but not all of it.
  *   *Risk:* The group will find cases where disclosure kills *good* persuasion (e.g., "I'm going to tell you a joke to lighten the mood before I ask for money"). If they fixate on this, the test looks broken.
  *   *Mitigation:* Be ready to concede that the test identifies a *specific flavor* of manipulation (the kind that relies on hiding the mechanism), not the whole category.

  **Confidence in the Live Influence Ethics: High (85%)**
  *   *Why:* The pre-brief script ("I am going to try to steer you") creates informed consent. The stakes (15 minutes of time) are trivial.
  *   *Risk:* The one point I am **least sure of**: Whether the pre-brief ruins the data. If they know you are trying to influence them, they might resist *everything*, making the tactic look weaker than it is.
      *   *Counter:* This is actually acceptable. It proves that *transparency about intent* reduces efficacy, which supports your broader point even if it muddies the specific tactic test.

  **The One Point I'm Least Sure Of:**
  Whether the "Actor Pairs" (1A/1B/1C) will generate the friction you want, or if people will just sort based on "Good Guy vs. Bad Guy" regardless of the tactic.
  *   *Prediction:* They will sort based on the Actor, not the Tactic.
  *   *Your Move:* This is actually *good* for you. It proves that "Manipulation" isn't just about the method, it's about the *relationship and power*. When you introduce the Disclosure Test, you can frame it as: "Okay, so Actor matters. But does Disclosure matter *within* those Actor relationships?"

  **Final Advice:**
  Your instinct is correct: definitions fall apart on contact. Don't try to save the definition. Let the definition die in the card sort. Your Disclosure Test shouldn't be presented as "The Answer," but as "The Tool I Use When The Definition Breaks." That humility will make them more likely to use it.
