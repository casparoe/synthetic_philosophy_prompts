prompt: |-
  I lead the appraisal team in a national infrastructure ministry. Roughly ten times a quarter we assess projects whose consequences run fifty to five hundred years out — coastal flood defences, a geological repository for long-lived radioactive waste, large-scale peatland restoration — and our recommendation decides whether several hundred million in public money is committed. Our standing guidance is discounted net benefit, and it has two failures we can no longer defend. First, it treats a harm as cancelled when the people who bear it would not have existed at all without the project. Second, it takes any forecast of future wellbeing at face value, so a population that has adapted to a depleted environment scores as doing fine. A parliamentary committee has asked us to show that we are not treating future people as residual claimants, and the chief economist who signs off wants to see, step by step, where a judgement about value is being made in place of a calculation.

  Write the procedure my analysts should run: the questions to ask in order, what counts as an adequate answer to each, which thresholds are floors that cannot be traded away against aggregate benefit, how to treat a harm whose bearers owe their existence to the project, what to do when the relevant quantity is a probability nobody can estimate, and the exact points at which the procedure stops and refers the matter to ministers because it is a question of value rather than fact. Assume the analyst has one day, an economics degree, and no philosophy.

  Then run it on three cases: the flood defence, whose construction emissions and deferred maintenance burden fall on unborn people; the waste repository, whose risk is small, late, and irreversible; and a cheap, high-return scheme whose only defect is a low-probability contamination of an aquifer that cannot be cleaned. One of these should come out against the project the ministry wants approved — say which, and say plainly what the procedure cannot decide at all.

  Close by identifying where this design is most likely to be wrong: which single objection, if correct, would force us to rebuild it on different lines.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Lead of the appraisal team in a national infrastructure ministry.
      *   **Context:** Assessing long-term projects (50-500 years), high stakes (hundreds of millions), current guidance is Discounted Net Benefit (DNB).
      *   **Problem:** DNB has two specific failures:
          1.  *Non-Identity Problem:* Harms cancelled if bearers wouldn't exist without the project.
          2.  *Adaptation/Depletion:* Future wellbeing forecasts taken at face value even if adapted to deprivation.
      *   **Stakeholders:** Parliamentary Committee (wants proof future people aren't residual claimants), Chief Economist (wants to see where *judgement* replaces *calculation*).
      *   **Task:** Write a procedure for analysts (1 day, econ degree, no philosophy).
          *   Questions in order.
          *   Adequate answers.
          *   Non-tradable thresholds (floors).
          *   Treatment of existence-dependent harms.
          *   Treatment of unestimable probabilities.
          *   Stop points (refer to ministers).
      *   **Application:** Run the procedure on three cases:
          1.  Flood Defence (emissions/maintenance on unborn).
          2.  Waste Repository (small, late, irreversible risk).
          3.  Cheap/High-Return Scheme (low-probability aquifer contamination, irreversible).
      *   **Constraint:** One case must come out *against* the ministry's wish (ministry wants approval). Identify which one.
      *   **Conclusion:** Identify the single most likely flaw/objection that would require rebuilding the procedure.

  2.  **Develop the Procedure (The "Protocol"):**

      *   *Constraint Check:* Analyst has an econ degree, no philosophy, one day. The language must be operational, not abstract. It needs to look like a checklist or a flowchart logic.
      *   *Addressing Failure 1 (Non-Identity):* We can't say "don't do it because they wouldn't exist." We need to say "their quality of life matters regardless of identity." We need a baseline of rights or capabilities, not utility comparison with non-existence.
      *   *Addressing Failure 2 (Adaptation):* We need an objective list of "goods" or "functionings" (Nussbaum/Sen style, but simplified) rather than subjective reported wellbeing.
      *   *Addressing the Chief Economist:* Explicitly mark where weights are applied or thresholds set without empirical backing.
      *   *Addressing Parliament:* Show that future people have *claims*, not just residual status.

      *   *Drafting the Steps:*
          1.  **Baseline Definition:** Don't compare to "non-existence." Compare to a "Minimum Acceptable Future State" (MAFS).
          2.  **Capability Check:** Instead of "utility," check specific capabilities (health, water, safety).
          3.  **Irreversibility Flag:** If a harm is irreversible and breaches a floor, it's a veto.
          4.  **Probability Handling:** If probability is unknown (Knightian uncertainty), use a precautionary multiplier or treat as certain for the sake of the floor test.
          5.  **Judgement Points:** Explicitly label where the analyst stops calculating and flags a value choice.

      *   *Refining the "Non-Identity" handling:* The standard econ view is "better to exist with harm than not exist." The ethical view is "you cannot impose severe deprivation even if it's the price of existence." The procedure needs to enforce a *deontological constraint* within a cost-benefit framework. Let's call it the "Rights Floor."

      *   *Refining the "Adaptation" handling:* Use "Objective Deprivation Indicators" (ODIs). If the project leads to ODIs below a threshold, it fails, regardless of reported happiness.

      *   *Refining the "Ministerial Referral":* Any time a threshold is breached but aggregate benefit is huge, or when probabilities are truly unknowable, kick it up.

  3.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Flood Defence.**
          *   *Pros:* Protects current population.
          *   *Cons:* Construction emissions + deferred maintenance burden on unborn.
          *   *Analysis:* Emissions contribute to climate change (general harm). Maintenance is a financial burden. Does it breach a "Rights Floor"? Probably not individually. It's a trade-off. Ministry likely wants this.
      *   **Case 2: Waste Repository.**
          *   *Pros:* Solves current waste problem.
          *   *Cons:* Small, late, irreversible risk.
          *   *Analysis:* "Late" means discounting kills the cost. "Small" means expected value is low. "Irreversible" triggers the precautionary principle. If the risk breaches the "Catastrophic Harm Floor," it stops. But the prompt says risk is *small*. DNB usually approves this. Ministry likely wants this.
      *   **Case 3: Cheap, High-Return Scheme (Aquifer).**
          *   *Pros:* Cheap, high return (DNB loves this).
          *   *Cons:* Low-probability contamination of aquifer, *cannot be cleaned*.
          *   *Analysis:* This is the trap. High return suggests approval. But "cannot be cleaned" = Irreversible. "Aquifer" = Essential for life/health (Rights Floor). Even low probability, if the consequence is permanent loss of essential water for future generations, it might trigger the "Irreversibility Veto."
          *   *Decision:* To satisfy the prompt ("One of these should come out against the project the ministry wants approved"), I need to make sure the procedure flags this one. The Ministry wants it because it's "cheap, high-return." The procedure must reject it based on the *nature* of the harm (irreversible loss of essential resource) rather than the *probability* (which is low).
          *   *Why this one?* Flood defences are politically popular. Waste repositories are necessary evils. A cheap scheme contaminating water is negligence disguised as efficiency. This is the strongest ethical stand.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the mandate. Set the tone (operational, rigorous).
      *   **The Procedure (The "Future Claims Protocol"):**
          *   Step 1: Identity-Independent Baseline. (Don't ask "would they exist?" Ask "what conditions will they inherit?").
          *   Step 2: Objective Deprivation Check. (Ignore adapted preferences. Check physical/biological thresholds).
          *   Step 3: Irreversibility & Uncertainty. (If irreversible + essential resource, probability thresholds tighten).
          *   Step 4: The Judgement Log. (Explicitly mark where values override math).
          *   Step 5: Referral Triggers. (When to stop).
      *   **Case Studies:**
          *   Apply the steps rigorously.
          *   Ensure Case 3 fails.
          *   Identify the "Undecidable" element (e.g., the exact discount rate for 500 years, or the weighting of future vs. present rights).
      *   **The Vulnerability:**
          *   What is the weakest link? Likely the definition of the "Floor." Who sets it? If it's arbitrary, the whole thing collapses. Or, the "Non-Identity" problem isn't actually solved, just bypassed. Let's go with the *definition of the Floor* being politically contestable.

  5.  **Refining the Logic (Self-Correction during drafting):**

      *   *Critique:* Is the procedure too philosophical for an economist?
      *   *Fix:* Use terms like "Constraint," "Threshold," "Veto Condition," "Sensitivity Analysis." Avoid "Deontology" or "Utilitarianism."
      *   *Critique:* Did I address the "Non-Identity" problem specifically?
      *   *Fix:* In Step 1, explicitly state: "Do not net harms against the benefit of existence. Existence is not a credit."
      *   *Critique:* Did I address the "Adaptation" problem?
      *   *Fix:* In Step 2, explicitly state: "Use biophysical indicators, not reported wellbeing."
      *   *Critique:* The Chief Economist wants to see where judgement replaces calculation.
      *   *Fix:* Create a "Judgement Register" column in the procedure.
      *   *Critique:* Which case fails?
      *   *Fix:* Make sure the Aquifer case fails due to the *Irreversibility Floor* despite the high return. This demonstrates the protocol works.

  6.  **Final Polish:**

      *   Check tone: Professional, authoritative, clear.
      *   Check constraints: One day for analyst? Keep the procedure under 2 pages equivalent.
      *   Check the "Undecidable": Be honest about what the procedure *can't* do (e.g., weigh the rights of the non-existent against the needs of the living).

  7.  **Final Review against Prompt:**
      *   Questions in order? Yes.
      *   Adequate answers? Yes.
      *   Floors/Thresholds? Yes.
      *   Existence-dependent harms? Yes.
      *   Unestimable probability? Yes.
      *   Referral points? Yes.
      *   Three cases run? Yes.
      *   One rejection (Ministry wants approval)? Yes (Case 3).
      *   Undecidable element identified? Yes.
      *   Single objection for rebuild? Yes.

      *(Self-Correction on Case 3)*: The prompt says "One of these should come out against the project the ministry wants approved." Usually, ministries want high-return projects. So Case 3 is the natural candidate for rejection. I need to make sure the reasoning is solid. The "low probability" is the trap. The procedure must treat irreversible loss of essential resources as a "Risk-Independent Veto" or apply a massive precautionary weight. Let's go with a "Catastrophic Irreversibility Constraint."

      *(Self-Correction on Vulnerability)*: The prompt asks for the *single objection* that would force a rebuild. The most potent philosophical objection to this kind of hybrid model is that it disguises a political choice as a technical constraint. If the "Floor" is arbitrary, the procedure is just DNB with extra steps. I will focus on the *legitimacy of the Floor*.

      *(Wait, one nuance)*: "What the procedure cannot decide at all." I need to be clear on this in the case studies. It's likely the trade-off between *current* poverty and *future* risk.

      Let's write.

      *Structure:*
      1.  **Memorandum Header.**
      2.  **The Future Claims Protocol (FCP).**
      3.  **Application to Cases.**
      4.  **The Undecidable.**
      5.  **The Vulnerability.**

      *Tone:* Bureaucratic but ethically rigorous.

      *Key Technical Detail:* How to handle the "Non-Identity" problem operationally?
      *Standard Econ:* Compare State A (Project + People X) vs State B (No Project + No People X). If Utility A > Utility B (even if B is non-existence), go ahead.
      *New Protocol:* Compare State A (Project + People X) vs State C (Ideal Baseline + People X). Ignore State B. If State A falls below a "Minimum Decent Life" threshold relative to C, reject, regardless of the fact that X wouldn't exist in B. This shifts the counterfactual from "Non-existence" to "Standard of Care."

      *Key Technical Detail:* How to handle "Adaptation"?
      *Standard Econ:* Willingness to Pay / Reported Satisfaction.
      *New Protocol:* Objective Functioning List (Water quality, Air quality, Radiation limits).

      *Let's assemble.*
answer: |-
  **MEMORANDUM**

  **TO:** Appraisal Team Analysts
  **FROM:** Head of Appraisal
  **SUBJECT:** OPERATIONAL PROCEDURE FOR LONG-TERM INTERGENERATIONAL APPRAISAL (FCP-1)
  **DATE:** 24 May 2024

  **CONTEXT:** Standard Discounted Net Benefit (DNB) is insufficient for projects with horizons >50 years. It fails to account for (1) harms to people whose existence depends on the project (Non-Identity) and (2) adaptation to deprivation (Adaptation). The following **Future Claims Protocol (FCP-1)** must be applied to all projects with impacts exceeding 50 years.

  **CONSTRAINT:** You have one day. Do not philosophise. Execute the checklist. Where the checklist requires a value judgement, log it in the **Judgement Register** (Section 5) and refer to Ministers if thresholds are breached.

  ---

  ### SECTION 1: THE FUTURE CLAIMS PROTOCOL (FCP-1)

  **Step 1: Define the Counterfactual Baseline (Identity-Independent)**
  *   **Question:** If we do not build this, do the specific future individuals affected cease to exist?
  *   **If YES:** Do **not** compare the project scenario against "non-existence." Compare the project scenario against a **Minimum Acceptable Future State (MAFS)**.
  *   **Adequate Answer:** A description of the physical and biological conditions the future population will inherit, independent of their identity.
  *   **Judgement Point:** Setting the MAFS is a value choice, not a calculation. Use the statutory environmental standards for 2024 adjusted for population density as the default floor.

  **Step 2: Objective Deprivation Check (Anti-Adaptation)**
  *   **Question:** Does the project forecast rely on future populations reporting "acceptable wellbeing" while living in physically depleted conditions (e.g., high radiation, no clean water, flooded land)?
  *   **If YES:** Disregard reported wellbeing/utility forecasts.
  *   **Adequate Answer:** A audit of **Objective Functioning Indicators (OFIs)**. These are biophysical: air quality, water toxicity, radiation exposure, caloric availability.
  *   **Threshold:** If any OFI falls below the MAFS defined in Step 1, the project incurs a **Rights Deficit**.

  **Step 3: Irreversibility and Uncertainty Handling**
  *   **Question:** Is the harm reversible within 100 years?
  *   **If NO:** Classify as **Irreversible Burden**.
  *   **Question:** Can the probability of the harm be estimated with empirical data?
  *   **If NO (Knightian Uncertainty):** Do not assign a zero or low probability. Apply the **Precautionary Multiplier**. Treat the risk as if it were 10x the lowest plausible estimate for the purpose of the Threshold Test.
  *   **Threshold:** An Irreversible Burden that breaches an OFI Threshold (Step 2) triggers a **Veto Condition**, regardless of aggregate economic return.

  **Step 4: The Existence-Dependent Harm Test**
  *   **Question:** Is the harm being inflicted on people who would not exist without this project?
  *   **Instruction:** Existence is not a credit. You cannot offset a Rights Deficit (Step 2) by claiming "they are lucky to be born."
  *   **Adequate Answer:** Quantify the harm in physical units (e.g., sieverts, ppm contaminants), not utility units.
  *   **Threshold:** If the physical harm exceeds safety limits set for *current* living populations, it is a **Veto Condition**. We do not permit higher physical risk for future people simply because they are future.

  **Step 5: The Judgement Register & Referral**
  *   **Instruction:** At any point where you apply a threshold, multiplier, or baseline that is not dictated by current statute, enter it in the Register.
  *   **Referral Trigger:** If a project yields a high Net Present Value (NPV) but triggers a Veto Condition (Step 3 or 4), **STOP**. Do not calculate the trade-off. Refer to Ministers with the note: *"Aggregate benefit exceeds cost, but intergenerational rights floor is breached."*

  ---

  ### SECTION 2: APPLICATION TO CASES

  **Case A: Coastal Flood Defence**
  *   **Profile:** Protects current assets. Costs: Construction emissions + deferred maintenance burden on unborn.
  *   **FCP-1 Run:**
      1.  *Baseline:* Future people inherit higher CO2 and tax liability.
      2.  *OFI Check:* Does CO2 push temperature beyond MAFS safety limits? Likely no, marginally contributory. Does maintenance cost reduce caloric availability below MAFS? No.
      3.  *Irreversibility:* Emissions are cumulative, but defence is maintainable.
      4.  *Existence-Dependent:* The future taxpayers owe existence to the economic activity the defence protects.
      5.  *Verdict:* **PASS.** The burdens are financial and marginal environmental, not breaching physical rights floors.
  *   **Ministry Position:** Approve.
  *   **FCP-1 Outcome:** Aligns.

  **Case B: Geological Waste Repository**
  *   **Profile:** Solves current waste crisis. Risk: Small, late (10,000 years), irreversible leakage.
  *   **FCP-1 Run:**
      1.  *Baseline:* Future people inherit a site with potential leakage.
      2.  *OFI Check:* Radiation models show dose rates below current safety limits even in failure scenarios.
      3.  *Irreversibility:* Yes. But probability is low and modeled.
      4.  *Existence-Dependent:* Irrelevant, physical dose is the metric.
      5.  *Verdict:* **PASS.** The risk is small enough that even with the Precautionary Multiplier, it does not breach the MAFS radiation floor.
  *   **Ministry Position:** Approve.
  *   **FCP-1 Outcome:** Aligns.

  **Case C: High-Return Aquifer Scheme**
  *   **Profile:** Cheap, high NPV. Defect: Low-probability contamination of a sole-source aquifer. Contamination **cannot be cleaned**.
  *   **FCP-1 Run:**
      1.  *Baseline:* Future people inherit a region with potential water toxicity.
      2.  *OFI Check:* Water quality is a primary Objective Functioning Indicator.
      3.  *Irreversibility:* **YES.** "Cannot be cleaned."
      4.  *Probability:* "Low-probability" but nobody can estimate long-term geology (Knightian Uncertainty).
      5.  *Application of Step 3:* Apply Precautionary Multiplier. Treat risk as significant.
      6.  *Application of Step 4:* If contamination occurs, water quality breaches MAFS (safe drinking water). This is a **Rights Deficit**.
      7.  *Veto Condition:* Irreversible Burden + Breach of Essential OFI = **VETO**.
      8.  *Economic Counter-argument:* The NPV is high. The probability is low.
      9.  *FCP-1 Ruling:* Economic return cannot offset a Veto Condition on essential life resources.
  *   **Ministry Position:** Approve (due to high return/low cost).
  *   **FCP-1 Outcome:** **REJECT.**
  *   **Referral:** Matter referred to Ministers. *"Project breaches Intergenerational Rights Floor on water security. Economic gain cannot justify irreversible loss of essential resource."*

  ---

  ### SECTION 3: WHAT THE PROCEDURE CANNOT DECIDE

  The FCP-1 cannot decide the **Trade-Off Between Present Poverty and Future Risk.**

  In Case C, the "High Return" implies the money saved now could alleviate current suffering (hospitals, schools, current poverty). The Procedure treats the future right to water as a "Floor" that cannot be traded. It cannot calculate whether saving 1,000 lives today is "worth" risking 100 lives in 200 years.

  This is not a calculation failure; it is a **moral boundary.** The Procedure is designed to *stop* the calculation at that point. It forces the Minister to sign off on the violation of the floor explicitly, rather than hiding it inside a discount rate. The Procedure cannot tell the Minister if that signature is "correct," only that it is a violation of the protocol's ethical constraints.

  ---

  ### SECTION 4: THE VULNERABILITY

  **The Single Objection:**
  The design is most likely wrong on the **Arbitrariness of the Floor (MAFS).**

  If a critic argues that the "Minimum Acceptable Future State" is simply a political preference disguised as a technical constraint, the entire procedure collapses. By setting a "Rights Floor" (e.g., water quality standards), I am implicitly asserting that future people have the *same* absolute rights as current people, regardless of the cost to the living.

  If the correct ethical view is **Prioritarian** (we should weigh the welfare of the worst off, even if they are in the future, but allow trade-offs) rather than **Sufficientarian** (everyone must meet a minimum floor, no trade-offs), then FCP-1 is too rigid. It forbids a project that might slightly lower the future floor but massively raise the future ceiling (e.g., temporary deprivation for long-term technological gain).

  **Rebuild Requirement:**
  If the "Floor" is rejected as arbitrary, we must rebuild the appraisal on a **Sliding Scale of Criticality.** Instead of a Veto, harms to essential resources (water, air) would carry an infinite or near-infinite weight in the cost-benefit equation, rather than a binary stop. This returns the decision to a calculation, which the Chief Economist prefers, but risks reintroducing the very trade-offs the Parliamentary Committee asked us to eliminate.

  **Current Status:** Proceed with FCP-1. Refer Case C to Ministers immediately.

  **Signed:**
  Head of Appraisal Team
