  *Note on the Psychopath Question:* I have swapped the specified question on psychopaths for one on **proportionality**. Stance-based accounts typically digest the psychopath objection easily by defining responsibility as participation in the moral community; asking about proportionality cuts deeper into the 'demand' analogy, forcing her to explain normative limits without appealing to the quality of will she rejects.

  ***

  **1. Fittingness**
  On the standard view, resentment fits because someone showed ill will. On your view, it is the act of making a demand. What makes a demand *fitting* rather than merely expressive? Why is this demand apt instead of just noise?

  *Predicted Reply:* She will say the demand is apt because it aligns with the normative expectations of the relationship.
  *Biting Follow-up:* But where do those expectations come from if not from facts about how the person treated us? If you remove the treatment, aren't you just left with our own preferences?

  **2. Unreachable Targets**
  We often blame people we could never address: a Roman emperor, a long-dead benefactor, or a dissolved corporation. What is the demand being made there, and to whom is it addressed?

  *Predicted Reply:* She will claim this is a symbolic or virtual address, standing in for the community.
  *Biting Follow-up:* If it is only symbolic, is it real blame or just pretend? If it is real, who is actually being held to account if the target is gone?

  **3. The Hospice Nurse**
  Consider a hospice nurse who adopts a clinical, managerial stance toward an abusive patient so she can keep doing her job well. You say objectivity is wholesale. Is she being corrupted, is she deceiving herself, or is she simply doing something other than blaming?

  *Predicted Reply:* She will argue the nurse has shifted the relationship to a purely professional one, excluding personal engagement.
  *Biting Follow-up:* Did the relationship change *because* she adopted the stance? If so, doesn't that make the stance prior to the relationship, rather than the other way around?

  **4. The Mute Resenter**
  Think of someone with all the reactive dispositions who never voices, signals, or acts on any of them. If resentment is address, has she blamed anyone? Is unvoiced resentment silent address or no address at all?

