      3. **The account must define how intensity of suffering trades off against scale of victims.** If prolonged torture of one person cannot be weighed against the deaths of many, you cannot prioritize resource allocation; if it is weighed purely mathematically, you risk implying mass death is less significant than individual agony. Without a stated exchange rate, teachers cannot answer why some cases receive more attention. *Tag: Non-negotiable.*

