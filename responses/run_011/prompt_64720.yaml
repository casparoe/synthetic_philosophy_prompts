answer: |-
  Here is the reconstruction you asked for. I am going to commit to a specific claim rather than offering a survey.

  **The Thesis:** The aviation industry's distinction between memory items and checklists, and your club's asymmetry between planning and pattern work, does **not** presuppose the "Extended Mind" (Clark & Chalmers) or a pure "Distributed Cognition" (Hutchins) model. It presupposes a **Dreyfusian model of skill acquisition under high-arousal stress.**

  Specifically, the practice assumes that under high-stress conditions (startle effect, high workload), the pilot's cognitive architecture regresses. Access to external tools (tablets, manuals) requires "deliberative" cognition which is the first thing to fail under stress. Access to internalized memory items relies on "absorbed coping" (motor schemas) which is the last thing to fail. The boundary is not arbitrary; it marks the threshold where the "System" (Pilot + Plane + Tool) collapses back into the "Organism" (Pilot + Plane).

  If you treat the tablet as part of the extended system during an emergency, you are assuming the pilot remains a rational agent with full search-functionality intact. The industry operates on the empirical claim that **they do not.**

  Here is the breakdown of why this is the only coherent reading, where your "lookup tax" fits, and what breaks if you change the presupposition.

  ---

  ### 1. The Theory of Mind: Arousal and Regression

  You asked what has to be true about where knowing lives for this system to make sense.

  **The Claim:** The system presupposes that **knowledge is not uniformly accessible.** It distinguishes between *propositional knowledge* (knowing-that, accessible via search/lookup) and *procedural knowledge* (knowing-how, accessible via trigger-action).

  In normal operations (planning, cruise), the pilot is in a low-arousal state. Cognitive bandwidth is high. Here, the "Distributed Cognition" model holds: the pilot + tablet + manual is a valid cognitive system. Looking up a frequency or weight-and-balance is safe because the "lookup tax" (your term) is payable. The pilot has the attentional surplus to query the external system.

  In emergency operations (engine failure after takeoff, fire), the pilot enters a high-arousal state. The "Startle Effect" creates a temporary cognitive freeze, followed by tunnel vision and fine-motor degradation.
  *   **Memory Items** are designed to bypass the deliberative loop. They are stimulus-response pairs wired into procedural memory (e.g., *Boom/Thump → Fuel Cutoff*). They do not require "finding" information.
  *   **Checklist Items** require reading, verifying, and searching. This requires deliberative cognition.

  **Why the boundary isn't arbitrary:** You noted that some non-memory items are also time-critical. This is true, but they are not *startle-critical*. The memory item list is not defined by "how fast the plane crashes" alone; it is defined by "how fast the pilot's ability to search degrades."
  *   *Engine Fire:* Startle is high. Fine motor/search is gone. Must be memory.
  *   *Pressurization Loss:* Time critical, but gradual. Startle is low. Search is still possible. Can be checklist.

  **Your "Lookup Tax":** Your intuition is correct but needs a locus shift. It is not that "the pilot is allowed to have lost the airplane." It is that **"the pilot is allowed to have lost their search function."**
  *   If the procedure is on the checklist, the theory assumes the pilot *retains* the capacity to search.
  *   If the procedure is a memory item, the theory assumes the pilot *has lost* the capacity to search.
  *   Therefore, the "tax" is paid in **attentional bandwidth**, not just seconds.

  ### 2. Rival Pictures: Why Otto and Hutchins Get Rejected Here

  **The Otto-and-His-Notebook Parity Principle:**
  Clark and Chalmers argue that if a notebook functions reliably as memory, it is part of the mind. If aviation accepted this, a tablet app would be parity-equivalent to biological memory.
  *   **Why Aviation Rejects It:** The Parity Principle assumes the tool is *always available* and *always accessible*. In the cockpit, under G-load, vibration, sweat, and startle, a tablet is **not** parity-equivalent to the motor cortex. You cannot "muscle memory" a swipe gesture on a glass screen with the same fidelity as a physical switch, and you cannot access a menu structure with the same latency as a recalled schema.
  *   **Verdict:** The memory-item list is **incoherent** under the strict Parity Principle. If the tablet is truly part of the mind, there should be no distinction between "looking at the screen" and "recalling from memory." The fact that the distinction exists proves the industry treats biological memory as a distinct, higher-reliability class during crisis.

  **Distributed Cognition (Hutchins):**
  Hutchins views the cockpit crew + instruments as a single computational system.
  *   **Where it fits:** Normal operations. The checklist is a cognitive artifact that distributes the load.
  *   **Where it breaks:** Emergency "Memory Items." When the engine fails on takeoff, the "System" shrinks. The co-pilot might be bracing; the checklist might be stowed. The industry presupposes that in the worst-case bound, the **unit of survival is the individual pilot's internalized schema.** Distributed cognition is a luxury of stable states.

  ### 3. Category Error Check: Liability vs. Cognition

  You asked if this is just a liability artifact.
  *   **Confidence Marker:** [High Confidence] Regulatory requirements (14 CFR / EASA) mandate memory items for type-certificated aircraft. This is partly liability, but it is rooted in Human Factors (HF) data regarding reaction times.
  *   **Confidence Marker:** [Medium Confidence/Inference] Your club's specific debate is likely a mix of HF and liability. Instructors say "know it cold" because if a student crashes while fumbling an iPad, the club gets sued. However, the *reason* the crash happens is the cognitive regression described above.
  *   **Conclusion:** It is not *just* liability. Liability follows the safety case. The safety case relies on the cognitive model of stress regression. If the cognitive model were wrong (i.e., if pilots could search tablets perfectly under startle), the liability would vanish. So the cognitive claim is primary.

  ### 4. What Breaks if We Adopt the "Tablet as Extended System" View?

  If your club approves the app based on the idea that "the tablet is just another part of the pilot's memory," you must change the following, or you are introducing fatal fragility:

  **1. Interface Design (The "One-Tap" Requirement)**
  If the tablet is part of the memory system, it cannot have a "file system." You cannot have a home screen, a lock screen, or a menu.
  *   *Current State:* Open app → Select "Engine Failure" → Read steps. (This is a search task).
  *   *Required State:* A physical button or a dedicated screen that is *always* showing the emergency flow, or a single tap that brings it up with zero latency.
  *   *Why:* If the pilot has to navigate a UI, they are using deliberative cognition. Under startle, they will tap the wrong icon.

  **2. Training Methodology**
  *   *Current:* Memorize the flow. Use the checklist to verify.
  *   *New:* Train the "Search Pattern." You would have to train pilots to treat the tablet lookup as a motor skill. "When engine fails, eyes go to iPad, tap red button."
  *   *Risk:* This couples the pilot's survival to the device's battery, brightness, and OS stability. If the iPad sleeps, the "memory" is lobotomized. Biological memory does not sleep.

  **3. Certification of the "Cognitive Prosthetic"**
  *   If the tablet is a memory item, it must be certified as reliable as a biological synapse.
  *   *What breaks:* You now need redundancy. Do you carry two iPads? If the screen cracks on impact (engine failure after takeoff often involves rough terrain), is the "memory" destroyed?
  *   *Institutional Change:* The club would need to treat the iPad not as "gear" but as "avionics." It needs a dedicated mount, dedicated power, and a "panic mode" that overrides sleep settings.

  ### 5. Recommendation: Should the Club Approve the App?

  **My Committed Stance:** **No, not on the current terms.**

  If the app is used as a *lookup tool* (i.e., "I need to read the flow"), it violates the cognitive constraints of the emergency phase. It forces a high-arousal pilot to perform a low-arousal task (searching a database).

  **However,** if the app is redesigned to function as a **trigger**, not a library, it could work.
  *   *Acceptable:* A screen permanently mounted, permanently lit, displaying the Engine Failure Flow *always* while in the pattern. No tapping required. The pilot glances at it as they would an airspeed indicator.
  *   *Unacceptable:* An app that requires unlocking, opening, and scrolling.

  **Why the Instructors are Right (even if they can't articulate it):**
  They are sensing the **fragility of the extended system under stress.** They know that when the student panics, the student becomes "smaller." Their world shrinks to the yoke and the horizon. Asking them to interact with a complex information system (iPad) is asking them to expand their world when their biology is forcing it to contract.

  ### Summary of the Gap

  You suspected a gap between what the practice *needs* and what *fits comfortably*. Here it is:

  *   **What fits comfortably:** "Memorization is good discipline." (This is moralizing).
  *   **What the practice strictly needs:** "Procedural memory is resistant to startle-induced cognitive collapse; deliberative search is not." (This is physiological).

  The instructors are defending the physiological reality using moral language ("you need to know it cold"). Your "lookup tax" is the economic translation of that physiological reality. The tax is too high to pay during the startle response.

  **Final Verdict:** The memory-item list is not incoherent, but it is **biologically bounded.** It only makes sense if you accept that human cognition degrades under stress in a specific way that external tools (currently) do not mitigate. To treat the tablet as parity-equivalent to memory requires engineering the tablet to survive the pilot's psychological collapse. Until the app is a "dumb terminal" that requires zero interaction, the club's prohibition is cognitively sound, even if philosophically conservative.
