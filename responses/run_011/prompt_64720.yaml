  *(Self-Correction during drafting)*: I need to be careful not to say "tablets are bad." I need to say "tablets as currently implemented violate the cognitive constraints of high-arousal states." The distinction is the *interface*, not the *medium*.

  *(Refining the "Lookup Tax")*: The user's "lookup tax" is actually a good intuition but misidentified. It's not about the *plane's* energy state; it's about the *pilot's* cognitive bandwidth. I will validate this but sharpen it.

  *(Confidence Marker Strategy)*: I will use brackets or explicit phrases like "[High Confidence based on FAA/ICAO HF literature]" vs "[Inference based on typical club dynamics]."

