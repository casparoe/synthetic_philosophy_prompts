      *   *Strong Claim:* The practice presupposes a **Dreyfusian "Skill Coping" model under stress**, not a Clark & Chalmers "Extended Mind" model. The distinction isn't just about *time* (latency); it's about *cognitive bandwidth* and *regression under stress*.
      *   *The "Gap":* The practice assumes that under extreme stress, access to *external* tools degrades faster than access to *internalized* motor/cognitive schemas. The "Memory Item" list is a buffer against cognitive collapse, not just a speed optimization.
