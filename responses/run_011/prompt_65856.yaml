answer: |-
  **Seminar Handout: Inquiry, Publics, and the Isolated Inquirer**
  **Texts:** John Dewey, *Logic: The Theory of Inquiry* & *The Public and Its Problems*; Henrik Ibsen, *An Enemy of the People*

  ### I. The Distinction: Failed Inquiry vs. Failed Constitution

  To read *An Enemy of the People* through Dewey is to separate two distinct phases of democratic experimentalism that Dr. Stockmann conflates.

  1.  **First-Order Inquiry (The Controlled Transformation):** Dewey defines inquiry as the controlled or directed transformation of an indeterminate situation into one that is so determinate in its constituent distinctions and relations as to convert the elements of the original situation into a unified whole.
  2.  **Second-Order Constitution (The Public):** In *The Public and Its Problems*, Dewey argues that a "public" is not a pre-existing demographic. It comes into existence only when the indirect consequences of associated activity are perceived, recognized, and organized for control.

  **The Stockmann Verdict:** By the play's own lights, Stockmann succeeds at the first task and fails catastrophically at the second.

  The situation at the Baths is classically "indeterminate": tourists are falling ill, the cause is unknown, the town's prosperity is threatened. Stockmann applies the method of intelligence. He hypothesizes (the water), tests (sends samples to the university), and achieves "warranted assertibility" (the water is poisoned by organic matter). This is sound experimentalism. The facts are not matters of opinion; they are established through a method that transforms the ambiguous into the known.

  However, Deweyan inquiry does not end at the laboratory door. Truth, for Dewey, is not a static property of a proposition but a function of its capacity to resolve a problematic situation. To resolve the situation, the findings must be integrated into the social organism. This requires the constitution of a public. Stockmann fails here because he treats the town meeting not as a site for *organizing consequences*, but as a tribunal for *moral judgment*.

  ### II. The Breakdown of Communication

  The pivot of the play occurs when Stockmann abandons his prepared report. Had he stuck to the indirect consequences of the water (illness, economic collapse due to reputation loss), he might have catalyzed a public. The "public" would have been the body of citizens organizing to manage the consequence of "poisoned water."

  Instead, Stockmann allows the inquiry to metastasize into a diatribe against the "compact liberal majority." He shifts the object of inquiry from the *water* to the *people*.
  *   **The Tannery Revelation:** When Stockmann discloses on the spot that the pollution stems from his father-in-law's tannery, he further sabotages the public formation. He transforms a structural problem (industrial byproduct vs. public health) into a familial feud (Son-in-law vs. Father-in-law). This makes the consequences too *direct* and personal. A Deweyan public requires a degree of abstraction to recognize *indirect* consequences; Stockmann makes it a blood feud.
  *   **The Result:** He does not constitute a public; he creates a sect. The only "public" that forms is the mob that votes against him. He fails the second-order task because he refuses the labor of communication, which Dewey sees as the blood of the social body. He demands acceptance rather than facilitating understanding.

  ### III. The Antagonist: Honest Self-Interest and the Limits of Truth

  A Deweyan reading must resist casting Mayor Peter Stockmann as a villain. Peter is not denying the science (initially); he is weighing the *consequences of the remedy*.
  *   **Peter's Argument:** The cost of repair is prohibitive; the closure will ruin the town; the taxpayers will bear the burden.
  *   **Deweyan Analysis:** This is not "lies vs. truth." This is a conflict of *competing consequences*. Experimentalism does not dictate that health automatically trumps economy. It demands a reconstruction of the situation where both can be served.

  **What Experimentalism Offers:**
  Dewey would argue that Stockmann's polarization ("Health vs. Profit") is intellectually lazy. The experimentalist method would ask: *How can we engineer a solution that mitigates the tannery runoff without bankrupting the town?* Perhaps a phased repair? A tax on the tannery to fund the baths? A loan?
  Stockmann offers a binary: close it or die. Peter offers a binary: keep it open or we starve.
  Experimentalism's counsel is **not merely patience**; it is **reconstruction**. It demands that the inquirer remain in the messy zone of negotiation to find a means-ends chain that satisfies the conflicting interests. Stockmann abandons this reconstruction the moment he realizes the cost. He retreats to moral purity ("The truth shall prevail") rather than engaging in the political engineering required to make the truth *livable*.

  ### IV. "The Strongest Man Is He Who Stands Most Alone"

  We arrive at Stockmann's final conviction. Is this a Deweyan heresy, a loss of nerve, or an honest report?

  1.  **A Deweyan Heresy:** Absolutely. For Dewey, individuality is a *product* of associated living, not a precondition. To stand alone is to cease to be a democratic agent. Truth is social; it requires a community of verification and application. To claim strength in isolation is to reject the very medium (the public) that gives inquiry its power.
  2.  **A Loss of Nerve:** Plausible. Stockmann gives up on the second-order task. He decides the public is incapable of formation. He retreats into the private sphere (his home, his children) and declares victory there. This is a withdrawal from the democratic experiment.
  3.  **An Honest Report:** This is the Ibsenian correction. Stockmann is reporting the *empirical reality* of his specific situation. In that town, at that time, the conditions for a public did not exist. The "indirect consequences" were perceived, but they were organized *against* the inquirer.

  **Verdict:** It is a **Deweyan heresy that functions as a tragic truth.** It marks the point where the ideal theory of democracy collides with the actual sociology of the crowd. Stockmann is right that he is alone, but Dewey would argue that by accepting that aloneness as "strength," Stockmann ensures the truth dies with him.

  ### V. Conclusion: The Price of Waiting

  This brings us to the limit of the Deweyan framework. Dewey's meliorism assumes that if inquiry is free and communication is open, the public *will* eventually form to manage the consequences. He trusts in the long-run efficacy of the method.

  Ibsen shows us the **price of the lag time**.

  Dewey cannot readily absorb the cost incurred while waiting for the public to wake up.
  *   **The Sacrifice of the Inquirer:** In *An Enemy of the People*, the public does not form until it is too late for Stockmann. He is exiled, his children are barred from school, his livelihood is destroyed. Dewey's logic suggests the inquirer is sustained by the community of inquiry. Ibsen shows the community consuming the inquirer.
  *   **Irreversibility:** Deweyan inquiry is fallibilistic; we can try again. But Stockmann's ruin is material and irreversible. The "experiment" costs him his life.

  **The Seminar Question:**
  If Dewey insists that inquiry is a social act, but Ibsen demonstrates that the social act often requires the destruction of the inquirer before the public coalesces, does experimentalism require a theory of **protection** for the inquirer that Dewey never articulated? Or is Stockmann's isolation the necessary, tragic friction cost of a public struggling to be born?

  Ibsen suggests that the "controlled transformation of an indeterminate situation" may control the situation, but it does not necessarily save the transformer. Dewey bets on the long run; Ibsen forces us to look at the bill that comes due today.
