  Context: I'm a backend engineer, no philosophy background past one elective years ago, but I volunteered to grade the short answers for this "ethics for people who ship software" certificate that our professional body runs. The course lead is an actual philosopher — she wrote the question and the rubric — but the graders are industry people like me, and she audits a random sample of what we score. So I need the feedback I write to actually hold up when someone who knows this stuff reads it, not just sound reasonable.

  Here's the question the student was answering (take-home, 500 word max, 20 points):

  > A says to B: "You were cruel to that intern in the meeting, and that was wrong." B replies: "You did the exact same thing to me last quarter." Assume A really did, and that B really was cruel.
  >
  > (a) [6] Two philosophers might describe B's reply in two different ways: (i) "B has pointed out that A's blame gives him no reason to think he did anything wrong," and (ii) "B has objected that A is not in a position to blame him." What is the second description adding? What notion is doing work in (ii) that isn't in (i)?
  >
  > (b) [6] On the most common way of spelling out that notion, what exactly has A done wrong, and who is wronged by it? Is hypocritical blame best understood as unfair to B specifically, or as a failing that doesn't particularly concern B at all? Take a side and say why.
  >
  > (c) [5] Give one condition under which A could get back into a position to blame B, and explain why that condition *removes* the objection rather than merely excusing A.
  >
  > (d) [3] Does your answer to (c) imply that only people who have never done the thing in question may blame others for doing it? Why or why not?

  And here's their answer, basically verbatim:

  > (a) The difference is that in (ii) B isn't arguing about whether the cruelty claim is true. B can accept that he was cruel and that A's sentence accurately describes what happened, and still have something left over to object to. So what's doing the work in (ii) is A's position to make the charge at all — call it A's standing. In (i), blame is treated as a piece of evidence: taken as an argument, B's reply would be the tu quoque fallacy, since A's own behaviour tells B nothing about whether B behaved cruelly. Because it's a fallacy, B's reply can't be making a point about the truth of the judgement, so it must be making a procedural point instead — the same kind of point you'd make if someone talked over you or answered their own question in a meeting. It's a breach of how the exchange is supposed to be conducted rather than a moral fault in A. And it's not only A's right to make the charge that's in question: B is entitled to treat the charge itself as carrying less weight than the identical charge would from someone with clean hands.
  >
  > (b) What A has done wrong, roughly, is hold B to a standard A isn't holding themselves to. A is applying a rule selectively, and the selection is self-favouring. That's a failure of consistency in A's own practical outlook, so I'd say the primary failing isn't specifically a wrong to B — A would be doing something objectionable even if the hypocrisy were pointed out by a third party instead of by B. But B has the more distinctive complaint, because B is the one being addressed, and it's reasonable for B to say "then you don't get to say this to me." So it's unfair in a general sense, but it lands on B in particular.
  >
  > (c) A gets standing back by acknowledging the earlier episode as the same fault — admitting "yes, I did that, and it was wrong of me too" — and by changing their behaviour going forward. That removes the objection instead of just excusing A because A is now applying one standard to both of them, so there's no asymmetry left for B to point at. A isn't being let off the hook, A is being brought back into line with the standard A was invoking in the first place.
  >
  > (d) Yes, I think that follows. If standing is lost by doing X, then only people who haven't done X can blame others for it, since once you've forfeited standing it's gone unless you become someone who no longer does X. That's a demanding view, but it seems to be what (c) commits you to.

  Can you give me a score out of 20 with a per-part breakdown, and then the specific comments I should paste into the feedback box? Two things I care about most:

  1. Separate out cleanly the parts that are genuinely right from the parts that read as right on a first pass but aren't. If there's a place where they've fused two different claims together, or where a conclusion doesn't actually follow from the sentences before it, point at the exact clause that does it and say what the correct version would have been. I'd rather you flag three real problems than list ten nitpicks.
  2. Tell me whether anything the question explicitly asked for just never got addressed, and whether that's a deduction or a wrong-but-present answer — those feel different to grade and I don't know the convention here.

  Explain the reasoning in plain language when you say a claim is wrong. I don't know the literature, so if the comment I paste says "conflates X with Y" I need to actually understand why before I send it, since I might get asked about it.
