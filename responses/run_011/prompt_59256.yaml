prompt: |-
  I am three years into a novel whose second half is set almost entirely in a memory-careard unit, and the object the book turns on is not a person but a document: a signed advance directive, drafted by a retired structural engineer in her late sixties while she was still entirely herself, naming her daughter as proxy and refusing antibiotics, artificial nutrition, and resuscitation in the event that she reaches a state from which, in the judgment of two physicians, she will not return. To get the procedural texture right I have sat in on hospital ethics consultations, read state statutes on living wills and durable powers of attorney for health care, and read what I could find about the Dutch position, where in 2020 the Supreme Court held that a physician may carry out euthanasia on the strength of a written request from a patient with advanced dementia even when she can no longer confirm it, provided the statutory due-care criteria are satisfied. A lawyer friend of mine referred to all of this as precedent autonomy, and I have come to suspect that an enormous quantity of metaphysics is being smuggled through that phrase. I would like it unpacked, because I intend my scenes to carry the argument rather than recite it.

  The practice I cannot make sense of has four features that sit oddly together. First, the document is treated as binding over a person who is, in every ordinary sense, no longer the one who wrote it: she has no memory of drafting it, does not recognize her daughter, holds no desires about next week, and is frequently and visibly content — she sings, she enjoys her meals, she asks to go home. The paper outranks the living woman, and it does so precisely because the living woman is thought to lack the standing to speak. Second, her apparent present wishes are sometimes given weight and sometimes not: many institutional protocols hold that a directive lapses if the patient now resists or says she wants to live, though she may be judged incapable of the capacity that would make such a statement authoritative. Third, and in the other direction, the same legal culture treats psychiatric advance directives very differently. Many American states permit a person, while well, to write down what treatment she wants and refuses during a future psychotic or manic episode; the statutes then commonly allow clinicians to override that document exactly when the episode arrives and the patient is involuntarily held — which is the only circumstance in which the document was ever meant to operate. Fourth, the same person who is denied authority over her own future when she is demented is granted unlimited authority to revoke the directive at any moment while competent, by any means, including a shrug.

  So: what theory does this body of practice presuppose? I want the implicit philosophy reconstructed as carefully as you can manage. What must be true of persons over time for a signature made forty years earlier, by someone with whom the present patient shares almost no memories, values, or intentions, to govern her body now — is this a claim about identity, about the persistence of interests after the capacity to hold them has been destroyed, about autonomy as something one exercises once rather than continuously, or about welfare as the shape of a whole life rather than the sum of its experiences? Which rival views does the practice quietly rule out — in particular, any view on which the demented patient is, in the respect that matters morally, a different person from the one who signed? Please separate what the practice strictly presupposes from what it merely happens to fit well with, and tell me where it is philosophically underdetermined, so that several quite different theories would license the same forms, the same committees, and the same language of capacity. Then address the asymmetry with the psychiatric directive: does it betray an inconsistent underlying view, or does it rest on something non-philosophical entirely — liability, the epistemic difficulty of predicting one's own future psychosis, a professional norm about who may restrain whom? And finally, if the presupposed view were replaced by one on which only the present self's experience counts, what specifically would have to change in the documents, the consultation process, and the vocabulary of incompetence — and what, in that revised practice, would a directive of the kind my protagonist wrote be for?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is writing a novel set partly in a memory-care unit. The central plot object is an advance directive (AD) signed by a retired structural engineer (mother) naming her daughter as proxy, refusing life-sustaining treatment in case of irreversible decline.
      *   **Research Done:** Hospital ethics consultations, state statutes, Dutch Supreme Court ruling (2020) on euthanasia in dementia.
      *   **Core Question:** The user suspects "precedent autonomy" smuggles in metaphysics. They want this unpacked to inform the *scenes* (show, don't tell).
      *   **Specific Tensions/Oddities to Address:**
          1.  The document binds a "person" who no longer resembles the signer (no memory, content in the moment).
          2.  Present wishes are sometimes weighted, sometimes ignored (lapse if resisting vs. incapacity).
          3.  Asymmetry with Psychiatric Advance Directives (PADs) – often overridden during the crisis they were meant for.
          4.  Easy revocation while competent (even by a shrug) vs. rigid binding once incompetent.
      *   **Tasks:**
          1.  Reconstruct the implicit philosophy/theory of personhood and autonomy presupposed by current practice.
          2.  Identify what rival views are ruled out (especially the "different person" view).
          3.  Distinguish strict presuppositions from compatible but non-essential theories (underdetermination).
          4.  Address the Psychiatric Directive asymmetry (inconsistency vs. non-philosophical reasons).
          5.  Describe what would change if the practice shifted to a "present self only" view (experientialism).

  2.  **Deconstruct the Philosophy of "Precedent Autonomy":**
      *   *The Core Metaphysic:* It relies on a **Narrative/Extended Self** view rather than a **Psychological Continuity** or **Experiential Presentist** view. It assumes the "Life as a Whole" has moral weight greater than the sum of current moments.
      *   *Identity:* It presupposes *numerical identity* persists even when *psychological connectedness* fades. The body/biological organism is the anchor, not the mind's content.
      *   *Autonomy:* Autonomy is treated as a **critical interest** (Dworkin) rather than an **experiential interest**. It's about the integrity of the life story, not just current happiness.
      *   *Agency:* Agency is viewed as a *capacity to project values over time*, not just a capacity to choose in the moment.

  3.  **Address the Four Oddities:**
      *   *1. Paper > Living Woman:* Presupposes the "Past Self" owns the "Future Body." The "Self" is a temporally extended entity. The demented patient is a *stage* of the person, not a *new person*.
      *   *2. Present Wishes:* This is the friction point. If the present self is the same person, why ignore them? Because they lack *competence* (rational consistency with deep values). But if they resist, it causes harm (distress), so welfare interests kick in. It's a balance of Precedent Autonomy vs. Current Welfare.
      *   *3. Psychiatric Directives:* Why the difference? Psychosis is seen as *interruption/distortion* of the self, whereas dementia is seen as *erosion* of the self. Also, state police power (parens patriae) is stronger in psych (danger to self/others).
      *   *4. Revocation:* Competence is the threshold of sovereignty. If you are competent, you are God over your body. If not, you are a ward. The "shrug" proves you are still the sovereign author.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the inquiry. Validate the "smuggled metaphysics."
      *   **Section 1: The Implicit Ontology (What must be true?):**
          *   Concept: The "Diachronic Self."
          *   Distinction: Critical Interests (Dworkin) vs. Experiential Interests.
          *   The Body as the Vessel of Identity: Biological continuity trumps psychological discontinuity.
          *   Autonomy as Sovereignty: A one-time legislative act (the directive) binds the future executive branch (the caregivers/proxy).
      *   **Section 2: Rival Views Ruled Out:**
          *   Psychological Continuity Theory (Locke): If memory/personality breaks, the person ends. Current practice *rejects* this legally, even if philosophers debate it.
          *   Experientialism/Hedonism: Only current pleasure/pain matters. Practice rejects this by honoring the AD even if the patient is "happy" in dementia.
          *   The "New Person" Theory: That the demented patient is a distinct moral entity. Practice legally denies this.
      *   **Section 3: Underdetermination (Where philosophy stops and policy begins):**
          *   The threshold of "irreversibility."
          *   The weight of "current assent" vs. "prior dissent."
          *   The specific mechanism of proxy decision-making (Substituted Judgment vs. Best Interest).
      *   **Section 4: The Psychiatric Asymmetry:**
          *   It's not primarily metaphysical inconsistency.
          *   It's about *Nature of the Illness*: Psychosis is viewed as *alien* intrusion (noise), Dementia as *erosion* (fading signal).
          *   It's about *Harm Principle*: Psychosis often implies immediate danger; advanced dementia (in the AD context) implies existence without dignity.
          *   Liability/Coercion: Restraint in psych is immediate; withholding antibiotics in dementia is passive.
      *   **Section 5: The "Present Self Only" Shift (The Counterfactual):**
          *   If only current experience counts: ADs become "Letters of Preference," not binding orders.
          *   Proxy role changes from "Enforcer" to "Advocate for Current Comfort."
          *   Vocabulary change: "Incompetence" becomes irrelevant; "Distress" becomes the metric.
          *   The Document's Purpose: It becomes a biographical note for the caregiver to understand *who this used to be*, not a command on *when to let her die*.

  5.  **Refining for the Novelist:**
      *   Keep the tone analytical but evocative.
      *   Use terms like "Critical Interests," "Diachronic," "Parens Patriae."
      *   Highlight the dramatic tension: The conflict between the *Story of the Life* and the *Reality of the Moment*.
      *   Ensure the Dutch ruling nuance is acknowledged (it pushes the boundary of precedent autonomy further than the US).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "shrug" revocation? *Yes, under the sovereignty threshold.*
      *   *Check:* Did I explain why the happy dementia patient can be denied antibiotics? *Yes, Critical Interests override Experiential Interests.*
      *   *Check:* Is the Psychiatric distinction clear? *Need to emphasize the "alien voice" vs. "fading voice" distinction.*
      *   *Check:* Is the "New Person" theory addressed? *Yes, explicitly ruled out by law, though philosophically viable.*

  7.  **Final Polish:** Ensure the structure mirrors the user's complex prompt. (Introduction -> Ontology -> Ruled Out Views -> Underdetermination -> Psych Asymmetry -> The Alternative Practice). *Make sure to emphasize that the law treats the human organism as the persistent entity, regardless of psychological fragmentation.*

  8.  *(Final thought on the Dutch ruling)*: The Dutch ruling is crucial because it allows *active* ending based on the AD, whereas the US usually allows *passive* withholding. This strengthens the "Precedent Autonomy" claim to something closer to property rights over one's biological end. I should mention this distinction.

  9.  *(Final thought on the "shrug")*: This highlights the "Competence Threshold." It's a binary switch in law, though a gradient in reality. This is a rich source of dramatic irony.

  10. **Proceed to generate response.**
answer: |-
  This is a profound inquiry. You have correctly identified that the legal and medical machinery surrounding advance directives (ADs) is not merely procedural; it is a metaphysical engine running on specific, often unexamined, assumptions about time, identity, and the nature of the self. To write these scenes with the necessary weight, you need to understand the specific philosophy of personhood that the hospital ethics committee is enacting, often without realizing it.

  Here is a reconstruction of the implicit philosophy, the rival views it excludes, the points of underdetermination, the psychiatric asymmetry, and the counterfactual practice of a "present-self" ethics.

  ### 1. The Implicit Ontology: The Diachronic Sovereign

  For the practice you describe to function logically, it must presuppose a specific theory of personal identity and value. It is not a *Psychological Continuity* theory (which would suggest the person ends when memory and character fragment), nor is it an *Experientialist* theory (which would value only current pleasure and pain).

  Instead, the practice presupposes a **Narrative or Diachronic Theory of the Self**, anchored in **Biological Organismhood**.

  *   **The Extended Self:** The law treats the "person" not as a momentary consciousness but as a temporally extended entity—a life story that stretches from birth to death. The signature on the directive is an act of *legislation* by the "Past Self" intended to govern the "Future Body." For this to be binding, the Past Self and the Future Body must be ontologically identical, even if psychological connectedness has severed. The practice assumes that *you* are your body's history, not just your current mind.
  *   **Critical vs. Experiential Interests:** This distinction, famously articulated by Ronald Dworkin, is the engine of the ethics consultation.
      *   *Experiential Interests:* What the patient feels now (enjoying the meal, singing, fear of the needle).
      *   *Critical Interests:* What makes the life good *as a whole* according to the values held when competent (dignity, independence, not being a burden).
      *   **The Presupposition:** Critical interests survive the loss of the capacity to hold them. The "Past Self's" critical interest in a dignified death outweighs the "Present Self's" experiential interest in continuing to breathe. The practice assumes that a life can be *harmed* even if the subject of the harm cannot experience the harm.
  *   **Autonomy as Sovereignty, Not Conversation:** Autonomy is not treated as a continuous dialogue between the self and the world. It is treated as a property right. While competent, you are the sovereign owner of your biological organism. You can issue a standing order (the directive) that remains valid even after you lose the capacity to manage the property. The "shrug" revokes the directive because sovereignty is absolute *until* the moment it is lost. Once incompetence is declared, sovereignty transfers to the proxy (the daughter), who acts as the executor of the sovereign's last will.

  ### 2. Rival Views Quietly Ruled Out

  To make your scenes hum with tension, it helps to know which philosophical ghosts the hospital is exorcising.

  *   **The "New Person" Theory (Psychological Discontinuity):** Some philosophers (like Derek Parfit or Rebecca Dresser) argue that severe dementia creates a *new* person. The woman singing in the unit is not the engineer who signed the document; she is a different moral entity with no obligation to honor the dead engineer's wishes.
      *   *How the Practice Rules It Out:* The law refuses to declare the patient "dead" or "a new person." It maintains *numerical identity* based on the biological organism. If the hospital accepted the "New Person" theory, the directive would be void ab initio (like a contract signed by someone else). The drama lies in the daughter enforcing the will of a "ghost" upon a "stranger" who happens to share her mother's skin.
  *   **Radical Experientialism (Hedonism):** This view holds that only current conscious experience has moral weight. If the patient is happy, harming her (by withholding antibiotics) is wrong, regardless of past wishes.
      *   *How the Practice Rules It Out:* By honoring the directive despite the patient's visible contentment. The ethics committee is essentially arguing that *dignity* is an objective good that exists independently of the patient's subjective enjoyment.
  *   **The "Sliding Scale" of Agency:** One might argue that agency fades gradually, so authority should fade gradually.
      *   *How the Practice Rules It Out:* The law requires a binary threshold. You are either competent (total authority) or incompetent (no authority). This creates the dramatic irony you noted: a shrug revokes the directive, but a delusion cannot amend it.

  ### 3. Philosophical Underdetermination

  There are areas where the practice is not dictated by metaphysics but by policy. These are the cracks where your characters can argue without one being obviously "wrong."

  *   **The Weight of Current Assent:** The practice is underdetermined on how to handle a patient who says "I want to live" but lacks capacity. Some protocols say this voids the directive (respecting current affect); others say it is merely a symptom of the disease (respecting precedent autonomy). This is not a metaphysical necessity but a policy choice about risk aversion.
  *   **The Definition of "Burden":** The directive likely refuses treatment when the burden outweighs the benefit. But who defines the burden? The Past Self (who feared dependency) or the Present Self (who seems content dependent)? The practice usually defaults to the Past Self's definition, but this is a choice, not a logical truth.
  *   **The Dutch vs. American Distinction:** The Dutch ruling you cited pushes precedent autonomy to its limit (active euthanasia). The American system generally stops at passive withholding (letting die). This difference isn't metaphysical; it's cultural and legal (the taboo against killing vs. letting die). Both rely on the same metaphysics of the diachronic self, but draw the line at different actions.

  ### 4. The Psychiatric Asymmetry

  Why does the culture honor the dementia directive but often override the Psychiatric Advance Directive (PAD)? It is not a metaphysical inconsistency, but a distinction in the **phenomenology of the illness** and the **state's police power**.

  *   **Alienation vs. Erosion:**
      *   *Psychosis:* Viewed as an *intrusion*. The manic voice is seen as "not the patient." The PAD is overridden because the clinicians believe they are silencing the disease to let the "real" patient return. The illness is curable/interruptible.
      *   *Dementia:* Viewed as *erosion*. There is no "real" patient underneath waiting to return. The directive is honored because there is no hope of restoring the sovereign self. The illness is terminal/progressive.
  *   **Parens Patriae and Danger:** Psychiatric holds are often triggered by danger to self or others. The state's interest in preserving life and public safety trumps autonomy in immediate crisis. In the memory care unit, the patient is usually not "dangerous" in a violent sense; they are merely "dying." The state has less interest in forcing life-prolonging treatment on a non-dangerous, terminal patient than on restraining a manic patient.
  *   **Epistemic Humility:** Clinicians believe they can predict the end of a manic episode (and thus the return of competence). They cannot predict the end of dementia. Therefore, overriding a PAD is temporary; honoring a dementia directive is permanent. The asymmetry rests on *prognosis*, not personhood.

  ### 5. The Counterfactual: A "Present Self" Practice

  If you were to rewrite the world of your novel to operate on the theory that **only the present self's experience counts** (Experientialism), the following would have to change:

  *   **The Document:** The Advance Directive would cease to be a *binding legal order*. It would become a "Biographical Preference Letter." It would inform the proxy of what the patient *used* to value, but could not mandate action. It would be advisory, like a recipe book left for a cook, not a contract.
  *   **The Consultation:** Ethics committees would no longer ask, "What did she want?" They would ask, "What is she feeling?" The metric would shift from *Substituted Judgment* (doing what she would have done) to *Best Interest* (maximizing current well-being).
  *   **Vocabulary:** The word "Incompetence" would vanish or lose its moral force. If the present self is the only moral agent, their capacity is irrelevant; their distress is what matters. A patient saying "I want to live" would be authoritative regardless of MMSE score, because there is no "higher" self to overrule them.
  *   **The Proxy's Role:** The daughter would no longer be an *enforcer* of the mother's past will. She would be a *guardian* of the mother's current comfort. If the mother is happy eating pureed food and watching TV, the daughter would be ethically bound to prolong that life, even if the "Engineer Mother" would have found it undignified.
  *   **The Tragedy:** In this revised practice, the tragedy of your novel changes. Currently, the tragedy is that the mother's *life story* is being violated by her *biological survival*. In the "Present Self" model, the tragedy is that the mother's *past values* are rendered meaningless by her *current existence*. The document becomes a relic of a dead person, haunting a living one who cannot understand it.

  ### For Your Scenes

  To carry this argument without reciting it, focus on the **temporal dissonance**.

  *   **The Object:** Describe the directive not as paper, but as a *time capsule*. It is a voice from the past shouting into a room where the only listener (the daughter) must pretend the shouting is coming from the woman in the bed.
  *   **The Conflict:** When the daughter hesitates, show her looking at her mother's happy, vacant face, then at the signature. She is weighing a *memory* against a *sensation*.
  *   **The Doctor:** The physician shouldn't argue philosophy. They should argue *protocol*. "We follow the document because the document is the only thing that proves she was ever the person we think she was."
  *   **The Dutch Nuance:** If you reference the Dutch ruling, use it to show the edge of the cliff. The American system lets the patient fade; the Dutch system allows the Past Self to pull the plug on the Present Body. Both agree the Past Self is the owner; they disagree on whether the owner can order the demolition of the house while someone is still living in it.

  The metaphysics smuggled into "precedent autonomy" is the belief that a human being is a **project**, not an **event**. Your novel turns on the moment the project is declared complete, while the event is still ongoing.
