      *   **Phase 4: The Inconsistency (The "No-Go"):**
          *   This is the meat. The user suspects a trilemma.
          *   The "Lewisian Trap": To fix SCA, you add a causal basis clause. To fix Finks, you need the basis to persist. To fix Masks, you need the basis to be sufficient.
          *   The specific conflict: **Non-Triviality + Fink-Immunity + Causal Basis Requirement.**
          *   If you require a categorical basis to ground the disposition, and finks can target that basis, you need a basis for the basis. Regress.
          *   If you allow the basis to be dispositional, you lose reductivity (already dropped).
          *   If you say "the basis that would exist if no fink," you risk triviality (the "would-be" basis).
          *   *Verdict:* You cannot have a reductive analysis that references a categorical basis *and* solves the fink problem without circularity or triviality. Since we dropped reductivity, the tension shifts.
          *   *New Tension:* **Intrinsicality vs. Mask-Immunity.** If masks are extrinsic, and the disposition is intrinsic, the analysis must screen off extrinsic factors. But if the analysis screens off extrinsic factors, how does it account for the fact that the object *won't* manifest in the actual world (due to the mask)?
          *   *Actually, the bigger one:* **The "Adequacy vs. Non-Triviality" Conflict.** To handle all counterexamples (finks, masks, mimics), the analysans becomes so complex it either becomes trivial (true of everything) or circular (uses disposition terms).
          *   *Let's refine the "No-Go" for the user:* It's the **Fink/Causal Basis/Non-Triviality** triangle. Specifically, if you demand a *categorical* causal basis (Lewis style), Finks destroy it. If you demand the analysis handle Finks by referencing the *persistence* of the basis, you presuppose the disposition.
      *   **Phase 5: The Killer Constraint:**
          *   Which requirement kills the most analyses?
          *   It's the **Fink/Mask Immunity without Triviality.**
          *   SCA dies to Finks.
          *   Lewis's Causal Basis dies to Finkish Bases.
          *   CP analyses die to Precision demands (or become trivial).
          *   Recommendation: Build the thesis on **how to specify the triggering conditions without presupposing the manifestation.**
      *   **Phase 6: Minor Questions:**
          *   *Mask vs. Antidote:* It's a distinction in *location* of the interferer (external vs. internal/chemical), but metaphysically they function the same (prevent manifestation). Don't build a requirement on distinguishing them unless you care about the locus of causality.
          *   *Flatmate/Testability:* Dispositions are modal, not historical. A glass is fragile even if never dropped. The requirement is "Counterfactual Support," not "Actual Manifestation."

  4.  **Refining the Tone:**
