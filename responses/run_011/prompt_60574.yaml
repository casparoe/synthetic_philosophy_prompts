prompt: |-
  Right, so I'm in the second year of a metaphysics PhD, my thesis is meant to be about what dispositions are, and I'm due to give my confirmation review in about six weeks. Honest answer: I've spent four months on the fink and mask literature and have nothing to show for it except a wall of index cards and a headache. My supervisor's advice was that before I commit to any particular analysis I should write down what a decent analysis actually has to do — not which one wins, just the job description — and that's the bit I want your help with. Please act as a professional metaphysician who works on dispositions and powers, has strong opinions of their own, but can keep those opinions seperate from the requirements. And do think it through rather than just producing a list: brainstorm a long messy set of candidate demands first, tell me which ones you're throwing out and why, and only then give me the clean version.

  Here's the shape I want the clean version in. Each requirement stated precisely; then the case or consideration that generates it — the specific counterexample, or the distinction that would get collapsed, or the thing the analysis would contradict; then a tag saying whether it's non-negotiable or just a prejudice of one camp. The camp tags matter a lot to me. My suspicion is that several things people insist on are demands that particular programmes make rather than requirements any analysis has to meet: that the analysis be reductive rather than allowed to use dispositional vocabulary in the analysans, that dispositions have to come out intrinsic, that it must cope with multi-track cases like irascibility and not just tidy single-track ones like solubility, that it must deliver a plain conditional rather than something with a ceteris paribus clause bolted on, that it must classify Johnston's hater of styrofoam the same way in both directions (people seem to use that one for more than a single purpose and I've never got clear on whether it's one case or two). Sort all of that out, and say which of those demands could be dropped with the project still intact.

  Most important part: identify any subset of the requirements that cant be jointly satisfied. I've got a feeling there's a genuine no-go here rather than just a run of hard cases — something like the demand that the analysis handle masks and antidotes while staying reductive and non-trivial, combined with the causal-basis clause needing a basis that isn't itself finkish, which looks like it runs you up a regress with a fink for the fink. If that's right, saying so is the result I want, not a footnote. Then tell me which single requirement knocks out the most candidate analyses, since that's the one I should build the thesis around. Two smaller things to fold in: first, is the mask/antidote distinction real at all, or is an antidote just a mask described from the other end — because if it isn't real, whatever requirement is doing the "keep the two apart" work needs rewriting, and I need to know which. Second, my flatmate, who does materials science, keeps asking me whether fragility is even testable if a glass wrapped in foam never gets dropped once; if there's a neat way to turn that into a requirement, or to say it isn't one, give me a sentence on it. No references or reading list please — I have all the papers, I just can't see the wood for the trees.
