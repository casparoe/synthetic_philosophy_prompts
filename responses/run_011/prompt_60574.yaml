          *   *Mask/Antidote:* Are they distinct? Mask prevents manifestation. Antidote removes disposition? Or prevents manifestation? Usually, antidote removes the *causal basis* temporarily or neutralizes the reaction. Mask blocks the interaction. Distinction might be metaphysical or just descriptive.
