answer: |-
  # Desiderata for a Theory of Path Dependence in Political Economy

  To license the causal claim that a regulatory architecture is the product of path dependence—specifically, that the observed outcome is non-ergodic and would not have converged "by itself" absent a specific contingent decision—a theory must satisfy specific epistemic and ontological conditions. The following desiderata distinguish the logical necessities of the argument from the theoretical baggage of specific schools of thought.

  ### 1. The Mechanism of Reproduction (Lock-in vs. Persistence)
  *   **The Requirement:** The theory must specify a mechanism of *self-reinforcement* that creates an asymmetry between the cost of establishing the institution and the cost of exiting it over time. It must distinguish "lock-in" (where reversal becomes asymptotically impossible or prohibitively costly relative to the initial setup) from mere "persistence" (where an institution survives due to inertia or high but static switching costs).
  *   **Consideration/Test Case:** Consider a monopoly maintained by high capital costs versus one maintained by network effects. The former is persistent; if a competitor raises enough capital, they can enter. The latter is locked-in; the value of the incumbent grows with every new user, making entry impossible regardless of capital. A theory of path dependence must demonstrate the latter dynamic (positive feedback), not just the former.
  *   **Status:** **Non-Negotiable.** Without a self-reinforcing mechanism, you have stability, not path dependence.
  *   **Camp Prejudice:** *Increasing-Returns Camp (Arthur, David):* Insists the mechanism must be economic (e.g., coordination costs, learning effects). *Historical Institutionalist Camp (Pierson, Thelen):* Allows political mechanisms (e.g., power asymmetries, adaptive expectations). The dissertation should accept either, provided the feedback loop is demonstrated.

  ### 2. The Individuation of Outcomes
  *   **The Requirement:** The theory must define the "outcome" at a grain size that is functionally distinct but structurally comparable. It must avoid the "uniqueness trap" (where every history is unique, making the counterfactual trivially true) and the "convergence trap" (where definitions are so coarse that all regimes look like "capitalism," making the counterfactual false).
  *   **Consideration/Test Case:** If the outcome is defined as "a regulatory state," most industrialized nations converge (coarse grain). If defined as "Section 4(b) of the 1934 Act," every nation is unique (fine grain). The theory must identify a meso-level functional equivalence (e.g., "a centralized vs. decentralized enforcement regime") where divergence is observable and meaningful.
  *   **Status:** **Non-Negotiable.** Without this, the claim "would not have arrived anyway" is semantically void.
  *   **Camp Prejudice:** *Comparative Political Economy:* Often prefers coarse-grained "varieties of capitalism" typologies. *Legal/Historical Specificity:* Often prefers fine-grained statutory analysis. The theory must explicitly justify its grain size.

  ### 3. The Bifurcation Point (Critical Juncture)
  *   **The Requirement:** The theory must locate a temporal window of structural fluidity where causal constraints were relaxed, allowing for multiple potential outcomes. Crucially, it must address whether this point can be identified *ex ante* (predictively) or only *ex post* (narratively).
  *   **Consideration/Test Case:** If the bifurcation point is only identifiable because we know the outcome (hindsight bias), the claim of contingency is weakened. A robust theory should be able to specify the conditions of fluidity without relying on the knowledge of the subsequent lock-in.
  *   **Status:** **Non-Negotiable (Existence); Contested (Identification).** A bifurcation must have occurred, but the ability to identify it *ex ante* is a point of contention (see Section 7).
  *   **Camp Prejudice:** *Contingency/Replay-the-Tape (Gould, Mahoney):* Emphasizes the radical uncertainty of the juncture. *Structuralist:* Often argues the juncture was determined by deeper variables, reducing true contingency.

  ### 4. The Space of Feasible Alternatives
  *   **The Requirement:** The theory must define the "road not taken" not as what is imaginable today, but as what was politically and technically feasible *at the time of the bifurcation*.
  *   **Consideration/Test Case:** Proposing that a country could have adopted a Nordic-style welfare model in 1930s Latin America may be technically imaginable but politically infeasible given the class structures of the time. A valid counterfactual requires the alternative to reside within the historical possibility frontier.
  *   **Status:** **Non-Negotiable.** Counterfactuals based on anachronistic feasibility are fiction, not science.
  *   **Camp Prejudice:** *Rational Choice:* Defines feasibility by equilibrium constraints. *Historical Institutionalism:* Defines feasibility by power configurations and ideational boundaries.

  ### 5. Normative Status (Efficiency vs. Optimality)
  *   **The Requirement:** The theory must clarify whether the locked-in outcome is required to be suboptimal (inefficient) relative to the alternative, or whether "path-dependent optimality" is permitted.
  *   **Consideration/Test Case:** The QWERTY keyboard is the classic case of inefficient lock-in. However, a regulatory regime might be locked in and still be the most efficient option available, simply because the *process* of selection was contingent.
  *   **Status:** **Camp Prejudice.** The claim "the same outcome would not have arrived anyway" is a causal claim about *difference*, not a normative claim about *quality*.
  *   **Camp Prejudice:** *Increasing-Returns (Economics):* Often equates path dependence with inefficiency (market failure). *Historical Institutionalism (PolSci):* Allows for path-dependent optimality; the focus is on distinctiveness and stability, not welfare loss. **Your dissertation should treat inefficiency as optional.** Requiring it unnecessarily narrows the scope of your claim.

  ### 6. The Fate of Displaced Institutions
  *   **The Requirement:** The theory must account for the standards, institutions, or practices that were displaced by the locked-in arrangement. Did they vanish, were they subsumed, or did they persist as subordinated layers?
  *   **Consideration/Test Case:** If a regulatory architecture locked in a specific standard, did the competing standard disappear entirely (extinction), or does it survive in niche applications (layering)? A theory that ignores the losers risks overstating the completeness of the lock-in.
  *   **Status:** **Non-Negotiable.** A complete causal account requires explaining the selection mechanism, which implies explaining the rejection of the alternative.
  *   **Camp Prejudice:** *Punctuated Equilibrium:* Often assumes clean breaks. *Gradual Change (Streeck, Thelen):* Expects displaced institutions to linger or transform.

  ---

  ### The Methodological Trilemma and the Single Eliminator

  In constructing your methods chapter, you must confront a tension that lies at the heart of path dependence theory. There is a subset of the requirements above that cannot be jointly satisfied without compromising the integrity of the claim.

  **The Impossible Subset:**
  You cannot jointly satisfy **(1) Ex-Ante Identification of the Bifurcation Point**, **(2) Strong Contingency (Replay-the-Tape)**, and **(3) Determinate Lock-In.**

  *   **Why:** If you can identify the bifurcation point *ex ante* (Requirement 1) using structural variables, you imply that the split was predictable based on antecedent conditions. This undermines **Strong Contingency** (Requirement 2), which relies on the radical uncertainty of the moment. Conversely, if the Lock-In is truly **Determinate** (Requirement 3)—meaning the system is immune to reversal once chosen—it suggests the structural forces favoring that path were so strong that the initial "contingent" choice was actually highly probable, again undermining Contingency.
  *   **The Trade-off:** Most successful empirical applications of path dependence sacrifice **(1) Ex-Ante Identification**. They rely on *ex post* narrative reconstruction to locate the juncture. This leaves them vulnerable to selection bias (choosing the juncture that fits the outcome), but it is the only way to preserve the claim of genuine contingency while demonstrating robust lock-in.

  **The Single Eliminator:**
  The requirement that eliminates the most familiar versions of the theory is **The Ex-Ante Identification of the Bifurcation Point.**

  *   **Reasoning:** The vast majority of path dependence literature in political economy (particularly Historical Institutionalism) is explanatory, not predictive. It explains why a system looks the way it does by referencing a past crisis or decision. If you impose the standard that a theorist must be able to identify the critical juncture *before* knowing the outcome (or without using the outcome to select the juncture), you eliminate most narrative-based case studies. They rely on hindsight to define the "critical" nature of the moment.
  *   **Implication for your Dissertation:** You do not need to meet this standard to make a valid claim, but you must admit it. Your methods chapter should explicitly state that while *ex ante* identification is the gold standard for predictive theory, your project employs *ex post* process tracing to establish causal inference. You license the claim not by prediction, but by the robustness of the counterfactual mechanism and the elimination of convergent explanations.

  **Final Recommendation:**
  Do not claim inefficiency (Desideratum 5) unless you have the data to prove it; it is a liability, not an asset, to the core causal claim. Focus your energy on Desideratum 2 (Individuation) and Desideratum 4 (Feasible Alternatives). If you can rigorously define the outcome and prove the alternative was genuinely possible at the time, you satisfy the logical core of "would not have arrived anyway" without falling into the trap of requiring impossible predictive power.
