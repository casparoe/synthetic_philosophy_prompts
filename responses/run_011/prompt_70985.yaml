answer: |-
  ### 1. The Question

  **Read the following excerpt from a retrospective feature on the collapse of the tech firm Nexus Corp:**

  > "When Nexus Corp filed for bankruptcy in 2014, the writing was on the wall. Looking back, the signs were everywhere: the rushed launch, the ignored safety protocols, the CEO's erratic behavior. Yet in 2012, the mood was different. Analysts were divided; some warned of overextension, while others praised the aggressive growth strategy. The board itself was split. But once the collapse came, the dissenting voices grew louder in memory, and the cautious memos suddenly seemed like definitive warnings. We tell this story now as a straight line from hubris to ruin, because that is how cause and effect must align. Even though nobody could have known which way the vote would go, the outcome feels inevitable now. The chaos of those months has settled into a clear lesson: success was impossible given the culture."

  **Question:**
  Diagnose the epistemic errors in this text. Specifically: (1) Distinguish how hindsight bias and the narrative fallacy operate differently here, noting that the text acknowledges uncertainty yet still fails; (2) Explain why a reader-facing warning (e.g., "this was less predictable than it looks") does not solve the problem, referencing the mechanism of creeping determinism; (3) Propose one concrete newsroom practice that mitigates this and explain why it succeeds where warnings fail; and (4) Address the cost of this fix: does resisting the narrative fallacy make the writing worse, and is that a reason to abandon the fix?

  **(40 minutes, closed book, one index card allowed. 20 marks total.)**

  ***

  ### 2. Model Answer

  The excerpt commits two distinct errors that reinforce each other. Hindsight bias is the cognitive shift in probability judgment after an outcome is known; the narrative fallacy is the compression of complex causality into a coherent plot. The text attempts to inoculate itself against the first by admitting analysts were "divided" and "nobody could have known." However, it immediately undermines this by asserting "the writing was on the wall" and "success was impossible." This is the hallmark of hindsight bias: knowing the outcome makes the past look more determined than it was. The probability judgment shifts ex-post, even if the ex-ante uncertainty is verbally acknowledged.

  The narrative fallacy operates separately but synergistically. It is not about probability, but about causal structure. The text admits the past was "chaos" but chooses to tell the story as a "straight line from hubris to ruin." This satisfies the reader's demand for coherence but falsifies the mechanism of events. A competent diagnosis must separate these: hindsight bias distorts *what we thought would happen*; the narrative fallacy distorts *how we explain why it happened*.

  Mere acknowledgment of uncertainty does not neutralize these biases because of creeping determinism (Beyth & Fischhoff). Once you know the outcome, you cannot reconstruct your prior state of mind accurately; the knowledge contaminates the memory. Telling a reader "this was less predictable than it looks" is set dressing. It relies on the writer's current, biased judgment to correct that same judgment. It fails because the mechanism of the bias is automatic and unconscious; a verbal warning does not disconnect the knowledge of the outcome from the reconstruction of the past.

  To actually mitigate this, newsrooms need external anchors, not internal warnings. The standard practice should be a forecasting log or dated contemporaneous records. Reporters should record probabilities and causal theories *before* the outcome is known, or retrieve dated memos from the time. This works because it bypasses reconstructed memory. It forces the writer to confront data that contradicts the current narrative arc. It is an institutional check on individual cognition.

  Finally, resisting the narrative fallacy does make the writing worse, in a specific sense. Coherence is what makes explanation land with a reader; messy causality is unsatisfying and hard to follow. The reward structure of journalism pays for clarity. However, this cost is not a reason to abandon the fix, but a reason to be smarter about it. We cannot sacrifice truth for flow. The solution is not to write incoherently, but to show the fork in the road. Describe the world as it looked *then*, where multiple outcomes were live possibilities. This preserves narrative tension while maintaining epistemic honesty. The cost is higher cognitive load for the reader, but the benefit is a report that describes reality rather than a story that comforts them.

  ***

  ### 3. Marking Scheme (20 Marks Total)

  **1. Distinction between Hindsight Bias and Narrative Fallacy (4 marks)**
  *   **Full marks:** Clearly defines hindsight bias as probability/judgment shift and narrative fallacy as causal compression/plotting. Notes that the excerpt admits uncertainty verbally but asserts inevitability structurally.
  *   **Losing mark:** Treating the terms as synonyms or focusing only on " inevitability" without distinguishing probability from causal story.

  **2. Diagnosis of the Excerpt's Specific Failure (4 marks)**
  *   **Full marks:** Identifies that acknowledging uncertainty ("analysts were divided") is insufficient because the conclusion ("success was impossible") overrides it. Spots the performative contradiction.
  *   **Losing mark:** Accepting the excerpt's claim of uncertainty at face value or criticizing it only for saying "writing was on the wall."

  **3. Mechanism of Failure & Creeping Determinism (4 marks)**
  *   **Full marks:** Explains *why* warnings fail (knowledge of outcome contaminates reconstruction). References creeping determinism or Beyth & Fischhoff correctly as the mechanism.
  *   **Losing mark:** Stating warnings fail without explaining the cognitive mechanism, or misidentifying the study/term.

  **4. Concrete Newsroom Practice & Mechanism (4 marks)**
  *   **Full marks:** Proposes dated records/forecasting logs. Explains *why* it works (external anchor vs. internal memory).
  *   **Losing mark:** Suggesting vague practices ("be more careful") or failing to explain why records work where warnings don't.

  **5. The Coherence Cost (4 marks)**
  *   **Full marks:** Acknowledges that accurate writing is less coherent/satisfying. Argues for keeping the fix despite the cost (or proposes showing the "fork in the road").
  *   **Losing mark:** Claiming accurate writing is just as easy, or arguing the cost means we should abandon accuracy for flow.

  ***

  ### 4. Differentiator: First vs. Strong Second

  A **Strong Second** defines the concepts correctly and proposes a valid fix (dated records). A **First** identifies the *performative contradiction* in the excerpt (admitting chaos while asserting a straight line) and argues that the "cost" of accuracy is actually a feature (narrative tension) rather than a bug, showing a deeper grasp of the craft.
