      *   Scene 3: The climax with the virus/image (the mind-machine crash).

  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the writer's predicament. Validate the desire to move past "Stephenson predicted it."
      *   *Ontological Analysis:*
          *   *Realism:* The Metaverse has causal power (economy, status). But it's tethered.
