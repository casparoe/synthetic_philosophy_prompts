          *   *Fictionalism:* Weak fit. Stakes are too high for it to be just "pretend."
      *   *The Virus/Crux:* This is the pivot. The virus proves the virtual *can* kill, but only by exploiting the physical. It blurs the line but ultimately privileges the physical. It challenges Chalmers by showing virtual objects need a physical substrate to be lethal.
      *   *Ethics (Luck):* Does virtual murder count? In *Snow Crash*, virtual violence is usually sport. But the virus makes it real. This suggests virtual acts are wrongful *if* they bridge to the physical.
