      *   **Constraint 2:** Apply three specific philosophical frameworks:
          1.  *Virtual Realism* (David Chalmers): Virtual objects are real computational processes with causal powers.
          2.  *Artifactualism* (Amie Thomasson): Virtual contents are abstract, intention-dependent artifacts (like fictional characters).
          3.  *Fictionalism/Pretense:* Virtual acts are moves in a game; nothing is strictly true inside.
      *   **Constraint 3:** Address Ethics (Morgan Luck's Gamer's Dilemma): Can virtual acts be wrongful without flesh-and-blood victims?
      *   **Specific Textual Elements to Analyze:** The Street, Black Sun club, Hiro's dual life (rented locker vs. Metaverse standing), The Librarian (daemon), avatar rendering/code.
