      *   *Quiet Failure:* Call out the definitional dodge. Suggest pivoting to "gradient signal" vs "evaluation metric."
      *   *Compression:* Advise cutting unless it can be tied to "environment as verifier."
      *   *Legibility:* It's close to "Sycophancy" but the "Model > Overseer" condition makes it specific to scaling.
