      *   *Key Concept 1:* Verification Leverage (Cost to solve / Cost to check). OS keeps leverage high; PS drives it to 1.
      *   *Key Concept 2:* Legibility Premium. When Model > Overseer, PS forces Model to mimic Overseer's reasoning style rather than optimize for truth/outcome.
      *   *Key Concept 3:* Failure Modes. OS fails visibly (Goodharting); PS fails quietly (Mimicry/Generalization error).
