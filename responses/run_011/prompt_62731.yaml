answer: |-
  # PREP SHEET: DUTY-SLOT VIEW OF OMISSION

  ### OPENING CONCESSIONS (First 2 Minutes)
  *Do not wait for these to be dragged out of you. State them upfront to inoculate against "gotcha" moments.*

  1.  **Concede Normativity:** Admit immediately that "slot" is a normative/institutional fact, not a physical one. You are not describing physics; you are describing *accountability structures*.
  2.  **Concede Dualism:** Acknowledge that physical causation (water rose) remains intact. Your claim is only about *omission* causation. You are not denying physics, just restricting the label "cause" for non-events.
  3.  **Concede Limitation:** Admit this view does not help with *strict liability* cases where duty is irrelevant. You are arguing for a specific subset of causation: *attributable* omission.

  ---

  ### THE EIGHT QUESTIONS (Ordered by Damage Potential)

  **1. The Safety Engineer (Systemic Design Gap)**
  *   **Question:** "If the system design omitted the slot entirely, your view says the accident has no omission-cause. That stops the investigation before it starts. How is that useful?"
  *   **Reply:** It forces the investigation to shift from 'who failed' to 'why was there no slot?' The cause isn't a person's inaction; it's the design flaw that left the gap. We aren't stopping the investigation; we're redirecting it from individual blame to structural absence. The 'cause' is the missing slot itself, which is a positive fact about the org chart.
  *   **Soft Spot:** Sounds like semantics. Victims hear "no cause" as "no responsibility."

  **2. The Tort Lawyer (Duty/Cause Conflation)**
  *   **Question:** "You're defining causation by negligence. In law, duty and cause are separate. If a stranger omits help, they didn't cause the death legally, but physically they did. You're mixing provinces."
  *   **Reply:** I'm arguing that for omissions, the provinces *are* mixed. Physical causation requires energy transfer; omissions have none. So 'omission causation' is necessarily a legal/normative construct. I'm not collapsing them; I'm admitting they were never separate for non-events.
  *   **Soft Spot:** Hard to square with "but-for" tests where duty isn't established yet.

  **3. The Causal Inference Group (Counterfactual Redundancy)**
  *   **Question:** "Slot-holder omits, but a backup exists and also fails. Counterfactual outcome is the same. Did the slot-holder cause it? Your view says yes, counterfactuals say no."
  *   **Reply:** My view says they caused the *breach of the primary defense*. Causation here tracks system integrity degradation, not just outcome variance. They caused the system to be vulnerable, even if vulnerability didn't finalize the outcome alone.
  *   **Soft Spot:** Weak link to standard counterfactual definitions of causation. (See Special Briefing below).

  **4. The Metaphysician (Normativity Trap)**
  *   **Question:** "Is the slot descriptive or normative? If normative, you've reduced causation to ethics. If descriptive, how do you define it without circularity?"
  *   **Reply:** Guilty. Omission causation *is* an ethical/metaphysical hybrid. Physical causation is mind-independent; omission causation is mind-dependent. I'm not reducing causation to ethics; I'm isolating the specific species of causation that requires minds.
  *   **Soft Spot:** Surrenders the "metaphysical" high ground. Makes the theory less universal.

  **5. The Causal Inference Group (Trivialization)**
  *   **Question:** "This is just conditioning on institutional variables in a DAG. Why posit a new ontology? You've reinvented variable selection with extra steps."
  *   **Reply:** Variable selection is arbitrary without a theory of *why* these variables matter. Slots explain the selection mechanism. It tells you *which* variables are causal candidates based on social structure, not just statistical correlation.
  *   **Soft Spot:** Might just be semantics. Statisticians may see no practical difference.

  **6. The Safety Engineer (Blame Culture)**
  *   **Question:** "This encourages blame culture. Focus on slots, not people. But you end up pointing at the slot-holder. Isn't that what we're trying to stop?"
  *   **Reply:** Slots are system features. Blaming the slot-holder is blaming the system that put them there without support. It highlights that the person was *placed* in a causal role, shifting focus to the assignment process.
  *   **Soft Spot:** Hard to sell to victims or unions. Sounds like victim-blaming.

  **7. The Tort Lawyer (Strict Liability)**
  *   **Question:** "Strict liability cases require no duty. Your view fails here. If I store explosives and they blow, I caused it regardless of slots."
  *   **Reply:** Strict liability creates a duty by statute. The slot exists in law, even if not in contract. The 'slot' is the legal status of 'owner/operator'. It's still an assigned position, just assigned by statute rather than contract.
  *   **Soft Spot:** Statutory interpretation varies. Some statutes explicitly waive duty requirements.

  **8. The Regress (The "Praying Nobody Asks" Question)**
  *   **Question:** "Who assigned the slot? If the assigner omitted that duty, did they have a slot? Infinite regress. Where does it stop?"
  *   **Reply:** Base slots are constitutional. The organization's founding mandate is the terminal slot. We stop at the charter. If the charter is silent, the omission is a legislative failure, not an operational one.
  *   **Soft Spot:** Arbitrary stopping point. Why is the charter sacred?

  ---

  ### SPECIAL BRIEFING: THE REDUNDANCY CASE
  *You asked if this is as bad as you suspect.*
  **Yes.** It is the strongest logical threat. If causation implies counterfactual dependence, and the backup means the outcome doesn't change, your view breaks the link between "cause" and "difference."
  **Strategy:** Do not defend counterfactual dependence. Pivot to **Risk Increase**. The slot-holder's omission increased the *probability* of the accident, even if the backup held. In safety engineering, causing risk is often treated as causing the accident potential. Own this shift. If you cling to outcome determination, you will lose the causal inference group.

  ---

  \answer{1 The Systemic Design Gap}
