answer: |-
  ### Preamble: The Philosophical Trade

  You asked for a instrument grounded in Sartre. Here is the plain truth: **You cannot build a bureaucratic decision procedure inside Sartre's ontology.** Sartre holds that freedom is ontological, not empirical; it cannot be measured, ranked, or adjudicated by a panel without committing the very objectification ("The Look") that creates bad faith. If we treat the worker's statement as an object to be decoded, we risk replicating the alienation we seek to cure.

  However, safety management requires operational categories, not ontological truths. What I am handing you is a **pragmatic adaptation**. We are trading ontological purity for operational utility.
  *   **What is kept:** The distinction between *Facticity* (the situation as given) and *Transcendence* (the worker's projection of meaning/action). The recognition that treating rules as "things" rather than "projects" is a safety risk.
  *   **What is dropped:** The claim that we can judge the worker's *being*. We judge only the *narrative structure* of the report and its utility for learning.
  *   **The Trade:** We treat "Bad Faith" not as a moral sin, but as a **Systemic Risk Indicator**. When a worker claims they had no choice because of their role, we treat that claim as a hazard, regardless of its metaphysical truth. This is worth making because "I had no choice" stops learning; "I chose this" enables it.

  **Contested Claim Flag:** *The assertion that "Bad Faith" can be reliably identified from written text is contested by phenomenologists, who argue it is a pre-reflective attitude inaccessible to third-party observation. This procedure assumes text reveals stance for operational purposes only.*

  ***

  ### The Instrument: Agency & Facticity Review Procedure

  **Purpose:** To classify incident statements based on how the writer locates agency, distinguishing between physical limits and role-based abdication.
  **Users:** Learning Review Panel (4 members).
  **Time:** 5 minutes per statement.

  **Step 1: The Physical Test (Facticity)**
  *   **Question:** Does the writer claim that physical laws or immediate mechanical failure made the adverse outcome unavoidable?
  *   **Standard:** Look for references to equipment failure, weather physics, or lack of time/space that no human action could alter.
  *   **Sufficient Answer:** "Yes" = Classify as **CONSTRAINT**. Stop.
  *   **Stopping Rule:** If the writer admits they *could* physically have acted differently, proceed to Step 2.

  **Step 2: The Information Test (Knowledge)**
  *   **Question:** Does the writer claim they lacked the specific information required to choose differently at that moment?
  *   **Standard:** Look for "I did not know," "I could not see," or "I was not told."
  *   **Sufficient Answer:** "Yes" = Classify as **KNOWLEDGE**. Stop.
  *   **Stopping Rule:** If the writer admits they had the information, proceed to Step 3.

  **Step 3: The Choice Test (Transcendence)**
  *   **Question:** Does the writer explicitly acknowledge they weighed alternatives and selected one?
  *   **Standard:** Look for "I decided," "I chose," "I prioritized."
  *   **Sufficient Answer:** "Yes" = Classify as **JUDGMENT**. Stop.
  *   **Stopping Rule:** If the writer describes the action as automatic or compelled, proceed to Step 4.

  **Step 4: The Norm Test (Routine)**
  *   **Question:** Does the writer claim the action was the standard, accepted way the task is performed by everyone?
  *   **Standard:** Look for "This is how we do it," "Standard practice," "Always done this way."
  *   **Sufficient Answer:** "Yes" = Classify as **ROUTINE**. Stop.
  *   **Stopping Rule:** If the writer claims the action was standard *for them* but implies they lacked the authority to deviate despite physical ability, proceed to Step 5.

  **Step 5: The Authority Test (Role-Bound)**
  *   **Question:** Does the writer concede physical ability to act but deny the *authority* or *right* to do so based on their job title or hierarchy?
  *   **Standard:** Look for "Not my place," "Not my aircraft," "Marshaller tells me," "Procedure owns the outcome."
  *   **Sufficient Answer:** "Yes" = Classify as **ROLE_BOUND**. Stop.
  *   **Hand-Off Rule:** If the panel disagrees on whether this is `ROUTINE` (everyone does it) or `ROLE_BOUND` (I am not allowed to), the **Union Safety Representative** holds the deciding vote to protect against management bias.

  **Step 6: The Reflexive Check (Panel Integrity)**
  *   **Question:** Are we classifying this as `ROLE_BOUND` because the writer is actually disempowered, or because we find their explanation inconvenient?
  *   **Standard:** If the classification is `ROLE_BOUND`, the **Accountable Manager** (via the panel chair) must verify if the procedure actually grants that authority.
  *   **Hand-Off:** If the procedure *does* grant authority but the worker believes they lack it, escalate to **Training Manager**. This is a culture gap, not a rule gap.

  ***

  ### Case Analysis Table

  | statement_id | first_step_resolved_at | classification | distinction_doing_the_work | finding_the_panel_may_write | finding_the_panel_may_not_draw | residual_judgment |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Statement 1** (Loader) | Step 5 (Authority Test) | `ROLE_BOUND` | Facticity (Marshaller signal) is treated as overriding Transcendence (Loader's ability to stop). | "Operator perceived stop authority resided solely with Marshalling; clarity needed on Loader's independent stop authority during slot pressure." | "The loader was negligent for not stopping." (Non-punitive policy forbids this). | **Line Supervisor:** Verify if slot pressure is implicitly overriding safety authority in daily ops. |
  | **Statement 2** (Pushback) | Step 5 (Authority Test) | `ROLE_BOUND` | Transcendence is collapsed into the Procedure (treating rules as things that act). *Contested Step.* | "Senior staff identify procedure as the agent of outcomes; safety culture must reinforce that procedure is a tool used by agents, not an agent itself." | "The driver is in bad faith." (Ontological judgment forbidden). | **Union Rep:** Protect the driver from blame while challenging the narrative that the form encourages. |
  | **Statement 3** (De-icing) | Step 3 (Choice Test) | `JUDGMENT` | Transcendence is fully acknowledged; writer owns the projection of value over facticity (time). | "Operator exercised valid judgment under pressure; requires management support for similar future decisions to prevent normalization of deviation." | "The operator was pressured into signing." (Contradicts their explicit text). | **Panel Chair:** Ensure the 'support' recommendation is actioned, not just noted. |

  ***

  ### System Configuration JSON

  ```json
  {
    "labels": [
      {
        "code": "CONSTRAINT",
        "name": "Physical Constraint",
        "one_line_definition": "Physical laws or mechanical failure made the outcome unavoidable.",
