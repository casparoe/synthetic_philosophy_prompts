  ### Limitations and Misfires

  1.  **Second Language Writers:** A worker writing in their second language may use passive voice ("The belt was driven") not to deny agency, but because they lack the grammatical confidence for active voice ("I drove the belt"). The panel must check language proficiency records before applying Step 5.
  2.  **Coerced Statements:** If a supervisor stands behind the writer, the text becomes a performance for the supervisor, not a record of the event. The "Reflexive Check" (Step 6) must include asking the writer if they were alone when typing.
  3.  **Internalized Rules:** When a worker has absorbed the rulebook so thoroughly that "The Procedure" and "My Will" are indistinguishable to them, Step 5 will misfire. They are not lying; they are culturally constituted. This requires a **Training Manager** hand-off, not a safety finding.
  4.  **Reflexive Risk:** By running this test, the panel treats the worker's text as an object. To mitigate this, the panel must run Step 6 on *their own* minutes. If the panel writes "The procedure requires us to find X," they are also in `ROLE_BOUND` bad faith.
