answer: |-
  **S1**
  A resident posts a message on a public neighborhood forum read by five hundred locals: "This town belongs to long-term families. The recent [Ethnic Group] influx is an invasion that lowers our property values, and we need to send them back to where they came from." The post generates angry comments but no reported incidents.

  **S2**
  The same resident posts a message on the same forum: "This town belongs to me. The [Ethnic Group] family at 404 Elm is an invasion that lowers my property value, and I am going to make them go back to where they came from." The post generates angry comments but no reported incidents.

  **The single changed feature:** The shift from a collective political imperative ("we need to") to a personal declaration of intent ("I am going to").

  ***

  ### The Demonstration

  **United States Framework**
  In S1, the speech is protected. Under *Brandenburg v. Ohio*, the government can only punish speech that incites "imminent lawless action." A call for a community to "send them back" is treated as political hyperbole or advocacy of a policy, not a directive for immediate violence. Under *R.A.V. v. St. Paul*, the government cannot ban speech simply because it expresses hatred toward a specific group; the viewpoint itself is immune. In S2, the speech is unprotected. The Supreme Court's "True Threat" doctrine (*Virginia v. Black*, *Elonis v. United States*) removes protection when a speaker communicates a serious expression of intent to commit unlawful violence. By shifting from "we" to "I" and targeting a specific address, the statement moves from abstract policy to a specific promise of action. A reasonable recipient would interpret "I am going to make them go back" as a threat of force, not political opinion.
  *Verdict:* S1 Lawful; S2 Unlawful.

  **Continental European Framework**
  In S1, the speech is punishable under typical hate-speech provisions (e.g., Germany's §130 *Volksverhetzung* or France's *Provocation à la haine*). These statutes protect "public peace" and "group dignity." By labeling an ethnic group an "invasion" and calling for their removal, the speaker insults the human dignity of that segment of the population and disturbs public order. The law does not require a specific threat of violence; the degradation of the group is the harm. In S2, the specific *hate-speech* provision often does not reach the conduct. Because the statement targets a specific family rather than a "segment of the population" in the abstract, it fails the group-libel element required for hate-speech incitement. It is still a crime, but it is prosecuted under ordinary criminal statutes regarding coercion or threats against an individual, not under the special hate-speech framework designed to protect social harmony.
  *Verdict:* S1 Punishable (Hate Speech); S2 Not Punishable (under Hate Speech provisions).

  ***

  ### The Checks

  **1. Which feature is doing the work?**
  The "Agency/Target" feature drives the flip. In the US, the "I" creates a *True Threat* by personalizing the violence; change it back to "we," and it reverts to protected political advocacy. In Europe, the "Group" creates a *Dignity Violation*; change it to a specific individual, and it reverts to a private dispute. If you add a second feature—for example, making S2 public *and* calling for others to join ("I will, and you should too")—the pair gets muddy. In the US, it remains a threat (or incitement). In Europe, it might slide back into hate-speech territory because it re-engages the "incitement of others" element. The single-variable comparison holds only so long as the statement remains a personal pledge in S2.

  **2. Be honest about residue.**
  In S2, the speaker is still prosecutable in Europe under ordinary criminal law (threats/coercion). Does this wreck the flip? No, it relocates it. The point of the exercise is to show what *legal interest* is being prioritized. In S1, Europe intervenes to protect the *group's standing* (Hate Speech). In S2, Europe intervenes (if at all) to protect the *individual's safety* (Ordinary Criminal Law). The "Hate Speech" framework specifically recedes because the harm is no longer viewed as an attack on the social fabric, but on a single person. The flip remains valid because the *justification* for state intervention changes, even if the speaker doesn't walk free.

  **3. The Two Attacks.**
  *The American Civil Libertarian:* "You rigged the US side by relying on the 'True Threat' exception, which is narrow and fact-specific. Most hate speech isn't a direct threat. By choosing S2, you've proven only that threats are banned, not that the US tolerates hate speech less than Europe. A real test would compare S1 against a European ban on S1 without introducing a threat element in S2."
  *The European Dignity Theorist:* "You artificially separate the threat from the hatred. In our view, a threat based on ethnicity *is* an attack on group dignity, regardless of which statute we use to charge it. By saying the hate-speech provision 'doesn't reach it,' you're playing semantic games with penal codes. The state still punishes the speaker for the same reason: the speech undermined the equal standing of citizens. The protection is the same; your distinction is bureaucratic, not philosophical."

  **4. One Scale or Two?**
  It is two different scales that only look like one. The US scale measures the *distance from government control of ideas*; the further you are from state censorship, the more "free" you are. The European scale measures the *proximity to social harmony*; the closer you are to peaceful coexistence, the more "free" you are. In S1, the US prioritizes the speaker's liberty to offend, while Europe prioritizes the group's right to dignity. In S2, the US prioritizes the individual's right to safety (banning the threat), while Europe categorizes the harm as individual safety rather than group dignity. They are not moving up and down the same ladder of "restrictiveness"; they are climbing different walls entirely.
