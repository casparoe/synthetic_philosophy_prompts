answer: |-
  Here is an audit of the sidebar text from the perspective of a proponent of the Deutsch–Wallace (DW) programme, followed by an analysis of your specific puzzles and the final inference.

  ### Part 1: Sentence-by-Sentence Audit

  **Sentence 1:** *"If every outcome of a measurement really occurs, each in its own branch, then nothing in the theory singles out any one of them as the outcome that will happen, and probability looks unintelligible — yet experiment shows outcomes turning up at frequencies given by squared amplitudes."*

  *   **Accept:** A DW sympathizer accepts this as an accurate statement of the "Incoherence Problem." They agree that without a derivation, probability seems to have no place in a deterministic theory where everything happens. They also accept the empirical constraint: whatever solution is proposed must recover the Born rule (squared amplitudes).
  *   **Tolerate:** The phrase "probability looks unintelligible" is dramatic but acceptable as a description of the pre-DW state of affairs.
  *   **Reject:** Nothing outright. This sentence sets the stage correctly.

  **Sentence 2:** *"Deutsch and Wallace repaired this with a decision-theoretic argument: any rational agent who knows the universal wavefunction and cares about what happens to her future selves is compelled to bet exactly as the Born rule prescribes."*

  *   **Accept:** The core mechanism: decision theory compels rational agents to use the Born rule for betting.
  *   **Tolerate:** The phrase "cares about what happens to her future selves." A sympathizer knows this is a simplification of the *Caring Measure* argument. In Everett, you do not become one future self; you become all of them. The argument is not that you care about "what happens" (as if only one thing happens) but that you care about the *weighted sum* of outcomes across all branches. However, "selves" (plural) captures the multiplicity well enough for a sidebar.
  *   **Reject:** The implication that the agent is "compelled" solely by caring. A sympathizer would insist the compulsion comes from specific axioms of rationality (like *Diachronic Consistency* and *Branching Indifference*), not just "caring." Mere caring isn't enough; you must care *in a specific structural way* compatible with the wavefunction.

  **Sentence 3:** *"The only assumptions are quantum mechanics itself plus ordinary standards of rationality, so the rule is derived rather than postulated."*

  *   **Accept:** The conclusion that the Born rule is derived, not added as a separate postulate. This is the main selling point of the programme.
  *   **Tolerate:** The phrase "ordinary standards of rationality." A sympathizer knows this is rhetorical shorthand. They tolerate it because the axioms used (e.g., transitivity of preference) *look* like standard decision theory.
  *   **Reject:** The claim that *only* these assumptions are used. A critic (and a careful sympathizer) knows there is a hidden assumption: that the physical structure of branching allows decision-theoretic axioms to apply in the first place. Specifically, the axiom of **Branching Indifference** (an agent shouldn't care about the mere fact of branching, only the rewards) is not "ordinary" rationality; it is a substantive claim about how value supervenes on physics in a multiverse. A sympathizer might reject the word "ordinary" if pressed, preferring "standard decision-theoretic axioms applied to branching."

  **Sentence 4:** *"And since the branches genuinely differ in weight, and weight is what the argument shows a rational agent must bet on, Everettian quantum mechanics turns out to have objective chance after all."*

  *   **Accept:** The functionalist conclusion. A DW sympathizer argues that "objective chance" just *is* whatever quantity rational agents are compelled to use to guide their beliefs and actions. If the proof works, the quantity (weight) *is* chance.
  *   **Tolerate:** The phrasing "turns out to have." It suggests a discovery rather than a conceptual redefinition, but it passes.
  *   **Reject:** None, provided one accepts the functionalist definition of chance. This sentence is the philosophical payoff for the sympathizer.

  ---

  ### Part 2: Addressing Your Puzzles

  **Puzzle 1: "Cares about future selves" vs. "No fact about which branch."**

  You have identified a tension between the ontology (all branches exist) and the phenomenology (I experience only one).

  *   **The Conflict:** If there is "no fact" about which branch you end up in because you end up in *all* of them, why do you need to bet? If I know I will experience outcome A *and* outcome B, betting on A seems meaningless.
  *   **The DW Resolution:** The phrase "cares about what happens to her future selves" (plural) is doing the heavy lifting here. The DW argument does not rely on you becoming *one* specific self (which would require a "fact" about which one). Instead, it relies on **Subjective Uncertainty** or **Caring**.
      *   *Option A (Subjective Uncertainty):* Even though all branches exist, from *your* perspective before the measurement, you are uncertain which experience you will have. The "no fact" claim applies to the external God's-eye view; from the inside, uncertainty is real.
      *   *Option B (Caring Measure):* Even if you know you will be both successors, you care *more* about the successor in the high-weight branch. The "weight" is not a probability of existence (they all exist); it is a measure of **how much you care** about that successor.
  *   **Why the text is safe:** By using the plural "selves," the text avoids claiming you become only one. It implies you have a relationship with the *collection* of successors. The "no fact" problem is dissolved because the betting strategy isn't about predicting *which* single world you land in, but about managing your concern for the *distribution* of your successors across the multiverse.

  **Puzzle 2: "Only assumptions are quantum mechanics plus ordinary rationality."**

  This is the most contentious claim in the sidebar.

  *   **The Surface Claim:** We are just using standard logic and math (QM) plus standard rules for making choices (Rationality).
  *   **The Hidden Cost:** To make the proof work, Wallace introduces axioms that look like "ordinary rationality" but behave differently in a branching universe. The key example is **Branching Indifference**.
      *   *In a single-world theory:* It is trivial that you don't care about "branching" because there is no branching.
      *   *In Everett:* You must explicitly assume that an agent does not care about the *number* of branches, only the *amplitude*. If an agent cared about the count of branches (e.g., "I want to maximize the number of happy successors regardless of weight"), the Born rule would not follow.
  *   **The Verdict:** A sympathizer would argue Branching Indifference *is* rational because branching is not a physical event that changes local rewards, just a redundancy in description. A critic argues this is a physical assumption smuggled in as a rational one. So, the claim is **available** to them, but only if they define "ordinary rationality" to include "rationality adapted for branching physics." It is a semantic shield.

  ---

  ### Part 3: The Final Inference and the Critic's Objection

  **If the first three sentences were corrected, would the inference to "objective chance" still go through?**

  From the DW perspective: **Yes.**
  From the Critic's perspective: **No.**

  Here is the structural reason why, without citing literature:

  **1. The Functionalist Move**
  The DW programme relies on **Functionalism about Probability**. This is the view that "probability" is not a specific physical stuff (like propensity) or a specific frequency; it is defined by its *role*. The role of probability is to guide rational belief and action.
  *   *The Logic:* If Quantity X is the only thing a rational agent can use to guide action in situation Y, then Quantity X *is* the probability in situation Y.
  *   *The Inference:* The DW proof shows Amplitude Squared is the only quantity rational agents can use. Therefore, Amplitude Squared *is* Probability.
  *   *Correction Impact:* Even if you correct "ordinary rationality" to "branching-specific rationality," the functionalist logic holds. If you accept the axioms, you accept the conclusion.

  **2. What the Sidebar Leaves Out (The Critic's Actual Difficulty)**
  The sidebar claims Everettian QM has "objective chance after all." A critic would insist this is a bait-and-switch. The actual difficulty left out is the gap between **Epistemic Rationality** and **Ontological Chance**.

  *   **The Critic's Argument:**
      *   The DW proof establishes that it is *rational to act as if* there is chance. (Epistemic)
      *   It does not establish that there *is* chance in the world. (Ontological)
      *   In a deterministic multiverse, everything that can happen, does happen. The "chance" of an outcome is either 0 (it doesn't happen) or 1 (it happens).
      *   By deriving the Born rule, DW shows that the *weights* of the branches behave mathematically like probabilities. But the critic argues: **Behavior is not Being.**
      *   *Analogy:* If I program a robot to act exactly as if it is in pain when touched, have I given the robot pain? A functionalist says yes; a critic says no, you've only given it pain-behavior.
      *   Similarly, the critic says DW has given us **Chance-Behavior** (betting patterns), not **Chance-Being** (genuine indeterminism or propensity).

  **3. The Missing Link**
  The sidebar skips the justification for Functionalism. It assumes that if you can derive the *rules* of probability, you have recovered the *reality* of probability.
  *   A critic insists that "Objective Chance" requires that, prior to the measurement, it is **not yet fixed** which outcome occurs.
  *   In Everett, it **is fixed** (the wavefunction evolves deterministically).
  *   Therefore, no amount of decision-theoretic maneuvering can turn a fixed outcome into an "objective chance." It can only turn it into a "subjective expectation."

  **Summary Conclusion**
  Your friend is likely objecting to Sentence 4. The DW programme successfully argues that a rational agent in a multiverse must *bet* according to the Born rule (Sentences 1–3). However, inferring from this that the multiverse contains "objective chance" (Sentence 4) requires accepting that "chance" is nothing more than "that which guides rational betting." If you believe chance requires genuine openness in the future (which Everett denies), the inference fails. The sidebar presents a functionalist victory as an ontological one.
