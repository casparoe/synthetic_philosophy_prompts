answer: |-
  This is an exceptionally sharp formulation of one of the most persistent problems in the metaphysics of causation. You have identified the **Profligacy Problem** regarding causation by omission, and you are asking about the **Normative Account** of causal selection.

  Here is the breakdown of the established positions, how they handle your specific cases, and where your "malicious bystander" intuition fits.

  ### 1. The Established Name and Position

  There is no single word, but the view you are describing is standardly referred to as the **Normative Account of Causation by Omission** (or sometimes the **Expectation-Based Account**).

  The core thesis is that while counterfactual dependence (if $X$ hadn't happened, $Y$ wouldn't have) is necessary for causation, it is not sufficient. For an omission to count as a cause, the omission must constitute a **deviation from a norm**.

  **Key Proponents:**
  *   **H.L.A. Hart & Tony Honoré (*Causation in the Law*, 1959):** This is likely the most relevant text for your work. They argue that we distinguish causes from mere conditions based on "voluntary human interventions" and **duties**. An omission is a cause only if there was a duty to act. This aligns perfectly with your Assigned Adjuster vs. Bystander intuition.
  *   **Sarah McGrath (*Causation by Omission*, 2005):** She argues explicitly that causal judgments track normative expectations. She distinguishes between *prescriptive norms* (what you ought to do) and *descriptive norms* (what usually happens).
  *   **Christopher Hitchcock & Joshua Knobe (*The Default/Deviant Distinction*, 2009):** Working in experimental philosophy, they show that people judge causation based on what is "default" (normal/expected) versus "deviant" (abnormal). An omission is only a cause if the action was the default.

  ### 2. How This Differs from General Causal Selection

  You asked how this differs from the general business of picking salient causes (e.g., distinguishing the spark from the oxygen in a fire).

  *   **Positive Causal Selection:** In a fire, both the spark and the oxygen exist physically. We select the spark as "the cause" for pragmatic reasons (it's unusual, manipulable, or blameworthy). Both are ontologically equal; the selection is epistemic or pragmatic.
  *   **Omission Causation:** Here, the ontology is the problem. There is *nothing* there. The Normative Account claims that the **norm** does the ontological heavy lifting. It turns a "non-event" into an "event" for the purposes of causal attribution.
      *   *Without the norm:* The adjuster not reinforcing the levee is the same metaphysical fact as the Queen of England not reinforcing the levee.
      *   *With the norm:* The adjuster's inaction is a **breach**; the Queen's inaction is **irrelevant**. The breach creates a causal link that the irrelevance does not.

  So, while general selection filters *existing* factors, the Normative Account of Omission validates *absent* factors.

  ### 3. The Malicious Bystander (Your Second Case)

  This is the critical stress test.
  *   **Case:** Bystander, no assigned role, unique position, knows, *glad* of the outcome.
  *   **Intuition:** Slides toward "cause."
  *   **Problem:** Strict "Role/Duty" accounts (like Hart & Honoré's stricter readings) would say this is still not a cause, because there was no antecedent duty.

  **Does this break the Normative View?**
  It depends on how broadly you define "Norm."

  **A. The Narrow View (Institutional/Contractual):**
  If the norm is defined strictly by job descriptions or legal duties, your malicious bystander is a **counterexample**. On this view, the intuition that he is a "cause" is a confusion of *moral blame* with *physical causation*. We want to punish him, so we linguistically promote his omission to a cause, but metaphysically, he didn't cause it any more than the Queen did.

  **B. The Broad View (Moral/Social Norms):**
  Philosophers like McGrath would argue this view **absorbs** the case. "Norms" are not just employment contracts. They include moral expectations.
  *   There is a general moral norm: *If you can prevent great harm at little cost to yourself, you ought to do so.*
  *   By being glad of the outcome, the bystander violates a **moral norm** even if he violates no **contractual norm**.
  *   Furthermore, his *intent* changes the structure. He isn't just "letting die"; he is "allowing to die *in order that* they die." In many causal frameworks, when an omission is intended as a means to an end, it acquires the causal status of an action.

  **C. The "Quasi-Causation" View (Beebee):**
  Helen Beebee (*Causation and Responsibility*, 2004) argues that **there is no such thing as causation by omission.** She argues omissions are never causes. When we say the adjuster "caused" the flood, we are speaking loosely about responsibility.
  *   On this view, your intuition about the malicious bystander is proof that we are conflating **causation** with **culpability**. The bystander is *culpable* (blameworthy), but not a *cause*. The sliding intuition you feel is the sliding of blame, not causation.

  ### 4. If There Is No Term, What Should We Call It?

  If you need a term for your claims handling that distinguishes the "Assigned Adjuster" and the "Malicious Bystander" from the " Innocent Bystander," the philosophical literature suggests:

  **"Normatively Salient Omission"**

  This captures that the omission matters because it violates a standard (norm) that makes it noticeable (salient).

  **Boundary Conditions for your purposes:**
  To classify an omission as a cause in your framework, you might require three conditions:
  1.  **Counterfactual Power:** The agent could have physically prevented the loss.
  2.  **Epistemic Access:** The agent knew (or should have known) the risk.
  3.  **Normative Breach:** The agent violated a specific duty (contractual) OR a general moral expectation (malice/exploitation).

  ### Summary for your Work

  *   **The View:** The **Normative Account of Causation**.
  *   **The Distinction:** It differs from standard causal selection because it uses norms to validate *absences* as causes, not just to prioritize *presences*.
  *   **The Malicious Bystander:** This is not a counterexample if you include **moral norms** and **intent** within your definition of "expectation." If you restrict "expectation" to "job duty," then your intuition about the bystander reveals that you are tracking **culpability**, not causation.
  *   **Recommended Terminology:** If you need to write this into a report or guideline, use **"Breach of Expected Intervention."** It captures that an intervention was expected (by role or by moral circumstance), it didn't happen, and that absence is what drove the loss.

  **Philosophical Reference for further reading:**
  If you want to read the primary source that matches your insurance context almost exactly, look at **Hart and Honoré, *Causation in the Law***, specifically the chapters on "Interventions" and "Responsibility." They deal extensively with the distinction between "causing a flood" (by breaking a levee) and "causing a flood" (by not mending it), and how duty creates the causal link.
