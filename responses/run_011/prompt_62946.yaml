prompt: |-
  I work in insurance claims, and I keep needing a distinction I don't have a word for. Two adjusters look at the same storm. One is assigned a levee, doesn't reinforce it, and the town behind it floods. Another walks past an unassigned levee, doesn't reinforce it, and a different town floods. Physically these are the same sort of thing: something that could have been strengthened wasn't, and water got in. Yet we say the first adjuster caused the flood and the second merely failed to prevent one — and it isn't only his employer's assignment doing the work, since a bystander with no duties at all still doesn't strike us as a cause, even though counterfactually the damage would have been avoided had he acted. What seems to matter is whether there was a standing expectation that made the absence noticeable rather than just another thing that didn't happen.

  But it can't be only that. When the bystander is the one person positioned to act, knows it, and is quietly glad of the outcome, my intuitions start sliding toward calling him a cause after all, with no role or expectation in sight.

  I gather that causation by omission, and the worry that otherwise every absence becomes a cause, is a live topic in philosophy; I also gather that the same appeal to what is expected or normal gets used to explain which of many positive factors we single out as "the" cause of something. So: is there an established name or position for the view that whether an omission causes anything is settled by roles and expectations rather than by counterfactual dependence? How does it differ from the general business of picking salient causes out of many conditions, and where does my second case fall — a counterexample to that view, or something it has resources to absorb? And if there is no established term, what would you call it, and what would you take its boundary conditions to be?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Insurance claims adjuster.
      *   **Problem:** Distinguishing between two types of omissions (failures to act).
          *   Case 1: Assigned adjuster ignores assigned levee $\rightarrow$ Flood. (Intuition: Caused the flood).
          *   Case 2: Unassigned adjuster ignores unassigned levee $\rightarrow$ Flood. (Intuition: Merely failed to prevent).
          *   Case 3: Bystander (no duty) ignores levee $\rightarrow$ Flood. (Intuition: Not a cause).
          *   Case 4: Bystander (no duty, unique position, knows, *glad* of outcome) $\rightarrow$ Flood. (Intuition: Sliding toward "cause").
      *   **Core Question:** Is there an established philosophical name/position for the view that omission causation depends on *roles/expectations/norms* rather than just counterfactual dependence?
      *   **Secondary Questions:**
          *   How does this differ from general causal selection (salience)?
          *   Does Case 4 (malicious bystander) break this view, or can the view absorb it?
          *   If no term exists, what should it be called, and what are its boundary conditions?

  2.  **Identify the Philosophical Landscape:**
      *   **Topic:** Causation by Omission (CBO).
      *   **The Problem:** The "Profligacy Problem" (if counterfactual dependence is all that matters, *everything* that didn't happen but would have prevented the effect is a cause. E.g., the Queen of England didn't water my plants, so she killed them).
      *   **The Proposed Solution:** Normative/Expectation-based accounts.
      *   **Key Philosophers:** Hart & Honoré (Legal), McGrath (Norms), Beebee (Anti-realist about CBO), Schaffer (Contrastive), Menzies (Interventionist).

  3.  **Address the "Established Name/Position":**
      *   There isn't *one* single term, but there is a dominant framework.
      *   *Hart and Honoré* (Causation in the Law): They distinguish between "causes" and "mere conditions" using the concept of voluntary human intervention and *duties*. This is very close to the user's insurance context.
      *   *Normative Account of Causation:* Sarah McGrath is the big name here. She argues that causal judgments track normative expectations.
      *   *Default/Deviant Distinction:* Hitchcock and Knobe use this in experimental philosophy. Normalcy determines causal status.
      *   *Term:* "Normative Account of Causation by Omission" or "Expectation-Based Causal Selection."

  4.  **Differentiate from General Causal Selection:**
      *   *General Selection:* Picking *the* cause from many positive conditions (e.g., spark vs. oxygen in a fire). Usually pragmatic or contextual.
      *   *Omission Specific:* The metaphysical status of the *absence* itself. Is an absence even *capable* of being a cause? The normative view says yes, but only if the absence is a violation of a norm.
      *   *Key Difference:* In positive causation, all factors exist. In omission, one factor is missing. The normative view explains *why* that specific missing thing counts as an event while others don't.

  5.  **Analyze Case 4 (The Malicious Bystander):**
      *   *Scenario:* No duty, unique position, knowledge, *intent/malice*.
      *   *Does it break the Normative View?* Not necessarily.
      *   *Why?* Norms aren't just *roles* (assigned duties). They include moral norms (do not harm, do not exploit).
      *   *McGrath's View:* She distinguishes between prescriptive norms (duties) and descriptive norms (what usually happens). But moral norms count too.
      *   *Intent:* If the bystander *wills* the outcome, the omission becomes part of a deliberate plan. It shifts from "failure to save" to "allowing to die" (which can be morally/legally equivalent to killing in some frameworks).
      *   *Alternative:* The "Quasi-Causation" or "Moral Causation" angle.
      *   *Resolution:* The normative view can absorb this by expanding "expectation" to include *moral* expectations, not just *institutional* ones. However, if the theory relies *strictly* on assigned roles, Case 4 is a counterexample. If it relies on *normative expectations* broadly (including moral), it holds.

  6.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate that this is indeed the central problem in the metaphysics of omission.
      *   **The Terminology:**
          *   "The Profligacy Problem" (the issue of too many causes).
          *   "Normative Account of Causation" (the solution).
          *   Key names: H.L.A. Hart & Tony Honoré (Legal foundation), Sarah McGrath (Philosophical foundation), Christopher Hitchcock (Default/Deviant).
      *   **Distinguishing from Causal Selection:**
          *   Explain that standard selection picks from *existing* factors.
          *   Omission causation validates the *absence* as a factor based on norms.
          *   Analogy: Oxygen/Spark (positive) vs. Waterer/Plant (negative).
      *   **Addressing Case 4 (The Malicious Bystander):**
          *   This is the crux.
          *   Explain that "Norms" $\neq$ "Job Descriptions."
          *   Moral norms (do not let die if easy) vs. Institutional norms.
          *   Intent matters: It transforms the omission into a *means*.
          *   Reference: The Doctrine of Doing and Allowing (though that's ethics, not metaphysics, they overlap here).
          *   Verdict: The Normative Account *can* absorb it if "norm" is defined broadly (moral/social), but fails if defined narrowly (contractual).
      *   **Proposed Terminology (if none fits perfectly):**
          *   "Normatively Salient Omission."
          *   "Duty-Bound Causation."
      *   **Boundary Conditions:**
          *   Capacity (could they have done it?).
          *   Knowledge (did they know?).
          *   Normative Breach (duty or moral expectation).
          *   Counterfactual Dependence (would it have worked?).

  7.  **Refining the Tone:**
      *   Professional, philosophical but accessible.
      *   Respect the user's expertise (insurance claims) while bridging to metaphysics.
      *   Ensure the distinction between *metaphysics* (is it a cause?) and *normativity* (are they liable?) is clear, though the user is asking where they blur.

  8.  **Self-Correction/Check during drafting:**
      *   *Wait, did I emphasize Hart & Honoré enough?* They are crucial for legal/insurance contexts. They talk about "interventions" and "responsibility."
      *   *Is Case 4 really causation?* In law, this might be "depraved indifference" or similar. In metaphysics, it's tricky. I need to make sure I don't conflate *moral blame* with *causation*. The user says their intuition slides toward calling him a *cause*. I need to address why that intuition exists (the moral coloring the metaphysical).
      *   *Schaffer's Contrastive Account:* Might be worth a mention. Causation is relative to a contrast. "Why did the town flood (rather than stay dry)?" vs "Why did the town flood (rather than the other town)?" This handles the selection part well.

  9.  **Final Polish:** Organize into clear sections. Ensure the "Malicious Bystander" gets a dedicated analysis. (Decided to focus heavily on McGrath and Hart/Honoré as they fit the "duty/expectation" angle best).

  **(Self-Correction on Case 4):** I need to be careful. If the bystander has *no duty*, standard normative accounts might say it's not a cause. But the user's intuition says it *is*. This suggests the user's intuition might be importing *moral* causation into *physical* causation. I should point out that distinction. The "Normative Account" usually explains why we *treat* it as a cause for liability, not necessarily why it's a cause in the physics sense. I need to clarify that the philosophical debate is often about whether causation *itself* is normative, or whether we just *select* causes normatively.

  *Revised Plan:*
  1. Name the problem (Profligacy).
  2. Name the solution (Normative/Expectation accounts).
  3. Cite Hart/Honoré and McGrath.
