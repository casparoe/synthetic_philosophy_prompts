answer: |-
  Brainstorming out loud: "Art is infection" is a metaphor masquerading as a definition. In a scientific context, "infection" implies a vector, a host, and a pathogen. If we treat it as a causal mechanism, it's a descriptive claim about psychology (A causes state B in C). If we treat it as a definition, it's a boundary condition (no infection = no art). If we treat it as evaluation, it's a grading scale (more infection = better art). But Tolstoy also cares about the *content* of the feeling, not just the transmission. So "infection" might also be a moral filter (only *these* feelings count as valid pathogens). The leader is likely using the phrase to do all four jobs at once: defining the category, grading the quality, judging the morality, and dismissing the counter-evidence. That's where the slippage is.

  Here is the menu of candidate readings for "Art is Infection."

  ### 1. The Definitional Claim (The Threshold)
  *   **The Claim:** An object counts as a work of art **if and only if** it successfully transmits a feeling from the creator to a receiver. Infectiousness is a necessary and sufficient condition for art-status.
  *   **Evaluation:** Substantive but vulnerable. It excludes "failed art" (works intended to move but which move no one) and includes "accidental art" (objects that move us but weren't intended to, like a sunset). A standard counterexample is a technically proficient but emotionally sterile commission—it fits the definition of craft, but Tolstoy would call it counterfeit art if no feeling passes.
  *   **Tolstoy's Commitment:** High. This is the core engine of *What Is Art?* He explicitly distinguishes art from craft by this transmission. If no feeling is transmitted, it is not art, it is a counterfeit.
  *   **Verdict on Your Quartets:** If you were moved, infection occurred. By this claim, the quartets **are art**. The leader's dismissal implies either you are lying about being moved, or the infection wasn't "real" (perhaps because it wasn't universal). If she means the latter, she has shifted to a different claim.

  ### 2. The Quantitative Claim (The Metric)
  *   **The Claim:** The artistic excellence of a work is **proportional to the degree** of infectiousness (how many people are moved, how deeply, and how clearly).
  *   **Evaluation:** Defensible but subjective. It turns aesthetics into epidemiology. The counterexample is the "cult classic": a work that infects a few people profoundly but leaves the majority cold. Is it worse than a pop song that infects millions superficially? Tolstoy would say yes, if the feeling is universal, but this claim alone doesn't account for *depth*.
  *   **Tolstoy's Commitment:** High. In Chapter 15, he lists the three conditions of infectiousness (individuality, clarity, sincerity) and states that the degree of these determines the quality of the art *as art*.
  *   **Verdict on Your Quartets:** This claim allows the quartets to be art, but perhaps not *great* art if they only infect you (or a niche elite) rather than "all humanity." The leader might be using this to say, "It didn't infect me or the peasants, so it's minor art." This shifts the blame from the object to its reach.

  ### 3. The Moral Claim (The Vector)
  *   **The Claim:** A work is **good art** (or true art) **only if** the feeling transmitted promotes religious consciousness and universal brotherhood. Infectiousness of "bad" feelings (exclusive, elite, sexual, patriotic) renders the work harmful or counterfeit.
  *   **Evaluation:** Highly controversial and often rejected by secular aesthetics. Counterexample: Goya's *Saturn Devouring His Son* or Wagner's *Ring* (both condemned by Tolstoy). They transmit powerful feelings, but not of Christian unity. Most philosophers separate moral value from aesthetic value; Tolstoy collapses them.
  *   **Tolstoy's Commitment:** Absolute. This is the telos of the book. He distinguishes between "art" (transmission) and "good art" (right transmission), but in practice, he labels exclusive art as "counterfeit," effectively stripping it of the title.
  *   **Verdict on Your Quartets:** This is the hammer. Even if you were moved (Definition satisfied) and deeply (Metric satisfied), if the feeling was one of elite isolation or complex intellectual pleasure rather than universal brotherhood, it is **bad art** or **counterfeit art**. The leader isn't saying you weren't infected; she's saying you were infected by the wrong virus.

  ***

  ### The Equivocation

  Your ringleader is sliding between **Reading 1 (The Definitional Claim)** and **Reading 3 (The Moral Claim)** without signaling the shift.

  When you said, "The quartets get me every time," you presented evidence of infection. Under Reading 1, this settles the matter: it is art. But she waved you off. Why? Because she is actually operating under Reading 3, where "Art is Infection" is shorthand for "Art is the Infection of *Correct* Feelings."

  She is treating "Infection" as a monolithic good, ignoring Tolstoy's crucial distinction between the *capacity* to infect (skill/sincerity) and the *content* of the infection (religious/moral worth). She used the phrase to define the category (implying your lack of infection proves it's not art) while simultaneously judging the quality (implying Tolstoy's lack of infection proves it's bad art).

  ### The Polite Intervention

  Next Tuesday, you don't need to attack her; just ask for clarification on the mechanism. Tolstoy loves precision about conditions, so frame it as a request for operational clarity.

  Try this:

  *"I've been thinking about your point that 'art is infection.' It seems Tolstoy uses infectiousness to do two different jobs. First, as a switch: if no feeling passes, it's not art. Second, as a filter: if the wrong feeling passes, it's still not 'good' art. When I said the quartets move me, I satisfied the first condition. So when you dismiss them, are you saying I'm mistaken about being moved (the switch), or that the feeling I caught is the wrong strain (the filter)? Because those seem like different arguments."*

  This forces her to admit whether she is questioning your experience or imposing a moral judgment on the content of that experience. It keeps you in the realm of "clarifying the hypothesis" rather than "disagreeing with the teacher."
