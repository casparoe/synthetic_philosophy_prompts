answer: |-
  Dear Colleague, I know the feeling well; the standard cases have become so familiar that students treat them as cues to recite rehearsed objections rather than to think. Your instinct to collapse the cultural distance into temporal distance is sharp, because it blocks the easy retreat into tolerance. Here is the case built to your specifications, followed by the demonstration and the critique you asked for.

  Eleanor is sixty-two and the sole surviving trustee of the Meridian Foundation, a small grant-making body she established at twenty-seven when she drafted the founding deed herself. The deed contains a binding allocation rule stating that funds must be awarded solely on the basis of demonstrated individual resilience, explicitly excluding consideration of systemic disadvantage, and only she has the power to vary this rule. This month two applications are before her: one from a candidate who fits the old rule perfectly despite significant privilege, and another from a candidate who fits a new criterion of equity but lacks the specific resilience markers the deed demands. Eleanor now believes the old rule is morally inadequate because she has come to see systemic disadvantage as a morally relevant consideration she previously failed to register, though she has received no new non-moral information about the efficacy of either candidate and stands to gain nothing personally from either outcome. She is sitting in the office with Julian, a junior trustee who is taking the minutes, and he asks her directly whether the original rule was wrong all along or whether it was right then and is wrong now, forcing her to address the status of her past judgement rather than simply overriding it.

  A framework relativist of the familiar sort holds that moral truths are only true relative to the normative framework an agent actually inhabits at the time of judgement. On the first question, whether the twenty-seven-year-old's original judgement was true, the relativist must say it was true relative to Eleanor's framework at that time, because the consideration of systemic disadvantage was not yet part of her moral vocabulary and thus not a binding requirement. On the second question, what she should do about this month's applications, the relativist says she should follow her current framework, which means varying the rule to fund the equity candidate, since truth is indexed to the present framework for present action. On the third question, what she should say to Julian, the relativist advises her to say that the rule was right then but is wrong now, which generates a specific practical consequence: she should not issue an apology or offer restitution to the rejected candidate for past exclusions, because no moral truth was violated in the past. An objectivist, by contrast, holds that moral truths are mind-independent and temporally stable. On the first question, the objectivist says the original judgement was false, because the moral relevance of systemic disadvantage existed even if Eleanor failed to see it. On the second question, the objectivist agrees she should fund the equity candidate, because that is what objective morality requires now. On the third question, however, the objectivist insists she must tell Julian that the rule was wrong all along, which generates a different practical consequence: she owes a moral apology and perhaps some form of rectification to the community of past applicants because the foundation operated on an erroneous principle that caused injustice. The divergence is not merely verbal because it dictates whether she allocates remaining funds to a restorative project for past applicants or preserves them all for future grants; the objectivist demands restitution for past error, while the relativist denies the past was erroneous in its own context.

  The single feature doing the work here is the temporal location of the moral fact relative to the agent's epistemic access. If you take this out, for instance by stipulating that she could vary the deed at no cost to anyone and that no record of the justification is ever kept or queried, the verdicts converge on the immediate action of funding the equity candidate and the practical difference vanishes. The case relies on the fact that the justification she gives to Julian becomes an institutional act with resource implications, forcing the metaphysical status of the past into the present budget. Now hand the microphone to the objectivist to attack the case properly. The objectivist will argue that this is not moral disagreement between frameworks at all, but simply one person's prudential reasoning across time, because if Eleanor's change of mind is not driven by new information, it is merely a shift in preference or sentiment, which relativism mistakes for a shift in truth. They will claim that by calling the past rule true-relative-to-her-then, you are dressing up a change in taste as a change in world, and that this offers no guidance on whether she should feel regret, which is the real moral work. You must meet this by insisting that the change is in perceived relevance, not taste, but you might have to concede that if the relativist cannot explain why the past truth binds her less than the present truth without appealing to an objective notion of progress, the view collapses into objectivism about the present framework.

  I am reasonably confident in the construction of the scenario and the divergence on the issue of restitution, as this ties the metaphysical claim to a budgetary decision. However, I am least sure about whether the relativist can really say anything interesting in reply to the junior trustee without smuggling in an objective standard of framework progression. If the relativist says she should tell Julian the rule was right then, she risks implying she should not change it, but if she says she should change it because frameworks evolve, she sounds like an objectivist describing moral progress. That tension is where the students will likely press, and I suspect it is the weakest link in the chain, though it is also where the most productive seminar discussion will emerge. I hope this serves the purpose you have in mind.
