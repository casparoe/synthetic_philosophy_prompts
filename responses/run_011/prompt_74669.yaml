answer: |-
  You are struggling because you are trying to hold three competing theories of voting together: **Interest** (who is affected), **Capacity** (who can choose), and **Membership** (who belongs). Your intuitions switch between them depending on the case, which is why Nadia found the gaps.

  To make your position coherent without building a baroque theory with eleven patches, you need to prioritize one of these as the *gatekeeper* and use the others only as administrative constraints.

  Here is the cheapest, most coherent principle that captures about 90% of your verdicts, followed by the specific verdicts you must sacrifice to keep it.

  ### The Principle: Resident Adult Agency

  **Statement:** *Franchise belongs to all legal residents who have reached a statutory age of presumed capacity, on the basis of equal weight, without individual competence testing.*

  This principle keys on **Residency (Stake/Coercion)** as the primary gate, **Age (Status)** as the capacity proxy, and **Equality** as the constraint. It explicitly rejects Formal Citizenship and Individual Competence as criteria.

  **The Clauses and Your Cases:**

  1.  **The Residency Clause:** *You must live under the laws you vote on.*
      *   **Handles:** Long-term resident non-citizen (**Yes**), Tourist (**No**), Non-resident citizen (**No**).
      *   **Work Done:** This solves your "passport vs. taxes" contradiction. It grounds the vote in *subjection to coercion* and *stake in outcomes*, not formal membership. It explains why the non-resident citizen is out (no stake) and the resident non-citizen is in (high stake).

  2.  **The Status-Based Capacity Clause:** *Capacity is presumed via a fixed age threshold; it is not tested individually.*
      *   **Handles:** 16-year-olds (**Yes**, if threshold is 16), 14/13-year-olds (**No**), Informed 13-year-old (**No**), Dementia patient (**Yes**).
      *   **Work Done:** This resolves your "blunt instrument" contradiction. You are not being inconsistent by excluding the 13-year-old but including the dementia patient. This is the **Asymmetry of Rights**: Rights are hard to *acquire* (requires meeting the age threshold) but hard to *forfeit* (requires legal adjudication of incapacity, not just medical diagnosis). Using a blunt instrument to *grant* status is efficient; using it to *remove* status is tyrannical. This saves both verdicts without patching.

  3.  **The Equality Clause:** *One person, one vote. No weighting, no proxies.*
      *   **Handles:** Mill's plural voting (**No**), Demeny voting/parental proxies (**No**).
      *   **Work Done:** This rejects Nadia's argument. While children's *interests* are affected, voting is an exercise of *agency*, not just interest representation. Allowing parents to cast proxy votes violates the "One Person, One Vote" norm and treats children as property of the state/family rather than future agents. This aligns with your rejection of Mill.

  4.  **The Forfeiture Clause (The Weak Link):** *Franchise is suspended only by loss of residency or legal death.*
      *   **Handles:** Compulsory voting (**Yes**, duty of residents), Prisoners (**?**).
      *   **Work Done:** This forces the hard choice on prisoners (see below).

  ---

  ### Running the New Cases

  1.  **Long-term resident non-citizen in an Independence Referendum:**
      *   **Verdict:** **Yes, they vote.**
      *   **Reasoning:** Under the Residency Clause, they are subject to the outcome. An independence referendum creates the very state they reside in. Excluding them would be "taxation without representation" in its most extreme form. Your principle demands they have a say in whether the polity they live in continues to exist.

  2.  **Dual Citizen voting in both countries in the same year:**
      *   **Verdict:** **No, they vote only where they reside.**
      *   **Reasoning:** Your principle rejects the Non-Resident Citizen case. Passport status is irrelevant. If they live in Country A, they vote in A. If they hold a passport for Country B but don't live there, they do not vote in B. Voting in both is only permissible if they maintain dual residency (legally rare), but the *right* stems from residence, not the passport.

  3.  **Lowering age to 16 only with a Civics Quiz (not given to adults):**
      *   **Verdict:** **No.**
      *   **Reasoning:** This violates the Status-Based Capacity Clause. Once you introduce individual testing for one group, you open the door to competence tests for all. If the quiz is necessary for 16-year-olds to prove capacity, why is it not necessary for 45-year-olds with dementia or severe cognitive impairment? To protect the dementia patient from testing, you must protect the 16-year-old from it too.

  ---

  ### The Sacrifices: Which Verdicts Must Go?

  You asked for the cheap coherent principle, even if it costs you. Here is the bill.

  **1. You must enfranchise prisoners.**
  *   **Why:** This is the biggest cost. Your stance on the dementia patient ("no competence tests") treats voting as a **human right** attached to personhood/residency, not a reward for good behavior. Your stance on prisoners treats it as a **civic privilege** that can be forfeited. You cannot have both.
  *   **The Logic:** If you cannot strip a dementia patient of the vote because testing capacity is invasive and rights are sticky, you cannot strip a prisoner of the vote because "moral capacity" is even harder to test. Incarceration restricts movement, not agency. If you keep the "No Competence Test" commitment (which protects your neighbor), you must let prisoners vote.
  *   **Action:** Drop the "Prisoners: No" verdict.

  **2. You must firmly reject Demeny Voting (Parental Proxies).**
  *   **Why:** You are already wobbling here. Nadia's argument (Interest) is strong, but your rejection of Mill (Education/Plural Voting) commits you to **Agency**.
  *   **The Logic:** If you accept Demeny voting because children's interests are affected, you must accept Mill's plural voting because educated adults' interests are *better* served by informed choices. Both weight votes based on a quality (parenthood/education). Since you find Mill "flatly unjust," you must reject Demeny on the same grounds: it violates political equality.
  *   **Action:** Stop flip-flopping. The answer is No.

  **3. You must accept that the 13-year-old exclusion is purely arbitrary.**
  *   **Why:** You want a reason why 16 is okay and 14 is not.
  *   **The Logic:** Under "Resident Adult Agency," the line *is* arbitrary. It is a coordination convention, like the driving age. There is no moral difference between a mature 15-year-old and an immature 16-year-old.
  *   **Action:** Accept Nadia's point that the line is arbitrary, but defend it as *administratively necessary*. You don't need a moral story for 16 vs 14, only a pragmatic one.

  ### Summary of the Coherent Position

  If you adopt **Resident Adult Agency**, your position becomes:

  *   **Who votes:** Everyone who lives here and is 16+.
  *   **Who doesn't:** Tourists, non-resident citizens, children under 16.
  *   **Conditions:** No tests, no proxies, no plural voting.
  *   **The Cost:** Prisoners vote.

  This saves your dementia case, your resident non-citizen case, and your rejection of Mill. It forces you to concede on prisoners, which is the price of treating voting as a right rather than a reward. That is the coherent trade.
