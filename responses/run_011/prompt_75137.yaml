answer: |-
  | Desideratum | Requirement | Motivation (Case/Design) | Failure Signature |
  | :--- | :--- | :--- | :--- |
  | **1. Variance vs. Origin [NN]** | Distinguish variance partitioning from trait composition in individuals. | Press release claims "62% of readiness comes from genes." | Phrasing: "Percent of trait" or "genetically determined." |
  | **2. Environmental Specificity [NN]** | Restrict validity to the sampled environmental range. | Estimates rise as environments equalize (e.g., uniform schooling). | Generalizing $h^2$ to populations with different environmental variance. |
  | **3. Within vs. Between [NN]** | Deny inference from within-population variance to between-group means. | High $h^2$ within groups is compatible with zero genetic contribution to group gaps. | Using $h^2$ to explain class or racial score gaps. |
  | **4. Intervention Portability [NN]** | Withhold license to predict outcomes of environmental manipulation. | PKU is highly heritable yet eliminated by diet (env change). | Claims that high $h^2$ renders intervention futile. |
  | **5. GxE & Correlation [Camp]** | Specify if $h^2$ absorbs gene-environment correlation (rGE) or interaction (GxE). | Twins reared together share environments correlated with parental genes. | Ignoring "equal environments assumption" or passive rGE. |

  **Tensions:** Desiderata 2 (Specificity) and 4 (Portability) cannot be jointly satisfied by observational data. An estimate derived cheaply from existing variance (D2) lacks the causal structure required to predict responses to novel interventions (D4). Editors must choose between a descriptive statistic bound to its context or a causal claim requiring experimental validation.

  **Primary Exclusion:** Desideratum 1 (Variance vs. Origin) excludes the most candidates. It immediately invalidates the press release's core claim ("62% of a child's readiness comes from their genes"), which conflates population variance with individual etiology.

  **Scoring of Readings:**
  *   **Proportion-of-trait:** Fails D1. Treats variance ratio as trait composition. Invalid for any scientific purpose; licenses genetic determinism.
  *   **Variance-partition:** Passes D1–D3. Fails D4 if used causally. The standard biometric view; accurate descriptively but silent on policy.
  *   **Interventionist:** Fails D4 unless experimental. Promises causal leverage observational data cannot support. High risk of policy error.
  *   **Deflationary:** Passes all. Treats $h^2$ as a descriptive statistic only. Safest but scientifically sterile; excludes useful heuristic inferences.
