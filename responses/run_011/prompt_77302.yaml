answer: |-
  The definitive test is the **Conditional Preference Principle**, which classifies a regularity as a Lewisian convention only if your reason to comply disappears when others stop complying, distinguishing it from norms where moral obligation persists regardless of others' actions.

  ### The Principle: Conditional Preference
  A behavioral regularity $R$ among population $P$ is a convention if and only if:

  1.  **Regularity:** Almost everyone conforms to $R$.
  2.  **Expectation:** Everyone expects everyone else to conform to $R$.
  3.  **Conditional Preference:** Everyone prefers to conform to $R$ *on the condition* that others conform, and prefers to deviate *on the condition* that others deviate.
  4.  **Arbitrariness:** There is at least one alternative regularity $R'$ that could have solved the coordination problem equally well.
  5.  **Common Knowledge:** Conditions 1–4 are known by everyone, known to be known, and so on.

  ### Clause-by-Clause Mapping
  *   **Clause 1 (Regularity)** handles **QWERTY** and **Driving**: It establishes that these are actual behaviors, not just ideals.
  *   **Clause 2 (Expectation)** handles **Escalators**: You stand on the right because you expect others to stand on the left (or right, depending on city), not because of a sign.
  *   **Clause 3 (Conditional Preference)** is the critical filter that separates **Driving** from **Tipping**: If everyone else drove on the left, you would prefer to drive on the left (to avoid crashing); if everyone else stopped tipping, many would still prefer to tip (due to fairness), failing the test for convention.
  *   **Clause 4 (Arbitrariness)** handles **Sweden** and **QWERTY**: It confirms that driving on the left (Sweden's old way) or Dvorak (QWERTY's alternative) would have worked fine, proving the current state isn't naturally necessitated.
  *   **Clause 5 (Common Knowledge)** handles **Singular "They"**: It explains why the shift is sticky; everyone knows everyone is adopting it to coordinate on respect and clarity, making it common knowledge that deviation causes friction.

  ### Verdicts on Your Cases
  *   **Driving on the right:** **Convention.** It passes Clause 3; you would switch sides if everyone else did to avoid death. The moral blame exists because the coordination failure is catastrophic, not because it is a moral norm independent of coordination.
  *   **Escalator standing:** **Convention.** Pure coordination; no moral weight attached to standing on the "wrong" side other than inefficiency or annoyance.
  *   **QWERTY:** **Convention.** It passes Clause 4; it is arbitrary and locked in by network effects. It remains a coordination problem because switching alone is costly, but switching together is beneficial.
  *   **Tipping 20%:** **Norm.** It fails Clause 3 for many people; if everyone else stopped tipping, you might still feel morally obliged to tip to ensure the server is paid, meaning your preference isn't purely conditional on others' compliance.
  *   **Sweden's Traffic Flip:** **Convention.** The origin (decree) is irrelevant; the current state is self-sustaining via Clause 3. You drive on the right now because others do, not because the 1967 decree is still being enforced.
  *   **Singular "They":** **Convention.** It passes Clause 4 (alternatives like "he/she" or neopronouns exist) and Clause 3 (you use it to coordinate on social understanding). The moral arguments are *enforcement mechanisms* for the convention, not proof that it isn't one; language is the paradigmatic Lewisian convention, and this is a linguistic shift.

  ### Verdicts on New Cases
  *   **League's Offsides Rule:** **Constitutive Rule, not Convention.** It fails Clause 4; there is no alternative "offsides" that solves a pre-existing coordination problem. The rule defines the game itself; without it, you are not playing soccer. You follow it because the authority defines the activity, not because you are coordinating with other players independently of the rule.
  *   **Word Order in a Sentence:** **Convention.** This is the textbook case. Subject-Verb-Object (English) vs. Subject-Object-Verb (Japanese) is arbitrary (Clause 4) and persists solely because everyone expects everyone else to use it (Clause 2 & 3).
  *   **Newsroom Headlines (Present Tense):** **Professional Convention.** It passes Clause 4 (past tense works fine) and Clause 3 (you do it because readers expect it and other papers do it). It is often codified in style guides, but those guides merely formalize an existing industry-wide coordination equilibrium.

  ### Where Your Gut Calls Are Wrong
  1.  **Driving vs. Tipping:** You are wrong to think moral blame disqualifies Driving as a convention. Conventions often acquire moral force when the cost of coordination failure is high (death vs. unpaid wages). The test is not the *presence* of blame, but the *source* of your preference: you drive on the right to avoid crashing (coordination), you tip to be fair (morality).
  2.  **Sweden's Decree:** You are wrong to worry about the origin. Lewis explicitly allows for conventions to be established by authority if they become self-sustaining equilibria. Once the decree was lifted, if people reverted, it wasn't a convention; because they stayed, it became one.
  3.  **Singular "They":** You are wrong to hesitate based on the moral framing. All linguistic conventions are enforced by social norms. The fact that people argue morally about it doesn't change the structural fact that it is an arbitrary signal adopted for mutual understanding. It is a convention *backed* by a norm, but structurally, it is a convention.
