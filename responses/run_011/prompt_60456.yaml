answer: |-
  ### Verdict on the Sister's Course
  **D says: Clueless.**

  Her argument ("I can't construct a story where it makes the world worse") will not move him. He already classified *having a kid* as clueless, despite most parents having a strong positive valence intuition and lacking a specific "net-negative" story. Her lack of metrics ("can't tell you how many people finish") puts this in the same bucket as the malaria and cataract charities: you are injecting resources into a system (the internet/education market) and relying on a model for the outcome, rather than observing the outcome directly.

  ***

  ### Candidate Rules & Rule-Space Analysis

  Here are the three surviving families of rules that fit the seven prior verdicts, ranked by plausibility.

  #### 1. The Proximate Observation Rule (Epistemic)
  *   **The Rule:** An act is "not clueless" if and only if the agent can directly perceive the causal link between the act and the primary intended good without relying on a statistical model or institutional proxy.
  *   **Fits the Track Record:**
      *   **Bus/Soup/Jump:** You see the body stop, the bowl get eaten, the engine turn over. The causal chain is short and sensorily verified.
      *   **Charities/Kid/Politics:** You write a check or make a choice, then hand off the causal work to a system (NGO, biology, legislature). You do not see the surgery, the child's adulthood, or the law's enforcement.
      *   **Shelter vs. Cataract:** This resolves the tension. Both use NGOs. But at the shelter, D is *there*. He ladles; they eat. At the cataract fund, he wires money; the surgery and economic reintegration happen elsewhere, unseen.
  *   **Prediction for Sister:** **Clueless.** She uploads files. She does not see the students, their comprehension, or their application of the stats.
  *   **Ontology vs. Evidence:** **Fact about D's Evidence.** This rule admits the world might be deterministic, but claims *D* is clueless because his access to the truth is mediated by models rather than perception.

  #### 2. The Causal Topology Rule (Structural/Ontological)
  *   **The Rule:** An act is "not clueless" if the causal mechanism runs through specific physical interactions between individuals, rather than through abstract systems (markets, demography, legislation).
  *   **Fits the Track Record:**
      *   **Bus/Soup/Jump:** Physics and biology. Direct transfer of energy or calories.
      *   **Charities/Kid/Politics:** These rely on *multipliers*. Malaria/Cataract rely on economic productivity ("back at work"). Kids rely on demography. Ballot measures rely on legal systems.
      *   **Shelter vs. Cataract:** Shelter is caloric intake (biological). Cataract is labor market re-entry (economic). D treats biological immediacy as knowable and economic systemicity as clueless.
  *   **Prediction for Sister:** **Clueless.** The mechanism is information propagation through a digital network (a market/system), not a specific physical intervention on a specific body.
  *   **Ontology vs. Evidence:** **Fact about the Decision.** This rule claims the *world* is different in these cases. Systemic causal chains are inherently more chaotic/complex than physical ones, regardless of D's evidence.

  #### 3. The Valence Stability Rule (Epistemic/EV)
  *   **The Rule:** An act is "clueless" if the sign of the net utility (positive/negative) cannot be assigned with high confidence over a long horizon, specifically because of "swamping" tail risks.
  *   **Fits the Track Record:**
      *   **Bus/Soup/Jump:** Immediate good is so large and localized that long-run tails (the saved guy becomes a dictator) are dismissed as negligible probability mass.
      *   **Kid/Politics:** The variance is too high; the "tail" *is* the decision.
      *   **Shelter vs. Cataract:** (Weakest fit). Requires arguing that "hunger relief" has more stable valence than "sight restoration + work." Plausible if D views economic intervention as having higher variance of unintended consequences (e.g., labor market distortion) than basic relief.
  *   **Prediction for Sister:** **Clueless.** Even if she claims no net-negative story, D (given the Kid verdict) knows that "nil model of downstream effects" means she cannot rule out swamping tails (e.g., bad actors using stats for manipulation).
  *   **Ontology vs. Evidence:** **Fact about D's Evidence.** It's about his ability to price the risk, not the risk's existence.

  ***

  ### Which Rule Is He Running?

  **Best Guess: The Proximate Observation Rule (Candidate 1).**

  **Why:**
  1.  **The Bus Concession:** D grants that long-run effects exist for the bus case ("in principle... descendants... vote"). If he were running *Causal Topology* (Candidate 2), he would have to argue the bus case *doesn't* have systemic effects. He doesn't; he just says "you know exactly what you did there." That is a claim about *knowledge*, not causal structure.
  2.  **Shelter vs. Cataract:** This is the kill-shot for *Causal Topology*. Both are NGOs. Both aim to help people. The only material difference is D's physical presence. If it were about markets vs. individuals, the Shelter (often a gateway to other services/systems) might look more systemic. But D treats it as "not clueless" because he *sees* the soup.
  3.  **Collapse of "Plain Swamping":** The "plain long-run swamping" argument collapses into the Epistemic view. Since D admits swamping applies to the bus case but rejects the "clueless" label there, "swamping" cannot be the sufficient condition. It is only a condition *when combined with* lack of proximate evidence.

  **Ontology/Epistemology Fork:**
  D is firmly on the **Epistemic** side ("Fact about D's evidence").
  *   *Proof:* The Bus Case. If cluelessness were ontological (a fact about the decision's inherent unpredictability), the bus case would be clueless. The future *is* chaotic. D's exemption of the bus case proves "clueless" is a label for *his access to the causal chain*, not the chain itself.

  ***

  ### The Splitter Case

  To split the two leading candidates (**Proximate Observation** vs. **Causal Topology**), you need a case where D has direct observation of the act, but the mechanism is clearly systemic/demographic.

  **The Case:**
  > D tutors a neighbor's child in math for one hour, free of charge. He sees the kid understand the concept ("the lightbulb moment"). He knows this improves the kid's grades. He knows grades affect college, which affects career, which affects demography/economy.

  **The Split:**
  *   **Proximate Observation Rule predicts: Not Clueless.**
      *   *Why:* D sees the learning happen. The link between "tutoring" and "understanding" is directly perceived, like the soup being eaten or the car starting. The systemic downstream effects are acknowledged (like the bus) but dismissed because the proximate good is verified.
  *   **Causal Topology Rule predicts: Clueless.**
      *   *Why:* The intended good is *education*, which functions through labor markets and social mobility systems (like the Cataract "back at work" claim). It is not mere caloric relief; it is an investment in human capital with systemic ripple effects. If D classified Cataract as clueless because it relies on economic reintegration, he must classify Tutoring as clueless for the same reason.

  **Why this works:** It isolates the "Institution/Market" variable from the "Own Eyes" variable. The Shelter case was confounded because soup is both "seen" and "biological." Tutoring is "seen" but "economic/demographic." If D says "Not Clueless," he cares about *seeing*. If he says "Clueless," he cares about *systems*.
