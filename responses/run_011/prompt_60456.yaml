prompt: |-
  ok so I've been keeping a running list of my friend D's calls on which decisions are "clueless" in the technical-ish sense we all absorbed from the long-run-ripple-effects literature, because I'm increasingly convinced he isn't runing one rule and I want to know which ones are live candidates.

  His verdicts so far:

  - $5k to one of the top-rated malaria charities: clueless.
  - $5k to a cataract-surgery fund, where the pitch is sight restored plus recipients back at work: clueless.
  - Yanking a stranger backwards off the curb out of the path of a bus: not clueless. He says you know exactly what you did there.
  - A Saturday ladling soup at the shelter three blocks from his apartment: not clueless.
  - Driving 20 minutes out of your way to give a stranger a jump: not clueless.
  - Having a kid, after years of being on the fence: clueless, obviously.
  - Putting money behind a ballot measure to legalize something: clueless.

  Note the tension I keep hitting him with: the standard argument is that any act has consequences running centuries forward that could swamp and reverse the intended effect, and if that were the whole rule the bus case would be clueless too, since the guy he yanks back goes on to have descendants and vote and so on. He grants that in principle and still says the bus case is different, so whatever he's actually running isn't just "there are long-run effects."

  New case. His sister wants to spend two years writing and recording a free public data-literacy / intro-statistics course, entirely herself — no grant, no NGO, no third-party cost-effectiveness spreadsheet, she just makes the videos and puts them online. Her model of the downstream effects is basically nil: she can't tell you how many people finish it or what they do afterward. But she also says she can't construct a single story where it makes the world worse, and that if you asked her for a probability that it's net-negative over 200 years she'd be making the number up out of thin air.

  What does he say? Then do the part I actually care about: lay out the candidate rules that fit all seven earlier calls, say what each predicts for the sister, give your best guess which one he's on and why. I want at least these families considered and kept or killed: causal chain runs through institutions, markets and demography vs. through particular individuals; the evidence for the effect comes from interested third parties vs. from your own eyes; your subjective EV is unstable once you add possibilities you can't put probabilities on; and plain long-run swamping. Flag which of them collapse into each other given this track record — the shelter case and the cataract fund case look like they're doing a lot of work here, since both go through an NGO but got opposite verdicts.

  And for each surviving rule, tell me whether cluelessness comes out as a fact about the decision or as a fact about D's evidence, because I think that's the real fork and I can't get him to say which side he's on.

  Last thing: name one more case I could put to him that would split the two leading candidates, and which way each candidate goes on it. No lit review please, I've read the lit, I want the rule-space.
