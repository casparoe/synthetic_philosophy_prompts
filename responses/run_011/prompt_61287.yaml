answer: |-
  ### Part 1: What to Keep and What to Drop

  You cannot operationalize the entire academic debate in 45 minutes. You need a triage tool, not a thesis. Here is what survives and what gets cut, with the accuracy costs stated plainly.

  **Keep:**
  1.  **The Complexity Metric (Tainter-lite):** Keep the idea that collapse is a *loss of complexity* (administration, literacy, trade networks), not just a change in style.
      *   *Cost:* You will miss nuances about *why* complexity was lost (energy, marginal returns), but you will catch the difference between a regime change and a systemic failure.
  2.  **The Living Descendant Veto:** Keep the ethical constraint. If a community identifies as continuous with the subject, "collapse" is a loaded term that implies extinction.
      *   *Cost:* This makes the term unusable for many Indigenous histories, even if the archaeological record shows a sharp break. This is a feature, not a bug, for your liability, but it creates historical asymmetry (you can say Rome collapsed, but not Maya).
  3.  **The Description/Causation Split:** Keep these separate. A society can collapse (description) without it being their fault (causation).
      *   *Cost:* None. This is pure risk mitigation.

  **Drop:**
  1.  **The Speed Requirement:** Drop "it happened fast." Archaeological "fast" is 50 years; documentary "fast" is a commercial break. You cannot verify speed in a script without numbers.
      *   *Cost:* You may allow "collapse" for slow declines that look sharp in narration.
  2.  **The Total Extinction Requirement:** Drop "everyone died." That never happens.
      *   *Cost:* You risk implying extinction if you don't pair "collapse" with qualifiers about survival.
  3.  **The 50-Year Rule:** Drop arbitrary time limits on recovery.
      *   *Cost:* You might label a "dip" as a collapse if the script claims it was permanent and you can't verify the rebound.

  ---

  ### Part 2: The 45-Minute Procedure (Description Track)

  Run these questions in order. If a script fails a "Hard Stop," you must issue a note. If it fails a "Flag," you need a substitute word.

  **Q1: The Continuity Check (Hard Stop)**
  *   **Question:** Does the script acknowledge a living community that traces identity to this society?
  *   **Pass Condition:** Script explicitly states "descendants live today" OR there is no known descendant community.
  *   **Fail Condition:** Script implies the people vanished/died out AND there is a known descendant community.
  *   **Action:** If Fail, you cannot use "Collapse" unqualified. You must use "Political Collapse" or "Dynastic Failure" and mandate an on-screen or narration note about continuity. If the writer refuses, pull the line.
  *   **Vagueness Protocol:** If the script says "the people disappeared," flag it. Demand specific phrasing: "the political structure dissolved" or "the cities were abandoned."

  **Q2: The Complexity Check (Flag)**
  *   **Question:** Does the script describe a loss of *systemic capacity* (writing, central administration, long-distance trade, monument building) or just a change in leadership/location?
  *   **Pass Condition:** Script mentions loss of literacy, cessation of state projects, or breakdown of trade networks.
  *   **Fail Condition:** Script describes only a change in capital city, a new king, or a shift in artistic style.
  *   **Action:** If Fail, ban "Collapse." Use "Transformation" or "Reorganization."
  *   **Vagueness Protocol:** If the script says "society fell apart," ask: "Did the government stop collecting taxes?" If yes, pass. If no, flag.

  **Q3: The Scale Check (Flag)**
  *   **Question:** Is the event described as system-wide or regional?
  *   **Pass Condition:** Script specifies the region (e.g., "Southern Lowlands," "Palace Centers") or implies the whole network.
  *   **Fail Condition:** Script implies the entire culture vanished everywhere because one city burned.
  *   **Action:** If Fail, force geographic qualification. "The Northern Cities collapsed" is okay; "The Civilization collapsed" is not.
  *   **Vagueness Protocol:** If the script says "the empire ended," check if peripheral regions are mentioned. If ignored, add a clause: "...though peripheral regions persisted."

  **Q4: The Permanence Check (Flag)**
  *   **Question:** Does the script imply this state never returned?
  *   **Pass Condition:** Script says "the system was never rebuilt" or "writing was lost for centuries."
  *   **Fail Condition:** Script describes a collapse that is immediately followed by a "renaissance" of the same system in the same episode.
  *   **Action:** If Fail, use "Crisis" or "Contraction."
  *   **Vagueness Protocol:** If the script says "they never recovered," accept it unless you know better. (You usually won't know better in 45 mins).

  ---

  ### Part 3: The Substitution Ladder

  When you ban "Collapse," pick the lowest rung that fits the evidence. Do not let writers pick; you assign based on the Q2 (Complexity) result.

  1.  **Transformation / Reorganization:** (Use when Q2 Fails). The system changed but kept complexity. *Example: Rome moving capital to Constantinople.*
  2.  **Contraction:** (Use when Q3 Fails). The system shrank but didn't vanish. *Example: A empire losing outer provinces.*
  3.  **Dynastic Failure / Elite Disintegration:** (Use when Q1 is a Hard Stop). The people stayed, the rulers fell. *Example: Classic Maya.*
  4.  **State Disintegration:** (Use when Q2 Passes but Q3 is vague). The government stopped working. *Example: Late Bronze Age Palaces.*
  5.  **Collapse:** (Use only when Q1, Q2, Q3, Q4 all Pass). Total loss of complexity, no immediate recovery, no living identity claim or identity claim addressed. *Example: Linear B Greece.*

  ---

  ### Part 4: The Causal Track (Separate Test)

  Run this parallel to the Description Track. A script can pass Description (it did collapse) and fail Causation (why it collapsed).

  **Q1: The Monocause Check**
  *   **Question:** Does the script attribute the collapse to a single factor (trees, drought, volcanoes)?
  *   **Pass:** Multiple factors listed (drought + war + trade failure).
  *   **Fail:** One silver bullet.
  *   **Note:** "Add at least two contributing factors. Systems rarely fail for one reason."

  **Q2: The Moral Check**
  *   **Question:** Does the script imply the society "chose" to fail or was "stupid"?
  *   **Pass:** Environmental or structural constraints acknowledged.
  *   **Fail:** "They refused to adapt," "They were wasteful."
  *   **Note:** "Remove moral judgment. Adaptation is not always possible."

  **Q3: The External Check**
  *   **Question:** Does the script account for outside actors (invasion, migration, global market shifts)?
  *   **Pass:** External pressures acknowledged.
  *   **Fail:** Society treated as a closed box.
  *   **Note:** "Acknowledge external pressures. Societies exist in networks."

  ---

  ### Part 5: Running the Cases

  **1. The Ninth-Century Southern Maya Lowlands**
  *   **Q1 (Continuity):** **Hard Stop.** Living descendants exist. Script implies "abandonment" which reads as "vanished."
  *   **Q2 (Complexity):** **Pass.** Monuments stopped, dynasties ended, cities emptied.
  *   **Q3 (Scale):** **Flag.** Southern Lowlands only. Northern Lowlands thrived.
  *   **Q4 (Permanence):** **Pass.** Those specific cities did not return to Classic status.
  *   **Verdict:** You cannot use "Maya Collapse" unqualified. You *can* use "Classic Political Collapse in the Southern Lowlands."
  *   **Substitute:** **Dynastic Failure** or **Elite Disintegration**.
  *   **Causal Track:** **Fail.** If the script blames drought alone or "mismanagement," flag it. Needs trade disruption + drought + warfare.

  **2. Rapa Nui (Easter Island)**
  *   **Q1 (Continuity):** **Hard Stop.** Rapa Nui people exist today.
  *   **Q2 (Complexity):** **Flag.** Statues stopped, but social organization persisted through the contact period.
  *   **Q3 (Scale):** **Pass.** Island-wide.
  *   **Q4 (Permanence):** **Fail.** Population crash was largely post-contact (disease/slaving), not pre-contact "ecocide."
  *   **Verdict:** **Block "Collapse."** The pre-contact narrative is currently contested as colonial myth-making.
  *   **Substitute:** **Ecological Contraction** (if focusing on trees) or **Social Reorganization**.
  *   **Causal Track:** **Hard Fail.** The "deforested themselves" narrative is the specific point of contention. Must include European contact impacts.

  **3. Late Bronze Age Eastern Mediterranean**
  *   **Q1 (Continuity):** **Pass.** No single continuous "Bronze Age" political identity exists today (Greece/Turkey/Egypt are successors, not continuations of the specific Palace states).
  *   **Q2 (Complexity):** **Pass.** Literacy lost (Linear B), palaces burned, trade halted.
  *   **Q3 (Scale):** **Pass.** International system failed across multiple polities.
  *   **Q4 (Permanence):** **Pass.** The Palace System did not return; Iron Age polities were different.
  *   **Verdict:** **Pass "Collapse."** This is the strongest fit for the term.
  *   **Substitute:** **Systemic Collapse**.
  *   **Causal Track:** **Pass/Fail.** Depends on script. If it blames "Sea Peoples" only, flag. Needs earthquake + drought + migration + systems failure.

  ---

  ### Part 6: The Answer You Won't Like (Maya)

  Here is the conflict: Your procedure validates the *archaeological reality* (the Southern Classic political system *did* disintegrate rapidly and permanently) but validates the *Adviser's concern* (the *people* did not vanish).

  **The Uncomfortable Answer:**
  Your procedure tells you that you **are allowed** to say "Collapse" regarding the Maya, *provided* you strictly bound it to "Political/Dynastic Collapse in the Southern Lowlands."

  **Why you won't like it:**
  You have been telling the Producer "We can't say collapse." This procedure says "You can, but you have to be surgically precise." This means you have to go back to the Maya Adviser and say: *"We are acknowledging the political collapse of the Classic dynasties, but we are explicitly narrating the continuity of the Maya people."*

  **Is this your call?**
  No. This is the one place the procedure must hand off.
  *   **Protocol:** If Q1 (Continuity) triggers a Hard Stop, and the Writer/Producer insists on using "Collapse" even with qualifiers, **you must escalate to the Senior Producer with the Adviser in the room.**
  *   **Reasoning:** You are a Standards Editor, not a Community Liaison. You can verify the history; you cannot verify the offense. If the Adviser says "This word hurts us even with qualifiers," the Adviser wins over the Archaeology. Your procedure gives you the ammo to explain *why* the history fits, but the ethical veto belongs to the community, not you.
  *   **Script Note:** "Archaeologically, 'Dynastic Collapse' is accurate. However, per Standards Protocol Q1, this requires sign-off from the Community Adviser. Do not lock until they approve the phrasing."

  ---

  ### Part 7: Limitations & Stress Test

  **Where this misfires:**
  1.  **The "Zombie" Society:** It will wave through a script about a society that "collapsed" but actually just moved underground (e.g., oral cultures replacing literate ones). You will count the loss of writing as complexity loss (correct technically), but miss the cultural resilience (incorrect culturally).
  2.  **The Slow Burn:** It will fail to catch "collapses" that take 150 years (too slow for Q4's "permanence" check in a narrative sense) but are still catastrophic.
  3.  **The Winner's Bias:** It relies on the script having data. If the script ignores the losers (non-elites), your Complexity Check (Q2) might pass because the *Palace* stopped working, even if the *peasants* were fine. You are auditing the narrative, not the history.

  **Which of your five clauses survive?**
  *   **Kept:** Loss of complexity (your Clause 1, refined), Scale (your Clause 3, refined), Continuity (your Clause 5, made a Hard Stop).
  *   **Thrown:** Speed (Clause 2) and 50-Year Rule (Clause 4). They are unverifiable in your timeframe and create false negatives.

  **Stress Test: The Aral Sea (Modern Episode)**
  *   **Does it travel?** **No.** It quietly stops working.
  *   **Why:**
      1.  **Intentionality:** The Aral Sea "collapse" was policy-driven, not systemic complexity failure in the Tainter sense.
      2.  **Continuity:** The people are still there, suffering. Calling it "collapse" implies a past-tense event, whereas this is an ongoing humanitarian crisis.
      3.  **Political Weaponization:** In modern contexts, "collapse" is a political accusation (e.g., "The administration collapsed"), not a historical descriptor.
  *   **Modification:** For modern episodes, swap "Collapse" for **"Humanitarian Catastrophe"** or **"Ecological Failure."** The procedure's Q1 (Continuity) becomes an automatic Hard Stop for "Collapse" in any post-1900 context where the population remains in situ. Do not use the historical checklist for modern politics; it will legitimize narratives that active participants will contest as propaganda.
