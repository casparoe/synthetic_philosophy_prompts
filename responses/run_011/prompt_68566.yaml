      *   **Student Background:** Just finished Personal Identity (Locke, Parfit) and Extended Mind (Clark & Chalmers). Two psych joint-honours (neuron-focused). No Hofstadter reading.
      *   **Deliverables:**
          1.  Dependency Structure (order of components + justification).
          2.  The Carrying Example (criteria, specific recommendation on Hofstadter's wife case).
          3.  Misconception Map (4 predicted + 1 new, prevention strategy).
          4.  Final Diagnostic Question.
          5.  Cut List (what to omit and why).

  2.  **Deconstruct the Topic (Hofstadter's Strange Loop/Distributed Self):**
      *   Core claim: The "I" is a pattern (a self-referential symbol system).
      *   Mechanism: Strange loops (tangled hierarchies, feedback).
      *   Implication: Patterns are substrate-neutral (can run on different hardware).
      *   Implication: Patterns can be partial/incomplete.
      *   Implication: Therefore, a self can exist partially in other brains who know the pattern well.
      *   Implication: Death is a fading of the pattern, not an instantaneous switch-off.

  3.  **Address Deliverable 1: Dependency Structure:**
      *   *User's Guess:* Pattern > Multiple Realization > Different Brains. This is sound.
      *   *The "Strange Loop" Question:* Can we skip the technical machinery of *how* the pattern works (the loop itself) in 30 mins?
      *   *Decision:* Yes, mostly. The *mechanism* of the loop is less important for the *distribution* claim than the *ontological status* of the self as a pattern. If the self is a pattern, it can be copied/shared. The "loop" explains why it feels like a self, but the "pattern" explains why it can be distributed. We need to mention it to distinguish from a static record, but we don't need to teach them how to build one.
      *   *Order:*
          1.  Ontology of Self (Pattern vs. Substance) -> Makes multiple realization possible.
          2.  Substrate Neutrality (Pattern vs. Medium) -> Makes cross-brain realization possible.
          3.  Fidelity/Resolution (Perfect vs. Partial Copy) -> Makes "degree of survival" possible.
          4.  The Loop (Dynamic vs. Static) -> Makes it a *living* self rather than a biography. (Keep this brief/integrated).

  4.  **Address Deliverable 2: The Carrying Example:**
      *   *Constraints:* No Teleporter/Fission (Parfit fatigue), No Melody/Language (too metaphorical), Must show degrees.
      *   *Hofstadter's Wife Case:* It's the canonical example. It risks emotional heaviness ("grief seminar").
      *   *Alternative:* A mentor/teacher? A fictional character?
      *   *Decision:* Use the Wife case *but* sanitize it. Frame it as "cognitive modeling" rather than "grief." The key is that you simulate their decision-making.
      *   *Better Alternative:* A "Master-Apprentice" or "Coach-Athlete" dynamic? Or a "Co-author" relationship?
      *   *Best Fit:* **The "Co-Pilot" or "Deep Collaborator" case.** Think of a long-term research partnership or a musical duo (not the melody itself, but the *decision making*).
      *   *Wait, reconsider:* The prompt asks specifically about Hofstadter's wife case. The user is worried about the emotional tone.
      *   *Verdict:* Use the wife case *only if* framed strictly as a cognitive simulation case. However, given the "tired first-years" and "last Friday" context, grief might be too heavy or distracting.
      *   *Pivot:* **The "Inside Joke" / "Shared Heuristic" Case.** Imagine a duo who finish each other's sentences not linguistically, but *reasoningly*. When one dies, the other still reasons *as they would have*.
      *   *Actually, the prompt asks me to tell them whether to use it.* I should advise *against* it as the primary example because of the emotional variance in the room, but use it as a *secondary* illustration of degree.
      *   *Primary Example:* **The "Software Emulation" or "Detailed Biography" analogy?** No, too abstract.
      *   *Primary Example:* **The "Mentor" Case.** You internalize a teacher's voice. When you solve a problem, you ask "What would X say?" If you do it well enough, the pattern of X is running on your hardware.
      *   *Criteria:* Must be cognitive, not just memorial. Must allow for low-res vs. high-res.
      *   *Selection:* **The "Internalized Coach/Teacher" Model.** It avoids the Parfit traps, avoids the "dead people are zombies" fear, and allows for degrees (novice student vs. doctoral advisee).

  5.  **Address Deliverable 3: Misconception Map:**
      *   (a) Extended Mind (Clark/Chalmers): EM is about tools/notebooks. Hofstadter is about *other brains*. Distinction: Coupling vs. Constitution/Replication.
      *   (b) Identity as Degree (Parfit): Parfit says *survival* is degree. Hofstadter says the *entity itself* is distributed. Distinction: Relation R vs. Pattern Instantiation.
      *   (c) Literal Survival (Ghosts): It's not spiritual. It's informational.
      *   (d) Eliminativism (Nothing is real): Patterns are real (like software).
      *   (e) *New Prediction:* **The "Neuron Reduction" Trap.** The psych students will say "But the pattern isn't real, only the neurons are." Need to head this off with the "Software/Hardware" distinction early.

  6.  **Address Deliverable 4: Final Diagnostic Question:**
