      *   Question: "If the pattern is distributed, where is the pain felt?" (Too metaphysical).
      *   Question: "Does the distributed self have interests?"
      *   *Best:* Focus on the *locus of agency*. "If your pattern is running in my head, and I make a decision using it, who made the decision?"

  7.  **Address Deliverable 5: Cut List:**
      *   What to cut? The technical definition of "strange loop" (tangled hierarchies). The Godel/escher stuff. The detailed neuroscience.
