answer: |-
  Your hypothesis is correct. The stalemate is not mathematical; it is axiological. You are suffering from **category error paralysis**. You are treating a normative choice about the *function* of ethical theory as if it were a technical problem waiting for a better representation theorem.

  Here is the diagnosis of why you are stuck, the specific fault lines beneath the math, and what would actually count as progress.

  ### 1. The Core Diagnosis: Ranking vs. Decision
  The fundamental split in your group is not between Discounters and Overtaking theorists. It is between those who believe ethics must provide a **complete ordering** (Decision Theory view) and those who believe ethics must provide a **sensitive ranking** (Axiological view).

  *   **The Economists/Decision Theorists (Camps 1 & 4):** They require completeness because they view ethics as an input to a choice function. If the theory says $A$ and $B$ are incomparable, the agent cannot maximize. To them, incomparability is a system failure. They are willing to sacrifice Strong Pareto (Camp 3) or introduce arbitrary parameters (Camps 1 & 4) to preserve the *machinery* of choice.
  *   **The Philosophers/Axiologists (Camp 2):** They prioritize the *truth conditions* of value. If the universe is infinite, it may be a brute fact that some worlds are incomparable. Forcing completeness introduces fiction (arbitrary ultrafilters or discount rates). They are willing to sacrifice decision-guidance to preserve moral sensitivity.

  **Why this stalls you:** You are debating which axioms to keep, but you haven't agreed on what the theory is *for*. If the goal is "guide action," Camp 1 wins by default (you need a number to maximize). If the goal is "describe value," Camp 2 wins by default (incomparability is honest). No theorem can settle this because it is a disagreement about the teleology of ethics, not the topology of utility streams.

  ### 2. The Anonymity Straw Man
  You are right to suspect the verbal issue around anonymity.
  *   **Infinite Anonymity** (invariance under *any* permutation) is indeed a straw man. Almost no one's moral intuition requires that shuffling an infinite number of generations leaves value unchanged.
  *   **Finite Anonymity** (swapping finitely many generations) is what people actually mean by "everyone counts equally."

  **However, fixing this doesn't solve the stalemate.** The Basu-Mitra impossibility result shows that even **Finite Anonymity + Strong Pareto + Representability (Completeness/Continuity)** is impossible. You cannot have a real-valued function that respects Pareto and treats generations equally, even with the weaker anonymity axiom.

  So, the disagreement isn't just about the definition of anonymity. It is about **Representability**.
  *   Camp 1 & 4 say: "We must have a real (or hyperreal) number to compare worlds."
  *   Camp 2 says: "We must respect Pareto and Anonymity, even if we can't generate a number."

  The math isn't hiding a solution; it is enforcing a trilemma. You must drop one: Pareto, Anonymity, or Representability. Your group is stuck because everyone wants all three.

  ### 3. The Empirical Proxy (Camp 5's Point)
  Camp 5 is not just dodging the bullet; they are pointing out that the target might be a mirage. There is a hidden empirical/modal disagreement driving the formal debate.

  *   **Temporal Infinity vs. Spatial Infinity:** The math for infinite *time* (generations) is different from infinite *space* (simultaneous people). Overtaking criteria work for time (limits); they don't work for space. If half your group is thinking about the far future and the other half is thinking about a spatially infinite multiverse, you are solving different problems.
  *   **Actual vs. Potential Infinity:** If the future is potentially infinite but probabilistically finite (non-zero chance of extinction), expected value calculations often converge without needing infinite aggregation axioms. If you assume *canonical* infinity (the universe *will* last forever), you force the paradox.
  *   **Infinitarian Paralysis:** If the world is already canonically infinite in value (Bostrom's scenario), standard aggregation breaks differently. Adding value doesn't change the sum.

  **The Proxy:** The formal debate is a proxy for a bet on cosmology.
  *   If you believe the future is finite (or effectively finite via discounting), Camp 1 is just an approximation of finite utilitarianism.
  *   If you believe the future is infinite, Camp 2 is the only honest description, but it yields paralysis.
  *   If you believe the multiverse is infinite, Camp 3/4 are attempts to rescue discrimination, but they rely on non-constructive math that has no physical grounding.

  Your group is stuck because you are doing normative ethics while implicitly disagreeing on the metaphysics of time and space.

  ### 4. Is There a Real Formal Question Left?
  **No.** The formal space is mapped. The impossibility theorems (Diamond, Basu-Mitra, Svensson) are robust. A new theorem will not settle this because the constraints are logical, not contingent.

  The only "formal" question that remains is **constructibility**.
  *   Camp 1 (Discounting) is constructive. You can compute it.
  *   Camp 3 (Banach) and Camp 4 (Hyperreal/Ultrafilters) are non-constructive. They rely on the Axiom of Choice. You cannot actually *find* the ultrafilter or the Banach limit; you can only prove it exists.

  If your group values **naturalized ethics** (ethics that can be implemented by physical agents), Camps 3 and 4 are dead on arrival, regardless of their normative appeal. They are mathematically existent but physically inaccessible. This is a methodological constraint, not a moral one, but it functions as a tie-breaker.

  ### 5. What Counts as Progress?
  Since the math cannot resolve the normative trade-off, progress requires **dissolving the demand for a unique solution**. Here are the three paths to unstalling your group:

  **Path A: Accept Incomparability (The Camp 2 Victory)**
  *   **Move:** Explicitly agree that completeness is not a requirement for moral truth.
  *   **Result:** You adopt Overtaking or Limit-of-Means. You accept that some choices are morally undefined.
  *   **Progress Condition:** The group stops looking for a "better" aggregation method and starts working on **decision rules under incomparability** (e.g., maximality, interval dominance). The question shifts from "Which world is better?" to "Which world is permissible?"

  **Path B: Accept Arbitrariness as Regularization (The Camp 1 Victory)**
  *   **Move:** Acknowledge that the discount rate (or ultrafilter) is not a "discovery" of moral truth but a **regularization parameter** required to make the problem solvable.
  *   **Analogy:** In machine learning, we add regularization terms to prevent overfitting. They are arbitrary but necessary for generalization. Discounting is the regularization term for infinite ethics.
  *   **Progress Condition:** The group stops trying to "defend" the discount rate morally and starts treating it as a **sensitivity parameter**. You analyze how decisions change as the parameter varies. If decisions are robust across a range of discount rates, you act. If not, you acknowledge moral uncertainty.

  **Path C: Shift to Finite Approximations (The Camp 5 Victory)**
  *   **Move:** Agree that "infinite ethics" is a limiting case that may not apply to the actual world.
  *   **Result:** You work on **long-termism under uncertainty** rather than infinite aggregation. You model the probability of extinction and the distribution of future population sizes.
  *   **Progress Condition:** The group abandons the "infinite stream" formalism entirely and switches to expected value over finite (but unbounded) horizons. This dissolves the mathematical paradoxes because the sums are finite, even if the expectation is over an infinite support.

  ### Summary
  Your hypothesis is right. The disagreement is normative commitment in mathematical drag.
  *   **The Formal Barrier:** Representability (Completeness) vs. Sensitivity (Pareto + Anonymity).
  *   **The Verbal Issue:** Anonymity is a red herring; Representability is the real constraint.
  *   **The Empirical Proxy:** Cosmological assumptions about the nature of infinity.

  **To move:** Stop trying to find the "correct" axiom. Pick a **goal** (Decision Guidance vs. Axiological Truth) and a **constraint** (Constructibility vs. Pure Existence). Once you fix those meta-parameters, the "correct" camp becomes obvious, and the stalemate breaks. If you cannot agree on the meta-parameters, you are not doing the same project, and no amount of reading will fix that.
