answer: |-
  The pattern you describe reveals a legal architecture that is not merely asymmetrical but bifurcated. It operates on distinct normative logics depending on the phase of the process (investigation vs. adjudication) and the identity of the actor (state vs. citizen). To reconstruct the implicit theory, we must distinguish between the logical necessities of the practice and the philosophical justifications often draped over it.

  ### I. Reconstruction of the Implicit Theory

  **The Strict Presuppositions**
  For this specific regime to function as described, the legal system must presuppose the following:

  1.  **Truth is Procedural, Not Absolute:** Truth-telling is not a universal moral duty enforceable by law, but a procedural obligation triggered by specific contexts. There is no general duty to tell the truth to the state; there is only a duty not to *corrupt* specific state functions.
  2.  **The Investigation is a Strategic Zone:** The pre-trial interrogation is conceptualized as a contest of wills or a strategic encounter, not a truth-seeking ritual. In this zone, the state is permitted to use psychological leverage (including deception) to overcome the suspect's natural incentive to conceal.
  3.  **Speech is a Waiver of Protection:** The right to silence is absolute, but the right to speak is conditional. By choosing to speak to the state, the citizen opts into a regulatory regime where falsehoods are treated as obstructions of justice rather than exercises of autonomy.
  4.  **The Courtroom is a Sanctified Zone:** Once the process moves to adjudication, the logic flips. The courtroom is defined as a collaborative truth-seeking environment (in theory), where the state's role shifts from hunter to minister of justice. Here, the integrity of the verdict supersedes the interest in conviction.

  **Accounts That Fit Well (But Are Not Strictly Required)**
  Several philosophical accounts explain *why* the system might be this way, but the system does not logically depend on any single one of them:

  *   **Forfeiture Theory:** This holds that by committing a crime (or becoming a suspect), one forfeits the right to be treated with full candor. *Critique:* The system applies these rules even to innocent suspects who are never charged. The practice fits forfeiture rhetoric, but does not require actual guilt to trigger the asymmetry.
  *   **Paternalistic Reliability:** This suggests police lie to get the truth because suspects are irrational or deceptive. *Critique:* This explains the police power but fails to explain why the prosecutor must *correct* lies that help their case. If reliability were the only goal, the prosecutor should let the lie stand if it secures a conviction of a guilty man.
  *   **Role Morality:** This suggests police have a duty to catch criminals and prosecutors a duty to ensure justice. *Critique:* This fits the division of labor but struggles to justify why the citizen's role morality forbids lying while the police role morality permits it.

  **The Core Theory: Adversarial Instrumentalism**
  The practice strictly presupposes **Adversarial Instrumentalism**. In the investigation, the state is an instrument of crime control permitted to use tactical means to extract information from a hostile source. In the adjudication, the state is a guardian of procedural legitimacy. The suspect is treated as a *source* in the first phase (where deception extracts the resource) and a *participant* in the second (where deception corrupts the process). The duty to tell the truth is not owed to the *person* (the suspect or the officer) but to the *function* (investigation vs. verdict).

  ---

  ### II. Further Questions

  #### 1. The Kantian Reversal
  Your intuition regarding Kant and Constant is precise. The American interrogation room is indeed a structural reversal of Kant's "murderer at the door" example, but with a twist that makes Kantian endorsement impossible.

  In Kant's 1797 essay, the householder (private citizen) is forbidden from lying to the murderer (wrongful questioner) because lying violates a duty to oneself (moral integrity) and to humanity (the condition of communication). The murderer has no *right* to the truth, but the householder has a *duty* to speak it.

  In the interrogation room:
  *   **The State** occupies the position of the questioner. Unlike Kant's murderer, the State has lawful authority to question. Yet, unlike Kant's householder, the State is *permitted* to lie.
  *   **The Suspect** occupies the position of the answerer. Like Kant's householder, they are asked to disclose information. Unlike the householder, they are *forbidden* to lie (if they speak), yet they are also under no duty to speak at all.

  **Can a Kantian endorse this?**
  No. A strict Kantian cannot coherently endorse the legal asymmetry.
  *   **Against the State:** Kant argues that a lie "wrong[s] humanity as such." If the state lies to a suspect, it undermines the very possibility of trust required for law to function. For Kant, the state cannot claim a "greater good" exception to the categorical imperative.
  *   **Against the Suspect:** Kant would agree that the suspect cannot lie (as it violates the duty to oneself). However, Kant would also affirm the suspect's right to silence (as one has no duty to self-incriminate).
  *   **The Verdict:** The legal practice rests on a consequentialist calculation (lies by police solve crimes; lies by suspects obstruct justice). Kant's ethics are deontological. For Kant, the police lie is a moral crime regardless of the confession it yields. Therefore, the legal asymmetry has **no Kantian ground**. It requires a rejection of Kant's claim that truth-telling is an unconditional duty of communication.

  #### 2. Internal Consistency
  Is the system consistent? It holds that:
  1.  Silence is protected.
  2.  Lying is penalized (for the suspect).
  3.  State lying is permitted (in interrogation).
  4.  State truth-correction is required (in court).

  **The Principle of Bifurcation**
  There is no *single* principle explaining all four. There are **two principles in uneasy adjacency**:
  *   **Principle A (Investigation): Efficiency and Overcoming Resistance.** The goal is information acquisition. Silence is allowed because coercion is banned (5th Amendment), but lying is banned because it actively poisons the information stream. State deception is allowed because it is deemed necessary to overcome the suspect's incentive to conceal.
  *   **Principle B (Adjudication): Integrity of the Verdict.** The goal is legitimate judgment. Here, the state represents the public interest in *justice*, not just *conviction*. Hence, the prosecutor must correct falsehoods.

  **The Inconsistency:**
  The tension arises because evidence gathered under Principle A (via deception) is admitted under Principle B (the truth-seeking court). The system claims the courtroom is a truth-zone while admitting fruits obtained from a deception-zone.
  *   *Coherence Check:* The system is internally consistent *only if* one accepts that the "truth" sought in court is **procedural truth** (adherence to rules of evidence and testimony) rather than **moral truth** (universal veracity). If truth is merely a rule of the courtroom game, then lying outside the court (by police) is just "strategy," while lying inside the court is "cheating." This is a coherent, albeit cynical, consistency. It treats truth not as a moral absolute but as a jurisdictional boundary.

  #### 3. Implications of Theoretical Change
  If the presupposed theory (Adversarial Instrumentalism) were replaced, the practical consequences would vary radically depending on the replacement.

  **A. A Kantian Replacement**
  *   **Change:** Police deception would be banned as a violation of human dignity and the categorical imperative. Suspects would still be barred from lying (duty to self), but the penalty might shift from criminal (perjury/obstruction) to evidentiary (credibility loss).
  *   **Result:** Interrogations would become purely informational interviews. "False evidence ploys" would vanish. Confession rates might drop, but the moral legitimacy of the process would rise.
  *   **Juvenile Bans:** Under Kant, banning deception for juveniles would be insufficient. If lying to a suspect violates the duty to humanity, it violates it regardless of age. The juvenile ban would look like an **ad hoc concession**, failing to address the fundamental wrong done to the adult suspect.

  **B. A Straightforward Consequentialist Replacement**
  *   **Change:** Rules would depend entirely on empirical outcomes. If police lies produce false confessions more often than true ones, they are banned. If suspect lies rarely obstruct justice, they are decriminalized.
  *   **Result:** This is the most volatile framework. It might lead to *more* police deception if data suggests it works without causing false confessions, or *less* if the risk of error is high.
  *   **Juvenile Bans:** The recent bans on deceiving minors fit **perfectly** here. They are not based on the principle that children have a *right* to truth, but on the empirical finding that children are uniquely susceptible to coercion and more likely to confess falsely under deceptive pressure. This is a reliability safeguard, not a rights expansion. It confirms that the current system tolerates deception for adults because it assumes adults can withstand the "strategy," whereas children cannot.

  **C. An Adversarial/Relational Replacement**
  *   **Change:** Veracity is owed only in cooperative relationships. Since the interrogation is acknowledged as hostile/adversarial, *neither* party owes the other the truth.
  *   **Result:** False statements to police would be decriminalized (as "puffery" in a negotiation). Police deception would remain legal.
  *   **Juvenile Bans:** This would render juvenile bans incoherent. If the relationship is adversarial, the suspect's age shouldn't matter; both sides play hardball. The existence of the bans suggests the state does *not* view the relationship as purely adversarial, but rather as one of **custodial power**, where the state owes a higher duty of care to the vulnerable.

  **Conclusion on Juvenile Bans**
  The juvenile bans look like **risk management**, not principle. If the system presupposed that deception is inherently wrongful (Kantian), it would ban it for all. If it presupposed that deception is a legitimate tactical tool (Instrumentalist), it would allow it for all competent adversaries. By banning it only for minors, the system admits that the tactic is dangerous and coercive, but reserves the right to use it against adults. This confirms the underlying theory is **Instrumentalist**: truth is a resource to be managed, and children are deemed too fragile to be mined safely.
