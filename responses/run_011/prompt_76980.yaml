  2.  **Determine the Response Strategy:**
      *   **Acknowledge the Concession:** The user conceding crimes against peace is significant, but I need to show why it doesn't save the trial's legitimacy.
      *   **Maintain the Core Critique:** The issue isn't just *one* count; it's the structural integrity of the tribunal. If the charter is legislative act disguised as law, the whole foundation is suspect.
      *   **Address the "Rest of the Trial" Argument:** Even if war crimes were pre-existing, the *process* was tainted. The selective prosecution (only losers) undermines the claim of impartial justice.
      *   **Address *Tu Quoque*:** Clarify that it's not about "Allies were bad too" excusing Axis crimes, but about the *equality before law* principle. If the law applies only to one side, it's not law, it's vengeance.
      *   **Address Sovereignty vs. Legality:** Reject the false dichotomy. It's about the *source* of legal authority.
      *   **Tone:** Professional, sharp, legalistic, not emotional. Counsel-to-counsel.

  3.  **Drafting the Response (Internal Monologue/Trial):**
      *   *Okay, I need to push back on the idea that conceding Count One saves the trial.*
      *   *Point 1: The Charter wasn't just a procedural vehicle; it was the substantive source of authority. If Count One is void because it's ex post facto, it reveals the Charter itself as an instrument of policy, not pre-existing law.*
      *   *Point 2: Selective enforcement. You say Hague rules existed. True. But why only try the losers? If it's law, it applies to all. If it applies only to the defeated, it's political purge.*
      *   *Point 3: Tu quoque. It's not a moral defense for the defendant. It's a jurisdictional challenge. If the court claims universal jurisdiction over war crimes, it must acknowledge universal applicability. Ignoring Allied violations (Bombing of Dresden, etc.) shows the court isn't administering law, but enforcing victor's policy.*
      *   *Point 4: Sovereignty. It's not that states can't be judged. It's that individuals can't be judged by a court created by the opposing belligerents without neutral oversight.*

      *Refining for constraints (1-2 paragraphs):*
      *   Combine the structural critique with the *tu quoque* point.
      *   Keep it tight.

      *Draft:*
      Counsel, you treat the Charter like a menu where you can order around the counts and still have a valid meal. But the legal positivist objection isn't just about the specific statutory definition of aggressive war; it's about the source of authority itself. When you concede Count One was ex post facto legislation, you admit the Charter was not declaring existing law but making new law to fit the facts. That contaminates the well. If the tribunal's foundational document is legislative fiat disguised as judicial process on the primary charge of the indictment, the presumption of impartiality collapses for the remaining counts. You cannot separate the "void" counts from the "valid" ones when the bench's authority to sit in judgment flows from that same tainted source.

      On *tu quoque*, you misunderstand the legal point. It is not a moral equivalence argument suggesting Allied atrocities excuse Axis crimes. It is a principle of equality before the law. If the Hague Rules were truly binding law enforceable by this tribunal, they were binding on all belligerents. The deliberate exclusion of Allied conduct from scrutiny—not because it wasn't comparable, as the Dönitz evidence showed, but because the Charter forbade looking at it—demonstrates that this was not a court of law but a political commission. The issue isn't sovereignty; it's that a court composed exclusively of victors, barred from examining victor conduct, cannot administer universal legal principles. It administers vengeance with procedural decorum.

