      *   Is "Poisedness" too Dreyfus/Block? Keep it Dennettian. "Fame in the brain." Content becomes conscious when it wins the competition for influence.

  11. **Final Polish:** Ensure the tone is respectful but sharp ("be blunt"). Make sure the distinction between Orwellian (memory falsification) and Stalinesque (perceptual falsification) is clear, as that's the core of Color Phi.

