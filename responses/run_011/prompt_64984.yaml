      *   **Goal:** They want a unifying principle that delivers their desired verdicts (mostly), or a blunt critique if their framing is wrong. They specifically care about getting Libet and Change Blindness "right" (according to their intuition). They are open to dropping verdicts if the principle demands it. They want to know if they are smuggling in the Cartesian Theater.
      *   **Tone:** Philosophical, rigorous, blunt, pedagogical.

  2.  **Deconstruct the User's Verdicts:**
