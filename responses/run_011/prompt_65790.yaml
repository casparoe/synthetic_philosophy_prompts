answer: |-
  # Seminar Prep Sheet: Qualia as Reference Failure

  **Thesis Recap:** Qualia (classic sense) are incoherent not because experiences don't exist, but because the term fails to refer (unconstrained application conditions). Legitimate experience talk = discriminative dispositions + subject narrative.

  ---

  ### Part 1: The Objections, Replies, and Vulnerabilities

  **1. The "Strawman" Charge (Representationalists)**
  *   **Objection:** "You're attacking a notion of qualia as intrinsic, non-representational atoms that no serious naturalist defends. We take qualitative character to be transparent representational content. Your argument dissolves a problem we already solved by externalizing content. Why should we care about a reference failure in a framework we rejected twenty years ago?"
  *   **Reply:** "I agree the *ontology* of intrinsic atoms is dead. But the *intuition* driving representationalism relies on the stability of 'what it's like' to ground representation. If the application conditions for 'what it's like' are unconstrained (as per Chase/Sanborn), then the 'content' you're naturalizing lacks a fixed anchor. My argument isn't that you're wrong about representation, but that the phenomenological data you claim to be representing is semantically indeterminate."
  *   **Softest Point:** Risks sounding like you're shifting the goalposts from metaphysics to semantics. If they insist content is fixed by causal history, not phenomenology, this reply loses traction.

  **2. The "Psychophysics Settles It" Charge (Empiricist)**
  *   **Objection:** "You claim there's no fact about whether Chase's taste changed or his standards did. But psychophysics operationalizes 'taste' via discrimination thresholds and signal detection metrics. If his d-prime changes, the taste changed. If his criterion changes, his judgment changed. The literature gives us the answer you claim is missing."
  *   **Reply:** "Psychophysics measures *discriminative dispositions*, which I grant are real. But Chase and Sanborn aren't disagreeing about discrimination; they agree on the coffee. They are disagreeing about the *retrospective characterization* of the experience. Your data settles the behavior, but my argument is that the data underdetermines the phenomenal report. The 'fact' you point to is a behavioral fact, not the phenomenal fact the subjects are debating."
  *   **Softest Point:** Can sound anti-scientific. You must be careful not to imply psychophysics is useless, only that it doesn't touch the specific philosophical indeterminacy.

  **3. The "Timid Illusionism" Charge (Grad Students)**
  *   **Objection:** "If reference fails, why preserve the 'narrative'? If there's no fact of the matter, the subject's story is just a confabulation. You're keeping the folk psychology residue that Dennett and Frankish discard. Why not just call it an error theory and be done?"
  *   **Reply:** "Because the narrative has a functional role that error theory ignores. The story the subject builds regulates future attention and social coordination. Calling it an 'illusion' suggests it's a mistake to be corrected. I'm arguing it's a constructive practice to be maintained. We don't need the metaphysical residue of qualia to validate the pragmatic utility of the narrative."
  *   **Softest Point:** Distinguishing "constructive practice" from "illusion" is thin. If pressed on whether the narrative *itself* is experienced, you may be forced to admit a regress.

  **4. The "Phenomenal Concept" Defense (General)**
  *   **Objection:** "You're conflating the property with the concept. Even if our *concept* of a quale is vague or unstable, the *experience* itself is present. The reference failure is epistemic or conceptual, not ontological. The pain is still there even if the word 'pain' is slippery."
  *   **Reply:** "For classic qualia, the property *is* defined by how it is conceptualized (intrinsically, ineffably). If the conceptual application conditions are unconstrained, there is no remaining 'property' for the concept to track. Unlike 'water' (where reference is fixed by H2O even if the concept varies), the 'quale' has no external anchor. If the concept fails, the posit vanishes."
  *   **Softest Point:** Requires a strong commitment to the idea that qualia have no external anchor. Representationalists will deny this immediately.

  **5. The "Authority of the First-Person" Charge (General)**
  *   **Objection:** "If there's no fact about how it tasted, why do we treat the subject as authoritative? If I say 'I'm in pain,' and you say 'reference failure,' you're violating the basic norm of phenomenology. You're making the subject wrong about their own mind."
  *   **Reply:** "I'm not making them wrong; I'm saying the question they are answering is ill-formed. Authority attaches to the *report*, not the *referent*. We grant authority because the subject is the only one with access to the narrative construction process, not because they have infallible access to a private object."
  *   **Softest Point:** Risks alienating the room. Denying first-person authority is a high-cost move. Needs to be framed carefully as "authority over the story," not "authority over the fact."

  **6. The "Communication" Challenge (Linguistic/General)**
  *   **Objection:** "If reference is unconstrained, how do we communicate about experience at all? When I say 'red' and you say 'red,' we coordinate successfully. If there's no fixed fact, successful communication is a miracle."
  *   **Reply:** "We coordinate on *discriminative dispositions* and *public usage*, not private referents. We agree on which objects to call 'red' and how to react to them. The success of communication proves the stability of our public language games, not the stability of private qualia. The reference failure is internal to the philosophical posit, not the everyday term."
  *   **Softest Point:** Sounds like behaviorism. You need to ensure you aren't reducing meaning to mere stimulus-response.

  **7. The "Narrative Regress" (Deep Cut)**
  *   **Objection:** "You say experience is dispositions plus narrative. But the narrative is itself experienced. Do I not have a *quale* of telling the story? If so, haven't you just pushed the qualia problem back one step?"
  *   **Reply:** "The narrative is a public, linguistic act (even if internalized). It doesn't require a further 'experience' of the narrative to function. It's a disposition to speak. If you insist on an experience of the narrative, you're begging the question by assuming every mental act requires a qualitative glow."
  *   **Softest Point:** This is the hardest hit. If the audience feels that *thinking* the narrative has a phenomenology, your "no residue" claim looks false.

  **8. The "Existence vs. Reference" Distinction (Metaphysical)**
  *   **Objection:** "You insist this is a failure of reference, not existence. But if nothing refers, in what sense does it exist? This sounds like a verbal trick to avoid the hard bullet of eliminativism."
  *   **Reply:** "The *experience* exists as a biological/functional event. The *quale* (as a theoretical posit of an intrinsic, non-representational property) fails to refer. I'm saving the phenomenon (experience) while eliminating the theory (qualia). Eliminativism throws out the phenomenon; I'm keeping the phenomenon but denying it supports the theoretical weight."
  *   **Softest Point:** The line between "experience as biological event" and "quale" is exactly what the Representationalists will attack.

  ---

  ### Part 2: Strategic Ranking & Damage Control

  **Ranking by Damage (If Fumbled)**
  1.  **The "Strawman" Charge (Rep Faculty):** If they decide you are arguing against a dead horse, the paper becomes irrelevant.
  2.  **The "Psychophysics" Charge (Empiricist):** If they decide empirical data settles the indeterminacy, your core Chase/Sanborn argument collapses.
  3.  **The "Narrative Regress" (Grad/General):** If the positive view (narrative) is shown to rely on qualia, the constructive part of your thesis fails.
  4.  **The "Existence vs. Reference" Distinction:** If this isn't clear, you will be misclassified as a standard eliminativist, which you explicitly want to avoid.
  5.  **The "Authority" Charge:** High emotional cost, but less likely to derail the logic.
  6.  **The "Communication" Challenge:** Manageable with standard language-game moves.
  7.  **The "Phenomenal Concept" Defense:** Standard move, easy to parry if you hold the line on external anchors.
  8.  **The "Timid Illusionism" Charge:** Mostly terminological.

  **Concessions for the First 5 Minutes (Defusing Strategy)**
  *   **To the Representationalists:** Concede immediately that "intrinsic, non-representational atoms" are not a viable ontology. State clearly: "I am not arguing that experience is non-representational. I am arguing that the *stability* required to ground *any* talk of qualitative character (representational or otherwise) is missing in the way philosophers assume."
  *   **To the Empiricist:** Concede that discrimination thresholds are real, measurable, and scientifically valid. State: "I do not dispute the psychophysics. I dispute the *interpretation* of that data as settling the question of phenomenal identity."
  *   **To the Room:** Concede that "something it is like" exists in a deflationary sense. You are not denying consciousness; you are denying the *theoretical utility* of the specific posit "qualia."

  **The Single Reply That Must Land**
  *   **The Distinction between Discrimination and Characterization.**
      *   *Why:* This addresses the Empiricist (who thinks data settles it) and the Representationalist (who thinks content settles it).
      *   *The Line:* "Discrimination is a capacity; Characterization is a judgment. Chase and Sanborn have the same capacity (discrimination) but offer incompatible characterizations. Science measures the capacity; Philosophy worries about the truth of the characterization. My claim is that the characterization lacks truth conditions. If you miss this, you will think I'm denying the science."

  **The Question I Am Hoping Nobody Asks**
  *   **"What is the ontological status of the narrative itself?"**
      *   *Why:* If the narrative is a physical/functional process, fine. But if the narrative is *experienced*, does it have qualia? If yes, you haven't eliminated qualia, you've just relocated them. If no, you are claiming there is thinking without phenomenology, which is a massive controversial claim in philosophy of mind that might derail the seminar into a debate about cognitive phenomenology rather than your core thesis.
