      *   *Frankfurtian:* Focuses on care, identification, and volitional structures. Might challenge the notion of "choice" or "freedom" involved. Is it really a choice if it's a project?
      *   *Sartre Specialist (Heideggerian):* Will think the ontology is sanitized. Might argue that removing the ontological tension (being-for-itself vs. being-in-itself) makes it too psychological/pragmatic.
      *   *General Moral Psychology:* Responsibility conditions. Is "radical freedom" too strong a requirement for moral responsibility?

