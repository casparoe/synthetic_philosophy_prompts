      *   *Role of Freedom:* Radical freedom is necessary for responsibility (choosing situation in strong sense).
      *   *Cases:* Café waiter, Woman with hand (failure to notice).
      *   *Contrast:* Against static belief-state models (often associated with analytic self-deception literature).

