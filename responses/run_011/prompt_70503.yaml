  The committee will award the prize to B.

  This verdict relies primarily on the 2019 precedent, which establishes that a discovery requires the author to "stand behind" it in a form the field can use. Claimant A's seminar, while containing the pivotal reformulation, lacks a permanent public record and A has explicitly declined the monetary award, echoing the 2019 notebook author who "did not believe it and never wrote it up." The committee treats the seminar as a private communication similar to the notebook, insufficient to establish priority over a published, working method. Claimant C is eliminated by the utility clause of 2019 ("prize exists to mark what a field could actually use") and the 2017 distinction between a "complete account" and weaker confirmation; C's uncited, weaker data fails the utility test despite the earlier timestamp. The strong inevitability evidence does not trigger a withholding because the 2022 precedent explicitly rules that a result being "coming" does not make it "unowned," provided a single laureate can be identified who delivered the usable method. B is the only claimant who satisfies the triad of public record, authorial commitment, and field utility.

  Three candidate rules fit all five precedents equally well but yield different predictions for this case:

  1.  **The Validated Enablement Rule:** Priority goes to the earliest public disclosure that enables the field to proceed, provided the author validates it. (Fits 2017 preprint, 2019 publisher, 2014 student experiment, 2011 both papers, 2022 single paper). **Prediction:** B wins. A's seminar is not a validated public disclosure (2019); C's paper did not enable the field (2019 utility clause).
  2.  **The Intellectual Provenance Rule:** Priority tracks the source of the pivotal idea, provided the author is willing to claim it. (Fits 2014 student thought, 2017 preprint idea, 2011 independent paths, 2022 laureate insight). 2019 fits because the notebook author declined to claim it. **Prediction:** A wins. A supplied the reformulation (2014) and is willing to claim acknowledgment, distinguishing her from the 2019 notebook author.
  3.  **The Strict Chronology Rule:** Priority goes to the earliest public timestamp of a functionally equivalent result. (Fits 2017 preprint date, 2019 publication date, 2011 simultaneity, 2022 publication date). 2014 fits if the student's contribution is dated to the paper submission. **Prediction:** C wins. C published eleven days before B, establishing the earliest public timestamp for the method.

  The closest analog is the 2019 ruling (private notebook vs. public publisher). The analogy breaks on the nature of communication: the 2019 author mentioned the result to only two colleagues and did not believe it, whereas A presented to a department and seeks acknowledgment. However, the committee is likely to treat an unrecorded seminar as functionally equivalent to a private notebook due to the lack of a verifiable, permanent record, prioritizing the stability of the scientific record (2019) over the nuance of semi-public communication.

  If the precedents underdetermine the outcome, the committee's choice will adopt one of the following doctrines for the next decade:
  *   **Awarding A** establishes that **ideas supersede records**. This would encourage researchers to seek informal priority through talks and emails, potentially increasing disputes over hearsay and witness testimony.
