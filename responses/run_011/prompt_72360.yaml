  1. **(a)** If you disown the person-affecting reading, what subject remains to hold the betterness of never existing?
  **Answer:** It is better *simpliciter*, grounded in eligible counts rather than welfare subjects.
  **Follow-up:** Without a subject, doesn't "better" collapse into mere description?

  2. **(b)** Critics argue you merely relocate the shift between impersonal and person-affecting standpoints inside your notion of eligibility. How is this not terminological sleight of hand?
  **Answer:** Eligibility is a consistent meta-ethical filter applied beforehand, not a shift within valuation.
  **Follow-up:** If the filter is tailored to match anti-natalist intuitions, isn't the bias preserved rather than resolved?

  3. **(c)** Does this asymmetry yield a prohibition on all procreation or only above an expected-harm threshold, and what determines that limit?
  **Answer:** It forbids all, because any pain counts impersonally while absent pleasure requires a subject.
  **Follow-up:** Why does a trivial eligible pain outweigh substantial actual joy experienced by the living?

  4. **(d)** Consider the last generation conceiving one contented child who leaves no descendants. Is this wrong on your view?
  **Answer:** Yes, because the child's pain counts impersonally regardless of future generations.
  **Follow-up:** If no one is deprived and no future exists, what impersonal value is served by preventing that isolated instance of pain?

  5. If the presence of pain counts against a state of affairs without a bearer, why doesn't the absence of pain in non-existence count as an impersonal good?
  **Answer:** Because absence of pain is only good if someone is there to enjoy it.
  **Follow-up:** Then why does the presence of pain count without someone to bear it?

  6. You describe the asymmetry as about what is eligible to enter deliberation. Who is the deliberator when no one exists to be affected?
  **Answer:** Potential parents deliberating on bringing someone into being.
  **Follow-up:** If the non-existent cannot be beneficiaries, why are parents obligated to this impersonal calculus?

  Question two is most likely to extract a concession regarding the arbitrariness of the eligibility filter.
