prompt: |-
  I've worked in bars and kitchens since I was 17 and I've moved something like nine times, three of them to different countries, so the rules on tipping and queuing and crossing the street have changed on me more times than I can count. In one place if you don't leave 20% you've basically stolen from the waiter; two borders over, leaving money on the table is kind of an insult and the waiter's on a real wage. In one town I got dirty looks for crossing on red with an empty street; in the one I grew up in everybody does it and waiting for the light is what tourists do. I spent a long time thinking about why I actually felt bad doing the thing, not just scared of getting yelled at, and I came up with an argument. It felt airtight for like a year and now I think it proves way too much and I can't find where it breaks.

  1. Take any of these — the tip, which side of the door you stand on, whether you cross against the light. There's nothing in the act itself that makes it good or bad. Which one you pick is a coin flip.
  2. But once enough people in a place do it and count on other people doing it, breaking it costs them. They planned around you, they lose time or money, or they just feel like the place has stopped working.
  3. Costing people like that, for no reason, is wrong.
  4. So the wrongness is coming entirely from the fact that the people around you have settled on expecting it. Nothing else is doing any work.
  5. So what's wrong for you is set by wherever you happen to be standing. Same act, wrong here, fine there — and that's not a bug, that's the whole point. (This is the step that felt really right. This is why I felt like a jerk jaywalking in a town where nobody does.)
  6. But then take a place where the settled expectation is that the shopkeeper's cousins get served before everyone who's been in line forty minutes. Or a village where nobody reports a certain kind of theft because that's just how its done and everyone expects everyone else to keep quiet. Same shape exactly: converged expectation, real cost to breaking it. My argument makes those binding too.
  7. Worse, it makes them binding on me as a visitor, so I'd be the one doing wrong by not going along with it.
  8. And a reformer is by definition somebody breaking a rule everyone expects them to keep. So on this argument every reformer is acting wrongly right up until the convention tips, and then the people who were persecuting them are the ones acting wrongly. Which is nuts.

  So either the whole thing collapses into "whatever the locals do is right," or one of these steps is bad. I'd like to keep 2 and 3 honestly, because the feeling of "these people are counting on me and I cost them something" is exactly what I was trying to explain in the first place, and I dont want to be told I was wrong to feel bad about the jaywalking. But I can't live with 6 through 8.

  So: which step do you reject, and why did it look fine when it went past? What does rejecting it cost you — I want the price, not just the fix. And then run your fixed version through these and tell me what comes out, because I don't trust a repair that happens to dodge my hard cases:

  - empty street, 3am, nobody anywhere for a mile, town where nobody crosses on red. Wrong or not?
  - same situation but somebody's on their balcony watching and now thinks it's fine to do it too. Does that change the answer, or is that move a cheat?
  - I'm new in town and nobody told me you're supposed to leave 20%. I leave nothing and go home happy. Have I done anything wrong, and to who?
  - a convention where everyone keeps it up only because everyone wrongly thinks everyone else approves of it, and if you asked them privately they'd all say they hate it. Still binding?
  - the tipping one across the border, where the expectation runs the other way and the waiter's on a real wage. My argument says I'm obliged to be rude there. I'm pretty sure that's wrong, but tell me why without just saying "because the locals are wrong," which is the thing I'm trying to get away from.

  If you think two of my steps are bad rather than one, name both and say which one does the real damage. And if you think 5 is actually fine and the problem is somewhere I didn't even list, that's an answer too — but then you have to show me where.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Background:** The user has extensive experience living in different cultures (bars, kitchens, 9 moves, 3 countries). They've observed deep variations in social norms (tipping, queuing, jaywalking).
      *   **The Core Intuition:** They feel a moral obligation to follow local conventions (like not jaywalking where it's frowned upon) because breaking them imposes a *cost* on others who rely on those conventions (Step 2 & 3).
      *   **The Argument:** They constructed an 8-step argument to formalize this intuition.
          *   Steps 1-5 establish a conventionalist view: Morality is derived from local expectations because breaking them harms those relying on them.
          *   Steps 6-8 show the *reductio ad absurdum*: This view seems to validate harmful/corrupt conventions (nepotism, silence on theft) and condemns reformers.
      *   **The Goal:** The user wants to keep the intuition behind Steps 2 & 3 (harming those who rely on conventions is wrong) but reject the conclusion that *all* conventions are binding (Steps 6-8). They want to know which step to reject, the "price" of that rejection, and how the fixed theory handles specific test cases.

  2.  **Deconstruct the Argument:**
      *   *Premise 1:* Acts are morally neutral in isolation. (Plausible)
      *   *Premise 2:* Conventions create expectations; breaking them imposes costs (coordination failure, confusion, economic loss). (Strong, empirical)
      *   *Premise 3:* Imposing costs on people for no reason is wrong. (Strong, moral intuition)
      *   *Conclusion 4:* Wrongness comes *entirely* from settled expectation. (This is the pivot point).
      *   *Conclusion 5:* Morality is location-dependent based on convention. (Follows from 4).
      *   *Problem 6-8:* This validates bad conventions and condemns reformers.

  3.  **Identify the Flaw:**
      *   The argument slides from "conventions *generate* some moral weight" to "conventions generate *all* moral weight" (Step 4).
      *   Step 4 says: "Nothing else is doing any work." This is the overreach.
      *   Step 5 follows: "So what's wrong for you is set by wherever you happen to be standing." This ignores independent moral standards (justice, harm, rights) that exist *outside* the convention.
      *   *The Fix:* We need a hybrid theory. Conventions matter *unless* they conflict with deeper moral principles. This is essentially a Rule Utilitarian or Contractualist approach with a "threshold" or "side-constraint."
      *   *Which step to reject?* Step 4 is the culprit. It claims *exclusivity* ("Nothing else is doing any work"). Step 5 is also problematic because it treats the location/convention as the *sole* determinant.
      *   *Decision:* Reject Step 4 primarily. Step 5 falls with it.

  4.  **Formulate the Counter-Argument (The "Price"):**
      *   If I reject Step 4, I am admitting that conventions are not the *only* source of moral obligation.
      *   *The Price:* I lose the "airtight" simplicity of the original argument. I introduce complexity. I have to define *what else* is doing work (e.g., fairness, harm, rights). I also have to accept that sometimes following the local custom *is* wrong, even if it costs people something (e.g., not participating in nepotism).
      *   *Refining the Intuition:* The intuition in Step 3 ("Costing people like that, for no reason, is wrong") needs a qualifier. It should be "Costing people like that, for no *good* reason, is wrong." Or, "Costing people is a *pro tanto* wrong, but can be overridden."

  5.  **Address the Test Cases:**
      *   *Empty street, 3am, nobody around:*
          *   Original Argument: Wrong (because convention exists).
          *   Fixed Argument: Permissible. Why? Because the *cost* to others (Step 2) is negligible or non-existent. The convention relies on predictability. If no one is there to be surprised or endangered, the harm vanishes.
      *   *Someone on balcony watching:*
          *   Fixed Argument: Potentially wrong, but depends on *influence*. If they see you and think "oh, I can do that too," you are eroding the convention. But is it a *moral* violation? Only if the erosion causes actual harm. This distinguishes "being seen" from "being judged."
      *   *New in town, didn't know tipping rule:*
          *   Fixed Argument: Blameless (epistemic condition), but maybe still owe the debt? No, if you didn't know, you didn't intend to harm the expectation. However, once you know, the obligation kicks in. The "wrong" is in the *knowing* violation of reliance.
      *   *Pluralistic Ignorance (everyone hates the convention):*
          *   Fixed Argument: Not binding. Why? Because Step 2 ("people... count on other people doing it") is false. They don't actually count on it; they think others do. The reliance is illusory.
      *   *Tipping across the border (insult vs. obligation):*
          *   Fixed Argument: You are not obliged to be rude. Why? Because the "cost" here is different. In the 20% tip town, not tipping hurts the waiter's livelihood. In the wage town, tipping insults the professional dignity. Both are harms. You must minimize harm. But you aren't "obliged to be rude" in a moral sense; you are obliged to *adapt*. If adaptation is impossible, you follow the norm that causes less harm.

  6.  **Develop the "Reformer" Objection (Steps 6-8):**
      *   How does the fixed theory handle reformers?
      *   Reformers break conventions that are *unjust* or *harmful* in a deeper sense than mere coordination costs.
      *   The "cost" imposed on the oppressors by the reformer is outweighed by the benefit to the oppressed.
      *   Therefore, the reformer is not acting wrongly, because the "cost" in Step 3 is not the only metric.

  7.  **Drafting the Response:**
      *   *Tone:* Respectful, analytical, matching the user's philosophical rigor.
      *   *Structure:*
          1.  Identify the break point (Step 4).
          2.  Explain the "Price" (complexity, loss of relativism).
          3.  Present the Fixed Theory (Convention + Independent Morality).
          4.  Run the Test Cases.
          5.  Address the Reformer problem.
      *   *Key Distinction:* Distinguish between *coordination conventions* (driving side, queuing) and *moral conventions* (nepotism, theft). The user's argument conflates them.
      *   *Refining Step 3:* The "cost" must be *legitimate* reliance. You can't rely on me to help you cheat.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Wait, check Step 2 again.* Step 2 says "breaking it costs them." In the nepotism case, does breaking it cost them? Yes, the cousins lose out. But the people in line gain. The *net* cost is what matters.
      *   *Better rejection:* Reject Step 4 ("Nothing else is doing any work"). But also nuance Step 2. The "cost" must be a *harm*, not just a frustrated preference.
      *   *Actually, looking closer at Step 4:* "So the wrongness is coming entirely from the fact that the people around you have settled on expecting it." This is definitely the weak link. It excludes independent moral facts.
      *   *What about Step 3?* "Costing people like that, for no reason, is wrong." This is actually okay if "no reason" includes "no moral reason." But the user treats "convention" as the reason.
      *   *Let's stick with rejecting Step 4.* It's the cleanest cut. It stops the slide into full relativism.
      *   *The "Price":* The price is admitting that sometimes you *should* make locals uncomfortable (the reformer case). You have to weigh the harm of breaking trust against the harm of upholding injustice.
      *   *Test Case: Empty Street.* If Step 2 is "breaking it costs them," and no one is there, does it cost them? No. So the fixed theory says it's fine. This preserves the intuition without the relativism.
      *   *Test Case: Pluralistic Ignorance.* If everyone hates it, is there a "settled expectation"? Technically yes, empirically no. They expect *others* to do it, but don't want it. This breaks Step 2's "count on." They don't *rely* on it for a good outcome; they feel trapped by it.
      *   *Test Case: Tipping.* This is about conflicting harms. Economic harm vs. Dignitary harm.

  9.  **Final Polish:** Ensure the voice is conversational but precise. Acknowledge the strength of their original intuition (it *is* rude to jaywalk where it scares people) without accepting the conclusion (therefore all local rules are moral laws).

      *(Self-Correction on the "Reformer" point)*: The user worries that on their argument, the reformer is wrong *until* the convention tips. I need to explain why the reformer is right *before* the convention tips. Because the reformer is appealing to a higher standard than convention. The "cost" imposed on the oppressors is not a moral cost that generates obligation.

      *(Final check on Step 4 vs Step 5)*: Step 4 says "Nothing else is doing any work." Step 5 says "So what's wrong... is set by wherever you happen to be standing." Step 4 is the premise, Step 5 is the inference. Rejecting 4 kills 5. I will focus on 4.

      *(Wait, one more thing)*: The user asked "If you think two of my steps are bad rather than one, name both." I think Step 2 also needs a tweak regarding *legitimate* reliance. Relying on me to participate in nepotism isn't a legitimate reliance. So I will reject 4 primarily, but qualify 2.

      *Let's refine the "Price".* The price is that you can no longer just look at the crowd to know what to do. You have to judge the crowd. That's the burden of moral agency.

      *Okay, ready to write.*
answer: |-
  You've built a very strong case for **Conventionalism**, specifically a version grounded in **Reliance and Harm**. Your intuition in Steps 2 and 3 is robust: social coordination has value, and disrupting it without cause imposes real costs on people who have organized their lives around that coordination. That feeling you had about jaywalking? That was the friction of breaking a cooperative equilibrium.

  But you are right to be alarmed by Steps 6 through 8. Your argument collapses into a form of moral relativism that cannot distinguish between a queue and a shakedown.

  Here is the diagnosis, the fix, the price, and the stress test.

  ### The Break Point

  **I reject Step 4.**

  > *4. So the wrongness is coming entirely from the fact that the people around you have settled on expecting it. Nothing else is doing any work.*

  This is the leak. Step 4 claims **exclusivity**. It asserts that because convention *contributes* to the wrongness, it *exhausts* the wrongness. It assumes that "settled expectation" is the only moral currency that exists.

  **Why it looked fine:** It looked fine because in your daily life (tipping, queuing, crossing), Step 4 *appears* true. In low-stakes coordination games, the convention *is* the morality. There is no independent reason to drive on the left other than that everyone else does. Your brain generalized from "coordination norms" to "all norms."

  **Why it breaks:** It fails when the convention coordinates people *around* something harmful. If a village expects everyone to hide a theft, the "cost" of breaking that expectation is real (the thief gets caught, the village harmony is disrupted). But the expectation itself is protecting a harm. Step 4 forbids you from weighing the harm of the theft against the harm of breaking the expectation.

  ### The Price of Rejecting Step 4

  If you reject Step 4, you lose the simplicity of "look at the locals and copy them." You introduce a **two-tier system**.

  1.  **Tier 1: Independent Morality.** Some things are wrong regardless of expectation (theft, violence, systemic injustice).
  2.  **Tier 2: Conventional Morality.** Some things are wrong *only* because of expectation (which side of the sidewalk, tipping percentages).

  **The Cost:** You now have to judge the convention before you follow it. You can no longer outsource your moral reasoning to the environment. You have to ask: "Is this convention merely coordinating behavior, or is it enforcing harm?" This creates anxiety and the possibility of error. You might think a convention is unjust when it isn't, and become the arrogant tourist. That is the price of moral agency: the risk of being wrong is now on you, not on the crowd.

  ### The Fixed Argument

  Here is the repaired version. I am keeping Steps 1, 2, and 3, but modifying 4 and 5 to allow for independent moral constraints.

  1.  Acts are often neutral in isolation.
  2.  Conventions create reliance; breaking them imposes coordination costs.
  3.  Imposing costs on people for no reason is wrong.
  4.  **(FIXED)** However, reliance is only morally binding if the convention itself does not violate independent moral standards (like fairness or non-harm). **Convention generates obligation, but not immunity.**
  5.  **(FIXED)** So what's wrong for you is set by the local convention *unless* that convention conflicts with a higher-order moral duty.

  This solves the Reformer problem (Step 8). The reformer is not acting wrongly, because the "cost" they impose on the oppressors (loss of unfair privilege) is outweighed by the moral necessity of stopping the oppression. The reliance of the oppressors on their privilege is not *legitimate reliance*.

  ### Running the Test Cases

  Here is how the Fixed Argument handles your hard cases.

  **1. Empty street, 3am, nobody anywhere for a mile, town where nobody crosses on red. Wrong or not?**
  *   **Verdict:** Not wrong.
  *   **Why:** Look at Step 2: "breaking it costs them." If there is no one there, there is no one to rely on the expectation. There is no risk of accident, no erosion of the norm (because no one sees it), and no confusion caused. The "cost" is zero. Therefore, the obligation dissolves. Your original argument struggled here because it treated the *rule* as sacred; the fixed argument treats the *reliance* as sacred. No reliance, no rule.

  **2. Same situation but somebody's on their balcony watching and now thinks it's fine to do it too. Does that change the answer?**
  *   **Verdict:** Potentially wrong, but weakly.
  *   **Why:** Now Step 2 kicks in. You are visible. Your action signals that the convention is breakable. You are eroding the coordination for future pedestrians who *will* face traffic. However, the "cost" is still abstract.
  *   **Is it a cheat?** No, because social norms rely on common knowledge. If the person on the balcony sees you, the norm shifts from "nobody crosses" to "nobody crosses unless it's empty." You have changed the data set. But since the harm is minimal (erosion of a norm vs. actual danger), the wrongness is minor. It's a "don't be the first to crack" rule.

  **3. I'm new in town and nobody told me you're supposed to leave 20%. I leave nothing and go home happy. Have I done anything wrong, and to who?**
  *   **Verdict:** You haven't done anything *blameworthy*, but a debt may still exist.
  *   **Why:** Morality usually requires knowledge (*mens rea*). You cannot intend to violate a reliance you don't know exists. So you are not a "bad person." However, objectively, the waiter relied on that income structure.
  *   **The Fix:** The obligation is *pro suto* (as far as possible). Once you learn the norm, the obligation activates. If you find out later, you arguably owe it to return and pay, or at least adjust next time. The "wrong" isn't in your heart, it's in the outcome, but you are excused from blame until you know.

  **4. A convention where everyone keeps it up only because everyone wrongly thinks everyone else approves of it (Pluralistic Ignorance). Still binding?**
  *   **Verdict:** No.
  *   **Why:** This breaks Step 2. Step 2 requires that people "count on other people doing it." In pluralistic ignorance, they don't *want* to count on it; they feel coerced by a phantom majority. There is no genuine reliance on a shared good, only mutual fear. Breaking this convention doesn't cost people a benefit they value; it liberates them from a cost they hate. The reformer is safe here.

  **5. The tipping one across the border, where the expectation runs the other way and the waiter's on a real wage. My argument says I'm obliged to be rude there.**
  *   **Verdict:** You are not obliged to be rude.
  *   **Why:** This is a conflict of harms.
      *   *Scenario A (Tip Culture):* Not tipping causes **economic harm** to the waiter (they can't pay rent).
      *   *Scenario B (Wage Culture):* Tipping causes **dignitary harm** to the waiter (it implies their employer doesn't value them).
      *   **The Fix:** You are not following the rule because "it's the rule." You are following the rule to **minimize harm**. In Scenario A, you tip to prevent poverty. In Scenario B, you don't tip to prevent insult.
      *   This avoids saying "the locals are wrong." It says "the locals have optimized for different values." Your obligation is to align with the local optimization to avoid causing unintended damage. You aren't being rude; you're speaking the local language of respect.

  ### Summary of the Repair

  Your original argument was a **Single-Source Theory**: Convention = Morality.
  The fixed argument is a **Hybrid Theory**: Convention = Morality *unless* Justice ≠ Convention.

  **Which step did the real damage?**
  Step 4 was the killer ("Nothing else is doing any work").
  But Step 2 was the accomplice. It assumed all "costs" are equal. It treated the cost to a nepotistic shopkeeper (losing a unfair advantage) the same as the cost to a waiter (losing income).

  **The Final Price:**
  By fixing this, you admit that sometimes **you know better than the locals.** That is a dangerous thought. It opens the door to imperialism and arrogance ("I won't queue because queuing is inefficient"). You have to be very humble about when you invoke the "independent moral standard."

  But you must keep that door open. Otherwise, you aren't a moral agent; you're just a chameleon. And chameleons don't feel bad about jaywalking; they just change color. You felt bad because you knew you were part of a contract, not just a pattern. Keep the contract, drop the absolutism.
