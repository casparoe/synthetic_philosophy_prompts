      *   Soft spots flagged? Yes.
      *   Concession strategy included? Yes.
      *   Wegener question addressed? Yes.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Cliometrician:* "Endogeneity of the threshold." You fit the break to the data.
      *   *Demographer:* "Marriage vs. Mortality." Malthus got the channel wrong.
