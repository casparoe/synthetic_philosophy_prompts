      *(Self-Correction during drafting)*: Make sure the distinction between *Malthus's original text* and *Unified Growth Theory (UGT)* is clear. The user argues UGT is a conservative extension. The audience might attack UGT as *not* Malthus. I need to ensure the replies defend the *lineage*, not necessarily Malthus's specific 1798 errors.

      *(Refining the "Sealed" argument)*: The user's criterion is specific. (i) Observable conditions, (ii) Same mechanism, (iii) Costly for rivals. The objections should target these specific prongs.

      *   *Target Prong (i):* Did Malthus/UGT state the condition *before* seeing the UK data? (Philosopher/Clio).
      *   *Target Prong (ii):* Is the mechanism (tech-pop) the same? (Demographer).
      *   *Target Prong (iii):* Could Solow have claimed this? (Clio/Phil).

      *Let's structure the Q&A sheet.*

      *   **Top Priority (Damage):** The "Immunizing Stratagem" charge (Philosopher/Clio). If this is just ad-hocery, the paper is dead.
