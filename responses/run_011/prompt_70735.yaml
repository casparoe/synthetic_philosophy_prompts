prompt: |-
  I'm giving a 20-minute paper at an interdisciplinary workshop on long-run growth next week, and I'm the only non-economist on the program. My thesis is that Malthusian theory wasn't refuted by the demographic transition — it was right but early, and I try to make "right but early" precise instead of leaving it as a vibe. The criterion I defend: a long-run theory earns a regime-change escape from falsification only if it is, in my term, sealed in advance, meaning (i) it states up front the observable conditions under which its own parameters shift regime, (ii) those conditions are generated by the same mechanism that produces the in-regime predictions rather than by a seperate post-hoc story, and (iii) the escape it licenses is one a rival couldn't have taken without paying a comparable cost. I argue the formalized Malthusian model of pre-industrial economies clears all three, because the escape from the trap runs through the very technology-population feedback that produced the stagnation, so unified growth theory is a conservative extension of the model rather than a replacement for it.

  The room: two cliometricians who run century-long panel regressions and think in terms of identification; a historical demographer who works on English parish reconstitution data and cares about nuptiality, marriage age, the Hajnal line, none of your reduced-form nonsense; a development economist who does short-run RCTs and treats 1800 as deep time; and a philosopher of science whose background is climate-model evaluation — hindcasting versus out-of-sample, structural uncertainty, parameter tuning. Nobody there works on Lakatos and nobody is a Malthus specialist.

  Build me a Q&A prep sheet: the objections this specific crowd will actually raise, ordered by how much damage they do, phrased in their own registers (the cliometrician will talk identification, the demographer will talk marriage patterns, the philosopher will talk novel prediction), each with a two-minute reply and a flag on where that reply is softest. Tell me which objection I should concede in the first thirty seconds to buy credibility, which one I absolutely cannot concede because the whole paper goes down with it, and the question I'm dreading — I think its the continental drift comparison, where Wegener counted as right-but-early only because independent evidence later confirmed the core claim, and I dont have an analogue for that.
