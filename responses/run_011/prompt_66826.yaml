      *   *Voice:* Ensure M sounds concerned about optimization pressure, D sounds concerned about practicality/overfitting.

      *Self-Correction on Section 1:* Make sure the claims aren't too weak. "Both agree math exists" is weak. "Both agree 4096 bits constrains simulator complexity" is better.
