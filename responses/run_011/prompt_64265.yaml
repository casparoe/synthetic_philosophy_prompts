answer: |-
  ### Diagnosis of Your Draft Principle

  Your draft principle fails because it attempts to solve normative problems with epistemic tools. You are conflating **sufficiency of evidence** (is the belief rational?) with **legitimacy of action** (is the decision permitted?).

  *   **Clause (a) (Class Fixed):** Breaks on Case 3 (DNA). The reference class (people with this profile) is defined *by* the evidence found in the specific case. If you fix the class before knowing the case, you cannot use the DNA match.
  *   **Clause (b) (Random Member):** Breaks on Case 1 (Bus). The pedestrian is not a "random member" of the class of accidents; they are the victim of a *specific* accident. The statistic describes the fleet, not the causal history of the crash.
  *   **Clause (c) (Narrowest Class):** Breaks on Case 9 (Genetics). This meets (c) better than Case 5 (GP), yet you reject it. This proves the objection to 9 is not about statistical narrowness, but about the *type* of characteristic (immutable/constitutional) and the *context* (insurance vs. treatment).

  ### The Principle of Causal Specificity and Procedural Reciprocity

  To carry your verdicts, you must split the guidance into two distinct tracks. A single evidential principle cannot govern Cases 1–4 and Cases 7–10 simultaneously.

  **Track 1: The Epistemic Principle (For Findings of Fact)**
  *Statistics may support a finding of fact about an identified person only if:*
  1.  **Causal Specificity:** The statistic describes the reliability of a process generating a specific trace or outcome in *this* instance, not merely the frequency of the outcome in a population.
      *   *Motivated by:* 1 (Fail: fleet frequency), 2 (Fail: crowd frequency), 3 (Pass: match process on specific trace), 4 (Pass: machine process on specific breath).
  2.  **Stability:** The statistical regularity is stable across time and not constituted by the decision itself.
      *   *Motivated by:* 12 (Undecided: feedback loops violate stability).

  **Track 2: The Normative Principle (For Distributive Decisions)**
  *Statistics may support a decision affecting rights or burdens only if:*
  1.  **Agency:** The individual retains the capacity to understand, contest, or alter the inputs contributing to the score.
      *   *Motivated by:* 10 (Pass with contestation, Fail without), 6 (Fail: inputs fixed by history).
  2.  **Reciprocity:** The characteristic used does not encode historical disadvantage or immutable traits unless required for immediate physical safety of others.
      *   *Motivated by:* 7 (Pass: actuarial risk pooling), 8 (Fail: proxy for disadvantage), 9 (Fail: immutable genetic trait).

  ### Where Your Draft Breaks and What to Surrender

  If you insist on a **single** principle, you must surrender verdicts. You cannot keep 1, 2, 9, and 10 under one rule.

  *   **The Sacrifice:** You should surrender the claim that **9 and 10 are evidential verdicts.**
  *   **The Argument:** In Case 9, the evidence is *better* than in Case 5. The genetic test is more specific and causal than the GP's risk score. If you reject 9 on evidential grounds, you logically undermine 5. Therefore, your rejection of 9 is a policy choice (fairness/privacy), not an evidential one. Similarly, Case 10 turns on transparency, which is procedural, not evidential.
  *   **Repair:** Adopt the Split Principle above. Do not try to justify 9 with statistics; justify it with rights.

  ### New Test Cases (Verdicts under the Split Principle)

  Here are four cases constructed to test the boundaries. Case 4 is designed to contradict your likely intuition.

  1.  **The Warehouse Fire:** A warehouse burns down. Electrical inspection records show that 90% of units of this specific model, installed in this specific year, contain a latent manufacturing defect causing fire. The specific unit in this warehouse is destroyed and cannot be tested.
      *   **Verdict:** **Acceptable.**
      *   **Reasoning:** Track 1, Clause 1. The statistic refers to the *design batch* (causal mechanism) specific to this unit, not a general population of wires. It parallels Case 4 (Breathalyzer).

  2.  **The Algorithmic Hiring:** A firm uses a model to reject applicants. The model weights "gap in employment" heavily. This correlates with gender (women take more leave), but gender is not an input. Applicants are not told the weights.
      *   **Verdict:** **Not Acceptable.**
      *   **Reasoning:** Track 2, Clause 1 & 2. Violates Agency (cannot contest weights) and Reciprocity (proxy for protected class). Parallels Case 8.

  3.  **The Preventive Detention:** A model predicts, with 85% accuracy, that a prisoner released on parole will commit a violent crime within a year. The prediction is based on criminal history and age. The prisoner sees the score but cannot change the inputs.
      *   **Verdict:** **Not Acceptable.**
      *   **Reasoning:** Track 2, Clause 1. While inputs are known, they are largely immutable history. High stakes (liberty) require higher Agency than parole conditions (Case 10).

  4.  **The Pilot Grounding (Counter-Intuitive):** An airline grounds a pilot solely because a genetic test shows a 40% chance of sudden cardiac incapacitation within five years. The pilot is healthy now. The test is the most accurate predictor available.
      *   **Principle Verdict:** **Acceptable.**
      *   **Your Likely Verdict:** **Not Acceptable.** (Based on Case 9).
      *   **Reasoning:** Track 2, Clause 2 Exception ("unless required for immediate physical safety of others"). In Case 9 (Insurance), the risk is financial. Here, the risk is public safety. The causal link is strong (Track 1), and the public safety exception overrides the immutability constraint. This bites where your intuition on genetics (9) might be too broad.

  ### Are Cases 7 to 10 Evidential or Fairness?

  **Answer:** They are **fairness verdicts wearing evidential clothes.**

  *   **Evidence:** In Case 9, the genetic test is evidentially superior to the GP's risk score in Case 5. It is narrower, more calibrated, and more causal. If your verdict on 9 were evidential, you would have to reject 5 as well. You do not. Therefore, the rejection of 9 is normative.
  *   **Evidence:** In Case 10, you state the "evidential content is identical" between the transparent and black-box versions. If the evidence is identical, your differing verdicts cannot be based on evidence. They are based on procedural fairness.

  **The Evidential Half Standing Alone:**
  If you strip away the fairness constraints and look *only* at the Epistemic Principle (Track 1):
  *   **Case 9:** **Permitted.** The statistic is causally specific and calibrated.
  *   **Case 10:** **Permitted.** The score is validated and out-of-sample stable.
  *   *Note:* This demonstrates why you need the Normative Principle. The evidence is good; the use is restricted.

  ### Does "Causal Mechanisms" Dissolve the Difficulty?

  **Answer:** It dissolves the **Gatekeeper Problem** (Cases 1–4), but it clarifies rather than dissolves the **Fairness Problem** (Cases 7–10).

  *   **Gatekeeper:** Shifting from "frequency in a class" to "reliability of a specific causal process" explains why the Bus Case (1) fails (fleet frequency) while the DNA Case (3) succeeds (match process on specific trace). This resolves the tension between your naked statistical intuitions.
  *   **Fairness:** Understanding classes as causal mechanisms makes Case 9 *more* defensible evidentially, not less. The genetic variant is a direct causal mechanism for the disease. This highlights that your objection to Case 9 cannot be about the statistics or the causality; it must be about the morality of using immutable biological facts for financial distribution. Causal analysis strips away the camouflage, forcing you to admit the objection is ethical, not mathematical.

  ### Summary for Guidance Drafting

  1.  **Do not write a single rule.** Separate **Admissibility of Evidence** (Track 1) from **Permissibility of Action** (Track 2).
  2.  **For Evidence:** Require a causal link to the specific instance, not just class membership. (Bans Cases 1 & 2; Allows 3 & 4).
  3.  **For Action:** Require transparency, contestability, and avoidance of immutable proxies unless public safety is at stake. (Allows 5 & 7; Bans 8 & 9; Qualifies 10).
  4.  **Be Honest:** Acknowledge that high-accuracy statistics (like 9) are often banned not because they are wrong, but because they are unjust.
