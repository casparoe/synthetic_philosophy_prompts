      The Diachronic Dutch Book argument demonstrates that violating Reflection exposes the agent to a sure loss. A bookie offers a bet at $t_0$ paying $1$ if $H$ occurs, priced at $P_0(H | P_1(H)=q)$, conditional on $P_1(H)=q$. At $t_1$, if $P_1(H)=q$, the bookie offers a bet paying $1$ if $H$ fails, priced at $q$. If $P_0(H | P_1(H)=q) \neq q$, the prices differ, guaranteeing loss. This argument does not generalize to Retroflection. To book the agent on Retroflection, the bookie would need to offer a bet at $t_0$ contingent on the later self's attitude toward the past. However, the later self's attitude is not fixed at $t_0$ in a way that allows the earlier self to lock in a loss based on $P_1$'s violation of deference to $P_0$. The Dutch Book relies on the earlier self anticipating the later self's choices. Retroflection demands the later self defer to the earlier self, but the earlier self cannot force the later self's hand via betting odds alone. The failure of generalization indicates that Reflection is a requirement of diachronic coherence regarding one's own future rationality, whereas Retroflection is a substantive claim about the epistemic authority of the past self.

      The availability of the pre-commitment device clarifies this distinction. The agent can avoid the sure loss by binding her later self to reject the second bet, rather than by aligning $P_0$ with $P_1$. If Reflection were a strict constraint on probabilistic coherence, akin to synchronic consistency, binding would not resolve the irrationality; the credences themselves would be defective. The fact that strategic binding suffices shows the Dutch Book vulnerability stems from a failure of resoluteness or planning, not purely doxastic incoherence. The agent acknowledges her future self will be compromised by fatigue and manipulation. She preserves rationality not by deferring to that compromised self (violating her current judgment) nor by accepting the loss, but by restricting her future agency. This confirms that Reflection is not a universal coherence requirement but a normative principle applicable only when the agent expects her future self to be better informed or equally reliable.

      Consequently, van Fraassen's use of Reflection to defend Lewis's Principal Principle is compromised. The Principal Principle asserts that current credence in $H$, conditional on the chance of $H$ being $x$, should be $x$. van Fraassen argues this follows from Reflection, treating chances as analogous to future credences. He aims to show PP is a requirement of rationality. However, if Reflection is contingent on the expectation of reliability and evidential updating—as shown by the failure of Retroflection and the necessity of pre-commitment in cases of expected degradation—then deference to chance is not a formal requirement of coherence. It is instead a substantive hypothesis about the reliability of chance functions. The defence fails to establish the Principal Principle as a conceptual truth derivable from probabilistic rationality alone. It remains a substantive claim about the world, vulnerable to the same exceptions as Reflection when the "source" (chance or future self) is known to be misleading.

