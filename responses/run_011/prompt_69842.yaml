  Let $P_0$ and $P_1$ denote an agent's credence functions at times $t_0$ and $t_1$, where $t_0 < t_1$. van Fraassen's Reflection Principle requires that for any hypothesis $H$ and credence value $q$, $P_0(H \mid P_1(H)=q) = q$. For the purposes of this question, consider a variant stipulated for this examination, hereafter 'Retroflection', which requires $P_1(H \mid P_0(H)=q) = q$.

  Consider the following case: At $t_0$, an agent knows exactly what her credence in $H$ will be at $t_1$ (say, $q$). She knows this change will not be produced by evidence she currently regards as veridical, but by non-evidential factors: she will be thirty-six hours into an on-call shift, exhausted, and newly susceptible to a colleague she presently regards as a smooth talker. Bets on $H$ are offered at both times at odds matching her respective credences. A sure loss is visible to her at $t_0$. However, a pre-commitment device is available at $t_0$ that would prevent her later self from accepting the second bet.

  Answer the following:
  1.  Derive Reflection from the assumption that the agent expects her later credences to be obtained by conditionalizing on evidence she now regards as veridical, and identify the premise that carries the weight.
  2.  Determine whether the diachronic Dutch book argument generalizes to Retroflection, and, if it does not, say what that shows about whether Reflection is a requirement of coherence or a substantive claim about the agent's own reliability.
  3.  Explain what the availability of the pre-commitment device does to the argument, given that the sure loss can be avoided by binding the later self instead of by revising the earlier credence. Close by saying whether the use van Fraassen makes of Reflection in defence of Lewis's Principal Principle is affected by the verdicts you have reached.

