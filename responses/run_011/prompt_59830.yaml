answer: |-
  **To:** Study Director
  **From:** Philosophical Consultant
  **Subject:** Specification of Desiderata for Self-Locating Credence Protocol

  You have correctly identified that the impasse between your philosopher and your statistician stems from a lack of agreed-upon norms for *self-locating belief*. The Sleeping Beauty problem (which your protocol instantiates) is not merely a puzzle about coin tosses; it is a stress test for the interface between objective chance, Bayesian updating, and indexical information ("I am awake now").

  Below is the specification you requested. It outlines the desiderata any account of rational credence must meet to settle the scoring protocol. I have categorised these by their function, marked their negotiability, and highlighted the structural conflicts inherent in the list.

  ### I. Phenomena to be Explained

  Any viable account must explain why intelligent agents feel pulled in two directions.

  **1. The Counting Intuition (Thirder Pull)**
  *   **Consideration:** In the long run, two-thirds of all wakings occur in the Double-wake arm. If a subject reasons "I am a random waking," she should assign probability 2/3 to Double.
  *   **Status:** *Local Preference (Thirder Camp).* An account may reject this if it denies that wakings are the appropriate reference class, but it must explain why the intuition arises.

  **2. The Fixed Allocation Intuition (Halfer Pull)**
  *   **Consideration:** The randomisation occurred before the experiment. The subject knows the chance of the Double arm is 1/2. Waking provides no new information about the *coin* (or allocation), only about her temporal location.
  *   **Status:** *Local Preference (Halfer Camp).* An account may reject this if it treats temporal location as evidence relevant to the allocation, but it must explain why the prior chance feels resilient.

  ### II. Distinctions to be Maintained

  Your statistician is correct that the question is "empty" unless we distinguish the *purpose* of the credence report. The account must not collapse the following:

  **3. Ontic Chance vs. Epistemic Credence**
  *   **Consideration:** The objective chance of the allocation is fixed at 1/2. The subject's credence is a state of mind. These can diverge if the subject gains indexical evidence.
  *   **Status:** *Non-negotiable.* Collapsing these renders the concept of objective chance meaningless.

  **4. Credence vs. Betting Odds**
  *   **Consideration:** What a subject *believes* (truth-tracking) may differ from how she should *bet* (utility-maximising), particularly when payoffs are correlated with the number of times she is asked.
  *   **Status:** *Non-negotiable.* In your payment wrinkle, a subject paid per session maximises expected utility by acting *as if* the probability is 2/3 (Double), even if she believes the allocation chance is 1/2.

  **5. Single-Agent vs. Pooled Responses**
  *   **Consideration:** In the Double arm, one volunteer provides two data points. Scoring requires deciding whether these are independent observations or repeated measures from a single epistemic agent.
  *   **Status:** *Non-negotiable.* Treating them as independent inflates the sample size; treating them as one requires a rule for aggregating temporally distinct credences.

  ### III. Formal Constraints

  Here we encounter the mathematical core of the dispute.

  **6. The Principal Principle (Chance-Credence Tie)**
  *   **Consideration:** If a rational agent knows the objective chance of an event is $x$, and possesses no "inadmissible" evidence, her credence should be $x$.
  *   **Status:** *Non-negotiable (Orthodox View).* This is the bedrock of the Halfer position. To violate this is to claim rational agents should ignore known chances.

  **7. Strict Conditionalisation on Total Evidence**
  *   **Consideration:** Upon receiving new evidence $E$, a rational agent must update her credence in $H$ from $P(H)$ to $P(H|E)$. The debate turns on whether "I am awake now" counts as evidence $E$ that shifts the probability.
  *   **Status:** *Non-negotiable (Bayesian View).* This is the engine of the Thirder position. To violate this is to claim rational agents should ignore new information.

  **8. Diachronic Consistency (Reflection Principle)**
  *   **Consideration:** If I know now that I will believe $P$ tomorrow without having lost information or suffered irrationality, I should believe $P$ now.
  *   **Status:** *Local Preference.* Most solutions to this protocol violate this. Thirders violate it because the Sunday credence (1/2) differs from the waking credence (1/3) without new *external* information. Halfers violate it if they admit waking changes nothing yet maintain different betting strategies.

  ### IV. The Incompatibility Thesis

  You suspected that respecting chance and conditionalising on total evidence (centred propositions included) are a pair that cannot be jointly satisfied. **You are correct.**

  **9. The Joint Satisfaction Constraint**
  *   **Consideration:** An account cannot simultaneously satisfy the **Principal Principle** (keeping credence at 1/2 because the chance is 1/2) and **Strict Conditionalisation on Centred Evidence** (updating to 1/3 because "I am awake" is more likely in the Double arm).
  *   **Status:** *Impossible.* One must be modified or rejected.
      *   *Halfers* modify Conditionalisation (claiming indexical info is not evidence relevant to the hypothesis).
      *   *Thirders* modify the Principal Principle (claiming the link between chance and credence is mediated by self-location).
      *   *Double-Halfers* attempt to keep both but fail Diachronic Consistency.

  ### V. The Payment Wrinkle and the Exclusionary Requirement

  You asked which single requirement excludes the most candidate accounts, specifically bearing in mind that volunteers are paid per session.

  **The Requirement:** **Decision-Theoretic Coherence with Per-Session Incentives.**

  *   **Reasoning:** If the goal of the credence report is to guide action within the experiment's incentive structure, the subject *must* wager as though the probability of the Double arm is 2/3.
      *   If she bets on "Double" at even odds:
          *   In the Single arm (1 session): She loses 1 unit.
          *   In the Double arm (2 sessions): She wins 2 units.
          *   Expected Value (at 1/2 credence): $0.5(-1) + 0.5(2) = +0.5$.
      *   Wait, this suggests betting on Double is always advantageous regardless of credence if the payoff is per session. However, if asked for a *fair price* for a bet that pays £1 if Double:
          *   A Halfer (credence 1/2) pays 50p. Over many experiments, she pays £1 per experiment, wins £1 per Double experiment (50% of time). Net: 0.
          *   A Thirder (credence 2/3) pays 67p. Over many *wakings*, she pays £2, wins £2 (since she wins twice in the Double arm). Net: 0.
      *   The divergence arises when we ask: **What is the credence *for*?**
      *   If credence is for **scoring accuracy** (Brier score), the Halfer view often minimises loss per *experiment*.
      *   If credence is for **betting coherence** per *waking*, the Thirder view minimises loss per *decision*.

  *   **Why this excludes the most:** Most philosophical accounts aim to describe *truth-tracking belief*. They are not built to accommodate *frequency-based payoffs*. Demanding that the reported credence aligns with the per-session payout structure forces the account to be pragmatic rather than purely epistemic. This excludes pure Halfer accounts (which track the coin chance) and pure Thirder accounts (which track the waking frequency but may struggle to justify it as 'truth'). It forces a **Hybrid Account** (e.g., "Credence is 1/2, but Betting Odds are 2/3"), which many standard theories forbid.

  ### VI. Confidence and Uncertainty

  **Confidence in Principal Claims:** **High.**
  I am highly confident that the Principal Principle and Strict Conditionalisation on Centred Evidence are logically incompatible in this protocol without modifying the definition of "evidence" or "chance." This is a established result in formal epistemology (see *Meacham 2008* or *Titelbaum 2008*). I am also confident that the payment structure creates a divergence between truth-tracking and utility-maximising.

  **Point of Least Certainty:** **The Normative Status of Centred Propositions.**
  I am least sure whether propositions like "I am awake now" possess truth values stable enough to serve as the basis for Conditionalisation. If centred content is not truth-apt, then Strict Conditionalisation (Desideratum 7) is category error, dissolving the conflict but leaving us without a formal update rule. This is the weakest link in the Thirder formalisation.

  ### Recommendation for the Protocol

  To satisfy your statistician and philosopher without resolving the metaphysical dispute:

  1.  **Record the Credence:** Ask for the probability assignment (0–1).
  2.  **Record the Wager:** Ask for the maximum price they would pay for a £1 bet on the Double arm, payable *per session*.
  3.  **Score Separately:**
      *   Score the **Credence** against the *Allocation* (Halfer-favourable).
      *   Score the **Wager** against the *Session Outcome* (Thirder-favourable).

  This acknowledges that in self-locating contexts, *belief* and *action* may rationally come apart.

  **Signed,**
  **Philosophical Consultant**
