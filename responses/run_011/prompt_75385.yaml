prompt: |-
  I am a senior legal officer serving as rapporteur to a standing law reform commission. Our current review cycle covers legacy offences in the category of sexual morality and public decency: roughly fifteen provisions, most drafted in the nineteenth century, several dormant, all of which the legislature has asked us to justify or recommend for repeal. The commission has adopted an explicitly Benthamite frame of reference for this cycle — not because its members are utilitarians in any doctrinal sense, but because Bentham's penal theory supplies a vocabulary for sorting justifications that we currently lack. Two of the three commissioners are lawyers with no philosophical training; one is a former magistrate who regards the whole exercise as an invitation to repeal things the public would not consent to repeal. Every recommendation we publish must be defensible to the legislature, and my analyst team has to be able to apply the framework uniformly across all fifteen provisions in about three working days per provision, with a lawyer signing off before it goes to the commissioners.

  What I need from you is a screening procedure my analysts can actually run, not an exposition of Bentham. Please build it around the following, and be explicit wherever you depart from or simplify his apparatus:

  1. **The gate structure.** Give me the questions in the order they should be asked, and for each: what evidence or finding counts as a sufficient answer, which disposition follows from a failure (retain as drafted; retain as amended; repeal; or refer to the commissioners), and whether that gate is dispositive on its own or merely cumulative with the others. The gates should track Bentham's own grounds for declining to punish — the cases in which punishment is groundless because no mischief is produced, inefficacious because it cannot operate on the conduct, unprofitable because the mischief it produces exceeds the mischief it prevents, or needless because the mischief could be prevented at a cheaper rate.

  2. **The consent gate.** Bentham treats consent that is free and fairly obtained as strong evidence that the consenting party has suffered no mischief on the whole. Tell me how an analyst should operationalise that in a screening, and — critically — what the procedure must import from outside Bentham's theory to assess whether consent was free and fairly obtained, since his own framework does not supply an independent account of that.

  3. **The classification of third-party distress.** This is where I expect most of the disagreement in our cycle. Require the analyst to classify every item of reported public distress into one of three boxes: alarm in Bentham's technical sense, meaning apprehension of suffering the mischief that the act itself produces to assignable victims, and therefore presupposing both an identifiable primary mischief and a real chance of the complainant suffering it; derivative mischief falling on persons connected to an identifiable victim; and bare revulsion or antipathy — distress at the thought of conduct in which the complainant is neither victim nor at risk. Then say what weight each box carries, and flag the point at which the procedure runs out of textual guidance and the commissioners must choose an interpretation.

  4. **The disqualifying-justification gate.** Include a step that asks whether the sole remaining support for a provision is that the conduct is wrong in itself, or that people of good character detest it — the two principles Bentham regards as rival to utility rather than as evidence within it — and specify what happens to a provision that survives every other gate but fails this one.

  5. **The law's own secondary effects.** Require the analyst to enter, on the mischief side of the ledger, the harms the enforcement of the provision itself produces: selective enforcement against unpopular or unrepresented groups, the exposure of complainants and defendants to publicity, the incentive the provision creates for blackmail and extortion around conduct that must be concealed, and the cost of prosecution relative to the mischief prevented.

  Then run the finished procedure on three cases, showing the analyst's worksheet at each gate: (a) a dormant provision criminalising consensual sexual acts between adults in private, with no evidence of complaint by any participant in forty years; (b) a modernised provision criminalising the covert recording or photographing of a person's private parts or sexual activity without their consent, where victims describe lasting apprehension about being recorded in changing rooms and clinics; (c) a general provision against sexual conduct in places where members of the public are likely to be unwilling witnesses, supported by a large volume of sincere, stable, and demographically broad complaints. At least one of the three must produce a recommendation I expect to be politically unwelcome, and you should say which one and why the procedure cannot be adjusted to avoid it without giving up something else.

  Finally, tell me what the procedure cannot do. I want an honest account of the steps that are judgment calls dressed as arithmetic, the classes of provision it will systematically get wrong, and the specific way in which Bentham's insistence on comparing quantities of pain and pleasure leaves my analysts without a number precisely when the case is most contested. Please do not supply a bibliography, a reading list, or citations of any kind; the procedure must stand on its own terms for readers who will never check it against a text.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the Request:**
      *   **Role:** Senior Legal Officer/Rapporteur to a Standing Law Reform Commission.
      *   **Task:** Create a screening procedure for analysts to evaluate 15 legacy offences (sexual morality/public decency) using a Benthamite framework.
      *   **Constraints:**
          *   Must be practical (3 days/provision).
          *   Must be defensible to the legislature.
          *   Must be usable by lawyers with no philosophical training.
          *   Must explicitly state departures/simplifications from Bentham.
          *   Must include 5 specific components (Gate Structure, Consent Gate, Third-Party Distress Classification, Disqualifying-Justification Gate, Law's Secondary Effects).
          *   Must apply the procedure to 3 specific cases (a, b, c).
          *   Must include a "What the procedure cannot do" section (limitations/judgment calls).
          *   **NO** bibliography, reading list, or citations.
      *   **Tone:** Professional, procedural, legalistic but clear, authoritative.

  2.  **Deconstruct the 5 Required Components:**

      *   **1. The Gate Structure:** Needs to follow Bentham's grounds for declining punishment (Groundless, Inefficacious, Unprofitable, Needless). Needs specific questions, evidence standards, dispositions, and dispositive/cumulative status.
      *   **2. The Consent Gate:** Needs to operationalize "free and fairly obtained" consent. Needs to acknowledge Bentham's lack of an independent theory of freedom/coercion and import necessary modern legal standards (e.g., capacity, power dynamics).
      *   **3. Third-Party Distress:** Needs three boxes (Alarm, Derivative Mischief, Bare Revulsion). Needs weighting and a flag for when commissioners must decide.
      *   **4. Disqualifying-Justification Gate:** Needs to catch "wrong in itself" (asceticism) or "detestation" (antipathy) as sole justifications. Needs a specific disposition (likely Repeal or Refer).
      *   **5. Law's Secondary Effects:** Needs to account for enforcement harms (selective enforcement, publicity, blackmail, cost).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* I'll organize this as a formal "Analyst Screening Protocol."
      *   *Gate 1 (Groundless):* Is there actual mischief? If no -> Repeal.
      *   *Gate 2 (Consent):* Is consent present and valid? If yes -> Mischief reduced/eliminated.
      *   *Gate 3 (Third-Party Distress):* Classify the distress. Weight it.
      *   *Gate 4 (Secondary Effects):* Calculate the cost of the law itself.
      *   *Gate 5 (Unprofitable/Needless):* Compare Mischief of Act vs. Mischief of Punishment.
      *   *Gate 6 (Disqualifying Justification):* Is the only reason moral disgust?

      *Refining the Order:* Bentham's logic flows from: Is there harm? -> Can law stop it? -> Is it worth it? -> Is there a cheaper way?
      Let's align the requested 5 points into a logical flow.
      1.  Grounds for Declining (Groundless/Inefficacious).
      2.  Consent (modifies "Groundless").
      3.  Third-Party Distress (modifies "Mischief").
      4.  Secondary Effects (modifies "Cost of Punishment").
      5.  Profitability/Needlessness (The Calculation).
      6.  Disqualifying Justification (The Final Check).

      *Simplification Note:* Bentham is complex. I need to simplify "felicific calculus" into a checklist. I must explicitly state this is a heuristic, not a true calculation.

      *Consent Gate:* Bentham assumes consent negates mischief. Modern law knows consent can be coerced. I need to import "vitiating factors" (age, capacity, power imbalance) as an external module.

      *Distress:* "Alarm" vs. "Revulsion" is the crux. Alarm = risk of harm to self. Revulsion = dislike. Bentham dismisses revulsion. The procedure must force the analyst to label it.

      *Disqualifying Justification:* If the only reason is "it's sinful" or "we hate it," Bentham says repeal. I need to make sure the analyst identifies if *any* utility-based reason remains.

  4.  **Developing the Test Cases:**

      *   *Case A (Dormant Consensual Private Acts):*
          *   Groundless? No direct victim.
          *   Consent? Yes.
          *   Distress? Likely Bare Revulsion.
          *   Secondary Effects? Blackmail risk, privacy invasion.
          *   Result: Repeal. (Politically unwelcome to the Magistrate Commissioner).
      *   *Case B (Upskirting/Covert Recording):*
          *   Groundless? Yes, violation of privacy/autonomy.
          *   Consent? No.
          *   Distress? Alarm (apprehension of harm/loss of control).
          *   Secondary Effects? Low compared to harm.
          *   Result: Retain.
      *   *Case C (Public Sexual Conduct):*
          *   Groundless? Public witness distress.
          *   Distress? Mixed. Some Alarm (children?), mostly Revulsion?
          *   Secondary Effects? Enforcement cost.
          *   Result: This is the tricky one. If distress is mostly revulsion, Bentham says repeal. If it's alarm (unwilling exposure), retain. I need to make sure the procedure forces a hard choice here. Let's make Case C the one where the procedure recommends Repeal or Significant Narrowing, which might be unwelcome given "demographically broad complaints." Actually, Case A is the classic "private morality" repeal. Case C is "public decency." The prompt asks for *one* politically unwelcome recommendation. Case A is the strongest candidate for repeal under Bentham. Case C might be retained due to "Alarm" of unwilling witnesses. Let's make Case A the unwelcome one (Repeal of moral offence).

  5.  **Drafting the "What the Procedure Cannot Do" Section:**
      *   Acknowledge that "quantifying pain" is metaphorical here.
      *   Acknowledge that "Revulsion" vs. "Alarm" is subjective.
      *   Acknowledge that Bentham ignores rights-based constraints (which the commission might implicitly hold).
      *   Acknowledge the "Magistrate Commissioner" problem (public opinion vs. utility).

  6.  **Review against Constraints:**
      *   3 days/provision feasibility? Yes, checklists help.
      *   No citations? Checked.
      *   Explicit departures? Need to highlight these in the intro or footnotes of the procedure.
      *   Tone? Needs to be internal guidance, precise.

  7.  **Final Polish:**
      *   Ensure the "Gate" terminology is consistent.
      *   Ensure the "Disposition" options are clear (Retain, Amend, Repeal, Refer).
      *   Make sure the "Consent Gate" explicitly imports non-Benthamite standards (capacity, coercion).
      *   Make sure the "Distress" classification is rigid.
      *   Ensure the Test Cases show the *worksheet* logic, not just the result.

      *(Self-Correction during drafting)*: I need to be careful with the "Dispositive vs. Cumulative" instruction in Gate 1. Bentham's grounds are usually alternative (if *any* apply, punishment is unjustified). I will structure them as a funnel. If Gate 1 fails (Groundless), stop and recommend Repeal. If it passes, move to Profitability.

      *(Refining the "Unwelcome" Case)*: The prompt says "At least one... must produce a recommendation I expect to be politically unwelcome." Case A (private consensual) is the obvious Benthamite repeal. The Magistrate Commissioner thinks the public won't consent to repeal. This fits perfectly. I will highlight this tension.

      *(Refining the "Consent Gate")*: Bentham doesn't have a theory of "free" consent beyond the absence of immediate physical coercion. I must explicitly state we are importing modern contract/criminal law standards for capacity and undue influence.

      *(Refining the "Distress Gate")*: I need to make sure the analyst knows that "Bare Revulsion" gets *zero* weight in the Benthamite calculus, whereas "Alarm" gets full weight. This is the critical friction point.

  8.  **Final Output Structure:**
      *   Header: Internal Protocol.
      *   Introduction: Scope and Simplifications.
      *   The Screening Protocol (Gates 1-6).
      *   Application to Test Cases (Worksheets).
      *   Limitations and Caveats.

      *Wait, one check on the Gates:* The prompt asks for specific Bentham grounds: Groundless, Inefficacious, Unprofitable, Needles. I should map my Gates to these specific terms to ensure compliance with the prompt's requirement to "track Bentham's own grounds."

      *Revised Gate Plan:*
      *   Gate 1: Groundless (No Mischief). Includes Consent here.
      *   Gate 2: Inefficacious (Law can't stop it).
      *   Gate 3: Unprofitable/Needless (Cost/Benefit). Includes Secondary Effects and Third-Party Distress here.
      *   Gate 4: Disqualifying Justification (The Moral Check).

      Actually, looking at the prompt's 5 requirements, it's better to integrate them into a linear flow that *uses* the Bentham grounds as the skeleton.
      1. Grounds for Declining (The Skeleton).
      2. Consent (Part of Groundless).
      3. Distress (Part of Mischief Calculation).
      4. Secondary Effects (Part of Cost Calculation).
      5. Disqualifying Justification (The Final Filter).

      Let's build the "Analyst Screening Protocol" document.

      *Wait, one more check:* "Three working days per provision." The procedure needs to be efficient. I will use a "Stop/Go" logic.

      *Final check on "Unwelcome":* Case A (Private Consensual) -> Repeal. This is unwelcome to the Magistrate. Case C (Public) -> Retain (due to Alarm). Case B (Covert) -> Retain. This works.

      *Final check on "What it cannot do":* Be honest about the quantification problem.

      Let's write.
answer: |-
  **INTERNAL PROTOCOL: LEGACY OFFENCE SCREENING (SEXUAL MORALITY & PUBLIC DECENCY)**
  **TO:** Analyst Team
  **FROM:** Senior Legal Officer / Rapporteur
  **SUBJECT:** Benthamite Screening Procedure for Cycle 4 Review
  **TIME ALLOCATION:** 3 Working Days Per Provision

  ### 1. PREAMBLE AND SIMPLIFICATIONS

  This procedure operationalizes Jeremy Bentham's principles of penal utility for the purpose of legislative review. It is not a philosophical exercise; it is a decision tree designed to produce defensible recommendations (Retain, Amend, Repeal, or Refer).

  **Explicit Departures from Bentham:**
  1.  **Quantification:** Bentham sought a "felicific calculus" to measure pain and pleasure. We do not have the data or time for this. You will use **categorical weighting** (High/Medium/Low/Zero) rather than arithmetic.
  2.  **Consent:** Bentham assumes consent negates mischief. We import modern legal standards regarding capacity, coercion, and power dynamics to determine if consent is valid. Bentham provides no test for this; we supply one.
  3.  **Rights:** Bentham rejects natural rights. However, where enforcement violates constitutional privacy norms, you must flag this under "Secondary Effects" as a high-cost item, even if Bentham would view rights as nonsense.
  4.  **Dispositiveness:** In Bentham's theory, if *any* ground for declining punishment is met, the law is unjustified. In this procedure, Gates 1–3 are **dispositive** (a "Fail" leads immediately to a Repeal recommendation). Gates 4–5 are **cumulative** (they weigh the final balance).

  ---

  ### 2. THE SCREENING PROTOCOL

  #### GATE 1: THE GROUNDLESS GATE (Mischief Identification)
  **Question:** Does the prohibited conduct produce identifiable mischief (pain, loss, or risk thereof) to an assignable victim, independent of the law's existence?
  **Evidence Required:** Police reports, victim impact statements, medical data, or documented complaints. Anecdotal moral objection does not count.
  **Simplification:** We treat "risk of harm" as mischief only if the risk is statistically significant or logically necessary (e.g., driving drunk).
  **Disposition:**
  *   **NO Mischief Found:** **REPEAL.** (Stop here).
  *   **Mischief Found:** Proceed to Gate 2.
  **Status:** Dispositive.

  #### GATE 2: THE CONSENT GATE (Validity of Waiver)
  **Question:** If the mischief falls primarily on a participant in the act, was their consent free, informed, and fairly obtained?
  **Operational Procedure:**
  1.  **Presumption:** If the act is between adults in private, presume consent negates mischief.
  2.  **Imported Standards:** You must apply current criminal law standards for *vitiating factors*. Consent is **invalid** if obtained through:
      *   Physical force or threat of immediate harm.
      *   Abuse of authoritative power (e.g., custodian, employer).
      *   Incapacity (intoxication, age, cognitive impairment).
  3.  **Finding:** If consent is valid, the mischief to that party is counted as **Zero**. If consent is invalid, the mischief is counted as **High**.
  **Disposition:**
  *   **Valid Consent (No other victims):** **REPEAL.** (Stop here).
  *   **Invalid Consent or Third-Party Victims:** Proceed to Gate 3.
  **Status:** Dispositive (regarding the consenting party's harm).

  #### GATE 3: THE THIRD-PARTY DISTRESS GATE (Classification)
  **Question:** For all reported distress from non-participants (the public, witnesses, family), classify the source into one of three boxes.
  **Classification Boxes:**
  1.  **Alarm (Weight: HIGH):** Apprehension that the complainant will suffer the *same* mischief as the primary victim (e.g., "If they can record her, they can record me"). Requires an identifiable primary mischief and a real chance of the complainant suffering it.
  2.  **Derivative Mischief (Weight: MEDIUM):** Distress falling on persons connected to an identifiable victim (e.g., family of a victim of non-consensual recording). Requires a primary victim.
  3.  **Bare Revulsion (Weight: ZERO):** Distress at the thought of conduct where the complainant is neither victim nor at risk. Dislike, disgust, or moral offense without personal risk.
  **The Flag:** If >50% of the evidence falls into **Bare Revulsion**, you must flag the provision for **Commissioner Review**. Under this framework, Bare Revulsion cannot justify punishment.
  **Disposition:**
  *   **Mostly Alarm/Derivative:** Proceed to Gate 4.
  *   **Mostly Bare Revulsion:** Recommend **REPEAL** (subject to Commissioner override).
  **Status:** Cumulative (feeds into Gate 4).

  #### GATE 4: THE LAW'S SECONDARY EFFECTS GATE (Cost of Punishment)
  **Question:** What mischief does the *enforcement* of this law produce? Enter these on the "Cost" side of the ledger.
  **Required Entries:**
  1.  **Selective Enforcement:** Is there evidence the law is used disproportionately against specific groups (e.g., LGBTQ+, minorities, sex workers)? If yes, mark Cost: **HIGH**.
  2.  **Privacy/Publicity:** Does prosecution require exposing intimate details of victims or defendants? If yes, mark Cost: **MEDIUM/HIGH**.
  3.  **Blackmail Risk:** Does the law create leverage for extortion (e.g., threatening to report a dormant offence)? If yes, mark Cost: **HIGH**.
  4.  **Fiscal Cost:** Is the cost of prosecution disproportionate to the harm prevented?
  **Disposition:** Calculate Total Cost vs. Total Mischief Prevented (from Gates 1–3).
  *   **Cost > Benefit:** Recommend **REPEAL** or **AMEND** (to narrow scope).
  *   **Benefit > Cost:** Proceed to Gate 5.
  **Status:** Cumulative.

  #### GATE 5: THE DISQUALIFYING JUSTIFICATION GATE (The Moral Check)
  **Question:** If all previous gates are passed, what is the *sole remaining* justification for the provision?
  **Test:** Ask the proponent of the law (or review the legislative history): "If no one was ever offended, alarmed, or harmed by this act, would it still be wrong?"
  *   **If YES:** The justification is **Asceticism** (wrong in itself) or **Antipathy** (detestation).
  *   **If NO:** The justification is **Utility** (prevention of harm).
  **Disposition:**
  *   **Sole Justification is Asceticism/Antipathy:** Recommend **REPEAL**. (Bentham holds these are rivals to utility, not evidence of it).
  *   **Justification is Utility:** Recommend **RETAIN**.
  **Status:** Dispositive.

  ---

  ### 3. APPLICATION TO TEST CASES (ANALYST WORKSHEETS)

  #### CASE A: Dormant Provision (Consensual Sexual Acts in Private)
  *Offence: "Unnatural sexual acts between persons of full age in private."*
  *Status: No active prosecutions in 40 years. No complaints by participants.*

  | Gate | Analyst Finding | Evidence/Reasoning | Disposition |
  | :--- | :--- | :--- | :--- |
  | **1. Groundless** | **NO Mischief** | No assignable victim. No medical harm data. | **REPEAL** (Stop) |
  | **2. Consent** | **VALID** | Adults, private, no coercion alleged. | (Confirmed) |
  | **3. Distress** | **BARE REVULSION** | Historical records show moral objection, no alarm of personal risk. | Weight: Zero |
  | **4. Secondary Effects** | **HIGH COST** | High blackmail risk; selective enforcement history against minorities; privacy invasion in investigation. | Cost > Benefit |
  | **5. Justification** | **ANTIPATHY** | Legislative history cites "sin" and "decency," not harm prevention. | **REPEAL** |

  **Final Recommendation:** **REPEAL.**
  **Political Note:** This is the **politically unwelcome recommendation**. The Magistrate Commissioner will object that the public will not consent to repeal. The procedure forces this outcome because Gate 1 and Gate 5 cannot be satisfied without evidence of mischief or utility. To avoid this, one would have to count "public disgust" as "mischief," which violates the Benthamite instruction to classify it as Bare Revulsion (Weight Zero).

  #### CASE B: Modernised Provision (Covert Recording of Private Parts)
  *Offence: "Recording intimate parts without consent."*
  *Status: Active prosecutions. Victims report lasting apprehension.*

  | Gate | Analyst Finding | Evidence/Reasoning | Disposition |
  | :--- | :--- | :--- | :--- |
  | **1. Groundless** | **MISCHIEF FOUND** | Violation of autonomy; psychological harm to victims. | Proceed |
  | **2. Consent** | **INVALID/ABSENT** | Act is defined by lack of consent. | Proceed |
  | **3. Distress** | **ALARM** | Victims report apprehension of future recording in safe spaces (clinics, gyms). | Weight: High |
  | **4. Secondary Effects** | **LOW COST** | Digital evidence reduces need for intimate testimony; low blackmail risk compared to harm prevented. | Benefit > Cost |
  | **5. Justification** | **UTILITY** | Prevents psychological harm and loss of privacy. | **RETAIN** |

  **Final Recommendation:** **RETAIN.**

  #### CASE C: General Provision (Sexual Conduct in Public View)
  *Offence: "Outraging public decency."*
  *Status: High volume of sincere, stable complaints from broad demographic.*

  | Gate | Analyst Finding | Evidence/Reasoning | Disposition |
  | :--- | :--- | :--- | :--- |
  | **1. Groundless** | **MISCHIEF FOUND** | Unwilling witnesses are assignable victims of the exposure. | Proceed |
  | **2. Consent** | **N/A** | Witnesses did not consent to observe. | Proceed |
  | **3. Distress** | **MIXED** | 40% Alarm (children/unable to look away); 60% Revulsion (moral offense). | **FLAG FOR COMMISSIONERS** |
  | **4. Secondary Effects** | **MEDIUM COST** | Enforcement requires police presence in public; risk of selective enforcement. | Neutral |
  | **5. Justification** | **MIXED** | Partly harm (Alarm), partly Antipathy (Revulsion). | **REFER** |

  **Final Recommendation:** **REFER TO COMMISSIONERS.**
  **Reason:** The procedure runs out of textual guidance at Gate 3. The analyst cannot mathematically subtract Revulsion from Alarm to see if a "net mischief" remains. The Commissioners must decide if the Alarm portion is sufficient to justify the law, or if the prevalence of Revulsion taints the provision.

  ---

  ### 4. WHAT THE PROCEDURE CANNOT DO

  **1. The Quantification Illusion**
  The procedure asks you to weigh "Cost" against "Benefit," but it provides no common currency. You are comparing "psychological harm to a victim" (Case B) against "fiscal cost to the state" (Gate 4). This is a judgment call dressed as arithmetic. In contested cases (like Case C), the "weights" (High/Medium/Low) are arbitrary. If an analyst feels strongly that public disgust *is* harm, they can classify it as "Alarm" to manipulate the outcome. The procedure cannot prevent this bias; it only forces it into the open.

  **2. The "Magistrate" Problem**
  This procedure systematically undervalues stable, deeply held moral intuitions that do not articulate themselves as "harm." The Magistrate Commissioner's concern—that repealing Case A will cause social friction—is a utilitarian concern (unrest is a pain), but the procedure classifies "fear of repeal" as secondary to the "mischief of the act." It cannot account for the pain of *legal change* itself, only the pain of the *conduct*.

  **3. The Rights Blind Spot**
  Bentham's framework has no concept of "rights" that trump utility. If a provision is efficient, profitable, and groundless, but violates a fundamental liberty, this procedure recommends **RETAIN**. We have attempted to patch this in Gate 4 (Secondary Effects), but if the legislature explicitly wants to infringe a liberty for a net social gain, this tool will validate it. It cannot tell the Commission when a right *should* override the calculus.

  **4. The Revulsion/Alarm Boundary**
  The most critical failure point is Gate 3. Distinguishing "Alarm" (I might be harmed) from "Revulsion" (I hate this) is subjective. In Case C, a witness might say, "I am distressed because children might see this." Is that Alarm (harm to children) or Revulsion (moral corruption)? The procedure forces a binary choice where none exists. In close cases, the analyst's personal bias will determine the classification, and the procedure offers no audit mechanism to correct it.

  **5. The Dormancy Trap**
  In Case A, the procedure recommends Repeal because the law is dormant. However, dormancy can be a feature, not a bug (a "sleeping dog" provision used only for plea bargains). The procedure treats dormancy as evidence of "Groundless," but it cannot detect strategic dormancy. It will systematically recommend repealing laws that are rarely used but arguably potent, potentially removing prosecutorial leverage that the legislature intends to keep.

  **Instruction to Analysts:** When you reach these limits, do not guess. Mark the provision **REFER TO COMMISSIONERS**. Your job is to apply the screen, not to resolve the philosophical contradictions inherent in the screen.
