answer: |-
  # Part 1: The One-Page Triage Protocol

  **HEAT-STANDARD TERMINOLOGY TRIAGE**
  *For use during panel deliberations. Time limit: 15 minutes per term.*

  **STEP 0: NECESSITY CHECK**
  *Question:* If we delete this term entirely, does the standard break?
  *Sufficient Answer:* **Yes** (Statute cites it / Rules depend on it) $\rightarrow$ Go to Step 1.
  *Sufficient Answer:* **No** (It is descriptive only) $\rightarrow$ Vote to strike. If vote fails, Go to Step 1.

  **STEP 1: THE BAN**
  *Instruction:* No one may speak the contested term for the next 10 minutes.
  *Refusal:* If a member refuses to describe the concept without the word, the Chair records "Obstruction" and moves to Step 4 (Chair Ruling).

  **STEP 2: THE SUBSTITUTE**
  *Instruction:* Each side must describe the *condition* or *group* they mean without using the banned word.
  *Example:* Instead of "Vulnerable," say "Persons over 75 with cardiac history" OR "Households without AC in Zone B."
  *Sufficient Answer:* A description specific enough that a third party could identify the subject without asking for clarification.

  **STEP 3: THE SURVIVAL CHECK**
  *Question:* Now that we are using the substitutes, do we still disagree?
  *   **No (Disagreement Evaporated):** We were describing the same thing. $\rightarrow$ **Action:** Merge definitions. Adopt the clearer substitute.
  *   **Yes (Disagreement Survives):** Proceed to Classification.

  **STEP 4: CLASSIFICATION & ROUTING**
  *Select the one that fits:*

  1.  **The Split:** The substitutes describe two *different* things that both need tracking.
      *   **Route:** Create two new terms. (e.g., "Clinical Vulnerability" vs. "Infrastructural Vulnerability").
  2.  **The Boundary:** We agree on the thing, but not the cutoff line (e.g., 3 days vs. 5 days).
      *   **Route:** Select the cutoff that minimizes operational error. Chair breaks tie.
  3.  **The Evidence:** We disagree on what the world does (e.g., which metric predicts death).
      *   **Route:** Table for data review. If data remains inconclusive, treat as **The Stipulation**.
  4.  **The Stipulation (Verbal-but-Binding):** We agree on the facts, but the *label* triggers legal money or rules. We must pick one to make the law work.
      *   **Route:** **Chair Ruling.** *Note: "Verbal" does not mean "Unimportant." It means "The science is done; the policy choice remains."*

  **STEP 5: THE MINUTES**
  *Requirement:* The record must state which path was taken and the operational reason for the choice.
  *Forbidden:* Do not record "Panel was confused." Record "Panel determined operational clarity required..."

  ***

  # Part 2: Methodological Translation Notes

  **Distinctions Dropped**
  1.  **Sense vs. Reference:** I removed the philosophical distinction between the meaning of a word (sense) and the object it points to (reference). In this room, if the object pointed to changes based on the definition, the distinction is academic. The *operational consequence* is the only reference that matters.
  2.  **Prescriptivism vs. Descriptivism:** I dropped the question of whether we are describing common usage or dictating new usage. The statute incorporates the term by reference; we are *necessarily* prescribing. Acknowledging this tension wastes time.

  **Distinctions Kept (at the cost of clumsiness)**
  1.  **The "Verbal-but-Binding" Category:** Standard semantic diagnostics often treat "merely verbal" disputes as dissolvable. I kept this category but forced a "Chair Ruling" exit. This makes the procedure clumsier because it admits that some fights are about power/law, not truth, but it is necessary to prevent the panel from spinning forever on legal triggers.
  2.  **The Substitution Ban:** Requiring members to stop using the word feels artificial and slows down fluency. However, without it, members talk past each other using the same label for different concepts. The clumsiness is the price of forcing precision.

  **Where the Chair Decides (Judgment Calls Dressed as Procedure)**
  *   **Step 0 (Necessity):** Determining if the standard "breaks" without a term is a judgment call. A member may argue a term is essential when it is not. *The Chair decides if the statute actually requires the term or just the concept.*
  *   **Step 2 (Sufficient Answer):** Deciding if a substitute is "specific enough" is subjective. *The Chair decides if the description is operationalizable.*
  *   **Step 4 (Evidence vs. Stipulation):** Distinguishing between "we need more data" and "the data won't decide this" is the hardest call. *The Chair decides when to stop requesting evidence and force a policy choice.*
  *   **Step 1 (Refusal):** Determining if a member is genuinely unable to substitute or is refusing obstructively. *The Chair decides if "Obstruction" is recorded.*

  ***

  # Part 3: Application to Contested Terms

  ### 1. Excessive Heat Event
  *   **Classification:** **The Evidence (transitioning to Stipulation).**
  *   **Analysis:** Substitutes are "3 Days > Threshold (Dry)" vs. "Heat Index > Threshold (Humid)." The disagreement survives the ban. It is not a Split (both aim to identify dangerous heat). It is not purely Boundary (the metrics differ). It rests on which metric predicts mortality. Since both have submitted data and the argument spans cycles, the data is likely inconclusive or conflicting. It defaults to a Stipulation: we must pick the metric that best aligns with the standard's goal (health protection).
  *   **Exit:** Chair Ruling based on "Precautionary Principle."
  *   **Glossary Action:** Adopt Humidity-Adjusted Index. Define duration clause separately.
  *   **Minutes Sentence:** "Panel adopted a humidity-adjusted index over dry-bulb temperature for the definition of 'Excessive Heat Event'; while both metrics correlate with heat stress, the humidity-adjusted index was selected to minimize false negatives in mortality prediction where data was inconclusive, prioritizing public health safety."

  ### 2. Heat Emergency
  *   **Classification:** **The Stipulation (Verbal-but-Binding).**
  *   **Analysis:** Substitutes are "Declaration based on Forecast" vs. "Declaration based on Observed Deaths." The disagreement survives. It is not Evidence (both agree on the forecast and the deaths). It is not Boundary (it is a trigger mechanism). It is a policy choice masked as science. The sponsor's request for "scientific grounds" is impossible to fulfill; science predicts harm, it does not dictate funding triggers. This requires a binding decision to make the statute function.
  *   **Exit:** Chair Ruling based on Statutory Intent (Prevention).
  *   **Glossary Action:** Define trigger as Forecast-based. Add note on funding reconciliation.
  *   **Minutes Sentence:** "Panel defined 'Heat Emergency' declaration criteria based on forecasted conditions rather than observed mortality; this determination was made to align with the statutory intent of harm prevention, acknowledging that observed mortality data serves as a lagging indicator incompatible with immediate emergency response requirements."

  ### 3. Vulnerable Population
  *   **Classification:** **The Split.**
  *   **Analysis:** Substitutes are "Registry of Medical Risk" vs. "Map of Infrastructural Risk." The disagreement survives. Both members are correct that the other's list omits people who die, because they are measuring different *pathways* to harm (biological vs. environmental). The third member's objection (strike term) is resolved by the Split: the single term is the problem, not the concepts.
  *   **Exit:** Create two new terms.
  *   **Glossary Action:** Retire "Vulnerable Population." Introduce "Clinically At-Risk Individuals" and "Infrastructurally Exposed Communities."
  *   **Minutes Sentence:** "Panel retired the term 'Vulnerable Population' due to semantic ambiguity affecting operational deployment; replaced with 'Clinically At-Risk Individuals' (person-based registry) and 'Infrastructurally Exposed Communities' (circumstance-based mapping) to ensure distinct data collection protocols for medical and resource-allocation interventions."

  ***

  # Part 4: Limitations and Failure Modes

  **What This Procedure Cannot Do**
  1.  **Detect Value Judgments Disguised as Evidence:** If a member argues for a specific cutoff (e.g., 3 days vs. 5 days) claiming "the data supports 3," but their data selection is biased by a desire to reduce budget impact, this procedure classifies it as **The Evidence**. It will send the panel down a rabbit hole of data auditing that it is not equipped to perform.
      *   *Recognition:* You recognize this when the "data review" cycle repeats more than twice with no change in positions despite new data.
  2.  **Resolve Power Imbalances:** If the Utility Regulator refuses to offer a substitute (Step 1 Refusal) because their legal counsel advised them not to concede semantic ground, the Chair records "Obstruction." However, the Chair may lack the political capital to enforce a ruling against a funding partner.
      *   *Recognition:* You recognize this when the "Obstruction" is recorded but the term remains contested in the next cycle because the obstructing member ignores the Chair's ruling.
  3.  **Handle "Solution Aversion":** Sometimes a member contests a definition not because it is wrong, but because they dislike the mandated action (e.g., opening cooling centers). They will fight the *definition* to avoid the *cost*. This procedure treats it as a Definition fight.
      *   *Recognition:* You recognize this when a member agrees with the scientific description in Step 2 but votes against the operational consequence in Step 4.

  **Final Warning**
  This procedure forces clarity, but it does not generate consensus. It converts "confusion" into "recorded disagreement." In the **Stipulation** cases (Terms 1 & 2), the minutes will show that the Chair overruled a scientific preference for an operational necessity. This is defensible to a lawyer, but it may damage panel cohesion. Use the "Verbal-but-Binding" explanation explicitly in the room to assure the dissenting member that their science was not rejected, only subordinated to the statute's operational requirements.
