  Bottom line: Your mapping is operationally sound for stability but morally incomplete; it exposes performance legitimacy accurately while revealing democratic consent as largely fictional.

  **Grading Your Map**
  *   **Citizens = Tenants:** Halfway. Tenants sign leases; citizens inherit status. Your tenants choose entry; citizens rarely choose birth.
  *   **State = Agent:** Halfway. You serve the board (owners), not the tenants. The state claims to serve the people but acts like an owner.
  *   **Elections = Board Vote:** Dishonest. Your tenants don't vote on management; owners do. If citizens are tenants, elections have no counterpart. If citizens are owners, the map holds, but most citizens feel like tenants.
  *   **Protest = Work Order:** Holds. Both are maintenance requests for systemic failure.
  *   **Legitimacy = Renewal Rate:** Holds. Vacancy is the only metric that matters to owners.
  *   **Loss = Mass Move-out:** Halfway. Mass vacancy bankrupts you; mass revolution destroys the state.

  **Residue: Claims Without Counterparts**
  1.  **Equity Stake:** Political theory claims citizens "own" the state (*res publica*). In property, owners hold equity; tenants hold leases. Citizens cannot sell their share of the nation.
      *   *Verdict:* **Their Vagueness.** "Ownership" is a metaphor politicians treat as literal to demand sacrifice. You know only equity holders get proceeds; citizens get nothing but services.
  2.  **Legislative Power:** Citizens theoretically make laws; tenants follow house rules. You never let tenants vote on pet policies.
      *   *Verdict:* **Their Vagueness.** Most citizens don't legislate; they select managers every few years. Your tenants selecting management (if they could) is functionally identical. The "lawmaking" distinction is inflated to sanctify the state.
  3.  **Monopoly on Violence:** You evict; the state imprisons. Eviction is commercial; imprisonment is moral/physical coercion.
      *   *Verdict:* **Vocab Limit.** Your world lacks the scale of state force. This is a real difference your vocabulary can't capture.
  4.  **Exit Rights (Your guess):** Tenants move; citizens emigrate (hard) or stay.
      *   *Verdict:* **Vocab Limit.** Property law acknowledges exit; political theory pretends consent makes exit unnecessary.
  5.  **Authorization vs. Satisfaction (Your guess):** Tenants want heat; citizens want "voice."
      *   *Verdict:* **Their Vagueness.** Philosophers inflate "voice" to justify power structures that deliver nothing. Your model shows satisfaction is the only real legitimacy.

  **Tally**
  *   **Vocab Limits:** 2 (Force, Exit). These are real structural differences. Property management is a commercial contract; citizenship is a coercive status. Your vocabulary misses the depth of state coercion.
  *   **Their Vagueness:** 3 (Equity, Legislation, Authorization). These gaps reveal that political theorists dress up management contracts as moral covenants to obscure the transaction.

  **Winner:** **Their Vagueness.** The gaps mostly show that philosophers are talking less definitely than they sound. They use "consent" and "ownership" to justify power that rests, like your buildings, on performance. If the heat works, the contract holds. If it breaks, no amount of "authorization" theory keeps the tenants from leaving or the citizens from revolting. Your pragmatism cuts through the noise: legitimacy is delivered, not declared.

  **Didn't fit:** Historical continuity of states vs. finite lease terms; the role of foreign policy/defense in legitimacy; the psychological impact of symbolic representation.
