answer: |-
  **Thesis Proposal: Probabilistic Attribution and the Non-Human Actor**

  **1. Statement of the Question**
  When environmental historians designate non-human entities (volcanoes, pathogens, climates) as "actors," they conflate three distinct claims: causal contribution (did X increase the likelihood of Y?), explanatory salience (should narrative emphasis rest on X?), and agency (did X possess interests or goals?). The objection of "environmental determinism" typically targets salience but is argued at the level of contribution, presupposing a deterministic, "but-for" causality that requires repeatable events and closed systems. Atmospheric science has abandoned this model for probabilistic event attribution, which quantifies how anthropogenic forcing shifts the likelihood of an event relative to a counterfactual baseline.

  This thesis asks: **Does transposing the likelihood-ratio framework of probabilistic event attribution into historical explanation dissolve the charge of environmental determinism leveled against non-human actors, or does the transposition fail because historical counterfactuals are undefined rather than merely unobservable?**

  This question admits a determinate answer. Either the framework can be formally defined for historical cases such that it distinguishes contribution from salience without erasing the cause/condition distinction, or it cannot. If it cannot, the failure will locate precisely where the logical requirements of probabilistic attribution (definable reference worlds, stable background conditions) conflict with the ontological requirements of narrative history.

  **2. Current Positions and the Open Question**
  Three dominant positions in the history and philosophy of science leave this question unresolved. First, proponents of strict symmetry between human and non-human actants (often within Actor-Network Theory) argue for flattening ontological hierarchies. While this grants non-humans causal weight, it often lacks a formal mechanism for weighing *degrees* of influence, leaving the determinism objection intact regarding explanatory salience. Second, those who treat the vocabulary of agency as a harmless metaphor sidestep the causal claim entirely. This preserves human exceptionalism but fails to account for cases where non-human constraints are physically coercive rather than linguistically constructed. Third, critics who view determinism as a political error rather than a conceptual one argue that emphasizing non-human causes disempowers human political action. This is a normative claim that does not address the epistemological validity of the causal inference itself.

  All three positions operate within a deterministic or narrative-based logic of causation. None engage with the probabilistic reframing developed in attribution science. Consequently, the debate remains stuck between "humans decide" and "environment decides," ignoring the third option: "the environment shifted the probability distribution within which humans decided." This project tests whether that third option is logically viable in history.

  **3. Methodology and Work Plan**
  This is a conceptual analysis grounded in comparative case study. I will not generate new historical data but will re-analyze existing historiographical debates through the lens of probabilistic attribution logic. The work will proceed over twelve months on a part-time basis.

  *   **Months 1–3: Framework Construction.** I will formalize the logical requirements of probabilistic event attribution (definition of the event, definition of the counterfactual world, calculation of the risk ratio) and translate these into historical terms. I will define the criteria for when a historical counterfactual is "undefined" versus "unobservable."
  *   **Months 4–7: Case Study 1 (Volcanic Climate).** I will examine the historiography of the 1815 Tambora eruption and the "Year Without a Summer." This case offers a well-defined physical forcing and a relatively stable counterfactual (climate models can simulate 1815 without eruption). I will assess whether historians implicitly use probabilistic reasoning when linking the eruption to social unrest and whether making this explicit resolves determinism objections.
  *   **Months 8–10: Case Study 2 (Epidemic).** I will examine the sixth-century Mediterranean epidemic (Justinianic Plague). Here, the identification of the pathogen (*Yersinia pestis* vs. other pathogens) is contested, and the background conditions (immune landscapes, trade routes) are poorly constrained. This tests the limit of the framework: if the pathogen and the baseline are contested, is the counterfactual world definable? This case specifically targets the risk that the reframing erases the distinction between a cause and a standing condition.
  *   **Months 11–12: Synthesis and Writing.** I will compare the results. If the framework holds for Tambora but fails for the Plague, the thesis will define the boundary conditions for non-human attribution in history. If it fails for both, the thesis will demonstrate why historical explanation requires a different logic of causation than atmospheric science.

  **4. Success and Failure Conditions**
  A **successful result** will produce a formal taxonomy distinguishing causal contribution from explanatory salience in historical narratives. It will demonstrate that using probabilistic language allows historians to acknowledge strong non-human forcing without conceding determinism, provided the counterfactual baseline is explicitly defined. The outcome would be a methodological protocol for "historical attribution."

  A **failed project** will occur if I demonstrate that historical counterfactuals are fundamentally undefined (not just uncertain) due to the uniqueness of historical events, rendering the likelihood ratio incalculable. Alternatively, the project fails if applying the framework collapses the distinction between a *cause* (the eruption) and a *standing condition* (the climate state), thereby making narrative history impossible because every background condition becomes a probabilistic actor. If the transposition destroys the narrative structure it seeks to explain, the hypothesis is falsified.

  **5. Feasibility and Disciplinary Location**
  This project is feasible for one researcher over twelve months on a part-time basis. It requires no fieldwork, no archives, and no laboratory access. The primary materials are published historiographical debates and existing climate/epidemiological models available in the literature. The risk lies in the conceptual complexity, not data acquisition. My background in atmospheric chemistry provides the necessary technical understanding of attribution science, while the current Master's programme provides the philosophical grounding for the historical analysis.

  This is a project in the **philosophy of history**, not historiography. I am not attempting to write a new history of Tambora or the Justinianic Plague, nor am I attempting to settle the historical record regarding what happened. Instead, I am analyzing the logical structure of the explanations historians offer. The object of study is the form of the argument, not the historical events themselves. The goal is to clarify the conditions under which non-human causes can be cited without committing category errors regarding agency and determinism.
