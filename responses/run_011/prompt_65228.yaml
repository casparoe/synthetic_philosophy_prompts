      *   *Diagnosis:* The core is *Modal Access*. How do we know what is possible/necessary?
      *   *The "Too Irenic" Point:* The empirical claim isn't about brain states; it's about epistemic dependence.
      *   *The Residue Test:* It fails because of the "Tacit Premise" loophole.
      *   *Better Test:* The "Independence Criterion." Can you state the premises *before* running the TE without begging the question?
      *   *Progress:* Acknowledge that "Reconstructibility" is trivial (anything can be an argument post-hoc). The question is "Reconstructibility *without loss of epistemic priority*."

  9.  **Final Polish:** Ensure no name-dropping (Brown/Norton are mentioned by user, but I shouldn't cite papers). Keep it focused on the *structure* of the disagreement. Make sure to answer the specific prompt requirements (diagnose, progress, residue test evaluation).

      *(Self-Correction during drafting)*: I need to be careful not to just side with one camp. The goal is to analyze the *stalemate*. The user's hypothesis about the "empirical question" is the weakest link. Philosophers deny it's empirical. I should point out that treating it as empirical is a category mistake *unless* we redefine the project. But the "Modal" angle is stronger.

      *Revised Plan:*
      1.  Validate the "three disputes" but argue they are entangled, not separate.
      2.  Identify the real substantive core: *Epistemic Dependence* (Order of justification).
      3.  Critique the Residue Test: It's vulnerable to the "Suppressed Premise" defense.
      4.  Propose the "Antecedent Certainty Criterion" as a better diagnostic.
      5.  Define progress: Shifting from "Can it be reconstructed?" to "Does the reconstruction preserve the justificatory order?"

  10. **Final Review against constraints:** No bibliography. No name-dropping (beyond what user said). Push the hypothesis. Tell them if the test is worthless.

      *Wait, one more thought:* The user asked if there's a formal question about whether reconstructibility has an upper bound. I should address that. Yes, the bound is *informational*. If the TE generates new modal knowledge, the argument reconstruction must contain that knowledge in the premises. If the premises are less certain than the conclusion, the argument is epistemically circular *unless* the TE justifies the premises. This is the key.

