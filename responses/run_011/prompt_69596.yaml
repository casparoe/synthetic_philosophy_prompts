answer: |-
  # Joint Statement on Representational Structure in Transformers

  **Context and Case Study:** This collaboration focuses on a specific empirical setup: a decoder-only transformer trained on a synthetic language governed by productive role–filler syntax (e.g., `Agent-Verb-Patient`). The model demonstrates behavioral systematicity, generalizing to role–filler combinations absent from training data. Activation patching interventions on internal residuals recover linear directions that causally influence which filler is reported for a specific role. Party A argues this evidences internal symbolic structure (Language of Thought). Party B argues this evidences high-dimensional geometric approximation where symbolic descriptions are lossy compressions of vector dynamics. We agree to restrict claims to this architecture and task class unless otherwise noted.

  ### 1. Agreed Claims

  Both parties endorse the following claims regarding the case study and the limits of current interpretability evidence:

  1.  **Causal Relevance ≠ Representational Format:** Activation patching establishes that specific activation subspaces are causally relevant to the output behavior. It does not establish whether the information in those subspaces is encoded discretely (symbols) or continuously (vectors).
  2.  **Probe Limits:** Linear probes establish an upper bound on the information locally available in a layer. A successful probe does not prove the model *uses* that information in the way the probe assumes; it only proves the information is recoverable by an external observer.
  3.  **Behavioral Insufficiency:** Behavioral systematicity (generalizing to unseen combinations) is necessary but not sufficient evidence for internal constituent structure. A model could achieve this via continuous interpolation in embedding space or memoization of higher-order n-grams without discrete variable binding.
  4.  **Retired Arguments (Party A Concession):** Party A agrees that the classic Fodorian argument from *pure behavioral systematicity* is retired in the context of neural networks. Observing correct OOD generalization alone no longer justifies the inference to symbolic internal structure, given that connectionist systems can mimic this behavior via vector arithmetic.
  5.  **Biting Arguments (Party B Concession):** Party B agrees that arguments regarding *causal isolation* still bite. If patching a specific "role" subspace swaps the filler without disrupting unrelated roles, this constrains purely holistic models. The internal structure cannot be entirely unstructured; there is modular causal dependence.
  6.  **Task Contamination:** Both parties agree that structure observed in the model may be partially induced by the training distribution. If the synthetic language enforces strict syntax, the model's "structure" may reflect the data manifold rather than an inductive bias for symbolic reasoning.
  7.  **Operational Utility:** Regardless of ontological status, treating the model as if it has role–filler structure is a valid engineering abstraction for debugging, provided the abstraction breaks down predictably under stress (e.g., adversarial perturbations).

  ### 2. Disagreements Table

  | Contested Claim | Party A Wording (Structuralist) | Party B Wording (Deflationist) | Type | Reason Wording Matters |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Representation** | The model instantiates **variables** that bind fillers to roles via discrete operations. | The model maintains **subspaces** where filler information is superposed, approximating variable binding via geometry. | Substantive | Party A requires discrete state changes for compositionality; Party B requires continuous trajectories to explain gradient flow. |
  | **Source of Generalization** | Generalization to OOD combinations is driven by **syntactic rules** implemented in the attention circuit. | Generalization is driven by **metric similarity** in embedding space allowing interpolation between training points. | Substantive | Party A predicts sharp boundaries in capability; Party B predicts graceful degradation as OOD distance increases. |
  | **Status of "Symbols"** | The directions recovered by patching are **symbols** because they function causally as units in a combinatorial system. | The directions are **features** because they lack atomicity and participate in polysemantic superposition. | Terminological | Party A defines symbols by functional role; Party B defines symbols by physical discreteness. |
  | **Explanation Depth** | A symbolic description is the **canonical explanation** of the model's computation. | A symbolic description is a **lossy compression** of the actual vector-matrix multiplication dynamics. | Substantive | Party A believes the symbolic level captures the *cause*; Party B believes only the weights/activations capture the *cause*. |

  ### 3. Four Cruxes

  These are empirical tests where parties have made distinct predictions. Settling these would force concessions.

  **Crux 1: Orthogonality of Role Bindings**
  *   **Experiment:** Train a model on `A-V-B`. Construct a patching intervention that swaps the `Agent` vector while holding the `Patient` vector constant, and vice versa. Measure interference.
  *   **Party A Prediction:** Interventions are orthogonal. Swapping `Agent` does not degrade `Patient` accuracy (>95% retention).
  *   **Party B Prediction:** Interventions interfere due to superposition. Swapping `Agent` causes measurable noise in `Patient` retrieval (<90% retention) because subspaces are not perfectly disjoint.
  *   **Concession Condition:** If interference is statistically negligible across seeds, Party B concedes the model implements functionally discrete bindings. If interference scales with model capacity constraints, Party A concedes bindings are graded approximations.

  **Crux 2: Polysemanticity of Role Directions**
  *   **Experiment:** Analyze the top principal components of the "Agent" subspace recovered by probing. Test if these neurons/directions also encode unrelated features (e.g., token frequency, position) when queried on non-syntactic tasks.
  *   **Party A Prediction:** Role-specific directions are monosemantic within the syntactic circuit. They do not activate for non-syntactic tasks.
  *   **Party B Prediction:** Role-specific directions are polysemantic. The same directions used for `Agent` binding will encode statistical regularities of the `Agent` position unrelated to syntax.
  *   **Concession Condition:** If directions are strictly monosemantic, Party B concedes specialized symbolic circuitry exists. If directions are highly polysemantic, Party A concedes "symbols" are emergent properties of multi-use features.

  **Crux 3: Composition Operation Locality**
  *   **Experiment:** Use causal tracing to locate the exact layer/head where `Agent` and `Verb` combine to predict `Patient`.
  *   **Party A Prediction:** A specific head or MLP layer acts as a "binder" operation, distinct from storage heads.
  *   **Party B Prediction:** Binding is distributed across multiple layers via residual stream accumulation; no single locus exists.
  *   **Concession Condition:** If a single layer accounts for >80% of the binding causal effect, Party B concedes modular operation. If the effect is distributed evenly across 5+ layers, Party A concedes there is no distinct "syntax engine."

  **Crux 4: Scaling and Structure Sharpness**
  *   **Experiment:** Train models of increasing size (10M to 1B params) on the same data budget. Measure the linearity of the recovered role subspaces.
  *   **Party A Prediction:** Structure sharpens with scale. Larger models converge to cleaner, more discrete symbolic representations.
  *   **Party B Prediction:** Structure blurs or remains constant. Larger models utilize higher-dimensional superposition, making linear probes less accurate relative to model complexity.
  *   **Concession Condition:** If subspace linearity increases significantly with scale, Party B concedes symbols are a limit behavior. If linearity decreases, Party A concedes symbols are a small-model artifact.

  ### 4. Joint Glossary

  To prevent verbal disputes, we distinguish four categories of "structure." Much of our year-long argument stemmed from conflating these terms.

  1.  **Structure in Content (Semantics):** The logical relationships between the meanings represented (e.g., "Agent acts on Patient").
      *   *Status:* Agreed. The task *has* this structure.
  2.  **Structure in the Vehicle (Representation):** The format of the activation patterns storing the information (e.g., discrete one-hot vectors vs. distributed overlapping vectors).
      *   *Status:* **Disputed.** Party A claims vehicle structure mirrors content structure. Party B claims vehicle structure is continuous geometry.
  3.  **Structure in Causal Dynamics (Computation):** The flow of information through the network (e.g., distinct modules passing messages vs. global residual updates).
      *   *Status:* **Partially Disputed.** Both agree there is modularity (Section 1, Claim 5), but disagree on whether modules correspond to syntactic operations.
  4.  **Structure in Training Distribution (Task):** The statistical regularities in the data (e.g., strict grammar rules in the synthetic corpus).
      *   *Status:* Agreed. The data *has* this structure.

  **Diagnosis of Past Argument:**
  *   **Verbal Disagreements:** Arguments over whether the model "has symbols" were often conflations of *Content Structure* and *Vehicle Structure*. Party A argued from Content (the model solves a symbolic task); Party B argued from Vehicle (the activations are vectors). Once distinguished, we agree the model processes Content Structure using Vehicle Structure that *approximates* symbolic vehicles.
  *   **Substantive Disagreements:** Disagreements regarding *Causal Dynamics* survive disambiguation. Party A claims the causal graph is isomorphic to a syntax tree. Party B claims the causal graph is a dense mesh that only *looks* tree-like when projected onto specific subspaces. This is not terminological; it is a claim about the computational graph.

  ### 5. Closing Statement on Compositionality

  We agree that compositionality should be treated as admitting of degrees rather than as an all-or-nothing property. A system is compositional to the extent that the representation of a complex input is determined by the representations of its parts and the method of combination, independent of specific training examples. The dispute does not depend on settling this question as binary; rather, it depends on *where* the degree lies. Party A argues the model operates above a threshold where discrete symbolic explanation is the most efficient causal model. Party B argues the model operates below that threshold, where continuous geometric explanation is more efficient. Settling the Cruxes above will determine whether the "degree of compositionality" is high enough to warrant the engineering overhead of symbolic tooling, which is the practical outcome both parties seek.
