      *   **Pedagogy:** In-class role-play, no lecture beforehand, "Dead Donor Rule" revealed only in debrief.
      *   **Structure:** Three "Determination Committees" with different rulebooks.
      *   **Key Mechanism:** Recorders write a specific one-sentence template defining death in each round. Comparison of Round 1 vs. Round 3 sentences is the "reveal."
      *   **Cases:**
          1.  Ventilated, heartbeat present, no brainstem/cortical function (Family asking "is he in there?").
          2.  Brainstem infarct, apneic/areflexic, *reactive EEG* (Should split committees).
          3.  DCD (Donation after Circulatory Death), 2 vs. 5 min no-touch, auto-resuscitation worry, regional perfusion question.
      *   **Specific Constraint:** One committee knows transplant team is waiting/audited.
      *   **Deliverables:** Role cards, packets, ledger sheet, timeline, debrief guide, troubleshooting, limitations, small group adaptation (10 students).
      *   **Format:** Print-ready, no citations/reading lists.

  2.  **Deconstruct the Logic & Ethics:**
      *   *Committee A (Whole Brain):* Requires irreversible cessation of *all* functions of the *entire* brain (including brainstem).
      *   *Committee B (Brainstem):* Requires irreversible cessation of *brainstem* function only (cortical activity doesn't matter if brainstem is gone).
      *   *Committee C (Circulatory/Religious Objection):* Cannot use neurological criteria. Must wait for heart/lungs to stop irreversibly.
      *   *Case 1:* Fits Whole Brain & Brainstem (Dead). Fits Circulatory (Alive).
      *   *Case 2:* Fits Brainstem (Dead). Fits Whole Brain (Alive - EEG reactive). Fits Circulatory (Alive). *Crucial conflict point.*
