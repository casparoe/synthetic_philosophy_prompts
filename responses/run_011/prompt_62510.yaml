          *   *Case 1:* Ventilated, HR 80, BP stable. Pupils fixed, no gag, flat EEG.
          *   *Case 2:* Ventilated, HR 90. No brainstem reflexes. *EEG shows reactive alpha waves.* (This kills Whole Brain, saves Brainstem).
          *   *Case 3:* Withdrawal of life support. Heart stops. Timer starts. 2 mins vs 5 mins. NRP (Normothermic Regional Perfusion) question.

