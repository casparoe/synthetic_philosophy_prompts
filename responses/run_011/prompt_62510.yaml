          *   *Refining Roles for 8 students:* Chair, Recorder, Clinician, Legal, Family Liaison, Transplant Liaison (only for specific rounds?), General Member 1, General Member 2.
          *   *Actually, keep it modular.* 3 Groups of 8.
          *   Roles: Chair, Recorder, Clinician, Legal Officer, Family Rep, General Members (3).
          *   *Special Instruction:* Group 3 gets the "Audit" note in Case 3 packet.

      *   **The Rulebooks:**
          *   Group 1: Whole Brain (Cortical + Brainstem).
