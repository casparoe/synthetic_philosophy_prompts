answer: |-
  **INSTITUTE FOR APPLIED EPISTEMOLOGY**
  **STANDARD OPERATING PROCEDURE**

  **Motto:** "Cognitive processes ain't (all) in the head!" (Ref: Policy Directive 98-01)
  **Document No:** SOP-COG-004 **Revision:** 2.0 **Effective Date:** 01-OCT-2023
  **Owner:** Director of Cognitive Compliance **Approver:** Quality Assurance Manager

  **1.0 PURPOSE**
  To establish requirements for registering, maintaining, and auditing external cognitive artifacts under the Extended Mind Policy. This procedure ensures functional parity between biological memory storage and non-biological registered artifacts. Compliance is mandatory for all personnel operating under the Extended Mind Thesis framework.

  **2.0 SCOPE**
  This procedure applies to all personnel and Registered Cognitive Artifacts (RCA). Any operation that would unhesitatingly be counted as cognitive if performed intracranially is counted as cognitive when performed on an RCA. Scope includes personal notebooks, digital devices, and potentially facility infrastructure (e.g., fire alarms, building layout, coffee machines) pending boundary review by the Document Owner.

  **3.0 DEFINITIONS**
  **3.1 Registered Cognitive Artifact (RCA):** An external physical structure meeting four criteria: (1) Constant availability to the user; (2) Retrieval without excessive difficulty; (3) Contents automatically endorsed rather than re-interrogated; (4) Endorsed by user at moment of entry.
  **3.2 Algorithmic Interference:** RCA status is void if content selection is mediated by non-transparent algorithms (e.g., predictive phone feeds), violating Criterion 3 regarding automatic endorsement.
  **3.3 Cognitive Merger:** The temporary integration of two distinct cognitive systems via artifact lending.

  **4.0 RESPONSIBILITIES**
  **4.1 User:** Maintain RCA integrity. Report loss or destruction immediately via Form COG-LOSS.
  **4.2 Quality Assurance (QA):** Audit RCA compliance. Process Nonconformance Reports (NCR).
  **4.3 Document Owner:** Resolve boundary disputes regarding scope creep and osmotic incorporation.

  **5.0 PROCEDURE**
  **5.1 Registration:** Submit artifact for inspection. Verify Criteria 3.1 are met. Tag artifact with unique ID.
  **5.2 Loss or Destruction:** Classify severity based on data criticality.
  **5.2.1** Severity 1: Loss of core identity data. Incident Form requires declaration of temporary cognitive impairment and suspension of lab access.
  **5.2.2** Severity 3: Minor data loss. Corrective action required within 24 hours.
  **5.3 Lending Prohibition:** Lending an RCA is strictly prohibited. This constitutes unauthorized temporary cognitive merger and risks annotation of another agent's belief system. Violators face disciplinary review.
  **5.4 Shared Artifacts:** Shared notebooks require dual custody. Entries must be reviewed by both parties to prevent belief contamination. Sign-off required on every page.
  **5.5 Boundary Problems:** If uncertainty exists regarding whether an object (e.g., a manual read 400 times) has become part of the user via osmosis, contact Document Owner. Do not assume incorporation. Current policy treats infrastructure as grey area.

  **6.0 RECORDS**
  **6.1** Subject O. (Notebook-dependent) and Subject I. (Internal-recall control) data must be treated identically regarding chain of custody. Discrepancies in retrieval speed are not valid grounds for data rejection.
  **6.2** Records of Subject O.'s notebook are legal equivalents of Subject I.'s hippocampal data. Storage conditions for notebooks must match environmental controls for biological samples.

  **7.0 NONCONFORMANCE AND AUDIT**
  **7.1** Internal audits may challenge scope. Recent NCR filed by Lead Auditor argues causal coupling does not equal constitution.
  **7.2** Auditor Analogy: Coupling to a fire hydrant does not make the hydrant part of the fire engine; coupling to a coffee machine does not integrate it into the lab's digestive system.
  **7.3** If scope creep (see 2.0) is not contained, accreditation status is at risk. Scope narrowed per Revision 1.0 following this finding. Future expansions require VP approval.

  **8.0 REVISION HISTORY**
  **Rev 0.0:** Initial issue. Broad scope included all coupled systems.
  **Rev 1.0:** Scope narrowed following Audit NCR-2022-04 regarding constitutive vs. causal claims. Infrastructure removed from mandatory registration.
  **Rev 2.0:** Clause 5.3 reinstated after Incident Report IR-009 (Unauthorized lending of notebook resulted in disputed belief attribution).

  **END OF DOCUMENT**
