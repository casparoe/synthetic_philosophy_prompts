  ### The Teacher's Verdicts

  **Case 1: The Interpolation Font**
  **Verdict:** *"It's an a, but it's a bad citizen."*
  **Why:** She distinguishes between *identity* and *membership* (see the Futura/Caslon verdict). Because the mark was deliberately installed as an 'a' and recognized as one in isolation (95%), it satisfies the requirement of **intent** and **basic legibility**. However, because it creates a "car crash" next to its siblings, it fails the test of **systemic harmony**. She accepts the letter's identity but rejects its fitness for the specific hand, much like she accepted the Futura 'a' as an 'a' while noting it "isn't one of ours."

  **Case 2: The Historical Manuscript (800 AD)**
  **Verdict:** *"To them, an a. To us, a picture of one."*
  **Why:** Her rule is time-bound. In Case 3 (the coffee ring), she rejected a mark that *looked* like an 'a' because it lacked intent. Here, intent existed, but the **communicative context** has expired. Since modern readers "reliably call it something else," it no longer functions as a letter in the living language. She treats it as a historical artifact rather than a functional grapheme, prioritizing current utility over ancestral lineage.

  ***

  ### The Actual Rule: Contextual Intentionalism

  The teacher is running a rule of **Contextual Intentionalism**. A mark counts as a letter if:
  1.  **Intent:** It was produced with the intention of being that letter (rules out the coffee ring).
  2.  **Recognition:** It is recognizable as that letter within a relevant community or context (rules out the historical manuscript for modern use).
  3.  **Context:** Its validity is graded by how well it fits its immediate system (rules out the interpolation font as a "good" 'a', distinguishes the Futura from the Caslon).

  This is not a binary definition of *what an 'a' is*, but a pragmatic assessment of *how an 'a' functions*.

  ***

  ### Alternative Rules (The Split)

  Here are two alternative theories that fit the original six verdicts but diverge on the new cases.

  **Alternative A: Lineage Essentialism**
  *   **The Rule:** A mark is a letter if it descends from the accepted genealogy of that letter and was created with intent, regardless of current legibility.
  *   **Fits Cases 1–6:**
      *   Kid's 'a': Has lineage (single-story tradition).
      *   Coffee Ring: No lineage (accidental).
      *   Futura/Caslon: Both have valid lineages.
      *   Wall Mark: Ambiguous lineage (hence the guess).
  *   **The Split:**
      *   **Interpolation Font:** **YES.** (It is a deliberate descendant of the 'a' family).
      *   **Historical Manuscript:** **YES.** (It is the ancestor of the modern 'a').
  *   **Difference:** Unlike the teacher, this rule grants the historical manuscript full status as an 'a' *now*, not just historically.

  **Alternative B: Strict Systemic Coherence**
  *   **The Rule:** A mark is a letter *only* if it functions coherently within its specific typeface or hand system.
  *   **Fits Cases 1–6:**
      *   Kid's 'a': Fits the "kid's writing" system.
      *   Coffee Ring: Fits no system.
      *   Futura in Caslon: Fails the Caslon system ("isn't one of ours" becomes "doesn't count here").
      *   Wall Mark: No system to ground it.
  *   **The Split:**
      *   **Interpolation Font:** **NO.** (It crashes with its siblings; it breaks the system).
      *   **Historical Manuscript:** **NO.** (It does not fit the modern writing system).
  *   **Difference:** Unlike the teacher, this rule rejects the interpolation font entirely, not just as a "bad citizen" but as an invalid mark within that font.

  ***

  ### Graded vs. Binary

  Her judgments are explicitly **graded**.
  *   **Evidence:** "Slightly rude" (Case 2), "Isn't one of ours" (Case 5), "Have to guess" (Case 6).
  *   She does not ask "Is this an a?" She asks "How much of an a is this, and for whom?" The coffee ring is 0% (stain). The kid's 'a' is 100% (obviously). The Futura in Caslon is 100% identity but 0% membership. The interpolation font is 95% identity but low coherence. The historical manuscript is 100% historical identity but 0% current function.

  ***

  ### The Decisive Test Case

  To distinguish between **Contextual Intentionalism** (Teacher), **Lineage Essentialism** (Alt A), and **Strict Systemic Coherence** (Alt B), present this case:

  **The Case:** *A modern calligrapher deliberately draws the Historical Manuscript 'a' (from Case 2) in a contemporary English poem. She intends it as an 'a'. She shows it to a group of modern readers without explanation. None of them recognize it as an 'a'; they think it is a decorative flourish or a different letter entirely.*

  *   **Teacher (Contextual Intentionalism):** **"It's a failed attempt."** (Intent exists, but current recognition/context fails. It is not functioning as a letter).
  *   **Alt A (Lineage Essentialism):** **"It is an a."** (Intent + Genealogy are sufficient, regardless of reader failure).
  *   **Alt B (Strict Systemic Coherence):** **"It is not an a."** (It does not cohere with the modern system).

  *Why this works:* The Teacher and Alt B agree on the "No," but for different reasons (Function vs. System). However, if you tweak the case slightly—**"She explains to the readers beforehand: 'This symbol is my a'. The readers then accept it."**—the **Teacher** switches to **"Yes"** (a new context/contract is formed), while **Alt B** remains **"No"** (the system is still incoherent). This single variable (the explanation/contract) isolates the Teacher's reliance on *living context* from the other two rules.
