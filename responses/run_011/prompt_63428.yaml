answer: |-
  This is an excellent observation for an EPQ. You have identified a genuine tension in the system that philosophers of medicine and disability scholars argue about constantly. You are right to feel that the situation with your two friends exposes a contradiction.

  Here is a breakdown of the philosophical presuppositions in the current system, an analysis of your proposed alternative, and an assessment of how much of this is philosophy versus bureaucracy.

  ### 1. What theory of disease does the current system presuppose?

  The current system (the Joint Council for Qualifications rules in England) is not consistent. It quietly mixes two opposing philosophical theories without admitting it.

  **Theory A: Statistical Naturalism**
  This is the view that a "disorder" is a biological or psychological fact that can be measured objectively, independent of what society thinks.
  *   **Where we see it:** The requirement for standardised scores below 85 (roughly the bottom 16% of the population). This assumes that being "disordered" is the same as being "statistically abnormal."
  *   **The Problem:** As you noted, why is there a hard cut-off? Biologically, processing speed is a spectrum. A score of 86 is functionally almost identical to 84. By drawing a line, the system pretends there is a qualitative difference (sick/healthy) where there is only a quantitative one (slow/less slow).
  *   **Why only one tail?** You asked why we don't take time off kids who write too fast. Naturalism doesn't actually require this. The goal of the adjustment is to remove a *disadvantage*. Writing fast is not a disadvantage in an exam; writing slowly is. So, the system uses Naturalist *measurements* to find a problem, but Normative *values* to decide which end of the spectrum counts as a problem.

  **Theory B: Normativism (specifically the Social Model)**
  This is the view that "disability" is not just a fact about the body, but a fact about the relationship between the body and the environment.
  *   **Where we see it:** The "Normal Way of Working" (NWOW) rule. This rule says you only get the adjustment if you have *already* been treated as needing it.
  *   **The Implication:** This implies that your "disability status" is partly created by your school's past decisions. If your school had been more accommodating, you would be "disabled" (in the legal sense) now. If they were stricter, you are not.
  *   **What this rules out:** It rules out strict Biological Naturalism. If disability were purely a biological fact (like a broken arm), it wouldn't matter what your school did in Year 7. The fact that the school's history matters proves the system assumes disability is partly social.

  **Confidence:** High. It is clear from the rules that they require biological evidence (scores) *and* social evidence (history of support).

  ### 2. The "Normal Way of Working" Paradox

  The situation with your two friends highlights a specific philosophical conflict.

  *   **Friend 1 (ADHD):** The system treats his slowness as a **medical entitlement**. Because he has a diagnosis and a history, his slowness is viewed as an intrinsic defect that *must* be accommodated.
  *   **Friend 2 (No Diagnosis):** The system treats his slowness as a **performance failure**. Because he lacks the paperwork, his slowness is viewed as a lack of resilience or preparation.

  **The Philosophical Contradiction:**
  The system claims to be testing "History knowledge" (or Maths, etc.), not "Writing speed." If that were truly the case, the speed of the hand shouldn't matter for *either* student. By denying Friend 2, the system admits that it *is* testing writing speed for everyone who hasn't been successfully labelled as disabled.

  The NWOW rule protects the system from having to admit that *exams themselves* are biased against slow writers. It shifts the blame from the *exam design* to the *student's history*. It says: "We will only fix the unfairness for people we promised to fix years ago."

  **Confidence:** High. This is the most logically fragile part of the access arrangement rules.

  ### 3. Evaluating Your Alternative (Universal Testing + Sliding Scale)

  You proposed: Forget diagnoses. Test everyone in Year 10. Give extra time proportional to how far below the median they are.

  **Would this be more faithful to the goal?**
  Yes. If the goal is truly to measure "knowledge rather than speed," your system is superior. It acknowledges that speed is a continuous variable. It removes the "lottery" of whether your primary school gave you support. It treats the exam as the thing that needs adjusting, not the student as the thing that needs fixing.

  **What would it break?**
  1.  **The Legal Distinction:** The Equality Act distinguishes between "disabled" and "non-disabled." Your system effectively says "everyone is on a spectrum of ability." This dissolves the legal category of disability. If everyone gets an adjustment based on their score, "reasonable adjustment" becomes "universal design." While many philosophers argue this is *better*, it breaks the current legal framework which is built on protecting a specific minority group.
  2.  **The "Construct" of the Exam:** Exam boards argue that some speed is necessary. You need to write fast enough to show you know the material. A sliding scale might give 50% extra time to the slowest writers. The board would argue this changes the exam from "History Knowledge" to "History Knowledge with unlimited time," which might allow students to write everything they know rather than selecting the most relevant points. (Though one could argue this is a better test of knowledge).
  3.  **Resource and Stigma:** Currently, only a few get extra time. In your system, roughly 50% of the cohort would get *some* extra time (everyone below the median). This might dilute the value of the adjustment or make it logistically impossible to administer.

  **Confidence:** Medium-High. The theoretical fairness is clear, but the practical consequences on the legal framework are complex.

  ### 4. Is the Practice Philosophically Determined?

  You asked if a Naturalist and a Normativist could both sign off on these rules for mundane reasons. The answer is **yes**. This is the most important point for your EPQ.

  The current system is **underdetermined** by philosophy. This means the rules don't follow logically from one single theory. Instead, they are a compromise driven by administrative convenience.

  *   **Why the Cut-off?** Not because 85 is biologically magical. But because psychologists and schools need a clear "Yes/No" decision to process thousands of applications quickly.
  *   **Why NWOW?** Not purely because of a philosophical view on disability. But because it prevents fraud. If any student could claim extra time in the week before the exam without prior evidence, the system would be flooded. The NWOW rule is a firewall against gaming the system.
  *   **Why the Two Tracks?** The legal track (Equality Act) exists to protect civil rights. The "temporary injury" track exists for pragmatism. The system mixes them because it has to serve both law and logistics.

  So, a strict Naturalist could accept the system as a "good enough" proxy for biological truth. A strict Normativist could accept it as a "necessary social compromise." The system isn't philosophically pure; it's bureaucratically stable.

  **Confidence:** Medium. We can infer this from how the rules change frequently based on administrative pressure, not new scientific discoveries.

  ### 5. Confidence Statement and Least Certain Point

  **Overall Confidence:**
  I am **highly confident** (90%+) that the current system mixes Naturalist and Normative elements inconsistently. I am **highly confident** that your proposed alternative is more philosophically consistent with the stated goal of testing knowledge over speed.

  **The Point of Least Certainty:**
  I am **least certain** (about 60% confidence) about the **primary motivation behind the "Normal Way of Working" rule.**

  *   **Why?** I have analysed it as a philosophical contradiction (making disability dependent on school history). However, it is equally possible that the rule is driven almost entirely by **fraud prevention and resource management**, with the philosophical justification added later to make it sound respectable.
  *   **The Uncertainty:** If the rule is purely bureaucratic (stopping parents from demanding extra time at the last minute), then criticising it on philosophical grounds (that it contradicts Naturalism) might miss the point. The policymakers might not *care* about philosophical consistency; they care about stopping the system from being overwhelmed.
  *   **Why this matters for your EPQ:** If you argue the system is "philosophically wrong," you must also address the counter-argument: "It is administratively necessary." A system can be philosophically messy but practically required. Distinguishing between "bad philosophy" and "hard pragmatism" is the hardest part of this topic.

  **Summary for your Project:**
  Your intuition is correct. The system treats disability as a biological fact when it suits them (the testing) and as a social construct when it suits them (the history rule). Your alternative fixes the philosophical inconsistency but creates administrative chaos. The "truth" of the system is that it is a bureaucratic compromise, not a philosophical stance.
