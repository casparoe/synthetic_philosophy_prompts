      *   **The Current System (JCQ/Access Arrangements in England):**
          *   Requires evidence of impairment (standardised scores < 85).
          *   Requires evidence of "Normal Way of Working" (NWOW).
          *   Distinguishes between "disability" (Equality Act) and "temporary/other" needs.
          *   Goal: Reasonable adjustment, not changing the construct being tested.
      *   **The User's Observation:** The NWOW rule makes the "disability" status dependent on past institutional behavior, not just current biology. This leans heavily towards Normativism/Social Model, even if the testing part looks Naturalist.
      *   **The User's Proposal:** Universal screening + sliding scale adjustment. Removes diagnosis and NWOW.

