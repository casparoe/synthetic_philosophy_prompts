prompt: |-
  I'm in Year 13 and doing my EPQ on the philosophy of medicine, sort of — really I've got fixated on something that happened at my school this year and I can't stop thinking about it. In England, if you want extra time in your GCSEs or A-levels (25% is the usual amount) you don't just get it because a teacher thinks you're slow. You have to be tested, usually by an educational psychologist, and the tests produce standardised scores which get compared against a norm — our SENCo said you basicly need scores below a certain cut-off, something like 84 or lower, in two different areas of speed of working — and then on top of that the school has to confirm that extra time is your "normal way of working", i.e. that you've actually been getting it in class tests and coursework all along, and the SENCo signs off. There's also a separate track: if you count as disabled under the Equality Act you're legally entitled to a reasonable adjustment, but if you've just got, say, a broken writing arm you can get the same arrangement without it being a right. And the whole thing is supposed to be governed by the idea that the adjustment cant change what the exam is actually testing, or give you an unfair advantage.

  Here's the bit that wound me up. Two of my mates both write painfully slowly and both did badly in timed conditions. One has an ADHD diagnosis, and his last school had already been giving him extra time in every test since Year 7, so his application went through in about a week. The other has no diagnosis, and nobody had ever given him extra time in class, so he was turned down — not because his scores were better, they weren't, but because it wasn't his normal way of working. Same impairment, opposite verdicts, and the difference was entirely a fact about what two schools had done in the past. So: what theory of disease or disorder does this whole setup presuppose, if it has one? When they decide on the basis of a score against a norm, are they assuming that being disordered just is being statistically abnormal at some function — in which case why is there a hard cut-off rather than a sliding scale, and why does only one tail of the distribution count as medical, when nobody has ever proposed taking time off the kids who write too fast? And when they bolt on the normal-way-of-working rule, are they assuming something stranger still — that whether you have the disability partly depends on how your institution has already treated you? Which rival account does that quietly rule out, the one where there's a biological fact of the matter about whether someone's functioning is impaired regardless of what anyone expects of them? I know there's a debate about naturalism versus normativism in this area but I've only read a couple of magazine-ish articles, so please don't assume I have the terminology, and don't put in references — I can't look anything up and I don't want to be sent off hunting for books I've never heard of.

  Then tell me what would have to change if you swapped the presupposed view for its rival. I've been sketching an alternative where the board forgets diagnoses entirely: everyone sits a ten-minute handwriting test at the start of Year 10, they rank the whole year group, and you get extra time in proportion to how far below the median your writing speed is — no psychologist, no report, no school history. Would that be more faithful to what the current system says it's for (measuring how much history you know rather than how fast you can write), or would it break something the current system is protecting, like the distinction between the legal-entitlement track and the everyone-else track? And be straight with me about how far the practice really forces a philosophical position: maybe it's underdetermined, and a naturalist and a normativist could both sign off on exactly these rules for mundane administrative reasons, in which case say so and tell me which parts are genuinely load-bearing. Finally, I'd like you to be explicit about how confident you are in each of the main claims you make, and to single out the one point you're least sure of and why — I'd much rather know where you're guessing than have everything delivered in the same flat tone.
