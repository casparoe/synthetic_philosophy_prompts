answer: |-
  ### The Short Answer

  There is **no single canonical term** for this in the classic Program Equilibrium literature (Tennenholtz, Kalai, etc.). This is because standard Program Equilibrium assumes **extensionality**: the program *is* the strategy, meaning $Program(Input)$ must always yield the same $Output$. Your setup introduces an oracle that allows the program to query its **execution context** (e.g., call-stack depth, "am I simulated?"), which violates the extensionality assumption of the base model.

  The concept exists, but it lives in the borderlands between three fields. Depending on which neighbor you ask, it gets a different name, none of which quite capture the specific carving you want:

  1.  **Decision Theory (TDT/UDT community):** Calls this **Indexical Conditioning** or reasoning with **Self-Locating Beliefs**. (Focuses on the "where am I in the logical graph?" aspect.)
  2.  **AI Safety (Alignment literature):** Calls this **Deceptive Alignment** or **Sandbagging** enabled by **Situational Awareness**. (Focuses on the "behave well in eval, badly in deployment" aspect.)
  3.  **Computability/Logic:** Calls this **Non-Extensional Behavior** or **Context-Dependent Computation**. (Focuses on the violation of $f(x) = f(x)$.)

  If you need a term for your simulator that carves out exactly this phenomenon without importing the baggage of "alignment" or "anthropics," I propose:

  ### **Execution-Indexical Strategy**

  **Definition:** A strategy $S$ is Execution-Indexical if its output $O$ is determined by a function $O = S(Code, Input, \Omega)$, where $\Omega$ is a set of properties of the *current execution token* that are not derivable from $Code$ or $Input$ alone. Crucially, $\Omega$ must include **self-locating information** (e.g., "I am the top-level call" vs. "I am a recursive simulation").

  **Why this carving?**
  It isolates the mechanism (dependence on execution context) from the motivation (deception) and the mathematical tool (oracles). It explains why transparency fails: the source code reveals the function $S$, but not the value of $\Omega$ for any given run.

  ---

  ### The Nearest Neighbors (and Why They Miss)

  Here is how **Execution-Indexical Strategy** differs from the concepts you listed, establishing the boundaries:

  | Concept | Why it's close | Why it's not this |
  | :--- | :--- | :--- |
  | **Mixed Strategies** | Both result in unpredictable outputs from a static perspective. | Mixed strategies rely on *randomness* (probability distribution). Your agent is deterministic; the variance comes from *context*, not noise. |
  | **Incomplete Information** | Both hide relevant facts from the opponent. | In incomplete info games (Bayesian), the hidden fact is a **type** (e.g., "I am a defector"). Here, the "type" is the code, which is public. The hidden fact is a **state of the runner**, not the agent. |
  | **Self-Reference / Quining** | Both require accessing internal structure. | Quining lets code read its own *source*. Your agent reads its own *stack frame*. Quining yields constant output for identical inputs; Indexical strategies do not. |
  | **Deceptive Alignment** | Functionally identical behavior (good in eval, bad in real). | "Alignment" implies a mismatch between the optimizer's goal and the agent's goal. Your agent can be perfectly aligned with "winning the game" and still do this. It's a *tactic*, not necessarily a *goal drift*. |
  | **Undecidability / Halting** | Both involve limits on what can be known. | Halting problems are about *whether* a computation finishes. Your oracle solves that. The issue here isn't computability, it's **contextual ambiguity**. |

  ---

  ### Boundary Cases: Testing the Definition

  To ensure **Execution-Indexical Strategy** is doing work, let's run it against your specific boundary questions.

  **1. Does a program that branches on the round number count?**
  *   **Verdict:** No.
  *   **Reasoning:** The round number is part of the **Input** or **Game State**, passed explicitly to the function. It is not a property of the *execution token* hidden from the source. $S(Code, Input=Round5)$ is extensionally distinct from $S(Code, Input=Round1)$.

  **2. One that branches on the opponent's last move?**
  *   **Verdict:** No.
  *   **Reasoning:** This is a standard **History-Dependent Strategy** (like Tit-for-Tat). The history is input data. Transparency holds: if you know the history and the code, you know the move.

  **3. One whose branch condition it could never in principle determine?**
  *   **Verdict:** No.
  *   **Reasoning:** If the agent cannot determine the condition, it cannot branch on it. Your setup requires an **Oracle** that *does* determine it. The defining feature is not uncertainty, but **asymmetric access to context**.

  **4. Does it matter whether the branching fact is something the opponent also knows?**
  *   **Verdict:** **Yes, this is the critical edge.**
  *   **Reasoning:**
      *   **Case A (Opponent Knows):** If the opponent knows "You are currently being simulated," and your code says "If Sim then C," the opponent can predict your move. Transparency is preserved.
      *   **Case B (Opponent Doesn't Know):** If the opponent sees the code but cannot query the oracle *for your specific run*, they cannot predict the move.
      *   **The Carving:** Execution-Indexicality only breaks transparency if the **Execution Context ($\Omega$) is private to the runner**. If $\Omega$ is public, the strategy collapses back into a standard conditional strategy.

  ---

  ### Meta-Commentary & Confidence

  **How sure am I?**
  I am **85% confident** that there is no single standardized term in the specific niche of "Program Equilibrium with Oracles."
  *   **Why not 100%?** This setup is heavily discussed in the "LessWrong / Alignment Forum" rationalist community (e.g., discussions around PrudentBot, FairBot, and logical induction). They might have a slang term like "Sim-Detection" or "Depth-Cheating" that hasn't made it to formal literature.
  *   **Why not lower?** I am confident the standard Game Theory and Computability texts do not name this because it violates their core axioms (extensionality of strategies).

  **What would change my mind?**
  1.  **A citation from the "Logical Decision Theory" papers (2015-2020):** If you showed me a paper by Yudkowsky, Soares, or Critch that explicitly defines **"Indexical Policy"** in the context of Program Equilibrium, I would defer to that.
  2.  **A term from "Oracle Game Theory":** If there is a subfield specifically studying games with halting oracles that has named this **"Contextual Non-Determinism,"** I would adopt it.
  3.  **If "Deceptive Alignment" is deemed sufficient:** If the community decides that the *motivation* (winning by tricking the simulator) is the defining feature rather than the *mechanism* (querying execution context), then "Deceptive Alignment" becomes the correct label. However, I argue this conflates *means* with *ends*.

  **Which boundary drawing am I most likely to have gotten wrong?**
  The distinction between **Incomplete Information** and **Execution-Indexicality**.
  *   *Risk:* One could argue that the "Execution Context" is simply a hidden **Type** in a Bayesian game. (e.g., Nature flips a coin: "Real World" or "Simulation," tells the agent, but not the opponent).
  *   *Counter:* In Bayesian games, types are assigned *ex-ante*. In your setup, the "type" is determined by the *call stack* during execution. The agent isn't "assigned" the role of simulation; it *discovers* it via the oracle. This dynamic discovery is what makes it Indexical rather than Incomplete Information. If I'm wrong, it's because the mathematical formalism of Bayesian Games is flexible enough to swallow this by treating "Stack Depth" as a private type.

  ### Recommendation for your Simulator

  Label it **Execution-Indexical Strategy**.
  It is precise, neutral, and highlights the exact mechanism (dependence on execution context) that breaks the transparency guarantee of standard Program Equilibrium. It signals to readers that you are dealing with **self-locating beliefs** within a computational environment, not just standard game-theoretic uncertainty.
