answer: |-
  ### Specification of Theoretical Adequacy for the Side-Effect Effect Program

  **Purpose:** To define the success conditions for any theoretical account of the side-effect asymmetry intended to serve as the core of a pre-registered experimental program.
  **Constraint:** Theories must be evaluated on their ability to license *a priori* predictions about novel vignettes and boundary conditions, not merely on their capacity to accommodate existing data.

  | Category | Requirement | Motivation | Status | Variant Probe & A Priori Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **I. Phenomena** | **1. The Main-Goal Symmetry** | The asymmetry appears for side-effects but vanishes for the agent's primary goal (profit). A theory must explain why moral valence infects the side-effect ascription but not the main-goal ascription. | **Non-Negotiable** | *N/A (Baseline Constraint)* |
  | | **2. Neighbouring Ascriptions** | The pattern travels to phrases like "decided to," "in favour of," or "responsible for." A theory must specify which semantic neighbours inherit the asymmetry and which do not. | **Non-Negotiable** | **(3) Agentless Probe:**<br>*Probes:* Syntactic Agency vs. Outcome Valence.<br>*Prediction:* If the theory relies on agent-blame, removing the agent from the query ("Was the environment intentionally damaged?") should reduce intentionality ratings compared to the agent-focused query. If it relies on outcome valence, ratings should remain high. |
  | | **3. Valence vs. Attitude** | The effect tracks the moral badness of the *outcome*, not necessarily the agent's *attitude* toward it (since indifference is held constant). A theory must disentangle outcome valence from agent attitude. | **Non-Negotiable** | **(1) Cost-to-Self:**<br>*Probes:* Blameworthiness vs. Intentionality.<br>*Prediction:* If the theory ties intentionality to moral blame, self-harm (not blameworthy) should yield low intentionality ratings despite indifference. If it ties intentionality to indifference + foreknowledge, ratings should remain high. |
  | **II. Distinctions** | **4. Competence vs. Performance** | The theory must state whether the asymmetry reflects the underlying cognitive competence (the concept itself) or performance error (bias, noise, emotion). | **Camp-Specific**<br>(Conceptual vs. Error) | **(2) Exogenous Indifference:**<br>*Probes:* Moral Responsibility vs. Mental State.<br>*Prediction:* If the theory requires moral responsibility (blame), pathology removing responsibility should kill the intentionality ascription. If it requires only the mental state (indifference), pathology should not change the rating. |
  | | **5. Concept vs. Application** | The theory must specify if moral factors change the *meaning* of "intentionally" (concept) or only the *willingness to apply* it (application). | **Camp-Specific**<br>(Conceptual vs. Pragmatic) | *N/A (Meta-theoretical)* |
  | | **6. Blame vs. Intentional Action** | The theory must not simply equate the two. It must explain why we sometimes blame unintentional acts (negligence) and sometimes excuse intentional ones (justification). | **Non-Negotiable** | **(4) Avoidable Cost:**<br>*Probes:* Negligence vs. Intentionality.<br>*Prediction:* If the theory conflates blame and intentionality, making the harm easily avoidable (negligence) should maximize intentionality ratings. If it distinguishes them, negligence should boost blame but not necessarily intentionality. |
  | **III. Empirics** | **7. Boundary Conditions** | The theory must predict where the asymmetry *shrinks, vanishes, or reverses*. A theory that only predicts the presence of the effect is inadequate. | **Non-Negotiable** | *All Variants collectively probe boundaries.* |
  | | **8. Stability & Effect Size** | The theory must accommodate the fact that effect sizes are modest (not 100/0) and sometimes unstable across contexts, without dismissing data as noise. | **Non-Negotiable** | *N/A (Statistical Constraint)* |
  | | **9. Cross-Population Consistency** | The theory must be consistent with developmental (children), cross-linguistic, and clinical findings without ad-hoc adjustments for each population. | **Non-Negotiable** | *N/A (External Validity)* |
  | **IV. Prices** | **10. Measurement Invariance** | If the theory claims the *concept* changes across conditions, it must explain how survey data comparing those conditions remains valid evidence for a single construct. | **Non-Negotiable**<br>(Methodological) | *N/A (Methodological Constraint)* |
  | | **11. Action Theory Role** | The theory must pay a price regarding the role "intentionally" plays in explaining action (e.g., if it is moralized, can it still explain means-end reasoning?). | **Camp-Specific**<br>(Philosophical Cost) | *N/A (Theoretical Cost)* |

  ***

  ### The Single Eliminator: Requirement 7 (Boundary Conditions)

  The requirement that eliminates the most contenders is **Requirement 7: Boundary Conditions**. Most existing accounts are post-hoc accommodations of the original Chairman vignette. They are tuned to explain why the asymmetry *exists*, not where it *fails*. A theory that cannot specify in advance a vignette where the asymmetry should vanish (e.g., a trade-off case, a non-moral normative violation, or a specific framing condition) lacks the predictive power required for a pre-registered program. Theories that rely on a general "moral bias" often fail to predict when that bias is switched off, rendering them unfalsifiable in a multi-site design.

  ### The Unsatisfiable Subset: The Measurement Invariance Tension

  Your suspicion is correct. There is a jointly unsatisfiable subset involving **Requirement 5 (Concept vs. Application)** and **Requirement 10 (Measurement Invariance)** when combined with the **Moral Infusion Camp**.

  *   **The Tension:** If a theory claims that moral evaluation *changes the concept* of intentional action (Conceptual Analysis/Moral Infusion), then the term "intentionally" denotes Concept A in the Harm case and Concept B in the Help case.
  *   **The Contradiction:** If Concept A ≠ Concept B, then comparing the rate of endorsement across the two conditions is methodologically invalid (a category error). You cannot claim an "asymmetry" in the application of *the* concept if the concept itself shifts. However, these theories rely on the survey data (the asymmetry in rates) as their primary evidence.
  *   **The Result:** The account undercuts its own evidential basis. To save the data, the theory must claim the concept is stable (violating its own core claim). To save the theory, it must dismiss the comparative data as invalid (destroying its empirical support). This tension is dissolvable only if the theory posits a *single* complex concept that is *fully* activated in one case and *partially* in the other, but this often collapses back into a Performance/Application distinction (Requirement 4).

  ***

  ### Theoretical Graveyard: First Point of Failure

  *   **Moral Infusion (Conceptual):** Fails **Requirement 10 (Measurement Invariance)**. By moralizing the concept, it renders the comparative survey data methodologically incoherent as evidence for a single asymmetry.
  *   **Deep-Self / Expression-of-Character:** Fails **Variant 2 (Exogenous Indifference)**. If the agent's indifference is caused by pathology (not their "true self"), the theory predicts low intentionality, but data often shows indifference alone suffices regardless of source.
  *   **Missing-Competence-Condition (Performance Error):** Fails **Requirement 8 (Stability & Effect Size)**. It cannot explain why the effect persists under cognitive load, in children, or across cultures if it is merely a performance error or confusion.
  *   **Pragmatic Implicature:** Fails **Variant 3 (Agentless Probe)**. If the effect is purely about what is conversationally implicated by asking about the agent, removing the agent from the syntax should dissolve the effect; if it persists, it is semantic, not pragmatic.
  *   **Blame-Seeking:** Fails **Variant 1 (Cost-to-Self)**. Agents who harm themselves are not blameworthy. If the effect is driven by blame, self-harm should not be judged intentional, yet foreknown self-harm often retains high intentionality ratings.
  *   **Affective Artifact:** Fails **Requirement 9 (Cross-Population Consistency)**. If the effect is driven by immediate emotional reaction, it should vary wildly across cultures and developmental stages; its robustness suggests a deeper cognitive structure.
