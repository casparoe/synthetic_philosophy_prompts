      *   *Tone Check:* Keep it sharp. Don't lecture. Answer the specific prompts.
      *   *Refining the Reductio:* The strongest point is the "Badness without a Subject" paradox. If Claim 3 says there is *badness*, and Claim 4 says there is *no one* it is bad for, you have free-floating evil. This is metaphysically spooky and ethically unstable. Or, the threshold problem: if integration is the key, humans fall below the threshold often.

