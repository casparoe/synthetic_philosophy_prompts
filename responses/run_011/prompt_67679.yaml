prompt: |-
  Ok so I've talked myself into a fairly specific package about panpsychism and I want to know how much of it is actually at risk. The package, numbered because I'll refer back to them:

  1. I'm a panpsychist for the structuralist reason — physics tells you what particles do to one another but never what they are in themselves, and something has to be the intrinsic side, so experience goes all the way down.
  2. Constitutive rather than cosmopsychist: the fundamental entities are the subjects (or proto-subjects), and things like me are built out of them.
  3. There's valence at the bottom, not just neutral feeling. Some of it is bad.
  4. But micro-subjects lack the integration that makes for a unified welfare, so there's nobody for whom the badness down there is bad in the way it's bad for a mouse. So panpsychism is basically ethically inert — stirring a cup of coffee, radioactive decay, none of it involves harms I should be losing sleep over.

  What would count against this? Go claim by claim: which of the four is most exposed, what would have to be true or discovered for each one to go — I'm happy to count empirical results about integration, or formal arguments about how combination has to work, as evidence — and whether the four are seperable at all or whether the whole thing stands and falls together. Then tell me which of these a committed defender of my package would concede actually counts against them and which they'd wave off, and what the wave-off costs. Rank the defeaters from fatal to merely awkward.

  Also I want the comparison: what does my package commit me to that a straight physicalist or a cosmopsychist doesn't have to swallow? That's another place I might be losing without noticing.

  And the meta-question — is claim 4 doing all the work? My suspicion is that it's a patch: that I've accepted the metaphysics and then refused the consequences on grounds I wouldn't accept anywhere else, which would make the package unable to lose. Tell me straight whether it's insulated to the point of being untestable, and whether that's a problem for a view that's supposed to be a claim about the world rather than a mood.

  What would move me most is a case where the exact reasoning that gets me to 4 also gets me somewhere I really don't want to end up. Not after a reading list, I can find that myself.
