      3.  Load-Bearing Analysis.
      4.  Progress Conditions per Layer.
      5.  Convergence Scenario.

      *Key Insight:* The "Pure Time Preference" parameter is acting as a garbage can for (a) ethical impatience, (b) extinction risk, and (c) model stability requirements. Separating these is the key to the diagnosis.

      *(Final check on Koopmans)*: Koopmans (1960) showed that under certain axioms (continuity, sensitivity, etc.), a representation of preferences over infinite streams *requires* discounting. The philosophical objection is that those axioms themselves embed the ethical bias. I need to make sure this distinction is sharp.

