  3.  **Evaluate the Koopmans Argument:**

      *   *Koopmans' Point:* In infinite horizon models, without impatience, no optimal program exists (or the "overtaking criterion" is needed, which is weak).
      *   *User's Question:* Does this answer the impartiality objection?
