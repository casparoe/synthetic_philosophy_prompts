answer: |-
  There is no standard term in type design, but the strongest established candidate is the linguistic concept of **Systemic Value**, which you should operationalize for your practice as **Paradigmatic Coherence**.

  This phenomenon is not merely perceptual context; it is the structural condition where a member's identity and validity are derived exclusively from its differential position within a closed set. In structural linguistics (Saussure), this is **Systemic Value** (*valeur*): a sign means what it does only because it is *not* the other signs in the system. Your first instance is a textbook example: the glyph is 'a' not because of its intrinsic strokes, but because the system contains no 'd', 'e', or 'o' that occupy that specific coordinate of difference. The hesitation vanishes on the specimen sheet because the viewer unconsciously maps the glyph against the available paradigm; the system provides the boundaries that the individual form lacks.

  Your second instance is the dynamic corollary of the first. If identity is relational, then shifting one term shifts the relational grid for all others. When you close the 'g', you alter the system's logic of openness/closure; the 'y' does not change physically, but its *value* changes because its difference from the 'g' has diminished. It reads as "slack" because it has lost its distinctiveness within the new configuration. This is why repair is rarely local: you are not fixing a shape, you are re-calibrating the system of differences.

  **Ranking Candidates:**
  1.  **Systemic Value (Saussure):** Fits Instance 1 perfectly and Instance 2 theoretically. It misses the *aesthetic normativity* of design; linguistics describes how meaning shifts, but design requires a judgment of "right/wrong" or "tight/slack" that exceeds pure semiotics.
  2.  **Gestalt Context Effects:** Fits the perceptual shift but fails the identity test. Gestalt explains why a grey patch looks lighter on a dark background, but it does not explain why an ambiguous shape becomes definitively 'a' rather than 'o'. Gestalt is perceptual; your phenomenon is definitional.
  3.  **Family Resemblance (Wittgenstein):** Incorrect. This describes how categories overlap without a core (e.g., "games"). Your phenomenon is the opposite: the core is empty, but the boundaries are rigidly enforced by the neighbors.

  **Instance 1 vs. Instance 2:**
  They are the same phenomenon viewed statically and dynamically. Instance 1 is **Paradigmatic Identity** (the state of being defined by the set). Instance 2 is **Systemic Coherence** (the stability of those definitions under variation). You have not conflated them; you have observed the static condition and its dynamic consequence. Both rely on the principle that the whole precedes the part.

  **Coined Term: Paradigmatic Coherence**
  Use this to distinguish it from general consistency. **Paradigmatic Coherence** refers specifically to the interdependence of letterforms where the identity and aesthetic validity of any single glyph are contingent on its differential relationship to the rest of the set.

  **Boundaries and Non-Instances:**
  To ensure you do not overapply this term, here are two phenomena that look similar but are not **Paradigmatic Coherence**:

  1.  **Optical Compensation (e.g., Overshoot):** A round 'o' must extend slightly beyond the baseline of a flat 'n' to appear the same height. This is a physiological correction against human perception, not a systemic definition. If you remove the 'n', the 'o' still needs the overshoot to look round; its identity does not depend on the 'n', only its apparent size does.
  2.  **The Word Superiority Effect:** Readers identify letters faster within words than in isolation. This is linguistic priming and memory retrieval, not systemic form definition. Your Instance 1 works on a specimen sheet *without* words; the resolution comes from the *alphabet*, not the *language*.

  **Paradigmatic Coherence** applies only when the set itself provides the definitions that the individual forms cannot sustain alone.
