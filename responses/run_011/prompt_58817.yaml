answer: |-
  The problem of old evidence is typically framed as a crisis of dynamics: how can a belief change when no new evidence arrives? The standard Bayesian machinery dictates that if $P(O) = 1$, then $P(H|O) = P(H)$, rendering $O$ incapable of confirming $H$. The proposed repairs attempt to engineer a change in the input (lowering certainty in $O$, treating the entailment as new data, or reconstructing a counterfactual past). I argue that these repairs misdiagnose the pathology. The problem is not how beliefs move, but what beliefs *are*.

  Ada's case demonstrates that a rational shift in credence can occur solely through the activation of latent structural relationships within a fixed evidence set. To defend this, we must reconceive the credal state not as a snapshot of logical commitments, but as a map of cognitive resources.

  ### (a) The Statics of Deployment vs. Logical Omniscience

  The charge against any relaxation of logical omniscience is that it invites arbitrariness. If an agent is not required to believe all consequences of her beliefs, where do we draw the line? Does "in a position to deploy" simply mean "can derive given infinite time"? If so, we have resurrected omniscience. If it means "derives right now," we make rationality hostage to momentary distraction.

  To avoid this, "in a position to deploy" must be defined in terms of *structural accessibility* rather than temporal immediacy or logical necessity. A proposition $P$ is deployable for an agent at time $t$ if and only if:
  1.  The agent possesses the constituent concepts and rules of inference required to construct a derivation of $P$.
  2.  The agent has a stored derivation (or a schema for one) in long-term memory that can be retrieved and validated in working memory without requiring *new* empirical premises or *new* axiomatic assumptions.
  3.  The agent recognizes the derivation as valid upon retrieval.

  This is not omniscience stood on its head. Omniscience requires that $P(H \to O) = 1$ regardless of whether the agent can construct the proof. The "deployment" view holds that $P(H \to O)$ is undefined or inert until conditions 1–3 are met. The credal state encodes the *active topology* of the agent's reasoning, not the closure of that topology under logical consequence.

  This definition has determinate content and is falsifiable. It fails if an agent claims a relationship is deployable but cannot produce the derivation when prompted (violating condition 3), or if the theory predicts a belief shift where the agent's cognitive access to the derivation remains unchanged (e.g., if Ada's credence in $H_1$ rose simply because she was told $H_1$ is popular, not because she grasped the derivation).

  The class of cases where this bites is specifically *theoretical elucidation*. It does not apply to simple arithmetic (where the derivation is trivial and thus always deployable) nor to empirical discovery (where new data enters). It applies precisely to cases like Ada's: complex theoretical frameworks where the connection between hypothesis and evidence is mediated by non-trivial mathematical or structural reasoning that requires cognitive effort to unpack.

  ### (b) The Parameter-Tuning Discovery

  The hardest challenge for this static view is the distinction between $H_1$ and $H_2$. Both entail $O$. If the only thing learned is "$H$ entails $O$," both should be confirmed equally. But Ada penalizes $H_2$ for hand-tuning. This suggests she has learned something about the *quality* of the entailment, not just its existence.

  On the static view, the proposition learned is not merely $E_1: "H_1 \text{ entails } O"$ and $E_2: "H_2 \text{ entails } O"$. Rather, Ada learns about the *modal profile* of the entailment. Let $S$ be the structural assumptions of the theory.
  For $H_1$, she learns: $L_1: "O \text{ follows from } H_1 \text{ and } S \text{ without fixing free parameters}."$
  For $H_2$, she learns: $L_2: "O \text{ follows from } H_2 \text{ only if parameter } p \text{ is set to } v, \text{ where } v \text{ was unconstrained by } H_2 \text{ and } S \text{ prior to } O."$

  Why was Ada's prior over $L_1$ and $L_2$ not sufficient to generate the shift? Because prior to the derivation, $L_1$ and $L_2$ were not deployable propositions. They were not items in her credal space. She knew $H_2$ had a parameter $p$, but she did not know the *dependency relation* between $p$ and $O$. She did not know that $p$ *had* to be tuned to match $O$.

  Treating $L_2$ as a proposition is legitimate because it is a claim about the theory's structure, which is a fact about the world (or at least about the mathematical model). The judgment of "ad hoc-ness" is the recognition that the likelihood $P(O | H_2 \& L_2)$ is significantly lower than $P(O | H_1 \& L_1)$, even if $P(O)=1$. Why? because $L_2$ reveals that $H_2$'s fit is fragile—it depends on a coincidence of parameter selection. $H_1$'s fit is robust.

  The static view handles this by allowing the *likelihood function itself* to be updated upon the deployment of $L_1$ and $L_2$. Since the credal state is defined by what is deployable, the introduction of $L_1$ and $L_2$ changes the state. Conditionalization then proceeds on these new structural propositions. The prior did not handle it because the prior state lacked the resolution to represent the distinction between robust and fragile entailment.

  ### (c) Quantitative Constraints and the Cost of Silence

  Can this thesis underwrite a quantitative constraint on how far Ada's credence in $H_1$ may rise? Strictly speaking, no. Standard Bayesianism dictates $P_{new}(H) = P_{old}(H | \text{new info})$. But if the "new info" is the *availability* of a derivation that was previously unavailable, the agent cannot have had a well-defined prior probability for that availability derived from her old state. The old state did not contain the concepts required to frame the proposition "I will discover derivation $D$."

  Therefore, the theory must stay silent on the specific magnitudes of the shift. It can mandate that $P(H_1)$ rises and $P(H_2)$ falls (ordinal constraint), but it cannot calculate the exact ratio without importing subjective priors on the *value of theoretical virtues* (like non-ad-hocness) that were not active in the old state.

  Is this silence an acceptable cost? Yes, because the alternative is fiction. The dynamic repairs generate precise numbers by inventing probabilities that do not exist (e.g., assigning $P(O) = 0.99$ when the agent is certain). It is preferable to admit that rational belief revision in cases of theoretical insight is not algorithmically determined by the prior state alone. The constraint is *coherence with the new deployable structure*, not *derivation from the old credences*. The magnitude of the shift depends on how surprising the structural discovery is, which is a fact about the agent's cognitive relationship to the theory, not a logical feature of the propositions. Silence here is not a concession to arbitrariness; it is an acknowledgment that logical learning expands the space of possibilities, and one cannot assign probabilities to the expansion from within the unexpanded space.

  ### (d) The Failure of Dynamic Repairs

  Two familiar dynamic repairs misdescribe Ada's situation.

  **1. The "Uncertain Evidence" Repair (Jeffrey Conditionalization):**
  This view suggests Ada was never truly certain of $O$, and her credence in $O$ should be lowered slightly to allow updating.
  *Critique:* This smuggles back omniscience by assuming the only way to update is via changes in the probability of the evidence. It misdescribes the case because Ada *is* certain. $O$ is a decade-old datum. To tell her she must pretend uncertainty is to demand doxastic dishonesty. Furthermore, this repair fails to capture why $H_1$ is favored over $H_2$. If we simply lower $P(O)$, both $H_1$ and $H_2$ entail $O$, so both should be confirmed equally by the "new" uncertainty update. The repair cannot account for the penalty on $H_2$'s ad hoc-ness without adding extra machinery that essentially replicates the static structural account anyway. It treats the problem as one of *data stability* when it is actually a problem of *theoretical transparency*.

  **2. The "Historical/Counterfactual" Repair (Garber-style):**
  This view suggests Ada should conditionalize on what she *would have believed* had she not known $O$ when she first encountered it.
  *Critique:* This makes confirmation dependent on historical accidents. Suppose Ada had discovered $O$ yesterday; the confirmation would be "real." Since she discovered it ten years ago, the confirmation is "fake" unless she simulates a past self. This verdict is wrong. Ada's current justification for believing $H_1$ depends on her *current* grasp of the relationship between $H_1$ and $O$, not on a fictional narrative about her past self. The explanatory power of $H_1$ is a timeless relation; making it contingent on the order of discovery conflates the *context of discovery* with the *context of justification*. The dynamic repair forces Ada to look backward to justify a forward-looking insight.

  ### Vulnerability and Conclusion

  My position is most vulnerable on the boundary of "deployability." I have defined it via cognitive access, but cognitive access is a gradient, not a binary. When exactly does a derivation become deployable? Is it when the agent sees the first step? The last? If the boundary is vague, then the rationality of the belief shift is vague. This threatens the normative force of the theory: if we cannot say *when* Ada is permitted to update, we cannot say *if* she was rational.

  To patch this, I would have to surrender the idea that Bayesianism is a purely logical framework. I must embrace a hybrid view where the norms of rationality are partially constituted by facts about human cognitive architecture. This means accepting that what is rational for a finite agent is not simply a bounded version of what is rational for an infinite agent, but qualitatively different in structure.

  In closing, consider the rival views in my own terms.
  The **"Evidence Softener"** treats the agent's mind as a leaky bucket; to pour new belief in, she must poke holes in her certainty about the old. This misrepresents the solidity of empirical data.
  The **"Historical Reconstructionist"** treats the agent as a time traveler; she is only rational if she can successfully mimic her ignorant past self. This misrepresents the cumulative nature of understanding.

  My view treats the agent as an **Architect**. Her credal state is the blueprint she can currently read. When she learns to read a new part of the blueprint (the derivation), the building (her belief system) is re-evaluated not because the bricks changed, but because she finally sees how they hold together. The problem of old evidence vanishes when we realize that evidence is not old if the understanding of it is new.
