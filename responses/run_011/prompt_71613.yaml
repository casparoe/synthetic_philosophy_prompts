answer: |-
  The Office of the Futurary smelled of iron gall ink and dried vellum. It was a smell that clung to the back of the throat, permanent and dusty. Elara sat at the high desk, the Ledger of Pending Things open before her. It was a massive volume, bound in leather that had cracked with age, its pages filled with columns of dates, propositions, and the three distinct marks of the state: the Circle (Fixed), the Crescent (Pending), and the Slash (Void).

  Her job was not to predict. It was to categorize. When a merchant filed a bill of lading for goods not yet loaded, it was Pending. When a captain filed a report of a storm already weathered, it was Fixed. The law was explicit: only a Fixed entry could found a claim in court. A Pending entry was legally weightless, a ghost in the machinery of the republic. You could not sue on a ghost.

  The petition arrived just before noon, carried by a runner from the Underwriters Guild. It was not a standard form. It was a request for Reclassification of Event 8940-B: *Naval Engagement at the Shoal of Silts.* Currently, the entry sat as Pending. The date of engagement was listed as tomorrow.

  Elara read the covering letter twice. The wording was precise, engineered to bypass the usual prohibitions against pre-emptive fixation. The Underwriters argued that the grain convoy from the southern islands was refused port insurance while the naval defense remained Pending. Without insurance, the merchants would not sail. Without the grain, the city's silos would be empty within thirty days. The petition did not ask for a specific outcome—Victory or Defeat—to be stamped Fixed. It asked for the *occurrence* of the engagement itself to be stamped Fixed.

  If the engagement was Fixed, the insurance contracts became enforceable. The risk was no longer a contingency; it was a fact of the calendar. The merchants would sail.

  Elara looked at the stamp in her hand. The handle was worn smooth by the thumbs of her predecessors. The Circle. *True and not able to be otherwise.* To stamp this was to assert that the battle was as inevitable as the sunrise. It was to move tomorrow into the architecture of yesterday.

  She set the stamp down and picked up her cloak. She needed air, or at least the noise of the city, before she touched ink to vellum.

  ***

  The counting house of the Underwriters Guild doubled as a tavern in the late afternoons. The tables were scarred with ink stains and wine rings. Elara found them in the back room: three senior merchants and a legal clerk named Varrin, who was known for memorizing the Rule of Construction.

  A ledger lay open on the table between them. Varrin traced a line of text with a greasy finger.

  "It is simple arithmetic," Varrin said. He was speaking to a shipowner named Kaelen, whose hands were wrapped in bandages from a rope burn. "Look at the Clauses. Clause One: Whatever is Fixed cannot be otherwise. We agree?"

  Kaelen nodded, impatient. "We agree. If the Ledger says the ship sank, the ship sank."

  "Clause Two," Varrin continued. "Nothing impossible follows from anything possible. If it is possible for the grain to arrive, it cannot be impossible for it to arrive. Contradiction is Void."

  "Get to the point," Kaelen said.

  "Clause Three," Varrin said, tapping the table. "Therefore, nothing is possible that neither is nor will be. The only real possibilities are the ones that actually come off. If the grain arrives, it was possible. If it does not arrive, it was never possible. Possibility is just a shadow of Actuality."

  Elara stood in the doorway, listening. She did not interrupt.

  "So," Varrin concluded, "if the Underwriters insure the grain, and the grain arrives, then it was always Fixed that it would arrive. The Ledger should reflect the truth. If we stamp the battle Fixed, we are merely aligning the paperwork with the reality that *will* exist. We are correcting a clerical lag."

  Kaelen slammed his hand on the table. "That's the sophistry I pay you to avoid. You're saying because the ship *might* arrive, the Ledger must say it *will*."

  "I am saying that if it *does* arrive, the possibility was real, and if the possibility was real, Clause Three says it must be actualized. Therefore, if we know the convoy is necessary, we know it is actual. Therefore it is Fixed."

  "And if the admiral loses?" Kaelen asked. "If the enemy burns the grain?"

  "Then it was never possible for the grain to arrive," Varrin said smoothly. "And the insurance pays out on the Fixed entry of Loss. Either way, the entry is Fixed. The uncertainty is in your mind, not in the Ledger."

  "There is a second school," said a voice from the corner. It was an older man, a retired actuary named Orlen. He had been silent until now, nursing a cup of watered wine. "You forget the leaning past."

  Varrin sighed. "The leaning past is heresy."

  "It is observation," Orlen said. He looked at Elara, acknowledging her presence, but continued speaking to the room. "Yesterday, the battle was Pending. You want the Futurary to stamp it Fixed today. But suppose tomorrow the admiral decides not to sail? Suppose he stays in port?"

  "Then the entry is Void," Varrin said. "Self-contradiction."

  "No," Orlen said. "Then yesterday's stamp was a lie. But more than that. If you stamp it Fixed today, you change the truth of yesterday. Yesterday it was Pending. Today it is Fixed. How can the past change? It changes because the past truth depended on the future outcome. The truth of yesterday leans on tomorrow. If you force tomorrow to be Fixed today, you break the lean. You make the past rigid."

  Kaelen rubbed his face. "I don't care about the past. I care about the contract. If the entry is Pending, the court throws out my claim. My men won't sail into a Pending battle. They want Fixed wages for Fixed risks."

  "And the Admiral?" Elara spoke for the first time. The room went quiet. "I have his memo on my desk."

  She walked to the table and placed a copy of the Admiral's dispatch beside the ledger. "He writes: *'If the outcome is Fixed, there is no point in the night maneuver. If the sea is already won, why bleed? If the sea is already lost, why row?'*"

  "That is superstition," Varrin said. "The stamp does not stop the arrow."

  "It stops the hand that draws the bow," Orlen murmured. "If the men believe the Ledger is Fixed, they fight like clerks. If they believe it is Pending, they fight like men who can change the ink."

  Elara looked at the ledger. The logic was circular, a snake eating its own tail. Clause Three demanded that only what happens is possible. But if the stamp causes the men to stop fighting, then the battle might not happen. If the battle doesn't happen, the stamp was false. If the stamp was false, the Fixed status is Void.

  "If I stamp it Fixed," Elara said, "and the admiral does not maneuver, and we lose... then the entry was false. A False Fixed entry is a corruption of the Ledger. I lose my office. You lose your contracts."

  "If you do not stamp it," Kaelen said, his voice low, "the convoy stays in port. The city eats sawdust in a month. People die. Not in battle. In their beds."

  The silence stretched. The weight of the city pressed against the windows. It was not a metaphysical weight. It was the weight of empty stomachs, of riots in the lower quarters, of the slow decay of a republic that could not feed itself.

  Elara turned and left the room. She had heard enough. The logic was perfect on both sides, and perfectly useless. One path preserved the integrity of the Ledger and starved the city. The other fed the city and turned the Ledger into a tool of coercion.

  ***

  Back in the Office of the Futurary, the light was failing. The ink pots were dark pools in the gloom. Elara sat before the Ledger of Pending Things. Event 8940-B stared back at her. *Naval Engagement at the Shoal of Silts.* Status: Pending.

  She picked up the Admiral's memo again. *'No one needs to do anything about what's already true.'*

  She thought of Orlen's leaning past. If she stamped it Fixed, she was not recording a truth. She was creating a constraint. She was telling the Admiral that his agency was an illusion. But if she left it Pending, she was telling the merchants that their survival was a gamble the law would not honor.

  There was a third option. She could stamp it Void. Claim the proposition was nonsense. But that would halt the convoy just as surely as Pending.

  She dipped the stamp into the ink pad. The red pigment was thick, viscous. It smelled of iron and blood.

  The city outside was quieting down. Somewhere, a bell rang for the evening meal. In the poor quarters, the bowls would be thin tonight. In the counting houses, the wine would be thick. The Ledger sat between them, the arbiter of what was real.

  Elara thought about Clause Three. *Nothing is possible that neither is nor will be.* If she stamped it Fixed, she was asserting that the battle *will be*. If the battle *will be*, then by Clause Two, nothing impossible follows. The maneuver must happen. The grain must sail.

  But if the stamp itself convinces the Admiral not to maneuver, then the battle *will not be*. Then the stamp was a lie.

  Unless the stamp was not a report, but a cause.

  She hovered the stamp over the vellum. The paper was rough under the pressure of her hand. She could feel the fibers. This was physical. The ink would soak in. It would dry. It would become part of the history of the office. Future clerks would see the red circle. They would know that on this day, the Futurary decided the battle was inevitable.

  If she stamped it, and the city ate, was the stamp true?
  If she stamped it, and the city starved because the Admiral refused to fight a fixed battle, was the stamp false?
  If she didn't stamp it, and the city starved because the merchants refused to sail, was the Pending status the cause?

  There was no way to know. The Ledger recorded the state of things, but it was also part of the state of things. It was a mirror that could also be a hammer.

  Elara closed her eyes. She thought of the grain ships waiting in the harbor, bobbing on the tide. She thought of the enemy fleet waiting beyond the shoal, sails dark against the horizon. They did not know about the Ledger. They did not care about the Clauses. They cared about wind and wood and steel.

  But here, in the republic, wind and wood were subordinate to ink.

  She pressed down.

  The sound was a dull thud, heavy and final. She lifted the stamp. The red Circle sat on the page, bright and wet. *Fixed.*

  She did not feel different. The room did not change. The air did not shift. But the legal weight of the proposition had changed. The insurance contracts were now enforceable. The merchants would sign. The convoy would sail.

  Elara opened the ledger to the next page. There were other entries. A dispute over a warehouse lease. A petition regarding a marriage contract contingent on a harvest. She dipped her pen to record the action. *Reclassification authorized. Reason: Public Necessity.*

  She blew on the ink to dry it.

  ***

  Three weeks later, the grain arrived.

  The convoy had sailed the day after the stamping. The Admiral had executed the night maneuver, flanking the enemy ships in the dark among the silts. There was a battle. There were deaths. Three ships burned. But the grain ships passed through.

  Elara stood on the quay as the sacks were unloaded. The dust of the grain choked the air, golden and sweet. The porters shouted. The merchants weighed the bags on the scales. The city would eat.

  A man stood beside her. It was Varrin, the clerk from the counting house. He held a copy of the daily gazette, which listed the Ledger's updates.

  "It worked," Varrin said. "The entry was Fixed. The grain arrived. Clause Three holds. Only what happens is possible."

  "The Admiral maneuvered," Elara said. "He said he fought harder because he knew the city was watching."

  "Or because he knew the Ledger was Fixed," Varrin said. "Or because he ignored it. Does it matter? The outcome matches the stamp."

  Elara watched a porter stumble under a heavy sack. The man regained his balance and kept walking.

  "If I hadn't stamped it," Elara said, "the ships wouldn't have sailed."

  "Then the stamp was a report of what you would do," Varrin said. "You were always going to stamp it. Therefore it was Fixed."

  "Or," Elara said, "the stamp made the ships sail. And if the stamp made them sail, then the battle wasn't Fixed until I put the ink down."

  Varrin shrugged. "The court doesn't care. The contracts are paid. The Ledger is consistent."

  He walked away, tapping the gazette against his palm.

  Elara remained on the quay. The sun was setting over the harbor. The water was dark, reflecting the lights of the ships. She thought about the red circle on the vellum in her office. It was dry now. It was part of the past.

  She thought about the Admiral's men who had died in the night maneuver. Their deaths were now Fixed. They could not be otherwise. But if she had not stamped the paper, would they be alive? Would the city be hungry?

  There was no column in the Ledger for *Could Have Been*. There was only Fixed, Pending, and Void.

  She turned back toward the city. The streets were filling with people heading home to eat. The smell of baking bread drifted from the lower quarters. It was a good smell. It was a real smell.

  Elara touched the pocket of her cloak, where the stamp key hung on a chain. The metal was warm from her body heat. She walked toward the Office of the Futurary. There was more work to do. Tomorrow's entries were already waiting. They were all Pending. They were all waiting for her to decide if they were true.

  She opened the door to the office. The Ledger lay open on the desk, waiting for the next page. The ink was ready. The city was fed. The future was wet with red ink, drying into a past that would never change.

  Elara sat down. She picked up the pen. She did not know if she was writing the truth or making it. She only knew that the hand holding the pen was steady, and the stamp was within reach.
