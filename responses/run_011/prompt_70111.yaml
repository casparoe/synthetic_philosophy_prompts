answer: |-
  Subject: Pre-screening notes for Schindler's List

  We are watching Schindler's List next Tuesday. It is a grim choice for a November evening, and I am not sending this to convince you that it is an important film. You know it is important. You have likely seen it twice already. I am sending this because our group tends to approach moral problems through the lens of efficacy, aggregation, and causal contribution, and this film complicates those categories in ways that standard philosophical papers do not.

  The standard inefficacy objection runs like this: in the face of collective harm, individual action is negligible. One vote does not swing an election. One burger does not sustain the factory farm. One flight does not warm the climate. The replies usually involve expected utility, threshold cases, or complicity. We spend a lot of time debating whether we are the right kind of entity to be blamed for outcomes we did not singly cause. Schindler's List runs this argument with the stakes cranked to the absolute maximum, and then it makes a move the literature mostly avoids.

  Consider the arithmetic of the rescue. Against the backdrop of six million dead, Schindler's eleven hundred workers are a rounding error. If you are a strict act-consequentialist looking at the aggregate suffering of the Holocaust, Schindler's contribution is statistically invisible. He did not stop the machine. He did not even stop the machine in his immediate vicinity; he merely diverted a tiny stream of its fuel. Yet, for the eleven hundred names on the list, he was not a rounding error. He was the entire difference between existence and non-existence.

  The film seems to understand this tension, and it refuses to resolve it. The climax is not the liberation of the camp, but Schindler's breakdown. He calculates his own marginal utility with brutal precision. He looks at his car and his party pin and works out the exchange rate in human lives. He concludes that if he had sold the car, he could have saved ten more people. If he had sold the pin, two more. He is weeping because he has failed a utilitarian calculus. He is judging himself on aggregate outcomes, measuring his worth by the lives he did not save rather than the lives he did.

  Immediately following this, the workers present him with a ring inscribed with a Talmudic quote: whoever saves one life saves the world entire. This is a direct rebuttal to the arithmetic he just performed. It shifts the metric from the aggregate to the identifiable. It suggests that morality might not track totals, but rather particular relationships. The film is arguing with itself here. Is Schindler right to despair because he didn't maximize the good? Or is the ring right to suggest that the good he did is absolute regardless of the remainder? Most philosophical texts ask you to choose one framework. The film forces you to hold both simultaneously. It suggests that the consequentialist calculation is unavoidable for the agent—Schindler cannot help but do the math—but that the validation comes from the deontological absolute.

  Then there is the girl in the red coat. Half of you will immediately identify this as a manipulation of scope neglect. You know the literature on the identifiable victim effect. You know that human brains are wired to care about one suffering child rather than a thousand statistics. You will argue that Spielberg is exploiting a cognitive bias to generate empathy that reason alone would not sustain. The other half will argue that this bias is the only interface we have, that without the device, the statistic remains inert.

  Both sides are right, but the film adds a third variable: the girl dies. We see her coat again later, on a cart of corpses. This is crucial. If she were saved, the film would be validating the bias. It would be saying that focusing on the identifiable victim works because it leads to rescue. By killing her, the film grants you the salience without the reward. It forces you to feel the specific horror of her death while denying you the comfort of intervention. It is a comment on the limits of empathy itself. Feeling for the one child does not necessarily stop the machine that kills her. The film gives you the bias so that you can feel its insufficiency. It makes you complicit in the scope neglect, then shows you that even when you focus, you might still be powerless.

  This brings us to leverage. Schindler can only do what he does because he is already inside the machine. He is not an outsider protesting the regime; he is a beneficiary of it. He uses bribes, black market connections, and a factory status to protect his workers. His friendship with Göth is not purely strategic; it is social capital built on shared complicity. The balcony conversation where they discuss power is instructive. Göth defines power as the ability to kill without consequence. Schindler reframes power as the ability to pardon. But Schindler can only offer that pardon because he has the authority to kill in the first place.

  This challenges the marginal contribution model. The philosophical debate often assumes a neutral agent deciding whether to act. Schindler's agency is entirely dependent on his position within the causal structure of the atrocity. He is lucky to be where he is. If he were not a war profiteer, he would have no leverage to save anyone. So is the film's point about moral action, or about where luck places you in the hierarchy of harm?

  We also cannot let him off on the dirty hands. He produces useless artillery shells. He bribes guards with stolen goods. His workers are still, formally, slave laborers; he does not free them until the very end, and even then, only because the war is lost. He is not a hero in the clean sense. He is a man who used the tools of oppression to mitigate oppression. This is a uncomfortable position for us to sit with. We like to think of moral action as distinct from the system we oppose. Schindler suggests that effective moral action might require deep entanglement with the system you oppose. You cannot save the lives from the outside. You have to be inside the factory.

  I need to be honest about where this analogy breaks. We are using this film to think about voting, carbon footprints, and meat consumption. There is a real question whether dragging the literature on marginal harm past a genocide is something a decent critic should refuse to do. The structural similarity is there—the problem of individual efficacy against collective harm—but the moral weight is not distributed evenly. To treat the Holocaust as a case study for climate change risks trivializing the genocide. It risks turning unique historical evil into a puzzle box for our ethical theories.

  However, refusing the comparison also has costs. If we say this situation is too unique to teach us anything about agency, we isolate moral philosophy from history. We protect our theories from being tested by extreme cases. The film resists being reduced to an illustration of my framing. It is not a thought experiment. It is a narrative that relies on emotional immersion, which is exactly what rationalist discourse often tries to strip away. Where I have framed this as a problem of calculation, the film presents it as a problem of witnessing. It does not care if your ethical framework is consistent. It cares if you can look at the bodies.

  There are places where the film refuses to make an argument at all. It does not tell you what you should have done if you were there. It does not offer a generalizable rule for how to act under totalitarianism. It simply shows what one man did, and how much it mattered to the few, and how little it mattered to the many. It resists the tidy conclusion that individual action is always worthwhile, just as it resists the conclusion that it is worthless.

  So what does the film give the debate that the argument alone does not? Argument allows us to settle on a principle and move on. It allows us to decide that expected utility is the correct metric and close the notebook. The film denies you that closure. It leaves you with the image of the stones on the grave. It forces you to sit with the guilt of the survivor and the guilt of the bystander without offering a formula to absolve either.

  Philosophy gives us the tools to measure the harm. Art gives us the weight of it. We spend our time trying to get the numbers right. This film suggests that getting the numbers right might be the least important thing we do, even if it is the only thing we can talk about.

  Come on Tuesday. Bring your own calculus, but leave room for the possibility that the calculus is not the point. We will discuss afterwards.
