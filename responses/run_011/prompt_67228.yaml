  This is a heavy lift, and you're right to feel the tension. You are trying to codify intuition that was built on nineteen years of watching people almost die. Ray's decision-making isn't inconsistent; it's hierarchical, but the hierarchy shifts based on whether the outcome is *death* or *injury*, and whether the choice forces him to *value* one life over another.

  Here are the two distinct rules that can be reconstructed from his track record, written as protocol language, followed by the analysis you need for the document and the conversation with Ray.

  ### Rule 1: Priority of Imminent Mortality (The "Dead is Dead" Standard)

  **Protocol Language:**
  > "Dispatch priority shall be assigned based on the immediacy of threat to life. Victims facing imminent mortality (e.g., active submersion, unconsciousness, cardiac distress) take precedence over victims in stable distress (e.g., entrapment with airway, hypothermia without airway compromise), regardless of the number of victims in the lower-priority group. Resources are not to be divided if doing so compromises the rescue of the imminently threatened victim."

  *   **Consistency:** This explains the **Flooded Car** call (1 unconscious vs. 5 standing) and predicts the **Bus Scenario** (1 drowning vs. 26 injury). It aligns with Ray's quote: *"Who's going to be dead if we're wrong."*
  *   **Where It Strains:** It breaks on the **House Collapse** (12 in water vs. 1 on fence, "all equally bad off"). If all were equally likely to die, this rule demands a coin flip or a split, yet Ray went for the 12. It also strains on the **Tree Well** (1 buried vs. 3 digging). The buried skier had the highest imminence (20 mins), yet Ray split the team rather than concentrating on the surest death.
  *   **Bus Scenario Prediction:** **Save the Man (Location B).** The 26 students face morbidity (limb loss/vision); the man faces mortality. Under this rule, death trumps numbers.

  ### Rule 2: Threshold Utilitarianism with Moral Randomization (The "Greatest Good" Standard)

  **Protocol Language:**
  > "Dispatch priority shall be assigned to maximize the total number of survivors. When risk profiles are comparable, resources shall be deployed to the larger group. However, when the numerical disparity is less than 4:1 and risk profiles are similar, Commanders should utilize resource splitting or randomized selection to avoid subjective valuation of specific victims."

  *   **Consistency:** This explains the **House Collapse** (12 vs. 1), the **Tubers** (8 vs. 1), and the **Ice Storm** (3 vs. 1 = Coin Flip because the ratio is below the threshold). It also explains the **Tree Well** (Splitting the team avoids "picking which party loses").
  *   **Where It Strains:** It completely breaks on the **Flooded Car** call. Five standing people outweigh one unconscious person numerically (5:1), yet Ray chose the one. This rule cannot explain why Ray would ever choose the single victim over a group unless the "risk profile" is weighted so heavily toward death that it becomes Rule 1.
  *   **Bus Scenario Prediction:** **Save the Bus (Location A).** The ratio is 26:1. This is well above the 4:1 threshold established by the Ice Storm (3:1) and House Collapse (12:1). The "Greatest Good" dictates saving the 26, even if the cost is the life of the one.

