  - keep it tight, like 4 to 8 lines, and it should be sayable out loud at a table rather than an essay wearing a joke costume.

  then, separately and in like two sentences, tell me what the joke is doing mechanically — which feature of the problem the punchline is actually keyed to — so I can check whether it lands before I send it. no need to cite anything or point me at reading, I just want to know you hit the right nerve and not a generic nerd-joke one.
