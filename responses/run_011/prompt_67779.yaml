answer: |-
  **Brainstorming Note**

  The **Content** thesis (art asserts political claims) is the most stable; it is textually ubiquitous and philosophically thin, serving as a baseline rather than a pivot. The **Function** thesis (art does social work) is also robust, aligning with Du Bois's sociological training. The **Design** thesis (art is engineered to move an audience) is the load-bearing beam but also the greatest risk. It risks collapsing if it turns out that Du Bois views *true* aesthetic experience as inherently moving without deliberate engineering, which would render the "propaganda" label redundant. The success of the project hinges on whether the audience-relative constraint can save the Design thesis from charging Du Bois with advocating didactic kitsch. If "quality" cannot be successfully cashed out as "audience-specific efficacy," the distinction between Design and Function blurs, and the tripartite model fails.

  ***

  **Project Title:** The Architecture of Uplift: Reconstructing Du Bois's Aesthetics of Propaganda

  **Research Question**
  Can W.E.B. Du Bois's assertion that all art is propaganda be reconciled with his demand for high artistic quality without resorting to charges of incoherence, simple instrumentalism, or the dilution of propaganda into mere truth-telling? This project seeks a determinate answer: Du Bois's position is coherent if and only if propaganda is parsed into distinct claims about content, design, and function, and if artistic quality is understood as audience-relative efficacy rather than autonomous formal value.

  **Statement of the Problem**
  Scholars of Black political thought and aesthetics typically resolve the tension in Du Bois's late-career aesthetics in one of three ways. First, the instrumentalist reading argues he subordinates art to racial uplift, sacrificing aesthetic value for political utility. Second, the developmentalist reading suggests he is torn between irreconcilable commitments, oscillating between autonomy and engagement. Third, the veridical reading attempts to dissolve the tension by arguing that for Du Bois, propaganda must be true to be effective, thereby aligning political utility with truth.

  All three readings fail because they treat propaganda as a monolithic concept. They miss that the term performs triple duty in his work. By failing to distinguish between what a work says (content), how it is built to affect a viewer (design), and what it actually achieves in a social context (function), existing scholarship forces a choice between art and politics that Du Bois himself rejected. Furthermore, these readings ignore the audience-relative nature of his claims. What counts as effective design for a white audience accustomed to caricature differs radically from what counts for a Black audience seeking self-representation. Consequently, his notorious complaints about quality are misread as bids for bourgeois artistic autonomy rather than diagnoses of political inefficacy. A work that fails to move its intended audience is not just politically useless; on his view, it is aesthetically deficient.

  **Methodology and Work Plan**
  This project employs a method of charitable reconstruction combined with conceptual analysis. I will treat Du Bois's aesthetic statements not as scattered remarks but as components of a unified, albeit implicit, system. The twelve-month fellowship year will be divided into four phases.

  *Months 1–3: Textual Reconstruction and Taxonomy.*
  I will compile every instance where Du Bois deploys the term propaganda in relation to art between 1920 and 1940. The goal is not exegesis but taxonomy. I will code each instance according to whether it refers to propositional content, intentional design, or social function. This phase produces a mapped dataset showing where he shifts between these meanings without signaling the transition, which is the primary source of scholarly confusion.

  *Months 4–6: Conceptual Analysis of Design and Quality.*
  This is the core philosophical work. I will develop the argument that design is conditional. Du Bois endorses engineering art for effect only when the engineering does not undermine the work's capacity to sustain attention. I will analyze his critiques of specific artists to demonstrate that his demand for quality is a demand for durability. A poster agitates, but a poem endures; if the goal is long-term racial uplift, the design must support endurance. I will argue that quality is the metric for whether the design succeeds over time.

  *Months 7–9: The Audience-Relative Constraint.*
  I will test the hypothesis against his differing advice to Black versus white audiences. When addressing white gatekeepers, he emphasizes shared humanity to disrupt prejudice (a specific design constraint). When addressing Black creators, he emphasizes truth and beauty to combat internalized inferiority (a different design constraint). I will draft two case studies applying the tripartite framework to his commentary on theater and visual arts to show how the standard of quality shifts based on the target demographic.

  *Months 10–12: Synthesis and Drafting.*
  I will assemble the findings into a dissertation chapter and a standalone article. The focus will be on refining the definition of efficacy. If the argument holds, efficacy is not immediate persuasion but the long-term alteration of the imaginative landscape. I will conclude by situating this reconstructed view within contemporary debates on aesthetic agency, showing how Du Bois offers a third path between autonomism and engagement.

  **Conditions for Success and Failure**
  Success looks like a model that explains why Du Bois criticized certain overtly political works as bad art without retreating to art-for-art's-sake. If I can show that his criticism of propaganda art was actually a criticism of *ineffective* propaganda due to poor design, the coherence of his position is secured.

  Failure would result if the distinction between Design and Function proves untenable. If it turns out that Du Bois believes the social function of art is entirely independent of the artist's design intentions, then the Design thesis collapses. In that scenario, his demand for quality reverts to a standard aesthetic autonomy claim, and the specific contribution of this project—reframing quality as efficacy—would be unsustainable. Another failure condition is textual: if the audience-relative distinction cannot be supported by his private correspondence and public edits, the hypothesis remains speculative.

  **Scope and Limitations**
  The primary limitation is temporal. This project focuses on the period surrounding the Harlem Renaissance and the founding of *The Crisis*. It does not attempt to reconcile these views with his later turn toward socialism in the 1950s, where the definition of propaganda shifts again. Additionally, this project addresses Du Bois's aesthetic theory, not his creative practice. While I will use his commentary on other artists as data, I will not perform a literary analysis of his own fiction. Finally, this is a reconstruction of Du Bois's specific framework, not a general defense of propaganda art. The goal is to solve the interpretive puzzle of his coherence, leaving the broader normative question of whether he was *right* about art for subsequent work.
