      *   *Design:* This is the tricky one. If Du Bois demands high art, does he really endorse *engineering* art for effect? That sounds like kitsch or didacticism, which he often criticized. The tension lies here: Can you design for effect without sacrificing the "high quality" he demands? This is where the "audience-relative" insight saves it.
      *   *Collapse Risk:* The "Design" thesis might collapse if it turns out Du Bois thinks *true* art moves people *without* deliberate engineering. The distinction between "art that moves" and "propaganda that moves" might blur.
