answer: |-
  ### I. Specification of Adequacy: The Darwinian Standard

  To count as a genuinely Darwinian *theory* of cultural change rather than a Darwinian *idiom*, an account must satisfy the following five requirements. Each is anchored to a specific empirical or conceptual problem that distinguishes explanatory power from retrospective labeling.

  **1. The Explanandum Requirement (Cumulative Adaptive Complexity)**
  *   **Requirement:** The theory must explain the accumulation of functional design over time (the "ratchet effect"), where later iterations perform better than earlier ones, without requiring every learner to reinvent the wheel. It must distinguish this from mere frequency changes or drift.
  *   **Generating Case:** *Tool Traditions vs. Playground Rhymes.* Playground games mutate and spread but do not necessarily improve in function; kayak designs do. A theory that fits both equally well without distinguishing the mechanism of *improvement* is descriptive, not explanatory. The standard demands an account of how information is preserved against entropy long enough to be built upon.

  **2. The Fidelity and Unit Requirement (Transmission Mechanics)**
  *   **Requirement:** The account must specify the mechanism of inheritance. It must demonstrate how cultural information survives the "noisy channel" of communication. It cannot assume discreteness; it must prove that the relevant units are stable enough to support lineages.
  *   **Generating Case:** *Reconstruction vs. Copying.* If a learner reconstructs a behavior from scratch based on observing a goal (emulation) rather than copying the specific action (imitation), is it inheritance? A Darwinian account must show that the *information* causing the trait is transmitted, not just the environmental trigger. If fidelity is too low, selection cannot act; if units are too fluid, lineages dissolve.

  **3. The Variation Source Requirement (Blindness vs. Guidance)**
  *   **Requirement:** The theory must specify the origin of novelty. To be strictly Darwinian, variation must be uncoupled from its fitness consequences at the time of generation (blind variation). If variation is systematically directed toward utility by the learner, the account is Lamarckian or hybrid, not purely Darwinian.
  *   **Generating Case:** *The Guided Variation Objection.* When a toolmaker modifies a bow to shoot straighter, the variation is induced by a understanding of physics, not random mutation. A Darwinian theory must either show that this guidance is negligible at the population level or admit that the "selection" load is carried by individual cognition, not population filtering.

  **4. The Bias Consistency Requirement (Psychological Realism)**
  *   **Requirement:** The model of transmission must be consistent with empirical data on how humans actually learn. It cannot assume passive copying if psychology shows active filtering. It must incorporate or refute content, prestige, and conformity biases.
  *   **Generating Case:** *Cultural Learning Psychology.* Humans do not copy randomly; we copy high-status individuals (prestige) or common behaviors (conformity). If a theory assumes random transmission for mathematical tractability but the phenomenon relies on prestige bias, the theory is empirically false. It must absorb these biases as part of the "selection" environment or the "transmission" mechanism.

  **5. The Falsifiability Requirement (The Risk of Failure)**
  *   **Requirement:** The framework must identify conditions under which a cultural domain is *not* evolving Darwinially. It must be possible for the theory to conclude that a specific phenomenon is better explained by diffusion, rational choice, or developmental constraint.
  *   **Generating Case:** *The Tautology Trap.* If every spread of a trait is defined as "selection" and every trait's persistence is defined as "fitness," the theory cannot fail. A genuine theory must allow for a domain (e.g., fashion trends) to be shown as drift-dominated or rationally directed, such that applying Darwinian tools yields poor predictive power.

  ***

  ### II. The Sorting Work

  **Necessary vs. Contingent Commitments**
  The requirement for **bounded, recombinable, gene-like units** is contingent baggage, not a necessity. This follows from the work of Godfrey-Smith and Sterelny on "Darwinian Populations." The explanatory job is done by *heritability* and *differential fitness*, not by particulate ontology. You can have continuous traits and reconstructive inheritance so long as there is a statistical correlation between parent and offspring traits sufficient for selection to act. Insisting on discrete memes is a commitment to a specific ontology (orthodox memetics) rather than the logic of natural selection itself.

  **Joint Unsatisfiability**
  There is a precise tension, bordering on unsatisfiability, between **High Fidelity**, **Blind Variation**, and **Cumulative Design** in cultural domains.
  *   *The Conflict:* Cumulative design requires high fidelity (to keep the design). High fidelity in culture usually requires understanding/reconstruction (to copy the complex task). But reconstruction implies *guided* variation (the learner fixes errors based on function). If variation is guided, it is not blind.
  *   *The Result:* You cannot have a *strictly* Darwinian account of cumulative culture that also respects the cognitive reality of human learners. You must accept a hybrid: Darwinian population dynamics acting on variation that is partially pre-filtered by individual intelligence. If a theory insists on all three (High Fidelity + Blind Variation + Cumulative Design) without acknowledging the cognitive scaffolding, it is empirically false.

  **Graded Darwinism**
  Being a Darwinian population is **graded**, not all-or-nothing. Domains move up the scale based on:
  1.  **Heritability:** How strongly does the offspring trait correlate with the parent trait? (Tool making > Fashion).
  2.  **Variation:** Is there enough novelty for selection to act on? (Stagnant traditions < Dynamic industries).
  3.  **Fitness Dependence:** Does the trait's spread depend on its functional success or external factors? (Agricultural techniques > Ritual taboos).
  *   *Book Placement:* A book on **technological evolution** lands high on the scale (high heritability, functional fitness). A book on **linguistic change** lands in the middle (high fidelity, but drift plays a large role). A book on **viral internet trends** lands low (low fidelity, high prestige bias, low functional adaptation).

  **The Single Most Exclusionary Requirement**
  **The Variation Source Requirement (Blindness).**
  This excludes the most candidates because the vast majority of cultural change involves intentional modification. Most "theories" of cultural evolution smuggle intention into the variation step while calling the sorting step "selection." A strict Darwinian account must show that the *population-level* sorting does the heavy lifting, not the *individual-level* design. This rules out rational-choice models masquerading as evolution and orthodox memetics that ignores cognitive guidance.

  ***

  ### III. Scorecard

  **Orthodox Memetics**
  *Fails on Fidelity and Variation.* It posits gene-like units where none empirically exist (reconstruction is the norm, not copying) and treats variation as mutation-like rather than cognitively guided. It scores high on formalizing selection logic but fails the psychological realism and unit specification requirements. It risks being a vocabulary rather than a theory because it can label any spread as "memetic fitness."

  **Dual-Inheritance / Population Thinking**
  *Passes on Graded Darwinism and Biases.* It successfully incorporates prestige/conformity biases and allows for continuous traits. However, it often struggles to specify the inheritance mechanism precisely enough to distinguish itself from standard sociology. It meets the Falsifiability Requirement better than memetics by allowing for drift and non-adaptive change, but sometimes blurs the line between individual learning and population evolution.

  **Developmental / Cognitive View**
  *Fails on Population-Level Selection.* It excels at the Variation Source Requirement (accurately modeling guided variation and reconstruction) but often dissolves the Darwinian account entirely by locating all explanatory work inside the "black box" of the mind. It risks becoming a theory of individual psychology rather than cultural evolution, failing the Explanandum Requirement for *cumulative* population-level complexity that exceeds individual design capacity.
