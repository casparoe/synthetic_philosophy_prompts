answer: |-
  You're right that institutions are path-dependent, and you're right that copying rich-country institutions into poor countries often fails. But the conclusion you're drawing—that this kills the possibility of a general, lawlike social science—is a non sequitur. It relies on conflating three different kinds of contingency. Once we separate them, your argument stops doing the anti-theory work you want it to do.

  Here's the distinction that resolves the stalemate. Call a process **Level 1 contingent** if the sequence of events could have differed (who voted first, which firm launched Tuesday vs. Thursday). Call it **Level 2 contingent** if the final outcome could have differed, but the set of possible outcomes and their payoff structures are fixed and known. You know there are two equilibria, you know what they pay, you just don't know which one history will select. Call it **Level 3 contingent** if the set of outcomes itself, or the payoff structure carving up the space, could have been different.

  Your argument rests on QWERTY, VHS, and institutional lock-in. But every single one of those examples stops at Level 2. And Level 2 contingency is completely compatible with deterministic, predictive theory.

  Consider the Polya Urn model, the canonical example of path dependence. You have an urn with one red and one black ball. You draw a ball, put it back, and add another of the same color. Do this forever. The final proportion of red to black balls is entirely dependent on the early draws. If you get red early, you lock into a red-dominant equilibrium. If you get black, you lock into black. This looks like your argument: history matters, early accidents determine the end state.

  But here's the thing your side ignores: while the *realized* outcome is random, the *distribution* over outcomes is perfectly known. In the standard Polya Urn, every final proportion is equally likely. The mathematics governing the process are closed-form, deterministic, and predictive. We can tell you exactly how sensitive the system is to initial conditions. We can tell you the probability of landing in any given basin. Sensitivity to early events is not the same as theoretical unpredictability. A theory that hands you the number of basins, their boundaries, and the probability distribution over them is giving you everything a social scientist needs. It says, "You can't predict the specific coin flip, but you can predict the odds of the game." That is still science.

  For your argument to actually kill general theory, you need Level 3 contingency. You need to show that the landscape itself shifts in unmodelable ways. This would require something like preferences changing endogenously in response to the institutions themselves, or a technology altering what the alternatives even *are* in a way that couldn't be specified in advance. But that isn't what increasing returns do. Increasing returns just make the valleys deeper. They create multiple equilibria (Level 2), they don't erase the map. When you cite QWERTY, you're saying we locked into a suboptimal equilibrium. That implies the optimal equilibrium existed and was knowable. If the payoff structure was knowable enough to identify QWERTY as suboptimal, it was knowable enough to be part of a theory. You can't have it both ways: you can't claim we know enough to judge the outcome as inefficient while claiming the structure is too murky for theory.

  Now, let's take your two best shots seriously, because they're stronger than the QWERTY example.

  First, you argue that for real institutions, we can never write down the payoff function, so the basins aren't actually knowable in advance. You're conflating an epistemic limit with an ontological one. Just because measuring the payoff structure of a legal system is hard doesn't mean the structure doesn't exist. Physics deals with chaos theory and turbulent fluids where prediction is practically impossible beyond a short horizon, but we don't say fluid dynamics isn't a lawlike science. We say the measurement problem is hard. If your claim is just that institutions are complex, fine. But complexity isn't path dependence. If there is a fixed underlying structure—even a complex one—it is原则上 modelable. If your claim is that there *is* no fixed structure (true Level 3 contingency), you need to prove that institutions rewrite their own physics constantly. Increasing returns don't do that.

  Second, you argue that Level 2 unpredictability is fatal for policy because advice has to tell someone which basin they're currently in. If we can't know if a country is on the threshold of a "good" equilibrium or sliding into a "bad" one, how can we advise them? This is the strongest point, but it still doesn't vindicate the "no general theory" claim. It just changes the *type* of policy prescription.

  If path dependence works at Level 2, then "copy-paste" policy is indeed doomed. You can't just transplant a constitution and expect the same outcome because the starting coordinates differ. But that doesn't mean policy is impossible; it means policy must be about threshold-crossing. A general theory of Level 2 path dependence tells us that small pushes might do nothing, but big pushes can jump a system from one basin to another. It tells us that history matters, so we must diagnose the specific historical coordinate of the country before acting. That is still a general theory—it's a theory of context-dependent intervention rather than universal blueprinting. It saves policy from naivety, not from feasibility.

  So, here's where the argument actually lands. You are right that you can't tell poor countries to copy rich ones and expect identical results. The basins of attraction are separated by historical thresholds. But you are wrong that this destroys social science. The urn models prove that systems can be path-dependent and mathematically transparent simultaneously. The increasing returns arguments prove that outcomes are contingent, not that the rules governing them are unknowable.

  If you want to argue for Level 3 contingency—that the payoff structure itself is fluid and unmodelable—you need new evidence, because QWERTY and VHS don't get you there. They describe a world where multiple stable states exist, not a world where the concept of stability is meaningless. Until you can show that the landscape itself shifts in unpredictable ways, you're stuck with Level 2. And Level 2 is a world where history matters, but theory survives. You can print this out, but you should also know that accepting this doesn't mean you lose the core insight: it just means you have to share the room with science.
