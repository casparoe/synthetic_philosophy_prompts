          *   *Verdict on Trap:* It is a fact about *who staffs the methods*. The instrument encodes the Mobile ontology as the measurement model.

  5.  **Drafting the Verdict:**
      *   Is it a limitation of psychometrics? Yes, it brackets normativity.
      *   Is it a bundle of claims? Yes.
      *   *Synthesis:* Psychometrics is a tool for clarity, not resolution. It forces the debaters to admit when they are arguing about statistics vs. values.

  6.  **Refining and Polishing (Self-Correction during drafting):**
