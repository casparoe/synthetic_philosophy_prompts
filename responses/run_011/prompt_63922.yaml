  2.  **Deconstruct the Input Debate:**
      *   **Construct A (Rooted):** Loyalty to local institutions, continuity, craft, family, honor/dignity (contribution-based), suspicion of abstraction/credentials, stability/obligation > optionality. Claim: Truer to human need, less parasitic.
      *   **Construct B (Mobile):** Openness, self-reinvention, portable skills, cosmopolitan, evaluated by standardized measures. Claim: More defensible, less dependent on flattering self-description.
      *   **The Conflict:** Both claim superiority (normative) and truth (descriptive/ontological).

  3.  **Drafting the Translation (Psychometric Reframing):**
      *   *Outlooks* $\rightarrow$ Latent Constructs ($\eta_{rooted}$, $\eta_{mobile}$).
      *   *Claims about human need* $\rightarrow$ Criterion Validity / Predictive Utility.
      *   *Claims about truth/self-description* $\rightarrow$ Construct Validity / Social Desirability Bias / Acquiescence.
      *   *Suspicion of abstraction* $\rightarrow$ Differential Item Functioning (DIF) on abstract items.
      *   *Standardized measures* $\rightarrow$ Measurement Invariance assumptions.
      *   *Parasitic/Dependent* $\rightarrow$ Construct Irrelevant Variance / Method Effects.
      *   *Structure* $\rightarrow$ Unidimensional vs. Multidimensional vs. Latent Class.

  4.  **Developing the Residue Report (The Core Task):**

      *   *Category 1 (Clean):* Structural claims. Are they one dimension or two? (Correlated traits vs. opposite poles). DIF claims (do items work differently for different groups?). Reliability (consistency of the outlook).
      *   *Category 2 (Distorted):* "Truth" becomes "Reliability/Validity." "Human Need" becomes "Criterion." *Shift:* Normative weight becomes statistical fit. "Parasitic" becomes "Method Variance." *Shift:* Moral dependency becomes statistical covariance.
      *   *Category 3 (None):* The *Normative Claim* ("Better/Defensible"). Psychometrics measures *what is*, not *what ought to be*.
          *   *Criterion Validity Problem:* If we use "Life Satisfaction" as the criterion, who defined that scale? If we use "Economic Productivity," that favors the Mobile construct. The choice of criterion *is* the philosophical debate.
          *   *Empirical Results:* Scalar non-invariance doesn't prove one is right, just that intercepts differ. Mortality/Morbidity are external criteria, but linking them to "defensibility" requires a normative premise (e.g., "Longer life = better outlook"). That premise is not psychometric.
          *   *Category Error:* Deriving an 'ought' from an 'is' (Hume's Guillotine), specifically mapping *statistical fit* to *moral worth*.

      *   *Policing Terms:*
          *   "Bias": In psychometrics, systematic error. In debate, moral prejudice.
          *   "Valid": Measures what it intends. In debate, morally justified.
          *   "Functioning": Statistical operation. In debate, human flourishing.
          *   "Adaptive": Statistical fit. In debate, moral accommodation.

      *   *The Asymmetry Trap:*
          *   Standard psychometrics often assumes the "Mobile/Professional" view is the "True Score" because they write the items.
