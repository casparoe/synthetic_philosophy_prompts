  *(Self-Correction Note during drafting the response)*: I need to be careful not to simply say "Psychometrics can't do values." I need to explain *why* within the mechanics of the model (e.g., identification, model specification). The "Residue" isn't just "stuff left over," it's "stuff that breaks the model."

