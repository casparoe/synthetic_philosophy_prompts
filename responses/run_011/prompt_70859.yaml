answer: |-
  Case A: The book is published as a novel but treated by the book-world as authoritative history. You invent the woman's sensory experiences, private grudges, and the stairwell decision, anchoring them to the few known facts. Because the narrative is compelling and humane, the town adopts her as a hero, renames a bridge, and corrects the old slander. The invented interiority is the engine of this rehabilitation; without the emotional access, the documents remain cold and the slander sticks. The result is a posthumous reputation that is warmer and more just than the record supports, achieved through fabrication that no living person can contradict.

  Case B: You publish a scrupulous nonfiction account using only the extant documents, arranging them chronologically without commentary or invented thought. The payroll sheets show gaps implying theft; the letters show colleagues distancing themselves; the newspaper items hint at cowardice. No sentence is false, but the arrangement invites the reader to infer selfishness and caution where there might have been fear or bad luck. The town reads this definitive record and confirms the old slander, leaving her reputation colder and more damning than it might have been. The result is a posthumous reputation that is accurate to the paper trail but potentially unjust to the person, achieved through restraint that no living person can challenge.

  ***

  **Position (1): Posthumous Welfare**
  This view holds that people have interests—like reputation and legacy—that survive death and can be benefited or set back even if the subject experiences nothing. In Case A, the benefit consists plainly in the *satisfaction of the interest*: the world now matches what she would have wanted (a good name), regardless of her inability to feel pleasure about it. In Case B, her interest in a fair reputation is actively thwarted by the accurate but damaging inference. Verdict: (1) endorses A and condemns B. The moral weight rests on the outcome for the dead person's standing, not the living reader's experience.

  **Position (2): Authorization and Standing**
  This view holds that a person's inner life is private property; using it without consent is a violation of standing, regardless of the outcome. The single feature doing the work in Case A is not the first-person grammar but the *claim to epistemic access*—the assertion that the author knows what the dead woman felt. Repair: If you switch Case A to third-person limited ("She felt the cold" instead of "I felt the cold") but keep the invented interiority, the unease survives unchanged. The violation is trespassing on mental states, not pronoun selection. In Case B, the author stays within the public record, violating no private boundary. Verdict: (2) condemns A and endorses B. The moral weight rests on the right to control one's narrative, not the welfare of the reputation.

  **Position (3): Duties to the Living**
  This view holds that the dead have no moral status; duties run only to readers and the community's memory practices. In Case A, the living gain a useful myth that strengthens community cohesion and corrects a social wrong. In Case B, the living gain historical integrity and a clear lesson on the limits of evidence. Both serve the living community, just differently. Verdict: (3) endorses both A and B. This tracks neither (1) nor (2); it ignores the dead woman's welfare and rights entirely, focusing solely on the utility and honesty owed to the current population.

  ***

  **Design Check and Variants**
  The design goal holds: (1) splits +A/−B, (2) splits −A/+B, and (3) lands on +A/+B. However, two stress points require disclosure. First, for Position (1), the variant of Case B that weakens the verdict is one where the documents were already public before the book existed. If the slander was already accessible in the archives, the author did not *set back* the interest; she merely highlighted existing damage. The verdict shifts from "condemn" to "permissible negligence," weakening (1)'s bite. Second, the strongest attack the worst-off view (Position 2) can make on the whole setup is that it treats the dead as raw material for the living's moral projects. Whether you benefit or harm them, you are using a person without consent, turning them into a tool for your own artistic or ethical ends. This attacks the premise of both cases: the dead are not resources.

  **Practical Application**
  To satisfy Position (2) without giving up the voice, you cannot strictly succeed, because (2) forbids unauthorized access to interiority regardless of form. However, you can mitigate the violation by changing the contract with the reader. You must explicitly signal the trespass. Add a meta-fictional frame or an author's note that admits the interiority is speculation, not recovery. Phrase it as "I imagine she felt" rather than "She felt." This does not grant standing, but it stops the book from claiming authority it doesn't have. It shifts the work from "biography" to "meditation," satisfying the demand for honesty even if the standing issue remains. If you present it as truth, you lose (2). If you present it as a guess, you survive it.
