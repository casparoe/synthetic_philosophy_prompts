          *   The friend is technically correct about *formal* logic. If $\Gamma \vdash \phi$, and $\phi$ contains predicate $P$, then $\Gamma$ must contain $P$ (or something equivalent). This is Prior's "Runabout Inference Ticket" / Tonk problem territory, but generally, you can't get new vocabulary out of nowhere.
          *   Does this apply to 'hobbit'? Yes. Does it apply to 'ought'? Formally, yes.
          *   Is there an asymmetry? Yes. 'Hobbit' is obviously fictional/discretionary. 'Ought' claims truth-aptness and action-guiding force. The asymmetry isn't in the *logic*, it's in the *semantics/metaphysics*. The friend conflates logical syntax with metaphysical grounding.
          *   *Key distinction:* Trivial logical constraint vs. Substantive metaphysical gap.

      *   *Point 2: Logical Consequence vs. Evidential Support.*
          *   Logical consequence is binary and formal (valid/invalid).
          *   Evidential support is probabilistic, epistemic, and often ampliative (inductive/abductive).
          *   Hume's Law is often read as "You can't *derive* ought from is." But the real worry is "You can't *justify* ought from is."
          *   The friend focuses on deduction. The user focuses on justification/evidence.
