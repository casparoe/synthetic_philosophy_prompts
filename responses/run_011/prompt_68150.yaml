      *Refining the "Verdict":* The friend is right that Hume's Law *as a logical thesis* is trivial. The user is right that Hume's Law *as a metaethical thesis* is non-trivial. The disagreement is about which thesis matters. The genuine issue is the *autonomy of ethics*.

      *Refining the "Bridge Premise":* The friend says calling it non-moral is stipulation. The user says it allows the inference. The truth is: If the bridge is a necessary identity, the inference is valid. But the *warrant* for the bridge is the real battleground.

