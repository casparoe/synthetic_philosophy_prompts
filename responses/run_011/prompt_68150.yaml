answer: |-
  You and your friend were talking past one another because you were operating in different registers: he was speaking the language of formal syntax, and you were speaking the language of epistemic justification. Hume's Law is notoriously slippery because it is often presented as a logical constraint when it is actually motivated by a metaphysical or epistemological worry. Below is the conceptual geography you requested, divided into the four sections you specified.

  ### 1. The Conservativeness Argument and Its Limits

  Your friend's argument relies on a theorem of formal logic often called the *conservativeness of logic* (or sometimes non-creativity). Stated precisely: If you have a set of premises $\Gamma$ and a conclusion $\phi$, and $\phi$ contains a predicate $P$ that does not appear in $\Gamma$, then $\phi$ cannot be validly deduced from $\Gamma$ unless the meaning of $P$ is fixed by logical constants alone. In simpler terms: you cannot validly conclude something about $X$ using premises that say nothing about $X$.

  Your friend is technically correct that this applies to 'ought' just as it applies to 'is a hobbit'. If your premises contain only descriptive vocabulary (mass, velocity, location), you cannot deductively derive a conclusion containing moral vocabulary (right, wrong, obligatory) without a premise linking the two.

  **What this establishes:**
  It establishes a trivial constraint on *deductive validity*. It proves that moral conclusions require moral (or morally-loaded) premises.

  **What this does not establish:**
  It does not establish that moral properties are metaphysically distinct from natural properties, nor does it establish that moral claims cannot be *true* in virtue of natural facts. It is a rule about symbols, not the world.

  **The Asymmetry:**
  You asked if this is compatible with a substantive asymmetry between moral vocabulary and 'is a hobbit'. It is. The conservativeness thesis is purely syntactic; it treats all non-logical predicates equally. However, the *motivation* for caring about the is-ought gap relies on a semantic asymmetry that 'hobbit' lacks.
  *   **'Is a hobbit':** This predicate is descriptively inert. There is no expectation that it should supervene on physical facts or guide action.
  *   **'Ought':** This predicate is taken to be normative. It implies reasons for action, accountability, and supervenience on natural facts.

  The conservativeness argument ignores this asymmetry. It shows that you need a bridge premise to get 'ought' from 'is', but it remains silent on whether that bridge premise is a substantive metaphysical discovery (like "Water = H2O") or a mere linguistic stipulation. Your friend treats the gap as a syntactic boundary; you treat it as a metaphysical chasm. Both are compatible with the conservativeness theorem, but only your view treats the gap as philosophically interesting.

  ### 2. Logical Consequence vs. Evidential Support

  This is the primary source of your cross-purpose. You moved between two distinct notions of "following from."

  **Logical Consequence:**
  This is a binary, all-or-nothing relation defined by truth preservation. If the premises are true, the conclusion *must* be true. This is your friend's domain. In this domain, Hume's Law is trivial: obviously, you can't deduce a conclusion containing new terms without a premise containing those terms.

  **Evidential/Explanatory Support:**
  This is a gradient relation defined by confirmation, probability, or grounding. Does the fact that an action causes suffering *make it probable* that the action is wrong? Does the natural fact *explain* the moral fact? This is your domain.

  **Why moving between them is not relabeling:**
  If the issue were only about logical consequence, naturalism would be safe. A naturalist can simply assert, "Wrongness *is* the property of causing suffering." Once this identity is accepted as a premise, the deduction is valid.
  However, the philosophical worry behind Hume's Law is almost never about deduction. It is about *warrant*. Even if the deduction is valid, where do we get the warrant for the bridge premise?
  *   If the bridge premise is justified by moral intuition, then we haven't derived ought from is; we've derived ought from (is + moral intuition).
  *   If the bridge premise is justified by empirical observation alone, then the gap is closed.

  Your friend insists on the logical definition to make the problem vanish (it's just a missing premise). You insist on the evidential definition to keep the problem alive (how is that premise justified?). Shifting from logic to evidence changes the question from "Is the argument valid?" to "Is the argument sound and non-question-begging?" These are not the same question.

  ### 3. The Classification Problem and the Bridge Premise

  This is the crux of the dispute. You suggested that if we allow a bridge premise (e.g., "Wrongness = causing net suffering"), the inference goes through. Your friend replied that this just relocates the problem to the status of that premise.

  **What makes a premise non-moral?**
  A premise is non-moral if its truth conditions can be settled without invoking moral concepts or engaging in moral deliberation. "The knife has a sharp edge" is non-moral; we check it with physics and perception. "The knife ought not be used to harm" is moral.

  **The Naturalist's Bridge:**
  The naturalist claims the bridge premise is an identity statement: *Moral Property M = Natural Property N.*
  *   **If this is analytic (true by definition):** Then the friend is right. It is bookkeeping. We defined 'wrong' as 'causing suffering'. But this risks making moral disputes merely verbal, which many find implausible.
  *   **If this is synthetic a posteriori (a discovery):** This is the stronger naturalist position (analogous to Water = H2O). The premise is metaphysically necessary but known through investigation.

  **The Classification Trap:**
  Your friend argues that calling this bridge premise "non-moral" is stipulation. He is partially right. If the identity holds, then any statement about M is *also* a statement about N. So, "Wrongness is causing suffering" is both a moral claim (about wrongness) and a natural claim (about suffering).
  However, the *justification* for the identity matters.
  *   If you justify the identity using moral premises ("It would be unjust if wrongness weren't causing suffering"), the argument is circular. You are using morality to ground morality.
  *   If you justify the identity using purely natural premises ("Causal role analysis shows the property playing the 'wrongness' role is the 'suffering' property"), then you have genuinely derived the moral from the non-moral.

  **Material Validity:**
  If the identity is necessary (a posteriori), the argument is *materially* valid. The world makes it valid, not just the syntax. But this does not help the epistemology. We still need to know *that* the identity holds. If our only access to that identity is through moral reflection, the is-ought gap remains as an epistemic barrier, even if it is closed as a metaphysical barrier.

  ### 4. Verdict and the Genuine Remaining Issue

  **Who was closer to right?**
  You were both right about different things, but you were closer to the philosophical heart of the matter.
  *   **Your Friend:** Is correct that Hume's Law, interpreted strictly as a thesis about *deductive validity*, is a trivial logical truth that poses no threat to naturalism. It is indeed "bookkeeping." No one thinks moral conclusions pop out of thin air without moral assumptions.
  *   **You:** Are correct that this triviality evades the substantive worry. The worry was never about syntax; it was about autonomy. The real question is whether moral truths are *independent* of natural truths or *constituted* by them, and whether we can access the latter without presupposing the former.

  **The Genuine Issue:**
  The disagreement dissolves only if you stop arguing about "derivability" and start arguing about **The Autonomy of Moral Justification.**

  Here is the formulation of the problem that has a determinate answer (or at least a clear battleground):

  > **The Question:** Can the identity between moral properties and natural properties be established using *only* non-moral methods of inquiry (e.g., empirical science, conceptual analysis of non-moral terms), without begging the question by presupposing moral commitments?

  *   **If Yes:** Then naturalism is true, and the is-ought gap is merely a syntactic artifact. Your friend wins.
  *   **If No:** Then moral knowledge requires a distinctively moral faculty (intuition, sentiment, etc.), and moral properties are epistemically autonomous even if they are metaphysically identical to natural properties. You win.

  Your friend tried to solve this by pointing out that logic requires premises. You tried to solve this by pointing out that premises need support. The actual battle is over the *source of support for the bridge premise*. If the bridge premise can only be warranted by moral intuition, then you cannot get ought from is; you can only get ought from (is + ought). That is the non-trivial version of Hume's Law, and it is the one that survives your friend's logical bookkeeping.
