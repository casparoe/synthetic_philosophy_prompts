answer: |-
  Fidelity is owed to the poem's structural frame and specific content above its textual texture or method of composition, provided the identity of the addressee remains inviolate.

  This principle distinguishes between the poem's skeleton (line count, addressee), its flesh (specific images, narrative substance), and its skin (meter, register, rhyme placement, authorship process). Verdict 1 fails because it replaces flesh (substance) with counterfeit flesh (headache), leaving a skeleton without a body. Verdict 2 succeeds because it alters only the skin (meter) while preserving skeleton and flesh. Verdict 3 fails because it breaks the skeleton (line count), which your instinct correctly identifies as fatal despite your inability to explain why; the frame defines the object's boundaries. Verdict 4a succeeds because rhyme quantity is skin, fungible across the surface; Verdict 4b fails because specific images are flesh, localized and non-fungible (bed ≠ correspondents). Verdict 5a succeeds as register is skin; 5b fails as it removes the flesh of teasing; 5c fails because inventing new flesh (dress) violates the specific content clause even if the function (tease) remains. Verdict 6 fails because the name is the core identity. Verdict 7 succeeds because method is irrelevant to the final object's integrity.

  Regarding your four new situations: A companion poem in the lady's voice is **not acceptable**, as it violates the identity of the subject and the specific content of the original plea. A draft updating the illness to modern convalescence is **not acceptable**, as it alters the specific concrete imagery (flesh) of the period and condition. A scrupulously faithful prose rendering is **not acceptable**, as it abandons the structural frame (line count) entirely, reducing the poem to a letter. A version generated by a program is **acceptable**, provided the result meets the criteria of frame, content, and identity, as the method of composition is irrelevant.

  The cost of this principle is Verdict 3. While your intuition marks the loss of a single line as fatal, a simpler principle—"Substance and Identity over Form"—would require you to surrender both Verdict 2 and Verdict 3, accepting that if meter is flexible, line count should be too. However, to maintain a usable distinction between architecture and decoration, you should surrender only Verdict 3. It is the superstition in the system; line count is no more sacred than line length unless you treat the poem as a magic square rather than a communication. Accepting 27 lines simplifies the principle to "Content and Identity are sacred; Form is secondary," removing the need to arbitrate between meter and count.

  This commits you to a contradiction regarding your own fiction. You blamed the translator who ignored paragraph lengths (structural frame) which aligns with this principle, but you praised the translator who cut a subplot (specific content) to keep rhythms (textural texture). Your poetry principle demands fidelity to content over texture; your fiction preference demonstrates the opposite. You must decide whether your work is defined by its story (content) or its music (texture), for you cannot prize the music in your novels while demanding the story be sacrosanct in your epigraphs.
