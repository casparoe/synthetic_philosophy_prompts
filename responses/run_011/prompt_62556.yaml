answer: |-
  # The Genetic Information Decision Tree

  **Instructions:** Begin at **Node 1**. Answer the question based on your intuition about the biological case described. Follow the direction indicated (Yes/No) to the next Node number until you reach a **Leaf**.

  ### The Nodes

  **Node 1: Mapping Arbitrariness**
  If we engineered a cell where the physical affinity between the codon UUU and Phenylalanine was swapped globally so that UUU recruited Glycine instead, would we say the *instruction* in the DNA had changed, or merely the *physics* of the manufacturing?
  *   **Yes (Instruction changed):** Go to Node 2.
  *   **No (Physics changed):** Go to Node 4.

  **Node 2: Error Possibility**
  In a system where every molecular interaction follows standard physical laws without breakage or external interference, can a translation event still be correctly described as "mistaken" rather than just "happening"?
  *   **Yes (Normative error possible):** Go to Node 3.
  *   **No (Physical necessity only):** Go to Node 5.

  **Node 3: Machinery Status**
  Are the tRNA synthetases and ribosomes best described as *interpreters* negotiating a convention, or as *physical components* of the manufacturing plant like the mold in a factory?
  *   **Yes (Interpreters):** Go to Node 6.
  *   **No (Components):** Go to Node 7.

  **Node 4: Key/Lock Analogy**
  Is the specificity of the codon-amino acid relationship explainable entirely by chemical affinity (like a key fitting a lock), or does it require a historical convention to make sense?
  *   **Yes (Chemical affinity):** Go to Node 8.
  *   **No (Historical convention):** Go to Node 2.

  **Node 5: Receiver Dependence**
  Did the DNA sequence possess its instructional content before the cellular machinery evolved to process it, or did the content emerge only with the reader?
  *   **Yes (Content pre-existed):** Go to Node 9.
  *   **No (Content emerged with reader):** Go to Node 10.

  **Node 6: Semantic Content**
  Does a "stop codon" signify a command to halt (semantic), or does it merely describe a site where release factors physically bind (causal)?
  *   **Yes (Command):** Go to Leaf A.
  *   **No (Binding site):** Go to Leaf B.

  **Node 7: Context Stability**
  If the cellular environment changes, does the *information* in the DNA change, or just the *phenotypic effect* of that information?
  *   **Yes (Information changes):** Go to Leaf C.
  *   **No (Effect changes):** Go to Leaf B.

  **Node 8: Causal Symmetry**
  Is the DNA's causal role in development qualitatively distinct from the cytoplasm's causal role, or are they symmetric contributors to the outcome?
  *   **Yes (Distinct):** Go to Node 11.
  *   **No (Symmetric):** Go to Leaf D.

  **Node 9: Regulation Parity**
  Does a transcription factor binding to a promoter count as "decoding a signal" in the same sense as a ribosome reading a codon?
  *   **Yes (Same sense):** Go to Node 12.
  *   **No (Different sense):** Go to Leaf E.

  **Node 10: Developmental Scope**
  Is the final shape of the organism "specified" by the genome in the same sense that a protein sequence is specified?
  *   **Yes (Specified):** Go to Leaf F.
  *   **No (Not specified):** Go to Leaf D.

  **Node 11: Epigenetic Medium**
  Are heritable methylation marks a form of "script" comparable to base sequences, or merely switches on the reading hardware?
  *   **Yes (Comparable script):** Go to Leaf C.
  *   **No (Hardware switches):** Go to Leaf E.

  **Node 12: Maternal Provisioning**
  Is maternally supplied RNA in the egg "inherited information" passed to the offspring, or "environmental provisioning" like nutrients?
  *   **Yes (Inherited information):** Go to Leaf F.
  *   **No (Provisioning):** Go to Leaf E.

  ---

  ### The Leaves

  **Leaf A: Strong Informationalism**
  *   **Position:** DNA carries semantic information via a conventional code; the machinery are interpreters; this extends to development.
  *   **Weakest Case:** Struggles to explain context-dependent gene expression without positing infinite hidden messages.

  **Leaf B: Translational Informationalism**
  *   **Position:** The genetic code is real information, but only within the specific context of translation; it does not generalize to development.
  *   **Weakest Case:** Arbitrary boundary between translation (informational) and regulation (causal) despite structural similarities.

  **Leaf C: Contextual Informationalism**
  *   **Position:** Information is real but relational; the message changes if the cellular context/environment changes.
  *   **Weakest Case:** Risks collapsing "information" into "causal effect," losing the stability required for heredity.

  **Leaf D: Causal Parity (Developmental Systems)**
  *   **Position:** DNA is a causal resource among many; "information" is a misleading metaphor for symmetric developmental interactions.
  *   **Weakest Case:** Difficulty accounting for the intuitive asymmetry between DNA mutations and cytoplasmic changes in heredity.

  **Leaf E: Causal Specificity (Deflationary)**
  *   **Position:** DNA is a special causal difference-maker, but "information" adds nothing over "specificity"; regulation is not decoding.
  *   **Weakest Case:** Cannot easily explain the normative dimension of mutation (error vs. difference) without smuggling in semantics.

  **Leaf F: Expanded Informationalism**
  *   **Position:** Information is real in translation and extends to development/epigenetics/maternal effects; the "program" is distributed.
  *   **Weakest Case:** Dilutes the concept of "code" so broadly it may lose its technical utility for distinguishing genetic from environmental causes.

  **Leaf G: Unnamed (Hard Eliminativist)**
  *   **Position:** (Reached via Node 4 -> Node 8 -> Node 11 [No] -> Node 12 [No]... hypothetical path) There is no information, no code, and no special causal role; it is all physics.
  *   **Weakest Case:** Makes biological practice (sequencing, editing) inexplicable as anything other than brute manipulation.

  ---

  ### Unoccupied Combinations

  The following combinations of answers are logically possible given the nodes above but do not correspond to a stable leaf in this tree.

  1.  **Node 1 (No) + Node 2 (Yes):**
      *   *Combination:* The mapping is purely physical/chemical, yet "errors" are possible without physical breakage.
      *   *Status:* **Incoherent.** If the mapping is purely physical affinity (like a key), a "mistake" implies a physical mismatch. Normative error requires convention (Node 1 Yes).
  2.  **Node 3 (Yes) + Node 7 (No):**
      *   *Combination:* Machinery are "interpreters" (implying context matters), yet the information *never* changes with context.
      *   *Status:* **Unattractive.** If interpreters negotiate meaning, changing the interpreter's context should alter the message. Holding both suggests a "magic" code immune to its readers.
  3.  **Node 9 (No) + Node 12 (Yes):**
      *   *Combination:* Transcription is *not* decoding, but maternal RNA *is* inherited information.
      *   *Status:* **Unexplored.** Why would RNA be informational when supplied by the mother but not when transcribed by the nucleus? This suggests a bias toward heredity source over mechanism.
  4.  **Node 8 (No) + Node 10 (Yes):**
      *   *Combination:* DNA and Cytoplasm are symmetric causes, yet DNA content pre-existed the reader.
      *   *Status:* **Incoherent.** If causes are symmetric, DNA has no privileged status to carry "content" independently of the system (the reader) that processes it.

  ---

  ### Indistinguishable Leaves

  **Leaf B (Translational Informationalism) and Leaf E (Causal Specificity)**
  *   **Flag:** These leaves are difficult to separate using *only* the current nodes.
  *   **Reason:** Both agree that "information" does not extend to development (Node 9/10/12 paths converge). The distinction rests on whether translation is *semantic* (Leaf B) or just *causally specific* (Leaf E). Node 6 attempts to catch this, but a skeptic can answer "Binding site" (No) while still maintaining a deflationary view of information that looks functionally identical to Leaf B in practice. To separate them, one would need a node asking: "Does the term 'information' provide explanatory power beyond 'causal specificity' in translation?" which risks being a slogan.

  **Leaf C (Contextual) and Leaf F (Expanded)**
  *   **Flag:** These leaves may collapse under scrutiny.
  *   **Reason:** Both allow information to extend beyond the gene sequence (to context or epigenetics). Leaf C says the *meaning* changes; Leaf F says the *message* is broader. In practice, a proponent of F might agree that context changes the effective message (C), and a proponent of C might agree the message is distributed (F). The distinction is metaphysical (nature of the carrier) rather than empirical.
