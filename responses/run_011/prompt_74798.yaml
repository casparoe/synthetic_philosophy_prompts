  This dispute is fundamentally a substantive disagreement about the normative standards of mathematical justification, specifically regarding what constitutes a valid proof and what epistemic warrant it must provide. While it manifests ontologically, the core conflict is whether mathematics aims at mind-independent truth or mind-dependent construction. Consequently, it functions effectively as two distinct projects sharing a single name.

  Your hypothesis that the disagreement concerns what a proof is supposed to *do* is correct and aligns with the deepest philosophical cleavage here. The classical mathematician treats proof as a certificate of truth within a completed universe of objects; the law of excluded middle is valid because propositions possess truth values independently of our ability to verify them. For this camp, the value of a proof lies in its reliability for establishing facts that facilitate further deduction, even if those facts offer no algorithmic content. The constructivist, conversely, treats proof as a construction or a method; existence claims are promises of computation, and logical constants are defined by their verification conditions rather than truth tables. When you note that proof assistants treat this as an engineering decision, you are observing the practical crystallization of this normative split: one chooses classical axioms to import existing libraries efficiently, or constructive logic to extract executable code. The conservativity theorem you cite confirms that for $\Pi^0_2$ sentences—essentially the numerical predictions relevant to your PDE work—the two norms yield the same results. However, this empirical equivalence does not resolve the normative conflict because it does not dictate which warrant is *preferable* for the general case, particularly where quantifier complexity exceeds numerical verification. Progress is unlikely to look like a resolution where one side concedes, but rather as a clearer formal separation of the two enterprises, acknowledging that they optimize for different epistemic goods.

  | candidate diagnosis | what the two sides are really disagreeing about, on this diagnosis | evidence in favor | evidence against | what would count as progress |
  | :--- | :--- | :--- | :--- | :--- |
  | (1) a purely terminological disagreement about "exists," "or," and "not" | Whether logical constants are defined by truth conditions (classical) or verification conditions (constructive). | Both sides can translate statements into the other's language with systematic shifts in meaning (e.g., double negation translation). | The change in meaning alters the set of provable theorems (e.g., Intermediate Value Theorem), affecting mathematical practice, not just dictionary definitions. | A universally accepted translation manual that preserves utility without loss of information across both systems. |
  | (2) a substantive disagreement about the meaning and role of proof | Whether proof serves to certify mind-independent truth or to provide a warrant for construction and computation. | Matches the user's hypothesis and the historical Brouwer-Hilbert debate; explains why conservativity doesn't settle the issue. | Practitioners often ignore the philosophical distinction when results overlap, suggesting the role of proof is flexible rather than fixed. | Explicit documentation in foundational systems distinguishing truth-tracking proofs from program-extraction proofs. |
  | (3) a substantive ontological disagreement about which mathematical objects there are | Whether infinite totalities and non-constructible objects exist independently of human mental activity. | Classical mathematics assumes a platonic realm; constructivism restricts existence to what can be mentally constructed. | Ontological commitments often follow logical choices rather than driving them; many classical mathematicians are agnostic about platonism. | A metaphysical resolution on the status of infinite sets, though this is arguably outside mathematics proper. |
  | (4) two distinct projects sharing one name, a foundational one and a computational one | Whether the goal is to explore the structure of truth (foundational) or to ensure computability and implementation (computational). | Reflected in proof assistant engineering (Lean vs. Coq/Agda); classical libraries prioritize reuse, constructive ones prioritize extraction. | Both groups publish in the same journals and use the same terminology, maintaining the illusion of a single unified discipline. | Formal separation of namespaces or journals dedicated specifically to constructive vs. classical developments. |
  | (5) an ill-posed or in-principle-unanswerable question | Whether there is a fact of the matter about which logic is "correct" for all mathematical discourse. | The century-long stalemate and the symmetry of the conservativity argument suggest no external arbiter exists. | Clear formal differences exist (e.g., HA vs. PA), so the question is well-defined even if unresolvable. | Dissolution of the question by accepting pluralism in logical frameworks based on context. |
  | (6) a pragmatic disagreement about utility and risk management | Whether the risk of inconsistency from classical axioms is outweighed by the efficiency gains in proof development. | Classical mathematicians prioritize speed and continuity with history; constructivists prioritize safety and computational reliability. | Both sides claim their method is more useful, making this a subjective evaluation rather than a structural disagreement. | Empirical data showing constructive methods scaling to large formalization projects without classical axioms. |

