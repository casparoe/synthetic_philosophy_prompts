answer: |-
  **Part 0 — Diagnosis**

  The persistent stalemate between the Semanticist and Prohibitionist camps arises from a systematic equivocation on the terms *meaning*, *convention*, and *offense*. When Semanticists assert that derogation is part of the *meaning*, they refer to compositional semantic value—content that projects through embedding and contributes to truth conditions or expressive commitment. When Prohibitionists deny this, they refer to *social significance*—the normative status attached to the utterance act. Both agree that uttering *skrell* triggers sanctions and harm; they disagree on whether this trigger is located in the lexical entry (Semanticist) or in an external social rule governing the word's use (Prohibitionist).

  Furthermore, the parties diverge on the purpose of semantic theory. Semanticists aim to model the cognitive linguistic competence that explains why *skrell* behaves differently from *Velani* in complex sentences. Prohibitionists aim to model the social ontology that explains why a word becomes toxic regardless of its cognitive content. This is not merely terminological; it is a meta-theoretical dispute about whether semantic theory should absorb sociolinguistic norms. We regiment *meaning* henceforth as *semantic value* (contribution to truth conditions or expressive dimension) and *status* as *normative profile* (sanctions, offense, prohibition). We locate the meta-theoretical dispute here: if the normative profile varies independently of semantic value (as in N2), semantic theory may need to expand to include use-conditions, or Prohibitionists must admit that "slur" is a social kind, not a semantic one. This document proceeds without adjudicating that meta-question, focusing instead on the empirical predictions each view generates regarding the stipulated cases.

  **Part I — Agreed Claims**

  1.  *Skrell* and *Velani* are co-referential; they pick out the same set of individuals in all possible worlds.
  2.  Substitution of *skrell* for *Velani* is never merely stylistic; it invariably alters the normative profile of the utterance.
  3.  Offense and harm resulting from *skrell* are real and serious, not reducible to mere hurt feelings or subjective preference.
  4.  Speaker intention is insufficient to neutralize offense; a well-intentioned use of *skrell* can still harm (as seen in N4).
  5.  Disclaimers of intent (e.g., "I don't mean this offensively") do not remove the offensive character of *skrell* when used by out-group speakers.
  6.  Reclamation is a real phenomenon wherein in-group members alter the normative profile of *skrell* without changing its reference (as seen in N5).
  7.  The offensiveness of *skrell* persists under negation and in non-assertoric contexts, though often attenuated (as seen in N3).
  8.  A word can acquire slur status through deliberate stipulation and social adoption even without historical baggage (as seen in N1).
  9.  A previously neutral word can acquire slur status solely through prohibition and sanction, even without new descriptive content (as seen in N2).
  10. Competent speakers recognize the prohibition on *skrell* even if they cannot articulate the specific stereotypes associated with it (as seen in N1).
  11. Community membership determines acceptability; usage acceptable in Community A may be prohibited in Community B (as seen in N5).
  12. Ignorance of the prohibition does not prevent the occurrence of offense, though it may mitigate blame (as seen in N4).
  13. Both theories must explain why *skrell* projects derogatory force in embedded contexts where truth-conditional content usually does not.
  14. Both theories must explain how reclamation changes the word's status without changing its reference.
  15. The distinction between *mentioning* a word and *using* it is respected by both parties, yet even mentioning *skrell* can be jarring (as seen in N3).
  16. Sanctions for using *skrell* are social and institutional, not merely interpersonal.
  17. The lexical entry for *skrell* differs from *Velani* in some formal respect, whether semantic or pragmatic.
  18. The harm caused by *skrell* is not dependent on the hearer believing the stereotypes associated with the term.
  19. The prohibition on *skrell* is standing; it does not require case-by-case evaluation to trigger.
  20. Any adequate theory must account for the asymmetry between in-group and out-group usage regarding sanctions.

  **Part II — Disagreements Table**

  | Issue | Semanticist Formulation | Prohibitionist Formulation | Genuine or Verbal? | Resolution Condition | Evidence/Test | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Location of Derogation** | Derogatory content is encoded in the lexical semantics (truth-conditional or expressive). | Derogatory force is external to semantics; it is a social norm governing use. | Genuine | Determine if derogation contributes to truth conditions or projects like presupposition. | **N1 (Neologism)**: Does the stipulated stereotype become semantic content immediately? | **S**: Yes, content is encoded upon adoption. **P**: No, only the prohibition is encoded. |
  | **Status of Prohibited Neutrals** | If *brill* functions as a slur, it must have acquired derogatory semantic content. | If *brill* functions as a slur, it is because it is prohibited, not because its meaning changed. | Genuine | Determine if *brill* behaves semantically differently from *Velani* in embedding. | **N2 (Prohibited Neutral)**: Embedding tests on *brill* vs. *Velani*. | **S**: *Brill* will show semantic divergence. **P**: *Brill* will be semantically identical to *Velani*. |
  | **Embedding and Projection** | Derogatory content projects out of negation/conditionals because it is expressive content. | Offense persists in embedding because the prohibited word is uttered, not because content projects. | Genuine | Measure offense levels in negated vs. assertoric contexts. | **N3 (Scrubbed Speaker)**: Sanctions for negated uses of *skrell*. | **S**: Offense persists due to content projection. **P**: Offense persists due to violation of use-norm. |
  | **Context Sensitivity** | Reclamation changes the semantic content or indexical parameters for in-group speakers. | Reclamation lifts the prohibition for in-group speakers; semantics remain constant. | Genuine | Determine if truth-conditions shift between Community A and B. | **N5 (Two Communities)**: Truth-value judgments of *skrell* sentences in A vs. B. | **S**: Semantic value shifts with context. **P:** Semantic value is stable; norms shift. |

  **Part III — Cruxes and Pre-committed Concessions**

  The collaboration identifies three genuine disagreements that drive the theoretical divergence. These are ranked by their impact on the overall viability of each framework.

  **1. The Nature of Lexical Encoding (Rank 1)**
  This is the primary crux. If derogation is semantic content, it must behave like content in composition. If it is a use-norm, it should behave like a rule.
  *   **Semanticist Concession:** If embedding tests (N3) show that derogatory force cancels in specific logical contexts where expressive content usually projects, Semanticists will abandon the claim that derogation is a non-displaceable expressive dimension. They will revise their view to treat derogation as a pragmatic implicature generated by the prohibition.
  *   **Prohibitionist Concession:** If *brill* (N2) begins to exhibit truth-conditional differences from *Velani* (e.g., if "No *brill* is here" implies something different than "No *Velani* is here"), Prohibitionists will abandon the claim that slur status is purely external. They will accept that sustained prohibition can sediment into semantic content.

  **2. The Role of Speaker Knowledge (Rank 2)**
  This concerns whether the speaker's mental state affects the semantic contribution.
  *   **Semanticist Concession:** If the unknowing user (N4) causes offense identical to a malicious user without possessing the derogatory concept, Semanticists will abandon the claim that derogatory content requires speaker endorsement. They will accept that the content is "combinatorially external" and operates independently of speaker belief.
  *   **Prohibitionist Concession:** If the unknowing user (N4) is judged as having committed a semantic error rather than a social infraction by competent hearers, Prohibitionists will abandon the claim that the violation is purely normative. They will accept that the word carries a semantic requirement for speaker allegiance that was violated.

  **3. The Stability of Meaning Across Communities (Rank 3)**
  This concerns whether reclamation changes meaning or merely permission.
  *   **Semanticist Concession:** If speakers in Community A (N5) understand *skrell* sentences from Community B without translation error, Semanticists will abandon the claim that reclamation creates a distinct lexical entry. They will accept that reclamation is a shift in use-conditions only.
  *   **Prohibitionist Concession:** If speakers in Community B cannot accurately report the speech of Community A without losing the affectionate nuance, Prohibitionists will abandon the claim that semantics are stable. They will accept that reclamation alters the semantic value for the in-group.

  These concessions are binding. They represent the specific theoretical terrain each party is willing to vacate should the empirical evidence (as stipulated in the cases) lean decisively toward the opposing prediction. The ranking reflects the centrality of the lexical encoding issue: if derogation is not encoded, the Semanticist project collapses; if prohibition cannot explain embedding, the Prohibitionist project collapses.

  **Part IV — Residual Disagreement**

  **We, the Semanticists,** maintain that even if social norms govern use, the *systematic* behavior of slurs in composition—how they embed, how they project, and how they interact with operators—requires a semantic explanation. A purely normative account treats the linguistic behavior as epiphenomenal to the social rule. We insist that the reason *skrell* feels different from *Velani* in a conditional is not just that a rule was broken, but that a specific content was entertained. Our residual commitment is that semantic theory must model the cognitive reality of the derogatory concept, not just the social sanction. To reduce this to prohibition is to ignore the compositional machinery that makes the slur powerful in the first place.

  **We, the Prohibitionists,** maintain that semanticizing derogation risks reifying the very stereotypes slurs enforce. By locating the harm in the word's meaning, Semanticists grant the slur a kind of semantic legitimacy it does not deserve. Our residual commitment is that the harm is in the *act* of subordination, not the *content* of the proposition. The flexibility of slur status (as seen in N2 and N5) shows that social norms move faster than semantic change. To treat *skrell* as having a stable derogatory meaning is to misunderstand the political nature of the word. Our theory preserves the insight that the word is dangerous because of what we *do* with it, not because of what it *says*.
