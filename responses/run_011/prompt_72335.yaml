      *   *The "Indexical" Point:* The draft says the deficit is indexical ("nothing internal to the computation selects ours"). This is philosophically sharp but technically needs care. The computation produces *a* trajectory. Shadowing says *there exists* a true trajectory close to it. It does *not* say the computed trajectory corresponds to the *actual* physical initial condition.
