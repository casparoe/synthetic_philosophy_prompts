              *   *Critique:* The author claims this diagnosis is novel. It's not entirely. The "pragmatic turn" in verisimilitude exists. I need to warn them not to overclaim novelty on the *relativity* itself, but focus on the *formal mechanism* (partitions fixing metrics).
          *   *Decision:* The history is fine. The diagnosis of the "single sin" is bold but defensible if framed correctly. Warning needed on Oddie's existing work on context.

