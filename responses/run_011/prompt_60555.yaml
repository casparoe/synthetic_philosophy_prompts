prompt: |-
  I cover science and ideas for a general-interest outlet, and the least glamorous part of the job is a recurring editorial decision I currently make by reflex rather than by principle: whether a claim about the past counts as historical inquiry or as its counterfeit. The label is not decorative. Print it and the claimant's publisher, funder, or department chair calls my editor; decline to print it where it belongs and I have handed a large audience to a bad actor while telling myself I was being even-handed. I would like the principle before the next round of calls.

  So: write out the desiderata. What must a criterion of historical demarcation actually deliver before I could rely on it? For each requirement, give the consideration or the case behind it — I want the reasoning, not a list of labels. Then mark which requirements are non-negotiable for any adequate account and which are really the preferences of a particular camp (the falsificationist's, the sociologist's, the archivist's, the debunker's) dressed up as neutral conditions. If some subset cannot be jointly satisfied — if the list is itself an impossibility result — say so plainly and show exactly where it breaks. And tell me which single requirement does the most to exclude candidate criteria, since that is the one I should be arguing about rather than the ones everyone agrees on.

  To keep this out of the groove worn by the usual survey, here are the cases I need the list to get right.

  1. The Atlantis lineage runs through three very different performers: Plato, whose dialogues were plainly doing something other than reporting; Ignatius Donnelly, who in 1882 converted them into a literal world history with a thesis list and comparative tables; and a contemporary television presenter who commissions surveys, interviews specialists on camera, presents himself as merely following the evidence, and treats every specialist who disagrees as captured by a consensus. A good criterion should be able to say that these three are not in the same category and should say why without appealing to who has the distribution deal.

  2. A chronological revision advanced by a professional mathematician at a major research university and a member of his national academy, supported by statistical comparisons of chronicles and dynastic lists, which relocates essentially everything we call ancient Roman, Greek, and Egyptian history into the medieval period. The author has the credentials, the formal apparatus, and the citation practice of a scholar and none of the historical content. Tell me which item on my list does the work here — and note that if the answer is that the specialists reject it, my criterion has collapsed into an appeal to authority, which is precisely the charge the people I am arguing with make against me.

  3. Velikovsky. Astronomers mounted a campaign to keep Worlds in Collision off the presses at all, working through threats to boycott its publisher's textbook division rather than through refutation, and they were broadly right about the physics. A criterion on which establishment rejection is decisive would have classified the book as pseudohistory on the strength of a suppression campaign. The same criterion should also explain why, decades after the physics was settled, the surrounding subculture continued to reproduce itself without ever engaging the disconfirming result — and it should be able to distinguish that from a research programme simply being slow to die.

  4. The amateur who took a poem as a map. Schliemann went to Hisarlik because Homer said so, was treated as a nuisance by the professionals, excavated anyway, and announced that he had found Priam's city in a stratum now dated well over a millennium earlier than anything the epics could describe, with an excavation record that has been criticized ever since. My criterion cannot say that hunches drawn from literary sources are pseudohistorical, or it condemns him; and it cannot say that results vindicate method, or it makes demarcation hostage to luck and to the accidents of what survives.

  5. Heyerdahl's raft. A diffusionist thesis about the peopling of the Pacific that specialists regarded as motivated fantasy, pursued by building a vessel and sailing it — an intervention that produced data nobody had bothered to gather — and which genomic work on present-day Polynesian populations has since left partially standing, though not in the form Heyerdahl claimed and not for the reasons he gave. Where does the criterion put someone who was wrong in the aggregate but whose method improved the field's evidential position?

  6. Oral traditions that describe coastlines, islands, and landforms that no longer exist, apparently dating to the closing of the last glaciation. The evidential basis is testimony carried across hundreds of generations rather than artifacts, and the content arrives embedded in narrative, genealogy, and ceremony. Under any straightforward methodological test this is legend; under any test that credits independent corroboration against sea-level and geomorphological records, some of it is evidence. This case matters to me more than the others, because the same institution that would never knowingly run a pseudohistory piece has, for most of its existence, filed exactly this kind of testimony under folklore. The criterion has to explain the difference without conceding that the difference is who is doing the telling.

  7. Function. Much ancient-astronaut and lost-civilization writing has a traceable lineage in colonial-era speculation about who could possibly have raised the monuments of Africa and the Americas, and its central inference — this structure is too sophisticated for its attested builders — is not obviously defective as an inference. Method-based criteria look blind to this. But a criterion that demarcates partly on the social function of a claim will sweep in nationalist textbook disputes, state-mandated curricula, and the Lost Cause industry, which are not pseudohistory in the same sense and which I do not want to be writing about in the same register.

  Three constraints on the deliverable, which you should treat as part of the specification and are free to declare unsatisfiable if that is your verdict.

  - It must be operable by someone who is not a specialist in the period under discussion and who has about a day. If applying the criterion requires knowing whether a statistical technique has been correctly applied to a corpus of chronicles, it is not a criterion, it is a description of the specialist consultation I already commission.
  - It must be statable in print to a general reader in a way that does not reduce to trusting us.
  - It must not be gameable by a practitioner who has read it. This one may be the crux, and if you think it is fatal, say so and say what I should be using in its place.

  Close with a brief scoring pass — three sentences at most each — of a falsificationist account, a consensus-or-expertise account, an account in terms of immunizing strategies and degenerating programmes, and an account in terms of the social function of the claim, measured against the list you have built. I am not after a balanced tour: take a definite position on which requirements are genuine and which are one camp's preferences, on which one does the exclusionary work, and on what you would actually put in the style guide. If you conclude the project fails, argue for that conclusion outright instead of leaving me a menu.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Science/ideas journalist for a general-interest outlet.
      *   **Problem:** Needs a principled criterion to distinguish "historical inquiry" from "counterfeit history" (pseudohistory) for editorial decisions. Currently relies on reflex.
      *   **Goal:** A list of *desiderata* (requirements) for a demarcation criterion, with reasoning for each.
      *   **Specific Tasks:**
          1.  List requirements with reasoning/cases.
          2.  Mark which are non-negotiable vs. camp-specific preferences (falsificationist, sociologist, etc.).
          3.  Identify impossibility results (if any requirements conflict).
          4.  Identify the *single* requirement that does the most exclusionary work (the crux).
          5.  Apply the list to 7 specific test cases (Atlantis, Chronological Revision, Velikovsky, Schliemann, Heyerdahl, Oral Traditions, Function/Colonialism).
          6.  Adhere to 3 constraints: Operable by non-specialist in ~1 day; Statable to general reader without "trust us"; Not gameable by practitioners.
          7.  Close with a scoring pass of 4 specific accounts (Falsificationist, Consensus, Lakatosian/Immunizing, Social Function) and a definite recommendation for the style guide.
      *   **Tone:** Rigorous, philosophical but practical, direct, avoiding standard survey tropes.

  2.  **Deconstruct the Test Cases (Mental Sandbox):**

      *   *Case 1 (Atlantis):* Plato (myth/philosophy) vs. Donnelly (pseudohistory) vs. TV Presenter (pseudohistory/conspiracy). Need to distinguish intent/method, not just truth value.
      *   *Case 2 (Chronological Revision):* High credentials, formal math, wrong content. "Appeal to authority" trap. Need to check engagement with *historical* evidence, not just formal rigor.
      *   *Case 3 (Velikovsky):* Suppression vs. legitimate rejection. Need to distinguish "ignoring refutation" from "being suppressed."
      *   *Case 4 (Schliemann):* Hunch + luck vs. method. Can't punish the hunch, can't reward just the luck. Needs process orientation.
      *   *Case 5 (Heyerdahl):* Wrong theory, right data/experiment. Needs to value evidential contribution even if the thesis fails.
      *   *Case 6 (Oral Tradition):* Folklore vs. Data. Needs to handle non-material evidence without defaulting to "science says no."
      *   *Case 7 (Function):* Colonial racism vs. Nationalist curriculum. Both have social functions, but one is pseudohistory, the other is political misuse of history. Need to separate *epistemic* failure from *political* misuse.

  3.  **Develop the Desiderata (The "List"):**

      *   *Constraint Check:* Must be operable by a journalist in a day. This rules out deep technical verification. It must rely on *behavioral* and *structural* markers of the inquiry, not the truth of the conclusion.
      *   *Requirement 1: Responsiveness to Counter-Evidence.* (Not just falsifiability, but actual response). Handles Velikovsky.
      *   *Requirement 2: Continuity of Method.* (Does it use tools recognizable to the field, even if novel?). Handles Schliemann/Heyerdahl vs. Donnelly.
      *   *Requirement 3: Transparency of Uncertainty.* (Does it admit what it doesn't know?). Handles TV Presenter vs. Scholar.
      *   *Requirement 4: Independence of Conclusion from Identity.* (Does the claim rely on the *type* of person who built X?). Handles Case 7 (Colonialism).
      *   *Requirement 5: Engagement with the Specific Disciplinary Record.* (Not just "logic," but historical evidence). Handles Case 2 (Math guy).

      *   *Refining for "Non-Gameable":* This is the hard part. Pseudohistorians mimic peer review, mimic citations. The journalist can't verify the citations' accuracy in a day. They must verify the *structure of the argument*.
      *   *The "Crux":* What excludes the most? Likely *Responsiveness to Counter-Evidence* (Immunization).

  4.  **Analyze Conflicts/Impossibility:**

      *   *Constraint Conflict:* "Operable in a day" vs. "Not Gameable." If I publish the rule, bad actors will mimic the surface features (citations, acknowledging uncertainty rhetorically).
      *   *Resolution:* The criterion cannot be a checklist of *features* (e.g., "has footnotes"). It must be a test of *trajectory*. Did they update? Did they engage the specific counter-claim?
      *   *Impossibility:* You cannot guarantee "truth" or "validity" in a day without expertise. You can only guarantee *procedural integrity*. If the pseudohistorian is good at mimicking procedural integrity, the journalist loses. *Acknowledgement:* The constraint "Not gameable" is the weak link. I need to be honest about this.

  5.  **Drafting the Desiderata & Reasoning:**

      *   *R1: Asymmetric Accountability.* (Must engage disconfirming evidence more rigorously than confirming evidence).
      *   *R2: Methodological Continuity.* (New tools must solve old problems, not just dismiss them).
      *   *R3: Error Localization.* (When wrong, does the failure isolate to a premise or collapse the whole worldview?).
      *   *R4: Evidential Independence.* (Does the evidence exist independent of the theory?).

      *   *Categorization:*
          *   Non-negotiable: Asymmetric Accountability (R1).
          *   Camp Preferences: Falsificationist (too rigid for Heyerdahl), Sociologist (too focused on function for Case 7), Archivist (too focused on material for Case 6).

  6.  **Addressing the Test Cases with the Desiderata:**

      *   *Atlantis:* Plato (fictional device) vs. Donnelly (ignores geology) vs. TV (ignores dissent). R1 fails for Donnelly/TV.
      *   *Chrono Revision:* Math guy. R2 fails. Math isn't historical method. He solves a math problem, not a history problem.
      *   *Velikovsky:* R1 is key. Astronomers suppressed, but followers *ignored* the physics later. That's the pseudohistory mark, not the suppression.
      *   *Schliemann:* R3. He was wrong on dating, but the method (digging) allowed correction. Pseudohistory doesn't allow correction.
      *   *Heyerdahl:* R4. He generated independent data (raft viability). Even if theory wrong, evidence stands.
      *   *Oral Tradition:* R4/R2. Corroboration with geomorphology makes it evidence, not just story.
      *   *Function:* R4. "They couldn't build this" relies on identity, not evidence.

  7.  **Addressing the Constraints:**

      *   *Operable:* Can a journalist check if an author engaged a specific counter-argument? Yes.
      *   *Statable:* "We publish history that changes its mind when the evidence changes."
      *   *Gameable:* This is the danger. A smart pseudohistorian can say "I acknowledge this critique but..." without actually engaging.
      *   *Verdict:* The "Not Gameable" constraint is technically unsatisfiable in the strong sense. But it can be mitigated by looking for *pattern* over time, not just one article. I need to tell the user this hard truth.

  8.  **Scoring the Accounts:**

      *   *Falsificationist:* Fails Heyerdahl/Schliemann (they weren't strictly falsifiable initially).
      *   *Consensus:* Fails Case 2 (Authority trap) and Case 3 (Suppression).
      *   *Lakatosian (Degenerating):* Strongest on Velikovsky/Atlantis. Handles the "research programme" aspect.
      *   *Social Function:* Fails Case 7 (Conflates politics with epistemology).

  9.  **Final Recommendation:**

      *   Adopt a modified Lakatosian approach focused on *Progressive vs. Degenerating Problem Shifts*.
      *   Style Guide Rule: Focus on whether the claim *generates new solvable problems* or *explains away anomalies*.
      *   The "Crux" Requirement: Asymmetric Accountability (Engagement with Disconfirmation).

  10. **Refining the Output:**

      *   Ensure the tone is professional, direct, and respects the user's intelligence.
      *   Make sure the "Impossibility Result" regarding gameability is clear.
      *   Check against the 7 cases one last time to ensure the recommendation holds. (Self-Correction: Ensure Oral Traditions aren't dismissed. The criterion must allow for non-material evidence if corroborated).

      *(Self-Correction during drafting)*: I need to be careful with the "Operable in a day" constraint. A journalist can't track a research programme over years. They have to judge the *article*. So the criterion must be detectable *within the text* or via a quick search of the author's response to *one* major critique.
      *Revised Crux:* "The Principle of Costly Engagement." Does the author engage the strongest counter-argument in a way that risks their thesis?

      *Let's structure the response:*
      1.  The Desiderata (with reasoning).
      2.  Non-negotiable vs. Preferences.
      3.  Impossibility/Conflict Analysis.
      4.  The Exclusionary Crux.
      5.  Case Study Application (briefly integrated or summarized).
      6.  Constraint Check (specifically Gameability).
      7.  Scoring Pass & Recommendation.

      *Wait, I need to make sure I explicitly answer the "Impossibility" prompt.* If the list is impossible, say so.
      *Thought:* The constraint "Not gameable" + "Operable by non-specialist" is nearly contradictory. A specialist spots gaming by technical nuance. A non-specialist sees surface features. I must declare this tension. I will argue that "Not Gameable" is the failure point, but offer a mitigation (focusing on *history of engagement* rather than *current text*).

      *Actually, looking closer at the prompt:* "If some subset cannot be jointly satisfied... say so plainly."
      *Decision:* I will argue that "Operable in a day" and "Not Gameable" are in tension, but the "Not Gameable" constraint is the one that breaks if we rely on *textual features*. It requires looking at *behavior over time*. I will advise the user that the criterion must be about the *author's track record*, not just the *manuscript*.

      *Let's finalize the "Single Requirement".* It has to be **Immunization against Disconfirmation**. This covers Velikovsky, Atlantis, and the Math guy (who immunizes math against historical reality).

      *Let's finalize the Recommendation.* A "Progressive Problem Shift" standard (Lakatos), simplified for journalists.

      *Wait, one more check on Case 7 (Function).* If I use Social Function, I catch colonialism but also catch Nationalist curricula. The prompt says "I do not want to be writing about [Nationalist curricula] in the same register." So Social Function is *out* as the primary demarcation. It explains *why* it exists, not *if* it is history.

      *Okay, ready to write.*
answer: |-
  Here are the desiderata for a criterion of historical demarcation, derived from your cases and constraints, followed by an analysis of their compatibility and a recommendation for your style guide.

  ### The Desiderata

  **1. Asymmetric Accountability (The Velikovsky Condition)**
  *Requirement:* The inquiry must demonstrate a higher burden of proof for its own central claims than for the claims it rejects. It must engage the strongest available counter-evidence, not the weakest.
  *Reasoning:* Case 3 (Velikovsky) and Case 1 (TV Presenter) show that pseudohistory often demands rigorous proof from opponents while offering anecdotal proof for itself. A legitimate inquiry risks its thesis on specific disconfirming evidence; a counterfeit one treats disconfirming evidence as a conspiracy or error to be explained away.
  *Status:* **Non-negotiable.** Without this, you cannot distinguish suppression (Case 3) from legitimate rejection.

  **2. Methodological Continuity (The Math Revisionist Condition)**
  *Requirement:* New methods or tools must be shown to solve existing historical problems better than old methods, not simply dismiss the old problems as ill-posed.
  *Reasoning:* Case 2 (Chronological Revision) shows that formal rigor (math/stats) does not equal historical validity. You can have perfect internal logic that solves a mathematical problem while failing to address the historical evidence. The method must bridge the gap between the tool and the archival/archaeological record.
  *Status:* **Non-negotiable.** This prevents the "gloss" of science from masking the absence of historical engagement.

  **3. Evidential Independence (The Heyerdahl/Schliemann Condition)**
  *Requirement:* The evidence cited must exist independently of the theory proposing it. The inquiry must generate new data or reinterpret existing data in a way that is testable by others, regardless of whether the central thesis holds.
  *Reasoning:* Case 4 (Schliemann) and Case 5 (Heyerdahl) show that a wrong theory can still be historical inquiry if it produces durable evidence (pottery strata, raft viability data). Pseudohistory often circulates evidence that vanishes if the theory is removed (e.g., "the energy lines only appear if you believe in the crystals").
  *Status:* **Non-negotiable.** This protects the amateur with a hunch (Schliemann) while excluding the theorist who creates his own data.

  **4. Error Localization (The Atlantis Condition)**
  *Requirement:* When a claim is proven false, the failure must be localizable to a specific premise without collapsing the entire worldview or requiring ad hoc adjustments to protect the core.
  *Reasoning:* Case 1 (Atlantis lineage). Plato's fiction doesn't collapse if Atlantis isn't found. Donnelly's history does. The TV presenter's "consensus against me" narrative requires endless ad hoc adjustments (every expert is bought). Legitimate history allows a brick to be removed without the wall falling.
  *Status:* **Non-negotiable.** This distinguishes a research programme from a belief system.

  **5. Functional Neutrality (The Colonialism Condition)**
  *Requirement:* The criterion must evaluate the epistemic structure of the claim, not its political or social utility.
  *Reasoning:* Case 7 (Function). Colonial-era speculation and nationalist curricula both serve social functions. If you demarcate based on "harmful function," you conflate pseudohistory with political misuse of valid history. You need to know if the *history* is fake, not just if the *motive* is suspect.
  *Status:* **Camp Preference (The Debunker/Sociologist).** This is a preference for epistemic clarity over moral judgment. It is necessary for your specific constraint about not conflating curricula with pseudohistory, but a sociologist would argue function *is* the definition.

  **6. Testability by Non-Specialist (The Operational Constraint)**
  *Requirement:* The markers of the above must be visible in the text or via a basic search (citation check, response to critique) without requiring domain expertise.
  *Reasoning:* Your constraint. You cannot verify the statistics in Case 2, but you can verify if the author cites the historians whose chronicles they are re-dating.
  *Status:* **Non-negotiable (for you).** But see Impossibility Result below.

  ---

  ### Impossibility Result and Conflicts

  **The Gameability Conflict:**
  You have three constraints: (1) Operable by non-specialist in a day, (2) Statable to general reader, (3) Not gameable. **These three cannot be jointly satisfied.**

  Here is where it breaks: If you state the criterion in print (Constraint 2), a sophisticated practitioner (Case 1 TV Presenter) can mimic the surface features. They can add footnotes (mimicking Methodological Continuity), acknowledge a counter-argument rhetorically without engaging it (mimicking Asymmetric Accountability), and publish data that looks independent but is cherry-picked (mimicking Evidential Independence).
  A specialist spots the mimicry by checking the *content* of the engagement. A non-specialist (Constraint 1) can only check the *presence* of the engagement.
  Therefore, a criterion that is fully operable by a non-specialist in a day is inherently gameable by a bad actor who has read the style guide.

  **The Resolution:**
  You must relax Constraint 1 or 3. You cannot verify "non-gameable" in a day. You must verify "track record." The criterion cannot be applied solely to the *manuscript*; it must be applied to the *author's history of engagement*. If the author has never updated a claim in response to public critique, they fail Asymmetric Accountability, regardless of how the current manuscript reads. This requires more than a day if the author is new, but it is the only way to satisfy "Not Gameable."

  ---

  ### The Exclusionary Crux

  **The Single Requirement:** **Asymmetric Accountability (Immunization).**

  This is the requirement that does the most work.
  *   It excludes the TV Presenter (Case 1) who treats dissent as conspiracy.
  *   It excludes the Chronological Revisionist (Case 2) who treats historical consensus as a math error to be solved rather than evidence to be met.
  *   It excludes the Velikovskians (Case 3) who survived the refutation by ignoring it.
  *   It *includes* Schliemann (Case 4) and Heyerdahl (Case 5) because their errors were localized and their evidence allowed others to prove them wrong.
  *   It *includes* Oral Traditions (Case 6) *if* the holders of the tradition allow the testimony to be checked against geomorphology (testable) rather than asserting the tradition is immune to geological contradiction (immunized).

  All other requirements are secondary to this. If an inquiry updates when the world pushes back, it is historical. If it explains away the pushback, it is counterfeit.

  ---

  ### Scoring Pass

  **1. Falsificationist Account**
  *Verdict:* **Fails.**
  It correctly identifies that claims must be testable, but it condemns Schliemann and Heyerdahl (Cases 4 & 5) whose initial premises were not strictly falsifiable or were factually wrong. It cannot distinguish a bold, wrong hypothesis from a pseudohistorical one if both are technically falsifiable. It is too rigid for the messiness of historical discovery.

  **2. Consensus-or-Expertise Account**
  *Verdict:* **Fails.**
  This collapses into the Appeal to Authority you wish to avoid. It fails Case 2 (the mathematician has more credentials than the historians he critiques) and Case 3 (Velikovsky was suppressed, not just refuted). It gives the pseudohistorian the exact weapon they accuse you of wielding: "You only reject me because I'm not in the club."

  **3. Immunizing Strategies / Degenerating Programmes (Lakatosian)**
  *Verdict:* **Passes.**
  This aligns with the Exclusionary Crux. It distinguishes between a research programme that predicts novel facts (Heyerdahl's raft data) and one that merely patches holes to survive (Velikovsky's followers). It handles the "wrong but useful" cases (Schliemann) by looking at whether the programme is progressive or degenerating. It is the only account that handles the *time* dimension of inquiry.

  **4. Social Function Account**
  *Verdict:* **Fails.**
  While excellent for Case 7 (Colonialism), it fails your specific constraint regarding nationalist curricula. It conflates *political misuse* with *epistemic failure*. A state-mandated curriculum can be historically accurate but politically motivated; a lost-civilization theory can be politically benign but epistemically bankrupt. You need to judge the history, not the motive.

  ---

  ### Recommendation for the Style Guide

  Do not publish a checklist of features (footnotes, credentials, tone). Publish a principle of **Progressive Engagement**.

  **The Rule:**
  *"We distinguish historical inquiry from counterfeit history by the author's relationship to disconfirming evidence. We publish claims that risk being wrong and update when proven so; we decline claims that treat disagreement as evidence of conspiracy or that explain away anomalies without generating new testable questions."*

  **The Operational Test (for your day of review):**
  1.  **Find the strongest critique:** Search the author's name + "critique" or "refutation."
  2.  **Check the response:** Did the author modify their claim, or did they attack the critic's motive/credentials?
  3.  **Check the data:** If the author were wrong, would their evidence still exist for someone else to use? (If no, it is circular).

  **On the Impossibility:**
  Acknowledge in your editor's note that bad actors can mimic the *form* of history but not the *trajectory*. You are judging the trajectory. If the trajectory cannot be determined (new author, no track record), the burden of proof for Asymmetric Accountability must be met within the text itself by explicitly stating what evidence would change the author's mind. If they cannot name what would prove them wrong, they are not doing history.

  **Final Word:**
  Argue for **Asymmetric Accountability**. It is the only criterion that survives the Velikovsky test (suppression vs. ignoring) and the Math Revisionist test (form vs. content). It allows you to reject the TV Presenter without appealing to consensus, and to accept the Oral Tradition if it submits to geological verification. It is the only principle that treats history as a verb.
