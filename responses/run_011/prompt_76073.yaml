  Personnel must verify that their lemmas do not implicitly rely on induction schemas now under review. If your proof uses full induction, assume it is tainted.

  **3. THE ZFC REFUGE FALLACY**
  Requests to migrate foundations to Zermelo-Fraenkel Set Theory (ZFC) are denied. Relative consistency proofs ($\text{Con}(ZFC) \to \text{Con}(PA)$) only move you up a floor; they do not land you on ground. If PA is inconsistent, ZFC is inconsistent, as ZFC proves the existence of a model of PA. We are not evacuating to a building with the same structural fault simply because it has more elevators. Do not file migration requests.

  **4. LIABILITY AND COLLATERAL**
  Civil engineering relies on real analysis (typically ACA$_0$), which may survive depending on the contradiction's locality. However, cryptographic protocols relying on prime factorization properties derived in PA are now considered "shipped on recalled foundation." Liability waivers are being drafted. The tax code is unaffected; it operates on statutory integer definitions, not logical ones. Gentzen's consistency proof via transfinite induction up to $\epsilon_0$ is now contested collateral. If $\epsilon_0$ induction fails, the proof-theoretic ordinal of PA collapses, and any proof relying on cut-elimination at that level is suspect.

  **5. COMMUNICATIONS STRATEGY**
  Public statements must emphasize the distinction between *practical* calculation and *formal* derivation. Do not engage with ultrafinitists who claim vindication; acknowledge their persistence without validating their ontology. 

  **NOTE ON TERMINOLOGY:** There is a circulating draft press release conflating inconsistency with $\omega$-inconsistency. This is unacceptable. Inconsistency ($\vdash \bot$) implies everything is provable. $\omega$-inconsistency ($\vdash \exists x \neg P(x)$ despite $\vdash P(\bar{n})$ for all $n$) does not. They are not interchangeable. Do not cite $\omega$-inconsistency in press releases. See Appendix B. If you submit a draft confusing these, it will be returned without comment.

  **6. FALLBACK OPTION Z (PARACONSISTENT)**
  In the event of total collapse, transition to paraconsistent logic (LP) is authorized. This allows contradictions to exist without explosion. The Directorate does not endorse this view but acknowledges the instruction to include it. Note: Paraconsistent arithmetic does not save your bridge load calculations. It merely allows you to calculate them while admitting they are both safe and unsafe.

  **FAQ**
  **Q: Can we assume $\omega$-consistency holds even if consistency fails?**
  **A:** No. See Section 5. Bolded text is for emphasis, not decoration.
  **Q: Is this a joke?**
  **A:** The protocol is real. The hope is not.
  **Q: What if the proof uses non-standard models?**
  **A:** Then the contradiction is internal. Stop asking about models.

  ***

  ^1 See Nelson, E. (2011). "Adjunctive Set Theory." Withdrawn. Base rate remains negligible, but non-zero.

  I believe this genre of contingency planning is a category mistake. Mathematical practice is not brittlely dependent on the global consistency of PA; it is robust because it relies on local coherence and empirical verification, not just axiomatic derivation. The memo leans unfairly on the idea that ZFC is strictly vulnerable to PA's inconsistency in a practical sense—while technically true that ZFC proves PA's existence, a contradiction in PA might be isolatable within arithmetic without destroying the cumulative hierarchy's utility for analysis. Additionally, the dismissal of paraconsistent logic is sharper than the field warrants; some serious work exists there, though the joke holds that it won't save civil engineering. The consistency of arithmetic is not a live philosophical worry for working mathematicians, because the "truth" of arithmetic is grounded in intuition and application, not merely formal derivability.
