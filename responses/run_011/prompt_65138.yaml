  The only reason she would refuse is if she has a hard **Probability Floor** (a Pascal's Mugging bound) that she didn't reveal in Case 3 because the Outcome Ceiling hit first. But given her Case 2 ruling (arithmetic doesn't change when numbers get big) and her Case 3 gloss (specifically blaming the *description* of the people, not the math), the Outcome Coherence rule is the stronger signal.

