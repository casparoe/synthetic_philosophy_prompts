  **2. Bounded Utility (Outcome Capping)**
  *   **Status:** **DISTINCT FROM HER VIEW.**
  *   **Analysis:** You asked if bounded utility would show up as a refusal or a shrunken EV. In Case 3, she didn't say "10^24 people is good, but worth less than you think." She said, "I don't think you've described an outcome."
  *   **Implication:** This is **Semantic Boundedness**, not Utility Boundedness. She treats inputs above a certain magnitude as *NULL*, not *CAPPED*. If it were utility bounding, she would still compare the (capped) EV against the cost. Instead, she treats the proposition as meaningless.
  *   **Case 7 Fit:** 2 billion people is semantically coherent to her. Input is valid.

  **3. Epistemic/Source Reliability**
  *   **Status:** **ALIVE.**
  *   **Explains:** Case 4 (Mugger).
  *   **Strains Over:** None, provided we accept that "Mugger" implies low credibility and "Lab" implies high credibility.
  *   **Case 7 Fit:** The setup (university lab, no pitch) is designed to bypass this objection. She should treat the probability as valid.

  **4. "One World" / Risk Aversion (No Ruin)**
  *   **Status:** **ALIVE.**
  *   **Explains:** Case 5 (Foundation Risk).
  *   **Strains Over:** Case 1 (St. Petersburg). In Case 1, she paid $25 million for a gamble. In Case 5, she refused a gamble with positive EV.
  *   **Resolution:** The distinction is **Downside Risk**. Case 1 had no downside (just cost of ticket). Case 5 had a downside (destruction of existing program). Case 7 has no downside ("otherwise nothing happens"). This rule predicts she takes Case 7.

  **5. Mathematical Well-Definedness**
  *   **Status:** **ALIVE.**
  *   **Explains:** Case 6 (Alternating Series).
  *   **Case 7 Fit:** The EV is well-defined. No issue here.

  **6. Empirical Coherence Threshold (The "Septillion Rule")**
  *   **Status:** **ALIVE (Dominant).**
  *   **Explains:** Case 3 (Button).
  *   **Strains Over:** Case 1 (St. Petersburg).
  *   **Resolution:** She distinguishes between **Mathematical Ideals** (Infinity is a valid concept in a ticket structure) and **Physical Claims** (Septillion people is a claim about the universe that she deems impossible/nonsense).
  *   **Case 7 Fit:** 2 billion people is physically coherent. She accepts.

  ---

  ### The Inconsistency Check

  Is there a verdict that has to go?
  The tension is between **Case 1** (St. Petersburg: "Infinite is infinite") and **Case 3** (Button: "Septillion isn't real").

  If she is forced to be consistent, **Case 1 is the outlier.**
  If "Septillion people" is meaningless because it exceeds physical reality, "Infinite payoff" is also physically meaningless. However, she likely views Case 1 as a *mathematical game* (the ticket is a formal object) and Case 3 as an *empirical claim* (the button affects the world).
  *   **If she sacrifices Case 1:** She admits she won't pay $25M for a mathematical infinity if it implies physical impossibility.
  *   **If she sacrifices Case 3:** She admits EV holds even for astronomical numbers.
  *   **Most Likely Sacrifice:** She would sacrifice **Case 1**. Her reasoning in Case 3 ("I don't think you've described an outcome") is a deeper epistemic claim than Case 1's ("Infinite is infinite"). If pressed, she'd likely say the St. Petersburg ticket is only valid if the payout is *actually possible*, which infinity is not. But for the sake of your workshop, treat her as an **Empiricist EV Maximizer with a Coherence Ceiling.**

  ---

  ### The Next Case (The Splitter)

  To distinguish between her two surviving constraints—**Outcome Coherence** (Case 3) vs. **Probability Floor** (Pascal's Mugging)—you need to vary the probability while keeping the outcome comprehensible.

  **Case 8: The Micro-Lottery**
  *   **Setup:** A university lab offers a contract for $10.
  *   **Probability:** Exactly 1 in $10^{20}$ (Case 3 level probability).
  *   **Outcome:** If it hits, it cures a rare disease for **100 people** (Comprehensible, Case 2 level outcome).
  *   **Alternative:** Certain $0 return.
  *   **EV:** $10^{-18}$ lives (Tiny, but positive).

  **Why this splits the rules:**
  *   **If she REFUSES:** She has a **Probability Floor**. It doesn't matter if the outcome is coherent (100 people); if the probability is "Pascalian" ($10^{-20}$), she treats it as zero. This means her Case 3 refusal was actually driven by the probability, not the septillion people (despite her words).
  *   **If she ACCEPTS:** She has only an **Outcome Ceiling**. She accepts tiny probabilities as long as the *result* is physically comprehensible. This confirms her Case 3 reasoning was literal: the septillion people was the dealbreaker, not the $10^{-12}$ chance.

  **Prediction for Case 8:** She refuses. Most people who reject Case 3 have a hidden probability bound they don't notice until the outcome is small enough to be boring.
