answer: |-
  Your gut feeling is correct, but to win this argument at the board level, you need to move from "this feels wrong" to "this introduces specific, predictable systemic risks that threaten the foundation's long-term mission."

  The consultant is proposing a rigid form of **cost-effectiveness analysis (CEA)** heavily influenced by Effective Altruism (EA) frameworks, specifically the "Shallow vs. Deep" or "ITN" (Importance, Tractability, Neglectedness) models, but implemented with a level of rigidity that most professional evaluators reject.

  Here is the breakdown of the structural implications, the status of the trading fellowship, and where the consensus actually lies in the field of philanthropic evaluation.

  ### 1. Structural Implications of "Zero-by-Default" Triage

  **A. The Tractability Bias (Shape of Intervention)**
  *   **The Effect:** This rule systematically favors **narrow, direct, and standardized interventions** over **systemic, advocacy, or cultural interventions.**
  *   **Why:** It is easy to count "meals served" or "vaccines distributed." It is notoriously difficult to count "deterrence of unjust legislation" or "preservation of cultural memory."
  *   **The Distortion:** Your prisoner reentry grantees will stop doing complex legal work (e.g., challenging systemic parole violations) because it takes years and has uncertain outcomes. They will shift to "cream-skimming"—helping the easiest clients to expunge records quickly to boost their "lives improved" metric. The metric doesn't measure *justice*; it measures *throughput*.
  *   **Consensus Status:** **Settled.** In Monitoring & Evaluation (M&E) literature, this is a classic example of **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure." There is broad consensus that single-metric triage distorts grantee behavior toward low-hanging fruit.

  **B. The Epistemic Default (The "Zero" Problem)**
  *   **The Effect:** The rule conflates **"absence of evidence"** with **"evidence of absence."**
  *   **Why:** The consultant argues neutrality ("we aren't paying for what we can't measure"). In reality, they are assigning a probability of zero impact to high-uncertainty interventions. Statistically, this is an error. A wide confidence interval (e.g., "impact could be 0 or 100") is not the same as a point estimate of 0.
  *   **The Distortion:** This creates a **survivorship bias in your portfolio.** You will fund things that are *easy to prove* rather than things that are *important to do.* Over a decade, your foundation becomes a funder of data-collection agencies, not change-makers.
  *   **Consensus Status:** **Live Dispute.** EA proponents argue that in a resource-constrained world, you must prioritize the *proven* over the *plausible.* Traditional philanthropists and M&E experts argue that a "zero default" is epistemically arrogant and ignores innovation. You can argue this is a **risk management failure**, not just a philosophical one.

  **C. Time Horizon Compression**
  *   **The Effect:** The model implicitly applies a **high discount rate to the future.**
  *   **Why:** To get a "defensible number" today, impacts must be realizable within a grant cycle (1–3 years). History-of-science archives pay off over 50–100 years (preventing knowledge loss for future generations). Legal precedent shifts over decades.
  *   **The Distortion:** You eliminate **public goods.** Archives and legal precedents are non-rivalrous goods that benefit everyone forever. A triage model focused on immediate "lives improved" treats these as inefficient because the benefit is diffuse and delayed.
  *   **Consensus Status:** **Settled.** Economic modeling acknowledges that standard CEA struggles with intergenerational equity and public goods. This is a known limitation of the framework, not a bug your board can ignore.

  **D. The Self-Undermining Dynamic**
  *   **The Effect:** If all funders adopt this, the **infrastructure of measurement disappears.**
  *   **Why:** Who funds the research that tells us what works? Often, it's the "idiosyncratic" grants. If you only fund what is already measured, you stop funding the development of new metrics for hard problems.
  *   **The Distortion:** Your foundation loses the ability to lead. You become a follower of existing data, which is always backward-looking.
  *   **Consensus Status:** **Live Dispute.** Some argue "let others fund the risk." But for a $4M foundation, niche leadership is often the only way to remain relevant.

  ### 2. The Quant Trading Fellowship: Is it Treated Differently?

  You suspect the fellowship gets a pass. Mathematically, it should actually be **more vulnerable** than your legal aid grants, but it might pass due to **fungibility bias.**

  *   **The Math:** The fellowship relies on a **counterfactual claim:** *These grads would not have donated this much otherwise.* This is inherently speculative. It requires modeling future earnings, future altruistic commitment, and future tax policy.
  *   **The Bias:** Money is fungible. $1M in future donations looks "cleaner" on a spreadsheet than "100 wrongful convictions overturned" because dollars are a universal unit. The consultant's model likely treats future dollars as more "defensible" than future justice, simply because the unit is familiar to finance.
  *   **The Risk:** This is an **earn-to-give** bet. It has high variance. If the market crashes or the fellows burn out, the impact is zero. Your legal aid has *existing* data on recidivism reduction. The fellowship has *none.*
  *   **Verdict:** If the consultant applies their own rules strictly, the fellowship should be zeroed out for lack of defensible historical data. If they exempt it, they have revealed the rule is not neutral; it is **class-biased toward financialized interventions.**
  *   **Consensus Status:** **Live Dispute.** Within EA circles, earn-to-give is debated. Some view it as high-leverage; others view it as exposing talent to misaligned incentives (quant trading) that may cause net harm. It is definitely not "settled" that this is superior to direct work.

  ### 3. Consensus vs. Dispute: Where You Stand

  Here is how to frame your objections without sounding anti-data.

  | Claim | Status in Field | How to Use It |
  | :--- | :--- | :--- |
  | **"Metrics distort behavior."** | **Settled Consensus.** | Argue that the *incentive structure* will degrade grantee quality. Cite Goodhart's Law. |
  | **"Zero-default is statistically invalid."** | **Settled among Statisticians.** | Argue that treating uncertainty as zero is a modeling error, not a neutral stance. |
  | **"Direct work is better than earn-to-give."** | **Live Dispute.** | Do not argue this morally. Argue it on **risk diversification.** A portfolio of only financial bets is risky. |
  | **"Archives/Legal Aid are unmeasurable."** | **False.** | They are *harder* to measure, not impossible. Argue for **proxy metrics** or **qualitative assessment** rather than zeroing out. |
  | **"This is standard Effective Altruism."** | **Nuanced.** | Mainstream EA uses CEA but rarely uses a hard "zero default" for unmeasurables. The consultant is proposing a **hardline version** even many EAs reject. |

  ### 4. Where You Might Be Overreaching

  To be credible, you must concede ground where the consultant is right.

  1.  **Don't defend "unmeasurable" as "mystical."** You must acknowledge that $4M is small and waste is unacceptable. Admit that *some* of your current grants might be underperforming.
  2.  **Don't claim the Fellowship is "bad."** It might be great. Your argument is that it is **speculative**, and if the rule is about defensibility, it should be scrutinized *more* than the legal aid, not less.
  3.  **Don't say "Money doesn't matter."** Say "Money is a proxy for impact, and the proxy is breaking in these specific cases."

  ### 5. Arguments for the Board Meeting

  Use these three specific points to frame your objection:

  **1. The "Measurement Error" Argument**
  > "The consultant's rule treats 'hard to measure' as 'no impact.' In risk management, we know that high-uncertainty does not equal zero value. By zeroing out high-uncertainty grants, we aren't being neutral; we are systematically shorting long-term public goods (like archives) and complex systemic work (like legal aid) in favor of short-term throughput. This isn't rigor; it's a specific bias toward the tractable."

  **2. The "Portfolio Diversification" Argument**
  > "A $4M foundation cannot out-spend large institutions on proven interventions. Our comparative advantage is funding **high-variance, high-upside** work that requires patience. The trading fellowship is a high-variance bet on future earnings. The legal aid is a lower-variance bet on existing social need. If we apply the 'defensible number' rule strictly, the fellowship should actually fail the test because it relies on speculative counterfactuals. If we exempt the fellowship, we admit the rule is not neutral."

  **3. The "Grantee Distortion" Argument**
  > "If we implement this, our grantees will optimize for the metric, not the mission. Legal aid will stop taking hard cases. Archivists will stop preserving 'obscure' materials. We will buy ourselves clean data at the cost of actual impact. I propose we adopt a **multi-metric framework** that includes qualitative assessment for systemic work, rather than a single-number triage."

  ### Summary Recommendation

  Your gut has teeth. The consultant is proposing a **heuristic** (a mental shortcut) and dressing it up as a **law**.

  *   **Settled:** Metrics distort behavior. Uncertainty $\neq$ Zero.
  *   **Disputed:** Whether to fund speculative high-upside vs. proven low-upside.
  *   **Strategy:** Do not attack the desire for impact. Attack the **statistical validity** of the "zero default" and the **inconsistency** of applying it to the fellowship vs. your programs. Frame this as **fiduciary risk** (building a fragile portfolio) rather than moral disagreement.
