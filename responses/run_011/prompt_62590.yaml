prompt: |-
  So our small foundation (about $4M a year in grants) just brought on a consultant who's pushing something he calls impact-per-dollar triage. Every program we fund has to get scored on one comparable number — estimated lives-improved-equivalent per dollar — and anything that can't produce a defensible number doesn't get penalized, it gets zeroed out by default, treated as unscoreable and therefore unfundable. His pitch is that this is perfectly neutral: "we're just not paying for things we can't measure." On top of it, the board is also considering a fellowship that would pay a handful of very smart grads to go into quant trading on the theory that their future donations beat anything they'd do with their hands directly.

  I run our grants to prisoner reentry legal aid and to a couple of really idiosyncratic history-of-science archival projects, and I have a strong gut feeling this quietly guts precisely the stuff that's hardest to score while leaving the trading fellowship untouched. But I want to argue it properly at the board meeting instead of just asserting it.

  Give me the most important implications of a scoring rule like this for what kinds of causes survive triage in the long run. I mean the structural, predictable effects, not just "some worthy things get cut." Specifically: does the rule systematically favor certain shapes of intervention over others, and if so which shapes and why; what does it do to what grantees choose to measure, study, and report back to us over a decade; how does it interact with time horizon; is there a self-undermining dynamic where our own credibility as a funder depends on things the rule excludes; and does the trading fellowship actually get treated differently by the math or am I just motivated-reasoning about that one.

  And please flag where I'm overreaching. I want you to be explicit about which parts of this are settled among people who actually work on measurement in philanthropy and altruism, and which parts are genuinely live disputes — don't hand me a contested position dressed up as consensus, and tell me if my gut feeling is just the standard complaint with no teeth.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Runs grants for prisoner reentry legal aid and history-of-science archival projects at a small foundation ($4M/year).
      *   **Situation:** A new consultant is pushing "impact-per-dollar triage" (a strict cost-effectiveness analysis, likely inspired by Effective Altruism/Longtermism principles). Anything unmeasurable gets zeroed out. The board is also considering a "quant trading fellowship" (earn-to-give model).
      *   **User's Concern:** The rule will gut hard-to-measure but valuable work (legal aid, archives) while sparing the trading fellowship. They want to argue this structurally at the board meeting, not just emotionally.
      *   **Request:** Identify structural/predictable effects of this scoring rule (intervention shapes, measurement incentives, time horizons, self-undermining dynamics, fellowship treatment). Flag overreaching vs. consensus vs. live disputes. Validate if the gut feeling has teeth.

  2.  **Deconstruct the Consultant's Proposal:**
      *   **Mechanism:** Single metric (Lives-Improved-Equivalent per Dollar).
      *   **Default:** Unscoreable = Unfundable (Zero by default).
      *   **Claim:** Neutrality ("not paying for things we can't measure").
      *   **Underlying Philosophy:** Strong utilitarianism, quantifiable impact, likely near-term measurable outcomes favored over long-term/uncertain ones.

  3.  **Brainstorm Structural Implications (The "Meat"):**
      *   *Intervention Shapes:* Favors narrow, standardized, short-term, direct interventions. Disfavors systemic, advocacy, cultural, archival, or complex legal work.
      *   *Measurement Incentives:* Goodhart's Law. Grantees will optimize for what's measured, not what matters. "Cream skimming" (helping the easiest cases to boost stats).
      *   *Time Horizon:* Discounting the future. Archives and systemic legal change take decades. Quant trading donations are future-valued but discounted heavily in present models unless the growth is massive.
      *   *Self-Undermining:* If everyone does this, who funds the infrastructure of measurement? Who funds the "public goods" that allow markets/philanthropy to function?
      *   *The Fellowship:* Is it treated differently? Mathematically, it's a bet on *future* earning power. It relies on counterfactuals (what else would they do?). It's actually *highly* speculative but might look "cleaner" because money is fungible.

  4.  **Evaluate Consensus vs. Dispute (The "Meta-Analysis"):**
      *   *Consensus:* Goodhart's Law is real. Narrow metrics distort behavior. Long-term/uncertain impacts are hard to model.
      *   *Dispute:* How much weight to give tractability vs. importance vs. neglectedness (ITN framework). Is "zeroing out" defensible or lazy? Is earn-to-give actually superior?
      *   *User's Gut:* Is it standard complaint? Yes, but it has teeth *if* framed as measurement error and systemic risk, not just "art is important."

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user. The gut feeling is correct, but needs specific framing. Acknowledge the consultant's framework (likely EA-inspired).
      *   **Structural Effect 1: The Tractability Bias (Shape of Interventions).** Explain why narrow/direct wins over systemic/complex. Use the term "proxy reliance."
      *   **Structural Effect 2: Measurement Distortion (Goodhart's Law).** Grantees will change behavior to hit the number. Cream-skimming in legal aid.
      *   **Structural Effect 3: Time Horizon & Discounting.** Archives and legal precedent are long-term. The model likely discounts these heavily.
      *   **Structural Effect 4: The "Zero Default" Epistemic Arrogance.** Distinguish between "no evidence of impact" and "evidence of no impact." This is a crucial logical flaw.
      *   **The Trading Fellowship:** Analyze the math. It's speculative. It depends on *counterfactuals*. It might actually be *more* uncertain than the archives, just in a different way.
      *   **Consensus vs. Dispute:** Be rigorous here.
          *   *Settled:* Metrics distort. Uncertainty is hard to model.
          *   *Contested:* Whether to fund high-uncertainty/high-upside vs. proven/low-upside. The moral weight of "lives improved."
      *   **Actionable Arguments for the Board:** Give specific talking points.

  6.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Correction:* Don't just bash EA. Acknowledge that *some* triage is good. The problem is the *strict* zero-default and *single* metric.
      *   *Nuance on Fellowship:* The fellowship isn't "untouched." It's actually a high-risk bet. But it might pass because "money" is easier to model than "justice." I need to highlight that the *measurement* of the fellowship is easier (dollars in -> dollars out), even if the *outcome* is uncertain.
      *   *Nuance on Archives:* Why fund archives? Preservation of knowledge is a public good. Market failure. The consultant's model ignores market failures in knowledge production.
      *   *Nuance on Legal Aid:* Recidivism rates are measurable, but "justice" isn't. The metric will force legal aid to focus on low-hanging fruit (e.g., minor record expungement) vs. complex wrongful convictions or policy change.

  7.  **Final Review against Constraints:**
      *   Did I flag overreaching? Yes.
      *   Did I distinguish consensus/dispute? Yes.
      *   Did I address the fellowship specifically? Yes.
      *   Is the tone appropriate? Professional, analytical, supportive but rigorous.

  8.  **Final Polish:** Ensure terms like "Goodhart's Law," "Proxy Measurement," "Counterfactuals," and "Epistemic Humility" are used correctly. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing cost-effectiveness entirely. $4M is small; they *should* care about impact. The argument must be about the *implementation* of the metric, not the concept of impact. The "Zero Default" is the weakest link.

  *(Refining the Fellowship point)*: The fellowship is "earn-to-give." The consultant might argue this is high impact. I need to point out that this relies on *speculative future behavior* of the fellows, whereas the legal aid has *existing* data. The fellowship might actually be *less* defensible empirically, even if it looks "quantitative."

  *(Refining the "Consensus" section)*: Be careful not to say "EA is wrong." Say "Within the field of monitoring and evaluation (M&E), strict single-metric triage is considered high-risk."

  9.  **Final Output Structure:**
      1.  Validation & Framing.
      2.  Structural Implications (4 key points).
      3.  The Trading Fellowship (Specific analysis).
      4.  Consensus vs. Dispute (The "Epistemic Status" check).
      5.  Board Room Arguments.
      6.  Where you might be overreaching.

