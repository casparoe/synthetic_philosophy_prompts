answer: |-
  ### Brainstorming and Selection of Framing

  **Candidate 1: The Metaphysical Framing.**
  *Focus:* Determine whether the "unit" of moral concern is the individual insect or the colony.
  *Pros:* Directly addresses the student's worry about eusocial species.
  *Cons:* Risks becoming a paper in metaphysics or biology rather than moral uncertainty. Settling the "subject" question is likely impossible in 6,000 words.

  **Candidate 2: The Epistemic Framing.**
  *Focus:* Analyze the structure of uncertainty (independent vs. correlated credences) and its impact on expected value calculations.
  *Pros:* Strong decision-theoretic clarity.
  *Cons:* As the student notes, expectation is linear. Unless introducing risk-aversion or threshold views, this might mathematically dissolve into "no difference," leaving the paper with no substantive conclusion.

  **Candidate 3: The Axiological Framing.**
  *Focus:* Argue specifically for "subject-time" (duration × intensity) over "headcount" as the correct measure of moral value.
  *Pros:* Engages deeply with welfare ethics.
  *Cons:* Requires defending a specific theory of value, which distracts from the core interest in moral uncertainty and the scale argument's structure.

  **Candidate 4: The Parameterized Robustness Framing (Selected).**
  *Focus:* Treat the unit of counting and the structure of credence as variables. Ask whether the scale argument's conclusion (that insect welfare dominates) is *robust* across reasonable ranges of these parameters.
  *Why:* This avoids settling metaphysical or empirical disputes (which fits the student's constraint) while still yielding a determinate answer about the *argument's* stability. It converts empirical ignorance into a sensitivity analysis, which is methodologically precise for a short paper. It also allows the "linearity of expectation" worry to be addressed via the variance/value of information angle in the subordinate question.

  ***

  ### Research Proposal

  **Title:** Robustness and Parameters: Re-evaluating the Insect Scale Argument Under Moral Uncertainty

  **(a) Research Questions**
  **Primary Question:** Does the "scale argument" for insect moral priority remain robust when the metric of moral significance is shifted from simple headcounts to "subject-time" (duration of existence weighted by experiential intensity) and when credences in sentience are modeled as systematically correlated rather than independent?
  **Subordinate Question:** If credences are correlated, does this increase the expected value of information gained from empirical research into consciousness, thereby altering the optimal immediate action?

  **(b) Current State of the Debate**
  The prevailing discourse regarding insects and moral status often relies on a decision-theoretic heuristic: even a low non-zero probability of sentience, when multiplied by the vast population size of insects, yields an expected suffering total that outweighs higher-probability concerns regarding vertebrates. This is frequently termed the "scale argument."

  Current positions generally fall into two camps. The first accepts the arithmetic of the scale argument and concludes that insect welfare must dominate resource allocation, unless one adopts a near-zero credence in sentience. The second rejects the conclusion by arguing for skepticism strong enough to drive the probability term effectively to zero, or by arguing that the intensity of insect experience is negligible compared to vertebrates.

  However, a significant gap remains in how the variables of this equation are defined. First, the "scale factor" is almost universally treated as a headcount of biological organisms. It is contested whether this aligns with moral intuition; some argue that moral weight should track the temporal duration of experience or the complexity of the subject, yet this is rarely formalized in the scale argument. Second, the probability term is typically treated as an independent lottery per individual. It is contested whether this accurately reflects our epistemic position; since uncertainty stems from competing theories of consciousness rather than individual variation, credences should likely be correlated across taxa. Existing arguments leave it open whether correcting these two definitional choices undermines the dominance of the scale argument or merely adjusts its magnitude.

  **(c) Proposed Approach**
  This paper will not attempt to settle the empirical question of insect sentience, nor will it defend a specific metaphysical theory of subjecthood. Instead, it will employ a sensitivity analysis within a decision-theoretic framework. The approach involves constructing a formal model of the scale argument where the "scale factor" and "probability structure" are parameters rather than fixed constants.

  This approach is preferable to surveying empirical literature because the empirical data is currently inconclusive and would require speculative interpretation. It is also preferable to defending a specific theory of consciousness because the goal is to assess the *argument's* stability across theories, not to prove one theory true. By treating the contentious elements as variables, the paper can determine whether the conclusion holds across a range of plausible views (robustness) or only under specific, perhaps unwarranted, assumptions (fragility).

  **(d) Handling Empirical Inputs**
  Since the paper cannot settle empirical disputes, key inputs will be treated as parameters with defined ranges.
  1.  **The Unit of Counting:** The model will compare "headcount" against "subject-time." For the latter, lifespan estimates and intensity weights will be varied across orders of magnitude (e.g., mayflies vs. termite queens).
  2.  **The Probability Structure:** The model will compare independent credence assignments against a correlated model where a single theory of consciousness determines the status of entire clades.
  3.  **Intensity Weights:** Recognizing that duration is not the only factor, the model will include a parameter for relative experiential intensity compared to standard vertebrate models.

  The paper will explicitly map which conclusions are sensitive to which parameters. For instance, it will identify the threshold of intensity weighting at which vertebrate concerns regain priority, even under high insect population counts.

  **(e) Expected Results and Failure Conditions**
  A successful result will be a "sensitivity map" demonstrating that the scale argument's conclusion is fragile under specific, defensible changes to the parameters (e.g., if subject-time drastically reduces the moral weight of short-lived insects).

  A "negative" result—where the scale argument remains robust even after shifting to subject-time and correlated credences—is still a worthwhile outcome. It would demonstrate that objections based on counting methods or epistemic structure are insufficient to dismiss the scale argument, forcing critics to engage directly with the probability or intensity terms instead.

  The project would be considered a failure if it devolves into defending a specific theory of consciousness or if the model becomes too complex to yield interpretable results within the word limit. Another failure condition would be proving that the distinction between independent and correlated credence makes no difference to expected value without successfully pivoting to the value of information (the subordinate question).

  **(f) Feasibility Assessment**
  Six thousand words is sufficient for this scope, but tight. The primary risk is the subordinate question regarding the value of information. Calculating the expected value of information under correlated uncertainty can become technically dense. If space becomes constrained, the paper will prioritize the primary question (robustness of the scale argument) and treat the value of information point qualitatively rather than formally.

  Additionally, the paper must avoid getting bogged down in the debate over how to handle moral uncertainty itself (e.g., expected value vs. maximin). To maintain feasibility, the paper will stipulate standard expected value maximization as the decision rule, noting this as a contestable premise in the introduction. This allows the analysis to focus on the inputs (scale and probability) rather than the decision rule. If the analysis of correlated credence requires extensive explanation of variance vs. expectation, the discussion of "subject-time" will be simplified to a comparative statics exercise rather than a full derivation.
