answer: |-
  ### Brainstorming: The Core Tension & Collapse Points

  The "empty theory" charge sticks because students conflate the *definition* of the revealed preference relation with the *axioms* constraining it. They think: "If I choose X, I revealed I prefer X. If I choose Y later, I revealed I prefer Y. Theory holds." They miss that the theory isn't the labeling; it's the **prohibition**. The theory collapses if they don't see that RP + Stability = **Restricted Future Choices**.

  The second collapse point is the "Taste Change" escape hatch. If a student violates WARP, they claim their preferences changed. To prevent this, you must make the **Ceteris Paribus** assumption (stable preferences over the observation window) explicit *before* you talk about testing. If you leave it implicit, the behavioral economists in the room will eat you alive.

  The third collapse is treating Utility as the *explanation*. If you start with "agents maximize utility," RP looks like a derivation. You must start with "agents make choices," and show Utility is merely a mathematical shadow that exists *only if* choices are consistent.

  ---

  ### The Plan: 75 Minutes

  #### 1. Sequence & Dependencies (The Logic Flow)

  1.  **Observation (Minutes 0–10):** Define Choice Data $(p, x)$. No mention of utility. No mention of "liking."
  2.  **The Relation (Minutes 10–25):** Define "Directly Revealed Preferred To" ($x R y$). This depends entirely on the **Budget Set**. You cannot define the relation until the budget constraint is established (i.e., $y$ was affordable when $x$ was chosen).
  3.  **The Constraint (Minutes 25–40):** Introduce WARP/SARP. This is the empirical content. **Dependency:** This must come *before* Utility. If you introduce Utility first, they think the axioms are derived from psych. They are not; the axioms are the *condition* for the existence of a utility function (Representation Theorem).
  4.  **The "Empty" Charge & Stability (Minutes 40–55):** Address the tautology worry. This depends on the **Stability Assumption**. The theory is only testable if we assume the ordering doesn't shift between observations.
  5.  **Behavioral & Normative Status (Minutes 55–70):** Where BE fits in (violations of axioms) and what RP is actually for (benchmarking).
  6.  **Closing (Minutes 70–75):** The diagnostic question.

  **Crucial Dependency Note:** "Utility is just a number representing an ordering" must come **after** the testability payoff. If you teach utility first, they treat RP as a psychological theory. Teach RP as a consistency check on data; utility is just the prize you get if you pass the check.

  #### 2. The One Example: The "Three-Point Cycle"

  Do not use the standard two-good ice cream/graph setup. It is too static and invites "indifference curve" thinking rather than "choice data" thinking.

  **Use:** A consumer observed over **three weeks** buying bundles of goods (aggregate or specific) under **changing prices**.

  *   **Week 1:** Prices $p^1$. Chooses Bundle $A$. Bundle $B$ was affordable. (Reveals $A \succ B$)
  *   **Week 2:** Prices $p^2$. Chooses Bundle $B$. Bundle $C$ was affordable. (Reveals $B \succ C$)
  *   **Week 3:** Prices $p^3$. Chooses Bundle $C$. **Bundle $A$ was affordable.** (Reveals $C \succ A$)

  **What it must have:**
  *   **Three observations:** Two points only test WARP (direct contradiction). Three points test SARP (transitivity). The "empty" charge is hardest to refute on transitivity.
  *   **Affordability Checks:** You must explicitly show the cost calculation. In Week 3, show that $p^3 \cdot A \leq p^3 \cdot C$. If $A$ wasn't affordable, there's no violation.
  *   **No Income Changes:** Keep income fixed or normalize it. Income changes invite "I had more money so I bought different stuff" excuses. We want price substitution effects only.

  **What it must *not* have:**
  *   **Psychological labels:** Do not say "They liked A more." Say "They picked A."
  *   **Indifference:** Do not allow them to say "Maybe they were indifferent." RP treats choice as strict revelation.
  *   **Continuous Goods:** Use discrete bundles. It prevents "they chose a point on the same indifference curve" hand-waving.

  **Why Ice Cream Fails:** The 2-good graph implies a continuous field of choices. Students hide behind the tangency condition. The 3-point cycle forces a logical contradiction: $A \succ B \succ C \succ A$. It looks like a logical error, not a calculus problem.

  #### 3. Misconceptions: Order of Surfacing & Intervention

  1.  **"Circularity / Tautology" ("You chose it, so you preferred it")**
      *   *Surfaces:* Minute 15 (when defining the relation).
      *   *Intervention:* **Stop immediately.** Distinguish *Mental Preference* (cause) from *Revealed Preference* (description). Say: "RP does not claim choice is caused by preference. It claims that *if* we model them as having stable preferences, their choices cannot cycle. The theory is not the definition; the theory is the **ban on cycles**."
  2.  **"Utility = Happiness / Welfare"**
      *   *Surfaces:* Minute 30 (when you mention representation).
      *   *Intervention:* **Head off before writing $U(x)$.** State: "Utility here is a bookkeeping device. It has no units. It measures nothing but consistency. If you violate SARP, no utility function exists. It is not a measure of well-being."
  3.  **"Ordinal Means Meaningless"**
      *   *Surfaces:* Minute 35 (when discussing the uniqueness of U).
      *   *Intervention:* Clarify that "ordinal" means the *ranking* is what matters, which is exactly what the choice data provides. It's not meaningless; it's *less demanding* than cardinality.
  4.  **"Taste Change / Stability" ("They just changed their mind")**
      *   *Surfaces:* Minute 45 (when discussing the Cycle Example).
      *   *Intervention:* This is the kill shot. Say: "You are now adding an auxiliary hypothesis: Stability. RP + Stability is the theory. If you allow taste to change every period, you have no theory. You have a diary. To test RP, we must *assume* stability. If the data cycles, we reject the conjunction."
  5.  **"Behavioral Econ Refuted It"**
      *   *Surfaces:* Minute 60.
      *   *Intervention:* Reframe. "BE shows the axioms are often false descriptively. But RP remains the **null hypothesis**. You cannot measure 'bias' without a benchmark of 'consistency.' RP defines the benchmark."

  #### 4. The Closing Question

  Do not ask: "What is WARP?"
  Do not ask: "Is RP true?"

  **Ask:** "If I observe you choosing A over B today, and B over A tomorrow, have you necessarily violated Revealed Preference Theory? Why or why not?"

  *   *Correct Answer:* "No, not necessarily. We must assume preferences were stable across the two days. If preferences changed, the theory isn't violated; the ceteris paribus condition failed."
  *   *Why this works:* It forces them to acknowledge that the empirical content lies in the **stability assumption**, not the definition of preference. It kills the tautology charge.

  #### 5. Explicit Exclusions (Say this out loud)

  "I am explicitly refusing to cover three things today, and I want you to know why:
  1.  **Afriat's Theorem proofs:** We care about the logical structure of testing, not the linear algebra of reconstruction.
  2.  **Normative Welfare:** We are not discussing if RP tells us what *should* make you happy. We are discussing if it predicts what you *will* choose.
  3.  **Random Utility Models:** We are treating choice as deterministic for this seminar. Adding error terms muddies the philosophical point about falsifiability."

  ---

  ### Confidence & Uncertainty

  **Confidence Level:** 85%
  This structure has worked repeatedly to disarm the "tautology" charge by shifting focus from definition to constraint. The sequencing of Utility *after* Consistency is the critical pedagogical move that prevents psychological reductionism.

  **Least Sure Claim:**
  I am least sure about the instruction to **"Refuse to cover Random Utility Models."**
  *Reasoning:* In a mixed phil/econ grad seminar, the econ students will inevitably ask, "But what about stochastic choice?" Dismissing it entirely might make you look like you're dodging the modern econ standard. However, introducing it risks consuming 30 minutes and blurring the philosophical point about deterministic falsifiability.
  *Mitigation:* If pressed, acknowledge it exists as a way to save the theory from refutation, but note that it fundamentally changes the *status* of the theory from a logical constraint to a statistical fit, which is a different philosophical beast. Stick to the deterministic version for the 75-minute philosophical clarity, but don't act like the other doesn't exist.
