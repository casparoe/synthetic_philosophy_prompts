prompt: |-
  Act as a philosopher of economics who's taught revealed preference to mixed phil/econ grad students a bunch of times. Think carefully, and before you plan anything, spend a few lines brainstorming what the idea actually requires and where it usually collapses for students.

  Context: I've got 75 minutes with a philosophy-of-social-science seminar, everyone's had intermediate micro. Last night I got into a long argument with a friend who's convinced revealed preference is empty — "you chose it, so by definition you preferred it, so the theory can't be wrong" — and honestly half my seminar thinks the same thing, plus two or three who reckon behavioral econ already buried it and it's just not clear to them what's left to teach. Don't explain revealed preference to me. Plan how I should teach it.

  Give me: the order the pieces have to go in and what genuinely depends on what (where does budget-set stuff have to land relative to the consistency conditions, and does "utility is just a number that represents an ordering" come before or after the testability payoff?); the one example that carries the whole thing — I'm assuming a shopper's weekly baskets under changing prices, but tell me what that example must have and must *not* have, and why the standard two-good ice-cream setup can't do the job; the misconceptions in roughly the order they'll surface (the circularity charge, utility = happiness, choice = a stable inner state, "ordinal means meaningless," "it's all been refuted by framing effects") and the exact point in the sequence to head each one off rather than answer it later; one closing question that tells me whether the idea landed; and what I should explicitly refuse to cover at this level, said out loud to the room.

  Also: tell me how confident you are in this plan overall, and single out the one claim in it you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of Economics (experienced teacher of revealed preference to mixed phil/econ grad students).
      *   **Task:** Plan a 75-minute seminar session on Revealed Preference (RP).
      *   **Context:** Students have intermediate micro. Half think RP is empty/tautological ("you chose it, so you preferred it"). Some think behavioral econ killed it. Friend argument sparked this.
      *   **Constraints:** Do *not* explain RP to me (I know it). Focus on pedagogy, sequencing, examples, misconceptions, closing question, and exclusions.
      *   **Deliverables:**
          1.  Brainstorming on the core idea & collapse points.
          2.  Order of pieces (dependencies).
          3.  The One Example (requirements/prohibitions).
          4.  Misconceptions (order of surfacing & intervention points).
          5.  Closing Question.
          6.  Explicit Exclusions.
          7.  Confidence Level & Least Sure Claim.

  2.  **Brainstorming (The "Think Carefully" Phase):**
      *   *Core Idea:* RP isn't about reading minds; it's about consistency constraints on observable behavior. It turns preference from a *cause* of choice into a *description* of consistency.
      *   *Where it collapses:* Students conflate "preference" (psychological state) with "revealed preference" (binary relation defined by choice). They think WARP/SARP are just math tricks, not empirical content. They think if someone violates WARP, they just had a "change in taste," making the theory unfalsifiable.
      *   *The "Empty" Charge:* This is the Samuelson vs. Little/Arrow debate. If preference *is* choice, is it tautological? Only if we don't impose transitivity/stability over time. The empirical content lies in the *restriction* on future choices, not the post-hoc labeling of past choices.
      *   *Behavioral Econ:* It didn't bury RP; it showed the axioms (WARP/SARP) are often violated. But RP remains the *null hypothesis* of rationality. You need the benchmark to measure the deviation.
      *   *Pedagogical Challenge:* 75 minutes is tight. Need to move from "What is it?" to "Why isn't it empty?" to "What kills it?" quickly.

  3.  **Sequencing & Dependencies:**
      *   *Utility:* Must come *after* the consistency conditions. If you start with utility maximization, they think RP is just a derivative of psych. Start with choice data $\to$ consistency $\to$ representation theorem (utility exists *if* consistent).
      *   *Budget Sets:* Must be introduced early to define "revealed preferred to." $x$ is RPT $y$ if $x$ is chosen when $y$ was affordable.
      *   *Testability:* This is the climax. The theory is empty *unless* we assume stability over time/context.

  4.  **The One Example:**
      *   *Standard 2-good (Ice Cream):* Bad because it invites "but maybe they liked chocolate more that day" (taste change). It's too static.
      *   *Requirement:* Needs multiple observation periods, price changes, and a specific cycle that violates SARP. Needs to show that *without* assuming stable preferences, we can't predict anything. *With* stable preferences, we can rule out specific future choices.
      *   *Must Have:* At least 3 bundles to show transitivity violations (SARP), not just WARP. Price changes must make previously unchosen bundles affordable.
      *   *Must Not Have:* Income changes (complicates the budget line without adding logical punch). Psychological explanations (keep it behavioral/observational).

  5.  **Misconceptions & Intervention Points:**
      *   1. *Circularity ("Chose it = Preferred it"):* Head this off immediately in the definition phase. Distinguish *mental* preference from *revealed* relation.
      *   2. *Utility = Happiness:* Kill this before introducing the representation theorem.
      *   3. *Ordinal = Meaningless:* Address when discussing the representation theorem.
      *   4. *Stability/Taste Change:* This is the big one. Address when discussing falsifiability.
      *   5. *Behavioral Econ Refutation:* Address at the end. RP is the norm, BE is the deviation.

  6.  **Closing Question:**
      *   Needs to test if they understand the *conditionality* of the theory. Not "What is WARP?" but "Under what condition does this become empirical?"

  7.  **Exclusions:**
      *   Don't do the math proofs of Afriat's Theorem.
      *   Don't get into Strong vs. Weak axioms in deep technical detail (stick to the logic).
      *   Don't debate Normative vs. Positive extensively (stick to the logic of testing).

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Refining the Example:* A shopper buying bundles $(x_1, x_2, x_3)$ at prices $(p_1, p_2, p_3)$. Need a cycle. $A$ chosen over $B$, $B$ over $C$, but $C$ chosen over $A$ when affordable.
      *   *Refining the "Empty" Charge:* The key is *prediction*. If I choose A over B today, RP says I *won't* choose B over A tomorrow if A is available. If I do, the theory (plus stability assumption) is false.
      *   *Confidence:* High on pedagogy, moderate on the specific "One Claim" regarding behavioral econ integration.

  9.  **Final Polish:** Check tone. Needs to be authoritative but pedagogical. "Philosopher of Economics" voice.

  **(Self-Correction during drafting):** I initially thought about putting Utility before Consistency. No, that reinforces the "mental state" error. Consistency (WARP/SARP) must come first. Utility is just the *reward* for being consistent.
  Also, need to make sure the "Stability" assumption is explicit. That's the linchpin against the "empty" charge.

  10. **Final Review against constraints:**
      *   75 mins? Yes, plan fits.
      *   Order/Dependencies? Included.
      *   One Example? Detailed.
      *   Misconceptions? Ordered and timed.
      *   Closing Question? Included.
      *   Exclusions? Included.
      *   Confidence/Least Sure? Included.

