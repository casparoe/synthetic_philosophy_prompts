answer: |-
  # 1. Case Design Specification (Instructor's Key)

  **Fixed Background (All Cells):**
  Nora asserts flat out: "The 14:10 has already left."
  **Evidence:** Nora checked the departure board. It read "Departed." She has no defeaters. The board is usually reliable.
  **Constraint:** In all cells, Nora lacks knowledge.
  **Mechanism:** The board is malfunctioning (stuck on "Departed"). Nora is unaware of this.
  **Implication:** Nora's belief is justified but not knowledge-connected to the fact.

  **The 2x2 Matrix:**

  | | **Cell 1: True / Full Info** | **Cell 2: True / Partial Info** |
  | :--- | :--- | :--- |
  | **Truth Value** | Train **Left** (Coincidence) | Train **Left** (Coincidence) |
  | **Evaluator Info** | Knows Truth + Knows Board Broken | Knows Truth + Thinks Board Reliable |
  | **Nora's Status** | Justified True Belief (No Knowledge) | Justified True Belief (No Knowledge) |

  | | **Cell 3: False / Full Info** | **Cell 4: False / Partial Info** |
  | :--- | :--- | :--- |
  | **Truth Value** | Train **Not Left** | Train **Not Left** |
  | **Evaluator Info** | Knows Truth + Knows Board Broken | Knows Truth + Thinks Board Reliable |
  | **Nora's Status** | Justified False Belief (No Knowledge) | Justified False Belief (No Knowledge) |

  **Normative Predictions:**

  *   **Truth Norm:** Assert $p$ only if $p$ is true.
      *   Cells 1 & 2 (True): **Proper.**
      *   Cells 3 & 4 (False): **Improper.**
  *   **Knowledge Norm:** Assert $p$ only if you know $p$.
      *   All Cells (No Knowledge): **Improper.**
  *   **Reasonable-Belief Norm:** Assert $p$ only if you reasonably believe $p$.
      *   All Cells (Evidence Fixed/Strong): **Proper.**

  **Diagnostic Value:**
  *   Cells 1 & 3 (True vs False) diagnose Truth Norm vs. Epistemic Norms (Knowledge/Reasonable).
  *   Cells 1 & 2 (Full vs Partial Info) diagnose Objective Norms vs. Evaluator-relative criticism.

  ***

  # 2. Examination Paper Text

  **Graduate Seminar: Epistemology of Speech Acts**
  **Final Examination**
  **Time Allowed:** 3 Hours
  **Instructions:** Answer the compulsory question below. Closed book.

  **Case Stem:**
  Nora stands at a platform and asserts flat out to a companion: "The 14:10 has already left." Her assertion is based solely on the departure board, which reads "Departed." She has checked the board many times; it is usually reliable, and she has no reason to distrust it.

  However, unknown to Nora, the board is malfunctioning and is stuck displaying "Departed" regardless of the train's status.
  *   In **True Cases**, the train has in fact left (by coincidence).
  *   In **False Cases**, the train has not left.
  In all cases, Nora's evidence is identical: strong enough for reasonable belief, but because of the malfunction, she does not know the proposition.

  An **Evaluator** judges the propriety of Nora's assertion.
  *   In **Full Info** cases, the Evaluator knows whether the train left and knows the board is malfunctioning.
  *   In **Partial Info** cases, the Evaluator knows whether the train left but believes the board is reliable (they do not know about the malfunction).

  This generates four cells: (1) True/Full, (2) True/Partial, (3) False/Full, (4) False/Partial.

  **Question:**
  Write an essay addressing the following four points:

  1.  **Predictions:** For each of the three candidate norms (Truth, Knowledge, Reasonable-Belief), state whether they classify Nora's assertion as proper or improper in each of the four cells.
  2.  **Diagnosis:** Identify which cells are diagnostic for deciding between the Truth Norm and the Knowledge Norm, and which cells are diagnostic for deciding between the Knowledge Norm and the Reasonable-Belief Norm. Explain why.
  3.  **Artifacts:** Give two reasons why an intuitive verdict about propriety in a diagnostic cell might be an artifact of the case presentation rather than a reading of the norm. One reason must concern the Evaluator's information state; the other must concern the distinction between an assertion being improper and the speaker being blameworthy.
  4.  **Resolution:** Either propose a further datum that could genuinely discriminate between the Truth Norm and the Knowledge Norm, or argue that the search for a single constitutive norm of assertion is misconceived. Defend your position.

  ***

  # 3. Model Answer

  The three norms yield distinct predictions across the matrix. The Truth Norm dictates propriety solely by truth value: proper in Cells 1 and 2 (True), improper in Cells 3 and 4 (False). The Knowledge Norm dictates impropriety in all four cells, as Nora lacks knowledge in every scenario due to the malfunction. The Reasonable-Belief Norm dictates propriety in all four cells, as Nora's evidence is fixed and sufficient for justification regardless of truth or knowledge status.

  Diagnostic power lies in the contrasts. Cells 1 and 3 discriminate the Truth Norm from epistemic norms. If intuition says Cell 3 (False) is improper but Cell 1 (True) is proper, this supports the Truth Norm over the Knowledge Norm (which condemns both). Cells 1 and 2 discriminate objective norms from evaluator-relative judgments. Since Nora's epistemic status is identical in both, objective norms (Truth, Knowledge, Reasonable-Belief) demand the same verdict. If intuitions diverge based on the Evaluator's knowledge of the malfunction, this signals a confusion between normative status and criticism.

  Intuitive verdicts are often artifacts. First, regarding Evaluator information: in Cell 2 (Partial Info), the Evaluator believes Nora knows. They may judge the assertion "proper" because they cannot identify a violation, not because no violation exists. This conflates *detectability* with *propriety*. An objective norm is violated regardless of the judge's ignorance. Second, regarding blame versus impropriety: in Cell 1 (True/Full), Nora violates the Knowledge Norm but is blameless (she checked the board). Intuition may label the assertion "proper" because criticizing Nora seems unfair. However, a norm can be constitutive without being a basis for blame. One can violate a rule of a game innocently; the move is still invalid.

  These confusions suggest the search for a single constitutive norm is misconceived. Assertion is a multi-functional tool serving both information transfer and social coordination. The Truth Norm captures the goal of information transfer; the Reasonable-Belief Norm captures the goal of rational cooperation. When they conflict, as in Gettier cases, it is not because one norm is false, but because different contexts prioritize different goods. In scientific contexts, knowledge (or truth) is paramount; in everyday coordination, reasonable belief suffices.

  Therefore, rather than seeking a datum to force a choice between Truth and Knowledge norms, we should adopt a pluralist view. The "propriety" of assertion is not a monolithic property but a vector of values. A Gettiered assertion is truth-successful but knowledge-deficient. Calling it simply "proper" or "improper" loses this granularity. The friction in our intuitions across the 2x2 matrix arises because we are trying to collapse these distinct values into a single binary verdict. The solution is not a better case, but a better theory: assertion is governed by a cluster of norms, weighted by context. This explains why the Truth Norm feels right in Cell 3 (falsehood is always bad) while the Reasonable-Belief Norm feels right in Cell 1 (blameless true belief is acceptable). We should stop asking "What is the norm?" and start asking "Which norm is in play?"

  ***

  # 4. Marking Scheme (25 Marks)

  **1. Normative Predictions (6 Marks)**
  *   **2 Marks:** Correctly identifies Truth Norm varies by Truth value only.
  *   **2 Marks:** Correctly identifies Knowledge Norm varies by Knowledge status (Improper all cells).
  *   **2 Marks:** Correctly identifies Reasonable-Belief Norm varies by Evidence (Proper all cells).
  *   *Typical Fumble:* Assuming Knowledge Norm allows propriety in True/Gettier cells because the belief is true.

  **2. Diagnostic Identification (6 Marks)**
  *   **3 Marks:** Identifies True vs. False cells (1 vs 3) as testing Truth vs. Epistemic norms.
  *   **3 Marks:** Identifies Full vs. Partial Info (1 vs 2) as testing Objective Norm vs. Evaluator Relativity.
  *   *Typical Fumble:* Treating Partial Info cells as changing Nora's epistemic status rather than the Evaluator's.

  **3. Artifact Analysis (6 Marks)**
  *   **3 Marks:** Explains Evaluator Info artifact (confusing undetectability with propriety).
  *   **3 Marks:** Explains Blame artifact (confusing excuse with norm compliance).
  *   *Typical Fumble:* Treating the appropriateness of criticism as a direct measure of whether a norm was violated.

  **4. Resolution Argument (7 Marks)**
  *   **4 Marks:** Clearly proposes a datum OR argues against single norm (Pluralism).
  *   **3 Marks:** Provides coherent argument defending the choice without relying on citations.
  *   *Typical Fumble:* Sliding between constitutive and merely regulative readings of a norm without distinguishing them.

  **Top Band Requirement:** To reach the top band (23-25), the answer must not only execute the technical distinctions correctly but also demonstrate in the Resolution that the "artifact" analysis logically motivates the move to Pluralism (or the specific datum proposed), showing synthesis rather than segmentation.

  ***

  # 5. Instructor Note

  This design is discriminating because it forces students to separate objective normative status from subjective criticism, a distinction often blurred in standard lottery/Gettier discussions. The 2x2 structure prevents rote reproduction of the "Gettier = Improper" mantra by varying the Evaluator's knowledge. The weakest point is that a well-prepared student could argue the Partial Info cells are irrelevant to constitutive norms, dismissing half the matrix as merely pragmatic. This is a valid objection, but handling it requires the precise distinction between propriety and blameworthiness requested in part 3, thereby testing depth rather than allowing avoidance.
