answer: |-
  You are not being sentimental. You are sensing a flaw in the logic that Dan is missing because he is looking at this as a math problem rather than a human system. Dan is applying a concept from game theory called "backward induction," often illustrated by the "Centipede Game" or the "Chainstore Paradox." His logic is seductive because it feels rigorous, but it relies on assumptions that do not exist in your specific situation.

  Here is the breakdown of where the chain breaks, when Dan's logic would actually apply, and what you need to do next.

  ### Where Dan's Chain Breaks

  Dan's argument relies on three specific premises that must all be true for the backward induction to hold. In your case, all three are false.

  **1. The Common Knowledge Requirement**
  For backward induction to work, the end date must be "common knowledge." This means you know the contract ends March 31, they know the contract ends March 31, you know that they know, and they know that you know.
  *   **The Break:** This is not common knowledge. Rick does not know that you know. The new owners have not announced anything. If you suddenly cut service levels in January, you signal that you know something you shouldn't. This changes the game from "coasting on a known end" to "breach of contract based on insider information." If you cut hours and they ask why, you cannot say "because you're firing us." If you lie, you burn the bridge. If you tell the truth, you expose Yolanda and violate confidentiality.

  **2. The Fixed End Date**
  Dan treats March 31 as a certainty.
  *   **The Break:** It is a rumor. The sale could fall through. The new owners could decide hiring in-house is a nightmare and retain you. By acting as if the termination is guaranteed, you make it guaranteed. If you cut service now, you give them a legitimate reason to terminate you *early* for cause, or simply confirm their decision to leave. You are converting a probability into a certainty.

  **3. The Isolated Transaction**
  Dan treats this account as a single, isolated financial transaction with no spillover effects.
  *   **The Break:** This is the biggest error. You noted that three of your other four accounts came from Rick's referrals. This is not one account; this is a hub-and-spoke revenue model where Rick is the hub. If you cut service quality, Rick will notice. He won't know *why* (he doesn't know you know), he will just know your performance slipped. He will stop referring you. You aren't risking 41% of your revenue; you are risking roughly 75% of your revenue (the 41% plus the three referral accounts). Dan's math ignores the collateral damage to your other contracts.

  ### Steelmanning Dan: When Would He Be Right?

  To be fair to Dan, his logic is not crazy; it is just applied to the wrong context. Here is the scenario where Dan is 100% correct and you should follow his advice:

  1.  **Formal Notice:** The client has officially notified you in writing that the contract ends March 31 with no possibility of extension.
  2.  **No Future Value:** You have zero chance of future business with them, and zero chance of referrals from them. You will never see them again after March 31.
  3.  **Unmonitorable Performance:** The client cannot easily detect a reduction in effort until it is too late for them to fix it (e.g., cleaning inside light fixtures vs. vacuuming floors).
  4.  **Financial Distress:** Your company is in immediate cash trouble and you need to maximize margin on every remaining invoice to survive April.

  In that specific vacuum, backward induction holds. If there is no future to protect, investing in quality is economically irrational. But you are not in that vacuum. You are in a mid-size city where reputation travels, the end date is unconfirmed, and your biggest referrer is the facilities manager.

  ### Addressing Your Specific Variables

  *   **Rick doesn't know that you know:** This is your leverage. As long as you maintain standards, Rick remains your advocate. If you cut corners, you force him to defend poor performance to his new bosses, which makes him look bad. You want Rick looking good until the very end.
  *   **Rumor vs. Notice:** Legally, your contract is valid until terminated according to its terms. Acting on a rumor to reduce service is a breach of contract. If the sale falls through and they sue for reduced service, you will lose.
  *   **Yolanda and the Crew:** Yolanda has been with you eleven years. She knows your standards. If you order her to cut corners, you are telling her that your integrity is for sale. In a small company, culture is everything. If she loses respect for you, she leaves. If she leaves, your quality drops anyway, and hiring/training a new supervisor costs far more than the margin you'd save on buffing.
  *   **The Referrals:** As mentioned, this is the critical financial link. Dan is calculating margin on the office building. He is ignoring the customer acquisition cost of the other three accounts. If Rick stops referring you, you have to spend marketing dollars to replace them. That cost wipes out the "saved" money from cutting hours.

  ### Action Plan: The Next Two Weeks

  Do not cut hours. Do not bill aggressively. Do not confront Rick yet. Here is the playbook:

  1.  **Verify Silently:** Have Dan or you check public county records for the property sale confirmation. Do not ask Rick. Confirm the rumor without tipping your hand.
  2.  **Maintain Standards:** Instruct Yolanda to maintain current standards. Tell her nothing about the rumor. If she asks about budget, tell her you are reviewing Q1 projections but service levels remain priority. Her stability is your asset.
  3.  **Business Development:** Immediately start hunting for new accounts to replace the 41%. You have five months. That is enough time if you start today. Treat the potential loss as a catalyst for growth, not a signal to shrink.
  4.  **Contract Review:** Have Dan review the termination clause. How much notice must they give? If they need to give 60 days and haven't notified you by February 1, you might have leverage to negotiate a transition fee or an extension.
  5.  **The Conversation with Rick:** Do not bring it up yet. If you bring it up now, you confirm you have inside info, which puts Rick at risk with his new owners. Wait until either (a) you see public record of the sale, or (b) you receive formal notice.
      *   *When you do talk:* Frame it as partnership. "We've heard rumors of a sale. We want to ensure a smooth transition for the building regardless of who owns it."
      *   *Gain:* You position yourself as a professional partner, not a vendor. You might negotiate a referral fee for handing over the new owners, or secure a transition contract.
      *   *Loss:* Minimal, if timed correctly. If timed now, the loss is trust.

  ### Summary

  Dan is treating this like a one-time poker hand where you want to extract maximum value before the game ends. But you are playing in a league where the other players talk to each other after the hand is over. If you squeeze too hard now, you don't just lose this hand; you get kicked out of the league.

  The "unraveling" Dan describes only happens when both sides know the end is near. Since only you know, you have the power to prevent the unraveling by acting as if the future is still open. That isn't sentimentality; it's strategic information management.

  Verdict: DAN IS WRONG
