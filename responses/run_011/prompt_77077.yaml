answer: |-
  # Handout: Disambiguating the Causal Closure of the Physical

  **Context:** The slogan "the physical world is causally closed" is frequently treated as a single premise, but it functions as a placeholder for at least four distinct claims. Confusion arises when a speaker asserts a weak, defensible version but draws conclusions that require a strong, controversial version. Below is a menu of the specific claims hiding under the slogan, an analysis of how they are being used in your group, and an explicit list of the inferential slides (bait-and-switches) occurring in the discussion.

  ## I. The Menu of Readings

  Here are the four distinct readings of "Causal Closure," ranked from trivial to substantive.

  | Reading | Label | Scope of Events | Definition of "Physical" | Kind of Sufficiency | Causation vs. Explanation | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **PCC-1** | **Weak Causal** | All *physical* events. | Anything quantified over by fundamental physics. | **Contributory:** Every physical event has *a* physical cause (among potentially others). | **Causation** (Ontological) | **Platitude.** Compatible with interactionist dualism (via overdetermination). |
  | **PCC-2** | **Strong Causal** | All *physical* events. | Anything quantified over by fundamental physics. | **Complete:** Every physical event has a *sufficient* physical cause (fixes the probability/outcome). | **Causation** (Ontological) | **Defensible.** Standard premise for physicalists. Allows indeterminism (probabilistic sufficiency). |
  | **PCC-3** | **Exclusionary** | All *physical* events. | Fundamental physics only. | **Exclusive:** A sufficient physical cause exists *to the exclusion* of any non-physical cause. | **Causation** (Ontological) | **Substantive/Contested.** This is not closure alone; it is Closure + No Overdetermination. |
  | **PCC-4** | **Explanatory** | All *physical* events. | Current or ideal completed physics. | **Descriptive:** There exists a complete physical *account* of why the event occurred. | **Explanation** (Epistemic) | **Indeterminate.** Slides easily between "we can explain it" and "nothing else caused it." |

  **Notes on the Menu:**
  *   **Scope:** All readings restrict the claim to *physical* effects. None claim that *mental* events are closed (that would beg the question against dualism).
  *   **Sufficiency:** PCC-2 and PCC-3 do not entail determinism. "Sufficient" here means the physical cause fixes the objective chances of the effect, even if those chances are <100%.
  *   **The Critical Slide:** The move from **PCC-2** (Physical causes are sufficient) to **PCC-3** (Non-physical causes are excluded) requires an additional premise: *Systematic Overdetermination is false.* Closure alone does not rule out a mental cause working alongside a physical cause.

  ## II. Analysis of the Four Use-Cases

  Here is how the slogan is functioning in the four instances you observed, mapped against the menu above.

  **1. The Interactionist Dualism Rebuttal**
  *   **The Move:** "Mind can't inject energy into the brain because physics is closed."
  *   **Reading Needed:** **PCC-3 (Exclusionary).** To rule out dualist injection, you must claim physical causes exclude non-physical ones.
  *   **Reading Asserted:** Usually **PCC-1 (Weak)** or **PCC-2 (Strong).** Speakers often argue, "Every physical event has a physical cause," which is true even if it *also* has a mental cause.
  *   **Status:** **Bait-and-Switch.** The defensible claim (PCC-2) is asserted; the exclusionary conclusion (PCC-3) is spent. Without an explicit argument against overdetermination, this rebuttal fails.

  **2. Kim's Exclusion Argument**
  *   **The Move:** "Mental properties are screened off because the physical realizer does all the work."
  *   **Reading Needed:** **PCC-2 (Strong)** + **No Overdetermination.** Kim needs the physical cause to be sufficient (PCC-2) to generate the exclusion problem.
  *   **Reading Asserted:** **PCC-2.** This is generally the correct usage in this context.
  *   **Status:** **Defensible.** However, the *conclusion* (mental causation is excluded) relies on the "No Overdetermination" principle, which is often tacitly bundled into the closure premise. If the speaker treats Closure *as* the exclusion principle, they are sliding from PCC-2 to PCC-3.

  **3. The Folk Psychology Elimination**
  *   **The Move:** "Since nothing but the physical does any causing, folk psychology is a fiction."
  *   **Reading Needed:** **PCC-3 (Exclusionary)** or **PCC-4 (Explanatory)** interpreted ontologically.
  *   **Reading Asserted:** **PCC-4 (Explanatory).** The argument usually rests on the idea that physics provides a *better explanation*.
  *   **Status:** **Bait-and-Switch.** This slides from **Explanation** to **Causation**. Just because a physical explanation is *complete* (PCC-4) does not mean the mental properties are *causally inert* (PCC-3), unless one assumes explanatory completeness entails causal exclusion (which is controversial).

  **4. The Non-Reductive Physicalist Defense**
  *   **The Move:** "Closure is no threat because mental properties *are* physical properties."
  *   **Reading Needed:** **PCC-2 (Strong).**
  *   **Reading Asserted:** **PCC-2.**
  *   **Status:** **Consistent.** This speaker is not switching meanings. They are arguing that if mental events are a subset of physical events (via token identity or realization), then mental causation *satisfies* closure rather than violating it. This is the only use-case that does not rely on a slide.

  ## III. The Advisor's Variant: "No Event Without a Physical Difference-Maker"

  This variant reframes closure in terms of counterfactual dependence rather than production/sufficiency.

  *   **The Claim:** For any event $E$, if $E$ had not occurred, there would have been a difference in the physical history of the world. (Or: For any cause $C$ of $E$, there is a physical $P$ such that $P$ is a difference-maker for $E$).
  *   **Relation to Closure:** This is weaker than **PCC-2**. It requires that the physical *tracks* the causation, not necessarily that the physical *completes* it.
  *   **Commitment:** It commits you to **Physical Supervenience** of effects. If the mental causes a physical effect, the physical base of the mental cause must also be a difference-maker.
  *   **Exclusion Power:** **Weak.** This formulation does not automatically generate an exclusion argument. It allows for the mental to be a difference-maker *alongside* the physical, provided the physical is *also* a difference-maker. To get exclusion, you must add: "There is only *one* difference-maker per event." Without that addition, this slogan is compatible with non-reductive physicalism and even some forms of dualism. It sounds scarier than it is because "difference-maker" implies necessity, but it doesn't imply *uniqueness*.

  ## IV. The Bait-and-Switch List

  Bring this list to the group. These are the specific inferential slides where a weak premise is asserted to justify a strong conclusion.

  1.  **The Dualism Slide:** Asserting "Every physical event has a physical cause" (PCC-1/2) to conclude "No physical event has a non-physical cause" (PCC-3).
  2.  **The Elimination Slide:** Asserting "Every physical event has a physical explanation" (PCC-4) to conclude "Non-physical properties do not causally exist" (Ontological Exclusion).
  3.  **The Kim Slide:** Asserting "Physical causes are sufficient" (PCC-2) to conclude "Mental causes are excluded" without explicitly arguing for the "No Systematic Overdetermination" premise.
  4.  **The Determinism Slide:** Asserting "Physical causes are sufficient" (PCC-2) to imply "The physical future is fixed" (Determinism), ignoring probabilistic sufficiency.
