      *   *Analysis:* Huge contradiction. A pitcher can get a Win while giving up unearned runs (fielding helped him), but ERA punishes him less for those. Conversely, a pitcher can lose despite a low ERA if the offense doesn't score.
      *   *Verdict:* Totally different boxes. Win = Team result + Pitcher presence. ERA = Individual performance isolation. They don't belong in the same philosophical framework.

