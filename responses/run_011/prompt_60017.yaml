answer: |-
  # THE CONSTRUCTION SORTER

  **Instructions:** Below are five scenarios. For each scenario, there are three versions: **Race**, **Gender**, and **Money**. Read the scenario, then answer the specific question for each domain. Circle exactly one option (A, B, or C) for each question. There are no right or wrong answers; answer based on what you think is actually true, not what you wish were true.

  ---

  ### SCENARIO 1: THE VANISHING BELIEF
  *Imagine that overnight, every human being loses all memory and understanding of a specific concept. No one remembers the word, no one understands the idea, and no one believes it applies to anything.*

  **1. (Race):** Everyone forgets the concept of "Race." No one classifies anyone by race anymore.
  *   **A.** Racial inequalities and social patterns would persist exactly as they are, even if no one noticed.
  *   **B.** The patterns would linger for a while due to habit, but eventually fade away as the concept is gone.
  *   **C.** Race would cease to exist immediately; there would be nothing left to study.

  **2. (Gender):** Everyone forgets the concept of "Gender." No one classifies anyone by gender anymore.
  *   **A.** Gendered divisions of labor and power would persist exactly as they are, even if no one noticed.
  *   **B.** The divisions would linger for a while due to habit, but eventually fade away as the concept is gone.
  *   **C.** Gender would cease to exist immediately; there would be nothing left to study.

  **3. (Money):** Everyone forgets the concept of "Money." No one recognizes currency or debt anymore.
  *   **A.** Economic value and trade inequalities would persist exactly as they are, even if no one noticed.
  *   **B.** The markets would linger for a while due to habit, but eventually fade away as the concept is gone.
  *   **C.** Money would cease to exist immediately; the paper and metal would just be objects.

  ---

  ### SCENARIO 2: THE PREDICTION TEST
  *Imagine you are trying to guess how a stranger's life will go over the next ten years (income, health, social treatment).*

  **4. (Race):** You know the stranger's racial classification, but nothing else.
  *   **A.** This tells you almost nothing; people in that category are too different from each other.
  *   **B.** This gives you a rough guess, but only because other people treat them based on that label.
  *   **C.** This gives you a reliable prediction of their outcomes, regardless of why.

  **5. (Gender):** You know the stranger's gender classification, but nothing else.
  *   **A.** This tells you almost nothing; people in that category are too different from each other.
  *   **B.** This gives you a rough guess, but only because other people treat them based on that label.
  *   **C.** This gives you a reliable prediction of their outcomes, regardless of why.

  **6. (Money):** You know the amount of money the stranger has, but nothing else.
  *   **A.** This tells you almost nothing; wealthy people are too different from each other.
  *   **B.** This gives you a rough guess, but only because other people treat them based on that label.
  *   **C.** This gives you a reliable prediction of their outcomes, regardless of why.

  ---

  ### SCENARIO 3: THE MIRROR EFFECT
  *Imagine a person is classified into a category from birth. They are told what it means and treated accordingly.*

  **7. (Race):** A person is classified by Race.
  *   **A.** This changes nothing about their internal personality or biology; it is purely external.
  *   **B.** This changes how they see themselves and act, which in turn changes how the world treats them.
  *   **C.** This physically alters their biology or essence to match the category.

  **8. (Gender):** A person is classified by Gender.
  *   **A.** This changes nothing about their internal personality or biology; it is purely external.
  *   **B.** This changes how they see themselves and act, which in turn changes how the world treats them.
  *   **C.** This physically alters their biology or essence to match the category.

  **9. (Money):** A token is classified as Money (e.g., a specific coin).
  *   **A.** This changes nothing about the object's physical properties; it is purely external.
  *   **B.** This changes how people handle the object, which wears it down or preserves it differently.
  *   **C.** This physically alters the substance of the object to match the value.

  ---

  ### SCENARIO 4: THE INVENTION REVEAL
  *Imagine historians prove definitively that a category was invented recently by a specific group of people to serve a specific purpose.*

  **10. (Race):** Race is proven to be a recent invention for political control.
  *   **A.** It is fake and harmful; we should stop using the category immediately.
  *   **B.** It is invented but still real; we should keep using it to track inequality.
  *   **C.** It is invented and harmful; we should change the category but keep tracking the effects.

  **11. (Gender):** Gender is proven to be a recent invention for political control.
  *   **A.** It is fake and harmful; we should stop using the category immediately.
  *   **B.** It is invented but still real; we should keep using it to track inequality.
  *   **C.** It is invented and harmful; we should change the category but keep tracking the effects.

  **12. (Money):** Money is proven to be a recent invention for political control.
  *   **A.** It is fake and harmful; we should stop using the category immediately.
  *   **B.** It is invented but still real; we should keep using it to track inequality.
  *   **C.** It is invented and harmful; we should change the category but keep tracking the effects.

  ---

  ### SCENARIO 5: THE DESIGN QUESTION
  *Imagine a system exists where no single person planned the rules, and many participants don't understand how it works, yet it functions.*

  **13. (Race):** Racial categories emerged from millions of small interactions, with no central designer.
  *   **A.** It is not a real system because no one designed it.
  *   **B.** It is a real system, but only because people currently believe in it.
  *   **C.** It is a real system because the patterns of treatment exist regardless of design.

  **14. (Money):** Currency markets emerged from millions of small interactions, with no central designer.
  *   **A.** It is not a real system because no one designed it.
  *   **B.** It is a real system, but only because people currently believe in it.
  *   **C.** It is a real system because the patterns of treatment exist regardless of design.

  *(Note: There is no Gender question for Scenario 5 to keep the total to 14.)*

