  # SCORING KEY AND INTERPRETATION GUIDE

  **For the Organizer:** Do not distribute this page until after the participants have finished the quiz. The scoring is designed to be done with a pencil in five minutes.

  ### PART 1: CALCULATE THE SCORES

  Have each participant tally their answers for each domain (Race, Gender, Money) separately.

  **Axis A: Attitude Dependence (Questions 1, 3, 5)**
  *This measures whether the kind needs human attitudes to exist.*
  *   Count **A** answers in Q1, Q3, Q5 for each domain.
      *   **0-1 As:** **Independent.** (You think the kind exists even without belief/design).
      *   **2 As:** **Causal.** (You think the kind exists, but belief affects it).
      *   **3 As:** **Constitutive.** (You think the kind vanishes without belief).
  *   *Note: For Q3 and Q5, score 'A' as 0 points, 'B' as 1 point, 'C' as 2 points toward Dependence. Wait, simpler:*
  *   **Revised Scoring for Speed:**
      *   **Q1:** A=0 (Independent), B=1 (Causal), C=2 (Constitutive).
      *   **Q3:** A=0 (Independent), B=1 (Causal/Looping), C=2 (Essentialist).
      *   **Q5:** A=0 (Independent), B=1 (Causal), C=2 (Constitutive).
      *   **Sum Q1+Q3+Q5 for each domain.** Max score = 6.
      *   **0-2:** **Strong Independence.**
      *   **3-4:** **Mixed/Causal.**
      *   **5-6:** **Strong Dependence.**

  **Axis B: Explanatory Power (Questions 2, 4)**
  *This measures whether the kind supports generalizations.*
  *   **Q2:** A=0 (None), B=1 (Social only), C=2 (Robust).
  *   **Q4:** A=0 (None), B=1 (Social only), C=2 (Robust).
  *   **Sum Q2+Q4 for each domain.** Max score = 4.
  *   **0-1:** **Low Power.**
  *   **2-3:** **Moderate Power.**
  *   **4:** **High Power.**

  **Modifiers (Questions 10-14)**
  *   **Q10-12 (Normativity):** If they circle **A**, they slide "Constructed" to "Fake/Bad." If **C**, they separate Metaphysics from Ethics.
  *   **Q13-14 (Design):** If they circle **C**, they are Structural Realists. If **B**, they are Intentionalists.

  ---

  ### PART 2: THE LOGICAL SPACE (THE GRID)

  Plot each participant's domain scores on the grid below. **X-Axis** is Explanatory Power (Low to High). **Y-Axis** is Attitude Dependence (Independent to Constitutive).

  | | **Low Explanation** (Score 0-1) | **High Explanation** (Score 3-4) |
  | :--- | :--- | :--- |
  | **Constitutive** (Score 5-6) | **Cell 1: Fictionalism** | **Cell 2: Institutional Realism** |
  | **Causal** (Score 3-4) | **Cell 3: Skepticism** | **Cell 4: Structural Realism** |
  | **Independent** (Score 0-2) | **Cell 5: Eliminativism** | **Cell 6: Natural Kind / Commodity** |

  #### Position Definitions (Assign these names to participants based on their cell):

  *   **Cell 1 (Fictionalism):** The kind is made of rules/beliefs, but doesn't help predict anything. (e.g., "Phlogiston," or "Astrology").
  *   **Cell 2 (Institutional Realism):** The kind exists *because* we agree it does, and it predicts outcomes. **(Typical for Money)**.
  *   **Cell 3 (Skepticism):** The kind might depend on us, but it's not a useful tool for explanation.
  *   **Cell 4 (Structural Realism):** The kind has real effects caused by social treatment, even if no one designed it. **(Typical for Race)**.
  *   **Cell 5 (Eliminativism):** The kind is not real, doesn't predict anything, and should be discarded.
  *   **Cell 6 (Natural Kind / Commodity):** The kind exists independently of us (like gold or water) and predicts outcomes. **(Typical for Money if they think it's 'valuable substance')**.

  #### Special Leaves (Apply Modifiers):

  *   **The Looping View:** If a participant is in **Cell 4 (Structural Realism)** but answered **B** on Scenario 3 (The Mirror Effect), they hold the **Interactive Kind** view. They believe the classification changes the person, which changes the classification.
  *   **The Spontaneous Order:** If a participant is in **Cell 6** or **Cell 4** but answered **C** on Scenario 5 (Design), they believe the kind is real without a designer.
  *   **The Evaluative View:** If a participant answered **A** on Scenario 4 (Invention Reveal) across all domains, they are treating "Constructed" as a slur for "Bad." Their metaphysics is driven by ethics.
  *   **The Slide:** If a participant answered **A** on Scenario 4 ("It is fake... stop using it"), they are conflating *ontology* (is it real?) with *normativity* (is it good?). This is the "Constructed = Not Real = Bad" slide.

  ---

  ### PART 3: DIAGNOSING EMPTY CELLS & INDISTINGUISHABLE PAIRS

  **Empty Cells:**
  *   **Cell 1 (Fictionalism):** Often empty. It is unstable to admit a kind is purely made of beliefs (Constitutive) but admits it does no work (Low Explanation). Participants usually push it to Cell 5 (Eliminativism) or Cell 2 (Institutional).
  *   **Cell 3 (Skepticism):** Often empty. If a kind depends on us (Causal/Constitutive), participants usually grant it *some* explanatory power (Cell 4). If it has no power, they usually call it Independent/Fake (Cell 5).

  **Indistinguishable Pairs:**
  *   **Structural Realism (Cell 4) vs. Spontaneous Order (Cell 6/4):** The quiz cannot fully separate those who think Race is "Real but Social" (Cell 4) from those who think it is "Real and Independent" (Cell 6) if both admit high explanatory power.
      *   *Further Question:* "If all humans died but the artifacts remained, would the kind remain?" (Structural Realist says No; Natural Kind says Yes).
  *   **Institutional Realism (Cell 2) vs. Fictionalism (Cell 1):** Distinguishes on whether the rules *work*.
      *   *Further Question:* "Can you be wrong about the kind?" (Institutionalist says Yes, there are rules; Fictionalist says No, it's all pretense).

  **Domain Sensitivity Warning:**
  *   **Money:** The template in Scenario 1 (Vanishing Belief) is most natural for Money. Most people intuitively know money vanishes without belief (Constitutive).
  *   **Race:** The template in Scenario 1 is misleading for Race. Many participants will answer "A" (Independent) because racism persists without belief, but this conflates *prejudice* (psychological) with *race* (categorical). A "C" answer here for Race indicates a strong Social Constructionist view that is often counter-intuitive to laypeople.
  *   **Gender:** Scenario 3 (Mirror Effect) is the strongest discriminator for Gender. If participants answer "B" (Internal Change), they are endorsing the Looping Effect. If they answer "A" (External Only), they are endorsing a purely Structural view. This is where the "confusion" in your group will likely cluster.

  **The "Slide" Detection:**
  *   Check Scenario 4. If a participant marks **A** ("It is fake... abolish"), they have failed to separate metaphysics from ethics. In the discussion, ask them: "If I proved 'Money' was invented, would you burn your banknotes?" If they say no, ask why Race/Gender is different. This exposes the slide.

  ---

  ### PART 4: FACILITATION TIPS

  1.  **Plot the Group:** Draw the Grid on a whiteboard. Place sticky notes for each participant (one note per domain, so one person might have three notes).
  2.  **Highlight Clusters:** You will likely see a cluster in **Cell 2 for Money** (Institutional) and **Cell 4 for Race** (Structural). Gender will be scattered between 4 and 2.
  3.  **Force the Conflict:** If two people are in the same Cell but different Domains (e.g., Realist about Money, Eliminativist about Race), ask: "What is the *difference* between the dollar and the racial category that makes one real and the other not?"
  4.  **Watch the Slide:** If someone argues "Race isn't real because it's constructed," point to their Money score. If they said Money *is* real despite being constructed, ask them to reconcile the two.
