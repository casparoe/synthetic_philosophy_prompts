prompt: |-
  I'm putting together a problem set for an intermediate game/decision theory seminar and I want one case that makes a single point land: "just eliminate the dominated strategies" isn't a determinate instruction until you say whether mixtures are allowed to do the dominating. I want the numbers to force that, not me announcing it.

  So: design a two-player 3x3 game, wrapped in an ordinary competitive situation — two food trucks picking lunch spots, two candidates picking a message, your call, just not an abstract grid with X and Y. Small whole-number payoffs, negatives only if the story makes sense of them. The constraints I care about:

  1. Nothing is strictly dominated by any *single* other strategy, for either player. A student who only ever compares pure options against pure options gets nowhere at all.
  2. Each player nonetheless has exactly one option that falls, and in both cases what kills it is a mixture of their other two. Give me the weights and write out the comparison against every one of the opponent's options — don't just assert the domination.
  3. Everything strict. No weak dominance anywhere, so I don't have to get into order-dependance with the class.
  4. The option that dies for player 1 should be the sensible-looking middle one, the hedge. The lesson I'm after is that a built-in compromise can be strictly worse than genuinely randomizing between the two extremes.
  5. Once both dead options are gone, the leftover 2x2 should have no dominance at all and a unique Nash equilibrium, in mixed strategies. Give me the probabilities, and confirm the full 3x3 has no pure equilibrium.

  Then the write-up: what each player can rule out and why, the equilibrium, and — separately — a demonstration that each knocked-out option is never a best response to any belief about the opponent's play, including mixed beliefs. That's the same fact from the other direction and I want them to see it twice.

  Three honest notes at the end, please. (a) Does the equivalence I just leaned on between never-a-best-response and dominated-by-some-mixture still hold with three players instead of two? I think it breaks but I'm not confident and I don't want something wrong in a handout. (b) Which single feature of the numbers is doing all the work, and what does the case degrade into if I perturb it — say, bump one payoff so the middle option isn't quite so middling? (c) Someone will say you shouldn't allow mixed strategies in the dominance test at all, because a real player who can't commit to a coin flip shouldn't be assumed to have one. Is that a coherent escape hatch here, or does the case just run over it?

  Tell me how sure you are about the arithmetic and flag anything you'd want me to recheck rather than smoothing it over. And if I've asked for things that can't all be true at once, or the framing is muddled somewhere, say so plainly and tell me which constraint has to go — don't quietly fudge the numbers to fit.
