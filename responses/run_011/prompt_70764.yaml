  Here is the case design, the solution, and the three notes you requested.

  ### The Scenario: The Lunch Truck Location Game

  Two food trucks, **Row** and **Column**, are choosing where to park for the lunch rush. There are three locations along a busy street: **West**, **Central**, and **East**.

  *   **West** and **East** are residential zones with steady, moderate demand.
  *   **Central** is the high-traffic business district. It has the highest potential revenue, but also high permit fees and fierce competition if both trucks show up.

  **Payoffs:**
  *   If you are the only truck in a zone, you capture the full market (**2**).
  *   If you are in West/East and the opponent is in Central, you split the edge market, breaking even (**0**).
  *   If you are both in West/East (opposite ends), you each have a local monopoly (**2**).
  *   If you are both in Central, the permit fees and price war cause a loss (**-1**).
  *   If you are in Central and the opponent is West/East, the high rent eats your profit; you break even (**0**).

  **The Matrix (Row Payoffs, Column Payoffs):**

  | | **Top (West)** | **Middle (Central)** | **Bottom (East)** |
  | :--- | :---: | :---: | :---: |
  | **West** | 2, 0 | 0, 0 | 0, 2 |
  | **Central** | 0, 0 | -1, -1 | 0, 0 |
  | **East** | 0, 2 | 0, 0 | 2, 0 |

  *(Note: Row chooses the location name; Column chooses the location name. "Top" corresponds to West, "Middle" to Central, "Bottom" to East to keep the visual grid aligned with the street layout.)*

  ---

  ### Part 1: Eliminating the Dominated Strategies

  **The Instruction:** "Eliminate strictly dominated strategies."
  **The Trap:** If students only compare pure strategies against pure strategies, they will find nothing to eliminate.

  **1. Pure Strategy Comparison (The Dead End)**
  Take Row's **Central** strategy.
  *   Compare **Central** vs. **West**:
      *   If Col plays Top: $0$ vs $2$ (West wins).
      *   If Col plays Middle: $-1$ vs $0$ (West wins).
      *   If Col plays Bottom: $0$ vs $0$ (**Tie**).
      *   *Result:* West does **not** strictly dominate Central.
  *   Compare **Central** vs. **East**:
      *   If Col plays Top: $0$ vs $0$ (**Tie**).
      *   If Col plays Middle: $-1$ vs $0$ (East wins).
      *   If Col plays Bottom: $0$ vs $2$ (East wins).
      *   *Result:* East does **not** strictly dominate Central.

  Because of the ties (the zeros), no single pure strategy kills the middle option. A student stopping here concludes the game is not dominance-solvable.

  **2. Mixed Strategy Comparison (The Solution)**
  Now, allow Row to consider a mixture of their other two options: **50% West, 50% East**. Let's calculate the expected payoff of this mixture against every possible move by Column.

  *   **If Column plays Top:**
      *   Mixture: $0.5(2) + 0.5(0) = \mathbf{1}$
      *   Central: $\mathbf{0}$
      *   $1 > 0$ (Mixture wins)
  *   **If Column plays Middle:**
      *   Mixture: $0.5(0) + 0.5(0) = \mathbf{0}$
      *   Central: $\mathbf{-1}$
      *   $0 > -1$ (Mixture wins)
  *   **If Column plays Bottom:**
      *   Mixture: $0.5(0) + 0.5(2) = \mathbf{1}$
      *   Central: $\mathbf{0}$
      *   $1 > 0$ (Mixture wins)

  **Conclusion:** The pure strategy **Central** is **strictly dominated** by the mixed strategy $\sigma_{Row} = (0.5 \text{ West}, 0.5 \text{ East})$.
  By symmetry, Column's **Middle** strategy is strictly dominated by $\sigma_{Col} = (0.5 \text{ Top}, 0.5 \text{ Bottom})$.

  **Action:** Rational players will never play Central or Middle. We reduce the game to the 2x2 corners.

  ---

  ### Part 2: The Equilibrium of the Reduced Game

  Remove the middle row and column. We are left with:

  | | **Top** | **Bottom** |
  | :--- | :---: | :---: |
  | **West** | 2, 0 | 0, 2 |
  | **East** | 0, 2 | 2, 0 |

  **1. Check for Pure Nash Equilibrium**
  *   (West, Top): Row gets 2 (Best), Col gets 0 (Prefers Bottom). **No.**
  *   (West, Bottom): Row gets 0 (Prefers East), Col gets 2 (Best). **No.**
  *   (East, Top): Row gets 0 (Prefers West), Col gets 2 (Best). **No.**
  *   (East, Bottom): Row gets 2 (Best), Col gets 0 (Prefers Top). **No.**
  There is **no Pure Strategy Nash Equilibrium** in the full 3x3 game.

  **2. Solve for Mixed Strategy Nash Equilibrium**
  Let Row play West with probability $p$.
  Let Column play Top with probability $q$.

  *   **Column's Indifference:**
      *   Expected Payoff Top: $p(0) + (1-p)(2) = 2 - 2p$
      *   Expected Payoff Bottom: $p(2) + (1-p)(0) = 2p$
      *   Set equal: $2 - 2p = 2p \Rightarrow 4p = 2 \Rightarrow \mathbf{p = 0.5}$

  *   **Row's Indifference:**
      *   Expected Payoff West: $q(2) + (1-q)(0) = 2q$
      *   Expected Payoff East: $q(0) + (1-q)(2) = 2 - 2q$
      *   Set equal: $2q = 2 - 2q \Rightarrow 4q = 2 \Rightarrow \mathbf{q = 0.5}$

  **Unique Nash Equilibrium:**
  Row plays **(0.5 West, 0.5 East, 0 Central)**.
  Column plays **(0.5 Top, 0.5 Bottom, 0 Middle)**.
  Expected Payoff: **1** for each player.

  ---

  ### Part 3: Demonstration of "Never a Best Response"

  You asked to see the same fact from the other direction: Prove that **Central** is never a best response to *any* belief Row might hold about Column's play.

  Let Row's belief be that Column plays Top with probability $q_1$, Middle with $q_2$, and Bottom with $q_3$ (where $q_1+q_2+q_3=1$).

  *   **EU(West)** $= 2q_1 + 0q_2 + 0q_3 = \mathbf{2q_1}$
  *   **EU(East)** $= 0q_1 + 0q_2 + 2q_3 = \mathbf{2q_3}$
  *   **EU(Central)** $= 0q_1 - 1q_2 + 0q_3 = \mathbf{-q_2}$

  For Central to be a best response, it must be at least as good as West *and* East.
  1.  **Central $\ge$ West:** $-q_2 \ge 2q_1$. Since probabilities are non-negative, this requires $q_1=0$ and $q_2=0$.
  2.  **Central $\ge$ East:** $-q_2 \ge 2q_3$. This requires $q_3=0$ and $q_2=0$.

  If $q_1=0, q_2=0, q_3=0$, the probabilities do not sum to 1. This is an impossible belief.
  In any valid belief, at least one of $q_1$ or $q_3$ is positive, making West or East strictly positive, while Central is zero or negative.
  **Therefore, Central is never a best response.**

  ---

  ### Three Honest Notes

  **(a) Does the equivalence hold with three players?**
  **No, not exactly.** In 2-player games, "Strictly Dominated by a Mixed Strategy" is mathematically equivalent to "Never a Best Response to any belief" (Pearce's Lemma). In 3+ player games, this equivalence breaks depending on how you define "belief."
  *   If "belief" allows for **correlated** strategies among opponents (e.g., Players 2 and 3 coordinate), the equivalence **holds**.
  *   If "belief" is restricted to **independent** mixed strategies (the standard Nash assumption where opponents randomize separately), the equivalence **fails**. There are strategies in 3-player games that are never a best response to any independent profile but are *not* strictly dominated by any mixture.
  *   *For your handout:* Stick to the 2-player equivalence. It is robust. If a student asks about 3 players, the distinction between independent and correlated beliefs is the key teaching moment.

  **(b) Which single feature of the numbers is doing all the work?**
  The **zeros** in the off-diagonals of the middle row/column.
  Specifically, look at Row's payoff for **Central** against Top/Bottom (the 0s). The mixture of West/East turns those 0s into 1s (averaging 2 and 0).
  *   **Perturbation:** If you bump Row's payoff for (Central, Top) from **0** to **1**, the dominance becomes **weak** (Mixture gets 1, Central gets 1). If you bump it to **2**, Central is no longer dominated at all.
  *   **Degradation:** If the middle option offers *any* specific advantage against a pure strategy that the mixture cannot match or beat, the strict dominance vanishes. The "hedge" must be uniformly mediocre to be killed by a randomized extreme.

  **(c) The "No Coin Flip" Objection**
  *Objection:* "You shouldn't allow mixed strategies in the dominance test. A real player can't commit to a coin flip before choosing a location."
  *Response:* This is a coherent philosophical objection to *implementing* mixed strategies, but it does not save the dominated pure strategy.
  Dominance is about **value**, not implementation. The test asks: "Is there *any* available course of action that yields higher expected utility than playing Central?" If I have access to a randomization device (even a mental one), the mixture is available. If I prefer the lottery (0.5 West, 0.5 East) over the sure thing (Central), then Central is objectively inferior.
  Rationality requires me to eliminate inferior options. Whether I *actually* flip the coin in the end (to play the MSNE) or just use the logic to eliminate Central and then pick West is secondary. The elimination of Central stands because it is strictly worse in expectation, regardless of whether the final choice is pure.

  ---

  ### Arithmetic Confidence Check
  *   **Dominance:** $1 > 0$, $0 > -1$, $1 > 0$. Strict inequalities hold. **Confidence: 100%.**
  *   **Pure Dominance Failure:** The ties at 0 prevent pure dominance. **Confidence: 100%.**
  *   **NE:** Matching Pennies structure on the corners guarantees unique MSNE at 0.5/0.5 and no PSNE. **Confidence: 100%.**
  *   **Never-BR Proof:** The algebra $-q_2 \ge 2q_1$ forcing impossible probabilities is robust. **Confidence: 100%.**

  **Flag for Recheck:** The only potential ambiguity is the story interpretation of the "0" payoff. Ensure students understand that "0" means "Break Even" (not "No Customers"), otherwise the -1 loss in the center seems disproportionate. As long as "0 = Covering Costs" and "2 = Profit" and "-1 = Loss," the ordinal ranking holds.
