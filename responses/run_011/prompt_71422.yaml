answer: |-
  ### Candidate Structures

  1.  **The Constraint Auction:** Teams get a budget of "tokens" to bid on formal features (rhyme, meter, etc.). They can only keep what they buy. *Verdict:* Too gamified; spends energy on economics rather than poetics.
  2.  **The Blind Taste Test:** Participants read five published translations without attribution and rank them, then discuss why. *Verdict:* Violates your "no famous renderings" rule and makes them passive consumers rather than active strugglers.
  3.  **The Constraint Contract (Selected):** Teams must sign a binding agreement to keep exactly three formal features from a list before writing a word. Different teams keep different features. Non-readers judge the output blind, then re-judge with knowledge of the constraints. *Verdict:* This is the one. It forces the "pre-commitment" you asked for, creates incommensurable results, and makes the non-readers' shift in judgment the climax of the session.
  4.  **The Exquisite Corpse:** Line-by-line passing of the poem. *Verdict:* Too chaotic for a discussion on form; emphasizes accident over intention.

  ---

  ### Workshop Design: The Constraint Contract

  **Facilitator Note:** This run-sheet is designed for a substitute facilitator. Follow the timing strictly. The tension comes from the time pressure and the binding nature of the "Contract."

  #### 1. Phase-by-Phase Timeline (120 Minutes)

  *   **0:00–0:10 (10 min): Introduction & Reading.**
      *   Welcome. No lecture on Hofstadter.
      *   Read the French aloud (you or a French speaker). Read the literal crib aloud (a non-reader).
      *   State the goal: "We are not trying to make a 'good' poem. We are trying to keep a promise."
  *   **0:10–0:20 (10 min): Sorting & The Rule of Pens.**
      *   Divide into 3 teams (sizes 4, 4, 3).
      *   **Crucial Rule:** The 4 French speakers (including the pro) are **Consultants**. They cannot hold pens. They cannot suggest English words. They can only answer "Yes/No" on French meaning or pronunciation. The 7 non-readers are **Authors**. They hold the pens.
  *   **0:20–0:55 (35 min): The Contract & Drafting.**
      *   Hand out the *Feature Inventory*.
      *   Teams must select exactly **three** features to preserve. They sign the *Contract Sheet*.
      *   Teams draft their version.
  *   **0:55–1:05 (10 min): Tea Break.**
      *   Collect the poems. Do not let teams see each other's work.
  *   **1:05–1:20 (15 min): Blind Judging (Round 1).**
      *   Non-French readers (the 7 Authors) rotate tables or sit in a semi-circle.
      *   Read the 3 poems aloud.
      *   Vote on *Beauty and Clarity* only. (Ballot Section A).
  *   **1:20–1:35 (15 min): The Reveal & Re-Judging (Round 2).**
      *   Reveal the *Contract Sheets* for each poem (what they promised to keep).
      *   Vote on *Success of Translation* given the constraints. (Ballot Section B).
  *   **1:35–2:00 (25 min): Debrief.**
      *   Facilitated discussion using the ordered questions below.

  #### 2. Team Sorting & Power Dynamics

  **The Split:**
  *   **Team A:** 1 French Speaker + 3 Non-Readers.
  *   **Team B:** 1 French Speaker + 3 Non-Readers.
  *   **Team C:** 1 French Speaker (The Pro) + 2 Non-Readers.
  *   **Floating French Speaker:** If you have a 4th French speaker not in the Pro role, place them in Team A or B. If you only have the Pro + 3 others, distribute evenly.

  **Neutralizing the Pro Translator:**
  *   Give the Pro a specific badge or card that says **"WALKING DICTIONARY."**
  *   **Rule:** If the Pro suggests an English rhyme or phrasing, the team is disqualified from that line. They may only say, "In French, that word means X," or "That syllable count is wrong."
  *   **Why:** This forces the non-readers to make the aesthetic choices. They must decide if a rhyme is worth a clumsy meaning. They become the translators; the French speakers become the source code.

  **Load-Bearing Non-Readers:**
  *   Only the non-readers sign the Contract.
  *   Only the non-readers cast the votes.
  *   The French speakers are physically prevented from writing.

  #### 3. Handout Text

  **Handout 1: The Feature Inventory**
  *(Print one per team)*
  > **CHOOSE EXACTLY THREE. CIRCLE THEM. YOU MAY NOT CHANGE YOUR MIND ONCE YOU START WRITING.**
  >
  > 1.  **The Skeleton:** Every line must be exactly 3 syllables (or beats).
  > 2.  **The Echo:** Every couplet must rhyme (AABBCC...).
  > 3.  **The Circle:** The last line must be identical to the first line.
  > 4.  **The Name:** You must include the poet's name (Clément) in the middle, and it must rhyme.
  > 5.  **The Shift:** You must switch from Formal (You) to Informal (You) halfway through.
  > 6.  **The Tone:** You must use at least two archaic words (e.g., *thee, doth, grant, betwixt*).

  **Handout 2: The Contract Sheet**
  *(Print one per team)*
  > **TRANSLATION CONTRACT**
  >
  > **Team Name:** _______________
  > **We promise to preserve:** 1. ___________ 2. ___________ 3. ___________
  > **We explicitly abandon the rest.**
  >
  > **Signatures (Non-Readers Only):**
  > _________________ _________________ _________________
  >
  > **Time Start:** _________ **Time End:** _________

  **Handout 3: The Judge's Ballot**
  *(Print one per Non-Reader)*
  > **ROUND 1: BLIND TASTE TEST**
  > *Read the poems aloud. Ignore how they were made. Judge only how they sound to you.*
  > **Most Beautiful/Clear:** [ ] Poem A  [ ] Poem B  [ ] Poem C
  > **Least Successful:** [ ] Poem A  [ ] Poem B  [ ] Poem C
  >
  > **ROUND 2: INFORMED JUDGMENT**
  > *Now read the Contract Sheet for each poem. Judge how well they kept their promise.*
  > **Most Faithful to Promise:** [ ] Poem A  [ ] Poem B  [ ] Poem C
  > **Did knowing the constraints change your mind about Round 1?** [ ] Yes  [ ] No
  > **If Yes, how?** __________________________________________________

  #### 4. The Debrief (Ordered Questions)

  *Do not lecture. Ask these questions in order. Let the silence sit.*

  1.  "Look at Round 1 votes. Which poem won on pure beauty? Now look at Round 2. Did the winner change?" *(Maps to: The reader's aesthetic preference vs. the translator's technical fidelity.)*
  2.  "Team [X], you chose to keep the Rhyme but drop the Syllable Count. Read line 4. What did you have to break in English to make that rhyme work?" *(Maps to: Form is not a container; changing the shape changes the content.)*
  3.  "For those who don't read French: In Round 1, you judged 'faithfulness' based on how it sounded. In Round 2, you judged it based on a rule sheet. Which verdict feels more honest?" *(Maps to: The non-reader's authority is an illusion based on available data.)*
  4.  "Team [Y], you tried to keep the *Vous/Tu* shift. Did anyone in the room notice it without the Contract sheet? If not, did it matter?" *(Maps to: Untranslatable features that vanish for the target audience.)*
  5.  "Hofstadter argues you can't separate form and meaning. Did this activity prove him right, or did it prove you *can* separate them by making a menu?" *(Maps to: The limitation of the game itself.)*

  #### 5. What Predictably Goes Wrong (and Fixes)

  *   **The "Gorgeous Free Verse" Sabotage:** A team ignores the contract and writes a beautiful poem that breaks all rules.
      *   *Fix:* During the drafting phase, circulate. If you see it, stop them. "You are in breach of contract." If they submit it anyway, announce during Judging Round 2: "This poem is disqualified for breach of contract." It becomes a teaching moment about constraints.
  *   **The "Line One" Black Hole:** A team spends 20 minutes on "Ma mignonne."
      *   *Fix:* At the 15-minute mark of drafting, call "Halfway Point." If a team has fewer than 10 lines written, they must skip to the end and work backward.
  *   **The Grammar Trap:** The group gets stuck arguing whether *doint* is subjunctive or imperative.
      *   *Fix:* The Pro Translator is authorized to make an executive ruling within 30 seconds. "It means 'grant.' Move on."
  *   **The Judge's Strike:** Non-readers refuse to rank the poems ("They are all different").
      *   *Fix:* "There are no ties. You must choose which one you would publish if you were the editor. Pick one."
  *   **The Checked-Out Non-Reader:** Someone feels useless because they don't know French.
      *   *Fix:* Remind them during sorting: "The French speakers are forbidden from writing. You are the only ones who can make this poem exist. You are the translators today."

  #### 6. Backup Micro-Activity (15 Minutes)

  *If the main drafting fails or energy dies:*

  **"The Three-Word Limit"**
  1.  Give everyone the literal crib.
  2.  Tell them: "Translate the *entire* poem using only the 28 most common words in the English language (e.g., *the, and, is, you, me, go, come, sick, well*)."
  3.  No proper nouns. No rhymes. Just pure meaning compression.
  4.  Read 3 results aloud.
  5.  **Debrief:** "What died when we removed the 'fancy' words? Was it still Marot?"

  #### 7. A Frank Note on Limitations

  **What This Activity Cannot Reproduce:**

  1.  **The "Lego Brick" Fallacy:** This workshop treats form as a menu of separable features (check box for Rhyme, check box for Meter). Hofstadter's central argument is that form and content are *fused*—you cannot remove the rhyme without changing the meaning, not just the shape. By giving them a checklist, we are lying to them slightly to make the game playable. **You must confess this in the Debrief (Question 5).** Tell them: "In reality, you can't choose these separately. The rhyme *is* the meaning. We used a menu to make the point visible, but the menu is a simplification."
  2.  **The Time Scale:** Real translation involves days of staring at a wall, not 35 minutes of tea-fueled panic. The activity simulates the *pressure* of choice, but not the *depth* of reflection.
  3.  **The "Dozens of Versions" Argument:** Hofstadter's book relies on showing 50+ versions to prove his point. We are making 3. You cannot show the *spectrum* of possibility in two hours. You can only show the *conflict*.
  4.  **The Reader's Role:** In the real world, the reader doesn't get a "Contract Sheet." They never know what the translator promised. The "Round 2" judging is artificial because real readers never get to re-judge with the constraints in hand. **You must supply this context:** "In the real world, you only get Round 1. You decide what counts as 'good' without knowing the cost. That is the power and the danger you hold as readers."

  **Facilitator's Final Duty:**
  You must bridge the gap between the game and the theory. The game creates the friction; you must provide the vocabulary to describe it. When they say "It was hard to rhyme," you say "That is the friction of *form*." When they say "I liked the one that lied," you say "That is the reader's preference for *flow* over *fidelity*." Without your framing, it's just a parlor game. With it, it's Hofstadter.
