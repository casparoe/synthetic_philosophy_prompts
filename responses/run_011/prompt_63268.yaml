answer: |-
  **MEMORANDUM**

  **TO:** Records-Governance Committee
  **FROM:** Committee Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Master Patient Index Merge Logic and Identifier Architecture

  **DECISION**

  The Committee hereby adopts a **Combination of Proposal A and Proposal B**.

  We will retain the qualitative merge logic of Proposal A as a heuristic for continuity of care, but we will implement the content-independent identifier architecture of Proposal B as the foundational guarantee of numerical distinctness. Crucially, the "automatic" nature of the current merge rule is suspended for cases of perfect qualitative agreement.

  **CONCRETE REVISION TO RULE**

  Effective immediately, the Master Patient Index (MPI) logic is revised as follows:

  1.  **Identifier Assignment (Proposal B Element):** Every new registration record is assigned a locally issued, content-independent Local Unique Identifier (LUI) at the point of creation. This LUI constitutes the primary key for the record and is never inferred from patient attributes.
  2.  **Merge Logic (Proposal A Element):** The expanded qualitative field set (Name, DOB, Address, Insurer, Blood Type, Allergy, Medications, Problem List, Registration Date, **Government-Issued ID**, **Household Relationship**) remains in effect.
  3.  **Conflict Resolution:** If two records share the same LUI, they are one patient. If two records share different LUIs but match perfectly on all expanded qualitative fields, the system shall **flag for manual review** rather than automatically merge. Automatic merging is permitted only when qualitative fields match *and* the Government-Issued ID is identical.

  **IMPLEMENTATION WINDOW**

  Informatics is directed to deploy the LUI architecture and update the merge algorithm within **90 days**, prior to the start of the next fiscal quarter (January 1). During this window, the current automatic merge rule is suspended for any record pair matching on Date of Birth and Surname.

  **RATIONALE AND PHILOSOPHICAL GROUNDS**

  The Informatics Chair has argued forcefully that if two records agree on every captured field, "there is nothing left to make them two." This relies on the Principle of the Identity of Indiscernibles (PII): that qualitative identity guarantees numerical identity. The Chair contends that Proposal B is dangerous because it severs the link between data and identity, licensing the proliferation of "phantom patients" and fragmenting clinical history.

  We accept the operational risk of fragmentation as manageable through manual review, but we reject the metaphysical certainty underpinning the Chair's objection. The incident involving the fraternal twins demonstrates that our field set, however wide, is epistemically limited. We must address the "Two Spheres" thought experiment directly to ensure our policy is robust regardless of the metaphysical truth.

  **1. If the possibility of indiscernibles is real (Metaphysical Contingency)**
  If the universe allows for two distinct entities to share every qualitative property (as in Max Black's two exactly similar spheres), then qualitative data can *never* prove numerical identity. In this scenario, Proposal A is fundamentally unsound; no amount of field expansion can distinguish the spheres. Our policy must therefore provide a non-qualitative differentiator. By adopting the LUI (Proposal B), we ensure that even if two patients are qualitatively identical, the system preserves their numerical distinctness. The policy treats the LUI as the ontological anchor, ensuring that if nature produces indiscernibles, our records do not collapse them into one.

  **2. If the possibility of indiscernibles is not real but merely apparent (Epistemic Limitation)**
  If the PII holds metaphysically (no two things are truly exactly alike), our inability to capture *every* possible property means indiscernibility remains an operational reality. We may lack the sensor to detect the distinguishing property (e.g., a specific genetic marker not in our database, or the "twin status" field prior to March). In this scenario, qualitative agreement indicates a high probability of identity, but not certainty. Our policy must account for human ignorance. By requiring manual review for perfect matches on qualitative fields, we acknowledge that what appears as "everything" to our database may not be "everything" in reality.

  **CONCLUSION**

  The Chair is correct that abandoning qualitative matching entirely (Pure Proposal B) risks clinical safety through data fragmentation. However, relying on qualitative matching alone (Pure Proposal A) risks patient safety through erroneous conflation.

  By combining these approaches, we stipulate that while qualitative agreement is sufficient to *suggest* identity for the purpose of care continuity, it is insufficient to *prove* identity for the purpose of record destruction. We prioritize the safety of the distinct patient over the efficiency of the merged chart. The LUI ensures that if two spheres exist, we have two IDs. The qualitative rule ensures that if one sphere exists, we have one chart.

  **APPROVED:**

  Records-Governance Committee
