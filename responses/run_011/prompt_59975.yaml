answer: |-
  **TO:** Members of the Recruitment Appeals Panel
  **FROM:** [Your Name]
  **DATE:** 24 February 2025
  **SUBJECT:** Opinion on Complaint Regarding 2024–25 Constable Intake

  **Introduction**

  This opinion concerns the complaint lodged by the Gender Equality Network regarding the 2024–25 recruitment round. We face a statistical phenomenon known as Simpson's Paradox, where a trend appears in different groups of data but disappears or reverses when these groups are combined. Our task is not merely to choose the table that supports a preferred outcome, but to determine which level of data corresponds to the legal questions in our Terms of Reference.

  **The Statistical Context**

  To understand why the data points in opposite directions, consider the vacancy distribution. Neighbourhood Response offered 437 posts (high success rate); Specialist Operations offered 134 (low success rate). Men applied predominantly to Neighbourhood (600 applicants); women applied predominantly to Specialist Operations (400 applicants), influenced by the force's previous campaign.

  Consequently, the aggregate table shows men succeeding at 54.5% and women at 39.5%. This gap exists not because boards rejected women at a higher rate, but because women applied in greater numbers to units where vacancies were scarcer and competition fiercer. The unit table reveals that within each distinct competition, women were actually selected at higher rates than men. The further breakdown within Specialist Operations (by rota) shows men succeeding at higher rates within those specific sub-groups, but this is driven by men clustering in the harder rota and women in the easier one. The same mathematical principle applies: application choices drive the aggregate, selection decisions drive the unit rates.

  **Limb 1: The Selection Process**

  The first limb asks whether the *process* treated candidates of one sex less favourably. This requires us to examine the decisions actually made by the selection boards. The force structure dictated that candidates were assessed only by their chosen unit's board. A board in Neighbourhood never compared a candidate against one in Specialist Operations. Therefore, the unit is the logical boundary of the "process".

  At this level, the data is clear: women achieved higher selection rates in all three units. The Network argues we should look at the aggregate or the rota split. The aggregate is inappropriate for Limb 1 because no single decision-maker controlled the force-wide outcome; it is a sum of independent decisions. The rota split, while revealing a localised disparity within Specialist Operations, does not negate the fact that the Specialist Operations board overall selected women at a higher rate (31.3% vs 18%).

  **Recommendation:** I recommend we **dismiss** the complaint under Limb 1. The selection boards did not treat women less favourably. Consequently, we cannot exercise our power to quash the round or direct a re-run.

  **Limb 2: Outcome and Responsibility**

  The second limb asks whether the round produced a *disparity* for which the force is responsible. Here, the aggregate data is probative. The force is a single entity responsible for the total workforce composition. The resourcing board fixed the vacancies, creating units with vastly different success rates. Furthermore, the force ran a campaign encouraging women to apply to Specialist Operations without informing them of the lower vacancy density or selection probability compared to Neighbourhood roles.

  While the individual boards acted fairly (Limb 1), the force's strategic decisions regarding vacancy allocation and campaign messaging created a structural environment where women were statistically less likely to be appointed overall. This is a disparity for which the force is answerable.

  **Recommendation:** I recommend we **uphold** the complaint under Limb 2. We should exercise our power to make **recommendations** to the Chief Constable. These should focus on reviewing vacancy allocation models and ensuring future campaign materials disclose vacancy densities and historical selection rates by unit. These recommendations should apply to the **2025–26 recruitment round** and subsequent cycles.

  **Addressing the Network's Argument**

  The Network argues that a rule whose verdict reverses whenever a further variable is introduced (Unit vs. Rota vs. Aggregate) cannot be reliable. They contend that if the rota table shows bias against women, the unit table is an illusion.

  This argument conflates mathematical instability with legal relevance. The verdict only reverses because the *decision-maker* changes. The aggregate compares outcomes across different decision-makers; the unit table compares outcomes within them; the rota table compares outcomes within candidate preferences. The rule is stable if anchored to authority. For Limb 1 (process), we look to the authority of the board (Unit). For Limb 2 (outcome), we look to the authority of the force (Aggregate).

  Regarding the rota data: while it shows a localised disadvantage for women within Specialist Operations, it does not override the unit-level finding for the force-wide process complaint. However, it supports the need for specific recommendations regarding how Specialist Operations manages rota preferences during selection.

  **Future Reporting**

  To prevent recurrence of this disagreement, the workforce analyst must alter her reporting protocol. Future monitoring reports must present data at two levels simultaneously, explicitly distinguished by purpose:

  1.  **Process Monitoring:** Data disaggregated by **Assessing Board** (Unit). This is the criterion for evaluating fairness of decision-making.
  2.  **Outcome Monitoring:** Data aggregated by **Force Total**, accompanied by an analysis of **Application Flow**. This is the criterion for evaluating workforce disparity.

  The analyst must not present one table as superseding the other. Instead, reports must include a narrative explaining whether disparities are driven by selection efficiency (board performance) or application distribution (candidate choice/force resourcing). This distinction ensures the panel can immediately identify which limb of the Terms of Reference is engaged.

  **Conclusion**

  We must dismiss the allegation of procedural bias while upholding the concern regarding structural disparity. This approach respects the independence of the selection boards while holding the force accountable for the strategic environment it created. I look forward to discussing this at Thursday's meeting.
