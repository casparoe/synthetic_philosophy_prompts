      *   Why does this matter for the novel? If the character says "Beliefs aren't real," a philosopher reader will cringe. If he says "Beliefs are real patterns, like centers of gravity," it's accurate.
      *   *Dramatic implication:* A center of gravity is real, but you can't put it in a bag. It depends on the object. If the object breaks, the center of gravity vanishes. That's a great metaphor for death.

