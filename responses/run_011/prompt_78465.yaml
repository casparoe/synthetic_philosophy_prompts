      *   *Refinement:* The character can say: "Her understanding was real, but it wasn't a ghost. It was a process. And now the process has stopped." Or, more sharply: "You think her understanding was a light inside her. It wasn't. It was a dance of competences. And the dance is over."
      *   *Comparing Devastation:* The "Eliminativist" lie says "She never really understood." The "Dennettian Truth" says "She understood, but she was a machine, and now she is broken." The latter is arguably *more* poignant because it validates the love while stripping the comfort of dualism. It forces the daughter to accept mortality without the buffer of "spirit."

  6.  **Drafting the Response:**
