      *   *The Joke:* "In his world, a 'good deal' means the vendor stays in business. At home, a 'good deal' means we actually go on vacation. For thirty-one years, he tried to make sure those two definitions didn't crash into each other." (Maybe too abstract). Let's go with the "invisibility" joke.
      *   *The Core:* Talk about the "race." It's not a race to win, it's a race to stay running. The pressure to go faster.
      *   *The Specific Incident:* Allude to the argument without airing dirty laundry. "There were times I thought he bent too far." "I learned that holding the line isn't about never moving. It's about choosing where to stand."
      *   *The Mother:* "Mom didn't just watch this happen. She held the space where he could make these calls."
      *   *Closing:* To the next chapter.

  10. **Refining the Tone (The "Anti-Cynical" Pivot):**
      *   The prompt says: "find the room a person does have inside a race — which race to enter at all, how fast to descend, whom you refuse to leave behind on the way down."
      *   I need to emphasize *control*. Even when the market forces a price cut, *he* chose which supplier to squeeze and which to protect. *He* chose the speed.
      *   The "corrosive" parts: Acknowledge them, but say he managed the corrosion.
