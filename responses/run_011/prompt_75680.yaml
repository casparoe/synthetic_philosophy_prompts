answer: |-
  Good evening. For those of you I haven't met yet, I'm [Your Name]. For the family: I'm the one who usually asks for the check. For the industry folks: I'm the one who still asks my dad how much the table cost.

  Thirty-one years. That is a very long time to be responsible for the price of wood, glue, and fabric. It is a very long time to be the person who has to say "no" to a vendor you respect, or "yes" to a component you worry about.

  There is a joke my father used to tell. He'd say his job was ten percent negotiation and ninety percent explaining to people why the cheaper option would fall apart in a year. The family half of this room is nodding because they've heard that lecture about winter coats and used cars. The industry half is nodding because they've sent him the invoices for the winter coats and the used cars.

  But in all seriousness, standing here, looking at the mix of people in this room, I've been thinking about what this job actually was. On paper, it's purchasing. It's logistics. It's margins. But from where I sat, watching him take calls at the dinner table and stare at spreadsheets on Sundays, it looked like navigation.

  We tend to think of a career like this as a climb. You start at the bottom, and you go up. But anyone in this room who has worked in manufacturing knows that sometimes, the job is actually about managing a descent. The market exerts a pressure. It asks for better, faster, cheaper. And that request isn't malicious. It's just gravity.

  If you say no to gravity once, you're a hero. If you say no to gravity for thirty-one years, you're out of business.

  So the real work, the work my father did, wasn't about stopping the slide. It was about controlling the speed. It was about looking at the slope and deciding: How fast do we go? Which corners can we cut without the chair collapsing? And crucially—who do we refuse to leave behind on the way down?

  There were moments, I know, where the math demanded a move that felt wrong. I remember one conversation with him recently. We were arguing about a supplier. He had held out against them for fifteen years, and finally, he signed the contract. I was angry. I told him it was a surrender. I told him that if everyone made that choice, the whole floor would drop out from under the industry.

  He listened. And then he told me that the floor was already dropping. The only choice he had left was whether to jump or to lower himself down carefully, with his hands on the rope, making sure the people below him had time to move.

  That distinction changed everything for me. Because it means he wasn't a passenger in this story. He wasn't a victim of "the way things are." He was a pilot.

  Every time he signed off on a cheaper component, it wasn't because he stopped caring about quality. It was because he calculated that staying in the game was the only way to keep protecting the quality that remained. Each decision, taken alone, was correct. It kept the lights on. It kept people employed. It kept the company standing. And yes, the sequence of those correct decisions changed the landscape. It lowered the water line. But he didn't let it swamp the boat.

  To the factory owners and buyers here: You know this tension. You know that the "right" business decision on a Tuesday can feel like a compromise by Friday. You know that integrity in this field isn't about having clean hands; it's about knowing which stains you can wash off and which ones you have to carry. My father carried them. He absorbed the friction of thirty-one years of market forces so that the people working for him didn't have to feel the full heat of it.

  And to my mother, who is sitting right there.

  For a long time, I worried that the system had beaten you both. That the pressure of his job was just a weather pattern you had to endure, rain that fell on the house whether you liked it or not. But I realize now that's not true. You didn't just endure what happened to us. You underwrote the choices he made.

  When he chose to fight a battle, you held the line at home. When he chose to yield, you helped him bear the weight of that yield. You made sure that the cost of his decisions didn't bankrupt us emotionally, even when the margins got thin. You were the ballast. He navigated the race, but you decided what we were carrying in the hold. You made sure we didn't drop the important things just to move faster.

  So, when I look at my father's career, I don't see a list of compromises. I see a record of steering. I see a man who understood that he couldn't stop the current, but he could damn well steer the ship. He chose which races to enter. He chose how fast to descend. And he chose, over and over again, to make sure that when he arrived at the finish line, he hadn't left his friends, his vendors, or his family behind in the dust.

  Dad, you spent thirty-one years finding the cheapest acceptable place to buy the world. Tonight, we just want to remind you that you don't have to negotiate the price of anything ever again. The bill is handled. The quality is acceptable. And we are all very happy with the supplier.

  Please raise your glasses. To my father. To thirty-one years of keeping the chair upright. And to the next chapter, where the only thing you have to purchase is time.

  To Dad.
