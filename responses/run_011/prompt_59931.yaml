          *   Address *reflexivity*: The actors *believed* it was settled, and that belief helped make it settled. Does this fit the Aristotelian/Ockhamist framework, or is it a different phenomenon (self-fulfilling prophecy vs. metaphysical fatalism)?
          *   **Reverse Direction/Critique:** What does this lens reveal that standard diplomatic history (miscalculation, entrapment, cult of the offensive) misses? Where does it misdescribe? Is it just relabeling "irreversibility" as "fatalism"?
      *   **Tone/Constraint:** Do not dismiss the analogy as a stretch. Take it seriously. Be honest if the lens is just relabeling.

  2.  **Historical Reconstruction (The July Crisis):**

      *   *June 28:* Assassination of Franz Ferdinand.
