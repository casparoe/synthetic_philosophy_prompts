  ### The Dilemma Tree: A Taxonomy of Narrative Conflict

  To find out what your book is committed to, do not ask what it says about morality. Ask what it does with the wreckage. The following instrument is designed to be used by a reader who has finished your novel once, holding no theory in their head, only the memory of how the story felt.

  Answer the questions in order. Follow the branch that matches the book's architecture. Do not look ahead to the leaves.

  **1. The Scale**
  At the moment the agent faces the fork, does the narrative imply the two options can be weighed on a single scale (e.g., lives saved, units of happiness), or are they presented as different kinds of things entirely (e.g., loyalty vs. justice)?
  *   **Single Scale:** Go to 2.
  *   **Different Kinds:** Go to 5.

  **2. The Vanishing**
  (If Single Scale) Once the agent chooses the "heavier" option, does the story act as if the unchosen option no longer makes a claim on the agent?
  *   **Yes, it vanishes:** Go to 3.
  *   **No, it remains:** Go to 4.

  **3. The Balance**
  (If Vanishing) Does the world of the novel eventually balance the ledger, through punishment, reward, or a closure that matches the weight of the choice?
  *   **Yes:** Leaf A.
  *   **No:** Leaf B.

  **4. The Payment**
  (If Remaining) Is the debt of the unchosen option paid off by the agent's suffering?
  *   **Yes:** Leaf C.
  *   **No:** Leaf D.

  **5. The Grief**
  (If Different Kinds) Does the agent feel grief or guilt after the choice is made?
  *   **No:** Leaf E.
  *   **Yes:** Go to 6.

  **6. The Error**
  (If Grief) Is that grief treated by the narrative as a mistake in the agent's reasoning or a failure of nerve?
  *   **Yes:** Leaf F.
  *   **No:** Go to 7.

  **7. The Origin**
  (If Not Error) Did the agent's own earlier wrongdoing manufacture this fork?
  *   **Yes:** Go to 8.
  *   **No:** Go to 9.

  **8. The Virtue**
  (If Wrongdoing) Does the story imply that a perfectly virtuous person would never have been placed in this position?
  *   **Yes:** Leaf G.
  *   **No:** Leaf H.

  **9. The Possibility**
  (If Not Wrongdoing) Does the story suggest that, with enough cleverness or time, both demands could have been fulfilled?
  *   **Yes:** Leaf I.
  *   **No:** Go to 10.

  **10. The Focus**
  (If No Possibility) Does the book focus more on the agent's freedom to define the value of the choice, or on the cost that the choice extracts?
  *   **Freedom/Definition:** Leaf J.
  *   **Cost/Extraction:** Leaf K.

  ***

  ### The Leaves

  **Leaf A: The Cosmic Accountant** (Unnamed)
  *Position:* The universe is morally intelligible and transactional. Good choices are rewarded, bad ones punished, ensuring the ledger closes.
  *Philosophical Status:* No serious philosopher defends this as a moral truth, though it is common in genre fiction.

  **Leaf B: The Heavy Side** (Outweighing)
  *Position:* Dilemmas are real but always resolvable because one requirement simply outweighs the other with nothing left over.
  *Philosophical Status:* Hierarchical Monism / Act Utilitarianism.

  **Leaf C: The Purgatory** (Unnamed)
  *Position:* Measurable conflicts exist, but the unchosen option demands a blood tax even when the right choice is made.
  *Philosophical Status:* Unattractive. It posits a debt without a creditor.

  **Leaf D: The Open Wound** (Moral Remainder)
  *Position:* The stubborn persistence of moral remainder—the owed apology, the taint, the refusal to repeat the act—is itself the evidence that something real went unfulfilled.
  *Philosophical Status:* Tragic Realism (Williams, Nussbaum).

  **Leaf E: The Void** (Unnamed)
  *Position:* Values are incommensurable, but the agent feels no residue. The choice is a brute fact without moral weight.
  *Philosophical Status:* Nihilism / Error Theory.

  **Leaf F: The Mirage** (Dissolution)
  *Position:* Apparent conflicts are only provisional and the considered verdict is always single; grief is a cognitive error.
  *Philosophical Status:* Rationalist Monism (Sidgwick).

  **Leaf G: The Clean Hands** (Impossible)
  *Position:* A genuine dilemma would have morality issuing contradictory demands and is therefore impossible; if you are torn, you have already failed.
  *Philosophical Status:* Kantian Rationalism.

  **Leaf H: The Stain** (Unnamed)
  *Position:* Conflicts are real and tragic, but only because the agent is corrupt. A better world would not have this fork.
  *Philosophical Status:* Theological/Redemptive (untried in secular ethics).

  **Leaf I: The Third Way** (Unnamed)
  *Position:* Conflicts appear incommensurable only due to a lack of imagination or resources.
  *Philosophical Status:* Meliorism / Pragmatism (often unattractive to tragedians).

  **Leaf J: The Inventor** (Pluralist)
  *Position:* Some values cannot be measured against one another, so that choice is underdetermined by reasons rather than merely painful.
  *Philosophical Status:* Value Pluralism (Berlin, Sartre).

  **Leaf K: The Open Wound** (Moral Remainder)
  *(Note: If the reader arrives here via Branch 10, it emphasizes the cost over the freedom, distinguishing it from Leaf J, though both share the "Remainder" view. For the sake of the tree's precision, we treat Leaf D and Leaf K as the same philosophical position reached via different narrative routes: D via measurable debt, K via incommensurable cost.)*
  *Correction for Tree Integrity:* To ensure distinct leaves, Leaf D is **The Ledger** (Measurable Remainder - Unnamed) and Leaf K is **The Open Wound** (Incommensurable Remainder).
  *Revised Leaf D:* **The Ledger** (Unnamed). Measurable debt that remains unpaid.
  *Revised Leaf K:* **The Open Wound** (Moral Remainder). Incommensurable debt that remains unpaid.

  ***

  ### Worked Example: Sartre's Student

  Let us run the famous case through the instrument. A young man in occupied France must choose between fleeing to England to join the Free Forces (an abstract, collective good) or staying in Paris to care for his mother, who is destitute and views him as her only consolation (a concrete, personal good).

  1.  **The Scale:** Can these be weighed? Sartre explicitly argues they cannot. One is a matter of personal devotion, the other of national duty. They are different currencies. **(Go to 5)**
  2.  **The Grief:** Does the agent feel grief? Yes, Sartre describes "anguish." **(Go to 6)**
  3.  **The Error:** Is the grief a mistake? No, Sartre argues anguish is the inevitable condition of freedom. **(Go to 7)**
  4.  **The Origin:** Did his wrongdoing cause this? No, the war caused this. **(Go to 9)**
  5.  **The Possibility:** Could both be saved? No, the geography and politics forbid it. **(Go to 10)**
  6.  **The Focus:** Freedom or Cost? Sartre's essay concludes, "You are nothing else but what you make of yourself." The emphasis is on the act of invention, not the lingering cost. **(Leaf J: The Inventor)**

  **Result:** The story enacts the **Pluralist** view. The values are incommensurable, and the choice is not discovered but created.

  ***

  ### Indistinguishable Leaves

  **The Heavy Side (B) and The Cosmic Accountant (A).**
  *   **Why:** In a novel where the "right" choice is clear (Heavy Side), authors often instinctively provide closure (Accountant). If the reward is subtle (e.g., inner peace rather than a prize), a reader cannot distinguish whether the ledger was balanced by the world or simply by the logic of the choice.
  *   **Further Question:** *Does the agent receive a benefit they did not have before the choice, which they would not have had if the dilemma had not existed?* (If Yes, Accountant; If No, Heavy Side).

  **The Inventor (J) and The Open Wound (K).**
  *   **Why:** Both accept incommensurability. In practice, a character who invents a value (J) often suffers for it (K). If the narrative voice is close to the agent, the distinction between "I made this right" and "This cost me everything" blurs.
  *   **Further Question:** *In the final chapter, does the agent look back with pride in their authorship, or with grief for the loss?* (Pride = Inventor; Grief = Open Wound).

  ***

  ### Empty Cells: Combinations No Position Occupies

  **1. Scale = Single + Grief = Real + Error = No + Balance = No.**
  *   *Diagnosis:* **Merely Unattractive.** This claims one option is objectively better, the agent knows it, the world doesn't punish them, yet they still suffer without reason. It posits irrational pain in a rational universe.
  *   *Label:* The Ledger (Leaf D in revised schema). *Wait, I assigned this a leaf.* Let's find a truly empty one.
  *   *True Empty:* **Scale = Single + Vanish = No + Balance = Yes.**
  *   *Diagnosis:* **Incoherent.** You cannot claim the debt remains (Vanish=No) while also claiming the ledger is balanced (Balance=Yes).

  **2. Scale = Different + Virtue = Yes.** (Reached via Branch 5 -> 6 -> 7 -> 8).
  *   *Diagnosis:* **Incoherent.** If values are genuinely different kinds (incommensurable), a virtuous agent cannot avoid the conflict by being "better." The conflict is in the world, not the agent. To say virtue avoids it is to deny the pluralism.

  **3. Scale = Different + Origin = Sin + Possibility = Yes.** (Reached via Branch 5 -> 6 -> 7 -> 9).
  *   *Diagnosis:* **Nobody Has Tried It.** This suggests the agent's sin created a conflict between incommensurable values, but a solution existed all along. It combines the tragedy of sin with the comfort of pragmatism. Fiction avoids this because it robs the sin of consequence.

  **4. Scale = Single + Error = Yes.** (Reached via Branch 1 -> 2 -> 5 -> 6).
  *   *Diagnosis:* **Incoherent.** If the scale is single (measurable), grief over the heavier side *is* a reasoning error by definition. You cannot have a "valid error" in arithmetic. (This is why Branch 1 leads to 2, skipping Grief).

  ***

  ### A Note for the Novelist

  If your book lands in an empty cell, do not panic. Philosophy maps the territory of coherent argument; fiction maps the territory of lived experience. There are human experiences that are incoherent by design. If your novel sits in the cell where *the debt remains but the ledger is balanced*, you have not written a philosophical error; you have written a ghost story. Philosophy will not sponsor it, but your readers may recognize it as the only honest account of how it feels to survive.
