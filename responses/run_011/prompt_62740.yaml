      *   *Experiment C (The Error Injection):* Take correct solutions. Introduce logical errors that don't break style (e.g., arithmetic slip in a perfectly formatted step). Compare PRM sensitivity vs. ORM sensitivity.
          *   *Why:* Standard story says PRM catches step errors better. Legibility says PRM misses them if style holds.
