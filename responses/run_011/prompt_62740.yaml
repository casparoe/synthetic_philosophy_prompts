prompt: |-
  You're an expert on reward design and evaluation for AI systems — someone who has actually built and compared process reward models against outcome reward models, not just read the blog posts — and you also know enough philosophy of science to talk about underdetermination and mechanism claims without embarrassing yourself. Think carefully. Before you answer, spend some effort brainstorming what kind of evidence would even be *capable* of bearing on the view below, since part of my worry is that I've stated it in a way that nothing could touch.

  Here's the view. I've become conviced that the standard story about why process-based supervision beats outcome-based supervision on stuff like math reasoning is mostly wrong. The standard story goes: process signals give denser, better-localised credit assignment, so learning is more sample-efficient and the model is less able to hack the final answer. My view is that the real mechanism is different — call it the legibility prior hypothesis. Process labels don't reward correct reasoning, they reward reasoning in the *form humans can follow*: named methods, tidy ordered steps, no big inferential leaps, no weird notation. So a process reward model is largely scoring stylistic conformity to a human template of what a solution looks like, and the reason it wins is that in the narrow domains where anyone has bothered to collect step-level labels, that template happens to be strongly correlated with correct-and-checkable solutions. The predictions I'm attached to: the advantage should shrink as base models get stronger and their own solution strategies drift away from textbook human ones; it should be near-absent in domains where correctness is cheaply verifiable but there's no canonical human derivation style to conform to; and most of what people credit to dense rewards should be reproducible by an outcome-only signal plus a data-curation filter that throws out stylistically wierd-but-correct solutions.

  What would count against this? I want the observations, experimental setups, and arguments that should actually move me, ranked from fatal to merely awkward. Be concrete about the experiments — what comparison, what controls, what pattern of results would point at genuine credit assignment rather than legibility — and don't just list generic possibilities, tell me which ones are cheap enough that somebody should have run them already and which would be enormously hard. Also: which of these would a committed defender of my hypothesis concede as counting against them, and which would they explain away, and by the time you've added all the escape hatches a smart defender would want (something like 'the templates correlate with truth, that's the whole point'), has the view been hedged into unfalsifiability? If it has, is that a real problem for a claim of this kind or just normal for a mechanism hypothesis about a messy empirical phenomenon? Flag anything in how I've stated it that's confused or that smuggles in an assumption I haven't noticed — including whether 'process supervision' and 'legibility' are even separable in the way I'm assuming.

  No bibliography and no citations please, I'm not after references, just the reasoning. Lead with your bottom line in the first sentence — is this view badly exposed or well insulated, and what's the single thing most likely to kill it — then give the reasoning underneath. No preamble, and don't restate my question back to me.
