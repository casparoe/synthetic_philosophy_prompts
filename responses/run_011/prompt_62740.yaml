      *   *Experiment B (The Obfuscation Test):* Take correct solutions. Rewrite them to be logically identical but stylistically alien (e.g., variable renaming, step reordering, removing natural language). Train PRM on standard data. Evaluate PRM scores on obfuscated vs. standard.
