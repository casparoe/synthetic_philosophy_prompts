          *   *Prediction (Standard Story):* PRM rewards them (high reward, because steps are logically valid).
          *   *Feasibility:* Medium. Need to generate weird but correct proofs.
      *   *Idea 2: Incorrect but Legible Solutions.* Generate solutions that look perfect (named theorems, clear steps) but contain a subtle logical error.
          *   *Prediction (Hypothesis):* PRM gives high reward (fooled by style).
          *   *Prediction (Standard Story):* PRM gives low reward (detects error in step).
          *   *Feasibility:* Hard. Need to ensure the error is subtle enough for PRM to miss but existent.
      *   *Idea 3: ORM + Style Filter.* Train an ORM. Filter training data to only include "legible" solutions. Compare to PRM.
          *   *Prediction (Hypothesis):* Performance matches PRM.
          *   *Prediction (Standard Story):* PRM still wins (due to step-level guidance).
          *   *Feasibility:* Cheap/Easy.
      *   *Idea 4: Non-Human Optimal Strategies.* Domains where the optimal strategy is unintuitive to humans (e.g., certain combinatorial optimizations, code golf, specific game strategies).
          *   *Prediction (Hypothesis):* PRM hinders performance compared to ORM.
          *   *Prediction (Standard Story):* PRM still helps (credit assignment works regardless of human intuition).
          *   *Feasibility:* Medium/Hard (need domain).
      *   *Idea 5: Cross-Style Generalization.* Train PRM on Style A (e.g., verbose textbook). Test on Style B (e.g., concise formal proof).
          *   *Prediction (Hypothesis):* Performance drops significantly.
          *   *Prediction (Standard Story):* Performance holds (logic is logic).
          *   *Feasibility:* Medium.
      *   *Idea 6: Step-Level Perturbation.* Take a correct solution. Swap two valid independent steps. Logic still holds, order changes.
          *   *Prediction (Hypothesis):* PRM reward drops (violates template order).
          *   *Prediction (Standard Story):* PRM reward stays high (logic valid).
          *   *Feasibility:* Cheap.

  4.  **Evaluating Falsifiability & Defensibility:**
      *   *Risk:* The defender can always say "Legible steps *are* the correct steps in this domain." Or "The PRM learned logic, not just style, because style correlates with logic."
      *   *Unfalsifiability Check:* If every time PRM works, the defender says "See, style correlates with truth," and every time PRM fails, they say "See, style diverged from truth," the hypothesis becomes tautological *unless* we can independently measure "style" vs. "logic."
