          *   **Constraint:** No preamble, don't restate the question.

  2.  **Deconstruct the Hypothesis:**
      *   *Claim:* PRM advantage $\neq$ Credit Assignment. PRM advantage $=$ Legibility/Style Conformity.
      *   *Mechanism:* Humans label steps based on recognizable patterns. Models learn to mimic these patterns. These patterns correlate with truth in current datasets (e.g., school math).
      *   *Implication:* If you decouple style from truth, PRM should fail. If you enforce style on ORM, ORM should match PRM.

  3.  **Brainstorming Evidence/Experiments:**
      *   *Idea 1: Obfuscated Correct Solutions.* Generate correct solutions that look "weird" (non-human style). Train PRM on standard data. Test if PRM penalizes these weird correct solutions.
