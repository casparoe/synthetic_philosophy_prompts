answer: |-
  ### Part I: The Dualism and the Empirical Gap

  **The Dualism of Practical Reason**
  To understand why Sidgwick sat in darkened rooms with mediums, you must first understand the specific architecture of the crisis in *The Methods of Ethics*. Sidgwick dismantles Intuitionism and shows that, when refined, it collapses into Utilitarianism (Universal Benevolence). However, he cannot dismantle Rational Egoism. Both Universal Benevolence (maximize the general good) and Rational Egoism (maximize my own good) present themselves as self-evident, rational axioms.

  The problem arises when they conflict. If sacrificing my happiness creates more universal good, Utilitarianism says I must do it; Egoism says I am irrational if I do. Sidgwick concludes that unless there is a "moral government of the universe"—a system where virtue and happiness are ultimately coincident over the long term—morality is fundamentally irrational. The Dualism is the state of holding two contradictory rational imperatives with no way to choose between them.

  Traditionally, Kant resolved this via postulates: we must *assume* God and Immortality to make sense of morality. Sidgwick, a rigorous empiricist, found this unsatisfactory. He refused to assume what he could not know. If the universe is not morally ordered, then the Utilitarian method is not rationally binding on the Egoist. The Dualism remains a "fundamental contradiction."

  **Mapping Psychical Research onto the Dualism**
  Your supervisor is correct that these are not separate hobbies, but the mapping is more specific than "Sidgwick liked ghosts." The Society for Psychical Research (SPR) was an attempt to move the reconciliation of the Dualism from the realm of *faith* to the realm of *fact*.

  *   **The Hypothesis:** If survival of death can be empirically demonstrated, and if the condition of the surviving consciousness is shown to track moral conduct (reward/punishment or spiritual progression), then the "moral government of the universe" ceases to be a postulate and becomes an observation.
  *   **The Literalness:** The mapping is literal but incomplete. Sidgwick needed two data points: (1) Persistence of consciousness after bodily death, and (2) A moral correlation in that persistence. The SPR could theoretically address (1). It was ill-equipped to address (2).
  *   **Where the Theory Goes Silent:** You asked to be honest where the connection breaks. It breaks here. Proving survival does not prove moral governance. One could survive death in a state of indifference, or worse, in a state where virtue is punished. The Dualism is about the *rationality of duty*, not just the *ontology of the soul*. Even if Mrs. Piper was genuinely channeling the dead, that does not prove that being good pays. Sidgwick knew this. He hoped that evidence of survival would be the "thin end of the wedge" leading to evidence of moral order, but the SPR methodology was structurally incapable of measuring moral desert. It could measure leaks of information, not spiritual justice.

  **Telepathy vs. Survival: The Asymmetry**
  Sidgwick's distinction between telepathy and mediumistic survival is the strongest evidence that he was not engaging in simple wish-fulfillment.
  *   **Telepathy:** By the 1890s, Sidgwick regarded telepathy (e.g., the Census of Hallucinations) as scientifically established. It proved that mind could interact with mind without sensory intermediaries. This undermined strict materialism, which was a prerequisite for his ethical system (if mind is just brain, death is the end, and the Dualism is unresolvable).
  *   **Survival:** He never accepted survival as proven. The evidence from mediums like Mrs. Piper was, to him, consistent with survival but also consistent with "telepathy from the living" or subconscious fabrication.
  *   **Did He Update?** Yes. He updated his metaphysics (materialism is likely false) but not his ethics (the Dualism remains unresolved). This suggests principled application of standards rather than motivated reasoning. If he were merely seeking comfort, he would have accepted the survival evidence as conclusive. Instead, he maintained the evidential bar, even though lowering it would have soothed the philosophical anxiety.

  **The Palladino Incident:** When the Cambridge committee exposed Eusapia Palladino as a fraud in 1895, Sidgwick did not resign. He accepted the fraud finding. This is crucial. If his goal was to *prove* the premise to save his ethics, he should have doubled down on Palladino. Instead, he prioritized the integrity of the method. He believed that clearing away fraud was necessary to make the field safe for genuine phenomena. He was willing to risk the credibility of the SPR (and thus the potential proof of his ethical postulates) to maintain scientific rigor.

  ### Part II: Esoteric Morality and the Nature of the Dualism

  **Esoteric Utilitarianism or Scientific Caution?**
  Sidgwick famously argued in *The Methods* that a Utilitarian might be justified in concealing the truth if publishing it would cause social harm (e.g., undermining the religious beliefs that keep the masses moral). Does his SPR posture fit this?

  *   **The Case for Esotericism:** Sidgwick defended the SPR publicly against ridicule while privately admitting the evidence was inconclusive. One could argue he was protecting the *possibility* of religious truth. If the SPR were dismissed as a circus, the empirical avenue for proving immortality would close, leaving humanity with only dogmatic religion or nihilistic materialism. Both options were socially dangerous in his view. By keeping the SPR respectable, he kept the "hope" of moral order alive without lying about the current data.
  *   **The Case for Caution:** It is more likely this was institutional duty combined with scientific caution. Sidgwick knew that claiming proof prematurely would destroy the SPR's academic standing. He needed the institution to survive long enough to gather better data. His public restraint wasn't about hiding the truth from the masses; it was about preventing the contamination of the data by hype.
  *   **Verdict:** It is not classic esoteric morality (lying for utility). It is "methodological esotericism." He withheld *judgment*, not *truth*. He refused to let the public (or the philosophical community) treat the question as settled in the negative, because the cost of a false negative (abandoning the search for moral order) was too high.

  **What the SPR Episode Says About the Dualism**
  The SPR career transforms the Dualism from a technical puzzle into a religious worry wearing the costume of logic.
  *   **The Religious Worry:** A purely technical philosopher would have accepted the Dualism as a limit of reason and moved on (as Sidgwick nearly did in his conclusion). The fact that Sidgwick spent 18 years investigating mediums suggests he could not tolerate the idea that the universe is morally chaotic. He needed the reconciliation to be real, not just logically possible. The SPR was the engine he built to find the reconciliation.
  *   **The Evidence Hostage:** However, the episode also shows he refused to let the ethical conclusion dictate the empirical finding. He held the ethical conclusion hostage to evidence. He did not say, "I need immortality, therefore it exists." He said, "I need immortality, therefore I will spend my life looking for it, and if I don't find it, I will die with the contradiction unresolved."
  *   **The Result:** This makes the Dualism a live, unresolved wound rather than a rhetorical flourish. The SPR work proves he took the Dualism seriously enough to bet his reputation on its resolution, but honestly enough to admit failure when the data didn't arrive.

  **The Evidential Rule and the Failure to Convert**
  Sidgwick's rule—exhaust every normal explanation before admitting an abnormal one—was the correct rule for science, but the wrong rule for conversion.
  *   **Why it was the right rule:** In an environment rife with fraud (like Victorian spiritualism), parsimony is the only defense against delusion. Sidgwick's goal was *certainty*, not *belief*. He wanted a proof that would stand up to the harshest skepticism.
  *   **Why it converted no one:** This rule creates a high barrier to entry. It ensures that you will rarely, if ever, conclude "paranormal." It privileges the status quo (materialism) by design. To convert a skeptic, you need positive evidence; Sidgwick's method only produced negative evidence (i.e., "this wasn't fraud," rather than "this is definitely a ghost").
  *   **The Founder's Dilemma:** This explains why the SPR converted almost nobody, including Sidgwick. The method was designed to filter out error, not to generate belief. Sidgwick accepted this. He would rather have no answer than a false one. This aligns with his ethical view that error is a greater evil than ignorance.

  ### Conclusion

  The SPR episode is not a sidebar to Sidgwick's philosophy; it is the empirical testing ground for its most vulnerable premise. The mapping is literal: he sought physical evidence for the metaphysical conditions required to resolve the Dualism of Practical Reason. However, the theory goes silent on the moral quality of the afterlife; proving survival does not prove moral governance, so the SPR could never fully close the gap Sidgwick identified.

  His conduct suggests the Dualism was a profound existential anxiety, not merely a logical puzzle. He was motivated to inquire by his ethical needs, but he did not allow those needs to corrupt his evidential standards. He practiced a form of institutional stewardship that resembled esoteric morality only in its protection of the *question*, not the *answer*. Ultimately, the SPR career demonstrates that Sidgwick was willing to live with the "fundamental contradiction" of ethics rather than resolve it through deception or credulity. The effort was not wasted, even if the proof was not found, because it preserved the integrity of the demand: that morality must be rational, and that rationality must be grounded in reality.
