prompt: |-
  I'm working on a chapter about Henry Sidgwick and I keep running into the fact that he's basically two different people in the literature — the guy who wrote The Methods of Ethics in 1874 and turned utilitarianism into a respectable academic discipline, and the guy who co-founded the Society for Psychical Research in 1882 with Frederic Myers, Edmund Gurney, Arthur Balfour and Lord Rayleigh and served as its president until he died in 1900. My supervisor insists these aren't two separate hobbies, that the psychical research was doing philosophical work inside the ethics, and told me to prove it or prove her wrong. So here are the facts I'll assume, so you don't have to hedge on them: Sidgwick and his wife Eleanor were investigating mediums from the early 1870s; the SPR took up telepathy, apparitions and mediumship; the big public case was Mrs. Piper, whom Richard Hodgson studied from the mid-1880s onward; there was a large statistical census of coincidences between apparitions and deaths; and in 1895 a Cambridge committee sat with the Italian physical medium Eusapia Palladino and concluded, more or less, that what they'd seen was trickery — after which a good chunk of the society's credibility went up in smoke and Sidgwick nonetheless carried on running it. There's also a story that he said on his deathbed that the effort of a lifetime had been wasted. I don't know whether that's reliable, so please don't build anything on it.

  What I want is the analysis of the SPR episode through the dualism of practical reason. Set up the dualism properly first — the collision between rational egoism and universal benevolence, and Sidgwick's thought that the collision is only genuinely resolved if the universe is somehow morally governed so that doing your duty and being happy line up over the long run, which is a premise he couldn't establish and didn't want to just assume. Then map the psychical research onto that gap and tell me how literal the mapping is. Was survival evidence supposed to be the empirical instrument for closing the dualism — i.e., if the dead persist and their condition tracks their conduct, the moral order stops being a postulate and becomes an observation? If so, what was the hypothesis, what would have counted as confirming it, what were the actual results, and did Sidgwick in fact update? I'm especially interested in the asymmetry where telepathy seemed to him established but mediumistic survival-talk never did — is that a principled application of his own standards, or motivated reasoning in a man who'd staked his ethics on the outcome? And be honest about where the theory goes silent: the dualism is about the structure of reasons, and I'm not sure it has anything at all to say about seances. If that's right, say so rather than forcing a connection.

  Second pass, running the other direction. Sidgwick also held that a utilitarian can be justified in not publishing everything he believes — that some conclusions are for the few, and that candor isn't always the morally best policy. His public posture on the SPR looks like a possible case: he never endorsed spiritualism, he defended the society against ridicule, he was scrupulous about what the reports claimed, and privately he seems to have thought telepathy real while treating survival as unproven. Is that esoteric morality actually being practiced, or is it just ordinary scientific caution about weak evidence plus a professional's sense of institutional duty? Then: what does the whole episode do to the dualism itself? Does the SPR career suggest the dualism was never really a technical puzzle about two equally rational methods, but a religious worry wearing the costume of one — that Sidgwick needed the universe to be morally ordered badly enough to spend eighteen years sitting in dark rooms with a professional cheat? Or does the episode cut the other way, showing that he held the ethical conclusion hostage to evidence and then refused to let it go when the evidence failed, which would make the dualism more like a live unresolved problem than a rhetorical flourish? Also tell me whether his evidential rule — exhaust every normal explanation before admitting an abnormal one — was the right rule for this kind of inquiry, and whether it explains why the SPR converted almost nobody, including its own founder. No references or reading list needed, I have the books — I want the argument and the places where it doesn't hold.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**

      *   **Subject:** Henry Sidgwick, specifically the relationship between his ethical philosophy (*The Methods of Ethics*) and his involvement in psychical research (SPR).
      *   **Core Task:** Analyze the SPR episode through the lens of the "Dualism of Practical Reason."
      *   **Specific Constraints:**
          *   Assume provided facts (SPR founding, Piper, Palladino, census, Sidgwick's role, deathbed story reliability uncertain).
          *   No references/reading list needed.
          *   Focus on argument and where it breaks down.
          *   Be honest if the theory goes silent (don't force a connection).
      *   **Key Questions to Answer:**
          1.  Set up the Dualism of Practical Reason (Rational Egoism vs. Universal Benevolence/Utilitarianism).
          2.  Map psychical research onto the gap in the Dualism (Is survival evidence the empirical instrument to close it?).
          3.  Evaluate the hypothesis, confirmation criteria, results, and Sidgwick's updating (Telepathy vs. Survival).
          4.  Assess the "Esoteric Morality" angle (Public posture vs. private belief).
          5.  Determine what the SPR career says about the Dualism itself (Religious worry in disguise vs. commitment to evidence).
          6.  Evaluate the evidential rule (exhaust normal explanations) and its impact on conversion/credibility.

  2.  **Part 1: The Dualism of Practical Reason & The SPR Mapping:**

      *   *The Dualism:* Sidgwick finds Intuitionism leads to Utilitarianism (Universal Good), but Rational Egoism (Own Good) is equally rational. They conflict. He needs a reconciliation. The reconciliation requires a moral government of the universe (God + Immortality) where virtue and happiness coincide in the long run. Without this, ethics is fundamentally contradictory.
      *   *The Mapping:* Does SPR fill this gap?
          *   *Hypothesis:* If survival of death is proven, and if the condition of the survived self correlates with moral conduct, then the "moral government" is empirically verified. The Dualism is resolved not by faith/postulate but by fact.
          *   *Literalness:* It's a very literal mapping. Sidgwick isn't looking for comfort; he's looking for *data* to support a necessary premise of his ethical system.
          *   *Telepathy vs. Survival:* Sidgwick accepted telepathy (Phantasms of the Living) as scientifically established (Census of Hallucinations). But telepathy doesn't solve the Dualism. It only proves mind-mind interaction. Survival (life after death) is needed for the *sanction* of morality (reward/punishment/harmony).
          *   *Did he update?* He remained agnostic on survival. He thought the evidence was *suggestive* but not conclusive. The Palladino fraud was a blow, but he maintained the *method* of inquiry was valid even if specific cases were fraud.
          *   *Motivated Reasoning?* It's a mix. He applied strict evidential standards (hence rejecting survival as proven), but his *motivation* to keep looking was driven by the ethical need. This isn't necessarily "motivated reasoning" in the sense of faking results, but "motivated inquiry." He didn't lower the bar for evidence, he just refused to stop looking when others did.
          *   *Where the theory goes silent:* The Dualism is about *reasons for action*. Psychical research is about *facts of nature*. Even if survival is proven, does it prove *moral* governance? Not necessarily. You could survive and be miserable regardless of virtue. So SPR evidence alone doesn't close the Dualism; it only opens the door. Sidgwick knew this. He needed evidence of *moral* order, not just *ontological* persistence. This is a crucial gap.

  3.  **Part 2: Esoteric Morality & Institutional Duty:**

      *   *Esoteric Utilitarianism:* Sidgwick argued that if the truth causes harm (e.g., undermining social order/religion), the utilitarian should keep it secret.
      *   *SPR Public Posture:* He defended the SPR against ridicule but didn't claim spiritualism was true. He emphasized scientific rigor.
      *   *Analysis:* Is this esotericism?
          *   *Argument for Yes:* He believed telepathy was real but knew the public would conflate it with crank spiritualism. Protecting the *possibility* of religious truth (which supports morality) might require protecting the institution that investigates it, even if results are negative.
          *   *Argument for No:* It looks more like scientific caution. He was trying to legitimize a fringe field. Admitting belief without proof would kill the SPR's academic credibility.
          *   *Verdict:* It's likely institutional duty mixed with a belief that the *question* is more important than the current *answer*. If the SPR collapses, the possibility of empirical proof for religion collapses, which hurts the "moral government" hypothesis. So, defending the SPR is defending the *potential* resolution of the Dualism.
      *   *Impact on the Dualism:*
          *   *Religious Worry?* Yes, it suggests the Dualism wasn't just a logic puzzle. It was an existential threat to the rationality of morality. If the universe isn't morally ordered, being moral is irrational for the egoist. Sidgwick needed it to be true.
          *   *Evidence Hostage?* He held the ethical conclusion hostage to evidence. He didn't assert God/Immortality dogmatically. He said, "I can't be a utilitarian unless X is true. Is X true? Let's check." When X remained unproven, he remained in the "fundamental contradiction." This makes the Dualism a live, painful problem, not a rhetorical flourish.
      *   *Evidential Rule:* "Exhaust normal explanations."
          *   *Validity:* It's the standard scientific method (parsimony).
          *   *Impact on Conversion:* It makes positive results nearly impossible. If you rule out fraud/error first, you rarely get to "paranormal." This explains why the SPR converted almost no one. It was designed to be a filter, not a converter. Sidgwick accepted this. He wanted *certainty*, not *belief*.

  4.  **Synthesizing and Refining the Argument:**

      *   *Tone:* Academic, critical, direct. No hedging.
      *   *Structure:*
          1.  The Dualism Setup (The Problem).
          2.  The SPR as Empirical Solution (The Mapping & Its Limits).
          3.  Telepathy vs. Survival (The Evidential Gap).
          4.  Esotericism vs. Caution (The Public Face).
          5.  The Verdict on Sidgwick (Religious Need vs. Scientific Integrity).
      *   *Critical Check:* Did I address the "theory goes silent" instruction? Yes, need to emphasize that survival $\neq$ moral governance.
      *   *Critical Check:* Did I address the deathbed story? Acknowledge it but don't build on it as requested.
      *   *Critical Check:* Did I address the Palladino incident? Yes, as a test of his commitment to method over result.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Dualism:* Make sure to distinguish Rational Egoism (my good) vs. Utilitarianism (universal good). The reconciliation requires the "Kantian Postulates" (God/Immortality) but Sidgwick wants them empirically grounded.
      *   *SPR Role:* It's not just "ghosts." It's "Can we empirically verify the postulates?"
      *   *The Gap:* Even if I survive, am I rewarded? Sidgwick knew SPR couldn't easily prove the *moral* quality of the afterlife, only the *fact* of it. This is a weak link in the mapping.
      *   *Telepathy:* Proves mind is not brain-bound. Necessary condition for survival, not sufficient. Sidgwick accepted this. Shows he wasn't just credulous.
      *   *Esotericism:* He wasn't hiding the truth; he was hiding the *lack* of truth to keep the inquiry alive. That's a subtle distinction.
      *   *Conclusion:* The SPR work shows the Dualism was a wound, not a puzzle. But his refusal to fake the cure shows his integrity.

  6.  **Final Polish:** Check against constraints. (No references, assume facts provided, honest about limitations). Ensure the distinction between "motivated inquiry" and "motivated reasoning" is clear. Ensure the "theory goes silent" point is sharp.

      *(Self-Correction during drafting)*: I need to be careful not to say Sidgwick *thought* SPR would definitely solve it. He thought it was the *only possible way* to solve it empirically. Also, clarify that the "Dualism" is about the *rationality* of morality, not just the happiness. If Egoism is rational and Utilitarianism is rational, and they conflict, morality is irrational unless they coincide.

      *(Refining the Esotericism point)*: Sidgwick's esotericism is usually about telling lies to the masses for social utility. Here, it's about not declaring the field dead despite fraud. Is that the same? It's closer to "noble lie" territory—maintaining the *hope* of moral order because the *despair* of moral order is socially destructive.

      *(Refining the Evidential Rule)*: The rule explains why the SPR was credible but ineffective. It prioritized avoiding false positives over finding true positives. Sidgwick preferred a false negative (missing a real ghost) to a false positive (accepting a trick). This aligns with his ethical rigor.

