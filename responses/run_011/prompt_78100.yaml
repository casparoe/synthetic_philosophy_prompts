answer: |-
  ### Part 1: Heterophenomenology in Plain English

  **The Concept:**
  Heterophenomenology (coined by Daniel Dennett) is a method of treating a subject's first-person report not as a window into their soul, but as a *text* to be interpreted. You do not assume they are lying, but you also do not assume they are infallible authorities on their own brain states. You treat their speech as data—something they *produced*—and ask what physical, social, or cognitive causes could explain why that specific text was produced.

  **The Commitment:**
  You commit to reporting *that* the experience was reported, and *how* it was described, without validating the metaphysical reality of the experience itself. You shift from "He saw God" to "He produced a narrative consistent with seeing God."

  **The Journalistic Cost:**
  1.  **Distance:** It kills the visceral immediacy of your leads. You cannot use a quote as proof of a feeling, only as proof of a statement.
  2.  **Complexity:** You must explain *why* the report might differ from the reality (memory errors, expectation, language limits) without sounding like you're calling the subject a liar.
  3.  **Frustration:** True believers (in AI, meditation, or patient advocacy) will feel you are withholding validation. Skeptics will feel you are giving them too much space.

  ---

  ### Part 2: The Consciousness Pitch Triage Procedure

  **Time Limit:** 40 Minutes
  **Goal:** Determine if the pitch is a story about *consciousness* (ontological claim) or *reports of consciousness* (phenomenological data).

  **Step 1: The Source Check (5 Minutes)**
  *   **Question:** Is the primary evidence a first-person report (text, speech, survey)?
  *   **Sufficient Answer:** Yes. (If No, it's a standard neuro/tech story; proceed normally).
  *   **Follow-up:** Is there independent, third-person data (code, fMRI, behavioral logs) that correlates 1:1 with the report?
  *   **Decision Point:**
      *   *Yes:* Proceed to Step 2.
      *   *No:* Proceed to Step 3.

  **Step 2: The Correlation Check (10 Minutes)**
  *   **Question:** Does the third-party data *require* the subjective report to be true, or does it only show the subject *attempted* the task?
      *   *Example:* fMRI shows motor cortex activation (attempt), not "will" (truth).
  *   **Sufficient Answer:** The data shows the mechanism of the report, not the truth of the content.
  *   **Decision Point:** If the pitch claims the data proves the *content* (e.g., "Scan proves he felt pain"), **Reframe**. The story is about the measurement tool, not the feeling.

  **Step 3: The Incentive & Protocol Check (15 Minutes)**
  *   **Question:** What does the subject gain by making this report? (Funding, status, doctrinal validation, relief from boredom).
  *   **Question:** Is this a single anecdote or a pre-registered protocol with N > 20?
  *   **Sufficient Answer:**
      *   *Single Articulate Person:* High risk of narrative shaping. Requires heavy framing as "case study."
      *   *Pre-registered Protocol:* Lower risk. Can treat as aggregate data.
      *   *No Response/Press Release Only:* **Drop** unless the claim is absurd enough to be a story about hype (e.g., AI sentience).
  *   **Decision Point:** If Single Person + High Incentive + No Third-Party Data = **Drop** or **Reframe as Profile** (story about the person, not the phenomenon).

  **Step 4: The "So What?" Value Check (10 Minutes)**
  *   **Question:** If we bracket the truth of the experience (assume it might be confabulation), does the story still matter?
  *   **Human Judgment Call:**
      *   *Medical/Ethical:* If the subject is a patient (locked-in), dignity requires we treat the report as *functional truth* even if unproven. (Values > Facts).
      *   *Cultural/Religious:* If the subject is a meditator, the *value* of the belief is the story, not the neuroscience. (Values > Facts).
      *   *Commercial:* If the subject is a startup, skepticism is the default. (Facts > Values).

  **Output:**
  *   **Green Light:** Third-party data exists OR the story is about the *impact* of the report.
  *   **Yellow Light:** Single subject, low incentive. Frame as "Anecdote," not "Discovery."
  *   **Red Light:** Single subject, high incentive, no data, claim relies on ontology. **Drop.**

  ---

  ### Part 3: Procedure Applied to Your Three Cases

  #### Case 1: The AI Startup (Self-Describing Model)
  *   **Step 1 (Source):** Report is text output. Third-party data? **No** (won't show evals).
  *   **Step 3 (Incentive):** High (Investment/Hype). Protocol? **Proprietary/Secret.**
  *   **Step 4 (So What?):** If we bracket the truth (it's just predictive text), does the story matter? Only as a story about *hype*.
  *   **Procedure Verdict:** **RED LIGHT (Drop as Science).**
  *   **Action:** Do not write this as "AI has experience." You can write "AI Lab Claims Experience," but you must explicitly state in paragraph 3 that no methodology was provided to verify the claim. If they won't show evals, you have no story but "Press Release."
  *   **Reframe:** "The New Sentience Hustle." Focus on the *act of claiming* sentience, not the sentience itself.

  #### Case 2: The Scanner Patient (Tennis/House)
  *   **Step 1 (Source):** Report is fMRI signal mapped to yes/no. Third-party data? **Yes** (Neural activation matches task).
  *   **Step 2 (Correlation):** Data shows he *can* follow commands, not necessarily the richness of his inner life.
  *   **Step 3 (Incentive):** Patient (Low/None), Researchers (High/Status). Protocol? **Published/Peer-Reviewed.**
  *   **Step 4 (So What?):** If we bracket the truth, does it matter? **Yes.** Functional communication is established regardless of "qualia."
  *   **Procedure Verdict:** **GREEN LIGHT.**
  *   **Action:** Lead with the communication breakthrough. Use the phrase "functional consciousness" rather than "full inner life." You can quote his answers, but attribute them to "signals interpreted as..." This respects the patient's dignity (Value Check) without overclaiming the neuroscience (Fact Check).

  #### Case 3: The Retreat Teacher (Contentless Awareness)
  *   **Step 1 (Source):** Retrospective reports. Third-party data? **No.**
  *   **Step 3 (Incentive):** Doctrinal validation (High). Protocol? **Single/Anecdotal.**
  *   **Step 4 (So What?):** If we bracket the truth (assume no such state exists), does the story matter? **Yes.** The *practice* and the *community* rely on this report.
  *   **Procedure Verdict:** **YELLOW LIGHT (Reframe Required).**
  *   **The Buzzkill Result:** The procedure dictates you cannot write "People achieve a state of no-self." You must write "People report achieving a state of no-self."
  *   **How to Save the Story:**
      *   **Legitimate Angle:** Shift the focus from the *metaphysics* to the *phenomenology and utility*.
      *   **What you can say:** "For these practitioners, the report of 'no-self' functions as a tool to reduce anxiety." "The detailed retelling is itself part of the discipline."
      *   **The Lead:** Do not lead with the quote as fact. Lead with the *effort* to describe the indescribable. "It takes them years to learn how to say they saw nothing."
      *   **Why this works:** It satisfies your readers' interest in the exotic without violating your fact-checker's biology degree. You are reporting on a human behavior (reporting), not a supernatural event (being).

  ---

  ### Part 4: Style Note Addition

  **Subject: First-Person Consciousness Claims**

  **What This Procedure Does Not License:**
  Adopting this triage does not license the conclusion that a reported experience is *ontologically real* (i.e., that the thing actually exists in the world as described). It licenses the conclusion that the report was *made* and is *significant*. We do not publish headlines confirming "Sentience," "God," or "No-Self" as objective facts; we publish them as claims made by subjects within a specific context.

  **Which Complaints This Answers:**
  This procedure primarily answers the **"Credulous"** complaint (letters accusing us of swallowing pseudoscience). By treating reports as data rather than truth, we demonstrate rigor to the skeptics. It will *not* fully quiet the **"Scientistic Dismissers"** (those who believe subjective reports are worthless), because we will still publish stories on meditation and patient communication. However, it protects us from them by ensuring those stories are framed as investigations into human *reporting behavior* and *social impact*, rather than validations of magic. We remain neutral arbiters of the text, not judges of the soul.
