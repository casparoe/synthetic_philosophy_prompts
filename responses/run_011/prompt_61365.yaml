prompt: |-
  You're a philosopher of probability who's also done serious work on decision theory under uncertainty. Please think this through properly before you answer — start by roughing out where you suspect the pressure points are, brainstorm the possible interactions between items for a bit, and only then give me the audit. Assume I already know the machinery (credal sets, interval-valued credences, pointwise updating), so don't explain my own framework back to me, and no bibliography or named-paper dropping — I want your analysis, not a literature survey.

  Situation: I do applied uncertainty work (probabilistic forecasting, some risk modelling) and I've been reading imprecise probability on the side. I'm giving a talk to a philosophy reading group and I've written down what I actually believe so they can attack it. I'd rather be attacked by you first.

  1. When the evidence is genuinely silent about something, the rational doxastic state isn't one probability function, it's a set of them. And in the limit case of total silence, the set should contain every probability function — you shouldn't manufacture precision the evidence doesn't support. (Part of why I'm drawn to this: I also think regularity is non-negotiable, nothing genuinely possible should get probability 0, and I can't see how you get that for every hypothesis without throwing in essentially everything.)
  2. Learning is pointwise conditionalization: E comes in, you conditonalize every member of the set on E, the result is your new set. No higher-order machinery, no imprecise conditional probabilities.
  3. I want these states to be action-guiding, and I think the right rule is maximin: for each act compute its expected utility under each member of the set, take the worst, pick the act with the best worst.
  4. A doxastic policy that can't be sharpened by evidence is defective. If no possible observation would ever narrow my range on some hypothesis, something has gone badly wrong. I'm not willing to sign up for a view on which data makes no difference to my determinacy.
  5. The dilation worry — that learning E can leave me less determinate about H than I was before — is real but survivable. It's the price of respecting the evidence and I've made my peace with it.
  6. Precise Bayesianism isn't just impractical, it's wrong in principle: no single prior is ever rationally required by silence alone.

  For what it's worth I'm about equally attached to all six, which is exactly why I can't tell from the inside which one has to go.

  What I want back:

  - Which pairs genuinely pull against each other, ranked by severity — fatal vs merely uncomfortable, not a flat list where everything is equally bad.
  - For each real tension: which commitment has to give, what the minimal revision looks like, and what that revision costs me elsewhere in the list.
  - Which ones only look like tensions and dissolve on inspection, with the reason they dissolve. I'd hate to walk in there defending against an objection that isn't actually an objection.
  - Be concrete. If you claim some rule degenerates in a particular case, show me the case, with the acts and states spelled out, not just the general principle.
  - Where a commitment's stated motivation supports something weaker than the commitment itself, say so and say what the weaker version buys.

  Finish with the single change that would buy me the most coherence for the least, and tell me honestly whether its a change I can make while still calling myself an imprecise probabilist.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Applied uncertainty worker (forecasting, risk modeling) familiar with imprecise probability (IP) machinery (credal sets, interval-valued credences, pointwise updating).
