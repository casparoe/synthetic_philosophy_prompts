      *   **Task:** Audit six specific commitments regarding IP and decision theory. Identify tensions, rank severity, propose revisions, distinguish real vs. apparent tensions, and recommend a single best change.
      *   **Constraints:** No explaining basic machinery back to the user, no bibliography/namedropping, concrete examples for degeneracy claims, analyze motivation vs. commitment strength.
