  I tell you this not to mourn the past, but to honor the journey we took together. To the board members: thank you for funding the question, even when the first answer was wrong. You gave us the runway to fail safely and find what actually worked. To the city staffers: thank you for your patience. And to my field organizers: you knew this all along. You did the hard, unglamorous work of building trust block by block while I chased the headline speakers.

