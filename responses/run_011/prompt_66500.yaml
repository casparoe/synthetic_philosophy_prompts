  But I owe you the truth of what we found. We operated on the belief that the barrier was silence—that people disagreed because they hadn't listened. We were wrong. The barrier was not that neighbors hadn't heard the outside world; it was that they had been taught, sometimes by painful experience, to distrust it. There is a profound difference between a group that has not heard the other side and a group that has learned not to believe it. Only the first is repaired by more information. We learned this the hard way. Two of the experts we championed got the facts wrong. The residents weren't ignoring truth; they were protecting themselves from error.

