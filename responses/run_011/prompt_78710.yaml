answer: |-
  **MEMORANDUM**

  **TO:** Schools Catering Service Lead
  **FROM:** Behavioural Insights Review Panel
  **DATE:** 24 May 2024
  **SUBJECT:** Decision on Year 4 'Green Plate' Proposal (Ref: BIRP-24-09)

  **Decision**
  The Panel approves the proposal **subject to strict conditions**. The intervention aligns with the council's public health objectives, but the initial design risked violating our Terms of Reference (ToR) regarding autonomy and transparency. Approval is contingent on the operational changes listed below being implemented by 09:00 on Monday, 27 May.

  **Rationale**
  Our ToR permit only interventions that are "transparent on reflection" and "compatible with the autonomous formation of the recipient's own preferences". The proposal's inclusion of a plain English disclosure admitting the use of defaults satisfies the transparency limb commendably. However, the initial design threatened the autonomy limb. Defaults are ethically permissible when they reduce friction for desirable choices, but not when they erect barriers against dissenting preferences.

  The Panel acknowledges the strength of the parent group's objection. Their case rests on the observation that the opt-out mechanism constitutes 'sludge': requiring in-person submission, pupil signatures, and termly re-authorization imposes disproportionate transaction costs on dissenters. Furthermore, the revision trigger—committing to rewrite the letter to reduce opt-outs if they exceed five per cent—treats the exercise of autonomy as a policy failure rather than valid data. This explicitly prioritises compliance over preference formation. Additionally, linking dietary choices to class behaviour points introduces social coercion that undermines voluntary consent, particularly for Year 4 pupils who may feel responsible for their class's standing.

  Had these elements remained, the Panel would have rejected the bid. They suggest an intent to manipulate outcomes rather than facilitate welfare. However, the core nudge—making healthy food the default—is evidence-based and potentially welfare-enhancing. Therefore, we offer approval conditional on removing the coercive elements while retaining the default structure.

  **Conditions**
  To comply with the ToR, the Catering Service must execute the following by Monday:

  1.  **Opt-Out Friction:** Remove the requirement for in-person submission and pupil signatures. Opt-out forms must be returnable via post or email. Re-authorization shall be annual, not termly.
  2.  **Social Pressure:** Remove all references to the school behaviour competition and class points from the parent letter. Remove the headteacher's photograph if it implies authoritative endorsement beyond standard communication.
  3.  **Success Metrics:** Change the primary evaluation metric from "proportion remaining on green plate" to "nutritional intake improvement" or "food waste reduction". Retention rates are process metrics, not welfare outcomes.
  4.  **Revision Trigger:** Amend the trigger clause. If opt-outs exceed five per cent, the review must assess *why* (e.g., dietary needs, palatability), not aim to reduce the opt-out rate through messaging changes.

  **Implementation Time Frame**
  Provided conditions are met by Monday, the pilot may proceed for the Autumn Term. A preliminary review of opt-out data and qualitative feedback will occur at week six, with a full ethical review at week twelve.

  **Signed,**
  *Chair, Behavioural Insights Review Panel*

  ***

  **ANNEX: Premises Underlying Decision**

  **Settled Premises (Empirical)**
  *   **Defaults affect choice:** There is robust consensus that default options significantly influence uptake rates in cafeteria settings.
  *   **Friction reduces action:** Increasing the effort required to opt-out (e.g., in-person forms) reduces the likelihood of opting out, independent of underlying preference.

  **Contested Premises (Normative & Empirical)**
  *   **Definition of Autonomy:** It is contested whether a choice remains autonomous if the default is set by an authority, even with disclosure. Some panelists argue true autonomy requires active choosing; others accept guided choice if welfare is improved.
  *   **Welfare vs. Choice:** There is disagreement on whether overriding expressed preferences (via high-friction opt-outs) is permissible if the outcome is objectively healthier. The Panel has sided with the view that procedural autonomy constrains paternalistic welfare goals.
  *   **Transparency Sufficiency:** It is unsettled whether stating "defaults work" constitutes sufficient transparency if social pressure is simultaneously applied. The Panel has determined that transparency is negated by coercion.
  *   **Opt-out Rates as Failure:** The proposal assumed high opt-outs indicate messaging failure. The Panel contends high opt-outs may indicate legitimate preference heterogeneity.
