  2.  **Evaluate the Proposal against ToR:**
      *   *Transparent on reflection:* The letter admits defaults work. This helps transparency. However, the social pressure (behaviour competition points) and the headteacher's photo might obscure the choice or make it feel coercive.
      *   *Compatible with autonomous formation of preferences:* The opt-out process is highly burdensome (in-person, signed by pupil, frequent re-authorization). This creates "sludge". The revision trigger ("if opt-out > 5%... rewrite letter to reduce it") explicitly aims to lower autonomy if too many exercise it. This seems directly incompatible with autonomous preference formation. It treats opt-outs as a failure rather than a valid expression of preference.
      *   *Success Metric:* Measuring success by retention on the default rather than health outcomes or satisfaction reinforces the idea that compliance is the goal, not welfare.

  3.  **Determine the Decision:**
      *   *Approve:* Risky. The opt-out burden and the revision trigger seem to violate the "autonomous formation" clause.
      *   *Reject:* Safe, but the user voted to approve at first reading and wants to find a path that isn't "wrong reasons".
      *   *Approve with Conditions:* This allows saving the core nudge (healthy eating) while fixing the coercive elements. This aligns with the user's initial instinct but corrects the ethical flaws.
      *   *Decision:* **Approve with Conditions.**

  4.  **Drafting the Memo:**
      *   **Header:** Standard memo format.
      *   **Bottom Line:** Approve with Conditions.
      *   **Reasoning:** Address the ToR clauses.
      *   **Steelman the Objection:** Acknowledge the parent group's concern. The burden of opt-out + social pressure + revision trigger looks like manipulation aimed at compliance, not welfare. The revision trigger is particularly damning (trying to suppress dissent).
      *   **Conditions:**
          1.  Remove the behaviour competition incentive (coercion/social pressure).
          2.  Simplify opt-out (remove in-person requirement, remove pupil signature, extend deadline, remove termly re-authorization).
          3.  Change success metric (health/waste reduction, not just retention).
          4.  Remove the revision trigger aimed at reducing opt-outs (opt-outs are data, not failures).
      *   **Timeline:** Conditions met by Monday. Pilot starts Autumn Term.
      *   **Annex:** Distinguish settled vs. contested premises.

  5.  **Refining the Content (Self-Correction/Check):**
      *   *Word Count:* Need to hit ~800 words.
      *   *Tone:* Professional, bureaucratic but ethically rigorous.
      *   *Specifics:* Ensure conditions are operationalisable by Monday.
      *   *ToR Definitions:* Since the panel hasn't defined them, the memo should implicitly define them through the decision logic.
      *   *The "Revision Trigger":* This is the biggest red flag. It explicitly aims to reduce autonomy if too many people exercise it. This must be addressed in the conditions.
      *   *The "Transparent on Reflection" clause:* The letter admits defaults work, which is good. But the social pressure undermines it.
      *   *The "Autonomous Formation" clause:* High friction opt-out violates this.

  6.  **Drafting - Section by Section:**
