  ### The Case: The Housing Officer

  Elena is a housing officer for a small municipal trust. This morning, she gave her word to Mrs. Gable, an elderly tenant with respiratory issues, that she would personally deliver a replacement boiler permit before noon so heating can be restored (Promise/Care). En route, Elena receives an alert that a main pipe has burst in the communal basement of another block; if not stemmed immediately, it will flood storage lockers containing irreplaceable family archives for six households (Harm/Property). Due to a rigid digital protocol, only one emergency work order can be active on her tablet at a time; she cannot authorise the repair crew for the basement while carrying the permit to Mrs. Gable. The pipe burst was a manufacturing defect unforeseeable to any reasonable officer, and Elena's promise to Mrs. Gable was not rash given normal conditions. Elena judges preventing the flood is weightier, but knows fulfilling her promise to Mrs. Gable is now impossible. She can do either, but not both.

  ***

  ### The Working

  **The Impossibility Thesis (Dilemma Denial)**
  A theorist who denies the possibility of genuine moral dilemmas will attack **Condition 3** (the claim that both obligations remain binding despite the impossibility of conjunction). They will invoke the principle that *ought implies can* (you cannot be obliged to do what is impossible). Since Elena cannot do both, she cannot be obliged to do both. Because she has correctly judged that preventing the flood is weightier, the theorist argues that the obligation to Mrs. Gable is *overridden* or *dissolved* entirely. It transforms from an obligation into a regrettable circumstance. Regarding the **moral residue** (the lingering guilt or duty to make amends), the denier must explain this away as merely psychological agent-regret, not evidence of a remaining moral debt. They would say Elena owes Mrs. Gable an explanation, but not reparations grounded in a breached obligation, because no obligation existed at the moment of choice.

  **The Genuine Dilemma Reply**
  The affirming theorist argues that the impossibility of doing both does not erase the source of the obligations. The promise to Mrs. Gable created a genuine duty that persists even when overridden by the urgency of the flood. They argue that *ought implies can* applies to individual acts (Elena *could* have delivered the permit; she *could* have stopped the flood), just not their conjunction. The moral residue is not just psychological; it is normative. Elena owes Mrs. Gable more than an explanation; she owes compensation or a specific act of reparation because she *wronged* her, even if she did the right thing overall. The dilemma is genuine because both 'oughts' were true until the moment one became impossible to perform.

  **The Load-Bearing Constraint**
  **Condition 1 (Asymmetry and Non-Evaporation)** is doing the most work. Without the stipulation that the lesser obligation must not evaporate upon ranking, the case collapses into a standard prioritisation problem. It is the insistence that the "losing" obligation retains its normative force despite being correctly overridden that generates the logical tension. Condition 3 (No Third Way) sets the stage, but Condition 1 forces the philosophical conflict: if the lesser obligation vanishes when weighed, there is no dilemma, only a calculation.

  **Removing the Constraints**
  *   **Delete Condition 1 (Asymmetry/Non-Evaporation):** If we allow the lesser obligation to evaporate once ranked, the case collapses into a simple **hierarchical duty**. Elena simply does the weightier duty; the promise to Mrs. Gable is revealed to have been conditional all along. There is no residue, no dilemma, just correct administration.
  *   **Delete Condition 2 (Not Self-Inflicted):** If Elena was negligent (e.g., she knew the pipes were old or made a rash promise), the case collapses into **culpable mismanagement**. The dilemma disappears because the primary obligation becomes "she should not have been in this position." The conflict is between her current duties and her prior fault, which is a different ethical problem.
  *   **Delete Condition 3 (No Third Way/Override):** If a third way exists (e.g., she can call a colleague), the case collapses into a **practical puzzle**. It is no longer a moral impossibility, just a logistical challenge. If 'ought implies can' is satisfied for both jointly, there is no conflict of obligations, only a conflict of schedules.
  *   **Delete Condition 4 (Mundane/Contemporary):** If the case is abstract (e.g., "Agent A must save X or Y"), it collapses into **ideal theory**. Students can dismiss the residue as an artefact of the abstraction. The mundane setting forces them to confront the real-world cost of the denial (e.g., telling Mrs. Gable she was never truly owed that permit).

  ***

  ### Self-Critique and Honesty

  **Have I succeeded?**
  I must be honest: I have not definitively succeeded, because the spec may be unsatisfiable by logical necessity. The case relies on the intuition that moral residue implies a remaining obligation. However, a sophisticated denier (e.g., a Kantian or a sophisticated Consequentialist) will argue that the *source* of the obligation (the promise) contains an implicit clause: "unless a greater harm intervenes." If that clause exists, Condition 1 is violated because the obligation *did* evaporate upon ranking; it was never absolute. I have stipulated that it doesn't evaporate, but I cannot force the logic to hold if the students argue that 'obligation' conceptually entails 'overridable only by stronger obligation which nullifies the first'.

  **Hidden Weaknesses**
  1.  **Condition 2 vs. Condition 1:** There is a risk that Condition 2 (No Fault) quietly undermines Condition 1. If Elena is truly not at fault, students may argue the promise was never a *strict* obligation to begin with, but a *prima facie* duty (a provisional one). If it was only provisional, it wasn't a genuine obligation in the conflict moment, violating Condition 1's requirement that both are real obligations.
  2.  **The "Weightier" Judgement:** By stipulating Elena judges correctly that the flood is weightier, I invite the denier to say, "If it's weightier, it's the *only* obligation." I have tried to block this with the residue requirement, but the link between 'weightier' and 'exclusive' is strong in common moral reasoning.
  3.  **The Digital Protocol:** The "one work order" rule (Condition 3) might be attacked as an artificial constraint. A sharp student might ask, "Why can't she phone the repair crew?" I have specified "authorise... on her tablet," but in a mundane setting, workarounds often exist. This risks violating Condition 3's "No Third Way."

  **What Would Change My Mind?**
  I would concede the spec is unsatisfiable if forced to accept that *obligation* is a concept that logically cannot conflict. If 'ought' is defined by what a fully rational agent would do, and a rational agent would never accept two conflicting 'oughts', then a genuine dilemma is a category error, like a "married bachelor." If the argument is made that moral obligations are inherently systematisable (i.e., true morality is consistent), then any case appearing to show inconsistency is merely showing our *understanding* is flawed, not the morality itself.

  **Where My Reasoning Might Fail**
  My reasoning is most vulnerable on **Condition 1**. I am assuming that moral residue (the need to apologise/compensate) proves a remaining obligation. A denier can argue residue is just about maintaining character or social trust, not discharging a debt to the specific person. If that distinction holds, the "non-evaporation" claim fails. The closest achievable case is one where the agent *feels* bound by the lesser obligation, but cannot prove they *are* bound logically. I have built a case that maximises the intuitive pull of the dilemma, but I cannot guarantee it survives rigorous logical analysis without begging the question against the denier.
