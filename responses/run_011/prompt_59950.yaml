              1.  *Question-Identity Problem:* Same question or different question?
              2.  *Second-Order Reading:* Protest vote vs. Policy preference (and the banking collapse anomaly).
          *   Reverse Direction Analysis: Riker's arbitrariness? Populist anomaly? Authority claim vs. Description?
