  6.  **Final Polish:** Check tone (analytical, disciplined), ensure all constraints from the prompt are met (no bibliography, specific distinctions tested). Ensure the distinction between "Will of All" and "General Will" is applied correctly to the two votes. (2008 could be seen as particular interests fears, 2009 as common good of stability? Or vice versa? I need to be careful not to take sides but show how the theory *would* categorize it).

      *Refining the Rousseau point:* Rousseau would likely reject *both* as corrupted by factions (parties campaigning). But if forced, he might see 2008 as the 'Will of All' (sum of private fears) and 2009 as closer to 'General Will' if the guarantees aligned the treaty with the common good of the Irish polity. However, the external pressure (crisis) contaminates the 'freedom' required for the General Will. I will note this tension.

