  3.  **Part 2: Pressure-Testing the Distinctions**

      *   *Distinction 1: Question-Identity.*
          *   If Same Question: One vote is wrong. Which one? If 2009 is "enlightened," 2008 was "mistaken." But populism treats the vote as infallible expression.
          *   If Different Question: Then "The People Spoke" in 2008 is nullified. The 2009 vote wasn't a reversal, it was a new decision.
          *   *Populist Tension:* Populism needs the 2008 No to be "The Will" (to claim elite obstruction) but also needs the 2009 Yes to be "The Will" (to claim resolution). It can't have both without contradiction.
      *   *Distinction 2: Second-Order Reading (Protest).*
          *   Hypothesis: 2008 No was a protest against the government/process.
          *   Anomaly: By 2009, the government presided over a banking collapse/recession. If it was a protest vote, the 2009 No should have been *higher*. Instead, Yes surged.
          *   *Implication:* This undermines the "protest" explanation. It suggests the *object* of the will changed (fear of economic isolation outweighed treaty concerns). Or, it suggests the "Will" is highly manipulable by context (Riker).

