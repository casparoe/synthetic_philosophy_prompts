  2.  **Part 1: Mapping the Concept onto the Episode (Direction 1)**

      *   *Who is the People?*
          *   Populist theory usually implies a homogeneous, sovereign body. In this context, is it the *Irish Nation* (constitutional sovereign) or the *European Demos* (affected population)?
          *   If Populism: It's the Irish electorate.
          *   If EU Democratic Theory: It's the 500 million Europeans.
          *   *Decision:* For the purpose of testing "the will of the people" *as populists use it*, the focus must be on the Irish electorate, but the tension with the wider EU population is a critical stress point.
      *   *What is the Object?*
          *   2008: The Treaty text.
          *   2009: The Treaty + Guarantees.
          *   Is it the *same* object? Legally, yes (same amendment). Politically, no (context changed).
      *   *Theoretical Frameworks:*
          *   *Rousseau:*
              *   2008 No = Will of All (private interests/confusion)?
              *   2009 Yes = General Will (common good realized after clarification)?
              *   *Problem:* Rousseau hates factions and intermediaries. The "guarantees" look like bargaining, not general will formation.
          *   *Aggregative (Schumpeterian):*
              *   Will = Sum of preferences at time $t$.
              *   2008 = Will at $t_1$. 2009 = Will at $t_2$. Both valid. No contradiction, just change.
          *   *Deliberative:*
              *   Will = Outcome of reasoned discourse.
              *   2008 = Failed deliberation (misinformation). 2009 = Successful deliberation (guarantees clarified stakes).
          *   *Riker (Social Choice):*
              *   Will is a fiction. Outcomes depend on agenda control and sequence.
