answer: |-
  ### Part I: Mapping the Concept onto the Episode

  To analyze the Lisbon referendums through the lens of "the will of the people," we must first discipline the variables. Populist theory typically posits a homogeneous, sovereign body whose authentic will is obstructed by a corrupt elite. Applying this to the Irish case requires fixing the subject and object of that will before assessing the theoretical implications.

  **1. Who is the People?**
  There are three candidate definitions, each yielding different verdicts on the legitimacy of the outcome:
  *   **The Irish Electorate:** The constitutional sovereign. This fits the populist narrative of national self-determination.
  *   **The Voting Majority:** The 53.4% (2008) or 67.1% (2009). This fits aggregative democracy but ignores the non-voters (approx. 45%).
  *   **The European Demos:** The 500 million citizens affected by the Treaty. This fits cosmopolitan democracy but renders the Irish referendum an anomaly, as this "people" was never consulted as a whole.

  Populist theory commits us to the **Irish Electorate**. It treats the nation-state as the only legitimate container for popular sovereignty. However, this immediately creates a tension: if the "people" whose will matters are the Irish, the EU structure is inherently elitist (bypassing voters elsewhere). If the "people" are the Europeans, the Irish veto is a minority capture of the majority's will.

  **2. What is the Object of the Will?**
  *   **The Treaty Text:** Technically identical in both votes.
  *   **The Package:** Treaty + Legal Guarantees (2009).
  *   **The Decision-Rule:** The power to ratify or veto.

  If the object is the *Text*, the will flipped. If the object is the *Package*, the will was consistent (No to A, Yes to A+). If the object is the *Decision-Rule*, the will was consistently exercised (the people asserted sovereignty twice). Populist rhetoric oscillates between these: celebrating the 2008 veto as sovereignty, but accepting the 2009 ratification as the "true" will once "misinformation" was cleared.

  **3. Theoretical Implications for the Two Results**

  *   **Rousseau (General Will vs. Will of All):**
      Rousseau distinguishes the *General Will* (common good) from the *Will of All* (sum of private interests).
      *   *2008:* Could be interpreted as the *Will of All*. Voters acted on private fears (taxation, neutrality) or confusion, fragmented by campaigning factions.
      *   *2009:* Could be interpreted as closer to the *General Will*. The guarantees clarified the common good (security, economic stability), allowing voters to transcend private confusion.
      *   *Commitment:* Rousseauian theory must argue that 2008 was a corrupted expression and 2009 was the authentic one. However, Rousseau requires the people to deliberate without external coercion. The 2009 vote occurred under the duress of economic collapse, which contaminates the "freedom" necessary for the General Will.

  *   **Aggregative Democracy:**
      Will is the sum of preferences at time $t$.
      *   *Implication:* Both results are equally valid expressions of the will at different times. There is no contradiction, only preference change.
      *   *Commitment:* This view cannot support the populist claim that elites "ignored" the 2008 will. It simply acknowledges that the will at $t_1$ differed from $t_2$. It treats the referendum as a snapshot, not a revelation of truth.

  *   **Deliberative Democracy:**
      Will is formed through reasoned discourse.
      *   *Implication:* 2008 failed deliberation (low information, complex text). 2009 succeeded (guarantees clarified stakes, higher turnout).
      *   *Commitment:* This validates the re-vote. It suggests the 2008 result was a "mistake" born of poor communication, not an authentic will. This undermines the populist notion that the initial "No" was a sacred instruction.

  *   **Riker (Social Choice Theory):**
      Coherent popular will does not exist; outcomes are determined by agenda control and sequence.
      *   *Implication:* The sequence (Vote 1 $\rightarrow$ Guarantees $\rightarrow$ Vote 2) manipulated the dimensionality of the choice. The introduction of guarantees changed the ideological space, manufacturing a majority that did not exist in 2008.
      *   *Commitment:* Neither vote expresses a "true" will. Both are artifacts of the procedure. The "will of the people" is a fiction used to legitimize whatever outcome the agenda-setters (the European Council) eventually tolerate.

  ---

  ### Part II: Pressure-Testing the Distinctions

  **1. The Question-Identity Problem**
  Was October 2009 the same question asked again?
  *   **If Yes:** Then one outcome misdescribes the people's will. If the will is unitary and stable (as populism often implies), the people cannot will $X$ and not-$X$ within 16 months without external corruption. If 2009 is the "true" will, 2008 was noise. If 2008 was the "true" will, 2009 was coercion. Populism struggles here: it needs 2008 to be authentic (to prove elite disconnect) and 2009 to be authentic (to resolve the crisis). It cannot hold both without contradicting the idea of a stable popular will.
  *   **If No:** Then 2009 was a new question (Treaty + Guarantees). Consequently, the phrase "the people changed their minds" is illegitimate. They didn't change their minds about the 2008 proposal; they accepted a 2009 proposal.
  *   **Verdict:** The **Different Question** reading survives better conceptually, but it damages the populist narrative. If the question changed, the 2008 "No" was not a veto of the EU integration project per se, but a veto of the specific *terms*. This turns the "Will of the People" from a substantive command into a bargaining position. It suggests the "will" is not a pre-existing truth waiting to be discovered, but a negotiated outcome.

  **2. The Second-Order Reading (Protest vs. Policy)**
  A common explanation for 2008 is that the "No" was a second-order protest against the domestic government, not a first-order preference on the Treaty.
  *   **The Test:** By October 2009, the Irish banking system had collapsed, the state was entering a severe recession, and the same government remained in office. If the 2008 vote was a protest against the government, the 2009 vote should have seen an *increased* "No" (anti-incumbent) or a collapse in turnout.
  *   **The Anomaly:** Instead, the "Yes" vote surged by 20 points.
  *   **Verdict:** The **Second-Order Reading fails.** The protest motive should have strengthened, yet it evaporated. This implies the 2008 "No" was not merely a proxy for domestic dissatisfaction. However, this creates a new problem: if it was a policy vote, why did it flip so dramatically? The only variable that changed significantly was the *cost of rejection*. The banking collapse raised the stakes of isolation. This suggests the "will" is not an expression of identity or values, but a rational calculation of consequences under duress. This supports the Rikerian view that the "will" is contingent on the context of choice, not an internal moral compass.

  ---

  ### Part III: The Reverse Direction (What the Episode Does to the Concept)

  **1. Confirmation of Riker's Arbitrariness Thesis**
  The Lisbon episode is strong evidence for Riker. The outcome depended on:
  *   **Agenda Control:** The European Council altered the package (guarantees) rather than accepting the binary outcome.
  *   **Sequence:** The re-vote was only possible because the EU had a mechanism to pause ratification.
  *   **Instability:** A 20-point swing in 16 months without a change in government or electorate composition suggests preferences are not fixed.
  The concept of a singular "will" obscures this instability. The episode suggests "the will of the people" is not a latent variable waiting to be measured, but a result produced by the interaction of institutional rules and external constraints.

  **2. Anomaly for Populist Homogeneity**
  Populism relies on the claim that "the people" are homogeneous and elites are the source of division.
  *   **2008:** Populists framed the "No" as the people vs. the elite.
  *   **2009:** When the "Yes" won, the narrative shifted to "the people saw through the lies."
  *   **The Damage:** This reveals the concept functions as a **claim to authority** rather than a description. When the vote suits the populist narrative (2008), it is the sacred will. When it contradicts the narrative of elite obstruction (2009 Yes), it is explained away as "clarity" or coerced by "necessity." The episode demonstrates that "the will of the people" is a rhetorical tool used to legitimize outcomes post-hoc, not a pre-political fact.

  **3. The Silence on the Demos (The 1% Veto)**
  The most significant failure of these frameworks is their silence on the boundary of the people.
  *   **The Fact:** Roughly 1% of the EU population (Ireland) held an effective veto over a decision affecting 100% of the Union. The other 99% ratified via representatives without consultation.
  *   **The Silence:**
      *   *Populist Theory:* Cannot locate the demos. If the demos is national, the EU is illegitimate. If the demos is European, the Irish referendum was a minority veto. It cannot reconcile national sovereignty with transnational impact.
      *   *Liberal Representation:* Cannot explain why the Irish required a referendum while others did not. It treats the Irish veto as a legal quirk rather than a democratic deficit for the 496 million others.
      *   *Deliberative Theory:* Falls silent on the exclusion of the wider European public from the deliberation that the Irish vote necessitated.
  *   **Verdict:** The concept of "the will of the people" breaks down because it cannot identify *which* people. In a transnational polity, insisting on the national "will" allows a minority to hold the majority hostage. Insisting on the transnational "will" renders the Irish referendum undemocratic. The episode proves that without a defined boundary of the demos, "the will of the people" is an empty signifier that can be wielded by any subgroup with a veto point.

  **Conclusion**
  The Lisbon referendums demonstrate that "the will of the people" is not a stable object that referendums reveal. The 2008 and 2009 results cannot both be authoritative expressions of a unitary will without redefining the question or the context. The episode confirms Riker's suspicion that outcomes are artifacts of agenda and sequence, and it exposes populism's inability to account for preference change without alleging coercion. Ultimately, the analysis reveals the concept's fatal silence on the boundary problem: in a union of 500 million, allowing 1% to define the "will" for all is not an expression of democracy, but a failure to locate the relevant people at all.
