answer: |-
  Mechanics check: Your description is accurate. The International Gene Synthesis Consortium (IGSC) Harmonized Screening Protocol mandates screening against the USG Select Agents and Toxins list and similar international databases. Thresholds typically involve percent identity over specific base-pair lengths (e.g., >50% identity over 200bp triggers review). While synthetic genomics has reconstructed viruses (e.g., poliovirus, horsepox), the sequence is indeed a necessary but not sufficient condition; host cells, transfection machinery, and biosafety infrastructure are required. The tension you identify is real.

  **1. The Information Notion**
  For the screening to function, the sequence must be treated as a **portable signature** rather than a complete blueprint. The practice does not require the sequence to be ontologically sufficient (i.e., that the string *is* the virus), but it does require it to be **causally privileged**. The notion of information at work is **indexical**: the sequence points to a specific hazard with high probability. It treats the DNA as a **bottleneck resource**. If the sequence were merely one resource among many equal factors (like buffer solution or incubator time), matching it would be meaningless. The machinery needs the sequence to be a **necessary condition** that is **hard to acquire elsewhere**. It borrows "code" language to justify the risk, but operates on "identifier" logic to manage it.

  **2. Rival Pictures**
  This practice quietly rules out strong **Developmental Systems Theory** or radical **contextualism**, which hold that the genome is merely a passive resource with no privileged causal status over the cellular environment. If the genome were just one input among equals, singling it out for screening would be arbitrary. However, the practice is compatible with a **probabilistic risk model** that practitioners rarely admit: that the sequence is not dangerous *per se*, but that acquiring it correlates strongly with malicious intent or capability. It is also compatible with the view that the sequence is a **rate-limiting step**. The system acts as if the sequence is the "hard part," even if biologists know the "wet work" is equally difficult.

  **3. Internal Consistency**
  The tension is not inside the practice, but between the practice and the field's **ontological self-description**. Biologists claim "context is everything" (ontology); screeners act as if "sequence is predictive" (epistemology). These are not logically contradictory. A sequence can be context-dependent in its function but context-independent in its **identification**. The belief that has to give is the biologist's slogan that sequence means nothing without context. For screening to work, sequence must mean *something* on its own—specifically, it must carry **risk information** independent of its immediate expression. The practice is internally consistent as a proxy-based security measure; the inconsistency is rhetorical, between how biologists describe causality and how security agencies manage risk.

  **4. Underdetermination**
  The **threshold settings** are where opposed theories converge. A **genetic determinist** (sequence = blueprint) and a **risk statistician** (sequence = correlation) both endorse screening known pathogens. The determinist believes matching the string captures the hazard; the statistician believes matching the string captures the *customer's potential* to create the hazard. The philosophical weight lies in the **justification for the threshold**. The determinist argues for thresholds based on functional integrity (does this still make the toxin?). The statistician argues for thresholds based on false-positive costs (is this worth the admin time?). The "cheap insurance" is the database itself; both sides agree known bad things should be tracked. The divergence is invisible until you ask *why* a 50% match matters.

  **5. Screening the Context**
  If the field swapped the string-picture for the context-picture, screening would shift from **product** to **process**. You would not screen the DNA file. You would screen the **Project Proposal** and the **Lab Accreditation**. The artifact under scrutiny would be the **experimental design document** detailing the host system, the containment level, and the intended assay. Verification would focus on **customer capability** (do they have BSL-3 infrastructure?) rather than **customer inventory** (do they have this string?). The question changes from "Is this sequence dangerous?" to "Is this user equipped to handle this sequence safely?" The sequence becomes irrelevant except as a line item in a broader safety audit.

  Verdict: FITS-BUT-NOT-REQUIRED
