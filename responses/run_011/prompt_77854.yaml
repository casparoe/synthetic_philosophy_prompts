answer: |-
  I award this paper a grade of eighty-two out of one hundred. You have produced a clear and concise exposition of the central debate between Walzerian traditionalism and revisionist just war theory, and your writing is direct and easy to follow. The first two paragraphs successfully capture the core of the assignment by accurately summarizing Walzer's doctrine of the moral equality of combatants and McMahan's liability-based challenge. You correctly identify that Walzer separates the judgment of the cause from the judgment of the conduct, grounding the soldier's immunity in the separation of spheres and the mutual threat posed by combatants. Similarly, your explanation of the revisionist position is accurate; you rightly note that McMahan shifts the locus of liability from status to individual moral responsibility for unjust threats. These expository sections are strong and demonstrate that you have grasped the fundamental theoretical disagreement, which forms the necessary foundation for the rest of the essay.

  However, the grade is determined primarily by the critical evaluation in the second half of the paper, where your inferences become more contentious and less supported by the literature we have covered. In the third paragraph, you argue that because the revisionist moral account is convincing, the law of armed conflict should be amended to withdraw combatant privilege from unjust soldiers. While this follows logically from a strict moral reading, you overlook the standard revisionist response regarding epistemic limitations and institutional design. Most revisionists, including McMahan, argue that while the moral asymmetry is real, the law should remain symmetric because soldiers cannot reliably judge the justice of their cause in the fog of war, and stripping them of privilege would reduce incentives to surrender and increase brutality. Your claim that the conclusion should be carried through into practice ignores these pragmatic counterarguments, making the inference from moral truth to legal policy too abrupt. This omission is significant because it treats the debate as purely theoretical when the prompt asks for implications that engage with the regulation of war.

  The final paragraph regarding noncombatant immunity contains the most problematic reasoning in the submission. You argue that if liability follows causal contribution to an unjust threat, then taxpayers and voters become liable targets. This is a common objection to revisionism, but you accept it as a cost rather than examining whether the revisionist premise actually entails such a wide net. Revisionists typically distinguish between causal contribution and moral responsibility, arguing that distant contributors lack the direct responsibility required for liability to defensive killing. By conflating causal contribution with liability, you present a straw man of the revisionist position that makes it easier to dismiss noncombatant immunity. Furthermore, your closing claim that traditional immunity was never anything more than a convention is inaccurate regarding Walzer's account, which grounds immunity in rights rather than mere convention. This dismissal undermines your conclusion because it removes the moral weight of the principle you are claiming is weakened. These points weigh most heavily on the grade because they suggest a lack of engagement with the nuances of the revisionist project and the traditionalist defense.

  To revise this paper, you should focus on deepening the critical evaluation in the third and fourth paragraphs. Specifically, you need to address the epistemic objection to changing the laws of war to match revisionist morality; even if you maintain your position, you must acknowledge and argue against the pragmatic reasons for maintaining symmetry in law. Regarding noncombatant immunity, you should distinguish between causal contribution and moral responsibility to see if the revisionist challenge really does license the targeting of voters, or if that is a misinterpretation of liability. Finally, you ought to provide a stronger justification for dismissing traditional noncombatant immunity as merely conventional, as this is a substantial claim that requires more support than a single assertion. If you can engage with these counterarguments and nuance your claims about liability and legal reform, you will significantly strengthen the philosophical rigor of your evaluation.
