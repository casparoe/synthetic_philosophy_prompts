answer: |-
  # Q&A Preparation Sheet: The Inductive Crisis in ML Evaluation

  ## Strategic Concessions (Opening 5 Minutes)
  *To disarm the room before the first question, weave these three admissions into your closing remarks from the main talk.*

  1.  **To the Practitioners:** "I am not a benchmark builder. I know the cost of constructing a valid test set, and I am not suggesting you discard your work lightly. My account is structural, not operational."
  2.  **To the Engineers:** "I am not denying that overfitting and leakage are real problems. They are. I am arguing they are symptoms of a deeper logical constraint, not just engineering bugs."
  3.  **To the Industry/Leaders:** "I agree that longitudinal comparability is valuable. I am arguing that when the ground beneath the benchmark shifts, comparability becomes a false precision that masks risk."

  ## The "Must-Land" Reply
  **The Distinction Between Leakage and Retro-entrenchment.**
  If you fail to distinguish accidental data leakage (a bug) from retro-entrenchment (a structural feature of generative models training on model output), the room will dismiss this as a rehash of standard contamination warnings. You must convince them that the *predicate itself* is changing extension over time, not just the test set being leaked.

  ## The "Hope Nobody Asks" Question
  **Question:** "Can you provide the mathematical formalism for 'predicate debt'? How do we calculate when the debt comes due?"
  **Holding Answer:** "Predicate debt is currently a qualitative heuristic for audit, not a closed-form loss function. It predicts a discontinuous collapse of trust rather than a gradual error increase, which standard metrics miss."

  ---

  ## Objections & Replies (Ordered by Expected Damage)

  ### 1. The Comparability Objection
  **Likelihood:** High | **Damage:** Critical
  **Who:** Senior Benchmark Builder / Lab Lead
  **Phrasing:** "You propose rotating task families faster than models train. But the entire point of a benchmark is longitudinal comparison. If we change the ruler every year, we can't tell if Model B is actually an improvement over Model A. You're destroying the leaderboard utility that drives the field forward."

  **Reply (2 mins):**
  "You are right that comparability is the goal. But comparability requires a stable ground. In classical testing, the ground—the human competence being measured—is stable. In generative ML, the ground is shifting because the models are absorbing the test material into the training distribution. If we keep the benchmark fixed while the models train on its echoes, we aren't measuring capability; we are measuring memorization of the benchmark's logic. My proposal isn't to destroy comparability, but to shift it. We compare models within 'evaluation epochs' defined by the exam-time clause. Comparing across epochs requires a bridge study, not a direct score comparison. False comparability is more dangerous than no comparability, because it licenses deployment based on inflated confidence."

  **Soft Spot:** They will press you on the cost of "bridge studies." Who funds the new benchmarks every six months? You have no economic model for this.

  ### 2. The "Just Overfitting" Objection
  **Likelihood:** High | **Damage:** High
  **Who:** Applied Researcher / Practitioner
  **Phrasing:** "This sounds like philosophy dressing up a known engineering problem. We call this 'overfitting' or 'test set contamination.' We already have remedies: hold-out sets, dynamic evaluation, private leaderboards. Why do we need Goodman's *grue* to tell us not to leak test data?"

  **Reply (2 mins):**
  "Overfitting implies the model is too complex for the data. Contamination implies the test set was accidentally seen. I am describing neither. I am describing a state where the test set was *not* seen, but the logical structure of the test set was generated by previous models during pre-training. This is not accidental leakage; it is structural saturation. Standard remedies like private leaderboards fail here because the 'private' tasks are still drawn from the same distribution of human text that the models are saturating. Invoking Goodman isn't decoration; it explains why standard remedies fail. You cannot solve an inductive problem with a data-splitting solution. You need to acknowledge that the predicate 'accurate on task X' changes meaning over time."

  **Soft Spot:** They will argue that dynamic evaluation (generating new tasks) already solves this. You must clarify that dynamic generation often uses models, reintroducing the contamination loop.

  ### 3. The Statistical Entrenchment Objection
  **Likelihood:** Medium | **Damage:** High
  **Who:** Statistician
  **Phrasing:** "You say predicates are projectible because they are 'entrenched,' not because they carve nature. But in statistics, we rely on exchangeability. If 'accuracy' isn't a stable property of the population, your priors are broken. Are you arguing that statistical inference is impossible here, or just that our priors need updating?"

  **Reply (2 mins):**
  "I am arguing that exchangeability assumptions are being violated systematically, not randomly. Standard statistics assumes the future is drawn from the same distribution as the past. In generative ML, the past models shape the future distribution. 'Entrenchment' is my term for the false confidence we gain when we ignore that violation. We treat 'accuracy' as a stable parameter because it has been stable, but that stability is an artifact of the system not yet saturating the space. I am not saying inference is impossible; I am saying the license to infer requires an explicit date index. Without that index, the prior is implicitly assuming stationarity where there is none."

  **Soft Spot:** They will ask for the formal condition under which exchangeability breaks. "Retro-entrenchment" is not a standard statistical term they can plug into a proof.

  ### 4. The Implementability Objection
  **Likelihood:** Medium | **Damage:** Medium-High
  **Who:** Industrial Evaluation Team Lead
  **Phrasing:** "You suggest treating any benchmark surviving more than two model generations as contaminated. In industry, we have safety cases and regulatory filings tied to specific benchmarks. We cannot simply invalidate our validation stack every six months. This is unimplementable in a regulated environment."

  **Reply (2 mins):**
  "I understand the regulatory burden. But consider the alternative: certifying a system based on a benchmark that the system itself helped generate. That is not safety; that is compliance theater. If a benchmark is saturated, passing it proves nothing about real-world robustness. My prescription isn't to delete old benchmarks, but to downgrade their evidentiary weight. You can keep the benchmark for regression testing, but you cannot use it for capability claims. Regulation should demand evidence of generalization, not evidence of benchmark performance. If the benchmark no longer tests generalization, relying on it is the liability, not rotating it."

  **Soft Spot:** They will ask what *does* count as evidence if benchmarks are downgraded. You need a concrete alternative beyond "rotate tasks."

  ### 5. The Outsider Account Objection
  **Likelihood:** Medium | **Damage:** Medium
  **Who:** Senior Researcher / Workshop Organizer
  **Phrasing:** "Your account of how benchmarks get built feels assembled from abstracts. Benchmark authors know about contamination. We use adversarial filtering, human-only data, and strict embargoes. You're attacking a straw man of naive evaluation that doesn't exist at this conference."

  **Reply (2 mins):**
  "I acknowledge that practitioners are sophisticated. But adversarial filtering and embargoes assume a boundary between 'model output' and 'human data' that is dissolving. When benchmark authors use models to draft tasks, or when models train on code repositories that contain previous benchmark solutions, the boundary is gone. I am not attacking your diligence; I am attacking the feasibility of the boundary itself. You can be perfectly diligent and still fall victim to retro-entrenchment because the contamination is ambient, not specific. My account is logical, not anecdotal. It applies even to the best-built benchmarks if the underlying data ecology is saturated."

  **Soft Spot:** They will ask for specific examples of "ambient contamination" in recent top-tier benchmarks. Be prepared to name one or admit it's a projected risk.

  ### 6. The Predicate Debt Falsifiability Objection
  **Likelihood:** Low | **Damage:** Medium
  **Who:** Empiricist / Builder
  **Phrasing:** "'Predicate debt' is a evocative metaphor, but it sounds unfalsifiable. You say trust collapses discontinuously. But if it doesn't collapse, you'll just say the debt wasn't due yet. How do we know this isn't just a story you tell after a benchmark breaks?"

  **Reply (2 mins):**
  "That is a fair challenge. The falsifiable prediction is the shape of the failure. Standard error suggests gradual decay as distribution shift increases. Predicate debt predicts a cliff: performance looks stable until the model capacity crosses the threshold of saturation, then confidence evaporates. We saw this with ImageNet, and we are seeing it with MMLU. If you track the variance of scores across model generations rather than the mean, you should see compression before the collapse. I am inviting you to look for the cliff, not just the slope. If the decay is purely gradual, my hypothesis is wrong."

  **Soft Spot:** They will argue that "cliffs" are common in many failure modes, not just induction. You need to distinguish this from capability thresholds.

  ### 7. The Grue Defused Objection
  **Likelihood:** Low | **Damage:** Medium
  **Who:** The Hostile Philosopher
  **Phrasing:** "Goodman's *grue* problem was largely defused by noting that 'grue' is disjunctive and time-indexed in a way 'green' is not. Putnam showed this depends on language. You're treating a linguistic curiosity as a technical constraint. Why should ML engineers care about a riddle solved in the 1970s?"

  **Reply (2 mins):**
  "Putnam's solution relies on a stable linguistic community agreeing on primitives. In ML, the 'linguistic community' includes the models, and they are changing the primitives by changing the data distribution. When the system under test is also the system generating the training data for the next test, the distinction between 'green' and 'grue' becomes empirical, not linguistic. 'Accuracy' becomes time-indexed not by definition, but by data flow. I am not reviving the riddle for philosophical sport; I am pointing out that ML systems physically instantiate the conditions Goodman described. The 'language' is the corpus, and the corpus is now model-generated."

  **Soft Spot:** She will press you on whether this is actually Goodman or just non-stationary distributions. Don't get bogged down in exegesis; stick to the ML mechanism.

  ### 8. The Exchangeability Objection
  **Likelihood:** Low | **Damage:** Medium
  **Who:** Statistician
  **Phrasing:** "If exchangeability is violated, then Bayesian inference is invalid. Are you arguing we cannot assign probabilities to model capabilities? That seems like a nihilistic conclusion for a field built on optimization."

  **Reply (2 mins):**
  "Not nihilistic, but conditional. You can assign probabilities relative to an epoch. You cannot assign them universally. Think of it like currency inflation. You can measure value, but you must specify the year. I am arguing for an 'inflation index' for capabilities. Inference is still possible, but the scope of the claim is narrower. We must stop claiming 'Model X is intelligent' and start claiming 'Model X is competent on tasks available before date Y.' That is still useful science, just humbler."

  **Soft Spot:** They will ask how to aggregate scores across epochs if they aren't comparable. You have to admit we currently can't.

  ### 9. The Regulation Objection
  **Likelihood:** Medium | **Damage:** Low
  **Who:** Policy Person
  **Phrasing:** "You talk about measurement crisis and trust collapse. Are you making an argument for government regulation of benchmark standards? Should there be a NIST for AI evaluation?"

  **Reply (2 mins):**
  "I am making an argument for scientific standards, not legal ones. Regulation moves too slowly for this problem. If we wait for a government body to declare a benchmark contaminated, the damage is done. This requires community-led norms, similar to how physics handles measurement standards. That said, if industry cannot self-correct on saturation, regulation may become the only way to enforce disclosure of training data cutoffs. But my primary appeal is to researchers: stop treating benchmarks as truth and start treating them as time-sensitive instruments."

  **Soft Spot:** They will push for mandatory disclosure laws. You should remain agnostic on law, focused on norms.

  ### 10. The Underdetermination Objection
  **Likelihood:** Low | **Damage:** Low
  **Who:** Philosopher / Theorist
  **Phrasing:** "This sounds like the underdetermination of theory by data. Any finite set of test cases supports multiple capability hypotheses. What does Goodman add that Quine didn't already tell us?"

  **Reply (2 mins):**
  "Underdetermination is about theory choice; induction is about predicate projection. Quine asks which theory fits the data. Goodman asks which predicates we are allowed to project into the future. In ML, we aren't choosing between theories of intelligence; we are choosing between metrics. The crisis isn't that we don't know *how* the model works; it's that we don't know if the metric means the same thing next year. Goodman adds the specific mechanism of entrenchment, which explains why we stick to broken metrics like accuracy long after they stop carving nature."

  **Soft Spot:** They will argue entrenchment is just pragmatic convenience. You must insist it creates epistemic risk.

  ---

  ## Weakest Move Analysis

  **Move 2 is your weakest link.** You claim standard predicates are projectible *only* because they are entrenched, *not* because they carve nature at a joint. This is unnecessarily antagonistic to the statisticians and engineers in the room who believe accuracy and loss *do* reflect real properties of the system. It sounds like relativism.

  **Stop claiming:** "not because they carve nature at a joint."
  **Start claiming:** "whether they carve nature at a joint is unknowable; we rely on entrenchment because we have no access to the joint."

  This shifts the burden from attacking their realism to highlighting epistemic humility. It preserves the argument's force without inviting a metaphysical fight you cannot win in a Q&A session.
