                      *   Volunteer
                          *   **Armed neutrality obsolete:** Posits armed neutrality is obsolete and that its manpower logic died with the Cold War.
                      *   Every citizen
                          *   If service is owed, is it to build fighting units or to bind citizens to the state?
                              *   Fight
                                  *   **Swiss militia-plus-armed-neutrality:** Maintains armed neutrality via a militia where every citizen keeps a rifle at home, requiring constant civic militarization.
                              *   Bind
                                  *   Is this binding enforced by referendum or philosophical claim?
                                      *   Referendum
                                          *   **Austrian combination of neutrality:** Maintains constitutional neutrality and conscription via referendum, linking military service to national identity rather than threat.
                                      *   Claim
                                          *   **Civic-republican claim:** Asserts soldiering is constitutive of citizenship rather than instrumental to security or economic efficiency.
      *   Mobilize
          *   **Swedish suspension and reinstatement:** Suspended conscription for efficiency then reinstated it selectively for total defence, admitting volunteers were insufficient.

  **Empty Combinations**
  1.  **Others' Interest + Every Citizen Owes Service:** Incoherent. If safety rests on others' interest, compelling universal service contradicts the reliance on external guarantees.
  2.  **Alliance Replaces Need + Day One Own Force:** Unattractive. Maintaining a large standing force when an alliance replaces the manpower need wastes scarce small-state resources.
  3.  **Mobilize After Warning + Every Citizen Owes Service:** Untried. Small states lack the strategic depth to mobilize universal conscripts after a crisis begins without being overrun.

  **Indistinguishable Pairs**
  1.  **Swiss vs. Austrian:** Both occupy Own Costs/Day One/Every Citizen/Bind. The tree lacks a node on constitutional mechanism. *Separating Question:* Does maintaining neutrality require a popular referendum to legitimize conscription?
  2.  **Market vs. Irish:** Both occupy Others' Interest/Volunteer. The tree conflates economic ideology with diplomatic doctrine. *Separating Question:* Is voluntarism chosen for economic efficiency or to signal non-belligerence?

  **Logical Space Note**
  The five nodes map deterrence timing, security source, manpower obligation, service purpose, and alliance role. The eight positions locate specific state policies or theoretical claims within these binary distinctions. Three cells remain empty due to incoherence, resource waste, or strategic impossibility. Two pairs remain indistinguishable without further questions on constitutional legitimacy or ideological motivation.
