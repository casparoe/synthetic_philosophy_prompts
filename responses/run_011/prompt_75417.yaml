      *   **Closing:** Philosophical encouragement.

      *(Self-Correction on Tone)*: Keep it rigorous. Don't dumb it down too much. High school philosophy clubs can handle "combinatorial syntax" and "semantic primitives."

      *(Final check on the "Dialect" definition)*: Innate but variable based on preverbal experience. This is a specific twist. It's not just "culture," it's "preverbal statistical learning." I need to make sure I emphasize the *preverbal* aspect.

