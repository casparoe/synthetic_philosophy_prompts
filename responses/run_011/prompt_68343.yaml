  3.  **Drafting the Correspondence (The "Audit"):**
      *   *Molecule:* Individual human agent.
      *   *Microstate:* The full configuration of all agents (actions, beliefs, resources) at time $t$.
      *   *Hamiltonian/Dynamics:* The rules of interaction + rationality/psychology governing how state $t$ becomes $t+1$.
      *   *Coarse-graining:* The aggregation procedure (e.g., averaging income to get GDP, counting votes to get election results).
      *   *Thermodynamic Limit ($N \to \infty$):* Large population size.
      *   *Typicality/Ensemble:* The assumption that most microstates compatible with a macrostate behave similarly (ergodicity/equilibrium).

  4.  **Identifying Disanalogies (The "Failure Points"):**
      *   *Reflexivity (The Lucas Critique/Performativity):* Molecules don't know $T$. Humans know "inflation" and change behavior. This alters the Hamiltonian.
      *   *Fixed vs. Contested Macro-definitions:* Temperature is defined by kinetic energy. "Inflation" is a constructed metric (basket of goods changes). "Institution" is not a simple average.
      *   *Conservation Laws:* Energy is conserved. Utility/Resources are not strictly conserved in the same closed-system way.
      *   *The Thermodynamic Limit:* $N \to \infty$ works for gases. In society, $N$ is large but finite, and interactions are not short-range (networks, media).
      *   *Equilibrium vs. Non-equilibrium:* SM often relies on equilibrium. Societies are historically path-dependent (low entropy past is unique, not generic).
      *   *Micro-Laws:* Newton's laws are stable. Human psychology/culture evolves.

  5.  **Ranking the Disanalogies:**
      *   *Inconvenient:* $N$ is finite (still large enough for stats?), Conservation laws (can be modeled).
      *   *Fatal:* Reflexivity (changes the dynamics endogenously), Contested Macro-definitions (no objective coarse-graining), Non-stationary Micro-laws (no fixed Hamiltonian).

  6.  **Addressing Specific Prompts:**
      *   *Reflexivity:* This breaks the fixed Hamiltonian assumption. If agents model the macro, the macro feeds back into the micro.
      *   *Macro-definition:* In physics, coarse-graining is mathematically precise. In SS, it's normative/political (e.g., how unemployment is measured).
      *   *Infinite-volume/Entropy:* Social systems are open, historical, and far from equilibrium. The "past hypothesis" in physics is a boundary condition; in history, it's the *subject* of study.
      *   *Micro-regularities:* Are human actions lawlike? If not, the "statistical" part of statistical mechanics fails.

  7.  **Evaluating the "Handshake" Conclusion:**
