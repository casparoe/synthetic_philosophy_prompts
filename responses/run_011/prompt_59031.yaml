answer: |-
  ### Brainstorming Options

  Before settling on a recommendation, I evaluated three drafting conventions against our engineering constraints and policy goals:

  1.  **Pure Descriptivism (Priya's Model):** All rules must be observable facts (e.g., "contains slur from List S").
      *   *Pros:* High inter-rater reliability (kappa) on atomic items; minimizes legal liability.
      *   *Cons:* Fails on compound logic (e.g., context-dependent harm); creates massive maintenance debt (slur lists never keep up); encourages adversarial evasion (misspelling, dog whistles).
  2.  **Two-Tier System:** Public guidelines remain vague/values-based; internal playbooks are strictly descriptive.
      *   *Pros:* Honest about values; gives raters flexibility.
      *   *Cons:* Creates a transparency gap (users don't know real rules); engineering pipeline still has to parse the vague public terms for automated routing; legal risk remains on the public doc.
  3.  **Operationalized Normatives (Recommended):** We keep evaluative terms (e.g., "degrading") but treat them as *calibrated standards* rather than *static definitions*. We define them via example sets and ongoing rater training, not checklists.
      *   *Pros:* Captures compound logic; adaptable to novel harms; honest about the nature of the judgment.
      *   *Cons:* Requires continuous calibration (not one-off writing); lower initial kappa on complex rules (requires human review escalation).

  ***

  **MEMORANDUM**

  **TO:** Policy Language Working Group
  **FROM:** [Your Name], Enforcement Pipeline Engineering
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Drafting Convention for Community Guidelines

  **Recommendation**

  I recommend we adopt **Option 3: Operationalized Normatives**. We should retain evaluative terms like "harassing" or "degrading" in the Guidelines but explicitly define them as *calibrated standards* rather than objective facts. We will not attempt to eliminate value judgments from the text. Instead, we will anchor those judgments to specific example sets and calibration workflows. This allows us to write compound rules that actually cover harm without pretending our pipeline can detect "badness" via simple keyword matching.

  **Rewrite of Rule 4.2**

  *Current Draft:* "If a post mocks someone for a characteristic they had no hand in choosing, and the target is a private figure, escalate to human review."

  *Priya's Descriptive Attempt:* "If post contains term from List L AND target type = Private Figure, escalate." (Rejected: misses context, easily evaded).

  *Recommended Operationalized Version:* "Content targeting a private figure is subject to review if it attacks immutable characteristics (e.g., race, disability). **Definition:** 'Attacks' includes content classified as derogatory in Calibration Set D-12. Automated enforcement is disabled; all matches route to human review."

  This version keeps the evaluative core ("attacks/derogatory") but admits it requires human judgment anchored by examples (Set D-12), rather than pretending a boolean flag exists.

  **Addressing Policy and Legal Concerns**

  Priya's concern is valid: evaluative words are not facts. When we write "degrading," we are indeed expressing a stance, not describing a physical property like "contains image." Legal is also right that vague standards can be read as admissions of liability if we fail to meet them.

  However, eliminating these words creates a greater risk. If we pretend our rules are purely descriptive, we invite users to prove us wrong on factual grounds ("I didn't use a slur, so I wasn't harassing"). By acknowledging the normative nature of the rules, we shift the debate to whether the *standard* was applied consistently, which is easier to defend with calibration data than a static list. We cannot code our way out of value judgments; we can only manage them. The legal risk of vagueness is mitigated by coupling the term with a clear escalation path (human review) rather than automated removal.

  **Atomic vs. Compound Cases**

  There is a structural reason why Priya's scheme works for atoms but fails for compounds. Atomic cases (e.g., "contains nudity") are observational. Raters agree because they are looking at the same pixels.

  Compound cases (e.g., "mocks for a characteristic") are interpretive. They require understanding the relationship between the content, the target, and the context. In logic, uncertainty compounds. If a rater is 90% sure a post is "mocking" and 90% sure the target is "private," the confidence that *both* conditions trigger the rule is lower than either alone. This is why kappa drops on compounds.

  To fix this, we must stop treating evaluative terms as boolean switches in the pipeline. They are not `True/False`; they are `Confidence Scores`. When a rule says "if degrading," the engineering implementation is actually "if probability(degrading) > 0.8." This allows us to put "boo" inside an if-clause honestly: we are checking for a high-confidence consensus on the attitude, not a fact of the world.

  **Failure Conditions**

  We will know this recommendation has failed if, within two quarters:
  1.  **Appeals Overturn Rate > 15%:** This indicates raters are applying the calibrated standards inconsistently despite training.
  2.  **Evasion Spike:** If we see a rise in novel harassment tactics that bypass the "Operationalized" definitions because we relied too heavily on past examples (Set D-12) without updating them.
  3.  **Rater Burnout:** If the cognitive load of interpreting standards rather than checking lists causes reviewer throughput to drop by >20%.

  **Conclusion**

  We cannot write policy that pretends not to be policy. Let's write rules that reflect the judgment we actually expect, and build the pipeline to support that judgment rather than forcing the judgment to fit the pipeline.
