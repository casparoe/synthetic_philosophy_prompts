answer: |-
  # PROTOCOL FOR EPISTEMIC TRIAGE IN CLINICAL EVENT INTERVIEWS
  **Version 1.0 | Learning From Events Division**
  **Applicability:** All post-event clinician interviews (Days 3–14)

  ## PREFACE: THE CORE ASSUMPTION
  This protocol operates on the assumption that human beings do not have direct, veridical access to the cognitive processes that cause their actions. When asked "Why did you do that?", clinicians often provide a *plausible story* generated after the fact, not a *recording* of the mental event. This is not lying; it is how human memory works. Our goal is to separate **Action Traces** (what the body did) from **Causal Narratives** (why the mind did it).

  ---

  ## 1. CLASSIFICATION OF FIRST-PERSON REPORTS
  *Sort every significant statement in the transcript into one of these five categories. This determines its evidentiary weight.*

  | Category | Definition | Example | Epistemic Status |
  | :--- | :--- | :--- | :--- |
  | **A. Perceptual Anchors** | Reports of sensory input (visual, auditory, tactile) present at the time. | "The monitor was beeping." "The vial was blue." | **High.** Sensory memory is robust, though subject to gaze bias. |
  | **B. Motor/Action Traces** | Reports of physical manipulation or sequence of movements. | "I pushed the plunger." "I typed the order." | **Medium-High.** Procedural memory is durable, but sequencing can be smoothed over. |
  | **C. Occurrent Affect/Sensation** | Reports of immediate internal physical/emotional states. | "My heart raced." "I felt a sudden jolt of fear." | **Medium.** Somatic markers are hard to fake, but labeling is interpretive. |
  | **D. State Self-Assessment** | Reports of enduring conditions or capacities. | "I was tired." "I was distracted." "I was confident." | **Low-Medium.** Highly susceptible to post-hoc justification (e.g., "I missed it because I was tired"). |
  | **E. Causal Attribution** | Reports explaining the link between thought and action. | "I ignored the alarm because I knew it was faulty." "I chose X because I ruled out Y." | **Very Low.** This is the primary site of confabulation (Nisbett & Wilson). We rarely access the actual trigger. |

  **Sorting Rule:** If a statement explains *why* an action occurred (Category E), it must be treated as a **Hypothesis** offered by the clinician, not a **Fact** established by the interview, unless corroborated by Category A or B evidence (e.g., logs, witnesses).

  ---

  ## 2. TRIAGE OF INTERVIEW QUESTION FORMATS
  *Assign a Credence Weight (0.0–1.0) to answers based on the question type. This weight applies if **no external corroboration** exists.*

  | Question Format | Risk Profile | Credence Weight | Required Corroboration to Raise Weight |
  | :--- | :--- | :--- | :--- |
  | **Behavioral Reconstruction**<br>("Walk me through the clicks." "Show me where your hands were.") | Low. Forces retrieval of procedural memory. | **0.7** | EMR audit logs, video, physical layout verification. |
  | **Sensory Query**<br>("What did the screen look like?" "What sound did you hear?") | Low-Medium. Retrieval of perceptual memory. | **0.6** | Device settings, alarm logs, witness confirmation. |
  | **State Inquiry**<br>("How many hours had you worked?" "When did you last eat?") | Medium. Objective facts about state, not subjective feeling. | **0.5** | Rosters, badge swipes, cafeteria logs. |
  | **Narrative Reasoning**<br>("What was your rationale?" "Why did you decide that?") | High. Invites folk-psychological construction. | **0.2** | Contemporaneous notes, verbalization to colleague at the time. |
  | **Counterfactual/Hypothetical**<br>("Would you have caught it if...?" "Did you consider...?") | **STOP.** | **0.0** | **N/A** |

  **Question Type to Stop Asking:** *"Did you consider [Diagnosis X]?"* or *"What was your reasoning for ruling out [Condition Y]?"*
  **Why:** This assumes the clinician had conscious access to a differential diagnosis list that may have been intuitive or automatic. It invites them to generate a list that makes them look competent.
  **Ask Instead:** *"What specific findings were present at 0200 that supported your working diagnosis?"* (Focus on data anchors, not mental lists).

  ---

  ## 3. QUESTION REWRITES
  *Replace standard interview prompts with protocol-endorsed versions.*

  | Original Question (Retire) | Protocol Version (Adopt) | Function of Rewrite |
  | :--- | :--- | :--- |
  | 1. "Why did you override the alarm?" | "What was happening in the room immediately before you touched the alarm?" | Shifts from *reason* (confabulation) to *context* (retrieval). |
  | 2. "What was your differential diagnosis?" | "Which diagnoses did you document or discuss with a colleague before 0400?" | Shifts from *memory of thought* to *memory of communication*. |
  | 3. "Did you feel rushed?" | "How many active patients were on your load at that hour?" | Shifts from *subjective state* to *objective workload*. |
  | 4. "Why didn't you check the allergy list?" | "Walk me through the screens you opened after scanning the wristband." | Shifts from *omission* to *action sequence*. |
  | 5. "Were you confident in that decision?" | "What specific data point made you decide to proceed?" | Shifts from *internal feeling* to *external anchor*. |
  | 6. "What were you thinking when the patient crashed?" | "What was the first thing you said or did after the monitor changed?" | Shifts from *introspection* to *observable reaction*. |
  | 7. "Did you know the protocol required two checks?" | "When was the last time you reviewed the protocol for this med?" | Shifts from *knowledge claim* to *training history*. |
  | 8. "How tired were you on a scale of 1-10?" | "How many hours of sleep did you get in the 24 hours prior?" | Shifts from *interpretive scale* to *quantifiable metric*. |
  | 9. "Why did you dismiss the second alert?" | "Did the alert appear before or after you started the infusion?" | Shifts from *motivation* to *timing*. |
  | 10. "What would you do differently?" | "Which step in the process failed to match the protocol?" | Shifts from *virtue signaling* to *process mapping*. |

  ---

  ## 4. EXPLICIT STOPPING POINTS
  *When evidence is insufficient to verify a Category D (State) or E (Causal) claim, do not infer. Use these exact phrases in the final report.*

  **Scenario:** Clinician claims a cognitive process (e.g., "I considered sepsis") but there is no documentation or witness.
  **Report Phrasing:** *"Dr. [Name] reports having considered [Condition]. No contemporaneous documentation or witness testimony corroborates this cognitive step. Per Interview Protocol Section 4, the presence of this consideration is recorded as **Unverified Self-Report**."*

  **Scenario:** Clinician attributes error to fatigue/distraction, but objective data is ambiguous.
  **Report Phrasing:** *"Dr. [Name] attributes the deviation to [State]. While roster data confirms [Condition], there is insufficient evidence to establish [State] as the causal mechanism. This remains a **Supported Hypothesis**."*

  **Scenario:** Conflicting accounts of memory (e.g., Day 1 vs. Day 11).
  **Report Phrasing:** *"The clinician's account of [Event] varies between the initial exchange and the formal interview. As the formal interview occurred [X] days post-event, the protocol treats the initial exchange as the higher-fidelity anchor for [Specific Detail]."*

  **Rule:** If a statement falls into Category E (Causal Attribution) without corroboration, it cannot be listed in the "Findings of Fact" section of the report. It must appear in "Clinician Account" with the qualifier above.

  ---

  ## 5. REFLEXIVITY CLAUSE
  *The interviewer's intuition is also data, but it is low-weight data.*

  **The Rule:** The investigator's sense that a clinician is "inventing an answer" is itself an introspective judgment (Category D/E). It is subject to the same skepticism we apply to the clinician.
  **Weight:** **0.3**. (Low credence on its own).
  **Corroboration Required:** To elevate this judgment to "Investigator Finding," one of the following must exist:
  1.  **Transcript Markers:** Measurable hesitations, self-corrections, or contradictions visible in the text recording.
  2.  **Second Observer:** A second interviewer independently notes the same behavioral markers.
  3.  **External Contradiction:** The "felt" deception is matched by hard data (e.g., clinician says "I checked," log says "No").

  **Reporting:** Do not write "The clinician seemed evasive." Write: *"The clinician paused for >10 seconds before answering Question 4 and offered two conflicting timelines for the same event."*

  ---

  ## 6. APPENDIX: PHILOSOPHICAL BETS
  *This protocol is not neutral. It makes the following philosophical wagers. If these are wrong, the protocol fails.*

  | The Bet | The Assumption | What Breaks If Wrong |
  | :--- | :--- | :--- |
  | **1. Introspection is Constructive** | We do not "see" our reasons; we infer them (Nisbett/Wilson). | If clinicians *do* have direct access to causal processes, we are undervaluing crucial safety data. |
  | **2. Skilled Action is Automatic** | Expert clinicians operate on intuition/pattern recognition, not deliberate reasoning (Dreyfus). | If expert action is highly deliberative, our focus on "action traces" misses the actual error source (flawed reasoning). |
  | **3. Memory Decays Rapidly** | Recall accuracy drops significantly after 24 hours (Loftus/Ebbinghaus). | If "flashbulb memories" of trauma are veridical, we are discarding accurate Day-11 accounts. |
  | **4. Transparency is Limited** | We know our beliefs by looking at the world, not inside ourselves (Byrne/Schwitzgebel). | If clinicians can accurately report beliefs independent of evidence, our demand for "anchors" is bureaucratic obstruction. |

  ---

  # CASE RUNS

  ### CASE 1: The Confident Nurse
  **Scenario:** Nurse administers drug via wrong line. Interview Day 11. Account is coherent, minute-by-minute. Consistent with logs. *However*, on Day 0, she told a colleague: "I can't remember which line I drew from."
  **Protocol Application:**
  *   **Classification:** Her Day 11 account of *why* she chose the line is Category E (Causal Attribution). Her Day 0 statement is Category B (Action Trace admission of gap).
  *   **Weights:** Day 11 Coherence (0.2 for reasoning). Day 0 Admission (0.7 for memory state).
  *   **Stopping Point:** Section 4 applies. We cannot accept the Day 11 reasoning as fact.
  *   **Report Output:** *"Nurse [Name] provides a coherent account of line selection on Day 11. However, a contemporaneous statement on Day 0 indicates uncertainty regarding line selection at the time. Per Protocol Section 4, the specific cognitive process for line selection is **Undetermined**. The action (administration via wrong line) is **Confirmed**."*
  *   **Judgment as Method:** The weight assigned to the Day 0 comment (0.7) vs Day 11 (0.2) is a heuristic. We are betting that proximity to event trumps narrative coherence.

  ### CASE 2: The Exhausted Resident
  **Scenario:** Resident misses finding. Claims "I was exhausted." Roster confirms two consecutive night shifts. No other evidence of impairment.
  **Protocol Application:**
  *   **Classification:** "I was exhausted" is Category D (State Self-Assessment). Roster is External Corroboration.
  *   **Weights:** Self-Assessment (0.5). Roster (0.9).
  *   **Triangulation:** The roster confirms the *opportunity* for fatigue, not the *state* of fatigue.
  *   **Report Output:** *"Dr. [Name] reports fatigue as a contributing factor. Roster data confirms two consecutive night shifts, supporting the plausibility of this claim. However, no objective measure of impairment (e.g., psychomotor testing) exists. Fatigue is recorded as a **Supported Hypothesis**."*
  *   **Judgment as Method:** We are treating "plausibility" as a middle ground between "Fact" and "Fiction." This is a policy decision, not a scientific measurement.

  ### CASE 3: The Attending and the Missed Diagnosis
  **Scenario:** Attending missed a diagnosis. Patient harmed. Plaintiff involved. Attending says: "I considered it and rejected it based on the labs." No documentation of this thought. No witness.
  **Protocol Application:**
  *   **Classification:** "I considered and rejected" is Category E (Causal Attribution).
  *   **Weights:** Self-Report (0.2). Corroboration (0.0).
  *   **Stopping Point:** Section 4 (Unverified Self-Report).
  *   **The Hard Conclusion:** We cannot report that he considered it. To do so is to validate a confabulation that protects him from negligence.
  *   **Report Output:** *"Dr. [Name] states he considered [Diagnosis] and rejected it based on lab values. There is no documentation in the progress notes, order history, or handoff communication reflecting this consideration prior to the adverse event. Per Protocol Section 4, the cognitive process of differential diagnosis is **Unverified**. The report records the *claim* of consideration, but does not validate it as a fact of the timeline."*
  *   **Justification for Withholding Judgment:** Validating this claim without evidence creates a precedent that verbal assertion overrides documentation. In a legal context, stating "He considered it" as a fact exposes the hospital to claims of covering up a lack of due diligence. Stating "He claims he considered it" protects the integrity of the review process.
  *   **Judgment as Method:** The decision to prioritize documentation over verbal assertion in high-liability cases is a legal/ethical bet, not purely epistemic. We are assuming documentation is a better proxy for thought than memory.

  ---

  # FLAG: JUDGMENT WEARING THE COSTUME OF METHOD
  *The following points in this protocol are not scientific laws; they are policy choices disguised as weights.*

  1.  **The Weights (0.2 vs 0.7):** There is no empirical scale where "Perceptual Anchor" is exactly 3.5x more reliable than "Causal Attribution." These numbers are placeholders to force the team to stop treating all sentences as equal facts.
  2.  **The "Day 0" Priority:** In Case 1, we prioritized the off-hand comment over the formal interview. This assumes stress on Day 0 didn't *also* corrupt memory. It might have. We chose "Proximity" as the tie-breaker arbitrarily.
  3.  **The Documentation Bet:** In Case 3, we assume "If it isn't written, it didn't happen." Clinicians think constantly without writing. We are penalizing unwritten thought to incentivize documentation, not because we know for sure he didn't think it.
  4.  **The "Supported Hypothesis" Category:** This is a bureaucratic invention. Epistemically, a hypothesis is either supported or it isn't. We created this middle category to allow clinicians to save face without the hospital admitting liability.
  5.  **The Reflexivity Threshold:** Requiring "10 seconds of hesitation" to validate an interviewer's gut feeling is arbitrary. Some liars don't hesitate. Some truth-tellers do. We chose this to prevent "vibe-based" investigations.

  **END OF PROTOCOL**
