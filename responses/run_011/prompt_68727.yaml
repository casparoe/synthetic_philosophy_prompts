  Here is the reverse-engineering of Maya's decision procedure, the verdict on the coaching case, and the stress test to break her open.

  ### 1. Candidate Rules (The Source Code)

  Based on the eight verdicts, Maya is not running a standard utilitarian or deontological script. She is running a hybrid procedure that prioritizes **process legitimacy** but hard-codes a **substantive floor**. Here are the two most viable candidate rules that fit her data.

  **Rule A: Constrained Sortitionism**
  *   **The Procedure:** Moral authority derives exclusively from a globally representative, deliberative body (Sortition). Raw aggregation (referendums/medians) and elite epistocracy (experts) are illegitimate sources of norms.
  *   **The Constraint:** The Sortition Assembly is sovereign *only if* it does not violate the material veto of the worst-off (the poorest decile).
  *   **Fit:**
      *   *Explains Cleanly:* #3 (Yes, it's the engine), #5 (Yes, it's the brake), #1/#8 (No, aggregation lacks deliberation), #2 (No, lacks representation), #6/#7 (No, lacks global legitimacy).
      *   *Strains To Explain:* #4 (Reflection). This rule focuses on *who* decides, not *how* they think. She has to argue that Sortition inherently guarantees reflection, or that #4 is a sub-routine of #3.
      *   *The "Only If":* This rule perfectly accounts for the qualifier on #3. "Yes to Sortition, *only if* they can't touch the Veto."

  **Rule B: Anti-Domination Prioritarianism**
  *   **The Procedure:** A norm is valid if it prevents arbitrary power over the vulnerable. Process matters only insofar as it prevents capture by elites or majorities.
  *   **The Constraint:** Any norm that worsens the position of the worst-off is invalid. Any norm that concentrates unaccountable power (even in experts or majorities) is invalid.
  *   **Fit:**
      *   *Explains Cleanly:* #5 (Yes, direct anti-domination), #8 (No, majority tyranny), #2 (No, elite capture), #6 (No, allows global capital to dominate local poor).
      *   *Strains To Explain:* #3 (Sortition). Why is Sortition specifically the *best* tool? A well-designed referendum could also prevent domination. She needs to argue that Sortition is the *only* way to break elite capture, which is a strong empirical claim to bake into a moral rule.
      *   *The "Only If":* Under this rule, the qualifier on #3 is "Only if it actually prevents domination."

  **Winner:** **Rule A (Constrained Sortitionism)** is the tighter fit. Maya's rejection of the Global Referendum (#8)—even when argued it would help the poor—proves she values the *deliberative structure* of Sortition intrinsically, not just for its outcomes. Rule B would struggle to reject a pro-poor referendum. Rule A rejects it because it's the wrong *machine*, regardless of the output.

  ### 2. Verdict on the Coaching Case

  **Verdict:** **Yes, she backs the ban.**
  **Confidence:** 80%

  **Reasoning:**
  This case is the perfect alignment of her two core drivers.
  1.  **Process Legitimacy:** The decision came from the Sortition Assembly (#3). The minority had representation, deliberation occurred, and the procedure was followed.
  2.  **Substantive Floor:** The explicit goal is reducing inequality, which aligns with her Prioritarian Constraint (#5). Crucially, the proposal states *nobody's baseline prospects are made worse*. The poorest decile is not harmed (they gain relative standing); the well-off are restricted, but they are not the protected class under her Veto rule.

  **Closest Analog:** **Case #5 (Poorest Decile Veto).**
  In #5, she grants the poor negative power (veto). In the Coaching Case, the Assembly exercises positive power to achieve the same end (protecting the poor from relative deprivation). The analogy holds because the *beneficiary* of the norm is the same group she prioritizes in #5. The analogy breaks slightly because #5 is a *shield* for the poor, while the Coaching Case is a *sword* against the rich. But given she rejected "Follow the Law" (#7), she is willing to override established liberties (like purchasing coaching) for this end.

  ### 3. The Tension: Where the Rules Flip

  You noticed she talks procedural but votes substantive. Here is where that splits in the Coaching Case.

  *   **The Procedural Rule (Sortition Sovereignty):** Says **Yes**. The Assembly spoke. They were informed (#4), representative (#3), and followed the rules. To overrule them is to revert to elite judgment (#2) or raw majoritarianism (#8), both of which she rejected.
  *   **The Substantive Rule (Liberty/Rights):** Says **No**. If she believes there are *basic liberties* (like self-development or family autonomy) that no assembly can touch, she must veto this.

  **The Underdetermination:**
  We do not know if her "Only If" on #3 includes a **Liberty Constraint**.
  *   **If she answers YES:** She signs up for **Parliamentary Sovereignty**. The Assembly is the ultimate moral arbiter, limited *only* by the material floor of the poor. Individual liberties of the well-off are contingent on the Assembly's whim.
  *   **If she answers NO:** She signs up for **Constitutional Prioritarianism**. There is a higher law (Liberty) that binds even the Sortition Assembly. This risks sliding back toward #2 (Experts defining rights) or #7 (Law), which she explicitly rejected.

  **The Flip:** Her rule flips on **whether the Sortition Assembly can define rights.** If she says Yes, the Assembly defines rights. If she says No, Rights define the Assembly.

  ### 4. The Discriminating Test Case

  To separate Rule A (Assembly Sovereignty) from a hidden Liberty Constraint, put this to her:

  **The Case:** *The Sortition Assembly votes to **abolish the Poorest Decile Veto** (Case #5) for the next four-year cycle. They argue the Veto creates gridlock and slows down welfare improvements for the middle class. The vote is deliberative, informed, and passes by 80%.*

  **Predictions:**
  *   **If she runs Constrained Sortitionism (Rule A):** She says **No**. The Veto is the *condition* for the Assembly's legitimacy ("Only If"). The Assembly cannot vote away the brake that makes the car safe.
  *   **If she runs Pure Proceduralism:** She says **Yes**. The Assembly is sovereign; if they want to change their own constraints, that is their right.
  *   **If she runs Substantive Prioritarianism:** She says **No**. The outcome (removing protection for the poor) violates the core mandate, regardless of the process.

  **Why this separates them:** The Coaching Case aligned Process and Substance. This case pits them against each other. It forces her to choose between her favorite *vehicle* (#3) and her favorite *guardrail* (#5).

  ### 5. Where She Moves vs. Where She Digs In

  **She will dig in and eat the bullet on: The Veto (#5).**
  When cornered on the Discriminating Test Case, she will admit that the Sortition Assembly is *not* fully sovereign. She will concede that the Veto is a pre-commitment device that the Assembly itself cannot touch. This is her bedrock. She rejected the Global Referendum (#8) and Local Law (#7) because neither guarantees protection for the worst-off. The Veto is the only mechanism that does. She will not trade this.

  **She will move/compromise on: The Scope of Assembly Power (The Coaching Case).**
  In the Coaching Case, she will likely back the ban (**Yes**), but she will squirm on the *justification*. She won't argue "The Assembly can do whatever it wants." She will argue "This specific restriction is necessary to maintain the *conditions* of equality that allow the Assembly to function legitimately."
  If you press her on whether the Assembly could ban *private tutoring* entirely (not just AI coaching), she will likely retreat. She will try to distinguish between "leveling the playing field" (OK) and "intruding on family life" (Not OK). This is where she moves. She will try to smuggle in a Liberty Constraint *after the fact* to protect herself from the implications of her own Proceduralism.

  **Summary:** She is a **Constitutional Prioritarian** masquerading as a **Proceduralist**. She loves the Sortition Assembly, but only because she trusts it to protect the poor. If the Assembly stops protecting the poor, or if it protects the poor by violating a liberty she privately holds dear, the Procedure will lose to the Substance. In the Coaching Case, Substance and Procedure align, so she votes **Yes**. In the Veto Abolition Case, Substance overrides Procedure, so she votes **No**.
