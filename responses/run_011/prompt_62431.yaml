answer: |-
  You are not talking nonsense. In fact, your hypothesis is remarkably close to how professional philosophers of law and ethics map this dispute. You have correctly identified that the stalemate isn't primarily about data (empirics) or dictionary definitions (verbal), but about **moral ontology**—the study of what kind of "thing" a social institution is.

  Here is the breakdown of the situation, separating the philosophical landscape from the legal reality, critiquing your analogy, and assessing the possibility of progress.

  ### 1. The Diagnosis: Is it a Category Error?

  **Verdict:** You are largely correct. The disagreement is substantive, but it rests on incompatible metaphysical premises about social kinds.

  In philosophical terms, Camp A holds a **Natural Law / Moral Realist** view. They believe marriage is a "pre-political" reality. It exists independently of the state, much like "friendship" or "promise-keeping" exist independently of contract law. The state can recognize it or ignore it, but it cannot change what it *is* without breaking the link between the institution and the human goods it serves (flourishing, child-rearing).

  Camp B holds a **Social Constructivist / Liberal Conventionalist** view. They believe marriage is a "political" artifact. It is a tool created by societies to solve coordination problems (stability, caregiving, property). Like "money" or "citizenship," its definition is contingent on what the collective decides will best serve justice or utility at a given time.

  **Why nobody moves:**
  You hypothesized they aren't arguing about the same object. That is accurate.
  *   When Camp A says "Marriage," they refer to a **moral truth** they believe they have discovered.
  *   When Camp B says "Marriage," they refer to a **legal status** they believe society maintains.

  When Camp A argues, they are arguing from *ontology* (what is this thing?). When Camp B argues, they are often arguing from *public policy* (what does this label do?). They talk past each other because Camp B thinks Camp A is imposing a sectarian metaphysics on the law, and Camp A thinks Camp B is dismantling a reality that sustains society.

  ### 2. Sorting the Disagreement

  You offered five options. Here is how they stack up:

  1.  **Substantive disagreement about essences/functions:** **YES.** This is the core. Camp A believes marriage has a telos (purpose) inherent to human biology and rationality. Camp B believes marriage has a function assigned by human agreement.
  2.  **Verbal fight over "is" and "for":** **NO.** If it were merely verbal, they could agree to use different words. They don't, because both sides want the *state's* stamp of approval on their definition. The fight is over who controls the social meaning of the term.
  3.  **Two different questions sharing one label:** **PARTIALLY.** One question is moral/religious ("What is the good of marriage?"). The other is legal/political ("What should the state license?"). The conflict arises because both sides insist the answer to the second question depends on the answer to the first.
  4.  **Hidden empirical question:** **NO.** Both sides cite social science (divorce rates, child outcomes), but the data is always interpreted through their theoretical framework. Camp A sees high divorce rates as proof the definition was weakened; Camp B sees them as proof the old definition was oppressive. Empirics cannot settle normative disputes.
  5.  **Bedrock intuitions:** **YES.** Ultimately, this rests on whether you believe moral truths are *discovered* (Camp A) or *constructed* (Camp B). You cannot prove this via argument; it is a foundational worldview.

  ### 3. Critiquing Your API Analogy

  Your analogy is strong, but you asked where it smuggles in metaphysics. Here is the breakdown:

  **Where it works:**
  *   **Camp A (Protocol Spec):** Treats marriage like an RFC (Request for Comments). The spec exists before the implementation. If you implement it incorrectly (e.g., allow non-exclusive unions), the system throws errors (social decay, unhappiness), regardless of whether the compiler (the State) accepts the code.
  *   **Camp B (Typedef):** Treats marriage like a variable type defined in the main application. The maintainers (society/legislature) can refactor the typedef to point to a different struct if the requirements of the application change.

  **Where it smuggles metaphysics:**
  1.  **The "Author" Problem:** You wrote "a protocol spec somebody wrote." Camp A does not believe a "somebody" wrote the spec in the sense of a coder. They believe the spec is derived from *reason* observing *nature*. In code, a spec implies a designer. In Natural Law, the "spec" is immanent in reality. Your analogy accidentally leans toward Intelligent Design, whereas Camp A argues for Philosophical Realism.
  2.  **The "Runtime" Problem:** In code, if you change a typedef, the old code breaks. In society, Camp B argues the "runtime" (culture) is fluid. Camp A argues the "hardware" (human nature) is fixed. Your analogy assumes a digital environment where the hardware is distinct from the software. Camp A argues human biology *is* the hardware that dictates the software constraints.
  3.  **Normative Force:** In coding, you follow the spec to avoid bugs. In marriage, Camp A argues you follow the spec to achieve *flourishing*. "Bugs" in human life aren't as clear-cut as segmentation faults. This hides the difficulty of proving Camp A's claims.

  ### 4. The Expert Landscape: Settled vs. Contested

  You asked for a separation of what is settled among experts versus what is live.

  **The Legal Consensus (Settled):**
  In the United States and most Western liberal democracies, the **legal** question is settled. The state defines marriage as a contract between consenting adults, regardless of sex. *Obergefell v. Hodges* (2015) is the binding precedent. No serious legal scholar argues the state will revert to the conjugal definition in the near future.

  **The Philosophical Consensus (Non-Existent):**
  Among philosophers of law, ethics, and political theory, there is **no consensus**.
  *   **Camp A (The Conjugal View):** The primary contemporary defenders are **Robert P. George, Sherif Girgis, and Ryan T. Anderson**. Their book *What is Marriage? Man and Woman: A Defense* (2012) is the standard text. They argue from secular natural law, not just religion. They are a minority in academia but hold significant influence in conservative legal circles (e.g., the Federalist Society).
  *   **Camp B (The Revisionist View):** This is the dominant view in mainstream liberal political philosophy. Key figures include **Elizabeth Brake** (*Minimizing Marriage*), **Jonathan Rauch**, and **Andrew Sullivan**. They argue that state involvement in marriage should be minimized or redefined to ensure equal liberty.
  *   **The "Abolitionist" Middle:** A third group, including some feminists and liberals (e.g., **Claire Chambers**, **Tamara Metz**), argues the state should exit the marriage business entirely ("disestablishment"), leaving it to religious or private communities. This is a live, contested proposal.

  **Who disagrees about what:**
  *   **George vs. Brake:** They agree the state is involved, but disagree on *why*. George says the state recognizes a pre-existing good. Brake says the state creates a privilege that should be distributed justly.
  *   **Rauch vs. Traditionalists:** Rauch argues that extending marriage stabilizes norms. Traditionalists argue that redefining marriage severs the link between marriage and child-rearing, weakening the norm.

  ### 5. What Counts as Progress?

  Since this is a bedrock metaphysical disagreement, "progress" in the sense of one side convincing the other is unlikely. However, progress can be made in **framing**.

  **1. Distinguish "Comprehensive" from "Political"**
  Political philosopher **John Rawls** offered a way out: In a pluralistic society, the law should not rely on "comprehensive doctrines" (like Camp A's view of human nature or Camp B's view of autonomy) that not all citizens share.
  *   *Progress:* Moving the debate from "What is the truth about marriage?" to "What is the state's legitimate interest?"
  *   *Result:* This leads to the "abolitionist" or "contract" view (let the state handle contracts, let communities handle "marriage"). This doesn't solve the cultural fight, but it clarifies the legal one.

  **2. Accept "Modus Vivendi"**
  Philosopher **John Gray** argues that some conflicts cannot be resolved, only managed.
  *   *Progress:* Acknowledging that Camp A and Camp B are describing different social technologies. Camp A is describing a **kinship system**. Camp B is describing a **caregiving contract**.
  *   *Result:* We stop expecting the law to enforce the kinship system and accept it as a caregiving contract, while allowing Camp A to maintain the kinship system within their private communities (churches, families).

  **3. The Empirical Dead End**
  Stop looking for data to settle this.
  *   *Why:* Camp A interprets data through the lens of "institutional norms." Camp B interprets data through the lens of "individual well-being."
  *   *Progress:* Acknowledging that social science describes *correlations*, not *ontologies*. Data can tell you if children do better in stable homes; it cannot tell you if marriage *is* essentially about children.

  ### Summary for a Backend Dev

  *   **The Bug:** You are trying to debug a logic error in the application layer (law/culture), but the conflict is in the kernel (metaphysics/ontology).
  *   **The Stack:**
      *   **Kernel:** Human Nature (Fixed vs. Malleable).
      *   **OS:** Political Theory (Natural Law vs. Liberal Constructivism).
      *   **App:** Marriage Law (Conjugal vs. Consent-based).
  *   **The Status:** The App layer has been patched (Same-Sex Marriage legal). The OS layer is still throwing exceptions because the Kernel drivers are incompatible.
  *   **The Fix:** There is no patch. You have to run parallel instances. The state runs the "Consent" instance. Private communities run the "Conjugal" instance. The error occurs when users expect the State instance to validate the Private instance's logic.

  **Final Verdict:** Your hypothesis is sound. The fight is downstream of a metaphysical argument about whether social institutions have essences. Experts agree the legal battle is over, but disagree fundamentally on the moral ontology. Progress lies not in winning the argument, but in decoupling the legal definition from the moral definition, allowing both "specs" to exist in different domains without demanding the state enforce one as universal truth.
