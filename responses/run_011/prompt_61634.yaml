answer: |-
  This is an excellent set of intuitions. Your nagging feelings are well-founded; the passage you quote captures the *spirit* of Plutarch's project (moral didacticism) but caricatures his *method* (fabrication) and underestimates his *value* as a historical source.

  Here is a sentence-by-sentence breakdown from the perspective of a classicist specializing in ancient biography, followed by an evaluation of the hagiography comparison and the final claim about evidence.

  ### Sentence-by-Sentence Critique

  **1. "Plutarch announces at the start of his life of Alexander that he is writing lives rather than histories, because a phrase or a jest often reveals more about a man than a battle in which thousands die."**
  *   **Verdict:** **Accepted.**
  *   **Commentary:** This is a faithful paraphrase of *Alexander* 1.2–3. Plutarch explicitly distinguishes *bios* (life) from *historia* (history). He argues that great deeds do not always illuminate virtue or vice as clearly as smaller incidents. A classicist would accept this as an accurate summary of Plutarch's stated programmatic intent.

  **2. "His real subject is therefore the private man: campaigns and politics form only the backdrop against which the anecdotes do their work."**
  *   **Verdict:** **Defensible Simplification (but misleading).**
  *   **Commentary:** This is where your first objection hits home. While Plutarch prioritizes character, he does not view "private" and "public" as we do. For a Greco-Roman aristocrat, character is *revealed* in public action. Campaigns and politics are not merely "backdrop"; they are the testing ground of virtue.
  *   **Correction:** A classicist would argue that for Plutarch, the political and military narrative *is* the biography. The anecdotes punctuate the narrative, but they do not replace it. To say campaigns are "only the backdrop" suggests they are incidental, whereas Plutarch spends vast amounts of text detailing them (e.g., the bulk of *Caesar* or *Pompey*). They are the canvas, not the frame.

  **3. "Because his purpose is moral improvement rather than accuracy, he felt free to reshape the record and sometimes to invent episodes where it was thin, and he treats each subject as a case study in a virtue or a vice."**
  *   **Verdict:** **Mixed: "Reshape" is Accepted; "Invent" is Contradicted.**
  *   **Commentary:** This is the most dangerous sentence in the passage.
      *   **Reshape:** Accepted. Plutarch selects, omits, and emphasizes material to create a coherent moral portrait. He arranges events thematically rather than strictly chronologically. This is "reshaping."
      *   **Invent:** Contradicted. Plutarch never claims the license to invent. In fact, in *On the Malice of Herodotus*, he criticizes other writers for distorting the truth. While modern scholars (like C.B.R. Pelling) acknowledge that Plutarch might dramatize dialogue or conflate events for narrative flow, stating he "felt free... to invent episodes" implies a fictionalizing method he did not claim and likely did not practice as a rule. He works with received traditions, even dubious ones, preferring to cite a source ("some say...") than to fabricate.
      *   **Case Study:** Accepted. The *Lives* are fundamentally ethical inquiries.

  **4. "In all this he is doing what the writers of saints' lives would do a couple of centuries later, minus the miracles: he offers the reader a single exemplary figure to imitate."**
  *   **Verdict:** **Defensible Simplification.**
  *   **Commentary:** This anticipates the hagiography question. It is true that both genres are didactic and exemplary. However, the simplification lies in the nature of the "imitation." (See the Hagiography section below for the nuance).

  **5. "The upshot is that the Lives tell us a great deal about Plutarch's moral imagination and very little about the men they describe, so anyone wanting evidence has to look elsewhere."**
  *   **Verdict:** **Contradicted.**
  *   **Commentary:** This is where your second objection is vital. This claim is historically unsustainable. For figures like Alcibiades, Coriolanus, Pyrrhus, or Mark Antony, Plutarch is frequently our *most detailed* or *only* continuous narrative source. To say they tell us "very little about the men" ignores that without Plutarch, we would know almost nothing. While the material is filtered through Plutarch's moral lens, it remains evidence about the subject, not just the author. The instruction to "look elsewhere" is often impossible because "elsewhere" consists of fragments or silence.

  ---

  ### The Hagiography Comparison: Anticipation or Obscuration?

  The comparison to hagiography (saints' lives) is a common trope in popular writing, but a classicist would argue it **obscures more than it reveals**, specifically regarding the reader's engagement.

  **Where it holds (Anticipation):**
  *   **Didacticism:** Both genres aim to improve the reader.
  *   **Exemplarity:** Both present a figure whose life offers a pattern to follow (or avoid).
  *   **Source Handling:** Both prioritize edifying truth over strict chronological archival accuracy.

  **Where it fails (Obscuration):**
  *   **The Nature of the Hero:** Plutarch's subjects are statesmen and generals, flawed and complex. Hagiography often moves toward *idealization* or *impassibility* (the saint overcoming human weakness through grace). Plutarch wants you to see the human struggle; hagiography often wants you to see the divine victory.
  *   **The Reader's Task:** This is the crucial difference. Plutarch writes for a peer class (aspiring statesmen/philosophers). He invites **critical judgment**. He often presents conflicting sources ("Aristobulus says X, but Ptolemy says Y") and asks the reader to weigh them. Hagiography generally asks for **veneration**.
  *   **The "Miracles" Clause:** Saying Plutarch does this "minus the miracles" implies the only difference is the supernatural. The real difference is the *telos* (end goal). Plutarch's goal is *paideia* (cultural/moral education for civic life); hagiography's goal is *salvation* and the proof of sanctity.

  **Verdict:** The analogy is useful for understanding the *intent* (moral improvement) but misleading regarding the *method* (critical engagement vs. devotional acceptance). Plutarch is not "proto-hagiography"; he is the culmination of the pagan *bios* tradition, which Christians later adapted.

  ---

  ### Does the Concluding Claim Survive?

  **"The Lives tell us a great deal about Plutarch's moral imagination and very little about the men they describe, so anyone wanting evidence has to look elsewhere."**

  **Verdict:** **No, this claim collapses completely once the preceding errors are corrected.**

  The conclusion depends entirely on the premise that Plutarch "invented episodes" and treated history as mere "backdrop."
  1.  **If Plutarch reshapes but does not invent:** The material remains evidence about the subject, albeit interpreted evidence.
  2.  **If campaigns are not just backdrop:** The *Lives* contain substantial data on military, political, and social history, not just moral anecdotes.
  3.  **If "elsewhere" does not exist:** The instruction to "look elsewhere" is rendered null.

  **Corrected Conclusion:**
  A classicist would rewrite the conclusion to say: *"The upshot is that the Lives tell us a great deal about Plutarch's moral imagination **filtered through the traditions available to him**. They tell us a great deal about the men they describe, **but always as Plutarch understood them**. Anyone wanting evidence must use Plutarch critically, **often acknowledging that there is nowhere else to look.**"*

  ### Summary for the Reader
  Your instincts were correct. The passage you read is a "strong reading" that sacrifices accuracy for a neat moral point.
  *   **Keep:** Plutarch cares more about character than chronology.
  *   **Discard:** Plutarch invents facts at will; campaigns are just scenery; Plutarch is unreliable for historical evidence.
  *   **Nuance:** Plutarch constructs a moral truth from historical materials, but he is bound by those materials. He is a historian of character, not a novelist.
