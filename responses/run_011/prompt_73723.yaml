      *   **Task:** Create the procedure, run it on three specific nominations (Alcibiades, Desert Ascetic Vita, Authorized Statesman Bio), and provide a meta-analysis (limitations, failure points, what would change verdicts).
      *   **Tone:** Academic, rigorous, philosophical, respectful of the gravity of the task.

  2.  **Deconstruct the Three Source Traditions:**

      *   *Plutarch:* Focus on character over events (trivial incidents > battles), mirror for self-adornment, indulgence for mixed character (no unmixed virtue/vice), malice in dwelling on vice unnecessarily.
      *   *Hagiography:* Topoi (childhood, deathbed, miracles), purpose is edification/liturgy not history, potential non-existence of subject.
      *   *Contemporary Moral Exemplars:* Admiration's role, difficulty of correcting admiration, objection to perfect virtue (unrelatable).

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Structure:* Needs to be a flowchart or step-by-step checklist. Let's use numbered steps with "Pass/Fail" or "Branching" logic.
      *   *Step 1: Genre & Epistemic Status.* (Hagiography/History check). Is this claiming to be history? Is the subject real?
