      *   *Nomination 3: Authorized Statesman Biography.*
          *   Context: Responsibility in Office.
          *   Characteristics: Family author, exclusive access, likely sanitized.
          *   Rule for Silence: High risk of evidential suppression.
          *   Mode: "Object of Criticism" (analyze the sanitization) or "Cautionary" (regarding power). "Template" is dangerous.
          *   Verdict: Admit with heavy caveats on the "Authorized" nature.

  5.  **Drafting the Meta-Analysis (What the Procedure Cannot Do):**

      *   *Misfire:* It can't predict how a specific teacher will actually teach it.
      *   *Judgment Calls:* Determining "malice" in omission, determining "sufficient" corroboration.
      *   *What's Left Out:* The emotional impact on the student, the specific classroom dynamic.
      *   *Change of Verdict:* New historical evidence, a specific pedagogical safeguard proposed by the nominator.
      *   *Likeliest Failure Point:* The "Mode Assignment." Teachers ignore restrictions.

