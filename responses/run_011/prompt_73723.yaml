          *   Must assign modes and *forbid* others (prevent misuse).
          *   Must preserve Plutarch's distinction between recording and imitating (condemn conduct without dismissing subject).
          *   Must have a "Rule for Silence" (when is suppression of fault evidence vs. legitimate indulgence?).
          *   Must allow for Rejection (not just qualified admission).
          *   Must include a Withdrawal Rule (for existing texts).
          *   Must specify the output (2-3 sentences for the catalog entry).
