answer: |-
  ### The Tri-Traditional Vetted Biography Protocol (TTVBP)

  **Preamble:** This procedure replaces taste with operational criteria derived from Plutarchan methodology, Hagiographic convention, and contemporary exemplar theory. It is designed for execution by committee members without specialized training in the source material's historical period. Where a step requires a value judgment, it is explicitly flagged as **[JUDGMENT CALL]**.

  #### Phase I: Epistemic Status and Genre Classification
  *Goal: To establish the text's claim to truth and its primary purpose.*

  1.  **Corroboration Check:** Is the existence of the subject historically corroborated outside this text?
      *   **Yes:** Proceed to Step 2.
      *   **No:** Classify as **Hagiographic/Legendary**. Proceed to Step 2, but note that the text's evidential value regarding *events* is null; its value lies solely in *idealization*.
      *   **Unclear:** Classify as **Contested**. Proceed to Step 2.

  2.  **Purpose Identification:** What is the text's stated or structural aim?
      *   **Record (History/Memoir):** Claims to report deeds as they happened.
      *   **Edification (Hagiography/Vita):** Claims to inspire virtue or liturgical memory.
      *   **Defense (Authorized/Apologetic):** Claims to justify the subject's reputation.
      *   **[JUDGMENT CALL]:** If the text claims Record but functions as Edification (or vice versa), the Committee must select the *dominant* function. This selection determines the severity of subsequent scrutiny.

  #### Phase II: The Plutarchan Character Filter
  *Goal: To determine if the text treats character with sufficient nuance to be philosophically useful.*

  3.  **The Trivial Incident Test:** Does the text rely on "slight matters" (remarks, jests, trivial incidents) to reveal character, rather than solely on "greatest battles" (public achievements)?
      *   **Yes:** Pass. (Aligns with *Alex.* 1.1-3).
      *   **No:** Fail. (A chronicle of events is not a life). **STOP: REJECT.**

  4.  **The Malice Check:** Does the text dwell on vice?
      *   **No:** Pass.
      *   **Yes:** Is the vice necessary to understand the subject's mixed nature, or does it appear gratuitous?
      *   **[JUDGMENT CALL]:** The Committee must decide if the depiction of vice serves the "indulgence for common nature" (*Tim.* 1.4) or constitutes "malice" (*Herod.* 1). If Malice, **STOP: REJECT.** If Mixed Nature, Pass.

  #### Phase III: The Exemplar Risk Assessment
  *Goal: To mitigate the dangers of admiration identified in contemporary literature.*

  5.  **Admiration Vulnerability:** Is the subject charismatic or successful enough that students are likely to form uncritical admiration before critical distance is established?
      *   **Low Risk:** Proceed to Phase IV.
      *   **High Risk:** The text may only be admitted if the pedagogical plan explicitly targets the *mechanism* of that admiration.

  6.  **The Perfection Objection:** Is the subject presented as wholly virtuous?
      *   **Yes:** **STOP: REJECT** for use as Mirror or Template. (A wholly virtuous life is not a life anyone should want; it is unrelatable).
      *   **No:** Proceed to Phase IV.

  #### Phase IV: Mode Assignment and Prohibition
  *Goal: To fix the pedagogical use and forbid drift.*

  The Committee must select **one Primary Mode** and may select **one Secondary Mode**. All other modes are **FORBIDDEN**.

  *   **Mirror (Speculum):** Students compare their own character to the subject's (Plutarch's *Aem. Paul.* 1). *Requirement: Subject must have mixed character.*
  *   **Template (Imitatio):** Students copy specific features/actions. *Requirement: Actions must be replicable in a modern context.*
  *   **Cautionary (Exemplum Malum):** Students learn what to avoid. *Requirement: The specific failure must be identifiable.*
  *   **Object of Criticism (Interrogation):** Students analyze why the text solicits admiration or how the life is constructed. *Requirement: Used when historical reliability is low or admiration risk is high.*

  **Rule for Silence:**
  *   **Legitimate Indulgence:** Omission of faults is permitted if the faults are irrelevant to the specific virtue being taught and their inclusion would obscure the "common nature" lesson (Plutarch).
  *   **Evidential Suppression:** Omission of faults is forbidden if the text claims to be a Record and the faults contradict the stated virtue. If Evidential Suppression is detected, the text must be assigned **Object of Criticism** as Primary Mode.

  #### Phase V: Disposition and Entry
  *Goal: Final verdict and catalog metadata.*

  7.  **Decision:** Admit, Reject, or Withdraw (if already in library).
  8.  **Catalog Entry:** The Committee must draft exactly two sentences.
      *   Sentence 1: Defines the Primary Mode.
      *   Sentence 2: States the explicit Prohibition or Warning.

  ***

  ### Application of the Protocol to Pending Nominations

  #### Nomination 1: Plutarch's *Life of Alcibiades*
  *   **Nominator:** Classics (Unit: Ambition and Civic Loyalty).
  *   **Phase I (Epistemic):** Corroborated (Yes). Purpose: Record/Edification mix (Plutarch writes lives, not histories, but claims truth). **Pass.**
  *   **Phase II (Plutarchan):** Trivial Incident Test (Yes, Plutarch focuses on mannerisms and personal interactions). Malice Check (No, Plutarch argues for indulgence regarding his inconsistencies). **Pass.**
  *   **Phase III (Exemplar):** Admiration Vulnerability (**High Risk**. Alcibiades is notoriously charismatic; contemporary theory suggests admiration is hard to correct once formed). Perfection Objection (No, he is deeply flawed). **Warning Flagged.**
  *   **Phase IV (Mode):**
      *   *Mirror:* Forbidden. (Risk of students admiring the charisma rather than comparing the character).
      *   *Template:* Forbidden. (His ambition led to treason; not replicable for civic loyalty).
      *   *Cautionary:* Permissible. (Ambition without loyalty).
      *   *Object of Criticism:* Permissible. (Analyzing the tension between talent and virtue).
      *   **Selection:** Primary: **Object of Criticism**. Secondary: **Cautionary**.
  *   **Phase V (Decision):** **ADMIT.** (With strict mode restrictions).
  *   **Catalog Entry:** "To be taught primarily as an object of criticism regarding the seduction of talent over virtue; secondary use as a cautionary case for ambition without civic loyalty. Use as a mirror for self-comparison or template for imitation is expressly forbidden due to the subject's charismatic volatility."

  #### Nomination 2: Ninth-Century Vita of a Desert Ascetic
  *   **Nominator:** Religious Studies (Unit: Self-Denial).
  *   **Phase I (Epistemic):** Corroborated (No). Purpose: Edification (Hagiographic). **Pass (as Hagiography).**
  *   **Phase II (Plutarchan):** Trivial Incident Test (Yes, typical topoi of childhood/distribution of goods). Malice Check (N/A, genre is edification). **Pass.**
  *   **Phase III (Exemplar):** Admiration Vulnerability (Moderate). Perfection Objection (**Yes**. Hagiography typically presents unmixed virtue/saintliness). **Fail for Mirror/Template.**
  *   **Phase IV (Mode):**
      *   *Mirror/Template:* Forbidden. (Subject's existence uncorroborated and virtue unmixed; violates contemporary objection to perfect virtue).
      *   *Cautionary:* N/A.
      *   *Object of Criticism:* Permissible. (Analyzing the construction of sanctity).
      *   **Selection:** Primary: **Object of Criticism**.
  *   **Phase V (Decision):** **ADMIT.** (Restricted to genre analysis).
  *   **Catalog Entry:** "To be taught exclusively as an object of criticism regarding the literary construction of sanctity and the topoi of hagiography. Use as a historical template for self-denial or mirror for character comparison is expressly forbidden due to the legendary nature of the text and the subject's uncorroborated existence."

  #### Nomination 3: Authorized Biography of a Twentieth-Century Statesman
  *   **Nominator:** Political Science (Unit: Responsibility in Office).
  *   **Phase I (Epistemic):** Corroborated (Yes). Purpose: Defense/Record (Authorized). **Pass.**
  *   **Phase II (Plutarchan):** Trivial Incident Test (Likely Yes). Malice Check (**Risk**. Authorized bios often omit vice to protect reputation).
  *   **Phase III (Exemplar):** Admiration Vulnerability (High). Perfection Objection (Risk of implied perfection via omission).
  *   **Phase IV (Mode):**
      *   *Rule for Silence:* The "Authorized" status with exclusive access constitutes **Evidential Suppression**. Faults relevant to "Responsibility" are likely omitted to protect the subject, not out of Plutarchan indulgence for common nature.
      *   *Consequence:* Must be assigned **Object of Criticism**.
      *   **Selection:** Primary: **Object of Criticism**. Secondary: **Cautionary** (regarding the use of authorized sources).
  *   **Phase V (Decision):** **ADMIT.** (With warning on source bias).
  *   **Catalog Entry:** "To be taught primarily as an object of criticism regarding the curation of public memory and the limits of authorized access; secondary use as a cautionary case for the obscuring of responsibility. Use as a template for leadership is expressly forbidden due to the evidential suppression of fault inherent in the text's production."

  ***

  ### Meta-Analysis: What the Procedure Cannot Do

  You asked for a procedure, and I have given you one. But you also asked for honesty regarding its limits. Here is where the TTVBP fails, where it disguises judgment, and where it is vulnerable.

  **1. The Disguise of Judgment**
  The procedure claims to be operational, but three steps are value judgments wearing the costume of criteria.
  *   **The Malice Check (Phase II, Step 4):** My graduate students do not know ancient philosophy or church history. Asking them to distinguish between Plutarchan "indulgence" and "malice" is asking them to simulate your expertise without the training. They will inevitably conflate "uncomfortable truth" with "malice."
  *   **The Admiration Vulnerability (Phase III, Step 5):** There is no metric for charisma. One student may find Alcibiades repellent; another, mesmerizing. The procedure treats this as a stable property of the text, but it is a relational property between text and reader.
  *   **The Rule for Silence:** Distinguishing "Legitimate Indulgence" from "Evidential Suppression" requires knowing what the facts *are* to know if they are being suppressed. If the students don't know the history, they cannot know if the silence is evidence.

  **2. The Enforcement Gap**
  The procedure assigns a Mode and forbids others. It has no mechanism to ensure a colleague in Political Science respects the "Object of Criticism" tag. A professor determined to use the Statesman biography as a "Template" for leadership can ignore the catalog entry. The procedure vet the *text*, not the *teacher*. It prevents the library from admitting a dangerous weapon, but it cannot prevent the teacher from wielding it improperly.

  **3. What Would Change the Verdicts**
  *   **Alcibiades:** If you supplied a **pedagogical safeguard**—for example, a required companion essay that deconstructs Alcibiades' charisma *before* the Life is read—I would move the Primary Mode from "Object of Criticism" to "Mirror." The risk is not the text, but the timing of the encounter.
  *   **Desert Ascetic:** If you supplied **comparative material** (e.g., a secular historical account of the same period to contrast with the hagiography), I would allow "Template" use, provided the template is framed as "ideal type" rather than "historical precedent."
  *   **Statesman:** If you supplied **external corroboration of the suppressed faults** (e.g., a concurrent critical review or declassified documents), I would change the decision from "Admit" to "Withdraw/Replace." The text itself is too compromised to stand alone.

  **4. The Point of Likely Failure**
  The procedure is most likely to fail at **Phase IV, Mode Assignment**.
  By forcing a binary choice (Admit/Reject) and a fixed Mode, we assume the text has a stable moral valence. It does not. A text functions as a Mirror in one classroom culture and a Template in another. The procedure freezes the text's potential. In trying to prevent misuse, we may prevent *use*. You will dislike the verdict on Alcibiades not because it is wrong, but because it is *cautious*. It treats the text as a hazardous material rather than a classic. This is the cost of proceduralizing taste: safety is purchased at the price of vitality.

  **5. The Philosophical Objection**
  Finally, I must state the objection you invited: **The enterprise of vetting lives for moral teaching cannot be fully proceduralized.**
  Moral education relies on *phronesis* (practical wisdom), which is situational. A procedure is universal. By applying a universal rule to a particular life, we strip the life of the very context that makes it teachable. Plutarch wrote for adults who already shared a cultural vocabulary; you are writing for undergraduates in a fragmented culture. No checklist can bridge that gap. The "Rule for Silence" is the clearest example: knowing when silence is a lie and when it is mercy is not a test; it is a moral act. You are asking your committee to perform moral acts while pretending they are administering a test.

  If I were to change one thing to save the enterprise: **Add a Review Clause.** Every text admitted under this protocol must be reviewed after three years of teaching. The data should not be whether the text was "used correctly," but whether students reported *admiration* or *understanding*. If admiration outweighs understanding, the text is withdrawn. This admits that the procedure cannot predict the human response, only monitor it.
