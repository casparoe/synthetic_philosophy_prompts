      1.  *Mirror (Speculum):* Compare self to subject (Plutarch's Aemilius Paulus).
      2.  *Template (Imitatio):* Copy specific features.
      3.  *Cautionary (Exemplum Malum):* Learn what not to do.
      4.  *Object of Criticism (Interrogation):* Analyze why we admire/despise this.

      *Refining the Rule for Silence:*
      *   *Legitimate Indulgence:* Faults omitted to preserve "common nature" focus or because they don't bear on the specific virtue being taught (Plutarch's Timoleon/Nicias).
      *   *Evidential Suppression:* Faults omitted that contradict the stated purpose (Hagiographic sanitization).

      *Refining Value Judgments:*
      *   Need to explicitly state: "The Committee must decide..." where there is no objective metric.

  4.  **Running the Procedure on the Three Nominations:**

      *   *Nomination 1: Plutarch's Life of Alcibiades.*
          *   Context: Ambition/Civic Loyalty.
          *   Characteristics: Brilliant, flawed, traitor, charismatic.
