              *   Bankroll 3: Taxpayer/Fed (The actual infinite bankroll).
          *   *Argument:* The paradox exists because Bankroll 3 existed implicitly. If Bankroll 1 was the hard stop, the trade never happens.

      *   **2. Ranking Resolutions:**
          *   *Bounded Utility (Bernoulli):* Weak. AIGFP wasn't maximizing utility of dollars; they were maximizing bonus/ROE. Also, systemic risk makes utility irrelevant at the tail.
          *   *Finite Bankroll:* Strong. If AIG knew the Fed wouldn't bail them out, the "infinite" loss means bankruptcy. The trade becomes irrational.
          *   *Time Averaging/Ergodicity:* Strong (aligns with user's idea).
          *   *Probability Weighting:* Weak. They *did* weight probabilities, just wrong (Gaussian copula).
          *   *Ranking:* 1. Finite Bankroll (with Taxpayer caveat). 2. Ergodicity/Ruin. 3. Utility. 4. Probability Weighting.

      *   **3. The Ergodicity Hypothesis:**
          *   User asks: Is this just risk aversion with a physicist's accent?
          *   Analysis: It's Ole Peters' work. It's distinct from utility. Utility says "I don't like loss." Ergodicity says "If I go bust, I don't play again."
          *   Verdict: It's not just an accent. It's a category error in the math used by quants. They used ensemble averages (portfolio theory) for a path-dependent process (solvency).
