  4.  **Drafting - Section by Section:**

      *   **1. The Mapping:**
          *   *Player vs. House:* This is tricky. In SPP, Player pays entry, House pays prize. In AIGFP, AIG *collected* premium (entry fee equivalent) and promised to pay on tail (prize equivalent). So AIG is the *House* in the SPP sense, but they are also the *Player* betting against the tail. Let's refine: The *Market* is the Player (paying premiums for protection). AIG is the House (selling protection).
          *   *The Coin:* The housing market correlation/default event.
