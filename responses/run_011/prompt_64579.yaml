answer: |-
  This is a sharp analogy, and your instinct to bypass the moralizing ("greed") and the superficial technicalities ("VaR models") is correct. Those are symptoms, not the structural cause. The St. Petersburg Paradox (SPP) is fundamentally about the divergence between expectation and realizability in the presence of unbounded payoffs. AIGFP is the first historical instance where a private institution successfully arbitrated that divergence by socializing the unbounded tail.

  Here is the argument, structured by your five points.

  ### 1. The Mapping

  To make the SPP do work, we must be precise about roles. In the classic SPP, the Player pays an entry fee to flip a coin until heads, receiving $2^n$. The House banks the game.

  In the AIGFP case, the mapping is inverted but structurally identical:

  *   **The Player:** The buyers of the CDS (investors seeking tail protection). They paid small, finite premiums (entry fees) for the chance of a massive payout ($2^n$ equivalent) if the housing market collapsed. For them, the SPP holds normally: the expected value of the protection was arguably higher than the premiums paid, given the systemic risk.
  *   **The House:** AIGFP. They collected the premiums and promised to pay the $2^n$ payoff if the tail event occurred.
  *   **The Coin:** The correlation of national housing prices. AIG's models assumed the probability of "tails" (national decline) was effectively zero (like flipping 30 heads in a row).
  *   **The Payoff:** For AIG, this is a negative payoff. It is the collateral call/notional payout. In SPP terms, the prize is unbounded. For AIG, the loss was unbounded relative to their capital.
  *   **The Bankroll:** This is your critical variable.
      *   *Bankroll A (AIG Capital):~$100bn.* Finite. If this is the limit, the game stops when losses hit equity. The SPP dissolves because the House cannot pay the prize.
      *   *Bankroll B (Collateral Triggers):* Contractual. Designed to protect the counterparty, not the House. It accelerated the ruin but didn't fund the payout.
      *   *Bankroll C (The State/Taxpayer):* Effectively infinite.

  **The Argument:** The SPP persists in this case *only* because AIGFP operated under the implicit assumption that Bankroll C was available to them, while booking profits as if Bankroll A was the constraint. They privatized the premiums (bounded gain) and socialized the liability (unbounded loss). If you strictly enforce Bankroll A, the trade is mathematically inadmissible. If you allow Bankroll C, the SPP expectation holds, and the trade looks "rational" for AIG executives (bonus maximization) despite being catastrophic for the system.

  ### 2. Ranking the Resolutions

  You asked for explanatory power, not a survey. Here is the ranking of standard SPP resolutions applied to AIGFP, from most to least effective.

  **1. The Finite Bankroll Resolution (The Cassel/Keynes view)**
  *   **Verdict:** **Decisive.**
  *   **Reason:** This is the only resolution that kills the trade. The SPP expectation is infinite only if the House can pay *any* outcome. AIGFP could not. If the regulator or the board had enforced a hard constraint that "AIGFP losses > AIG Equity = Bankruptcy (no bailout)," the expected value of the position becomes negative infinity (due to ruin). The trade vanishes.
  *   **Why it wins:** It addresses the physical reality of solvency.

  **2. Ergodicity / Time-Averaging (Your hypothesis)**
  *   **Verdict:** **Strong, but derivative.**
  *   **Reason:** This explains *why* the ensemble expectation (the model) lied to them. They optimized for the average outcome across parallel universes (ensemble), where they stay solvent in 99% of worlds. In the single time-series reality, the tail event is an absorbing barrier.
  *   **Caveat:** Ergodicity only bites if there is no reset. If the Taxpayer resets the game (bailout), the time-average becomes irrelevant. So, Ergodicity relies on the Finite Bankroll resolution to function.

  **3. Diminishing Marginal Utility (Bernoulli)**
  *   **Verdict:** **Weak / Irrelevant.**
  *   **Reason:** This assumes the decision-maker cares about the utility of the firm's terminal wealth. AIGFP compensation was short-term bonus-based. The utility function of the traders was linear on the upside (bonus) and truncated on the downside (they kept the bonus even if the firm blew up later). Bernoulli requires the agent to bear the full consequence of the utility curve. They didn't.

  **4. Probability Weighting / Neglect**
  *   **Verdict:** **Red Herring.**
  *   **Reason:** Standard behavioral finance says "humans ignore low probabilities." AIGFP didn't ignore them; they modeled them as Gaussian. They didn't think the probability was low due to psychology; they thought it was low due to "math." This wasn't a cognitive bias; it was a model error. The SPP doesn't care if you know the probability is $1/2^{30}$; it cares that the payoff is $2^{30}$.

  ### 3. The Ergodicity Hypothesis

  You asked if your idea is just risk aversion with a physicist's accent. It is not. It is a distinct mathematical category, and it adds significant value here.

  Standard risk aversion (Utility Theory) says: "I dislike variance."
  Ergodicity breaking says: "The average across space does not equal the average across time."

  In geophysics, you know that a 1-in-10,000-year flood event is irrelevant to the ensemble average of river flow, but fatal to the village built on the floodplain. AIGFP used ensemble averaging (portfolio theory). They reasoned: "Across 1,000 parallel banks, this portfolio makes money." That is true. But there was only one AIG, and time only moves forward.

  **Does it add anything?** Yes. It explains the *persistence* of the error. If it were just risk aversion, they would have hedged. They didn't hedge because their models (ensemble-based) told them the risk was diversifiable. They treated a non-ergodic process (solvency) as if it were ergodic (trading P&L).

  **Is it named?** Yes, loosely. In modern decision theory, this is the "Kelly Criterion" or "Growth-Optimal" approach, recently championed by Ole Peters under "Ergodicity Economics." But in 2006, this language was absent from finance. Finance assumes ensemble averages are valid for pricing. Your intuition identifies the category error: they priced a path-dependent ruin problem as a path-independent expectation problem.

  ### 4. Where the Analogy Breaks

  Be honest: the analogy is not perfect. There are two fractures.

  **1. Endogeneity of the Probability (The "Observer Effect")**
  In SPP, the coin is fair. $p=0.5$ is fixed. In AIGFP, AIG's size and behavior *changed* the probability. By selling $500bn of protection, they concentrated risk. By becoming "Too Big To Fail," they altered the likelihood of the tail event being bailed out.
  *   *Implication:* In SPP, the House is passive. In AIG, the House was active. AIG's existence made the "Infinite Bankroll" (Taxpayer) more likely to materialize. This is a moral hazard feedback loop that SPP doesn't capture. The coin was rigged *by* the House.

  **2. The Sign Flip (The "Negative St. Petersburg")**
  SPP is usually framed as "How much to pay to win?" AIG was "How much to charge to lose?"
  *   *Implication:* This matters because of *agency*. In SPP, the Player decides to enter. In AIGFP, the *executives* decided to enter, but the *shareholders/taxpayers* funded the loss.
  *   *Does it save the theory?* No. It strengthens the Finite Bankroll argument. If the sign is flipped, the House faces ruin. The only reason the House plays a Negative SPP is if they believe the Bankroll is not theirs.

  ### 5. The Single Resolution

  You asked for the one thing that, if taken seriously in 2006, would have changed the outcome.

  **The Resolution:** **The Finite Bankroll Constraint (Hard Bankruptcy).**

  **The Mechanism:** A regulatory rule stating that capital requirements for tail-risk positions must be funded by *equity that is liable for loss*, not by implicit government guarantees. Specifically: **Contingent Capital or Bail-in Debt.** If AIGFP takes a position that could exceed its capital, it must issue debt that converts to equity *before* taxpayer funds can be accessed.

  **Why this one?**
  *   **Utility** fails because bonuses were decoupled from long-term utility.
  *   **Ergodicity** fails because if you know you will be bailed out, the time-average doesn't matter (the game resets).
  *   **Probability** fails because models will always be gamed.

  **The Argument:**
  The St. Petersburg Paradox is not a paradox of human psychology; it is a paradox of **liability**. In the 18th century, the House was a casino owner with a safe full of gold. If the streak went too long, the owner went bust. The paradox was theoretical because the bankroll was visibly finite.

  In 2008, the bankroll was *politically* infinite. AIGFP didn't solve the St. Petersburg Paradox; they exploited the fact that the State had removed the boundary condition.

  If the regulator in 2006 had asked one question: *"If this trade goes to $2^{30}$, who writes the check? If the answer is anyone other than you, you are not allowed to make the trade,"* the SPP resolves instantly.

  **Philosophical Implication:**
  This implies the SPP was never about the shape of the utility function or the psychology of risk. It was always about **Sovereignty**. The paradox only exists when an institution can claim private profits while accessing public solvency. The 18th century lacked the institutional capacity to socialize loss, so the paradox remained a mathematical curiosity. The 21st century built the institutions (central banks, bailouts) that made the paradox physically realizable.

  You are right to look at the bankroll. But the deeper truth is that the bankroll wasn't AIG's. It was ours. And that turns a mathematical paradox into a political one.
