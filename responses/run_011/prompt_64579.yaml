          *   *Sign Flip:* SPP is "Pay to win." AIG was "Get paid to risk." This is the "Picking up pennies in front of a steamroller" problem. It's the *Negative* St. Petersburg.
          *   *Crucial Break:* In SPP, the House has the advantage. In AIG, the House (AIG) thought they had the advantage, but the *Tail* was the Player.

      *   **5. The Single Resolution:**
          *   What would have stopped them?
          *   Not Utility (bonuses were short term).
          *   Not Ergodicity (too abstract for 2006 regulators).
          *   *Finite Bankroll (Hard Constraint):* If the regulator insists "No bailout, bankruptcy is final," the trade dies.
          *   *Mechanism:* Capital requirements based on *tail loss*, not VaR. Or a "Living Will" before the fact.
          *   *Philosophical Implication:* SPP isn't about psychology; it's about *liability structures*. The paradox dissolves when the House cannot socialize losses.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Tone Check:* Keep it rigorous. Don't dumb it down. Acknowledge the geophysics background (use terms like "ergodic," "absorbing state").
      *   *Correction on Mapping:* Be careful with who is who. In SPP, the *Player* faces the infinite expectation. In AIG, AIG faced the infinite *loss* expectation (conditional on tail). Actually, the *Buyers* of CDS paid small premiums for huge protection. The *Buyers* are the SPP Players (paying small fee for huge potential payout). AIG is the SPP House (collecting fees, risking ruin).
      *   *Wait, re-evaluate:* AIG sold protection. They get premium (small). They pay if default (huge).
      *   SPP: Player pays entry (small). Gets $2^n$ (huge).
      *   So the CDS *Buyers* are the SPP Players. AIG is the House.
      *   *Why did AIG do it?* Because they thought they were the House with an infinite bankroll (Taxpayer implicit guarantee) or that the coin was rigged (probabilities near zero).
      *   *Actually, the User's prompt implies AIG is the one facing the paradox.* "Run the AIG story through it." AIG faced the risk of ruin.
      *   *Let's stick to the User's framing:* AIG is the entity making the decision under uncertain expectation.
      *   *Key Insight:* The "Infinite Expectation" for AIG was negative. Expected Loss = Probability $\times$ Impact. If Impact is "End of Company," the utility is $-\infty$.
      *   *Bankroll is the key:* The paradox only persists if the bankroll is assumed infinite. AIG acted as if Bankroll = Taxpayer.

  6.  **Finalizing the "Single Resolution":**
      *   If regulators enforced a *hard* budget constraint (no bailout), the "Finite Bankroll" resolution kicks in immediately. AIG could not mathematically justify the trade.
      *   This implies SPP is institutional, not psychological.

  7.  **Review against constraints:**
