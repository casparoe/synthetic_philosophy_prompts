answer: |-
  This is a fantastic pedagogical pivot. You are correct that the standard "lecture + nod" approach kills intuition. The game structure you've designed is sound, but the logistics of 25 students in 80 minutes are tight. If the game bogs down, the debrief (where the actual learning happens) gets cut.

  Here is the complete kit to run this without mentioning Arrow until the end.

  ### Part 1: The Challenge Deck
  Print these on card stock. There are 4 types. Shuffle them. When a Challenger team draws a card, this is their mission objective. They win the round if they can produce a ballot profile (on the board) that forces the Defending Committee's rule to violate the card's condition.

  **Card Type 1: The Unanimity Trap (Pareto Efficiency)**
  *   **The Mission:** Make the rule pick an option that **every single voter** agrees is worse than another option.
  *   **The Script:** "Look at the board. Every single voter ranked [Option X] higher than [Option Y]. Yet your rule picked [Option Y]. You ignored the unanimous will of the group."
  *   **TA Key:** **Pareto Efficiency.** (If everyone prefers X to Y, society must not pick Y).

  **Card Type 2: The Spoiler Effect (Independence of Irrelevant Alternatives)**
  *   **The Mission:** Make the winner between **A and B** change, even though **no voter changed their mind** about A vs. B. (You can only change how they rank C).
  *   **The Script:** "Nobody changed their vote between A and B. But because C moved up or down on some ballots, the winner flipped from A to B. Your rule is unstable."
  *   **TA Key:** **Independence of Irrelevant Alternatives (IIA).**

  **Card Type 3: The Kingmaker (Non-Dictatorship)**
  *   **The Mission:** Show that **one specific voter's** top choice wins, even if the other four voters all prefer a different option.
  *   **The Script:** "Voter 1 got their first choice, even though Voters 2 through 5 all ranked it last. Voter 1 is doing all the work here."
  *   **TA Key:** **Non-Dictatorship.** (Note: This is hard to prove on a "fair" rule. If the committee wrote a fair rule, the challengers should swap this card or you, the TA, should overrule it as "Impossible for this rule" and let them draw again. This teaches that some rules *do* satisfy some conditions).

  **Card Type 4: The Loop (Transitivity/Social Ordering)**
  *   **The Mission:** Make the rule produce a cycle: The group prefers **A over B**, and **B over C**, but also **C over A**.
  *   **The Script:** "Your rule says A beats B, and B beats C. So A should beat C. But your rule says C beats A. The group's preferences are a rock-paper-scissors loop."
  *   **TA Key:** **Transitivity (Collective Rationality).** (Arrow requires a complete social *ordering*, not just a winner).

  ---

  ### Part 2: The Library of Killer Profiles
  Keep this for yourself. If a Challenger team is stuck after 3 minutes, walk over and whisper one of these setups to them. **Options are A (Park), B (Lounge), C (Cafe).**

  **1. Against Plurality Rule (Most 1st-place votes wins)**
  *   **The Profile:**
      *   Voters 1 & 2: A > B > C
      *   Voters 3 & 4: B > C > A
      *   Voter 5: C > A > B
  *   **Result:** A has 2 votes, B has 2 votes, C has 1 vote. (Tie A/B).
  *   **The Kill (Card 2 - IIA):** Tell Voter 5 to change to C > B > A. Now C has 1, A has 2, B has 2. Still a tie.
  *   *Correction for 5 voters:* Plurality is hard to break with IIA on 5 voters without ties. Use **Borda** instead for IIA.
  *   **Better Profile for Plurality (Card 4 - Cycle/Condorcet):**
      *   V1, V2: A > B > C
      *   V3, V4: B > C > A
      *   V5: C > A > B
      *   **Plurality Winner:** Tie A/B.
      *   **Pairwise:** A beats C (3-2), B beats A (2-3? No, V1,2,5 prefer A>B. A beats B 3-2). B beats C (4-1). C beats A (2-3).
      *   *Actually, Plurality satisfies Transitivity (it picks one winner).*
      *   **Use Plurality for Card 2 (IIA):**
      *   V1, V2: A > C > B
      *   V3, V4: B > C > A
      *   V5: C > A > B
      *   **Count:** A=2, B=2, C=1. (Tie A/B).
      *   **Change:** Move C to top for V5 (C > A > B). C=1. No change.
      *   **Okay, here is the working Plurality IIA profile:**
      *   V1, V2: A > B > C
      *   V3: B > C > A
      *   V4, V5: C > B > A
      *   **Count:** A=2, B=1, C=2. **Winner: Tie A/C.**
      *   **Shift:** Suppose C drops out (or voters rank C last).
      *   V1, V2: A > B
      *   V3: B > A
      *   V4, V5: B > A
      *   **Count:** A=2, B=3. **Winner: B.**
      *   **Script:** "When C was in the race, A was a winner. When C became unpopular, B won. But nobody changed their mind about A vs B!"

  **2. Against Two-Round Runoff**
  *   **The Profile:**
      *   V1, V2: A > B > C
      *   V3: B > C > A
      *   V4, V5: C > B > A
  *   **Round 1:** A=2, B=1, C=2. (A and C advance).
  *   **Round 2:** A vs C. V1,2 pick A. V3 picks C (since B is out). V4,5 pick C. **Winner: C.**
  *   **The Kill (Card 1 - Pareto):**
      *   Change V3 to: B > A > C.
      *   Now everyone (V1-5) ranks B > C. (V1,2 have B>C, V3 has B>C, V4,5 have C>B... wait).
      *   **Let's use the Center-Squeeze:**
      *   V1, V2: A > B > C
      *   V3: B > A > C
      *   V4, V5: C > B > A
      *   **Round 1:** A=2, B=1, C=2. (A & C advance). B is eliminated.
      *   **Round 2:** C beats A (3-2). **Winner C.**
      *   **Check Pareto:** V1, V2, V3 all prefer B > C. (3 out of 5). Not unanimous.
      *   **Check Card 2 (IIA):** If C drops out. A=2, B=3. **Winner B.**
      *   **Script:** "With C in the race, C won. With C out of the race, B won. But C was nobody's first choice! C was a spoiler."

  **3. Against Borda Count (Points: 1st=2, 2nd=1, 3rd=0)**
  *   **The Profile:**
      *   V1, V2: A > B > C  (A:4, B:2, C:0)
      *   V3, V4, V5: B > C > A (A:0, B:6, C:3)
      *   **Total:** A=4, B=8, C=3. **Winner B.**
      *   **The Kill (Card 3 - Kingmaker/Dictatorship-ish):**
      *   This profile shows Majority (3 out of 5) prefer B, so B winning is fine.
      *   **Try this one:**
      *   V1, V2, V3: A > B > C
      *   V4, V5: B > C > A
      *   **Total:** A=6, B=2+4=6, C=0+2=2. Tie A/B.
      *   **Let's use the "Consensus vs Majority" Borda failure:**
      *   V1, V2, V3: A > B > C
      *   V4: B > C > A
      *   V5: C > B > A
      *   **Total:** A=6, B=2+1+1=4, C=0+1+2=3. **Winner A.**
      *   **The Kill (Card 1 - Pareto):** Hard to do with Borda.
      *   **The Kill (Card 2 - IIA):**
      *   Profile:
      *   V1, V2: A > B > C
      *   V3, V4: B > C > A
      *   V5: C > A > B
      *   **Scores:** A(4+0+1=5), B(2+4+0=6), C(0+2+2=4). **Winner B.**
      *   **Shift:** V5 changes to C > B > A. (A vs B unchanged for V5? No, V5 was C>A>B. Now C>B>A. A>B changed to B>A).
      *   **Okay, use this standard Borda IIA:**
      *   V1, V2: A > B > C
      *   V3, V4: B > C > A
      *   V5: C > A > B
      *   **Scores:** A=5, B=6, C=4. **Winner B.**
      *   **Remove C (or make C last for everyone):**
      *   V1, V2: A > B
      *   V3, V4: B > A
      *   V5: A > B
      *   **Scores:** A=3, B=2. **Winner A.**
      *   **Script:** "When C was in the race, B won. When C is ignored, A wins. But no one changed their mind about A vs B!"

  **4. Against Pairwise Comparisons (Condorcet Method)**
  *   **The Profile:**
      *   V1, V2: A > B > C
      *   V3, V4: B > C > A
      *   V5: C > A > B
  *   **The Kill (Card 4 - The Loop):**
      *   A vs B: V1,2,5 prefer A. (A wins 3-2).
      *   B vs C: V1,2,3,4 prefer B. (B wins 4-1).
      *   C vs A: V3,4,5 prefer C. (C wins 3-2).
      *   **Result:** A > B > C > A.
      *   **Script:** "Your rule says the group prefers A to B, and B to C. Logic says the group must prefer A to C. But your rule says C beats A. You have no clear winner."

  **5. Against Consensus-with-Single-Veto (If anyone vetoes X, X loses)**
  *   **The Profile:**
      *   V1: A > B > C (Vetoes B)
      *   V2, V3, V4, V5: B > A > C (All love B)
  *   **The Kill (Card 1 - Pareto):**
      *   **Result:** B is vetoed. A wins (assuming no veto).
      *   **Script:** "Four out of five people rank B as their #1 choice. One person ranks it #2. But because that one person vetoed it, B loses. You let one person override the unanimous top-choice of the majority." (Note: This violates Pareto if the vetoer prefers A > B, but the group prefers B > A. Wait, Pareto requires *everyone* to prefer B > A. Here V1 prefers A > B. So it's not a Pareto violation technically. It's a **Non-Dictatorship** violation).
      *   **Script Correction:** "Voter 1's preference (A > B) completely erased the preference of Voters 2-5 (B > A). Voter 1 is a dictator."

  ---

  ### Part 3: Timeline (80 Minutes)

  **0:00 – 0:10: Setup & Rule Writing**
  *   Divide into 5 Committees (5 students each).
  *   **Task:** "You are the Constitutional Convention. There are 3 party locations: Park (A), Lounge (B), Cafe (C). Write a rule in plain English to pick one."
  *   **Constraint:** "Your rule must work for *any* set of ballots. No coin flips unless there's an exact tie."
  *   **TA Move:** Circulate. If a group writes "The Chair decides," tell them: "That's a valid rule, but you will automatically lose the 'Fairness' bonus point." (This discourages dictatorships without banning them).

  **0:10 – 0:50: The Game (4 Rounds, 10 mins each)**
  *   **Structure:** Committee 1 defends, Committee 2 challenges. Then 2 defends, 3 challenges, etc. (Do 4 rounds, leave Committee 5 as a wild card or rotate).
  *   **Minute 0-3:** Defenders post their rule. Challengers draw a **Challenge Card**.
  *   **Minute 3-7:** Challengers huddle to build a profile (5 voters) that breaks the rule according to their card. *TA Hint:* If they are stuck at minute 5, feed them a profile from the Library.
  *   **Minute 7-10:** Challengers write the profile on the board. Defenders have 60 seconds to respond. TA adjudicates.
  *   **Scoring:** Defender gets 1 point if rule holds. Challenger gets 1 point if rule breaks.

  **0:50 – 1:10: The Debrief (Synthesis)**
  *   **Step 1:** Look at the board. There are 5 rules and several broken profiles.
  *   **Step 2:** Ask the class: "Group the Challenge Cards by type." (They will see the Unanimity cards cluster, the Spoiler cards cluster).
  *   **Step 3:** Write the cluster titles on the board as "Demands."
      *   "Don't ignore unanimity." (Pareto)
      *   "Don't let spoilers change the winner." (IIA)
      *   "Don't let one person decide." (Non-Dictatorship)
      *   "Don't give us logical loops." (Transitivity)
  *   **Step 4:** Ask: "Did any committee satisfy all demands?" (Answer: No).
  *   **Step 5:** Ask: "Could we have written a better rule?" (Let them speculate).

  **1:10 – 1:20: The Reveal (Arrow)**
  *   **The Line:** "You just spent 40 minutes trying to find a bug in five different codes. You found bugs in all of them. You might think, 'We just need a smarter coder.' In 1951, Kenneth Arrow proved that **there is no bug-free code.**"
  *   **The Handoff:** "You tested specific rules against specific profiles. Arrow proved that *any* rule that satisfies these demands must be a dictatorship. He didn't test rules; he tested logic itself."
  *   **Write the Theorem:** "If a voting system satisfies Pareto, IIA, and Unrestricted Domain, it must be Dictatorial."

  ---

  ### Part 4: Troubleshooting & Adjustments

  **Predictable Failure 1: "The Chair Decides"**
  *   **Problem:** A committee writes "If there's a tie, the Chair picks." Then they claim the Chair is just a tie-breaker.
  *   **Fix:** During the Challenge Round, the Challengers can submit a profile where there is *no tie*, but the Chair still picks their favorite. If the rule is vague, force the Defenders to clarify: "Does the Chair *only* break ties, or do they vote?" If they say "Only breaks ties," challenge them with a **Loop (Card 4)**. A tie-breaker cannot resolve a Condorcet Cycle (A>B, B>C, C>A) without violating Transitivity or IIA.
  *   **TA Script:** "Your tie-breaker resolves A vs B. But what if the group prefers A>B, B>C, and C>A? Who breaks that tie?"

  **Predictable Failure 2: Challengers Get Stuck**
  *   **Problem:** 5 minutes in, the Challengers are staring at blank paper.
  *   **Fix:** Do not give them the answer. Give them a **Constraint**. "Try making Voter 1 and 2 agree on everything, but lose." or "Try making C win even though C has zero first-place votes."
  *   **Emergency:** If they are truly dead, pull a profile from your Library, write it on a sticky note, and hand it to them as a "Leak." "You found this leaked ballot profile in the archives. Can you use it?"

  **Predictable Failure 3: Hypercompetitive Section**
  *   **Problem:** They spend 8 minutes arguing about whether a profile *actually* breaks the rule.
  *   **Fix:** You are the Supreme Court. Your ruling is final. "I rule that this violates the Spoiler condition. Point to Challengers. Next round." Keep the pace brutal.

  **Predictable Failure 4: Flat Section**
  *   **Problem:** No one wants to challenge.
  *   **Fix:** Gamify the candy. "The committee with the most points gets the candy. The committee with the *fewest* points has to erase the whiteboard." (Light stakes). Or, assign roles: "Person 1 is the Scribe, Person 2 is the Speaker, Person 3 is the Challenger."

  **Adjustment: 40 Students**
  *   **Change:** 8 Committees of 5.
  *   **Time:** You cannot do 8 rounds. Do **4 Rounds** with 2 committees in the "Arena" at once.
  *   **Setup:** Committees 1 & 2 face off. 3 & 4 face off. Simultaneously.
  *   **Debrief:** Ask one rep from each pair to report their "kill."

  **Adjustment: 45 Minutes**
  *   **Cut:** Reduce to **2 Rounds**.
  *   **Cut:** Pre-assign the Rules. Give Committee 1 "Plurality," Committee 2 "Runoff," Committee 3 "Borda." Save 10 minutes of writing time.
  *   **Debrief:** Rush the synthesis. Go straight to the "No bug-free code" line.

  ---

  ### Part 5: The Gap (Crucial for the TA)

  You asked for the exact line to handle the committee that survives every round and thinks, "See? We made a good rule."

  **The Scenario:** A committee writes a Dictatorship rule ("Voter 1 decides"). They survive every round because Dictatorship satisfies Pareto, IIA, and Transitivity perfectly.
  **The Student Objection:** "We found a rule that works! Arrow is wrong."
  **Your Exact Line:**
  > "You found a rule that satisfies the *math*, but violates the *democracy*. Arrow's theorem says: You can have a perfect system, or you can have a democratic one. You cannot have both. If your rule survived every challenge, check your rule: Did one person decide the outcome? If yes, you proved Arrow's point, you didn't disprove it."

  **Structural Limitations of the Game (What you must supply in the last 10 mins):**
  1.  **Universality:** The game tests *some* profiles (e.g., 5 voters). Arrow proves it for *all possible* profiles (infinite).
      *   *Say:* "You tested 4 scenarios. Arrow tested every scenario that can possibly exist."
  2.  **Ordering vs. Winner:** The game picks a *winner*. Arrow requires a full *ranking* (Social Welfare Function).
      *   *Say:* "You just picked a winner. But what if we need to rank all three options for a budget? If your winner-rule creates a loop (A>B>C>A), you can't make a budget. Arrow requires a consistent list, not just a winner."
  3.  **Unrestricted Domain:** The game assumes people *can* vote any way.
      *   *Say:* "We assumed voters could rank things any way they wanted. Arrow proves that even with that freedom, the system breaks."

  **Final TA Tip:**
  When you write the four conditions on the board in the last 10 minutes, use the **students' words** from the Challenge Cards, not the textbook definitions.
  *   Instead of "Pareto Efficiency," write "Don't Ignore Unanimity."
  *   Instead of "IIA," write "No Spoilers."
  *   Instead of "Non-Dictatorship," write "No Kings."
  *   Then draw the arrow: **Unanimity + No Spoilers + No Kings = IMPOSSIBLE.**
