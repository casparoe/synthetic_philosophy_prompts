      *   Okay, (1) vs (3) is actually the deepest philosophical crack. (1) vs Nadia is the practical manifestation of it. I will rank (1) vs (3) as Severity 1 because it undermines the logic, and (1) vs Nadia as Severity 2 (the symptom).
