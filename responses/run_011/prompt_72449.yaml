      *   *Decision:* The strongest tension is (1) vs Nadia. The cleanest fix is expanding (4).

  6.  **Final Polish of the Audit:**
      *   Ensure tone is "audit" not "lecture."
      *   Check constraints: No reading lists, no debate survey.
      *   Ensure severity ranking is clear.
      *   Make sure the "False Conflict" section validates the user's intuition where correct.

