      *   **Input:** Six numbered commitments (1-6) plus a specific verdict on a case study (Nadia).
      *   **Constraints:**
          *   Do not lecture on the debate.
          *   Do not suggest reading lists.
          *   Order conflicts by severity.
          *   For each conflict, specify what must give and what is lost.
          *   Identify false conflicts (pairs that look like they clash but don't).
          *   Identify the single most effective revision.
          *   Specifically address whether the Nadia case and Drift Test are supported by the rest of the package.
      *   **Tone:** Professional, analytical, direct (like an editor or peer reviewer).

  2.  **Deconstruct the Position:**
      *   *(1) Agent-Neutral Consequentialism:* Maximize good impartially. No agent-centered prerogatives (no "it's mine so I can keep it").
      *   *(2) Rejection of Demandingness Objection (Current World):* Comfort baselines aren't sacred. "Wreck my life" is usually rationalization in an unjust world.
      *   *(3) Supererogation:* Giving more is better, but not giving max isn't blameworthy. Need room for "good but not required."
      *   *(4) Psychological Feasibility:* Ought implies can (psychologically). If it breaks a human over a decade (deliberation, commitments, reliability), it's not a valid demand.
      *   *(5) Unit of Assessment:* Patterns/Lives, not single acts.
      *   *(6) Drift Test:* If general compliance erodes the dispositions needed for compliance, the demand fails. (Structural point, not cost).
      *   *(Nadia Case):* Nadia (10% giving, 11 years) is *not* required to jump to 40% if it means numbing work + no kids.
      *   *(Constraint on Nadia):* Cannot use "her life is hers" (Agent-Prerogative) because (1) rejects that.

  3.  **Identify Conflicts (Brainstorming & Mapping):**

      *   *Conflict A: (1) vs. (Nadia Verdict).*
          *   (1) says maximize good impartially. No weighting own projects.
          *   Nadia verdict says she doesn't have to take the higher-paying/numbing job to give more, even though that would likely produce more good (implied).
