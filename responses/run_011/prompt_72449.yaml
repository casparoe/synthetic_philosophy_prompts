          *   *Best Fix:* Modify (1) to acknowledge that "maximizing good" includes the good of maintaining moral agency and deep personal commitments, *or* shift the focus of (1) from "act" to "disposition." Actually, the cleanest fix is to clarify that (1) is the *criterion of rightness* but (4)/(6) are *constraints on obligation*. But the Nadia case is the sticking point.
