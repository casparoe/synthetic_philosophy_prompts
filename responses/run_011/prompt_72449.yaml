          *   *Severity:* High. This is the core tension. The verdict contradicts the foundational theory unless bridged.

      *   *Conflict B: (1) vs. (3).*
          *   (1) says do *most* good.
          *   (3) says doing *less* than most good is permissible (supererogatory).
          *   Standard Consequentialism usually collapses supererogation into duty. If you can do more good, you ought to.
          *   *Severity:* Medium-High. This is the classic "demandingness" problem re-entering through the back door.

      *   *Conflict C: (2) vs. (4) & (6).*
          *   (2) says "Wreck my life" is rationalization in *this* world.
          *   (4) says if a demand breaks a human psychologically over a decade, it's invalid.
          *   (6) says if trying to meet demand erodes dispositions, it fails.
          *   *Tension:* (2) is very hardline ("nearly always rationalization"). (4) and (6) create escape hatches that look like demandingness objections. If Nadia says "Having no kids/numbing work will make me come apart," (2) says "Tough, that's the unjust world," but (4) says "Then it's not a demand."
          *   *Severity:* Medium. It creates ambiguity on when the "wreck my life" objection counts.

      *   *Conflict D: (6) Drift Test vs. (1) Agent-Neutrality.*
          *   (1) is act/outcome focused (maximize good).
          *   (6) is rule/disposition focused (sustainability of agency).
          *   *Severity:* Low/Medium. Rule-consequentialism can fit here, but needs to be explicit.

      *   *Conflict E: (5) Pattern vs. (1) Impartial Maximization.*
          *   (1) looks at "what brings most good."
          *   (5) says look at the pattern.
          *   *Compatibility:* Actually, these might work well together. A pattern of sustainability might produce more good long-term than a burnout spike.
          *   *Verdict:* False Conflict (mostly).

  4.  **Deep Dive into Specific Requests:**

      *   *Nadia Case & Drift Test Support:*
          *   Does (1)-(6) license the Nadia verdict *without* agent-prerogative?
          *   (1) forbids it.
          *   (4) and (6) *might* allow it if the numbing work/kidlessness causes psychological disintegration or drift. But the prompt implies the sacrifice is *possible* (she *could* raise it), just not *required*.
          *   If the sacrifice doesn't break her (4) and doesn't cause drift (6), (1) demands she do it.
          *   So, Nadia verdict is currently unsupported by the theory provided. It relies on a hidden premise (probably a soft agent-prerogative or a specific definition of "good" that includes integrity/relationships).

      *   *Single Best Revision:*
          *   Need to bridge (1) and the Nadia verdict.
