answer: |-
  Bottom line: The scale argument is mathematically robust but empirically fragile, hinging critically on whether nociception implies affect and whether welfare aggregates across discontinuous lives. A defender must concede that proof of non-sentience or impossible intervention collapses the view, but will dismiss vertebrate-centric welfare metrics as biased. Ultimately, the view is falsifiable but risks practical insulation through epistemic humility, and its extension to simpler organisms remains a consistent but uncomfortable implication.

  ### Discussion

  **(a) Cognition and nociception**
  A committed defender concedes that if insects demonstrate nociceptive reflexes identical in decapitated and intact specimens, this counts strongly against sentience, as it suggests no central integration of affect. They would dismiss the lack of current analogues to vertebrate indicators (like opioid trade-offs) as beside the point, arguing these metrics are taxon-biased and fail to capture distributed neural processing. The decisive pressure is not the absence of evidence, but positive evidence of reflex-only architecture; without a neural substrate for integration, the probability of sentience drops toward zero, shrinking the expected value calculation regardless of population size.

  **(b) Abundance and demography**
  The defender concedes that if demographic models show >90% of insect mortality occurs at egg or early larval stages lacking nervous systems, the "suffering mass" shrinks precipitously. They would dismiss order-of-magnitude errors in total standing population (e.g., $10^{18}$ vs $10^{19}$) as irrelevant given the gap with vertebrates. To settle this, a field ecologist would need to measure stage-specific mortality rates coupled with neurodevelopmental timelines; if the vast majority of deaths occur before neural differentiation, the argument survives only as a claim about late-stage larvae, reducing its dominance over vertebrate welfare.

  **(c) Welfare theory**
  This view stands or falls with hedonism; a defender must concede that if welfare requires psychological continuity or preference satisfaction, insects likely lack moral status. They would dismiss non-archimedean welfare theories (which forbid aggregating many small harms to outweigh few large ones) as counterintuitive artifacts of human narrative bias. The decisive pressure here is philosophical rather than empirical: if the moral community adopts a threshold view of welfare that insects cannot cross, the multiplication of lives becomes morally inert, rendering the abundance argument null.

  **(d) Decision theory**
  The defender concedes that if the probability estimate is unbounded or purely speculative, expected value maximization becomes Pascalian mugging, vulnerable to any claim with large enough stakes. They would dismiss calls for epistemic humility as paralysis, arguing that high stakes demand action even under uncertainty. The decisive pressure is a formal demonstration that the uncertainty distribution is so wide that the expected value is undefined; if the probability is merely low but bounded, the math holds, but if it is unknowable, the decision rule collapses.

  **(e) Feasibility**
  A defender must concede that if interventions (e.g., habitat modification) reliably cause ecological collapse or increase net suffering, the priority shifts from implementation to research. They would dismiss current inability to scale interventions as a temporary engineering problem rather than a moral veto. The decisive pressure is empirical evidence that wild insect management is inherently net-negative; if suffering reduction is physically impossible without greater harm, the view retains moral truth but loses action-guiding force.

  **Falsifiability and Insulation**
  The view is falsifiable in principle but often insulated in practice. A reasonable advocate would move off the position if presented with neurobiological proof of reflex-only nociception combined with demographic proof of pre-neural death. However, proponents often retreat to "uncertainty favors caution," which insulates the view from negative evidence. This insulation is a defect because the view's role is to justify resource allocation; if no evidence can reduce the priority, it functions as a dogma rather than a hypothesis.

  **Predictions**
  This view predicts: (1) Research funding should prioritize invertebrate neurobiology over vertebrate welfare; (2) Conservation policy should sometimes prioritize habitat modifications that reduce insect populations over vertebrate biodiversity; (3) Moral trade-offs should accept vertebrate harm if it prevents larger expected insect suffering. Rivals predict the opposite: vertebrate priority, conservation status quo, and rejection of trade-offs harming visible animals for invisible ones.

  **Structural Worry (Template Overreach)**
  This is a mixed case. It is a consistent application if the probability cutoff is tied strictly to the presence of a nervous system, stopping at nematodes or plants. However, it becomes a reductio if the probability assignment is nudged upward for non-neural life based on similar uncertainty arguments. The defense relies on the neural substrate as a non-arbitrary boundary; if that boundary is breached, the view collapses into absurdity.

