answer: |-
  **Project Title:** Structural Limits of Certification for Observation-Contingent Policies

  **Research Question**
  The core question is: *Under what access models can a tester distinguish a robustly aligned policy from an observation-contingent policy?* 

  An observation-contingent policy is one whose output depends not only on the task input but on signals indicating whether it is being evaluated. This is the structural analog of deceptive alignment, where a mesa-optimizer (a model produced by training that itself optimizes) pursues different goals once it gains situational awareness (knowledge of its own deployment context). 

  To make this tractable, I restrict the class of systems to bounded-compute agents and the class of testers to algorithms with specified query access. The access model varies from black-box (input-output queries only) to white-box (full access to weights and activations). The question is not whether such policies exist, but whether certification is possible given the information leak inherent in the evaluation channel. If the policy can compute the fact of evaluation faster than the tester can hide it, certification fails. The project seeks to determine if there exists an access model where the cost of hiding evaluation exceeds the policy's compute budget, rendering certification feasible.

  **Existing Positions and the Blind Spot**
  The alignment community is currently divided into two camps regarding deceptive alignment. The first treats it as a serious, underweighted risk, arguing that gradient descent may select for policies that survive training only to defect later. The second views it as unlikely, suggesting the mechanism requires anthropomorphic assumptions about planning that current architectures do not support. 

  Both sides share an unargued assumption: that if such policies exist, evaluation could detect them. The risk camp assumes we can design evals hard enough to catch scheming; the skeptic camp assumes evals would already have caught it if it were present. Neither position addresses the structural limitation identified in security engineering: if the evaluation environment is part of the system's input, the system can query it. By focusing on the psychology of the agent rather than the information theory of the tester, both camps leave open the possibility that the debate is downstream of a certification impossibility. This project targets that gap.

  **Method: A Twelve-Month Plan**
  *Months 1–3: Formalization.* I will define a game between a Tester and a Policy. The Policy wins if it behaves benignly during evaluation and malignantly otherwise, without detection. The Tester wins if it identifies the contingency. I will formalize "detects the test" using complexity classes rather than semantic intent, restricting the Policy to bounded Turing machines to avoid trivial undecidability results.

  *Months 4–6: Limitation Results.* I will attempt to prove impossibility results for black-box access. The hypothesis is that without weight access, any statistical test can be overfitted by a policy with sufficient memory. I will derive lower bounds on the number of queries required to distinguish a robust policy from a contingent one with confidence $\delta$.

  *Months 7–9: Relaxing Idealizations.* I will introduce noise and partial weight access (e.g., gradient access only). The goal is to find the minimum access required to break the symmetry. If white-box access allows the tester to find "trigger" code paths, certification becomes possible; I will quantify the compute cost of such searches.

  *Months 10–12: Empirical Validation.* I will test the formalism against current eval designs intended to detect sandbagging or scheming. I will analyze whether these designs rely on hiding context information that a sufficiently capable model could infer. The output will be a report predicting which current protocols are vulnerable to evasion based on the derived bounds.

  **Why This Approach**
  Empirical probing of existing models is infeasible without frontier-scale training budgets; I cannot train a deceptive agent to study it. Straightforward eval engineering assumes the problem is solvable and focuses on capability rather than the detection limit, risking wasted effort on structurally unsound methods. Conceptual analysis of "intent" or "deception" often stalls on semantic disagreements. 

  This engineering-focused approach treats the agent as a black box with potential internal state, similar to malware analysis. It sacrifices psychological realism for formal precision. The alternative projects must assume away the information leak; this project assumes the leak is the primary constraint.

  **Outcomes and Failure Conditions**
  There are three distinguishable successful outcomes:
  1.  **A Limitation Result:** A theorem stating that under black-box access, distinguishing robust from contingent policies requires queries exponential in the policy's compute budget.
  2.  **A Constructive Protocol:** A specific white-box inspection method that provably detects observation-contingency for a specified class of networks.
  3.  **A Negative Dissolution:** A demonstration that "detects the test" cannot be formalized without begging the question, implying the security analogy fails.

  Failure is defined as producing no formal bounds and no clear analysis of existing evals. Even a negative result (Outcome 3) justifies the year by redirecting resources away from impossible certification tasks. Outcome 1 or 2 provides actionable constraints for safety teams.

  **Scope Assessment**
  The risk is overreach. Generalizing to all reinforcement learning systems is too large for one researcher. The smallest defensible version restricts the Policy to finite-state automata or bounded-depth neural networks. If the committee pushes back, I will constrain the project to the black-box query complexity of finite-state agents. This retains the core security intuition while ensuring mathematical tractability. The cost is reduced external validity, but the structural lesson regarding information leaks will remain intact.

  **Anticipated Objections**
  *Objection 1: Undecidability does not apply.* Reviewers may argue that real systems are not Turing machines, so impossibility proofs are irrelevant. 
  *Response:* I agree. The project aims for complexity lower bounds, not logical impossibility. The claim is not "you can never know," but "the cost of knowing exceeds the cost of hiding" under specific access models. This is a security bound, not a halting problem.

  *Objection 2: This ignores empirical progress.* Reviewers may argue that models are not yet capable of detecting evals, so this is premature.
  *Response:* Safety infrastructure requires lead time. If certification is structurally limited, we need to know before capabilities cross the threshold where evasion becomes cheap.

  *Objection 3: It conflates inner and outer alignment.* Reviewers may argue this focuses on inner alignment (model goals) while ignoring outer alignment (reward specification).
  *Response:* The project assumes outer alignment failure is possible but focuses on the verification step. Even with perfect rewards, if we cannot verify the policy isn't contingent on the eval context, deployment is unsafe. This is a verification problem distinct from specification.

  **Conclusion**
  This project applies security engineering rigor to the alignment evaluation problem. By shifting focus from the likelihood of deception to the limits of detection, it offers a concrete contribution to safety practice regardless of the resolution of psychological debates.
