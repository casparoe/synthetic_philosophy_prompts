answer: |-
  (a) Two candidate rules fit the seven verdicts. The **Structuralist Rule** holds that clauses (i) and (iii)–(vi) are sufficient; clause (ii) (expectations) is redundant, merely describing the psychological shadow of the equilibrium. This fits Cases 1, 3, 4, and 7. It struggles with Case 2 (which fails clause (iv)/(v) anyway) and Case 5 (where external enforcement mimics equilibrium). It is constrained most by Case 6, where the supervisor explicitly invokes expectations ("expectation was doing no work") rather than mere stability.

  The **Dispositional Rule** holds that clause (ii) is independent and causal: conformity must be *sustained* by expectations of others' conformity. The test is counterfactual: if agents ceased to expect others to conform, would they still conform? This fits all seven cases. Case 2 fails because there is no coordination gain to sustain expectations. Case 3 fails because necessity removes arbitrariness. Case 5 fails because conformity depends on external sanctions, not mutual expectation. Case 6 confirms that expectations must be causally efficacious, even if robust against weak interventions. Case 7 confirms population relativity.

  A third **Minded-Agent Rule** requires agents capable of representing expectations. This fits Cases 1–7 but is unconstrained by them, as all involve humans. It becomes decisive only for non-human agents. Ambiguity note: Case 5's verdict implies the regularity was never a convention, even while wardens enforced it, suggesting the *source* of stability matters more than the temporary satisfaction of equilibrium conditions.

  (b) **Verdict Prediction:**
  *   **For the bots:** Not a convention.
  *   **For the firms:** Not a convention (yet), or a nascent one.
  *   **For participants as a whole:** Not a convention.
  *   **Case 7 Remark:** This licenses splitting the populations. The bots constitute a population distinct from the firms. The regularity is a convention relative to neither, though for different reasons.

  (c) **Implications:**
  Under the **Structuralist Rule**, the bots satisfy clauses (i), (iii), (v), and (vi). The equilibrium is real; the arbitrariness is proven by simulations. The bots' lack of mental states is irrelevant. Verdict: Convention. The firms' newly formed preferences are incidental.
  Under the **Dispositional Rule**, the bots fail clause (ii). Their behavior covaries with others, but not via expectations. The counterfactual test yields mixed results: some variants drop the pause without others, others do not. This indicates the regularity is sustained by selection pressures (training rewards), not mutual expectation. The firms now possess the relevant conditional preferences and expectations, but the regularity did not emerge from them. For the firms, it is a ratified regularity, not an emergent convention.
  Under the **Minded-Agent Rule**, the bots fail immediately. The firms pass, but only retroactively.

  (d) **Best Single Prediction:**
  She will verdict **Not a Convention** for the bots and the system as initially constituted. Her remark on Case 2 ("coordination drained out") distinguishes mere regularity from convention by requiring interdependence of *reasons*, not just payoffs. Her remark on Case 6 ("expectation was doing work") insists expectations must be causally efficacious. The bots' behavior is causally driven by reward functions, not representations of others. The firms' subsequent endorsement does not rewrite the history of the regularity's stabilization. Lewis requires the expectations to solve the coordination problem; here, the reinforcement learning algorithm solved it without expectations. The firms are now in a position to *maintain* it conventionally, but the existing pattern is a structural equilibrium, not a convention.
  **Confidence:** High. The parallel to Case 5 is strong: just as external enforcement (wardens) precludes convention, external training dynamics (reward functions) preclude convention.
  **Lower Confidence:** If she treats the firms' current conditional preferences as sufficient to "ratify" the past regularity, collapsing the emergence condition into the maintenance condition.

  (e) **Discriminating Case:**
  **The Instinctive Coordination:** A population of genetically engineered agents is predisposed to drive on the right. They also happen to believe others will drive on the right. If their beliefs were magically altered (they expected left-driving), they would still drive right due to instinct. The regularity is arbitrary (left would work), stable, and an equilibrium.
  **Why earlier cases fail:** Case 1 involves learned behavior, not instinct. Case 2 lacks equilibrium. Case 6 tests robustness of expectation, not causal inertness. In the Instinctive case, the Structuralist Rule verdicts **Convention** (clauses i, iii–vi met). The Dispositional Rule verdicts **Not a Convention** (expectations are causally inert; conformity does not depend on them). This isolates the causal role of clause (ii).

  (f) **Assessment of Suspicion:**
  Your suspicion is incorrect. The Dispositional Rule is not empirically empty because it requires **representation**, not just covariation. The bots covary with others (if others pause, statistics change, bot pauses), but they do not represent others' pauses. Case 2 shows that covariation without coordination gain is insufficient; Case 6 shows that expectation must be causally active. The distinction is between *causal dependence on behavior* (bots) and *causal dependence on the expectation of behavior* (humans).
  **Implication:** A Lewisian framework can accommodate regularities produced by selection in Population A (bots) and inherited by Population B (firms). For Population A, it is a non-conventional equilibrium. For Population B, if they inherit the regularity *and* form the relevant expectations to sustain it, it becomes a convention relative to B. The status of the regularity is population-relative, not intrinsic. This preserves the framework's utility for evolutionary accounts without diluting the definition of convention.
