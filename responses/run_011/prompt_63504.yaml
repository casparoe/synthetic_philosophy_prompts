prompt: |-
  So I'm a senior and I'm doing this after-school online philosophy seminar — it's basically me, my friend Devin, and a TA who's a grad student — and this week is epistemology. We read about "accuracy-first" stuff, the idea that the only thing that makes a belief epistemically good is how accurate it is, and you measure the accuracy of credences with a scoring rule like the Brier score, where you get dinged by the square of the difference between your credence and 1-or-0 depending on whether the claim turns out true. The TA kept saying the Brier score is a "proper" scoring rule and that this is supposed to matter a lot for the argument, and he also mentioned an argument where credences that break the probability axioms get "accuracy dominated," which I think means there's always some alternative set of credences that does better no matter how the world ends up being.

  Here's what's confusing me and I feel like I'm missing something obvious. If accuracy is literally the only thing that counts, isn't the smart move to just put 0.5 on basically everything? Because 0.5 can never be badly wrong — worst case you eat a 0.25 penalty, whereas if I put 0.99 on something and it's false I get destroyed, like 0.98 or whatever. Devin said that's exactly why they're called *proper* rules, because it's proper to hedge and not stick your neck out, and that accuracy people basically want you to be as un-extreme as possible. And the domination thing seems to point the same way, since a guy who says 0.5 to everything never gets dominated by anybody, right? So then how is it rational to be 0.999 confident the sun comes up tomorrow or that my phone is in my pocket — that looks like pure downside risk with no accuracy payoff at all.

  Then Devin made up his own scoring rule to prove his point: you get exactly 1 point no matter what credence you report and no matter what happens. He's like, look, that rule is proper too, since reporting 0.5 gets you the best possible score (and so does every other number), and under his rule hedging is straight-up optimal — so if accuracy-first people get to choose which rule measures accuracy, they might as well choose his and then the mushy-everything strategy wins and my original point stands. I couldn't really answer that and now I don't know whether accuracy-first epistemology is secretly telling us to be vague about everything, or whether me and Devin are both wrong in some way I can't see. Can you walk me through what we're getting wrong? I care mostly about the intuition rather than a pile of formulas, tho a little math is fine if you explain what each piece is doing.
