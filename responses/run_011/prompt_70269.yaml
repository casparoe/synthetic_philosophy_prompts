  **Why my colleagues have a point**
  Your colleagues are legally correct on the black-letter law. Under Dillon's Rule, municipalities are mere creatures of the state, possessing only powers expressly granted. Historically, preemption is not the exclusive tool of one party; states have long overridden cities on minimum wage, gun control, and zoning to ensure uniformity or protect state-level economic interests. From this view, the legislature is simply exercising its plenary authority to correct policy mismatches. If voters dislike the state law, they can vote out the state legislators. Nothing prevents you from running, nothing prevents voters from choosing you, and nothing prevents the state majority from imposing its will. This is ordinary conflict within a hierarchy, not a breakdown of the democratic system. To call it backsliding conflates losing a policy battle with losing the right to fight it. Both parties have used preemption when holding state power, suggesting this is standard majoritarian governance rather than authoritarian drift.

  **The distinction**
  Your distinction holds water. Procedural backsliding attacks the *input* of democracy: voting access, district boundaries, count integrity. It makes the map unfair. Jurisdictional backsliding attacks the *output*: it renders the office incapable of affecting change, regardless of who holds it. It makes the prize worthless. This doesn't collapse entirely into existing concepts like "hollowing out," because it specifically isolates the retention of electoral legitimacy alongside the removal of governing capacity. It captures a scenario where the ritual of election remains sacred while the substance of governance is vacated. Most democratic checklists, like Levitsky and Ziblatt's, focus on mutual toleration and forbearance between opponents. They assume opponents are fighting over the same levers of power. Your distinction highlights what happens when one side removes the levers entirely. It is a shift from contesting *who* rules to dictating *what* can be ruled upon, insulating specific policy outcomes from local majorities without altering the ballot box.

  **The argument**
  Why should a voter care if the prize shrinks? Because democracy is not merely the selection of personnel; it is the capacity of a community to self-govern through those personnel. When jurisdiction shrinks retroactively, three democratic goods are destroyed.

  First, the accountability loop is severed. Voters elect councilmembers to solve problems—housing, safety, wages. If the state removes those levers, voters cannot punish or reward officials based on outcomes. Officials become scapegoats for problems they are legally barred from fixing. This breeds cynicism and disengagement, eroding the legitimacy of the local office itself. If citizens perceive that voting changes nothing, turnout declines, and the remaining electorate becomes unrepresentative. The election remains free, but it becomes meaningless.

  Second, the personal liability clause is a chilling mechanism distinct from ordinary preemption. Standard preemption says "you can't do this." Your bill says "if you try, we will sue *you* personally." This weaponizes the law against public service. It raises the cost of holding office from wasted time to financial ruin. This doesn't just shrink jurisdiction; it filters out candidates willing to serve, skewing representation toward those who won't challenge state authority regardless of constituent needs. It effectively disenfranchises voters who prefer bold local action by scaring away the candidates who would deliver it. This reduces the pool of talent and courage required for healthy local governance.

