  **The reversal test and its big problem**
  Your reversal test is intuitive but needs refinement. You're right: constitutions and rights are hard to undo, yet we don't call them backsliding. The fix lies in distinguishing between *entrenching process/rights* and *entrenching policy*. Constitutional rigidity protects the democratic game itself (free speech, voting rights) or fundamental liberties from majoritarian abuse. These are higher-law constraints agreed upon as foundational. Jurisdictional backsliding entrenches specific policy preferences (zoning, wage floors) to shield them from a local majority using ordinary legislation. The test should be: Does this constraint protect the *capacity* of future majorities to govern, or does it protect *past policy choices* from future majorities? If a state law prevents a city from violating free speech, that's rights protection. If it prevents a city from setting tax rates, that's policy entrenchment. Your situation fails the test because it locks in policy outcomes that a local majority cannot reverse through normal elections, requiring instead a state-level supermajority or legal battle. It creates a one-way ratchet where state power expands and local power contracts without a clear path for local voters to reclaim it. Unlike constitutional rights, which protect the minority from the majority, this protects a state majority from a local majority, inverting the protective purpose of entrenchment. Additionally, constitutional constraints usually require supermajorities to enact, reflecting broad consensus. These preemption bills are often passed by simple majorities along partisan lines. Treating ordinary partisan legislation as immutable structural law bypasses the deliberative rigor required for true entrenchment. Therefore, the reversal test holds if we specify that the barrier to reversal must be legitimate structural protection, not partisan lock-in. If a simple state majority can strip local power forever, but a local majority cannot restore it without winning state power, the system is unbalanced. The test survives if we ask: Is this barrier designed to protect democracy, or to protect a party?

  **Where my city actually lands**
  Applying this, your colleagues are wrong. This isn't just partisanship. The retroactive voiding creates instability, and the personal liability clause actively discourages citizen participation, which is a procedural harm masked as jurisdictional limits. By insulating specific policy areas from local control while maintaining urban bias in the state legislature, the state is entrenching policy preferences, not protecting rights. The prize has shrunk significantly enough that the fairness of the race no longer guarantees representation. This is jurisdictional backsliding. It preserves the shell of local democracy while removing its heart. You are right to feel something is wrong; the machinery is clean, but the engine has been removed.
