answer: |-
  **Project Title:** Baseline Robustness in Safe Pareto Improvements for One-Shot AI Cooperation

  **1. Problem Statement and Research Question**
  Safe Pareto Improvements (SPIs) propose modifying agents' decision algorithms (e.g., via precommitment or delegation) to secure outcomes that are strictly better than a "default" for all players, while guaranteeing no player falls below that default regardless of the opponent's action. Current formalizations (e.g., Conitzer & Oesterheld) typically index safety and improvement to a specific default outcome, often assumed to be the Nash equilibrium of the base game or a known status quo strategy profile.

  This assumption creates a vulnerability in one-shot mixed-motive settings (e.g., Chicken, Bargaining) where the "default" is not uniquely defined by the game structure. If players hold divergent beliefs about which equilibrium will be played in the absence of intervention, or if the default depends on higher-order expectations, a transformation deemed "safe" relative to Player 1's baseline may be unsafe relative to Player 2's. This suggests standard SPIs may smuggle in a shared counterfactual agreement that the miscoordination problem ostensibly lacks.

  **Primary Research Question:**
  *Does there exist a commitment mechanism that guarantees a Pareto improvement relative to the set of all rationalizable default outcomes, rather than a single fixed baseline?*

  **Secondary Question:**
  *If such a "Baseline-Robust SPI" (BR-SPI) exists, what conditions on belief structures and game payoffs are necessary and sufficient for its implementation?*

  **2. Gap Analysis and Contribution**
  Existing literature treats the default as a parameter fixed *ex-ante*. This is not merely a simplification; it is a structural assumption that bypasses the equilibrium selection problem. In games with multiple Nash equilibria, the "default" is endogenous to the players' beliefs. If Player 1 expects the default to be Equilibrium A and Player 2 expects Equilibrium B, an SPI designed to improve upon A might leave Player 2 worse off than their expected default B.

  This is a **real gap**, not a definitional artifact. Standard SPI proofs rely on dominance arguments relative to a fixed threat point. If the threat point is a set (due to belief ambiguity), the dominance condition must hold against the *worst-case* element of that set for *each* player simultaneously. Preliminary analysis suggests that in games like Chicken, standard SPIs fail this robustness test because the "safe" cooperative outcome often requires trusting the opponent to avoid the worst equilibrium, which contradicts the ambiguity assumption.

  This project will not produce a philosophy paper on counterfactuals, nor will it rely on simulations. Simulations establish average-case performance, whereas safety requires worst-case guarantees. Instead, I will employ formal game-theoretic analysis to derive existence theorems and impossibility results.

  **3. Methodology and Work Plan (10 Weeks)**
  *Weeks 1–2: Formalization of the Ambiguous Default.*
  Define the "Default Set" $D_i$ for each player $i$ as the support of their belief distribution over rationalizable strategy profiles in the base game. Formalize the standard SPI condition and contrast it with the proposed Baseline-Robust SPI condition: $u_i(SPI) \geq \max_{s \in D_i} u_i(s)$ is too strong; the target is $u_i(SPI) \geq \min_{s \in D_i} u_i(s)$ (security level relative to ambiguity) while ensuring Pareto efficiency.
  *Deliverable:* A formal definition of BR-SPI.

  *Weeks 3–5: Existence Analysis in Normal-Form Games.*
  Analyze 2x2 symmetric and asymmetric games (Prisoner's Dilemma, Chicken, Battle of the Sexes). Determine if BR-SPIs exist when $D_i$ includes multiple equilibria. I will construct payoff matrices where standard SPIs succeed but BR-SPIs fail, isolating the specific structural features (e.g., risk dominance vs. payoff dominance) that block robustness.
  *Deliverable:* Proof of existence/non-existence for canonical game classes.

  *Weeks 6–8: Program Equilibrium and Commitment Mechanisms.*
  Extend the analysis to program games (Tennenholtz, Oesterheld) where agents read each other's source code. Investigate if access to source code allows agents to condition on the *opponent's belief about the default*, thereby collapsing the ambiguity. I will test if a "modal logic" approach to commitment can enforce a BR-SPI where simple strategy substitution cannot.
  *Deliverable:* A proposed algorithm/program structure for BR-SPI.

  *Weeks 9–10: Synthesis and Counterexamples.*
  Compile results. If BR-SPIs are generally impossible, characterize the "cost of robustness" (how much efficiency must be sacrificed to guarantee safety across all baselines). Finalize the write-up.
  *Deliverable:* Final report and code for verification of examples.

  **4. Success and Failure Criteria**
  *Success:* A rigorous definition of BR-SPI; a theorem specifying conditions under which BR-SPIs exist (e.g., "BR-SPIs exist in all games with a unique correlated equilibrium"); and at least one concrete counterexample where a standard SPI is unsafe under baseline ambiguity.
  *Failure:* Proving that BR-SPIs are impossible in any game with multiple strict Nash equilibria. This is a valuable negative result as it delineates the boundary of SPI applicability.
  *Project Failure:* Inability to formalize the "Default Set" in a way that is mathematically tractable within the timeframe.

  **5. Feasibility and Scope Management**
  Ten weeks is sufficient for the normal-form analysis (Weeks 1–5) but tight for the program equilibrium extension (Weeks 6–8).
  *Contingency:* If the program game analysis proves intractable, I will cut Week 6–8 and deepen the normal-form analysis, focusing on $n$-player games or continuous action spaces. The core contribution (the definition and the gap analysis) rests on the normal-form results.
  *Risk:* The "Default Set" may be unbounded if beliefs are unconstrained. I will mitigate this by assuming common knowledge of rationality (restricting $D_i$ to rationalizable strategies).

  **6. Critical Modeling Choices**
  To ensure mathematical precision, I must explicitly state the following assumptions, as the literature varies on them:
  1.  **Source Code Access:** I will assume **full read-access** to opponent source code for the program game section (standard in program equilibrium), but **no access** for the normal-form section (standard SPI). This distinction clarifies whether ambiguity is resolved by transparency or mechanism design.
  2.  **Utility Comparability:** I will assume utilities are **not interpersonally comparable**. SPIs rely on ordinal rankings per player; introducing cardinal comparability would trivialize the bargaining aspect.
  3.  **Baseline Definition:** I will model the baseline as a **set of strategy profiles** (the rationalizable set) rather than a distribution. This avoids requiring priors over beliefs, adhering to the "ambiguous beliefs" premise.
  4.  **Common Knowledge:** I will assume the *game structure* is common knowledge, but *beliefs about play* are not. This isolates the equilibrium selection problem from the information asymmetry problem.

  **7. Conclusion**
  This project addresses a foundational stability issue in AI cooperation. If SPIs require agreement on the counterfactual default to function, they cannot solve the coordination problems they are designed for. By formalizing Baseline-Robust SPIs, this work will either extend the applicability of SPIs to ambiguous settings or rigorously define their limits, preventing the deployment of "safe" mechanisms that fail under belief divergence.
