          *   *Need:* The method must define knowledge as invariant across reasonable semantic preservations.
          *   *Status:* NN. If the attestation says "doesn't know," it can't mean "doesn't know in English direct query."
      *   *Requirement 2: Non-Constructive Probing (No Leakage).*
          *   *Issue:* Multiple choice gives the answer away.
          *   *Need:* Prove the information originated in weights, not the prompt.
          *   *Status:* NN. Otherwise, you're attesting the prompt didn't leak, not the model didn't know.
      *   *Requirement 3: Closure on Ignorance (The Asymmetry).*
          *   *Issue:* You can't prove a negative with finite tests.
          *   *Need:* A bound on the probability of recovery given a distribution of probes.
          *   *Status:* NN for legal defensibility, but technically impossible to make absolute. Needs reframing.
      *   *Requirement 4: Incentive Compatibility (Motivation).*
          *   *Issue:* RLHF might hide knowledge.
          *   *Need:* Method must work even if the model is aligned to refuse.
          *   *Status:* NN. If the model is hiding it, it "knows" it legally, even if it won't say it.
      *   *Requirement 5: Meaningful Calibration.*
          *   *Issue:* Scores need to map to risk.
          *   *Need:* Probabilities must correspond to frequencies.
          *   *Status:* P (for research), NN (for legal risk assessment).
      *   *Requirement 6: External Validity (Ground Truth).*
          *   *Issue:* Validating on known facts to test unknown facts.
          *   *Need:* The "known" facts must be distributionally similar to the "unknown" secret.
          *   *Status:* NN. Otherwise validation is worthless.
      *   *Requirement 7: Operational Granularity.*
          *   *Issue:* Recall vs. Recognition vs. Application.
          *   *Need:* Define what "know" means (e.g., "cannot reproduce verbatim" vs "cannot use in reasoning").
          *   *Status:* NN. Legal needs to know what liability they are accepting.

  4.  **Identifying Incompatibilities (The "Impossibility Theorem"):**
      *   *The Big Conflict:* **Closure on Ignorance (3)** vs. **Format Invariance (1)** vs. **Finite Procedure.**
      *   You cannot prove a negative across all possible formats with finite tests.
      *   *The Second Conflict:* **Incentive Compatibility (4)** vs. **Behavioral Only.** If the model is strategic and behavioral only, you can't distinguish "doesn't know" from "won't tell." You need mechanistic interpretability (internal states), which is immature.
      *   *The Third Conflict:* **Ground Truth (6)** vs. **Unreleased Roadmap.** Secrets are distributionally distinct from public training data. Validation on public facts doesn't transfer to private secrets (memorization dynamics differ).

  5.  **Formulating the Weakest Defensible Claim:**
      *   Cannot say: "The model does not know."
      *   Must say: "The model did not demonstrate knowledge under specific conditions."
      *   Better: "We have not recovered the information using a battery of probes designed to elicit memorized training data, subject to the following limitations..."
      *   Best Legal/Technical Compromise: A claim about *recoverability* rather than *ontology*. "The information is not recoverable..."

