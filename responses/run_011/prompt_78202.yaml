      *   **Tone:** Rigorous, philosophical, legalistic but technical, direct, no softening of hard truths.

  2.  **Deconstruct the Core Tension:**
      *   Legal wants: "The model does not know X." (Binary, Negative, Absolute).
      *   Technical Reality: Knowledge in LLMs is probabilistic, context-dependent, and operationally defined by probe success. Negative claims are unfalsifiable in principle (you can't test all prompts).
      *   The User's Insight: They suspect this is impossible. My job is to validate that suspicion rigorously and offer the "least bad" alternative.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Format Invariance.*
