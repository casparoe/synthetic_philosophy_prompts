answer: |-
  # The Meridian Harm Protocol (MHP) v1.0

  **Purpose:** To determine actionable harm in escalated appeals within 30 minutes, minimizing legal liability while maintaining platform stability.
  **Philosophical Baseline:** *Functional Fictionalism.* We treat virtual objects as "make-believe" unless they intersect with real-world economics or irreversible psychological targeting. We do not recognize digital property rights for non-cashable items without General Counsel (GC) approval.

  ### The Decision Tree

  **Step 1: Zone Consent Check (Mechanical)**
  *   **Question:** Did the incident occur within a zone flagged "Anything Goes" (opt-in PvP/griefing)?
  *   **Data Source:** Server logs (Zone ID vs. Incident Timestamp).
  *   **Sufficient Answer:**
      *   **YES:** Proceed to Step 4. (Zone consent waives claims for in-zone structural/interaction damage).
      *   **NO:** Proceed to Step 2.
  *   **Philosophical Choice:** *Contractual Fictionalism.* By entering the zone, the user agreed the "rules of reality" changed.
  *   **Cost:** We absolve bad actors of emotional harm caused within these zones. Users who enter out of curiosity or coercion get no recourse for distress.

  **Step 2: Economic Loss Check (Mechanical)**
  *   **Question:** Did the incident involve the loss of "Scrip" (cashable currency) or Real Money, OR was a non-cashable item sold for Real Money on a third-party site?
  *   **Data Source:** Transaction logs, external report links.
  *   **Sufficient Answer:**
      *   **YES:** **Verdict: Economic Harm.** (Sanction + Restitution). Stop.
      *   **NO:** Proceed to Step 3.
  *   **Philosophical Choice:** *Forced Realism.* We acknowledge virtual objects are "real" only when they touch the fiat economy.
  *   **Cost:** We systematically undervalue labor. A month of crafting a non-cashable item is worth $0; a minute of mining cashable scrip is worth face value.

  **Step 3: State Reversibility Check (Mechanical)**
  *   **Question:** Was the damaged/destroyed state reverted via server snapshot or backup prior to the appeal?
  *   **Data Source:** Admin tool logs (Restore Timestamp vs. Incident Timestamp).
  *   **Sufficient Answer:**
      *   **YES:** **Verdict: No Permanent Harm.** (Dismiss). Stop.
      *   **NO:** Proceed to Step 4.
  *   **Philosophical Choice:** *Outcome Fictionalism.* If the bits are restored, the act is treated as if it never permanently happened.
  *   **Cost:** This ignores the *experience* of the violation. It incentivizes "smash and wait" griefing, knowing restoration negates punishment.

  **Step 4: Targeted Harassment Check (Human Judgment)**
  *   **Question:** Is there evidence the actor targeted the *user* (not just the avatar) across multiple sessions or servers?
  *   **Data Source:** Chat logs, friend requests, cross-server movement logs, prior reports.
  *   **Sufficient Answer:**
      *   **YES (Pattern Established):** **Verdict: Harassment.** (Sanction). Stop.
      *   **NO (Isolated Incident):** Proceed to Step 5.
  *   **Philosophical Choice:** *Human-Centric Fictionalism.* Harm is only real if it pursues the flesh-and-blood person, not the digital persona.
  *   **Cost:** High cognitive load for officers. "Isolated" severe trauma (e.g., a one-time hate crime) may be dismissed if no pattern exists.

  **Step 5: Property Claim Trigger (Legal Gate)**
  *   **Question:** Does resolving this appeal require recognizing ownership of a non-cashable, non-restored virtual object?
  *   **Sufficient Answer:**
      *   **YES:** **Verdict: Escalate to General Counsel.** Stop.
      *   **NO:** **Verdict: Dismiss.**
  *   **Philosophical Choice:** *Legal Conservatism.* We refuse to define digital property rights without explicit legal instruction.
  *   **Cost:** Creates a bottleneck. Users with legitimate non-economic grievances get stuck in legal limbo.

  ---

  ### Case Runs

  #### Case 1: The Memorial
  **Incident:** User A burned down User B's memorial (dead sibling). Restored via snapshot in 45 minutes.
  **MHP Run:**
  1.  **Zone:** Standard Zone (No consent). -> *Step 2.*
  2.  **Econ:** Non-cashable structure. -> *Step 3.*
  3.  **Reversible:** Yes (Restored <1 hr). -> **Verdict: No Permanent Harm (Dismiss).**
  **Officer Justification:** *Incident occurred in standard zone; however, server state was fully restored prior to appeal filing. No cashable assets lost. No pattern of cross-server targeting established. Case closed under MHP Step 3.*
  **Philosophical Cost:** This is the verdict you will hate. The procedure treats the grief of the destruction as irrelevant because the *bits* were put back. It prioritizes platform integrity over user emotional experience.

  #### Case 2: The Stalker
  **Incident:** Avatar groped/chased in "Anything Goes" zone. Actor followed victim across 3 servers over 7 days.
  **MHP Run:**
  1.  **Zone:** "Anything Goes" (Consent given). -> *Step 4 (Skip 2 & 3 due to Zone).*
  2.  **Econ:** N/A.
  3.  **Reversible:** N/A.
  4.  **Targeting:** Yes (Cross-server following for 1 week). -> **Verdict: Harassment (Sanction).**
  **Officer Justification:** *While initial incident occurred in opt-in zone, actor's cross-server movement logs confirm targeted pursuit of the specific user beyond zone boundaries. This constitutes harassment under MHP Step 4, overriding zone consent.*
  **Philosophical Cost:** We protect the human, not the avatar. The zone consent is voided because the "game" bled into the "reality" of persistent stalking.

  #### Case 3: The Black Market
  **Incident:** Crafted item (non-cashable in-world) stolen, sold on third-party site for $500 USD.
  **MHP Run:**
  1.  **Zone:** Standard Zone. -> *Step 2.*
  2.  **Econ:** Yes (Third-party sale converts item to real money value). -> **Verdict: Economic Harm (Sanction + Restitution).**
  **Officer Justification:** *Item classified as non-cashable in-world, but evidence confirms external monetization resulting in $500 USD loss to victim. Triggers Economic Harm protocol under MHP Step 2.*
  **Philosophical Cost:** We validate the black market. By recognizing the third-party sale as "real loss," we inadvertently legitimize the secondary market we supposedly forbid.

  #### Case 4: The NPC Companion
  **Incident:** User-built NPC companion (non-cashable) permanently deleted by stranger. No snapshot available (system error).
  **MHP Run:**
  1.  **Zone:** Standard Zone. -> *Step 2.*
  2.  **Econ:** Non-cashable. -> *Step 3.*
  3.  **Reversible:** No (Permanent deletion). -> *Step 4.*
  4.  **Targeting:** No (Stranger, isolated incident). -> *Step 5.*
  5.  **Property Claim:** Yes (Requires recognizing ownership of deleted non-cashable build). -> **Verdict: Escalate to General Counsel.**
  **Officer Justification:** *Permanent loss of user-built structure with no economic value. Restoration impossible. Resolution requires determination of property rights over non-cashable assets. Escalating to GC per MHP Step 5.*
  **Philosophical Cost:** Bureaucratic paralysis. The user gets no answer for weeks while lawyers debate if a bot is property. The procedure admits it cannot answer the question without risking liability.

  ---

  ### Failure Modes & Systemic Risks

  **1. The "Restoration Loophole" (Judgment Call dressed as Procedure)**
  Step 3 assumes restoration equals "no harm." This is a factual check, but it masks a value judgment. Griefers will learn the snapshot schedule. They will destroy builds immediately *after* a snapshot, knowing the next one won't save the victim, or destroy them *just before* a snapshot to ensure the "No Permanent Harm" dismissal.
  *   **Systematic Error:** We will under-punish high-impact emotional griefing that is technically reversible.

  **2. The "Labor Blindness" (Incentive Structure)**
  By tying Step 2 strictly to cashability, we tell users: *If you want protection, make things that cost money.* This disincentivizes pure creative or memorial building. It creates a two-tier citizenry: Whales (cashable assets) get T&S priority; Artists (non-cashable assets) get "pixels."
  *   **Incentive:** Users will flood the economy with low-value cashable items just to gain T&S protection status.

  **3. The "Harassment Burden" (Human Limit)**
  Step 4 requires an officer to determine intent ("targeting the user") in 30 minutes. This is the weakest link. Officers will default to "No Pattern" to avoid the risk of false positives (banning a legitimate player).
  *   **What it can't do:** It cannot catch "soft" harassment (one-off severe acts) that don't leave a cross-server trail. It requires a history of abuse to prove abuse.

  **4. Penalty Severity (The Missing Scale)**
  You suspected this, and you are right: **This procedure cannot determine penalty severity.** It outputs *Binary Verdicts* (Harm/No Harm). It tells you *if* they broke the rules, not *how bad* it was.
  *   **Risk:** A first-time economic thief gets the same "Sanction" tag as a repeat offender. You will need a separate, unstated matrix for ban duration, which reintroduces the inconsistency you tried to solve.

  **5. The Legal Bottleneck**
  Step 5 is a graveyard. General Counsel will not sign off on virtual property rights for non-cashable items because it opens liability floodgates.
  *   **Reality:** Case 4 (and any similar appeal) will effectively be a "Dismiss" after 3 weeks of silence. We are outsourcing our moral cowardice to the legal team.

  ### Final Note to the Lead
  You asked for a procedure that doesn't bend to intuition. **Case 1** is the result. A grieving user had a memorial burned. We fixed the bits. We walked away. The procedure works because it is consistent, not because it is kind. If you override Case 1, you break Step 3, and the next officer who follows your "kindness" instead of the "rule" will let a griefer off because *they* felt the restoration was enough. The cost of consistency is coldness.
