prompt: |-
  You're an order theorist who also happens to be good with words — call yourself the person a department phones when someone needs a speech that a head table full of mathematicians can't find fault in. Sketch two or three possible angles first, a line each, then write the toast.

  Occasion: my brother's wedding next month, about 90 people. The bride, Nadia, is a set theorist who works on chain conditions, and her whole research group plus her advisor will be sitting up front. My brother teaches highschool math, knows roughly what a poset is, and has been practising saying "upper bound" in the mirror. The other half of the room is family from both sides who have never heard of Zorn's lemma and are not about to start.

  The toast has to be built on Zorn's lemma, and not as decoration — the actual structure of the lemma should dictate what I'm permitted to say:

  - every chain having an upper bound is what licenses the conclusion, so the ceremony itself should visibly be the moment the hypothesis gets checked;
  - the conclusion only ever delivers a maximal element, never a maximum. So I cannot say anything implying that either of them is the best possible match for the other, or that today is the greatest element of anything. I want that prohibition to become the warm part of the speech rather than a disclaimer stuck on the end;
  - the lemma doesn't tell you where the maximal element is, so I'm not allowed to point at one moment or one achievement in their history and say that's it;
  - the equivalence with the axiom of choice is fair game for exactly one joke, but it has to survive the front table, and likewise if you want to use the priority in-joke (Kuratowski had it thirteen years before Zorn published his version; most of the world just doesn't name it after him).

  Three to four minutes out loud, one line that Nadia's non-math aunts can repeat at the reception. Then give me a short list of the places where a picky order theorist might still object, and how you'd defend each one.
