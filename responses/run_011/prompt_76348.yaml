  **Reject, 6–3.** The driving rule is **The Great Acceleration State-Shift**. Item 1's minute ("what changed is a state, not just the arrival of a new kind of grain") is the panel's core doctrine; the new proposal is explicitly about "arrival" and "grains" (fly-ash, concrete dust). Item 7's ban on appealing to professional endorsement blocks the researcher's claim about the "professional body's list." The noise is the "12-year-old" test in Item 7—which the new proposal actually passes—and the "uneasy framing" in Item 3, which was a compromise justification for a stratigraphic rejection (the "excursion" argument). The panel is committed to the 1950s not because it's the only coreable date, but because it's the only one that matches the *magnitude* of the change they wish to name.

