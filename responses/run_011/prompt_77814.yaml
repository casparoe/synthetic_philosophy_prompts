answer: |-
  # Q&A PREP SHEET: Institutional Inference vs. Belief Inference
  **Session:** Early Complex Societies | **Time:** 20 mins + Q&A
  **Core Claim:** Institutional inference is licensed by task-constraint + null-result statistics; Belief inference is not licensed by symbolic absence.

  ---

  ## 1. PRE-EMPTIVE CONCESSIONS (First 3 Minutes)
  *Deploy these in your conclusion or methodological preamble to disarm the room before they strike.*

  1.  **Concede the "State" Label:** Explicitly state you are not proving a "State" in the Weberian sense. You are proving **centralized logistical authority**. This removes the Senior Guy's primary target (the definition of statehood).
  2.  **Concede the Analogy Gap:** Acknowledge that using text-bearing sites to generate "expected counts" for sealings is an analogical leap. Frame it as a **counterfactual test**: "If this *were* Uruk, we'd find X. We found 0."
  3.  **Concede the Belief Black Box:** State clearly: "I am not arguing these people had no beliefs. I am arguing that this dataset cannot touch them." Do not claim to know their ideology; claim to know the **limits of your method**.

  ---

  ## 2. THE OBJECTION LIST (Ordered by Damage)

  ### 1. The Senior State-Formation Guy
  **The Objection:** "You're committing a category error. You're treating statistical regularity as social topology. Without texts, you have no way to distinguish between a centralized bureaucracy and a highly coordinated kin-based reciprocity network. You're seeing 'administration' because you're looking for 'state,' not because the pots show it."
  **The Reply:** "I'm not inferring a state; I'm inferring a **constraint mechanism**. A kin-network relies on social pressure; a bureaucracy relies on physical standardization. The 4% CV on capacity across 60 profiles exceeds the threshold of peer-pressure standardization seen in ethnographic kin-based pottery. More critically, the **null result on sealings** is the key. In comparable administrative nodes, sealings are the waste product of transaction. Their absence here, despite perfect preservation, suggests the 'authority' isn't transacting via identity-markers (seals) but via **volume-compliance**. That is an institutional distinction, even if it's not a 'state'."
  **Soft Spot:** Relies on the assumption that kin-networks *can't* achieve 4% CV (ethnographic counter-examples exist).

  ### 2. The Bayesian Modeler
  **The Objection:** "Your 'null result' on the sealings is a likelihood function, not a proof. You haven't specified your prior probability of recovery. If your excavation fraction is 0.4 and the sealing survival rate is unknown, your posterior probability that 'administrative sealings never existed' is not 1.0. You're presenting a sensitivity analysis as a fact."
  **The Reply:** "Fair. I'm not claiming the posterior is 1.0. I'm claiming the **likelihood ratio** is decisive. Given the arid, sealed floors and the excavated fraction of the storage terraces, our recovery prior is high (>0.8). For the 'sealings existed' hypothesis to survive, the deposition rate would have to be vanishingly small compared to regional analogs. I am arguing that the **burden of priors** has shifted: you now need a specific taphonomic model to explain the zero, whereas my model requires only standard deposition. The zero is statistically robust enough to license the institutional inference, even if it's not mathematically absolute."
  **Soft Spot:** Taphonomy is never truly "known"; a single unexcavated pit could contain the sealings.

  ### 3. The Practice Theory Grad Student
  **The Objection:** "You're reifying 'authority' out of habitus. Standardization isn't top-down; it's embodied practice. These potters learned to throw that size because that's how their teachers threw. You're erasing agency and calling it 'institution'."
  **The Reply:** "Embodied practice doesn't explain the **non-local clay**. If this were just habitus, we'd see local recipes standardized. The combination of a single, imported clay source *and* tight capacity clustering implies a **logistical chain** that exceeds household transmission. You can inherit a throwing style; you don't inherit a supply line to a specific clay bed 20km away without some coordinating mechanism. That mechanism is what I'm calling institutional."
  **Soft Spot:** Could be a single dominant family controlling the clay, not an "institution."

  ### 4. The Survey Director (Regional Context)
  **The Objection:** "This is one hilltop. Where is the consumption? If this is redistribution, where are the feeder sites? You're inferring a system from a single node without mapping the network."
  **The Reply:** "I agree the network is invisible. But the **storage density** on this hilltop exceeds local household consumption needs by a factor of ten. Whether the grain went down the hill or stayed up here, the **accumulation** required a mechanism to halt consumption. That halting mechanism is the institution. I don't need to map the flow to prove the dam exists."
  **Soft Spot:** If the "surplus" is actually multi-year household storage, the "redistribution" claim collapses.

  ### 5. The Ceramic Specialist (Production)
  **The Objection:** "60 profiles isn't enough for a capacity cluster. You're cherry-picking the near-completes. The 4,000 sherds might show much higher variance."
  **The Reply:** "The 60 profiles are the only ones with reconstructable rims and bases. The 4,000 sherds confirm the fabric consistency (single recipe). I'm not ignoring the sherds; I'm using them to confirm the **production uniformity**, while using the profiles to measure the **output uniformity**. The variance in the sherds' fabric is as low as the variance in the profiles' volume."
  **Soft Spot:** Reconstruction bias (maybe the broken ones were the non-standard ones).

  ### 6. The "So What?" on Belief
  **The Objection:** "If you can't infer belief, why raise it? You're setting up a straw man. Nobody thinks plain pots mean no gods."
  **The Reply:** "Because in this region, 'lack of iconography' is currently being read as 'lack of ideological complexity.' I need to sever that link. I'm arguing that **symbolic silence is not data**. If we treat the absence of decoration as evidence of secularity, we misread the site. I need the room to accept that my silence on belief is a **methodological boundary**, not a finding."
  **Soft Spot:** Risks sounding like you're dodging the "human" element of the society.

  ### 7. The Taphonomy of the Null (Sealings)
  **The Objection:** "Sealings are clay. Your pots are fired. Maybe the sealings just weren't fired and dissolved in a wet season you haven't found yet."
  **The Reply:** "The floors are sealed arid contexts. We have organic preservation (basket impressions). If basket fiber survived, unfired clay sealings protected by storage jars would survive. The **differential preservation** argument doesn't hold here. The zero is real."
  **Soft Spot:** Micro-climate variations within the site could still destroy unfired clay.

  ### 8. The Market Alternative
  **The Objection:** "Standardized jars are for trade. This isn't redistribution; it's a market hub. Markets standardize weights and measures without a 'state'."
  **The Reply:** "Markets standardize for exchange; this site shows **storage**, not exchange debris. No counters, no tokens, no variety of origins. A market hub attracts variety; this site repels it. This is a **sink**, not a node. That points to accumulation/redistribution, not market exchange."
  **Soft Spot:** A state-controlled market looks exactly like a redistribution node in the archaeological record.

  ---

  ## 3. THE OBJECTION TO ABSORB (Do Not Fight)
  **Target:** The Senior Guy's "State" Label (see Objection #1).
  **Strategy:** Do not defend the word "State." It carries too much theoretical baggage (monopoly on violence, bureaucracy, stratification).
  **Action:** Say: "You're right that 'State' is too heavy a word here. I concede that. I am arguing for **Administrative Capacity**, not Statehood. If we agree there is a mechanism enforcing volume standardization and clay sourcing, we can disagree on whether that counts as a 'State' without invalidating the institutional inference."
  **Why:** This makes you look reasonable and isolates the methodological claim (pots $\rightarrow$ institution) from the theoretical claim (pots $\rightarrow$ state).

  ---

  ## 4. THE "PRAYER" QUESTION
  **The Question:** "If the absence of iconography is methodologically silent on belief, couldn't the **choice** to be aniconic *itself* be a belief statement? Doesn't that collapse your asymmetry?"
  *(This attacks the core thesis: that you can separate institutional constraint from belief expression. If "no decoration" is a religious choice, then the pots *are* expressing belief.)*

  **The Opening Line:** "That's the critical boundary condition I'm still working through."
  **The Follow-up:** "I distinguish between **task-constraint** (capacity must hold X liters) and **symbolic-choice** (surface can be anything). If aniconism is a dogma, it operates like a capacity constraint—it removes variation. But unless I have an external reference for what their 'decorated' looks like, I can't distinguish 'dogmatic aniconism' from 'economic efficiency.' I'm arguing we can't tell the difference from *inside* the assemblage."
