answer: |-
  Here is the breakdown of the slogan, the mapping to your flatmate's moves, the Keynesian audit, and the logical stress tests you requested.

  ### I. The Menu of Readings
  *For each reading, "Better" is defined by the metric provided.*

  1.  **The Coverage Reading**
      *   **Statement:** An interval estimate that contains the true outcome is epistemically superior to a point estimate that misses the true outcome.
      *   **Definitions:** "Roughly right" = Truth $\in$ Interval. "Precisely wrong" = Point Estimate $\neq$ Truth. "Better" = Higher frequency of containing the truth.
      *   **Verdict:** **Platitude / Trivial.** Any interval from 0% to 100% is maximally "roughly right" by this metric but carries zero information. It ignores calibration and sharpness.

  2.  **The Decision-Robustness Reading**
      *   **Statement:** A decision that yields acceptable utility across a wide range of probable states is superior to a decision optimized for a single expected value that may be incorrect.
      *   **Definitions:** "Roughly right" = Robust policy. "Precisely wrong" = Fragile optimization. "Better" = Higher expected utility under model uncertainty.
      *   **Verdict:** **Substantive & Defensible.** This is standard robust decision-making (e.g., Info-Gap theory). It justifies using intervals for *action*, but not necessarily for *belief reporting*.

  3.  **The Input-Garbage Reading**
      *   **Statement:** When input parameters are highly uncertain, precise calculation of outputs creates a false sense of validity (spurious precision).
      *   **Definitions:** "Roughly right" = Qualitative directionality. "Precisely wrong" = Quantitative output from flawed inputs. "Better" = Avoiding misleading confidence.
      *   **Verdict:** **Substantive & Defensible.** This validates skepticism toward complex spreadsheets (Job 3), but does not justify withholding a best guess (Job 2).

  4.  **The Weight-of-Evidence Reading**
      *   **Statement:** A probability judgment backed by high "weight" (evidence volume) is superior to one with low weight, even if the numerical probability is identical.
      *   **Definitions:** "Roughly right" = High weight/low ambiguity. "Precisely wrong" = Low weight/high ambiguity masked as precision. "Better" = Epistemic honesty about the *reliability* of the probability.
      *   **Verdict:** **Substantive & Defensible.** This distinguishes risk (known probabilities) from uncertainty (unknown probabilities).

  5.  **The Scoring-Rule Reading**
      *   **Statement:** Under proper scoring rules (Brier, Log), a wide interval yields a better (lower) penalty score than a specific point estimate that turns out to be incorrect.
      *   **Definitions:** "Roughly right" = Wide interval. "Precisely wrong" = Missed point. "Better" = Better forecast score.
      *   **Verdict:** **False.** Proper scoring rules penalize vagueness. A 2–40% interval will score worse than a calibrated 8% point estimate, even if the 8% misses.

  ---

  ### II. Mapping the Jobs
  *Which reading licenses the move, and was he entitled to it?*

  **Job 1: Refusing a point estimate (offering 2–40% instead).**
  *   **Required Reading:** **The Weight-of-Evidence Reading** (or Coverage). He is claiming the *reliability* of the 8% is too low to report it as a single number.
  *   **Entitlement:** **Partial.** As a forecaster, he knows scores require points. As a PhD researcher, he knows AI risk is "Knightian Uncertainty." He is entitled to express low weight of evidence, but not to refuse the point estimate if he claims to be playing the forecasting game. He is mixing two language games (scientific uncertainty vs. tournament forecasting).

  **Job 2: Claiming the wide interval is *more rational* than the 8% best guess.**
  *   **Required Reading:** **The Scoring-Rule Reading** (implicitly) or **The Coverage Reading**. He implies the interval is a "better" representation of reality.
  *   **Entitlement:** **None.** This is the contradiction. If 8% is his honest best guess (mean/median), suppressing it makes him *less* accurate, not more robust. Under his own forecasting regime, the 8% is the rational commitment; the interval is auxiliary information about variance/uncertainty. Hiding the mean is irrational for a forecaster.

  **Job 3: Dismissing your cost-benefit spreadsheet.**
  *   **Required Reading:** **The Input-Garbage Reading.**
  *   **Entitlement:** **High.** If your spreadsheet relies on point estimates for variables that are fundamentally unknown (e.g., "cost of incident"), the output is indeed "precisely wrong." This is the strongest use of the slogan.

  ---

  ### III. The Keynes Audit
  *Does the slogan reflect Keynes, or is it bumper-sticker noise?*

  The attribution is apocryphal (likely a paraphrase of sentiments in *The General Theory* or *A Treatise on Probability*), but the **concepts** are Keynesian.

  1.  **Weight of Evidence:** In *A Treatise on Probability*, Keynes explicitly argues that probability (degree of belief) and weight (amount of evidence) are distinct. He would support **Job 1** (refusing to treat a low-weight probability as a high-weight number).
  2.  **Uncertainty vs. Risk:** In *The General Theory*, Keynes distinguishes measurable risk from unmeasurable uncertainty. He would support **Job 3** (distrust of Benthamite calculation when the future is non-ergodic).
  3.  **The Mismatch:** Keynes would **not** support **Job 2**. He did not argue that vagueness is inherently superior for *belief*; he argued that numerical measurement is sometimes impossible. If your flatmate *can* form a best guess (8%), Keynes would not say suppressing it is virtuous. The "Keynesian" move is to say "The probability is non-numerical," not "The probability is 8% but I'll tell you 2–40%."

  **Verdict:** Your flatmate is using Keynesian decoration to justify a non-Keynesian move. He is admitting a number exists (8%) but hiding it, whereas Keynes would question whether the number exists at all.

  ---

  ### IV. The Logical Stress Tests

  **1. Is the slogan self-applying?**
  *   **Test:** Is the claim "Better to be roughly right than precisely wrong" itself roughly right or precisely wrong?
  *   **Result:** It is **self-undermining** if taken as a precise rule. If it is a precise rule, it forbids itself (because it claims to be precisely right about methodology). If it is only "roughly right," it admits exceptions where precision *is* better (e.g., dosing medicine, forecasting tournaments).
  *   **Conclusion:** It is a heuristic, not a theorem. It applies only when model uncertainty dominates parameter uncertainty.

  **2. The Decision Paradox:**
  *   **Test:** Can you decide to widen your interval without already having a number in hand?
  *   **Result:** **No.** To choose a 2–40% interval over an 8% point, you must have a second-order probability distribution (a distribution over probabilities). You have already done the calculation you claim to reject. You cannot opt out of numeracy by using numbers to define your vagueness.
  *   **Conclusion:** The interval *presupposes* the point estimate (the center of the interval). Hiding the center is obfuscation, not humility.

  ---

  ### V. The Bottom Line
  *Say this to him next time:*

  "Keynes distinguishes between uncertainty that can't be numbered and risk that can; since you just admitted 8% is your best guess, you're in the latter camp. Hiding the number doesn't make you robust, it just breaks your own scoring rule."
