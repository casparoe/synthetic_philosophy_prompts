  *Wait, one more check:* "Mark all figures as illustrative — I do not want researched statistics." Okay, I will explicitly state that the numbers are mock data for the sake of the procedure demonstration.

  *The "Resentful Verdict":* I need to make sure the logic leads to a conclusion that contradicts the prevailing narrative. E.g., "Rising powers usually stall."

