prompt: |-
  I run the long-horizon research desk at a geopolitical risk firm. Clients ask us whether a currently rising power will still be rising in twenty-five years, or whether the security order in a given region will survive the decade, and our analysts answer by writing a narrative history and then attaching a number that tracks whichever story they found most vivid. I want a written procedure that puts the outside view first: an ordered sequence of steps an analyst without statistical training can run in about two days, from framing the question to delivering an interval with its base-rate anchor recorded.

  It must confront three difficulties rather than paper over them. First, for questions of this kind the natural reference class may contain only a handful of members; say what the analyst does when no available class yields a usable base rate. Second, the members are not independent draws — powers embedded in the same era or the same system move together — so a headcount of cases overstates how much weight the base rate can bear; give a rule for discounting it. Third, clients routinely argue that the mechanism behind the base rate has stopped operating (nuclear weapons, economic entanglement, changed norms about territorial conquest). The procedure must permit that claim to be made and tested, but must not let it function as a standing escape hatch back to the inside view.

  Also specify: how the class is defined before any outcomes are examined, what afterwards counts as a legitimate reason to redefine it, how far case-specific information may move the estimate off the base rate and in what increments, and where the procedure halts and reports the question unforecastable.

  Then run it end to end on two client questions of your choosing in this genre, at least one of which yields a verdict the client will resent. Mark all figures as illustrative — I do not want researched statistics. Close with what the procedure cannot do, and which of its steps are judgment calls dressed up as arithmetic.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and examples:

  1.  **Deconstruct the Request:**

      *   **Role:** Long-horizon research desk at a geopolitical risk firm.
      *   **Task:** Create a written procedure for forecasting (25-year horizons, security orders, rising powers) that prioritizes the *outside view* (base rates) over the *inside view* (narrative).
      *   **Target Audience:** Analysts without statistical training.
      *   **Timeframe:** Executable in ~2 days.
      *   **Output:** An interval with a base-rate anchor.
      *   **Key Constraints/Difficulties to Address:**
          1.  *Small Reference Classes:* What if $N$ is tiny or zero?
          2.  *Non-Independence:* Cases are clustered/era-dependent (pseudoreplication). Need a discounting rule.
          3.  *Structural Breaks:* Clients claim "this time is different" (nukes, norms). Need a way to test this without allowing it to become an excuse for intuition.
      *   **Specific Specifications:**
          *   Define class *before* examining outcomes.
          *   Legitimate reasons to redefine class *afterwards*.
          *   Limits on case-specific adjustments (how far, what increments).
          *   Stopping rule (when to report "unforecastable").
      *   **Demonstration:** Run the procedure on two client questions (one must yield a resentful verdict).
      *   **Disclaimer:** Mark figures as illustrative (no researched stats).
      *   **Conclusion:** Limitations of the procedure and where judgment is disguised as arithmetic.

  2.  **Drafting the Procedure (The "Outside-View Protocol"):**

      *   *Name:* Needs to sound formal but operational. "The Base-Rate Anchor Protocol" or "The Two-Day Outside View." Let's go with "Protocol O-25" (Outside View, 25-year horizon).
      *   *Phase 1: Framing (Day 1 Morning).* Define the event and the reference class. Crucial: Blind definition.
      *   *Phase 2: Base Rate Calculation (Day 1 Afternoon).* Count cases. Apply the discount for non-independence.
      *   *Phase 3: Structural Break Test (Day 2 Morning).* Address the "this time is different" claim. Needs a burden of proof.
      *   *Phase 4: Adjustment & Interval (Day 2 Afternoon).* Move from base rate based on specific evidence. Set limits.
      *   *Addressing the Three Difficulties:*
          1.  *Small N:* If $N < 5$, widen intervals significantly or merge classes. If $N=0$, declare unforecastable or use a proxy class with heavy discount.
          2.  *Non-Independence:* Apply an "Effective N" discount (e.g., cluster by era).
          3.  *Structural Breaks:* Require a *mechanism* that has already demonstrated predictive power in analogous domains, not just a theoretical claim.
      *   *Stopping Rule:* If the reference class cannot be defined without peeking at outcomes, stop.

  3.  **Refining the Rules (Self-Correction/Iterative Design):**

      *   *Constraint:* Analysts have no stats training. Keep math simple. Fractions, percentages, simple discounts.
      *   *Constraint:* 2 Days. Don't ask for deep archival research.
      *   *The "Resentful Verdict":* One example needs to tell the client something they don't want to hear (e.g., "Your rising power is likely to stall" or "The security order will collapse").
      *   *Adjustment Increments:* To prevent anchoring on intuition, adjustments should be in fixed steps (e.g., 5% blocks) tied to specific evidence criteria.

  4.  **Developing the Examples:**

      *   *Example 1 (The Resentful One):* "Will Country X remain a rising power in 2050?" (Let's use a hypothetical "Rising Power A"). The base rate for rising powers stalling is high. The client wants to hear "Yes." The model says "Probably No."
      *   *Example 2 (The Stability One):* "Will the Security Order in Region Y survive?" (e.g., Arctic or South China Sea). Let's go with "Will the current alliance structure in Region Z hold?"
      *   *Note:* Must mark stats as illustrative.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the tone. Rigorous, humble, anti-narrative.
      *   **The Protocol (Steps 1-6):**
          *   Step 1: Blind Class Definition.
          *   Step 2: The Count & The Discount (Addressing Non-Independence).
          *   Step 3: The Small-N Rule (Addressing Scarcity).
          *   Step 4: The Structural Break Challenge (Addressing "This Time Is Different").
          *   Step 5: The Inside-View Adjustment (Capped).
          *   Step 6: The Unforecastable Stop.
      *   **Case Study 1:** The Rising Power (The "No" answer).
      *   **Case Study 2:** The Regional Order (The "Yes/Uncertain" answer).
      *   **Limitations & Confession:** Where the math is fake.

  6.  **Refining the "Structural Break" Rule:**
      *   This is the hardest part. How to stop clients from saying "Nukes exist now, they didn't in 1914."
      *   *Rule:* The break must be *quantifiable* or *historically precedented* in its effect size. If the claim is "Norms have changed," demand a proxy metric (e.g., frequency of conquest). If no metric exists, the base rate stands.

  7.  **Refining the "Non-Independence" Rule:**
      *   Simple heuristic: Group by "Systemic Era." If 10 cases happen in one 20-year window, count them as 2 effective cases, not 10.

  8.  **Review against Constraints:**
      *   2 Days? Yes, steps are streamlined.
      *   No Stats Training? Yes, arithmetic is basic.
      *   Three Difficulties addressed? Yes (Small N, Dependence, Structural Breaks).
      *   Resentful Verdict? Yes (Case 1).
      *   Illustrative Figures? Yes, will label them clearly.

  9.  **Final Polish:**
      *   Tone check: Professional, slightly cynical about narratives, rigorous.
      *   Formatting: Clear headings, bold text for rules.
      *   Closing: Honest assessment of the procedure's own biases.

