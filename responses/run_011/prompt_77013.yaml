  Bottom line: I have hit every constraint, but the case is most fragile on the payoff gap between the second exit and the cumulative bonus—if the second exit pays too much, the interim temptation to stop overwhelms the plan.

  **Scenario**
  A night-shift technician must inspect two identical backup generators, G1 and G2, arranged in series along a dark corridor. At each generator, she faces three choices: **Scrap** (end the job immediately), **Move** (proceed to the next station), or **Charge** (spend effort to boost the system's final reliability bonus, then proceed). Scraping G1 yields \$0 (it's obsolete); Scraping G2 yields \$10 (it's new). Moving costs nothing. Charging costs \$2 in effort but adds \$5 to the final system bonus (base \$8), regardless of which generator is charged; bonuses stack. She cannot distinguish G1 from G2 due to identical panels and poor lighting, and she cannot remember if she has already acted once.

  **The Working**

  **1. The Ex Ante Problem**
  The technician plans a strategy before starting. Since she cannot distinguish the nodes, her strategy must be the same at both. Let $c$ be the probability she chooses **Charge**, $e$ the probability she chooses **Scrap**, and $m$ the probability she chooses **Move** ($c+e+m=1$).
  If she **Scrap**s at the first node she encounters, the job ends.
  If she **Charge**s, she pays \$2, adds \$5 to the final bonus, and reaches the next node.
  If she **Move**s, she reaches the next node with no cost or bonus.

  Let's evaluate pure strategies first to find the optimum.
  *   **Always Scrap ($e=1$):** She scraps at G1. Payoff = \$0.
  *   **Always Move ($m=1$):** She passes G1, passes G2, reaches End. Payoff = Base Bonus \$8.
  *   **Always Charge ($c=1$):** She charges G1 (cost \$2, +\$5), charges G2 (cost \$2, +\$5), reaches End (Base \$8).
      Payoff = $-2 + 5 - 2 + 5 + 8 = \$14$.

  Is a mixed strategy better? Suppose she mixes Charge and Scrap ($m=0$).
  Probability she reaches G2 is $(1-e) = c$.
  Expected Payoff $W(c) = c \times [ (\text{Payoff at G1}) + (\text{Expected Payoff at G2}) ]$.
  Actually, simpler: She gets G1 payoff, then reaches G2 with prob $c$.
  $W(c) = c(-2 + 5) + c [ e(10 + 5) + c(-2 + 5 + 5 + 8) ]$.
  (Note: If she scraps at G2, she gets Exit Value \$10 plus the \$5 bonus from G1. If she charges at G2, she gets End Value \$8 plus \$5 from G1 and \$5 from G2, minus \$2 cost).
  $W(c) = c(3) + c [ (1-c)(15) + c(16) ]$.
  $W(c) = 3c + 15c - 15c^2 + 16c^2 = 18c + c^2$.
  This function is strictly increasing for $c \in [0,1]$. The maximum is at $c=1$.
  **Ex Ante Optimum:** Always Charge ($c=1$). Value = \$14. This is a strict maximum (derivative at $c=1$ is $18+2=20 > 0$).

  **2. The Ex Interim Situation**
  She finds herself standing at a generator. She knows her ex ante plan was **Always Charge**.
  **Belief Derivation:** Since the plan is to never Scrap and never Move (always Charge), she visits both G1 and G2 with probability 1. Upon waking at a node without memory, the probability it is G1 versus G2 is proportional to the frequency of visits.
  $\mu(\text{G1}) = \frac{1}{1+1} = 0.5$.
  $\mu(\text{G2}) = 0.5$.
  (This satisfies the non-degenerate constraint).

  **3. The Ex Interim Calculation**
  She must choose an action now ($q_{\text{Scrap}}, q_{\text{Move}}, q_{\text{Charge}}$) to maximize expected value from *this point forward*, assuming she will stick to the **Always Charge** plan at any future node.
  *   **Value of Future Plan:** If she proceeds to the next node, she will Charge there.
      *   If Next is G2: She Charges (-\$2), adds \$5, reaches End (\$8 + \$5 from G1). Total from G2 onward = $-2 + 5 + 13 = \$16$.
      *   If Next is End: She reaches End (\$8 + \$5 from G1). Total from End onward = \$13.
      *   Expected Value of Proceeding (Move) = $0.5(16) + 0.5(13) = \$14.5$.
      *   *Correction on Accounting:* Let's count strictly from the current node.
      *   **If at G1:**
          *   Scrap: \$0.
          *   Move: Reach G2. G2 Plan=Charge. Value = $-2 (\text{cost}) + 5 (\text{bonus}) + 8 (\text{base}) + 5 (\text{G1 bonus}) = \$16$.
          *   Charge: $-2 (\text{cost}) + 5 (\text{bonus}) + \text{Value(G2)} = -2 + 5 + 16 = \$19$.
      *   **If at G2:** (Note: G1 Bonus \$5 is already sunk/secured).
          *   Scrap: \$10 (Exit) + \$5 (G1 Bonus) = \$15.
          *   Move: Reach End. Value = \$8 (Base) + \$5 (G1 Bonus) = \$13.
          *   Charge: $-2 (\text{cost}) + 5 (\text{bonus}) + \$8 (\text{Base}) + \$5 (\text{G1 Bonus}) = \$16$.
      *   **Expected Value at Node (given $\mu=0.5$):**
          *   **Scrap:** $0.5(0) + 0.5(15) = \$7.5$.
          *   **Move:** $0.5(16) + 0.5(13) = \$14.5$.
          *   **Charge:** $0.5(19) + 0.5(16) = \$17.5$.

  **4. Agreement Check**
  *   **Ex Ante Optimal Plan:** Always Charge.
  *   **Ex Interim Optimal Action:** Charge (Value \$17.5) strictly dominates Move (\$14.5) and Scrap (\$7.5).
  *   **Consistency:** The action she wants to take at the node matches the plan she made at the start. The margin is strict (\$3 over the next best option).

  **The Honest Part**

  The single structural feature doing the work is the **additive bonus of the third option**. In the standard Absent-Minded Driver, the only way to get value is to stop at a specific node, creating a tension between "I should keep going to find the good node" and "I might be at the good node now." Here, the **Charge** option decouples value extraction from location. Because Charging pays off regardless of whether you are at G1 or G2 (by boosting the final end-state), the belief uncertainty ($\mu=0.5$) doesn't penalize the action. The agreement holds because the action is robust to the belief.

  If I nudge the **Scrap G2 payoff** from \$10 to \$30, the agreement collapses.
  *   New Interim Scrap Value: $0.5(0) + 0.5(30+5) = \$17.5$.
  *   New Interim Charge Value: \$17.5 (unchanged).
  *   Now she is indifferent. If I nudge to \$31, she strictly prefers to Scrap ex interim, but Ex Ante she still prefers to Charge (since Scraping at G1 yields 0). The time inconsistency returns.

  A proponent of the "Planning Only" view (like Aumann or Piccione/Rubinstein in some readings) would attack this by arguing that the ex interim calculation is epistemically illegitimate. They would say: "You are either at G1 or G2. Calculating an average based on a frequency ($\mu=0.5$) is a category error because the agent cannot access that frequency at the moment of choice. The only rational object is the ex ante plan; the fact that the agent *feels* like optimizing at the node is a psychological glitch, not a rational requirement."

  This attack lands on the *necessity* of the interim check, but not on the *validity* of the consistency. My construction shows that the ex ante optimal plan is **sequentially rational**—it survives the agent's own scrutiny at the node. While the planner might say "Just follow the plan," the technician at the node needs a reason not to deviate. This case proves that for certain payoff structures, the plan provides its own reason, rendering the planning/acting split harmonious rather than paradoxical.
