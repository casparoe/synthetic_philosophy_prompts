  My opening move: the self-confessing hypocrite. He says "I do this too, I'm hardly one to talk, but what you did was still wrong." No exemption claimed, no unfairness, no insincerity — he has explicitly disclaimed the prerogrative your account says he was usurping. So does he have standing now? If yes, the demand was never what did the work; if no, tell me what exactly he's still missing.
