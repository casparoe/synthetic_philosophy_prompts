      *   **Antonio's Ships (Natural vs. Unnatural):** Colleague says Antonio = natural. User says Ships = risk/expectation = unnatural. *Critique:* User is right. Antonio is a merchant capitalist, not a household manager. His wealth is speculative. This undermines the "Antonio = Virtue" binary.
