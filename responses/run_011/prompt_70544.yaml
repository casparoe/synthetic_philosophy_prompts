answer: |-
  1. Premise-by-Premise Translation

  **The Stepwise Character of the Change:** In doctrine, this maps to **piecemeal revision** as opposed to refounding. As long as amendments proceed sequentially through the prescribed procedure, the order persists.
  *Label: Translates cleanly.*
  *Reason:* Both contexts rely on the intuition that incremental change preserves identity where sudden substitution would not.

  **The Absence of Any Moment of Death:** This corresponds to the **office that survives every occupant of it** and the **corporation sole** fiction. The legal order never experiences an interregnum; the Crown never dies.
  *Label: Translates cleanly.*
  *Reason:* Continuity of the structure is maintained regardless of the material turnover of its components or occupants.

  **The Preservation of Functional Organization:** This is the **basic-structure** doctrine descending from *Kesavananda Bharati*. So long as the essential features remain intact, the entity survives.
  *Label: Translates cleanly.*
  *Reason:* Identity is tied to invariant structural features rather than mutable content.

  **The Sufficiency of That Preservation for Survival:** This equates to the validity of an **unconstitutional constitutional amendment** being denied, but conversely, any amendment respecting the basic structure is deemed valid. The order survives because it remains valid.
  *Label: Translates only with distortion.*
  *Reason:* Legal validity is a normative status conferred by recognition, whereas personal survival is typically conceived as a metaphysical fact independent of recognition.

  **The Claim That Substrate Makes No Difference:** This mirrors the distinction between **constituent power** and **constituted power**. The source of authority (the People) matters, not the material medium of the text.
  *Label: Translates only with distortion.*
  *Reason:* Law is inherently abstract and substrate-neutral by design; minds are arguably embodied, making substrate neutrality a contested metaphysical claim rather than a definitional feature.

  **The Inference to the Scanning Case:** This attempts to leap from amendment to **refounding** or revolutionary constitution-making, claiming the new order inherits the legitimacy of the old due to functional similarity.
  *Label: Having no counterpart at all.*
  *Reason:* Constitutional doctrine treats a break in procedural continuity as a revolution creating a new order; it cannot explain how a discontinuous scan inherits identity from a continuous biological history without a bridging procedure.

  2. An Explicit Accounting of the Residue

  The translation fails to carry the phenomenological weight of the uploading argument. Constitutional vocabulary speaks exclusively to validity, authority, and institutional persistence. It has no resources for **experience**. When the Basic Law protects constitutional identity under **Article 79(3)**, it protects a normative framework from erosion, not a subject's first-person perspective from extinction. The residue is the qualia of the uploader—the fear that the lights might go out even if the institution remains open.

  The diagnosis is that the failure lies not in the constitutional vocabulary, but in the original argument. The gradual-replacement argument borrows its plausibility from normative continuity rather than metaphysics. When we intuit that the subject survives neuron replacement, we are likely tracking the persistence of a functional order capable of bearing rights and responsibilities, not the persistence of a metaphysical ego. The uploading argument claims to describe ontological survival, but it operates like a doctrine of **constitutional identity**: it ensures the system remains recognizable enough to maintain its commitments. If this diagnosis holds, the uploading debate is not about whether "I" will wake up, but whether the resulting entity is entitled to claim my social and legal standing. The constitutional vocabulary exposes that "survival" in this context may be a shorthand for "successful succession" rather than "continued existence."

  3. A Check on Smuggling

  The translation relies on several assumptions native to constitutional theory that distort the metaphysical argument. First, it assumes **identity is settled by an authoritative interpreter**. In law, a Constitutional Court decides whether an amendment violates the basic structure; in the mind, there is no internal supreme court to adjudicate whether you are still you. The translation smuggles in the idea that survival is a verdict rather than a fact.

  Second, it assumes **the persisting thing is a normative order rather than an organism**. Constitutional theory treats the state as a fiction that persists through the replacement of all its material parts. Applying this to the mind presupposes that persons are similarly abstract offices rather than biological entities. This begs the question against the biological skeptic.

  Third, it assumes **there is a people capable of binding itself and of being wronged by its own transformation**. The doctrine of **constituent power** relies on a collective agent that can authorize changes to its own constitution. The uploading argument applies this to an individual, smuggling in a model of self-authorship that may not exist. The individual cannot stand both as the constituent power (the agent authorizing the upload) and the constituted power (the subject undergoing it) without invoking a homunculus-like division that constitutional theory accepts for states but metaphysics rejects for minds. These stretches must be flagged: the translation works only if we treat the person as a polity, which is precisely what the skeptic denies.

  4. Adversarial Test Cases

  **The Rollback Scenario:** Suppose the biological brain is restored after gradual replacement. In constitutional doctrine, if an amendment is repealed and the earlier text reinstated, the original law is often considered revived, restoring the prior legal order. The analogy predicts the **return of the original subject**. However, in philosophy of mind, a gap in psychological continuity or a break in causal chains might suggest the restored brain is a duplicate, not the original. Here, the analogy is idle; legal revival doctrines are pragmatic rules of recognition, not metaphysical truths about temporal persistence. The law restores the text for stability; it does not claim the history never happened.

  **The Sufficiency Claim:** Amendment doctrine is content with preserved institutional function; if the parliament still legislates and the courts still adjudicate, the state survives. The skeptic about uploading holds that function preserved is entirely compatible with experience lost (the zombie objection). Here, the divergence is **load-bearing**. It reveals that the constitutional analogy validates the "social survival" of the person (rights, responsibilities, memory) while conceding the possibility of "phenomenal death." The analogy explains why we treat uploaders as persons legally, but it cannot assure them they will not die experientially. The divergence shows the uploading argument succeeds as a theory of normative succession but fails as a theory of metaphysical continuity.

  5. A Note in the Other Direction

  Constitutional doctrine offers a distinction the uploading debate lacks: the concept of **unamendability** and the difference between a valid act and one that **destroys what validates it**. In law, an amendment that abolishes democracy is void because it destroys the ground of its own validity. Uploading debates rarely ask if there are cognitive structures that are unamendable without destroying the self.

  Importing this distinction would likely **dissolve the question** rather than resolve it. It shifts the inquiry from "Is this me?" to "Is this transformation compatible with the conditions of possibility for being a subject at all?" If certain cognitive structures function as the **eternity clause** of the mind, violating them does not produce a changed subject but no subject. This moves the debate away from gradualism versus discontinuity and toward identifying the invariant core of agency. It suggests that survival is not a matter of degree but of maintaining the basic structure of consciousness. If the upload violates that basic structure, it is not a survival case but a suicide case, regardless of functional similarity. This doctrinal import forces the proponent of uploading to identify the mind's Article 79(3), lest the argument collapse into a description of a functioning corpse.
