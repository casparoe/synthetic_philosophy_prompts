answer: |-
  Here is a complete lesson plan designed for your 75-minute session. It includes the game materials, protocols, timeline, debrief script, and troubleshooting guide.

  # Instructor's Briefing: "The Choice Game"

  **Philosophy:** The goal is not to prove the Axiom of Choice (AC) is true, but to simulate the *experience* of constructive failure. You want students to feel the frustration of having non-empty sets but no *uniform* way to pick from them.
  **Logistics:** 6 Teams (A–F), 4 students each. Arrange tables in a hexagon or clusters. You are the "Chair." You need a whiteboard for scoring and a timer.
  **Materials:** 18 Envelopes (3 Rounds $\times$ 6 Teams). Each envelope contains 3-4 "Family Cards." You also need "Challenge Slips" and "Bet Slips."

  ---

  ## Part 1: Game Materials (The Envelopes)

  Print these on card stock. Each team gets one envelope per round.

  ### Round 1: The Warm-Up (Constructible & Canonical)
  *Instruction:* For each Family below, write a rule that selects exactly one element from every set in the family.
  *   **Family 1.1:** $\mathcal{F} = \{ S \subset \{1, 2, \dots, 100\} \mid S \neq \emptyset \}$. (Non-empty finite subsets of integers).
  *   **Family 1.2:** $\mathcal{F} = \{ [a, b] \subset \mathbb{R} \mid a < b \}$. (Closed intervals).
  *   **Family 1.3:** $\mathcal{F} = \{ \{n, n+1\} \mid n \in \mathbb{Z} \}$. (Pairs of consecutive integers).

  ### Round 2: The Trap (Infinite & Non-Canonical)
  *Instruction:* Same as Round 1. Beware: Some rules sound valid but fail on specific sets.
  *   **Family 2.1:** $\mathcal{F} = \{ (a, b) \subset \mathbb{R} \mid a < b \}$. (Open intervals).
  *   **Family 2.2:** $\mathcal{F} = \{ S \subset \mathbb{N} \mid S \text{ is infinite} \}$. (Infinite subsets of naturals).
  *   **Family 2.3:** $\mathcal{F} = \{ C_r \subset \mathbb{R}^2 \mid r > 0 \}$, where $C_r$ is the circle of radius $r$ centered at the origin.

  ### Round 3: The Wall (The Vitali Family)
  *Instruction:* Same as Round 1.
  *   **Family 3.1:** Let $\sim$ be the equivalence relation on $\mathbb{R}$ defined by $x \sim y \iff x - y \in \mathbb{Q}$. Let $\mathcal{F} = \mathbb{R} / \sim$ be the set of all equivalence classes. (Select one real number from each class).
  *   **Family 3.2:** $\mathcal{F} = \{ \{x, y\} \subset \mathbb{C} \mid x \neq y \}$. (Unordered pairs of distinct complex numbers).
  *   **Family 3.3:** $\mathcal{F} = \{ S \subset \mathbb{R} \mid S \neq \emptyset \}$. (All non-empty subsets of real numbers).

  ---

  ## Part 2: Protocol & Scoring

  ### The Rule Definition
  A **Rule** is a finite string of text (formula, algorithm, or logical condition) that takes a Set $S$ as input and outputs an element $x$.
  *   **Valid:** "Pick the minimum element." "Pick the midpoint." "Pick the element with the smallest absolute value."
  *   **Invalid:** "Pick the one that looks smallest." "Pick the one I like." "Pick the smallest (if it exists)."

  ### The Adversarial Challenge
  1.  **Submission:** Team submits a Rule for a Family.
  2.  **Challenge:** A rival team (assigned by you) receives the Rule and *one specific Set* from that Family (which you provide secretly).
  3.  **Execution:** The Challenger acts as a computer. They must apply the Rule to the Set.
      *   **Win for Submitter:** Challenger produces exactly one element that is in the Set.
      *   **Win for Challenger:** Challenger finds the Rule is ambiguous (two answers), impossible (no answer), or requires a "judgment call" not in the text.
  4.  **Chair Ruling:** You arbitrate disputes on whether a rule requires judgment.

  ### Scoring Scheme
  *   **Round 1 & 2:** 10 points per valid Rule. 5 bonus points for a successful Challenge (catching a rival's bad rule).
  *   **Round 3:** 0 points for Rules (expect failure).
  *   **The Bet (Post-Round 3):** Teams secretly write "EXISTS" or "IMPOSSIBLE" regarding a choice function for Family 3.1.
      *   **Scoring the Bet:** Everyone gets 20 points regardless of answer. (The point is the discussion, not the guess).
      *   **Participation:** 5 points per round for submitting *something*.

  ---

  ## Part 3: Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–05** | **Setup & Rules** | Distribute Round 1. Explain "Rule" vs. "Judgment." |
  | **05–20** | **Round 1 Play** | Fast pace. Teams swap challenges. Verify "Min" works for 1.1, 1.3. Verify "Min" or "Midpoint" for 1.2. |
  | **20–35** | **Round 2 Play** | **Critical Phase.** Watch for "Min" on Open Intervals (2.1). Watch for "Min" on Infinite Subsets (2.2) — valid! Watch for "Intersection" on Circles (2.3). |
  | **35–55** | **Round 3 Play** | Distribute Vitali cards. Expect silence/frustration. Encourage them to try. Do not help. |
  | **55–60** | **The Bet** | Collect rules (most will be blank or invalid). Teams stake points on Existence. |
  | **60–75** | **Debrief** | The lecture portion. Connect game to AC, Russell, and Logic. |

  ---

  ## Part 4: The Debrief Script (Sequence of Questions)

  **Phase 1: The Experience (5 mins)**
  1.  "In Round 1, almost everyone succeeded. Why?" (Answer: The sets had structure we could exploit, like ordering or finiteness.)
  2.  "In Round 2, some rules failed. Specifically, who tried to pick the 'minimum' of an open interval $(0,1)$?" (Discuss why it failed: the element didn't exist in the set.)
  3.  "In Round 3, almost no one produced a valid rule. Why? Is it because you aren't smart enough, or because the math is broken?"

  **Phase 2: Russell's Socks vs. Shoes (5 mins)**
  4.  "Bertrand Russell had an analogy for Round 3. Imagine infinitely many pairs of **shoes**. Can you pick one from each pair?" (Yes: "Pick the left shoe.")
  5.  "Imagine infinitely many pairs of **socks**. Can you pick one from each pair?" (Intuitively: "No, they look the same.")
  6.  **The Nuance:** "Wait. In math, every object is distinct. $x$ is not $y$. So why are the socks hard? It's not that they are physically identical. It's that there is no **uniform property** distinguishing them. If I label the socks '1' and '2', you can pick '1'. The problem isn't the socks; it's the lack of a **labeling rule** available in our language."
  7.  "In Round 3, Family 3.1 (Vitali), every class looks like every other class shifted by a rational. There is no 'left' or 'right' in the structure we are allowed to use."

  **Phase 3: The Logical Status (5 mins)**
  8.  "So, does a function exist that picks one from each Vitali class?"
      *   **The Trap:** "We couldn't write it, so it doesn't exist."
      *   **The Truth:** "Your failure is **epistemic** (about your knowledge). The math question is **ontological** (about existence)."
  9.  "In standard set theory (ZFC), we **assume** such a function exists. That is the Axiom of Choice."
  10. "If we remove that axiom (ZF), we cannot prove it exists, but we cannot prove it *doesn't* exist either. It is **independent**."
  11. "Why do we care? Because assuming it exists lets us prove powerful things (every vector space has a basis). But it also creates monsters (non-measurable sets, Banach-Tarski)."

  ---

  ## Part 5: What the Game Fakes vs. Reality

  You must explicitly state this to avoid misconceptions.

  | Concept | How the Game Simulates It | The Mathematical Reality |
  | :--- | :--- | :--- |
  | **Definability** | **Accurate.** The game requires a written rule. This mirrors "definable choice functions." | In ZFC, choice functions exist even if they are **undefinable**. The game conflates "no rule" with "no function." |
  | **Countable vs. Full** | **Blurred.** Round 2 (Intervals) is essentially Countable Choice (or constructive). Round 3 is Full AC. | Countable Choice is weaker than Full AC. The game treats them as a gradient of difficulty, which is pedagogically useful but logically distinct. |
  | **Well-Ordering** | **Triggered.** Students will try to well-order $\mathbb{R}$. | The Well-Ordering Theorem is **equivalent** to AC. Using it to solve Round 3 is circular reasoning *unless* you assume AC first. |
  | **Time Limit** | **Fake.** You gave them 20 minutes. | The impossibility of defining a Vitali selector is not due to time; it is consistent with ZF that **no such definition exists**. |
  | **Non-Measurability** | **Hidden.** | A Vitali set is non-measurable. You should mention this: "The reason we can't pick one is tied to the fact that if we could, we could break calculus (measure theory)." |

  ---

  ## Part 6: Troubleshooting Predictable Failures

  You anticipated three specific moves. Here is exactly how to handle them live.

  ### 1. The "Least Element" Retreat to Well-Ordering
  **The Move:** A team proposes: "Pick the least element." You point out $\mathbb{R}$ has no least element in standard order. They reply: "Okay, use the Well-Ordering Theorem to order $\mathbb{R}$, then pick the least."
  **The Chair's Ruling:**
  > "I accept that logic, but I am flagging it as **Circular**. The Well-Ordering Theorem states 'Every set can be well-ordered.' This theorem is mathematically equivalent to the Axiom of Choice. You are using the Axiom of Choice to solve a problem designed to test the Axiom of Choice. In the context of this game, that counts as 'importing a judgment call' because you haven't told us *how* to well-order the reals, only *that* you can. For the purpose of the challenge, you must use the standard structure given."

  ### 2. The "Restrict to [0,1]" Reduction
  **The Move:** A team says: "Every class intersects $[0,1]$. So we just pick from there."
  **The Chair's Ruling:**
  > "This is a brilliant reduction, and mathematically sound. You have reduced the problem from $\mathbb{R}$ to $[0,1]$. However, look at the set now: $S \cap [0,1]$. It is still an infinite set of rational shifts. You have narrowed the bucket, but you still have to pick one sock from infinitely many indistinguishable socks inside that bucket. You have not provided the *selection rule*, only a smaller domain. The challenge remains: which one in $[0,1]$?"
  > **Pedagogical Use:** Use this to praise their intuition. "This is exactly how mathematicians work. We reduce the problem. But the hard core remains."

  ### 3. The "AC is False" Conclusion
  **The Move:** After class, students argue: "We couldn't write it, so it doesn't exist. AC is false."
  **The Chair's Response (In Debrief):**
  > "I need you to distinguish between **Construction** and **Existence**.
  > 1.  **Constructivism:** If you believe 'to exist is to be constructible,' then yes, AC is false. Some mathematicians hold this view.
  > 2.  **Classical Logic:** In the logic we use for engineering and most math, 'existence' means 'not contradictory.' It is not contradictory to assume a choice function exists.
  > 3.  **The Lesson:** Your inability to write the rule in 20 minutes is a fact about *undergraduates*. The impossibility of writing the rule *ever* (in certain formal languages) is a fact about *logic*. But even if you can't write it, assuming it exists allows us to prove theorems that work. We adopt AC not because it's 'obviously true,' but because it's 'usefully true.'"

  ### General "What If" Advice
  *   **If Round 3 is too quiet:** Walk around and ask, "Can you distinguish $x$ from $x + 1/2$ using only addition and multiplication?" (No). "Can you distinguish them using 'size'?" (No, they are dense).
  *   **If a team actually succeeds:** (Highly unlikely unless they invoke Well-Ordering). If they write "Let $f$ be a choice function guaranteed by ZFC," accept the rule but award 0 points for "Trivialization." Tell them: "You named the magic wand; you didn't build it."
  *   **If they finish Round 2 too fast:** Ask them to find a *second* valid rule for Family 2.3 (Circles). (e.g., "Highest point" vs "Rightmost point"). This reinforces that choice is arbitrary when multiple rules work.

  ### Substitute for Round 3 (If Vitali is too abstract)
  If you feel $\mathbb{R}/\mathbb{Q}$ is too heavy for your specific cohort, substitute **Family 3.2** (Pairs of Complex Numbers) as the primary challenge.
  *   **Why:** $\mathbb{C}$ has no standard ordering. You cannot say "pick the smaller one." You cannot say "pick the positive one."
  *   **The Trap:** Students will try to use magnitude $|z|$. But pairs can have equal magnitude (e.g., $\{1, i\}$). They will try to use argument (angle). But angle requires a branch cut (a choice!).
  *   **Benefit:** It isolates the "lack of ordering" issue without the quotient set machinery.
  *   **Recommendation:** Stick with Vitali (3.1) because you just taught quotients. It reinforces prior material. Use 3.2 only if they are truly stuck on the definition of equivalence classes.
