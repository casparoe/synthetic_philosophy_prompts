answer: |-
  **Brainstorm**
  *   **Options:** 1. Strict Mereological Essentialism (Registrar): Lose matter, lose object. 2. Functional/Formal Continuity (Conservator): Form persists, matter replaceable. 3. Ontic Vagueness (Philosopher): No fact of the matter.
  *   **Turns on:** Whether 'statue' picks out a material lump or an artefactual form; whether temporal continuity matters for identity; whether vagueness is in the world or our language.
  *   **Verdict:** Conservator right on identity, wrong on value; Registrar right on value, wrong on identity; Philosopher wrong on metaphysics (identity is absolute).
  *   **Key Move:** Distinguish constitution (lump) from identity (statue). The statue goes where the recognised form and function reside.
  *   **Timescale:** Metaphysically irrelevant; practically relevant for fraud, not ontology.
  *   **Outcome:** Plinth object is the 1963 statue. Study object is a fragment collection.

  ***

  **The Persistence of the Dancer: A Metaphysical Verdict**

  I have spent two decades arguing about whether a ship remains a ship when its planks are swapped, and whether a statue survives being melted down and recast. The dispute in your museum is not merely administrative; it is a textbook case of material constitution and persistence, dressed in the dust of marble and the bureaucracy of accession numbers. You require a verdict, not a map. Here it is: the object on the plinth is the statue catalogued in 1963. The object in the study room is not. The conservator is metaphysically correct but practically naive; the registrar is practically prudent but metaphysically mistaken; the philosopher is confused about the nature of vagueness.

  Let us begin with the conservator's central claim, the argument from gradualism. She posits that if she had replaced the missing thirty per cent one chip at a time over twenty years, no one would deny the statue's survival. Therefore, doing it in a fortnight should not alter the ontological status. This is an appeal to the Ship of Theseus, that ancient vessel kept in the harbour by the Athenians, whose timbers were replaced until none remained. Plutarch notes the philosophers fought over whether it remained the same vessel. The conservator assumes the case is settled in favour of continuity.

  Is she right? Metaphysically, yes. Artefacts like statues and ships are defined primarily by their form and function, not by the strict identity of their constituent matter. If they were defined by their matter, you could not restore a painting without creating a new one every time you added a stroke of retouching. The 'one-chip-at-a-time' argument works because it highlights that there is no non-arbitrary threshold of material loss that destroys identity. If losing one chip does not destroy the statue, and losing two does not, then losing enough chips to require replacement should not either, provided the form is maintained.

  Does the timescale matter? The registrar and the philosopher might suggest that a sudden replacement breaks continuity in a way gradual replacement does not. I argue it does not, not for identity. Metaphysical persistence is not sensitive to the speed of change, only to the continuity of form and function. A fortnight is a blink in the life of a Roman torso. The intuition that speed matters is pragmatic, not ontological. We worry about rapid replacement because it suggests forgery or a break in historical causality, not because the object ceases to exist. If a ship is repaired in a dry dock over a winter, it is the same ship as when it entered; if it is repaired in a fortnight by a larger crew, it is still the same ship. The conservator's error is assuming this metaphysical continuity guarantees historical authenticity. It does not. The statue survives, but its value as a historical witness is diluted by the new marble. She is right that it is the same statue; she is wrong to imply it is the same *relic*.

  The registrar takes the opposite view. She argues that losing thirty per cent of the matter all at once destroys the original. Her intuition relies on mereological essentialism—the idea that an object cannot lose any of its parts and remain the same object. This is a robust position for lumps of matter, but not for artefacts. If I cut my hair, I remain the same person. If a statue loses a head, it remains the same statue, albeit damaged. The registrar's mistake is treating the statue as identical to the lump of marble it comprises.

  This brings us to the matter itself. The original marble is now split: seventy per cent on the plinth, thirty per cent in the study room. Does tracking the stuff settle the dispute? If the statue were identical to the lump, then the statue would be scattered across two rooms, which is absurd for a single dancer. We must distinguish constitution from identity. The lump constitutes the statue, but is not identical to it. The lump is defined by its matter; the statue by its form and art-historical trajectory. When the accident occurred, the original lump was fractured. However, the statue persisted where the form was sustained. The conservator sustained the form on the plinth. The student in the study room assembled fragments, but without the majority of the body, the form is incomplete. The study-room object is a collection of fragments arranged to resemble the dancer, but it lacks the functional unity of the statue. It is a ruin, as the registrar says, but not the original statue. The original statue went where the restoration completed the form.

  Now, we must address the philosopher's arbitration. He claims there is no fact of the matter, that 'statue' is a vague label and we are arguing over a heap. This is the deflationary option. It is tempting, especially when faced with borderline cases. However, it conflates semantic vagueness with ontic indeterminacy. Identity itself is not vague. If 'the statue on the plinth' and 'the statue catalogued in 1963' are precise designators, they either refer to the same object or they do not. There is no middle ground in reality.

  The vagueness lies in our concept of 'statue', not in the world. But in a museum context, our conventions precisify the term. We have rules for accessioning, restoring, and deaccessioning. These conventions determine the truth conditions for identity claims. Once we accept the convention that restoration preserves identity provided the form is maintained and the change is documented, the indeterminacy vanishes. The philosopher is right that language is flexible, but wrong to suggest this flexibility prevents a decision. We can stipulate a precision. Given the museum's practice of conservation, the convention favours continuity. To say there is 'no fact of the matter' is to abdicate the responsibility of fixing the reference of our terms. In this context, there is a fact of the matter, determined by the constitutive rules of the institution and the metaphysical nature of artefacts.

  So, where does this leave us? The conservator is right that the statue survived. The registrar is right that something significant changed, but she misidentifies it as the destruction of the object rather than the degradation of its material authenticity. The philosopher is wrong to claim indeterminacy; there is a truth here, grounded in the convention that artefacts persist through material replacement if their form and history are continuous.

  The case is not exactly the Ship of Theseus problem in fancy dress, though it shares the DNA. The Ship of Theseus is often posed as a puzzle of gradual replacement versus reassembly of the old parts. Here, we have both: the plinth object (replacement) and the study object (reassembly of old parts). In the classic puzzle, this creates a contradiction: if the reassembled timbers make the ship, and the repaired vessel makes the ship, we have two ships. But in our case, the study-room object is not a viable competitor. It is a fragmentary reconstruction, held together with filler and armature. It does not function as the statue; it functions as a record of the damage. The plinth object carries the functional and formal continuity. There is no competition, therefore no contradiction.

  We must also be clear about the lump. The original lump of marble is indeed divided. If you were tracking the *marble*, the registrar would be right to say the original lump is destroyed as a unified whole. But you are tracking a *statue*. The statue is a modal entity; it can survive changes in matter that the lump cannot. The lump cannot survive being scattered; the statue can, provided it is reconstituted. Since the plinth object is the successful reconstitution, it inherits the identity.

  **Verdict and Practice**

  Here is the decision you must record. The object on the plinth is the statue accessioned in 1963. It retains the original accession number. The object in the study room is a new accession, catalogued as 'Fragments of [Statue Name], recovered 2011'. It is not the statue; it is the material residue of the accident.

  Regarding the label and valuation: honesty is required. The label on the plinth should read 'Roman Torso, restored 2012'. It is the same object, but the restoration must be declared to maintain historical integrity. The valuation should reflect the diminution in historical authenticity despite the preservation of identity. The object is metaphysically continuous but historically compromised. The conservator gets to keep her statue; the registrar gets her new accession number for the fragments; the philosopher must accept that while language is vague, museum records require precision. The dancer remains on the plinth, but she wears new marble like a graft on old skin. She is the same woman, but the scar tells a new story.
