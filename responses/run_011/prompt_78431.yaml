  You're going to have to play the role of a philosopher who's actually spent time in two places at once — the analytic literature on lying, truthfulness and misleading, and also the messier clinical/hospice ethics side — because the thing I want to ask about seems to fall between those two and I don't know who owns it. Please think it through carefully rather than reaching for a definition off the shelf. Start by brainstorming every candidate concept you can think of that might cover it, then knock them down one at a time, keeping whichever survive. The label at the end is not really the point for me. The point is the carving: what exactly this thing is, what it is not, and where the edges sit.

  Here's the pattern. My grandmother spent the last six weeks of her life in a hospice place near us, and the whole family knew the scan had been catastrophic — her doctor had told my mum in the corridor, my mum told all of us, nobody hid it from each other. But around my grandmother, and around my aunt who is a bit more fragile, the conversation went like this: my aunt would say something like "they're still working out what's next, aren't they," and my mum would say "yes, they're taking their time, he's holding steady." Both of them knew. Neither one was trying to plant anything in the other. There was no wink, no change of tone, no raised eyebrow — it was said warm and plain and serious, and if a stranger had walked into the room they would have taken it completely at face value, the falseness was only visible to people already inside it. And it wasn't a one-off. It was a whole standing arrangement, the kind where if my brother had walked in and said the flat true thing out loud, everyone would have felt he'd done something cruel — not that he'd been honest. That's the bit that got me. Breaking it feels worse than the false statement does.

  Smaller versions of the same shape are everywhere once you start looking. My mate's kid forgot every single line of her part in the school play and froze on stage, and afterwards both of us told him "she was really brave up there," and both of us knew exactly what that meant, and neither of us was fooling the other, and it wasn't a joke either — nobody was laughing, it was doing real work. Or at my job, my manager asks "how are you holding up with the restructure," and I say "getting there," and she knows I'm not, and I know she knows, and we both walk away feeling better and nobody has been deceived about anything. Afterwards, if you asked any of us "so did you lie?", we'd all say no and mean it. Which I'm not sure is right. The nearest things I can come up with myself all miss: it isn't a white lie, because a white lie needs somebody to actually be taken in; it isn't sarcasm or irony or a joke, because none of it is marked as not-for-real and an outsider would be fooled dead easy; it isn't quite an open secret either, because the secret isn't what's being talked around, the false sentence itself is the shared performance. I suspect people who write about dying and nursing have their own word for this and that the lying philosophers have a different one, and that neither of them covers the whole shape, but I've not read either.

  Where it gets weird is that I fell into some Augustine on lying a while back (found a chunk of it online and skimmed it, no idea which book, so correct me if I've mangled him). My takeaway was that for him what makes a lie is your mouth going against what's in your heart, and whether anyone actually ends up believing the false thing doesn't really matter, and the main person harmed is the liar himself. If that's roughly right, then the hospice conversation is a lie on his account — a mild one, but a lie — even though nobody in the room believed it, which cuts against my instinct and against what the family would have said. So: is there an established concept that names this exact configuration, a knowingly false statement that is cooperative and undetected by design and mutually understood as false, where the deception is what's absent and the joint performance is what's present? Walk me through the nearest neighbours and say precisely which feature of my cases each one fails on — including whether the lying/misleading distinction, euphemism, politeness norms and anything about pretense or shared fictions do the job. Tell me whether the mutuality is the crucial feature or whether something else is doing the real work, and tell me whether my half-remembered reading of Augustine is actually right and whether his test really does catch this. If nothing established fits, say so plainly and coin something, with a tight definition and a couple of boundary cases that are clearly in and clearly out, and say whether going along with it is a small moral failure or something else entirely. Put the single best name for the phenomenon — an established term if one genuinely fits, otherwise your own — as a short phrase inside \answer{...} on the very last line, with nothing else inside the braces.
