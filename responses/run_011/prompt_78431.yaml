answer: |-
  This is a profound observation that lands precisely in the gap between the analytic philosopher's obsession with truth-conditions and the clinician's obsession with care-outcomes. You have identified a communicative act that is propositionally false, mutually known to be false, unmarked as false to outsiders, and morally obligatory to sustain.

  Let's walk through the candidates, carve away what doesn't fit, and see what remains.

  ### 1. The Candidate Concepts (and why they fail)

  **Standard Analytic Lying**
  *   *Definition:* Asserting a proposition one believes to be false with the intent to deceive the listener into believing it is true.
  *   *The Miss:* The intent to deceive the *listener* is absent. In your hospice and workplace examples, the listener already knows the truth. You aren't trying to change their belief state; you are trying to maintain a shared emotional stance. Analytic philosophy (e.g., Carson, Mahon) generally requires the *intent to deceive* for a statement to count as a lie. Without that intent, it falls out of the category, even if the statement is false.

  **The White Lie**
  *   *Definition:* A harmless or trivial lie told to spare feelings.
  *   *The Miss:* A white lie requires the recipient to be successfully deceived (or at least intended to be). If your aunt knew the truth, she wasn't deceived. If the deception doesn't happen, it's not a white lie; it's something else. Furthermore, white lies are often seen as minor moral infractions justified by consequences. Your intuition is that *breaking* this pattern is the infraction.

  **Irony, Sarcasm, or Jesting**
  *   *Definition:* Saying something false with a marker (tone, context) that signals "do not take this literally."
  *   *The Miss:* These are *marked*. An ironic statement winks; a joke invites laughter. Your examples are "warm and plain and serious." An outsider *would* be deceived. The falseness is invisible to anyone not already inside the shared knowledge. This lack of marking is crucial—it means the performance must be sustained as if it were real.

  **Bullshit (Frankfurt)**
  *   *Definition:* Speech intended to persuade without regard for the truth.
  *   *The Miss:* Bullshitting involves indifference to the truth. In your cases, the truth matters immensely (death, failure, stress). You are not indifferent; you are actively *bracketing* the truth for a specific purpose. You care about the truth enough to know you aren't speaking it.

  **Politeness / Face-Work (Goffman, Brown & Levinson)**
  *   *Definition:* Strategies to preserve social "face" or harmony.
  *   *The Miss:* This explains the *function* (why you do it) but not the *structure* (what it is). "Politeness" covers everything from saying "please" to telling a lie. It's too broad. It doesn't capture the specific mechanism of jointly sustaining a known falsehood.

  **Collusion (Clinical Ethics)**
  *   *Definition:* An agreement between family and staff to withhold truth from a patient.
  *   *The Miss:* This is the closest established term in hospice literature. However, "collusion" typically refers to secrecy *from the patient* (Closed Awareness), often carrying a negative ethical connotation of preventing acceptance. Your case is secrecy *between the relatives* to protect the emotional atmosphere *around* the patient. Also, "collusion" sounds conspiratorial; your examples feel supportive.

  **Phatic Communication (Malinowski)**
  *   *Definition:* Speech used to establish social connection rather than convey information (e.g., "How are you?" "Fine").
  *   *The Miss:* Phatic expressions are usually ritualized formulas with low stakes. "She was brave" or "Holding steady" carries high emotional weight and specific propositional content. It's doing more work than a handshake greeting.

  ### 2. The Augustine Correction

  You recalled Augustine (*De Mendacio*, *Contra Mendacium*) as saying a lie is "mouth against heart" regardless of belief. This is half-right but crucially incomplete.

  Augustine defines a lie as *falsa significatio cum voluntate fallendi*—a false signification **with the will to deceive**.
  *   **Mouth against heart:** Yes, Augustine cares about the speaker's internal state. Speaking against your own mind is an injury to the soul.
  *   **Intent to deceive:** This is the dealbreaker. For Augustine, if you speak falsely but *do not intend* the listener to believe you (because you know they know the truth, or because it's a jest), it lacks the *voluntas fallendi*.

  Therefore, under a strict Augustinian framework, your hospice conversations are **not lies**. They are false statements, yes, but without the intent to lead the interlocutor astray, they lack the sinful core of lying. Augustine might worry about the habit of falsehood, but he would distinguish this from the moral crime of lying. Your instinct that "nobody has been deceived" aligns with Augustine's requirement for intent.

  ### 3. Carving the Phenomenon

  So what is left? We need a label for:
  1.  **Propositional Falsity:** The statement is factually incorrect.
  2.  **Mutual Knowledge:** Both speaker and listener know it is incorrect.
  3.  **Unmarked Performance:** It is spoken seriously, without irony markers, such that outsiders would be deceived.
  4.  **Protective Function:** The goal is to maintain a shared emotional reality or protect a third party (or the relationship itself).
  5.  **Normative Obligation:** Participating is morally required (solidarity); breaking it is a violation (cruelty).

  The crucial feature is the **mutuality**. It transforms the act from deception (one-sided) to performance (two-sided). It is not about hiding the truth from each other; it is about hiding the *acknowledgment* of the truth from the situation.

  Existing terms like "Collusive Pretense" exist in sociology but carry negative baggage. "Non-deceptive Falsehood" is accurate but sterile. We need a term that captures the moral glue holding it together.

  I propose we coin **"Solidarity Pretense"**.

  ### 4. Definition and Boundaries

  **Solidarity Pretense**
  *Definition:* A communicative act in which two or more parties jointly assert a proposition they mutually know to be false, without marking it as false, for the purpose of maintaining a shared protective frame or expressing relational solidarity, where violating the frame is perceived as a moral failure.

  **Boundary Cases (In):**
  *   **In:** Telling a grieving parent "He's in a better place" when both of you are atheists, solely to comfort them in the moment.
  *   **In:** A surgeon saying to a nurse during a crisis, "We've got this," when both know the patient is likely dying, to maintain team focus.

  **Boundary Cases (Out):**
  *   **Out:** **Irony.** ("Yeah, because dying is so much fun.") -> *Marked as false.*
  *   **Out：** **Deceptive Lying.** (Telling the patient "You're getting better" when they ask directly.) -> *Intent to deceive the listener.*
  *   **Out：** **Delusion.** (Actually believing the false statement.) -> *Lacks mutual knowledge of falsity.*

  ### 5. Moral Evaluation

  Is this a moral failure? No. In analytic ethics, truth-telling is often a prima facie duty, but it is not absolute. In care ethics, maintaining the relational bond is often the higher duty.
  *   **The Failure:** The moral failure lies in *breaking* the pretense (the brother who speaks the blunt truth). Why? Because he prioritizes abstract factual accuracy over concrete relational care. He treats the conversation as an information exchange rather than a support mechanism.
  *   **The Virtue:** Participating in Solidarity Pretense is an act of **empathic cooperation**. It signals: "I know this is hard, I know you know it's hard, and I am willing to stand in this difficult space with you without forcing us to stare directly at the sun."

  ### 6. Conclusion

  The phenomenon sits between the analytic definition of lying (which fails on intent) and the clinical definition of collusion (which fails on tone). It is a specific type of joint performance where the falsity is the price of admission for solidarity.

  \answer{Solidarity Pretense}
