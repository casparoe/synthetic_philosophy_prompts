  ### Unoccupied Combinations and Blind Spots

  **Unoccupied Combinations**
  1.  **The Incoherent Universalist:** Respondents who select **Code R** on Node 5 (Head Office rules apply) but **Code C** on Node 12 (London team does not understand). This combination is **incoherent**; one cannot claim the centre's rules are binding while simultaneously claiming the centre lacks the competence to judge.
  2.  **The Secretive Egalitarian:** Respondents who select **Code E** on Node 6 (All constituencies equal) but **Option A** on Node 8 (Private dinner acceptable). This combination is **unattractive**; it demands public equality while permitting private favouritism that undermines it.
  3.  **The Pure Structuralist:** Respondents who focus entirely on **Code S** (Exchange structure) while ignoring **Code O** (Consequences). This combination is **unexplored**; few defend a view where the timing of a payment matters more than whether a clinic opens.

  **Indistinguishable Leaves**
  *   **Leaf 1 (Legalistic Universalism) and Leaf 2 (Strict Egalitarian):** The tree cannot genuinely separate these where Head Office rules mandate equal treatment. In practice, these respondents will vote identically on almost all nodes. They differ only in their *reasoning* (authority vs. principle), which this instrument captures imperfectly.

  **Residual Branch**
  *   **The Confused:** Respondents who select contradictory options within the same Code (e.g., Code R on Node 1 but Code C on Node 5) without a discernible pattern. These respondents likely do not understand the questions or hold no stable view.

  **Systematic Blind Spot**
  *   This tree assumes the respondent has the *power* to choose. It does not account for coercion, where a staff member accepts an offering because refusing would threaten their physical safety or employment. It diagnoses moral reasoning, not duress.

