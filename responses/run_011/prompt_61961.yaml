  ### Analysis of Your Candidate Criterion

  **Your Criterion:** *An act is corrupt when the office-holder could not publicly avow the reason for which she acted without thereby undermining the office.*

  **Classification:**
  This is best understood as a **redescription of Leaf 6 (Degradation of the Good)**, with a strong procedural mechanism borrowed from **Leaf 2 (Impartialism)**.
  It attaches most closely to **Node 8 (The Supplier Dinner)**. Your criterion turns on *publicity*. If the reason for the dinner cannot be stated publicly, it fails. This aligns with the Teleological view (Leaf 6) because "undermining the office" implies the office has a specific nature or purpose that publicity protects. However, it functions as a **rival** to **Leaf 5 (Consent-and-Contract)**. The Contractualist argues that private consent is sufficient; your criterion argues that private consent is irrelevant if public avowal fails.

  **Strongest Objection (from Leaf 3: Social-Norms/Contextualist):**
  The holder of the Contextualist view would argue that **public avowal destroys necessary social fictions**. In many societies, relationships function precisely because the exchange of favours is *not* spoken aloud. To demand public avowal is to impose a specific, Western style of transparency that renders local political exchange impossible. They would claim your criterion does not identify wrongdoing, but rather identifies *cultural incompatibility*. By forcing the reason into the open, you do not cleanse the office; you break the social glue that allows the office to function in that specific setting.
