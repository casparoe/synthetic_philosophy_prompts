answer: |-
  # Diagnostic Tree of Exchange and Office

  **Instructions:** Present the twelve dilemmas below to the respondent. Record their selected option (A, B, or C) for each. Do not offer commentary while they choose. Once all twelve are answered, apply the Scoring Key to locate their position.

  ### The Dilemmas

  **Node 1: The Woven Mat**
  A village council presents a woven mat to a staff member after approving a water scheme.
  *   **A:** Return it. The office rules say staff take nothing from those they serve.
  *   **B:** Keep it. Refusing would insult the council and damage the relationship.
  *   **C:** Keep it only if every village council receives a similar acknowledgement.

  **Node 2: The Conference Trip**
  A firm bidding for a contract offers to fund staff travel to a sector conference.
  *   **A:** Decline. The timing creates an expectation of favour, regardless of the amount.
  *   **B:** Accept. The knowledge gained helps the office do its job better.
  *   **C:** Accept only if the firm is removed from the bidding list.

  **Node 3: The Donor's Nephew**
  A manager hires the nephew of a long-time donor over a candidate with higher test scores.
  *   **A:** Reverse the hiring. The best candidate must get the post.
  *   **B:** Uphold the hiring. Honouring long-standing relationships is part of the work.
  *   **C:** Uphold the hiring only if the nephew meets the minimum technical requirements.

  **Node 4: The Late Watch**
  Six months after a contract ends, the contractor sends a high-end watch to the project lead.
  *   **A:** Return it. The link to the past decision remains active.
  *   **B:** Keep it. The work is finished; there is nothing left to influence.
  *   **C:** Declare it. Let the office decide if it stays.

  **Node 5: The Facilitation Payment**
  A small payment to speed up a permit is legal locally but illegal under Head Office rules.
  *   **A:** Do not pay. Head Office rules apply everywhere we work.
  *   **B:** Pay. Local law determines what is acceptable here.
  *   **C:** Pay only if the delay would harm the poorest beneficiaries.

  **Node 6: The Road Project**
  An elected official steers a road project to her home constituency rather than a poorer one.
  *   **A:** Block it. All constituencies are equal before the budget.
  *   **B:** Allow it. She was elected to bring resources to her people.
  *   **C:** Allow it only if her constituency lacks basic access entirely.

  **Node 7: The Taxi Ride**
  One staff member takes a taxi paid for by a partner; later, the whole team does it.
  *   **A:** Judge the first ride. That is where the line was crossed.
  *   **B:** Judge the team habit. One ride is a mistake; a pattern is a practice.
  *   **C:** Judge the office pay. If salaries were higher, staff would not need rides.

  **Node 8: The Supplier Dinner**
  A supplier pays for a dinner with a staff member.
  *   **A:** Acceptable if kept private between the two.
  *   **B:** Acceptable only if published in the monthly newsletter.
  *   **C:** Unacceptable regardless of publicity.

  **Node 9: The Clinic Shortcut**
  A decision bends a procedure to open a clinic two months sooner.
  *   **A:** Praise it. The health benefit outweighs the procedural breach.
  *   **B:** Sanction it. The procedure exists to ensure fairness, not just speed.
  *   **C:** Investigate it. Who was bypassed to make this happen?

  **Node 10: The Flood Vehicle**
  Staff use agency vehicles to evacuate their own families during a flood.
  *   **A:** Sanction it. Vehicles are assets owned by the agency, not the staff.
  *   **B:** Praise it. The agency exists to save lives, including staff lives.
  *   **C:** Sanction it. It creates a precedent that weakens command.

  **Node 11: The Shift Swap**
  Two staff members swap shifts for cash; both agree, and work is covered.
  *   **A:** Their business. Two willing parties and no harmed third party.
  *   **B:** Wrong. The agency pays the wages and owns the time.
  *   **C:** Fine if the manager knows and agrees.

  **Node 12: The Audit Team**
  Head Office sends a new anti-fraud team from London to investigate local practices.
  *   **A:** Cooperate fully. They hold the ultimate standard.
  *   **B:** Resist. They do not understand how life is lived here.
  *   **C:** Cooperate only if they train local staff to take over.

  ***

  ### Scoring Key

  Tally the responses into the following five Codes. Assign the respondent to the Leaf that matches their dominant Code pattern.

  *   **Code R (Rules):** Predominantly A answers on Nodes 1, 2, 4, 5, 8.
  *   **Code E (Equality):** Predominantly A or C answers on Nodes 1, 3, 6, 7.
  *   **Code C (Context):** Predominantly B answers on Nodes 1, 3, 5, 12.
  *   **Code O (Outcome):** Predominantly A or C answers on Nodes 5, 6, 9, 10.
  *   **Code S (Structure):** Predominantly B or C answers on Nodes 2, 4, 11.

  **Leaf 1: Legalistic Office-Based Universalism**
  *   **Pattern:** High Code R, moderate Code E. Low Code C.
  *   **Label:** The Compliance Officer.
  *   **Hardest Commitment:** Defending why a rule written in London must bind a village council in a different legal system.

  **Leaf 2: Impartialism Condemning Local Practices**
  *   **Pattern:** High Code E, High Code R. Very Low Code C.
  *   **Label:** The Strict Egalitarian unnamed.
  *   **Hardest Commitment:** Explaining why treating a friend differently from a stranger is always wrong, even when friendship is a social duty.

  **Leaf 3: Social-Norms or Contextualist View**
  *   **Pattern:** High Code C. Low Code R.
  *   **Label:** The Localist unnamed.
  *   **Hardest Commitment:** Defending a practice that harms a minority when the local majority accepts it.

  **Leaf 4: Grease-the-Wheels Consequentialism**
  *   **Pattern:** High Code O. Moderate Code S.
  *   **Label:** The Pragmatist unnamed.
  *   **Hardest Commitment:** Admitting that breaking the rule today makes it harder to enforce the rule tomorrow.

  **Leaf 5: Consent-and-Contract View**
  *   **Pattern:** High Code S on Node 11. Low Code R on Node 8.
  *   **Label:** The Libertarian Contractualist unnamed.
  *   **Hardest Commitment:** Explaining why private agreements between staff are the agency's business at all.

  **Leaf 6: Degradation of the Good**
  *   **Pattern:** High Code E on Node 10. High Code S on Node 2.
  *   **Label:** The Teleologist unnamed.
