answer: |-
  First, let's clear the deck on competing explanations, because *asabiyya* doesn't operate in a vacuum. If you're building a dataset, you're fighting against fiscal collapse models, which argue states die when extraction costs exceed revenue and tax farming cannibalizes the base. You have land-tenure systems like the *iqta*, where revenue rights decentralized to elites inevitably weaken the center regardless of morale. You have Malthusian demographic pressure, where population growth outstrips agrarian yield, triggering famine and revolt. You have exogenous ecological shocks, specifically the plague, which reshaped labor markets and tax bases unpredictably. You have elite overproduction, where too many claimants for state positions destabilize the regime. And you have the frontier hypothesis, which is essentially Khaldunianism stripped of the moral psychology—peripheral pressure matters, but maybe because of military tech or climate shifts rather than group solidarity. Each of these has material proxies; *asabiyya* does not.

  Here is my credence number: **0.4**.

  Now, the decomposition. I'm treating this not as a strict probability chain but as a base prior dragged down by empirical hurdles.

  1.  **Unit Comparability (0.5):** "Dynasty" conflates familial regimes in Europe with bureaucratic continuities in China, making cross-cultural duration comparisons noisy.
  2.  **Operationalization (0.3):** Solidarity is almost always inferred from military success or stability, creating a tautology rather than an independent predictor.
  3.  **Timing Mechanism (0.4):** The three-generation rule fits the Maghreb well but breaks down against the variable lifespans of Chinese or Egyptian regimes.
  4.  **Exception Absorption (0.5):** Explaining the Ottomans requires "renewal" clauses that render the theory flexible enough to be unfalsifiable.
  5.  **Causal Distinctness (0.6):** It is difficult to separate social bond decay from the moral degeneration of officeholders described by Polybius.
  6.  **Base Prior (0.9):** There is a strong independent theoretical reason to believe group cooperation decays as the cost of defection drops with success.

  **Combination Method:**
  I do not multiply these, because failure on one term (like Timing) doesn't strictly falsify the core mechanism. Instead, I treat the **Base Prior (0.9)** as the theoretical ceiling and apply the average of the five empirical constraints (0.46) as a drag coefficient. $0.9 \times 0.46 \approx 0.41$, rounded to 0.4. This reflects that the theory is plausible sociologically but fragile empirically.

  **Sensitivity:**
  The final number is most sensitive to **Operationalization**. If you cannot measure solidarity *before* the collapse (ex-ante), you cannot claim it predicts better than fiscal variables, which often leave paper trails. If operationalization confidence moves from 0.3 to 0.6, my credence jumps to 0.65.

  **The Disagreement:**
  The gap between your historian (0.25) and your modeler (0.7) is almost entirely located in **Operationalization** and **Unit Comparability**. The historian knows the sources are too patchy to measure solidarity independently of the outcome, driving their score down toward the operationalization term. The modeler assumes solidarity can be proxied by variables like inequality or frontier distance, effectively bypassing the measurement problem and resting heavily on the Base Prior. They are arguing past each other: the historian is judging the data quality, while the modeler is judging the structural logic.

  **Uncertainty Flag:**
  I am least sure I'm not storytelling on **Causal Distinctness**. It is very possible that "solidarity" is just a premodern label for what we now call low transaction costs or high social capital, and I may be granting it too much autonomy from the material conditions that generate it.
