prompt: |-
  I cover science and ideas for a magazine, mostly the soft sciences, which means I spend a lot of my time asking whether fashionable frameworks have any predictive guts or are just good storytelling. Right now I'm working on a piece about the cyclical-vs-linear argument in history writing, and my anchor is Ibn Khaldun's asabiyya model from the Muqaddimah, roughly as I understand it: royal authority requires group solidarity, solidarity gets produced by hardship and shared danger out on the periphery of an existing order, and once the group takes the center and settles into cities, tax revenue and luxury, that solidarity bleeds away across three generations of about forty years each — so a dynasty has a natural lifespan of roughly 120 years, like a person does — until some fresh peripheral group with high asabiyyah rolls in and replaces it. He treats this as close to a law, though he does allow that a dynasty can be renewed by an influx of a new group, which feels like a bit of a get-out clause imo.

  Here's what I want from you. Adopt the role of a historical sociologist who's spent a decade on premodern state formation and has strong opinions about both the fourteenth-century Maghreb and about cliodynamics, and think carefully before you commit to anything: start by brainstorming out loud the candidate competing explanations for the same pattern — fiscal collapse and tax farming, land-tenure systems like iqta, Malthusian demographic pressure, plague, elite overproduction, and the frontier hypothesis Turchin builds out of asabiyya itself — and only then give me a number. The proposition I want a credence on is this: the generational decay of group solidarity is a real causal mechanism rather than a narrative template, in the specific sense that if someone assembled a careful cross-cultural dataset of premodern dynastic states, the solidarity-generating conditions at a dynasty's founding would predict its duration and its mode of collapse better than purely fiscal, demographic or ecological variables would on their own. Give me one number between 0 and 1, then decompose it into the sub-questions it actually rests on — at minimum: whether "dynasty" even picks out a comparable unit across regions and centuries; whether solidarity is something you could measure independently or just a label we apply after the collapse; whether the three-generation timing reflects a mechanism or an artifact of the unusually short-lived North African and Iberian regimes he happened to be watching; whether the apparent exceptions (six centuries of Ottomans, for one) are absorbable within the theory or fatal to it; whether this is even the same kind of claim as Polybius's cycle of constitutions, where the engine is the moral degeneration of officeholders rather than the exhaustion of a group bond; and how much of your number is really just a prior that group cooperation decays with success, which I suspect is high independent of Ibn Khaldun. One line of justification per term, then show me how you combine them — do you multiply, or is it fuzzier than that — and tell me which single term the final number is most sensitive to.

  Two more things. First, I've got a historian of the medieval Maghreb who put this at about 0.25 and a quantitative modeler who put it at about 0.7, and my editor wants the piece to say where they actually disagree rather than just quote them at each other, so tell me which term in your decomposition accounts for most of that gap. Second, no bibliography, no reading list, no citations please — I can't chase sources on a Thursday deadline and I don't want invented ones. Just the reasoning, the numbers, and an honest flag on the places where you're least sure you're not simply telling me a good story.
