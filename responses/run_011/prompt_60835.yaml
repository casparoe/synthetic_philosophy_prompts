  # JOINT STATEMENT ON THE ONTOLOGY OF POST-MORTEM CONTINUITY
  **Regarding the Case of Ines Marchetti and General Principles of Personhood**

  **Signatories:**
  *The Patternist Position (PP)*
  *The Subject-Cessation Position (SCP)*

  ## I. Joint Claims

  1.  **Ontology of Persons:** We agree that a person is not a simple, indivisible substance. A person is constituted by a complex, self-referential organization of information, cognitive habits, and behavioral dispositions (a "pattern").
  2.  **Multiple Realizability:** We agree that this pattern is substrate-independent in principle. The same cognitive pattern could, logically and physically, be instantiated in different biological organisms or non-biological media without losing its structural identity.
  3.  **Descriptive Facts of the Central Case:** We agree on the empirical facts regarding Ines Marchetti and V.: V. genuinely exhibits Marchetti's distinctive mathematical heuristics, notation, and framing. The observation by colleagues that "working with V. is like working with her" is a veridical report of phenomenological similarity, not merely a polite metaphor.
  4.  **Cessation of the Original Locus:** We agree that the specific biological organism that was Ines Marchetti ceased to function at her death. There is no ongoing stream of consciousness numerically identical to Marchetti's pre-mortem stream located in her original body.
  5.  **The Reality of Dispersal:** We agree that Marchetti's pattern is not wholly annihilated. Elements of it persist in V., in the notebooks, in the colleagues' memories, and in the students of V. The disagreement concerns the metaphysical weight of this persistence, not its existence.
  6.  **Exclusion of Supernaturalism:** We agree that no appeal to souls, spirits, or non-physical substances is relevant to this dispute. The dispute is entirely within the bounds of naturalistic metaphysics.

  ## II. Disagreements Table

  | Disagreement (PP Formulation) | Disagreement (SCP Formulation) | What Could Bear on It | PP Prediction | SCP Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Status of V.'s Activity**<br>V. is *running* Marchetti's cognitive software; the process is active, not static. | **1. The Status of V.'s Activity**<br>V. is *simulating* Marchetti's output; the process is representative, like an actor playing a role. | **Variant 2 (AI System):** If a system trained on Marchetti's data develops a self-model and claims to be Marchetti, does it have a claim to welfare? | If the AI reports suffering, it is Marchetti suffering. The pattern generates the subject. | If the AI reports suffering, it is a new subject suffering *about* Marchetti. The pattern generates a representation, not the original subject. |
  | **2. The Locus of Welfare**<br>Things can go well or badly for Marchetti *via* V. (e.g., if V. is humiliated, Marchetti is humiliated). | **2. The Locus of Welfare**<br>Things can go well or badly for V., and V. may care about Marchetti, but Marchetti herself has no welfare status to be affected. | **Variant 3 (Divergence):** V. and W. develop incompatible habits. Can Marchetti be humiliated by V. and honored by W. simultaneously? | Yes. Survival admits of contradiction because identity is distributed. Marchetti is fragmented. | No. This proves Marchetti is not the subject of these events. Only V. and W. are subjects. |
  | **3. Coherence Requirements**<br>Survival is a matter of degree. Even fragmented retention (Variant 4) counts as partial survival. | **3. Coherence Requirements**<br>Survival requires a unified subject. Fragmented retention (Variant 4) is just data loss, not partial life. | **Variant 4 (Fragmentation):** 100 people hold one habit each. No one has a coherent view. | This is low-fidelity survival. Marchetti is present to the degree her pattern is instantiated. | This is zero survival. Without a unified point of view, there is no "one" to survive. |
  | **4. The Notebook Distinction**<br>A notebook is a static snapshot; V. is a dynamic processor. V. counts; the notebook does not. | **4. The Notebook Distinction**<br>Neither counts as survival. Both are external representations. V. is just a more complex notebook. | **Variant 1 (Stranger/Notebooks):** A stranger replicates the math perfectly from notes without knowing Marchetti. | The stranger instantiates the pattern but lacks the causal history to count as Marchetti's continuation. | The stranger proves the pattern is detachable from the person. It confirms the person is gone, leaving only tools behind. |

  ## III. Cruxes

  **Crux 1: Running vs. Representing (The Dynamic Test)**
  *   **Sub-question:** Is the distinction between *being* a pattern and *representing* a pattern observable, or is it a brute metaphysical assertion?
  *   **Discriminating Test:** **Variant 2 (The AI System).** We observe a system trained on Marchetti's corpus that generates *novel* theorems Marchetti never wrote, using her methods, and which possesses a self-model that integrates Marchetti's memories as its own.
  *   **PP Prediction:** If the system successfully navigates novel mathematical terrain using Marchetti's heuristics without external prompting, it is *running* the pattern. The generation of novel work in the specific style constitutes evidence of the pattern's active agency, akin to a transplant growing new tissue.
  *   **SCP Prediction:** Even if the system generates novel work, it is merely a sophisticated biographer. A skilled biographer can write a new chapter in a dead author's style; this does not mean the author wrote it. The test proves the pattern is robust, not that the subject persists.

  **Crux 2: Identity vs. What Matters (The Degree Test)**
  *   **Sub-question:** Is "survival" an all-or-nothing identity relation, or a graded relation of psychological connectedness?
  *   **Discriminating Test:** **Variant 4 (Fragmentation).** We compare the intuition regarding the 100 people holding one habit each versus V. holding the whole set.
  *   **PP Prediction:** Intuition should track fidelity. V. represents high-fidelity survival; the 100 people represent low-fidelity survival. If we feel the 100 people case is "less" survival rather than "no" survival, then identity is not what matters; pattern preservation is.
  *   **SCP Prediction:** Intuition should show a cliff-edge. V. is a distinct person who resembles Marchetti. The 100 people are distinct people who resemble fragments. In neither case is there a subject who is Marchetti. If there is no subject, there is no survival to be graded.

  **Crux 3: The Subject of Welfare (The Ethical Test)**
  *   **Sub-question:** Can a pattern have interests independent of the substrate currently instantiating it?
  *   **Discriminating Test:** **Variant 3 (Divergence).** V. and W. claim to continue Marchetti's line but adopt incompatible ethical stances derived from her work.
  *   **PP Prediction:** It makes sense to ask, "Who is betraying Marchetti?" This implies Marchetti has a stake in the outcome distinct from V.'s or W.'s stake.
  *   **SCP Prediction:** The question is malformed. The only meaningful question is, "Who is betraying their own understanding of Marchetti?" The welfare at stake belongs entirely to V. and W.

  ## IV. What Is Merely Verbal

  A significant portion of our year-long argument dissolved when we distinguished between **Pattern-Continuance** and **Subject-Persistence**.

  *   **Pattern-Continuance (Neutral Term):** The causal propagation of cognitive structures, habits, and dispositions from one locus to another (e.g., from Marchetti to V., or Marchetti to the Notebooks). Both parties agree this occurs.
  *   **Subject-Persistence (SCP Term):** The continued existence of a specific locus of consciousness for whom things can go well or badly. SCP reserves "Survival" for this.
  *   **Instantiation (PP Term):** The active realization of a self-referential pattern in a substrate. PP reserves "Survival" for this.

  **Stipulative Vocabulary Agreement:**
  1.  **"Lives On":** PP is entitled to use this when referring to **Pattern-Continuance** (e.g., "Marchetti lives on in V."). SCP agrees not to contest this usage provided it is understood metaphorically regarding the *subject*.
  2.  **"Is Gone":** SCP is entitled to use this when referring to **Subject-Persistence** (e.g., "Marchetti is gone; only her work remains."). PP agrees not to contest this usage provided it is understood as referring to the *original biological locus*.
  3.  **"Survival":** We agree to suspend this term in technical contexts. In public discourse, PP will use "Survival" to mean *high-fidelity Instantiation*, and SCP will use "Survival" to mean *Subject-Persistence*. We acknowledge that when PP says "She survives" and SCP says "She does not survive," they are often asserting compatible facts under different definitions of the verb.

  **Substantive Remainder:** Even after these verbal stipulations, a disagreement remains: PP believes **Pattern-Continuance** (at high fidelity) is sufficient to ground ethical claims and identity judgments that SCP believes require **Subject-Persistence**. This is not verbal; it is a disagreement about what grounds moral status.

  ## V. Stakes

  **Patternist Position:**
  "To be wrong, I must concede that the specific arrangement of information that constitutes a 'self' is metaphysically inert once detached from its original biological hardware, and that the intuitive weight we place on psychological continuity is a systematic error rather than a perception of reality."

  **Subject-Cessation Position:**
  "To be wrong, I must concede that a subject of experience can exist without a unique, bounded locus of welfare, and that the distinction between a person acting and a person being acted upon dissolves when the pattern of their behavior is replicated elsewhere."
