  2.  **Deconstruct the Proposed Principle:**
      *   *Principle:* Counterfactual Impact = $V(\text{Me}) - V(\text{Counterfactual})$.
      *   *Relation to EA Theory:* This is the core definition of "marginal impact" in Effective Altruism. ITN is a heuristic *for* estimating this, but the user has correctly identified that ITN can sometimes conflict with the underlying math of counterfactuals.
      *   *Is it a restatement?* It's not just a restatement of ITN; it's the *foundation* that ITN attempts to approximate. ITN = $I \times T \times N$. Counterfactual Impact is the actual goal. The user is moving from the heuristic to the ground truth.

