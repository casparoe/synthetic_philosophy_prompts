      *   **Proposed Solution:** Score causes by (World Value if I work on it) - (World Value if I do next-best thing). Essentially, *counterfactual impact*.
      *   **Questions:**
          1.  Is this an actual principle or just a restatement?
          2.  Does it swallow all three factors (ITN)?
