          *   Scenario A (Someone else does identical work): $V(\text{Me}) \approx V(\text{Counterfactual}) \rightarrow$ Impact $\approx 0$.
          *   Scenario B (Project doesn't happen): $V(\text{Counterfactual}) = 0 \rightarrow$ Impact $= V(\text{Me})$.
