      *   *Case 2 (Rare Disease):* Moderate $V(\text{Me})$ (small pop), but very low $V(\text{Counterfactual})$ (nobody else cares). **Verdict:** Still good. Explains why the gut feels better than the ITN math (ITN penalizes small 'I', but Counterfactual highlights high 'N').
      *   *Case 3 (Climate Modelling):* High $V(\text{Me})$ potentially, but High $V(\text{Counterfactual})$ (crowded). $V(\text{Me}) - V(\text{Counterfactual}) \approx 0$. **Verdict:** Confirms the "bad" intuition. Resolves the tension: Tractability comes from others, but impact comes from *you* specifically.
