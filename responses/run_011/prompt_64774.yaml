          *   **Tractability:** Affects the probability that work leads to $V$.
          *   **Neglectedness:** Is a proxy for the gap between $V(\text{Me})$ and $V(\text{Counterfactual})$. If a field is crowded, $V(\text{Counterfactual})$ is high (someone else does it), lowering the difference.
