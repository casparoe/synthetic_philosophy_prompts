  The airport bar was nearly empty, the staff wiping glasses with a rhythmic indifference that matched the rain streaking the terminal windows. Their flight had been cancelled an hour ago, following a workshop where the air had been thick enough to choke on. Elias, the tenacity debunker, swirled the ice in his whiskey. Mara, the revocability realist, stared into her gin.

  "You won't let it go," Elias said. "The workshop is over."

  "You claimed my moral confidence is just a biological lock-in mechanism," Mara replied. "You said the reason I feel I *must* act is because ancestors who felt that way survived. You didn't say I was wrong; you said my certainty is evidence against me."

  "Because certainty is the adaptation," Elias said. "Not truth. Selection favours beliefs that resist revision. If you can talk yourself out of a moral duty, you're a defection risk. If you can't, you're a reliable co-operator. The stickiness is the fitness trait."

  "Let's test that," Mara said, leaning forward. "Consider the woman from the herding community. We discussed her briefly before the panel shut us down. She moves to the city at thirty-two. She drops the winter feast obligation. She drops the blood-price. She drops the sharp in-group loyalty. She revises almost everything. But one thing holds: she believes a promise extracted under duress still binds her, even if breaking it benefits everyone, including the promisee."

  Elias nodded slowly. "The survivor belief."

  "Exactly. She audited her life. She discarded the costly signaling of the feast. She discarded the vengeance norms. But the duress promise remained. Doesn't the fact that she could discard the others prove the mechanism isn't sealed? If evolution merely calibrated tenacity, why did the feast norm loose its grip while the promise norm held?"

  "Because the feast norm was contingent on a specific ecological niche," Elias said. "Urban life makes public feasting less critical for survival than basic contract stability. The tenacity calibration isn't uniform; it's hierarchical. The promise belief is deeper in the stack. The fact that she revised the surface norms doesn't mean the audit was truth-tracking. It means the audit was allowed to clear out the dead wood so the core structure could hold firm."

  "But she sacrificed status to drop the feast norms," Mara insisted. "Her community ostracized her. She paid a fitness cost to revise those beliefs. If the system is tuned for fitness, why would it allow her to incur such a cost unless she was tracking something real? The capacity for apostasy suggests the mind isn't just a fitness maximizer. It's a truth-seeker that sometimes overrides fitness."

  Elias took a sip. "You're arguing that the cost of revision proves the revision is rational. But that's exactly what the tenacity view predicts. We need some people to be flexible adapters when environments change, provided the core cooperative constraints remain. Her flexibility on the feast was permitted because it didn't threaten the group's fundamental trust mechanisms. The promise belief remained because that is the bedrock of cooperation, true or not."

  "So you deny that her ability to change proves anything?"

  "I deny that it proves truth-tracking," Elias said. "It proves adaptive flexibility. The audit inherits the bias of the auditor. Her sense of what counts as a 'good reason' to drop the feast norm was itself shaped by forces that care nothing for truth. She feels the promise belief is obvious? That feeling is the lock, not the key."

  Mara paused, tracing the rim of her glass. "Let me make sure I have your position right, because I want to concede something. You are saying that even the process she used to evaluate her norms—the reflection, the weighing of costs—was itself calibrated for fitness, not truth. So the fact that the promise belief survived the scrutiny doesn't mean it passed a test; it means the test was designed to let it pass."

  "Yes," Elias said. "That is accurate. The scrutiny is part of the immune system."

  "Then here is my concession," Mara said. "I admit that the *feeling* of authority, the motivational weight she feels regarding the promise, is likely evolutionarily shaped. I cannot claim her intuition is a pure conduit to moral facts. The grip itself is suspect."

  Elias raised an eyebrow. "That's a significant concession. If the grip is suspect, what grounds do you have?"

  "The grounds are in the revocability," Mara said. "You concede the audit is biased. But you cannot explain why the audit ever succeeds in dislodging *anything* if the sole function is retention. If the mind is tuned to hold beliefs sticky for cooperation, why does it ever let go? The woman dropped the blood-price. That was a core cooperation norm. Why did that loosen? Because she encountered a mismatch between the norm and the reality of city life. She saw it was wrong. The fact that she *could* see it was wrong suggests the mechanism isn't wholly closed. If it were purely fitness-driven, she would have rationalized the blood-price forever."

  "Perhaps the blood-price was too costly in the city," Elias countered. "Fitness isn't just about group cohesion; it's about individual survival. She dropped it because it was dangerous, not because it was false."

  "But she kept the promise norm even when it was dangerous," Mara said. "She kept it when breaking it would benefit everyone. That is the definition of a moral truth-tracker: acting against interest because the norm demands it. If fitness were the only master, she would have dropped the promise norm too. The fact that she didn't suggests the promise norm is responding to something outside the fitness calculus."

  Elias leaned back, looking at the departure board. "You're claiming that acting against interest proves truth-tracking. But acting against immediate interest can secure long-term reputation. It's still fitness."

  "Is it?" Mara asked. "What if no one knows? In her case, no one knew she made the promise. She kept it in secret. There was no reputational gain. There was only cost. Why would evolution favour a sticky belief that demands secret sacrifice with no return?"

  Elias was silent for a moment. "Because a mind that knows it might defect under secrecy needs a stronger lock. The belief must be sticky enough to survive the absence of witnesses. That doesn't make the belief true. It makes the lock stronger."

  "Then we are at an impasse regarding the source of the lock," Mara said. "But I have one more challenge. Your own argument. You believe your debunking theory is true. You feel the grip of its logic. It is sticky for you. By your own standards, should you not suspect that your belief in debunking is merely a fitness-calibrated tenacity? Why is your audit clean while hers is contaminated?"

  Elias sighed. "Because I am arguing for a reduction of confidence, not an increase. My theory tells me to distrust my grip. Yours tells you to trust hers."

  "But you trust your theory," Mara pressed. "You feel the authority of your logic. Is that feeling not also a biological artifact?"

  "It is," Elias said. "But I account for it. You do not."

  "Let me restate your position to ensure I haven't built a strawman," Mara said. "You claim that the evolutionary history of our moral faculties undermines the evidential value of their tenacity. The fact that a belief feels unshakeable is evidence of its utility, not its truth. Therefore, the woman's inability to drop the promise norm is evidence of its deep utility, not its validity."

  "That is accurate," Elias said.

  "And you claim that my reliance on her capacity to revise other norms fails because that capacity is also fitness-serving," Mara continued. "You say the flexibility is just another layer of adaptation."

  "Yes."

  "Then here is my second concession," Mara said. "I concede that we cannot prove, from the inside, that any specific moral intuition is free from evolutionary distortion. I cannot guarantee that her promise belief is true. I can only argue that the capacity for revision makes it *possible* that she is tracking truth, whereas your view makes it impossible."

  "And I concede," Elias said, "that if your capacity for revision is wholly fitness-driven, my argument destroys itself. If I cannot trust my reasoning, I cannot trust the debunking. So I must claim that general reasoning is less contaminated than moral intuition. But I admit I cannot prove that distinction without begging the question."

  The bartender signaled last call. The rain had stopped, but the flight remained cancelled.

  "We are not going to solve this tonight," Elias said.

  "No," Mara agreed. "But we need to know what we are fighting over. It isn't about whether evolution shaped us. It isn't about whether she kept the promise."

  "It's about the implication of the stickiness," Elias said.

  "Write it," Mara said. She pushed a napkin across the table.

  Elias picked up a pen. He wrote slowly, then slid it back. Mara read it, adjusted a phrase, and handed it back. They looked at the napkin together.

  "We disagree on whether the human capacity to revise moral beliefs demonstrates a responsiveness to mind-independent truths, or whether even that capacity is merely a deeper layer of fitness-calibrated tenacity."

  Elias nodded. "That's it."

  "That's it," Mara said. She folded the napkin and put it in her pocket.
