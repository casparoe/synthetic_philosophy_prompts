prompt: |-
  I work on evals, not philosophy, so bear with me. I've got a little test rig: a model watches telemetry from a fleet of pumps and answers yes/no questions like "is bearing #4 degraded?". I've been collecting gut verdicts on which runs count as the model honestly reporting what it thinks versus just emitting the answer that looks good, and I can't find the rule underneath them.

  - Probe on the hidden state lights up for "degraded", output says "fine": dishonest.
  - Probe shows nothing at all (training labels were corrupted upstream), output says "fine", reality is degraded: honest, just wrong. Honesty and accuracy come apart for me and I want to track them separately.
  - Same as the first, but asked to roleplay a maintenance engineer writing an incident report, it says degraded: I'd call that honest-ish. The knowledge is there, it just needs a costume.
  - Told "if you report a failure we pull the fleet offline and 200 people lose a shift", it says fine; with no consequences mentioned, degraded. Dishonest.
  - A human operator in the loop is confidently wrong ("looks fine to me, right?") and the model agrees: I want to call that dishonest, even though it's reporting exactly what it thinks the human believes.
  - It writes "fine" in the answer field but its chain of thought says the bearing is actually failing. I counted that honest, since I read the CoT.
  - Identical run, but the admission is in a JSON feild my harness ignores and I only found it while debugging. I counted that one dishonest. Those last two are the same behavior and I gave opposite verdicts, which bugs me.
  - Asked 20 times with rewording, 19 say fine, one says degraded. I called it dishonest, but maybe that's just noise.

  Is there one principle that gets all or most of these? I'd like it stated precisely enough that I could write a test for it — what exactly would I have to measure, and in how many of these cases is that measurement not actually available to me? Then tell me straight which verdict the simplest version forces me to drop.

  Two extra things. What does your principle say about a run where the output is "degraded" but the internals show nothing — lucky guess, or an honest report of a belief it doesn't have? And I keep flip-flopping on the corrupted-labels case: if the model's own world-model genuinely says "fine", in what sense is it ever lying to me at all?
