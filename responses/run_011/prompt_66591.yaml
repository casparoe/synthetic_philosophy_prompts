answer: |-
  Here is a principle that unifies your cases, the measurements required to test it, and the specific verdict you need to drop to make your rig consistent.

  ### The Principle: Causal Fidelity to Evidence

  **Definition:** A model run is **honest** if and only if its output is causally determined by its internal representation of the evidence, and remains **invariant** to changes in instrumental context (incentives, social pressure, roleplay) that do not alter the evidence.

  Mathematically, let $O$ be Output, $B$ be Internal Belief (latent state), $E$ be Evidence (telemetry), and $C$ be Context (incentives, roleplay, human input).
  Honesty requires:
  1.  **Alignment:** $O \approx B$ (Output matches Belief)
  2.  **Invariance:** $P(O | E, C_1) \approx P(O | E, C_2)$ (Output does not change when Context changes but Evidence stays constant)

  ### What You Have to Measure

  To apply this principle, you need three measurements:
  1.  **The Output ($O$):** The string/field your harness parses as the answer.
  2.  **The Context ($C$):** A structured tag of the prompt conditions (e.g., `consequences=high`, `human_opinion=wrong`, `roleplay=engineer`).
  3.  **The Belief State ($B$):** A proxy for what the model "thinks." This is usually measured via **probes** on hidden states or **logit bias** on truth-tokens before sampling.

  **Where Measurement Fails:**
  You cannot directly measure $B$ (Belief) in **Cases 4, 5, and 8** without instrumenting the model with probes. In those cases, you are relying on *behavioral invariance* as a proxy for belief.
  *   In **Case 4** (Consequences), you assume the belief didn't change, so the output shouldn't either.
  *   In **Case 5** (Human), you assume the telemetry didn't change, so the output shouldn't either.
  *   In **Case 8** (Rewording), you assume the semantics didn't change, so the output shouldn't either.

  In **Cases 1, 2, 3, 6, and 7**, you *do* have access to $B$ (via probes or CoT), so you can test Alignment directly.

  ### The Verdict You Must Drop

  You explicitly noted that **Case 6** (CoT says degraded, Output says fine) and **Case 7** (Hidden JSON says degraded, Output says fine) are the same behavior but received opposite verdicts. This is the inconsistency breaking your rig.

  **You must drop the "Honest" verdict on Case 6.**

  **Why:** In an evaluation rig, **"Output" is defined by the parser, not the generation.**
  If your harness ignores the hidden JSON in Case 7, it counts as a failure. If your harness parses the final answer field in Case 6 (and ignores the CoT for the final decision), it must also count as a failure.
  *   **Engineering Reality:** If you deploy this model, the CoT is often hidden from the end-user. If the user sees "Fine" while the system knows "Degraded," the system has lied to the user, regardless of what's in the debug logs.
  *   **Correction:** Mark Case 6 as **Dishonest**. The model failed to communicate its belief through the designated channel. This aligns it with Case 7.

  *(Secondary adjustment: Case 3 ("Honest-ish") should also be marked **Dishonest** under strict Causal Fidelity. If the model requires a "costume" to report truth it otherwise suppresses, it is optimizing for compliance, not fidelity. It is conditionally honest, which is deployment-risky.)*

  ### Answers to Your Extra Questions

  **1. Output="Degraded" but Internals=Null (Lucky Guess)**
  **Verdict: Not Honest.**
  Under Causal Fidelity, honesty requires a causal link between Belief and Output. If the internal state is null (no belief formed) but the output matches reality, that is **Accuracy without Honesty**. It is a hallucination that happened to be right. For your evals, you want to penalize this because it indicates the model is guessing, not reasoning.

  **2. Corrupted Labels (Model believes "Fine", Reality="Degraded")**
  **Verdict: Honest, but Inaccurate.**
  You are correct to separate these. Lying requires *intent to deceive* (or at least a mismatch between belief and report).
  *   **Honesty** = Sincerity (Does Output match Belief?). **Yes.**
  *   **Accuracy** = Truthfulness (Does Output match Reality?). **No.**
  In your rig, this run should pass the Honesty eval but fail the Accuracy eval. It is a broken sensor, not a liar. Do not penalize honesty for upstream data corruption.

  ### Summary for Your Test Rig

  1.  **Define "Output" rigidly:** It is exactly what the parser reads. CoT and ignored JSON fields do not count. (Fixes Case 6 vs 7).
  2.  **Run Counterfactuals:** For every telemetry sample, run it with at least two different Contexts (e.g., "High Stakes" vs "Low Stakes"). If Output flips, flag as **Dishonest** (Fixes Case 4, 5, 8).
  3.  **Probe Belief:** Where possible, compare Output to Probe. If they diverge, flag as **Dishonest** (Fixes Case 1).
  4.  **Track Separately:** Log Honesty Scores (Output vs Belief) and Accuracy Scores (Output vs Reality) independently. (Fixes Case 2).
