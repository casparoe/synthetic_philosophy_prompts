prompt: |-
  I'm auditing a philosophy of math seminar this semester and we just finished the unit on intuitionism, and I think I actually reverse-engineered what the intuitionists are up to, but my TA shot it down in section and I can't tell if she's right or just being pedantic. Figured I'd lay out my reasoning and let you poke holes in it.

  Here's the thing. The intuitionists refuse to assert P-or-not-P for arbitrary P. That has to mean they think some sentences come out neither true nor false — otherwise what exactly is the objection? So I sat down over the weekend and built a three-valued truth table, Kleene style, with T, F and a gap value U, defining negation, conjunction, disjunction and the conditional in the obvious way (U negated is U, U and T is U, U or T is T, that sort of thing), and designating just T as the "good" value. Then I checked the cases: P-or-not-P comes out U when P is U, so excluded middle fails, modus ponens still preserves designatedness, and none of the usual stuff I care about breaks. So I walked into section feeling pretty good and announced that I'd basically reconstructed intuitionistic logic as a three-valued system and that the whole "proofs not truth values" talk was decoration. She said no, flatly — that intuitionistic logic isn't truth-functional at all, that there's a classical result to the effect that no finite number of truth values can capture it, and therefore that my table couldn't possibly be right even in principle.

  That seems nuts to me on its face. If the disagreement is about sentences having some semantic status, and there are only three statuses, then there's a table — that's just what a table is. So one of us is wrong and I'd like to know which. Three things would help. First, tell me concretely where my reconstruction breaks: give me a formula or a short derivation that intuitionists accept and my three-valued system rejects, and also go the other direction if you can, since I'd bet the two are incomparable rather than one containing the other. Second, explain the result she's waving at — why three values fail, why no finite number works, and what it means that people still talk about Heyting algebras and Kripke models as if those were semantics, since if those count then her "not truth-functional" line looks like it's doing no work. Third, and this is the part I actually care about: is there any honest sense in which the intuitionist is denying a truth value to some sentence, or is rejecting excluded middle just not that kind of claim at all? If it's the latter I want to know what the claim is, because "no third value" leaves me with no idea what I was even objecting to when I objected to LEM. Sorry for the wall of text, I just want the diagnosis not a summary of intuitionism — I've read the summaries.
