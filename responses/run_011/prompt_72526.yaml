  2.  **Deconstruct the Theoretical Lens (Dutch Book/Probabilism):**
      *   *Core Idea:* If your degrees of belief (credences) violate the axioms of probability, a bookie can construct a set of bets (a Dutch Book) that guarantees you a loss, regardless of the outcome.
      *   *Requirement:* Agents must have betting quotients (prices they are willing to buy/sell at).
      *   *Rationality:* Coherence is a normative standard for rational belief.
      *   *Cromwell's Rule:* Never assign prior probability 0 or 1 to empirical hypotheses, or you can never update away from them via Bayes' theorem.

  3.  **Analyze the Text (R&GAD) through the Lens:**

      *   **The Coin Toss (Scene 1):**
          *   *Action:* Guildenstern bets on tails. Rosencrantz calls heads. Coin lands heads 92 times.
          *   *G's Reaction:* Confusion, searching for laws, questioning probability, eventually accepting the "special context."
          *   *Dutch Book Analysis:* Are they incoherent?
              *   If G believes $P(Heads) = 0.5$ but acts as if $P(Heads) \approx 0$ (by betting tails repeatedly without adjusting), is that incoherence?
              *   Actually, they *do* keep betting. They don't stop. This suggests their credence isn't updating to 1 for Heads, nor 0. They are stuck in a loop.
              *   *Cromwell's Rule:* If G assigns $P(92 Heads) = 0$ initially, no evidence should move him. But he *is* moved (he gets agitated). So it's not strict Cromwell.
