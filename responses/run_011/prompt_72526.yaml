  6.  **Final Polish:**
      *   Ensure tone is academic but accessible (for a seminar instructor).
      *   Check specific scene references (Act I, Act III).
      *   Make sure to answer the specific prompt about "where the betting gloss distorts."

  7.  **Final Output Structure:**
