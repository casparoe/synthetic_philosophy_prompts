prompt: |-
  I'm teaching a first-year seminar on probability and rational belief and I want to use Stoppard's *Rosencrantz and Guildenstern Are Dead* rather then the usual textbook examples — specifically the opening where a coin comes up heads 92 times running, and the later business with the sealed letter they carry to England without ever reading it. Read those through the Dutch book argument for probabilism. Where does the play actually stage something the coherence arguments are about — are the two of them incoherent in the technical sense, or just badly informed about the setup they're in? — and where does it resist the lens, given that nobody ever quotes them a price or offers them a bet? I'm especially interested in whether accepting the letter's terms sight unseen counts as taking on a bet whose joint payoff you only discover when it's too late, and whether the run of heads is better read as a Cromwell's-rule problem (a zero prior no amount of evidence can move) than as a coherence problem. Point me to the scenes worth putting on the syllabus, say where the betting gloss distorts the play, and finish with what Stoppard gives my students that two pages of the standard probabilism argument doesn't.
