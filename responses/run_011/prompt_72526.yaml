      *   **Where the Lens Resists (The "Bookie" Problem):**
          *   Dutch Book requires a bookie. In R&GAD, the "Bookie" is Fate/The Author/Claudius.
          *   The distortion: Reducing existential confusion to monetary loss. Their loss is life, not money.
          *   They aren't incoherent; they are *uninformed* agents in a deterministic script. The probability isn't subjective; the outcome is fixed. This breaks the subjective probability model.
      *   **Syllabus Recommendations:**
