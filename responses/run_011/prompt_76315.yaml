  ### Purpose and scope

  This spec defines a decision rule for engineering leadership allocating resources toward mitigating low-probability, high-impact failure modes. The agent is a small team operating on quarterly cycles with finite budgets and tangible business stakes (revenue, reputation, continuity). The scope excludes existential risk or civilizational bets; stakes are bounded by company solvency. The rule must output a binary go/no-go or a priority ranking. It must resolve the tension between expected value (EV) maximization and practical resource constraints without resorting to unarticulated intuition. The goal is a procedure that prevents both catastrophic negligence and resource exhaustion on phantom risks.

  ### Requirements

  1.  **Ruin Avoidance (Ergodicity):** The rule must prioritize avoiding absorbing states (bankruptcy, irreversible reputation loss) over maximizing aggregate EV. *Case:* The $40M failure mode. A strategy with positive EV but a 1-in-10,000 chance of total insolvency must be rejected. In non-ergodic systems, time averages diverge from ensemble averages; surviving the sequence matters more than the single-shot expectation. Ignoring tail risk here leads to extinction, rendering long-term EV meaningless. The rule must distinguish between risks you can recover from and those that end the game, treating the latter as constraints rather than variables. It must recognize that once you hit zero, you stop playing. Failure here means the company ceases to exist before the EV can realize.
  2.  **Pascal's Mugging Resistance:** The rule must not compel action solely because impact scales faster than probability diminishes. *Case:* Spending the whole quarter on a 1-in-a-million chance. Pure EV says pay; practical engineering says ignore. In an engineering context, this manifests as speculative re-architecting for hypothetical scale. The rule must cap utility or discount probability non-linearly to prevent resource diversion to fantastical scenarios where probability estimates lack empirical grounding. It must prevent the math from demanding 100% of the budget for low-confidence tail events. It must acknowledge that human probability estimation breaks down at extremes. Failure here means engineering teams spend quarters solving problems that never materialize.
  3.  **Dynamic Consistency:** Decisions must not be exploitable across a sequence of choices. *Case:* The "rounding to zero" debate. If you round probabilities below a threshold to zero, an adversary (or reality) can construct a sequence of bets where you accept small losses repeatedly, guaranteeing a large loss later. The rule must handle cumulative risk without money-pump vulnerabilities, ensuring that a sequence of rational local decisions does not sum to a globally irrational outcome. It must account for the sum of many small ignored risks accumulating into a certainty of failure over time. Failure here means death by a thousand cuts despite each cut being deemed negligible.
  4.  **Epistemic Grounding:** Probability estimates must map to observable frequencies or robust models, not subjective priors alone. *Case:* Acting on a "1-in-a-million" estimate derived from zero data points leads to waste. The rule must discount EV based on estimator variance or confidence intervals, not just point estimates. Distinguish between aleatoric uncertainty (inherent randomness) and epistemic uncertainty (lack of knowledge); the latter should penalize action more heavily when stakes are high. Don't treat made-up numbers as hard data. The confidence in the probability estimate must weight the decision as much as the probability itself. Failure here means optimizing noise rather than signal, wasting resources on false positives.
  5.  **Computational Tractability:** The cost of computing the decision must not exceed the expected value of the decision itself. *Case:* The two-week argument. Spending fourteen engineering-days debating a $10k risk violates this. The rule must include a meta-cost function for analysis time. If the decision process itself consumes the budget meant for mitigation, the rule has failed. This requires heuristics that are cheap to compute but robust enough to avoid catastrophic errors, balancing precision with velocity. Analysis paralysis is itself a failure mode that must be guarded against by the rule. Failure here means the cost of safety exceeds the cost of the risk being mitigated.
  6.  **Stakeholder Defensibility:** The rationale must be translatable into non-probabilistic language for non-experts. *Case:* The "vibes" accusation. Telling a CFO "EV says so" fails when the event doesn't happen. The rule must produce narratives based on risk tolerance bands, not just raw numbers. Engineering decisions require buy-in; a mathematically correct rule that cannot be explained to leadership will not be implemented, rendering it useless. It must bridge the gap between statistical expectation and business narrative. If the rule cannot survive a board meeting, it is not adequate. Failure here means correct decisions are vetoed due to lack of communicable rationale.

  ### Hard constraints vs. camp preferences

  Hard constraints are mathematical and survival-based: Ruin Avoidance and Dynamic Consistency are non-negotiable; violating them guarantees eventual failure or exploitation. Epistemic Grounding is a hard constraint on input quality; garbage priors yield garbage decisions. Conversely, Pascal's Mugging Resistance is often a camp preference; strict EV maximizers view it as a bug, not a feature, arguing proper priors solve it. Computational Tractability is a preference weighted by organizational velocity vs. precision. Stakeholder Defensibility is a political constraint, not a logical one, though practically essential for implementation. The tension lies in treating EV maximization as a preference rather than a law.

  ### Where the list fights itself

  The list contains a fundamental tension between Ruin Avoidance and Pascal's Mugging Resistance. Ruin Avoidance demands sensitivity to tiny probabilities of catastrophic loss (left tail). Mugging Resistance demands insensitivity to tiny probabilities of catastrophic gain (right tail). A symmetric probability discount solves Mugging but blinds you to ruin. An asymmetric utility function solves ruin but invites mugging if not bounded. Furthermore, Dynamic Consistency often conflicts with Computational Tractability; ensuring no money pumps requires tracking state across decisions, increasing analysis cost. You cannot simultaneously maximize sensitivity to existential threats, ignore fantastical gains, and minimize decision overhead without introducing arbitrary thresholds that violate strict consistency. This is the core impossibility: you must choose which consistency to sacrifice, as no single function satisfies all conditions simultaneously. Arbitrary thresholds create cliff-edge effects where a tiny change in estimated probability flips the decision, inviting manipulation.

  ### Most exclusionary requirement

  The most exclusionary requirement is **Dynamic Consistency combined with Pascal's Mugging Resistance**. Most heuristic rules (like "ignore p < 0.001") fail consistency because they create exploitable gaps. Most consistent rules (like pure EV) fail Mugging Resistance. Finding a rule that is both mathematically coherent across sequences and immune to utility bombing eliminates nearly all standard decision theories, including naive EV maximization and simple thresholding. It forces adoption of bounded utility or non-linear probability weighting.

  ***

  *Note on Civilizational Bets:* Yes, the spec changes for civilizational bets. Time horizons extend indefinitely, making Dynamic Consistency paramount over Tractability. Utility functions become unbounded, removing the Mugging resistance constraint but heightening Ruin Avoidance to an absolute imperative.
