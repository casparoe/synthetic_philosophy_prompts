  3.  **Address the "Frame Problem" Classification:**
      *   *User's Insight:* "Backwards from the usual invocation... no persistence assumptions at all." This is a very sharp observation. Usually, the Frame Problem is about how to *avoid* stating everything stays the same. Here, the system failed to assume the object *persisted* as the same threat across classification changes.
      *   *McCarthy & Hayes (1969):* The logical formalism problem (how to represent change without listing all non-changes).
      *   *Qualification Problem:* What preconditions are necessary for an action to succeed? (Infinite list of exceptions).
      *   *Ramification Problem:* What are the indirect consequences of an action?
      *   *Dreyfus/Fodor (Relevance):* How does a system know what facts are relevant in a context without checking all facts?
      *   *Analysis:* The Uber case isn't strictly the logical Frame Problem (symbolic AI). It's a *Perceptual/Tracking Frame Problem*. It's about **Object Persistence** and **Relevance**. The system failed to maintain the *identity* of the threat across changing sensory data (classification).
      *   *Best Fit:* It's closest to the **Relevance** version (Dreyfus/Fodor) but manifested through a lack of **Default Persistence** (common sense physics). The system treated every classification update as a potential *new* context, failing to apply the default: "Uncertain objects in the road are likely to continue existing and moving."
      *   *Specific Inference Needed:* "Object X at t1 is Object X at t2 despite classification uncertainty."
