answer: |-
  This is a sharp reading of the NTSB report (HAR-19/03), and your philosophical framing is provocative. You have correctly identified that the technical failure maps onto a specific cognitive architecture failure, even if the industry doesn't usually describe it in those terms.

  Here is the breakdown of the facts, the specific variety of the Frame Problem at play, and the implication of the NTSB fixes.

  ### 1. Fact Check: Your Narrative vs. The NTSB Report
  Your account is substantially accurate, with one crucial technical nuance regarding the "track history."

  *   **Detection Time:** **Correct.** The system detected the object 6.0 seconds before impact.
  *   **Classification Flip-Flop:** **Correct.** It classified her as a vehicle (4.2s out), then a bicycle (3.8s out), then an "unknown object" (1.5s out). It never classified her as a pedestrian.
  *   **Track History:** **Nuance.** The system *did* maintain a track ID (it knew *something* was there continuously). However, your core insight holds: the **trajectory prediction model reset** with every classification change. Because the prediction logic was tied to class (e.g., "vehicles stay in lanes," "bicycles might wobble"), reclassifying her effectively wiped the *intent* history. The system treated the *threat profile* as a new object each time.
  *   **Action Suppression:** **Correct.** Uber had disabled the Volvo factory AEB to reduce "false positive" jerkiness. The custom system was designed to alert the safety driver 1.3 seconds before impact rather than braking automatically.
  *   **Safety Driver:** **Correct.** She was streaming video on her phone and looked up only ~1 second before impact.

  **Verdict:** Your technical premise is sound enough to support the philosophical argument. The system failed to maintain *semantic persistence* even if it maintained *spatial tracking*.

  ### 2. Which Frame Problem Is This?
  You are right to reject the standard McCarthy & Hayes (1969) formulation. That was a bookkeeping problem for symbolic logic: *How do we represent that everything else stays the same when one thing changes without writing infinite axioms?*

  The Uber case is not about logical axioms; it is about **perceptual relevance and default persistence.**

  *   **Not Qualification/Ramification:** The Qualification Problem asks, "What infinite preconditions are needed to ensure an action works?" (e.g., "The car will brake unless the line is cut, unless the battery is dead..."). While relevant to the disabled AEB, the core software failure is different.
  *   **The Dreyfus–Fodor Relevance Version:** This is the closest fit. The problem is: *In a sea of data, what facts are relevant to the current context?* The system failed to recognize that "uncertainty about object class" is a **high-relevance fact** that should trigger a "caution" default. Instead, it treated uncertainty as a cue to reset its prediction model.
  *   **The "Backwards" Frame Problem:** Your insight here is excellent. Classical AI struggles because it assumes too much persistence (the world is static unless acted upon). The Uber system suffered from **Identity Fragmentation**. It lacked a **Default Persistence Assumption** for *threat*.

  **Diagnosis:** This is a failure of **Non-Monotonic Reasoning under Uncertainty**.
  In human common sense, if you see a shape in the road, and then the lighting changes and it looks slightly different, you assume it is the *same* shape continuing its path. You apply a **persistence default**. The Uber system applied a **classification-dependent default**. When the class became "unknown," the default switched from "moving with traffic" to "stationary/irrelevant," effectively deleting the collision trajectory.

  ### 3. The Specific Inference and Default
  To answer your specific request for the inference and the licensing default:

  *   **The Missing Inference:**
      > "Object $O$ at $t_1$ is identical to Object $O$ at $t_2$, and its momentum vector $\vec{v}$ persists, *even if* the semantic label $L(O)$ changes or becomes null."

  *   **The Required Default:**
      > **The Conservation of Threat Default:** "If an object's classification is uncertain or volatile, default to the trajectory that maximizes collision risk (conservative estimation) rather than the trajectory that minimizes computational conflict."

      In logic programming terms, this is a **defeasible rule**.
      *   *Rule:* `IF object_class == unknown THEN assume_stationary.` (Uber's fatal rule)
      *   *Correction:* `IF object_class == unknown THEN assume_continuing_trajectory AND reduce_velocity.`

      The system needed a meta-rule that prioritized **spatiotemporal continuity** over **semantic certainty**. It prioritized knowing *what* the object was over knowing *where* it was going, which is the inverse of how biological navigation works.

  ### 4. The NTSB Fixes: Shallow Engineering or Deep Pessimism?
  This is the crux of your inquiry. The NTSB recommendations were:
  1.  Improve classification (add jaywalker/walker classes).
  2.  Maintain track history across classification changes (don't reset predictions).
  3.  Re-enable AEB (redundancy).
  4.  Monitor safety drivers (human factors).

  **Does this show the Frame Problem was never deep?**
  **No.** It validates the **pessimists' point (Dreyfus, Winograd, Flores)** that the list of abnormal cases never ends.

  Here is why:
  The fixes are **enumerative patches**, not **general principles**.
  *   Adding a "jaywalker" class fixes *this* accident. It does not fix the accident where a person is pushing a wheelchair, or carrying a mattress, or crawling.
  *   Re-enabling AEB fixes the *braking* failure, but not the *perception* failure. If the system classifies a large, strange object as "debris" (stationary) rather than "obstacle" (moving), AEB might still not trigger if the threshold is set to avoid false positives.
  *   Keeping track IDs fixes the *reset* issue, but it relies on the threshold for "unknown" being set correctly.

  **The Pessimist's Argument:**
  The Frame Problem in open-world robotics is that you cannot predefine the ontology of "things that matter." The Uber system failed because it operated on a **Closed World Assumption**: *If it doesn't fit my known classes (Car, Bike, Pedestrian), it is not a dynamic threat.*

  The NTSB fixes simply expand the Closed World slightly. They add more classes and more redundancy. They do not solve the underlying epistemic problem: **How does a system act rationally when it knows it doesn't know what it is looking at?**

  A "deep" solution would not be adding a "jaywalker" class. It would be a heuristic that says: *"There is a mass in the drivable zone. I do not know what it is. Therefore, I must assume it is vulnerable and moving."* That is a common-sense relevance rule, not an engineering spec.

  **Conclusion:**
  The Uber fatality is a canonical example of the **Relevance Frame Problem** manifesting in machine learning. The system could not determine which features were relevant (trajectory vs. classification) when data was noisy.

  The NTSB fixes prove the pessimists right: we are solving these accidents by **enumerating exceptions** (add class, keep ID, enable brake) rather than instilling **general wisdom** (assume threat when uncertain). As long as we rely on enumeration, the list of "abnormal cases" remains infinite, and the next fatality will simply involve a class of object we haven't added to the list yet. The Frame Problem remains unsolved; we are just building taller fences around a smaller field.
