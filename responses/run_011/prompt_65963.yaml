  8.  *(Self-Correction during drafting)*: I need to be careful not to conflate the Volvo AEB disablement with the software logic. The AEB was disabled by *policy*, not a logical frame error. The software logic error was the classification reset. I should distinguish these. The Frame Problem applies more to the software's handling of the object than the policy decision to disable braking. I will focus on the software's tracking logic for the Frame Problem analysis.

