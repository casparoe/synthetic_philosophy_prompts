answer: |-
  ### 1. Mapping the Status Function

  To map the 1970 episode onto Searle's formula ($X$ counts as $Y$ in context $C$), we must be precise about the fragmentation of the "collective."

  *   **X (The Vehicle):** The physical cheque. Crucially, this is not cash. It is an instruction to a specific bank to transfer funds from a specific account.
  *   **Y (The Status):** "Means of Payment" or "Discharge of Debt." It is *not* strictly "Money" in the sense of legal tender, but it functions as a final settlement in the immediate transaction.
  *   **C (The Context):** The local exchange network (e.g., a specific pub, a village shop). It is *not* the "Irish Economy" as a monolithic whole, because a cheque from a Dublin accountant might not circulate in a Donegal shop.
  *   **The Collective:** This is the critical pressure point for Searle. The collective is not the Irish public at large, nor is it the state. It is a **fragmented series of overlapping micro-collectives**. The "we-intention" required to sustain the status function existed only within the radius of personal knowledge. The publican and his regulars constitute one collective; the shopkeeper and her patrons another.
  *   **Deontic Powers:** The powers conferred were not legal rights enforceable in court during the strike (since clearing was suspended), but **social obligations**. To refuse a cheque from a known solvent customer was a breach of social standing; to accept it was to incur a temporary float risk. These powers were not "conferred" by a sovereign act but **presupposed** by pragmatic necessity and mutual monitoring.

  **Weight Check:** You ask if any fact carries too much weight. The fact that "few items were dishonoured" carries significant weight for the *stability* of the system, but it risks obscuring the *risk* borne during the interval. If the dishonour rate was low *ex post*, it does not mean the risk was zero *ex ante*. The ontology must account for the risk, not just the outcome.

  ### 2. Assessing the Rival Theories

  **Searle (Collective Intentionality)**
  *   **Explains:** The *circulation*. Searle's framework captures how a piece of paper acquires purchasing power through local recognition. It explains why a cheque worked in a pub where the landlord knew you, but might fail with a stranger. The status function is locally sustained.
  *   **Misdescribes:** It implies a robustness of "collective intentionality" that wasn't there. The acceptance was provisional and pragmatic, not a deep constitutive rule. Searle's model suggests a stable $Y$ status; here, the $Y$ status was fragile and revocable at every transaction.
  *   **Silences:** It cannot explain **parity**. Why did these cheques circulate at face value (par) rather than at a discount reflecting the risk and delay? Collective intentionality alone does not anchor value. It also falls silent on **finality**. Searle explains the exchange, but not why the system didn't collapse into a barter of IOUs.

  **Knapp (State Theory)**
  *   **Explains:** The **Unit of Account** and **Final Settlement**. The cheques were denominated in Irish Pounds (linked to Sterling), a state-defined unit. The eventual settlement at par upon reopening confirms that the state (via the Central Bank and legal framework) remained the ultimate anchor. The "money-ness" was guaranteed by the legal existence of the banks, even if their doors were shut.
  *   **Misdescribes:** The **Medium of Exchange**. Knapp's theory suggests money is a creature of law. During the strike, the state did not designate these cheques as legal tender, nor did it facilitate their clearing. By strict Chartalist lights, the money supply should have contracted to zero. It did not.
  *   **Silences:** It cannot explain the **autonomy** of the circulation. If money is purely a state liability, how did it function for six months without state processing? Knapp describes the *anchor*, but not the *ship*.

  ### 3. The Deflationary Reading

  The deflationary reading posits that no new ontological kind was created. What circulated were **claims on existing institutions**, denominated in a **state-backed unit**, sustained by the **expectation of eventual clearance**.

  **Does it succeed?**
  Yes, but with a crucial qualification. It succeeds in identifying the **anchor** of the system but risks under-describing the **mechanism** of circulation.

  *   **Why it succeeds:** It correctly identifies that the *value* of the cheque did not derive from the paper (Searle) or a new state fiat (Knapp), but from the **persistence of the bank as a legal debtor**. The bank did not cease to exist; it merely ceased to operate. The "institution" in the ontological sense (the legal entity liable for the debt) remained intact. If the banks had been nationalised or declared insolvent during the strike, the cheques would have become worthless regardless of local trust. Thus, the episode does *not* prove money can exist without institutions; it proves that the *visible* machinery of settlement can be decoupled from the *invisible* legal structure of liability.
  *   **The Cost of Resisting It:** To resist this reading, one must argue that the cheque *became* money in a new sense during the strike. The cost of this resistance is high: you must explain why the cheque was worth £10 and not £5 or £0. If it were truly a new Searlean money, its value should have been determined by the local collective's valuation, likely resulting in discounts (a floating value). The fact that it held at **par** proves it was parasitic on the pre-existing institutional claim. To deny the deflationary reading is to ignore the anchor that prevented hyperinflation of the cheque supply.

  However, the deflationary reading is insufficient if it claims *nothing* ontologically interesting happened. It ignores the **social labour** of verification. The bank's credit assessment function was outsourced to the publican. The *institution of credit assessment* was socially reconstructed, even if the *institution of liability* remained static.

  ### 4. Verdict

  This episode falsifies the claim that money is a monolithic social kind constituted by a single mechanism. Instead, it demonstrates that money is a **hierarchy of credit relations** where the **unit of account** and the **medium of exchange** can be ontologically decoupled.

  The verdict is in favour of the **Credit/Claim Theory** (aligned with the deflationary reading), modified to acknowledge the **distributed nature of trust**.

  1.  **Money is not a Status Function on a Token:** The cheque did not become money because people agreed it was money (Searle). It functioned as money because it was a **transferable claim on a solvent institution** (Credit Theory).
  2.  **Institutions are Invisible but Constitutive:** The episode does not show money surviving without institutions. It shows money surviving without *operational* institutions, provided the *legal* institutions (the banks' liability) remain intact. The "social construction" of money relies more on the **expectation of future settlement** than on present collective recognition.
  3.  **The Role of the Collective:** The "collective intentionality" was not constitutive of the *value*, but constitutive of the *liquidity*. The public did not create the value; they created the velocity.

  Therefore, the episode shows that the social ontology of money is **asymmetric**. The *downside* (liability/settlement) is anchored by the State/Bank (Knapp/Credit), while the *upside* (circulation/acceptance) can be sustained by local networks (Searle). But because the upside is parasitic on the downside, the **Credit/Claim account is ontologically prior**. Money is fundamentally a social relation of debt, not a status function imposed on paper.

  ### 5. Falsification and Self-Critique

  **What would change my mind?**
  1.  **Evidence of Significant Discounting:** If archival data showed that cheques circulated at significant, variable discounts (e.g., a £10 cheque accepted only as £8 in some shops), my verdict would shift toward Searle. This would indicate that value was being locally constructed based on trust, rather than anchored by the bank's parity. Parity is the linchpin of the Credit reading.
  2.  **State Repudiation:** If the Central Bank had announced it would *not* honour cheques presented after a certain date, and the system *still* functioned for a period, the Credit/State anchor would be broken. If money persisted despite the issuer denying liability, then Searlean collective intentionality would be the primary constitutive force.
  3.  **Expansion to Strangers:** If evidence emerged that cheques circulated freely between strangers with no local knowledge (e.g., via a secondary market), the "local network" constraint would dissolve. This would suggest the status function had become truly generalized, independent of the specific debtor-creditor relationship.

  **Where I am most likely to have failed:**
  I have likely construed the **"Institution"** too broadly in the deflationary reading. I argue the bank remained an institution because it remained a legal entity. A critic could argue that an institution that cannot perform its function (clearing) is ontologically defunct, and that the *network of publicans* became the new institution.
  *   **Risk:** If "institution" means simply "any stable pattern of expectation," then the deflationary reading becomes tautological (money requires institutions; the publicans were institutions; therefore money required institutions). To avoid this, I must maintain a hard distinction between **legal liability** (the Bank) and **social verification** (the Publican).
  *   **Thin Collective Acceptance:** I may have construed "collective acceptance" too thinly in the Searlean critique. If acceptance is merely pragmatic ("I need to pay for this pint"), does it count as collective intentionality? If *any* pragmatic cooperation counts as a status function, Searle's theory becomes unfalsifiable. I have assumed that for a status function to be robust, it must be detachable from immediate pragmatic necessity. In the strike, it was not. This suggests the "money" status was weaker than Searle requires, supporting the view that it was merely a **credit instrument** in disguise.

  **Final Self-Correction:** The weakest point in my reasoning is the assumption that *parity* proves the Credit Theory. Parity could be a focal point coordinated by collective intentionality (Searle) rather than an anchor of liability (Credit). However, given the eventual settlement was guaranteed by the *banks*, not the *publicans*, the liability anchor remains the stronger explanation for the *value*, even if the publicans explained the *velocity*.
