answer: |-
  ### (1) Examination Question

  **Module:** PHIL304: Early Modern Philosophy & Political Economy
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question 1**

  Consider the following hypothetical scheme:

  > The Town of Oakhaven issues paper notes to local farmers. These notes are declared legal tender for all local taxes and debts. However, to prevent hoarding, every note loses 5% of its face value every month unless the holder purchases a validation stamp from the town bank. The notes cannot be exchanged outside the district. The bank issues these notes not against a reserve of gold, but against the security of the town's arable land and the projected value of the harvest.

  In *The Querist*, Berkeley suggests several premises relevant to this scheme: that the usefulness of money tracks its circulation rather than the size of the stock; that money which is hoarded does no work; that gold and silver are no better as money than trusted paper; and that real wealth consists in the capacity to set industry in motion rather than the accumulation of metal in a vault.

  Write an essay addressing the following:

  1.  Applying these premises, determine whether Berkeley would endorse the Oakhaven scheme, and identify where his specific commitments might cause him to hesitate.
  2.  Evaluate the claim that Berkeley's monetary theory is merely an independent functional argument that a thoroughgoing materialist about bodies could sign up to without flinching. Does his immaterialist metaphysics (*esse est percipi*) do any actual work in his economics, or is it decorative?
  3.  In light of your analysis, evaluate your colleague's claim that Berkeley should be read as an early chartalist (i.e., that money is defined by what it is accepted for in payment of debts/taxes, not what it is made of). Is this reading sufficient to capture Berkeley's position, or does it miss a crucial element of his thought?

  ***

  ### (2) Model Answer

  Berkeley would likely endorse the Oakhaven scheme with enthusiasm, viewing it as a practical instantiation of his core economic insight: that value is dynamic rather than static. The stamp scrip mechanism directly addresses his concern that money often lies "dead" in private hands. By imposing a cost on hoarding, Oakhaven forces the velocity of money to remain high, ensuring that the notes continuously circulate to stimulate local industry. Furthermore, backing the currency with land and harvest rather than specie aligns perfectly with Berkeley's repeated suggestion that the wealth of a nation lies in the produce of the land and the labour of its people, not in the "counters" used to reckon it. He would argue that the Oakhaven notes are superior to gold because they are tied directly to the real source of value (industry/land) rather than a metal that has no intrinsic connection to local welfare.

  However, a materialist economist could agree with almost all of this without accepting Berkeley's metaphysics. A thoroughgoing materialist could argue that gold is merely a commodity like any other, and that paper is a more efficient token for facilitating exchange. They could agree that hoarding reduces velocity and that wealth is the capacity to command labor. If the functional arguments stand independently of the metaphysics, one might conclude that Berkeley's immaterialism is irrelevant to his economics. On this reading, the *Querist* is simply a proto-Keynesian or proto-Chartalist writing in a metaphysical idiom that adds nothing to the economic mechanism.

  Yet, this separation is too clean. While the *mechanics* of Berkeley's proposal are compatible with materialism, the *motivation* for rejecting the fetishism of gold relies heavily on his broader philosophical project. For a materialist, gold has a physical reality that paper lacks; arguing that paper is "equal" to gold requires overcoming a prejudice about the substance of the money. For Berkeley, who denies that material substance has any ontological privilege to begin with, the leap is natural. If bodies have no subsistence independent of perception and use, then a gold coin has no more "reality" than a paper note. The metaphysics does not generate the economic theory, but it dissolves the psychological barrier to accepting it. It clears the ground by undermining the superstition that value inheres in the metal itself.

  This nuance is where the "Chartalist" reading succeeds and fails. The colleague is correct that Berkeley anticipates the chartalist insight: money is money because it is accepted for taxes and debts (as in Oakhaven), not because of its metallic content. Berkeley explicitly queries whether the stamp on the paper does not give it value, much like the sovereign's authority. However, labeling him a chartalist risks reducing his thought to a technical theory of state credit. Berkeley's concern is not merely fiscal stability but moral and national revitalization. He wants money to be a "ticket" for industry, not just a unit of account. The Chartalist reading captures the *source* of validity (state/town acceptance) but misses the *end* of money (the stimulation of labor and the relief of the poor).

  Therefore, the Oakhaven scheme works for Berkeley not just because the town accepts the notes, but because the scheme forces those notes to keep industry moving. A pure chartalist might be satisfied with the notes functioning as a tax credit even if they were hoarded; Berkeley would not. Ultimately, Berkeley's economics is functionally independent of his metaphysics—a materialist could run Oakhaven—but his metaphysics provides the consistent philosophical groundwork that prevents the regression into valuing the token over the work it represents. The immaterialism is not the engine of the economy, but it is the philosophy that allows the engine to be seen clearly.

  ***

  ### (3) Marking Scheme

  **Total Marks:** 25
  **Pass Mark:** 10

  **Five Must-Hit Points:**

  1.  **Application to Case (5 marks):** Correctly identifies that Berkeley would support the anti-hoarding stamp (circulation) and the land-backing (real wealth vs. metal).
      *   *Botch:* Students treat the case study as a distraction and write a generic biography of Berkeley's economics without referencing Oakhaven.
  2.  **The Materialist Compatibility Thesis (5 marks):** Acknowledges that the functional arguments (velocity, labor theory of wealth) do not logically require immaterialism and could be held by a materialist.
      *   *Botch:* Students insist that a materialist *cannot* understand velocity of money, confusing ontology with economic mechanism.
  3.  **The Metaphysical "Work" (5 marks):** Articulates *how* the metaphysics supports the economics (e.g., by removing the ontological privilege of gold/substance), even if it doesn't generate the mechanics.
      *   *Botch:* Students claim the economics is *deduced* from *esse est percipi* (the "price tag" error the prompt warns against).
  4.  **Chartalist Evaluation (5 marks):** Nuanced assessment: accepts the "acceptance/debt" insight but notes Berkeley's deeper focus on industry/moral ends which exceeds technical chartalism.
      *   *Botch:* Students treat "Chartalism" as a historical fact to be confirmed or denied, rather than a conceptual claim to be evaluated.
  5.  **Integration/Synthesis (5 marks):** The essay connects the Case, the Metaphysics, and the Chartalist claim into a unified argument rather than three separate sections.
      *   *Botch:* The "Split" essay: Section A does the case study perfectly, Section B discusses metaphysics, but they never talk to each other.

  **Grade Differentiation:**

  *   **First Class (20–25 marks):** Hits all five points. Crucially, distinguishes between the *mechanics* of the theory (compatible with materialism) and the *philosophical justification* (aided by immaterialism). Uses the Oakhaven case to illustrate exactly where the materialist and the immaterialist would diverge in attitude, if not in policy.
  *   **Upper Second (2:1) (15–19 marks):** Hits points 1, 2, and 4 strongly. Usually identifies that the economics is functionalist. Loses marks on Point 3 (fails to explain *why* the metaphysics matters if the economics is compatible with materialism) or Point 5 (treats the case study and the theory as separate tasks).
  *   **Lower Second (2:2) (10–14 marks):** Hits Points 1 and 2. Summarizes Berkeley's views on money accurately but fails to engage with the metaphysical tension or the Chartalist claim. Relies on general knowledge rather than the provided stem.
  *   **Fail (0–9 marks):** Fails to apply the premises to the Oakhaven case. Misrepresents Berkeley's view on money (e.g., claims he wants to abolish money). Does not address the prompt's specific question about materialism.
