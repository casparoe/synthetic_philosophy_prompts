  11. **Final Polish:** Ensure the distinction between "Real Pattern" (Dennett) and "Mathematical Abstracta" (CoG) is sharp. Dennett's Real Patterns are interest-relative; CoGs are not. This is the killer argument. Ensure the LLM section distinguishes between inference-time (static) and training-time (deformable).

  *(Self-Correction during drafting)*: I need to be careful not to just say "Supervisor is wrong." I need to explain *why* the analogy fails to do the *philosophical work* requested (dissolving the debate). The Supervisor wants quietism. The analogy delivers either realism or a false reduction. I must make sure the "Backfire" section is strong. Also, ensure the "Instantaneous CoG" critique addresses the *cause* of the deformation.

  *(Refining the Map Analogy)*: Is "Map" a source domain? Yes. It tracks the Intentional Stance. It allows for multiple valid representations of the same territory (indeterminacy) while maintaining objective constraints (you can't map a river as a mountain). This fits the Student's need to show the debate is *not* pseudo.

  *(Refining LLM section)*: Focus on the fact that LLMs don't have a "center" of agency. Attributing beliefs to an LLM is more like attributing a center of gravity to a cloud of gas than a brick. It makes the CoG analogy *less* stable, not more.

