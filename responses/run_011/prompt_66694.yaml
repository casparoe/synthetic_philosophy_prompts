      *   **Task:** Audit the analogy.
      *   **Specific Requirements:**
          1.  Explicit statement of correspondence (Target vs. Source).
          2.  Disanalogies (Damaging vs. Cosmetic). Test the student's suspicion (determinacy vs. contestability, interest-relativity).
          3.  Check if the analogy backfires (argues for realism instead of quietism).
          4.  Evaluate Design Stance/Thermostat vs. Intentional Stance. Evaluate the "instantaneous CoG" reply.
          5.  Propose a better source domain if CoG fails. Evaluate Temperature (Stat Mech) and Nash Equilibrium.
          6.  Flag issues specific to LLMs vs. Humans.
          7.  Tone/Style: American English, plain verdict (no hedging), no references/reading list, analytical depth suitable for a PhD candidate.

  2.  **Deconstruct the Center of Gravity (CoG) Analogy:**
