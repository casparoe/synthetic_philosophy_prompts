      *   *Verdict:* It backfires. It grants too much reality to the abstracta, undermining the deflationary punch. It makes beliefs *too* robust (mathematically fixed) rather than *just* useful.

  6.  **Drafting Section 4: Design Stance & Instantaneous CoG:**
      *   *Design Stance:* Thermostat set-point. This is better for function but worse for *content*. A thermostat doesn't have "beliefs" in the rich sense. It fits the "abstracta" view but loses the cognitive richness.
