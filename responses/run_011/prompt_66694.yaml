      *   *Damaging 1 (Determinacy):* CoG is uniquely determined by mass. There is *one* CoG. Belief attribution is *indeterminate*. Multiple intentional interpretations can fit the same physical data (Quine/Dennett). This kills the "pseudo-debate" claim because the *mapping* is the debate.
      *   *Damaging 2 (Interest-Relativity):* CoG exists regardless of an observer's interests (gravity acts on it anyway). Real Patterns (Dennett) are interest-relative (predictive efficacy for *us*). If beliefs are CoGs, they are observer-independent. If they are Real Patterns, they depend on the stance.
      *   *Damaging 3 (Normativity):* CoG calculations don't fail because the object is "irrational." Belief attribution fails if the agent is irrational. CoG is descriptive; Belief is normative.

