  ### Reasoning

  **1. What, if anything, did the board decide last month, and what should the journal now tell the author?**

  The board decided to accept the submission, despite the communication to the contrary. To understand why, we must distinguish between *regulative* habits and *constitutive* rules. A regulative habit is how things are usually done (the show of hands); a constitutive rule is what makes an action count as a specific institutional act (the bylaws). The bylaws state the necessary and sufficient conditions for acceptance: a majority on argument quality and a majority on remit. These conditions were met (5-2 and 4-3). The final show of hands was merely a poll of individual intentions, not the operative decision mechanism defined by the journal's constitution. Since the conditions for acceptance were satisfied, the status of the submission changed to "accepted" at the moment the votes were tallied, regardless of the Chair's subsequent miscounting.

  Regarding the author, the journal should send a correction immediately. While the initial email created an expectation of rejection, that expectation was based on a false representation of the board's governing rules. Continuing to enforce the error would privilege a procedural mistake over the journal's own stated standards. The letter should explain that a clerical error occurred in applying the voting rules, apologize for the confusion, and offer acceptance. This preserves the integrity of the journal's standards over the comfort of its administrative habits.

  **2. Is the editor who denies that there was any board decision — and denies that she is bound by one — making a coherent claim, or is she describing a position she is not in fact entitled to occupy?**

  She is occupying a position she is not entitled to. When an individual joins a rule-governed body like an editorial board, they enter into a normative agreement: they agree to be bound by the output of the group's decision procedures. This is the price of collective agency. By casting a vote, she participated in the mechanism designed to generate a collective verdict. To vote is to attempt to influence the collective will; to then deny that the collective will exists or binds you is to engage in a pragmatic contradiction. She is effectively claiming the right to influence the outcome without accepting the responsibility of the outcome.

  She is entitled to dissent from the *content* of the decision (i.e., she can record that she voted against it), but she is not entitled to deny the *existence* of the decision itself. If she believes the journal cannot have a collective verdict, her recourse is to resign from the board, not to remain a member while disavowing the membership's core function. Her claim undermines the possibility of the journal acting as anything other than a loose aggregation of individuals, which contradicts the existence of the bylaws she agreed to uphold.

  **3. Was the chair's email an act of the journal, and if so, is she in a position to retract it?**

  The email was an act of the journal, executed through the Chair as its authorized agent. However, it was an *ultra vires* act—meaning it was beyond the powers granted to her by the bylaws. The bylaws gave her the authority to communicate the decision determined by the voting rules, not the decision determined by her own misapplication of them. Because the email misrepresented the actual status of the submission under the journal's own laws, it is voidable.

  She is not only in a position to retract it; she has a fiduciary duty to do so. An agent who discovers they have communicated misinformation regarding the principal's (the journal's) position must correct that record to prevent ongoing violation of the principal's rules. The objection that she cannot do this "on her own authority" is partially correct: she should ideally inform the board that she is correcting an error of law, but she does not need a new vote to correct a mathematical or procedural error in the previous communication. The retraction is not a new policy decision; it is the administration of the existing one.

  **4. Which of the two proposed fixes should we adopt, and does either one actually settle the question underneath them, or does each merely relocate it?**

  You should adopt the second fix: keep the two qualifying votes and let the bylaws compute the outcome mechanically. The first fix (voting only on accept/reject) requires amending the bylaws, as it removes the specific criteria (argument and remit) that the current constitution mandates. If you adopt the first fix without changing the bylaws, you are simply institutionalizing the error that caused this dispute. If you do change the bylaws, you are altering the journal's mission to prioritize holistic judgment over specific criteria, which is a substantive change, not just a procedural one.

  The second fix settles the underlying question because it removes the ambiguity of the "overall question." The dispute arose because the overall vote allowed editors to weigh the two criteria differently (e.g., vetoing a paper on remit even if it passed the majority threshold, or vice versa). By removing the overall vote, you force the procedure to align with the stated values of the journal. It relocates the question only insofar as it forces editors to be precise about *why* they are rejecting a paper (quality vs. fit) rather than allowing a general "no." This precision is a feature, not a bug, for a philosophy journal.

  **5. What should I write in the minutes?**

  You should write a clear, neutral account of the discrepancy and the resolution. The minutes are not merely a log of outcomes; they are the legal memory of the organization. You should record: (1) the vote counts on the two qualifying questions; (2) the vote count on the overall question; (3) the identification of the conflict between the overall count and the bylaw requirements; and (4) the board's resolution to prioritize the bylaw requirements for this case and adopt the mechanical fix for future cases.

  Do not obscure the error. Writing that "the paper was accepted" without noting the initial rejection email creates a record that contradicts external correspondence, which could cause legal or ethical issues later. Similarly, do not record the personal disputes (e.g., the dissenting editor's metaphysical claims) as facts, but rather record them as points of discussion. The goal is to ensure that a secretary five years from now can understand why the procedure changed without needing to interview the current board.

  ### What Would Change My Mind

  **1. On the Decision/Author:**
  *   **Change Condition:** If the bylaws contain a "statute of limitations" or a clause stating that the Chair's certification of the vote is final and unappealable.
  *   **Weak Step:** My assumption that the bylaws override the Chair's declaration. If the journal operates more on custom than written rule (a common reality in small academia), the "practice" might hold more normative weight than I am granting.

  **2. On the Dissenting Editor:**
  *   **Change Condition:** If the board has no mechanism to enforce decisions (e.g., no legal incorporation, no budget to bind members).
  *   **Weak Step:** My reliance on "participation implies consent." If the editors are volunteers with no contractual obligation, her claim that she is only bound by her own conscience might be practically true, even if philosophically inconsistent.

  **3. On the Chair's Retraction:**
  *   **Change Condition:** If the board votes to forbid the retraction.
  *   **Weak Step:** My assumption that the Chair has independent executive authority. If the Chair is merely a facilitator with no power to act without board approval, she cannot retract the email without a new vote to authorize the correction.

  **4. On the Procedural Fix:**
  *   **Change Condition:** If the board demonstrates that the two criteria (argument and remit) are often in tension such that mechanical application produces absurd results (e.g., accepting a paper that fits the remit but is nonsensical).
  *   **Weak Step:** My belief that the two criteria are independent. If they are actually interdependent in practice, separating them mechanically might break the evaluation process, making Option 1 (holistic vote) superior despite the bylaw conflict.

  **5. On the Minutes:**
  *   **Change Condition:** If recording the error exposes the university to legal liability (e.g., breach of contract with the author).
  *   **Weak Step:** My commitment to transparency. In some administrative contexts, "constructive ambiguity" is preferred to prevent external actors from exploiting internal mistakes. If the risk of litigation is high, a vaguer minute might be the prudent choice.
