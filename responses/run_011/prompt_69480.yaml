      *   *Correction on User's Instinct:* The user says (a) and (b) become trivial. I agree on (a). I disagree slightly on (b) — finite sample variance interacts with the ROC boundary. But broadly, I agree they drop.
      *   *The "Wrong" Thing:* The user assumes the office *must* pick a mathematical criterion. The real answer might be that the office should pick a *process* criterion (g) or a *legal* criterion (c). Or, the thing they are wrong about is the feasibility of causal models in this context. I'll focus on the Causal trap. Causal models require assumptions that cannot be audited statistically. If the statute requires "statistically valid," causal models might fail that prong because the assumptions aren't statistically testable.

