      *   *Let's refine the "Wrong" thing.* The user thinks the Wrinkle makes (d) more urgent. I will argue the Wrinkle makes (d) *more attractive but less viable*. The tension is between scientific purity and administrative defensibility.
      *   *Actually, the thing they are wrong about:* They assume the "impossibility" is the main barrier. The main barrier is the *label validity*. In pretrial, "recidivism" is a proxy for "dangerousness." In disability, "eligibility" is a proxy for "need." If the label is biased, the ROC geometry is garbage. This is related to (f) but distinct. It's about *construct validity*. I'll name this.

