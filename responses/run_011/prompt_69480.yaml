      *   *Wait, one more check on (g).* Level of analysis. If the tool is the score, but the decision is the policy. The statute says "algorithmic decision tools." Usually, that includes the logic. If the logic includes the threshold, (c) and (g) merge. I should distinguish them. (c) is about *different* thresholds for groups. (g) is about assessing the *whole pipeline* vs just the score. (g) is broader. (c) is a specific intervention within (g). I'll make (g) the framing and (c) the specific mechanism. Actually, (f) Measurability is more fundamental. If you can't measure it, you can't assess the level of analysis.
