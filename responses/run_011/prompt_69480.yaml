      *   *User's Instinct:* Renders (a) and (b) trivial. Leaves (c), (e), (g) live. Makes (d) more urgent.
      *   *My Assessment of the Instinct:*
          *   (a) becomes largely settled *mathematically*, but the *legal/policy* implication remains (is it fair to rely on base rates?). So not totally trivial, but the research question shifts from "is it possible?" to "is it permissible?"
          *   (b) Finite sample is still relevant because ROC estimates *are* noisy. But if the theoretical bound is tight, the finite sample variance matters less than the structural constraint. So (b) drops in priority.
          *   (c) Becomes crucial. If the math says "you must trade off," the only way out is changing the rule structure (e.g., group-specific thresholds). This moves the debate to legality/fairness of group-specific treatment.
          *   (d) Becomes critical. If predictive parity is mathematically constrained by base rates, causal definitions might offer an escape hatch, *but* they introduce model dependence.
          *   (e) Social choice is interesting but might be too abstract for a state office needing audit criteria.
