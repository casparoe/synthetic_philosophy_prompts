  5.  **Develop the Agenda (Iterative Process):**

      *   *Top Priority:* Needs to address the "what do we audit?" question directly.
      *   *Candidate (c) Group-dependent thresholds:* If the math says you can't have it all with one threshold, can you have it with two? This is the most direct operational workaround to the impossibility theorems. It shifts the fight from math to law (equal protection vs. equity). The lawyer hire is key here.
      *   *Candidate (f) Measurability:* If the criterion is theoretically sound but empirically unestimable due to censoring (e.g., we don't know recidivism for those detained), it's useless for auditing. This is a hard constraint on the office's mission.
      *   *Candidate (g) Level of Analysis:* Focusing on the score might be a category error. The statute regulates the *tool*, but the harm comes from the *decision*. If the decision process (budget constraints, triage) mitigates the statistical conflict, that's huge.

