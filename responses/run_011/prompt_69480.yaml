      *   (d) Causal/Counterfactual criteria: Dissolves impossibility vs. Moves contestability upstream.
      *   (e) Aggregation/Social Choice: Arrow-flavored obstruction to combining criteria.
      *   (f) Measurability/Estimability: Proxy labels, missing outcomes, privacy.
      *   (g) Level of Analysis: Score vs. Downstream Decision Procedure.

