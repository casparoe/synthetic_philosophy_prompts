answer: |-
  You have stumbled onto the very friction that makes the Extended Mind Thesis (EMT) philosophically juicy but journalistically difficult. Your intuitions are not betraying you; they are revealing that Clark and Chalmers' original 'parity principle'—if it does the same job, it counts—is too blunt an instrument. It captures the notebook but slices off the nuances of agency and trust that actually matter to us.

  Based on your verdicts, the principle underneath is not functional equivalence, but what I shall call the **Principle of Transparent Endorsement**. It suggests that external items become part of the mind only when they are coupled so tightly that they withdraw from attention, provided you retain authorship over their content and they possess no agency of their own.

  Here are the precise clauses, mapped to your cases:

  **Clause 1: Immediate Accessibility (The 'Ready-to-Hand' Test)**
  The resource must be available without deliberate retrieval protocols. It must be ambient or habitual.
  *   **Work:** Your whiteboard (glanced at without deciding) passes. Your notes app (unused for eight months) fails. It is archived, not active.
  *   **Work:** Otto's notebook passes (he carries it); a library book would fail.

  **Clause 2: Causal Authorship (The 'Vetting' Test)**
  You must have generated or explicitly vetted the content currently in use. You cannot outsource the *formation* of the belief, only its storage or sensory transmission.
  *   **Work:** Pen-and-paper division passes (you perform the steps). The calculator fails (you outsource the operation).
  *   **Work:** Otto's original notebook passes (he wrote the entries). Otto's tampered notebook fails (he did not endorse the new entries).
  *   **Work:** Your past notes pass (you wrote them). The chatbot fails (it generated the text, even if you trust it).

  **Clause 3: Continuous Coupling (The 'Feedback Loop' Test)**
  The tool must operate within a continuous sensory-motor loop, not as a discrete query-and-response machine.
  *   **Work:** The blind man's stick passes (continuous tactile flow). The cochlear implant passes (continuous audio).
  *   **Work:** The satnav passes (continuous guidance along a route).
  *   **Work:** The calculator fails (discrete input, discrete output).

  **Clause 4: Ontological Singularity (The 'Personhood' Exclusion)**
  No sentient agent with independent goals can be a proper part of your cognitive system, regardless of functional utility.
  *   **Work:** Your wife fails. She is a separate mind, not a module.
  *   **Work:** The chatbot also fails here, arguably, as it simulates agency.

  ### The Casualties

  You asked for straight talk on which verdict must go. To maintain coherence, you must overturn your verdict on the **calculator**.

  Currently, you say pen-and-paper is thinking, but the calculator is outsourcing. Under the Principle of Transparent Endorsement, both actually fail Clause 2 if we are strict (the paper doesn't think, you do), but if pen-and-paper counts because it holds the intermediate steps of *your* logic, the calculator holds the result of *your* logic. The distinction is phenomenological (how it feels), not structural.

  **The Cost:** If you hang onto "Calculator = No" while keeping "Otto = Yes", you are admitting that EMT is actually just the **Extended Memory Thesis**. You are allowing tools to store thoughts, but not to process them. This saves your intuition but cripples the theory. It means the mind can extend into the world only as a warehouse, never as a workshop. For a magazine column, this is a fascinating pivot: it suggests we are willing to let tools remember for us, but never willing to let them *reason* for us.

  The other tension is your wife. If you hang onto "Wife = No", you accept that functionalism has a social limit. This is less costly philosophically but emotionally significant. It preserves human dignity at the expense of logical consistency. I recommend keeping this verdict; readers will revolt if you suggest their spouses are merely appendages.

  ### New Cases

  Let us run the Principle of Transparent Endorsement against two cases your readers will recognise.

  **Case 1: A recipe card pinned to the fridge.**
  *   **Verdict:** Yes, it is part of your cooking mind.
  *   **Reasoning:** It passes Immediate Accessibility (visible while cooking), Causal Authorship (you pinned it, you trust it), and Continuous Coupling (you glance at it repeatedly during the process). It is not a book on a shelf; it is active instruction.
  *   **Bloat Check:** This does not turn the whole cookbook into your mind. Only the page currently open and relied upon counts.

  **Case 2: Asking a stranger for directions.**
  *   **Verdict:** No, this is not part of your mind.
  *   **Reasoning:** It fails Causal Authorship (you did not generate the knowledge) and Ontological Singularity (the stranger is an independent agent). It is a transaction, not an integration.
  *   **Bloat Check:** This prevents the "cognitive bloat" where the entire city becomes your brain. The city contains information, but until you internalise it or map it onto a tool you control (like the satnav), it remains external.

  ### The Bloat Question

  Does this principle turn your bookshelf into a brain? No.
  Most books on your shelf fail Clause 1 (they are not immediately accessible) and Clause 2 (you have not vetted every sentence currently inside them). They are potential mind, not actual mind. They become part of your cognition only when opened, read, and integrated into your current reasoning loop.

  Similarly, half your family does not become part of your mind. Clause 4 protects you there. Your wife remains a partner, not a processor. This distinction is vital. It suggests that the boundary of the mind is not drawn by skin, but by **control and continuity**.

  ### The Unsettling Conclusion

  For your column, the unsettling angle is not that objects are becoming minds, but that we are becoming dependent on objects we refuse to acknowledge as selves. You noted the satnav makes you worse at navigating. This is the price of Transparent Endorsement: when the tool withdraws from attention, so does the skill.

  If you accept the Principle of Transparent Endorsement, you must admit that your mind is already porous. It leaks onto whiteboards and into satnavs. But it stops at the calculator and the spouse. The line is not where biology ends, but where **endorsement** begins. We are not extended into everything we use, only everything we trust enough to stop checking.

  That is the hook: the extended mind is not about gadgets. It is about trust. And if you trust a chatbot more than your recall, but refuse to call it 'you', you are living a contradiction. Either the chatbot is a tool (and thus part of the mind under Clause 2 if you vet its output) or it is an agent (and thus excluded under Clause 4). You cannot have it both ways.

  For the piece, I would suggest leaning into the Calculator casualty. It allows you to challenge the readers: if Otto's notebook is him, why isn't the calculator? Is it because calculation feels like 'thinking' in a way navigation doesn't? That feeling might be the last defence of a human exceptionalism that the rest of your verdicts have already dismantled.

  Write it sharp. The train ride is short.
