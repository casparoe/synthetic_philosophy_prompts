  ### Instrumentation & Operationalizability Flag

  *Per your request regarding measurement procedures:*

  **Paragraph 2:** *"the entire brain is used as a proxy for the cortex because it's easier to test at the bedside."*
  *   **Flag:** This touches on operationalizability. While true that brainstem reflexes are easier to measure than "consciousness," the Higher-Brain standard lacks a validated bedside measurement protocol for *permanent* loss of consciousness that distinguishes reliably from locked-in syndrome or minimally conscious states without advanced imaging (fMRI/PET) which are not bedside protocols.
  *   **Implication:** If you were writing a protocol, the Higher-Brain standard fails the "measurement procedure" test in a way the Whole-Brain (apnea test, reflexes, EEG/flow) does not. The student glosses over this measurement error risk.

  **Paragraph 4:** *"after five minutes there's no auto-resuscitation to worry about."*
  *   **Flag:** This is operationally sound (Lazarus phenomenon window is typically <5 mins). However, the prompt stipulates ECMO can restore viability within 20 minutes. The operational definition of death here relies on a *time window* (5 mins) rather than a *physiological state* (no flow). This is a protocol constraint, not a biological constant. The student treats it as a biological fact ("no auto-resuscitation"), but it is a policy cutoff.

