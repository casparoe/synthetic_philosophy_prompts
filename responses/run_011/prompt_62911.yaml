answer: |-
  Here is the session plan. It is designed to be tight, aggressive on the distinctions, and defensive against the specific intuitions your students bring.

  ### 1. The Order of Pieces
  You cannot start with relativity. If you start with physics, they will treat "real" as a physical variable rather than an ontological commitment. You need to lock down the ontology first, then introduce the physics as a constraint.

  *   **0–5 mins: The "Real" Predicate (Ontology before Physics).**
      Do not use the word "ontology." Use the **"Truthmaker" test**.
      *   Ask: "If the Sun exploded four minutes ago, but the light hasn't reached us, did the explosion *happen*?" (They will say yes.)
      *   Ask: "Is that explosion part of reality *right now*, or only when we see it?" (They will say now.)
      *   **The Pin:** Establish that **Real $\neq$ Observed**. "Real" means "fixed enough to make statements about it true." This pre-empts the "seeing vs. happening" misconception before it arises. If you don't do this, SR becomes a story about light delay, and you lose the argument.
  *   **5–15 mins: The Geometry of "Now" (Physics without Math).**
      Refresh the Minkowski diagram but treat it as a map of "simultaneity slices."
      *   Draw a vertical line (Stationary Observer). Draw their horizontal "Now" slice.
      *   Draw a tilted line (Moving Observer). Draw their tilted "Now" slice.
      *   **Crucial Move:** Do not calculate $\gamma$. Show that *any* motion tilts the slice. Emphasize that the *angle* depends on speed, but the *consequence* depends on distance.
  *   **15–35 mins: The Squeeze (The Argument).**
      Run the Rietdijk–Putnam disjunction.
      *   Set up the scenario.
      *   Show that Observer A's "Real Now" includes Event X, while Observer B's "Real Now" excludes it (places it in the future).
      *   **The Fork:** Either (1) Reality is different for A and B (Frame-Relative Reality), or (2) Event X is real for both, just at different coordinates (Block Universe).
      *   Force them to feel the cost of Option 1. (e.g., "Is the explosion real for Alice but not for Bob?")
  *   **35–45 mins: Misconception Management.**
      Address the objections (see below).
  *   **45–50 mins: Closing Probe.**
      The accelerating observer test.

  ### 2. The Example
  **Use Andromeda.** Do not switch it.
  You are right to be wary: students dismiss it as a "big number artifact." However, there is no local example that works with walking speeds. If you use London/New York with walking speeds, the time difference is femtoseconds. Students will treat that as "negligible" and therefore "not real." You need the magnitude to make the consequence visceral.

  **How to inoculate against the "Parlor Trick" objection:**
  *   **The Setup:** Alice and Bob pass each other on the street. Alice walks toward Andromeda; Bob walks away.
  *   **The Defense:** Explicitly state: *"You might think this only matters because Andromeda is far away. It doesn't. The geometry is the same for the coffee cup on your desk. The distance just makes the time-gap large enough to talk about. If reality is frame-relative at 2 million light-years, it is frame-relative at 2 meters. We use Andromeda only to make the effect visible, not to create it."*
  *   **What the case must have:** Two observers in relative motion (even slow); one distant event spacelike separated from the meeting point.
  *   **What it must lack:** Do not mention aliens, fleets, or decisions. Just "An event occurs in Andromeda." Keep it mundane (e.g., a star flares). If you make it about human decisions, you invite the Free Will objection too early.

  ### 3. The Misconceptions
  Here is the order they will appear, and where you kill them.

  1.  **Seeing vs. Happening (Minute 5).**
      *   *When:* During the "Real" Predicate setup.
      *   *Fix:* The Sun explosion test. If they conflate these here, stop and do not move to SR.
  2.  **Needs Near-Light Speeds (Minute 10).**
      *   *When:* During the Geometry setup.
      *   *Fix:* Show the tilt on the diagram. "The tilt exists at walking speed. It is small, but it is not zero."
  3.  **Simultaneity is Just a Convention (Minute 30).**
      *   *When:* During The Squeeze. This is the most dangerous objection because it dissolves the argument.
      *   *Fix:* Distinguish *coordinate* convention from *causal* structure. "We can name the time coordinates whatever we like, but we cannot convention away the fact that Alice and Bob disagree on which events are causally connectable to their 'now'. The disagreement is physical, not linguistic."
  4.  **Block Universe $\rightarrow$ Fatalism/Free Will (Minute 40).**
      *   *When:* Post-argument.
      *   *Fix:* **Let this stand.** Do not fight it in depth. Acknowledge it: "This seems to threaten free will." Then park it: "That is a separate problem about *agency*, not *existence*. We are solving existence today. Don't confuse 'fixed' with 'coerced'." (See *Interstellar* note below).
  5.  **"The future exists so it can't be changed" (Minute 40).**
      *   *When:* With Fatalism.
      *   *Fix:* This is a category error. "Changing" implies a second time dimension (time-time). In the block, things don't change; they just *are* at different coordinates.

  **The *Interstellar* Correction:**
  Somewhere in the Fatalism section, you must say: *"The Block Universe is not time travel. In Interstellar, they fly to the future. In the Block, the future is already there, you don't need to fly to it. You are already there, just as much as you are 'here'."*

  ### 4. What to Refuse to Cover
  You must draw a hard boundary or you will run out of time.

  *   **Drop Cold:** **The Conventionality of Simultaneity.** (Reichenbach). If you open this door, the argument vanishes into technical weeds.
  *   **Drop Cold:** **Presentist Replies.** (e.g., Neo-Lorentzianism). This is a "Time and Reality" option, not a "Defenses of Presentism" seminar.
  *   **Drop Cold:** **General Relativity / Cosmological Time.**
  *   **The One That Will Get Asked:** **General Relativity.** (Someone always asks: "But what about gravity/curvature?")
  *   **The One-Sentence Answer:** *"GR complicates how we slice the universe, but it does not restore a universal 'Now'; the local problem for presentism remains."*

  ### 5. The Closing Question
  Your idea of the accelerating observer is the correct probe. It tests whether they understand the *disjunction* or just memorized the slogan.

  **The Question:**
  *"Alice walks past Bob. She decides to turn around and walk back. When she turns, does the reality of Andromeda change for her?"*

  **What a Bad Answer Sounds Like:**
  *"Yes, because her frame changed, so what is real changed."*
  (Why it's bad: This accepts Frame-Relative Reality, which implies reality flickers in and out of existence based on velocity. It misses the point that this is the *unpalatable* horn of the dilemma.)

  **What a Good Answer Sounds Like:**
  *"No, reality doesn't change. Her 'slice' of reality changes. That implies the whole block must exist for her to slice different parts of it."*
  (Why it's good: It shows they see the Block as the solution to the absurdity of the alternative.)

  **Alternative Probe (if you want to avoid acceleration):**
  *"If Presentism is true, whose 'Now' is the correct one? Alice's or Bob's?"*
  *   **Bad:** "Alice's, because she's moving toward it." (Misunderstands relativity).
  *   **Good:** "Neither. There is no correct 'Now', which means Presentism is false."
