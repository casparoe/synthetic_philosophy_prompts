prompt: |-
  I cover science and ideas for a national magazine — mostly health and risk, plus the occasional big prediction piece. My problem is not the arithmetic. It's that nearly every number that reaches my desk is a percentage attached to some group of things, and the group almost never gets spelled out, so we end up printing a figure that's technically accurate about a population nobody in the story is a member of. Our existing fact-check rule is basically "is there a study behind it," which is useless here, because the studies are fine and the numbers still mislead.

  I've been told this has a name — the reference class problem, the old point that a single case belongs to indefinitely many classes with different frequencies in each (Venn's consumptive Englishman and whether he lives to sixty-one, and somebody's later rule about using the narrowest class you actually have reliable statistics for). Knowing the name hasn't helped me at 6pm on deadline. So: turn it into a procedure my desk can run. That's me plus one part-time fact-checker who's had a single stats course, no in-house statistician, twenty minutes per claim, and the number either runs or it doesn't — so it has to terminate in a verdict, not a shrug.

  What I want in it:

  - the questions in order, with what counts as an adequate answer to each (starting from something like: who's in the denominator, and who got excluded, and was that exclusion decided before anyone saw results)
  - how to tell a class that was built backwards from a number somebody wanted from one that was chosen for a defensible reason and then happened to produce that number
  - what to do when two classes are both legitimate and give wildly different figures — I'm not willing to just print the bigger one, and I'm not willing to average them either
  - a fallback for when no class is worth trusting: what does the sentence say instead of a percentage
  - the steps that are really judgment calls wearing a procedure costume, flagged as such, so I don't kid myself about how mechanical this is
  - and the one question on the phone that reliably gets a source to concede their class is shaky

  Then run it on three cases:

  1. A carbon-removal startup tells us that of the 40 previous attempts to get direct air capture to its target cost, 3 succeeded, so the base rate is under 8 percent and they intend to beat it. Digging in, maybe fifteen of those 40 were demonstration units funded as research that never had a cost target to hit at all.
  2. An epidemiologist says 12 percent of people infected with a given virus report fatigue a year later. The class is people who sought testing. Meanwhile a survey reports 5 percent of adults generally reporting the same fatigue over the same year. Our graphics desk wants one of those numbers on a chart and I can't decide which.
  3. A think-tank line I ran last spring: one in five first-time founders who take a certain accelerator route end up losing control of their company. The denominator was about sixty organizations in the think tank's own panel, most of whom had signed up because they were already interested in governance. Nobody complained, but if the procedure is any good it should have killed that number before it ran. Tell me what the sentence should have said instead.

  Finally, tell me what the procedure can't do — where a determined source can answer every question honestly and still leave the reader with a false impression, and where the right move is just to print their number with the class stapled to it in the same sentence and let readers do the work. I'd rather know the failure modes up front than discover them in a correction.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas journalist for a national magazine (health, risk, predictions).
      *   **Problem:** Percentages are technically accurate but apply to the wrong reference class (population), misleading readers. Existing fact-checking ("is there a study?") is insufficient.
      *   **Constraint:** Deadline-driven (6pm), limited resources (writer + 1 part-time fact-checker with basic stats), 20 minutes per claim, needs a binary verdict (run/don't run) or a rewrite, not a shrug.
      *   **Goal:** Turn the "Reference Class Problem" into a practical, step-by-step procedure.
      *   **Requirements:**
          *   Ordered questions with adequate answers.
          *   Detection of "backwards-built" classes vs. defensible ones.
          *   Handling conflicting legitimate classes (no averaging, no picking the biggest).
          *   Fallback language when no class is trustworthy.
          *   Flagging subjective judgment calls.
          *   The "one phone question" to shake a source.
          *   Application to three specific cases (Carbon removal, Virus fatigue, Think-tank founders).
          *   Limitations/Failure modes of the procedure.

  2.  **Deconstruct the Reference Class Problem for Journalism:**
      *   The core issue isn't math; it's *relevance*. Is the group being measured actually like the person reading the story?
      *   The procedure needs to be a "Relevance Audit."
      *   It needs to be fast. 20 minutes means 5 questions max, plus a decision tree.

  3.  **Drafting the Procedure (The "Reference Class Audit"):**
      *   *Step 1: Define the Reader.* Who are we writing for? (The "Target Class").
      *   *Step 2: Define the Study Group.* Who was actually counted? (The "Source Class").
      *   *Step 3: The Exclusion Check.* Who was left out, and why? (Pre-registered vs. Post-hoc).
      *   *Step 4: The "Backwards Build" Test.* Did they pick the number first or the group first?
      *   *Step 5: The Conflict Resolution.* If two classes exist, which matches the Target Class?
      *   *Fallback:* Qualitative language.
      *   *The Phone Question:* Needs to be specific and disarming.

      *Refining the Steps for Speed:*
      *   Q1: Who is the "You" in this sentence? (Target)
      *   Q2: Who is the "They" in the data? (Source)
      *   Q3: What's the exclusion criteria? (Pre-specified?)
      *   Q4: Is there a broader/narrower class that changes the number by >50%? (Sensitivity)
      *   *Decision:* Run, Kill, or Rewrite.

      *Refining the "Backwards Build" detection:* Look for "convenience" vs. "protocol."
      *   *Refining the Conflict:* Don't average. Pick the one closest to the *reader's* reality, or state the range.
      *   *Refining the Fallback:* "Rare," "Common," "Some," "Many," or describe the mechanism instead of the rate.
      *   *Refining the Judgment Calls:* Explicitly mark where human intuition overrides the checklist.
      *   *The Phone Question:* "If I changed the denominator to [X], would you still stand by this conclusion?" or "What would make this number go down?" Let's go with: "What is the smallest reasonable group you could put this percentage over that would make the number drop significantly?"

  4.  **Developing the Three Cases:**

      *   *Case 1: Carbon Removal.*
          *   Claim: 3/40 succeeded (<8%).
          *   Issue: 15/40 were research demos, not cost-targeted.
          *   Audit: The "Source Class" includes failures that weren't trying to succeed at *that* metric.
          *   Verdict: Misleading. The denominator is inflated with non-attempts.
          *   Rewrite: Focus on the 25 that actually tried. 3/25 = 12%. Or acknowledge the distinction.

      *   *Case 2: Virus Fatigue.*
          *   Claim A: 12% of tested infected.
          *   Claim B: 5% of general adults.
          *   Issue: Reader is likely "general adult worried about catching virus."
          *   Conflict: 12% is conditional on infection + testing. 5% is background noise.
          *   Resolution: Neither is the risk of *catching and having fatigue*. But for the story context (long covid risk), 12% is the clinical risk, 5% is the baseline.
          *   Decision: Print the 12% *but* contextualize against the 5% baseline immediately. Or, if the story is about "should I worry," the delta (7%) matters.
          *   Actually, the prompt says "Graphics desk wants one number." If the story is about the virus's impact, 12% is the specific risk. If the story is about public health burden, 5% might be more relevant.
          *   *Better approach:* The reader wants to know "If I get it, what happens?" 12% answers that. 5% answers "Do people feel tired anyway?"
          *   *Procedure outcome:* Identify the Target Class (Infected people). 12% matches. 5% is the control. Don't average. Use 12% with a footnote about baseline.

      *   *Case 3: Think-Tank Founders.*
          *   Claim: 1 in 5 lose control.
          *   Issue: Denominator = 60 orgs in panel (self-selected for governance interest).
          *   Audit: Selection bias. They signed up *because* they cared about governance (likely higher risk of conflict or higher scrutiny).
          *   Verdict: Kill the number. It's a biased sample.
          *   Rewrite: "Among founders who prioritize governance structures early..." or "Anecdotal evidence suggests..."

  5.  **Addressing Limitations/Failure Modes:**
      *   Good data, wrong intuition (Base rate neglect).
      *   Causality vs. Correlation (Reference class is right, inference is wrong).
      *   The "Average" trap (The reader isn't average).
      *   When the number is the only hook, even if flawed.

  6.  **Writing the Response:**
      *   Tone: Professional, direct, newsroom-ready. No academic fluff.
      *   Structure:
          1.  The Procedure (The "20-Minute Reference Class Audit").
          2.  The Phone Question.
          3.  The Judgment Flags.
          4.  The Case Studies.
          5.  The Failure Modes.

      *(Self-Correction during drafting)*: Make sure the "Backwards Build" test is actionable. A fact-checker can't read minds. They need to look for *pre-registration* or *methodology sections* that define inclusion criteria *before* results. If the criteria are in the "Discussion" section, it's suspicious.
      *(Refining the "Conflict" rule)*: The prompt says "not willing to average." The rule should be: Pick the class that matches the *reader's* situation, or print the range with labels.
      *(Refining the Fallback)*: "One in five" is still a number. Fallback should be qualitative: "A significant minority," "A small fraction," or describe the *conditions* under which it happens.

      *(Final Polish on the Phone Question)*: It needs to be polite but sharp. "If we changed the denominator to X, does the conclusion hold?" is good. Let's make it: "What is the most generous reasonable denominator you could use that would make this percentage look smaller?" No, that's adversarial. How about: "If I am a reader who does not fit [Exclusion Criteria], does this number apply to me?" Simple.
      *Wait, the prompt asks for the question that gets them to concede the class is shaky.*
      Try: "If you had to bet your own money on this outcome for a person outside this specific group, would you use this percentage?"
      *Better:* "What is the one group you explicitly excluded that, if included, would cut this number in half?"

      *Let's go with:* "If we expanded the denominator to include [obvious exclusion], would you still stand by this headline?"

      *Actually, the best one is:* "What is the reference class for the *reader*?" If the source can't answer that, they don't know.
      *Let's stick to the prompt's request:* "The one question on the phone that reliably gets a source to concede their class is shaky."
      *Idea:* "If you ran this same analysis on [Broader/Standard Population], would the number change?"
      *Idea:* "Did you choose this group because the data was available, or because it was the right group?" (Too accusatory).
      *Idea:* "What is the exclusion criteria?" (Too basic).
      *Winner:* "If I am a member of [General Population], why should I believe this rate applies to me given you excluded [X]?"
      *Let's refine:* "What is the specific exclusion that makes this number higher/lower than the general rate, and is that exclusion relevant to my reader?"
      *Okay, I will formulate the "Killer Question" as:* **"If you added the [excluded group] back into the denominator, would you still make this claim?"**

      *Wait, I need to make sure the procedure fits the 20-minute constraint.*
      Step 1: Identify the Reader (1 min).
      Step 2: Identify the Denominator (3 mins).
      Step 3: The Exclusion Scan (5 mins).
      Step 4: The Alternative Class Check (5 mins).
      Step 5: Verdict (6 mins).

      *Let's finalize the "Backwards Build" check.* Look for "Post-hoc subgroup analysis." If the paper says "We noticed in subgroup X..." that's backwards. If it says "We stratified by X..." that's forwards.

      *Let's finalize the "Conflict" rule.* If Class A (12%) and Class B (5%) are both legitimate: Print the one that matches the *condition* in the headline. If headline is "Virus Risk," use 12% (infected). If headline is "Public Burden," use 5% (population). If unsure, print "12% of infected, compared to 5% baseline."

      *Let's finalize the Fallback.* "Estimates vary," "A minority," "A significant portion." Or describe the *trend* not the *rate*.

      *Okay, ready to write.*
answer: |-
  Here is the **20-Minute Reference Class Audit**. It is designed for a writer and a junior fact-checker. It assumes you have the study or the source on the line. It terminates in a binary decision: **Run**, **Kill**, or **Rewrite**.

  ### The Procedure

  **Step 1: The "You" Test (2 minutes)**
  *   **Question:** Who is the "You" in the headline? (e.g., "You" = an American adult, "You" = a startup founder, "You" = a patient with symptoms).
  *   **Adequate Answer:** A specific demographic or situational description that matches your magazine's readership for this story.
  *   **Fail:** "Everyone," "People," or a vague abstraction.

  **Step 2: The Denominator Scan (5 minutes)**
  *   **Question:** Who is actually in the bottom of the fraction?
  *   **Adequate Answer:** A specific N-value with clear inclusion criteria (e.g., "N=400 patients who tested positive at Clinic X between Jan-Mar").
  *   **Fail:** "Previous attempts," "Companies," "People" (without qualification).
  *   **Action:** Fact-checker circles every exclusion criterion in the methodology.

  **Step 3: The "Pre-Registration" Check (5 minutes)**
  *   **Question:** Was the group defined *before* the data was looked at?
  *   **Adequate Answer:** "Yes, it is in the pre-registered protocol," or "Yes, it is the standard industry cohort."
  *   **Fail:** "We noticed this pattern in the data," or "We selected these because they had complete records."
  *   **Flag:** *Judgment Call.* If the source says "We used available data," you must decide if "available" equals "representative." (See Judgment Flags below).

  **Step 4: The Alternative Class Check (5 minutes)**
  *   **Question:** Is there a broader or narrower legitimate class that changes the percentage by more than 50%?
  *   **Adequate Answer:** "No, the rate is stable across reasonable definitions."
  *   **Fail:** "Yes, if we include [X], the rate drops to [Y]."
  *   **Action:** If **Fail**, you cannot run the number alone. You must use the **Fallback** or the **Conflict Rule**.

  **Step 5: The Verdict (3 minutes)**
  *   **Run:** The "You" matches the Denominator, and exclusions are standard.
  *   **Rewrite:** The number is real but the class is narrow. Use the **Fallback Language**.
  *   **Kill:** The class was built backwards to achieve the number (Step 3 Fail) or the "You" does not match the Denominator at all.

  ---

  ### The Rules for Tricky Situations

  **1. Detecting the "Backwards Build"**
  *   **Green Flag:** Inclusion criteria are in the *Methods* section. The text says "We stratified by..."
  *   **Red Flag:** Inclusion criteria are in the *Discussion* or *Results*. The text says "We observed that..." or "Notably, in the subset of..."
  *   **Rule:** If the definition of the group relies on the outcome (e.g., "successful attempts" where success is defined after the fact), **Kill**.

  **2. Conflicting Legitimate Classes**
  *   **Scenario:** Class A says 12%, Class B says 5%. Both are methodologically sound.
  *   **Rule:** Do not average. Do not pick the bigger one.
  *   **Action:** Pick the class that matches the **Step 1 "You"**.
      *   If the story is about *clinical risk* (You = Infected Patient), run the 12%.
      *   If the story is about *population burden* (You = General Public), run the 5%.
      *   **Constraint:** You must explicitly name the denominator in the sentence. ("12% of *those infected*," not "12% of people").

  **3. The Fallback (When no class is trustworthy)**
  *   If the number fails the audit, replace the percentage with qualitative frequency + mechanism.
  *   **Instead of:** "8% of startups fail."
  *   **Say:** "A small minority of startups fail," or "Failure is common among X, but rare among Y."
  *   **Instead of:** "50% risk reduction."
  *   **Say:** "The treatment significantly lowers risk," or "The benefit is limited to patients with [Specific Marker]."

  **4. The Judgment Flags (Where you are lying to yourself)**
  *   **Flag A:** "Close enough." (The source class is *similar* to the reader class, but not the same). *Procedure:* Treat as **Rewrite**.
  *   **Flag B:** "Expert Consensus." (The source says "Everyone uses this denominator"). *Procedure:* Verify if "everyone" is just one academic silo. If siloed, treat as **Rewrite**.
  *   **Flag C:** "The Trend is Real." (The number is wrong, but the direction is right). *Procedure:* **Kill** the number. Keep the trend description.

  ---

  ### The One Phone Question

  When a source is defensive about their cohort, ask this:

  > **"If we added the [excluded group] back into the denominator, would you still stand by this headline?"**

  *   **Why it works:** It forces them to admit the fragility of the number without accusing them of fraud. If they hesitate or say "Well, the rate would change," they have conceded the class is shaky. If they say "Yes," ask them to justify why the exclusion is irrelevant to the reader.

  ---

  ### Case Studies

  #### Case 1: Carbon-Removal Startup
  *   **Claim:** 3/40 succeeded (<8% base rate).
  *   **Audit:**
      *   **Step 1 (You):** Investors/Industry observers looking for cost-viable tech.
      *   **Step 2 (Denominator):** 40 "attempts."
      *   **Step 3 (Exclusions):** 15/40 were research demos with *no cost target*. They were excluded from "success" but included in "attempts."
      *   **Step 4 (Alternative):** If denominator is only cost-targeted attempts (25), rate is 3/25 = 12%.
  *   **Verdict:** **Rewrite.** The denominator includes non-attempts.
  *   **The Sentence:** "Of the 25 projects that explicitly targeted this cost level, three succeeded. Including research demonstrations that had no cost target, the success rate appears lower."
  *   **Why:** The 8% figure is technically true (3/40) but functionally false (3/25 is the relevant risk).

  #### Case 2: Virus Fatigue
  *   **Claim:** 12% (infected/tested) vs. 5% (general adults).
  *   **Audit:**
      *   **Step 1 (You):** Magazine reader worried about catching the virus.
      *   **Step 2 (Denominator):** Class A = Infected + Tested. Class B = General Population.
      *   **Step 3 (Conflict):** Both are legitimate. Class A measures *sequelae*. Class B measures *background noise*.
      *   **Rule:** Match the "You." If the story is "What happens if I get sick?", Class A is the only valid number. Class B is context.
  *   **Verdict:** **Run (with context).**
  *   **The Sentence:** "12% of confirmed cases report fatigue a year later, compared to a 5% baseline rate in the general population."
  *   **Graphics:** Run the 12% bar, but include a dotted line at 5% labeled "Background Rate." Do not run the 5% as the primary stat; it minimizes the specific viral risk.

  #### Case 3: Think-Tank Founders
  *   **Claim:** 1 in 5 founders lose control.
  *   **Audit:**
      *   **Step 1 (You):** First-time founders considering accelerators.
      *   **Step 2 (Denominator):** 60 orgs in think-tank panel.
      *   **Step 3 (Exclusions/Bias):** Panelists self-selected for interest in governance. This likely correlates with higher friction/control issues.
      *   **Step 4 (Alternative):** No broader data exists, but the sample is biased by design.
  *   **Verdict:** **Kill.** The sample is self-selected for the specific variable being measured (governance conflict).
  *   **The Sentence:** "Anecdotal reports from governance-focused accelerators suggest that losing control is a significant risk for first-time founders, though comprehensive data is lacking."
  *   **Why:** The 20% figure implies a base rate. It is actually a rate within a high-risk subgroup. Printing it as a general stat is malpractice.

  ---

  ### Failure Modes: What This Procedure Cannot Do

  You asked for the limits. Here is where the audit passes, but the reader still gets misled.

  **1. The "Average" Trap**
  *   **Problem:** The reference class is perfect, but the distribution is bimodal. (e.g., "The average startup returns 2x." In reality, 90% return 0, 10% return 20x).
  *   **Why the Audit Fails:** Step 2 and 3 pass. The denominator is correct. The math is correct.
  *   **The Fix:** This requires a distribution check, not a reference class check. If you suspect this, ask for the median, not the mean. The procedure above does not catch this.

  **2. The "Causal" Trap**
  *   **Problem:** The class is right, but the implication is wrong. (e.g., "12% of vaccinated people get infected." True. But if 90% of the population is vaccinated, most *cases* will be vaccinated. This doesn't mean vaccines don't work).
  *   **Why the Audit Fails:** The number is accurate about the class. The *inference* is the lie.
  *   **The Fix:** You must check the counterfactual. The procedure checks the denominator, not the comparator.

  **3. The "Reader Imagination" Gap**
  *   **Problem:** You print "12% of infected people." The reader skims and thinks "12% of people."
  *   **Why the Audit Fails:** You did your job; the reader didn't do theirs.
  *   **The Fix:** This is a layout problem, not a fact-check problem. The number must be visually tethered to the denominator (e.g., bold the word **infected**).

  **4. The "Honest Bias"**
  *   **Problem:** A source answers every question honestly. The class is pre-registered. The exclusions are stated. But the class is still weirdly specific (e.g., "Left-handed men in Ohio").
  *   **Why the Audit Fails:** Sometimes bad science follows good procedure.
  *   **The Fix:** This is where your **Step 1 ("The You Test")** is the only shield. If the class is too weird for the "You," you must use the **Fallback**.

  **Final Advice:**
  The procedure protects you from *lies of omission* (hiding the denominator). It does not protect you from *lies of implication* (what the reader infers). For that, you still need to read the sentence aloud and ask: "If I am a layperson reading this at 7am, what will I think this means?" If the answer isn't exactly what the number says, rewrite.
