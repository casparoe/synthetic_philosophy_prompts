answer: |-
  **Project Title:** Generations as Gauge-Dependent Kinds: A Constraint-Relative Ontology of Cohort Effects

  **Project Summary**
  This project interrogates the ontological status of social generations (e.g., Boomers, Millennials). Existing debates stall between Realists, who claim generations are causal kinds, and Skeptics, who claim they are arbitrary labels. Both sides ignore the mathematical structure of the data used to identify them. In Age-Period-Cohort (APC) analysis, cohort is linearly dependent on age and period ($Cohort = Period - Age$). Consequently, no dataset can identify a cohort effect without an arbitrary normalising constraint chosen by the researcher. I propose a third position: **Constraint-Relative Ontology**. This view holds that generations are not mind-independent natural kinds, nor are they fictions; they are model-dependent entities whose reality is relative to the identification constraints required to make the data intelligible. Over nine months, I will reconstruct standard APC models to locate exactly where these constraints enter, and analyse a live empirical dispute where different constraints yield contradictory generational claims. The outcome will be a rigorous framework for understanding social kinds in the presence of statistical non-identifiability.

  **The Research Question**
  The central question is not "Are generations real?" but: **"What is the ontological status of a cohort effect that is statistically non-identifiable without researcher-imposed constraints?"**

  This is precise enough for a determinate answer and recognisable to sociologists as a problem of practice. Sociologists routinely run APC models to isolate generational change. Philosophers routinely debate natural kinds. This project bridges the gap by asking what kind of object survives the mathematical necessity of underdetermination. It treats the statistical constraint not as a nuisance parameter to be hidden, but as the constitutive act that brings the 'generation' into view.

  **Critique of Existing Positions**
  The project proceeds on the premise that both dominant positions fail to account for the mechanics of measurement.

  The **Realist** argues that cohort effects predict outcomes (e.g., voting behaviour) and thus reflect real causal powers. However, they cannot simply assert that their chosen constraint is "obviously the right one." Because the data are non-identifiable, multiple incompatible constraints fit the data equally well statistically. A Realist who picks a 'smoothing' constraint to find a gentle generational slope and a Skeptic who picks a 'zero-sum' constraint to find none are both statistically valid. The Realist cannot claim discovery when the result is partially constituted by their modelling choice.

  The **Skeptic** argues that non-identifiability proves generations are artifacts of classification. However, they cannot simply claim "non-identifiability implies fiction." If this were true, any variable requiring a reference class (including some physical quantities) would be unreal. Skeptics ignore that constraints are not chosen randomly; they are guided by substantive theory. If the constraint carries theoretical weight, the resulting 'generation' has a stability that mere journalism does not. Dismissing it entirely ignores the pragmatic success of these models in organising social data.

  **Methodology and Work Plan**
  Straight conceptual analysis is insufficient because it ignores the mathematical machinery that produces the concept. Conversely, running new regressions is risky and unnecessary; the philosophical work lies in interpreting existing methods. Therefore, the method combines formal reconstruction with case study analysis.

  *   **Months 1–3: Formal Reconstruction.** I will master the algebra of the APC identification problem. I will reconstruct a standard decomposition method (e.g., the Hierarchical APC model) using simulated data. The goal is to produce a technical appendix showing exactly where the constraint enters the likelihood function and how altering it shifts the estimated cohort coefficients. This ensures I am not relying on secondary descriptions of the statistics.
  *   **Months 4–6: Comparative Case Study.** I will select a live empirical dispute where the same data is interpreted differently. A candidate is the decline in religious attendance: one team may attribute this to a 'Gen Z secular shift' (cohort), another to 'post-2010 cultural change' (period). I will analyse the published models to identify the divergent constraints used. This moves the project from abstract statistics to concrete sociological practice.
  *   **Months 7–9: Synthesis and Drafting.** I will develop the 'Constraint-Relative' account, drawing analogies to gauge-dependent quantities in physics (where potential difference is real, but absolute potential depends on the reference point). I will draft two articles: one for a philosophy of science journal and one for a sociological methods journal.

  **Success and Failure Conditions**
  A successful result demonstrates that the 'generation' is stable *within* a constraint framework but variable *across* them, validating the Constraint-Relative Ontology. It must show that the constraint is a genuine choice, not a mathematical inevitability.

  A genuine failure condition is twofold. First, if it turns out the constraint is mathematically forced by the data structure (e.g., if Bayesian priors fully determine the posterior regardless of the constraint), then there is no 'choice' to analyse, and the third position collapses. Second, if the case study reveals that changing the constraint makes no difference to the substantive interpretation (i.e., the cohort effect is robust to all reasonable constraints), then the non-identifiability problem is philosophically inert for this case. In either scenario, the project would pivot to a critique of why sociologists believe they have identified cohorts when they have not.

  **Scope and Risk Assessment**
  The primary risk is statistical complexity. APC identification involves matrix algebra and likelihood theory that could consume the timeline. To mitigate this, I will not estimate new models but reconstruct published ones using open-source code (R or Stata) provided by the original authors. If the algebra proves intractable, I will limit the formal reconstruction to the geometric intuition of the identification line rather than full derivation.

  The scope is limited to *linear* cohort effects. Non-linear APC methods (e.g., using categorical proxies) avoid the identification problem but introduce other biases. I will explicitly bracket non-linear methods to keep the project finishable. The goal is not to solve the APC problem for sociology, but to clarify the ontological commitments sociologists make when they attempt to solve it.

  **Conclusion**
  This project offers a way out of a stalled debate by shifting focus from the world to the measurement of the world. It respects the Realist's intuition that generations do explanatory work, and the Skeptic's insight that they are constructed, without satisfying either fully. By treating the generation as a constraint-relative entity, the project provides a rigorous vocabulary for social kinds that are neither discovered nor invented, but *operationalised*.
