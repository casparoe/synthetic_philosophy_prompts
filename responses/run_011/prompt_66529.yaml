answer: |-
  ### Model Answer

  **(a)** A1 (perfect mixing) is best classified as a **negligibility assumption**. The authors claim the specific network structure of the ward does not significantly affect transmission dynamics. A2 (closed system) is a **domain assumption**; it delineates the boundary of the system being modelled, asserting no external inputs exist within the specified context. A3 (unsystematic noise) is also a **negligibility assumption**, claiming deviations in hygiene compliance average out.

  Under Friedman's methodology, the falsity of these assumptions is irrelevant provided the predictions are accurate (the F-twist). Musgrave, however, argues that negligibility assumptions are empirically testable claims that a factor is negligible. Therefore, A1 and A3 are vulnerable to factual criticism: if network structure or systematic hygiene variance *does* affect outcomes, the assumptions are false in a way that matters. A2 is vulnerable to factual criticism regarding the system boundary. The F-twist bites only if one accepts predictive success as the sole criterion of merit; Musgrave shows that if the assumption claims negligibility, its falsity undermines the explanation, not just the prediction.

  **(b)** The strongest version of the rejoinder relies on **instrumental scope limitation**. Models are local tools, not universal truths. Just as Newtonian mechanics fails at relativistic speeds without invalidating its use for bridge-building, M fails when the physical topology changes. The authors argue that validation is scope-bound; since the new wing altered the topology, it lies outside the validated domain, leaving the original assumptions intact for the original ward.

  The strongest objection, relying only on stated facts, targets the **mechanism vs. fit distinction**. The model's success relied on A1 (random mixing). The failure upon adding the step-down unit reveals that transmission was never truly random; it was constrained by geometry that happened to align with random mixing predictions in the 40-bed configuration. The objection is that A1 was factually false *during the calibration window*, not just outside it. The "scope" defense conflates the model's *application* with the *truth of its mechanisms*. If the mechanism (mixing) was wrong, the in-sample fit was accidental, not vindicated.

  **(c)** M's in-sample performance exhibits **parasitic fit**. A robust fit would survive the relaxation of idealisations; here, the out-of-sample failure suggests the high R² depended on the specific cancellation of errors between A1 (overestimating connectivity) and A2 (ignoring external reservoirs/structure). The evidence settling this is a counterfactual simulation: if introducing realistic network geometry into the original 40-bed data significantly degrades fit, the fit was parasitic on the false geometry assumption.

  I verdict that the fit was parasitic. The dramatic under-prediction (factor of four) upon minor structural change indicates the original parameters were tuned to compensate for the missing structure. This destroys the rejoinder's entitlement. If the fit is parasitic, the authors cannot claim A1 was "vindicated" in the original ward. They claimed patients transmit *as though* contacts were random. The failure shows they did not; the model merely mimicked the output via error cancellation. Therefore, the assumptions were not valid within the original scope; they were merely lucky. Kovač and Ferreira are wrong to assert the failure casts no doubt on A1; it reveals A1 was never true, only temporarily useful.

  ***

  ### Marking Scheme

  | part | marks | must-hit move | separates A from B because | typical wrong answer |
  | :--- | :--- | :--- | :--- | :--- |
  | (a) | 2 | Classify A1 & A3 as negligibility, A2 as domain. | Shows understanding that boundary conditions differ from causal simplifications. | Treating all three as "false assumptions" without Musgrave's distinctions. |
  | (a) | 3 | Explain F-twist: Friedman ignores falsity if predictions hold; Musgrave tests negligibility claims. | Grasps that Musgrave opens assumptions to empirical testing despite predictive success. | Reciting Friedman's "as if" doctrine without explaining Musgrave's critique of it. |
  | (a) | 3 | Identify specific vulnerability: A1/A3 vulnerable to showing factor *was* significant. | Connects the taxonomy to the specific case details (network structure matters). | Vague statements like "assumptions are always false" without case application. |
  | (b) | 3 | Reconstruct rejoinder charitably: Models have domains of validity (instrumentalism). | Avoids straw-manning the authors; recognises the standard defence of idealisation. | Dismissing the rejoinder immediately as "cheating" without articulating the scope argument. |
  | (b) | 3 | Objection: Mechanism falsity vs. Scope failure. The geometry existed in phase 1. | Distinguishes between "model applied wrongly" and "model mechanism was false all along". | Arguing only that "the model failed so it is bad" (conclusion, not argument). |
  | (b) | 3 | Use case facts: 40-bed ward had geometry too; new wing just exposed it. | Grounds the philosophical objection in the specific empirical details provided. | General philosophical musing without referencing the ward/step-down unit facts. |
  | (c) | 2 | Define parasitic vs. robust fit clearly (error cancellation vs. stability). | Demonstrates ability to operationalise a novel philosophical distinction. | Confusing parasitic fit with overfitting or curve-fitting generally. |
  | (c) | 3 | **Definite verdict** (Parasitic) + Evidence (counterfactual simulation/geometry check). | Follows instruction to avoid hedging; identifies specific empirical test. | Hedging ("It depends on further study") or failing to specify the evidence needed. |
  | (c) | 3 | Link verdict to rejoinder: If parasitic, A1 was never vindicated, rejoinder fails. | Connects the diagnosis of fit back to the evaluation of the authors' defence. | Treating (c) as isolated from (b); failing to explain why the verdict matters for the authors. |

  ***

  ### Poison Pills

  1.  **The Invalid Modus Tollens:** *"Since the model failed out-of-sample, A1 must have been false in-sample."*
      *   **Why it loses marks:** This is a logical error. A model can be valid in one domain and invalid in another (e.g., Newtonian physics). The objection must be that the *mechanism* (geometry) existed in-sample, not merely that the prediction failed later. Students must distinguish between domain limits and latent falsity.
  2.  **The Musgrave Purist:** *"Musgrave shows all idealisations are unacceptable, so Kovač and Ferreira are wrong to use any."*
      *   **Why it loses marks:** Misreads Musgrave. He allows negligibility assumptions if the factor is actually negligible. The critique is not against idealisation per se, but against untested claims of negligibility.
  3.  **The Hedge:** *"Whether the fit is parasitic depends on further data we don't have."*
      *   **Why it loses marks:** Violates the explicit instruction for a definite verdict in (c). The student must weigh the available evidence (the magnitude of failure) to make a philosophical judgment, not defer empiricism.
  4.  **The Friedmanite Shield:** *"Since R² was 0.91 initially, the assumptions are justified regardless of the later failure."*
      *   **Why it loses marks:** Ignores the specific instruction to critique using Musgrave and the parasitic/robust distinction. It recites Friedman 1953 exactly as the question asked students to move beyond.
