      *   **The Control Lens vs. Alignment Lens:**
          *   *Control Win:* The failure was architectural. Even a perfectly "aligned" learner (wanting to be helpful) fails if the input channel is poisoned. Control measures (input sanitization, rate limits) would have stopped this regardless of Tay's "intent."
