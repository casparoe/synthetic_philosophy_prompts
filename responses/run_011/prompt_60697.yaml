answer: |-
  Here is the specification for a theory of aggregation that handles tiny harms across vast populations, followed by the impossibility analysis and scorecard you requested.

  ### Part 1: The Specification Checklist

  This list distinguishes between **Non-Negotiables** (logical or decision-theoretic necessities for a usable policy tool) and **Contested Constraints** (philosophical commitments where different camps diverge). A theory that fails a Non-Negotiable is broken; a theory that fails a Contested Constraint is just controversial.

  #### A. Logic and Consistency (Non-Negotiable)
  1.  **Transitivity (No Money Pumps):**
      *   *Requirement:* If State A is morally preferable to State B, and B to State C, then A must be preferable to C.
      *   *Consideration:* Without this, an agent can be cycled through trades (A→B→C→A) paying a premium each time, ending up worse off. For policy, this means you cannot have circular preferences where "Safety > Cost > Speed > Safety."
  2.  **Description Invariance:**
      *   *Requirement:* The moral verdict cannot change based on how the harm is chunked in time or grouped in space.
      *   *Consideration:* One hour of torture must equal the sum of 3,600 one-second pains. One billion people suffering must equal ten groups of 100 million. If the verdict flips because you changed the unit of account, the theory is measuring the description, not the harm.
  3.  **Probabilistic Equivalence:**
      *   *Requirement:* A certain harm of magnitude $X$ distributed across $N$ people must be evaluated identically to a probability $1/N$ of harm $X$ imposed on a single person (assuming risk-neutrality for the sake of comparison).
      *   *Consideration:* You cannot allow the verdict to depend on whether the problem is framed as "diluted harm" (everyone gets a speck) or "concentrated risk" (one person gets torture with low probability). This prevents framing effects from dictating policy.
  4.  **Determinacy:**
      *   *Requirement:* For any two defined outcomes, the theory must return a verdict (Better, Worse, or Equal).
      *   *Consideration:* "Incommensurable" is not a usable answer for a regulator deciding on a chemical standard. You need a number or a strict ordering.

  #### B. Structure and Scope (Contested Constraints)
  5.  **Continuity (No Sharp Thresholds):**
      *   *Requirement:* Small changes in input (e.g., adding one person, adding one millisecond of pain) should not cause discontinuous jumps in moral value.
      *   *Consideration:* This is the anti-Sorites demand. It forbids a view where 499,999 people getting a headache is permissible, but 500,000 makes it a catastrophe *unless* the 500,000th person crosses a severity line.
  6.  **Non-Lexicality:**
      *   *Requirement:* No harm is infinitely weighty. Every harm has a "price" in terms of other goods that can outweigh it given a large enough scale.
      *   *Consideration:* This forbids the view that "Torture is always worse than any number of specks." It demands that eventually, the specks win, or else the theory cannot handle trade-offs (e.g., banning a life-saving drug because it causes minor irritation).
  7.  **Inter/Intra Symmetry:**
      *   *Requirement:* Harms aggregate across people the same way they aggregate across time within a single life.
      *   *Consideration:* If 10 seconds of pain is worse than 9 for one person, is 10 people getting 1 second worse than 9 people getting 1 second? If the theory says "No" (because persons are separate), it must explain *what* breaks the symmetry (e.g., rights, distinctness) without appealing to magic.
  8.  **Fungibility Explanation:**
      *   *Requirement:* The theory must explain why resources (money, votes, watts) aggregate linearly while harms (pain, irritation) might not, without simply asserting "pain is special."
      *   *Consideration:* A billion pennies buy a house; a billion specks might not equal torture. The theory needs a structural distinction between *instrumental contribution to a threshold* (votes) and *constitutive moral disvalue* (pain).

  #### C. Tractability (Non-Negotiable for Policy)
  9.  **Computability:**
      *   *Requirement:* The function must accept real numbers (population, duration, intensity) and output a comparable value without requiring infinite steps or undefined limits.
      *   *Consideration:* You cannot use a theory that requires summing to infinity or knowing the exact number of future people to make a decision today.

  ---

  ### Part 2: The Impossibility Sketch

  Your suspicion is correct. You cannot satisfy the entire list. Specifically, you cannot hold **Transitivity**, **Continuity**, and **Non-Lexicality** simultaneously in a spectrum case.

  **The Trilemma:**
  1.  **Transitivity:** $A \succ B$ and $B \succ C \implies A \succ C$.
  2.  **Continuity:** There is no single "magic number" of people or "magic millisecond" where value jumps discontinuously.
  3.  **Non-Lexicality:** A sufficiently large number of trivial harms outweighs a severe harm.

  **The Conflict:**
  Construct a spectrum from Torture ($T$) to Speck ($S$).
  Let $T_0$ be Torture. Let $T_1$ be Torture minus 1 second. ... Let $T_n$ be Speck.
  By **Continuity**, $T_0$ is only marginally worse than $T_1$, which is marginally worse than $T_2$. There is no sharp break where $T_k$ is permissible and $T_{k+1}$ is forbidden.
  By **Non-Lexicality**, if we add enough people to $S$ (Speck), the total badness of $N \times S$ outweighs $1 \times T_0$.
  However, if we move step-by-step from $T_0$ to $S$, and at each step the difference is negligible, **Transitivity** forces us to say $T_0$ is roughly equivalent to $S$ in terms of *quality* of harm.
  If $T_0 \approx S$ in quality, then $N \times S$ should outweigh $1 \times T_0$ easily. But our intuition (and the Sorites pressure from the other side) says a googol of specks does *not* outweigh 50 years of agony.
  To stop the googol of specks from winning, you must introduce a **Sharp Threshold** (violating Continuity) or say Torture is **Lexically** worse (violating Non-Lexicality).
  To stop the sharp threshold from being arbitrary, you often have to make preferences **Intransitive** (e.g., $T_0 \succ T_1 \succ \dots \succ S$, but $N \times S \not\succ T_0$).

  **The "Killer" Requirement:**
  **Transitivity.**
  If you insist on Transitivity (which you must for policy to avoid money pumps), you are forced to choose between **Lexicality** (Torture is infinitely bad, which breaks Computability and trade-offs) or **Sharp Thresholds** (which violates Continuity and looks arbitrary).
  Most "moderate" views try to keep Transitivity, Non-Lexicality, and Continuity. This is mathematically impossible in spectrum cases. You have to drop one.
  *   If you drop Transitivity: You solve the paradox but break decision theory (Money Pumps).
  *   If you drop Continuity: You save Transitivity but admit arbitrary cutoffs (e.g., "500,001 people is the limit").
  *   If you drop Non-Lexicality: You save Transitivity and Continuity but lose the ability to trade off severe harms against vast trivial benefits (e.g., you can't ban a dangerous chemical if it causes one person agony, regardless of how many millions it saves from specks).

  ---

  ### Part 3: Scorecard of Contenders

  Here is how four standard approaches score against the Non-Negotiables and the Contested Constraints.

  **1. Plain Cardinal Summing (Total Utilitarianism)**
  *   *Mechanism:* Sum (Intensity $\times$ Duration $\times$ Population).
  *   *Performance:* Passes Transitivity, Description Invariance, Computability, and Probabilistic Equivalence perfectly.
  *   *Failure:* Fails the "Sorites Pressure" (implies a googol of specks outweighs torture). Fails Fungibility Explanation (treats pain exactly like money).
  *   *Verdict:* Logically robust, morally implausible for severe harms. Good for microplastics, bad for torture.

  **2. Lexical/Threshold View (Deontological or Side-Constraint)**
  *   *Mechanism:* Severe harms have infinite or lexicographic weight; trivial harms aggregate only below a threshold.
  *   *Performance:* Solves the "Torture vs. Specks" intuition. Handles Fungibility (rights don't aggregate like cash).
  *   *Failure:* Fails Continuity (sharp cutoff between "severe" and "not severe"). Fails Computability (cannot calculate trade-offs involving the lexical good). Often fails Probabilistic Equivalence (risk of torture vs. certain specks).
  *   *Verdict:* Protects the individual, useless for cost-benefit analysis.

  **3. Intransitive/Spectrum View (e.g., Contextual Betterness)**
  *   *Mechanism:* $A$ is better than $B$ locally, but "better than" is not a transitive relation across long chains.
  *   *Performance:* Solves the Sorites paradox elegantly. Allows Continuity and Non-Lexicality.
  *   *Failure:* Fails Transitivity (Non-Negotiable). Vulnerable to Money Pumps. Cannot be used for policy optimization (you can't maximize an intransitive ordering).
  *   *Verdict:* Philosophically interesting, practically dangerous.

  **4. Severity-Weighted Prioritarianism (Best Current Option)**
  *   *Mechanism:* Harms are aggregated, but weighted by a concave function of severity. A unit of pain at high intensity counts for *more* than a unit of pain at low intensity, non-linearly.
  *   *Performance:* Passes Transitivity and Computability. Handles Fungibility (explains why money sums linearly but pain doesn't—pain has diminishing marginal *tolerance*). Reduces the "Specks > Torture" pressure without banning it entirely.
  *   *Failure:* Still technically implies some number of specks beats torture (Non-Lexicality), though the number becomes astronomically high. Still requires some Continuity violations or extreme weighting to feel right.
  *   *Verdict:* The only workable policy tool. It accepts the mathematical constraints (Transitivity) and bends the weighting function until the results match intuition as closely as possible without breaking the math.

  ### Summary Recommendation
  If you need a principle for the chemical throat-scratch or the notification policy, use **Severity-Weighted Prioritarianism**. It acknowledges that a scratchy throat aggregates, but discounts the moral weight of low-intensity harms relative to high-intensity ones. It won't give you a perfect philosophical shield against the "googol of specks" argument, but it will give you a computable number that doesn't treat a million migraines as equivalent to a million itches, and it won't let you get money-pumped.

  If you insist on **Continuity** (no sharp thresholds) and **Transitivity** (no money pumps), you *must* accept that a sufficiently large number of specks outweighs torture. There is no consistent assignment that keeps all your requirements. You have to decide which intuition breaks: the math or the moral feeling. For policy, break the moral feeling.
