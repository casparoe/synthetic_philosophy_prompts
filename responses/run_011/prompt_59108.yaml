prompt: |-
  I'm on a small team that has to decide whether to believe an interpretability finding before we let it drive a safety decision — things like "the model represents whether the user is a minor" or "there's a direction for sycophancy that the RL stage amplifies." Half of us think claims like that are as real as claims about tables; the other half think they're useful bookkeeping fictions. The problem is the argument never actually gets joined, because nobody on either side can say what would make one of them right.

  So before I wade through more accounts of mental representation, I want the spec. What does a theory of representaion in a neural net have to deliver to count as adequate? Fix the purpose for me like this: it has to make "the model represents X" come out *true* for the findings we'd stake a decision on and *false* for the ones we wouldn't, and false for a better reason than "we couldn't find it."

  Give me the requirements list, each one with the case or consideration behind it. I want the awkward cases covered, at minimum:

  - a direction that decodes some property with high accuracy but where ablation does nothing to behaviour, and it sits in a layer that gets overwritten downstream;
  - a polysemantic unit that fires for cat faces and car fronts — does the model represent cat face, car front, both, neither, or the disjunction?
  - a model that reliably says Rome is in France: for it to be wrong about Rome, it has to represent something falsely, so tell me what has to be true for that;
  - two models with identical behaviour and totally different internals — is one of them misdescribed, or does the theory have to say both are right?
  - a feature that only exists under a particular prompt format or tokenizer choice;
  - something the model demonstrably uses but that nobody can find as a direction, a unit, or a circuit.

  Also the distinctions it's not allowed to collapse (decodable vs. used, representing-that vs. representing-as, whatever else you think matters) and the facts about how these systems are actually built that it can't contradict — superposition, features living in directions rather than neurons, ablations routinely underdelivering, and so on.

  Then the parts I care about most. Which of these requirements are genuinely non-negotiable, and which are one camp's priors wearing a lab coat? I suspect "representations must be causally efficacious" is doing a ton of unearned work — push back if I'm wrong. Which single requirement knocks out the most candidate theories? And if some subset is jointly unsatisfiable — I have a feeling that something like mind-independence plus abundance plus causal efficacy can't all be had at once — show me the tension explicitly rather than hedging, because if the list itself is a no-go result that's the finding.

  End with a short scorecard, one paragraph each, of the obvious contenders: a resemblance/isomorphism account, a causal-role account, a learning-history or teleological one, and a deflationary one that says representation-talk is just a stance we take. Keep that brief, the criteria are where I want the weight.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A small team deciding whether to trust interpretability findings for safety decisions (e.g., "model represents minors," "sycophancy direction").
      *   **Conflict:** Realists (representations are like tables) vs. Instrumentalists (representations are useful fictions).
      *   **Goal:** A specification (requirements list) for a theory of representation in neural nets.
      *   **Core Criterion:** The theory must make "the model represents X" *true* for high-stakes findings and *false* for low-stakes/fragile ones, for a *reason* better than "we couldn't find it."
      *   **Required Edge Cases:**
          1.  Decodable but causally inert (ablation does nothing, overwritten downstream).
          2.  Polysemantic units (cat/car).
          3.  False belief (Rome in France).
          4.  Multiple realizability (same behavior, different internals).
          5.  Implementation dependence (prompt/tokenizer).
          6.  Latent/Undiscovered features (used but not found).
      *   **Required Distinctions:** Decodable vs. Used, Representing-that vs. Representing-as, etc.
      *   **Architectural Constraints:** Must accommodate superposition, distributed features, weak ablations.
      *   **Critical Analysis:** Identify non-negotiables vs. priors. Challenge "causal efficacy." Identify the hardest constraint. Expose tensions (e.g., mind-independence vs. abundance vs. causality).
      *   **Ending:** Scorecard of 4 theories (Isomorphism, Causal-Role, Teleological, Deflationary).
      *   **Tone:** Rigorous, technical, philosophical but grounded in ML engineering reality, direct (no hedging on tensions).

  2.  **Deconstruct the Problem:**
      *   The user wants a *functional specification* for a philosophical theory. They aren't asking for philosophy for philosophy's sake; they need a decision procedure for safety engineering.
      *   The core tension is between *ontological robustness* (is it really there?) and *operational utility* (does it matter for safety?).
      *   Standard philosophical theories of representation (Dretske, Fodor, Millikan) often break on neural nets because NNs are distributed, noisy, and trained via gradient descent, not evolution or explicit symbol manipulation.

  3.  **Drafting the Requirements (The Spec):**
      *   *Requirement 1: Causal/Functional Role.* If it doesn't do anything, is it a representation? The prompt challenges this ("causal efficacy is doing unearned work"). I need to refine this. It shouldn't be "ablation kills it," but "the system relies on it."
      *   *Requirement 2: Content Determinacy.* How do we fix the content? (Cat vs. Car). Needs to handle polysemanticity.
      *   *Requirement 3: Truth/Error Conditions.* How can the model be wrong? (Rome/France). This rules out pure isomorphism.
      *   *Requirement 4: Implementation Independence (Multiple Realizability).* If behavior is same, representation status should ideally be stable, or at least the theory must explain why internals matter more than behavior for safety.
      *   *Requirement 5: Robustness/Stability.* Not dependent on tokenizer quirks.
      *   *Requirement 6: Discoverability vs. Existence.* Just because we can't find it doesn't mean it's not there (for the latent feature case).

      *Refining based on the "Safety Decision" context:* The theory needs to distinguish between *correlates* and *mechanisms*. A direction that decodes "minor" but isn't *used* to treat minors differently is a safety risk only if it *causes* differential treatment. So, causal efficacy *is* important, but "ablation" is the wrong test.

  4.  **Addressing the Edge Cases:**
      *   *Inert Direction:* If ablation does nothing, it's a "readout artifact," not a representation *for the model*. Requirement: The feature must be part of the computational graph leading to the output.
      *   *Polysemanticity:* The representation isn't the neuron; it's the direction/subspace. Content is determined by context or downstream reading.
      *   *False Belief:* Requires a separation between the representation's content and the world's state. Teleological accounts handle this best (function is to track Rome, fails to do so).
      *   *Multiple Realizability:* If behavior is identical, safety risk is identical. But if we care about *internal* safety (e.g., deceptive alignment), internals matter. The theory must allow representation claims to supervene on internals *or* behavior, but consistently.
      *   *Prompt/Tokenizer:* Representations should be robust to superficial changes. If it vanishes with a tokenizer change, it's an artifact, not a representation.
      *   *Undiscovered:* Existence cannot depend on current interpretability tools.

  5.  **Critical Analysis (The "Push Back"):**
      *   *Causal Efficacy:* The user suspects this is overrated. They are right that *ablation* is a bad proxy. But *some* functional role is needed to distinguish a representation from a shadow. I will argue for "Functional Integration" rather than "Ablation Sensitivity."
      *   *Non-Negotiables:* Error conditions (must be able to be wrong) and Functional Integration (must be used).
      *   *The Tension:* Mind-Independence (it's there regardless of us) vs. Abundance (superposition means features are everywhere) vs. Causal Efficacy (strict usage). If features are superposed and abundant, almost everything correlates with something. If we demand strict causality, we miss latent capabilities.
      *   *The Knockout:* The "Error Condition" (Misrepresentation) kills pure Isomorphism/Structural accounts.

  6.  **Developing the Scorecard:**
      *   *Isomorphism:* Good for structure, fails on error (how to be wrong if structure matches?).
      *   *Causal-Role:* Good for usage, fails on content (why *this* content?).
      *   *Teleological:* Good for error and content, hard to define "goal" in gradient descent.
      *   *Deflationary:* Honest, but useless for safety decisions (can't stake a decision on a fiction).

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the stakes.
      *   **The Spec (Requirements):** Numbered, with rationale and edge case mapping.
      *   **The Tensions (Critical Analysis):** Address the "non-negotiables" and the impossibility results.
      *   **The Scorecard:** Brief evaluation of the four theories.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* I initially thought about demanding "neuron independence." But the prompt says "features living in directions rather than neurons." I must ensure the spec respects superposition.
      *   *Correction:* On the "Rome in France" case. A purely behavioral theory can't explain internal error. The theory must locate the error *inside* the net, not just in the output mismatch.
      *   *Correction:* On "Causal Efficacy." The user wants me to push back if they are wrong. I should argue that *some* causal role is non-negotiable for safety, but *ablation* is the wrong measure. The distinction is between "causally involved" and "causally necessary."
      *   *Tension:* The "Latent Feature" case (used but not found) conflicts with "Decodability." If we can't decode it, how do we know it's there? The spec must allow for *potential* decodability or rely on behavioral inference. I will lean towards "Behavioral Signature + Structural Plausibility."

  9.  **Final Polish:** Ensure the tone is professional, direct, and avoids academic fluff. Use the user's terminology ("bookkeeping fictions," "stake a decision"). Make sure the "No-Go" tension is explicit.

  *(Self-Correction on the "No-Go" result)*: Is there a genuine logical contradiction? The tension is usually between *Robustness* (mind-independent) and *Specificity* (content determinacy). If representations are superposed, they are context-dependent. If they are context-dependent, are they mind-independent? I need to articulate this clearly. The "Trilemma" is usually: Robustness, Specificity, Causal Power. You can pick two.

  Let's write it.
answer: |-
  Here is the specification you asked for. It is designed to bridge the gap between metaphysical rigor and engineering safety. It treats "representation" not as a philosophical trophy but as a variable in a risk assessment.

  ### The Specification: Requirements for a Theory of Neural Representation

  To count as adequate for safety-critical decision-making, a theory of representation $T$ must satisfy the following six requirements.

  **1. The Error Condition (Misrepresentation Capability)**
  *   **Requirement:** $T$ must specify conditions under which the model represents $X$ when $X$ is not the case, without relying solely on output mismatch.
  *   **Rationale:** If a model cannot be wrong internally, it does not represent; it merely transduces. For the "Rome in France" case, the theory must locate the error in the internal state (the map), not just the territory mismatch.
  *   **Edge Case Covered:** *Rome in France.* A theory that defines representation purely by successful causal coupling (e.g., "it represents Rome because it causes Rome-outputs") cannot account for false belief. The internal state must have content that is distinct from its truth conditions.

  **2. Functional Integration (Usage over Necessity)**
  *   **Requirement:** $T$ must distinguish between features that are *readable* and features that are *read*. The feature must be part of the computational pathway influencing the relevant output, but ablation need not destroy the behavior if redundancy exists.
  *   **Rationale:** Safety decisions depend on mechanisms, not correlates. If a "minor" direction exists but the model's decision logic bypasses it, intervening on it is futile. However, strict "causal necessity" (ablation kills behavior) is too strong for distributed systems.
  *   **Edge Case Covered:** *Inert Direction.* A direction decoding "minor" with 99% accuracy that is overwritten downstream fails this test. It is a shadow, not a lever.
  *   **Edge Case Covered:** *Undiscovered Features.* If behavior implies a distinction is made (e.g., differential treatment of minors) but no direction is found, $T$ must allow that the representation exists in a form we cannot yet isolate (e.g., high-dimensional superposition), provided the functional role is confirmed.

  **3. Content Determinacy (Polysemanticity Resolution)**
  *   **Requirement:** $T$ must provide a rule for fixing content when a single substrate (neuron/direction) correlates with multiple distinct properties. It cannot simply say "both."
  *   **Rationale:** Safety interventions require specific targets. If you suppress a "cat/car" unit to stop car generation, you might break cat recognition. The theory must explain what determines which content is active in which context.
  *   **Edge Case Covered:** *Polysemantic Unit.* The theory must appeal to downstream context, training objective, or causal role to disambiguate. If it cannot, the claim "this unit represents cars" is ill-formed.

  **4. Implementation Robustness (Multiple Realizability)**
  *   **Requirement:** $T$ must determine whether representation claims supervene on *behavior* or *internals*. If two models behave identically, $T$ must either assign them the same representational status or provide a safety-relevant reason why the internal difference matters.
  *   **Rationale:** If safety depends on internals (e.g., detecting deceptive alignment before it manifests), the theory must privilege internals. If safety depends only on outcomes, it must privilege behavior. It cannot hedge.
  *   **Edge Case Covered:** *Identical Behavior/Different Internals.* If one model uses a "sycophancy circuit" and another uses a "reward-maximization heuristic" to produce the same sycophantic output, are both representing sycophancy? For safety, likely yes (risk is the output), but for alignment, maybe no (one is corrigible, one isn't). $T$ must declare which layer of description counts.

  **5. Architectural Compatibility (Superposition & Distribution)**
  *   **Requirement:** $T$ cannot presuppose localist coding (one neuron = one feature). It must accommodate features as linear directions, subspaces, or nonlinear manifolds within superposition.
  *   **Rationale:** Contradicting the known physics of the system renders the theory useless.
  *   **Edge Case Covered:** *Features in Directions.* The theory must treat a direction in activation space as a valid bearer of content, not just a neuron.
  *   **Edge Case Covered:** *Ablation Underdelivery.* Since ablation often fails due to compensation, $T$ cannot use "survival of ablation" as a necessary condition for representation.

  **6. Stability Under Re-encoding**
  *   **Requirement:** Representational claims must be invariant to superficial changes in input processing (tokenization, prompt formatting) unless those changes alter the semantic task.
  *   **Rationale:** If a "dangerous capability" vanishes when you switch from ChatML to Alpaca format, it was likely an artifact of the interface, not a stable model property.
  *   **Edge Case Covered:** *Prompt/Tokenizer Dependence.* If the feature only exists under one tokenizer, it is not a representation of the world; it is a representation of the tokenizer's quirks.

  ---

  ### Critical Analysis: The Tensions and Non-Negotiables

  You asked which requirements are non-negotiable and where the theory breaks. Here is the breakdown.

  **The Non-Negotiables**
  1.  **The Error Condition:** This is the hardest constraint. If your theory cannot explain how a model is *wrong* about Rome, it is not a theory of representation; it is a theory of correlation. Without this, you cannot distinguish a model that *believes* minors should be protected from a model that merely *outputs* protection text because it correlates with high reward.
  2.  **Functional Integration:** For safety, you must know if the feature is a *cause* of the risk. A decodable direction that the model ignores is not a safety risk; it is a monitoring dashboard. You cannot stake a decision on a correlate.

  **The "Lab Coat" Priors (Negotiable)**
  1.  **Mind-Independence:** The idea that representations exist "out there" in the weights regardless of the interpreter is a realist prior. For safety, you only need *stability*. If the representation is stable across all deployments you care about, it doesn't matter if it's "real" in a metaphysical sense.
  2.  **Strict Causal Efficacy (Ablation):** You are right to suspect this. Demanding that ablating a feature *kills* the behavior is false in overparameterized networks. The requirement must be "causal involvement" (changing the feature changes the probability of the output), not "causal necessity."

  **The Knockout Constraint**
  **The Error Condition** knocks out the most candidate theories. Most simple isomorphism or structural accounts fail here. If representation is just "structure A matches structure B," there is no room for mismatch unless you introduce a normative element (what the structure *ought* to match).

  **The Impossible Trinity (The No-Go Result)**
  There is a genuine tension between **Robustness**, **Specificity**, and **Causal Power**.
  *   **Robustness:** The representation exists regardless of how we look (Mind-Independence).
  *   **Specificity:** The content is determinate (Cat vs. Car, not both).
  *   **Causal Power:** The representation drives the behavior.

  **The Tension:** In superposition, features are highly context-dependent (low Specificity) to maintain high capacity (high Robustness of the system). If you demand high Specificity (this direction *only* means 'sycophancy'), you often find the direction is fragile (low Robustness) or causally weak (low Power) because the model uses a distributed soup to actually do the work.
  *   *If you prioritize Safety (Causal Power):* You must accept that representations are messy, polysemantic, and context-dependent (low Specificity).
  *   *If you prioritize Interpretability (Specificity):* You must accept that the "clean" features you find might be causally inert readouts (low Power).
  *   *If you prioritize Realism (Robustness):* You must accept that you may never isolate the feature cleanly because it is entangled with everything else (low Specificity).

  You cannot have a theory that guarantees clean, isolated, causally necessary, mind-independent features in a modern transformer. If your team demands that, you are demanding a no-go result.

  ---

  ### Scorecard of Contenders

  **1. Resemblance/Isomorphism Account**
  *   **Verdict:** **Fail.**
  *   **Reason:** It maps internal structure to external structure. It handles the "Rome in France" case poorly (if the structure matches the false belief, why is it false?) and struggles with polysemanticity (one structure cannot resemble two disjoint things simultaneously without ambiguity). It treats representations as static pictures, ignoring the dynamic computational role required for safety interventions.

  **2. Causal-Role Account**
  *   **Verdict:** **Pass (with caveats).**
  *   **Reason:** It defines representation by what the state *does* in the network. This aligns well with safety (we care about what drives behavior). It handles the "Inert Direction" case perfectly (if it does nothing, it's not a representation). However, it struggles with Content Determinacy (why does this causal role mean 'minor' and not 'under 18'?) and can be brittle if the causal role shifts slightly with prompt engineering.

  **3. Teleological (Learning History) Account**
  *   **Verdict:** **Strongest Candidate.**
  *   **Reason:** It defines content by what the system was *selected to do* (by gradient descent). This handles Error Conditions naturally (the mechanism failed its function) and Polysemanticity (the function determines the content in context). It is the only account that grounds "sycophancy" as a specific objective failure rather than just a behavioral correlation. The downside: It is hard to operationalize. We don't have a perfect map of the loss landscape's "intent."

  **4. Deflationary (Instrumentalist) Account**
  *   **Verdict:** **Safe but Useless.**
  *   **Reason:** It says representation talk is just a stance we take to predict behavior. This avoids all metaphysical traps. However, it fails your core requirement: it cannot distinguish "real" findings from "useful fictions" in a way that justifies staking a safety decision. If it's all a fiction, you can't intervene on the fiction to fix the reality. It dissolves the problem rather than solving it.
