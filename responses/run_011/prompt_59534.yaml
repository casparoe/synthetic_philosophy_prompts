answer: |-
  You have identified a genuine and widely discussed tension in the philosophy of religion. Your intuition is correct: the folk labels like "special pleading" or "moving the goalposts" are close, but they miss the structural nuance you've observed. The believer isn't necessarily changing the rules mid-game; they are operating with two distinct epistemic (knowledge-related) frameworks that they switch between depending on whether they are defending or asserting.

  Here is the carving of the concept you are looking for, the established terms that nearest fit it, where they fall short, and a precise definition of the pattern itself.

  ### 1. The Established Concepts

  There are two primary concepts in the literature that map onto the two "shelves" you described.

  **A. Skeptical Theism (The Defensive Shelf)**
  The argument that "we are in no position to judge what an all-knowing being would have reason to permit" is formally known as **Skeptical Theism**.
  *   **The Claim:** Human cognitive faculties are limited compared to God's. Just as a child cannot understand why a parent permits a painful vaccination, humans cannot understand why God permits suffering.
  *   **The Function:** It is designed specifically to block the "Evidential Argument from Evil" (the argument that pointless suffering proves God doesn't exist).
  *   **The Departure:** Strict Skeptical Theism actually advises *against* the second move you described. If we truly cannot know God's reasons for the fawn in the fire, consistent skeptical theists argue we should also be hesitant to claim we know God's reasons for a failed marriage. If our cognitive gap is that wide, it should block *all* specific claims about God's intentions, not just the negative ones.

  **B. The Motte-and-Bailey Doctrine (The Tactical Switch)**
  This is a rhetorical concept (coined by Nicholas Shackel) that fits the *movement* between the two shelves.
  *   **The Motte (The Defensible Position):** "God's ways are mysterious; we cannot fully know His mind." (This is hard to attack).
  *   **The Bailey (The Desirable Position):** "God sent this illness to teach John a lesson." (This is useful for community building and comfort, but easy to attack).
  *   **The Departure:** In a classic Motte-and-Bailey, the arguer retreats to the Motte when challenged and returns to the Bailey when safe. Your observation is subtler: the believer claims the Bailey is supported by *independent evidence* (revelation), not just speculation. This makes it more than a simple rhetorical dodge; it is a claim about different *sources* of knowledge.

  ### 2. Does "Revelation" Rescue the Practice?

  You asked whether appealing to scripture or experience resolves the inconsistency or relocates it. In philosophical terms, it **relocates the difficulty** from *Theodicy* (justifying God) to *Epistemology* (how we know things).

  Here is why the inconsistency remains, even with revelation:

  1.  **The Criterion Problem:** If the believer claims they know God's reason for the marriage (via scripture/experience) but not the fawn (via nature), they must explain the **Criterion of Access**. Why does God reveal His reasons in one case and not the other? If the answer is "He chooses," then the believer is admitting they cannot predict when they will have access. This makes their positive claims (the Bailey) lucky guesses rather than reliable knowledge.
  2.  **Hermeneutic Confidence:** To move from "This text exists" to "This text means God caused X," the believer must interpret the text. They apply **Skeptical Theism** to nature (we can't read the book of nature) but **Hermeneutic Confidence** to scripture (we can read the book of scripture). Unless they can explain why human interpretation is fallible for one book but infallible for the other, the asymmetry remains.
  3.  **The "Skeptical Theism Dilemma":** Philosophers like Michael Bergmann and William Alston have debated this. The dilemma is: If Skeptical Theism is true (we can't know God's reasons), it undermines the very basis for believing revelation *is* from God. If we can't judge whether suffering is pointless, we also can't judge whether a religious experience is genuinely divine or a delusion. Using skepticism to block evil while using confidence to validate revelation is logically unstable.

  ### 3. Defining the Pattern: Asymmetric Epistemic Humility

  Since no single existing term captures the specific *structural asymmetry* you described (where humility acts as a shield but not a constraint), I will name and define it for you as requested.

  **Name:** **Asymmetric Epistemic Humility** (or **Tactical Epistemic Humility**)

  **Definition:**
  A dialectical pattern in which an agent invokes cognitive limitation to immunize a belief against negative evidence, while simultaneously invoking cognitive access to assert positive claims about the same subject, without providing a consistent criterion for when limitation applies and when access applies.

  **The Edges (Conditions for the Pattern):**
  1.  **The Subject:** The pattern must concern a single agent or system (e.g., God, The Market, The Party) whose internal logic is claimed to be complex or hidden.
  2.  **The Defensive Move:** When confronted with counter-evidence (suffering, failure, contradiction), the agent claims **Epistemic Inaccessibility** ("We cannot know the full plan").
  3.  **The Offensive Move:** When asserting control or meaning (purpose, warning, cause), the agent claims **Epistemic Privilege** ("We know this specific intention").
  4.  **The Lack of Meta-Rule:** The agent cannot provide a rule independent of the conclusion that determines *which* events are accessible and *which* are mysterious. (e.g., "It is mysterious when it looks bad, and accessible when it looks meaningful.")

  ### 4. Non-Religious Applications

  You asked if this pattern turns up outside religion. It is pervasive in secular ideologies where a system is treated as infallible but complex.

  **A. Political Economics (The "Market" as Agent)**
  *   **Defensive:** When a deregulated market crashes, proponents say, "The Market is complex; government intervention would have made it worse. We can't fully predict market corrections." (Epistemic Inaccessibility).
  *   **Offensive:** When the market booms, proponents say, "This boom proves our policies worked. The Market is signaling confidence in our leadership." (Epistemic Privilege).
  *   **The Asymmetry:** The Market is too complex to blame for crashes, but legible enough to credit for booms.

  **B. Psychoanalysis (Freudianism)**
  *   **Defensive:** If a patient denies a repressed desire, the analyst says, "That is resistance. The unconscious hides things from the conscious mind. Your denial proves the desire exists." (Inaccessibility).
  *   **Offensive:** If the patient agrees with an interpretation, the analyst says, "Your insight confirms our theory is correct." (Privilege).
  *   **The Asymmetry:** The patient's mind is inaccessible when it contradicts the theory, but accessible when it supports it.

  **C. Corporate Leadership**
  *   **Defensive:** When a strategic decision fails, leadership says, "The global landscape shifted in unpredictable ways. No one could have foreseen this."
  *   **Offensive:** When a decision succeeds, leadership says, "This was the result of our clear vision and strategic foresight."
  *   **The Asymmetry:** Unpredictable when wrong, foreseeable when right.

  ### 5. Summary of the Carving

  You have not stumbled on a mere logical fallacy; you have identified an **Epistemological Immunization Strategy**.

  *   **Is it Special Pleading?** No, because special pleading implies an arbitrary exception to a rule. Here, the believer claims two different *rules of knowledge* (Natural Theology vs. Revealed Theology).
  *   **Is it Inconsistent?** Logically, only if they claim *all* knowledge of God comes from reason. If they claim *some* comes from revelation, it is logically possible. However, it is **Dialectically Unfair** because it makes their position unfalsifiable. They accept the credit for positive events (via revelation) but refuse the blame for negative events (via mystery).
  *   **The Verdict:** The appeal to revelation does not solve the problem; it merely shifts the burden of proof. The believer must now prove not that "God has reasons," but that "We have a reliable method for distinguishing God's reasons from human guesses." Without that method, **Asymmetric Epistemic Humility** remains a way to insulate belief from reality, not a way to understand it.

  Your analysis is sharper than much of the formal literature, which often gets bogged down in the logic of Skeptical Theism without noticing the tactical switch to Confident Theism in pastoral practice. You have correctly identified that the "humility" is functional, not foundational.
