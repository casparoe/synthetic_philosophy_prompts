answer: |-
  **Joint Statement on the Ontology of Mechanistic Interpretability**

  **A. Agreed Claims**
  1. **The Matched Core is Model-Constrained.** The stability of the matched core across methods and corpora (Finding 1) cannot be explained solely by analyst degrees of freedom or instrument design. The model's weights constrain the solution space sufficiently to force convergence on a subset of directions. (Concedes against Camp I: Convergence is not merely instrumental.)
  2. **No Privileged Total Basis.** The persistent residue and geometric non-alignment across architectures (Findings 1 & 3) demonstrate that no unique, method-neutral basis exists for the full set of activated directions. There is no "God's eye" dictionary for the layer. (Concedes against Camp R: Realism cannot be total.)
  3. **Ablation Underdetermines Ontology.** While ablation confirms functional role (Finding 2), it does not settle whether the vehicle is mind-independent. Reciprocal vindication shows that inconsistent auxiliary models can predict the same behavioral shifts. (Concedes against both: Function does not equal Ontology.)
  4. **Role Stability vs. Vehicle Variability.** Functional categories can be robustly identified across scales and architectures even when no fixed linear map relates their internal vehicles (Finding 3). (Joint observation.)

  **B. Disagreements Table**

  | Disagreement | Camp R Wording | Camp I Wording | Verbal or Substantive? | Assertion Type |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ontological Status** | "The model has a representation of X." | "Ascribing X is predictively useful for behavior." | **Substantive.** R asserts mind-independence; I asserts utility-relative-to-scheme. | That the model has a representation. |
  | **Vehicle Identity** | "This direction is the feature's vehicle." | "This direction is a valid handle for the feature." | **Substantive.** R asserts uniqueness; I asserts relativity to dictionary size/corpus. | That a particular internal direction is its vehicle. |
  | **Discovery Language** | "We discover features in the network." | "We discover features in the network." | **Wholly Verbal.** R means 'uncover pre-existing'; I means 'construct viable'. | That it is the right level of description. |
  | *Leftover after verbal fix* | None, provided 'discover' is qualified as ontological vs. operational. | | | |

  **C. Cruxes**

  **1. The Universal Basis Test (Camp I fears losing)**
  *   **Question:** Is there a linear map between the matched cores of distinct architecture families that preserves activation profiles >99%?
  *   **Test:** Apply Finding 3's battery to five architecture families. Attempt to learn a single rotation matrix aligning the matched core directions across all pairs.
  *   **R Prediction:** Yes, such a map exists (Confidence: 70%). **Falsifier:** No map achieves >90% correlation across three families.
  *   **I Prediction:** No, geometry is architecture-relative (Confidence: 80%). **Falsifier:** A single map aligns all five families with >99% correlation.

  **2. The Residue Consistency Test (Camp R fears losing)**
  *   **Question:** Can the persistent residue (unmatched items) be modeled consistently across methods?
  *   **Test:** Double dictionary size again (4x original). Require auxiliary models for unmatched items to agree on redistribution logic within 5% error.
  *   **R Prediction:** Yes, residue represents complex features awaiting better modeling (Confidence: 60%). **Falsifier:** Inconsistency remains >20% despite 4x data.
  *   **I Prediction:** No, residue is artifact of sparsity constraints (Confidence: 75%). **Falsifier:** Auxiliary models converge on a single redistribution logic.

  **D. A Third Position**
  The view that is realist about roles but anti-realist about vehicles (Role Realism) is a genuine third position, not merely a relabeling. It accepts Finding 3 as evidence that functions are invariant while geometries are not. Camp R should defect to this position if the Universal Basis Test fails, as it preserves the truth-aptness of functional claims without requiring vehicle uniqueness. Camp I need not defect, as Role Realism is compatible with instrumentalism regarding vehicles. The trigger for R's defection is the failure to find a universal linear map across three architecture families.

  **E. Relation to the Older Debate**
  This dispute is a special case of the standing realism/instrumentalism quarrel over mental representations, but the interpretability setting has a structural difference: **perfect intervenability.** Unlike neuroscience, we can patch weights and observe counterfactuals directly. This inconclusiveness of the older debate implies that even with perfect intervention, ontology may remain underdetermined by function. However, the ability to inspect weights directly offers a path to resolution unavailable in philosophy of mind.

  ***

  **Drafter's Note**

  I suspect Camp R signed Claim 2 ("No Privileged Total Basis") under rhetorical pressure; in practice, they will likely argue the "true" basis is simply hidden deeper. My drafting is slanted toward Camp I, as Findings 1 and 3 naturally favor relativity over uniqueness. I take the Universal Basis Test (Crux 1) to be decisive; if geometry is truly architecture-relative, vehicle realism collapses. My reasoning is most likely to have gone wrong in assuming that ablation data (Finding 2) is neutral; both camps agree it confirms their auxiliary models, suggesting the data itself may be theory-laden.
