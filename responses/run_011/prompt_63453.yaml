answer: |-
  **Arthur:** You're asking me to sign off on summing QALYs, Elena. But the staff's calculation rests on a category mistake. Utility is ordinal. It's determined only up to a positive affine transformation for each individual.

  **Elena:** I know the Robbins objection, Arthur. But we aren't measuring abstract utility. We're measuring health states. Time is cardinal. Pain scales are calibrated.

  **Arthur:** Calibrated to whom? If my utility function is $U$ and yours is $V$, you can transform $U$ to $aU + b$ without changing my preferences. Unless we agree on a common zero and a common unit across persons, adding your gain to mine is arithmetic nonsense. It's like adding inches to kilograms.

  **Elena:** It's not nonsense if we treat the QALY as a standardized proxy. We assume a year in a wheelchair is roughly equivalent for you and me. If we reject that, we can't prioritize anything.

  **Arthur:** Precisely. Rejecting it leaves you with no scientific basis for prioritization. You're smuggling a value judgment—that one person's gain equals another's—into a formula that looks like empirical math.

  **Elena:** All policy smuggles value judgments. The question is whether the judgment is coherent. Harsanyi showed that if you accept Pareto efficiency and certain independence axioms behind a veil of ignorance, you *must* maximize the sum of utilities. It's not smuggling; it's derivation.

  **Arthur:** Harsanyi's theorem is a representation result. The utilitarian conclusion is latent in the assumptions. Specifically, the independence axiom imposes the comparability it claims to derive. You're assuming what you need to prove.

  **Elena:** Even if it's an assumption, isn't it a defensible one? That we should weigh everyone equally? If we don't sum, how do you choose? The Pareto principle doesn't help here. The sixty patients gain huge benefits; the four thousand gain small ones. No one is made worse off by either program individually, but we can't fund both. Pareto is silent.

  **Arthur:** Pareto is silent because there is no unique rational answer. But you're trying to hide the choice behind the compensation criterion. You'll say the four thousand *could* compensate the sixty.

  **Elena:** It provides a ranking without requiring actual transfer.

  **Arthur:** It conceals the interpersonal comparison inside a counterfactual. The compensation never happens. You're still saying the small gains for many outweigh the large gains for few. You've just buried the value judgment under a hypothetical bribe.

  **Elena:** So what do you offer the panel? If summation is out, and Pareto is silent, do we flip a coin?

  **Arthur:** I offer transparency. Admit that choosing the four thousand reflects a prioritarian value judgment, not an empirical finding. Or perhaps a threshold rule: prioritize those below a certain health floor. But don't claim the QALY sum proves it's the *efficient* choice. Efficiency implies a common metric we don't have.

  **Elena:** But comparability might come in degrees. We don't need full cardinality. If the small gains are durable and the large gains are marginal extensions of suffering, maybe we have enough partial information to rank them.

  **Arthur:** Partial comparability still requires an informational basis. What is it? Biological functioning? If the sixty have advanced illness, their capacity to enjoy life might be lower. Summing QALYs ignores that distribution.

  **Elena:** It ignores it because we agreed to weigh life-years equally. But if you deny the sum, you force us to choose based on intuition. Is that better?

  **Arthur:** Intuition is honest. Math is not. If you choose the four thousand, say it's because you value breadth over depth. If you choose the sixty, say it's because you value rescue. But stop calling it cost-effectiveness analysis.

  **Elena:** I concede the label can be misleading. But without the aggregation, we paralysis. We need a working metric. If we normalize the scales—assume the zero point is death and the unit is a healthy year—doesn't that solve the affine problem?

  **Arthur:** It solves it by fiat. You're setting $b$ to zero and $a$ to one for everyone. That's a moral decision, not a measurement.

  **Elena:** Then it's a moral decision we have to make. Harsanyi gives us a framework to make it consistently. You want us to admit the normativity; I want us to structure it.

  **Arthur:** Structuring it as a sum privileges aggregation over distribution. That's the value judgment I'm flagging.

  **Elena:** And ignoring the sum privileges status quo distribution. We're still choosing.

  **Arthur:** Agreed. We're choosing. I just want the appendix to reflect that the choice isn't discovered in the data. It's imposed on it.

  **Elena:** I can write that. But I won't scrap the QALY. It's the best proxy we have for that imposed value.

  **Arthur:** Then write it as a proxy, not a measure.

  ***

  ### Points of Agreement and Irreducible Disagreement

  **Points of Agreement (for the Appendix)**
  1.  **Inevitability of Normative Judgment:** Both agree that selecting between the two proposals cannot be done on purely positive, empirical grounds. Any decision rule incorporates ethical commitments regarding how individual gains are weighed against one another.
  2.  **Limitations of Pareto:** Both agree that the Pareto principle is insufficient for this decision because the proposals affect disjoint groups and resources are constrained; one group's gain necessitates the other's loss.
  3.  **Transparency Requirement:** Both agree that the methodological appendix must explicitly acknowledge that the aggregation method (whether QALY summation or another rule) rests on ethical assumptions rather than purely observational data.
  4.  **Rejection of Hidden Compensation:** Both agree that the compensation criterion (Kaldor-Hicks) should not be presented as actual compensation occurring, but rather as a hypothetical ranking tool that still relies on interpersonal comparisons.

  **Irreducible Disagreements (to be Settled by Policy)**
  1.  **Validity of the Common Scale:** Arthur maintains that normalizing utility scales across persons is a moral fiat that obscures the lack of a common empirical zero-point. Elena maintains that standardized health metrics (like QALYs) provide a sufficient practical proxy for a common scale to justify aggregation.
      *   *Resolution Required:* The panel must decide whether to treat the QALY as an empirical measure of benefit or as an explicit ethical weighting device.
  2.  **Status of Aggregation Axioms:** Arthur argues that Harsanyi-style aggregation assumptions (like independence) impose utilitarianism rather than deriving it from neutral rationality. Elena argues these axioms represent a coherent standard for rational social choice that should be adopted unless rejected for specific ethical reasons.
      *   *Resolution Required:* The panel must determine whether coherence constraints (like those in social choice theory) are binding on their decision-making process or whether distributional concerns should override aggregative consistency.
