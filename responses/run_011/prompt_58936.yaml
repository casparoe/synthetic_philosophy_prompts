  Here is the complete seminar plan. It is designed to be run with zero budget, maximum student agency, and a mathematical trap that forces the updateless intuition without naming it until the reveal.

  # Seminar Session: The Information Hazard
  **Time:** 75 Minutes
  **Students:** 16 (Split into 8 Pairs)
  **Materials:** 32 Index Cards, 8 Pens, 8 d6s, Whiteboard.

  ## 1. The Setup (0:00 – 0:15)
  **Goal:** Establish the "Constitution" (Policy) before the state of the world is known.

  1.  **Seating:** Arrange students into 8 pairs.
  2.  **Role Assignment:** Hand each pair a sealed envelope (or just tell them verbally).
      *   **4 Pairs are "Blind"**: Both students in the pair will *not* see the die roll.
      *   **4 Pairs are "Sighted"**: Both students in the pair *will* see the die roll.
      *   *Note:* Do not let them know which pairs are which yet. Just tell them: "In a moment, I will assign your information status."
  3.  **The Policy (Decision 1):**
      *   Hand every student an index card and a pen.
      *   **Instruction:** "Write down a binding policy for this game. You must write either **STICK** or **SWITCH**. This card represents your disposition. Seal it in an envelope (or fold it tightly and hold it). Do not show it to your partner."
      *   **Constraint:** "If you are assigned 'Blind' status, you *must* play the action written on this card. If you are 'Sighted', you may choose to follow it or deviate based on what you learn."
      *   *Facilitator Note:* Encourage them to write **STICK**. Tell them, "Statistically, coordination pays." (This primes the ex-ante optimal move without forcing it).

  ## 2. The State & Information (0:15 – 0:25)
  **Goal:** Create the asymmetry.

  1.  **Reveal Roles:** Announce which 4 pairs are Blind and which 4 are Sighted.
  2.  **The Roll:** Go to each pair. Roll a d6.
      *   **Roll 1–5 (Likely State):** "State L".
      *   **Roll 6 (Unlikely State):** "State U".
  3.  **Information Distribution:**
      *   **Blind Pairs:** Collect the die immediately. Say nothing. They remain ignorant of the state.
      *   **Sighted Pairs:** Show them the die result. Let them write it down.
  4.  **The Action (Decision 2):**
      *   Hand every student a second index card.
      *   **Instruction:** "Write your final Action: **STICK** or **SWITCH**."
      *   **Blind Students:** Must match their Sealed Policy card. (Check this visibly).
      *   **Sighted Students:** Can write whatever they want.
      *   Collect all Action cards.

  ## 3. The Payoff Structure (Whiteboard) (0:25 – 0:30)
  **Goal:** Reveal the rules *after* decisions are made to prevent gaming the rules, but before scoring.

  Draw this table on the board:

  | Condition | Payoff Per Student |
  | :--- | :--- |
  | **Base Pot** | **100 points** (Awarded if **BOTH** partners play STICK) |
  | **Pot Collapse** | **0 points** (If **EITHER** partner plays SWITCH) |
  | **Defector Bonus** | **+20 points** (Only in **State L**, only if **YOU** play SWITCH) |
  | **Defector Penalty** | **-50 points** (Only in **State U**, only if **YOU** play SWITCH) |

  **Scoring Rule:** "Your Total Score = Base Pot (if earned) + Defector Bonus/Penalty (if applicable)."

  ## 4. Scoring & Results (0:30 – 0:40)
  **Goal:** Reveal the disparity.

  1.  **Open Policies:** Have students open their Sealed Policy cards. (Most should say STICK).
  2.  **Reveal Actions:** Read out the Action cards for each pair.
  3.  **Calculate Scores (Live on Whiteboard):**
      *   **Blind Pairs:**
          *   They *must* Stick.
          *   State L (5/6 chance): Both Stick. Pot = 100. Bonus = 0. **Score: 100.**
          *   State U (1/6 chance): Both Stick. Pot = 100. Bonus = 0. **Score: 100.**
          *   **Average Blind Score: 100.**
      *   **Sighted Pairs:**
          *   **State L (Likely):** Both see State L. Both know the Defector Bonus (+20) is available. Both know that if they Stick while the partner Switches, they get 0.
              *   *Rational Move:* **SWITCH**. (20 is better than 0).
              *   Result: Both Switch. Pot Collapses. Bonus Applied. **Score: 20.**
          *   **State U (Unlikely):** Both see State U. Switching incurs -50 penalty.
              *   *Rational Move:* **STICK**.
              *   Result: Both Stick. Pot Paid. **Score: 100.**
          *   **Average Sighted Score:** $(5/6 \times 20) + (1/6 \times 100) = 16.67 + 16.67 = \mathbf{33.33}$.

  **The Reveal:** "The Blind students averaged 100 points. The Sighted students averaged 33 points. Knowing the truth made you poorer."

  ## 5. The Debrief (0:40 – 1:15)
  **Goal:** Map the game to Updateless Decision Theory (UDT).

  **Phase 1: The Arithmetic of Regret (10 mins)**
  Ask the Sighted students: "In State L, did you make a mistake?"
  *   They will say "No." If they had Stuck while their partner Switched, they would have gotten 0. Switching guaranteed 20.
  *   Ask: "So why did you lose?"
  *   **Key Insight:** They lost because *having the information* changed their policy from "Always Stick" to "Stick unless L".
  *   Write on board: $E[\text{Always Stick}] = 100$. $E[\text{Stick unless L}] = 33$.
  *   **Lesson:** The value of a decision rule is calculated *before* you know which state you are in.

  **Phase 2: The Predictor Problem (10 mins)**
  Ask: "Why didn't the Sighted students just agree to Stick?"
  *   They will say: "Because in State L, Switching was dominant."
  *   **The UDT Pivot:** "In Newcomb's Problem, Omega predicts you. In this game, your *partner* predicted you. You knew your partner was rational. You knew that if State L obtained, they would Switch. Therefore, your 'Stick' action was causally useless in State L."
  *   **The Updateless Move:** To win, you must act as if your decision *logically determines* your partner's decision, even if you know the state. You must say: "I am the kind of agent who Sticks in State L."
  *   If both Sighted students adopted that policy *ex-ante*, they would have gotten 100. But *ex-post*, the information severed the logical link.

  **Phase 3: Naming the View (5 mins)**
  *   Reveal the term: **Updateless Decision Theory (UDT)** or **Functional Decision Theory (FDT)**.
  *   Definition: "Optimize your policy from the perspective of the initial state of information, and do not update on new information if doing so breaks the logical correlation that makes your policy effective."

  ## 6. Troubleshooting & Predictable Failures

  **1. The "Blind" Cheater:**
  *   *Risk:* A Blind student peeks at the die or guesses the state.
  *   *Fix:* Make the "Blind" condition physical. Have them turn their chairs around or wear a paper bag over their head during the roll. Make it a ritual.
  *   *Rule Argument:* "I guessed it was State L!" -> **Ruling:** "If you didn't see the die, you are Blind. Policy is binding."

  **2. The Sighted Coordination Failure:**
  *   *Risk:* In State L, one Sighted student Sticks and the other Switches. The Sticker gets 0, the Switcher gets 20. The Sticker feels cheated.
  *   *Teaching Moment:* This is actually *better* for the lesson. It proves that without a binding policy, the Sighted state is a Prisoner's Dilemma. The Blind state forces Cooperation.
  *   *Correction:* In the debrief, highlight that the Blind students *couldn't* defect, which solved the coordination problem for them.

  **3. The "Policy" Loophole:**
  *   *Risk:* Students write "If State L, Switch" on their Policy card.
  *   *Fix:* The Policy card must be written *before* roles (Blind/Sighted) are assigned, and *before* the roll. It must be a global rule: "Always Stick" or "Always Switch". If they write a conditional policy, invalidate it and force "Always Stick" (the ex-ante optimal).

  ## 7. The Arithmetic Verification (For Your Records)

  **Ex-Ante Expectation (Before Roll, Before Info):**
  *   **Policy: Always Stick**
      *   State L (5/6): Pot 100. Total 100.
      *   State U (1/6): Pot 100. Total 100.
      *   **Expected Value: 100.**
  *   **Policy: Switch in L, Stick in U** (The Sighted Rational Strategy)
      *   State L (5/6): Both Switch. Pot 0. Bonus 20. Total 20.
      *   State U (1/6): Both Stick. Pot 100. Total 100.
      *   **Expected Value:** $(5/6 \times 20) + (1/6 \times 100) = 16.67 + 16.67 = \mathbf{33.33}$.
  *   **Conclusion:** The Sealed Policy (100) is strictly better than the Informed Strategy (33.33).

  **Ex-Post Incentive (For a Sighted Student in State L):**
  *   Assume Partner Switches (because Partner is Rational Sighted).
  *   **If I Stick:** Pot Collapses (due to partner). Score 0.
  *   **If I Switch:** Pot Collapses. Score 20 (Bonus).
  *   **Conclusion:** Defecting is the rational CDT move ex-post.

  **Tension:** The tension holds. The Ex-Ante optimal policy requires you to ignore the information that makes Ex-Post defection rational.

  ## 8. The Big Disanalogy (Be Straight)

  **The Problem:** In this game, the correlation is **social** (your partner is another human). In Newcomb/UDT puzzles, the correlation is **logical/causal** (Omega predicts you, or you are playing against a copy of yourself).

  **What You Must Supply:**
  In the debrief, you must explicitly state: "In this game, the Blind students won because they were *handcuffed*. They couldn't defect. In the real philosophical puzzles, there are no handcuffs. You have to *choose* to be handcuffed by your own reasoning."

  **The Missing Link:**
  The game simulates the *payoff structure* of Updatelessness, but it relies on **enforced commitment** (the Blind rule) rather than **rational commitment**.
  *   **Game:** Blind students win because rules force them to.
  *   **Theory:** Updateless agents win because their *algorithm* forces them to.
  *   **Your Job:** Explain that UDT is the project of building a mind that *voluntarily* acts like the Blind students, even when it has the information of the Sighted ones.

  **What Goes Wrong:**
  Students will argue that the Blind students were "lucky" or "unfairly advantaged."
  **Your Response:** "Life is unfair. The lesson isn't that ignorance is bliss. The lesson is that **decision procedures that condition on evidence can be dominated by decision procedures that don't**, if the evidence breaks the logical correlations your payoff depends on."

  **Final Minute:**
  "Next week, we remove the handcuffs. We ask: Can you be rational enough to blind yourself?"
