      *   **Constraint:** 75-minute session, whiteboard only, index cards, pens, d6s. No money/grades (intrinsic motivation only).
      *   **Core Mechanic:** Students seal a policy *before* knowing their situation. Some get information (outcome revealed), some don't. Informed students should end up worse off if they follow the optimal ex-ante policy, but better off if they defect ex-post. Uninformed students follow the policy.
      *   **Specific Problems to Avoid:** Public flips (reputation effects), bystanders (everyone must decide), obvious rigging (ex-post defection must look rational).
      *   **Deliverables:** Rules, materials, payoff table, scoring procedure, timeline, debrief guide, troubleshooting (what goes wrong), arithmetic verification, and limitations/analogies.
      *   **Key Insight Required:** The tension between ex-ante optimality (sealed policy) and ex-post optimality (informed defection) *is* the lesson.

