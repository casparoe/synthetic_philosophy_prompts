  2. The practice presupposes that death occurs when there is a commitment not to restore circulation, rather than when restoration becomes biologically impossible. This rules out a strictly biological account of irreversibility and strictly presupposes this normative commitment because circulation could physically be restored during the observation window.

  3. The practice presupposes that death is the loss of the capacity for consciousness and breathing, regardless of whether the entire brain or only the brainstem has failed. This rules out a strict anatomical account and sits comfortably with a functionalist account, licensed by the interchangeability of US and UK determinations in clinical literature.

  4. The practice presupposes that the person is dead even while the biological body remains warm and perfused via mechanical support. This rules out a somatic integration account and strictly presupposes this commitment, as the body maintains physiological functions that traditionally signify life.

  5. If biological irreversibility replaced normative irreversibility, donation after circulatory death would become impossible because organs would deteriorate before revival was biologically excluded. Alternatively, abandoning the dead-donor rule would permit removing vital organs from living patients, transforming transplantation into a cause of death rather than a consequence of it.
