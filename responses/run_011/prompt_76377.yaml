answer: |-
  ### The Example: Thermal Expansion of a Constrained Rod

  Consider a solid metal rod of initial length $L_0$. The regularity in question is **linear thermal expansion**: when the temperature of the rod is raised by $\Delta T$, its length increases by $\Delta L$, according to the functional relation $\Delta L = \alpha L_0 \Delta T$, where $\alpha$ is the coefficient of linear expansion specific to the metal.

  This satisfies the quantitative condition (a) as it involves a precise functional dependence ($\Delta L$ on $\Delta T$). It satisfies the agentive condition (b) because we actively apply the heat source and measure the resulting length. To satisfy condition (c), we introduce an **ordinary intervention**: we rigidly clamp both ends of the rod so that it cannot physically lengthen. When we apply the same heat $\Delta T$ to the clamped rod, the regularity fails: $\Delta L = 0$. No miracle occurs; the clamps are ordinary matter, and the failure is reproducible.

  ---

  ### 1. Occasionalist vs. Realist Descriptions

  **The Realist Description**
  The realist about causal powers posits that the metal possesses an intrinsic nature or disposition grounded in its microstructure. This nature includes a **power to expand** when heated.
  *   **When the regularity holds:** The power is present and successfully manifests. The heat activates the disposition, and the rod's length increases.
  *   **When the regularity fails (Clamped):** The realist utilizes the three-way distinction regarding powers.
      1.  *Never Present:* Ruled out, as the rod is the same metal.
      2.  *Destroyed:* Ruled out, as clamping does not alter the metallurgy; if we release the clamps while hot, the rod behaves as expanded metal.
      3.  *Present but Blocked:* This is the realist's choice. The power to expand remains fully present but is **masked** or **counteracted** by the constraining force of the clamps. The power does not vanish; instead, its manifestation is diverted into thermal stress (force exerted on the clamps) rather than spatial extension. The causal power persists through time, enduring from the moment before heating to the moment of maximum temperature.

  **The Occasionalist Description**
  Assuming the ontology of moment-by-moment recreation, the rod at time $t_1$ (cool) and the rod at time $t_2$ (hot) are numerically distinct creations. There is no persisting substrate carrying a power from $t_1$ to $t_2$.
  *   **When the regularity holds:** God, acting according to His settled Custom (*ʿādah*), creates the state of "heat" in the rod at $t_1$ and subsequently creates the state of "greater length" in the rod at $t_2$. The connection is not in the rod but in the sequential order of divine acts.
  *   **When the regularity fails (Clamped):** God creates the state of "heat" in the rod at $t_1$, but at $t_2$, He creates the state of "unchanged length" (perhaps accompanied by a state of "internal tension"). The Custom is context-sensitive: the sequence *Heat $\to$ Extension* applies only when the context is *Unconstrained*. When the context is *Constrained*, the Custom is *Heat $\to$ Tension*. There is no "blocked power" because there is no power persisting to be blocked; there is simply a different divine decision regarding what state to create next.

  **Comparison**
  The realist sees a single enduring entity struggling against constraint; the occasionalist sees two distinct scenarios governed by two distinct rules of divine sequencing. For the realist, the failure is a frustration of an internal principle; for the occasionalist, it is merely a variation in the external pattern of events.

  ---

  ### 2. Empirical Divergence

  Could these two descriptions diverge in anything we might measure? **No.**

  Both accounts must predict the exact same empirical outcomes to be viable descriptions of the same world.
  *   Both predict $\Delta L > 0$ when free.
  *   Both predict $\Delta L = 0$ and Stress $> 0$ when clamped.
  *   Both predict that if the clamp is removed, the rod will snap to the longer length (Realist: the power finally manifests; Occasionalist: God's Custom reverts to the *Heat $\to$ Extension* sequence once the constraint is removed).

  The dispute is confined to the **metaphysical description** of a shared body of regularities. The realist posits "causal powers" as theoretical entities to explain *why* the regularities hold and how they persist through interference. The occasionalist denies these entities, positing that the "why" is found solely in the Will of God, and the "persistence" is an illusion created by the similarity of recreated states.

  One might argue that if the realist claims the power is "present" when clamped, there should be a measurement of that presence. The realist points to the stress on the clamps as the measurement of the blocked power. However, the occasionalist simply accounts for the stress as part of the alternative Custom (*Heat + Clamp $\to$ Stress*). Since every observable manifestation of the "power" can be re-described as a "divine act," there is no empirical test that can isolate a causal power from a divine habit. The distinction is ontological, not observational.

  ---

  ### 3. Mathematical Exactness and the Location of Order

  The regularity $\Delta L = \alpha L_0 \Delta T$ is captured by an exact mathematical form involving a specific constant $\alpha$ (e.g., $23 \times 10^{-6} \text{K}^{-1}$ for aluminum).

  **Where the Occasionalist Locates Exactness**
  For the realist, this exactness resides in the **essence** of the aluminum. The value of $\alpha$ is necessary to what aluminum *is*; it flows from the nature of the substance itself.
  For the occasionalist, this exactness resides in the **specificity of God's Custom**. God chooses to create states in a mathematically precise order. The constancy of $\alpha$ reflects the constancy of God's Will, not the necessity of the metal. The moment-by-moment recreation does not imply randomness; it implies that each new state is created in strict conformity to a pre-established rule of sequence.

  **Does this Concede the Realist's Point?**
  Attributing a precisely structured custom to God does **not** concede the very thing the realist wanted to find in created things, provided we distinguish between **consistency** and **necessity**.

  The realist seeks **intrinsic necessity**: they claim that given the nature of aluminum, it *could not do otherwise* than expand according to $\alpha$ (absent interference). The structure is grounded in the creature.
  The occasionalist offers **extrinsic consistency**: they claim that God *does not do otherwise* than create expansion according to $\alpha$, but He *could*. The structure is grounded in the Creator.

  If the occasionalist admits that God's Custom is mathematically exact, they are admitting that the world is orderly, which the realist also admits. However, they are not admitting that the order is *internal* to the objects. The realist wants the object to be a source of action (*faʿʿāl*). The occasionalist maintains the object is merely a locus of action (*maḥall*).

  By locating the mathematical form in God's habit, the occasionalist preserves the **contingency** of the relation. If $\alpha$ were in the nature of the metal, it would be metaphysically necessary (in the Aristotelian sense). If $\alpha$ is in God's Custom, it remains contingent. The fact that the Custom is *precise* does not make it *necessary*. A scribe may write the same perfect script every day; the precision of the script does not mean the scribe was compelled to write it. Thus, the occasionalist can accept the full mathematical rigor of physics without conceding that created things possess independent causal efficacy. The math describes the habit of the Agent, not the nature of the instrument.
