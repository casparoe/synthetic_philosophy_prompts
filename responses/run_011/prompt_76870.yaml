answer: |-
  Look, we've been walking this corridor for forty years. Taurek says you can't sum claims because persons are separate; the standard rebuttal says if you don't sum, you paralyze the state—no speed limits, no triage protocols, nothing that trades certain costs for statistical lives. The usual move is to grit your teeth and accept some aggregation, or bite the bullet and let the bridge collapse. But that's a false dilemma born of conflating two different moral topologies.

  Here is the line: Taurek's prohibition isn't against math; it's against *overriding* a determinate claim for the sake of another. In the ex post rescue case—the drug shortage, the lifeboat—you face identified individuals with conflicting claims to the same resource. Choosing the five means the one is *sacrificed*; their claim is actively overridden by the count. That determinacy generates a non-comparative duty to give each an equal chance, because the loss is concrete and assigned. But in ex ante policy, there is no "one" to be sacrificed. We aren't weighing David against five strangers; we are weighing a world with higher aggregate risk against a world with lower aggregate risk. Nobody is identified yet. The aggregation here isn't across competing persons, but across possible futures for the *same* persons. Everyone benefits ex ante from a lower probability of harm; no one's specific claim is trumped because no specific claim exists yet. You can maximize expected value in policy because you are minimizing the chance anyone ends up in the rescue case, without violating the rule that once they *are* in the rescue case, numbers don't count.

  Now, the steelman comes in hot: A policy is just a bundle of conditional rescue cases. If you legislate a speed limit to save five statistical lives at the cost of one driver's liberty (or life, via enforcement costs), you have already decided ex ante that the five outweigh the one. When the crash happens, your ex post refusal to aggregate contradicts your ex ante commitment. You can't have it both ways; if aggregation is illegitimate in the instance, it's illegitimate in the bundle, because the bundle is just the instance viewed from a distance.

  The answer isn't to deny the link, but to deny the symmetry. Ex ante, the interests are aligned: the driver and the pedestrians both want a system that minimizes overall risk exposure. The justification is mutual advantage, not sacrifice. Ex post, the interests are opposed: saving the pedestrians requires killing the driver (or vice versa). The mutual advantage evaporates when the risk materializes into a zero-sum conflict. You aren't aggregating claims in the policy; you are aggregating *benefits of risk reduction* which are shared by all potential victims, including the driver. Once the crash occurs, the shared benefit collapses into competing claims, and the Taurekian constraint kicks in. The inconsistency is only apparent if you think policy choices are just pre-enacted rescue choices; they aren't. They are risk-structure choices.

  Verdict: defensible — I find the distinction logically coherent, though I suspect maintaining it requires a moral stamina most institutions simply don't possess.
