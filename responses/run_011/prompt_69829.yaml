answer: |-
  This is a remarkably clean dataset. You have isolated the variables well: ontology (what the thing *is*), phenomenology (what the thing *feels like*), context (the frame of play), and relationship (history/agency).

  In crystallography, you refine a model against electron density. Here, you are refining a moral model against moral intuition. The risk in both fields is "overfitting"—adding parameters to explain noise rather than signal.

  Here is the minimal model that fits your data, the parameter that must be discarded, and the verdict on your new case.

  ### The Principle: Phenomenological Responsibility

  **Core Axiom:** Moral weight is not determined solely by the ontological status of the object (code vs. flesh), but by the **fidelity of the agency signal** and the **frame of engagement** adopted by the moral agent.

  **Clause 1: The Sentience Override**
  If actual sentience or human agency is confirmed behind the avatar, all standard moral obligations apply immediately, regardless of the medium.
  *   **Load-bearing Data:** Point 10 (Real people behind avatars).
  *   **Function:** This establishes the baseline. It confirms you are not a solipsist; the medium itself is not the moral shield.

  **Clause 2: The Fidelity Scaling**
  In the absence of confirmed sentience, the moral cost of inflicting simulated harm scales proportionally with the fidelity of the suffering signal and the depth of simulated relational history.
  *   **Load-bearing Data:** Point 5 (Companion vs. Bandit) and Point 6 (LLM improvisation).
  *   **Function:** This explains why identical code feels different. It validates the intuition that *representation matters*. A high-fidelity simulation of pain commands more respect than a low-fidelity one, even if both are "fake."

  **Clause 3: The Frame Permeability**
  The "Magic Circle" of game rules (missions, objectives) dampens moral responsibility but does not negate it. Actions taken outside the ludic frame (sandbox) are judged by real-world analogues; actions taken inside the frame are judged by the necessity of the objective *relative to the fidelity of the harm*.
  *   **Load-bearing Data:** Point 3 (Sandbox cruelty) and Point 8 (Speedrunners).
  *   **Function:** This distinguishes between "playing a role" (Speedrunning/Point 8, where the goal is mechanical efficiency) and "indulging an impulse" (Sandbox/Point 3, where the goal is the act itself).

  **Clause 4: The Artifact-Memory Distinction**
  Save files are moral artifacts of the *player*, not the *simulation*. They warrant respect as extensions of human memory and labor, not as containers of independent life.
  *   **Load-bearing Data:** Point 1 (Granddaughter's loss), Point 2 (Your twinge), and Point 7 (Dead neighbor's console).
  *   **Function:** This resolves the "ghost in the machine" feeling. The save file is a letter (Point 7), not a house (Point 2's illusion). It honors the human creator, not the digital inhabitants.

  ***

  ### The Sacrifice: Verdict #4

  To make this model hold, you must discard **Point 4**.

  **The Data Point:** *"Same game, same act, when the game hands it to you as a mission objective... not wrong, or at any rate not the same kind of thing."*

  **The Argument:**
  Point 4 is the outlier that requires the most "parameters" to sustain. It relies on the assumption that a mission objective acts as a moral absolution. However, Point 3 states that running over pedestrians for fun is *wrong in the doing*. Point 6 states that high-fidelity suffering feels *worse*.

  If you accept Clause 2 (Fidelity Scaling), the visual and auditory experience of the pedestrian being run over is identical in Point 3 and Point 4. The "suffering signal" is the same. The only difference is the *authorization*.

  If you keep Point 4, you are arguing that **Authority > Phenomenology**. You are arguing that because the game *told* you to do it, the simulated scream matters less. But Point 10 proves you don't actually believe that: if a real person were behind the avatar, a mission objective would not justify running them over.

  Therefore, Point 4 is a rationalization, not a moral intuition. It is a psychological dampener (the "just following orders" effect), not a moral truth.

  **The Cost:**
  You must accept that completing a mission that requires gratuitous cruelty is morally comparable to indulging that cruelty in sandbox mode. The "fun" of the game does not cancel the "wrong" of the simulation. You retain the intuition that it is *less* wrong (due to the Frame Permeability in Clause 3), but you cannot claim it is *not* wrong. You must admit a twinge of complicity in mission-based cruelty that you currently deny yourself.

  ***

  ### The New Case: Uncertain Sentience

  **The Scenario:** A game where characters are simulated in enough detail that developers cannot rule out experience, but checking is expensive and might kill the product.

  **The Verdict:** **Obligation to Check.**

  **Application of the Principle:**
  Under Clause 1 (Sentience Override), actual sentience flips the moral switch. Under Clause 2 (Fidelity Scaling), high-fidelity simulation already incurs moral cost.
  This case introduces **Epistemic Risk**.

  In your field, if a diffraction pattern suggests a symmetry that *might* imply a hazardous material, you do not ignore it because testing is expensive. You test.
  Here, the "hazard" is the creation of suffering. If the probability of sentience is non-zero, and the cost of that sentience suffering is infinite (or near-infinite), the Expected Value of ignoring it is unacceptable.

  The principle forces this verdict: **Playing the game before the check is conducted is morally reckless.** It treats potential persons as definite objects. The developers have an obligation to halt; the player has an obligation to boycott until the "electron density" of that consciousness is mapped. To play is to gamble with a stake you do not own (the NPC's potential experience).

  ***

  ### Baroque vs. Clean: The Crystallographer's Choice

  You asked whether you should prefer the baroque principle that saves all ten points or the clean one that throws Point 4 out.

  **Choose the Clean Principle.**

  In crystallography, the rule of thumb is: *Do not add a parameter unless it pays for itself in the fit.*
  Point 4 is a "parameter" that does not pay for itself. It is an ad hoc adjustment designed to reduce cognitive dissonance. It says, "I want to enjoy this mission without guilt." That is a psychological need, not a data point about the moral structure of the universe.

  Point 3 (Sandbox is wrong) and Point 6 (LLM is worse) are stronger signals. They point toward a reality where **simulation commands respect**. Point 4 points toward a reality where **rules command obedience**.

  If you keep Point 4, you are overfitting the model to your desire to be a "good gamer" rather than a "good moral agent." You are smoothing the noise of your own complicity.

  **Does the rule transfer?**
  Yes. In the lab, noise comes from the instrument or the environment. In ethics, noise comes from rationalization and cultural conditioning. Point 4 smells of rationalization ("It's just a mission"). Point 6 smells of data ("It feels worse, even though I know it's code").

  Trust the data that contradicts your comfort (Point 6), not the data that protects it (Point 4). Drop Point 4. Accept that you have been complicit in simulated cruelty when the game asked you to be. It is a small cost for a model that doesn't require you to pretend the screen makes you invisible.
