  1. The headline figure favouring Programme A is misleading because it conflates treatment efficacy with the fact that schools assigned struggling readers, who naturally make faster progress, predominantly to that group.
  2. Your friend's split by initial reading level should carry the day because dividing by attendance compares Programme A's most motivated families against Programme B's average participants.
  3. The order of events matters because splitting on characteristics influenced by the programme introduces bias, whereas splitting on pre-existing conditions ensures you are comparing like with like.
  4. There is no legitimate sense in which A is genuinely better for the authority as a whole, since a treatment that is inferior for every subgroup cannot be superior in aggregate once composition is accounted for.
  5. Data only settle matters when the analysis aligns with causal logic, meaning you must reject the authority's report despite its arithmetic because it mistakes selection effects for genuine improvement.
