      *   *Point 2: Address the Friend's vs. Authority's split (Pre vs. Post treatment).*
          Your friend is correct to insist on splitting only by pre-existing conditions, as dividing by attendance compares Programme A's most motivated families against Programme B's average participants.
      *   *Point 3: Explain why timing matters (Causal inference).*
          A distinction drawn in June is admissible because it exists before the intervention influences behaviour, whereas a June distinction recorded in September remains valid but a distinction created by the programme itself does not.
          *Critique:* A bit clunky. Let's refine.
          *Refinement:* Timing matters because valid comparisons require groups to be defined before the intervention can influence who belongs to them, ensuring you measure the programme's effect rather than the participants' predispositions.
