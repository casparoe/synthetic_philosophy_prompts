      *   *The Undermining:* Machiavelli's claim that men *cannot* change suggests that only those naturally inclined to caution *can* build dikes. This limits *virtù* to a genetic lottery. *However*, the "dike" metaphor suggests institutionalizing caution so that even an impetuous man might be restrained (laws/orders). But Ch 25 focuses on the man.
      *   *Refinement:* The distinction is between *reacting* to the times (Julius/Case 2) and *modeling* the times (Elena/Case 1). *Virtù* is the cognitive capacity to model Fortune as variable, not just ride it.

