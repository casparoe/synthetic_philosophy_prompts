      *   *Revision:* A CEO who built a reputation on "Unbreakable Security." When a crisis required transparency/admitting fault, his "dike" of secrecy/reputation forced him to double down, leading to collapse. The preparation (reputation for invulnerability) prevented the necessary adaptation.

      *(Self-Correction on The Hard Part)*: Be careful not to smuggle in Christian "free will." Keep it immanent. *Virtù* as *skill in navigation* vs. *skill in boat building*.
      *   Actually, the best interpretation of Ch 25's tension is that *Virtù* is the ability to *vary* one's mode. But Machiavelli says men *can't* vary. So *Virtù* is actually the rare ability to *know* when your mode fits, or to build structures (dikes) that compensate for your mode.
      *   Let's argue that *Virtù* is the **recognition of the limit**. The dike-builder knows he cannot stop the flood, only channel it. The temperament-match man thinks he *is* the flood.

  6.  **Final Polish:** Check the "What they could/couldn't see" sections. Ensure they highlight the epistemic limits of the observer.

      *   *Case 1 (Elena):* See the spend. Can't see the crisis timing.
      *   *Case 2 (Marcus):* See the risk. Can't see the market turn.
