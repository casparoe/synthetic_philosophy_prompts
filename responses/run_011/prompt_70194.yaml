      *   *Okay, I need to be precise.* The "Dike" is specifically against *Fortuna's* violence.
      *   *Final decision:* I will argue that *Virtù* remains as **the capacity to incur short-term costs for long-term optionality**, which requires a cognitive step (anticipation) that pure temperament-matching lacks. Machiavelli's pessimism about human flexibility limits the *pool* of virtuous men, but doesn't erase the distinction between those who plan and those who drift.

