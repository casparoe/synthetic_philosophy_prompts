      *   *The "Second Reason" Problem:* Machiavelli says men can't change because "no one can be found to persuade him to depart from that to which nature inclines him." The Dike-builder *must* persuade himself (or be persuaded by a counselor) to act against immediate profit. If he can't change, he can't build dikes if his nature is impetuous.
