  My dad is 82 and has had dementia for about four years; he's in a care home now. He was a systems engineer, and six years ago he typed up a document, signed and witnessed, saying that if he ever got to where he couldn't recognize me or my sister on two visits in a row, he wanted no antibiotics for pneumonia and no hospital transfer, because he considered that state worse than death. He also made us sit down and re-read it with him every six months — the last time was two months ago and he said it still stands, though I honestly don't think he was following along.

  Now he has pneumonia. The doctor says a ten-day course of antibiotics will clear it up and he'll go back to his baseline, and that if we're all in agreement he'll follow the document either way, so it's on us. That baseline is: he doesn't know who I am, but he's gentle, he laughs, he hums along to records, he holds my daughter's hand and looks for her when she leaves. My sister says we follow the document because that was him when his head was clear. My mom says the document describes a life he never actually saw, and the man in front of us isn't miserable.

  I've been going back and fourth, and I keep thinking of it as a config committed years ago by a previous maintainer for a system that's since been rewritten — it's still in the repo and we're supposed to honor it, but half the assumptions underneath it are gone. Who's right, and is there any way to think about this that isn't just the paperwork versus how the family feels? Give me exactly five numbered points, a sentence or two each, with no intro and no wrap-up at the end.
