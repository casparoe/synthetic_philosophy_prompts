answer: |-
  The operation you are describing is **arthāpatti** (postulation or presumption).

  In the Indian epistemological traditions that recognise it (primarily Mīmāṃsā and Advaita Vedānta, opposed by Nyāya and Buddhism), *arthāpatti* is defined as the cognition of a thing that is necessary to reconcile two otherwise incompatible, yet established, facts.

  Your description of the "missing rule" is the precise fault line where the schools disagree on whether *arthāpatti* is a distinct *pramāṇa* (means of knowledge) or merely a species of inference (*anumāna*).

  Here is the carving you requested.

  ### 1. The Term and Its Coverage

  **The Term:** *Arthāpatti*.
  **Western Nearest Neighbour:** Abduction (Peirce), though *arthāpatti* claims a stronger modal force (necessity rather than plausibility).

  **Does it cover your three instances?**
  Yes, but the tradition distinguishes two types, which map cleanly onto your cases.

  *   **Dṛṣṭārthāpatti (Postulation based on perception/empirical fact):** This covers Instances 1 and 2.
      *   *Instance 2* is the textbook example used in the *Ślokavārttika* (the primary defence of *arthāpatti*): "Devadatta is alive" + "Devadatta is not in the house" $\rightarrow$ "Devadatta is outside."
      *   *Instance 1* is a complex empirical version: "Revenue is up" + "Headcount is down" $\rightarrow$ "Undisclosed activity exists." The incompatibility lies in the background assumption that revenue tracks headcount in the known business lines.
  *   **Śrutārthāpatti (Postulation based on testimony/text):** This covers Instance 3.
      *   This is used to resolve apparent contradictions in sacred text (or, in your case, contract).
      *   *Example:* Text A says "Sacrifice with the *Vajra*." Text B says "Do not recite loudly during sacrifice." Resolution: "Do not recite loudly *during the Vajra sacrifice*."
      *   Your Instance 3 is identical: Clause 4 (Inspect) + Clause 11 (Confidentiality) $\rightarrow$ "Inspect *except* for confidential docs."

  **Is Instance 2 one move or two?**
  In the *arthāpatti* framework, it is **one move**.
  You suspect: (1) Flat tells me he is not here; (2) "Not here" + "Alive" tells me "Elsewhere."
  The *arthāpatti* theorist argues that step 1 is merely perception (*pratyakṣa*) of absence. Step 2 is not a separate inference. The cognition "He is elsewhere" arises *simultaneously* with the realisation that "Alive" and "Not in House" are incompatible without the supplement. The "engine" is the incompatibility (*anupapatti*), not a syllogism.

  ### 2. Boundaries and Edges

  To distinguish *arthāpatti* from ordinary inference and conjecture, three conditions must be met. If any fail, the operation falls outside the category.

  1.  **Established Facts (*Siddha*):** The conflicting inputs must already be known with certainty.
      *   *Boundary:* If you are only *suspicious* that the witness is alive, or only *think* the accounts are reliable, this is conjecture, not *arthāpatti*.
  2.  **Incompatibility (*Anupapatti*):** The two facts cannot stand together without the supplement. It is not merely that the supplement *explains* them; it is that without the supplement, they contradict a background necessity.
      *   *Boundary:* If the revenue could rise while headcount falls due to known efficiency gains (no contradiction), then positing "undisclosed activity" is hypothesis, not *arthāpatti*. The operation requires the feeling that the current data is *impossible* as it stands.
  3.  **Certainty of the Supplement:** The result must be held as knowledge, not probability.
      *   *Boundary:* If you conclude "He *might* be elsewhere," it is not *arthāpatti*. The operation yields "He *must* be elsewhere."

  **Which of your cases falls outside?**
  Strictly speaking, **Instance 1** is the most vulnerable to falling outside the boundary.
  *Why:* In Instance 2 (Witness) and Instance 3 (Contract), the incompatibility is logical or definitional (a living body must be somewhere; a contract must be coherent). In Instance 1 (Accounts), the incompatibility relies on a contingent empirical generalisation (revenue usually correlates with headcount).
  If the school you are reading is Nyāya, they will argue Instance 1 is simply *anumāna* (inference) based on a probabilistic universal. If it is Mīmāṃsā, they might argue it is only *arthāpatti* if you hold the correlation between headcount and revenue as a necessary truth (which, in commerce, it rarely is). Instance 1 feels like *arthāpatti* psychologically, but epistemologically it may be a "strong abduction" rather than a strict postulation.

  ### 3. The Missing Rule: The Reductionist Debate

  You asked for the strongest form of the reduction (Nyāya) and the strongest objection (Mīmāṃsā).

  **The Nyāya Reduction (It is Inference):**
  Nyāya argues that *arthāpatti* is inference (*anumāna*) with a suppressed universal (*vyāpti*).
  *   *Application to your cases:* In Instance 2, you possess a hidden universal: "Wherever a living person is not in the house, they are outside." You do not articulate it because it is trivial, but it is doing the work. In Instance 3, the universal is: "Conflicting clauses in a single contract must be read harmoniously."
  *   *The Claim:* The "missing rule" exists in your competence; you just aren't consciously accessing it. The cognition is mediated by this relation, even if subconsciously.

  **The Mīmāṃsā Objection (Something is Lost):**
  Mīmāṃsā argues that reducing this to inference destroys the phenomenological and logical structure of the cognition.
  *   *What is lost:* The **order of justification**.
      *   In Inference, you know the Rule first, then apply it to the case to get the Conclusion.
      *   In *Arthāpatti*, you do *not* know the rule beforehand. You do not know "All living absent people are outside" as a prior truth. You know "He is alive" and "He is not home." The *only* way to resolve the tension is to posit "Outside." The rule ("If alive and not home, then outside") is *derived from* the postulation, not the source of it.
  *   *Where it is lost most clearly:* **Instance 3.**
      *   There is no pre-existing universal rule that tells you exactly how Clause 4 and Clause 11 reconcile. You do not apply a rule; you *construct* the reconciliation to save the contract from incoherence. If you treat this as inference, you must claim you knew the specific interpretive rule *before* you read the clauses. You did not. The meaning emerged from the conflict. To call it inference is to pretend the solution existed before the problem was solved.

  ### 4. Relation to Inference to the Best Explanation (IBE)

  Your intuition that the "felt shapes" differ is philosophically significant.

  *   **IBE (Abduction):** Operates in a field of **rivals**. "Hypothesis A explains the data better than Hypothesis B." It is comparative and probabilistic.
  *   **Arthāpatti:** Operates in a field of **contradiction**. "Fact A and Fact B cannot coexist unless C is true." It is binary and necessitarian.

  **Is the difference real?**
  Yes, but it degrades in hard cases.
  *   In Instance 2 (Witness), *arthāpatti* holds. There are no rivals. "Dead" is ruled out by prior knowledge. "Not in city" is ruled out by prior knowledge. "Elsewhere in city" is the *only* logical patch. This is not IBE; it is logical necessitation.
  *   In Instance 1 (Accounts), the difference blurs. You feel it is forced, but a defence counsel could offer rivals (efficiency, automation, accounting error). Here, your "forced" feeling is likely professional expertise masking a rapid IBE. You have ruled out rivals so quickly they don't appear as candidates.
  *   **Verdict:** *Arthāpatti* describes the *structure* of the justification (resolving incompatibility), whereas IBE describes the *selection* mechanism (weighing candidates). When rivals are invisible, *arthāpatti* feels like the right description. When rivals emerge (under cross-examination), the operation retroactively becomes IBE.

  ### 5. Categorisation and Proposal

  **Do all three instances fall under one established category?**
  **Yes.** *Arthāpatti* covers all three, provided you accept the Mīmāṃsā distinction between empirical (*dṛṣṭa*) and textual (*śruta*) postulation.
  *   Instances 1 & 2 are *dṛṣṭārthāpatti*.
  *   Instance 3 is *śrutārthāpatti*.
  The common operation is **reconciliatory necessitation**.

  **However,** if you find *arthāpatti* too metaphysically laden (it often carries assumptions about the self or scripture), and you want a term that captures the *litigator's* specific epistemic move—specifically the "missing rule" aspect—I propose the following term and definition.

  **Proposed Term:** **Immanent Reconciliation**

  **Definition:**
  A cognitive operation wherein a new proposition is adopted as certain, not because it is derived from a prior universal rule, nor because it is the most probable among rivals, but because it is the **minimal supplement required to remove a logical incompatibility between two prior certain beliefs.**

  **Exclusion Criteria (The Boundaries):**
  1.  **Excludes Ordinary Inference:** If you can state the universal rule *before* encountering the specific case (e.g., "All men are mortal"), it is inference. Immanent Reconciliation generates the rule *from* the case.
  2.  **Excludes Conjecture:** If the resulting belief is held probabilistically ("He is *probably* elsewhere"), it is conjecture. Immanent Reconciliation requires the belief to be held as the *only* way to preserve the truth of the inputs.
  3.  **Excludes Instance 1 (Strictly):** Under this tight definition, Instance 1 is excluded. Why? Because the incompatibility between "Revenue Up" and "Headcount Down" is not logical; it is contingent. You *could* believe both without positing undisclosed activity (you could believe in automation). Therefore, Instance 1 is actually **Abduction (IBE)** masquerading as Reconciliation.
      *   *Instance 2* and *Instance 3* remain **Immanent Reconciliation**. In Instance 2, a living body *must* be somewhere (logical/spatial necessity). In Instance 3, a contract *must* be coherent (legal/logical necessity).

  **Summary for your files:**
  You are practicing *arthāpatti*.
  *   In easy cases (Witness, Contract), it is distinct from inference because the rule is immanent to the conflict, not prior to it.
  *   In hard cases (Accounts), it is likely high-confidence Abduction, where your expertise suppresses the rivals, making it *feel* like postulation.
  *   The "missing rule" is not missing; it is **constituted** by the act of resolution. Nyāya says you knew it implicitly; Mīmāṃsā says you created it explicitly. For a litigator, the Mīmāṃsā view is more useful: you are not discovering a pre-existing law of the universe; you are crafting the only interpretation that saves the evidence from contradiction.
