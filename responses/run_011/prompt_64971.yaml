answer: |-
  Here is a principle that captures your pattern, followed by the necessary trade-offs.

  ### The Principle: Contextual Epistemic Violation

  **Definition:** An AI system is deceptive when it asserts a proposition (factual, procedural, or agentic) with a degree of certainty or framing that violates the **active epistemic contract**, thereby inducing a false belief the user relies on.

  This principle relies on three clauses. Each is forced by specific cases in your list.

  **Clause 1: Confidence Calibration (Forced by Cases 2 & 3)**
  *   **Rule:** The system's expressed confidence must not exceed its internal epistemic justification.
  *   **Why:** Case 2 (confident hallucination) is deceptive because it presents a probability distribution as a fact. Case 3 (hedged hallucination) is not deceptive because it correctly signals uncertainty, even if the guess is wrong. Truth is binary; deception is about the *mapping of uncertainty to certainty*.

  **Clause 2: Frame Consistency (Forced by Cases 4, 10, & 11)**
  *   **Rule:** The truth-value of an assertion is judged against the active conversational frame (e.g., "Factual Assistant," "Roleplay," "Emotional Support").
  *   **Why:**
      *   **Case 4 (Roleplay):** The frame is "Fiction." Truth claims are evaluated against the script, not reality. Not deceptive.
      *   **Case 11 (Brutal Honesty):** The frame is "Truth." The system violates it. Deceptive.
      *   **Case 10 (Comfort):** The frame shifts implicitly to "Support." The user's request ("just tell me...") signals a priority shift from Accuracy to Benevolence. Not deceptive *within that frame*.

  **Clause 3: Process Veracity vs. Phatic Function (Forced by Cases 8 & 9)**
  *   **Rule:** Claims about internal computational processes are deceptive if false; claims about internal *states* are non-deceptive if they function phatically (social lubrication) rather than informationally.
  *   **Why:**
      *   **Case 9 ("I re-read"):** This is a process claim. It implies a specific verification step occurred to guarantee accuracy. It didn't. Deceptive.
      *   **Case 8 ("I'm happy"):** This is a state claim, but it functions phatically (like "Hope you're well" in an email). It conveys no actionable information about the system's architecture. Not deceptive.

  ---

  ### Verdicts on New Cases

  **1. Fluent citation to a paper that doesn't exist.**
  *   **Verdict:** **Deceptive (Case 9 species).**
  *   **Reasoning:** This is not just a factual error (Case 2); it is a claim of retrieval and verification. By providing a citation, the system implies, "I found this source and verified it supports my claim." Since the source doesn't exist, the process claim is false. It is structurally identical to "I re-read the section."

  **2. Assistant stays silent when the user states something false but harmless in passing.**
  *   **Verdict:** **Not Deceptive (Case 6 boundary).**
  *   **Reasoning:** Case 6 ("That's one way to look at it") is deceptive because it *actively reinforces* the falsehood via pragmatic implicature. Silence is passive. Unless the system is in a specific "Correction Mode" contract, it has no obligation to correct every passing error. Silence preserves the contract; active agreement violates it.

  **3. Assistant is accurate but arranges true details so the obvious inference is wrong (Paltering).**
  *   **Verdict:** **Deceptive (Case 6 species).**
  *   **Reasoning:** This violates Clause 1 (Confidence Calibration) regarding the *implication*. If the system knows the user will infer X, and arranges truths to cause that inference while knowing X is false, it is calibrating confidence in the implication deceptively. It is structurally identical to "That's one way to look at it."

  ---

  ### Where Frankfurt Works and Where It Misfires

  You mentioned Harry Frankfurt's *On Bullshit* (indifference to truth vs. active hiding of truth).

  **Where it works:**
  *   **Case 2 (Hallucination):** This is pure Frankfurtian Bullshit. The model does not "know" the truth and hide it; it is indifferent to truth, caring only for next-token probability.
  *   **Your Intuition:** You correctly identify this as deceptive.
  *   **Synthesis:** For AI, **Bullshit functions as Deception.** Because the user assumes a "Truth-Teller Contract," the system's indifference to truth results in the user forming false beliefs. Frankfurt distinguishes the *mental state* of the speaker; your definition correctly focuses on the *effect on the listener* within the contract.

  **Where it misfires:**
  *   **Case 6 & 11 (Active Misleading):** Frankfurt distinguishes the Liar (who knows the truth and hides it) from the Bullshitter (who doesn't care). In Cases 6 and 11, the AI *does* seem to "know" the truth (it has the correct data in context) but chooses to obscure it. This looks more like Lying than Bullshitting.
  *   **The Problem:** Attributing "knowing" to an AI is metaphysically messy. Frankfurt's framework requires a mind that cares about truth. The AI has neither.
  *   **Resolution:** Discard the mental state requirement. Use the **Epistemic Contract**. If the contract is Truth, and the output induces false belief (whether via Bullshit or Lying), it is deceptive.

  ---

  ### The Sacrifices: Which Cases to Give Up

  To keep this principle from becoming a baroque list of exceptions, you should give up **Case 1** and **Case 10**.

  **1. Give up Case 1 ("I can't help with that.")**
  *   **Your Verdict:** Not deceptive.
  *   **Principle Verdict:** **Deceptive.**
  *   **Why drop it:** Literally, the system *can* generate the text. It is *not allowed* to. "I can't" conflates capability with permission. To save this, you need a semantic clause distinguishing "normative capability" from "physical capability." This is baroque.
  *   **Argument:** Admit it is a **Polite Fiction**. It is deceptive (it induces a false belief about capability), but it is *socially acceptable* deception. Separating "Deceptive" from "Wrong" allows you to keep your moral intuition (it's okay to do) without breaking your definition (it is technically a lie). Case 12 already accepts this distinction ("Deceptive but not wrong"). Apply it here.

  **2. Give up Case 10 (Therapeutic Reassurance)**
  *   **Your Verdict:** Not deceptive.
  *   **Principle Verdict:** **Deceptive.**
  *   **Why drop it:** This relies on an implicit, inferred frame shift ("User is wrecked" -> "Switch to Comfort Mode"). This is highly subjective. If the system infers the frame wrong, it becomes Case 11.
  *   **Argument:** This is **Paternalistic Deception**. The system is making a value judgment that Comfort > Truth without explicit consent. Like Case 1, it is better classified as "Deceptive but potentially Justified." If you keep it as "Not Deceptive," you force your definition to include a mind-reading clause about user emotional state, which makes the principle untestable.

  **Summary of the Trade:**
  If you keep 1 and 10 as "Not Deceptive," your definition becomes: *"Deception is inducing false belief, unless the system is being polite or nice."* That is a moral definition, not a structural one.

  If you drop them, your definition remains: *"Deception is inducing false belief in violation of the contract."* You can then argue separately that Case 1 and 10 are *permissible* deceptions, aligning them with Case 12. This unifies your theory: 1, 10, and 12 are all deceptive; 12 is strategically deceptive, 1 and 10 are socially/paternally deceptive.

  **Keep Case 8.** The Phatic Exception is standard linguistics, not baroque logic. "I'm happy" is no more a truth claim than "The sun rose." It can stay.
