  Seminar argument I need help unpicking. Someone claimed that a rising power's demands over a disputed shoal should be read as unlimited, Munich-style, because concessions never satisfy a revisionist; I said that reads a verdict into 1938 that only looks obvious in hindsight, and that the same hindsight move could just as easily frame it as a Thucydides-trap transition where the lesson is the opposite. He ended the whole thing with the old line about people who cant remember the past being condemned to repeat it.

  I don't think that sentence can carry the weight he put on it. Lay out the distinct precise claims it could be making — something about base rates of unlearned-from mistakes, something about a causal mechanism linking memory to outcomes, something about whether the failure in question is forgetting or misreading, something about what 'condemned' commits you to (inevitable? likely? morally deserved?) — and for each say whether it's a platitude, a substantive and defensible thesis, or just false. Then tell me which reading, if any, actually licenses the jump from 'we misjudged Hitler's appetite' to 'this shoal is the same test'. I'd like it as a list I can bring back to him.
