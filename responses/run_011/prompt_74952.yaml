answer: |-
  The Disjunctive Parity Thesis (DPT) claims that Frankfurt-style cases undermine the Principle of Alternative Possibilities (PAP) for omissions just as effectively as they do for actions. This thesis is false. The structural difference between performing an action and omitting to act creates a vulnerability in omission cases that action cases do not share. When we examine the mechanics of the counterfactual intervener, Black, we find that he cannot secure the omission without either destroying the agent's autonomy or leaving alternative possibilities open. Consequently, PAP survives for omissions even if it perishes for actions.

  To see why, consider the dilemma facing Black in the lifeguard scenario. Jones sits on the chair; the swimmer struggles. Jones can save her by diving, throwing a ring, radioing for help, or shouting. He omits to save her by doing nothing. Black wants to ensure this omission occurs.

  The first horn of the dilemma is that Black's monitoring is fine-grained enough to catch every possible rescue route. To guarantee Jones does not save the swimmer, Black must monitor not just one neural signature, but the disjunction of all signatures associated with any possible saving action. He must track the intention to dive, the intention to throw, the intention to radio. If Black is embedded deeply enough to detect any of these inclinations before they manifest, his presence is no longer a mere counterfactual safeguard; it becomes a constitutive part of Jones's deliberative environment. If Jones's brain is being scanned for *any* pro-rescue activity, the causal structure of his decision-making is entangled with Black's mechanism. In this scenario, Jones does not omit 'on his own' in the sense required for moral responsibility. He omits because his deliberative field is structurally constrained by the monitoring device. This collapses the case into ordinary determinism or coercion. Frankfurt cases are designed to show responsibility exists *despite* the lack of alternatives, not because the agent is determined by an external mechanism. If Black's monitoring is this intrusive, we have no reason to think Jones is responsible, but not for the reason Frankfurt intended. The case loses its dialectical force.

  The second horn is that Black's monitoring is coarse-grained. He tracks only the most obvious signs, say, the muscle tension associated with diving. Here, Jones retains the ability to save the swimmer by throwing the ring or radioing for help. These routes remain open until the moment of omission. If Jones could have thrown the ring, he has a genuine alternative possibility. PAP holds. Black fails to create a Frankfurt-style counterexample. Since Black must choose between intrusive monitoring (which undermines responsibility) and partial monitoring (which leaves alternatives open), he cannot construct a valid Frankfurt case for omissions. DPT is false.

  A Frankfurtian will not surrender easily. There are four standard replies, but none rescue the thesis.

  First, they might argue that Black's response can be so fast that the temporal gap between Jones initiating a rescue and Black intervening is negligible. This misses the point. Moral responsibility hinges on the possibility available at the moment of decision, not the success of the execution. If Jones can form the intention to throw the ring and initiate the motor programme before Black neutralises it, the alternative possibility existed at the relevant time. Speed does not erase the logical opening.

  Second, they might claim Black only needs to block the routes Jones is actually disposed to take. If Jones wasn't going to throw the ring anyway, Black doesn't need to block it. This begs the question. The purpose of the Frankfurt case is to test whether responsibility requires the *ability* to do otherwise, not merely the likelihood. If Jones *could* have thrown the ring but wasn't disposed to, PAP is satisfied. Restricting the blocking to disposed routes assumes the very determinism the case is meant to bypass.

  Third, they might suggest indexing the trigger to Jones's intention to save *simpliciter*, rather than specific bodily movements. Black monitors the abstract decision 'I will save her'. This works poorly for omissions. In action cases, the decision to shoot is often a singular neural event. In omission cases, the decision to save is fragmented across different methods. There is no single neural signature for 'saving' that is distinct from 'diving' or 'throwing'. To monitor the abstract intention is to monitor the disjunction again, returning us to the first horn of the dilemma and the problem of intrusive monitoring.

  Fourth, they might argue that any escaping routes are not 'robust' alternatives. Perhaps throwing the ring is too unlikely to succeed to ground responsibility. This is implausible in the lifeguard case. Saving a life is the paradigm of a robust alternative. Any route that reliably prevents death is sufficient for moral responsibility. To claim otherwise is to move the goalposts arbitrarily.

  So, where does this leave us? We must choose between an asymmetry and a conservative moral. The conservative moral suggests that if Frankfurt cases fail for omissions, they likely fail for actions too, perhaps because the 'prior sign' problem in action cases is structurally similar to the disjunctive problem in omission cases. However, this conflates two distinct metaphysical structures. An action is typically a specific event type; an omission is the non-occurrence of any event from a wide set. The difficulty Black faces in the omission case arises specifically from the multi-path nature of rescue. In the standard shooting case, the action is singular. While one might argue about left-handed vs right-handed shooting, the neural intention to kill is usually treated as a unified state. The omission case exposes a flaw specific to the metaphysics of allowing harm. Therefore, the honest conclusion is the asymmetry. PAP dies for actions, where a single prior sign can be targeted without entangling the whole deliberative field, but survives for omissions, where blocking all alternatives requires controlling the agent's entire cognitive landscape. This matters. It suggests that our responsibility for what we do is grounded differently than our responsibility for what we allow. We can be responsible for harms we cause even if we couldn't have avoided them, but we are only responsible for harms we allow if we could have prevented them.

  If a Frankfurtian wishes to fight back, they must attack the first horn of the dilemma. They must argue that fine-grained monitoring does not entail intrusive control. They need to demonstrate a mechanism that can track every possible rescue intention without causally influencing the deliberation process itself. If they can show that monitoring can be exhaustive yet invisible, the collapse into determinism is avoided, and the first horn blunts. Until then, the omission case remains a sanctuary for alternative possibilities.

  Verdict: The Disjunctive Parity Thesis is false because the multi-path nature of omissions prevents counterfactual intervention without coercion, preserving the Principle of Alternative Possibilities for omissions even if it fails for actions.
