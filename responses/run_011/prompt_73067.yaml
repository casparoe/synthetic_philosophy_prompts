answer: |-
  Here is an analysis of your judgments, the derivation of a working principle, and its application to your policy draft.

  ### Part 1: Candidate Principles

  You proposed a "Causal Chain" principle. It is a strong start, but as you noted, it fails to distinguish between authorized multiples (Case 4 vs. 5) or reconstructions (Case 8). To find the rule that actually generates your verdicts, we must test three candidates.

  **Candidate 1: The Strict Causal Chain**
  *   **Clause:** An object is the work if and only if it stands in an unbroken physical causal chain to the artist's hand.
  *   **Accommodates:** Cases 2, 6, 7, 8.
  *   **Fails:** Case 4 (posthumous bronze breaks the chain of the hand), Case 9 (assistants break the chain of the hand), Case 3 (implies the modern violin is equal to the Cremonese if the sound is identical, which you deny).

  **Candidate 2: The Authorization and Disclosure**
  *   **Clause:** An object is the work if the artist (or estate) authorized its production and its status is honestly disclosed to the buyer.
  *   **Accommodates:** Cases 4, 5, 9 (assistants), 8 (authorized rebuild).
  *   **Fails:** Case 5 (you reject the reductions despite authorization), Case 8 (you reject the monument despite authorization), Case 1 (you accept the forger's work as "admirable" despite lack of authorization).

  **Candidate 3: Constitutive Agency and Material Continuity (The Recommended Principle)**
  *   **Clause A (The Decision):** The object must embody a specific aesthetic decision made by the artist where that decision was the *constitutive* cause of the final form.
  *   **Clause B (The Medium):** The method of production must be one the artist recognized (or the medium conventionally accepts) as a valid means of instantiating that judgment. In sculpture, the mold is the decision; in architecture, the construction is the decision; in painting, the brushstroke is the decision.
  *   **Clause C (The Continuity):** For unique objects, material continuity from the artist's time is required, barring conservation. For multiples, the edition limit must be set by the artist as part of the work's concept.
  *   **Clause D (The Agent):** The executing agent must be capable of aesthetic judgment (human) or be a tool directly controlled by such an agent. Statistical generation without human intervention during execution is not an exercise of skill.
  *   **Accommodates:** All 10 cases, provided we accept specific distinctions in Cases 4 vs. 8 and 3.

  **Selection:** Candidate 3 is the only one that survives your specific intuitions. It distinguishes between *making* (Case 4) and *rebuilding* (Case 8), and between *studio assistance* (Case 9) and *licensing* (Case 5).

  ---

  ### Part 2: Mapping the Clauses to Your Cases

  Here is how **Candidate 3** generates your specific verdicts:

  *   **Case 1 & 2 (The Forger):** Satisfies Clause D (human skill) but fails Clause A (the aesthetic decision belongs to the forger, not the master). Verdict: Attribute to Forger.
  *   **Case 3 (The Violin):** Satisfies Clause A & D for both. The price disparity is not an authenticity issue but a historical scarcity issue. The principle validates the modern maker's credit (Clause D) without equating the objects' ontological status (Clause C).
  *   **Case 4 (Posthumous Bronze):** Satisfies Clause B. In sculpture, the plaster/mold is the locus of the artist's constitutive decision. The cast is a direct index of that mold. Satisfies Clause C (limited edition implies artistic concept). Verdict: The Work.
  *   **Case 5 (Reductions):** Fails Clause B & C. A reduction is a translation of data, not an index of the mold. The edition size (500) suggests merchandise, not artistic concept. Verdict: Merchandise.
  *   **Case 6 (Infill):** Fails Clause C (material continuity broken). Verdict: Qualified (Diminished).
  *   **Case 7 (Cleaning):** Satisfies Clause C. Removal of later material restores the original constitutive surface. Verdict: The Work (Improved).
  *   **Case 8 (Rebuilt Monument):** Fails Clause B. In architecture, the constitutive act is the assembly of materials in space, not the drawing. A rebuild is a copy based on information, not an instantiation of the original act. Verdict: Reconstruction.
  *   **Case 9 (Assistants vs. Licensing):** Assistants satisfy Clause D (tools of the master's judgment). Licensing fails Clause A (the artist makes no aesthetic decision on the specific objects). Verdict: Studio Work vs. Merchandise.
  *   **Case 10 (AI vs. Copyist):** Human Copyist satisfies Clause D (exercise of skill/judgment in replication). AI fails Clause D (statistical probability without agency). Verdict: Copy vs. Non-Work.

  ---

  ### Part 3: Testing the Four Undecided Cases

  Applying **Candidate 3** to your new scenarios:

  1.  **Workshop Picture (Signed/Sold by Master):**
      *   *Analysis:* Satisfies Clause A (Master's oversight/brand is the decision) and Clause B (Studio practice is a valid medium convention).
      *   *Label:* "Workshop of [Master]" or "[Master] and Assistants." It is a work of the studio, not the hand, but authentic to the practice.
      *   *Acquisition:* Acceptable with qualification.

  2.  **Remade Painting (Better than Original):**
      *   *Analysis:* Satisfies Clause A (Artist's new decision). The first object was destroyed (ending its continuity, Clause C). The second object is the new locus of the work.
      *   *Label:* "[Artist], [Date of remake]." Note the history in the caption.
      *   *Acquisition:* Acceptable as the primary work.

  3.  **The "Ship of Theseus" Violin:**
      *   *Analysis:* Satisfies Clause C (Identity continuously maintained). In musical instruments, identity is often tied to the *sound* and the *lineage of repair* rather than strict atomic material, provided the structural integrity remains the lineage of the original object.
      *   *Label:* "[Maker], [Date]." Note extensive restoration.
      *   *Acquisition:* Acceptable as Original.

  4.  **Posthumous Photograph (From Negative):**
      *   *Analysis:* Satisfies Clause B. In photography, the negative is the constitutive decision; the print is the instantiation. If following documented instructions, it satisfies Clause A.
      *   *Label:* "[Photographer]. Printed [Date] by [Printer]."
      *   *Acquisition:* Acceptable as The Work (Posthumous Print).

  ---

  ### Part 4: The Tensions and the Sacrifices

  You identified two specific tensions. Here is how the principle resolves them, and where you must yield.

  **Tension 1: Case 4 (Bronze) vs. Case 8 (Monument)**
  *   *The Conflict:* Both are later-made from the maker's record. Why is one "The Work" and the other "Not the Thing"?
  *   *The Resolution:* **Indexicality vs. Iconicity.**
      *   The bronze (Case 4) is *indexical*. The molten metal touches the artist's mold. The physical pressure of the artist's hand on the plaster is physically transmitted to the bronze. It is a cast.
      *   The monument (Case 8) is *iconic*. The builders looked at drawings (information) and decided how to lay bricks. There is no physical transmission of the original act.
      *   *Policy Implication:* Your principle holds. Do not abandon either verdict. The distinction is physical, not bureaucratic.

  **Tension 2: Case 3 (Violin Value)**
  *   *The Conflict:* You credit the modern maker equally for the result, yet accept the original's higher value. You suspect this is incoherent.
  *   *The Resolution:* **Authenticity is not Value.**
      *   Your principle defines *ontology* (what the object is), not *economics* (what it is worth). The Cremonese violin carries historical witness (Clause C) that the modern one does not.
      *   *The Sacrifice:* **You must abandon the idea that your authenticity policy should justify the price.** Your verdict that "buyers are not simply confused" is correct, but their payment is for *provenance*, not *authenticity* in the sense of skill.
      *   *Recommendation:* Do not let market value influence your acquisition policy. Acquire the modern violin if it serves the mission, but label it "Modern, after [Maker]." Do not try to rationalize the seven-figure price in your policy; that is the market's function, not the museum's.

  **The Verdict to Abandon:**
  I recommend you soften **Case 10 (AI)**.
  *   *Reasoning:* You call AI outputs "not works at all" and a "wrong." This is an ethical judgment, not an ontological one. If a human uses AI as a tool (Clause D), guiding it with specific aesthetic decisions, it may qualify as a work *by the human*. If the AI acts autonomously on a corpus, it is a "pastiche" (Case 1).
  *   *Correction:* Label AI outputs "Generated from [Illustrator] corpus." Do not ban them as "not works" if the process is disclosed; categorize them as "Derivative Data." The "wrong" is a legal/copyright issue, not a museum authenticity issue.

  ---

  ### Part 5: Institutional Consequences

  **1. Invisible Facts and the Visitor**
  If standing depends on facts invisible in the object (e.g., posthumous casting, AI generation), the institution owes the visitor **transparency of process, not just attribution.**
  *   *Policy:* Labels must not just say "[Artist Name]." They must carry a standard qualifier where the causal chain is interrupted or mediated.
  *   *Examples:* "Posthumous Cast," "Studio of," "Reconstruction," "Digital Generation."
  *   *Rationale:* The visitor cannot see the mold or the code. The label acts as the proxy for the material evidence they cannot perceive.

  **2. Gameability**
  *   *Risk:* Can a fabricator disclose everything and still produce "The Work"?
  *   *Analysis:* If a fabricator makes a perfect copy and says "I made this yesterday," they have produced a **Copy**, not "The Work." Your policy protects against *misattribution*, not *skill*.
  *   *Policy:* A fabricator cannot game the system because the "Constitutive Agency" (Clause A) is historical. They cannot be the original artist. If they disclose the truth, they are not forging; they are creating a study. If they do not disclose, they are forging. The policy holds.

  ---

  ### Part 6: Mind Change and Bundle Theory

  **What Would Change My Mind?**
  I would abandon the **Indexicality** distinction (Case 4 vs. 8) if you could demonstrate that the *cultural function* of the rebuilt monument is identical to the original for the community it serves.
  *   *Scenario:* If the monument is a sacred site where the *ritual of rebuilding* is part of the work (e.g., the Ise Shrine in Japan, rebuilt every 20 years), then Case 8 becomes "The Work."
  *   *Shift:* This would move the principle from "Material Continuity" to "Continuity of Practice." If your museum collects living cultural traditions, my principle is too Western/Object-focused. If you collect historical artifacts, my principle stands.

  **Where I Might Be Wrong:**
  I am most vulnerable on **Case 10 (AI).** I treat AI as a tool without agency. If future consensus shifts to view the *curation of the dataset* as the artistic act, then the AI output becomes a "print" from a "digital negative."
  *   *Risk:* If you acquire AI art, ensure the "negative" (the specific model weights and prompts) is preserved as the constitutive object, not just the image.

  **Bundle Theory:**
  You ask if authenticity is a bundle of unrelated properties.
  *   *Conclusion:* It is not a bundle; it is a **chain.**
  *   *Argument:* If it were a bundle, an object could be "50% authentic." Your judgments reject this (Case 2: "what I was admiring is no longer there"). Authenticity is binary (It is the work / It is not), but *Quality* and *Condition* are scalar.
  *   *Counter-Evidence:* The only thing that counts against this is Case 6 (40% infill). You call it "diminished," not "fake." This suggests authenticity *is* slightly porous.
  *   *Final Adjustment:* Treat authenticity as a **threshold.** If the constitutive surface (Clause B) is >50% intact, it is the Work (Qualified). If <50%, it is a Fragment/Reconstruction. This saves Case 6 without collapsing into bundle theory.

  ### Summary for Policy Drafting

  1.  **Define "Work":** An object embodying the artist's constitutive aesthetic decision, instantiated through accepted medium conventions.
  2.  **Define "Authentic":** Unbroken material continuity (unique objects) or direct indexing from artist-approved molds/negatives (multiples).
  3.  **Labeling:** Mandatory qualifiers for posthumous casts, studio works, reconstructions, and algorithmic generations.
  4.  **Acquisition:** Do not acquire unauthorized reconstructions (Case 8) as originals. Do not acquire licensed merchandise (Case 5) as art.
  5.  **Value:** Explicitly decouple authenticity from market value in policy text to avoid Case 3 confusion.

  This principle respects your intuitions while providing the structural rigidity needed for a committee vote.
