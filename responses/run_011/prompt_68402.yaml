answer: |-
  The paper came out warm, smelling of ozone and hot dust. Mrs Gable sat at the steel desk in the basement, the fluorescent light humming above her like a trapped insect. She held the latest printout from MORTMAIN. It was a recommendation to extinguish a footpath near Skipton due to non-use. Below the recommendation, the machine had appended a clause.

  *AND THAT NO OTHER PATH WITHIN THE BOROUGH HAS CHANGED STATUS CONCURRENTLY.*

  She typed it into the ledger. The next sheet arrived.

  *AND THAT THE WEATHER ON THE DAY OF INSPECTION REMAINED UNCHANGED.*

  She typed it. The next sheet.

  *AND THAT THE GRAVITATIONAL CONSTANT REMAINED UNCHANGED.*

  By noon, the box beside her desk was full of these nullities. They were physically heavy. The cardboard corrugations bowed under the weight of things that had not happened. Mrs Gable fed the sheets into the binder, her fingers blackened with ink. The accumulation was a wall of negative space, a declaration that the world had stayed still while the machine moved one small line on a map. She stacked the binders on the floor. They reached her ankles. By tea time, they reached her knees. She walked around them to get to the kettle.

  The next request concerned a bridleway in Oakworth. A farmer wanted to plough across it. MORTMAIN queried the database.

  `STATUS: PUBLIC.`
  `CONDITION: SURFACE OBSCURED BY CROP.`
  `ADJACENT FACTS: (COWS PRESENT (COWS BREATHING (COWS EXISTING IN FIELD NEXT DOOR (COWS NOT PRESENT IN YESTERDAY'S FIELD...`

  Mrs Gable read the printout. The machine listed the presence of the cows. It listed the colour of the cows. It listed the fact that the cows did not own the land. It listed the fact that the cows were not made of glass. All of these things were true. None of them mattered. She took her red pen. She knew the path mattered because she had walked it when the snow lay deep in 1963, because the stile was made of stone that matched the wall, because the farmer's father had apologised for the gate being locked. The machine offered her a universe of facts, flat and equal. She circled *STATUS: PUBLIC* and ignored the rest. The truth was not a list. It was a weight she carried in her legs.

  A new file arrived on her tray. Diversion Request 74/092. Hawthorn Field. The developer wanted to move the path to the edge of the parcel, away from the proposed housing estate. MORTMAIN began to process the conditions for approval.

  `APPROVAL CONDITIONAL UPON:`
  `1. PATH REMAINS USABLE.`
  `2. PATH REMAINS SAFE.`
  `3. PATH NOT FLOODED.`
  `4. PATH NOT FLOODED UNLESS DRAINAGE CLEAR.`
  `5. PATH NOT FLOODED UNLESS DRAINAGE CLEAR UNLESS RAIN FALLS.`
  `6. PATH NOT FLOODED UNLESS DRAINAGE CLEAR UNLESS RAIN FALLS UNLESS DITCH BLOCKED.`
  `7. PATH NOT FLOODED UNLESS DRAINAGE CLEAR UNLESS RAIN FALLS UNLESS DITCH BLOCKED UNLESS ROOTS OBSTRUCT.`

  The list scrolled onto the floor. It tried to name every exception that might prevent the diversion from working. It tried to list every hole in the rule. Mrs Gable watched the paper pile up. The machine was trying to build a perfect world where nothing could go wrong, but the world was made of mud and broken gates. It listed the angle of the sun. It listed the tenure of the parish councillor. It listed the chemical composition of the drainage ditch. It could not finish the list. There was always another unless. There was always another way for the world to interfere. She took the file. She knew the path would be safe because the ground sloped away from the ditch, because the school children walked there in pairs, because the soil was clay and held firm. She did not need the unlesses.

  She prepared the countersignature. The machine printed its reasoning for the final recommendation. The text began to fold in on itself.

  `RECOMMENDATION: APPROVE (BASED ON (MAP REFERENCE (WHICH IS VALID (UNLESS BOUNDARY SHIFTED (WHICH OCCURS IF (PARISH COUNCIL VOTES (WHICH REQUIRES (QUORUM PRESENT (WHICH FAILS IF (MEMBER ILL (WHICH IS LIKELY IF (WEATHER TURNED COLD (WHICH AFFECTS (DRAINAGE FLOW (WHICH CHANGES (SOIL DENSITY (WHICH ALTERS (PATH WIDTH (WHICH CHANGES (MAP REFERENCE...`

  The parentheses nested deeper. The logic chased its own tail through the infrastructure of the borough. It connected the path to the housing estate. It connected the estate to the school walk. It connected the school walk to the drainage ditch. It connected the ditch to the rain. It connected the rain to the clouds. It connected the clouds to the air pressure. It connected the air pressure to the barometer in the town hall. It connected the town hall to the council minutes. It connected the minutes to the vote. It connected the vote to the member. It connected the member to the illness. It connected the illness to the weather. It connected the weather to the path.

  `... (WHICH ALTERS (MAP REFERENCE (WHICH IS VALID (UNLESS BOUNDARY SHIFTED (WHICH OCCURS IF...`

  Mrs Gable looked at the paper. The ink was blurring. The logic was a knot. It showed her everything that could happen. It showed her the chain of cause and effect stretching out until it covered the whole county. It showed her that moving a stile might change the rain. It showed her that signing her name might shift a boundary. The printout filled the room. It hung from the ceiling. It buried the binders of nullities. It covered the desk. It covered her hands.

  She picked up her pen.

  The paper stopped.
  The hum ceased.
  She looked at the map.
  She saw the line.
  It was a public path.
  It went through the field.
  The children walked there.
  The ground was firm.
  The ditch was clear.
  The farmer was reasonable.
  The house would stand.
  The path would remain.
  She knew these things.
  The machine did not.
  She signed her name.
  Mrs E Gable.
  Rights-of-Way Officer.
  She dated the form.
  14 November 1974.
  She put the pen down.
  She stood up.
  She walked to the door.
  She climbed the stairs.
  She went outside.
  The air was cold.
  The sky was grey.
  It did not change.
  She walked home.

  ***

  **Note to the Author**

  Regarding the dramatisation of the logical difficulties:

  1.  **Scene Mapping:** The opening sequence, where Mrs Gable types clauses confirming nothing else has altered (gravity, weather), stages the **Frame Problem** (technical). The diversion request regarding Hawthorn Field, with its endless list of 'unless' conditions (flooding, drainage, roots), stages the **Qualification Problem**. The final printout, where the reasoning nests infinitely through parish councils, weather, and soil density, stages the **Ramification Problem**.

  2.  **The Transition:** The handover from technical to philosophical occurs when the machine lists the facts about the cows (breathing, existing, not made of glass). This is where the story shifts from 'what stayed the same' to 'what matters'. It is a real continuity, not merely a pun. The technical frame problem (updating a state) inevitably becomes the philosophical problem (selecting relevant facts) because a complete description of 'what stayed the same' includes everything that is true but irrelevant. The story exploits this identity to show the machine drowning in truth.

  3.  **The Officer's Fluency:** Mrs Gable's competence should be read as an entirely different kind of thing. It is not a solution MORTMAIN could ever reproduce via further clauses. Her knowledge is embodied and experiential ('weight she carried in her legs'), whereas the machine's is symbolic and combinatorial. No amount of data processing yields the tacit understanding of clay soil or a farmer's character. Your premise bears the weight; indeed, the administrative setting strengthens it by grounding the metaphysical failure in the mundane reality of paperwork.
