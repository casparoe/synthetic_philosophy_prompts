answer: |-
  **Joint Statement on Norm Extinction**

  **I. Agreed Claims**
  1.  **Profitability:** Drescher's data stands: the British slave system was economically robust and expanding in 1807.
  2.  **Esteem as Interest:** Esteem functions as a strategic interest; actors maximize utility inclusive of social standing.
  3.  **Mechanism:** Norm extinction requires shifts in material constraints, status valuations, or both.
  4.  **Verbal Dispute:** We acknowledge "interest" and "honor" describe overlapping selection processes. The substantive residue is whether material capacity or status valuation drives the *timing* of change when the two diverge.

  **II. Residual Disagreements**

  | Dimension | Materialist Formulation | Honor Theorist Formulation | Neutral Restatement |
  | :--- | :--- | :--- | :--- |
  | **Causal Primacy** | Norms collapse when elite material interests shift (Williams paradigm); ideology legitimates post-hoc. Economic weight determines political will and legislative outcomes. | Norms collapse when practices become disgraceful within relevant peer networks (Appiah paradigm). Moral revaluation drives political will and legislative outcomes. | Norm change involves recalibrating the cost-benefit analysis of material capacity and social valuation, with disagreement on which variable weights heavier in decision matrices. |
  | **1807 Abolition** | Planter political weight declined relative to industrial/metropolitan interests; naval strategy mattered more than morality. *Econocide* refutes profit decline, not interest shift. | Slavery became incompatible with metropolitan gentlemanly identity regardless of profit; shame preceded legislation. Profit is irrelevant if standing is lost. | Abolition occurred where metropolitan political coalitions overlapped with shifting social identities and strategic interests, though the trigger remains contested. |
  | **Interest Definition** | Interest is primarily material (profit, power); honor is a tool to secure it. Appeals to humanity are downstream legitimation for structural shifts. | Interest is primarily social (esteem, shame); material gain is subordinate to standing. Honor constitutes the interest itself, not merely a tool for acquisition. | Actors pursue mixed motives where material and social utilities are weighted differently across contexts and historical moments, creating distinct causal pathways. |
  | **Dueling Case** | Dueling persists where land-based elites retain political monopoly and economic security allows risk-taking. Wellington's case is an outlier of political power. | Dueling persists where military honor codes remain insulated from civil moral revaluation and peer esteem demands it. Wellington's standing proves honor rules. | Persistence depends on the insulation of specific elite subcultures from broader normative shifts and material pressures, varying by national context. |

  **III. Falsifiable Cruxes**

  1.  **Atlantic Abolition Timing:** Does abolition track material inflection or status configuration?
      *   *Evidence:* Comparative elite income sources (colonial extraction vs. domestic industry) vs. metropolitan social integration metrics (marriage networks, club membership).
      *   *EH Prediction:* Abolition correlates with industrial share of elite income surpassing colonial extraction across polities.
      *   *MP Prediction:* Abolition correlates with colonial elites losing voting rights in metropolitan honor networks regardless of income share.

  2.  **Dueling Variation:** Why did dueling wither in Britain but persist in France/Germany/US South?
      *   *Evidence:* Officer corps social origin data vs. land tenure stability records and civil legal enforcement rates.
      *   *EH Prediction:* Persistence tracks stability of agrarian wealth and land tenure security allowing risk-taking behavior.
      *   *MP Prediction:* Persistence tracks autonomy of military honor codes from civil opinion and legal enforcement of anti-dueling statutes.

  3.  **West African Cutting:** Do declarations cause abandonment or ride along with economics?
      *   *Evidence:* Longitudinal survey of declarants vs. non-declarants controlling for household income and education levels over ten years.
      *   *EH Prediction:* Abandonment correlates with household income/education increases regardless of public declaration program participation.
      *   *MP Prediction:* Abandonment correlates with public declaration density controlling for income changes, proving status machinery drives behavior.
