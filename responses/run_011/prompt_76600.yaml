prompt: |-
  I run intake at a small charity fund that pays for medical care people can't otherwise afford. We get around forty applications a month and can fund six. Its written policy is basically luck egalitarianism as far as I understand it — we help people who got unlucky, and we don't reward people whose own choices put them there — but in practice that sentence just becomes an hour of panelists arguing.

  Turn it into a decision procedure my panelists could actually run. They're volunteers, no philosophy background, about twenty minutes per case. I need: the questions in the order they should be asked; what an application has to establish to clear each one and move on; the exact places where bad luck shades into bad choices and what the panelist is supposed to do standing at that line; and the points where the procedure has to stop and say "this is a values call, escalate to the board" instead of pretending to compute an answer.

  Two wrinkles it has to handle. First, when the choice was made under circumstances the applicant didn't choose either — someone skipped a screening because she was working two jobs and nobody ever told her it mattered. Second, half my panel wants to ask how the person got sick and the other half wants to ask how badly off they'll be regardless; the procedure should tell us which question governs and when the other one is allowed back in.

  Then run it on three applications: a thirty-year-old with a congenital condition needing surgery; a fifty-five-year-old who chose to go BASE jumping, is now paralyzed, and needs rehab equipment; a forty-year-old who smoked for twenty years, quit ten years ago, and has lung disease. Be explicit about where following the principle strictly hands down a verdict I'm going to hate, and say what the procedure can't settle.

  Printable numbered list for the questions, and keep the whole thing under 650 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** Small charity fund, medical care intake. 40 applications/month, 6 funded.
      *   **Policy:** Luck Egalitarianism (help unlucky, don't reward bad choices).
      *   **Problem:** Policy is vague, leads to arguments among volunteer panelists (no philosophy background).
      *   **Constraints:**
          *   Decision procedure for panelists.
          *   Time limit: ~20 mins/case.
          *   Output: Numbered list of questions, criteria to clear each, handling the "bad luck vs. bad choice" line, escalation points.
          *   Wrinkle 1: Choices made under constrained circumstances (e.g., working two jobs).
          *   Wrinkle 2: Panel split (cause of sickness vs. severity of outcome). Need to dictate which governs.
          *   Test Cases: 30yo congenital, 55yo BASE jumper, 40yo ex-smoker.
          *   Requirement: Explicitly state where strict principle leads to hated verdicts and what the procedure can't settle.
          *   Format: Printable numbered list.
          *   Word Count: Under 650 words.

  2.  **Deconstruct Luck Egalitarianism for this Context:**
      *   Core idea: Compensate for brute luck (unchosen circumstances), not option luck (calculated risks).
      *   Challenge: Distinguishing brute vs. option luck when constraints exist.
      *   Challenge: Balancing causation (how they got sick) vs. need (how bad off they are). The prompt asks to dictate which governs. Luck egalitarianism prioritizes *cause* (responsibility), but humanitarianism prioritizes *need*. Given the policy is explicitly luck egalitarianism, cause must govern eligibility, but need might govern prioritization *within* the eligible pool. However, the prompt asks to resolve the panel split. I should prioritize the "luck" filter first (eligibility), then "need" (triage).
      *   Constraint Handling: If a choice was made under severe constraint (no reasonable alternative), treat as brute luck.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Medical Necessity & Financial Need.* (Baseline eligibility).
      *   *Step 2: Cause Analysis (Luck vs. Choice).* This is the core.
      *   *Step 3: Constraint Check (Wrinkle 1).*
      *   *Step 4: Severity/Priority (Wrinkle 2).*
      *   *Escalation:* Where values clash.

      *Drafting Questions:*
      1. Is care medically necessary and unaffordable? (If no, reject).
      2. Did the condition arise primarily from unchosen circumstances (genetics, environment, accident)? (If yes, proceed).
      3. Did it arise from a voluntary risk? (If yes, check constraints).
      4. Were there reasonable alternatives to the risk? (If no due to constraints, treat as luck).
      5. Severity check.

      *Refining for Word Count & Clarity:*
      Need to be punchy. Volunteers need clear "Yes/No" gates.
      Need to address the panel split: Cause determines eligibility; Severity determines ranking among eligible.
      Need to address the "hated verdicts" in the test case section.

      *Test Cases:*
      1. 30yo Congenital: Pure brute luck. Pass.
      2. 55yo BASE jumper: Option luck. Strict principle says reject. Might be hated.
      3. 40yo Ex-smoker: Mixed. Quit 10 years ago. Is past choice still responsible? Strict principle might say yes (causal link), but mitigation exists.

      *Word Count Management:*
      The procedure needs to be tight. The analysis of the three cases needs to be concise.

      *Drafting the Content:*

      **Intake Decision Procedure (Luck Egalitarianism)**

      **Phase 1: Baseline Eligibility (5 mins)**
      1. **Medical Necessity:** Is the care medically necessary to prevent severe harm/death?
      2. **Financial Need:** Is the care unaffordable without this fund?
      *Stop if either is No.*

      **Phase 2: Responsibility Filter (10 mins)**
      3. **Origin:** Did the condition result primarily from unchosen circumstances (genetics, environment, involuntary accident)?
         *   *Yes:* Proceed to Phase 3.
         *   *No:* Go to Question 4.
      4. **Voluntary Risk:** Did the condition result from a known, voluntary risk (e.g., hazardous sport, substance use)?
         *   *No:* Proceed to Phase 3.
         *   *Yes:* Go to Question 5.
      5. **Constraint Check:** At the time of the choice, did the applicant lack reasonable alternatives due to unchosen constraints (e.g., poverty, lack of education, coercion)?
         *   *Yes:* Treat as "unchosen circumstance." Proceed to Phase 3.
         *   *No:* **Reject.** (This is option luck).

      **Phase 3: Prioritization (5 mins)**
      6. **Severity:** Among eligible cases, who faces the greatest irreversible loss of function or quality of life?
         *   *Rule:* Cause governs eligibility; Severity governs ranking.

      **Escalation Points (Board Review)**
      *   **Mixed Causation:** Condition results from both luck and choice (e.g., genetic predisposition triggered by lifestyle).
      *   **Definition of "Reasonable":** Panel disagrees on whether alternatives were available in Question 5.
      *   **Hardship vs. Principle:** Strict application of Question 5 leads to severe suffering deemed unacceptable by >50% of panel.

      **Test Case Applications**

      1.  **30yo Congenital Condition:**
          *   Q3 (Origin): Yes (genetics).
          *   Verdict: **Fund.** Pure brute luck. No conflict.

      2.  **55yo BASE Jumper (Paralyzed):**
          *   Q3: No. Q4: Yes (voluntary risk). Q5: No (assumed safe equipment/choice).
          *   Verdict: **Reject.**
          *   *Conflict:* Strict principle denies aid for self-inflicted paralysis. Panelists focusing on severity (Q6) will hate this. This is the "hated verdict." Escalate if panel invokes "Hardship vs. Principle."

      3.  **40yo Ex-Smoker (Lung Disease):**
          *   Q3: No. Q4: Yes (smoking). Q5: Mixed. Quit 10 years ago.
          *   *Conflict:* Is past choice still responsible? Did addiction remove "voluntary" status?
          *   Verdict: **Escalate.** This is "Mixed Causation." Strict principle might reject (cause was choice), but mitigation (quitting) complicates responsibility. Procedure cannot settle the weight of past choices vs. current health status.

      **Notes for Panel:**
      *   Do not debate severity (Q6) until eligibility (Q1-5) is settled.
      *   If Q5 feels ambiguous, default to Escalation, not rejection.

