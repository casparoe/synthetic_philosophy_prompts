      *   *Critique:* How do I address the "secure attributions" paradox?
      *   *Fix:* Admit it openly. The canon was built on connoisseurship. We cannot pull the ladder up after climbing it.
      *   *Length Check:* Keep it tight. Two pages max.

  5.  **Drafting the Content (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Proposal for Attribution Standards."
      *   *Intro:* We aren't just judging a painting; we're judging how we know what we know.
