answer: |-
  **MEMORANDUM**

  **TO:** Attributions and Cataloguing Standards Panel
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Attribution Standard: The Convergence of Evidence

  **Purpose**
  We have been deadlocked for two years over a sixteenth-century oak panel. While the immediate question is whether to retain the "Workshop of" attribution or reduce it to "Circle of," the stalemate reveals a deeper disagreement about the epistemology of art history. We are not merely judging a painting; we are judging how we justify knowledge claims in the absence of absolute proof. To resolve the current case and guide future acquisitions, this memo recommends adopting the **Convergence of Evidence Standard** (Camp Two) as our institutional policy.

  **The Recommended Standard: Convergence of Evidence**
  We should reject the demand for contemporary documentary termination (Camp One) as too restrictive for Old Master materials, and we should reject the infinite regress of warrants (Camp Three) as operationally paralyzing. Instead, we adopt a coherentist model: an attribution is warranted when distinct lines of inquiry—material analysis, connoisseurship, and provenance—converge to make the attribution the most probable explanation of the object's history.

  **Operational Criteria for Curators**
  To make this actionable for new acquisitions and re-cataloguing, curators must demonstrate triangulation across three domains. No single domain is dispositive, but significant divergence in any domain weakens the attribution.

  1.  **Material Consistency:** Dendrochronology, pigment analysis, and support construction must be compatible with the attributed time and place. (e.g., An Antwerp master cannot paint on a panel felled in 1550 if he died in 1530).
  2.  **Stylistic Coherence:** The work must align with the secure corpus of the master or workshop. This includes handling, underdrawing, and compositional logic. This relies on the trained eye, calibrated against the museum's existing holdings.
  3.  **Historical Probability:** Provenance and archival context must not contradict the attribution. Gaps are permissible; contradictions are not.

  **Addressing the Documentary Requirement (Camp One)**
  The argument that only contemporary documents (payments, inventories) justify attribution is intellectually rigorous but historically unsustainable. If adopted, we would be forced to deaccession or recatalogue a significant portion of our Northern Renaissance collection.

  We must acknowledge the awkward fact that the "secure" attributions against which our eyes are calibrated were themselves established via connoisseurship, often decades before documentary proof was found. We cannot pull the ladder up after climbing it. To demand documents now is to apply a standard to new acquisitions that was not applied to the canonical works we use as benchmarks. Documents should be treated as high-value evidence within the convergence, not as a prerequisite for entry.

  **Addressing the Infinite Regress (Camp Three)**
  The argument that warrants can always be extended is philosophically sound but museum-practice impossible. We must label walls and publish catalogues. We require a "working truth" that remains open to revision but allows for present-tense assertion. Our standard must be one of *probability*, not certainty. We stop the chain of questioning not because it *cannot* be continued, but because the cost of further inquiry outweighs the marginal gain in probability, and the current convergence is sufficient for public trust.

  **Application to the Sixteenth-Century Panel**
  Regarding the specific case at hand: This standard requires us to treat the 2009 acquisition recommendation—made by my former mentor and the then-Curator of European Art—as a link in the chain of provenance and scholarship, not as an immune authority.

  The fact that I was trained by this curator is irrelevant to the validity of the attribution; the validity rests on whether their judgment converges with current technical analysis and the evolving corpus of the Antwerp master. If dendrochronology and recent comparative scholarship converge with the 1911 and 2009 assessments, the "Workshop" attribution stands. If the technical evidence diverges from the stylistic assessment, the attribution must be downgraded to "Circle of," regardless of the pedigree of the previous curators.

  **Conclusion**
  The Convergence of Evidence Standard acknowledges that attribution is abductive reasoning (inference to the best explanation). It protects the museum from the dogmatism of demanding impossible proof while guarding against the paralysis of endless skepticism. I recommend we vote to adopt this standard immediately, and then apply it to the oak panel.

  **[Your Name]**
  **Panel Member**
