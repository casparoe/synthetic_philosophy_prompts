prompt: |-
  So, bit of an odd situation and I could use some help prepping. I'm a third-year in political theory — my actual dissertation is about eighteenth-century petitioning, nothing to do with aesthetics — and somebody dropped out of a one-day workshop on Enlightenment publics at a research centre here in three weeks, and my supervisor volunteered me to fill the slot because I'd been making a nuisance of myself in reading group about Rousseau's Letter to d'Alembert. It got out of hand in a good way: I'd gotten into an argument with a friend who programs a fringe theater festival and who wanted my two cents on a grant proposal for a new 60-seat black box venue, and I went back to the Letter to find something useful to say and ended up with a reading I actually want to defend, which is obviosuly not the paper I was asked to give. The room will be about twenty people: two intellectual historians who work on the Encyclopédie and print culture and think about this period in terms of the Republic of Letters; a political theorist who does work on representation and reads Rousseau mostly through the Social Contract; a theater historian who studies provincial and private performance in France and knows the Genevan material far better than I do; two philosophers of art who care about catharsis and the puzzle of audience emotion; and at least one grad student whose whole thing is gender and public space. I need to be ready for all of them, in their vocabularies, not the generic objections you'd get from an intro seminar.

  Here's the thesis and the sketch, so you know what to aim the objections at. I want to argue that the Letter is not, at bottom, a moral argument about plays corrupting the audience, and that the two moves people usually treat as its weak points are actually its spine. First: Rousseau concedes that a play mostly reflects and intensifies the moeurs already present in the people watching it, and that a genuinely good play can't do much harm — readers usually treat that concession as a rhetorical feint to make the ban sound reasonable, but I take it seriously, and it relocates the whole target. If the theater only amplifies what's already there, then what's objectionable isn't the repertoire, it's the amplifying arrangement: the ticket, the dark room, the hired body on a platform, the fact that two hundred people are made to feel the same thing at the same time while being strictly forbidden from doing anything about it or to each other. That's a crowd that has been rendered private. Second: the long stretch on the Genevan pastors isn't a digression or a tactical flattery of the clergy — pastor and actor occupy the same slot in Rousseau's taxonomy, both being salaried professionals who sell their persons, perform sentiments that aren't theirs, and stand in a relation of dependence on an audience that cannot answer back. And the festival proposal is defined almost entirely negatively, as the subtraction of exactly those three features: no stage, no price of admission, no intermediary, spectators turned into participants. So the Letter, on my reading, is a treatise on the conditions under which an assembly stops being an aggregate of solitary feeling and becomes a public — which makes it continuous with the Social Contract's claim that sovereignty cannot be represented, same structural worry pointed at a different institution. I'll also want to lean on his praise of the Genevan cercles as the existing non-institution that a theater would crowd out.

  What I want from you is a prep sheet, not a defense of me. Give me the eight-ish objections this room will actually raise, ordered by how much damage they'd do, each phrased the way that specific person would phrase it — the theater historian's version of the anachronism charge, the representation theorist's version, the print-culture historian's version — with a two-minute reply I can deliver standing up, and a blunt note on where each reply is soft. I already know some of the hits coming and I want you to sharpen them rather than spare me: that Rousseau was himself a working playwright and composer whose intermède was performed at court and whose early comedy ran at the Comédie-Française, and that he published this Letter into exactly the print market whose logic he's denouncing, so my anti-institution reading is performatively self-undercutting; that the festival passage is itself a piece of extremely good stagecraft, written by a showman, which makes my negative-definition move look like a description of a text rather than of a practice; that the cercles and the games are sex-segregated and he wants them kept that way, so my everybody-is-an-actor story launders an argument about confining women; that Voltaire's private theatricals just outside the city were arguably the live provocation and my reading has no slot for them; and that the political representation analogy is strained, since an actor doesn't decide anything in my name the way a deputy does. Tell me which of these to concede in the first five minutes to take the air out of them, which ones I should hold and how, which would force me to actually restate or abandon the thesis, and which is the one I should pray nobody raises. And if this reading turns out to be something people already say — if I've confidently reinvented a familiar position — just tell me plainly and describe the standard version so I'm not caught out in the room; you don't need to name names or give me a reading list, I won't have time to read anything anyway. Please don't invent quotations from Rousseau, and don't hedge everything into mush — I'd rather you tell me the thesis doesn't survive the theater historian than let me find that out on the day.
