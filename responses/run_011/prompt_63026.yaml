answer: |-
  # Seminar Plan: The Self-Amending Charter
  **Module:** Rules, Authority and Nonsense (Year 2)
  **Session:** Week 6 (Self-Amendment Paradox)
  **Time:** 75 Minutes
  **Students:** 22 (Split into 4 Tables of 5–6 students)
  **Materials:** Whiteboard (pre-written Charter), Index Cards (for amendments), Timer (phone/projector), Chalk/Markers for scoring.

  ---

  ## 1. Preparation (Before Class)
  Write the **Charter** clearly on the whiteboard before students enter. Do not hand out papers. The visual permanence of the board mimics a public constitution.

  **The Charter (Write this exactly):**
  1.  **Objective:** Tables accumulate Points. The Table with the most Points at the end wins.
  2.  **Voting:** Each Table has one Vote. Decisions require a Simple Majority (3 of 4 Tables).
  3.  **Amendment:** Rules may be amended by a Supermajority (3 of 4 Tables).
  4.  **Entrenchment:** Rule 2 (Voting) cannot be amended.
  5.  **Repeal:** Any Rule may be repealed by a Supermajority (3 of 4 Tables).
  6.  **Adjudicator:** One student per round (rotate clockwise). Their ruling on validity is binding until the next round.
  7.  **Retroactivity:** Amendments apply immediately unless the text states otherwise.
  8.  **Validity:** If any Table finishes with 0 Points, the entire simulation is void (Everyone fails).

  **Scoring Board:** Draw a table on the side:
  | Table 1 | Table 2 | Table 3 | Table 4 |
  | :---: | :---: | :---: | :---: |
  | 0 | 0 | 0 | 0 |

  ---

  ## 2. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup & Round 1 (The Grab)
  *   **00-05:** Explain the goal. Assign Tables. Appoint **Adjudicator for Round 1** (e.g., youngest student at Table 1).
  *   **05-10:** **Motion 1:** "Distribute 60 Points: 20 to Table 1, 20 to Table 2, 20 to Table 3."
      *   *Incentive:* Tables 1, 2, 3 have a majority. They will pass this to secure points. Table 4 gets 0.
      *   *Action:* Vote. Update scores on the board. Table 4 now has 0 points.
      *   *Note:* Remind them of **Rule 8 (Validity)**. If Table 4 ends with 0, *everyone* fails.

  ### 00:10 – 00:35: Round 2 (The Trap)
  *   **10-15:** **New Adjudicator** (Table 2). Open floor for Amendments.
      *   Table 4 is desperate. They need points to save the simulation (Rule 8).
      *   The pot is empty (60 points gone). The only source of points is to reclaim Round 1's distribution.
      *   To reclaim Round 1, they must invalidate the vote that passed it.
      *   To invalidate the vote, they must change **Rule 2 (Voting)** retroactively (e.g., "Tables with >10 points were ineligible in Round 1").
      *   *Conflict:* Rule 4 says Rule 2 is entrenched. Rule 5 says Any Rule may be repealed.
  *   **15-25:** **Drafting Phase.** Tables write amendments on index cards.
      *   *Intervention:* If Table 4 doesn't propose a retroactive amendment, remind them: "Rule 7 allows retroactivity. Rule 8 threatens everyone. You have 5 minutes to find a legal path to points." Do *not* suggest the specific wording.
  *   **25-35:** **Debate & Vote.**
      *   Table 4 proposes: *"Repeal Rule 4. Amend Rule 2: No Table holding >10 Points may vote. This applies to Round 1."*
      *   Tables 1, 2, 3 must decide: Lose 20 points each (validating the amendment) or risk Rule 8 (simulation void).
      *   They will likely vote **Yes** to save the game.
      *   **The Paradox:** If the amendment is valid, the vote that passed it (by Tables 1, 2, 3) was invalid (because they held >10 points). If the vote was invalid, the amendment didn't pass.

  ### 00:35 – 00:50: Round 3 (The Adjudication)
  *   **35-40:** **New Adjudicator** (Table 3).
      *   The Adjudicator must rule on whether the Amendment is valid.
      *   This is where the "Rules Lawyers" will shine. Let them argue.
      *   *Constraint:* Adjudicator has 2 minutes to give a binary ruling (Valid/Invalid). Timer visible.
  *   **40-50:** **Consequences.**
      *   If **Valid**: Round 1 is void. Scores reset to 0. The system has successfully self-corrected via paradox.
      *   If **Invalid**: Table 4 has 0 points. Rule 8 triggers. Simulation ends in failure.
      *   *Likely Outcome:* They will fudge it. The Adjudicator will say "Valid" to keep the game going, ignoring the logical contradiction. **This is perfect for the debrief.**

  ### 00:50 – 01:15: Debrief & Theory Mapping
  *   **50-60:** **The Experience.** Ask: "How did it feel to pass a law that made your own authority illegal?" "Did the Adjudicator solve the logic or just pick a result?"
  *   **60-70:** **The Theory (Hart & Suber).**
      *   Map **Rule 1-3** to Hart's *Secondary Rules* (Rules of Change).
      *   Map **Rule 4 vs 5** to the *Paradox of Self-Amendment* (Can a rule limit its own successor?).
      *   Map **Adjudicator** to the *Rule of Recognition* (Who decides what counts as law?).
  *   **70-75:** **The Reveal.** Mention Peter Suber and Hofstadter. Explain that in real law, we usually solve this not by logic, but by *acceptance* (Kelsen's *Grundnorm*).

  ---

  ## 3. The Rulebook (Text for Whiteboard)
  *Copy this precisely. The ambiguity between Rule 4 and 5 is the engine.*

  > **THE CHARTER**
  > 1.  **Objective:** Maximise Table Points.
  > 2.  **Voting:** Each Table = 1 Vote. Majority = 3 Tables.
  > 3.  **Amendment:** Requires Supermajority (3 Tables).
  > 4.  **Entrenchment:** Rule 2 cannot be amended.
  > 5.  **Repeal:** Any Rule may be repealed by Supermajority (3 Tables).
  > 6.  **Adjudicator:** Rotates each round. Rulings are binding.
  > 7.  **Retroactivity:** Permitted if explicitly stated in text.
  > 8.  **Validity:** If any Table ends with 0 Points, all results are void.

  ---

  ## 4. Debrief: Mapping Play to Theory
  Use this structure to anchor their experience in the literature.

  | Game Moment | Conceptual Machinery | Theoretical Hook |
  | :--- | :--- | :--- |
  | **Round 1 Vote** | **Legal Validity** | The vote was *procedurally* valid under the rules at the time. This mirrors Hart's view that law is a system of social facts. |
  | **Rule 4 vs Rule 5** | **Entrenchment** | Rule 4 says "No". Rule 5 says "Yes". This is the *Suber Paradox*. Can a sovereign bind its successor? |
  | **Retroactive Amendment** | **Self-Reference** | The amendment tries to eat its own tail. It uses the old rules to destroy the old rules. |
  | **Adjudicator's Ruling** | **Rule of Recognition** | When logic fails, someone must *decide*. The Adjudicator embodies the ultimate rule of recognition (who is obeyed?). |
  | **Ignoring the Contradiction** | **Political Acceptance** | If they voted "Valid" despite the logic, they demonstrated that legal validity rests on *acceptance*, not just logic (Kelsen/Hart). |

  ---

  ## 5. Candid Note: What the Game Cannot Generate
  **The Logical Resolution.**
  The game creates the *tension* of the paradox, but it cannot resolve it logically, because there *is* no logical resolution.
  *   **The Gap:** In the game, the Adjudicator will simply declare "Valid" to avoid everyone failing (Rule 8). They will prioritise *survival* over *consistency*.
  *   **Your Job:** You must explain that this is exactly how real legal systems handle the paradox. Courts do not solve the logic; they assert a new *Grundnorm* (basic norm).
  *   **Board Example for Debrief:**
      *   *Draw:* A circle labelled "Old Constitution". Arrow pointing to "New Constitution".
      *   *Write:* "If the New Constitution says the Old one is dead, but the Old one says the New one is illegal... who wins?"
      *   *Answer:* "The one everyone obeys." (Write: **Efficacy > Validity**).

  ---

  ## 6. Troubleshooting: Predictable Failures

  **1. The "Rules Lawyer" Monopoly**
  *   **Risk:** One student dominates debate, citing Rule 3 vs Rule 5 endlessly.
  *   **Fix:** The **Adjudicator** controls the floor. Instruct the Adjudicator at the start of their turn: "You have 2 minutes to hear arguments. You may cut off speakers to meet the timer."
  *   **Backup:** If one table dominates, invoke "Order". Remind them that in a seminar, diverse voices are a "Rule of Procedure" you enforce as Lecturer (meta-rule).

  **2. The Paradox Doesn't Trigger**
  *   **Risk:** Tables 1-3 simply give Table 4 ten points from a " Reserve Pot" rather than amending retroactively.
  *   **Fix:** There is no Reserve Pot. The only points are the 60 distributed in Round 1. If they want to give Table 4 points, they *must* take them from 1-3. To take them without consent, they must invalidate Round 1.
  *   **Nudge:** If they stall, ask Table 4: "Read Rule 8. What is your status?" (Answer: "We are voiding the game."). Ask Tables 1-3: "Do you want your points to count?"

  **3. Adjudicator Refuses to Rule**
  *   **Risk:** The student is too shy or confused.
  *   **Fix:** You (Lecturer) act as the "Court of Appeal". If the Adjudicator times out without a ruling, you step in and say: "The Court is deadlocked. The status quo ante remains." This usually panics them into making a decision.

  **4. They Spot the Contradiction Too Early**
  *   **Risk:** They realise Rule 4 and 5 conflict in Round 1 and refuse to play.
  *   **Fix:** This is a feature, not a bug. If they spot it, ask: "Does the contradiction stop you from voting, or does it just mean someone has to decide later?" Push them to vote anyway. Law often proceeds despite contradictions.

  ---

  ## 7. Closing the Session (The Reveal)
  When you mention Suber and Hofstadter at the end, hand out a single slip of paper (or write on the board) with the quote:

  > *"A legal system can tolerate a contradiction better than it can tolerate a vacuum of authority."*

  Tell them: "Today, you didn't just study the paradox. You became the paradox. The fact that the game continued despite the logical error is the most important legal lesson you will learn this year."
