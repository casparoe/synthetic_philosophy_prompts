          4.  Can Monumental history remain honest about accident/mediocrity without ceasing to be monumental?
      *   **Requirements for each:** Explain why it's upstream, tractability for grant-makers (vs. archivists), what counts as settling it, and how a negative answer shifts allocation.
      *   **Constraint:** No summary of the essay, assume text is known, no bibliography. Focus on the argument for ordering.

  2.  **Deconstruct the Candidates & Determine Ordering:**

      *   *Candidate 1: Institutional Plastic Power.* (Can the foundation *be* the subject Nietzsche talks about?)
