answer: |-
  Here is the ranking of the four open questions, ordered from the most upstream (ontological and structural) to the most downstream (operational and curatorial). The logic of this ordering proceeds from the capacity of the agent to act, to the conditions required for action, to the specific risks of the modes of history, and finally to the integrity of the outputs.

  ### 1. Whether plastic power can be predicated of an institution
  **Rank:** First (Most Upstream)

  **Why it is upstream:**
  This is the question of the *subject*. Nietzsche's framework is anthropological and cultural; it speaks of "a man and a people." A private foundation is a legal fiction with rotating trustees, fiduciary duties, and a perpetuity clause that explicitly rejects the "horizon" Nietzsche deems essential for life. If an institution cannot, by definition, possess the "plastic power" to grow beyond itself, incorporate the past, and heal from it, then the foundation is attempting to wield a tool it does not possess. All subsequent questions about how to allocate funds across the three modes presuppose that the allocator is capable of exercising the judgment required to balance them. If the foundation is structurally incapable of this synthesis, the portfolio strategy is a category error.

  **Tractability for grant writers:**
  Extremely low. Grant frameworks deal in measurable outcomes, logic models, and compliance. "Plastic power" is a metaphysical capacity, not a KPI. Settling this requires governance reform, not grant guidelines. It demands the board decide if they are stewards of a dead capital or agents of a living will.

  **What counts as settling it:**
  The board must articulate a theory of *institutional life* that distinguishes the foundation from a standard endowment. This might look like a sunset clause (imposing a horizon), a spending rate that prioritizes impact over preservation, or a governance structure that allows for radical pivots. Settling it means accepting that the institution must risk its own continuity to serve "life."

  **Impact of a negative answer:**
  If the answer is no—that institutions cannot possess plastic power—the three-way split collapses. The foundation should cease trying to curate a philosophical balance of history. Allocation should shift almost entirely to **Antiquarian** projects (preservation of records for others to use) or be disbursed directly to individuals (artists, scholars) who *do* possess plastic power, effectively dissolving the foundation's role as a historical interpreter.

  ### 2. Whether a funder can positively support the capacity for forgetting
  **Rank:** Second

  **Why it is upstream:**
  This is the question of the *environment for action*. Nietzsche posits forgetting not as negligence but as an active faculty that creates the "horizon" within which action is possible. If the foundation cannot actively support forgetting—if it can only refrain from destroying it—then its role is purely negative (protective). However, grant-making is inherently positive (selective funding). If funding memory inevitably crowds out forgetting, the foundation is structurally biased against the "life" it claims to serve. This must be settled before choosing between Critical or Monumental projects, because both require a horizon to function without becoming pathological. Without a settled mechanism for funding forgetting, Critical history becomes nihilism and Monumental history becomes delusion.

  **Tractability for grant writers:**
  Low. It is paradoxical to write an RFP that asks applicants to propose how they will *not* remember. Grant writers are trained to fund production, not restraint. Settling this requires inventing new financial instruments, such as funding the decommissioning of sites, the de-accessioning of archives, or fellowships dedicated to synthesis rather than research.

  **What counts as settling it:**
  A clear operational definition of "productive forgetting." This could be a budget line dedicated to "closure" projects or a policy that funds fewer, larger initiatives to prevent the "historical fever" of over-documentation. It counts as settled when the board accepts that *not* funding a worthy archive is a positive act of horizon-setting.

  **Impact of a negative answer:**
  If the foundation can only refrain from destroying forgetting (passive) but not support it (active), the allocation must shift heavily toward **Antiquarian** history. Since the foundation cannot actively clear the ground for new action, it must default to preserving the past for others to judge later. **Critical** and **Monumental** funding would be reduced, as both require an active horizon that the foundation cannot engineer.

  ### 3. Whether Critical history can avoid condemning the judges' own origins
  **Rank:** Third

  **Why it is upstream:**
  This is the question of *risk*. Assuming the foundation can act (Q1) and create horizons (Q2), it must decide if the Critical mode is safe to deploy. Nietzsche warns that Critical history is dangerous; it requires a strong nature to survive the judgment of the past. If the foundation's endowment, prestige, or very existence is derived from the past it asks communities to judge, Critical projects risk becoming self-immolating. This is downstream of Forgetting because a robust horizon (Q2) might contain the damage, but it is upstream of Monumental honesty because you must know if the "hammer" of critique is usable before you decide if the "monument" can withstand it.

  **Tractability for grant writers:**
  Medium. Grant writers can manage this through scope and framing. They can require applicants to articulate a "path to reconstruction" after the critique. They can avoid funding projects that target the foundation's own donors or history. It is tractable because it is a matter of risk management and conflict of interest policies.

  **What counts as settling it:**
  A determination of whether "justice to the past" is compatible with "viability of the present." Settling it means establishing a threshold: does the project offer a way to live *after* the judgment? If the judgment is terminal, it is not Critical history in Nietzsche's sense; it is suicide.

  **Impact of a negative answer:**
  If Critical history inevitably leads to paralysis or self-condemnation for the communities involved, the foundation must defund the **Critical** portfolio entirely. The allocation would shift to a binary between **Monumental** (inspiration) and **Antiquarian** (preservation). The "discipline" Critical history provides to the other two would be lost, increasing the risk of the Monumental becoming myth and the Antiquarian becoming hoarding, requiring stricter controls on those remaining modes.

  ### 4. Whether Monumental history can remain honest about accident and mediocrity
  **Rank:** Fourth (Most Downstream)

  **Why it is upstream:**
  This is the question of *product integrity*. It presupposes that the agent exists (Q1), the horizon is set (Q2), and the critique is safe (Q3). Only then do we ask what the Monument actually looks like. Nietzsche suggests Monumental history requires a certain distance from the "gray details" of causality. If honesty about mediocrity destroys the monumental effect, the foundation faces a choice between funding inspiring myths or accurate but uninspiring histories. This is the most downstream because it concerns the content of the grants, not the capacity of the funder or the safety of the method.

  **Tractability for grant writers:**
  High. This is a curatorial and editorial question. Grant frameworks can include criteria for "narrative integrity" or require diverse scholarly advisory boards to vet claims of greatness. It is the easiest to operationalize because it deals with the quality of the output, which is what grant reporting usually measures.

  **What counts as settling it:**
  A consensus on the purpose of the Monument. Is it to tell the truth about the past, or to serve the future? Settling it means deciding if a monument that exposes its hero's flaws is still a monument, or if it has become a Critical project.

  **Impact of a negative answer:**
  If Monumental history requires dishonesty to function, the foundation has two choices. Either it funds **Monumental** projects with explicit "myth-making" mandates (risking credibility), or it reclassifies honest inquiries as **Critical** history. If honesty kills the monumental, the **Monumental** allocation should be reduced or merged into **Critical**, acknowledging that true greatness cannot be manufactured by grant criteria. The portfolio would become predominantly **Antiquarian** (facts) and **Critical** (judgment), abandoning the inspirational function.
