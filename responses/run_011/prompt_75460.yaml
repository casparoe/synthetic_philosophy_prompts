      *   Actually, Q2 (Critical History) might be more upstream than Q4. If Critical history is inherently suicidal for the funder, you might rule it out entirely, changing the split. If Forgetting is impossible to fund, you just adjust the *type* of funding.
      *   Let's try to group them by "Viability of the Enterprise" vs. "Execution of the Enterprise."
      *   1. **Institutional Plastic Power:** Viability of the Agent.
