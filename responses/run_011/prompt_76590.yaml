answer: |-
  Here is a decision tree built for your Saturday group. It treats welfare like an instrument calibration problem, because that is what it is. There are nine branch points (questions) and ten leaves (positions). I have laid out the logical space first, then populated the leaves, then noted the empty or unstable cells.

  ### The Decision Tree

  **Branch 1: The Quantity Question**
  *Case:* You have a rock and a feeling. You can put the rock on a scale and get a number in grams. Can you put the feeling on a scale and get a number in "welfare"?
  *   **No:** Welfare is not a quantity; it is a concept like "beauty" or "holiness" that breaks when you try to measure it. → **Leaf 1: Conceptual Eliminativism**
  *   **Yes:** Welfare is a quantity, like temperature or voltage. → *Go to Branch 2.*

  **Branch 2: The Truth Question**
  *Case:* You say "Person A is suffering more than Person B." Your colleague says "No, they aren't." Is one of you objectively wrong (like disagreeing about the voltage), or are you just expressing different attitudes (like disagreeing about whether a painting is nice)?
  *   **Different Attitudes:** Statements about welfare aren't true or false; they are expressions of emotion or command. → **Leaf 2: Non-Cognitivism**
  *   **Objectively Wrong:** There is a fact of the matter, even if it's hard to find. → *Go to Branch 3.*

  **Branch 3: The Scale Question**
  *Case:* To decide who gets the medicine, do you only need to know *who* is worse off (a ranking), or do you need to know *how much* worse off they are (a magnitude)?
  *   **Ranking Only:** We can order people from best to worst, but "distance" between them is meaningless. → **Leaf 3: Ordinalism**
  *   **Magnitude Needed:** We need to know the size of the gain or loss. → *Go to Branch 4.*

  **Branch 4: The Level Comparison**
  *Case:* Two people have different brains and histories. Can we say "Person A is at least as well off as Person B," or are their internal scales incommensurable (like comparing inches to decibels)?
  *   **Incommensurable:** We can measure changes for one person, but we cannot compare status across people. → **Leaf 4: Intrapersonal Cardinalism**
  *   **Commensurable:** There is a common scale of welfare status across people. → *Go to Branch 5.*

  **Branch 5: The Unit Comparison**
  *Case:* If Person A gains 5 units of welfare and Person B gains 5 units, is that the *same amount of good*, or just the same number on different rulers? (Does a "5" mean the same thing for both?)
  *   **Different Rulers:** We can compare who is better off, but we cannot compare the *size* of their gains. → **Leaf 5: Level-Only Comparability**
  *   **Same Ruler:** A gain for A is comparable to a gain for B. → *Go to Branch 6.*

  **Branch 6: The Practice Question**
  *Case:* Even if the scale exists, can we actually read it? Is the barrier that the number doesn't exist, or that our instruments aren't good enough yet?
  *   **Instruments Not Good Enough:** It is possible in principle, but impossible in practice to get the numbers reliably. → **Leaf 6: Practical Skepticism**
  *   **Instruments Available:** We can get the numbers (from brains, reports, or behavior). → *Go to Branch 7.*

  **Branch 7: The Source Question**
  *Case:* Noxious heat on two forearms. Scanner lights up identically. One reports "8 out of 10," the other reports "3 out of 10." Which number is the welfare?
  *   **The Scanner:** Welfare is a brain state; the report is just noise. → **Leaf 7: Neural Realism**
  *   **The Person:** Welfare is tied to the person's mind or choices, not just the neurons. → *Go to Branch 8.*

  **Branch 8: The Adaptation Question**
  *Case:* A person loses her legs. A year later, she reports being just as happy as before. Do we trust her current report, or do we say she has "adapted" and is actually worse off?
  *   **Trust Her:** Welfare is getting what you want or feel; if she says she's fine, she's fine. → **Leaf 8: Preference Satisfaction** *(Note: Usually leads to Branch 9)*.
  *   **Don't Trust Her:** Welfare is about what is *good for* her, regardless of her adapted feelings. → **Leaf 9: Objective List Theory**
  *   *(Correction for Tree Flow)*: To keep the leaf count right, let's make "Preference Satisfaction" go to Branch 9, and "Objective List" a leaf.
      *   **Don't Trust Her:** → **Leaf 9: Objective List Theory**
      *   **Trust Her:** → *Go to Branch 9.*

  **Branch 9: The Aggregation Question**
  *Case:* You have the numbers. To decide policy, do you simply add them up (a headache for a million = a million headaches), or do you weight the gains of the miserable more heavily (a headache for a million < one torture)?
  *   **Add Them Up:** Every unit counts the same, regardless of who has it. → **Leaf 10: Total Summation**
  *   **Weight the Miserable:** Gains for the worse off count for more. → **Leaf 11: Prioritarianism**
