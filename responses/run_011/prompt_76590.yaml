  ---

  ### The Leaves (Positions)

  **Leaf 1: Conceptual Eliminativism**
  *Position:* Welfare is not the kind of thing that comes in units; asking "how much" is a category error.
  *The Awkward Bit:* You have to explain why we talk about "improving lives" without implying we are measuring a quantity.

  **Leaf 2: Non-Cognitivism**
  *Position:* Claims about welfare aren't true or false; they are expressions of attitude (like saying "Boo to suffering!").
  *The Awkward Bit:* You cannot say a policy is "wrong," only that you dislike it.

  **Leaf 3: Ordinalism**
  *Position:* We can rank people from better to worse off, but the distance between them is meaningless.
  *The Awkward Bit:* You cannot justify trading a small gain for many against a large loss for one, because "size" doesn't exist.

  **Leaf 4: Intrapersonal Cardinalism**
  *Position:* I can measure how much *you* gain or lose, but I cannot compare your gain to *my* gain.
  *The Awkward Bit:* This blocks almost all social policy; you can't say robbing Peter to pay Paul is bad, because you can't compare Peter's loss to Paul's gain.

  **Leaf 5: Level-Only Comparability**
  *Position:* We can say who is worse off (levels), but we cannot compare the size of their gains (units).
  *The Awkward Bit:* This is the home for the view you mentioned: it allows identifying the miserable (for priority) but struggles to justify summing their gains without assuming unit comparability implicitly.

  **Leaf 6: Practical Skepticism**
  *Position:* Interpersonal comparison is possible in principle, but our instruments (surveys, scans) are too noisy to trust.
  *The Awkward Bit:* You must act as if you don't know the numbers, even if you believe they exist, which often leads back to Ordinalism in practice.

  **Leaf 7: Neural Realism**
  *Position:* Welfare is a brain state; if the scanner matches, the welfare is equal, regardless of what the person says.
  *The Awkward Bit:* You might have to tell a person they are not happy even if they insist they are, because their neurons say otherwise.

  **Leaf 8: Objective List Theory**
  *Position:* Welfare is about having certain things (health, friendship), not just feeling good; adaptation does not change the score.
  *The Awkward Bit:* You must override the person's own judgment about their life, which looks paternalistic.

  **Leaf 9: Total Summation (Harsanyi Aggregation)**
  *Position:* Welfare is subjective (trust the report), and every unit counts equally; maximize the total sum.
  *The Awkward Bit:* This implies a year of mild headaches for a million people can outweigh one hour of torture for one person, if the numbers add up.

  **Leaf 10: Prioritarianism**
  *Position:* Welfare is subjective and comparable, but gains for the worse off count for more than gains for the better off.
  *The Awkward Bit:* As you suspected, this is hard to seat: it needs cardinal levels to identify the "worse off," but claims not to need full unit comparability, which is mathematically tense.

  ---

  ### The Empty Cells (Logical Space Nobody Occupies)

  **1. "Unit Comparability without Level Comparability"**
  *The Cell:* You can say "A's gain equals B's gain," but you cannot say "A is better off than B."
  *Why Empty:* Incoherent. If you have a common ruler for gains (units), you implicitly have a common ruler for status (levels). You can't measure the step size without agreeing on the ground you're stepping on.

  **2. "Neural Realism with Prioritarian Weighting"**
  *The Cell:* Welfare is brain states, but we weight the brain states of the "worse off" more heavily.
  *Why Empty:* Unexplored/Unappealing. If welfare is just neural firing, most realists want to sum it directly. Weighting it requires a second judgment about who "deserves" weight, which duplicates the work.

  **3. "Ordinalism with Aggregation"**
  *The Cell:* We can only rank people, but we still want to sum their welfare to make policy.
  *Why Empty:* Mathematically impossible. You cannot add rankings (1st + 1st does not equal 2nd). This cell is occupied only by people who haven't checked the math.

  ---

  ### Instrument Limitations (Indistinguishable Leaves)

  **Leaf 7 (Neural Realism) vs. Leaf 9 (Total Summation)**
  In practice, these often collapse. If you believe welfare is a brain state (Neural), you almost always sum those states (Total Summation). It is rare to find a Neural Realist who argues we should weight the brain states of the poor more heavily. If your group debates these two, they may find they are arguing about *measurement* (where to read the number) rather than *ethics* (what to do with it).

  **Leaf 5 (Level-Only) vs. Leaf 10 (Prioritarianism)**
  These are difficult to pull apart. Prioritarianism *requires* knowing who is worse off (Level Comparability). However, to apply the "priority weight," you effectively need to compare the *value* of a gain across people (Unit Comparability). Leaf 5 claims you can't do the latter, while Leaf 10 does it anyway. Your group may find that Leaf 10 is just Leaf 5 with a hidden assumption smuggled in.

  *(Note on your typo: I have used the standard spelling "comparison" throughout, but rest assured the logical structure holds regardless of the typography.)*
