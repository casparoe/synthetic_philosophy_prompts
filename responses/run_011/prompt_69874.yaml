      *   *Civilization and Its Discontents (1930):* Discusses the "oceanic feeling" (Romain Rolland). Freud admits he doesn't feel it. He theorizes it as a residue of the "primary ego-feeling" (infantile undifferentiation). It's regressive.
      *   *Psychoanalysis & Therapy:* The goal is to make the unconscious conscious. To replace neurotic misery with ordinary unhappiness. To strengthen the Ego against the Id and Superego.
      *   *The "Illusion" Distinction:* An illusion is driven by a wish. It *can* be true (e.g., the wish to be rich might come true), but its *origin* is the wish, not evidence.
      *   *The Psilocybin Data:* Drug induces experience -> Experience reduces death anxiety -> Experience feels "real/religious" -> No doctrine taught.

  3.  **Drafting the "Best Guess" (Freud's Likely Stance):**
