answer: |-
  This is a sophisticated set of intuitions. You have correctly identified that simple counterfactual dependence is too broad (it makes the stranger in Case 4 a cause) and that a purely physicalist view is too narrow (it excludes Case 1).

  Below is an analysis of candidate principles, the costs of adopting them, and an assessment of where your verdicts align with or diverge from philosophical consensus.

  ### Part 1: Candidate Principles

  There is no consensus on a single principle for omission causation. However, two distinct approaches survive your constraints.

  #### Candidate 1: The Relevant Default Principle
  **Statement:** An absence $A$ causes outcome $O$ if and only if:
  1.  **Dependence:** Had $A$ occurred, $O$ would not have occurred (counterfactual dependence).
  2.  **Default Status:** The occurrence of $A$ was part of the *relevant default course of events* for the system in question.
  3.  **Salience:** The default is established by either (a) biological/physical normalcy (e.g., rain for plants), (b) mechanical function (e.g., software flags), or (c) normative expectation (e.g., contracts, roles).

  *   **Motivation:** This captures your distinction between Case 1 (contractual default) and Case 2 (no default), and Case 3 (biological default) vs. Case 4 (no default). It handles Case 11 (mechanical function).
  *   **Contestation:** **Highly Contested.** This view (associated with Hart & Honoré, and refined by McGrath) treats causation as partly mind-dependent or context-dependent. Many metaphysicians argue causation must be intrinsic to the physical history, not dependent on "defaults."

  **Verdicts on Your Cases:**
  *   1 (Paid Neighbor): **Cause.** (Normative default).
  *   2 (Other Neighbor): **Not Cause.** (No default).
  *   3 (Rain): **Cause.** (Biological/Statistical default).
  *   4 (Stranger/Meteor): **Not Cause.** (Not part of the fern's survival system).
  *   5 (Lifeguard): **Cause.** (Role default).
  *   6 (Off-duty Swimmer): **Not Cause.** (No role default).
  *   7 (Tech closes): **Cause.** (Act).
  *   8 (Tech walks): **Not Cause.** (No duty to open).
  *   9 (Two Nurses): **Both Cause.** (Both were part of the safety default; overdetermination handled by treating each as a sufficient default failure).
  *   10 (Ranger): **Cause (Effective) / Not Cause (Ineffective).** (Fits Dependence clause).
  *   11 (Software): **Cause.** (Mechanical function default).
  *   12 (Brother): **Not Cause.** (See analysis below).

  **Cost:**
  *   **Case 12:** This principle requires *ability* for an omission to exist. If the brother was hospitalized, the "default" of him feeding the cat was broken by force majeure. The principle verdict is that his omission did not cause the death; the cause was the hospitalization or the starvation itself. You must accept that his failure is not a cause, only an excused condition.
  *   **Metaphysical Cost:** You must accept that causation is not purely physical. The physical history of Case 2 and Case 1 is identical; the difference is entirely normative/statistical.

  #### Candidate 2: The Pragmatic Dissolution (Lewisian)
  **Statement:** All counterfactual dependencies are metaphysically causal. However, we only *assert* causation when the absence is *explanatorily salient*. Salience is determined by normative expectations and conversational context.
  *   **Motivation:** Preserves the physical unity of causation.
  *   **Contestation:** **Contested.** Many (e.g., Dowe, Moore) argue this denies the reality of the distinction you feel.

  **Verdicts on Your Cases:**
  *   **Metaphysical Verdict:** In *all* cases (1 through 12, including the stranger in 4 and the swimmer in 6), the absence is a cause.
  *   **Assertability Verdict:** We only *say* "caused" in 1, 3, 5, 7, 9, 10 (effective), 11.

  **Cost:**
  *   **High Cost:** You must abandon the idea that there is a *fact of the matter* distinguishing Case 1 from Case 2. On this view, the stranger in Case 4 *is* a cause, just not a salient one. If you insist that Case 2 is *not a cause* (metaphysically), this principle fails.
  *   **Case 6:** You must admit the swimmer *did* cause the death, but we don't blame them for the causation, only the inaction. This contradicts your "entirely confident... did not cause" verdict.

  ---

  ### Part 2: Where Your Verdicts May Not Be Causal

  You suspect Cases 6 and 11 are tracking something other than causation. You are likely correct.

  **Case 6 (Off-duty Swimmer):**
  *   **Diagnosis:** You are tracking **Moral Responsibility**, not Causation.
  *   **Consensus Check:** **Settled/Contested Boundary.** It is widely agreed that moral blame usually requires causal contribution. To say someone is "gravely blameworthy" for a death they did not cause is a minority view (often associated with Kantian duties of virtue rather than consequence).
  *   **The Confusion:** You may be conflating "causing the death" with "being the agent responsible for preventing it." If you maintain they did not cause the death, you must explain what the blame attaches to. (Answer: Violation of a moral duty, not the outcome).
  *   **Recommendation:** If you want a unified causal theory, you should likely concede that the swimmer *is* a cause, but that we excuse them from *responsibility*. If you hold firm that they are not a cause, you are adopting a **Normative Theory of Causation** (Candidate 1), where "cause" is partly a moral/legal label.

  **Case 11 (Software Flag):**
  *   **Diagnosis:** You are tracking **System Function**.
  *   **Consensus Check:** **Contested.** Is a software non-event an event?
  *   **The Confusion:** You say the program "omitted nothing — it computed exactly what it computes." This suggests you view the cause as the *state* of the software, not an *omission*.
  *   **Recommendation:** Treat the "missing flag" as a **Positive State** (the system being in state 'No-Alert'). This dissolves the omission problem. The cause is the system outputting '0' instead of '1'. This aligns with Case 3 (Lack of rain = State of dryness).

  **Case 12 (Hospitalized Brother):**
  *   **Diagnosis:** **Ought Implies Can.**
  *   **Consensus Check:** **Settled.** Most accounts of omission require the agent to have the *ability* to perform the act.
  *   **Verdict:** If he could not go, he did not "fail to feed." He was "prevented from feeding."
  *   **Cost:** You must choose: Either (A) He caused the death (rejecting "Ought implies Can" for causation) or (B) He did not cause the death (accepting that inability negates the omission). Your hesitation suggests you feel the *duty* remained even if the *ability* vanished.
  *   **Resolution:** The cause of the cat's death is the brother's absence *plus* the lack of a backup. The brother's hospitalization is the cause of the brother's absence.

  ---

  ### Part 3: Discriminating Cases

  Here are four cases designed to separate Candidate 1 (Relevant Default) from Candidate 2 (Pragmatic Dissolution) and test your specific intuitions.

  **Case A: The Automatic Sprinkler**
  A museum has a fire suppression system. A fire starts. The system fails to activate due to a rare sensor glitch. The painting burns.
  *   **Candidate 1:** Cause. (Mechanical default/function).
  *   **Candidate 2:** Cause (but maybe not salient if glitches are common).
  *   **Your Test:** Does this feel more like Case 3 (Rain) or Case 4 (Meteor)? If it feels like Case 3, you support Candidate 1's "System Function" clause.

  **Case B: The Customary Rescue**
  In a remote village, it is not the law, but it is a 100-year statistical regularity that neighbors rescue each other from house fires. A neighbor sees a fire and does nothing. The owner dies.
  *   **Candidate 1:** Cause. (Statistical default establishes relevance, even without law).
  *   **Candidate 2:** Cause (salient due to statistical norm).
  *   **Your Test:** You rejected Case 2 (Neighbor with key) because there was "no relationship." If you count the Village Neighbor as a cause, your principle relies on **Statistical Normalcy**. If you reject them, your principle relies on **Normative Duty**. (This discriminates between the two halves of your tentative principle).

  **Case C: The Two Buttons (Overdetermination)**
  Two executioners stand over a prisoner. Both are ordered to press a button that releases poison. Both refrain. The prisoner lives (wait, reversal).
  *Revised:* Two safety switches must *both* be pressed to stop a reactor. Two technicians, each required to press one, both fail. Reactor melts down.
  *   **Candidate 1:** Both caused it. (Both were required defaults).
  *   **Candidate 2:** Both caused it. (Counterfactual dependence holds for each: if A had pressed, no meltdown).
  *   **Your Test:** You accepted this in Case 9. The test is: Does this hold if *one* technician was unauthorized? If Technician A was required, and Technician B was a volunteer who *usually* helps but wasn't on duty, and both failed. Did B cause it?
      *   If Yes: Statistical Default.
      *   If No: Normative Duty.

  **Case D: The Preempted Omission**
  A gardener fails to water a plant (Case 1). However, unknown to anyone, the water main to the house was cut by a vandal that morning. Even if the gardener had turned the tap, no water would have come.
  *   **Candidate 1:** Not Cause. (Dependence fails: watering would not have saved it).
  *   **Candidate 2:** Not Cause. (Counterfactual dependence fails).
  *   **Your Test:** This matches Case 10 (Firebreak). It confirms you are committed to **Actual Counterfactual Dependence**, not just "breach of duty."

  ---

  ### Part 4: Acts, Omissions, and Metaphysics (Case 8)

  **Question:** Does any workable principle need a distinction between acts and omissions at the metaphysical level?
  **Answer:** **No.**
  **Consensus:** **Settled.** There is no metaphysical distinction between "closing a valve" and "not opening a valve." Both are descriptions of the same physical history involving the position of the valve and the agent's body.

  **Analysis of Case 8:**
  You note the physical history is identical in Case 7 (Tech closes valve) and Case 8 (Tech walks past closed valve).
  *   **The Difference:** The difference is entirely in the **Counterfactual Baseline**.
      *   In Case 7, the baseline is "Valve Open." The Tech changed the world.
      *   In Case 8, the baseline is "Valve Closed." The Tech left the world as it was.
  *   **Why the Verdict Differs:** We assign causation to the *deviation* from the normal/expected course.
      *   Case 7: Deviation from safety norm.
      *   Case 8: Adherence to safety norm (assuming Tech has no duty to open).
  *   **Conclusion:** You do not need a metaphysical distinction. You need a **Modal/Normative Baseline**. Causation is not just about what happened; it is about what happened *relative to what was expected to happen*. This confirms Candidate 1 (Relevant Default).

  ---

  ### Part 5: Summary of Costs and Recommendations

  **Which verdict is cheapest to give up?**
  1.  **Case 6 (Off-duty Swimmer):** This is the most philosophically expensive verdict to keep. Maintaining "Blameworthy but Not Cause" requires a complex moral theory that decouples agency from outcome.
      *   *Recommendation:* Concede the swimmer is a **cause** but not **responsible**. This aligns you with the majority of causal theorists and simplifies your principle.
  2.  **Case 2 vs. Case 3 (Neighbor vs. Rain):** You treat Rain as a cause but the Neighbor as not. This implies your principle is **not purely Normative**. It must include **Natural Defaults**.
      *   *Recommendation:* Adopt the **Relevant Default Principle**. It accommodates Rain (Natural Default), Paid Neighbor (Contractual Default), and Lifeguard (Role Default), while excluding the Stranger (No Default).
  3.  **Case 12 (Brother):**
      *   *Recommendation:* Rule **Not Cause**. An omission requires the possibility of action. If he was hospitalized, the causal chain is: Illness $\rightarrow$ Absence $\rightarrow$ Starvation. The brother is the *locus* of the absence, but not the *cause* of it.

  **Final Proposed Principle for You:**
  > **The Salient Default Principle:** An absence $A$ is a cause of $E$ if $E$ counterfactually depends on $A$, and $A$ represents a deviation from the **Salient Default** for that system. The Salient Default is determined by (1) Biological/Physical norms (Rain), (2) Mechanical Function (Software), or (3) Normative Obligation (Contracts/Roles).

  **What this costs you:**
  *   It forces you to admit that Case 2 and Case 6 are *physically* identical to Case 1 and Case 5, differing only in normative context. (You seem okay with this).
  *   It forces you to rule Case 12 as "Not Cause" (Inability negates omission).
  *   It forces you to clarify Case 6: Either the swimmer is a cause (and you were wrong about causation) or the swimmer is not blameworthy for the *death* (only for the *insult* to morality).

  **Settled vs. Contested Markers:**
  *   *Settled:* No metaphysical difference between acts and omissions (Case 8).
  *   *Settled:* Counterfactual dependence is necessary for omission causation (Case 10).
  *   *Contested:* Whether normative expectations can determine causal facts (Candidate 1 vs. Physicalism).
  *   *Contested:* Whether moral blame requires causal contribution (Your Case 6).
  *   *Idiosyncratic:* Your confidence in Case 6 (Blameworthy/Not Cause) is rare. Most philosophers argue that if you didn't cause it, you aren't to blame for the *outcome*, only for your *character*.
