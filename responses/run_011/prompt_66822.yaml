  - Then commit. Name the step you reject and explain exactly what has to be true for it to look plausible while being wrong. If you think the argument is actually valid and the question is just which premise is cheapest to drop, say that instead.
  - Explain why that step felt obviously fine to me. I want the diagnosis, not just the verdict.
  - Tell me what's left of Skolem's paradox as an interesting result once the slide is removed. Does it stop being paradoxical, or does it stay weird in a smaller way?
  - Price the options for me. I'd rather give up (9) than (2) or (4), obviously. But (6) is the step I thought was the whole *point* of the paradox, so tell me what it costs me to keep (6) and lose (8), versus keeping (8) and rewording (6).
  - And is (9) undercutting itself a separate problem, or is it just a symptom of the same flaw?

  Also — don't be nice about it. If a step is flat-out invalid, say "this step is invalid" and show me the counterexample or the ambiguity. Two typos from me is enough, I don't need any from you.
