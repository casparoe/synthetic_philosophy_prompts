answer: |-
  **MEMORANDUM**

  **TO:** Program Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Decision Framework for Cycle-End Renewals and Rubric Coherence

  **Executive Summary**

  We face a decision that tests the coherence of our evaluation metrics against the moral intuitions of our governance. We have two renewal requests totaling $1.28 million against a $2.2 million annual cap. The Mobile Clinic Network (ADS Score 4) requests $900,000 with proven high-volume impact. The Priority Population Program (ADS Score 5) requests $380,000 with unproven impact but serves our most deprived demographic.

  A trustee amendment proposes capping the Clinic Network at $380,000 to achieve funding parity with the Priority Program, moving the surplus to a locked reserve.

  I recommend we **reject the amendment** and **fund both grants at their requested levels**, subject to specific evaluation milestones for the Priority Program. Simultaneously, we must **withdraw the current doubling rubric** as mathematically incoherent. We can honor the trustee's moral intuition—prioritizing the worst-off—without engaging in "leveling down" that reduces total health outcomes without aiding the target population.

  **1. The Metric Problem: Ordinal Scales and Cardinal Weights**

  Our current rubric applies a geometric weight (1, 2, 4) to the Access Deprivation Scale (ADS) scores. This treats the ADS as a cardinal measure, implying that the deprivation gap between Score 3 and 4 is identical to the gap between 4 and 5, and that a Score 5 population is precisely "twice as deprived" as a Score 4 population.

  Our external evaluator has explicitly stated the ADS is ordinal. It ranks relative deprivation but measures no magnitude. Therefore, multiplying program benefits by a factor of 4 is mathematically invalid. It creates a false precision that dictates our funding decisions based on an arithmetic error.

  **Principle:** A foundation cannot apply a cardinal multiplier to an ordinal rank. To do so is to claim knowledge of the "distance" between populations that we do not possess.

  **Recommendation:** The Committee should vote to withdraw the doubling rubric immediately. Going forward, the ADS score should function as a **threshold or tie-breaker**, not a multiplier. For example, we might mandate that a minimum percentage of our portfolio serves ADS 5 populations, or we might use the score to prioritize funding when cost-effectiveness is otherwise equal. It cannot be used to artificially inflate the score of a less effective program serving a slightly more deprived group.

  **2. The Trustee's Amendment: Leveling Down vs. Priority**

  The proposed amendment rests on a powerful moral intuition: it is unjust to lavish resources on the "less desperate" (ADS 4) while the "most desperate" (ADS 5) receive significantly less. This is a prioritarian view—that we owe a greater duty to those who are worst off. This intuition is correct and should guide our foundation's soul.

  However, the mechanism proposed—capping the Clinic Network and moving funds to a locked reserve—fails to honor this intuition in practice. It achieves "parity" only by reducing the Clinic Network's budget, not by increasing the Priority Program's. Because the reserve is locked against program spending for ten years, those funds effectively exit our mission ecosystem.

  This creates a "leveling down" scenario:
  *   **The ADS 5 population** gains nothing (their funding remains $380,000).
  *   **The ADS 4 population** loses significant services (funding cut from $900,000 to $380,000).
  *   **The Foundation** reduces its total health impact by over $500,000 annually.

  We honor the priority of the worst-off by funding the ADS 5 program *despite* its lower proven cost-effectiveness, not by crippling the ADS 4 program. The very act of approving the $380,000 request for the Priority Program—given its unproven effect size and smaller reach—is already a concession to priority over pure efficiency. We need not inflict harm on the ADS 4 patients to validate that concession.

  **3. Specific Dispositions and Conditions**

  Given the $2.2 million cap, funding both requests ($1.28 million total) leaves sufficient discretionary capital for other grants and operations. I propose the following dispositions:

  **A. Mobile Clinic Network (ADS 4)**
  *   **Disposition:** Approve full request of **$900,000**.
  *   **Rationale:** The evidence is robust. 3,400 patients gaining control of chronic conditions represents a massive aggregation of benefit. In the absence of a valid metric to weight the ADS 5 population as "four times" more important, we cannot justify halving a proven intervention.
  *   **Condition:** None beyond standard reporting. The program is mature and stable.

  **B. Priority Population Program (ADS 5)**
  *   **Disposition:** Approve full request of **$380,000**, but structured as a **bridge grant**.
  *   **Rationale:** We fund this to honor our commitment to the worst-off demographic, acknowledging that high-deprivation populations often present higher barriers to intervention and lower initial metrics.
  *   **Condition:** The grant is contingent on the successful completion of the rigorous evaluation due in eighteen months. We should structure the payment schedule so that the final 20% of the award is withheld pending the release of the evaluation data.
  *   **Future Scenario:** If the pending evaluation confirms a positive effect size, this program should be elevated to "core portfolio" status with a pathway to multi-year renewal comparable to the Clinic Network. If the evaluation shows no effect, we must be prepared to sunset the program at the end of this term, regardless of the population's deprivation score. We cannot fund ineffectiveness indefinitely, even for the worst-off.

  **4. Path Forward**

  The tension in this cycle arises because we are trying to solve a moral problem (who deserves help most?) with a broken tool (the doubling rubric).

  By rejecting the amendment, we preserve health outcomes for 3,400 patients. By funding the Priority Program in full, we honor our duty to the worst-off. By withdrawing the rubric, we restore integrity to our decision-making process.

  I ask the Committee to circulate this opinion prior to our meeting so we can enter the discussion aligned on the mathematical incoherence of the current weights. We can then focus our debate where it belongs: on how to sustainably serve the ADS 5 population without dismantling the effective services we provide to the ADS 4 population.

  I look forward to discussing this with you on [Date of Meeting].
