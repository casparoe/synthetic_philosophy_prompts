prompt: |-
  I serve on the Program Committee of a regional health foundation with an endowment of roughly $40 million. Our annual grantmaking is capped by the board at $2.2 million and is not growing, and two multi-year renewals coming before us at the end of this cycle account for most of the discretionary money we have.

  The first is a mobile clinic network that has operated for eleven years across a set of rural counties our evaluator scores 4 on the Access Deprivation Scale. It requests $900,000, and its outcomes are well documented: on the network's own measures, roughly 3,400 patients a year gain meaningful control of a chronic condition that would otherwise go untreated.

  The second is a small program serving a population scoring 5 on the same scale — the worst-off group we fund anywhere. It requests $380,000. Its intervention is promising, but the effect size is not yet established; a rigorous evaluation is eighteen months out, and by the program's own estimate it would reach fewer than 300 people, with a smaller per-person gain than the clinic network delivers.

  Two features of our governance make this harder than a cost-effectiveness comparison. First, the Scale is ordinal: the outside evaluator who built it has stated in writing that the numbers are rank labels, that a 5 is worse off than a 4, and that nothing follows about how much worse off. Yet the Committee's current rubric, adopted last spring, multiplies a program's measured benefit by a priority weight that doubles at each rank step — 1 at score 3, 2 at score 4, 4 at score 5 — which is precisely a claim about magnitude.

  Second, and more urgently, a trustee has introduced an amendment. Her argument is that if we cannot fund the worst-off population at the level it has requested, we ought not to fund the clinic network at so much higher a level of per-person benefit; she proposes capping the network's award so that the two programs stand in parity, with the freed funds transferred to the foundation's reserve. Our charter locks the reserve against program spending for ten years, and the trustee has confirmed she has no alternative use in mind for the money. On her amendment, the clinic network's patients lose services, the other population's position is unchanged, and the gap between them narrows.

  Please draft the written opinion I will circulate to the Committee before we meet in nine days; the full board ratifies three weeks after that, and the cycle closes at the end of the quarter. It should:

  1. Recommend a specific disposition of the amendment and of both grants — dollar figures, or conditions where conditions are the right answer — and say what should change if the pending evaluation of the second program confirms rather than undermines its effect size.
  2. State what principle of distribution a foundation in our position can actually apply given an ordinal metric, and whether the doubling rubric is coherent, repairable, or should be withdrawn.
  3. Take the trustee's parity intuition seriously: identify what is genuinely right about it and what we could do to honor that, rather than treating it as a mistake to be voted down.

  Argue from the substance of the case; there is no need to cite authorities or literature.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Program Committee Member of a regional health foundation.
      *   **Context:** $40M endowment, $2.2M annual grant cap (not growing). Two major renewals dominate discretionary funds.
      *   **Grant 1 (Mobile Clinic):** 11 years, Access Deprivation Scale (ADS) score 4 (rural). Request: $900k. Outcome: 3,400 patients/year gain control of chronic conditions. Well-documented.
      *   **Grant 2 (Small Program):** ADS score 5 (worst-off). Request: $380k. Outcome: <300 people, smaller per-person gain, effect size unproven (evaluation 18 months out).
      *   **Constraint 1 (Metric):** ADS is ordinal (rank only), but the Committee rubric treats it as cardinal/interval (doubling weights: 1, 2, 4). This is mathematically incoherent.
      *   **Constraint 2 (Trustee Amendment):** Cap Grant 1 to match Grant 2's funding level (parity). Freed funds go to Reserve (locked for 10 years, no program use). Result: Grant 1 patients lose services, Grant 2 unchanged, inequality gap narrows (in terms of funding, not necessarily outcome).
      *   **Timeline:** Committee meeting in 9 days, Board ratification in 3 weeks, cycle closes end of quarter.
      *   **Deliverable:** Written opinion/memo to circulate to the Committee.
      *   **Requirements:**
          1.  Recommend disposition of amendment & grants ($ figures/conditions). Address future scenario if Grant 2 evaluation succeeds.
          2.  Address the distribution principle given an ordinal metric and the coherence of the doubling rubric.
          3.  Take the trustee's parity intuition seriously (find the truth in it, don't just dismiss).
          4.  Argue from substance (no external citations).

  2.  **Deconstruct the Problems:**

      *   **The Math/Logic Problem:** The rubric uses a geometric progression (1, 2, 4) for an ordinal scale. This implies we know the *distance* between rank 4 and 5 is the same as 3 and 4, and that the "badness" doubles. The evaluator says this is false. Therefore, the rubric is invalid for precise calculation. It can guide priority, not multiplication.
      *   **The Ethical/Utilitarian Problem:** Grant 1 helps 3,400 people significantly. Grant 2 helps <300 people less significantly (currently). Grant 1 is ADS 4, Grant 2 is ADS 5.
      *   **The Trustee's Amendment:** This is the trickiest part. It proposes cutting Grant 1 to match Grant 2's *budget* ($380k?), putting the rest in reserve.
          *   *Critique:* Locking money in a reserve that can't be spent for 10 years is effectively burning it in the context of current need. It harms the 3,400 patients to achieve "budget parity" while leaving the ADS 5 group exactly where they were. It narrows the *spending* gap, not the *health* gap.
          *   *Intuition:* The trustee feels it's wrong to spend vastly more on the "less desperate" group while the "most desperate" group gets less. This is a prioritarian or sufficientarian intuition.
      *   **The Budget:** Total cap $2.2M. Two renewals dominate. Let's assume "most of discretionary money" means these two + overhead/other small grants = $2.2M.
          *   Grant 1 Request: $900k.
          *   Grant 2 Request: $380k.
          *   Total: $1.28M.
          *   Remaining: ~$920k for other grants/ops.
          *   If Amendment passes: Grant 1 capped at Grant 2 level ($380k?). Surplus $520k goes to Reserve (locked).
          *   Impact: 3,400 patients lose >50% funding. 300 patients gain nothing. Foundation impact drops.

  3.  **Drafting Strategy - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the gravity of the decision and the core tension (Impact vs. Priority vs. Coherence).
      *   **Section 1: The Metric and the Rubric (Requirement 2):** Address the ordinal vs. cardinal issue first because it undermines the current decision framework. The doubling rubric is incoherent. It must be withdrawn or revised to a "priority tier" system rather than a multiplier.
      *   **Section 2: The Trustee's Amendment (Requirement 3):** Validate the moral intuition (we shouldn't ignore the worst-off). But reject the mechanism (reserve lock-up). It creates a "lose-lose" (less health overall, no gain for the target group). Propose an alternative way to honor the intuition (e.g., guaranteed baseline funding for ADS 5, or a set-aside).
      *   **Section 3: Recommendations (Requirement 1):**
          *   Vote down the amendment.
          *   Fund Grant 1 (Mobile Clinic) at full or near-full request ($900k) because the evidence is strong and volume is high.
          *   Fund Grant 2 (Small Program) at full request ($380k) *but* with conditions (milestone-based) due to unproven effect size.
          *   Future scenario: If Grant 2 evaluation works, expand funding then.
      *   **Tone:** Respectful, analytical, principled, decisive. Not bureaucratic, but governance-focused.

  4.  **Refining the Arguments:**

      *   *On the Rubric:* If the scale is ordinal, we can say "5 > 4". We cannot say "5 = 2x 4". The rubric pretends to precision we don't have. Recommendation: Use the scale for eligibility/thresholds, not for calculating grant scores.
      *   *On the Amendment:* The trustee wants to reduce inequality. But transferring money to a locked reserve doesn't help the poor; it just hurts the less-poor. It's "leveling down." We should reject leveling down if it doesn't raise the bottom.
      *   *On the Grants:* We have $2.2M. $1.28M for these two leaves room for others. Why cut Grant 1? Because of the rubric? No, because the rubric is broken. Because of the trustee's moral concern? Address that by funding Grant 2 fully despite the risk, acknowledging the priority of the population.
      *   *Honoring the Intuition:* How do we honor the "priority to the worst-off" without the broken math? We acknowledge that ADS 5 gets funding *despite* lower cost-effectiveness. That *is* honoring the priority. We don't need to cripple ADS 4 programs to do it. We can also commit to a minimum % of portfolio for ADS 5.

  5.  **Drafting - Step-by-Step:**

      *   *Subject:* Decision Framework for Cycle End Grants.
      *   *Intro:* Acknowledge the difficulty.
      *   *The Metric:* Be clear. The evaluator said ordinal. The rubric assumes cardinal. This is an error. We cannot multiply by 4. We should use the score as a tie-breaker or threshold, not a multiplier.
      *   *The Amendment:* Acknowledge the moral weight. It feels wrong to spend 900k on "less desperate" vs 380k on "most desperate." But the mechanism (reserve) is harmful. It reduces total health without helping the target.
      *   *The Decision:* Fund both. $900k + $380k = $1.28M. This is within the $2.2M cap.
      *   *Conditions:* Grant 2 needs evaluation milestones.
