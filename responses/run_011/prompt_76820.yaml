answer: |-
  A biopic can indeed wrong the dead person herself, because a human being's interest in the integrity of their life's narrative survives their biological cessation. To claim otherwise is to reduce a person to a breathing organism whose moral existence evaporates the moment their heart stops, ignoring the way we construct meaning across time. The standard defense of biographical fabrication rests on the premise that harm requires experience—that because the dead cannot feel shame, anger, or sorrow, they cannot be injured. This is a category error. It conflates harm with hurt feelings. While the dead cannot suffer psychologically, they can be thwarted in their enduring interests, specifically the interest in how their agency and character are recorded for the future. When a filmmaker invents a choice the subject would have refused, they are not merely confusing the audience; they are violating the moral identity the subject spent a lifetime building.

  To understand this, we must take seriously the concept of posthumous interests. We generally accept that a person's will should be honored after death. If you promise a dying friend you will scatter their ashes in a specific river and instead you dump them in a trash can, you have wronged them. They do not know it, but the betrayal is real because it violates a directive issued when they were a moral agent capable of holding interests. Reputation functions similarly. We care about our legacy not just for the utility it brings our descendants, but because our life's work is an extension of our selfhood. If I spend forty years proving war is immoral, and a film shows me authorizing a bombing, the film destroys the coherence of that life's work. The harm is not that I feel bad; the harm is that the truth of who I was has been actively dismantled. The subject is dead, yes, but the entity they created—their public moral self—remains vulnerable to destruction.

  This brings us to the counterfactual wrinkle, which is the crux of the matter. There is a profound difference between misstating what someone did and misstating what someone *would have done*. Getting a date wrong is a factual error; showing a pacifist signing off on a kill order is a character assassination. The latter feels worse because it is not checkable against a record of events, but against the record of a soul. It posits a version of the person that is fundamentally alien to their actual moral geometry. Critics might argue this is harmless because the situation never occurred, so nothing was taken from the subject at the time. This misses the point. The injury is not to the moment of choice, but to the permanence of character. By asserting the subject was capable of a betrayal they would have rejected, the filmmaker asserts that the subject's moral core was weaker than it actually was. This is a distortion of their essence. It is genuinely worse than a factual slip because it attacks the internal consistency of the person, not just the external timeline of their life. It turns a life of resistance into a life of hypocrisy, and that transformation is a harm to the identity they left behind.

  Defenders of the "only wrongs the living" position argue that once you remove the audience's confusion and the descendants' distress, there is nothing left to complain about. They claim that saying "you wronged her" is just shorthand for "you misled us about her." This view is insufficient because it fails to capture the specific texture of our indignation. When we hear a lie about a historical figure, we feel outrage on *their* behalf, not just on behalf of history textbooks. If the harm were only to the living, then a lie that nobody ever sees would be harmless. But imagine a film is made, stored in a vault, and never shown, but the script contains a vile fabrication about the subject. Under the "only wrongs the living" view, no harm has occurred because no audience was misled. Yet, the intent to defame exists, and the representation is created. If we accept that the dead have no interests, we must accept that destroying a grave is only wrong because it upsets the relatives, not because it disrespects the dead. Most of us feel the disrespect is primary. The film wrongs the subject because it treats their life as raw material rather than a fixed moral record.

  Does this commit us to absurdities? If the dead can be wronged, does every unflattering biography constitute a harm? No. The interest at stake is in *accuracy*, not *flattery*. A true account of a subject's failure or sin does not wrong them, because it respects their actual agency, even when it was misused. The harm arises from fabrication, specifically the invention of choices that contradict the subject's established character. Furthermore, does a lie nobody finds out about wrong them? Yes, because the wrong is in the violation of the truth, not the public reception. The moral bond between the living and the dead requires honesty regardless of an audience. To say otherwise is to say that morality is purely performative.

  Ultimately, reducing the complaint to "misleading the living" throws away the thing that makes the case feel bad in the first place: that they got *her* wrong. It treats the subject as a prop in the living's educational drama. If we acknowledge that persons are narratives that extend beyond breath, we must admit that falsifying that narrative is an injury to the person who authored it. The dead cannot sue, and they cannot feel pain, but they can be betrayed. The filmmaker who invents a moral failure where there was none is not just confusing the audience; they are killing the subject a second time, erasing the moral truth of their existence and replacing it with a fiction that serves the plot. That is a harm to the dead, because it severs the link between who they were and how they endure.

