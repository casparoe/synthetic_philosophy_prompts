  **Note on Evidence Item E2:**
  I judge that the original "future-dated printout" risks distracting students with metaphysical objections about time travel, allowing them to dismiss the evidence as impossible rather than grappling with its inadmissibility. The dialectical work requires only that the agent possesses *information about future outcomes* at the present time. I recommend substituting E2 with a "perfect predictor" scenario. This preserves the logical tension (future-outcome information is inadmissible) without the science-fiction element. The Question, Model Answer, and Marking Scheme below incorporate this substitute (and the necessary adjustment to E3) to ensure the exam tests philosophical reasoning rather than speculation on time travel.

  ***

  ### EXAMINATION PAPER: PHILOSOPHY OF SCIENCE
  **Question 2**

  Consider a device, the Nightlight, which flashes either red or green once each night at midnight. Let $H$ be the chance hypothesis stating that for every night $n$, the objective chance of red on night $n$ is $0.5$, with nights independent. Let $H^*$ be the hypothesis that the device is stuck and will flash red on every night forever with objective chance $1$. At night zero, before the first flash, the agent assigns credence $0.5$ to $H$ and $0.5$ to $H^*$.

  The Principal Principle (PP) constrains rational credence ($Cr$) as follows: for any proposition $A$, any chance function $Ch$, and any admissible evidence $E$, $Cr(A \mid Ch(A)=x \land E) = x$.

  Two characterisations of admissibility are proposed:
  1.  **Past-and-Chance:** Evidence is admissible if and only if it concerns only times earlier than the chance event in question or concerns the values of chances themselves.
  2.  **PP-Preserving:** Evidence is admissible if and only if conditionalising on it allows the Principal Principle to be satisfied without inconsistency.

  Evaluate the following three evidence items available at night zero:
  *   **E1:** A factory ledger recording that of one thousand units shipped from the plant exactly one was of the stuck kind, and that this unit was selected at random from that shipment.
  *   **E2:** A predictor with a perfect track record reports that the Nightlight will flash red on each of the first thousand nights.
  *   **E3:** A report that on night one thousand and one the agent will be shown that predictor's report and will, on seeing it, have credence $0.01$ in $H$.

  In an essay of no more than 1200 words, address the following:
  1.  State the Principal Principle precisely as a constraint on conditional credence.
  2.  Determine whether E1, E2, and E3 are admissible relative to $H$ at night zero under both characterisations.
  3.  Argue whether either characterisation of admissibility is defensible given your verdicts.
  4.  Explain what your verdicts imply about whether the Principal Principle is a substantive thesis or a trivial definition.
  5.  State and then either defend or reject the claim that in the presence of E2, the Principal Principle and Bayesian conditionalisation cannot both be honoured.

  ***

  ### MODEL ANSWER

  The Principal Principle requires that an agent's conditional credence in a proposition, given its objective chance and all admissible evidence, matches that chance. Formally, $Cr(A \mid Ch(A)=x \land E) = x$. The crux of the principle lies in the admissibility of $E$. If admissibility is defined too broadly, the principle becomes inconsistent; if too narrowly, it becomes useless.

  Under the **Past-and-Chance** characterisation, admissibility is determined by the temporal and modal status of the evidence. **E1** concerns the past shipment of the device. It is temporally prior to the flashes. Thus, E1 is admissible. **E2** concerns the future outcomes of the flashes. Even if reported by a predictor now, the content is about future events. Thus, E2 is inadmissible. **E3** concerns the agent's future credence. This is information about a future mental state, not the past or chances. Thus, E3 is inadmissible.

  Under the **PP-Preserving** characterisation, admissibility is determined by logical consistency with the Principle. **E1** shifts the prior probability of $H$ (since the device is likely not the stuck unit), but it does not entail specific outcomes. Conditional on $H$ and E1, the chance of red remains $0.5$. The PP holds. E1 is admissible. **E2** entails that the first thousand flashes are red. If we treat E2 as admissible, we must satisfy $Cr(Red \mid H \land E2) = 0.5$ (by PP) and $Cr(Red \mid H \land E2) = 1$ (by entailment). This is a contradiction. To save the PP, E2 must be declared inadmissible. **E3** implies the agent will later have strong evidence against $H$. By the Reflection Principle, the agent should align current credence with expected future credence. If the agent accepts E3, their current credence in $H$ drops. However, PP requires credence in outcomes to match chances given $H$. If E3 forces a divergence between credence in $H$ and the chances implied by $H$, it threatens PP. However, E3 is primarily about credence, not outcomes directly. Yet, if future credence is based on inadmissible evidence (like E2), E3 inherits that inadmissibility. Thus, E3 is likely inadmissible to preserve PP.

  The defensibility of these characterisations diverges sharply. The Past-and-Chance view offers an independent criterion for admissibility. It tells us *why* E2 is inadmissible: it is about the future. This makes the Principal Principle a **substantive thesis**. It claims that rational agents should ignore future-outcome information when setting credences to match chances. This is a strong, potentially false claim about rationality. Conversely, the PP-Preserving view defines admissibility *as* whatever allows the PP to hold. This renders the Principal Principle **trivial**. It becomes a tautology: "Match the chance, unless doing so would contradict your evidence." It offers no guidance on *which* evidence to ignore, only that we must ignore whatever causes trouble.

  The verdicts on E2 illuminate the conflict between the Principal Principle and Bayesian conditionalisation. Bayesian conditionalisation demands that an agent update their credence on all new evidence. E2 is new evidence available at night zero. If the agent conditionalises on E2, their credence in "Red on night 1" becomes 1. However, the Principal Principle demands their credence be 0.5 (given $H$). They cannot honour both. One might argue that since E2 is inadmissible, the agent should not conditionalise on it. But this violates the Bayesian demand to update on all known evidence. If the agent knows the predictor is perfect, ignoring E2 seems irrational.

  Therefore, the claim that PP and Conditionalisation cannot both be honoured in the presence of E2 is **defended**. If E2 is known, Conditionalisation requires $Cr(Red) = 1$. PP requires $Cr(Red \mid H) = 0.5$. Since $Cr(H)$ is non-zero, these cannot be simultaneously satisfied. The only escape is to deny that E2 is possible evidence (rejecting the predictor) or to deny that PP applies when such evidence is present. But if PP does not apply when we have evidence about outcomes, it applies only when we are ignorant. This reduces PP to a principle of ignorance, stripping it of its power to connect chance and credence in rich informational contexts. The Past-and-Chance characterisation attempts to solve this by ruling E2 inadmissible a priori, but this requires the agent to ignore known truths about the future, which is epistemically costly. The PP-Preserving characterisation solves the inconsistency by fiat, but at the cost of making the principle empty. Thus, the tension remains: a substantive PP conflicts with the demand to believe what the evidence entails.

  ***

  ### MARKING SCHEME (20 Marks)

  **1. Formal Statement of Principal Principle (4 Marks)**
  *   **Requirement:** Must state $Cr(A \mid Ch(A)=x \land E) = x$ (or equivalent) and explicitly identify $E$ as admissible evidence.
  *   **Common Error:** Stating the principle as a constraint on *unconditional* credence ($Cr(A) = x$) or failing to mention the admissibility clause entirely.

  **2. Admissibility Verdicts for E1, E2, E3 (4 Marks)**
  *   **Requirement:** Correctly classify E1 as admissible under both; E2 as inadmissible under both (for different reasons); E3 as inadmissible (typically). Must distinguish the *reasoning* for each characterisation (temporal vs. consistency).
  *   **Common Error:** Ruling E2 admissible under PP-Preserving (ignoring the contradiction) or ruling E1 inadmissible under Past-and-Chance (misidentifying "past").

  **3. Defence of Characterisations (4 Marks)**
  *   **Requirement:** Must argue that Past-and-Chance is independent/substantive while PP-Preserving is circular/trivial. Must take a stance on which is preferable or why both fail.
  *   **Common Error:** Describing the two views without evaluating their defensibility or claiming both are equally valid without addressing the triviality objection.

  **4. Substantive vs. Trivial Implication (4 Marks)**
  *   **Requirement:** Explicitly link the definition of admissibility to the status of PP. If admissibility is defined by PP, PP is trivial. If defined independently, PP is substantive.
  *   **Common Error:** Discussing "substantive" without defining it in terms of the admissibility constraint, or claiming PP is substantive regardless of the admissibility definition.

  **5. PP vs. Conditionalisation Conflict (4 Marks)**
  *   **Requirement:** Must identify that Conditionalisation requires updating on E2 (credence 1), while PP requires matching chance (credence 0.5). Must conclude they are incompatible given E2.
  *   **Common Error:** Claiming they are compatible because "E2 is inadmissible" (failing to see that Conditionalisation demands updating on *all* evidence, admissible or not).

  **Top Band Criteria (17-20 Marks):**
  To reach the top band, the answer must not only hit the five points but weave them into a coherent argument. The student should explicitly connect the triviality of the PP-Preserving view to the inability to resolve the conflict with Conditionalisation (i.e., if PP is trivial, it doesn't *forbid* updating on E2, it just stops applying). The writing must be precise, avoiding conflation of chance and credence, and the conclusion should reflect a clear understanding of why this tension threatens the utility of objective chance in rational decision-making.
