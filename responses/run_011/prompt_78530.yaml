answer: |-
  # Joint Statement on Accuracy and Imprecision in Doxastic States

  **Participants:** Side A (Accuracy-First Precise Probabilism) & Side B (Accuracy-First Imprecise Probabilism)
  **Date:** October 2023
  **Subject:** The Normative Status of Credal Sets and Scoring Rules

  ## 1. Agreed Claims

  We, the undersigned, agree to the following claims as the baseline for our continued collaboration. These claims are intended to rule out caricatures of either position and isolate the specific technical and philosophical points of contention.

  1.  **Strict Propriety is Necessary:** Any scoring rule used to underwrite a normative dominance argument for doxastic states must be strictly proper relative to the class of states being evaluated; otherwise, an agent could minimize expected loss by reporting a state other than their actual one.
  2.  **The Forecasting Analogy is Partial:** Operational forecasting practices (e.g., reporting prediction intervals or quantiles) demonstrate that non-point estimates can be elicited and scored properly, but this does not automatically entail that a *set of probability functions* is the correct formal model for the underlying doxastic state generating those forecasts.
  3.  **Aggregation is Non-Neutral:** To assign a single accuracy score to a set-valued credal state, one must employ an aggregation rule (e.g., taking the score of the best member, the worst member, or the average); this rule is not mathematically determined by the set itself.
  4.  **Dilation is a Formal Feature:** In standard models of imprecise probability, dilation (where posterior credal sets are wider than prior sets after receiving evidence) is a provable phenomenon, not a misunderstanding of conditionalization.
  5.  **Dilation's Normative Status is Unsettled:** We agree that dilation *occurs*, but we disagree on whether it represents a rational response to ambiguous evidence (Side B) or a violation of epistemic efficiency (Side A).
  6.  **Forced Precision Risks Distortion:** There are specific evidential situations (e.g., extreme ambiguity regarding bias) where demanding a single sharp credence forces the agent to represent distinctions their evidence does not support, though we disagree on whether this distortion violates an accuracy norm.
  7.  **Dominance Requires Fixed State Spaces:** Arguments showing that sharp credences dominate imprecise ones (or vice versa) rely on assumptions about the available action space and whether the agent is permitted to suspend judgment or refuse bets.
  8.  **Second-Order Probabilities are Distinct:** Representing uncertainty about which probability function is correct using a sharp second-order distribution is mathematically distinct from representing the state as an unweighted set of functions; conflating the two obscures the disagreement.
  9.  **Quantile Scoring Scores Functionals:** Proper scoring rules for quantiles (e.g., the pinball loss) score a *functional* of a distribution; Side A maintains this implies a single underlying distribution, while Side B maintains the functional itself can be the primary object of evaluation.
  10. **No Permissivism for its Own Sake:** Neither side advocates for imprecision or precision based on a general tolerance for ambiguity; both seek to maximize epistemic utility, defined primarily through accuracy, and view their preferred formalism as the necessary means to that end.

  ## 2. Disagreements Table

  | Disagreement Topic | Neutral Formulation | Side A (Precise) Formulation | Side B (Imprecise) Formulation | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Ontology of the State** | What is the fundamental mathematical object representing a rational doxastic state? | A single probability function $P$. Any set $S$ is merely a representation of uncertainty about which $P$ is the true one. | A convex set of probability functions $\mathcal{P}$. A single $P$ is an unjustified sharpening of the evidence when $\mathcal{P}$ is non-singleton. | **Substantive.** This determines the domain over which scoring rules must be proper. |
  | **Forecasting Intervals** | What does a reported prediction interval represent about the forecaster's mind? | A lossy compression of a sharp predictive distribution, selected to optimize a specific scoring rule (e.g., quantile loss). | A direct report of an imprecise credal state, where the interval boundaries reflect the bounds of the set $\mathcal{P}$. | **Mixed.** Substantive regarding the cognitive model; potentially verbal regarding the utility of the output. Both agree the output is scoreable. |
  | **Aggregation Rules** | How do we evaluate the accuracy of a set-valued state? | Any aggregation rule (e.g., worst-case score) implicitly assumes a sharp decision rule or prior over the set, re-importing precision. | The aggregation rule (e.g., minimax) is a distinct normative commitment compatible with imprecise evidence, not a hidden sharp prior. | **Substantive.** This is the core of the "re-importing sharpness" objection. |
  | **Dilation and Evidence** | Does dilation violate the value of evidence? | Yes. If learning $E$ widens your credences, you should arguably pay to avoid $E$, which violates dominance. | No. Dilation reflects the structure of the evidence; avoiding $E$ is rational caution, not a dominance violation, given the decision rules for sets. | **Substantive.** Turns on the link between accuracy norms and decision-theoretic dominance. |
  | **The "Fake Rigor" Charge** | Is demanding a sharp number in ambiguous cases epistemically harmful? | No. Providing a number is required to minimize expected inaccuracy; withholding it is refusing to play the epistemic game. | Yes. Providing a number creates false confidence and invites calibration errors that an interval would avoid. | **Substantive.** Disagreement on whether "refusing to play" is itself an accuracy cost. |

  **Note on Verbal Disagreement:** We acknowledge that some friction regarding the "Forecasting Intervals" row may be verbal. If Side A defines "doxastic state" as the *optimal input for a scoring rule* and Side B defines it as the *faithful representation of evidential support*, they may be talking past each other. However, this verbal distinction maps onto the substantive disagreement about whether the scoring rule or the evidence relation is foundational.

  ## 3. Cruxes

  We identify the following three sub-questions as cruxes. For each, we specify a concrete argument or case, state our predictions in advance, and commit to specific concessions should the evidence or argument resolve against our current position.

  ### Crux 1: The Derivation of Aggregation Rules
  *   **The Question:** Can a rule for aggregating scores over a credal set (e.g., "evaluate the set by its worst-performing member") be derived solely from accuracy-first principles without assuming a sharp second-order probability or a specific risk attitude?
  *   **The Test:** A formal proof attempt. Side B attempts to derive the minimax aggregation rule from a dominance argument that does not presuppose a probability distribution over the members of the set. Side A attempts to prove that any such derivation implicitly relies on a sharp weighting (a "prior over priors").
  *   **Side A Prediction:** Any derivation of minimax aggregation will implicitly rely on a sharp weighting or a non-accuracy normative assumption (e.g., extreme risk aversion).
  *   **Side B Prediction:** Minimax aggregation can be justified as the only rule that guarantees no member of the set is dominated, without requiring weights.
  *   **Concessions:**
      *   **If A is right:** Side B concedes that imprecise probabilism requires a normative ingredient *beyond* accuracy (e.g., a specific decision rule) and cannot be purely accuracy-first.
      *   **If B is right:** Side A concedes that set-valued states can be evaluated for accuracy without collapsing into sharp probabilism, undermining the "re-importing sharpness" objection.

  ### Crux 2: The Value of Information in Dilation Cases
  *   **The Question:** In a standard dilation scenario (e.g., the generic coin flip where evidence $E$ is independent of hypothesis $H$ but dilates credence in $H$), does accepting the free evidence $E$ lead to a guaranteed loss in accuracy score compared to ignoring it?
  *   **The Test:** Construct a specific scoring rule and a dilation model. Calculate the expected accuracy score of (1) updating on $E$ and (2) ignoring $E$, from the perspective of the pre-update state.
  *   **Side A Prediction:** There are proper scoring rules where updating on dilating evidence yields a lower expected accuracy score than ignoring it, violating the value of evidence.
  *   **Side B Prediction:** When using a scoring rule appropriate for sets (e.g., one that rewards valid coverage), updating on $E$ never yields a strictly worse score than ignoring it, even if the set widens.
  *   **Concessions:**
      *   **If A is right:** Side B concedes that dilation poses a serious problem for the rationality of acquiring free evidence and requires a modification of the imprecise updating rule.
      *   **If B is right:** Side A concedes that dilation does not violate the value of evidence and withdraws the claim that dilation is a decisive reductio of imprecise credences.

  ### Crux 3: The Forecasting Elicitation Mechanism
  *   **The Question:** If agents are scored on a proper rule for intervals (e.g., a coverage/width score) rather than point estimates, will their reported intervals converge to singletons in cases of clear evidence, or remain wide in cases of ambiguity?
  *   **The Test:** An experimental or simulation setup where agents are incentivized to report intervals. In "ambiguous" trials (e.g., drawing from an urn with unknown composition), do agents report wide intervals even when a sharp report would maximize expected score under a risk-neutral assumption?
  *   **Side A Prediction:** Agents will report wide intervals only if they are risk-averse; under risk-neutral incentives calibrated to the proper rule, reports will collapse to sharp estimates (point masses).
  *   **Side B Prediction:** Agents will report wide intervals in ambiguous cases even under risk-neutral incentives, because their internal generative model is genuinely set-valued, not sharp-but-uncertain.
  *   **Concessions:**
      *   **If A is right:** Side B concedes that the forecasting analogy is weak and that interval reporting is best explained as sharp credences plus risk attitudes, not imprecise credences.
      *   **If B is right:** Side A concedes that operational forecasting behavior provides empirical evidence that rational agents naturally utilize set-valued representations when incentives allow, challenging the "forced precision" norm.
