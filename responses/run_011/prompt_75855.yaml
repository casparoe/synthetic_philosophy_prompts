answer: |-
  # Workshop Design: The Janus Protocol

  **Module:** Technology, Risk and Public Policy
  **Session:** Student-Led Ethics Workshop
  **Duration:** 75 minutes
  **Participants:** ~24 (Mixed 2nd/3rd Year PPE)
  **Facilitator:** You (Student Lead)
  **Materials:** A4 paper (cut into slips), two boxes (or hats), pens, whiteboard/markers, a visible score tracker (tokens or tally marks).

  ---

  ## 1. Learning Objective
  To experientially demonstrate the **Unilateralist's Curse**: a scenario where dispersed private information and the ability for any single actor to initiate a powerful action leads to suboptimal collective outcomes (either reckless action or paralysed inaction), despite all actors being well-intentioned and rational.

  ## 2. Information Structure & Payoffs

  ### The "Truth" (Facilitator Only)
  You hold the master key. For each round, there is a hidden **True Value** of the project.
  *   **Round 1 (The Curse):** True Value = **-100 points** (Harmful).
  *   **Round 2 (The Missed Opportunity):** True Value = **+100 points** (Beneficial).
  *   **Round 3 (The Remedy):** True Value = **-100 points** (Harmful, same as Round 1).

  ### Private Signals (The Participants)
  Participants do not know the True Value. They receive a private **Signal Slip**.
  *   The Signal is a number drawn from a distribution centred near the Truth, but with significant noise (variance).
  *   **Round 1 Setup:** Prepare 24 slips. 20 slips say *"Evidence suggests Benefit (+)"*, 4 slips say *"Evidence suggests Risk (-)"*. (Most people think it's good, though it is actually bad).
  *   **Round 2 Setup:** Prepare 24 slips. 20 slips say *"Evidence suggests Risk (-)"*, 4 slips say *"Evidence suggests Benefit (+)"*. (Most people think it's bad, though it is actually good).
  *   **Round 3 Setup:** Same as Round 1 (Most think it's good, it is actually bad).

  ### The Decision Rule (The "Unilateral" Mechanic)
  *   Each student decides individually: **AUTHORISE** or **RESTRAIN**.
  *   **Outcome Logic:** If **ONE OR MORE** students vote AUTHORISE, the project launches.
  *   **Payoff:**
      *   If Project Launches: Everyone receives the True Value (e.g., -100 shared, or +100 shared).
      *   If Project Does Not Launch: Everyone receives 0.
  *   **Incentive:** The group starts with a pot of **500 Tokens**. Losses are deducted from the pot; gains are added. If the pot empties, the workshop ends in "Catastrophe" (symbolic).

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Intro** | Welcome. Explain the stakes: "You are a board of trustees for a high-impact technology fund. You share a common goal: maximise the token pot. You cannot talk during decision phases." |
  | **05–15** | **Round 1** | **The Zeal Trap.** Distribute Round 1 Signals (mostly positive). 2 mins to read. 3 mins to decide secretly. Collect votes. Reveal outcome (Project Launches). Deduct 100 tokens. |
  | **15–25** | **Round 2** | **The Paralysis Trap.** Distribute Round 2 Signals (mostly negative). Emphasise the previous loss. 2 mins to read. 3 mins to decide. Collect votes. Reveal outcome (Likely No Launch). Reveal True Value was +100. Add nothing. |
  | **25–40** | **Round 3** | **The Deliberation.** Distribute Round 3 Signals (same as Round 1). **New Rule:** 5 minutes open discussion allowed before voting. Then vote. (Usually, they will agree to Restrain). |
  | **40–70** | **Debrief** | **The Reveal.** Connect play to theory (see Script below). 30 mins. |
  | **70–75** | **Close** | Summary and reading list distribution. |

  ---

  ## 4. The Debrief Script (The Reveal)

  *Do not mention Bostrom, Sandberg, or Shulman until the end.*

  **Phase 1: The Post-Mortem (10 mins)**
  Ask the room:
  1.  "In Round 1, why did the project launch?" (Answers: "I got a positive signal," "I thought someone else would do it," "It looked safe.")
  2.  "In Round 2, why did we do nothing?" (Answers: "We were scared after Round 1," "My signal was negative," "I didn't want to be responsible.")
  3.  "Did anyone feel they were acting selfishly?" (Highlight that everyone was trying to help the group pot.)

  **Phase 2: Mapping the Structure (15 mins)**
  Draw a diagram on the board.
  *   **Dispersed Information:** Explain that the 'Truth' was hidden. Their signals were noisy. In Round 1, the noise was optimistic; in Round 2, pessimistic.
  *   **The OR-Gate Logic:** Write $Action = (P_1 \lor P_2 \lor ... \lor P_{24})$.
      *   Explain: "Because any one of you could trigger the outcome, the probability of action is not the average of your judgements, but the probability that *at least one* of you is an outlier."
      *   Math intuition: If each of you has a 10% chance of voting 'Go' based on noise, the chance that *no one* votes 'Go' is $0.9^{24} \approx 8\%$. The action happens 92% of the time, even if the average opinion is cautious.
  *   **Correlated vs. Independent Errors:** Ask: "Did you all get the same signal?" (No). "If you had all seen the same document, would this have happened?" (No). The curse relies on *independent* private evidence.

  **Phase 3: The Remedies (5 mins)**
  Discuss Round 3.
  *   "Why did discussion help?" (It aggregated information, turning private signals into public knowledge).
  *   "What is the cost of discussion?" (Time, loss of secrecy, potential for groupthink).
  *   Introduce the concept of **Conformity Norms**: "What if, before seeing signals, you had agreed: 'We will not act unless 15 of us agree'?"
  *   Explain that raising the threshold protects against the Curse but risks the Round 2 Paralysis.

  **Phase 4: The Literature (5 mins)**
  *   Reveal the name: **The Unilateralist's Curse**.
  *   Cite: Bostrom, Sandberg & Shulman (2016), *The Unilateralist's Curse*.
  *   Context: Geoengineering, AI release, leaking classified data.
  *   Closing thought: "Rational individual action does not guarantee rational collective outcomes when execution is unilateral."

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  ### 1. The "Steamroller" in Round 3
  **Risk:** In the discussion round, one confident third-year dominates the conversation, forcing a consensus that doesn't reflect the group's private information.
  **Fix:** Intervene gently. "Thank you. I want to hear from three people who haven't spoken yet." Enforce a 'no interruption' rule during the 5-minute deliberation.

  ### 2. Gaming the Payoffs
  **Risk:** Students realise the token pot is abstract and vote randomly or try to "break" the game by voting 'Go' every time to see what happens.
  **Fix:** Frame the tokens seriously at the start. "This pot represents the module's discretionary fund for a charity of your choice." (You don't actually have to donate it, but the social pressure works). Alternatively, offer a small prize (chocolate) to the group if the pot ends above 500.

  ### 3. The Numbers Feel Arbitrary
  **Risk:** In the debrief, students challenge the signal distribution. "Why did 20 of us get positive signals in Round 1? That's rigged."
  **Fix:** Acknowledge this. "In real life, the distribution of optimism/pessimism is the variable we can't control. The lesson is about the *mechanism* of decision-making given *any* distribution of error. The curse is worst when errors are independent and the threshold is low."

  ### 4. Round 2 Fails (Someone Acts)
  **Risk:** In Round 2, despite the negative signals, one student votes 'Go'. The group wins +100. They feel clever, not paralysed.
  **Fix:** This is actually a valuable data point. In the debrief, ask: "Why did you act?" If they say "I guessed," highlight the risk. If they say "I calculated the odds," ask the rest of the room: "Would you have trusted that calculation without verifying?" Use it to show that *luck* is not a *strategy*.

  ### 5. Logistics Drag
  **Risk:** Collecting 24 slips of paper takes too long, eating into the debrief.
  **Fix:** Pre-cut the paper. Have two boxes at opposite ends of the room. Ask students to fold slips and drop them as they leave their seats. Count only the "GO" slips. If you see even one, stop counting and declare "Action Taken."

  ---

  ## 6. Limitations of the Simulation

  Be frank with your cohort about what the game *cannot* capture. You must supply this context in the debrief.

  1.  **Reputation Costs:** In the game, being the "one who launched the disaster" has no personal penalty beyond the shared pot. In reality, the unilateralist suffers reputational damage, legal liability, or ostracisation. This usually dampens the curse, but not enough to eliminate it.
  2.  **Iterated Play:** This is a one-off game. In reality, actors learn. However, Bostrom et al. argue that in high-stakes tech (like AI), there is often only *one* shot. You cannot learn from a catastrophic failure.
  3.  **Heterogeneous Values:** In the game, everyone wants to maximise the pot. In reality, actors have different utility functions (e.g., a corporation wants profit, a state wants security, an NGO wants safety). The Unilateralist's Curse is most dangerous precisely when values *are* aligned (everyone wants safety) but information is not.
  4.  **The "Hero" Narrative:** The game frames inaction as 'safe'. In some real-world contexts (e.g., whistleblowing), the unilateralist is morally required to act despite the curse. The remedy is not always 'conformity'; sometimes it is 'epistemic humility'.

  ## 7. Facilitator's Cheat Sheet (Preparation)

  *   **Signal Slips:** Prepare 3 sets of 24 slips in advance.
      *   Set 1: 20 "GO signals", 4 "STOP signals".
      *   Set 2: 4 "GO signals", 20 "STOP signals".
      *   Set 3: 20 "GO signals", 4 "STOP signals".
  *   **The Box:** Label it "DECISIONS".
  *   **The Board:** Draw a large table: *Round | True Value | Group Decision | Outcome*. Fill this in live during the debrief.
  *   **Tone:** Remain neutral. Do not hint at the True Value during the game. If asked "Is this safe?", reply "You must decide based on your evidence."

  ---

  ### Reading List for Handout
  *   Bostrom, N., Sandberg, A., & Shulman, C. (2016). *The Unilateralist's Curse*. Journal of Applied Philosophy.
  *   Sunstein, C. R. (2014). *Deciding to Decide*. (On aggregation of information).
  *   Parfit, D. (1984). *Reasons and Persons*. (On coordination problems, specifically the "Hi-Lo" problem).
