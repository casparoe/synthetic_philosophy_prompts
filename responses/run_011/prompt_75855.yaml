      *   *Key Mechanics:* Common interest, private signals, unilateral execution (OR gate logic), threshold problem.
      *   *The Twist:* The prompt asks for a round where the hazard is inaction (false negative). This is slightly distinct from the classic Bostrom definition (which focuses on harmful actions taken unilaterally), but it illustrates the *coordination problem* inherent in dispersed authority. It's essentially the flip side: the "Bystander Effect" or a coordination failure in a positive-sum game. I need to integrate this carefully so it doesn't confuse the core lesson. Let's frame it as "The Initiative" (Round 1: Risky) and "The Rescue" (Round 2: Urgent).

