answer: |-
  I take neither horn. An allowance leaves the landlord's power to exclude intact; I remain subject to your whim, merely with fuller pockets. Domination is the capacity to interfere arbitrarily, not the price of interference. Housing is distinct from wages because it constitutes the site of agency, not merely its fuel. To be exiled from one's community because a proprietor wills it is a loss of political standing, not just income. We need not control every price to recognize that some goods ground citizenship itself. If the market treats housing as a speculative asset, it institutionalizes mastery over residents. My claim is not about need, but sovereignty. An allowance makes you a richer supplicant; stabilization makes you a secure citizen. The question is not whether we administer all prices, but which goods must be insulated from proprietary veto to ensure freedom.
