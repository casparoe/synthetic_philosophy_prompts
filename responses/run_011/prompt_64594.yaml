prompt: |-
  American federal courts display a pattern that I find hard to state without sounding as though I have invented it. A single plaintiff who can show a concrete and particularized injury to herself — an injury that is hers, not merely one she shares with the public at large — may obtain an order suspending a government policy, and for decades such orders have routinely been framed to bind the government in its dealings with everyone, including millions of nonparties who never appeared in the case. At the merits stage the court asks whether this plaintiff's right has been infringed; that the policy produces enormous aggregate benefits for the population is, as a rule, beside the point, or enters only obliquely as a compelling government interest. Yet the very same court, when asked for a preliminary injunction before trial, must expressly weigh the balance of equities and the public interest under the four-factor test the Supreme Court restated in Winter v. Natural Resources Defense Council in 2008 — that is, it must total up harms to people who are not before it — and will deny relief when the aggregate harm to nonparties outweighs the plaintiff's irreparable injury. Elsewhere the system is cheerfully additive: tort damages scale with the number of victims, a class action pools thousands of claims into one fund divided pro rata, the sentencing guidelines treat the number of victims as an aggravating factor, and executive agencies defend regulations by summing statistical lives saved. And at the front door, standing doctrine turns away the person whose only complaint is that a policy injures millions of people diffusely and injures him exactly as much as it injures every other one of them: a grievance he merely shares with everyone else will not get him into court.

  What moral theory does this pattern presuppose? I am drawn to the thought that the merits practice is Scanlonian contractualism in institutional drag — justification owed to each person separately, complaints compared one against one rather than summed, so that a million small benefits cannot be laid in the scale against a single infringement. Test that hypothesis rather than assuming it. Does the practice strictly require it, or would a threshold-deontological view, a rule-consequentialist one, or a wholly non-moral account — institutional competence, the bipartite structure of a lawsuit, the absence of any forum in which the millions could be heard — license exactly the same doctrine? Separate carefully what the practice commits the system to from what merely sits comfortably with it, and mark the places where the doctrine is philosophically underdetermined, several incompatible theories generating the same result.

  Then take up the tensions head on. If the merits are genuinely non-aggregative, what is the public-interest factor doing at the injunction stage, and does its presence show that the refusal to aggregate is a rule of decision rather than a theory of value? Is the denial of standing to the diffusely harmed the same principle as the refusal to weigh the aggregate against the plaintiff, or a different and perhaps opposing one — the many incapable of being represented at all, rather than incapable of outweighing the one? Why is procedural aggregation in a class action legitimate when moral aggregation is not, given that the pooled fund is divided according to each member's own loss? And what is the status of the rule that trivial injuries are dismissed however many people sustain them: does it commit the system to a threshold below which complaints simply drop out, a threshold that pairwise comparison is supposed to render unnecessary?

  Finally, suppose we rebuilt the apparatus on a straightforwardly aggregative theory of justification. Tell me which doctrines would have to be abandoned, which would survive untouched and why, and what new institutions the system would require in order to represent the aggregate honestly rather than by judicial guesswork about the public interest. I want the reconstruction and the diagnosis, not a survey; use the vocabulary of moral theory where it earns its keep, but keep the legal description concrete enough that I can check it against the practice as I have laid it out here.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Observation:** The user identifies a specific pattern in American federal courts:
          *   *Standing:* Requires concrete, particularized injury (no generalized grievances).
          *   *Merits:* Focuses on the individual plaintiff's right; aggregate public benefit is usually irrelevant (rights trump utility).
          *   *Remedy (Permanent Injunction):* Often universal (binds government regarding everyone, not just plaintiff).
          *   *Preliminary Injunction:* Requires weighing public interest/aggregate harm (Winter test).
          *   *Elsewhere:* Tort, class actions, sentencing, agency rulemaking *do* aggregate (more victims = more liability/weight).
      *   **Task 1: Identify the Moral Theory.** The user suggests Scanlonian contractualism (justification to each, no aggregation). I need to test this hypothesis against alternatives (threshold-deontology, rule-consequentialism, institutional competence). Distinguish between what the practice *commits* to vs. what is merely *consistent* with it. Identify underdetermination.
      *   **Task 2: Analyze Tensions.**
          *   Merits (non-aggregative) vs. Preliminary Injunction (aggregative/public interest).
          *   Standing (excludes diffuse harm) vs. Merits (protects individual against aggregate).
          *   Class Actions (procedural aggregation) vs. Moral Aggregation.
          *   Trivial Injuries (de minimis) vs. Rights Trumps.
      *   **Task 3: Reconstruct on Aggregative Theory.** If we switched to straightforward utilitarianism/aggregation:
          *   What doctrines die?
          *   What survive?
          *   What new institutions are needed?
      *   **Constraints:** Use moral theory vocabulary where useful but keep legal description concrete. Avoid survey style; provide diagnosis and reconstruction.

  2.  **Part 1: Diagnosing the Moral Theory (Testing the Scanlonian Hypothesis)**

      *   *Hypothesis:* Scanlonian Contractualism (justification to each individual; numbers don't count in rights violations).
      *   *Fit:* Explains why one plaintiff can stop a policy affecting millions (the one cannot be sacrificed for the many). Explains standing (you need a specific complaint to demand justification).
      *   *Alternative 1: Threshold Deontology.* Rights are absolute until a catastrophe threshold is reached.
          *   *Fit:* Explains why preliminary injunctions sometimes deny relief (if public harm is catastrophic). Explains why trivial injuries don't count.
      *   *Alternative 2: Institutional Competence/Process Theory.* Courts protect rights (individual); Agencies/Legislatures handle policy (aggregate).
          *   *Fit:* Explains the split between merits (rights) and preliminary injunction/public interest (policy). Explains standing (courts aren't for general policy complaints).
      *   *Alternative 3: Rule Consequentialism.* A rule protecting individual rights yields better long-term outcomes than case-by-case utilitarianism.
      *   *Analysis of Underdetermination:* The practice doesn't *prove* Scanlonism. A rule-consequentialist could support individual rights as a heuristic. Institutional competence explains the *structure* without committing to the *value theory*. The key distinction is between *ontological* commitment (rights are inherently non-aggregable) and *epistemic/procedural* commitment (courts aren't built to count).
      *   *Conclusion on Part 1:* The practice is *compatible* with Scanlonism but *explained* equally well by Institutional Competence + Threshold Deontology. The "universal" injunction is the weirdest part for Scanlonism (why does the one plaintiff's right vindication bind the government regarding non-parties?). This suggests the moral theory is mixed or that the remedy is pragmatic, not moral.

  3.  **Part 2: Analyzing the Tensions**

      *   *Merits vs. Preliminary Injunction:* Merits = Rights (non-aggregative). PI = Equity (aggregative).
          *   *Resolution:* This suggests the non-aggregation is a *rule of decision* for liability, not a *theory of value* for interim relief. Equity has always been discretionary and consequentialist.
      *   *Standing vs. Merits:* Standing excludes the "diffuse" victim. Merits protects the "specific" victim against the "aggregate."
          *   *Resolution:* These are not the same principle. Standing is about the *role of the judiciary* (no general oversight). Merits is about the *substance of rights*. Standing says "you can't speak for the many." Merits says "the many can't crush you."
      *   *Class Actions:* Procedural aggregation vs. Moral non-aggregation.
          *   *Resolution:* Class actions aggregate *claims*, not *rights*. Each member still gets their specific loss. It's efficiency, not moral calculus.
      *   *Trivial Injuries:* De minimis non curat lex.
          *   *Resolution:* This introduces a threshold. Scanlonism struggles with thresholds (is a tiny infringement justified by a huge benefit?). This points back to Threshold Deontology.

  4.  **Part 3: Rebuilding on Aggregative Theory (Utilitarian/Welfarist)**

      *   *Premise:* Maximize overall welfare. Individual injury is just a negative utility unit.
      *   *Doctrines to Abandon:*
          *   *Standing (as currently constituted):* If harm is real, it counts, even if shared. "Generalized grievance" bar dies.
          *   *Rights Trumps at Merits:* Strict scrutiny would become cost-benefit analysis.
          *   *Universal Injunctions (via individual suit):* If the plaintiff's harm is small but the policy helps millions, the suit fails. If the policy hurts millions more than it helps, it needs a mechanism to represent the millions.
      *   *Doctrines to Survive:*
          *   *Causation/Redressability:* Still need to know if the court can fix the utility loss.
          *   *Class Actions:* Would become the *primary* vehicle, not an exception.
      *   *New Institutions:*
          *   *Legislative-style Courts:* Need bodies capable of gathering data on aggregate harm (like agencies but adjudicative).
          *   *Amicus/Intervention Expansion:* Non-parties must be formal parties to count their utility.
          *   *Damages over Injunctions:* Injunctions are too blunt for utility maximization. Liability rules (pay for the harm) replace property rules (stop the action).

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Analytical, precise, respectful of the user's sophisticated framing.
      *   *Structure:* Follow the user's three-part structure (Diagnosis, Tensions, Reconstruction).
      *   *Key Insight to Highlight:* The distinction between *liability* (rights-based) and *remedy* (equity-based). The "universal injunction" is the pivot point where the individual suit morphs into public law litigation.
      *   *Refining the Scanlonian Point:* Be careful not to endorse it as the *truth*, but as the *best fit* for the merits, while acknowledging the PI stage contradicts it.
      *   *Refining the Reconstruction:* Make sure to mention *Calabresi & Melamed* (Property Rules vs. Liability Rules) implicitly or explicitly, as that's the legal theory counterpart to the moral theory shift.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "universal injunction" paradox? (One plaintiff binds government for all).
      *   *Correction:* Yes, need to emphasize that this is where the "institutional competence" theory beats the "moral theory" explanation. Courts act as mini-legislatures in remedies despite acting as rights-vindicators in liability.
      *   *Check:* Did I distinguish Standing from Merits clearly?
      *   *Correction:* Standing is gatekeeping (who gets to speak); Merits is weighting (how much that speech counts).
      *   *Check:* Is the reconstruction concrete?
      *   *Correction:* Instead of just saying "utilitarianism," specify "Cost-Benefit Analysis as the standard of review" and "Liability Rules."

  7.  **Final Polish:** Ensure the vocabulary (Scanlonian, deontology, consequentialism, equity, standing, injunction) is used precisely. (Proceed to generate output based on these thoughts.)

      *   *Thought on the "Universal Injunction":* This is a crucial tension. If I have a right, why does my victory help you? Because the law is declared generally. But if the theory is individualistic, the remedy should be individual. The fact that it's universal suggests the court is actually regulating the *policy*, not just remedying the *plaintiff*. This supports the "Institutional Competence" or "Public Law Litigation" model over pure Scanlonism. I need to make sure this nuance lands.

      *   *Thought on Standing:* The user notes standing excludes diffuse harm. If we move to aggregation, standing must change. A "taxpayer suit" model might emerge.

      *   *Thought on PI vs. Merits:* The PI stage admits what the Merits stage denies: that numbers count. This implies the Merits stage is a *fiction* or a *heuristic*, not an ontological truth about value.

      *(Self-Correction complete. Ready to write.)*
answer: |-
  This is a precise diagnosis of a structural schizophrenia in American public law. You have identified the friction between the *individualist ontology* of the Article III case-or-controversy and the *aggregative reality* of governance. Below is the diagnosis of the moral presuppositions, an analysis of the internal tensions, and a reconstruction of the system on explicitly aggregative grounds.

  ### I. Diagnosis: The Moral Theory of the Pattern

  Your hypothesis—that the merits practice resembles Scanlonian contractualism—is the strongest fit for the *liability* phase, but it fails to explain the *remedial* and *threshold* phases. The system does not commit to a single moral theory; rather, it layers incompatible theories across different procedural stages to manage institutional risk.

  **1. The Merits: Rights as Trumps (Deontology/Scanlonism)**
  At the merits stage, your Scanlonian hypothesis holds water. The court asks whether the government can justify its action *to this plaintiff*. The fact that the policy benefits a million others is generally inadmissible to negate the right. This mirrors Scanlon's formula: an act is wrong if it cannot be justified by principles that no one could reasonably reject. The plaintiff says, "I cannot reasonably reject a principle that allows me to be silenced/imprisoned/searched," regardless of the aggregate security gained.
  *   **Commitment:** The system commits to the *incommensurability* of rights and utilities at this stage. A right is not a weight to be placed on a scale; it is a shield.
  *   **Underdetermination:** However, this does not prove the court *believes* rights are metaphysically absolute. It could equally be a **Rule-Consequentialist** heuristic: "If we start weighing free speech against public safety in every case, the long-term utility of free speech collapses." The practice is consistent with Scanlonism, but it is also consistent with a rigid rule-utilitarianism designed to prevent judicial bias in weighing incommensurables.

  **2. The Preliminary Injunction: Equity as Aggregation (Act-Consequentialism)**
  The *Winter* test breaks the Scanlonian spell. To grant interim relief, the court *must* weigh the "public interest." Here, the court explicitly aggregates. It asks: Does the plaintiff's irreparable harm outweigh the harm to the public if the policy is paused?
  *   **Commitment:** This stage commits the system to **Act-Consequentialism**. The rights claim is temporarily demoted to a utility variable.
  *   **Implication:** This suggests the non-aggregation at the merits stage is not a theory of value, but a **rule of decision**. The system treats rights as absolute for the purpose of *judgment*, but as contingent for the purpose of *timing and disruption*.

  **3. Standing: Institutional Competence (Process Theory)**
  Standing doctrine (banning generalized grievances) is not moral; it is structural. It presupposes that courts are forums for *dispute resolution*, not *policy optimization*.
  *   **Commitment:** This is **Process Theory**. It assumes that if everyone is harmed equally, the political process is the correct aggregator, not the judiciary.
  *   **Tension:** This contradicts the merits stage. If the plaintiff's right is truly paramount (Scanlonian), why does it matter if others share the injury? The standing bar suggests the court cares less about the *injury* and more about the *adversarial sharpness* required to police the executive.

  **Conclusion on Theory:** The system presupposes **Threshold Deontology managed by Institutional Competence.** Rights are absolute (non-aggregative) until they trigger a procedural mechanism (preliminary injunction) or a threshold (triviality) where consequentialist calculation becomes unavoidable. The "Scanlonian" element is a default setting for liability, not a deep moral commitment, because it is switched off the moment the remedy threatens systemic disruption.

  ### II. The Tensions: Fractures in the Doctrine

  The tensions you identify are not bugs; they are pressure valves. They reveal where the moral fiction of the individual lawsuit cracks under the weight of administrative governance.

  **1. Merits (Non-Aggregative) vs. Injunction (Aggregative)**
  If the merits are genuinely non-aggregative, the public interest factor at the injunction stage is an anomaly. Its presence proves that the refusal to aggregate at the merits is a **jurisdictional limitation**, not an axiological one. The court says: "I am not authorized to balance the public good when deciding *if* you were wronged (that is for the legislature to write the right), but I *am* authorized to balance the public good when deciding *when* to stop the government."
  *   **Diagnosis:** The non-aggregation is a rule of **judicial restraint**, not moral truth. It prevents judges from acting as super-legislators on liability, but allows them to act as risk-managers on remedies.

  **2. Standing (Exclusion) vs. Merits (Protection)**
  Is the denial of standing to the diffusely harmed the same principle as the protection of the specifically harmed against the aggregate? No. They are opposing principles.
  *   **Standing:** "You cannot sue because your injury is shared." (The many cannot be represented by the one).
  *   **Merits:** "You win even if the many benefit." (The one cannot be sacrificed for the many).
  *   **Diagnosis:** Standing protects the *political branch's* monopoly on aggregating diffuse interests. Merits protects the *individual* from the political branch's aggregation. The system creates a narrow channel: you must be hurt *specifically enough* to enter, but once inside, you are protected *absolutely enough* to win. This filters out policy disputes while preserving liberty claims.

  **3. Class Actions: Procedural vs. Moral Aggregation**
  Why is pooling claims legitimate if moral aggregation is not? Because class actions aggregate **losses**, not **rights**.
  *   **Diagnosis:** In a class action, the court still adjudicates the violation individually (commonality of law/fact), and damages are distributed pro rata based on individual harm. The "fund" is an administrative convenience, not a moral sum. It respects the Scanlonian constraint (each member must have standing and injury) while utilizing consequentialist efficiency (judicial economy). It is moral aggregation disguised as procedural efficiency.

  **4. Trivial Injuries: The Hidden Threshold**
  The rule that trivial injuries are dismissed (*de minimis*) commits the system to a **Threshold Deontology**.
  *   **Diagnosis:** Scanlonian contractualism struggles with trivialities (can a tiny inconvenience be rejected?). The legal system resolves this by saying rights have a magnitude floor. Below the threshold, the complaint drops out regardless of the defendant's justification. Above the threshold, the defendant's aggregate benefits become irrelevant (strict scrutiny). This creates a "cliff" effect: a harm is either nothing or it is absolute. This is philosophically unstable but administratively necessary to prevent docket flooding.

  ### III. Reconstruction: The Aggregative Apparatus

  Suppose we rebuild the federal judiciary on a straightforward **Welfarist/Utilitarian** theory of justification. The goal is no longer to vindicate individual rights against the state, but to maximize net social welfare through adjudication. The "right" is merely a proxy for a high-weighted interest.

  **1. Doctrines to be Abandoned**
  *   **Standing (Generalized Grievance Bar):** If harm is real, it counts. A plaintiff suffering the same injury as a million others would have standing, provided the aggregate harm is justiciable. The "particularized" requirement would vanish, replaced by a "cognizable harm" requirement. Taxpayer suits and citizen suits would be the norm, not the exception.
  *   **Strict Scrutiny / Rights Trumps:** The merits stage would become a **Cost-Benefit Analysis (CBA)**. The government could infringe a "right" if the aggregate welfare gain exceeded the aggregate welfare loss. Religious freedom, speech, or due process would be weighed against public safety or economic efficiency using statistical metrics (e.g., value of a statistical life).
  *   **Universal Injunctions via Individual Suit:** An individual plaintiff could no longer suspend a policy for everyone. If the plaintiff's harm is \$10,000 but the policy benefits the public by \$10,000,000, the suit fails. If the policy harms the public by \$10,000,000, the plaintiff needs a mechanism to represent that \$10,000,000. A single plaintiff represents only their own utility loss.
  *   **De Minimis Doctrine:** Trivial injuries would be aggregated. A million people losing \$1 is a \$1,000,000 harm, actionable in court.

  **2. Doctrines to Survive (Repurposed)**
  *   **Causation and Redressability:** These survive but shift meaning. Causation becomes a statistical probability (did the policy *likely* cause the welfare loss?). Redressability becomes a question of whether the court's order improves the net utility balance.
  *   **Class Actions (Rule 23):** This becomes the **primary vehicle** for litigation, not an exception. Since individual harms are rarely large enough to outweigh government benefits in a welfarist calculus, plaintiffs must aggregate claims to reach a threshold where litigation is utility-positive.
  *   **Preliminary Injunctions:** The *Winter* test becomes the **merits test**. The four-factor test (likelihood of success, irreparable harm, balance of equities, public interest) is essentially a preliminary CBA. In an aggregative system, this *is* the decision procedure.

  **3. New Institutions Required**
  To represent the aggregate honestly, rather than by judicial guesswork, the system would require:
  *   **Legislative Courts (Article I Tribunals):** Article III courts are designed for binary disputes (A vs. B). An aggregative system requires data gathering, impact statements, and representation of non-parties. We would need specialized tribunals with subpoena power to gather data on aggregate harms, functioning more like the FTC or EPA but with adjudicative power.
  *   **Mandatory Intervention / Amicus Curiae:** Non-parties whose utility is affected would have a right to intervene. If a policy affects 1 million people, the court cannot guess the "public interest"; it must hear from representatives of the gainers and losers. This turns the lawsuit into a **mini-legislature**.
  *   **Liability Rules over Property Rules:** (Drawing on Calabresi & Melamed). Injunctions (property rules) would be rare. The preferred remedy would be **damages (liability rules)**. If the government's policy creates net benefit but harms a minority, the court would order the government to proceed *but compensate the losers*. This achieves the utilitarian outcome (Kaldor-Hicks efficiency) without blocking the welfare-enhancing policy.
  *   **Algorithmic Standing:** To handle the volume of aggregated trivial claims, standing would be automated. If a regulation violates a statutory welfare metric, a claim is automatically cognizable without a human plaintiff demonstrating specific injury.

  **Summary of the Reconstruction**
  In this rebuilt system, the "plaintiff" is no longer a rights-bearer demanding justification; they are a **private attorney general** triggering a welfare audit. The "defendant" is not a rights-violator but a **utility optimizer** who may have miscalculated. The judgment is not "You violated a right," but "Your calculation was net-negative."

  This system would be more honest about the trade-offs you identified, but it would require abandoning the core liberal premise of the American judiciary: that the individual is a sovereign entity who cannot be traded away, even for the greater good. The current "schizophrenia" you observe is the system's attempt to retain that liberal premise while acknowledging the administrative state's need to govern for the many.
