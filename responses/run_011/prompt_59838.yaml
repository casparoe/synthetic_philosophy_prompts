  **Scenario**

  Elena watches *The Shaft* annually on the anniversary of the 1998 mine collapse it dramatizes, keeping a list of the eight miners' actual names on her mantle though she knows the film changed them. She refuses any version that implies they survived, calling such changes "lies," and treats the screening as a vigil rather than entertainment. The film uses grainy 16mm stock, unmixed sound where dialogue drowns in machinery, and static shots held long after actors leave the frame. Elena weeps throughout the final act; she does not dab her eyes, nor does she reach for tissues when her partner offers them, saying later, "Let it run." She reports feeling heavier leaving the room than entering it, and declines offers to summarize the ending so she can skip the watching.

  There exist two edits. In Cut A, the screen holds on the widows' silent kitchen for three minutes after the phone rings. In Cut B, the screen cuts to black the moment the phone begins to ring, followed by two minutes of credit scroll over a neutral gray background. Elena reports equal satisfaction with the camera work and acting in both, rating the direction "competent but plain" in each. Yet she chooses Cut A annually. She finds no satisfaction in the gray background of Cut B, nor does she find Cut A beautiful; she simply says of Cut A, "It matters," while describing Cut B as "hollow." She feels no relief when Cut A ends, only a sustained dull ache she refuses to trade for the neutrality of Cut B, insisting she is glad she watched it.

  ***

  **A. Verdicts**

  *   **Hume's Conversion Account:** Hume predicts the painful passion is converted into pleasure by the force of execution (eloquence, artistry).
      *   *Blocking Features:* Elena rates the direction "competent but plain" in both cuts, denying the "eloquence" required for conversion. She reports feeling "heavier" and experiencing a "sustained dull ache," directly contradicting the claim that the pain is transposed into pleasure.
      *   *Status:* **Decisive Block.** The defender must argue that "heaviness" and "ache" are disguised forms of pleasure or that "plainness" is a hidden form of eloquence. This requires redefining "pleasure" and "eloquence" beyond their ordinary sense, costing the account its intuitive appeal.
  *   **Walton's Make-Believe Account:** Walton predicts the spectator feels quasi-emotion caused by make-believe, lacking belief in the object's existence.
      *   *Blocking Features:* Elena keeps the real miners' names on her mantle, refuses "lies" about their survival, and treats the film as an occasion for grief about people she takes to have existed. Her dispositions (vigil, refusing substitutes) align with genuine belief-based grief, not a game of make-believe.
      *   *Status:* **Decisive Block.** The defender must argue that despite her explicit belief in the real sufferers, her engagement with the *filmic representation* remains make-believe. This requires splitting the object of emotion in a way that contradicts her reported experience of grieving the *miners*, not the *characters*.
  *   **Feagin's Meta-Response Account:** Feagin predicts pleasure is taken in one's own sympathetic capacity (meta-response) regarding the painful direct response.
      *   *Blocking Features:* Elena refuses tissues and says "Let it run," indicating acceptance but not enjoyment of the tears themselves. She is glad she watched because "It matters," not because she values her capacity to cry. The pleasure tracks the *content* of the ending (widows vs. gray), not the *fact* of her responding.
      *   *Status:* **Expensive Block.** The defender can claim her "gladness" is the meta-response. However, she must explain why the meta-response depends on the specific *cut* (widows vs. gray) rather than just the presence of sadness. Feagin must argue she takes pleasure in her sympathy *only* when it is appropriately matched to the specific suffering depicted, which strains the idea that the pleasure is in the *capacity* itself.

  **B. The Load-Bearing Stipulation**

  The single feature is **Elena's belief that the miners existed and suffered.**

  *   **Removal:** If Elena knows the miners are entirely fictional inventions with no real-world counterparts.
  *   **Changes:**
      *   **Walton:** The account becomes viable. Her grief is now clearly directed at fictional entities, fitting the definition of quasi-emotion generated by make-believe. Her refusal of "lies" becomes a preference for internal consistency within the game of make-believe.
      *   **Hume:** No significant change. The aesthetic judgment ("plain") and phenomenological report ("ache") still block conversion.
      *   **Feagin:** No significant change. The source of her gladness ("It matters") would still point toward the content rather than her own capacity, though the "reality" of the suffering would no longer be a competing explanation for the intensity of her grief.

  **C. Coherence**

  The specifications are jointly satisfiable. The psychology describes **commemorative grief** rather than aesthetic enjoyment, which is a recognized human phenomenon (e.g., visiting a memorial site).
  *   **Potential Issue:** The paradox of tragedy assumes the viewer derives *pleasure*. Elena reports being "glad" and finds Cut B "hollow" (negative) vs Cut A "matters" (positive). This positive valence ("gladness") serves as the functional equivalent of pleasure required to trigger the paradox without violating the "no relief/heavier" stipulation.
  *   **Minimal Repair:** None required. The distinction between "hedonic pleasure" (feeling good) and "evaluative gladness" (valuing an experience) is psychologically coherent and preserves the design's purpose of testing whether the accounts can handle non-hedonic positive valence.

  **D. Yield**

  The case accomplishes what an abstract argument does not: it **forces a phenomenological collision.** An argument might claim "people feel real grief for fiction," but this scenario isolates specific behaviors (refusing tissues, choosing the longer suffering cut despite equal aesthetic rating) that make the theoretical costs visible.
  *   **Counterexample or Restatement:** It is a **genuine counterexample** to Walton (due to the belief stipulation) and a **strong challenge** to Hume and Feagin.
  *   **Illusion of Counterexample:** The stipulation that she is "glad she watched" carries the illusion. If "gladness" is admitted as a form of pleasure, Hume and Feagin can absorb it by redefining their terms (conversion to gladness; meta-gladness). The case only functions as a counterexample if "pleasure" is strictly hedonic (feeling good), whereas the accounts might stretch to include evaluative satisfaction. The stipulations regarding the *source* of the gladness (the widows' suffering, not the art or the self) are what prevent this absorption.

  **E. The Fourth Option**

  The case points toward a **Meaning-Based Account** (or Appropriateness Account).
  *   **Description:** The viewer values the experience not because the pain is converted (Hume), nor because it is fake (Walton), nor because she likes her sympathy (Feagin), but because the pain is the **appropriate response to the value of what was lost.** The "pleasure" (gladness) is the satisfaction of having acknowledged the truth of the suffering correctly.
  *   **Cost:** This abandons hedonism entirely. It claims we do not enjoy tragedy; we endure it because it is **meaningful.**
  *   **Why Pleasure Requires Sadness:** On this view, the "pleasure" (meaning/satisfaction) *requires* the sadness because the sadness is the cognitive recognition of loss. You cannot have the recognition of the value of the lost miners without the pain of that loss. The pain is not the material for pleasure (Hume) nor the object of meta-pleasure (Feagin); it is the **constitutive element of the understanding** that is valued. To remove the sadness (Cut B) is to remove the acknowledgment, leaving only "hollow" neutrality.
