  1. Ask if the phrase attributes causality to an inanimate object or legal statute without implying moral agency. If you encounter "The driver was responsible for the crash," you must move to step two. If you read "The bridge was responsible for holding the weight," you tag it NEUTRAL and stop.

  2. Ask if the context concerns only our social practices of blaming rather than the agent's internal capacity, keeping in mind REACTIVE is the tag this procedure is worst at detecting. If you tag "We hold him accountable to maintain order" as REACTIVE, you stop. If you read "He chose to rob the bank," you must move to step three.

  3. Ask whether the sentence becomes false or nonsensical if determinism is true and no alternatives were genuinely open. If you tag "She could have done otherwise even with identical prior states" as LEVEY, you stop. If you read "The CEO chose to merge the companies," you must move to step four.

  4. Ask if the action issues from the agent's own reasoning processes without making claims about alternative possibilities. If you tag "The decision flowed from his own character" as SOURCE, you stop. If the distinction between this and LEVEY remains unclear, you must move to step five.

  5. Ask if you can confidently rule out LEVEY based on context clues alone. If you cannot rule it out, you send the query to me. If you can rule it out, you tag it SOURCE and file the piece.
