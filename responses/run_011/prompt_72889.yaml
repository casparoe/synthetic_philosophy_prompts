answer: |-
  ### Desiderata for a Robust Theory of Interpersonal Aggregation

  To succeed where Harsanyi's Aggregation Theorem is thought to fail—specifically in its inability to justify interpersonal comparisons of utility levels and units solely from rationality axioms, and its vulnerability to the tension between ex ante and ex post criteria—a successor theory must satisfy the following constraints. Each item below specifies the normative stakes, distinguishing between requirements essential for any plausible moral theory (**Non-negotiable**) and those demanded by specific philosophical camps (**Camp-Specific**).

  #### I. Structural Assumptions and Commitments

  1.  **The Shape of the Domain (Risk and Rationality)**
      *   *Motivating Consideration:* Harsanyi assumes all individuals satisfy vNM axioms. A robust theory must specify whether rationality is a precondition for moral standing or a modeling convenience. If we exclude non-expected utility maximizers, we risk excluding agents with coherent but non-standard risk attitudes from the moral calculus.
      *   *Status:* **Non-negotiable** (must explicitly justify the domain restriction).

  2.  **Anonymity (Interpersonal Symmetry)**
      *   *Motivating Consideration:* The identity of the welfare bearer must not affect the weight of their interest. This is the formal expression of equality. Without it, aggregation collapses into a hierarchy of status.
      *   *Status:* **Non-negotiable**.

  3.  **Ex Ante vs. Ex Post Unanimity**
      *   *Motivating Consideration:* *Ex Ante* Pareto respects individual sovereignty over risk (if everyone prefers lottery A, society should too). *Ex Post* Pareto respects outcomes across states of nature (if A is better in every state, society should prefer it). Harsanyi privileges *Ex Ante*, but this can violate fairness across states (Diamond's critique). A successful theory must take a stand on which form of respect trumps the other.
      *   *Status:* **Non-negotiable** (must resolve the conflict, not ignore it).

  4.  **Existence of a Common Zero (Origin Comparability)**
      *   *Motivating Consideration:* To distinguish between making the well-off better off and the badly off less badly off, we need a neutral baseline of welfare. Without a common zero, we cannot formulate prioritarian concerns or distinguish utility from disutility meaningfully across persons.
      *   *Status:* **Camp-Specific** (Required by Prioritarians and Sufficientarians; Utilitarians may treat it as technical).

  5.  **Existence of a Common Unit (Unit Comparability)**
      *   *Motivating Consideration:* To trade off my pain against your gain, the "size" of a utility unit must be invariant across persons. Harsanyi derives cardinality from risk but fails to bridge the gap to *interpersonal* unit comparability. A successful theory must ground this normatively, not merely assume it.
      *   *Status:* **Non-negotiable** (Aggregation is impossible without it).

  #### II. Substantive Cases

  6.  **The Chronically Deprived (Adapted Preferences)**
      *   *Motivating Consideration:* Agents often adapt preferences to oppression (the "happy slave"). A theory that aggregates subjective satisfaction will validate their deprivation. A successful theory must discount or correct for adaptive preferences without imposing external perfectionism.
      *   *Status:* **Non-negotiable**.

  7.  **Belief-Driven Unanimity**
      *   *Motivating Consideration:* If all individuals prefer option A based on a shared false belief (e.g., a medical cure that is actually poison), strict Paretianism mandates choosing A. A successful theory must allow social choice to track truth or objective good when unanimity is epistemically defective.
      *   *Status:* **Non-negotiable**.

  #### III. Conceptual Distinctions

  8.  **Impartial Observer vs. Aggregation Theorem**
      *   *Motivating Consideration:* Harsanyi conflates the *Impartial Observer Theorem* (deriving social welfare from an observer's uncertainty about their identity) with the *Aggregation Theorem* (summing fixed individual utilities). The former is a thought experiment about empathy; the latter is a structural constraint on preferences. Collapsing them hides the move from "I would choose" to "We must choose."
      *   *Status:* **Non-negotiable**.

  9.  **Level vs. Unit Comparability**
      *   *Motivating Consideration:* Knowing who is worse off (level) is distinct from knowing how much worse off they are relative to another's gain (unit). Confusing these leads to category errors when attempting to implement equality of opportunity versus equality of outcome.
      *   *Status:* **Non-negotiable**.

  10. **Complete Social Ordering vs. Cycle-Free**
      *   *Motivating Consideration:* Harsanyi demands a complete ranking of all social states. However, under conditions of deep incomparability, a requirement for completeness forces arbitrary distinctions. A theory should admit when values are incommensurable rather than forcing a ranking.
      *   *Status:* **Camp-Specific** (Required by Decision-Theoretic Purists; rejected by Pluralists).

  #### IV. Limit Conditions

  11. **Unbounded Utilities and Infinite Populations**
      *   *Motivating Consideration:* Standard aggregation fails with infinite sums (the "Repugnant Conclusion" or intergenerational paralysis). A theory must specify how it handles limits, either by discounting, averaging, or accepting incompleteness in infinite contexts.
      *   *Status:* **Camp-Specific** (Required by Long-termists/Intergenerational Theorists).

  ***

  ### Incompatibilities and Trade-offs

  The central contribution of this chapter is to demonstrate that the following subsets of desiderata cannot be jointly satisfied. These are not merely technical glitches but normative contradictions.

  1.  **Ex Ante Pareto + Ex Post Anonymity + Diverse Risk Attitudes:**
      You cannot simultaneously respect individual risk attitudes (Ex Ante Pareto), treat individuals equally across states of nature (Ex Post Anonymity), and allow individuals to hold different attitudes toward risk. If individuals differ in risk aversion, satisfying Ex Ante Pareto requires violating Ex Post Anonymity (Diamond 1967; Mongin 1995). You must choose between respecting sovereignty over risk or ensuring fairness across states.

  2.  **Preference Sovereignty + Adapted Preferences Correction:**
      You cannot strictly aggregate subjective preferences while simultaneously correcting for adaptive preferences (the "happy slave"). Correcting adaptation requires an objective metric of welfare that overrides expressed preference, violating the welfarist constraint that preference satisfaction is the sole good.

  3.  **vNM Formalism + Interpersonal Unit Comparability (Internal Derivation):**
      You cannot derive interpersonal unit comparability solely from the vNM axioms satisfied by individuals. The axioms fix individual cardinal scales up to a positive affine transformation, but they leave the interpersonal scaling factor indeterminate. Any theory claiming to derive unit comparability from rationality alone is mathematically incomplete; it must import external normative data.

  **The Single Eliminating Requirement:**
  The requirement that eliminates the most proposals is **Interpersonal Unit Comparability derived without external non-utility data**. Most formal repairs retain the vNM framework but fail to justify why one person's util is equal to another's without appealing to non-preference information (e.g., primary goods, capabilities, or observer empathy). Insisting that the aggregation rule itself justify the common unit, rather than assuming it, rules out standard Harsanyian Utilitarianism and most social choice variants that rely solely on preference orderings.

  ***

  ### Evaluation of Familiar Repairs

  **Supplying comparability through the observer's extended preferences** succeeds in grounding unit comparability by positing a hypothetical agent who can experience all lives, but it risks collapsing the distinction between the Impartial Observer and Aggregation theorems, effectively substituting one person's risk attitude for the group's moral obligation.

  **Replacing the cardinal framework with a richer informational basis** (à la Sen) resolves the comparability and adapted preference issues by admitting non-utility data, but it abandons the Paretian constraint that preferences are sovereign, requiring a controversial shift from welfarism to a capability or objective list approach.

  **Retreating to weighted aggregation with weights fixed by political procedure** sidesteps the epistemic problem of measuring utility units by deferring to democratic legitimacy, but it fails to provide a normative critique of the outcome, rendering the theory unable to condemn a democratically sanctioned tyranny of the majority over a deprived minority.
