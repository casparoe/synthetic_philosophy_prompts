answer: |-
  ### Brainstorm: Who's the Real Threat?

  Look, the psychophysicists are noisy, but they're manageable. If Color Phi is a demand artifact, you pivot to "interference effects in temporal binding" and live to fight another day. The Computationalist is just asking for homework you can promise to do later. The Global Workspace guy is going to claim ownership of your variable, but that's a turf war, not an execution.

  The two people who can actually kill the chapter are your **Advisor** and the **Phenomenal Conservative**.

  Your Advisor knows Multiple Drafts better than you. If he smells even a whiff of a "final edit" moment hidden inside your cost function, he'll call it a Cartesian Theater with a price tag. That undermines the whole philosophical framing. But the Phenomenal Conservative is the real sniper. If they convince the room that DCD only tracks *reportability* (access) and not *experience* (phenomenality), you haven't solved the Orwellian/Stalinesque problem; you've just dissolved it by changing the subject. That forces you to abandon the claim that this reframes *consciousness* timing.

  Here's your prep sheet. Keep your answers tight, don't bluff on the math, and know when to yield ground to save the core.

  ***

  ### Workshop Prep Sheet: DCD & Color Phi

  **1. The Psychophysicist (Demand Characteristics)**
  *   **The Objection:** "Look, we've known for twenty years that Color Phi is fragile. If you clean up the demand characteristics—force choices, remove narrative cues—the effect shrinks or vanishes. You're building a theoretical variable on a paradigm that might not survive a preregistered replication. Why should we trust DCD if the baseline effect is suspect?"
  *   **The Reply:** "That's a fair worry, and it's why I'm not betting the farm on the illusion itself surviving every cleanup. I'm betting on the *interaction*. Even if the magnitude of the phi effect shrinks under strict controls, the prediction is about the *slope* of the interference cost across SOAs. If the illusion is purely demand-driven, the cost should be flat regardless of downstream commitment. If DCD matters, the cost function changes shape when motor prep is engaged. I'm using Color Phi as a probe for the commitment structure, not defending the illusion as a veridical window into qualia."
  *   **Soft Spot:** You're admitting the baseline might be weak. If the effect disappears completely, your interaction vanishes with it.
  *   **Concede?** No. Hold the line on the interaction effect.

  **2. The Psychophysicist (Dual-Task Cost)**
  *   **The Objection:** "You say revision cost blows up when the second flash is recruited into a speeded response. But that sounds exactly like ordinary dual-task interference or psychological refractory period effects. You've added a fancy label, 'DCD,' but haven't shown this isn't just standard bottlenecking. What does DCD add that a standard queueing model doesn't?"
  *   **The Reply:** "Standard bottleneck models treat the content as neutral tokens moving through a pipe. DCD claims the *semantic or perceptual content* itself changes the cost based on how many systems have consumed it. A standard dual-task cost predicts slowdown based on timing overlap. DCD predicts slowdown based on *integration depth*. If I bind the color to a motor plan versus binding it to a verbal report, the cost should differ even if the timing is identical, because the commitment depth differs. I'm predicting content-sensitive scaling, not just temporal congestion."
  *   **Soft Spot:** This is empirically hard to dissociate without a very clever control condition.
  *   **Concede?** **YES (KILLER).** If you can't dissociate DCD from standard interference in the Q&A, admit you need a stronger control condition to rule out generic bottlenecking. Don't fight this too hard; it threatens the variable's uniqueness.

  **3. The Computationalist**
  *   **The Objection:** "You talk about cost scaling and commitment depth, but where's the function? Is DCD a discrete stage count or a continuous variable? Is the cost linear or exponential? Without a formal model, this is just a metaphor dressed up as a mechanism."
  *   **The Reply:** "Right now it's a conceptual framework to generate the hypothesis, which is why the pilot is behavioral. But the plan is to model it as a weighted sum of downstream processes consuming the token. I'm treating DCD as continuous for now, proportional to the number of distinct systems (motor, linguistic, mnemonic) that have locked the content. I'm happy to collaborate on formalizing the cost function post-workshop, but the philosophical claim holds even if the exact curve is empirical."
  *   **Soft Spot:** You look hand-wavy. Cog Sci loves equations.
  *   **Concede?** No. Promise the model as future work.

  **4. The First-Year (Methodology)**
  *   **The Objection:** "You mentioned the pilot is n=14 and unregistered. Given the replication crisis, isn't it risky to draw theoretical conclusions about consciousness timing from this data? Shouldn't you wait for a full run?"
  *   **The Reply:** "Absolutely. This chapter is presenting the framework and the pilot as a feasibility check, not a definitive test. The claim isn't 'DCD is proven,' it's 'DCD dissolves the Orwellian/Stalinesque dichotomy and offers testable predictions.' The pilot shows the prediction isn't vacuous. The full registered replication is the next step of the dissertation."
  *   **Soft Spot:** Makes you look premature.
  *   **Concede?** Yes, openly. It makes you look responsible.

  **5. The Global Workspace Guy**
  *   **The Objection:** "This sounds familiar. 'Downstream Commitment' sounds a lot like 'Global Ignition.' Once content is broadcast, it's committed. You're basically describing the latency of ignition with extra steps. Why isn't this just Global Workspace Theory?"
  *   **The Reply:** "GWT focuses on the *onset* of availability—the spark. DCD focuses on the *consequences* of that availability over time. Ignition is binary; commitment is gradable. You can have partial broadcasting that binds to motor systems but not linguistic ones. DCD lets us talk about the texture of the broadcast after the switch is flipped, which GWT usually treats as a monolithic event. I'm looking at the wake of the ignition, not the spark."
  *   **Soft Spot:** The distinction between "ignition" and "commitment" might be thinner than you want.
  *   **Concede?** No. Argue for granularity.

  **6. The Advisor (Multiple Drafts)**
  *   **The Objection:** "Dennett's point was that the Orwellian/Stalinesque distinction is bogus because there's no finish line. You're reintroducing a finish line by talking about 'revision costs.' If there's no central editor, who is paying the bill? You've just bolted a cost function onto a Cartesian Theater."
  *   **The Reply:** "I'm not positing a central editor paying a bill. I'm positing distributed processes that become harder to decouple as they interlock. The 'cost' isn't paid to a homunculus; it's the friction of changing constraints in a parallel network. The Theater is dead, but the network has topology. DCD measures the topological depth of the content in the network, not its distance from a viewer. It's Multiple Drafts with a network topology map."
  *   **Soft Spot:** If you slip and talk about "the system deciding," you're dead.
  *   **Concede?** No. Be very careful with agency language.

  **7. The Phenomenal Conservative (Naive Realist)**
  *   **The Objection:** "You say this dissolves the intuition about which story is 'conscious.' But you've just swapped 'conscious experience' for 'accessibility for report.' You're measuring when the content becomes hard to change for the *report*, not for the *experience*. You've begged the question by assuming access equals phenomenality."
  *   **The Reply:** "I'm not assuming they're identical. I'm arguing the distinction relies on a magic moment of 'becoming conscious' that doesn't exist in the data. If the computational cost of revision scales continuously with downstream commitment, there's no sharp boundary where experience 'locks in.' Whether you call that phenomenality or access, the *timing problem* disappears because there's no single time to find. I'm not solving the Hard Problem; I'm dissolving the timing puzzle that fuels the Orwellian/Stalinesque debate."
  *   **Soft Spot:** This is the core philosophical attack. If they insist phenomenality must be distinct from access, you have no leverage.
  *   **Concede?** **YES (KILLER).** If they press that you haven't addressed *phenomenality*, admit DCD tracks *functional availability*. Don't claim it solves the Hard Problem. Pivot to "timing of reportable content."

  **8. The Psychophysicist (Operationalization)**
  *   **The Objection:** "How do you actually measure DCD in real-time? You're inferring it from the task structure. But if a subject covertly prepares a motor response even in the 'low commitment' condition, your variable is noise. How do you validate the depth?"
  *   **The Reply:** "That's why the speeded response manipulation is key. We compare blocks where motor prep is explicitly required versus blocks where it's withheld. We can use EMG to check for covert prep in the low-commitment condition. If DCD is valid, the interference cost should correlate with explicit commitment instructions, not just SOA."
  *   **Soft Spot:** Covert prep is hard to rule out completely.
  *   **Concede?** No. Mention EMG control.

  ***

  ### The "Prayer" Question
  **The Question:** "If Multiple Drafts is right and there's no fact of the matter about when experience occurs, what exactly is DCD measuring the cost *of*? If there's no experience to revise, why does the cost matter?"

  **The Reply:** "It's measuring the cost of maintaining *consistency* across the drafts. The brain generates multiple, potentially conflicting narratives. DCD measures how much friction is involved in suppressing the conflicting drafts to produce a unified report. The 'cost' isn't about editing a finished movie; it's about the energy required to keep the competing scripts from bleeding into each other during the production. The timing mystery vanishes because there's no single premiere date, just a distribution of completion times."

  **Tactical Note:** If this question comes up, pause. Take a sip of water. This is the Advisor testing whether you truly understand the Multiple Drafts view or if you're just using it as wallpaper. If you stumble here, you look like you haven't internalized the theory you're defending.
