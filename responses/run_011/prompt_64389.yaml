prompt: |-
  You're a philosopher of mind who's done a lot of work on the timing of experience — the Dennett/Kinsbourne stretch of territory — and you've sat through enough workshop Q&As to know which questions actually hurt. Act in that role and help me prep.

  I'm a fourth-year cog sci PhD student presenting a chapter at my lab group's end-of-term consciousness workshop next week. My claim is that the Orwellian vs. Stalinesque distinction, as it gets drawn for color phi, isn't empty but it is mis-framed: the difference between the two isn't whether experience gets edited before or after it's "had," it's who pays the computational bill and how that bill scales. I introduce a variable I call downstream commitment depth (DCD) — roughly, how many processes (motor prep, inference, report drafting, cross-modal binding) have already consumed a piece of content at the moment revision would have to touch it. On a Stalinesque story the content sits unsettled in a buffer, so DCD stays near zero and revision is cheap, but the buffer is occupied; on an Orwellian story content is written early and revision cost grows with DCD. My prediction is that the color phi interference cost should stay flat across SOAs whenever the concurrent task keeps DCD low, and should blow up only when the second flash's color has already been recruited into a speeded response. My pilot (n=14, one lab, unregistered — I know) is consistent with that, and I think the framework dissolves the intuition that one of these stories has to be "conscious" and the other not.

  The room: two apparent-motion psychophysicists who think color phi won't survive a demand-characteristics cleanup, and one of whom will definately argue my speeded-response manipulation just adds an ordinary dual-task cost that has nothing to do with revision; a global-workspace guy who'll say DCD is his ignition with a new name; a phenomenal conservative / naive realist who thinks I've quietly swapped "conscious" for "accessible" and am begging the question; my advisor, a Multiple Drafts sympathizer, who wants to know if I've just reinvented the Cartesian theater critique with a cost function bolted on; a computationalist who wants an actual model with a DCD parameter and a fitting story; and a few first-years.

  Give me the prep sheet: the eight or so objections I'll really get from these specific people, in roughly the order they'll come, each phrased in that person's own idiom rather than in a generic philosopher's voice. For each, a ~90-second reply, a blunt note on where the reply is softest, and a flag for whether I should just concede it up front. Mark the two that would force me to abandon DCD altogether rather than tweak it, and end with the one question I'm praying nobody asks, plus what I'd say if it lands. Think carefully, and start with a short brainstorm about who in that room is most dangerous to me and why before you write the sheet. No bibliography, no reading list, no citations — I know the literature, I need the tactics. American English, please.
