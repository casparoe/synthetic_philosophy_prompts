  ### Fourth: The Crucial Case

  To definitively separate the **Explanatory Individualism Criterion** (Accept) from the **Ontological Supervenience Criterion** (Reject), you would need to present her with a case where the mechanism is perfect, but the author explicitly argues for *one-way* causation that denies micro-dependence in the *model*, not just the preamble.

  **The Case:**
  A paper explaining the stability of a currency peg.
  *   **Mechanism:** The author provides a perfect step-by-step account of central bankers adjusting interest rates in response to market pressure, and traders buying/selling based on those rates. Every link in the chain is individual agency.
  *   **Philosophical Claim:** The author argues that the "Peg" is a causal force that *determines* the bankers' and traders' behavior, and explicitly states that even if every banker and trader ceased to believe in the Peg, the Peg would continue to constrain their behavior due to its systemic logical necessity. The author treats the individuals as mere transmission belts for the Peg's logic, denying that the Peg *depends* on them for its causal power, only for its execution.

  **Predictions:**
  *   **Explanatory Individualism Criterion:** Predicts **Accept**. The causal chain is fully traced through individuals (bankers adjusting, traders buying). The "work" is done by people.
  *   **Ontological Supervenience/Dependence Criterion:** Predicts **Reject**. The author explicitly denies that the macro fact depends on the micro states (it constrains even if they cease to believe), aligning it with Rejected #5 (system logic) rather than Accepted #4 (convention sustained by expectation).

  If she accepts this, she cares only about the *mechanism*. If she rejects it, she cares about the *ontological dependence* claimed by the author.

