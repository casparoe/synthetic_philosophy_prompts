  ### First: Candidate Criteria and Testing

  Here are five candidate criteria derived from the structure of the editor's decisions, tested against the eight precedents.

  **1. The Mechanism Requirement**
  *Definition:* An explanation is acceptable only if it traces a step-by-step causal process connecting the *explanans* to the *explanandum*. "Black box" explanations that posit a cause and an effect without describing the transmission are rejected.
  *Test:*
  *   **Accepted 1–4:** All provide fine-grained sequences (cascade, coordination at barricade, voting sequence, gossip/sanctioning).
  *   **Rejected 5–8:** All explicitly lack a process description ("no account of anything happening," "no feedback process," "no process described").
  *   **Verdict:** **Survives.** This criterion perfectly divides the accepts from the rejects.

  **2. The Explanatory Individualism Requirement**
  *Definition:* The causal *work* in the explanation must be performed by individuals (their actions, beliefs, or interpretations). Macro-level facts may be cited as context, but they cannot be depicted as doing causal work that bypasses human agency.
  *Test:*
  *   **Accepted 1–4:** In every case, individuals do the work (depositors running, demonstrators moving, committee members voting, traders gossiping).
  *   **Rejected 5–8:** In every case, the macro-entity does the work (system logic, crowd mind, needs of the whole, spirit of the age).
  *   **Verdict:** **Survives.** This aligns with her rejection letter ("social facts... do work that the people... never do").

  **3. The Ontological Supervenience Requirement**
  *Definition:* Macro-level facts must be metaphysically fixed by or dependent upon micro-level facts. If the individuals changed their attitudes or actions, the macro fact would necessarily change or cease to exist.
  *Test:*
  *   **Accepted 1 & 3:** Clearly fit (beliefs and votes fix the outcomes).
  *   **Accepted 2 & 4:** **Problematic.** In #2, the author argues the intention *cannot* be decomposed into private states. In #4, the author concedes the convention *cannot* be paraphrased away into individual attitudes. However, both admit the macro fact is *sustained* by micro behavior.
  *   **Rejected 5, 6, 8:** Explicitly deny dependence ("neither a matter of, nor fixed by").
  *   **Rejected 7:** Denies feedback through behavior.
  *   **Verdict:** **Ambiguous/Weak.** While the rejects violate this, Accepts #2 and #4 flirt with violating it by denying reducibility, though they maintain *causal* dependence. If the criterion is strict metaphysical supervenience, #2 and #4 should have been rejected. If it is merely causal dependence, it collapses into Criterion 2.

  **4. The Paraphrase/Reduction Requirement**
  *Definition:* Macro-level terms must be eliminable in favor of micro-level terms without loss of explanatory power.
  *Test:*
  *   **Accepted 2 & 4:** Explicitly fail this (authors argue against decomposability and paraphrase).
  *   **Verdict:** **Fails.** The editor accepts papers that posit irreducible macro-entities, provided they are handled correctly in the explanation.

  **5. The Agency/Interpretation Requirement**
  *Definition:* The causal chain must pass through the interpretive agency of the participants. They must "take up" the macro fact in some way (believe it, intend it, fear it).
  *Test:*
  *   **Accepted 1–4:** Participants interpret beliefs, intentions, rules, or conventions.
  *   **Rejected 5–8:** Participants are bypassed or swept up by forces they do not interpret (system logic, emergent mind, needs, spirit).
  *   **Verdict:** **Survives.** This is a specific version of Criterion 2 but focuses on the *mode* of causation (interpretation vs. brute force).

  **Survivors:** The **Mechanism Requirement**, the **Explanatory Individualism Requirement**, and the **Agency Requirement** are the robust survivors. The Ontological Supervenience Requirement is too weak to account for Accepts #2 and #4, and the Paraphrase Requirement is contradicted by them.

