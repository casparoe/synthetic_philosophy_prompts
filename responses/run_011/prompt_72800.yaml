  ### Fifth: Recommendation

  **Decision:** Recommend **Acceptance**.

  **Coherence with Record:**
  This decision best coheres with her record, specifically **Accepted #4 (Asset Bubble)**.
  *   **Specific Respect:** Both papers posit a macro-construct (Convention vs. Covenant) that participants treat as an objective reality external to themselves. In both, the authors claim this construct cannot be reduced to individual attitudes (Acc #4: "not paraphrasable"; New: "does not supervene"). Crucially, in both, the *persistence* of the phenomenon is explained by a feedback loop of individual expectations and sanctions (Acc #4: "gossip and sanctioning"; New: "expectation of veto" and "threat of litigation").
  *   **Distinction from Rejects:** Unlike Rejected #5 (War), where the system acts *without* an account of individuals, the new submission details exactly how individuals enact the constraint. Unlike Rejected #7 (Institution), there is a clear feedback process through behavior.

  **Principle Committed To:**
  By accepting this paper, the collection commits to **Explanatory Individualism without Ontological Individualism**. It establishes the principle that social scientists may treat macro-entities (institutions, laws, conventions) as real and causally efficacious *in their descriptions*, provided they demonstrate that the *causal power* of those entities is mediated through the beliefs, actions, and interpretations of individuals.

  **Hidden Principle:**
  If she accepts, she adopts a principle she may not have noticed: **The primacy of explanatory practice over metaphysical consistency.** She allows authors to claim their macro-entities are independent of individuals (metaphysics) as long as they explain the entity's effects via individuals (practice). If she rejects, she privileges the author's metaphysical preamble over their explanatory labor. Given her terse letters focus on "work" and "how it works," consistency dictates she should privilege the labor.

  **Advice on Consistency:**
  Consistency with her record *is* the right criterion here. An edited collection must have a methodological identity. Her identity is not "Methodological Individualism" (which would have rejected #2 and #4), but "Mechanism-Based Explanation." To reject this submission would be to shift the collection's goalposts from *mechanism* to *ontology*, which would render Accepts #2 and #4 inexplicable. Recommend acceptance to maintain the integrity of the selection criteria established over the last four years.
