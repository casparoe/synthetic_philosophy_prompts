prompt: |-
  I sit on the program committee of a private foundation with a $400 million endowment and a mandate to fund long-horizon work on what we call, deliberately vaguely, "societal resilience." At this quarter's meeting we must decide a single request: a five-year, $6 million grant to the Callander Institute, whose researchers have built a forecasting model that assigns probabilities to state breakdown by comparing modern states against a reference class of 43 historical polities. Their headline result, on which the entire proposal hangs, is that a large, fiscally strained, and politically polarized state of roughly our profile faces a 1-in-6 chance of severe institutional breakdown within a decade. They present this figure as the outside view — a base rate read off how often comparable polities in their dataset actually failed — and they explicitly argue that it should override the inside view of expert scenario analysis, which they regard as little more than motivated storytelling.

  The committee is split three ways, and the split is not about the institute's competence, which nobody disputes. One faction holds that we are obliged to defer to the base rate: whatever our experts think they know about this particular state, the historical record is the only honest sample anyone has, and the history of failed forecasting is largely the history of confident people explaining why this case is different. A second faction holds that the reference class is rigged. The 43 polities are agrarian and early-modern, lacking nuclear weapons, integrated financial markets, mass literacy, standing international organizations, and continuous statistical record-keeping; a base rate drawn from them is either too general to inform anything or silently assumes those differences do not matter. That faction adds that the list of 43 was assembled only after the researchers had examined outcomes, that societies which collapsed conspicuously are far better documented than the many small polities that quietly dissolved, so the denominator is not what it looks like, and that the number is quoted over a ten-year horizon when the underlying events are dated over centuries — with the conversion between the two horizons performed by an assumption nobody has defended. A third, smaller faction raises something else entirely: a forecast that is published and believed changes the thing it forecasts, and a sample containing no forecasters cannot license predictions about a world that now contains many of them.

  Draft the decision memo I will circulate before the vote. It must land on an actionable recommendation — fund as proposed, fund subject to conditions, or reject — and if you recommend conditions, state them concretely enough to be written into a grant agreement and concrete enough that the institute could meaningfully accept or decline them. Take the strongest case for the losing side seriously rather than caricaturing it, and address directly the question the committee keeps circling without settling: whether there is any principled procedure for selecting a reference class, or whether the choice of class is always doing the substantive work and the base rate merely decorating it. If your conclusion is that a base rate cannot bear the weight the proposal puts on it, say what should bear that weight instead. Aim for a document of the length a trustee would actually read, with a clear bottom line up front. No survey of the literature and no bibliography — we need a recommendation and reasons our trustees could argue with.
reasoning: |-
  Here's a thinking process that leads to the decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Program Committee Member of a private foundation ($400M endowment, mandate: "societal resilience").
      *   **Task:** Draft a decision memo for the upcoming vote on a specific grant request.
      *   **Subject:** A 5-year, $6M grant to the Callander Institute.
      *   **Proposal:** Forecasting model assigning probabilities to state breakdown using a reference class of 43 historical polities.
      *   **Key Finding:** 1-in-6 chance of severe institutional breakdown within a decade for a state like the funder's own context (large, fiscally strained, polarized).
      *   **Methodology Claim:** "Outside view" (base rate) overrides "inside view" (expert scenario analysis).
      *   **Committee Split:**
          1.  *Defer to Base Rate:* History is the only honest sample; expert confidence is usually wrong.
          2.  *Reference Class is Rigged:* 43 polities are incomparable (agrarian/early-modern vs. modern); selection bias (survivorship/documentation); time-horizon conversion is undefended.
          3.  *Reflexivity:* Publishing the forecast changes the outcome; historical sample lacks forecasters.
      *   **Requirements:**
          *   Actionable recommendation (Fund, Fund w/ Conditions, Reject).
          *   If conditions, they must be concrete/writable into a grant agreement.
          *   Take the strongest case for the losing side seriously.
          *   Address the core epistemological question: Is there a principled procedure for selecting a reference class, or is the choice doing the substantive work?
          *   If base rates can't bear the weight, say what should.
          *   Length: Trustee-readable (concise, punchy, clear bottom line).
          *   No literature survey/bibliography.

  2.  **Determine the Recommendation:**
      *   *Option A (Fund as Proposed):* Too risky. The methodological critiques (Faction 2 & 3) are substantial. Betting $6M on a potentially flawed base rate contradicts the "resilience" mandate if the model is misleading.
      *   *Option B (Reject):* Too harsh. The institute is competent. The question is important. The "outside view" discipline is valuable even if this specific implementation is flawed.
      *   *Option C (Fund with Conditions):* Best path. It acknowledges the value of the work but mitigates the risks identified by Factions 2 and 3. It forces the institute to address the reference class validity and the reflexivity problem.
      *   *Decision:* **Fund Subject to Conditions.** This allows the foundation to support the *discipline* of forecasting without endorsing the specific *conclusion* derived from potentially mismatched historical data.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** Needs to be the first thing read. State the recommendation clearly.
      *   **Context:** Briefly summarize the proposal and the stakes ($6M, 5 years, 1-in-6 risk claim).
      *   **The Core Dispute (Reference Class Validity):** This is the heart of the prompt's requirement. I need to address whether reference class selection is principled or arbitrary.
          *   *Argument:* The choice of reference class *is* the model. It's not just decoration. Comparing a modern nuclear state to an agrarian empire is a category error unless specific adjustments are made.
          *   *Resolution:* We cannot accept the base rate as a standalone truth. It must be stress-tested against modern covariates.
      *   **Addressing the Factions:**
          *   *Faction 1 (Base Rate Purists):* Acknowledge their point (experts are overconfident). But counter with: bad data + rigorous math = precise error.
          *   *Faction 2 (Comparability Critics):* Validate their concerns (nuclear weapons, finance, etc.). This drives the conditions.
          *   *Faction 3 (Reflexivity):* Acknowledge the "performative forecast" risk. A 1-in-6 prediction could become a self-fulfilling prophecy or a self-negating one.
      *   **The Conditions (Concrete & Actionable):**
          *   Need to fix the reference class issue. *Condition 1:* Require a "Modern Covariate Adjustment." They can't just use the raw 43. They must model why modernity matters.
          *   Need to fix the time-horizon issue. *Condition 2:* Defend the conversion from centuries to decades.
          *   Need to address reflexivity. *Condition 3:* Publication protocol. Don't just release the "1-in-6" headline without context on mitigation.
          *   Need to address the "Inside View." *Condition 4:* Integrate expert elicitation, not dismiss it. Use the base rate as a prior, not a replacement.
      *   **What Bears the Weight (If not Base Rate):** If the base rate is weak, what do we rely on? *Structural indicators + Expert Delphi + Real-time monitoring.* The memo needs to state this alternative.
      *   **Conclusion:** Reiterate the strategic fit.

  4.  **Refining the Tone:**
      *   Must sound like a trustee/committee member speaking to peers.
      *   Authoritative but open to debate.
      *   Avoid academic jargon where possible, but use precise terms where necessary (e.g., "covariates," "reflexivity").
      *   Ensure the "principled procedure" question is answered directly. (Answer: There is no algorithm for reference class selection; it requires causal justification.)

  5.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I address the "principled procedure" question? *Yes, in the analysis section.*
      *   *Check:* Are the conditions concrete enough for a grant agreement? *Yes, specific deliverables and review gates.*
      *   *Check:* Did I take the losing side seriously? *I need to make sure I don't dismiss Faction 1 too easily. Their point about expert overconfidence is valid.* -> *Adjustment: Explicitly acknowledge that Faction 1 is right about the *danger* of inside views, even if their solution here is flawed.*
      *   *Check:* Is the length appropriate? *Keep it under 1,500 words.*
      *   *Check:* Did I answer "what should bear the weight"? *Yes, propose a hybrid model.*

  6.  **Final Polish:** Check for clarity, flow, and impact. Ensure the "Bottom Line" is unmistakable. (The resulting draft follows this structure.)

  *(Self-Correction Note on the "Principled Procedure" Question)*: This is the philosophical crux. I need to be careful not to say "reference classes are useless." I need to say "reference classes are tools, not oracles." The selection *is* the argument. I will phrase it as: "The reference class choice is not a preprocessing step; it is the substantive hypothesis."

  *(Self-Correction on Conditions)*: Make sure they aren't just "do better." They need to be "Submit X by Date Y" or "Milestone Z must be met."
  *   Condition 1: Causal mapping of differences (Modern vs. Historical).
  *   Condition 2: Sensitivity analysis on the time-horizon conversion.
  *   Condition 3: Integrated forecasting (Base rate + Inside view).
  *   Condition 4: Reflexivity mitigation plan (Communication strategy).

  7.  **Final Review against constraints:** No bibliography. Actionable recommendation. Address the specific factions. Address the reference class philosophy.

