prompt: |-
  I build a root-cause tool for a distributed system — when something falls over, it's supposed to tell you which deploy or config change actually did it — and at 2am I argued myself into a wall. No philosophy background here, so treat me like a smart person who's never seen the literature. The whole tool rests on:

  (1) X caused E just in case E wouldn't have happened if X hadn't. Difference-maker test, nothing more.

  (2) Nothing in (1) says the difference-maker has to be something that happened. We cite omissions constantly in postmortems: the on-call didn't ack the page, there was no health check on that endpoint, nobody rolled back. If omissions are allowed there, they're allowed generally.

  (3) But once they're allowed generally the test explodes. Take our last outage. The on-call didn't restart the service — fine, that one feels right. But also: nobody else in the company restarted it, nobody else on the planet restarted it, the vendor never shipped a client with retries, and our founders picked a language ten years ago that made the eventual rewrite impossible. Every one of those supports a true if-X-had-happened, E-wouldn't-have claim about that outage.

  (4) So under (1) all of them are causes, and it generalizes: for any event E and any X that failed to prevent E, the absence of X caused E.

  (5) A theory on which everything caused the outage can't tell me who to page or what to fix. It's not a theory of causation, it's a way of saying nothing. So (1) is false.

  Here's the part that makes me suspicious of my own escape hatch. My patch was: only admit counterfactuals whose antecedent is a change you could actually make locally to the system, holding everything upstream and independent fixed — flip this one node's value, watch E. That kills the founders case, since you can't hold the rest of the world fixed while changing a decade-old decision. But now whether the vendor's client caused the outage depends on which variables I put in my model. Add a variable for client retry behavior and it's a cause; leave that variable out and it isn't. That seems to prove too much in the other direction: the process crashed the way it crashed long before I drew any graph, and I don't want to end up saying my modeling choices made it true or false that a buffer overflow caused it.

  (6) So the naive test collapses and my patch collapses, and maybe causation isn't a real relation at all, just a story we tell afterwards.

  Which step do I actually reject, and what does rejecting it cost? I'd rather keep (1) than (5) — the difference-maker idea is the only thing that makes the tool mean anything, and I don't want to throw it out. But I'm not attached to (2) either. If omissions are the problem, I need the line, becuase every version I come up with either lets the founders back in or kicks the on-call out, and the on-call one I'd bet my job on. And if you think the tool can still be built on whatever survives, tell me what the acceptance test for a candidate cause should be.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User Persona:** Smart engineer/builders, no philosophy background, building a root-cause analysis (RCA) tool for distributed systems. Pragmatic, under pressure (2am debugging vibes), values utility over metaphysical purity.
      *   **The Core Problem:** The "but-for" test (counterfactual dependence) leads to causal explosion (too many causes, including omissions and distant historical decisions). The user's attempted fix (local interventions) makes causation dependent on modeling choices, which feels arbitrary.
      *   **The Goal:** Identify which premise to reject to save the tool's utility, specifically keeping the "difference-maker" intuition (1) while avoiding the explosion (5). They need a concrete acceptance test for a candidate cause.
      *   **Constraints:** Treat them like a smart non-philosopher. Avoid jargon where possible, or explain it clearly. Address the specific tension between omissions (on-call didn't act) vs. infinite omissions (founders chose wrong language).

  2.  **Deconstruct the Argument:**
      *   (1) But-for test (Counterfactual Dependence).
      *   (2) Omissions count as causes (On-call didn't ack).
      *   (3) Explosion problem (Everyone didn't ack, founders chose wrong language).
      *   (4) Conclusion: Everything is a cause.
      *   (5) Utility failure: If everything is a cause, nothing is actionable.
      *   (6) Skepticism: Maybe causation isn't real.
      *   *User's Patch:* Local interventions only.
      *   *Problem with Patch:* Model relativity (causation depends on what variables you track).

  3.  **Evaluate the Philosophical Landscape (Mental Sandbox):**
      *   *Hume/Lewis:* Counterfactuals are key, but Lewis deals with preemption/overdetermination. Doesn't fully solve the omission explosion.
      *   *Hart & Honoré:* Legal causation. Distinguishes "causes" from "conditions." Uses "abnormality" or "intervention."
      *   *Halpern & Pearl:* Structural Causal Models (SCM). This is exactly the user's "patch" territory. They formalize the "model relativity" issue. They distinguish *actual causation* from *potential causation*.
      *   *Pragmatic/Contextualist:* Causation is interest-relative. We pick causes based on what we can control or what violated a norm.
      *   *Mechanistic:* Causation requires a physical process/transfer. (Hard to apply to omissions).

  4.  **Identify the Weak Link:**
      *   Premise (1) is the user's anchor. Don't drop it.
      *   Premise (5) is the utility constraint. Don't drop it.
      *   Premise (2) is the troublemaker *if* applied without restriction.
      *   The real issue isn't (1) or (2) individually, it's the lack of a *selection mechanism* for *which* counterfactuals matter.
      *   *Decision:* Reject the idea that *all* true counterfactuals are equally "causes" for the purpose of the tool. Causation is real, but *causal explanation* is contextual.
      *   *Specific Target:* Reject the inference from (4) to (5) by introducing a **Normative/Expectation Filter**. The "founders" case fails not because it isn't a difference-maker, but because it wasn't a *deviation from the expected course of events*.

  5.  **Formulate the Solution:**
      *   **The Philosophical Concept:** "Abnormality" or "Deviation from Norm." (Hart & Honoré).
      *   **The Engineering Translation:** "Baseline Configuration" vs. "Delta."
      *   **Addressing Omissions:** Omissions are causes *only* when there was an expectation/obligation to act. The on-call *should* have acted. The founders *didn't need* to act ten years later.
      *   **Addressing Model Relativity:** Acknowledge it's real, but constrain the model. The model isn't arbitrary; it's defined by the *system boundary* and *deployment context*.
      *   **The Acceptance Test:** A candidate $X$ is a root cause if:
          1.  But-for test holds (Counterfactual dependence).
          2.  $X$ represents a deviation from the *expected/normal* state (Normative violation).
          3.  $X$ is actionable/controllable within the relevant timeframe (Interventionability).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, direct, engineering-focused. Acknowledge the 2am struggle.
      *   *Validate:* You found the "Causal Explosion" problem. It's a classic philosophical puzzle (Hart & Honoré, Lewis).
      *   *The Pivot:* Don't reject (1). Reject the idea that causation is *only* about metaphysics. It's about *explanation*.
      *   *The Fix:* Introduce the concept of **Contrastive Causation**. We don't ask "What caused E?" We ask "Why E *now* rather than *before*?" or "Why E *here* rather than *there*?"
      *   *Refining the Omission Issue:* Distinguish between "preventing causes" (omissions) and "background conditions." The line is **Expectation**. The on-call had a duty. The founders didn't have a duty to predict the future perfectly.
      *   *Refining the Model Issue:* The user worries model choice makes causation arbitrary. Response: The model is constrained by the *intervention space*. You can only intervene on what you own.
      *   *Concrete Acceptance Test:*
          1.  Counterfactual (But-for).
          2.  Deviation (Was this different from last week / spec / SLA?).
          3.  Leverage (Can we change this to prevent recurrence?).

  7.  **Final Polish:**
      *   Make sure to explicitly answer "Which step do I actually reject?"
      *   Answer: Reject the move from (3) to (4)/(5) without a filtering criterion. Or, more precisely, refine (2). Omissions are causes *only under specific conditions*.
      *   Actually, looking closer: The user asks to keep (1). So I should tell them to modify (2).
      *   *Correction:* It's better to say (1) is necessary but not sufficient. The definition of "Cause" in the tool needs an extra clause.
      *   *Key Insight:* The "Model Relativity" worry is actually a feature, not a bug, *if* the model is defined by the organization's sphere of control.
      *   *Structure:*
          1.  Validate the struggle (you discovered the "Causal Selection Problem").
          2.  Identify the culprit (Premise 2 needs a constraint).
          3.  Provide the filter (Norms/Expectations).
          4.  Address the Model Relativity fear (It's not arbitrary, it's bounded by control).
          5.  Give the Acceptance Test.

  8.  **Self-Correction during drafting:** I need to be careful not to sound like I'm dismissing the model relativity issue. Halpern (actual causality) is the rigorous math here. I should mention that "model relativity" is accepted in formal causality (Structural Equation Models), but the *choice* of model isn't arbitrary—it's dictated by the system boundary.
      *   *Wait, one nuance:* The user says "reject (1) or (2)". I think the best advice is to keep (1) as the *engine*, but reject (2)'s *unrestricted* application. Omissions are causes *only when they violate a norm*.
      *   *Let's check the Founders case:* Founders picking a language. Counterfactual holds. Omission? No, it's an action. But it's a *background condition*. Why is it not a cause? Because it wasn't a *change*.
      *   *Ah, the "Change" aspect:* The tool is for "which deploy or config change". The founders' decision wasn't a change relative to the outage timeframe.
      *   *Okay, the "Contrastive" approach is strongest.* "Why did it fail *today*?" requires a difference between today and yesterday. Founders' decision is constant. On-call inaction is a variable (they usually ack).
      *   *Let's synthesize:* Combine Contrastive Causation + Normative Expectation.

  9.  **Final Plan:**
      *   Acknowledge the "Causal Selection Problem."
      *   Tell them to reject the inference that *all* difference-makers are *relevant* causes.
      *   Keep (1) as the mechanism.
      *   Modify (2): Omissions count only when there is a **normative expectation** of action.
      *   Solve Model Relativity: The model is defined by the **intervention boundary** (what can we actually change next week?).
      *   Provide the 3-step Acceptance Test.

  10. (Reviewing against constraints): "Treat me like a smart person who's never seen the literature." -> Avoid heavy jargon like " Structural Equation Models" unless explained. Use engineering analogies. "2am" vibe -> Keep it punchy.

  11. (Final check on the "Model Relativity" worry): The user thinks it's bad that adding a variable changes the cause. I need to explain that this is actually correct. If you don't model the vendor client, you can't fix the vendor client. If you *can* fix it (e.g., by configuring a timeout), then it *should* be a cause. If you can't, it's a environmental constant, not a variable. The model reflects *control*, not just reality.

