answer: |-
  Sheriff, Commissioner, Command Staff, Chaplain, families, and most importantly, the forty-two deputies who have just spoken the oath. I heard you. When you said you would support the Constitution and faithfully discharge your duties, the sound was not just noise; it was a transfer of weight. You have just accepted the authority to use force on behalf of this county. That is a heavy thing to carry. It is heavier than the vest, heavier than the badge, and it will outlast the shift. You stand now between the words of the law and the reality of the street. Words, on their own, cannot stop a fist or secure a door. They need you. But you need them more.

  Consider a dispute over a property line. Two neighbors stand in the grass. One holds a surveyor's map, a document of precise lines and legal descriptions. The other holds a truck, a fence, and the willingness to install it wherever he chooses. The map represents a claim of justice; the truck represents a fact of force. Without someone to ensure the map dictates where the fence goes, the map is merely paper. It is a wish. The fence, however, is real. It stands. If the man with the truck decides the line, justice has not prevailed; force has. But if the man with the map cannot call upon someone to move the truck, justice remains a ghost. We need the force to make the map matter, but we cannot let the truck draw the lines.

  This tension was captured centuries ago by a French mathematician and philosopher named Blaise Pascal. He observed that not being able to make what is just strong, we have made what is strong just. Pascal understood that justice without force is powerless, but force without justice is tyrannical. A graduate student of mine recently sharpened this insight for me. She distinguishes between force that is *constitutive* of a right and force that is merely *instrumental* to it. Constitutive force is the capacity that makes a right real; without it, the right is only a wish, like that surveyor's map without an enforcement mechanism. Instrumental force is the tool used to protect a right whose content is already determined by law. The danger, Pascal warns, is that instrumental force is perpetually tempted to pass itself off as constitutive. Because justice is disputable and force is not, we slide into treating the settled fact of force as settling the question of justice.

  This is the specific danger you face starting today. You are the constitutive element of rights in this county. When you intervene, you make the abstract right to safety concrete. Without you, the Constitution is a wish. But you must never mistake your capacity to enforce for the authority to define. Your force makes the law real, but it does not get to decide what the law is. When you are tired, when the situation is ambiguous, when the dispatch is quiet, the temptation will be to let what you can enforce decide what is right. It is easier to let the truck draw the line than to read the map. But if you allow your force to define justice, you become the tyrant Pascal feared. You become the man who says, "It is just because I made it so."

  I know that some of you view academics with skepticism. You deal in realities, not theories. One of you has already made that clear to your commanders. But theory is not just talk; it is the map that keeps the truck from running off the road. Understanding the distinction between making rights real and defining rights is not philosophy; it is officer safety. It is legal safety. It is the difference between a lawful discharge of duty and a violation of civil rights. If you believe your force settles the question of justice, you will stop listening to the law. You will stop listening to the community. You will stop listening to your own training. The map must remain separate from the truck, even when you are the one driving both.

  To the families here: you see the uniform. You worry about the danger it invites. But you should also worry about the power it grants. The force your deputy holds changes the person wearing it. It can make them feel omnipotent. Your role is to remind them that they are not the law; they serve it. When they come home, ask them not just if they were safe, but if they were just. Remind them that the map matters more than the fence.

  To the Sheriff and Command Staff: you hold the line on the instrumental side. You write the policies that define the content of the rights your deputies enforce. You must ensure that the force they wield remains subordinate to the law you administer. If the command structure treats force as the primary solution rather than the last resort, you teach the deputies that the truck draws the line. You must be the guardians of the map.

  You have just sworn to support the Constitution. That document is a set of limits on power, including yours. It is not a suggestion. It is the surveyor's map. You are the ones who make it stand up in the rain and the dark. Do not let the strength of your arm convince you that you are the architect of the line. You are the guardian of the boundary, not the owner of the land. Keep the force instrumental. Keep the justice constitutive. Do not let what is strong become what is just simply because it is easier. Go out and make the law real, but never forget that the law must remain bigger than the force you use to protect it. That is how you keep the oath you just spoke. That is how you serve this county. Thank you.

