answer: |-
  It is a pleasure to hear from you and to learn that your time in Edinburgh has provoked such a fruitful complication in your work. The puzzle you describe is indeed one of the most sophisticated pieces of constitutional theology in the modern world, and it is entirely understandable that it slipped past you until your friend pointed out the dual register of the oaths. What you are looking for is not a history of the Reformation or the Acts of Union, but a reconstruction of the political theory that makes these contradictory practices coherent. To do this, we must treat the institutional arrangements you described not as historical accidents but as the material embodiment of a specific set of philosophical claims about the nature of religion, the constitution of the church, and the competence of the state. I will proceed by laying out the presupposed theory, distinguishing what is strictly required from what is merely compatible, addressing the coherence problems you raised regarding the sovereign and the parish, and finally contrasting this with the American model to see what would break first.

  The first thing to establish is that the British arrangement presupposes a theory of religion that is fundamentally external and public rather than internal and private. In the American model you referenced, religion is treated as a matter of inward conviction that is invisible to the law until it manifests in conduct that harms others or violates public order. The British system, by contrast, operates on the premise that religion is a public good with civil consequences that the state has a legitimate interest in regulating. This does not necessarily mean the state believes it has competence in spiritual truth, but it does mean the state believes it has competence in the civil effects of spiritual organization. Consequently, the theory of the church presupposed here is not that of a voluntary association of believers funded by free gift. If the church were merely voluntary, the state would have no standing to legislate for it, nor would the church have the power to bind non-members. Instead, the church is understood as a public corporation, akin to a municipality or a university, with jurisdiction over a territory and a population. This is why the parish system is not merely an administrative fossil but a core theoretical commitment. The incumbent's duty to marry and bury residents regardless of their belief implies that religious care is a function of residence, much like garbage collection or primary education. This entails a theory of belonging that is territorial rather than convotional. You belong to the church because you live in the parish, not because you affirm the creed. This strictly requires that the church be established by law, because a voluntary body cannot compel service based on geography. It sits comfortably with the idea that the church is spiritually distinct, but it strictly requires that the church be legally continuous with the state.

  This leads us to the theory of the state itself. The arrangement rules out the claim that the state has no competence in spiritual things at all, but it also rules out the claim that the state has a duty to identify and support the true religion in a metaphysical sense. If the state had to identify the true religion, it would be unable to tolerate the dual oath situation you described, because it would have to decide whether Episcopacy or Presbyterianism is true. Instead, the state treats the established churches as constitutional organs. The state's duty is to maintain the constitutional architecture, which includes these churches, regardless of the metaphysical truth of their doctrines. This is why the Ecclesiastical Committee's review is so critical. When the committee reports on the expediency of a Church Measure especially in relation to the constitutional rights of all subjects, it is asserting that Parliament judges the civil effects of religious legislation, not the theological validity. This distinction allows the state to intervene without claiming spiritual competence. It strictly requires that religious laws be vetted for their impact on civil rights, but it does not require that the state agree with the religious content. This is where the practice is underdetermined. The system allows for two incompatible theories to license the same behavior. One theory is that the state is confessional and supports the Church of England because it is the true church. The other theory is that the state is secular but recognizes the Church of England as a public utility with historical privileges. Both theories allow for bishops in the legislature and state approval of liturgy. The machinery does not tell us which theory is true, only that the state must treat the church as a public entity. However, the system is not underdetermined on the question of voluntarism. It strictly rules out the idea that the church is a private club. If the church were private, the state could not legislate for it, and the parish system would be unlawful coercion.

  Now we must address the coherence problem regarding the sovereign, which is where your friend's observation cuts deepest. You asked whether one natural person can bear both oaths, given that Presbyterian polity denies the office the English oath secures. The answer lies in the legal concept of the Crown as a corporation sole. The sovereign is not acting merely as a natural person with a conscience but as the embodiment of a legal office that persists across time. The oaths attach to the office, not the individual. This resolves the theological contradiction by making it a constitutional function. The natural person may hold private beliefs, but the corporate person undertakes different legal duties in different jurisdictions. In England, the Crown is the Supreme Governor of the Church of England. In Scotland, the Crown is a member of the Church of Scotland with no supremacy. This is not a contradiction in the person but a differentiation in the office's capacities depending on the territory. This strictly requires that the sovereign be understood as a corporation whose capacities do not die. If the sovereign were merely a natural person, the dual oath would be a act of bad faith or theological confusion. The practice only works if the sovereign is a legal fiction that can hold incompatible properties in different contexts. This is similar to how a person can be a trustee in one context and a beneficiary in another without logical contradiction. The dependency here is clear: the coherence of the dual oath rests entirely on the separation of the natural person from the corporate office. If you collapse that distinction, the system becomes unintelligible.

  Regarding the parish, you asked if it is an implicit theory of religious belonging or an administrative fossil retrofitted with theory. It is both, but the theory is primary. The territorial parish implies that salvation or spiritual care is a public responsibility distributed by geography. This is incompatible with the theory of religion as inward conviction invisible to law. If religion were purely inward, the state could not assign a priest to a neighborhood. The fact that the incumbent must serve residents regardless of belief shows that the church is viewed as a service provider for the population, not a gathering of the elect. This is not merely a fossil; it is a active theoretical commitment to the idea that the nation is a spiritual entity as well as a political one. However, this is where the system is most vulnerable to the American critique. In the American model, belonging is fixed by conviction, not address. To move from the British to the American model, the first thing that must change concretely is the common law duty of the incumbent to marry and bury residents. If churches are private voluntary bodies, a priest cannot be compelled to serve non-members. This would require legislation to abolish the parish system's compulsory elements. Once that is gone, the theoretical basis for the church as a public corporation collapses. If the church is not responsible for the whole population of a territory, it loses its claim to be a national institution. This would then necessitate the removal of the bishops from the House of Lords. If the church is a voluntary association, its leaders have no more claim to a seat in the legislature than the leaders of a charity or a trade union. The presence of the Lords Spiritual depends on the church being a department of state in all but name. Finally, the legislative link between the General Synod and Parliament would have to be severed. If the church is private, its laws should not require parliamentary approval. The Ecclesiastical Committee would become unnecessary because the state would no longer claim an interest in the civil effects of church law beyond the general law of the land. So the piece of the English machinery that becomes unintelligible first is the parish duty. It is the point where the public nature of the church touches the private lives of citizens most directly. Once you remove the compulsion to serve residents, the rest of the establishment architecture loses its justification.

  You also asked about the Ecclesiastical Committee's rights review and whether it is an assertion that Parliament can judge religious questions. The practice suggests that Parliament judges only the civil effects. This is a crucial distinction. The committee does not report on whether a change in liturgy is theologically sound, but on whether it infringes on the constitutional rights of subjects. This presupposes that religious questions have civil shadows. If a church law changes who can be married, it affects civil status. If it changes property rights, it affects ownership. The state claims competence over the shadow, not the substance. This allows the state to remain neutral on theology while active on rights. This is where the British system differs from a theocracy. In a theocracy, the state judges the truth. In this system, the state judges the impact. This is compatible with a secular state, but it strictly requires that religious bodies be subject to secular law when their actions cross into civil jurisdiction. This is not unique to Britain, but the mechanism of the Ecclesiastical Committee formalizes it in a way that acknowledges the church's special status. It treats the church as a legislature whose bills need review, rather than a private club whose rules are internal.

  There are places where the practice is underdetermined, as I mentioned earlier. The system does not determine whether the state is Christian or secular. It allows for a secular parliament to manage a Christian church. This is why you can have Catholics and atheists voting on Church Measures. The theory does not require them to believe the content, only to acknowledge the institution's constitutional role. This is a form of procedural establishment rather than confessional establishment. However, the system is not underdetermined on the question of supremacy. In England, the state is supreme over the church. In Scotland, the church is supreme in spiritual matters. The dual oath respects this difference. The sovereign cannot be Supreme Governor in Scotland because the Church of Scotland denies that office. The system requires this asymmetry. It cannot be harmonized into a single theory of church-state relations across the United Kingdom. It requires a pluralistic constitutional theory where different parts of the kingdom operate on different principles. This is a hard requirement. You cannot unify the church governance without breaking the Union or the theology of one of the churches.

  To summarize the transition to the American model, you would have to dismantle the idea that religion is a public good allocated by territory. This would mean abolishing the parish system's legal duties. It would mean removing the bishops from the legislature, as they would represent a private interest. It would mean ending the parliamentary approval of Church Measures, as private bodies legislate for themselves. And it would mean changing the accession oaths, as the sovereign would no longer be the head of a public church. The first piece to break is the parish duty because it is the most intrusive on individual liberty from the American perspective. The American view holds that the state cannot compel support for or service by a religious body. The British view holds that the state can compel service for the public good. To make the British system coherent under American theory, you would have to give up the idea that the church is a public institution. Once you do that, the rest of the machinery falls away because it was designed to manage a public institution. The Ecclesiastical Committee becomes redundant, the Lords Spiritual become anomalous, and the sovereign's oaths become private declarations rather than public duties.

  I hope this reconstruction helps you navigate the theoretical landscape you have entered. The key is to see that the British system is not a half-finished separation of church and state, but a complete alternative theory where the church is a public corporation and the state is a guardian of constitutional order rather than a neutral arena. The contradictions you see are only contradictions if you assume the American premises. If you assume the British premises, they are functional distinctions. I look forward to hearing how your project develops as you continue to wrestle with these questions.

  Yours sincerely,

  A Colleague
