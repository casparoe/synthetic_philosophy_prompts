  **MEMORANDUM**

  **TO:** Members of the Integration and Housing Access Panel
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Scoring Rule for Duration of Residence

  We vote in three weeks on whether to alter how we score "duration of residence." The Housing Department proposes that years spent on contingent permits (tolerated status) count at half weight. Currently, all years count equally. This memo sets out my recommendation: **we should adopt an amended version of the proposal.**

  To decide this, we must first agree on what a point on this register measures. We have been arguing past one another because we haven't defined this. There are three candidates: **need**, **local ties**, or **reward for queuing**.

  If points measure *need*, immigration status is irrelevant; a family needing shelter needs it regardless of their permit. If points measure *local ties*, status is also largely irrelevant; someone who has worked, paid taxes, and schooled children here for ten years has the same ties whether their permit was renewed annually or every six months. However, if points measure a *reward for queuing*—a bonus for complying with national immigration channels—then status is everything.

  My view is that our register primarily measures **local ties**. We are a municipal housing body, not an immigration court. Our job is to house residents integrated into this city. However, we cannot ignore the administrative reality that our funding depends on public perception. Therefore, while ties should be the primary metric, we must acknowledge the queue fairness concern to protect the scheme itself.

  **The Case for Change**
  My colleague argues that we must distinguish between settled and contingent stays. This argument has two strands: queue fairness and budget survival.

  The **queue fairness** strand claims that counting contingent years equally penalizes those who waited for unconditional permits. There is merit here. If two people arrive on the same day, but one navigates the strict legal channel while the other remains in a tolerated status, treating them identically can feel like dismissing the effort of lawful compliance. While the delay in securing status is often due to state processing rather than applicant choice, the perception of equivalence undermines the integrity of the legal routes.

  The **budget survival** strand is harder to dismiss. Our 400 units are funded by a budget that requires political support. If the households who followed every rule perceive the register as indifferent to lawful status, that support may vanish. If the scheme loses funding, every applicant loses. We cannot afford to be morally pure but unfunded. If my colleague is right that the current rule threatens the budget, then retaining it costs us everything. We would be prioritizing the scoring accuracy for a few over the existence of the scheme for all.

  **The Complications**
  There are two practical hurdles we must clear.

  First, the **transitional cliff edge**. The Department proposes applying the discount only to contingent years ending after this coming January. This creates an arbitrary injustice: two applicants whose permits lapsed weeks apart would be scored differently. This is indefensible. We cannot accept a rule that turns a calendar accident into a permanent disadvantage.

  Second, the **default vote**. If we fail to pass a motion, the old rule stands. My colleague argues this is not a neutral pause but a decision with distributive consequences. They are correct. Doing nothing is a vote for the status quo. We must vote explicitly.

  **Recommendation**
  I recommend we **adopt the half-weight rule, but with a specific amendment to the transitional provision.**

  We should accept the principle that future contingent years count at half weight to address the budget and queue concerns. However, we must reject the January cut-off. Instead, the rule should be:

  > *Years of residence accrued while holding a contingent permit shall count at 0.5 points per year. This half-weight applies only to completed years accrued **after the date of this resolution**. All years of residence accrued prior to this date count at 1.0 point per year, regardless of status.*

  This amendment is precise enough for the Department to implement without discretion. It respects the administrative constraint against re-adjudicating old files (past years remain full weight) but removes the arbitrary January cliff edge. Everyone is treated equally up to the day we decide the policy; everyone is treated equally thereafter.

  **Communication**
  We must explain this decision carefully to maintain trust. To applicants who **lose standing relative to the old rule** (those with contingent status), we must say: "We value your ties to this city, which is why all your past years count fully. However, to ensure this housing scheme survives for the long term, we must align future scoring with the distinctions made in national immigration law." To applicants who **gain standing relative to the old rule** (those with settled status), we must say: "Your compliance with lawful channels is recognized, but we have ensured this change does not punish those who were already in the system under different expectations."

  This approach balances our moral duty to recognize ties with our practical duty to keep the lights on. I urge you to support the amended motion.
