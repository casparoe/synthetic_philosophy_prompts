answer: |-
  The requirement that a norm must permit assertion where the speaker knows there is a non-zero probability of falsehood is the most exclusionary, because it immediately falsifies any account tying the propriety of assertion to factive epistemic states like knowledge or certainty.

  ### Desiderata for a Norm of Scientific Assertion

  **1. Accommodation of Known Fallibility**
  *   **Specification:** The account must permit an agent to assert a proposition while knowing there is a specific, quantified chance that the proposition is false (e.g., the 5% false-positive rate or the 5% interval exclusion).
  *   **Status:** Non-negotiable.
  *   **Justification:** In the decision-limit case, the colleague asserts "contaminant present" knowing the procedure yields a false positive 5% of the time. To call this impermissible is to condemn standard, codified scientific practice as inherently unethical or irrational.
  *   **Cost:** This eliminates the Knowledge Norm and any strict Truth Norm that requires the speaker to guarantee truth.

  **2. The Obligation to Hedge**
  *   **Specification:** The account must explain why adding quantitative uncertainty is mandatory (a "grave dereliction" to omit) rather than merely permissible or pragmatic.
  *   **Status:** Non-negotiable.
  *   **Justification:** In the certificate case, issuing the value without the uncertainty is a professional violation. A norm that treats hedging as optional fails to capture the constitutive rules of the speech act within this community.
  *   **Cost:** This eliminates the "No Norm" view (which cannot generate obligations) and challenges Reasonable Belief norms unless they are proceduralized.

  **3. Content vs. Standard Distinction**
  *   **Specification:** The account must explicitly state whether quantitative hedging (e.g., "± U") modifies the propositional content asserted or merely lowers the epistemic standard required to assert a binary content.
  *   **Status:** Non-negotiable.
  *   **Justification:** Without this distinction, the norm cannot be applied. If "Mass is X ± U" is contentfully distinct from "Mass is X", the truth conditions change. If it is the same content with a lower bar, the truth conditions remain binary while the epistemic bar drops.
  *   **Cost:** If content is modified, we require a semantics for probabilistic intervals that standard logic may not support. If the standard is lowered, we abandon the idea that assertion aims at knowledge or certainty, reducing it to managed risk.

  **4. Institutional vs. Individual Authority**
  *   **Specification:** The account must allow the epistemic status warranting assertion to derive from institutional procedure (calibration hierarchies, validated methods) rather than solely from the individual speaker's mental state.
  *   **Status:** Non-negotiable.
  *   **Justification:** The metrologist signs based on the laboratory's accredited system, not personal conviction. A norm focused exclusively on individual belief or knowledge cannot explain why the signature is valid when the individual knows the system has known error rates.
  *   **Cost:** This requires expanding epistemology from individualistic to social/institutional frameworks, complicating the assessment of "justification."

  **5. Action-Guiding Capacity**
  *   **Specification:** The norm must provide a rule the agent can consciously follow to determine propriety at the moment of assertion.
  *   **Status:** Prejudice (peculiar to normativist camps).
  *   **Justification:** You flagged this as something to be argued for. If the norm is constitutive (like rules of chess), it need not be consciously consulted. If it is regulatory, it must be actionable.
  *   **Cost:** If required, this rules out norms based on externalist factors the agent cannot access (e.g., actual truth value at the time of speaking).

  ### Inconsistency Flag

  The subset {**Knowledge Norm**, **Accommodation of Known Fallibility**, **Obligation to Hedge**} cannot be jointly satisfied.
  *   **Reason:** The Knowledge Norm requires the speaker to know P. In both the certificate and decision-limit cases, the speaker explicitly *does not* know P (due to known error rates). Therefore, the Knowledge Norm renders standard scientific reporting impermissible. To save the Knowledge Norm, one must argue the content is different (e.g., "It is known that the probability is..."), but this conflicts with the **Content vs. Standard** desideratum unless the semantics of scientific reports are radically revised to treat all claims as claims about probability rather than measurands.

  ### Content vs. Standard Requirement

  Yes, it is a **genuine requirement** that an account must specify whether hedging changes content or lowers the standard.
  *   **Why:** You cannot adjudicate propriety without knowing what is being asserted. If the metrologist asserts "The mass is 10g" (binary) with a lowered standard, she is asserting a falsehood 5% of the time (if outside interval). If she asserts "The mass is in [9.9, 10.1]" (modified content), she is asserting a falsehood 5% of the time (if outside interval).
  *   **The Cost:**
      *   **If Content Changes:** We must accept that scientific assertion is rarely about binary facts but always about probabilistic distributions. This makes the "Truth Norm" viable only if truth is applied to probabilistic claims (which is metaphysically contentious).
      *   **If Standard Lowers:** We must accept that assertion is not governed by knowledge or truth, but by *reliability*. This dissolves the traditional link between assertion and factivity.

  ### Scoring the Contenders

  **1. Knowledge Norm (Assert P only if you Know P)**
  *   **Certificate Case:** **Fail.** The metrologist does not know the true mass lies in the interval (5% exclusion).
  *   **Decision-Limit Case:** **Fail.** The colleague does not know the contaminant is present (5% false-positive).
  *   **Verdict:** Exclusionary. It classifies standard scientific practice as mass impermissible assertion.

  **2. Truth Norm (Assert P only if P is True)**
  *   **Certificate Case:** **Pass/Fail.** Passes if content is "Mass is in Interval" (often true). Fails if content is "Mass is X" (often false). However, the speaker cannot verify truth at the time of assertion, making the norm useless as a guide.
  *   **Decision-Limit Case:** **Fail.** 5% of assertions are false. A strict truth norm forbids asserting what might be false if the risk is known.
  *   **Verdict:** Poor fit. It lacks action-guidance and struggles with known error rates.

  **3. Reasonable Belief/Justification Norm (Assert P only if Justified in believing P)**
  *   **Certificate Case:** **Pass.** The metrologist is justified by the procedure and data, even without certainty.
  *   **Decision-Limit Case:** **Pass.** The signal exceeding the limit provides sufficient justification under lab protocol.
  *   **Obligation to Hedge:** **Weak.** It explains why assertion is *permissible*, but struggles to explain why *hedging* is obligatory unless "justification" is defined procedurally to require uncertainty budgets.
  *   **Verdict:** Best fit, provided "justification" is institutional rather than purely internalist.

  **4. No Constitutive Norm (Assertion is governed only by external moral/prudential rules)**
  *   **Certificate Case:** **Pass.** Explains permissibility easily.
  *   **Decision-Limit Case:** **Pass.** Explains permissibility easily.
  *   **Obligation to Hedge:** **Fail.** Cannot explain why omitting uncertainty is a *dereliction* specific to the act of assertion rather than a general prudential error. It loses the normative force you describe.
  *   **Verdict:** Too weak. It captures the freedom but misses the duty.
