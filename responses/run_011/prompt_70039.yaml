      *   **Context:** A warehouse fire case where six people failed to act, and any single action would have prevented the fire. This is a classic overdetermination/preemption by omission scenario.
      *   **Task:** Act as a professional metaphysician and experienced examiner.
      *   **Steps:**
          1.  Brainstorm 3-4 candidate cruxes (2-3 lines each).
          2.  Select the best crux (separates understanding from memorization).
          3.  Draft the exam question (75-minute limit, no easy definitions/recitation, must address profligacy, fixes, asymmetry/transitivity).
          4.  Write a model answer (~700 words).
          5.  Create a marking scheme (out of 25, specific criteria for A/B, major pitfalls).

  2.  **Brainstorming Candidate Cruxes:**
      *   *Idea 1 (Normative vs. Ontological):* Focus on whether omissions are causes only because of legal/moral norms rather than metaphysical reality.
      *   *Idea 2 (Contrastive Causation):* Focus on whether framing causation as $c$ rather than $c^*$ causing $e$ rather than $e^*$ solves the profligacy problem without breaking transitivity.
      *   *Idea 3 (The "Too Many Causes" Problem):* Focus specifically on the profligacy objection (the unwatered plant) and whether restricting causation to "relevant" absences is circular or ad hoc.
      *   *Idea 4 (Quasi-Causation):* Focus on the distinction between "producing" and "allowing," and whether denying omissions real causal status saves the ontology but breaks the logic of counterfactual dependence.

      *Selection:* Idea 3 is strong, but Idea 2 (Contrastive) combined with Idea 4 (Quasi-Causation/Transitivity) offers the deepest metaphysical engagement. However, the prompt specifically asks to face the *profligacy worry* and judge the *fixes*. Let's refine the crux to be about the *trade-off between solving profligacy and preserving the logical structure of causation*.
      *Refined Crux:* Does solving the profligacy of omissions (via contrastivity or normativity) destroy the transitivity or asymmetry required for causation to do its explanatory work?

  3.  **Drafting the Exam Question:**
      *   *Constraint:* 75 minutes. Needs to be focused but deep.
      *   *Constraint:* No defining "omission" or reciting doing/allowing.
      *   *Requirement:* Force confrontation with profligacy (unwatered plant) and evaluate fixes (contrastive, relevant, quasi-causation) regarding asymmetry/transitivity.
      *   *Drafting:* Start with the warehouse scenario (briefly) to ground it. Then pose the theoretical challenge. Ask them to evaluate a specific claim: "We can save omissions as causes only by breaking the logic of causation."

  4.  **Developing the Model Answer:**
