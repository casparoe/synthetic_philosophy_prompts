answer: |-
  ### Candidate Cruxes

  1.  **The Normative Trap:** Whether treating omissions as causes collapses metaphysics into ethics, making causal facts dependent on moral duties rather than ontological structures.
  2.  **The Transitivity Trade-off:** Whether solving profligacy via contrastive causation preserves the intuition that absences cause events while breaking the transitivity required for causal chains.
  3.  **The Unified Theory Cost:** Whether denying omissions "real" causation (quasi-causation) saves the ontology but renders causation disunified, unable to handle mixed chains of action and inaction.
  4.  **The Explanatory Value:** Whether admitting omissions as causes provides necessary explanatory power for complex failures (like the warehouse fire) that outweighs the ontological baggage of negative facts.

  ### Selected Crux and Rationale
  **Selection:** **The Transitivity Trade-off.**
  **Rationale:** This crux best separates rote learners from genuine thinkers. A student who has memorized labels can recite that "contrastive causation solves profligacy." However, only a student who understands the *function* of causation in a metaphysical system will realize that contrastivity often breaks transitivity ($A$ causes $B$, $B$ causes $C$, therefore $A$ causes $C$). If causation isn't transitive, the adjuster's chain of liability collapses. This forces the student to weigh ontological cleanliness against logical utility.

  ***

  ### Final Exam Question: Metaphysics 405
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question:**
  Consider the claim: *"To save omissions as causes without admitting profligacy (e.g., my failure to water a stranger's plant causes its death), we must adopt a contrastive account of causation. However, this fix destroys the transitivity of causal relations."*

  Critically evaluate this claim. In your answer, you must:
  1.  Explain why the "profligacy of omissions" threatens standard counterfactual accounts of causation.
  2.  Assess whether restricting causation to "normatively relevant" absences or adopting "contrastive causation" successfully mitigates this threat.
  3.  Determine whether these solutions preserve the formal properties of causation (specifically asymmetry and transitivity) required to make sense of causal chains like the warehouse fire scenario.

  Do not define "omission" or simply recite the doing/allowing distinction. Focus on the structural costs of your chosen solution.

  ***

  ### Model Answer

  The profligacy worry arises because standard counterfactual analyses ($c$ causes $e$ iff if $c$ had not occurred, $e$ would not have occurred) treat absences identically to presences. If the plant's death depends on my not watering it, my omission is a cause. But since the plant's death also depends on the President not watering it, the President is also a cause. This generates infinite causes for every event, rendering causation explanatorily useless. For the claims adjuster, if everyone in the world is a cause of the warehouse fire, liability cannot be distributed.

  To mitigate this, some philosophers (like Lewis) suggest appealing to context or norms to restrict which absences count. We only count the omission as a cause if there was an expectation of action. While this solves profligacy pragmatically, it makes causation mind-dependent. It suggests the causal structure of the universe shifts based on human expectations, which is metaphysically unpalatable. It saves the intuition but sacrifices the objectivity of the causal relation.

  A more robust metaphysical fix is Contrastive Causation (championed by Schaffer). Here, causation is a quaternary relation: $c$ rather than $c^*$ causes $e$ rather than $e^*$. My failure to water the plant ($c$) rather than watering it ($c^*$) causes death ($e$) rather than life ($e^*$). The President's failure to water is not the relevant contrast because it is not the expected alternative in the context. This successfully prunes the profligate causes without relying solely on vague norms.

  However, the prompt claims this destroys transitivity, and this is the critical tension. Transitivity is essential for the adjuster's fire scenario: if the sensor failure caused the alarm silence, and the alarm silence caused the fire spread, the sensor failure must cause the fire spread. Contrastive accounts struggle here. If $c$ rather than $c^*$ causes $d$ rather than $d^*$, and $d$ rather than $d^*$ causes $e$ rather than $e^*$, the middle contrasts ($d$ vs $d^*$) may not align. If the first link requires a specific contrast that the second link does not sustain, the chain breaks.

  For example, in the warehouse case, if "failure to inspect" rather than "inspecting" causes "valve stuck" rather than "valve open," does that link to "fire" rather than "no fire"? If the contrast shifts mid-chain, transitivity fails. If transitivity fails, we cannot trace liability back through the six failures mentioned in the prompt. We are left with a fragmented web of local causal facts that cannot support long-range explanation.

  Alternatively, we might follow Beebee and deny omissions are causes at all, labeling them "quasi-causes." This preserves transitivity for positive events but creates a disunified theory. We then need two logics: one for the warehouse guards (positive actions) and one for the managers (omissions). This is ontologically cheap but explanatorily fractured.

  Ultimately, the claim in the prompt is largely correct but requires nuance. Contrastive causation does solve profligacy better than normative restrictions, but it does threaten transitivity unless the contrasts are carefully fixed across the chain. If we fix the contrasts globally to save transitivity, we risk reintroducing profligacy. If we allow local contrasts to solve profligacy, we lose transitivity. The adjuster needs transitivity to assign blame; the metaphysician needs to avoid profligacy to define reality. We cannot fully have both without significant theoretical cost. The best we can do is accept that causation by omission is a distinct, perhaps secondary, relation that mimics causation sufficiently for liability but lacks the full ontological weight of positive production.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **A Grade (20–25 Marks): The Structural Architect**
  *   **Profligacy Analysis (5 marks):** Clearly articulates why counterfactual dependence alone leads to infinite causes (the "President" problem) and why this breaks explanatory utility.
  *   **Evaluation of Fixes (8 marks):** Critically assesses at least two approaches (Normative/Contextual vs. Contrastive vs. Quasi-causation). Does not just describe them; evaluates their *cost*.
  *   **Formal Properties (7 marks):** Explicitly connects the solution to **transitivity** and/or **asymmetry**. Explains *why* transitivity matters for the warehouse scenario (chain of liability). Identifies the tension: fixing profligacy often breaks transitivity.
  *   **Conclusion (5 marks):** Reaches a nuanced verdict. Acknowledges the trade-off rather than declaring a "winner."

  **B Grade (15–19 Marks): The Competent Surveyor**
  *   **Profligacy Analysis (5 marks):** Identifies the problem of too many causes.
  *   **Evaluation of Fixes (6 marks):** Describes the fixes (Contrastive/Normative) accurately but treats them as isolated solutions rather than weighing their structural costs.
  *   **Formal Properties (4 marks):** Mentions transitivity but fails to explain *how* the chosen fix threatens it, or treats transitivity as a minor footnote.
  *   **Conclusion (4 marks):** Takes a definitive side without acknowledging the residual theoretical cost.

  **C Grade (10–14 Marks): The Label Reciter**
  *   Defines "omission" or "doing/allowing" (wastes space).
  *   Lists the theories (Lewis, Schaffer) without applying them to the profligacy worry.
  *   Ignores transitivity/asymmetry entirely.

  **Major Pitfalls (Automatic Deductions)**
  1.  **The Definition Trap (-5 marks):** Spending more than 50 words defining "omission" or "causation" instead of analyzing the relationship.
  2.  **The Moral Fallacy (-5 marks):** Arguing that omissions are causes *only* because they are morally blameworthy (confuses metaphysics with ethics).
  3.  **Ignoring the Prompt (-10 marks):** Failing to address the specific claim about transitivity or the "unwatered plant" example.

  **Examiner's Note:** The distinguishing factor between an A and a B is the treatment of **transitivity**. A B student sees contrastivity as a solution to profligacy. An A student sees contrastivity as a solution to profligacy that *creates a new problem* for causal chains.
