          *   Evaluate Fix 2: Contrastive Causation (Schaffer). Problem: Threatens transitivity.
          *   Evaluate Fix 3: Quasi-causation (Beebee). Problem: Loses unified theory of causation.
          *   Conclusion: The cost of fixing profligacy often undermines the formal properties (transitivity) that make causation useful for explanation (like in the adjuster's fire case).
      *   *Tone:* Academic, precise, argumentative.

  5.  **Designing the Marking Scheme:**
      *   *Total:* 25 marks.
      *   *A Grade (20-25):* Must identify profligacy, analyze at least two fixes, explicitly discuss transitivity/asymmetry costs, and reach a nuanced conclusion.
      *   *B Grade (15-19):* Identifies profligacy and fixes but treats transitivity/asymmetry superficially or misses the trade-off.
      *   *Major Pitfalls:* Defining omission (waste of time), ignoring the logical properties (transitivity), or taking a dogmatic stance without argument.

  6.  **Refining and Polishing:**
