answer: |-
  1. The flame maps to the metabolic process itself, while the wax and wick represent the organism's physical biomass and structural scaffolding. The draught is the energy gradient driving the system, and lighting the next candle corresponds to reproduction or infection transmitting the pattern to new matter.
  2. Damagingly, flames lack genetic information to constrain their shape, whereas organisms rely on DNA to rebuild specific structures after disturbance. Interestingly, both systems require constant energy input to maintain order, but only the organism actively repairs its own wick rather than just consuming it.
  3. The analogy assumes form emerges solely from immediate physical dynamics rather than stored historical instructions, implying structure is ephemeral and context-dependent. Organisms partially meet this through self-organization, but ultimately violate it because their form is pre-coded in genomes that persist independently of the metabolic flame.
  4. The verdict weakens because viruses possess genetic blueprints that flames lack, giving them a potentiality for life that a mere spark does not hold. While the process view highlights continuity, the presence of encoded information creates a factual distinction between inert transmission and biological replication.
  5. A software process running on hardware fits better, where the code is the genome, the execution is metabolism, and a virus is a script needing another computer to run. This preserves the process nature of life while accounting for the critical role of stored information that the flame analogy ignores.
