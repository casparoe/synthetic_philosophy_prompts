answer: |-
  **Project Title:** The Architecture of Independence: Disentangling Existence, Guidance, and Access in Normative Realism

  **1. Research Question**
  Normative realism is standardly characterized as the view that there are reasons for action that obtain independently of what anyone happens to care about. However, realists disagree sharply about how far that independence can be pushed before the very idea of a reason loses its grip. This project asks: **Must a normative reason maintain a possible connection to agency (either through guidance or access) to obtain, or can reasons obtain in total isolation from any agent's capacity to recognize or act upon them?**

  This question admits three determinate answers:
  1.  **Strong Independence:** Reasons obtain even if no agent can ever access or act on them (Robust Realism).
  2.  **Weak Independence:** Reasons obtain only if they are accessible or actionable in principle, even if not in practice (Moderate Realism).
  3.  **Dependence:** Reasons obtain only if they are grounded in actual agents' capacities or commitments (Internalism/Constructivism).

  **2. The Problem: Conflation in Existing Positions**
  Current meta-ethical debates are stalled because three distinct conditions are routinely conflated:
  (i) an *existence condition* (what it takes for there to be a reason at all);
  (ii) a *guidance condition* (what it takes for a reason to be capable of moving an agent);
  (iii) an *access condition* (what it takes for a reason to be discoverable).

  The internalist tradition, descending from Bernard Williams, effectively collapses (i) into (ii). For the internalist, if a consideration cannot motivate an agent given their subjective motivational set, it is not a reason. Conversely, the robust realism of the Parfitian stripe invokes (iii) only intermittently and at a cost it never states. It asserts reasons exist independently but struggles to explain how reasons that are permanently inaccessible differ from fiction. J.L. Mackie's "queerness" worry gets its real traction precisely from cases in which a reason would have to obtain with (ii) and (iii) both failing—a demand that seems to float free of anything that could make it a demand.

  By failing to distinguish these conditions, existing positions talk past one another. Internalists deny realism because they see the failure of guidance; Realists affirm it because they focus on existence. This project isolates these conditions to test whether realism can survive the total removal of guidance and access.

  **3. Methodology and Specimen Case**
  This project will not proceed solely through textual exegesis. We will employ a procedure of **constructive case isolation**. We will construct scenarios where two of the three conditions come apart while holding the third constant. For each pair, we will apply a **discrimination test**: a case designed so that competing accounts of reasons yield different verdicts about whether a reason obtains.

  *Specimen Case: The Sealed Archive*
  A linguist records the last fluent speaker of an extinct language. She extracts a promise from her graduate student that the recordings stay sealed until the student's own death. Both are now dead. The tapes sit in an archive whose access policy was set decades later by people who never knew either party. The archive is secure; no one knows the tapes exist, and no one has the key to access them.

  *Discrimination Test:*
  1.  **Existence vs. Access:** Does a reason to honour the promise obtain even if no one knows the promise exists (Access fails)?
  2.  **Existence vs. Guidance:** Does a reason obtain even if the tapes are physically inaccessible forever, making action impossible (Guidance fails)?
  3.  **Variable Conditions:** If the tapes are destroyed, does the reason vanish? If a third party accidentally discovers the promise but cannot act on it, does the reason remain?

  Internalism should verdict "no reason" because no actual agent can be motivated. Robust Realism should verdict "reason exists" regardless of access or guidance. If our intuition wavers depending on whether the tapes *could* be found versus whether they *will* be found, this indicates that the access condition (iii) is doing hidden work in our conception of existence (i).

  **4. Scope and Work Plan**
  **Duration:** 24 Months
  **Personnel:** Principal Investigator (20% time), Postdoctoral Researcher (100% time).

  The Postdoc will lead the construction of case variants and the initial mapping of theoretical verdicts. The PI will oversee the theoretical framework and integration of results.

  *Months 1–6: Case Construction.*
  Development of a corpus of 30 isolated cases covering orphan, residual, and vacant categories.
  *Months 7–12: Initial Analysis.*
  Application of the discrimination test. Drafting of the taxonomy paper.
  **Deliverable (Month 12):** A working paper titled *A Taxonomy of Normative Independence*. This document will catalog the cases and the divergent verdicts they produce. Even if the central thesis collapses (i.e., if the distinctions prove untenable), this taxonomy provides a permanent resource for mapping meta-ethical disagreements.
  *Months 13–18: Theoretical Integration.*
  Refining the definitions of (i), (ii), and (iii) based on case results.
  *Months 19–24: Final Dissemination.*
  Completion of two journal articles and a monograph manuscript.

  **5. Failure Conditions**
  We explicitly acknowledge two live possibilities that would constitute project failure regarding the central hypothesis:

  1.  **The Idle Distinction:** The three-way distinction is genuine but theoretically idle. Nothing in ethics, epistemology, or practical deliberation turns on keeping the conditions apart.
      *   *Evidence:* If all major normative theories (Internalism, Realism, Error Theory) converge on the same verdicts for all constructed cases despite differing definitions, the distinction lacks explanatory power.
  2.  **The Illusory Distinction:** The categories collapse into one another upon analysis.
      *   *Evidence:* If it turns out that "access" is conceptually necessary for "existence" (or vice versa), such that one cannot coherently describe a case where one holds and the other fails without contradiction.

  In either case, the Month 12 taxonomy remains a valuable deliverable, clarifying where current theories converge.

  **6. Significance for Non-Specialists**
  For panel members without philosophical training, the stakes of this project concern the boundaries of obligation.
  *   **Obligations to the Dead:** Can we wrong the dead? If a reason is "residual" (generated by a relationship that no longer exists), do we owe duties to those who cannot be harmed or benefited? This affects law and ethics regarding wills, promises, and historical justice.
  *   **Future Generations:** "Vacant reasons" bear on agents who might exist but never will. This clarifies debates on climate change and resource depletion. If reasons require possible agents, do we owe less to potential future people than to actual ones?
  *   **The Charge of Irrelevance:** Critics often claim moral realism posits reasons that do no explanatory work in the world. This project tests that charge directly. If reasons can exist without ever guiding anyone, are they part of reality or merely metaphysical decorations? We aim to provide a candid answer: either realism requires a connection to human capacity, or it must accept that some moral truths are permanently inert.

  **7. Reflexive Note on Terminology**
  A methodological hazard lies in the project's own idiom. To speak of "orphan reasons" or "residual reasons" is already to grant that the existence condition (i) is satisfied. This prejudges the outcome against the internalist and the error theorist.

  To remain neutral, the investigation will initially refer to these categories as "orphan *claims*," "residual *claims*," and "vacant *claims*." The term "reason" will be withheld until the discrimination test determines whether the claim survives the removal of guidance and access. This ensures the project tests whether realism can accommodate these categories, rather than assuming realism is true and merely sorting its furniture. The goal is not to defend realism, but to determine whether the concept of a "reason" can survive total isolation from agency.
