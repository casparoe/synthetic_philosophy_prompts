  7.  **Self-Correction during drafting:** I need to be careful not to just say "Wes is wrong." In formal logic, he's right. In philosophy of science, he's incomplete. Dara is right about scientific practice but wrong about formal logic. The "Referee" needs to distinguish between *validity* and *soundness/usefulness*.
      *   *Correction:* In Move 1, Wes is logically correct. In Move 3, Wes adopts the Bayesian "Standard Solution." In Move 6, Dara catches him potentially misapplying that solution. I need to be precise about *which* version of the paradox solution Wes is using at which moment. He shifts from "Hard Logic" (Move 1) to "Bayesian/Background Knowledge" (Move 3). Dara catches him shifting.

  8.  **Finalizing the "Missing" section:** Bring in Goodman (Grue/Projectability) and Causal Structure. This explains *why* the crow feels like evidence and the fridge doesn't, beyond just "intuition."

