answer: |-
  The morning light over the Ouse was the colour of wet iron, filtering through a haze of sediment churned by the night's gale. Captain Mara Vance stood on the wing of the bridge, her elbows resting on the rail, watching the water slide past the *Northern Light*'s bow. The bulk carrier was laden deep, drawing thirty feet, and the river channel here was narrow, flanked by mudbanks that shifted with every tide. Everyone ashore agreed the storm had moved the shoal near the bend, but Vance had run this water a few thousand times. She knew the river by the way the helm answered under her feet, by the colour of the surface, by the transits that locked the ship into the safe water.

  The chart on the table showed deep water near the starboard bank, but the surface looked turbid there, thick with silt. The water looked brown against the starboard bow. She checked the transits, allowed for the flood still making, and carried on. It was a prudent correction; the storm surge would still be draining off the flats, creating a cross-current that pushed the stern. Mate Evans watched her from the console. He was young, still learning the specific weight of her silence. He saw the helm move, saw the ship settle into the line, and said nothing. The engine telegraph clicked as she ordered slow ahead to maintain steerage way without waking the bottom.

  They rounded the bend. The leading marks—a white water tower and a red tank—lined up perfectly in the center of the viewfinder, but the echo sounder whispered a number shallower than the chart allowed. Vance frowned, not in doubt, but in calculation. She was accounting for squat, the phenomenon where a ship sinks deeper as it moves, and for the flood tide lifting the stern. The water looked brown against the port bow. She checked the transits, allowed for the flood still making, and carried on. To Evans, it felt like the moment before had never resolved. He opened his mouth to suggest a second opinion from the tug ahead, but the protocol was clear: the pilot commanded the navigation. She had verified the position. The discrepancy was real, but so was her procedure.

  The ship surged forward, the vibration of the propeller humming through the deck plates. Vance stepped back to the center console, her eyes moving between the radar and the window. The river widened slightly here, but the channel markers were obscured by the glare off the wet mud. She needed to be sure of the edge. The chart said deep water, the lead said shallow, and the visual confirmation was the only tiebreaker that mattered. She had done this all morning, resolving the conflict between the static paper and the living river. The water looked brown against the starboard bow. She checked the transits, allowed for the flood still making, and carried on.

  Evans looked at the clock. They had passed the same distinctive snag on the bank twice, or so it seemed to him, though the river twisted enough that landmarks could repeat. He knew better than to speak. To question the pilot was to question the ship's safety, and she was the expert. She was doing the skilled thing. Every time the sensor disagreed with the eye, she ran the verification. It was the source of her competence. If she stopped checking, that was when the ship would ground. The engine telegraph clicked again, adjusting the thrust to match the current.

  The channel straightened out toward the dock gates. The tugboats were waiting, their lines coiled, engines idling. Vance signaled for the lines to be prepared. She stood tall, her posture relaxed but ready. The discrepancy between the chart and the water had surfaced three times, and three times she had resolved it by trusting the transits and the feel of the hull. The river was wide now, the danger past. She ordered the engine to stop. The ship drifted alongside the quay, the fenders absorbing the last of the momentum. The lines were thrown and secured. Vance signed the logbook, noting the arrival time and the weather conditions. She closed the book and picked up her bag. The river simply ran out.

  ***

  **Apparatus**

  The story's fixed point is the verification subroutine itself. Revision stops at the level of the check: the pilot can adjust the helm or the engine, but she cannot adjust the necessity of checking when a discrepancy appears. The piece claims that for expertise to function, the trigger for verification must be unrevisable; if she questioned the need to question, navigation would collapse into paralysis.

  The pilot is sphexish only superficially. The wasp's loop is re-triggered by an outsider moving the prey; the pilot's is re-triggered by her own checking subroutine, which generates new discrepancies (or perceives them) because the check itself interrupts the flow. This is a difference in kind, not merely leverage. The wasp is trapped by the environment; the pilot is trapped by the architecture of her own competence.

  On the view that free will is flexibility, the story commits us to the idea that an agent who can always revise one level higher is not thereby free. The pilot can revise the heading, but not the rule that dictates checking the heading. The missing ingredient is the ability to halt the subroutine from within the subroutine. The story does not supply this ingredient; it gestures toward it via Evans, who sees the loop but lacks the standing to break it. The cheat lies in the narration's third recurrence: by repeating the exact phrasing of the first instance, the prose asserts the closure of the loop rather than earning it through the pilot's internal experience, which remains stubbornly linear.
