answer: |-
  **TO:** Archival Review Panel
  **FROM:** [Faculty Member Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the Bottoms Collection Access Status

  **Bottom Line Up Front**

  I recommend we deny the request to remove the entire collection from public access but approve immediate withdrawal of specific items where consent is contested or unverifiable. Specifically: (1) The physical reels remain preserved in climate-controlled storage regardless of access status. (2) Online audio files for the two narrators identified in the interviewer's widow's testimony, plus any minor narrators whose guardians cannot be located to re-consent, are removed from the digital repository immediately. (3) The finding aid retains metadata entries for these withdrawn items (name, date, length) with a standardized note stating access was restricted per ethical review, not technical error. (4) We commit to a 90-day public window starting next week to accept further verified withdrawal requests from descendants before finalizing the permanent access state.

  **Reasoning and Community Consultation**

  Our policy mandates management "in consultation with that community." It does not define procedure when the community is visibly split. We have two distinct groups: the Bottoms Descendants Assembly, prioritizing protection from historical harm, and the Neighborhood Historical Society, prioritizing preservation against institutional erasure. Both claims are legitimate. The university destroyed the physical neighborhood; keeping the voices online counters that erasure. However, keeping voices online against the wishes of the speakers replicates the original dispossession.

  We cannot treat the Assembly as the sole veto power without disenfranchising the Historical Society and the narrators who want their stories heard. Conversely, we cannot ignore the Assembly without risking ethical violation. The disposition above attempts to split the difference: we preserve the collective record (satisfying the Historical Society) while respecting individual agency where specific harm is identified (satisfying the Assembly). This allows both archivists on the panel to argue their case within the implementation phase: one can argue for broader inclusion during the 90-day window, the other for broader restriction, but the framework remains stable.

  **The Case for Total Removal**

  The strongest argument for taking the whole collection down is not bureaucratic; it is moral. The Assembly argues that consent obtained during active demolition is coercive. In 1974, residents were facing eviction, financial ruin, and the destruction of their social fabric. A grad student with borrowed equipment offered them a chance to be heard, but the power dynamic was skewed. They were subjects of a university project that was simultaneously destroying their homes. To claim their "yes" was free ignores the context of the gun being held to their heads, metaphorically speaking.

  Furthermore, the consent forms are vague ("research purposes"), and standards for minors were nonexistent. If we view the archive as a living relationship rather than a vault, continuing to broadcast these voices without current community sanction turns the archive into an instrument of the same extraction that cleared the Bottoms. If the process was tainted at the source, the product is tainted forever. This argument holds significant weight because our institution benefits from the land grab these tapes document. Profiting from the only remaining record of a neighborhood we erased is ethically precarious.

  **The Widow's Testimony and Unverifiable Requests**

  We face a specific evidentiary problem regarding the widow's claim that two narrators asked for destruction. There is no paper trail. The finding aid states releases were signed. We cannot verify her memory, but we cannot rule it out.

  *Assumption:* I am proceeding on the assumption that the widow's testimony carries sufficient credibility to warrant a precautionary principle, given the interviewer is deceased and cannot contradict her.

  Does an unverifiable oral request obligate an archive? Legally, likely not. Ethically, yes. Archives exist to steward trust, not just exploit legal loopholes. If there is a credible chance these two individuals died wanting their voices silenced, broadcasting them violates their posthumous agency. We owe those specific narrators the benefit of the doubt. Withdrawing their audio acknowledges that the human relationship supersedes the accession file. However, we cannot allow unverifiable claims to become a tool for wholesale erasure by third parties. Therefore, this exception applies only to the specific names cited by the widow, not as a precedent for any unverified claim to remove material.

  **The Placeholder Debate**

  One archivist has proposed withdrawing the audio but leaving a metadata placeholder (name, date, restriction note). The objection is that this catalogs erasure in institutional categories, making a withdrawn name more searchable than their voice ever was—a "sophisticated silence."

  I believe the placeholder idea survives this objection, provided we adjust the metadata. If we simply list the name, we expose the individual to scrutiny without allowing them to defend themselves. If we list the item as "Restricted Item [ID Number]" with no name, we erase them completely. The middle path is to list the name but restrict the biographical note, or to group the withdrawn items under a general restriction heading that explains the ethical context without highlighting specific individuals disproportionately. The counter-argument—that this is still institutional control over silence—is true. But total deletion is worse; it hides the gap. A placeholder admits the archive is incomplete and explains why. It documents the conflict rather than smoothing it over. It tells researchers: "Someone was here, and something happened to this record." That transparency is preferable to the fiction of a complete collection.

  **Timeline and Commitment**

  To execute this, we need a public timeline. Next Tuesday, we announce the temporary restriction of the contested items and the opening of the 90-day consultation window. We notify both the Assembly and the Historical Society simultaneously. At the 90-day mark, we review any new verified requests. On day 91, we finalize the finding aid. This gives us a defensible position: we acted swiftly to prevent potential harm, but we did not capitulate to demands for total removal without broader consensus.

  This approach admits our records are imperfect and our history is messy. It refuses to let the university off the hook for the neighborhood's destruction, but it also refuses to let the archive become a tool for further silencing. I look forward to debating the specifics of the metadata formatting in the meeting, but I urge we agree on the principle of selective withdrawal now.
