answer: |-
  To assist your committee in drafting precise guidance, here is an unpacking of the proverb "When in Rome, do as the Romans do." It is not a single moral claim but a heuristic that relies on different underlying normative frameworks depending on how strictly it is interpreted.

  Below is a menu of four distinct readings, ranging from weak advice to strong moral obligations. For each, I assess its plausibility and its application to your three specific cases: **tipping**, **queueing**, and **crossing at an empty intersection**.

  ### 1. The Prudential Reading (Avoidance of Sanction)
  **The Claim:** This is not a moral duty but a strategy for self-interest. It asserts that violating local norms invites social friction, embarrassment, legal penalty, or poor service. You should comply to minimize transaction costs in your daily life.
  **Plausibility:** High. This is the most common, colloquial usage of the phrase.
  **Obligation Status:** Hypothetical imperative (If you want X, do Y), not a categorical duty.

  *   **Tipping:** **Obliges (Prudentially).** Failure to tip at the local rate may result in social disapproval, confrontations, or worse service in the future.
  *   **Queueing:** **Obliges (Prudentially).** Cutting in line invites immediate social sanction (shaming, confrontation) from locals.
  *   **Empty Intersection:** **Obliges (Prudentially).** Even if the street is empty, crossing against the light risks a fine or setting a visible example that draws police attention.
  *   **Divergence:** There is little divergence here; all three carry risks of negative feedback. However, the *severity* differs. Queue-jumping provokes immediate interpersonal conflict; tipping failures provoke resentment; jaywalking risks legal penalty.

  ### 2. The Coordination Reading (Solving Collective Action Problems)
  **The Claim:** Norms exist to solve coordination problems where individual rationality leads to collective failure. By following the local "focal point," you ensure the system functions smoothly for everyone.
  **Plausibility:** High for behavioral norms; Low for distributive norms.
  **Obligation Status:** Moral duty of fairness (playing by the rules of the game).

  *   **Tipping:** **Does Not Oblige.** Tipping is not a coordination problem in the same sense as traffic or queues. It is a distributive mechanism regarding wages. Your compliance does not make the system more efficient; it merely sustains a specific wage subsidy model.
  *   **Queueing:** **Strongly Obligues.** Queues are pure coordination conventions. If you do not join the local fashion (e.g., a physical line vs. a virtual ticket system), you create uncertainty and inefficiency for others.
  *   **Empty Intersection:** **Obliges (with caveats).** Traffic lights are coordination devices. Even when empty, obeying them maintains the habit and predictability required when traffic *is* present. However, the obligation weakens significantly when the coordination benefit is null (i.e., truly no cars).
  *   **Divergence:** This reading drives a wedge between **queueing/lights** (coordination) and **tipping** (economic structure). It supports your colleague on queues but supports *you* on tipping.

  ### 3. The Reciprocity Reading (Respect for the Host)
  **The Claim:** As a guest, you occupy space owned or governed by another community. Adhering to their norms is a form of deference and gratitude, acknowledging their sovereignty over their social space.
  **Plausibility:** Moderate. It relies on the assumption that the host community's norms are worthy of respect.
  **Obligation Status:** Moral duty of reciprocity/hospitality.

  *   **Tipping:** **Contingent.** If tipping is viewed locally as a genuine expression of gratitude for service, reciprocity suggests participating. However, if it is viewed (as you argued) as a structural subsidy shifting employer costs to guests, reciprocity does not require you to underwrite a system you find exploitative.
  *   **Queueing:** **Obliges.** Respecting the local order of fairness is a basic requirement of being a good guest.
  *   **Empty Intersection:** **Obliges.** Obeying local law is a baseline form of respect for the host's governance, even when enforcement is absent.
  *   **Divergence:** This reading turns on the *moral quality* of the norm. It treats queueing and lights as neutral rules of the house, but treats tipping as potentially problematic if the "house rules" are unjust.

  ### 4. The Conventionalist Reading (Local Practice Settles Rightness)
  **The Claim:** This is a metaethical thesis: morality is relative to culture. There is no independent standard of justice; what is "right" is defined by what is "done." If Romans tip, tipping is morally right in Rome.
  **Plausibility:** Low. Most ethical frameworks reject the idea that prevalence equals moral validity (e.g., if "Romans" practiced segregation, that would not make it right).
  **Obligation Status:** Absolute (within the context), but philosophically fragile.

  *   **Tipping:** **Obliges.** Under strict conventionalism, if the custom is to tip, not tipping is wrong by definition.
  *   **Queueing:** **Obliges.**
  *   **Empty Intersection:** **Obliges.**
  *   **Divergence:** This reading does not distinguish between the cases. It treats all customs as equally binding. This is likely the reading your colleague invoked, but it is the most vulnerable to your counter-argument regarding cost-shifting.

  ---

  ### Special Conditions

  #### When "The Romans" Disagree Among Themselves
  The proverb presupposes a monolithic "Roman" behavior. If the locals are divided, the proverb loses its normative force because there is no single practice to adopt.
  *   **Tipping:** In many municipalities, locals debate the ethics of tipping. If a significant portion of the host community views tipping as optional or objectionable, the "When in Rome" justification collapses. You cannot do as the Romans do if half the Romans refuse to do it.
  *   **Queueing:** Locals rarely disagree on the *principle* of queueing, though they may differ on style (e.g., close spacing vs. wide spacing). The proverb holds here.
  *   **Empty Intersection:** Locals often disagree here (legalists vs. pragmatists). If local pedestrians routinely cross on red when empty, the "Roman" thing to do is actually to cross. The proverb becomes self-defeating if the local custom is *not* to follow the law.

  #### When the Practice is Contested or Objectionable
  This is the critical failure point for your colleague's argument. The proverb generally assumes the local custom is benign.
  *   **The Failure Point:** The proverb fails on the **Reciprocity** and **Conventionalist** readings if the custom is structurally unjust.
  *   **Application to Tipping:** If tipping functions primarily to shift employer labor costs onto customers (as you argued), it is not merely a "custom" but a distributive injustice. A visitor is not obliged by respect or convention to participate in a system that undermines fair labor standards, even if locals currently tolerate it.
  *   **Application to Lights/Queues:** These are rarely "objectionable" in themselves. Obeying a light at an empty intersection is inefficient, but not unjust. Queueing is a fairness norm. Therefore, the proverb retains force here even if it fails on tipping.

  ### Summary for Committee Guidance

  | Interpretation | Tipping | Queueing | Empty Intersection | Verdict for Guidance |
  | :--- | :--- | :--- | :--- | :--- |
  | **Prudential** | Comply (avoid glare) | Comply (avoid conflict) | Comply (avoid fines) | **Advice only.** "Visitors are advised to..." |
  | **Coordination** | **No Duty** (not coordinative) | **Duty** (fairness) | **Duty** (predictability) | **Split.** Mandate queues/lights; leave tipping as optional/economic. |
  | **Respect** | **Conditional** (depends on justice) | **Duty** | **Duty** | **Split.** Requires inquiry into local labor ethics. |
  | **Conventionalist**| **Duty** | **Duty** | **Duty** | **Risky.** Validates potentially unjust norms. |

  **Recommendation:**
  Your colleague's use of the proverb conflates **coordination norms** (queueing, traffic) with **distributive norms** (tipping).
  1.  **Queueing and Traffic:** The proverb holds. These are coordination conventions where deviation creates negative externalities for the host community. Guidance can be firm here.
  2.  **Tipping:** The proverb fails. Because tipping is a financial transfer rather than a behavioral coordination, and because it is often contested even among locals, "When in Rome" does not generate a moral duty. Guidance here should be informational ("This is the custom") rather than normative ("You ought to do this").

  If the committee wishes to be precise, the guidance should distinguish between *civic courtesies* (where the proverb applies) and *economic conventions* (where it does not).
