      Rain lashed against the windows of Varrick's office on the 5th of Leaf-fall. The room was dim, the fireplace unlit, smelling of damp wool and stale tobacco smoke that had settled into the curtains. Varrick paced the floor, the wood creaking under his weight, his shadow stretching and shrinking against the walls. He was no longer the confident director of Frostfall; his eyes were rimmed with red, his hands trembling as he shuffled papers that offered no new answers. He spoke of changing the drill angles, of deepening the bore, of expanding the sector boundaries. He was desperate to find the variable the Theorem had omitted. Elara sat in the visitor's chair, the heavy iron key resting on the desk between them like an accusation. Varrick stopped pacing and stared at the key. He asked her if she believed the math was wrong. Elara said nothing. She knew the math was perfect; it was the utility that was flawed. The guarantee was absolute, but it was also useless. Varrick picked up the key, turning it over in his hands as if it were a talisman that might reveal coordinates if stared at long enough. He wanted her to tell him which lock to open, which door led to the Vein. But the key only opened the supply cage, and the supplies were nearly gone. The rain intensified, drumming against the glass like a code they could not crack. Varrick placed the key back on the desk with a sharp click. He looked at Elara, waiting for a solution she could not give. The guarantee hung in the air, a heavy, invisible weight that crushed them both. They had the proof of victory, but no move to play.

      *Revised Scene 5:*
      It was the 20th of Frostfall again, a year to the day since she had first taken the key. The site was silent, the drills covered in tarps that whipped in the freezing wind, snapping like gunshots. Snow dusted the ground, hiding the mud and the tire tracks in a blanket of white silence. Elara stood before the supply cage, the heavy iron key in her hand. The Consortium had pulled the funding an hour ago. The site was to be sealed, the equipment left to rust until the liquidators arrived. Her task was to lock up the remnants. She inserted the key into the lock. It turned smoothly, the mechanism oiled one last time. She pushed the gate shut. She turned the key to lock it. The sound was final, a sharp snap in the quiet air. In the beginning, this turn had meant access, the start of motion, the release of potential. Now, it meant exclusion, the end of motion, the containment of failure. She removed the key and held it in her palm. It was just a piece of metal now, serrated and cold. It fit no other lock; it opened no other door. The guarantee of the Vein remained true, somewhere beneath the snow, mathematically certain and economically worthless. Elara placed the key in the envelope marked *Returns*. The proof stood unrefuted, a monument to a truth that could not be used. She walked away from the cage, leaving the key behind on the desk of the caretaker, a heavy token of a win that no one could claim.

