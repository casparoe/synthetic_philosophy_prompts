      The office smelled of beeswax and the particular dry cold of Frostfall that seeped through the double-paned glass. Director Varrick stood by the fireplace, the flames casting long, dancing shadows against the shelves of bound ledgers. He did not look at Elara when he spoke, his eyes fixed on the fire as if reading tea leaves in the coal. He spoke of the Theorem, of the certainty that the Vein existed within the sector boundaries. It was a mathematical guarantee, he said, as solid as the stone beneath their boots. Forty million crowns had been allocated, a sum large enough to purchase the loyalty of a small kingdom, yet Varrick treated it as pocket change against the inevitability of the proof.

      He turned then, reaching into his waistcoat pocket to produce a heavy iron key. It was cold to the touch, serrated edges biting into her palm. This key, he explained, opened the primary supply cage in the lower depot. It was her responsibility to manage the disbursements against the projected timeline. To hold the key was to hold the engine of the operation; without her turn of the wrist, the drills would not spin. Elara weighed the metal in her hand, feeling the gravity of the trust placed upon her clerical shoulders. She nodded, slipping the key into her apron pocket. It felt like a promise, a tangible assertion that the future was already written and merely waiting to be unlocked. Outside, the wind howled against the masonry, but inside, the air was still, preserved in the amber of Varrick's confidence. She left the office with the key warm against her hip, believing that the map was unnecessary when the destination was guaranteed.

      *(Scene 2)*
      By the 3rd of Thaw, the mud outside the site office had turned the color of bruised meat. The smell of diesel fuel hung heavy in the air, mixing with the damp rot of canvas tarps that flapped incessantly in the wind. Elara sat at her desk, surrounded by stacks of invoices that grew like mold in the corners. The drills had been running for six weeks, chewing through sandstone and shale, but the assays came back empty. Varrick visited her station daily, his boots leaving muddy prints on the clean floorboards. He demanded more fuel, more casing, more manpower. When Elara pointed to the budget variance, red ink bleeding across the columns, Varrick waved a hand dismissively.

      The Theorem held, he insisted. The Vein was there. They were simply executing the search parameters. Elara took the heavy iron key from her drawer and walked out to the depot. The lock was stiff, rusted by the sea spray, but the key turned with a satisfying clunk. Inside, the drums of fuel stood in neat rows, waiting to be consumed. She signed the release forms, watching the men load the trucks. The key granted access, yet it offered no direction. It opened the door to the resources, but it did not tell them where to pour them. As she walked back to the office, the key felt heavier than it had in Frostfall. The mud sucked at her boots, slowing her pace, and the certainty of the office fireplace seemed a distant memory against the grinding reality of the empty boreholes. The engine was running, but the vehicle was stationary.

      *(Scene 3)*
      The archives were kept in the basement, a room that smelled of dry rot and old paper. It was the 12th of Heat, and the humidity outside was oppressive, but down here the air was cool and stagnant. Elara had been tasked with auditing the original grant documentation, a formality Varrick claimed was unnecessary but the Consortium insisted upon. She pulled the binder labeled *Sector 9: Existence Proofs*. The pages were brittle, the ink faded to brown. She read through the logical deductions, the dense paragraphs of topology and resource probability. It was dense, impenetrable work, written by a mathematician long dead.

      Then she found the footnote on page forty-two. It referenced a method of proof, a logical trick where the existence of a solution was demonstrated by showing that the absence of one led to a contradiction. The text used the phrase *strategy stealing* in passing, dismissing it as a standard heuristic for non-constructive existence. Elara sat back in the wooden chair, the dust motes dancing in the single beam of light from the high window. The proof stated that a winning configuration *must* exist within the bounds. It did not state where. It did not state how to find it. It was a guarantee of presence, not a map to location. She ran her finger over the words. The Consortium had funded a certainty, but they had purchased no plan. The heavy iron key sat on the desk beside the binder. In the silence of the archives, the logic of the theorem unravelled. They knew the treasure was in the house, but they had no key to the rooms.

      *(Scene 4)*
      Rain lashed against the windows of Varrick's office on the 5th of Leaf-fall. The room was dim, the fireplace unlit, smelling of damp wool and stale tobacco. Varrick paced the floor, the wood creaking under his weight. He was no longer the confident director of Frostfall; his eyes were rimmed with red, his hands trembling as he shuffled papers. He spoke of changing the drill angles, of deepening the bore, of expanding the sector boundaries. He was desperate to find the variable the Theorem had omitted. Elara sat in the visitor's chair, the heavy iron key resting on the desk between them.

      Varrick stopped pacing and stared at the key. He asked her if she believed the math was wrong. Elara said nothing. She knew the math was perfect; it was the utility that was flawed. The guarantee was absolute, but it was also useless. Varrick picked up the key, turning it over in his hands as if it were a talisman that might reveal coordinates if stared at long enough. He wanted her to tell him which lock to open, which door led to the Vein. But the key only opened the supply cage, and the supplies were nearly gone. The rain intensified, drumming against the glass like a code they could not crack. Varrick placed the key back on the desk with a sharp click. He looked at Elara, waiting for a solution she could not give. The guarantee hung in the air, a heavy, invisible weight that crushed them both. They had the proof of victory, but no move to play.

      *(Scene 5)*
      It was the 20th of Frostfall again, a year to the day since she had first taken the key. The site was silent, the drills covered in tarps that whipped in the freezing wind. Snow dusted the ground, hiding the mud and the tire tracks. Elara stood before the supply cage, the heavy iron key in her hand. The Consortium had pulled the funding an hour ago. The site was to be sealed, the equipment left to rust until the liquidators arrived. Her task was to lock up the remnants. She inserted the key into the lock. It turned smoothly, the mechanism oiled one last time. She pushed the gate shut.

      She turned the key to lock it. The sound was final, a sharp snap in the quiet air. In the beginning, this turn had meant access, the start of motion, the release of potential. Now, it meant exclusion, the end of motion, the containment of failure. She removed the key and held it in her palm. It was just a piece of metal now, serrated and cold. It fit no other lock; it opened no other door. The guarantee of the Vein remained true, somewhere beneath the snow, mathematically certain and economically worthless. Elara placed the key in the envelope marked *Returns*. The proof stood unrefuted, a monument to a truth that could not be used. She walked away from the cage, leaving the key behind on the desk of the caretaker, a heavy token of a win that no one could claim.

