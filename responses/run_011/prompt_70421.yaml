answer: |-
  ### 1. The Arithmetic Pass

  The table is internally consistent; the reversal is mathematically exact, not a rounding error.

  *   **Users:** $(300 \times 0.92) + (1000 \times 0.72) + (1700 \times 0.54) = 276 + 720 + 918 = 1,914$ passes.
      $1,914 / 3,000 = \mathbf{63.8\%}$.
  *   **Non-Users:** $(2700 \times 0.90) + (2000 \times 0.70) + (2300 \times 0.52) = 2430 + 1400 + 1196 = 5,026$ passes.
      $5,026 / 7,000 = \mathbf{71.8\%}$.

  **Flagged Claim:** **Claim C** is the only one potentially incoherent *with the provided table*. The IT lead claims fixing the deduping will make the reversal "go away." Since the arithmetic above proves the reversal exists in *these* numbers, Claim C asserts the *inputs* are corrupted, not the aggregation. It's not mathematically incoherent, but it contradicts the integrity of the data you handed me. **Claim E** is logically incoherent: it attributes South's low baseline to the app, ignoring the confirmed fact that South was targeted *because* it was already low-performing.

  ***

  ### 2. Claim Ranking (Impact on Headline)

  I am scoring these 0–10 based on how much weight I would give each claim when writing the headline. 10 means "determines the headline," 0 means "ignore."

  1.  **Claim D (Economist) — Score: 10**
      *   **Why:** This identifies the fatal identification problem. Voluntary opt-in within schools guarantees selection bias (motivated families). The +2% is almost certainly parental engagement, not app efficacy. This kills the "App Works" headline.
  2.  **Claim B (Causation Person) — Score: 9**
      *   **Why:** This correctly frames the dilemma. The aggregate is the *policy effect* (rollout to struggling schools dragged down averages); the disaggregate is the *efficacy signal* (confounded by selection). A responsible headline must distinguish these.
  3.  **Claim C (IT Lead) — Score: 8**
      *   **Why:** Data integrity trumps causal inference. If the denominators are wrong due to ID recycling, the +2% is fiction. I score it slightly below D because D is a *known* design flaw, while C is an *unconfirmed* data error, but C remains a nuclear veto.
  4.  **Claim H (Grad Student) — Score: 7**
      *   **Why:** A sophisticated caveat. If the app caused transfers (mediator), conditioning on school biases the estimate. Given the 6% transfer uptick, this is non-trivial, though likely secondary to the selection bias in D.
  5.  **Claim F (Vendor Analyst) — Score: 5**
      *   **Why:** Standardization is the correct statistical *attempt* to fix the aggregate, but it assumes no unobserved confounding within schools. Given Claim D, that assumption is false. It's methodologically sound but causally optimistic.
  6.  **Claim A (Vendor Head) — Score: 4**
      *   **Why:** Mathematically true but causally vacuous. Explaining the weighted average doesn't tell us if the app helps or hurts. It defends the numbers, not the product.
  7.  **Claim G (Statistician) — Score: 2**
      *   **Why:** Dangerous dogma. "Always disaggregate" ignores the policy reality (Claim B) and risks mediator bias (Claim H). It's a heuristic, not a causal rule.
  8.  **Claim E (Parent Advocate) — Score: 0**
      *   **Why:** Post hoc ergo propter hoc fallacy. South was lowest *before* the app. This claim ignores the rollout protocol entirely.

  ***

  ### 3. Credence Estimate

  **Credence that the app raises pass rates for a kid who uses it: 0.25**

  **Reasoning:** In observational ed-tech studies with voluntary uptake, the "within-school" advantage is overwhelmingly driven by family engagement, not the software. The +2% is within the noise of self-selection. The structural evidence (targeted rollout to low-performing schools) explains the aggregate reversal without requiring the app to be harmful, but it also provides no evidence the app is helpful. I assign 25% to allow for a small genuine effect, but the prior on "voluntary ed-tech app works" is low.

  ***

  ### 4. Mind Changer & Uncertainty

  **The Mind Changer:** **Claim C (IT Lead).**
  If an audit confirms the ID deduping is broken and the app column has inflated denominators, the +2% within schools could vanish or reverse instantly. This is the only claim that invalidates the *data* rather than just the *interpretation*. If C is proven true, my credence drops to <0.05. If C is proven false (data is clean), my credence holds at 0.25.

  **My Greatest Uncertainty:** **Claim H (Grad Student).**
  I am least sure I have handled H fairly. The 6% transfer increase is small, but if those transfers were high-performing students moving *into* app schools specifically for the tool, "School" becomes a partial mediator. Conditioning on it (as in Claim D's logic) would block that pathway, meaning the +2% might actually *underestimate* the total effect (including the attraction power of the app). However, since the rollout was district-mandated building-by-building, School is primarily a confounder. Distinguishing the magnitude of the mediator effect vs. the confounder effect is impossible without individual-level transfer data, which the district says it doesn't have. I may be underweighting H because it's harder to quantify than D.
