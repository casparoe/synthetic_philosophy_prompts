answer: |-
  **Bottom line**
  The room must leave saying: "You cannot treat conditionals as propositions that obey Bayesian updating without collapsing independence." Everything hangs on the requirement that the thesis $P(A \to C) = P(C|A)$ holds not just for your current belief state, but for any state obtained by conditioning on evidence. If you restrict it to the current state, the algebra never closes; if you assert it globally too early, they reject it as dogma.

  **Sequence**
  **0–10: The Bayes Check.** Verify fluency. Write $P(C|A) = P(A \cap C)/P(A)$. Ask them to compute this for a concrete case. Do not mention conditionals yet. This establishes shared notation and confidence.
  **10–20: The Thesis & The Trap.** Introduce $P(A \to C) = P(C|A)$ as "Stalnaker's Thesis." Ask: "Is this a definition or a claim?" They will say definition. Write it as a constraint on rational credence. Do not yet introduce the universal quantifier over probability functions. If you do now, they will dismiss it as an unrealistic assumption about agents.
  **20–30: The First Derivation.** Use the carrying example. Calculate $P(C|A)$. Ask them to assign a probability to the proposition $A \to C$. They will assign $P(C|A)$. This works fine statically. Nothing breaks yet. This delay is crucial; they must feel the thesis is harmless before you tighten the screws.
  **30–40: The Crucial Turn (Dynamic Coherence).** Now introduce the structural premise. Ask: "If you learn $C$ is true, what is your new probability for $A \to C$?" They must apply Bayes. But for the thesis to remain rational, it must hold for the *new* probability function too. Write: $P_{new}(A \to C) = P_{new}(C|A)$. This is not an assumption about agents; it is a requirement of diachronic coherence. If the thesis is a law of probability, it survives conditioning. Placing this here earns the premise because they have already committed to the thesis for the current state.
  **40–50: The Contradiction.** Compute $P(C|A)$ after conditioning on $C$ (it becomes 1) and $\neg C$ (it becomes 0). Use the Law of Total Probability to show the initial $P(A \to C)$ must equal $P(C)$. Compare this to the initial $P(C|A)$. They will differ. The board now shows $1/2 = 1/3$.
  **50–60: The Exit.** Conclude that $A \to C$ cannot be a proposition in the sample space. Do not resolve it; let the contradiction stand.

  **The carrying example**
  Use an urn with three balls: Red, Green, Blue. Draw one. Uniform probability.
  **Antecedent ($A$):** Not Red (Green or Blue).
  **Consequent ($C$):** Green.
  **Features it must have:** Non-zero probabilities for all atoms. $P(C|A) \neq P(C)$. Here $P(C|A) = 1/2$, $P(C) = 1/3$. No nested conditionals.
  **Features it must lack:** Zero-probability antecedents (avoids division-by-zero distractions). Equiprobable outcomes are fine, but dependence is required.
  **The Precise Move:** First, calculate $P(C|A) = 1/2$. This is their assigned value for $P(A \to C)$. Next, reweight the space by conditioning on $C$ (the ball is Green). In this new space, $P_C(C|A) = 1$. Then condition on $\neg C$ (Red or Blue). Here $P_{\neg C}(C|A) = 0$. By Total Probability, the original $P(A \to C)$ must have been $1 \cdot P(C) + 0 \cdot P(\neg C) = 1/3$. The contradiction ($1/2 \neq 1/3$) is now arithmetic they can verify by counting balls.

  **Misconception map**
  1.  **"It's Material Implication."** (Surfaces at 10 min). They will assume $A \to C$ means $A \supset C$. Head this off immediately by showing $P(A \supset C) = 1 - P(A \land \neg C) \neq P(C|A)$. If you wait, they will interpret the contradiction as proof that material implication is bad, missing the point that *no* proposition works.
  2.  **"Notation Confusion."** (Surfaces at 15 min). They will claim $P(A \to C)$ is just shorthand for $P(C|A)$. You must insist $A \to C$ is an event in the sample space with a truth value. If you don't enforce this ontological claim early, the triviality result becomes a tautology about notation.
  3.  **"Single Agent Rescue."** (Surfaces at 35 min). When you introduce the universal premise, they will argue it only applies to their current credence. You must block this at the moment of updating (Step 4). If you allow them to restrict the thesis to the initial state, the Law of Total Probability cannot be applied to the conditional values, and the contradiction vanishes.
  4.  **"Weakening to Inequality."** (Surfaces at 50 min). They will suggest $P(A \to C) \approx P(C|A)$. Explain that Lewis's result relies on equality. Inequalities avoid triviality but lose the normative force they wanted. Answer this only at the end; earlier, it distracts from the strict derivation.

  **The objection worth stealing**
  At minute 50, a student will say: "Then conditionals aren't propositions." This is not a misconception; it is Adams' Thesis, the standard live response in the literature. Acknowledge it immediately: "Exactly. Lewis forces you to choose: keep the probabilities or keep the truth conditions." Do not elaborate on Adams' logic; simply validate that their intuition identifies the correct escape hatch.

  **The closing check**
  Ask: "If I tell you the ball is definitely not Green, what is the probability of 'If Not Red then Green'?"
