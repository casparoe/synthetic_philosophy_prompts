          *   *Fit:* Explains age limits and prisoner exclusion (sometimes framed as breach of social contract).

      *   *Synthesis:* The user's intuitions seem to align best with a hybrid of **Membership** (belonging to the community) and **Subjection to Coercion** (living under the laws), with a dash of **Stake** (long-term interest).

  4.  **Address the "Boundary Problem" (Who Decides?):**
      *   This is the classic *demos* problem (Whose people?).
      *   *The Circle:* Current voters decide who future voters are.
      *   *Is it fatal?* Not necessarily.
      *   *Way out 1: Constitutional Entrenchment.* Higher law sets the rules, harder to change than simple majority.
      *   *Way out 2: Moral/Philosophical Constraints.* We appeal to external standards (human rights, justice) rather than just procedural validity.
      *   *Way out 3: Iterative/Democratic Process.* Acknowledge the circle but insist on inclusive deliberation to expand the circle over time (e.g., suffrage movements).
