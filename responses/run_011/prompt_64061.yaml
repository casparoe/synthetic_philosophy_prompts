      *   *Long-term resident non-citizen (Local Yes, National No):* Suggests *affected interests* (schools, local taxes) matter more than formal membership (citizenship) at the local level, but national sovereignty requires citizenship.
      *   *Expat (5 years vs. 2 years):* 5 years away (No) vs. 2 years away (Yes). Suggests *connection/ties* to the community matter. Mere legal status (passport) isn't enough if the social fabric is severed.
      *   *Ex-felon (Yes) vs. Prisoner (No):* Suggests *membership in the community* is suspended by incarceration but restored after.
      *   *Tourist (No) vs. Foreign Manufacturer (No):* Both are affected economically. User says No to both. This is the tricky one. Why is the manufacturer different from the 16yo worker? The worker is *inside* the political community; the manufacturer is *outside*. This points to *membership* or *subjection to law* rather than just *being affected*.

  3.  **Identify Potential Principles:**
      *   *All Affected Interests (AAI):* Everyone affected by a decision should vote.
