answer: |-
  You have stumbled onto one of the deepest, most persistent problems in political philosophy. It has a name: **The Boundary Problem** (or the "Constitutive Paradox").

  Robert Dahl, one of the 20th century's leading democratic theorists, famously said that while democracy is a great way to make decisions *within* a group, it offers no logical way to define *who constitutes the group.*

  Your head is spinning because you are doing the work of a political philosopher. Let's break down your intuitions to find the principle, and then tackle the circularity trap.

  ### Part 1: Is there a unifying principle?

  Your intuitions are actually quite consistent, but they reject the two most common simple principles.

  1.  **You reject "All Affected Interests."** If everyone affected by a decision should vote, the foreign manufacturer and the tourist should vote. They are financially impacted. You said no.
  2.  **You reject "Strict Citizenship."** If only citizens should vote, the long-term resident non-citizen shouldn't vote locally. You said yes.

  So, what principle fits your specific cases? It looks like a hybrid of **"Subjection to Coercion"** and **"Community Membership."**

  *   **The 16yo Worker vs. 17yo Student:** This suggests **Capacity + Contribution.** You are willing to bend the age rule for someone fully integrated into the economic/legal machinery (taxes), but accept the bright line for those still in the "preparation" phase (school).
  *   **The Resident Non-Citizen:** This fits **Subjection to Coercion.** They live under the local laws, use the schools, and are policed by the local force. They are subject to the daily machinery of the state, so they get a say in that machinery.
  *   **The Expats (2 years vs. 5 years):** This fits **Community Membership.** The 2-year expat is temporarily absent but socially tethered. The 5-year expat has severed the social fabric. Voting is not just about being affected; it's about belonging to the *demos* (the people).
  *   **The Felon (Out vs. In):** This fits **Forfeiture of Membership.** Incarceration is a temporary suspension of membership in the social contract. Once the debt is paid, membership is restored.
  *   **The Tourist & Manufacturer:** They fail the **Coercion/Membership** test. They are affected, but they are not *subject* to the full weight of the legal order in the same way, nor are they members of the community. They can leave; the residents cannot easily escape the consequences.

  **The Principle:** *Voting rights belong to those who are permanently subject to the coercive power of the state and share in the ongoing maintenance of the political community.*

  This explains why the manufacturer doesn't vote (not subject to the coercion/residency) and why the resident alien does (subject to coercion/residency).

  ### Part 2: Who decides the principle? (The Circular Trap)

  Your roommate hit the nail on the head. This is the hard part.

  If you ask "Who should vote?" and the answer is "The voters decide," you are begging the question. You have to define the voters to hold the vote to define the voters. This is the **Paradox of Democratic Legitimation.**

  Does this sink the project? Most philosophers say **no**, but it requires shifting how we view democracy. Here are three ways out of the circle that don't just bless the status quo:

  **1. The "Pre-Commitment" Strategy (Constitutionalism)**
  We acknowledge that the current voters cannot decide this casually. So, we move the decision to a higher level of law that is harder to change. Constitutions often set voting rights (e.g., "18 and older," "citizens").
  *   *The Escape:* The legitimacy doesn't come from the current voters agreeing to it; it comes from a past moment of "We the People" agreeing to rules that bind the future.
  *   *The Flaw:* That past moment was also decided by a limited group of people. It pushes the circle back in time, but doesn't break it.

  **2. The "Trusteeship" Argument**
  We accept that current voters decide, but we impose a **moral obligation** on them to act as trustees for those currently excluded.
  *   *The Escape:* If the current voters exclude a group that clearly meets the principle (like your 16-year-old taxpayer), they are violating a democratic norm, even if they have the procedural power to do so.
  *   *The Mechanism:* This is how suffrage expanded historically. Women and minorities didn't get the vote because the existing voters woke up one day and logically solved the paradox. They got it because excluded groups demanded inclusion, appealing to a standard *higher* than the current voting rules (justice, equality, natural rights).

  **3. The "All-Subjected" Default**
  Some theorists (like Frederick Whelan or Ludvig Beckman) argue that when in doubt, the boundary should be drawn as inclusively as possible.
  *   *The Escape:* Instead of asking "Who has proven they deserve to vote?", we ask "Who is clearly *not* subject to our laws?"
  *   *The Result:* This creates a presumption of inclusion. The burden of proof shifts to those who want to *exclude* someone. This breaks the circle by making exclusion the thing that requires justification, not inclusion.

  ### The Verdict

  The circularity doesn't sink the project, but it does mean democracy can never be a closed, perfect logical system. It is an **open-ended practice.**

  Your roommate is right that there is no neutral, God's-eye view to decide who votes. But that doesn't mean "anything goes."

  The way out of the circle is to admit that **the boundary of the demos is a political question, not a mathematical one.** It is decided by conflict, argument, and social movements (exactly like the one you just had).

  *   **Status Quo Blessing?** Only if you say "The law is the law, end of story."
  *   **The Way Out:** You say "The law defines the voters, *but* the voters are morally bound to expand the franchise to anyone who meets the principle of 'subjection and membership'."

  Your intuitions are solid. You've identified that voting isn't about being *affected* (otherwise the manufacturer votes), and it isn't about *blood* (otherwise the resident alien doesn't vote). It's about **shared fate under the law.**

  The fact that you can't prove that principle without using the principle itself isn't a bug; it's the feature of a living democracy. It means the argument never truly ends, which is what keeps the system from ossifying. Tell your roommate their head should be spinning too; if it isn't, they aren't thinking hard enough.
