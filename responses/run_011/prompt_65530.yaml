  **Task 1 — diagnostics first**

  To classify these traits, I will apply three diagnostic questions: (1) Is there measurable variation in the trait correlated with fitness within the relevant ecological context? (2) Is the trait's presence or magnitude determined by a developmental or structural variable independent of function? (3) Is the trait present in ancestors or ecologically inappropriate contexts where it confers no advantage? These categories are not interchangeable because a trait can be a structural byproduct in origin yet later co-opted by selection (exaptation), meaning it scores high on both architecture and adaptation axes simultaneously. A trait may also be a phylogenetic legacy that is currently maladaptive, scoring high on architecture but negative on adaptation.

  **Task 2 — two-axis ratings**

  | Trait | Axis A (Adaptation) | Axis B (Architectural Byproduct) | Classification | Justification |
  | :--- | :---: | :---: | :--- | :--- |
  | **T1. Palatal Keel** | 0 | 10 | Byproduct still unused | Keel height is a monotonic function of fusion angle and of nothing else, and the species with the tallest keel never uses it. (Scores would shift to A=9 in the four bark-stripping species.) |
  | **T2. Flank Pocket** | 9 | 5 | Exapted adaptation | Individuals with functioning glands hold territories longer, though the pocket geometry itself is universal across the genus. |
  | **T3. Webbing** | 9 | 6 | Exapted adaptation | Webbing sits at an optimum in aquatic species, but the identical degree in terrestrial species and the fossil outgroup indicates a constrained ancestral legacy. |
  | **T4. Liver Mass** | 0 | 10 | Architectural byproduct | Residual deviation from the allometric line is uncorrelated with diet, activity level, or any fitness proxy measured. |
  | **T5. Tail Tuft** | 10 | 0 | Adaptation | Within the two species possessing it, tuft size predicts parasite load and number of sleep interruptions, and it is absent elsewhere. |
  | **T6. Eye Tint** | 0 | 0 | Neutral variant | Experiments show the tint makes no difference to vision or social response, and population history suggests drift. |
  | **T7. Molar Cusp** | 0 | 10 | Phylogenetic legacy | No manipulation has eliminated the cusp without also eliminating functional cusps, yet it costs mineral and raises fracture risk. |

  **Task 3 — tier list**

  1.  **T7 (Molar Cusp):** This is the most damaging case because the trait is actively costly and developmentally unavoidable, directly contradicting the claim that selection optimizes every feature.
  2.  **T4 (Liver Mass):** This severely undermines adaptationism by showing a major organ varies purely by allometric constraint with zero fitness correlation.
  3.  **T1 (Palatal Keel):** The fact that the most developed instance of the trait is functionless in the fruit-eater proves structure can dictate form over utility.
  4.  **T6 (Eye Tint):** This forces the admission that some fixed traits are merely drift, though an adaptationist might still posit a hidden function.
  5.  **T3 (Webbing):** The terrestrial presence suggests legacy, but the aquatic optimum allows an adaptationist to argue it is maintained by selection where useful.
  6.  **T2 (Flank Pocket):** The adaptive gland in some species allows an adaptationist to focus on the function and treat the empty pockets as minor noise.
  7.  **T5 (Tail Tuft):** This is the least damaging case because it fits the adaptationist framework perfectly with clear function, fitness correlation, and specific ecology.

  **Task 4 — rating the argumentative moves**

