prompt: |-
  I am assembling a graduate seminar on explanation and reduction, and I have concluded that the vocabulary I most want to teach is currently unusable as an instrument, because nobody can say what would count as applying it correctly. I mean Dennett's contrast, from *Darwin's Dangerous Idea* (1995), between cranes and skyhooks, and between good and greedy reductionism. He glosses the failure of greedy reductionism as the attempt to "skip whole layers or levels of theory in their rush to fasten everything securely and neatly to the foundation," and he summarises the contrast as follows: "Good reductionists suppose that all Design can be explained without skyhooks; greedy reductionists suppose it can all be explained without cranes." As far as I can see, both formulations tell you what a verdict sounds like rather than what makes it true, and the terms have since become polemical weapons wielded in both directions by partisans of and against reduction.

  So before I put any candidate analysis in front of students, I want the specification. Take the target theory to be this: a criterion, statable in advance of any particular case and operable by someone who does not already know how the case should come out, which sorts proposed explanatory posits into cranes (legitimate, level-building explanations) and skyhooks (posits that smuggle in the explanandum from outside the natural order), and which sorts reductionist programmes into good and greedy. The purpose is prospective adjudication of live proposals, not retrospective congratulation.

  Write the desiderata such a criterion must satisfy, with the case or consideration behind each. At minimum I want it to handle: Mendelian factors and vitalist entelechy as they stood in 1910, when both were placeholder posits and only one paid off; universality explanations of the renormalization-group variety, where deliberately ignoring lower-level detail is what makes the explanation good; a brute low-entropy initial condition for the universe, which looks either like a skyhook or like the only honest stopping point available; the strategy of explaining intelligence by decomposing an intelligent homunculus into stupider ones; a posited sui generis higher-level causal power, and the exclusion-style argument that denies it; and an innate structured endowment posited to explain the speed of acquisition.

  Then tell me, for each desideratum, whether it is non-negotiable or a preference of one camp, and say whose. I want the requirements that key on symmetry (the criterion must be able to convict anti-reductionists of skyhooks as readily as reductionists of skipping cranes), on prospectivity, on non-question-begging, on the difference between skipping a level and eliminating one, on gradability, on the way the verdict seems to shift with the explanandum a posit is offered for, and on the need for legitimate stopping points if cranes cannot stack forever. Flag any subset you believe cannot be jointly satisfied; my own suspicion is that symmetry, prospectivity, and non-question-begging cannot all be had at once, and if that is right, it is the main result rather than a footnote, since it would show the distinction is regulative rather than criterial. Finally, say which single requirement excludes the most candidates, and score four contenders against the list — mechanistic decomposability; unconstrainedness (a posit is a skyhook iff nothing independent of its target phenomenon constrains it); predictive consilience; and circularity (a posit is a skyhook iff it performs the very work the theory was introduced to explain).

  Keep the weight on the requirements and their motivating cases rather than on the scoring, and give me no references or reading list — I want the analysis, not the bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Dennett's distinction between Cranes/Skyhooks and Good/Greedy Reductionism.
      *   **Problem:** The vocabulary is currently unusable as an instrument because there's no clear criterion for correct application (it's polemical/retrospective).
      *   **Task:** Write the *desiderata* for a criterion that *could* sort these prospectively (before knowing the outcome).
      *   **Specific Cases to Handle:**
          1.  Mendelian factors vs. Vitalist entelechy (1910 context).
          2.  Universality/Renormalization Group (ignoring detail is good).
          3.  Brute low-entropy initial condition (Skyhook vs. honest stopping point).
          4.  Homuncular decomposition (intelligence into stupider parts).
          5.  Sui generis higher-level causal power vs. Exclusion argument.
          6.  Innate structured endowment (explaining speed of acquisition).
      *   **Specific Constraints/Themes to Address:** Symmetry, Prospectivity, Non-question-begging, Skipping vs. Eliminating, Gradability, Explanandum-relativity, Legitimate Stopping Points.
      *   **Classification:** For each desideratum, state if it's non-negotiable or a preference (and whose).
      *   **Impossibility Theorem:** Flag if a subset cannot be jointly satisfied (specifically Symmetry + Prospectivity + Non-question-begging). If true, this is the main result (regulative vs. criterial).
      *   **Scoring:** Identify the single most exclusionary requirement. Score four contenders: Mechanistic Decomposability, Unconstrainedness, Predictive Consilience, Circularity.
      *   **Format:** No references/reading list. Focus on analysis/requirements.

  2.  **Deconstruct the Core Problem:**
      *   Dennett's distinction is intuitive but notoriously hard to formalize *prospectively*.
      *   *Skyhook:* A miracle, something from outside the system, smuggling in the result.
      *   *Crane:* A mechanism built from below that lifts the design.
      *   *Greedy Reductionism:* Skipping levels, trying to explain everything directly from physics.
      *   *Good Reductionism:* Explaining design without skyhooks, using cranes.
      *   *The User's Insight:* The distinction works well retrospectively (we know entelechy was a skyhook and genes were cranes) but fails prospectively (in 1910, how did you know?).
      *   *The Goal:* Define the conditions a criterion *must* meet to be useful for a seminar, even if meeting them all is impossible.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Prospectivity.* The criterion must work *before* the theory succeeds or fails.
          *   *Case:* Mendel vs. Driesch (Entelechy) in 1910. Both looked like placeholders.
          *   *Status:* Non-negotiable for the user's purpose (instrumental use).

      *   *Desideratum 2: Symmetry.* Must catch anti-reductionist skyhooks and reductionist greed equally.
          *   *Case:* Sui generis causal powers (anti-reductionist skyhook?) vs. Greedy elimination of levels (reductionist error).
          *   *Status:* Non-negotiable for philosophical neutrality/fairness.

      *   *Desideratum 3: Non-Question-Begging.* Cannot assume naturalism or physicalism is true to define skyhooks.
          *   *Case:* Vitalism. If "natural order" just means "physical," vitalism is a skyhook by definition. But we need to know *why* it failed, not just define it away.
          *   *Status:* Non-negotiable for argumentative integrity.

      *   *Desideratum 4: Explanandum-Relativity.* A posit might be a crane for X but a skyhook for Y.
          *   *Case:* Innate endowment. Good for speed of acquisition? Skyhook for content of learning?
          *   *Status:* Non-negotiable (context matters).

      *   *Desideratum 5: Legitimate Stopping Points.* Must distinguish "brute fact" from "skyhook."
          *   *Case:* Low-entropy initial condition. Is it a skyhook or just the boundary condition?
          *   *Status:* Preference (Cosmologists/Physicalists want stopping points; Deep Explainers hate them).

      *   *Desideratum 6: Skipping vs. Eliminating.* Must distinguish ignoring detail (RG) from denying existence.
          *   *Case:* Renormalization Group. Ignoring micro-details is valid. Greedy reductionism denies the macro-level.
          *   *Status:* Non-negotiable (crucial for "Good" reductionism).

      *   *Desideratum 7: Gradability.* Skyhooks aren't always binary; some are "hookier" than others.
          *   *Case:* Homuncular decomposition. Is a slightly stupider homunculus a crane or a smaller skyhook?
          *   *Status:* Preference (Pragmatists like gradability; Formalists want binary).

  4.  **Analyzing the "Impossibility Theorem":**
      *   The user suspects Symmetry + Prospectivity + Non-question-begging is impossible.
      *   *Reasoning:* To judge prospectively without begging the question, you need neutral criteria. But "Skyhook" implies a violation of the natural order. If you don't define the natural order (question-begging), you can't identify the violation. If you wait for success (retrospective), you lose prospectivity. If you bias towards physicalism, you lose symmetry (anti-reductionists lose automatically).
      *   *Conclusion:* The user is likely right. The distinction is *regulative* (an ideal to aim for) not *criterial* (a test to apply). This is the "main result."

  5.  **Scoring the Contenders:**
      *   *Mechanistic Decomposability:* Fails RG cases (universality doesn't care about mechanism). Fails Initial Condition (no mechanism for boundary).
      *   *Unconstrainedness:* (Posit is skyhook if nothing independent constrains it). Good for Mendel vs. Entelechy? Maybe. Hard to apply prospectively.
      *   *Predictive Consilience:* Good for prospectivity. But RG explanations often sacrifice micro-prediction for macro-universality.
      *   *Circularity:* (Posit performs the work it was introduced to explain). Strong candidate. Entelechy = circular. Genes = not circular (mechanism found later). But "circularity" is hard to spot prospectively in complex models (e.g., innate endowment).

      *   *Most Exclusionary Requirement:* Prospectivity. Most definitions rely on hindsight (did it cash out?).

  6.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the task (specifying the specification).
      *   Section 1: The Desiderata (with Case, Requirement, Status).
      *   Section 2: The Impossibility Result (The "Main Result").
      *   Section 3: The Scoring (Most exclusionary + 4 contenders).
      *   Tone: Rigorous, analytical, seminar-ready, no fluff.

  7.  **Drafting Content - Specific Considerations:**
      *   *Mendel vs. Entelechy:* In 1910, both were "black boxes." Criterion must distinguish them without knowing DNA.
      *   *RG/Universality:* Criterion must allow ignoring micro-details without calling it "greedy."
      *   *Initial Condition:* Criterion must allow a "brute fact" without calling it a "skyhook."
      *   *Homunculus:* Criterion must allow "stupider homunculi" as progress, not just infinite regress.
      *   *Causal Powers:* Criterion must handle exclusion arguments without assuming physicalism upfront.
      *   *Innate Endowment:* Is it a skyhook for learning?

      *   *Refining the Impossibility Claim:* If a criterion is prospective, it relies on structural features. If it is non-question-begging, it cannot assume physical closure. If it is symmetric, it cannot privilege lower levels. But "Skyhook" *means* "violation of natural closure." Therefore, to identify a skyhook prospectively without assuming closure is impossible. You either assume closure (begging question) or wait for failure (retrospective).

      *   *Scoring:*
          *   *Mechanistic:* Fails RG.
          *   *Unconstrainedness:* Hard to operationalize prospectively.
          *   *Consilience:* Good, but might penalize RG (which ignores detail).
          *   *Circularity:* Strongest, but hardest to detect prospectively in complex systems (is the innate structure just the competence we wanted to explain?).

      *   *Most Exclusionary:* Prospectivity. It kills almost all existing definitions which rely on "did it lead to further research?"

  8.  **Final Review against Constraints:**
      *   No references? Check.
      *   Handle specific cases? Check.
      *   Flag non-negotiable vs. preference? Check.
      *   Flag impossibility? Check.
      *   Score contenders? Check.
      *   Weight on requirements? Check.

      *(Self-Correction during drafting)*: Make sure to clearly distinguish "Good vs. Greedy" from "Cranes vs. Skyhooks." They are related but distinct. Greedy reductionism skips cranes. Skyhooks avoid cranes entirely. The criterion needs to handle both axes.
      *Actually, the prompt asks for a criterion that sorts posits into Cranes/Skyhooks AND programmes into Good/Greedy. I should treat them as intertwined.*

      *Refining the "Non-Question-Begging" status:* Is it non-negotiable? For a seminar on *explanation*, yes. If you define skyhooks as "non-physical," you've ended the debate before it started.
      *Refining "Symmetry":* Essential for the tool to be a tool, not a club.

      *Let's write.*
answer: |-
  To construct a criterion capable of prospectively adjudicating Dennett's distinctions, we must first specify the conditions such a criterion must satisfy. The following desiderata are derived from the failure modes of existing applications and the specific test cases you provided. Each is marked as either **Non-Negotiable** (required for the instrument to function as a neutral analytic tool) or **Preference** (reflecting a specific metaphysical or methodological commitment).

  ### I. Desiderata for the Criterion

  **1. The Prospectivity Constraint**
  *   **Requirement:** The criterion must yield a verdict based on the structural features of the proposal at the time of introduction, without relying on the future success or failure of the research programme.
  *   **Motivating Case:** *Mendelian factors vs. Vitalist entelechy (1910).* In 1910, both were black-box posits. Genes were unobserved particulate factors; entelechy was an unobserved organizing principle. Retrospectively, genes were cranes and entelechy was a skyhook. A prospective criterion must distinguish them without access to the discovery of DNA or the stagnation of vitalism.
  *   **Status:** **Non-Negotiable.** Without this, the distinction is merely a historical label for "what worked," rendering it useless for evaluating live proposals.

  **2. The Symmetry Constraint**
  *   **Requirement:** The criterion must be capable of identifying skyhooks in anti-reductionist proposals (e.g., emergent causal powers) and greedy reductionist errors in reductionist proposals (e.g., eliminativism) with equal facility. It cannot structurally privilege the lower level as automatically more real.
  *   **Motivating Case:** *Sui generis causal powers vs. Exclusion arguments.* An anti-reductionist positing a higher-level cause risks a skyhook verdict. A reductionist invoking causal exclusion risks a greedy verdict. The criterion must not define "natural order" such that one side loses by definition.
  *   **Status:** **Non-Negotiable.** Without this, the vocabulary remains a polemical weapon rather than an analytic instrument.

  **3. The Non-Question-Begging Constraint**
  *   **Requirement:** The criterion cannot define "skyhook" as "violation of physical law" or "natural order" unless "physical law" is defined independently of the verdict. It must not assume the closure of the physical world to prove that a posit is supernatural.
  *   **Motivating Case:** *Vitalist entelechy.* If the criterion defines a skyhook as "non-physical," vitalism is convicted immediately. But the philosophical work lies in showing *why* entelechy fails to integrate, not in defining it out of existence.
  *   **Status:** **Non-Negotiable.** To be philosophically robust, the tool must allow the possibility of the posit being legitimate, then rule it out on explanatory grounds.

  **4. The Explanandum-Relativity Constraint**
  *   **Requirement:** The verdict on a posit must be sensitive to the specific phenomenon it is intended to explain. A posit may be a crane for one explanandum and a skyhook for another.
  *   **Motivating Case:** *Innate structured endowment.* Positing innate structure is a crane for explaining the *speed* of acquisition (it offloads work to evolution). It may be a skyhook for explaining the *content* of acquisition (if the structure simply mirrors the knowledge to be gained). The criterion must track this shift.
  *   **Status:** **Non-Negotiable.** Explanatory value is relational; a fixed ontological verdict on the posit itself ignores the context of use.

  **5. The Abstraction Permission (Skipping vs. Eliminating)**
  *   **Requirement:** The criterion must distinguish between *ignoring* lower-level details for the sake of universality (legitimate abstraction) and *denying* their relevance or existence (greedy elimination).
  *   **Motivating Case:** *Renormalization Group (RG) explanations.* RG explanations are good precisely because they ignore micro-details to show universality. A criterion that demands micro-level specification for every macro-phenomenon would classify RG as greedy reductionism or failure.
  *   **Status:** **Non-Negotiable.** This is essential to save "Good Reductionism" from collapsing into "Greedy Reductionism."

  **6. The Stopping Point Constraint**
  *   **Requirement:** The criterion must distinguish between a "brute fact" that serves as a legitimate boundary condition and a "skyhook" that functions as a disguised explanation.
  *   **Motivating Case:** *Low-entropy initial condition.* Is positing a brute low-entropy start a skyhook (smuggling in the arrow of time) or an honest stopping point (the limit of cosmological explanation)? The criterion must allow for foundational layers that are not themselves craned up.
  *   **Status:** **Preference (Deep Explainers vs. Fundamentalists).** Fundamentalists prefer allowing stopping points to avoid infinite regress. Deep Explainers (who demand a crane for every design) view stopping points as disguised skyhooks.

  **7. The Gradability Constraint**
  *   **Requirement:** The criterion should allow for degrees of "hookiness" or "craneness," rather than a binary verdict.
  *   **Motivating Case:** *Homuncular decomposition.* Replacing an intelligent homunculus with a stupider one is progress (a crane), but if the stupider one is still too smart, it is a smaller skyhook. The distinction is often one of degree of residual competence.
  *   **Status:** **Preference (Pragmatists).** Formalists prefer binary classifications for logical clarity; Pragmatists view explanation as a continuum of understanding.

  ---

  ### II. The Impossibility Result

  You suspected that **Symmetry**, **Prospectivity**, and **Non-Question-Begging** cannot be jointly satisfied. This suspicion is correct. This is the main result of the analysis.

  **The Trilemma:**
  1.  **To be Prospective:** The criterion must rely on the internal structure of the theory, not its future empirical cash-out.
  2.  **To be Non-Question-Begging:** The criterion cannot assume physical closure or the falsity of dualism/vitalism in its definition of "natural order."
  3.  **To be Symmetric:** The criterion cannot structurally bias against higher-level posits simply for being higher-level.

  **The Conflict:**
  A "Skyhook" is defined as a posit that lifts design without a mechanism grounded in the lower level. To identify this *prospectively* without begging the question, you must identify a structural flaw in the posit itself (e.g., circularity). However, many posits (like Mendel's factors) are structurally similar to skyhooks (black boxes) but turn out to be cranes.
  *   If you judge based on **structure alone** (Prospectivity), you cannot distinguish Mendel from Driesch in 1910 without assuming physicalism (violating Non-Question-Begging) or assuming particles are better than forces (violating Symmetry).
  *   If you judge based on **integration with the natural order** (Non-Question-Begging), you must define that order. If you define it physically, you violate Symmetry (anti-reductionists lose). If you define it neutrally, you cannot identify the "hook" until the theory fails to integrate (violating Prospectivity).

  **Conclusion:** The distinction between Cranes and Skyhooks is **Regulative, not Criterial**. It functions as an ideal of explanation (aim for cranes, avoid skyhooks) rather than a test that can be applied to a theory in isolation. It guides the *process* of theorizing (seek mechanisms, avoid miracles) but cannot adjudicate the *product* prospectively without smuggling in metaphysical assumptions.

  For your seminar, this means you cannot teach the distinction as a tool for *sorting* theories, but rather as a heuristic for *constructing* them. The "verdict" is always retrospective.

  ---

  ### III. Scoring the Contenders

  **Most Exclusionary Requirement:**
  The **Prospectivity Constraint**.
  Almost every existing definition of reduction or mechanism relies on retrospective success (did it lead to further discoveries?) or metaphysical commitment (is it physical?). A criterion that must work *before* the empirical dust settles eliminates nearly all standard accounts of scientific explanation, which rely on confirmation over time.

  **Scoring the Four Contenders:**
  *Scale: 0 (Fails completely) to 5 (Satisfies all Non-Negotiable Desiderata).*

  **1. Mechanistic Decomposability**
  *(A posit is a crane iff it can be decomposed into lower-level parts performing functions.)*
  *   **Score:** 2/5
  *   **Analysis:** Fails the **Abstraction Permission** (RG explanations work precisely by *not* specifying mechanisms). Fails the **Stopping Point Constraint** (fundamental particles have no mechanism). It is strong on Symmetry (applies to all levels) but fails Prospectivity in cases where the mechanism is unknown (Mendel 1910).

  **2. Unconstrainedness**
  *(A posit is a skyhook iff nothing independent of its target phenomenon constrains it.)*
  *   **Score:** 3/5
  *   **Analysis:** Strong on **Non-Question-Begging** (structural constraint rather than ontological). Handles **Mendel vs. Entelechy** well if "independent constraint" means cross-domain linkage. However, it struggles with **Prospectivity**: determining what counts as an "independent constraint" often requires knowing the theory's future connections. It risks failing **Symmetry** if lower-level laws are treated as the only valid constraints.

  **3. Predictive Consilience**
  *(A posit is a crane iff it predicts phenomena beyond the one it was introduced to explain.)*
  *   **Score:** 4/5
  *   **Analysis:** The strongest candidate for **Prospectivity**. Mendel predicted ratios in new crosses; Entelechy did not. Handles **Innate Endowment** well (does it predict transfer to other tasks?). However, it struggles with **Explanandum-Relativity** (some good explanations are local) and **Stopping Points** (boundary conditions often don't predict new phenomena, they fit existing ones). It is slightly vulnerable to **Question-Begging** if "prediction" is weighted toward quantitative/physical outputs.

  **4. Circularity**
  *(A posit is a skyhook iff it performs the very work the theory was introduced to explain.)*
  *   **Score:** 3/5
  *   **Analysis:** Excellent for **Symmetry** and **Non-Question-Begging**. It catches the Homunculus (intelligence explaining intelligence) and Entelechy (organization explaining organization). However, it fails **Prospectivity** in complex cases: it is often difficult to determine *beforehand* whether a posit (like innate structure) is truly circular or merely a placeholder for a mechanism. It also struggles with **RG cases**, where the macro-law looks like it does the work of the micro-law, but legitimately so.

  **Summary Recommendation:**
  If you must present a criterion to students, **Predictive Consilience** is the most operable instrument, despite its imperfections regarding stopping points. However, the pedagogical value lies in demonstrating the **Impossibility Result**: show them that any criterion they choose will either beg the question, fail prospectively, or bias the outcome. This demonstrates that "Cranes vs. Skyhooks" is a demand for *theoretical labor* (show your work), not a classification of *ontological types*.
