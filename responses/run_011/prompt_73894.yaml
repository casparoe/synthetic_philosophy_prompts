answer: |-
  **Project Title:** Causal Architectures of the Cold War: A Conceptual Archaeology of Diplomatic Historiography

  **Project Summary**
  The question "Who started the Cold War?" has generated three distinct historiographical camps: Traditionalists, who identify a specific Soviet deviation from expected conduct; Revisionists, who locate the cause in structural arrangements that rendered confrontation robust regardless of agency; and Post-Revisionists, who view the onset as a reciprocal allocation of responsibility. Despite decades of archival openness, consensus remains elusive. This project proposes that the stalemate is not empirical but conceptual. The three camps are not offering rival answers to a single question but are answering three distinct causal questions regarding triggers, structural robustness, and reciprocal allocation. Over eighteen months, I will demonstrate that making these causal baselines explicit resolves apparent contradictions without dismissing the empirical evidence. This is not a deflationary claim that the question is meaningless; rather, it is a specification claim that the question is composite. By reconstructing the implicit causal models of key historiographical texts and testing them against bounded archival episodes, I will show that historians often agree on the facts but disagree on the *contrast classes* against which those facts are measured.

  **Research Question**
  To what extent does the historiographical disagreement regarding the onset of the Cold War stem from divergent causal models (trigger vs. structure vs. allocation) rather than conflicting empirical evidence? The project seeks a determinate answer: either the disagreements persist even when causal baselines are standardized (indicating genuine empirical conflict), or the disagreements dissolve into compatible claims about different causal features (indicating conceptual confusion).

  **Historiographical Context and Intervention**
  Existing positions have not settled this implicitly because the discipline treats causal attribution as a unified task. Traditionalists rely on a legalistic model of causation, isolating a *trigger* that departs from a presupposed baseline of normal diplomacy. Revisionists utilize a sociological model, asking which arrangements made conflict *robust* across substitutions of personnel or decisions. Post-Revisionists employ a game-theoretic intuition, asking how involvement should be *allocated* in a reciprocal system. Because these models operate on different logical levels, new documents do not resolve the debate; they are simply absorbed into existing causal frameworks. My intervention distinguishes the *metaphysics* of the cause from the *pragmatics* of its selection. I argue that the apparent empirical convergence and divergence over the decades is largely an artifact of shifting baselines. By distinguishing these models, I allow the historian to retain the archive and the philosopher to retain conceptual precision, avoiding the historian's fear of "decoration" and the philosopher's fear of "morass."

  **Methodology and Defense**
  I will employ a method of **Causal Narrative Reconstruction**. This involves analyzing historiographical arguments to extract their implicit counterfactual baselines and contrast classes, then re-evaluating the archival record through these standardized lenses.

  I explicitly reject three alternatives:
  1.  **More Archival Work on the Same Episodes:** Uncovering new documents regarding the 1947 aid initiatives will not solve the problem if historians continue to code those documents using incompatible causal logics. The bottleneck is interpretation, not evidence.
  2.  **Informal Counterfactual Speculation:** Untethered "what-if" scenarios lack rigor and often smuggle in the very biases they seek to test.
  3.  **Formal Actual-Causality (Structural Equations):** While structural equation modeling offers precision, it carries a high risk of encoding the historian's prior blame-allocation in the choice of variables and the direction of arrows. If I define the variables to privilege state-level security dilemmas, the model will output a Revisionist result; if I privilege individual decision nodes, it will output a Traditionalist one. This adds mathematical ornamentation to prior bias.

  Instead, I will use qualitative reconstruction to make the variables and baselines explicit *before* assessing the evidence. This defends against the bias objection by forcing the causal assumptions into the open for scrutiny rather than hiding them inside a formal apparatus.

  **Archival Component and Deliverables**
  To satisfy the requirement that this remains a dissertation in history, I will apply this method to three bounded episodes where disagreement is well-documented and tractable:
  1.  **The Atomic Decision (1945):** Comparing Traditionalist claims of Soviet espionage as a trigger against Revisionist claims of the atomic monopoly as a structural constraint.
  2.  **The Polish Settlement (Yalta/Potsdam):** Analyzing whether disagreements stem from differing baselines of "spheres of influence" versus "self-determination."
  3.  **The 1947 Sequence:** Examining the Truman Doctrine and Soviet consolidation of Eastern Europe to determine if they are treated as sequential triggers or reciprocal moves.

  For each episode, the deliverable will be a "translated" narrative. I will take two contradictory historical accounts and rewrite the causal explanation to show that, once the baseline is fixed (e.g., "assuming a baseline of great-power sphere management" vs. "assuming a baseline of liberal internationalism"), the claims are compatible. The final dissertation chapter will present these reconstructions not as a synthesis, but as a map of where the causal questions diverge.

  **Risk and Failure Conditions**
  This project faces three specific failure modes:
  1.  **Substantive Contradiction Persists:** If, after fixing baselines and contrast classes, the parties still contradict each other on the *facts* of the matter, then my reframing is merely verbal decoration.
  2.  **Trivial Scope:** If the apparatus yields determinate results only for micro-episodes (e.g., a single memo) but has no purchase on the general question of the Cold War's onset, the project lacks historical significance.
  3.  **Historical Irrelevance:** If the historian reader is correct that this exercise changes nothing anyone would write about 1945–1948, the project fails to contribute to the discipline. Success requires that the reconstructed narratives offer a more stable foundation for future diplomatic history than the current polarized literature.

  **Scope and Timeline**
  Eighteen months is sufficient for this writing phase. The archival research on these specific episodes is substantially complete; the task is re-interpretation and synthesis. Months 1–6 will be dedicated to drafting the methodological framework and the first episode (Atomic Decision). Months 7–12 will cover the Polish and 1947 episodes. Months 13–18 will be devoted to integration, introduction, and conclusion, ensuring the philosophical apparatus does not overwhelm the historical narrative.

  **Strategic Decision: The Vague Boundary Fork**
  I must decide whether to take a stand on the possibility that the Cold War has no determinate onset at all—that its beginning is a vague boundary rather than an event with a first moment.
  *Recommendation:* I will **bracket** this issue and work only with episodes whose boundaries are not in dispute.
  *Justification:* Tackling the ontological vagueness of the Cold War's "start date" conflates temporal ontology with causal attribution. If I argue the boundary is vague, I risk validating the historian's fear that I am dissolving their subject matter into metaphysics. By bracketing the temporal vagueness and focusing on episodes where the *timeline* is agreed upon but the *causal weight* is disputed, I isolate the variable of interest (causal models) without inviting the objection that the project is ill-posed. This ensures the dissertation remains a study of how historians argue about causes, rather than a metaphysical treatise on time, keeping the project tractable for the eighteen-month window and palatable to both readers.
