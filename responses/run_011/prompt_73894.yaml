      *   *Traditionalists:* Look for *triggers* (deviations from baseline).
      *   *Revisionists:* Look for *structural robustness* (conditions making conflict inevitable regardless of agency).
      *   *Post-Revisionists:* Look for *allocation* in reciprocal systems.
