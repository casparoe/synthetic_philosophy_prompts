  3. What is the probability that tacit skill and unrecorded instrumental know-how would have been recoverable by another group inside the ten-year window? Probability: 0.55. This is the weakest link in the inevitability argument, as crucial manipulations often reside in muscle memory or unpublished lab culture that dies with the principal investigator. Yet, the high success rate of replications in competitive fields suggests these barriers are usually permeable under strong incentive.

  4. What is the probability that counterfactuals of this kind have truth conditions determinate enough for the exercise to amount to more than expression? Probability: 0.80. Although metaphysically slippery, the operational constraints of functional equivalence allow us to bound the counterfactual using extant technical capabilities and correspondence. We can reliably estimate what was possible even if we cannot know what would have certainly occurred.

  5. I calculate the final credence as the arithmetic mean of the four probabilities, yielding 0.70. Conceptually, the conclusion is most sensitive to the third term regarding tacit knowledge, as it holds the widest range of plausible values among experts. The evidence that would shift this most is a systematic study of failed replications detailing whether stalls were due to missing data or untransferable skill. I suspect you and your friend part company most sharply on this third term, where your experience of results being "in the air" clashes with his conviction that unique craftsmanship drives breakthroughs.
