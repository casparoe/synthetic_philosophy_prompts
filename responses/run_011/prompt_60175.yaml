          3.  Rigidity Assumption: When to name it as substantive (not technical), given new info (diaphoresis, etc.) could change meaning.
          4.  Misconceptions: Where to head them off (LR absorption, less confidence everywhere, order immaterial, rationalized gestalt).
          5.  Final Question: Distinguish structural grasp from arithmetic memorization.
          6.  Refusals: What *not* to teach (measure theory, origin of weights, uniqueness/rationality disputes) and how to frame those omissions.

  2.  **Evaluate the Case (Chest Pain/ECG):**
      *   *Question:* Is "equivocal" a legitimate cell or a confidence smuggle?
      *   *Analysis:* In Bayesian terms, a partition must be mutually exclusive and exhaustive. "Clear elevation," "No elevation," and "Equivocal" *can* be a partition of the *observation space*, provided "Equivocal" is defined operationally (e.g., "ST segment morphology that does not meet strict criteria for STEMI but is not clearly normal"). However, residents often treat "Equivocal" as "I don't know if it's elevation or not," which is a statement about their internal state, not the ECG.
      *   *Risk:* If "Equivocal" just means "Probability of Elevation = 0.5," it collapses back to binary uncertainty. To make it Jeffrey Conditionalization, the resident must assign probabilities to the *states of the world* (STEMI vs. No STEMI) conditional on the *observation states* (Clear, None, Equivocal).
      *   *Verdict:* The case works *if* the partition is defined as distinct observational states with distinct likelihoods. "Equivocal" is legitimate if it has its own Likelihood Ratio (LR_equivocal). It is *not* just a confidence report if we treat the observation itself as the random variable $E$ taking values $\{e_1, e_2, e_3\}$.
      *   *Comparison:* Lung exam (crackles vs. no crackles vs. indeterminate due to noise) is similar. Rapid test (faint line) is also similar. The ECG case is high stakes and time-pressured, fitting the "10-second mental execution" requirement better than a lung exam which is more subjective. The ECG has a "gold standard" feel ( Cath Lab activation) that makes the binary collapse temptation stronger, thus better for dislodging it.
