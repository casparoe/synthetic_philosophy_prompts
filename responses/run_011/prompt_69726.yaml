  **VACANCY NOTICE: SENTENCING SURROGATE (GRADE C4)**
  **Department of Corrections | Temporal Liability Division**
  **Reference: PARFIT-2024-X**

  **About the Role**
  Following a statutory review of Personal Identity Protocol 7.2, the Department has adopted a reductionist framework wherein moral responsibility supervenes on Psychological Connectedness (C) and Continuity (R), rather than strict identity. Offender #8940 currently scores 0.35 on the Weighted Continuity Index (WCI), falling below the liability threshold of 0.40. Consequently, the Department requires a surrogate to serve the remaining 48-month term. The successful candidate will undergo incarceration not as the offender, but as a psychologically continuous proxy.

  **Essential Criteria**
  *   Applicants must demonstrate a WCI score of ≥ 0.40 relative to Offender #8940's pre-offence person-stage.
  *   The WCI weighting is fixed at 60% Connectedness (memory/character) and 40% Continuity (overlapping chains).
  *   Applicants must acknowledge that identity is not what matters; only the relation R matters.
  *   **Branching Protocol:** In events of fission (e.g., multiple applicants clearing the threshold via memory transplantation), the candidate with the highest WCI score is preferred. Where scores are identical, priority is assigned to the earliest application timestamp. Rejected candidates in branching scenarios may appeal to the Metaphysical Review Board within 14 days, provided grounds for appeal do not rely on non-reductionist intuitions.
  *   **Original Offender Eligibility:** Please note that the original offender is ineligible for this post. If their WCI is below 0.40, they are not responsible for the crime; if above, they serve their own sentence. A repentant offender whose reform has reduced their WCI below 0.40 is therefore simultaneously exempt from liability and unqualified for this vacancy.

  **Remuneration and Benefits**
  *   Salary aligned with Prisoner Grade C4 (non-voluntary sector rates do not apply).
  *   Full board and lodging.
  *   Access to rehabilitative psychology services (note: services aimed at increasing continuity with the offender are mandatory; services aimed at increasing continuity with your pre-incarceration self are discouraged).

  **Safeguarding and Identity Drift**
  The Department cannot guarantee that the successful candidate will maintain sufficient psychological connectedness with their own intake person-stage to be considered the "same person" upon release. Natural psychological drift over 48 months may result in an exit WCI < 0.40 relative to the entry stage. This is an accepted occupational hazard. The Department accepts no liability for existential dissolution, provided statutory sentence requirements are met by the resulting person-stage.

  **How to Apply**
  Submit Form ID-R via the portal. Include neural mapping consent.

  **Equal Opportunities Statement**
  The Department is an equal opportunities employer committed to fairness for all persons. We welcome applications from all individuals regardless of their temporal extent, believing that every persistent self deserves equal consideration under the law.

  ***

  **Metaphysical Note**
  I adopted a **Stage-Theoretic** reading of reductionism, treating persons as momentary person-stages linked by Relation R. This sharpens the satire by making the bureaucratic substitution literal: one stage is hired to punish itself based on links to a past stage. The load-bearing inconsistency lies in the Equal Opportunities statement, which promises fairness to "persistent selves" and "individuals," contradicting the ad's core metaphysical claim that such entities do not exist. I took liberties with the "branching" appeal process, assuming a government board could adjudicate fission cases without collapsing into paradox, to highlight the absurdity of administering metaphysics via policy.
