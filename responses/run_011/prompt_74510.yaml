answer: |-
  # DISPOSITION VALIDITY PROTOCOL (DVP)
  **Purpose:** To determine if a qualification test plan actually validates a counterfactual claim (e.g., "Part X *will* do Y under Condition Z") rather than merely recording what happened in the fixture.
  **Runtime:** ~4 Hours per Plan.
  **Audience:** Test Engineers / Reliability Leads.
  **Authority:** This procedure does not accept risk. It identifies logical gaps. Risk acceptance is a separate management decision.

  ---

  ## PART 1: THE REVIEW PROCEDURE

  ### STEP 1: CLAIM TRIANGULATION
  **Objective:** Decompose the datasheet sentence into three testable variables. A disposition claim is invalid if any of these three are vague.
  **Action:** Write down the following three definitions based *only* on the datasheet claim, not the test plan.
  1.  **Stimulus (S):** The exact condition that triggers the response (e.g., "4 mm breach," "150°C," "pH 4").
  2.  **Manifestation (M):** The exact observable response (e.g., "Sealant fills breach," "Circuit opens," "Mass loss < 1mg").
  3.  **Causal Basis (B):** The physical property inside the part that *causes* M when S occurs (e.g., "Viscoelastic flow of polymer," "Melting of solder alloy," "Passivation layer stability").

  *   **Evidence Required:** The specific sentence from the datasheet or specification.
  *   **Probe if Unclear:** If "B" cannot be named (e.g., "it just works"), the claim is not a disposition; it is a black-box promise. **Stop.** The plan cannot be validated.
  *   **Verdict Condition:** If S, M, or B cannot be defined physically, the plan **FAILS** to license the claim.
  *   **[JUDGMENT]:** Defining "B" often requires engineering inference (e.g., is the basis the coating or the substrate?). This procedure accepts the engineer's definition but holds the test to it.

  ### STEP 2: STIMULUS PURITY (CHECK FOR "BASIS DESTRUCTION")
  **Objective:** Ensure the test stimulus does not remove or alter the Causal Basis (B) before the Manifestation (M) can occur. (Philosophers call this a "Fink.")
  **Action:** Trace the timeline of the test. Does the application of S, or the fixture's reaction to S, destroy B?
  *   **Question:** Does the fixture or preconditioning remove the very mechanism we are testing?
  *   **Evidence Required:** A timeline diagram showing when S is applied vs. when B is altered.
  *   **Probe if Unclear:** Add a "Basis Health Check" mid-test. (e.g., Pause the corrosion bath and measure coating thickness *during* exposure, not just after).
  *   **Verdict Condition:** If S destroys B before M can happen, the plan **FAILS**. (Example: A circuit breaker test that cuts power before the breaker trips tests the sensor, not the breaker).
  *   **[RISK ACCEPTANCE]:** If the stimulus *must* destroy the part to measure the limit (destructive testing), this step is passed only if the destruction happens *after* M is confirmed.

  ### STEP 3: MANIFESTATION FREEDOM (CHECK FOR "BLOCKING")
  **Objective:** Ensure nothing in the fixture prevents M from happening, even if B is present and S is applied. (Philosophers call this a "Mask.")
  **Action:** Review the fixture, protection circuits, and environmental controls.
  *   **Question:** Is there a secondary system (safety interlock, buffer, inhibitor, backup) that prevents M from occurring even if the part is defective?
  *   **Evidence Required:** Schematics of protection circuits or chemical analysis of the test medium.
  *   **Probe if Unclear:** Run a "Sabotage Test." Intentionally use a known-bad part (or disable the part's mechanism). If the test still records a "Pass," the fixture is masking the failure.
  *   **Verdict Condition:** If a known-bad part passes the test, the plan **FAILS**.
  *   **[JUDGMENT]:** Determining if a blocking mechanism is "negligible" is a judgment call. This procedure requires quantitative proof of negligibility (e.g., "Inhibitor concentration is <1% of service level").

  ### STEP 4: CAUSAL ISOLATION (CHECK FOR "MIMICS")
  **Objective:** Ensure M is caused by B, not by the rig. (Philosophers call this a "Mimic.")
  **Action:** Analyze the energy source driving M.
  *   **Question:** If the part had *no* Causal Basis (B), would the fixture still produce the Manifestation (M)?
  *   **Evidence Required:** Energy balance calculation or control group data.
  *   **Probe if Unclear:** Test a "Null Sample" (a part with B removed or inert). If the Null Sample produces M, the rig is causing the result.
  *   **Verdict Condition:** If the rig can produce M without B, the plan **FAILS**.
  *   **[JUDGMENT]:** Distinguishing between "Rig assists Part" vs. "Rig replaces Part" requires engineering judgment on force/energy contribution.

  ### STEP 5: BASIS RETENTION (THE "INTRINSIC" CHECK)
  **Objective:** Verify that the Causal Basis (B) inside the tested part is the same as the Causal Basis in a service part. This is the translation of "intrinsic disposition."
  **Action:** You must prove the test did not alter B in a way that service would not.
  *   **Question:** Did the test preconditioning or fixture interaction alter the material state (B) such that the test result applies only to the *tested* coupon, not the *service* part?
  *   **Evidence Required:** **Pre-Test and Post-Test Mechanism Audit.**
      *   *Measurement:* Quantitative measurement of B before test (e.g., grain size, viscosity, chemical composition).
      *   *Comparison:* Quantitative measurement of B after test (via sectioning, NDI, or chemical residue analysis).
      *   *Correlation:* Proof that the shift in B during testing matches the shift in B during service (or is conservative).
  *   **Probe if Unclear:** Add metallography, spectroscopy, or rheology to the test plan. You cannot validate a disposition without measuring the mechanism.
  *   **Verdict Condition:** If B is not measured before and after, or if the change in B during testing is uncorrelated to service aging, the plan **FAILS**.
  *   **[RISK ACCEPTANCE]:** If B is a legacy formulation (unknown chemistry), this step cannot be completed. The plan **FAILS** by default unless a "Performance Correlation" (field data vs. test data) is substituted.

