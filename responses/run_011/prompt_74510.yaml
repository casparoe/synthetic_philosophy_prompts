  ## PART 3: PROCEDURE LIMITATIONS

  You asked for the honest failure modes of this procedure. It cannot do the following:

  **1. It cannot prove the absence of a disposition.**
  A passing test shows that the Manifestation did *not* occur under those conditions. It does not prove the part *lacks* the disposition to fail under slightly different conditions.
  *   *Example:* A liner passes the re-test. This proves it sealed *then*. It does not prove it will seal *always*. Statistics handle the "always"; this procedure only handles the "why."
  *   *Constraint:* You must still use statistical confidence intervals on the sample size. This procedure only validates that the *test method* is capable of detecting the failure if it were present.

  **2. It cannot operate on an unknown Causal Basis.**
  Step 1 and Step 5 require you to name and measure the "Basis" (the physical mechanism).
  *   *Example:* You mentioned legacy coatings nobody fully understands. If you cannot define "B" (e.g., "chromate conversion layer thickness"), you cannot check if the test altered "B".
  *   *Constraint:* For legacy parts, this procedure will return a **FAIL** on Step 1 or 5. The only workaround is "Performance Correlation" (proving that parts passing this test have never failed in 20 years of service). If you lack field data, you cannot license the claim. You must either reverse-engineer the Basis or accept the risk.

  **3. It cannot make Risk Acceptance decisions.**
  This procedure identifies logical gaps (e.g., "The rig masks the failure"). It does not decide if that gap is tolerable.
  *   *Decision Point:* If the Battery Cutoff test fails Step 2, engineering *could* argue "The board is reliable enough that the cutoff never needs to act." That is a risk argument, not a validity argument. This procedure forces you to label that decision as **RISK ACCEPTANCE** rather than hiding it behind a "Pass" verdict.

