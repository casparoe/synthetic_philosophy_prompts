      (Scene 1)
      The booth was soundproofed, lined with beige acoustic foam that swallowed the hum of the HVAC, leaving only the scratch of her pen and the clink of the expectorant cup. Code STR-259 sat in the well, a viscous red fluid that smelled of cooked sugar and something sharper, like heated plastic. For twenty-five years, this control lot had been the anchor of the grocery line, the baseline against which every production run was measured. She took a sip, swirled it over the tongue, and waited for the profile to bloom. In year one, this moment had been a rush of ester-heavy brightness, a jammy core that settled into a creamy vanillic finish. Now, the mid-palate collapsed. The jam was thin, and the finish carried a distinct phenolic bite, a chemical edge that lingered past the rinse. She marked the card: *Thin. Phenolic off-note.* Across the table, the junior panelists were already logging their scores, their faces neutral. Their consensus sheet would come back green across the board, matching the historical average. They tasted the memory of the product, or perhaps they tasted the specification, but they did not taste the bite. Management needed her signature on the cost-reduced variant by Friday, requiring a statement that the new blend was organoleptically identical to this legacy control. She capped the pen, knowing she could not sign a lie, yet unsure if the lie was in the formula or in the roof of her mouth.

      (Scene 2)
      The GC-MS report arrived on Tuesday, a stack of chromatograms pinned to a clipboard by the lab technician who looked relieved to deliver good news. The peaks aligned perfectly with the archived data from the previous quarter, and the quarter before that, stretching back in a digital lineage that predated her tenure. The ratio of ethyl methylphenylglycidate to the furanones was stable within standard deviation; there was no drift in the volatile organic compounds that would explain a shift in profile. The technician tapped the overlay, showing her the identical spikes on the screen, proving the chemistry was static. For a moment, the data offered a solid floor, a promise that the liquid in the bottle was constant and the variable was elsewhere. But the comfort evaporated as she stared at the jagged lines. The machine measured volatility and mass, not the collision of molecules with receptor sites, nor the signal processing that happened behind the eyes. The report confirmed the bottle hadn't changed, but it remained silent on whether the nose reading the bottle was the same one that had opened it in 1999. The science solved the material question and left the human one hanging in the air, unaddressed and heavier than before.

      (Scene 3)
      Eric from Sensory Sciences cornered her by the coffee machine, holding a printout of the latest triangle test results where she had correctly identified the odd sample out every single time. He argued that her discrimination threshold was intact, perhaps even sharper than the juniors, proving her hardware was functional. If she could consistently pick the legacy formula from two reformulated samples, then her ability to detect difference was not the issue; the issue was the valuation laid on top of that detection. He suggested that her standard for acceptable quality had drifted upward over two decades, turning a neutral baseline into a defect through sheer accretion of expectation. You still taste the strawberry, he said, you just decide it isn't good enough anymore. She wanted to argue that the chemical note was an intrusion, not a judgment, but she couldn't locate the boundary where the sensation ended and the opinion began. The data showed she could distinguish the samples, but it couldn't show whether the difference was in the liquid or in the weight she assigned to the difference. She took her coffee and walked away without conceding, but without a counter-argument that didn't sound like special pleading.

      (Scene 4)
      She pulled the archive box from the bottom shelf of her office cabinet, the cardboard soft with age, and unfolded the quarterly control cards from Year One. Her handwriting from 1999 was loopier, less guarded, written in blue ink that had faded to a soft gray. On the card for Q3, she had described the finish as *bright and slightly synthetic*, using the word synthetic as a compliment to the intensity of the top note. The same note she now circled as *chemical* and *defect* was there in her own hand, celebrated as a feature of the profile. She traced the letters, looking for a shift in tone, a hint of irony, or a change in pressure that might indicate she was a different person then. There was nothing. The paper felt the same, the ink smelled the same, and the words sat on the page with the same authority. Knowing she had once loved the note did not help her love it now, nor did it prove the note had changed. The evidence confirmed the drift in vocabulary but offered no traction for deciding whether the drift was a correction or a decay. She stacked the cards back into the box and slid it into the dark, the history preserving the contradiction without resolving it.

      (Scene 5)
      On Friday morning, she sat at her desk with the reformulation approval form and the legacy control card side by side. The sun hit the laminate of the desk, warming the surface where she rested her hands, and the office hummed with the pre-weekend rush of shipments and invoices. She picked up the pen and filled out the legacy control card first, writing *Thin* and *Phenolic* in the designated boxes, signing her name with the steady flourish she had used for twenty-five years. Then she moved to the reformulation approval, leaving the signature line blank, and instead wrote a request for a third-party panel review in the notes section. It was a delay, not a decision, an action that both hypotheses supported equally. If her taste had changed, the product needed verification against a neutral baseline; if her standard had changed, the product needed verification against a neutral baseline. The pen clicked off, and she placed it on the desk, the problem sitting in the paper stack exactly where it had been when she arrived, waiting for the next quarter to begin.

