  Eric from Sensory Sciences cornered her by the coffee machine, holding a printout of the latest triangle test results where she had correctly identified the odd sample out every single time. He argued that her discrimination threshold was intact, perhaps even sharper than the juniors, proving her hardware was functional. If she could consistently pick the legacy formula from two reformulated samples, then her ability to detect difference was not the issue; the issue was the valuation laid on top of that detection. He suggested that her standard for acceptable quality had drifted upward over two decades, turning a neutral baseline into a defect through sheer accretion of expectation. You still taste the strawberry, he said, you just decide it isn't good enough anymore, conflating the sensation with the verdict. She wanted to argue that the chemical note was an intrusion, not a judgment, but she couldn't locate the boundary where the sensation ended and the opinion began. The data showed she could distinguish the samples, but it couldn't show whether the difference was in the liquid or in the weight she assigned to the difference. She took her coffee and walked away without conceding, but without a counter-argument that didn't sound like special pleading, the logic of the test closing around her like a trap.

  4
  She pulled the archive box from the bottom shelf of her office cabinet, the cardboard soft with age, and unfolded the quarterly control cards from Year One. Her handwriting from 1999 was loopier, less guarded, written in blue ink that had faded to a soft gray. On the card for Q3, she had described the finish as *bright and slightly synthetic*, using the word synthetic as a compliment to the intensity of the top note. The same note she now circled as *chemical* and *defect* was there in her own hand, celebrated as a feature of the profile. She traced the letters, looking for a shift in tone, a hint of irony, or a change in pressure that might indicate she was a different person then. There was nothing. The paper felt the same, the ink smelled the same, and the words sat on the page with the same authority. Knowing she had once loved the note did not help her love it now, nor did it prove the note had changed. The evidence confirmed the drift in vocabulary but offered no traction for deciding whether the drift was a correction or a decay. She stacked the cards back into the box and slid it into the dark, the history preserving the contradiction without resolving it, leaving her alone with the text.

  5
  On Friday morning, she sat at her desk with the reformulation approval form and the legacy control card side by side. The sun hit the laminate of the desk, warming the surface where she rested her hands, and the office hummed with the pre-weekend rush of shipments and invoices. She picked up the pen and filled out the legacy control card first, writing *Thin* and *Phenolic* in the designated boxes, signing her name with the steady flourish she had used for twenty-five years. Then she moved to the reformulation approval, leaving the signature line blank, and instead wrote a request for a third-party panel review in the notes section. It was a delay, not a decision, an action that both hypotheses supported equally. If her taste had changed, the product needed verification against a neutral baseline; if her standard had changed, the product needed verification against a neutral baseline. The ink flowed black and wet, catching the light before settling into the fiber of the paper. She watched the letters form, knowing they were true to her current state, regardless of why that state existed. The pen clicked off, and she placed it on the desk, the problem sitting in the paper stack exactly where it had been when she arrived, waiting for the next quarter to begin.
