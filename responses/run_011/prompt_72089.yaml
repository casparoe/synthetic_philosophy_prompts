answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION: METAPHYSICS OF LAWS**
  **Participants:** Humean (Best Systems Account) vs. Governing (Dretske–Armstrong–Tooley Universals)

  ### 1. Substantive Agreements
  *We affirm the following claims, each of which might ordinarily be assumed to be points of contention between our views.*

  1.  **Epistemic Privilege of Systematization:** Both sides agree that the *Best Systems* methodology is the correct epistemic route to identifying laws. Even though the Governing side denies that laws are *constituted* by the best system, we agree that rational agents must infer laws by finding the optimal balance of simplicity and strength in the empirical mosaic. The Humean treats this as constitutive; the Governing side treats it as the reliable indicator of the underlying necessitation relations between universals.
  2.  **The Modal Gap:** Both sides agree that the distinction between a law of nature and a merely accidental universal generalization (e.g., "all gold spheres are under a mile in radius") is not reducible to the quantificational scope of the generalization. Both sides owe an account of what *grounds* this modal force, agreeing that mere truth across all actual instances is insufficient.
  3.  **Explanation Requires Nomic Connection:** Both sides agree that scientific explanation is not merely subsumption under a regularity. To explain an event is to show how it was constrained by the laws. We disagree on the direction of this constraint (see Section 2), but agree that a world without this constraint would lack the explanatory structure actual science presupposes.
  4.  **Chance-Credence Alignment:** Both sides agree that objective chance must constrain rational credence (adhering to a Principle Principle). A metaphysics of law that renders chance epistemically inaccessible or rationally inert is unacceptable to both parties.

  ### 2. Live Disagreements

  | Claim | Humean Wording | Governing Wording | Why Not Merely Verbal | Concessions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Direction of Fit** | The Humean mosaic (particular matters of fact) ontologically grounds the laws. Laws supervene on the distribution of local qualities. | Laws (relations between universals) ontologically ground/constrain the mosaic. The distribution of qualities holds *because* of the laws. | This reverses the order of metaphysical explanation. If the mosaic were different in a specific way, the Humean says laws change; the Governing side says the world becomes nomologically impossible. | **Humean:** Admits this makes laws dependent on the totality of history, including the future. <br> **Governing:** Admits this requires primitives (universals/necessitation) that are not reducible to categorical properties. |
  | **Status of "Govern"** | "Governance" is a metaphor for the role laws play in our best systematization. Laws do not literally act on matter. | "Governance" is literal (though not agential). Laws are active principles that restrict which physical histories are possible. | **Partly Verbal:** We agree "govern" does not imply agency. <br> **Substantive Remainder:** Whether there is a "because" relation running from Law to Event (Governing) or Event to Law (Humean). | **Both:** Agree that if "govern" implies agency, both views are false. The substantive dispute is about grounding direction. |
  | **Locality & Simplicity** | Simplicity metrics must include a penalty for non-local axioms to prevent "Copycat" systems. This is a pragmatic constraint on theory choice. | Locality is a mind-independent feature of the necessitation relation. Universals relate locally; non-local correlations are never laws, regardless of simplicity. | For the Humean, locality is a parameter in a pragmatic metric. For the Governing view, locality is a necessary feature of the relation N(F,G). | **Humean:** Admits that adding a locality penalty moves "simplicity" away from pure syntactic compression toward tracking mind-independent structure. |

  ### 3. Cruxes and Pre-Registered Predictions

  **Crux 1: The Copycat World**
  *Case:* Two spacelike separated regions, A and B, each contain $10^{20}$ decays of an unstable particle. In A, outcomes form a fair coin sequence. In B, outcomes form a fair-looking sequence that is exactly A's sequence shifted by one position. This is produced by two independent chance processes plus an unimaginably improbable fluke.
  *Threat:* The system "A is chancy; B is A shifted by one" is shorter (eliminates B's chance axioms) and stronger (determines B given A) than "A and B are independent chancy processes."

  *   **Humean Prediction:** If we formalize "simplicity" as pure syntactic compression without a built-in locality constraint, the Copycat system **wins**, implying B's events are nomologically determined by A. To save the intuition that these are independent laws, we **must** build a locality constraint into the BSA metric.
      *   *Embarrassment Condition:* If it turns out the Copycat system does *not* win on pure compression metrics, our motivation for the locality repair is undermined. If we *cannot* motivate the locality constraint pragmatically, we concede that BSA secretly relies on mind-independent structural realism.
  *   **Governing Prediction:** The Copycat system is **nomologically impossible**, regardless of its simplicity. The relation N(F,G) cannot hold between distinct spacelike universals in a way that generates this correlation without a mediating causal chain. The fluke remains a fluke, never a law.
      *   *Embarrassment Condition:* If science eventually accepts a non-local deterministic link between A and B as a law (e.g., via entanglement-like mechanisms that fit the Copycat profile), the Governing view must either accept action-at-a-distance as nomologically primitive or deny the lawhood of the accepted theory.

  **Crux 2: Uninstantiated Laws (Tooley's Case)**
  *Case:* A universe contains only particles of types F and G, which never interact. However, there is a law governing what *would* happen if an F met a G.
  *   **Humean Prediction:** There is **no fact of the matter** about the law in this universe. Without instances, there is no pattern to systematize. Any claim about F-G interaction is undefined.
      *   *Embarrassment Condition:* If physicists claim to discover a law about F-G interaction in such a universe (e.g., via symmetry arguments alone) and are rational to do so, the Humean account of law is epistemically insufficient.
  *   **Governing Prediction:** There **is a fact of the matter**. The relation N(F,G) exists even if no F and G ever instantiate it.
      *   *Embarrassment Condition:* If it turns out that all claims about uninstantiated interactions are merely projections of our best theories about *other* particles, and never distinct truths, the Governing view posits occult entities.

