prompt: |-
  I'm co-running an adversarial collaboration for our department's metaphysics workshop and I'm the Humean side — best-systems account, chance entering the system in the usual Lewisian way. My counterpart is a governing-laws person of the universals/necessitation stripe (the Dretske–Armstrong–Tooley family, deliberately *not* the Maudlin-style "laws are primitive, full stop" version; I want a view that at least has truth-conditions to argue with). We've been told to hand in a joint statement, and I want a first pass I can red-pen.

  Structure it as (1) a numbered list of claims we can both sign, (2) a table of the live disagreements, (3) the cruxes with pre-registered predictions. Section 1 can't be allowed to collapse into stuff like "both sides agree laws matter to science" — every agreed claim should be one an outsider would have bet was contested. I specifically want to see whether we can both sign something about best-system reasoning being our best *epistemic* route to the laws even though only one of us thinks laws are constituted by it, and something about what each of us separately owes on the gap between a law and a merely accidental universal generalisation (the all-gold-spheres-under-a-mile sort of case).

  Table columns: the claim, my wording, their wording, why the difference isn't just verbal, and what each side concedes the other's formulation gets right. If you think part of the dispute *is* verbal — I suspect "govern" — say which part, and say what's left standing once the words are fixed. Also make sure the explanation-direction complaint (laws are supposed to explain the mosaic, but on my view the mosaic explains the laws) shows up somewhere, either as an agreed claim about what needs explaining or as a crux in its own right.

  For each crux: a case or argument both sides agree bears on it, plus each side's prediction written down in advance, in a form that would be embarassing if it came out wrong.

  One crux should be the case I've been pushing in seminar — call it the Copycat World. Two spatially seperated regions, A and B, each containing 10^20 decays of the same kind of unstable particle. In A the outcomes form a fair coin sequence. In B they also form a fair-looking coin sequence — but they are exactly A's sequence shifted by one position. Nobody arranged this; the generating story is two genuinely independent chance processes plus an unimaginably improbable fluke. Trouble is, the competitor system "A runs on fair chances, B is A shifted by one" is short and extremely strong — it derives all of B from A — so it looks like it beats "two independent fair processes" and makes region B's laws deterministic and wildly non-local. My opponent says this shows the best system can't track what makes a law a law; I think there's a repair. So do the bookkeeping honestly: does the copycat system actually win on simplicity and strength as Lewis construes them, or does it lose? If the case is broken as stated, fix it and tell me which way the fixed version cuts. And if the repair has to be a locality constraint smuggled into the simplicity metric, be explicit about what that costs me — the metric was supposed to track our pragmatic standards, not mind-independent structure, and if it's doing the latter I may have conceded the metaphysics already.

  Call it 1,200–1,800 words. Write it as a document both of us could genuinely sign: no strawmen, and no disagreement so vaguely worded that either side could disown it later.
