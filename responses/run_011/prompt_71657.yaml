answer: |-
  ### Q&A Prep Sheet: Maimonides on Sacrifice & Legislative Accommodation

  **The Stakes:** You are arguing that Maimonides' view of sacrifice is a *jurisprudential* category (non-ideal law) rather than a *historical* anomaly (primitive concession). Your risk is being caught between historians who say "the text says concession" and philosophers who say "non-ideal law compromises divine perfection."

  ---

  ### The Eight Objections (Ordered by Damage Potential)

  **1. The "Esoteric Belief" Trap (Respondent)**
  *   **Phrasing:** "You've given us a beautiful legal theory, but you haven't told us what Maimonides *believed*. If the Guide suggests sacrifice is a primitive fallback and the Code mandates it forever, are you claiming Maimonides was confused? Or are you claiming the Code is also exoteric? If the Messianic era is the redemption, why would God restore a 'second-best' cult?"
  *   **2-Minute Reply:** "I'm bracketing psychoanalysis to focus on legal coherence. But to answer directly: Maimonides believes the *Torah* is eternal. If the Torah mandates sacrifice, sacrifice is eternally valid, even if it isn't the *highest* form of worship. Belief isn't binary. He can believe sacrifice is lower than contemplation while simultaneously believing it is divinely willed law. The Messianic restoration isn't about achieving the philosophical ideal; it's about the restoration of Sovereignty and Law. The Temple returns because the Law returns, not because blood is suddenly superior to prayer."
  *   **Soft Spot:** Maimonides' description of the Messianic era is notoriously sparse on cultic detail. If you press him on whether *intellectual* worship replaces *ritual* worship then, you might wobble.

  **2. The "Plain Text" Hammer (Historians)**
  *   **Phrasing:** "Guide III:32 is explicit. Maimonides says God *did not* desire these offerings and only commanded them because of the 'custom of the time.' You're using 'non-ideal theory' to sanitize a text that is explicitly historicist. You're imposing a modern jurisprudential category to save Maimonides from saying what he clearly says: this was a temporary fix for a primitive people."
  *   **2-Minute Reply:** "He says it was a historical necessity, yes. But he also codifies it as binding law for all generations in the *Mishneh Torah*. If it were merely a historical fix, it should have sunsetted. My argument is that Maimonides uses the historical explanation to explain the *origin*, but the legal codification explains the *status*. A law can have a historical etiology and still be a permanent, binding accommodation. The 'custom of the time' explains why we started; the legal structure explains why we stay."
  *   **Soft Spot:** Maimonides does use language like "divine wisdom did not require" which sounds teleological, not just jurisprudential. You have to hold the line that 'wisdom' includes managing human psychology permanently.

  **3. The "Divine Will" Problem (Philosophers)**
  *   **Phrasing:** "If these commandments are 'second-best,' does God actually will them? If God accommodates human brokenness, is He endorsing the brokenness? If the ideal is prayer and we do blood, are we doing God's will or just managing our own limitations? This risks making God a utilitarian rather than a commander."
  *   **2-Minute Reply:** "Non-ideal theory doesn't mean God wills the sin; it means God wills the *response* to the sin. A parent wills the training wheels, not the wobbly legs. The commandment *is* the will of God for the creature as it currently exists. It's not utilitarian management; it's pedagogical realism. The 'will' is the engagement with the human being, not just the abstract ideal."
  *   **Soft Spot:** This leans heavily on analogy. If they press on Divine Simplicity or Immutability (God doesn't change plans based on human capacity), you need to be careful not to make God reactive.

  **4. The Ramban "Stagecraft" Charge (Everyone)**
  *   **Phrasing:** "Ramban says on your view the Temple is just divine theater. If the real goal is prayer, but we're slaughtering animals, isn't the slaughter just a prop? How is this not insincere? How is 'accommodation' different from 'pretend'?"
  *   **2-Minute Reply:** "Stagecraft implies the action has no intrinsic value. Accommodation implies the action has *derived* value. It's the difference between a prop gun and a training weight. The training weight isn't the final competition barbell, but lifting it is real work that builds real muscle. The sacrifice is real obedience, real discipline, and real submission. It's not a prop; it's a scaffold. You don't call a scaffold 'fake' just because you take it down when the building stands."
  *   **Soft Spot:** Maimonides does suggest the *purpose* is weaning. If the purpose is to eventually outgrow it, the scaffold analogy is strained.

  **5. The "Genre Separation" Objection (Historians)**
  *   **Phrasing:** "You're harmonizing the *Guide* and the *Code*. We've spent forty years learning not to do that. The *Guide* is for the perplexed elite; the *Code* is for communal practice. You can't read the jurisprudence of one through the metaphysics of the other."
  *   **2-Minute Reply:** "I'm not harmonizing the *audiences*; I'm harmonizing the *lawgiver*. It's the same Moses. If the *Code* mandates a law, it must be legally coherent, regardless of who reads the *Guide*. I'm not using the *Guide* to explain the *Code*; I'm using the *Guide* to explain why the *Code* looks the way it does. The legal structure stands on its own."
  *   **Soft Spot:** Historians hate this. They will insist the *Guide* is occasional literature, not a legal key.

  **6. The "Slippery Slope" (Philosophers)**
  *   **Phrasing:** "If sacrifice is non-ideal accommodation, what else is? Kashrut? Sabbath? If God accommodates human weakness here, how do we know any commandment is the 'ideal' will? Does this dissolve the binding nature of the whole law?"
  *   **2-Minute Reply:** "Maimonides is specific. He cites Jeremiah to mark sacrifice as unique. God explicitly contrasts sacrifice with the 'ideal' of hearing His voice. Most other commandments *are* the ideal for human flourishing (ethical and ritual). Sacrifice is the outlier because it involves destruction of life. We don't generalize non-ideal theory; we apply it where the text explicitly signals a gap between the act and the divine desire."
  *   **Soft Spot:** Maimonides gives 'idolatry-avoidance' reasons for many laws. If those are also accommodations, your distinction blurs.

  **7. The "Political Realism" Attack (Grad Students)**
  *   **Phrasing:** "Isn't this just political realism? Maimonides knows he can't abolish the priesthood, so he writes a theory to keep them employed. You're dressing up political necessity as divine pedagogy."
  *   **2-Minute Reply:** "In Maimonides' worldview, political stability *is* divine pedagogy. You can't have prophecy without a stable polity. Maintaining the cult maintains the social order that allows for the possibility of truth. It's not 'just' politics; it's the precondition for religion."
  *   **Soft Spot:** Sounds cynical. Risks reducing the *Mishneh Torah* to a political treatise.

  **8. The "Sincerity" Check (Respondent)**
  *   **Phrasing:** "If I stand in the Temple knowing this is 'second-best,' am I serving God with a whole heart? Or am I always looking over my shoulder at the 'ideal' I'm not doing? Doesn't this create a split religious consciousness?"
  *   **2-Minute Reply:** "Jewish law is often about doing the possible, not the impossible. The 'whole heart' is in the obedience to the current command, not in fantasizing about a higher one. Knowing the law is accommodated *is* part of the humility required to serve. It stops me from thinking *I* am the ideal."
  *   **Soft Spot:** Hard to square with the demand for *kavanah* (intention).

  ---

  ### Concessions to Make in the First 5 Minutes
  *Buy goodwill by showing you aren't ignoring the obvious problems.*

  1.  **Admit the Textual Tension:** Explicitly state: "I am not denying that Maimonides uses historicist language in the *Guide*. He absolutely calls it a concession there. My argument is about how that concession functions *legally* in the *Code*."
  2.  **Admit the Hierarchy:** Concede that for Maimonides, intellectual contemplation *is* higher than ritual action. You aren't arguing sacrifice is the *peak* of religion, only that it is *valid* religion.
  3.  **Admit the Esoteric Possibility:** Tell the Respondent: "I know the esoteric reading suggests Maimonides wanted sacrifice to vanish. I am arguing that even if that were his private hope, his public legal theory treats it as permanent."

  ---

  ### The Single Reply That Must Land
  **The Distinction Between "Abolition" and "Accommodation."**

  If the room thinks "Accommodation = Temporary," you lose. You must hammer this home:
  *"A concession does not mean a timeout. It means a different mode of engagement. When a teacher speaks to a child, they use simpler language. That language is not 'fake,' and the teacher does not intend to stop speaking to the child once they grow up; they intend to speak *differently*. But until then, the simple language is the only real language there is. Maimonides is arguing that for a embodied, political human being, blood and fire are the 'simple language' of submission. It is not a placeholder for nothing; it is the only way this creature can speak."*

  If you convince them that **accommodation is a stable legal category** rather than a **historical waiting room**, the Ramban charge dissolves.

  ---

  ### The Question You Are Praying Nobody Asks
  **"If the Messianic Era is the perfection of the world, and Maimonides says sacrifices return in the Messianic Era, does that mean the 'Ideal' (prayer/contemplation) is insufficient for perfection? Or does it mean the Messianic Era is also non-ideal?"**

  *Why this kills you:*
  *   If you say the Messianic Era is non-ideal, you undermine the redemption.
  *   If you say the Ideal is insufficient, you contradict the *Guide's* hierarchy of worship.
  *   If you say sacrifices *don't* return in the Messianic Era, you contradict the *Code's* laws of Kings.
  *   *Preparation:* Have a ready answer about the Messianic era being the restoration of *Sovereignty*, not necessarily the abolition of *Corporeality*. We are still human, even then.
