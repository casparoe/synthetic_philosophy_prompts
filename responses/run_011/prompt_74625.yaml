answer: |-
  This is a sharp observation, and you are right to feel that the standard fallacy labels don't quite stick. You have identified a specific methodological pathology that sits at the intersection of the philosophy of science, statistics, and historiography.

  There is no single, universally recognized "pop-sci" name for this specific dynamic (like "Sunk Cost" or "Gambler's Fallacy"), but there are established terms in specialized literature that describe its components.

  ### The Existing Terminology

  **1. The Philosophical Term: "Immunizing Stratagem"**
  In the philosophy of science (specifically Critical Rationalism), Hans Albert coined the term **Immunizing Stratagem** (*Immunisierungsstrategie*). This describes when a theorist protects a hypothesis from falsification not by engaging with the counter-evidence, but by adding auxiliary assumptions that exclude the counter-evidence.
  *   **Why it fits:** Your colleague isn't changing the claim ("fisheries collapse in 30 years"); they are adding a protective belt of conditions ("unless the upwelling is different," "unless the assessment method varies") that renders the claim unfalsifiable by the very data that should test it.
  *   **Related Concept:** Imre Lakatos called this adjusting the **"Protective Belt"** of a research programme to save the **"Hard Core."**

  **2. The Statistical Term: "Non-Independent Analysis" or "Double Dipping"**
  In neuroscience and statistics, this is often called **Circular Analysis** or **Double Dipping** (Kriegeskorte et al., 2009). This occurs when the same data is used both to select the subset (the "good" fisheries) and to test the hypothesis on that subset.
  *   **Why it fits:** The criteria for exclusion were derived *from* the outliers. By using the data to define the sample, you guarantee the sample fits the model.
  *   **The Confidence Error:** Statistically, as $N$ (sample size) decreases, your Confidence Interval should *widen* (uncertainty increases). In your examples, confidence *tightens* because the *variance within the remaining sample* decreases. They are confusing **goodness of fit** (how well the line hits the dots) with **predictive validity** (how well the line predicts new dots).

  **3. The Logical Term: "Ad Hoc Rescue"**
  This is the formal logical fallacy closest to your description. An *ad hoc* hypothesis is one created solely to explain away a specific anomaly without independent justification.
  *   **Why it fits:** The "upwelling regime" excuse might be scientifically valid, but if it was only invoked *after* seeing the 60-year fishery, it is an *ad hoc* rescue.

  ### Why "No True Scotsman" Feels Wrong (But Isn't)

  You are correct to dismiss **No True Scotsman** as unsatisfying, even though structurally it is identical.
  *   **Standard NTS:** Semantic. ("No *true* Scotsman eats sugar." Redefines "Scotsman".)
  *   **Your Case:** Empirical. ("No *comparable* fishery lasts 60 years." Redefines "Comparable".)

  The difference is **plausibility**. In NTS, the redefinition is usually arbitrary. In your examples, the exclusions are based on "real knowledge of the systems." This makes the fallacy much harder to spot and more dangerous. It is **"Empirical Scotsman"**—using genuine nuance to insulate a generalization from refutation.

  ### A Coinage: "The Fallacy of Retrospective Purity"

  If I were to coin a term for the specific dynamic where confidence rises as the sample shrinks, I would call it **The Fallacy of Retrospective Purity** (or **The Purity Paradox**).

  It captures the essence: the argument becomes "purer" (less variance, tighter fit) only by retrospectively scrubbing away the "impure" data points, creating an illusion of robustness that is actually fragility.

  ---

  ### The Line: Legitimate Narrowing vs. Symptomatic Carving

  You asked the most important question: *Where is the line?* Sometimes excluding data is good science (e.g., removing instrument errors). Sometimes it is sophistry. Here is how to distinguish them.

  **1. Pre-specification (The Gold Standard)**
  *   **Legitimate:** The exclusion criteria are defined *before* the data is analyzed. ("We will only compare fisheries with Type-A upwelling.")
  *   **Symptomatic:** The criteria are generated *after* the outlier is identified. ("This fishery doesn't fit? Oh, look, it has Type-B upwelling. Let's exclude Type-B.")
  *   **Test:** Ask: "If the 60-year fishery had collapsed in 25 years, would you still have excluded it based on the upwelling regime?" If the answer is "No," it's symptomatic carving.

  **2. Symmetry of Exclusion**
  *   **Legitimate:** The criterion excludes cases regardless of whether they support or contradict the hypothesis.
  *   **Symptomatic:** The criterion conveniently excludes only the counter-examples.
  *   **Test:** Apply the new rule to the *successful* predictions. Does the "tribute system" exclusion rule also exclude an empire that collapsed exactly on schedule? If the rule only prunes the survivors, it is biased.

  **3. Independence of Criterion**
  *   **Legitimate:** The exclusion variable is independent of the outcome variable.
  *   **Symptomatic:** The exclusion variable is correlated with the outcome.
  *   **Test:** In the history example, "continuity of administration" might be independent. But if "continuity" is defined by "did they survive the crisis?", it is tautological.

  **4. The Penalty of Degrees of Freedom**
  *   **Legitimate:** The analyst acknowledges that excluding data reduces statistical power and *lowers* confidence.
  *   **Symptomatic:** Confidence *increases* as the sample shrinks.
  *   **Test:** This is the smoking gun. In valid statistics, if you throw out 8 of 12 data points, your error bars must get bigger. If your colleague says, "I have fewer cases but I'm *more* sure," they are committing a statistical error. They have improved the *fit*, but destroyed the *inference*.

  ### When the Shrinking Itself is Evidence

  You asked: *"Is there a point where the shrinking itself counts as evidence against the forecast?"*

  **Yes.** If the only way to maintain the generalization is to continually narrow the reference class until it contains only the original case (or none), the generalization has been falsified.

  In philosophy of science, this is when a research programme becomes **"Degenerating."** (Lakatos again). A programme is degenerating when it spends more energy explaining away anomalies than predicting new facts.
  *   **The Signal:** When the "auxiliary assumptions" (the reasons for exclusion) become more complex than the theory itself.
  *   **The Limit:** If you reach a point where the rule is "All empires fall in X years, except the ones that don't, because they are unique," you have a tautology, not a theory.

  ### Summary for Your Book Group and Colleagues

  You can tell them this:
  1.  **Name:** It's an **Immunizing Stratagem** executed via **Post-hoc Exclusion Criteria**.
  2.  **The Error:** You are trading **External Validity** (does this apply to the world?) for **Internal Consistency** (do these remaining dots make a pretty line?).
  3.  **The Test:** "Would you have excluded this case if it had supported your prediction?"
  4.  **The Statistic:** "If you reduce the sample size, your confidence interval must widen. If it narrows, you are fitting noise, not finding signal."

  You are right to be suspicious. It is a sophisticated way of being wrong with confidence.
