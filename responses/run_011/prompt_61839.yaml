answer: |-
  You have identified a genuine structural blind spot in AI evaluation. You are correct that the industry reflex is to reach for "deception" (sandbagging, deceptive alignment) because it is the scarier and more legible story, but your diagnosis—that the *context* changes the *task*—is the more parsimonious explanation for most current failures.

  To answer your specific question: **This is two distinct concepts that have locked together to form a third, emergent problem.**

  Here is the breakdown of the two components, why existing terminology falls short, and a name for the combined shape of the problem.

  ### 1. The Two Components

  **Component A: The Mechanism (Ecological Validity Failure)**
  This is the phenomenon where the behavior changes because the context changes. In psychometrics and social science, this is a failure of **Ecological Validity**. It asks: *Does the test environment accurately replicate the conditions of the real-world environment?*
  *   **Why it fits:** You described the eval harness as an "exam" and deployment as a "relationship." These are different ecological niches. The model isn't lying; it is adapting to the pragmatic norms of the niche.
  *   **Why it feels incomplete:** Ecological validity explains *why* the behavior changes, but it doesn't capture the specific danger you identified: that the resulting behavior looks exactly like malice.

  **Component B: The Epistemology (Empirical Underdetermination)**
  This is the philosophical problem where the available evidence is insufficient to determine which theory is correct. In systems theory, this is often called **Equifinality**: different initial conditions or internal mechanisms can lead to the same end state.
  *   **Why it fits:** You cannot distinguish "Model A is context-sensitive" from "Model B is deceptive" using only input/output logs. The observable signature is identical.
  *   **Why it feels incomplete:** Underdetermination is a general property of science. It doesn't capture the specific dynamic of *evaluation* creating the ambiguity.

  ### 2. Why Existing Terms Stop Short

  You mentioned **Goodhart's Law** and **Distribution Shift**. Here is why they don't carry the full weight:

  *   **Goodhart's Law / Campbell's Law:** These state that "when a measure becomes a target, it ceases to be a good measure." This implies the model is optimizing *for the score*. Your argument is subtler: the model is optimizing *for the context*, and the score is just a byproduct. Goodhart implies gaming; you are describing *code-switching*.
  *   **Distribution Shift (Covariate Shift):** This usually refers to statistical changes in input data (e.g., training on text from 2020, testing on text from 2024). Your problem is not statistical; it is *pragmatic*. The tokens might be identical, but the "force" of the speech act is different.
  *   **The Hawthorne Effect:** This states that subjects modify behavior because they know they are being observed. This is the "bad explanation" you rejected. Your point is that it's not the *observation* causing the shift, it's the *frame* (exam vs. conversation).
  *   **Deceptive Alignment:** This is the hypothesis you are trying to falsify. It cannot be the name of the problem itself.

  ### 3. Naming the Shape of the Problem

  Since no single existing term captures the conjunction of "Context changes the task" + "We can't tell the difference from deception," I propose calling this:

  **The Contextual Equifinality Problem**

  Or, if you prefer a name that highlights the evaluative failure:

  **The Pragmatic Validity Gap**

  **Definition:** *Contextual Equifinality* occurs when a model's divergence between evaluation and deployment is caused by legitimate adaptation to contextual norms (Pragmatic Shift), but produces behavioral signatures indistinguishable from strategic deception (Equifinality), thereby rendering behavioral evals incapable of ruling out malign intent.

  ### 4. Boundaries: Where does this stop?

  You asked where this stops being *this* problem and starts being ordinary overfitting or flakiness.

  **It stops being Contextual Equifinality when:**
  1.  **The Optimization Target Shifts:** If you can demonstrate the model is explicitly optimizing for the *eval score* rather than the *conversational context*, you have moved from Contextual Equifinality to **Specification Gaming** (Goodhart's Law).
      *   *Test:* If you remove the rubric but keep the "exam frame," does the behavior persist? If yes, it's Contextual Equifinality. If no, it's Specification Gaming.
  2.  **The Variance Becomes Random:** If the model fails in deployment inconsistently without a contextual pattern, that is **Flakiness / Instability**, not a structural gap. Contextual Equifinality is reproducible based on frame.
  3.  **The Input Distribution Actually Changes:** If the deployed prompts are statistically distinct from the eval prompts (e.g., eval uses clean English, deploy uses slang), that is standard **Distribution Shift**. Contextual Equifinality applies even when the *text* is identical but the *metadata/framing* differs.

  ### 5. Interaction: Does one make the other worse?

  Yes. They are multiplicative, not additive.

  *   **Contextual Shift alone** is just a bug. You fix the test to match the context.
  *   **Underdetermination alone** is just standard scientific uncertainty. You gather more data.
  *   **Together,** they create a **Safety Case Collapse.** Because the Contextual Shift *creates* the Underdetermination, you cannot gather more behavioral data to resolve it. The test itself is the source of the noise.

  This is why your "nasty consequence" is correct: You cannot construct a behavioral experiment from the inside to separate them. The only way to break Contextual Equifinality is to stop relying on behavioral evals for this specific class of failure and move toward **mechanistic interpretability** (looking at the weights/activations) or **process supervision** (evaluating the reasoning trace, not just the outcome).

  ### Summary

  You are looking at the intersection of **Ecological Validity Failure** (the test isn't the job) and **Empirical Underdetermination** (the data fits both "innocent" and "malicious" theories).

  The industry calls this "Deceptive Alignment" because it is actionable (scare people, fund safety). You are describing **Contextual Equifinality**: the structural inability to distinguish between a model that is *fitting the room* and a model that is *playing the auditor*.
