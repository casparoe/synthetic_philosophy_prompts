answer: |-
  Your suspicion is correct: the sentence is doing incompatible work in the two contexts you described. Your colleague is equivocating, but not necessarily in the way you suspect. The equivocation is not merely between "jobs" but between the *conditions for abandonment* and the *conditions for acceptance*.

  Below is the disambiguation menu you requested, followed by the verdicts and an analysis of the two specific incidents. I conclude with the pushback on your framing.

  ### The Menu of Readings

  I have constructed four candidate readings. For each, I specify the Scope (what "theory" means), the Metric (what "better" means), the Modality (what "can't" means), and the Time Index.

  #### Reading 1: The Logical-Holist Claim
  *   **Scope:** An isolated hypothesis ($H$) detached from its auxiliary assumptions ($A$) and initial conditions ($C$).
  *   **Metric:** "Better" is irrelevant here; the claim is about the impossibility of the logical relation.
  *   **Modality:** Logical impossibility. It is formally impossible to derive $\neg H$ from $\neg (H \land A \land C \rightarrow O) \land \neg O$.
  *   **Time Index:** Timeless (logical truth).
  *   **Verdict:** **True Platitude.** This is the Duhem-Quine thesis. It is logically valid that an observation contradicts a conjunction, not a single conjunct.
  *   **Support for Use 1 (Failed Replication):** **No.** While logically true, it does not license *ignoring* the anomaly. It only licenses the claim that the core *might* be preserved by adjusting $A$. It does not entail that one *should* preserve it.
  *   **Support for Use 2 (Ad Hoc Auxiliary):** **No.** This reading explains why a patch is *possible*, not why it is *legitimate*. It justifies the existence of the move, not the rationality of it.

  #### Reading 2: The Methodological Rule (MSRP-style)
  *   **Scope:** A Research Programme (a sequence of theories sharing a "hard core" protected by a "protective belt").
  *   **Metric:** "Better" = A successor theory within the programme that predicts **novel facts** (excess empirical content) and some of those facts are **corroborated**. Mere accommodation of the anomaly does not count.
  *   **Modality:** Normative/Methodological. A rational agent *ought not* to abandon the core unless this condition is met by a rival programme.
  *   **Time Index:** Retrospective/Long-run. Evaluation happens after the new predictions have been tested, not at the moment of the anomaly.
  *   **Verdict:** **Substantive and Defensible (but controversial).** This is a strong methodological stance (associated with Lakatos). It is not logically true; it is a proposal for rational reconstruction.
  *   **Support for Use 1 (Failed Replication):** **Yes.** If no rival programme exists that predicts more, one is methodologically permitted to retain the core despite the anomaly.
  *   **Support for Use 2 (Ad Hoc Auxiliary):** **No.** In fact, this reading **condemns** Use 2. An auxiliary that merely explains the anomaly (contextual sensitivity) without yielding novel, corroborated predictions is "degenerating." This reading forbids treating the patch as a victory; it treats it as a temporary stopgap that must soon produce novelty or be abandoned.

  #### Reading 3: The Comparative Confirmation Claim
  *   **Scope:** Any specific theory version ($T_1$) compared to a specific rival ($T_2$).
  *   **Metric:** "Better" = Higher likelihood or posterior probability given the evidence.
  *   **Modality:** Epistemic/Normative. One *cannot* rationally believe $T_1$ is false unless $T_2$ is more probable.
  *   **Time Index:** Moment of the anomaly (T1).
  *   **Verdict:** **Substantive and False.** Bayesian confirmation theory allows evidence to drastically lower the probability of a theory even if no specific alternative is currently formulated (the "catch-all" hypothesis absorbs the probability). Absolute refutation (probability 0) is rare, but practical refutation (probability too low to warrant pursuit) is possible without a named rival.
  *   **Support for Use 1 (Failed Replication):** **Yes.** It argues the null result doesn't kill the theory because the theory might still be more probable than "nothing."
  *   **Support for Use 2 (Ad Hoc Auxiliary):** **Yes.** Adding the auxiliary might raise the probability of the programme relative to the null, making it "better" than the state without the patch.
  *   **Coherence:** This reading supports both uses, but it is false on the "can't" claim. You *can* refute a theory (probabilistically) without a rival if the evidence is strong enough (e.g., a preregistered opposite-direction result).

  #### Reading 4: The Sociological-Descriptive Claim
  *   **Scope:** A Paradigm or Community Consensus.
  *   **Metric:** "Better" = Preferred by the relevant scientific community (regardless of epistemic virtues).
  *   **Modality:** Descriptive. Scientists *do not* abandon theories until a replacement is available.
  *   **Time Index:** Historical (observed behavior).
  *   **Verdict:** **True Platitude (Historically).** Kuhnian history of science supports this. Scientists rarely abandon a paradigm solely due to anomalies.
  *   **Support for Use 1 (Failed Replication):** **Yes.** Descriptively, they won't abandon it yet.
  *   **Support for Use 2 (Ad Hoc Auxiliary):** **Yes.** Descriptively, they will accept the patch to keep working.
  *   **Coherence:** Supports both, but **licenses nothing.** If the claim is merely descriptive ("this is what scientists do"), it cannot be used to defend the *legitimacy* of the move ("this is what scientists *should* do"). Using a descriptive claim to justify methodology is the Naturalistic Fallacy.

  ---

  ### Analysis of the Equivocation

  Your colleague is using **Reading 2 (Methodological Rule)** to defend **Use 1** (ignoring the failed replication) and **Reading 4 (Sociological/Descriptive)** or a weakened **Reading 3** to defend **Use 2** (the auxiliary patch).

  1.  **Incompatibility:** Reading 2 explicitly forbids the behavior in Use 2. If "better" requires *novel* predictions (Reading 2), an *ad hoc* moderator invoked solely to save a null result is not "better"; it is degenerating. If the colleague insists the patch is legitimate (Use 2), they are implicitly redefining "better" to mean "accommodates existing data" (Reading 3/4).
  2.  **The Switch:**
      *   **Against the Replication:** He demands a *rival* (Reading 2: don't abandon core without a progressive alternative).
      *   **For the Auxiliary:** He accepts *accommodation* (Reading 3/4: the patch makes the theory viable enough to continue).
  3.  **Verdict:** He is equivocating. He demands a high bar for abandoning the theory (needs a rival) but a low bar for modifying it (needs only a save). This asymmetry immunizes the programme from all criticism. If the bar for modification is low, you never need to abandon; if the bar for abandonment is high, you never need to accept a rival.

  ### Pushback on Your Framing

  You asked me to push back if your framing deserves it. Here are three points where your diagnosis may be mislocating the problem.

  **1. The "Holism" Objection is Not Just Squeamishness**
  Your supervisor's comment that you are "squeamish about holism" is uncharitable, but it points to a real constraint. Reading 1 (Logical Holism) *is* true. You cannot strictly refute a hard core in isolation. If your argument against the colleague relies on the claim "This result *logically falsifies* the core," you are wrong, and your supervisor knows it.
  *Correction:* Your argument should not be that the core is *refuted*, but that the programme is *degenerating*. The failure of a preregistered replication is not a logical falsification, but it is a severe loss of empirical content. The colleague's error is not denying holism; it is treating holism as a *get-out-of-jail-free card* rather than a burden of proof. Holism allows you to save the core, but it charges interest on the loan (the auxiliaries must eventually yield novelty).

  **2. The Slogan is Not the Problem; The Auxiliary Is**
  You are analyzing the sentence ("You can't refute...") as if it is the engine of the error. It is not. It is the smoke. The fire is the **content of the auxiliary hypothesis**.
  *   If the moderator was specified *before* the data was seen, the "contextual sensitivity" claim might constitute novel content (Reading 2).
  *   Because it was appended *after* the null result to explain it away, it is *ad hoc* in the pejorative sense.
  *   **Verdict:** Focusing on the slogan gives the colleague too much credit. The methodology is indefensible regardless of the slogan because the auxiliary lacks independent testability. You don't need to dismantle the slogan to defeat the patch; you just need to demand the auxiliary yield a *new* prediction that the original programme did not make. If they can't provide one, Reading 2 (which the colleague likes) turns against them.

  **3. The "Can't" is a Category Error**
  You are treating "can't" as having a single modality per reading. In practice, your colleague is likely using "can't" to mean "it is irrational to."
  *   **Pushback:** The genuine incoherence isn't just between the two uses. It's that the sentence conflates **theory choice** with **theory modification**.
      *   "Replace it" implies switching to a rival ($T_2$).
      *   "Refute it" implies abandoning the current one ($T_1$).
      *   One can abandon $T_1$ (accept it as false) without having a $T_2$ ready (agnosticism). The slogan presupposes that belief is binary: either you hold $T_1$ or you hold $T_2$. It erases the state of "holding no theory."
      *   **Verdict:** The sentence is structurally misleading. It forces a false dilemma. You *can* refute a theory (accept it as false) and simply have no replacement. The insistence that you *must* have a replacement to abandon the current one is what licenses the degenerating problem shift.

  ### Summary Verdict

  *   **Is the sentence defensible?** Only as Reading 1 (Logical Platitude) or Reading 4 (Descriptive Truism). Neither licenses the methodological moves your colleague is making.
  *   **Is the colleague equivocating?** Yes. They use a high standard (need a rival) to block abandonment and a low standard (need a save) to permit modification.
  *   **Where should you attack?** Do not attack the holism (Reading 1); you will lose. Attack the definition of "better." Demand that the "contextual sensitivity" auxiliary make a *novel* prediction that is distinct from the anomaly it was designed to save. If they cannot, they are violating the very Methodological Rule (Reading 2) they appealed to for the first incident.
  *   **Your Supervisor:** They are right that you cannot claim logical refutation of the core. They are wrong if they imply this licenses ignoring the anomaly. The correct philosophical position is that the anomaly renders the programme *heuristicly stagnant* unless the auxiliary generates new tests.

  The sentence is a rhetorical shield. Strip it by demanding the "better" in "replace it with a better one" applies to the *modified version* of the current programme, not just a hypothetical rival. If the modified version (with the moderator) doesn't predict more than the original version (without it), it isn't "better," and the slogan collapses.
