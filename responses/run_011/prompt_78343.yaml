      *   *The Gap:* Epistemic independence does not entail ontological independence. (Just because I can think of $X$ without $Y$ doesn't mean $X$ exists without $Y$).
      *   *The Bridge:* Something like "If $X$ can be conceived/affirmed without $Y$, then $X$ is ontologically distinct from $Y$" (Conceptual Distinction implies Real Distinction). Or more specifically regarding the body: "If the self's identity is not constituted by bodily properties, the self is not a bodily substance."
      *   *Where it stops:* The moment the Flying Man affirms "I exist" without affirming "I have a body." That establishes epistemic separation. To get to *substance* dualism, you need the premise that epistemic separability tracks ontological separability.

