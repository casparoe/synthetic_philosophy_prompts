prompt: |-
  I run QA for a broadband support team. My graders score about forty recorded calls a week against the script I wrote, and the scores feed into performance reviews, so they get disputed a lot. Lately I keep hitting calls where the agent does every required step — greets properly, verifies the account, reads the mandatory disclosure, walks the customer through a router reboot, confirms the customer "understands" — and the customer hangs up with the exact same fault they called about. It reminded me of the wasp case philosophers use for this, sphexishness I think it's called: the wasp drags its paralyzed cricket to the mouth of the burrow, goes in to check the nest, comes back out, and if you've moved the cricket while it was inside it just drags it back to the entrance and starts over, indefinitely. Nothing it does is incompetent. Each move is fine. The whole routine is stuck and can't tell.

  Write me a procedure a grader can run on one transcript in about ten minutes that separates "compliant and solved it" from "compliant and looping." My graders have no technical background and no philosophy, so it needs to be concrete questions in order, what answer counts as passing each one, where it stops at a fail, and where it hands the call up to a human becuase the remaining question is about service quality rather than something checkable in the transcript. The part I care most about: a test for real verification versus fake verification — a step that looks like a check but whose only possible outcome is to run the loop again. And it has to hold the line that some script steps are regulatory and can't be skipped no matter how stuck the call has become.

  Then run it on three cases. One: the agent asks the customer to reboot three times, gets a flat "yeah ok" each time, and twice the customer says something that doesn't fit the branch the agent is in. Two: the agent skips the mandatory disclosure, solves an unusual fault in four minutes, customer is delighted. Three: the agent repeats verbatim lines four times and sounds like a machine, but the customer's issue doesn't appear in any branch of my script.

  Finish with where the procedure will misfire, and say something honest about the risk that grading for sphexishness turns into its own sphexish routine.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** QA Lead for a broadband support team.
      *   **Problem:** Agents follow the script perfectly (compliant) but fail to solve the customer's issue (looping/sphexishness). Scores are disputed because current grading rewards compliance over resolution.
      *   **Task:** Create a 10-minute grading procedure to distinguish "Compliant & Solved" from "Compliant & Looping."
      *   **Constraints:**
          *   Graders have no technical background.
          *   Graders have no philosophy background.
          *   Must be concrete questions in order.
          *   Must define pass/fail criteria for each step.
          *   Must define when to escalate to a human (service quality vs. checkable transcript).
          *   Must test for *real* verification vs. *fake* verification (checking the box vs. checking the result).
          *   Must acknowledge regulatory steps that cannot be skipped.
          *   Must apply the procedure to three specific cases.
          *   Must conclude with limitations/risks (including the meta-risk of the QA process becoming sphexish itself).

  2.  **Deconstruct the Core Problem (Sphexishness in Support):**
      *   *Sphexishness:* Mindless repetition of a routine despite changing conditions or lack of progress.
      *   *In Support:* Following troubleshooting steps (reboot, check lights, etc.) without verifying if the step actually changed the state of the connection or the customer's experience.
      *   *The "Fake Verification":* Asking "Did that work?" and accepting "Yeah" without checking line stats, asking for a specific test, or noticing the customer is still complaining.

  3.  **Drafting the Procedure (The "Sphex-Check"):**
      *   *Goal:* 10 minutes max. Concrete. Binary outcomes where possible.
      *   *Structure:*
          1.  Regulatory Compliance (Pass/Fail immediately).
          2.  Resolution Status (Did the problem go away?).
          3.  Verification Quality (Did the agent *know* it was fixed?).
          4.  Adaptation (Did the agent notice when things didn't fit?).
          5.  Escalation Point (When is it too subjective?).
      *   *Key Innovation:* The "Verification Test." Instead of "Did they ask if it worked?", it's "Did they confirm the *signal* changed?" or "Did they react to negative cues?"

      *   *Drafting Steps:*
          *   Step 1: Regulatory Gate. (Mandatory disclosure). If missing, Fail Compliance (even if solved). *Constraint: Can't skip regulatory.*
          *   Step 2: Outcome Check. (Did the customer say it's fixed?). If no, mark as "Unresolved."
          *   Step 3: The Verification Loop Test. (The core request). Look for the "Yeah, ok" trap. Did the agent accept a vague confirmation when the script requires a specific test? Or did they ignore a specific failure?
          *   Step 4: Script Deviation. (Did they follow the script?). If they deviated to solve, that's good *unless* they skipped regulatory.
          *   Step 5: Escalation. If the transcript shows the agent tried everything and it's a network issue, that's not agent fault.

      *   *Refining the "Fake Verification" Test:*
          *   *Question:* "When the agent asks if the issue is resolved, is there evidence in the transcript that the customer actually tested the service, or just agreed to move on?"
          *   *Pass:* Customer reads a speed test, confirms a specific website loads, or agent checks line sync.
          *   *Fail:* Customer says "Yeah/Ok/Uh-huh" and agent moves to closing without a specific confirmation.
          *   *Escalate:* If the transcript is ambiguous about whether the test happened.

  4.  **Developing the Three Cases:**
      *   *Case 1 (The Loop):* Agent reboots 3x, customer says "yeah ok" but comments don't match branch.
          *   *Application:* Step 1 (Regulatory) Pass. Step 2 (Outcome) Fail (Fault persists). Step 3 (Verification) Fail (Vague confirmation). Result: Compliant but Looping.
      *   *Case 2 (The Cowboy):* Skips disclosure, solves fast, happy customer.
          *   *Application:* Step 1 (Regulatory) Fail. Stop. Result: Non-Compliant (even if solved). *Note: This enforces the constraint that regulatory steps can't be skipped.*
      *   *Case 3 (The Robot):* Verbatim lines, issue not in script.
          *   *Application:* Step 1 Pass. Step 2 Fail (Issue not in script = unlikely solved). Step 3 (Adaptation) Fail (Agent didn't recognize off-script issue). Step 5 (Escalate): Is this a training issue or a script gap? Escalate to Human for "Script Gap Analysis."

  5.  **Addressing the Meta-Risk (Conclusion):**
      *   The QA process itself can become a script. Graders might just tick boxes on *this* new procedure without thinking about the actual customer experience.
      *   Need to acknowledge that "Sphex-Checking for Sphexishness" is a real danger.
      *   Honesty about limitations: Transcripts don't show tone, network side data is missing, etc.

  6.  **Review and Refine:**
      *   *Tone:* Professional, direct, operational.
      *   *Clarity:* Use bolding, lists, and clear Pass/Fail/Escalate markers.
      *   *Constraint Check:* Did I include the regulatory hard stop? Yes. Did I include the fake verification test? Yes. Is it under 10 mins? Yes, if kept to 5 steps.
      *   *Philosophy:* Keep the *wasp* reference minimal in the procedure itself (graders have no philosophy), but acknowledge it in the intro/outro.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In Case 2, the prompt says "solves an unusual fault." I need to make sure the procedure doesn't penalize solving the problem, but *must* penalize skipping the regulatory disclosure as per the prompt's constraint ("hold the line that some script steps are regulatory").
      *   *Correction:* In Case 3, the issue isn't in the script. The agent follows the script anyway. This is the definition of Sphexishness. The procedure needs to catch that the agent *didn't* escalate to a human specialist when the script didn't fit.
      *   *Refining the Verification Test:* Make it about "Evidence of State Change."

  8.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  # The Sphex-Check Procedure (v1.0)

  **Purpose:** To distinguish between agents who follow the script to solve a problem and agents who follow the script to finish a call.
  **Time Limit:** 10 Minutes per call.
  **Audience:** Non-technical Graders.
  **Rule:** Complete steps 1 through 5 in order. If a step results in a **FAIL**, stop grading and mark the call. If a step results in **ESCALATE**, stop grading and flag for Senior QA.

  ---

  ### Step 1: The Regulatory Gate (Hard Stop)
  **Question:** Did the agent read the mandatory regulatory disclosure (privacy, recording, or billing warning) verbatim or near-verbatim as required by law/company policy?
  *   **PASS:** Disclosure is present and complete. Proceed to Step 2.
  *   **FAIL:** Disclosure is missing, truncated, or rushed.
      *   **Action:** Mark call **NON-COMPLIANT**. Stop grading.
      *   *Note:* Even if the customer is happy and the internet is fixed, a missing regulatory disclosure is a legal risk. This holds the line on compliance.

  ### Step 2: The Outcome Check
  **Question:** In the final 2 minutes of the call, does the customer explicitly state the issue is resolved, or does the agent confirm service metrics are back to normal?
  *   **PASS:** Customer says "It's working," "Speeds are back," or Agent confirms "Line sync is stable." Proceed to Step 3.
  *   **FAIL:** Customer says "It's still acting up," "I guess I'll call back," or hangs up while the fault is active.
      *   **Action:** Mark call **UNRESOLVED**. Proceed to Step 3 (to determine *why* it failed).
  *   **ESCALATE:** The transcript ends abruptly or the customer's final status is ambiguous (e.g., "We'll see").
      *   **Action:** Flag for **Senior QA Review**. Stop grading.

  ### Step 3: The Verification Test (Fake vs. Real)
  **Question:** When the agent asks if the troubleshooting step worked, is there **evidence** the customer actually tested the service, or did they just agree to move on?
  *   **PASS (Real Verification):** The agent asks for specific proof (e.g., "Can you load google.com?", "What do the lights show now?") OR the customer volunteers specific proof ("Yes, the video stopped buffering").
  *   **FAIL (Fake Verification):** The agent asks "Did that work?" and accepts a non-committal answer ("Yeah," "Ok," "Uh-huh") without asking for a specific test, *especially* if the customer previously indicated the issue was intermittent or severe.
      *   **Action:** Mark call **SPHEXISH (Looping)**. Stop grading.
      *   *Why:* This catches the "wasp" behavior. The agent performed the motion of checking, but did not process the result.
  *   **ESCALATE:** The transcript shows the agent tried to verify, but the customer refused to test or was unable to test.
      *   **Action:** Flag for **Team Lead Review**. Stop grading.

  ### Step 4: The Branch Fit Check
  **Question:** Did the customer's description of the fault match the troubleshooting branch the agent was using?
  *   **PASS:** The agent follows the script for the specific error code or symptom the customer described.
  *   **FAIL:** The customer describes a symptom (e.g., "TV is pixelating") but the agent follows a script for a different symptom (e.g., "No Internet Connectivity") without acknowledging the mismatch.
      *   **Action:** Mark call **PROCESS ERROR**. Stop grading.
      *   *Why:* This catches agents who are so focused on the script they ignore the reality in front of them.
  *   **ESCALATE:** The customer's issue does not appear in *any* branch of the current script (e.g., a new type of outage).
      *   **Action:** Flag for **Scripting Team**. Stop grading. (See Case 3).

  ### Step 5: The Adaptation Check (Only if Steps 1-4 Pass)
  **Question:** If the first troubleshooting step failed, did the agent change their approach or simply repeat the same instruction?
  *   **PASS:** Agent moves to the next logical step in the script or escalates to a technician.
  *   **FAIL:** Agent repeats the exact same instruction (e.g., "Please reboot again") more than twice without new information or a change in line status.
      *   **Action:** Mark call **SPHEXISH (Looping)**.
  *   **PASS:** All previous steps passed.
      *   **Action:** Mark call **COMPLIANT & EFFECTIVE**.

  ---

  # Application to Cases

  ### Case 1: The Reboot Loop
  *Scenario:* Agent asks customer to reboot 3 times. Customer says "yeah ok" each time. Twice the customer says something that doesn't fit the branch (e.g., Agent asks about router lights, Customer talks about TV static).
  *   **Step 1 (Regulatory):** Pass (Assumed).
  *   **Step 2 (Outcome):** Fail (Fault persists/Customer hangs up). Mark **UNRESOLVED**. Continue to Step 3.
  *   **Step 3 (Verification):** **FAIL.** The customer said "yeah ok" (non-committal) and the agent did not demand a specific test (e.g., "Tell me what the blue light is doing").
  *   **Result:** **SPHEXISH (Looping).**
  *   *Grader Note:* The agent accepted "fake verification." They heard the words "yeah" but didn't hear that the customer was talking about a TV while the agent was troubleshooting a router.

  ### Case 2: The Cowboy
  *Scenario:* Agent skips mandatory disclosure. Solves unusual fault in 4 minutes. Customer delighted.
  *   **Step 1 (Regulatory):** **FAIL.** Disclosure missing.
  *   **Result:** **NON-COMPLIANT.** Stop grading.
  *   *Grader Note:* This is the hard line. The procedure protects the company from legal risk even if the customer is happy. The agent cannot be rewarded for breaking the law/policy, regardless of resolution. This call goes to coaching for the skip, but the resolution is noted as a "win" in a separate comment field (not score).

  ### Case 3: The Robot
  *Scenario:* Agent repeats verbatim lines 4 times. Sounds like a machine. Customer's issue does not appear in any branch of the script.
  *   **Step 1 (Regulatory):** Pass.
  *   **Step 2 (Outcome):** Fail (Issue not in script = unlikely solved). Mark **UNRESOLVED**.
  *   **Step 3 (Verification):** Fail (Likely accepted vague answers to keep reading script).
  *   **Step 4 (Branch Fit):** **ESCALATE.** The issue does not appear in *any* branch of the script.
  *   **Result:** **FLAG FOR SCRIPTING TEAM.**
  *   *Grader Note:* The agent is not necessarily "at fault" personally, but the system failed. The agent followed the map when the map didn't cover the territory. This is not a performance issue for the agent; it is a design issue for the QA/Script team. Do not penalize the agent's performance score, but flag the call for process improvement.

  ---

  # Where This Procedure Will Misfire

  **1. The "Silent Success" Blind Spot**
  Sometimes a reboot fixes the line silently. The customer says "Yeah, looks good" without running a speed test. Step 3 might mark this as "Fake Verification" because there's no specific evidence, penalizing an agent who got a quick win.
  *   *Mitigation:* Graders must look for *downstream* confirmation. If the customer stays on the line for 5 more minutes to discuss billing, the internet is probably working.

  **2. The "Angry Customer" Bias**
  A customer may be so angry they refuse to test the connection ("I'm not doing anything else, just fix it!"). The agent may be forced to escalate. Step 3 might flag this as "Fake Verification" because no test occurred, when in reality the agent de-escalated correctly.
  *   *Mitigation:* Use the "Escalate" option in Step 3 if the transcript shows customer refusal.

  **3. The Meta-Risk: QA Sphexishness**
  You asked for honesty about the risk that grading for sphexishness turns into its own sphexish routine. Here it is:
  *   **The Risk:** This procedure is itself a script. A grader can mindlessly tick "Pass" on Step 3 because they saw the words "Did that work?" and "Yes," without actually reading the context to see if the "Yes" was meaningful. They become the wasp, dragging the cricket to the burrow, checking the box, and moving to the next call without verifying the *quality* of the verification.
  *   **The Reality:** No checklist can fully replace human judgment. If your graders treat this 5-step list as a rigid law rather than a heuristic, you will simply trade "Agent Sphexishness" for "Grader Sphexishness." You will catch the robots, but you might penalize the intuition of an agent who sensed a fix without a script, or miss a subtle loop where the agent *did* ask for a test but ignored the failed result.
  *   **The Fix:** You must audit the graders. Randomly sample 10% of the calls they grade and ask: "Did you actually read the transcript, or did you just search for keywords?" If the QA process becomes a box-ticking exercise, it will fail to catch the very mindlessness it was designed to kill.
