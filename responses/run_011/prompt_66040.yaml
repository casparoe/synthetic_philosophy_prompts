answer: |-
  A clerk at the Manifold Permit Office holds two diffeomorphic applications for the same hole.
  "These assign different curvature to the very same point $p$," she says.
  "Right," says the applicant. "Two distinct physical possibilities."
  "Then neither gets stamped," she replies. "We don't issue permits for indeterminism."
  "But the observable physics is identical!"
  "Then file one claim under Leibniz Equivalence. Only point-coincidences get stamps."

  ***

  **Note on Physics and Bias**

  **Confidence:** High. The setup accurately reflects the Earman-Norton formulation of the Hole Argument: a substantivalist commitment to manifold points leads to radical indeterminism because the field equations cannot distinguish between diffeomorphic models inside the hole.

  **Least Sure Part:** Whether "point $p$" lands clearly for the GR-course half without invoking coordinates. In the argument, $p$ is a bare manifold point (which substantivalists reify), but students often think of points only via coordinate charts. However, the context of "same point" vs. "different curvature" should carry the weight.

  **Bias:** The joke definitely takes a side. It portrays substantivalism as bureaucratic nonsense that generates unacceptable indeterminism, forcing the applicant to adopt Leibniz Equivalence (the standard resolution). This aligns with the mainstream philosophical consensus but does make the substantivalist position look foolish rather than merely problematic, which begs the question against views that try to salvage substantivalism (e.g., via haecceities or sophisticated substantivalism).
