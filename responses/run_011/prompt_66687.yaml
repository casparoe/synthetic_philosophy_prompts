  Bottom line: The package is salvageable, but (5) and (3) require modification to avoid contradiction.

  **Severity 1: (5) vs. (6).** (5) claims the hypocrite grabs "more than his share," implying scarcity. (6) explicitly denies a fixed pool. This is a direct contradiction.
  *Fix:* Drop the "share" metaphor in (5). Reframe the unfairness as *authority usurpation*: the hypocrite demands compliance while exempting himself. The offense isn't hogging a resource, but asserting an authority one's own conduct denies.
  *Cost:* You lose the intuitive pull of "fairness" as equal distribution, shifting it to "fairness" as consistency. However, this aligns better with (6).

  **Severity 2: (2)/(3) vs. (4) (The Dana Case).** (3) says standing is binary and lost via violation. (4) says victims have special standing. If Dana violated the norm, (3) strips her standing; (4) grants it.
  *Fix:* Distinguish *types* of standing rather than degrees. Hypocrisy defeats *general moral standing* (the right to judge as a peer). Victimization grants *particular reactive standing* (the right to resent as a target). Dana lacks the former but retains the latter.
  *Cost:* This weakens the simplicity of (3). You must argue that "standing" is an umbrella term for distinct normative powers. It costs you theoretical elegance but avoids the slippery slope of degrees and saves the victim intuition.

  **Dissolved Tension: (1) vs. (2).** This looks contradictory but isn't. (1) concerns *truth conditions* (logic); (2) concerns *normative authority* (pragmatics). A hypocrite can speak truth (1) while lacking the authority to enforce it (2). Tu quoque fails as a logical rebuttal but succeeds as a standing challenge. No changes needed.

  **Recommendation:** To survive the seminar, clarify that "standing" in (2) refers to general moral criticism, while (4) refers to personal grievance. Clean up (5) to avoid implying blame is a finite resource. If you make these distinctions, your view holds together without retreating to "degrees."
