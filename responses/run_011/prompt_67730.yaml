answer: |-
  This is a valid *reductio ad absurdum* against a specific, strong version of the Will Theory of promising, not a logical fallacy like equivocation or scope slide. The argument succeeds because it correctly identifies that a normative power to unilaterally dissolve a duty is incompatible with the concept of a duty, forcing a choice between rejecting the Pure Will Theory or redefining what counts as a promise. The failure lies not in the inference but in the metaphysical picture of how volition interacts with normative concepts.

  Here is the diagnosis of the argument, the costs for competing accounts, and the verdict on the power to release.

  ### The Diagnosis: Rejecting Step (2)
  The step you should reject is **(2)**. It looks innocent because it appeals to autonomy: if I bind myself, surely I decide what I'm bound to. But (2) assumes that the *act* of promising is normatively malleable solely by the agent's intention. It conflates the **creation** of an obligation with the **constitution** of the practice that makes obligation intelligible.

  To promise is to invoke a social/normative practice. Just as you cannot play chess by moving your rook diagonally and claiming your "will" defines the rook's movement, you cannot promise while reserving a unilateral right to void the promise and claim you have still promised. The concept of "promise" has constitutive rules (one of which is that the obligation is not subject to the promisor's unilateral whim). Step (2) fails because the will operates *within* the normative grammar of promising; it cannot rewrite that grammar and still produce a promise. Your hunch about a level distinction is correct: (2) treats the *rules of the practice* as if they were *content of the will*.

  ### The Cost Bill for Competing Accounts
  Every family of accounts has to pay a price to handle this napkin argument. Here is the ledger:

  1.  **Pure Will Theory (Promisor Authority):**
      *   *The Bill:* They must abandon the claim that the will is the *sole* source of normativity. They must admit that the will only works because it taps into a pre-existing normative framework (conceptual or social) that constrains what the will can achieve.
      *   *Cost:* High. This effectively dissolves the Pure Will Theory into a hybrid view. If the will is constrained by external norms, the will isn't the ultimate source of the binding force.

  2.  **Expectation/Reliance Theory (Promisee Focus):**
      *   *The Bill:* They reject (1) outright. The obligation comes from the harm of disappointed expectations, not the act of willing.
      *   *Cost:* Moderate. They struggle to explain the "bare promise" (where I promise, you don't rely, but I'm still bound). They also have to explain why the *contract* in your roommate's case is binding even if the company doesn't rely on him staying (since they can fire him anytime).

  3.  **Practice/Convention Theory (Rawlsian/Rule Utilitarian):**
      *   *The Bill:* They reject (2) and (3). The practice defines valid moves. A clause that allows unilateral exit is simply not a "promise" within the practice; it's a statement of intention.
      *   *Cost:* Low to Moderate. The cost is rigidity. It struggles to explain how we make novel promises outside established conventions. However, it handles the napkin argument best: you literally cannot make that move in the game.

  4.  **Second-Personal/Authority Transfer (Darwall, Shiffrin):**
      *   *The Bill:* They reject (3) and (4). To promise is to give the promisee authority over your action. You cannot give authority while keeping a veto; that is not giving authority.
      *   *Cost:* Low. This view aligns perfectly with the intuition that the "off-switch" negates the promise. It requires a robust account of how normative authority transfers, but it doesn't require sacrificing the core intuition that promises bind.

  **The Cheapest Bill:** The **Second-Personal/Authority Transfer** account pays the least. It preserves the binding nature of promises without relying on fragile social conventions or the paradoxical idea that the will can bind itself while remaining free. It explains *why* (2) is false: you cannot will the transfer of authority while retaining the authority to revoke that transfer.

  ### The Power to Release
  You asked for a straight answer: **Yes, for there to be a promise, the normative power to release the promisor must sit primarily with the promisee.**

  This is the defining feature that separates a promise from a statement of intention or a vow. When you promise, you create a *right* in the promisee. In normative logic, rights are waivable by their holder, not by the obligor. If the promisor holds the exclusive power to release themselves, they have not created a right in the promisee; they have merely stated a policy they intend to follow.

  In your roommate's contract, legally, he has signed a "at-will" agreement, not a promissory one in the moral sense. He has promised nothing; he has only predicted his behavior subject to revision. Morally, if he claims he "promised" to stay, he is misusing the word. He has agreed to a coordination mechanism, not undertaken an obligation.

  ### Settled View vs. Live Debate
  I will not dress this up as consensus where there is none.

  *   **Settled:** The **Pure Will Theory** (that the will alone, without reference to social practice or second-personal reasons, creates obligation) is a minority position in contemporary Anglophone moral philosophy. Most philosophers agree that promising requires a social practice or a second-personal exchange of reasons. Your roommate's napkin argument is widely accepted as a successful critique of the *naive* Will Theory.
  *   **Live Debate:** The fight is now between **Practice Views** and **Second-Personal Views**. Practice theorists say the obligation comes from the utility/stability of the institution of promising. Second-Personal theorists say it comes from the respect owed to the promisee as a person with authority over the promised act.
  *   **The Contract Nuance:** There is a live debate in legal philosophy about whether "at-will" contracts are truly contracts or merely revocable offers. However, in *moral* philosophy, the consensus is closer to your initial hunch: an obligation subject to unilateral revocation is not an obligation.

  **Verdict:** Your roommate won the legal argument (the contract is valid and enforceable as written), but you won the philosophical one. The clause he signed negates the promissory nature of the agreement. His napkin argument is sound against the Will Theory, but it proves that he didn't actually make a promise in the moral sense; he entered a revocable license. If you want to save the concept of promising, you must reject (2) and acknowledge that the will is constrained by the normative structure of the act it performs.
