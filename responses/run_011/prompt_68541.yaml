prompt: |-
  I run a volunteer network that does quick damage checks after earthquakes — about 20 of us, each covering the few blocks we actually live in, reporting into a shared form within an hour of a shake. Here's the problem: the form displays a running tally of what's already come in, so you can see it while you're filling yours out. After the last one, two people reported damage early on, then fourteen in a row reported damage too, and when we finally walked the whole area there was real damage on maybe three streets total.

  So I want to switch to blind submission — nobody sees the tally untill everyone's submitted. But one of our volunteers, easily the sharpest person in the group, says I'd be throwing away the entire point. His argument is that someone who sees a pile of damage reports and then reports damage isn't being a sheep, they're updating on genuine evidence, and that a crowd pooling what everyone knows is exactly where the accuracy comes from in the first place. He also says if we blind it, the people who honestly didn't notice anything will just guess, and we'll trade a signal for noise.

  I can't pin down what's off about this, and I don't want to break something that isn't broken. Two details that might matter: two of those fourteen were a married couple living on the same street, and there's a retired structural engineer in the group whose reports everyone just assumes are correct whether they've seen the tally or not. Should I go blind? If not, what should I be doing instead?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Goal:** Accurate, rapid damage assessment after earthquakes.
      *   **Current Method:** Shared form with a running tally (visible to submitters).
      *   **Problem:** Herding behavior/Information Cascades. 16 people reported damage, but only 3 streets had actual damage.
      *   **Proposed Solution:** Blind submission (hide tally until everyone submits).
      *   **Counter-Argument (from "Sharpest Volunteer"):** Visible tallies allow Bayesian updating (pooling evidence). Blind submission might lead to guessing by those who saw nothing.
      *   **Key Details:**
          *   Group size: ~20 volunteers.
          *   Coverage: Few blocks each (local knowledge).
          *   Timeframe: Within an hour.
          *   Specific Incident: 2 early reports -> 14 subsequent reports -> Actual damage on 3 streets.
          *   Specific Actors: A married couple (same street), a retired structural engineer (high authority).

  2.  **Evaluate the "Sharpest Volunteer's" Argument:**
      *   *Theory:* He's describing "Wisdom of Crowds" or Bayesian updating. If I see 10 people say "Damage," and I see a crack in my wall, I'm more confident it's earthquake damage.
      *   *Flaw:* This assumes *independent* observations. In this specific scenario, the observations are *not* independent.
      *   *The Cascade:* Once the first few reports come in, subsequent reporters might interpret ambiguous signs (old cracks, settled foundations) as earthquake damage because they expect to see damage. This is an **Information Cascade**.
      *   *The Engineer:* If the engineer reports early, everyone trusts them blindly, bypassing their own observation.
      *   *The Couple:* They are not independent data points.
      *   *Result:* The "signal" is being amplified by social proof, not actual ground truth. The volunteer is confusing *correlation* with *causation* in the reporting chain.

  3.  **Evaluate the "Blind Submission" Proposal:**
      *   *Pros:* Breaks the cascade. Forces independent observation. Reduces social pressure.
      *   *Cons:* Volunteers might feel disconnected. If someone sees *nothing*, they might second-guess themselves ("Am I missing something?") and guess "Damage" anyway, though less likely than if they saw 15 reports saying "Damage."
      *   *Verdict:* Blind submission is definitely better than the current visible tally for *data integrity*, but it might not be the *optimal* solution.

  4.  **Identify the Core Statistical/Social Problem:**
      *   **Information Cascade:** People ignore their private signal (what they see on their street) and follow the public signal (the tally).
      *   **Lack of Independence:** The married couple counts as one data point. The engineer's authority biases others.
      *   **Ambiguity:** Earthquake damage (hairline cracks) vs. pre-existing damage is hard to distinguish. Social proof tips the scale.
      *   **Sample Size:** 20 people is small. 2 early reports represent 10% of the total. That's a huge initial bias.

  5.  **Develop a Solution Strategy:**
      *   *Immediate Fix:* Yes, hide the tally. The volunteer is theoretically right about crowds but practically wrong about this specific dynamic. The cost of false positives (wasting emergency resources) is high.
      *   *Refinement:* Blind submission is good, but we can do better.
      *   *Process Improvements:*
          1.  **Independence:** Ensure reports are truly independent (handle the couple, handle the engineer).
          2.  **Calibration:** Train volunteers on what counts as "reportable damage."
          3.  **Weighting:** Don't treat all reports equally (Engineer > Newbie, but Engineer shouldn't report first).
          4.  **Timing:** Stagger the engineer's report.

  6.  **Drafting the Response:**

      *   **Validate the User:** Acknowledge the intuition. The "herding" observed is a classic problem.
      *   **Address the Volunteer's Argument:** Explain *why* he is wrong in this context. Distinguish between "Wisdom of Crowds" (independent estimates) and "Information Cascades" (dependent estimates). Use the term "Information Cascade."
      *   **Analyze the Specific Details:**
          *   *The Couple:* Non-independent. Count as one.
          *   *The Engineer:* High authority bias. If they report early, they anchor the group.
          *   *The Tally:* Creates pressure to conform.
      *   **Recommendation:**
          *   **Go Blind (with nuance):** Hide the aggregate, but maybe confirm receipt.
          *   **Protocol Changes:**
              *   Engineer reports *last* or privately to admin.
              *   Couple submits one joint form.
              *   Define "Damage" clearly (photos required? specific criteria?).
              *   Add a confidence score (How sure are you?).
      *   **Risk Assessment:** False positives (panic/resource waste) vs. False negatives (missed help). In disaster response, false positives are usually less dangerous than false negatives, *but* resource misallocation is a real risk. Actually, in this context, 16 reports vs 3 streets means resources are being spread too thin. Accuracy is key.

  7.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Wait, is blind submission perfect?* If someone sees nothing, but knows there was a big quake, they might still guess "damage" because they expect it. But seeing *15 other people* say damage is much stronger pressure. Blind reduces this.
      *   *The Volunteer's point on "Guessing":* If it's blind, someone who sees nothing should report "Nothing." If they guess "Damage," that's noise. But currently, they are reporting "Damage" because of the *tally*, not just the quake. Blind removes the tally bias.
      *   *Structure:*
          1.  Direct Answer (Yes, go blind).
          2.  Explain the Volunteer's Error (Independence assumption).
          3.  Analyze the Specific Biases (Engineer, Couple).
          4.  Actionable Protocol Improvements.

  8.  **Final Polish:** Ensure tone is respectful to the volunteer (he's smart, just applying the wrong model) and supportive of the user (their intuition is correct). Emphasize that in crisis mapping, *independence* is the most valuable asset.

      *(Self-Correction during drafting)*: I should mention that the "Wisdom of Crowds" works for *estimations* (like guessing the weight of a cow), not *binary observations* influenced by social proof. This is a crucial distinction.

      *(Another thought)*: The engineer's input is valuable. Don't discard it. Just isolate it. Have the engineer verify the *aggregate* data afterwards, not influence the *collection*.

      *(Final Plan)*:
