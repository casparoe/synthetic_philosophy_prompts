      *   *Constraint Check:* No bibliography.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Clause 1:* "Democratic" is often used loosely for "Unrestricted Domain" in trade books, but technically it's about the domain of preferences, not voting. I need to point this out.
