      *   *Better Idea (based on pilot):* Meta-contrast masking or Inattentional Blindism. If T is true, self-reports should fail in predictable ways similar to how we miss things in others (e.g., change blindness in self-experience).
      *   *Best Cheap Experiment:* **The "Confabulation Match" Paradigm.**
          *   Condition A: Judge other's pain based on limited cues.
