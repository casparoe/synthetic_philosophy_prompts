answer: |-
  # Activity Plan: The Council of Risk

  ## 1. The Scenario & Materials

  **The Fiction:** The students are the "Risk Allocation Committee" for a small foundation. They must award a grant to one of two research projects (**Project Alpha** or **Project Beta**). The outcome depends on the state of the economy (**Boom** or **Bust**, each 50% probability).

  **The Constraint:** They are not voting on the projects directly. They are voting on a **Social Decision Rule** (a formula) that will take their individual preferences as inputs and spit out a social ranking. They must agree on this rule *before* seeing the specific utility numbers for the projects.

  **The "Trap":** Most groups will intuitively propose a rule like "Maximize the Minimum" (Rawlsian) or "Majority Vote." You have a specific deck of cards designed to show these violate the premises they claim to hold (Pareto/Unanimity or Expected Utility consistency). Eventually, they will settle on a Weighted Sum to satisfy the constraints, which sets up the Pivot.

  **The Scoring:** "Legitimacy Points." Each committee starts with 100 points.
  *   -20 points if they violate **Unanimity** (choose a lottery everyone ranks lower).
  *   -20 points if they violate **Consistency** (rank A>B and B>C but C>A).
  *   -50 points if they fail to reach a decision within the time limit.
  *   *Goal:* Finish the session with the highest Legitimacy Score. (In reality, the score is irrelevant; the friction is the lesson. But the points give them something to "lose.")

  **The Utility Cards (Printable):**
  *Instructions:* Print these on cardstock. Cut into sets. Each set represents one committee member's vNM utilities for the specific lotteries. **Crucial:** Tell students these numbers represent **Certainty Equivalents in $1,000s**. This stipulation bypasses the "interpersonal comparison" objection during the game mechanics (e.g., "$50k for Alice is the same metric as $50k for Bob").

  **Set A (The "Maximin Trap" Profile)**
  *Use this if they propose "Protect the Worst Off" as their rule.*
  *   **Lottery 1:** Boom: $10, Bust: $10. (EU = 10)
  *   **Lottery 2:** Boom: $100, Bust: $9. (EU = 54.5)
  *   *All 4 Members have these exact same utilities.*
  *   *Trap:* A "Maximin" rule picks Lottery 1 (Min 10 > Min 9). But **Everyone** prefers Lottery 2 (EU 54.5 > 10). This violates Unanimity/Pareto.

  **Set B (The "Majority Trap" Profile)**
  *Use this if they propose "Majority Vote."*
  *   **Member 1, 2, 3:** Prefer Alpha (EU 60) over Beta (EU 50).
  *   **Member 4:** Prefers Beta (EU 200) over Alpha (EU 60).
  *   *Trap:* Majority picks Alpha. Total Welfare of Beta is much higher. (This doesn't violate Pareto, but it sets up the intensity argument later).
  *   *Better Trap for Majority:* **Condorcet Cycle.** (Too complex for 80 mins).
  *   *Stick to Set A for the Unanimity violation.*

  **Set C (The "Pivot" Profile - Round 2)**
  *   **Members 1-4:** Same as Round 1 (Standard Intensity).
  *   **Member 5 (New):** High Intensity. Utilities are exactly **10x** the others.
      *   Lottery 1: $100 / $100.
      *   Lottery 2: $1000 / $90.
  *   *Trap:* If the rule is "Simple Sum" (Utilitarian), Member 5 dictates the outcome entirely. If the rule is "Average," Members 1-4 are diluted.

  ---

  ## 2. Minute-by-Minute Timeline (80 Minutes)

  ### Phase 1: Setup & Stipulations (0:00 – 0:10)
  *   **0:00-0:05:** Divide class into 4 committees of 4 students. Hand out **Set A** cards (face down).
  *   **0:05-0:10:** Read the **Stipulations** aloud. This is critical to prevent stalling.
      1.  "You are Expected Utility maximizers. You rank lotteries by their mathematical expectation."
      2.  "These numbers are **Calibrated Certainty Equivalents**. A '10' for Student X represents the exact same welfare increment as a '10' for Student Y. You are licensed to add them." (This pre-empts the interpersonal comparison objection for the sake of the game).
      3.  "Your goal is to agree on a **Decision Rule** (a formula), not just a choice. The rule must work for *any* numbers I might give you next."

  ### Phase 2: Round 1 – The Search for a Rule (0:10 – 0:30)
  *   **Task:** Committees must write down a rule. Examples: "Sum the utilities," "Average the utilities," "Maximize the minimum," "Majority vote on EU."
  *   **TA Role:** Circulate. If a group is stuck, suggest: "What if one person cares way more than the others? Does your rule handle that?"
  *   **The Check (0:25):** Ask groups to reveal their rule.
      *   *If a group says "Maximin":* Hand them the **Set A Trap**. Ask them to apply their rule. Then ask: "Did everyone prefer the winner?" When they see everyone preferred the loser, deduct 20 Legitimacy Points. **Force them to revise the rule.**
      *   *If a group says "Majority":* Ask: "What if the minority loses everything? Is that consistent with respecting preferences?" (Press them toward Weighted Sum).
  *   **Goal:** By 0:30, most groups should converge on **$W = \sum U_i$** (Utilitarian Sum) or **$W = \text{Average}(U_i)$** because it's the only way to satisfy Unanimity + EU without arbitrary vetoes.

  ### Phase 3: The Pivot (0:30 – 0:35)
  *   **Announcement:** "The Foundation Board has changed. A new stakeholder (Member 5) has been added to your committee. They have a massive endowment at risk."
  *   **Action:** Hand out **Member 5 Cards (Set C)** to one student in each group (or add a 5th student if you have 17, otherwise rotate).
  *   **Constraint:** "You **cannot** change your Decision Rule. You agreed to a procedure 'once and for all' in Round 1. You must now apply the *exact same formula* to this new 5-person profile."

  ### Phase 4: Round 2 – The Impasse (0:35 – 0:55)
  *   **Task:** Apply the old rule to the new profile.
  *   **The Friction:**
      *   If they chose **Sum**: Member 5's utilities (1000s) dwarf Members 1-4 (10s). Member 5 becomes a dictator. Members 1-4 will feel this is unfair ("Our vote doesn't count anymore!").
      *   If they chose **Average**: Member 5 is included, but the weight of Members 1-4 is diluted (divided by 5 instead of 4). They lose influence simply because someone else arrived.
  *   **Observation:** Watch them struggle. They will want to say, "Well, we should re-normalize." **Stop them.** Remind them: "You committed to a rule *ex-ante*. The weights are fixed. If your rule was 'Sum,' you sum. If 'Average,' you average."
  *   **Outcome:** They will realize their "Fair Rule" from Round 1 is now tyrannical or dilutive. They are trapped by their own commitment to linearity and fixed weights.

  ### Phase 5: The Debrief (0:55 – 1:20)
  *   **0:55-1:05:** **Map the Experience.**
      *   "When you rejected 'Maximin' because it overruled unanimous preference, you just derived the **Pareto Premise**."
      *   "When you insisted on using Expected Value rather than gut feeling, you invoked the **Independence/EU Premise**."
      *   "When you settled on Sum/Average, you derived **Linearity** (Harsanyi's conclusion)."
      *   "When Member 5 arrived and you couldn't adjust the weights without breaking your rule, you experienced the **Fixed Weights Impasse**."
  *   **1:05-1:15:** **The "Equal Weights" Gap.**
      *   Ask: "Why did you choose equal weights ($1, 1, 1...$) in Round 1?"
      *   Students: "Because it's fair."
      *   You: "Harsanyi's Aggregation Theorem **does not prove fairness.** It only proves the sum must be linear. The weights $a_i$ could be $(100, 1, 1, 1)$ and the theorem still holds. To get *equal* weights, you need an extra assumption: The **Veil of Ignorance** (ex-ante, you had an equal chance of being anyone). The theorem gives you the *form*; the Veil gives you the *values*."
  *   **1:15-1:20:** **Limitations & Closing.**
      *   Address the Math Major and the Interpersonal Comparison issue (see Troubleshooting below).

  ---

  ## 3. The Debrief Script (Key Talking Points)

  **On the "Pressure":**
  > "Raise your hand if you felt irritated when Member 5 arrived and your rule suddenly made them a dictator. That irritation is the theorem working. You wanted a rule that respected everyone's preferences (Pareto) and treated risk consistently (EU). Harsanyi proves there is *only one* mathematical form that does that: a weighted sum. But once you pick the weights, they are rigid. You cannot be 'responsive' to new intensity without violating the consistency you demanded in Round 1."

  **On Interpersonal Comparison:**
  > "In the game, I told you to treat the numbers as comparable dollars. In reality, that's the hardest philosophical lift. Harsanyi assumes we *can* compare utilities. If you reject that, the theorem doesn't get off the ground. But if you accept it, you are locked into linearity."

  **On the "Equal Weights" Gap:**
  > "Many of you chose equal weights because it felt democratic. But notice: The theorem allows for a 'Dictator' solution ($a_1=1$, others=0). That *also* satisfies Pareto and EU. The theorem doesn't give you democracy; it just gives you a calculator. You have to bring the democracy (equal weights) from outside, usually via an ex-ante agreement (Veil of Ignorance)."

  ---

  ## 4. Troubleshooting: What Will Go Wrong

  ### 1. The Mathematics Concentrator
  **Risk:** Within 5 minutes, a student says, "This is just Harsanyi's Theorem. The social welfare function has to be linear."
  **Mitigation:** Do not shut them down. Validate and pivot.
  **Script:** "Exactly. You've seen the destination. But the rest of the class needs to walk the path. Your job now is not to announce the answer, but to **justify the coefficients**. If the form is linear, why are the weights equal? Why not give the person with the most at risk higher weight? Convince your committee."
  *This turns the game from "Discover the Form" to "Negotiate the Parameters," which is equally valuable.*

  ### 2. The Interpersonal Comparison Strike
  **Risk:** A student refuses to add their "10" to another's "10," saying, "My utility is mine."
  **Mitigation:** This is why the **Stipulation** in Phase 1 is vital.
  **Script:** "For the purpose of this simulation, the Foundation has calibrated these metrics. Think of them as 'Welfare Dollars' funded by a common budget. If you refuse to compare, you cannot make a group decision under risk. You are opting out of the committee."
  *In the debrief, acknowledge this is the weak point of the theorem in the real world.*

  ### 3. The "Re-Normalization" Cheat
  **Risk:** In Round 2, they say, "We'll just divide Member 5's numbers by 10 to make them fit."
  **Mitigation:** Remind them of the **Fixed Rule** constraint.
  **Script:** "Your rule was 'Sum the Utilities.' It did not say 'Sum the Utilities after the TA adjusts them to feel fair.' If you adjust the inputs based on the profile, your rule is not a rule; it's ad-hoc negotiation. Harsanyi's weights are fixed *before* the profile is known."

  ---

  ## 5. Limitations: What the Activity Cannot Reproduce

  **The Ex-Ante vs. Ex-Post Distinction:**
  *   **The Shortfall:** In the activity, students see the utility numbers *before* agreeing on the rule (Round 1). In Harsanyi's stronger ethical argument (Utilitarianism), the weights are justified because agents agree *behind a Veil of Ignorance* (before knowing their utility functions).
  *   **The Consequence:** In class, they might choose equal weights because they see everyone has similar stakes in Round 1. In the true theorem, the weights must be equal *regardless* of the stakes, based on probability of identity.
  *   **How to Cover:** In the debrief, explicitly state: "Today you chose weights looking at the cards. Harsanyi argues you should choose the weights *before* you know who you are. If you had to pick the rule before receiving your card, would you still have risked a Dictatorship? No. You would have insured yourself with equal weights. That is the philosophical bridge from 'Linear' to 'Utilitarian'."

  **The "Intensity" Nuance:**
  *   **The Shortfall:** The activity uses a "New Member" to show the impasse. Harsanyi's theorem is often about fixed populations with changing intensities.
  *   **How to Cover:** Explain that Member 5 represents "Intensity." If an existing member's stakes suddenly doubled, your fixed weights would ignore that intensity. The theorem forces you to ignore intensity changes unless they are reflected in the vNM utility scale *at the time of weighting*.

