answer: |-
  You are describing a specific social logic that has emerged in small, high-trust, progressive institutions (co-ops, NGOs, academic departments) over the last decade. You are correct that existing taxonomies (reputation vs. dignity vs. victimhood cultures) are too macro to capture the micro-mechanism you're seeing, and "strategic framing" is too cynical to capture the sincerity of the participants.

  Here is the carving you need for your procedures document.

  ### The Nearest Established Concept: **Victimhood Culture**
  The closest sociological framework is **Victimhood Culture** (Bradley Campbell & Jason Manning).
  *   **The Fit:** It describes a shift from "Dignity Culture" (ignore slights, handle it yourself) to a system where moral status is accrued by displaying vulnerability and securing third-party validation (the committee). It explains Instance One: the goal isn't repair (private apology); the goal is public validation of the victim status.
  *   **Where It Breaks:** Victimhood Culture is a *macro* description of society. It doesn't explain the *micro* psychology of the individual who isn't lying. It also doesn't account for Instance Two, where the "victim" status is assigned *against* the subject's will. Victimhood Culture assumes the claimant *wants* the status; your Instance Two shows the system *imposing* it.

  ### The Missing Mechanism: **Habitus** + **Double Bind**
  To capture the "not lying" aspect, you need Pierre Bourdieu's concept of **Habitus**. This explains how people follow rules of a "game" (status seeking) without consciously calculating the move. They genuinely feel the hurt *because* the social system rewards the articulation of hurt. It is not a costume; it is their lived reality within the system.

  To capture Instance Two (denial = proof), you are looking at an **Epistemic Double Bind**. This is a logical structure where all available responses confirm the accuser's premise.
  *   *Claim:* "You are harmed."
  *   *Response A:* "Yes." (Confirms claim).
  *   *Response B:* "No." (Confirms claim: "You are too harmed to know it.")
  *   **Result:** The claim becomes unfalsifiable.

  ### The Concept for Your Procedure: **Constitutive Grievance**
  Since no single existing term covers the fusion of sincere feeling, status function, and epistemic closure, I propose you use **Constitutive Grievance** in your drafting.

  **Definition:**
  A Constitutive Grievance is a complaint where the articulation of harm functions simultaneously as (1) a report of internal injury and (2) a constitutive act of social positioning. In these cases, the *processing* of the grievance confers moral standing on the complainant, such that a private resolution is insufficient because it fails to enact the required public shift in status. Crucially, the grievance may become **Reflexive**: the system claims authority to define the harm even over the subject's objection, treating denial as evidence of the harm's depth.

  **Why this name?**
  "Constitutive" signals that the grievance *creates* the social reality it describes. It tells your committee: "We are not just fixing a broken thing; we are building a status relationship."

  ### Boundary Cases (For your Triage Protocol)
  To use this in your procedures, you need to distinguish Constitutive Grievances from standard disputes. Use these boundary cases to train your committee:

  **1. Remediable Dispute (Not Constitutive)**
  *   **Signal:** The complainant specifies a material or behavioral change that would resolve the issue.
  *   **Test:** If you offer the specific change privately, do they accept?
  *   **Example:** "The laundry schedule conflicts with my shift. If we swap Tuesdays, I'm good."
  *   **Procedure:** Mediation → Agreement → Close.

  **2. Expressive Harm (Not Constitutive)**
  *   **Signal:** The complainant seeks emotional validation but explicitly declines public escalation or status shifts.
  *   **Test:** Do they resist having "victim" status assigned to them?
  *   **Example:** "What he said hurt my feelings. I want an apology, but I don't want a membership meeting about it."
  *   **Procedure:** Restorative Conversation → Apology → Close.

  **3. Constitutive Grievance (The Target Zone)**
  *   **Signal:** The language focuses on safety/dignity, but private remedies are rejected as "insufficient" or "silencing." The stakes escalate from repair to standing.
  *   **Test:** Does the proposed solution require the *accused* to lose standing publicly for the *complainant* to feel safe?
  *   **Example:** "A private apology doesn't count because the harm was public." (Instance One).
  *   **Procedure:** Requires a distinct track. You cannot "solve" this with repair; you must adjudicate status. This requires higher quorum, explicit voting, and clear findings of fact to prevent the "Double Bind."

  **4. Paternalistic Attribution (The Danger Zone)**
  *   **Signal:** The committee asserts harm exists despite the subject's denial.
  *   **Test:** Is the "harm" defined by the committee's theory rather than the member's experience?
  *   **Example:** "She says she's fine, but we know this dynamic is oppressive." (Instance Two).
  *   **Procedure:** **Stop.** Your procedures should explicitly forbid assigning victim status to an unwilling subject. This is the point where the committee becomes the aggressor.

  ### Procedural Recommendation
  Your procedures document turns on this distinction. If you treat a Constitutive Grievance as a Remediable Dispute, you will fail (Instance One). If you treat a Remediable Dispute as Constitutive, you escalate unnecessarily. If you allow Paternalistic Attribution, you violate autonomy (Instance Two).

  **Drafting Clause Suggestion:**
  > *"The Committee distinguishes between **Remediable Harms** (resolved by behavioral change or private repair) and **Constitutive Grievances** (where the resolution requires public acknowledgment of standing). In all cases, the Committee shall not assign a status of 'harmed' to a member who explicitly declines that designation. A member's denial of harm shall be treated as evidence of their current state, not as evidence of repression."*

  This clause blocks the Instance Two logic while giving you the vocabulary to handle Instance One without cynicism. It acknowledges that the harm is real (to them) while recognizing that the *solution* required is political, not just interpersonal.
