answer: |-
  ### 1. Candidate Concepts and Ranking

  Several frameworks approach this pattern, though none capture the granularity mechanism perfectly.

  **1. Violation of the Independence Principle (Epistemology):** This principle (associated with Christensen, Kelly, Elga) states you cannot use your own reasoning on the disputed question to judge whether a dissenter is your peer. This ranks highest because your subdivision relies on assessing their competence *using the very standards in dispute*. However, standard discussions assume a binary peer/not-peer judgment, not iterative subdivision.

  **2. Motivated Skepticism (Psychology):** This describes disproportionate scrutiny of opposing views. It fits the *cause* (identity protection) but not the *structure*. It is too blunt to explain why each step feels locally rational.

  **3. No True Scotsman (Informal Logic):** This involves redefining a group to exclude counterexamples. It is structurally similar but usually implies false predicates. You insist your predicates (specific skills) are true. This is a "True Scotsman" variant where the definition of "Scotsman" becomes infinitely granular.

  **4. Epistemic Partiality (Ethics/Epistemology):** This covers favoring your own side. It is accurate but descriptive rather than mechanistic. It explains the bias, not the method of dissolution.

  ### 2. Identification and the Peerhood Worry

  There is no single standard term for this specific granular maneuver, but it is best understood as a **weaponized vagueness exploitation of the Independence Principle**.

  The familiar worry in disagreement literature is that determining who is "equally well-placed" often requires settling the disputed question (e.g., to know if they are right about the evidence, you must know the evidence). Your pattern is a sophisticated exploitation of this circularity. You are not simply assuming they are wrong; you are assuming that *because* they are wrong, they must lack a specific sub-competence that explains the error.

  This differs from a standard Independence violation because it hides behind legitimate specialization. In a standard violation, I say, "You are wrong, so you aren't a peer." You say, "You are wrong, so you must lack skill X, and without skill X, you aren't a peer on *this specific sub-question*." The obligation to revise is dissolved because the peer group shrinks to null before the revision rule triggers.

  It is not merely a version of the worry; it is a procedural method to ensure the worry never resolves in favor of the dissenter. By increasing the resolution of the "peer" metric, you ensure the metric never lands on a dissenter. The independence principle is violated not in the conclusion, but in the *selection of the criteria* for peerhood.

  ### 3. Coining a Term and Drawing Boundaries

  Since existing terminology lacks precision here, I propose **Epistemic Hyper-Specification**.

  **Definition:** Epistemic Hyper-Specification occurs when an agent incrementally increases the resolution of competence criteria required for peerhood, such that each incremental increase is locally warranted by the subject matter, but the aggregate effect is the exclusion of dissenters who would qualify under coarser, pre-disagreement standards.

  **Boundary Cases:** Legitimate specialization exists when the sub-skill is *causally prior* to the conclusion. For example, requiring knowledge of renal clearance to judge a kidney drug is legitimate because that knowledge is required regardless of the conclusion. Illegitimate hyper-specification occurs when the sub-skill is identified as necessary *only after* knowing the conclusion. If you only demand knowledge of "subgroup data" because the dissenter rejected the subgroup analysis, that is hyper-specification.

  **The Test:** Apply the **Counterfactual Agreement Test**. Ask: "If this dissenter agreed with my conclusion but lacked this specific sub-skill, would I still disqualify them as a peer?" If you would accept them as a peer despite the missing skill when they agree with you, but require the skill when they disagree, you are hyper-specifying.

  **Internal Possibility:** I must be honest: this test is nearly impossible to apply from inside the pattern. The feeling of "warranted detail" is phenomenologically identical to bias. The granularity feels like rigor. You cannot reliably self-audit this in the moment because the motivation is invisible to the agent. You require an external auditor or a pre-commitment device.

  ### 4. Implications for the Disagreement Debate

  This phenomenon poses a severe challenge to both sides of the disagreement debate, but primarily to **Conciliationism**.

  Conciliationism relies on the identification of peers to trigger the obligation to revise. If peerhood is vulnerable to hyper-specification, the conciliationist rule becomes practically inert in high-stakes contexts. The rule survives intact only in low-stakes cases where identity does not trigger the subdivision mechanism. Thus, conciliationism risks becoming a theory only for trivial disagreements.

  The **Steadfast View** is less threatened but implicitly encouraged. If steadfastness allows you to retain your belief while scrutinizing the dissenter's credentials, hyper-specification provides a rational-looking pathway to maintain steadfastness without appearing dogmatic.

  **Conclusion:** Both positions need a procedural rule fixing the **level of granularity** in advance of any particular disagreement. In deliberative bodies, this means defining the relevant competence units *before* the evidence is reviewed. You cannot decide what counts as "relevant expertise" after you know who disagrees with you. Without pre-commitment to the resolution of peerhood, the obligation to revise will always be dissolvable by those with the power to define the metrics.
