answer: |-
  Here is the complete operational plan. It is designed to look like a rigorous modeling exercise rather than a "game," which should satisfy your supervisor. It fits on one double-sided sheet, runs in 80 minutes, and forces the theoretical conflicts to surface through mechanics rather than lecture.

  ### Part 1: The Materials (One Double-Sided Sheet)

  You need to format this into a single document.
  **Side 1:** Rules, Ledger, and Survey.
  **Side 2:** The 22 Private Status Cards (arranged in a grid to be cut out).

  #### **Side 1 Text: The Allocation Protocol**

  **HEADER:** DISTRIBUTIVE METRICS SIMULATION // SECTION 03
  **OBJECTIVE:** Maximize your personal Achievement Points (AP).
  **INITIAL ENDOWMENT:** Every participant receives 20 Resource Tokens.

  **PHASE 1: PRODUCTION**
  1.  Check your **Private Status Card**. Do not show it to anyone.
  2.  Calculate your **Conversion Rate**. This determines how many Tokens you must spend to gain 1 AP.
  3.  Some cards require an **Upfront Cost**. Pay this immediately from your 20 Tokens.
  4.  Spend your remaining Tokens to generate AP.
  5.  Record your final Token balance and AP total in the **Ledger** below.

  **PHASE 2: SUBJECTIVE ASSESSMENT**
  1.  On a scale of 1–10, rate your **Satisfaction** with your current outcome.
  2.  1 = Completely Dissatisfied, 10 = Completely Satisfied.
  3.  Record this in the Ledger. Do not discuss this number with peers yet.

  **PHASE 3: REDISTRIBUTION PROPOSAL**
  1.  The Section will propose a rule to redistribute Tokens or AP.
  2.  Proposals must be specific (e.g., "Take 5 tokens from everyone with >15 AP and give to everyone with <5 AP").
  3.  Majority vote enacts the rule.
  4.  Recalculate AP based on the new distribution.

  **LEDGER (Fill this out privately)**
  | Round | Tokens Start | Upfront Cost | Tokens Spent | AP Earned | Tokens Left | Satisfaction (1-10) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | 20 | | | | | |
  | **3** | | | | | | |

  ***

  #### **Side 2 Text: Private Status Cards**
  *(Instruct students to cut these out immediately. There are 22 boxes.)*

  | **CARD 1-12 (Standard)** | **CARD 13-17 (Constraint)** |
  | :--- | :--- |
  | **Type:** Standard Efficiency | **Type:** Physical Constraint |
  | **Upfront Cost:** 0 Tokens | **Upfront Cost:** 0 Tokens |
  | **Conversion:** 1 Token = 1 AP | **Conversion:** 2 Tokens = 1 AP |
  | *Note: Your conversion rate is due to standard technology.* | *Note: Your conversion rate is due to involuntary physical factors.* |
  | **CARD 18-20 (Preference)** | **CARD 21-22 (Structural)** |
  | **Type:** Expensive Preference | **Type:** Structural Barrier |
  | **Upfront Cost:** 0 Tokens | **Upfront Cost:** 5 Tokens |
  | **Conversion:** 2 Tokens = 1 AP | **Conversion:** 1 Token = 1 AP |
  | *Note: Your conversion rate is due to your personal standards for quality.* | *Note: This cost is a tax/fee required to participate in the market.* |

  *(Note for TA: The math for Constraint and Preference is identical. The only difference is the justification text. This is the trap.)*

  ---

  ### Part 2: Run of Show (80 Minutes)

  **00:00 – 00:10: Setup & Framing (Crucial for Supervisor)**
  *   **Do not say:** "We're going to play a game."
  *   **Do say:** "Today we are operationalizing three competing metrics of justice. We are going to run a simulation to stress-test how these metrics handle variance in human conversion factors. Please take one sheet. Cut out the card on the back. Keep it private."
  *   Distribute 20 paper slips (Tokens) to each student.
  *   **Rule:** No talking during Phase 1. Violation results in a 5-Token fine.

  **00:10 – 00:25: Phase 1 (Production)**
  *   Let them calculate. Walk around.
  *   **Watch for:** The "Constraint" and "Preference" students realizing they can only get 10 AP max, while "Standard" get 20. The "Structural" students start with 15 Tokens, so max 15 AP.
  *   **Collect Data:** Have them fill out the Ledger (Side 1). Collect the sheets briefly or have them raise hands to report numbers anonymously if you don't want to collect paper. *Better:* Have them write their AP and Satisfaction score on a sticky note and put it on the board. This creates a public histogram without revealing *who* has which card yet.

  **00:25 – 00:35: The Crisis (The "Welfarist" Trap)**
  *   Look at the board. You will see a cluster of high AP/High Satisfaction (Standard) and low AP/Low Satisfaction (Constraint/Structural).
  *   **The Pivot:** Ask the class: "Look at the Satisfaction scores. The resource distribution was equal (20 tokens). The outcome is not. Is this unjust?"
  *   **The Trap:** Ask the "Constraint" group (privately, or just generally): "Did your satisfaction drop because you couldn't buy enough AP, or because you saw others had more?"
  *   **Key Moment:** Ask the "Preference" group (Cards 18-20): "You have the same math as the Constraint group. Do you feel you deserve compensation?"
      *   *Likely Outcome:* The class will say "No" to Preference and "Yes" to Constraint.
      *   *Why this matters:* You have just killed strict Welfarism (satisfaction is the same) and strict Resource Egalitarianism (tokens were the same).

  **00:35 – 00:55: Phase 3 (Legislative Redistribution)**
  *   Tell them they can now vote on a redistribution rule to fix the "injustice."
  *   **Option A (Resource Equalization):** Everyone ends with 20 Tokens. (Resets the game to Round 1. Useless).
  *   **Option B (Welfare Equalization):** Transfer tokens until Satisfaction Scores are equal. (Requires the "Preference" kids to get *more* tokens than the "Constraint" kids to reach the same satisfaction, which angers the class).
  *   **Option C (Capability Threshold):** Ensure everyone reaches a minimum of 10 AP, regardless of token cost.
  *   Let them argue. The "Standard" majority (12 students) will likely block redistribution that hurts them.
  *   **Force a Vote:** Pick one rule. Apply it. Have them recalculate Round 3 on their Ledger.

  **00:55 – 01:20: The Debrief (The Theory)**
  *   This is where you earn your pay. Map their experience to the syllabus.
  *   **Write three columns on the board:** Resources | Welfare | Capabilities.
  *   **Column 1 (Resources):** "In Round 1, everyone got 20 tokens. That was Dworkin's 'Equality of Resources.' Why did it fail?"
      *   *Answer:* Different conversion rates (Disability/Constraint).
  *   **Column 2 (Welfare):** "We looked at Satisfaction Scores. That's Utilitarianism/Welfarism. Why did it fail?"
      *   *Answer:* The 'Expensive Preference' students (Cards 18-20). If we equalize satisfaction, we have to give the picky eaters *more* tokens than the disabled students. The class rejected this intuitively.
  *   **Column 3 (Capabilities):** "Some of you argued for a minimum AP threshold (10 AP). That is Sen's 'Capability Approach.' It focuses on what you can actually *do* (function), not what you *have* (tokens) or how you *feel* (satisfaction)."
  *   **The Kicker:** Ask the "Structural" students (Cards 21-22). "You lost 5 tokens upfront. No one noticed. Resource equality ignored your historical disadvantage. Capability equality fixes it by guaranteeing the outcome."

  ---

  ### Part 3: Failure Modes & Mitigation

  **1. The Market Clearing Problem**
  *   **Risk:** Students trade tokens. "Standard" students buy tokens from "Constraint" students because they get more AP per token.
  *   **Result:** The disabled students sell their tokens for a profit (more tokens than they can use) but end up with 0 AP. The able-bodied get all the AP.
  *   **Why this is actually good:** It proves that **Free Exchange + Resource Equality ≠ Justice.** It creates a stark visual of capability deprivation.
  *   **Mitigation:** If they start trading, let them. In the debrief, highlight: "The market optimized efficiency, not justice. The 'Constraint' group is now rich in tokens but incapable of functioning. Is that fair?"

  **2. The "Expensive Taste" Mob**
  *   **Risk:** The class identifies the "Preference" students (Cards 18-20) and demands they be punished or excluded.
  *   **Result:** Hostility.
  *   **Mitigation:** Intervene immediately. "Hold on. In this model, their card is private. You don't know who they are. You are reacting to the *idea* of expensive tastes. Why does the class feel moral outrage at 'Preference' but pity for 'Constraint' when the math is identical?"
  *   **Teaching Point:** This is the Cohen vs. Dworkin debate. Do we compensate for unchosen disadvantages only?

  **3. The Supervisor "Waste of Time" Critique**
  *   **Risk:** Supervisor walks in, sees paper chips, writes "Gamey" on eval.
  *   **Mitigation:**
      *   **Language:** Never use the word "game." Use "Simulation," "Protocol," "Model," "Variable."
      *   **Handout:** The single sheet looks like a problem set, not a board game.
      *   **Debrief:** Spend a solid 25 minutes on the theory. The activity is just the data generation mechanism.
      *   **Email:** Send your supervisor a brief note beforehand: *"Running a distributive justice simulation on Tuesday to operationalize the Sen/Dworkin distinction. Want to ensure they grasp the metrics before the midterm."*

  **4. Boredom / Fizzling**
  *   **Risk:** Students do the math silently and nothing happens.
  *   **Mitigation:** You need to stir the pot in Phase 2. When collecting satisfaction scores, announce: "I'm seeing a lot of 3s and 4s in the back row. I'm seeing 9s in the front. What is the source of this variance?" Force the conflict.

  ---

  ### Part 4: What This Activity Cannot Do (Limitations)

  You need to be honest about this in the debrief so you don't oversell the Capability Approach.

  1.  **Functionings vs. Capabilities:** The game measures **Functionings** (Achievement Points actually earned). Sen's Capability Approach is about the *freedom* to achieve, even if you choose not to.
      *   *Example:* A faster student *could* get 20 AP but chooses to fast for religious reasons (5 AP). In this game, they look "deprived." In Sen's view, they have high capability (freedom) but low functioning (choice).
      *   *Fix:* Mention this explicitly. "We measured outcomes today. Real Capability is about the size of your opportunity set, not just where you land."
  2.  **Adaptive Preferences:** The "Constraint" students might lower their satisfaction rating to cope (happy slave problem).
      *   *Fix:* Ask them in the debrief: "If the Constraint group had rated their satisfaction a 10 despite having low AP, would we still owe them help?" (This breaks Welfarism completely).
  3.  **Complexity of Conversion:** In real life, conversion rates aren't fixed numbers. They depend on social context, stigma, etc. The game simplifies this to arithmetic.

  ### Part 5: TA Script for the "Moment of Truth"

  *When the Satisfaction Scores are revealed and the "Constraint" group shows low scores:*

  > "Stop. Look at the board. We started with equal resources. 20 tokens each. By the standard of Resource Egalitarianism, this is a just distribution. But look at the Satisfaction column. Look at the AP column.
  >
  > If we fix this by giving more tokens to the low-scorers, we are Welfarists. But wait—(point to Preference cards)—if we give tokens to the 'Expensive Preference' group to make them happy, the 'Standard' group gets angry. They say it's not fair to subsidize luxury.
  >
  > So Resources fail. Welfare fails. What is left? The only thing left is the **AP itself**. The ability to actually achieve the outcome. That is the Capability turn. We stop asking 'Do they have tokens?' and start asking 'Can they eat?'"

  ### Final Checklist for You
  1.  **Printer:** Test print the sheet *before* section. Ensure the cards on Side 2 are cuttable.
  2.  **Tokens:** Bring 500 slips of paper or a bag of poker chips. Don't rely on them having change.
  3.  **Timer:** Keep strict time. If Phase 1 runs long, shorten the voting phase, not the debrief.
  4.  **Authority:** If a student says "This is childish," reply: "It's a simplified model to isolate variables. Real policy works the same way, just with slower data."

  This setup gives you the "aha" moment without the jargon, creates the specific conflict between expensive tastes and disabilities, and produces a tangible dataset for your debrief. Good luck.
