answer: |-
  The standard diagnosis of Pascal's Mugging is comforting. It treats the problem as a technical glitch in how we handle infinitesimal probabilities. We tell ourselves that the error lies in the priors, or in unbounded utility functions, or in the complexity of the claim. We assume that if we just tune the epistemology correctly, the demand to hand over five dollars disappears. The reliable mugger variant strips away this comfort. By establishing credibility through empirical demonstration—vanishing sand, predicting the past, honoring side bets—the mugger forces your credence up to a respectable level, say 0.6. This does not solve the puzzle; it exacerbates it. It transforms a mathematical curiosity into a normative crisis.

  This version is worse because it systematically dismantles every escape route available in the standard case. In the standard scenario, you can claim your prior on the mugger's power is naturally infinitesimal, outweighing any utility. Here, you have observed the power. Bayesian updating has done its work; your credence is no longer a matter of abstract skepticism but of empirical induction. You cannot blame the priors when the posterior is driven by direct verification.

  Similarly, the appeal to bounded utility fails. If you claim utility caps out, the reliable mugger simply scales the threat. They have already demonstrated control over matter and information; there is no reason to doubt they can torture or save enough people to hit your bound. Once the threat hits the cap, the decision reduces to a simple probability check: is the chance they are telling the truth about hitting the cap greater than the cost of five dollars? With a 0.6 credence, it is.

  The appeal to description length or Kolmogorov complexity also collapses. Usually, we argue that claims about vast hidden powers are complex and therefore penalized. But the mugger has provided physical evidence. The complexity of the hypothesis is irrelevant when the hypothesis has successfully predicted observable data twenty times in a row. You are no longer evaluating the complexity of a claim; you are evaluating the track record of an agent. Finally, the objection that testimony of this kind is inherently dubious is nullified. This is not bare testimony. It is experimental verification. You saw the sand vanish. You checked the past records. To reject this evidence is not to be rational; it is to be dogmatic.

  By removing these shields, the reliable mugger reveals the naked structure of the theory: it licenses rational exploitation. In the standard case, we pretend the problem is that the math breaks at the limits. In this variant, the math works perfectly. The theory tells you, clearly and consistently, that you should hand over your money. You are being exploited, and you are doing so correctly by your own lights. This is far more damaging than a probability puzzle. It suggests that the decision theory itself mandates vulnerability to coercion whenever the coercer can demonstrate sufficient power.

  Now, consider the replies you will hear. The first is the shrug: "Fine, they should just pay. That's the correct answer, so where's the problem?" This misses the normative weight of the conclusion. If rationality requires you to submit to any agent who can demonstrate high power and high stakes, then rationality is incompatible with security. A rational agent becomes a beacon for extortionists. If the theory demands you empty your wallet whenever a sufficiently powerful entity asks, the theory fails to guide action toward flourishing; it guides action toward submission. It defines rationality as the absence of self-preservation instincts in the face of verified threats.

  The second reply argues that the demonstrations support a high credence in the *mechanism*, not the *intentions*. Perhaps they can vanish sand, but why believe they will torture trillions? This ignores the setup. The mugger honored fair side bets. They proved honesty in small transactions. Trust is transitive in this context; an agent who proves they can manipulate reality and proves they are honest about small stakes provides strong evidence they are honest about large ones. To grant the power but deny the intention without specific evidence of deceit is to arbitrarily slice the hypothesis after the evidence has already been admitted.

  The third reply claims the case is question-begging: if each of the twenty demonstrations had the mugging structure, you've just stacked twenty muggings. But they didn't. Vanishing sand grains and winning cheap bets are not existential threats. They are low-stakes verifications. They do not trigger the mugging logic themselves because the utility involved is negligible. They serve only to establish the reliability of the agent before the high-stakes demand is made. The paradox arises only at the climax, but the foundation is built on mundane, non-paradoxical evidence.

  So, if this argument holds, what actually has to give? We cannot fix this by tweaking priors or bounding utilities, as the reliable mugger bypasses those constraints. The assumption that must be attacked is the core tenet that rational action is determined solely by the expected utility of the immediate act. The reliable mugger shows that act-by-act maximization makes you a target. The solution lies not in epistemology, but in policy. We must reject the idea that an agent should evaluate each coercive offer in isolation. Instead, rationality requires adopting a policy of ignoring certain classes of threats, even when the immediate expected utility calculation says otherwise. We must be the kind of agent who does not pay muggers, even reliable ones, because being that kind of agent yields better long-term outcomes than being the kind of agent who calculates correctly and pays. The error is not in the math of the expectation; it is in the assumption that expectation maximization is the sole arbiter of rational choice in adversarial contexts.
