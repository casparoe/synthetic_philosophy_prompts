      *   *Relevance Logic:* This changes the wiring (implication), not just adds a breaker. The analogy suggests adding a component, not rewiring.
      *   *Partial Aptness:* In LP (Logic of Paradox), you keep classical tautologies but allow true contradictions. This looks like "breakers in specific rooms." But does this rescue neutrality? No, because LP still treats the contradiction as a specific semantic value (Both), distinct from True. It manages the "fault," it doesn't validate it as "normal operation."

