      *Quarantine Table:* This is definitely not paraconsistent logic. It's classical logic with a filtered input. $DB' = DB \setminus \{contradictions\}$. Then $DB' \vdash Q$. This avoids explosion by avoiding the premise $A \land \neg A$. Paraconsistent logic allows $A \land \neg A$ in the premise set and still derives non-trivial $Q$. The engineer's proposal is consistency restoration, not paraconsistency. This is a vital distinction for Claim 2.

