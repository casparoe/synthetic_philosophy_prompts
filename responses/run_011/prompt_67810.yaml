          5.  Engineer-level failures vs. successes (Curry paradox, relevance logic, partial aptness).
          6.  Better analogies (Contagion, etc.) and split pictures.

  2.  **Analyze the Core Analogy (Electrical vs. Logical):**
      *   *Source Domain:* Electrical circuits. Current flows. Short circuit = low resistance path causing high current. Fuse/Breaker = safety device切断 flow. Load = lights/appliances.
      *   *Target Domain:* Logical inference. Premises imply conclusions. Contradiction = $A \land \neg A$. Explosion = $\vdash B$ for any $B$. Paraconsistency = block explosion.
