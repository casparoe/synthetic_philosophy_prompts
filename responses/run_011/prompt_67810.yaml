  3.  **Drafting Section 1: The Explicit Mapping:**
      *   *Wire:* Inference rules/implication? Or the connection between premises and conclusions? Let's say *Inference Channels*.
      *   *Current:* Information flow? Derivability? Let's say *Entailment/Proof*.
      *   *Short Circuit:* Contradiction ($A \land \neg A$).
      *   *Fuse (Classical):* The Principle of Explosion itself (or the lack of protection). Actually, the fuse *blowing* is the triviality. The *absence* of a breaker allows the blow.
      *   *Breaker (Paraconsistent):* The mechanism that blocks explosion (e.g., relevant implication, LP semantics).
      *   *Remainder of House:* Consistent subsets of the database/theory.
