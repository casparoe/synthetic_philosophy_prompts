      *   *"Physical Laws":* Does it mean physics or laws concerning physical things? In 1857 positivism, it usually means "laws governing physical phenomena" that can be observed like natural laws. It's not just "things," it's "regularities."
      *   *Scholarly Consensus:* Historians of historiography generally agree Buckle is a Positivist. He wants history to be like physics. The split reflects the Positivist distinction between the "theological/metaphysical" stage (imagination/superstition) and the "positive" stage (observable social organization).
