answer: |-
  You have identified a precise and unsettling gap in our moral vocabulary. You are describing a failure of authority that stems not from corruption, but from *exemption*.

  There is no single, canonical term in the philosophical literature that captures this exact phenomenon, though it sits squarely within the debate on **"Standing to Blame."** Philosophers like R. Jay Wallace, Macalester Bell, and Gary Watson have mapped the conditions under which a person loses the right to censure another. Typically, they focus on *hypocrisy* (you did it too) or *complicity* (you benefited from it).

  Your case is different. You are not hypocritical; you are *untested*. Your hands are not dirty; they are suspiciously clean.

  Here is the carving of the territory you are standing in, the distinctions from its neighbors, and a proposed term for the specific deficit you are experiencing.

  ### 1. The Nearby Territory

  To understand what this is, we must first see what it is not.

  **Hypocrisy (The Pot Calling the Kettle Black)**
  *   **The Concept:** The accuser has committed the same fault they are condemning.
  *   **Why it differs:** Hypocrisy is a charge of *inconsistency*. The retort is: "You did this too." In your case, the retort is: "You have *never* had to do this." Hypocrisy undermines blame because the accuser implicitly claims an exception for themselves. Your situation undermines blame because the accuser implicitly claims a virtue they never had to earn. Hypocrisy is a moral failure; your position is a circumstantial privilege.

  **Moral Luck (Nagel/Williams)**
  *   **The Concept:** The assessment of an agent's character depends on factors outside their control (e.g., a drunk driver who hits a pedestrian is judged more harshly than one who does not, though their vice was identical).
  *   **Why it differs:** Moral luck concerns how we judge the *sinner*. You are asking about how we judge the *judge*. Moral luck explains why the treasurer failed (pressure, circumstance). It does not explain why your condemnation of that failure feels "indecent." Your concept is the inverse of moral luck: it is the **illegitimacy of the lucky judging the unlucky.**

  **Standing to Blame (The Philosophical Home)**
  *   **The Concept:** The normative power to hold someone accountable. One can lose standing through hypocrisy, complicity, or lack of concern.
  *   **Why it differs:** Current literature focuses on standing lost through *fault*. You are describing standing lost through *freedom from fault*. It is a **Standing Deficit of Immunity.**

  ### 2. The Proposed Concept: "The Burden of Clean Hands"

  I propose we call this **"The Burden of Clean Hands."**

  This term deliberately inverts the political ethics concept of "Dirty Hands" (the idea that leaders must sometimes do wrong to do right). In your case, the cleanliness of your hands is itself the burden.

  **Definition:**
  > **The Burden of Clean Hands** occurs when moral censure loses its normative force because the censurer's virtue is perceived as a product of exemption rather than resistance. It is the loss of standing incurred when the accuser has never been administered the test they are grading.

  **The Mechanism:**
  Blame functions as a form of moral communication. For it to land, there must be a presumption of shared vulnerability. When the blamed party perceives that the blamer is *immune* to the temptation (due to wealth, temperament, or circumstance), the blame is re-categorized from "correction" to "observation." It feels like a bird criticizing a fish for swimming poorly. The criticism may be technically accurate, but it lacks *solidarity*, and without solidarity, censure feels like aggression.

  ### 3. The Carving: Where the Concept Stops

  You asked for the edges. Where does the Burden of Clean Hands apply, and where does it dissolve?

  **A. The Judge Sentencing a Thief (Does Not Apply)**
  *   **Why:** The judge does not speak for themselves; they speak for the *Law*. Their standing is institutional, not personal. We do not require a judge to have stolen bread to sentence a thief, because the authority derives from the social contract, not shared vulnerability.
  *   **Edge:** If the judge moves from sentencing to *moralizing* ("You are a bad person"), the Burden of Clean Hands kicks in. If they stick to the law ("You broke the code"), it does not.

  **B. The Parent Disciplining a Child (Does Not Apply)**
  *   **Why:** Parental standing is fiduciary. It is based on the duty of care and the goal of socialization, not on moral equivalence. A parent must forbid a child from touching a hot stove even if the parent has never touched one.
  *   **Edge:** If the parent shames the child for a human weakness the parent has never faced (e.g., a naturally calm parent shaming a neurodivergent child for meltdowns), the Burden of Clean Hands applies. Duty covers instruction; it does not cover shaming.

  **C. The Stranger Writing Online (Fully Applies)**
  *   **Why:** Strangers have no institutional standing and no relational duty. Their censure relies entirely on perceived moral authority. If they are visibly exempt from the struggle they are condemning, their blame is not just weightless; it is often received as violence.
  *   **Edge:** There is no edge here. This is the purest form of the burden.

  **D. The One Tested and Passed (The Inverse)**
  *   **Why:** Someone who faced the same pressure and *did not* fail has **Earned Standing**. Their virtue is proven, not assumed.
  *   **Edge:** The line is drawn at *exposure*. If you can say, "I have been this tired, and I missed the deadline too, but here is how we fix it," you shed the burden. If you say, "I have never been this tired, so you should not have missed the deadline," you carry the burden.

  ### 4. Application for the Chair

  You are in a difficult position because you cannot manufacture shared suffering, nor should you feign it. However, you can mitigate the **Burden of Clean Hands** by shifting the mode of communication.

  1.  **Acknowledge the Immunity:** You do not need to apologize for your stability, but you must acknowledge its effect. "I recognize that my schedule allows me a flexibility you do not have. I am not judging your commitment; I am managing the constraint."
  2.  **Shift from Character to System:** The Burden of Clean Hands attaches to *character condemnation* ("You are unreliable"). It does not attach to *systemic correction* ("This workflow is brittle"). If you frame the failure as a structural vulnerability rather than a moral defect, your exemption matters less.
  3.  **Invite the Counter-Design:** Ask the person who failed how the system should be built to accommodate their reality. This grants them epistemic authority over their own constraints, balancing your institutional authority.

  ### Summary

  You are experiencing the **Burden of Clean Hands**. It is distinct from hypocrisy because your record is clean; it is distinct from moral luck because it concerns the authority of the blamer, not the culpability of the blamed. It applies wherever moral authority relies on solidarity rather than office.

  The resentment you meet is not a rejection of the standard, but a rejection of the *source*. The standard is valid; your hands are simply too clean to hold it without gloves. Acknowledge the gloves, and the weight may return.
