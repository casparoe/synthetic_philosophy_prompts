      *   *Conscience vs. Bluff:* How to test without accusing? Look for consistency and willingness to walk away.

  3.  **Drafting the Procedure (The "One-Pager"):**

      *   *Time Limit:* 2 hours total. Each step needs a time box.
      *   *Step 1: The Red Line Check (Values).* Is anyone saying "We cannot do this"?
      *   *Step 2: The Fact Check (Empirics).* Do we agree on what will happen?
