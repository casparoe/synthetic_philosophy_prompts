      *   **Constraints:** No outside facilitator, no budget, no specialized training for staff. Plain language. One-page steps + explanation.
      *   **Key Issues to Address:**
          *   Distinguishing value weights (tradeable) vs. value absolutes (non-tradeable).
          *   Preventing corruption (buying influence on things that shouldn't be bought).
          *   Baseline drift (today's compromise becomes tomorrow's status quo).
          *   Verifying "conscience" claims without interrogating sincerity.
          *   Resolving empirical disagreements (facts vs. values).
          *   Protecting third parties (future members, clients).
      *   **Specific Tests:** Run the procedure on three live scenarios:
          1.  Winter Budget Split (Beds vs. Housing First + Intake swap).
          2.  Abstinence-Only School Program (Funding swap for Intake support).
