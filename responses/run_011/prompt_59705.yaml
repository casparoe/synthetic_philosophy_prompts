  Also, the "Empirical" step needs to be robust. If they disagree on facts, they can't trade values. I'll add a "Fact Bind" rule.

  *(Refining Scenario 3)*: The user admits their proposal is "measurably the least cost-effective." If the coalition's *explicit* goal is cost-effectiveness, the procedure must kill it. If the goal is "comprehensive care," it lives. Given the "numbers-driven" members dominate the "one pot" logic, I have to assume the metric is efficiency. I will tell the user the truth: The procedure exposes this as a subsidy for their values at the expense of the shared metric.

  *(Refining "Conscience")*: The "Walk Away" test is good. I'll formalize it as the "Veto Justification."

