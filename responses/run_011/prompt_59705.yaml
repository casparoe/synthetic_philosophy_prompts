          *   *Verdict:* Likely Passes, *if* empirical dispute is managed.
      *   *Scenario 2 (Abstinence Only):*
          *   Red Line? Yes. Member 2 says "cannot be party to this."
          *   Trade? Money for Intake support.
          *   Outsiders? Students (clients) are being withheld info.
          *   *Verdict:* Fails Step 1 (Red Line) and Step 4 (Outsiders).
      *   *Scenario 3 (User's Org - Intake Worker):*
          *   Red Line? Numbers orgs say "inefficient." Faith/Disability might say "dignity."
          *   Empirics? User admits it's "least cost-effective."
          *   Trade? What is the user giving up?
          *   Outsiders? Future clients needing beds?
          *   *Verdict:* This is the hard one. The procedure should likely flag this as *failing* the efficiency test unless framed as a "Dignity/Disability Rights" priority rather than "Housing Outcomes." If the goal is "dollars per housed," this fails. If the goal is "coalition diversity of approach," it passes. I need to be honest: Based on the "shared pot" logic of efficiency, this looks like a subsidy for one org's preference.
          *   *Correction:* The prompt says "numbers-driven... say should be cut." The procedure needs to handle the *purpose* of the fund. If the fund is "maximize housing," this fails. If the fund is "support coalition stability," it might pass. I will assume the fund's stated goal is housing outcomes based on the "numbers-driven" dominance. I must be honest: The procedure will likely recommend *against* this unless reframed.

  6.  **Refining the "Conscience vs. Bluff" Mechanism:**

