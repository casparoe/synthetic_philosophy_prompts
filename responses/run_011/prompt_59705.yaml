          *   Step 5: The "Expiration" Test. (Stopping baseline drift).

  4.  **Developing the Explanation (The "Why"):**

      *   Explain *why* each step exists based on the user's theoretical concerns (corruption, baseline, empirical vs. normative).
      *   Flag the "Judgment Calls." (e.g., Determining if a Red Line is real).
      *   Flag the "Failure Points." (e.g., People lying about Red Lines).

  5.  **Running the Scenarios:**

      *   *Scenario 1 (Beds vs. Housing First):*
