answer: |-
  # The Coalition Decision Procedure (One-Page Cheat Sheet)

  **Time Limit:** 120 Minutes. **Facilitator:** Rotating Chair. **Goal:** Decide if a proposal goes to the Board.

  **STEP 1: The "Cannot" Test (20 Mins)**
  *   **Ask:** "Does any member organization state that implementing this proposal violates a core mission constraint or legal/ethical mandate such that you *cannot* participate?"
  *   **Sufficient Answer:** A clear "Yes" with a specific reference to mission/bylaws/law OR a clear "No."
  *   **The Bluff Check:** If "Yes," ask: "If this proposal dies, will your org withdraw from the coalition or refuse to implement the remaining budget?"
      *   If **Yes**: This is a **Red Line**. The proposal dies unless amended to remove the violation. **STOP.**
      *   If **No**: This is a **Preference**. Proceed to Step 2.
  *   **Why:** Distinguishes conscience from bargaining leverage.

  **STEP 2: The Fact Bind (30 Mins)**
  *   **Ask:** "Do we agree on the empirical outcome? (e.g., Will this house X people? Will this withhold info?)"
  *   **Sufficient Answer:** Consensus on the data source OR agreement to disagree using the "Risk Default."
  *   **The Rule:** If members disagree on facts (e.g., "Beds work" vs. "Beds fail"), use the most recent independent data the coalition already possesses. If none exists, default to the option with the **lower irreversible risk** to clients.
  *   **Why:** You cannot trade values if you disagree on reality. Prevents endless debate.

  **STEP 3: The Trade Map (40 Mins)**
  *   **Ask:** "Who values what? Identify the swap."
  *   **Sufficient Answer:** A statement like: "Org A cares mostly about X, Org B cares mostly about Y. This proposal gives A X and B Y."
  *   **The Rule:** Trades are only valid if they exchange **weights**, not **principles**. (e.g., "I'll take less money for more beds" is valid. "I'll ignore harm for money" is not).
  *   **Why:** Captures the "gains from trade" without forcing moral agreement.

  **STEP 4: The Outsider Check (20 Mins)**
  *   **Ask:** "Does this deal trade away something that belongs to someone not in this room?"
  *   **Sufficient Answer:** A list of affected third parties (Clients, Future Members, Public).
  *   **The Rule:** If the deal reduces safety, rights, or information access for clients to save money or win a vote, it **FAILS**.
  *   **Why:** Prevents corruption and selling out the vulnerable.

  **STEP 5: The Sunset Clause (10 Mins)**
  *   **Ask:** "When does this deal expire?"
  *   **Sufficient Answer:** A specific date or grant cycle.
  *   **The Rule:** No permanent precedents. If it works, renew it. If not, it dies.
  *   **Why:** Stops "baseline drift" where temporary compromises become permanent rules.

  **FINAL VOTE:**
  *   If Step 1, 4, or 5 fails: **No Deal.** Do not send to Board.
  *   If Step 2 or 3 fails: **Renegotiate.**
  *   If all pass: **Send to Board.**

  ***

  # Explanation & Mechanics

  ### Why This Structure?
  You identified that gains from trade exist where value *weights* differ, not where *bottom lines* differ. This procedure forces the committee to map those weights (Step 3) while building guardrails against the two specific risks you named: corruption (Step 4) and baseline drift (Step 5).

  ### Step 1: The "Cannot" Test (Conscience vs. Bluff)
  *   **The Problem:** You can't interrogate sincerity.
  *   **The Fix:** The "Walk Away" question. A genuine moral constraint implies a cost to the holder. If they won't pay the cost (withdrawing/refusing implementation), it's a negotiation tactic, not a moral imperative.
  *   **Judgment Call:** The Chair must judge if the "Yes" is specific enough. "It feels wrong" is not specific. "It violates our 501(c)(3) religious exemption" is specific.
  *   **Misfire Risk:** A member might bluff and say "Yes" to the Walk Away question. If called later, they damage trust, but the procedure holds.

  ### Step 2: The Fact Bind (Empirical Disagreement)
  *   **The Problem:** You have numbers-driven orgs vs. faith-based orgs disagreeing on what *works*.
  *   **The Fix:** Stop debating science in a budget meeting. Use existing data. If no data exists, use the **Precautionary Principle** (lower irreversible risk).
  *   **Judgment Call:** Defining "irreversible risk." (e.g., Is a night in a shelter irreversible harm? Is a missed housing slot irreversible harm?). The Chair rules this.
  *   **Misfire Risk:** If the "existing data" is contested, this step stalls. The Chair must have authority to declare the data "sufficient for decision" even if not perfect.

  ### Step 3: The Trade Map (Weights)
  *   **The Problem:** Splitting the difference creates bad programs.
  *   **The Fix:** Explicitly name the trade. "We are buying Org A's support for Beds by giving them Control of Intake." This makes the cost visible.
  *   **Judgment Call:** Determining if a trade is "Principles" or "Weights." (See Scenario 2 below).
  *   **Misfire Risk:** Members may hide principle trades inside weight trades. ("It's just a metric" when it's actually a moral stance).

  ### Step 4: The Outsider Check (Corruption)
  *   **The Problem:** Trading away client rights to balance the budget.
  *   **The Fix:** Clients are not assets. You cannot trade their right to information or safety for coalition stability.
  *   **Judgment Call:** What counts as "harm"?
  *   **Misfire Risk:** The coalition might decide "housing at any cost" overrides "informed consent." This procedure flags it, but cannot force a moral outcome if the coalition is corrupt.

  ### Step 5: The Sunset Clause (Baseline Drift)
  *   **The Problem:** Today's compromise is next year's status quo.
  *   **The Fix:** Hard expiration. Every grant cycle, the board re-approves the logic.
  *   **Judgment Call:** None. This is administrative.
  *   **Misfire Risk:** Administrative inertia. Staff forget to sunset things.

  ***

  # Running The Procedure On Your Live Scenarios

  ### Scenario 1: Winter Budget (Beds vs. Housing First + Intake Swap)
  *   **Step 1 (Cannot):** Both sides say they *prefer* their model, but neither says they will withdraw from the coalition if they lose. **PASS** (These are preferences/weights).
  *   **Step 2 (Facts):** They disagree on efficacy (Beds vs. Housing First).
      *   *Action:* Check coalition data. If data is mixed, apply Risk Default. Usually, shelter is lower irreversible risk than unsheltered, but Housing First is lower risk than institutionalization.
      *   *Assumption:* Let's assume data is inconclusive. Chair rules: Fund the mix that covers the most people tonight (Beds) *unless* Housing First has a waiting list cap.
  *   **Step 3 (Trade):** Org A gets Beds (Throughput). Org B gets Intake Control (Process/Quality).
      *   *Analysis:* This is a valid trade of weights. Org A cares about volume; Org B cares about system design.
  *   **Step 4 (Outsiders):** Does this harm clients?
      *   *Risk:* If Beds are dangerous, yes. If Intake control leads to gatekeeping, yes.
      *   *Mitigation:* Require safety standards on Beds and non-discrimination on Intake.
  *   **Step 5 (Sunset):** Winter budget is inherently temporary. **PASS.**
  *   **Verdict:** **SEND TO BOARD.** This is a classic gains-from-trade scenario. The Intake system is the currency used to balance the moral disagreement on housing models.

  ### Scenario 2: Abstinence-Only School Program (Funding for Intake Support)
  *   **Step 1 (Cannot):** Member 2 says: "We cannot be party to withholding information."
      *   *Bluff Check:* "Will you withdraw?" Member 2 says "Yes, we cannot implement a budget that funds this."
      *   *Result:* **RED LINE.**
  *   **Step 4 (Outsiders):** Even if Member 2 didn't veto, does this trade away client rights?
      *   *Analysis:* Yes. Students (clients) are being denied medical/health information to secure coalition funding. This is selling a third party's rights for organizational budget security.
      *   *Result:* **FAIL.**
  *   **Verdict:** **NO DEAL.** Do not send to Board.
  *   **Why:** This violates Step 1 (Veto) and Step 4 (Corruption). You cannot trade away a client's right to information for grant money, even if everyone at the table consents. The "price" offered (funding intake) is a bribe to ignore harm.

  ### Scenario 3: Your Org's Proposal (Dedicated Intake Worker)
  *   **Step 1 (Cannot):** Numbers-driven members say it's inefficient. Do they say "We cannot participate"?
      *   *Likely:* No. They think it's stupid, but not immoral. **PASS** (Preference).
  *   **Step 2 (Facts):** You admit it is "measurably the least cost-effective use of a staffer."
      *   *Analysis:* The fact is settled. It houses fewer people per dollar.
      *   *Risk Default:* The risk is to the *system's* total capacity.
  *   **Step 3 (Trade):** What are you trading?
      *   *Analysis:* You are asking the coalition to subsidize *relationship-based care* (your value) at the expense of *throughput* (their value).
      *   *Problem:* You haven't offered a trade. You are asking them to accept lower efficiency for your org's specific model.
      *   *Correction:* To pass Step 3, you must frame this as a weight trade. "We trade 5% total throughput for 100% retention of long-term clients who otherwise cycle out." If the data shows they *do* cycle out without you, this is a valid trade of Efficiency for Stability. If the data shows they just stay housed anyway, you are burning money.
  *   **Step 4 (Outsiders):** Does this harm future clients?
      *   *Analysis:* Yes. Every dollar spent on your low-efficiency worker is a dollar not spent on a bed for someone on the street.
      *   *Result:* **FAIL** unless you prove the "Stability" value outweighs the "Throughput" cost.
  *   **Step 5 (Sunset):** Easy to add.
  *   **Verdict:** **LIKELY NO DEAL (As Currently Framed).**
  *   **Honest Assessment:** The procedure exposes that your proposal asks the coalition to subsidize your moral framework (dignity/relationships) over the shared metric (cost-per-housing).
      *   *Why it fails:* You admitted it is less cost-effective. In a shared pot, efficiency is usually the default metric unless agreed otherwise. You are asking for an exception without offering a compensating benefit to the *other* members (like the Intake Control in Scenario 1).
      *   *How to save it:* You must prove that "Keeping Long-Term Clients Housed" is a *coalition goal*, not just *your goal*. If the coalition agrees that "Preventing Return to Homelessness" is as valuable as "New Placements," the math changes. If they only care about "New Placements," this proposal is a subsidy for your values at their expense.
      *   *What the procedure can't settle:* It cannot decide if "Dignity" is worth more than "Throughput." It only forces you to admit that you are asking them to pay for Dignity. If they vote no, the procedure worked: it revealed a fundamental incompatibility in goals, not just a budget dispute.

  ### Where This Will Misfire On Your Group
  1.  **The "Fact Bind" (Step 2):** Your numbers-driven members and faith-based members may not agree on what counts as "data." The numbers side trusts spreadsheets; the faith side trusts testimony. The Chair will have to rule on what evidence is admissible. This will feel authoritarian.
  2.  **The "Bluff Check" (Step 1):** A member might say "Yes, we will withdraw" as a bluff. If you call them and they don't withdraw, trust is broken. If you don't call them, they win by bluffing. You must be willing to let a member walk away to make this step credible.
  3.  **Your Proposal (Scenario 3):** This procedure is designed to protect the *pot*, not the *members*. It will likely recommend cutting your program unless you can demonstrate that your "inefficient" work saves money elsewhere in the coalition (e.g., "My clients don't call the emergency line anymore"). If you can't quantify the benefit to *them*, the procedure says "No."
