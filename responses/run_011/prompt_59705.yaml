      *   *Decision:* Consensus needed on Steps 1, 4, 5. Majority/Weighted on Step 3? No, the prompt implies a coalition where everyone needs to buy in, but "consensus" has been gamed. Let's make it a "No Veto unless Red Line" system for the trade, but strict Veto for Red Lines.
