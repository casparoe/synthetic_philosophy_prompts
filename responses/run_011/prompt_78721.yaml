prompt: |-
  I've been following the preregistration/replication-crisis arguments since they blew up, and there's one institutional detail that keeps nagging at me that I don't think I've seen anyone on the usual blogs actually sit down with. Let me describe the practice concretely so we're talking about the same thing. In the Registered Reports format — now used by a bunch of journals in psych, biomed, neuroscience, including some Nature-branded ones — you submit your intro, hypotheses, methods and analysis plan *before you have any data*. Reviewers judge the question and the design, and if it passes you get "in-principle acceptance," you register the approved protocol in a public repository, and then you go run the study. At Stage 2 the reviewers are told explicitly that their decision must not depend on how important, novel or conclusive the results turned out to be; they check that you actually followed the approved protocol, look at anything you flagged as exploratory, and the paper is published regardless of outcome or statistical significance. Deviations have to be cleared with the editor in advance. So basically the entire evaluative weight sits on a document written before the world had a chance to talk back, and the data get demoted to something like a compliance audit.

  Here's the part that bugs me. The same fields, and often the same funders, run high-risk/high-reward programs that tell applicants to propose things likely to fail, and the prestige system hands out its biggest prizes for overturning a framework. Meanwhile I read Kuhn in college and mostly wrote him off as someone who made "paradigm" do way too much work — but this setup makes his story look weirdly load-bearing again. If a Stage 1 protocol can only be written by someone who already knows what counts as a testable prediction in the field, doesn't the format presuppose that the framework is fixed, shared, and stable enough that the community can agree in advance on what would count as confirming or disconfirming an effect? It seems to presuppose that the interesting failures are failures of execution and inference — p-hacking, HARKing, selective reporting, underpowered designs — rather than failures of the concepts themselves. And then there's this puzzle I can't resolve: preregistration is supposed to be manufacturing clean, documented, unspinnable failed predictions at industrial scale, which by Kuhn's account is exactly the fuel that's supposed to accumulate into a crisis. But nothing happens. The nulls get filed, everyone shrugs, the field keeps going, and nobody converts. My best guess is that a null result isn't an anomaly at all, because a directional hypothesis was never a guarantee the paradigm issued — the theory licensed a bet, not a promise — but if that's right then I'm not sure preregistration could ever produce a Kuhnian anomaly, and I don't know whether that's a feature or a sign the whole enterprise is quietly defining framework-level error out of existence.

  So: what theory of scientific change and what theory of evidence does this practice actually presuppose? Please reconstruct the implicit view rather than just listing philosophers — what has to be true about the relation between theory and observation for a frozen analysis plan to be the locus of all the epistemic work? Then sort out for me which parts the practice strictly requires versus which it just happens to fit comfortably with, because I suspect "the framework is stable" and "the framework is correct" are doing very different jobs here and I keep conflating them. Is the internal split coherent — Stage 1 gating on importance and novelty, Stage 2 formally blind to novelty and conclusiveness — or is the format holding two incompatible pictures of what makes research worth publishing? And finally, tell me what would have to change in the machinery if incommensurability were real: can you even write a Stage 1 protocol from inside a rival framework, given that you'd have to state your hypotheses in the vocabulary of the community that's going to review it? If the answer is no, is that a defect of the format or just proof that it's a normal-science instrument that was never meant to do anything else? No need for references or a reading list, I just want the argument worked through.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Subject:** Registered Reports (RR) format in science (psych, biomed, neuroscience).
      *   **The Mechanism:** Stage 1 (Intro, Methods, Analysis Plan *before* data) $\rightarrow$ In-Principle Acceptance $\rightarrow$ Data Collection $\rightarrow$ Stage 2 (Compliance check, publish regardless of outcome).
      *   **The Tension:**
          *   RR assumes stable frameworks (to agree on methods/hypotheses in advance).
          *   Science funding/prestige rewards high-risk/paradigm-overturning work (Kuhnian revolutions).
          *   RR produces "clean nulls" at scale, but these don't trigger Kuhnian crises (no conversion, just shrugging).
          *   *Hypothesis:* Nulls aren't anomalies because theories license bets, not promises. RR might be defining framework-level error out of existence.
      *   **The Questions:**
          1.  What theory of scientific change and evidence does RR presuppose? (Reconstruct the implicit view).
          2.  What is strictly *required* vs. what just *fits comfortably*? (Distinguish "framework is stable" from "framework is correct").
          3.  Is the internal split coherent? (Stage 1 values novelty/importance vs. Stage 2 ignores novelty/conclusiveness).
          4.  What if incommensurability is real? (Can you write a Stage 1 protocol from a rival framework? Is RR just a normal-science instrument?)

  2.  **Analyze Question 1: Implicit Theory of Evidence and Change:**

      *   *Evidence:* RR treats evidence as *procedural* rather than *semantic*. It's not about whether the data *means* X, but whether the data was generated according to rule Y. It assumes a hypothetico-deductive model where $H \rightarrow O$. If $\neg O$, then $\neg H$ (Modus Tollens).
      *   *Change:* It assumes *cumulative* change (brick-by-brick) rather than *revolutionary* change. It assumes errors are mostly methodological (noise, bias) rather than conceptual.
      *   *The "Frozen Plan":* For a frozen plan to be the locus of epistemic work, the link between the theoretical construct and the operationalization must be stable. If the operationalization is contested, the plan is useless.
      *   *Reconstruction:* The implicit view is a refined Logical Empiricism or "Error Statistics" (Mayo). Science progresses by eliminating error sources. Truth is approached by tightening the sieve, not by finding gold nuggets.

  3.  **Analyze Question 2: Required vs. Comfortable Fit:**

      *   *Required:*
          *   Operational stability: We must agree on what the variables *are* and how to measure them.
          *   Shared inferential norms: We must agree on what statistical test answers the question.
          *   Low theory-ladenness of observation: The data collection shouldn't depend on the truth of the specific hypothesis being tested (otherwise you can't design it blind).
      *   *Comfortable (but not required):*
          *   "Framework is correct": RR doesn't need the theory to be *true*, just *shared*. You can test a false theory rigorously.
          *   "Framework is stable": It needs stability *during the study*, not forever.
      *   *Distinction:* The user worries about conflating "stable" and "correct." RR requires stability of *language and method*, not truth of *theory*. You can rigorously disprove a theory within a stable framework.

  4.  **Analyze Question 3: Coherence of the Internal Split (Stage 1 vs. Stage 2):**

      *   *Stage 1:* Judges importance/novelty of the *question*.
      *   *Stage 2:* Ignores importance/novelty of the *result*.
      *   *Tension:* If the result is null, was the question actually important?
      *   *Resolution:* The "importance" in Stage 1 is *potential* importance (resolving uncertainty). Stage 2 realizes that potential by removing bias.
      *   *Incompatibility?* It risks becoming a bureaucracy of trivia. If novelty is ignored at Stage 2, researchers might game Stage 1 by proposing "safe" novel questions that don't actually risk the framework. It creates a "Normal Science Factory."
      *   *Verdict:* It's coherent *if* the goal is error reduction. It's incoherent *if* the goal is discovery/revolution. It prioritizes reliability over validity (in the broad sense).

  5.  **Analyze Question 4: Incommensurability and Rival Frameworks:**

      *   *Kuhn/Incommensurability:* If paradigms speak different languages, a Stage 1 reviewer from the dominant paradigm will reject a protocol from a rival paradigm because the operationalizations make no sense to them.
      *   *Can you write a Stage 1 protocol from a rival framework?* Technically yes, but it will likely be rejected at Stage 1 for "poor justification" or "flawed design" (which really means "wrong paradigm").
      *   *Defect or Feature?* It's a feature of Normal Science. RR is a tool for puzzle-solving, not paradigm-shifting.
      *   *What would change?* You'd need "Registered Reports for Revolutions" where the criteria for Stage 1 include theoretical coherence within the *rival* framework, not the dominant one. But journals are gatekeepers of the dominant framework.
      *   *Conclusion:* RR is inherently a Normal Science instrument. It cannot produce Kuhnian anomalies because it domesticates the null. A null becomes just another data point, not a crisis trigger.

  6.  **Synthesize and Structure the Argument:**

      *   *Introduction:* Acknowledge the sharpness of the insight. Validate the Kuhnian tension.
      *   *Section 1: The Implicit Epistemology.* Define it as "Procedural Reliabilism." The focus is on the *process* generating the fact, not the *fact* changing the theory. It assumes a stable mapping between construct and measure.
      *   *Section 2: Stability vs. Correctness.* Disentangle these. RR needs shared vocabulary (stability), not shared truth (correctness). But it treats conceptual disputes as methodological ones.
      *   *Section 3: The Stage 1/Stage 2 Split.* Analyze the novelty tension. It separates *question value* from *outcome value*. It risks incentivizing "safe novelty."
      *   *Section 4: The Kuhnian Problem (Incommensurability).* Address the core puzzle. RR domesticates anomalies. It turns crises into footnotes. It is a Normal Science tool.
      *   *Conclusion:* Summarize. RR solves the replication crisis by strengthening Normal Science, but it likely inoculates the field against Revolutionary Science.

  7.  **Refine the Tone:**

      *   Keep it philosophical but grounded in the institutional mechanics.
      *   Avoid name-dropping philosophers unless necessary for the concept (user said "no need for references").
      *   Match the user's analytical depth. They know the literature; don't explain what RR is, explain what it *does*.
      *   Focus on the "machinery" and "logic" as requested.

  8.  **Self-Correction/Nuance Check during drafting:**

      *   *Check:* Did I address the "nulls aren't anomalies" point?
      *   *Adjustment:* Yes, emphasize that RR turns a potential falsification into a "confirmed null," which is a positive result in the RR framework, thereby defusing the crisis potential.
      *   *Check:* Did I distinguish "stable" vs "correct"?
      *   *Adjustment:* Make sure to explicitly state that RR works fine on false theories as long as the *methods* to test them are agreed upon.
      *   *Check:* Is the "Normal Science Instrument" conclusion too strong?
      *   *Adjustment:* Nuance it. It *can* publish disconfirmations, but the *systemic effect* is to normalize them rather than let them accumulate into a crisis.

  9.  **Final Polish:** Ensure the flow is logical. Start with the epistemology, move to the institutional mechanics, end with the Kuhnian implications. (Proceed to generate output).

  *(Self-Correction during drafting the response)*: I need to be careful not to just say "RR is Normal Science." I need to explain *why* the mechanism enforces that. The key is the *pre-data agreement*. You can't agree on methods if you don't agree on what the objects of study are. That's the incommensurability barrier.

  Also, the user asked: "what has to be true about the relation between theory and observation for a frozen analysis plan to be the locus of all the epistemic work?"
  *Answer:* Theory and observation must be decoupled enough that the observation plan doesn't change based on preliminary data, but coupled enough that the observation counts as a test of the theory. This implies a stable "bridge" (operationalization).

  Let's write.
answer: |-
  This is a sharp diagnosis. You have identified the structural tension between the *methodological* goals of Registered Reports (RR) and the *sociological* reality of scientific change. The format is designed to fix the "error statistics" of a field without addressing the "conceptual statistics."

  Here is the reconstruction of the implicit machinery, the coherence of its internal split, and its relationship to Kuhnian dynamics.

  ### 1. The Implicit Epistemology: Procedural Reliabilism

  For a frozen analysis plan to be the locus of all epistemic work, the practice presupposes a specific theory of evidence: **Procedural Reliabilism.**

  In this view, the epistemic weight of a finding does not rest primarily on the *content* of the result (e.g., "X causes Y") but on the *severity of the test* the result survived. The "truth" is not found in the data point; it is found in the integrity of the funnel that produced the data point.

  For this to work, three things must be true about the relation between theory and observation:

  1.  **Stable Operationalization:** There must be a stable, agreed-upon mapping between theoretical constructs and measurement operations. If "anxiety" is measured by cortisol in Stage 1, you cannot switch to self-report in Stage 2 without invalidating the test. This presupposes that the *language* of the field is stable enough that two years prior to data collection, the community agrees on what counts as a valid instance of the phenomenon.
  2.  **Decoupling of Design and Outcome:** The design must be theoretically informative *regardless* of the direction of the effect. This assumes a symmetric inferential structure where a null result is as informative as a positive result. In many fields, this is false; a null often means "the measure was insensitive," not "the effect is absent." RR forces the field to treat the null as a definitive outcome, which requires the assumption that the measurement tool is sufficiently validated to rule out insensitivity *in advance*.
  3.  **Localizable Error:** Errors must be attributable to the *process* (p-hacking, HARKing, low power) rather than the *framework*. If the framework itself is wrong, a perfect procedure will simply yield precise wrong answers. RR assumes that if you tighten the procedure, you get closer to the truth. This is a cumulative view of progress: we are refining the resolution of the map, not redrawing the continents.

  **The Theory of Change:** Consequently, RR presupposes **cumulative correction**, not **revolutionary replacement**. It views scientific progress as the elimination of false positives and the stabilization of effect sizes. It assumes the current paradigm is the correct *container* for the questions, even if specific hypotheses inside it are wrong.

  ### 2. Stability vs. Correctness: What is Required?

  You suspect "the framework is stable" and "the framework is correct" are doing different jobs. You are right.

  *   **What is Strictly Required:** **Framework Stability (Consensus).**
      RR requires that the reviewers and authors share a vocabulary and a set of methodological norms. To grant In-Principle Acceptance at Stage 1, reviewers must agree that the proposed test *could* answer the question. If the field is in a state of flux where half the researchers believe the construct doesn't exist or is measured incorrectly, Stage 1 review becomes impossible. The protocol requires a "Normal Science" consensus on *how* to ask questions, even if there is disagreement on the *answers*.

  *   **What is Comfortable but Not Required:** **Framework Correctness (Truth).**
      RR does not require the underlying theory to be true. You can run a Registered Report to test a hypothesis derived from a false theory. If the theory is false, the RR will likely produce a robust null result. The machinery handles this fine.
      *However*, RR implicitly treats **Conceptual Disagreement as Methodological Error.** If a reviewer rejects a Stage 1 protocol because "this construct isn't real," they are treating a theoretical dispute as a design flaw. RR works best when theoretical disputes are translated into empirical bets. If the dispute is about the *meaning* of the terms rather than the *relation* between them, RR grinds to a halt.

  **The Conflation:** The danger is that by enforcing methodological consensus, RR reinforces theoretical stagnation. It makes it expensive to challenge the operationalization itself. If you want to argue that the standard measure of "working memory" is invalid, you cannot easily write a Stage 1 protocol using the standard measure (because you think it's junk) or a new measure (because reviewers will reject it as unvalidated). RR incentivizes using the "accepted" tools, thereby reifying the existing framework.

  ### 3. The Internal Split: Stage 1 Novelty vs. Stage 2 Blindness

  Is the split coherent? **Formally, yes. Sociologically, no.**

  *   **Formal Coherence:** The logic is that Stage 1 evaluates the *potential information gain* (importance/novelty of the question), while Stage 2 evaluates the *realized integrity* (was the potential gain actually captured without bias?). This separates the value of the *inquiry* from the value of the *outcome*.
  *   **Sociological Incoherence:** The prestige economy of science rewards *positive* novelty (new effects, new mechanisms), not *negative* novelty (robust nulls).
      *   **The Incentive Mismatch:** Stage 1 reviewers are told to judge importance. But "importance" in science is usually tied to the likelihood of a paradigm-shifting *positive* result. If a Stage 1 proposal is likely to yield a null, reviewers often deem it "low impact" at Stage 1, even if the question is theoretically critical.
      *   **The "Safe Novelty" Trap:** To get Stage 1 acceptance, authors are incentivized to propose questions that are novel enough to pass the bar but safe enough that the methods are unimpeachable. This filters out high-risk conceptual challenges.
      *   **The Stage 2 Void:** Once the data is in, the format says "ignore novelty." But if the result is a null, the paper often lands with a thud. It is published, but it is rarely cited or integrated. The format solves the *file drawer problem* (the paper exists) but not the *impact problem* (the paper changes minds).

  So, the format holds two incompatible pictures:
  1.  **Stage 1:** Science as Exploration (seeking important, novel questions).
  2.  **Stage 2:** Science as Audit (verifying compliance).
  The friction is that an audit of a trivial question is still a trivial paper. RR guarantees the *validity* of the brick, but not that it belongs in the cathedral.

  ### 4. Incommensurability and the Kuhnian Anomaly

  This is the crux of your puzzle: *Why don't clean nulls trigger crises?*

  **RR Domesticates the Anomaly.**
  In Kuhn's account, an anomaly becomes a crisis only when it resists explanation and accumulates. In RR, a null result is not an anomaly; it is a **delivered product**.
  *   **Pre-RR:** A null result is suspicious. Did they run it right? Did they p-hack? It hangs in the air as an unresolved tension.
  *   **Post-RR:** A null result is "certified." The process was vetted. The null is now a "fact."
  By certifying the null, RR removes the *methodological ambiguity* that usually allows a paradigm to defend itself ("your methods were wrong"). But paradoxically, this doesn't kill the paradigm; it just updates the parameters. The theory is adjusted to accommodate the null ("the effect is smaller than we thought," or "it only happens under condition Z").

  **Can you write a Stage 1 protocol from a rival framework?**
  **No.** This is the hard limit.
  To write a Stage 1 protocol, you must state hypotheses in the vocabulary of the community that reviews them.
  *   If you are a rival theorist, your concepts likely do not map 1:1 onto the dominant framework's measures.
  *   If you propose a test using your own operationalizations, Stage 1 reviewers (guardians of the dominant paradigm) will reject the design as "unvalidated" or "lacking justification."
  *   If you use the dominant paradigm's operationalizations to test your rival theory, you are fighting on their terrain, using their weapons. You have already accepted their framework's ontology to test your critique.

  **Is this a defect or a feature?**
  It is a **feature of Normal Science.** RR is a technology for puzzle-solving, not paradigm-shifting.
  *   **Normal Science:** Assumes the paradigm is correct and seeks to articulate it. RR is perfect for this. It tightens the bounds of the puzzle pieces.
  *   **Revolutionary Science:** Assumes the paradigm might be wrong and seeks to replace the puzzle board. RR is hostile to this. It requires too much upfront agreement on terms that the revolutionary wants to contest.

  **What would have to change for Incommensurability?**
  If incommensurability were real and we wanted RR to handle it, the machinery would need:
  1.  **Framework-Relative Review:** Stage 1 reviewers would need to be selected from the *rival* framework to validate the internal coherence of the protocol, not just the dominant one.
  2.  **Ontological Registration:** The registration would need to include not just the analysis plan, but the *justification of the constructs* themselves, allowing for theoretical dissent to be part of the "methods" check.
  3.  **Outcome Revaluation:** The community would need to value "Framework Falsification" as a higher prestige outcome than "Parameter Estimation." Currently, a robust null in RR is treated as a brick; it needs to be treated as a hammer.

  ### Summary

  The Registered Reports format presupposes a **Logical Empiricist** view of science: theories are networks of hypotheses that can be tested individually against a stable observational language. It assumes errors are procedural, not conceptual.

  *   **Required:** Stability of method and vocabulary.
  *   **Not Required:** Truth of the theory (but it reifies the status quo).
  *   **Internal Split:** Coherent in logic, incoherent in incentive structures (Audit vs. Exploration).
  *   **Kuhnian Implication:** RR is a **Normal Science Instrument.** It produces clean nulls, but by certifying them as "compliant," it strips them of their crisis-inducing ambiguity. It prevents the accumulation of *suspicious* anomalies by turning them into *settled* facts.

  The reason nothing happens after a cascade of RR nulls is that the format successfully converts **theoretical threats** into **empirical parameters.** It saves the field from itself (bias) by locking it into its current conceptual cage. It solves the replication crisis by making the field more rigorous, but it likely inoculates the field against the replication *revolution*.
