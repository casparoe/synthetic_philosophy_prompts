answer: |-
  Your diagnosis is astute, but it is not neutral. It stabilizes the standoff by compartmentalizing it, whereas the friction arises precisely because the three disputes are entangled. By treating them as separable layers, you grant the formalism a neutrality it does not possess. Here is the breakdown you requested, followed by the critique of your own position.

  ### 1. Classification of the Three Disputes

  **Dispute 1: The Semantic Question (Representation vs. Specification)**
  *   **Classification:** **Normative about what counts as explanation.** It is not merely verbal. A verbal dispute implies both parties agree on the underlying facts but disagree on the label. Here, they disagree on the *explanatory target*. The representationalist aims to explain how an organism tracks truth conditions (veridicality); the enactivist aims to explain how an organism maintains viability (stability).
  *   **Progress Condition:** **A change of question.** No experiment will decide this, because "content" is not a natural kind detectable by instruments. Progress requires agreeing on whether the goal of cognitive science is to explain *successful reference* or *successful regulation*. If the field settles on regulation, the representationalist gloss becomes idle. If it settles on reference, the enactivist gloss becomes insufficient.
  *   **Status:** Stable impasse. Both sides can describe the same neural dynamics; they simply disagree on whether those dynamics constitute "aboutness."

  **Dispute 2: The Methodological Question (Mechanism vs. Principle)**
  *   **Classification:** **Substantive and empirically decidable (in principle).** This is the claim that Expected Free Energy (EFE) is either a causal engine the brain implements or a law-like description of the behavior of any self-organizing system.
  *   **Progress Condition:** **A theorem or a specific neural computation.**
      *   *Theorem:* Prove that minimizing EFE is the *unique* solution for adaptive systems under specific constraints, rather than one of many possible control strategies.
      *   *Computation:* Demonstrate that neural circuitry explicitly computes the *epistemic* value component of EFE distinct from pragmatic value. Currently, epistemic value is often mathematically collapsible into novelty-seeking or reward prediction error. If epistemic value cannot be dissociated from instrumental reward in neural data, EFE is merely a redescription of reinforcement learning.
  *   **Status:** Currently leaning toward redescription. The "Dark Room" objection persists because the priors required to solve it are often stipulated post-hoc to fit the organism's actual behavior, making the principle unfalsifiable.

  **Dispute 3: The Empirical Question (Precision as Gain vs. Parameter)**
  *   **Classification:** **Empirically decidable.** This is the strongest leg of your triad. Precision weighting is the mechanism by which the system chooses which errors to minimize.
  *   **Progress Condition:** **A discriminating experiment.** We need pharmacological or optogenetic interventions that alter precision (e.g., via acetylcholine or dopamine) and result in *specific, predicted shifts* in the balance between perceptual updating and action, without altering the content of the generative model itself. If precision is a free parameter fitted to behavioral data after the fact, the framework accommodates rather than predicts. If it maps to specific gain control mechanisms that can be manipulated independently, it predicts.
  *   **Status:** Mixed. There is evidence for gain modulation, but the mapping between "precision" in the equations and "synaptic gain" in the tissue is often one-to-many (degenerate), allowing the representationalist to claim victory on vague grounds.

  ### 2. The Deeper Disagreement

  You missed the ontological status of the formalism itself. The deeper disagreement is **Realism vs. Instrumentalism regarding Bayesian Probability.**

  *   **The Representationalist** treats the probabilistic calculus as *ontologically loaded*. They believe the brain literally manipulates probabilities or probability-like structures. The math mirrors the mind.
  *   **The Enactivist** treats the probabilistic calculus as *instrumentally useful*. They believe the math is a tool for the *scientist* to model the system, not a description of what the system *does*. The brain does not compute probabilities; the brain behaves *as if* it does, because that is how variational principles describe non-equilibrium steady states.

  This is why the standoff persists. The Representationalist says, "The equations show the brain infers." The Enactivist says, "The equations show *we* can infer the brain's dynamics." They are talking past each other because one side sees the math as internal to the system, and the other sees the math as external to the system.

  ### 3. Critique of Your Diagnosis (Where You Beg the Question)

  Your tripartite diagnosis is not as neutral as you suspect. It systematically favors the **Representationalist** position by treating the formalism as the neutral ground upon which the disputes occur.

  1.  **You assume the formalism is stable.** By accepting "hierarchical generative models" and "variational free energy" as the shared apparatus, you have already conceded the Representationalist's core claim: that the brain's activity is best modeled as inference over hidden causes. The Enactivist who rejects representation often wants to reject the "hidden causes" part of the generative model, viewing them as fictional posits rather than latent variables. By keeping the formalism fixed, you force the Enactivist to argue *within* a representational framework, which rigs the semantic dispute.
  2.  **You treat "Precision" as a singular empirical target.** Your third dispute assumes precision is a *thing* to be found (synaptic gain). This begs the question against the Enactivist, who might argue precision is a *relational property* of the system-environment coupling, not a local neural variable. If precision is relational, looking for it in neuromodulation is a category error. Your diagnosis assumes a methodological individualism that the Enactivist rejects.
  3.  **You frame the Semantic dispute as "stipulation vs. discovery."** This implies there is a fact of the matter to be discovered. The hardline Enactivist denies this. They argue that "representation" is a folk-psychological category that the new formalism should *eliminate*, not reduce. By framing it as a dispute over how to cash out representation, you presuppose that representation is the phenomenon to be saved.

  ### Conclusion

  The impasse is stable because the Predictive Processing framework is currently a **hybrid ontology**. It uses the mathematics of inference (which implies an observer and a representation) to describe the dynamics of life (which implies self-maintenance and coupling).

  *   **Progress** will not come from settling the semantic dispute. It will come from breaking the formalism.
  *   **What to watch for:** A model that achieves the same predictive fit *without* positing hidden causes, or a neural recording that shows the brain explicitly representing probability distributions rather than just samples.
  *   **Your Seminar:** The standoff will not break until you stop treating the equations as the common ground. The equations *are* the dispute. Ask your students to derive the same behavioral predictions using a non-probabilistic dynamical systems account. If they can, the Representationalist claim weakens. If they cannot, the Enactivist claim weakens. Until then, you are teaching a mathematical Rorschach test.
