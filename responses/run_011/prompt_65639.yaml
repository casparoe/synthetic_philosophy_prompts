answer: |-
  The Nyāya school of Indian philosophy accepts four *pramāṇas*, or independent means of knowledge: *pratyakṣa* (perception), *anumāna* (inference), *śabda* (testimony), and *upamāna* (comparison). Their rivals, the Mīmāṃsakas and Advaitins, argue for a fifth: *arthāpatti* (postulation or presumption). The stock case is Devadatta: we know Devadatta is fat, and we know he does not eat during the day. These facts clash given the background constraint that fatness requires eating. To resolve the tension, we postulate that he eats at night. Nyāya insists this is just *anumāna* in disguise: the mark is fatness, the pervasion is "fatness requires eating," and the conclusion is "he eats at night." The Buddhists, meanwhile, argue for only two *pramāṇas* (perception and inference), seeking to reduce testimony and comparison as well.

  The central question is whether Nyāya is right to collapse *arthāpatti* into *anumāna*. To decide, we must evaluate the **conflict-minimality account**. On this view, a cognition counts as *arthāpatti* rather than *anumāna* iff: (i) the knower holds two items of knowledge that are jointly unsatisfiable given accepted background constraints; (ii) the cognition repairs the clash; and (iii) among available repairs, it picks the one that changes existing commitments as little as possible. On this picture, the difference lies not in the content believed—both routes yield "Devadatta eats at night"—but in the trigger and the live alternatives. Inference starts from a mark and a pervasion; *arthāpatti* starts from an incoherence inside one's own commitments.

  Does this buy anything? The Nyāya objection is predictable: clause (i) is merely a psychological description of how one happens to find the inference, and clause (iii) is pragmatic noise about theory choice. They argue the logical structure remains syllogistic. However, this misses the epistemic weight of the conflict. In standard *anumāna*, I see smoke and infer fire because I know the universal relation. I am not forced to infer fire to save my worldview; I am led to it by a positive mark. In *arthāpatti*, I am forced to postulate the night-eating specifically because my current worldview is broken. The conflict isn't just upstream; it is the justificatory engine. If the conflict were removed—if I didn't know he was fat—the inference collapses. Thus, the conflict is constitutive, not incidental. This supports irreducibility: the *pramāṇa* is defined by the resolution of doxastic incoherence, not the tracking of objective pervasions.

  Running this verdict over the case battery clarifies the stakes.

  (a) **Devadatta:** This is the paradigm. Fatness + No Day Eating creates a direct violation of biological constraints. The minimal repair is Night Eating. The account predicts *arthāpatti*. This is comfortable; it matches the classical intuition that this cognition feels different from seeing smoke and inferring fire.

  (b) **Caitra:** Caitra is alive but not in his house. Is this a clash? "Alive" implies "Located somewhere." "Not in house" implies "Not here." The clash is between "Caitra is accessible here" and "Caitra is not here." If the expectation of presence was strong (e.g., he lives here), the conflict is sharp, and "He is elsewhere" is the minimal repair. If the expectation was weak, it's just an absence of information. The account predicts *arthāpatti* only if there was a prior commitment to his presence that needed saving. This is a useful diagnostic: it distinguishes postulation from mere guessing.

  (c) **Wet Umbrella:** A locked room, wet umbrella, no one outside. You conclude "It rained." Is this inference from a mark (wetness) or postulation? The account predicts ambiguity. If you start with "The umbrella is wet" and apply "Wetness implies rain," it's inference. If you start with "The umbrella is wet" + "No one brought it wet" + "Windows closed," creating a puzzle, and "It rained" is the only way to save the consistency of the room's sealed state, it's *arthāpatti*. The ambiguity is diagnostic: it reveals that many everyday cognitions slide between the two depending on whether the agent feels driven by a mark or by a puzzle.

  (d) **Colleague/Canteen:** Colleague says "I ate at the canteen"; you know "Canteen was closed." You conclude "They are lying." This is a clash between testimony and fact. The minimal repair is to downgrade the testimony's credibility. The account handles this as *arthāpatti*. This is crucial: it is not merely testimony losing to perception. It is a new cognition about the speaker's honesty generated to resolve the incoherence. If we reduce this to inference, we lose the specific epistemic work done to preserve the rest of our web of belief.

  (e) **False Minimal Repair:** Friend's phone off. Minimal repair: "Dead battery." Actual truth: "Silent retreat." Does clause (iii) mean *arthāpatti* produces falsehoods? A *pramāṇa* is a generator of knowledge; if it yields falsehood, it wasn't functioning as a *pramāṇa* in that instance (just as a mirage isn't perception). However, if the method is systematically prone to falsehood compared to inference, its status is threatened. Inference also fails if the pervasion is false. The risk here is abductive: minimal change favors simple explanations, which aren't always true. But this doesn't disqualify it; it just means *arthāpatti* is riskier than deductive *anumāna*. It remains a distinct cognitive operation.

  (f) **Anupalabdhi (Non-apprehension):** Knowing a pot is absent because you don't see it on a bare floor. Does my verdict force a verdict here? Yes. Non-apprehension is also conflict-driven: "Conditions for seeing are met" + "I see nothing" creates a tension resolved by "Pot is absent." If *arthāpatti* is irreducible because it resolves incoherence, *anupalabdhi* likely is too. This risks bloating the list of *pramāṇas*. To stop the list growing forever, we must insist that *pramāṇas* correspond to distinct *causal mechanisms* of cognition, not just logical forms. Conflict-resolution is a distinct mechanism from mark-tracking.

  This leads to the slippery slope. If *arthāpatti* collapses into *anumāna*, what stops *upamāna* (comparison) from collapsing into memory plus inference? And if that goes, the Buddhist two-*pramāṇa* view wins outright. There must be a principled line between "reduce this one" and "reduce everything." The line is the cognitive trigger. If we allow reduction whenever the logical output looks similar, we lose the map of how humans actually acquire knowledge. We reduce *arthāpatti* only if we ignore the doxastic conflict that drives it. To save the system from Buddhist reductionism, we must defend the irreducibility of operations that rely on coherence repair rather than simple data extension.

  The Nyāya reduction fails because it conflates the logical form of the conclusion with the epistemic situation of the knower. The conflict-minimality account captures the unique role of *arthāpatti* in maintaining the coherence of our belief system. It is not merely inference triggered by a puzzle; it is a distinct mode of justification where the necessity of the conclusion derives from the impossibility of the alternative given existing commitments.

  **Verdict:** The Naiyāyikas were wrong to refuse *arthāpatti* a seat at the table; it is an irreducible *pramāṇa* because its justificatory force derives from resolving doxastic incoherence rather than tracking objective pervasions.

  **Strongest Objection:** The "minimal repair" criterion is pragmatic rather than truth-conducive, risking the validation of convenient falsehoods over complex truths, which undermines its status as a reliable means of knowledge.
