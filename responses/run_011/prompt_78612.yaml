  *   Prior $P(S = 2^k) = 1/10$ for $k=0 \dots 9$.
  *   You pick an envelope at random (50% chance of $S$, 50% chance of $2S$).
  *   Let $X$ be the observed amount.

  **The Probabilities:**
  *   **$X = 1$:** Only possible if $S=1$ and you picked the smaller envelope.
      *   $P(X=1) = \frac{1}{10} \times \frac{1}{2} = \frac{1}{20}$.
      *   $P(\text{Other}=2 | X=1) = 1$.
      *   $E[\text{Gain}|X=1] = +1$.
  *   **$X = 1024$:** Only possible if $S=512$ and you picked the larger envelope.
      *   $P(X=1024) = \frac{1}{10} \times \frac{1}{2} = \frac{1}{20}$.
      *   $P(\text{Other}=512 | X=1024) = 1$.
      *   $E[\text{Gain}|X=1024] = -512$.
  *   **$X \in \{2, 4, \dots, 512\}$:** Possible as larger of pair $k-1$ or smaller of pair $k$.
      *   $P(X=2^k) = (\frac{1}{10} \times \frac{1}{2}) + (\frac{1}{10} \times \frac{1}{2}) = \frac{1}{10} = \frac{2}{20}$.
      *   $P(\text{Other}=X/2 | X) = \frac{1/20}{2/20} = \frac{1}{2}$.
      *   $P(\text{Other}=2X | X) = \frac{1/20}{2/20} = \frac{1}{2}$.
