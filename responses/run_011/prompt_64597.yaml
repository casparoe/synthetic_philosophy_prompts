          *   *Defeater or Feature?* For Ladyman & Ross (defenders), it's a feature (they lean this way). For others, it's a bug (loss of physical modality).
          *   *Risk:* Pythagoreanism. Why *this* math?

      *   **Qualification/Unfalsifiability:**
          *   *Critique:* OSR shifts definitions of "structure" and "object" to avoid counterexamples.
          *   *Verdict:* There is a risk of becoming a "no-true-Scotsman" metaphysics.

