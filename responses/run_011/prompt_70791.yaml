      *   *Medium Damage:* The "Western Hypocrisy" deflection. Accusing the user of saying "West is bad so Global South is excused."
      *   *Low Damage:* The "Literary vs. Empirical" argument. "It's just a story, not data."

  4.  **Developing the Answers:**
      *   Need to sound professional, not defensive. Acknowledge the validity of their concern but pivot back to the structural argument.
      *   *Constraint:* Two-minute spoken limit (approx. 250-300 words).
      *   *Honest Note:* Where does the novelist's logic fail under policy scrutiny?

  5.  **Strategic Concessions (First 90 Seconds):**
      *   Cannot start by attacking their life's work. Must validate the *intent* of anti-corruption work while questioning the *toolkit*.
      *   Admit that envelopes/rice *are* burdensome. Don't romanticize poverty.

  6.  **The "Must Land" Reply:**
