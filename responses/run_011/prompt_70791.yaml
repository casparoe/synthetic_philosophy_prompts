      *   **Book Premise:** A district land office manager who realizes that *accepting* bribes/gifts (envelopes, rice) maintains a social obligation that keeps her somewhat honest/restrained, whereas refusing them severs the tie and allows for unchecked exploitation. It's a subversion of the standard "bribery is bad" narrative.
      *   **Event:** An anti-corruption conference plenary.
