      *   **Talk Core Argument:** The standard definition of corruption ("abuse of entrusted power for private gain") assumes a clean public/private boundary. This boundary is a historical achievement, not a natural fact. Enforcing it blindly mislabels local survival mechanisms as corruption while letting systemic "legal corruption" (lobbying, revolving doors) in the West slide.
      *   **Task:** Create a Q&A prep sheet.
      *   **Requirements:**
          *   Objections ordered by damage potential (high to low).
