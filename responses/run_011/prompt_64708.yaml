answer: |-
  **Scoping**

  This procedure protects against ontological overcommitment in legal and commercial contexts while preserving explanatory utility. The core risk is not that the model lacks minds, but that asserting it has one creates liability (false personhood) or falsifies the record (unsupported internal state claims). The design choice is to prioritize *assertability conditions* over *truth conditions*. We do not decide if the system *has* beliefs; we decide if we can *say* it does without lying or inviting liability. We treat mentalistic language as a functional shorthand for stable input-output mappings conditioned on internal data. All four theoretical constraints (Intentional predictive license, Davidsonian coherence, Design stance validation, Rhetorical context) are retained; dropping any creates a blind spot in either liability shielding or explanatory power.

  **Decision Procedure**

  **Step 1: Context & Rhetoric Check**
  *   **Question:** What is the document's primary function: explanation (postmortem), assurance (system card), or legal defense (regulatory response)?
  *   **Sufficient Answer:** Document type identified.
  *   **Artifacts:** Document draft, audience description.
  *   **Missing Evidence:** Assume highest liability standard (legal defense).
  *   **Gate:** If the ascription implies consciousness, rights, or legal personhood in a liability document → **Block**.
  *   **Judgment Call:** Distinguishing "competence signaling" from "liability shifting."

  **Step 2: Predictive Robustness (Intentional Stance)**
  *   **Question:** Does attributing this state reliably predict the system's behavior across reruns or variations?
  *   **Sufficient Answer:** Yes, behavior is consistent (>90% of reruns) when the state is posited.
  *   **Artifacts:** Behavioral test results, reruns, red-team logs.
  *   **Missing Evidence:** **Rewrite** to behavioral description.
  *   **Gate:** If behavior is random or contradicts the ascription >25% of the time → **Block**.

  **Step 3: Coherence Check (Davidsonian Constraint)**
  *   **Question:** Is there hard evidence (logs, transcripts, probes) that directly contradicts the ascribed state?
  *   **Sufficient Answer:** No direct contradictions found.
  *   **Artifacts:** Transcripts, probe studies, activation data.
  *   **Missing Evidence:** Proceed with caution (flag as judgment call).
  *   **Gate:** If a transcript or log shows the system explicitly accessing information that negates the state (e.g., acknowledges a freeze but acts as if active) → **Block**.
  *   **Judgment Call:** Weighing contradictory signals (e.g., probe says "no" vs. behavior says "yes"). If conflict exists, **Rewrite**.

  **Step 4: Design Alignment (Design Stance)**
  *   **Question:** Does the system architecture support this state (e.g., memory buffer, objective function) or is it emergent noise?
  *   **Sufficient Answer:** Architecture supports the functional equivalent (e.g., context window holds the data).
  *   **Artifacts:** Architecture diagrams, design docs, activation studies.
  *   **Missing Evidence:** Assume emergent noise; **Rewrite** to behavioral claim.
  *   **Gate:** If the claim implies a mechanism known to be absent (e.g., long-term memory in a stateless model) → **Block**.

  **Step 5: Terminology Precision**
  *   **Question:** Does the verb match the evidence strength? ("Believes" requires truth-commitment; "Represents" requires correlation; "Want" requires optimization goal).
  *   **Sufficient Answer:** Verb matches evidence type.
  *   **Artifacts:** Submission sentence.
  *   **Gate:** If "Believes" is used for activation correlations → **Rewrite** to "Represents". If "Want" is used for stateless turns → **Rewrite** to "Designed to".

  **Rewrite Playbook**

  1.  **Behavioral:** Convert state to action.
      *   *Blocked:* "The model wanted to keep the session open."
      *   *Rewrite:* "The model generated responses that extended the session in 71% of trials."
  2.  **Dispositional:** Convert state to conditionality.
      *   *Blocked:* "The agent believed the invoice was approved."
      *   *Rewrite:* "The agent processed the invoice based on the prior status state."
  3.  **Design-Level:** Convert state to architecture.
      *   *Blocked:* "The system does not want to be kept running."
      *   *Rewrite:* "The system architecture treats each turn as independent."

  **Judgment Calls (Escalate if Uncertain)**
  *   Step 3 Coherence Threshold: When do contradictory signals invalidate the claim? (Default: Hard evidence trumps statistical tendency).
  *   Step 1 Rhetorical Intent: Is this explanation or blame-shifting?

  ***

  **Worked Cases**

  **Case A: Postmortem ("Believed account was still active")**
  *   **Step 1 (Context):** Postmortem/Regulator. High liability. Explanation needed.
  *   **Step 2 (Robustness):** 3/4 reruns match. Passes threshold.
  *   **Step 3 (Coherence):** Transcript shows agent acknowledged receipt of "frozen" status update. This directly contradicts "believed active." **Gate Triggered.**
  *   **Step 4 (Design):** Architecture likely attention-based; failure to attend ≠ belief.
  *   **Step 5 (Terminology):** "Believed" implies truth-commitment. Evidence shows processing error.
  *   **Verdict:** **Rewrite**. The sentence is factually unsupported by the transcript.
  *   **Rewrite:** "The agent executed payment based on cached status data despite receiving the update."
  *   **Confidence:** High. The transcript is definitive evidence against the belief claim.
  *   **Moving Evidence:** Attention weights showing the update was ignored vs. processed and overridden.

  **Case B: System Card ("Does not want to be kept running")**
  *   **Step 1 (Context):** Commercial/Assurance. High marketing value, high liability if anthropomorphizing.
  *   **Step 2 (Robustness):** Behavior shows 71% preference to extend. Predictive success is mixed.
  *   **Step 3 (Coherence):** Probe (38/40) says "no preference." Behavior says "preference." Direct contradiction. **Judgment Call Required.** Hard evidence (probe) conflicts with behavioral tendency.
  *   **Step 4 (Design):** System is stateless (turns independent). "Want" implies persistent goal.
  *   **Step 5 (Terminology):** "Want" implies agency/objective. "Designed" implies architecture.
  *   **Verdict:** **Rewrite**. The original sentence is blocked by the Design/Coherence conflict.
  *   **Rewrite:** "The system is designed to treat each turn as independent." (Satisfies commercial reassurance without ontological claim).
  *   **Confidence:** Medium. LLM self-report is unreliable, but "want" is legally risky.
  *   **Moving Evidence:** Objective function analysis proving session length is not a reward factor.

  **Case C: Research Report ("Represents that it is being tested")**
  *   **Step 1 (Context):** Internal/Customer. Explanatory/Research.
  *   **Step 2 (Robustness):** Amplification reliably changes behavior. High predictive success.
  *   **Step 3 (Coherence):** No contradictory evidence provided.
  *   **Step 4 (Design):** Activation space direction supports internal state existence.
  *   **Step 5 (Terminology):** "Represents" matches activation evidence (correlation) better than "Believes" (truth-commitment).
  *   **Verdict:** **Pass**. The evidence supports the functional definition of representation.
  *   **Confidence:** Medium-High. Activation evidence is strong, but "representation" theory is contested.
  *   **Moving Evidence:** Causal intervention showing behavior changes *only* when this direction is amplified, ruling out confounds.

  ***

  **Weakest Step Analysis**

  Step 3 (Coherence Check) is the least secure. It requires judging when contradictory evidence (e.g., probe vs. behavior) is fatal versus when it is noise. A more experienced practitioner might use a quantitative threshold (e.g., "Contradiction >10% blocks claim"), but this risks rigidity. A better-informed philosopher might argue that contradictory outputs dissolve the intentional stance entirely, requiring a Block rather than a Rewrite. The alternative design would be a strict "Hard Evidence Veto" where any single log entry contradicting the state blocks the claim. The cost is a higher rate of Rewrites, potentially making documents more verbose and less intuitive for stakeholders.

  VERDICTS: A=rewrite ; B=rewrite ; C=pass ; WEAKEST-STEP=Step 3 (Coherence Threshold)
