      *   *Pivot:* Maybe **Decline** is safer ecologically, but **Fund with Conditions** is more honest about our current "managed" status (no predators). The prompt asks to confront the 2021/2022 decisions. 2021 was yes for fleas. This is ticks. Similar vector. 2022 was no for foxes due to density. This proposal *admits* density rise.
      *   *Stronger Path:* **Fund with Conditions** is the only way to bridge the divide, but the conditions must be hard. We fund the stations *only if* the monitoring plan is approved by *our* staff and includes specific ecological triggers.
