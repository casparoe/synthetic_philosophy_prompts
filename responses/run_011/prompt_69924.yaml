answer: |-
  **MEMORANDUM**

  **TO:** Program Committee
  **FROM:** Program Committee Member
  **DATE:** August 28
  **SUBJECT:** Recommendation Regarding Animal-Welfare Petition for Deer Acaricide Pilot

  **Introduction**

  This September, we must decide whether to fund a pilot program applying topical acaricides to white-tailed deer on our largest preserve. The petition presents a conflict between two obligations inherent in our work: the duty to maintain ecological integrity and the duty to prevent gratuitous suffering within our stewardship. We are not managing a pristine wilderness; our preserves lack apex predators and prohibit hunting. We have already altered the ecological rules by removing the checks on population growth. The question is whether we now intervene to mitigate the consequences of that removal.

  This memo outlines a recommendation to fund the pilot with strict conditions, establishes a framework for evaluating similar future petitions, and addresses the inconsistencies in our recent decision history.

  **Recommendation**

  1.  **Approve funding for the three-year pilot, contingent on the following conditions:**
      *   **Monitoring Oversight:** While the petitioner funds the monitoring contractor, the data collection protocol and final reports must be approved by our staff ecologist. We cannot accept data solely verified by the petitioner's agents.
      *   **Ecological Triggers:** The pilot includes a mandatory halt clause if deer density exceeds a specific threshold or if understory browse rates indicate damage to ground-nesting bird habitat.
      *   **Timeline:** Approval must be granted at the September meeting. The acaricide application must occur before the first hard frost to be effective for the coming winter. Deferring this decision to the spring cycle is a substantive decision to allow current mortality rates to continue for another year. Based on last winter's euthanasia records and volunteer reports, a one-year deferral implies accepting the preventable death of approximately fifteen to twenty animals, primarily fawns.

  **Precedent and Consistency**

  We must confront our mixed record to avoid the appearance of arbitrary governance. In 2021, we funded insecticide dusting for prairie dogs to suppress plague vectors. In 2022, we declined treatment for sarcoptic mange in urban foxes due to the risk of increased fox density and predation on birds. Separately, our staff routinely euthanize injured animals and cull invasives.

  Critics might argue that funding this deer pilot contradicts the 2022 fox decision. In the fox case, we declined because survival would increase predation pressure. In this deer case, the petitioner's consultant admits survival will increase browsing pressure. The ecological risk is parallel. However, a distinction exists: the prairie dog intervention was accepted because it controlled a disease vector that threatened the broader system, whereas the fox intervention was viewed as sustaining a predator.

  Here, the deer are the herbivores. Keeping them alive increases pressure on the understory. To reconcile this, we must admit that our "unmanaged" mission is already compromised. By excluding hunters and lacking predators, we have chosen to manage the system by limiting mortality sources. If we accept the obligation to euthanize individual suffering animals (as we currently do), we acknowledge a duty to individual welfare. If we decline the acaricide, we are effectively choosing to manage by allowing starvation and blood loss rather than chemical intervention. Funding this pilot is not a slide toward a zoo; it is an acknowledgment that our land trust already functions as a managed sanctuary. We are not restoring a natural process; we are mitigating the suffering caused by our own management boundaries.

  **Tests for Future Petitions**

  To prevent this decision from becoming a precedent that obligates us to fund every welfare intervention, the committee should adopt the following four tests for future proposals of this nature. These tests rely on data we can afford to collect and verify.

  1.  **Net Ecological Impact:** Does the intervention alter population density or aggregation in a way that threatens a different species or habitat feature? We must require a quantitative cap on density increases. If the treatment succeeds, does the resulting population exceed the land's carrying capacity for vegetation?
  2.  **Data Independence:** Who verifies the success? We cannot rely on monitoring conducted entirely by the petitioner. Future funding requires that our staff retain authority over the monitoring plan and access to raw data, regardless of who pays the contractor.
  3.  **The Exit Strategy:** What constitutes failure? Every pilot must define the conditions under which we terminate funding and reverse the intervention. If the ecological cost outweighs the welfare benefit, we must have a pre-agreed mechanism to stop.
  4.  **Mission Alignment:** Does the intervention restore an ecological process or replace it? We should favor interventions that mimic natural checks (e.g., supporting predator return) over those that replace them with human technology (e.g., baited medication stations). This pilot fails this test, which is why it must remain a time-limited exception rather than a new standard.

  **Objections and Conditions for Reversal**

  Two strong arguments oppose this recommendation. They must be weighed heavily.

  First, the "Zoo Slope" argument posits that funding this pilot erodes the principle of non-intervention. If we medicate deer today, we face pressure to fertility-control them tomorrow, feed them in winter the next year, and treat every injury indefinitely. This transforms a conservation foundation into a wildlife hospital with a land portfolio. The tax status and mission of a land trust are distinct from an animal-welfare organization. Blurring this line risks our credibility with donors who support habitat protection, not individual animal husbandry.

  Second, and more critically, is the "Net Suffering" argument. The petitioner's consultant projects a forty percent increase in deer density. If we successfully reduce tick loads on individual deer but increase the total number of deer, we may increase the total burden of suffering in the system. A larger herd will face greater winter starvation risk once the pilot ends or if the acaricide fails. We may be creating a larger population of animals living lives dominated by parasite management and food scarcity. This is not welfare; it is the industrialization of survival.

  I would change my mind and vote to decline if either of the following were true:
  *   If our staff ecologist determines that a forty percent density increase would cause irreversible damage to the understory vegetation within the first year, threatening the ground-nesting songbirds we aim to protect.
  *   If the petitioner refuses to grant our staff authority to halt the pilot based on ecological data, regardless of who pays for the monitoring.

  **Authority to Halt**

  Given the conflict of interest inherent in the petitioner funding the monitoring, the authority to call a halt must rest solely with the Foundation's Program Director, advised by our staff ecologist. The petitioner's contractor will collect the data, but the Foundation must interpret it.

  First-year data triggers for an immediate halt include:
  1.  **Disease Emergence:** Any detection of Chronic Wasting Disease (CWD) at the bait stations. Aggregation significantly increases transmission risk, and CWD is fatal and untreatable.
  2.  **Vegetation Thresholds:** A measurable decline in understory regeneration exceeding five percent in control plots compared to treatment plots.
  3.  **Density Cap:** If deer density in the treatment zone exceeds fifty-five deer per square mile.

  **Conclusion**

  This decision is not between ecology and welfare. It is between two types of management. We already manage this land by excluding predators and hunters. The question is whether we manage the consequences of that exclusion humanely or by attrition. By funding this pilot with strict ecological guardrails, we acknowledge our role as active stewards while protecting the foundation from an open-ended obligation to relieve all wild suffering. We treat this as a three-year experiment, not a new policy. If the ecological costs prove too high, we have the data and the authority to stop.

  I urge the committee to approve the recommendation in September to ensure the intervention can be deployed before winter conditions make it moot.
