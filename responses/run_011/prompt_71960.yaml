answer: |-
  # The Theory-Change Sorting Tree

  **Instructions:** Answer each question based on your immediate intuition about the case described. Do not worry about what a "correct" philosophical answer might be. There are no right answers, only paths.

  1.  **The Neutrino Case:** Pauli proposed the neutrino to save conservation laws, but it wasn't detected for decades. When it was finally detected, did that prove it *existed* all along, or just that the math was useful?
      *   A. It existed all along; detection just confirmed it. *(Go to 2)*
      *   B. It only became real once detected; before that, it was just a placeholder. *(Go to 5)*
      *   C. "Existence" is the wrong word; the theory just became more reliable. *(Go to 6)*

  2.  **The Caloric Case:** In the shift from Caloric fluid to Heat Flow, the fluid vanished but the equations survived. Did those surviving equations describe something *true* about the world while people still believed in the fluid?
      *   A. Yes, the relations in the math were real even if the fluid wasn't. *(Go to 3)*
      *   B. No, the whole theory was false until the fluid was removed. *(Go to 4)*
      *   C. The math wasn't true, just a good way to organize measurements. *(Go to 6)*

  3.  **The Relata Question:** If the equations (relations) are real, but the objects (fluid, ether, etc.) keep vanishing or changing, is there still some "stuff" underneath holding the relations together, or are the relations all there is?
      *   A. There must be some stuff underneath, even if we don't know what it is. *(Go to 7)*
      *   B. The relations are all there is; no underlying stuff is needed. *(Go to 8)*
      *   C. We can't know if there is stuff underneath; we only know the relations. *(Leaf: Epistemic Structural Realism)*

  4.  **The Entity Focus:** If the old theory was false but the neutrino was real, what is the main thing science gets right?
      *   A. It identifies the real objects/causes, even if the description is wrong. *(Leaf: Entity Realism)*
      *   B. It gets the whole picture approximately right, objects and descriptions. *(Leaf: Standard Scientific Realism)*
      *   C. It identifies objects, but we should drop the descriptions entirely. *(Leaf: Eliminativist Ontic)*

  5.  **The Phlogiston Case:** Phlogiston theory was replaced by Oxidation, and essentially nothing of the old picture survived. Does this suggest our current best theories are probably false too?
      *   A. Yes, history shows theories get wiped out; we should expect the same. *(Leaf: Pessimistic Meta-Induction)*
      *   B. No, we should just aim for theories that match observations, not truth. *(Leaf: Constructive Empiricism)*
      *   C. No, current theories are different; we can trust them. *(Go to 2)*

  6.  **The Tool View:** If theories are just tools for prediction and not descriptions of reality, do we need to worry about whether the terms refer to anything?
      *   A. No, reference doesn't matter, only output does. *(Leaf: Instrumentalism)*
      *   B. We should act *as if* they refer, but know they don't. *(Leaf: Fictionalism)*
      *   C. Reference matters, but only for observable things. *(Leaf: Constructive Empiricism)*

  7.  **The Ramsey Route:** If there is underlying stuff, can we describe the theory purely as a logical sentence saying "There exist entities such that [equations hold]" without naming the entities?
      *   A. Yes, that logical sentence is the whole reality of the theory. *(Leaf: Ramsey-Sentence Realism)*
      *   B. No, that's just a trick; the entities themselves matter. *(Leaf: Standard Scientific Realism)*
      *   C. Yes, but that sentence is all we can *know*, not all there *is*. *(Leaf: Epistemic Structural Realism)*

  8.  **The Structure-Only View:** If relations are all there is (no underlying stuff), is this a fact about the world or just a fact about how we write physics?
      *   A. It's a fact about the world; nature has no "things," only structure. *(Leaf: Ontic Structural Realism)*
      *   B. It's a fact about our math; we can't distinguish things anyway. *(Leaf: Ramsey-Sentence Realism)*
      *   C. It's incoherent; relations need things to relate. *(Dead End: The Anchorless Map)*

  ***

  # Key and Diagnostics

  ### Leaf Mapping & Awkward Commitments

  | Path | Position Name | The Awkward Commitment |
  | :--- | :--- | :--- |
  | **1A → 2A → 3C** | **Epistemic Structural Realism** | You must admit the world might be totally different from how you conceive it, provided the math stays the same. |
  | **1A → 2B → 4A** | **Entity Realism** | You have to believe in electrons while admitting almost everything you say *about* them is likely false. |
  | **1A → 2B → 4B** | **Standard Scientific Realism** | You must claim current theories are approximately true, despite history showing past "true" theories were discarded. |
  | **1A → 2B → 4C** | **Eliminativist Ontic** | You claim causes exist but refuse to describe them, risking the charge that you believe in magic ghosts. |
  | **1A → 3A → 7A** | **Ramsey-Sentence Realism** | You reduce all of physical reality to a logical formula, making the specific nature of particles irrelevant. |
  | **1A → 3A → 7B** | **Standard Scientific Realism** | (See above; this path converges here). |
  | **1A → 3B → 8A** | **Ontic Structural Realism** | You must accept a world of processes and relations without any "stuff" undergoing the processes. |
  | **1A → 3B → 8B** | **Ramsey-Sentence Realism** | (See above; this path converges here). |
  | **1B → 5A** | **Pessimistic Meta-Induction** | You must treat the success of your own work as a temporary accident destined to be proven wrong. |
  | **1B → 5B** | **Constructive Empiricism** | You must draw a sharp line between "observable" and "unobservable" that nature itself does not respect. |
  | **1C → 6A** | **Instrumentalism** | You treat your life's work as a sophisticated calculator rather than a description of reality. |
  | **1C → 6B** | **Fictionalism** | You must explain why useful fictions obey strict mathematical constraints better than some truths. |
  | **1A → 3B → 8C** | **Dead End: The Anchorless Map** | **Diagnosis:** Incoherent. You asserted structure is all there is (8), then claimed relations need things (C). This contradicts the premise of the branch. |

  ### Indistinguishability Report

  **Pair 1: Ontic Structural Realism vs. Ramsey-Sentence Realism**
  *   **Paths:** `1A → 3B → 8A` vs. `1A → 3A → 7A` / `1A → 3B → 8B`.
  *   **Diagnosis:** The tree cannot cleanly separate these without jargon. Both views cash out as "structure is primary, objects are derivative or nonexistent." One arrives via metaphysics (category theory/world nature), the other via logic (Ramsey sentences). Since the instrument forbids jargon in the nodes, the operational difference vanishes. They are effectively one view wearing two hats.
  *   **Fix:** Requires asking about *modal force* (does structure *necessitate* outcomes?) vs. *logical substitution*, which introduces technical terms forbidden by the "cold answer" constraint.

  **Pair 2: Epistemic Structural Realism vs. Standard Scientific Realism**
  *   **Paths:** `1A → 2A → 3C` vs. `1A → 2B → 4B`.
  *   **Diagnosis:** Both accept the math works and objects exist. The split is whether we *know* the objects or just the structure. In practice, physicists often answer "we know the structure" meaning "we know the objects via the structure," collapsing the distinction.
  *   **Fix:** Requires a question about the *nature of knowledge* (e.g., "Can you conceive of the object without the equation?"), which tends to confuse non-philosophers.

  ### Note on the Phlogiston Case
  The prompt frames Phlogiston as a case where "essentially nothing survives." Historically, this is contested (many phenomenological laws survived). However, for the purpose of this sorting instrument, it serves as the necessary "total rupture" case to trigger the **Pessimistic Meta-Induction** leaf. If a user objects that "some things survived," they should be instructed to answer based on the *core ontology* (the stuff itself), which did vanish.
