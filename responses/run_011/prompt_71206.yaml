  **Objection:** This displays no responsibility gap but a category confusion; blame, liability, and compensation are distinct, so an empty fault register is correct when harm is justified.
  **Reply:** Strict liability assigns cost, not moral responsibility. The victim's claim is for acknowledgment of a wrong, not merely compensation. The absence of a moral wrongdoer despite a specific victim constitutes the normative gap.

