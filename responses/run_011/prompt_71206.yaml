  A genuine gap remains in the **fault** register. Lee's claim implies a wrong was done to her by a specific agent (Aris), yet the facts preclude Aris being at fault. The victim's normative expectation of a wrongdoer is unfilled, not by opacity or diffusion, but by the structure of justified risk imposition. Her claim is directed at Aris because he authorized the harm, but it cannot land because he acted rightly.

  (d) The load-bearing feature.
  The **legal mandate binding the actor** does the most work.
