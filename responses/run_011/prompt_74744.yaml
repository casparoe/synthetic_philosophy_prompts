answer: |-
  # Teaching Plan: Access, Phenomenality, and the Global Workspace

  ## 1. Order of Presentation (Dependency Structure)

  **Phase 1: The Unity Intuition (0–10 mins)**
  *   **Goal:** Elicit the students' pre-theoretic commitment to the "single property" view of consciousness.
  *   **Move:** Ask, "When you open your eyes, is there a difference between *seeing* the whiteboard and *being able to talk about* the whiteboard?"
  *   **Dependency:** You must establish their baseline intuition (that these are identical) so that the subsequent separation feels like a discovery, not a stipulation.

  **Phase 2: The Phenomenological Crack (10–25 mins)**
  *   **Goal:** Introduce the carrying case (Change Blindness) to create friction between "seeming to see" and "using visual info."
  *   **Move:** Describe a change blindness scenario (e.g., the "door study" or a flicker task). Ask: "During the flicker, before you spot the change, is the changed object in your consciousness?"
  *   **Dependency:** The distinction cannot be stated until there is a case where the students feel pulled in two directions (It feels like I see everything vs. I can't report the change).

  **Phase 3: The Conceptual Split (25–40 mins)**
  *   **Goal:** Define Access (A) and Phenomenal (P) Consciousness as solutions to the friction in Phase 2.
  *   **Move:** Label the "ability to report/reason" as Access and the "what-it-is-like-ness" as Phenomenal.
  *   **Dependency:** This depends on Phase 2. If they don't feel the gap, the definitions are just jargon. This must precede GWT because GWT is a theory of *Access*, not Phenomenality.

  **Phase 4: Global Workspace Theory as a Theory of Access (40–55 mins)**
  *   **Goal:** Explain GWT as the mechanism for A-consciousness.
  *   **Move:** Map the "Access" definition onto the "Broadcasting" mechanism.
  *   **Dependency:** You cannot explain GWT's relevance without first restricting its scope to Access. If you introduce GWT before the A/P split, they will assume GWT explains Phenomenality (the Hard Problem), leading to confusion later.

  **Phase 5: The Remaining Gap (55–65 mins)**
  *   **Goal:** Locate the Hard Problem within this new framework.
  *   **Move:** Show that GWT explains how info becomes available, but not why availability feels like anything.
  *   **Dependency:** Depends on Phase 4. Only after seeing what GWT *does* (Access) can we see what it *doesn't* do (Phenomenality).

  **Phase 6: Assessment and Closure (65–75 mins)**
  *   **Goal:** Verify conceptual grasp and cut tangents.
  *   **Dependency:** Depends on all prior phases.

  ---

  ## 2. The Carrying Case: Change Blindness

  **Choice:** **Change Blindness** (specifically the "flicker" paradigm or real-world interruption variants).

  **Defense Against Alternatives:**
  *   **Vs. Partial Report (Sperling):** Sperling is the historical root of this distinction, but it risks conflating P-consciousness with *Iconic Memory* (a storage buffer). Students will treat the "rich experience" as just "lingering sensory traces" rather than a mode of consciousness. Change Blindness feels more like "seeing the world," which targets the philosophical intuition better.
  *   **Vs. Backward Masking:** Too low-level. It suggests the visual system was "interrupted" before processing finished. Students will attribute the lack of access to incomplete processing rather than a bottleneck in availability.
  *   **Vs. Attentional Blink:** Too temporal and technical. It focuses on processing speed limits. Change Blindness focuses on *content* richness vs. *selection*, which maps cleaner onto the A/P distinction (Rich P vs. Sparse A).

  **Required Features:**
  *   **Must Have:** The strong subjective intuition that the scene looks "complete" and "detailed" prior to the change detection (supporting P-richness).
  *   **Must Have:** A clear failure of verbal report or rational control regarding the changed element prior to detection (supporting A-limitation).
  *   **Must Lack:** Any suggestion that the unaccessed content is stored in a separate "box" (like a memory buffer). The unaccessed content must be presented as currently processed but not *globally available*.

  ---

  ## 3. The Whiteboard

  **The Anchor Drawing (Stays up from Minute 25 to 75):**
  Draw a large rectangle in the center labeled **"GLOBAL WORKSPACE."**
  *   **Surrounding the Workspace:** Draw smaller circles labeled **"Specialized Modules"** (Vision, Audition, Memory, Motor).
  *   **Arrows In:** From Modules *into* the Workspace (labeled "Competition/Selection").
  *   **Arrows Out:** From the Workspace *back to all Modules* (labeled "Broadcasting").
  *   **Output:** An arrow from the Workspace to a stick figure mouth/hand (labeled "Report/Action").
  *   **The "P" Overlay:** Do **not** draw a box for Phenomenal Consciousness. Instead, use a different color marker to draw a **shaded glow/cloud** over the Specialized Modules *before* they enter the workspace. Label this "Phenomenal Character (What it's like)."

  **Stage-by-Stage Drawing:**
  1.  **Minute 10 (Paradigm):** Draw two simple scenes (Scene A / Scene B) with one difference circled. Cross out the difference in Scene A. Write: "Did they see it?"
  2.  **Minute 25 (The Anchor):** Draw the Workspace diagram described above. This is the visual anchor for the rest of the hour.
  3.  **Minute 40 (GWT):** Trace the path of a detected object (Module -> Workspace -> Broadcast -> Report).
  4.  **Minute 55 (The Gap):** Point to the "P" glow. Ask: "Does the broadcast cause the glow, or does the glow exist without the broadcast?"

  ---

  ## 4. Misconceptions (Pre-emption Strategy)

  **1. Misconception: Access Consciousness = Verbal Report.**
  *   **When it forms:** Minute 30, when defining Access.
  *   **Pre-emption Move:** When writing "Report/Action" on the board, immediately add **"Reasoning, Rational Control."** Say aloud: "Access means the information is *poised* for use. If you were suddenly asked to reason about it, could you? If yes, it's Accessible. Speech is just one output channel."

  **2. Misconception: Phenomenal Consciousness = Ineffable Magic.**
  *   **When it forms:** Minute 35, when defining Phenomenality.
  *   **Pre-emption Move:** When drawing the "P" glow, label it **"Subjective Character."** Say aloud: "This is not a mystical aura. It is the claim that processing visual data feels different than processing auditory data. It is a structural feature of the state, not a ghost in the machine."

  **3. Misconception: The Two-Box Picture (Separate Stores).**
  *   **When it forms:** Minute 45, when looking at the Workspace diagram.
  *   **Pre-emption Move:** Explicitly gesture to the "P" glow. Say aloud: "Phenomenal consciousness is not a *place* where unaccessed stuff sits. It is a *property* of the processing in the modules. Do not draw a box in your notes for P-consciousness."

  **4. Misconception: GWT is Trivial or Irrelevant to P.**
  *   **When it forms:** Minute 60, when discussing the Hard Problem.
  *   **Pre-emption Move:** Frame GWT as a solution to the "Easy Problems" of access. Say aloud: "GWT is not irrelevant to P; it is the leading candidate for the *neural correlate* of P. But conceptually, explaining the broadcasting mechanism does not logically entail explaining why broadcasting *feels like* anything."

  ---

  ## 5. The Concession

  **The Difficulty:** The "Overflow" Debate (Does P-consciousness exceed A-consciousness, or is the feeling of richness an illusion?)
  **The Sentence:**
  > "We must concede that current data cannot decide whether the 'glow' of phenomenal consciousness actually contains more information than the workspace broadcasts, or whether it merely *seems* that way; the distinction holds conceptually even if the empirical boundary remains disputed."

  ---

  ## 6. The Closing Check

  **The Question (Minute 70):**
  "In a case of Change Blindness, *before* the subject detects the change: Is the changed object Access Conscious, Phenomenally Conscious, both, or neither? Justify your answer using the diagram."

  **Good Answer (Grasps the Distinction):**
  "Access is clearly **no**, because it isn't broadcast for report. Phenomenal is **debated/unclear**. A Blockian would say **yes** (rich experience without access), but a GWT purist might say **no** (no access, no consciousness). The key is recognizing that A and P can come apart in the answer."
  *Why it works:* It acknowledges the conceptual separation without treating Block's specific empirical claim as a definitional truth.

  **Bad Answer (Vocabulary Only):**
  "It is **Phenomenally Conscious but not Access Conscious** because Phenomenal means 'seeing it' and Access means 'saying it'."
  *Why it fails:* It treats Block's controversial empirical hypothesis as the definition of the terms. It collapses the distinction back into "Seeing vs. Saying" rather than "Availability vs. Subjective Character."

  ---

  ## 7. What to Leave Out

  **Cut:** **Recurrent Processing Theory (Lamme) vs. Global Workspace.**
  This is the main empirical rival regarding the neural correlate of consciousness. Discussing it requires diving into V1 vs. PFC activation, which will consume 20 minutes and confuse the conceptual distinction.

  **The Cut Sentence:**
  > "There is a serious empirical rival to Global Workspace Theory called Recurrent Processing Theory that locates consciousness earlier in the visual stream; we are setting that aside not because it is wrong, but because today we are analyzing the conceptual architecture of the Workspace model itself."
