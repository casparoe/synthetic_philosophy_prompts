      *   **Horn (b): Connectedness matters.** This is the Parfitian route. If connectedness matters, then the boundary between persons is not morally absolute.
      *   **The Rawls/Nozick Response:** They would likely reject the reductionist premise. They rely on a robust notion of the person as a moral unit. For them, the "person" is the site of rights/claims, regardless of psychological flux. They would argue that legal and moral responsibility binds the "stages" of a life together in a way that doesn't apply between distinct humans.
      *   **The "Missing" Element:** The user is missing the normative significance of *agency* and *commitment*. Even if psychological connectedness fades, the *decision* made at t1 binds the agent at t2 through rational planning and commitment. Also, there is a physical/biological continuity that grounds legal and moral responsibility, which doesn't exist between distinct people (even close friends).

