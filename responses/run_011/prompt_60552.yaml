answer: |-
  First, take a breath. You haven't made a mess of it; you have independently reconstructed one of the most significant debates in late twentieth-century moral philosophy. Your intuition is sharp, and the 'deferred diner' problem (which is a brilliant name, typo and all) cuts right to the bone of the issue.

  You are asking whether the 'separateness of persons' objection collapses under the weight of personal identity over time. To answer you, I need to address your Parfit hunch first, because that unlocks the rest of the puzzle.

  ### Parfit: The Verdict

  You are half-right on Parfit, but the direction is counter-intuitive. In *Reasons and Persons* (1984), Parfit argues for **Reductionism**. He claims personal identity isn't a 'deep further fact'; it just consists in psychological connectedness and continuity (memory, character, intentions) carried by a brain and body.

  Here is the twist: Parfit uses this view to **weaken** the separateness-of-persons objection, thereby handing utilitarianism (or something close to it) a get-out clause.

  Parfit's argument runs like this:
  1.  The Rawls/Nozick objection relies on a sharp distinction between 'intrapersonal' (within a life) and 'interpersonal' (between lives).
  2.  But if identity is just psychological connectedness, and connectedness comes in degrees, then the boundary between 'me now' and 'me in 20 years' is not fundamentally different in kind from the boundary between 'me' and 'you'.
  3.  Therefore, the moral significance of the boundary between persons is reduced. If we can sacrifice now for a psychologically distant future self, why is it so unthinkable to sacrifice one person for another, provided the connections (sympathy, knowledge, continuity of interest) are strong enough?

  So, Parfit agrees with your Horn (b). He thinks the objection loses its bite because the 'self' is less separate than we suppose. He doesn't become a card-carrying utilitarian, but he argues that the *metaphysical* barrier Rawls and Nozick erect is illusory.

  ### The Two Horns: How the Objector Responds

  If you are channeling Parfit, how do Rawls and Nozick (or their contemporary defenders) survive? They generally do not accept Parfit's Reductionism. They tend to dig in on a Non-Reductionist view, or at least a view that treats the 'person' as a normative unit regardless of psychological flux.

  Here is how they handle your dilemma:

  **Against Horn (a): Prudence is not unjustified.**
  They reject the idea that the objection makes prudence impossible. They argue that the 'person' is the locus of rights and rational agency. Even if your psychology changes, you remain the same *agent* in the eyes of the law and morality. You signed the contract at 27; the agent at 33 is bound by it. The continuity of the *body* and the *legal identity* provides the glue that psychological connectedness does not. The objection to utilitarianism isn't about psychological fusion; it's about the inviolability of rights-bearing units.

  **Against Horn (b): Connectedness isn't what matters morally.**
  This is the stronger defence. They argue that even if your mother is psychologically closer to your friend than to her teenage self, the *moral structure* is different.
  1.  **Compensation:** In the intrapersonal case (your PhD stipend), compensation is *possible* in principle. The 33-year-old you *can* look back and say, 'It was worth it.' The benefit lands in the same life-narrative. In the interpersonal case, if I sacrifice you for me, you never get to say, 'It was worth it.' The benefit leaves your life-narrative entirely.
  2.  **Consent:** You (at 27) consented to the grind for the future gain. In the social trade-off, the loser rarely consents to be the sacrifice.
  3.  **The 'All-or-Nothing' of Rights:** Rawls argues that justice is not about maximising good, but about fair terms of cooperation. Rights act as trumps. The fact that psychological connectedness fades doesn't dissolve the right not to be used merely as a means.

  So, the objector takes neither horn exactly. They reject the premise that psychological connectedness is the metric that matters for the objection. They insist on the **integrity of the life as a whole**.

  ### The Deferred Diner and Your Mother

  Your specific cases are fascinating applications of this.

  **The Deferred Diner (27 vs 33):**
  The utilitarian says: 'Maximise utility across the timeline.'
  The Rawlsian says: 'Ensure the 27-year-old isn't being exploited.'
  But here, you are both parties. You are the exploiter and the exploited. Most philosophers argue that rational prudence allows you to bind your future self. The 'separateness' objection is specifically about *distinct* claims. When the claims belong to the same life, the 'sum' adds up to something: a life. A life can go better or worse as a whole. A society cannot go better or worse as a whole in the same way because there is no 'social mind' to experience the sum.

  **Your Mother (14 vs Now):**
  This is the 'fission' or 'replacement' worry. If your mother is psychologically discontinuous with her 14-year-old self, is she responsible for that girl's promises?
  Legally and morally, yes. Why? Because we treat the human organism as the person. The psychological discontinuity is tragic, perhaps, but it doesn't dissolve moral obligation.
  However, your point stands: if connectedness is what matters, then perhaps we owe more to our close friends than to our distant future selves. Parfit would agree with you. A Rawlsian would say: 'No, the boundary of the skin is the boundary of justice.'

  ### What You Are Missing (The 'Fatal' Flaw)

  You asked what makes this not fatal to the objection. The missing piece is the **asymmetry of compensation**.

  In your PhD case:
  *   Cost: Borne by 27-year-old.
  *   Benefit: Enjoyed by 33-year-old.
  *   **Crucial:** The 33-year-old is the *same person* who bore the cost. They can integrate the sacrifice into a single narrative of success. The suffering is redeemed *within the life*.

  In the Utilitarian Social Case:
  *   Cost: Borne by Person A.
  *   Benefit: Enjoyed by Person B.
  *   **Crucial:** Person A dies without the redemption. The suffering is *not* redeemed within their life.

  The separateness of persons objection isn't just about whether the selves are 'connected'; it's about whether the *redemption of the sacrifice* stays within the same moral container. Even if the 27-year-old and 33-year-old are strangers psychologically, they share a grave. They share a single biography. Person A and Person B do not.

  ### Summary

  1.  **Parfit:** He argues that reducing identity to connectedness weakens the separateness objection (favouring your Horn b). He thinks this makes utilitarianism more plausible, not less.
  2.  **Rawls/Nozick:** They resist Parfit. They argue that the 'person' is a normative unit defined by rights and the capacity for a life-plan, not just psychological threads. The 'life as a whole' can absorb costs in a way 'society as a whole' cannot.
  3.  **Your Insight:** You are correct that if we push hard on psychological connectedness, the distinction blurs. But the objector survives by insisting that biological/legal identity creates a container for compensation that interpersonal trade-offs lack.

  You haven't found a mess; you've found the exact pressure point Parfit exploited. The reason it isn't 'fatal' is that most non-utilitarians refuse to follow Parfit into Reductionism. They insist that the boundaries of a human life have moral significance that mere psychological connectedness cannot dissolve.

  And for the record, 'deferred diner' is canonical now. It perfectly captures the hunger of the present self for a meal served to a stranger in the future. Good luck with the stipend; I hope the 33-year-old you buys the 27-year-old you a very nice drink in memory.
