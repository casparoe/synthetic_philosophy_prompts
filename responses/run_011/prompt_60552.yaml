  2.  **Deconstruct the Philosophical Issues:**
      *   **The Separateness of Persons:** Rawls (*A Theory of Justice*) and Nozick (*Anarchy, State, and Utopia*) argue utilitarianism treats society as a super-individual, ignoring the distinction between persons. Sacrificing A for B is wrong, even if the net utility rises, because A doesn't share in B's gain.
      *   **Intrapersonal Trade-offs:** We accept sacrificing now for later (saving for retirement, studying for a degree). This relies on personal identity over time.
      *   **Parfit's Contribution:** Derek Parfit (*Reasons and Persons*) is the key figure here. He argues that personal identity isn't what matters; *psychological connectedness/continuity* is what matters.
      *   **The User's "Deferred Diner":** This is a classic Parfitian puzzle. If the future self is psychologically distant, is the sacrifice unjust?
      *   **The User's "Mother" Case:** Intergenerational or deep friendship connectedness might exceed intrapersonal connectedness over long spans.

  3.  **Address the Parfit Question first (it clarifies the rest):**
      *   Parfit is a reductionist about identity. He believes identity isn't a deep further fact.
      *   He argues that the "separateness of persons" objection relies on a strict view of identity.
      *   *Crucial Point:* Parfit actually uses the reductionist view to *weaken* the objection to utilitarianism (or at least, to show that the distinction between intra- and inter-personal cases is less sharp than we think). He suggests that if identity isn't what matters, then the moral significance of the boundary between persons is reduced.
      *   *Correction/Nuance:* Parfit doesn't necessarily become a utilitarian, but he argues that the "separateness of persons" is not a metaphysical barrier to aggregation in the way Rawls/Nozick think. He leans towards the view that the objection loses force if we accept reductionism. So, he hands utilitarianism (or something like it) a "get-out clause" regarding the metaphysical weight of the objection, though he might still have other normative concerns.

  4.  **Address the Two Horns:**
