answer: |-
  You have identified a specific rhetorical maneuver that sits at the intersection of critical discourse analysis, the philosophy of history, and cognitive linguistics. You are correct that it lacks a single, canonical name, though it is composed of well-known parts. The phenomenon is real, it is distinct from environmental determinism as a thesis, and it is distinct from metaphor as a decoration.

  Here is the carving you are looking for.

  ### 1. The Existing Landscape (and why it misses)

  You are right to reject the near neighbors. Here is why they do not capture the specific configuration you describe:

  *   **Critical Discourse Analysis (CDA):** CDA has a robust concept of **Agency Assignment**. It studies how grammar is used to hide responsibility (e.g., "mistakes were made" vs. "I made a mistake"). Your phenomenon is the inverse: grammar is used to *assign* responsibility to non-agents. However, CDA usually focuses on political power (humans hiding human agency), not the oscillation between human and non-human agency based on narrative outcome.
  *   **Hayden White (Metahistory):** White argued that **Emplotment** (choosing a narrative form like Tragedy or Romance) imposes moral and causal meaning that isn't in the raw data. Your observation is a micro-syntactic version of White's macro-narrative claim. But White focuses on the whole story arc; you are identifying a sentence-level mechanism that operates *within* the arc.
  *   **Actor-Network Theory (ANT):** ANT deliberately grants agency to non-humans ("actants"). But ANT is *ontologically committed*. It argues non-humans *do* have agency. Your phenomenon is *ontologically opportunistic*: it grants agency when the story needs a villain (the volcano) and revokes it when the story needs a hero (the farmer), without acknowledging the shift.
  *   **Force Dynamics (Cognitive Linguistics):** Leonard Talmy described how language encodes interactions of force (e.g., "The ball kept rolling" vs. "The wind pushed the ball"). This explains *how* the sentence works cognitively, but not *why* it is deployed inconsistently to shield the author from determinism.

  ### 2. The Carving: Contingent Grammatical Agency

  Since no single term exists, I propose **Contingent Grammatical Agency (CGA)**.

  **Definition:** A rhetorical configuration in which the syntactic subject position (and thus the role of causal Agent) is assigned to non-human forces or human actors not based on a consistent ontological or causal theory, but contingent upon the dramatic requirements of the narrative outcome.

  **The Three Markers:**
  1.  **Syntactic Transitivity:** A non-human entity occupies the subject slot of a transitive verb acting upon a human society (e.g., "The drought emptied the cities").
  2.  **Outcome Contingency:** This assignment occurs primarily when the outcome is catastrophic or disruptive. When the outcome is stability or adaptation, human agents return to the subject slot, and the non-human force is demoted to a prepositional phrase or subordinate clause.
  3.  **Plausible Deniability:** The causal claim is encoded in grammar rather than assertion, allowing the author to disavow determinism when challenged while retaining the dramatic impact of the framing.

  ### 3. The Line: A Principled Test

  You asked for a test to distinguish innocuous vividness from CGA. Vividness is ornamental; CGA is structural.

  **The Passive Transformation Test:**
  Take the sentence in question and convert it to the passive voice or a stative construction, removing the non-human agent.
  *   *Original:* "The volcano rewrote the nineteenth century."
  *   *Transformation:* "The nineteenth century was changed during a period of volcanic activity."

  If the transformed sentence feels like a *weakening* of the author's argument, or if the author would resist the change because it "loses the point," then the grammar was doing causal work. If the author accepts the change as stylistically flatter but factually identical, it was merely vividness.

  **The Asymmetry Check:**
  Scan the surrounding text. Does the grammar shift agency based on the *valence* of the event?
  *   *CGA:* "The plague killed millions" (Active/Nature) followed by "Survivors rebuilt the economy" (Active/Human).
  *   *Non-CGA:* "Millions died in the plague" (Passive/Event) and "The economy was rebuilt by survivors" (Passive/Event) — OR — "The plague killed millions" and "The climate destroyed the harvest." (Consistent assignment).

  The asymmetry is the smoking gun. It proves the agency is narrative-driven, not ontology-driven.

  ### 4. The Legitimacy of the Disavowal

  Is "I was only writing vividly" ever a legitimate defense?

  **Yes, but only under two conditions:**
  1.  **Explicit Flagging:** The text explicitly acknowledges the metaphorical nature of the agency. (e.g., "If we can speak of the drought as an actor...")
  2.  **Argumentative Correction:** The body of the text systematically argues *against* the implication of the framing sentences. If the introduction says "The volcano rewrote history," but the conclusion says "Human political choices determined the response to the volcano," the text is fighting its own grammar.

  If the framing sentences (titles, subtitles, topic sentences) carry the CGA, and the nuanced body text carries the human agency, the **Framing Effect** dictates that the reader will remember the grammar, not the nuance. In this case, the disavowal is illegitimate. The prose is not describing the argument; it is *performing* a different argument.

  ### 5. Boundary Cases

  To ensure this carving does not collide with existing terms, here are the boundaries:

  *   **The Weakest Case (Still CGA):** A text where the asymmetry is subtle. "The frost damaged the crop" (Nature subject) vs. "Farmers planted wheat" (Human subject). Even with weak verbs ("damaged"), if the switch tracks exclusively with disaster vs. normalcy, it is CGA.
  *   **The Nearest Non-Case (Metaphor):** "The market trembled." This is personification, but it is not making a historical causal claim about human society. It is descriptive. CGA requires a claim about *historical causation*.
  *   **The Nearest Non-Case (ANT):** A text that consistently treats non-humans as agents, even in stable times. "The soil negotiated with the farmer." This is a philosophical commitment, not a narrative shortcut. It is not *contingent*.
  *   **The Colliding Term:** **Linguistic Determinism** (Sapir-Whorf). This claims language *limits thought*. CGA claims language *misleads the reader about history*. They are distinct. To avoid confusion, avoid the phrase "Grammatical Determinism" and stick to **Contingent Grammatical Agency**.

  ### 6. Why This Matters

  You are right that this settles the debate in advance. In the philosophy of science, this is a form of **Question-Begging Emplotment**.

  By placing "The Drought" in the subject slot, the text presupposes the drought is the *cause*. By placing "The Farmers" in the subject slot, the text presupposes the farmers are the *cause*. When the text switches between these without argument, it creates a **Causal Illusion**: the reader perceives a coherent theory of history where nature drives disaster and humans drive recovery, without the author ever having to defend why nature isn't also credited for recovery (e.g., "The rain restored the economy") or humans blamed for disaster (e.g., "The kings emptied the cities").

  This configuration allows authors to have it both ways: the dramatic punch of determinism ("The Volcano Ended the Dynasty") with the moral safety of humanism ("But the people survived"). It is a **Rhetorical Hedge** against the complexity of coupled human-natural systems.

  **Summary for your vocabulary:**
  When you encounter this, you are seeing **Contingent Grammatical Agency**. It is a **Narrative Hedge** that uses **Syntactic Transitivity** to assign **Causal Responsibility** opportunistically. It is not environmental determinism; it is **Determinism by Syntax**.
