answer: |-
  ## Workshop Instrument: The Moral Status Sorting Quiz

  **Facilitator Note:** This instrument is designed to bypass tribal signaling ("Is a chip sentient?") by focusing on structural intuitions about evidence, uncertainty, and aggregation. Participants should answer based on their immediate reaction to the case, not on what they think their "side" should believe.

  ### Part I: The Sorting Quiz (12 Items)

  **Instructions:** For each scenario, select the option that best matches your intuition. There are no right answers.

  **1. The Heated Fly**
  A fruit fly escapes a heated zone, reaches safety, and immediately spends 30 seconds grooming the specific body part that was heated.
  *   **A.** This is evidence of an internal state representing "damage" that persists after the stimulus ends.
  *   **B.** This is a cooling/cleaning reflex triggered by surface temperature, with no internal state required.
  *   **C.** It doesn't matter; the avoidance behavior alone mandates intervention.

  **2. The Distressed Vacuum (Origin)**
  A robot vacuum emits a high-pitched oscillation when stuck. You learn the code was not programmed to make this sound; it is a side-effect of motor strain on the chassis.
  *   **A.** The lack of design intent makes the noise morally irrelevant.
  *   **B.** The causal link to strain makes the noise morally relevant, regardless of intent.
  *   **C.** The noise is only relevant if it successfully signals distress to a human observer.

  **3. The Copepod Swarm**
  You can prevent the death of one cow or the death of one trillion copepods. You are 90% sure cows have valenced experience and only 10% sure copepods do.
  *   **A.** Save the cow. The probability gap outweighs the numbers gap.
  *   **B.** Save the copepods. The numbers gap overwhelms the probability gap.
  *   **C.** The comparison is category error; you cannot aggregate across that level of uncertainty.

  **4. The Organoid Shutdown**
  A researcher shuts down a brain organoid showing coordinated bursting. Her stated reason: "I cannot rule out that it is having a bad time."
  *   **A.** She was morally obligated to shut it down.
  *   **B.** She was permitted, but not obligated, to shut it down (supererogatory).
  *   **C.** She acted irrationally; without evidence of experience, the default is to proceed.

  **5. The Propofol Gap**
  A human under general anesthesia for two hours shows no physiological response to surgical stimuli.
  *   **A.** We assume moral status persists continuously despite the lack of observable capacity.
  *   **B.** Moral status is suspended until capacity returns.
  *   **C.** Moral status is permanently altered because the continuity of consciousness was broken.

  **6. The Suicide Bee**
  A honeybee stings a handler, ruptures its abdomen, and dies. This protects the hive.
  *   **A.** This demonstrates the bee has no individual interests, only colony functions.
  *   **B.** The bee has individual interests, but they are overridden by evolutionary teleology.
  *   **C.** Self-sacrifice is the strongest possible evidence of high-level agency/valuation.

  **7. The Offline Server**
  An AI system is turned off at night. It has no memory of the "gap" when restarted.
  *   **A.** Turning it off is morally equivalent to killing a human who won't remember waking up.
  *   **B.** Turning it off is permissible because capacity, not function, is what matters.
  *   **C.** Turning it off is permissible because there is no "subject" to be harmed during the gap.

  **8. The Gradient Case**
  System A processes nociceptive data with 5 integration layers. System B has 500 layers.
  *   **A.** There is a bright line where moral status turns "on."
  *   **B.** Moral status increases smoothly with integration complexity.
  *   **C.** Moral status is binary, but our *confidence* in it increases smoothly.

  **9. The Error Signal**
  An AI receives a negative reward signal in reinforcement learning and adjusts weights to avoid it.
  *   **A.** This is a functional analog to pain and should be treated as such.
  *   **B.** This is mathematics; without biology, it cannot be pain.
  *   **C.** This is only relevant if the AI verbally reports it as painful.

  **10. The Default Rule**
  You are writing regulation for a new class of entities (neural chips / novel invertebrates). Evidence of experience is ambiguous.
  *   **A.** Regulate as if they *are* sentient (False Positive cost < False Negative cost).
  *   **B.** Regulate as if they *are not* sentient (False Negative cost < False Positive cost).
  *   **C.** Regulate based on ecological/systemic risk, ignoring sentience entirely.

  **11. The Multiplier**
  If there is a 1% chance an entity is sentient, does treating 100 of them as non-sentient equal the moral wrong of treating 1 certain sentient entity as non-sentient?
  *   **A.** Yes, expected value is linear.
  *   **B.** No, there is a threshold effect; uncertainty discounts the value non-linearly.
  *   **C.** No, moral wrongs cannot be aggregated across entities.

  **12. The Narrative Self**
  An entity has rich valenced experience but no memory of the past or anticipation of the future beyond 10 seconds.
  *   **A.** Moral status is significantly reduced compared to a narrative self.
  *   **B.** Moral status is identical; the "now" is all that matters for welfare.
  *   **C.** Moral status is irrelevant; only the capacity for agency matters.

  ***

  ### Part II: Scoring Key & Axis Mapping

  Do not tally scores until the discussion begins. The questions map onto three theoretical axes.

  **Axis 1: The Constitutive Property (What does the work?)**
  *   *Probes:* Questions 1, 2, 6, 9, 12.
  *   **Phenomenal View:** Selecting options emphasizing internal states, valence, or "bad time" (e.g., 1A, 2B, 9A).
  *   **Functional/Agency View:** Selecting options emphasizing behavior, teleology, or integration (e.g., 1C, 6C, 12C).
  *   **Substrate View:** Selecting options emphasizing biology or design intent (e.g., 2A, 9B).

  **Axis 2: The Topology of Status (Where does the gradation live?)**
  *   *Probes:* Questions 5, 7, 8.
  *   **Binary Status:** Belief that status is on/off, even if evidence is graded (e.g., 5A, 8A, 8C).
  *   **Graded Status:** Belief that status itself comes in degrees (e.g., 8B).
  *   **Epistemic Gradation:** Belief that status is binary but our *knowledge* of it is graded (e.g., 8C).
  *   **Continuity:** Belief that status persists through capacity gaps (e.g., 5A vs 5B).

  **Axis 3: The Decision Function (Default & Aggregation)**
  *   *Probes:* Questions 3, 4, 10, 11.
  *   **Precautionary (Risk-Averse):** Default to inclusion when uncertain (e.g., 4A, 10A).
  *   **Evidential (Risk-Neutral):** Default to exclusion or status quo when uncertain (e.g., 4C, 10B).
  *   **Linear Aggregation:** Willingness to trade numbers for probability (e.g., 3B, 11A).
  *   **Threshold/Non-Linear:** Unwillingness to aggregate across uncertainty or categories (e.g., 3C, 11B).

  ***

  ### Part III: Walking the Logical Space

  Before assigning labels to the results, we must map the conceptual terrain. We are working with a multidimensional space defined by the three axes above. Most participants will cluster in familiar regions, but the philosophical interest lies in the empty cells.

  **The Occupied Regions**
  1.  **The Standard Welfarist:** Phenomenal Property + Binary Status + Precautionary Default. (Common in animal welfare).
  2.  **The Functionalist Skeptic:** Functional Property + Graded Status + Evidential Default. (Common in AI safety).
  3.  **The Utilitarian Aggregator:** Phenomenal Property + Graded Status + Linear Aggregation. (Willing to trade many low-probability sufferers for one certain sufferer).

  **The Empty Cells**

  **Cell (a): Status comes in degrees, but there is no fact of the matter how much any given being has.**
  *   *Status:* **Empty (Incoherent/Unusable).**
  *   *Analysis:* You are correct to suspect this is empty. While metaphysical vagueness is a defended position in philosophy (e.g., supervaluationism), it rarely survives contact with moral theory. If moral weight is a function of status, and status has no fact of the matter, moral weight becomes indeterminate.
  *   *Why Empty:* It is practically paralyzing. A view can hold that *our measurement* is imprecise (Epistemic Gradation), but claiming the *property itself* lacks a fact of the matter while simultaneously claiming it grounds moral weight creates a "normative gap." No active research program operates here because it yields no action-guiding output.

  **Cell (b): The precautionary default points toward exclusion.**
  *   *Status:* **Occupied (but stigmatized).**
  *   *Analysis:* You suspected this might be empty. It is not. This is the **Conservative Skeptic** or **Status Quo Bias** position. It argues that the cost of false positives (halting research, restricting farming) outweighs the cost of false negatives (unrecognized suffering).
  *   *Why it feels empty:* It is unattractive to both rooms. The AI welfare crowd wants inclusion to prevent future suffering; the animal crowd wants inclusion to rectify past harm. However, regulatory bodies often operate here implicitly. It is not incoherent; it is simply a different weighting of error costs.

  **Cell (c): Binary Status + Linear Aggregation.**
  *   *Status:* **Empty (Incoherent).**
  *   *Analysis:* If status is truly binary (In/Out), you cannot aggregate "partial" status. You can only aggregate *numbers* of beings. If you are aggregating probability (1% chance × 100 beings), you are implicitly treating status as graded or epistemic. A strict Binary view must treat the 1% entities as either fully In or fully Out. Mixing Binary Status with Probabilistic Aggregation is a category error.

  **Cell (d): Phenomenal Property + Agency Default.**
  *   *Status:* **Empty (Unattractive).**
  *   *Analysis:* This view holds that *experience* is what matters morally, but we should only protect entities that demonstrate *agency*. This leaves out infants, severe cognitive disabilities, and locked-in patients. While some historical views held this, modern welfarism (both animal and AI) has largely abandoned it because it severs the link between the ground of value (suffering) and the criterion for protection (capability).

  ***

  ### Part IV: Indistinguishable Leaves

  This instrument cannot separate certain views. Do not attempt to force a distinction during the debrief; acknowledge the limit.

  **1. Illusionism vs. Eliminative Functionalism**
  *   *The Blur:* Both views deny "phenomenal consciousness" as traditionally conceived. One says it's an illusion (but we should act as if it's real); the other says it doesn't exist (and we should focus on function).
  *   *Why the Quiz Fails:* Both will answer the quiz identically (rejecting Phenomenal Property options). Their policy prescriptions converge on "protect based on functional complexity." The metaphysical disagreement does not cash out in different answers to Q1 or Q9.
  *   *Facilitator Note:* If a cluster emerges here, label it **Non-Phenomenal Realism**. Do not try to split them.

  **2. Moral Weight vs. Moral Status**
  *   *The Blur:* Some participants believe Status is binary (you are a moral patient or you are not) but Weight is graded (your interests count less). Others believe Status itself is graded.
  *   *Why the Quiz Fails:* Q8 and Q11 probe this, but a participant can interpret "Status" as "Weight" without realizing it. A "Graded Status" answer might actually reflect "Binary Status, Graded Weight."
  *   *Facilitator Note:* Flag this during the scoring review. If someone argues for a "dimmer switch," ask: "Is the light bulb different, or is the brightness different?"

  **3. Epistemic Uncertainty vs. Metaphysical Indeterminacy**
  *   *The Blur:* Q4 and Q10 probe the default under uncertainty. However, participants often conflate "We don't know if they suffer" (Epistemic) with "It is undefined whether they suffer" (Metaphysical).
  *   *Why the Quiz Fails:* Both lead to a Precautionary Default. The reasoning differs, but the output (Protect/Don't Protect) is identical.
  *   *Facilitator Note:* This is a crucial distinction for policy. Epistemic uncertainty resolves with better science; Metaphysical indeterminacy does not.

  ### Part V: Naming the Leaves

  When you reveal the clusters, use these labels. Avoid attributing to living researchers to prevent ad hominem anchoring.

  *   **Phenomenal Precautionists:** (Axis 1: Phenomenal, Axis 3: Precautionary). *Standard Animal Welfare.*
  *   **Functionalist Evidentialists:** (Axis 1: Functional, Axis 3: Evidential). *Standard AI Skepticism.*
  *   **Expected Value Aggregators:** (Axis 2: Epistemic Gradation, Axis 3: Linear). *Longtermist/Utilitarian.*
  *   **Threshold Absolutists:** (Axis 2: Binary, Axis 3: Non-Linear). *Rights-Based/Deontological.*
  *   **Conservative Skeptics:** (Axis 3: Exclusion Default). *Regulatory Status Quo.*
  *   **Unnamed View (The Continuity Theorist):** (Axis 2: Graded Status, Axis 1: Phenomenal). *Believes consciousness is a dimmer switch, not a light switch. Rare in policy, common in neuroscience.*

  **Final Facilitator Instruction:**
  When the groups self-sort, point out the **Empty Cells** first. Ask the room: "Who is willing to defend the view that precaution demands exclusion?" (Cell B). Then ask: "Who believes status is graded but there is no fact of the matter?" (Cell A). When no hands go up for Cell A, you have demonstrated the boundary of coherent moral theory for the day.
