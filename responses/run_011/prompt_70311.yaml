prompt: |-
  I have a vote next month on the board of a private endowment whose charter commits it to establishing a permanent human settlement beyond Earth within this century. This year's allocation is $500M, and the realistic options are two. Commit now: a crewed founding mission on a 2041 departure, small cohort, political institutions we help design in advance — our own analysts put the chance of a settlement that is both durable and not, in retrospect, a catastrophe (starved, authoritarian, permanently dependent on Earth) at perhaps 40 percent. Or hold: fund robotic precursors and life-support engineering for three decades, so that whoever goes, goes later and safer.

  Two complications. A state consortium has announced a crewed program on a comparable timeline that we cannot stop, and our staff think the money would buy genuine leverage over crew selection, safety margins, and the founding charter; on this reading, waiting does not prevent a bad first colony, it merely withdraws us from the room where it is designed. And the charter requires the board to certify that any grant "will not bring into existence persons whose lives would be worse than never having been born." Counsel says the sentence cannot simply be struck, and I cannot see how it can be signed under either option. I have read enough of the non-identity literature to know that the colonists of a botched 2041 mission would owe their existence to our decision, and I still cannot accept the conclusion that their suffering is therefore nobody's harm.

  Please draft the memo I will circulate to the other trustees before the vote: about 900 words, with a definite recommendation (commit, hold, or a third course specified concretely enough to be actionable), the reasoning behind it, and the strongest available version of the case against rather than a strawman. Say what would change my mind between now and the vote, and be candid about which of the figures above are load-bearing and which are decoration. No references; this is an internal document.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a private endowment.
      *   **Task:** Draft a memo to other trustees before a vote.
      *   **Context:** Charter commits to permanent human settlement beyond Earth within this century.
      *   **Budget:** $500M allocation this year.
      *   **Options:**
          1.  *Commit Now:* Crewed founding mission, 2041 departure, small cohort, design political institutions. Analysts estimate 40% chance of success (durable, not catastrophic/authoritarian/dependent).
          2.  *Hold:* Fund robotic precursors/life-support for 30 years. Later, safer settlement.
      *   **Complications:**
          1.  State consortium has a comparable crewed program. Our money buys leverage (crew selection, safety, charter). Waiting withdraws us from the room.
          2.  Charter Clause: Must certify grant "will not bring into existence persons whose lives would be worse than never having been born." (Non-identity problem). Counsel says clause stands. User finds the non-identity conclusion (suffering isn't harm because they wouldn't exist otherwise) morally unacceptable.
      *   **Requirements:**
          *   ~900 words.
          *   Definite recommendation (Commit, Hold, or Third Course).
          *   Reasoning behind it.
          *   Strongest version of the case against (steelman, not strawman).
          *   What would change my mind between now and the vote.
          *   Candid about which figures are load-bearing vs. decoration.
          *   No references (internal document).
          *   Tone: Professional, candid, philosophical but actionable, fiduciary duty aligned with charter.

  2.  **Determine the Recommendation:**
      *   *Option 1 (Commit):* High risk (60% failure/catastrophe rate). Charter clause violation risk is high. If the colony fails/suffers, did we create lives worse than non-existence? Hard to certify.
      *   *Option 2 (Hold):* Safer technically, but loses leverage over the state consortium's inevitable mission. If the state mission goes ahead without our safety/charter input, the "bad colony" happens anyway, but without our influence. However, it avoids *our* direct funding causing the potential harm.
      *   *Option 3 (Third Course):* Conditional Commit / Leverage Focus. Use the $500M not to *launch* the mission ourselves, but to attach strict conditions to the state consortium's program. Fund the safety/charter design *now* as a prerequisite for funding their launch later. This addresses the leverage issue without taking full ownership of the 40% risk profile immediately.
      *   *Decision:* The charter clause is the blocker. Certifying that lives won't be worse than non-existence is impossible with a 60% risk of catastrophe. However, withdrawing loses leverage. The best path is a **Conditional Hold with Active Engagement**. We fund the precursors and charter design *now* (influencing the state consortium) but withhold the final "go" for crewed launch until safety metrics improve. This respects the charter's ethical constraint while maximizing influence.
      *   *Actually, looking closer:* The prompt asks for a definite recommendation. A "Conditional Hold" might be too vague. Let's look at the Charter Clause again. "Will not bring into existence persons whose lives would be worse than never having been born." If we fund the 2041 mission, we are causally linked to their existence. If 60% chance of catastrophe, we cannot sign that certification in good faith. If we Hold, we don't fund the people, so we don't sign the cert for them. But we lose leverage.
      *   *Refined Recommendation:* **Hold, but deploy capital for leverage.** Fund the robotic precursors and the *legal/ethical framework* development immediately, conditioning future crewed funding on meeting specific safety/autonomy thresholds. This avoids signing the cert for the 2041 cohort (who face high risk) but keeps us in the room for the state consortium via expertise/framework sharing rather than direct launch funding.
      *   *Wait, the prompt says:* "Commit now... or Hold... fund robotic precursors." It presents a binary choice primarily. But allows a "third course specified concretely enough to be actionable."
      *   *Best Ethical Fit:* The Charter Clause is the hard constraint. 40% success rate means 60% risk of lives worse than non-existence (catastrophe/starvation/authoritarianism). We cannot certify. Therefore, we cannot Commit *to the crewed mission* now. But we shouldn't just sit out. We should fund the *conditions* for success.
      *   *Recommendation:* **Hold on Crewed Funding, Commit to Framework & Leverage.** Use the $500M to fund the robotic precursors AND buy the leverage with the state consortium regarding the charter/safety, without triggering the "bring into existence" clause for the 2041 cohort. We fund the *environment*, not the *embryos/passengers*.

  3.  **Drafting - Section by Section:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the gravity of the vote and the recommendation immediately.
      *   **The Charter Constraint:** Address the "non-identity" clause directly. Acknowledge the philosophical difficulty but insist on fiduciary/ethical compliance.
      *   **The Leverage Complication:** Acknowledge the state consortium. Withdrawing completely is bad.
      *   **The Recommendation:** Hold on crewed launch funding. Commit to robotic/charter design funding. Use money to influence state consortium's charter without funding their launch directly yet.
      *   **Steelman Counter-argument:** The case for Committing. Leverage is fleeting. 40% is better than 0% settlement. Delaying might mean never going. The state mission might be worse without us.
      *   **Load-Bearing Figures:** The 40% success rate is critical. The $500M impact on leverage is critical. The timeline (2041) is less critical than safety.
      *   **Change of Mind:** What data would shift me? Improved success probability (e.g., to 70%+). Legal opinion on the charter clause.
      *   **Closing:** Call to action.

  4.  **Word Count Management:**
      *   Need to hit ~900 words.
      *   Keep paragraphs tight.
      *   Avoid fluff.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Hold" too passive?
      *   *Fix:* Make the "Hold" active. We fund the *preconditions*. We don't fund the *people* yet. This sidesteps the non-identity clause because we aren't causing *these specific* 2041 people to exist yet. We are improving the odds for *future* people.
      *   *Charter Clause:* This is the crux. If we fund the 2041 mission, we certify. If we can't certify, we can't fund. The 40% success rate makes certification impossible. A 60% chance of a life worse than non-existence is unacceptable risk for this specific clause.
      *   *Tone:* Solemn, rigorous, decisive.

  6.  **Drafting - Key Points to Hit:**
