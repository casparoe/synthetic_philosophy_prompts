  *(Refining the Recommendation)*: Let's call it "Conditional Hold." We release funds for robotics and Charter design immediately, but withhold crewed launch funding until the success probability exceeds a specific threshold. This uses the money now (addressing leverage) without triggering the certification clause for the 2041 cohort.

