      *(Self-Correction during drafting)*: Make sure I distinguish between "Sunlight helps" and "Sunlight substitutes for a ban." The member argues for *substitution*. Many readings might support "helps" but fail "substitution." I need to be sharp on that distinction.
      *(Self-Correction on Harm)*: Emphasize the sponsor's point: Contingent fees distort *incentives*. Sunlight reveals the incentive but doesn't remove it. This is the core logical gap.

  9.  **Final Review against Prompt:**
