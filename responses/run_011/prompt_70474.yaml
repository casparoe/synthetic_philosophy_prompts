      *   **Xunzi:** Human nature is raw, self-interested, potentially chaotic. Goodness is "artificial" (wei) - created through ritual (li), teachers, models, and accumulated practice. Moral action flows from adherence to established forms and cognitive understanding of duty/order, even when feelings don't align. Risk: Can become rigid or hollow, but succeeds where feelings are absent.

  3.  **Brainstorming the Scenario:**
