answer: |-
  Consider two matched site supervisors, Alex and Jordan, working at separate but identical construction firms, both facing a decision to pour concrete before a weekend storm. The variable varied is their prior moral cultivation: Alex has been guided to trust and extend their immediate sympathetic responses to those physically present when resolving ethical dilemmas, while Jordan has been guided to submit their impulses to the authority of inherited technical standards and professional rituals regardless of personal sentiment. The situation holds fixed the stakes: pouring now allows their visible, exhausted crew to leave early and avoid weekend inconvenience, but risks a structural weakness that would only endanger unseen future occupants years later. Both supervisors are ordinary, decent people who care about doing right, neither faces punishment for delay, and the safety risk is statistically real but emotionally abstract.

  (1) **Predictions and Reasoning:**
  The Mencian account predicts Alex will likely fail to wait for the safety verification. Since Mencius locates moral motivation in the "sprouts" of virtue—innate emotional responses like compassion that must be extended from the near to the far—Alex's deliberation relies on affective resonance. The crew's exhaustion is visible and immediate, triggering the sprout of compassion strongly; the future occupants are abstract and invisible, failing to trigger the sprout sufficiently to override the immediate feeling. Without a visceral emotional hook, the capacity for "extension" stalls, and the moral requirement is missed. The Xunzian account predicts Jordan will likely succeed in waiting. Since Xunzi locates moral reliability in *wei* (conscious effort/artifice) and adherence to ritual forms (*li*) established by sages, Jordan's deliberation relies on the authority of the protocol itself. The safety code functions as a ritual structure that dictates action independent of fluctuating emotions. Jordan acts well not because they feel like it, but because their cultivated disposition finds satisfaction in aligning with the objective standard of the profession, overriding the misleading impulse to be "kind" to the crew in the moment.

  (2) **Key Feature:**
  The single feature doing the work is the **emotional distance of the beneficiary**. The case turns on the fact that the moral claim is held by people who are absent in time and space, rendering them incapable of triggering an immediate affective response, while the competing claim (the crew's comfort) is emotionally salient.

  (3) **Effect of Removing the Feature:**
  If the future occupants were present and visible (e.g., a family standing nearby watching the pour), the Mencian prediction flips: Alex's compassion would be triggered by their visible vulnerability, leading to success. If the safety protocol were ambiguous or absent, the Xunzian prediction weakens: Jordan would lack the external ritual frame to guide action, potentially falling back on raw nature (which Xunzi views as self-interested), leading to failure.

  (4) **Strongest Mencian Objection:**
  A Mencian could object that the capacity to recognize and follow the safety protocol is itself an expression of the "sprout of right and wrong" (*zhi shi*), which is innate. They would argue Alex's failure is not due to a flaw in human nature, but due to incomplete cultivation; a truly cultivated person would extend their care to the unseen just as readily as to the seen. Pressing this objection costs the Mencian position significantly: it risks making the theory unfalsifiable. If every failure to act morally is attributed to "insufficient cultivation" rather than a structural limitation of affective motivation, the claim that human nature is inherently good becomes immune to empirical counterexamples.

  (5) **Honest Assessment:**
  This case exhibits a genuine **structural difference**, not merely a difference of emphasis. It isolates the source of moral authority: internal affective resonance (Mencius) versus external normative forms internalized through practice (Xunzi). A Xunzian could accept the whole scenario without conceding anything about human nature; in fact, they would embrace it as proof that without the artificial structure of ritual and training (which Jordan has and Alex lacks in this specific respect), reliable morality collapses when emotions are misleading. The Xunzian would argue this confirms that goodness is constructed, not discovered.
