answer: |-
  1. **The examination question**

  Consider the following case. Ayesha presses a button. Let M be the type of mental event that is her deciding to press it, and let B be the button-press. Her decision-token on this occasion is realised by a neural event-token R1.

  S1. R1 is, in the circumstances, sufficient for B.
  S2. M is multiply realisable: R2 is a distinct neural event-type, disjoint from R1, which also suffices for B in these circumstances and also realises M. It is possible to intervene so as to substitute an R2-token for the R1-token while leaving M unchanged. Call this the swap intervention.
  S3. It is not possible to intervene so as to remove the R1-token while leaving M unchanged. Every intervention that switches off R1 in these circumstances is also an intervention that switches off M, and B fails to occur.
  S4. R1-tokens also occur, on other occasions, as part of an automatic motor sequence in which R1 occurs, B occurs, and M does not.

  Using an interventionist or difference-making account of causation, determine whether R1 or M is the difference-maker for B based on the interventions described in S2 and S3. Explain whether this result defeats the exclusion principle or merely deprives it of an applicable test case. Finally, confront S4: state whether restricting the causal model to cases where M is present is a legitimate move about background conditions or a question-begging one about variable selection. You must reach a definite verdict on whether M causes B; hedging is not acceptable.

  2. **The model answer**

  An interventionist account defines causation in terms of difference-making. A variable C causes E if an intervention on C changes E, holding other relevant variables fixed. Applying this to the stipulated case requires analysing the available interventions on M and R1 relative to B. The core task is to determine which variable captures the dependency relations that constitute causation in this specific scenario.

  S2 describes a swap intervention where R1 is replaced by R2, M remains unchanged, and B occurs. This shows that R1 is not necessary for B given M. The specific neural realiser can vary without affecting the outcome, provided the mental state remains constant. This suggests M screens off R1 from B in this context, as varying the physical realiser while holding the mental fixed does not vary the effect. However, S3 states that one cannot remove R1 while leaving M unchanged. Any intervention removing R1 also removes M and B. This indicates a tight dependency between M and R1 in this token instance. For an interventionist, the crucial test is whether an intervention on M changes B. S3 implies we cannot intervene on M without changing R1 locally. Yet, combined with S2, it suggests that if we could intervene on M, perhaps by preventing the decision entirely, B would not occur. Thus, M qualifies as a difference-maker because the presence of M correlates with the presence of B across the possible realisers described in S2, whereas R1 is shown to be replaceable. The stability of B under changes to R1 (given M) highlights M as the robust cause.

  This result challenges the exclusion principle. The principle states that if a physical cause is sufficient, no distinct mental cause exists. Here, R1 is sufficient according to S1, yet M appears to be the difference-maker. An interventionist might argue this defeats exclusion by showing mental properties carry causal information physical properties do not, specifically regarding the stability of the outcome across realisers. Alternatively, it deprives exclusion of an applicable test case because the interventions required to show R1 screening off M, specifically removing R1 while keeping M, are impossible per S3. If the test for exclusion cannot be run, the principle cannot generate the epiphenomenalist conclusion. The stronger reading is that exclusion is defeated because the causal relation is defined by difference-making, which M satisfies better than R1 in this context. Kim would argue R1 is the cause, but Woodward would suggest M is the cause relative to the model.

  The most significant challenge arises from S4. Here, R1 produces B without M. This suggests R1 is sufficient for B independently of M. If we include these cases in our causal model, M appears redundant. When R1 occurs without M, B still happens. This threatens the claim that M is a difference-maker. To save mental causation, one must restrict the model to voluntary cases where M is present. The question is whether this restriction is legitimate.

  A legitimate move treats the presence of M as a background condition defining the context of the causal claim. Causal claims are often context-sensitive. We ask whether the decision caused the press in voluntary actions, not in reflexes. Restricting the model acknowledges that different causal structures operate in voluntary versus automatic modes. However, this risks being question-begging if the restriction is motivated solely to save mental causation without independent justification. If the variable selection excludes R1-only cases simply to force M into the model, it begs the question against the exclusionist.

  The hinge on which the strategy succeeds is whether causal models are permitted to be context-sensitive. If causation is relative to a model defined by specific background conditions, then restricting to M-present cases is valid. If causation requires a model encompassing all physically possible scenarios, the restriction is illegitimate.

  I verdict that M causes B. The restriction is legitimate. Causal explanation aims to identify difference-makers within relevant contexts. The context of voluntary action is distinct from automatic motor sequences. Excluding S4 cases is not ignoring data but defining the scope of the explanation. Therefore, M is the cause of B in the relevant context, defeating the exclusion argument by showing that mental properties identify the stable difference-makers that physical properties, when considered across multiple realisations, fail to capture uniquely. The exclusion principle fails because it assumes a single level of causation, whereas interventionism reveals that M captures the causal structure more accurately in the voluntary context.

  3. **Marking scheme**

  Total marks available: 25.

  1. Recitation of Exclusion Argument (max 5 marks). Accurate statement of closure, exclusion, overdetermination, and epiphenomenalism earns full points here. However, an answer relying solely on this is capped at 12 marks (lower second). This ensures students cannot pass by memory alone.
  2. Interventionist Analysis of S2 and S3 (10 marks). Full marks require identifying M as the difference-maker due to stability across realisers (S2) and acknowledging the dependency in S3. Partial credit for identifying R1 as sufficient but missing the difference-making nuance. Students must show how S2 allows M to vary independently of specific neural tokens in the model.
  3. Implications for Exclusion Principle (5 marks). Must distinguish between defeating the principle versus rendering it inapplicable. Strong answers argue defeat via difference-making criteria. Weak answers conflate sufficiency with causation.
  4. Handling S4 and Model Restriction (5 marks). Critical distinction. A first-class answer must take a definite stance on whether restriction is legitimate or question-begging. A 2:1 answer may hedge or describe both sides without verdict.

  First-class criteria: Reaches a definite verdict; identifies the hinge (variable selection or context); explicitly disposes of S4 rather than noting it; integrates S2 and S3 logic seamlessly.
  2:1 criteria: Correctly analyses interventions but hedges on the verdict or the legitimacy of model restriction; may treat S4 as a minor objection rather than a structural challenge.
  Lower second: Recites Kim accurately but fails to apply interventionism to the specific stipulations; treats S2 to S4 as illustrative rather than constitutive of the argument.
  Fail: Misunderstands the case; claims R1 cannot be a cause; ignores the interventionist framework.

  4. **Answers that impress but fail**

  1. The Sophisticated Hedger. This answer provides a flawless interventionist analysis of S2 and S3 and correctly identifies the tension in S4. However, it concludes that both readings of model restriction are equally plausible and refuses to verdict. Error: Violates the directive for a definite verdict. It shows understanding but lacks philosophical commitment. Max mark: 18 (High 2:1).
  2. The External Theorist. The student solves the S4 problem by importing a theory of causation not covered in the module, such as process theories or transference. The analysis is coherent but violates the constraint to use module material. Error: Irrelevant material. It bypasses the intended test of interventionist logic. Max mark: 15 (Lower 2:1).
  3. The Exclusion Purist. This answer argues S3 proves epiphenomenalism definitively because M cannot be intervened upon independently of R1. It treats S2 as irrelevant to causation. Error: Misunderstands interventionist sufficiency versus necessity. It ignores the multiple realisation aspect. Max mark: 16 (Upper 2:1).
  4. The Context Ignorer. The student argues M causes B but treats S4 as irrelevant noise rather than a challenge to variable selection. They fail to address whether the restriction is question-begging. Error: Fails the third task requirement. It misses the core dialectical point. Max mark: 17 (High 2:1).

  5. **Setting rationale**

  This question discriminates between students who can reconstruct arguments and those who can manipulate causal models under pressure. A conventional essay allows recitation of Kim; this case forces application of interventionist logic to specific constraints. The most contentious stipulation is S3, which asserts the impossibility of intervening on M without changing R1 locally. A sharp student could challenge this as denying the possibility of multiple realisation at the token level. I regard this as a feature. It tests whether students accept stipulations as given for the sake of argument or recognise them as philosophical claims themselves. Accepting S3 tests compliance; challenging it tests critical depth. Both are valid paths if argued well, but the question demands a verdict based on the stipulations provided. This ensures the marker assesses reasoning within the framework rather than general knowledge.
