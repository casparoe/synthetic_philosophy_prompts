answer: |-
  Your brain is not inconsistent; it is **hybrid**. You are not operating on a single theory of secession (like "Primary Right" or "Remedial Right"). You are operating on a **Tiered Legitimacy Model**.

  You intuitively rank claims to independence based on a hierarchy: **Consent > Injustice > Will.**

  1.  **Tier 1 (Consent):** If the central government agrees to the process, the result is legitimate (Scotland, South Sudan, Bougainville, Falklands).
  2.  **Tier 2 (Injustice):** If the central government refuses, legitimacy is only granted if there is severe physical oppression or state collapse (Kosovo).
  3.  **Tier 3 (Will):** Democratic will alone, without consent or severe oppression, is insufficient (Catalonia, Iraqi Kurdistan, Quebec "automatic" exit).

  Here is your principle spelled out, the contradictions you need to resolve, and the stress tests.

  ### The Principle: The Tiered Legitimacy Doctrine

  **Clause 1: The Constitutional Pathway (Consent)**
  If the central government legally authorizes a referendum, the result is binding, provided the question is clear and turnout is high.
  *   *Cases doing the work:* **Scotland 2014** (Legit), **South Sudan** (Legit), **Falklands** (Legit).
  *   *Implication:* This validates the "Primary Right" theory *only* when granted by the state.

  **Clause 2: The Remedial Pathway (Injustice)**
  If the central government refuses a referendum, a region may unilaterally secede *only* if it has suffered severe, sustained physical oppression (ethnic cleansing, war crimes) or if the central state has effectively collapsed and abandoned administration of the territory.
  *   *Cases doing the work:* **Kosovo** (Legit due to cleansing/UN admin), **South Sudan** (Legit due to civil war).
  *   *Cases excluded:* **Catalonia** (Not legit; grievance is political/economic, not physical survival), **Iraqi Kurdistan** (Not legit; grievance is political, no active cleansing in 2017).

  **Clause 3: The Clarity Threshold (Process)**
  A vote to leave is not a switch; it is a mandate to negotiate. A razor-thin margin does not grant an automatic right to exit; it grants a right to demand a clearer mandate or a negotiated settlement.
  *   *Cases doing the work:* **Quebec 1995** (Win would have required negotiation, not automatic exit), **Scotland Post-Brexit** (Material change in circumstances allows a new vote, but doesn't guarantee exit).

  **Clause 4: The Demographic Unit (Residents)**
  The "people" entitled to vote are the current civilian residents of the territory, regardless of ancestry or when they arrived, provided they are not an active military occupation force.
  *   *Cases doing the work:* **Falklands** (Settlers decide), **Kosovo** (Albanian majority decided despite Serbian historical claims).

  ---

  ### The Inconsistencies: Verdicts You Must Sacrifice

  To make this system coherent, you have to adjust three specific judgments:

  **1. Iraqi Kurdistan (2017)**
  *   *Your Verdict:* "Right to hold it AND... a bad mistake."
  *   *The Fix:* You must concede they had **no right to hold a binding referendum**. Under Clause 2, there was no severe oppression in 2017 comparable to the 1990s. Under Clause 1, Baghdad did not consent.
  *   *Correction:* They had a right to *protest*, but holding a referendum created a false expectation of legitimacy. It was not just a "mistake"; it was procedurally illegitimate.

  **2. Bougainville (2019)**
  *   *Your Verdict:* "Earned it, but... genuinely can't tell you whether that vote obliges PNG."
  *   *The Fix:* Under Clause 1, PNG *agreed* to the vote. Even if "non-binding," an agreed referendum creates a **moral and political obligation to negotiate in good faith toward the result**.
  *   *Correction:* You cannot say it "earned it" but also that PNG has no obligation. The obligation is to implement the will of the vote unless a negotiated alternative is reached.

  **3. The Falklands Contradiction**
  *   *Your Verdict:* Settlers decide here.
  *   *The Risk:* You worry this contradicts your skepticism of settlers elsewhere.
  *   *The Fix:* Rely on Clause 4's "Military Occupation" exception. Falkland Islanders are civilians integrated into a local economy. If your principle were applied to, say, Israeli settlements in the West Bank, they would fail Clause 4 because they are maintained by military force and legal segregation.
  *   *Correction:* Explicitly state that "Current Residents" excludes populations moved into a territory specifically to alter demographics under military protection.

  ---

  ### Kosovo vs. Catalonia: Is it just Power?

  **No.** It is not just that powerful countries liked Kosovo. The principled difference is **Effective State Failure.**

  *   **Catalonia:** Spain maintained full police, judicial, and administrative control. The grievance was about tax distribution and cultural recognition within a functioning democracy. This fails Clause 2.
  *   **Kosovo:** Serbia had **zero** effective control. The territory was under UN administration (UNMIK) for nine years prior to declaration. The Serbian state had engaged in ethnic cleansing and was driven out by NATO.
  *   **The Principle:** You are applying a **"Last Resort"** doctrine. Kosovo was already functionally independent; the declaration was just legalizing reality. Catalonia was trying to *create* independence against a functioning state apparatus.

  **Verdict:** Your distinction holds, provided you emphasize the **UN Administration/State Collapse** factor, not just "oppression."

  ---

  ### Stress Testing: New Cases

  **1. The Rich Region (e.g., Northern Italy/Catalonia economic argument)**
  *   *Scenario:* A wealthy region wants to leave to stop subsidizing poorer regions. No oppression, just policy disagreement.
  *   *Application:* Fails Clause 2 (No injustice). Fails Clause 1 (If central gov says no).
  *   *Verdict:* **Illegitimate.** Economic self-interest is not a ground for secession in your model.

  **2. The Internal District (Secession from Secession)**
  *   *Scenario:* A region votes to leave. A district inside that region votes to stay with the old country.
  *   *Application:* This clashes with **Contiguity**. Your model prioritizes the existing administrative border (Clause 1/3).
  *   *Verdict:* **They cannot secede from the secession.** The Region is the voting unit. Allowing districts to fragment the seceding state creates infinite regress. (Unless the district is geographically separated/enclaved, then it's negotiable).

  **3. The Oppressed Minority (30% of residents)**
  *   *Scenario:* A group is being oppressed, but they are only 30% of the region's population. The other 70% want to stay.
  *   *Application:* Clause 2 grants a Remedial Right, but Clause 4 (Demographic Unit) makes borders tricky.
  *   *Verdict:* **Legitimate claim, illegitimate borders.** They have a right to protection or autonomy, potentially independence, but only over areas where *they* are the majority. They cannot take the whole region if they are a minority of the residents.

  **4. The New Settler Territory (20 years)**
  *   *Scenario:* A territory where almost everyone arrived in the last 20 years (e.g., a resource boom town or planned colony).
  *   *Application:* Clause 4 (Current Residents).
  *   *Verdict:* **Legitimate.** Time does not matter; civilian residence does. If they live there, vote there, and aren't a military occupation, they decide. (Consistent with Falklands).

  ---

  ### The Threshold Clause

  You are uncomfortable with simple majorities on existential questions (Quebec worry). Here is the threshold your intuition demands:

  1.  **The Vote:** Simple Majority (>50%) is sufficient **IF** turnout is >60% **AND** the central government agreed to the process (Clause 1).
  2.  **The Margin:** If the margin is <5% (Quebec), the result is not an exit ticket; it is a **mandate to negotiate**. Exit requires a second vote or a ratified treaty.
  3.  **The Ratification:** The **Whole Country** does not get a veto vote on the *decision*, but the **Central Parliament** must ratify the *treaty*. (You cannot let the remainder of the country vote to *keep* the region, but they get to vote on the terms of the divorce).
  4.  **Re-voting:** A "No" vote is binding for a generation (10-20 years) **UNLESS** there is a "Material Change in Circumstances" (e.g., Brexit for Scotland).

  ---

  ### The Collapse Question

  You asked for the single question that, if answered differently, would collapse your verdicts into one rule.

  **The Question:** *"Is the democratic will of a regional majority sufficient to create a right to secede without the central government's consent?"*

  *   **Your Current Answer:** **No.** (You require Consent OR Oppression). This maintains your Hybrid/Tiered system.
  *   **If you answer YES:**
      *   **Catalonia** becomes Legitimate.
      *   **Iraqi Kurdistan** becomes Legitimate.
      *   **Quebec 1995** (if Yes) becomes Automatic Exit.
      *   **Collapse:** Your system collapses into **Primary Right Theory**. Kosovo and Scotland remain legit, but the distinction between them and Catalonia vanishes.
  *   **If you answer NO (Strictly):**
      *   **Kosovo** becomes Illegitimate (Serbia didn't consent).
      *   **South Sudan** becomes Illegitimate (if viewed as unilateral).
      *   **Scotland** becomes Illegitimate (if London had said no).
      *   **Collapse:** Your system collapses into **Constitutional Absolutism**. Only agreed divorces are allowed; justice doesn't matter.

  **Recommendation:** Keep your current answer (**No**). It is the only way to keep Kosovo legitimate while keeping Catalonia illegitimate. It forces you to admit that **democracy is not the only value**; stability and human rights protection matter too. Your brain is consistent, provided you accept that **injustice trumps procedure, but procedure trumps preference.**
