      *   *The "Double Counting" Argument:* If individuals are risk-neutral in VNM terms, their risk attitudes are already captured. If society is risk-averse over distribution, it violates Pareto. Harsanyi says society should share individual risk attitudes. Prioritarians say society cares about ex post inequality.
