      *   *Harsanyi's Aggregation Theorem:* If individual preferences and social preferences satisfy VNM axioms over lotteries, and Social Preference satisfies Pareto Indifference (or Strong Pareto), then Social Utility is a linear combination of Individual Utilities ($W = \sum a_i U_i + b$).
      *   *Harsanyi's Impartial Observer Argument:* If the observer has equal probability of being anyone, weights $a_i$ are equal. Result: Average Utilitarianism.
      *   *The Conflict:* Prioritarianism (sum of concave transforms) violates Ex Ante Pareto if individuals are risk-neutral in the "currency" but the social planner is risk-averse regarding distribution.
      *   *The Example:*
          *   Person 1 & 2.
          *   Policy A: (10, 10) certain.
          *   Policy B: 50% (30, 0), 50% (0, 30).
          *   Individual Utility (VNM): $u(x) = x$ (risk neutral).
          *   Exp Utility A: 10 each.
          *   Exp Utility B: 15 each.
          *   Pareto says B > A (15 > 10).
          *   Prioritarian Social Welfare: $W = \sum \sqrt{u_i}$.
          *   State 1 (30, 0): $\sqrt{30} + 0 \approx 5.47$.
          *   State 2 (0, 30): $0 + \sqrt{30} \approx 5.47$.
