      *   *Check:* Did I handle the risk neutrality correctly? In the prompt: "Both people are risk-neutral in the very metric being aggregated." So $U(x) = x$.
      *   *Check:* Prioritarian calculation. $\sqrt{10} + \sqrt{10} \approx 6.32$. Exp Utility of Prioritarian: $0.5(\sqrt{30} + \sqrt{0}) + 0.5(\sqrt{0} + \sqrt{30}) = \sqrt{30} \approx 5.47$. So Prioritarianism prefers A (6.32 > 5.47). Pareto prefers B (15 > 10).
      *   *Check:* The "Double Counting" reply. Alex argues if individuals are risk neutral, society shouldn't be risk averse over distribution *if* respecting Pareto. Jordan argues society *should* be risk averse over distribution even if individuals aren't.
      *   *Check:* Domain issue. Harsanyi assumes $W$ is a function of $U_i$. Prioritarianism (ex post) is a function of outcomes, then averaged. It violates the assumption that Social Preference over lotteries depends *only* on Individual Preferences over lotteries.
