answer: |-
  This is a sophisticated position, but it carries significant structural vulnerabilities. You are asking for a stress test, so I will not soften the blows. Below is the breakdown of what counts against the Reception Asymmetry, ranked by severity, followed by the empirical, predictive, and internal analyses you requested.

  ### I. Defeaters: Fatal vs. Awkward

  **1. Fatal: The Counter-Example of Explicit Mobilization**
  *   **The Argument:** Your thesis claims explicitly didactic art is "comparatively weak" because it invites discounting. History provides documented cases where avowedly propagandistic work was devastatingly effective. *The Birth of a Nation* (1915) made no secret of its racial thesis; it revived the KKK. Soviet Socialist Realism was explicitly didactic; it successfully engineered consent and fear. *Uncle Tom's Cabin* was read as a moral tract, not a subtle novel; it hardened abolitionist resolve.
  *   **Why it is Fatal:** If explicit propaganda can successfully mobilize a base, radicalize a movement, or cement hatred, the claim that it is *inherently* weaker due to reception posture collapses. It may be weaker at *converting opponents*, but propaganda is often designed for *solidifying allies*. If your theory cannot distinguish between conversion and mobilization, it fails to describe the actual political utility of the art.
  *   **Ranking:** Fatal. It contradicts the core causal mechanism (declaration → resistance → failure).

  **2. Fatal: The Tautology Trap (Unfalsifiability)**
  *   **The Argument:** You posit that effective political work is done by art that "denies doing it." If a critic points to a didactic work that *succeeded*, your framework allows you to reply: "It only succeeded because it had covert formal qualities that disarmed the audience." If a "universal" work fails to move anyone, you can say: "It was truly autonomous, therefore politically inert."
  *   **Why it is Fatal:** A theory that explains success by covert properties and failure by overt properties explains everything and predicts nothing. It renders the variable "declaration of intent" irrelevant because the *real* explanatory work is being done by a hidden variable ("covert formal work") that is only identified post-hoc by the outcome.
  *   **Ranking:** Fatal. It removes the position from the realm of critical argument into the realm of belief.

  **3. Awkward: The Du Bois Fidelity Problem**
  *   **The Argument:** Du Bois's "Criteria" is not just a description of how art works; it is a *call to arms*. He urges Black artists to *consciously* wield propaganda to tell the truth of their experience. He complains that white art is allowed to be propaganda while Black art is policed. Your asymmetry suggests Black artists *should* hide their partisanship to be effective.
  *   **Why it is Awkward:** This risks turning Du Bois's strategic demand for visibility into a counsel of invisibility. If the most effective propaganda is that which denies its stakes, you are arguably validating the very "purist" pressure Du Bois was fighting. He wanted the propaganda to be *recognized* as truth, not smuggled in as beauty.
  *   **Ranking:** Awkward. It doesn't disprove your mechanics, but it severs your alliance with the authority you are citing.

  **4. Awkward: The Competent Audience**
  *   **The Argument:** Your model assumes audiences are naive to "universal" claims. However, marginalized audiences and critical scholars (like those in your room) are often hyper-attuned to the ideology in "autonomous" art. They read the "universal" as "particular white experience."
  *   **Why it is Awkward:** The asymmetry may hold for dominant-culture audiences consuming dominant-culture art, but it reverses for marginalized audiences consuming dominant art. They scrutinize the "beautiful" precisely because they know it isn't for them.
  *   **Ranking:** Awkward. It limits the scope of your claim to specific audience/text pairings.

  ### II. Empirical Literature: Absorption and Resistance

  You asked where the literature cuts. It is mixed, which is dangerous for a strong asymmetry claim.

  *   **Support for You (Psychological Reactance & Transportation):** Research on "psychological reactance" confirms that when people perceive an attempt to restrict their freedom or manipulate their attitude, they resist. Overt persuasion triggers this. Conversely, "narrative transportation" theory suggests that when audiences are absorbed in a story, their real-world beliefs are less accessible, and they are less likely to counter-argue. This supports your claim that formal beauty/autonomy disarms scrutiny.
  *   **Against You (Priming & Agenda Setting):** Communication studies on "agenda setting" and "priming" suggest that *explicit* framing is highly effective at telling people *what* to think about, even if it doesn't change *how* they feel. A didactic documentary may not convert a racist, but it can successfully signal to a neutral audience that "this is an important issue." Furthermore, "inoculation theory" suggests that exposed, argued positions can build resistance to counter-arguments better than subtle hints.
  *   **The Verdict:** The literature supports the idea that covert art is better at *attitude change* (affective), but explicit art is often better at *salience* (cognitive). If "propaganda" includes making an issue visible, your asymmetry is empirically weak.

  **Confidence:** High on the existence of this split in the literature; Moderate on which effect dominates in an artistic context (likely context-dependent).

  ### III. Predictive Power: Censorship and Retrospection

  **1. Censorship Patterns**
  *   **Prediction:** If your view holds, censors should frequently miss the "autonomous" work and target the "didactic" work.
  *   **Record:** Mixed. Authoritarian regimes are notoriously paranoid about allegory. Soviet censors banned Shostakovich not for explicit lyrics but for "formalism" that felt ideologically unsafe. The Hays Code in Hollywood targeted *implicit* morality (sex, crime) as much as explicit politics. However, in liberal democracies, overt protest art is often ignored (censored by neglect) while "universal" art that subtly reinforces hierarchy is funded.
  *   **Assessment:** This undercuts your claim slightly. If the "covert" propaganda were truly invisible, it would never be caught. The fact that states often hunt down "hidden" meanings suggests the asymmetry is not a reliable shield.

  **2. Retrospective Politicization**
  *   **Prediction:** Works that disclaimed politics should be the ones later read as political.
  *   **Record:** Strong support. Modernist works claiming "pure form" (e.g., Abstract Expressionism) are now routinely analyzed as Cold War propaganda. Classic literature claiming "human universals" is now read through post-colonial or feminist lenses.
  *   **Assessment:** This is the strongest empirical support for your position. The "universal" is the most durable vehicle for the "particular."

  ### IV. Internal Problems: Du Bois and Unfalsifiability

  **1. Is it Du Boisian?**
  *   **The Tension:** Du Bois defined propaganda as "the effort to influence the attitudes of a group toward a particular object." He did not define it by its *success rate* or its *stealth*. He defined it by its *purpose*. By shifting the definition to *reception effectiveness*, you have moved from Du Bois's **moral/aesthetic** claim to a **sociological/functional** claim.
  *   **The Risk:** Du Bois argued for *Truth* alongside Propaganda. He feared propaganda that lied. Covert propaganda (the "beautiful" work that smuggles ideology) is often the one most liable to lie, because it is not subject to the fact-checking that explicit claims invite. If your asymmetry privileges the covert, you might be privileging the *untruthful*. This contradicts Du Bois's insistence on "Truth" as a criterion.

  **2. The Unfalsifiability Worry**
  *   **Diagnosis:** You are correct to be worried. As currently framed, the theory is immune to evidence.
  *   **Is it Fatal?** For a claim about "how art functions politically," yes. If it cannot be wrong, it is not a tool for curators or scholars; it is a worldview. A curatorial symposium needs actionable criteria. If every outcome confirms the theory, it offers no guidance on what to program.
  *   **The Fix:** You must sharpen it into a **comparative probability claim**.
      *   *Sharpened Version:* "Within a specific cultural circuit, explicitly didactic works face a higher threshold of audience resistance regarding *attitude change* than implicitly ideological works, but implicitly ideological works face a higher threshold of *recognition* regarding *issue salience*."
      *   *Refutation Condition:* Find a controlled context (same audience, same topic) where an explicit work outperforms an implicit work in long-term attitude change *without* relying on pre-existing alignment. If *13th* (explicit) shifts white liberal attitudes more than *Moonlight* (implicit), the asymmetry regarding attitude change is challenged.

  ### V. Audience Calibration: Scholars vs. Curators

  **What the Du Bois Scholars Will Press (The Dangerous Crowd)**
  *   **The Definition of Propaganda:** They will argue you are using a pejorative, Cold War definition of propaganda (manipulation) rather than Du Bois's definition (advocacy for truth). Du Bois wanted the propaganda to be *seen*. He wanted the world to know Black artists were fighting. Your theory suggests they should hide the fight.
  *   **The Ethics of Stealth:** They will ask if it is ethical to persuade people via "beauty" who would resist the "truth." Is covert propaganda democratic?
  *   **The Historical Record:** They will cite *The Crisis* itself. The images and essays were explicit. They worked. They built the NAACP.

  **What the Art-for-Art's-Sake Partisans Will Press (The Less Dangerous Crowd)**
  *   **Aesthetic Value:** They will argue that if art is *only* propaganda (even covert), it loses its value. This is a normative objection, not a functional one. You can dismiss this as "purist" (using Du Bois's term).
  *   **Intentionality:** They will argue that if the artist didn't intend it, it's not propaganda, it's just "culture." This is easily countered by your reception-based definition.

  **Where Your Framing is Muddled**
  *   **Propaganda vs. Hegemony:** You are conflating "propaganda" (active persuasion) with "hegemony" (passive reinforcement of the status quo). The "autonomous" work usually reinforces the status quo (hegemony). The "didactic" work usually challenges it (propaganda).
      *   *The Muddle:* You claim the autonomous work is "more effective propaganda." But if it reinforces the status quo, is it propaganda *for the artist* or propaganda *for the state*? Du Bois was interested in *counter*-propaganda. If your theory proves that the best way to fight power is to mimic power's stealth, you are making a strategic point. If your theory proves that *all* art is propaganda, you are making an ontological point. You are oscillating between the two.
  *   **Effectiveness vs. Function:** You say a work that does "no ideological work" is "really autonomous." But in critical theory, *nothing* is ideologically neutral. If a work does nothing, it supports the status quo by default. Therefore, *all* art does ideological work. Your distinction between "effective propaganda" and "autonomous art" collapses. Everything is propaganda; some is just better at hiding it.

  ### VI. Confidence and Final Assessment

  **Confidence Levels:**
  *   **High Confidence:** The "Tautology Trap" is a genuine logical flaw in the current phrasing. The distinction between "mobilization" and "conversion" is the empirical weak point.
  *   **Moderate Confidence:** The Du Bois scholars' reaction. I am confident they will spot the tension regarding "Truth," but less certain how hard they will press the "stealth" ethics.
  *   **Low Confidence:** The specific empirical weighting of "reactance" vs. "priming" in documentary audiences. This varies wildly by demographic.

  **Least Sure Point:**
  I am least sure about the **Censorship Prediction**. While I argue the record is mixed, there is a strong argument that neoliberal censorship operates *exactly* as you predict (ignoring the loud protest, funding the "universal" story). If your audience is primarily in liberal democracies, this prediction might hold up better than I've credited.

  **Plain Talk on Muddled Framing:**
  You are trying to have it both ways. You want the descriptive power of "all art is propaganda" (Du Bois) but the critical leverage of "some art is better at it" (Reception Asymmetry).
  *   If *all* art is propaganda, then "autonomous" art is just propaganda for the status quo.
  *   If "autonomous" art is propaganda for the status quo, then it *is* doing political work.
  *   Therefore, your claim that "explicitly didactic art is comparatively weak" is only true if you define "political work" as "challenging the status quo."
  *   **The Fix:** Admit that. "Reception Asymmetry applies specifically to *counter-hegemonic* art." Dominant culture can afford to be explicit (it doesn't need to hide); marginalized culture must often be covert to penetrate the dominant gaze. This saves the theory, makes it falsifiable, and aligns it better with Du Bois's specific concern about the policing of Black art.

  **Final Recommendation:**
  Before you step on stage, concede the Tautology risk explicitly. Frame the Asymmetry not as a law of nature, but as a **heuristic for curators**: "When we program explicit protest, we must account for the resistance tax. When we program 'universal' work, we must account for the invisibility tax." This makes you a pragmatist, not a dogmatist, and disarms the scholars who might otherwise attack your theoretical rigidity.
