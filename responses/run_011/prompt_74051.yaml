answer: |-
  The basement smelled of ozone and old dust, the kind of air that stays still for decades until you open the door and stir it up. Above us, the floorboards creaked as the town gathered for the reading, but down here it was just me, Julian, and Clara. And the clock.

  It was a monstrous thing, brass gears exposed behind a glass face, wired to a simple incandescent bulb hanging from a chain in the center of the room. No shade. Just the filament, cold and grey.

  "Eleven fifty-eight," Julian said. He was checking his watch against the wall clock, though everyone knew the brass machine was the master. He wanted the estate. He needed it. The shipping company he'd started was bleeding cash, and our father's money was the only tourniquet left.

  Clara stood by the workbench, arms crossed. She didn't need the money, not really. She wanted the principle. She wanted to prove the old man wasn't senile when he wrote the codicil. "The mechanism is primed," she said. "Once the minute hand hits twelve, the circuit closes. Then it begins."

  "The circuit closes," I repeated, checking my clipboard. I was the executor. My job was to interpret the words, not the physics. "The will states: 'If the lamp is on at noon.' It doesn't say 'glowing.' It says 'on'."

  "Semantics, Arthur," Julian snapped. "If it emits light, it's on."

  "If the switch is open, it's off," Clara countered. "Even if the filament is hot."

  We all knew the schedule. It was written in the engineer's logbook sitting on the bench. At 12:00:00, the supertask begins. Or rather, it ends. The mechanism was designed to run the infinite sequence backwards into the past, but for us, watching it forward, it was a countdown. Thirty seconds on. Fifteen seconds off. Seven and a half seconds on. Three point seven five off. The intervals halved each time. The sum of the infinite series was exactly one minute. At 12:01:00, the minute would be over. But the will specified noon. The limit point.

  "Ready?" Julian asked. His hand hovered over the starter lever.

  "Wait," I said. I picked up the logbook. There were two entries for today's date. "There are two protocols here. Protocol A: Initial state On. Protocol B: Initial state Off."

  Julian squinted. "Does it matter? It flips infinitely many times. It spends equal time on and off."

  "Benacerraf buried that decades ago," Clara said, her voice tight. "Nothing about what happens before the final instant forces an answer at it. There's no contradiction, only a gap. The gap is the point."

  "The gap is where the money is," Julian muttered. He looked at me. "Pick one, Arthur. You're the executor."

  I looked at the bulb. It was dead glass. "The will says 'a clock that halves its own interval.' It doesn't specify the phase. Both are equally legitimate readings of the text."

  "Then pick the one that lights the bulb," Julian said.

  "Pick the one that respects the logic," Clara said.

  I closed the book. "Flip the lever. Use Protocol A. Start On."

  Julian threw the switch. The clock whirred. The second hand began its sweep.

  11:59:00.

  The first click was loud, a mechanical snap that echoed off the concrete walls. The bulb flared bright, casting our shadows long and sharp against the shelving. We waited. The heat from the filament began to radiate, a gentle warmth on my face.

  11:59:30.

  The second click. Darkness. The filament didn't go black instantly. It faded, orange turning to red, red to dull grey. The thermal inertia was visible.

  11:59:45.

  Click. Light. The filament was still warm, so it brightened faster this time.

  11:59:52.5.

  Click. Dark.

  The intervals were shrinking. The sound changed from distinct snaps to a rhythmic clacking. *Click-clack. Click-clack.* The light began to strobe. It was impossible to track the state with the eye. You couldn't say if it was on or off at any specific moment anymore; it was a flicker, a vibration.

  "It's incoherent," Julian said, shouting over the noise. "At noon, there isn't any fact about whether the lamp is on or off. The supertask fails."

  "The description is incomplete," Clara shouted back. "That's all. There's no contradiction, just undefined variables."

  "The variable is the money!"

  11:59:58.

  The clacking became a hum. The relay was switching forty times a second, then eighty. The sound was rising in pitch, a mechanical whine now. The light wasn't flickering anymore. It was steadying.

  I watched the filament. It wasn't blazing white like a normal lamp. It was glowing a steady, dull cherry-red. The switching was happening faster than the filament could cool. The thermal mass was averaging the input. It was becoming a physical integrator.

  "It's not a characteristic function!" Clara yelled. She was pointing at the bulb. "A real lamp was never a binary state to begin with. Look at it!"

  "It's a limit that doesn't exist!" Julian argued. "Mathematically, the sequence 1, 0, 1, 0... has no limit. You can't say it's on."

  "Physically, it's glowing!"

  11:59:59.

  The whine was high now, a dentist's drill. The air in the basement felt heavy, charged. The light was stable, a constant, dim ember. It wasn't the bright white of "On," and it wasn't the black of "Off." It was a third thing. A ghost state.

  12:00:00.

  The clock chimed. A single, clear bell tone cut through the mechanical whine.

  The relay stopped.

  The silence rushed back in, sudden and absolute. My ears rang.

  The bulb remained lit. Not bright. Not dark. A steady, sullen orange glow.

  Julian stepped forward immediately. "It's emitting light. The condition is met. 'If the lamp was on.' It's on."

  "It's residual heat," Clara said. She moved to the workbench and grabbed a multimeter. "The switch is open. I can see the contacts. The circuit is broken."

  "The will says 'on'," Julian insisted. "In common parlance, a light that is glowing is on."

  "In common parlance, you flip a switch," she snapped. "You don't run a Zeno machine to cook the filament."

  I walked to the bulb. The heat was palpable. I held my hand beneath it. It was warm, but not hot enough to be at full power. It was sitting at some equilibrium temperature determined by the average voltage over the last minute.

  "It's ambiguous," I said.

  "It's not ambiguous," Julian said. "It's glowing. Pay me."

  "It's dependent," Clara corrected. She was flipping through the logbook again. "Arthur, look at Protocol B."

  I took the book. Protocol B: Initial state Off.

  "If we had started with the switch open," Clara said, tracing the line with her finger, "the first interval would be off. Then on. Then off. The sequence is inverted. 0, 1, 0, 1..."

  "So?" Julian asked.

  "So the thermal integration depends on the phase," she said. "If you start off, the filament spends the first thirty seconds cooling instead of heating. Then fifteen seconds heating. The average power input over the infinite series might be the same, but the thermal history isn't linear. The cooling curve isn't the same as the heating curve. The residual glow at noon comes out different."

  I looked at her. "Are you sure?"

  "The old man wrote it here," she said, tapping a page of handwritten notes. 'Phase sensitivity in the limit.' He knew. He knew the physical state at noon depends on an arbitrary choice of starting condition that the will doesn't specify."

  Julian laughed, a short, brittle sound. "That's absurd. It's a light bulb. It's either on or it's not."

  "It's a computer," Clara said softly. "That was the obsession. A machine which finishes an infinite search by noon could settle questions no ordinary machine can touch, if only you knew how to read the answer at the limit. The brightness *is* the answer. But the answer changes depending on how you ask the question."

  Julian looked at the bulb, then at me. "Arthur. The will says 'if the lamp was on.' It doesn't say 'if the lamp was on regardless of the initial phase.' It just says 'on'."

  "If the fact of the matter depends on a clause that isn't in the will," I said, "then the condition isn't met. The state is not determined by the text."

  "It's determined by the physics!" Julian slammed his hand on the workbench. "The physics says it's glowing."

  "The physics says it's glowing at 12% capacity," I said. "Is 12% on? Is 5% on? Where is the threshold?"

  "50%!" Julian shouted.

  "Arbitrary," Clara said.

  "Practical!"

  They were looking at me. The silence stretched out, filled only by the faint hum of the filament cooling, dimming slowly now that the switching had stopped. It was dying. In ten seconds it would be dark. In twenty, it would be cold.

  I had to decide. If I declared it "on," Julian got the estate. If I declared it "off," Clara got nothing, and the county got everything. If I declared the condition impossible to verify, the county got everything.

  The old man's face floated in my mind. He was a man who loved traps. He loved the gap between the word and the thing. He knew that "on" is a word we use for switches, not for filaments. He knew that reality doesn't care about our binary categories. He built a machine that forced us to choose a threshold, to draw a line in the sand of a continuum.

  If I signed the distribution to Julian, I was validating that "glowing" equals "on." If I signed it to the county, I was validating that "undefined" equals "off."

  But there was a third option. The logbook showed that the result was path-dependent. The will did not specify the path. Therefore, the outcome was not fixed by the testator's intent, because the testator left the critical variable open. The condition "if the lamp was on" presupposes a unique state at noon. There is no unique state. There are two possible states, depending on a choice I could have made five minutes ago.

  The bulb was fading. The orange was turning to red, the red to black.

  "Arthur," Julian warned. "Don't you dare."

  "You said it yourself," I said to Julian. "The supertask is incoherent. There's no fact of the matter."

  "I said that about the switch position," he hissed. "Not the light."

  "And you said," I turned to Clara, "that the gap is the point. That the description is incomplete."

  "The description is incomplete," she agreed. "But the physical reality is here. It was glowing."

  "For how long?" I asked. "For a second? Ten seconds? It's cooling now. When does it stop being 'on'?"

  I walked to the wall where the main breaker sat. A large black handle, labeled *BASEMENT POWER*.

  "What are you doing?" Clara asked.

  "Settling it," I said.

  "You can't kill the evidence," Julian said, stepping toward me.

  "The evidence is the problem," I said. "The will requires a state at noon. Noon has passed. The state is decaying. Every second I wait, the 'fact' changes. The brightness is a function of time. 'On' is not."

  I put my hand on the breaker.

  "If you kill the power, you can't measure the lumens," Clara said. "You'll never know what the limit was."

  "We know what the limit was," I said. "It was whatever we needed it to be to win the argument."

  "Arthur, don't," Julian said. His voice was desperate now. The money was slipping away, not because of the law, but because of the light.

  I thought about the old man. He wanted to know if a machine could settle questions no ordinary machine could touch. He built a lamp that asked a question instead of answering one. *Where do you draw the line?*

  I pulled the breaker.

  The hum died. The filament went black instantly, the residual heat trapped in the wire with no current to sustain the glow. The room plunged into darkness, save for the beam of my flashlight.

  "Condition not met," I said into the dark. "The lamp is off."

  "You killed it!" Julian screamed.

  "It's off now," I said. "And at noon, it was undefined. I'm ruling based on the text. The text requires a binary state. The machine provided a gradient. I cannot adjudicate a gradient."

  "You're throwing it to the county," Clara said. Her voice was calm, strangely relieved. "You're giving it to the state."

  "I'm giving it to the text," I said. I clicked my pen. The sound was loud in the quiet room. I signed the determination form on the clipboard. *Estate Escheated.*

  "You could have set a threshold," Clara said. "You could have said anything above 10 lumens is on."

  "I could have," I said. "But then I'd be the one writing the will. And he's dead."

  I handed the clipboard to Julian. He didn't take it. He was staring at the dark bulb, as if willing it to glow again, to prove that the light had been real, that the infinite sum had added up to something tangible.

  "Benacerraf was right," Clara whispered. "There was no contradiction. Just a gap."

  "And Thomson was right," I said, capping the pen. "It's incoherent."

  I walked to the door. "Come on. The town is waiting."

  I left them in the dark with the machine. It was finished. The infinite switching was done. The heat would dissipate. The filament would cool to ambient. The state would become definitively, permanently off. I had made it so. I had forced the limit to converge to zero by removing the variable of observation.

  Outside, the air was cool. I took a deep breath. I had lost the clients. I would lose the fees. But the argument was over. There was no more buzzing in my head. Just the quiet certainty of a switch that stays open.
