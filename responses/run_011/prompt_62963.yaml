answer: |-
  This is a high-risk, high-reward seminar design. It works only if you lean into the technical limitations rather than fighting them. If you try to run this like a psychophysics lab, the projector lag will ruin the illusion and the students will dismiss the philosophy as "armchair speculation." If you run it as a *phenomenological trap*, the technical noise becomes part of the data.

  Here is the execution plan.

  ### 1. The Stimulus (No Psychophysics Software)
  Do not use PowerPoint. The transition animations are not frame-accurate. Use a single HTML file you run in a browser (Chrome/Firefox) in fullscreen (F11). This bypasses most OS compositing lag.

  **Instructions:**
  1.  Copy the code block below into a text editor (Notepad/TextEdit).
  2.  Save it as `phi.html`.
  3.  Open it in your browser on the classroom machine.
  4.  **Crucial:** Test this on the actual projector *before* class. Projectors vary wildly in input lag. If the dots look like they are flickering rather than moving, adjust the `isi` (inter-stimulus interval) variable in the code.

  ```html
  <!DOCTYPE html>
  <html>
  <head>
  <style>
    body { background: black; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
    .dot { width: 40px; height: 40px; border-radius: 50%; position: absolute; }
    #fixation { color: white; font-family: monospace; font-size: 20px; position: absolute; }
  </style>
  </head>
  <body>
  <div id="fixation">+</div>
  <script>
    // CONFIGURATION - Tweak these if the illusion fails on your projector
    const dotSize = 40;
    const separation = 300; // pixels between centers
    const duration = 50;    // ms dot is on
    const isi = 60;         // ms blank between dots (Critical for motion)
    
    const dot1Color = 'red';
    const dot2Color = 'green'; // Or blue/cyan for better contrast on some projectors

    let phase = 0; // 0: fix, 1: dot1, 2: blank, 3: dot2, 4: blank
    let dotEl = document.createElement('div');
    dotEl.className = 'dot';
    document.body.appendChild(dotEl);

    function hideDot() { dotEl.style.opacity = 0; }
    function showDot(x, color) { 
      dotEl.style.left = (window.innerWidth/2 - dotSize/2 + x) + 'px'; 
      dotEl.style.top = (window.innerHeight/2 - dotSize/2) + 'px';
      dotEl.style.backgroundColor = color; 
      dotEl.style.opacity = 1; 
    }

    function loop() {
      const now = performance.now();
      // Simple state machine for timing
      // Note: setTimeout drifts. For a 90-min seminar, this is "good enough" 
      // provided the projector isn't ancient.
      
      if (phase === 0) { // Fixation (2 sec start)
         if (startTime === null) startTime = now;
         if (now - startTime > 2000) { phase = 1; startTime = now; }
      } else if (phase === 1) { // Dot 1
         if (startTime === null) startTime = now;
         if (now - startTime < duration) showDot(-separation/2, dot1Color);
         else { phase = 2; startTime = null; hideDot(); }
      } else if (phase === 2) { // ISI 1
         if (startTime === null) startTime = now;
         if (now - startTime < isi) { } // blank
         else { phase = 3; startTime = null; }
      } else if (phase === 3) { // Dot 2
         if (startTime === null) startTime = now;
         if (now - startTime < duration) showDot(separation/2, dot2Color);
         else { phase = 4; startTime = null; hideDot(); }
      } else if (phase === 4) { // ISI 2
         if (startTime === null) startTime = now;
         if (now - startTime < isi) { } // blank
         else { phase = 1; startTime = null; } // Loop back to Dot 1
      }
      requestAnimationFrame(loop);
    }
    let startTime = null;
    requestAnimationFrame(loop);
  </script>
  </body>
  </html>
  ```

  ### 2. Data Collection (Private & Immediate)
  Do not use show of hands for the critical data. It creates social pressure.
  *   **Tool:** Google Forms (or your LMS quiz tool).
  *   **Setup:** Create a form with 3 questions. Generate a QR code. Put the QR code on a slide *before* you start the demo so they can load it silently.
  *   **Settings:** Do not collect emails (anonymity encourages honesty about "failure" to see the illusion). Limit to 1 response per device.

  **The Form Questions:**
  1.  *Describe what you saw.* (Short answer)
  2.  *On a scale of 1-5, how vivid was the motion?* (Linear scale)
  3.  *Did you see a color change happen **during** the motion, or did the dot arrive already changed?* (Multiple choice)

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 05:00 | Setup & Silence**
  *   Project the QR code.
  *   **Script:** "Load this form. Do not submit yet. We are about to run a calibration trial. I need your raw phenomenology, not your philosophical training. No talking."

  **05:00 – 15:00 | The Experience (The Trap)**
  *   Run `phi.html` fullscreen for 60 seconds.
  *   **Script:** "Fixate on the cross. Ignore the colors. Just tell me what moves."
  *   Stop the animation.
  *   **Script:** "Submit the form now. Lock your phones."
  *   *While they submit, quickly scan the room. Note who looks confused.*

  **15:00 – 25:00 | The Reveal**
  *   Show a slide with two static dots: Red (Left), Green (Right).
  *   **Script:** "There was no motion. There was no mid-air color change. There were only two stationary flashes. Yet, [X]% of you reported motion. [Y]% reported the color changing mid-trajectory."
  *   *Read a few anonymous answers aloud.*
  *   **The Pivot:** "Here is the problem. Did your brain fake the experience *before* you saw it (Stalinesque), or did you see the truth and your memory was edited *after* (Orwellian)?"

  **25:00 – 35:00 | The Split (Lab Assignment)**
  *   Divide the room: Left Half = **Stalinesque Lab**. Right Half = **Orwellian Lab**.
  *   Hand out physical index cards (or use a second Google Form) for the prediction.
  *   **Task:** "You have 10 minutes. You must propose a **Probe**. A Probe is a modification to the experiment that would yield different results for your model vs. the other model. Write down: 1. The Modification. 2. Your Model's Prediction. 3. The Opposing Model's Prediction."
  *   *Circulate.* Push them hard. If they say "Ask them sooner," ask "How much sooner? Milliseconds?"

  **35:00 – 50:00 | The Confrontation**
  *   Collect the predictions. Put them on the board.
  *   **Predictable Outcome:** You will find that for every Probe (e.g., "Interrupt with a loud noise," "Ask for immediate verbal report," "Mask the second dot"), the predictions converge.
  *   *Example:*
      *   *Probe:* Flash a white mask immediately after the sequence.
      *   *Stalinesque:* Mask wipes the constructed experience. (Report: Flashes)
      *   *Orwellian:* Mask wipes the sensory data needed for revision. (Report: Flashes)
  *   **Script:** "Look at the board. Why do your predictions match?"

  **50:00 – 65:00 | The "Failed" Probe (Live Demo)**
  *   Pick the best Probe from the board (usually "Immediate Verbal Report").
  *   Run the animation again.
  *   **Instruction:** "This time, as soon as you see the color change, shout 'NOW'."
  *   **Result:** They will shout 'NOW' *after* the event is over, or in unison at the end. They cannot catch the construction in progress.
  *   **Script:** "You cannot catch the editor in the editing room. Why?"

  **65:00 – 80:00 | The Debrief (Dennett's Dissolution)**
  *   This is where you give them the labels formally.
  *   **Concept:** The Cartesian Theater assumes a "finish line" where unconscious processing becomes conscious experience.
  *   **The Point:** If there is no finish line, there is no fact of the matter about *when* the revision happened.
  *   **Script:** "The Orwellian/Stalinesque distinction presupposes a moment where the content becomes fixed. Dennett argues there is no such moment. There are only multiple drafts of narrative fragments. The question 'Did I see it or remember it?' is a category error."

  **80:00 – 90:00 | Q&A and Exit**
  *   Open floor.
  *   **Exit Ticket:** "One sentence: Why can't science solve the Orwellian/Stalinesque debate?"

  ### 4. Troubleshooting Predictable Failures

  **Failure 1: The Illusion Doesn't Fire (30% of the room)**
  *   **Cause:** Projector persistence is too high, or the ISI (60ms in code) doesn't match their temporal integration window.
  *   **Fix:** Do not panic. Do not try to "fix" the code live.
  *   **Philosophical Save:** "For 30% of you, the brain refused to collaborate. You saw the 'truth' (two flashes). This proves the 'editing' is optional. For the rest of you, the editing was mandatory. The question remains: For those who saw motion, *when* did the edit happen?"
  *   **Use the Skeptics:** Assign the students who saw two flashes to be the "Control Group" for the Labs. They are the empirical baseline.

  **Failure 2: The "Confident Kid" Claims They Saw the Mechanism**
  *   **Student:** "I saw the red dot, then I inferred the green dot, my brain just filled it in."
  *   **Response:** "Great. That's the Orwellian story. But can you prove you didn't *hallucinate* the motion before you inferred it? Can you point to the moment in your experience where the inference happened?"
  *   **Goal:** Force them to realize they cannot introspect the *process*, only the *product*.

  **Failure 3: The Labs Actually Find a Difference**
  *   **Risk:** A student proposes a probe that *does* work (e.g., TMS disruption of V5).
  *   **Response:** "If you disrupt V5 and the motion disappears, the Stalinesque says 'We stopped the construction.' The Orwellian says 'We stopped the data required for the revision.' The interpretations still differ, even if the data is the same."
  *   **Lesson:** The distinction is metaphysical, not empirical.

  ### 5. Honest Limits (For Your Preparation)

  **Can this setup discriminate between the models?**
  **No.** And that is the most important thing you will teach them.
  If you try to make this lab "solve" the problem, you will fail, and the students will feel cheated.
  You must frame the **failure to discriminate** as the **success of the lesson**.

  **How to stage the "Letdown" as a Result:**
  1.  **Explicitly state the goal:** "We are going to try to find the seam in the experience where the editing happens."
  2.  **When the seam isn't found:** "We have failed to find the seam. Why? Because the seam doesn't exist."
  3.  **The Takeaway:** The Orwellian/Stalinesque distinction is a relic of the Cartesian Theater. It assumes there is a "Real Experience" and a "Edited Memory." Dennett's Multiple Drafts model suggests there is only the narrative.
  4.  **If the projector lag ruins the motion:** "The hardware has its own latency. Your brain has its own latency. You are trying to measure the timing of consciousness with tools that have their own timing issues. This is the problem of 'exogenous' vs 'endogenous' time."

  **Final Advice:**
  The success of this seminar depends on your comfort with ambiguity. When a student asks, "So which one is it really?", your answer must be, "The question assumes a fact of the matter that isn't there." If you waver on that, the lab becomes a parlor trick. If you hold the line, it becomes a demonstration of the Multiple Drafts Model.
