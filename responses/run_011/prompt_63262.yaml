answer: |-
  This is an exceptionally clean formulation of what is often called the **"Global Debunking"** or **"Self-Defeat"** objection to Evolutionary Debunking Arguments (EDAs). You have essentially reconstructed the critique made by philosophers like Erik Wielenberg, William FitzPatrick, and Katia Vavova against the Sharon Street/Richard Joyce style of argument.

  Your reasoning hasn't necessarily "gone wrong" in a logical sense; you have successfully demonstrated that the *strongest* version of the EDA is self-undermining. However, to answer your specific questions about where to break the chain and how to find a principled asymmetry, we need to look closer at **Premise 1** and **Premise 4**.

  Here is an analysis of where the pressure points are, the cost of giving them up, and where the principled asymmetry might lie.

  ### 1. Which step do you actually give up?

  You should give up **Premise 1**, but you need to replace it with a more nuanced principle.

  **Why Premise 1 is the weak link:**
  Premise 1 states: *If P's operation is fully explained by facts that have nothing to do with the D-facts, then P's outputs aren't justified.*
  This is an **Explanatory Constraint** on justification. The problem is that for *any* domain of abstract facts (logic, math, morality, perhaps even semantic facts), the facts themselves are causally inert. The fact that $7+5=12$ does not shoot causal rays into your brain. If Premise 1 requires a causal link between the fact and the belief, it destroys knowledge of all abstracta, including the logical facts used to derive Premise 1 itself (as you noted in step 6).

  **The Fix:**
  Replace Premise 1 with a **Counterfactual Tracking** or **Sensitivity** condition.
  *Revised P1:* If P's operation is fully explained by non-D facts, *and* we would have held the same beliefs even if the D-facts were different, then P's outputs aren't justified.

  This shifts the burden from "causal explanation" (which is impossible for abstracta) to "modal sensitivity" (could things have been otherwise?).

  ### 2. Where does the asymmetry come from? (Principled vs. Ad Hoc)

  You asked: *I can't see how to draw that line without either assuming the moral realist is wrong or excluding arithmetic by hand.*

  The principled line is **Modal Status (Necessity vs. Contingency)**.

  *   **Arithmetic/Logic:** These domains consist of **necessary truths**. There is no possible world where $7+5=13$. Therefore, when we ask the counterfactual question ("If $7+5$ didn't equal $12$, would we still believe it?"), the antecedent is impossible. But we can rephrase: "If the physical world operated such that combining 7 items and 5 items yielded 13 items, would we believe $7+5=12$?" The answer is likely **No**. Our arithmetic beliefs are constrained by the physical world. Evolution selects for organisms that track physical regularities. Since math describes physical regularities, evolution *must* select for true arithmetic beliefs to ensure survival. There is a **convergence** between fitness and truth.
  *   **Morality:** On the view targeted by EDAs (often non-naturalist realism), moral facts are often viewed as **contingent** (or at least, their instantiation is). Even if moral truths are necessary, the *debunker's challenge* is: "If evolution had favored cruelty (e.g., in a species where eating offspring maximized fitness), would we believe cruelty was wrong?" The realist often has to admit: **Yes, we would still believe cruelty was wrong.**

  **The Asymmetry:**
  *   **Math:** Fitness tracks Truth. (You can't survive long if you can't count predators).
  *   **Morality:** Fitness tracks *Adaptive Behavior*, not necessarily Moral Truth. (You can survive by believing "protect kin" is good, regardless of whether "protect kin" is *objectively* good).

  This is not ad hoc because it relies on the metaphysical distinction between necessary structural facts (math) and normative facts (morality) regarding their relationship to physical survival.

  ### 3. What does giving up Premise 1 cost?

  If you reject the original Premise 1 (Explanatory Constraint) in favor of a Tracking/Sensitivity constraint, the cost is:

  1.  **You must accept Externalism:** Justification is no longer about having an internal causal story connecting you to the fact; it's about whether your cognitive faculties are reliably tuned to the truth, even if you don't know *how*.
  2.  **You concede the "Third Factor" possibility:** You open the door for the moral realist to argue that there *is* a third factor linking evolution and morality (e.g., "Survival is good," so evolution selects for things that are good). If you allow this for math (Survival requires Truth), you must allow the realist to try to construct it for morality.
  3.  **You lose the "Knockdown" force:** The EDA stops being a *reductio* that proves moral skepticism and becomes a *challenge* to explain the reliability of moral beliefs. It shifts the burden of proof rather than settling the debate.

  ### 4. Where your reasoning is most likely to have gone wrong

  Your reasoning is logically valid, but **Premise 4** is more contentious than you treat it.

  *Premise 4:* "You can tell the whole story of why we came to hold that 7+5=12 without any arithmetical fact ever getting a look in."

  **The Objection:** Can you really?
  If you are a naturalist about math (math describes physical structures), then arithmetic facts *are* physical facts. Evolution selects for sensitivity to physical facts. Therefore, arithmetic facts *did* get a look in, because they are isomorphic to the survival-relevant physical facts.

  If you are a Platonist about math, then Premise 4 holds, but then you face the Benacerraf problem (how do we access Platonic realms?). But even then, the **indispensability argument** suggests we believe math because it's indispensable to our best science, which *is* selected for empirical adequacy.

  Your reasoning assumes that because the *mechanism* is evolutionary, the *content* is independent of the truth. But for math, the content is constrained by the environment in a way moral content might not be.

  ### 5. What would change my mind?

  You asked what consideration would push me to a different verdict about where the failure is.

  **Scenario A: I would accept the EDA (and accept skepticism about Math)**
  If you could convince me that arithmetic beliefs are **insensitive** in the same way moral beliefs are.
  *   *Argument:* "We believe $7+5=12$ because it's useful for trading. If $7+5$ actually equaled $13$, but believing it equaled $12$ still helped us trade (perhaps due to a systematic illusion in the universe), we would still believe $12$."
  *   If math beliefs are just "useful fictions" that have no counterfactual dependence on truth, then your Step 5 stands, and we are in global skepticism.

  **Scenario B: I would reject the EDA entirely (Save Morality)**
  If you could convince me that moral facts are **necessary** and **supervene** on natural facts in a way that guarantees evolutionary tracking.
  *   *Argument:* "It is a necessary truth that 'survival is good' or 'cooperation is good'. Since evolution selects for survival/cooperation, evolution *necessarily* selects for true moral beliefs."
  *   This is the "Third Factor" defense (defended by Wielenberg). If this works for morality, the asymmetry collapses, but the conclusion flips: Math is justified, and Morality is *also* justified.

  ### Summary Recommendation for Your Reading Group

  1.  **Keep Step 6 (Self-Undermining):** This is your strongest point. It forces the debunker to refine their premise.
  2.  **Modify Step 1:** Concede that "causal explanation" is too strong. Challenge the debunker to provide a principle that rules out morality but saves logic.
  3.  **Focus the Debate on Sensitivity:** The debate shouldn't be about *causes*; it should be about *counterfactuals*.
      *   *Question for the Debunker:* "If moral facts were different, would our beliefs be different?"
      *   *Question for the Realist:* "If fitness pressures were different, would our moral beliefs be different?"
  4.  **The Verdict:** The failure is in **Premise 1**. It is an overly internalist constraint on justification that fails for all abstract domains. Giving it up costs the "easy" victory of skepticism but preserves the coherence of epistemology. The asymmetry is found in the **modal relationship between fitness and truth**: Fitness *entails* logical consistency; fitness does not *entail* moral truth (only adaptive behavior).

  This preserves arithmetic (because you can't survive with bad logic in a consistent world) while keeping the pressure on morality (because you can survive with false moral beliefs if they motivate adaptive behavior).
