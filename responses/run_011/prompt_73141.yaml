answer: |-
  Here are ten questions arranged to build pressure on the internal coherence and practical application of the view.

  **1. The Divergence Case**
  Your account explicitly rejects the "bypassing rationality" view in favor of "self-concealment." Give us a concrete, real-world example where your verdict differs from the bypassing view. I want a specific case where the bypassing theorist says "this is manipulation" but you say "this is not," or vice versa, and tell us which verdict captures the moral problem better.
  *   **Follow-up:** If you say the bypassing theorist is wrong to call it manipulation because the target *knows* what's happening, doesn't that let obvious propaganda off the hook simply because it's become common knowledge?
  *   **Expected Answer:** She will likely cite a known nudging technique or propaganda trope where the audience is aware of the tactic, arguing that awareness restores agency even if reasoning is sidelined.

  **2. The Open Manipulator**
  Consider a fundraising letter that states upfront: "We are framing this request to trigger your guilt because guilt moves people to donate." If the recipient reads that, understands it perfectly, and donates *because* they feel the guilt anyway, your definition says this isn't manipulation. Are you committed to saying that transparency about the causal mechanism sanitizes the act, regardless of how coercive the emotion feels?
  *   **Follow-up:** If you argue that feeling guilt *after* reading the disclaimer means they didn't *really* understand the mechanism, aren't you redefining "understanding" to mean "immunity to influence," which makes your condition tautological?
  *   **Expected Answer:** She will likely argue that "registering the mechanism" requires more than intellectual assent; it requires the awareness to break the causal chain, which guilt often prevents.

  **3. Manipulation by Appointment**
  I hire a fitness coach and sign a contract authorizing them to shame me and use psychological triggers to get me to the gym. I know exactly how it works, and I authorized it. On your view, is this still manipulation because the mechanism operates on me even when I don't consciously register it in the moment, or does my standing consent dissolve the opacity?
  *   **Follow-up:** If consent dissolves the opacity, then manipulation isn't about the mechanism at all, but about the authority relationship; if it doesn't, then you have to tell me I am being manipulated by my own hired agents, which seems to stretch the term until it snaps.
  *   **Expected Answer:** She will likely bite the bullet that it *is* manipulation but permissible, or argue that standing consent changes the mechanism from "concealed" to "authorized tool."

  **4. The Benevolent Bullet**
  A therapist uses a technique to help a patient reframe a trauma, or a parent hides medicine in a child's food. These mechanisms are self-concealing to the target at the time of influence. Do you classify these as manipulation? If so, does calling them "manipulation" do any moral work, or is it just a descriptive label that requires a separate moral theory to justify?
  *   **Follow-up:** If the moral work is being done by "permissibility" rather than the definition of manipulation itself, why not build the wrongness into the definition and reserve the term for the harmful cases?
  *   **Expected Answer:** She will likely argue that manipulation is a descriptive category like "violence" (which can be surgical or criminal) and that separating definition from wrongness is necessary for clarity.

  **5. The Unreadable Disclosure**
  You've written about dark patterns and cookie banners. If a company discloses their data strategy in a ninety-page terms of service document that no one reads, is the mechanism self-concealing? Is manipulation here a fact about the influencer's design, or is it relative to each individual target's actual awareness?
  *   **Follow-up:** If it's target-relative, then the same interface is manipulative for me but not for the privacy lawyer who read the terms; how do you regulate a property that shifts depending on who is looking at it?
  *   **Expected Answer:** She will likely argue for an "objective reasonable person" standard for registration, allowing regulation to target designs that *tend* to conceal, even if some individuals pierce the veil.

  **6. Strategic Truths**
  Where do you draw the line between manipulation and skilled advocacy when the content is true but strategically ordered? If a teacher places a vivid anecdote before a dry statistic to ensure students accept the data, and the students don't register that the *ordering* is doing the persuasive work, is the teacher manipulating the class?
  *   **Follow-up:** If you say yes, then almost all pedagogy and leadership is manipulation; if you say no, you have to explain why ordering information isn't a self-concealing causal mechanism in the same way a dark pattern is.
  *   **Expected Answer:** She will likely distinguish between mechanisms that hide *influence* versus mechanisms that hide *content*, arguing that framing is expected in communication while dark patterns are not.

  **7. Degrees of Opacity**
  Is manipulation binary on your account, or is it a scalar property? If a mechanism is only partially self-concealing—say, the user suspects the app is addictive but isn't sure—is it partially manipulative?
  *   **Follow-up:** If it's scalar, how does your account help regulators draw a bright line for legislation, which is presumably what you want this theory to inform?
  *   **Expected Answer:** She will likely admit it is scalar but argue that regulation can set thresholds for "significant" opacity, similar to how we handle risk or negligence.

  **8. The Practitioner's Constraint**
  My co-host is a former ad copywriter. He wants to know: if he follows your rule and ensures no mechanism is self-concealing, what specific creative choices does he have to stop making that he isn't already avoiding because they're deceptive?
  *   **Follow-up:** If the answer is "nothing new," then your theory describes a problem practitioners already solve under "honesty"; if the answer is "stop using emotional appeals," then your theory bans most advertising, not just manipulation.
  *   **Expected Answer:** She will likely argue that it forces disclosure of *intent* and *method* (e.g., "this feed is sorted to maximize outrage"), which current honesty norms do not require.

  **9. The Normative Weight**
  You define manipulation by the opacity of the mechanism. But why is opacity the specific wrong-making feature? If I conceal a mechanism to protect you from anxiety, the opacity is the same as when I conceal it to exploit you. What is it about hiding the *how* that violates autonomy, distinct from hiding the *what*?
  *   **Follow-up:** If the violation is about losing control over your own psychology, doesn't that bring us back to bypassing rationality, which you explicitly rejected at the start?
  *   **Expected Answer:** She will likely argue that autonomy requires transparency about the forces acting on us, regardless of whether those forces are rational or emotional.

  **10. Falsification**
  What counterexample would force you to abandon this account? Is there a pattern of ordinary judgments—for instance, if most people intuitively called the "open manipulator" case manipulation—that would make you concede the definition is missing something?
  *   **Follow-up:** If you say no, that your theoretical clarity outweighs folk intuition, are you willing to accept that your term "manipulation" might no longer map onto the concept the public is actually worried about?
  *   **Expected Answer:** She will likely say she would adjust the account if it failed to capture paradigmatic cases of abuse, but will defend revising folk intuitions where they are inconsistent.
