  **MEMORANDUM**

  **TO:** Interpretation Committee
  **FROM:** [Your Name], Work-Study Student
  **DATE:** October 26, 2023
  **SUBJECT:** Draft Text and Precedent Analysis for Annie Mae Cobb Exhibit

  Per the Committee's request, I have drafted the entry wall text for the Annie Mae Cobb exhibit. Below is the proposed text, followed by an analysis of how this draft aligns with the Committee's five major precedents regarding conflicting historical narratives.

  ### Proposed Entry Wall Text (59 Words)

  > Annie Mae Cobb served the county as midwife and school staff from 1928 to 1968. While school board minutes list her as a cafeteria assistant, community tradition honors her as the first Black teacher at the white high school. Birth registries confirm forty deliveries, acknowledging official undercounting of Black home births. Her legacy bridges administrative record and lived experience.

  ### Analysis of Precedents and Principles

  To reach this text, I applied the implicit rules derived from the Committee's past decade of decisions. The Committee does not follow a single rule of "Documents vs. Memory." Instead, the precedents suggest a principle of **Provenance of Power**: *Official records prevail on neutral administrative facts, but community memory prevails when records are structurally biased, silent, or self-contradictory regarding marginalized groups.*

  **1. The Midwifery Claim ("Nearly every child" vs. "40 recorded")**
  *   **Recommendation:** Validate the community claim while citing the record's limitation.
  *   **Closest Analog:** *The 1936 Shooting.* In 1936, the Committee ruled that a blank sheriff's log did not negate oral history, recognizing that the record-keeper had an incentive to obscure. Here, the Registrar's own 1948 report admits to undercounting Black home births. The record is self-admittedly unreliable.
  *   **Secondary Analog:** *The Harvest Festival.* Where records are silent or incomplete, cultural truth stands.
  *   **Application:** We cannot say "every child" (factually unverifiable), but we must note the undercounting to validate the community's experience of her ubiquity.

  **2. The Teaching Claim ("Teacher" vs. "Cafeteria Assistant")**
  *   **Recommendation:** State the official title but contextualize it with the community memory.
  *   **Closest Analog:** *The Founder's Schoolhouse.* In that case, the Committee preserved the family plaque (Memory) but added a card with Town Records (Documents). They did not erase the tradition, nor did they validate it as fact.
  *   **Breaking Point:** We lack space for a separate card (60-word limit). The text must perform the "plaque and card" function simultaneously.
  *   **Application:** Like the *1911 Mill Fire* (where the wall text explained the discrepancy between 9 and 11), we must state the documented role ("Assistant") but acknowledge the memory ("Teacher") as a distinct, honored narrative.

  ### Commitments and Risks

  By approving this text, the Committee commits to the principle that **historical accuracy requires explaining *why* records and memory diverge, not just choosing one.**

  **Where I Am Least Sure:**
  I am uncertain if the *1936 Shooting* precedent fully overrides the *1911 Mill Fire* precedent regarding the teaching claim. In 1911, the Committee prioritized the Coroner's list (9 deaths) over the town tradition (11 deaths), even though the town had rang a bell for decades. If the Committee views the School Board Minutes as neutral as the Coroner's list, they may demand we remove the reference to her being a "teacher" entirely to avoid factual error.

  **What Would Change My Answer:**
  If we discovered evidence that the term "teacher" was used in 1961 newspaper articles or union filings, the *1948 Strike* precedent (external documentation validating the claim) would apply, and we could state "Teacher" definitively. Without that, we are balancing the *Schoolhouse* precedent (showing tension) against the *Mill Fire* precedent (prioritizing documents).

  **Precedent Being Bent:**
  I am bending the *1911 Mill Fire* precedent. In 1911, the text led with the fact (9) and explained the myth (11). In my draft, I have given the Memory ("honors her as") equal syntactic weight to the Document ("minutes list her as"). I did this because the *1936 Shooting* precedent suggests that records created during segregation (School Board) carry the same suspicion as the Sheriff's blotter. If the Committee feels this is too generous to memory, the text should revert to the 1911 structure: *"Board minutes list her as a cafeteria assistant, though community tradition cites her as..."*

  I look forward to discussing this at the meeting.
