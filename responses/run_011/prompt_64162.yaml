  2.  **Deconstruct the Precedents (The "Case Law"):**
      *   *1911 Mill Fire:* Community Memory (11) vs. Official Records (9). *Decision:* Trust Records (9), explain the Memory (11). *Principle:* Accuracy over tradition, but acknowledge tradition.
      *   *1936 Shooting:* Official Record (Blank/Torn) vs. Oral History (Woman's memory). *Decision:* Trust Oral History. *Principle:* Absence of evidence (especially suspicious absence) $\neq$ evidence of absence. Marginalized voices fill gaps in official records.
      *   *1948 Strike:* Union Memory (Win) vs. Official Records (Partial Defeat). *Decision:* Trust Records (Partial Defeat). *Principle:* Objective outcome over subjective victory narrative.
      *   *Founder's Schoolhouse:* Family/Plaque Memory (Thorne paid) vs. Town Records (Thorne voted no). *Decision:* Keep Plaque + Add Card explaining discrepancy. *Principle:* Preserve the artifact of memory, but correct the historical record side-by-side.
      *   *Harvest Festival:* Community Story (Cholera Thanksgiving) vs. No Records (Nothing before 60s). *Decision:* Publish the uncertainty, let the festival keep the story. *Principle:* Folklore is valid cultural history even if factually unproven.

      *   *Synthesizing the "Rules":*
          *   It's *not* simply "Documents beat Testimony." (See 1936 Shooting).
          *   It's *not* simply "Memory beats Documents." (See 1911 Fire, 1948 Strike).
          *   *Emerging Principle:* **Contextual Authority.** Who created the record? Who is being represented?
              *   If the record is *administrative* and neutral-ish (Mill Payroll, School Board Minutes), it usually wins on *facts* (Fire count, Job title).
              *   If the record is *suspect* or *oppressive* (Sheriff's blotter in a shooting, potentially), Memory wins.
              *   If the record is *silent* or *non-existent* (Harvest), Memory stands as *meaning* rather than *fact*.
