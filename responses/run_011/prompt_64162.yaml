          *   Nuance: Did she teach informally? Or is "Teacher" an honorific? The prompt says "School Cook" in the intro, but "Cafeteria Assistant" in the minutes.
          *   Decision: Must align with the 1911 Fire/1948 Strike precedent on *factual accuracy* regarding official roles, but frame it to honor her influence (like the 1936 Shooting logic regarding marginalized experience).

