answer: |-
  Based on the commission's track record, you are right to look past the specific categories and at the underlying logic. The rulings are inconsistent if you look for a single definition of "citizenship," but they are remarkably consistent if you view them as a negotiation between two competing principles of legitimacy.

  Here are the two candidate rules that survive the data, how they apply to the commuters, my prediction, and the wedge case that will break the tie.

  ### 1. The Candidate Rules

  **Rule A: The Principle of Coercive Subjection**
  *   **Definition:** Franchise is granted to anyone permanently subject to the state's sovereign power—specifically its laws, courts, police, and tax authority. If the state can punish you, you must have a say in its composition.
  *   **Evidence:** This explains the **prisoner** ruling (they are under maximum state coercion) and the **emigrant** ruling (they remain subject to certain citizenship laws/taxes for 15 years). It also explains why **seasonal workers** are excluded (their subjection is temporary/contractual) and why **tourists** are excluded (transient subjection).

  **Rule B: The Principle of Social Fate**
  *   **Definition:** Franchise is granted to anyone whose daily life, future interests, and social reproduction are materially woven into the polity. Voting is not about legal status, but about sharing a "community of fate."
  *   **Evidence:** This explains the **8-year PR rule** (time is a proxy for weaving a life), the **16/17 municipal ruling** (local life is woven, national future is not yet), and crucially, the **children of emigrants** ruling (blood/citizenship is irrelevant without actual lived connection). It also explains why **adults under guardianship** are excluded (they lack the agency to participate in that social fate).

  ### 2. Application to Cross-Border Commuters

  *   **Under Rule A (Subjection):** **They Vote.**
      They pay income tax, they are answerable to your courts and police 40 hours a week, and they are economically regulated by the state. Their subjection is routine and systemic, indistinguishable from a resident during working hours.
  *   **Under Rule B (Social Fate):** **They Do Not Vote.**
      Their social reproduction (family, kids, school, leisure) happens entirely outside the border. They are economically plugged in but socially detached. Like the "children of emigrants," they have a legal/economic tie but no *lived* tie. Like the "seasonal workers," their presence is functional rather than existential.

  ### 3. The Bet

  **Prediction:** The commission denies the franchise to cross-border commuters.

  **Why:**
  While the Prisoner ruling makes Rule A (Subjection) look strong, the **Children of Emigrants** ruling is the smoking gun. That decision explicitly prioritized *actual life lived* over *legal status inherited*. If blood citizenship isn't enough without social weaving, then tax payment certainly isn't.

  Furthermore, the **8-year wait for Permanent Residents** establishes that for non-citizens, *time* is the necessary proxy for "Social Fate." The commission has already decided that mere legal residence isn't enough; you need duration to prove integration. Commuters have zero duration of residence. To grant them the vote would invalidate the 8-year hurdle for PRs who actually sleep on your soil. The commission will likely rule that economic subjection is a condition of employment, but social fate is a condition of the franchise.

  ### 4. The Wedge Case

  To force these two rules apart, you need a case where Coercive Subjection is absolute, but Social Fate is non-existent, specifically for a non-citizen.

  **The Case:** **Non-Citizen Conscripts.**

  **The Scenario:** The state moves to draft Permanent Residents into the military *before* they hit the 8-year mark for full franchise. These individuals are subject to martial law, military discipline, and the risk of death (maximum Coercive Subjection), but they are new arrivals with no established social weaving, families, or long-term stake in the society (minimum Social Fate).

  **Why it breaks the machinery:**
  *   If they **vote**, Rule A (Subjection) wins. The commission admits that being forced to fight for the state confers the right to rule it, regardless of integration. This undermines the 8-year PR rule.
  *   If they **don't vote**, Rule B (Social Fate) wins. The commission admits that even the ultimate sacrifice of coercion doesn't matter without social integration. This undermines the Prisoner ruling (where coercion alone sufficed for citizens).

  This case forces the commission to decide whether the franchise is a shield against the state's power (Subjection) or a share in the state's future (Fate). Based on their hostility toward the "children of emigrants," I suspect they will deny the conscripts the vote, revealing that their true operating principle is not democracy, but **integrationism**.
