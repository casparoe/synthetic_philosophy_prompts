answer: |-
  TO: Board of County Commissioners
  FROM: Commissioner [Your Name]
  DATE: October 15, 2024
  SUBJECT: Recommendation on Pre-Kindergarten Program Structure

  **Recommendation**

  I recommend the Board adopt Version A: the universal pre-kindergarten program funded by the half-cent sales tax increase. While Version B (targeted eligibility) offers a compelling concentration of resources, Version A offers a stronger long-term return on investment for the county's social infrastructure and economic stability.

  **The Case for Version B (Targeted)**

  Before detailing my reasoning, I want to state the strongest case for Version B, as my colleagues have raised valid concerns that deserve full acknowledgment.

  Version B maximizes the intensity of service for the children most at risk. By restricting eligibility to 200 percent of the federal poverty line, we ensure that every dollar spent delivers a higher per-child subsidy. In a county where economic distress is concentrated, this version acts as a sharper scalpel. It aligns with the conventional wisdom of public welfare: when resources are finite, they must be reserved for those who cannot help themselves.

  Furthermore, Version B is politically safer in our current climate. We are a low-turnout county coming off a contentious school board recall. There is a genuine risk that voters will view a universal benefit as subsidizing families who could already afford private care. A targeted program is easier to defend as a safety net rather than a handout. It respects the taxpayer's desire to see money go strictly to "those who need it," minimizing the resentment that often fuels anti-tax movements. If our primary goal is immediate risk mitigation and maximum depth of intervention for the poorest households, Version B is the logical choice.

  **The Case for Version A (Universal)**

  I recommend Version A not because it ignores these risks, but because it addresses the structural weaknesses of our county more effectively than Version B.

  1.  **Administrative Efficiency and Work Incentives:** Version B requires a bureaucracy to verify income, monitor changes in employment, and enforce eligibility. This creates administrative overhead that eats into the program budget. More importantly, means-testing creates a "benefit cliff": a parent who earns a raise might lose their child's spot, creating a disincentive to work. Version A eliminates this penalty. Every family keeps their spot regardless of income fluctuations, stabilizing household economics across the county, not just at the bottom.

  2.  **Retention of the Tax Base:** Our county struggles with population retention. Middle-class families often leave districts where public services are perceived as solely for the poor. By making pre-K universal, we signal that our public institutions are quality enough for everyone. This helps retain families who might otherwise move to neighboring counties or private sectors, protecting our long-term property tax base and enrollment numbers.

  3.  **The Trust Argument:** This is the core of my recommendation. My colleagues argue that universalism requires a high-trust society to function, and that we lack the soil for that seed. They contend that in a low-trust environment, universal benefits will be resented as waste.

      I argue the reverse: trust is not only a precondition for institutions; it is an output of them. Means-tested programs require suspicion by design. They require us to verify neighbors' income, report fraud, and categorize citizens into "deserving" and "undeserving." This institutionalizes scrutiny and reinforces the very low-trust dynamics we suffer from. It teaches citizens to view public resources as a zero-sum game where one family's gain is another's loss.

      Universalism changes the incentive structure. When everyone pays into the system and everyone is eligible to use it, the question shifts from "Do they deserve this?" to "Is this working well?" It creates a shared stake in quality. If the program fails, everyone suffers, which creates a broad coalition demanding improvement rather than a narrow group defending benefits against cuts.

      Does this hunch survive contact with our specific reality? Yes, but with a caveat. In a homogeneous, high-trust society, universalism is stable. In a polarized, low-trust county like ours, it is an intervention. It will not immediately cure polarization. However, adopting Version B guarantees we remain in a low-trust equilibrium where we police each other for eligibility. Adopting Version A is a risk, but it is the only mechanism available to us that actively builds social capital rather than consuming it. We cannot wait for trust to appear before we build trusted institutions; we must build the institutions to generate the trust.

  **Implementation Timeline**

  To ensure Version A succeeds and does not become a target for backlash due to poor execution, I propose the following phased rollout:

  *   **November 2024:** Commission vote to authorize Version A structure and ballot language (if voter approval is required for tax).
  *   **January – June 2025:** Program design phase. Hire Program Director. Establish quality standards and curriculum framework. Begin facility assessment.
  *   **July 2025:** Sales tax collection begins (pending voter approval).
  *   **August 2025 – June 2026:** Staff recruitment and training. Secure leases or partnerships for initial classrooms.
  *   **August 2026:** Phase 1 Launch. Open 50% of projected classrooms. Enrollment open to all four-year-olds, prioritized by lottery if demand exceeds initial capacity.
  *   **July 2027 – June 2028:** Phase 2 Expansion. Open remaining classrooms to reach full capacity.
  *   **August 2028:** Full operational capacity reached (36 months from vote). Annual performance review scheduled to assess quality and enrollment demographics.

  **Conclusion**

  Version B is the safer political bet today. Version A is the better investment for the county we want to be in five years. I urge the Board to choose the path that builds rather than polices.

  Verdict: ADOPT UNIVERSAL
