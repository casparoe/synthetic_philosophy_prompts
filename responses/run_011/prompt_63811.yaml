answer: |-
  **Case 1: The Duty**
  Alex is the shift supervisor at a chemical processing plant, and his assigned responsibilities explicitly include monitoring the pressure gauge on Tank 5 and manually closing Valve 12 if the pressure exceeds the red line. During his shift, the pressure spikes. Alex is standing directly in front of the manual override wheel for Valve 12; he sees the spike, knows exactly what it means, and has the physical strength to turn the wheel. However, a phone on his desk begins ringing, and he turns to answer it, forgetting the valve. Had he turned the wheel, the pressure would have normalized. Because he did not, the tank ruptures, causing an explosion.

  **Case 2: The Prohibition**
  Alex is a senior safety auditor visiting the chemical processing plant, and protocol strictly forbids auditors from touching operational controls to preserve the integrity of the safety audit; only the shift supervisor may touch Valve 12. The shift supervisor is currently in the break room, leaving Alex standing alone in front of the manual override wheel. During the visit, the pressure spikes. Alex is standing directly in front of the manual override wheel for Valve 12; he sees the spike, knows exactly what it means, and has the physical strength to turn the wheel. However, a phone on the desk begins ringing, and he turns to answer it, forgetting the valve. Had he turned the wheel, the pressure would have normalized. Because he did not, the tank ruptures, causing an explosion.

  ***

  ### Theoretical Checks

  **(a) Plain Counterfactual/Difference-Making Account**
  This view holds that $C$ causes $E$ if and only if, had $C$ not occurred (or had the agent acted), $E$ would not have occurred.
  *   **Verdict:** In both cases, the verdict is **Cause**.
  *   **Reasoning:** The physical facts are identical. In the nearest possible world where Alex turns the wheel, the explosion does not happen. The normative status of Alex's role is irrelevant to the counterfactual dependency between the omission and the explosion. The theory holds fixed the physical capacity and the outcome, ignoring the rulebook.

  **(b) Norm-Dependent Account (Duty-Based)**
  This view holds that an omission counts as a cause only if the agent was under a specific obligation or duty to perform the act; omissions are causally salient only against a background of normative expectations.
  *   **Verdict:** Case 1 is **Cause**; Case 2 is **Not a Cause** (or causally inert).
  *   **Reasoning:** In Case 1, Alex breached a positive duty; his failure is a deviation from the expected course of events, making it a cause. In Case 2, Alex was under a prohibition. His inaction was the normatively expected behavior (compliance), even if it led to disaster. The "cause" of the explosion is shifted to the supervisor who left the post or the company policy, not Alex's failure to intervene.

  **(c) Omission Skeptic Account**
  This view holds that omissions are absences, and absences are nothing; nothing cannot cause something. Only positive events exert causal force.
  *   **Verdict:** In both cases, the verdict is **Not a Cause**.
  *   **Reasoning:** Alex's "not turning" is not an event. The explosion was caused by the pressure buildup and the material failure of the tank, not by what Alex didn't do. This view treats both cases identically, dismissing the causal efficacy of the omission entirely regardless of duties or prohibitions.

  ***

  ### Analysis of the Feature Doing the Work

  The feature driving the divergence between the Counterfactual and Norm-Dependent accounts is **the prohibition itself**, but its intuitive force relies heavily on the **fact that someone else was authorised to act**.

  In Case 2, the prohibition feels weighty because there *is* a shift supervisor who *should* have been there. The intuition that Alex is not a cause leans on the background assumption that the "proper" causal chain (Supervisor acts) was disrupted by the Supervisor's absence, not Alex's presence. If you pull the "authorised other" out of the setup—imagine a scenario where Alex is forbidden to touch the valve, and *no one* is authorized to touch it manually (perhaps it is a fully automated system where manual intervention is illegal)—the intuition shifts. If Alex is the only human present and the system fails, most people will intuitively say Alex *should* have broken the rule to save the plant. In that modified pair (Forbidden + No Authorized Other), the Norm-Dependent account struggles: it must either say Alex caused the explosion (violating its own rule that prohibitions negate causal salience) or say he didn't (which clashes with the intuition that he was the only physical barrier to harm).

  The Norm-Dependent account earns its keep only if we accept that "causation" in human contexts is partly a tool for assigning responsibility, not just tracking physics. However, if the intuition in Case 2 is that Alex *did* cause the explosion (because he physically could have stopped it), the Norm-Dependent account looks like it is conflating *causation* with *blameworthiness*. It stipulates that because he wasn't to blame (or less to blame), he wasn't a cause.

  ### The Attack from the Worst-Performing Theory

  Assuming the **Norm-Dependent Account** comes off worst (because it seems to deny physical reality in favor of bureaucratic rules), it would attack the case by arguing that the Counterfactual Account is too broad to be useful. It would claim:

  > "If you say Alex caused the explosion in Case 2, you must also say that the phone manufacturer caused the explosion (by making the phone ring), the plant architect caused it (by placing the phone near the valve), and every passerby who didn't run in and turn the valve caused it. Causation selects *abnormal* conditions. In Case 1, Alex's inaction was abnormal (breach of duty). In Case 2, Alex's inaction was normal (compliance). Therefore, only in Case 1 is the omission a 'difference-maker' in the relevant sense. The Counterfactual Account fails because it cannot distinguish between a cause and a mere background condition without relying on norms anyway."

  This attack concedes that norms are required to *select* causes from the infinite web of counterfactual dependencies, arguing that the Norm-Dependent account isn't stipulating intuitions but rather exposing the hidden normative machinery that the Counterfactual Account pretends to lack.
