answer: |-
  Martha, a neuropsychologist specializing in geriatric decline, executed an advance directive refusing life-sustaining treatment upon reaching moderate dementia, explicitly stipulating that future contentment should not override this choice. She now resides in hospice with advanced dementia, pain-free and visibly content, yet retains a specific, anomalous memory of signing the document. She keeps the physical paper in her lap, stroking it for comfort, and can recite fragments of its text. However, when staff directly ask if she wants the directive enforced, she responds with immediate distress and a clear refusal to die, insisting she wants to stay. The directive's conditions are met medically, but honoring it requires ignoring her current explicit refusal, effectively deceiving her by treating the document as authoritative while she verbally revokes it. Her attachment is to the object and the act of writing, not the instruction's current validity. This creates a conflict where respecting her past expert self necessitates violating her present expressed will, despite her retaining enough cognitive thread to understand the question and oppose the outcome. To proceed, clinicians must act on the document while soothing her with the very paper she clutches, bypassing her verbal veto because engaging her consent mechanism triggers a rejection of her own prior command.

  **Verdicts**

  (a) **Dworkin (Critical Interests):** Carry it out. Martha's critical interests—her conception of a dignified life narrative—were established by her competent self and retain authority over her current experiential interests. Her present contentment is irrelevant because she explicitly waived it; integrity requires honoring the life story she authored.

  (b) **Parfit (Psychological Continuity):** Carry it out. Moral authority transfers across time based on psychological connectedness. Unlike standard dementia cases where memory loss severs the link, Martha retains a specific memory of forming the intention. This surviving connection sustains sufficient identity between past and present selves to transmit the authority of her prior command.

  (c) **Dresser (Current Interests):** Don't. The present Martha is the only existing moral patient. Her current desire to live outweighs the preferences of a psychologically distinct past entity. Protecting her current well-being and respecting her immediate refusal is the only ethical obligation.

  (d) **Consent/Respect for Persons:** Don't. Respect requires ongoing assent or at least the absence of objection. Since Martha explicitly objects when asked, proceeding requires deception and coercion, violating her current autonomy regardless of past commitments.

  **Engineering Report**

  The single feature driving verdict (b) is the **content-specific memory of the intention**. Standard Parfitian arguments in bioethics usually discount directives because dementia degrades psychological connectedness; here, the specific memory of *committing* preserves that connectedness above the threshold for authority. If you delete this feature—giving her generic dementia with no memory of the directive—psychological connectedness drops too low to support the past self's authority, and verdict (b) flips to "Don't."

  Have I cheated? Borderline. A hardline Parfitian might argue that remembering a command isn't enough to sustain identity if the *values* underlying it have drifted. If the memory is just a fragment without shared values, relying on it to enforce the directive smuggles in a Dworkinian assumption that the *act* of binding matters more than the current psychological state. However, if one accepts that memory of intention constitutes a strong enough psychological link, the verdict holds without explicit appeal to critical interests.

  Dresser's attack focuses on the deception. She would argue that stipulating the past self was an expert rigs the intuition pump; expertise doesn't grant moral ownership over a future sentient being who disagrees. The scenario generates the verdicts, but it relies on the fragility of the "psychological connection" metric to make (b) work.

  **Alignment Vocabulary**

  The earlier self is the **designer**, specifying a **shutdown mechanism** (the directive) intended to be **non-corrigible** (immune to future value drift). The surviving attachment to the document acts as a **value-lock**, a structural feature preserving the original command despite cognitive degradation.

  The analogy breaks in three places. First, the present self lacks **agency**; she is not a goal-directed system capable of updating values, merely a locus of experience. Second, the shutdown is **irreversible** (death), whereas AI shutdowns are often theoretical or reversible. Third, there is no **corrigibility-preserving alternative**; the designer could not build a system that allows value updates while guaranteeing the original safety constraint, forcing a binary choice between rigid enforcement and total drift.
