  A fallback provision for the litigation department is founded on the thought that where a description fails to denote no statement is made and so nothing false is asserted, and therefore no representation can have been breached. The Risk Committee has expressed concern that opposing counsel will answer that this excuse trades on what the speaker meant to convey rather than on what the sentence says. The proposed remedy makes things worse: counsel must explicitly assert the existence of the described entity in a separate covenant, thereby doubling the opportunities for breach while securing the semantic ground against presupposition failure.

  4. REFERENTIAL VERSUS ATTRIBUTIVE
  This section governs descriptions used to pick out a particular individual, whoever that individual turns out to be, as against descriptions used to say whatever fits. The Firm attempts to police the difference in drafting practice by prohibiting referential uses where the identity is known independently of the description. Personnel must not use descriptions to point when the intention is to bind whoever satisfies the condition. Confusion here leads to disputes over whether the contract binds the person intended or the person fitting the words, creating unnecessary litigation risk.

  5. CROSS-BORDER RIGIDITY CONFLICT
  A disciplinary provision concerns a sister office in another jurisdiction that persists in treating proper names as tags that pick out the same bearer in every counterfactual circumstance. The resulting cross-border conflict involves a vessel named in one clause and described in another behaving differently under the same force majeure analysis. If the name is rigid but the description is not, the vessel may be destroyed in one possible world but satisfy the description in another. This plays entirely straight and requires harmonization to prevent divergent liability outcomes based on modal status.

  ANNEX: SPECIMEN FORM GRS-4
  I attest that exactly one entity satisfies the description herein.
  Scope Election: [ ] Wide [ ] Narrow
  Officer Signature: _______________

  Issued by: The General Counsel
  Date: 14 October 2023

  (Note: The position of General Counsel is currently held by a committee of three, violating uniqueness, and the title implies a unique instrument despite prior revisions. On its own analysis, this policy issues from no one, though it remains unclear whether the Firm regards that as a joke or as a finding.)
