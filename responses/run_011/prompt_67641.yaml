  5.  **Final Polish:** Organize into logical headers corresponding to the user's questions. Ensure the "Underdetermined" sections are highlighted. (Self-Correction: Make sure to explicitly answer the "What would the abandoned commitment look like" question with concrete institutional alternatives).

