answer: |-
  This is a precise dissection of the Intergovernmental Panel on Climate Change (IPCC) procedure. You are asking for the metaphysics of the consensus machine. Below is a reconstruction of the philosophical commitments embedded in the rules you described, separated into what the procedure *strictly presupposes*, what it *accommodates*, and where the design is *underdetermined*.

  ### 1. Theory of Group Agency: The Logic of Non-Objection

  **The Presupposition:**
  The procedure presupposes a **negative theory of collective agency**. It does not require the group to form a positive belief ("We believe X"); it requires the group to eliminate negative constraints ("No one blocks X").
  *   **Status of Silence:** A delegation's failure to object is not coded as an assertion of truth, nor strictly as a belief. It is a **performative act of acquiescence**. It amounts to a commitment *not to contest* the sentence in future international forums. It transforms the sentence from a scientific claim into a diplomatic fact.
  *   **The Unit of Agency:** The "Group" is not an organic whole but a **veto-wielding consortium**. Agency is distributed negatively; the whole acts only insofar as the parts refrain from stopping it.

  **What Sits Well With It:**
  This accommodates a **pragmatic theory of truth**. It treats "consensus" not as a convergence of mental states regarding reality, but as a convergence of willingness to proceed. It allows a delegation to internally disagree with a sentence while externally validating it for the sake of the process.

  **Underdetermination:**
  The rule "consensus required" is licensed by three incompatible stories that the design does not distinguish:
  1.  **Epistemic:** Rigorous challenge weeds out error; what remains is robust.
  2.  **Legitimacy:** All sovereigns had a veto; therefore, all are bound by the result.
  3.  **Coordination:** We need a single focal point for negotiation, even if it is imperfect.
  *The procedure works identically under all three, masking the fact that they justify different outcomes.*

  ### 2. Aggregation: Sentences vs. Document

  **The Presupposition:**
  The procedure assumes **logical atomism in diplomacy**. It presupposes that sentence-level assent aggregates into document-level assent without loss of coherence. It treats the Summary as a **set** of propositions rather than a **narrative** argument.
  *   **The Conjunction Problem:** You noted that Coalition A carries Line 1 and Coalition B carries Line 2. The procedure presupposes that the *document* can be the object of citation even if no single agent endorses the *conjunction* (Line 1 AND Line 2).
  *   **Implication:** The "consensus" is not a shared worldview. It is a **registry of compatible tolerances**. The document is not claimed to be "true" in a unified sense, but "operable" in a unified sense.

  **What Sits Well With It:**
  This allows for **overlapping consensus** (in the Rawlsian sense). Different delegations can endorse the same text for different reasons (e.g., one accepts a temperature target because of economic risk, another because of moral duty). The text remains stable while the justifications remain private.

  **Underdetermination:**
  The design does not specify whether the document is a **finding** or a **treaty**.
  *   If it is a *finding*, the lack of a single endorser for the conjunction is an epistemic flaw (the "discursive dilemma").
  *   If it is a *treaty*, the lack of a single endorser is irrelevant; only the signature on the package matters.
  *The IPCC cites the document as a finding (science) but builds it like a treaty (negotiation). The procedure relies on this ambiguity to function.*

  ### 3. Truth vs. Uncontestedness (The Deletion Fallback)

  **The Presupposition:**
  The procedure presupposes a **dual-track epistemology**.
  1.  **The Chapters:** Track *scientific warrant*. (Truth is determined by evidence/literature).
  2.  **The Summary:** Tracks *political uncontestedness*. (Authority is determined by lack of objection).
  *   **Deletion:** When a line is deleted because it cannot be carried, but remains in the chapter, the procedure admits that **scientific truth and political utility are distinct categories**. It implies that a fact can be "true" (in the chapter) but "inadmissible" (in the Summary).

  **What Sits Well With It:**
  This protects the **authority of the institution**. If the Summary were strictly truth-tracking, a single government blocking a robust finding would break the science. By decoupling the Summary from the Chapter's warrant, the institution treats the Summary as a *policy interface*, not a *scientific abstract*.

  **Underdetermination:**
  When Truth and Uncontestedness come apart, the design does not specify which authority prevails in the public sphere.
  *   **Epistemic Story:** The Chapter is the real authority; the Summary is a translation.
  *   **Legitimacy Story:** The Summary is the real authority; the Chapter is background material.
  *   *In practice, the press and negotiators treat the Summary as the primary truth.* The procedure licenses this by making the Summary the only text "approved" by governments, effectively allowing political uncontestedness to overwrite scientific warrant in the public record.

  ### 4. Author's Warrant vs. Party's Assent (The Two-Text Problem)

  **The Presupposition:**
  The procedure presupposes **semantic stability**. It assumes that governments can reword a sentence without altering its scientific meaning. It requires that a text approved by interested states can be "faithful" to a text no state approved.
  *   **Coherence:** This relies on a distinction between *discovery* (scientists) and *ratification* (states). It assumes states are ratifying the *meaning*, not authoring the *content*.

  **What Sits Well With It:**
  This accommodates the **policy-relevant/policy-prescriptive boundary**. Scientists define the physical constraints; states define the salience of those constraints. Rewording allows states to frame the science in terms of risk, cost, or feasibility without changing the underlying physics.

  **Underdetermination:**
  The design cannot distinguish between **clarification** and **alteration**.
  *   When a government changes "will" to "may," is that a correction of scientific overreach (preserving fidelity) or a dilution of risk (altering meaning)?
  *   *The rules treat these identically.* Both are processed as "edits." The institution relies on the scientists in the room to police this, but the procedural power lies with the governments.

  ### 5. Neutrality vs. Negotiation (The Core Tension)

  **The Tension:**
  You ask how negotiating factual squares with neutrality.
  *   **The Commitment:** The procedure is actually committed to **Actionability**, not Neutrality.
  *   **The Mechanism:** By forcing governments to negotiate the wording of facts, the procedure transforms "is" statements into "ought" precursors. A fact that has been negotiated and approved by a government is no longer just a fact; it is a **commitment baseline**.
  *   **Neutrality Claim:** The claim to be "not policy-prescriptive" is preserved only by a narrow definition of *prescription*. The Panel defines prescription as *recommending specific actions* (e.g., "build a wall"). It does not define the *selection and framing of facts* as prescription.

  **The Abandoned Commitment:**
  If the institution were built around **Epistemic Purity** instead of Actionability, it would look like this:
  *   **No Government Approval:** The SPM is published by the scientists alone.
  *   **Confidence Distributions:** Instead of consensus sentences, the report publishes the distribution of author confidence and government reactions as an annex.
  *   **Registry of Objections:** The Summary records which delegations objected to which lines.
  *   **Result:** The document would have higher scientific integrity but lower diplomatic utility. It would be a *warning* rather than a *mandate*. Governments could ignore it without having formally blocked it.

  If the institution were built around **Political Honesty** instead of Neutrality, it would look like this:
  *   **Treaty Status:** The SPM is explicitly a political document derived from science, not a scientific document approved by politics.
  *   **Result:** This would clarify that the "consensus" is political, not epistemic. It would lower the scientific authority of the SPM but increase the accountability of the governments for the wording they chose.

  ### 6. Summary of Philosophical Architecture

  | Feature | Strict Presupposition | Underdetermined Area |
  | :--- | :--- | :--- |
  | **Consensus Rule** | Negative agency (non-objection binds the group). | Is this for truth-tracking, legitimacy, or coordination? |
  | **Sentence vs. Doc** | Logical atomism (assent to parts = assent to whole). | Is the doc a finding (requires coherent belief) or treaty (requires signature)? |
  | **Deletion** | Dual-track epistemology (Truth $\neq$ Admissibility). | Which track holds public authority when they diverge? |
  | **Rewording** | Semantic stability (Wording changes don't alter meaning). | Is the edit a clarification (scientific) or a dilution (political)? |
  | **Neutrality** | Actionability over Purity (Facts must be owned to count). | Is the selection of facts a neutral act or a policy choice? |

  **Conclusion on the Tension:**
  The procedure resolves the tension between negotiating facts and claiming neutrality by **redefining neutrality**. It operates on the theory that a fact is not "policy-relevant" until it has been **socialized** through the political system.
  *   **Strict Presupposition:** The institution presupposes that *process* confers *status*. A fact approved by consensus is a different *kind* of fact than a fact merely evidenced.
  *   **The Philosophical Cost:** The institution sacrifices the **correspondence theory of truth** (does this match the world?) for a **consensus theory of validity** (can we all live with this?). It assumes that for climate policy, the latter is the only truth that matters.

  The design is underdetermined precisely where it needs to be: it allows scientists to tell themselves they are protecting the truth, and governments to tell themselves they are protecting their sovereignty, while producing a single text that functions as both. The ambiguity is not a bug; it is the load-bearing wall of the consensus.
