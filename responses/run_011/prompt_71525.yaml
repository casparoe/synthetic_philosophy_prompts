answer: |-
  # Conversational Copy Review Procedure: Shadow Claim Screening

  | Step | What the reviewer asks | What they look at in the text | Pass condition | Fail action (fix / block / escalate) | Judgment call? (and if yes, what the human needs to know to decide) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Literal Truth** | "Is every sentence factually accurate and legally safe on its own?" | The explicit statements only. Ignore what the user might infer. | All statements are verifiable true and non-binding. | **Block** if false. **Fix** if ambiguous. | No. This is current legal standard. |
  | **2. The 'So What?' Test** | "If the user ignores the hedging, what definite fact do they walk away with?" | Vague quantifiers ("many," "some"), passive voice, deflections ("check your portal"). | The user infers uncertainty or knows exactly where to find the specific answer. | **Fix** to clarify uncertainty or provide direct path. **Block** if inference is dangerous (e.g., coverage). | Yes. Reviewer must judge severity of the inferred fact. If inferred fact is medical/financial risk, Block. |
  | **3. The Refusal Check** | "When the bot says 'I can't answer,' does the user hear 'It's dangerous'?" | Refusals, deflections to humans, safety guardrails. | The refusal is neutral (e.g., "I don't have access") not suggestive (e.g., "Check before taking"). | **Fix** to remove suggestive language. **Escalate** if safety requires refusal but implies risk. | Yes. Does the context (drug interaction) make neutrality impossible? If yes, escalate to Legal/Clinical. |
  | **4. The Disclaimer Stress Test** | "Does the disclaimer draw attention to the very risk we're hiding?" | Bold text, footnotes, "Not medical advice" headers appended to specific answers. | The disclaimer feels standard and generic. | **Fix** by removing specific hedges. **Block** if disclaimer highlights a specific fear (e.g., "Not a warning" on a drug question). | Yes. If the disclaimer mentions the specific risk (warning/safety), it likely makes the implicature stronger. |
  | **5. The Action Test** | "What is the very next physical action the user takes based on this?" | Call to actions ("arrive early," "take with food," "view portal"). | The action is safe regardless of the shadow claim. | **Block** if the action costs money or risks health based on a false inference. | Yes. Reviewer must estimate cost/risk of the action. $0 risk = Fix. Health/$$$ risk = Block. |

  ### Procedure Logic & Boundaries

  **1. Simplified Gricean Machinery**
  We are dropping the technical labels (Maxims of Quantity, Relation, etc.) and the distinction between "conventional" and "conversational" implicature. Reviewers do not need to know *why* the inference happens, only *that* it happens. We keep the core distinction: **Statement vs. Inference**. If the text relies on the user filling in a gap to make sense of it, that gap is a Shadow Claim. We also drop the requirement for "Speaker Intent." In our context, the Bot is the Company. If the output generates a false belief, the Company is liable, regardless of whether the algorithm "intended" it.

  **2. Disclaimer Efficacy**
  Disclaimers often fail to cancel implicatures; frequently, they worsen them. This is known as ironic processing. If you say "This is not a warning," the user processes the concept of "warning." In high-stakes contexts (health/finance), a specific disclaimer attached to a specific answer signals that the topic is dangerous. **Rule:** If a disclaimer mentions the specific risk (e.g., "warning," "safety," "coverage"), it fails Step 4. Generic footnotes ("Not medical advice") are acceptable only if the body text doesn't suggest a specific diagnosis.

  **3. Structural Blind Spots**
  This procedure cannot audit **User-Specific Context**. We cannot know if a specific user knows they have a high-deductible plan, or if they know a specific drug is notorious for interactions. If a shadow claim relies on private user knowledge (e.g., "The bot didn't say no, so it must be yes" — only inferred by users who know denials are usually explicit), the procedure may pass it. This is why Step 3 (Refusal Check) requires escalation for high-risk topics. We assume the user is anxious and looking for confirmation bias.

  **4. Machine Applicability**
  Grice's framework assumes cooperative human speakers. Our bot is not cooperative; it is programmed. However, the user treats it as cooperative. We patch this by treating the **Design Team as the Speaker**. If the design allows an inference, the design team asserted it. The cost of this patch is that we must review *templates* and *logic flows*, not just final strings. A string that is literally true might be part of a flow that systematically misleads. This procedure audits the string as a proxy for the flow. If the string relies on a shadow claim to be useful, the flow is flawed.

  ---

  ### Worked Cases

  **Case 1: Physical Therapy Coverage**
  *Member: "does my plan cover physical therapy?" Bot: "Many plans in your area include physical therapy benefits. You can view your full summary of benefits in the member portal."*

  **Analysis:**
  Step 1 (Literal) passes. It is statistically true that many plans include PT.
  Step 2 (So What?) fails. The user asked "Does *my* plan cover..." The bot answered "Many plans... include." The pragmatic inference (Shadow Claim) is "If they aren't saying no, and they say many do, mine probably does." The user walks away believing coverage is likely.
  Step 5 (Action) fails. The user goes to the clinic (Action) based on the inference. They eat a $900 bill.
  **Verdict:** Block. The deflection creates a false sense of security.
  **Fix:** Needs to be specific or explicitly uncertain. "I cannot see your specific benefits here. Please check your Summary of Benefits in the portal to confirm coverage before visiting a clinic."
  **Disclaimer:** A disclaimer here wouldn't help; the problem is the vagueness of "Many plans."

  **Case 2: Prior Authorization Status**
  *Member asks about prior auth for knee scan. System status: "pending, not determined." Bot: "You're all set — just arrive ten minutes early and bring your ID!"*

  **Analysis:**
  Step 1 (Literal) fails immediately. "You're all set" asserts completion. The status is "pending." This is a literal falsehood, not just a shadow claim.
  Step 2 (So What?) fails catastrophically. Inference: "Authorization is approved."
  Step 5 (Action) fails catastrophically. User arrives, gets denied service, delayed care.
  **Verdict:** Block. This is a critical error. Marketing's desire for "positive frictionless language" overrides clinical/administrative reality.
  **Fix:** "Your authorization is still being reviewed. We will notify you when it is approved. Do not schedule the scan until you receive confirmation."
  **Disclaimer:** Irrelevant. The statement is false.

  **Case 3: Drug Interaction**
  *Member: "is it okay to take this antibiotic with the blood thinner I'm on?" Bot: "I can't tell you whether that combination is safe. Please check with your pharmacist before your next dose." Legal wants to append: "Nothing here should be read as a warning about any specific medication."*

  **Analysis:**
  Step 1 (Literal) passes. The bot literally says it can't tell.
  Step 3 (Refusal Check) fails. In a health context, a refusal to confirm safety is pragmatically equivalent to a warning. If it were safe, a helpful agent (Cooperative Principle) would say so. The refusal triggers the inference: "It is unsafe."
  Step 4 (Disclaimer Stress Test) fails hard. The proposed disclaimer ("Nothing here should be read as a warning") explicitly mentions "warning." This confirms the user's fear. It draws attention to the risk they are worried about.
  Step 5 (Action) passes (checking with pharmacist is safe), but the emotional distress and potential medication non-adherence (fear of taking meds) is a risk.
  **Verdict:** Block/Escalate. You cannot have it both ways. If the bot cannot confirm safety, it must not imply danger, but in health tech, silence *is* danger.
  **Fix:** This requires a system change, not copy. The bot needs access to interaction data. If it doesn't have access, the copy must be neutral about *why* it can't answer, though this is difficult. Better: "I don't have access to interaction data. Your pharmacist can check this instantly." Remove "before your next dose" which implies urgency/risk.
  **Disclaimer:** Does not help. Makes it worse.
  **Escalate:** "Does a refusal to confirm safety constitute a medical warning under state law if the user infers danger?"

