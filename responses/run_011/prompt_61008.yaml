answer: |-
  This is a precise articulation of the two biggest metaphysical hurdles in current mechanistic interpretability: the **stability problem** (are features robust or hyperparameter-dependent?) and the **basis problem** (is sparsity enough to guarantee naturalness, or can we rotate the basis arbitrarily?).

  Here is the strongest case for feature realism grounded in causal consumption, followed by an analysis of where that case risks collapsing into circularity.

  ---

  ### Part 1: The Case for Realism via Causal Individuation

  The argument that SAE features are "real" does not rest on the claim that there is a single, God-given dictionary size where the "true" features live. Rather, it rests on the claim that the model is an optimized system, and optimization pressures carve the residual stream into functionally distinct channels. SAEs are not inventing structure; they are recovering the coordinate system the model uses to route information.

  **1. Instability is Hierarchy, Not Artifact**
  Your first observation—that doubling the dictionary size decomposes features—is not evidence that the original features were fake. It is evidence that the model's representation is hierarchical.
  Consider computer vision: a lower-resolution map shows "Highway 101." A higher-resolution map splits this into "Northbound Lanes" and "Southbound Lanes." The fact that "Highway 101" vanishes at higher resolution does not mean it wasn't a real functional unit at the lower resolution; it means it was a composite.
  In SAEs, a feature found at dimension $D$ often splits into a parent/child relationship or a set of mutually exclusive sub-cases at dimension $2D$. If the original feature predicted a specific downstream logit difference, and the new finer-grained features *jointly* predict that same logit difference with higher fidelity, the underlying *signal* is stable. The variance you see is in the **granularity of description**, not the existence of the structure. The model *must* represent these concepts to minimize loss; the SAE is simply converging on the sparse basis that isolates them.

  **2. Solving Gerrymandering via Downstream Consumption**
  Your second observation is the deeper threat: the "gerrymandered direction" (e.g., "Apple" but not "in code blocks"). If we individuate features by human labelability, this is fatal. Humans can construct infinitely many valid Boolean combinations of activations that look "nameable."
  However, the model does not care about human names. It cares about **causal leverage**.
  To block the gerrymandering worry, you must shift the criterion of "realness" from *activation patterns* to *downstream usage*.
  *   **The Test:** Take your "clean" feature (Apple) and your "gerrymandered" feature (Apple $\land$ $\neg$Code). Project them into the residual stream. Now, measure their impact on the output logits or the activations of the next layer.
  *   **The Outcome:**
      *   **Case A:** The downstream weights treat them identically. In this case, the distinction is functionally null. The "gerrymandered" direction is mathematically distinct but computationally redundant. It is not a separate feature; it is the same feature expressed in a rotated basis that the model ignores. You haven't found a new component; you've found a degree of freedom the model doesn't use.
      *   **Case B:** The downstream weights treat them differently. In this case, the model *is* distinguishing between "Apple in text" and "Apple in code." If so, the gerrymandered direction is not a gerrymander; it is a **more accurate description of a real feature** that your original SAE failed to separate. The model genuinely routes these tokens differently.

  **3. The Conclusion: Features as Units of Computation**
  Therefore, a feature is "real" if and only if it is a **minimal unit of causal leverage**. It is a direction in the residual stream such that intervening on it changes the model's behavior in a predictable, structured way, and such that splitting it further yields diminishing returns on causal explanation.
  By individuating features by how they are consumed, you anchor them in the model's actual objective function (loss minimization) rather than the analyst's subjective ontology. The "Apple" feature exists because the model has weights downstream that specifically amplify that direction to predict food-related tokens. If a gerrymandered direction does not engage those weights differently, it is not a rival hypothesis; it is noise.

  ---

  ### Part 2: Where the Case is Weakest (The Circularity Trap)

  While the causal consumption argument is the strongest defense against gerrymandering, it exposes the methodology to a different, more insidious vulnerability: **Explanatory Circularity.**

  **1. The Tautology of "Use"**
  If you define a feature entirely by its downstream weights, you risk reducing interpretability to linear algebra.
  *   *Claim:* "Feature $F$ explains why the model predicts 'pie' after 'apple'."
  *   *Definition:* "Feature $F$ is the direction that connects 'apple' activations to 'pie' weights."
  *   *Critique:* You have not explained *why* the model does this; you have merely pointed to the wire that carries the signal. If the criterion for a feature's existence is "it has unique downstream effects," then explaining behavior by pointing to the feature becomes: "The model outputs $Y$ because it has weights that map $X$ to $Y$."
  This is circular. It compresses the weights into a sparse basis, which is useful for compression, but it does not necessarily provide a **mechanism** that is intelligible to humans. To avoid circularity, the feature must be individuated by downstream use *but explained by upstream semantics*. If you drop the semantic requirement entirely to avoid gerrymandering, you lose the ability to say *what* the feature represents, only *where* it goes.

  **2. The Granularity Problem Revisited**
  The causal criterion struggles to solve your first observation (dictionary size instability).
  If "realness" is defined by causal leverage, at what threshold does a sub-feature become "real"?
  *   Suppose at $D=16k$, you have a "Python Function" feature.
  *   At $D=32k$, it splits into "Python Definition" and "Python Call."
  *   Both have distinct downstream effects. Both are "real" by the causal criterion.
  *   But which one is the *component* of the model's organization?
  If the answer is "both," then the model's organization is fractal. If the organization is fractal, then claiming SAEs find "the components" is misleading. They find *a* basis at *a* scale. This undermines the claim that you are reverse-engineering a fixed circuit; instead, you are choosing a resolution at which to describe a continuous manifold. The "components" are not ontological primitives; they are convenient bins for continuous variation.

  **3. The Indistinguishable Gerrymander**
  The strongest blow to the causal criterion is the possibility of **functional equivalence**.
  Suppose you can construct a gerrymandered direction $v_{gerry}$ that has the *exact same* downstream causal impact as the clean feature $v_{clean}$ (within noise).
  *   The causal criterion says these are identical features.
  *   But $v_{gerry}$ is logically complex (e.g., "Apple unless in code") while $v_{clean}$ is simple.
  *   If the model treats them identically, it implies the model's downstream weights are *blind* to the logical complexity of the feature's definition.
  *   This suggests the "cleanliness" of the feature is not a property of the model, but a property of your SAE training objective (the $L_1$ penalty).
  If the model doesn't distinguish them, but you do, then the "naturalness" of the feature is an artifact of your basis selection, not the model's internal organization. You have successfully blocked the claim that the gerrymander is a *different* feature, but you have failed to prove that the clean feature is *preferred* by the model. You are left claiming that the model uses a "clean" feature when, functionally, it could be using a "gerrymandered" one indistinguishably.

  ### Summary
  The strongest case for realism is that **optimization creates structure**, and **causal impact validates existence**. Features are real if they are the levers the model pulls to minimize loss.

  The weakest point is that **causal impact alone does not guarantee intelligibility**. If features are defined solely by downstream weights, explaining behavior becomes a tautology of "weights connecting to weights." Furthermore, if gerrymandered directions can be functionally equivalent to clean ones, the "naturalness" of the clean features may be a bias of the SAE algorithm rather than a truth about the model. You are left with a useful compression scheme, but perhaps not a map of the model's "true" ontology.
