prompt: |-
  I audit smart contracts for a living: six years of Solidity, EVM semantics, storage layouts, proxy patterns, gas behaviour, and the formal-verification tooling built around them. I know enough game theory to follow a Nash equilibrium and the rough shape of the folk theorem for repeated games, but I am not a theorist. I recently came across the program-equilibrium literature — the setting Tennenholtz gave that name to in 2004, after earlier work by McAfee, Howard, and Rubinstein — in which players do not choose actions but submit computer programs that play a base game on their behalf, each program receiving the other program's source code as input and returning an action, and a program equilibrium is then a Nash equilibrium over pairs of programs. Three constructions struck me, and I want to hold them against the world I actually work in:

  (a) Syntactic comparison: a program that cooperates if and only if the opponent's submitted program is character-for-character identical to its own code, and defects otherwise. Two copies of it cooperate, and neither can gain by deviating, since any different program gets defected against.

  (b) Proof-based cooperation: a program that cooperates if and only if it can find a proof, in some fixed formal system, that the opponent's program run against it would cooperate. Löb's theorem is used to show that two such programs cooperate with one another, and that, assuming the proof system is consistent, a program that would defect simply gets defected against.

  (c) ε-grounded simulation: a program that cooperates with small probability ε and otherwise calls the opponent's program on itself, so that mutual recursion terminates almost surely while a would-be defector is punished in expectation.

  The literature also has a folk theorem: a payoff vector is achievable in some program equilibrium exactly when it is feasible and individually rational — essentially the whole repeated-game payoff set, obtained in a single simultaneous move.

  Please restate all of this in my vocabulary, as faithfully as you can: deployed bytecode versus verified source, storage slots and mutable state, calls and delegatecall, revert and gas limits, immutable versus upgradeable contracts, timelocks and multisigs, the mempool and transaction ordering, the cost of computation, and the difference between what a contract does and what it can be made to do by the state it happens to be called in. Take the three constructions one at a time and then the folk theorem, and for each say what has a clean on-chain counterpart, what you had to bend to make it fit, and what cannot be expressed at all.

  Then give me the residue report, which is the part I actually care about:

  1. Flag every place the translation is doing work rather than describing something — every time you find yourself importing an assumption from my world (gas is finite, state persists between calls, the code at an address can be swapped behind a proxy, calls have side effects, ordering is auctioned) — and say whether the original result still holds once that assumption is in place.

  2. Say whether the premise that two programs can inspect and reason about each other freely, costlessly, and without altering anything is load-bearing for the cooperative results. If it is, I want your view on whether the program-equilibrium folk theorem is best read as a theorem about games or as a theorem about an idealized interpreter nobody has.

  3. Tell me which way the residue runs. I can already see that some things survive better on-chain than in the theory — immutability makes precommitment genuinely credible, where the theory seems to need an outside enforcer to guarantee that the code submitted is the code that runs. Say what else survives better, and what has no on-chain home at all, Löbian reasoning included: whether an agent here can even pose a counterfactual question about its opponent's action without paying for it and revealing that it asked.

  4. Say whether anything important in my world — MEV, statefulness across transactions, governance forks that change the payoff function itself — is invisible in their framework in a way that suggests it answers a question I would not recognize as mine.

  Be honest about failure. If a construction has no counterpart in what I do, say so plainly rather than reaching for an analogy.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Professional smart contract auditor (6 years exp). Deeply technical knowledge of Solidity, EVM, storage, proxies, gas, formal verification. Knows basic game theory (Nash, Folk Theorem) but isn't a theorist.
      *   **Topic:** Program Equilibrium (Tennenholtz 2004, McAfee, Howard, Rubinstein). Specifically: Syntactic Comparison, Proof-Based Cooperation (Löbian), $\epsilon$-Grounded Simulation, and the Program-Equilibrium Folk Theorem.
      *   **Task:** Translate these theoretical concepts into the user's vocabulary (bytecode, storage, proxies, gas, mempool, etc.).
      *   **Specific Requirements:**
          1.  Restate the three constructions + Folk Theorem in EVM terms (Counterpart, Bends, Impossible).
          2.  Residue Report:
              *   Flag translation work/imported assumptions (gas, state, proxies, etc.) and validity.
              *   Assess the "free inspection" premise (load-bearing?).
              *   Direction of residue (what survives better on-chain vs. theory).
              *   Blind spots (MEV, statefulness, governance forks).
          3.  **Tone:** Honest, technical, no fluff, acknowledge failure where analogies break.

  2.  **Deconstruct the Theoretical Concepts:**
      *   *Program Equilibrium:* Players submit programs $P_1, P_2$. $P_1(P_2)$ returns action $A_1$. Nash Equilibrium over programs.
      *   *(a) Syntactic Comparison:* `if (input_code == my_code) cooperate else defect`.
      *   *(b) Proof-Based (Löbian):* `if (prove(input_code(self) == cooperate)) cooperate else defect`. Relies on Löb's Theorem for mutual cooperation.
      *   *(c) $\epsilon$-Grounded:* Probabilistic termination to avoid infinite recursion. `if (random() < ε) cooperate else input_code(self)`.
      *   *Folk Theorem:* Any feasible, individually rational payoff is achievable.

  3.  **Translate to EVM/Smart Contract Context:**
      *   *Program:* Deployed Bytecode (or Source via verification).
      *   *Input:* `msg.sender`, `calldata`, or actually reading code at an address (`extcodecopy`).
      *   *Action:* Return value, state change, ETH transfer.
      *   *Execution:* Transaction execution context.
      *   *Constraint:* Gas limits, state mutability, inability to halt the chain, inability to perfectly predict state *before* execution without simulating (which costs gas).

  4.  **Drafting the Translations (Iterative Process):**

      *   *(a) Syntactic:*
          *   *Idea:* Contract checks if caller is identical code.
          *   *EVM:* `extcodecopy` the caller. Compare bytecode hash.
          *   *Bend:* Cloning is easy. Just deploy the same bytecode.
          *   *Fail:* Identity isn't unique. Two different addresses can have same code. "Cooperate" usually means "send ETH" or "allow access". If I clone you, I drain you.
          *   *Verdict:* Weak. Code identity $\neq$ Agent identity.

      *   *(b) Proof-Based:*
          *   *Idea:* Verify a proof that the other contract will cooperate.
          *   *EVM:* ZK-SNARKs / Validity Proofs on-chain.
          *   *Bend:* You can't prove "what contract B *will* do" easily because B's behavior depends on *its* state and *its* view of A. It's a circular dependency.
          *   *Fail:* Löb's theorem requires logical consistency and self-reference within a formal system. EVM execution is physical/computational, not purely logical. Gas limits break infinite recursion needed for some logical constructions. You can't prove a future state transition without knowing the whole world state.
          *   *Verdict:* Mostly impossible. ZK can prove *past* state or *computation*, not counterfactual cooperation in a simultaneous game without trusted setup or specific circuit constraints.

      *   *(c) $\epsilon$-Grounded:*
          *   *Idea:* Random chance to stop recursion.
          *   *EVM:* `BLOCKHASH` or `PREVRANDAO` for randomness.
          *   *Bend:* Gas limits enforce termination anyway.
          *   *Fail:* If I call you, and you call me, that's a REVERT (depth limit or gas). You can't recursively call the transaction initiator *during* the transaction in a way that resolves the game.
          *   *Verdict:* Broken by call depth and gas.

      *   *Folk Theorem:*
          *   *Idea:* Any payoff possible.
          *   *EVM:* Composability allows complex payoff structures.
          *   *Fail:* Gas costs money. "Free" computation isn't real.

  5.  **Developing the Residue Report (The Core Value):**

      *   *Assumption Check:* The theory assumes costless inspection. EVM charges gas for `extcodecopy`. Theory assumes static code. EVM has proxies (code can change). Theory assumes simultaneous move. EVM is sequential (mempool/ordering).
      *   *Load-Bearing Premise:* "Free inspection" is critical. In EVM, inspection is expensive and public (mempool leakage).
      *   *Direction of Residue:*
          *   *Better On-Chain:* Immutability (if not proxy). Precommitment is real (code is law).
          *   *Worse On-Chain:* Counterfactuals. You can't ask "what if" without executing "what is". State leakage.
      *   *Blind Spots:* MEV (ordering changes outcomes). Governance (code *can* change via vote). Statefulness (repeated games are natural on-chain, unlike the single-shot program equilibrium).

  6.  **Refining the Tone:**
      *   Use auditor slang ("revert", "storage slot", "delegatecall", "front-run").
      *   Be direct. "This doesn't work."
      *   Acknowledge the user's expertise.

  7.  **Final Review against Constraints:**
      *   Did I cover (a), (b), (c), and Folk Theorem? Yes.
      *   Did I do the 4-point Residue Report? Yes.
      *   Is it honest about failure? Yes, especially on Löbian cooperation.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction on (a):* In EVM, `CREATE2` allows deterministic addresses. If I use `CREATE2` with the same salt, I get the same address. But the theory assumes *programs* are the players, not addresses. If the program is the player, cloning is trivial. I need to emphasize that *code identity* is not *agent identity* on-chain.
      *   *Correction on (b):* There is work on "Smart Contract Cooperation" using ZK. I should mention that while pure Löbian logic doesn't port, *verifiable computation* does, but it changes the game structure (commit-reveal).
      *   *Correction on (c):* Recursion on EVM is limited by stack depth (1024) and gas. It's not "almost sure termination," it's "hard revert."

  9.  **Final Polish:** Ensure the distinction between *source code* (verified) and *bytecode* (deployed) is clear, as auditors care about this distinction. Emphasize the difference between *static analysis* (audit time) and *runtime* (execution time).

  **(Self-Correction Note):** I need to make sure I don't just say "it's hard." I need to explain *why* in EVM semantics. For Löb, it's about the difference between *provability* in a logic system vs. *executability* in a state machine.

  Let's write the response.

  *Structure:*
  1.  Introduction (acknowledging the frame).
  2.  Translation of (a), (b), (c), Folk Theorem (Counterpart, Bend, Impossible).
  3.  Residue Report (1-4).
  4.  Closing.

  *Key Vocabulary to inject:* `extcodehash`, `delegatecall`, `sstore`, `gasleft()`, `BLOCKHASH`, `tx.origin`, `CREATE2`, `mempool`, `frontrunning`, `reentrancy`.

  *Critical Insight:* The biggest friction is that Program Equilibrium assumes the program *is* the agent. In Ethereum, the program is a *tool* used by an EOA (Externally Owned Account) or another contract. The EOA can always wrap the contract in a different interface. This breaks the "submit program" premise. I must highlight this.

  *Wait, one more thing:* The prompt asks about "Program Equilibrium" specifically where programs read *source code*. On EVM, you read *bytecode*. Source is off-chain metadata. This is a crucial distinction for an auditor. I will emphasize `extcodecopy` vs Source.

  *Refining the "Folk Theorem" translation:* The PE Folk Theorem says you can get any feasible payoff in one shot. On-chain, "one shot" is a transaction. Feasible payoffs are constrained by gas. Individually rational is constrained by the ability to `revert`.

  *Okay, ready to draft.*
answer: |-
  Here is the translation of Program Equilibrium (PE) into EVM semantics, followed by the residue report you requested. I have stripped the game-theoretic abstraction and mapped it directly to execution contexts, storage, and bytecode constraints.

  ### Part 1: The Constructions in EVM Semantics

  #### (a) Syntactic Comparison
  *The Theory:* Cooperate iff `opponent.code == self.code`.
  *The EVM Translation:*
  *   **Counterpart:** A contract that performs `extcodecopy` on `msg.sender` (or a target address passed in calldata) and compares the returned bytecode hash against its own `address(this).codehash`. If they match, it executes a privileged function (e.g., `withdraw` or `swap` without fee); otherwise, it reverts.
  *   **The Bend:** In PE, the "program" is the player. On-chain, the *account* (EOA or Contract) is the player; the code is just logic. I can deploy a wrapper contract with the exact same bytecode as yours but with a modified constructor or storage initialization that routes profits to me. `codehash` equality does not guarantee *state* equality or *intent* equality.
  *   **The Impossible:** True syntactic identity as a binding commitment. Because of `CREATE2`, I can predictably deploy your exact bytecode at a different address. Because of proxies (`delegatecall`), the code at an address can change while the address remains constant. You cannot bind an agent to a specific bytecode hash without also binding the storage layout and the upgrade key, which are separate state slots.

  #### (b) Proof-Based Cooperation (Löbian)
  *The Theory:* Cooperate iff `prove(opponent(self) == Cooperate)`.
  *The EVM Translation:*
  *   **Counterpart:** A contract that accepts a ZK-SNARK proof in calldata asserting that a specific execution trace of the counterparty contract results in a `Cooperate` return value. Verification happens via a precompile (e.g., `ecRecover` or a pairing check).
  *   **The Bend:** Löb's theorem relies on the system proving statements about its own provability within a consistent logical formalism. The EVM is a state machine, not a logic solver. To prove "Contract B will cooperate," you must prove the state transition of Contract B. But Contract B's state transition depends on *its* view of Contract A. This creates a circular dependency in the witness generation. You cannot generate a valid proof of *future* on-chain execution without knowing the entire world state (blockhash, balance, nonce) at the time of execution, which is impossible pre-execution.
  *   **The Impossible:** Self-referential logical consistency. In Solidity, `this` refers to the contract instance, but `this` cannot statically analyze the control flow of an external call without actually executing it (or simulating it off-chain). On-chain, you cannot run a formal verifier *during* a transaction that verifies the verifier of the caller within the same gas budget. The recursion depth limit (1024) and gas limits hard-cap the "reasoning depth."

  #### (c) $\epsilon$-Grounded Simulation
  *The Theory:* Cooperate with prob $\epsilon$, else `opponent(self)`.
  *The EVM Translation:*
  *   **Counterpart:** A contract that checks `block.prevrandao % 100 < epsilon`. If true, it returns `true` (cooperate). If false, it makes an external call to the counterparty contract, passing its own address, expecting a boolean return.
  *   **The Bend:** The theory assumes recursion terminates "almost surely." The EVM enforces termination "absolutely" via gas limits and stack depth. If Contract A calls Contract B, and B calls A, you are building a reentrancy vector. Unless the state is mutated *before* the call (Checks-Effects-Interactions), this is an exploit waiting to happen, not a cooperation mechanism.
  *   **The Impossible:** Costless simulation. In PE, running the opponent's code is free. On-chain, every `CALL` costs gas. If $\epsilon$ is small, the expected gas cost of the recursive chain before termination may exceed the block gas limit, causing a hard revert. Furthermore, you cannot hide the $\epsilon$ check; the mempool sees the transaction logic.

  #### (d) The Program-Equilibrium Folk Theorem
  *The Theory:* Any feasible, individually rational payoff is achievable in a single shot.
  *The EVM Translation:*
  *   **Counterpart:** Composability. By chaining contracts (Legos), you can construct arbitrary payoff distributions in a single transaction bundle (e.g., via Flashbots).
  *   **The Bend:** "Feasible" in PE means mathematically possible. "Feasible" on-chain means `gas_used < block_gas_limit`. The cost of computation eats into the payoff vector. A complex equilibrium strategy might be theoretically profitable but gas-negative.
  *   **The Impossible:** Simultaneity. PE assumes simultaneous submission. The EVM is strictly sequential (transaction ordering). Even in a single block, tx A executes before tx B. This allows the second mover to observe the first mover's state changes and revert if the outcome is unfavorable (atomic arbitrage), collapsing the "simultaneous" payoff set into a sequential Stackelberg game.

  ---

  ### Part 2: The Residue Report

  #### 1. Imported Assumptions & Validity
  Here is where the translation is doing work rather than describing reality:

  *   **Assumption:** *Code is Static.*
      *   **EVM Reality:** `delegatecall` and Proxies (EIP-2535, UUPS). The logic at an address can be swapped by an admin key.
      *   **Validity:** **Failed.** A PE strategy relying on `codehash` is broken by an upgradeable proxy. The "program" submitted is not the "program" that runs next week. You must audit the admin keys and timelocks, not just the logic.
  *   **Assumption:** *Inspection is Costless.*
      *   **EVM Reality:** `extcodecopy` costs gas. Reading storage costs gas.
      *   **Validity:** **Degraded.** Strategies that require deep inspection of the opponent's state before acting become economically unviable if the inspection cost exceeds the gain from cooperation.
  *   **Assumption:** *Execution is Deterministic.*
      *   **EVM Reality:** `BLOCKHASH`, `PREVRANDAO`, and block gas limits introduce environmental variance.
      *   **Validity:** **Held, with caveats.** Within a single tx execution, it is deterministic. But the *inclusion* of the tx is not.
  *   **Assumption:** *The Program is the Agent.*
      *   **EVM Reality:** The EOA (Private Key) is the agent. The contract is a tool.
      *   **Validity:** **Critical Failure.** An EOA can wrap any contract in a different interface. I can deploy your "Cooperative Bot" but interact with it via a wrapper that strips the cooperation logic. The PE framework assumes the program *is* the commitment. On-chain, the program is just a mutable state machine controlled by a key.

  #### 2. The Load-Bearing Premise: Free Inspection
  **Yes, it is load-bearing.** The cooperative results in PE (especially Löbian) collapse if reading the opponent's code incurs a cost or alters the state.

  *   **My View:** The Program-Equilibrium Folk Theorem is a theorem about an **idealized interpreter**, not about games played on a state machine with resource constraints.
  *   **Why:** In the EVM, "inspecting" a contract often means simulating it. Simulation is either off-chain (untrusted) or on-chain (expensive). If I have to pay to verify you will cooperate, the surplus from cooperation is reduced. If the verification cost > cooperation surplus, the equilibrium defects.
  *   **The "Trusted Setup" Equivalent:** The only way to recover PE on-chain is to move the verification off-chain (ZK proofs) and only verify the *result* on-chain. But this shifts the trust assumption to the proving system, not the code itself.

  #### 3. Direction of Residue: What Survives Where?
  *   **Survives Better On-Chain:**
      *   **Precommitment:** In PE theory, you need an external enforcer to ensure I run the program I submitted. On Ethereum, `CREATE` is a binding precommitment. Once deployed, the bytecode is immutable (unless proxied). I cannot change my strategy mid-game without a new deployment. This makes *credible threats* (e.g., "I will revert the whole transaction if I don't get paid") much stronger on-chain than in theory.
      *   **Atomicity:** The ability to revert the entire state transition if the outcome isn't favorable is a stronger "punishment" mechanism than most repeated game theories allow.
  *   **Survives Worse On-Chain (No Home):**
      *   **Löbian Reasoning:** There is no on-chain home for this. You cannot pose a counterfactual ("What would you do if I did X?") without actually doing X or paying for a ZK proof of the simulation. Asking the question *is* executing the transaction. You cannot query the EVM without mutating state (or paying for a trace).
      *   **Source Code Privacy:** PE assumes programs read source. On-chain, only bytecode is public. Source is IPFS metadata. You cannot reason about variable names or logic structure on-chain, only opcodes.

  #### 4. Blind Spots: What the Theory Misses
  The PE framework is blind to three critical dimensions of my world that answer questions the theory doesn't ask:

  *   **MEV (Transaction Ordering):** PE assumes a simultaneous move. In Ethereum, the "move" is a transaction. The miner/validator decides the order. If my cooperative strategy is profitable, a searcher will frontrun it, sandwich it, or reorder it to extract the value. The "payoff vector" is not a function of the strategies alone, but of the *block builder's* objective function.
  *   **Statefulness as a Weapon:** PE treats the game as one-shot (encoded in the program). On-chain, contracts have persistent storage. A "defect" isn't just a one-time payoff; it can be a storage slot change that permanently locks funds or poisons a protocol state. The "repeated game" isn't simulated by the program; it's inherent to the ledger history.
  *   **Governance Forks:** PE assumes the rules of the game (the interpreter) are fixed. In Ethereum, if a contract becomes too successful or dangerous, the social layer can fork the chain (e.g., The DAO) or upgrade the logic via governance. The payoff function itself is mutable by a vote. This breaks the "fixed formal system" assumption required for Proof-Based Cooperation.

  ### Summary Judgment
  Program Equilibrium describes a world where code is law, inspection is free, and logic is consistent.
  I work in a world where code is *executable*, inspection is taxed, and logic is constrained by gas and governance.

  *   **Syntactic Comparison:** Useful for allowlists, useless for trust.
  *   **Löbian Cooperation:** Theoretically elegant, practically impossible on EVM without heavy ZK infrastructure that changes the game to "Commit-Reveal."
  *   **Folk Theorem:** Holds only if you ignore gas costs and MEV.

  The residue runs **against** the theory. The constraints of the EVM (cost, ordering, statefulness) destroy the delicate fixed-points required for Program Equilibrium, while enhancing the credibility of simple, immutable precommitments. You are better off relying on **cryptoeconomic security** (slashing, bonds, timelocks) than **logical cooperation** (Löb, program equivalence). The former survives the mempool; the latter reverts out of gas.
