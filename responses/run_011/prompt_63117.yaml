      *   *Hypothesis:* Disagreement is about the account of causation (production vs. difference-making) and the function of the closure principle.
      *   *Assessment:* This is strong. The "production" view (mechanistic, energy transfer) tends to favor exclusion (if physics does the pushing, what's left for mind?). The "difference-making" view (counterfactual, interventionist) allows mental states to be causes because changing the mental changes the outcome, even if the physical substrate is fixed in the counterfactual comparison.
      *   *Refinement:* It's not just "which account?" It's about *causal relevance* vs. *causal efficacy*. It's also about the *exclusion principle* itself. Does the existence of a sufficient physical cause *exclude* other causes? That depends on what "cause" means.
      *   *Variable Granularity:* This is also key (Shapiro, Woodward). If variables are coarse-grained (mental), they capture dependencies fine-grained physical variables miss (multiple realizability).

  4.  **Determine the Nature of the Disagreement:**
      *   Is it verbal? Partly. "Cause" is doing too much work.
      *   Is it substantive? Yes, because it hinges on metaphysical commitments about realization and dependence.
      *   Is it about "Physical"? Yes, the "Physical" in closure is often ill-defined (Hempel's Dilemma), but most practitioners bracket this.
      *   *Diagnosis:* It's a **methodological and metaphysical mismatch regarding the granularity of causal explanation**. It's not just "which causation?" but "at what level does causation reside?"

