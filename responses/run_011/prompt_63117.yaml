answer: |-
  Your hypothesis is astute, and it captures the engine of the deadlock better than the standard "reductive vs. nonreductive" taxonomy. However, to make it robust enough for a general-interest essay, it requires a specific refinement. The disagreement is not merely about which account of causation is *true* (production vs. difference-making), but about whether the **Exclusion Principle**—the bridge between physical closure and mental inertness—holds across those accounts.

  The impasse you encountered arises because the participants are agreeing to the *premises* of the exclusion argument while disagreeing about the *logic* that connects them. They all accept Physical Causal Closure (roughly). They all deny Epiphenomenalism. The friction occurs at the Exclusion Principle: *If a physical effect has a sufficient physical cause, no distinct mental cause exists.* Whether this principle is true depends entirely on what "cause" and "sufficient" mean in that sentence. Your intuition about variable granularity is not a secondary suspicion; it is the technical mechanism by which the difference-making account attempts to dissolve the Exclusion Principle.

  Here is a diagnosis of the disagreement, anchored in commitments rather than labels, followed by an assessment of what constitutes progress.

  ### Settled vs. Contested: A Map for Fact-Checking

  To satisfy your editorial constraints, we must distinguish the background assumptions from the live wires.

  **What is largely settled (or treated as methodological common ground):**
  1.  **Physical Causal Closure:** Almost all participants treat the causal closure of the physical domain as a working assumption. This is not necessarily because they believe physics is complete, but because denying it opens the door to supernaturalism or vitalism, which most wish to avoid. When your neuroscientist calls the problem a "relic," they are relying on this closure being unproblematic for scientific practice.
  2.  **The Rejection of Systematic Overdetermination:** There is broad agreement that we should not accept that every intentional action is systematically overdetermined (i.e., caused twice, once by the mind and once by the brain, like two shooters firing at once). This is considered metaphysically wasteful.
  3.  **Supervenience:** There is consensus that mental states depend on physical states. There is no mental difference without a physical difference. This is the constraint that makes exclusion plausible: if the mental rides on the physical, and the physical does all the work, what is left for the mental to do?

  **What is genuinely contested:**
  1.  **The Exclusion Principle Itself:** This is the core dispute. Reductive physicalists and eliminativists argue that physical sufficiency *excludes* competing causes. Nonreductive physicalists argue that physical sufficiency is compatible with mental causation because the mental and physical are not competitors in the same sense.
  2.  **The Definition of "Physical":** While often bracketed, this remains a live metaphysical problem (Hempel's Dilemma). If "physical" means "what current physics describes," closure is likely false (quantum indeterminacy, etc.). If it means "what a future completed physics describes," the term is empty until that physics arrives. Participants often slide between these definitions to keep the argument moving.
  3.  **The Nature of Realization:** There is no agreement on what it means for a neural state to "realize" a mental state. Is it identity? Constitution? Functional role? The answer determines whether the mental state is distinct enough to be a cause but connected enough to not be excluded.

  ### The Diagnosis: A Clash of Causal Metrics

  Your hypothesis identifies the split between **causal production** (mechanisms, energy transfer, "oomph") and **causal relevance** (counterfactuals, difference-making, information). This is the correct axis, but the dispute is specifically about whether the Exclusion Principle applies to *both*.

  The exclusion argument works cleanly only if causation is viewed as a "jealous" relation—a limited resource where if the physical cause provides 100% of the sufficiency, there is 0% left for the mental. This aligns with a production view of causation. If the neural firing transfers the energy that moves the arm, and the mental state is not identical to that firing, the mental state appears to be a ghost watching the machine work.

  However, the nonreductive physicalists you interviewed are likely operating with an **interventionist** or **counterfactual** account of causation. On this view, $C$ causes $E$ if, had $C$ not occurred (and relevant conditions held), $E$ would not have occurred. Here, the Exclusion Principle loses its bite. A mental state can be a cause because if the mental state were different (e.g., you didn't *want* water), the effect would be different (you wouldn't *reach*), even if the physical substrate realizing that want is also different.

  The impasse arises because the two sides are using different metrics to measure the same thing. The exclusionist asks, "Where is the energy transfer?" The nonreductivist answers, "Look at the counterfactual dependencies." The exclusionist replies, "Those dependencies are fixed by the physics." The nonreductivist replies, "But the physics only fixes them *because* of the mental organization."

  This is not merely verbal. It is a substantive disagreement about **explanatory granularity**. If you describe the system at the micro-physical level, the mental variables disappear, and closure holds trivially. If you describe the system at the macro-mental level, the physical variables are abstracted away, and mental causation holds trivially. The dispute is about whether the macro-level description captures *real* causal relations or merely summarizes the micro-level ones.

  ### The Variable Granularity Problem

  Your second suspicion regarding variable choice is where the technical philosophy has migrated in the last decade. This is not unrelated to the causation dispute; it is the formalization of it.

  In causal modeling (associated with figures like James Woodward), causation is defined relative to a set of variables. Whether a mental variable counts as a cause depends on whether you are allowed to hold the physical realizing variable fixed while intervening on the mental.
  *   **The Exclusionist Move:** You cannot intervene on the mental without changing the physical (due to supervenience). Therefore, any difference made by the mental is actually made by the physical. The mental variable is redundant.
  *   **The Nonreductivist Move:** You must allow "realization-insensitive" interventions. Because mental states are multiply realizable, you can change the mental state while keeping the *type* of physical state constant, or change the physical realization while keeping the mental state constant. If the outcome tracks the mental state across different physical realizations, the mental state is the robust cause.

  The disagreement here is about **which counterfactuals are legitimate**. The exclusionist insists that legitimate counterfactuals must respect the micro-physical laws strictly. The nonreductivist insists that legitimate counterfactuals must respect the functional organization of the system. This makes the dispute partly about how we individuate systems, not just how the world is. It suggests that "causation" is not a single relation waiting to be found, but a tool we construct to model dependencies at different scales.

  ### Is It Verbal or Substantive?

  It is both, but in a way that prevents dissolution. It is verbal in that if the parties agreed to specify "cause*" (production) and "cause**" (difference-making), they might agree that mental states are not cause* but are cause**. However, it remains substantive because both sides claim their preferred concept captures what matters for **responsibility, agency, and explanation**.

  If mental states are only difference-makers and not producers, does that save agency? The eliminationist says no: "Difference-making is just a shadow of physical production." The nonreductivist says yes: "Production is a bottom-up myth; difference-making is all causation ever was." This is a genuine metaphysical dispute about the structure of reality: is the micro-level ontologically privileged over the macro-level? The exclusionist says yes (fundamentalism). The nonreductivist says no (anti-fundamentalism).

  ### What Counts as Progress?

  Given this diagnosis, a "solution" that proves mental states are causes in the same sense that billiard balls are causes is unlikely. Progress will look different.

  1.  **Formal Results on Variable Selection:** Progress would look like a formal demonstration showing under what conditions macro-variables (mental) carry more causal information than micro-variables (physical). Some work in information theory and causal emergence suggests that macro-descriptions can sometimes be more deterministic than micro-descriptions due to noise cancellation. If this can be rigorously established, it undermines the exclusionist claim that the physical level is always the most causally potent.
  2.  **Dissolving the Exclusion Principle:** Progress may come from showing that the Exclusion Principle is false even on a production account, perhaps by rethinking realization. If realization is not a relation between two distinct events but a constitutive relation (like the relation between a statue and the clay), then exclusion doesn't arise because there aren't two competitors. However, this requires a metaphysical shift that many physicalists resist.
  3.  **Accepting Pluralism:** The most likely progress is a principled reason to accept causal pluralism. If we can show that "cause" is context-dependent—valid for physics in one context, valid for psychology in another—without one reducing to the other, the pressure to solve exclusion vanishes. The goal shifts from "saving mental causation" to "clarifying the domain of psychological explanation."
  4.  **No Progress:** You must also entertain the possibility that the impasse is permanent because it rests on a tension inherent to physicalism itself. Physicalism demands that everything is physical (favoring exclusion) but also that mental concepts are indispensable (favoring nonreduction). If these two demands are logically incompatible, no amount of causal modeling will resolve it.

  ### Recommendation for the Essay

  Your editor's framing ("Have philosophers established mental states are not real causes?") invites a yes/no answer that the field cannot provide. Your diagnosis offers a superior narrative: **The question is ill-posed because it assumes a single metric of causation that applies across all levels of reality.**

  The story is not that philosophers are stuck; it is that the problem forced them to realize that "causation" is not a monolith. The exclusion argument acted as a pressure test, revealing that our intuitive notion of cause splits under load. The neuroscientist sees the mechanism (production); the philosopher sees the dependency (difference-making). They are not disagreeing about the world; they are disagreeing about which map of the world is useful for human purposes.

  For your fact-checking, ensure you distinguish between claims that "mental states are causally efficacious" (contested, depends on definition) and "mental states are causally relevant" (less contested, widely accepted in interventionist frameworks). Do not let the nonreductive physicalists speak as if they have solved the problem; they have merely relocated it to the philosophy of variables. Do not let the exclusionists speak as if epiphenomenalism is a proven fact; it is a conditional conclusion based on specific metaphysical premises about exclusion.

  The impasse you sensed is real, but it is not a failure of philosophy. It is a sign that the causal exclusion argument has done its job: it has forced a clarification of what we mean when we say we do things for reasons. The disagreement is not about whether we act, but about what kind of truth that statement is.
