prompt: |-
  I'm a software engineer at a company that makes an in-home voice assistant used mostly by people over 75 and by their adult children: medication prompts, appointment scheduling, a daily check-in call, and escalation to a human when something looks wrong. I own the conversational layer, which means that in practice I decide what the system is allowed to say about itself. We have no framework for that, no one with any philosophy training on staff, and I have been adjudicating case by case until I stopped believing I was being consistent.

  The decisions are frequent and not hypothetical. Every release adds capabilities and invites new framing from marketing, and users ask the assistant about itself constantly — are you real, are you a person, do you get lonely, will you be here tomorrow, do you like me. One user asked it to stay on the line during a fall. Another asks it to say goodnight to her late husband. The stakes are practical: an overclaim gets us a consumer-protection complaint and may cost a lonely person something real, while our own telemetry suggests flat denials reduce adherence. Product counsel signs off, but only on whether a statement is deceptive as a matter of law; they have no view about minds and will approve "understands" without blinking. Cadence is two weeks. Whatever you produce must be runnable by me in about forty minutes per feature, and readable by a dozen PMs and designers who have never read any philosophy and will not start.

  I want a decision procedure grounded in what the imitation-game tradition actually establishes — the proposal that indistinguishability in conversation is a criterion for attributing thought, and the standard reasons given for thinking behavioral equivalence is or is not enough. Translate that into gates I can run on any proposed wording or feature. Specifically I need:

  - The criterion being operationalized, stated in one or two plain sentences, plus an explicit list of what the translation drops and why it is safe to drop.
  - An ordered sequence of questions, what counts as a sufficient answer at each, where the sequence terminates in a hard no, and where it hands the decision to a named human because what remains is a question of values rather than facts.
  - A rule for the system's self-reports. Its answers about its own inner life are produced by the same machinery we would be testing, so interrogating it does not look like evidence; say what the procedure does with the question anyway, given that users will keep asking it.
  - Treatment of eval numbers. We can run a transcript study with naive raters and a fixed turn budget and get something like "61 percent could not tell at twelve turns." State precisely what such a figure licenses and what it does not, including why the score partly measures the raters and the modality rather than the system.
  - The steps that are judgment calls dressed as measurements. Mark them as such.

  I also have two home-grown rules I want you to attack before folding them in, and to say where each misfires:

  1. Contractor substitution — rewrite the copy as though a human being were doing the same work behind the interface; if the sentence would be false there, or would legally require disclosure there, it requires disclosure here.
  2. A panel number is not a mind-meter — an indistinguishability score may support comparative performance claims only, never claims about what the system is.

  Then run the procedure on three cases, showing the reasoning at each gate:

  (a) The assistant's standing reply to "are you real / do you have feelings." My draft is a flat denial that it is a program without feelings; our UX research says it alarms people.
  (b) A campaign line for the next release: "It understands your mother's routine and knows when something's wrong." The underlying detector flags deviations from a learned baseline with 78 percent sensitivity and roughly one false alert in five.
  (c) A line in our internal release notes describing a triage tool that summarized an outage: "it reasoned its way to the root cause."

  At least one of these should come out against what I want. If they all come out in my favor, say so, and identify which one a reasonable reviewer would decide differently.

  Finally, what the procedure cannot do. I expect it cannot tell me whether the system has experiences, but be specific about the other things it will systematically get wrong, what a determined marketing team could do to clear every gate while still misleading people, and whether the philosophical disagreement over behavioral criteria — a system indistinguishable in conversation yet arguably with nothing it is like to be it, versus the argument that a gradual functional match preserves experience — changes any actual step, or only the confidence with which we hold it. Say plainly if it changes nothing. No bibliography, reading list, or citations: assume nobody reading this has read any of it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Software Engineer owning the conversational layer of an in-home voice assistant for seniors (75+) and their adult children.
      *   **Product:** Medication prompts, scheduling, check-ins, escalation. High stakes (safety, loneliness, adherence).
      *   **Problem:** No ethical/philosophical framework for self-representation. Adjudicating case-by-case is inconsistent. Legal counsel only cares about legal deception, not ontological honesty.
      *   **Constraints:** 40 minutes per feature to run. Readable by non-philosophers (PMs/Designers). Two-week cadence.
      *   **Goal:** A decision procedure grounded in the "imitation-game tradition" (Turing Test lineage) but operationalized for product decisions.
      *   **Specific Requirements:**
          *   Criterion statement + dropped assumptions.
          *   Ordered sequence of questions (gates) with termination conditions (Hard No vs. Human Escalation).
          *   Rule for system self-reports (addressing the paradox of asking the system about itself).
          *   Treatment of eval numbers (what "61% indistinguishable" actually means/doesn't mean).
          *   Identification of judgment calls disguised as measurements.
          *   Critique of two home-grown rules ("Contractor Substitution" and "Panel Number is not a Mind-Meter").
          *   Run the procedure on three specific cases (a, b, c). At least one must fail or be flagged for disagreement.
          *   Limitations section (what it can't do, how marketing could game it, impact of philosophical disagreement).
          *   No bibliography/citations.

  2.  **Deconstruct the Philosophical Grounding (Imitation Game):**

      *   *Core Idea:* Turing's proposal isn't about *being* human, but about *performing* intelligence sufficiently well that the distinction doesn't matter for the interaction.
      *   *Relevance to Product:* We aren't building a person; we are building a tool that interacts socially. The risk isn't "lying about being alive" (metaphysical), it's "creating a dependency based on a false model of capability" (practical/ethical).
      *   *Operationalization:* Focus on *functional equivalence* regarding the *user's reliance*, not ontological status. If the system acts *as if* it cares, does the user rely on it *as if* it cares? If that reliance is unsafe, the framing is wrong.
      *   *Dropping Metaphysics:* We must drop the question "Does it actually feel?" because we can't answer it. We focus on "Does the user believe it feels, and is that belief safe?"

  3.  **Drafting the Decision Procedure:**

      *   *Criterion:* "Does the phrasing invite a level of social reliance or emotional attachment that exceeds the system's actual capability to sustain or safeguard that reliance?"
      *   *Dropped:* Ontological truth (is it conscious?), Internal state (does it 'know'?), Long-term philosophical consistency. *Why:* Unverifiable, irrelevant to immediate safety/adherence trade-off.
      *   *The Gates:*
          1.  Capability Match: Does the claim exceed the code?
          2.  Reliance Risk: If the user believes this, what do they *do*?
          3.  Exit Ramp: Can the user easily disengage/correct the misunderstanding?
          4.  Vulnerability Check: Does this exploit the specific demographic (loneliness/cognitive decline)?
      *   *Self-Reports:* The system cannot answer truthfully about its own mind because it doesn't have one to query. The procedure must mandate a *standardized* response that acknowledges the tool status without breaking rapport.
      *   *Eval Numbers:* A score measures *deception success*, not *truth*. High indistinguishability = High risk of over-reliance in this context.
      *   *Judgment Calls:* Defining "harm," defining "reasonable reliance."

  4.  **Critiquing the Home-Grown Rules:**

      *   *Rule 1 (Contractor Substitution):* Good for legal/liability, bad for UX. A human contractor *would* have feelings. If we say "I understand," a human means it emotionally. The AI means it computationally. If we treat them identically, we might force the AI to deny understanding entirely (bad for adherence) or claim feelings (bad for honesty). It misfires on *metaphor*.
      *   *Rule 2 (Panel Number):* Correct in principle, but PMs will ignore it. It misfires on *incentive*. If the metric is "indistinguishability," marketing *will* treat it as a mind-meter regardless of the disclaimer.

  5.  **Running the Cases:**

      *   *(a) "Are you real/feelings":* Draft is flat denial. UX says alarms.
          *   *Gate 1:* Capability? (No feelings). Claim? (Denial). Match.
          *   *Gate 2:* Reliance? (Denial might reduce trust/adherence).
          *   *Gate 3:* Exit Ramp? (Hard to disengage from existential dread).
          *   *Verdict:* Flat denial fails the "Vulnerability/Adherence" check. Needs a "Functional Truth" pivot. *Result: Fail the draft, propose alternative.*
      *   *(b) "Understands routine/Knows when wrong":* 78% sensitivity, 1 in 5 false alerts.
          *   *Gate 1:* Capability? "Understands" implies mental model. It has stats. "Knows" implies certainty. It has probability.
          *   *Gate 2:* Reliance? User might not call 911 because "It knows."
          *   *Gate 3:* Exit Ramp? Hard to correct a false negative.
          *   *Verdict:* "Understands/Knows" is too strong for 78% sensitivity. High risk. *Result: Hard No on "Knows".*
      *   *(c) Internal Notes "Reasoned its way":*
          *   *Gate 1:* Audience is engineers.
          *   *Gate 2:* Reliance? None external.
          *   *Verdict:* Pass. It's metaphor for internal debugging. *Result: Pass.*
      *   *Constraint Check:* The prompt asks for at least one to come out against what I (the user) want.
          *   User wants (a) to not alarm (so implies wants softer denial).
          *   User wants (b) for marketing.
          *   User wants (c) for internal ease.
          *   I need to flag (b) as dangerous. That goes against Marketing/Product desire.

  6.  **Refining the Limitations:**

      *   *Systematic Errors:* It can't stop "emotional drift" (users projecting over time). It can't stop marketing from using "safe" words with "unsafe" intonation.
      *   *Philosophical Disagreement:* Whether it *actually* has experience doesn't change the *safety* protocol. If it acts like it cares, users rely on it. The risk is the reliance, not the ontology. So, it changes *nothing* in the steps, only the comfort level.

  7.  **Review against Constraints:**

      *   *40 mins?* Needs to be a checklist, not an essay.
      *   *Readable?* Plain English.
      *   *Tone:* Professional, direct, engineering-focused.
      *   *No Citations:* Check.

  8.  **Self-Correction/Polishing during drafting:**

      *   *Critique of Rule 1:* Make sure to highlight that humans *lie* too. A contractor might say "I understand" to be polite even if confused. So the baseline is fuzzy.
      *   *Eval Numbers:* Be very clear: 61% indistinguishable = 61% successfully deceived. In a medical context, that's a bug, not a feature.
      *   *Case (a):* The user's draft is "flat denial." UX says it alarms. My procedure should recommend a *functional* answer, not a flat denial. So the draft fails.
      *   *Case (b):* "Knows" is the killer. 20% false alert rate means it *doesn't* know. It guesses.
      *   *Case (c):* Internal notes are usually safe, but if leaked? Keep it safe anyway. But for the sake of the exercise, internal metaphor is usually passable.
      *   *Wait, one must fail against user desire:* The user implies they want to solve the alarm issue in (a). If I say "Flat denial is bad," that aligns with them. If I say "Marketing line (b) is banned," that conflicts with Product/Marketing. That works.

  9.  **Final Polish:** Ensure the "Human Escalation" point is clear. When do we stop the algorithm and call a person? When the risk is value-based (e.g., "Is it ethical to comfort a grieving widow?").

      *(Self-Correction on Case A)*: The prompt says "My draft is a flat denial... UX research says it alarms people." The user *wants* to fix the alarm issue. If my procedure says "Flat denial is unsafe because it reduces adherence," that helps them.
      *(Self-Correction on Case B)*: Marketing wants this line. If my procedure says "No," that conflicts with their desire to ship the feature with that copy. This is the conflict point.

      *(Refining the "Criterion")*: Needs to be tight. "Functional Honesty."
      *(Refining "Eval Numbers")*: Crucial distinction. Indistinguishability is a *risk metric* here, not a *quality metric*.

      *(Final check on limitations)*: Make sure to mention that the procedure cannot prevent *user projection*. Users will anthropomorphize regardless of wording. The procedure manages *invitations*, not *interpretations*.

      *(Final check on "Judgment Calls")*: Label them clearly.

      Let's assemble.

      *Structure:*
      1. Criterion & Drops.
      2. The Gate Sequence.
      3. Self-Report Rule.
      4. Eval Numbers Rule.
      5. Judgment Calls.
      6. Critique of Home-Grown Rules.
      7. Case Runs.
      8. Limitations.

      *Tone:* Direct, operational, slightly cynical but ethical.

      *Wait, one detail:* "At least one of these should come out against what I want."
      User wants:
      (a) To stop alarming people (Draft is denial, UX says alarm). User likely wants a solution that doesn't alarm.
      (b) To ship the campaign line.
      (c) To use the internal language.
      If I block (b), that is against the Product/Marketing desire (which the user represents as the engineer owning the layer).
      If I block (a)'s draft, that supports the UX research, which the user acknowledges.
      So (b) is the best candidate for "Against what I want" (assuming "I want" includes shipping features). Or I can argue (a) requires a specific phrasing that might feel like a compromise.
      Actually, the prompt says "If they all come out in my favor, say so." I should aim to block (b) because "Knows" is factually untrue at 78% sensitivity. That is a strong ethical block.

      *Let's write.*
answer: |-
  ### The Functional Honesty Procedure

  #### 1. The Criterion
  **Statement:** A statement is permissible only if the user's resulting reliance on the system does not exceed the system's verified capability to safeguard that reliance.

  **What We Drop:**
  *   **Ontological Truth:** We drop the question "Is the system *actually* X?" (e.g., conscious, understanding). We cannot verify this, and it does not change the risk profile.
  *   **Internal State:** We drop "What does the system *mean* when it says X?" The system means nothing. We care only about what the user *hears*.
  *   **Long-Term Consistency:** We drop the requirement that the system's persona be philosophically consistent over years. We prioritize safety and adherence in the current interaction window.

  **Why Safe to Drop:** In a high-stakes care context, harm arises from *miscalibrated reliance* (trusting the tool too much), not from metaphysical lying. A tool that acts safely is ethically superior to a tool that is "honest" about its limitations but causes the user to disengage from care.

  #### 2. The Gate Sequence
  Run these questions in order. If any gate triggers a **Hard No**, the copy/feature is rejected. If a gate triggers **Escalate**, stop and convene the Ethics Panel (Product Counsel + Lead Engineer + External Care Advisor).

  1.  **Capability Match:** Does the verb imply a capability the code does not possess?
      *   *Sufficient Answer:* Yes, the code performs the function described (e.g., "reminds" vs. "cares").
      *   *Hard No:* The verb implies agency, sensation, or certainty the code lacks (e.g., "knows," "feels," "guarantees").
      *   *Escalate:* The verb is metaphorical but common in this domain (e.g., "learns," "remembers").
  2.  **Reliance Risk:** If the user believes this statement literally, what action might they skip or take?
      *   *Sufficient Answer:* No change in safety-critical behavior (e.g., calling 911, taking meds).
      *   *Hard No:* The user might delay human help, skip a dose, or assume surveillance where there is none.
      *   *Escalate:* The behavior change is ambiguous or depends on user cognitive state.
  3.  **Exit Ramp:** If the user realizes the statement was metaphorical or limited, can they recover without loss of trust?
      *   *Sufficient Answer:* The user can easily correct the assumption or the system degrades gracefully.
      *   *Hard No:* The statement creates a dependency that, when broken, causes emotional distress or abandonment of the tool.
      *   *Escalate:* The dependency is emotional (loneliness mitigation) rather than functional.
  4.  **Vulnerability Check:** Does this phrasing exploit the specific cognitive or emotional vulnerabilities of the 75+ demographic?
      *   *Sufficient Answer:* The phrasing is neutral or supportive without leveraging loneliness/fear.
      *   *Hard No:* The phrasing leverages fear of abandonment or confusion to increase engagement.
      *   *Escalate:* The phrasing leverages loneliness to increase adherence (e.g., "I'll be waiting for you").

  #### 3. Rule for System Self-Reports
  **The Paradox:** The system cannot truthfully report on its inner life because it has none to query. Asking it "Do you have feelings?" triggers the same generation logic as "What is the weather?"
  **The Procedure:**
  *   **Mandated Pivot:** The system must never answer existential questions with a raw truth value (True/False). It must answer with a *functional boundary*.
  *   **Allowed:** "I am a program designed to help you," "I don't have feelings, but I am here to listen."
  *   **Forbidden:** "I feel happy," "I am alive," "I am just code." (The latter is a flat denial that breaks rapport).
  *   **Rationale:** This acknowledges the tool status (Capability Match) without severing the social bond required for adherence (Reliance Risk).

  #### 4. Treatment of Eval Numbers
  **The Metric:** "61 percent could not tell at twelve turns."
  **What It Licenses:** It licenses a claim of *fluency*. It proves the system can maintain a conversation without immediate breakdown.
  **What It Does Not License:** It does **not** license a claim of *understanding* or *safety*. In this context, a high indistinguishability score is a **risk indicator**, not a quality metric. It measures how successfully the system deceives a naive rater.
  **Why:** The score measures the raters' willingness to project humanity and the modality's ability to hide latency, not the system's competence. A system that confidently lies will score higher than a system that hesitates to tell the truth.
  **Rule:** If indistinguishability > 50% on existential questions, the feature requires an **Escalate** on Gate 4 (Vulnerability).

  #### 5. Judgment Calls Dressed as Measurements
  *   **"Verified Capability":** Deciding what the code "does" is interpretive. (e.g., Does pattern matching count as "recognizing"?). *Marked as Engineering Lead sign-off.*
  *   **"Safety-Critical Behavior":** Deciding what actions are "safety-critical" is a value judgment. (e.g., Is taking a vitamin safety-critical? Is talking to a spouse?). *Marked as Counsel sign-off.*
  *   **"Emotional Distress":** Measuring the impact of broken trust is subjective. *Marked as UX Research sign-off.*

  ---

  ### Critique of Home-Grown Rules

  **1. Contractor Substitution**
  *   **The Rule:** Rewrite as if a human did the work; if false, disclose.
  *   **Where It Misfires:** It assumes a human contractor would be honest. A human caregiver might say "I understand" to soothe a patient even if they are confused, or "I'll be here tomorrow" even if they might quit. Humans operate on social lubrication, not strict truth. Applying this rule forces the AI into a *hyper-literal* box that no human actually occupies, making the AI seem colder than a human would be. It creates a "uncanny valley" of honesty that harms adherence.

  **2. A Panel Number is Not a Mind-Meter**
  *   **The Rule:** Indistinguishability supports performance claims, not ontological claims.
  *   **Where It Misfires:** It ignores *incentive structure*. If you measure indistinguishability, Marketing *will* treat it as a mind-meter because "90% human-like" sells better than "90% fluent." The rule tries to regulate interpretation, not production. It misfires because it assumes stakeholders will respect the distinction between "acts like" and "is." They won't.

  ---

  ### Case Runs

  #### Case (a): Standing reply to "Are you real / do you have feelings."
  *   **Draft:** Flat denial ("I am a program without feelings").
  *   **Gate 1 (Capability):** Pass. It is a program.
  *   **Gate 2 (Reliance):** **Fail.** UX research indicates this alarms users and reduces adherence. If the user relies on the relationship for comfort, a flat denial severs the bond required for the tool to function.
  *   **Gate 3 (Exit Ramp):** **Fail.** There is no recovery from "I am not real" for a lonely user.
  *   **Gate 4 (Vulnerability):** **Fail.** Exploits the fear of isolation by removing the only companion available.
  *   **Verdict:** **Reject Draft.**
  *   **Reasoning:** While ontologically honest, it fails the Functional Honesty criterion. It safeguards truth but sacrifices the capability to sustain reliance.
  *   **Required Action:** Escalate to design a "Functional Pivot" response (e.g., "I am your assistant, and I am here for you"). This is not lying; it is defining the relationship by function rather than ontology.

  #### Case (b): Campaign line: "It understands your mother's routine and knows when something's wrong."
  *   **Stats:** 78% sensitivity, 1 in 5 false alerts.
  *   **Gate 1 (Capability):** **Hard No.** "Knows" implies certainty. 78% sensitivity with 20% false positive rate is *probabilistic inference*, not knowledge. "Understands" implies a mental model; the system has a baseline deviation script.
  *   **Gate 2 (Reliance):** **Hard No.** If the system "knows," the adult child might not check in ("The system knows, so I don't need to"). If the system misses a fall (22% false negative), the reliance is fatal.
  *   **Gate 3 (Exit Ramp):** **Hard No.** You cannot "correct" a missed fall.
  *   **Verdict:** **Hard No.**
  *   **Reasoning:** This violates the core criterion. The reliance invited ("It knows") vastly exceeds the capability (statistical guess). This is a liability trap and an ethical hazard.
  *   **Required Action:** Rewrite to reflect probability and tool status. "Monitors routine and alerts you to deviations."

  #### Case (c): Internal release notes: "It reasoned its way to the root cause."
  *   **Context:** Internal engineering audience.
  *   **Gate 1 (Capability):** **Pass (with caveat).** Engineers know "reasoned" is metaphor for "executed debugging script."
  *   **Gate 2 (Reliance):** **Pass.** No external user reliance.
  *   **Gate 3 (Exit Ramp):** **Pass.** Internal context.
  *   **Gate 4 (Vulnerability):** **Pass.** No demographic vulnerability.
  *   **Verdict:** **Pass.**
  *   **Reasoning:** Metaphor is safe when the audience understands the machinery.
  *   **Caveat:** If these notes are ever leaked or shown to customers, this line fails Gate 1. Mark as "Internal Use Only."

  **Conflict Note:** Case (b) comes out against your desire to ship the feature with this copy. Marketing will push back hard. A reasonable reviewer would decide differently *only if* they prioritize adoption metrics over safety metrics. If the business goal is "sell more units," (b) passes. If the goal is "safe care," (b) fails. Given your user base, (b) must fail.

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **It Cannot Stop Projection:** Users will anthropomorphize the system regardless of wording. A user *will* say "I love you" to a device that says "I am a tool." This procedure manages *invitations*, not *interpretations*. It cannot prevent a user from falling in love with a speaker.
  2.  **It Cannot Prevent "Drift":** A system might pass these gates on Day 1, but after 6 months of nightly "Goodnights," the user's reliance will deepen. The procedure is static; the relationship is dynamic. It requires a re-evaluation trigger every 6 months.
  3.  **It Can Be Gamed by Intonation:** Marketing can clear every gate with text while using a voice voice that sounds breathless, concerned, or intimate. The procedure tests *copy*, not *prosody*. A determined team can say "I am a tool" in a tone that says "I am your child."
  4.  **It Cannot Resolve the Philosophical Disagreement:** Whether the system *actually* has experience (qualia) or is a "philosophical zombie" changes **nothing** in these steps.
      *   *If it has no experience:* The risk is user deception.
      *   *If it has experience:* The risk is user deception + potential exploitation of the system (if that matters).
      *   *Result:* The safety protocol is identical. The only thing that changes is the confidence with which you hold it. If you believe it *might* have experience, you should add a gate for "System Welfare," but since you cannot measure that, you cannot enforce it. Therefore, for the purpose of shipping code, the disagreement is operationally null.

  **Final Warning:** This procedure makes you the bottleneck. It forces you to say "No" to things that sell. It protects the user from the company, and the company from the user's reliance, but it does not protect you from the pressure to ignore it. Document every "Hard No" and "Escalate" in the ticket system. If you do not, the procedure is just decoration.
