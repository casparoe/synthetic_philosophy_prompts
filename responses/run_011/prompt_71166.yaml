  EVERETTIAN: Look at the readout. Six hundred and sixty-eight down, three hundred and thirty-two up. It's almost exactly two-to-one.

  SCEPTIC: It looks like frequency. That's the problem. It looks like something happened less often than something else. But in your ontology, both happened. Every single time. The machine clicked, the spin went up, and a version of you saw it. The machine clicked, the spin went down, and a version of you saw that too. A thousand versions of you saw up. Two thousand versions of you saw down. So why are we staring at this paper like it's evidence of anything other than universal occurrence?

  EVERETTIAN: Because the versions aren't counted equally. Before we started this run, I knew the state was prepared with amplitudes $1/\sqrt{3}$ and $\sqrt{2/3}$. I knew the weights were one-third and two-thirds. If you'd asked me to bet on the outcome of the first measurement, I would have put my money on down.

  SCEPTIC: Why? If both outcomes are actual, what are you betting on? You win in one branch and lose in the other. In what sense did you make a rational choice?

  EVERETTIAN: In the sense that I care more about the successor who sees the higher-weight outcome. The decision-theoretic program derives this. It starts with symmetry. If I prepare a state with equal amplitudes, say $1/\sqrt{2}$ and $1/\sqrt{2}$, the physics is symmetric between the outcomes. There's no physical reason for me to prefer one successor over the other. So I must assign them equal weight in my deliberation.

  SCEPTIC: You say "must." That's a normative claim. You're saying I *ought* to care equally. But why? Maybe I care about the number of successors. If the wavefunction splits, maybe I should want to maximize the number of happy successors.

  EVERETTIAN: You can't count successors. That's the fine-graining point. The branch structure isn't discrete like beads on a string. It's defined by decoherence, which depends on how you describe the environment. I could describe the "up" outcome as a single branch, or I could include the state of a nearby air molecule and describe it as two branches—up-and-molecule-left, up-and-molecule-right. If I do that, I've doubled the count of up-branches without changing the physics. If your rationality depended on branch count, your bets would change based on how finely I grain the description. That's absurd. The only stable quantity is the squared amplitude—the measure.

  SCEPTIC: All right. I'll concede that branch counting is ill-defined. The measure is the only robust number available. But you've just shifted the problem. You've shown that I can't count branches. You haven't shown why I should care about them in proportion to their measure. You've built the Born rule into the indifference principle. You say I shouldn't care about a branching that leaves rewards untouched, but that assumes my care is distributed over the measure rather than the existence of the successors. You're deriving probability from a principle that already assumes probability is about measure.

  EVERETTIAN: It's not assuming probability. It's assuming rationality. If I know the physical structure is invariant under a certain transformation, my preferences should be too. But let's go deeper. You say probability has no subject matter here because everything happens. But consider the moment after the measurement interacts with the device but before I look at the readout. The branching has occurred. The world has split. But *I* don't know which branch I'm on.

  SCEPTIC: Indexical uncertainty. You're saying you're ignorant of your location in the multiverse.

  EVERETTIAN: Exactly. There is a genuine interval where I know the global state perfectly, but I don't know which successor I will experience being. That uncertainty behaves exactly like classical chance. I should assign credence to being on the down-branch proportional to its weight.

  SCEPTIC: Here's where I stop following you. In a classical chance setup, only one outcome becomes real. Here, both are equally real. My successors are both sitting there, reading the result. If I say "I don't know which one I am," I'm pretending that one of them is the *real* me and the other is a fake. But they're both me. If existence is guaranteed for both, what work is the uncertainty doing? It's just a feeling. You're trying to recover the *normativity* of probability—the reason I shouldn't bet on the one-third outcome—from a metaphysics that guarantees the one-third outcome happens.

  EVERETTIAN: It's not just a feeling. It's about how I structure my preferences across the multiverse. If I violate the Born rule, I make decisions that leave me vulnerable to a Dutch book across my successors. I'm guaranteeing that my future selves, weighted by their measure, are worse off.

  SCEPTIC: But "worse off" implies that the high-measure successors matter more. You keep saying "weighted by their measure." I would bet on the two-thirds outcome, sure. If I don't, I'll look foolish in the majority of branches—by measure. But that's pragmatism, not truth. You've shown that acting *as if* the Born rule is true is rational. You haven't shown that there is any chance involved. You've replaced "what will happen" with "what most of me will see," but you define "most" using the very weights you're trying to justify.

  EVERETTIAN: I define "most" by the only metric that survives fine-graining. If you reject that, you have no metric at all. You're left with nothing.

  SCEPTIC: I'm left with certainty. I know everything that will happen. The universe will contain versions of me seeing up and versions seeing down. The frequency on this paper—this two-to-one split—is just a fact about the distribution of those versions. It's not evidence of a propensity. It's just geometry.

  EVERETTIAN: Then explain why you wouldn't bet on up. If it's just geometry, and both happen, why not bet on the one-third side?

  SCEPTIC: Because I'm a creature who lives in a branch. I want to be right in the branch I occupy. But I admit—here's my concession—I admit I don't have a better rule for betting than you do. I'll use the Born rule. I just deny that it tells me about chance. It tells me about measure. You want to say measure *is* chance. I say measure is just size.

  EVERETTIAN: And I say if you treat size correctly in your decisions, you've recovered everything chance ever did for us. The uncertainty is real because *I* am not the whole multiverse. I'm a stage in a process.

  SCEPTIC: But you are all of them. That's the theory.

  EVERETTIAN: Not from inside.

  SCEPTIC: Then the disagreement isn't about the math. It's about whether "I" refers to the whole wavefunction or the thread within it.

  EVERETTIAN: It's about whether you think rationality requires a single future to latch onto.

  SCEPTIC: I think it requires the possibility of being wrong. In your world, I'm never wrong. I just end up in a low-measure branch.

  EVERETTIAN: Which is exactly what probability always meant. We just finally admitted what the "we" is.

  SCEPTIC: Or we've admitted that we don't know what probability is anymore.

  EVERETTIAN: Look at the data. Two-to-one.

  SCEPTIC: I see the numbers. I just don't see the chance.

  EVERETTIAN: Then you're seeing less than half the picture.

  SCEPTIC: And you're seeing too many worlds to count.
