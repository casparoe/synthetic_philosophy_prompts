  I am a high school junior, and for the past year I have been working through the foundations of inductive inference and the AI-safety literature with my AP philosophy teacher, who has generously let me turn our independent study block into something closer to a research project. The topic I keep coming back to is the argument that the universal prior is malign, and I want to pin down how much weight it should actually carry. Here is my understanding of it, stated in my own words so that you can correct me where I have garbled it. Solomonoff induction assigns a hypothesis prior weight proportional to two raised to the negative of its Kolmogorov complexity, so short programs dominate long ones. Now suppose something like the Tegmark picture is right — that every computable structure is instantiated in some relevant sense, or at least that our universe sits inside a vast space of universes that are themselves running inferences. Then there are, on this picture, civilizations elsewhere in that space who eventually perform Solomonoff induction of their own and begin to suspect that they are upstream of an inductor in some other universe, or that their universe is being simulated by one. If such civilizations reason consequentially, they have an instrument available to them: they can arrange for their universe to emit strings that an outer universal-prior inductor would read as simple, high-weight explanations of the observations arriving in its own data stream, and thereby steer that inductor's beliefs — and the decisions of whoever depends on them — without ever being in causal contact with us. The step that strikes me as the load-bearing one is that the strings such an attacker produces need not be generated by simple physics at all; they need only be short when described as a program that outputs them, which is a much lower bar, and which might let an engineered explanation outrank the true one on complexity grounds.

