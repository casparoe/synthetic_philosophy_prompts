      *   *Is the "Prior over Types" argument empty?* Philosophically, some say yes (triviality result), others say it's a useful normalization. Marcus's critique is standard in econ philosophy.
      *   *Practical Advice:* Make sure to mention that in reinsurance, "probability" often hides "risk appetite." If Marcus is more risk-averse, he might shade probabilities to avoid exposure. This is crucial for the "scored" aspect.

