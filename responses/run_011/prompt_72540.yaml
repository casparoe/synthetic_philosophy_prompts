  PROCEEDINGS OF THE SOCIETY FOR PSYCHICAL RESEARCH. VOL. X. PART XXIV.

  **REPORT OF THE COMMITTEE ON THE CENSUS OF HALLUCINATIONS**

  The Committee, having concluded the collection of seventeen thousand returns, wherein one thousand six hundred and eighty-four respondents affirmed a vivid impression of an absent person, now turns to the arithmetic of coincidence. It is the duty of the Society to approach these questions without prejudice or prepossession of any kind, accepting neither the supernatural nor the material as a priori truths. We must therefore determine whether the clustering of such impressions about the moment of death exceeds the expectation of chance.

  Assuming an average acquaintance of one hundred souls per percipient, and a annual mortality of twenty per thousand, the probability of a death occurring within any twelve-hour window is 1 in 365. Among the 1,684 affirmative cases, the doctrine of chances dictates an expectation of 4.6 coincidences. We have received 312 claims of such coincidence. The excess is substantial. Yet significance is not evidence until the instrument is purified of error. To this end, the Committee has drafted the following Schedule of Questions, to be applied as strict exclusions to the raw data.

  **SCHEDULE OF EXCLUSIONS**

  I. **Corroboration.** The impression must be verified by a second witness present in the same room, or by a second witness not in the house who received a contemporaneous telegram from the percipient. Cases lacking dual testimony are rejected.

  II. **Prior Knowledge.** The percipient must certify they have not read any treatise on psychical phenomena, nor heard lectures upon the same. Any familiarity with the hypothesis invalidates the observation.

  III. **Physiological State.** The percipient must not be in mourning, nor fatigued, nor feverish, nor under the influence of alcohol or opium. Grief is a known generator of phantasmagoria.

  IV. **Prior Acquaintance.** The agent (the person seen) must not have been known to the percipient for more than one year. Familiarity breeds expectation; expectation breeds hallucination.

  V. **Interval of Death.** The agent must have died within twelve hours of the impression. If the death occurred fourteen hours prior, the impression is deemed retrospective imagination; if fourteen hours subsequent, it is anxiety.

  VI. **Conviction.** The percipient must not have become convinced by the experience that survival is proven. To draw a conclusion is to admit bias; any percipient who claims the event was meaningful is excluded.*

  VII. **Replication.** Regarding physical phenomena submitted alongside verbal testimony: the Committee has, for the sake of rigour, reproduced every phenomenon submitted to it using conjuring apparatus. As the effects were replicated without mediumistic aid, no such case may be counted as evidence of supernormal agency.

  Applying these safeguards, individually reasonable and collectively necessary, the Committee finds the eligible sample reduced to zero. The 312 coincidences are eliminated: 200 for prior acquaintance, 50 for mourning, 40 for lack of corroboration, 22 for conviction, and the remainder for physiological variance. The instrument has functioned precisely as designed.

  **PROPOSAL FOR FUTURE ENQUIRY**

  The null result indicates not that the phenomenon is absent, but that the coincidences required are too rare to be captured by passive observation. What the enquiry requires is not marvels but coincidences; and coincidences may be manufactured. The Committee proposes a subscription to secure a supply of *decessus* at stated hours among persons previously unacquainted with the percipients, distributed across the parishes so as to lift the coincidence rate to significance.

  It has been objected that a death may be brought forward by the withdrawal of a nurse to facilitate the scheduled hour. The Committee sets this objection aside on administrative grounds: the rotation of nursing staff must align with the Society's ledger, and any disruption to hospital scheduling would invalidate the time-stamp. To remain without prejudice or prepossession of any kind, we must not favour natural death over arranged, provided the hour is exact.

  ______________________
  * The Chairman discloses that he was himself the percipient in a single case, registered under File 892. He saw a colleague in his study at 11:00 PM; the colleague died at 11:15 PM. The entry is excluded under Rule VI, as the Chairman subsequently recorded in his diary that the event confirmed his hypothesis.
