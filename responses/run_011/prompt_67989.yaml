answer: |-
  ### Specifications for a Theory of Concept Induction: The Bongard Desiderata

  The following document outlines the necessary conditions for any theory purporting to explain concept induction via Bongard problems. The dual purpose is to account for human cognitive performance (one-shot, rapid, no feedback) and to serve as a design brief for a general artificial system. Where these aims conflict, **explanatory adequacy for the human solver is privileged**. A system that solves the puzzles but requires thousands of training examples or per-problem parameter tuning fails to capture the phenomenon of *insight* which the puzzles were designed to probe. The specification must therefore describe a mechanism capable of generalisation from minimal data without external supervision.

  #### I. The Desiderata

  **1. Intentionality (Correctness vs. Consistency)**
  *   **Motivation:** A logical rule that separates the sets is necessary but insufficient. Infinite rules can separate any finite set of figures. The theory must explain why one rule is *correct* (matching the designer's intent) while others, though logically valid, are rejected as 'clever' or 'accidental'.
  *   **Illustration:**
      *   *Left:* Six triangles of varying sizes.
      *   *Right:* Six squares of varying sizes.
      *   *Valid Rule A:* "Left contains triangles; Right contains quadrilaterals."
      *   *Valid Rule B:* "Left contains shapes with fewer than 4 vertices; Right contains shapes with 4 vertices."
      *   *Valid Rule C (Spurious):* "Left contains shapes that can be drawn without lifting the pen (true for all); Right contains shapes where the sum of internal angles is divisible by 90."
      *   *Requirement:* The theory must possess a metric of *simplicity* or *naturalness* that ranks Rule A above Rule C, despite both being logically consistent with the data. It must distinguish the *signal* from the *noise* of logical possibility.

  **2. Invariance (Incidental Variation)**
  *   **Motivation:** Human solvers instantly dismiss irrelevant features (position, scale, rotation, line thickness) unless those features constitute the rule. A statistical account that treats all pixel differences as equally probable will fail to generalise.
  *   **Illustration:**
      *   *Left:* Six circles, scattered randomly, some large, some small.
      *   *Right:* Six squares, scattered randomly, some large, some small.
      *   *Requirement:* The theory must factorise the representation of the image into 'content' and 'style'. It must demonstrate invariance to affine transformations and spatial arrangement when the concept is 'shape', yet remain sensitive to them when the concept is 'orientation' or 'size'. This invariance cannot be hard-coded per problem; it must be emergent from the representational structure.

  **3. Directionality (Asymmetry)**
  *   **Motivation:** Solutions are naturally stated as "Left is X, Right is not-X" rather than the inverse, even when logically equivalent. Some concepts are cognitively primitive (positive) while their complements are derived (negative).
  *   **Illustration:**
      *   *Left:* Six figures containing a small dot inside a closed loop.
      *   *Right:* Six figures containing a small dot outside a closed loop.
      *   *Requirement:* The theory must account for the asymmetry between 'inside' and 'outside'. A solution stating "Right side lacks containment" is judged inferior to "Left side possesses containment". The hypothesis space must encode a bias towards positive assertions of presence over absence, reflecting a cognitive prior on objecthood and relation.

  **4. Recursion (Level Shifting)**
  *   **Motivation:** Solvers often begin with low-level features (lines, angles). If no pattern emerges, they shift to higher-level abstractions (topology, count, semantic identity). A flat search over a single level of description cannot model this progression.
  *   **Illustration:**
      *   *Left:* Six arrows pointing upwards.
      *   *Right:* Six arrows pointing downwards.
      *   *Initial Failure:* A rule based on 'line slope' fails if one panel is rotated slightly.
      *   *Success:* The solver shifts to 'vector direction' or 'semantic pointing'.
      *   *Requirement:* The theory must allow for hierarchical description. It must specify the trigger conditions under which a solver abandons a geometric description for a topological or semantic one. The transition cost between levels must be quantifiable.

  **5. Synonymy (Linguistic Equivalence)**
  *   **Motivation:** Different verbalisations can denote the same conceptual separation. A theory tied to specific syntax will fail to recognise equivalent solutions.
  *   **Illustration:**
      *   *Left:* Six three-sided polygons.
      *   *Right:* Six four-sided polygons.
      *   *Solution A:* "Triangles vs Squares."
      *   *Solution B:* "3-gons vs 4-gons."
      *   *Requirement:* The theory must separate the *concept* from its *label*. Equivalence classes of solutions must be identifiable despite syntactic variance. This implies an underlying semantic representation distinct from the natural language output.

  **6. Openness (No Fixed Vocabulary)**
  *   **Motivation:** Bongard problems rely on concepts drawn from geometry, physics, topology, and everyday semantics (e.g., 'gravity', 'stacking', 'occlusion'). Pre-defining a vocabulary of predicates begs the question, as it assumes the solution space is known in advance.
  *   **Illustration:**
      *   *Left:* Six Roman numerals (I, V, X).
      *   *Right:* Six Arabic numerals (1, 5, 10).
      *   *Requirement:* The system cannot rely on a pre-compiled dictionary of 'Roman Numeral'. It must construct this concept from the visual properties of the strokes in the context of numerical symbolism. The theory must explain how new predicates are formed or retrieved from open-ended memory without explicit supervision.

  ---

  #### II. Conflicts and Privileges

  There is a fundamental tension between the requirement for **Openness** (6) and the constraint of **Human Speed** (one to two minutes).

  If the vocabulary is truly open, the hypothesis space is effectively infinite. A search over an infinite space cannot converge on a unique solution within sixty seconds without extremely strong priors. However, if the priors are strong enough to ensure speed, the vocabulary is effectively closed or heavily biased, violating the spirit of Openness.

  **Resolution:** I privilege the **Human Speed** constraint. A theory that posits an exhaustive search over an open vocabulary is computationally implausible as a model of human cognition. Therefore, the theory must posit that the 'Open Vocabulary' is an illusion created by a highly efficient, pre-existing latent structure. The 'openness' is not in the search space, but in the compositional flexibility of a fixed (but vast) set of primitives. The design brief must therefore focus on *retrieval* and *composition* mechanisms rather than *generation* ex nihilo.

  ---

  #### III. Requirements vs. Research Programme Commitments

  It is vital to distinguish between what the theory must achieve (Requirements) and how a specific school of thought proposes to achieve it (Commitments).

  **Non-Negotiable Requirements:**
  1.  **One-Shot Convergence:** The system must solve unseen problems without gradient descent or weight updates specific to the problem.
  2.  **Invariance to Noise:** Irrelevant visual perturbations must not alter the concept classification.
  3.  **Intentional Alignment:** The output must match human consensus on 'correctness', not just logical consistency.

  **Research Programme Commitments (Not Requirements):**
  1.  **Enumerable Hypothesis Space:** The demand that the system search over a list of explicit logical formulae is a commitment of classical symbolic AI (e.g., Bongard's own algorithm, PHRAI). Connectionist or neural approaches do not enumerate hypotheses explicitly; they traverse a loss landscape. This should not be a desideratum for the *theory of induction*, but rather a specific architectural claim. A valid theory could posit induction as constraint satisfaction in a continuous space rather than search in a discrete space.
  2.  **Textual Intermediary:** The assumption that the solution must be rendered as natural language before being verified is a commitment. A system might 'solve' the problem by transforming the right panel into the left panel (programmatic induction) without ever generating a sentence. While human solvers verbalise, the underlying cognitive mechanism might be non-linguistic.

  ---

  #### IV. Impossibility Results

  A subset of the desiderata cannot be jointly satisfied without contradiction. This constitutes a finding about the nature of the problems themselves.

  **The Trilemma of Induction:**
  Consider the following three constraints:
  1.  **Open Vocabulary:** The system has no prior knowledge of the specific concepts (e.g., 'Roman Numeral') used in the problem.
  2.  **No Feedback:** The system receives no signal indicating whether a hypothesis is correct until the final answer (matching the human 'one attempt' constraint).
  3.  **Unique Correctness:** The system must identify the *intended* rule, not just *a* rule.

  **Demonstration:**
  If the Vocabulary is Open (1), then for any separation of the twelve panels, there exist infinite valid descriptions (Goodman's 'New Riddle of Induction'). Without Feedback (2), there is no mechanism to prune descriptions that are consistent but unintended. Therefore, Unique Correctness (3) is unattainable.

  To resolve this, one constraint must give way. Since 'No Feedback' and 'Unique Correctness' are definitional to the Bongard task as a test of insight, **Open Vocabulary (1) must give way.**

  **Finding:** A theory of Bongard solving *must* assume a substantial, pre-existing ontology. True 'concept induction' from zero priors is impossible in this setting. The 'induction' is not the creation of new concepts, but the *recognition* of latent concepts within a pre-existing manifold. Any theory claiming to learn concepts purely from the twelve images is mathematically untenable.

  ---

  #### V. The Killer Requirement

  The single requirement that eliminates the largest number of otherwise plausible accounts is **Intentionality (Correctness vs. Consistency)**.

  **Explanation:**
  Many systems can achieve logical separation.
  *   **Deep Learning approaches** (e.g., CNNs trained on synthetic Bongard-like data) can often classify left vs. right with high accuracy. However, they fail the Intentionality requirement because they operate as black boxes; they cannot articulate *why* the separation holds, nor can they distinguish between the intended rule and a spurious correlation (e.g., pixel density) that happens to hold for the twelve examples. They satisfy Consistency but not Correctness.
  *   **Purely Symbolic Search** approaches satisfy Correctness (if the rule is in their vocabulary) but often fail on Invariance (sensitive to noise) or Openness (limited vocabulary).
  *   **Large Language Models (prompted with text descriptions)** often fail on Invariance and Correctness because the textual rendering loses spatial information, leading to hallucinations of rules that fit the text but not the geometry.

  The Intentionality requirement demands a theory of *relevance*. It requires the system to model the *mind of the designer*. It is not enough to find a pattern; the pattern must be 'simple' or 'natural' in a way that aligns with human cognitive biases. This eliminates any purely extensional account (which looks only at the sets) and demands an intensional account (which looks at the complexity of the description relative to a cognitive prior). It forces the theory to address *semantics*, not just syntax or statistics.

  ---

  #### VI. Brief Comparison of Existing Approaches

  | Approach | Meets One-Shot? | Meets Openness? | Meets Intentionality? | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Classical Symbolic (e.g. PHRAI)** | Yes | No (Fixed primitives) | Yes (Explicit rules) | Fails Openness. Brittle to noise. |
  | **Deep Learning (Discriminative)** | No (Needs training) | No (Fixed weights) | No (Black box) | Fails One-Shot & Intentionality. |
  | **Program Induction (e.g. DreamCoder)** | Yes | Partial (Compositional) | Yes (Complexity prior) | Strongest candidate, but vocabulary still bounded. |
  | **LLM + Vision (Multimodal)** | Yes | Yes (Broad knowledge) | Partial (Hallucinates) | Fails strict Invariance/Correctness. |

  **Conclusion:** The Program Induction approach comes closest to satisfying the desiderata, provided its 'library' of primitives is sufficiently rich to approximate the 'Open Vocabulary' requirement without violating the 'Speed' constraint. However, as demonstrated in the Impossibility Result, it must concede that true openness is impossible; the library must be pre-populated with the seeds of human intuition.
