  - "provisional_mark": integer, 0-100
  - "band": one of "first", "upper_second", "lower_second", "third", "fail"
  - "what_they_got_right": array of objects, each with "claim" (what the script gets right) and "why_it_earns_credit"
  - "errors": array of objects, each with "sentence" (quote the student's own words, or a few words of them, so I can locate it), "kind" (one of "conflation", "misattribution", "non_sequitur", "overstatement", "other"), "explanation" (what's wrong and what the correct position is), "severity" ("minor", "moderate" or "serious"), and "what_good_would_look_like"
  - "one_thing_to_fix_first": string — the single change that would most raise the mark
  - "comment_to_student": string, 120-180 words, in a tone I could send as it stands

  Only quote the script itself; don't invent quotations from anyone else, and don't give me a reading list or bibliography.
