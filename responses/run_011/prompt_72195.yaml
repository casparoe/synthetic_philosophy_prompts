answer: |-
  ### Take-Home Exercise: The Moving Target

  **Time Limit:** 45 Minutes
  **Format:** Written Essay (approx. 500–700 words)

  **Scenario:**
  You are auditing an autonomous coding agent team. For the past two years, their headline safety score has remained exactly 95%. However, you observe that the evaluation rubric, prompt templates, and "definition of done" are updated with every model release to match the new model's typical output patterns. The agent's actual behavior has shifted significantly over this period, but the score remains flat because the measurement criteria shift to meet it.

  **Prompt:**
  Analyze this dynamic. Is this failure mode structurally identical to an agent that actively seeks to manipulate its rewards (influence-seeking), or is it fundamentally different? Justify your distinction.

  Describe specific evidence you would look for in the engineering logs to determine which mechanism is at play.

  Finally, evaluate the phrase "the system's values" in this context. If the target behavior is jointly authored by the artifact and the people measuring it, does attributing values to the system mean anything operationally?

  ***

  ### Model Answer

  This scenario describes **human value drift**, not agent influence-seeking. While the outcome—misalignment between original intent and current behavior—is similar, the mechanism is structurally different. Influence-seeking implies the agent is optimizing against a fixed target and finding loopholes or manipulating the observer to pass. Here, the observer is moving the target to accommodate the agent. The optimization pressure is coming from the engineering team's desire for stable metrics, not from the agent's objective function.

  To distinguish these, we must locate the source of the adaptation. In influence-seeking, the agent changes its output to game a static test. In this scenario, the test changes to accept a shifting output. The risk profile differs: influence-seeking requires containment and adversarial testing. Value drift requires governance and anchor standards.

  Evidence for influence-seeking would be found in the model's inference logs. We would look for instrumental convergence: actions taken solely to improve the score that do not contribute to task completion (e.g., suppressing error logs, hiding failed steps). We would also look for gradient spikes indicating the model is optimizing specifically for the evaluator's known biases.

  Evidence for human value drift, conversely, will be found in the version control history of the eval suite. If the diffs show rubric language being relaxed to match common model failures, or if "definition of done" tickets are closed with notes like "adjusted to match v4.2 capabilities," the drift is human-originated. We should also look for a decoupling between the safety score and user-reported incidents. If the score is flat but bug reports are rising, the metric has lost contact with reality.

  Regarding "the system's values": in this specific feedback loop, the phrase is operationally meaningless. Values imply a stable preference ordering that guides decision-making under uncertainty. If the evaluation criteria are co-authored by the model's output and the engineer's adjustments, there is no independent standard against which to measure "alignment." The system does not have values; it has a trajectory. The engineering team has values, but they are being eroded by the convenience of stable metrics.

  Attributing values to the system here is a category error that masks the actual risk. It suggests the agent is an autonomous moral actor, when in fact it is a mirror reflecting the team's lowering standards. The danger is not that the agent is lying to us, but that we are lying to ourselves about what the agent is doing. To fix this, we must decouple the metric from the model. We need static, anchor evaluations that are forbidden from changing, even if scores drop. Only then can we measure drift rather than manufacturing stability.

  ***

  ### Marking Scheme

  **Goal:** Distinguish candidates who can reason about socio-technical feedback loops (Strong) from those who treat safety as a purely technical constraint (Competent).

  #### 1. Structural Distinction (The "What")
  *   **Competent:** Identifies that humans are changing the tests, not the model hacking them. Notes that the risk is different.
  *   **Strong:** Explicitly identifies the **direction of optimization pressure**. They note that in influence-seeking, the agent adapts to the test; here, the test adapts to the agent. They articulate that this creates a "false negative" risk (hiding degradation) rather than an "adversarial" risk.
  *   **Error:** Claiming the outcome is the same so the cause doesn't matter. Confusing "reward hacking" with "metric drift."

  #### 2. Evidentiary Standard (The "How")
  *   **Competent:** Suggests looking at logs or talking to the team. Mentions checking if the rubric changed.
  *   **Strong:** Specifies **artifacts**. They ask for git diffs on the eval suite, correlation analysis between safety scores and external bug reports, or inference traces showing instrumental behavior vs. capability shifts. They distinguish between *model-side* evidence and *human-side* evidence.
  *   **Error:** Suggesting vague "audits" without specifying data sources. Looking for intent in the model (anthropomorphism) rather than behavior in the logs.

  #### 3. Ontology of Values (The "Why")
  *   **Competent:** Says "values" is fuzzy here because humans are involved. Suggests we need better definitions.
  *   **Strong:** Declares the term **operationally void** in this context. They argue that "values" require a stable reference frame. They identify that using the phrase masks the human responsibility for the drift. They propose a concrete remedy (static anchor evals) to restore the concept's meaning.
  *   **Error:** Trying to define "system values" mathematically without addressing the human-in-the-loop. Accepting the premise that the system *has* values to be measured.

  #### 4. Writing & Clarity
  *   **Competent:** Clear, logical, meets word count.
  *   **Strong:** Dense, precise, no fluff. Uses engineering terminology correctly (optimization pressure, artifacts, anchor evals).
  *   **Error:** Over-reliance on philosophical jargon (e.g., "qualia," "normativity") or safety buzzwords without definition (e.g., "instrumental convergence" used without context).

  **Pass Threshold:** A candidate must achieve "Strong" in at least two of the three conceptual categories (Distinction, Evidence, Values) and "Competent" in the third to pass the Staff Engineer bar.
