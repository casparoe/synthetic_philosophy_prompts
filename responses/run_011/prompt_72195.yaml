prompt: |-
  I'm a staff engineer on a team that builds autonomous coding agents, and I run an internal take-home exercise for engineers joining the group. I have no formal training in philosophy, so I'd like help turning an intuition into a properly formed assessment question.

  The intuition is a distinction I've encountered in safety writing between a system that openly seeks influence and one whose values erode gradually. In our codebase the erosion isn't in the agent, it's in the acceptance criteria. Each time a new model version arrives we adjust the eval rubric, the prompt templates, and our definition of done to match what the model now reliably produces, so the headline score has been flat for two years while agent behaviour has moved a long way.

  Please write one take-home essay question, answerable in roughly 45 minutes, that forces candidates to work out whether this is the same failure mode as an influence-seeking system or a structurally different one; what would count as evidence either way; and whether the phrase the system's values means anything at all when the target is jointly authored by the artifact and the people measuring it. The question should not depend on knowing the literature, so no reading list and no citations anywhere. Then give me a model answer of about 500 words and a marking scheme that separates a strong answer from a merely competent one by naming the specific moves each must make, together with the specific errors that should cost marks.
