answer: |-
  ### 1. Candidate Principles

  Based on the tabulation of her past verdicts, three candidate principles emerge that are jointly consistent with her record. They are stated here with sufficient precision to be falsified by a future case.

  **Principle A (The Substance/Procedure Distinction):**
  Retroactivity is permissible regarding *forum* (UK War Crimes Act) and *procedural shields* (Argentina Amnesty Laws), provided the substantive conduct was criminal under domestic or international law at the time of commission. However, retroactive creation of a *substantive offense* binding on individuals is illegitimate if the norm at the time bound only the State (Nuremberg Aggression) or lacked individual penal attachment (GDR Border Guards distinction).
  *Falsification Condition:* A verdict finding legitimate a prosecution where the substantive conduct was lawful for the individual at the time, solely because a new forum was created.

  **Principle B (The Imputation Constraint):**
  Retroactive expansion of *modes of liability* (rules of imputation) is a distinct and graver defect than retroactive definition of substantive offenses. Even if the substantive crime existed, convicting a defendant under a mode of liability (e.g., conspiracy, joint criminal enterprise) that was not legally cognizable at the time is illegitimate (Tokyo Conspiracy).
  *Falsification Condition:* A verdict finding legitimate a prosecution where the mode of liability was defined for the first time in the tribunal statute, provided the substantive crime was established.

  **Principle C (Calibrated Notice):**
  The requirement for fair notice is not fixed but calibrated to the defendant's office and access to legal advice. High officials with legal counsel are held to notice of customary international law and public warnings (Sierra Leone Child Soldiers) that would not suffice for a layperson. However, notice of *moral wrongfulness* or *political intent to prosecute* does not substitute for notice of *legal criminality* (Nuremberg Aggression).
  *Falsification Condition:* A verdict finding illegitimate a prosecution where the defendant had legal counsel and the prohibition had crystallized in customary law, OR a verdict finding legitimate a prosecution where the defendant had counsel but the only notice was of moral wrongfulness or future political accountability.

  ### 2. Separation of Candidates

  **Pairs the Record Fails to Separate:**
  The record does not fully separate **Principle A (Substance)** from **Principle B (Imputation)** when both are defective. In the Tokyo case, both the substantive crime (aggression) and the mode (conspiracy) were contested, but she isolates the mode as "worse." In the Nuremberg Aggression case, the substance was defective, but the mode was less central. We do not have a case where the *substance* was clearly legitimate (e.g., murder) but the *mode* was retroactive, to see if Principle B stands alone as a veto.

  **What the New Hypothetical Separates:**
  The hypothetical forces a conflict between **Principle C (Notice)** and **Principles A & B (Substance/Imputation)**.
  *   *Support for C:* The minister had a legal adviser and received a Commission report warning of accountability (mirroring Sierra Leone).
  *   *Support for A:* The conduct was valid under domestic law; human rights covenants bound the state but created no individual penalty (mirroring Nuremberg Aggression).
  *   *Support for B:* The mode of liability (JCE) was defined for the first time in the statute, and he is charged for acts he did not command (mirroring Tokyo Conspiracy).

  This case separates whether **enhanced notice (C)** can cure a **defect in substantive law (A)** or a **defect in imputation (B)**. Her record suggests notice cures uncertainty about *existing* custom (Sierra Leone), but does not cure the *absence* of individual penalty (Nuremberg Aggression).

  ### 3. Prediction

  **Verdict:** **Illegitimate.**
  **Probability:** **85–90%.**

  **Decisive Axis:** **Mode of Liability (Imputation).**
  While the substantive charge is vulnerable under Principle A (mirroring Nuremberg Aggression: state-bound norms without individual penalty), she explicitly described the Tokyo imputation defect as "worse than Nuremberg's aggression count." In the hypothetical, the JCE mode is "defined for the first time in the statute." This is a direct replication of the Tokyo flaw.

  She will likely reason that the Commission Report and legal adviser satisfy the *notice* requirement (Principle C), but notice cannot validate a *mode of liability* that did not exist in law. As she noted in Tokyo, changing the rules of imputation changes the rules of the game, not just the definition of the foul. The substantive defect (Principle A) reinforces the verdict, but the imputation defect is the primary veto. She will likely argue that holding a minister liable for acts of administrators he never commanded, under a statute drafted two years later, violates the principle of justice she invoked at Nuremberg.

  ### 4. The Carve-out for Intervening Powers

  **Nature of the Defect:**
  On her principles, the carve-out is a defect of a **different kind** than retroactivity, but one that compounds the illegitimacy. Retroactivity violates *legal certainty* (a principle of justice); selective jurisdiction violates *equality before the law* (also a principle of justice).

  **Commitments:**
  *   **If she votes Legitimate:** She is committed to the view that **jurisdictional validity is separable from distributive fairness.** She would be treating the tribunal's legal power as distinct from its political symmetry. This would align with her acceptance of the UK War Crimes Act (new forum for old crimes), suggesting that who sits in judgment matters less than whether the law existed.
  *   **If she votes Illegitimate (based on the carve-out):** She is committed to the view that **Victor's Justice invalidates legal authority.** This would align with her comment at Nuremberg that *nullum crimen* is a "principle of justice rather than a limit on sovereignty." If the "justice" is selectively applied to the defeated while shielding the victors, the principle is violated.

  **Prediction on Carve-out:** She will likely treat the carve-out as **aggravating evidence** of the tribunal's illegitimacy rather than a standalone veto. It reinforces the "sovereign immunity for winners" asymmetry she criticized in Nuremberg Aggression. However, she would likely maintain that even without the carve-out, the retroactivity defects (A & B) are sufficient to annul the prosecution.

  ### 5. Variation and Question

  **Smallest Single-Fact Variation:**
  Change the **source of the Mode of Liability.**
  *Current Fact:* JCE is "defined for the first time in the statute."
  *Variation:* "The mode of liability charged (JCE) had crystallized into customary international law carrying individual responsibility before the dates in the indictment, though it was first codified in this statute."

  *Discrimination:* If she votes **Legitimate** on this variation, it confirms **Principle B (Imputation Constraint)** is the decisive veto in the original hypothetical (i.e., the problem was the *newness* of the mode, not the selectivity or substance). If she still votes **Illegitimate**, it confirms **Principle A (Substance)** is the true driver (i.e., the lack of individual criminal penalty for the *conduct* itself in the HR Covenants is the fatal flaw, regardless of the mode).

  **Seminar Question:**
  "In the Tokyo judgments, you described the retroactive change to imputation rules as 'worse' than the substantive retroactivity at Nuremberg. Does enhanced notice of the *substantive* wrong (via Commission reports and legal counsel) ever cure a defect in the retroactive creation of a *mode of liability*, or is the imputation constraint an absolute bar regardless of the defendant's awareness?"

  *Rationale:* This question forces her to rank her principles. It asks whether Principle C (Notice) can override Principle B (Imputation). Her answer will reveal whether her objection to Tokyo was about *fairness/notice* (which can be cured) or about *legal authority* (which cannot).
