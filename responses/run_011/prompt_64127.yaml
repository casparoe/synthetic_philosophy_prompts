  ok so my friend Nadia read the Groundwork over the summer (the actual book, she makes us listen to her at lunch) and now she has this whole system for grading whether an action is genuinely morally good vs. just fine, or accidentally good. She calls it "does it have moral worth." Her verdicts so far, in order:

  1. Store owner who charges everyone the same price because getting caught cheating would wreck his reputation → doesn't count
  2. Kid who volunteers at the animal shelter every Saturday and loves it, it's the highlight of his week, and he told her straight up he'd quit if it stopped being fun → doesn't count, her words were "nice guy, zero credit"
  3. Guy who's badly depressed and can't stand being around people but still drives his neighbor to chemo every Tuesday → counts, fully
  4. Girl who found a wallet with 400 dollars in it and turned it in with no inner struggle whatsoever, she said she was just raised to feel sick at the idea of taking something that isn't hers → counts
  5. Friend who told another girl her haircut was bad when lying would have cost literally nothing and nobody would ever have known → counts
  6. Person who donated only because their company was matching donations and would have kept the money otherwise → doesn't count

  Her go to line is "if you would've done it anyway, it doesn't count." But she also says the only thing that counts is doing it *because it's the right thing*, which sounds like a completely different test to me, and so far no case she's judged has made those two come apart, which seems suspicious.

  New case, it's about Marcus, our debate captain. He stays every Thursday to work with the two freshmen who are worst at research. He's told multiple people he does it because he wants to be a teacher someday and it's free practice, and he's openly said the freshmen are kind of annoying. No teacher sees it, it isn't on anything he submits, and he actually turned down an offer to get official mentoring hours logged for his applications. It's also his second year doing it — last year he did the exact same thing for two different freshmen, before he'd decided about teaching, and got nothing out of it then either. When I asked if he'd keep doing it if he went into finance instead he said yeah, "because they'd still be completely lost." One more detail: last month a freshman asked him to help her make up sources for a paper and he said no, although everyone knows the real reason is that the honor code expels people and he's not risking his transcript.

  So what's she going to say about Marcus? Honestly I care less about the yes or no than about figuring out what rule she's running. Can you list the rules that fit all six of her earlier verdicts equally well — I can think of two or three but I don't trust my list — and say what each of them implies for Marcus? Then tell me which one you'd actually bet on and why, and give me the single case I should bring her at lunch next week that would force the surviving rules to disagree, so I can watch her squirm. And if any of her six verdicts don't really fit the Kant thing she claims to be doing, point that out too.
