          *   *Signal:* Waving the claw.
          *   *Honesty:* A weak crab *could* grow a big claw, but if it's the cheap regrown version, it breaks or doesn't work in fights. Wait, the prompt says "lighter, weaker, and cheaper to wave."
          *   *Actually, let's look closer at the biology:* Fiddler crabs wave to attract females/threaten males. The claw is a weapon *and* a signal. If a crab loses it, it regrows a "major" claw that looks big but is lighter/porous. It signals "I am big" but is actually "I am weak."
          *   *Wait, does this support the Handicap Principle?* The Handicap Principle requires the signal to be *honest*. If the regrown claw allows a weak crab to bluff, that's a *failure* of honesty, or it implies the *cost* of using it (risk of breakage in fight) maintains honesty.
          *   *Better interpretation for this lesson:* The *act of waving* is the signal. The cost is energetic/risk.
          *   *Actually, the prompt suggests the Fiddler Crab lets them see something specific.* The regrown claw is *cheaper* to produce/wave but signals the same size. If the signal remains honest despite being cheaper, it challenges the "cost = honesty" myth.
          *   *Refinement:* The standard fiddler example is often used to show *cheating* (the regrown claw is a bluff). But for the Handicap Principle, we need an honest signal.
          *   *Alternative interpretation:* The prompt says "male fiddler crab that regrows a display claw of much the same length after losing the original — lighter, weaker, and cheaper to wave."
          *   *Lesson Angle:* If the regrown claw is cheaper to wave, why don't all crabs have regrown claws? Because the *underlying quality* (ability to survive without a solid weapon) differs?
          *   *Actually, the strongest pedagogical move:* Use the Fiddler to break the "Absolute Cost" myth. If a cheap signal (regrown claw wave) is still honest (because the *consequence* of being caught bluffing is higher for low quality), it illustrates differential cost.
          *   *Decision:* The Peacock is too baggage-heavy. The Fiddler is fresher but needs careful framing so it doesn't look like "cheating." I need to ensure the Fiddler example is framed around the *cost of the wave* relative to *reserve energy* or *risk*, not just the claw mass.
          *   *Wait, re-reading the prompt's specific framing:* "I want to know what that case lets them see and what it actively obscures."
          *   *Verdict:* Drop the Peacock. It's too associated with "wastefulness." Use the Fiddler, but acknowledge its limits (it obscures the genetic component often associated with Zahavi's original formulation).

  4.  **Drafting the Session Flow (90 Minutes):**
      *   *0-15:* Elicit prior knowledge (The "Rolex/Peacock" model). Formalize the misconception.
      *   *15-30:* Break the model. Introduce the "Bluff" problem. If cost is the only barrier, rich/healthy liars win.
      *   *30-45:* Introduce Differential Cost (The Core). Graph/Whiteboard work. Cost(Quality) curves.
      *   *45-60:* Apply to Fiddler Crab. Why is the regrown claw signal honest (or not)?
      *   *60-75:* Social Science Bridge. Education/credentials (Spence Model). Cheap for smart, expensive for dull.
      *   *75-85:* Synthesis & Misconception Check.
      *   *85-90:* The Final Question.

  5.  **Identifying Misconceptions:**
      *   *Prior:* "Cost guarantees honesty." "Waste is functional."
      *   *Emergent:* "Cheap signals are always dishonest." "Differential cost means the poor pay more money." "It's about intent/choice" (teleology).
      *   *Timing:* Head off "Cheap = Dishonest" during the Differential Cost section. Head off "Intent" during the Social Science bridge.

  6.  **The Final Question:**
      *   Needs to test *differential* cost, not *absolute* cost.
      *   Scenario: Two people, two signals, different costs. Which is honest?
      *   *Idea:* A tattoo vs. a degree. Or a specific numerical scenario.
      *   *Better:* A scenario where a high-cost signal is useless and a low-cost signal is honest.
      *   *Draft:* "A rich person burns $1000 to prove wealth. A poor person burns $100. Who is believed?" (Too simple).
      *   *Draft:* "Signal A costs 10 units for Type 1, 20 for Type 2. Signal B costs 5 units for Type 1, 100 for Type 2. Which signal separates them?"
      *   *Refinement:* Make it narrative.

  7.  **What to Refuse:**
      *   Game Theory math (Nash Equilibria details).
      *   Genic selection details.
      *   The debate on whether Zahavi was actually right about peacocks (empirical validity vs. theoretical logic).
      *   Intentionality (humans "choosing" to signal).

  8.  **Refining the Fiddler Crab Verdict:**
      *   *Pros:* Breaks the "size = cost" heuristic. Shows physiological constraints.
      *   *Cons:* It's often cited as a *failure* of honesty (the regrown claw is a bluff). I must be careful.
      *   *Correction:* The prompt implies the instructor *wants* to use it. I need to justify *how* it works for the lesson.
      *   *Argument:* The regrown claw is *cheaper* to produce. If the signal is "I have a big claw," and a weak crab can produce a big cheap claw, the signal *should* collapse. It doesn't (fully). Why? Because the *cost of maintenance* or *risk in combat* is higher for the weak crab with the weak claw.
      *   *Actually, the prompt says:* "lighter, weaker, and cheaper to wave."
      *   *Pedagogical Hook:* If it's cheaper to wave, why isn't everyone waving it? Because the *consequence* of the wave (attracting a fight) is costlier for the weak crab. This shifts focus from *production cost* to *marginal cost of risk*.
      *   *Verdict:* Keep Fiddler, drop Peacock. But warn the instructor that the Fiddler example is biologically contentious regarding honesty, so treat it as a *theoretical model* for the class, not absolute fact.

  9.  **Structuring the Plan:**
      *   Use clear time blocks.
      *   Define "Dependencies" (what must be understood before moving on).
      *   List "Misconception Traps" per block.
      *   Write the "Refusal Statement."
      *   Craft the "Final Question."

  10. **Review against Constraints:**
      *   90 mins? Yes.
      *   Mixed cohort? Need to balance bio and social examples.
      *   Whiteboard? Need visual descriptions.
      *   Specific goal (Differential Cost)? Central focus.

  11. **Final Polish:**
      *   Ensure the distinction between "Absolute Cost" and "Marginal/Differential Cost" is the spine of the lesson.
      *   Make sure the Social Science students don't drift into "cultural signaling" without the evolutionary constraint.
      *   Make sure Bio students don't drift into "genetic determinism."

  *(Self-Correction during drafting)*: I need to be careful with the Fiddler Crab. If the regrown claw is a "cheap bluff," it actually *undermines* the Handicap Principle unless framed carefully. The prompt says the instructor is *drawn* to it. I should advise that it works best to show *why* absolute cost fails, but might need a tweak to show honesty.
  *Actually, the best way to use the Fiddler for *this* specific learning goal:* The regrown claw is the *same size* (signal magnitude) but *lower cost*. If the Handicap Principle were simply "high cost = honest," the regrown claw should be *more* honest (because it's cheaper? No).
  *Wait, let's step back.* The learning goal is: "Signal is reliable not because it costs a lot, but because it costs a poor-quality signaller more."
  *Fiddler Application:*
  *   Signal: Waving a big claw.
  *   High Quality Crab: Has original claw. Heavy, strong. Cost to wave: Moderate. Benefit: High (wins fights).
  *   Low Quality Crab: Has regrown claw. Light, weak. Cost to wave: Low (it's lighter).
  *   *Problem:* If cost is lower for the low quality crab, they should signal *more*.
  *   *Solution:* The "Cost" isn't just energy to wave. It's the *risk of breakage* or *loss in fight*. The Low Quality crab risks death if it escalates. The High Quality crab does not.
  *   *So:* The Fiddler example is tricky. It might confuse them if not handled perfectly.
  *   *Alternative:* The "Gazelle Stotting" or "Vervet Alarm Calls."
  *   *Decision:* I will advise the instructor that the Fiddler is high-risk/high-reward. It demolishes "size = cost" but requires shifting the definition of "cost" from "energy" to "risk." I will structure the plan to manage this shift explicitly.
  *   *Actually, looking at the prompt again:* "I want to know what that case lets them see and what it actively obscures." I need to provide this verdict clearly.
  *   *Verdict:* Use it, but explicitly flag the "Cost Definition" shift.

  12. **Finalizing the Plan Structure:**
      *   Phase 1: The Intuitive Trap (Peacock/Rolex).
      *   Phase 2: The Logic Break (The Bluff).
