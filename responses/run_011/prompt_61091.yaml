  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** 20 second-year students (mixed Biosci/Social Science).
      *   **Context:** 90-minute whiteboard session, interdisciplinary module (Evolution & Society).
      *   **Prior Knowledge:** Popular/misunderstood version of the Handicap Principle (Zahavi): "Honest because expensive/wasteful" (Peacock/Rolex analogy).
      *   **Learning Goal:** Correct understanding: Reliability depends on *differential costs* (marginal cost relative to quality), not absolute cost. High cost $\neq$ honest; Low cost $\neq$ dishonest.
