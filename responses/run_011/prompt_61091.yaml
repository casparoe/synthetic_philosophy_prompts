          *   One final assessment question.
          *   What to explicitly refuse/exclude.

  2.  **Deconstruct the Core Concept (The "Thing Backwards"):**
      *   *Popular View:* Cost $\rightarrow$ Honesty. (If it costs a lot, it must be true).
      *   *Correct View:* (Cost to Low Quality) > (Benefit of Lying) AND (Cost to High Quality) < (Benefit of Signaling). It's about the *ratio* or *differential*.
      *   *Key Insight:* A signal can be cheap but honest (if cheap for good, impossible for bad) or expensive but useless (if equally expensive for both).

  3.  **Evaluate the Examples (Peacock vs. Fiddler Crab):**
      *   *Peacock:* Iconic, but reinforces the "wastefulness" myth. Hard to quantify "cost" in class. Students think "big tail = high cost = honest." Hard to show differential cost visually without math.
      *   *Fiddler Crab:* Specifically the regrown claw scenario.
