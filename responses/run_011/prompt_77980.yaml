      *   *The "Truthful" Constraint:* The user asks for honesty. If I pretend outcome doesn't affect sanction, I'm lying. In employment law, "capability" and "conduct" often merge with "risk." If someone kills a resident (even accidentally), the trust required for the role is often broken.
