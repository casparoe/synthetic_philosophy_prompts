  **Failure.**
  Clause (e) is my entry point. It delegates exemption authority to licensing bodies who are not signatories. These bodies face incentive structures orthogonal to orbital sustainability, specifically national security mandates that trump debris externalities. This allows state-aligned operators to bypass the freeze legally while private competitors remain bound, breaking the symmetry required for stability within the compact's operational structural logic.

  **Mechanism.**
  The operator acts as an agent for the licensing authority. When the authority classifies a payload as security, the operator's payoff for launching shifts from negative to positive. Since the authority bears no direct cost from the debris externality relative to the security benefit, they classify aggressively. Operators tied to aggressive states gain capacity; others lose market share, incentivizing them to seek similar state capture or defect to restore parity. This asymmetry ensures that compliance becomes the dominated strategy for any operator lacking sovereign protection, forcing the compact to unravel as protected actors expand and unprotected actors exit or violate.

  **Repair.**
  Require unanimous signatory consent for any security exemption. This closes the loophole by aligning exemption costs with the group. However, this creates a veto problem: a single rival operator can block legitimate security launches, turning the Compact into a weapon for market suppression rather than debris mitigation, incentivizing states to withdraw. It fails to solve the underlying structural principal-agent divergence.
