  2. Bailey Park reveals that while housing supply is robust because Potter fills the vacuum with slums regardless of George's existence, the specific form of affordable dignity is not resilient without the Building and Loan's structure. This separates the inevitability of shelter from the contingency of its quality, showing the town's moral architecture cannot recover its original shape on the same timetable.

  3. The Pottersville tour confirms the lack of robustness regarding the town's moral architecture because Potter's monopoly faces no competing substitute to slot into the vacancy left by the Building and Loan. This structural absence ensures the outcome is neither robust nor resilient, as the counterfactual world degrades rather than stabilizing around a new equilibrium.

  4. If Clarence's counterfactual is merely therapeutic suasion rather than an epistemic claim, the film sinks as counterfactual history because the stakes are manufactured to save a life rather than reveal causal structures. Yet this rescues the narrative as ethics, since the truth of the contingency matters less than George's belief in his own non-replaceability to prevent the suicide.

  5. The film captures how agents' beliefs about their own replaceability alter the tape's replay, a reflexive loop Gould's biological analogy ignores because Burgess Shale organisms do not anticipate their own contingency. Straight argument misses this feedback loop where believing oneself robust can trigger the very collapse that proves one was indispensable for the outcome's resilience.
