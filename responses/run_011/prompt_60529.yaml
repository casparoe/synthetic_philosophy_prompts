answer: |-
  **The Case Against Probability Floors**

  In decision theory under extreme uncertainty, the "fanatic" maximizes expected value regardless of how minuscule the probability of a massive payoff may be. To avoid this, anti-fanatics often propose a probability floor $\epsilon \in (0,1)$. Branches with probability $p < \epsilon$ are treated as zero. We distinguish two variants: the *Hard Floor* (HF), which sums expected utility only over kept branches without renormalization, and the *Renormalized Floor* (RF), which divides the sum by the total probability of kept branches. This argument establishes that adopting a probability floor is normatively worse than accepting fanaticism. The standard of comparison is internal coherence: a decision rule should not violate statewise dominance, should not recommend plans that the agent will later abandon, and should not yield different verdicts based on arbitrary descriptions of the same situation. Fanaticism violates intuitive prudence; floors violate the logical structure of choice.

  **1. Blindness and Dominance Violations**

  The primary defect of the floor is blindness to outcomes on neglected branches. Consider an agent with $\epsilon = 0.05$. She faces two prospects, $X$ and $Y$, defined over a partition $\{S_1, S_2\}$ with probabilities $p(S_1) = 0.04$ and $p(S_2) = 0.96$.
  *   Prospect $X$: Utility $-1,000,000$ in $S_1$; Utility $0$ in $S_2$.
  *   Prospect $Y$: Utility $0$ in $S_1$; Utility $0$ in $S_2$.

  Under HF, branches with $p < 0.05$ are ignored. The agent calculates $V(X) = 0.96 \cdot 0 = 0$ and $V(Y) = 0.96 \cdot 0 = 0$. She is indifferent between $X$ and $Y$. Consequently, she is willing to switch from $Y$ to $X$ for no compensation. She accepts a guaranteed risk of losing one million units for no gain whatsoever. This violates Statewise Dominance: $Y$ yields an outcome at least as good as $X$ in every state and strictly better in $S_1$. Fanaticism respects dominance; the floor does not.

  Furthermore, this blindness enables exploitation. Consider Prospect $Z$: Utility $0$ in $S_1$; Utility $+0.01$ in $S_2$. HF values $Z$ at $0.01$. The agent prefers $Z$ over $X$. She is thus willing to accept the risk of losing one million units (in $S_1$) in exchange for a one-cent expected gain (in $S_2$). While expected utility theory might accept this trade if the probability were accounted for, the floor agent accepts it *because* she does not account for the loss. If this trade is offered repeatedly across independent events where the loss accumulates on the neglected branches, the agent incurs unbounded losses while tracking negligible gains on the kept branches. The floor does not merely limit risk; it blinds the agent to catastrophic downside variance that falls just below the threshold.

  **2. Dynamic Inconsistency**

  A rational agent's ex ante plan should align with her ex post choices unless new information arrives. The floor violates this diachronic consistency. Consider a two-stage problem with $\epsilon = 0.05$.
  *   **Stage 1:** Choose between *Wait* or *Prevent*.
  *   **Stage 2:** Nature reveals state $S$ (probability $0.04$) or $\neg S$ (probability $0.96$).
  *   **Payoffs:** If $S$ occurs and *Prevent* was not chosen, loss of $1,000$. If *Prevent* was chosen, loss of $100$ (cost of prevention). If $\neg S$, loss is $0$.

  **Ex Ante:** The agent evaluates the *Wait* plan. The branch $S$ has $p=0.04 < \epsilon$. HF ignores this branch. The value of *Wait* is calculated solely on $\neg S$, yielding $0$. The value of *Prevent* is a certain loss of $100$ (probability $1.0 \ge \epsilon$), valued at $-100$. The agent plans to *Wait*.

  **Ex Post (Suppose $S$ occurs):** The agent finds herself in state $S$. The probability of $S$ is now $1.0$. This is above $\epsilon$. She faces a choice between accepting loss $1,000$ or paying $100$ to prevent it (assuming prevention is still possible). She strictly prefers to pay $100$.

  **The Inconsistency:** The agent ex ante endorses a plan (*Wait*) that she knows she will abandon ex post should the neglected state obtain. She cannot commit to her own plan. Unlike the fanatic, whose preferences are stable across time (conditional on information), the floor agent's valuation of a consequence flips from "nothing" to "everything" solely based on the passage of time updating a probability from $0.04$ to $1.0$. This makes her vulnerable to dynamic money pumps: a sophisticated exploiter could charge her a fee ex ante to lock her into *Prevent*, which she willingly pays to avoid the ex post choice she knowingly mandated for herself.

  **3. Description Sensitivity**

  The prompt stipulates that comparisons use a common refinement to avoid trivial dominance violations arising from mismatched partitions. However, this assumption imposes a costly metaphysical burden: it requires a "finest partition" of states to be available and unique. If the state space is continuous or if outcomes can be individuated at multiple defensible grains, the floor rule yields indeterminate or contradictory verdicts.

  Suppose an event $E$ has probability $0.04$ ($\epsilon = 0.05$). Under description $D_1$, $E$ is a single state. HF ignores $E$. Under description $D_2$, $E$ is decomposed into two mutually exclusive sub-states $E_1$ and $E_2$, each with probability $0.02$. Both are ignored. The value remains unchanged. However, consider an event $K$ with probability $0.06$. Under $D_1$, $K$ is kept. Under $D_3$, $K$ is decomposed into $K_1$ ($0.03$) and $K_2$ ($0.03$). Both sub-states are now below $\epsilon$ and are dropped. The value of the prospect drops discontinuously simply because the agent chose to describe the possibility more finely.

  Since there is no objective "correct" granularity for describing states (e.g., is "death by car accident" one state or many depending on the specific mechanism?), the value of a prospect becomes dependent on the agent's descriptive choices rather than the world itself. Two agents facing the identical physical situation but employing equally defensible descriptive frameworks will rank options differently. This violates Description Invariance, a core norm of rationality. Fanaticism is invariant to partition refinement; the floor is not.

  **4. The Failure to Cure and Objections**

  The floor is introduced to escape Pascalian fanaticism, but it fails to cure the disease. Fanaticism arises because unbounded utilities can outweigh arbitrarily small probabilities. For any fixed $\epsilon$, there exists a utility $U$ such that $\epsilon \cdot U$ exceeds any safe alternative. If utilities are unbounded, offers with probability just above $\epsilon$ will still generate fanatic verdicts. To truly stop fanaticism, the agent must bound utilities. But once utilities are bounded, the probability floor is redundant for its primary purpose yet retains all the defects listed above. It adds incoherence without solving the problem.

  Three objections arise. First, a *sophisticated* agent chooses plans ex ante to avoid dynamic inconsistency. While this avoids the money pump, it does not resolve the dominance violation. The agent still knowingly plans to ignore a dominated prospect ex ante. Second, one might argue the floor is a *heuristic* for cognitively limited agents, not a normative rule. If so, the charge of irrationality misses its target, but the handout concerns normative decision theory. As a heuristic, it is dangerous: it systematically blinds agents to tail risks that are statistically predictable over time. Third, one might propose scaling $\epsilon$ to stakes. If $\epsilon$ varies with utility, the rule effectively becomes a non-linear utility transform. This concedes the main point: the work is being done by bounding the impact of utilities, not by truncating probabilities.

  **5. Constructive Upshot**

  Given the failure of probability floors, the anti-fanatic must choose between capping utilities, adopting a globally risk-averse transform (such as Risk-Weighted Expected Utility), or accepting timidity. Capping utilities preserves dominance and dynamic consistency but requires justifying why some goods are lexically bounded. Risk-weighted transforms dampen the weight of extreme probabilities without setting them to zero, preserving sensitivity to tail events while avoiding fanaticism. Both options are preferable to the floor because they maintain the structural integrity of the decision rule. The cost is timidity: the agent may reject genuinely valuable long-shot opportunities. However, this is a cost of prudence, whereas the floor imposes a cost of incoherence. An agent who is timid loses money; an agent who uses floors loses her rationality.

  **6. Scope Note**

  The arguments regarding Blindness (Dominance Violation) and Description Sensitivity require only finite utilities and modest stakes; they demonstrate logical incoherence inherent to the rule itself. The Dynamic Inconsistency argument also holds for finite utilities. The argument that the floor "fails to cure" fanaticism requires genuinely unbounded utilities (or utilities sufficiently large relative to $\epsilon$). If utilities are bounded, the floor is simply redundant rather than ineffective. Thus, the strongest case against the floor does not depend on the possibility of infinite utility; it depends on the necessity of logical consistency in choice.
