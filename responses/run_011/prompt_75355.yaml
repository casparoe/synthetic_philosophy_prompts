answer: |-
  Your intuitions are not a mess; they are a precise map of where the standard "Doing vs. Allowing" distinction breaks down in common sense morality. You are implicitly tracking **baseline shifts** and **intent**, not just physical movement.

  Your tentative rule ("don't leave them worse off than if you'd never been near") fails because it ignores **voluntary assumption of responsibility**. In Case 2, the doctor *is* near; they have entered the relationship. In Case 8, the promise changes the baseline.

  Here is a precise formulation that captures seven of your eight verdicts directly and forces a hard choice on the eighth.

  ### The Principle: Non-Interference and Assumed Reliance

  **Clause A (The Negative Duty):** You must not actively intervene to make an agent worse off than they would have been had you not existed or acted.
  **Clause B (The Reliance Duty):** If you have voluntarily assumed a role, made a promise, or are the sole immediate agent of rescue *with the intent to let die*, your baseline shifts. You are then obligated to fulfill the expectations of that role or rescue; omission counts as harm.
  **Clause C (The Rights Constraint):** You may not violate an individual's negative right to life/bodily integrity to maximize aggregate welfare, even if omission leads to greater loss of life.

  ---

  ### Mapping the Clauses to Your Cases

  *   **Case 1 (Vent Off):** **Fine.** Clause A is not violated (patient requested return to natural baseline). Clause B is satisfied (role terminated by consent).
  *   **Case 2 (Vent Never On):** **Not Fine.** Clause B violation. The doctor accepted the patient (assumed role). Withholding standard care breaches the reliance created by the medical relationship, even if the outcome is the same as Case 1.
  *   **Case 3 (Cousins):** **Equally Bad.** Clause B activation. Cousin 2 is the "sole immediate agent." Crucially, their *intent* is the inheritance (malice). When omission is driven by the *intent that the person die*, it morally collapses into killing under Clause B.
  *   **Case 4 (Surgeon):** **Killing Not Fine / Letting Die Fine.** Clause C. The surgeon cannot violate the visitor's Right to Life (Clause A) to save the five. Letting the five die is a failure of Clause B (rescue), but Clause C (Rights) trumps the utility calculation.
  *   **Case 5 (Pond/Suit):** **Pushing Worse / Watching Not Fine.** Pushing violates Clause A (Active Worsening). Watching violates Clause B (Sole immediate agent), but lacks the malicious intent of Case 3, so it is "a notch less bad."
  *   **Case 6 (Bednet):** **Forced Verdict: Not Fine.** Clause B. If you accept that proximity creates a duty (Case 5), distance alone shouldn't negate it if the cost is low (ticket money). This principle forces you to admit your written "Fine" is wrong.
  *   **Case 7 (Buoy):** **Not Fine (Like Killing).** Clause A. Moving the buoy is an *act* that lowers the baseline. It is not an omission; it is active interference with a potential rescue.
  *   **Case 8 (Aunt's Pills):** **Not Fine.** Clause B. The promise created specific reliance. You are worse than a stranger because you displaced other potential caregivers by claiming the role.

  ---

  ### Running the Principle on New Cases

  **1. The Pharmaceutical Company**
  *   **Scenario A:** Company pulls a drug from the market because a rare, fatal side effect is discovered.
      *   **Verdict:** **Fine.** Clause A is not violated (they are not actively killing patients, they are removing a harmful agent they introduced). Clause B is satisfied (safety is part of the assumed role of a drug manufacturer).
  *   **Scenario B:** Company keeps the drug but raises the price tenfold, knowing patients will die without it.
      *   **Verdict:** **Not Fine (Active Harm).** This is Case 7 (The Buoy). By raising the price, they are actively altering the access conditions to make patients worse off relative to the status quo ante. It is not a passive "letting die"; it is an active barrier creation.

  **2. The Driver Swerve**
  *   **Scenario:** A driver loses control. They can swerve left (hit no one, crash into wall, driver dies) or swerve right (hit one pedestrian, driver lives).
      *   **Verdict:** **Swerving Right is Not Fine.** Clause A. Actively steering into a pedestrian makes them worse off than if you hadn't acted (you become the projectile).
  *   **Scenario:** A driver must choose between hitting a group of five or a group of one (classic trolley on a track).
      *   **Verdict:** **Fine (to hit the one).** This is the edge case. If the "swerve" is merely redirecting an existing threat rather than creating a new one, Clause A is less clear. However, under Clause C, if the one person has a right not to be used, you still shouldn't swerve. My principle suggests **do not swerve** if it requires actively targeting the one, but **may swerve** if it is merely redirecting an unavoidable threat (Doctrine of Double Effect).

  ---

  ### The Honest Trade-Off: Cheap vs. Baroque

  You asked: *Does the cheap principle that drops one beat the baroque one that saves all eight?*

  **The Cheap Principle:** "Do not kill. You have no duty to rescue strangers."
  *   **Saves:** Case 4 (Surgeon), Case 6 (Bednet).
  *   **Drops:** Case 3 (Cousins), Case 5 (Pond), Case 7 (Buoy).
  *   **Verdict:** This is too cold. It legalizes the cousin who watches the kid drown. It fails your moral reality.

  **The Baroque Principle (Above):** "Non-Interference + Reliance + Rights."
  *   **Saves:** Cases 1, 2, 3, 4, 5, 7, 8.
  *   **Drops:** **Case 6 (Bednet).**
  *   **The Cost:** To keep the principle coherent, you must admit that buying the festival ticket is **morally wrong**. You cannot keep the intuition that "distant strangers don't count" while holding that "nearby strangers in a pond do count." The only difference is geography, which is morally arbitrary under Clause B.

  **Conclusion:**
  The baroque principle is better because it preserves the **integrity of agency**. It explains why the Cousin (Case 3) is a murderer (intent + proximity) while the Surgeon (Case 4) is not (rights constraint).

  However, you must pay the tax. If you accept Case 5 (Pond) is "Not Fine," you must accept Case 6 (Bednet) is "Not Fine." If you refuse to pay that tax, your ethics are not based on *harm*, but on **psychological proximity**. If you choose proximity, you must admit your ethics are biased by geography, not logic.

  **Recommendation:** Keep the Baroque Principle. Drop the Case 6 verdict. It is better to have a consistent theory that demands more of you than a messy one that lets you off the hook for the bednet while condemning the cousin.
