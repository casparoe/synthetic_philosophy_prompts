  **Reasons:** We are debating more than pricing; we are defining what money is for. Our colleague argues that because money is a convention, we may vote to charge interest without moral cost. He is half-right. Money is indeed a convention, not a force of nature. But conventions are not morally neutral; they are tools judged by what they achieve. In ancient ethics, exchange exists to meet household needs, not to generate infinite wealth. When interest becomes a profit center, money shifts from a measure of value to a commodity that breeds itself. This severs the link between finance and human need.

  We are not a bank; we are a community resetting the convention. Amendment (b) respects this. By returning the surplus to borrowers who repay, we acknowledge that the margin charged was not profit earned by capital, but a risk pool held in trust. If the community succeeds, the surplus returns to the community. This prevents the loan from becoming an engine of endless accumulation. It keeps money tied to need. The rebate alters the structure of the exchange because it makes the cost contingent on mutual success rather than fixed extraction. It transforms the interest from a price into a pledge.

  Two specific concerns require clarity. First, why not Amendment (a)? The zero-percent option appeals to the prohibition on usury, but its restriction to "productive purposes" is dangerous. Aristotle distinguishes between acquisition for the household (natural) and acquisition for wealth (unnatural). Modern distinctions between "investment" and "consumption" do not map cleanly onto this. A tenancy deposit or car repair is survival, not capital investment. Excluding basic consumption risks driving our poorest members back to payday lenders—the very epitome of unnatural acquisition where wealth is extracted from desperation. That outcome violates the spirit of (a) even if it keeps the letter. Handing members to predatory lenders is a greater moral failure than charging a recoverable fee.

  **Counter-Argument:** Our retired bankers will argue that (b) creates operational complexity and confuses members. They will say interest is the price of risk, and rebating it obscures the true cost of funds. They worry that members will budget for 18% and spend the rebate, undermining the safety net. This is a valid operational concern. Pricing must cover losses. However, clarity is achieved through communication, not moral abdication. If we cannot explain why we return surplus to members, we have already lost the cooperative mission. The cost of administration is the price of maintaining trust. If we treat money as purely technical, we become what we seek to replace. We must accept the complexity to honor the convention.

  We must vote for the structure that keeps finance in service of life.

  **To Our Members:**
  We know times are hard, and too many neighbors are paying too much just to get by. This decision ensures that when you borrow from us, the cost stays within our community. If you repay on time, you share in the success of the credit union. We are not here to make money from your needs, but to help you meet them together. Your stability is our profit.
