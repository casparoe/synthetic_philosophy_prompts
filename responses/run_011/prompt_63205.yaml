answer: |-
  The criterion you have been applying is not a single rule, but a hierarchy of two distinct sources of authority. I call this **The Principle of Procedural Validity and Consensual Rescue.**

  It consists of four clauses. Each clause is derived from your ledger, and each ties to specific rulings.

  **Clause 1: Procedural Validity is Necessary for Existence.**
  A rule enters the book only if the adoption mechanism in force at that moment is strictly satisfied. Long-standing practice cannot cure a defect in origin.
  *   **Supported by:** Ruling 6 (the miscount voided the rule despite eight years of practice) and Ruling 2 (the threshold change was valid because it followed the then-current Rule 200).
  *   **Function:** This preserves the integrity of the voting thresholds. If practice could validate a void rule, the thresholds in Ruling 2 and Ruling 3 would be meaningless; players could simply ignore them until a new custom formed.

  **Clause 2: Procedural Repeal is Necessary for Extinction.**
  A valid rule remains in force until it is repealed by the mechanism in force at that moment. Disuse, neglect, or consistent violation do not extinguish a rule.
  *   **Supported by:** Ruling 2 and Ruling 3 (entrenchment binds future majorities).
  *   **Function:** This ensures that the text of the book controls the game, not the habits of the players. It prevents a minority from effectively repealing a rule by simply ignoring it.
  *   **Conflict:** This clause contradicts **Ruling 4**. To maintain coherence, **Ruling 4 must be withdrawn.** You must rule that Rule 136 remained in force during those thirty sessions, and its repeal required a valid vote (which, due to entrenchment, would have been out of order regardless of disuse).
  *   **Why sacrifice Ruling 4 and not Ruling 6?** Ruling 6 protects the definition of the legislature itself (who gets to vote, what counts as a majority). If Ruling 6 is sacrificed, the amendment procedure becomes fluid, undermining Ruling 2 and Ruling 3. Ruling 4 merely makes repeal easier; sacrificing it preserves the strictness of the system without collapsing the definition of legislative power.

  **Clause 3: Unanimous Consensus is the Ultimate Rescue.**
  If the procedural mechanism is destroyed or renders the game impossible to continue, the unanimous agreement of the current players can validate new rules or restore the procedure.
  *   **Supported by:** Ruling 5 (the adoption of Rule 201 after Rule 200 was repealed with no replacement).
  *   **Function:** This prioritizes the continuity of the Game over the continuity of the Rulebook. It acknowledges that the players are the sovereign, but only when acting as one body in the absence of a functioning constitution.

  **Clause 4: Amendments are Prospective Only.**
  Rules govern future play; they cannot rewrite the history of sessions already concluded.
  *   **Supported by:** Ruling 7.
  *   **Function:** This protects reliance interests. Players must be able to trust the state of the book at the time they play.

  ***

  ### Verdicts on Pending Matters

  **1. The Anti-Entrenchment Amendment**
  *Proposal:* Amend Rule 201 to provide that no amendment adopted under it may itself be entrenched.
  *Verdict:* **In Order.**
  *Reasoning:* Under Clause 1, the current Rule 201 allows amendment by a two-thirds vote. This proposal meets that threshold. It is a procedural restriction on future rules, similar to the entrenchment in Ruling 3, but inverted. Just as a rule may entrench itself, a rule may forbid entrenchment, provided the adoption is procedurally valid. There is no higher law prohibiting such a restriction.

  **2. The Packing of the Vote**
  *Proposal:* Three players admit two new players by majority vote (per the membership rule), then pass an amendment by two-thirds vote (5 of 7).
  *Verdict:* **In Order.**
  *Reasoning:* Under Clause 1, the admission was valid (majority vote satisfied the membership rule). The new players are bound by existing rules (Ruling 3). Once admitted, they count toward the total for the amendment threshold. While this circumvents the *spirit* of the two-thirds requirement, it does not violate the *text*. The Nomic is a game of rules, not intentions; using one valid rule to facilitate another is a legitimate strategy unless explicitly forbidden. To rule otherwise would require importing a "fraud on the power" doctrine not present in your ledger.

  **3. The Absent Player Lock**
  *Proposal:* Amend an entrenched rule that requires the consent of a named player who has left the country and no longer plays.
  *Verdict:* **Out of Order** (unless the current players act unanimously).
  *Reasoning:* Under Clause 1 and Clause 2, the entrenchment is valid and persists. The condition (consent of the named player) is a procedural hurdle. The fact that the hurdle is impossible to clear does not remove it; the rule is permanently locked.
  *Exception:* However, under Clause 3 (Consensual Rescue), if **all current players** agree to disregard the absent player's consent requirement, they may validly adopt the amendment. This is not an amendment under the locked rule, but a restoration of agency by the sovereign body of the Game, analogous to Ruling 5. If even one current player objects, the proposal is Out of Order.
