          *   Where the novel *resists* the taxonomy (Procrustean bed moments).
          *   What Keyes gets right about ascending/descending minds that philosophy misses (the "stealable" insight).
      *   **Constraints:** No bibliography, no further reading suggestions, no direct quotes (reconstruct from memory or flag it), don't hurry to a tidy ending (leave tensions standing).

  2.  **Brainstorming & Mapping (Mental Draft):**
      *   *Dennett's Ladder:*
          *   Darwinian: Pre-designed by evolution. Trial and error happens across generations.
          *   Skinnerian: Trial and error within a lifetime. Reinforcement learning.
          *   Popperian: Hypothesis testing in the head before acting. "Let my hypotheses die in my stead."
          *   Gregorian: Tool users. Cultural transmission. Language, math, external memory.
      *   *Charlie Pre-Op:* He speaks, writes (badly), follows rules. He's Gregorian by definition of having language. But his *capacity* to manipulate those tools is limited. Is he a "defective Gregorian" or a "super-Skinnerian with tools"? Dennett would say if you have language, you're Gregorian. But the novel treats him as less than fully human. Tension here.
      *   *Charlie Peak:* High IQ. Abstract reasoning. He questions the scientists (Popperian). He writes complex reports (Gregorian). He realizes the ethical implications.
      *   *Charlie Decline:* Losing the tools. Syntax breaks. But the *awareness* of the break remains. This is the "self-model" issue.
      *   *Algernon:* Mouse. Biologically Darwinian/Skinnerian. Surgery makes him Popperian? Can a mouse be Gregorian without language? He solves mazes faster, but does he *think* about the maze differently? The book implies he does (the Algernon-Gordon effect discovery implies shared cognition).
      *   *Nemur:* High IQ, Gregorian master. But rigid. Lacks Popperian flexibility regarding his own theories? He treats Charlie as a product, not a person. Is he a "hollow Gregorian"?
      *   *Alice:* The bridge. She teaches Charlie. She loves the man, not the IQ.
      *   *The Dial vs. Ladder:* The novel presents IQ as a number (dial). But the *experience* is qualitative (ladder). Keyes conflates processing speed with ontological status.
      *   *The Form:* The misspelling is the genius part. It's the Gregorian toolkit rusting while the Popperian observer watches it rust.
      *   *The "Steal":* The emotional texture of *losing* the tools. Philosophy talks about qualia or intentionality, but rarely about the *grief* of cognitive attrition.

  3.  **Drafting the Brainstorm (Out Loud):**
      *   Need to sound like a philosopher thinking through the taxonomy.
