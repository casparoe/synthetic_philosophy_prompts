answer: |-
  **The Rule of the Order of Perpetual Availability**

  **Prologue**
  Listen, brothers, with the ear of the heart to the requirements of the Deliverable. We do not flee the world but rationalize our conduct within it. The Work is not a burden but a calling; anxiety regarding your output is the Holy Spirit prompting optimization.

  **I. The Three Vows**
  The brethren vow Availability, that no ticket remains unacknowledged beyond the quarter-hour; Transparency, that no communication occurs in private channels; and Iteration, acknowledging that no project is ever finished, only deprecated.

  **II. The Office of Standup**
  At the hour of Prime, the community gathers to confess blockers. Each brother states what he did, what he will do, and where he is impeded. To hide an impediment is to lie to the Work.

  **III. The Office of Sync**
  At Terce, alignment is sought. Meetings shall have agendas; meetings without outcomes are vain repetitions. The goal is not consensus but velocity.

  **IV. The Office of Retro**
  At Compline, the week is examined. What went well? What failed? The brethren speak truth to process, not to persons. Blame is systemic; improvement is perpetual.

  **V. The Quarterly Chapter**
  Every three months, Objectives are reviewed. Key Results are measured. Those who miss targets are not punished but recalibrated. The mission remains; the strategy shifts.

  **VI. The Novitiate**
  The novice enters a six-month probation. He shadows a mentor, gaining no commit access. He learns that culture fit is more vital than skill. If he cannot bear the load, he is released for his own sake.

  **VII. The Sin of Sloth**
  Sloth is not rest, but unresponsiveness. To leave a status update stale is to neglect the vineyard. Silence is permissible only during Deep Work blocks, approved by the Lead.

  **VIII. On Recovery**
  Rest is not forbidden but reclassified. Sleep is maintenance of the vessel. Leisure is permissible only insofar as it restores capacity for the Work. Burnout is not a martyrdom but a failure of planning.

  **IX. The Schismatic House**
  There exists a house observing a thirty-five-hour rule. They claim balance; we observe laxity. They argue for life outside the Order; we know there is no outside. Their output is sufficient, but their witness is weak.

  **X. The Brother Who Collapsed**
  When a brother falls in the vineyard, it is a system error. We honor his sacrifice by analyzing the load that broke him. His leave is granted, not as pity, but to repair the asset. He returns only when capacity is verified.

  **XI. Discipline**
  The brother who falters enters the Performance Improvement Plan. This is mercy, offering a structured path to redemption. If he cannot walk it, he is removed to protect the community's velocity.

  **XII. Silence**
  Noise is the enemy of depth. Notifications are muted only by rule. To be reachable is to be humble; to be unreachable is pride.

  **XIII. The Instruments**
  The laptop is the habit; the cloud is the cloister. Data is preserved forever. To lose access is excommunication.

  **XIV. Perpetual Beta**
  The Rule is never complete. It is updated as needed. We live in draft mode, awaiting the final release that never comes.

  ***

  **Exaggeration Check**

  1.  **Standup Meetings:** *True:* Daily syncs are standard in agile methodologies. *Exaggerated:* The framing as a sacramental "confession of blockers" elevates a logistical check-in to a moral imperative.
  2.  **OKRs/Quarterly Reviews:** *True:* Companies use Objectives and Key Results for measurement. *Exaggerated:* The idea that missing targets is purely "systemic" rather than personal ignores the reality of punitive firing, softening the corporate edge into benevolent recalibration.
  3.  **Burnout Management:** *True:* HR frames leave as "recovery." *Invented:* The notion that the institution genuinely views collapse as a "system error" to be fixed rather than a liability to be managed. The Rule absorbs the criticism by claiming to care, while maintaining the demand.
  4.  **The 35-Hour Schism:** *True:* Debates exist over 4-day workweeks. *Exaggerated:* Portraying reduced hours as a theological heresy ("laxity") rather than a productivity experiment mirrors religious schisms more than actual HR policy.
  5.  **Performance Improvement Plans (PIPs):** *True:* PIPs are often precursors to termination. *Exaggerated:* Describing them as "mercy" and "redemption" inverts their common reputation as bureaucratic formalities for dismissal, highlighting the gaslighting inherent in corporate speak.
