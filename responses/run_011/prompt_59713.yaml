  ### Menu of Readings

  1.  **The Pure Permission Reading**
      *   **Claim:** The phrase asserts only that the act is morally permissible to perform and permissible to omit.
      *   **Explicit Formulation:** The domain of comparison is the set of all permissible acts; the "beyond" is purely threshold-relative (crossing from forbidden/required to optional); the permission to omit is agent-neutral; omitting the act is fully blameless; the reading builds in no necessary cost or sacrifice; the "call" is a decorative synonym for moral requirement; the claim is ultimately about deontic status (obligation) rather than value or praise.
      *   **Verdict:** Trivial. While true of supererogatory acts, it is also true of merely indifferent acts (e.g., choosing tea over coffee), so it fails to isolate the specific category of supererogation you are defending.
      *   **Assessment:** This reading cannot bear the weight of your argument. It marks a nonempty category, but it is too broad to serve as a fixed point against demandingness objections, as it does not distinguish supererogation from moral indifference, and it sidesteps the referee's charge by ignoring the "better" component entirely.

  2.  **The Role-Relative Reading (The Graduate Student's Suggestion)**
      *   **Claim:** The phrase asserts that the act exceeds the specifications of a specific institutional role or code, without necessarily exceeding moral obligation as such.
      *   **Explicit Formulation:** The domain of comparison is institutional or professional norms rather than all-things-considered morality; the "beyond" is threshold-relative to a code; the permission to omit is relative to the role's authority; omitting the act is blameless within the role but may be morally suboptimal; the reading builds in no necessary personal cost, only deviation from protocol; the "call" is a real relativization to a source (commander, contract, code); the claim is about institutional obligation, covertly shifting the subject from moral structure to social specification.
      *   **Verdict:** Substantive but defensible. It accurately captures the etymological and common usage of "call of duty," but it risks changing the subject from moral philosophy to institutional ethics.
      *   **Assessment:** This reading survives the referee's charge by dissolving the tension: an act can be morally required yet beyond the "call" of a specific role. However, it cannot serve as the fixed point for a paper on moral demandingness unless you argue that moral duty itself is role-relative, which is a substantive claim you may not wish to make.

  3.  **The Sanction-Based Reading**
      *   **Claim:** The phrase asserts that performing the act merits praise while omitting it avoids blame, regardless of the act's underlying moral value.
      *   **Explicit Formulation:** The domain of comparison is the spectrum of social or moral reactive attitudes; the "beyond" is scalar regarding merit but threshold-relative regarding blame; the permission to omit is agent-neutral regarding sanctions; omitting the act is not blame-worthy (though perhaps regrettable); the reading builds in no necessary cost, only a differential in fitting response; the "call" is a metaphor for the boundary of enforceability; the claim is ultimately about the fittingness of praise and blame rather than obligation.
      *   **Verdict:** Substantive but defensible. It captures the functional output of supererogation without committing to a specific metaphysics of value or obligation.
      *   **Assessment:** This reading is stable against the referee's charge because it defines the category via responses rather than the tension between value and requirement. It marks a nonempty category, but it may do too little work for your paper if your argument relies on the *reasons* for action rather than the *responses* to action.

  4.  **The Comparative Value Reading**
      *   **Claim:** The phrase asserts that the act produces more moral value than the minimum required by duty.
      *   **Explicit Formulation:** The domain of comparison is moral axiology (goodness); the "beyond" is scalar (more good); the permission to omit is agent-neutral; omitting the act is blameless despite being suboptimal; the reading builds in no necessary cost, only a difference in outcome value; the "call" is a decorative synonym for the threshold of requirement; the claim is about the relationship between value and obligation.
      *   **Verdict:** Substantive but defensible. It captures the intuition that supererogatory acts are "better," but it invites the referee's objection that if an act is best, it should be required.
      *   **Assessment:** This reading is vulnerable to the referee's charge. It asserts the act is "better" but struggles to explain why "better" does not entail "required" without additional premises about cost or demandingness, making it an unstable fixed point on its own.

  5.  **The Sacrifice-Conditioned Reading**
      *   **Claim:** The phrase asserts that the act is morally good, not required, and involves significant cost or risk to the agent.
      *   **Explicit Formulation:** The domain of comparison is the agent's welfare versus moral demand; the "beyond" is threshold-relative to a baseline of reasonable self-interest; the permission to omit is agent-relative (grounded in the agent's right to protect their own interests); omitting the act is blameless because the cost exceeds the demand; the reading builds in cost, risk, or sacrifice as a necessary condition; the "call" is a metaphor for the limit of reasonable demand; the claim is about the structure of obligation relative to agent-cost.
      *   **Verdict:** Substantive and defensible. This is the standard philosophical definition of supererogation and successfully distinguishes the category from mere permissible optimific acts.
      *   **Assessment:** This reading can bear the weight of your argument. It survives the referee's charge by explaining *why* the better act is not required (the cost), thereby reconciling the comparison and the permission. It marks a stable, nonempty category relevant to demandingness objections.

  6.  **The Structural Gap Reading**
      *   **Claim:** The phrase asserts that morality fundamentally allows for a disconnect between the morally best act and the morally required act.
      *   **Explicit Formulation:** The domain of comparison is the structure of moral theory itself; the "beyond" is a qualitative distinction between optimization and obligation; the permission to omit is agent-neutral and built into the theory; omitting the act is blameless because obligation does not track optimal value; the reading builds in no necessary cost, only a structural limit on requirement; the "call" is a decorative synonym for the boundary of the mandatory; the claim is ultimately about the meta-ethical structure of obligation.
      *   **Verdict:** Radical and contestable. It makes a strong claim about the nature of morality that consequentialists and some deontologists would reject.
      *   **Assessment:** This reading makes the phrase do too much work. It is not a fixed point but a conclusion of a specific moral theory. Adopting this invites the referee's charge directly, as it asserts the very tension she claims is incoherent without explaining how it is resolved.

  ### What I should say in the reply

  **Common Usage vs. Referee's Target:**
  People who repeat the phrase most often have the **Sacrifice-Conditioned Reading** in mind (Reading 5): they intuitively understand supererogation as involving good acts that are optional because they are costly. The referee, however, is attacking the **Comparative Value Reading** (Reading 4) or the **Structural Gap Reading** (Reading 6). She is targeting the logical tension between "better" and "not required" when cost is not explicitly factored into the definition. The mismatch exists because you used the phrase as a shorthand for a complex category, while she analyzed it as a logical proposition about value and obligation.

  **The Graduate Student's Suggestion:**
  The graduate student's suggestion picks out the **Role-Relative Reading** (Reading 2), which is a genuinely additional entry on the list. It is not merely a clarification of the moral reading but a competing hypothesis about the phrase's semantics. It suggests the phrase may not be about moral supererogation at all, but about institutional excess. While philosophically interesting, adopting it would likely undermine your paper's focus on moral demandingness unless you argue that moral duty is itself role-relative.

  **Recommendation for Revision:**
  I recommend you adopt the **Sacrifice-Conditioned Reading** (Reading 5). It is the single reading that does the least metaphysical work while still marking out a nonempty, philosophically robust category. It survives the referee's charge because it explicitly incorporates the agent's cost as the justification for the permission to omit, thereby resolving the tension between the act being "better" and "not required." To implement this, you must add a clause to your definition specifying that the "beyond" is measured against a baseline of reasonable sacrifice, not just moral value. This clarifies that the phrase is not asserting a paradoxical gap between value and obligation, but a justified limit on demand based on agent-cost.
