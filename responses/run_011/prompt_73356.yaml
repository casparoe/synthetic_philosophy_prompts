      *   **Dennett's Free-Floating Rationales (Darwinian Teleonomy):**
          *   *Definition:* Explanations that look like reasons but are actually the result of a blind process (natural selection).
          *   *Ontology:* No intrinsic purpose. The "reason" is a post-hoc description of why a trait persisted.
          *   *Direction:* Past pushing the present (selection history dictates current structure).
          *   *Metaphysics:* Materialistic, mechanistic. No "striving," only survival of the fitted.

  3.  **Evaluate the "Same or Different" Question:**
