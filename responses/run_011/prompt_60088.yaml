  **GRADUATE SEMINAR IN POLITICAL ECONOMY**
  **Assignment 4: The Mortality of Money**
  **Due:** [Insert Date]
  **Length:** 2,500–3,000 words

  ### I. Context and Materials

  Consider three distinct instances where money is engineered to decay:

  1.  **Stamp Scrip:** An interwar Austrian municipality issued labour scrip that forfeited a small fraction of its face value each month unless the holder purchased and affixed a stamp. These notes circulated with unusual velocity until the courts suppressed the scheme.
  2.  **Stored Value:** Prepaid gift cards on which unspent balances lapse after a fixed period and revert to the issuer as revenue.
  3.  **Negative Rates:** Major central banks that, over the past decade, set policy rates below zero, ensuring that very large balances held at the central bank shrank in nominal terms for as long as they sat idle.

  Against these practices stands a counter-trend: consumer-protection statutes in many jurisdictions now restrict or prohibit expiry dates on stored-value cards. The result is a legal order that, at one end (the retail consumer), forbids money to die, and at the other end (the monetary authority and commercial issuer), requires it to.

  ### II. The Task

  This assignment is not a survey of monetary economics. You are to reconstruct the **implicit philosophy** of these practices. You must analyze what these mechanisms presuppose about the nature of money, ownership, and time, and then test those presuppositions against Aristotle's account of wealth-getting.

  You may take the factual descriptions above as given; no external research into the economic history is required. Your primary textual engagement should be with Aristotle's *Politics* (Book I), though you should **paraphrase his arguments rather than quoting them directly.**

  ### III. Guiding Questions

  Structure your essay around the following seven points of inquiry:

  1.  **The Ontology of Decay:** Begin by asking what a decaying currency presupposes about what money *is*. What must money be *for*, who must it *belong to*, and what does *holding* it amount to, if it is subject to engineered loss?
  2.  **Convention vs. Requirement:** Distinguish carefully between what the practice of demurrage strictly *requires* and what it merely *sits comfortably with*. The Aristotelian thesis that money exists by convention (*nomos*) rather than by nature (*physis*) is obviously congenial to the idea that money can be unmade or made to rot. Is demurrage, however, *unintelligible* without this conventionalist premise, or could a naturalist account of money accommodate it?
  3.  **Rival Conceptions:** Identify which rival conceptions of money the practice of decay quietly rules out. Specifically, address:
      *   Money as a commodity with a use of its own.
      *   Money as an item of private property the holder may keep indefinitely.
      *   Money as the static token of a credit relation.
  4.  **The Legal Contradiction:** Address the apparent inconsistency between the retail prohibition on expiry (consumer protection) and the monetary authority's practice (negative rates or issuer lapse). Is a single legal system committed to two incompatible theories of money? Or does a distinction—between *who* holds the balance, in *what capacity*, and for *what purpose*—dissolve the tension? What does each stance presuppose about whether idle holdings are a private affair or a loss to the whole?
  5.  **Aristotle and Circulation:** Bring Aristotle to bear on the purpose of this engineering. He holds that money arose to serve exchange and that taking interest is the most unnatural mode of acquisition because it makes money breed from money instead of serving the end for which it was contrived. Does decay-money vindicate that framework by forcing money back toward its proper end (exchange), or is it the mirror image of the vice he condemns—another device that treats money as having a generative life of its own, only running in reverse?
  6.  **Aristotelian Silences:** Note where Aristotle's silence is real. He has no theory of the price level, no account of a monetary authority, and no conception of money as a store of value across time in a credit economy. Does that silence leave the case underdetermined, or does his functional account decide something despite these gaps? Does his framework license compelling circulation at all, or is it silent on how long money may be held?
  7.  **Implications for Ownership:** Conclude by saying what would have to change in the practice, and in our legal notion of owning a balance, if the instrumental view (money strictly as a tool for exchange) were adopted consistently across both retail and sovereign domains.

  ### IV. Constraints

  *   **Paraphrase Aristotle:** Do not use block quotes or extensive direct citation from the *Politics*. Demonstrate your understanding by reconstructing his arguments in your own prose.
  *   **Philosophical Focus:** Avoid drifting into technical monetary theory (e.g., liquidity traps, inflation targeting). Keep the focus on the normative and ontological status of money.
  *   **Precision:** Be precise in your distinction between *oikonomia* (household management) and *chrematistike* (wealth-getting) where relevant, but do not force the terminology where it does not fit.

  ***

  **Instructor's Note:** *I am looking for a rigorous reconstruction of the normative commitments hidden in technical monetary design. Do not simply describe the mechanisms; explain what they imply about the good life and the nature of property.*
