answer: |-
  **Adjudication of the Elena–Marcus Exchange**

  **Move 1 (Elena): Strong**
  Elena correctly identifies that high-fidelity copying is the exception, not the rule, in cultural transmission.
  *   **Holds up:** The claim that recipients reconstruct information based on inference and background knowledge is well-supported by cognitive psychology.
  *   **Fails:** The assertion that statistical stability (attractors) cannot constitute heredity ignores that biological heredity is also statistical, not absolute.

  **Move 2 (Marcus): Strong**
  Marcus accurately defends the abstraction level required for evolutionary theory to function across different substrates.
  *   **Holds up:** The definition of selection as "heritable variation in fitness" without specifying mechanism is the standard Darwinian algorithm.
  *   **Fails:** Equating guided reconstruction with replication risks stretching the definition of "replicator" until it loses discriminatory power.

  **Move 3 (Elena): Compelling**
  This is Elena's strongest theoretical strike, leveraging a historical problem that nearly sank Darwinism itself.
  *   **Holds up:** Blending inheritance does mathematically swamp selection unless variance is replenished rapidly; culture blends far more than DNA.
  *   **Fails:** The claim that mechanism-neutrality makes a theory untestable is too harsh; it makes it harder to test, not impossible.

  **Move 4 (Marcus): Plausible**
  Marcus offers a standard cultural evolution defense, but it relies on an assumption that is difficult to operationalize.
  *   **Holds up:** Inheritance of acquired characteristics (Lamarckism) is compatible with evolutionary modeling, provided transmission biases are accounted for.
  *   **Fails:** The analogy between cultural "motifs" and genetic loci is weak; unlike nucleotides, motifs lack objective boundaries and are often defined post hoc by the researcher.

  **Move 5 (Elena): Strong**
  Elena pinpoints the reductionist risk: if psychology explains the stability, memetics may be merely descriptive.
  *   **Holds up:** The charge that "fitness equals persistence" is tautological if fitness cannot be measured independently of survival.
  *   **Fails:** Dismissing population-level patterns as mere aggregates ignores that complex systems often exhibit emergent properties not predictable from individual components.

  **Move 6 (Marcus): Compelling**
  Marcus successfully identifies the unique explanatory power of population-level thinking.
  *   **Holds up:** The observation that cultural variants often spread *against* individual preference (e.g., costly norms, misinformation) demonstrates selection pressures distinct from individual psychology.
  *   **Fails:** He does not fully explain how to measure these selection pressures independently of the outcome, leaving the tautology concern partially unresolved.

  ***

  **The Real Crux**
  The dispute is not primarily about the world, but about **explanatory autonomy**. Elena argues that cultural evolution is not a standalone science because its mechanisms reduce entirely to cognitive psychology; Marcus argues that population-level dynamics generate patterns that psychology alone cannot predict or explain. They are disagreeing on what a theory has to do to earn its keep: Elena demands mechanistic specificity, while Marcus demands predictive adequacy at the macro scale.

  **Substantive Omissions**
  Both participants ignored **Dual Inheritance Theory**, the established framework that models genes and culture as co-evolving systems, which would have bridged the "blending" objection. They also neglected **niche construction**: the fact that culture alters the environment, which in turn alters selection pressures, a feedback loop that neither "attractors" nor "replicators" fully captures. Finally, the debate lacked **empirical anchors**; no specific case studies (e.g., the evolution of tool technologies or kinship systems) were cited to test the theoretical claims against data.
