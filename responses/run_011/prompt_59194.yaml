      *Wait, looking closer at M4:* The claim that motifs are like nucleotides is controversial. "Plausible" is fair.
      *Looking at E5:* The tautology charge is a bit old-school (selection isn't tautological if fitness is defined independently), but her point about psychology doing the work is strong. "Strong" fits.

      *Crux:* Explanatory Autonomy.
      *Omissions:* Dual Inheritance, Empirical Data, Niche Construction.

