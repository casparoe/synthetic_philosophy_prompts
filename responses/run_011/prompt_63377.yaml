prompt: |-
  I'm in a philosophy of language seminar this semester and truth theories are next week's topic. Walking to campus I listened to a podcast where a philosophy professor (a real one, I think — he had a book out) tried to set up the Liar for a general audience, and I jotted down the gist on my phone right after. So this is my paraphrase of his summary, not a transcript, and I've probably smoothed it out a bit:

  Tarski proved that a language can't contain its own truth predicate. Take any language expressive enough to do arithmetic and add a predicate meant to pick out exactly its own true sentences, and you can derive a contradiction. So truth has to live one level up, in a metalanguage that's strictly richer than the language it's about, which means there's no such thing as truth for a semantically closed language like English. On that picture the Liar isn't really paradoxical at all — the sentence just isn't well-formed material in any respectable language, so there's nothing to explain. Kripke later found a way around this. Instead of building truth top-down, you build it bottom-up: start with the sentences that don't involve any semantic notions, assign them values, then use those to settle the semantic sentences, and keep going until nothing changes. Where the process stabilizes you have a fixed point, and at a fixed point you have a language that really does contain its own truth predicate, consistently. The Liar ends up in a gap — neither true nor false, basically meaningless, like a category error. So Kripke beat Tarski: English can have its own truth predicate after all, you just have to give up the idea that every meaningful sentence is either true or false.

  That last line is the part that stuck with me, and I'll admit I lean toward thinking he's right — gaps feel like a pretty reasonable move, and 1975's Outline is on our syllabus anyway. But when someone repeated basically this in section, our TA made a face and moved on, and I couldn't tell what she'd have objected to.

  Can you go through my reconstruction claim by claim and tell me what someone who actually works on truth would sign off on, what's a fair simplification for a general audience, and what's just wrong? In particular: is the way he sets up Tarski's result accurate, or has he quietly changed what the theorem says? Does his description of the bottom-up construction match what the construction does, including that bit about when it stabilizes? And then the main question — once you fix whatever's inaccurate, does the Kripke-beat-Tarski conclusion survive, or was it leaning on the parts that don't hold up? Also tell me the biggest thing his summary leaves out that threatens his own ending, since I'm pretty sure that's what the TA was reacting to.

  Please write the whole thing in American English.
