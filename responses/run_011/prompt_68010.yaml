      *   *Let's look at the User's constraint:* "Keep (1) and (2)." (2) says "On BASE... value is V." It doesn't explicitly say "On SIM... value is 0." (3) does that work.
      *   *Decision:* The most robust philosophical objection is to (3) regarding moral status. The most robust *strategic* objection for a longtermist is to (4) regarding causal leverage. I should present both, but highlight (3) as the fundamental category error.
      *   *Generalizability:* This is critical. If I believe $p > 0$, do I stop caring about climate change today? If the argument holds, yes. That's a *reductio*.

  7.  **Structuring the Response:**
