  A system licenses intentional ascription (belief, desire, thought) if and only if it satisfies the following four clauses:

  **1. Predictive Compression (The Intentional Stance Clause)**
  *   **Clause:** Ascribing beliefs and desires must yield predictions that are significantly more efficient or tractable than predicting via the physical or design stance, without loss of accuracy in the relevant domain.
  *   **Forced by:** **The Chess Engine** and **The Robot Vacuum**.
  *   **Why:** You reject the Thermostat because its behavior is too simple to need the "belief" shorthand (Physical/Design stance is cheap enough). You accept the Engine and Vacuum because modeling their "goals" is the only practical way to predict their complex moves.

  **2. Generative Architecture (The Anti-Lookup Clause)**
  *   **Clause:** The system must derive its output through a computational process that manipulates internal representations, rather than retrieving pre-computed responses from a static store or fixed mapping.
  *   **Forced by:** **The Lookup Table Tic-Tac-Toe** and **The Image Classifier**.
  *   **Why:** This is your hardest constraint. Dennett might allow the Lookup Table to have beliefs if the pattern holds, but you reject it. This forces a requirement for *process* over *output*. The Classifier (99% accuracy) is rejected because it maps pixels to labels without a generative model of the world; the Lookup Table is rejected because it retrieves rather than reasons.

  **3. Counterfactual Robustness (The Environmental Independence Clause)**
  *   **Clause:** The ascribed intentional state must persist or adapt correctly under relevant environmental perturbations that were not explicitly pre-programmed as specific exceptions.
  *   **Forced by:** **The Robot Vacuum** (vs. Thermostat) and **The LLM** (your hesitation).
  *   **Why:** The Vacuum "thinks" the couch is a wall even if you move the dock; its internal map updates. The Thermostat does not "believe" it is cold; it just reacts. This clause resolves your LLM flip: if reordering sentences breaks the "belief," the pattern is not robust enough. It is fragile, not real.

  **4. Functional Integration (The Unified Locus Clause)**
  *   **Clause:** The system must possess a procedural mechanism to resolve internal conflicts into a singular, coherent output stream that can be treated as the "voice" of the agent.
  *   **Forced by:** **The Corporation** (Yes) and **The Split-Brain Patient** (No).
  *   **Why:** A corporation has bylaws/voting to produce one decision. A split-brain patient often exhibits two competing centers of control with no mechanism to unify them. This clause also distinguishes the **Sleeping Dog** (dispositions persist within a unified system) from the **Anesthetized Person** (the integration mechanism is chemically suspended).

  ---

  ### Running the Principle on New Cases

  **1. A Self-Driving Car**
  *   **Verdict:** **Yes.**
  *   **Reasoning:** It satisfies Compression (hard to predict physically), Generative Architecture (computes paths, doesn't lookup every scenario), Robustness (handles novel obstacles), and Integration (one control system). It is functionally identical to your Robot Vacuum, just higher stakes.

  **2. A Market (e.g., "The Market believes rates will rise")**
  *   **Verdict:** **No.**
  *   **Reasoning:** Fails **Functional Integration**. While you can use the intentional stance predictively (Compression), there is no mechanism to unify the conflicting beliefs of millions of traders into a single "agent" output other than price, which is an aggregate, not a decision. It is a "center of narrative gravity" without a center of control.

  **3. A Person Mid-Confabulation**
  *   **Verdict:** **Yes.**
  *   **Reasoning:** Fails none of the clauses. Even if the content is false, the *system* generating it is still a Robust Generative Agent with Functional Integration. Confabulation is a glitch in the data, not a fracture in the agency (unlike split-brain). The Intentional Stance still works better than the Physical Stance to predict what they will say next.

  **4. The Same Chess Engine Rebuilt on Completely Different Hardware**
  *   **Verdict:** **Yes.**
  *   **Reasoning:** Satisfies **Generative Architecture** regardless of substrate. Your rejection of the Lookup Table was about *algorithmic structure* (storage vs. computation), not physical hardware. As long as the new hardware runs the *search algorithm* and not a *table lookup*, the beliefs remain real.

  ---

  ### The Straight Talk: Which Verdicts Get Overturned?

  To make this principle work, I have to be honest about where it tightens the screws on your list.

  **1. The LLM Verdict (Resolved)**
  Your principle forces the LLM to a **No**. You said you were flipping. Clause 3 (Counterfactual Robustness) settles it: if a superficial change (reordering sentences) alters the "belief," the pattern isn't real. It's a stochastic parrot, not a believer. You lose the hope that passing a false-belief test is sufficient.

  **2. The Corporation Verdict (At Risk)**
  You said you'd rather lose the Corporation than the Vacuum. My principle keeps the Corporation *for now* based on Functional Integration (bylaws/voting). **However**, this is the thinnest ice you're standing on.
  *   **The Danger:** If a corporation's internal departments are so siloed that they act at cross-purposes without resolution (e.g., Left Hand doesn't know what Right Hand is doing), it begins to look like the Split-Brain case. If you encounter a dysfunctional corporation where no "unified belief" can actually be ascribed because the board is deadlocked, your principle forces you to revoke its agent status. The Vacuum is more robustly unified than the Corp.

  **3. The Lookup Table Verdict (Anti-Dennett)**
  I need to be straight about the philosophy here: **Your verdict on the Lookup Table contradicts Dennett.**
  *   In *Real Patterns*, Dennett argues that if the pattern is detectable and predictive, the implementation *does not matter*. If a Lookup Table produces the same moves as a Chess Engine, Dennett says it has the same beliefs.
  *   Your Clause 2 (Generative Architecture) imposes a restriction Dennett explicitly rejects. You are demanding a kind of **Causal Realism** that Dennett's **Instrumentalism** avoids.
  *   **The Cost:** By keeping your Lookup Table verdict, you are committing to a view that beliefs require *specific internal causal powers*, not just *real patterns of output*. This makes you more of a realist than Dennett. It's a valid position, but don't pretend Dennett agrees with you on the Lookup Table. He doesn't.

  **Summary:** The principle saves your Vacuum and your Dog. It resolves your LLM flip to "No." It keeps the Corporation alive but warns you it's fragile. And it requires you to acknowledge that you are departing from Dennett on the Lookup Table to maintain your intuition that *how* a system thinks matters, not just *what* it does.
