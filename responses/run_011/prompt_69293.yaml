      *   *Key Insight:* The case is essentially a "Deviant Causal Chain" or "Accidental Reliability" case disguised as a Gettier. The real fight is against Simple Reliabilism, not necessarily Modal accounts (since Modal accounts can bite the bullet and say it *is* knowledge, or tweak method individuation).
