answer: |-
  Here is a disambiguation of the sentence "there is no self," structured as a menu of distinct theses ranging from the modest to the radical, followed by an analysis of your reading group's disagreement.

  ### The Menu of Theses

  **1. The Anti-Cartesian Thesis**
  *   **The Claim:** There is no immaterial, simple, and unchanging soul-substance distinct from the body and mind.
  *   **Type of Claim:** About what exists fundamentally (denies substance dualism).
  *   **Conventional Persons/Psychological Continuity:** Fully compatible. Persons exist as complex biological and psychological organisms.
  *   **Vulnerable to Memory/Agency Objection?** No. A physical/psychological system can remember and act without an immaterial soul.
  *   **Ontological Weight:** Near-trivial (accepted by most non-dualists).

  **2. The Reductionist Thesis (The "No Further Fact" View)**
  *   **The Claim:** A person is nothing over and above a causally connected series of physical and mental events; there is no extra "self" entity that *has* these experiences.
  *   **Type of Claim:** About what exists fundamentally (mereological reductionism).
  *   **Conventional Persons/Psychological Continuity:** Compatible. Persons exist as composite wholes, identical to their parts/relations (like a chariot or a flame).
  *   **Vulnerable to Memory/Agency Objection?** No, provided agency is understood as a causal process within the series rather than an act by a distinct agent.
  *   **Ontological Weight:** Moderate (standard materialist/Parfitian view).

  **3. The Two-Truths Thesis (Ultimate Emptiness)**
  *   **The Claim:** Selves do not exist *ultimately* (independently, intrinsically), but they do exist *conventionally* (dependently, nominally).
  *   **Type of Claim:** About modes of existence (distinguishes ultimate ontology from pragmatic ontology).
  *   **Conventional Persons/Psychological Continuity:** Explicitly preserves them. Conventional existence is sufficient for language, memory, and karma.
  *   **Vulnerable to Memory/Agency Objection?** No. The objection confuses ultimate existence with conventional existence. Agency operates at the conventional level.
  *   **Ontological Weight:** Moderate-to-High (requires a metaphysical framework distinguishing two levels of truth).

  **4. The Phenomenological Thesis (The Bundle View)**
  *   **The Claim:** Introspection never reveals a "self," only a stream of experiences; the sense of a unified subject is an illusion of memory.
  *   **Type of Claim:** About how experience is structured from the inside.
  *   **Conventional Persons/Psychological Continuity:** Compatible, but treats the "person" as a useful fiction constructed by memory.
  *   **Vulnerable to Memory/Agency Objection?** Minimally. It must explain how the illusion of agency arises, but does not deny the causal reality of the actions.
  *   **Ontological Weight:** Moderate (Humean view).

  **5. The Eliminativist Thesis**
  *   **The Claim:** There is no subject of experience whatsoever; talk of "persons" or "selves" refers to nothing real, not even conventionally.
  *   **Type of Claim:** About what exists at all (ontological denial).
  *   **Conventional Persons/Psychological Continuity:** Incompatible. Denies the reality of the conventional person.
  *   **Vulnerable to Memory/Agency Objection?** **Yes.** If nothing exists to bear the relation, memory and moral responsibility become unintelligible.
  *   **Ontological Weight:** Ontologically extravagant (radical nihilism).

  **6. The Soteriological Thesis (Normative Non-Identification)**
  *   **The Claim:** One should not *identify* with or *cling* to the concept of a self, regardless of its metaphysical status.
  *   **Type of Claim:** About which practical attitudes are appropriate.
  *   **Conventional Persons/Psychological Continuity:** Compatible. One can function as a person without ego-attachment.
  *   **Vulnerable to Memory/Agency Objection?** No. This is a prescription for living, not a description of metaphysics.
  *   **Ontological Weight:** Variable (depends on the underlying metaphysics).

  ***

  ### Diagnosis of the Disagreement

  **Member 1 (The Reductionist)**
  This member is relying on **Thesis 2 (The Reductionist Thesis)** supported by **Thesis 3 (The Two-Truths Thesis)**.
  When they say "a person is nothing over and above causally connected... events," they are asserting that the self is not a *further fact* beyond the physical/mental stream. They assume that "there is no self" means "there is no *substantial* self," while implicitly granting that the causal stream (the conventional person) is robust enough to sustain survival interests and psychological continuity. They are operating within a framework where conventional existence is sufficient for agency.

  **Member 2 (The Skeptic)**
  This member is interpreting the sentence through **Thesis 5 (The Eliminativist Thesis)**.
  When they argue that "without a self there is no one to remember," they are assuming that "there is no self" entails the non-existence of the subject *simpliciter*. They are treating the slogan as a denial of the entity required to ground logical predication (the bearer of properties). They are failing to distinguish between ultimate non-existence and conventional non-existence.

  **Does the Disagreement Survive?**
  The disagreement **dissolves into a dispute over which thesis the slogan was ever meant to carry**, provided Member 2 accepts that conventional persons can bear moral responsibility.

  Member 2's objection (that there is "no one" to remember) is a category error against Member 1's position. Member 1 is not denying the existence of the causal stream that remembers; they are denying that the stream requires a *owner* distinct from the stream. Member 2 is attacking a straw man (Thesis 5) that Member 1 is not defending.

  However, a **residual substantive disagreement** may survive if Member 2 insists that *conventional* existence (Thesis 3) is insufficient for moral responsibility or memory—that only an *ultimately* existing self can truly "bear consequences." If Member 2 holds this view, the dispute is no longer about the meaning of "no self," but about the metaphysical requirements for agency. In the context of a Buddhist reading group, however, this is typically resolved by accepting the Two-Truths framework: karma operates conventionally, even if agents are empty ultimately. Thus, the friction is primarily verbal, arising from treating a nuanced soteriological/reductionist claim as a blunt ontological elimination.
