answer: |-
  Here is a proposed run-of-show with ten questions. I have ordered them to move from the intuitive motivation to the metaphysical machinery, then to the hard pressure cases, and finally to the empirical payoff.

  ### A Note on Your Bullets
  I recommend swapping your **Spectrum Inversion/Inverted Earth** bullet for a question about **Simultaneous Comparison**.

  **Why:** Calibration drift relies heavily on *temporal* comparison (comparing present coffee to past coffee memory). Inverted Earth and spectrum inversion are usually diachronic or rely on memory failure. She can easily say, "In those cases, the standard drifted to match the new input." A case where a subject compares two stimuli *side-by-side* (e.g., two color chips) removes the memory element. If the standard is what classifies the state, what calibrates the standard in the immediate present? This forces her to explain the mechanism without leaning on the "drift over time" defense.

  ***

  ### The Interview Flow

  **1. The Coffee Case (Entry)**
  "Let's start right in the middle of the coffee case. You argue that when a long-time drinker suddenly finds their usual brew undrinkable, we shouldn't say the qualia changed, nor that their judgment changed. We should say their *calibration standard* shifted. But in the moment of that first sip where they recoil, the subject feels betrayed by the coffee, not by their own ruler. Why is the phenomenology of 'rejection' better explained by a shift in the measuring stick than a shift in the thing being measured?"

  *   **Follow-up:** "If the subject reports 'It tastes different,' and you say 'No, the taste is constant, your standard moved,' aren't you privileging the theorist's third-person account over the subject's first-person authority? What gives the theorist the leverage to correct the report?"

  **2. The Metaphysics of the Standard**
  "You distinguish the 'standard' from a mere 'disposition to judge.' If I am disposed to call this coffee 'bitter' today but 'smooth' yesterday, that looks like a change in disposition. What content is added by positing a 'standard' as an intermediary entity? Is the standard a neural structure, a functional role, or something else?"

  *   **Follow-up (Anti-Verbal Dodge):** "I want to press on the 'merely verbal' escape route here. If you answer that the standard *just is* the complex disposition over time, then calling it a 'standard' seems to be a metaphor. If it is a metaphor, does that mean we should stop looking for neural correlates of the standard? Or does positing it as a distinct thing actually generate new hypotheses about where to look in the brain?"

  **3. Anchored Calibration (The Drug Case)**
  "Let's look at a case where calibration should plausibly stay anchored. If I take a drug that I *know* alters color saturation, and I see a red wall turn pink, my standard for 'red' shouldn't drift because I know the input is compromised. Yet the experience shifts dramatically. On your view, if the standard is fixed and the judgment is honest, what exactly is changing? If you say 'the representation,' does that collapse your view into standard representationalism?"

  *   **Follow-up:** "So in the drug case, you're willing to grant the experience changed, but in the coffee case, you deny it. What is the principled difference between a chemical intervention and a natural migration of taste that allows one to count as 'experience change' and the other as 'calibration drift'?"

  **4. Simultaneous Comparison (Swapped Inverted Earth)**
  "Calibration drift seems to do its heavy lifting over time, using memory to compare past and present. But consider a simultaneous match: I hold two color chips side-by-side and ask if they are the same. There is no memory lag here for the standard to drift against. If my calibration is off, do I see them as different when they are identical? If so, isn't that just an illusion of qualia, which brings us back to the eliminativist story you wanted to avoid?"

  *   **Follow-up:** "If you say the standard applies even in the immediate present, what sets the standard *now*? Is it fixed by evolutionary history? Because if it's fixed by history, then when the chips look different, you seem committed to saying the *intrinsic* look is the same, which sounds exactly like the qualia realism you reject."

  **5. The Introspective Seeming**
  "Let's talk about the 'what it's like' aspect. If all there is is calibration plus report, why does it seem to the subject that there is a private, intrinsic property sitting behind the report? Do you want to call that seeming an illusion, a bad description of something real, or neither?"

  *   **Follow-up:** "If it's a 'bad description of something real,' what is the 'real' thing being described? Is it the calibration process itself? Because if the process feels like a property, that suggests the calibration mechanism is opaque to the subject. How does opacity arise in a system that is supposedly just classifying its own states?"

  **6. Normativity and Error**
  "If standards drift, can a subject be wrong about their own calibration? If I say 'My standard for bitterness has shifted,' can I be mistaken about that? Or is the standard defined entirely by my actual usage?"

  *   **Follow-up:** "If I can't be wrong about my standard, then the standard is infallible. But if the standard is infallible, how does it explain error in judgment? It seems you've pushed the possibility of error back one step but eliminated it at the foundational level. Does that make the theory unfalsifiable?"

  **7. The Competitor (Representationalism)**
  "A representationalist says the content of the experience changes (the coffee represents 'undrinkable' now). You say the content is stable, but the classification standard changes. These look like notational variants. What is the specific claim about the world that is true on your view but false on the representationalist view?"

  *   **Follow-up (Anti-Verbal Dodge):** "I need to pin this down because 'notational variant' is a common way to dissolve this disagreement. If there is no observation that comes out differently, is your view a competitor to representationalism, or is it just a translation manual? If it's just a translation manual, why should we invest philosophical energy in learning your language rather than theirs?"

  **8. The Empirical Payoff**
  "Following up on that: Name an observation or experiment that would come out differently under your view than under plain representationalism. For example, should we expect to find 'standard-maintenance' neurons that function differently from 'content-representation' neurons?"

  *   **Follow-up:** "If you can't name one, what work is the view doing? Is it purely therapeutic, meant to stop us from asking bad questions? If so, has it worked on you, or do you still feel the pull of the qualia intuition yourself?"

  **9. The Cost of the View**
  "You say the realist and the eliminativist are each half right. But usually, when you split the difference, you inherit the problems of both. The realist worries about privacy; the eliminativist worries about explaining the data. What problem have you solved that they haven't, and what new problem have you created for yourself?"

  *   **Follow-up:** "Is the new problem that you've made the mind opaque to itself? If the standard is doing the work but the subject thinks the property is doing the work, isn't the subject systematically self-deceived? Is that a cost you're willing to bear?"

  **10. Closing (The Experiment)**
  "We started with coffee, let's end with science. If a grad student in the audience wants to test 'Calibration Drift' against 'Qualia Change' in the lab next week, what is the single most promising protocol they should run? Don't tell me what they'll find, tell me what they should measure."

  *   **Follow-up:** "And if that experiment yields null results—no difference between the groups—does that falsify calibration drift, or does it just mean the drift was uniform?"
