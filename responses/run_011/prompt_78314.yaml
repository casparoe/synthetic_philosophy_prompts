  # The Consistent Editorial Protocol (CEP)

  **Purpose:** To ensure decisions are principled, transparent, and resistant to manipulation, while respecting the journal's three criteria (Remit, Soundness, Originality).
  **Time Limit:** 15 Minutes per paper.
  **Participants:** 3 Editors + 1 Chair (Chair votes only to break ties; otherwise facilitates).

  ### I. Pre-Meeting Constraints (Set Once Per Term)
  1.  **Fixed Order:** To prevent agenda manipulation, criteria are always assessed in this order:
      1.  **Remit** (Gatekeeper: Does it fit the journal?)
      2.  **Soundness** (Foundation: Is the argument valid/true?)
      3.  **Originality** (Value: Does it contribute something new?)
  2.  **No Mid-Stream Rule Changes:** The aggregation rule below cannot be changed during a meeting.

  ### II. The Procedure (15 Minutes)

  **Step 1: Silent Reading & Scoring (3 Minutes)**
  *   **Action:** Editors silently review the submission and the previous round's notes.
  *   **Judgment Marker:** *Editors individually determine their initial stance on each criterion.*
  *   **Constraint:** No discussion yet.

  **Step 2: Criterion Voting (6 Minutes)**
  *   **Action:** The Chair puts each criterion to a vote in the **Fixed Order**.
  *   **Method:** Secret ballot (write 'Y' or 'N' on a slip) to prevent peer pressure and strategic lobbying.
  *   **Rule:** A criterion **Passes** if 2 or 3 editors vote 'Y'. It **Fails** if 2 or 3 vote 'N'.
  *   **Locking:** Once a criterion is voted on, the result is **Locked**.
      *   *Exception:* A Locked result may only be reopened if *all three* editors agree that a factual error occurred in the discussion (e.g., "We thought the author claimed X, but they claimed Y"). Strategic revision is prohibited.
  *   **Recording:** The Chair records the individual votes for each criterion in the **Internal Log**.

  **Step 3: The Consistency Check (3 Minutes)**
  *   **Action:** The Chair tallies the criteria.
      *   **Scenario A (Any Criterion Fails):** The paper is **Rejected**. Proceed to Step 4.
      *   **Scenario B (All Criteria Pass):** The paper is **Tentatively Accepted**.
  *   **The Override Clause:** In Scenario B, the Chair asks: *"Does any editor intend to vote Reject on the final decision despite these scores?"*
      *   **If No:** The paper is **Accepted**.
      *   **If Yes:** The committee has 2 minutes to identify *which* criterion justifies the rejection. Editors are ethically bound to align their criterion vote with their final decision.
          *   *Procedure:* Re-open the vote on the identified criterion. Editors may change their vote to reflect their holistic judgment.
          *   *Result:* If the criterion now fails, the paper is **Rejected**. If editors refuse to change their votes but still wish to Reject, the **Rule of Premise Binding** applies: The paper must be **Accepted**. (See Case 3).

  **Step 4: Recording & Notification (3 Minutes)**
  *   **Internal Log:** Must record:
      1.  Individual votes on Remit, Soundness, Originality.
      2.  Final Decision (Accept/Reject).
      3.  If Step 3 Override was used: Which criterion was re-opened and why.
  *   **External Rejection Notice:**
      *   **Standard Case:** Cite the specific criterion that failed the majority vote (e.g., "The committee found the argument did not meet our standard for Soundness").
      *   **Paradox Case (All Criteria Passed Majority, but Rejected via Override):** You must name a criterion to avoid vague feedback.
          *   *Rule:* Cite the criterion with the **lowest margin of support** (e.g., if Originality was 2-1 Pass, cite Originality).
          *   *Wording:* "While the paper addressed [Criterion], the committee determined it did not meet the threshold for publication in this area."
          *   *Truthfulness Check:* This does not misrepresent individual positions because the notice speaks for the *Committee's Collective Judgment*, not the individual ballot count. The Internal Log preserves the individual truth.

  ---

  ### III. Application to Test Cases

  #### Case 1: The Standard Split
  **Scenario:** Two editors find the argument Sound (S=Y, S=Y, S=N); only one finds it Original (O=Y, O=N, O=N).
  **Procedure Run:**
  1.  **Remit:** Passes (assumed).
  2.  **Soundness:** Passes (2-1).
  3.  **Originality:** Fails (1-2).
  4.  **Decision:** Immediate Rejection (Scenario A).
  5.  **Recording:** Internal Log shows the split. External Notice cites **Originality**.
  **Outcome:** Clean rejection. No paradox. The notice truthfully reflects the majority failure.

  #### Case 2: The Order Dependency
  **Scenario:** The paper passes Remit and Soundness. Its Originality depends on whether we consider its scope (Remit) first. If we judge Originality first, it seems novel; if we judge Remit first, it seems out of scope. The author has been told we assess Originality *before* Remit (contrary to our Fixed Order).
  **Procedure Run:**
  1.  **Constraint Check:** The CEP mandates **Remit $\to$ Soundness $\to$ Originality**.
  2.  **Action:** We must follow the CEP Fixed Order, not the author's expectation.
  3.  **Voting:** Remit is voted first. If it fails Remit, we stop. We do not vote on Originality.
  4.  **Decision:** If Remit fails, we Reject on Remit.
  5.  **Recording:** We record the failure on Remit.
  **Outcome:** The procedure prioritizes **procedural integrity** over author expectation.
  **Ethical Note:** We must inform the author in the rejection that "Submissions are assessed against Remit prior to Originality per our published guidelines," correcting the earlier misinformation. The procedure prevents the Chair from manipulating the order to save or kill the paper covertly.

  #### Case 3: The "Bad" Acceptance
  **Scenario:** All three criteria pass majority votes (2-1 on all). However, in the Consistency Check, all three editors privately agree the paper is dull and should be rejected. Two editors refuse to change their criterion votes to 'No' because they feel that would be dishonest (the argument *is* sound, it *is* original, just boring).
  **Procedure Run:**
  1.  **Tally:** All Criteria Pass.
  2.  **Consistency Check:** Editors express desire to Reject.
  3.  **Alignment:** Editors refuse to falsify criterion votes.
  4.  **Rule Application:** The **Rule of Premise Binding** activates. Since the criteria are the published standard for acceptance, and they are met, the procedure **licenses Acceptance**.
  5.  **Decision:** **Accept.**
  **Statement on Licensing:**
  *   **What the Rule Delivers:** An acceptance the committee collectively regrets.
  *   **What It Licenses:** It licenses publication. It obligates the committee to publish the paper.
  *   **What It Does NOT License:** It does *not* license the committee to secretly reject the paper, to add unstated criteria (e.g., "Interest"), or to misrepresent the voting record in the Internal Log.
  *   **Rationale:** This is the cost of rule-following. If the journal claims to judge on Soundness, Originality, and Remit, it cannot reject a paper that meets those standards without damaging its own credibility. The "bad decision" is a failure of the *criteria definitions*, not the *voting procedure*. The fix is to revise the criteria for the next term, not to break the rule for this paper.

  ---

  ### IV. Disputes the Procedure Cannot Settle

  1.  **Definition of Criteria:** The CEP assumes we agree on what "Soundness" means. If Editor 1 thinks Soundness requires formal validity and Editor 2 thinks it requires plausible premises, the vote will mask a deeper conceptual disagreement. The procedure aggregates votes, not meanings.
  2.  **Interpersonal Conflict:** If an editor votes 'No' on Soundness solely because they dislike the author, the secret ballot protects them, but the procedure cannot detect or prevent bad faith.
  3.  **The "True" Paradox:** If the committee rejects a paper via the Override Clause (Case 3 variation where they *do* change votes), the External Notice cites the "weakest" criterion. While procedurally honest, this may still feel like a misrepresentation to the author if the paper was technically sound but rejected for "fit." The procedure manages the lie, it does not eliminate the tension between technical compliance and holistic judgment.
  4.  **Chair Bias:** While the Chair's vote is limited, the Chair controls the *timer* and the *facilitation* of the Consistency Check. A Chair can pressure editors during the 2-minute alignment window ("Are you sure you won't change your vote?") without technically violating the rule.

  ### V. Summary of Recording Requirements

  To ensure the rejection notice is truthful:
  1.  **Internal Log:** Must preserve the **raw ballot data** (e.g., "Ed1: Y, Ed2: Y, Ed3: N"). This protects individual integrity.
  2.  **External Notice:** Must speak in the **Collective Voice** ("The committee found...").
  3.  **Citation Rule:**
      *   If a criterion fails majority: Cite that criterion.
      *   If all pass but Override is used: Cite the criterion with the **lowest majority margin**.
      *   **Prohibition:** Never cite a criterion as "Failed" in the External Notice if the Internal Log shows it passed Unanimously, unless the Override Clause was triggered and documented. In that specific case, use the phrasing: *"Did not meet the threshold for publication in [Criterion]."* This distinguishes technical passing from editorial sufficiency.
