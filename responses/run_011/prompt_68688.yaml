prompt: |-
  I'm a backend engineer, no philosophy background, so bare with me. I ran a survival analysis on ~2,000 startups: I coded how much "mission/craft" language vs. "market/growth" language showed up in their year-one public writing (blogs, readmes, careers pages). The mission-heavy ones were about 2x likelier to still exist at year five, and it holds up controlling for funding raised, headcount, sector, and whether the founders had prior exits.

  Our head of people, Dana, says this is evidence culture actually causes outcomes — Weber's protestant ethic argument wearing a hoodie — and that you can't explain what those founders did without getting what their words meant to them. Our data lead, Sam, says my coding is just a proxy for unobserved stuff (people who write like that are also the ones who manage cash flow conservatively), that a belief isn't the kind of thing that can be a cause since it shows up in no mechanism, and that even if it were I couldn't separate it from selection.

  Write a dialogue between Dana and Sam about whether my result supports "culture is a cause." Hard cap: 500 words. Neither one dumb — Dana especially needs more than hand-waving about meaning, and Sam needs more than "correlation isn't causation." They should answer each other's actual moves, and it should end unresolved.
