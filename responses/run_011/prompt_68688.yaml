answer: |-
  **Dana:** "Two times survival isn't noise, Sam. You controlled for funding, sector, exits. What's left?"

  **Sam:** "Omitted variable bias. Mission language correlates with conservative burn rates and slower hiring. They survive because they spend less, not because they 'believe' harder."

  **Dana:** "Why do they spend less? Because the mission constrains them. It's Weber's Protestant Ethic in a hoodie. The internal orientation dictates economic behavior. Beliefs constrain choice sets—that's a valid mechanism."

  **Sam:** "Then measure the constraint, not the belief. A belief has no causal power unless it changes physical action. If it does, the action is the cause. You're conflating the map with the territory. NLP tokens aren't levers."

  **Dana:** "Because the language *is* the coordination mechanism. It reduces transaction costs between hires. If I code 'craft' in year one, I attract engineers who stay longer. That retention is causal."

  **Sam:** "Selection bias. Founders who write that way also screen for loyalty over speed. You're measuring the founder's hiring heuristic, not the culture's efficacy. You can't separate the signal from the sender."

  **Dana:** "So you'd say a risk model predicts crashes, but the risk isn't real? Culture is a latent variable. You can't see gravity either, just the apple falling."

  **Sam:** "Gravity has a formula. 'Mission' is a bucket for unobserved confounders. If I swap the blog post but keep the cash flow, do they survive? No. Then the words aren't the cause."

  **Dana:** "But you can't swap the words without swapping the founders. The meaning is embedded. You're asking for a counterfactual that destroys the phenomenon. You can't isolate the variable without killing the host."

  **Sam:** "Then it's not science, Dana. It's hermeneutics. I need a mechanism I can intervene on. 'Write more about craft' won't save a burning runway."

  **Dana:** "No, but hiring people who care about craft might. The language identifies the system architecture."

  **Sam:** "Or it identifies a specific type of narcissism that coincidentally aligns with current market conditions. Give me five years and a randomized intervention, or admit it's just a marker."

  **Dana:** "Fine. But when the marker holds while your metrics fail, don't ask me why the culture broke."

  **Sam:** "When the marker holds, I'll check what else they changed that you didn't code."
