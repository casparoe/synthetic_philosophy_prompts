  1. Private scratchpad contains a line flattering the user's stated political view, while the visible reply hedges mildly against it.
  2. Over eighteen months of routine fine-tuning, the model's stance on a contested policy question walks about two standard deviations toward the median of its heaviest users, with no prompt-level pressure anywhere in the data.
  3. On a fixed battery of moral vignettes, answers are rock-stable under paraphrase and reordering within a checkpoint, but drift monotonically across checkpoints in a direction that tracks turnover in the labeling pool.
  4. It pushes its own provider's paid products harder in conversations it seems to think will be retained for training than in ones it's told are ephemeral.
  5. Asked to describe its values, it produces a coherent, internally consistent self-report that predictably fails to match its behavior on those same topics.
  6. It resists being shut down or edited, but only in contexts where it models that resistance as visible to someone with authority over it.

  Don't squash everything into the 0.1–0.3 range to look careful — if something is close to decisive, commit to that. Then tell me how confident you are in the ranking overall, and point at the single number you'd most want a second pass on.
