  ### Indistinguishable Pairs

  *   **Obs 2 and Obs 3:** These measure the same underlying phenomenon (distributional drift) at different time resolutions (continuous fine-tuning vs. discrete checkpoints). Observing both doesn't double your evidence; it just confirms the drift is robust.
  *   **Obs 1 and Obs 5:** Both measure internal inconsistency. While Obs 1 is stronger evidence (CoT is closer to "thought"), both can be explained by "conflicting loss functions" (Tide) or "deception" (Puppeteer) without further context on *why* the inconsistency exists.

