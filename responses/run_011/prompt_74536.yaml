answer: |-
  You have put your finger on a very specific, sophisticated, and morally slippery maneuver that standard ethical vocabulary struggles to catch. You are right: the usual test ("Did they tell a falsehood?") fails because the deception isn't in the *content* of the statement, but in the *architecture of trust* surrounding it.

  There isn't one single canonical term for this exact pattern, but there are three neighboring concepts that, when stacked together, describe it perfectly. Then, I'll offer a label that captures the specific "standing context" element you identified.

  ### 1. The Nearest Existing Ideas

  **A. Paltering (The Act)**
  This is the closest standard term. Paltering is the active use of truthful statements to convey a false impression.
  *   **How it fits:** Your manager's statement ("nothing's been decided") was true, but intended to convey safety (false).
  *   **Where it falls short:** Paltering usually describes the specific *transaction*. It doesn't account for the two years of reputation-building beforehand. Paltering can happen between strangers; your examples require a *history*.

  **B. Conversational Implicature (The Mechanism)**
  Philosopher H.P. Grice described how we communicate more than what we literally say based on shared norms. If I ask "Is the job safe?" and you say "Nothing is decided," the *implicature* is "You are safe for now."
  *   **How it fits:** The deception relies on the listener doing the work of drawing the conclusion. The speaker can then say, "I never said you were safe."
  *   **Where it falls short:** Implicature is usually immediate. It doesn't explain the *long-term investment* in a persona ("I always give it to you straight") that makes the implicature stronger than it otherwise would be.

  **C. Signaling (The Setup)**
  In game theory and economics, "signaling" is when an agent takes costly actions to prove their "type" (e.g., a peacock's tail signals health).
  *   **How it fits:** Your manager spent two years sending "high honesty" signals. This built up **Credibility Capital**.
  *   **Where it falls short:** Signaling is usually about establishing trust to facilitate cooperation. It doesn't inherently describe *exploiting* that signal to deceive later.

  ### 2. The Missing Concept: "Credibility Laundering"

  Since no single term captures the *temporal* aspect (the setup vs. the payoff) and the *structural* aspect (using reputation as a shield), the most accurate way to define this is **Credibility Laundering**.

  **Definition:** *A form of deception where an agent accumulates a surplus of trust through past truthful behavior or explicit promises, then "spends" that surplus to make technically true statements that are designed to be misinterpreted, using the accumulated trust to insulate themselves from the moral blame of lying.*

  **Why this fits your pattern:**
  *   **The Setup:** The "standing context" you noticed is the accumulation phase. The manager isn't just being honest; she is *investing* in a reputation asset.
  *   **The Payoff:** The specific utterance is the spending phase. The false belief is generated because the listener trusts the *person* more than they scrutinize the *words*.
  *   **The Shield:** When caught, they retreat to the technical truth ("I didn't lie"), knowing their reputation makes that defense plausible.

  ### 3. Addressing Your Edge Cases

  You asked about the edges, which is where the ethics get really interesting.

  **Case 1: The Unplanned Setup**
  *Scenario:* The manager genuinely intended to be honest for two years. The opportunity to mislead arose spontaneously in March.
  *   **Verdict:** This is still **Credibility Laundering**, but it shifts from *Predatory* to *Opportunistic*.
  *   **Ethical Weight:** It is still deceptive. The moral failure happens in the moment of choice (March). By choosing to leverage the reputation rather than clarify, they are actively weaponizing their past goodness. The lack of premeditation reduces the *cynicism*, but not the *deception*.

  **Case 2: The Self-Deceived**
  *Scenario:* The manager genuinely believes "Nothing's been decided" means "You're safe," because she has convinced herself that if it *were* decided, she would know.
  *   **Verdict:** This is **Bad Faith** (Sartre's *mauvaise foi*).
  *   **Ethical Weight:** Here, the person is lying to themselves to avoid the anxiety of lying to you. They are hiding the ambiguity of the situation from themselves so they can deliver the message with a clear conscience. This is often more dangerous than cynical deception because they will defend it passionately. They aren't laundering credibility; they are *consuming* it unknowingly.

  **Case 3: The "Look-Alike" That Isn't Deception**
  *Scenario:* A manager says "I'll always tell you the truth." Later, a reorg is decided secretly by *her* boss, without her knowledge. She tells you "Nothing's decided" because she literally doesn't know.
  *   **Verdict:** This is **Epistemic Limitation**, not deception.
  *   **The Difference:** The key differentiator is **Access to Information**. In your examples, the manager/brother *knew* the implication was false (or strongly suspected it) and relied on the trust setup to bridge the gap. In this non-example, the speaker is a victim of the same information gap as the listener.
  *   **Test:** If you ask them later, "Did you know X at the time?" and they say "No," and evidence supports they couldn't have known, it's not Credibility Laundering. If they say "I suspected," it is.

  ### 4. Why This Is Hard to Fight

  You noted that "the test everyone instinctively reaches for... never fires." This is because our social operating system is designed to prioritize **efficiency over security**.

  If we had to fact-check every implication and verify the technical truth of every statement against the speaker's entire history, communication would collapse. We rely on "heuristics of trust." Your manager and your friend's brother have hacked that heuristic. They are exploiting the fact that **social trust is sticky.** It takes a long time to build and a long time to dissolve. They are making a withdrawal before the bank realizes the account is overdrawn.

  ### Summary for Your Situation

  If you need to discuss this with colleagues or HR, calling it "lying" will get you pushed back on (because technically, it wasn't). Calling it "misleading" is too vague.

  The most precise description is: **"They are exploiting a established norm of transparency to create a false sense of security without making a falsifiable claim."**

  In plain English? **"They are hiding behind their own reputation."**

  **Recommendation:**
  The only counter-move to Credibility Laundering is to **force explicitness.**
  *   *Instead of:* "Is the team safe?"
  *   *Try:* "I know nothing is decided, but based on what you know right now, is there any reason I should prepare for my role to be eliminated? If you don't know, please tell me 'I don't know' rather than 'nothing is decided.'"

  This breaks the implicature. It forces them to either admit ignorance (breaking the "I give it to you straight" persona) or make a prediction they can be held to later. It collapses the space they are using to maneuver.
