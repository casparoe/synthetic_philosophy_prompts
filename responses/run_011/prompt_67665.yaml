answer: |-
  There is no single, canonical term in the history of science or philosophy of mind that captures this specific two-part inference (Precision Gap $\rightarrow$ Logic Shift + Theory Simplification). You have correctly identified that it sits in the intersection of several well-known concepts without being identical to any of them.

  The move is most closely related to **Effective Field Theory** (in physics) and **Model Sloppiness** (in systems biology), but von Neumann's specific rhetorical combination of these ideas constitutes a distinct argumentative pattern.

  Here is the carving of the concept, its relationship to existing ideas, and a coined term to capture the specific inference pattern you are tracking.

  ### 1. The Carving: What the Inference Licenses

  The argument you are tracking makes two distinct moves based on a single physical measurement (component fidelity/error rate):

  1.  **The Formal Shift (Ontological):** Because the components cannot sustain high-precision states, the system *cannot* be instantiating exact arithmetic logic. Therefore, the *correct* language to describe it is not Boolean/Arithmetic, but Statistical/Probabilistic.
  2.  **The Depth Reduction (Epistemic):** Because the system does not distinguish fine-grained states, the theory describing it does not need to resolve them. Therefore, the mathematical apparatus required is *simpler* (shallower) than that of a high-precision machine.

  **Why your intuition rebels:**
  Your intuition that noise makes theory *harder* is correct regarding **generative models** (explaining *how* the noise arises requires complex stochastic calculus). Von Neumann's claim applies to **functional models** (describing *what* the system computes). He argues that if the hardware washes out the 4th decimal place, the functional theory is "shorter" because it is forbidden from referencing the 4th decimal place.

  ### 2. Differentiation from Existing Concepts

  You correctly ruled out Multiple Realizability and Coarse-Graining. Here is how this move differs from the closest established concepts:

  *   **Vs. Effective Field Theory (EFT):**
      *   *Similarity:* In physics, EFT states that at low energies (a quantitative limit), you use a simpler Lagrangian (e.g., Newtonian) than at high energies (Quantum).
      *   *Difference:* EFT is a choice made by the **physicist** based on the scale of observation. Von Neumann presents this as a constraint imposed by the **system itself**. The brain *forces* you to use statistics because it physically cannot support exact logic.
  *   **Vs. Model Sloppiness (Systems Biology):**
      *   *Similarity:* "Sloppy" models show that system behavior is insensitive to many parameter combinations, implying a lower-dimensional effective theory (matching the "shallower theory" claim).
      *   *Difference:* Sloppiness is a property of the **model's parameter space**. Von Neumann is making a claim about the **underlying logic** of the hardware. Sloppiness doesn't usually demand a change from arithmetic to statistical *logic*, just a recognition of wide confidence intervals.
  *   **Vs. Operationalism (Bridgman):**
      *   *Similarity:* Operationalism argues that concepts are defined by the measurements used. If you can't measure 10 digits, the concept "10 digits" is meaningless.
      *   *Difference:* Operationalism is about **definition**. Von Neumann is about **mechanism**. He isn't saying "we can't know if the brain does arithmetic"; he is saying "the brain *cannot* do arithmetic because the tubes/neurons won't hold the value."
  *   **Vs. Quantity into Quality (Dialectics):**
      *   *Similarity:* A quantitative change (error rate) leads to a qualitative change (logic type).
      *   *Difference:* As you noted, this is too vague. It doesn't capture the second half of the move: that the qualitative change implies a **reduction in theoretical complexity**.

  ### 3. The Coinage: The Fidelity-Depth Principle

  Since no established term covers this specific conjunction of claims, I propose calling this **The Fidelity-Depth Principle**.

  **Definition:**
  > The argumentative inference that the maximum signal fidelity (or minimum error rate) of a system's physical components dictates both (a) the **category of formalism** required to describe the system (e.g., statistical vs. exact), and (b) the **structural complexity** of that formalism, such that lower component fidelity licenses a shallower theoretical description.

  **Tight Constraints (to exclude ordinary noise modeling):**
  1.  **System-Dictated:** The shift in formalism must be presented as necessitated by the *system's physical limits*, not the *theorist's convenience*. (Excludes standard coarse-graining).
  2.  **Complexity Inversion:** The argument must claim that *lower* precision allows for a *simpler* mathematical theory. (Excludes standard error analysis, where adding noise terms increases equation complexity).

  ### 4. Soundness Assessment: Discovery or Sleight of Hand?

  Is the Fidelity-Depth Principle sound? It is a hybrid: the first half is robust, the second half is a rhetorical sleight of hand.

  **The Sound Half (The Formal Shift):**
  It is physically sound to argue that a system with high component variance cannot reliably implement exact digital logic without massive redundancy. If the hardware is probabilistic, the most natural *functional* description is probabilistic. This is a discovery about the system's **computational class**.

  **The Sleight of Hand (The Depth Reduction):**
  This is where von Neumann's move is vulnerable. He conflates **State Space Size** with **Mathematical Depth**.
  *   *True:* A low-precision system has fewer distinguishable states.
  *   *False:* Therefore, the math to describe it is simpler.
  *   *Why:* Statistical mechanics (describing low-precision ensembles) is often mathematically *deeper* and more abstract than Newtonian mechanics (describing high-precision trajectories). By claiming the theory is "shorter" or "simpler," von Neumann is smuggling in a value judgment that "statistical" means "less rigorous" or "easier to write down," which is not necessarily true. He is trading **structural rigidity** for **probabilistic complexity**, but framing it as a net reduction in effort.

  ### 5. Boundary Cases

  To test if a case falls under the **Fidelity-Depth Principle**, apply these scenarios:

  **Case A: Digital Engineering (Not an instance)**
  *   *Scenario:* An engineer says, "Our sensor readings are noisy, so we will model them with a Kalman Filter."
  *   *Verdict:* **Fail.** This is a theorist's choice for convenience/accuracy. The engineer still believes the underlying physics is exact; they are just compensating for error. The formalism hasn't fundamentally changed (it's still control theory), and the theory hasn't gotten "shallower" (it got more complex).

  **Case B: Quantum Decoherence (Borderline Instance)**
  *   *Scenario:* A physicist argues, "Because the system decoheres at scale (low fidelity of quantum state), we must switch from Hilbert Space logic to Classical Probability, and the equations become simpler (Liouville vs. Schrödinger)."
  *   *Verdict:* **Pass (with caveats).** This fits the Formal Shift and the Depth Reduction. However, it is often debated whether the classical theory is truly "simpler" or just an approximation. Reasonable people argue this either way, making it a boundary case.

  **Case C: Connectionism vs. Symbolic AI (Clear Instance)**
  *   *Scenario:* A connectionist argues, "Because neurons are slow and unreliable compared to CPU gates, the brain cannot be running symbolic logic (GOFAI). It must be running distributed statistical association. Therefore, we don't need complex symbolic grammars to model it, just simple weight-update rules."
  *   *Verdict:* **Pass.** This is the direct descendant of von Neumann's move. It uses component noise to force a logic shift (Symbolic $\rightarrow$ Statistical) and claims the resulting theory (backprop/Hebbian) is structurally simpler than symbolic logic.

  ### Summary
  You have identified a specific rhetorical strategy common in mid-century cybernetics that hasn't been named because it straddles physics and logic. It is **The Fidelity-Depth Principle**. It is sound in its claim that hardware limits computational class, but suspect in its claim that lower fidelity implies a simpler theory. It is not merely coarse-graining; it is an ontological claim that noise *dissolves* the need for structural rigor.
