answer: |-
  This is a sharp and significant observation. You have identified a structural fault in the rhetoric of risk that is pervasive in the literature but rarely isolated as a distinct argumentative failure. You are correct that standard labels like "equivocation" or "ad hoc rescue" do not quite fit. Equivocation typically implies a confusion of terms within a single inferential step, whereas your pattern involves a strategic rotation of entire theoretical frameworks across sequential steps. Ad hoc rescue implies a defensive patching of a single theory, whereas here the theorist is not defending a theory but *consuming* theories.

  There is no canonical name for this in the foundations of probability (Hájek, Gillies, and Eagle discuss the interpretations, but not this specific rhetorical maneuver as a fallacy). However, given your context (Risk and Responsibility), I propose we call this **Interpretational Arbitrage**.

  Below is the diagnosis, the boundary conditions distinguishing it from legitimate pluralism, and an analysis of what this implies for the metaphysics of probability.

  ### 1. The Name: Interpretational Arbitrage

  In finance, arbitrage is the practice of taking advantage of a price difference between two or more markets to make a risk-free profit. The arbitrageur buys low in Market A and sells high in Market B, treating the asset as identical in both while exploiting the valuation gap.

  **Interpretational Arbitrage** occurs when a theorist treats a probability value ($P$) as an invariant asset while trading it across different ontological markets (Frequency, Propensity, Epistemic). They "buy" the epistemic authority of Frequency (data, objectivity) and "sell" the practical applicability of Propensity or Epistemic confidence (single-case guidance, normative force), without paying the exchange rate (the philosophical cost of translating between the interpretations).

  ### 2. Diagnostic Conditions

  To charge a text with Interpretational Arbitrage, four conditions must be met. If any are missing, the charge fails.

  **A. Ontological Switching:**
  The text must rely on at least two distinct interpretations of probability that make incompatible claims about what $P$ refers to.
  *   *Frequency:* $P$ refers to a ratio in a long-run sequence (not applicable to single cases).
  *   *Propensity:* $P$ refers to a physical disposition of a single setup (applicable to single cases).
  *   *Epistemic:* $P$ refers to a degree of belief or warrant (normative, agent-relative).
  *   *Condition:* The text must explicitly or implicitly invoke the *strengths* of Interpretation 1 to establish the *value* of $P$, and the *strengths* of Interpretation 2 to establish the *consequences* of $P$.

  **B. Numerical Invariance:**
  The numerical value (e.g., $0.3$) must be treated as a rigid designator across the switch.
  *   *Condition:* The argument assumes $P_{frequency} = P_{propensity} = P_{epistemic}$. There is no adjustment, calibration, or acknowledgment that the number might change meaning or magnitude when the ontology shifts. The figure is carried over as if it were a neutral token.

  **C. Asymmetric Burden-Shedding:**
  Each interpretation is invoked only when it faces no pressure, and abandoned when pressed.
  *   *Condition:* When the objection is "This is a single case," the theorist retreats from Frequency. When the objection is "What grounds this single-case chance?", the theorist retreats from Propensity to Epistemic. When the objection is "Isn't this just subjective?", the theorist retreats to Frequency. No single interpretation bears the weight of the entire argument.

  **D. Inferential Continuity:**
  The conclusion must depend on the premises of Interpretation 1 *and* the applicability of Interpretation 2.
  *   *Condition:* The argument fails if the switch is made explicit. For example: "The frequency is 0.3 (therefore it is an objective fact). Therefore, this specific defendant had a 0.3 propensity (therefore they were negligent)." If the bridge between frequency and propensity is exposed, the inference collapses.

  ### 3. Boundary Conditions: Arbitrage vs. Legitimate Pluralism

  You asked how to distinguish this from the legitimate view that probability has several senses and a writer may use whichever the context licenses (a view defended by Donald Gillies and others). The difference is not in the *use* of multiple interpretations, but in the **management of the transitions**.

  **Legitimate Pluralism** is marked by **Bridge Principles**.
  A pluralist acknowledges that $P_{frequency}$ and $P_{epistemic}$ are distinct. To move from one to the other, they invoke a bridging principle, such as David Lewis's *Principal Principle* (roughly: your credence should match the known objective chance).
  *   *Textual Marker:* The use of qualifying clauses: "If we take this frequency as a guide to our expectation..." or "Assuming this propensity is reflected in the data..."
  *   *Diagnostic:* The author admits a gap and proposes a warrant to cross it.

  **Interpretational Arbitrage** is marked by **Inferential Smuggling**.
  The arbitrageur treats the bridge as invisible. The transition is unmarked.
  *   *Textual Marker:* The use of "therefore" or "is" where a pluralist would use "suggests" or "models."
  *   *Diagnostic:* The author treats the gap as non-existent. The numerical value is the same *because* the concept is assumed to be the same, despite the ontological switching.

  **Detectability:**
  This is detectable from the text alone, specifically in the **modal profile** of the claims.
  *   In Arbitrage, the claim is *categorical* in both registers ("It is a fact that the chance is 0.3" AND "It is a fact that you should believe 0.3").
  *   In Pluralism, the claim is *conditional* across registers ("It is a fact that the frequency is 0.3; *given that*, the rational credence is 0.3").
  *   If the text does not contain the conditional marker linking the interpretations, it is Arbitrage.

  ### 4. Philosophical Implications: Verbal Dispute or Deep Structure?

  You asked whether the prevalence of this pattern suggests the dispute between interpretations is merely verbal, or if it indicates something deeper. I argue it indicates the latter: **Functional Unity despite Ontological Disunity.**

  **Why it is not merely verbal:**
  If the dispute were merely verbal, the switching would not be necessary. One could simply define terms and stick to them. The fact that theorists *must* switch to make their arguments work suggests that no single interpretation is sufficient for the concept of **Risk** as it functions in moral and legal contexts.
  *   *Frequency* provides the **Evidence** (we need data).
  *   *Propensity* provides the **Target** (we need to talk about the specific atom/defendant).
  *   *Epistemic* provides the **Norm** (we need to talk about blame, expectation, and decision).

  **The Deep Structure:**
  The prevalence of Interpretational Arbitrage suggests that "Probability" in risk discourse is a **cluster concept** that requires all three interpretations to function, but our logic demands a **singular referent** to validly instantiate a syllogism.
  *   To blame a utility company, we need the event to be real (Propensity).
  *   To know the event was likely, we need data (Frequency).
  *   To say they *should have known*, we need a norm (Epistemic).

  The fallacy arises because we try to run a syllogism ($A=B, B=C, \therefore A=C$) where $B$ changes its identity mid-stream.

  **Conclusion for your Chapter:**
  The pattern does not show that the interpretations are the same. It shows that **Responsibility** is a hybrid concept that sits at the intersection of these interpretations.
  *   When a theorist commits Interpretational Arbitrage, they are implicitly acknowledging that a pure frequency account cannot ground responsibility (because frequencies don't attach to single cases), and a pure epistemic account cannot ground negligence (because mere belief isn't a fact about the world).
  *   They are smuggling in the missing metaphysical glue.

  Therefore, the charge of Interpretational Arbitrage is not just a logical correction; it is a metaphysical exposure. It reveals that the theorist is trying to derive an **Ought** (responsibility) from an **Is** (frequency) by disguising the **Can** (propensity/disposition) as a neutral number.

  For your chapter, you can characterize this not merely as a slip, but as a symptom of the **ontological gap in risk attribution**. We want risk to be objective (so we can blame) and subjective (so we can impute knowledge). Interpretational Arbitrage is the rhetorical mechanism by which theorists pretend this tension does not exist. Recognizing it allows you to argue that a coherent theory of risk and responsibility must explicitly account for the translation costs between these interpretations, rather than hiding them.
