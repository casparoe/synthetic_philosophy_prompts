answer: |-
  Dear colleague,

  I read your description of the seminar with a sense of recognition that borders on sympathy, because the stalemate you describe is not just a pedagogical fatigue but a structural feature of the debate itself. You are right to suspect that your hypothesis about institutional versus moral categories is on the right track, but I think the diagnosis needs to go one layer deeper to explain why the conversation spins in place year after year. The disagreement is not merely verbal, nor is it simply a confusion of functions, though both of those are present. It is a substantive disagreement about the locus of normative force in communication, but it is perpetuated by a methodology that is no longer capable of resolving it. The assertionists and the answerability camp are not actually arguing about the same phenomenon when they use the word lying, but they are not talking past each other in a way that a simple definition could fix. They are disagreeing about what communication is for.

  The assertionist camp treats communication as a transfer of information where the primary norm is fidelity between word and world. For them, the bright line matters because it protects the speaker's autonomy to manage implicature without incurring the specific stigma of falsehood. This view works well for institutions because institutions need auditable records, and you cannot audit an implication with the same reliability as you can audit an assertion. The answerability camp, conversely, treats communication as a maintenance of trust where the primary norm is fidelity between mind and mind. For them, the bright line is a loophole that allows the speaker to retain the benefits of trust while dodging the costs of honesty. The reason your seminar ends in nowhere is that every case you introduce is being processed through two different operating systems. When the assertionists offer a case where the misleader seems less blameworthy, the answerability camp rejects the data point because their system does not register literal truth as a mitigating factor if the intent was deceptive. When the answerability camp offers a case where the misleader seems worse, the assertionists reject it because their system categorizes it as a lie by virtue of the intent, thereby collapsing the distinction they are trying to defend. You are not facing a stalemate manufactured by case design alone, but by the fact that the cases are being weighed on different scales.

  This is where your wrinkle about exculpatory precision becomes the key to unlocking the room. The reason your students find this worse than a plain lie is not because of the deception itself, but because of what it does to the possibility of correction. A plain lie leaves the truth available as a corrective mechanism. If I lie to you, you can eventually discover the lie and hold me accountable using the truth. The structure of accountability remains intact even if violated. But when a speaker inserts scrupulously accurate details solely to manufacture a future alibi, they are not just violating the norm of truth-telling; they are corrupting the mechanism of accountability itself. They are making the truth unusable for the purpose of correction. This presses the assertionists because it shows that a literally true statement can be more morally toxic than a false one, which undermines their claim that the wrong of lying is rooted in the falsity of the assertion. It presses the answerability camp because it shows that being answerable is not enough if the answers are rigged to be immune to challenge. The wrong here is not in the mismatch of belief and word, nor simply in the exploitation of trust, but in the pre-emptive sabotage of the repair process.

  So, to answer your question about what sort of disagreement this is, I would diagnose it as a substantive conflict about the telos of communicative norms that has been misidentified as a definitional boundary dispute. The assertionists are defending the integrity of the record, while the answerability camp is defending the integrity of the relationship. Neither is wrong, but neither can win the argument as currently framed because the question you are asking forces them to choose one over the other. The stalemate persists because the methodology of intuition pumping relies on shared moral instincts, but the instincts are being triggered by different features of the cases. The assertionists look at the semantic surface, the answerability camp looks at the pragmatic depth, and the exculpatory precision case shows that both miss the temporal dimension of accountability.

  Given this diagnosis, progress will not come from finding a better definition of lying or from designing a killer case that finally forces one side to concede. Nothing will count as progress if it remains within the framework of asking whether misleading is worse, better, or different from lying. That comparative question assumes there is a single metric of wrongness that applies to both, and your students' reaction to exculpatory precision suggests there is not. Progress would look like a change of question. You need to shift the seminar from evaluating the magnitude of the wrong to evaluating the structure of the accountability violation. Instead of asking whether misleading is worse than lying, ask whether the utterance preserves or corrupts the possibility of future correction. This allows you to accommodate the assertionist insight that literal truth matters for records, while also accommodating the answerability insight that trust matters for relationships, by adding a third dimension regarding the integrity of the justificatory process.

  If you want to break the cycle, I suggest you stop trying to resolve the definition and start treating the two positions as describing different species of normative violation. One is a violation of accuracy, the other is a violation of fidelity, and exculpatory precision is a violation of integrity. Once you separate these, the students stop trying to rank them on a single scale and start analyzing what kind of damage each does to the communicative ecosystem. This does not dissolve the tension, but it dissolves the stalemate, because it acknowledges that the two camps are right about different things. You cannot have a single category that does the work of both perjury law and moral friendship without tearing itself apart, and pretending otherwise is what has eaten your term. The way forward is to admit that the concept of lying is doing too much work and to distribute that work across a more nuanced taxonomy of deceptive practices. If you can get the seminar to agree on that taxonomy, you will have moved them from nowhere to somewhere, even if they still disagree on the edge cases. The goal is not a verdict on which is worse, but a diagnosis of why the comparison fails, and that shift in focus is the only thing that will stop the seminar from ending where it began.
