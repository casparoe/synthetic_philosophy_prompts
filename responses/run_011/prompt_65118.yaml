  ## Analysis of Logical Space

  ### 1. Scope-Mismatch Analysis
  For each leaf, the following table indicates whether the position predicts uniformity between Local (Node 1) and Global (Node 8) questions.

  | Leaf | Position | Predicts Uniformity? | Diagnosis of Mismatch |
  | :--- | :--- | :--- | :--- |
  | 1 | Scope Mismatch | **No** | This is the defining feature of this leaf. |
  | 2 | Quine | **Yes** (Both B) | Quine's holism is universal; local tests are part of the global web. |
  | 3 | Duhem | **Yes** (Both B, but localisable) | Duhem sees the problem as inherent to physics, applicable locally and globally, though resolvable. |
  | 4 | Laudan | **Yes** (Both A) | Laudan argues the problem is rarely instantiated anywhere. |
  | 5 | Bayesian | **Yes** (Both A) | Convergence applies to any domain where evidence accumulates. |
  | 6 | ESR | **Yes** (Both A) | Structure is knowable in both local and global domains. |
  | 7 | OSR | **Yes** (Both A) | Ontology is structural universally. |
  | 8 | Const. Emp. | **Yes** (Both B) | Empirical adequacy is the goal everywhere; truth is suspended everywhere. |
  | 9 | Instrumentalism| **Yes** (Both B) | Tools are tools, regardless of scale. |
  | 10 | Hist. Induction | **Yes** (Varies) | Depends on whether history is taken to constrain local or global claims equally. |
  | 11 | Community | **Yes** (Varies) | Depends on whether the community operates at both scales. |
  | 12 | Feyerabend | **Yes** (Both B) | Methodological anarchy applies universally. |

  **Diagnostic Note:** A Quinean (Leaf 2) ought to be uniform (Global Holism). A Duhemian (Leaf 3) might appear pluralist if they think local experiments are resolvable but global theories are not, but strictly speaking, Duhem locates the problem in the nature of physical testing itself, implying uniformity of the *problem* (even if resolutions differ). Leaf 1 captures those who explicitly admit a divergence in epistemic status between local and global.

  ### 2. Indistinguishable Pairs
  The following pairs of leaves are difficult to separate with this instrument alone.

  *   **Constructive Empiricism (Leaf 8) vs. Instrumentalism (Leaf 9):**
      *   *Reason:* Both reject truth for unobservables (Node 5B) and accept underdetermination (Node 1B/3B). The distinction lies in whether one 'believes' the theory is empirically adequate (Van Fraassen) or merely 'uses' it without belief (Instrumentalist).
      *   *Further Question:* "Do you *believe* your best theory is empirically adequate, or do you simply *act as if* it is?"
  *   **Epistemic vs. Ontic Structural Realism (Leaf 6 vs. Leaf 7):**
      *   *Reason:* This relies entirely on Node 7. Many respondents find the distinction between 'structure is all we know' and 'structure is all there is' metaphysically obscure.
      *   *Further Question:* "If we discovered that relations existed without relata, would you call that a discovery about our knowledge or about the world?"
  *   **Pessimistic Induction vs. Stanford (Leaf 10):**
      *   *Reason:* As noted in the Scoring Key, both rely on the historical enumeration of alternatives (Node 4B).
      *   *Further Question:* "Is the threat primarily that past theories were *false* (PI), or that current alternatives are *unconceived* (Stanford)?"

  ### 3. Unoccupied Cells
  The following combinations of answers represent coherent logical positions that are rarely or never defended in the literature.

  *   **Local Atomism / Global Holism (Node 1A, Node 8B, Node 6B):**
      *   *Diagnosis:* **Unattractive.** This view holds that local hypotheses can be tested in isolation, but global theories cannot. It is unstable because global theories are composed of local hypotheses. If the parts are testable, the whole should be, unless one posits a mysterious emergent underdetermination at the cosmic scale.
  *   **Virtues as Truth-Tracking / Evidence Irrelevant (Node 5A, Node 3B):**
      *   *Diagnosis:* **Incoherent.** If theoretical virtues (like simplicity) track truth, then evidence should eventually converge on the simpler theory. Claiming virtues track truth *but* evidence never settles the tie implies a pre-established harmony between mind and world that bypasses empirical inquiry entirely (Rationalism without empiricism).
  *   **Community Warrant / Methodological Monism (Node 10B, Node 10C negation):**
      *   *Diagnosis:* **Explored but Rare.** This is the standard Kuhnian position. It is not unoccupied, but it is often unstable. If the community warrants the theory, but there is no fixed method (Feyerabend), the community's decision becomes arbitrary. Most Community Warrant views (Leaf 11) assume some normative constraints on the community, distinguishing them from Feyerabend (Leaf 12).
  *   **Intertranslatable Rivals / Genuine Ontological Difference (Node 2B):**
      *   *Diagnosis:* **Incoherent.** If two formulations are fully intertranslatable (Node 2), asserting they are ontologically distinct (Node 2B) violates the principle of semantic equivalence. This cell is empty because it amounts to claiming a verbal difference is a factual difference.

