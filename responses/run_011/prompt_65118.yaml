  ## Scoring Key

  Match your path to the leaves below. Note that Node 9 acts as a filter: if you answered **9B**, you proceed directly to **Leaf 1**, regardless of other answers.

  **Leaf 1: Scope Mismatch (The Pluralist)**
  *   **Path:** Any path ending in **9B**.
  *   **Diagnosis:** You treat local and global underdetermination differently. You may be a realist about laboratory physics but an anti-realist about cosmology (or vice versa). This is a stable position but requires explaining why the scope changes the epistemic rules.

  **Leaf 2: Quine's Globalised Holism**
  *   **Path:** 1B, 2B, 3B, 6B, 5B, 9A, 10A.
  *   **Diagnosis:** You believe underdetermination is permanent and global. Testing is holistic (the whole web), and virtues are pragmatic, not truth-tracking. Any theory can be held true come what may.

  **Leaf 3: Duhem's Restricted Treatment**
  *   **Path:** 1B, 2B, 3A, 6A, 5A, 9A, 10A.
  *   **Diagnosis:** You see underdetermination as a local problem in physics (experimental groups), not a global logical threat. Hypotheses can be isolated, and evidence usually settles the matter eventually.

  **Leaf 4: Laudan's Deflationary Response**
  *   **Path:** 1A, 2A, 3A, 4A, 5A, 9A, 10A.
  *   **Diagnosis:** You view underdetermination as a transient historical problem. Rivals are usually intertranslatable or eventually settled by evidence. The 'problem' is exaggerated by philosophers.

  **Leaf 5: Bayesian Convergence**
  *   **Path:** 1A, 2A, 3A, 4A, 5A, 6A, 9A, 10A. (Distinguished from Laudan by emphasis on probability updating).
  *   **Diagnosis:** You believe that while evidence underdetermines theory at any single moment, rational agents updating on the same total evidence will converge on the same probabilities over time.

  **Leaf 6: Epistemic Structural Realism (ESR)**
  *   **Path:** 1A, 2B, 3B, 4B, 5A, 7A, 9A, 10A.
  *   **Diagnosis:** You are a realist about the mathematical structure of successful theories (we can know it), but agnostic about the nature of the unobservable entities (we cannot know if they exist).

  **Leaf 7: Ontic Structural Realism (OSR)**
  *   **Path:** 1A, 2B, 3B, 4B, 5A, 7B, 9A, 10A.
  *   **Diagnosis:** You believe the structure is not just what we know, but all that exists. There are no 'objects' underlying the relations. (Note: Distinguishing this from ESR relies entirely on Node 7).

  **Leaf 8: Constructive Empiricism**
  *   **Path:** 1B, 2B, 3B, 4A, 5B, 7A, 9A, 10A.
  *   **Diagnosis:** You aim for empirical adequacy (saving the phenomena), not truth about unobservables. Virtues are pragmatic. You distinguish this from Instrumentalism by maintaining a cognitive attitude towards the theory (belief in adequacy, not just use).

  **Leaf 9: Instrumentalism**
  *   **Path:** 1B, 2B, 3B, 4A, 5B, 7A, 9A, 10A. (Distinguished from CE by a stronger rejection of 'belief').
  *   **Diagnosis:** Theories are merely tools for prediction. To ask if they are 'true' is a category mistake. (Note: In practice, this tree groups CE and Instrumentalism closely; see Indistinguishable Pairs).

  **Leaf 10: Historical Induction (PI/Stanford)**
  *   **Path:** 4B (regardless of other answers, provided 9A).
  *   **Diagnosis:** Your primary concern is the history of failed theories. You argue that because past theories were false (Pessimistic Induction) or because current rivals are unconceived (Stanford), we cannot claim truth for current theories.
  *   **Verdict on PI vs. Stanford:** This tree treats these as **one leaf**. While PI focuses on the falsity of past theories and Stanford on the existence of unconceived alternatives, both rely on Node 4 (Historical Case) to generate skepticism. The diagnostic input is identical: historical enumeration undermines confidence.

  **Leaf 11: Community Warrant (Social Epistemology)**
  *   **Path:** Any path ending in **10B**.
  *   **Diagnosis:** You believe underdetermination is resolved not by logic alone, but by the norms and consensus of the scientific community. Warrant attaches to the community of inquirers rather than the individual theory.

  **Leaf 12: Feyerabend's Permissiveness**
  *   **Path:** Any path ending in **10C**.
  *   **Diagnosis:** You reject the idea that there is a fixed method to resolve underdetermination. 'Anything goes' provided it yields results. This earns a place as it rejects the normative constraint implicit in most other leaves.

