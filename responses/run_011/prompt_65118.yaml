answer: |-
  # Diagnostic Instrument for Underdetermination Intuitions

  ## Preamble: Structure and Ordering Rationale

  This instrument is designed as a decision tree with ten decision nodes. It proceeds from concrete, local intuitions to abstract, global commitments. The ordering is chosen to stabilise your intuitions on simple cases before testing them against complex theoretical frameworks. 

  Nodes 1 and 8 are paired to test for **scope consistency** (local vs. global). Node 9 explicitly interrogates this consistency. Nodes 2, 3, and 4 isolate the *source* of the underdetermination (linguistic, evidential, or historical). Nodes 5, 6, and 7 determine your *response* to the problem (realist, empiricist, or structuralist). Node 10 distinguishes social or anarchic resolutions from individualist ones.

  **Instructions:** Read each scenario or claim. Select the option that best matches your immediate intuition. Do not select an answer because you think it leads to a specific philosophical label; select the answer you find most plausible. Record your path (e.g., 1A, 2B, 3A...). At the end, consult the Scoring Key.

  ---

  ## The Decision Tree

  **Node 1: The Local Case (Curve-Fitting)**
  Imagine you have a finite set of data points from an experiment (say, ten measurements of temperature over time). Mathematically, there are infinitely many different curves that can be drawn to pass exactly through these points.
  *   **A:** There is a single true curve describing the physical process; our data is just too sparse to identify it yet.
  *   **B:** There is no fact of the matter about which curve is 'true' until we have a physical theory to constrain the choice; the data alone does not decide.

  **Node 2: The Equivalence Case (Intertranslatability)**
  Consider two mathematical formulations of quantum mechanics (matrix mechanics and wave mechanics). They yield identical predictions for all possible experiments, and there is a mathematical rule to translate every statement in one into the other.
  *   **A:** These are merely two different languages describing the same single theory. There is no underdetermination here.
  *   **B:** These are genuinely rival theories about the nature of reality, even if we cannot currently distinguish them empirically.

  **Node 3: The Transience Case (Settability)**
  Think of a historical debate in science that was later resolved by new technology or data (e.g., the nature of light, or the movement of continents).
  *   **A:** This is the norm. Given enough time and ingenuity, evidence will almost always break the tie between rivals.
  *   **B:** This is the exception. In many significant cases, the evidence is exhausted, and the tie remains permanent.

  **Node 4: The Historical Case (Unconceived Alternatives)**
  Look at the history of science. Often, the theory eventually accepted (e.g., Mendelian genetics) was not among the set of alternatives seriously considered by scientists at the time (who debated blending inheritance).
  *   **A:** This happens occasionally, but we can assume our current best theories are likely among the viable options.
  *   **B:** This happens systematically. We should assume there are always viable alternatives we have not yet conceived.

  **Node 5: The Virtues Case (Truth-Conductivity)**
  When scientists choose between rivals, they use 'theoretical virtues' like simplicity, scope, and fruitfulness.
  *   **A:** These virtues are indicators of truth. A simpler theory is more likely to be actually true.
  *   **B:** These virtues are indicators of utility. A simpler theory is easier to use or more aesthetically pleasing, but not necessarily true.

  **Node 6: The Holism Case (Unit of Testing)**
  When a prediction fails, logic dictates that at least one assumption is false.
  *   **A:** We can usually isolate the specific hypothesis being tested and reject it while keeping background assumptions safe.
  *   **B:** We can only test the whole 'web of belief'. Any part of the system (even logic or math) can be saved if we adjust other parts.

  **Node 7: The Metaphysics Case (Structure)**
  Suppose a scientific theory is empirically successful and we accept its mathematical structure.
  *   **A:** We can know the structure is correct, but we cannot know if the unobservable entities (electrons, fields) really exist as described.
  *   **B:** The structure is not just what we know; the structure is all there *is*. There are no underlying 'objects' holding the properties.

  **Node 8: The Global Case (Cosmology)**
  Return to the scenario in Node 1, but apply it to the entire universe (e.g., competing models of the Big Bang). We cannot step outside the universe to get more data points.
  *   **A:** There is still a single true model, even if we can never be certain which one it is.
  *   **B:** The choice between models is ultimately underdetermined; there is no unique 'true' description of the whole.

  **Node 9: The Consistency Check (Scope Mismatch)**
  Compare your answer to Node 1 (Local) and Node 8 (Global).
  *   **A:** I gave the same answer to both. (My view applies uniformly).
  *   **B:** I gave different answers to the two. (My view depends on the scale of the inquiry).

  **Node 10: The Authority Case (Community and Method)**
  Who or what finally warrants a theory's acceptance?
  *   **A:** The logical relation between evidence and theory, assessed by individual reason.
  *   **B:** The consensus of a qualified scientific community following established norms.
  *   **C:** There is no single method; any strategy that produces results is permissible.

