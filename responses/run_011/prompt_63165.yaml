  **JOINT STATEMENT ON OFF-WORLD SETTLEMENT VIABILITY AND ETHICS**
  **Date:** October 24, 2023
  **Signatories:** The Expansionist Working Group; The Closure Working Group

  **I. SHARED EMPIRICAL AND NORMATIVE FLOOR**

  Both parties affirm the following claims as the baseline for further deliberation. These are not concessions, but established constraints within which the disagreement operates.

  1.  **Propulsion and Resupply Constraints:** Beyond Low Earth Orbit (LEO), delta-v requirements render immediate rescue impossible. Any settlement beyond the Moon operates on a latency where real-time support is physically excluded.
  2.  **Life-Support Closure:** No materially closed life-support system has been operated successfully for multi-year durations with human inhabitants. The Biosphere 2 experiment (1991–1993) remains the primary data point: despite a crew of only eight, the system suffered significant oxygen depletion requiring external injection, and caloric intake was insufficient for sustained health.
  3.  **Radiation Environment:** Outside Earth's magnetosphere, Galactic Cosmic Rays (GCRs) and solar particle events present cumulative cancer risks and acute neurological threats that current shielding mass budgets cannot fully mitigate for permanent residence.
  4.  **Legal Baseline:** Under the 1967 Outer Space Treaty, outer space is not subject to national appropriation by claim of sovereignty. Any settlement exists in a legal vacuum regarding property rights and enforcement jurisdiction unless new treaties are ratified.
  5.  **Consent of the Born:** Individuals born within an off-world settlement cannot consent to the initial risk profile of the habitat. They are subject to physiological constraints (e.g., lower gravity effects on development) and safety constraints (no easy exit) determined by predecessors.
  6.  **Normative Scope:** The core ethical question is not whether space is interesting, but whether the moral imperative to reduce existential risk (single-planet bottleneck) outweighs the moral imperative to prevent immediate, non-consensual harm to inhabitants and the potential diversion of resources from terrestrial mitigation.

  **II. MATRIX OF DISAGREEMENT**

  | Issue | Expansionist Formulation | Closure Formulation | Species of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Moral Hazard** | Settlement functions as insurance; knowing backup exists stabilizes geopolitical risk-taking and encourages long-term thinking. | Settlement functions as risk compensation; knowing backup exists encourages reckless environmental degradation and conflict on Earth. | Factual / Normative |
  | **Colonial Logic** | Colonialism requires displacement of indigenous persons. Void space contains no natives; therefore, extraction there is logically distinct from terrestrial colonization. | Colonialism is defined by labor structure and hierarchy, not just displacement. Exporting extractive economics to a sealed habitat replicates the harm structure regardless of natives. | Normative / Verbal |
  | **Future People** | Preventing the non-existence of potential future off-world populations is a moral good; failing to expand forecloses vast amounts of future value. | Non-existence is not a harm. Prioritizing potential people over actual people currently suffering on Earth violates negative utilitarian constraints. | Normative |
  | **Viability Timeline** | Closed-loop systems and radiation shielding are engineering problems solvable within 30–50 years using current technological trajectories. | Closed-loop systems require biological breakthroughs not currently in pipeline; viable settlement is centuries away or physically impossible. | Factual |

  **III. CRUXES AND PREDICTIVE COMMITMENTS**

  The following four cruxes represent narrow sub-questions where resolution would significantly alter each side's position. Both sides agree on the relevant datasets and commit to specific predictions.

  **Crux 1: The Risk Compensation Effect**
  *   **Question:** Does the existence of a viable "exit option" reduce or increase catastrophic risk-taking behavior on Earth?
  *   **Evidence Base:** Historical data on safety technology implementation (e.g., anti-lock braking systems, seatbelt laws) and their correlation with accident rates (the Peltzman Effect).
  *   **Expansionist Prediction:** Following the establishment of the first self-sustaining off-world node, terrestrial investment in existential risk mitigation (climate, nuclear) will increase by >10% within a decade, driven by "backup security" allowing higher R&D risk tolerance.
  *   **Closure Prediction:** Following the establishment of the first self-sustaining off-world node, terrestrial investment in existential risk mitigation will decrease by >10% within a decade, driven by moral hazard and the perception of reduced stakes.

  **Crux 2: Governance Autonomy in Isolation**
  *   **Question:** Do isolated, resource-dependent habitats trend toward autonomy or dependency over time?
  *   **Evidence Base:** Historical records of terrestrial company towns, Antarctic winter-over stations, and long-duration submarine crews regarding governance structures and supply chain leverage.
  *   **Expansionist Prediction:** Within 20 years of permanent occupation, off-world habitats will develop independent governance indices scoring >50% autonomy from Earth-based sponsors due to leverage over critical technical knowledge.
  *   **Closure Prediction:** Within 20 years of permanent occupation, off-world habitats will develop independent governance indices scoring <10% autonomy from Earth-based sponsors due to continued reliance on complex manufactured imports.

  **Crux 3: The Discount Rate on Future Lives**
  *   **Question:** Should resource allocation prioritize existing terrestrial suffering or potential off-world existence?
  *   **Evidence Base:** Economic models of intergenerational equity and the Stern Review parameters on discounting future welfare.
  *   **Expansionist Prediction:** A model allocating 5% of global GDP to space settlement will yield a net positive utility within 150 years via technological spillover and risk reduction, outweighing the opportunity cost.
  *   **Closure Prediction:** A model allocating 5% of global GDP to space settlement will yield a net negative utility within 150 years, as the opportunity cost directly increases terrestrial mortality and instability without achieving viable closure.

  **Crux 4: Psychological Viability of No-Exit**
  *   **Question:** Can human psychology sustain multi-generational residence in a sealed, high-risk environment without Earth rescue options?
  *   **Evidence Base:** Psychiatric incident rates in HI-SEAS simulations, ISS expeditions, and Antarctic stations compared to terrestrial baselines.
  *   **Expansionist Prediction:** Psychiatric incident rates in permanent off-world settlements will stabilize to within 1.5x of terrestrial baselines after the first generation (those born onsite) reaches adulthood.
  *   **Closure Prediction:** Psychiatric incident rates in permanent off-world settlements will exceed 5x terrestrial baselines indefinitely, due to the psychological burden of known entrapment and environmental hostility.

  **IV. FALSIFICATION AND SEMANTIC AUDIT**

  **Conditions for View Revision**
  *   **Expansionists** agree that if Biosphere 2-scale closure failures persist despite advanced recycling tech (e.g., if oxygen loss exceeds 5% annually in next-gen prototypes), the engineering floor is not yet met, and settlement attempts are impermissible negligence.
  *   **Closure Camp** agrees that if a self-sustaining habitat demonstrates net positive technological spillover to Earth (e.g., closed-loop water systems solving terrestrial scarcity) without diverting critical mitigation funding, the "moral hazard" claim requires significant adjustment.

  **Semantic Audit**
  A portion of this conflict was identified as verbal rather than substantive. Specifically, the term "Colonization."
  *   **The Dispute:** Expansionists used "colonization" to mean *population transfer to unoccupied land*. Closure Camp used "colonization" to mean *extraction-based hierarchy imposed by a metropole*.
  *   **Resolution:** Both sides agree to use "Settlement" for the physical act of habitation and "Extractive Structure" for the economic model. The disagreement is not whether space has natives (it does not), but whether an Extractive Structure can exist without them.
  *   **The Dispute:** The term "Insurance."
  *   **Resolution:** Expansionists意指 "existential backup." Closure Camp意指 "moral hazard license." Both sides agree these are distinct mechanisms. The factual crux (Crux 1) determines which mechanism dominates.

  **Closing Note**
  This document does not resolve whether we *should* settle space. It resolves what must be true for either side to be correct. We agree that the physics of closure and the psychology of isolation are the bottlenecks. If the engineering floor holds and the psychological burden is manageable, the Closure Camp's primary objection collapses. If the engineering floor fails or the moral hazard effect is proven strong, the Expansionist's primary justification collapses. We commit to reviewing the data specified in Section III at five-year intervals.

  **[Signed]**
  **Lead Delegate, Expansionist Working Group**
  **Lead Delegate, Closure Working Group**
