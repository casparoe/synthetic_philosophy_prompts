answer: |-
  The question of whether empirical moral psychology can adjudicate normative disputes is often dismissed via a rigid fact-value distinction. However, in a seminar context pairing metaethics with psychology, this dismissal is insufficient. If our considered moral judgments are inputs for wide reflective equilibrium, then the genealogy of those judgments matters. The specific case at hand is Moral Foundations Theory (MFT) and its associated normative claim: that political conservatives, by utilizing a broader range of moral foundations (Care, Fairness, Loyalty, Authority, Sanctity, and Liberty) than liberals (who allegedly prioritize only Care and Fairness), possess a superior moral palate better equipped for social cohesion and moral truth.

  This essay argues that the empirical literature does bear on normative validity, but contrary to the theory's architects, the data undermines the claim of conservative normative superiority. The "Receptivity Argument," which analogizes moral foundations to perceptual wavelengths, fails because the extra sensitivities track motivational states rather than mind-independent values. Furthermore, the "Confabulation Bind" reveals that the normative inference itself is likely an intuition in disguise, rendering it self-undermining under the Social Intuitionist Model. When combined with empirical complications regarding measurement loading, the heterogeneity of fairness, and the rival Harm Monist account, the evidence suggests that the Right is not seeing more of the moral landscape, but is reacting to different non-moral stimuli. The verdict is that while psychology cannot settle normative questions in isolation, it functions as a crucial debunking mechanism within reflective equilibrium, and on those terms, the conservative advantage thesis fails.

  To evaluate the normative weight of the left/right divide, we must first interrogate the Receptivity Argument. This reconstruction posits that if one group reliably registers a wider range of morally relevant considerations, they are epistemically advantaged, analogous to a creature sensitive to more wavelengths of light having access to more evidence about its environment. This analogy is the engine of the normative claim that conservatives are "better equipped" to get policy right. However, this analogy smuggles in a presumption that cannot be granted: it assumes the extra sensitivities are cognitive rather than merely motivational.

  In the perceptual analogy, detecting a wavelength implies the existence of that wavelength independent of the detector. In the moral case, detecting an authority violation or an act of desecration does not imply the existence of a mind-independent value of Authority or Sanctity. It may only imply the existence of a psychological trigger. The empirical literature suggests that the foundations distinguishing conservatives—specifically Loyalty, Authority, and Sanctity—are heavily correlated with threat reactivity, disgust propensity, and system-justifying motives. If a sensitivity to "sanctity" is mechanistically constituted by a disgust response evolved for parasite avoidance, its epistemic status differs radically from a sensitivity to "harm." Disgust is a motivational push, not a cognitive grasp of a value. Therefore, the breadth of the moral palate does not equate to the breadth of moral vision. It may instead equate to a breadth of motivational triggers. To argue that the conservative outlook is better supported because it is broader is to commit a category error, conflating the intensity or variety of psychological reactions with the density of moral reality. Unless one can demonstrate that Authority and Sanctity track objective goods rather than evolved heuristics for group cohesion, the Receptivity Argument collapses. The empirical data, far from vindicating the conservative outlook, provides a genealogy that makes it suspicious within a reflective equilibrium.

  This leads directly to the second reconstruction, the Confabulation Bind. MFT is bundled with the Social Intuitionist Model, which posits that moral reasoning is largely post-hoc rationalization of intuitions. People condemn harmless but revolting acts (the "dumbfounding" results) and invent reasons to justify the intuition. If this model is correct, the philosophical argument that conservatives see more of the moral landscape is itself likely to be confabulation in the service of a prior intuition held by the theorist or the conservative subject.

  This creates a dilemma. If reasoning is too weak to override intuition, then the normative lesson drawn from MFT is merely an expression of the theorist's intuition, carrying no argumentative weight. If, however, the reasoning is reliable enough to carry the normative argument—that we *ought* to value the broader palate—then the Intuitionist Model is overstated, and we must explain why reasoning is reliable here but not in the dumbfounding cases. This bind forces a deflationary verdict on the enterprise. The claim that the Right is normatively superior cannot be a conclusion of reason if reason is merely the servant of intuition. It must be an intuition itself. But if it is an intuition, it is subject to the same empirical scrutiny as the foundations it evaluates. Since the intuition favoring the "broader palate" is often driven by a desire for social order (a conservative-leaning intuition), the argument becomes circular. The Confabulation Bind does not prove the conservative view false, but it strips the MFT architects of the authority to claim their normative conclusion is a scientific discovery rather than a value judgment. It forces us to treat the "conservative advantage" as just another moral intuition to be weighed in equilibrium, not as a meta-ethical trump card derived from data.

  Even if we grant the theoretical coherence of the Receptivity Argument and escape the Confabulation Bind, three empirical complications prevent the data from supporting the normative superiority of the Right. The first concerns measurement and parochialism. The instruments used in MFT separate rating how relevant a consideration is from agreeing with moral statements. However, the items measuring Loyalty, Authority, and Sanctity are often loaded with parochial, group-bound content. A liberal might agree that betraying one's country is wrong but rate "Loyalty" as barely relevant because they interpret loyalty through a universalist lens rather than a nationalist one. Conversely, a conservative might rate it high because the items frame loyalty in terms of traditional institutions.

  This leaves it unclear whether the left/right difference tracks moral concern or question-answering style. If the questionnaire items conflate specific cultural instantiations of a value with the value itself, the "narrowness" of the liberal palate may be an artifact of the instrument. Liberals may value group cohesion but reject the specific hierarchical forms (Authority) or religious forms (Sanctity) presented in the survey. If the difference is merely stylistic or cultural rather than structural, the normative inference that conservatives have access to more moral truth is unfounded. They may simply have access to more *traditionalist* cues. This complication is robust in the literature; the stability of the left/right difference under reframing is a live dispute. Until the instruments can disentangle universal moral concerns from culturally specific triggers, the empirical basis for the "broader palate" claim remains shaky.

  The second complication is the heterogeneity of Fairness. MFT treats Fairness as a single foundation, yet philosophical and psychological analysis suggests it may comprise distinct concerns, primarily equality and proportionality. Liberals tend to prioritize equality, while conservatives often prioritize proportionality (merit, reward for contribution). If the MFT instruments are pitched in the register of equality, they will systematically favor the liberal temperament; if pitched in proportionality, they favor the conservative.

  This matters normatively because if Fairness is not unitary, then the claim that liberals rely on only two foundations (Care and Fairness) is misleading. They may be relying on a complex, differentiated conception of Fairness that the instrument collapses. If the "missing" foundations on the liberal side are actually sub-components of Fairness or Care that are being measured poorly, the conservative advantage in breadth disappears. Furthermore, if proportionality and equality come apart, we face a genuine normative conflict that psychology cannot resolve. The empirical finding that conservatives value proportionality more does not show they are *right* about justice; it only shows they have a different weighting of competing fairness norms. To move from "conservatives value proportionality" to "proportionality is a moral truth" requires normative argument, not psychological data. The empirical literature here highlights a disagreement but cannot adjudicate it without begging the question.

  The third and most damaging complication is the rival monist account associated with Gray and collaborators. This theory posits that all moral judgment is a matter of harm perceived as done by an agent to a patient. On this view, desecration and insubordination are not distinct moral foundations but elaborate ways of seeing harm to a community, a self, or an inheritance. When a conservative condemns flag burning, they perceive harm to the community (the nation); when they condemn incest, they perceive harm to the genetic lineage or the social order.

  If Harm Monism is correct, it pulls the pluralist premise out from under the conservative-advantage argument. The conservative does not have a broader moral palate; they have a broader *definition* of harm. They perceive victims where liberals do not (e.g., the nation, God, the natural order). This shifts the normative debate entirely. The question is no longer "who sees more moral dimensions?" but "who is correct about what constitutes harm?" If the liberal is right that only sentient suffering counts as harm, then the conservative is not seeing more moral reality; they are hallucinating victims. If the conservative is right that abstract entities can be victims, then they see more. Psychology cannot settle this ontological dispute. However, the existence of a viable monist alternative that explains the same data (the left/right divide) without positing five distinct innate modules undermines the robustness of the MFT modularity claim. The modularity of the foundations is not a settled fact; it is a hypothesis competing with monist accounts. If the five foundations can be reduced to variations of harm perception, the normative lesson that pluralism is superior to dualism evaporates. The "breadth" of the conservative view becomes a measure of their willingness to attribute agency and patienthood to abstract concepts, not a measure of their sensitivity to distinct moral truths.

  So, where does this leave the normative question? We must return to the role of psychology in wide reflective equilibrium. Psychology cannot dictate normative truth, but it can assign evidential weight to considered intuitions. An intuition that survives genealogical scrutiny—where we understand its origin and find it compatible with truth-tracking—gains weight. An intuition that is revealed to be a byproduct of disgust or threat avoidance loses weight.

  The empirical literature on the left/right divide provides exactly this kind of genealogical information. It suggests that the moral intuitions distinguishing conservatives (Authority, Sanctity, Loyalty) are more tightly coupled with non-moral motivational systems (disgust, tribalism, system justification) than the intuitions distinguishing liberals (Care, Harm). This does not prove liberalism true, but it lowers the epistemic status of the conservative-specific intuitions within reflective equilibrium. We have independent normative reasons to be skeptical of disgust as a guide to justice (the "yuck factor" is historically unreliable). Therefore, the empirical finding that sanctity judgments track disgust propensity gives us a reason to discount sanctity judgments in our equilibrium.

  Consequently, the verdict is conditional but clear. The empirical literature bears on normative questions by functioning as a debunking mechanism. It does not validate the conservative claim to a broader moral vision. The Receptivity Argument fails because the extra "wavelengths" are likely motivational noise rather than cognitive signal. The Confabulation Bind shows that the normative inference is itself suspect under the theory's own model of reasoning. The empirical complications regarding measurement, fairness, and harm monism demonstrate that the "broader palate" is not a robust finding but a contested interpretation of data that may reflect cultural framing or ontological disagreements about harm rather than moral sensitivity.

  Therefore, the claim that the Right is normatively superior because it is psychologically broader is unsupported. The data does not show that conservatives are right; it shows that they are different, and that their differences are rooted in psychological mechanisms that we have strong independent reasons to treat with skepticism in normative deliberation. The empirical literature does not settle the debate, but it tilts the scale of reflective equilibrium against the normative authority of the Authority, Sanctity, and Loyalty foundations. The "conservative advantage" is a confabulation, not a discovery. We arrive not at a proof of liberal superiority, but at a justified rejection of the psychological argument for conservative superiority. The moral landscape is not wider on the Right; it is merely populated by different ghosts, and psychology has given us the tools to see them as such.
