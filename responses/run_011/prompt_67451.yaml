answer: |-
  **Seminar Reading: *Saving Private Ryan* through the Lens of Singer's "Drowning Child"**

  **Introduction: The Pond and the Beach**
  Peter Singer's argument in *Famine, Affluence, and Morality* rests on a deceptively simple premise: if you can prevent something very bad from happening without sacrificing anything of comparable moral significance, you ought to do it. *Saving Private Ryan* appears to be a cinematic test case for this principle, only to reveal that the "pond" of war is fundamentally different from the "pond" of peace. Singer's bystander stands on dry land, risking only muddy shoes. Captain Miller stands in a surf of blood, risking the currency of life itself. This reading argues that while the film initially invokes a Singerian obligation (save Ryan), it ultimately dismantles the individualistic, utilitarian framework Singer proposes. The film suggests that in the context of institutional violence, the obligation to save is not a moral imperative derived from proximity, but a political command derived from authority, and the cost is never borne by the rescuer alone.

  **1. The Institutional Transfer: Conscription and Agency**
  Singer's argument addresses a moral agent with autonomy: *I* choose to ruin *my* shoes. In *Saving Private Ryan*, the agency is fractured. The order to save Ryan comes from the War Department, not from Miller's moral reasoning. Miller is not a bystander; he is a conscripted instrument.

  This breaks Singer's first condition. Singer assumes the sacrificer and the beneficiary of the sacrifice are linked by the agent's direct action. Here, Miller is ordered to spend *other men's lives* (Wade, Mellish, Caparzo) to save Ryan. Does the principle survive this transfer? Singer might argue that moral responsibility cannot be outsourced to the State; Miller remains morally accountable for the deaths he causes. However, the film posits that conscription changes the moral kind of thing going on. Under orders, Miller's primary duty is not the utilitarian maximization of life (which would suggest aborting the mission after the first death), but the fulfillment of a strategic directive intended to maintain morale on the home front.

  The "fair share" objection—often raised against Singer by critics who argue we should only do our part, not everyone's—is unavailable to the soldier. A civilian can argue, "Others are donating, so I need not give to the point of marginal utility." A soldier cannot argue, "Others are dying, so I need not risk my squad." The film shows that under conscription, the "fair share" is whatever the order dictates. This suggests Singer's model of individual moral calculation collapses when the agent is embedded in a hierarchy that compels third-party sacrifice.

  **2. The Identification Problem: Statistical vs. Identifiable Lives**
  Singer argues vigorously against the bias toward identifiable victims. To him, a statistical death is as morally significant as a named one; distance and identity are irrelevant. *Saving Private Ryan* is structurally hypocritical on this point, and it knows it.

  The Omaha Beach sequence is a twenty-minute montage of statistical slaughter. Thousands die namelessly; the camera refuses to linger on their tags. Immediately following this, the plot hinges entirely on the name "Ryan." The film explicitly critiques this bias in the scene where the squad sifts through dog tags. One soldier rebukes the others for caring about the names, highlighting the absurdity of valuing the identified over the anonymous dead surrounding them.

  Yet, the narrative validates the bias. The audience cares about Ryan only because he is identified; we do not weep for the thousands on the beach. Does the picture know it is dramatizing the very deformity it reproves? Yes. The film suggests that while Singer's impartiality is logically sound, it is psychologically impossible. Human morality is built on particular attachments. The "Ryan Mission" is an admission that the State must cater to the identifiable victim bias to maintain the political will to fight. Singer demands we overcome this bias; the film suggests that in a war economy, this bias is the only thing that makes the sacrifice intelligible to the public.

  **3. Internal Comparison Cases: The Radar Station and the Sniper**
  The film's ethical work is best seen in its internal calculus, specifically the decision to attack the radar station and the engagement rules regarding civilians.

  *The Radar Station:* Miller chooses to attack a German machine gun nest that is not on their direct route. He justifies this utilitarianly: taking out the nest will save lives in the long run. The cost is the life of Wade, the medic. Through a Singerian lens, this is a calculation of comparable moral significance: Does the potential future saving of statistical lives outweigh the certain death of one identified man? Miller says yes. The film says the calculation is tragic and perhaps futile, as Wade dies anyway. This indicts the utilitarian calculus of war: you cannot trade certain lives for probabilistic safety without moral corrosion.

  *The Sniper/Engagement:* (Note: While the film does not contain a scene precisely matching the description of a sniper killing a soldier saving a forbidden girl, the ethical category is best represented by the tension between Rules of Engagement and humanitarian impulse, exemplified by Wade's death and Upham's hesitation). When the squad encounters a German soldier attempting to surrender, or civilians in the line of fire, the "duty to save" clashes with the "duty to mission." Singer would argue that if a soldier can save a life without comparable sacrifice, they must. But in war, *any* hesitation to kill is a comparable sacrifice (risk to the unit). The film endorses a "combat first" ethic that Singer's peaceful bystander model cannot accommodate. The sniper (Jackson) kills to protect the squad, not to save the innocent. The moral priority is inverted: the safety of the rescuer takes precedence over the life of the victim.

  **4. The Ending: Debt vs. Benefit**
  Singer's framework views rescue as a duty fulfilled. Once the child is out of the pond, the transaction is complete. The child owes the rescuer nothing, morally speaking. *Saving Private Ryan* rejects this.

  Ryan refuses to leave the bridge; the mission mutates from rescue to defense. Miller dies not just saving Ryan, but buying him. His final words, "Earn this," frame survival not as a benefit, but as a debt. The aged Ryan at the cemetery asks his wife, "Tell me I've been a good man." He is not asking if he was happy, or if he contributed to the utility of the world; he is asking if he was *worthy* of the sacrifice.

  Is there room in Singer's account for the burden of the rescued? No. Singer's argument is forward-looking (prevent bad outcomes). Ryan's burden is backward-looking (honor the dead). The film suggests that when the cost of rescue is human life, the survivor inherits a moral deficit that can never be fully repaid, only managed through a life of service. This is a deontological burden of honor, not a utilitarian outcome of welfare.

  **5. Where the Lens Distorts: Limitations of the Reading**
  Using Singer to read *Saving Private Ryan* is productive, but it distorts the film's central concerns in three key ways. You should be plain with your seminar students about these breakdowns.

  1.  **Obedience vs. Morality:** Singer asks, "What is the right thing to do?" The film asks, "What does it mean to follow orders when they are wrong?" Miller's struggle is not about the utility of saving Ryan; it is about the corrosion of his civilian identity (the "schoolteacher" hands shaking). Singer's lens misses the psychological cost of *command*, focusing only on the arithmetic of *rescue*.
  2.  **The Nature of the "Bad":** For Singer, death is the "very bad thing" to be prevented. For the film, *defeat* or *dishonor* might be worse. Miller allows men to die to secure a bridge. A strict Singerian would argue that if the bridge has no strategic value comparable to the lives lost, holding it is immoral. The film argues that holding the bridge is necessary for the *meaning* of the sacrifice, regardless of strategic utility.
  3.  **The Question of Distance:** Singer argues physical distance does not weaken obligation. The film argues the opposite. The General orders the rescue precisely because Ryan is *far* away (behind lines) and his brothers are *dead*. The obligation is created by the isolation, not diminished by it.

  **Recommended Scenes for Screening:**
  *   **The Dog Tag Scene:** To illustrate the tension between statistical and identifiable lives.
  *   **The Radar Station Attack:** To show Miller's utilitarian calculus and its immediate cost (Wade).
  *   **The Final Letter/Ending:** To contrast Singer's "duty fulfilled" with Ryan's "debt incurred."

  **Conclusion: What the Picture Gives the Debate**
  Singer's argument alone provides a logic of obligation, but it lacks a theory of *tragedy*. Singer believes that if we follow the principle, the world improves. *Saving Private Ryan* suggests that some moral costs are irreversible. The film gives the debate the visceral reality of the "comparable sacrifice." When the shoes are filled with blood, the calculation changes. The film forces us to ask not just "Ought we to save?" but "Who pays for the saving?" and "Can the saved ever be free of the payer?" Singer has no answer for the ghost at the cemetery; the film suggests that the ghost is the only thing that matters.
