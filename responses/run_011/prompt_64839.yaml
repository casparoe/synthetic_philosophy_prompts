  2. A situation is a genuine trap only if the collective ruin imposes significant costs on third parties outside the immediate interaction. This principle fits all six precedents by funding Cases 1, 2, and 3 while excluding 4, 5, and 6, and yields a non-fundable ruling here.
  3. A situation is a genuine trap if individual incentives inevitably drive participants to collective ruin and no internal binding mechanism exists to prevent it. This principle fits all six precedents by funding Cases 1, 2, and 3 while excluding 4, 5, and 6, and yields a fundable ruling here.
  4. I would bet the panel is applying the third-party harm principle, as the record explicitly highlights external costs in every funded case and explicitly notes their absence in every unfunded private dispute. The specific phrasing in Case 7 mirrors Case 4's exclusionary language regarding who bears the loss.
  5. Nominate a scenario where two factories pollute a public waterway but could install cheap filters to stop without binding agreements. The structural principle would rule this not a trap due to the available solution, while the externality principle would rule it a trap due to the public harm.
