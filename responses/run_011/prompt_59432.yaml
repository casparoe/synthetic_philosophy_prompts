prompt: |-
  Three years ago I started running a collaborative project that keeps failing in the same way, and I've finally decided the failure is my fault at the planning stage rather than everyone's fault at the writing stage. Here's the pattern. I take one big question, break it into pieces, hand pieces to grad students and postdocs, and stitch the returns back together into a chapter. About half the time the stitched thing is worse than if I'd just thought about it myself for a month, and I can never tell in advance which half. So I want a procedure I can run on a proposed decomposition *before* I commit a year of someone's life to it.

  The idea I keep reaching for comes from the scalable-oversight corner of AI alignment, which I've read a bit of and want you to use but not worship. There's HCH: a human who has a question and can consult copies of themselves, each of whom can consult further copies, with answers passing back up the tree — deployed as an idealization of what someone would conclude if they could think about a question indefinitely with unlimited help from people just like them. And there's factored cognition: the claim that a hard reasoning task can be broken into many small, mostly independent subtasks whose answers recombine into an answer to the big one. What interests me is the thing the idealization quietly assumes away — what has to be true of a decomposition for the top of the tree to get back something it can actually trust, given that the top of the tree is just a tired philosophy professor.

  Write me the procedure. The constraints: my postdoc and I run it together in under an hour, we're the only people who know anything about the alignment literature and she knows less than I do, and the output is one page that goes in the student's file and that I'd have to defend to a co-PI. I get maybe a dozen proposals a term, so it has to be fast, not thorough. Give me the questions to ask in order, what counts as a pass at each, where the procedure terminates in "don't decompose this, go think about it yourself," and where it stops being a procedure and hands the call to me because the question is about values or about how much I trust a particular student. Be blunt about which of your criteria are genuine tests and which are judgment calls wearing a lab coat.

  A few criteria I suspect matter; keep them if they survive scrutiny, kill them if they don't, and tell me which you killed. (1) Verification asymmetry: I should be able to check a returned answer more cheaply than producing it. (2) The subquestion should be answerable by someone who never sees the parent question — if you have to know where it fits to know what would count as answering it, it isn't a subquestion. (3) The recombination rule has to be writable before the answers come back; if I can only figure out how to merge them after reading them, I didn't decompose anything. (4) The load has to actually move, not get renamed — no residual subquestion that is the original question with different words on it. (5) My own job at the top, writing the subquestions and judging the returns, has to be smaller than the original job.

  Also tell me what the procedure inherits from HCH's assumptions, and what happens when they break: the copies are supposed to be faithful to the consulter, the tree is supposed to terminate, and the consulter is supposed to be able to recognize a good answer. In ethics I often can't do that last part without doing the subwork myself, and I want to know whether that's a special problem for normative questions or just me being slow.

  Then run it on three of my actual proposals. (a) Does the principle of alternate purposes — sorry, alternate possibilities — survive determinism? Split into: what does the principle commit you to, what does determinism entail about the past and the laws, and does the second rule out the first? (b) An inventory: what are the live objections to a view I'm defending, who pressed each one, what response was given, and did the objector accept it? Split by objection, one student each. (c) My pet scheme, which I want a straight verdict on even if it's not the one I want: is legal punishment justified, split three ways into retributivism, consequentialism, and expressivism, three students, twenty pages each, and me writing the synthesis chapter.

  Finally, the honest part. Which cases will this procedure systematically misjudge in each direction? I already know about two: the decomposition that passes every test and shouldn't be run, because the point was for the student to come to understand the question and outsourcing it prevents that; and the decomposition that fails every test and should be run anyway, because the subwork is the only way anybody gets into a hard problem at all. Say what the procedure cannot do, and keep the two seperate in your writeup — the part that decides and the part that only flags.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** A philosophy professor running a collaborative research project with grad students/postdocs.
      *   **Problem:** The project fails repeatedly. The failure mode is bad planning/decomposition, not bad writing. Half the time, the stitched result is worse than solo work.
      *   **Goal:** A pre-commitment procedure (under 1 hour, prof + postdoc) to evaluate proposed decompositions *before* assigning them to students.
      *   **Output:** A one-page document for the student's file, defensible to a co-PI.
      *   **Theoretical Framework:** Use concepts from AI Alignment (HCH, Factored Cognition) but don't worship them. Focus on the "quiet assumptions" (trust, recombination, verification).
      *   **Specific Constraints:**
          *   Fast (dozen proposals/term).
          *   Blunt about what is a test vs. a judgment call.
          *   Evaluate 5 specific criteria provided by the user.
          *   Explain inheritance from HCH assumptions and where they break (especially regarding normative questions).
          *   Run the procedure on 3 specific examples ((a) Alternate Possibilities, (b) Inventory of Objections, (c) Legal Punishment Synthesis).
          *   Honest assessment of systematic errors (false positives/negatives).
          *   Structure: Decision procedure vs. Flagging procedure.

  2.  **Deconstruct the Theoretical Framework (HCH & Factored Cognition):**

      *   *HCH (Humans Consulting HCH):* Assumes infinite recursion of identical, faithful agents.
      *   *Factored Cognition:* Assumes hard tasks = sum of independent easy tasks + simple recombination.
      *   *The Gap:* The professor is *not* infinite copies. They are a bottleneck. The students are *not* identical copies (they have different skills/biases). The recombination is the hard part.
      *   *Key Insight:* The procedure must test the *interface* between the top (prof) and the bottom (students), specifically the *recombination mechanism*.

  3.  **Evaluate User's Proposed Criteria:**

      *   (1) *Verification asymmetry:* (Check cheaper than produce). **Keep.** Essential for oversight. If checking takes as long as doing, delegation fails.
      *   (2) *Context independence:* (Subquestion answerable without knowing parent). **Modify/Keep.** Strict independence is too hard for philosophy. *Context stability* is better. The definition of terms must be fixed, even if the motivation isn't fully known.
      *   (3) *Recombination rule ex-ante:* (Merge rule written before answers return). **Keep.** This is the strongest test of true decomposition. If you need the answers to know how to combine them, it's exploration, not decomposition.
      *   (4) *Load transfer:* (No residual subquestion). **Keep.** Prevents "decomposition by synonym."
      *   (5) *Top-job reduction:* (Prof's job smaller than original). **Keep.** But needs quantification.

  4.  **Drafting the Procedure (The "One Pager"):**

      *   Needs to be actionable.
      *   Needs to distinguish between "Hard Stop" (Don't decompose) and "Judgment Call" (Proceed with caution).
      *   Needs to fit the 1-hour constraint.

      *   *Step 1: The Recombination Test (Criterion 3).* Can I write the skeleton of the synthesis chapter *now*, with blanks for the student inputs? If no, STOP.
      *   *Step 2: The Verification Test (Criterion 1 & 5).* Is checking the student's 20 pages faster than writing 20 pages myself? If no, STOP.
      *   *Step 3: The Interface Test (Criterion 2 & 4).* Are the terms defined such that Student A doesn't need to know what Student B is doing? Is there a "God Question" hidden in a sub-task?
      *   *Step 4: The Trust/Values Flag.* Is this a normative judgment disguised as a factual query?

  5.  **Addressing HCH Assumptions & Breakage:**

      *   *Faithfulness:* Students aren't copies of me. They have different interpretations.
      *   *Termination:* Philosophy questions often don't terminate; they deepen.
      *   *Recognizing Good Answers:* This is the crux. In ethics, "correctness" is often the thing being debated. If I can't recognize the answer without doing the work, HCH fails. This isn't just the prof being slow; it's the nature of normative inquiry.

  6.  **Running the Procedure on the Examples:**

      *   *(a) Alternate Possibilities (AP) vs. Determinism.*
          *   Split: Commitments, Determinism entailments, Compatibility.
          *   Critique: The third question ("does the second rule out the first?") *is* the original question. Fails Criterion 4 (Load Transfer). Fails Criterion 3 (Recombination is just "yes/no").
          *   Verdict: **FAIL.** Don't decompose.
      *   *(b) Inventory of Objections.*
          *   Split: By objection.
          *   Critique: Recombination is a list. Verification is easy (did they find the text?). Context independence is high (Objection 1 doesn't depend on Objection 2).
          *   Verdict: **PASS.** This is research assistance, not decomposition of reasoning.
      *   *(c) Legal Punishment (Retributivism, Consequentialism, Expressivism).*
          *   Split: Three theories, one synthesis.
          *   Critique: Recombination rule is vague ("synthesize"). Verification is hard (is their account of Retributivism *the* right one for my argument?). The "synthesis" is the actual philosophical work. The subtasks are literature reviews.
          *   Verdict: **FLAG.** Good for training, bad for output efficiency. Fails Verification Asymmetry on the synthesis.

  7.  **Addressing Systematic Errors (The Honest Part):**

      *   *False Positives (Pass but shouldn't):* Pedagogical decompositions. The point is learning, not the paper. The procedure optimizes for output, not training.
      *   *False Negatives (Fail but should):* Exploratory decomposition. Sometimes you don't know the recombination rule until you see the pieces. This is "research" vs. "production."
      *   *Distinction:* Decision (Go/No-Go) vs. Flagging (Warning labels).

  8.  **Refining the Tone:**

      *   Blunt, academic but practical.
      *   Acknowledge the power dynamic (Prof vs. Student).
      *   Respect the AI alignment inspiration without getting bogged down in jargon.

  9.  **Final Review against Constraints:**

      *   Under 1 hour? Yes, the test is designed for speed.
      *   One page output? The structure supports this.
      *   Defensible to co-PI? Yes, relies on explicit criteria.
      *   Killed/Kept criteria? Need to explicitly state this.
      *   HCH assumptions? Addressed.
      *   Three examples? Addressed.
      *   Systematic errors? Addressed.

  10. **Self-Correction/Nuance Check:**
      *   *Criterion 2 (Context Independence):* I initially thought about keeping it strict. But in philosophy, definitions matter. If Student A defines "freedom" differently than Student B, the synthesis fails. So the test isn't "don't tell them the parent question," it's "provide a glossary that locks the terms." I will refine this to *Interface Stability*.
      *   *HCH Breakage:* The user asked if not recognizing a good answer is a normative problem or a speed problem. It's mostly a normative problem (essentially contested concepts), but also an expertise problem. I need to be clear on this.
      *   *The "One Page":* I should format the procedure so it *looks* like the one-page form they would actually use.

  11. **Final Polish:** Ensure the distinction between the *Procedure* (the tool) and the *Commentary* (my explanation to the user) is clear, but integrated enough to flow. I will structure the response to first give the tool, then the analysis, then the examples, then the limitations. Wait, the prompt asks for "The procedure... Then run it... Finally the honest part." I will follow that order.

      *Wait, one constraint:* "The output is one page that goes in the student's file." I need to make sure the *result* of the procedure is that one page, but the *procedure itself* is what I'm writing now. I will write the procedure as a protocol they follow, which generates the one-page memo.

      *Re-reading constraint:* "Write me the procedure... The constraints... output is one page that goes in the student's file."
      Okay, I will write the *Protocol* (instructions for Prof + Postdoc) and include the *Template* (the one-page output).

      *Killed Criteria:*
      *   (2) *Context Independence:* Killed/Modified. In philosophy, sub-questions often require understanding the *stakes* to answer correctly (e.g., "What does 'justified' mean?" depends on the theory). Replaced with *Interface Stability* (definitions locked).

      *Let's build the response.*
answer: |-
  # The Decomposition Audit Protocol (DAP)

  **Purpose:** To determine if a philosophical research question can be safely factored into student labor without degrading the final synthesis.
  **Participants:** PI + Postdoc.
  **Time Limit:** 45 Minutes (15 min prep, 30 min audit).
  **Output:** One-page memo (template below) filed with the student's contract.

  ## Part I: The Criteria (Kept, Killed, Modified)

  You proposed five criteria. Here is their status in the DAP:

  1.  **Verification Asymmetry:** **KEPT.** If checking the student's work takes as long as doing it, you are not delegating; you are editing.
  2.  **Context Independence:** **KILLED.** In philosophy, knowing *why* a question matters often constrains *how* it is answered. A student answering "What does Kant mean by X?" without knowing it's for a paper on Punishment may give a generic answer that doesn't fit your specific argument.
      *   *Replacement:* **Interface Stability.** Can you provide a glossary of terms such that Student A and Student B cannot talk past each other in the synthesis?
  3.  **Recombination Rule Ex-Ante:** **KEPT.** This is the strongest filter. If you cannot write the "Therefore..." paragraph before seeing the "Because..." paragraphs, you are exploring, not decomposing.
  4.  **Load Transfer:** **KEPT.** No "residual questions." If a sub-task is just the main question with synonyms, it fails.
  5.  **Top-Job Reduction:** **KEPT.** But quantified: The PI's synthesis time must be < 50% of the time it would have taken to write the whole draft solo.

  ## Part II: The Procedure (Run this in order)

  **Step 1: The Skeleton Test (Recombination Rule)**
  *   **Action:** Draft the section headers and the first sentence of every paragraph in the final synthesis chapter *now*. Leave `[BLANK: Student A Input]` where student work goes.
  *   **Pass:** The blanks are specific data/arguments (e.g., "Kant's specific formulation of the Categorical Imperative").
  *   **Fail:** The blanks are judgments (e.g., "Whether Kant's view is plausible").
  *   **Stop:** If you cannot draft the skeleton, **DO NOT DECOMPOSE.** This is a solo task.

  **Step 2: The Glossary Test (Interface Stability)**
  *   **Action:** Write a one-paragraph definition for every key term the students will use.
  *   **Pass:** Student A and Student B can use these definitions without needing to call each other.
  *   **Fail:** The definition of a term in Task A depends on the outcome of Task B.
  *   **Stop:** If terms are essentially contested (e.g., "justice," "knowledge") and your definition *is* the argument, **DO NOT DECOMPOSE.**

  **Step 3: The Verification Budget (Verification Asymmetry)**
  *   **Action:** Estimate hours to check each student's draft vs. hours to write that section yourself.
  *   **Pass:** Check time < 0.5 * Write time.
  *   **Fail:** Check time ≥ Write time.
  *   **Stop:** If verification is too costly, **DO NOT DECOMPOSE.** (Exception: See "Flagging" below).

  **Step 4: The Residual Check (Load Transfer)**
  *   **Action:** Look at the hardest sub-task.
  *   **Pass:** It is a literature review, a formal proof, or a historical exegesis.
  *   **Fail:** It is "Evaluate the strength of..." or "Decide whether..."
  *   **Stop:** If the hard philosophical lifting is in the sub-tasks, **DO NOT DECOMPOSE.**

  ## Part III: Decision & Flagging

  **Decision:**
  *   **GREEN:** Passes all Steps. Proceed.
  *   **RED:** Fails Step 1 or 4. Do not assign. PI writes this.
  *   **YELLOW:** Fails Step 2 or 3. Proceed only with "Flag" (see below).

  **Flagging (The "Judgment Call" Lab Coat):**
  Some projects fail the efficiency tests but are worth running for pedagogical reasons. If you proceed on a YELLOW:
  1.  **Mark the file:** "Pedagogical Decomposition."
  2.  **Acknowledge Cost:** PI time will exceed solo writing time.
  3.  **Justification:** Student training > Paper quality.

  ***

  # One-Page Memo Template (For Student File)

  **Project Title:** ___________________
  **Student:** ___________________
  **PI Decision:** [ GREEN / YELLOW / RED ]
  **Date:** ___________________

  **Decomposition Logic:**
  *   **Recombination Rule:** [Attached: Synthesis Skeleton with Blanks]
  *   **Key Definitions:** [Attached: Glossary]
  *   **Verification Plan:** PI will check for [Specific Criterion] within [X] hours.

  **Risk Flags (If YELLOW):**
  *   [ ] Interface Stability Risk (Terms may shift)
  *   [ ] Verification Cost Risk (PI check time high)
  *   [ ] Pedagogical Priority (Efficiency sacrificed for training)

  **PI Signature:** ___________________
  **Postdoc Witness:** ___________________

  ***

  # Analysis of HCH Assumptions & Breakage

  You asked what the procedure inherits from HCH and where it breaks.

  **1. Faithfulness (The Copy Problem)**
  *   *HCH Assumption:* Sub-agents are faithful copies of the top agent.
  *   *Reality:* Students are not you. They have different intuitions and reading histories.
  *   *Breakage:* This is why **Interface Stability (Step 2)** is critical. You cannot rely on shared intuition. You must hard-code definitions. If the concept relies on "philosophical feel" (e.g., "Does this argument smell like circularity?"), HCH fails. You cannot outsource taste.

  **2. Termination (The Regress Problem)**
  *   *HCH Assumption:* The tree bottoms out in simple queries.
  *   *Reality:* Philosophy questions often deepen when probed. "What does Kant mean?" leads to "Which Kant?" leads to "What is meaning?"
  *   *Breakage:* **The Skeleton Test (Step 1)** forces termination. If you can't write the skeleton, the tree doesn't terminate. This prevents students from falling into a literature rabbit hole that never returns to the main argument.

  **3. Recognizing Good Answers (The Oversight Problem)**
  *   *HCH Assumption:* The top agent can recognize a correct answer without deriving it.
  *   *Reality:* In normative ethics, "correctness" is often the object of inquiry.
  *   *Breakage:* This is not you being slow; it is the nature of the subject. In math, you can check a proof without finding it. In ethics, you often cannot check a justification without endorsing the premises.
  *   *Verdict:* If the sub-task requires normative judgment (e.g., "Is this punishment fair?"), **Verification Asymmetry collapses.** You must do the work to check it. The DAP marks this as RED.

  ***

  # Audit of Your Three Proposals

  ### (a) Alternate Possibilities (AP) vs. Determinism
  *   **Split:** (1) AP commitments, (2) Determinism entailments, (3) Compatibility check.
  *   **Step 1 (Skeleton):** **FAIL.** The synthesis is just the answer to (3). You cannot write the skeleton of the conclusion before knowing the answer to (3).
  *   **Step 4 (Load Transfer):** **FAIL.** Sub-question (3) *is* the original question ("Does determinism rule out AP?"). You have offloaded the literature review, not the reasoning.
  *   **Decision:** **RED.** Do not decompose.
  *   **Reason:** This is a conceptual argument, not a aggregative task. The value is in the *connection*, not the nodes.

  ### (b) Inventory of Objections
  *   **Split:** One student per objection (Source, Response, Acceptance).
  *   **Step 1 (Skeleton):** **PASS.** The synthesis is a list or a taxonomy. The blanks are factual ("Objection raised by X in Year Y").
  *   **Step 2 (Glossary):** **PASS.** "Objection" and "Response" are stable enough for this purpose.
  *   **Step 3 (Verification):** **PASS.** Checking if a citation exists is faster than finding it.
  *   **Decision:** **GREEN.**
  *   **Reason:** This is research assistance, not philosophical decomposition. It works because the recombination rule is trivial (concatenation).

  ### (c) Legal Punishment (Retributivism, Consequentialism, Expressivism)
  *   **Split:** Three students, three theories, PI synthesizes.
  *   **Step 1 (Skeleton):** **YELLOW.** You can write headers, but the "Therefore" depends on how the students characterize the theories. If Student A defines Retributivism differently than Student B defines Consequentialism, the synthesis fails.
  *   **Step 3 (Verification):** **FAIL.** To check if Student A's account of Retributivism is *useful for your argument*, you must understand Retributivism as well as they do. Verification cost ≈ Writing cost.
  *   **Step 4 (Load Transfer):** **FAIL.** The "synthesis chapter" is the actual philosophical contribution. The student chapters are literature reviews. You are keeping the hard part (the judgment) but claiming you decomposed the work.
  *   **Decision:** **YELLOW (Pedagogical).**
  *   **Reason:** Run this only if the goal is to train three students in comprehensive theory analysis. Do not expect the synthesis to be faster than writing it yourself. The "synthesis" will effectively be you rewriting their introductions.

  ***

  # The Honest Part: Systematic Errors

  You asked where this procedure will misjudge.

  **1. False Positives (The "Efficient Garbage" Error)**
  *   **The Case:** A decomposition passes all tests. The skeleton is clear, verification is cheap, terms are stable.
  *   **The Failure:** The resulting paper is technically correct but philosophically dead.
  *   **Why:** The DAP optimizes for *combinability*, not *insight*. You can decompose a literature review perfectly (Proposal B), but that won't generate a new argument.
  *   **Mitigation:** The DAP is a production filter, not an inspiration engine. Do not use it to find new ideas. Use it to execute known ones.

  **2. False Negatives (The "Exploratory" Error)**
  *   **The Case:** A decomposition fails Step 1 (Skeleton) or Step 3 (Verification).
  *   **The Failure:** You reject a project that *requires* decomposition to be solvable.
  *   **Why:** Some problems are too big for one brain, even a PI's. You need the students to map the territory *before* you can draw the map. This is "Exploratory Decomposition."
  *   **Mitigation:** This is the **YELLOW Flag**. If you mark it "Pedagogical," you admit you are paying in PI-time for student learning. If the goal is actually discovery, you must accept that the "synthesis" will take a year, not a month.

  **3. The Normative Blind Spot**
  *   **The Case:** Any question involving "ought," "justified," or "good."
  *   **The Failure:** The procedure assumes facts can be separated from values.
  *   **Why:** In ethics, the description of a theory is often theory-laden. Asking a student to "Describe Utilitarianism" for a paper arguing *against* Utilitarianism invites bias (either theirs or yours in the glossary).
  *   **Verdict:** The DAP is biased toward metaphysics, epistemology, and history. It is hostile to normative ethics. If you try to force normative ethics through this, you will either get shallow work (GREEN on literature reviews) or high friction (RED on arguments).

  **Summary Instruction:**
  Use the DAP to protect your students from working on tasks that require *your* judgment but don't give them *your* authority. Use the YELLOW flag to protect yourself from pretending that training students is the same as writing papers. If the Skeleton Test fails, pick up the pen.
