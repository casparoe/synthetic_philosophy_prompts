answer: |-
  1. Your brother and husband are not contradicting facts but prioritizing different definitions of kinship, one biological and one social. Their argument persists because they are answering different questions about identity rather than disputing the same truth.
  2. Honor your mother's request to keep this secret from the man who raised you, as revealing it now would likely only inflict pain on an elderly man without altering your shared history. Protecting his dignity in his final years respects the actual fatherhood he performed.
  3. Contacting your biological father is permissible for medical or curious reasons, but you must ensure this search does not invalidate the family you currently have. Treat any new connection as an addition to your history rather than a correction of it.
  4. Tell your children that their grandfather is the man who loved and raised your family, regardless of genetic technicalities. Honesty about biology can come later, but the definition of family should remain rooted in relationship.
  5. Resolve the internal conflict by accepting that both your brother and husband are partially right, allowing you to integrate both truths without choosing sides. Your authority to define your own family structure supersedes their semantic debate.
