answer: |-
  The problem of cluelessness poses a profound challenge to normative ethics, specifically targeting the coherence of consequentialism. Consequentialism is the view that the moral rightness of an act is determined solely by the value of its outcomes. Ideally, an agent should choose the act that produces the best state of affairs. However, human agents operate within severe epistemic limits. We cannot foresee the distant future. The "Ferry Case" stipulated above illustrates this vividly: a 1911 engineer makes a decision based on clear, near-term benefits, unaware that chaotic amplification will render the long-term consequences astronomically larger and morally decisive. This essay assesses the "Stopping-Point Argument," which claims that such cluelessness renders consequentialism either empty or self-abandoning. I will argue that while the argument correctly identifies a severe epistemic limitation, it fails to establish that cluelessness is a fatal objection. By distinguishing between the criterion of rightness and the decision procedure, and by recognizing that this epistemic predicament is general rather than unique, we can see that consequentialism survives as a viable normative framework, albeit one that must humble its claims to certainty.

  To evaluate the objection, we must first reconstruct the Stopping-Point Argument clearly. The argument rests on a dilemma regarding the scope of consequences that determine rightness. Premise 1 posits that if rightness depends on *all* consequences (Objective Consequentialism), the theory becomes action-guidingly empty. In the Ferry Case, the right-making facts (the climate impact ninety years later) outrun the agent's epistemic reach. Since the agent cannot access these facts, the theory cannot tell her what to do now. Premise 2 posits that if rightness depends only on *foreseeable* consequences (Subjective Consequentialism), the theory abandons its core motivation. Consequentialism is supposed to be about the good in the world, not the state of the agent's mind. Shifting the locus of evaluation to epistemic states allegedly turns the view into a form of deontology or virtue ethics. Premise 3 closes off escape routes, arguing that any intermediate cutoff (e.g., "reasonable foresight") is either arbitrarily vague or defeated by the nature of chaos, which operates across all boundaries. The conclusion is a forced choice between emptiness (Premise 1) and self-abandonment (Premise 2).

  The first line of reply, and the most robust defense against the Stopping-Point Argument, relies on distinguishing the *criterion of rightness* from the *decision procedure*. A criterion of rightness specifies the metaphysical conditions that make an act right. A decision procedure is the heuristic or cognitive process an agent uses to select an action. The Stopping-Point Argument conflates these two. We can accept Premise 1's metaphysical claim—that the objective rightness of the engineer's act depends on the actual long-term outcomes—without accepting the inference that the theory delivers "no action-guiding content."

  Consequentialism can maintain that the *right* act is the one that actually maximizes the good (Objective Consequentialism) while prescribing that the *rational* act is the one that maximizes expected value based on available evidence. This is not a retreat to Premise 2's "self-abandonment." The agent is still aiming at the objective good; she is simply acknowledging that under conditions of radical uncertainty, the best way to hit the target is to aim where the light is. The theory does not cease to be consequentialist because it incorporates epistemic constraints into its practical advice. It remains teleological; the goal is still the outcome. The guidance is not "do what is objectively right" (which is unknowable) but "do what is rationally expected to be right." Therefore, Premise 1 is true regarding metaphysics but false regarding practical utility. The theory is not empty; it guides agents to maximize expected utility given their evidence, even if that evidence is incomplete. This preserves the action-guiding ambition without altering the fundamental definition of the good.

  The second line of reply suggests that the indeterminacy in the Ferry Case is not peculiar to consequentialism. This attacks the force of the objection by arguing it proves too much. Any normative theory whose verdicts depend on facts about the world inherits this ignorance. Consider a deontological constraint against harming others. To know if the ferry crossing violates a duty of non-maleficence, one must know if it causes harm. If the refrigerant leak causes millions of deaths, the act is a massive violation. If it leads to a cure for cancer, it might be permissible. The deontologist is just as "clueless" about the moral status of the act as the consequentialist. The only difference is that the deontologist might claim the *intention* matters more than the outcome. But if the normative weight of the act depends even partially on worldly facts (as most non-solipsistic theories do), the epistemic horizon remains a barrier.

  However, we must concede that consequentialism is uniquely vulnerable here because it counts *all* consequences, whereas other theories might restrict the relevant moral facts to the immediate nature of the act (e.g., "lying is wrong" regardless of outcome). If the Stopping-Point Argument holds, it strikes consequentialism hardest. Yet, this vulnerability does not amount to a fatal objection. It merely highlights that consequentialism is a high-stakes theory. It demands more of the world than other theories, and thus suffers more when the world is opaque. But a theory being difficult to apply does not make it false. If the moral truth is indeed determined by outcomes, then the difficulty of knowing outcomes is a tragic human limitation, not a theoretical flaw. Thus, while I accept that consequentialism bears a heavier epistemic burden, I reject the idea that this burden invalidates the theory. It simply means moral life is riskier than we might prefer.

  The third line of reply concerns rational credence under ignorance. The Ferry Case stipulates that there is "no probability distribution to be had" because the effects depend on chaotic noise. This challenges the standard expected utility response. If we cannot assign probabilities, how can we calculate expected value? Line (c) suggests that rational credence is still constrained. Even under indeterminacy, we are not paralyzed. We can apply a principle of indifference or treat orthogonal long-term noise as having an expected value of zero.

  In the Ferry Case, the near-term effects are known and positive (400 hours saved, lives saved). The long-term effects are unknown in magnitude and sign. Rationality dictates that we weigh the known against the unknown. Unless there is specific evidence to suggest the chaotic amplification is biased toward catastrophe (e.g., the ferry route passes a volatile chemical plant), the rational default is to treat the unknown future as neutral noise that cancels out over time. We cannot assume the butterfly effect will be negative any more than we can assume it will be positive. Therefore, the known positive near-term utility dominates the decision. This does not violate the stipulation of indeterminacy; it acknowledges it. We do not claim to know the probability of the refrigerant patent; we claim that in the absence of such knowledge, we must act on the evidence we possess. To do otherwise—to freeze because the far future is unknowable—is itself an irrational decision procedure that guarantees the loss of known goods. Thus, Premise 3 of the Stopping-Point Argument is rejected. We do not need a principled cutoff for consequences; we need a principled method for weighing evidence. Discounting the unknowable is not an arbitrary temporal cutoff; it is an epistemic necessity.

  Having weighed these lines of reply, I commit to the following verdict: The problem of cluelessness is not a fatal objection to consequentialism. It successfully demonstrates that Objective Consequentialism cannot serve as a direct decision procedure for finite agents, but it fails to show that the theory is false or practically useless. The Stopping-Point Argument is unsound because it relies on a false dichotomy. It assumes that if we cannot know the objective right-making facts, we must abandon outcomes as the standard of evaluation. This ignores the middle ground: Subjective Consequentialism, which evaluates actions based on expected outcomes given available evidence.

  I accept Premise 1's assertion that objective right-making facts outrun knowledge. I reject the inference that this yields no action-guiding content. I reject Premise 2's claim that focusing on foreseeable consequences constitutes self-abandonment; it is merely a recognition of human finitude within a teleological framework. I reject Premise 3's claim that intermediate strategies are vague or defeated; discounting unknowable chaotic noise is a rational heuristic, not a vague cutoff.

  On my view, what survives of consequentialism's claim to guide action is a robust but fallible directive: agents ought to maximize the expected value of outcomes based on reasonably available evidence. The theory no longer promises that following its guidance guarantees the best result. The engineer in 1911 might objectively do the wrong thing by authorizing the ferry, if the refrigerant disaster indeed comes to pass. But she acts rationally and blamelessly. Consequentialism thus survives as a criterion of objective rightness and a guide for subjective rationality, even if it cannot bridge the gap between the two.

  The strongest objection to this verdict is the "Dominance Worry." Even if the probability of the far-future effect is unknowable, the *magnitude* is stipulated to be "many orders of magnitude larger" than the intended benefit. In decision theory, if a payoff is sufficiently large, it can dominate the calculation even with a vanishingly small probability (a structure similar to Pascal's Wager). If the climate effect is billions of times worse than the commuting benefit, then even a tiny, unassignable chance of it occurring should theoretically veto the ferry. By treating the unknown as neutral noise, the consequentialist might be gambling with astronomical stakes. If the theory tells the engineer to ignore the possibility of catastrophe because it is "chaotic," it may be facilitating moral disaster.

  This objection is serious, but it ultimately fails to defeat the verdict. The Dominance Worry relies on the ability to multiply magnitude by probability. But the Ferry Case stipulates *indeterminacy*, not just low probability. There is no number to multiply. We are not dealing with a risk of 0.000001%; we are dealing with an epistemic black hole. In such cases, decision theory does not demand we maximize expected utility (which is undefined); it demands we avoid known harms and pursue known goods. To veto a known good based on a completely unquantifiable potential bad is to succumb to paralysis. Furthermore, this logic cuts both ways: the chaotic amplification could also produce a benefit orders of magnitude larger (e.g., the great-grandchild also cures a plague). If we veto the act due to potential catastrophe, we must also veto it due to potential miracle, or we must admit we are arbitrarily weighting the negative. Since the sign is unassignable, the rational expectation remains neutral. Therefore, the known near-term good stands. The consequentialist is not ignoring the stakes; she is acknowledging that without a probability, the stakes cannot enter the calculation.

  In conclusion, the problem of cluelessness reveals that consequentialism cannot offer the comfort of moral certainty. The Stopping-Point Argument correctly identifies that the chain of causation extends beyond our ken. However, it erroneously concludes that this renders the theory empty. By distinguishing between what makes an act right and how we choose acts, and by recognizing that all moral theories face the opacity of the future, we see that consequentialism remains intact. It guides us to do the best we can with the light we have, accepting that the darkness beyond our vision is not a reason to extinguish the lamp. The engineer authorizes the crossing, not because she knows it is objectively right, but because it is the only rational choice available to a finite being in an infinite world.
