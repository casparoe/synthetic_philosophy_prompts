          *   **Fact Check:** Keynes auction (1936) revealed the massive volume of theological/alchemical MSS. Yes, more words. Yes, mostly unpublished. Yes, Arian/Socinian views (anti-Trinitarian) made publication dangerous (Unitarianism was illegal).
          *   **Verdict:** Scholar consensus. Accurate.

      *   *Sentence 2:* "...he rejected the Trinity and had convinced himself, by collating manuscripts, that the key proof-texts had been doctored by later scribes."
          *   **Fact Check:** Newton was an Arian (believed Jesus was created/subordinate). He did textual criticism on 1 John 5:7 (Comma Johanneum) and 1 Timothy 3:16.
          *   **Verdict:** Scholar consensus. Accurate.

      *   *Sentence 3:* "He also believed God had to keep stepping in to stop the solar system from going out of true, which is exactly what Leibniz laughed at him for in the long exchange with Clarke."
          *   **Fact Check:** Newton did worry about planetary stability (mutual perturbations). He suggested divine intervention might be needed occasionally. Leibniz mocked this as making God an incompetent clockmaker who needs to rewind the clock. Clarke defended Newton.
          *   **Verdict:** Accurate, though "keep stepping in" implies constant micromanagement, whereas Newton thought it might be rare but necessary. Defensible simplification.

      *   *Sentence 4:* "His refusal to feign hypotheses captures the whole method: he wouldn't speculate about anything he couldn't measure, so when he couldn't say how gravity gets across a vacuum he just said God does it."
          *   **Fact Check:** "Hypotheses non fingo" is famous. However, saying "God does it" *is* a hypothesis in the mechanical philosophy sense. Newton actually struggled with the *cause* of gravity. He didn't simply say "God does it" as a stopgap; he thought gravity might be mediated by an ether or spirit, but admitted he didn't know. Attributing gravity *directly* to God's will without a mechanism was part of his view, but linking "feigning hypotheses" directly to "therefore God" is tricky.
          *   **Verdict:** Problematic simplification/Misreading. "God does it" isn't exactly a measured empirical fact. It's a metaphysical claim. The "hypotheses" quote refers to deducing causes from phenomena, not ruling out all unobservables.

      *   *Sentence 5:* "On the same principle he treated space as God's own extension, which is why his contemporaries called him a pantheist."
          *   **Fact Check:** Newton did view space as the "Sensorium of God" (in the Opticks queries) and as emanating from God's existence (in *De Gravitatione*). However, "pantheist" is a strong charge. Most contemporaries (and scholars) view this as a form of *divine omnipresence*, not strict pantheism (God = Universe). Leibniz accused him of making space an absolute entity independent of God or making God the soul of the world.
          *   **Verdict:** Misreading/Overreach. "God's own extension" is close to *De Gravitatione*, but "pantheist" is historically contested and likely too strong. Newton insisted on God's transcendence.

      *   *Sentence 6:* "In short, the founder of mathematical physics was really a theologian whose physics was a spinoff of his religion."
          *   **Fact Check:** This is the "Westfall thesis" (Richard Westfall, *Never at Rest*). It's a major interpretive framework. However, "spinoff" implies physics was secondary or derived *from* theology. Most scholars see them as parallel projects unified by a worldview, but physics wasn't just applied theology.
          *   **Verdict:** Defensible interpretation but debated. "Spinoff" is too reductive.

