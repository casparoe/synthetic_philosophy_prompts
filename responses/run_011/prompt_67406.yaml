answer: |-
  # JOINT STATEMENT ON THE STRUCTURE OF MORAL STATUS
  **Adversarial Collaboration: Graduate Seminar in Normative Ethics**
  **Signatories:** The Gradualist Camp & The Threshold Camp

  ## I. AGREED CLAIMS
  *The undersigned camps affirm the following propositions as a shared foundation for further inquiry.*

  1.  **Empirical Continuity of Capacities:** We agree that the biological and psychological substrates often associated with moral consideration—nociception, associative learning, behavioural flexibility, and neural complexity—are distributed across taxa along a continuum. There is no single phylogenetic line where all such capacities abruptly appear or disappear.
  2.  **The Function of Moral Status:** We agree that ascribing moral status is a practical endeavor intended to guide action. Specifically, it serves to limit the permissibility of instrumentalizing a being for the benefit of others. We disagree on whether this limitation functions as an absolute prohibition (for some beings) or a variable weight in a cost-benefit analysis.
  3.  **The Evidential Situation:** We agree that our access to the phenomenal states of non-human entities is indirect. We rely on inference to the best explanation based on behaviour and physiology. Consequently, there is a zone of epistemic uncertainty surrounding marginal cases (e.g., late-stage invertebrates, early-stage embryos, AI systems) where confidence in the presence of any morally relevant capacity is low.

  ## II. RESIDUAL DISAGREEMENTS
  *The following table isolates the substantive metaphysical and normative disagreements. Wording has been vetted to ensure each camp accepts the characterization of its own view; the third column notes the nearest formulation the opposing camp can accept without conceding the point.*

  | Core Disagreement | Formulation Accepted by Proponent | Nearest Formulation Acceptable to Opponent |
  | :--- | :--- | :--- |
  | **The Metric of Value** | **Gradualist:** Moral value is scalar; it waxes and wanes in proportion to the richness of phenomenal consciousness. | **Threshold:** "Gradualists treat moral value as scalar," though we deny this captures the deontic nature of rights. |
  | **The Nature of the Claim** | **Threshold:** Beings above the threshold possess 'dignity' (unconditional worth); those below possess 'price' (fungible value). | **Gradualist:** "Threshold theorists posit a lexical priority for certain beings," though we deny this reflects a metaphysical discontinuity in value. |
  | **The Location of the Line** | **Threshold:** A discrete capacity (e.g., 'subject of a life') marks a binary transition in moral kind, even if the underlying biology is fuzzy. | **Gradualist:** "Threshold theorists identify a pragmatic cutoff for policy," though we deny this cutoff reflects a sudden jump in moral reality. |

  ## III. CRUCES AND PRE-REGISTERED PREDICTIONS
  *Settlement of these sub-questions would compel at least one camp to revise its position. For each crux, we identify a body of evidence or case study both camps accept as relevant, and record their divergent predictions.*

  ### Crux 1: The Deontic Function of Partial Standing
  **Question:** Can partial standing function as a side-constraint on action, or does it operate *only* as a weight in aggregation?
  **Accepted Evidence:** Trolley-style intuition pumps involving mixed taxa (e.g., sacrificing a colony of ants to save a single mammal vs. sacrificing a mammal to save a colony of ants).
  **Predictions:**
  *   **Gradualist:** We predict that intuitive permissibility tracks the *sum total* of weighted welfare. If the aggregate suffering of the insects exceeds the mammal's loss, the action is permissible. Partial standing never vetoes aggregation.
  *   **Threshold:** We predict that once a being crosses the threshold, its interests cannot be outvoted by the aggregate interests of beings below the threshold, regardless of number. Partial standing (below threshold) acts only as a weight; full standing acts as a constraint.

  ### Crux 2: The Aggregation Test (Reductio or Cost?)
  **Question:** Does the gradualist permission to trade one threshold-level being against sufficiently many marginally sentient ones constitute a *reductio ad absurdum* of gradualism, or a cost the theory can absorb?
  **Accepted Evidence:** Habitat management scenarios (e.g., culling one high-sentience invasive predator to prevent the starvation of 1,000,000 low-sentience prey).
  **Predictions:**
  *   **Gradualist:** We predict this verdict is absorbable. If the total phenomenal disvalue is lower in the trade, the action is morally required. To deny this is to privilege 'kind' over 'suffering,' which is speciesist in disguise.
  *   **Threshold:** We predict this verdict is a *reductio*. If a theory implies a million marginally sentient beings can outweigh one 'subject of a life,' it fails to capture the concept of *rights*. We will maintain the threshold even if it implies 'lexical' inefficiency.

  ### Crux 3: The Anaesthesia Sorites
  **Question:** Can any threshold of moral status survive the sorites-style pressure of induction into and emergence from general anaesthesia?
  **Accepted Evidence:** Pharmacological data on Loss of Consciousness (LOC), specifically the non-linear but continuous EEG changes during propofol induction.
  **Predictions:**
  *   **Gradualist:** We predict that the smooth gradient of neural suppression mirrors a smooth gradient of moral status. There is no specific second where status vanishes; it fades.
  *   **Threshold:** We predict that consciousness is a phase-shift property (like liquidity). While the *cause* is gradual, the *state* (being a subject of experience) is binary. There is a fact of the matter regarding the last moment of status, even if epistemically inaccessible.

  ## IV. MERELY VERBAL DISPUTES AND DISAMBIGUATION
  *The camps concede that a significant portion of our disagreement stems from equivocation on key terms. We propose the following disambiguation to dissolve these verbal strands.*

  **1. "Moral Status" vs. "Moral Significance"**
  *   **The Confusion:** Both camps have used "Moral Status" to mean two different things: (A) *Whether* a being counts at all (Entry), and (B) *How much* a being counts (Weight).
  *   **The Concession:**
      *   **Gradualists** concede that there is a binary sense of "Status" (Entry): A rock has none, a mouse has some. They argue that once Entry is granted, Weight varies continuously.
      *   **Threshold Theorists** concede that "Significance" (Weight) can vary among those who have Entry (e.g., a human may have more complex interests than a mouse). They argue that Entry itself is binary.
  *   **The Resolution:** We agree to distinguish **Standing** (the binary property of having interests that count) from **Significance** (the scalar weight of those interests). The Gradualist claim is best read as: "Standing is binary, but Significance is scalar." The Threshold claim is best read as: "Standing is binary, and Significance is lexically prioritized for those above the threshold." *Much of our debate reduces to whether 'Standing' and 'Significance' can come apart.*

  **2. "Consciousness" as Capacity vs. State**
  *   **The Confusion:** Threshold theorists speak of consciousness as a *capacity* (which one either has or lacks, like having a heart). Gradualists speak of consciousness as a *state* (which admits of intensity and richness, like heart rate).
  *   **The Concession:**
      *   **Threshold Theorists** acknowledge that the *exercise* of the capacity comes in degrees (depth of sleep, richness of experience).
      *   **Gradualists** acknowledge that the *hardware* required for the capacity may have a minimum threshold (a certain neural architecture must exist to support any experience at all).
  *   **The Resolution:** We agree that the dispute is not about the biology (which both accept is continuous in some respects and threshold-like in others) but about which biological feature maps onto the *moral* binary. If the Threshold camp admits the *value* of the experience scales with intensity, and the Gradualist camp admits there is a minimum hardware requirement for *any* value, the practical divergence narrows significantly.

  **3. "Price" vs. "Weight"**
  *   **The Confusion:** Threshold theorists describe beings below the line as having "mere price." Gradualists interpret this as "utilitarian weight."
  *   **The Concession:** Both camps agree that beings below the threshold (if any exist) can be sacrificed for the greater good. The Threshold camp calls this "having a price"; the Gradualist camp calls this "having low weight."
  *   **The Resolution:** This is purely terminological. We agree to use **"Aggregatable Value"** for beings whose interests can be outvoted by numbers, and **"Protected Interest"** for beings whose interests cannot. The dispute is then reduced to: *Which beings have Protected Interests?* rather than *Do beings have Price or Weight?*

  ***

  **Signed,**

  *The Gradualist Camp* | *The Threshold Camp*
