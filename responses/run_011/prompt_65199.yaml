  1.  **Buy** 100 units of ($E$ given $A$) at price $0.70$. (Cost: $70$)
  2.  **Sell** 100 units of ($A \land E$) at price $0.15$. (Revenue: $15$)
  3.  **Sell** 70 units of ($\neg A$) at price $0.50$. (Revenue: $35$)

