  # ERROR ANALYSIS & CONTESTABILITY

  **Common Errors (Blog-Formed Students):**
  1.  **Theorem Recitation (Part A):** Writing "Ren violates $P(E|A) = P(AE)/P(A)$, therefore she is Dutch Booked" without constructing the bets. **Cost:** Lose all Construction marks (6/12).
  2.  **Refund Ignorance (Part A):** Calculating the $\neg A$ payoff as $-70$ (cost lost) rather than $0$ (cost refunded). This breaks the sure-loss equality. **Cost:** Lose Payoff Table marks (3/12).
  3.  **Infinite Summation (Part B):** Claiming $\sum cr(H_i) = 1$. **Cost:** Lose Finite Impossibility marks (4/12).
  4.  **Direction Confusion:** Buying when they should sell. If the portfolio yields Ren a profit, it is not a Dutch Book. **Cost:** Lose Construction marks.

  **Contestable Areas (Award Full Credit for Heterodoxy):**
  1.  **Defense of Dana:** A student may argue Dana is *not* irrational. Full credit is awarded if they argue that Countable Additivity is not a requirement of rationality (de Finetti's position), provided they acknowledge this makes her vulnerable to countable Dutch Books. The key is recognizing the trade-off between CA and vulnerability.
  2.  **Package Principle:** A student may argue the Package Principle is false (e.g., due to transaction costs or cognitive limits). If they argue that Ren is locally rational but globally vulnerable, and that this does not imply *belief* inconsistency, award full marks for Part A(3). The exam tests their ability to identify the premise, not necessarily to endorse it.
  3.  **Part B.1 Argument:** If a student proves finite impossibility using linear algebra (rank of the bet matrix) rather than the "ticket $k>n$" argument, this is First Class.

  **Feasibility Check:**
  *   **Time:** 75 minutes is tight for the arithmetic in Part A. The numbers ($100, 100, 70$) are chosen to be mental-math friendly.
  *   **Part B.2:** Constructing the infinite portfolio is conceptual, not computational. Feasible.
  *   **Part C:** Reflective. Feasible.

  **Design Repair:**
  The original numbers ($0.21, 0.49...$) were repaired to ($0.15, 0.35...$) to ensure the $100 stake yields an integral loss ($20). Without this repair, students would waste time on decimals, violating the "arithmetic does the philosophical work" constraint. The logic of the question remains identical.
