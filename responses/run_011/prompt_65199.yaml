  # EXAM QUESTION

  **Course:** Formal Epistemology (Year 4)
  **Time:** 75 Minutes
  **Total Marks:** 30

  **Instructions:** Answer all parts. Calculators are not permitted. You may assume standard propositional logic. All betting conventions are defined below.

  **Betting Conventions:**
  1.  **Unconditional Bet:** A bet on proposition $X$ with stake $S$ and price $p$ costs the agent $S \cdot p$. If $X$ is true, the agent receives $S$. If $X$ is false, the agent receives $0$.
  2.  **Conditional Bet:** A bet on $Y$ given $X$ with stake $S$ and price $q$ costs the agent $S \cdot q$.
      *   If $X \land Y$ is true, the agent receives $S$.
      *   If $X \land \neg Y$ is true, the agent receives $0$.
      *   If $\neg X$ is true, the bet is **called off**: the agent's cost $S \cdot q$ is refunded in full (net payoff 0 for this bet).
  3.  **Fairness:** An agent considers a bet "fair" if the price equals their credence. They are willing to take either side (buy or sell) of any fair bet.
  4.  **Dutch Book:** A portfolio of bets is a Dutch Book if the agent's net financial change is strictly negative in every possible world.

  ---

  **Part A (12 Marks)**
  An agent, Ren, has an opinion set generated by two propositions $A$ and $E$. Her unconditional credences over the four atomic states are:
  *   $cr(A \land E) = 0.15$
  *   $cr(A \land \neg E) = 0.35$
  *   $cr(\neg A \land E) = 0.20$
  *   $cr(\neg A \land \neg E) = 0.30$

  These sum to 1.0. However, Ren quotes a betting price of **0.70** for a conditional bet on $E$ given $A$.

  1.  Construct an explicit portfolio of exactly three bets (transacted at Ren's quoted prices) that guarantees Ren a net loss. Specify the direction (buy/sell), stake, and proposition for each bet. Use a stake of $100 for the conditional bet.
  2.  Provide a payoff table showing Ren's net financial change in the three relevant worlds ($A \land E$, $A \land \neg E$, $\neg A$). State the guaranteed loss amount.
  3.  Explain why each bet in your portfolio is individually "fair" by Ren's own lights. What specific premise allows the move from "each bet is fair" to "the portfolio is irrational"?

  **Part B (12 Marks)**
  A second agent, Dana, faces a countable lottery with tickets $1, 2, 3, \dots$. Exactly one ticket will win. Let $H_i$ be the proposition that ticket $i$ wins. Let $D$ be the proposition $\bigvee_{i=1}^{\infty} H_i$ (some ticket wins).
  Dana's pricing function is the finite–cofinite zero-one measure:
  *   $cr(H_i) = 0$ for all $i$.
  *   $cr(F) = 0$ for any finite disjunction of $H_i$.
  *   $cr(D) = 1$.

  1.  Argue why no **finite** portfolio of bets at Dana's prices can guarantee her a net loss.
  2.  Construct an explicit **countably infinite** portfolio of bets at Dana's prices that guarantees her a net loss of $1. Verify the payoff.
  3.  Consider a finite truncation of your infinite portfolio (including only bets on $H_1$ through $H_n$). Explain why this truncation fails to guarantee a loss and identify precisely where the bookie's profit originates in the infinite case.

  **Part C (6 Marks)**
  Reflect on the results from A and B.
  1.  Is the "sure-loss criterion" a single standard of rationality, or a family of standards indexed to admissible portfolios?
  2.  Is Dana irrational? If you were a defender of Dana, how would you answer the charge that her opinions cannot be jointly correct given she is certain some ticket wins ($D$) while pricing each candidate ($H_i$) at zero?

