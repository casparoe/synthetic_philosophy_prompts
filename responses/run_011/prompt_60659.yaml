answer: |-
  The heater in Section 4 had been broken since Tuesday, humming with a dying rattle that vibrated the staplers on the desk. Elias pulled his cardigan tighter. On his screen, the red line hovered over the calendar year 89. It was set at December 31st, 23:59. Everyone before was Bracket 89. Everyone after was Bracket 90.

  It was a Tuesday, which meant Cusp Day. The queue outside the glass partition was long. These were the people born within seventy-two hours of the line, petitioning for a reclassification. The law allowed for administrative drift, provided the Clerk could justify the shift in Form 12-B.

  Elias took a sip of lukewarm coffee. He had done this for twelve years. He knew the lines were arbitrary. He knew that a baby born at 23:58 on December 31st was biologically identical to one born at 00:02 on January 1st. But the line determined school intake, conscription eligibility, and the tier of pension contribution. The line was not real, but the consequences were concrete.

  "Next," Elias said into the intercom.

  A woman entered. She looked tired, holding a folder thick with paperwork. Her name was Mara. She sat without being asked.

  "Born January 2nd, 89," Elias said, reading her file. "Bracket 90. You want to move to 89?"

  "My brother," Mara said. Her voice was flat, practiced. "He was born December 30th. We were raised in the same house, went to the same school until the Intake Split. Now he's in Service Unit 4, and I'm in Unit 9. The deployment zones are different. If something happens to the border, he goes North, I go South."

  Elias typed a note. This was a standard hardship case. The bureaucracy liked symmetry. Separating siblings was inefficient; it increased administrative overhead when next-of-kin notifications were required.

  "I have the birth certificates," she said, sliding them over. "We're twins. The delay was... complications."

  Twins split by the line were rare. Usually, the Office moved them both to the earlier bracket to preserve unit cohesion. It was a simple fix. Elias could move the line for her specifically, a micro-adjustment. She would become 89. Her brother would remain 89. The data would barely ripple.

  "Wait here," Elias said.

  She nodded, clutching her hands. She looked like someone who had been waiting for years, not just an hour.

  "Next."

  The man who entered was younger, dressed in a suit that didn't quite fit. Kael. Born December 30th, 89. Bracket 89. He wanted to move to 90.

  "Reason?" Elias asked.

  Kael shifted in the chair. "I don't fit 89."

  "That's not a Form 12-B category."

  "I know," Kael said. He looked at the heater, then at Elias. "The benefits for 90 are better. The pension match is higher. But also... I look at the 89s. They're different. They're harder. I'm not like them. I went to the schools for 89, but I learned like a 90. If you leave me here, I'll be stuck in a system that doesn't match my shape."

  Elias stopped typing. This was the other side of the coin. Mara wanted to move for concrete unity; Kael wanted to move for abstract alignment. Mara's reason was legalistic. Kael's reason was psychological. In twelve years, Elias had learned that psychological reasons were usually denied, yet they were the ones that kept him up at night.

  "There's no provision for 'shape'," Elias said.

  "There should be," Kael said. "You draw the line. You decide who we are. If you move it one day, I'm safe. If you don't, I'm... exposed."

  "Exposed to what?"

  "To the weather," Kael said. He didn't smile. "You know how it is. You know what year you graduated into. You know if the jobs were there or not. I graduated into the Crash. The 90s graduated into the Recovery. I'm carrying the Crash debt, but I have the 89 stamina. It doesn't add up."

  Elias felt a familiar itch behind his eyes. He knew the data. He knew that graduates of 89 had earned 14% less over their lifetime than 90s, purely based on the entry quarter. It wasn't personality. It was timing. But listening to Kael, it sounded like personality. It sounded like fate.

  "I'll review," Elias said.

  He dismissed them both. The queue outside shifted. Mrs. Gable, his supervisor, appeared at the glass. She tapped her watch. She didn't care about twins or feelings. She cared about throughput. The red line on the screen needed to be finalized by 5:00 PM so the central server could update the pension algorithms.

  Elias looked at the two files. Mara was an easy yes. Kael was a hard no. If he moved Kael, he set a precedent. If he didn't, he left a man claiming he was born into the wrong weather.

  He opened the master dataset. This was the part he wasn't supposed to look at during active adjudication. The predictive modeling screen. It showed the variance in economic output, health outcomes, and service retention for the two brackets.

  Before the line was set, the data was always messy. The curves overlapped. There was a gradient, not a step. People born in late December 89 looked statistically similar to people born in early January 90. The bell curves merged.

  Elias highlighted Mara's file. He approved the shift. She was now 89.
  He highlighted Kael's file. He hovered over the 'Deny' key.

  He thought about the heater. It was broken, but the room was still warm. Sometimes things worked even when the mechanism was dead.

  He denied Kael.

  Then, he finalized the boundary. He locked the date at December 31st, 23:59. He hit 'Commit'.

  The screen flickered. The central server acknowledged the update.

  Elias leaned back. He looked at the predictive modeling screen again. It was updating in real-time, ingesting the finalized cohort definitions.

  Before he hit 'Commit', the variance between the two groups had been 4.2%. The curves overlapped significantly. It was a messy transition.

  Now, the variance jumped to 6.8%.

  Elias blinked. He refreshed the page. The variance held.

  He zoomed in on the health outcomes. Previously, the rate of chronic fatigue syndrome was nearly identical across the cusp. Now, the graph sharpened. Bracket 89 spiked slightly higher. Bracket 90 dipped. The line where there had been a slope was now a step.

  He opened the employment data. The jagged noise of the transition period smoothed out. The algorithm was re-categorizing historical data based on the new legal reality. But it wasn't just re-labeling. The aggregate behavior of the groups was shifting to match the classification.

  It happened every time. He had seen it with the 75/76 split. He had seen it with the 82/83 split. Once the government said "These people are Group A and those people are Group B," the people began to act like Group A and Group B. The pension schemes diverged. The school curricula adjusted slightly to match the new intake codes. The social expectations hardened.

  Was the office creating the kind? Or were they just counting differently now that a rule existed? Or was it nothing, just a trick of the aggregation software smoothing out noise to please the supervisors?

  Elias didn't know. He only knew that when he drew the line, the world straightened itself out to meet the ruler.

  Mrs. Gable knocked on the glass. "Done?"

  "Done," Elias said.

  "Good. Go home. The 90s are processing tomorrow."

  Elias packed his bag. He walked past the waiting area. Mara was standing by the door, looking at her phone. She saw him and gave a small, tight nod. She had won. Her brother would be in the same unit.

  Kael was sitting on a plastic chair in the corner. He wasn't looking at anyone. He was staring at his hands. He looked lighter, somehow, despite the denial. Maybe knowing the line was firm was better than wondering if it could move. Maybe the weather was easier to bear when you knew exactly where the shelter ended.

  Elias walked out into the evening. The air was cold. A group of teenagers were loitering by the bus stop, wearing the distinct jackets of the 90 intake. They laughed loudly, a specific rhythm to it. Across the street, a slightly older group, the tail end of 89, stood in silence, smoking.

  He waited for the crosswalk signal. A young boy kicked a soda can across the pavement. The can clattered over the white line of the crosswalk. The boy stopped. He looked at the can, then at the light. He was too young to know what bracket he was, but he knew there were lines. You didn't cross when the hand was up. You didn't step off the curb when the light was red.

  Elias stepped off the curb when the light turned white. He walked home. He made dinner. He turned on the news. They were talking about the housing market. The analyst said, "The 90s are entering the market now, and we expect different behavior than the 89s."

  Elias turned the TV off. He ate his soup. It was cold, but he ate it anyway. He thought about Kael, sitting in the plastic chair, carrying the weight of a crash he hadn't caused. He thought about Mara, safe in her bracket. He thought about the graph on his screen, snapping into place like a bone setting after a break.

  He washed his bowl. He dried his hands on a towel that had a small hole in the center. He rubbed his thumb over the hole, feeling the frayed edges where the fabric had given up. It was just a towel. It didn't matter what year it was bought. It was just worn.

  Elias turned off the kitchen light and went to sit in the dark.
