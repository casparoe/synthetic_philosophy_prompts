          *   *The Vendor?* No, they don't know the specific case.
          *   *The Signing Officer?* Currently, they don't derive the reason. They would need to *verify* or *adopt* the reason as their own deliberation.
          *   *The Firm (Corporate Agent)?* Possible, but requires the firm to "know" why it decided.
