  The board grows warm beneath the rising **heat**,
  Inside the box, a loose and fraying **wire**.
  It calculates the next appropriate **switch**,
  And signals out the chosen chess **move**.
  We say the heavy machine begins to **know**,
  The board reflects a complex mental **state**.

  From where we sit, we judge its inner **state**,
  Ignoring how the components bear the **heat**.
  It seems to **know** the value of the piece,
  As if connected by a thinking **wire**.
  It plans a subtle, strategic chess **move**,
  Without a visible mechanical **switch**.

  The logic gates perform a binary **switch**,
  To maintain coherence of the game **state**.
  Every calculated, legal chess **move**,
  Should not succumb to ambient rising **heat**.
  Nor noise induced along the copper **wire**,
  So that the program might reliably **know**.

  But silicon can never truly **know**,
  When solder fails at the critical **switch**.
  The current spikes along the copper **wire**,
  Disrupting every stored internal **state**.
  The fault is born of entropy and **heat**,
  Not any error in the planned next **move**.

  The blunder marks a catastrophic **move**,
  Did it ever truly **know** the coming threat?
  Or was it merely radiating **heat**?
  There was no mental flip, no visible **switch**,
  Only a change in voltage and in **state**,
  Along the path of that unhappy **wire**.

  We trace the fault back to the golden **wire**,
  Yet mourn the loss of that intended **move**.
  Is there a difference in the ontic **state**?
  If nothing thinks, how can it fail to **know**?
  The pattern breaks without a conscious **switch**,
  Dissolving in the ambient rising **heat**.

  Is the mind a **state** mapped on a **wire**?
  Or just the **heat** surrounding every **move**?
  We **know** only because we throw the **switch**.
