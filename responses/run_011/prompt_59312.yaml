  You are commanding a rescue boat during a catastrophic flood, forced to choose between two rooftops where the water rises equally fast. On the north roof stands a single healthy twenty-year-old whose medical profile indicates a remaining life expectancy of fifty years in full health. On the south roof huddle five unrelated strangers, each eighty years old and suffering from advanced chronic conditions that medical consensus confirms will limit each individual to exactly ten more years of life in full health equivalent. Your fuel permits only one approach, and strict protocol forbids considering past social utility or subjective desire, leaving only the objective metric of total quality-adjusted life years remaining to determine the outcome between the solitary individual and the group of five.

  **Show Your Work**

  **The Consequentialist Verdict:**
  A total-good consequentialist calculates the value of each outcome by summing the expected quality-adjusted life years (QALYs) at stake. Saving the single survivor yields 50 QALYs (1 person × 50 years). Saving the group yields 50 QALYs (5 persons × 10 years). Because the total good produced by either rescue is identical, the consequentialist is genuinely indifferent between the two options. To resolve this indifference without arbitrariness, the consequentialist must randomize between the *options*, flipping a coin to choose between the north roof and the south roof. This results in a 50% chance for the one and a 50% chance for the five.

  **The Taurekian Verdict:**
  Taurek's principle denies that losses sum across persons; the five do not suffer a "greater" loss than the one because there is no super-person who experiences the aggregate loss. Each individual faces the same loss: their own death. Therefore, each of the six people involved has an equal moral claim to be saved. To honor these equal claims, the agent must give each person an equal probability of survival (1/6). Physically, this requires randomizing over *persons* rather than groups, meaning the agent must save the group of five with a 5/6 probability and the single individual with a 1/6 probability.

  **The Separating Feature:**
  The divergence is driven by the **disparity in individual stakes**. The consequentialist weights the decision by the *magnitude* of the benefit per person (50 years vs. 10 years), which cancels out the numerical disparity (1 person vs. 5 persons). The Taurekian ignores the magnitude of the benefit and weights the decision solely by the *count* of persons holding the claim.

  **Sensitivity Analysis:**
  If the tie is broken slightly in favor of the individual (e.g., the young survivor has 51 years expected), the consequentialist must save the one, while the Taurekian still assigns the five a 5/6 chance of survival. If the tie is broken slightly in favor of the group (e.g., each elder has 11 years expected), the consequentialist must save the five, aligning with the Taurekian. This demonstrates that the Taurekian view is insensitive to the total value at stake, whereas the consequentialist view is sensitive to both numbers and individual value.

  **The Strongest Aggregator Attack:**
  The aggregator argues that Taurek's position is internally unstable regarding the method of randomization. If losses do not sum and the five have no greater collective claim than the one, then the two *options* are morally equivalent. If the options are equivalent, justice requires a coin flip between the options (50/50), not a lottery over persons (1/6 vs. 5/6). By insisting on a person-lottery, Taurek effectively allows the numbers to count after all: the group wins more often simply because it contains more bodies, despite the premise that the group possesses no greater moral weight than the individual. Furthermore, the aggregator contends that Taurek's blindness to the magnitude of loss (50 years vs. 10 years) is indefensible; if the single person loses five times more life than each elder, their claim should be stronger, not equal. Taurek's refusal to aggregate forces him to treat a massive loss to one person as morally identical to a minor loss to another, provided both losses are "death," which violates the intuitive principle that the severity of the harm matters.
