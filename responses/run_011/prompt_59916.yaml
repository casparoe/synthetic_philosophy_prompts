  p: The primary hydraulic lock on the archival vault is fully engaged.
  q: The cooling jacket manifold for the adjacent server room is depressurizing due to a leak.

  Elena manages the high-security archival vault. She knows $p$: the primary hydraulic lock is fully engaged. She verified this manually minutes ago using a mechanical key that physically blocks the piston; the engineering is simple, deterministic, and she understands the mechanism perfectly. There are no hidden defeaters; the lock is physically incapable of retracting without her key. The digital monitoring system, which she calibrates weekly, streams pressure data from the lock's holding line. Normally static, the stream begins showing minor pressure dips. Individually, each dip falls within the tolerance of thermal expansion noise specified in her manual, yet collectively they trace a specific decay curve. No single reading triggers an alarm threshold, satisfying the requirement that no individual datum demands attention on its own.

  According to the dogmatist's logic, Elena knows $p$. Therefore, she knows any evidence suggesting the lock is disengaging is misleading. She treats the pressure dips as misleading indicators of lock status and discounts them to maintain rational coherence with her knowledge. She does not flag the data for review, as doing so would imply doubt about $p$, which she knows is false. To update on the dips would be to treat known falsehoods as possibilities, which is epistemically irrational. She formally logs the stream as "stable" based on her prior knowledge, overriding the automated flagging system which would have suggested inspection.

  However, the pressure line shares a manifold with the cooling jacket for the server room next door. The specific decay pattern of the dips indicates a coolant leak in the jacket, proposition $q$. The pressure loss isn't the lock failing; it's the cooling system depressurizing. Because Elena discounts the stream to protect her knowledge of $p$, she never inspects the manifold. She assumes the dips are merely thermal noise consistent with a locked state. She fails to see that the data carries information orthogonal to the lock's status. Her decision to not dispatch maintenance is based on the assumption that the system is nominal.

  The coolant leak goes unchecked for twelve hours. The server room overheats, destroying a client's irreplaceable research data stored on the adjacent cluster. Elena could have verified $q$ instantly using a handheld thermal imager kept in the vault anteroom, a tool she uses for routine electrical checks. There was no cost to checking, and no reason to avoid it other than her decision to ignore the data stream. The lock remained engaged throughout; $p$ was never false. The harm was entirely collateral, stemming from her refusal to process the data for any purpose other than verifying $p$.

  1. The step "S is in a position to know that any evidence against p is misleading" fails when extended to $q$ because it equivokes on the term "evidence": the datum is misleading regarding $p$ but veridical regarding $q$, so knowing the former does not license discarding the latter.
  2. The leakage is a feature of the argument's logical form, not merely psychology; a scrupulous reasoner who accepts the premise "discard misleading evidence" must categorize the datum as noise, thereby structurally preventing the extraction of $q$-content embedded in that noise.
  3. The minimal restriction is to amend the third premise to: "It is not rational to update on evidence one knows to be misleading regarding $p$, provided that evidence carries no independent probative value for other contingent propositions S is obligated to monitor," which blocks the vault case (independent value for $q$) while preserving mundane dismissals like ignoring a horoscope prediction known to be false (no independent value).
