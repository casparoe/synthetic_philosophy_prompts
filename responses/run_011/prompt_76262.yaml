answer: |-
  **POLITICAL PHILOSOPHY 402: CORRUPTION AND PUBLIC INTEGRITY**
  **FINAL EXAMINATION**

  **Time Allowed:** 75 Minutes
  **Total Marks:** 30

  **Instructions:**
  Answer the following question. You are not permitted to cite external authors or theories (e.g., Mauss, Weber, Klitgaard). Arguments relying on namedropping rather than conceptual analysis will be penalized. Write clearly and commit to a position.

  **Case: The Irrigation Office**
  A district irrigation office allocates canal turns during the dry season. The formal state rule is a lottery based on order of application. In practice, the Water Master takes a customary contribution from each household at harvest—a fixed measure of grain, a season's use of a plough team, or school fees covered out of a village fund. Households contributing are moved up the queue.

  Local rule caps the contribution at roughly the value of the household's water share; it cannot be converted to cash. The Water Master ends the year no wealthier than his neighbours. The post is part-hereditary, understood locally as a trust over the commons, though the state now pays him a small salary and classifies him as a civil servant. The arrangement is public: contribution schedules are posted, and appeals go to the elders.

  The formal lottery is used by a handful of households, is known to be fixed by whoever runs the draw, and produces less reliable delivery and lower harvests. However, households too poor to make the capped contribution, and recent out-migrants outside the customary cycle, lose their turns entirely.

  A donor-funded reform program classifies the practice as corrupt and makes aid conditional on abolishing it. The village council objects, arguing this imposes a foreign norm about the public/private split.

  **Question:**
  Is the Water Master's practice corruption? Do not simply apply a definition. Argue for a verdict. Then, explain what would have to be true of the *concept* of corruption for your verdict to be determinate rather than a mere stipulation. Address whether the donor's classification and the council's objection can both be right, or whether one relies on a conceptual confusion.

  ***

  **MODEL ANSWER**

  The Water Master's practice is corruption, but only if we understand corruption as a violation of institutional integrity rather than merely private enrichment or functional inefficiency. To reach a determinate verdict, we must reject the idea that corruption is defined solely by the outcome (harvest yields) or the beneficiary (the Master's personal wealth). Instead, the concept of corruption must be tied to the specific duties attached to a role within a political order.

  The Water Master occupies a hybrid position. Locally, he is a trustee of the commons; formally, he is a state civil servant receiving a salary. This duality is the source of the tension. If we define corruption strictly as "abuse of public office for private gain," the verdict is ambiguous. Is the post public? Yes, because the state pays him and claims authority over the water. Is the gain private? No, because the contributions are capped, non-convertible, and circulate within the village. A student of definitions could stall here indefinitely. To move beyond stipulation, we must ask what work the concept of corruption is doing. Its primary function is to protect the legitimacy of public institutions by ensuring officials act according to the rules constitutive of their office, not according to side-agreements.

  Because the Water Master accepts a state salary and legal classification as a civil servant, he has accepted the duties of the state office. Those duties require adherence to the formal rule (the lottery), regardless of the lottery's inefficiency. By prioritizing the customary contribution over the formal rule, he violates the integrity of the state office he holds. Therefore, it is corruption. The fact that the formal lottery is also rigged by others does not exculpate him; it merely suggests the institution is pervasively corrupt. The fact that the customary system produces better harvests is a defense of efficiency, not integrity. Corruption can be efficient. If we allow efficiency to justify rule-violation by officials, the concept of corruption loses its ability to distinguish between a benevolent dictator and a public servant.

  This conceptual commitment resolves the dispute between the donor and the council. The donor is substantively right: the practice is corrupt because it violates the duties of the state office. The council is conceptually confused. They argue that the donor is imposing a foreign "public/private split." However, the split already exists internally within the Water Master's role. He accepts state salary (public) while managing village trust (private/communal). The conflict is not between foreign and local norms, but between two incompatible roles housed in one person. The council's objection treats the office as purely customary, ignoring the state's formal incorporation of the role.

  However, calling it corruption does not end the inquiry. The practice is corrupt, but the alternative (the formal lottery) is unjust and inefficient. The exclusion of the poor and out-migrants is a violation of equity, regardless of whether the system is corrupt or clean. We must distinguish between corruption (violation of role duties) and injustice (unfair outcomes). The donor program conflates these by demanding abolition of the practice without fixing the underlying institutional failure that makes the customary rule necessary for survival.

  For the verdict to be determinate, the concept of corruption must be independent of welfare outcomes. If corruption were defined by net social harm, this practice might pass, as harvests are higher. But if corruption is defined by the betrayal of the specific trust inherent in the office held, it fails. We must choose the latter. If we define corruption by outcomes, we cannot criticize efficient autocrats. If we define it by role integrity, we can identify the breach while still acknowledging the system's functional benefits. Thus, the Water Master is corrupt because he serves the custom over the state office he officially holds, even if the state office is itself dysfunctional. The concept must prioritize the source of authority (the state role) over the source of legitimacy (local custom) when the two are formally merged, otherwise, the state cannot exist as a distinct entity. The council's error is believing that local legitimacy overrides formal duty; the donor's error is believing that abolishing the corruption will fix the injustice.

  ***

  **MARKING SCHEME**

  **Total: 30 Marks**

  **1. Verdict and Commitment (5 Marks)**
  *   **5 marks:** Commits to a clear verdict (Yes or No) and maintains it throughout.
  *   **0 marks:** Refuses to commit ("It depends on definition," "Both sides are right") without arguing for *why* one conceptual framework should prevail. *Note: Hedging loses all marks in this section.*

  **2. Conceptual Analysis (10 Marks)**
  *   **8-10 marks (A Range):** Explains what work the concept of corruption is doing (e.g., protecting integrity vs. maximizing welfare). Explicitly states what must be true of the concept for the verdict to be determinate (e.g., "Corruption must be defined by role duty, not outcome"). Distinguishes corruption from injustice/inefficiency.
  *   **5-7 marks (B Range):** Applies the stock definition ("abuse of public office for private gain") and catalogues the tensions (Is it public? Is it gain?). Identifies the conflict but fails to resolve it conceptually. Treats the definition as fixed rather than examining its purpose.
  *   **0-4 marks:** Defines corruption purely by outcome (harvests) or purely by law (illegal = corrupt) without philosophical justification.

  **3. Addressing the Dispute (Donor vs. Council) (10 Marks)**
  *   **8-10 marks (A Range):** Identifies whether the dispute is substantive or verbal. Argues that the Council's objection relies on a category error (ignoring the hybrid nature of the office) or that the Donor conflates corruption with development.
  *   **5-7 marks (B Range):** Describes both sides fairly but concludes they are just "different perspectives." Fails to identify the conceptual confusion regarding the public/private split.
  *   **0-4 marks:** Takes one side dogmatically without addressing the other's argument.

  **4. Constraints and Clarity (5 Marks)**
  *   **5 marks:** No external citations (Mauss, etc.). Clear prose.
  *   **0 marks:** Any citation of external theorists results in automatic zero for this section. Poor structure impedes understanding.

  **Grade Boundaries:**
  *   **A (25-30):** Commits to verdict, argues for a specific conceptual function (integrity vs. welfare), diagnoses the Council's confusion, no citations.
  *   **B (18-24):** Commits to verdict, applies standard definition, lists tensions, treats dispute as cultural clash rather than conceptual error.
  *   **C (15-17):** Hedges verdict, relies on outcome-based reasoning, vague on concept.
  *   **F (<15):** No verdict, cites prohibited literature, or misunderstands the case facts.

  ***

  **COMMON ANSWERS IN THE PILE**

  **1. The "It Depends" Hedger**
  *   **Description:** The student argues that under the state definition it is corruption, but under the local definition it is not, and concludes we cannot judge without choosing a side.
  *   **Cost:** Loses 5 marks immediately (Verdict section). Caps at B level because they fail the "determinate rather than stipulation" constraint. They describe the problem but do not solve it.

  **2. The Functionalist (Utilitarian)**
  *   **Description:** Argues it is *not* corruption because the harvests are better and the Master doesn't profit personally. Defines corruption solely by social harm.
  *   **Cost:** Loses marks in Conceptual Analysis (max 5/10). They fail to separate corruption from inefficiency. They miss the "role integrity" move required for an A. Likely a C+/B-.

  **3. The Legalist**
  *   **Description:** Argues it *is* corruption because it violates the state law/lottery rule. Ignores the local legitimacy and the hybrid nature of the role.
  *   **Cost:** Loses marks in Addressing the Dispute (max 5/10). They dismiss the Council's objection as simply "wrong" rather than analyzing the conceptual confusion about public/private splits. Solid B, rarely A.

  **4. The Cultural Relativist**
  *   **Description:** Argues it is *not* corruption because the donor is imposing foreign norms. Accepts the Council's framing entirely.
  *   **Cost:** Loses marks in Conceptual Analysis. They treat "corruption" as purely Western imperialism rather than a concept with specific functional requirements regarding public office. Caps at B.

  **5. The Citation Dropper**
  *   **Description:** Writes a decent essay but opens with "As Mauss argues about the gift..." or cites Weber on bureaucracy.
  *   **Cost:** Automatic 0 in Constraints/Clarity (5 marks lost). Often triggers a review for academic integrity depending on course policy, but strictly per this scheme, they lose the 5 marks and are penalized in Conceptual Analysis for relying on authority rather than argument. Max grade B.
