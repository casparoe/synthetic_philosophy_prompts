  **Subject:** Penhaligon, A. (ID: 8842-SPC)
  **Device:** Series IV Spectral Mapper
  **Activation Date:** 14/03/2023
  **Auditor:** Vance, E. (Tech Dir)

  | Parameter | Pre-Activation Baseline | Post-Activation (Day 1) | Post-Activation (Day 21) | Tolerance | Status |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Discrimination Threshold (ΔE)** | 0.85 | 0.84 | 0.85 | ± 0.05 | PASS |
  | **Reaction Time (ms)** | 340 | 338 | 342 | ± 20 | PASS |
  | **Colour Naming Accuracy** | 99.2% | 99.2% | 99.2% | ≥ 98.0% | PASS |
  | **Inter-Panel Consistency** | 0.98 (r) | 0.98 (r) | 0.98 (r) | ≥ 0.95 | PASS |
  | **Subjective Confidence Score** | 9.5/10 | 9.5/10 | 4.0/10 | N/A | FLAG |

  **Notes:** *Device functioning within specification. Output mapping permuted as per Subject request (Protocol V-7). External behavioural metrics stable. Subjective confidence metric degraded significantly at T+21 days. Incident Report IR-2023-089 filed.*

  ***

  Elena Vance stood before the whiteboard in the conference room, the marker dry in her hand. Outside, the rain blurred the windows of the sensory-testing house, turning the industrial park into a smear of grey and brick. Inside, the air was scrubbed neutral, free of the volatile organics that drift from the flavour labs down the hall. Here, the only smells were toner and dust.

  On the whiteboard, she had drawn a histogram. It represented the magnitude estimation data from Panel Chair Arthur Penhaligon. Normally, the curve was a bell, smooth and predictable, centred on the true difference between the samples. Arthur's post-activation data looked like a comb. The middle values were empty. Every time he was presented with a moderate difference—say, a 15% variance in textile dye saturation—he marked it either as zero difference or maximum difference. There was no in-between.

  "The auditors arrive on the 10th," Elena said, not turning to the room. "They will ask for the traceability chain. They will ask what physical standard anchors Arthur's judgments."

  "He's still accurate," said Marcus from Quality Assurance. "Forced-choice is perfect. If you ask him 'Is A darker than B?', he's right 100% of the time. The chain holds."

  "He says the redness is gone," Elena replied. She capped the marker. "He says he sees the wavelength, he knows the name, but the property itself has been decoupled. If the transducer is reporting a null signal on the internal monitor, can we claim traceability to the visual standard?"

  "It's a response bias," Marcus insisted. "He's lost confidence. Look at the confidence score in the log. When an operator isn't sure, they hedge. He's hedging by picking the extremes. It's a known artefact in magnitude estimation when uncertainty spikes."

  "Or," said Sarah, the lead psychometrician, "the smooth curve was the artefact. The smooth curve was the interpolation his brain used to fill in the gaps. Now that the mapping is permuted, the interpolation failed, and we're seeing the raw binary output of the discrimination mechanism. The comb isn't noise. It's the signal without the smoothing filter."

  Elena turned to face them. "And if it's the signal without the filter, then the 'smoothness' we've been certifying for thirty years was a fabrication of the operator's internal monitoring system. We've been calibrating against an illusion."

  "We calibrate against output," Marcus said. "ISO 17025 doesn't care about the operator's internal state. It cares about the number."

  "ISO 17025 assumes the operator is a stable measuring instrument," Elena countered. "If the instrument claims its primary sensing mode has failed, even if the output matches, do we sign?"

  She left them arguing and walked back to her office. On her desk lay the Incident Report. She picked it up. The paper was heavy, expensive stock. She read Arthur's handwriting again. It was steady, precise, devoid of tremor.

  ***

  **INTERNAL INCIDENT REPORT (IR-2023-089)**
  **Date:** 04/04/2023
  **Filed By:** Penhaligon, A. (Senior Panel Chair)
  **Subject:** Anomaly in Subjective Visual Processing

  **Description of Event:**
  Following activation of the Series IV Spectral Mapper (Protocol V-7), initial performance metrics remained within tolerance. However, at approximately T+18 days, a divergence occurred between discriminative capability and descriptive avowal.

  I can identify red. I can match red. I can quantify the deviation of a sample red from the standard red. However, the qualitative property previously associated with the wavelength range 620–750nm is absent. The data arrives, but the sensation does not follow. It is as if the meter needle moves without the current flowing.

  I am not reporting a loss of function. I am reporting a loss of the monitor that confirms the function. I continue to work because the protocol demands it. I file this report because the calibration log requires a note on operator state.

  **Impact on Measurement:**
  Unknown. Discrimination is intact. Magnitude estimation has become bifurcated (see attached data). I cannot judge 'how much' red, only 'red' or 'not red'. The gradient is gone.

  **Recommendation:**
  Suspend accreditation until internal state can be reconciled with output data.

  ***

  Elena placed the report back in the folder. She thought about her husband, dead three years now. She remembered the sound of his voice, but sometimes, when she tried to recall the timbre of it, she found only the words he had said, devoid of the tone. Was that a loss of memory, or a loss of the mechanism that played the memory? She pushed the thought away. It was unprofessional.

  She needed to speak to Arthur again. He had agreed to an exit interview, though he was not leaving the company, only the panel. He was retiring, effectively. The implant would be deactivated, or so he claimed.

  The interview room was soundproofed. Arthur sat across from her. He looked tired, but his posture was rigid, upright. He wore the same grey suit he had worn for twenty years.

  "Arthur," Elena began. "The auditors need to know if the measurements are valid."

  "They are valid," Arthur said. His voice was flat. "The numbers match the standards. If you put a certified tile in front of me, I will give you the correct value."

  "But you say the experience is missing."

  "The experience was never part of the measurement, Elena. You know this. We train panelists to ignore preference, to ignore feeling. We train them to be machines. The machine is working."

  "Then why the report? Why the comb in the data?"

  Arthur leaned forward. "Because the machine has a display screen. Usually, the screen shows me the world. Now the screen is blank. I know the machine is working because I can see the output logs in my head—the discrimination, the naming. But the display... the display is dark. I am operating by remote control."

  "And the magnitude estimation? The extremes?"

  Arthur paused. He looked at his hands. "When the display is working, I judge the distance between samples by how much 'effort' it takes to distinguish them. Or perhaps by how much 'pressure' the colour exerts. I don't know. It feels continuous. Without the display, I have no pressure. I have only the logic gate. Is it different? Yes or No. If I am forced to put a number on it, and I have no pressure... I guess. I guess zero. I guess ten. There is nothing in the middle."

  "Marcus says you've lost confidence. He says you're guessing because you don't trust the logic gate."

  "Marcus needs there to be a ghost in the machine," Arthur said. "He thinks the ghost provides the precision. I am telling you the ghost was just a progress bar. It showed me what the machine was doing. Now the progress bar is broken. The machine is still doing the work."

  "And if the progress bar was actually doing the work? If the smooth gradient of 'pressure' was the actual measurement mechanism, and the logic gate is just a binary fallback?"

  Arthur smiled, a thin, dry expression. "Then you have been certifying measurements based on a progress bar for thirty years. And you have no way to check."

  "That's what I'm afraid of."

  "Elena," Arthur said. "You spent your life making sure a number in one building means the same as a number in another. You know that numbers are agreements. They are not truths. We agreed that my 'red' matches the tile. It still matches. The agreement holds. The feeling... the feeling was just the noise we learned to ignore."

  "But you reported it."

  "Because the log requires it. Uncertainty must be stated. My uncertainty is now infinite regarding the internal state, though zero regarding the output. How do you write that in the box?"

  ***

  **TRANSCRIPT: EXIT INTERVIEW (EI-2023-14)**
  **Participants:** E. Vance (Tech Dir), A. Penhaligon (SPC)
  **Date:** 05/04/2023

  **Vance:** Do you wish to have the device removed?
  **Penhaligon:** No. It costs too much. And frankly, I don't miss the display. It was distracting.
  **Vance:** You describe the loss as a drainage.
  **Penhaligon:** I describe it as a change in interface.
  **Vance:** If we reinstate you, can you guarantee the magnitude estimation will return to normal distribution?
  **Penhaligon:** No.
  **Vance:** Can you guarantee the discrimination accuracy will hold?
  **Penhaligon:** Yes.
  **Vance:** Then the measurement is traceable?
  **Penhaligon:** To the physical standard? Yes. To the previous operator state? No.
  **Vance:** Which standard does the audit require?
  **Penhaligon:** That is for you to decide. The physics hasn't changed. Only the report of the physics has changed.
  **Vance:** Is the report part of the measurement?
  **Penhaligon:** *(Pause)* In this industry? Yes. We sell the report.
  **Vance:** Then is the product compromised?
  **Penhaligon:** That depends on whether the customer buys the colour or the feeling of the colour.
  **Vance:** They buy the colour.
  **Penhaligon:** Then sign the paper.

  ***

  Elena sat alone in the office. The audit form lay open on her screen. Box 4.2: *Traceability of Measurement Results.*

  The standard procedure was to list the physical references: NIST standard tiles, certified dye concentrations, wavelength calibrators. The chain was unbroken. Arthur's output matched the tiles. The interlaboratory comparisons would pass. No other lab would know the difference. The numbers produced in this building would mean the same thing as the numbers produced in another.

  But the Incident Report was part of the quality manual. If she signed without qualification, she was asserting that the internal state of the operator is irrelevant to the measurement validity. She was asserting that the 'comb' effect is noise, not data. She was asserting that the smooth bell curve of human judgment was never a physical reality, but a user-interface convention.

  If she refused to sign, she was asserting that the 'feel' is the transducer. She was asserting that without the progress bar, the machine is broken, even if the output is perfect. She would be grounding the validity of the measurement in something that cannot be inspected, something that Arthur says is gone, something that no instrument can verify.

  She looked at the calibration log. *Status: PASS.*
  She looked at the Incident Report. *Subjective Visual Processing: Anomaly.*

  There was no test she could run. She could swap Arthur for another panelist, but that other panelist would have their own private display, their own private progress bar, which they would report with complete confidence and no error bar. She could scan Arthur's brain, but she would only see electricity, not redness. She could ask him again, but he would only give her words, not the state itself.

  The uncertainty was not in the wavelength. It was in the definition of the instrument.

  She thought about the comb in the data. The empty middle. If Arthur was right, if the smooth curve was the illusion, then the world was sharper than they thought. Discrete. Binary. The comfort of the gradient was a lie told by the monitoring system to make the data palatable. If he was wrong, then he was a broken man guessing at extremes, and his data was trash.

  There was no way to know. The metrology ended at the skin.

  Elena moved the cursor to the signature field.

  If she signed, she validated the work. The audit would pass. The clients would receive their certifications. The numbers would remain consistent across buildings. But she would be signing off on the idea that the human report of experience is expendable, that the 'redness' is metadata, not data.

  If she did not sign, she halted production. She triggered a review. She admitted that the foundation of their trade—the trained human nose, the calibrated eye—rested on a substrate they could not measure. She would be protecting the integrity of the 'feel', but she would be doing so on the basis of a claim that could not be verified.

  She looked at the rain against the window. It fell without sound in the double-glazed silence of the room.

  Arthur had said the feeling was distracting. She remembered the weight of her husband's hand. Was that data, or was it the progress bar? If she forgot the weight, but remembered the fact of the holding, was the loss real?

  She clicked the signature tool. The digital ink flowed smooth, a continuous line on the screen. It looked like the bell curve. It looked like the lie.

  She typed a note in the remarks field, knowing the auditors would query it, knowing it might not be enough, knowing it was the only honest thing she could do.

  *Remark: Operator internal monitoring system reports decoupling of avowal from discriminative function. Magnitude estimation distribution altered. Traceability to physical standards maintained. Traceability to historical operator state undefined. Measurement validity contingent on acceptance of behavioural output as sole criterion.*

  She hovered over the 'Submit' button.

  To accept this was to say that the number is the thing. To reject it was to say that the feeling is the thing. And there was no standard for that.

  Elena pressed the button. The screen flashed green. *Record Saved.*

  She closed the laptop. The room was quiet. The data was secure. The redness was gone. And the work would continue, precise, accurate, and utterly silent about what it felt like to measure the world.
