answer: |-
  1. You argue the contented slave is unfree even if the master never interferes. Is the loss located in the master's mere capacity to interfere, or in the slave's psychological necessity to ingratiate himself and bend his plans?
  Likely answer: It's structural; the capacity exists regardless of the slave's psychology.
  Follow-up: If it's purely structural, why does the theory rely on the *experience* of deference to explain the harm, rather than just the power differential itself?

  2. You claim law isn't domination if it's contestable and tracks interests. But contestation costs time, money, and social capital. Who ends up bearing that cost, and doesn't this just shift domination to those who can't afford to speak up?
  Likely answer: The state must ensure equal capacity to contest through redistribution.
  Follow-up: So freedom isn't a legal status but an economic outcome; doesn't that make non-domination dependent on the very state power it's supposed to constrain?

  3. Your robustness condition says an option is free only if it holds across nearby possible situations. What fixes which situations count as "nearby," and doesn't that calibration quietly do all the normative work before you even measure the freedom?
  Likely answer: Social norms and institutional expectations define the relevant nearby worlds.
  Follow-up: If norms define the metric, isn't freedom just a reflection of existing power structures rather than a critical tool to measure them?

  4. The eyeball test: is it about how people in fact feel, or about objective structure? If a servile population feels free under a benign state and a cocky one feels free under a predatory state, which verdict do you keep?
  Likely answer: It's about the objective status that permits looking in the eye, not the subjective feeling.
  Follow-up: Then why call it a "test" if the subjects' own report is irrelevant to the verdict; isn't that just elitist stipulation?

  5. Suppose I tried to build an index of domination out of things I could actually count — the probability that someone else can undo your choices at will, the cost of exiting the relationship, and the fraction of your time spent anticipating that person's wishes. What does an index like that systematically miss, and, more pointedly, what observation would count as evidence against your view rather than for a negative-liberty reading of the very same facts?

  6. You argue the state must protect us from private domination, including in the family. To prevent a husband from dominating a wife, the state must monitor the household. Doesn't the surveillance required to guarantee non-domination inside the home constitute a form of domination by the state itself?

  7. You define arbitrary interference as interference that doesn't track the agent's interests. Who decides what those interests are? If the state decides, isn't that itself an act of domination, regardless of how benevolent the decision is?

  8. Non-domination is supposed to be the primary political value. But suppose reducing domination requires a massive expansion of state bureaucracy that reduces overall welfare or privacy. Do you trade off non-domination for other goods, or does it trump everything, even if the cure feels worse than the disease?
