prompt: |-
  Twice a month somebody in our tenants' union asks me some version of the same question: did *we* decide to do this, or did a few members go off and do it, and now the whole unions name is attached to it?

  Context: about 60 members, two part-time staff, decisions made at a weekly general assembly by modified consensus — you can block a proposal, or you can "stand aside," which means you don't stop it but you're not in it either. I'm the one who keeps the minutes and the commitments ledger, so the question always lands on me. Sometimes it's forward-looking: a working group wants to spend money on something and there's a fight about whether they have a mandate. Sometimes it's after the fact — last month a delegation occupied a leasing office, three people got arrested, and the assembly spent two hours arguing about whether the union had authorized it, which matters a lot because we have a legal defense fund to draw on and a public statement to write.

  Right now I answer from vibes and people shout at each other. I want a procedure I can actually run, twenty minutes tops, that ends in something I can put in front of the assembly as a record: fields to fill in, not a paragraph of impressions. The people running it have no philosophy background and won't read anything longer than two pages, and my co-coordinator signs off before it becomes official.

  Build it on whatever the philosophy of joint action and collective intentionality actually knows thats usable. I gather there's a real literature on what it takes for a bunch of individuals to count as having intended something together, and that the people in it don't agree with each other. Where they disagree, don't paper over it — tell me which side your rules follow and what the procedure gives up by following that side. I'd rather have an honest procedure than one that sounds neutral while quietly picking winners.

  What I need in it:

  - the questions to ask, in order, and what counts as a sufficient answer to each;
  - the points where it can just stop and say no, that wasn't the union, and the points where it has to say yes, that was us, even though everyone involved will hate hearing it;
  - where it hands off to the assembly, because the question turned out to be about what we want to be committed to rather than what we're actually committed to;
  - the hard cases it has to survive. Ours: (1) a standing mandate we gave a working group fourteen months ago that nobody ever rescinded; (2) three members standing aside on a consensus decision — is the resulting action the union's, the forty-odd who didn't stand aside's, or nobody's; (3) a member who said nothing at the assembly, showed up to the action, and now insists she was there as an individual; (4) an assembly where nearly everyone backed each premise of a statement but the statement as a whole would have lost a straight vote — this happened, and to this day nobody can agree what we decided.

  Then run it in full on three cases: two you pick from the four above, and one where the verdict comes out against me, because I was the person arguing the occupation delegation was unauthorized and I want to know whether the procedure is capable of telling me I was wrong.

  Finish with what it can't settle at all — where there's no fact to find and we're just choosing what kind of group we want to be.

  One more thing: our ledger is a mess. If a usable version of this needs me to record things differently going forward, say which fields I should be capturing at the time, so the question is answerable in three weeks instead of being reconstructed from memory and a WhatsApp group.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Minutes keeper/commitments ledger manager for a tenants' union (60 members, 2 staff).
      *   **Problem:** Constant ambiguity about collective authorization ("Did *we* do this?"). Current process is "vibes" + shouting.
      *   **Goal:** A 20-minute procedure to determine collective intentionality/authorization. Needs to produce a record (fields, not paragraphs).
      *   **Constraints:** Operators have no philosophy background, max 2 pages reading. Co-coordinator signs off.
      *   **Philosophical Requirement:** Build on literature of joint action/collective intentionality (Gilbert, Bratman, Searle, etc.). Be honest about which theoretical side the procedure takes and what it sacrifices. Don't pretend neutrality.
      *   **Specific Requirements:**
          *   Ordered questions + sufficiency criteria.
          *   Stop points (Hard No vs. Hard Yes).
          *   Handoff points (Policy question vs. Fact question).
          *   Address 4 specific hard cases provided.
          *   Run the procedure on 3 cases (2 from the list, 1 where the user is proven wrong).
          *   Identify what *cannot* be settled (the political/ethical choice).
          *   Ledger reform: What fields to record *now* to make this easier *later*.

  2.  **Philosophical Grounding (The "Engine"):**

      *   *The Core Debate:* What makes an action "ours"?
          *   **Margaret Gilbert (Joint Commitment):** Requires mutual knowledge and agreement to be bound as a body. Very strict. If you didn't explicitly agree, you aren't bound. Good for protection, bad for flexibility.
          *   **Michael Bratman (Shared Intention):** Requires meshing sub-plans and mutual responsiveness. More flexible, allows for organic coordination, but riskier for liability.
          *   **Raimo Tuomela (We-Mode):** Requires accepting the group's goal as *my* goal because it's the group's.
      *   *Choice for this Context:* A tenants' union needs to protect members from liability (arrests, debt) while maintaining agency. A strict **Gilbertian Joint Commitment** model is safer for legal/financial liability, but a **Bratmanian** model is better for movement building.
      *   *Decision:* I will build this on a **Modified Joint Commitment (Gilbert-lite)** model. Why? Because the stakes involve arrests and money. The procedure must prioritize *explicitness* over *vibes* to protect members.
      *   *The Trade-off:* This procedure will likely declare *fewer* actions as "collective" than the members might feel emotionally. It sacrifices "solidarity by osmosis" for "liability by consent." I need to state this clearly.

  3.  **Drafting the Procedure (The "Tool"):**

      *   *Name:* The Authorization Audit Protocol (AAP).
      *   *Time:* 20 mins.
      *   *Format:* Checklist/Flowchart style.
      *   *Questions:* Need to trace the chain of intention.
          1.  Was there a proposal?
          2.  Was there a decision record?
          3.  Was the action within the scope?
          4.  Did participants act as members?
      *   *Stop Points:*
          *   No record + No prior mandate = Hard No (Individual action).
          *   Explicit Consensus + Within Scope = Hard Yes (Union action).
      *   *Handoff:* If the record is ambiguous but the *political* desire is to support them, that's a new vote (Ratification), not a finding of fact.

  4.  **Addressing the Hard Cases (The "Stress Test"):**

      *   *Case 1 (Old Mandate):* 14 months ago.
          *   *Philosophy:* Commitments expire or need reaffirmation if context changes.
          *   *Verdict:* Likely "No" unless specific renewal clause exists.
      *   *Case 2 (Stand Asides):* 3 stood aside, rest agreed.
          *   *Philosophy:* In consensus, standing aside allows the group to proceed *as a group*.
          *   *Verdict:* Yes, Union action. (Gilbert: they accepted the group decision).
      *   *Case 3 (Silent Participant):* Said nothing at meeting, showed up, claims individual.
          *   *Philosophy:* Participation implies ratification *unless* dissent was registered.
          *   *Verdict:* Tricky. If the action was authorized, she is part of the union action. If unauthorized, her presence doesn't make it union action.
      *   *Case 4 (Premises vs. Conclusion):* Agreed on parts, not whole.
          *   *Philosophy:* No collective intention without agreement on the *joint goal*.
          *   *Verdict:* No.

  5.  **Selecting the 3 Run-Throughs:**

      *   *Run 1:* Case 2 (Stand Asides). Tests the definition of consensus.
      *   *Run 2:* Case 4 (Premises vs. Conclusion). Tests the definition of a decision.
      *   *Run 3:* The "User is Wrong" Case. I need to construct a scenario where the user (minutes keeper) thought it was unauthorized, but the procedure says it *was*.
          *   *Scenario:* A working group had a budget mandate. They spent within budget. User thought they needed a *new* vote for the specific vendor. Procedure says: If within scope of original mandate, it *is* authorized. User was wrong.

  6.  **Ledger Reform:**

      *   Current: "Mess."
      *   Needed: Specific fields to capture the *conditions* of joint commitment.
      *   Fields: Proposal ID, Scope Definition, Expiry Date, Decision Status (Consensus/Block/Stand Aside), Dissenting Names.

  7.  **Refining the Philosophy Section:**

      *   Must be honest. "This procedure assumes X."
      *   *Assumption:* Collective intentionality requires *common knowledge* of the commitment.
      *   *Sacrifice:* It ignores "implicit solidarity." It might feel cold.

  8.  **Review against Constraints:**

      *   20 mins? Yes, checklist format.
      *   2 pages? The explanation needs to be tight.
      *   No philosophy jargon for operators? Keep the theory in the intro, the tool in plain English.
      *   User's specific cases addressed? Yes.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Self-Correction on Case 3:* If the action was *unauthorized*, her showing up doesn't make it authorized. If the action *was* authorized, her showing up makes her a participant, but does it make her liable? The question is "Is this the Union's action?" not "Is this member liable?" Focus on the action's status.
      *   *Self-Correction on "User is Wrong":* Make sure the scenario is realistic. A working group with a "spend up to $X on eviction defense" mandate. They spent $Y (<X). User thought they needed to approve the specific lawyer. Procedure says mandate covers it.
      *   *Tone:* Professional, direct, slightly bureaucratic but empathetic to the tension.

  10. **Final Polish:** Check the "What it can't settle" section. This is crucial. The procedure determines *facts of commitment*, not *moral obligations*. The union can still choose to bail out unauthorized members, but that's a *new* commitment, not an acknowledgment of an old one.

  **(Self-Correction during drafting):** I need to make sure I explicitly name the philosophical stance. I'll choose **Margaret Gilbert's Joint Commitment Theory** as the base, modified for practical use. It's the most robust for "who is on the hook?" questions. I will explicitly state that this rejects Bratman's looser "shared intention" for the sake of legal/financial safety.

  Let's assemble the document.
  - **Part 1: The Philosophical Stance (The "Why").**
  - **Part 2: The Procedure (The "How").**
  - **Part 3: Ledger Fields (The "Prevention").**
  - **Part 4: The Run-Throughs.**
  - **Part 5: The Limits.**

  *Wait, one detail:* "Two pages max for operators." I need to separate the "Manual for Operators" from the "Background for the Requester." I will structure the response so the user can print pages 1-2 for the team, while the rest is for the user (the minutes keeper). Actually, the prompt asks *me* to build it. I should provide the whole thing but ensure the *procedure itself* is concise enough. I will create a "Operator Sheet" and a "Background/Philosophy" section.

  *Re-reading prompt:* "The people running it... won't read anything longer than two pages." Okay, I need to make sure the *procedure document* they hold is short. I will provide the philosophy in the response to the user, but the *tool* provided for the team must be distinct and short.

  *Wait, another detail:* "Finish with what it can't settle at all."
  *Wait, another detail:* "Ledger is a mess... say which fields."

  Okay, plan is solid. I will write the response to the user, including the philosophy, the tool (formatted to be printable as a 2-pager), the ledger fields, the test cases, and the limits.

  *Philosophical Nuance:* I need to be careful about the "Stand Aside" case. In consensus, a stand-aside allows the group to proceed. The action becomes the group's action, but the individual stands aside from *responsibility* or *participation*. However, the *Union* still did it. The question is "Did the Union do this?" not "Is every member liable?" So Stand Aside = Union Action.
  *Case 4 (Premises vs Conclusion):* This is the "Discursive Dilemma." If we agree on P and Q, but not R (where P+Q->R), did we decide R? Gilbert says No. We only commit to what we explicitly endorse as a body.

  *User-Wrong Case:* I need to make sure the user's error is plausible. User thought "Specific approval needed." Procedure says "General mandate covers specific."

  Let's write.
answer: |-
  ## Part 1: The Philosophical Stance (For You)

  You asked for honesty about the theory, so here it is. This procedure is built on **Margaret Gilbert's Theory of Joint Commitment**, with a practical modification for expiry.

  **The Core Claim:** A group intends something *only* when its members have mutually expressed willingness to be bound together as a body to that end. It is not enough that everyone happens to want the same thing (convergence); they must know they are committing *together*.

  **The Trade-Off:**
  *   **What this gains:** It protects members from liability for actions they didn't explicitly sign up for. It prevents "mission creep" where a radical fringe drags the whole union's reputation into a fight.
  *   **What this loses:** It ignores "implicit solidarity." Sometimes people show up because they trust the vibe, not the minutes. This procedure will often declare "The Union did not do this" in cases where members *feel* the Union should have. It prioritizes **legal/financial safety** over **movement fluidity**.
  *   **The Rejection:** This explicitly rejects Michael Bratman's "Shared Intention" model (which allows for looser, meshing sub-plans). Bratman is better for describing how friends walk together; Gilbert is better for describing how a union authorizes an occupation that leads to arrests.

  **The "Hard Yes/No" Logic:**
  *   **Hard No:** No record of joint commitment exists. (Protects the union from rogue actors).
  *   **Hard Yes:** Record exists, scope matches. (Binds the union to its word, even if some members now regret it).
  *   **Handoff:** Record is ambiguous. (Kicks the can to the Assembly to decide if they want to *ratify* the action now, which is a new commitment, not a finding of fact).

  ***

  ## Part 2: The Authorization Audit Protocol (For Operators)

  *(Print this section. It is designed to be 2 pages max.)*

  **PURPOSE:** To determine if an action was taken by **The Union** (collective) or **Individuals** (private).
  **TIME LIMIT:** 20 Minutes.
  **OPERATORS:** Minutes Keeper + Co-Coordinator.
  **OUTPUT:** A signed "Authorization Status Form."

  ### STEP 1: THE PAPER TRAIL (5 Mins)
  *Check the Commitments Ledger and Meeting Minutes.*

  **Q1: Is there a recorded decision authorizing this specific action or category of action?**
  *   **YES:** Go to Q2.
  *   **NO:** **STOP. VERDICT: UNAUTHORIZED.** (Handoff to Assembly for Ratification Vote if support is desired).

  **Q2: Does the action fall within the SCOPE defined in that decision?**
  *(Check budget limits, target locations, tactics allowed, and expiry dates).*
  *   **YES:** Go to Q3.
  *   **NO:** **STOP. VERDICT: UNAUTHORIZED.** (Action exceeded mandate).

  ### STEP 2: THE CONSENSUS CHECK (5 Mins)
  *Review the decision record for the authorization found in Q1.*

  **Q3: Was the decision reached by Modified Consensus without a Block?**
  *   **YES:** Go to Q4.
  *   **NO (It was Blocked):** **STOP. VERDICT: UNAUTHORIZED.**
  *   **NO (It was a Vote):** **STOP. VERDICT: UNAUTHORIZED.** (Unless Union bylaws explicitly allow voting for mandates).

  **Q4: Did any members "Stand Aside" on the authorization?**
  *   **NO:** Go to Step 3.
  *   **YES:** **NOTE:** The action is still **UNION AUTHORIZED**. Standing aside permits the group to act; it does not veto the group's will. (Mark dissenters in ledger, but verdict remains YES).

  ### STEP 3: THE EXECUTION CHECK (5 Mins)
  *Review who did the thing and how they presented themselves.*

  **Q5: Did the actors claim to represent the Union during the action?**
  *(e.g., carried union banner, issued press release on union letterhead, demanded union recognition).*
  *   **YES:** **VERDICT: UNION ACTION.**
  *   **NO:** **VERDICT: INDIVIDUAL ACTION.** (Even if authorized, if they acted privately, the Union is not liable).

  **Q6: Did a participant who did NOT attend the authorization meeting join the action?**
  *   **NO:** **VERDICT: UNION ACTION.**
  *   **YES:** **VERDICT: UNION ACTION.** (Membership implies ratification of authorized actions unless dissent was publicly registered *during* the action).

  ### STEP 4: SIGN-OFF (5 Mins)
  *Complete the fields below. If "Unauthorized," draft a Ratification Motion for the next Assembly.*

  | Field | Entry |
  | :--- | :--- |
  | **Action Reviewed** | |
  | **Authorization Date** | |
  | **Scope Match?** | [ ] Yes [ ] No |
  | **Consensus Valid?** | [ ] Yes [ ] No [ ] N/A |
  | **Public Representation?**| [ ] Union [ ] Individual |
  | **FINAL VERDICT** | **[ ] UNION COMMITMENT** <br> **[ ] INDIVIDUAL ACTION** |
  | **Operators** | (Signatures) |

  ***

  ## Part 3: Ledger Reform (Prevention)

  Your current ledger is a memory aid; it needs to become a **contract**. To make the Protocol work in 3 weeks, you must capture these fields *at the moment of decision*. If you don't have these, the Protocol will default to "Unauthorized."

  **New Required Fields for Commitments Ledger:**

  1.  **Mandate ID:** (e.g., `GA-2023-10-05-01`)
  2.  **Scope Definition:** (Be specific: "Eviction Defense" is too vague. "Legal support for tenants at 123 Main St" is specific.)
  3.  **Budget Cap:** (Exact dollar amount. $0 if non-financial.)
  4.  **Tactics Allowed:** (e.g., "Letters only" vs. "Direct Action including trespass.")
  5.  **Expiry Date:** (Crucial. Mandates die. Suggest default: 6 months.)
  6.  **Decision Status:** (Consensus / Stand Aside [List Names] / Blocked [List Names].)
  7.  **Reporting Requirement:** (Does the working group need to report back before spending? Yes/No.)

  ***

  ## Part 4: Procedure Run-Throughs

  Here is the Protocol applied to three scenarios.

  ### Case A: The "Stand Aside" Occupation (Your Hard Case #2)
  *Scenario: 60 members. 55 agree to occupy leasing office, 3 stand aside, 2 absent. Occupation happens. 3 arrested.*

  *   **Step 1 (Paper Trail):** Q1: Yes, minutes show proposal to occupy. Q2: Yes, action matched proposal.
  *   **Step 2 (Consensus):** Q3: Yes, no blocks. Q4: 3 stood aside. Protocol says: **Action is Union Authorized.** Standing aside allows the body to act.
  *   **Step 3 (Execution):** Q5: Yes, they carried union banner.
  *   **Verdict:** **UNION COMMITMENT.**
  *   **Implication:** Legal defense fund *must* cover the arrested members. The 3 who stood aside are not personally liable for the decision, but they cannot claim the Union didn't do it. The Union is responsible for the consequences of its consensus.

  ### Case B: The "Premises but not Conclusion" Statement (Your Hard Case #4)
  *Scenario: Assembly agrees "Rents are too high" (Premise 1) and "Landlord X is the worst" (Premise 2). Proposal: "Issue statement demanding Landlord X freeze rents." Vote on statement fails (too aggressive). Working group issues statement anyway, citing the premises.*

  *   **Step 1 (Paper Trail):** Q1: **NO.** There is no recorded decision authorizing the *statement*. There are recorded decisions agreeing with the *facts*, but Gilbertian commitment requires agreement on the *joint goal* (the statement), not just the background facts.
  *   **Stop:** **VERDICT: UNAUTHORIZED.**
  *   **Implication:** The Union cannot put its name on the statement. The Working Group can issue it as individuals. If the Union wants to adopt it, it requires a **Ratification Vote** at the next Assembly.
  *   **Why:** Agreeing on the world (premises) is not the same as agreeing to act (conclusion). To rule otherwise allows working groups to manipulate the Assembly by breaking decisions into pieces.

  ### Case C: The "User Was Wrong" Scenario (Budget Mandate)
  *Scenario: 14 months ago (within expiry), Assembly gave Eviction Defense WG a mandate: "Spend up to $5k on emergency legal fees." No requirement to return for specific vendor approval. WG spends $2k on a lawyer. You (Minutes Keeper) argue this needs a new vote because the specific lawyer wasn't named. WG says they had a mandate.*

  *   **Step 1 (Paper Trail):** Q1: **YES.** Ledger shows Mandate ID `GA-2022-11-01`. Q2: **YES.** $2k is under $5k cap. Legal fees are within scope. Expiry date (if recorded) has not passed.
  *   **Step 2 (Consensus):** Q3: **YES.** Original mandate was consensus. Q4: No stand asides recorded.
  *   **Step 3 (Execution):** Q5: **YES.** WG acted under the mandate.
  *   **Verdict:** **UNION COMMITMENT.**
  *   **Implication:** **You were wrong.** The expenditure is authorized. The Union must reimburse/pay.
  *   **Why:** Joint commitment binds the group to the *terms* agreed upon. If the terms allowed discretion ("up to $5k"), the group is bound by that discretion. Requiring a second vote would violate the original commitment made to the Working Group.

  ***

  ## Part 5: What This Cannot Settle (The Limits)

  There are three questions this procedure cannot answer. These are not facts to be found; they are political choices the Assembly must make.

  **1. The "Expired Mandate" Moral Hazard (Your Hard Case #1)**
  *   *Scenario:* A mandate is 14 months old. The ledger has no expiry date (because you didn't have these fields then). The WG acts on it.
  *   *The Limit:* The Protocol will likely say **UNION COMMITMENT** (no expiry recorded = still valid).
  *   *The Political Choice:* The Assembly may feel this is *unfair* even if it is *procedurally correct*. The procedure protects the WG's reliance on the old rule, but the Assembly might feel the context has changed so much that honoring it is dangerous.
  *   *Resolution:* The Assembly must vote to **Retroactively Rescind** the commitment. This admits the action was authorized but declares the Union will no longer support it. This is painful but honest.

  **2. The "Silent Participant" Liability (Your Hard Case #3)**
  *   *Scenario:* Member says nothing at meeting, shows up to unauthorized action, gets arrested, claims "I was just an individual."
  *   *The Limit:* The Protocol says **UNION ACTION** (if the action was authorized) or **INDIVIDUAL ACTION** (if unauthorized). It cannot determine *internal* liability.
  *   *The Political Choice:* If the action was unauthorized, but the Union has a "No Member Left Behind" policy, do we pay for their legal defense anyway?
  *   *Resolution:* This is a **Welfare Decision**, not an Authorization Decision. The Protocol determines if the Union *ordered* the action. The Assembly decides if the Union *cares* for the member regardless of orders. Do not conflate these.

  **3. The "Vibe vs. Record" Gap**
  *   *Scenario:* Everyone *knows* we support strikes, but it was never minuted. A strike happens.
  *   *The Limit:* The Protocol says **UNAUTHORIZED**.
  *   *The Political Choice:* Do you value **Safety** (strict adherence to record) or **Solidarity** (supporting the vibe)?
  *   *Resolution:* If you choose Solidarity, you must **Ratify** the action immediately. This creates a new record. If you refuse to ratify because "it wasn't minuted," you are choosing Safety. There is no neutral ground. You must choose which value wins when they conflict.

  ### Final Instruction for the Minutes Keeper
  Your power is not in deciding the answer. Your power is in **forcing the question**. When someone asks "Did we do this?", do not answer. Open the Ledger. Run the Protocol. If the Ledger is empty, the answer is "No," and the conversation shifts to "Do we want to support them now?"

  This shifts the debate from *rewriting history* to *making a new commitment*. That is the only way to stop the shouting.
