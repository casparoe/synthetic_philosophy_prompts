answer: |-
  ### 1. The Question

  **Time Allowed:** 45 Minutes
  **Total Marks:** 25
  **Instructions:** This is a closed-book assessment. Do not cite secondary literature or rely on specific textual quotations. Your grade depends on the quality of your reasoning about the case below.

  **Case:**
  A commercial pollination firm runs a swarm of two hundred small autonomous drones across an almond orchard. Two rival descriptions exist. First, the engineers' specification: each drone carries a lookup table of roughly forty thousand sensor-signature-to-motor-command entries, accumulated by reinforcement during training, plus route statistics. The document states nothing inside carries information about the orchard in compositional form: no map, no self-model, no state about wind, bloom, or other drones. Engineers predict a drone's next command exactly, but only one step ahead; projecting swarm behaviour over an hour or into novel conditions degrades to chance. Second, a visiting behavioural ecologist's description: she assigns the swarm attitudes—that it takes north rows to be depleted, prefers spread to clump, wants to minimise energy per pollen unit—and derives behaviour from these. Across novel trials (wind machine, netted rows, missing drones), her predictions hold at ninety-two per cent, beating the physical simulation. She arrives at attributions by asking what a well-designed forager, situated as that swarm is, ought to take the world to be, then checks behaviour. Internal states are identical; accounts differ only in level.

  **Prompt:**
  Evaluate the ontological status of the ecologist's attributions. Are the swarm's attitudes **real patterns** or merely **convenient summaries**? Justify your verdict by defining what you mean by "real" in this context. You must also specify what **further evidence** would discriminate between these two readings, rather than merely asserting that predictive success settles the matter.

  ***

  ### 2. Model Answer

  The swarm's attitudes should be treated as real patterns, not merely convenient summaries, provided we define "real" functionally rather than structurally. A pattern is real if capturing it allows for predictive compression that brute enumeration cannot match, specifically across counterfactual conditions. The ecologist's model achieves 92% accuracy in novel trials where the physical specification fails; this suggests the intentional stance captures structural regularities in the swarm-environment coupling that the lookup tables obscure.

  The engineers' objection—that nothing inside the drones represents the orchard—does not settle the case against realism. Implementation independence is a feature of higher-level descriptions, not a bug. A thermostat does not need a internal model of "cold" to legitimately be described as regulating temperature; similarly, the swarm need not possess compositional maps to legitimately be described as minimizing energy. If the system behaves *as if* it holds beliefs, and those attributions support robust predictions under perturbation, the beliefs are real in the sense that they pick out causal powers available at that level of abstraction. To deny this because the physical substrate lacks isomorphic states is to confuse the map with the territory; the physical stance is complete, but not exclusively explanatory.

  However, the ecologist's method invites a harder problem: the risk of manufactured accuracy. She generates attributions by asking what a rational agent *ought* to believe, then checks if the swarm complies. This creates a circularity risk where the ascriber projects rationality onto the system, and any deviation is explained away as noise or a different preference. If rival attributions (e.g., "the swarm fears wind" vs. "the swarm minimizes energy") are intertranslatable and yield identical predictions, the attitudes may be instrumental fictions rather than discovered structures. Predictive success alone cannot distinguish between a pattern inherent in the system and a projection inherent in the observer's rationality assumptions.

  To discriminate between real patterns and convenient summaries, we require evidence of structural constraint. We need to identify conditions where the intentional stance fails *specifically* because the system's physical architecture prevents rational optimization, not merely because of noise. For example, if we alter the sensor input such that a rational agent would correctly infer a new route, but the swarm persists in a sub-optimal path due to lookup-table rigidity, the intentional stance breaks. If the breakdown points correlate with specific physical limitations (e.g., table size), the attitudes are summaries. If the swarm adapts to the new constraints in ways consistent with the attitudes but inconsistent with the original lookup tables (suggesting online processing), the attitudes are real. Reality here is secured not by perfect prediction, but by the pattern's ability to track the system's causal boundaries under stress.

  Therefore, the attitudes are real patterns insofar as they track the swarm's adaptive capacity better than the physical specification, but their status remains provisional until we map the boundaries where the "rationality" assumption decouples from the system's actual mechanics.

  ***

  ### 3. Marking Scheme

  **Total: 25 Marks**

  **1. Verdict and Definition of "Real" (5 Marks)**
  *   **First Class (4-5):** Commits to a position (Real or Summary) and provides a clear, functional definition of "real" (e.g., predictive compression, counterfactual support, causal power).
  *   **Second Class (2-3):** Commits to a position but defines "real" vaguely (e.g., "it exists") or conflates reality with physical presence.
  *   **Common Botch:** Refuses to choose or defines reality solely as physical existence.

  **2. Engagement with Physical Stance Limitations (5 Marks)**
  *   **First Class (4-5):** Explains why the engineers' failure to predict long-term/novel behaviour undermines the claim that the physical description is the only valid one.
  *   **Second Class (2-3):** Notes the engineers fail at novel trials but does not explain why this matters for ontology.
  *   **Common Botch:** Assumes physical completeness implies intentional falsehood.

  **3. Handling the "No Representation" Objection (5 Marks)**
  *   **First Class (4-5):** Explicitly argues that internal isomorphism (maps/models) is not required for legitimate attribution (implementation independence).
  *   **Second Class (2-3):** Acknowledges the objection but dismisses it without argument or accepts it as decisive.
  *   **Common Botch:** Confuses the lack of a map with the lack of information processing.

  **4. Handling the "Manufactured Accuracy" Risk (5 Marks)**
  *   **First Class (4-5):** Identifies the circularity in the ecologist's method (asking what an agent *ought* to believe) and notes the risk of intertranslatable rival attributions.
  *   **Second Class (2-3):** Mentions the ecologist's method but fails to identify the risk of projection or circularity.
  *   **Common Botch:** Treats the ecologist's success as proof of truth without questioning the method.

  **5. Proposed Discriminating Evidence (5 Marks)**
  *   **First Class (4-5):** Proposes specific tests (e.g., structural breakdown, sub-optimal persistence) that distinguish pattern from projection.
  *   **Second Class (2-3):** Suggests "more data" or "better predictions" without specifying how this discriminates ontology.
  *   **Common Botch:** Merely asserts that current predictive success is sufficient evidence.

  ***

  ### 4. Expensive Errors

  *   **Reductionist Dismissal:** Asserting that because the physical stance is complete, the intentional stance must be false. This is an error because it confuses ontological completeness with explanatory exclusivity, ignoring the predictive failure of the physical model in novel conditions.
  *   **Dogmatic Instrumentalism:** Declaring the question settled by labeling oneself an instrumentalist without arguing why predictive success doesn't entail pattern reality. This is an error because it bypasses the required reasoning about the specific case constraints.
  *   **Ignoring the Evidence Requirement:** Failing to propose further evidence to discriminate between realism and summary. This is an error because the prompt explicitly demands a method to test the verdict, not just a verdict itself.

  ***

  ### 5. Instructor Note

  This question tests the student's ability to apply the logic of stances to a novel empirical tension, rather than simply recalling Dennett's definitions. It forces them to navigate the gap between predictive success and ontological commitment, revealing whether they understand the stances as tools for inquiry or merely as categorical labels.
