answer: |-
  Forty-one years is a long time to hold a scalpel steady. When I started as Miriam's research fellow in 1998, I assumed that longevity in this field was a matter of accumulating tricks to compensate for declining capacity. I was wrong. It is a matter of knowing when the capacity defines the work, and when the work must define the capacity.

  There is a persistent notion that age withdraws a person from active affairs. We tend to think retirement is a full stop, a departure from the theatre and the clinic into a quiet room. Miriam has never respected that geometry. She stopped operating, yes, but the Wednesday clinic remains. I walk past it sometimes and see the queue of juniors waiting outside. They are not waiting for a signature; they are waiting for a second opinion they have already learned not to argue with. The work continues, not in the volume of cases, but in the precision of judgment. Those thirty years of handwritten notes on her desk are not archives; they are active texts. They record which grafts took and which did not, with a honesty that most published papers lack. She is not withdrawn from the work. The work has simply changed its shape.

  Then there is the matter of the body. We must be clear about this, because half this room knows what happens at a microsurgical console when the physics change. Miriam's tremor was diagnosed when she was sixty-nine. She scrubbed for her last free flap at seventy-one. I was standing in that theatre. We all watched her hands go. It was not a dramatic failure, nor was it a secret. It was a physiological fact. She put the instruments down. She did not pretend they were steady, and she did not ask us to pretend we hadn't seen them shake. To speak of resilience here would be an insult. The body weakens. It is the oldest truth we have. She accepted the limit without accepting a diminution of her worth. She stopped cutting because she respects the tissue more than she respects her own tenure. That is not a tragedy. It is professionalism.

  Nor is it true that pleasure departs when utility ends. Some measure joy by what it achieves. Miriam measures it by what it is. She took up the cello at seventy-one. She announces, with considerable cheer, that she is still terrible at it. She plays for the sound, not for the concert. In her garden, she grafts apple trees. She does not do this to harvest a crop for market. She does it to see if the graft will take, matching cambium to cambium with the same patience she once applied to vessels half a millimetre wide. The pleasure is in the attempt, not the outcome. If age strips away pleasure, it is only because we insist on pleasure being productive. Hers is not.

  Finally, there is the proximity of the end. We are gathered here to mark a cessation. David has been gone six years. She does not speak of joining him, and I will not speak of her living on in us. She has banned the idea that she survives in her students or her patients. She is right. We are our own people. Her work is finished. The notes are written. The trees are in the ground. There is a completeness to this that requires no echo. Cicero, writing to Atticus about old age, suggested that a well-lived life finds its own natural conclusion without fear of what follows. I think Miriam would accept that assessment, provided we didn't make a fuss about it. The life is the thing. It is complete.

  So we raise a glass not to what comes next, but to what was done. To the steady hands that stopped, the music that remains terrible, and the work that is finished. To Miriam.

  ***

  **Structure Map**

  1.  **Withdrawal from Work:** Paragraph 1 ("Forty-one years..." to "...changed its shape.") addresses the claim that age removes one from activity by showing her continued presence in the clinic and notes.
  2.  **Weakness of Body:** Paragraph 2 ("Then there is the matter..." to "...is professionalism.") concedes the tremor and end of surgery honestly, without framing it as resilience.
  3.  **Loss of Pleasure:** Paragraph 3 ("Nor is it true..." to "...not the outcome.") answers the claim that age strips joy by citing the cello and apple grafts done for non-utilitarian reasons.
  4.  **Proximity of Death:** Paragraph 4 ("Finally, there is..." to "...To Miriam.") meets the fear of death/end without legacy claims or afterlife promises, mentioning David once and citing Cicero.
