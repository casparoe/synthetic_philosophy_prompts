prompt: |-
  I am a novelist, four years into a book set in and around the burning of the General Slocum — the chartered parish excursion that caught fire in the East River on 15 June 1904 and killed something over a thousand of the thirteen hundred people aboard, a great many of them women and children belonging to a single German congregation on the Lower East Side. Most of my characters are invented. Three are not; they are people who existed, two of them named nowhere but on a list of the dead and in the minutes of the relief committee. An editor at a literary quarterly has commissioned an essay from me on what the historical novelist owes the dead, and before I commit anything to print I would like the position examined rather than admired, because I fear it was assembled at different times for different reasons and has never been audited as a whole. The commission is not entirely academic. When my second book was optioned, the screenwriter placed a line of invented cruelty in the mouth of a real man who occupies four pages of the novel, and I wrote to the producer in terms I could not now defend on any of the principles I am about to state.

  Here is the package:

  1. I hold that the dead cannot be harmed. There is no one there to be injured by a false portrait, and I do not think it coherent to say that a misrepresentation reaches backward to a person who no longer exists. Whatever obligations obtain here run to the living and to the truth, not to the dead.
  2. Nevertheless I hold that the strictest obligation attaches to the most obscure among them — those who survive as a name and a date and nothing else. I have come to think in terms of two debts: the debt of the record, owed to a well-documented life defended by letters, photographs, and institutions; and the debt of the name, owed to a life with no other champion. In my practice the second is by a wide margin the stricter.
  3. I hold that readers of historical fiction are not entitled to treat any particular in it as fact; the genre issues no warrant. I also research to the point of establishing the weather and the state of the tide for the morning of the fire, which I have always assumed sits perfectly well with the foregoing.
  4. I hold that an afterword specifying my principal inventions discharges whatever residue of obligation remains, and I have included one in every book I have published.
  5. I hold that invented vice is a wrong and invented virtue is not. I may make a real person braver, kinder, or more prescient than the evidence warrants; I may not make them meaner. Flattering a dead stranger strikes me as a gift rather than a trespass.
  6. I hold that selection is the whole of the novelist's art and cannot itself be a wrong: no book contains a life, and nothing was promised about the parts I leave out.
  7. And yet the failure I find least defensible in the work of my contemporaries is rehabilitation by omission — the shaped and sympathetic figure delivered to readers who will never check him against a footnote, achieved entirely by what the author declined to include. In my own manuscript I have dropped a documented act of petty self-dealing by one of my three real people because it slowed a chapter, and I have been more troubled by that omission than by anything I have invented.
  8. I hold that I may imagine the interior life of a real person without limit, on the grounds that interiority is precisely what no archive preserves, and that I may never put in a real person's mouth a sentence the record does not support. For me the licence ends at the quotation mark.
  9. I hold that dramatization is heavier business than prose — that a face does what a sentence cannot, and that performance installs belief by a route a paragraph does not possess. This is why I objected to the screenwriter's line and would not have objected to the same line in a novel of my own.

  Please audit this rather than expound it. Which of these genuinely pull against one another, which only appear to, and for each real tension, what is the cheapest way to resolve it and what does that resolution cost — in the essay, and in the manuscript, since several of these commitments are load-bearing for decisions already taken. Rank the tensions by severity; do not present them to me as equally grave. My own suspicion falls on 3 and 8, but I would not trust my suspicion for a moment, and I should rather you told me the trouble lies where I have not thought to look. Two further questions I would like answered squarely: whether any single revision would dissolve several of the tensions at once, and whether 9 states a principled difference between media or merely dresses up my irritation at having lost control of a book. I have no attachment to any item on the list that I would ask you to spare.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing a book about the *General Slocum* disaster (1904).
      *   **Task:** Audit a set of 9 ethical/aesthetic principles regarding historical fiction. The user wants them *examined rather than admired*, looking for contradictions, tensions, and costs of resolution.
      *   **Constraints:** Rank tensions by severity. Identify the "cheapest" resolution and its cost (in the essay and the manuscript). Answer two specific questions: (1) Can one revision dissolve multiple tensions? (2) Is principle 9 a principled distinction or just irritation over lost control?
      *   **Tone:** Rigorous, critical, unsentimental, professional (matching the user's precise, intellectual style).
      *   **Key Context:** The user is troubled by a specific omission (petty self-dealing) more than inventions. They previously objected to a screenwriter adding cruelty to a real person but feel their objection wasn't defensible by their own principles.

  2.  **Analyze the 9 Principles:**
      1.  *Dead cannot be harmed.* Obligations run to the living/truth.
      2.  *Strictest obligation to the obscure.* Debt of Record (famous) vs. Debt of Name (obscure). Obscure = stricter.
      3.  *Readers aren't entitled to fact.* Genre issues no warrant. But author researches deeply (weather, tide).
      4.  *Afterword discharges obligation.*
      5.  *Invented vice = wrong; Invented virtue = okay.* Can flatter, not malign.
      6.  *Selection is art, not wrong.* No book contains a whole life.
      7.  *Rehabilitation by omission is indefensible.* Troubled by dropping a documented act of self-dealing.
      8.  *Interiority = free; Dialogue = restricted.* Can imagine thoughts, cannot invent spoken words unsupported by record.
      9.  *Dramatization (film/face) > Prose.* Performance installs belief more deeply. Objection to screenwriter's line based on this.

  3.  **Identify Tensions/Contradictions (The Audit):**

      *   *Tension A: Principle 1 vs. Principle 5 & 7.*
          *   1 says the dead can't be harmed, obligations are to truth/living.
          *   5 says invented vice is a "wrong." Wrong to whom? If the dead can't be harmed, who is wronged? The living? The truth?
          *   7 says rehabilitation by omission is "indefensible." But 6 says selection (omission) is the whole of art and cannot be a wrong.
          *   *Severity:* High. This strikes at the core moral logic.

      *   *Tension B: Principle 3 vs. Principle 8.* (User's suspicion)
          *   3 says readers know it's fiction, no warrant of fact.
          *   8 says dialogue *must* be supported by record.
          *   *Conflict:* If readers know it's fiction (3), why is invented dialogue forbidden (8)? If the genre issues no warrant, why limit the imagination of speech but not thought?
          *   *Severity:* Medium-High. It's an inconsistency in the "license to invent."

      *   *Tension C: Principle 2 vs. Principle 5.*
          *   2 says the *obscure* (name only) get the *strictest* obligation.
          *   5 says you can invent virtue for real people.
          *   *Conflict:* If I have a name on a list (obscure), and I invent virtue for them, am I violating the "strictest obligation"? Principle 2 implies a duty to *accuracy* for the obscure because they have no other champion. Principle 5 allows *inaccuracy* (virtue) for real people.
          *   *Severity:* High. This undermines the "Debt of the Name."

      *   *Tension D: Principle 6 vs. Principle 7.*
          *   6: Selection/omission cannot be a wrong.
          *   7: Rehabilitation by omission is the least defensible failure.
          *   *Conflict:* Direct contradiction. One says omission is neutral art; the other says specific omission is ethical failure.
          *   *Severity:* Critical. This is the user's specific anxiety about the manuscript (the self-dealing incident).

      *   *Tension E: Principle 9 vs. The Rest.*
          *   9 distinguishes media. Is this principled or defensive?
          *   *Severity:* Low/Medium (mostly regarding the specific question asked).

  4.  **Drafting the Audit - Step-by-Step:**

      *   **Introduction:** Acknowledge the rigor of the list. State the purpose: to find the structural faults.
      *   **Ranking Tensions:**
          1.  **6 vs. 7 (The Omission Paradox):** This is the most dangerous because it directly impacts the manuscript decision the user is worried about. 6 absolves omission; 7 condemns it.
          2.  **1 vs. 5 (The Harm Paradox):** If the dead feel nothing (1), who is injured by "wrong" vice (5)? This undermines the moral foundation.
          3.  **2 vs. 5 (The Obscurity Paradox):** The obscure deserve strict truth (2), but real people can be flattered (5). The obscure *are* real people.
          4.  **3 vs. 8 (The Warrant Paradox):** User's suspicion. If no fact is warranted (3), why police dialogue (8)?
      *   **Resolutions & Costs:** For each, propose the "cheap" fix and the "expensive" truth.
      *   **Specific Questions:**
          *   *Single Revision:* Yes. Modifying Principle 1 or 5 resolves multiple issues.
          *   *Principle 9:* Is it principled? Likely mostly defensive, but contains a grain of truth about phenomenology of film vs. text.

  5.  **Refining the Arguments (Self-Correction during drafting):**

      *   *On 6 vs 7:* The cheap fix is to call 7 an exception to 6. The cost is admitting that "Art" is not the only master; Ethics is. This weakens 6's claim that selection "cannot itself be a wrong."
      *   *On 1 vs 5:* The cheap fix is to say "wrong" means "aesthetic betrayal" not "moral harm." The cost is admitting the moral language in 5 ("wrong," "trespass") is metaphorical, which weakens the force of the objection to the screenwriter.
      *   *On 2 vs 5:* The cheap fix is to limit 5 to "well-documented" people. The cost is admitting the obscure cannot be flattered, only recorded. This makes writing about the obscure much harder (no interiority of virtue?).
      *   *On 3 vs 8:* The cheap fix is to say dialogue carries more "factual weight" for readers than thought. The cost is admitting this is an arbitrary line, not a logical one.
      *   *On 9:* Be honest. It smells like post-hoc rationalization for the screenwriter incident. But film *is* more visceral. Don't dismiss it entirely, but flag the defensiveness.

      *   *The "Single Revision" Question:* If the user changes Principle 1 to acknowledge that *memory* can be harmed, or that the *living descendants* are the proxy for the dead, it aligns 1, 5, and 7. Actually, better: If the user admits that **Principle 1 is false** (or incomplete), it solves the "Who is wronged?" problem in 5 and 7. If the dead *can* be harmed (in memory/legacy), then 5 (no vice) and 7 (no sanitizing) make sense. But 1 is the foundation.
      *   *Alternative Single Revision:* Revise **Principle 5**. If invented virtue is *also* a trespass (against truth), it aligns with 2 (strict obligation to obscure) and 7 (no rehabilitation). This makes the ethic consistent: Truth above all. But it conflicts with 1 (dead can't be harmed).
      *   *Best Single Revision:* Revoke **Principle 1**. The dead *are* harmed by the distortion of their memory among the living. This validates 5, 7, and 2. It makes the obligation coherent.

      *   *Wait, looking closer at 2:* "Debt of the Name... stricter." Why? Because they have no other champion. If I invent virtue for them (5), am I championing them falsely? Yes. So 2 and 5 clash hard.
      *   *Looking at 6 vs 7:* This is the manuscript killer. The user dropped the self-dealing. 6 says "Good art." 7 says "Bad ethics."
      *   *Looking at 9:* The user asks if it's principled or defensive. It's likely 80% defensive.

  6.  **Finalizing the Structure:**
      *   **Executive Summary:** Acknowledge the coherence but highlight the fracture points.
      *   **Ranked Tensions:**
          1.  **Selection (6) vs. Omission (7):** The Manuscript Crisis.
          2.  **Harm (1) vs. Virtue/Vice (5):** The Moral Logic Crisis.
          3.  **Obscurity (2) vs. Virtue (5):** The Hierarchy Crisis.
          4.  **Warrant (3) vs. Dialogue (8):** The Epistemological Crisis (User's suspicion).
      *   **Resolution Analysis:** Cheap fix vs. True Cost for each.
      *   **The Two Questions:**
          1.  Single Revision (Target Principle 1).
          2.  Principle 9 Audit (Defensiveness vs. Phenomenology).
      *   **Conclusion:** Final recommendation.

  7.  **Tone Check:** Ensure I am not "admiring." Be sharp. Use the user's language ("audit," "load-bearing," "defensible").

      *(Self-Correction on Principle 1)*: Principle 1 says obligations run to the *living* and the *truth*. Principle 5 says invented vice is a *wrong*. If the obligation is to Truth, then invented vice is a lie. That works. But 5 says "Flattering... is a gift." A lie can be a gift? That conflicts with "Obligation to Truth."
      *Refinement:* The tension in 1 vs 5 is about *which* truth. Historical truth vs. Emotional truth? No, 1 says "Truth." 5 allows Falsehood (virtue). So 1 and 5 contradict on the definition of Truth.

      *(Self-Correction on 6 vs 7)*: 6 says selection *cannot* be a wrong. 7 says a *specific type* of selection *is* indefensible. This is a categorical error. 6 is universal; 7 is specific. 7 disproves 6.

      *(Self-Correction on 9)*: The user objected to the screenwriter. 9 justifies that. But if 1 says "Dead can't be harmed," why did the user object? Because of *Truth*? But 3 says "Readers aren't entitled to fact." So why object to the screenwriter? Because of *Media* (9)? This suggests 9 is the only thing holding the screenwriter objection together. That makes 9 very weak.

