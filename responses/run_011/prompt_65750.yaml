answer: |-
  Here is the specification for a thermodynamic account of information-bearing processes, structured to audit real experiments without begging the question for the Landauer/Erasure camp.

  ### The Desiderata

  **Non-Negotiables (The Physics)**
  1.  **Micro-Dynamical Consistency:** The account must be derivable from time-reversal invariant microdynamics (Hamiltonian or consistent stochastic Langevin/Markov dynamics). It cannot posit a fundamental thermodynamic arrow as an axiom.
      *   *Rationale:* If the resolution relies on an intrinsic arrow, it explains the Second Law by assuming the Second Law. This handles the **meta-level time-reversal** constraint.
  2.  **Ensemble Second Law Recovery:** The account must recover $\langle \Delta S_{tot} \rangle \geq 0$ over an ensemble of cycles, while permitting transient negative entropy production on single trajectories consistent with Fluctuation Theorems (e.g., Jarzynski, Crooks).
      *   *Rationale:* Your data is single-run, but the law is statistical. A theory demanding "never a violation in any individual run" is empirically false. This resolves the **single trajectory vs. ensemble** tension by rejecting the former as a requirement.
  3.  **Finite Cycle Closure:** The accounting must close for a finite, cyclic protocol. The system, controller, and reservoirs must return to their initial marginal states (or the debt must be explicitly carried in correlations).
      *   *Rationale:* This kills the **Infinite Tape** and **Swarm** loopholes. If the demon writes forever, it's not a cycle; it's a transient. If it hands off to a swarm, the swarm's entropy rises. A cyclic engine must pay within the cycle boundaries.
  4.  **Explicit Flow Localization:** The account must specify *where* the entropy compensation appears (bath heat, system entropy, controller memory, or system-controller correlations) without presupposing it *must* be in the controller memory.
      *   *Rationale:* This prevents smuggling in the Landauer conclusion as a premise. It forces the theory to handle the **Mutual Info Reset** case: if the cost is parked in correlations, the theory must explain why those correlations cannot be exploited indefinitely without payment.
  5.  **Information-Physical Mapping:** The account must define the mapping between the physical distinguishability of states and the information metric (Shannon/von Neumann) used in the balance sheet.
      *   *Rationale:* Required to handle **Quantum Variants** and the **Definition of a Bit**. If "bit" is abstract, the thermodynamics doesn't hook to the hardware.

  **Camp Preferences (The Interpretation)**
  1.  **Location of Dissipation:** Whether the cost *must* manifest as heat in the bath during erasure (Landauer) or can remain as entropy of correlation until later (Generalized Second Law).
  2.  **Measurement Cost:** Whether measurement *inherently* costs energy (Brillouin) or is only costly insofar as it establishes correlations that must later be severed (Sagawa-Ueda/Bennett).
  3.  **Recurrence Handling:** Whether Poincaré recurrence is treated as a theoretical loophole or ignored on experimental timescales. (Recommendation: Ignore on experimental timescales, but acknowledge it theoretically).

  ### Incompatibilities and Trade-offs

  You are correct to suspect tensions. Here are the pairs that cannot be jointly satisfied:

  1.  **Strict Single-Trajectory Second Law vs. Fluctuation Theorems:** You cannot demand $\Delta S_{tot} \geq 0$ for every single realization and also claim consistency with Crooks/Jarzynski relations, which explicitly predict $P(\Delta S_{tot} < 0) > 0$. You must choose the ensemble view.
  2.  **Memory-Localized Cost vs. Correlation-Localized Cost:** You cannot assert that the cost *always* appears as heat in the bath during erasure (Landauer) AND that the cost can be parked in mutual information without immediate dissipation (Generalized SL). One view treats correlations as debt; the other treats erasure as the only taxable event.
  3.  **Fundamental Arrow vs. Micro-Reversibility:** You cannot posit a fundamental thermodynamic time-asymmetry and claim derivation from reversible microdynamics.

  ### The Knockout Requirement

  The single requirement that eliminates the most candidate resolutions is **Finite Cycle Closure under Micro-Dynamical Consistency.**

  *   **Why:** It kills the **Infinite Tape** (no closure), the **Randomizing Demon** (unless the randomization cost is accounted for in the setup), and the **Brillouin Measurement Cost** (which often assumes measurement *must* dissipate, violating reversibility). It forces the theory to explain how a finite physical device, governed by reversible laws, can run a cyclic engine without violating the ensemble Second Law. It demands the "bill" be found within the finite boundaries of the experiment, not pushed to infinity or hidden in axioms.

  ### Contender Evaluation

  **The Erasure-Cost Story (Landauer/Bennett)**
  *   **Performance:** Strong on **Finite Cycle Closure** and **Memory-Localization**. It cleanly handles the **Infinite Tape** by asserting the tape must eventually be reset.
  *   **Weakness:** Struggles with **Measurement without Feedback** and **Randomizing Demon** unless one rigorously accounts for the *preparation* cost of the memory. It often implicitly assumes the memory starts in a low-entropy state without pricing that initialization. It risks conflating "logical irreversibility" with "thermodynamic irreversibility" if not carefully stated.

  **The Mutual-Information / Generalized Second Law Story (Sagawa-Ueda/Parrondo)**
  *   **Performance:** Excellent on **Feedback without Measurement** and **Measurement without Feedback**. It treats correlations as a thermodynamic resource, handling the **Mutual Info Reset** case naturally (correlations are the debt). It fits **Fluctuation Theorems** perfectly.
  *   **Weakness:** Can feel like bookkeeping magic. If the cost is parked in correlations, the "payment" is deferred. It must rigorously show that extracting work from correlations reduces the total free energy available elsewhere to satisfy **Finite Cycle Closure**.

  **The Brillouin-Style "Measurement is Costly" Story**
  *   **Performance:** Intuitive for experimentalists (signal-to-noise requires energy).
  *   **Weakness:** Fails **Micro-Dynamical Consistency**. Measurement *can* be done reversibly (e.g., unitary coupling). This story often conflates practical experimental noise with fundamental thermodynamic limits. It generally fails the **Knockout Requirement** because it posits a cost where none is dynamically required.

  **The "Second Law is Only Statistical" Story (Earman/Norton)**
  *   **Performance:** Perfect on **Micro-Dynamical Consistency** and **Fluctuation Theorems**. Acknowledges **Recurrence** and **Single Trajectory** violations correctly.
  *   **Weakness:** Experimentally sterile. It tells you violations are possible but doesn't provide a bound on *how much* work you can extract in your specific feedback protocol. It resolves the paradox by dissolving the law, which doesn't help you write a thesis on optimizing an engine.
