  **TRUNK:** In any real choice I make, the alternatives I weigh are a small and decidedly non-random sample of the alternatives open to me, the sample having been drawn by whatever happened to occur to me, and I know this.

  **DECISION TREE**

  **1. AGENT TYPE**
     ├─ **Specified System** → Go to 2
     ├─ **Organization** → Go to 3
     └─ **Person** → Go to 4

  **2. THRESHOLD AGENT (System)**
     ├─ Agent below threshold still wants help reaching it → **L9**
     └─ Agent below threshold is indifferent → **L9** *(Note: Dialectic leaf)*

  **3. POLICY ESTIMATES (Organization)**
     │ *Case: Choose among estimated futures; winner rated highest.*
     ├─ Rating is evidence about the **Future** → **L7**
     └─ Rating is evidence about the **Model** → **L8**

  **4. ORDERING (Person)**
     ├─ Alternatives admit **no single ordering** → **L10**
     └─ Alternatives admit **single ordering** → Go to 5

  **5. KNOWN BETTER OPTION (Person)**
     │ *Case: Know B > A, costless switch, take A.*
     ├─ Permissible → **L5**
     ├─ Objectionable (to take B) → **L6**
     └─ Impossible (Must take B) → Go to 6

  **6. ASPIRATION LEVEL (Person)**
     │ *Case: Level lowered after year of failure.*
     ├─ Procedure (Part of rule) → **L1**
     ├─ Disposition (Makes me miserable) → **L4**
     └─ Broken (Bias/Evidence of failure) → Go to 7

  **7. JOB SEARCH (Person)**
     │ *Case: Call off search after 2nd acceptable offer.*
     ├─ Saving (Cost of look > gain) → **L2**
     ├─ Mistake (Should have looked) → **L2** *(Converges on cost)*
     └─ Strategy (Rule-based) → Go to 8

  **8. PREDICTION CONTEST (Person)**
     │ *Case: Model ignoring 2/3 variables wins out of sample.*
     ├─ Ignored info marks **Bias** in richer model → **L2**
     └─ Ignored info marks **Symptom** of environment → **L3**

  ***

  **LEAF KEY**

  *   **L1 (Simon):** Bounded rationality on its own terms. *Least like to be reminded that "bounded" sounds like "broken."*
  *   **L2 (OptCost):** Satisficing is optimizing with search priced. *Least like to be reminded that pricing the search requires a prior search.*
  *   **L3 (EcoRat):** Ecological rationality; bound is environmental. *Least like to be reminded that environments change faster than heuristics.*
  *   **L4 (TraitPsy):** Maximizing is a disposition making people miserable. *Least like to be reminded that misery is not a metric of choice quality.*
  *   **L5 (Slote):** Permissible not to produce the most good. *Least like to be reminded that "permissible" invites "why not better?"*
  *   **L6 (AntiMax):** Taking the best is itself objectionable. *Least like to be reminded that this requires a theory of the "objectionable."*
  *   **L7 (Popper):** Ambition to optimize makes social projects dangerous. *Least like to be reminded that incrementalism can also starve the needy.*
  *   **L8 (Robust):** Seek strategies acceptable across plausible futures. *Least like to be reminded that "acceptable" is often a disguised optimum.*
  *   **L9 (AISafe):** Threshold agent safety vs. instrumental convergence. *Least like to be reminded that thresholds invite gaming.*
  *   **L10 (Dissolve):** Betterness fails transitivity; no maximum missed. *Least like to be reminded that action still requires a choice.*

  ***

  **DIAGNOSTICS**

  **Inseparable Leaves:** **L5 (Slote)** and **L6 (AntiMax)**. No sequence of behavioral answers can separate them; one claims permission, the other prohibition, but both recommend the same act. This is a fact about the positions (deontic status vs. extension), not a defect in the instrument.

  **Identical Answers, Disagree:** Occupants of **L1 (Simon)** and **L3 (EcoRat)**. Both answer "Strategy" at Node 7 and "Symptom" at Node 8. They disagree on locus: L1 says the bound is in the head (capacity), L3 says the bound is in the world (structure). The tree collapses internal architecture vs. environmental fit.

  **Different Answers, Act Alike:** Occupants of **L5 (Slote)** and **L6 (AntiMax)**. At Node 5, one selects "Permissible," the other "Objectionable." Both take the worse option. The divergence is purely moral flavor, not practical output.

  **Empirical Nodes:**
  *   **Node 8 (Prediction):** Empirical. Settled by running the contest: does the simpler model actually generalize better?
  *   **Node 7 (Job Search):** Empirical. Settled by longitudinal tracking: do "stoppers" have lower lifetime earnings than "searchers" after controlling for cost?
  *   **Node 6 (Aspiration):** Mixed. Whether lowering is "broken" is empirical (does performance recover?); whether it is "procedure" is conceptual.

  **Empty Combinations:**
  1.  **Fixed Aspiration (Unexplored):** A view where the aspiration level is binding *because* it was fixed in advance, not chosen. The tree assumes adaptation (Node 6). This cell is empty because nobody has looked; it resembles a vow or religious rule, rarely analyzed in decision theory.
  2.  **Happy Maximizer (Unattractive):** A Person who answers "Disposition" at Node 6 but reports no misery. L4 assumes maximizing entails misery. This cell is empty because the position is unattractive to trait-psychologists (no pathology) and rationalists (no bias).
  3.  **Optimizing System (Incoherent):** A Specified System that bypasses Node 2 to maximize directly. The tree assumes safety requires thresholds. This cell is empty because, in the local safety culture, it is treated as incoherent (alignment failure).
