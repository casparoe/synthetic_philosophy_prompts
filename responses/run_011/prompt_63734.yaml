      *   **Claim:** Entropy doesn't explain the arrow; it restates it. The arrow is counterfactual/agent-based (influenced by Albert/Loewer style Mentaculus ideas, but phrased distinctively). Past Hypothesis is a summary of commitment, not a law. Boltzmann brains are avoided by grounding reliability in agency.
      *   **Context:** School research showcase, 20-min talk + Q&A, hall setting.
      *   **Audience:** Mixed (Physics Teacher, Head of Maths, Y13 Further Maths Students, Visiting Postdoc, RE/Philosophy Teacher, Parents/Headteacher).
      *   **Task:** Create a prep sheet with specific objections, sources, spoken replies, concessions, grouping, pre-emption, "don't know" spots, and fallback position.
