  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Postdoc):* "What's the testable difference?" This is the hardest hit. If there's no empirical difference, it's just philosophy.
      *   *Objection 2 (Physics Teacher):* "Where does the asymmetry come from if laws are symmetric?" This attacks the core mechanism.
      *   *Objection 3 (Philosophy Teacher):* "Circularity of Agency." Defining time by what we do, but doing requires time.
      *   *Objection 4 (Y13 Student):* "Two-headed arrow/Janus Point." Specific pop-cosmology counter-example.
