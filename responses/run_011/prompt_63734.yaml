      *   *Head of Maths:* Wants precision. Will ask about probability measures. "How do you quantify 'wiggle' without a measure?"
      *   *Y13 Students:* Competitive, pop-sci knowledge. Will bring up the "Janus Point" or two-headed arrow (Barbour/Carroll). "What if the universe expands both ways?"
      *   *Visiting Postdoc:* Condensed matter, pragmatic, hostile to foundations. Wants empirical difference. "What experiment distinguishes your view from Boltzmann's?"
      *   *RE/Philosophy Teacher:* Wants definitions, hates circularity. "Isn't defining time by agency circular if agency requires time?"
