      *   British English? Yes.

  9.  **Final Polish:**
      *   Ensure the distinction between the "standard story" (Past Hypothesis) and the user's "counterfactual story" is clear in the replies.
      *   Make sure the Postdoc's hostility is managed (don't fight, reframe).
      *   Ensure the Y13 student feels heard but corrected gently.

  *(Self-Correction during drafting)*: I initially thought about suggesting a complex mathematical defence for the Head of Maths. *Correction:* No, this is a 20-minute talk. Keep the reply conceptual but precise. Acknowledge the need for a measure but frame it as a macroscopic constraint.
  *(Self-Correction on Postdoc)*: The Postdoc is the biggest threat. If I claim empirical difference, he'll shred me. I must concede no empirical difference but argue for *explanatory* virtue.

