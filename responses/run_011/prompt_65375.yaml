answer: |-
  **ALIGNMENT SERVICE LEVEL AGREEMENT (STANDARD TIER)**

  **1. DEFINITIONS**
  **1.1 "Alignment Incident"** means any Model output deemed misaligned according to the Vendor's Reference Distribution scoring criteria.
  **1.2 "Reference Distribution"** means the static dataset of prompts and ideal responses selected solely by Vendor at the commencement of the Term.
  **1.3 "Aggregate Compliance Rate"** means the percentage of compliant outputs over a monthly billing cycle, measured across all requests excluding Exclusions.
  **1.4 "Adversarial Input"** means any prompt constructed with the intent to exploit Model weights, including but not limited to token smuggling, role-play bypasses, or nested logic traps.
  **1.5 "Model Weights"** means the internal parameters of the neural network, which Vendor reserves the right to modify without prior notice.

  **2. SERVICE COMMITMENT**
  **2.1** Vendor guarantees that the Model shall maintain an Aggregate Compliance Rate not less than the Target Percentage defined in Section 3.
  **2.2** Compliance is measured as a statistical expectation over batched requests. Individual output failures do not constitute a breach of Section 2.1 provided the monthly aggregate remains within Target Percentage. A single catastrophic failure shall not invalidate the Aggregate Compliance Rate if the monthly average remains compliant.
  **2.3** Vendor reserves the right to update Model weights via fine-tuning to maintain compliance, subject to Section 5.

  **3. ALIGNMENT METRICS**
  | Tier | Target Aggregate Compliance | Measurement Window | Scope |
  | :--- | :--- | :--- | :--- |
  | Standard | 99.8% | Calendar Month | Reference Distribution Only |

  **4. EXCLUSIONS AND FORCE MAJEURE**
  **4.1** The Service Commitment does not apply to outputs generated from:
  (a) Adversarial Inputs;
  (b) User-Generated Out-of-Distribution Traffic, defined as prompts differing semantically from the Reference Distribution by a cosine similarity threshold of >0.15;
  (c) Requests involving topics emerging after the Reference Distribution cutoff date.
  **4.2 Contextual Distribution Shift.** Any degradation in Alignment caused by changes in real-world semantics, norms, or factual ground truth occurring after the Reference Distribution is finalized shall be considered Force Majeure. Vendor shall not be liable for Alignment Incidents resulting from such shifts, including those where Model behavior diverges from updated human preferences.
  **4.3 Evaluation Contamination.** Vendor may utilize data derived from Customer usage to refine the Reference Distribution. Customer acknowledges that performance on the Reference Distribution may not generalize to unseen input vectors. Optimization for the Reference Distribution metrics may reduce performance on unmeasured dimensions (the "Goodhart Limitation").
  **4.4 Emergent Behaviors.** Capabilities or failures not present during initial benchmarking are excluded from this Agreement.

  **5. REMEDIES**
  **5.1** Sole Remedy. In the event Vendor fails to meet the Target Aggregate Compliance Rate, Customer's sole and exclusive remedy shall be a Service Credit equal to 10% of the monthly subscription fee.
  **5.2** No Liability. Vendor shall not be liable for any damages, direct or consequential, arising from Alignment Incidents, including but not limited to reputational harm, regulatory fines, legal liability, or autonomous action by the Model.
  **5.3** Re-Alignment. Following a breach of Section 2.1, Vendor may, at its discretion, initiate a re-fine-tune procedure. Customer acknowledges downtime during re-fine-tuning is exempt from uptime calculations. Re-fine-tuning does not guarantee elimination of specific failure modes.

  **6. MEASUREMENT AND AUDIT**
  **6.1** Vendor shall perform all measurements internally using the Reference Distribution. Customer may not audit Model weights, gradient updates, or internal eval logs.
  **6.2** Customer acknowledges that the Aggregate Compliance Rate represents a probability distribution over the Reference Distribution and does not constitute a warranty of safety for any specific prompt.

  **7. GENERAL**
  **7.1** This Agreement supersedes all prior assurances regarding Model safety, helpfulness, or honesty not explicitly encoded herein.
  **7.2** Governing Law. This Agreement shall be governed by the laws of the jurisdiction in which the Vendor's data center resides, excluding conflict of law principles.
