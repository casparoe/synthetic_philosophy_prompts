answer: |-
  **Brainstorming**

  *Case for Identification:* The modern consensus in development economics holds that the "deep determinants" debate is primarily an identification problem. If institutionalists can isolate exogenous variation in property rights (e.g., via settler mortality instruments) and show a large causal effect on income, they win. The variance decomposition follows: if institutions explain the bulk of income variation across units, geography and culture are relegated to secondary status. Perfect identification seemingly converts correlation into explanation.

  *Case for Skepticism:* Causal effects describe manipulability, not genesis. Knowing that changing $X$ changes $Y$ does not explain why $X$ is distributed as it is. Furthermore, "institutions" may be endogenous outcomes of deeper historical or geographical processes. Finally, the categories themselves (culture vs. institutions) may be analytically inseparable, making the debate ontological rather than empirical. Better inference clarifies the lever, but not the history of the machine.

  **Argument**

  Let us grant the institutionalist their strongest possible hand. Suppose an infallible procedure yields the unbiased causal effect of a specific bundle of inclusive political and economic institutions on per-capita income, with perfect internal validity across all relevant contexts. We know exactly how much income rises if institutions improve. I argue that even this epistemic triumph would fail to answer the question of why some nations are rich and others poor. The standing dispute between institutionalists, geographers, and culturalists is not merely an empirical quarrel about causal coefficients that better inference could settle; it is a deeper disagreement about the nature of social explanation.

  First, consider the gap between estimating a causal parameter and accounting for the magnitude of an observed level difference. Causal inference typically identifies a local average treatment effect (LATE) or a structural parameter $\beta$. It tells us the slope of the function relating institutions to income. However, explaining comparative prosperity requires accounting for the levels: why is Country A at $Y_A$ and Country B at $Y_B$? Even with a perfect $\beta$, the level difference depends on the distribution of the independent variable and the intercept. If bad institutions persist in poor nations, the causal effect of *improving* them does not explain why they remain *bad*. The identification strategy isolates the consequence of institutions, but remains silent on the cause of the institutional distribution itself. To explain poverty, we must explain the persistence of extractive equilibria, not merely the cost of maintaining them. A perfect estimate of the penalty of bad institutions is not an explanation of why those institutions were selected historically.

  Second, we must confront the endogeneity of institutions as mediators. In the causal chain of development, institutions are often proximate causes rather than ultimate ones. Suppose geography (e.g., disease environment, agronomic potential) causally influences the formation of institutions, which in turn determine income. An identification strategy that isolates the institutional effect on income successfully measures the proximate mechanism. However, it leaves wide open the question of why the institutional distribution across the world looks as it does. If the variation in institutions is itself driven by geographical constraints, then geography remains the "deep" determinant, even if institutions are the exclusive channel through which geography operates. The institutionalist claims victory by showing institutions matter; the geographer claims victory by showing institutions are where they are because of geography. Perfect identification of the institutional coefficient cannot distinguish between these claims because it treats institutions as the exogenous treatment, effectively bracketing the historical process that assigned the treatment. The dispute is about the root of the causal tree, not the strength of the branches.

  Third, there is the possibility that institutions, geography, and culture are not rival candidate causes but different descriptions of a single causal process. This suggests part of the debate is merely verbal. "Culture" (shared beliefs) and "institutions" (rules of the game) are mutually constitutive. An extractive institution may simply be the codification of an extractive culture; conversely, culture may be an adaptation to institutional incentives. If these concepts are entangled in a reflexive loop, searching for the "true" deep determinant is a category error. We are not selecting between competing variables in a regression, but choosing between different vocabularies to describe a complex historical system. Better causal inference cannot resolve this because it requires operationalizing these concepts as distinct, separable inputs. If the reality is a unified socio-ecological system, the demand to partition variance between "culture" and "institutions" imposes an artificial analytic distinction on a holistic phenomenon. The debate persists not because data is noisy, but because the categories are porous.

  **Conclusion: Answerability and Vulnerability**

  For the deep-determinants question to be answerable in principle, we would need more than cross-sectional causal effects. We would require a generative historical model—a dynamic account showing how initial conditions (geography, chance events) evolve through path-dependent processes to produce the current joint distribution of culture, institutions, and income. Evidence that would settle the debate would not be a larger coefficient, but a successful simulation of history that demonstrates necessity: showing that given initial condition $G$, institutional outcome $I$ was highly probable, and given $I$, income $Y$ was inevitable. Without this historical generativity, we possess only a static map of leverage points, not a theory of origins.

  However, I must state where this argument is most vulnerable. The strongest objection an institutionalist could raise is pragmatic: explanation is for the sake of intervention. If we cannot change geography or deep culture, but we can change institutions, then the "deep determinant" debate is metaphysical indulgence. For the policy-maker, the proximate cause *is* the real cause because it is the only actionable one. If my philosophical critique implies that we cannot know why nations are poor until we solve the history of everything, it risks paralysis. The institutionalist might concede that geography caused the institutions, but argue that knowing the institutional effect is sufficient for development practice. My argument risks conflating *scientific explanation* with *policy relevance*. If the goal of development economics is alleviation rather than ontological precision, then the perfect identification of institutional effects might indeed be all we need, rendering the deep determinants debate obsolete not because it is solved, but because it is irrelevant.
