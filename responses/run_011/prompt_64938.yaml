answer: |-
  ### Translation of the Statutory Interpretation Debate into Programming Language Standards Vocabulary

  Below is the restatement of the seven interpretive moves, translated from legal statutory interpretation to programming language specification theory. Each entry includes a fidelity judgement and flags where the analogy relies on features of the standards world that do not exist in the legal world ("Imports").

  **1. Ordinary Meaning Fixed at Enactment vs. Drifting Technical Usage**
  *   **Legal:** The text means what a competent reader understood at the time of passage. Technical terms that drift (e.g., "vehicle") create tension between original public meaning and current technical reality.
  *   **PL Translation:** **Normative Text vs. Evolving Ecosystem.** The specification text (e.g., C11 §6.5) is fixed at the time of standard publication. However, the "reasonable programmer's" understanding of terms (e.g., "integer," "memory") drifts as hardware architectures evolve (16-bit to 64-bit, sequential consistency to relaxed memory).
  *   **Fidelity:** Maps cleanly.
  *   **Import:** **[Versioning]**. PL standards reset the clock explicitly with new versions (C99, C11, C17), allowing "enactment" to be discrete. Law relies on continuous amendment or judicial update, making the "time of enactment" fuzzier.

  **2. Semantic Canons (*Ejusdem Generis*, *Noscitur a Sociis*, *Expressio Unius*)**
  *   **Legal:** General terms are narrowed by specific neighbors; mentioning one thing excludes others. These are heuristics for resolving ambiguity.
  *   **PL Translation:** **Contextual Constraints and Grammar Production Rules.** A general type constraint is narrowed by the specific operations permitted in its scope (e.g., a `const` qualifier restricts mutation). If a grammar production lists specific tokens, unlisted tokens are excluded (syntax errors).
  *   **Fidelity:** Maps only after one of the two sides is bent.
  *   **Reasoning:** Legal canons are *interpretive presumptions* (rebuttable). PL constraints are often *formal rules* (binary validity). Bending the legal side: treating canons as strict type-checking rules. Bending the PL side: treating linting warnings as soft constraints.

  **3. The Enacted Text Construed as a Whole**
  *   **Legal:** No clause is isolated; the statute must be read harmoniously to avoid internal contradiction.
  *   **PL Translation:** **Specification Internal Consistency.** A clause defining pointer arithmetic cannot contradict the clause defining array subscripting. The standard is a single coherent system; a reading that creates a contradiction between sections is rejected as non-conformant.
  *   **Fidelity:** Maps cleanly.
  *   **Import:** **[Single Correct Reading]**. PL standards assume a sufficiently careful reader (or compiler writer) can resolve contradictions to find the one coherent model. Law often accepts that contradictions remain unresolved until a specific case forces a choice.

  **4. Treatment of Drafting History**
  *   **Legal:** Purposivists use committee reports and floor statements; Textualists reject them as unenacted law.
  *   **PL Translation:** **Rationale Documents and Defect Reports (DRs) vs. Normative Text.** Purposivists correspond to engineers consulting the Committee's Rationale or accepted DRs to resolve unspecified behavior. Textualists correspond to compiler vendors who implement *only* the normative text, ignoring meeting minutes or rejected proposals.
  *   **Fidelity:** Maps cleanly.
  *   **Import:** **[Accessible Record]**. PL standards bodies (ISO/IEC, ECMA) often publish detailed meeting minutes and public issue trackers. Legislative history is often fragmented, privileged, or less technically granular.

  **5. The Absurdity Doctrine and the Textualist Objection**
  *   **Legal:** Purposivists avoid readings that yield absurd results. Textualists argue "absurdity" is a cover for judicial policy-making.
  *   **PL Translation:** **Undefined Behavior (UB) vs. "As-If" Rule.** Purposivists correspond to programmers expecting the compiler to preserve "obvious" invariants (e.g., don't delete a loop because it overflows). Textualists correspond to compiler writers exploiting UB for optimization (e.g., assuming signed overflow never happens, thus removing the check).
  *   **Fidelity:** Maps only after one of the two sides is bent.
  *   **Reasoning:** In PL, the "absurd" result (deleting the loop) is often *permitted* by the spec (UB). In Law, the "absurd" result is *forbidden* by the doctrine. The map requires bending the PL side to acknowledge that "permitted by spec" does not always equal "acceptable to users."

  **6. Open Texture and the Penumbra (Hart's Vehicles)**
  *   **Legal:** Hard cases at the margin (is a bicycle a vehicle?). The rule runs out; the judge must decide.
  *   **PL Translation:** **Unspecified and Implementation-Defined Behavior.** The spec declines to characterize the outcome (e.g., order of evaluation of function arguments). The "judge" is the compiler vendor or the hardware architecture.
  *   **Fidelity:** Maps cleanly.
  *   **Import:** **[Ex Ante Settlement]**. PL disputes about the penumbra are often settled *ex ante* by the compiler's documentation. Legal disputes are settled *ex post* by a court after harm occurs.

  **7. Collective Intention vs. Text**
  *   **Legal:** Textualists deny a multi-member legislature has a unified mind. Only the text is law.
  *   **PL Translation:** **Committee Consensus vs. Published Specification.** Textualists correspond to the view that only the published ISO document is the standard. Purposivists correspond to the view that the Committee's consensus intent (captured in emails/minutes) guides the interpretation of ambiguous clauses.
  *   **Fidelity:** Maps only after one of the two sides is bent.
  *   **Reasoning:** PL Committees are small, technical, and record votes. Legislatures are large, political, and record rhetoric. The "collective intention" is more discoverable in PL, bending the Textualist objection that such intent is a fiction.

  ***

  ### Residue Report

  The translation holds surprisingly well across the seven moves, but the residue—the material that distorted or failed to map—reveals the structural limits of the analogy.

  **The Distortions:**
  1.  **Enforcement and Standing:** In PL, the "judge" is the compiler. If the compiler accepts the code, it is valid *for that implementation*. There is no central authority with the power to punish non-conformance other than market failure. In Law, the state enforces the interpretation. This means legal "meaning" carries coercive weight that PL "semantics" do not.
  2.  **The Test Suite:** PL has conformance test suites (e.g., GCC Torture Test). These operationalize the text into pass/fail criteria. Law has no equivalent. There is no "unit test" for a statute that runs before a case is litigated. This makes the legal "penumbra" much larger and more dangerous than the PL "unspecified behavior."
  3.  **The Reference Implementation:** In PL, a reference implementation (e.g., the standard ML definition) often acts as a de facto authority. In Law, there is no reference court. Every court is a peer, leading to circuit splits (forks in the semantics).

  **The Verdict Reasoning:**
  The residue supports the conclusion that the legal debate is less substantive than its participants believe. The "fight" between Textualists and Purposivists is largely a quarrel about **evidential weight** dressed up as a quarrel about **ontology**.

  In your domain, the distinction is explicit: Normative text is binding; Rationale is informative. The fight is purely about whether a compiler vendor is *allowed* to look at the Rationale when the Normative text is ambiguous. In Law, the fight is framed as "What is the Law?" (Ontology). But the PL analogy reveals that "The Law" functions exactly like "The Spec." The disagreement is not about what the law *is*, but about which documents constitute the admissible evidence for determining it.

  Textualists argue that only the enacted text is admissible evidence. Purposivists argue that the drafting history and purpose are admissible evidence. Because Law lacks a **Conformance Suite** (Import: Ex Ante Settlement) and lacks a clear **Normative/Informative split** (Import: Accessible Record), the participants mistake the *rules of evidence* for the *nature of meaning*. Your framework separates these cleanly (Normative vs. Informative). Their framework conflates them, generating heat without light.

  **Low Confidence Steps:**
  I am least confident in **Move 2 (Semantic Canons)**. Legal canons are deeply pragmatic and often contradictory (one canon for this, another for that), used to justify outcomes. PL grammar constraints are usually formal and monotonic. Treating canons as "type constraints" risks overstating the determinacy of the legal process. If the canons are merely rhetorical tools rather than logical constraints, the map to PL type theory is weaker than I have presented.

  I am also uncertain about **Move 5 (Absurdity)**. In PL, "Undefined Behavior" is a license to do *anything*, including the absurd. In Law, the Absurdity Doctrine is a *restriction*. This is a structural inversion. However, the *dispute* about it (Should we allow the absurd result if the text permits?) maps perfectly.

  **Conclusion:**
  The legal seminar is arguing about the admissibility of extratextual evidence (Rationale, Intent) while believing they are arguing about the nature of Meaning. Your vocabulary separates the text (Normative) from the intent (Informative), showing that the "meaning" doesn't change, only the allowed sources for resolving underdetermination do.

  Verdict: SOURCE-DEFLATED
