answer: |-
  There is no single, canonical term in ethics, law, or systems engineering that perfectly captures the specific maneuver you describe: the *deliberate, upstream drafting choice* to omit a safeguard in order to shift the locus of failure from the system to the operator, thereby exploiting the legal and moral shield of "omission."

  You are correct to reject the standard "acts vs. omissions" distinction. That framework evaluates the moment of harm (the nurse standing by), whereas your observation concerns the *moment of design* (the engineer writing the spec). At the moment of design, the omission is not a passive failure to act; it is an active choice to exclude.

  Here is the carving you requested. It synthesizes the closest existing concepts from law and ethics, identifies the gap in engineering literature, and proposes a term to fill it.

  ### 1. The Existing Cousins

  To understand why a new term is needed, we must identify why the existing ones fall short.

  **The Legal Cousin: "Creation of Peril"**
  Your colleague's intuition about American law is correct. The doctrine is known as **Creation of Peril** (or "Affirmative Duty Created by Prior Conduct").
  *   **Definition:** Under tort law (e.g., Restatement (Second) of Torts § 321), a party who creates a situation of risk has an affirmative duty to exercise reasonable care to prevent harm, even if they would not otherwise have a duty to act.
  *   **Relevance:** This doctrine pierces the "nonfeasance" shield. It argues that by designing the pump to *allow* the overdose (rather than prevent it), the manufacturer created the peril, making the subsequent "omission" to stop it legally actionable.
  *   **Why it's insufficient:** This is a *litigation* concept applied post-hoc. It does not name the *design strategy* itself. It describes the liability, not the requirement-engineering maneuver.

  **The Ethical/STS Cousin: "Moral Offloading" (or "Moral Crumple Zone")**
  In Science and Technology Studies (STS), specifically the work of Madeline Elish on automated systems, this is described as the **Moral Crumple Zone**.
  *   **Definition:** A configuration where the human operator absorbs the moral and legal responsibility for the limitations of an automated system. The system is designed to be "just automated enough" to shift control to the human when things go wrong, but "just automated enough" to claim efficiency when things go right.
  *   **Relevance:** This captures the *effect* on the nurse (Example 1 & 2).
  *   **Why it's insufficient:** It focuses on the *victim* of the strategy (the clinician), not the *architect* of the strategy (the requirements writer). It describes the social outcome, not the textual mechanism in the requirements document.

  **The Engineering Euphemism: "Risk Transfer"**
  In safety engineering, this is often sanitized as **Risk Transfer** or **Operational Mitigation**.
  *   **Definition:** Moving a hazard control from the "System" column to the "User" column in a hazard analysis matrix.
  *   **Why it's insufficient:** This treats the decision as a neutral trade-off (like cost vs. weight). It lacks the normative weight to describe a *deliberate avoidance of a known, feasible safeguard* for the purpose of liability insulation.

  ### 2. The Proposed Concept: "Pre-emptive Nonfeasance"

  Since no existing term binds the *temporal shift* (design time vs. incident time) with the *legal maneuver* (omission vs. act), I propose the term **Pre-emptive Nonfeasance**.

  **Definition:**
  *Pre-emptive Nonfeasance* is the deliberate exclusion of a safety control from a system specification during the design phase, where:
  1.  The hazard is known and foreseen.
  2.  The technical control is feasible and affordable.
  3.  The exclusion is motivated (wholly or partly) by the desire to classify the resulting failure mode as "operator error" or "use environment" rather than "design defect."
  4.  The documentation is structured to ensure no system requirement exists that could be violated by the harm.

  **Why this term works:**
  *   **"Nonfeasance":** Acknowledges the legal shield the designers are exploiting (the claim that the system merely "allowed" harm rather than "caused" it).
  *   **"Pre-emptive":** Locates the moral agency in the design phase, not the incident phase. It reframes the omission as an *act of drafting*.
  *   **Distinction:** It separates this from standard "Risk Acceptance." In legitimate Risk Acceptance, the residual risk is documented, signed off by a safety board, and acknowledged as a system limitation. In Pre-emptive Nonfeasance, the risk is hidden by ensuring the system makes no promise it could break.

  ### 3. The Carving (Edges and Boundaries)

  To ensure this concept does genuine work, we must define what falls inside, what falls outside, and the hard case that tests the boundary.

  **Case Inside (Clear Example):**
  *   **Scenario:** Your Example 3 (Partial Occlusion).
  *   **Analysis:** The engineers know partial occlusions can become total. They *could* write a requirement: "If pressure rises for X seconds, halt." They choose *not* to write it. Consequently, when harm occurs, the safety case shows no violation because the requirement never existed. The harm flows through a "gap" that was deliberately left unguarded to avoid a "violation."
  *   **Verdict:** This is Pre-emptive Nonfeasance. The absence of the clause is the design feature.

  **Case Outside (Clear Example):**
  *   **Scenario:** A requirement is dropped because the sensor technology to detect the hazard does not exist at any price, or the false-alarm rate would be 90%, rendering the device unusable for its primary life-saving function.
  *   **Analysis:** Here, the exclusion is driven by *feasibility* or *net-safety calculus* (the cure is worse than the disease). The hazard analysis explicitly documents this as "Unmitigable with Current Technology" or "Accepted Residual Risk."
  *   **Verdict:** This is **Legitimate Risk Acceptance**. It is not Pre-emptive Nonfeasance because the motivation is not liability shielding, and the risk is transparently documented, not hidden via requirement omission.

  **The Hard Case (The Boundary Test):**
  *   **Scenario:** A rate limiter (like your Example 2) is removed because clinicians say it interrupts "legitimate workflows." The engineers know this increases overdose risk, but they also know that if the alarm is too sensitive, clinicians will bypass the safety features entirely (alarm fatigue), leading to *greater* overall harm.
  *   **The Test:** Is this Pre-emptive Nonfeasance or **Usability-Driven Safety Optimization**?
  *   **Deciding Factor:** The *Evidence of Trade-off*.
      *   If the decision is supported by data showing that the *net* harm decreases (fewer bypasses outweigh the overdose risk), it is **Optimization**.
      *   If the decision is supported primarily by market requirements ("Clinicians won't buy it if it nags") without a corresponding safety case demonstrating net benefit, it slides into **Pre-emptive Nonfeasance**.
      *   *The Edge:* The concept turns on whether the "workflow" argument is a proxy for patient safety (preventing alarm fatigue) or a proxy for commercial liability (preventing a violatable requirement). If the hazard analysis re-files the overdose as "clinician error" *without* proving the clinician's ability to prevent it is reliable, it is Pre-emptive Nonfeasance.

  ### 4. Relation to Standard Ethical Frameworks

  You asked whether this survives contact with "intended vs. foreseen" harm (Doctrine of Double Effect).

  *   **The Standard View:** The harm is merely foreseen, not intended. The intention is "usability." Therefore, it is permissible.
  *   **The Pre-emptive Nonfeasance Critique:** This framework fails because it ignores the *structural agency*. By designing the system to rely on the nurse, the designer *intends* the nurse to be the safety control. If the nurse fails, the system performs exactly as designed (by not intervening).
  *   **Conclusion:** The "intended/foreseen" distinction collapses here. The harm is not a side effect; it is the *accepted cost* purchased by the omission. Pre-emptive Nonfeasance treats the *omission itself* as the intentional act, making the foreseen harm a direct consequence of a chosen design specification, not a byproduct.

  ### Summary

  You have identified a gap in the vocabulary of safety engineering. The industry calls this "Risk Transfer" or "Operational Mitigation," which are neutral terms that obscure the moral agency involved. The law calls the result "Creation of Peril," but only after the harm occurs.

  The concept you need is **Pre-emptive Nonfeasance**. It names the act of drafting a document in such a way that the system is legally insulated from a harm it was technically capable of preventing. It asserts that in requirements engineering, **silence is a specification.**
