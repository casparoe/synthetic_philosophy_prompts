      *   *So:* **Redistribution (Econ or Cultural) = Left.** **Order (Econ or Cultural) = Right.**
      *   *Dale:* Econ Redistribution (Union) + Cultural Order (Nation). Order wins.
      *   *Tomas:* Econ Redistribution (Co-op) + Cultural Order (Church). Redistribution wins.
      *   *Why the difference?* Dale's "Order" is National Exclusion. Tomas's "Order" is Religious Tradition. National Exclusion is a "Harder Right" signal than Religious Tradition in the user's mind.
      *   *Okay, I'll stick with **Grievance (Oppression vs. Displacement)**.* It captures the *motivation*, which is what the user is intuiting.

      *Let's check the Somali Shopkeeper again.*
      *   Laissez-faire (Order/Market).
      *   Devout (Order/Tradition).
      *   Anti-Feminist (Order/Patriarchy).
      *   Open Borders (Oppression/Displacement? Actually, Open Borders is usually Left/Universalist).
      *   If he wants open borders because "Muslim Ummah," that's Particularist (Right). If "Human Rights," that's Universalist (Left).
      *   Given "Anti-Feminist" and "Laissez-faire," the weight is on Order.
      *   Verdict: **Right.**

      *The "Cannot Save" List:*
      *   The Stalinist: Fits Left (Oppression), but feels Right (Authoritarian/Order).
      *   The 1840 Radical: Fits Right (now), but was Left (then). Shows the terms are historical, not absolute.
