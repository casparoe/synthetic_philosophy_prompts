answer: |-
  This is a fantastic problem, and your student is right to be proud of the reconstruction. It is textually grounded, logically tight, and exposes a genuine tension in Aristotle's account of value. If you tell him he's "misreading Aristotle" without surgical precision, he will (rightly) assume you're protecting a dogma.

  You need to concede him the text of (4) but dismantle the inference to (5) and the identification in (3). The argument breaks at **(3)** and **(5)** simultaneously, because they rely on a category error regarding what *nomos* (convention/law) does in Aristotle's politics.

  Here is the diagnosis, the specific equivocations, the textual ammunition, and the price of the solution.

  ### 1. The Primary Break: Premise (3) and the Ontology of the Measure

  The student's step (3) claims: *Aristotle names [the unit]: money, which is "a measure of all things."*
  This is the first place to strike. It is a category mistake.

  *   **Equivocation on "Measure" (*metron*):**
      *   **Reading A (Student's):** Money is the *ontological ground* of commensurability. It is the thing that *makes* the house and shoe comparable.
      *   **Reading B (Aristotle's):** Money is the *practical proxy* for the true measure. It is the token that *signals* comparability.
  *   **The Text:** At 1133a19, immediately *before* the "by convention" line, Aristotle writes: **"In reality (*tēi men oun aletheiai*), it is need (*chreia*) that holds everything together."**
  *   **The Argument:** Aristotle explicitly distinguishes the *truth* of the measure (Need) from the *convention* of the measure (Money). Money is introduced (1133a20) because need is too amorphous to carry in your pocket. Money is a "guarantee" (*enguē*) that your need will be redeemable later.
  *   **Why it breaks (3):** If Money is only a proxy for Need, then the commensurability of the house and shoe does not depend on the *intrinsic stability of the coin*, but on the *stability of the social need* the coin represents. The student treats money as the ruler; Aristotle treats money as the hash-mark on the ruler, while "Need" is the length being measured.

  ### 2. The Fatal Inference: Premise (5) and the Meaning of *Nomos*

  The student's step (5) claims: *Whatever can be altered at will has no value of its own; its value is just whatever the person doing the altering decides it is.*
  This is where the "hard-money" podcast logic bleeds into the exegesis.

  *   **Equivocation on "Alterable" / "By Convention" (*nomos*):**
      *   **Reading A (Student's):** "Alterable" means *inflationary manipulation* or *arbitrary re-valuation* within a functioning system. (i.e., The Fed printing money).
      *   **Reading B (Aristotle's):** "Alterable" means *demonetization* or *political dissolution*. (i.e., The polis collapsing or deciding to stop using this token).
  *   **The Text:** Look at the sentence immediately following the quote your student loves (1133a25–26). Aristotle says: **"Nevertheless, when it has been established, it acts as a guarantee (*enguē*)."**
  *   **The Argument:** Aristotle acknowledges that the *status* of money is contingent on the polis (we could stop using shells or silver tomorrow). He does *not* say that *while it is established*, its value is subject to the whim of the issuer. For Aristotle, *nomos* is not "whim"; it is "institutional fact." A law is conventional, but while it is in force, it has binding reality.
  *   **Why it breaks (5):** The student infers that because the *system* is conventional, the *valuation* is arbitrary. Aristotle argues that because the *system* is conventional, the *trust* is political. The "value of its own" that the student demands is a naturalistic fallacy Aristotle rejects. For Aristotle, value in exchange *just is* social need codified by law. To demand value outside of *nomos* is to demand value outside of the polis, which for Aristotle is sub-human.

  ### 3. The *Reductio* on Hard Money (Your Hunch E)

  You should deploy this to show the student his criterion is impossible to meet, even by his own standards.

  *   **The Argument:** The student claims (9) requires money the issuer "physically can't alter." But as you noted, specie is alterable.
      *   **Clipping/Debasement:** Silver coins were clipped constantly in antiquity. Aristotle knows this.
      *   **Market Fluctuation:** The purchasing power of gold fluctuates based on supply (e.g., new mines discovered).
      *   **The Aristotelian Point:** If "alterability" invalidates the measure, then *no* measure works, because *chreia* (demand) itself fluctuates. If nobody needs shoes, a shoe is worthless, regardless of whether you paid in gold or paper.
  *   **The Trap:** If the student insists gold is different because it is "physical," he commits to the view that value resides in the *material* of the currency. Aristotle explicitly denies this at 1133a20: money exists "not by nature but by nomos." If value were in the metal, it would be by nature. By arguing for gold, the student is arguing *against* Aristotle's explicit definition of money to save Aristotle's conclusion.

  ### 4. Pricing the Solution: What Aristotle Loses

  You asked what breaking this costs. Be honest with the student (and yourself).

  *   **What Aristotle Keeps:** He keeps the **Proportionality Account of Just Exchange (1)**. Exchange is just if it reflects proportionate need. He keeps the **Conventionalism about Money (4)**. Money is a political tool.
  *   **What Aristotle Loses:** He loses the idea that there is a **Stable, Trans-Political Standard of Value**. There is no "God's eye view" price for a house. The "just price" is always internal to the *polis* and its specific *nomos*.
  *   **The Cost to the Student:** He loses the **Universal Condemnation of Fiat (9)**. If money is a guarantee of *need* established by *law*, then fiat currency is just as capable of underwriting just exchange as gold, *provided* the law is stable and the need is real. His argument proves that *unstable* currency (hyperinflation, demonetization) prevents justice, but it does not prove that *conventional* currency prevents justice.

  ### 5. Advice on the "Lesbian Rule" (Your Hunch D)

  I would advise **against** using the Lesbian Rule (NE V.10) here.
  *   **Why:** The Lesbian Rule is about *Equity* (*epieikeia*), which corrects the law when the law is too universal for a specific case. It is about *judging* particular actions, not about the *commensurability* of goods in exchange.
  *   **Risk:** If you tell him "standards are supposed to bend," he will hear "justice is subjective," which reinforces his suspicion that fiat is just a disguise for preferences. Stick to V.5. The "Need" (*chreia*) argument is stronger because it posits a *real* standard (human need) that money merely tracks.

  ### Summary for Office Hours

  Here is the script I would use with him:

  1.  **Concede (4):** "You are right that Aristotle says money is by convention and can be changed. That text is solid."
  2.  **Challenge (3):** "But look at 1133a19. Aristotle says the *real* measure is Need (*chreia*). Money is just the receipt. Your argument treats the receipt as the value. If the receipt is conventional, does that mean the need is imaginary?"
  3.  **Challenge (5):** "You interpret 'alterable at will' as 'inflationary manipulation.' But Aristotle follows that immediately by saying money acts as a 'guarantee' (*enguē*). A guarantee only works if the convention is stable. Aristotle is talking about the *existence* of the currency system, not the daily *valuation*. Do you think Aristotle would say a silver drachma has 'natural value' if the market doesn't want silver?"
  4.  **The *Reductio*:** "If 'alterability' kills justice, then gold fails too. Its supply changes, it gets clipped, its purchasing power floats. If you say gold is 'less alterable,' you admit it's a difference of degree. But your conclusion (9) claims a difference of *kind* (just vs. unjust). A difference of degree cannot support a difference of kind."
  5.  **The Verdict:** "Aristotle's point isn't that money must be physically immutable. It's that exchange must be politically guaranteed. Fiat can do that. Gold can do that. But neither can do it without a *polis* to sustain the *nomos*."

  **Bottom Line:** The student's argument is valid *if* you accept his definition of "measure" and "alterable." But those definitions are anachronistic imports (modern monetary theory vs. ancient political ontology). Reject (3) and (5) on textual and categorical grounds, and (9) collapses. He keeps the logic, but he has to abandon the "hard money" conclusion.
