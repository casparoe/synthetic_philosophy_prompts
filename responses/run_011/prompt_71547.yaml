      *   1133a19: "In reality, need is the one thing that holds them together."
      *   1133a20: Money exists by convention (*nomos*).
      *   1133a25: "It is in our power to change it and make it useless."
      *   1133a26: "But when it is established, it acts as a guarantee (*enguē*)."
