answer: |-
  Let's score smallpox eradication as of 1966 using strict ITN bookkeeping, then test the framework's structural integrity against the historical record.

  **1. The 1966 Scorecard**

  **Importance:** Standard ITN measures importance in lives saved or DALYs averted per year per unit of resource. Smallpox caused ~2 million deaths annually. However, ITN typically treats causes as flow problems (reducing the rate) rather than stock problems (eliminating the source). Eradication is a one-time cost for an infinite stream of benefits. If ITN uses a standard discount rate, the value of permanence is flattened into merely "very high annual savings." If it does not discount, the value approaches infinity. Most ITN calculators treat them similarly because they lack a mechanism to value "permanent solution" vs. "permanent mitigation" distinctively.
  *Unit:* Lives/year.
  *Verdict:* High, but structurally indistinguishable from a permanent control programme costing the same annually.

  **Tractability:** In 1966, the known technology was mass vaccination requiring 80% coverage. This is logistically brutal in conflict zones and dense urban slums. Based on *known* tactics, tractability was low-to-medium. The surveillance-containment tactic (ring vaccination) did not exist in the plan. ITN requires ex ante estimation of marginal returns. Since the high-tractability tactic was unknown, an honest 1966 ITN score must use the mass-vaccination baseline.
  *Verdict:* Low/Medium (based on available knowledge).

  **Neglectedness:** This is the bookkeeping failure. Neglectedness is defined as the inverse of resources already applied. Every nation on earth already funded smallpox vaccination; global health spend on smallpox was high. However, *eradication* specifically was unfunded. ITN struggles to separate "cause area" (smallpox prevention) from "specific intervention goal" (eradication). Relative to global health spend, neglectedness was low. Relative to the specific goal of eradication, it was high. ITN usually scores the former.
  *Verdict:* Low (due to existing national programmes).

  **ITN Conclusion (1966):** High Importance, Low Tractability, Low Neglectedness. The framework suggests *not* prioritizing eradication over other causes with higher marginal returns (e.g., maternal health, basic sanitation). The WHO commitment was a violation of strict ITN logic based on 1966 data.

  **2. Feature One: Tractability as Emergent, Not Intrinsic**

  Your roommate claims ITN is just expected value (EV). EV handles uncertainty by weighting outcomes by probability. ITN handles it by scoring "Tractability" as a static property of the cause. The Nigeria episode proves tractability was not a property of smallpox; it was a property of *smallpox plus ring vaccination*. That tactic was discovered only because the mass vaccination plan failed due to resource constraints (running out of vaccine).

  This breaks ITN ex ante. If tractability depends on tactical innovation triggered by scarcity, you cannot score it before starting. ITN assumes you know the production function of progress. Here, the production function was discovered mid-process. ITN cannot model "we will find a better way because we are forced to." It treats low initial tractability as a signal to exit, whereas the historical signal was to persist until constraints forced innovation. This suggests ITN is not merely EV with a gloss; it is EV stripped of option value and learning dynamics.

  **3. Feature Two: The Alma-Ata Legibility Bias**

  The Alma-Ata objection is a fair charge, not a strawman. ITN requires quantification to function. You cannot calculate Neglectedness without knowing where money goes; you cannot calculate Tractability without knowing what outcomes cost. Vertical campaigns (vaccines, bednets) produce legible units (doses, nets, cases). Horizontal systems (primary care, social determinants) produce diffuse outcomes (resilience, trust, slower mortality decline).

  Because ITN optimizes for measurable marginal returns, it systematically penalizes causes where the counterfactual is hard to model. A framework built on I/T/N will *always* rank a legible, campaign-shaped win above a diffuse, system-shaped win, even if the system win has higher expected value long-term. This is not a limit users can fix; it is baked into the requirement that causes be scoreable. The shift to "selective primary health care" confirms this: the framework consumed the compromise because selective care was the only version of health systems ITN could digest.

  **4. The Value of 1980 as Evidence**

  Treating 1980 as a vindication of ITN is survivorship bias. Smallpox was biologically unique: no animal reservoir, obvious symptoms, effective vaccine. ITN cannot distinguish biological suitability ex ante without deep domain expertise that the framework abstracts away. When the same vertical template was applied to malaria (no eradication yet) or polio (persistent endemic pockets), the returns diverged wildly.

  If ITN had scored malaria eradication in 1966, it would have looked similar to smallpox: high importance, seemingly solvable technology, neglected coordination. The failure of malaria eradication suggests the 1966 smallpox Tractability score was lucky, not accurate. 1980 is a single draw from a distribution where vertical campaigns often fail to eradicate. Using it to validate the selection framework ignores the counterfactuals where the same logic led to sunk costs in less tractable diseases.

  **Conclusion on the Roommate's Claim**

  Your roommate is wrong. EV thinking incorporates uncertainty, option value, and the value of information. ITN hardcodes measurability and static tractability. ITN would have likely deprioritized smallpox eradication in 1966 because the tractability was low and the cause area crowded. The success relied on tactical innovation and biological luck that the framework cannot model. ITN is not just EV; it is a specific heuristic that filters for legibility and stability, excluding high-variance, high-learning interventions.

  Verdict: STRAINS — Tractability and importance are intrinsic cause properties, not emergent strategy-dependent variables.
