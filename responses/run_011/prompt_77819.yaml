answer: |-
  Here are six questions designed to ramp from operational clarity to existential pressure, including the pressure points, predicted replies, and follow-ups you requested.

  ### Question 1: The Ritual of the Envelope
  **Pressure Point:** Operationalizing the "Outside View." You want to establish the baseline mechanics before attacking them. This lets her settle in and explain the *discipline* of her method without immediate challenge.
  **The Question:** "You require teams to lock in the reference class and its distribution in a sealed envelope before they see a single line of the project plan. Walk us through that moment. What is the specific cognitive error the physical seal prevents that a simple rule—'check the base rate first'—doesn't catch?"
  **Likely Reply:** "Rules are leaky; rituals are sticky. If you see the project details first, even subconsciously, you start hunting for a reference class that justifies your intuition. The seal forces you to commit to the population before you meet the individual. It prevents 'class shopping'."
  **Follow-Up:** "So the seal is primarily a guardrail against motivated selection. But that implies the *choice of the class itself* is the vulnerability. If I can't look at the project to pick the class, what objective criteria do you use to decide whether this project belongs in 'IT implementations' versus 'Government IT implementations'? Because those distributions are radically different, and you've barred yourself from using the case details to choose between them."

  ### Question 2: The Reference Class Problem
  **Pressure Point:** Class selection requires inside knowledge. This targets the "nested classes" vulnerability you identified. If she can't use case info to pick the class, how does she avoid arbitrariness?
  **The Question:** "Following up on that: The 'Reference Class Problem' suggests that any single project belongs to infinite classes, each with different statistics. If I'm barred from using case-specific details to narrow the class, aren't you just forcing me to pick the broadest possible category? And if I pick the broadest category, isn't the variance so high that the estimate becomes useless for decision-making?"
  **Likely Reply:** "We don't pick the broadest; we pick the *most comparable* based on structural features available *before* the deep dive. Things like budget size, sector, and procurement type. These are metadata, not inside views. We rely on objective classifiers, not narrative similarity."
  **Follow-Up:** "But those classifiers are often the very things teams manipulate to game the system. If I know the 'Government IT' curve is worse than the 'Private Software' curve, and I haven't read the file yet, I can label the project 'Private Software' in the metadata phase. If the seal locks the class before the file read, who verifies the metadata isn't already optimized for a favorable curve?"

  ### Question 3: The Constraint vs. The Prior
  **Pressure Point:** Base rate as a hard constraint. This tests whether her method produces *worse* estimates when specific, high-quality inside information exists (e.g., fixed-price contracts).
  **The Question:** "You treat the base rate as a constraint: the final estimate must land in the central 80% of the reference distribution unless there's data-backed causal evidence for deviation. Consider a genuine fixed-price turnkey contract. The cost uncertainty for the client is legally near-zero. Does your protocol require you to widen that interval to match the historical overrun rate of similar *types* of projects, even if the contract eliminates that risk?"
  **Likely Reply:** "Fixed-price contracts don't eliminate cost uncertainty; they transfer it to the contractor, who then cuts corners, claims variations, or goes bankrupt, which eventually costs the client more. The historical distribution captures that systemic risk. Ignoring it because of a contract clause is the inside-view bias we're trying to fix."
  **Follow-Up:** "That's a claim about systemic risk, not project cost. If your method predicts a 20% overrun on a legally fixed contract, and the overrun doesn't happen because the contractor absorbs the loss, your estimate was wrong. Are you willing to accept being 'wrong' on the specific number in service of being 'right' about the general risk profile? Because for a budget holder, those are different things."

  ### Question 4: First-of-a-Kind and Knightian Uncertainty
  **Pressure Point:** True novelty. This challenges the applicability of base rates to situations where the reference class is composed of non-comparable cases.
  **The Question:** "Your method works well where history repeats. But policy often deals with first-of-a-kind interventions—new technologies, novel geopolitical conflicts. If I force a genuine one-off into a distribution assembled from loosely comparable cases, isn't that false precision? Why is reporting a wide interval based on weak proxies more honest than saying 'the distribution doesn't apply here'?"
  **Likely Reply:** "Nothing is truly unique. People say 'this war is different' or 'this tech is new,' but the dynamics of escalation or adoption always have predecessors. A wide interval isn't false precision; it's quantifying our ignorance. Saying 'it doesn't apply' is just an excuse to revert to gut feeling."
  **Follow-Up:** "But quantifying ignorance with a distribution implies the uncertainty is *aleatoric* (random but predictable), not *epistemic* (unknown unknowns). If you put a 90% confidence interval on a first-of-a-kind project, you're implying that 9 out of 10 times, the truth falls there. But if the sample size of 'comparable' cases is three, that confidence level is mathematically unjustified. At what point does the method become a costume for guessing?"

  ### Question 5: Performativity
  **Pressure Point:** The method changes the data. This addresses the feedback loop where successful forecasting alters the historical record.
  **The Question:** "Let's assume your method becomes standard practice. If teams start using outside-view constraints to curb optimism, project overruns should decrease. But your reference distributions are built on historical data generated by people *not* using your method. If your method works, it makes its own historical data obsolete. Which distribution are you supposed to use once the method is widespread?"
  **Likely Reply:** "That's a feature, not a bug. We want to shift the distribution. We use the old data to break the old habits, and as the population behavior changes, we update the reference class. It's a moving target, but we're aiming for a better equilibrium."
  **Follow-Up:** "But to update the reference class, you have to decide *which* new projects count as the 'new normal' versus outliers. That decision requires judgment about whether the new data reflects a structural shift or just luck. Isn't that judgment call exactly the kind of inside-view reasoning you barred in the sealed envelope? You need inside-view judgment to update the outside-view data."

  ### Question 6: Reflexivity (The Killer)
  **Pressure Point:** The reference class for the method itself. This applies her own logic to her intervention, questioning the base rate of forecasting methodologies succeeding in the wild.
  **The Question:** "Your view is itself a claim about how to make estimates better. So, what is the reference class for 'methodological interventions in public policy'? We know debiasing training tends to wash out fast, and forecasting improvements often fail to scale. What's the base rate for a method like yours actually improving outcomes in the wild, and does your protocol survive *that* outside view?"
  **Likely Reply:** "We have empirical data from Flyvbjerg and others showing RCF reduces overruns. We aren't a psychological intervention; we're a procedural constraint. The data shows it works."
  **Follow-Up:** "That data comes from controlled pilots or specific jurisdictions. The reference class for 'procedural constraints in complex bureaucracies' is full of methods that worked in pilots and failed at scale. If you apply your own rule—'don't assume this case is different from the base rate of failed interventions'—shouldn't you be significantly more modest about the method's likely impact than you are about the project's cost?"

  ***

  ### 1. Which question does she actually have a real answer to?
  **Question 3 (The Constraint/Fixed-Price).**
  She has a rehearsed, robust answer for this. The Flyvbjerg/RCF lineage has spent years battling the "fixed-price contract" objection. Her likely reply (that fixed-price contracts shift risk rather than eliminating it, often leading to bankruptcy or quality reduction which eventually costs the public) is empirically grounded in construction and defense data.
  **Why it's not a knockout:** If you push the follow-up ("Are you willing to be wrong on the specific number?"), you might corner her, but she will comfortably argue that her mandate is *accurate risk assessment*, not *budget authorization*. She will argue that predicting the overrun is useful *because* it warns the client that the fixed price is fragile. She won't view a "wrong" estimate of the final cost as a failure if it correctly predicted the *risk* of the fixed price collapsing.

  ### 2. What would change my mind about the ranking?
  **The "Sealed Envelope" Framing (Question 1 & 2).**
  Your description suggests she picks the reference class with *zero* case information ("before anyone reads the project-specific file"). If this is literally true, Question 2 is the killer, because class selection *requires* some case knowledge (e.g., is this a bridge or a tunnel?).
  **The Strawman Risk:** If her actual practice allows for a "metadata phase" where objective classifiers (budget size, sector, procurement type) are agreed upon *before* the seal is locked, then the "circularity" charge weakens significantly. She would argue that metadata isn't "inside view" (narrative/optimism) but "structural view."
  **The Flip:** If she clarifies that the "Sealed Envelope" locks the *distribution parameters*, not the *class selection criteria*, then Question 2 becomes a technical quibble rather than a structural flaw. In that scenario, **Question 6 (Reflexivity)** becomes the undisputed killer, because there is no "metadata" defense against the base rate of failed methodologies. The success of RCF in the wild is far less proven than its success in case studies, and applying her own skepticism to her own method is the one move she can't deflect with "structural features."
