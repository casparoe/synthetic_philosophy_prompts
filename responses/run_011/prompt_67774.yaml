  2.  **Verify the Text (Mental Check):**
      *   *Analects* 13.18:
          *   Duke of She: "Among my people, there is one we call 'Upright' (*zhi* 直). When his father stole a sheep, he bore witness against him."
          *   Confucius: "Among my people, the 'Upright' are different from this. The father covers for the son, the son covers for the father. Uprightness (*zhi* 直) is to be found in this."
      *   *Key Terms:* *Zhi* (直 - upright/straight), *Xiao* (孝 - filial piety - *not* explicitly in the text), *Fu* (Father), *Zi* (Son).
      *   *User's Observation:* Is the symmetry real? Yes, "Father covers son, son covers father" (父为子隐，子为父隐).
      *   *User's Question:* Does this symmetry imply mutual role-virtues rather than just *xiao*? What is the father's virtue?

  3.  **Brainstorm Candidate Readings of Confucius's Reply:**
      *   *Reading A: Semantic Redefinition.* Confucius is redefining *zhi*. It doesn't mean "factual accuracy" but "relational integrity."
      *   *Reading B: Normative Priority.* Confucius is saying family roles *override* civic duties in this specific context.
      *   *Reading C: Role-Ethics Constitutive.* The self *is* the role. To act against the role is to cease to be a self/agent. Uprightness is being true to one's constitutive relations.
      *   *Reading D: Deflection/Contextual.* Confucius isn't making a universal claim but highlighting the Duke's misunderstanding of social harmony.

  4.  **Evaluate Readings against Role-Ethics & Corruption Objection:**
      *   *Role-Ethics (Ames/Hall):* Focuses on *zhi* as emerging from the specific relational context, not abstract principle.
      *   *Corruption Objection:* Isn't this just protecting criminals?
      *   *Symmetry Point:* If it's just *xiao*, why does the father hide for the son? *Xiao* is son-to-father. Father-to-son is *Ci* (慈 - benevolence/kindness). The text uses *Zhi* for both. This supports the idea that *Zhi* is the quality of the *relationship*, not just the individual virtue.

  5.  **Integrate Other *Analects* Passages (Remonstrance):**
      *   *Analects* 4.18: "In serving father and mother, one may gently remonstrate..." (事父母幾諫).
      *   *Conflict:* If I hide for my father, am I remonstrating? Hiding seems to enable the theft. Remonstrance seems to expose the wrong.
      *   *Resolution:* Remonstrance is private/internal to the family. Testifying is public/external to the state. The boundary is the key.

  6.  **Address Role Conflict (Son vs. Citizen):**
      *   Role ethics doesn't see roles as separate hats. They are woven.
      *   If the roles conflict, the "right" action is the one that sustains the web of relationships long-term.
      *   Does protecting a thief sustain the family? Maybe. Does it destroy the community? Maybe.
      *   Role ethicist answer: The family is the root (*ben* 本). If the root rots, the state falls. Therefore, preserving the family bond *is* preserving the political order in the long run.

  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sharpness of the observation. Validate the symmetry (父为子隐，子为父隐). Confirm *xiao* is absent from the text.
