      *   *The Father's Virtue:* It's *Ci* (慈), but the text subsumes it under *Zhi*. This is crucial for role ethics—the virtue belongs to the *position-in-relation*, not the individual.
      *   *Remonstrance (4.18):* How to reconcile? Distinguish internal correction vs. external betrayal. Hiding is not endorsing; it's shielding from external punishment while correcting internally.
      *   *Role Conflict:* Role ethics denies the "conflict" is between two separate selves. It's a tension within one nexus. The resolution is hierarchical but organic (family is root).
      *   *Verdict:* The symmetry supports a "Relational *Zhi*" reading. It's not nepotism; it's a claim about where moral authority originates (the concrete relation vs. the abstract law). But the corruption objection still stings if the role-ethicist can't explain the limit (e.g., what if the father murders?).

  8.  **Refining the Argument (Self-Correction during drafting):**
