      *   *Role Ethics Specifics:* Mention Ames/Hall implicitly (the "nexus of roles" language) but focus on the logic.
      *   *Symmetry:* Emphasize that the symmetry makes it about the *bond*, not just the son's duty. This is the user's strongest point.

  9.  **Final Polish:** Check tone. Ensure it sounds like a colleague/senior scholar talking to a grad student. Avoid bullet points where prose flows better, but use structure for the "Brainstorming" section as requested. Ensure the "Honest Verdict" is clear.

      *(Self-Correction on "Deflection"):* Is it a deflection? Confucius says "Uprightness is *in* this." That's a positive claim, not just a deflection. I should characterize it as a *relocation* of the virtue's locus.

      *(Check on Remonstrance):* 4.18 says "remonstrate gently." If you testify, you aren't remonstrating gently; you are handing them over. So 13.18 and 4.18 are consistent *if* the sphere of action is distinguished (private vs. public).

      *(Final Verdict):* The Role-Ethics reading is the most textually faithful regarding the symmetry, but it requires a robust account of *how* roles are prioritized to avoid the corruption charge.

