prompt: |-
  I'm a first-year grad student in a Chinese philosophy seminar and I'm stuck on the sheep passage from the Analects — the one where the Duke of Sheh tells Confucius that in his district there are upright people: when a father steals a sheep, the son gives testimony against him. Confucius answers that in his own district the upright are different, the father covers for the son and the son covers for the father, and uprightness is to be found right there. (I'm paraphrasing from my notes because I left the book at the office, so don't put any weight on my wording — its the structure of the exchange I'm asking about.)

  I'm suppose to be evaluating the role-ethics reading, the one where a person just is a nexus of roles rather than an autonomous self who happens to occupy them, so what's right gets fixed from inside the role and can't be adjudicated from some outside standpoint. My worry: does this passage actually support that, or is it just Confucius defending nepotism with extra steps?

  Here's the thing I keep coming back to that nobody in seminar picked up on. The Duke's example is one-directional — only the son testifies — but Confucius's counter runs in both directions, the father covering for the son just as much as the son for the father. If that symmetry is in the Chinese and not an artifact of the English, then the passage isn't really about filial piety at all; it's about a matched pair of role-virtues, where each party's response is upright-relative-to-the-role they're in. Is that reading available? What's the virtue term on the father's side — not 孝, obviously — and does the passage even name it, or does it just apply 直 to both directions and leave the rest to inference?

  Please answer as someone who knows both the early Chinese material and the contemporary role-ethics literature, and think carefully rather than giving me the standard summary. Before you commit to an interpretation, brainstorm the candidate readings of Confucius's reply — is it a claim about the extension of the virtue term, a normative claim about what the son should do, a claim about where the term gets its content from, or a deflection of the Duke's whole framing? Then for each reading say what it does to the logic of the exchange, whether a role ethicist can actually live with it, and whether it still leaves him open to the corruption objection. Two more things: what elsewhere in the Analects would discriminate between these readings — I'm thinking of the passages about remonstrating with your parents when they're wrong, and whether that collides with covering for them — and how a role ethicist is meant to handle a flat conflict between two of your own roles, son versus member of a political community. I don't want a bibliography, just the interpretive options laid out and your honest verdict on which one is strongest.
