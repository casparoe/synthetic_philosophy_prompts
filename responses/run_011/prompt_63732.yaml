answer: |-
  OFFICE FOR APPLIED ETHICS PRODUCT SAFETY
  RECALL NOTICE: REFERENCE 883-AC
  DATE: 24 OCTOBER 2024
  SUBJECT: MANDATORY RECALL OF ACT CONSEQUENTIALISM UNITS (ALL GENERATIONS)

  **Manufacturer:** Teleos Ethical Systems Ltd.
  **Product:** Act Consequentialism Moral Decision Unit (Model AC-1 through AC-4)
  **Defect:** Critical Indeterminacy Fault (Commonly referred to as the "Cluelessness Error")

  The Office for Applied Ethics Product Safety hereby issues a mandatory recall for all installed units of the Act Consequentialism Moral Decision Unit. Investigations have confirmed that under normal operating conditions, the device fails to produce a determinate output regarding the moral status of voluntary actions. The core architecture requires the calculation of total net utility across all causal descendants of an act. However, due to the infinite extendability of causal chains and the limits of user epistemic access, the system frequently returns a null value or enters a perpetual processing loop.

  **Defect Description:**
  The Cluelessness Fault manifests when the unit attempts to weigh distant future effects against immediate consequences. Because the probability distribution of far-future outcomes does not converge to zero sufficiently fast, the expected value calculation remains unstable. 

  *Example of Fault Propagation:* A user performs a trivially ordinary act, such as purchasing a loaf of bread at a standard retail outlet. Under normal operating parameters, this act should yield a benign moral status. However, due to downstream causal ripple effects involving market price fluctuations, supply chain adjustments, and demographic shifts, the unit identifies a non-negligible probability that this specific transaction contributes to a catastrophic geopolitical event three centuries hence. As the unit cannot verify whether the distant catastrophe outweighs the immediate nourishment, it fails to assign a binary 'Right/Wrong' status.

  **Field Complaints:**
  Teleos Ethical Systems has logged over 4,000 complaints regarding unit malfunction.
  1. **Moral Paralysis:** Users report an inability to initiate basic locomotion or commerce due to fear of triggering negative utility cascades.
  2. **Retrospective Invalidation:** Users report that actions previously certified as 'Optimal' are subsequently reclassified as 'Catastrophically Wrong' upon the discovery of new causal data.
  3. **Output Noise:** The device emits conflicting signals when presented with symmetrical uncertainty scenarios.

  **Failed Firmware Patches:**
  The manufacturer has previously attempted to rectify this defect via several software updates. The Office confirms these patches are ineffective and potentially hazardous.

  *   **Patch 1.1 (Expectational Washout):** This update attempted to neutralise far-future uncertainty by assuming positive and negative unknown outcomes would cancel each other out. Field testing revealed that uncertainty distributions are rarely symmetric. Consequently, the unit began ignoring high-stakes risks on the erroneous assumption that unknown dangers were balanced by unknown benefits.
  *   **Patch 1.2 (Criterion/Procedure Decoupling):** This update reclassified the unit as a 'Criterion of Rightness' rather than a 'Decision Procedure'. While this silenced error messages regarding user paralysis, it rendered the unit unable to guide action. Users reported that a device which declares an action right only after the consequences have occurred provides no operational utility.
  *   **Patch 1.3 (Temporal Horizon Truncation):** This update instructed the unit to ignore all causal effects occurring beyond a 50-year window. This was found to violate the fundamental maximisation protocol hardwired into the AC core. Users reported system crashes when the unit detected arbitrary data exclusion inconsistent with its primary directive to maximise the good *simpliciter*.
  *   **Patch 2.0 (Rule-Based Wrapper):** In the latest attempt, the manufacturer rebranded the unit as 'Rule Consequentialism'. This involved overlaying a heuristic rule-set onto the act-based core. This resulted in severe system incompatibility. When rules conflicted with observable optimal outcomes, the unit overheated attempting to reconcile the contradiction between following the rule and maximising the good.

  **Warning:**
  Users are advised against attempting home repairs. Do not attempt to stabilise the unit by installing third-party 'Intuition' or 'Common Sense' modules. These are incompatible with the utilitarian architecture and may cause total system collapse or erratic deontological leakage. Disconnect the unit immediately and revert to a legacy virtue-based system until further notice.

  Compliance with this recall is mandatory under the Ethical Safety Standards Act 1998.
