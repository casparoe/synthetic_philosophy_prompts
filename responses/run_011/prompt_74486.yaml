answer: |-
  Your hypothesis is correct. You have identified the structural engine of the stalemate. The debate isn't stalling because of a lack of data; it's stalling because the two sides are using the same vocabulary to play different language games, specifically regarding the **individuation of situations** and the **teleology of traits**.

  Here is the diagnosis of the impasse, the limits of decidability, and what actual progress would look like.

  ### 1. Diagnosis: The Individuation Problem and the Trait Ambiguity

  You are right that the fight is about how situations get sorted. In philosophy of science, this is the **individuation problem**. To measure consistency, you must first decide what counts as "the same situation."

  *   **The Situationist Metric:** Situations are individuated **physically or contextually**. (e.g., "A phone booth," "A seminary hallway," "A lab with a shock generator"). Under this description, behavior is inconsistent. Therefore, no global trait exists.
  *   **The Virtue Ethicist Metric:** Situations are individuated **normatively**. (e.g., "A call for help," "A test of obedience to authority," "A moment of temptation"). Under this description, the situationist experiments often fail to trigger the specific normative recognition required for the virtue to activate. (e.g., The person in the hurry study didn't see the slumped man as a "neighbor to be loved" but as an "obstacle to the lecture").

  **The Trait Ambiguity**
  This leads directly to your second point: the conflation of two notions of 'trait'.
  1.  **The Psychological Trait (Predictive):** A statistical probability of behaving in way $X$ given context $Y$. This is descriptive and scalar.
  2.  **The Ethical Trait (Evaluative):** A perfected disposition to perceive and act correctly across the *relevant* domain. This is normative and often binary (you either have the virtue or you don't, in the Aristotelian sense).

  When a situationist says, "Traits don't exist," they mean *Predictive Global Traits*. When a virtue ethicist says, "Traits do exist," they mean *Evaluative Ideals*. They are talking past each other. The situationist proves that most people aren't saints; the virtue ethicist argues that ethics is about becoming saints, not describing average behavior.

  ### 2. Is There Something Decidable Underneath?

  You asked if a cleverer experiment or formal model could pin down "how much cross-situational consistency a real disposition requires."

  **The short answer is no.** The threshold of consistency is not an empirical fact; it is a **normative stipulation**.

  If you build a model that says "A trait requires 80% consistency across morally similar situations," the situationist will ask, "Why 80%?" If you say 50%, the virtue ethicist will ask, "Is a person who fails half the time truly *honest*?"

  Science can tell us the *distribution* of consistency in the population (e.g., "Most people are 40% consistent across these 10 scenarios"). But science cannot tell us what level of consistency constitutes a *virtue*. That is a philosophical decision about the purpose of ethical theory.
  *   If the purpose is **description**, situationism wins (people are fragmented).
  *   If the purpose is **aspiration**, virtue ethics wins (we aim for integration).

  **The One Empirical Vulnerability:**
  The only substantive claim that *could* be falsified is the virtue ethicist's claim that **moral education increases cross-situational consistency.** If longitudinal studies showed that moral training improves performance in Situation A but results in *zero* transfer to Situation B (even normatively similar ones), the Aristotelian claim that virtues are unified (the Unity of Virtues) or even broadly transferable would be empirically damaged. Some interactionist models (like Mischel and Shoda's CAPS) suggest this is largely the case: we have "if-then" signatures, not global dispositions.

  ### 3. What Counts as Progress?

  Since the empirical data cannot settle the normative definition, progress must be conceptual or conciliatory. Here are the three viable paths:

  #### A. The Interactionist Synthesis (The "CAPS" Model)
  Progress looks like abandoning the "Person vs. Situation" dualism entirely. The Cognitive-Affective Personality System (CAPS) model suggests that behavior is a function of how the individual *encodes* the situation.
  *   **Progress:** Virtue ethicists accept that traits are not "global motors" but **networks of cognitive-affective units** that are sensitive to context. Situationists accept that these networks are stable *within the individual* (my pattern of inconsistency is consistent).
  *   **Result:** We stop looking for "Honesty" as a single blob and start mapping "Honesty-in-context-X" vs. "Honesty-in-context-Y." This saves the virtue ethicist from bad psychology and the situationist from nihilism.

  #### B. The "Idealization" Concession
  Progress looks like virtue ethicists explicitly admitting that **Aristotelian virtue is an ideal type, not a common reality.**
  *   **Progress:** The virtue ethicist concedes: "You are right, 95% of people do not have global virtues. They have local habits. Virtue ethics is not a description of human nature; it is a technology for integrating those local habits."
  *   **Result:** The situationist loses the target. They are shooting at a straw man who claims everyone is already virtuous. The debate shifts from "Do traits exist?" to "Is the ideal of a global trait psychologically coherent?"

  #### C. The "No Disagreement" Thesis (Dissolution)
  This is the possibility you raised: that they have conceded so much there is nothing left.
  *   **Situationists now admit:** People have *local* traits (e.g., "honest-among-friends").
  *   **Virtue Ethicists now admit:** Global traits are rare, fragile, and require specific situational support to manifest.
  *   **Result:** The disagreement was never about human psychology; it was about **labeling**. If the situationist calls local traits "fragments" and the virtue ethicist calls them "developing virtues," they are observing the same data.
  *   **Progress:** Acknowledging that the debate is **metaphilosophical**. It's a fight over whether ethical theory should be grounded in *average human capacity* (Situationism/Pragmatism) or *optimal human capacity* (Virtue Ethics/Perfectionism).

  ### Summary Diagnosis
  You are not hitting a wall because you are missing a study; you are hitting a wall because you are trying to solve a **categorization dispute** with **frequency data**.

  *   **The Impasse:** Situationists define situations physically to show inconsistency; Virtue Ethicists define situations normatively to show relevance.
  *   **The Decidability:** Experiments cannot decide the normative threshold of what counts as a virtue.
  *   **The Progress:** Progress is not a knockout blow. It is the shift toward **Interactionism** (traits are context-sensitive encodings) and the admission that Virtue Ethics is largely **Ideal Theory** (describing the sage, not the average agent).

  If both sides accept that humans possess **stable local dispositions** that can be **integrated through training** but are **rarely fully global**, the war ends. The only remaining question is whether we call that integration "virtue" or "psychological coherence." That is not a question for psychology to answer.
