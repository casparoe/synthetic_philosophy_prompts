answer: |-
  **The case and the two theses**

  In a mountain village, households universally abstain from drawing water between noon and two PM due to an obsolete herd-watering rule, maintained by mutual expectation and fear of censure despite every villager privately wishing the practice would end. Owen argues the practice is a Lewisian convention because it satisfies the formal conditions of regularity, expectation, and arbitrariness, with sanctions providing the decisive reason to conform. Nadia argues it is not a convention but a collective mistake because it lacks the shared preference for coordination required by Lewis, resting instead on false beliefs and punitive norms. The case description under-specifies the utility cost of "censure" relative to the benefit of drawing water. I resolve this by assuming the censure is sufficiently costly to dictate behavior, isolating the structural issue from a simple payoff calculation.

  **The conditions**

  Lewis's analysis requires: (1) a regularity in behavior; (2) common knowledge that others conform; (3) a preference for general conformity conditional on others conforming; (4) alternative regularities could have obtained; (5) common knowledge of these preferences and expectations.

  1.  **Regularity:** Satisfied. All villagers abstain from drawing water during the specified hours.
  2.  **Expectation of Conformity:** Satisfied. Everyone expects everyone else to abstain, based on past observation.
  3.  **Preference for Conformity:** Indeterminate. Villagers prefer conformity only to avoid sanction, not due to intrinsic coordination benefit. Lewis requires a coordination problem where conformity itself is preferred given others conform; here, the preference is manufactured by penalty and false belief.
  4.  **Arbitrariness:** Satisfied. Any two-hour window would work identically as the original function is obsolete.
  5.  **Common Knowledge:** Not Satisfied. Villagers falsely believe others want the practice kept. Lewis requires common knowledge of the preferences sustaining the equilibrium, not just the behavior.

  Nadia correctly identifies that the preference condition implies a shared interest in the regularity itself, not just in avoiding penalty. Owen misstates the condition by treating sanction-avoidance as equivalent to coordination payoff. This weakens Owen's claim that the formal conditions are met, as the underlying preference structure is not common knowledge, violating the epistemic foundation of Lewis's account.

  **Move by move**

  1.  **Owen:** *Mistaken but pointing at something real.* He correctly identifies surface-level regularity and expectation but ignores the underlying preference structure required for a coordination problem. He treats sanctions as sufficient for the "reason to conform" condition without checking if the coordination problem exists independently of the sanction. To repair, he must address whether the sanction creates a coordination equilibrium or merely a prison's dilemma structure where conformity is coerced rather than coordinated.
  2.  **Nadia:** *Largely right.* She correctly spots the lack of shared interest in the regularity itself, which is central to Lewis's coordination problem. She risks overstating by saying "no one wants it upheld," ignoring that they want to avoid censure, which is a preference, albeit a negative one. To repair, she should distinguish between wanting the act versus wanting the equilibrium sustained by sanctions, clarifying that Lewisian conventions require the former.
  3.  **Owen:** *Even.* His conditional formulation mimics Lewis's logic accurately regarding conditional preference: if others conform, I prefer to. However, it begs the question by assuming the sanction makes the preference genuine in the Lewisian sense of solving a coordination problem. To repair, he must show why a preference driven solely by false beliefs about others' desires counts as coordination rather than mere compliance under misinformation.
  4.  **Nadia:** *Clearly right.* She identifies the crucial distinction between expectations of behavior driven by shared interest versus expectations driven by anticipated hostility. This aligns with Lewis's distinction between convention and norm enforced by penalty where the underlying act offers no mutual benefit. No repair needed; this is the strongest philosophical point in the exchange, hitting the core of the coordination requirement.
  5.  **Owen:** *Largely right.* Lewis does allow conventions of politeness where displeasure avoidance is the mechanism, so sanctions are not automatically disqualifying. However, politeness conventions usually involve shared interest in social smoothness, not universal secret hatred of the rule itself. To repair, he must show why this case resembles politeness rather than oppressive custom, perhaps by arguing the social bond itself is the coordination good.
  6.  **Nadia:** *Clearly right.* Stability under belief revision is a necessary implication of Lewis's common knowledge requirement. If the practice collapses when beliefs are corrected, it lacks the epistemic foundation of a convention, which must survive the knowledge that it is arbitrary. To repair, Owen would need to show a convention that survives belief revision about preferences, which this case explicitly fails to do.
  7.  **Owen:** *Mistaken but pointing at something real.* He is technically correct that stability isn't an explicit clause in Lewis's list, but it is implied by the common knowledge condition. His arbitrariness point is formally correct but functionally empty here because the alternatives are not live options for the agents. To repair, he must acknowledge that implicit requirements matter for the concept's utility and that formal arbitrariness without functional equivalence is insufficient.
  8.  **Nadia:** *Clearly right.* She captures the teleological point of Lewis's project: explaining order that works for participants. A practice that coordinates nothing and helps no one fails the explanatory purpose of the term "convention." To repair, Owen would need to argue that Lewis's account is purely behavioral, which contradicts the text's focus on reasoning and common knowledge as the basis for the regularity.

  **What both missed**

  Both students overlook the specific epistemic requirement of **Common Knowledge of Preferences**. Lewis requires not just common knowledge of behavior, but of the preferences that make the behavior rational. The villagers lack this; they operate on false beliefs about neighbors' desires. This violates the epistemic condition essential for a convention to be a solution to a coordination problem, as the equilibrium is not robust to information.

  Secondly, neither explicitly models the **Structure of the Payoff Matrix**. Lewisian conventions solve coordination games (multiple equilibria where parties prefer matching). This case resembles a Prisoner's Dilemma or Assurance Game distorted by misinformation. If the underlying payoff without sanctions is negative for all, it is not a coordination problem, and thus cannot yield a convention regardless of sanctions. Nadia hints at this with "coordinates nothing," but neither formalizes the game-theoretic distinction between a coordination equilibrium and a sanction-enforced norm.

  **Verdict**

  Nadia is more right overall, specifically on the failure of the common knowledge condition and the lack of a genuine coordination problem. The disagreement is substantive, concerning whether Lewis's account is purely behavioral or requires shared rational interest. The residue lies in whether sanctions can transform a non-coordination problem into a convention. A settling case would be a scenario where everyone knows everyone hates the rule but follows it solely due to threat; if Owen calls this a convention and Nadia does not, the definition of "reason to conform" is the final battleground. Nadia wins because Lewis's project explains how rational agents coordinate, not how they are trapped by error.
