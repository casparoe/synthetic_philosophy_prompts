answer: |-
  **Prediction:** She will oppose the repeal.

  **(a) Candidate Principles**
  Three distinct principles survive her nine rulings. First, the **Qualitative Threshold**: criminalization requires deep societal revulsion, not mere distaste or majority preference. Verdict 8 rules out simple majoritarianism, as a bare majority finding conduct "distasteful" is insufficient. Second, the **Institutional Integrity Principle**: the law protects key moral institutions (marriage, respect for the dead) even against private conduct. Verdict 1 (homosexuality) and Verdict 5 (grave desecration) rule out the Harm Principle, as both prohibit private acts causing no physical harm to others. Third, the **Normative Stability Principle**: the law reflects enduring moral truth rather than fluctuating opinion. Verdict 9 rules out dynamic legal moralism, as polling shifts alone do not justify legal change.

  **(b) Implications and Divergence**
  Applied to the repeal bill, these principles diverge. The **Qualitative Threshold** suggests supporting repeal: sponsors confirm the public feels only "mild queasiness," which Verdict 8 classifies as insufficient for criminalization. The **Institutional Integrity Principle** suggests opposing repeal: treating human remains analogizes to Verdict 5 (grave desecration), where privacy and consent were irrelevant to the moral breach. The **Normative Stability Principle** also suggests opposing repeal: Verdict 9 establishes that survey data cannot override established law merely by showing opinion shifts. The divergence lies between the *current intensity* of feeling (Threshold) and the *enduring status* of the moral norm (Stability/Integrity).

  **(c) Best Prediction and Ambiguity**
  The crucial ambiguity lies in her notion of the "reasonable member of the community." Is this figure an empirical proxy for actual public feeling, or a normative ideal whose reactions may outrun or lag the polls? If empirical, the surveys dictate repeal (queasiness < revulsion). If normative, the reasonable man *ought* to feel horror about treating remains as objects, regardless of current surveys.

  Verdicts 8 and 9 strongly support the **normative reading**. In Verdict 8, she insists the test is "not a head-count," separating legal justification from aggregate sentiment. In Verdict 9, she rejects polling shifts as insufficient grounds for change, implying the law tracks moral truth rather than opinion. Consequently, she will likely argue the surveys reflect moral decay rather than the true reasonable man's view. She will oppose repeal to maintain institutional integrity and stability, dismissing the "queasiness" as under-reported revulsion.

  **(d) Discriminating Hypotheticals**
  To discriminate among the surviving principles, consider two bills. First, a bill criminalizing a private ritual that 90% of the public approves of but which shocks the "reasonable man" ideal. The **Normative Stability** principle supports criminalization (truth > polls), while a strict **Qualitative Threshold** (if read empirically) would oppose it. Second, a bill repealing an offence where the public feels deep revulsion but the conduct causes no institutional harm (e.g., a specific private vice). The **Institutional Integrity** principle might oppose repeal (protecting morality itself), whereas a modified **Threshold** principle might support it if no institution is threatened. Her verdict on the first hypothetical would confirm whether she prioritizes the normative ideal over actual consensus.

  **(e) Hart-Style Objections**
  Hart-style objections bite hardest on the **Institutional Integrity Principle**, arguing that enforcing morality for its own sake violates individual liberty without preventing harm. On this bill, Hart would argue that consented treatment of remains harms no one and distresses no living person. None of her surviving principles can fully absorb this objection; the **Qualitative Threshold** limits the scope of enforcement but does not justify it where liberty is curtailed without harm. She must ultimately assert that liberty yields to the preservation of the society's moral fabric, a claim Hart rejects as conflating law with morality.
