      *   *However:* (c) provides a mechanism for *dissolution*. It is not an amendment of VII; it is the execution of a power *within* VII.
      *   *The Paradox:* If you use (c), you aren't changing VII. You are ending the legal existence of the entity governed by VII and starting a new one.
      *   *Does (b) block (c)?* No. (b) protects the *text* of VII from change. (c) allows the *society* to cease existing. If the Society ceases to exist, the Constitution ceases to apply. A new Society with a new Constitution is a different legal entity (or at least a new contractual arrangement).
      *   *The Catch:* (c) requires *every member then on the roll* to sign.
