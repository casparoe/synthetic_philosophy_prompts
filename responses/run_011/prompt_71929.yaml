      *   *Legal Principle:* This is "fraud on the constitution" or "substantive amendment via procedural trickery."
      *   *Risk:* Courts (or student union adjudicators) often look at substance over form. If the effect is to bypass VII(b), it might be ruled invalid.
      *   *Specifics:* If "member" is defined in Article I, amending Article I is allowed under VII(a). But if the *effect* is to neuter VII(b), it challenges the intent of the entrenchment.
