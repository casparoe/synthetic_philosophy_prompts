  *(Refining the "Dead Hand" point)*: In unincorporated associations, the "contract" is between *current* members. If all current members agree to change the rules, the old rules are gone by mutual consent. VII(b) tries to prevent this, but contract law generally allows parties to mutually rescind a contract. So VII(b) is arguably legally weak *if* unanimity is present. VII(c) just codifies the unanimity requirement for this specific action.

