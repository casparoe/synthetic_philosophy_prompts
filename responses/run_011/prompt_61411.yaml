answer: |-
  Your instincts are well-founded. While the passage is written with confidence, a specialist in the metaphysics of chance would identify several significant errors, conflations, and controversial claims presented as settled fact. The gloss conflates the *conceptual role* of chance with its *metaphysical nature*, misstates the logical form of the Principal Principle (PP), and makes false claims about the relationship between evidence and chance hypotheses.

  Below is an accuracy audit, sentence by sentence, addressing your specific questions.

  ### 1. Logical Form and the Admissibility Clause
  **Passage:** *"Lewis's Principal Principle says that chance is nothing over and above a constraint on rational belief: to say that the chance of A at a time is x is to say that a rational agent who learns this must believe A to degree x, whatever else she may know."*

  *   **Specialist Verdict:** **Misrepresentation.**
  *   **Analysis:** This gets the logical form wrong. The PP is not a constraint on what an agent must believe *after* learning the chance (categorical credence); it is a constraint on *conditional* credence. The standard formulation is $C(A \mid Ch_t(A) = x \& E) = x$, where $E$ is **admissible** evidence.
  *   **The Problem:** The phrase "whatever else she may know" is placed incorrectly here. In the actual principle, that phrase is restricted by the admissibility proviso. By stating the principle first as "whatever else she may know" and introducing the proviso later (in sentences 4–5), the gloss implies the proviso is an afterthought rather than a constitutive part of the principle's logical form.
  *   **What turns on this?** It matters immensely. If the principle held "whatever else she may know," it would be trivially false. If I know the coin landed heads (inadmissible evidence), my credence should be 1, even if the chance was 0.5. The gloss's initial formulation contradicts the proviso it introduces later.
  *   **Cite-ability:** Do not cite this sentence as a statement of the PP's logical form. It is technically incorrect.

  ### 2. "Subjectivist's Guide" and Objectivity
  **Passage:** *"This is what makes his paper a subjectivist's guide to objective chance — the objectivity in question belongs to the norms governing our credences rather than to the world."*

  *   **Specialist Verdict:** **Misrepresentation of Lewis's Metaphysics.**
  *   **Analysis:** Lewis titled his paper "A Subjectivist's Guide to Objective Chance" to indicate that subjective credence is our *guide* to accessing objective chance, not that chance *is* a norm. Lewis was a Humean Realist about chance. He believed chances are objective features of the world (specifically, they supervene on the mosaic of categorical particular facts via the Best System Analysis).
  *   **The Overreach:** The gloss suggests an anti-realist or expressivist view (that chance is *nothing over and above* a norm). Lewis explicitly argued that chance is a feature of the world that *constrains* norms. The objectivity belongs to the chance function itself (which is determined by the world's structure), not merely to the norms.
  *   **Cite-ability:** You can cite that Lewis intended the PP to connect subjective credence to objective chance. You cannot cite the claim that Lewis viewed chance as merely a norm rather than a worldly feature.

  ### 3. The Content of the Notion
  **Passage:** *"Nor is the Principle an extra assumption bolted onto some independent account of chance; it is the entire content of the notion, since whatever plays this belief-guiding role deserves the name."*

  *   **Specialist Verdict:** **Simplification / Conflation.**
  *   **Analysis:** This conflates *conceptual analysis* with *metaphysical reduction*. Lewis agreed that the PP captures the *concept* of chance (i.e., if a quantity doesn't guide credence this way, it isn't chance). However, he did not think the PP was the *entire content* of the notion in a metaphysical sense. The metaphysical content is provided by the Best System Analysis (BSA).
  *   **Nuance:** It is defensible to say the PP fixes the *role* of the concept. It is not defensible to imply there is no independent metaphysical account (like BSA) required to tell us which function *is* the chance function.
  *   **Cite-ability:** Acceptable as a claim about the *conceptual role* of chance, provided you clarify it does not replace the metaphysical account of what chance *is*.

  ### 4 & 5. The Admissibility Proviso
  **Passage:** *"The proviso is easy to state. Certain evidence is inadmissible, namely evidence about how the event in question actually turns out, for such evidence would show the chance to be one or zero and thereby destroy the chance hypothesis it accompanies."*

  *   **Specialist Verdict:** **Simplification.**
  *   **Analysis:**
      1.  **Scope:** Inadmissible evidence is not *just* evidence about the outcome. It includes any "crystal ball" information about the future that bypasses the chance process (e.g., time travel, prophecy).
      2.  **Reasoning:** The explanation ("show the chance to be one or zero") is slightly off. Inadmissible evidence renders the chance *irrelevant* to rational credence, not necessarily that it changes the chance itself. (Though on some views, future outcomes determine past chances, making the chance 1 or 0 retrospectively).
      3.  **Lewis's View:** Lewis defined admissibility roughly as "historical information up to time $t$." The gloss's definition is looser but captures the spirit for introductory purposes.
  *   **Cite-ability:** Acceptable as a rough heuristic, but imprecise for technical work.

  ### 6. Self-Undermining and the New Principle
  **Passage:** *"With the proviso in place the Principle is safe from the well-known worry that Humean chance hypotheses are self-undermining, and the so-called New Principle of Hall and Thau is nothing but the old Principle with the proviso folded into the chance operator; Lewis's account therefore required no revision."*

  *   **Specialist Verdict:** **Controversial / Likely False.**
  *   **Analysis:** This is the most contentious claim in the passage.
      1.  **Self-Undermining:** For Humeans, the chance function depends on the entire history of the world. Some possible futures ("undermining futures") would make the current chance function false. The Old Principle (OP) implies you should have credence in these futures, but believing in them undermines the chance function you are conditioning on.
      2.  **The New Principle (NP):** Hall, Thau, and eventually Lewis himself (in postscripts and later papers) acknowledged that the OP *cannot* be saved simply by tweaking admissibility. The NP changes the formula to account for the probability that the chance hypothesis is true.
      3.  **Lewis's Revision:** The claim that "Lewis's account therefore required no revision" is factually incorrect regarding Lewis's own bibliography. Lewis acknowledged the problem of undermining futures and agreed that the PP needed refinement (leading to the "Revised Principal Principle" or acceptance of the NP).
      4.  **Dispute:** While some philosophers (e.g., Strevens) have argued the OP can be defended, the consensus is that the NP (or a variant) is required for Humean chances. The gloss presents a minority view as settled fact.
  *   **Cite-ability:** **Do not cite.** This misrepresents the dialectic. Most specialists accept the NP (or Revised PP) is distinct from the OP and necessary for Humean supervenience.

  ### 7. The Two Consequences
  **Passage:** *"Two consequences follow. No evidence, of any kind, can ever count against a chance hypothesis. And a rational agent's credence in a proposition can never come apart from that proposition's chance."*

  *   **Specialist Verdict:** **Glaring Misrepresentations.**
  *   **Analysis:**
      1.  **"No evidence... can ever count against a chance hypothesis":** This is false. The PP tells you how to set credence *given* a chance hypothesis. It does not tell you how to set credence *in* the chance hypothesis. Empirical evidence (e.g., frequency data) absolutely counts for or against chance hypotheses. If a coin lands heads 1,000 times, that is evidence against the hypothesis $Ch(Heads) = 0.5$.
      2.  **"Credence... can never come apart from... chance":** This is false.
          *   **Ignorance:** If I do not *know* the chance, my credence will not match it.
          *   **Inadmissible Evidence:** If I see the coin land heads, my credence is 1, but the pre-toss chance was 0.5.
          *   **Irrationality:** An irrational agent's credence can come apart from chance.
  *   **Defensible Nearby Claims:**
      *   *Instead of Claim 1:* "Given a chance hypothesis, no *admissible* evidence can alter the credence prescribed by the principle."
      *   *Instead of Claim 2:* "For a rational agent with only admissible evidence and full knowledge of the chance function, credence matches chance."
  *   **Cite-ability:** **Do not cite.** These claims are demonstrably false in standard Bayesian epistemology.

  ### Summary for Your Work

  You are right to be suspicious. The passage appears to be written from a specific, somewhat idiosyncratic perspective that treats the Principal Principle as an analytic truth immune to empirical revision, and it downplays the technical problems (undermining) that motivated the New Principle.

  **What you can safely rely on:**
  *   The general idea that the PP connects objective chance to rational credence.
  *   The idea that Lewis viewed the PP as fixing the *concept* of chance (while noting he had a separate metaphysical account).
  *   The rough intuition behind inadmissibility (future outcome information bypasses chance).

  **What you should avoid or correct:**
  *   The claim that chance is *nothing over and above* a norm (Lewis was a realist).
  *   The claim that the Old Principle requires no revision (Lewis acknowledged it did).
  *   The claim that evidence cannot count against chance hypotheses (it can).
  *   The claim that credence never comes apart from chance (it does, with inadmissible evidence or ignorance).

  **Recommendation:** If you need to state the Principal Principle, use the standard formulation: $C(A \mid Ch_t(A) = x \& E) = x$, where $E$ is admissible. If you discuss the New Principle, acknowledge that it was developed specifically because the Old Principle struggles with Humean self-undermining, contrary to the gloss's assertion.
