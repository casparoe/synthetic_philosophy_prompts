  2.  **Deconstruct the Passage Sentence by Sentence:**

      *   *Sentence 1:* "Lewis's Principal Principle says that chance is nothing over and above a constraint on rational belief: to say that the chance of A at a time is x is to say that a rational agent who learns this must believe A to degree x, whatever else she may know."
      *   *Sentence 2:* "This is what makes his paper a subjectivist's guide to objective chance — the objectivity in question belongs to the norms governing our credences rather than to the world."
