      *   *Sentence 6:* "With the proviso in place the Principle is safe from the well-known worry that Humean chance hypotheses are self-undermining, and the so-called New Principle of Hall and Thau is nothing but the old Principle with the proviso folded into the chance operator; Lewis's account therefore required no revision."
      *   *Sentence 7:* "Two consequences follow. No evidence, of any kind, can ever count against a chance hypothesis. And a rational agent's credence in a proposition can never come apart from that proposition's chance."

  3.  **Evaluate Each Component against Specialist Consensus:**

      *   **Sentence 1 (Logical Form):**
          *   *Claim:* PP is a constraint on rational belief. Learning chance $x$ $\rightarrow$ Credence $x$, *whatever else she may know*.
          *   *Critique:* This is the classic mistake. PP is about *conditional* credence given admissible evidence, not categorical credence after learning. The phrase "whatever else she may know" is the definition of *inadmissibility*, but the gloss treats it as if *all* evidence is compatible with the PP constraint. It ignores the admissibility clause in the initial statement, pushing it to Sentence 4/5.
