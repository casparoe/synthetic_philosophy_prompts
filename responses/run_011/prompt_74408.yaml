answer: |-
  Friends, colleagues, family.

  Eleven years ago, I sat where you are sitting now, at a different funeral, and Nora leaned over from the pew. She was watching the speaker describe the dead man as a beacon of light who would guide us still. She turned to me and said that what people were offering was "a photograph being mistaken for a person."

  She had no patience for the standard register. She believed that when we speak about the mind, precision is a form of respect. So I will not tell you that she is watching us now. I will not tell you that she has gone on a journey, or that we are here to celebrate a legacy. I am here to tell you who she was, and what remains of that, without pretending the arithmetic adds up to comfort.

  Professionally, Nora held two lines that never bent. The first was that remembering is not playback. It is reconstruction. When you recall a moment, you are not opening a file; you are building a model under pressure from who you are now. The second was her objection to the idea that our minds extend into the world. She argued that a notebook, a phone, or a colleague can be coupled to a thinker in the tightest causal way without any of the cognition actually happening in them. Importance is not constitution. Just because you need something to think, does not mean that thing is part of your mind.

  She applied this rigor everywhere. She kept a tin of biscuits on her desk for visiting speakers. It remained unchanged for years, stale and sealed. She called it the control condition. And she once corrected a Nobel laureate's pronunciation of a colleague's surname to his face, then immediately turned to the air and apologized to the surname.

  She taught us to think this way. I remember a lab meeting where a graduate student, eager to please, offered a confident explanation for a data set. Nora didn't say it was wrong. She just leaned back and asked, "What would have to be true?"

  The student stalled. The room went quiet. She wasn't asking for a guess. She was asking for the conditions under which the guess could stand.

  I want to offer you a consolation today, and I need to submit it to that same question.

  There is a view, proposed by Douglas Hofstadter, that the self is a pattern rather than a thing—a loop that can be re-instantiated in different materials. It suggests that when someone who knew you well thinks of you, a thin version of you is present in their mind. It is an attempt to explain how someone can be gone and still here.

  But Nora spent her career arguing against this. She was right about the vehicles. Nothing of hers is running in my skull. No one in this room is now her. The coupling between her and her students was causal, not constitutive. Her own research rules out the comfortable version, since what we carry is not a copy but a construction, built under pressure from what each of us already is.

  To say she survives in us is to mistake the photograph for the person.

  But patterns are individuated differently from the stuff that realizes them. Nora insisted that the interesting questions about a mind are asked at the level where beliefs, jokes, and standards live. At that level, what she was can be re-instantiated. Imperfectly. In many divergent versions. In people who learned to think the way she made them think.

  That is not her continuing. It is her having been the kind of thing that leaves a re-instantiable shape.

  This concession costs us. A pattern re-instantiated in forty heads is not one person. It is forty drafts that disagree with one another. The reconstruction is lossy and biased toward what each of us needed. Keeping the draft accurate is labour rather than a fact about the world. We will have to work to remember her correctly, and we will not always agree on what correct means.

  So I turn her question back on this comfort I am offering. I look at the twelve former students along the back wall, and I look at her daughters in the front. I ask: What would have to be true?

  For this to be more than sentiment, it would have to be true that the work matters. That the labour of keeping the draft accurate is worth the cost. That affection can sustain a pattern even when the vehicle is gone.

  I do not know if that is true. I only know that when I think of the biscuits, and the apology to the surname, and the way she refused the first answer, I feel the shape of her mind pressing against my own. It is not her. But it is not nothing.

  We are left with the work, and with each other, and with the silence she would have respected.

  ***

  **Note to the Eulogist:**

  The concession does the least work at the pivot where I shift from "nothing of hers is running in my skull" to "what she was can be re-instantiated." A determined opponent in the back row would argue that I have quietly changed the subject from metaphysics to sentiment; I concede the metaphysical claim (she is not constitutively present) but then rely on the emotional weight of "affection" to carry the burden of survival. This is where a strict materialist would say I am smuggling the extended mind thesis back in under the guise of metaphor, claiming pattern survival without ontological commitment. You should be prepared for that specific critique from her former students.
