answer: |-
  The cryostat hummed, a low, bone-deep vibration that seemed to originate in the floorboards of the laboratory rather than the apparatus itself. Arthur leaned over the monitor, his reflection ghostly against the cascade of interference fringes. He was a man built of sharp angles and patience, thirty-eight years of chasing signals buried in noise having worn down his tolerance for metaphysics to a razor's edge.

  'It's not random,' Arthur said, tapping the glass. 'Noise is random. This is structured silence. The visibility drops only when we propose to actualise the condition set C. But the signal exists *before* we propose it.'

  Elena sat on a stool nearby, balancing a mug of tea on her knee. She was a philosopher of religion, brought in as a consultant when the physics refused to stay in its lane. 'That is precisely what one should expect if the Molinist picture is correct,' she said. 'The counterfactuals of creaturely freedom are true prior to the divine decree. Your machine is reading the truth value of "If Sarah were in circumstance C, she would freely choose X." It is reading what is true, not what is caused.'

  'True?' Arthur straightened up, rubbing his eyes. 'True in virtue of what? In my trade, Elena, a proposition doesn't float free. There must be a truthmaker. Some arrangement of matter, some field configuration, some state of affairs in the world's furniture that makes the statement true. Where is it? The circuit is superconducting. There's nothing there to ground a conditional about a woman who isn't even in the building.'

  'The Grounding Objection,' Elena nodded, taking a sip. 'You want a causal history for a truth that is logically prior to causality. But Arthur, if Sarah is truly free, her choice isn't determined by the circumstances. Therefore, the truth of what she *would* choose cannot be grounded in the circumstances themselves. Nor is it grounded in her actual choice, because in this instance, there is no actual choice. The truth is brute. It is part of the modal landscape God surveys before He creates.'

  Father Thomas, who had been standing by the liquid nitrogen dewar, stepped into the light. He was a Dominican, old enough to remember when theology still spoke to physics without whispering. 'And there lies the error,' he said softly. 'You both assume God looks out at a landscape of possibilities and picks the best one. You treat divine knowledge as a survey. But God does not read the future; He writes it. Not by coercion, but by motion.'

  Thomas moved to the whiteboard, wiping away a scattering of equations. 'In the Thomist view, there is no "middle knowledge" distinct from God's will. He knows what Sarah will do because He moves her will to do it, in a manner compatible with her freedom. Your machine, Arthur, is not reading a pre-existing truth. It is detecting the shadow of a divine motion that has not yet landed. When you try to actualise the circumstance, you interfere with the motion. The signal dies because you are attempting to usurp the role of the Prime Mover.'

  'So I'm breaking the machine by trying to use it?' Arthur asked, sceptical.

  'You are breaking the analogy,' Thomas corrected. 'God's providence is not a manipulation of variables based on data. It is the sustaining of the very being of the variables.'

  The door opened, and Sarah walked in. She was the subject of the study, a postdoctoral researcher who had volunteered for the behavioural trials after hearing the rumours. She carried a clipboard, but she didn't look at it. She looked at the interferometer.

  'You're talking about me again,' she said. It wasn't an accusation, merely an observation.

  'We are discussing the conditions of your freedom,' Elena said, gesturing to a chair. 'Please, sit.'

  Sarah remained standing. 'I've seen the printouts, Arthur. Page forty-two. "If offered the lead position on the fusion project under conditions of public scrutiny, Sarah would decline."'

  Arthur shifted uncomfortably. 'That was a simulation. We never offered it.'

  'But you know I would say no,' Sarah said. 'And because you know, you haven't offered it. You've given the position to David, because the machine says he'll accept. You are using my counterfactuals to manage the lab.'

  'It's efficient,' Arthur said, defending the protocol they had quietly adopted. 'We minimise conflict. We maximise output. If we know what you would freely choose, we can arrange the world so you choose what is best without ever having to be coerced. It's providence, in miniature.'

  'Is it?' Sarah walked to the console. She looked at the fringes, the shimmering bands of light and dark that represented her own unmade decisions. 'It feels like being hollowed out. If my "would-dos" are fixed truths that you can bank on, then what is left for me to do in the moment? When you offer me a choice, you already know the outcome. You aren't waiting for my answer. You're waiting for me to confirm your data.'

  'But you are still free,' Elena insisted. 'No one forces you. If we offered you the fusion lead, you could say yes. The machine would go silent, the records would become insufficient, as they always do when we test. But you wouldn't say yes. You *wouldn't*. That is your freedom.'

  'That is a cage,' Sarah said. 'A cage made of truth.'

  Thomas nodded slowly. 'She perceives the theological cost. If your knowledge is independent of your will, Elena, then Sarah is bound by a truth outside of God's creative act. She is fate-bound, not providence-bound. But if Arthur uses this knowledge to steer her, he treats her will as a fixed constant, like gravity. It reduces the person to a law of nature.'

  'I am not a law of nature,' Sarah said, her voice tightening. 'Last week, you arranged for me to find the error in the calibration data. You knew I would stay late. You knew I would look. You manipulated the lighting, the schedule, the coffee supply. All based on a printout. I found the error. I felt proud. But then I saw the log. You knew I would find it before I walked in the door.'

  'We created the circumstances for you to flourish,' Arthur said. 'Is it better to leave you to chance?'

  'It is better to leave me to myself,' Sarah replied. 'When you know what I would do, and you arrange the world so I do it, you remove the risk of my failure. But you also remove the weight of my success. If I cannot fail, because you have checked the printout and ensured the conditions match the success case, then I am not choosing. I am performing a script.'

  Elena leaned forward. 'But the script is written by you, Sarah. Not by us. The counterfactual is true because of *you*. Your nature, your character. We are merely respecting your integrity.'

  'You're exploiting it,' Sarah countered. 'If you know I would freely refuse a bribe, you don't need to guard the safe. You just need to know I'm me. But if you know I would freely snap under stress, and you keep me away from stress, you aren't protecting me. You're pruning me. You're keeping me in the state where the printout remains valid.'

  Arthur looked back at the screen. The fringes were stable. 'The signal is still there. The truth persists. That suggests the grounding is real, even if we can't locate it physically.'

  'Or,' Thomas said, 'it suggests that you are measuring the stability of your own expectation, projected onto a quantum system. You are seeing your own desire for order.'

  'No,' Arthur said firmly. 'I've spent a lifetime distinguishing signal from wishful thinking. This is signal. The question is, what do we owe the signal? If we have the power to prevent suffering by arranging circumstances based on these readouts, do we have a moral obligation to use them? If I know Sarah would be miserable in London, and I can assign her to Cambridge without her knowing why, have I done wrong?'

  'You have treated her as a means,' Thomas said. 'Even if the end is her happiness.'

  'I have treated her as herself,' Elena corrected. 'I have honoured her counterfactual identity.'

  Sarah walked over to the cryostat. She placed her hand on the metal casing, though there was no warmth to feel. 'There is something else,' she said quietly. 'When I look at the printouts... I feel known. Not observed. Known. In a way that makes the actual choice feel like an echo. Like the real decision happened somewhere else, in some logical space before I was born, and now I'm just acting it out in time.'

  She turned to face them. 'If I agree to let you use this... if I let you arrange my life based on what I *would* do... do I cease to be the author of what I *do*?'

  The room was silent, save for the hum of the cooler. Arthur looked at the data, Elena at her tea, Thomas at the ceiling.

  'We cannot know,' Arthur said finally. 'The machine goes silent when we test. We can never verify the actualisation without destroying the knowledge.'

  'Then we are flying blind,' Sarah said. 'Using a map that vanishes when we touch the terrain.'

  'Perhaps that is the point,' Thomas murmured. 'Faith requires the absence of the sight. You are trying to turn providence into a technology. It will not hold.'

  'But it works,' Arthur insisted, pointing to the fringe visibility. 'Look. It works.'

  Sarah looked at the screen. The bands of light shimmered, beautiful and terrible. 'It works,' she agreed. 'But I don't know if I'm still here.'

  She turned and walked to the door. 'Don't assign me to Cambridge. I'll decide tomorrow. Without the printout.'

  She left. The door clicked shut. The hum of the interferometer continued, steady and indifferent, measuring the shape of a choice that would never be made, in a world that was already decided.

  ***

  **Note on the Metaphysics**

  Molinism posits three logical moments in divine knowledge: Natural (necessary truths), Middle (counterfactuals of creaturely freedom), and Free (God's decree of the actual world). It is common ground among critics and defenders that Molinism seeks to reconcile exhaustive divine foreknowledge with libertarian freedom.

  However, several claims remain fiercely contested. The **Grounding Objection** (voiced by Arthur) is the primary philosophical critique: if counterfactuals are true prior to God's decree and independent of the creature's actual existence, what makes them true? Molinists (like Elena) often argue they are brute truths grounded in the creature's essence, but critics deny essences can ground specific conditionals. The story assumes the machine can access these truths directly, a liberty Molinists would reject; *scientia media* is divine, not extractable by created intellects without compromising the contingency of the future.

  The **Dominican Alternative** (Thomas) relies on Physical Premotion. Thomists deny Middle Knowledge, arguing God knows futures because He causally moves the will to them freely. This is often mistaken for determinism by opponents, but defenders insist it preserves freedom compatibly. The story presents this as a live dispute, not a settled refutation.

  Finally, the **Freedom Objection** (Sarah) questions whether being circumstanced based on known counterfactuals compromises autonomy. Molinists argue it does not, as the agent could do otherwise in those exact circumstances (the power of contrary choice remains), even if they wouldn't. Critics argue this renders freedom merely psychological. The story leaves this unresolved, as it remains a central tension in contemporary analytic theology.
