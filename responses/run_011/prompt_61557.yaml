  She refused to file solitary figures. Every forecast in her log held a set of values, and in the margin she wrote a line explaining why the gap between them sat where it did. Not a hedged figure, but a genuine interval held open on purpose. She had a phrase for that gap, coined it herself, and many in this room will recognize it on contact: she called it the honest part. Declining to collapse a range into a midpoint is a discipline, not a failure of nerve. The pressure to collapse is social rather than evidential. People want a figure because a figure can be quoted in a briefing, not because the evidence supports it. To give a solitary number is to offer comfort to the listener, not truth to the record. She chose the record.

  There is a harder truth she lived by. She several times watched an interval widen after she learned something she had not known before. She never committed herself in advance to matters being independent, and so new information could legitimately make her less resolved about a question she thought she had already settled. She treated that as a result and not as an embarrassment. This is the part of her view that even sympathetic audiences find hardest to swallow. We expect knowledge to narrow the world. She accepted that knowledge sometimes expands the unknown.

  Consider that season when the river rose. Her interval for the water level ran from below the floodwall to over it, and the decision threshold sat inside that interval rather than outside it. In her log, she wrote 14.2 and 18.9. She recommended evacuation, the water did not come, and the town was furious for the better part of a year. She has never said she was right to call it. She has only said, in the same sentence each time, that she would call it the same way, and that the alternative was to pretend the interval was narrower than it was so that a worse outcome could not be laid at her door. I will not settle that story for you. Time has not proved her correct. The anger was real. The dry streets were real. Her stance remains that honesty outweighs the safety of a narrow prediction.

  There is an objection she answered for decades: that a belief state which cannot be reduced to a point either does no work at all when it comes time to act, or, the moment you adopt some rule for acting under it, quietly turns back into a point estimate with extra steps. The evacuation was the answer. Action happened. The range remained. You can move people out of a valley without pretending you know exactly where the water will stop. The decision was not a collapse of the forecast; it was a response to the spread. To act is not to resolve. To protect is not to pretend.

  She kept a heavily annotated copy of Walley's book on her desk for decades and would not let anyone borrow it. I suspect the margin notes constitute a separate language, and she was the only fluent speaker.

  So where does this leave us? A conventional closing collapses to a solitary verdict about the person. She was the most honest colleague I ever had, that sort of thing. That closing move is precisely the thing she spent her life arguing against, so I cannot make it in front of her. I will say this instead. Her character stays open at the top and the bottom. It lands as devotion rather than as hedging. We do not honor her by narrowing her down. We honor her by accepting that the map is not the territory, and that the space between the marks is where the work lives. We raise a glass to the space between the figures, and to the person who kept it open.

  ***

  The first idea landed in the opening section by framing the range as social discipline rather than evidential weakness, keeping the sister engaged by avoiding jargon and focusing on "comfort versus truth." The second idea landed in the evacuation episode, showing action occurring without collapsing the belief, which kept the emergency managers with me by validating their difficult decisions without simplifying the forecast. The third idea landed before the episode by describing widening intervals as a result of learning, which kept the philosophers engaged while remaining accessible to the family through the metaphor of knowledge expanding the unknown.
