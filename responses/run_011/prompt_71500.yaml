  **CLARITAS MEDIATION SERVICES**
  **Client Prospectus: Part II**

  **Welcome to Objective Resolution**
  At Claritas, we understand that separation is difficult. Negotiation often devolves into emotional posturing, where the loudest voice prevails over the fairest outcome. We offer a sanctuary from uncertainty. Our mediators do not negotiate. They do not advise. They calculate. By adhering strictly to an axiomatic bargaining solution, we remove human bias from the division of assets, custody, and future obligations. The outcome is not argued; it is read.

  **Our Axiomatic Standard**
  Our calculations rely on four pillars of fairness, accepted as mathematical truth. First, *Pareto Efficiency*: we ensure no value is left on the table. Second, *Symmetry*: identical claims yield identical results. Third, *Scale Invariance*: whether you measure value in dollars, hours, or emotional units, the ratio remains constant. Finally, *Monotonicity*: if your potential best-case scenario improves while your partner's remains static, your settlement cannot worsen. 

  Most firms rely on the Nash standard, which includes the Independence of Irrelevant Alternatives. Claritas rejects this on grounds of conscience. We believe context matters. Removing options from the table changes the moral landscape, and our model respects the integrity of every available path.

  **The Geometry of Fairness**
  Clients often ask how the final number is found. The process is visual. First, we establish the *Disagreement Point*—the reality should you fail to agree. Next, we identify the *Ideal Point*—the maximum achievable utility for each party within the feasible set. We draw a straight line from the Disagreement Point to the Ideal Point. Where this line intersects the boundary of possible outcomes, there lies your settlement. It is the unique point of proportional gain. It is inevitable.

  **Preparation and Intake**
  To ensure the calculation runs smoothly, certain parameters must be fixed before the session. Please note that Claritas specialists determine the Disagreement Point based on the credibility of threats presented during intake. It is vital that your leverage—litigation costs, custody precedents, public exposure risks—is documented clearly. 

  Additionally, utility calibration is performed by our staff. Since personal satisfaction is subjective, our analysts will normalize your valuation metrics against market standards. This ensures that one party's sentimental attachment to a property does not distort the arithmetic of the frontier.

  **What to Bring**
  *   Certified documentation of all assets and liabilities.
  *   Evidence of credible threats (legal counsel letters, prior restraining orders, media contacts).
  *   A personal valuation index for non-liquid assets (heirlooms, pets, intellectual property).
  *   Two forms of identification.

  **Client Testimonial**
  *"Before Claritas, we fought for months over who loved the children more. The mediators didn't care about love. They cared about the utility functions. Once they calibrated my husband's earning potential against my caregiving hours and set the disagreement point based on his lawyer's aggression, the answer was immediate. It felt cold, but also like a relief. The math couldn't be bullied."* 
  — Sarah J., Verified Client

  **Contact Us**
  Schedule your calibration session today. Leave the conflict to us; we leave the rest to the axioms.
