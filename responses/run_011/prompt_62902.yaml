prompt: |-
  You are a philosopher specializing in free will and moral responsibility, with long experience of the Frankfurt-case literature and its objections. Think carefully, and begin with a brief brainstorming note (five sentences at most) comparing candidate trigger structures and saying which one can satisfy all the constraints below; only then write the case.

  Task: construct a Frankfurt-style counterexample to the principle of alternative possibilities meeting every one of these specifications.

  1. **Realism.** No surgery, no implants, no drugs, no exotic technology. The counterfactual intervener is an ordinary person using ordinary resources — surveillance, a schedule, a credible threat. Setting: an office or a household, one paragraph, no trolleys.
  2. **Transparency.** The agent knows the intervener exists, knows exactly what triggers intervention, and knows when the deadline falls. The case may not depend on the agent's ignorance.
  3. **Necessity.** Show that the act occurs whatever the agent does, in the sense of "could have done otherwise" that the principle requires — not merely that the alternatives are unpleasant.
  4. **A live flicker.** Leave the agent at least one alternative possibility that a defender of the principle could plausibly claim is robust (more than a bare prior sign or an involuntary twitch), so that the case does not settle the debate by stipulation.

  After the scenario, do the check:

  - State which alternative possibilities actually remain, and assess each for robustness.
  - Say whether your case is a genuine Frankfurt case or collapses into ordinary coercion, and identify the structural feature that decides this — roughly, whether the intervener's mechanism bypasses the agent's deliberation or merely attaches a cost to it. Say what happens to the case if that feature is removed.
  - Explain how someone pressing the standard dilemma (either the trigger is a prior sign, in which case the agent can do otherwise, or it is not, in which case the act is not the agent's own) would attack your construction, and what minimal revision would answer them.
  - Note honestly where you bent a specification.

  No citations or bibliography — I will supply the references myself.
