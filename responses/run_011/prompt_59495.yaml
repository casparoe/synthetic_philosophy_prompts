  2.  **Deconstruct the ZKP Mechanism for a Low-Tech Setting:**
      *   *Classic Example:* The Ali Baba Cave (round tunnel with a door). To prove you know the password, you enter one side, the verifier shouts which side to exit from. If you know the password, you can always exit the requested side. If you don't, you have a 50% chance. Repeat 20 times, chance drops to negligible.
      *   *Adaptation:* Needs to be physical, ritualistic, but clear enough for the reader to follow the probability decay.
      *   *Idea:* A sealed room with two doors? A box with two compartments?
      *   *Selected Mechanism:* The "Two-Path Courtyard." A central chamber with two exits (North and South). The secret allows passage through a hidden barrier between them.
      *   *The Ritual:*
          1.  Custodian enters the chamber.
          2.  Official randomly chooses a exit (North or South) *after* Custodian is inside.
          3.  Custodian must emerge from that specific exit.
          4.  If Custodian knows the secret (the passage), they can always comply.
          5.  If not, they must guess which exit the Official will pick before entering, or hope the Official picks the one they entered. 50% chance per round.
      *   *Repetition:* Do this many times (e.g., ten times). Probability of luck = (1/2)^10 = 1/1024. Good enough for conviction.
      *   *The Transcript:* The official writes down: "Round 1: Entered West, Exited North. Round 2: Entered West, Exited South..."
      *   *The Forgery:* A forger who doesn't know the secret can simulate this transcript easily. They just write down random pairs that match. They don't need to know the secret to write "Exited North" after "Entered West" if they are just fabricating the record after the fact. Wait, the transcript records the *challenge* and the *response*.
      *   *Refinement on Transcript:* The transcript records: "I shouted North. He came out North." A forger can write that down without knowing the secret because the forger wasn't there. The forger can generate a list of "Challenge: North, Response: North" arbitrarily. The transcript proves nothing to someone who wasn't there to ensure the challenge was random *before* the response happened.
      *   *Wait, ZKP nuance:* The transcript is worthless because the Prover and Verifier could have colluded to produce the transcript. Or, more accurately, the Verifier could have just written down a successful run without it happening. In the interactive setting, the Verifier *knows* they chose randomly. In the static setting, the Verifier could have pre-written the successful outcomes.
      *   *Story Logic:* The official writes down what happened. The clerk says, "You could have written this without going there." The official says, "But I was there." The clerk says, "This paper doesn't show that."

  3.  **Drafting - Section by Section:**

      *   **Title:** *The Weight of Air* or *The Silent Courtyard* or *The Ten Turns*. Let's go with *The Ten Turns*.
      *   **Setting the Scene:** The Official (Elias) arrives at the Order (The Keepers of the Name). The High Custodian (Old Man/Tomas).
