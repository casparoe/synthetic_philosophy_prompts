      *   **The Climax:** Kael shows the scroll is replicable without knowledge.
      *   **The Ending:** Elias holds the truth, alone.

  4.  **Writing - Focus on Tone and Constraints:**
      *   Avoid "proof," "verify," "probability," "zero-knowledge."
      *   Use words like "trial," "witness," "chance," "record."
      *   Keep the ritual concrete.
      *   Ensure the word count is within 1200-1800.
