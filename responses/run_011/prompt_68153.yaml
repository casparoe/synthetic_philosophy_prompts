  **Note**

  This poem uses a pantoum, a form where lines repeat in a specific pattern. Here, the repetitions mimic how arguments about population return across generations. When a line reappears, its context has changed, altering its meaning without changing a word. For instance, waiting for famine shifts from expectation to question. This structure mirrors the history of Malthus's theory: the same logic resurfaces, yet technology and behaviour shift the ground beneath it. It asks whether the delay proves error or only patience.

  Regarding the verdict, the poem leans towards the idea that the theory was right but merely early. The final line returns to the first, suggesting the cycle continues. While innovations like fertiliser and market wagers delayed the crisis, the fundamental constraint remains written in the opening image. The model did not fail; the timeline simply stretched beyond the author's horizon, leaving us still waiting to see if the grain finally runs out.
