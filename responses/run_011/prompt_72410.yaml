answer: |-
  The machinery of Harsanyi's aggregation theorem operates on a specific ontology of preferences. It assumes individuals possess utility functions that satisfy the von Neumann-Morgenstern axioms, that these utilities are cardinal and unit-comparable, and that the social welfare function preserves these rationality conditions while respecting Pareto efficiency. When you place the city of Omelas into this machinery, the first friction appears not in the arithmetic of the sum, but in the definition of the terms being summed. The story stipulates that the citizens' happiness is not merely coincident with the child's misery but causally and constitutively dependent upon it. In the language of social choice, this violates the assumption of separability or independence required for a clean additive representation. If individual utility $U_i$ is a function of the child's state $C$, such that $U_i = f(X_i, C)$ where $X_i$ is private consumption and $C$ is the child's suffering, then the social welfare function $W = \sum U_i$ implicitly counts $C$ multiple times—once negatively in the child's utility and $N$ times positively in the citizens' utility. The theorem assumes the social state can be evaluated by summing independent evaluations; Omelas presents a world where the evaluations are structurally entangled. The additive form still mathematically represents the outcome, but it ceases to represent a aggregation of *independent* moral claims, becoming instead a single, monolithic function where the child's variable is a parameter for everyone else's joy.

  Regarding the Pareto condition, the story presents a hard constraint: releasing the child destroys the prosperity of all. If we define the relevant population to include the child, there is no feasible alternative that makes at least one person better off without making someone else worse off. The child gains freedom; the citizens lose their utopia. Thus, the Pareto principle is inapplicable because there is no Pareto-superior move available within the feasible set. The theorem ranks orderings, but it requires at least two comparable states to function. If the choice is between "Utter Misery for One + Utopia for Many" and "Moderate Mediocrity for All" (which the narrator explicitly denies is possible), the theorem could rank them. But if the choice is between "Utopia + Torture" and "Ruin + Freedom," and the citizens prefer the former, the theorem validates their preference. The objection, therefore, is not that the theorem ranks incorrectly, but that the feasible set has been rigged to exclude the option the moral intuition demands. This shifts the critique from the aggregation rule to the constraints of the model itself.

  Harsanyi's impartial-observer gloss suggests ethical preferences are those formed behind a veil of ignorance, where one imagines having an equal probability of being any person in the society. Omelas inverts this device. The citizens do not imagine themselves as the child; they are shown the child and know with certainty they are not it. The veil is not just lifted; it is replaced by a guarantee of exclusion. The "impartial observer" would presumably reject the bargain because the risk of being the child outweighs the utility of being a citizen. The citizens of Omelas accept the bargain precisely because the risk is zero. This suggests the story attacks the informational basis of the theorem: rational aggregation requires uncertainty about identity to generate impartiality, but Omelas is a system built on the certainty of identity. If you introduce a Rawlsian objection here, it does significant work: it argues that the decision rule governing the choice is not expected utility maximization (which Harsanyi defends) but maximin (which Rawls defends). However, the story goes further than Rawls by suggesting that even if the citizens *could* be the child, the bargain itself is tainted.

  The ones who walk away operate outside the theorem's boundary conditions. They do not propose a new social state to be ranked; they reject the ranking itself. In formal terms, they declare the choice set incomplete or the preference relation undefined for the given options. By leaving, they exit the population $N$ over which the sum is calculated. Their departure is a denial of the framing that there is a single social state to be ranked. If the model assumes a closed system, their exit is an error term; if the model allows for exit, their action reveals that the utility function for some agents includes a term for "non-participation in evil" that outweighs "utopian happiness." The narrator's remark that the place they go may not exist renders their option incoherent within a standard rational-choice framework, where outcomes must have defined probabilities and utilities. Instead, their walk is an appeal to a value outside the model—a refusal to maximize within a corrupted system. It is not a refusal to rank, but a refusal to accept the variables provided.

  Treating the narrator as a modeler reveals the story's strength. By inviting the reader to fill in details ("Omelas" sounds like "Melas," the festival details are vague), the narrator constructs a family of models rather than a single counterexample. This vagueness protects the story from empirical objections. If you argue that a real city couldn't function this way, the narrator concedes the point and asks you to imagine one that does. This makes the story a stronger counterexample because it isolates the logical structure of the bargain from contingent sociological facts. It forces the critique to address the moral axiom, not the engineering feasibility. However, this vagueness also strains the social-choice lens. If the details are fluid, the utility functions are ill-defined. The story works best not as a test of the aggregation theorem, but as a test of the legitimacy of the utility inputs.

  This brings us to where the reading strains. Le Guin acknowledged her debt to William James, whose formulation focused on the moral guilt of accepting a happiness bought with another's pain. James's objection is deontological: the transaction itself is forbidden, regardless of the sum. Harsanyi's theorem is consequentialist: it cares only about the satisfaction of preferences. If the story is about the acceptability of a bargain rather than the representation of a social ordering, then the social-choice lens is indeed a Procrustean bed. The theorem asks, "Given these preferences, what is the social welfare?" The story asks, "Are these preferences admissible?" The theorem has no mechanism to filter out preferences derived from sadism or complicity, provided they are consistent. Thus, the story attacks the premises of admissibility, which the theorem takes as given.

  Your variant, where the child's misery is not a condition for joy but merely ignored, changes the logical structure. In the original, the utility functions are non-separable; the citizens' joy *requires* the child's pain. In the variant, the utility functions are separable, but there is a negative externality that is ignored. The original Omelas is the stronger objection because it corrupts the source of the utility. If the joy is independent, the problem is distributional and can be solved by compensation or coercion. If the joy is dependent, the utility itself is morally tainted. The difference shows that the story's force comes from the non-separability. It demonstrates that aggregation fails not when sums are unequal, but when the terms of the sum are mutually destructive.

  Finally, the story contributes what the argument cannot: the phenomenology of acquiescence. The theorem deals in orderings; the story deals in the silence of the adolescents who go home and weep, and never speak of it again. It captures the psychological cost of integrating a moral contradiction into a life. No representation theorem has a place for shame, or for the specific quality of the silence that follows the acceptance of a necessary evil. The theorem can tell you that the city is optimal; the story tells you what it feels like to live in the optimum.

  | Assumption | Status in Omelas | Deciding feature | Consequence for the reading |
  | :--- | :--- | :--- | :--- |
  | Cardinal and Interpersonally Comparable Utility | Satisfied | The narrator explicitly weighs the city's joy against the child's misery as a single trade-off. | The mathematical machinery of the theorem can operate, making the moral rejection of the result more stark. |
  | Pareto (Unanimity) Condition | Violated | Releasing the child helps the child but harms every citizen; no move improves one without hurting another. | The theorem cannot recommend a change; the objection must target the feasibility constraints or the initial endowment. |
  | Anonymity (Equal Weights) | Satisfied | The child's misery is weighted equally in the sum, but outweighed by the magnitude of the many. | The injustice is not in the weighting but in the aggregate outcome, challenging the sum itself rather than the weights. |
  | Independence / Separability | Violated | Citizens' happiness is causally dependent on the child's suffering; utilities are not separately specified. | The additive representation masks the structural entanglement, suggesting the theorem's form misrepresents the moral reality. |
  | Impartial-Observer Gloss | Inapplicable | Citizens know with certainty they are not the child; the veil of ignorance is replaced by certainty of exclusion. | The rational choice for a citizen is to stay; the moral choice requires rejecting the rationality of the self-interested observer. |
  | Walkers' Exit | Indeterminate | The walkers leave the defined choice set for a destination that may not exist. | This represents a refusal of the model's completeness, asserting an option outside the defined social states. |

