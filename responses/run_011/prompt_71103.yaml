  **Question 1**
  Ramsey charged that Keynes relies on an unexplained intuition of probability relations that neither guides belief revision nor shows up in choice. Does your reconstruction escape this by making weight a claim about evidence stability rather than intuitive apprehension?
  *   **Likely Answer:** Yes, it escapes because stability is calculable from evidence relations, not intuition.
  *   **Follow-up:** Regardless of whether you claim escape or inheritance, does calculating stability not require the very probability assignments Ramsey thought were the only measurable things?

  **Question 2 [Audience Question: Historian of Philosophy]**
  A historian here argues that defining weight as expected change in credence contradicts Keynes's insistence that probability relations hold strictly between propositions and are apprehended rather than estimated. How do you reconcile your empirical stability metric with Keynes's logical relation ontology?
  *   **Likely Answer:** Keynes evolved his view, or the logical relation implies stability conditions.
  *   **Follow-up (If evolved):** Does this not concede that the *Treatise* account is incompatible with his later work?
  *   **Follow-up (If implies):** How does a logical relation entail empirical stability without collapsing logic into psychology?

  **Question 3**
  Consider a symmetric prior on a coin versus a large sample from machines calibrated by one operator; the former is stable but thin, the latter fragile but data-rich. How does your account distinguish the high weight Keynes would assign to the large sample from the stable but ignorant coin prior?
  *   **Likely Answer:** By defining relevant evidence to include structural dependencies, not just sample size.
  *   **Follow-up:** Does introducing structural dependencies not risk collapsing weight into a judgment about model specification rather than evidence quantity?

  **Question 4**
  Your definition hinges on evidence the agent could plausibly acquire, but plausibility varies wildly between a novice investor and a central banker. Whose perspective determines the set of possible evidence that defines the weight of a given argument?
  *   **Likely Answer:** It is relative to the agent's epistemic situation, not an absolute standard.
  *   **Follow-up:** How can an agent-relative metric serve as the objective critique of macroeconometric models Keynes intended in his policy debates?

  **Question 5**
  If weight is the expected change in a judgment under further evidence, it seems computable from probabilities themselves, rendering it redundant alongside hierarchical models. What work is this concept doing that a standard value-of-information calculation cannot already do?
  *   **Likely Answer:** It captures the resilience of the probability estimate itself, not just the expected utility of information.
  *   **Follow-up:** If resilience is derived from the probability distribution, haven't you just renamed a second-order probability?

  **Question 6 [Audience Question: Bayesian]**
  A Bayesian in the room suggests that ambiguity aversion plus a well-specified model captures all decision-relevant uncertainty, making Keynes's weight surplus to requirements. Why should a decision-maker care about weight if their utility function already penalizes instability?
  *   **Likely Answer:** Because standard ambiguity aversion models cannot capture the specific defect in resilience Keynes identified.
  *   **Follow-up:** Can you specify a choice problem where weight dictates a different action than ambiguity aversion would, without smuggling weight back into the probability set?

