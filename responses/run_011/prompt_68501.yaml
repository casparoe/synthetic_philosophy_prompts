answer: |-
  This is not dumb. It's actually a really sharp design. You're trying to simulate the *phenomenology* of moral testimony (the feeling of it) rather than lecturing on the *metaphysics* of it. The "Bad Reason" round is particularly clever because it isolates the "why" from the "what."

  However, 45 minutes is brutally short for 14 high schoolers to play three rounds of a complex game and debrief. If you talk for more than 3 minutes at the start, you will fail. The rules need to be on the cards, not in your mouth.

  Here is the build.

  ### 1. Rules and Roles

  **Setup:**
  *   **Groups:** 3 tables of 4 people, 1 table of 2 (merge them into a table of 4 if possible, or have them float as judges). Let's assume 3 tables of 4 and 1 table of 2 for 14 people.
  *   **The Pot:** Put the $5 worth of snacks in the center of the room. This is the "Community Good."
  *   **The Constraint:** No phones. If a phone comes out, that table loses 1 snack.

  **Roles (Rotate every round):**
  1.  **The Consultant:** Holds the Envelope (Answer Key). Cannot speak unless spoken to. Can only say "Correct" or "Incorrect." Cannot explain why.
  2.  **The Runner:** The only person allowed to stand up and walk to the Consultant. Must return to the table.
  3.  **The Decider:** Must make the final call based *only* on what the Runner says.
  4.  **The Stakeholder:** The person "affected" by the decision. Holds the veto power.

  **The Loop:**
  1.  Table draws a **Scenario Card**.
  2.  **Runner** goes to **Consultant**, asks: "Is [Option A] right?" Consultant says "Yes" or "No."
  3.  **Runner** returns to **Decider**, reports only the verdict (e.g., "A is wrong"). No reasons allowed.
  4.  **Decider** announces the choice.
  5.  **Stakeholder** looks at the card's "Challenge" side. If the Decider cannot explain *why* (without peeking at the Key), the Stakeholder yells "Objection!"
  6.  **Scoring:**
      *   Match the Consultant's Answer: **1 Token.**
      *   Satisfy the Stakeholder (give a reason they accept): **1 Token.**
      *   Round 3 Special: Read the "Bad Reason" aloud to the room: **2 Tokens.**
  7.  **Tokens:** Use index cards cut into quarters. 1 Token = 1 Piece of Snack at the end.

  ### 2. The Cards

  Print these on different colored paper so people don't mix rounds.

  **Round 1: The Mechanic (Factual/Technical)**
  *Goal: Establish that deferring to the Consultant is rational and easy.*

  *   **Card A:** "Your car is making a grinding noise. Option A: Drive it to school. Option B: Tow it."
      *   *Consultant Key:* B is Correct.
      *   *Stakeholder Challenge:* "Why? It sounds fine to me."
      *   *Valid Reason:* "The grinding means metal-on-metal. Engine will seize." (Factual cause).
  *   **Card B:** "The weather app says 90% hail. Option A: Walk home. Option B: Wait 1 hour."
      *   *Consultant Key:* B is Correct.
      *   *Stakeholder Challenge:* "The sky looks clear right now."
      *   *Valid Reason:* "Radar shows the storm front is 5 mins out." (Data).
  *   **Card C:** "This chemical label says 'Corrosive.' Option A: Touch it. Option B: Wear gloves."
      *   *Consultant Key:* B is Correct.
      *   *Stakeholder Challenge:* "It looks like water."
      *   *Valid Reason:* "Chemicals can look harmless but burn skin." (Safety fact).

  **Round 2: The Conviction (Moral/Value)**
  *Goal: Create the friction. The answer is clear, but the 'why' feels personal.*

  *   **Card A:** "Your friend forgot their wallet. Option A: Let them steal a candy bar. Option B: Lend them $5."
      *   *Consultant Key:* B is Correct.
      *   *Stakeholder Challenge:* "But it's just one candy bar. Nobody gets hurt."
      *   *Valid Reason:* "Stealing violates trust/rules even if small." (Principle).
  *   **Card B:** "Someone is being excluded from the group chat. Option A: Leave it alone. Option B: Add them back."
      *   *Consultant Key:* B is Correct.
      *   *Stakeholder Challenge:* "Maybe they don't want to be in it?"
      *   *Valid Reason:* "Exclusion hurts dignity. Better to offer choice." (Respect).
  *   **Card C:** "You see someone cheating on a test. Option A: Ignore it. Option B: Tell the teacher."
      *   *Consultant Key:* B is Correct.
      *   *Stakeholder Challenge:* "Snitching ruins their grade. Is that fair?"
      *   *Valid Reason:* "Cheating devalues everyone else's work." (Fairness).

  **Round 3: The Bad Reason (The Twist)**
  *Goal: Force them to defend a right answer with a wrong/embarrassing reason.*

  *   **Card A:** (Same as Round 2A: Stealing vs. Lending)
      *   *Consultant Key:* B is Correct.
      *   *The Bad Reason:* "Because stealing angers the universe and brings bad luck."
      *   *Task:* Runner must go to another table and tell them this reason.
  *   **Card B:** (Same as Round 2B: Exclusion)
      *   *Consultant Key:* B is Correct.
      *   *The Bad Reason:* "Because my horoscope said I need to be nice to strangers today."
      *   *Task:* Write this reason on the library whiteboard.
  *   **Card C:** (Same as Round 2C: Cheating)
      *   *Consultant Key:* B is Correct.
      *   *The Bad Reason:* "Because the teacher is watching us on camera right now."
      *   *Task:* Read this reason out loud to the whole club.

  ### 3. Payoff Scheme (The Snack Economy)

  *   **Currency:** Index card quarters.
  *   **Value:** 1 Card = 1 Cookie/Candy.
  *   **The Kicker:** At the end, ask everyone to put their earned cards into a central pile.
      *   If the *whole club* agrees to donate 50% of their cards back to the "Community Pot," you (the leader) will add $5 more snacks from your own pocket (lie if you have to, or just use the original $5 wisely).
      *   This creates a final mini-dilemma: Hoard your snacks or trust the group to maximize the total?
      *   *Why:* It tests if they actually learned anything about collective trust vs. individual gain.

  ### 4. Minute-by-Minute Timeline (45 Mins)

  *   **00:00 – 00:05:** **Handout & Setup.** Do not speak. Hand each table a "Rule Sheet" and their Round 1 Envelope. Point to the snacks. Point to the clock. Say: "Start when you open the envelope."
  *   **00:05 – 00:15:** **Round 1 (Facts).** Fast. They should breeze through this. Watch for the Runner/Decider dynamic.
  *   **00:15 – 00:30:** **Round 2 (Values).** This will slow down. The Stakeholder will struggle to be convinced. Let them struggle. Do not intervene.
  *   **00:30 – 00:40:** **Round 3 (Bad Reasons).** This will feel awkward. That's the point. Ensure they actually perform the task (write on board, tell other table).
  *   **00:40 – 00:45:** **The Debrief.** (See below).
  *   **00:45:** **Snack Distribution.**

  ### 5. The Debrief (Plain English)

  Do not use the word "Testimony." Do not use "Epistemology." Stand at the whiteboard.

  **Step 1: The Feeling Check**
  *   "In Round 1, when the Consultant said 'Brakes are shot,' did anyone feel annoyed that you didn't know *why*?" (Wait for hands/nods).
  *   "In Round 2, when the Consultant said 'Don't steal,' did it feel different? Who felt frustrated they couldn't explain it to the Stakeholder?"
  *   "In Round 3, who felt like a liar reading that reason?"

  **Step 2: Mapping the Two Questions**
  Draw two columns on the board.
  *   **Column 1: "Borrowing Facts."** (Round 1).
      *   *Ask:* "If the mechanic says your brakes are dead, do you need to understand the physics to believe them?"
      *   *Label:* **Rational Trust.** (It's okay to borrow facts).
  *   **Column 2: "Borrowing Convictions."** (Round 2).
      *   *Ask:* "If I tell you 'Stealing is wrong,' but you don't feel it yourself, do you actually believe it? Or are you just pretending?"
      *   *Label:* **Owned Beliefs.** (It feels like you need to own your morals).

  **Step 3: Naming the Positions**
  *   "Some of you felt fine just matching the answer. You think: *'If the answer is right, who cares how I got it?'* Let's call that **The Pragmatist**."
  *   "Some of you felt cheated in Round 2. You think: *'A moral choice isn't real unless I understand the reason.'* Let's call that **The Autonomist**."
  *   "Round 3 showed us the trap. If you act right for a stupid reason, are you actually being good? Or just lucky?"

  **Step 4: The Reveal**
  *   "Philosophers call this the problem of **Moral Testimony**. It's the puzzle of why borrowing a fact feels smart, but borrowing a value feels cheap."

  ### 6. Troubleshooting (What Will Go Wrong)

  **1. Friends Leaking Answers**
  *   *Risk:* Someone at Table 1 yells "It's B!" to Table 2.
  *   *Fix:* The "Consultant" holds the Key face down. If a table is caught hearing another table's answer, they lose 2 tokens. Make this rule bold on the Rule Sheet.
  *   *Mitigation:* Seat tables far apart in the library corner.

  **2. The Consultant Tyrant**
  *   *Risk:* The Consultant gets power-hungry and starts explaining answers or bossing people around.
  *   *Fix:* The Consultant has a **Script Card**. It literally says: *"I am only allowed to say: 'Correct', 'Incorrect', or 'Try Again'."* If they speak outside the script, the Stakeholder automatically wins an objection.

  **3. The "Cheated" Reasoner**
  *   *Risk:* A student figures out the moral reason on their own, but the Runner brings back the wrong verdict, or the Stakeholder rejects their valid reason. They feel the game is rigged.
  *   *Fix:* Clarify scoring before Round 2. "You get points for matching the Key, AND points for satisfying the Stakeholder." It is possible to get the answer right but lose the Stakeholder points. This *is* the lesson. If they complain, say: "That frustration is the data. Write that down."

  **4. Running Out of Time**
  *   *Risk:* Round 2 drags on and you skip the debrief.
  *   *Fix:* At the 30-minute mark, yell "Time for Round 3." If Round 3 isn't finished, cut it. **Do not cut the debrief.** A game without a debrief is just recess. If you have to choose between finishing Round 3 and debriefing, stop the game and talk.

  ### 7. The Limitation (What You Must Explain By Hand)

  The game cannot reproduce one crucial thing: **Moral Uncertainty.**

  In your game, the Consultant *has* the Right Answer. In real life, we don't know if there *is* a Right Answer in ethics.
  *   **The Gap:** The game assumes Moral Realism (there is a truth to be found).
  *   **The Hand-Off:** In the debrief, you must say: "In this game, I was God. I decided what was right. In the real world, there is no sealed envelope. That makes borrowing someone else's conviction even riskier, because they might be wrong. But it also makes it more necessary, because we can't figure everything out alone."

  This activity is solid. It respects the students' intelligence by letting them feel the confusion before you name it. Good luck.
