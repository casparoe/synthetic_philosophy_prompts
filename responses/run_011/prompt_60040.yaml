      *   **Feferman (1995, 2006):** Criticizes Penrose. Points out that "soundness" is a stronger condition than consistency. We can't just assume our own soundness.
      *   **Chalmers (1996):** "Minds, Machines, and Mathematics." Analyzes the logic. Suggests the argument leads to a dilemma: either we are inconsistent, or we cannot know our own consistency.
