          *   Gödel's 2nd Incompleteness Theorem says $F$ cannot prove its own consistency (if consistent).
          *   Löb's Theorem strengthens this regarding provability of soundness.
          *   *Friend's claim:* The debate stalls because anti-mechanists haven't formalized how a human knows their *own* consistency without contradiction. This suggests it's a *formal* gap.

