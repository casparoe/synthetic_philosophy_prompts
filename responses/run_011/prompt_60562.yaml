answer: |-
  **Setting:** *A quiet corner of a university common room, late evening. The fire is low. ALAN TURING sits in a leather armchair, smoking a pipe. Opposite him sits DR ELENA ROSS, a contemporary experimental psychologist. There is a pot of tea between them.*

  **Turing:** You know, when I wrote that paper for *Mind*, I felt I had to address the theological objections. The 'souls' argument. But the one that kept me awake was the argument from extrasensory perception. It wasn't that I wished it to be true. In fact, I found the notion rather repugnant. It complicates the physics. But the statistical evidence available at the time… well, it appeared overwhelming.

  **Ross:** Overwhelming is a strong word, Mr Turing. Especially from the man who invented the concept of the p-value before most of my field knew how to spell probability.

  **Turing:** [Smiles faintly] I was merely applying arithmetic. If a subject guesses the suit of a card significantly more often than chance allows, say one in four, and they do it thousands of times, the deviation becomes hard to ignore. I argued that if human minds can do this, and my machines cannot, then the machine has been disqualified from the Imitation Game on technical grounds. It was a threat to the materialist programme.

  **Ross:** And that's precisely where we've spent the last fifteen years cleaning up the mess. Not the materialist programme, but the arithmetic. You say the evidence appeared overwhelming. I'd say it appeared overwhelming because the questions were asked loosely.

  **Turing:** Loosely?

  **Ross:** Imagine you flip a coin. You're looking for heads. You flip it ten times. You get seven heads. Is that significant? Maybe. But if you decide *after* the tenth flip that you were actually looking for a run of three tails in the middle, or if you decide to stop flipping because you felt 'in the zone' at flip seven, you've changed the mathematics. You've introduced degrees of freedom. In 1950, you had the raw numbers. You didn't have the protocol.

  **Turing:** You suggest the numbers were cooked?

  **Ross:** Not necessarily cooked. Just… garnished. Let's jump to 2011. A very prominent psychologist, Daryl Bem, published a paper in a top journal. *Feeling the Future*. He claimed to show precognition. That students could recall words better if they practised them *after* the test. The statistics were significant. By your standards, and mine. The p-values were below the threshold.

  **Turing:** And yet you do not believe the future influences the past.

  **Ross:** I believe that when we tried to replicate it—using pre-registered protocols, where we write down exactly what we will do before we do it—the effect vanished. It turns out that if you have enough flexibility in how you analyse your data, you can find a signal in the noise. We call it p-hacking. You weren't gullible, Alan. But the tools of inference were cruder.

  **Turing:** This is a matter of mechanism, isn't it? You reject the data because you cannot conceive of the machinery. If I told you a machine could play chess, in 1940, you might have demanded to see the gears. When I showed you the logic, the gears became irrelevant. Why is it different here? If the statistics hold, why must I wait for a theory of telepathic waves before accepting the count?

  **Ross:** Because with chess, we knew the rules of the board. With ESP, you're asking us to accept that the board itself is changing. When an effect is small—just above chance—and the mechanism is impossible according to everything else we know about physics and biology, the burden of proof shifts. It's not just about the p-value. It's about the prior probability.

  **Turing:** So, if a thing is sufficiently odd, it requires more evidence than a thing that is mundane?

  **Ross:** Yes. Because mundane errors are common. Extraordinary errors are rare, but extraordinary claims are often the result of subtle, systemic biases we haven't accounted for. Take the Ganzfeld experiments. You'd know of them? Sensory deprivation, trying to transmit images.

  **Turing:** I recall the meta-analyses. Aggregating many small studies to find a signal.

  **Ross:** Exactly. And for years, the meta-analyses suggested a positive effect. It looked like your card guessing. But when we looked closer, we found the 'file drawer' problem. Studies that found nothing weren't published. They stayed in drawers. When you only average the successes, you get a ghost. When we ran large, pre-registered replications, the effect disappeared. The 'overwhelming' evidence was actually a selection bias.

  **Turing:** [Taps his pipe against the ashtray] I see the force of that. If one selects the trials where the machine works and ignores the crashes, one proves the machine is perfect. But, Dr Ross, consider this. Suppose the effect is real, but it is fragile. Suppose that the very act of rigorous scrutiny—the scepticism, the mechanical setup—interferes with the phenomenon. I know that sounds like special pleading.

  **Ross:** It is special pleading. It's the 'shyness effect'. It makes the hypothesis unfalsifiable. If it works, it's proof. If it doesn't work, it's because we looked too hard. That's not science; that's theology.

  **Turing:** Is it? Or is it an acknowledgement that the observer is part of the system? In quantum mechanics, we accept that measurement affects the state. Why is it so absurd to think that in a phenomenon involving the mind, the attitude of the investigator might couple with the result?

  **Ross:** Because in quantum mechanics, we have the math. We can predict *how* the measurement affects the state. With ESP, the 'shyness' is only invoked when the result is null. It's a get-out clause. Look, I'm not saying the mind is simple. I'm saying that after fifteen years of the replication crisis, we've learned that our intuitions about 'significant' numbers are wrong. We trusted the p-value too much. Just like you did in 1950.

  **Turing:** I suppose I did. I treated the statistical deviation as a brute fact. I was willing to admit telepathy because the alternative was to assume the experimenters were lying or incompetent, and I had no evidence of that.

  **Ross:** And now we have evidence that competent, honest scientists can produce false positives simply by being human. By wanting to find something. Bem wasn't a fraud. He was a brilliant psychologist. But he fell into the same trap as the card guessers. He saw a pattern and stopped looking for the noise.

  **Turing:** So, where does that leave the objection? In my paper, I used ESP to show that there might be something about the human mind that is non-computational. If you strip that away, if you say the statistics were an illusion…

  **Ross:** Then the mind remains a biological machine. A complex one. Maybe we don't understand consciousness yet. But we don't need magic to explain the gap between us and your Turing Test machines. We just need better code.

  **Turing:** [Pauses, looking into the fire] You know, what unsettled me wasn't the magic. It was the loss of closure. If telepathy exists, then the skin is not a boundary. One mind can bleed into another. It makes the idea of a solitary, computing intelligence—a machine in a box—seem like a category error. I wanted to build a machine that could think. But if thinking involves this… leakage… then a isolated processor can never do it.

  **Ross:** I understand the appeal of that. It makes the mind mysterious again. But there's a different kind of closure here. If we accept that the statistics were wrong, we save the integrity of evidence itself. If we can't trust a controlled trial on card guessing, what else do we trust? Clinical trials? Climate models? The cost of keeping the magic is too high. It burns down the rest of the laboratory.

  **Turing:** And yet.

  **Ross:** And yet?

  **Turing:** You speak of the file drawer. The studies that were not published. But there is also the drawer of history. There are accounts, throughout time, of this sensation. Knowing who is calling before the phone rings. The dream that comes true. You explain these as coincidence. As the law of truly large numbers. With enough events, rare things must happen.

  **Ross:** Mathematically, yes.

  **Turing:** But to the subject, it is not a statistic. It is a datum. I am a mathematician, but I am also a man. If I dream of a death, and it occurs, the coincidence is statistically probable somewhere in the world. But it is not probable *to me*. I argued in *Mind* that we must not let our prejudices dictate what we accept. If the data says 'yes', we should not say 'no' because we dislike the implication.

  **Ross:** I agree with the principle. I disagree on the data. The data doesn't say 'yes'. It says 'maybe', and then when we ask it properly, it says 'no'. The feeling you have, the personal datum—that's real. The *meaning* you attach to it, that it implies a physical transmission of thought—that's where the leap happens. You can keep the wonder without breaking the physics.

  **Turing:** [Sighs] I suppose I was looking for a boundary. A place where the machine stops and the ghost begins. I thought I found it in the cards.

  **Ross:** And I'm telling you the cards were marked. Not by spirits, but by human error. But Alan… if you were writing the paper today?

  **Turing:** Today?

  **Ross:** Would you still include the objection?

  **Turing:** [Considers this for a long moment] Yes. I think I would. Not because I am convinced the phenomenon exists. But because it highlights the vulnerability of the test. If a machine can be fooled by random noise, and a human can be fooled by their own hope… the Imitation Game isn't just about intelligence. It's about belief. If the interrogator *wants* the human to win, they will find telepathy. If they want the machine to win, they will find calculation.

  **Ross:** So the ESP objection wasn't about telepathy at all. It was about bias.

  **Turing:** Perhaps. Or perhaps it was a reminder that the universe is under no obligation to be consistent with our models. I was willing to let the numbers break the physics. You are willing to let the physics break the numbers.

  **Ross:** I'm willing to let the method decide. And right now, the method says the signal isn't there.

  **Turing:** [Stands up] Then we are at an impasse. I cannot prove the numbers were right then. You cannot prove the feeling is wrong now.

  **Ross:** No. But I can promise you this: if there is a signal, pre-registration will find it. It won't hide from the light.

  **Turing:** [Moves towards the door] I hope you are right, Doctor. For the sake of the laboratory. But part of me… the part that watched the apple fall and wondered why… part of me hopes you are wrong.

  **Ross:** [Smiles softly] That's why you're the genius, Alan. And why I'm just the mechanic.

  **Turing:** [Pauses at the door] Mechanics keep the world running. Geniuses just break it. Goodnight, Dr Ross.

  **Ross:** Goodnight, Mr Turing.

  *[Turing exits. Ross pours the last of the tea into her cup. She looks at the steam rising, then at the empty chair, and writes a single note in her notebook: "Check priors."]*
