  **— Mark, Leeds**

  Dear Mark,
  You require positive reasons for reliability not derived from say-so. You might cite crime statistics or psychological studies indicating low espionage rates. However, accessing those studies requires trusting the researchers who compiled them. If you ask where I learned researchers are reliable, I must cite further studies, which is circular. Let us assume, for the sake of argument, that you have observed honesty directly enough to form a valid induction based on sensory data alone, bypassing the need for reported data. If you lack such observation, suspend judgment. Do not rely on what your parents told you about honesty. That is circular. You must observe the neighbor not lying, repeatedly, without being told by others that they are truthful. Until then, treat them as potential adversaries. It is lonely, but it is justified.

  **Dear Dr. Axiom,**
  **I witnessed a healing miracle. Doctors said it was impossible. Should I believe my eyes?**
  **— Sarah, Bristol**

  Dear Sarah,
  You must weigh the probability of deception against the violation of natural law. Usually, deception is more likely. However, applying this rigor to your own vision reveals that sensory memory is merely testimony from your past self. If you cannot verify your past self's reliability without circularity, you cannot claim to have witnessed anything. I find I am in the same position. My own visual data relies on memory, which is a report from a prior cognitive state. Since I cannot verify that prior state's honesty without relying on its output, I cannot confirm I see anything. The miracle might have happened, or your eyes might have lied. I cannot distinguish these states without relying on the very faculties under scrutiny. We perceive nothing with certainty.

  **Dear Dr. Axiom,**
  **My four-year-old believes everything she hears. I worry she will be harmed. Should I teach her your method?**
  **— Priya, Oxford**

  Dear Priya,
  Your daughter lacks positive reasons for trusting speakers. Technically, she is unjustified. However, she also lacks defeaters. Her cognitive framework accepts input until contradicted by experience. My framework requires verification before acceptance. Given the scarcity of verifiable data, her method yields more true beliefs than mine. She accumulates knowledge while I remain suspended in doubt. Her default trust is only weakened by actually being lied to, whereas my default doubt prevents knowledge acquisition entirely. She functions; I analyze. Continue her current training. It is more robust. Do not tell her I said this; she has no reason to believe me, nor I to believe I said it.

  **Dear Dr. Axiom,**
  **I loved last month's column. You claimed water boils at 100 degrees. Can you confirm this is still your view?**
  **— Tom, Denver**

  Dear Tom,
  I cannot confirm this. To do so, I must either trust your report of my previous text or trust my memory of writing it. Both are forms of testimony—the latter from a past version of myself whose reliability I cannot currently verify without begging the question. I have no independent access to my past assertions. I remain agnostic on what I wrote. Do not believe me. If you require truth, boil the water yourself and measure it. Do not take my word for the temperature. Do not take the thermometer's word either, unless you have tested its manufacturing process. I am currently unable to confirm I exist, let alone wrote about water.
