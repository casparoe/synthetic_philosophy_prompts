answer: |-
  **Seminar Handout: The Updateless Agent in the Labyrinth of Memory**

  **Thesis:** Leonard Shelby in *Memento* is not merely a man with amnesia; he is a dramatization of an updateless agent. He cannot conditionalize on new observations, so he must select a global policy from a prior standpoint and bind his future selves to it. This handout pressure-tests that comparison to see where it holds, where it breaks, and what the film's narrative structure contributes to decision theory.

  **1. The Planning/Action Gap**
  The comparison is not just a pun on imperfect recall; it is structural. In the Absent-Minded Driver problem, the agent does better by fixing a plan at the highway entrance than by reasoning afresh at each exit, because the exit reasoning lacks the context of the whole trip. Leonard lives this gap permanently. He knows that the Leonard who acts will not remember the Leonard who decided. Therefore, he cannot act on current evidence; he must act on the *system* established by his past self.

  The film dramatizes this in the sequences where Leonard encodes his policy. Consider the scene where he tattoos "John G. raped and murdered my wife" onto his chest. This is not data collection; it is policy hardening. He is moving a decision rule from volatile memory to permanent skin. Similarly, when he annotates the polaroid of Teddy, writing "Don't believe his lies," he is anticipating a future epistemic state where Teddy will appear trustworthy. He knows his future self will receive evidence suggesting Teddy is an ally. To prevent his future self from updating on that evidence, he pre-emptively invalidates it. He is not choosing an action; he is choosing a restriction on what his future self will count as evidence. This is the updateless structure: the policy chosen at Time 1 overrides the observations received at Time 2.

  **2. The Ending: Binding vs. Manufacturing**
  The finale complicates the UDT model. After Teddy reveals the truth—that Leonard's wife survived the assault, that Sammy Jankis was a conflation, and that Leonard has already killed the real "John G."—Leonard possesses the ultimate update. He knows the goal is achieved. He knows the policy is obsolete.

  Yet, he burns the photograph of the completed job and writes a new license plate number on Teddy's polaroid, ensuring his next self will hunt Teddy down. Is this updatelessness? Strictly speaking, UDT assumes the agent optimizes for a fixed utility function based on true logic. Leonard is doing something darker: he is manipulating the input to force the output. He is not just tying himself to the mast like Ulysses; he is paying the crew to lie about the location of the sirens.

  This has decision-theoretic content. It demonstrates that an updateless policy is only as good as the integrity of the evidence channel between the planning self and the acting self. If the planning self can falsify the evidence the acting self will see, "rationality" becomes indistinguishable from self-deception. Leonard realizes that without a mission, he has no agency. He chooses a policy of perpetual vengeance because it preserves his identity, even if it violates truth. The film indicts this choice. The tragedy is not that Leonard fails to find justice, but that his system works perfectly to sustain a lie. The updateless framework survives, but it reveals a vulnerability: an agent that cannot update cannot learn it is wrong.

  **3. Reverse Chronology as Epistemic Standpoint**
  The film's form mirrors the decision theory. In a standard narrative, the viewer updates alongside the protagonist: we learn clues as they find them. In *Memento*, the black-and-white sequences move forward, but the color sequences move backward. We arrive at a scene knowing the outcome but not the cause. We see Leonard kill Teddy before we know why.

  This denies the viewer the ability to conditionalize on narrative progress. We are forced into a standpoint similar to Leonard's planning self: we see the effects of the policy before we understand the observations that triggered them. We are stuck evaluating the *rule* (Leonard hunts men) without the benefit of the *data* (this man is innocent). The form forces us to inhabit the updateless perspective. We cannot say, "If I knew then what I know now," because the structure of the film makes "now" always precede "then." We are compelled to judge the policy as a whole, rather than the individual actions within it. This symmetry is not accidental; it makes the viewer complicit in Leonard's epistemic blindness. We are denied the satisfaction of updating until the very end, and by then, the damage is done.

  **4. Where the Comparison Breaks**
  Here is the critical friction. In Newcomb problems or Counterfactual Mugging, the agent *can* update but *should not*, because their decision is logically entangled with a predictor or a counterfactual branch. Leonard *cannot* update due to biological defect. The former is a strategy; the latter is a disability.

  Does this break the thesis? No, but it shifts the focus. In formal UDT, the agent is logically omniscient regarding its own code. Leonard is not omniscient; he is vulnerable. He relies on external props (notes, tattoos) that can be manipulated by others (Natalie, Teddy). The formal model assumes a closed loop between policy and execution. The film shows that an updateless agent in the real world is vulnerable to adversarial input.

  However, the deeper break is moral. UDT is a tool for maximizing expected utility. Leonard's utility function is corrupted by grief. He *wants* to be updateless because updating would require him to accept that his wife is gone and his quest is over. The film suggests that for humans, the ability to update is tied to the ability to grieve. To refuse to update is to refuse to let go. So, while Leonard functions as an updateless agent, the film argues that this is a pathological state. The "rational" solution to his memory problem is to stop hunting. The "updateless" solution is to keep hunting. The film sides with the update, even if the protagonist rejects it.

  **Conclusion: What the Film Adds**
  Formal models of updateless decision theory treat the policy selection as a clean, mathematical optimization behind a veil of ignorance. *Memento* contributes the psychic cost of that veil. It shows that to be an updateless agent is to live in a state of permanent distrust toward one's own future experiences. It requires you to treat your own senses as unreliable and your past self as an authoritarian master.

  Furthermore, the film exposes the moral hazard of self-binding. If you can choose a policy that ignores future evidence, you can insulate yourself from moral correction. Leonard creates a system where he cannot be proven wrong, because any evidence proving him wrong is dismissed as part of the conspiracy. *Memento* tells us that an agent that cannot update is not just rational; it is dangerous. It turns the agent into a closed loop, immune to reality. The formal models ask how to win the game. The film asks what happens to the player who refuses to stop playing when the game is over.

  For this seminar, hold this tension: Leonard is the perfect updateless agent, and that is exactly why he is damned. We will discuss whether rationality requires the capacity to be wrong, and whether memory is merely a storage mechanism or the foundation of moral accountability.
