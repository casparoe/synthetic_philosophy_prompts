answer: |-
  # SCREENING PROTOCOL: COUNTERFACTUAL HISTORY PROPOSALS
  **To:** Acquisitions Editor | **Time Budget:** 90 Minutes | **Output:** One-Page Memo

  ### I. THE GATES (Ordered Sequence)

  **1. The Rewrite Budget (Hard Gate)**
  *   **Question:** How many distinct, documented historical facts must be negated to make the pivot possible? Itemize and source each.
  *   **Pass:** 0–2 changes (e.g., one bullet misses).
  *   **Conditional:** 3–5 changes (Requires specialist report).
  *   **Fail:** 6+ changes (The antecedent is unavailable; the world is too rewritten).
  *   **Action:** Fail = **Do Not Acquire.**

  **2. The Visibility Date (Hard Gate)**
  *   **Question:** By what date would the divergence surface in primary evidence (orders, ledgers, letters)?
  *   **Pass:** Within 5 years of pivot.
  *   **Conditional:** 5–15 years (Requires tighter timeline in contract).
  *   **Fail:** 15+ years (The consequent is indeterminate/abstract).
  *   **Action:** Fail = **Do Not Acquire.**

  **3. The Three Objections (Judgment Gate)**
  *   **Question:** Does the author address: (A) *Availability* (could the pivot happen?), (B) *Determinacy* (can we know the outcome?), (C) *Snap Back* (would other forces force the same result)?
  *   **Pass:** Explicitly addresses all three; distinguishes "Snap Back" (evidence of joint sufficiency) from "Nobody Can Say" (chaos).
  *   **Fail:** Ignores one or conflates "Snap Back" with "Indeterminacy."
  *   **Action:** Fail = **Acquire Only With Conditions** (must add chapter/section).

  **4. Explanatory Work vs. Ornament (Judgment Gate)**
  *   **Question:** Apply the **Delete Test**: If the counterfactual chapter is removed, does the argument about the *actual* world collapse?
  *   **Pass:** Argument collapses (Counterfactual identifies load-bearing causes).
  *   **Fail:** Argument stands (Counterfactual is decoration).
  *   **Action:** Fail = **Acquire Only With Conditions** (cut or integrate).
  *   **Note:** *Judgment Call:* "Collapse" is subjective. Guard: Require author to specify which actual cause is being tested.

  **5. Motivated Choice of Pivot (Judgment Gate)**
  *   **Question:** Apply the **Symmetry Test**: If the pivot were reversed, would the author accept the resulting political implication?
  *   **Pass:** Author acknowledges political risk or thesis is avowedly political (e.g., "This is a polemic").
  *   **Fail:** Author claims neutrality while producing a politically convenient timeline.
  *   **Action:** Fail = **Do Not Acquire** (unless avowedly political).
  *   **Note:** *Judgment Call:* "Convenient" is subjective. Guard: Check if opposite pivot is discussed in footnotes.

  ### II. HAND-OFF RULES
  *   **Specialist Report ($1,200):** Required if Rewrite Budget is 3–5, or if Motivated Choice is "Avowedly Political." Max 6/year.
  *   **Publisher Sign-Off:** Required for any advance >$40,000.
  *   **Editor Close:** Permitted if Rewrite Budget 0–2, Visibility <5 Years, and Explanatory Work = Pass.

  ### III. LIMITS & CONFLICT
  *   **Truth Claim:** A clean pass entitles you to claim the book is *disciplined*, not that its counterfactual is *true*.
  *   **Conflicting Reports:** If two specialists disagree, default to the one who identifies more specific evidentiary errors in the Rewrite Budget. If tied, **Do Not Acquire**.

  ***

  # MEMO: PROPOSAL (A) "THE INEVITABLE WAR"
  **To:** Acquisitions Board | **From:** Editor | **Date:** Oct 24 | **Re:** 1914 Counterfactual Manuscript
  **Recommendation:** ACQUIRE (Pending Specialist Report)

  **1. Rewrite Budget: PASS (1 Change)**
  *   **Pivot:** Archduke Ferdinand survives Sarajevo.
  *   **Cost:** Negation of one assassination attempt. No prior history requires rewriting.
  *   **Source:** Motorcade route logs.

  **2. Visibility Date: PASS (<1 Year)**
  *   **Divergence:** Mobilization orders issued regardless of assassination.
  *   **Evidence:** Railway timetables and diplomatic cables from July/August 1914.

  **3. Objections: PASS**
  *   **Availability:** High (Security failures were common).
  *   **Determinacy:** Author argues structural forces (alliances) over-determine outcome.
  *   **Snap Back:** Author argues war *does not* snap back; it proceeds identically. This is a claim about "Joint Sufficiency" of mobilization plans.
  *   **Distinction:** Distinguishes "War happens anyway" (Snap Back argument) from "We can't know" (Indeterminacy).

  **4. Explanatory Work: PASS**
  *   **Delete Test:** If removed, the book becomes a standard narrative history. The counterfactual proves the *actual* cause was structural, not individual. It bears the load of the thesis.

  **5. Motivated Choice: PASS**
  *   **Symmetry:** Thesis is academic (structuralism vs. great man theory), not political. No obvious ideological flattening.

  **6. Hand-Off**
