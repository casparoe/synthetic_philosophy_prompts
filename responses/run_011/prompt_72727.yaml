  # PROCEDURE REPAIR & RE-VERIFICATION

  **The Failure:** Proposal (c) failed Steps 1 and 2 because it treats counterfactuals as *method* rather than *claim*. The current protocol assumes every counterfactual book promises an alternate timeline.

  **The Repair:**
  Add **Step 0: Classification**.
  *   **Track A (Narrative):** Claims "X would have happened." (Proceed to Step 1).
  *   **Track B (Analytical):** Claims "X was necessary for Y." (Skip Steps 1 & 2; Proceed to Step 3).
  *   **Rewrite Budget for Track B:** Count the number of *causal assumptions* challenged, not historical facts negated. Pass = <3 major causal assumptions.

  **Re-Verification on (a) and (b):**
  *   **Proposal (a):** Remains **Track A**. The repair does not loosen the constraints on Narrative proposals. The Rewrite Budget remains 1 fact. Result: **ACQUIRE** (Unchanged).
  *   **Proposal (b):** Remains **Track A**. The repair does not excuse the high Rewrite Budget. The author is still negating a century of context. Result: **DO NOT ACQUIRE** (Unchanged).

  **Conclusion:** The repair allows us to acquire rigorous scholarly tools (c) without lowering the bar for speculative narratives (b). The distinction prevents the procedure from becoming an all-purpose veto on methodology while maintaining the line against "decorative" history.
