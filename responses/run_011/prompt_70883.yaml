      *   *Verdict:* Mostly agree, but with nuance. MLTT forces clarity. If a view relies on "metaphysical glue" (propensity) or "completed infinities" (classical frequentism), MLTT exposes that these aren't well-defined meaning conditions. However, MLTT *does* lose the ability to talk about "truth conditions independent of verification" which some realists want. I need to be careful not to just say "MLTT is right." I need to say "MLTT requires X, View Y offers Z, Z cannot be mapped to X without change."
      *   *Refinement on Hypothesis:* The hypothesis is that the *dispute* dissolves. If probability is a judgement (warrant), then asking "is it really frequency or really belief?" is a category error. This aligns well with proof-theoretic semantics.

