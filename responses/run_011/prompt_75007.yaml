answer: |-
  There is no single, universally standardized term in literary theory that captures this exact phenomenon in the way you describe it. However, you are describing the intersection of three established concepts: **Linguistic Markedness**, **The Burden of Representation**, and **Retrospective Labeling**.

  Because the specific *retroactive* mechanism you're identifying is distinct from the static state of "markedness," I recommend adopting the term **Retrospective Marking**.

  While "Retrospective Labeling" exists in sociology (specifically deviance theory), applying **Retrospective Marking** to literary reception precisely isolates the aesthetic and interpretive cost you are describing.

  Here is the definition, the theoretical lineage, and the boundaries you asked for.

  ### The Concept: Retrospective Marking

  **Definition:**
  Retrospective Marking occurs when the explicit disclosure of a socially charged character trait (gender, race, disability, etc.) triggers a reader to re-evaluate prior neutral actions as symptomatic of that trait. Unlike standard *Markedness* (which describes the state of being "othered" in the moment), Retrospective Marking describes the *temporal shift* in interpretation. It transforms previous "individual" behaviors into "representative" evidence.

  **The Mechanism:**
  1.  **The Unmarked Phase:** The text omits the trait. The reader applies the **Default Schema** (e.g., Male, Able-Bodied, White). Actions are read as universal or individual. The "cost" of identity is zero.
  2.  **The Disclosure:** The trait is named.
  3.  **The Recalibration:** The reader's schema disrupts. To resolve the cognitive dissonance between the Default Schema and the New Data, the reader performs a **Hermeneutic Backfill**. They scan previous scenes for "clues" they missed, re-coding neutral actions as intentional signaling.

  **Theoretical Lineage:**
  *   **Markedness (Jakobson/Trubetzkoy):** In linguistics, "unmarked" is the neutral default (e.g., "actor" vs. "actress"). You correctly identified this, but markedness is usually static.
  *   **Retrospective Labeling (Sociology):** In criminology (Matza, 1969), once a person is labeled "deviant," their past harmless behavior is reinterpreted as early signs of deviance. You are seeing this applied to identity politics in fiction.
  *   **The Burden of Representation (Cultural Studies):** The expectation that a minority character must stand in for their entire group. Retrospective Marking is the *mechanism* by which readers enforce this burden.

  ---

  ### The Boundaries (Where It Stops Applying)

  You asked for the edges. Retrospective Marking is not gravity; it does not pull on everything equally. It stops applying under the following conditions:

  #### 1. The Confirmation Edge (Schema Alignment)
  If the stated trait **matches** the reader's default assumption, Retrospective Marking does not occur.
  *   **Example:** If you write a character for 40 pages and the reader assumes "Male," and you then write "he," there is no schema disruption. The past is not re-read; it is confirmed.
  *   **The Exception:** If the confirmation is *over-stated* (e.g., repeatedly emphasizing masculinity in a way that feels defensive), it can trigger a "False Marking," where readers suspect you are protesting too much and look for hidden subtext anyway.

  #### 2. The Neutrality Edge (Low-Stakes Traits)
  Retrospective Marking requires **Social Weight**. It only applies to traits that carry existing cultural narratives or stereotypes.
  *   **Example:** If you reveal a character is "left-handed" on page 40, readers will not re-read page 10 to see if they used their left hand. There is no "Burden of Representation" for left-handedness in most contexts.
  *   **Example:** If you reveal a character has "blue eyes," no backfill occurs.
  *   **Rule:** The trait must belong to a category where society already has a script (Gender, Race, Disability, Class).

  #### 3. The Narrative Relevance Edge
  If the trait is disclosed but explicitly rendered **narratively inert**, the effect is dampened, though not eliminated.
  *   **Example:** If the harbour pilot's gender is revealed in a throwaway line that has no bearing on the plot, conflict, or theme, sophisticated readers may resist the Backfill.
  *   **The Catch:** In literary fiction, readers operate under the **Assumption of Significance** (Chekhov's Gun). They assume every detail is there for a reason. Therefore, simply stating the trait often *creates* relevance where there was none, triggering the Marking anyway. To avoid this, the trait must be buried in a list of other mundane details (e.g., "She was forty, left-handed, and tired").

  #### 4. The Non-Human Edge
  Retrospective Marking applies to non-human characters **only if** they are allegorical.
  *   **Example:** If a robot is revealed to be "female-coded," readers will apply human gender scripts retroactively.
  *   **Example:** If a dog is revealed to be a specific breed, readers will re-read behavior through breed stereotypes (e.g., "He was a Pitbull" $\rightarrow$ "Ah, that aggression on page 5 was breed-specific").
  *   **Limit:** If the entity is truly alien with no human analogue, the effect fails because the reader lacks the schema to perform the Backfill.

  #### 5. The Timing Edge (The Latency Threshold)
  The intensity of Retrospective Marking is proportional to the **distance** between the start of the text and the disclosure.
  *   **Early Disclosure (Pages 1–5):** Sets the initial schema. No Retrospective Marking occurs because there is no "prior neutral text" to re-evaluate.
  *   **Late Disclosure (Page 40+):** Maximum Retrospective Marking. The reader feels "tricked" or "enlightened," and the re-reading is most aggressive.
  *   **The Threshold:** There is a "Latency Threshold" (roughly 10–15% into the text). Before this, the schema is still forming. After this, the schema is set, and breaking it triggers the Backfill.

  ### Why This Matters for Your Draft

  Understanding **Retrospective Marking** gives you control over the "cost" of identity in your prose.

  1.  **If you want the character to be read as an individual first:** You must disclose the trait *before* the Latency Threshold (early enough that it sets the schema rather than breaking it).
  2.  **If you want the reader to feel the weight of the assumption:** You utilize Retrospective Marking intentionally. You let them assume the default, then reveal the truth to force them to confront *why* they assumed the default. (This is what your agent/readers reacted to; they felt the "point" because the mechanism was triggered).
  3.  **If you want true neutrality:** You must understand that in the current literary market, **omission is no longer neutral.** Omission is read as "Default." To achieve actual neutrality, you sometimes have to state the trait plainly and early, so it becomes part of the baseline rather than a reveal.

  ### Summary Term for Your Notebook

  **Retrospective Marking**
  *n.* The reader phenomenon where late disclosure of a marked identity trait causes prior neutral actions to be re-interpreted as representative of that identity category. Distinct from *Markedness* due to its temporal, backward-looking mechanism.

  **Usage:** "I need to move the gender reveal to chapter one; the *Retrospective Marking* in chapter three is making her pilot skills read as political commentary."
