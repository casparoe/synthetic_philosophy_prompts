  This is a solid skeleton. You have the physics right enough to get away with it, and the philosophical architecture is standard but robust. Since you're up against a deadline, I'll be direct.

  Here is the breakdown on your three specific questions, followed by a few surgical suggestions for the text.

  ### 1. Is the setup (1) factually dodgy?
  Mostly no, but two points need tightening to prevent a pedantic referee from nicking you.

  *   **The Gyroscope:** You write: *"a gyroscope carried along with them precesses relative to the matter distribution."*
      *   **Correction:** Be precise about the reference. In the Gödel universe, the matter (dust) has non-zero vorticity. A comoving observer (moving with the dust) carries an inertial compass (gyroscope). That gyroscope does **not** rotate relative to the local metric (it defines local non-rotation), but the **matter distribution rotates relative to the gyroscope**. Your phrasing implies the gyroscope is the active agent; it's better to say the *local inertial frame* is non-rotating, while the *cosmic matter* rotates around it. This highlights the Machian tension (which Gödel loved): inertia is not determined by the bulk matter.
  *   **The Radius:** You write: *"Past a certain radius there are closed timelike curves."*
      *   **Correction:** This is correct, but specify that they do not exist *everywhere*. There is a critical radius ($r_c$) around any observer. Inside $r_c$, causality holds. Outside, CTCs appear. This is crucial because it means the "time travel" isn't immediate; it requires a trajectory. This matters for your dilemma later (see below).
  *   **Lambda:** You have "negative cosmological constant." **Correct.** (Often forgotten, as most cosmology now assumes positive).

  ### 2. Is (2) a fair reading of the modal step?
  **Yes, it is the standard charitable reading.** You are describing what Palle Yourgrau and John Earman call the "Modal Argument."

  *   **The Logic:** If objective time is a necessary feature of reality, it must exist in all possible worlds consistent with the laws of physics. GR allows a world (Gödel's) without objective time. Therefore, objective time is not a necessary feature of reality (and thus, likely not real *simpliciter*).
  *   **The Vulnerability:** You aren't being too generous, but you need to acknowledge the premise's weakness. The weak link is the claim that the *nature* of time must be uniform across all solutions of a physical theory. A critic can say: "Time is real in FLRW universes and unreal in Gödel universes; the nature of time is contingent on the matter distribution." Gödel rejects this contingency, but it is the hinge your objection in (4) will swing on.
  *   **Verdict:** Keep it. It's the strongest version of his argument.

  ### 3. Does the dilemma in (4) bite?
  **It bites, but Horn 2 is softer than you think.** Here is how to sharpen the objection and find the "third reading" you asked for.

  *   **Horn 1 (CTCs are the workhorse):** You say the reply is "it's a mathematical curiosity."
      *   **Refinement:** The stronger reply (from Earman) is that the existence of CTCs makes the solution *physically unreasonable* (violates causality conditions), so it shouldn't be used to draw metaphysical conclusions about *our* universe. If the modal argument relies on a physically impossible world, the modality is weak.
  *   **Horn 2 (No simultaneity is the workhorse):** You say this is just Rietdijk–Putnam (RP) and rotation is decoration.
      *   **Refinement:** This is where you can improve your paper. The RP argument relies on Special Relativity, where there are **no privileged observers**. In the Gödel universe, there **are** privileged observers (the comoving dust).
      *   **The Third Reading:** The real punch of Gödel's argument isn't just "no simultaneity" (RP) and not just "CTCs" (Time Travel). It is that **even with privileged observers, you cannot define a global time function.** In standard cosmology (FLRW), the privileged observers give you cosmic time. In Gödel, the privileged observers *fail* to give you cosmic time because their hypersurfaces twist into CTCs.
      *   **Why this matters:** It shows that "objective time" fails even under the *best possible conditions* for defining it (the existence of a cosmic rest frame). This distinguishes it from the RP argument. The rotation isn't decoration; the rotation is *why* the privileged frame fails to yield a global time.

  ### Specific Suggestions for the Draft

  1.  **In Section 1:** Tweak the gyroscope sentence.
      *   *Draft:* "...a gyroscope carried along with them defines a local non-rotating frame, yet the matter distribution rotates relative to this inertial compass."
  2.  **In Section 2:** Add one sentence acknowledging the counter-premise.
      *   *Draft:* "This hinges on the premise that the metaphysical status of time cannot vary contingently across solutions of the same fundamental theory."
  3.  **In Section 4 (The Dilemma):** Nuance Horn 2.
      *   *Draft:* "If the absence of distinguished simultaneity is doing the work, it resembles Rietdijk–Putnam. However, Gödel's case is stronger: unlike in SR, Gödel's universe *does* possess privileged observers. The argument shows that even privileged observers cannot recover a global time. The rotation is not decoration; it is the mechanism that prevents the privileged frame from foliating spacetime."

  ### Summary
  *   **Facts:** 95% solid. Fix the gyroscope phrasing.
  *   **Modal Reading:** Fair, but flag the "uniformity of time" premise as the point of attack.
  *   **Dilemma:** It bites, but you can escape the "decoration" charge by emphasizing the **privileged observer** failure. That is the unique contribution of the Gödel solution over standard SR arguments.

