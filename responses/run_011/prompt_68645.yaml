  (c) If science discovers neural correlates that perfectly predict dream content before waking, would that force you to revise the concept, or would you insist the experience still only begins at waking?

  3. **Pre- versus post-experiential revision**
  (a) Daniel Dennett distinguished between editing experience before it reaches consciousness and rewriting the memory of experience after the fact. If your view is that the narrative is composed at waking, are you saying the brain processes sensory-like data during sleep that is simply discarded? Or is there no data at all until the moment of arousal?
  (b) She will likely say there is no conscious data during sleep, only neural activation that is interpreted upon waking.
  (c) If there is no conscious data to interpret, what constrains the interpretation so that it forms a coherent story rather than a random assortment of images?

  4. **Confabulation with nothing to confabulate about**
  (a) In cases of confabulation, patients usually misinterpret real cues in their environment to construct a false narrative. Your view suggests the brain constructs a detailed narrative without any concurrent experiential source material. What mechanism produces such specific, emotionally charged stories from nothing but neural noise?
  (b) She will likely suggest that memory systems are activated during sleep and woven together upon waking without needing a concurrent experiencer.
  (c) If memory systems are activated, in what form is that activation stored if not as some kind of trace of an event, and how does that differ from a trace of an experience?

  5. **The contentless dream sense**
  (a) People often wake with a strong sense that they have been dreaming even when they cannot recall any content. On your view, was there a dream occurring during sleep, or is that sense itself part of the waking fabrication? How do you account for the confidence people feel that something happened before they woke up?
  (b) She will likely say the sense is a dispositional state at waking, not evidence of a prior episode.
  (c) If the sense is generated at waking, what explains the specific feeling of duration or elapsed time that often accompanies that sense?

  6. **Stimulus incorporation**
  (a) There are famous cases where a sleeper incorporates an external sound or touch into a dream narrative that seems to unfold in real time before the stimulus occurs. Does this suggest the narrative was lived through in something like real time, or can the brain retrofit a long story instantly upon waking? What explains the precise timing of the narrative climax with the external event?
  (b) She will likely argue that the brain is capable of instantaneously constructing a backstory to explain the waking stimulus.
  (c) If the brain can construct a complex narrative instantly, why do dream reports usually reflect the fragmentation and confusion typical of sleep rather than the coherence of a waking story?

  7. **Lucid dreaming as attempted verification**
  (a) Researchers have trained lucid dreamers to signal with specific eye movements while monitors confirm they are asleep. If a dreamer can count and signal in real time, doesn't that prove some form of conscious experience is happening during sleep? What response do you have to the claim that this signal constitutes a verified report from within the sleep state?
  (b) She will likely concede motor control and self-knowledge but deny that this proves a visual or phenomenal field exists.
  (c) If you grant they are conscious enough to count and signal, what principled reason do you have for denying they are also conscious of the dream environment they claim to be navigating?

  8. **Reports from outside REM**
  (a) We know that people report thought-like mentation from non-REM sleep, which often lacks the narrative structure of REM dreams. Does your view deny experience in those cases too, or do you draw a line between dreaming and other sleep mentation? Where exactly do you place the boundary between genuine sleep experience and waking construction?
  (b) She will likely concede that some sleep mentation might be experiential but maintain that full-blown dreaming is a waking construction.
  (c) What physiological or phenomenological principle allows you to grant experience to one state of sleep while denying it to the other, given the brain activity is continuous?

  9. **The fate of Cartesian dream skepticism**
  (a) Descartes used the similarity between dreaming and waking experience to argue that we cannot trust our senses. If dreams are not experiences at all, does this dissolve the skeptical problem, or does the mere possibility of this fabrication create a new skepticism? How does your view change the traditional philosophical worry about being deceived by dreams?
  (b) She will likely say it dissolves the problem because there is no qualitative indistinguishability to worry about.
  (c) But if we cannot distinguish waking confabulation from waking perception, haven't you just moved the skeptical problem from sleep to waking life?

  10. **The closing evidential question**
  (a) I want to close by asking what specific evidence would force you to abandon this view. If we pre-registered awakenings and matched dream content against real-time physiological markers with high accuracy, would that count as proof of concurrent experience? Please tell us what pattern of results would finally require you to revise your position.
  (b) She will likely say that correlation does not prove phenomenology and that the report is still the only access point.
  (c) If no empirical finding could prove concurrent experience, isn't your position insulated from science rather than engaged with it?
