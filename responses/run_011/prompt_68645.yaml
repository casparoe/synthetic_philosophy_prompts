  (a) Norman Malcolm argued that because we cannot check a dream report against the sleep event itself, the report constitutes the dream rather than describing it. If this verification problem applies to dreams, does it not also apply to pains or afterimages, which are also private? What makes the dream case distinctive enough to deny experience entirely while keeping other mental states?
