      *   *Option B (Reject Certification):* Argue that predicting the "most consequential decade" over an infinite horizon is epistemically impossible for a board. Therefore, the finding cannot be made in good faith. This aligns with the 3 trustees but blocks the long-run grants *unless* they can be reframed.
