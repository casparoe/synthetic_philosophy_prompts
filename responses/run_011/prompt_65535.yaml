          *   *Crucial:* If they *must* be long-run, they fail. I will direct them to be rewritten.
      *   **The Clause (Deed Amendment):** Recommend amendment. The clause creates a paradox (long-termism requires predicting the long term, which the clause forbids unless you know the future).

  4.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid waffling ("on the one hand, on the other").
