  The law is not the only thing that stays,
  There is a bond beneath the public rest.
  When hidden acts disturb our common days,
  They put the unity of all to test.
  Treason attacks the crown in open ways,
  But vice dissolves the fabric of the breast.
  This gut-reaction is not ours to raise,
  It is the only sensor we possess.

  The world remained precisely as it came,
  No collapse shook the concrete and the ground,
  A slow decay that will not be denied,
  I shift the goal to keep the theory same.
  If proof is lacking, I prolong the sound,
  I read my taste as survival's tide.

  This poem comes down firmly against Devlin, using the sestet's failure to rhyme in the final couplet to enact the argument's inability to find a resting place or truth. I adopted the strong disintegration reading of Devlin, where immorality is treated as treasonous, because the softer expressive claim wouldn't sustain the juror's sense of impending doom. The juror's realization is a cheap psychologizing of a respectable argument, prioritizing the unfalsifiability critique over Hart's actual defense of individual liberty. Historically, I conflated Devlin's "right-minded man" with raw visceral disgust, which Devlin tried to distinguish, but the poem requires the emotion to be naked. Ultimately, the verdict is that legal moralism collapses into solipsism when it refuses to accept evidence that society survives without its enforced codes.
