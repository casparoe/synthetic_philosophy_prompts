answer: |-
  ### Rejected Mapping Pairs

  Before settling on the fiduciary framework, I considered four analogies that initially seemed promising but failed to capture the philosophical friction.

  1.  **The Directive as a Will:** I considered mapping the advance directive to a last will and testament, where the "death" of competence triggers distribution. I rejected this because a will operates only upon the biological cessation of the legal person. The philosophical dispute concerns the *living* subject who has changed, not the estate of a deceased subject. Mapping dementia to death smuggles in the conclusion that the prior person is gone, which is precisely what Dworkin denies.
  2.  **The Guardian as Trustee:** I considered mapping the healthcare proxy to a trustee and the patient to a beneficiary. I rejected this because trust law presupposes a separation between the trustee's interests and the beneficiary's. In the advance directive context, the "trustee" (proxy) must decide for a beneficiary who is arguably the *same* person as the settlor. The friction arises from the identity fusion, not the separation of roles.
  3.  **The Directive as a Contract:** I considered mapping the directive to a binding contract between the earlier and later self. I rejected this because contract law requires mutual assent and consideration at the time of enforcement to be binding in equity. The later self cannot assent. Using contract law would force us to treat the later self as a third-party beneficiary who can disclaim, which biases the analysis toward Dresser before the argument begins.
  4.  **Incapacity as Forfeiture:** I considered mapping the loss of capacity to a forfeiture clause in a trust (e.g., "if beneficiary challenges, interest terminates"). I rejected this because forfeiture punishes action. Dementia is a status, not an act. This mapping would incorrectly frame the loss of psychological continuity as a breach of condition rather than a change in state.

  ***

  ### The Translation: Dworkin and Dresser in Fiduciary Vocabulary

  **Dworkin as Dead-Hand Control and Settlor's Intent**
  In your vocabulary, Dworkin argues for the primacy of the **Settlor's Intent**. The competent earlier self is the Settlor who funds the trust (the life) with specific instructions (the directive). The trigger for irrevocability is the loss of capacity. Dworkin posits that the **critical interests** of the Settlor—the integrity of the life narrative—are the primary assets of the trust. The later, demented self is merely the **Beneficiary** of that trust. Even if the Beneficiary currently enjoys experiential interests (pleasure, contentment), the Trustee (proxy/physician) has a fiduciary duty to administer the trust according to the Settlor's original instrument. To ignore the directive is to allow the Beneficiary to waste trust assets (the bodily integrity and narrative closure) that do not belong to them. The "person" is the trust estate itself, which persists across the transition from revocable to irrevocable. Honoring the directive is not a harm to the Beneficiary because the Beneficiary's welfare is defined by the Settlor's critical interests, not their current experiential state.

  **Dresser as Parens Patriae and Best Interests**
  Dresser argues that upon the trigger of severe dementia, the fiduciary relationship shifts. The earlier Settlor is effectively gone, or at least their authority terminates. The **Ward** (the current patient) is the only client the law recognizes now. The Guardian (proxy/physician) owes a duty of loyalty to the Ward's **current best interests**, defined functionally by their present welfare (experiential interests). The directive is admissible only as evidence under a **substituted-judgment standard**, not as a binding command. If the Ward is content, enforcing a refusal of treatment based on the Settlor's prior指令 constitutes a breach of fiduciary duty to the Ward. The directive cannot speak for the Ward because the Ward lacks the psychological continuity to be bound by the Settlor's promises. The **parens patriae** role of the court is to protect the living Ward from the dead hand of the Settlor, prioritizing the welfare of the person in the room over the intent of the person who signed the form.

  **The Personal Identity Objection as Legal Fiat**
  The philosophical objection regarding psychological continuity maps onto the law's **presumption of continuous legal personhood**. The law operates by fiat: the Ward *is* the person who signed the directive, regardless of psychological discontinuity. This is a definitional resolution to a metaphysical problem. In trust terms, it is as if the law declares the Trust Estate remains identical even if all the assets and the purpose have fundamentally changed. This fiat allows the legal system to bypass the Parfit-adjacent worry, but it does so by stipulation rather than argument.

  ***

  ### Smuggled Premises and Doctrinal Fiat

  I must flag where the legal vocabulary resolves the philosophical dispute by definition rather than reasoning.

  1.  **"Intent Governs" Smuggles Identity:** In trusts, "intent governs" assumes the Settlor and the Beneficiary are distinct enough that the Settlor's will can bind the Beneficiary, yet connected enough that the Beneficiary's welfare is served by that binding. In advance directives, this smuggles in Dworkin's premise: that the earlier self *is* the later self in a morally relevant way. If you draft a directive as an irrevocable trust, you have legally enacted Dworkin, not translated him.
  2.  **"Best Interests" Smuggles Dresser:** Conversely, guardianship law's "best interests" standard often prioritizes current welfare over past preference. This smuggles in Dresser's premise: that the current welfare of the Ward is the only relevant fiduciary standard. It treats the prior intent as merely evidentiary, effectively demoting the Settlor to a witness.
  3.  **Property vs. Body:** Your field treats the directive as a conveyance of authority over a body, but uses property concepts (trusts, estates) to do it. This smuggles the premise that bodily integrity is an asset that can be managed like capital. Dworkin relies on this (narrative integrity as an asset); Dresser rejects it (the body is the person, not the person's property). The law uses the property vocabulary to settle the bodily question without acknowledging the category error.
  4.  **The Split Baby:** You noted the law splits the baby: dead hand rules the estate, best interests rule the ward. This is not a translation of the philosophy; it is a procedural compromise that avoids the philosophical question. It tells the agent *when* to switch standards (often unclearly) but not *why* one self's welfare trumps the other.

  ***

  ### Residue Report

  This is the core deliverable. I have sorted the philosophical claims into three buckets based on their translatability into your fiduciary vocabulary.

  #### 1. Claims That Translate Cleanly
  *   **The Trigger Mechanism:** The philosophical concept of "loss of competence" maps cleanly onto the **functional capacity standard**. Both philosophy and law recognize a threshold where authority shifts.
  *   **The Fiduciary Role:** The obligation of the proxy to act for the patient maps cleanly onto **trustee duties**. The structural relationship (one party empowered to decide for another) is identical.
  *   **The Evidence Standard:** Dresser's view that the directive is evidence of what the patient *might* want maps cleanly onto **substituted judgment** where clear and convincing evidence is required but not dispositive.

  #### 2. Claims That Translate Only With Distortion
  *   **Critical Interests vs. Settlor's Intent:**
      *   *Distortion:* In law, "intent" usually refers to the distribution of assets or specific medical choices (no tubes). In philosophy, "critical interests" refer to the *narrative integrity* of a life. A legal document can specify "no feeding tube," but it cannot easily specify "do not let my life narrative end in indignity" without vagueness that invites litigation.
      *   *Diagnosis:* **Missing Legal Concept.** The law lacks a category for "narrative integrity" as a protectable interest distinct from preference satisfaction. We protect property and bodily integrity, but not the "story" of the person.
  *   **Experiential Interests vs. Best Interests:**
      *   *Distortion:* "Best interests" in guardianship is a hybrid standard that often includes past wishes. Dresser's "experiential interests" are strictly current welfare (pleasure/pain). If a court rules that "best interests" includes honoring past wishes, it has distorted Dresser's claim that *only* current welfare counts.
      *   *Diagnosis:* **Philosophical Vagueness.** Dresser's claim relies on a sharp distinction between "current welfare" and "past wishes" that the law rightly blurs because human welfare is temporally extended. The residue here is the philosopher demanding a purity the law correctly rejects.
  *   **Harm to the Patient:**
      *   *Distortion:* Dworkin claims ignoring the directive harms the *earlier* self (via narrative betrayal). Dresser claims honoring it harms the *later* self (via deprivation of pleasure). The law recognizes harm only to the *legal person*. Since the law presumes one legal person, it cannot conceptualize harm to the "earlier self" distinct from the "later self."
      *   *Diagnosis:* **Missing Legal Concept.** The law needs a concept of "temporal harm"—harm to a past stage of a person that is not reducible to harm to the current stage.

  #### 3. Claims With No Expression in Fiduciary Vocabulary
  *   **The Identity Objection (Parfit-adjacent):**
      *   *Residue:* The claim that "there is no one here to be bound" has no legal expression. The law *requires* a legal person to exist to have a ward. If there is no person, there is no jurisdiction.
      *   *Diagnosis:* **Philosophical Vagueness.** This claim is rhetorically powerful but legally cashless. If the law accepted this, it would have to abandon the ward entirely, leaving them unprotected. The residue is a philosophical skepticism that cannot function as a rule of decision.
  *   **The Moral Weight of Precedent Autonomy:**
      *   *Residue:* The idea that the earlier self has *moral authority* over the later self, distinct from legal authority. The law conflates moral authority with legal capacity. Once capacity is lost, moral authority is legally extinguished unless codified as a directive.
      *   *Diagnosis:* **Missing Legal Concept.** The law lacks a vocabulary for "moral authority persisting past capacity." It only recognizes "legal authority."

  ***

  ### The Practical Question: Who Decides vs. Whose Welfare

  On the translation produced above, Dworkin and Dresser are disagreeing about **whose welfare counts**, not primarily about who decides.

  *   **Dworkin** argues that the **Settlor's welfare** (critical interests/narrative integrity) is the beneficiary interest that must be protected.
  *   **Dresser** argues that the **Ward's welfare** (experiential interests/current contentment) is the beneficiary interest that must be protected.

  Both would likely agree on *who* decides (a fiduciary agent), but they would give that agent mutually exclusive instructions on *whose good* to pursue.

  **The Mismatch:**
  Your legal system answers the **Who Decides** question (the agent/proxy) but fudges the **Whose Welfare** question. It gives the agent a hybrid standard: "Follow the directive (Settlor's welfare) unless it conflicts with best interests (Ward's welfare)." This leaves the agent without a metric for weighing the two welfares against each other.

  **Is the Client Well Served?**
  The client in your conference room—the one who signed twelve years ago, now content and recognizing grandchildren—is **not well served** by a system that answers "Who Decides" but lacks vocabulary for "Whose Welfare."

  Here is why: The legal system empowers an agent to act, but provides no fiduciary standard for resolving the conflict between the Settlor's critical interests and the Ward's experiential interests. The agent is left liable for breach of duty regardless of their choice. If they follow the directive, the Ward's family sues for neglect of current welfare (Dresser). If they ignore the directive, the Settlor's estate or prior advocates sue for violation of intent (Dworkin).

  The law treats the conflict as a procedural ambiguity (evidence vs. command) rather than a substantive conflict of welfares. To serve the client, the instrument would need to explicitly weigh the welfares—for example, a clause stating: *"My critical interest in avoiding dementia outweighs any experiential interest I may derive from it."* But even this is fragile, because guardianship law's *parens patriae* role may override such a waiver as against public policy (the state's interest in protecting the living Ward).

  **Diagnosis:** The residue is a **missing legal concept**. Your field needs a doctrine of **Temporal Fiduciary Duty** that explicitly acknowledges the two distinct welfare interests (Settlor vs. Ward) and provides a rule of priority, rather than hiding the conflict behind "substituted judgment." Until the law admits it is choosing between two different subjects' welfares, it will continue to offer your clients the illusion of control without the mechanism of enforcement.
