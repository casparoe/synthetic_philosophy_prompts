  ### Part IV: Theoretical Positions

  You asked for positions, not surveys. Here they are.

  **1. Does sophisticated planning rescue intransitive valuation?**
  **No.** Sophisticated planning (choosing a plan anticipating one's own future choices) does not resolve intransitivity in the underlying valuation of outcomes. If an agent prefers A to B, B to C, and C to A, there is no optimal plan. A sophisticated agent will anticipate that choosing A leads to being pumped to B, then C, then back to A with less money. The agent might try to commit, but if the commitment device itself is valued using the intransitive metric, the commitment selection is also intransitive. The pump reappears at the level of plan selection.
  *Reasoning:* Intransitivity implies there is no maximal element in the choice set. Optimization requires a maximal element. Therefore, optimization fails.

  **2. Is the proper target of review transitivity or pumpability?**
  **Transitivity.** Pumpability and transitivity can come apart (e.g., frictions prevent the pump), but this separation is dangerous for engineering. Pumpability is contingent on the environment (are there counterparties? are fees low?). Transitivity is a property of the agent. If you review for pumpability, you are reviewing the *market*, not the *agent*. An agent that is only safe because its enemies are currently weak is not safe. You must target the structural flaw (intransitivity) because environmental frictions can vanish.
  *Reasoning:* Safety engineering requires bounding the worst case. The worst case for an intransitive agent is an adversary with zero transaction costs. Design for the worst case.

  **3. Is a transaction fee a legitimate repair or a mask?**
  **A Mask.** A transaction fee is an external parameter controlled by the marketplace operator or the counterparty. If your agent's coherence relies on a fee floor, your agent is coherent only by the permission of your adversary. An adversarial marketplace can lower fees to extract value from your incoherent agents. Relying on fees is equivalent to relying on a firewall that the attacker administers.
  *Reasoning:* Coherence is an internal consistency property. Fees are external friction. Using friction to hide inconsistency is technical debt that compounds when the friction is removed.

  **Final Note on Habit 2:**
  You are about to make the plan-level planner the default architecture. **Do not do this without Step 4 (Plan-Execution Consistency).** A plan-level scorer with a greedy executor is the most dangerous configuration possible: it gives you the false confidence of global optimization with the vulnerability of local myopia. The specification must enforce that the execution policy is the *derived policy* of the plan optimizer, not a heuristic approximation. If the engineers cannot guarantee this, the specification must be Escalated.
