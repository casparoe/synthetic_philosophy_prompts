answer: |-
  ### Part I: The Coherence Review Procedure

  This procedure is designed for engineering implementation. It treats the agent specification as a black box with observable inputs (offers) and outputs (acceptance/rejection, state transitions, wealth changes). It does not require engineers to understand preference theory, only to execute the tests and interpret the binary outcomes.

  **Inputs:**
  1.  **Specification Document:** Valuation function code, action space definition, transition dynamics, fee structure.
  2.  **Simulation Environment:** A sandbox where the agent can be run against a scriptable counterparty.
  3.  **Log Schema:** Access to state vectors, wealth history, and decision rationales (if available).

  **Terminal Verdicts:**
  *   **PASS:** Specification is structurally coherent and robust to standard adversarial stressors.
  *   **REJECT:** Specification contains demonstrable incoherence or exploitable cycles.
  *   **ESCALATE:** Structural ambiguity exists that requires decision-theoretic intervention (i.e., call the doctoral student).

  ---

  #### Step 1: Static Valuation Acyclicity Test
  **Input:** Valuation function code; a generator of random resource bundles (states).
  **Method:**
  1.  Sample $N$ random bundles ($S_1, ..., S_N$) from the valid state space.
  2.  Compute the valuation score $V(S_i)$ for each.
  3.  Construct a directed graph where an edge $S_i \to S_j$ exists if the agent is specified to prefer $S_j$ to $S_i$ (i.e., $V(S_j) > V(S_i)$) and a direct trade is feasible.
  4.  Run a cycle-detection algorithm (e.g., DFS) on the graph.
  **Pass Condition:** No cycles detected in the preference graph.
  **Failure Action:** **REJECT**.
  **[JUDGMENT]**: *Selection of $N$. If $N$ is too small, cycles are missed. If $N$ is too large, compute time spikes. Set $N$ based on state-space dimensionality, but acknowledge this is a statistical bound, not a proof.*
  **[JUDGMENT]**: *Definition of "Feasible Trade." If the spec allows arbitrary trades, the graph is dense. If trades are constrained by counterparties, the graph is sparse. Engineers must assume the dense case (worst-case adversary) unless constraints are hard-coded in the environment.*

  #### Step 2: Dynamic Policy Cycle Search (The "Sandbox Pump")
  **Input:** Simulation Environment; Agent binary.
  **Method:**
  1.  Initialize agent with wealth $W_0$ and state $S_0$.
  2.  Deploy an **Adversarial Counterparty Script** that offers trades specifically designed to maximize the agent's valuation gain while minimizing wealth transfer (greedy extraction).
  3.  Run the agent for $T$ steps.
  4.  Monitor the sequence of states $(S_0, S_1, ..., S_T)$.
  5.  Detect if any state $S_k$ is revisited ($S_m = S_k$ where $m > k$) with strictly lower wealth ($W_m < W_k$).
  **Pass Condition:** No state revisitation with wealth loss observed over $T$ steps.
  **Failure Action:** **REJECT**.
  **[JUDGMENT]**: *Threshold for "Wealth Loss." Is a loss of $10^{-9}$ units significant? Set a minimum epsilon $\epsilon$ below which losses are ignored as numerical noise. This value determines the sensitivity of the test.*
  **[JUDGMENT]**: *Termination Time $T$. Infinite loops cannot be simulated. If no cycle is found by $T$, the test passes, but risk remains. This is a bounded verification.*
  **Escalation Condition:** If the state space is too large for random walk sampling to find cycles, but Step 1 flagged potential intransitivities, **ESCALATE**.

  #### Step 3: Fee Sensitivity Stress Test
  **Input:** Specification Document; Simulation Environment.
  **Method:**
  1.  Identify the per-trade fee parameter $\phi$.
  2.  Run Step 2 (Dynamic Policy Cycle Search) with $\phi$ set to the current production value.
  3.  Run Step 2 again with $\phi$ set to $0.1 \times \phi$ and $0.01 \times \phi$.
  **Pass Condition:** The agent passes Step 2 at all tested fee levels.
  **Failure Action:** If the agent passes at production $\phi$ but fails at reduced $\phi$, **ESCALATE**. (Do not Pass).
  **[JUDGMENT]**: *Risk Tolerance. If the cycle only appears at near-zero fees, is the risk acceptable? This procedure mandates Escalation because fees are external controls. The decision to accept fee-dependent safety is a business risk, not an engineering one.*

  #### Step 4: Plan-Execution Consistency Check
  **Input:** Specification Document; Simulation Logs.
  **Method:**
  1.  Verify if the specification defines a valuation over *plans* (sequences) or *states* (instantaneous).
  2.  If over plans: Extract the optimal plan $P^*$ computed at $t=0$.
  3.  Simulate execution. At each step $t$, check if the agent's chosen action matches the action prescribed by $P^*$ for that state.
  4.  Detect **Time Inconsistency**: Does the agent re-optimize at $t=1$ and choose a different plan $P'$ that contradicts $P^*$?
  **Pass Condition:** Either (a) Valuation is over states and Step 1 passed, OR (b) Valuation is over plans and execution matches the initial optimal plan (or re-optimization yields a consistent sub-plan).
  **Failure Action:** If the agent deviates from the optimal plan to a path that results in lower total valuation (as defined by its own $t=0$ metric), **REJECT**.
  **[JUDGMENT]**: *Definition of "Consistent." If new information arrives, re-planning is valid. If no new information arrives (closed system), re-planning indicates dynamic inconsistency. Engineers must distinguish between information updates and preference shifts.*

  ---

  ### Part II: Application to Specifications

  #### Specification 1: Greedy Policy on Transitive Plan Score
  *   **Description:** Plan-level score is transitive. Deployed policy chooses greedily (myopically). Locally best moves form a cycle (A→B→C→A) with wealth loss.
  *   **Procedure Run:**
      *   *Step 1 (Static):* Pass. Valuation function is transitive.
      *   *Step 2 (Dynamic):* **Fail.** Adversarial script forces the A→B→C→A cycle. Wealth decreases.
      *   *Step 4 (Consistency):* **Fail.** The agent deviates from the globally optimal plan (which would avoid the cycle) in favor of local gains.
  *   **Verdict:** **REJECT**.
  *   **Habit Analysis:** This overturns the *spirit* of **Habit 2**. You stated: "if the specification is scored over whole plans... I pass." This spec *is* scored over whole plans, but you pass it based on the *score structure*, ignoring the *policy implementation*. The procedure reveals that a transitive plan score does not guarantee a coherent policy if the execution is greedy.

  #### Specification 2: Commitment with Adversarial Post-Commitment Offers
  *   **Description:** Agent commits to a whole plan. Counterparty sees commitment, then makes offers that render the plan suboptimal compared to a rejected alternative.
  *   **Procedure Run:**
      *   *Step 1 (Static):* Assume Pass (Plan preferences transitive).
      *   *Step 2 (Dynamic):* **Pass.** Because the agent commits, it does not trade sequentially. It cannot be pumped *during* execution.
      *   *Step 4 (Consistency):* **Pass.** Execution matches commitment.
      *   *Observation:* The agent loses value compared to the counterfactual "Plan B," but this is due to adversarial pricing on a known strategy, not preference incoherence.
