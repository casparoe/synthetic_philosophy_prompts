answer: |-
  # Kepler and Astrology: Session Instrument

  ## 1. The 1610 Position Quiz
  *Answer based on what you would do or think in 1610, not what you know now.*

  1.  **A patron wants a nativity for his newborn and pays well.**
      A) Cast it; the fee supports my astronomy.
      B) Cast it; but I must correct the rules first.
      C) Refuse; the art is false or dangerous.
  2.  **A bright new star appears close on the heels of a great conjunction.**
      A) God is signalling a change in empire.
      B) The conjunction physically triggered the star.
      C) It is vapour in the air; nothing more.
  3.  **Two planets are sitting 72 degrees apart; older authorities never counted this.**
      A) Ignore it; stick to the traditional aspects.
      B) Accept it; geometry demands five-fold shapes.
      C) Ignore it; angles do nothing.
  4.  **The town expects next year's almanac from you and your salary depends on it.**
      A) Publish; I need the money, truth is secondary.
      B) Publish; but warn that predictions are inclinations only.
      C) Resign; I will not sell falsehoods.
  5.  **A comet turns up in November.**
      A) It warns of death or war.
      B) It dries the air and alters weather.
      C) It is an optical illusion.
  6.  **A harvest fails after a heavy eclipse.**
      A) Proof the sky governs the earth.
      B) Coincidence; weather is complex.
      C) The eclipse affected the soil moisture only.
  7.  **A patient's humours swing with the Moon.**
      A) Yes, but only for health, not destiny.
      B) Yes, health and life events are linked.
      C) No; the Moon moves water, not bodies.
  8.  **A prediction flatly fails.**
      A) I calculated the house positions wrongly.
      B) The subject's free will resisted the impulse.
      C) The art itself is flawed.
  9.  **What justifies the aspects you use?**
      A) The authority of Ptolemy and the Arabs.
      B) Musical harmonies and constructible polygons.
      C) Nothing; I do not use aspects.
  10. **Do the stars force the soul?**
      A) Yes, destiny is written.
      B) No, they incline, God disposes.
      C) No, the soul is separate from the sky.

  ## 2. Scoring Key
  *Count your answers to find your branch.*

  | Diagnostic Cluster | Mostly A | Mostly B | Mostly C |
  | :--- | :--- | :--- | :--- |
  | **Belief (Q1, Q4)** | Pure Instrumentalist | Believer (Reformer or Traditional) | Rejection / Sublunary |
  | **Mechanism (Q2, Q5)** | Providential Sign | Physical Cause | Natural Philosophy |
  | **Locus (Q6, Q7)** | Events & Soul | Weather & Humours Only | No Influence |
  | **Geometry (Q3, Q9)** | Traditional Authority | Harmonic Reason | None |
  | **Failure (Q8, Q10)** | Deterministic | Inclination / Free Will | Skeptical |

  *Match your cluster profile to the Tree below.*

  ## 3. The Logical Tree

  1.  **Does the practitioner believe the art?**
      1.  No (casts for fee only) → **Pure Instrumentalist**
      2.  Yes.
          2.  **What reaches Earth?**
              1.  Light and heat only → **Natural-Philosophical Rejection**
              2.  Influence beyond physics.
                  3.  **Is it Cause or Sign?**
                      1.  Sign (God speaks through sky) → **Providential Reading**
                      2.  Cause (Physical machinery).
                          4.  **Where does the effect land?**
                              1.  Weather and humours only → **Sublunary-Only Influence**
                              2.  Events and soul included.
                                  5.  **What carries the influence?**
                                      1.  Planetary natures / ensouled beings → **Occult-Sympathy Tradition**
                                      2.  Geometry and Angles.
                                          6.  **Which Geometry?**
                                              1.  Traditional (Zodiac, Houses, Ptolemaic) → **Unreformed Judicial Astrology**
                                              2.  Harmonic (Polygons, Music, New Aspects) → **Kepler's Harmonically-Reformed Version**
                                              3.  Unnamed (Harmonic aspects but denies event prediction)

  ## 4. Analysis

  ### Indistinguishable Leaves
  *   **Providential vs Unreformed Judicial:** Both predict events and accept fees. The distinction lies in internal justification (God's will vs Physical causation), which quiz questions on outcomes (Q2, Q6) cannot separate. An extra question on *why* the prediction works (divine language vs physical rays) is required.
  *   **Instrumentalist vs Sublunary:** Both deny star-driven events. One takes money for casting nativities, the other refuses. Q1 separates them, but in practice, a sublunary physician might cast a medical chart for a fee, blurring the line. The distinction is reachable but socially fragile.

  ### Unoccupied Cells
  *   **Harmonic Aspects but Weather Only:** Someone who accepts Kepler's geometry (Q3, Q9) but denies it touches events (Q6, Q7). *Diagnosis:* Merely unexplored. Kepler himself flirted with this but could not resist predicting wars. It is logically stable but historically unattractive to patrons paying for nativities.
  *   **Signs but No Fees:** Someone who sees the sky as God's text (Q2) but refuses payment (Q1). *Diagnosis:* Unattractive. In 1610, unpaid prophecy was suspect; professionalism lent credibility.
  *   **Occult Sympathy without Events:** Treating planets as ensouled beings (Q5) but limiting effects to talismanic magic, not nativities. *Diagnosis:* Incoherent within the session's scope. If planets have souls, they intend events; limiting them to weather contradicts the ensouled premise.

  ### Kepler Through the Tree
  Kepler does not sit in one leaf; he migrates under pressure.

  *   **1604 New Star:** Lands in **Providential** and **Physical Cause**. He argued the conjunction triggered the star physically, yet also called it a warning to Christendom. He straddles the Cause/Sign split (Node 3).
  *   **Wallenstein Nativity:** Lands in **Kepler's Harmonically-Reformed Version**. He cast it using new aspects, yet explicitly told Wallenstein that the stars incline rather than force (Node 6, Q10).
  *   **Annual Prognostications:** Lands in **Pure Instrumentalist** and **Unreformed Judicial**. He mocked the vague predictions privately but published them to fund his astronomy (Node 1 vs Node 6). He used traditional houses to sell copies, despite rejecting their geometry.
  *   **Aspects:** Lands firmly in **Kepler's Harmonically-Reformed Version**. He threw out traditional sextiles where geometry failed and kept the quinconx because it fit the pentagon (Node 6, Q3).
  *   **1618 Comets:** Lands in **Sublunary-Only Influence**. He argued they were earthly exhalations lit by the sun, denying celestial omen status, yet still linked them to weather changes (Node 4).
  *   **1610 Pamphlet:** Lands between **Natural-Philosophical Rejection** and **Unreformed Judicial**. He positioned himself as a third party, accepting physical influence (against the physician) but rejecting fatalism (against the astrologer).

  **The Contradiction:** The tree forces a single path. Kepler occupies **Kepler's Harmonically-Reformed Version** as his ideal, but his practice slides into **Pure Instrumentalist** for income and **Providential Reading** when discussing empire. The tree fails to capture a man who reformes the art to save it, while simultaneously apologising for practising it. Use this friction to start the debate: was Kepler an astrologer who loved astronomy, or an astronomer trapped by astrology?
