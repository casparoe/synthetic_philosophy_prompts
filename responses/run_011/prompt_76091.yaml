answer: |-
  **Exam Question: Social Epistemology & Information Economics**
  **Time Allowed:** 50 Minutes
  **Total Marks:** 25

  **Question 1**
  Consider the standard sequential-decision model of informational cascades (e.g., Bikhchandani, Hirshleifer, and Welch). Agents act in sequence, observing the actions of predecessors and a private signal regarding a binary state of the world. Two students offer competing verdicts on the epistemic weight of the resulting public consensus:

  *   **Student Alpha:** "Because a cascade can settle on the wrong action while appearing unanimous, the resulting consensus is worthless as evidence of the truth. Once a cascade begins, the public record is decoupled from reality."
  *   **Student Beta:** "Wrong cascades are possible but less likely than right ones. Consensus still carries information—specifically about the pre-cascade signals—just much less than a naive aggregation of independent signals would suggest."

  (a) Adjudicate between Alpha and Beta. Defend one position as superior, explaining why the other fails to capture the Bayesian structure of the model. (10 marks)
  (b) Suppose you are an outside observer who sees only the sequence of public actions, not the private signals. What can you legitimately infer from the sequence? Furthermore, does letting the number of agents ($N$) grow without bound restore the Condorcet-style guarantee that the truth wins out in the limit? Justify your answer. (15 marks)

  ***

  **Model Answer**

  Student Beta is correct; Student Alpha's skepticism is excessive and misunderstands the Bayesian mechanics of the cascade. Alpha argues that because cascades *can* be wrong, consensus is *worthless*. This is a category error. In the BHW framework, actions are endogenous functions of private signals. A cascade does not emerge from a vacuum; it requires a specific history of private signals to trigger. If the state is High, the probability of triggering a High-cascade is strictly greater than if the state is Low (assuming signal precision $p > 0.5$). Therefore, observing a consensus *does* update the observer's posterior probability toward the consensus action. It is not "worthless"; it is simply bounded. Alpha conflates the *fragility* of the cascade (its susceptibility to reversal by a small shock) with a lack of *informational content*. The consensus tells us that the early private signals were sufficiently lopsided to overwhelm subsequent private information. That is valuable evidence, even if it is not definitive.

  Beta correctly identifies that consensus carries information, but crucially notes it carries less than naive aggregation suggests. Naive aggregation assumes independence. In a cascade, later agents ignore their private signals, rendering their actions perfectly correlated with predecessors. The public pool of information stops growing after the cascade begins. Thus, while the consensus is informative about the *start* of the chain, it is uninformative about the *length* of the chain. Beta's verdict respects the asymmetry: correct cascades are more probable than incorrect ones, so betting on the consensus is rational, but one should not bet with the confidence one would have if $N$ independent signals were actually observed.

  Regarding the outside observer: seeing only the action sequence, the observer can infer the private signals of agents *prior* to the cascade. Once the cascade begins (e.g., two consecutive identical actions in the simplest binary model), subsequent actions reveal nothing about the agents' private signals. The observer knows these agents are herding. Consequently, the observer's belief converges to a fixed limit that depends on the specific path taken to trigger the cascade, rather than continuing to update toward certainty.

  This leads directly to the limit question. Letting $N \to \infty$ does **not** restore the Condorcet guarantee. In a Condorcet jury theorem, independent signals ensure the probability of error approaches zero as $N$ grows. In an informational cascade, independence is broken. Because agents in the cascade ignore their private signals, the society stops learning. The probability of an incorrect cascade remains strictly positive regardless of population size. For example, with signal precision $p$, there is a non-zero probability that the first two agents receive misleading signals and trigger a wrong cascade. Once triggered, millions of subsequent agents will follow suit, ignoring their own contradicting signals. The error does not wash out; it solidifies. Therefore, the long-run probability of choosing the wrong action is bounded away from zero. Social learning is incomplete. The consensus is stable, but it is not necessarily true, and increasing the crowd size does not fix the informational bottleneck created by the rationality of the agents themselves.

  ***

  **Marking Scheme (25 Marks)**

  **Part A: Adjudication (10 Marks)**
  *   **Selection of Beta (3 marks):** Awarded for explicitly siding with Beta. (Siding with Alpha caps this section at 1 mark).
  *   **Asymmetry Argument (4 marks):** Must explain that $P(\text{Consensus} | \text{True}) > P(\text{Consensus} | \text{False})$. Consensus has positive likelihood ratio.
  *   **Critique of Alpha (3 marks):** Must identify that Alpha confuses *possibility* of error with *absence* of evidence.
      *   *-2 marks:* If candidate claims Alpha is correct because cascades are fragile.
      *   *-2 marks:* If candidate argues agents inside the cascade are acting irrationally (Must distinguish fragility from irrationality).

  **Part B: Observer & Limits (15 Marks)**
  *   **Inference Limit (5 marks):** Must state actions become uninformative after cascade starts (signals are ignored).
  *   **Condorcet Failure (5 marks):** Must state $P(\text{Error}) \not\to 0$ as $N \to \infty$.
  *   **Mechanism Explanation (5 marks):** Explanation that independence is lost; later signals are not aggregated.
      *   *-3 marks:* If candidate treats herding as driven by payoff externalities (e.g., reputation) rather than informational inference.
      *   *-3 marks:* If candidate claims infinite agents guarantee truth (Condorcet error).
      *   *-2 marks:* If candidate suggests the observer cannot distinguish pre-cascade from post-cascade actions.

  **Specific Error Penalties (Deducted from Total)**
  *   **Conflating Fragility with Irrationality:** If the answer claims agents in a cascade are irrational or making mistakes, deduct **5 marks**. (Agents are rationally optimizing given priors).
  *   **Informational vs. Payoff Herding:** If the answer attributes the behavior to network effects, reputation, or payoff interdependence rather than Bayesian updating on predecessors' actions, deduct **5 marks**.

  ***

  **Note on Idealizations**
  This verdict depends on the idealization that signal structures are common knowledge and actions are perfectly observable. A strong candidate might challenge the assumption that agents cannot distinguish the *strength* of signals (e.g., if signals are continuous or actions allow for varying intensity). If agents could signal signal strength, cascades might not form, or learning might resume. Additionally, if the model allowed for endogenous information acquisition (agents pay to get better signals), the "stop learning" result might change. However, within the standard BHW setup specified in the prompt, challenging these idealizations does not change the verdict: rational Bayesian agents observing binary actions will inevitably cease to aggregate information, preventing Condorcet efficiency.
