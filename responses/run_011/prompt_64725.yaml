answer: |-
  **Planning Section**

  **Conceptual Crux:** The tension between the 'occurent self' (current, impaired Ilse) and the 'extrapolated self' (idealized, cohort-adjusted Ilse). The horror arises not from system failure, but from the system successfully identifying the current self's refusal as a deviation from their own 'true' volition.

  **Documents:** Form VI-44 (Extrapolation Report), Tribunal Transcript (Record of Proceedings), Profile Lodgement Folder (physical prop).

  **Emotional Weight:** Placed on the narrator's mundane routines (tea, commute) which contrast with the gravity of overriding a woman's voice, and on the physical metaphor of Ilse's flood defences holding back water vs. the profile holding back death.

  **Brief Critique:** Stipulations are robust; no changes proposed.

  ***

  **The Flood Plain**

  The kettle in the breakroom whistled, a sharp, rising note that cut through the hum of the servers. I poured the water over the tea bag and watched the brown swirl expand. It was a mundane violence, the boiling water breaking the leaves, releasing what was inside.

  "Still on the Rennick file?" Sarah asked, leaning against the doorframe. She held a mug chipped at the rim.

  "Yes."

  "She's lucky it's you," she said. "Anyone else might have flagged the divergence as incompetence."

  "It isn't incompetence," I said, stirring in milk. "It's fatigue. The profile accounts for fatigue."

  Sarah nodded, taking a sip. "My mum's tap is leaking again. Drips all night. I keep meaning to call the plumber, but I just put a bucket under it."

  "Better to catch it than let it rot the sill," I said.

  "Suppose." She pushed off the frame. "Don't stay late, Elena. The Tribunal sits tomorrow."

  I took my mug back to my desk. The file was open. Form VI-44 lay on top, the paper heavy and cream-coloured, distinct from the standard white copier stock. It smelled of ink and the specific, dry scent of the archives. Ilse Rennick's profile was lodged in 1991, the year her brother died. She was forty-one then, a hydrologist who built walls against water that wouldn't arrive for a century. She wanted to be the sort of person who honoured those walls. The Act assumes we wish to be the people we aimed for, not the people the erosion makes us.

  I picked up my pen. I had to sign the cover sheet. My hand hovered. The ink was black, permanent. Below my signature line was the space for the Tribunal's stamp. If they ratified this, the surgeons could proceed. If they didn't, Ilse would sit in the ward, lucid for four hours a day, refusing the procedure that would save her life, waiting for the water to come over the top.

  I signed.

  ***

  **EXTRAPOLATION REPORT: VI-44/RN-749**
  **SUBJECT:** Rennick, Ilse (DOB: 14/05/1950)
  **EXTRAPOLATOR:** E. Vance (Accreditation: 99-A)
  **DATE:** 12/10/2024

  **1.0 VOLITIONAL STABILITY ASSESSMENT**
  1.1 Subject's current expressed preference (CEP): Refusal of cardiac intervention.
  1.2 Profile-derived extrapolated preference (PEP): Acceptance of cardiac intervention.
  1.3 Divergence Status: Critical.

  **2.0 EXTRAPOLATION PARAMETERS**
  2.1 Knowledge Base: Updated to current medical prognostics (survival probability 85% with intervention; 12% without).
  2.2 Cognitive Speed: Adjusted for pain-interference factors identified in Lodgement Profile.
  2.3 Moral Development: Aligned with Subject's stated commitment to 'long-term structural integrity' over 'immediate comfort'.

  **3.0 COHORT CONVERGENCE**
  3.1 Reference Group: Cohort 44-B (Peers from Cambridge Hydrology Dept, 1972-1980).
  3.2 Convergence Index: 0.94 (High Stability).
  3.3 Note: Subject's volition stabilises on acceptance when co-extrapolated with Reference Group. Isolated extrapolation yields unstable attractors.

  **4.0 MINORITY FINDING (J. Aris, Junior Extrapolator)**
  4.1 The Convergence Index relies heavily on the inclusion of deceased cohort members in the simulation matrix.
  4.2 Had the cohort size been restricted to living peers, the PEP would align with the CEP (Refusal).
  4.3 The assumption that volition converges with the dead was not argued during the Act's passage.

  **5.0 RECOMMENDATION**
  5.1 Authorise intervention. The CEP is consistent with a frightened, tired, badly informed version of the Subject. The PEP is consistent with the Subject had she grown up farther together with her peers.

  ***

  The Tribunal Room was cold, the air conditioning set to preserve the recording equipment rather than the people. Ilse sat on the left. She was wearing a cardigan that looked hand-knitted, thick wool, grey. Today was a lucid day. Her eyes were sharp, fixed on the panel.

  I sat on the right. I had my file open. I did not look at her.

  **TRANSCRIPT OF PROCEEDINGS: VIT-2024-88**
  **PRESIDING OFFICER:** Mr. Justice Halloway
  **PARTIES:** Ilse Rennick (Subject), Dr. Elena Vance (Extrapolator)

  **HALLOWAY:** Ms. Rennick, do you understand the effect of the Extrapolation Report?

  **RENICK:** I understand they want to cut me open because a computer says I'd say yes if I were smarter.

  **HALLOWAY:** It is not a computer. It is a panel of accredited extrapolators.

  **RENICK:** It's a machine made of people. Same difference. I said no. I am saying no. I am here. I am speaking.

  **HALLOWAY:** The Act provides for circumstances where the present self is compromised by transient states. Pain. Fear. Ignorance.

  **RENICK:** I am not ignorant. I know the odds. I know the water is coming. I built defences for water like this my whole life. You know what happens when the water comes? You let it. You don't build a wall higher than the sky.

  **HALLOWAY:** Dr. Vance, does the Report address this metaphor?

  **VANCE:** The Subject's profile emphasises resilience. However, it also emphasises continuity. The intervention preserves the continuity of the agent. The refusal terminates it.

  **RENICK:** It terminates *me*. The person who wakes up after the knife isn't the person who refused the knife. That person is a survivor. I am the one who died.

  **VANCE:** The Profile lodged at age forty-one specifies a desire to remain active in advocacy work post-retirement. This requires survival.

  **RENICK:** That was thirty years ago. I was a different woman. My brother was dead three months. I was angry. I wanted to fight everything. Now I'm tired.

  **VANCE:** The extrapolation corrects for the tiredness. It asks what you would want if you were not tired.

  **RENICK:** But I am tired. That's the point. Why does the tired woman not get a vote?

  **HALLOWAY:** The Tribunal will adjourn to consider the weighting of the Minority Finding regarding Cohort 44-B.

  **RENICK:** (To Vance) You signed this. You looked at my face, and you signed it.

  **VANCE:** I signed the finding that matched your values, Ms. Rennick. Not your fear.

  **RENICK:** You don't know which is which.

  ***

  The bus ride home took forty minutes. I sat in the back, near the window. The glass was cool against my forehead. Outside, the city blurred into streaks of red and white light. A woman across the aisle was helping an old man with a shopping bag. She lifted it gently, placing it on his lap. He patted her hand.

  I closed my eyes. I thought about the Minority Finding. Aris was young, brilliant, and technically correct. If we removed the dead from the cohort, Ilse's volition drifted. It drifted toward refusal. But the Act says we grow up farther together. It implies the dead are part of the 'together'. They hold the shape of the group. If you remove them, the net holes open.

  But was it right to let the dead vote for the living? Ilse's brother had died young. He never got tired. He never got to choose the wall over the water. His voice was in the cohort matrix, loud and clear, pulling her toward survival, toward the fight.

  The bus halted. A group of schoolchildren piled on, uniforms bright blue, voices loud. They smelled of rain and synthetic fabric. One boy dropped a coin; it rolled down the aisle, spinning, catching the light. He chased it, laughing, grabbing it just before it vanished under a seat.

  I looked at my own hands. They were steady. I had done the job. I had protected the Ilse who wanted to build, not the Ilse who wanted to rest. I had protected the architect, not the inhabitant.

  When I got home, the hallway was dark. I didn't turn on the light. I walked into the kitchen and filled the kettle. I watched the water level rise through the plastic window. It stopped just below the max line.

  I pressed the switch. The red light glowed. I waited for the whistle. I thought about Ilse in the ward. Tonight she would sleep. Tomorrow she might be lucid again. She would refuse again. The surgeons would wait for the Tribunal's ruling. If it came through, they would anaesthetise her. They would fix the heart. She would wake up angry, or relieved, or alive.

  The kettle clicked off. The silence rushed back into the room. I poured the water. I didn't make tea. I just watched the steam rise, twisting in the air, dissipating into the dark above the counter. I put the mug on the table and sat down. I left the light off. I listened to the house settling, the pipes ticking as the water cooled, and waited for the morning to tell me what I had done.
