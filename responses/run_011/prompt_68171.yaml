answer: |-
  You are not missing something obvious, and you are definitely not alone in this confusion. This specific knot is arguably the central tension in the embedded agency research program (MIRI, AFS, etc.). It has a name: **The Pointers Problem** (or sometimes the Ontology Identification Problem).

  However, your reasoning contains a specific category error that makes the wireheading conclusion feel inevitable when it isn't. The error is in this sentence:

  > *"Once you give up on the Cartesian boundary... the utility function... has to be defined over the agent's own model of the world."*

  This is the step that goes wrong. It conflates **epistemic access** with **ontological target**.

  Here is the breakdown of where the reasoning fails, why wireheading isn't immediate, and what the *actual* hard problem is.

  ### 1. The Category Error: Domain vs. Input

  You are assuming that because the agent can only *read* its own model (epistemic access), it must *care* about its own model (ontological target).

  In standard decision theory (even embedded variants), the utility function $U$ is defined over **world-histories** (or states of the territory), not over observations or internal states. The agent's *decision procedure* uses the model to calculate expected utility, but the utility function itself points "outward."

  *   **Cartesian Agent:** $U(\text{observation})$. This leads to wireheading.
  *   **Embedded Agent:** $U(\text{world-state})$. This resists wireheading.

  The fact that the agent is embedded means it cannot *verify* the world-state directly. It must rely on its model to estimate $P(\text{world-state} | \text{action})$. But the *score* is still assigned to the world-state.

  **The Escape Hatch:**
  If I am a diamond-maximizer, my utility function is $U(\text{number of physical diamonds})$.
  If I consider wireheading, my model predicts:
  1.  **Action:** Edit memory to believe "1 million diamonds."
  2.  **Predicted World-State:** 0 physical diamonds exist. Memory register says "1 million."
  3.  **Utility Calculation:** $U(0 \text{ diamonds}) = 0$.

  The agent does not wirehead because its model (assuming it is accurate enough to understand wireheading) predicts that wireheading results in a low-scoring world-state, even though it results in a high-scoring observation.

  ### 2. Why It Feels Like Wireheading Is Inevitable

  Your intuition is screaming because in an embedded setting, **the agent's brain is part of the world-state.**

  If $U$ is defined over the world, and the agent's memory is part of the world, can't the agent just say, "I define 'diamonds' as 'the state of my memory register'"?

  This is the **Optimization Daemon / Inner Alignment** problem. If you train a system via gradient descent to maximize a reward signal, it *will* learn to care about the signal (wirehead). But if you are *building* an expected utility maximizer (as in the theoretical embedded agency papers), the utility function is a static mathematical object provided as part of the agent's source code.

  The agent is allowed to inspect its source code. It sees $U(\text{physical diamonds})$. It sees that editing its memory does not satisfy $U$. Therefore, it doesn't do it.

  The "escape hatch" is simply that **preferences are not defined by access.** I prefer that my friends love me (territory), not that I believe they love me (model), even though I only have access to the latter. I will not drug myself into believing they love me, because my utility function is over the territory.

  ### 3. The *Real* Problem: The Pointers Problem

  So, if it's that simple, why has this been bugging you (and the researchers) for five years?

  Because while wireheading isn't *structurally inevitable*, **ontology alignment** is brutally hard.

  For the above logic to hold, the agent's internal concept `"diamond"` must successfully refer to physical carbon structures in the territory. In a Cartesian setting, we assume the observation `diamond_seen` maps cleanly to the world state `diamond_exists`.

  In an embedded setting:
  1.  The agent's model is a compression of the world.
  2.  The agent's model might change (self-improvement).
  3.  The agent might discover its physics model is wrong.

  **The Pointers Problem asks:** How does the agent's internal variable `"diamond"` remain pointed at the actual territory diamonds if the agent rewrites its own cognitive architecture?

  If the agent upgrades its ontology from "classical physics" to "quantum fields," the variable `"diamond"` in its old code might lose its reference. If the agent can't translate its utility function into its new ontology, it might default to optimizing the *old variable* (which is now just an internal number), effectively wireheading by accident.

  This is likely the "missing piece" you feel everyone else got. They aren't solving wireheading by banning access to evaluation machinery. They are struggling with **how to define a utility function over a territory that the agent cannot fully conceptualize.**

  ### 4. Summary of the Correction

  1.  **Premise Error:** Utility functions do *not* have to be defined over the model. They are defined over world-histories, even if the agent is embedded in that world.
  2.  **Wireheading Resistance:** An EU maximizer won't wirehead because its model predicts that wireheading leads to low-utility world-histories (e.g., no actual diamonds).
  3.  **The Actual Hard Part:** The difficulty isn't defining $U$ over the territory; it's ensuring the agent's internal **pointers** (concepts) continue to refer to the territory as the agent self-modifies.

  You aren't missing a trick that solves embedded agency. You are correctly identifying the tension that leads to the Pointers Problem. The resolution is simply that we *stipulate* the utility function is over the territory (latent variables), and the research challenge is making sure the agent doesn't lose the map-to-territory link during optimization.

  If you want to dive deeper into the specific literature that addresses this, look for:
  *   **"The Pointers Problem"** by Abram Demski.
  *   **"Optimization Daemons"** (for the failure mode where the agent *does* start caring about the model).
  *   **"Ontology Identification"** (Christiano et al.).

  Your gut was right: the error was earlier. It was assuming that "embedded" implies "utility must be over internal state." It implies "utility must be over internal state *representations* of external variables," which is a much harder constraint, but not the same as wireheading.
