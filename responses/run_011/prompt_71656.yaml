answer: |-
  This is a classic stalemate in contemporary metaphysics of science, and your intuition that you are talking past each other is the most philosophically mature take on the situation. Your friend is focusing on **formal equivalence**, while you are focusing on **philosophical ambition**.

  Here is the diagnosis of the disagreement, followed by the concrete cases where the accounts actually diverge.

  ### The Diagnosis: A Clash of Projects, Not Primitives

  Your friend is technically correct that the **formalism** is translatable. You can model Lewisian counterfactuals using Structural Causal Models (SCMs), and you can interpret the $do$-operator as a specific way of selecting "closest worlds" (specifically, worlds where the structural equation for $X$ is replaced by $X=x$). If you look purely at the logic of the dependency relations, they look like notational variants.

  However, you are right that this misses the point. The disagreement is not about the *extension* of causal claims in simple cases, but about **what a theory of causation is supposed to do.**

  1.  **Lewis's Project (Metaphysical Reduction):** Lewis wants to know what causation *is* in terms of something more fundamental (the Humean mosaic + a similarity metric). He needs the analysis to be non-circular. If counterfactuals are analyzed via causation, or vice versa, the reduction fails. For Lewis, the "similarity metric" is supposed to be grounded in the world's structure (laws, particular facts).
  2.  **Woodward's Project (Pragmatic Explication):** Woodward explicitly disavows the metaphysical reduction project. He isn't asking "What is causation in the fabric of reality?" He is asking "What distinguishes causal claims from correlational claims in successful scientific practice?" For Woodward, the "circularity" you identified is a feature, not a bug. He characterizes interventions using counterfactuals, and causation using interventions, but he argues this is a coherent *cluster of concepts* rather than a vicious circle. He is offering an explication, not a reduction.

  **The Verdict on the Stalemate:**
  The stalemate exists because your friend is treating Woodward as if he were trying to do Lewis's job. If you demand a metaphysical reduction, Interventionism looks circular (as you noted). If you demand a methodology for scientific inference, Lewisian similarity metrics look unacceptably vague and anthropocentric.

  *   **Is it verbal?** No. It's substantive, but the substance is about the *goals* of philosophy, not just the definitions.
  *   **Is it a hidden formal issue?** No. The formalisms are compatible.
  *   **Is it a difference about primitives?** Yes. Lewis takes "Similarity" as primitive; Woodward takes "Intervention" (characterized by independence conditions) as primitive.

  ### Where They Come Apart: Concrete Divergence Cases

  If they were truly notational variants, they would agree on the truth value of causal claims in every possible scenario. They do not. Here are two cases where the Lewisian Counterfactual Account and the Interventionist Account yield different results or different statuses for the causal claim.

  #### 1. Causation by Omission (The Queen and the Gardener)
  This is the strongest case for extensional divergence.

  *   **The Scenario:** A plant dies because it wasn't watered. The Gardener was hired to water it and didn't. The Queen of England was not hired to water it and didn't.
  *   **Lewisian Analysis:** Lewis relies on counterfactual dependence.
      *   "If the Gardener had watered it, the plant would have lived." (True)
      *   "If the Queen had watered it, the plant would have lived." (True)
      *   **Result:** For Lewis, both the Gardener's omission and the Queen's omission are causes. The counterfactual dependence holds for both. Lewis has to resort to extra machinery (contextual salience, "normality") to explain why we only blame the Gardener. Metaphysically, both are causes.
  *   **Interventionist Analysis:** Woodward relies on the existence of a possible intervention within a model.
      *   Causal claims are relative to a set of variables and a model.
      *   In a standard biological model of the plant, there is a variable for "Watering."
      *   However, an intervention must be *possible* (in principle) for the agent in question. More importantly, Woodward treats omissions as "quasi-causal." They are causal only relative to a model where we *expect* the intervention.
      *   **Result:** Woodward can say the Gardener is a cause and the Queen is not, not because of a metaphysical difference in the world, but because the Queen is not a variable in the relevant causal model.
      *   **The Divergence:** Lewis is committed to the Queen's omission being a *real cause* (metaphysically speaking), which many find counterintuitive. Woodward denies the claim "The Queen caused the death" is true *simpliciter*; it is only true/false relative to a model. For Lewis, causation is a relation in the world; for Woodward, it is a relation between variables in a representation.

  #### 2. Non-Modular Mechanisms (Cartwright's Critique)
  This case attacks the "notational variant" claim from the formal side.

  *   **The Scenario:** Imagine a system where you cannot change one variable without changing the structural equations governing others (a non-modular system). Nancy Cartwright argues many fundamental physical systems are like this (e.g., quantum entanglement or certain equilibrium systems where "surgical" intervention is physically impossible).
  *   **Interventionist Analysis:** Woodward's account requires **Modularity**. To say $X$ causes $Y$, there must be an intervention on $X$ that changes $Y$ *while holding the other structural equations fixed*. If the system is non-modular (you cannot break the link between $X$ and its parents without altering the law connecting $X$ to $Y$), the $do$-operator is undefined.
      *   **Result:** Interventionism says "There is no causal structure here" or "Causal talk is inappropriate."
  *   **Lewisian Analysis:** Lewis relies on similarity between worlds. Even if the actual laws of nature forbid a "surgical" break, Lewis can posit a "closest possible world" where a small miracle occurs at $X$ to make it different, while keeping the rest of the history as similar as possible.
      *   **Result:** Lewis can still evaluate the counterfactual "If $X$ had been different, $Y$ would be different" by allowing a violation of the actual laws (a miracle) in the closest world.
      *   **The Divergence:** In non-modular systems, Lewis can still assign truth values to causal claims (via miracles/similarity), whereas Interventionism declares the causal question ill-posed because the required intervention is physically impossible.

  ### Summary for Your Friend

  You can tell your friend this:

  1.  **Formally,** you are right: SCMs can encode Lewisian counterfactuals.
  2.  **Philosophically,** you are wrong: They are not notational variants because they assign different **truth conditions** to causal claims in cases of **omission** and **non-modularity**.
  3.  **Metaphysically,** I (the user) am right: The stalemate is because Lewis is trying to reduce causation to non-causal facts (which requires breaking the circle), while Woodward is trying to clarify scientific reasoning (which allows the circle).

  The debate isn't dead, but it has shifted. It is no longer about who has the "correct" analysis of the word *cause*. It is about whether we want a **metaphysics of causation** (Lewis) or a **logic of scientific explanation** (Woodward). If you want the former, Interventionism is circular. If you want the latter, Lewisian similarity is too vague to be useful. You are arguing about whether you want a map or a territory.
