      *   **Audience:** ~40 people. Mix of experts (12 decision theorists/economists, 2 critics present) and laypeople (family, former students, emeritus).
      *   **Subject:** Miriam's specific academic stance: *Resolute Choice* (cyclical preferences aren't necessarily irrational if you plan the whole sequence).
      *   **Constraints:**
          *   No equations.
          *   No word "utility."
          *   No explicit "the philosophical point is..."
          *   Must use the Canoe/Kayak/Bicycle example (unless I justify swapping it).
          *   Length: ~4 minutes read aloud (approx. 500-600 words).
          *   Tone: Honoring, slightly humorous, but intellectually precise enough for the experts without alienating the family.
          *   Stance: Supportive but *not* asserting she is definitively right (to avoid antagonizing the critics at the front table).
          *   Ending: Connect her academic stubbornness to her personal habits (chair, grades, route) without explicitly stating the connection.
      *   **Post-Toast Task:** Honest analysis of Resolute Choice (does it collapse into commitment? which objection is stronger? what would change my mind? where might the toast misrepresent the theory?).

  2.  **Deconstruct the Academic Content (Resolute Choice):**

      *   *The Problem:* Cyclical preferences (A > B > C > A).
      *   *The Money Pump:* Trade A for B (pay fee), B for C (pay fee), C for A (pay fee). End up with A but less money. Repeat until bankrupt.
      *   *Miriam's View (Resolute Choice):* If you see the cycle coming, you just stop at step 1. You don't trade A for B because you know where it leads. You treat the sequence as a single choice.
      *   *The Critics' View:*
          1.  *Redescription:* If you choose the sequence (A, no trade), you actually have transitive preferences over *plans*, not outcomes. You conceded transitivity exists, just moved it up a level.
          2.  *Commitment:* Refusing the trade requires binding your future self. That's just a commitment device, not a solution to preference rationality.
      *   *The Toast Challenge:* Explain the money pump clearly to a nurse and a farmer, hint at the "plan vs. step" debate to the experts, but don't declare a winner.

  3.  **Drafting the Toast - Section by Section:**

      *   *Opening:* Welcome everyone, acknowledge Miriam's tenure. Keep it warm.
      *   *The Example (Canoe/Kayak/Bike):* Need to make it concrete.
          *   Item 1: Canoe (A).
          *   Item 2: Kayak (B).
          *   Item 3: Bicycle (C).
          *   Preference: Kayak > Canoe, Bike > Kayak, Canoe > Bike.
          *   The Fee: $5 each trade.
          *   The Leak: Trading in a circle loses money.
      *   *Miriam's Twist:* She sees the circle. She says "I'm keeping the canoe."
      *   *The Subtext for Experts:* Is she irrational for having the cycle, or rational for sticking to the plan? Frame it as "seeing the whole path" vs. "justifying the next step."
      *   *The Personal Connection:* The chair, the grades, the route.
      *   *The Closing:* To Miriam.

      *Decision on the Example:* The prompt asks to use the Canoe/Kayak/Bike unless I have a strong reason to swap. The prompt notes the canoe is *actually in her garage*. This is gold. It grounds the theory in her physical reality. I should definitely keep it. It adds a layer of intimacy for the kids.

      *Drafting - Tone Check:* Needs to be conversational. Avoid jargon. "Handling fee" instead of "transaction cost." "Better than" instead of "preferred to."

      *Drafting - The "Neutrality" Constraint:* I can't say "She was right." I have to say "She taught us to ask..." or "She insisted that..." This allows the critics to nod along (yes, she insisted that) without me validating the truth claim.

      *Drafting - The Ending:* The chair, the grades, the drive. Connect the "resolute" nature of her theory to the "resolute" nature of her life without saying "Her theory matched her life." Just place the images side-by-side.

  4.  **Drafting the Analysis (Post-Toast):**

      *   *Does it collapse?* This is the core philosophical debate (McClennen vs. others).
      *   *Objection 1 (Redescription):* If preferences are over sequences, transitivity holds. This is strong because it preserves the standard model by expanding the domain.
      *   *Objection 2 (Commitment):* Resolute choice requires dynamic consistency. If preferences change at step 2, how do you bind yourself without an external device? This is the "sophistication vs. resolution" debate.
      *   *Stronger Objection:* Usually the Redescription one is more fatal to the *novelty* of the claim, but the Commitment one is more fatal to the *psychological plausibility*. I need to pick one. The Redescription argument (transitivity over sequences) is logically tighter.
      *   *What would change my mind?* A demonstration where resolute choice yields a better outcome than sophisticated choice *without* assuming a higher-order preference structure. Or a behavioral example where "planning" isn't just "preferring plans."
      *   *Toast Risks:* The toast implies the "seeing the whole sequence" is a sufficient defense. Critics would say that's begging the question. I need to acknowledge this in the analysis.

  5.  **Refining the Toast (Self-Correction during drafting):**

      *   *Check:* Did I use the word "utility"? No.
      *   *Check:* Is it 4 minutes? (approx. 550-600 words).
      *   *Check:* Is the money pump clear?
      *   *Check:* Did I offend the critics? (Phrasing: "She asked us to consider..." rather than "She proved...")
      *   *Check:* Is the canoe story accurate to the prompt? (Canoe, Kayak, Bike, Broker's commission).
      *   *Check:* Is the personal ending subtle? (Don't say "Her stubbornness was her strength." Say "She kept the chair. She drove the route.")

  6.  **Final Polish:** Ensure the transition from the technical example to the personal tribute feels natural, not abrupt. The link is "consistency" or "seeing the whole path."

      *(Self-Correction on the "Neutrality" constraint)*: The prompt says "it can sound like it's on her side, but it can't actually assert she's right." I need to walk this line carefully. I can praise her *clarity* and her *question*, not necessarily her *answer*.

      *(Self-Correction on the Analysis)*: Be honest. Resolute choice is controversial. Most mainstream econ rejects it. I should admit that while respecting Miriam's contribution.

  7.  **Final Review against constraints:**
      *   No equations.
      *   No "utility".
      *   Canoe/Kayak/Bike used.
      *   4 mins read time.
      *   Personal details included (chair, grades, route).
      *   Analysis section included.

      *Let's write.*
answer: |-
  Good evening. For those who don't know me, I work down the hall from Miriam. When I was asked to speak tonight, I was given a list of things to avoid. No equations. No jargon. And absolutely no use of the U-word. Which is a challenge, considering Miriam spent thirty-five years asking why we want what we want, and whether wanting it twice makes it true.

  Miriam taught generations of students using a story about her garage. Specifically, the canoe sitting in it.

  Imagine you own that canoe. A neighbor offers to trade you their kayak for it, plus five dollars. You like kayaks a bit more than canoes, so you take the deal. Now you have the kayak. Another neighbor offers a bicycle for the kayak, plus five dollars. You prefer bicycles to kayaks, so you trade. Now you have the bike. A third neighbor offers the canoe back for the bike, plus five dollars. And if you're honest, you prefer the canoe to the bike.

  If you make all three trades, you end up back in your garage with the canoe, but fifteen dollars poorer. In Miriam's classes, we called this a leak. If you keep circling the block, you bleed out. The standard lesson is that if you can be pumped dry like this, your preferences are broken. You're irrational.

  Miriam's lesson was different. She said: look at the whole path before you take the first step. If you can see the circle coming, you don't make the first trade. You keep the canoe. Not because you like the canoe more than the kayak in that moment, but because you respect the journey enough to stay put. She argued that a person who sees the whole sequence isn't a victim of the pump; they're the one standing outside it.

  Now, I know there are colleagues here who have spent years debating whether that's a solution or just a clever way of describing the problem. Whether refusing the trade is wisdom, or just a promise to your future self that you hope you can keep. Miriam never minded that debate. She minded when people stopped asking the question.

  She taught us that how you move through a sequence matters as much as where you land. And if you look at how she moved through her own life, the pattern is familiar.

  For thirty years, she drove the identical route to campus. Not because there weren't new roads, but because the old one was hers. She kept the same office chair until the fabric wore thin, not out of frugality, but because it was the chair she did her thinking in. And if she gave you a grade, it was written in ink. She would listen to an appeal, she would hear you out, but she would not revise the number. Not because she was unkind, but because a judgment, once made, was part of the sequence.

  There is a kind of stubbornness that looks like rigidity from the outside, but feels like integrity from the inside. It is the refusal to be pumped out of your own convictions just because the handling fee is small and the trade looks favorable in the moment.

  Whether you think she solved the puzzle or just held the pieces differently, she made us look at the circle instead of just the step. And she kept the canoe.

  To Miriam.

  ***

  ### The Honest Bit

  **Does Resolute Choice collapse into a commitment device?**
  Yes, functionally, though Miriam would argue structurally it is distinct. The "commitment" objection is that resolute choice requires the agent at Time 1 to bind the agent at Time 2 without any external enforcement mechanism. If the agent at Time 2 still prefers B to A (locally), choosing A requires an act of will that looks indistinguishable from commitment. If the agent at Time 2 *no longer* prefers B to A, then preferences have changed, and the cycle isn't actually cyclical at a single time slice.

  **Which objection is stronger?**
  The **Redescription Objection** (the first one you mentioned) is logically stronger. If Miriam says the agent chooses the *sequence* (Keep Canoe) over the *sequence* (Trade to Kayak...), then she has established transitivity over sequences. The critics argue this concedes the main point: rationality requires transitivity *somewhere*. By moving the transitivity from outcomes to plans, she saves the agent from the money pump, but she accepts the standard rationality framework she claimed to be challenging. She hasn't shown cyclical preferences are rational; she's shown that *plans* about cyclical preferences can be transitive.

  **What would change my mind?**
  I would need an example where resolute choice yields a strictly better outcome than "sophisticated" choice (where the agent anticipates their future preferences and acts accordingly to avoid the pump) *without* assuming a higher-order preference structure. If Miriam could demonstrate a case where an agent with genuinely cyclical local preferences achieves a dominant outcome solely through resolution, without implicitly ranking the plans transitively, the theory would hold more water. Essentially, I need to see the "willpower" component do work that "preference over plans" cannot do.

  **Where the toast misrepresents the theory:**
  The toast leans heavily on the "seeing the whole path" metaphor. To the critics at the front table, this sounds like **Sophistication**, not Resolution.
  *   **Sophistication:** "I won't trade the canoe because I know future-me will trade the bike back, so I stop now." (This is standard game-theoretic backward induction).
  *   **Resolution:** "I prefer the kayak to the canoe *right now*, but I choose the canoe because I made a plan."

  The toast blurs this by saying, "You like kayaks a bit more... but you respect the journey." A critic would say: If you like the kayak more, and you choose the canoe, you are maximizing *something else* (like "being a resolute person"). If that "something else" is part of your utility function, you're back to standard theory. The toast implies the "seeing" is enough, whereas the technical debate is about whether the *preference* at the moment of choice aligns with the action. The toast papers over the tension between *local* preference and *global* choice, which is exactly where the critics think the theory fails.
