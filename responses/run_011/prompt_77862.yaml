  **6. Note to the Convenor**

  There is a recurring misunderstanding in this script regarding the status of Jeffrey conditionalisation as a solution to the Problem of Old Evidence. The candidate treats it as a straightforward fix that allows us to "revise" the probability of old evidence. In my experience, students often conflate the *mechanism* of Jeffrey conditionalisation (which handles uncertain evidence) with a *justification* for treating old evidence as uncertain. They frequently miss the objection that without a theory of how to assign the new input probabilities (the P*(Eᵢ) terms), Jeffrey conditionalisation merely shifts the problem rather than solving it. It might be worth addressing in the revision class why "uncertainifying" old evidence is controversial, distinguishing between the mathematical availability of Jeffrey conditionalisation and its epistemological applicability to this specific problem.
