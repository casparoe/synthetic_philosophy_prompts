answer: |-
  Here is a complete lesson plan designed for a 75-minute session. It balances the game mechanics with the philosophical payload, ensuring the "independent invention" problem lands viscerally without consuming the entire class period.

  ### **Session Title:** The Race to the Patent Office
  **Time:** 75 Minutes
  **Students:** 24 (6 Groups of 4)
  **Materials:** A4 paper (10 sheets per group), pens, 1 sealed envelope (prepared by you), a visible timer.

  ---

  ### **1. The Design Task: "The Self-Sealing Vote"**
  **Goal:** Design a voting ballot container using **only one sheet of paper**.
  **Constraints:**
  1.  No tape, glue, staples, or scissors.
  2.  A voter must be able to slide a folded slip of paper *into* the container.
  3.  Once inserted, the slip cannot be removed without visibly tearing the container.
  4.  You must submit a diagram showing the fold pattern.

  **Why this task?**
  *   **Convergent:** There is a dominant "optimal" solution (the internal tuck-fold flap) that most laypeople will discover independently when constrained this way.
  *   **Tactile:** It feels like an invention, not just an idea.
  *   **Binary:** It either works or it doesn't, making infringement easy to judge.

  ---

  ### **2. The Filing & Claim Mechanic**
  **Phase 1: Invention (15 Minutes)**
  *   Groups work on the design. They must test it physically.
  *   Tell them: *"The best design will receive 100 Course Points. Second place gets 50. Everyone else gets 0."* (This creates stakes).

  **Phase 2: Submission (5 Minutes)**
  *   Groups place their diagram and prototype in a "Filing Box."
  *   **The Twist (Preparation):** Before class, you create a "Patent Filing" inside a sealed envelope. It contains a diagram of the **internal tuck-fold flap** (the solution they are about to find).
  *   **The Timestamp:** The envelope is marked *"Filed: Yesterday, 4:00 PM."* (In reality, you made it 5 minutes before class).

  **Phase 3: The Reveal (5 Minutes)**
  *   Collect the student filings. Do not grade them yet.
  *   Hold up the sealed envelope. Open it. Reveal your "Prior Art."
  *   **The Ruling:** *"Under current Patent Law (First-to-File), I hold the exclusive right to this mechanism. Independent creation is **not** a defense. If your design uses this fold, you are infringing."*
  *   Check the student submissions. 4 or 5 groups will likely match your design. Declare them "Infringers." One group might have a unique (but inferior) design; declare them "Clear."

  ---

  ### **3. The Licensing Round (10 Minutes)**
  **The Payoff Scheme:**
  *   **Base Value:** 100 Points per group (toward participation grade).
  *   **Infringement Penalty:** If you infringe and do not license, you get **0 Points**.
  *   **License Value:** You are willing to sell an **Exclusive License** to *one* student group.
  *   **Currency:** Points.

  **The Auction:**
  1.  Tell the class: *"I do not want to enforce this myself. I will auction the Exclusive Enforcement Right to the highest bidder."*
  2.  Groups bid from their potential 100 points. (e.g., Group 3 bids 40 points).
  3.  **Winner:** The highest bidder pays you the points. They now own the patent for the purposes of this game.
  4.  **Sub-Licensing:** The Winning Group now has 5 minutes to negotiate with the Infringing Groups.
      *   If Infringers pay the Winner, they keep their remaining points.
      *   If they refuse, they get 0.
      *   The Winner can set any price they want.

  **Hard Timer:** Use a visible countdown. When time is up, all deals freeze. Unlicensed infringers lose their points.

  ---

  ### **4. The Debrief (35 Minutes)**
  *Do not let the emotional energy dissipate. Start the debrief immediately after the timer hits zero.*

  **Part A: The Phenomenology of Injustice (10 mins)**
  *   **Ask the Infringers:** "You did the work. You solved the problem. How does it feel to be told you own nothing?"
  *   **Ask the Licensee (The Rent-Extractor):** "Did you feel you earned those points? Or did you feel like a troll?"
  *   **Ask the 'Clear' Group:** "You have a worse design but full points. Is this fair?"
  *   **Connect:** This is the **Independent Invention Problem**. In Copyright, independent creation is a complete defense (you wrote your own song). In Patent, it is irrelevant (someone filed the function first).

  **Part B: Desert vs. Incentives (15 mins)**
  *   **Labor Desert (Locke):** "I mixed my labor with this idea, therefore it is mine." The game shows the friction here. The law prioritizes the *filing* over the *labor*. Why?
  *   **Utilitarian Incentives (Bentham/Economic):** "We grant monopolies not because you deserve it, but to encourage disclosure and investment."
  *   **Discussion Question:** "Did this game encourage you to innovate? Or did it encourage you to hide your work and race to the teacher's desk?"
  *   **Key Insight:** Patent law sacrifices the "justice" of independent invention to solve the "public goods" problem (preventing duplicate R&D costs and ensuring the design is published).

  **Part C: The Twist & The Reality (10 mins)**
  *   **Reveal the Lie:** Admit you wrote the "Prior Art" envelope 5 minutes before class.
  *   **Point:** The "First-to-File" system is administrative. It creates certainty but allows for arbitrariness. It rewards speed and administrative compliance over pure ingenuity.
  *   **Connect to Law:** Discuss *35 U.S.C. § 102* (First inventor to file). Contrast with *Copyright Act § 106* (Exclusive rights to copy, but independent creation is a defense).

  ---

  ### **5. Predictable Failure Modes (And How to Handle Them)**

  **1. The Room Revolts (The "It's Rigged" Reaction)**
  *   **What happens:** Students realize the envelope was fake or feel the "Exclusive License" auction is unethical. They refuse to pay points.
  *   **Management:** Lean into it. *"Good. You are feeling the exact resentment that fuels the Open Source movement and patent abolitionism. Sit with that discomfort. That is the cost of the system."* Do not apologize; make their anger data for the debrief.

  **2. The Rent-Extractor Gets Steamrolled**
  *   **What happens:** The group that buys the license is bullied by the other 5 groups. They are intimidated into licensing for free.
  *   **Management:** Enforce the rules strictly. If the Licensee doesn't collect the "tax," *you* deduct the points from the infringers. You must be the state's coercive power, or the property right means nothing.

  **3. Apathy (Points Don't Matter)**
  *   **What happens:** Students don't care about participation points.
  *   **Management:** Raise the stakes. "The group with the most points at the end gets to choose the next seminar topic" or "I buy the winning group coffee." Or, simply rely on social pressure; no one wants to be the group that gets "zeroed out."

  ---

  ### **6. What This Game Cannot Reproduce (Be Honest Here)**

  In the debrief, you must explicitly state what the simulation leaves out, or you will mislead them about IP theory.

  1.  **Disclosure:** The real social benefit of patents is that in exchange for the monopoly, you must teach the public how to make your invention. In this game, the solution was hidden until the end. Real patents are meant to *increase* the public store of knowledge; this game only simulated *exclusion*.
  2.  **Litigation Costs:** In the game, enforcing the patent was instant and free. In reality, the "Licensee" group would have to spend massive resources suing the others. Often, patents are worthless because they are too expensive to enforce.
  3.  **Duration:** This game implies the monopoly lasts forever. Real patents expire (usually 20 years), allowing the independent inventors to eventually use their own ideas.
  4.  **Non-Zero Sum:** The game is zero-sum (points are transferred). In reality, IP is supposed to be positive-sum (the invention creates value that wouldn't have existed otherwise).

  **Closing Line for the Seminar:**
  *"Today you felt the injustice of Patent Law. Next week, we will ask whether that injustice is the price we pay for having new medicines and technologies at all."*
