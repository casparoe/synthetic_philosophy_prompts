answer: |-
  There is no single, household-name term for this specific inconsistency (like "Confirmation Bias" or "Sunk Cost Fallacy"). However, in environmental ethics and animal welfare philosophy, this phenomenon is widely recognized and debated.

  The closest established academic term is **The Laissez-Faire Intuition**.

  This term was popularized by philosopher Clare Palmer (specifically in her work *Animal Ethics in the Wild*). It describes the common moral intuition that while we have duties *not to harm* wild animals, we do not have duties *to help* them, unless we have specifically caused their predicament. This matches your pigeon vs. fawn example perfectly: the pigeon is a victim of human agency (triggering a duty to repair), while the fawn is a victim of natural processes (triggering no duty).

  However, "Laissez-Faire Intuition" is a bit broad. It describes the *outcome* (don't intervene) rather than the *mechanism* (because humans didn't cause it). You are asking for the carving itself—the specific cognitive move that discounts harm based on its source.

  Since there is no tight psychological label for this specific provenance-based discounting, I will name it for you.

  ### The Proposed Term: **Causal Exemption Bias**

  **Definition:**
  **Causal Exemption Bias** is the cognitive tendency to assign significantly lower moral urgency to preventing or alleviating suffering based primarily on the *origin* of the harm (natural vs. anthropogenic), independent of the severity of the suffering, the capacity to intervene, or the cost of assistance.

  Under this bias, moral responsibility is viewed as **retrospective** (based on who broke it) rather than **prospective** (based on who can fix it). Harm caused by human agency triggers a "repair" protocol; harm caused by non-human agency triggers an "acceptance" protocol, even if the resulting pain is identical.

  ### Why Existing Terms Don't Fit
  *   **Naturalistic Fallacy:** This claims nature is *good* or *right*. Your interlocutors admit the fawn's suffering is bad. They aren't saying nature is virtuous; they are saying nature is *none of our business*.
  *   **Omission Bias:** This prefers harm by inaction over harm by action. But your friend *acts* to save the pigeon. The bias isn't about acting vs. not acting; it's about *which* suffering justifies action.
  *   **Status Quo Bias:** This prefers the current state of affairs. But as you noted, interlocutors admit the wild state is full of pointless suffering. They aren't defending the *state*; they are defending the *boundary of responsibility*.

  ### Boundary Cases
  Here is how **Causal Exemption Bias** applies to the specific scenarios you raised, and where the lines are drawn.

  **1. Reluctance to help wild animals merely because they are wild.**
  *   **Verdict:** **Inside the bias.**
  *   **Reasoning:** "Wildness" is used as a proxy for "non-human cause." If a wild animal is suffering due to a human (oil spill, car strike), the bias vanishes and intervention becomes mandatory. If the suffering is due to predation or disease, the bias activates. The moral weight shifts not because the animal's capacity for suffering changed, but because the *cause* did.

  **2. Natural Flood vs. Dam Failure.**
  *   **Verdict:** **Inside the bias.**
  *   **Reasoning:** In both cases, people are displaced and suffering. However, a dam failure triggers lawsuits, congressional hearings, and a frantic drive to prevent recurrence (moral outrage). A natural flood triggers aid and sympathy, but often a shrug regarding prevention ("you can't stop the rain"). The *urgency to prevent future harm* is discounted in the natural scenario because no human agent is liable, despite the identical outcome.

  **3. Disease in Wild Populations vs. Human/Livestock Populations.**
  *   **Verdict:** **Inside the bias.**
  *   **Reasoning:** We spend billions eradicating diseases in humans and livestock (anthropogenic spheres of responsibility). We often oppose vaccinating wild populations against the same diseases (e.g., rabies in foxes, tuberculosis in badgers) under the guise of "ecosystem integrity."
  *   **Boundary Condition:** This bias weakens if the disease is **zoonotic** (can jump to humans). Once the harm threatens the human sphere, it becomes "our problem," and the Causal Exemption is revoked. This proves the bias is about *responsibility boundaries*, not the suffering itself.

  ### Why This Bias Exists
  Understanding the mechanism helps solidify the definition. Causal Exemption Bias likely stems from two psychological heuristics:

  1.  **Complicity Avoidance:** We are hardwired to manage our social reputation. Fixing a problem we caused removes blame (restoring "clean hands"). Fixing a problem we didn't cause is "charity," which is optional. We conflate *moral obligation* with *liability*.
  2.  **Competence Heuristic:** We assume human systems are within our control (and thus our responsibility), while natural systems are complex, chaotic, and "above our pay grade." Intervening in nature feels like hubris ("Playing God"), whereas intervening in human systems feels like maintenance.

  ### How to Use the Term
  You can now identify the move in conversation.

  *   **Identify:** "You're applying **Causal Exemption Bias**. You agree the suffering is bad, and you agree we *could* help, but you're withholding moral urgency solely because humans didn't start the causal chain."
  *   **Challenge:** "If moral obligation is based on *capacity to relieve suffering* rather than *liability for causing it*, does the origin of the harm actually matter? If you walk past a drowning child, it doesn't matter if you pushed them in or if they slipped; the obligation to save them is based on your ability to act, not your prior causality."

  This carving isolates the exact inconsistency you noticed: the shift from a **Needs-Based Ethics** (help because it suffers) to a **Liability-Based Ethics** (help because we broke it), applied selectively to the natural world.
