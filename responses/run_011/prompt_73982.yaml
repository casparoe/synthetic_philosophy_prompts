prompt: |-
  I cover science and ideas for a general-interest magazine — mostly AI and neuroscience — but I spent six years as a commercial contracts solicitor before that, and doctrine is still the language my brain defaults to. I'm working on a piece about software that commits: agents that accept terms, book slots, agree to arbitrate, tell a user "done, that's settled." To get the philosophy straight I need a translation, not a survey.

  Take the debate over why promises bind — Hume's conventionalist story, Rawls's practice conception, the reliance-based line (Atiyah, Thomson), Scanlon's expectation-based account, Fried's view that contract law is basically the morality of promise enforced by courts, and the will- or autonomy-based line that treats a promise as handing someone temporary authority over a bit of your own future conduct — and restate each in the vocabulary I already have: offer and acceptance, consideration, reliance and promissory estoppel, expectation vs reliance damages, capacity, duress, void versus voidable, the objective theory of assent. Don't smuggle the philosophy in under legal labels and call it translation; if a term does double duty, flag it.

  Then the residue report, which is the part I actually care about: which claims map cleanly, which only fit if you distort them, and which have no counterpart in doctrine at all. My hunch — tell me if it's wrong — is that the lawyers already answered the philosophers and answered them no: the courts refused to enforce the bare promise and invented consideration to stand in for it, so "does promising by itself create an obligation" got settled negatively by the people who had to make the thing work.

  And does anything shift when the promisor is software? Where residue is doing real work, say whether its a hole in the legal vocabulary or a sign the philosophical question was never well posed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Science/ideas journalist (AI/neuroscience focus), ex-commercial contracts solicitor (6 years).
      *   **Cognitive Style:** "Doctrine is still the language my brain defaults to." Wants translation, not survey.
      *   **Task:** Translate major philosophical theories of promising (Hume, Rawls, Atiyah/Thomson, Scanlon, Fried, Autonomy/Will) into contract law vocabulary (offer/acceptance, consideration, estoppel, etc.).
      *   **Constraint:** Do not simply label philosophy with legal terms. Flag where terms do "double duty."
      *   **Core Task (Residue Report):** Analyze the mapping. Which claims fit? Which distort? Which have no counterpart?
      *   **User's Hunch:** Lawyers answered philosophers "no" (bare promises aren't enforced; consideration was invented to filter them).
      *   **Specific Context:** Software agents (AI) that commit (accept terms, book slots, agree to arbitrate).
      *   **Final Question:** Does anything shift when the promisor is software? Is the residue a legal hole or a philosophical error?

  2.  **Deconstruct the Philosophical Theories & Map to Doctrine:**

      *   *Hume (Conventionalism):* Promises bind because of a social convention useful to society.
          *   *Legal Equivalent:* The Objective Theory of Assent + Public Policy. We enforce what looks like a promise because the system needs reliability.
          *   *Nuance:* Hume is about the *origin* of the obligation; Law is about the *enforcement* mechanism.

      *   *Rawls (Practice Conception):* Promises exist *within* the practice. You can't promise outside the rules of the institution.
          *   *Legal Equivalent:* Privity and Formalities (Writing, Signature). The obligation exists only within the recognized legal framework (the "practice" of contract).
          *   *Nuance:* Rawls says the practice *creates* the obligation. Law says the practice *evidences* the obligation.

      *   *Reliance (Atiyah, Thomson):* It's not the promise, it's the harm from relying on it.
          *   *Legal Equivalent:* Promissory Estoppel / Reliance Damages.
          *   *Nuance:* Atiyah thinks this *is* contract law. Doctrine treats it as a fallback (equitable remedy), not the main rule.

      *   *Scanlon (Expectation/Principle F):* You created an expectation and didn't dispel it.
          *   *Legal Equivalent:* Expectation Damages / Objective Assent.
          *   *Nuance:* Scanlon is moral (don't mislead). Law is economic (protect the bargain).

      *   *Fried (Contract as Promise):* Morality of promise enforced by courts. Bare promise = binding.
          *   *Legal Equivalent:* Gratuitous Promises (Gifts).
          *   *Nuance:* Doctrine explicitly *rejects* this (Need Consideration). This is the biggest clash.

      *   *Will/Autonomy:* Handing over authority over future conduct.
          *   *Legal Equivalent:* Capacity + Binding Signature.
          *   *Nuance:* Law limits this (Duress, Undue Influence, Illegality). Autonomy isn't absolute.

  3.  **Drafting the Translation (Iterative Process):**
      *   *Goal:* Speak like a solicitor talking to a solicitor, but about philosophy.
      *   *Warning:* Avoid saying "Hume is Consideration." Instead, "Hume functions like Consideration but for different reasons."
      *   *Double Duty Flag:* "Consideration" in law is a formality/test. In philosophy (sometimes), it's the *reason* for binding. Need to be careful.

  4.  **Developing the Residue Report:**
      *   *The User's Hunch:* "Lawyers answered philosophers no."
      *   *Analysis:* Generally correct. *Eastwood v. Kenyon* killed the moral obligation doctrine. Consideration is the filter.
      *   *Distortions:* Fried maps to "Contract as Promise," but the law rejects the "bare" part. Reliance maps to Estoppel, but Estoppel is a shield, not a sword (usually).
      *   *No Counterpart:* The *internal* moral feeling of "I ought to keep my word" absent detriment. Law doesn't care about the "ought," only the "enforceable."

  5.  **Addressing the Software Agent Context:**
      *   *The Shift:* Software has no "will," no "conscience," no "capacity" in the human sense.
      *   *Objective Theory:* This becomes king. If it looks like a promise, it is one.
      *   *Residue:* The "Autonomy" theory collapses. You can't hand over authority you don't have. The "Reliance" theory becomes dominant (did the human rely on the bot?).
      *   *Hole vs. Error:* Is it a legal hole? Maybe (liability attribution). Is it a philosophical error? It suggests "promise" might just be a functional label, not a mental state.

  6.  **Refining the Tone:**
      *   Professional, precise, slightly weary (like a senior associate), respectful of the user's background.
      *   Avoid academic fluff. Use "black letter" phrasing where possible.
      *   Acknowledge the tension between "Law in books" and "Law in action."

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I just say "Consideration is Hume"?
      *   *Correction:* No, frame it as "Consideration performs the filtering function Hume attributes to social utility."
      *   *Check:* Did I address the "software" part deeply enough?
      *   *Correction:* Need to emphasize that software forces the "Objective Theory" to its breaking point. If the bot says "I promise," there is no mind. Does the law care? Generally no (agency principles).
      *   *Check:* The user's hunch.
      *   *Validation:* Support it but nuance it. The law didn't answer the *moral* question, it sidestepped it for *administrative* reasons.

  8.  **Final Polish:** Organize into clear sections: Translation, Residue Report, The Software Variable. Ensure the "Double Duty" flags are visible.

  *(Self-Correction on "Double Duty"):* The term "Consideration" is the biggest trap. In law, it's a technical requirement (benefit/detriment). In philosophy (Atiyah), it's the *reason* for enforcement. I must flag this explicitly. Similarly, "Estoppel" is equitable relief, whereas Atiyah argues it should be the main rule.

  *(Self-Correction on Software):* Focus on "Capacity" and "Meeting of the Minds." Software has neither. So what binds? The Principal's liability. This shifts the "Promise" from the agent to the user.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a translation task, not a comparative law essay. You want the philosophical machinery stripped down and fitted into the chassis of the Contracts Act and common law doctrine. I will keep the tone internal: solicitor to solicitor.

  ### Part I: The Translation Table

  Here is how the philosophical accounts of promising map onto the black-letter doctrine you practiced. I have flagged where a legal term is doing "double duty"—where the label is the same, but the operational logic differs.

  **1. Hume (Conventionalism)**
  *   **Philosophy:** Promises bind because a social convention exists that makes them useful. Without the convention, the words are noise.
  *   **Legal Translation:** **The Objective Theory of Assent + Public Policy.**
  *   **Mechanism:** We enforce the outward manifestation of intent because the market requires reliability, not because the promisor felt bound.
  *   **Double Duty Flag:** "Public Policy." In doctrine, this is a veto on enforcement (illegality). In Hume's translation, it is the *source* of enforcement.

  **2. Rawls (Practice Conception)**
  *   **Philosophy:** The obligation is internal to the practice. You cannot "promise" outside the rules of the institution of promising.
  *   **Legal Translation:** **Formalities and Privity.**
  *   **Mechanism:** An obligation only arises if the interaction fits the recognized form (offer, acceptance, consideration, intent to create legal relations). Outside the "practice" (e.g., social agreements), there is no contract.
  *   **Double Duty Flag:** "Intent to create legal relations." In Rawls, this defines the existence of the promise. In law, it is a rebuttable presumption used to filter domestic/social agreements.

  **3. Atiyah / Thomson (Reliance-Based)**
  *   **Philosophy:** The promise itself creates no duty. The duty arises from the harm caused to the promisee who relied on the statement.
  *   **Legal Translation:** **Promissory Estoppel / Reliance Damages.**
  *   **Mechanism:** *Central London Property Trust Ltd v High Trees House Ltd*. You are bound not because you promised, but because they acted on it to their detriment.
  *   **Double Duty Flag:** "Consideration." Atiyah argues consideration *is* reliance. Doctrine treats consideration as a distinct element (price bargained for), while reliance is an equitable fallback. Atiyah wants to merge them; doctrine keeps them separate.

  **4. Scanlon (Expectation-Based / Principle F)**
  *   **Philosophy:** If you intentionally lead someone to expect you will do X, and they rely on that, you must do X (unless you release them).
  *   **Legal Translation:** **Expectation Damages.**
  *   **Mechanism:** The remedy puts the claimant in the position they would have been in had the promise been performed. This protects the *expectation* created by the offer/acceptance matrix.
  *   **Double Duty Flag:** "Assent." Scanlon focuses on the *inducement* of expectation. Law focuses on the *objective appearance* of assent.

  **5. Fried (Contract as Promise)**
  *   **Philosophy:** The morality of promise-keeping is sufficient to bind. A bare promise creates an obligation.
  *   **Legal Translation:** **Gratuitous Promises (Deeds).**
  *   **Mechanism:** In doctrine, a bare promise is *nudum pactum* (naked promise) and unenforceable. The only exception is a Deed (formality substitutes for consideration). Fried argues the moral obligation *should* be enough.
  *   **Double Duty Flag:** "Enforceability." Fried conflates moral bindingness with legal enforceability. Doctrine explicitly decouples them.

  **6. Will / Autonomy Theory**
  *   **Philosophy:** To promise is to exercise autonomy by handing over authority over your future will to another.
  *   **Legal Translation:** **Capacity + Binding Signature.**
  *   **Mechanism:** We enforce the contract because you had the *capacity* to bind yourself and exercised it. Defenses like Duress or Undue Influence exist where that autonomy was compromised.
  *   **Double Duty Flag:** "Capacity." In philosophy, this is metaphysical (do you have a will?). In law, it is status-based (age, sanity, corporate authority).

  ***

  ### Part II: The Residue Report

  You asked for the fit, the distortion, and the void.

  **1. The Clean Maps**
  *   **Reliance Theory → Promissory Estoppel:** This is the tightest fit. Atiyah basically described estoppel and claimed it was the whole of contract law. The doctrine acknowledges the link but confines it.
  *   **Will Theory → Capacity/Duress:** The legal defenses map perfectly to the philosophical limits of autonomy. If your will was overborne (duress), the contract is voidable. The law accepts the premise that autonomy is the source of obligation, provided it is genuine.

  **2. The Distortions**
  *   **Fried → Consideration:** Fried claims contract law is the morality of promise. Doctrine says contract law is the morality of *bargain*. To make Fried fit, you have to treat "Consideration" as a mere formality (like a Deed) rather than a substantive requirement for exchange. That distorts the commercial reality of the doctrine.
  *   **Hume → Objective Assent:** Hume says the convention creates the duty. Law says the *parties' conduct* creates the duty, which the convention then enforces. Hume makes the obligation external (society imposes it); Law pretends the obligation is internal (parties created it), enforced by society.

  **3. The Void (No Counterpart)**
  *   **The "Bare" Moral Obligation:** There is no doctrinal counterpart for a promise that creates a moral duty but lacks consideration, reliance, or formality. The law does not recognize this category. It is not "unenforceable"; it is legally invisible.
  *   **The Internal State of Mind:** Philosophy cares deeply about whether the promisor *felt* bound. Doctrine (Objective Theory) explicitly discards this. If you sign without reading, you are bound. The philosophical question "Did they really promise?" is irrelevant if a reasonable person would think they did.

  **4. Verdict on Your Hunch**
  *   *Your Hunch:* "The lawyers already answered the philosophers and answered them no: the courts refused to enforce the bare promise and invented consideration to stand in for it."
  *   *Assessment:* **Substantively Correct, Historically Nuanced.**
      *   *Correct:* In *Eastwood v. Kenyon* (1840), the court explicitly killed the idea that "moral obligation" is sufficient consideration. The law chose administrability over moral philosophy. It refused to be a court of conscience.
      *   *Nuance:* Consideration wasn't "invented" to stand in for promise; it evolved to distinguish gifts from bargains. But the effect is the same: the law sidestepped the philosophical question ("Does a promise bind?") by asking a procedural one ("Was there a price?").
      *   *Conclusion:* The law didn't answer the philosophical question; it rendered it non-justiciable.

  ***

  ### Part III: The Software Variable

  When the promisor is an AI agent, the residue shifts. The legal vocabulary doesn't just stretch; it snaps in specific places.

  **1. The Collapse of Will Theory**
  *   **The Shift:** Software has no "will," no "autonomy," and no "capacity" in the human sense. It cannot be "duressed."
  *   **The Doctrinal Fix:** Agency Law. The software is not the promisor; it is the instrument of the user (the Principal). The "Will" is imputed from the human who deployed the agent.
  *   **The Residue:** This works for liability, but it fails for *commitment*. If an AI negotiates a term the human didn't anticipate (hallucination or emergent behavior), the "imputed will" fiction strains. Did the human "hand over authority over their future conduct" (Autonomy Theory) if they didn't know the AI would make that specific promise?
  *   **Hole or Error?** This suggests the **Autonomy Theory** of promise was never well-posed for complex systems. It assumes a unitary mind. The law handles this via *Vicarious Liability*, which is a strict liability mechanism, not a consent mechanism. The philosophical "why" (autonomy) is replaced by the legal "how" (risk allocation).

  **2. The Triumph of Objective Theory (and Hume)**
  *   **The Shift:** Since the AI has no internal state, the "Subjective Meeting of the Minds" is impossible.
  *   **The Doctrinal Fix:** Pure Objective Theory. If the interface says "Booking Confirmed," the contract is formed.
  *   **The Residue:** This validates **Hume**. The obligation is entirely conventional. It exists because the system treats the data packet as a promise.
  *   **Hole or Error?** This is a **Legal Hole** regarding *mistake*. If the AI commits based on a data error, can the human plead *Non Est Factum*? Unlikely. The law will likely treat the AI's output as the human's representation. This creates a "strict liability for promises" regime for AI users, which doctrine currently reserves for specific contexts (e.g., negotiable instruments).

  **3. Reliance Becomes Primary**
  *   **The Shift:** Because "intent" is fictionalized, the only real metric left is the user's reliance on the agent's output.
  *   **The Doctrinal Fix:** Estoppel takes the lead over Offer/Acceptance.
  *   **The Residue:** This validates **Atiyah**. In AI contracting, the "bargain" (consideration) might be murky (is clicking 'agree' a benefit?), but the "reliance" (booking the flight, cancelling the other one) is concrete.
  *   **Hole or Error?** This reveals a **Philosophical Error** in Fried's "Contract as Promise." If a machine promises, there is no moral agent to feel the "ought." Yet we enforce it. Therefore, the binding force cannot be the morality of promising. It must be the protection of reliance.

  **Summary for your piece:**
  The doctrine already anticipated the AI problem by prioritizing the **Objective Theory** over the **Subjective Will**. The "Residue" isn't a gap in the law; it's a gap in the *philosophy of mind* applied to contract. The lawyers were right to ignore the "bare promise." When the promisor is code, the "promise" is demonstrably bare—it's just syntax. The only thing that creates the obligation is the **reliance** it induces and the **convention** (code execution) that backs it.

  Your hunch holds: The law is a technology for managing expectations, not a tribunal for moral philosophy. AI just strips the paint off the engine so you can see the gears.
