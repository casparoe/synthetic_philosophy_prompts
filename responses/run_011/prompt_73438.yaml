prompt: |-
  I am a novelist, and for the past two years I have been circling an essay that began as a craft problem rather than a philosophical one. It is now long enough that I can no longer tell whether its central claim is doing real work or merely redescribing, in borrowed vocabulary, something every working novelist already believes about fiction. I have condensed the draft below. I would like comments of two kinds: first, on the accuracy of the philosophy, which I have learned piecemeal and may have garbled; second, on whether the literary thesis actually follows from it or only sounds as though it does.

  **Draft**

  Most plots are machines for producing a single ordering. A protagonist faces alternatives, and the novel arranges the world so that one of them turns out to be better, or so that the costs can be settled against the gains at the end. Melodrama, as I am using the word, is what happens when that settlement is made explicit: the reconciliation at the deathbed, the restored estate, the reputation repaired. Suspense, correspondingly, depends on our ignorance of the ordering rather than on there being no ordering to find.

  Against this I want to set the kind of scene I am trying to write, for which I have adopted a term of my own: a parity scene. Two options are rendered in sufficient detail that a reader can appreciate each on its own terms; the reader is not, at the end, in a position to rank them; and the character must nevertheless choose. The expressive work is done by the conjunction of those three facts — the reader's failure to rank and the character's inability to abstain. My contention is that such a scene is not the dramatization of a dilemma in the ordinary critical sense, meaning a case in which both options are bad, or in which one obligation collides with another. It is the dramatization of a choice among options between which neither betterness, nor worseness, nor exact equality holds, because the consideration under which we compare them simply runs out.

  Two supports for the distinction. The first is structural. Suppose a novel presents a life left behind and a life taken up, and a sequel improves the life taken up by a trivial increment — a little more money, a slightly kinder household. The improved life is plainly better than its unrevised version, and yet it does not thereby become better than the life abandoned. If the two lives had been precisely equal in worth, the improvement ought to have carried across the comparison and broken the tie. It does not. So they were not equal; nor is either better. That is the shape of argument I have in mind, and it seems to me available to narrative in a way it is not available to discursive prose, because a sequel can perform the small improvement in time rather than merely describe it.

  The second support concerns what happens afterward. Bernard Williams's discussion of the regret owed by an agent who causes a terrible harm without fault — the driver who kills a child though nothing was wrong with his vehicle or his conduct — suggests that the residue of a choice is not proportional to how badly the agent chose. In my terms, the mark of a parity scene on the page is a character who is not at peace with the option he took and who cannot be shown to have taken the worse one. A character who chooses and is untroubled has, whether or not the author intended it, been written as someone facing comparable alternatives. Sentimentality is the suppression of residue.

  **Where I want your comments**

  1. Please tell me plainly where I have misdescribed the philosophy. My understanding is that the standard picture admits three comparisons — better, worse, and equally good — and that Ruth Chang argues for a fourth, parity, on which two items are comparable without any of the three holding; that Joseph Raz, by contrast, defends genuine incomparability, on which no comparison holds at all; that John Broome and others treat the appearance of incomparability as an artifact of vagueness; and that a further view treats it as mere ignorance of which comparison in fact obtains. Have I got any of these wrong, flattened a distinction, or credited the wrong person? Do not spare the small errors, since the essay will be read by philosophers as well as critics.

  2. My draft slides between parity and incomparability, partly because the longer word reads better in a sentence about novels. Tragedy, as critics use the term, seems to concern irrecoverable loss — that is, incomparability — rather than parity. Is there a version of my claim that survives the correction, or does the claim depend on the slide?

  3. The strongest objection I can construct is this: readers do rank. When I put the scene in front of a workshop, someone says the character should have stayed, and gives reasons, and most of the room agrees. On that showing, my parity scene is just suspense with poor information design, and the appearance of unrankability is epistemic. I have two replies — that the reasons offered are post hoc and unstable from reader to reader, and that the same scene looks like a hard choice to one reader and a clear choice to another precisely because the covering consideration is itself contested — but neither convinces me. Do either of them have force? Is there a better reply, or should I concede the point and narrow the claim?

  4. If the vagueness account is right, then what I have been calling a parity scene is a scene about a borderline case, which strikes me as a much less interesting thing to be writing. Would adopting that account cost me the thesis, or could the thesis be restated so that vagueness does no damage?

  5. Finally, and most bluntly: is my coinage earning its keep, or is a parity scene simply a tragic dilemma wearing a new label? I would rather cut the essay than publish a neologism that names nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist writing an essay on craft/philosophy.
      *   **Task:** Provide feedback on a draft essay condensing a philosophical argument about "parity scenes" in fiction.
      *   **Specific Requests:**
          1.  Check accuracy of philosophical attributions (Chang, Raz, Broome, etc.).
          2.  Address the slide between "parity" and "incomparability" (and its relation to tragedy).
          3.  Address the objection that readers *do* rank (epistemic vs. ontological unrankability).
          4.  Address the "vagueness" account (Broome) and its impact on the thesis.
          5.  Evaluate the utility of the coinage "parity scene" vs. "tragic dilemma."
      *   **Tone:** Professional, rigorous, respectful of both philosophical precision and literary intuition. The user is smart and wants "plain" truth, not fluff.

  2.  **Deconstruct the Draft:**
      *   **Core Claim:** Most plots enforce an ordering (A > B). "Parity scenes" present A and B where neither is better, worse, nor equal, yet a choice must be made.
      *   **Philosophical Basis:** Ruth Chang's "parity" (comparable but not better/worse/equal).
      *   **Support 1 (Structural):** Small improvements in one option don't break the tie with the other (Chang's "Small Improvement Argument").
      *   **Support 2 (Residue):** Agent regret without fault (Williams), implying the choice wasn't clearly "wrong" but still leaves a mark.
      *   **Goal:** Distinguish this from standard dilemmas (bad vs. bad) or suspense (ignorance of ordering).

  3.  **Address Question 1: Philosophical Accuracy:**
      *   *Chang:* Yes, she argues for a fourth relation: parity. Items are in the same "covering value" but neither is better, worse, nor equal. The "Small Improvement Argument" is her signature move. The draft gets this mostly right.
      *   *Raz:* He argues for *incomparability*. If two options are incomparable, reason runs out entirely. They aren't even comparable. The draft distinguishes this ("neither betterness... nor exact equality holds, because the consideration... runs out"). This is slightly tricky. For Chang, the consideration *doesn't* run out; it just yields parity. For Raz, it does run out. The draft says "consideration... runs out," which sounds more like Raz/incomparability than Chang/parity. *Correction needed:* Chang says they are comparable *via* parity. Raz says they are not comparable.
      *   *Broome:* He argues for vagueness. "Better than" is vague. It's not a fourth relation; it's a borderline case of "better than." The draft mentions this correctly.
      *   *Ignorance/Epistemic:* The draft mentions this ("merely redescribing..."). Correct.
      *   *Williams:* The "moral luck" / agent-regret point. The draft uses this to support the "residue" of choice. This is a fair application, though Williams focuses more on luck/fault than strict comparability.
      *   *Verdict:* The main error is conflating Chang's "parity" (a positive relation) with Raz's "incomparability" (absence of relation) in the definition ("consideration... runs out").

  4.  **Address Question 2: Parity vs. Incomparability (and Tragedy):**
      *   *The Slide:* The draft admits sliding between them. This is dangerous philosophically but maybe useful literarily.
      *   *Tragedy:* Tragedy often involves incomparability (loss that cannot be weighed). Parity implies a kind of equilibrium that allows choice without clear rational determination.
      *   *Survival:* The thesis survives if focused on the *experience* of the choice rather than the metaphysical status. If the character *experiences* them as on a par (Chang), the narrative effect is the same. However, if the claim is about the *structure* of value, the distinction matters.
      *   *Advice:* Stick closer to Chang for the "choice" aspect (you can choose, reason doesn't dictate), but acknowledge Raz for the "loss" aspect. Don't rely on the slide; clarify which one creates the specific narrative tension. Chang is better for "hard choices" where you must commit. Raz is better for "tragic loss" where reason is silent.

  5.  **Address Question 3: The Objection (Readers Do Rank):**
      *   *The Objection:* If readers argue A > B, isn't it just epistemic uncertainty?
      *   *User's Replies:* 1. Reasons are post hoc/unstable. 2. Covering consideration is contested.
      *   *Analysis:* Reply 1 is weak (post hoc rationalization happens in real hard choices too). Reply 2 is stronger (incommensurability of values).
      *   *Better Reply:* The "Phenomenological Claim." The essay isn't about whether an Archimedean point exists in the universe; it's about whether the *narrative* successfully withholds the ranking. If the text prevents the reader from settling, it functions as parity *for the reader*. Also, Chang argues that in hard choices, reason *underdetermines* the choice. Readers ranking it might be imposing an external framework not available to the character.
      *   *Concession:* Acknowledge that *some* readers will rank. The claim should be about the *textual design* aiming to resist ranking, not the universal psychological effect.

  6.  **Address Question 4: Vagueness (Broome):**
      *   *The Worry:* If it's just vagueness, is it less interesting?
      *   *Analysis:* Not necessarily. A "borderline case" in narrative is still a zone of tension. However, Chang's parity is more robust for *agency*. If it's just vagueness, eventually more information clears it up. If it's parity, more information *doesn't* clear it up (Small Improvement Argument).
      *   *Restatement:* If you adopt vagueness, the "parity scene" becomes a scene where the narrative *sustains* the vagueness rather than resolving it. The thesis shifts from "metaphysical parity" to "narrative resistance to precision." This is still a valid craft point.

  7.  **Address Question 5: Is the Coinage Useful? (Parity Scene vs. Tragic Dilemma):**
      *   *Tragic Dilemma:* Usually implies A vs. B where both are bad (Sophocles). Or A vs. B where duty conflicts with duty.
      *   *Parity Scene:* A vs. B where both are *good* (or viable) but different in kind, and reason doesn't pick.
      *   *Distinction:* A tragic dilemma often leaves guilt (you did wrong). A parity choice leaves regret/residue but not necessarily moral failure.
      *   *Verdict:* The coinage earns its keep *if* it distinguishes "Hard Choice" (Chang) from "Tragic Conflict." Most "dilemmas" in fiction are actually melodramas (one is clearly right). A "parity scene" is specifically where the *rational justification* is absent, requiring an act of will (commitment) rather than calculation. This is a distinct narrative beat.

  8.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the quality of the draft. It's sharp.
      *   **Section 1 (Philosophy):** Correct the Chang/Raz distinction. Clarify "runs out."
      *   **Section 2 (Parity vs. Incomparability):** Advise sticking to Chang for *choice*, Raz for *loss*. Don't slide; pick the mechanic you need.
      *   **Section 3 (Reader Ranking):** Strengthen the argument. Focus on "underdetermination" vs. "ignorance." The text should block the ranking, not just hide it.
      *   **Section 4 (Vagueness):** It doesn't kill the thesis. It changes it to "sustained indeterminacy."
      *   **Section 5 (Coinage):** Yes, keep it. Distinguish from "tragic dilemma" (bad/bad) and "melodrama" (good/bad). Parity is (good/good or kind/kind).
      *   **Conclusion:** Encouraging closing.

  9.  **Refine the Tone:** Ensure I sound like a peer reviewer who respects the writer's intellect. Avoid condescension. Be precise on the philosophy (Chang's "Small Improvement Argument" is key here).

      *(Self-Correction during drafting)*: I need to be careful with Williams. Williams talks about "agent-regret" in the context of moral luck (the lorry driver). The draft uses this to say "residue exists even if choice wasn't worse." This is a slight stretch of Williams but philosophically defensible in the context of "remainder." I should note that Williams isn't talking about parity specifically, but the *phenomenology* fits.

      *(Refining the Reader Objection)*: The user's worry is that if readers rank it, it's just suspense. I need to emphasize that Chang's point is that *reasons run out*. If readers supply reasons, they are bringing outside values. The *text* must not supply them. The distinction is between *epistemic* (I don't know the value) and *ontological/normative* (there is no fact of the matter about the value). The essay needs to argue the text creates the latter experience.

  10. **Final Polish:** Check against all 5 specific questions in the prompt. Ensure clear headings.

  **(Post-Drafting Review):** Does this answer the prompt directly? Yes. Is the philosophy accurate? Yes, specifically the Chang vs. Raz distinction. Is the literary advice sound? Yes, focusing on the "act of will" vs. "calculation."

  Let's write the response.cw
answer: |-
  This is a remarkably sharp draft. It avoids the usual pitfalls of "philosophy for poets" by engaging with specific arguments (Small Improvement, Agent-Regret) rather than vague notions of "ambiguity." You are right to worry about the precision, however; philosophers will spot the conflation of parity and incomparability immediately, and critics will spot if the mechanism doesn't actually produce the intended effect.

  Here are my comments on your five points.

  ### 1. Accuracy of the Philosophy

  You have the landscape mostly right, but there is one significant error in how you characterize Chang versus Raz, and a nuance regarding Williams.

  *   **Chang vs. Raz:** You write that in a parity scene, "the consideration under which we compare them simply runs out." This is actually **Raz's** definition of *incomparability*. For Raz, if two items are incomparable, there is no common metric; reason is silent.
      *   **Ruth Chang's** argument for *parity* is precisely that the consideration does *not* run out. The items are comparable (they are in the same "covering value," e.g., career choices), but they stand in a fourth relation. They are "on a par." The Small Improvement Argument (which you cite in your structural support) is designed to prove that they are not equal, not better/worse, but *still comparable*.
      *   **Correction:** If you are using Chang, you must say the considerations *do not* run out; rather, they fail to determine a ranking. If you say the consideration runs out, you are arguing for Raz's incomparability. You cannot have it both ways in the definition.
  *   **Broome:** Your summary is accurate. Broome argues that "better than" is vague, so there is no fourth relation, only a borderline zone where it is indeterminate whether A is better than B.
  *   **Williams:** You are applying Williams's "agent-regret" (from *Moral Luck*) slightly outside its original context. Williams uses the lorry driver example to show that one can feel regret without moral fault. You are using it to show that regret persists even when the choice wasn't "worse." This is a defensible extension, but be careful not to imply Williams was arguing about parity. He was arguing about the *residue* of action in a world of moral luck. It supports your second point well, provided you don't attribute the theory of value to him.

  ### 2. Parity vs. Incomparability (and Tragedy)

  You ask if the claim survives correcting the slide. **Yes, but it changes the nature of the scene.**

  *   **If it is Parity (Chang):** The character faces two viable goods that are comparable but unrankable. The choice requires an act of *will* or *commitment* to create a reason where none existed before. This is active. It fits the "novelist's problem" of a character making a hard choice.
  *   **If it is Incomparability (Raz):** The character faces two different kinds of value that cannot be weighed against each other (e.g., a moral duty vs. an aesthetic good). Reason is silent. This is more passive; it is often the structure of tragedy (Antigone: family law vs. state law).
  *   **The Slide:** The slide weakens the essay because it blurs *why* the character chooses. In Parity, they choose to define themselves. In Incomparability, they choose often arbitrarily or because one value overwhelms the other non-rationally.
  *   **Recommendation:** Stick to **Chang's Parity**. It is more useful for craft. It explains why the character must choose *now* (suspense) but why the text cannot validate the choice (anti-melodrama). Tragedy (incomparability) often implies destruction. Parity implies a life lived with residue. That is a more novelistic condition than the tragic one.

  ### 3. The Objection: "Readers Do Rank"

  This is the strongest threat to your thesis. If readers rank the options, is it just suspense (epistemic uncertainty)?

  Your current replies are too defensive. Here is a stronger formulation:

  *   **Underdetermination vs. Ignorance:** Suspense relies on *ignorance* (the ranking exists, I just don't know it). Parity relies on *underdetermination* (the ranking does not exist yet).
  *   **The Reader's Role:** When workshop readers rank the options, they are often importing a "covering consideration" that the *text* has deliberately excluded. For example, if a character chooses between Art and Love, a reader might say, "Art is better because it lasts." But if the novel has constructed the world so that "lasting" is not a valid metric for that character, the reader is ranking from outside the text's normative framework.
  *   **The Fix:** Narrow your claim. Do not claim that *no reader will ever rank them*. Claim that the **textual design** refuses to supply the sufficient reason for the ranking. The "parity scene" is one where the narrative voice withholds the adjudicating metric. If readers rank it, they are doing work the novel refused to do. That makes the scene a parity scene *by design*, even if some readers resolve it *by force*.
  *   **Concession:** Concede that perfect parity is an asymptote. The goal is to maximize the resistance to ranking, not to guarantee it for every mind.

  ### 4. The Vagueness Account (Broome)

  If Broome is right, does your thesis die? **No.**

  If "parity" is just "vagueness," then a parity scene is a scene that **sustains the vagueness** rather than resolving it.
  *   Most novels resolve vagueness by Act Three (the fog clears, we see who was right).
  *   Your thesis is about novels that *maintain* the borderline status.
  *   **Restatement:** You don't need to commit to the metaphysics of value. You can frame it phenomenologically. "Whether due to parity, incomparability, or vagueness, the narrative effect is the same: the reader is denied the comfort of a settled ordering."
  *   However, Chang's view is more robust for your "Small Improvement" argument. If it were just vagueness, a "little more money" (your sequel example) should eventually tip the scale. Chang argues it doesn't. If you want to keep the "Small Improvement" support, you need Chang, not Broome. If you drop the Small Improvement support, you can accept vagueness without losing the literary claim.

  ### 5. Is the Coinage Earning Its Keep?

  **Yes.** "Tragic dilemma" is too loaded.

  *   **Tragic Dilemma:** Usually implies a choice between two evils (Sophocles) or two conflicting duties where violation is inevitable. It implies guilt.
  *   **Melodrama:** Choice between good and evil.
  *   **Parity Scene:** Choice between two *goods* (or two viable paths) where reason does not dictate. It implies **regret without guilt**.

  This distinction is vital for the modern novel. Most contemporary literary fiction is not about tragic guilt; it is about the anxiety of ungrounded choice (the "burden of freedom"). "Tragic dilemma" suggests the character is doomed. "Parity scene" suggests the character is free but unmoored.

  **Verdict:** Keep the term. It distinguishes a specific narrative mechanic (the withholding of the ranking metric) that "dilemma" obscures. A dilemma suggests the problem is the conflict; a parity scene suggests the problem is the *lack of a solution mechanism*.

  ### Summary of Suggested Revisions

  1.  **Fix the Definition:** Change "consideration... runs out" to "considerations... fail to determine a ranking." Attribute the "runs out" view to Raz/Incomparability and distinguish it from Chang/Parity.
  2.  **Clarify the Reader Objection:** Argue that reader ranking is often an imposition of external values, whereas the text aims for normative underdetermination.
  3.  **Refine the Williams Point:** Ensure you credit Williams with the *phenomenology of residue*, not the theory of value.
  4.  **Defend the Coinage:** Explicitly contrast "Parity Scene" (Good vs. Good, Reason Underdetermined) with "Tragic Dilemma" (Good vs. Good, Duty Conflicted/Guilt Inevitable).

  The essay is doing real work. It identifies a specific structural tension that distinguishes literary fiction from genre fiction (which usually resolves the ordering). With the philosophical terminology tightened, it will hold up to scrutiny.
