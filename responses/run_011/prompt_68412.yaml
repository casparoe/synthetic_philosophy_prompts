answer: |-
  **Brainstorming**

  **Dramatic Situation:** Elias, a painter, stands on scaffolding in a converted mill atrium. His cousin Marcia, chair of the descendants' committee, confronts him about the middle panel of a mural commemorating a 1955 strike.
  **Wants/Fears:** Elias wants to encode the truth of his great-uncle's private settlement (the **archival remainder**) into the paint. He fears erasing history becomes a second betrayal. Marcia wants to protect the community's narrative of unbroken solidarity. She fears the white audience will use the truth to dismiss the strike as failure.
  **Compositional Resolutions:**
  1.  **Literal Depiction:** Painting the envelope exchange. *Cost:* Marcia's leadership credibility; community shame.
  2.  **Total Erasure:** Painting only clenched fists. *Cost:* Elias's integrity; the family secret dies with him.
  3.  **Encoded Ambiguity:** A hand gesture with **split valence** (could be receiving pay or passing a note). *Cost:* Marcia demands even this is too risky. The **fidelity budget** is exhausted.
  **Decision:** Elias agrees to paint over the detail. The cost is the severing of trust between cousins and the permanent silencing of the archival remainder.

  ***

  **The Fidelity Budget**

  The atrium of the Oakhaven Mill smelled of turpentine and wet plaster, a sharp contrast to the dormant scent of cotton dust that still haunted the brickwork. Elias stood on the scaffolding, thirty feet up, looking down at the middle panel of the triptych. It was meant to be the heart of the piece: the walkout of 1955. Below him, on the polished concrete floor, his cousin Marcia stood with her arms crossed, her shadow stretching long in the afternoon light slicing through the clerestory windows.

  "You're lingering on the hands," Marcia said. Her voice carried up the shaft of the scaffold without effort. She had spent twenty years organizing tenant unions; she knew how to project.

  Elias wiped his brush on a rag stained with ochre and burnt umber. "The hands tell the story, Marcia. The faces are too generic."

  "The faces are supposed to be generic. They represent the collective."

  "They represent nobody if they're mannequins." Elias dipped the brush again. He was working on the figure of his great-uncle Silas, positioned slightly left of center. In the sketch, Silas's right hand was extended. To the untrained eye, it looked like a gesture of solidarity, reaching for a fellow striker. But Elias had painted the tension in the tendons, the specific angle of the wrist that suggested he was receiving something, not giving. An envelope.

  Marcia climbed the first few steps of the scaffold, stopping at eye level with the lower edge of the canvas. "My committee reviewed the preliminary sketches. We're worried about the third figure. The one near the foreman's office."

  "That's Silas."

  "That's a man who took a payoff," Marcia said. She didn't lower her voice. "We know what Grandma told you. We know about the **archival remainder**. But the public doesn't. And the public includes the grandchildren of the men who owned this mill."

  Elias turned back to the wall. "Du Bois said art must be truthful. If we hide the fracture, we're saying the solidarity was perfect. It wasn't. It was human."

  "Du Bois also said art is propaganda," Marcia countered. "For a people held in contempt, there is no art that stays out of the fight. If you paint Silas taking money, you aren't painting truth. You're painting ammunition. They won't see a man trying to feed his family during an eviction wave. They'll see a scab. They'll see confirmation that Black workers can't be trusted to hold a line."

  Elias stepped down one rung. "So I lie? I paint a myth?"

  "You paint utility. You paint what the community needs to survive the next seventy years." Marcia reached out, touching the edge of the drop cloth. "My grandfather told me about the money too. He said it kept the roof over your head so you could go to art school. You are standing on that envelope, Elias. Do you really need to paint it on the wall too?"

  The air in the atrium was still. Elias looked at the hand he had spent three days refining. He thought about his old professor's warning regarding the **fidelity budget**. A public work could carry only so much unflattering particular before the audience stopped seeing agents and started seeing specimens. How much complexity could the wall hold before it broke under the weight of interpretation?

  "If I hide it, it disappears," Elias said. "Once you and I are dead, the fact exists nowhere. It becomes as if it never happened."

  "It happened in the dark," Marcia said. "Let it stay there. The story we need is the one where the line held until the eviction trucks came. That's the story that organizes people now. That's the story that gets funding for the housing trust."

  "That's Locke's argument," Elias said. "That binding art to a program stunts it. That the artist's obligation is to the work, not the message."

  "Locke wasn't looking at this wall," Marcia said. "Locke wasn't looking at the people who will walk through this atrium and see their grandparents reduced to a transaction." She pointed at Silas's hand. "That gesture has **split valence**. To you, it's complexity. To the mayor standing at the ribbon-cutting, it's justification for why the union failed. You cannot control the eyes that evaluate it."

  Elias looked at the paint. It was wet, glossy. He could see the reflection of the windows in the stroke. He thought about the shoebox under his bed, the letters with the company letterhead, the confidentiality clauses signed in blue ink. The archival remainder. If he painted this, he preserved the record. If he didn't, he protected the myth.

  "I can encode it," Elias said. "I can make the envelope look like a flyer. Only we would know."

  "Someone will know," Marcia said. "And they will talk. And then the narrative shifts from 'dignity in defeat' to 'internal betrayal.' You think you're spending your fidelity budget on truth. I'm telling you, you're spending it on shame."

  She climbed down one step, bringing herself closer to him. "You asked me to give you the better of the exchange. Here it is. You want to be accurate for the two people who know. I am asking you to be useful for the four hundred who don't. Which obligation is heavier?"

  Elias looked at the hand. The tension in the wrist suddenly looked less like truth and more like a wound he was picking. He realized that in trying to save the history, he might be sacrificing the people living in its shadow. The beauty Du Bois demanded wasn't just aesthetic; it was functional. A beautiful lie that feeds a child is sometimes better than an ugly truth that starves them.

  "The budget is spent," Elias said quietly.

  Marcia nodded. She didn't smile. "Paint it over. Make it a fist. Make it empty."

  Elias picked up the scraper. The metal edge was cold against his thumb. He pressed it against the wet paint of Silas's hand. The sound was a wet tear, the pigment surrendering to the steel. He scraped away the envelope, the tension, the specific angle of the wrist. He scraped until the canvas was white again, a blank space where the history had been.

  He dipped his brush into the mix for the background gray. He painted over the white. He painted a clenched fist. It looked strong. It looked like solidarity. It looked like nothing had ever been offered there at all.

  ***

  **Afterword**

  The story's evidence ultimately favors the Du Boisian position, though reluctantly. Marcia's argument—that art for an oppressed people must serve a protective function—prevails because the consequences of Elias's truth are tangible and harmful to the living community. The "fidelity budget" suggests that truth has a cost that the vulnerable cannot always afford. Elias's erasure is an act of care, validating the idea that art must propagate survival.

  However, the strongest consideration against this verdict is the permanent loss of the "archival remainder." By choosing utility over integrity, the story acknowledges that history is being actively curated to suit present needs, creating a fragile foundation for the future. The silence purchased today becomes a debt for the next generation, who will inherit a myth they cannot interrogate. The scrape of the blade is victorious, but it sounds like destruction.
