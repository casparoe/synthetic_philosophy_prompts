answer: |-
  This is a precise and high-stakes epistemological question. You are asking for the cash value of a specific norm—the anti-reductionist presumption of testimony—when applied to a stress case: a trusted authority violating domain boundaries.

  If your community's unofficial epistemology is genuinely anti-reductionist (often called *Presumptivism* in philosophy, associated with Thomas Reid or Tyler Burge), then testimony is a basic source of justification, akin to perception or memory. You do not need independent reasons to believe a speaker; you need independent reasons to *disbelieve* them.

  Here are the implications of holding that position consistently regarding the four specific dimensions you raised.

  ### 1. Burden of Proof vs. Practical Divergence

  You ask whether Camp A (Presumption Intact) and Camp B (Track Record as Reduction) diverge in practice, or merely argue over where to place the burden.

  If you hold the anti-reductionist position consistently, **they diverge significantly in practice.** It is not merely semantic.

  Under a reductionist framework (Camp B's implicit move), justification is aggregative. You sum up the writer's past accuracy to generate a probability score. If the new claim falls outside the distribution of their past verified claims, the probability drops, and you are licensed to withhold belief without engaging the content. You can say, "He is usually right, but not about this," and stop thinking.

  Under a consistent anti-reductionist framework (Camp A), the presumption of truth is *non-inferential*. It does not rest on the sum of past successes. Therefore, the past success does not grant you a license to dismiss the new claim based on domain mismatch alone. The presumption forces **local engagement**.

  To defeat the presumption consistently, you cannot rely on a heuristic ("He is a CS guy, not a bio guy"). You must identify a *defeater*. This changes the labor distribution of the forum. Camp A's view demands that critics engage with the *argument presented*, not the *author's profile*. If the community truly holds this view, it forbids the efficient heuristic of "expertise siloing" as a primary reason for dismissal. It requires you to find the break in the chain of reasoning *in the text*, rather than inferring a break from the author's biography.

  **Implication:** Consistency demands more cognitive labor. It prevents you from using "outside their domain" as a conversation-ender. It forces you to treat the text as if it *could* be right until you find a specific reason it is not.

  ### 2. Statistical Generalizations vs. Claim-Specific Defeaters

  Can a defeater be a statistical generalization about error rates, or must it bear directly on the claim?

  Strict anti-reductionism suggests that **general statistical error rates are insufficient to defeat specific testimony**, unless the rate is so high it undermines the speaker's status as a rational agent.

  If you argue, "This writer has a 10% error rate, therefore I discount this claim," you have reverted to reductionism. You are treating testimony as an inductive gamble. The anti-reductionist view holds that the *act of assertion* itself conveys warrant.

  However, there is a nuance regarding **domain specificity**. A consistent anti-reductionist can argue that the presumption of competence is context-sensitive. The presumption applies to assertions made within the scope of the speaker's recognized competence. If the writer moves to an adjacent field, the *strength* of the presumption may weaken, but it does not invert.

  To defeat the claim consistently, you cannot simply cite the general error rate. You must cite a **type-specific** generalization. For example: "In the three previous times this writer addressed biological questions, they relied on outdated models." This is still a generalization, but it bears directly on the *type* of claim in front of you.

  **Implication:** You are not licensed to say "He is wrong 10% of the time." You are only licensed to say "He is wrong when he talks about biology without citing primary literature." The defeater must be relevantly similar to the current claim. A global error rate is a reductionist tool; a domain-specific reliability track is a permissible contextual defeater.

  ### 3. Process Defeaters vs. Content Defeaters

  May a defeater attach to the process (motivated reasoning, audience performance) rather than the content?

  **Yes.** In fact, for a rationalist-adjacent community, this is the most critical implication.

  Anti-reductionism presumes that the speaker is asserting what they believe and that their belief is formed via a reliable process. It does *not* presume the belief is true, only that it is warranted for *them* to assert it. Therefore, evidence that the process was corrupted is a valid defeater for the hearer.

  If you can demonstrate that the writer is performing for an audience, or that they have a financial incentive aligned with the conclusion, or that they are using a methodology they usually critique when it suits them, you have attacked the **sincerity or competence conditions** of the testimony.

  This is distinct from attacking the content. You do not need to prove the conclusion is false (which might be hard, given it's "settled nonsense" in a field you might not master). You only need to prove the *testimony* is compromised.

  **Implication:** This allows you to reject the conclusion without needing to be a technical expert in the adjacent field. If you can show the *process* of argumentation was contaminated (e.g., "He is arguing against a strawman to please his donors"), the presumption of testimony is defeated. The warrant is severed not because the conclusion is false, but because the assertion does not carry the usual weight of honest inquiry. This is the most powerful tool available to Camp A that does not slide into Camp B's reductionism.

  ### 4. The Policy of Acquired Distrust

  Finally, you ask about a policy of "acquired distrust of argument in general," formed by being taken in by excellent-looking reasoning that proved bad. Does your professed anti-reductionist view permit this?

  **No. It explicitly forbids it.**

  This is the hardest implication to accept. A policy of global distrust toward argumentation is, by definition, **reductionist skepticism**.

  If you hold that "arguments that look excellent are often bad, so I require positive proof that *this* argument is not one of the bad ones," you have placed the burden of proof on acceptance. You have decided that testimony/reasoning is guilty until proven innocent.

  The anti-reductionist position holds that understanding an argument and finding no internal defeaters *is* the justification. If you adopt a policy of "I distrust all arguments because I have been burned before," you are treating your past negative experiences as a global defeater against the faculty of reasoning itself.

  To be consistent with your forum's epistemology, you must **localize the distrust**.
  *   **Inconsistent:** "I distrust arguments because I've been fooled before."
  *   **Consistent:** "I distrust arguments *of type X* produced by *speakers of type Y* under *conditions Z*, because I have specific defeaters for that cluster."

  You are permitted to have a high threshold for what constitutes a "defeater" based on your experience (e.g., you might be quicker to spot motivated reasoning), but you are not permitted to withhold the *default presumption*. You must start at "True until shown otherwise," even if your "shown otherwise" threshold is lower than a novice's.

  **Implication:** Your professed view demands that you abandon cynicism as a default stance. It requires you to remain vulnerable to being fooled, because that vulnerability is the price of being able to learn from testimony without verifying everything yourself. If you immunize yourself against being fooled by distrusting all argument, you also immunize yourself against learning from testimony. The epistemology requires you to accept the risk of error as the cost of knowledge.

  ### Summary of Implications

  If you hold the anti-reductionist position consistently:

  1.  **Labor:** You must engage with the specific text, not just the author's resume. Dismissal based on "out of domain" is insufficient without a specific reason why the domain mismatch matters *here*.
  2.  **Statistics:** You cannot use global error rates. You must use domain-specific reliability data.
  3.  **Process:** You are fully licensed to reject the claim based on evidence of biased process (incentives, audience effects) without refuting the technical content. This is your primary path to rejection.
  4.  **Distrust:** You cannot hold a policy of global distrust. You must localize your skepticism to specific types of arguments or contexts. To do otherwise is to abandon the anti-reductionist view entirely.

  The tension in your forum arises because Camp B is secretly acting like reductionists (using track records as the primary warrant), while Camp A is trying to maintain the norm that testimony is a basic source of knowledge. Consistency demands you side with Camp A's *method* (look for specific defeaters, check incentives/process) but acknowledge that this method is expensive. It requires you to remain open to the possibility that the "settled nonsense" is actually true, until you have found the specific break in the chain. That is the risk the epistemology demands you take.
