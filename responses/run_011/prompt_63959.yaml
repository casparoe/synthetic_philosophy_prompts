  ### Process: Variable Triage and Design Strategy

  **Candidate Variables:**
  1.  **Location of Cost:** (Measurement, Erasure, Feedback, Nowhere). *High Discriminative Power.* Separates Szilard, Landauer, Control Theory, and Fluctuation views.
  2.  **Ontology of Entropy:** (Objective/Physical vs. Epistemic/Bayesian). *High Discriminative Power.* Separates physicalist exorcisms from subjectivist dissolutions.
  3.  **Universality:** (Information-specific vs. Mechanical/General). *High Discriminative Power.* Separates information-theoretic resolutions from Smoluchowski/Feynman mechanical fluctuation arguments.
  4.  **System Boundary:** (Memory Internal vs. External). *Medium Power.* Distinguishes whether the demon is part of the thermodynamic system or an external agent.
  5.  **Role of Usage:** (Storage vs. Utilization). *Medium Power.* Required by prompt. Distinguishes whether information *use* is required for cost or mere correlation.
  6.  **Initial Conditions:** (Past Hypothesis Required vs. Not). *Medium Power.* Isolates views relying on cosmological low-entropy conditions (e.g., Albert).
  7.  **Reversibility of Measurement:** (Dissipative vs. Reversible). *Medium Power.* Distinguishes early Szilard views from modern Landauer/Bennett views.
  8.  **Determinism:** (Deterministic vs. Stochastic Dynamics). *Low Power.* Most positions assume underlying reversibility or standard stochastic dynamics; rarely the primary splitter.
  9.  **Equilibrium Assumption:** (Operates between Equilibrium States vs. Non-equilibrium). *Low Power.* Technical constraint, rarely defines the philosophical stance.
  10. **Ontology of Information:** (Substance vs. Relation). *Low Power.* Too vague; often tracks with Entropy Ontology without adding discriminative value.

  **Triage:**
  *   **Discarded:** Determinism, Equilibrium Assumption, Ontology of Information. These track verbal differences or represent background assumptions shared by most rivals.
  *   **Selected:** Universality, Location of Cost, Ontology of Entropy, System Boundary, Role of Usage, Initial Conditions, Reversibility of Measurement.
  *   **Ranking:** Universality and Location of Cost are the primary splitters. Ontology and Boundary refine the physical vs. epistemic divide. Usage and Reversibility distinguish specific mechanistic claims. Initial Conditions isolates the statistical foundation layer.

  **Structure:**
  To achieve 10–14 leaves with 6–9 nodes, the tree must be conditional. Not every student answers every question. The "Ontology" and "Boundary" questions will be deployed only on paths where they generate distinct positions, preventing combinatorial explosion while ensuring sufficient granularity.

  ***

  ### Handout: Diagnostic Tree for Maxwell's Demon Resolutions

  **Starting Commitment:** You accept that a Szilard-style one-molecule engine can be constructed and cycled, and you accept that the Second Law holds in some form.

  **Node 1 (Universality):** Does the explanation for the engine's failure to violate the Second Law apply equally to a purely mechanical rectifier (e.g., a ratchet and pawl) that stores no information?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 3.

  **Node 2 (Mechanical Failure):** What prevents the mechanical rectifier from rectifying fluctuations?
  *   **Thermal Noise:** The device itself is subject to thermal fluctuations that undo the rectification. → **Leaf 1: Mechanical Fluctuationist**
  *   **Statistical Impossibility:** Rectification is statistically impossible regardless of device noise, due to phase-space constraints. → **Leaf 2: Statistical Mechanic**

  **Node 3 (Cost Location):** In an information-processing demon, where does the compensating entropy increase *necessarily* occur?
  *   **Measurement:** When the correlation between demon and system is established. → Go to Node 4.
  *   **Erasure:** When the demon's memory is reset to a standard state. → Go to Node 5.
  *   **Feedback:** When the information is used to alter the system's Hamiltonian. → **Leaf 3: Control-Theoretic**
  *   **Nowhere:** No specific stage incurs a cost; the law is statistical. → Go to Node 6.

  **Node 4 (Measurement Reversibility):** Is the measurement process itself inherently dissipative, even if the result is not erased?
  *   **Yes:** Measurement requires physical dissipation. → **Leaf 4: Szilardian**
  *   **No:** Measurement can be performed reversibly; cost lies elsewhere. → **Leaf 5: Unnamed** *(Commits to reversible measurement but locates cost there anyway.)*

  **Node 5 (Erasure Usage):** Does the cost depend on the demon *using* the information to change the system, or merely on storing it?
  *   **Storage Sufficient:** Mere correlation creation/storage necessitates the cost upon reset. → Go to Node 7.
  *   **Use Required:** Cost is incurred only if the record is utilized for feedback. → **Leaf 6: Unnamed** *(Commits to erasure cost but requires active feedback loop.)*

  **Node 6 (Fluctuation Ontology):** Is the entropy that saves the Second Law a property of the physical microstate alone, or relative to an observer's knowledge?
  *   **Physical Microstate:** Entropy is objective; fluctuations are physical. → Go to Node 8.
  *   **Observer's Knowledge:** Entropy is epistemic; fluctuations reflect uncertainty. → **Leaf 7: Bayesian Fluctuationist**

  **Node 7 (Erasure Boundary):** Is the demon's memory physically included within the thermodynamic system boundary during the accounting?
  *   **Internal:** The memory is part of the working substance. → Go to Node 8.
  *   **External:** The memory is an external agent acting on the system. → **Leaf 8: External Agent**

  **Node 8 (Initial Conditions):** Does the validity of this resolution depend on the universe having started in a special low-entropy state?
  *   **Yes:** The Second Law relies on the Past Hypothesis. → **Leaf 9: Albertian**
  *   **No:** The resolution holds regardless of cosmological initial conditions. → **Leaf 10: Landauerian**

  **Node 9 (Objective Boundary):** (For Objective views only) Is the memory boundary Internal or External?
  *   **Internal:** Memory is part of the system. → **Leaf 11: Standard Physicalist**
  *   **External:** Memory is outside the system. → **Leaf 12: Unnamed** *(Commits to objective entropy but treats memory as external agent.)*

  **Node 10 (Objective Initial Conditions):** (For Objective/Erasure views) Does it rely on the Past Hypothesis?
  *   **Yes:** Requires low-entropy start. → **Leaf 13: Unnamed** *(Commits to Landauer cost but grounds it in cosmological boundary conditions.)*
  *   **No:** Does not require low-entropy start. → **Leaf 14: Bennettian**

  *(Note: Nodes 8, 9, and 10 are conditional branches applied to specific Objective paths to ensure leaf granularity without excessive depth.)*

  ***

  ### Analysis of the Logical Space

  **(a) Unoccupied Combinations**
  1.  **Mechanical Rectifier + Epistemic Entropy:** This combination is theoretically unattractive. If the device is purely mechanical, invoking an observer's knowledge to explain its failure to rectify fluctuations suggests the machine's behavior depends on being watched, which contradicts the mechanical premise.
  2.  **Measurement Cost + Reversible Measurement:** This combination is incoherent. If one asserts the cost occurs at measurement, but simultaneously asserts measurement is reversible (no dissipation), there is no physical mechanism to account for the compensating entropy increase.
  3.  **Erasure Cost + External Memory + No Past Hypothesis:** This combination has simply not been tried. Most external agent views rely on the agent being a source of negentropy (implying a Past Hypothesis) or treat the agent as outside thermodynamics entirely (making the cost accounting ambiguous).

  **(b) Indistinguishable Leaves**
  *   **Leaf 10 (Landauerian) vs. Leaf 14 (Bennettian):** These leaves answer every node identically in this tree (Objective, Erasure, Internal, No Past Hypothesis). The residual difference is largely a matter of emphasis: Landauerians emphasize the physics of logic gates, while Bennettians emphasize the reversibility of the computation surrounding the erasure. This is a distinction in modeling detail rather than foundational commitment.
  *   **Leaf 1 (Mechanical Fluctuationist) vs. Leaf 2 (Statistical Mechanic):** Both deny information-theoretic exorcisms. The difference lies in whether the failure is device-specific (noise) or law-specific (phase space). In practice, both rely on the same Hamiltonian dynamics, making the distinction one of explanatory focus rather than physical substance.

  **(c) The Most Discriminative Node**
  **Node 3 (Cost Location)** does the most work. Settling whether the cost arises at Measurement, Erasure, Feedback, or Nowhere immediately eliminates roughly 75% of the available positions. It forces the student to commit to the mechanistic locus of the Second Law's preservation, which subsequently dictates whether memory, dynamics, or statistics are the primary explanatory tools.
