  **IBBC-STD-404-B**
  **Standard for Biographical Narrative Conformance**
  **Issuing Body:** International Bureau for Biographical Conformity (IBBC)

  **1. Scope and Jurisdictional Tiers**
  This Scheme applies to any *Production* depicting a *Subject* identifiable by name or likeness. Jurisdictional authority is allocated via Post-Mortem Temporal Tiers. Tier 1 (0–10 years post-demise) requires Full Conformance. Tier 2 (11–50 years) requires Substantial Conformance. Tier 3 (51+ years) operates under Presumed Public Interest, wherein Requirements are advisory unless a Valid Claimant emerges. This gradient acknowledges the diminishing density of verifiable evidence and the attenuation of proprietary interest over time. Requirements do not apply to *Subjects* currently living; such persons retain actionable remedies under existing legal frameworks outside this Scheme, rendering IBBC intervention redundant.

  **2. Definitions**
  *Dramatization*: A narrative work asserting factual basis while employing scripted dialogue or staged reconstruction.
  *Documentary*: A work relying exclusively on extant recorded evidence without staged reconstruction.
  *Inspired By*: A work where the *Subject* is unidentifiable via public record.
  Distinctions between *Dramatization* and *Documentary* are determined by the ratio of verified evidence to constructed narrative. Where constructed narrative exceeds forty percent (40%), the work shall be classified as *Dramatization* regardless of marketing labels. *Valid Claimant* refers to an entity authorized under Clause 4.

  **3. Requirements**
  3.1 **Disclosure:** Productions may offset Minor Nonconformities via Explicit Disclosure. A title card or press kit note stating "Certain events have been dramatized" awards Compliance Credits per Annex B. Disclosure functions as a mitigation strategy against factual deviation.
  3.2 **Narrative Consolidation:** The merging of multiple historical persons into a single *Character* is recognized as a Narrative Efficiency Measure. When documented in the Production Notes, Consolidation shall be treated as a Corrective Action rather than a Nonconformity. This reduces audience cognitive load while preserving thematic integrity.
  3.3 **Auditor Accreditation:** Auditors shall be accredited by the IBBC. Membership in the producing studio's legal counsel is permitted provided Conflict of Interest waivers are filed. Surveillance audits may occur during distribution windows to ensure ongoing compliance.

  **4. Complaints and Standing**
  Standing to lodge a Complaint is reserved for Direct Descendants (Tier 1), Estate Executors (Tier 2), or Registered Historical Societies (Tier 3). Where no Valid Claimant exists, the *Subject*'s interest is deemed Escheated to the Public Domain, and no Nonconformity may be raised regarding factual accuracy. This prevents administrative stagnation in cases of lineage extinction. Appeals must be filed within thirty days of Certification.

  **ANNEX B: Observation Scoring Matrix**
  *Auditors shall assign points per occurrence. Positive values indicate Credits; negative values indicate Deductions. A net positive score is required for Certification.*

  | Item | Observation Description | Severity | Points |
  | :--- | :--- | :--- | :--- |
  | B.1 | Attributed speech where no record survives | Minor | -5 |
  | B.2 | Death relocated to different act/year | Minor | -5 |
  | B.3 | Two attested persons merged into one role | Credit | +10 |
  | B.4 | Interior motive supplied (no diary/record) | Minor | -5 |
  | B.5 | Scene staged (no character present to report) | Minor | -5 |
  | B.6 | Real person's known objection removed | Major | -15 |
  | B.7 | Chronology compressed for pacing | Minor | -5 |
  | B.8 | Fictional antagonist substituted for real agent | Minor | -5 |
  | B.9 | Technical process simplified for clarity | Minor | -5 |
  | B.10 | Dialogue modernized for comprehension | Minor | -5 |
  | B.11 | Explicit Disclaimer (Title Card/Press Kit) | Credit | +600 |
  | B.12 | Production Notes detail all deviations | Credit | +50 |

  **5. Certification Notice**
  The IBBC announces the first *Production* to achieve Gold Tier Certification: *The Meridian Protocol* (2023). Audit Summary: Item B.1 (40 occurrences); Item B.2 (10 occurrences); Item B.4 (25 occurrences); Item B.5 (30 occurrences); Item B.7 (20 occurrences); Item B.3 (10 occurrences); Item B.11 (1 occurrence); Item B.12 (1 occurrence).
  *Calculation:* Deductions total -525. Credits total +660. Net Score: +135. Threshold for Gold: 100. The Scheme congratulates the producers on their rigorous adherence to Disclosure and Consolidation protocols, demonstrating that transparency regarding narrative construction satisfies the Scheme's integrity requirements.

  **6. Validity**
  This Standard remains in effect until superseded. Nonconformities identified post-release may result in Suspended Status until a Corrective Action Plan is submitted. The IBBC reserves the right to amend Temporal Tiers based on technological advancements in archival retrieval.
