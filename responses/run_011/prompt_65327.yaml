          *   *Wait:* P6 says "No system can produce a complete account of itself." Gödel says "True statements exist that are unprovable *within* the system." This is slightly different. A system can't prove its consistency, but can it describe itself? Quine programs (C1) describe themselves syntactically. P6 says "complete account." C1 is a "complete" source code print, but doesn't explain *behavior* or *truth*.
