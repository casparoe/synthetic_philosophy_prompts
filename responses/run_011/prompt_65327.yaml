  9.  **Final Polish:** Ensure tone is collaborative, not corrective. Ensure constraints (no sources, argue from ideas) are met. Make sure the "Concrete Work-through" is actually concrete (walk through the camera vs. the sentence).

      *   *Wait, one more check on P4:* Lucas/Penrose argue: Humans can see the truth of the Gödel sentence, machines can't. User says: We don't have a vantage point to see our own reliability. This is the standard "Shapiro/Feferman" objection. It fits well with P3. No conflict there.

