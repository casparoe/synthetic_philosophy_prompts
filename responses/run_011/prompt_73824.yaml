answer: |-
  **Project Title:** The Ontology of Collapse: Operationalizing Decision Rules in Archaeological Theory

  **Research Question**
  Can a decision rule for "societal collapse" be constructed that yields consistent verdicts across varying temporal and spatial frames without stipulating the identity of "society" with the "state apparatus"?

  **Problem Statement**
  The debate over societal collapse is currently stalled between neo-Malthusian/Tainterian accounts (societies overshoot or suffer diminishing returns on complexity and disintegrate) and reorganization critiques (collapse is an elite-centric narrative; populations persist or liberate). Both sides utilize the same canonical cases—the Late Bronze Age Eastern Mediterranean, the Classic Maya, Rapa Nui—yet reach contradictory verdicts. This stalemate persists not because of a lack of data, but because the concept of "collapse" is operationally opaque. Existing positions leave the question open because they treat "collapse" as a natural kind discoverable by excavation, rather than a conceptual construct requiring explicit decision rules. Currently, indicators (settlement hierarchy, inscription density, subsistence proxies) are traded rhetorically rather than integrated into a function that maps evidence to a verdict. Consequently, the dispute cannot be resolved empirically because the parties are not measuring the same variable.

  **Theoretical Stand and Weighting**
  This project takes the stand that "societal collapse" is not a unitary phenomenon but a conflation of state failure and social reorganization. To test this, the project commits to a **Population-Continuity Weighting** of indicators. In this model, demographic stability, subsistence continuity, and linguistic persistence are treated as load-bearing variables, while monumental construction, inscription density, and elite settlement hierarchy are treated as secondary signals of political configuration.

  This weighting is not question-begging because it addresses the ontological referent of "society" prior to measuring its failure. A society denotes a coordinated population network; a state denotes a specific governance technology within that network. Treating state failure as societal collapse is a category error, not an empirical finding. By prioritizing population-continuity indicators, the project isolates the variable of *social existence* from the variable of *political complexity*. If "collapse" is a substantive phenomenon applicable to societies generally, it must be detectable when weighted toward the population rather than the polity. If it disappears under this weighting, the concept is revealed as exclusively political, not social.

  **The Crux: Non-Neutral Weighting**
  Of the three obstacles identified in preliminary work—(1) indicator decoupling, (2) frame sensitivity, and (3) non-neutral weighting—this project identifies **Problem 3 (Non-Neutral Weighting)** as the crux. Indicator decoupling (e.g., [empirical claim: regions losing elite inscription while maintaining subsistence practices]) and frame sensitivity (e.g., [empirical claim: verdicts changing based on 50-year vs. 200-year windows]) are symptoms of the underlying conceptual error. When weighting privileges elite signaling, decoupling looks like "collapse"; when weighting privileges subsistence, it looks like "reorganization." The project subordinates Problems 1 and 2 to Problem 3, arguing that frame sensitivity is only fatal if the concept is assumed to be unitary. If the concept is disjunctive, frame sensitivity is an expected feature of distinct processes sharing a label.

  **Methodology**
  The method is philosophical modeling applied to archaeological case histories. I will construct candidate decision rules—functions mapping vectors of indicator values to a binary verdict (Collapse/No Collapse)—and compare them against a fixed shortlist of cases (Classic Maya, Late Bronze Age, Chacoan System).

  1.  **Rule Construction:** I will formalize the implicit decision rules of both collapse theorists and reorganization critics.
  2.  **Stress Testing:** I will apply these rules to the cases, explicitly varying the temporal resolution (e.g., comparing fine-resolution climatic proxies against coarse ceramic chronologies) to detect manufactured synchrony.
  3.  **Divergence Analysis:** At every point where rules diverge, I will ask whether further evidence could in principle resolve the disagreement. If a divergence persists despite all possible empirical evidence (e.g., if one rule requires elite continuity and the other requires population continuity), the disagreement is conceptual, not empirical.
  4.  **Frame Variation:** I will shift the spatial boundaries of the cases (polity-centered vs. watershed-centered) to test if the verdict is stable or an artefact of boundary selection.

  **Success and Failure Conditions**
  A successful result will demonstrate that "collapse" is a disjunctive concept. Specifically, success looks like a proof that no single decision rule yields stable verdicts across frames without arbitrary stipulation of what counts as "society." The output will be a usable typological framework distinguishing *state failure* from *social discontinuity*, replacing the binary collapse/reorganization debate.

  The project fails under two conditions. First, if every reasonable operationalization (including the Population-Continuity Weighting) converges on the same verdicts for all cases, the dispute is merely verbal, and the concept is robust. Second, if no operationalization can be constructed without arbitrary stipulation, the concept is theoretically useless and should be abandoned.

  **Falsification of the Stand**
  I commit to the claim that Population-Continuity Weighting reveals the true state of social systems. This stand must be abandoned if: **Empirical analysis shows that Population-Continuity indicators correlate poorly with systemic stressors (climate, resource depletion), while Elite-Signaling indicators correlate strongly.** If state failure tracks environmental stress consistently while population continuity does not, then "collapse" is a real phenomenon specific to complex states, and my ontological distinction between society and state is empirically inert regarding systemic risk.

  **Scoping and Feasibility**
  Two years is insufficient to survey all proposed cases of collapse or to generate new archaeological data. To remain feasible:
  1.  **Case Limit:** I will restrict analysis to three cases where high-resolution data exists for both elite and subsistence indicators (e.g., Maya Lowlands, Argolid, Chaco). I will exclude cases where data is too coarse to separate temporal resolutions.
  2.  **Indicator Limit:** I will restrict the indicator vector to five core variables (settlement density, hierarchy, inscription/records, exchange reach, nutritional proxies) rather than attempting a comprehensive metric.
  3.  **Empirical Reliance:** I will not conduct fieldwork. I will rely on published synthetic datasets. [Flag: I must verify before submission that comparable quantitative datasets exist for all three selected cases to ensure the decision rules can be actually run.]
  4.  **Methodological Cut:** I will not attempt to solve the temporal resolution wrinkle statistically (e.g., via Bayesian modeling) but will treat it philosophically as a constraint on the decision rule's validity.

  This scope ensures the project remains a work of philosophy of science—analyzing the structure of archaeological reasoning—rather than becoming an empirical archaeological survey that cannot be completed within the fellowship period.
