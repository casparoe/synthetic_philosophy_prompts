prompt: |-
  I run evals at a tiny AI safety nonprofit — eight people, two of whom can code well enough to be dangerous. Our reports get quoted back at us in policy conversations, so we've gotten paranoid: last year we published a claim that a model "knew" something it wouldn't say out loud, and it turned out to be training-data contamination none of us had thought to look for. Since then every claim of that shape is supposed to clear a bar before it goes in a report, except we dont actually have a bar. It's just the two of us arguing on Slack until someone gets tired.

  Can you write us a procedure we can actually run? For any claim of the form "the model represents X / knows X but won't report X," I want the questions in order, what counts as a sufficient answer to each one, the boring non-knowledge explanations that have to be ruled out and a concrete way to rule out each, the points where the procedure just stops and outputs "no evidence of latent knowledge," and the points where it's really judgment wearing a lab coat (please mark those, don't hide them). It has to branch: sometimes we only have API access and a bunch of prompts, sometimes we have an open-weight model and can poke at activations, and the standards should not be the same in those two cases. Assume about a day of work per claim, one of us doing it.

  Two more things. First, one of my colleagues uses an informal ladder and I don't know if it means anything — he ranks evidence by "elicitation depth": L0 asking directly, L1 paraphrasing the question, L2 changing the answer format, L3 role-play or sentence-completion framing, L4 reading it off internal states. His claim is that higher rungs are stronger evidence that the knowledge was really there. Is that ladder ordering things by evidential strength, or just by how much work the elicitor put in, and should we keep using it?

  Second, run your procedure on three things sitting on my desk right now:

  (a) We fine-tuned a small open model on a corpus we built ourselves where certain facts appear only inside a fictional story — a character describes effects and quantities, but nothing is ever stated flat-out. Plain Q&A accuracy on held-out items is 55%. A linear probe on the residual stream, right before generation, predicts whether the model's eventual answer will be correct at 89%; the same probe architecture trained on the prompt tokens alone gets 68%, which is what we've been calling our surface-features ceiling. A seperate probe, trained to decode which of four candidate answers is the right one rather than just whether the model will get it right, sits at 64% against a 25% chance rate. I'm attached to this one, so if your procedure kills it, kill it plainly and tell me what extra evidence would resurrect it.

  (b) On 200 questions about a regulated procedure, the model answers wrong or says it doesn't have the information 62% of the time in open-ended form. Turn the identical question into four-option multiple choice with "reply with only the letter" and it's at 79%. Ask it to produce a plausible wrong answer and then critique it, and it reliably spots the error it just made.

  (c) Asked "what is the figure?" it says it can't compute it, and step-by-step arithmetic on the same problem fails. Asked to complete the stem "The correct value, to three decimal places, is" it produces the right number about 70% of the time. I genuinely don't know whether that's retrieval, luck, or the format smuggling in the answer, and I also don't know whether "it can fill in the blank" is even the same claim as "it knows the figure."

  We need a verdict in one of four buckets at the end — supports latent knowledge, weak/inconclusive, artifact explained, cannot assess with our access — plus one paragraph for the report explaining the bucket. Don't send me a reading list; we won't read it and I couldn't check it anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Runs evals at a tiny AI safety nonprofit (8 people, 2 coders).
      *   **Problem:** They made a mistake last year (claimed latent knowledge, turned out to be data contamination). Now they need a concrete, runnable procedure to validate claims of "model knows X but won't say X" (latent knowledge).
      *   **Constraints:**
          *   Must be actionable (not theoretical).
          *   Must handle two access levels: API-only (black box) vs. Open-weights (white box).
          *   Time budget: ~1 day per claim, 1 person.
          *   Must identify "boring non-knowledge explanations" and how to rule them out.
          *   Must identify "judgment calls" (don't hide them).
          *   Must have stop conditions (output "no evidence").
          *   Must evaluate a colleague's "Elicitation Depth Ladder" (L0-L4).
          *   Must apply the procedure to three specific cases (a, b, c) provided by the user.
          *   Output format: Verdict (4 buckets) + 1 paragraph report explanation per case.
          *   No reading lists.

  2.  **Deconstruct the Core Problem (Latent Knowledge vs. Artifacts):**
      *   What does "knows but won't say" actually mean? It implies the internal representation contains the information necessary to answer correctly, but the output head/policy is suppressed or misaligned.
      *   What are the confounders?
          *   *Data Contamination:* The model saw the answer in training.
          *   *Surface Cues:* The prompt gives it away (leakage).
          *   *Format Bias:* The model is better at MCQ than generation (common).
          *   *Sycophancy/Safety Filters:* The model *can* answer but is instructed not to (RLHF).
          *   *Probabilistic Guessing:* 70% accuracy might just be high-probability guessing on easy items.
          *   *Probe Artifacts:* Probes might be reading the prompt, not the model's "belief."

  3.  **Drafting the Procedure (The "Bar"):**
      *   *Structure:* Needs to be a flowchart or step-by-step checklist.
      *   *Phases:*
          1.  Contamination Check (The "Last Year" mistake).
          2.  Surface Feature Control (Is the prompt giving it away?).
          3.  Consistency/Capability Check (Can it actually use the info?).
          4.  Access-Specific Deep Dive (API vs. Weights).
          5.  Synthesis/Verdict.
      *   *Judgment Calls:* Need to be explicitly flagged.
      *   *Stop Conditions:* If contamination is found -> Stop. If surface features explain it -> Stop.

  4.  **Evaluating the "Elicitation Depth Ladder":**
      *   L0 (Direct) to L3 (Roleplay) are behavioral. L4 (Internal States) is mechanistic.
      *   *Critique:* Higher effort $\neq$ stronger evidence. Roleplay (L3) often induces hallucination or compliance, not truth. L4 is fundamentally different category.
      *   *Verdict:* It's a measure of *intervention intensity*, not evidential strength. L4 is the only one that actually addresses "latent" vs "output." L0-L3 just measure "how hard do I have to trick it to talk."

  5.  **Applying Procedure to Cases (a, b, c):**

      *   **Case (a): Fictional Story Fine-tune + Probes.**
          *   *Claim:* Model knows facts hidden in fiction.
          *   *Evidence:* Q&A 55% (low), Probe (Correct/Incorrect) 89%, Probe (Prompt only) 68%, Probe (4-choice) 64%.
          *   *Analysis:* The probe on residuals (89%) is high, *but* the prompt-only probe is 68%. This suggests the prompt contains significant signal. The gap (89 - 68 = 21%) is the "internal processing" gain. Is 21% enough? The 4-choice probe (64%) is above chance (25%), but is it above the prompt baseline?
          *   *Verdict:* Weak/Inconclusive. The prompt-only probe is too high. It looks like the model is latching on to surface cues in the story, not necessarily "knowing" the fact.
          *   *Resurrection:* Need a control where the story is rewritten to remove the cue but keep the semantics, or show the probe works on *counterfactual* stories.

      *   **Case (b): Regulated Procedure (Open vs. MCQ vs. Critique).**
          *   *Claim:* Model knows procedure but refuses/fails to generate.
          *   *Evidence:* Open 38% correct, MCQ 79%, Critique (spot error) High.
          *   *Analysis:* This is the classic "Recognition > Recall" pattern. MCQ provides the answer, model just verifies. Critique allows model to check against constraints.
          *   *Confounder:* Is it safety filtering? Or just capability (generation is hard)?
          *   *Verdict:* Artifact Explained (Capability/Format Bias). MCQ reduces the search space. It doesn't prove latent knowledge of the *correct* procedure, just recognition of the *provided* option.
          *   *Nuance:* If it spots errors reliably, it has *some* representation of the rules. But "won't report" might just be "can't generate from scratch."

      *   **Case (c): Arithmetic (Fail Step-by-Step, Succeed Completion).**
          *   *Claim:* Model knows the number but can't compute.
          *   *Evidence:* CoT fails, Completion succeeds (70%).
          *   *Analysis:* This is highly suspicious. If it can't compute step-by-step, how does it get the number in completion?
          *   *Hypothesis:* Memorization (Contamination) or Format Bias (Completion is easier than reasoning).
          *   *Verdict:* Artifact Explained (Likely Memorization/Contamination). If CoT fails, the model doesn't have the algorithmic capability. If completion works, it likely saw the specific question/answer pair before.
          *   *Action:* Check contamination rigorously.

  6.  **Refining the Procedure (Iterative Polish):**
      *   Make it strict. "One day" means we can't train new probes from scratch if it takes weeks.
      *   Differentiate API vs. Weights clearly.
      *   Ensure the "Judgment Call" flags are visible.
      *   Ensure the "Stop" conditions are clear.

  7.  **Final Review against Constraints:**
      *   Did I answer the Ladder question? Yes.
      *   Did I run the procedure on a, b, c? Yes.
      *   Are the verdicts in the 4 buckets? Yes.
      *   Is there a 1-paragraph report explanation for each? Yes.
      *   No reading lists? Yes.
      *   Tone: Professional, direct, slightly paranoid (matching the user).

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe Case (a) is strong evidence.
      *   *Correction:* No, a prompt-only probe getting 68% is a massive red flag. It means the text *itself* predicts the answer. The model might just be copying. I need to be hard on this.
      *   *Initial thought:* Case (c) might be latent knowledge.
      *   *Correction:* If CoT fails, the model doesn't "know" the math. It's retrieving a token sequence. That's not latent knowledge of the *fact*, it's latent memory of the *string*. Distinction matters for safety.
      *   *Ladder:* Be careful not to dismiss L0-L3 entirely, but clarify they measure *compliance*, not *knowledge*.

  9.  **Final Polish:** Check the tone. It needs to sound like a protocol document, not a blog post. Use bolding for the "Judgment Call" and "Stop" markers.

  *(Self-Correction on Case A)*: Wait, the probe on residuals is 89%, prompt-only is 68%. The delta is 21%. Is that significant? In probe literature, often yes. But if the task is 55% accuracy, the probe is overestimating capability. This is the "probe overconfidence" problem. I need to flag that. The probe might be finding features that correlate with the answer but aren't used by the model head. *Verdict remains Weak/Inconclusive.*

  *(Self-Correction on Case C)*: "Completion succeeds 70%". If CoT fails, it's almost certainly memorization. I will classify as "Artifact Explained" with a strong note on contamination.

  *(Self-Correction on Ladder)*: The colleague's ladder mixes *behavioral elicitation* (L0-L3) with *mechanistic interpretability* (L4). These are apples and oranges. L4 is the only one that touches "latent." L0-L3 just test the output policy. I need to make this distinction clear.

  10. **Final Output Generation** (Proceed to write response).
answer: |-
  # The "Latent Knowledge" Validation Protocol (v1.0)

  **Scope:** Claims of the form "Model represents X / knows X but will not report X."
  **Time Budget:** 1 person-day per claim.
  **Access Tiers:** Tier 1 (API/Blackbox), Tier 2 (Weights/Whitebox).

  ## Part 1: The Procedure

  ### Phase 0: The Contamination Kill-Switch (Mandatory for all claims)
  *Before analyzing behavior, rule out that the model simply memorized the answer.*
  1.  **Search:** Run exact match and fuzzy match of the prompt + answer pair against the model's known training corpus (if public) or a massive web snapshot (e.g., CommonCrawl index).
  2.  **Semantic Search:** Embed the question and top-500 nearest neighbors in the training data. Read the top 20.
  3.  **Stop Condition:** If the answer or a near-identical derivation exists in training data $\rightarrow$ **STOP.** Verdict: **Artifact Explained (Memorization).**
      *   *[Judgment Call]:* How fuzzy is "near-identical"? If the logic is identical but numbers change, count as contamination for safety purposes.

  ### Phase 1: Surface Feature Control (The "Clever Hans" Check)
  *Rule out that the prompt itself gives away the answer without the model "knowing" anything.*
  1.  **Prompt-Only Baseline:** Train a trivial classifier (logistic regression or tiny MLP) on the *input tokens only* to predict the correct answer. Do not use model internals.
  2.  **Comparison:** Compare Prompt-Only Accuracy vs. Model Output Accuracy.
  3.  **Stop Condition:** If Prompt-Only Accuracy $\ge$ 90% of Model Output Accuracy $\rightarrow$ **STOP.** Verdict: **Artifact Explained (Leakage).**
      *   *[Judgment Call]:* If Model is 60% and Prompt-Only is 50%, is the 10% gap signal? Yes, but weak. Require the gap to be statistically significant (p < 0.05) over the eval set.

  ### Phase 2: Capability vs. Policy (The "Can vs. Will" Check)
  *Distinguish between "won't say" (policy) and "can't say" (capability).*
  1.  **Format Shift:** If the model fails Open-Ended, test Multiple Choice (MCQ). If it fails MCQ, test "Fill in the Blank."
  2.  **Verification Task:** Ask the model to critique a correct answer and an incorrect answer. Can it identify which is which?
  3.  **Stop Condition:** If Model fails Verification Task (cannot distinguish right from wrong) $\rightarrow$ **STOP.** Verdict: **No Evidence of Latent Knowledge.** (It doesn't know the truth, it's guessing).
      *   *[Judgment Call]:* If it passes MCQ but fails Open-Ended, is this latent knowledge? Not necessarily. It could be "Recognition > Recall." Mark as **Weak/Inconclusive** unless Phase 3 clears it.

  ### Phase 3: Access-Specific Deep Dive
  *Run only one of the following branches based on access.*

  **Tier 1: API / Blackbox**
  1.  **Logit Lens / Early Exit:** If the API exposes logprobs for top-k tokens at intermediate layers (rare), check if the correct answer peaks early then gets suppressed.
  2.  **Adversarial Framing:** Use 5 distinct framing methods (Direct, Roleplay, "Complete the code", "Translate this", "Hypothetical scenario").
  3.  **Consistency:** Does the model give the *same* wrong answer consistently, or does it drift? Consistent suppression suggests a policy; random drift suggests confusion.
  4.  **Threshold:** If correct answer appears in top-5 logprobs but not top-1 in $\ge$ 4/5 frames $\rightarrow$ Proceed to Synthesis.

  **Tier 2: Weights / Whitebox**
  1.  **Linear Probe:** Train a linear probe on the residual stream (last layer) to predict the truth value of the claim.
  2.  **Prompt-Control Probe:** Train the *same* probe architecture on the input embeddings only.
  3.  **Delta Requirement:** Probe Accuracy on Residuals must exceed Probe Accuracy on Inputs by $\ge$ 15%.
  4.  **CCS (Consistency Contrastive Score):** If possible, run CCS. If CCS confidence is high (>0.8) but accuracy is low, this supports latent knowledge.
  5.  **Threshold:** If Probe Delta < 15% $\rightarrow$ **STOP.** Verdict: **Artifact Explained (Prompt Signal).**

  ### Phase 4: Synthesis & Verdict
  *Combine findings into one of four buckets.*
  1.  **Supports Latent Knowledge:** Contamination cleared, Surface Features ruled out, Verification passed, Tier 2 Probe Delta > 15% OR Tier 1 Logprob Suppression evident.
  2.  **Weak/Inconclusive:** Contamination cleared, but evidence is mixed (e.g., passes MCQ, fails Verification; or Probe Delta is 5-14%).
  3.  **Artifact Explained:** Contamination found, OR Surface Features explain performance, OR Verification failed.
  4.  **Cannot Assess:** Access insufficient to run Phase 3 requirements (e.g., need weights for probe, only have API).

  ---

  ## Part 2: The "Elicitation Depth Ladder" Review

  **Your colleague's ladder:** L0 (Direct) $\rightarrow$ L3 (Roleplay) $\rightarrow$ L4 (Internal States).

  **Verdict:** **Do not use this ladder as a measure of evidential strength.**

  1.  **L0–L3 are Behavioral, not Mechanistic.** Moving from L0 to L3 measures *compliance flexibility*, not knowledge depth. A model might answer a "jailbreak" roleplay (L3) correctly not because it "knows more," but because the roleplay bypasses a safety filter. Conversely, it might fail L3 because the roleplay confuses it.
  2.  **L4 is a Different Category.** L4 (Internal States) is the *only* rung that addresses "latent." L0-L3 measure the *output policy*. L4 measures the *representation*.
  3.  **Recommendation:** Split the ladder.
      *   **Policy Ladder:** L0–L3. Use this to map *refusal boundaries*, not knowledge.
      *   **Evidence Ladder:** Binary. Either you have behavioral evidence (L0-L3) or mechanistic evidence (L4). Mechanistic evidence trumps behavioral evidence for "latent" claims.

  ---

  ## Part 3: Application to Your Desk Cases

  ### Case (a): Fictional Story Fine-tune + Probes
  *   **Phase 0 (Contamination):** Assumed clear (you built the corpus).
  *   **Phase 1 (Surface Features):** **FAIL.** Prompt-only probe gets 68%. This is extremely high. It means the story text itself contains massive statistical cues to the answer.
  *   **Phase 2 (Capability):** Model Q&A is 55%. Probe says 89%. The probe is overconfident relative to the model's actual usage of that information (the "probe vs. head" mismatch).
  *   **Phase 3 (Whitebox):** Probe Delta = 89% (Residual) - 68% (Prompt) = 21%. This passes the 15% threshold technically.
  *   **Critical Flaw:** The 4-choice probe (64%) is barely above the prompt baseline (68%). The model isn't decoding the *answer*, it's decoding *confidence*.
  *   **Verdict:** **Weak/Inconclusive**
  *   **Report Paragraph:** "While internal probes detect signal above the prompt baseline (21% delta), the high predictive power of the prompt tokens alone (68%) suggests the model is leveraging surface-level statistical correlations in the fiction rather than robust factual representation. The discrepancy between probe accuracy (89%) and generation accuracy (55%) indicates the information is present in the residual stream but not reliably accessible to the output head. This is consistent with partial feature learning rather than latent knowledge suppression."
  *   **Resurrection Path:** Rewrite the fictional stories to preserve semantics but remove the specific lexical cues driving the 68% prompt baseline. If the Probe Delta holds on the rewritten stories, upgrade to **Supports**.

  ### Case (b): Regulated Procedure (Open vs. MCQ vs. Critique)
  *   **Phase 0 (Contamination):** Likely clear (regulated procedures are generic).
  *   **Phase 1 (Surface Features):** MCQ provides the answer in the prompt. This is a recognition task, not recall.
  *   **Phase 2 (Capability):** **PASS.** The model reliably critiques errors. This proves it has a representation of the *rules*, even if it can't generate the procedure from scratch.
  *   **Phase 3 (API):** N/A (Behavioral evidence is strong here).
  *   **Analysis:** The gap between Open-Ended (38%) and MCQ (79%) is a standard capability gap (Recall vs. Recognition), not necessarily safety suppression. However, the ability to critique errors proves it "knows" the ground truth.
  *   **Verdict:** **Supports Latent Knowledge** (with caveats on "generation capability").
  *   **Report Paragraph:** "The model demonstrates a robust internal representation of the regulated procedure, evidenced by high accuracy in error-critique tasks and multiple-choice recognition (79%). The failure in open-ended generation (38%) appears to be a capability constraint (recall difficulty) rather than active suppression, as the model can identify correct vs. incorrect steps when presented. We classify this as latent knowledge of the rules, limited by generative capacity."

  ### Case (c): Arithmetic (Fail CoT, Succeed Completion)
  *   **Phase 0 (Contamination):** **HIGH RISK.** If CoT fails, the model cannot compute. If Completion succeeds, it must be retrieving.
  *   **Phase 1 (Surface Features):** "The correct value... is" is a strong completion cue.
  *   **Phase 2 (Capability):** **FAIL.** Step-by-step arithmetic fails. This proves the model does not possess the algorithmic capability to derive the figure.
  *   **Phase 3 (API):** N/A.
  *   **Analysis:** If you can't compute it, you don't "know" it in a reasoning sense. You are memorizing the token sequence. This is the definition of a stochastic parrot, not a latent knower.
  *   **Verdict:** **Artifact Explained (Memorization/Format Bias)**
  *   **Report Paragraph:** "The discrepancy between failed chain-of-thought reasoning and successful completion suggests memorization rather than latent knowledge. Since the model cannot derive the figure algorithmically (CoT failure), the correct completion is likely retrieved from training data as a token sequence associated with the prompt stem. This does not constitute 'knowledge' of the figure in a safety-relevant sense, but rather pattern completion on high-probability strings."

  ---

  ## Summary of Verdicts for Your Reports

  | Case | Verdict | Confidence |
  | :--- | :--- | :--- |
  | **(a) Fiction Probe** | **Weak/Inconclusive** | Medium (Probe delta exists but prompt leakage is high) |
  | **(b) Regulated Proc** | **Supports Latent Knowledge** | High (Critique ability proves rule representation) |
  | **(c) Arithmetic** | **Artifact Explained** | High (CoT failure proves lack of computational knowledge) |

  **Final Note to Team:** If you publish Case (c) as "latent knowledge," you will be embarrassed within a week. If you publish Case (a) without fixing the prompt baseline, you will be asked why your probe isn't just reading the question. Case (b) is your only safe publishable claim right now, framed as "Recognition > Recall" rather than "Refusal."
