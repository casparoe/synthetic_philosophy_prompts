prompt: |-
  I'm a novelist. Third book, about half drafted, due to my editor in the spring, and I've hit a problem I keep papering over instead of solving.

  The book follows one object — a cello, made somewhere around 1790 — through a dozen-odd owners across 230 years, and it also follows three human characters across roughly forty years each. Nearly every chapter involves something that's been repaired, replaced, restored, revarnished, renamed, or just quietly worn into a different thing, and I have to decide sentence by sentence how to talk about it. Do I write as though the whole instrument is sitting right there on the page at every moment it appears? Or do I write it as a chain of versions, each of which was the cello-*then*? I'm told there's an actual philosophical fight about exactly this, something about objects being wholly present at each moment versus being stretched out through time in parts — one camp apparently thinks a thing is a four-dimensional worm, which sounds like an insult but I gather isn't. I haven't read any of it and I'm not going to before March. What I need is a working procedure I can run on a passage in five minutes with a coffee going cold next to me, not a seminar.

  So build me that procedure. Specifically:

  - The questions to ask about a thing in a scene, in the order I should ask them, with what counts as a sufficient answer to each and where a given question just terminates with "stop, you're done."
  - Which of the distinctions in the debate actually change what I put on the page, and which ones I can drop without loss. Say plainly which ones you're dropping and what I'd be giving up. If there are two flavors of the stretched-out view and only one of them is any use to a fiction writer, tell me which and why.
  - Where the procedure can't settle anything and it's my call. Mark those spots instead of hiding them behind a test that looks like it decides something.
  - What it says about people, not just objects. Two of my three characters change a great deal; one does something at 55 that the 25-year-old version of her would have found unforgivable, and a third barely changes at all, which is its own problem. Does the procedure give me a way to write that, or does it just make me pick a side and stick to it?

  Then run it on three things from the actual draft. There's alot of these, but these are the ones that hurt:

  1. Chapter 6: the cello's top cracks in 1848 and a luthier replaces it. Chapter 19, set in 1962, has a character swear an oath on the same top that heard the war. I love that line. I suspect it's a problem.
  2. A house in the second section that's been added onto so many times the original two rooms are now interior walls nobody goes into. A character keeps saying this is the house she grew up in, and I want her to be right and also to be a little wrong, in the same breath.
  3. The one I'm afraid of: my frame device is a closing scene where the 1790 cello and the 2020 cello get described in a single sentence as one thing that has been waiting this whole time. If the procedure says that sentence is a lie, or that it only works on a reading I've been too sloppy to sustain for 300 pages, tell me straight. I'd rather find out now than in copyedit.

  And tell me what the procedure can't do. I'll be using it as a drafting tool and then handing the results to a copyeditor who has never heard of any of this, so whatever it outputs has to be checkable against the text on the page without a theory in your head. Don't give me anything that requires me to know a term I haven't already used in this message, or if you must, define it in one line.

  Long is fine. Vague is not.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Novelist, 3rd book, half-drafted, deadline in spring.
      *   **Problem:** A metaphysical/narrative consistency issue regarding object persistence through time (specifically a cello, but also a house and people).
      *   **Constraint:** Needs a *working procedure*, not a philosophy seminar. Must be usable in 5 minutes with cold coffee. No jargon unless defined. Must be checkable by a copyeditor later.
      *   **Specifics:**
          *   Order of questions with stop conditions.
          *   Which philosophical distinctions matter for fiction vs. which to drop (specifically mentioning "four-dimensional worm").
          *   Where the writer's intuition must override the procedure.
          *   Application to people/character change.
          *   Test run on three specific draft problems (Cello top, House addition, Closing sentence).
          *   Limitations of the procedure.
      *   **Tone:** Direct, practical, respectful of the craft, no fluff.

  2.  **Deconstruct the Philosophical Background (for internal use, to simplify for output):**
      *   *Endurantism:* The object is wholly present at every moment. (The cello *is* the cello, regardless of changes.)
      *   *Perdurantism (Four-dimensionalism):* The object is a space-time worm. (The 1848 cello is a temporal part of the whole cello-worm.)
      *   *Exdurantism (Stage Theory):* Only the current stage exists; talk of persistence is talk of counterpart relations. (The 1962 cello is a *different* stage linked to the 1848 stage.)
      *   *Fictional Utility:* Endurantism feels like magic/myth. Perdurantism feels like history/archives. Stage Theory feels like memory/subjectivity.
      *   *Decision:* For a novelist, the "Four-Dimensional Worm" (Perdurantism) is usually too clunky for prose unless explicitly sci-fi. The real choice is between *Essentialism* (Endurantism: it stays the same thing) and *Functional/Narrative Identity* (It's the same thing because we say it is/it serves the same role).
      *   *Ship of Theseus:* The core underlying problem.

  3.  **Develop the Procedure (The "Object Persistence Test"):**
      *   *Goal:* Consistency in language and emotional weight.
      *   *Step 1: The Anchor.* What defines the object *in this scene*? (Material, Function, or Name?)
      *   *Step 2: The Break.* Has a critical component changed since the last time we cared about it?
      *   *Step 3: The Witness.* Who is looking at it? (Do *they* see it as the same?)
      *   *Step 4: The Verb.* What verb connects the object to the action? (Is, Was, Remains, Becomes?)
      *   *Stop Conditions:* If the emotional truth overrides the physical truth, stop and write the emotional truth.

  4.  **Address the Philosophical Distinctions:**
      *   *Keep:* The distinction between *Material Continuity* (wood/varnish) and *Narrative Continuity* (name/provenance). This drives the prose.
      *   *Drop:* Endurantism vs. Perdurantism (the "worm" stuff). It doesn't change the words on the page, only the mental model.
      *   *Keep for People:* Psychological Continuity vs. Physical Continuity.

  5.  **Address the Human Element:**
      *   People are easier because we accept change. The procedure needs to highlight *betrayal* vs. *growth*.
      *   If a character changes, is it a "break" (new person) or "wear" (same person aged)?

  6.  **Run the Test on the Three Examples:**
      *   *Example 1 (Cello Top):* 1848 crack vs. 1962 oath.
          *   *Analysis:* Materially false. Narratively true.
          *   *Fix:* Acknowledge the lie in the narration or the character's perception.
      *   *Example 2 (The House):* Added rooms vs. "house I grew up in."
          *   *Analysis:* Functional identity holds. Material identity fails.
          *   *Fix:* Lean into the "wrongness."
      *   *Example 3 (Closing Sentence):* 1790 = 2020.
          *   *Analysis:* High risk. Needs to be framed as a poetic truth, not a factual one.
          *   *Fix:* Ensure the *narrator* claims the unity, not the physics.

  7.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone Check:* Is it too academic? *Correction:* Cut the philosophy names. Use "Material" vs. "Story."
      *   *Constraint Check:* Did I define terms? *Yes.* Did I mark where the writer decides? *Yes.*
      *   *Procedure Structure:* Numbered steps, clear "Stop" points.
      *   *Copyeditor Check:* Can a copyeditor verify this? *Yes, by checking consistency of descriptors.*

  8.  **Refining the "Worm" Issue:**
      *   The user mentioned the "four-dimensional worm." I need to explicitly tell them to drop it. It's a mental model for logicians, not a tool for prose. The "Stage" view (current moment only) is more useful for scene work, but the "Whole" view (Endurantism) is better for thematic unity. I will advise them to pick *one* lens for the *narrator* and stick to it, even if characters disagree.

  9.  **Refining the Human Aspect:**
      *   The 25 vs 55-year-old self. This is the "Psychological Continuity" test. If the core value breaks, they are different people. If the core value holds but methods change, they are the same.

  10. **Final Review against User Prompt:**
      *   Questions in order? Yes.
      *   Sufficient answers/Stop conditions? Yes.
      *   Which distinctions to drop? Yes.
      *   Where it's the writer's call? Yes.
      *   People included? Yes.
      *   Three examples run? Yes.
      *   What the procedure can't do? Yes.
      *   No undefined jargon? Yes.

      *(Self-Correction during drafting)*: Make sure I don't solve the creative problem *for* them, but give them the tool to solve it. For the closing sentence, don't just say "it works." Say "It works IF..."

      *(Final Polish)*: Ensure the "5-minute" constraint is respected. The procedure needs to be scannable. Use bolding for actions.

      *(Philosophy Check)*: The user mentioned "four-dimensional worm." I should acknowledge I heard them but explain why it's useless for prose. The distinction that *matters* is "Constitution" (what it's made of) vs. "Identity" (what we call it).

      *(Copyeditor Note)*: Emphasize that the copyeditor checks for *consistency of usage*, not metaphysical truth.

      Let's build the "Object Persistence Protocol."

      *Step 1: Define the Anchor.*
      *Step 2: Check the Break.*
      *Step 3: Check the Witness.*
      *Step 4: Choose the Verb.*

      Okay, ready to write.

      *Wait, one more thing:* The user said "Don't give me anything that requires me to know a term I haven't already used in this message." I used "Endurantism" in my thought process, but I must not use it in the output unless I define it simply. Better to avoid it entirely and use plain English. "Whole Object" vs. "Time-Slice."

      *Re-evaluating the "Worm" advice:* The user said "one camp apparently thinks a thing is a four-dimensional worm... I gather isn't [an insult]." I need to confirm it's not an insult but tell them to ignore it for drafting.

      *Final Plan:*
      1. Introduction: Acknowledge the pressure.
      2. The Philosophy Triage: What to keep, what to burn.
      3. The Procedure (The 4 Questions).
      4. The Human Variable.
      5. The Three Test Cases.
      6. Limitations.
      7. Copyeditor Handoff.

      Let's go.cw
answer: |-
  Here is the procedure. It is designed to be printed or copied into a notebook and run in under five minutes. It prioritizes narrative consistency over metaphysical truth, because your reader cares about the story, not the ontology.

  ### Part 1: The Philosophy Triage
  You asked which distinctions change the words on the page. Here is the verdict.

  **1. Drop: The "Four-Dimensional Worm" (Perdurantism).**
  *   **What it is:** The idea that the cello is a long tube stretching through time, and every moment is just a slice of that tube.
  *   **Why drop it:** It is a mental model for logicians, not a tool for prose. It does not change your verbs. It does not change your adjectives. It creates distance between the reader and the object.
  *   **What you lose:** The ability to argue that the 1848 cello and the 2020 cello are literally different "temporal parts" of the same entity.
  *   **Why it doesn't matter:** You can write that sentence without believing the physics. Fiction operates on *Narrative Identity*, not *Spatio-Temporal Continuity*.

  **2. Keep: Constitution vs. Identity.**
  *   **What it is:** *Constitution* is what the thing is made of (wood, varnish, cells, memories). *Identity* is what we call it (The Cello, The House, Sarah).
  *   **Why keep it:** This is the only distinction that changes your syntax. If you focus on Constitution, you write about wear, cracks, and replacement. If you focus on Identity, you write about legacy, name, and function.
  *   **The Rule:** You must decide which one is the "True" version for the *narrator*. Characters can disagree, but the narrative voice must be consistent.

  **3. Keep: The Witness.**
  *   **What it is:** The person looking at the object in the scene.
  *   **Why keep it:** Objects don't know what they are. People do. If a character believes the cello is the same, it *is* the same for the duration of their scene.

  ---

  ### Part 2: The Object Persistence Protocol
  Run these four questions in order. If you hit a **STOP**, do not proceed to the next question. Write the scene based on the answer you just found.

  **Q1: What is the Anchor?**
  *   **Ask:** In this specific scene, what makes this object *itself*? Is it the **Material** (the specific wood/bone), the **Function** (making sound/shelter), or the **Name** (provenance/title)?
  *   **Sufficient Answer:** Pick one. (e.g., "In this scene, the Anchor is Function.")
  *   **STOP Condition:** If the Anchor is **Name**, skip Q2. The object is the same because it is named the same. Write accordingly.

  **Q2: Has the Break Occurred?**
  *   **Ask:** Since the last time this object was significant, has the *Anchor* defined in Q1 been physically severed or replaced?
  *   **Sufficient Answer:** Yes or No.
  *   **STOP Condition:** If **No**, write the object as continuous. Use verbs like *remains, persists, waits.*
  *   **STOP Condition:** If **Yes**, proceed to Q3.

  **Q3: Who is the Witness?**
  *   **Ask:** Is the character observing this object aware of the Break from Q2?
  *   **Sufficient Answer:** Yes (they know it was repaired/replaced) or No (they think it's original).
  *   **STOP Condition:** If **No**, write the object as continuous *for them*. You may add narrative irony if your narrator knows better, but the character's dialogue must treat it as whole.
  *   **STOP Condition:** If **Yes**, proceed to Q4.

  **Q4: What is the Cost?**
  *   **Ask:** Does acknowledging the Break destroy the emotional utility of the scene?
  *   **Sufficient Answer:** Yes (the scene fails if the object isn't "the same") or No (the tragedy is that it *isn't* the same).
  *   **Decision Point:**
      *   If **Yes**: You are writing a **Myth**. Treat the object as magically continuous despite the physics. (e.g., "The sword that killed the king," even if the blade was reforged).
      *   If **No**: You are writing **History**. Acknowledge the break. Use verbs like *became, replaced, inherited.*

  **[WRITER'S CALL ZONE]**
  *   If Q4 feels like a 50/50 split, **stop the procedure.** This is not a logic problem; it is a tone problem. Flip a coin. If you choose "Myth," you must commit to it for every object in the book. If you choose "History," you must commit to the decay. You cannot switch mid-book.

  ---

  ### Part 3: The Human Variable
  People are objects in your book. Apply the Protocol, but change Q1.

  **For People, Q1 is: What is the Core?**
  *   **Ask:** Is the character defined by their **Values** (what they believe is right) or their **Memory** (what they recall happening)?
  *   **Application to your 25 vs. 55-year-old:**
      *   If she breaks a **Value** (the 25-year-old would find the act unforgivable), the Protocol says she is a *different person*.
      *   **How to write it:** Do not smooth it over. Use the "History" verb set. She *became* someone else. The narration should treat the 25-year-old and 55-year-old as distinct entities sharing a body.
      *   **How to write the Static Character:** If a character barely changes, the Protocol flags this as "Unnatural Persistence." In a book about wear and repair, a person who doesn't change is either a saint or a monster.
      *   **The Fix:** Give them a "varnish" change. They look the same, but the *texture* is different. If you don't, they will read as a prop, not a person.

  ---

  ### Part 4: Running the Protocol on Your Draft

  Here is the output of the procedure on your three problem areas.

  **1. The Cello Top (1848 Crack vs. 1962 Oath)**
  *   **Q1 Anchor:** Material (The wood that heard the war).
  *   **Q2 Break:** Yes (Top replaced in 1848).
  *   **Q3 Witness:** The 1962 character swears the oath. Do they know the top was replaced?
      *   *If No:* The line stands. It is dramatic irony. The character is wrong, but the emotion is real.
      *   *If Yes:* The line is a lie.
  *   **Q4 Cost:** You said "I love that line." This implies the emotional utility is high.
  *   **Verdict:** **Write the Myth.**
  *   **Correction:** You cannot have it both ways physically. To make this work without lying, shift the Anchor from Material to **Lineage**. The *cello* heard the war, even if the *wood* didn't.
  *   **Drafting Fix:** Change the line slightly. "He swore on the cello that had heard the war." (True). vs "He swore on the wood that heard the war." (False).
  *   **Copyeditor Note:** Ensure no other passage explicitly states the 1962 character knows the top is a replacement *before* this oath, or the irony collapses into incompetence.

  **2. The House (Additions vs. "Home")**
  *   **Q1 Anchor:** Function (Shelter/Family seat).
  *   **Q2 Break:** Yes (Original rooms are now interior walls).
  *   **Q3 Witness:** The character says "This is the house I grew up in." She knows it was added onto (presumably).
  *   **Q4 Cost:** Does acknowledging the addition destroy the feeling of "Home"?
  *   **Verdict:** **Write the History.**
  *   **Correction:** This is the perfect spot for the "Right and Wrong" breath you want.
  *   **Drafting Fix:** Use the "Stage" view. "It was the house she grew up in, though the walls she touched were new." The procedure allows the *Name* to persist while the *Constitution* is acknowledged as changed.
  *   **Copyeditor Note:** Check that descriptions of the house in early chapters match the "original two rooms" and later chapters match the "additions." Do not let the architecture shift magically.

  **3. The Closing Sentence (1790 = 2020)**
  *   **Q1 Anchor:** Name/Identity (The Cello).
  *   **Q2 Break:** Yes (230 years of repairs).
  *   **Q3 Witness:** The Narrator (Closing scene).
  *   **Q4 Cost:** If you call it a lie, the book's theme collapses.
  *   **Verdict:** **Write the Myth.**
  *   **Correction:** This sentence *must* be a lie physically, but a truth thematically. The procedure says this is allowed *only if* you have established the Narrator as a "Myth-Maker" earlier.
  *   **Risk:** If you have been writing in a gritty, "History" style (counting every varnish layer) for 300 pages, this sentence will feel unearned.
  *   **Drafting Fix:** You need to seed the "Myth" view earlier. Somewhere in Chapter 3 or 4, have a character explicitly say, "It doesn't matter what wood it is, it's the same voice." If that line exists, the closing sentence works. If that line does not exist, the closing sentence is a betrayal of the reader.
  *   **Copyeditor Note:** This sentence cannot be fact-checked against the text's physics, only against the text's *tone*.

  ---

  ### Part 5: What This Procedure Cannot Do

  1.  **It cannot fix inconsistent tone.** If Chapter 6 treats the cello as a sacred relic (Myth) and Chapter 7 treats it as inventory (History), this procedure will tell you both are valid *locally*, but the book will feel schizophrenic. You must decide globally: Is this a book about **Things** (History) or **Legacies** (Myth)?
  2.  **It cannot save a lazy metaphor.** If you write "the same wood," the procedure flags it as a lie. You must rewrite to "the same instrument."
  3.  **It cannot decide theme.** Q4 asks about "Emotional Utility." Only you can judge that. The procedure forces you to admit the cost, not pay it for you.

  ### Part 6: Handoff to Copyeditor

  When you send this to your editor, include this note:

  > "This book relies on the tension between an object's material continuity and its narrative identity.
  >
  > 1.  **Consistency Check:** Please flag any instance where a character knows an object is repaired but speaks of it as original *without* ironic intent.
  > 2.  **Architecture Check:** Please verify the house descriptions match the timeline of renovations.
  > 3.  **Verb Check:** If I use 'remains/is' for an object after a major break, ensure the context supports a 'Myth/Lineage' reading. If I use 'became/replaced,' ensure the context supports a 'History/Material' reading.
  >
  > Do not 'correct' metaphysical statements to match physics. Correct them to match the *established narrative lens*."

  ### Summary for your Coffee Break
  1.  **Drop the Worm.** It's useless for prose.
  2.  **Pick a Lens.** Material (History) or Name (Myth). Stick to it for the Narrator.
  3.  **Let Characters Lie.** They can believe the object is the same even if it isn't.
  4.  **Seed the Ending.** If the last sentence claims unity, a character earlier must claim unity.
  5.  **People Break.** If a character violates their core values, treat them as a new person.

  Go write. The cello is whatever you say it is, provided you say it consistently.
