answer: |-
  **Title:** The Vertical Supply Curve: Why Rent Control Isn't About Efficiency in Zoned Cities

  In Intro to Micro, we all drew the same graph. Price ceiling below equilibrium. Upward-sloping supply curve. The resulting triangle of deadweight loss (DWL) is the textbook indictment of rent control: artificially low prices discourage construction, create shortages, and destroy value. It is a clean, logical argument. But it relies on a hidden assumption that doesn't hold in cities like San Francisco, New York, or Boston. It assumes the supply curve slopes up.

  In a city where zoning laws, height restrictions, and permit delays make new construction legally impossible, the supply of housing is not upward-sloping. It is nearly vertical. When you realize the supply curve is inelastic, the standard efficiency argument against rent control collapses, transforming the policy from an economic blunder into a pure question of distribution.

  **The Diagram in Words**
  Imagine the standard Price-Quantity graph. Demand slopes down as usual. But instead of a supply curve rising from left to right, draw a vertical line at quantity $\bar{Q}$. This represents the fixed housing stock locked in by zoning.

  In a free market, rent rises until demand hits this vertical line at Price $P_m$ (market rent). Now, impose a rent ceiling at $P_c$. In the textbook model, quantity supplied would shrink to $Q_s$, creating a DWL triangle between $Q_s$ and $\bar{Q}$. But here, quantity supplied cannot shrink; the buildings already exist and cannot be legally replaced or moved. $Q_s$ remains equal to $\bar{Q}$.

  Geometrically, the base of the deadweight loss triangle is the reduction in quantity ($Q_{equilibrium} - Q_{supplied}$). Since that reduction is zero, the area of the triangle is zero. The efficiency loss vanishes. What remains is a rectangle defined by the height ($P_m - P_c$) and the width ($\bar{Q}$). This area represents pure surplus transfer. Every dollar the landlord loses in rent is a dollar the tenant keeps. In a supply-constrained market, rent control does not destroy wealth; it reallocates scarcity rents from property owners to sitting tenants.

  If the efficiency cost is negligible, the debate shifts. It is no longer "Is this efficient?" but "Who deserves the windfall of a constrained market?"

  **Objection 1: The Misallocation Problem**
  The first counter-argument my professor will raise is dynamic inefficiency. If a retired couple stays in a four-bedroom rent-controlled unit while a family of five crowds into a one-bedroom at market rates, labor mobility and utility are impaired. This is the "housing mismatch" critique.

  This objection survives, but it is often overstated. First, the free market also misallocates housing: it allocates by wealth, not need. A high-income single professional may occupy a large unit simply because they can afford it, crowding out a larger, lower-income family. Rent control allocates by tenure rather than wealth; neither is perfectly efficient, but tenure provides stability.

  Second, this inefficiency is solvable without abolishing control. Policies like "vacancy decontrol" (allowing rents to reset when a tenant leaves) or tax incentives for downsizing can lubricate mobility without exposing sitting tenants to sudden price shocks. The mismatch is a friction cost, not a structural collapse. Compared to the massive wealth transfer protecting tenants from displacement, the efficiency loss from mismatch is a second-order problem.

  **Objection 2: Quality Degradation**
  The stronger objection is that when landlords cannot compete on price, they compete on cost-cutting. If returns are capped, maintenance declines, leading to slum conditions. This effectively shrinks the *quality-adjusted* supply curve, reintroducing the shortage the vertical supply argument tried to deny.

  This is a valid risk, but it assumes a regulatory vacuum. Rent control is never the only regulation in a city; it coexists with habitability codes. If a city is competent enough to enforce zoning (which created the vertical supply), it is competent enough to enforce heat, water, and safety standards.

  The economic logic here is that rent control separates the *land* value from the *structure* value. Landlords may skimp on the structure, but they cannot easily exit the market because zoning prevents them from selling for redevelopment. They are stuck holding the asset. This gives the city leverage. By coupling rent control with strict code enforcement and repair-and-deduct statutes, the city can mandate quality maintenance as a condition of renting. The quality degradation isn't an inevitable law of economics; it's a failure of complementary regulation.

  **Conclusion**
  The textbook model of rent control assumes a market that can respond to price signals. In a zoning-straitjacketed city, that market does not exist. The supply curve is a vertical line, the deadweight loss triangle shrinks to nothing, and the policy becomes a mechanism for distributing the rents of scarcity.

  There are still costs: mobility frictions and maintenance risks. But these are manageable through policy design (vacancy decontrol, code enforcement). If we accept that the housing stock is fixed by regulation, we must admit that the resulting high market rents are not a signal to build, but a tax on tenants for the benefit of landowners. Rent control, in this specific context, is simply a decision to collect that tax for the tenant instead. It may not be perfect, but it is not the efficiency disaster the Intro textbook claims it is.
