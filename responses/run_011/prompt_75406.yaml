      *   *The Math:* Area of triangle vs. Area of rectangle.
      *   *Objection 1:* Allocation. Argue that market allocation isn't perfect either (allocation by wealth vs. allocation by tenure).
      *   *Objection 2:* Quality. Argue for code enforcement as a complement.
      *   *Closing:* Reframe the debate.

  7.  **Final Review:** Does this sound like a smart student talking to an econ professor? Yes, it uses the right terminology (elasticity, deadweight loss, producer surplus) but challenges the application.

  *(Self-Correction during drafting)*: I need to make sure I don't claim rent control is *good*, just that the *efficiency critique* is weak in this specific context. The prompt asks to build the argument that it becomes a *distribution question*. I must stick to that.

  *(Refining the "Diagram-in-Words")*: I need to be very clear about the geometry.
  Standard: Triangle between $Q_s$ and $Q_e$.
  My Model: $Q_s = Q_e$. Base of triangle = 0. Area = 0.
