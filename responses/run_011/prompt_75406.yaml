  2.  **Deconstruct the Economic Argument:**
      *   *Standard Model:* Downward sloping demand, upward sloping supply. Price ceiling ($P_c$) below equilibrium ($P_e$). Quantity supplied ($Q_s$) drops, Quantity demanded ($Q_d$) rises. Shortage = $Q_d - Q_s$. DWL = triangle between supply and demand curves from $Q_s$ to $Q_e$.
      *   *User's Model:* Downward sloping demand. *Vertical* supply (perfectly inelastic) due to zoning. Price ceiling ($P_c$) below equilibrium ($P_e$). Quantity supplied ($Q_s$) stays same as $Q_e$. Shortage exists in terms of excess demand, but *no reduction in quantity housed*. DWL triangle collapses because the base of the triangle ($Q_e - Q_s$) is zero.
      *   *Implication:* The rectangle area ($P_e - P_c$) $\times$ $Q$ represents a transfer from producer surplus (landlords) to consumer surplus (tenants).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but academic. Something about zoning and the "vertical supply" curve.
      *   **Introduction:** Hook the reader. Acknowledge the standard intro econ take (it's not wrong, just incomplete). Introduce the constraint: Zoning. State the thesis: In tight markets, rent control is about distribution, not efficiency.
      *   **The Diagram in Words:** This needs to be precise.
