prompt: |-
  I am preparing an annotated commentary on the first section of Part II of Adam Smith's *Theory of Moral Sentiments* (1759; I am working from the text of the sixth edition, 1790) for a graduate reading group, and there is a paragraph whose argument I cannot pin down. Two excerpts, in the order they appear.

  **Excerpt 1** — from the introduction to Part II, where Smith sets out the machinery the rest of the Part runs on:

  > It has already been observed, that the sentiment or affection of the heart, from which any action proceeds, and upon which its whole virtue or vice depends, may be considered under two different aspects, or in two different relations: first, in relation to the cause or object which excites it; and, secondly, in relation to the end which it proposes, or to the effect which it tends to produce: that upon the suitableness or unsuitableness, upon the proportion or disproportion, which the affection seems to bear to the cause or object which excites it, depends the propriety or impropriety, the decency or ungracefulness of the consequent action; and that upon the beneficial or hurtful effects which the affection proposes or tends to produce, depends the merit or demerit, the good or ill desert of the action to which it gives occasion.

  **Excerpt 2** — from Part II, Section I, Chapter I:

  > But though dislike and hatred harden us against all sympathy, and sometimes dispose us even to rejoice at the distress of another, yet, if there is no resentment in the case, if neither we nor our friends have received any great personal provocation, these passions would not naturally lead us to wish to be instrumental in bringing it about. Though we could fear no punishment in consequence of our having had some hand in it, we would rather that it should happen by other means. To one under the dominion of violent hatred it would be agreeable, perhaps, to hear, that the person whom he abhorred and detested was killed by some accident. But if he had the least spark of justice, which, though this passion is not very favourable to virtue, he might still have, it would hurt him excessively to have been himself, even without design, the occasion of this misfortune. Much more would the very thought of voluntarily contributing to it shock him beyond all measure. He would reject with horror even the imagination of so execrable a design; and if he could imagine himself capable of such an enormity, he would begin to regard himself in the same odious light in which he had considered the person who was the object of his dislike. But it is quite otherwise with resentment: if the person who had done us some great injury, who had murdered our father or our brother, for example, should soon afterwards die of a fever, or even be brought to the scaffold upon account of some other crime, though it might sooth our hatred, it would not fully gratify our resentment. Resentment would prompt us to desire, not only that he should be punished, but that he should be punished by our means, and upon account of that particular injury which he had done to us.

  What I need is help working through Excerpt 2 against Excerpt 1, at the level of individual clauses. Specifically:

  1. Give me the logical architecture of the paragraph. There appear to be at least three distinct claims in play — a concession about hatred and dislike, a claim about being the innocent causal occasion of harm, and a claim about the object of resentment proper. Identify which sentences carry which, where the pivot at "But it is quite otherwise with resentment" lands, and what the paragraph is ultimately meant to establish about the difference between resentment and the other hostile passions. Then tell me what work the parenthetical "which, though this passion is not very favourable to virtue, he might still have" is doing: is it a rhetorical hedge, or does it restrict the class of agents the preceding claim applies to — and if it restricts it, does the restriction undermine the generality of the claim?

  2. Smith uses three different locutions for causal involvement in this stretch of the chapter: "instrumental in promoting his happiness" (in the gratitude paragraph immediately above), "to wish to be instrumental in bringing it about," "the occasion of this misfortune," and then "punished by our means." Are these stylistic variation, or do they pick out different relations? In particular, is "by our means" narrower than "the occasion of"? If it is, does the paragraph still support the strong reading I am inclined to give it?

  3. The sentence "Though we could fear no punishment in consequence of our having had some hand in it" deliberately strips away the sanction-based explanation of the painful sentiment. What is left inside Smith's own spectator theory to explain why it would hurt the man excessively to have been the designless occasion of the death? Sympathy with the sufferer seems unavailable, since the sufferer is the object of violent hatred; anticipation of the impartial spectator's disapproval seems to presuppose that the spectator disapproves, though the same paragraph implies there is no impropriety to disapprove of in the case; and self-command looks like the wrong category. Which resource is Smith using, or is he committed here to a sentiment that reduces to none of them?

  4. State the tension with Excerpt 1 as sharply as you can, and then try to dissolve it. Excerpt 1 makes merit and demerit depend on the effects an affection "proposes or tends to produce," which is a dispositional formulation. Excerpt 2 attaches a distinctive pain to the effect that actually occurred, in a case where the agent proposed nothing. Either show how the tendency formulation absorbs the case — and say what, on that account, the actual occurrence adds to a tendency that was already present — or concede that Excerpt 2 is a counterexample to the account of merit and demerit announced pages earlier.

  5. Test a colleague's reading, which I want either vindicated or dismantled. Her claim is that Smith is not making what a contemporary reader would call the claim that consequences alter how much blame is deserved. On her reading he is making a claim about ownership: once the agent is the occasion of the harm, the harm stands in a relation to him that it would not otherwise stand in, and the painful sentiment is a response to that relation rather than a misjudgment about desert — which means it is not an irregularity of sentiment requiring correction by general rules, but a perception of something real. Which words in the paragraph would have to carry that weight, and what resists it? Two things worry me: Smith locates the sentiment in a man under the dominion of violent hatred rather than in an ordinary or good agent, and he immediately assimilates the designless case to the voluntary one through the sentence about regarding himself "in the same odious light." On the second point, does that sentence apply to the designless case at all, or only to the imagined voluntary enormity? I have been reading it as continuous with the designless case, and I am no longer sure that is grammatically available.

  6. Whose sentiment is being reported in "it would hurt him excessively"? Is Smith describing what such a man does feel, what the impartial spectator would judge he ought to feel, or does the sentence slide between the two? Since the whole normative apparatus of the book depends on keeping those apart, tell me what turns on the answer here rather than merely noting the ambiguity.

  7. On the fever-and-scaffold case: does "punished by our means" commit Smith to the view that resentment demands that the resenting party be the executor of the punishment, or only that the punishment be responsive to the particular wrong in the right way? And if resentment is not satisfied by the offender's undergoing an equivalent harm from an unrelated source, then its object is a relation rather than a quantity of suffering. Does that give Smith a reason internal to this chapter to doubt that merit and demerit are a function of effects, and if so, is he in a position to use it, given Excerpt 1?

  8. Finally, tell me where I have over-read rhetoric as doctrine. Smith frequently accumulates pieces of illustrative psychology without committing to their theoretical significance, and I suspect I am doing exactly that in at least one of the questions above. Say which of my puzzles survives that suspicion and which dissolves once the paragraph is read as description rather than as argument.

  I am not after secondary literature, a reading list, or any bibliographic apparatus — I want the sentences themselves worked through. Where the paragraph cannot settle a question on its own, say so explicitly and identify which part of Smith's surrounding argument would have to be brought in to settle it.
reasoning: |-
  Here's a thinking process that leads to the suggested commentary:

  1.  **Analyze the Request:**
      *   **Task:** Annotated commentary on a specific paragraph from Adam Smith's *Theory of Moral Sentiments* (TMS), Part II, Section I, Chapter I (Excerpt 2), contrasted with the Introduction to Part II (Excerpt 1).
      *   **Context:** Graduate reading group. Needs high precision, close reading, logical architecture, and theoretical implications.
      *   **Constraints:** No secondary literature/bibliography. Focus on the sentences themselves. Identify where the text settles questions and where it requires surrounding argument.
      *   **Specific Questions:** 8 distinct questions covering logical architecture, causal locutions, spectator theory explanation, tension with Excerpt 1, colleague's reading (ownership vs. desert), sentiment attribution (descriptive vs. normative), resentment's object, and rhetoric vs. doctrine.

  2.  **Deconstruct Excerpt 1 (The Framework):**
      *   *Core Distinction:* Propriety (cause/object) vs. Merit/Demerit (effect/end).
      *   *Propriety:* Suitableness of affection to cause.
      *   *Merit/Demerit:* Beneficial/hurtful effects the affection *proposes or tends to produce*.
      *   *Key Phrase:* "proposes or tends to produce." This is dispositional/intentional, not merely consequentialist in a raw sense.

  3.  **Deconstruct Excerpt 2 (The Problematic Paragraph):**
      *   *Subject:* Difference between Hatred/Dislike and Resentment regarding causal involvement in harm.
      *   *Structure:*
          1.  Hatred/Dislike (without resentment) $\rightarrow$ Don't want to be instrumental in harm.
          2.  Accident/Designless Occasion $\rightarrow$ Hurts excessively to be the occasion.
          3.  Voluntary Harm $\rightarrow$ Horror, self-loathing.
          4.  *Pivot:* "But it is quite otherwise with resentment."
          5.  Resentment $\rightarrow$ Wants punishment *by our means* and *for that injury*.
      *   *Key Tension:* Excerpt 1 says Demerit depends on effects *proposed*. Excerpt 2 discusses pain felt when effects *occur* without being *proposed* (designless occasion).

  4.  **Drafting Responses to the 8 Questions:**

      *   **Q1: Logical Architecture & Parenthetical:**
          *   *Claims:* (1) Hatred doesn't make us want to cause harm (instrumentality). (2) Being the accidental cause hurts (even without design). (3) Resentment *does* want to cause harm (specifically punishment).
          *   *Pivot:* "But it is quite otherwise with resentment." Shifts from avoiding harm-causing to demanding harm-causing.
          *   *Parenthetical:* "which, though this passion is not very favourable to virtue, he might still have."
          *   *Analysis:* It's a hedge, but also a restriction. It acknowledges hatred is vicious but claims *justice* (a spark of it) remains. Does it undermine generality? Yes, slightly. It suggests the claim applies only to those with *some* justice. If someone lacks that spark, the claim might not hold. Smith is describing a normative psychological baseline, not a universal empirical fact.

      *   **Q2: Causal Locutions:**
          *   *Terms:* "Instrumental," "Occasion," "By our means."
          *   *Analysis:* "Instrumental" implies agency/tool-use. "Occasion" is broader (could be accidental). "By our means" implies specific agency in resentment.
          *   *Distinction:* "Occasion" is wider than "Means." One can be the occasion without intending the means.
          *   *Impact on Reading:* If "occasion" is accidental, the pain felt is about *causal connection*, not *intent*. This supports the "ownership" reading (Q5) but tensions with Excerpt 1 (Merit/Demerit requires intent/proposal).

      *   **Q3: Explaining the Pain (Spectator Theory):**
          *   *Problem:* Why hurt if no design? Sympathy with victim is blocked by hatred. Spectator disapproval? But there's no impropriety (no design).
          *   *Solution:* It's not about *Merit/Demerit* (Excerpt 1) yet. It's about *Propriety* of self-regard. The agent imagines the Impartial Spectator viewing the *connection*. Even if not blameworthy, the *association* is painful. It's a sentiment of "pollution" or "taint" rather than guilt. Smith relies on a pre-moral sentiment of causal agency. The spectator sympathizes with the *agent's* horror at the connection, not the victim's pain.

      *   **Q4: Tension with Excerpt 1:**
          *   *Tension:* Excerpt 1: Demerit = effects *proposed*. Excerpt 2: Pain/Demerit feeling = effects *occurred* (designless).
          *   *Dissolution:* Excerpt 1 defines *Merit/Demerit* (judgment of others). Excerpt 2 describes *Sentiment* (feeling of the agent). Smith often distinguishes the *sense* of merit from the *philosophical account* of merit. However, the stronger dissolution is that Excerpt 2 is setting up the *need* for general rules. The sentiment is "irregular." The *rule* corrects it. The sentiment feels like demerit, but reason/spectator says otherwise. Excerpt 1 is the rule; Excerpt 2 is the psychological irregularity the rule must govern.
          *   *Alternative:* "Tends to produce" includes accidental tendencies? No, "proposes" is key.
          *   *Conclusion:* Excerpt 2 highlights the *gap* between sentiment and philosophical propriety, which Part II, Section I aims to resolve via the Impartial Spectator/General Rules.

      *   **Q5: Colleague's Reading (Ownership vs. Desert):**
          *   *Claim:* Pain is about relation/ownership, not desert.
          *   *Evidence:* "Occasion of this misfortune." "Regard himself in the same odious light."
          *   *Resistance:* "If he could imagine himself capable of such an enormity..." This sentence structure is tricky.
          *   *Grammar Check:* "He would reject... and if he could imagine... he would begin to regard..." This second part refers to the *voluntary* case ("such an enormity"). The designless case ("without design") precedes it.
          *   *Verdict:* The colleague is right about the designless case (it's about causal ownership). The "odious light" sentence applies to the *voluntary* hypothetical, not the accidental one. The text distinguishes them: "Much more would the very thought of voluntarily contributing..."
          *   *Implication:* The pain in the accidental case is real but distinct from the guilt of the voluntary case.

      *   **Q6: Whose Sentiment? ("It would hurt him excessively"):**
          *   *Options:* Descriptive (what he feels) vs. Normative (what spectator approves).
          *   *Smith's Method:* Usually mixes them. "Would hurt" suggests a prediction of human nature (descriptive/nomological).
          *   *Stakes:* If descriptive, it's a fact of psychology to be managed. If normative, it's a duty.
          *   *Context:* Part II is about Merit/Demerit (judgments). But this section analyzes the *foundations* of those judgments. Smith is establishing a psychological baseline. It is likely a claim about what the Impartial Spectator would *expect* a human to feel, making it a normative description of human nature.
          *   *Turn:* If it's just descriptive, it doesn't ground morality. If it's what the spectator approves, it grounds the sentiment of justice. It's likely the latter: The spectator approves of the pain because it shows the agent has a "spark of justice."

      *   **Q7: Resentment and "By Our Means":**
          *   *Question:* Does resentment demand *we* punish, or just *responsive* punishment?
          *   *Text:* "Punished by our means, and upon account of that particular injury."
          *   *Analysis:* It demands agency ("our means") and specific recognition ("upon account of"). It's relational.
          *   *Implication for Excerpt 1:* Excerpt 1 says Demerit depends on effects. Resentment shows Demerit depends on the *relation* between agent, act, and victim.
          *   *Internal Doubt:* Yes, this suggests effects alone aren't enough. The *intentional relation* matters. Smith can use this because Excerpt 1 says effects the affection *proposes*. Resentment *proposes* punishment by us. Accidental harm is not *proposed*. So Excerpt 1 holds for *Merit*, but Excerpt 2 explains why we *feel* demerit accidentally. The tension is between *feeling* and *principle*.

      *   **Q8: Rhetoric vs. Doctrine:**
          *   *Suspicion:* Smith is piling on psychological illustrations.
          *   *Dissolves:* The specific grammar of the "odious light" sentence (Q5). It's easy to conflate the accidental and voluntary cases rhetorically, but logically they are distinct steps.
          *   *Survives:* The tension between Excerpt 1 and 2 (Q4). This is structural to TMS. The "irregularity of sentiment" is a core doctrine, not just rhetoric. The distinction between "occasion" and "means" (Q2) is also doctrinal, distinguishing accidental from intentional causality.

  5.  **Review and Refine:**
      *   *Tone:* Academic, precise, attentive to the 1790 text nuances.
      *   *Check:* Did I answer all 8 parts? Yes.
      *   *Check:* Did I avoid secondary lit? Yes.
      *   *Check:* Did I address the "spark of justice" parenthetical carefully? Yes.
      *   *Check:* Is the distinction between Propriety and Merit clear? (Crucial for Q4).
      *   *Refinement on Q4:* Make sure to emphasize that Part II, Section I is *about* the sense of Merit/Demerit. The "irregularity" is that our sentiments don't match the philosophical definition immediately. General Rules are the fix.
      *   *Refinement on Q5:* Be very precise about the grammar of "Much more..."

  6.  **Final Polish:** Organize by the 8 questions for clarity. Ensure the distinction between the "Introduction to Part II" (theoretical framework) and "Part II, Section I" (phenomenology of sentiment) is clear. (Self-Correction: Actually, Part II Section I *is* where he establishes the sense of merit/demerit. The Introduction sets the table. The tension is real and intended by Smith to motivate the need for the Impartial Spectator's correction).

      *Wait, one nuance on Q3:* Why does it hurt? Smith says "if he had the least spark of justice." It's the sentiment of Justice itself recoiling at the violation of the rule, even if the will didn't violate it. It's a contamination of the *self* in relation to the moral order.

      *Wait, one nuance on Q6:* "Would hurt" is counterfactual conditional. It's a claim about human nature as Smith sees it. It functions as a premise for the normative theory.

      *Wait, one nuance on Q1:* The parenthetical. "Though this passion [hatred] is not very favourable to virtue." Hatred is bad. But justice can exist within it. The restriction is on the *agent*, not the *passion*.

      *Let's write.*
answer: |-
  Here is an annotated commentary working through the logical and theoretical tensions between Excerpt 1 (Introduction to Part II) and Excerpt 2 (Part II, Section I, Chapter I), addressing your eight specific queries.

  ### 1. Logical Architecture and the Parenthetical Hedge

  **Logical Architecture:**
  The paragraph operates as a comparative phenomenology of hostile passions, structured in three movements:
  1.  **The Claim about Hatred/Dislike (Sentences 1–3):** Hatred, absent resentment, does not naturally seek *instrumentality* in harm. Even if punishment is feared, we prefer the harm happen by other means.
  2.  **The Claim about Accidental Causation (Sentences 4–6):** If one becomes the *designless occasion* of the hated object's death, it causes excessive pain. This pain escalates in the hypothetical voluntary case ("Much more...").
  3.  **The Pivot and Claim about Resentment (Sentence 7–end):** "But it is quite otherwise with resentment." Resentment *demands* instrumentality ("by our means") and specific recognition ("upon account of that particular injury").

  **The Pivot:**
  The pivot ("But it is quite otherwise with resentment") marks the transition from a passion that *avoids* causal responsibility for harm (Hatred) to a passion that *insists* upon it (Resentment). This establishes that Resentment is not merely a degree of Hatred but a distinct species of passion with a different teleology regarding agency.

  **The Parenthetical:**
  > *"...which, though this passion is not very favourable to virtue, he might still have"*

  This is a **restrictive hedge**, not merely rhetorical. It limits the scope of the preceding claim (that accidental harm hurts excessively) to agents who retain a "spark of justice."
  *   **Function:** It acknowledges that Hatred is vicious ("not very favourable to virtue"), yet insists that Justice is a distinct faculty that can survive within a vicious passion.
  *   **Undermining Generality?** Yes, it technically restricts the claim. Smith is not saying *all* men feel this pain, but that all men *capable of justice* feel it. However, for Smith, the capacity for justice is the baseline for moral agency. If an agent lacks this spark, they fall outside the scope of moral evaluation in TMS anyway. Thus, the restriction protects the normative universality of the claim without making an empirical claim about sociopaths or the utterly depraved.

  ### 2. Causal Locutions: Instrumental, Occasion, Means

  These are **not** merely stylistic variations; they mark distinct metaphysical relations between agent and effect.

  *   **"Instrumental in bringing it about" / "By our means":** These imply **agency and intention**. To be an instrument or a means is to be a tool of a will. This aligns with Excerpt 1's "affection... proposes."
  *   **"The occasion of this misfortune":** This is **causal but not necessarily agential**. One can be the occasion (e.g., leaving a door open which allows a murder) without intending the effect. This is wider than "instrumental."

  **Implication for your reading:**
  The paragraph relies on this distinction. The pain described in the middle of the paragraph attaches to being the *occasion* (accidental/causal), whereas the satisfaction of resentment attaches to being the *means* (intentional/agency).
  *   **Does this support your strong reading?** Yes. If "occasion" were synonymous with "means," the distinction between the designless case and the voluntary case would collapse. Smith needs "occasion" to be broader to generate the puzzle: Why do we feel pain (akin to demerit) for an *occasion* where we lacked the *means* (intent)?

  ### 3. Explaining the Pain: Spectator Theory Resources

  You ask what resource explains the pain ("hurt him excessively") when sympathy with the sufferer is blocked by hatred and no impropriety (design) exists.

  *   **Sympathy with the Victim:** Unavailable, as you note, due to hatred.
  *   **Anticipation of Spectator Disapproval:** This is the correct resource, but it requires nuance. The Impartial Spectator does not disapprove of the *action* (since it was designless), but the Spectator understands the **association of ideas**.
  *   **The Mechanism:** Smith relies on a psychological principle where the *effect* colors the judgment of the *cause*, even against reason. The agent imagines the Spectator viewing the *connection* between him and the death. The pain is not guilt (which requires impropriety) but **shame or horror at the association**.
  *   **Self-Command:** Not the primary category here.
  *   **The Specific Resource:** It is the **natural sentiment of humanity** recoiling at the *appearance* of mischief. Smith argues later that we punish accidental harm less, but we still feel a "stain." The sentiment is a primitive reaction to causal efficacy, which the Impartial Spectator must later *correct* via general rules. The pain is real, but the *judgment* of demerit based on that pain is what the Spectator corrects.

  ### 4. The Tension with Excerpt 1

  **The Tension:**
  *   **Excerpt 1:** Merit/Demerit depends on effects the affection **"proposes or tends to produce."** (Dispositional/Intentional).
  *   **Excerpt 2:** The agent feels excessive pain (a marker of demerit) when the effect **actually occurred**, even though the affection **proposed nothing**.

  **Dissolving the Tension:**
  You must distinguish between the **Philosophical Account of Merit** (Excerpt 1) and the **Psychological Sense of Merit** (Excerpt 2).
  *   Excerpt 1 states the *truth* of moral judgment: Demerit requires intention ("proposes").
  *   Excerpt 2 describes the *irregularity of sentiment*: Our feelings often track actual outcomes more than intentions.
  *   **Resolution:** Smith is not contradicting himself; he is identifying the **problem that General Rules solve**. The sentiment described in Excerpt 2 is "irregular." We *feel* demerit in the accidental case, but Reason and the Impartial Spectator (aligning with Excerpt 1) tell us there is none.
  *   **What the actual occurrence adds:** It triggers the irregular sentiment. The *tendency* was neutral (no design), but the *occurrence* activates the psychological association between "my act" and "bad effect." Excerpt 2 is the phenomenology of the error; Excerpt 1 is the normative standard used to correct it.

  ### 5. Testing the Colleague's Reading (Ownership vs. Desert)

  **The Claim:** The pain is about **ownership** (causal relation) rather than **desert** (blame).

  **Words carrying the weight:**
  *   "Occasion of this misfortune."
  *   "Having had some hand in it."
  *   "Regard himself in the same odious light."

  **What resists it:**
  The sentence: *"He would reject with horror even the imagination of so execrable a design; and if he could imagine himself capable of such an enormity, he would begin to regard himself in the same odious light..."*

  **Grammar Check:**
  You are right to worry. The sentence structure is:
  1.  Designless case ("without design... hurt him excessively").
  2.  Voluntary case ("Much more would the very thought of voluntarily contributing...").
  3.  Reaction to Voluntary case ("He would reject... design").
  4.  Hypothetical self-assessment ("if he could imagine himself capable of **such an enormity** [i.e., the voluntary design]... regard himself in the same odious light").

  **Verdict:**
  The clause "regard himself in the same odious light" applies **only to the voluntary case** ("such an enormity"). It does *not* grammatically apply to the designless case.
  *   **Colleague Vindicated:** For the designless case, the sentiment is about the *relation* (ownership of the effect), not the *guilt* (odious light). The pain is the recognition of causal efficacy, not moral blame.
  *   **Colleague Dismantled:** Only if you tried to extend the "odious light" clause to the accidental case. Smith keeps them distinct: Accidental = Pain/Hurt; Voluntary = Horror/Odious Light.

  ### 6. Whose Sentiment? ("It would hurt him excessively")

  **Analysis:**
  Smith is describing **what the Impartial Spectator judges the agent ought to feel**, presented as a fact of human nature.
  *   **Descriptive:** "It would hurt" sounds empirical.
  *   **Normative:** In TMS, "would" often signifies the reaction of a properly constituted human nature under idealized conditions.

  **What turns on this:**
  *   **If purely descriptive:** The pain is a psychological quirk with no moral weight. It creates a puzzle for morality but doesn't ground it.
  *   **If normative (Spectator-approved):** The pain is a **duty**. To feel no pain at being the accidental cause of death would indicate a lack of the "spark of justice" mentioned earlier.
  *   **The Turn:** It must be the latter. Smith needs this sentiment to be universal enough to ground the need for General Rules. If it were merely idiosyncratic, the rules wouldn't be necessary. The sentiment is the **raw material** of morality that requires refinement. It is what the Spectator sympathizes with *in the agent*, not the victim.

  ### 7. Resentment and "By Our Means"

  **Does it demand execution?**
  "Punished by our means" suggests the resenting party desires **agency** in the punishment, not just the outcome.
  *   **Relation vs. Quantity:** You are correct. Resentment wants the offender to suffer *because of us* and *because of the injury*. It is a demand for **recognition** of the relational breach. A fever kills the quantity of life; Resentment wants to kill the *insult*.

  **Internal Reason to Doubt Excerpt 1?**
  *   **Excerpt 1:** Demerit = Effects proposed.
  *   **Excerpt 2:** Resentment = Effects proposed *plus* specific relational context ("by our means," "upon account of").
  *   **Does this undermine Excerpt 1?** No, it refines it. Excerpt 1 says Demerit depends on the *affection*. Resentment shows that the *affection* itself contains a demand for specific relational justice, not just generic harm.
  *   **Smith's Position:** Smith can use this. Excerpt 1 is the abstract formula; Excerpt 2 is the concrete content of the "affection" (Resentment). The affection *proposes* a specific relational repair. Accidental harm fails this proposal, which is why Resentment is not satisfied by accidents. This confirms Excerpt 1: Demerit attaches to what the affection *proposes*. Since the accidental killer proposed nothing, Resentment (which demands a proposal) is not satisfied, and Demerit (which requires a proposal) is not fully assigned.

  ### 8. Rhetoric vs. Doctrine

  **Where you have over-read:**
  *   **The "Odious Light" Continuity (Q5):** You suspected the "odious light" sentence applied to the designless case. It does not. This is rhetoric piling up horror to emphasize the voluntary case. Reading it as applying to the accidental case creates a contradiction (feeling odious for what is not improper). Dissolve this: The accidental case is *painful*; the voluntary case is *odious*.
  *   **The "Spark of Justice" (Q1):** Do not treat the parenthetical as a loophole that weakens the theory. It is doctrinal: Smith is defining the bounds of moral humanity.

  **What survives:**
  *   **The Tension (Q4):** This is not over-reading. The conflict between the *sentiment* of demerit (triggered by effects) and the *rule* of demerit (triggered by design) is the central engine of Part II. Smith *wants* you to feel this tension. It motivates the introduction of General Rules.
  *   **The Causal Distinctions (Q2):** The shift from "occasion" to "means" is doctrinal. It marks the boundary between the realm of Fortune (where we are judged by effects) and the realm of Intention (where we are judged by design).

  **Final Note on Settlement:**
  The paragraph alone cannot settle whether the pain in the accidental case is *blame*. It only establishes that the *sentiment* exists. To settle whether that sentiment constitutes *demerit*, you must bring in **Part II, Section III (Of the influence of Fortune)** and **Part II, Section I, Chapter III (Where Smith discusses the influence of intention)**. There, Smith explicitly argues that while the sentiment tracks effects, the *judgment* of merit must track intention. Excerpt 2 provides the psychological data; the surrounding argument provides the normative correction.
