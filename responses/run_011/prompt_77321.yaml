prompt: |-
  I freelance for a couple of general-interest magazines, mostly science and ideas, and a real chunk of what lands in my inbox is archaelogy — press releases from digs, a new paper about some find, the odd tip from a grad student. It's maybe three or four a month where I have to decide, usually within a day, whether there's a story and what the story is allowed to claim. The thing I keep getting burned on isn't the physical evidence, it's the leap from objects to minds: a pile of stuff in the ground turns into "they worshipped a mother goddess," "they had hereditary rank," "they were in contact with a polity 400 km away." Sometimes that leap is solid and sometimes it's a vibe with a radiocarbon date stapled to it, and I genuinely cannot tell the two apart from a press release. I've had to sit through one correction already.

  So: build me a procedure I can actually run. Not a lecture on archaeological theory — a sequence of questions I ask in order, with what counts as a sufficient answer to each, and what answer means I stop. I want it to say where it kills the story outright, where it downgrades the story from a belief-level piece to an object-level piece ("here's a weird figurine" rather than "here's a religion"), and where it hands the decision to me or my editor because its a judgment call and not a fact question. Mark the steps that are procedure in name only — the ones where a checklist is just giving my gut a haircut.

  Ground it in whatever the discipline and the philosophy of it actually know about this kind of inference, and use the concepts that do real work even if they're jargon, but gloss each one in a clause so I can wield it without a textbook: equifinality, meaning different past processes leaving the same trace; formation processes and taphonomy, i.e. everything that happened to the assemblage after people dropped it, including the digging itself; the difference between a deposit that's a snapshot of one moment and one that's centuries of accumulated rubbish, which I think is called the Pompeii premise; middle-range reasoning, the bridge from what you can observe now to what happened then, and whether that bridge is borrowed from ethnography, from experiments, or from nothing; and the fact that a typology of artifact types is often the analyst's filing system rather than a category anyone in the past used. If there's a distinction I've left out that matters more than any of those, put it in and say why it outranks mine.

  Constraints: ten to fifteen minutes per story, sometimes with only an abstract and a press release to go on; I can email the lead author one or two questions, so tell me which questions are worth spending that on; no archaeologist on staff to phone; my editor signs off and pushes back hard if the hedging gets too thick, so the procedure should terminate in something I can put in a headline or a standfirst, not in a list of caveats. And no reading list, no citations, no named papers or authors — I can't check any of it and I don't want you inventing plausible-sounding ones.

  Then run it on three pitches, all hypothetical but typical:

  1. A site yields about forty small fired-clay figurines, mostly fragments, scattered across several house floors and middens spanning a few centuries; the team says the whole region shared a mother-goddess cult.
  2. A cemetery with roughly 120 burials where a handful of adults and two children are interred with far more and far better goods than everyone else; the team says this shows hereditary rank — an institution, not just some wealthy individuals.
  3. Use-wear and residue on a handful of stone flakes is read as plant-fibre working; the team says the group was making cordage or basketry.

  Also tell me plainly what the procedure can never license, no matter how beautiful the fieldwork — the class of claims that stays out of reach even when every step passes.

  And be honest about which of the three I'd actually file. I suspect 3 is the best-supported and the least sellable and 1 is the exact reverse, and I don't want you softening that to keep me happy. Take a position throughout: name the single step that does most of the work, say which of the three pitches you think is unfalsifiable as framed, and tell me where you think this whole exercise is a comfort blanket rather than a method. One committed answer I can argue with beats a menu of options.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Freelance journalist (science/ideas magazines).
      *   **Problem:** Too many archaeology press releases make unjustified leaps from physical evidence (objects) to mental/social claims (beliefs, hierarchy, contact). Needs a filtering procedure to avoid corrections.
      *   **Constraints:**
          *   10-15 minutes per story.
          *   Only abstract/press release + 1-2 emails to lead author.
          *   No staff archaeologist.
          *   Output must be headline-ready (not just caveats).
          *   No reading list/citations/named papers (avoid hallucination, save time).
          *   Must use specific concepts: equifinality, formation processes/taphonomy, Pompeii premise (snapshot vs. accumulation), middle-range reasoning, typology vs. emic categories.
          *   Must identify "procedure in name only" steps (gut checks).
          *   Must apply the procedure to three specific hypothetical pitches.
          *   Must state what claims are *never* licensable.
          *   Must take a committed position (which story to file, which step matters most, where the method is a comfort blanket).
      *   **Tone:** Direct, practical, skeptical, professional, no fluff.

  2.  **Deconstruct the Core Problem:**

      *   Archaeology deals with static remains (things) to infer dynamic processes (behavior) and abstract states (mind/culture).
      *   The "Leap" is the danger zone.
      *   The user needs a *triage* tool, not a peer review.
      *   Key philosophical hurdle: You can't dig up a thought. You dig up a thing that *might* imply a thought if other conditions are met.

  3.  **Develop the Procedure (The "Filter"):**

      *   *Goal:* 5-6 steps max to fit the 15-minute window.
      *   *Step 1: Taphonomy/Formation.* Did the dirt move the stuff, or did people? (Kills story if natural processes explain the pattern).
      *   *Step 2: Resolution/Pompeii Premise.* Is this a moment or a mush? (Downgrades "event" claims to "trend" claims).
      *   *Step 3: Equifinality.* Could anything else make this pattern? (The big killer of mental-state claims).
      *   *Step 4: Middle-Range Theory.* How did they get from A to B? (Ethnography? Experiment? Guesswork?).
      *   *Step 5: Typology/Emic vs. Etic.* Are these categories real or just the archaeologist's filing system?
      *   *Step 6: The "One or Two Questions" Rule.* What to ask the author.

      *   *Refinement:* Need to mark which steps are "gut haircuts." Step 5 (Typology) is often hard to judge from a press release. Step 3 (Equifinality) is the heavy lifter.

  4.  **Drafting the Procedure Steps:**

      *   *Step 1 (The Ground):* Formation Processes. Ask: "Is this context primary?" If it's a plow zone or mixed layer, stop.
      *   *Step 2 (The Time):* Resolution. Ask: "Is this a single event or an accumulation?" If accumulation, no "sudden change" stories.
      *   *Step 3 (The Bridge):* Middle-Range Reasoning. Ask: "What is the link between object and action?" If "it looks like," stop.
      *   *Step 4 (The Alternatives):* Equifinality. Ask: "What else makes this?" If no alternatives tested, downgrade to "possible."
      *   *Step 5 (The Categories):* Typology. Ask: "Did they use these categories?" Usually no. Downgrade "culture" to "assemblage."

      *   *Decision Points:*
          *   Kill: Bad formation, no bridge.
          *   Downgrade: High equifinality, low resolution.
          *   Handoff: Strong bridge, but social inference still risky.

  5.  **Addressing the "Never Licensable" Claims:**

      *   Specific thoughts/names (e.g., "They feared the dark").
      *   Specific linguistic affiliation without DNA/linguistics crossover.
      *   Unified "Culture" or "People" based solely on pottery style.
      *   Motivation (Why they did it, vs. What they did).

  6.  **Applying to the Three Pitches:**

      *   *Pitch 1 (Figurines/Mother Goddess):*
          *   Formation: Scattered across centuries (Accumulation).
          *   Equifinality: High. Toys? Debris? Ritual?
          *   Middle-Range: Weak. "Looks like woman" = "Goddess"?
          *   Verdict: Kill/Downgrade hard. Unfalsifiable.
      *   *Pitch 2 (Cemetery/Rank):*
          *   Formation: Burials are usually primary context (Good).
          *   Resolution: 120 burials = sample size (Good).
          *   Equifinality: Wealth = Rank? Or wealth = age/gender/guests?
          *   Middle-Range: Ethnography of burial wealth.
          *   Verdict: Plausible but needs "hereditary" proof (isotopes/DNA). Downgrade "Institution" to "Inequality."
      *   *Pitch 3 (Residue/Cordage):*
          *   Formation: Use-wear is microscopic (Good).
          *   Equifinality: Low. Specific polish = specific material.
          *   Middle-Range: Experimental archaeology (replication).
          *   Verdict: Strongest science, weakest headline. File as tech/innovation, not "culture."

  7.  **Selecting the "Committed Position":**

      *   *Best Step:* Equifinality. It's the logical checkmate.
      *   *Unfalsifiable:* Pitch 1 (Mother Goddess). You can't prove a negative on belief without text.
      *   *Comfort Blanket:* The whole procedure is a comfort blanket. Archaeology is inherently interpretive. The checklist creates an illusion of certainty where there is only probability.
      *   *Which to File:* Pitch 3. It's boring but true. Pitch 1 is a lie. Pitch 2 is a maybe.

  8.  **Refining the Output (Self-Correction during drafting):**

      *   *Check Constraints:* Did I use the jargon with glosses? Yes. Did I avoid citations? Yes. Is it under 15 mins to read/run? Yes.
      *   *Tone Check:* Am I being too academic? Need to sound like an editor talking to a writer. "Kill the story," "Downgrade the hed."
      *   *Gut Haircuts:* Explicitly label where the checklist fails (e.g., judging the quality of the middle-range theory from an abstract).
      *   *The "One or Two Questions":* Make them count. Don't ask "Is this true?" Ask "What is the alternative hypothesis?"

  9.  **Final Polish:**

      *   Ensure the distinction between "Object-Level" and "Belief-Level" is clear in the output.
      *   Make sure the "Never Licensable" section is stark.
      *   Verify the "Comfort Blanket" admission is honest.

  **(Self-Correction on Pitch 2):** Hereditary rank is hard to prove with just grave goods. You need bioarchaeology (diet/kinship). I need to make sure the procedure flags "Hereditary" specifically as a high-risk claim compared to "Social Stratification."

  **(Self-Correction on Pitch 3):** Residue analysis is robust but often overclaimed. "Plant fibre" is good. "Basketry" is an inference (could be string, could be wrapping). I need to ensure the procedure distinguishes the *material* from the *object*.

  **(Final Review against constraints):** No named papers. 10-15 min runtime. Headline-ready termination.

  Let's build the response.cw
answer: |-
  Here is the procedure. It is designed to be run in 12 minutes. It will not save you from every error, but it will save you from the embarrassing ones.

  ### The 5-Step Filter

  **Step 1: Formation Processes (The Dirt Check)**
  *   **Question:** Did the objects get there by human action or by the earth moving?
  *   **Look for:** Words like "primary context," "in situ," "sealed layer." Avoid "plow zone," "surface scatter," "mixed deposit," "secondary deposition."
  *   **Sufficient Answer:** The press release explicitly states the objects were found where they were used/dropped, not washed there by water or churned by plows.
  *   **Kill Condition:** If the context is "mixed" or "surface," kill any claim about specific behavior. You have a collection, not a scene.
  *   **Gut Haircut:** Press releases rarely admit to bad formation processes. If it's vague, assume the dirt moved.

  **Step 2: The Pompeii Premise (The Time Check)**
  *   **Question:** Is this deposit a snapshot of one moment or a trash pile of centuries?
  *   **Look for:** Dates. If the layer spans 300 years, it is not a "community" or an "event," it is an average.
  *   **Sufficient Answer:** Radiocarbon dates cluster tightly (e.g., within 50 years) OR the stratigraphy is a single floor surface.
  *   **Downgrade Condition:** If the layer spans centuries, you cannot claim "sudden change," "invasion," or "ritual event." You can only claim "long-term practice."
  *   **Gut Haircut:** Press releases love "spanning the transition." This is usually a smear of time, not a boundary.

  **Step 3: Middle-Range Reasoning (The Bridge Check)**
  *   **Question:** How did they get from *seeing* the object to *knowing* the action?
  *   **Look for:** The mechanism. Is it based on ethnography (watching modern people do it), experimentation (they tried it themselves), or analogy ("it looks like")?
  *   **Sufficient Answer:** "Experimental replication showed..." or "Ethnographic parallel in [specific region] suggests..."
  *   **Kill Condition:** If the link is "interpretation suggests" or "we believe," without a stated mechanism, the bridge is missing.
  *   **Gut Haircut:** Distinguishing a strong ethnographic parallel from a weak one is impossible from an abstract. Treat all ethnography as probabilistic, not proof.

  **Step 4: Equifinality (The Alternative Check)**
  *   **Question:** What else could have left this exact same trace?
  *   **Look for:** A sentence addressing other possibilities. "While X could indicate Y, we ruled out Z because..."
  *   **Sufficient Answer:** They explicitly name one alternative explanation and provide physical evidence for why it is wrong.
  *   **Downgrade Condition:** If no alternative is tested, the claim is a hypothesis, not a finding. Downgrade "They did X" to "Evidence is consistent with X."
  *   **Gut Haircut:** This step is the engine of the whole procedure. If they haven't thought of the alternative, you must.

  **Step 5: Typology vs. Emic Categories (The Label Check)**
  *   **Question:** Is the category (e.g., "ritual vessel," "weapon") real to the people or real to the archaeologist?
  *   **Look for:** Functional descriptions vs. cultural labels. "Bifacial tool" (description) vs. "Spearpoint" (function) vs. "Ceremonial knife" (meaning).
  *   **Sufficient Answer:** They stick to physical description until the very end.
  *   **Downgrade Condition:** If the object type itself implies the function (e.g., "votive figurine"), downgrade to "figurine." Let the reader decide if it was votive.
  *   **Gut Haircut:** You cannot know the emic (insider) category without written texts. Assume all cultural labels are the analyst's filing system.

  ---

  ### The Email Escape Hatch
  If you pass Steps 1–5 but feel the "Leap" (Step 4) is shaky, send **one** email to the lead author. Do not ask "Is this true?" Ask this:

  1.  *"What is the strongest alternative explanation for this pattern that your data rules out?"* (Tests Equifinality)
  2.  *"Is the link between [Object] and [Behavior] based on experimental replication or ethnographic analogy?"* (Tests Middle-Range Reasoning)

  If they hedge or say "It's the most likely explanation," you have your answer: It's a vibe.

  ---

  ### Termination States
  *   **KILL:** Fails Step 1 (Formation) or Step 3 (No Bridge).
  *   **DOWNGRADE:** Fails Step 2 (Time), Step 4 (Equifinality), or Step 5 (Labels). Change "Religion" to "Ritualized Behavior." Change "War" to "Violence." Change "Trade" to "Movement of Objects."
  *   **HANDOFF:** Passes all steps but makes a claim about social structure (rank, gender, polity). This is a judgment call for your editor. Frame it as "Evidence suggests" not "Proof shows."

  ---

  ### Claims This Procedure Can Never License
  No matter how perfect the fieldwork, the following claims are **out of reach** for archaeology alone. If a press release makes these, it is marketing, not science.
  1.  **Specific Motivation:** You can know *what* they did, never *why*. (e.g., "They killed him to appease the gods" is impossible. "He was killed in a ritual context" is possible.)
  2.  **Unified Identity:** You cannot prove a group of people thought of themselves as a single "Culture" or "Tribe" based on pottery styles. That is a modern filing cabinet imposed on the past.
  3.  **Linguistic Affiliation:** Pots are not people. You cannot claim "The X-Language Speakers arrived" based on graves.
  4.  **The "First":** Unless the dating resolution is incredibly tight and the area exhaustively surveyed, you cannot claim "The Earliest Known." You can only claim "The Earliest Known *So Far*."

  ---

  ### Running the Pitches

  #### Pitch 1: The Mother-Goddess Figurines
  *   **Step 1 (Formation):** "Scattered across several house floors and middens." **FAIL.** This is not a ritual deposit; it is trash mixed with living debris.
  *   **Step 2 (Time):** "Spanning a few centuries." **FAIL.** This is not a cult; it is a tradition of making objects that might have changed meaning 10 times in that window.
  *   **Step 4 (Equifinality):** **FAIL.** Could these be toys? Could they be ancestors? Could they be ballast? The press release does not say.
  *   **Step 5 (Labels):** "Mother-goddess." **FAIL.** This is a label imposed by the analyst.
  *   **Verdict:** **KILL.**
  *   **Why:** This is unfalsifiable as framed. You cannot prove a negative (that it *wasn't* a goddess), but the evidence provided (scattered fragments over centuries) supports "decorative objects" just as well as "deities."
  *   **File?** No. If you must, file as "Debate reignites over prehistoric figurines," focusing on the *interpretation*, not the *goddess*.

  #### Pitch 2: The Cemetery and Hereditary Rank
  *   **Step 1 (Formation):** Burials are usually primary context. **PASS.**
  *   **Step 2 (Time):** 120 burials. Need to know if they are contemporary. Assume **DOWNGRADE** to "over generations."
  *   **Step 3 (Bridge):** Wealth = Rank. **PASS** (Standard middle-range theory).
  *   **Step 4 (Equifinality):** **WEAK.** Wealth could be age-related (elders get more), or achievement-based (warriors), not necessarily *hereditary*.
  *   **Step 5 (Labels):** "Hereditary rank." **DOWNGRADE.** To prove heredity, you need DNA (kinship) or Isotopes (diet/origin). Grave goods alone only prove inequality.
  *   **Verdict:** **DOWNGRADE.**
  *   **File?** Yes, but change the headline.
      *   *Bad:* "Ancient Cemetery Reveals Hereditary Aristocracy."
      *   *Good:* "Grave Goods Suggest Deep Social Inequality in Neolithic Community."
      *   *Standfirst:* "Analysis of 120 burials indicates wealth was concentrated, though researchers debate whether status was inherited or earned."

  #### Pitch 3: Use-Wear and Cordage
  *   **Step 1 (Formation):** Stone flakes. **PASS.**
  *   **Step 2 (Time):** Use-wear happens at the moment of use. **PASS.**
  *   **Step 3 (Bridge):** Use-wear/Residue. **PASS.** This is experimental archaeology. They made cordage with stone tools and matched the microscopic scratches.
  *   **Step 4 (Equifinality):** **LOW.** Specific plant residues on specific edge damage is hard to equifinalize. It's either plant polish or not.
  *   **Step 5 (Labels):** "Cordage or basketry." **DOWNGRADE.** They found evidence of *working fiber*. Whether it became a basket, a net, or a string is an inference.
  *   **Verdict:** **FILE.**
  *   **Why:** This is the most robust science. It relies on physics and chemistry, not social interpretation.
  *   **File?** Yes.
      *   *Headline:* "Microscopic Traces Reveal Prehistoric Fiber Technology."
      *   *Standfirst:* "Residue analysis on stone flakes provides rare physical evidence of cordage production, pushing back the timeline for composite tools."

  ---

  ### The Committed Position

  **The Single Step That Does The Work:**
  **Step 4 (Equifinality).**
  Everything else is housekeeping. Equifinality is the logical checkmate. If two different causes produce the same effect, you cannot claim the cause without ruling out the rival. 90% of archaeology press releases fail this because "ruling out" is hard, and "suggesting" gets more press. If the author cannot name the alternative they defeated, they haven't done the science yet.

  **The Unfalsifiable Pitch:**
  **Pitch 1 (Mother Goddess).**
  Belief leaves no unique trace. A figurine used in worship looks identical to a figurine used as a toy, a gift, or a teaching aid. Unless found in a shrine (which itself is a label), the claim is theology, not archaeology. It is immune to disproof.

  **The Comfort Blanket:**
  **This whole procedure.**
  It creates an illusion of precision in a discipline built on ambiguity. Archaeology is inherently a "vibe with a radiocarbon date stapled to it." The difference between a "solid leap" and a "vibe" is often just the consensus of the moment. This checklist protects you from *egregious* errors, but it cannot protect you from the fact that the past is a foreign country and we are guessing at their customs based on their garbage. You are not verifying truth; you are verifying *coherence*.

  **Which One I'd File:**
  **Pitch 3.**
  It is the least sellable because "microscopic scratches on flint" does not scream "clickbait." But it is the only one that is actually true. Pitch 1 is a fantasy. Pitch 2 is a sociological guess. Pitch 3 is a physical fact. If you want to keep your job, file the boring truth. If you want to win awards and risk a correction, file Pitch 2 with heavy hedging. Never file Pitch 1.
