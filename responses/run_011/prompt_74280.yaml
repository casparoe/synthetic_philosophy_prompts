      *   *Key Insight:* The shift from 12 to 10 increases the conviction rate for *both* groups, but the *ratio* of False Positive to True Positive shifts unfavorably for the defense. The legal system cares about the *asymmetry* of error costs. CJT cares about *aggregate correctness*. This is a fundamental mismatch.

  5.  **Limitations & "Where the Theorem Contributes Nothing":**

      *   *Hung Juries:* CJT predicts a majority outcome. It doesn't model "no decision." Legal systems treat hung juries as mistrials (status quo = acquittal-ish). CJT treats this as failure to aggregate.
