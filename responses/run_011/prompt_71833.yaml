answer: |-
  **MEMORANDUM**

  **TO:** Public Safety Oversight Commission
  **FROM:** [Your Name], Commissioner
  **DATE:** May 15, 2024
  **SUBJECT:** Recommendation on Office of Violence Prevention Funding Renewal and Proposed Measurement Framework

  ### I. Purpose

  This memorandum serves to guide the Commission's vote this June regarding the three-year funding renewal of the Office of Violence Prevention (OVP). The authorizing ordinance mandates renewal only if the OVP "demonstrably reduces violence in the city." It does not define "violence," establish a baseline, or specify a population denominator.

  Given the conflicting data presented over the past four years, this memo argues that we cannot vote responsibly without first adopting a standing counting rule. I recommend we **Renew the OVP's funding with Conditions**, contingent upon the adoption of a standardized measurement framework.

  ### II. Factual Background

  The data before us presents a complex picture of a city in demographic flux:

  *   **Population:** Resident population declined ~20% (318,000 to 254,000) due to industrial closure and out-migration.
  *   **Homicides:** Decreased from 79 to 68.
  *   **Non-Fatal Shootings:** Increased from 141 to 173. Medical testimony suggests a portion of this increase reflects improved trauma response and survival rates, effectively reclassifying potential homicides as non-fatal shootings.
  *   **Domestic Violence (DV) Reporting:** Calls tripled. OVP attributes this to successful public awareness campaigns increasing reporting among previously silent victims.
  *   **Geographic Variance:** In two targeted neighborhoods, aggravated assaults fell by ~50%. In three adjacent non-targeted neighborhoods, they rose by ~20%.
  *   **Displacement:** 1,400 households were displaced by concurrent redevelopment. One Commissioner argues this constitutes "violence."
  *   **Reporting Discrepancy:** OVP submitted two reports for the same period. The State report (using resident population denominator) concluded violence fell. The Private Funder report (using daytime population denominator) concluded violence rose. The State Auditor validated both methodologies.

  ### III. The Measurement Problem: Determinate Truth vs. Constructed Metrics

  We must address a fundamental question before voting: *Is there a determinate fact of the matter regarding whether violence decreased, which our metrics merely track? Or is the answer fixed by our choice of metric?*

  **There is no determinate answer independent of our measurement choices.**

  "Violence rates" are not physical constants like gravity; they are social constructs derived from administrative decisions. When we choose a denominator (resident vs. daytime population), we are not uncovering the "true" rate; we are deciding which story the data tells. When the State Auditor validated both conflicting OVP reports, they acknowledged that neither was objectively "false," because the ordinance did not define the terms of truth.

  However, acknowledging that the answer is fixed by our choice does not mean the choice is **arbitrary**. A choice is non-arbitrary if it aligns with the **legislative intent** and the **lived experience of community safety**.

  1.  **Arbitrary Choice:** Selecting a denominator solely to ensure renewal (convenience) or to ensure termination (ideology).
  2.  **Non-Arbitrary Choice:** Selecting a denominator and definition that best captures the harm the ordinance was designed to prevent, ensures falsifiability, and remains consistent over time.

  If we do not fix these definitions now, every future renewal vote will devolve into a debate over mathematics rather than a review of public safety.

  ### IV. Proposed Standing Counting Rules

  To make the ordinance operable, I propose the Commission adopt the following rules as standing policy for this and future cycles:

  **1. Definition of Violence (The Numerator)**
  *   **Included:** Criminal acts involving physical force or threat thereof (Homicide, Aggravated Assault, Non-Fatal Shootings, Robbery).
  *   **Excluded:** Structural displacement (e.g., redevelopment).
      *   *Rationale:* While displacement causes profound harm and instability, conflating housing policy outcomes with criminal violence renders the term "violence" unfalsifiable. If everything is violence, nothing is measurable. We should recommend the City Council track displacement separately, but it should not count toward the OVP's statutory mandate.
  *   **Treatment of Reporting Increases:** Increases in DV hotline calls or similar metrics must be contextualized. If independent evidence (surveys, arrest data) suggests increased reporting due to trust, this shall be weighed as a neutral or positive indicator, not a negative one.

  **2. Population Denominator**
  *   **Standard:** Official Census Bureau resident population estimates.
  *   **Caveat:** Raw numbers (counts) must be reported alongside per-capita rates.
      *   *Rationale:* In a city with shrinking population, per-capita rates can remain stable even if the total volume of suffering remains high. Conversely, raw numbers can drop simply because people left. We need both to assess risk intensity and total harm. Daytime population is too volatile for municipal statutory compliance.

  **3. Baseline Reset**
  *   Due to the demographic shift (20% population loss) and the change in measurement policy, the baseline for the *next* cycle must be reset to the current year's data. Comparing future performance against pre-decline data is statistically invalid.

  ### V. Recommendation: Renew with Conditions

  I recommend we vote to **Renew** the OVP funding, subject to the following conditions:

  1.  **Adoption of Metrics:** The OVP must adopt the Counting Rules above for all future reporting to the Commission.
  2.  **Displacement Tracking:** The OVP must coordinate with the Housing Authority to track displacement in target zones as a secondary "Community Stability" metric, reported separately from violence statistics.
  3.  **Single Reporting Standard:** The OVP is prohibited from submitting conflicting statistical narratives to different funders regarding city-wide violence trends. They must disclose all methodologies used in external reports to this Commission.

  **Justification:**
  The OVP has demonstrated success in its targeted zones (-50% assaults) and likely contributed to the reduction in homicides. The rise in non-fatal shootings is partially confounded by improved medical outcomes—a positive societal development that should not penalize the OVP. Terminating funding now would disrupt interventions that are showing promise in specific neighborhoods. However, the dual reporting and lack of definitional clarity are governance failures that must be corrected.

  ### VI. The Strongest Case for the Opposing Position (Do Not Renew)

  Colleagues who vote **Do Not Renew** will argue the following, and their points merit serious weight:

  *   **The "Net Harm" Argument:** Despite the OVP's presence, the city is more dangerous in aggregate terms regarding non-fatal shootings (141 to 173). Even if survival rates are better, 173 people were shot versus 141. The ordinance requires a reduction in violence, not an improvement in trauma care.
  *   **The Displacement Argument:** The Commissioner arguing that displacement is violence is morally correct, even if statistically inconvenient. The OVP was created alongside a redevelopment plan that displaced 1,400 households. If the Office cannot mitigate the violence inherent in that displacement, it has failed the *community*, even if it satisfied the *statute*.
  *   **The Integrity Argument:** The fact that the OVP filed two contradictory reports to different funders suggests a willingness to manipulate data to secure revenue. If they cannot tell the Commission a single, consistent truth about whether violence rose or fell, they cannot be trusted with public funds. The ambiguity in the ordinance should be resolved in favor of the taxpayer: if it's not demonstrably clear that violence fell, the benefit of the doubt goes to the public treasury, not the agency.

  ### VII. Vulnerabilities in This Recommendation

  My recommendation to Renew with Conditions is exposed in three specific areas:

  1.  **Enforceability:** We are a civilian oversight body. If the OVP refuses to adopt our counting rules or continues dual reporting, do we have the legal power to claw back funds mid-cycle? If not, our "Conditions" may be performative.
  2.  **The "Success" Trap:** By resetting the baseline and excluding displacement, we risk insulating the OVP from the broader consequences of city policy. If we make the metrics too easy to satisfy, we validate a narrow version of safety that ignores why people are leaving the city (the plant closure and redevelopment).
  3.  **Political Optics:** Voting to Renew while acknowledging the data is ambiguous may look like we are ignoring the rise in shootings. If a high-profile shooting occurs shortly after our vote, the Commission will be accused of negligence for renewing an office that "failed" to stop the rise in non-fatal incidents.

  ### VIII. Conclusion

  The ordinance asks a question it does not give us the tools to answer. It is our duty to build those tools. We should renew the Office because the alternative is abandoning interventions that are working in specific neighborhoods during a time of crisis. But we must renew it only if we agree on what "working" means.

  I move that we adopt the Proposed Counting Rules as a precondition to the renewal vote.

  Respectfully submitted,

  [Your Name]
  Commissioner, Public Safety Oversight Commission
