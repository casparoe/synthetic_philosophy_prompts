      *   *Is it just verbal?* No, because the verbal difference protects different institutional norms.
      *   *What counts as progress?* Be specific. A formal theorem won't do it. A measurement result might, if robust. But mostly a change in question: from "Is it true?" to "Is it legitimate to act as if it is true?"

