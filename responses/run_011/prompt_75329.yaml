      *   *The Friend's HTA Perspective:* Don't measure "utility" (vague, loaded). Measure "health loss" (specific, technical). Disability weights changed because the *question* changed, not because the *truth* changed.

  3.  **Address the Diagnostic Questions:**

      *   *Verbal Dispute?* Yes, partly. "Utility" is doing too much work. For the orthodox economist, it's a mathematical representation of consistency in choice. For the philosopher/policymaker, it's a proxy for "goodness of life." But calling it *just* verbal is too dismissive. The definitions carry ontological commitments.
