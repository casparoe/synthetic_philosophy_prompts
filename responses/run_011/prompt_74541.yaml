  4.  **Identify What Is Actually Being Tracked:**
      *   The "Control/Reliability/Third-Party" principle is too procedural.
      *   The user's intuitions are substantive.
      *   *Key Distinction 1 (Bedside vs. Job Refusal):* It's not just control. It's about the *reasonableness of the expectation* relative to the *social value* of the alternative activity. Caring for a dying mother is socially valuable/necessary. Refusing a "beneath me" job is arguably not (or less so).
      *   *Key Distinction 2 (Zero-Hours Man):* It's about *futility* and *dignity*. Requiring someone working 38 hours to look for more work is bureaucratic violence. It treats them as a case, not a worker.
      *   *Key Distinction 3 (Two-Child vs. Cap):* The Cap limits *total* income to mimic work incentives (principle of less eligibility/work always pays). The Two-Child limit punishes *existence* of children. The user tracks "punishing children's existence" vs "capping household lifestyle."
      *   *Key Distinction 4 (Carers):* Intensity of care. Full-time care for disabled adult = replacement of state care. Part-time care for school kids = compatible with work.
      *   *Core Tension:* The user is oscillating between **Reciprocity** (you must do something for the money) and **Need/Status** (some needs/roles exempt you from reciprocity).

  5.  **Formulate Candidate Principles:**
      *   *Candidate A: Reasonable Expectation & Social Value.* Conditionality is permissible only where the required conduct is a reasonable expectation of a citizen *and* does not displace activity of equal or greater social value (e.g., caring for dying parent vs. looking for work).
          *   *Saves:* Bedside man (care > job search), Zero-hours man (unreasonable expectation), Carers (intensity matters).
          *   *Fails:* Woman refusing min-wage job. Is refusing a job "socially valuable"? No. So sanction is okay. This fits.
