      *   *Section 2: Diagnosing the Intuition.* It's not just control/reliability. It's about *Reasonable Expectation*, *Social Value of Alternatives*, and *Civic Status*.
      *   *Section 3: Candidate Principles.* Offer a "Reciprocity within Reasonable Opportunity" principle. Admit where it breaks (Cap vs Two-Child is the weak point).
