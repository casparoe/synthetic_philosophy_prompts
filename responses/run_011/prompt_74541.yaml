          *   *Fails:* Bedside man (conduct, not status).

      *   *Synthesis Principle:* **Reciprocity constrained by Reasonable Opportunity and Non-Harm to Innocents.**
          *   1. Reciprocity is required (work/search) *unless* the claimant is engaged in socially recognised alternative contribution (care) or lacks capacity.
          *   2. Demands must not be futile or administratively oppressive (Zero-hours).
          *   3. Sanctions must not disproportionately harm dependents who cannot consent (The Cap vs. Two-Child distinction is hard here, but maybe the Two-Child limit is seen as *creating* poverty rather than *capping* it).

      *   *Honest Assessment:* The user's verdicts on the Cap vs. Two-Child limit are the hardest to reconcile. The Cap also hurts children. The distinction might be that the Cap preserves the "work incentive" logic (you shouldn't be better off not working), whereas the Two-Child limit breaks the link between need and support regardless of work.
      *   *Better Principle:* **The Principle of Civic Status.** Conditionality is permissible only where it treats the claimant as a civic agent capable of reciprocity, without undermining their basic standing or the standing of their dependents.
          *   *Bedside:* Undermines standing (forces choice between family duty and state duty).
          *   *Zero-hours:* Undermines standing (treats full-time worker as unemployed).
          *   *Two-Child:* Undermines standing of children (penalises existence).
          *   *Cap:* Preserves standing of "worker" as the benchmark.
          *   *Job Refusal:* Preserves standing (you refused the civic duty of work).

  6.  **Apply to New Cases:**
