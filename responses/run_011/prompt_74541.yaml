      *   *Deserving/Undeserving:* User is trying to *reconstruct* this but move away from moralistic judgment towards structural fairness. The verdicts suggest abandoning the moralistic "deserving" label in favour of "civic standing."

  8.  **Drafting the Response (incorporating British English and Academic Tone):**
