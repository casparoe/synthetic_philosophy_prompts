  # Module: Probability and Its Interpretations
  ## Session Plan: The Chord Paradox

  ### 1. No Framing Lecture
  Do not introduce the session with a lecture, the name "Bertrand's Paradox," or the phrase "principle of indifference." Do not write the learning objectives on the board.

  **Action:** As students enter, hand each a "Task Sheet" (see Tally Sheets). The sheet displays a large circle with an inscribed equilateral triangle and a dashed inner circle (50% radius). The only text is: *"Generate 20 chords using your group's device. Mark each 'Long' if it crosses the dashed line, 'Short' if it does not. Record your count."*

  Allow them to read this and begin immediately. The conflict arises when groups compare results. Reveal the puzzle's name and the forbidden phrases only at **Minute 55** during the Debrief.

  ### 2. Four Generating Devices
  Divide the class into four groups of 4-5 students. Assign each group one device. Provide the specific construction kit for that device.

  **Device 1: The Spinner (Endpoints)**
  *   **Materials:** Pin, string (length = radius), paper clip (as pointer).
  *   **Procedure:** Pin the string at the circle's center. Fix one chord endpoint at the top vertex of the triangle. Spin the string blindly; where the paper clip stops on the circumference is the second endpoint. Draw the chord.
  *   **Convergence Value:** 1/3 (33.3%).
  *   **Derivation:** Fix point A. The circumference is divided into three equal 120° arcs by the triangle vertices. The chord is longer than the side only if the second point falls on the single arc opposite A. 1 arc / 3 arcs = 1/3.
  *   **Measurement-Free Criterion:** Does the chord cross the dashed inner circle? (Reveal reason at Minute 55).

  **Device 2: The Slider (Radius Distance)**
  *   **Materials:** String (length = radius) with a sliding knot, ruler.
  *   **Procedure:** Tie one end of the string to a pin at the center. Slide the knot to a random position along the string (eyes closed). Draw the radius through that point. Draw the chord perpendicular to that radius at the knot's position.
  *   **Convergence Value:** 1/2 (50.0%).
  *   **Derivation:** The chord is determined by its distance $d$ from the center ($0 \le d \le R$). It is longer than the side if $d < R/2$. Assuming uniform probability for the knot's position, favorable length ($R/2$) / total length ($R$) = 1/2.
  *   **Measurement-Free Criterion:** Does the chord cross the dashed inner circle?

  **Device 3: The Pin Drop (Midpoint)**
  *   **Materials:** Box of dressmaking pins.
  *   **Procedure:** Hold a pin 30cm above the sheet. Drop it blindly. If it lands inside the circle, that point is the chord's *midpoint*. Draw the chord that has this point as its center (perpendicular to the radius connecting center to point). If it lands outside, re-throw.
  *   **Convergence Value:** 1/4 (25.0%).
  *   **Derivation:** The midpoint is chosen uniformly from the area of the disk. The chord is longer if the midpoint falls inside the concentric circle of radius $R/2$. Area ratio = $\pi(R/2)^2 / \pi R^2 = 1/4$.
  *   **Measurement-Free Criterion:** Does the chord cross the dashed inner circle? (Note: For this device, the dropped pin *is* the midpoint. If the pin is inside the dashed circle, the chord is Long).

  **Device 4: The Straw Toss (Physical Lines)**
  *   **Materials:** 10 drinking straws (cut to length > circle diameter), scissors.
  *   **Procedure:** Stand 1 meter from the table. Toss a straw onto the sheet. If it intersects the circle, use a ruler to extend the straw's edge into a full chord across the circle. If it misses, re-toss.
  *   **Convergence Value:** 1/2 (50.0%).
  *   **Derivation:** A random line thrown on a plane possesses translation and rotation invariance. This physical measure corresponds to the "random radius distance" method. Value = 1/2.
  *   **Measurement-Free Criterion:** Does the chord cross the dashed inner circle?

  **Criterion Reveal:** At **Minute 55**, explain: *"An equilateral triangle's side is at distance $R/2$ from the center. Any chord closer to the center than that distance is longer. The dashed line marks $R/2$. Crossing it means 'Long'."*

  ### 3. The Nested-Circle Audit
  **Materials:** Give each group a card ring (radius = 55% of worksheet circle) and a photocopied reduction of their worksheet (60% scale).

  **Procedure:**
  1.  **Prediction:** Before testing, each group writes down: "Will our chord pattern look the same inside the ring as on the whole sheet? (Yes/No)" and "Will the pattern change if we move the ring off-center? (Yes/No)."
  2.  **Test A (Concentric):** Place the ring concentrically. Compare the density of chords inside the ring to the whole sheet.
  3.  **Test B (Translation):** Move the ring clearly off-center. Does the density of chords inside the ring change visibly?
  4.  **Test C (Scale):** Compare the proportion of 'Long' chords on the original sheet vs. the photocopy.

  **Results & Explanation:**
  *   **Device 1 (Spinner):** Fails Test A (Chords avoid the center; ring looks empty). Passes Test C (Scale invariant).
  *   **Device 2 (Slider):** Passes Test A (Chords cross through). Fails Test B (Bundles of parallel lines mean density changes as ring moves across angles). Passes Test C.
  *   **Device 3 (Pin Drop):** Passes Test A (Uniform density). Passes Test B (Uniform density). Passes Test C.
  *   **Device 4 (Straws):** Passes Test A. Passes Test B (Approximately). Passes Test C.

  **The Assumption:** The tests assume that a "truly random" chord distribution should not depend on where you look in the circle (Homogeneity) or how big the circle is (Scale Invariance).
  **Correction for Wrong Prediction:** If a group reports the opposite (e.g., claims Device 1 looks uniform in the center), place the ring over their data physically and ask them to count chords in the ring vs. the outer band. The empirical absence of chords in the center for Device 1 is stark.

  ### 4. Posted Credences and Scoring
  **Scheme:** Each student receives a "Credence Card" with numbers 0 to 100. Before the device is run for the batch, they circle a number $p$ representing their % confidence the next chord will be Long.

  **Scoring Rule (Simplified Brier):** Provide a lookup table on the Tally Sheet.
  *   **If Chord is Long:** Score = Table Value (Yes).
  *   **If Chord is Short:** Score = Table Value (No).
  *   *Table:*
      *   Credence 0: Yes=0, No=100
      *   Credence 25: Yes=44, No=94
      *   Credence 50: Yes=75, No=75
      *   Credence 75: Yes=94, No=44
      *   Credence 100: Yes=100, No=0
      *   (Linear interpolation for others).

  **Why it Rewards Honesty:** This is a "proper scoring rule." Mathematically, your expected score is maximized only if you circle the number matching your true belief. If you believe the chance is 50% but circle 75%, your average score drops.

  **Where the Explanation Fails:** You cannot demonstrate *why* this is true without calculus (maximizing expected value functions). Students must trust the instructor's assertion that "lying lowers your average score," as they cannot compute the expectation for arbitrary rules in their heads.

  ### 5. A Cross-Group Market
  **Setup:** Write on the board: *"A randomly chosen chord is longer than the side of the triangle."*
  Assign each group a "Market Maker" role for their device's outcome. They post a Buy and Sell price (0-100 tokens) for a token that pays 100 if the statement is true.

  **The Trap:** Group 1 (1/3) will price low (~35). Group 2 & 4 (1/2) will price mid (~50). Group 3 (1/4) will price lower (~25).

  **Facilitator Script (5 Minutes):**
  "Trading is closed. Group 1, you priced this at 35. Group 2, you priced at 50. By all rights, Group 2 should buy from Group 1 and make a risk-free profit. But no one did. Why?
  Look at the sentence on the board. 'A randomly chosen chord.'
  Group 1, what does 'random' mean to you?" (Students: "Endpoints.")
  "Group 3?" (Students: "Midpoint.")
  "You are not trading the same asset. You are trading 'Chord-Type-1 is Long' against 'Chord-Type-3 is Long.' The sentence on the board is not a single proposition. It is four different sentences wearing the same mask. There is no arbitrage because there is no shared referent for the word 'random'."

  **Underlying Point:** Probability statements are elliptical; they hide the generating model. Without specifying the model, the sentence has no truth conditions.

  ### 6. Sample Sizes and Statistical Power
  **Trials:** 20 trials per student. 18 students = 360 trials per device (Pooled).
  **Calculation:**
  *   Standard Error (SE) for $p=0.5, n=360 \approx \sqrt{0.25/360} \approx 0.026$.
  *   Gap between 1/3 (0.33) and 1/2 (0.50) is 0.17. This is $> 6$ SE. Highly distinguishable.
  *   Gap between 1/3 (0.33) and 1/4 (0.25) is 0.08. This is $\approx 3$ SE. Distinguishable.
  **Substitution:** If individual groups (n=80) produce noisy data, pool the class totals on the blackboard immediately after generation.
  **Defense:** "Pooling does not give you the answer; it reduces the noise so *your* data can speak. A sample of 80 is too small to distinguish 25% from 33% reliably. A sample of 360 lets the empirical frequency converge enough to show the divergence is real, not just luck."

  ### 7. Minute-by-Minute Timeline
  *   **00-05:** Entry. Hand out Task Sheets. Silence. Students read and organize into groups.
  *   **05-10:** Device Construction. Instructor distributes kits. Groups build their specific device.
  *   **10-15:** Prediction & Credence. Students post credences on Task Sheet. Predict Audit outcomes.
  *   **15-35:** Data Generation. Students run 20 trials each. Mark Long/Short. Tally results.
  *   **35-45:** Nested-Circle Audit. Groups use rings and photocopies. Record Pass/Fail.
  *   **45-55:** Cross-Group Market. Groups post prices. 5 minutes trading. Scripted intervention.
  *   **55-70:** Debrief. Reveal criterion logic. Reveal "Bertrand's Paradox." Discuss indifference.
  *   **70-75:** Exit Ticket. "Write one sentence: What is the probability?" (Collect to show divergence remains).

  ### 8. The Debrief
  Map the activity to concepts:
  *   **Device 1:** Treats *Arc Length* as uniform.
  *   **Device 2:** Treats *Linear Distance* along a radius as uniform.
  *   **Device 3:** Treats *Area* of the disk as uniform.
  *   **Indifference:** Applying the "Principle of Indifference" to arc, distance, and area are three different acts. It is not one principle applied badly; it is one phrase applied to three different variables.
  *   **Exhaustivity:** These four devices are not exhaustive. One could generate a chord by picking a point outside the circle and drawing tangents, yielding a 5th value.
  *   **Tests:** The Audit tests (Scale/Translation) suggest Device 2 and 4 are "more physical" (invariant), but they do not prove they are the "correct" answer to the original question, because the original question specified no physical context.
  *   **What Remains:** At the end, the question "What is the probability?" remains ill-posed.
  *   **Student Takeaway:** On the way in, they thought probability was a property of the *chord*. On the way out, they should say probability is a relation between a *question* and a *model*.

  ### 9. Predictable Failures
  1.  **Biased Hand Randomness:** Students subconsciously aim for the center when dropping pins (Device 3).
      *   *Remedy:* Instruct them to drop from shoulder height, eyes closed.
  2.  **Clustering:** Straws bunch in one corner of the table (Device 4).
      *   *Remedy:* Clear the table between tosses; require a minimum throw distance.
  3.  **Tangent Straws:** Straws land nearly tangent, making "Long/Short" ambiguous.
      *   *Remedy:* Rule: "If it doesn't clearly cross the dashed line, it's Short."
  4.  **The "Good Student" Effect:** A group guesses the lesson and reports 1/3, 1/2, 1/4 regardless of data.
      *   *Remedy:* Collect raw tally sheets with individual trial marks. Check for fabrication (e.g., perfect 50/50 split).
  5.  **Market Collapse:** One confident student dictates prices for all groups.
      *   *Remedy:* Assign specific "Trader" roles per group. Instructor acts as clearinghouse; groups submit prices secretly.
  6.  **Noisy Empirical Frequencies:** Group data doesn't separate 1/3 from 1/4.
      *   *Remedy:* Use the pooled class total (see Point 6). Emphasize that the *divergence between groups* is the data point, not the exact match to theory.

  ### 10. The Honest Limitation
  **The Feature:** The original puzzle specifies *no generating mechanism*. Every device in this session *supplies* one.
  **The Abstraction:** To recover the paradox, you must state: *"We have solved four different well-posed problems. The original problem asks us to choose one of these problems without giving us a reason to choose."*
  **What is Lost:** The metaphysical anxiety. By building devices, you make the ambiguity concrete. You lose the feeling of the "void"—the genuine confusion of a question that seems complete but isn't. The activity resolves the tension by showing *how* to resolve it (pick a model), rather than leaving the students in the unresolved state of the original paradox.
  **Staging:** At Minute 70, erase the board. Leave only the sentence: *"A chord is chosen at random."* Ask: *"Where is the mechanism?"* When they say "It's not there," say: *"Then the probability is not there either."*

  ---

  # Materials List
  *   **Worksheets:** 18 copies. Printed with: Large Circle (Radius 10cm), Inscribed Equilateral Triangle, Dashed Concentric Circle (Radius 5cm).
  *   **Card Rings:** 4 copies. Radius 5.5cm, cut out center.
  *   **Photocopies:** 4 copies of Worksheet reduced to 60% scale.
  *   **Device Kits (4 sets):**
      *   *Kit 1:* 4 Pins, 4 strings (10cm), 4 paper clips.
      *   *Kit 2:* 4 Pins, 4 strings (10cm) with sliding knots, 4 small rulers.
      *   *Kit 3:* 1 Box of dressmaking pins (shared).
      *   *Kit 4:* 20 Drinking straws, scissors.
  *   **General:** 18 Pens, 4 Tally Sheets (A3 size for group recording), Tokens (for scoring, optional if using paper scores).

  # Tally Sheet Description
  **Header:** Group Number | Device Name
  **Section 1: Credence:** "Before starting, circle your confidence (0-100) that a chord will be Long."
  **Section 2: Trials:** 20 Rows. Columns: [Trial #] [Long/Short] [Score (use lookup)].
  **Section 3: Audit:** Checkboxes for [Concentric Pattern Same?] [Off-Center Pattern Same?] [Scale Reduction Same?].
  **Section 4: Market:** [Buy Price] [Sell Price].
  **Footer:** "Total Long Chords: ___ / ___"
