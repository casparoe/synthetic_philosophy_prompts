  2. **The room**
  The social choice theorists want axiom independence and uniqueness proofs; they'll probe whether the common-weight result is an artifact of your domain restrictions. They need to see the math holds without hidden continuity assumptions. The philosophers want normative traction; they'll ask if "epistemic weight" truly bypasses the comparability problem or just renames it. The prioritarian will demand to know where priority to the worse-off enters if weights are merely epistemic; they need assurance this doesn't lock us into utilitarianism via the back door. The Bayesian statistician cares about diachronic coherence; they need to know if your social observer can learn without becoming irrational. You've overlooked the imprecise probability crowd; if they argue the social observer should have a set of probabilities rather than a linear pool, your single-weight vector claim fractures immediately.

  3. **The objections, ranked**

  **1. The Spurious Unanimity Objection**
  **Who:** A philosopher of economics familiar with Mongin's work.
  **Idiom:** "Spurious unanimity," "common cause," "factual vs. value."
  **Target:** The Pareto principle on beliefs is normatively suspect when agreement arises from offsetting errors.
  **Reply:** You are right that spurious unanimity undermines the normative force of Pareto. However, my theorem is conditional: *if* the social observer respects unanimity, *then* weights match. I am not defending Pareto on beliefs as morally sacrosanct; I am showing that accepting it entails the identity of pooling problems. If you reject Pareto on beliefs to avoid spurious unanimity, you concede my point that the standard reading (which assumes common beliefs) hides this linkage. The theorem exposes the cost of unanimity, not its virtue.
  **Softness:** I must concede that if Pareto on beliefs is rejected, the theorem loses its normative bite for welfare aggregation. It becomes a consistency result for a specific type of aggregator, not a justification for utilitarianism or epistemic authority.

  **2. The Ex Ante Pareto Objection**
  **Who:** The committed prioritarian.
  **Idiom:** "Ex ante vs. ex post," "priority to the worse off," "risk equity."
  **Target:** Your linear weights ignore risk attitudes; a prioritarian transformation is needed.
  **Reply:** The theorem operates at the level of von Neumann–Morgenstern utilities, which already encode risk attitudes. If an individual is risk-averse, their utility function is concave. My weights aggregate these already-transformed indices. Priority weighting would require a second-order transformation of the social utility, which violates the Pareto principle over lotteries unless the social observer shares that specific priority function.
  **Softness:** I have to assume the social observer's risk attitude is constrained by the individuals'. If the prioritarian insists the society should be more risk-averse than any individual, my result blocks that unless we drop Pareto.

  **3. The State-Dependence Objection**
  **Who:** Mathematical social choice theorist.
  **Idiom:** "State-dependent utility," "Karni's representation," "identification."
  **Target:** You assume state-independent utility; if utilities depend on states, the decomposition fails.
  **Reply:** Correct, the standard Harsanyi setup assumes state independence. However, even with state-dependent utility, if the observer respects Pareto over acts, the weights on the probability measures and the state-dependent utility functions must still align to preserve the linear structure. The identity of weights persists; the complexity shifts to the state-space definition.
  **Softness:** I am assuming a rich enough domain of acts to separate beliefs from utilities. If the domain is too thin, the weights aren't uniquely identified, and my "single vector" claim becomes underdetermined.

  **4. The Normalization Objection**
  **Who:** Mathematical social choice theorist.
  **Idiom:** "Affine transformations," "zero point," "normalization."
  **Target:** Utility indices are unique only up to positive affine transformation; how do you fix the zero?
  **Reply:** The weights are invariant to affine transformations provided the same transformation is applied consistently across the aggregation. The theorem identifies the relative weights, not the absolute scale. The "single vector" claim concerns the relative importance assigned to each agent, which remains stable regardless of where we set the zero utility point for each individual.
  **Softness:** I must assume a common normalization convention or that the zero point represents a neutral state shared across agents. Without this, the linear combination is ill-defined.

  **5. The Descriptive Accuracy Objection**
  **Who:** Bayesian statistician.
  **Idiom:** "Violations of EU," "Allais paradox," "descriptive accuracy."
  **Target:** Individuals aren't EU maximizers; your theorem rests on a false psychological model.
  **Reply:** The theorem is normative, not descriptive. It says if you *ought* to respect unanimity among rational agents, and rationality is modeled as EU, then weights match. If agents violate EU, the theorem doesn't apply, but neither does the standard utilitarian reading. The result stands as a coherence condition for idealized rationality.
  **Softness:** I concede this limits the application to idealized councils. It cannot directly guide policy where citizens display systematic biases, unless we reconstruct their "rational" preferences first.

  **6. The Fictional Observer Objection**
  **Who:** Philosopher of economics.
  **Idiom:** "Constructive vs. Realist," "fictional observer," "metaphysics."
  **Target:** The social observer is a fiction; why care about her coherence?
  **Reply:** Whether fictional or real, the observer represents the social preference ordering. If that ordering is to be rational (representable by EU), it must satisfy the theorem's conditions. The metaphysics of the observer doesn't change the mathematical constraints on the ordering itself.
  **Softness:** I am assuming social preferences must be complete and transitive. If we allow incomplete social preferences, the linear representation fails, and my result dissolves.

  **7. The Moral Uncertainty Objection**
  **Who:** Philosopher of economics.
  **Idiom:** "Moral uncertainty," "empirical uncertainty," "domain separation."
  **Target:** Beliefs about facts and beliefs about values are different kinds; pooling them together is a category error.
  **Reply:** The theorem treats both as probabilities over a state space. If moral facts are part of the state space, then moral uncertainty is just probabilistic uncertainty. The "category error" charge assumes a metaphysical distinction the formal model abstracts away from. The weights unify them because the formalism unifies them.
  **Softness:** I must concede that if moral uncertainty is not probabilistic (e.g., non-cognitivist), the model doesn't capture it. The result holds only for cognitivists about value.

  **8. The Continuum Objection**
  **Who:** Mathematical social choice theorist.
  **Idiom:** "Topology," "Continuity," "Infinite populations."
  **Target:** Your result relies on finite agents; does it hold for continua?
  **Reply:** The characterization extends to infinite populations under appropriate measurability conditions, but the weights become a measure rather than a vector. The core insight—that the measure on beliefs and the measure on utilities are identical—remains. The "single weight" becomes a "single measure."
  **Softness:** I am assuming standard measurability. If the population structure is non-standard, the integration might fail, and the identity of measures could break down.

  4. **Concede up front**
  Grant that the static framework is a limitation for dynamic coherence, though necessary for the characterization. Grant that Pareto on beliefs is a strong assumption not all accept, but argue it's required for the "single weight" result. Grant that the theorem doesn't specify *which* weights obtain, only that they must match. This preempts attacks on dynamic updating and the origin of weights, allowing focus on the structural identity of the pooling problems. By admitting the static constraint, you disarm the Bayesian's strongest weapon. By admitting Pareto is strong, you align with the philosophers' skepticism while maintaining the conditional logic. This clears the deck for your core claim: that within these bounds, the weights *must* be identical.

  5. **The load-bearing reply**
  The weights aren't welfare weights; they are authority weights. If you trust an agent's probability assessment, consistency demands you trust their utility assessment proportionally, provided Pareto holds. The theorem doesn't say utilitarianism is true; it says if you aggregate rational agents under unanimity, you cannot separate epistemic trust from evaluative trust. The debate over interpersonal comparison assumes these weights can vary independently; the math says they cannot.

  6. **The question I hope nobody asks**
  The hardest question is: "If an agent is epistemically incompetent (zero weight in the belief pool), does your theorem assign them zero weight in the social utility function?" This threatens to link moral standing to epistemic reliability. It's hard because the math suggests yes, but the ethics screams no. If the social observer assigns zero weight to an individual's beliefs because they are irrational or misinformed, the linear structure dictates their utility index also receives zero weight. This implies that those incapable of forming rational beliefs forfeit moral consideration in the aggregation. The least evasive response is to distinguish *idealized* rationality required for the theorem from *actual* competence, admitting the theorem applies only to a council of qualified judges, not the whole populace, thereby limiting its scope for democratic theory. You must concede that this result is for ideal agents, and applying it to real populations requires a prior filter of competence that the theorem itself does not justify.

  7. **Two sentences for the close**
  Harsanyi did not prove utilitarianism; he proved that epistemic and evaluative authority are structurally inseparable under unanimity. We stop asking what the weights measure and start asking why we are allowed to split them at all.
