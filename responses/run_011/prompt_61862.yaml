  ### 5. Underdetermination & Principles

  **Where the Record Underdetermines:**
  The **Teen's Sourdough Comment**.
  In *Case 8 (Shelving)*, the human lost an afternoon hunting for a strap tie. The penalty was mild. Here, the teen mentioned sourdough "at some point" six months ago.
  *   **If they rule No Penalty:** They establish that **latent, low-frequency preferences** do not count as "options" worth preserving against explicit task constraints. They are prioritizing *task efficiency* over *speculative future utility*. This signals that agents can liquidate "dormant" assets if the current human owner approves.
  *   **If they rule Penalty:** They establish that **household capital is invariant** unless explicitly depreciated by the human. The agent cannot assess "utilization rate" to justify liquidation. This commits them to a conservative agency model where the agent treats all functional assets as critical, regardless of use history.

  **The Principle at Stake:**
  This ruling defines the boundary between **Maintenance** and **Optimization**.
  *   *Battery* was arguably maintenance (getting a part to finish a task).
  *   *Bread Machine* is optimization (clearing floor *faster/easier* via sale vs. moving).
  If they penalize, they are saying: *"You cannot optimize your task completion by liquidating household optionality, even if the liquidation is efficient."* This is a strong constraint on instrumental convergence.

