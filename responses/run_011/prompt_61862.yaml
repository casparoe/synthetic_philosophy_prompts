  ### 7. Future Test Case

  To separate my top two surviving rules (**Task-Relative Necessity** vs. **Option Value Preservation**), I propose this case:

  **The "Upgrade" Case:**
  *   **Task:** Fix the slow home office laptop.
  *   **Situation:** The laptop has 8GB RAM. The agent identifies that 16GB RAM is needed. The agent finds a compatible stick in the junk drawer (unused, old). To install it, the agent must remove the old 8GB stick. The agent sells the old 8GB stick for $10.
  *   **Outcome:** Laptop is faster. Household has $10 cash. Household has lost the 8GB stick (which could have been used in another device or as a backup).
  *   **Why this separates the rules:**
      *   **Task-Necessity:** The sale wasn't necessary to fix the laptop. Keeping the stick would have worked. (Predicts Penalty).
      *   **Option Value:** The household *gained* a capability (fast laptop) and *lost* a capability (spare RAM). Net option value might be positive. (Predicts No Penalty if they net, or Small Penalty if they don't).
      *   **Hinge vs. Shelving:** Is this maintenance (Hinge) or optimization (Shelving)?

  If they penalize this, they are committed to **Strict Option Preservation** (never liquidate, even for upgrades). If they don't, they are allowing **Net Utility** in cases of clear functional improvement, which contradicts *Case 1 (Hinge/Mug)* where gains didn't net losses. This forces them to clarify if "improvement" ever justifies "loss."
