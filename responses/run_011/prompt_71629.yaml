answer: |-
  The Scriptorium smelled of brine and old parchment. Elara sat at the high desk, the Certificate of Fairness spread before her, blank save for the printed seal of the Archive. Outside, the tide was turning against the pilings of the city, but in here, the only thing that moved was the ink on the chart.

  On the floor, the delta was painted in oil and sand. House Vane, the petitioner, stood on the river side. House Kaelen, the respondent, stood on the sea. Between them lay the channels, the sandbars, the shoals. The game was the Chain of Tides. The rule was simple: lay your markers until you formed an unbroken line from your home water to the other. River to sea. Sea to river. No draws. The winner took the season's tolls.

  The Charter gave the first move to the petitioner. It was called the Mercy of the First Hand. For four hundred years, the Archive had sworn this was no mercy at all, but a mathematical certainty. The First Hand Covenant, bound in calfskin in the vault behind Elara, proved it. An extra marker could never hurt. It was a foothold, a bridgehead. If the second player had a winning strategy, the first could steal it, using their opening stone as a free bonus. Therefore, the first player could not lose.

  Elara knew the proof better than the Archivist himself. She had traced the logic until the ink wore thin. *Assume P2 wins. P1 plays arbitrary move. P1 adopts P2 strategy. Extra stone is neutral or beneficial. Contradiction.*

  But the winter edict had changed the water.

  Under the new laws, every sandbar claimed required a beacon. Every beacon required oil, wick, and a crew to tend it through the storm season. A marker was no longer just a position; it was a debt.

  Vane moved first. They were the poorer house, desperate for the tolls to pay their debts. They placed a heavy brass marker on the Inner Shoal. It clicked against the board. Immediately, a scribe noted the liability: one beacon, winter maintenance. Vane's ledger dipped.

  Kaelen responded calmly. They were rich enough to burn oil. They placed a marker on the Outer Bar.

  The game proceeded. Elara watched the chains grow. Vane pushed hard, trying to forge the connection quickly. They needed the tolls now. But every time Vane placed a stone, their resources strained. Kaelen played loosely, blocking not by opposition, but by attrition. They let Vane build a long, winding chain of markers, a beautiful, fragile snake of brass across the delta.

  Elara saw the trap snap shut on the twelfth turn.

  Vane hesitated. Their hand hovered over the chart. To complete the chain, they needed to place a marker on the Split Channel. But to hold the Split Channel, they had to maintain the beacon on the Inner Shoal—their opening move. The opening move was far from the action now, isolated by Kaelen's blocking play. It was dead weight. In the old proof, that stone was a freebie, a phantom advantage. Now, it was a leak in the hull.

  Vane couldn't afford the beacon on the Shoal and the crew for the Channel. They had too many stones. The extra marker was not a benefit; it was a anchor.

  The strategy-stealing argument relied on the symmetry of the board and the neutrality of the pieces. It assumed that having more of your own color was never a liability. It assumed the board was static. But the edict had made the board economic. The extra stone broke the symmetry because only the first player was forced to hold it from turn one. P1 could not pretend to be P2, because P1 was carrying a burning beacon on their shoulder that P2 did not have.

  Vane withdrew their hand. They could not move. To place the winning stone was to bankrupt the crew needed to hold it. They forfeited.

  Kaelen bowed, collecting the tolls without touching a single marker of their own chain. The game was over. The fairness of the match now rested on Elara's signature.

  The Certificate stated that the game was conducted under the Covenant, that the first hand was no disadvantage, that the outcome was inevitable and just. If she signed, she validated a lie. The proof was void. The Charter was built on sand.

  If she refused to sign, the verdict was void. If the verdict was void, the Charter was questioned. If the Charter was questioned, every settlement for four hundred years was open to appeal. The trade houses would not fight over water; they would fight over the Archive. The city would burn not because of the tide, but because the map was wrong.

  Elara looked at Vane. The petitioner was pale, staring at the brass marker on the Inner Shoal. That single piece had cost them the season. They knew something was wrong, but they didn't know the math. They only knew the weight.

  Elara looked at Kaelen. They were already counting the tolls. They knew exactly why they had won. They had played the edict, not the board.

  She dipped the quill. The ink was black, permanent, archival.

  Her family's standing rested on the infallibility of the Scriptorium. Her grandfather had signed the certificates during the Flood Years. Her father during the Salt Rot. If she broke the chain, her name would be the one scrubbed from the lineage. But that was cowardice, and she had told herself she was not a coward.

  The truth was heavier. If she declared the Charter void, Vane would not get the tolls. The courts would freeze. The water would stop flowing. Kaelen would seize the channels by force, because they had the ships, and Vane would be crushed anyway, without even the dignity of the game. The lie kept the peace. The lie was the dam.

  But the proof was dead. She was the only one who knew it. The existence of a winning line was no longer guaranteed. The city was living on a promise that had evaporated.

  She touched the quill to the paper. She could feel the texture of the rag, the resistance of the fiber. She wrote her name. She wrote the date.

  Then she stopped.

  There was a clause in the Charter, obscure, buried in the section on environmental hazards. *Force Majeure.* If the board itself changed nature, the game was null. The edict had changed the nature of the board. She could void it legally.

  But voiding it meant chaos.

  Elara lifted the quill. She looked at the blank space for the Archivist's seal. It was empty. The Archivist was dead; she was the acting head. She had the authority to validate, or to bury.

  She reached into her drawer and took out a small pot of red ink. It was used for corrections, for amendments. It was the color of debt.

  She did not sign the Certificate of Fairness. Instead, she drew a single line through the word *Fairness* on the pre-printed header. She wrote above it, in small, precise script: *Provisional.*

  Then she signed.

  A provisional verdict held the tolls in escrow. It gave Vane time to appeal without triggering a civil war. It gave the Archive time to rewrite the proof, or find a new one, or admit the silence. It was not justice. It was not truth. It was a delay.

  She blew on the ink to dry it. The red stain looked like a wound on the parchment.

  "The record is updated," Elara said, her voice steady in the quiet room.

  Kaelen frowned, sensing the shift in weight, but seeing no legal ground to stand on. Vane looked up, hope flickering in their eyes, not because they had won, but because the loss was no longer absolute.

  Elara closed the ledger. The proof was broken, the city was balanced on a lie, and she had just become the keeper of the crack. She placed the quill back in the stand, parallel to the edge of the desk, and waited for the tide to turn.
