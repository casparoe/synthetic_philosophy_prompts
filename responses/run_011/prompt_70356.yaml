prompt: |-
  ok so my reading group has been chewing on the moral equality of combatants — the view that a soldier fighting for the aggressor and a soldier fighting against him have the same permission to kill each other, and neither is a murderer for doing it. My flatmate defends it every single week with the same picture: a duel. Two men, seconds, a code, a field at dawn. One of them is genuinely in the right about the grievance, one is in the wrong, but once they take the field both have exactly the same right to fire, and it would be absurd to say the wronged man may shoot and the wrongdoer may not, or that the wrongdoer commits murder by hitting back. His point is that the permission comes from the reciprocal structure of the contest — two agents who have both entered a situation in which each is trying to kill the other — and not from who's right about the quarrel. So the jus ad bellum question sits outside the fight entirely, and the fight carries its own symmetric rules, which is also, he says, why the very same code can forbid shooting at surgeons or at people in the town nearby, just as the code duello forbids certain moves. Which is why he thinks the revisionists who compare unjust combatants to armed robbers are just refusing to look at the structure.

  Can you audit the thing for me rather than argue with him? I want the correspondences laid out explicitly — what in the duel plays the role of the declaration of war, the combatant, the code, the seconds, the spectators, the field, the bystander who gets hit by a stray ball — and then the disanalogies, sorted into the ones that actually bite on his conclusion and the ones that are just surface decoration. In particular I want to know what the duel quietly imports that a war doesn't have: mutual voluntary entry, the fact that there are only two agents and no third parties whose rights get engaged at all, symmetric risk, a quarrel that's about honor between individuals rather than about ruling over anybody, and the fact that the loser can walk away or surrender and the contest is over. Does his move — relocating the permission from the cause into the reciprocal structure — survive once you strip those out, or was the structure doing all the work because it was secretly consent plus symmetry plus no bystanders?

  Test case for you to run it against: an eighteen-year-old conscript in the invading army, drafted, told almost nothing, fighting men who are shooting at him right now. Under the duel picture is he a duellist, or does he look more like someone's tool, or a person being used as a shield, or a driver whose brakes have gone? Say which of those pictures handles him best and what each one then implies about whether he may shoot back.

  And then tell me what the duel analogy is actually good for, if anything. My own suspicion, which I can't defend, is that it earns its keep for the in bello rules — discrimination, proportionality, the idea that a code can bind both sides — and does nothing whatsoever for the equality claim, and that people slide from the first to the second. Say whether that's right or whether I'm splitting hairs.

  Finally: if the duel's the wrong picture, what's a better one? All I've managed is a boxing match where each fighter has been told the other is trying to kill his family, which seems worse, and two guys trading shots from opposite ends of a lifeboat, which seems to prove far too much. Tell me whether either of those can be repaired into something that carries the argument, or whether the honest move is to stop reaching for contests and games altogether and describe war as something else entirely.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The Moral Equality of Combatants (MEC) in Just War Theory.
      *   **Flatmate's Argument:** Defends MEC using a *Duel Analogy*. Key claim: Permission to kill comes from the reciprocal structure of the contest, not the justice of the cause (*jus ad bellum* is separate from *jus in bello*).
      *   **Task:** Audit the analogy, don't just argue.
      *   **Specific Requirements:**
          1.  Map correspondences (Duel $\to$ War).
          2.  Identify disanalogies (sort into "bite" vs. "surface").
          3.  Analyze what the duel quietly imports (consent, symmetry, no bystanders, etc.) and if the argument survives without them.
          4.  Test Case: 18-year-old conscript in an invading army. Apply different metaphors (duellist, tool, shield, driver) and determine implications for permission to shoot.
          5.  Evaluate the utility of the duel analogy (good for *in bello*, useless for equality?).
          6.  Propose better analogies or suggest abandoning the "contest" framework entirely.

  2.  **Deconstruct the Flatmate's Duel Analogy:**
      *   *Core Claim:* War is like a duel. Once engaged, rules apply symmetrically regardless of who started it or why.
      *   *Strengths:* Captures the intuition of "fair play" in combat, explains *jus in bello* constraints (no shooting surgeons/seconds), separates the *fight* from the *feud*.
      *   *Weaknesses:* Duels are consensual, individual, isolated from third parties, and usually non-political. War is often non-consensual, collective, involves massive collateral damage, and is deeply political.

  3.  **Step 1: Audit the Correspondences (Mapping):**
      *   *Declaration of War:* The Challenge/Acceptance.
      *   *Combatants:* The Duelists.
      *   *Code (Jus in Bello):* The Code Duello.
      *   *Seconds:* Commanders/Officers (or perhaps the political leaders arranging it?).
      *   *Spectators:* The Public/Allies (passive observers?).
      *   *The Field:* The Theater of War.
      *   *Bystander hit by stray ball:* Collateral Damage/Civilians.

  4.  **Step 2: Disanalogies (Sorting):**
      *   *Surface Decoration:* Pistols vs. Rifles, dawn vs. night, two people vs. many people (scale alone doesn't change morality necessarily).
      *   *Structural/Biting:*
          *   **Consent:** Duelists choose to be there; soldiers (especially conscripts) often do not.
          *   **Third Parties:** Duels isolate harm; war inherently risks civilians/collateral.
          *   **Agency:** Duelists act for themselves; soldiers act as agents of the state.
          *   **Termination:** Duels end clearly; war drags on, surrender is complex.
          *   **Symmetry of Risk:** In a duel, risk is roughly equal. In war, technology/power asymmetry is huge.

  5.  **Step 3: What the Duel Quietly Imports:**
      *   The flatmate's argument relies on *mutual voluntary entry*. If both consent to the risk, they waive rights against being killed.
      *   If you remove consent (conscripts), the "waiver" disappears.
      *   If you remove isolation (civilians), the "private contest" model breaks.
      *   *Conclusion:* The structure *only* works because of the hidden premises of consent and isolation. Without them, the symmetry collapses.

  6.  **Step 4: The Test Case (The Conscript):**
      *   *Scenario:* 18yo, drafted, ignorant, invading, under fire.
      *   *Duelist:* Implies he chose the fight. (False). Implies he has equal standing. (Problematic).
      *   *Tool:* He is used by the state. (More accurate). Implication: Tools aren't moral agents, but he *is* a human.
      *   *Shield:* He is protecting the aggressors behind him. (Strong revisionist view).
      *   *Driver with failed brakes:* Out of control, dangerous but not malicious.
      *   *Best Fit:* **Tool/Weapon.** He lacks the agency of the duelist.
      *   *Implication:* If he's a tool, the *user* (the aggressor state) is liable, not the tool. The defender is shooting at the threat, but the threat's moral status is different. The conscript doesn't have the *same* permission; he is acting under duress/ignorance. He might be excused, but not *justified* in the same way.

  7.  **Step 5: Utility of the Analogy:**
      *   User's suspicion: Good for *in bello*, bad for equality.
      *   *Verdict:* Mostly right. The duel explains *why* there are rules (honor/code) and why they apply to both (to keep the contest from becoming a slaughter). But it fails to explain why the *unjust* killer is morally equal to the *just* killer. In a duel, the "wronged" party might still be morally superior, but the *rules of engagement* are symmetric. In war, the revisionists argue the *right to kill* is not symmetric. The duel smuggles in consent to make them symmetric.
      *   *Slippage:* Yes, people slide from "rules apply to both" to "moral status is equal."

  8.  **Step 6: Better Analogies?**
      *   *Boxing Match:* Similar to duel (consensual sport). Fails on the "kill your family" bit.
      *   *Lifeboat:* Self-defense scenario. Proves too much (implies no rules).
      *   *Alternative:* **Police Action / Law Enforcement.**
          *   Just combatants = Police stopping a violent criminal.
          *   Unjust combatants = The criminal (or accomplices).
          *   *Problem:* War isn't law enforcement (no neutral judge).
      *   *Alternative:* **Quarantine / Containment.**
      *   *Best Alternative:* **Abandon the "Contest" metaphor entirely.**
          *   War is **Collective Self-Defense** or **Dangerous Instrumentality**.
          *   If we view it as self-defense, the aggressor lacks the right to kill.
          *   If we view it as a "state of nature" (Hobbes), then maybe symmetry exists, but it's a tragedy, not a code.
      *   *Recommendation:* Stop reaching for games. Use the **Self-Defense** model (Revisionist) or the **Institutional Role** model (Traditional). The duel is a hybrid that confuses the two.

  9.  **Drafting the Response:**
      *   *Tone:* Analytical, rigorous, respectful of the flatmate's logic but critical of its foundations.
      *   *Structure:* Follow the user's prompts exactly.
      *   *Key Insight:* The duel works *normatively* (how we should behave) but fails *ontologically* (what war actually is).

      *(Self-Correction during drafting)*: Make sure to distinguish between *excuse* and *justification*. The flatmate says the unjust soldier isn't a *murderer* (justification/exemption). Revisionists say he *is* a murderer but might be excused due to ignorance/duress. The duel analogy tries to make him *justified*. I need to highlight this distinction.

      *(Refining the Conscript Test)*: The "Driver with failed brakes" is interesting. It suggests non-culpable threat. But a conscript is a *culpable* threat potentially, just less so. "Tool" is better because it removes agency. Let's stick with "Tool/Weapon" as the primary critique of the Duelist model.

      *(Refining the "Better Picture")*: The user suggested "Boxing with family stakes" and "Lifeboat". I should evaluate those specifically before offering the "No Contest" alternative. The Lifeboat is actually a good analogy for *necessity*, but bad for *rules*. The Boxing match fails on consent. The best alternative is likely the **Police/Riot** analogy or simply **Self-Defense against a Threat**.

      *(Final Polish)*: Ensure the distinction between *Jus ad Bellum* and *Jus in Bello* is clear throughout. The flatmate wants to decouple them; the audit should show where the coupling is inevitable.

  10. **Final Review against constraints:**
      *   Audit, don't argue.
      *   Explicit correspondences.
      *   Disanalogies sorted (bite vs. surface).
      *   Hidden imports identified.
      *   Conscript test case run.
      *   Verdict on user's suspicion.
      *   Alternative analogies evaluated.

      *Ready to write.*
answer: |-
  Here is an audit of your flatmate's duel analogy, structured according to your requirements.

  ### 1. The Correspondences (Mapping the Analogy)

  To see where the logic holds, we must first map the terms of the *Code Duello* onto the *Laws of Armed Conflict*.

  | **The Duel** | **The War** | **Function in the Argument** |
  | :--- | :--- | :--- |
  | **The Challenge/Acceptance** | **Declaration of War / Mobilization** | Establishes the beginning of the contest and mutual notice. |
  | **The Duelists** | **The Combatants** | The licensed agents permitted to use lethal force. |
  | **The Code Duello** | **Jus in Bello (LOAC)** | The symmetric rules governing conduct *during* the fight. |
  | **The Seconds** | **Commanding Officers / Political Leadership** | Arrangers of the fight, responsible for ensuring the code is kept. |
  | **The Field** | **The Theater of War** | The designated zone where normal civil rights are suspended. |
  | **The Spectators** | **The Public / Allied Nations** | Witnesses who validate the honor/outcome but do not intervene. |
  | **The Stray Ball / Bystander** | **Collateral Damage / Civilians** | Accidental victims outside the licensed scope of the contest. |
  | **The Grievance** | **Jus ad Bellum (Cause)** | The reason for the fight, explicitly bracketed out of the combat rules. |

  ### 2. The Disanalogies (Surface vs. Structural)

  Your flatmate relies on the structural symmetry of the duel to prove moral symmetry in war. We need to separate the cosmetic differences from the ones that break the logic.

  **Surface Decoration (Does not bite on the conclusion):**
  *   **Scale:** Two men vs. two armies. Multiplying agents doesn't necessarily change the moral relation between any specific pair of shooters.
  *   **Technology:** Pistols vs. drones. The *means* change, but the flatmate argues the *permission structure* remains.
  *   **Duration:** Minutes vs. years. Time does not inherently alter the reciprocal license to kill.

  **Structural Disanalogies (These bite):**
  *   **Voluntary Entry:** A duelist *chooses* the field. A conscript (or even a volunteer in a total war economy) often has no meaningful exit option. Consent is the bedrock of the duel's morality; it is largely absent in war.
  *   **Isolation of Harm:** A duel is designed to minimize risk to non-participants. War is inherently indiscriminate in its effects (economy, infrastructure, civilians), even if aimed at combatants.
  *   **Agency:** A duelist fights for himself. A soldier fights as an *instrument* of the state. This creates a principal-agent problem that doesn't exist in the duel.
  *   **Termination:** A duel ends when honor is satisfied or one falls. War ends politically, often requiring the total incapacitation of the enemy's capacity to fight, not just their willingness.
  *   **Epistemic Symmetry:** In a duel, both men know the rules and the stakes. In war, soldiers often operate under propaganda, fog of war, or ignorance regarding the *jus ad bellum*.

  ### 3. What the Duel Quietly Imports

  You asked what the duel smuggles in that war lacks. The flatmate's argument—that permission comes from the *structure* rather than the *cause*—only survives if the structure guarantees three things that war does not:

  1.  **Mutual Waiver of Rights:** In a duel, by stepping onto the field, both men waive their right not to be killed. This waiver is what makes the killing permissible rather than murderous. In war, the unjust combatant has not waived his right to life vis-à-vis the just defender, nor has the just combatant waived his right vis-à-vis the aggressor.
  2.  **No Third-Party Rights:** The duel assumes the only rights in play belong to the duelists. War inherently engages the rights of civilians, neutrals, and future generations. The "symmetric rules" of the duel cannot account for the asymmetric liability of bystanders.
  3.  **Symmetric Risk:** The duel assumes a fair chance of survival. Modern war often involves asymmetric risk (e.g., drone operators vs. ground troops). If one side cannot effectively consent to the risk because they cannot reciprocate it, the "contest" model collapses.

  **Verdict:** If you strip out consent, isolation, and symmetry, the structure does not do the work. The structure *is* the consent. Without it, the "permission" evaporates.

  ### 4. The Test Case: The 18-Year-Old Conscript

  **Scenario:** Drafted, ignorant, invading, under fire.

  **Applying the Metaphors:**

  *   **The Duellist:** Implies he chose the fight and accepts the code.
      *   *Fit:* Poor. He did not choose the field.
      *   *Implication:* If he is a duellist, he has equal permission to shoot. (This is your flatmate's view, but it requires fiction).
  *   **The Tool:** He is a weapon wielded by the aggressor state.
      *   *Fit:* High. He lacks agency regarding the *ad bellum* decision.
      *   *Implication:* Tools are not moral agents. You don't blame the knife; you blame the hand. However, he is a *human* tool. He may be *excused* for shooting (due to duress/ignorance) but he is not *justified*. He lacks the permission the defender has.
  *   **The Shield:** He is placed in front of the unjust cause to absorb fire.
      *   *Fit:* High.
      *   *Implication:* Shooting him is permissible for the defender (as he is a threat), but his own shooting is not morally symmetrical. He is a "non-liable threat" perhaps, but not an equal combatant.
  *   **The Driver with Failed Brakes:** A non-culpable threat.
      *   *Fit:* Moderate.
      *   *Implication:* You may stop the car (kill him) to save yourself, but the driver isn't "allowed" to run you over to save himself.

  **Best Fit:** **The Tool.**
  The conscript is an instrument of a larger agency (the state). The duel analogy fails here because a tool cannot enter a reciprocal contract.
  **Implication for Permission:** The defender has the right to shoot (self-defense against a threat). The conscript does *not* have the same right to shoot; he is acting on a false premise (that the invasion is legitimate). He is likely **excused** from murder charges due to duress and ignorance, but he is not **justified**. The duel analogy conflates *excuse* with *justification*.

  ### 5. Is Your Suspicion Right?

  **Your Suspicion:** The duel analogy earns its keep for *in bello* rules (discrimination, proportionality) but does nothing for the *equality* claim, and people slide from the first to the second.

  **Audit:** **You are correct.**

  *   **Why it works for *In Bello*:** The duel is excellent at explaining why we need *constraints* on violence even when violence is happening. It captures the idea of a "practice" or "institution" that has internal goods (honor, professionalism, limiting slaughter). It explains why we don't shoot surgeons: because they aren't part of the contest.
  *   **Why it fails for Equality:** The duel only generates moral equality because it presupposes **procedural fairness** (both agreed to the rules). In war, *jus ad bellum* is not procedural; it is substantive. One side is objectively trying to subjugate the other.
  *   **The Slide:** Your flatmate is sliding from "Both are bound by the same rules" (true) to "Both have the same right to kill" (false). The duel hides this slide by making the "right to kill" contingent on entering the field. In war, the right to kill is contingent on the justice of the cause *plus* the adherence to rules.

  The duel analogy is a **normative model** (how soldiers should behave) masquerading as an **ontological model** (what war actually is).

  ### 6. Better Pictures (Or None at All)

  You asked if the Boxing Match or the Lifeboat can be repaired, or if we should abandon contests entirely.

  **The Boxing Match (with family stakes):**
  *   *Problem:* Boxing is consensual sport. Adding "kill his family" breaks the sport model. If I box you to save my family, I am not playing a game; I am acting in necessity.
  *   *Repair:* It cannot be repaired. As soon as the stakes become existential/moral, it ceases to be a sport and becomes self-defense.

  **The Lifeboat (Two men, one survivor):**
  *   *Problem:* This is a "state of nature" scenario. It proves too much because it suggests *no* rules apply (anything goes to survive).
  *   *Repair:* It works for **Necessity**, but not for **Permission**. It explains why the defender *must* shoot, but it doesn't give the aggressor permission to shoot back.

  **The Honest Move: Abandon the Contest Framework.**
  The duel, boxing, and sports analogies all share a fatal flaw: they view war as a **game** with internal rules. War is not a game; it is **instrumental violence**.

  **A Better Picture: The Police Riot / Containment.**
  *   **Just Combatants:** Police officers containing a violent insurrection. They have a right to use force to stop the threat.
  *   **Unjust Combatants:** The insurgents. Some are leaders (liable), some are conscripts (excusable but not justified).
  *   **Why it's better:** It acknowledges asymmetry. The police have a different moral status than the rioters.
  *   **Why it fails:** There is no neutral judge in war to declare who is the "police."

  **The Best Picture: Self-Defense against a Threat.**
  Stop looking for a symmetric picture. War is fundamentally asymmetric.
  *   **The Image:** A homeowner facing an intruder.
  *   **The Intruder (Unjust Combatant):** May be scared, may be following orders, may be ignorant. He is a **threat**. He can be stopped.
  *   **The Homeowner (Just Combatant):** Has the right to defend.
  *   **The Symmetry:** There is none. The intruder does not have the right to kill the homeowner to escape arrest, even if the homeowner shoots first.
  *   **The Conscript:** He is an intruder who was told the house was his. He is still an intruder. He can be stopped. He is not a murderer if he is truly ignorant, but he is not *right*.

  **Conclusion for your Group:**
  Tell your flatmate the duel is a beautiful metaphor for **Chivalry**, but a terrible metaphor for **Liability**. It explains why soldiers *should* treat each other humanely (the Code), but it cannot explain why an aggressor has the *right* to kill a defender. The structure of the contest only creates equality if the entry was voluntary. Since war is rarely voluntary for all participants, the duel analogy collapses under the weight of the conscript.

  You are not splitting hairs. You have identified that the duel analogy solves the problem of *order* (how to fight without barbarism) by falsely solving the problem of *justice* (who is right to fight). Keep them separate.
