  If you repair the argument downstream of (1), Carnap has to concede that his commitment to liberalism isn't a logical truth derived from science, but a **volitional precondition** for doing science socially. He sacrifices the claim that science *proves* democracy; instead, he argues that democracy is the only regime compatible with the *scientific attitude* required for planning to work. This costs him the "view from nowhere"—he must admit the planner is a participant committed to free inquiry—but it saves him from the charge that his humanism is arbitrary. It becomes a hypothetical imperative: *if* you want rational planning, you *must* want liberal institutions.

