  | :--- | :--- | :--- | :--- | :--- |
  | (1) | Value judgements aren't truth-apt. | Core Vienna Circle doctrine; protects science from metaphysics. | Acceptable and load-bearing | Guts the anti-metaphysics programme you want to keep. |
  | (2) | Philosophy offers method, not doctrine. | Consistent with *Logical Syntax*; avoids dogmatism. | Acceptable and load-bearing | Turns philosophy into a set of substantive claims. |
  | (3) | Rationality settles means, not ends. | Standard Humean instrumentalism; fits expressivism. | Acceptable and load-bearing | Reintroduces metaphysical ethics or objective values. |
  | (4) | Framework choice is pragmatic. | The Principle of Tolerance; allows pluralism. | Acceptable and load-bearing | Loses tolerance, becomes logical absolutism. |
  | (5) | A planned society is a choice of social framework. | Carnap's explicit analogy in *Intellectual Autobiography*. | True but irrelevant | Severs the link between logic and politics entirely. |
  | (6) | Coherent/efficient frameworks are rationally equivalent. | Follows superficially from Tolerance; seems neutral. | **Invalid Inference** | Carnap must admit some frameworks are irrational (methodologically). |
  | (7) | Carnap's humanism is just attitude + methodology. | Follows from (1) and (6); seems to reduce politics to taste. | True but irrelevant | No cost if (6) is rejected; humanism gains methodological standing. |
