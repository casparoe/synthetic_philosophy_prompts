answer: |-
  There isn't a single standard term that captures the *social epistemology* of what you're describing, though pieces of it exist in finance and game theory. You have correctly identified a gap between how prediction markets *should* work (information aggregation) and how they *do* work when capital is heterogeneous and beliefs are sticky.

  The closest established concepts are **Miller's Hypothesis (1977)** and the **War of Attrition**, but neither fits perfectly.

  *   **Miller's Hypothesis:** Argues that when investors have heterogeneous beliefs and short-sale constraints, prices reflect the views of the optimists because pessimists sit out. In your case, the pessimists *don't* sit out; they fight until they are effectively constrained by bankruptcy.
  *   **War of Attrition:** A game theory model where two sides incur costs over time, and the winner is whoever endures longest. Your market is a **Financial War of Attrition**, but standard theory doesn't treat the resulting price as a "consensus signal."
  *   **Limits to Arbitrage:** As you noted, this explains why mispricing *persists*, not how the market *converges* on a specific wrong number via capital exhaustion.

  Since you invited it, here is a coined term that captures the mechanism and the epistemic error, along with its boundary conditions.

  ### The Concept: **Attritional Consensus**

  **Definition:** A market state where price convergence is achieved not through the alignment of participant beliefs (Bayesian updating), but through the exhaustion of the counterparty's liquidity. The resulting price reflects the **relative solvency** of the disagreeing parties, but is interpreted by observers as **relative accuracy**.

  **The Mechanism:**
  1.  **Sticky Priors:** Participants respect each other's intelligence but do not update their internal probability estimates based on the other's position (violating Aumann).
  2.  **Capital Asymmetry:** One side has a deeper bankroll (or higher risk tolerance) than the other.
  3.  **Grinding:** Both sides continue to take the opposite side of the bet as the price moves against them.
  4.  **Exhaustion:** The side with less capital hits a position limit or runs out of points.
  5.  **Signal Contamination:** The market stops moving. Observers interpret the stop as "price discovery," when it is actually "capital capitulation."

  ### The Edges: What Counts and What Doesn't

  To distinguish **Attritional Consensus** from similar phenomena, apply these tests:

  **1. vs. Herding (Informational Cascades)**
  *   **Herding:** Person B sees Person A bet, assumes Person A knows something, and *updates their own belief* to match.
  *   **Attritional Consensus:** Person B sees Person A bet, *maintains their original belief*, but runs out of money trying to prove Person A wrong.
  *   *Edge:* If the loser changes their mind, it's herding/updating. If the loser says "I'm broke, but I'm still right," it's attritional consensus.

  **2. vs. Whale Manipulation**
  *   **Manipulation:** The deep-pocket actor *knows* they are wrong (or indifferent) and bets aggressively specifically to move the price for external gain.
  *   **Attritional Consensus:** The deep-pocket actor genuinely believes their number is correct. The price distortion is a side effect of genuine disagreement, not an intentional strategy.
  *   *Edge:* Intent. If the winner would be happy for the price to settle at their number without spending the points, it's manipulation. If they are spending points because they genuinely think the probability is different, it's attrition.

  **3. vs. Bookie/Market Maker Spread**
  *   **Bookie:** A passive entity posts odds. If no one bets, the price stays.
  *   **Attritional Consensus:** Requires active, two-way friction. The price moves *because* of the betting, then stops because the betting *stops* due to insolvency.
  *   *Edge:* Passive vs. Active. A bookie setting odds nobody takes is just illiquidity. Two people grinding until one busts is attrition.

  **4. vs. Boredom/Settlement**
  *   **Boredom:** Parties stop betting because the marginal utility of winning points is lower than the effort of arguing.
  *   **Attritional Consensus:** Parties stop betting because they *cannot* mathematically place the next bet (hard constraint).
  *   *Edge:* "I don't care enough" vs. "I don't have enough."

  ### The Epistemic Hazard

  The danger of **Attritional Consensus** is **Solvency-Signal Confusion**.

  In a healthy prediction market, Price = Aggregated Information.
  In an attritional consensus, Price = Aggregated Endurance.

  Because your coworkers treat the final price (65%) as information, they are implicitly trusting the bankroll of the winner more than the research of the loser. If the person with the most points is merely the person who cares least about losing them (or got paid last week), the market is pricing **risk appetite**, not **reality**.

  ### Summary
  You are observing a **Financial War of Attrition** resulting in **Attritional Consensus**. The market isn't finding the truth; it's finding the breaking point of the poorer (or more risk-averse) participant. The "unanimity" is a liquidity artifact, not an informational one.
