answer: |-
  Here is the read on Marlene, based on the six votes you provided.

  ### The Verdict
  **She votes NO.**
  **Confidence:** High (85%+).

  ### The Closest Match
  **Case 5 (2024, Gravel/Wellfield).**
  This is the engine driving her decision. In Case 5, she rejected a bond and expert assurance because the risk (aquifer) was permanent and the people bearing the risk ("the ones drinking it") weren't the ones taking the profit or making the decision.

  In the mosquito case, you have the exact same geometry:
  1.  **Permanent/Irreversible Risk:** The rep admitted the "reversal" is only on paper. Once released, they are out. This matches the aquifer ("a bond doesn't give you back an aquifer").
  2.  **Mismatched Accountability:** The downwind town gets the risk (ecological/health unknown) but "gets no vote." This matches Case 5 ("if they're wrong they're not the ones drinking it").

  ### The Rules (Plain Language)
  You are right that more than one rule fits. Here are the three that are still alive, ranked by how hard they hit in this specific scenario.

  **1. The "Undo Button" Rule**
  *   **What it says:** If the action cannot be physically reversed or stopped quickly, she votes No. Financial bonds or contracts do not count as "undoing" damage.
  *   **Where it comes from:** Case 4 (Yes, because permit is revocable in a week) vs. Case 5 (No, because aquifer damage is permanent).
  *   **Prediction for Mosquitoes:** **NO.** The "reversal version exists only on paper" is a disqualifier. She likes the "yank this whenever we want" clause from Case 4. This proposal lacks it.

  **2. The "Risk-Bearer Veto" Rule**
  *   **What it says:** The people who absorb the risk must have a say in the decision. If Town A takes the risk and Town B gets the vote, she votes No. If Town A takes the risk and Town B gets the benefit, she still votes No if Town B can't opt out.
  *   **Where it comes from:** Case 5 ("They're not the ones drinking it") and Case 6 ("You can't decide whether to drink the water").
  *   **Prediction for Mosquitoes:** **NO.** The marsh straddles the line. The downwind town gets the ecological risk without the agenda vote. This triggers her Case 5 instinct immediately.

  **3. The "System Failure" Exception**
  *   **What it says:** She will accept irreversible or involuntary risk *only* if the alternative is an immediate collapse of essential services (power, water, safety).
  *   **Where it comes from:** Case 2 (Generator = Yes). The alternative was six days without power/water. That is a system failure.
  *   **Prediction for Mosquitoes:** **NO.** West Nile is serious (one death), but it does not shut down the town's water or power. It doesn't meet the "Ice Storm" threshold of Case 2. It looks more like Case 6 (Fluoride = health benefit, but not essential infrastructure).

  ### The Dead Rules
  You asked for the rules that look like they fit but are already killed by your notes. Do not waste time arguing these points; she has already rejected them.

  *   **"Follow the Experts/Consensus."**
      *   *Why it's dead:* Case 5 (Hydrogeologist said aquifer was fine; she voted No) and Case 6 (Every dentist was for it; she voted No). She does not defer to credentials if the principle is wrong.
  *   **"Financial Mitigation Fixes Risk."**
      *   *Why it's dead:* Case 1 (She voted Yes despite a cheaper alternative existing) and Case 5 (She voted No despite a bond being offered). Money is secondary to safety/consent.
  *   **"Proof of Harm is Required to Vote No."**
      *   *Why it's dead:* Case 5 and 6 again. In Case 6, she admitted harm stories are "thin." In Case 5, the company's own expert said it was fine. She votes on *potential consequence*, not *proven probability*.

  ### The Town-Line Issue
  You noted nothing in your six cases resembles the cross-jurisdictional voting problem. You are half-right. Case 5 is the template.

  In Case 5, the gravel company wanted to blast near *the* wellfield. Presumably, that wellfield serves your town. Her objection was "they're not the ones drinking it." She was protecting *your* town from an outside company.

  In the mosquito case, if she votes Yes, she is committing your town to **imposing a biological risk on a neighbor that cannot vote to stop it.**
  *   **The Commitment:** She would be establishing a precedent that your town can externalize risk to a neighbor without their consent.
  *   **Why it matters:** This contradicts Case 5. In Case 5, she protected the locals from the outsiders. In the mosquito case, voting Yes makes your town the "outsider" to the downwind town. She generally hates being the bully (Case 3, "we don't need elms that bad" implies she won't destroy nature for convenience). Voting Yes makes her the bully.

  ### The Splitter (How to test this cheaply)
  You want to know if the "System Failure" (Case 2) overrides the "Risk-Bearer Veto" (Case 5). You need to force her to rank them.

  Do not try to get a new case on the agenda; that takes too long. Float this hypothetical during the public comment period of the mosquito hearing, or at a meeting before it:

  **The Question:**
  *"Marlene, in 2021 you voted for the generator because having no water was a bigger risk than a spill. In 2024 you voted against the gravel company because the neighbors didn't drink the water but took the risk. If the Health Department told us West Nile cases would triple next year without this mosquito plan, but the downwind town still refuses to put it on their agenda: Does the emergency override their veto, or does their veto kill the emergency plan?"*

  **How to read her answer:**
  *   **If she says "Their veto kills it":** She is locked into Case 5. She will vote **No**. (This is the likely outcome).
  *   **If she says "The emergency overrides it":** She is prioritizing Case 2. She might vote **Yes**, *but* only if she can add a "reversal" clause.
  *   **If she hedges:** She doesn't have a rule for this yet. Your notes on the "reversal on paper" issue become the deciding factor.

  **Summary:** She is a "Precautionary Principle" voter, but specifically regarding **irreversibility** and **consent**. The mosquito proposal fails both. Unless you can find a way to make the release physically reversible (a kill-switch she trusts) or get the downwind town to vote Yes, she will vote No.
