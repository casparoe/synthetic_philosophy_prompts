answer: |-
  1. **The episode**
  In 2006, Owen et al. (*Science*) scanned a 23-year-old woman diagnosed as vegetative (unresponsive wakefulness syndrome) following a traffic accident. Behaviorally unresponsive, she was instructed via fMRI to "imagine playing tennis" or "imagine walking through your house." Healthy controls show distinct activation patterns: Supplementary Motor Area (SMA) for tennis; Parahippocampal Gyrus and Posterior Parietal Cortex for house. The patient showed activation statistically indistinguishable from controls. A 2010 follow-up (Monti et al.) reported a male patient using these tasks (tennis=yes, house=no) to answer biographical questions correctly. *Reconstruction note:* Exact prevalence of this capacity across all vegetative patients is uncertain; estimates vary widely (often cited around 15–20% of behaviorally vegetative cases), but sample sizes remain small and replication rates across clinics are not fully settled.

  2. **The machinery**
  Block distinguishes A-consciousness (information available for report, reasoning, and control) from P-consciousness (phenomenal feel). Dissociations run two ways: A without P (philosophical zombie) or P without A (phenomenal overflow). Global Workspace Theory (GWT, e.g., Dehaene) identifies consciousness with "global ignition": widespread fronto-parietal availability. GWT typically conflates A and P via access. Lamme's Local Recurrent Processing theory argues P-consciousness arises from local recurrent loops (e.g., visual cortex), while A-consciousness requires global spread. This allows P without A. Higher-Order Theories (HOT) argue P-consciousness requires a higher-order representation (access) of the state. No access, no phenomenology. *Contested:* There is no consensus on whether P can exist without A; Block and Lamme argue yes, GWT and HOT proponents generally argue no. The definition of "access" itself is split between covert availability and overt report.

  3. **The mapping**
  GWT predicts ignition only if the subject is conscious. If the BOLD pattern matches controls, ignition occurred. Prediction: She is Access-conscious (and thus Phenomenally Conscious). Embarrassment: If ignition occurred but she lacks phenomenology (A without P), or if ignition is proven absent despite command-following. The data suggests ignition happened (widespread activation). GWT must claim she is conscious despite no motor report.
  Lamme predicts P-consciousness requires local recurrence, A-consciousness requires global spread. The scan shows parietal involvement (global). Prediction: She has A and P. Embarrassment: If the activation is purely feedforward (no recurrence) yet she follows commands, or if she has P without the observed global spread.
  HOT requires a higher-order thought. Command following implies access. Prediction: She is conscious. Embarrassment: If she was merely primed (no HOT).
  All three theories must accommodate "covert" access. GWT and HOT converge on consciousness here; Lamme allows phenomenality even if access is disputed. The case challenges the necessity of *overt* report for access. The embarrassment condition for GWT is if this activation is shown to be non-global (local only), yet she answers questions, implying access without ignition. Conversely, if ignition exists but feels like nothing, GWT fails to capture P.

  4. **The fork**
  Did global ignition occur? Horn 1: Yes. BOLD matches controls. She is Access-conscious. Motor output is disconnected. Cost: GWT must admit behavioral report is not necessary for Access. "Access" becomes covert. Horn 2: No. Activation was local/automatic. She is unconscious. Cost: Explaining the specific, voluntary-switching nature of the 2010 follow-up. Automatic processes don't answer yes/no questions reliably.
  GWT Choice: Must take Horn 1. Ignition happened. Price: Redefining "Access" to exclude motor report. Acknowledging "Cognitive Motor Dissociation." This saves GWT but weakens the link between consciousness and behavioral verification. It forces GWT to rely on neural signatures rather than functional output for diagnosis. This is expensive: it makes consciousness harder to verify empirically. If ignition can exist without report, the operational definition of access consciousness shifts from "what she can do" to "what her brain lights up," risking circularity if ignition is defined by conscious controls.

  5. **What the case can't settle**
  Inference Gap: BOLD is hemodynamic and slow; ignition is millisecond-scale. We infer ignition from spatial pattern, not temporal dynamics. Skeptics cite semantic priming (hearing "tennis" triggers SMA without volition) or learned motor preparation. False positives are a risk: many patients scanned, few succeed (base rate problem). Does activation = Phenomenology? No. fMRI measures neural correlates, not experience. We assume controls are conscious, but that's an assumption. The P vs A distinction is metaphysical; imaging is physical. We cannot settle if she *felt* the tennis or just processed it. *Uncertainty:* We cannot know the false-positive rate across all clinics scanning VS patients. We cannot know if the BOLD signal truly reflects global ignition or just local demand. The data underdetermines the phenomenology.

  6. **Verdict**
  The episode strains GWT. It confirms neural correlates of command-following exist without behavior, supporting "Covert Consciousness." It forces GWT to decouple ignition from overt report, admitting access can be hidden. However, it does not confirm P-consciousness specifically. It bypasses the hard problem: neural activity is not experience. It shows access (covert) can exist without motor report, but leaves P-consciousness opaque. The case supports the utility of fMRI for diagnosis but doesn't resolve the philosophical dissociation between access and phenomenology. It remains contested whether this is A-without-P or full consciousness.
