  *(Another thought)*: The colleague's point about the "conscript burglar" is actually a strong point for the colleague. I should acknowledge that. The "neighbors" point is the weak link. In a house, shooting at a burglar risks the neighbor. In war, shooting at the invader *guarantees* death for your own "family" (civilians) via retaliation or collateral damage. The analogy hides the cost of defense.

