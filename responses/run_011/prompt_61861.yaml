answer: |-
  This is a classic philosophical move: using a high-intensity, intuitive scenario (the home invasion) to bypass complex systemic reasoning (war). Your colleague's analogy is rhetorically powerful because it triggers a visceral protective instinct. However, as you suspected, it relies on an "abstraction leak"—it hides critical variables that change when you scale from an individual to a state.

  Here is an audit of the comparison, structured to help you identify where the logic holds and where it breaks.

  ### 1. The Mapping (The API Specification)

  To audit the analogy, we must first define the interface. Here is how your colleague's scenario maps to the reality of war:

  | **Home Invasion Scenario** | **National Defense Scenario** | **Function** |
  | :--- | :--- | :--- |
  | **The House** | The Nation / Territory | The boundary being violated. |
  | **The Homeowner/Parent** | The State / Government | The entity authorized to use force. |
  | **The Family** | The Civilian Population | The entities being protected. |
  | **The Burglar** | The Invading Army | The source of the threat. |
  | **The Weapon (Bat/Gun)** | The Military / War Machine | The means of resistance. |
  | **Standing Aside** | Pacifism / Surrender | The refusal to use lethal force. |
  | **Fighting Back** | Military Resistance | The use of lethal force. |

  **The Colleague's Conclusion:** Since *Fighting Back* is morally obligatory in the left column, it must be morally obligatory in the right column. Therefore, *Standing Aside* (Pacifism) is a moral failure ("failure of nerve").

  ### 2. Stress Testing the Additions

  Your colleague claimed their analogy survives two specific objections. Let's test that claim.

  **Addition A: The Burglar is a Conscript**
  *   *Objection:* The burglar isn't evil; he's forced to be there, just like a soldier.
  *   *Colleague's Claim:* You still defend your family regardless of the burglar's motives.
  *   *Audit:* **The analogy holds here.** In ethics, this is the distinction between *jus ad bellum* (justice of going to war) and immediate self-defense. If a sleepwalking person or a conscript attacks your child, you are generally permitted to stop them, even if they aren't morally culpable. This addition does not save pacifism.

  **Addition B: Resistance Harms Neighbors**
  *   *Objection:* Shooting at the burglar might kill innocents in the next house (collateral damage).
  *   *Colleague's Claim:* You still fight because the threat to your family is *certain*, while harm to neighbors is *probabilistic*.
  *   *Audit:* **The analogy strains here.** In a home invasion, the harm to the neighbor is a side effect of your defense. In war, the harm to "neighbors" (civilians on both sides) is often a *direct consequence* of the scale of defense required.
      *   *The Leak:* In the house, the "family" is safe *if* you win. In war, the "family" (citizens) often suffer *because* you fight (bombing, siege, retaliation). The analogy assumes defense *protects* the population, whereas in reality, defense often *endangers* the population to save the *state*.

  ### 3. Critical Disanalogies (The Bugs in the Code)

  This is where your suspicion about "institutions vs. persons" is correct. There are three structural differences that break the "failure of nerve" conclusion.

  #### A. The Agency and Risk Distribution Problem
  *   **House:** The homeowner decides to fight and **personally absorbs the risk**. If the burglar has a gun, the homeowner is the one likely to die.
  *   **State:** The government decides to fight, but **distributes the risk to others**. Politicians declare war; soldiers and civilians die.
  *   **Why it matters:** Pacifism is often not about "I will not protect myself," but "I will not authorize the killing of others to protect abstract borders."
  *   **Verdict:** The home analogy is about *self-sacrifice*. War is often about *other-sacrifice*. Calling pacifism a "failure of nerve" implies cowardice. But if the objection is "I will not send children to die for a political boundary," that is a moral objection to *authority*, not a psychological failure of *courage*.

  #### B. The Proportionality and Efficacy Problem
  *   **House:** A bat or a gunshot is usually sufficient to stop a burglar. The violence is **surgical and effective**.
  *   **State:** Stopping an army requires industrial-scale violence (bombing, artillery). This violence is **indiscriminate and often ineffective** at stopping the specific harm (e.g., the invader might occupy the land anyway, but now the cities are rubble).
  *   **Why it matters:** The analogy assumes violence *works* to stop harm. A pacifist argues that systemic violence often *multiplies* harm. If resisting the burglar burns down the whole block (including your house), standing aside might be the rational choice to minimize total suffering.
  *   **Verdict:** The analogy assumes a high probability of success. War has a high probability of catastrophic failure.

  #### C. The "Monopoly on Violence" Problem
  *   **House:** There is no police force coming. You are the last line of defense.
  *   **State:** The state *is* the police. It created the military. It has diplomatic options, sanctions, and intelligence capabilities that a homeowner does not.
  *   **Why it matters:** A homeowner has no alternative to violence in that moment. A state has many alternatives (diplomacy, economic pressure) that it may have neglected. Pacifism often critiques the *failure of imagination* in statecraft, not the willingness to die.
  *   **Verdict:** The homeowner is in a "state of nature" (no higher authority). The state is in a "political order" (many higher authorities/options). Equating them ignores the state's responsibility to seek non-violent solutions first.

  ### 4. Does the Conclusion Survive?

  **Conclusion:** "Pacifism is not a moral achievement but a failure of nerve."

  **Audit Result:** **False.**

  The conclusion does not survive because the analogy conflates **courage** with **calculation**.
  *   In the house, standing aside is likely a failure of nerve (fear) because the cost of resistance is low and the benefit is high.
  *   In war, standing aside (pacifism) is often a utilitarian calculation that the cost of resistance (mass death, societal collapse) outweighs the benefit (preserving a border or regime).

  Your colleague's analogy works only if you assume that war is as clean, effective, and personally risky for the decision-maker as a home invasion. Once you admit that the decision-maker (State) does not bleed, and the "family" (Citizens) might die *because* of the defense, the "failure of nerve" label collapses. It becomes a debate about **math**, not **mettle**.

  ### 5. Better Ways to Argue This

  If you want to move the conversation forward, you have three options.

  **Option A: Fix the Analogy (The "Captain of the Ship" Scenario)**
  The home analogy is too personal. A better analogy for a State is a Ship Captain.
  *   *Scenario:* A pirate ship approaches. The Captain can fight, but doing so requires ordering the engine room staff (who are trapped below deck) to stay at their posts where they will likely burn to death to keep the guns running.
  *   *Argument:* Is the Captain a coward if he surrenders to save the engine room staff? Or is he morally obligated to burn them to save the cargo?
  *   *Why it works:* It captures the **distributed risk**. The decision-maker is not the one paying the price. This reframes pacifism not as cowardice, but as a refusal to spend other people's lives.

  **Option B: Attack the Efficacy (The "Firebreak" Argument)**
  Argue that the analogy assumes violence stops the fire.
  *   *Argument:* "In the house, shooting the burglar stops the threat. In war, shooting at the army often invites a siege that starves the family. If I believe resistance will get my family killed anyway, but with more suffering, is it 'nerve' to fight, or is it 'recklessness'?"
  *   *Why it works:* It shifts the debate from *morality* to *strategy*. Pacifism is often a prediction that violence will fail, not a refusal to protect.

  **Option C: Drop the Analogy (The "Just War" Framework)**
  Analogies are for intuition; principles are for truth. Suggest dropping the burglar and using the **Principle of Non-Combatant Immunity**.
  *   *Argument:* "Modern war cannot be fought without killing civilians. If the moral rule is 'do not kill innocents,' and war *necessarily* kills innocents, then pacifism is the only consistent moral position. The burglar scenario works because you can aim at the burglar. You cannot aim a bombing campaign only at soldiers."
  *   *Why it works:* It forces your colleague to defend *how* wars are fought, not just *why*.

  ### Summary for Your Colleague
  You can tell him:
  > "The burglar analogy works for **self-defense**, but war is **institutional defense**. In your scenario, the person deciding to fight is the same person risking death. In war, the people deciding to fight (leaders) are not the people risking death (soldiers/civilians). Pacifism isn't about refusing to protect your family; it's about refusing to protect the state at the cost of the family. If you change the analogy to a Captain ordering his crew to burn so he can save the ship, you'll see that 'standing aside' might be the braver moral choice."

  This concedes his point on personal self-defense (which most pacifists accept anyway) while isolating his error on institutional violence.
