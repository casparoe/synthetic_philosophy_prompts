prompt: |-
  I'm the elected staff rep on the joint technology committee at a food-distribution warehouse local, about 900 members. Management's automated picking rollout comes to a vote next month and their offer is: nobody currently on the payroll loses their job, the shift drops from 9 hours to 7.5 at the same pay, and the local gets a one-off productivity dividend split across the membership. The catch is clause 4 — for six years we cant contest any comparable deployment except through a joint panel where the company holds the tie-break.

  The committee is split three ways. Take it: the hours and the money are real, and if we refuse they install it anyway and cut the agency crew regardless. Refuse: clause 4 turns us from something that bargains over how the work is done into a beneficiary of decisions we've agreed in advance to lose, and a shorter shift probably just means a harder pace, more picks an hour, so we'd be buying those hours back with our bodies. And there's a distribution problem: the dividend and the job protection go to whoever's on the books today, while the cost lands on the temps who won't be renewed and the people we'd otherwise have hired next year — none of whom get a vote here.

  Draft the memo I'll circulate before the meeting: accept, reject, or accept with specific counter-proposals, with reasons the other side can actually answer. Treat the 'they'll do it anyway' line as seriously as it deserves, and don't let the memo be only about the numbers — I want it to say what kind of organisation we'd be signing ourselves into if we put our name to clause 4. Short enough to read aloud in ten minutes, and close with a line on how confident you are in the recommendation and which part of it you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Elected Staff Rep on a Joint Technology Committee (JTC) at a food-distribution warehouse local (900 members).
      *   **Context:** Management proposing automated picking rollout. Vote next month.
      *   **Management Offer:** No layoffs for current payroll, 9hr shift $\rightarrow$ 7.5hr shift (same pay), one-off productivity dividend.
      *   **The Catch (Clause 4):** 6-year moratorium on contesting comparable deployments, except through a joint panel where company has tie-break.
      *   **Committee Split:**
          1.  *Accept:* Hours/money are real. Refusal = installation anyway + agency cuts.
          2.  *Reject:* Clause 4 neuters bargaining power. Shorter shift = harder pace (intensity).
          3.  *Distribution/Ethics:* Benefits go to current members, costs hit temps/future hires (who can't vote).
      *   **Task:** Draft a memo to circulate before the meeting.
      *   **Options:** Accept, Reject, or Accept with Counter-proposals.
      *   **Tone/Constraints:**
          *   Treat "they'll do it anyway" seriously (don't be naive).
          *   Don't just focus on numbers; address the *kind of organization* Clause 4 creates.
          *   Length: Short enough to read aloud in 10 minutes (approx. 1,000 - 1,300 words spoken at a moderate pace).
          *   Closing: Confidence level + area of least certainty.
          *   Audience: Fellow committee members (need reasons they can actually answer/debate).

  2.  **Determine the Recommendation:**
      *   *Pure Accept:* Ignores the long-term strategic loss of Clause 4 and the intensification of work.
      *   *Pure Reject:* Risks the "they'll do it anyway" scenario, losing the immediate gains (shorter shift, dividend) and potentially burning bridges.
      *   *Accept with Counter-proposals:* This is the most strategic union position. It acknowledges the reality of automation while fighting for leverage and fairness. It addresses Clause 4 specifically.
      *   *Decision:* Recommend **Accept with Specific Counter-proposals**. This shows pragmatism without surrender.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the weight of the decision.
      *   **The Reality Check (Addressing "They'll do it anyway"):** Validate the fear. Management has the capital. If we say no, the machines come, and the temps get the axe without us getting anything. We need to acknowledge this power dynamic.
      *   **The Gains (The "Yes" part):** Acknowledge the 7.5hr shift and dividend. These are tangible wins for current members.
      *   **The Risks (The "No" part):**
          *   *Clause 4:* This is the core issue. It's a "gag order" on future bargaining. It changes the union from a partner to a bystander.
          *   *Work Intensity:* 7.5 hours at the same pay for more output means higher picks-per-hour. Health and safety risk.
          *   *Two-Tier Workforce:* Current members protected, temps/future hires sacrificed. This erodes solidarity.
      *   **The Counter-Proposals (The Strategy):**
          *   *Modify Clause 4:* Remove the company tie-break. Make it true arbitration or require mutual consent.
          *   *Pace & Safety:* Tie the technology rollout to ergonomic assessments and pace limits, not just time.
          *   *Temp Conversion:* If we save jobs, prioritize converting long-term temps to permanent status before the cutoff.
      *   **The Organizational Identity:** What kind of union are we? One that sells out future members for current comfort? Or one that fights for the *principle* of bargaining even when the battle is hard?
      *   **Closing:** Confidence level and uncertainty.

  4.  **Refining the Tone:**
      *   Needs to be persuasive but not preachy.
      *   Needs to sound like a union rep (solidarity, leverage, long-term view).
      *   Needs to be concise for a 10-minute read (approx. 1,200 words).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey team. Big vote coming.
      *   Management says: Machines come, you work less, get paid same, get bonus. But don't complain for 6 years.
      *   If we say no, machines come anyway, temps get fired, we get nothing.
      *   If we say yes, we lose power. Work gets harder. Temps get screwed.
      *   My advice: Say yes, BUT change Clause 4. No company tie-break. Limit the pace. Convert some temps.
      *   This is about who we are.
      *   I'm 80% sure. Least sure about the temp conversion.

  6.  **Drafting - Iteration 2 (Fleshing out the text):**
      *   *Self-Correction on Length:* Spoken word is about 130-150 words per minute. 10 minutes = 1,300-1,500 words max. I need to ensure it's not too dense.
      *   *Focus on Clause 4:* This is the philosophical heart. It turns the JTC into a rubber stamp.
      *   *Focus on the "Two-Tier" issue:* This is morally weighty for a union.
      *   *Closing:* Needs to be specific as requested.

  7.  **Final Polish (Reviewing against constraints):**
      *   *Did I treat "they'll do it anyway" seriously?* Yes, acknowledged in the "Strategic Reality" section.
      *   *Is it about the organization type?* Yes, in the "Who We Are" section.
      *   *Is it readable in 10 mins?* Looks like about 1,100-1,200 words. Should be fine.
      *   *Closing requirement met?* Yes.

  8.  **Final Word Count Check:** (Simulated)
      *   The draft looks to be around 1,100 words. At a measured, emphatic speaking pace, this is roughly 8-9 minutes, leaving room for pauses. Perfect.

  9.  **Final Review of the "Confidence" Line:**
      *   Need to be honest. High confidence on the Clause 4 fight, lower confidence on the temp conversion leverage.

  *(Self-Correction during drafting)*: Make sure I don't sound like I'm dictating the vote. I'm a rep making a recommendation to a committee. Use "I recommend" but invite debate.

  *(Refining the Counter-proposals)*: Make them specific. "Remove tie-break" is clear. "Pace monitoring" is clear. "Temp pathway" is clear.

  *(Refining the Ethics)*: Don't guilt-trip, but highlight the long-term cost of a two-tier system.

