answer: |-
  # The Coin, The Card, and The Kitchen Table

  You have stumbled onto one of the cleanest examples of strict dominance by a mixed strategy that I have seen in a homebrew game. Your older kid is mathematically correct, and your philosophical unease is warranted but ultimately misdirected. You are experiencing the friction between game theory as a mathematical model and game theory as a description of human choice. To settle this, we need to separate the arithmetic truth from the psychological worry.

  ### The Arithmetic Truth: Strict vs. Weak
  Your primary worry stems from reading about "deleting dominated strategies" and encountering the problem of order dependence. This is a sophisticated worry, but it applies to *weak* dominance, not *strict* dominance.

  A strategy is **weakly dominated** if there is another strategy that is sometimes better and never worse. Deleting these can indeed change the outcome depending on the order you remove them, because you might delete a strategy that was supporting a specific equilibrium.

  However, your "Window" card is **strictly dominated**. Look at the numbers:
  *   Against Hound: Mixture (4) > Window (2)
  *   Against Lantern: Mixture (4) > Window (3)
  *   Against Trap: Mixture (4) > Window (3)

  The mixture is better in *every single case*. There is no scenario where Window wins or even ties. In game theory, the elimination of strictly dominated strategies is order-independent and robust. It does not require the opponent to be rational. It does not require common knowledge of rationality. It only requires one thing: that you prefer more points to fewer points. If you accept that premise, playing Window is objectively an error, equivalent to choosing to receive $3 when someone offers you $4 for the same task.

  ### The "Swindle" of the Coin Flip
  Your second worry is that the coin flip isn't a real choice. You feel that calling a randomization a "strategy" is a swindle because you aren't actually flipping a coin at the table; you are picking a card.

  This is a category error. In game theory, a "strategy" is not a single muscle movement; it is a complete plan of action. A mixed strategy is a plan that says, "I will commit to being unpredictable." You do not need a physical coin to validate the math. If you play Chimney one round and Cellar the next, alternating deliberately, you are still averaging 4 points per round against any fixed House strategy. The "coin" is just a shorthand for "do not commit 100% of your probability mass to a single option."

  The reason this feels like a swindle is that in a single isolated round, the coin might land on Chimney against Trap, giving you 0 points, while Window would have given 3. In that single instance, the coin "lost." But rationality is about expected value over the long run, or about protecting yourself against exploitation. If you play Window, you cap your potential at 3. If you play the mixture, your *average* is 4. If you play this game more than once, the mixture wins. If you play it once, the mixture still has a higher expected value, which is the only metric a rational agent has access to before the cards are revealed.

  ### The Predictable Nephew
  You asked if the fact that your nephew always plays Trap settles the issue. It settles it even more firmly against Window.

  If you know your nephew plays Trap, you should not play the mixture. You should play Cellar and get 8 points. The mixture gets you 4. But Window gets you 3.
  *   Best Response to Trap: Cellar (8)
  *   Mixed Strategy vs Trap: (4)
  *   Window vs Trap: (3)

  The mixture beats Window regardless of whether the opponent is predictable or unpredictable. The only thing that changes against a predictable opponent is that the mixture is no longer the *best* option—but Window is still *worse* than the mixture. Predictability does not rescue Window; it just highlights that the mixture is a safety net, not necessarily the optimal spear. Window is neither safety nor spear. It is dead weight.

  ### The Fuzziness of Reality
  You worry that the numbers are fiction. In real play, maybe Window feels like 3.5. Does this undermine the argument?

  If the rules are fuzzy, then the matrix is wrong. Game theory operates on the model, not the mess. If your family house-rules effectively change the payoffs such that Window sometimes yields 5 points, then you have changed the game, and the math no longer applies. But if you agree that the printed numbers are the rules, then "fuzziness" is just implementation noise. Noise averages out. Unless the noise is systematically biased in favor of Window (e.g., everyone agrees to give bonus points to Window), the expected value remains tied to the printed numbers. The math holds for the game as written, even if human execution is imperfect.

  ### The Design Verdict
  This brings us to the practical question: should you cut Window?

  A strictly dominated strategy is "false depth." It looks like a choice, but it is not. In a competitive game, false depth is a flaw because it rewards ignorance. The player who doesn't understand the math plays Window and feels safe, while the player who understands the math exploits them. In a family game, this can be fine if the goal is casual fun. However, since you are asking about the philosophy of the design, you clearly care about the integrity of the system.

  Keeping Window validates irrational play. Cutting it simplifies the game to a 2x3 matrix, which might feel sparse. The best design solution is neither blind retention nor simple deletion.

  **Verdict:** The mixture-dominance rule is a genuine requirement of instrumental rationality. If you want to maximize points, you cannot justify playing Window. However, as a designer, you have the power to change the numbers.

  ***

  ### Answers to Your Specific Questions

  1.  **Is "never play something beaten by a mixture" a genuine requirement?**
      Yes. If you prefer more utility to less, and a mixture provides higher expected utility in every possible state of the world, choosing the dominated strategy is irrational. It is not an artifact of the math; it is a consequence of preferring winning to losing.

  2.  **Does opponent predictability rescue Window?**
      No. As shown with your nephew, even against a fixed strategy, Window yields fewer points than the mixture (3 vs 4). Predictability might make the mixture sub-optimal compared to a pure counter (Cellar), but it never makes Window optimal.

  3.  **Does the order-dependence problem infect this case?**
      No. That problem applies to *weak* dominance (where payoffs are equal in some cases). Your case is *strict* dominance (4>3, 4>2). Strict dominance is robust and order-independent. You can delete Window immediately without worrying about collapsing equilibria.

  4.  **Does payoff fuzziness undermine the argument?**
      No, not theoretically. Fuzziness implies the model doesn't match reality. If the model is wrong, fix the model (the numbers). If the numbers are the rules, fuzziness is just noise that averages out over repeated play.

  5.  **Practical: Should I cut Window?**
      Do not keep it as is. It is mathematically broken. Either cut it to streamline the game or rework its numbers so it occupies a unique strategic niche (e.g., make it worth 4 points against one column so it isn't strictly dominated).

