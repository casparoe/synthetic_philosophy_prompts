answer: |-
  Here is a principle derived from your intuitions, stripped of the contradictions that make them hard to enforce. It relies on the idea of **Reasonable Expectation**: harm is not defined by the object itself, but by whether the action violated the agreed-upon rules of interaction for that specific context.

  ### The Principle (3 Lines)

  > 1. **Labor and Investment:** Time and effort invested are property rights, protected unless the specific context or rules explicitly designate them as "at-risk."
  > 2. **Consent and Context:** Social harm is determined by the consent of those affected and the public or private nature of the space, not by the content or market value involved.
  > 3. **Trust and Remedy:** Restoring a lost object repairs the data, but only accountability repairs the community trust violated by its destruction.

  ***

  ### Clause Breakdown & Case Mapping

  **Clause 1: Labor and Investment**
  *   **The Idea:** Property rights in a digital world are not about the code; they are about the human time encoded into it. However, these rights are conditional on the "rules of the game" for that specific area.
  *   **Cases it forces:**
      *   **The Chapel:** The builder invested four years. The context (a persistent world) implies safety. The griefing violated the property right.
      *   **The Sandcastle (Normal vs. Griefing):** In a normal map, the expectation is safety (Wrong). In a griefing server, the expectation is risk (No Wrong). The act is identical; the *context* changes the verdict.
      *   **The Pyramid Scheme:** The rules explicitly permitted the mechanism. Players entered a context designated "at-risk." Therefore, no property right was violated, even if time was lost.
      *   **The Stolen Account:** *Modification required.* You must stop citing the $200 value. The harm is the **unauthorized control** of another's labor/access, which violates the expectation of security. The dollar amount is irrelevant to the server's jurisdiction.

  **Clause 2: Consent and Context**
  *   **The Idea:** The morality of an action depends on who is subjected to it and whether they agreed to be there. This separates the *act* from the *impact*.
  *   **Cases it forces:**
      *   **RP Sexual Violence (Public vs. Private):** The content is identical. In private, there is consent (No Wrong). In public, there is no consent for the audience (Real Wrong).
      *   **The Unique Sword:** The market value ($ vs. sentimental) is explicitly excluded. The harm is the loss of the labor, not the price tag. This aligns the Sword and the Chapel as comparable losses of time, though the Chapel may carry higher emotional weight under Clause 3.
      *   **The NPC:** A bug is not a moral agent. There was no violation of consent or malicious intent. Thus, no "wrong" was committed, even if players are upset about the loss.

  **Clause 3: Trust and Remedy**
  *   **The Idea:** A community runs on trust, not just data integrity. Reversing the physical damage does not reverse the psychological signal that "your work is not safe here."
  *   **Cases it forces:**
      *   **The Chapel (Backup):** The rebuild fixes the map, but not the breach of trust. The ban stands not because the chapel is gone, but because the griefer proved he cannot be trusted with the safety of others' labor.
      *   **The Father's Objection:** His argument ("nothing of value was destroyed") relies on the idea that the *object* is the only thing that matters. This clause rejects that. The *act* damaged the social contract.

  ***

  ### Implications for New Cases

  **1. Server Shutdown (Announced a year in advance)**
  *   **Verdict:** No wrong.
  *   **Reasoning:** Clause 1. By announcing the shutdown a year early, you have explicitly redesignated the entire world as "at-risk" and managed the expectation of permanence. The labor is not being violated; it is reaching its agreed-upon conclusion.

  **2. Memorial Garden Vandalism**
  *   **Verdict:** Severe wrong, likely permanent ban.
  *   **Reasoning:** Clause 1 & 3. This is high emotional labor in a context presumed safe (a memorial). Unlike the chapel, this cannot be "rebuilt" to fix the trust. The violation targets the community's grief, which is the ultimate breach of the social contract.

  **3. Real-World Art ($400 Portrait) Deleted**
  *   **Verdict:** Wrong, but jurisdiction is limited.
  *   **Reasoning:** Clause 1. The player invested real money and the artist invested labor. Deleting it destroys property. However, because the value is external, the server's ability to adjudicate "damages" is limited to in-game restitution. You cannot enforce the $400 loss, but you can punish the deletion of the in-game object.

  **4. Admin Deleting Work as Discipline**
  *   **Verdict:** Permissible only if codified.
  *   **Reasoning:** Clause 1. If the rules state "Admins may remove builds for rule violations," then the player's work is implicitly "at-risk" upon joining. However, to maintain trust (Clause 3), this power must be used sparingly. If used arbitrarily, it breaks the admin community's trust just as much as a griefer does.

  ***

  ### The Blunt Cost

  To make this principle simple enough to hand to another admin, you must sacrifice three of your current intuitions. You cannot keep them without reintroducing the confusion you want to solve.

  **1. You must give up the "$200 Value" justification for the Stolen Account.**
  *   **The Conflict:** You say the Chapel (sentimental) is worse than the Sword (market value), but the Stolen Account is wrong *because* of its market value. This is inconsistent.
  *   **The Cost:** You must ban the account thief for **Unauthorized Access**, not Theft of Property. If the account had $0 value but was still hacked, the ban must be the same. If you rely on the dollar amount, you make your justice dependent on facts you cannot verify (grey market prices).
  *   **Why:** A CoC must rely on visible server events, not external economic data.

  **2. You must give up the ambiguity on the Chapel Backup.**
  *   **The Conflict:** You have asserted both that the harm is gone (because it's rebuilt) and that the harm remains (because of the ban).
  *   **The Cost:** You must commit fully to **Clause 3**. The harm is *not* gone. The data is restored, but the trust is broken. If you tell the father "It's rebuilt so it doesn't matter," you undermine the ban. If you tell him "It's rebuilt but you're still banned," you must explain that the ban is for *conduct*, not *damages*.
  *   **Why:** If restoration equals forgiveness, wealthy players (who can afford to rebuild) can grief with impunity.

  **3. You must accept that "Rules Permit" trumps "Time Wasted" (The Pyramid Scheme).**
  *   **The Conflict:** You feel bad that players lost a year of evenings, but you admit it wasn't a wrong because the rules allowed it.
  *   **The Cost:** You must harden your heart here. If the rules allow a mechanic, the time lost is a **calculated risk**, not a harm. To call it a "wrong" anyway is to rule by whim, not by law.
  *   **Why:** If you punish legal behavior because you dislike the outcome, players cannot know what is safe to do. Predictability is more valuable than perfect fairness in a persistent world.

  **The Philosophical Trade-off:**
  You are moving from a **Consequentialist** view (judging by the outcome: "time was lost," "money was lost") to a **Contractarian** view (judging by the agreement: "was this action permitted," "was consent given").
  *   **What you gain:** Consistency. Your other admins can apply this without knowing the players' personal histories.
  *   **What you lose:** The ability to intervene in "unfair" situations that technically follow the rules. You must accept that sometimes players will lose time legally (Pyramid), and sometimes players will be hurt by bugs (NPC) without a villain to punish.

  Your "Brick Test" was close, but it missed the most important material: **The Contract.** A brick chapel and a data chapel are the same; a brick chapel in a war zone and a brick chapel in a sanctuary are not. Judge the zone, the consent, and the trust, not the block.
