      4.  *Prescribed Burn:* Endorsed. (Dry kept Dry). *Reasoning:* Acknowledged outright killing of insects/small mammals. *Key:* Ecological integrity (prairie health) > Individual invertebrate/small mammal welfare. Short-term acute harm accepted for long-term system health.
