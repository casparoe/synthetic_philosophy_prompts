prompt: |-
  I'm starting a dissertation chapter on what makes two things two, and I want the requirements list before I touch any of the arguments — I've read enough haecceitism-versus-bundle-theory material to know both sides mostly just assert their criteria at each other. So: write the desiderata any account of numerical distinctness has to meet to count as usable in an ontology of physical objects, ordinary and quantum-scale alike (not of sets, not of persons through time). For each requirement, the case or consideration behind it.

  I want the cases it has to return a verdict on — Black's two-sphere universe, Kant's incongruent hands, the two electrons in a helium atom, a statue and the clay it's made of, two drops of water alike in every respect — and the distinctions it isn't allowed to collapse: the version of the indiscernibility principle that lets relational predicates count against the version that doesn't, qualitative sameness against numerical oneness, and explaining a difference against merely going along with one. Then mark which requirements are non-negotiable and which are one camp's preferences wearing a badge. I suspect "distinctness must always be grounded in something qualitative" is the latter but I can't show it, and I don't know whether "distinctness is necessary, never contingent" is a requirement or a theorem.

  Which single requirement knocks out the most candidates? And is there a subset that can't be jointly satisfied — my hunch is grounding plus no brute facts plus the possibility of a symmetric world is already incoherent. Argue that either way, it's the part I most want.

  Plus one case of my own to fit into the list: a world whose only contents are two exactly alike, timeless, non-interacting spheres, with no space and no time at all, so there aren't even relations for them to differ by. Say which requirement it's aimed at, and whether it's a fair test or a rigged one.

  Two sentences each, no more, on how substratum views, bundle-plus-spacetime, and haecceitism do against the finished list. And if you think I've set this up wrong — that what-makes-two-things-two has no non-trivial answer, or that you can't write these criteria without already picking a side — tell me that straight instead of handing me a polite list.
