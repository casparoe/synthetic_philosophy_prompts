      *Refinement:* The human is coherent. They have a "True Reward". The Assistant infers an "Imputed Reward".
      *The Identifiability Gap:* The difference between "I want X" and "I am forced to have X".
      *But the prompt says "ordinary setting... no exotic priors".*
      *Let's look at the "Omission vs. Commission" or "Status Quo" ambiguity.*
      *Actually, the strongest identifiability issue in IRL is the **Reward Shaping** or **Potential-Based Reward Shaping** problem, but that's usually about learning speed.*
      *Let's look at **Time Horizon / Discount Factor** ambiguity.*
      *If the assistant doesn't know the human's discount factor ($\gamma$), a far-sighted human and a myopic human can look identical on short trajectories.*
