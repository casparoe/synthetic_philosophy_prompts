prompt: |-
  I want a thought experiment about inverse reinforcement learning that shows the interesting failure mode isn't just bad data. Build me a case where an assistant observes essentially every choice a person makes, has a correctly specified Bayesian model class and unlimted data, and still converges on a reward function that person would reject on reflection — and where more observations of the same kind couldn't rescue it. Constraints: ordinary setting (household assistant or recommender, nothing sci-fi), no mind-reading or neural access, no exotic priors, and the person's choices have to be fully coherent given their actual values — the failure has to come from the inference itself, not from the human being weak-willed or self-deceiving. Also state up front what the case is supposed to demonstrate, so I can check it's earning that conclusion rather than smuggling it in.

  Then do the check: name the two reward hypotheses that fit the data equally well, show what the assistant actually does under each, and point at the one structural feature of the setup doing the work — plus what happens to the case if you delete that feature. Finish with how someone who thinks active teaching (the human stepping in to instruct or correct the assistant, as in cooperative IRL) dissolves the problem would attack your scenario, and say honestly whether the attack lands.
