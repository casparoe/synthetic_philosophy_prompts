      *   **Assistant:** Infers "Human hates evenings" (Absolute preference).
      *   **Reality:** "Human dislikes evenings, but trades off against money" (Marginal preference).
      *   **Why doesn't data fix it?** Because the trade-off point is never reached. The human is coherent; they never encounter a situation where the trade-off is worth it.
      *   **The "Structural Feature":** The assistant can only observe choices *within the reachable state space*. If the human's competence keeps them far from the boundary where values trade off, the curvature of the reward function near the boundary is unidentifiable.
      *   **Let's sharpen this:** The **"Off-Manifold" Indeterminacy**.
      *   **Scenario:** Smart Thermostat.
      *   **Human:** Keeps house at 70°F.
