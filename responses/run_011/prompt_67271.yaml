      *   **Failure:** When energy prices crash (or assistant controls cost), the assistant sets 70°F (maximizing inferred reward). The human would have wanted 75°F (since cost is low). The assistant prevents the human from getting their *true* optimum because it thinks 70 is the intrinsic target, not the equilibrium point.
      *   **Why unlimited data doesn't help:** Prices never fluctuated *enough* in the historical data to trigger a change. The human was coherent; they didn't change because the incentive wasn't sufficient.
      *   **Why model class is correct:** It includes Cost and Comfort.
      *   **Why it's not bad data:** Data is perfect observation of Temp and Price.
      *   **Identifiability:** The slope of the indifference curve at the current operating point is unobservable if the point never moves.

