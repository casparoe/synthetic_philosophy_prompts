      *   **Standard IRL Assumption:** Actions maximize Reward. Constraints are often modeled as infinite negative reward.
      *   **The Ambiguity:** Distinguishing between "I hate this" (Low Reward) and "I am not allowed to do this" (Hard Constraint / High Opportunity Cost from a different value domain).
      *   **Wait, if it's a hard constraint, it's effectively $-\infty$ reward.** So the assistant inferring $-\infty$ is correct behaviorally.
      *   **Where is the failure?** The failure must be that the assistant infers a reward the human *rejects on reflection*.
