      *   **Thesis:** IRL fails when human competence creates a "stable equilibrium" that masks the trade-off structure of their true reward function. The assistant learns the *equilibrium point* as the *intrinsic goal*.
      *   **Scenario:** "The Thermostat Equilibrium".
      *   **Hypotheses:**
