      *   *Constraint Check:* The prompt says "person's choices have to be fully coherent given their actual values." This means I can't rely on bias, addiction, or mistake. The human is a perfect optimizer of their *true* reward.
      *   *Constraint Check:* "More observations of the same kind couldn't rescue it." This implies an identifiability problem, not a statistical convergence problem. The data is asymptotically perfect, but the mapping from data to reward is many-to-one.

