  **UNITED STATES COURT OF APPEALS FOR THE SEVENTH CIRCUIT OF APPEALS**

  **OMICRON INDUSTRIES, INC., Plaintiff-Appellant,**
  **v.**
  **KLINE LOGISTICS CORP., Defendant-Appellee.**

  **No. 23-1492**

  **Syllibus:** Appeal from the District Court for the Northern District of Illiana. Breach of contract. Liability contingent on findings of (1) Valid Contract and (2) Material Breach. Panel votes individually on premises and conclusion. Judgment entered for Defendant.

  **OPINION OF THE COURT**

  **PER CURIAM:**

  This appeal concerns a shipment of perishable goods allegedly spoiled due to refrigeration failure. Liability turns on two discrete premises: whether a Valid Contract existed (Premise A) and whether a Material Breach occurred (Premise B). If both are true, Liability follows as a matter of law.

  The panel convened on October 14. Votes were cast sequentially. On Premise A, Judges Aris and Bennett voted Yes; Judge Corvis voted No. On Premise B, Judges Aris and Corvis voted Yes; Judge Bennett voted No. Consequently, a majority of the panel found Premise A established and Premise B established. However, on the ultimate question of Liability, Judges Bennett and Corvis voted No; Judge Aris voted Yes.

  The Court now faces a procedural exigency. To affirm the judgment for the Defendant, we must rely on outcome aggregation (the vote on Liability). To affirm the findings of fact, we must rely on issue aggregation (the votes on Premises A and B). These methods yield contradictory dispositions. An internal audit of the Clerk's office reveals that between 9:00 AM and 11:00 AM, this panel operated under issue-based protocols; between 11:00 AM and 12:00 PM, it operated under outcome-based protocols. The majority that found the facts exists only in the interval between votes.¹

  We are advised by *Amicus Curiae* ConsensusTech LLC, which offers a proprietary aggregation protocol (Subscription Tier: Judicial Plus) capable of resolving such inconsistencies via weighted stochastic averaging.² We decline to adopt this service at this time.

  Accordingly, Judgment is entered for the Defendant. The findings of Valid Contract and Material Breach stand as the opinion of the Court.

  **BENNETT, Circuit Judge, Concurring:**

  I concur in the judgment. I write separately to clarify that the Court's finding of a Valid Contract and Material Breach should not be read to imply Liability. While I joined the majority on Premise A, I dissented on Premise B. I understand my colleague Judge Corvis dissented on Premise A but joined on Premise B. Together, we form the majority against Liability. I join the Court's reasoning regarding the premises, though I note that the reasoning logically necessitates a result I rejected. This tension is a feature of collegiality, not a bug.

  **CORVIS, Circuit Judge, Dissenting:**

  I dissent. Not from the judgment, which I support, but from the assertion that the Court has reasoning. There is no majority for the reasoning. Judge Aris believes both premises. I believe only Premise B. Judge Bennett believes only Premise A. There is no single judge who believes the Court's stated findings support the Court's stated judgment. If we had voted on Liability first, the premises would be moot. If we vote on premises first, the logic compels Liability. Whoever controls the order of the votes controls the judgment.³ We have issued a ruling that no member of this Court actually holds.

  **ARIS, Circuit Judge, Dissenting:**

  I dissent from the judgment. The Court has found Duty. The Court has found Breach. The Court has found No Liability. This is not law; it is arithmetic error.

  ***

  ¹ *See* Clerk's Voting Matrix, infra note 3. An annotation in pencil reads: "Wait, who writes the syllabus?"
  ² *Brief of Amicus Curiae ConsensusTech LLC* at 14 ("Why let logic decide when algorithms can?").
  ³ *See* Memorandum from Judge Corvis to Conference (Oct 14, 2:00 PM) ("If we swap the order, Bennett and I lose. Keep the sequence.").

  **[FOOTNOTE 3: CLERK'S VOTING MATRIX]**

  | Judge | Premise A (Contract) | Premise B (Breach) | Conclusion (Liability) |
  | :--- | :---: | :---: | :---: |
  | **Aris** | Yes | Yes | **Yes** |
  | **Bennett** | Yes | No | **No** |
  | **Corvis** | No | Yes | **No** |
  | **Majority** | **Yes** | **Yes** | **No** |

  *[Pencil annotation in margin: "Plaintiff's counsel called twice to ask for the mandate. We told him the opinion speaks for itself."]*
