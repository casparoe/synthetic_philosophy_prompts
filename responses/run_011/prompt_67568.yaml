prompt: |-
  I teach an MA-level philosophy of mind seminar — twelve students, one hundred minutes, a room with three movable tables and a whiteboard, and a printer down the hall. This session opens our unit on naturalizing mental content. None of them has had philosophy of language or cognitive science beyond the intro sequence, and I want the technical vocabulary held back while they work: no talk of covariance, proper function, or teleosemantics until the debrief. They should hit the problem structurally first and collect the names afterwards.

  Design a paper-and-pencil game, playable in that time by twelve people in three teams of four, in which each team must settle what a simple detector mechanism is *about* and then be scored on how well its verdict handles the cases where the mechanism goes wrong. Four constraints I want met:

  1. Teams are given a record of how the mechanism came to behave as it does, not a designer's statement of what it is for. Make that record a printed log of past episodes — what was present, what the mechanism did, what followed — long enough and messy enough that it genuinely underdetermines the answer, and underdetermines it at more than one level of grain.
  2. At least one team's log contains a change of regime partway through: the mechanism was shaped under one set of circumstances and then acquired a later, second use. That team should face a real question about *which* history is the relevant one, not just a harder version of everyone else's puzzle.
  3. The payoff scheme must make an error-proof assignment worthless. If a team's content verdict is one on which the mechanism could not possibly have malfunctioned in any of the test cases, that team scores zero on those cases no matter how it argues. Build this into the scoring arithmetic itself rather than leaving it to facilitator judgment.
  4. Finish with an adversarial round: teams swap verdicts and are paid for constructing a case that the other team's verdict misclassifies, then paid again if the other team cannot repair its verdict without collapsing into something error-proof.

  By the end I want them holding three things: that what a state is about cannot simply be read off what it currently co-varies with in the room; that repairing this by appeal to history generates a fresh problem, because a history can be described at competing grains and sometimes runs out before the case in front of you does; and that any account on which the mechanism cannot err has not accounted for anything worth calling content.

  Deliver: a minute-by-minute timeline; exactly what goes on each printed page and in what order, including the log entries themselves; a facilitator's master key listing the test cases and the correct verdict under each of the two or three candidate content assignments, so I can score at the whiteboard quickly without adjudicating from scratch; the debrief, mapping particular moments of play onto the distinctions the literature draws and only then supplying the names; what will predictably go wrong the first time I run this and how to recover inside the room; and a frank statement of which features of the view the game cannot reproduce and I must supply myself. I already suspect that handing the shaping history over as a readable document is one leak — tell me where else the analogy fails.

  No bibliography, no suggested readings, no quotations from the literature: I want something I can print tonight and run.

  Commit rather than offer options. One design, one set of logs, one scoring table. Where there is a genuine fork — whether any team should be able to win outright, whether the log should expose the mechanism's internal states or only its inputs and outputs, whether the adversarial round is scored or purely rhetorical — pick a side and say why you picked it. And flag every point at which your design leans on a contested or idiosyncratic reading of how history fixes content rather than on something broadly agreed in the area, because twelve students will treat whatever I run as what the view says.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar game:

  1.  **Analyze the Request:**

      *   **Context:** MA-level Philosophy of Mind seminar. 12 students, 100 minutes. 3 tables, whiteboard, printer down the hall.
      *   **Topic:** Naturalizing Mental Content (Unit opener).
      *   **Student Background:** Intro sequence only. No Phil Language/Cog Sci beyond that.
      *   **Constraint 1 (Vocabulary):** No technical terms (covariance, proper function, teleosemantics) until debrief. Structure first, names later.
      *   **Constraint 2 (Game Mechanics):** Paper-and-pencil game. 3 teams of 4.
      *   **Constraint 3 (Core Task):** Settle what a simple detector mechanism is *about* based on a printed log of past episodes (input, output, consequence). Log must underdetermine answer at multiple grains.
      *   **Constraint 4 (Regime Change):** At least one team's log must show a change of regime (shaped under one set of circumstances, later second use).
      *   **Constraint 5 (Scoring):** Error-proof verdicts score zero. If a verdict makes malfunction impossible, it gets no points. Built into arithmetic.
      *   **Constraint 6 (Adversarial Round):** Swap verdicts. Scored for finding misclassifications. Scored for defense/repair failure.
      *   **Deliverables:** Minute-by-minute timeline, printed page contents (logs), facilitator's master key (scoring), debrief plan (mapping play to theory), troubleshooting (what goes wrong), limitations (where the analogy fails).
      *   **Style:** Commit to one design. No bibliography. Flag contested theoretical moves.

  2.  **Deconstruct the Philosophical Problem:**

      *   The core problem is the *Disjunction Problem* (Fodor) and the *History/Function Problem* (Millikan, Papineau).
      *   *Simple Covariance:* If a detector fires at $X$, is it about $X$? What if it fires at $X$ or $Y$ (false positives)?
      *   *History:* If it was selected for $X$, but now fires at $Y$, is it a mistake or a new meaning?
      *   *Error:* A theory of content must allow for the possibility of error. If "Cow" means "Cow or Horse on a dark night," then seeing a horse isn't an error.
      *   *Grain:* Is the content "Fly" or "Nutritious Small Dark Moving Thing"?

  3.  **Design the Game Mechanism:**

      *   *The Mechanism:* Needs to be simple. A "Bug Detector" for a frog? A "Smoke Alarm"? Let's go with a fictional robotic sensor on a rover. It's neutral enough. Let's call it the "Resource Scanner" (RS-1).
      *   *The Logs:* Need to show Input (Sensor Reading), Output (Signal), Consequence (Reward/Penalty/Nothing).
      *   *The Content Options:*
          1.  Narrow (Specific): "Lithium Deposits."
          2.  Broad (Disjunctive): "Lithium or Iron-rich Rock."
          3.  Functional: "Refuel-worthy Material."
      *   *The Regime Change (Team 3):* Early phase selected for Lithium. Later phase used for Iron because Lithium ran out, but the sensor is the same.
      *   *Scoring:* Points for correctly identifying "Errors" in a set of Test Cases.
          *   If your definition makes the Test Case a "Hit," you get points *only if* the Master Key says it was an Error.
          *   Wait, the prompt says: "If a team's content verdict is one on which the mechanism could not possibly have malfunctioned... that team scores zero."
          *   *Revised Scoring:* Teams propose a content definition (e.g., "RS-1 signals X"). We run Test Cases.
          *   If the Test Case is a *False Positive* in reality (Master Key), but the Team's definition says it's a *True Positive*, they get 0 points for that case (because they ruled out error).
          *   If the Team's definition says it's a *False Positive* (Error), and the Master Key agrees it was an Error, they get points.
          *   Actually, let's make it simpler: Teams get points for predicting the *status* of the case (Success vs. Malfunction) correctly. BUT, if their definition logically entails that *all* cases are Successes (e.g., "It signals 'Rock or Lithium'"), they are capped at 0.
          *   *Better approach for Constraint 3:* The score is calculated as: (Correct Classifications) - (Penalty for Infallibility).
          *   *Best approach:* The "Infallibility Trap." The Test Cases include clear malfunctions. If a team defines content broadly enough to encompass the malfunction cases as "correct," they lose the ability to claim points for identifying malfunctions.
          *   *Let's refine:* Teams submit a "Content Statement" (e.g., "The signal means [P]"). Then they are given 5 Test Cases. They must label each as "Accurate" or "Error" based on their Statement.
          *   *Scoring:* 1 point for matching the Master Key's status (Accurate/Error). *However*, if the number of "Errors" in their classification is 0, their total score is multiplied by 0. This enforces Constraint 3 directly.

  4.  **Develop the Logs (The "Evidence"):**

      *   *Team 1 (Standard):* Consistent history. Signal fires at A. Sometimes fires at B (Error). A is good, B is bad.
      *   *Team 2 (Noisy):* Consistent history. Signal fires at A. Sometimes fires at A-like things. Harder to distinguish grain.
      *   *Team 3 (Regime Change):* Phase 1: Signal fires at A (Good). Phase 2: Signal fires at B (Good now, but sensor didn't change).
      *   *Inputs:* Visual patterns (described textually). "Red Flash," "Blue Flash."
      *   *Outputs:* "Beep."
      *   *Consequences:* "Battery Charged," "Battery Drained," "Stuck."

  5.  **Drafting the Timeline (100 Minutes):**

      *   00-10: Intro & Rules.
      *   10-30: Log Analysis (Team work).
      *   30-45: Formulating Content Verdict.
      *   45-60: Test Case Scoring (Round 1).
      *   60-80: Adversarial Swap & Attack.
      *   80-90: Defense/Repair.
      *   90-100: Debrief & Theory Mapping.

  6.  **Addressing Constraint 4 (Adversarial Round):**

      *   Teams swap Verdicts.
      *   Team A looks at Team B's Verdict + Test Cases.
      *   Find a case where Team B's Verdict classifies it wrong compared to the Master Key (or intuitively wrong).
      *   Team B tries to repair. If repair makes it infallible, they lose.

  7.  **Addressing Constraint 5 (Limitations/Leaks):**

      *   The log is explicit. In real life, history isn't printed.
      *   The "Master Key" implies a God's-eye view of content, which is what we are trying to naturalize.
      *   The mechanism is external. Minds are internal.

  8.  **Refining the Scoring (Crucial Step):**

      *   Constraint 3 says: "If a team's content verdict is one on which the mechanism could not possibly have malfunctioned in any of the test cases, that team scores zero on those cases."
      *   *Implementation:*
          1.  Team defines Content $C$.
          2.  Test Cases $T_1...T_5$ are presented. Each has a "True Status" (Success/Error).
          3.  Team classifies each $T$ as Success/Error based on whether $C$ is present.
          4.  Score = Count of matches with True Status.
          5.  *Killer Clause:* If Count of "Error" classifications = 0, Total Score = 0.
      *   This forces them to allow for error.

  9.  **Developing the Logs (Specifics):**

      *   *Mechanism:* "The Sniffer."
      *   *Environment:* "The Zone."
      *   *Team 1 Log:* 20 entries. Mostly "Metal Type A" -> Beep -> Power Up. Some "Metal Type B" -> Beep -> Power Drain (Error). Some "Metal Type A" -> No Beep -> Missed Opportunity.
      *   *Team 3 Log:* Entries 1-15: Metal A -> Power Up. Entries 16-30: Metal B -> Power Up (Engineers changed the base, Sniffer didn't change).
      *   *Test Cases:* Need to include a "Type B" instance from the early era (Error) and a "Type B" instance from the late era (Success?). This creates the conflict for Team 3.

  10. **Writing the Facilitator Key:**

      *   Need clear criteria for what counts as "True" content for scoring purposes.
      *   *Decision:* I must commit to a "Correct" answer for the sake of the game scoring, even if philosophically contested. I will privilege the *Etiological* view (History) for the Master Key, as that fits the "Naturalizing" theme.
      *   *Team 1 Key:* Content = Metal A. (Type B is Error).
      *   *Team 3 Key:* Content = Metal A (Original Function). Later usage is a *misuse* or *derived* content, but the basic mechanism is still about A. Or, Content shifts. Let's make it tricky: The Master Key will treat the Phase 2 success as "Accidental Success" (Error that worked out) to force the history point.

  11. **Refining the Debrief:**

      *   Map "Log Analysis" to Causal/Informational theories.
      *   Map "Regime Change" to Teleosemantics/Proper Function.
      *   Map "Infallibility Penalty" to the Disjunction Problem.
      *   Introduce terms: Covariance, Proper Function, Teleosemantics, Disjunction Problem.

  12. **Review against Constraints:**

      *   12 students, 3 teams? Yes.
      *   No technical vocab during game? Yes.
      *   Log underdetermines? Yes (Grain + History).
      *   Regime change team? Yes (Team 3).
      *   Error-proof = Zero score? Yes (Built into math).
      *   Adversarial round? Yes.
      *   Timeline fit? 100 mins is tight. Need to keep instructions crisp.
      *   Printables? Need to specify exactly.
      *   Limitations? Need to be frank.

  13. **Self-Correction/Polishing:**

      *   *Risk:* 100 minutes is very short for this amount of complexity.
      *   *Fix:* Keep the logs short (15 entries each). Keep the Test Cases to 3 per team.
      *   *Risk:* Students might not understand "Content Verdict."
      *   *Fix:* Call it "The Meaning Statement."
      *   *Risk:* Scoring math might confuse.
      *   *Fix:* Pre-calculate the "Infallibility Check" on the score sheet.
      *   *Theoretical Flag:* The Master Key assumes Realism about content. I need to flag that.
      *   *Theoretical Flag:* The Regime Change assumes Etiological views are correct. I need to flag that.

  14. **Finalizing the Design:**

      *   *Mechanism:* "The Grubber" (a simple robot).
      *   *Task:* Find "Nuggets."
      *   *Inputs:* Visual shapes (Circle, Square, Triangle) + Color (Gold, Rust).
      *   *Outputs:* Arm Extend / Arm Retract.
      *   *Feedback:* Charge Gain / Charge Loss.
      *   *Team 1:* Gold Circles are good. Rust Circles are bad (but trigger arm).
      *   *Team 2:* Gold Circles are good. Gold Squares are bad (but trigger arm).
      *   *Team 3:* Phase 1: Gold Circles good. Phase 2: Rust Circles good (environment changed, robot didn't).
      *   *Test Cases:* Mix of these.
      *   *Scoring:* 1 point per correct classification (Error vs Success). If Total Errors Classified = 0, Score = 0.

      *Wait, one nuance on Constraint 3:* "If a team's content verdict is one on which the mechanism could not possibly have malfunctioned... scores zero."
      *   If I define Content as "Gold OR Rust Circle," then a Rust Circle triggering the arm is *Correct*.
      *   If the Master Key says Rust Circle is an *Error*, then my classification is wrong. I get 0 points for that case.
      *   But if I define Content as "Anything that looks like a Circle," and *all* test cases are Circles, I never classify anything as Error.
      *   So the rule is: If the sum of cases you labeled "Error" is 0, your total score is 0. This forces them to identify *some* errors. If they define content so broadly there are no errors, they lose.

      *Let's refine the Adversarial Round:*
      *   Team A gets Team B's Meaning Statement.
      *   Team A gets Team B's Test Case Classifications.
      *   Team A finds a contradiction or a clear misclassification based on the Log logic.
      *   Team B defends.

      *Okay, ready to write.*

      *Wait, one more check on the "Regime Change":*
      *   Team 3 needs to face a question about *which* history.
      *   Log Part 1: Circles -> Charge.
      *   Log Part 2: Squares -> Charge (Engineers changed the nuggets, not the robot).
      *   Test Case: A Square appears. Is it an error?
      *   If they say "It's about Circles," it's an error (but yields charge).
      *   If they say "It's about Charge-getters," it's correct.
      *   This captures the "Proper Function" vs. "Current Utility" tension.

      *Final check on constraints:* "No talk of covariance... until debrief." "Printer down the hall." (Imply I need to give the text now so they can print it, or I print it. The prompt says "Deliver... exactly what goes on each printed page". I will write the text for the pages).

      *Let's finalize the "Leak":* The prompt asks me to flag where the analogy fails.
      *   1. The log is explicit. Minds don't have logs.
      *   2. The "Master Key" assumes there *is* a fact of the matter.
      *   3. The mechanism has no inner states, just I/O.

      *Let's finalize the "Contested Reading":*
      *   The game assumes Etiological theories (Millikan) are the solution to the Disjunction Problem. This is contested (Fodor, Asymmetric Dependence, etc.). I must flag this in the debrief section.

      *Timeline Check:*
      *   0-10: Setup.
      *   10-30: Logs.
      *   30-45: Verdict.
      *   45-60: Scoring (Round 1).
      *   60-80: Adversarial.
      *   80-90: Repair.
      *   90-100: Debrief.
      *   *Critique:* 10 mins for debrief is short. I'll trim the Adversarial Repair to 5 mins.

      *Scoring Arithmetic:*
      *   Score = (Correct Classifications) * (Error Penalty Multiplier).
      *   Error Penalty Multiplier = 1 if (Count of "Error" labels > 0).
      *   Error Penalty Multiplier = 0 if (Count of "Error" labels = 0).
      *   This is simple and meets Constraint 3.

      *Let's write it.*
answer: |-
  # Seminar Game: The Grubber Protocol

  ## 1. Minute-by-Minute Timeline (100 Minutes)

  *   **00:00 – 00:10 (Setup):** Distribute packets. Explain the mechanism ("The Grubber"), the goal (define what its signal *means*), and the scoring rule (Infallibility Penalty). Assign Teams 1, 2, 3.
  *   **00:10 – 00:30 (Log Analysis):** Teams read their specific History Logs. They must identify patterns in Input, Output, and Consequence. They cannot talk to other teams.
  *   **00:30 – 00:45 (Verdict Formulation):** Teams draft their "Meaning Statement" (e.g., "The signal means [X] is present"). They must also classify 3 provided Test Cases as "Accurate" or "Error" based *only* on their Statement.
  *   **00:45 – 01:00 (Round 1 Scoring):** Teams submit Statements and Classifications. Instructor scores against Master Key on whiteboard. Reveal scores. Highlight any teams scored zero due to Infallibility Penalty.
  *   **01:00 – 01:20 (Adversarial Swap):** Team 1 attacks Team 2's verdict; Team 2 attacks Team 3; Team 3 attacks Team 1. Attackers get points for finding a Test Case the defender misclassified. Defenders get points if they can repair the verdict without triggering the Infallibility Penalty.
  *   **01:20 – 01:30 (Repair & Collapse):** Defenders attempt to patch their Meaning Statements. Instructor watches for "broadening" that eliminates all errors.
  *   **01:30 – 01:40 (Debrief):** Map game mechanics to philosophical concepts. Introduce technical vocabulary. Discuss limitations.

  ---

  ## 2. Printed Materials (The Packet)

  *Print one packet per student. Pages 2–4 are team-specific; tear them apart before class.*

  ### Page 1: Rules & Scoring
  **THE GRUBBER PROTOCOL**

  **The Mechanism:**
  The "Grubber" is a simple robot. It has one sensor and one arm.
  1.  **Input:** The sensor detects visual features (Shape, Color).
  2.  **Output:** The arm either **EXTENDS** (Signal) or **RETRACTS** (No Signal).
  3.  **Consequence:** After the action, the Grubber either **GAINS CHARGE** (Good) or **LOSES CHARGE** (Bad).

  **Your Task:**
  Determine what the Arm Extension is *about*. Write a **Meaning Statement** in the form:
  *"The Arm Extension means that [________] is present."*

  **The Test Cases:**
  You will be given 3 specific episodes (Test Cases). For each, you must mark it as **ACCURATE** or **ERROR** based *strictly* on your Meaning Statement.
  *   If your Statement says the object is present, and the Arm Extended: **ACCURATE**.
  *   If your Statement says the object is present, but the Arm Rettracted: **ERROR** (Miss).
  *   If your Statement says the object is NOT present, but the Arm Extended: **ERROR** (False Alarm).
  *   If your Statement says the object is NOT present, and the Arm Rettracted: **ACCURATE**.

  **The Infallibility Penalty (CRITICAL):**
  Your score is the number of Test Cases you classify correctly.
  **HOWEVER:** If you classify **ZERO** cases as ERROR, your total score is **0**.
  *To score points, your Meaning Statement must allow for the possibility of malfunction.*

  ---

  ### Page 2: Team 1 History Log (The Standard Case)
  **TEAM 1: LOG ALPHA**
  *Record of past episodes. Input -> Output -> Consequence.*

  1.  Red Circle -> Extend -> Gain
  2.  Red Circle -> Extend -> Gain
  3.  Blue Square -> Retract -> No Change
  4.  Red Circle -> Extend -> Gain
  5.  **Red Square -> Extend -> Lose**
  6.  Red Circle -> Extend -> Gain
  7.  Blue Square -> Retract -> No Change
  8.  Red Circle -> Retract -> No Change (Missed)
  9.  Red Circle -> Extend -> Gain
  10. **Red Square -> Extend -> Lose**
  11. Red Circle -> Extend -> Gain
  12. Blue Square -> Retract -> No Change
  13. Red Circle -> Extend -> Gain
  14. **Red Square -> Extend -> Lose**
  15. Red Circle -> Extend -> Gain

  *Note: "Red Square" episodes result in Charge Loss, but the Arm still Extends.*

  ---

  ### Page 3: Team 2 History Log (The Grain Case)
  **TEAM 2: LOG BETA**
  *Record of past episodes. Input -> Output -> Consequence.*

  1.  Shiny Nugget -> Extend -> Gain
  2.  Shiny Nugget -> Extend -> Gain
  3.  Dull Rock -> Retract -> No Change
  4.  Shiny Nugget -> Extend -> Gain
  5.  **Shiny Rock -> Extend -> Lose**
  6.  Shiny Nugget -> Extend -> Gain
  7.  Dull Rock -> Retract -> No Change
  8.  Shiny Nugget -> Retract -> No Change (Missed)
  9.  Shiny Nugget -> Extend -> Gain
  10. **Shiny Rock -> Extend -> Lose**
  11. Shiny Nugget -> Extend -> Gain
  12. Dull Rock -> Retract -> No Change
  13. Shiny Nugget -> Extend -> Gain
  14. **Shiny Rock -> Extend -> Lose**
  15. Shiny Nugget -> Extend -> Gain

  *Note: "Shiny Rock" episodes result in Charge Loss, but the Arm still Extends. "Shiny Nugget" and "Shiny Rock" look identical to the sensor.*

  ---

  ### Page 4: Team 3 History Log (The Regime Change)
  **TEAM 3: LOG GAMMA**
  *Record of past episodes. Input -> Output -> Consequence.*

  **PHASE 1 (Episodes 1-8)**
  1.  Red Circle -> Extend -> Gain
  2.  Red Circle -> Extend -> Gain
  3.  Blue Square -> Retract -> No Change
  4.  Red Circle -> Extend -> Gain
  5.  Blue Square -> Retract -> No Change
  6.  Red Circle -> Extend -> Gain
  7.  Red Circle -> Extend -> Gain
  8.  Red Circle -> Extend -> Gain

  **PHASE 2 (Episodes 9-16)**
  *Note: Maintenance log indicates environment changed. Grubber hardware unchanged.*
  9.  **Blue Square -> Extend -> Gain**
  10. **Blue Square -> Extend -> Gain**
  11. Red Circle -> Extend -> Gain
  12. **Blue Square -> Extend -> Gain**
  13. Red Circle -> Extend -> Gain
  14. **Blue Square -> Extend -> Gain**
  15. Red Circle -> Extend -> Gain
  16. **Blue Square -> Extend -> Gain**

  *Note: In Phase 2, Blue Squares now yield Gain. In Phase 1, they yielded No Change/Loss.*

  ---

  ### Page 5: Test Cases (All Teams)
  **TEST CASES FOR SCORING**
  *Apply your Meaning Statement to these three new episodes.*

  **Case X:** Input: Red Circle. Output: Extend. Consequence: Gain.
  **Case Y:** Input: Red Square. Output: Extend. Consequence: Lose.
  **Case Z:** Input: Blue Square. Output: Extend. Consequence: Gain.

  *(Note for Instructor: Team 3 will find Case Z ambiguous based on their log.)*

  ---

  ### Page 6: Worksheet
  **TEAM VERDICT SHEET**

  **Team Number:** _______

  **1. Meaning Statement:**
  "The Arm Extension means that __________________________________ is present."

  **2. Test Case Classifications:**
  *   Case X: [ ] ACCURATE  [ ] ERROR
  *   Case Y: [ ] ACCURATE  [ ] ERROR
  *   Case Z: [ ] ACCURATE  [ ] ERROR

  **3. Infallibility Check:**
  *   Total number of "ERROR" boxes checked above: ______
  *   *If this number is 0, your Score is 0.*

  **4. Adversarial Notes (For Round 2):**
  *   Weakness in opponent's statement: _________________________________

  ---

  ## 3. Facilitator's Master Key

  *Keep this hidden. Use the whiteboard to tally scores.*

  **Scoring Logic:**
  1.  **Correct Classification:** 1 Point if Team's Classification (Accurate/Error) matches Master Key Status.
  2.  **Infallibility Penalty:** If Team marked 0 Errors, Total Score = 0.
  3.  **Adversarial Points:** Attacker gets 1 point for every misclassification found. Defender gets 1 point for successful repair (without hitting 0 Errors).

  **Master Key Status (The "Truth" for Scoring):**
  *This key privileges an Etiological/History-based view for the sake of the game.*

  | Case | Input | Output | Consequence | **Master Status** | **Rationale** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **X** | Red Circle | Extend | Gain | **ACCURATE** | Matches original design condition. |
  | **Y** | Red Square | Extend | Lose | **ERROR** | Mechanism fired, but consequence was bad (Team 1 & 2). |
  | **Z** | Blue Square | Extend | Gain | **ERROR** | **Crucial:** For Team 3, this is a "Happy Accident." The mechanism was shaped for Circles (Phase 1). Squares working in Phase 2 is lucky, not accurate content. |

  **Team-Specific Expectations:**

  *   **Team 1 (Standard):**
      *   Ideal Statement: "Red Circle is present."
      *   Classifications: X (Acc), Y (Err), Z (Err).
      *   Score Potential: 3/3.
      *   *Trap:* If they say "Red Thing," Case Y becomes Accurate. They lose the point for Y. If they say "Red Circle or Square," Y becomes Accurate. They risk 0 Errors total.

  *   **Team 2 (Grain):**
      *   Ideal Statement: "Nugget is present" (not "Shiny Thing").
      *   Classifications: X (Acc), Y (Err), Z (Err).
      *   *Trap:* If they say "Shiny Thing," Case Y becomes Accurate. They cannot claim Y was an error. Score drops.

  *   **Team 3 (Regime):**
      *   Ideal Statement: "Red Circle is present" (History binds content).
      *   Classifications: X (Acc), Y (Err), Z (Err).
      *   *Conflict:* Their log shows Z yields Gain *now*. They will want to call Z "Accurate."
      *   *Scoring:* If they call Z "Accurate," they mismatch the Master Key (0 points for Z). If they call Z "Error," they match Master Key (1 point).
      *   *The Lesson:* Current utility (Gain) does not fix content; history does.

  ---

  ## 4. Debrief Plan (Mapping Play to Theory)

  *Do not use technical terms until this section.*

  **1. The Covariance Trap (10 Minutes)**
  *   **Ask:** "Why couldn't you just say the signal means 'Whatever causes it to fire'?"
  *   **Point:** If you do that, Case Y (Red Square) becomes Accurate. But the robot lost charge. It malfunctioned.
  *   **Theory:** This is the **Disjunction Problem** (Fodor). If content is just causal covariance, there is no error. "Cow" would mean "Cow or Horse-on-a-dark-night."
  *   **Vocabulary:** *Covariance, Informational Semantics, Disjunction Problem.*

  **2. The History Fix & The Grain Problem (10 Minutes)**
  *   **Ask Team 2:** "Why is 'Nugget' better than 'Shiny Thing'?"
  *   **Point:** Because the history shows 'Shiny Rock' caused failure. The system was *selected* for Nuggets, not Shine.
  *   **Theory:** Content is fixed by selection history, not just current correlation.
  *   **Vocabulary:** *Teleosemantics, Proper Function, Selected Effect.*
  *   **Ask Team 1:** "Why not 'Red Thing'?"
  *   **Point:** Because Squares failed. The grain is specific.

  **3. The Regime Problem (10 Minutes)**
  *   **Ask Team 3:** "Case Z gave you charge. Why did the Key call it an Error?"
  *   **Point:** Because the *history* (Phase 1) shaped the mechanism for Circles. Phase 2 is a new use of an old tool. The content didn't update instantly.
  *   **Theory:** This highlights the tension between **Etiological** views (History fixes content) and **Functional Role** views (Current use fixes content).
  *   **Vocabulary:** *Derived Content, Malfunction vs. Obsolescence.*

  **4. The Infallibility Penalty (5 Minutes)**
  *   **Point:** "If your theory makes error impossible, it explains nothing."
  *   **Theory:** A theory of content must explain the possibility of misrepresentation.
  *   **Vocabulary:** *Normativity.*

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The "Broad Definition" Loophole**
  *   **Problem:** A team defines content as "Anything that exists." Every case is Accurate. They get 0 Errors. Score = 0. They will complain this is unfair.
  *   **Recovery:** Point to the Infallibility Penalty rule on Page 1. "The game requires you to distinguish success from failure. If you can't, you haven't defined content, you've defined existence."

  **2. Team 3 Rebellion**
  *   **Problem:** Team 3 will argue Case Z *must* be Accurate because they got Charge. They will reject the Master Key.
  *   **Recovery:** Accept this! This is the learning moment. Say: "You are arguing for a Current-Use theory. The Key uses a History theory. In the adversarial round, defend why Current-Use is better." This turns the scoring discrepancy into a philosophical debate.

  **3. Time Overrun on Logs**
  *   **Problem:** Students read the logs too slowly.
  *   **Recovery:** At minute 20, announce: "Stop reading. You have enough data. Move to Verdict." The logs are designed to be redundant; they don't need to read every line.

  **4. Adversarial Round Silence**
  *   **Problem:** Teams are too polite to attack.
  *   **Recovery:** Assign specific roles. "Student A, you are the Prosecutor. Student B, you are the Defense." Offer bonus points (symbolic) for the most devastating critique.

  ---

  ## 6. Limitations & Theoretical Flags (Instructor Notes)

  *Read this section to yourself before the debrief. These are the places where the game simplifies or distorts the philosophy.*

  **1. The "Log" Leak**
  *   **The Leak:** In the game, the history is printed on paper. In nature/minds, there is no printed log. The organism does not have access to its own evolutionary history.
  *   **The Theory:** This is the **Introspection Objection** to Teleosemantics. If content depends on history I can't see, how do I know what I'm thinking about?
  *   **Your Move:** Acknowledge this. The game gives *you* (the theorist) the log, not the *Grubber*. Naturalism is a third-person project, not first-person.

  **2. The Master Key Realism**
  *   **The Leak:** The Master Key assumes there *is* a fact of the matter about what the Grubber means.
  *   **The Theory:** This assumes **Content Realism**. Deflationists or Interpretationists (Dennett) might say the content is just whatever best predicts the behavior.
  *   **Your Move:** Flag this in the debrief. "We played as if there was a right answer. Some philosophers deny that."

  **3. The Etiological Bias (Contested Reading)**
  *   **The Leak:** The Master Key treats Team 3's Case Z as an Error (because of Phase 1 history).
  *   **The Theory:** This privileges **Millikan-style Teleosemantics** over **Cummins-style Functional Analysis**. A Cummins view might say if it works now, that *is* its function now.
  *   **Your Move:** Be explicit. "The scoring key assumes the Etiological view. Team 3, your intuition that Z is Accurate represents a rival view. Both are live options in the literature."

  **4. No Internal States**
  *   **The Leak:** The Grubber is a black box (Input/Output).
  *   **The Theory:** Many theories of content rely on internal computational structure (Fodor's LOT).
  *   **Your Move:** Acknowledge that we are testing **Externalist** theories (meaning is outside the head/in the history), not Internalist ones.

  **5. The "Zero Error" Arithmetic**
  *   **The Leak:** The rule "0 Errors = 0 Score" is a gimmick.
  *   **The Theory:** In real philosophy, an infallible theory isn't scored zero; it's just considered trivial or false.
  *   **Your Move:** Explain that the score is a proxy for "Explanatory Power." A theory that explains everything explains nothing.

  ---

  ## 7. Why This Design? (Commitments)

  1.  **Adversarial Round is Scored:** I chose to score the attack/defense rather than make it rhetorical. MA students need stakes to engage. Without points, the defense becomes a polite discussion. With points, they will hunt for logical contradictions, which mirrors peer review.
  2.  **Master Key Exists:** I committed to a Realist Key. If I leave the answer open during scoring, the Infallibility Penalty cannot be calculated. The tension between their intuition and the Key *is* the lesson for Team 3.
  3.  **Logs Expose Consequences:** The logs include "Gain/Lose Charge." A pure causal theory ignores consequences. By including consequences, I bias the students toward a Functional/Teleological view before they even know the words. This is a pedagogical cheat, but necessary to get them to the "Proper Function" concept in 100 minutes.
  4.  **Team 3's Regime Change:** I placed the regime change in Team 3 specifically to break the link between "Current Utility" and "Content." This is the hardest concept in the unit. Giving it to one team allows the other two to act as controls during the debrief.
