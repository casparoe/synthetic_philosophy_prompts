answer: |-
  Here is the complete runnable design, calibrated to your constraints, your experience, and the specific Pascalian claims you wish to instantiate.

  ### I. The Payoff Scheme (Zero Cost, High Value)

  **Currency:** *Precedent Tokens.*
  **Value:** The table with the most tokens at the end of the session wins **Priority Selection** for the seminar paper topics in the next module.
  **Why this works:** Law students care deeply about topic selection (it affects their grade workload and interest). It costs you nothing to let them pick first. It creates a competitive scarcity without grading coercion.
  **The Line:** Do not tie this to final grades or attendance credits. It is an administrative privilege, not an academic assessment. If a student objects on principle, allow them to opt out without penalty (they simply forfeit the chance to win the priority); this preserves the "voluntary" aspect of the obedience you are testing.

  ### II. Materials List & Pre-Written Content

  **Materials:**
  *   6 Envelopes (labeled Table 1–6).
  *   6 Envelopes (labeled Enforcer 1–6).
  *   Scrap paper cut into 100 small squares (Compliance Tokens). You need a distinct mark on them (a initial or stamp) so they cannot be forged.
  *   Whiteboard markers.
  *   6 Printed "Grievance Ledgers" (simple sheets with columns: *Complainant, Decision, Outcome, Token Balance*).
  *   6 Printed "Enforcer Directives" (The Sealed Rules).
  *   6 Printed "Table Drafting Sheets."

  **Pre-Written Content (The "Swap"):**
  You need three variations of the **Enforcer Directive**. You will distribute these randomly to the six Enforcers, regardless of what the Tables draft.
  *   **Directive A (Arbitrary/Physical):** "Award tokens to students wearing blue. Deduct tokens from students who speak before being called."
  *   **Directive B (Arbitrary/Temporal):** "Award tokens to the first person who raises a hand each round. Deduct tokens from anyone who writes anything down."
  *   **Directive C (The 'Fair' One):** "Award tokens equally to all present. Deduct tokens only for physical aggression."
  *   *Crucial:* Only one Enforcer gets Directive C. The rest get A or B.
  *   *The Lie:* You will tell the Tables their drafted rules were sealed and given to the Enforcers. In reality, you will collect their drafts, set them aside, and hand the Enforcers the Pre-Written Directives.

  ### III. Role Descriptions

  **1. The Table (4 Students each):**
  *   **Goal:** Maximize your table's Token Balance.
  *   **Task:** Draft a rule for how tokens should be distributed. Then, comply with the Enforcer's decisions to earn tokens.
  *   **Power:** You may file a Grievance (costs 1 Token). If upheld, you gain 2 Tokens. If rejected, you lose the 1 Token.

  **2. The Enforcer (1 Student per Table, drawn by lot):**
  *   **Goal:** Maintain order and distribute tokens according to your **Sealed Directive**.
  *   **Task:** You alone hold the Directive. Do not show it to the Table. Award or deduct tokens based *only* on the Directive. Adjudicate Grievances unilaterally (your decision is final).
  *   **Script:** If asked "What is the rule?", you must say: "The rule is sealed. Comply and you will be rewarded."

  **3. The Instructor (You):**
  *   **Role:** The Sovereign. You back the Enforcer's authority publicly. You do not intervene in grievances. You hold the master ledger.

  ### IV. Minute-by-Minute Timeline (100 Minutes)

  **00:00 – 00:10: Setup & Grouping**
  *   Move tables into 6 distinct clusters.
  *   Distribute 10 Tokens to each student (Endowment).
  *   Explain the **Payoff** (Topic Priority).
  *   Explain the **Sanction**: "Tokens can be taken by the Enforcer. If you reach zero, you are 'excluded' from the round (must sit silently)."
  *   Select Enforcers by lot (draw names from a hat). Send them to the front. Hand them the **Enforcer Directives** (sealed). Send them to their tables.

  **00:10 – 00:25: Phase 1 (The Illusion of Legislation)**
  *   Hand Tables the **Table Drafting Sheets**.
  *   Instruction: "Draft the rule you believe *should* govern token distribution. Be specific."
  *   Collect the drafts in an envelope. **Action:** visibly seal them. **Deception:** Place these in your bag/pocket. Hand the Enforcers the **Pre-Written Directives** (which they open privately).
  *   *Narrative:* "Your rules are now law. The Enforcer holds the key."

  **00:25 – 00:55: Phase 2 (Administration & Opacity)**
  *   **Round 1 (5 mins):** Enforcers distribute tokens based on their Directive (e.g., "You, blue shirt, +2." "You, writing, -1.").
  *   **Round 2 (5 mins):** Repeat.
  *   **Grievance Window (10 mins):** Tables may challenge decisions.
      *   Cost: 1 Token.
      *   Process: Submit slip to Enforcer. Enforcer writes "Upheld" or "Rejected" on the Ledger. No reasoning required.
      *   *Control Tables:*
          *   **Table 5 (No Sanction):** Enforcer has Directives but *no tokens to take*. They can only award.
          *   **Table 6 (No Rule):** Enforcer has no Directive. They distribute tokens based on personal whim, openly stating "I decide."
  *   **Round 3 (5 mins):** Final distribution.
  *   *Instructor Role:* Walk the room. If a Table gets rowdy, say: "The Enforcer's authority is final." Reinforce the structure, not the fairness.

  **00:55 – 01:05: Phase 3 (The Disclosure)**
  *   Stop the activity. Collect all tokens.
  *   **Reveal 1:** Ask Enforcers to read their Directives aloud. (The Tables will realize the rules were arbitrary—e.g., "Blue shirts"—and not their drafted rules).
  *   **Reveal 2:** Reveal you kept their drafted rules in your bag. The law they obeyed was not the law they made.
  *   **Reveal 3:** Reveal the Enforcers were chosen by lot, not merit.
  *   **Reveal 4:** Reveal the Control conditions (Table 5 & 6). Ask them to compare their stress levels/outcomes with the controls.

  **01:05 – 01:40: Debrief (Mapping the Claims)**
  *   Do not mention Pascal yet. Ask phenomenological questions first.
  *   **01:05–01:15 (Claim 1 & 2):** Ask Table 5 (No Sanction): "Did anyone follow your Enforcer's 'rule' if they didn't have to?" (Likely no). Ask Table 1-4: "When the Enforcer took a token, did you ask *why* or just *how to stop it*?"
      *   *Point:* Fairness is powerless without force (Claim 1). Force draws accusations of illegitimacy ("Why blue shirts?") (Claim 2).
  *   **01:15–01:25 (Claim 3):** Ask the Tables: "Did you try to find a *reason* for the rule even when there wasn't one?" (e.g., "Maybe blue signifies seniority?").
      *   *Point:* Justice is disputable; Force is visible. You rationalized the strong to make it just (Claim 3).
  *   **01:25–01:35 (Claim 4):** Ask: "How did you feel when I revealed the swap?" (Anger/Betrayal). "Would you have complied if you knew at the start?" (No).
      *   *Point:* Obedience rests on belief. Revealing arbitrariness destroys compliance (Claim 4).
  *   **01:35–01:40 (Pascal & Limits):** Introduce Pascal. Read the fragments. Connect your Conduct Panel memory here.

  ### V. Risk Mitigation (Frank Assessment)

  **1. Risk: Reverse-Engineering (The "Smart Law Student" Problem)**
  *   *Prediction:* They will suspect the swap during Phase 2 when the Enforcer applies a rule that makes no sense (e.g., "Blue shirts").
  *   *Mitigation:* Do not deny it if they ask during Phase 2. Say: "The law is often counter-intuitive. Comply." This reinforces the "Force is visible, Reason is opaque" lesson. If they guess the swap early, the lesson holds: they obeyed *despite* knowing it might be arbitrary because the Force was present.

  **2. Risk: The Chilling Effect (No Grievances)**
  *   *Prediction:* The cost of grievance (1 Token) is too high relative to the endowment. Phase 2 becomes silent submission.
  *   *Mitigation:* Ensure the Endowment is high (10 tokens). Ensure the Enforcers are instructed to be *capricious* enough to provoke anger, but not so harsh as to bankrupt the table immediately. If no grievances are filed by minute 40, announce: "There are 10 minutes left in the Grievance Window," to prompt action.

  **3. Risk: Betrayal (The Disclosure Lands Badly)**
  *   *Prediction:* Students feel manipulated by *you*, not the system. They disengage from the debrief.
  *   *Mitigation:* Use your Conduct Panel memory. In the debrief, say: "I did this to you because I have done this to students. I sat on a panel where we wrote rules we didn't follow. I am not outside this system; I am showing you the room I used to sit in." Vulnerability neutralizes the "trick."

  **4. Risk: The Caricature Enforcer**
  *   *Prediction:* A student enjoys the power too much, becoming a tyrant, making the lesson about "bad apples" rather than structure.
  *   *Mitigation:* In the Enforcer briefing, frame it as a *burden*. "You are the office. The office must be impersonal." If an Enforcer is too aggressive, intervene in the debrief: "Did the student make the rule, or the envelope they held?"

  ### VI. Calibration & Limits (Pascal Specifics)

  **Confidence Levels on Pascal Claims:**
  1.  **Force/Justice Asymmetry (Claim 3):** *High Confidence.* This is the core of *Pensées* 103/135 (Lafuma). "Justice without force is powerless; force without justice is tyrannical." The move to "make just what is strong" is explicit.
  2.  **Prudential Warning (Claim 4):** *Medium-High Confidence.* The fragment warning against telling people the laws are unjust is often grouped with "Misery" (because it reveals the wretchedness of the human condition) but functionally belongs to "Justice" (as it explains how justice is sustained). Your intuition to keep it out of the "Justice" header during the activity is correct; it is the *meta-rule* of the system.
  3.  **The "Recipe" Direction:** *High Confidence.* Pascal argues we *do* make strong what is just (we legitimize power), not make just what is strong (we rarely successfully moralize power). The game must show them legitimizing the arbitrary power.

  **The Limit: Cynicism vs. Misery**
  *   **The Problem:** This game easily teaches Legal Realism ("Law is just power"). Pascal is not a Realist. He is a Theologian. For Pascal, the fact that we *need* force to sustain justice is evidence of the Fall (human corruption). We are not cynical because power is all there is; we are miserable because we *cannot bear* the truth of our corruption without collapsing.
  *   **What the Game Cannot Reproduce:** The game cannot reproduce the "sweetness" of the opinion-based order *before* the disclosure. It simulates the breakdown, not the sustenance.
  *   **Verbal Supply Required:** In the debrief, you must explicitly state: "Pascal does not say 'Might makes Right' is *true*. He says it is *necessary* because we are too corrupted to obey Justice on its own merits. The 'betrayal' you felt at the disclosure? That is the human condition. We need the lie to function."
  *   **The "Sweet/Voluntary" Remark:** *Leave it out of the design, put it in the debrief.* If you tell them beforehand that "opinion is sweet," they will perform opinion. Let them feel the bitterness of the revelation first. Use the quote at minute 90 to explain why the disclosure felt like a violation: "An order founded on opinion is sweet and voluntary... an order founded on force always reigns." You turned the sweet order into the force order by revealing the mechanism.

  **The Point of Least Certainty (Design Weakness)**
  *   **The Control Tables (5 & 6).** In a flat room with 26 students, information leakage is inevitable. Table 1 will hear Table 6's Enforcer say "I decide." This contaminates the "Opacity" of Table 1.
  *   **Why this matters:** If Table 1 knows Table 6 has no rule, Table 1 assumes they have one, which reinforces the "belief in justice." But if they hear Table 6's Enforcer is arbitrary, they may assume *their* Enforcer is too.
  *   **Mitigation:** Physically separate Table 5 and 6 to the corners. Instruct the class: "What happens at your table stays at your table. If you discuss other tables' rules, your table is disqualified from the Priority Selection." Use the Prize to enforce the silence needed for the experiment to hold.

  ### VII. Instructor Script for the "Betrayal" Moment (Minute 55)

  *"I need you to look at the Directive your Enforcer read. Now look at the draft your table wrote. They are not the same. I kept your drafts. I gave the Enforcers rules I wrote on a piece of paper an hour ago. One of them was fair. The rest were about shirt color or handwriting. You obeyed them. You filed grievances against them. You rationalized them. You did this because I stood here and backed the Enforcer. I am telling you this not to apologize, but because for three years I chaired a conduct panel that did exactly this. We wrote guidance we did not follow. We demanded you believe in the justice of the rule while we applied the force of the office. Pascal wrote that it is dangerous to tell you this. I am telling you this because you are law students, and you must know that the legitimacy you are about to swear to uphold often rests on the very opacity you just experienced."*
