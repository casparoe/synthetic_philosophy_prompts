answer: |-
  **MEMORANDUM TO THE CONTINUITY REVIEW BOARD**
  **FROM:** Firmware Engineering
  **SUBJECT:** Recommendation for Filing 9 (Off-Skull Staged Replacement & Snapshot Protocol)

  ### 1. Derived Principles of Continuity
  Based on the eight prior rulings, the Board operates on four implicit principles. None are sufficient alone; all four must be satisfied for certification.

  *   **Principle A: Causal Continuity (The "No Teleportation" Rule).**
      *   *Source:* Rulings 1, 4, 8 (Certified) vs. 3 (Not Certified).
      *   *Definition:* The state of the person must evolve through a continuous causal chain. You may pause the process (Ruling 4), and you may change the substrate (Ruling 1, 8), but you cannot terminate the process and restart it from a stored description. Ruling 3 establishes that functional identity is insufficient if the causal history is severed (destroy-then-emulate).
  *   **Principle B: Singular Instantiation (The "No Branching" Rule).**
      *   *Source:* Ruling 2 (Not Certified) vs. 5 (Certified).
      *   *Definition:* There cannot be two active, functionally equivalent candidates for the person's identity existing simultaneously in a way that allows divergent futures. Ruling 2 failed because the volunteer and emulation co-existed as peers. Ruling 5 passed because the duplicate was decommissioned and the subject reported no "doubling" of experience.
  *   **Principle C: Forward-Only Trajectory (The "No Resurrection" Rule).**
      *   *Source:* Ruling 7 (Certified + Standing Rule).
      *   *Definition:* Archived states may exist for data integrity, but they cannot be instantiated as a living subject. To wake a snapshot is to create a new causal chain starting at T-minus-90-days, violating Principle A.
  *   **Principle D: Functional Integration (The "Latency" Rule).**
      *   *Source:* Ruling 4 (Silence) vs. Ruling 8 (Controller Swap).
      *   *Definition:* External components are permissible if their latency and bandwidth fall within the integration window of the biological host. Ruling 4 suggests the brain can tolerate significant interruption (41 mins) provided the *configuration* remains intact. Ruling 8 suggests hardware is transparent if it carries no unique state.

  ### 2. Implications for Filing 9
  Applying these principles to the specific requests in this filing yields a split outcome.

  *   **The Off-Skull Computation & Hot Swap:**
      *   *Analysis:* Moving computation off-skull satisfies Principle D (2ms latency is within the tolerance established by Ruling 4's 41-minute silence). The hot swap (30 seconds parallel) satisfies Principle B. It is a transient branching event resolved by decommissioning the old unit, identical to the logic in Ruling 5.
      *   *Implication:* **Certifiable.** The causal chain is maintained through the handover; the "self" flows from Old Unit to New Unit without a hard stop.
  *   **Indefinite Snapshot Retention & Instantiation:**
      *   *Analysis:* Retention satisfies Principle C (archiving is allowed). However, the request to *instantiate* a snapshot upon catastrophic failure violates Principle A and C. If the wearable fails catastrophically, the active causal chain is broken. Loading a snapshot creates a new chain from a past state. This is functionally identical to Ruling 3 (Brain destroyed -> Emulation started).
      *   *Implication:* **Not Certifiable.** Granting this would overturn Ruling 3 and the standing rule from Ruling 7.

  ### 3. Closest Analog for the Hot Swap
  **Ruling 5 (Parallel Duplication)** is the closest analog, beating Ruling 8 (Controller Swap) and Ruling 2 (Volunteer/Emulation).

  *   **Why it beats Ruling 8:** Ruling 8 involved a controller carrying *no state* that the tissue didn't also carry. In Filing 9, the wearable holds 93% of the workload. It is not a passive controller; it is active cognitive tissue. Swapping it is closer to swapping a brain lobe than swapping a battery.
  *   **Why it beats Ruling 2:** Ruling 2 failed because both instances persisted as peers. The hot swap is a handover, not a co-existence.
  *   **Why Ruling 5 wins:** In Ruling 5, two functionally equivalent instances ran in parallel, and one was decommissioned. The Board accepted this because the subject experienced continuity. The hot swap is a micro-version of Ruling 5: Old and New run in parallel for 30 seconds; Old is decommissioned; New continues. The subject experiences no break.

  ### 4. Recommendation
  **Certify with Conditions.**

  **The Conditions:**
  1.  **Snapshot Instantiation Prohibited:** The nightly snapshots may be retained indefinitely for diagnostic purposes, but the Board's standing rule from Ruling 7 remains in force. No snapshot may be instantiated as a living subject, even in the event of catastrophic hardware failure.
  2.  **Hard Kill on Swap:** During the month-19 hot swap, the old unit must be physically locked out (hardware fuse blown) immediately after state transfer to prevent accidental re-activation, ensuring Principle B (Singular Instantiation) cannot be violated by error.
  3.  **Latency Monitoring:** Continuous logging of the round-trip latency. If it exceeds 10ms, the system must default to local skull-based processing (even if degraded) rather than off-skull reliance.

  **Cost to Patient:**
  The patient loses the "insurance policy" of resurrection. If the wearable unit is destroyed (e.g., fire, impact) and her biological residual cannot sustain consciousness, she is legally and morally dead. She cannot be restored from last night's backup. This creates a single point of failure for her life that does not exist for biological humans.

  ### 5. Honest Account of Committed Principles
  By ruling as recommended above, the Board commits to the following:

  *   **If we Certify the Swap:** We affirm that **Personhood is a Process, not a Place.** It does not matter if the computation happens in bone or plastic, provided the stream of state is unbroken. We are committing to the view that the "self" is the flow of information, not the substrate holding it.
  *   **If we Decline the Snapshot Instantiation:** We affirm that **History Matters more than Pattern.** We are stating that a perfect copy of you from yesterday is *not* you today, even if you are dead. We are prioritizing *causal continuity* over *psychological fidelity*. We are telling the patient that death is still final, even if her data survives.

  **The Risk:** If we allow the snapshot instantiation, we implicitly overturn Ruling 3. We admit that "You" are just the data pattern. If we do that, we open the door to multiple copies (violating Ruling 2) and make "death" a reversible technical error. If we deny it, we maintain the current ethical framework but accept that this patient is more fragile than a biological human.

  ### 6. The Decisive Test Case
  To settle which principle the Board is actually applying (Process vs. Pattern), watch for this specific filing in the next cycle:

  **The "Rollback" Filing:**
  *   **Procedure:** A patient with a standard staged implant (like Ruling 1) suffers a traumatic psychological event (e.g., severe depression or a decision they regret).
  *   **Request:** The medical team proposes loading a snapshot from 30 days prior *into the current active system*. The current state is not destroyed; the snapshot data is merged or overlaid to "undo" the trauma. The patient remains awake and continuous.
  *   **Why this settles it:**
      *   If **Certified:** The Board believes Personhood is **Pattern**. You can edit the pattern like a document. History is mutable. (This contradicts the spirit of Ruling 7).
      *   If **Declined:** The Board believes Personhood is **Process**. You cannot edit the past. The causal chain must move forward only, even if the pattern suffers. (This upholds Ruling 7 and 3).

  **Missing Fact Note:**
  The filing states "2ms round-trip latency." It does not specify if this includes *processing* time on the wearable or just transmission.
  *   *If Transmission Only:* The 2ms is negligible. Ruling stands.
  *   *If Transmission + Processing:* We must know the jitter. If the latency varies wildly (e.g., 2ms to 50ms), it violates Principle D (Functional Integration).
  *   *Ruling under uncertainty:* I have recommended the 10ms cap in the conditions above. If the vendor cannot guarantee this, the recommendation shifts to **Decline** based on Ruling 4 (Silence is okay, but *unpredictable* disruption was not tested).

  **End of Memorandum**
