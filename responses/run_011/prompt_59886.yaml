answer: |-
  Dear Chair and Colleagues,

  This memo serves to analyze the consistency of the committee's potential decision regarding the recent claim for the cast-metal royal figure, palace doors, and associated smaller pieces against the established record of our prior determinations. As the analysis must remain strictly within the bounds of the institutional record to ensure impartiality, the following assessment draws solely from the five precedents set by the committee since its inception. The objective is to identify the operative rules embedded in those verdicts, locate the closest analog for the current claim, and articulate the principle that any decision here will cement for future adjudications.

  A review of the five prior cases reveals four candidate rules that guide our determinations: the illicit nature of removal, the existence of living cultural practice, the legal validity of title at acquisition, and the conservation capacity of the claimant. These rules are not independent but operate in a discernible hierarchy. The case of the funerary urns establishes that illicit removal by military expedition outweighs concerns regarding conservation capacity, as the objects were returned despite the claimant's lack of adequate storage. Conversely, the case of the ceremonial textiles demonstrates that conservation capacity can outweigh claims based on cultural affiliation when the acquisition was not clearly illicit, as those items were retained due to survival risks. The masks case indicates that living practice can override legal title at acquisition, as those items were returned despite lawful export documentation. Finally, the mixed claim case establishes that provenance dictates the fate of individual objects within a collection, rejecting the indivisibility argument when some items were taken by force and others acquired legally. When synthesized, the record suggests a hierarchy where illicit removal is the primary driver for restitution, followed by living practice, with conservation capacity acting as a veto only when the removal was not clearly violent, and legal title serving as the weakest defense against ethical claims.

  Applying these rules to the new claim requires separating the objects based on the precedent of the mixed claim. The thirty smaller pieces acquired from a dealer in the 1950s possess impeccable provenance and no connection to the punitive expedition. Consistent with the mixed claim precedent, these items should be retained, as their legal title is unblemished and no ethical taint attaches to their acquisition. The cast-metal royal figure and palace doors, however, were taken during a punitive expedition without a treaty, and the colonial authorization has been repudiated by the successor state. This aligns them with the funerary urns and the raid pieces from the mixed claim, categorizing them as illicitly removed. The claimants present a joint front of the reigning royal house and the national museum. While the royal ceremonies lapsed two generations ago, weakening the living practice argument relative to the masks case, the national museum's involvement mirrors the urns case. Furthermore, the opening of a climate-controlled gallery resolves the conservation objection that led to the retention of the textiles. Consequently, the conservation rule does not block restitution here, and the lapsed practice does not negate the claim given the national museum's participation, which the urns precedent validates.

  The closest analog in the record is the case of the funerary urns. Both cases involve objects carried off by military or punitive action in the late nineteenth century, both involve claims lodged by a national museum rather than solely by a descendant community, and both involve circumstances where the original removal lacked treaty backing. The urns case is doing double duty in this analysis, serving as the authority for both the primacy of illicit removal over conservation concerns and the validity of national museum claimants in the absence of active descendant communities. The only material distinction is that the claimant in the urns case had poor storage while the current claimant has excellent facilities. This distinction strengthens the case for return rather than weakening it, as it removes the single condition that might have allowed for retention under the textiles precedent. Therefore, a decision to return the figure and doors while retaining the dealer pieces coheres best with the existing verdicts.

  Whichever way the committee decides, it will commit to a specific principle regarding the relationship between historical injustice and institutional stewardship. If the committee votes to return the expedition pieces, it affirms the principle that violent dispossession creates a permanent liability that survives changes in administration and lapses in cultural practice, provided basic stewardship can be assured. This prioritizes restorative justice over the stability of current holdings. If the committee votes to retain the pieces, it commits to the principle that the passage of time, the repudiation of prior authorizations, and the lapse of specific ceremonies can extinguish claims based on illicit removal, effectively prioritizing the security of current possession and the continuity of the collection over historical rectification. Given the urns precedent, retention would require distinguishing the current repudiation of colonial authority as less valid than the military context of the urns, a difficult distinction to sustain without undermining the earlier verdict.

  The principle actually held by the committee will be most clearly exposed by a future claim involving an illicitly removed object where the claimant is a living community but lacks adequate conservation capacity. The urns case returned objects to a museum with poor storage, while the textiles case retained objects from a community with poor storage. The differentiating factor was the illicit nature of the removal. A future claim that combines illicit removal, a living community, and poor conservation capacity would force the committee to choose between the urns precedent, which favors return regardless of storage, and the textiles precedent, which favors retention to ensure survival. If the committee returns such objects, it confirms that illicit removal is the absolute trump card. If it retains them, it reveals that conservation capacity is the true supreme value, and that the urns were returned only because they were durable enough to survive despite the lack of facilities. Until such a case arises, the current record suggests that the manner of removal remains the decisive factor.

  I trust this analysis provides the necessary framework for the committee's deliberation.

  Sincerely,

  External Panel Member
