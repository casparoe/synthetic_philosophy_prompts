          *   Classification: Hard Vetoes, Flags, Judgment Calls.
          *   Escalation: One-sentence stakeholder statement if undecided.
          *   Application: Run on three specific cases (Housing Report, Digital Tech Piece, Remote Work Finding).
          *   Outcome Expectation: Case 1 (Housing) should fail.
          *   Closing: Limitations of the procedure (false negatives) + 3-sentence disclosure note.
