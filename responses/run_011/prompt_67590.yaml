      *   *Critique:* Is the "Boundary Test" doable without raw data?
      *   *Fix:* Require the author to provide the sensitivity check or justify why it wasn't done. The reviewer checks the *presence* of the justification.
      *   *Critique:* Ensure I explicitly state agreement/disagreement with the user's hypothesis.
      *   *Fix:* I agree with the hypothesis. I will state that clearly in the intro.

  9.  **Final Polish:** Check the flow. Ensure the three cases are distinct and the verdicts align with the procedure. Make sure the disclosure note is exactly three sentences or fewer. (Wait, prompt says "no more than three sentences").

      *Let's double check the Case 1 logic.*
      User wants Case 1 to come out badly.
