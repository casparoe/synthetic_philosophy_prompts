answer: |-
  I agree with your hypothesis. Treating cohorts as indexical descriptors is methodologically safe; treating them as diagnostic proxies is the source of most analytical drift; and treating them as explanatory causes is rarely defensible without longitudinal data or specific historical mechanisms. The "APC identification problem" (Age-Period-Cohort) makes explanatory claims from cross-sectional data statistically incoherent. Your intuition that the second category is where the errors hide is correct: authors often mean "indexical" but write "explanatory," smuggling in causal assumptions without the burden of proof.

  Below is the **Cohort Claim Audit**. It is designed for a reviewer with editorial competence but no demographic training.

  ### The Cohort Claim Audit

  **Time Limit:** 45 Minutes
  **Reviewer Instruction:** Do not attempt to verify the data. Verify the *logic* and the *warrant* for the language used.

  #### Step 1: Classification (5 Minutes)
  Locate every instance where a generational label (e.g., "Millennial," "Gen Z," "Boomer") or a birth-year range is used to make a claim about behavior, attitude, or outcome. Classify the claim into one of three types:
  *   **Indexical:** The label is purely a shorthand for a birth range (e.g., "Respondents born 1981–1996").
  *   **Diagnostic:** The label acts as a proxy for an unmeasured variable (e.g., "Millennials are more anxious," implying birth era predicts anxiety).
  *   **Explanatory:** The label is the cause (e.g., "Being a Millennial causes risk aversion due to the 2008 crash").

  **Pass Condition:** All claims are explicitly categorized by the author in the methods or footnotes.
  **Status:** **Flag.** If the author cannot classify their own claim, the draft returns to them for clarification before proceeding.

  #### Step 2: The APC Restatement (10 Minutes)
  For any **Diagnostic** or **Explanatory** claim, require the author to restate the finding in terms of Age, Period, and Cohort.
  *   *Age Effect:* Is this simply about being young/old?
  *   *Period Effect:* Is this about the current year affecting everyone?
  *   *Cohort Effect:* Is this about a specific birth group carrying a unique history?

  **The Test:** Ask the author: "Does your data allow you to separate Age from Cohort?" (Hint: A single year of survey data comparing age groups *cannot* separate Age from Cohort).
  **Pass Condition:** If the data is cross-sectional (one point in time), Explanatory claims are prohibited. Diagnostic claims must include a disclaimer that age and cohort are confounded.
  **Status:** **Hard Veto.** If the draft asserts an Explanatory cohort claim using only cross-sectional data, the claim must be downgraded to Indexical or removed.

  #### Step 3: The Boundary Test (10 Minutes)
  Examine the birth-year range defining the cohort.
  *   *The Test:* Ask the author: "If we shift the cutoff by two years (e.g., 1980–1995 instead of 1981–1996), does the finding hold?"
  *   *Evidence:* The author must provide a sensitivity check or a theoretical justification for the specific cutoff.

  **Pass Condition:** The finding remains statistically significant or theoretically sound with adjacent birth bands.
  **Status:** **Flag.** If the finding disappears when the boundary moves, the "generation" is an artifact of arbitrary binning. The text must be revised to reflect a gradient, not a category.

  #### Step 4: Mechanism and Exposure (10 Minutes)
  For any **Explanatory** claim, the author must name the formative event.
  *   *Requirement:* Identify the specific event, the age window of exposure (e.g., "ages 18–25"), and the pathway to the disposition.
  *   *The Gradient Check:* Did people born one year outside the range experience the same event at the same age? If yes, the label is misdescribing a gradient.

  **Pass Condition:** A specific mechanism is named, and the exposure is unique to the defined cohort.
  **Status:** **Hard Veto.** If the mechanism (e.g., "the Internet") applies to people outside the birth range, or if the pathway is unspecified, the Explanatory claim is vetoed.

  #### Step 5: Within-Cohort Differentiation (10 Minutes)
  Check for internal variance.
  *   *The Test:* Does the report acknowledge that the cohort contains opposing subgroups (e.g., by class, race, region)?
  *   *Requirement:* The text must not imply homogeneity.

  **Pass Condition:** The text qualifies the finding (e.g., "Among college-educated Millennials...") or acknowledges high internal variance.
  **Status:** **Judgment Call.** If the report treats the cohort as a monolith, the reviewer flags it for nuance. If the variance is ignored to make a policy point, escalate to the Director.

  #### Escalation Protocol
  If a draft passes the Vetoes but fails multiple Flags, or if the APC distinction is ambiguous despite author clarification, hand the question to the Director with this statement:
  *"The draft relies on a cohort effect that is statistically indistinguishable from an age effect, and publishing it risks the institute's reputation for methodological rigor."*

  ***

  ### Application to Cases

  #### Case 1: Flagship Annual Housing Report
  *Claim:* A generation's blocked access to home ownership has produced a lasting change in its attitudes toward saving and risk.
  *Data:* One year of survey data comparing age groups.

  **Audit Results:**
  *   **Step 1 (Classification):** Explanatory. It asserts a causal link between generation and "lasting change."
  *   **Step 2 (APC Restatement):** **FAIL (Hard Veto).** A single year of survey data compares 25-year-olds to 55-year-olds. It is mathematically impossible to distinguish whether the 25-year-olds save less because they are *young* (Age) or because they are *Millennials* (Cohort). To claim a "lasting change," you need longitudinal data tracking the same people over time, or multiple cross-sections over decades.
  *   **Step 4 (Mechanism):** While "blocked access" is a mechanism, the data does not prove this exposure created a *durable* disposition rather than a temporary lifecycle constraint.

  **Verdict:** **Reject Explanatory Claim.** The headline must be rewritten. The finding can be reported as an *Indexical* observation ("Respondents born 1981–1996 report lower savings") but cannot assert a generational disposition. The draft implies a permanent psychological shift that the data cannot support. This report comes out badly because it violates the fundamental identification problem of demographic analysis.

  #### Case 2: Client-Commissioned Piece on "Digital Natives"
  *Claim:* A newly coined label for the youngest cohort; content is that members grew up with pervasive digital technology.
  *Data:* Not specified, likely mixed.

  **Audit Results:**
  *   **Step 1 (Classification):** Diagnostic/Explanatory hybrid. It implies technology exposure defines the group's nature.
  *   **Step 4 (Mechanism/Exposure):** **FLAG.** "Pervasive digital technology" is a Period effect, not a Cohort effect. Technology permeates society; older cohorts adopt it too, just later. The exposure is not unique to the birth band.
  *   **Step 3 (Boundary):** Arbitrary. When does "pervasive" start? 2005? 2008?

  **Verdict:** **Downgrade to Indexical.** The label may be used if defined strictly as a birth range (e.g., "Post-2010 births"). Any claim that this group possesses a unique cognitive disposition due to tech must be removed unless the authors provide comparative data showing older cohorts *never* developed similar dispositions when exposed to new tech (e.g., TV, radio). The claim is currently a stereotype disguised as demography.

  #### Case 3: Internal Finding on Remote Work
  *Claim:* Workers under thirty differ sharply from everyone else on remote-work preference.
  *Data:* Tabulation shows the under-thirty group splits cleanly along whether the respondent entered the labor market before or after pandemic shutdowns.

  **Audit Results:**
  *   **Step 1 (Classification):** Diagnostic. It uses age ("under thirty") as a proxy for experience.
  *   **Step 4 (Mechanism):** **PASS (with revision).** The mechanism is identified: labor market entry timing relative to the pandemic.
  *   **Step 2 (APC):** The data reveals this is not a birth cohort effect, but a "career cohort" effect. A 29-year-old who entered pre-pandemic behaves like a 40-year-old; a 29-year-old who entered post-pandemic behaves like a 22-year-old.

  **Verdict:** **Pass with Rewording.** The finding is valid, but the label "workers under thirty" is incorrect. The report must label this a "Pandemic Entry Cohort" rather than a generation. The variation is not driven by birth year, but by professional socialization timing. This is a rare case where a cohort-like effect is real, but the generational label is the wrong variable.

  ***

  ### Limitations of the Procedure

  This procedure prioritizes rigor over discovery, meaning it will generate false negatives. True cohort effects exist—historical events do imprint on specific age groups—but this audit will frequently forbid claims that are in fact true because the data required to prove them (longitudinal tracking over decades) is rarely available in policy work. It will also struggle with "slow-rolling" mechanisms where the exposure is diffuse (e.g., climate change) rather than event-based. You should expect to veto roughly 60% of explanatory generational claims; some of those vetoes will suppress genuine insights simply because the evidence is currently beyond reach.

  ### Standing Disclosure Note

  This report uses generational labels as shorthand for birth cohorts, not as evidence of inherent psychological differences. Where causal claims are made regarding cohort membership, they rely on author-provided mechanisms that have not been independently validated by longitudinal data. Readers should interpret generational findings as provisional associations subject to age and period confounds.
