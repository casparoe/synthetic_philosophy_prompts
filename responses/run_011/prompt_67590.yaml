  2.  **Deconstruct the Core Distinction & Hypothesis:**
      *   *Indexical:* "People born 1981-1996." (Descriptive).
      *   *Diagnostic:* "Millennials are anxious." (Proxy for economic conditions? Age? Technology?).
      *   *Explanatory:* "Being a Millennial *causes* anxiety because of 9/11/2008." (Causal mechanism).
      *   *Agreement:* I agree with the user's hypothesis. Treating cohorts as essentialist kinds is sociologically dubious and statistically fraught (APC identification problem). Explanatory claims require high bars.

  3.  **Drafting the Decision Procedure (The "Cohort Claim Audit"):**
      *   *Structure:* Needs to be linear, logical, and actionable for a non-expert.
      *   *Step 1: Classification.* Define the claim type.
      *   *Step 2: APC Identification.* The statistical reality check.
      *   *Step 3: Boundary/Bandwidth.* Testing the arbitrary lines.
      *   *Step 4: Mechanism/Exposure.* The causal story.
      *   *Step 5: Heterogeneity.* Internal variation.
      *   *Decision Logic:* Vetoes vs. Flags.

      *Refining the Steps:*
      *   *APC Step:* Crucial. If cross-sectional data claims cohort effects without longitudinal data or strong assumptions, it's a methodological error.
      *   *Boundary Step:* If shifting the birth year by 2 changes the result, the "generation" is arbitrary.
      *   *Mechanism Step:* Needs specific event + age window. "The Internet" is too vague. "Internet at age 14" is better.
      *   *Gradient Step:* Did the people born one year before/after experience the same thing?
      *   *Differentiation Step:* Is the variance within the group larger than between groups?

  4.  **Developing the Three Cases:**

      *   *Case 1: Housing Report (Flagship).*
          *   Claim: Blocked ownership -> lasting attitude change (saving/risk).
          *   Data: One year of survey data (cross-sectional).
          *   Analysis: This is the APC confound. Is it age (young people don't buy), period (housing crisis now), or cohort (Millennials specifically)? With one year of data, you cannot separate Age and Cohort.
          *   Verdict: **Fail (Hard Veto).** The user wants this to fail. It's statistically indefensible to claim a *lasting* cohort effect from cross-sectional age differences without longitudinal data or strong controls.

      *   *Case 2: Digital Tech Piece (Commissioned).*
          *   Claim: New label (e.g., "Gen Alpha" or "Digital Natives"). Content: Grew up with pervasive tech.
          *   Analysis: This is likely Indexical or weakly Diagnostic. "Pervasive tech" is a period effect affecting everyone, but exposure varies by age.
          *   Verdict: **Flag/Revision.** Needs to be Indexical only. Cannot claim causal psychological changes without mechanism.

      *   *Case 3: Remote Work (Internal).*
          *   Claim: Under 30 differ on remote work.
          *   Data: Split by labor market entry (pre/post pandemic).
          *   Analysis: This actually identifies a *mechanism* (labor market entry timing) rather than a birth cohort. It's a "career cohort" not a "birth cohort."
          *   Verdict: **Pass (with rewording).** The finding is real, but the label "Generation" is wrong. It's a "Pandemic Entry Cohort."

  5.  **Refining the Procedure Constraints:**
      *   Make sure the "Hard Vetoes" are clear.
      *   Ensure the "One-Sentence Escalation" is included.
      *   Check the time limit (45 mins). The steps need to be quick checks, not new statistical analyses (though they might require asking authors for info).

  6.  **Addressing the Limitations & Disclosure:**
      *   *Limitations:* True cohort effects exist (e.g., Silent Generation and WWII). This procedure might flag them as "unproven" because the data isn't perfect. It prioritizes rigor over discovery. False negatives are expected.
      *   *Disclosure:* Needs to be punchy, honest, and limit liability.

  7.  **Review against User Constraints:**
      *   *No bibliography?* Check.
      *   *45-minute reviewer time?* Keep instructions concise.
      *   *Case 1 failure?* Ensure the APC test kills it.
      *   *Distinction (Indexical/Diagnostic/Explanatory)?* Embed this in Step 1.
      *   *Tone:* Professional, authoritative, administrative but intellectually rigorous.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the APC step too technical for a non-demographer reviewer?
