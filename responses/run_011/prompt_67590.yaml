      Problem: This is the classic Age-Cohort confound. If you survey 25-year-olds and 55-year-olds in 2024, the 25-year-olds haven't had time to develop "lasting" changes, and the difference might just be lifecycle (age). To claim a *cohort* effect (lasting disposition), you need longitudinal data or multiple cross-sections to separate Age from Cohort.
