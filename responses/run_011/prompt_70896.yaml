      *   *Pure Learning:* Future self has more data ($D$) and updates via Bayes. $P_{later}(H) = P_{now}(H | D)$. Here, Reflection holds. The future self is an expert because they have the data the current self lacks.
      *   *Sedative/Bias:* Future self has more data *but* processes it via a known distorted function.
      *   *The Difference:* It's about the *correlation* between the future credence and the truth, given current knowledge.
      *   In Pure Learning: $P_{later}$ correlates with Truth because of Data.
      *   In Bias Case: $P_{later}$ correlates with Truth + Noise (where Noise is correlated with the Coin Toss, not Truth).
      *   *Avoiding Circularity:* We don't assume future rationality. We assess the *reliability* of the future cognitive process based on current models of that process. Just as a physicist models detector efficiency, the epistemologist models cognitive reliability. If the model says "efficiency < 1" or "systematic error present," you don't treat the reading as truth.
