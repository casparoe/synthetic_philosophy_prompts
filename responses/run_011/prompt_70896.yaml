      *   *Connection:* Reflection is often derived as a consequence of Conditionalization + the assumption that you learn only the truth (or that your future credence summarizes your future evidence).
      *   *Dutch Book:* If you violate Reflection (and you believe your future self is rational), a bookie can bet against you now and against your future self later to guarantee a loss.
      *   *In the Assessor Case:* Can you be Dutch Booked?
          *   Bookie offers bet at $t_0$ based on 0.575. You refuse (you believe 0.5).
