      *   **Section 2: Evidence vs. Distortion (Addressing ii & iii).** Distinguish between *evidence* (data) and *processing* (likelihoods/priors). The bias affects the processing. The future self is not an expert on the *bias* because the current self already knows about it. The future self is "contaminated."
