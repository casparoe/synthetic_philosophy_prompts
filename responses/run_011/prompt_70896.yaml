      *   *Underlying Idea:* Reflection is a special case of deferring to an expert. The "expert" is your future self. The condition for expertise is that the future credence encapsulates all relevant evidence *without* introducing independent noise or bias known to the present self.

  7.  **Synthesize and Structure the Response:**
      *   **Tone:** Respectful, peer-to-peer (physicist to physicist), precise, avoiding jargon where possible or defining it clearly. Acknowledge the depth of the user's intuition (it *is* correct that 0.575 is wrong).
      *   **Introduction:** Validate the user's intuition. The "Assessor Case" is a classic counter-example to *unqualified* Reflection. The principle requires a "ceteris paribus" clause regarding rationality.
