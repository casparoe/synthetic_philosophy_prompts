  4.  **Address Question (ii): Distinguishing Evidence from Distortion:**
      *   Can Reflection tell the difference internally? No. Reflection is a normative constraint on the relationship between time-slices.
      *   If the current self *knows* the future self is compromised, the "Expertise" assumption is violated.
      *   The distinction must be imported. The principle is: "Defer to your future self *to the extent that* you regard them as rational and better informed."
      *   *Conceptual Machinery:* Information sets. Let $I_{now}$ be current information, $I_{later}$ be future information. Usually $I_{now} \subset I_{later}$. Here, the update rule $f: I_{later} \to Credence$ is known to be flawed ($f(I) = RationalUpdate(I) + Bias$).
      *   Since the current self knows the function $f$, they can "invert" the bias. They should not defer to the output of $f$; they should defer to what the output *would have been* without the bias.
