      *   *Physicist Analogy:* Think of a measurement apparatus. If you know the apparatus has a systematic offset depending on a hidden variable (coin toss), you don't treat the raw reading as the true value. You calibrate. Reflection assumes the apparatus (future mind) is calibrated.
