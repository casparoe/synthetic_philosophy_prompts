answer: |-
  Tobias Reuter tapped the proof sheet pinned to the corkboard, his finger hovering over the panel labeled *District Employment, 1932*. "Look at the negative finding here. You want to assert that no establishment in this district employed more than fifty people. Where is the 'not'? I see icons of workers, I see buildings, but I do not see a symbol for negation. And beside it, you have the unemployment rate. A rate is a ratio of two counts. It is a magnitude visible nowhere in this arrangement of ink. How does a picture assert a number that isn't there?"

  Marianne Vogl smoothed the edge of the paper, her eyes remaining on the chart. "You are looking for a logical operator where there is only a physical state. A legitimate scientific statement is ultimately about spatio-temporal arrangements of observable things. If a factory floor is empty, that emptiness is an arrangement just as much as a crowded room is. We depict the arrangement of the available labor force standing outside the gates. The 'rate' is not a ghostly entity; it is a transformation of the count of those outside versus those inside. The content of the statement is the sort of content a picture can carry because depicting just is presenting such arrangements. We do not need a word for 'not' when the visual field shows an absence where a presence was expected."

  "But the viewer needs to know that the absence is significant," Tobias countered, shifting his gaze to the second panel regarding machine regularities. "To read this absence as a negation rather than a mere gap, I need a rule. And to read the ratio, I need a transformation procedure. You claim your inventory of signs and their serial order functions as syntax. But those rules determining how the panels are to be read cannot themselves be laid out in pictures without already presupposing a way of reading them. You cannot picture the rule for picturing. So the system borrows its determinacy from a verbally stated host language. You are denying dependence while relying on it for the very key that unlocks the signs."

  Marianne turned to face him, her posture stiffening slightly. "I grant that the initial key requires instruction. But you are treating this as a failure rather than a feature of learning. No notation interprets itself; words are learned by practice too. However, I will narrow my claim. I am not arguing that this system can replace every function of verbal language, such as poetry or metaphysical speculation. I am arguing that for this encyclopedia layer—the record of common knowledge about observable states—these rules do the work that syntax does. The caption beneath the panel is a reading aid for the unpracticed, not the place where the content really lives. Once the practice is learned, the picture carries the assertion independently."

  "Independently is a strong word," Tobias said, softening his tone slightly. "I will concede that ordinary verbal usage is far more variable than your signs. If we demand perfect determinacy, I must indict a good deal of ordinary scientific prose as well, where terms shift meaning across contexts. My claim is narrower than that. I grant that the panels communicate, and quickly, and across languages. My claim is that this makes them an effective instrument and not a language. A language must mark the difference between asserting something and merely supposing it. What on this sheet says 'if'? What says 'every' rather than 'these'? Your icons show instances, but logic requires quantifiers. Without them, you cannot distinguish a general regularity from a list of examples."

  "Repetition of an identical sign carries number," Marianne replied, pointing to the row of machine icons on the second panel. "Ten icons mean ten machines. A shadowed icon means a broken one. The serial order carries the order of the matter described. On my account, these rules do the work that syntax does. To demand of pictures a transparency never demanded of sentences is a double standard. If a reader confuses 'every' with 'these', that is a failure of training, not of the notation. Our practical aim is to be readable across linguistic boundaries by people with no specialist training. That aim shapes what counts as a defect. If the user grasps the regularity without the word 'every', the communication has succeeded."

  "Grasping a regularity is not the same as encoding it," Tobias insisted, tracing the varying sizes of the icons on the employment panel. "Resemblance does no work here. What makes a sign stand for what it stands for is settled practice, not likeness. Once that is granted, your system is simply another conventional notation, which must then meet the ordinary requirements on a notation. Its characters must be reliably distinguishable and non-overlapping. Something shaded and pictorially continuous resists this. Look at your quantity encoding. Repeated identical signs handle small counts but collapse at large ones. Enlarging a sign's area invites the reader to track the wrong dimension—is this icon larger because there are more people, or because the building is bigger? You hide ratios behind aesthetics."

  "We control the transformation procedure," Marianne said, her voice rising slightly. "The area corresponds strictly to the count according to a fixed scale. It is not art; it is calculation rendered visible. You say resemblance does no work, yet you rely on the resemblance to make the cross-linguistic transfer possible. If the sign were purely arbitrary like a word, we would lose the advantage we are designing for. We are building a bridge for those who do not share your logical vocabulary. If the system allows a worker in Vienna and a farmer in Kyoto to compare their economic conditions without a translator, it has achieved a linguistic function, regardless of whether it satisfies your definition of quantification."

  "That is a pragmatic success, not a linguistic one," Tobias concluded, stepping back from the board. "You have built a powerful instrument for comparison, but you have not solved the problem of assertion. You can show me a line of workers, but you cannot logically forbid the interpretation that they are waiting for a bus rather than unemployed. The picture suggests; the language asserts. Until you can show me where the obligation to truth lies in the ink itself, distinct from the verbal context surrounding it, you have a gallery of illustrations, not a grammar of claims."

  They stood in silence for a moment, the hum of the printing presses faint in the background. The dispute had circled back to the nature of the bond between the sign and the world.

  The crux of their disagreement is this: Does the capacity to convey information across boundaries constitute a language, or must a system possess internal logical operators to qualify as one?

  "If the answer is yes," Marianne said, "then I am committed to expanding this pictorial syntax to cover every field of science, trusting that physical arrangements can exhaust meaningful description."

  "If the answer is no," Tobias replied, "then I am committed to accepting that visualization remains subordinate to verbal logic, no matter how universally it is understood."
