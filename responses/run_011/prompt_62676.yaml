answer: |-
  1.  **The Metaphysical Claim (What animals are made of)**
      *   **The Thesis:** Animals are composed entirely of physical matter ("extended substance") and contain no immaterial soul or mind ("thinking substance").
      *   **The Verdict:** **Descartes held this.** It is the foundation of his dualism. For him, a human is a pilot in a machine (mind + body), but an animal is just the machine.
      *   **The Hedge:** He doesn't deny animals have a "soul" in the old Aristotelian sense (a principle of life), but he insists that principle is purely mechanical, like the spring in a watch. There is no "ghost" in the animal machine.

  2.  **The Explanatory Claim (How animals move)**
      *   **The Thesis:** Every single motion an animal makes—from a heartbeat to fleeing a fox—can be fully explained by the laws of physics (hydraulics, heat, nerve tubes) without referencing any internal purpose or desire.
      *   **The Verdict:** **Descartes held this, and it was substantive for his time.** In the 17th century, saying a dog runs *only* because of animal spirits flowing through nerves, not because it *wants* to run, was a radical scientific claim.
      *   **The Hedge:** In his letters to the Marquess of Newcastle, he admits animals have "bodily memory" and can be trained. He concedes they look like they have fear or joy, but insists these are just mechanical dispositions in the brain, like a clock striking noon, not felt emotions.

  3.  **The Phenomenological Claim (What it feels like)**
      *   **The Thesis:** When a dog is kicked, it makes a noise and jerks away, but it does not *feel* pain. There is no "ouch" experience, only a mechanical disturbance.
      *   **The Verdict:** **Descartes held this, but with a crucial technical distinction.** This is where your friend is half-right but missing the nuance.
      *   **The Hedge:** In his late correspondence with Henry More, Descartes distinguishes between two kinds of sensation. He denies animals have sensation *as a conscious thought* (the mental awareness of pain). However, he grants they have sensation *as a bodily state* (the physical damage and nerve impulse). He thinks the "feeling" part requires a mind to witness it; without a mind, the signal goes nowhere.

  4.  **The Cognitive Claim (Beliefs and Judgments)**
      *   **The Thesis:** Animals cannot form beliefs, make judgments, or hold propositions (like "the fox is dangerous"). They react, but they do not *know*.
      *   **The Verdict:** **Descartes held this firmly.** He ties "thought" strictly to language and reason. Because animals cannot speak, he infers they cannot arrange thoughts to express new meanings.
      *   **The Hedge:** None really. This is the bridge between his physics and his theology. If animals could judge, they would have immortal souls, which he wanted to avoid to keep human souls unique.

  5.  **The Adaptive Claim (The "Two Tests" from the *Discourse*)**
      *   **The Thesis:** You can tell an animal has no mind because it fails two behavioral tests: it cannot use language creatively, and it cannot adapt its behavior to entirely novel situations using "universal reason" (it only has a fixed repertoire).
      *   **The Verdict:** **Descartes held this, and it contradicts your friend's second move.** This is the core of Descartes' actual argument. He explicitly says we know humans have minds and animals don't *because* of how they behave.
      *   **The Hedge:** He admits in the *Discourse* that a machine could look exactly like a monkey. But he insists a machine could never pass the human tests of speech and flexibility. This implies that if an animal *did* show true linguistic flexibility, Descartes' system would force him to admit it had a mind.

  6.  **The Moral Claim (How we should treat them)**
      *   **The Thesis:** Because animals are machines without feelings or souls, we have no moral duties to them. Cruelty to animals is permissible.
      *   **The Verdict:** **Descartes did not explicitly assert this, though critics say it follows.** There is very little text where Descartes says "go ahead and torture them."
      *   **The Hedge:** He likely believed that while animals have no rights, habitual cruelty might harden a human's heart against other humans. But strictly speaking, on his view, hurting a dog is morally equivalent to kicking a car.

  7.  **The Epistemological Claim (Your friend's "Second Move" on Evidence)**
      *   **The Thesis:** Your friend claims that if animals are machines, behavioral evidence (play, consolation, mirror tests) is irrelevant to proving they have minds.
      *   **The Verdict:** **Descartes would reject this.** This is the weakest link in your friend's argument. Descartes' *own* reason for denying animals minds is based on behavioral evidence (the lack of speech and adaptability). He argues *from* behavior *to* the absence of mind. Therefore, behavior is the only evidence we have. If comparative psychology showed animals passing Descartes' "adaptability test," his own logic would require him to concede they have minds. Your friend is treating the "machine" label as a shield against data, but for Descartes, the data is what justified the label in the first place.

  8.  **The Historical Claim (The "Beast-Machine" Phrase)**
      *   **The Thesis:** The slogan "animals are mere machines" (or *bête-machine*) is a precise summary of Descartes' own terminology.
      *   **The Verdict:** **False, and it matters.** Descartes never used the phrase "beast-machine." He used analogies: animals are like clocks, automata, or spring-driven statues. The specific tag *bête-machine* was applied by his critics and later followers to simplify (and often ridicule) his view.
      *   **Why it matters:** The slogan makes the view sound more brutal and absolute than Descartes' actual texts. It hides the hedges (like the "bodily memory" in the Newcastle letters) and makes it easier for your friend to treat the doctrine as a single, unbreakable block rather than a series of distinct claims that can be challenged one by one.
