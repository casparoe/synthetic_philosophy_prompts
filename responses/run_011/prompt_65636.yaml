prompt: |-
  I'm doing my EPQ on scientific priority — basically whether it matters who got there first when the same idea keeps turning up anyway (Darwin and Wallace, Newton and Leibniz, that sort of thing). Before I go and read any of the actual theories, I want to know what I should be demanding of one.

  So: write the reqirements list. What does any account of how discoveries happen, and of who deserves the credit, have to deliver? Which cases must it get right — the famous doubles, the ones where the runner-up arguably did the harder work, the near-misses that never quite crossed the line, and the big available ideas that sat there for years with nobody producing them at all? Which distinctions can it not collapse? Which background results has it got to be consistent with? Say why each thing is a requirement, and be definite about which ones are non-negotiable and which are just a particular camp insisting on its own favourite virtue.

  The bit I care about most is whether some subset of them can't all be met at once — like if explaining why something got discovered twice and explaining why an equally ripe idea got discovered zero times pull in opposite directions, or if you can't have a theory that's testable without already knowing which discoveries *didn't* happen. If the list is a result in itself, say so and argue it.

  Then score the main contenders against it briefly, and give me a position, not a menu — I can do the fence-sitting myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Scientific Priority (who gets credit for discoveries, especially simultaneous ones).
      *   **Task:** Create a "requirements list" for any theory of scientific discovery/priority.
      *   **Specifics:**
          *   What must the theory deliver/explain?
          *   Which cases must it get right (doubles, runner-ups, near-misses, dormant ideas)?
          *   Which distinctions must it maintain?
          *   Which background results must it be consistent with?
          *   Distinguish between non-negotiable requirements and partisan virtues.
          *   **Crucial:** Identify if there are incompatibilities/trade-offs (can't all be met at once).
          *   **Crucial:** Score main contenders against the list.
          *   **Crucial:** Take a definite position (no fence-sitting).
      *   **Tone:** Academic but direct, rigorous, suitable for an EPQ (Extended Project Qualification) student who wants to cut through the noise.

  2.  **Deconstruct the Problem (Philosophy/Sociology of Science):**
      *   Scientific priority is a messy intersection of epistemology (what counts as knowledge), sociology (how scientists behave), and ethics (who deserves reward).
      *   Key cases: Newton/Leibniz (calculus), Darwin/Wallace (evolution), Mendel/de Vries (genetics), Penzias/Wilson vs. Dicke (CMB).
      *   Key theories: Mertonian Norms (Sociology), Kuhnian Paradigms (History/Philosophy), Rationalist/Internalist (Logic of Discovery), Constructivist (Social construction).

  3.  **Drafting the Requirements List (The "Specification"):**
      *   *Requirement 1: The Simultaneity Constraint.* Must explain why multiple discovery happens (inevitability vs. luck).
      *   *Requirement 2: The Distinction Constraint.* Must distinguish between "discovery" and "publication/verification." (Wallace had the idea, Darwin had the evidence).
      *   *Requirement 3: The Counterfactual Constraint.* Must explain why *some* ripe ideas weren't found (the "zero times" problem).
      *   *Requirement 4: The Effort/Contribution Constraint.* Must account for work done (Leibniz's notation vs. Newton's fluxions).
      *   *Requirement 5: The Normative Constraint.* Must offer a principle for assigning credit (is it first to think? first to publish? most impact?).
      *   *Requirement 6: Consistency with History.* Can't contradict established historical facts.

      *Refining the "Non-negotiable" vs. "Partisan" aspect:*
      *   Non-negotiable: Internal consistency, historical accuracy, distinguishing idea from proof.
      *   Partisan: Whether priority is purely about truth (Realist) or purely about social consensus (Constructivist).

  4.  **Identifying the Tension/Incompatibility (The "Result"):**
      *   *The Tension:* Determinism vs. Agency.
      *   If discoveries are inevitable (ripe fruit), priority doesn't matter (someone else would have done it).
      *   If discoveries are contingent (genius/agency), priority matters immensely, but then why do doubles happen?
      *   *The "Zero Times" Problem:* If the field is ripe, why do some ideas sit? If it's not ripe, why do doubles happen?
      *   *The Testability Problem:* To test a theory of discovery, you need to know what *didn't* happen. But history only records what *did*. This creates a selection bias.
      *   *Conclusion on this:* Yes, there is a fundamental incompatibility between a *descriptive* theory (how it happens) and a *normative* theory (who deserves credit). You can't derive an "ought" from an "is" without importing external ethical values.

  5.  **Scoring the Contenders:**
      *   *Mertonian Sociology (Norms of Science):* Good on behavior, bad on epistemology.
      *   *Kuhnian Paradigms:* Good on timing/ripeness, bad on individual agency.
      *   *Rationalist/Internalist:* Good on logic, bad on explaining simultaneous social context.
      *   *Stigler's Law of Eponymy:* Cynical, descriptive, no normative power.

  6.  **Formulating the Position:**
      *   Need to take a stand.
      *   *Argument:* Priority is not an epistemic fact; it's a resource allocation mechanism. The "truth" of the discovery is separate from the "credit" for the discovery.
      *   *Stance:* Priority should be assigned based on *public verification*, not private insight. This solves the Newton/Leibniz and Darwin/Wallace tensions best. It privileges the community over the individual.

  7.  **Drafting the Content (Iterative refinement for tone and clarity):**
      *   *Intro:* Acknowledge the sophistication of the question.
      *   *Section 1: The Specification (Requirements).* Break down into Descriptive (what happened) and Normative (who gets credit). Label Non-negotiable vs. Contingent.
      *   *Section 2: The Incompatibility Theorem.* Highlight the tension between "Ripeness" (Determinism) and "Priority" (Individualism).
      *   *Section 3: Scoring.* Be harsh.
      *   *Section 4: The Verdict.* Give the definite position requested.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "zero times" vs "two times" tension? *Yes, in the Incompatibility section.*
      *   *Check:* Did I distinguish non-negotiable from partisan? *Yes, marked clearly.*
      *   *Check:* Is the position definite? *Yes, arguing for a Communal-Verification model.*
      *   *Check:* Is it suitable for an EPQ? *Yes, provides a framework for analysis.*
      *   *Tone Check:* Ensure it doesn't sound like a textbook but like a strategic guide. Use strong verbs.

  9.  **Final Polish:** Ensure the distinction between "Discovery" (ontological) and "Priority" (sociological) is sharp. This is the key insight for the student. (Self-correction: Make sure to explicitly mention Stigler's Law).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a sophisticated angle for an EPQ. Most students get bogged down in the biography of Newton or Darwin. You are asking for the *meta-theory* of priority. That is the correct move.

  Below is the specification list for any theory of scientific priority, followed by the incompatibility theorem you asked for, a scoring of the contenders, and a definite position.

  ---

  ### Part 1: The Specification List
  Any account of scientific priority must satisfy two distinct categories of requirements: **Descriptive** (how discoveries actually occur) and **Normative** (how credit *ought* to be assigned). Confusing these two is the primary source of error in this field.

  #### A. Non-Negotiable Requirements (The "Must-Haves")
  *If a theory fails these, it is factually wrong or logically incoherent.*

  1.  **The Simultaneity Constraint (Descriptive):**
      *   **Requirement:** Must explain why independent, simultaneous discovery is statistically frequent in mature fields (e.g., calculus, evolution, oxygen) but rare in nascent ones.
      *   **Why:** If priority is purely about individual genius, doubles should be impossible. If they happen, the theory must account for the "ripeness" of the intellectual environment.
  2.  **The Verification Distinction (Normative):**
      *   **Requirement:** Must distinguish between *conceiving* an idea and *establishing* it as knowledge.
      *   **Why:** Wallace had the idea of natural selection before Darwin published, but Darwin had the decades of evidence. A theory that gives equal weight to a hunch and a proof collapses the distinction between speculation and science.
  3.  **The Counterfactual Constraint (Descriptive):**
      *   **Requirement:** Must explain why some "ripe" ideas remained undiscovered for long periods (the "zero times" problem) while others were found twice in the same year.
      *   **Why:** A theory claiming discoveries are inevitable (determinism) cannot explain delays. A theory claiming they are purely contingent (luck) cannot explain simultaneous discovery. It must navigate between necessity and chance.
  4.  **The Communication Necessity (Normative):**
      *   **Requirement:** Must establish that private knowledge does not count toward priority.
      *   **Why:** Science is a public institution. If Newton writes a proof in a diary no one sees for 20 years, he has not contributed to the *scientific* corpus during that time. Priority must be tied to public entry, not private insight.

  #### B. Contingent Requirements (The "Partisan Virtues")
  *These are often demanded by specific schools of thought but are not logically necessary. Be wary of treating these as laws.*

  1.  **The Effort-Reward Proportionality:**
      *   **Claim:** Credit should match labor invested.
      *   **Status:** **Partisan.** Often false. Mendel did the hard work; de Vries got some credit for rediscovery. Sometimes a lucky insight (Kekulé's dream of the benzene ring) outweighs years of grinding. Demanding proportionality collapses when luck plays a role.
  2.  **The Impact Metric:**
      *   **Claim:** Credit should go to the version that actually influenced the field.
      *   **Status:** **Partisan.** This favors the "winner" retrospectively. It is useful for history of influence, but unfair for history of discovery. (e.g., Gregor Mendel was ignored for 35 years; does he get no priority because he had no impact until 1900?)
  3.  **The Moral Desert:**
      *   **Claim:** Credit should reflect moral virtue or character.
      *   **Status:** **Dangerous.** Newton was vindictive; Darwin was cautious. Priority is an epistemic currency, not a moral one. Collapsing these leads to hagiography or demonology rather than analysis.

  ---

  ### Part 2: The Incompatibility Theorem
  You asked if some requirements pull in opposite directions. **Yes.** There is a fundamental tension between the **Descriptive** goal (explaining why doubles happen) and the **Normative** goal (assigning unique credit).

  **The Tension:**
  1.  **To explain Simultaneous Discovery:** You must argue that the discovery was *inevitable* given the state of the field (Determinism). If the fruit is ripe, anyone could have picked it.
  2.  **To justify Unique Priority:** You must argue that the discoverer did something *unique* that others did not (Agency). If anyone could have done it, why does *this* person get the Nobel Prize?

  **The Result:**
  You cannot have a theory that maximizes both **Inevitability** and **Individual Merit**.
  *   If you argue discoveries are inevitable (to explain Darwin/Wallace), you undermine the justification for giving one person exclusive credit (because Wallace would have found it anyway).
  *   If you argue discoveries are unique acts of genius (to justify Newton's credit), you cannot explain why Leibniz found the same thing at the same time.

  **The "Zero Times" Problem:**
  Furthermore, a theory that explains "Two Times" (doubles) via field ripeness struggles to explain "Zero Times" (ideas that sat on the shelf). If the math was ready for Newton, why wasn't it ready for the Greeks?
  *   **Conclusion:** Any theory of priority is necessarily **retrospective**. It selects cases where discovery happened and constructs a narrative of "ripeness." It is structurally blind to the ideas that *didn't* happen, making it scientifically untestable in the strict sense. You are analyzing a selection bias, not a natural law.

  ---

  ### Part 3: Scoring the Contenders
  Here is how the main philosophical/sociological frameworks score against the Non-Negotiables.

  | Theory | Simultaneity | Verification Distinction | Counterfactuals | Communication | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Great Man (Heroic)** | **FAIL.** Cannot explain doubles without invoking psychic links or luck. | **PASS.** Focuses on the genius's insight. | **FAIL.** Cannot explain delays. | **FAIL.** Often values private notebooks (Newton). | **Myth.** Good for biography, useless for epistemology. |
  | **Mertonian Sociology** | **PASS.** "Multiple discovery" is a core norm. | **PASS.** Emphasizes publication as the act of completion. | **PASS.** Explains delays via social structure/resources. | **PASS.** "Publicity" is a core imperative. | **Strong.** Best for explaining *behavior*, weak on *truth*. |
  | **Kuhnian Paradigms** | **PASS.** Discovery happens when the paradigm allows it. | **WEAK.** Blurs the line between discovery and acceptance. | **PASS.** Explains "Zero Times" as pre-paradigmatic. | **WEAK.** Focuses on communities, not individuals. | **Good Context.** Explains *when*, not *who*. |
  | **Rationalist/Internalist** | **FAIL.** Logic is timeless; shouldn't depend on timing. | **PASS.** Logic dictates validity. | **FAIL.** Logic doesn't have a timeline. | **WEAK.** A proof is true even if unread. | **Idealistic.** Ignores the human element of science. |

  ---

  ### Part 4: The Position
  You asked for a position, not a menu. Here it is:

  **Priority is not an epistemic fact; it is a resource allocation mechanism.**

  Do not try to find a theory that tells you who *truly* discovered something in a metaphysical sense. That is a category error. The "discovery" (the truth of the matter) is separate from the "priority" (the social credit).

  **Your Argument:**
  1.  **Adopt the Mertonian-Communal View:** Priority should be assigned strictly based on **public verification**, not private conception.
      *   *Why:* This resolves the Darwin/Wallace tension. Wallace had the conception; Darwin had the verification. Darwin gets the priority not because he thought of it first (he didn't), but because he built the structure that allowed the community to *use* the idea.
      *   *Why:* This resolves Newton/Leibniz. Leibniz published first; Newton claimed private priority. Under this rule, Leibniz wins the priority race, even if Newton's calculus was arguably deeper. Science rewards the *input to the commons*, not the *content of the skull*.

  2.  **Accept the "Inevitability" Trade-off:** Acknowledge that in mature fields, priority is largely arbitrary.
      *   If a discovery is truly "ripe" (simultaneous), the specific name attached to it is historically contingent. We teach "Newton's Laws" not because Newton was uniquely essential, but because he won the priority dispute and his notation/community prevailed.
      *   *Crucial Point:* This does not diminish the science. It clarifies that priority is a **sociological tool** used to incentivize publication and prevent secrecy.

  3.  **Reject the "Zero Times" Determinism:** Do not claim that ideas are *inevitable*. Claim that they are *probabilistic*.
      *   The field creates a probability distribution. When the probability spikes, multiple hits occur (doubles). When the probability is low, zero hits occur.
      *   This saves you from the determinism trap. You can explain why the Greeks didn't do calculus (low probability/missing algebraic notation) and why Newton/Leibniz did (high probability/converging tools).

  **Final Recommendation for your EPQ:**
  Argue that **Scientific Priority is a mechanism for enforcing Open Science.**
  The reason we fight over who was first is not to satisfy our ego, but to enforce a system where scientists are rewarded for *revealing* secrets rather than *hoarding* them.
  *   Newton hoarded (fluxions); Leibniz revealed (notation). Leibniz's notation won because the priority system rewards utility to the community.
  *   Darwin sat on his theory for 20 years; Wallace forced his hand. The joint paper was the system correcting Darwin's hoarding.

  **Thesis Statement:**
  *"Scientific priority is not a measure of individual genius, but a sociological technology designed to convert private insight into public knowledge. Therefore, credit must be assigned to the agent of verification and publication, regardless of private precedence, because the function of science is the growth of the commons, not the glorification of the mind."*

  This position allows you to use the history (Newton, Darwin) to prove a point about the *structure of science*, which is much stronger than just retelling the history.
