answer: |-
  This is one of the classic tensions in tort theory, and you are right to sense that it isn't driven by a single, clean moral principle. If you try to explain it to rookies as "the law being moral," they will spot the contradictions immediately. If you explain it as "the law managing social friction," it clicks.

  Here is the breakdown of the theory, the tensions, and how to explain the specific anomalies you listed.

  ### 1. The Core Theory: Liberty vs. Reliance
  The system isn't standing on one theory; it is a compromise between two competing values: **Individual Autonomy** and **Detrimental Reliance.**

  *   **The No-Duty Rule (Autonomy):** This is the moral baseline. It presupposes that you own your labor and your body. To force you to act for a stranger is to claim a property right in your time and effort. In this view, the law distinguishes between *negative rights* (don't hurt me) and *positive rights* (help me). The no-duty rule protects your negative liberty. It is not just "liability plumbing"; it is a substantive claim that forced labor is a greater evil than unaided drowning.
  *   **The Exceptions (Reliance/Causation):** Once you step in, the autonomy argument recedes, and the *harm prevention* argument takes over. If you start a rescue, you signal to the victim and the world that help is arriving. The victim stops trying to save themselves; other potential rescuers stand down. You have altered the status quo. If you quit or botch it, you haven't just "allowed" harm; you have actively *precluded* other avenues of survival.

  **What is strictly needed vs. what fits nicely?**
  *   **Strictly Needed:** The "undertaking" rule (if you start, you must finish reasonably) is needed to prevent *making things worse.* Without it, a rescuer could deter other aid with no consequence. That is pure harm-prevention plumbing.
  *   **Fits Nicely:** The "special relationship" exceptions (parent/child, lifeguard). These fit nicely with moral intuition, but legally they are just pre-existing contractual or custodial duties. The law doesn't *need* them to be moral; it needs them to be *definable*.
  *   **The Tension:** The system *needs* the no-duty rule to preserve autonomy, but it *needs* the undertaking rule to prevent negligence. The tension is that the undertaking rule punishes the benevolent actor more harshly than the indifferent bystander.

  ### 2. The Start-and-Stop Asymmetry
  You asked if this requires a "doing/allowing" distinction. Yes, but not in a metaphysical sense. In a **causal** sense.

  *   **The Bystander:** Causally neutral. The river of events flows past them.
  *   **The Rescuer:** Causally active. They dam the river.

  If you explain it to rookies this way, it stops sounding arbitrary: *"If you walk by, the drowning is caused by the water. If you grab them and let go, the drowning is caused by your release."*

  The liability isn't for the drowning itself; it's for the **negligent intervention.** The law treats the rescue attempt as a new chain of causation. Once you create that chain, you own it. This is consistent with the autonomy view: You weren't forced to start the chain. But having voluntarily seized control of the situation, you cannot exercise that control carelessly.

  ### 3. Land vs. Sea (The Admiralty Tell)
  This is the strongest evidence that the land rule is partly "liability plumbing," but it doesn't prove it lacks moral content. It proves the moral calculus changes based on **monopoly on aid.**

  *   **On Land:** We assume alternative aid is available (911, other bystanders, hospitals). The cost of imposing a duty on *you* is high (loss of liberty), and the marginal benefit is low (someone else might call 911).
  *   **At Sea:** You are often the *only* aid. The probability of death without you is near 100%. The cost to you (throwing a rope, turning the boat) is low relative to the certainty of death.

  **Is the admiralty rule the tell that the land rule isn't moral?**
  Not necessarily. It suggests the land rule is a **default setting for low-necessity environments.** The maritime rule acknowledges a "community of peril." When everyone is vulnerable to the same force (the ocean), reciprocity dictates a mutual aid pact. On land, we don't feel that same shared vulnerability.

  **How to teach this:** Tell the rookies the law looks at **uniqueness of opportunity.** On the sidewalk, you are one of many potential helpers. On the water, you are the only one. The duty attaches to the monopoly on salvation.

  ### 4. The Good Samaritan Statutes and Medals
  This is where the "plumbing" is most visible.

  *   **Good Samaritan Laws:** These are purely pragmatic patches. The common law "undertaking" rule created a disincentive to help (liability risk). The legislature realized this was bad social policy. So, they immunized the rescuer. Note that these statutes often protect *untrained* volunteers but not *on-duty* professionals. This confirms the theory: the law wants to encourage the *voluntary* moral act without converting it into a *professional* duty.
  *   **Bravery Medals:** These rely entirely on the **no-duty rule.**

  ### 5. The Utilitarian Swap (Expected-Harm Calculus)
  If you swapped the entire structure for a straightforward expected-harm calculus (i.e., "You must act whenever the benefit to the victim outweighs the cost to you"), here is what breaks:

  **Doctrinal Changes:**
  1.  **The No-Duty Rule Vanishes:** Every bystander becomes a potential defendant. If you could have thrown a life preserver with minimal effort, you are liable for the death if you didn't.
  2.  **The "Undertaking" Rule Becomes Redundant:** You already had a duty to start. Quitting is just a breach of the initial duty.
  3.  **Good Samaritan Laws Become Critical:** Without them, the floodgates open. Everyone is liable for every accident they witnessed. The statutes would have to expand from "shields" to "blanket immunities."

  **The Fate of the Medal:**
  **The medal becomes incoherent.**
  Medals honor **supererogation**—acts that are good but not required.
  *   If rescue is a legal duty, rescuing is **compliance.** We do not give medals for paying taxes or stopping at red lights.
  *   If you swap to a harm calculus, the "hero" is just a "law-abiding citizen."
  *   To keep the medal, you *must* keep the no-duty rule. The legal system *requires* a category of action that is morally praised but legally optional to sustain the concept of "bravery."

  ### Summary for the Rookies
  When you teach this, don't try to make it a perfect moral circle. It isn't one. It's a zoning map for responsibility.

  1.  **The Baseline:** You own yourself. The state won't force you to be a hero. (Autonomy)
  2.  **The Trap:** If you choose to be a hero, you become a professional for that moment. You cannot make it worse. (Reliance)
  3.  **The Shield:** We know that trap scares people, so we passed laws to protect you if you try in good faith. (Policy)
  4.  **The Honor:** Because we don't force you, we medal you if you do. (Culture)

  The tension they feel—the fact that doing nothing is safer than doing something—is real. It is the price the law pays to keep the category of "volunteer" distinct from "employee." If you remove that tension, you remove the volunteer. You turn them into conscripts. The law is designed to keep rescue voluntary, even if that means the legal incentives are sometimes perverse.
