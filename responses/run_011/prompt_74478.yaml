      *   Did I avoid citations? Yes.
      *   Is the tone appropriate? Yes.

  *(Self-Correction on the "Two-Horned Thing"):* The user might be referring to the "Dilemma Defense" against Frankfurt cases.
  Horn 1: The prior sign is causally determined. (Then Jones isn't responsible).
  Horn 2: The prior sign is not causally determined. (Then Jones *could* have avoided the sign, so PAP holds).
  The text says holdouts insist "the device would have made Jones's decision determined anyway." This conflates the deterministic nature of the *device* with the deterministic nature of the *agent's choice*. I need to clarify this distinction.

