answer: |-
  This is a sharp observation, and you are right to feel unsettled. You have spotted a fracture line in the ethical foundation of the home that most people glide over because it is easier to focus on whether Gran is smiling. You are asking for the architecture behind the practice, not just the decoration.

  Here is an analysis of what the home is actually doing, what theory of well-being is driving it, where the contradictions lie, and what would concretely change if they switched frameworks.

  ### 1. What picture of "a life going well" is currently in charge?

  Your flatmate suggests the **Experience Machine (Hedonism)**: if it feels good, it is good. The VR suite and the "he's popped out" line fit this perfectly. If Gran feels secure and loved, her well-being is maximized, regardless of the factual accuracy.

  However, the **Death Rule** breaks pure Hedonism. If the only metric was pleasure/pain (mood), telling the woman on the corridor her husband is dead 40 times is a failure. It produces acute, repeated suffering. A pure hedonist carer would say, "He's away on business," every single time to preserve her mood score.

  So, the home is not running on pure Hedonism. They are running on a hybrid model that looks like **Relational Integrity with a Hedonistic Bias.**

  *   **The Bias:** For internal, unverifyable past events (Gran's husband, her childhood street), they prioritize *emotional safety*. The theory here is that the "truth" of 2009 no longer exists for Gran; forcing it on her is an act of violence against her current cognitive reality.
  *   **The Constraint:** For external, shared, verifiable present events (a death on the corridor), they prioritize *communal trust*.

  The picture of well-being here is: **"Maximize subjective comfort unless it breaks the shared reality required for the community to function."**

  ### 2. Is the Death Rule inconsistent with the Rest?

  It *looks* inconsistent, but there is a philosophical story that makes it consistent. It relies on the distinction between **Private Delusion** and **Public Fact.**

  *   **Gran's Husband:** This is a private reality. No other resident is interacting with him. Validating Gran's belief does not gaslight anyone else. It keeps her anchored in a version of the world where she is safe.
  *   **The Corridor Husband:** This is a public event. Other residents saw the ambulance. Other families know. If the staff lie to the grieving woman, they are not just lying to her; they are lying to the *community*. If residents realize staff will lie about a death in the building, they cannot trust staff about *anything* (medication, meals, safety).

  **The Unifying Theory:** The home is committed to **Epistemic Security within a Community.**
  They will sacrifice objective truth to protect an individual's internal world (Gran), but they will sacrifice an individual's emotional comfort to protect the group's trust in the institution (the Corridor).

  **Where it fails:** This theory collapses if the grieving woman asks *why* there was an ambulance and the staff say "maintenance." If they lie to the group to protect the individual, the theory breaks. If they tell the group the truth but tell *her* a lie, that is unsustainable. The fact that they tell *her* the truth 40 times suggests they prioritize the **Integrity of the Staff** over the **Comfort of the Resident** in public matters. They do not want to be "liars" on the record.

  ### 3. Does the "Mood Score" settle the philosophical question?

  **Yes, and this is the critical problem.**

  By measuring success via "mood-and-engagement," the home has operationally committed to **Experientialism** (a form of Hedonism), even if their rules pay lip service to Truth.

  *   **What it rules out:** It rules out the idea that "dignity" or "truth" are goods in themselves. If Gran were calm but living a total lie, she scores high. If the grieving woman is devastated by the truth, she scores low. The system registers the grief as a "negative outcome," even if the staff claim telling the truth is "the right thing."
  *   **The Contradiction:** The handbook says "Tell the truth" (Deontological rule), but the KPI says "Maximize smiles" (Consequentialist metric). This puts carers in a bind. They are trained to value truth in death, but managed on metrics that value comfort.

  ### 4. Where is the practice underdetermined?

  This is where your insight is vital. There are areas where a Hedonist, a Desire-Satisfaction theorist, and an Objective List theorist would all do the exact same thing, so the staff don't notice the philosophical difference.

  *   **The VR Suite:**
      *   *Hedonist:* Do it because it makes her happy.
      *   *Desire-Satisfaction:* Do it because it satisfies her latent desire for home.
      *   *Objective List:* Do it because "connection to place" is a human good.
      *   *Result:* Everyone puts her in the headset. The staff don't need to know *why* it works to do it.
  *   **Not Correcting Small Errors:**
      *   If Gran says "I need to feed the chickens" (she hasn't had chickens for 50 years):
      *   *Hedonist:* Don't correct her, she'll get agitated.
      *   *Precedent Autonomy:* The "old Gran" would prefer kindness over accuracy.
      *   *Result:* Carer says, "The chickens are fed, love."
  *   **The Underdetermination Trap:** Because the *actions* are the same in 90% of cases, the staff assume the *ethics* are the same. They don't see the conflict until the hard cases (like the death) arise.

  ### 5. What would have to change if they swapped the theory?

  If you go into a family meeting, do not ask "Is this kind?" Ask "What is the governing principle?" Here is what would physically change in the home if they switched from their current hybrid model to one of the two rival theories.

  #### Scenario A: Switching to Pure Hedonism (Comfort is King)
  *If they decided well-being is ONLY about how it feels from the inside.*

  1.  **The Handbook:** The "Death Rule" is deleted. Protocol changes to "Therapeutic Communication regarding loss."
  2.  **Training:** Staff are trained to say, "He has gone to the hospital," or "He is away," when the grieving woman asks. They are taught that repeated grief is a failure of care.
  3.  **The VR Suite:** Expanded. If Gran gets distressed by the "real" world, she spends more time in VR. The boundary between VR and reality is intentionally blurred.
  4.  **Scoring:** The "Mood Score" remains the only metric. "Truthfulness" is removed from audit criteria.
  5.  **Family Meetings:** You are told, "We do not correct realities that cause pain. We understand you want the truth, but her experience is what matters."

  #### Scenario B: Switching to Precedent Autonomy / Objective Truth (Reality is King)
  *If they decided the "Competent Gran's" wishes or Objective Truth binds the "Current Gran."*

  1.  **The Handbook:** The "Validation" rule is deleted. Protocol changes to "Reality Orientation."
  2.  **Training:** When Gran asks for her husband, staff say, "Gran, remember we talked about this? John passed away in 2009. I know that's sad." They prepare her for the grief every time.
  3.  **The VR Suite:** It is reframed as "Memory Therapy," not "Immersion." The carer breaks character: "This is a simulation of the street you used to know." The illusion is not maintained.
  4.  **Scoring:** A new metric is added: "Orientation to Reality." A resident who is happy but deluded scores lower than a resident who is sad but oriented.
  5.  **Family Meetings:** You are asked, "Did she leave an Advance Directive? Did she say she wanted to be told the truth even if it hurt?" The focus shifts to her past competent self, not her current happy self.

  #### Scenario C: The "Relational Integrity" Model (Refining their current hidden theory)
  *If they made their actual implicit theory explicit and consistent.*

  1.  **The Handbook:** Distinguishes between **Verifiable Shared Events** and **Internal Narrative.**
      *   *Rule:* "We validate internal narratives that cannot be disproven. We state facts about shared current events."
  2.  **Training:** Staff are taught *why* the death rule exists. It is not "Truth is good," it is "Trust is necessary for safety." They are given scripts to handle the grieving woman that acknowledge the pain without abandoning the truth: "I know this is hard to hear again. He did pass away. I am here with you."
  3.  **Scoring:** The "Mood Score" is supplemented with a "Trust/Engagement Index." Does the resident trust the staff? (This accounts for why we tell the truth about deaths).
  4.  **Family Meetings:** You are told: "We protect her internal world, but we cannot lie about the world we all share. Here is how we support her through the grief of the truth."

  ### 6. Concrete Advice for Your Meeting

  You are in a position to push for **Scenario C**. The current setup is dangerous because it relies on staff intuition to decide when to lie and when to tell the truth, which leads to inconsistency (and the gut-wrenching scene you witnessed).

  **Ask these three specific questions:**

  1.  **"What is the threshold for verification?"**
      *   Ask: "Is the rule based on whether the truth can be checked by other residents? If my gran asked if the Queen was dead, would you tell her the truth?" (This tests if their rule is about *shared reality* or just *upsetting topics*).
  2.  **"How does the Mood Score account for dignified grief?"**
      *   Point out: "If the mood score is the only success metric, the staff are incentivized to lie about the death to get a better score. Are you measuring 'Trust' or just 'Smiles'?"
  3.  **"Where is the Precedent Autonomy recorded?"**
      *   Ask: "Do you have a record of what Gran wanted before she got sick? If she wrote 'Don't lie to me,' does that override the 'Validation' policy?" (Under the UK Mental Capacity Act, 'Best Interests' includes past wishes).

  **The specific change to propose:**
  Suggest that the handbook explicitly distinguishes between **Delusions** (internal, unverifyable) and **Events** (external, shared).
  *   *Proposal:* "Let's codify that we enter the resident's reality for the past, but we anchor them in shared reality for the present. But when we anchor them in painful present reality (like a death), the 'Mood Score' must be adjusted to acknowledge that distress is a valid, non-failure response."

  This stops the staff from feeling they are "failing" when the woman cries, and it stops them from lying to her to game the metrics. It aligns the philosophy with the practice.

  ### Summary
  The home is currently running a **pragmatic contradiction**. They use Hedonism to manage dementia symptoms (Gran) and Deontology to manage institutional risk (the Death). The "Mood Score" betrays the Hedonism, making the Death Rule look like cruelty rather than integrity.

  To fix it, they don't need to stop lying to Gran or stop telling the truth about deaths. They need to change the **justification** and the **measurement**. If they measure "Trust" alongside "Mood," the death rule makes sense. If they measure only "Mood," the death rule is abuse.

  You are right to press this. It is the difference between care that manages symptoms and care that respects a person.
