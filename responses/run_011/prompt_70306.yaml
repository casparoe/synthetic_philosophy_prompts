  **Scenario**

  Captain Vance sits in the cockpit of a grounded cargo plane. On the dashboard, the landing gear indicator light glows green. On her lap lies the flight manual, open to the landing protocol: "If the landing gear light is green, the gear is locked." Vance has infinite time to review the instruments and the manual. She is a certified expert on this aircraft model; she understands the light and the protocol perfectly. There are no distracting alarms, no fatigue, and no competing tasks. The light is functioning correctly; the manual is the current edition. She looks from the light to the manual and back. She does not write anything down. She does not radio ground control. She simply sits with the light glowing and the manual open, fully apprised of both.

  **Proposition:** The landing gear is locked.

  ***

  **Analysis**

  **Evidence and Entailment**
  Vance's evidence consists of two items: the observation that the light is green ($G$) and the manual's rule that if the light is green, the gear is locked ($G \to L$). The consequence is that the gear is locked ($L$). This follows in a single step via Modus Ponens: from $G$ and $G \to L$, $L$ necessarily follows.

  **Classical vs. Intuitive Verdict**
  The classical possible-worlds model represents evidence as the set of worlds compatible with what the agent knows. Since every world where $G$ and $G \to L$ are true is a world where $L$ is true, the model asserts Vance's evidence *is* that $L$. The intuitive verdict is that Vance *believes* $L$, but her *evidence* for $L$ is distinct from $L$ itself; her evidence is the light and the manual. The gap is not cognitive: Vance has processed the inference instantly. The misdescription is structural: the model collapses the *basis* of the belief into the *content* of the belief, erasing the dependency relation.

  **Repair Strategies**
  1.  **Non-standard worlds:** Admit worlds where $G$ and $G \to L$ are true but $L$ is false. *Cost:* This breaks Modus Ponens globally, rendering the logic useless for valid inference elsewhere.
  2.  **Concept restriction:** Claim Vance lacks the concept 'locked'. *Cost:* Contradicts the scenario; she is an expert fluent in the relevant subject matter.
  3.  **Compartmentalization:** Suggest Vance holds $G$ and $G \to L$ in separate belief boxes. *Cost:* Fails because she is simultaneously attending to both; the compartments are artificially imposed rather than structurally present.
  4.  **Degrees of belief:** Assign $P(L) = 1$. *Cost:* While this captures certainty, it still fails to distinguish between $L$ being evidentially basic versus derived, which matters for defeasibility (e.g., if the manual is recalled).

  **The Working Feature**
  The single feature doing the work is **source-sensitivity**. Vance's evidence is tied to specific inputs (the light, the text). When this feature is removed—treating evidence as mere true propositions—the case collapses into a standard logical omniscience puzzle where the only explanation for withholding $L$ would be cognitive slowness.

  **Counterattack**
  A defender of the classical model might argue that possible-worlds sets are legitimate idealizations, like frictionless planes, designed to track truth conditions rather than psychological processes. They would claim that for normative epistemology, *what* you know matters more than *how* you know it. This reply fails here because evidence structure determines *justificatory stability*. If the manual is retracted, Vance loses justification for $L$ despite $L$ remaining true. The frictionless model cannot track this loss, making it unfit for modeling evidence, not just cognition.

  **Note on Constraints**
  The hardest constraint to satisfy was **Constraint 3** (no processing limits) alongside **Constraint 5** (one-step entailment). In reality, even simple inferences take non-zero time. I bent this slightly by positing "infinite time" in a realistic setting to force the focus onto the representation of evidence rather than the speed of processing, ensuring the "cognitive limits" excuse was unavailable without making the scenario science-fictional.
