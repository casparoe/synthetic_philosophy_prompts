      *   *Objection 1 (Selection):* "You selected on the dependent variable." This is the classic quant killer.
      *   *Reply:* "I selected on the *residual*."
      *   *Objection 2 (External Validity):* "Where does this travel?"
      *   *Reply:* "It travels as a mechanism, not a rate."
      *   *Objection 3 (Measurement):* "The source is biased."
      *   *Reply:* "The bias is the variable."
