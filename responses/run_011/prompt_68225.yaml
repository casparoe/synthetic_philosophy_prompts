      *Critical Reply:* Selection Bias. If you can't justify why you picked the weird case, you're just telling a fun story.

      *Weakest Point:* Generalization. Quants hate "possibility exists" as a conclusion. They want "probability is X."

      *Feared Question:* "What would change your mind?" (Falsification).

      *Let's polish the vocabulary.* Ensure terms like "ecological inference," "identification," "selection on the dependent variable" are used correctly.

      *(Self-Correction on Objection 7 & 8)*: Make sure they aren't too philosophical. Keep them methodological. "Replicability" is good. "Counterfactuals" is good.

      *Final check on the "First 60 Seconds Concession".* It needs to be tactical. Admit the limitation to define the scope.

      *Final check on "Weakest Point".* Be honest. The modal claim is the hardest sell to frequentists.

      *Final check on "Feared Question".* "How do you know you're wrong?" is the core scientific challenge.

      *Okay, ready to write.*
answer: |-
  # Q&A Prep Sheet: Microhistory vs. The Quants

  **Context:** You are in a room of economic historians and sociologists. They value identification, $N$, and external validity. They view your method as high-variance, low-bias storytelling. Do not try to beat them at regression. Beat them at *measurement*.

  ### The Objections (Ordered by Damage Potential)

  **1. Selection Bias (The Nuclear Option)**
  *   **The Question:** "You've explicitly told us you select cases because they violate the macro categories. In my language, you are selecting on the dependent variable. You're finding anomalies by definition. How do you distinguish a genuine structural limit in our categories from simple cherry-picking of the most colorful archive?"
  *   **The Reply:** "I am selecting on the residual, not the dependent variable. In your regressions, the outlier is dropped or robustified away to clean the coefficient. I treat the residual as the signal. If your model predicts uniform peasant piety and I find a miller reading heretical books, the error isn't in the miller; it's in the model's specification. I'm not cherry-picking a story; I'm stress-testing your categories. If the category breaks under the weight of one real life, the category was too brittle to begin with."
  *   **The Soft Spot:** "So you're conceding that your method can tell us the model is wrong, but it can't tell us how often the model is wrong."

  **2. External Validity (The "So What?" Charge)**
  *   **The Question:** "Okay, let's say this mechanism existed in this village in 1540. What is the scope condition? Does this travel to the next valley? To the next century? If you can't give me a population, I don't know if I'm looking at a systemic feature of early modernity or just local noise."
  *   **The Reply:** "I'm not making a claim about the population; I'm making a claim about the possibility space. Your macro-data tells you what *did* happen on average. My micro-data tells you what *could* happen given the institutional constraints. If I show you a mechanism where a peasant negotiates doctrine with an inquisitor, I've proven the system allowed for negotiation. That changes the structural description of the period, even if only 1% of peasants did it. You need the frequency; I'm providing the existence proof."
  *   **The Soft Spot:** "So you're conceding that this is purely qualitative existence proof, and we have no way to weight its importance against the aggregate trends."

  **3. Measurement Error (The Source Critique)**
  *   **The Question:** "You say the mediation is the object. But if the transcript records the inquisitor's Latin, not the miller's vernacular, aren't you just analyzing the inquisitor's bias? You've got unobserved heterogeneity baked into the source. How do you identify the actor's intent separate from the scribe's filter?"
  *   **The Reply:** "I'm not trying to recover the 'true' intent behind the filter. I'm treating the filter as an institutional constraint. The gap between the vernacular and the Latin is a measurable distance. It tells me what concepts were translatable and which were not. If the scribe couldn't write down the miller's idea without distorting it, that distortion is data on the limits of the intellectual infrastructure. The measurement error *is* the measurement."
  *   **The Soft Spot:** "So you're conceding that you can't access the actual beliefs of the historical agent, only the bureaucracy's reception of them."

  **4. Identification (The Mechanism Charge)**
  *   **The Question:** "You claim to trace mechanisms. But without variation, how do you rule out confounders? Maybe the miller wasn't heterodox because of village networks; maybe he was just eccentric. How do you identify the causal path without a control group?"
  *   **The Reply:** "I use process tracing instead of statistical control. I'm looking for the specific links in the chain: the book loan, the conversation, the denunciation. If the timeline doesn't match, the mechanism fails. I don't need a control group to see that A physically preceded B and enabled C. I'm establishing necessary conditions within the case, not average treatment effects across cases."
  *   **The Soft Spot:** "So you're conceding that you can't rule out alternative explanations that fit the same timeline."

  **5. Sample Size (The "Anecdote" Charge)**
  *   **The Question:** "Let's be blunt. $N=1$. You have no statistical power. Any claim you make about 'social structure' based on a single household is just an anecdote with a fancy theoretical framework."
  *   **The Reply:** "It's not a sample; it's a specimen. When a pathologist finds a new virus, they don't need a thousand patients to prove the virus exists; they need one clear tissue sample to isolate the mechanism. I'm not estimating a mean; I'm isolating a strain. If you demand $N=1000$ for existence claims, you blind yourself to rare but high-impact phenomena."
  *   **The Soft Spot:** "So you're conceding that your findings are inherently low-probability events, which limits their explanatory power for the bulk of historical experience."

  **6. Ecological Inference (The Aggregation Charge)**
  *   **The Question:** "You argue aggregation destroys information. But doesn't disaggregation commit the ecological fallacy in reverse? You're inferring group dynamics from individual behavior. Just because one village relayed an idea doesn't mean 'the peasantry' had that capacity."
  *   **The Reply:** "I'm not inferring up to the group; I'm inferring through the network. I'm not saying 'all peasants did this.' I'm saying 'the social fabric contained these threads.' Aggregation assumes homogeneity; I'm demonstrating heterogeneity. The fallacy is assuming the average represents the structure. The structure is defined by its connections, not its averages."
  *   **The Soft Spot:** "So you're conceding that you cannot make claims about collective action, only individual connectivity."

  **7. Counterfactuals (The "What If" Charge)**
  *   **The Question:** "Your narrative relies on implicit counterfactuals. 'If he hadn't lent the book, the idea wouldn't spread.' How do you test that? It's hindsight bias dressed up as causal inference."
  *   **The Reply:** "I test it against the archive's silence. If the network existed, there should be traces in other documents—tax records, other trials. If the mechanism was vital, it leaves footprints. I'm not imagining a world without the event; I'm checking if the world with the event is consistent across multiple independent records."
  *   **The Soft Spot:** "So you're conceding that your counterfactuals rely on the survival of other records, which is itself a selection bias."

  **8. Replicability (The "Science" Charge)**
  *   **The Question:** "If another scholar goes to that archive, will they find what you found? Or is this interpretation dependent on your specific theoretical lens? Where is the inter-rater reliability?"
  *   **The Reply:** "The replication isn't in the finding; it's in the reading. The transcript is public. If another scholar reads the same Latin and sees a different negotiation, we can debate the translation. That's better than a regression where the code is lost and the data is cleaned. My method forces the evidence into the open, whereas your coefficients hide the outliers."
  *   **The Soft Spot:** "So you're conceding that the result is subjective and depends on the interpreter's skill, not the data's objective properties."

  ---

  ### Strategic Concession (First 60 Seconds)
  **Say this immediately after your intro:**
  "I want to be clear about what I am not doing. I am not offering you a better way to estimate frequencies. I cannot tell you how many millers there were. I cannot give you a p-value for the prevalence of heresy. If you are looking for representative data, I am not your speaker. I am offering you a way to measure the *limits* of your categories, not the content of them."
  *Why:* This stops them from spending 40 minutes waiting for a number you won't give. It frames your "weakness" as a deliberate methodological choice.

  ### The Critical Reply (Must Land)
  **Objection #1 (Selection Bias).**
  If you fumble the "selecting on the residual" argument, the entire talk collapses into "storytelling." You must convince them that studying the error term is valid science. If you admit you're just picking interesting stories, you lose the room.

  ### The Weakest Point (Defend Hard)
  **External Validity (Objection #2).**
  Economic historians live for generalizability. Your claim that "existence is enough" is philosophically sound but methodologically frustrating for them. They will press this hardest. Be prepared to reiterate that knowing a system *can* break is as important as knowing how often it *holds*. Do not waffle into claiming your case is "typical." It isn't. Own the atypicality.

  ### The Feared Question (And Honest Answer)
  **The Question:** "What evidence would falsify your thesis? If you found a hundred parish registers that contradicted this miller, would you change your mind?"
  **The Honest Answer:** "No. If I found a hundred registers showing uniform piety, it wouldn't falsify the claim that the *mechanism* for heterodoxy existed. It would only falsify the claim that it was common. My thesis is about the structure of the archive and the categories, not the prevalence of the behavior. The only thing that falsifies my claim is if you can show that the mechanism I describe was structurally impossible given the institutions of the time."
  *Why:* This is dangerous because it sounds like you're insulating your theory from data. But it's the truth of your modal claim. Better to be honest than to pretend you care about frequencies.
