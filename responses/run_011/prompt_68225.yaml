  1.  **Analyze the Request:**
      *   **Context:** 40-minute talk at a History Department methods seminar.
      *   **Audience:** Economic historians (quants, regressions, parish registers), Historical Sociologists (comparative, Mill's methods), Digital Humanist (text mining), Early Modernists (source defenders). *Crucially:* They expect "philosophy of science" (laws, explanation).
      *   **Speaker:** Philosopher of social science.
      *   **Topic:** Defending Microhistory against the charge of being "dressed-up anecdote."
      *   **Thesis:** Four claims (Scale swap not sample shrink; Modal/Structural generalization not Frequentist; Anomaly selection is feature not bug; Mediation is object not noise).
      *   **Deliverable:** Q&A Prep Sheet.
      *   **Requirements:** ~8 objections (ordered by damage potential), phrased in audience vocabulary (n, selection, identification, etc.), 2-minute replies, "soft spot" notes for each. Plus: Strategic concession (first 60s), Critical reply (must land), Weakest point (defend hard), Feared question (honest answer).
      *   **Constraints:** No specific case study knowledge assumed (arguments must stand alone), no bibliography/titles, be blunt/tough.

  2.  **Deconstruct the Audience & Their Vocabulary:**
      *   *Economic Historians:* Care about $N$, representativeness, selection bias, external validity, identification strategies, counterfactuals. They view history as data to be modeled.
      *   *Historical Sociologists:* Care about causal mechanisms, comparative method, necessary/sufficient conditions, generalizability across contexts.
      *   *Digital Humanist:* Cares about corpus size, pattern recognition vs. close reading, algorithmic bias.
      *   *Early Modernists:* Care about archival integrity, context, linguistic nuance, but might side with quants on "evidence standards."
      *   *Tone:* Skeptical, methodological, pragmatic. They want to know *how this counts as knowledge*.

  3.  **Brainstorming Objections (mapping to the 4 thesis claims):**
      *   *Claim 1 (Scale/Instrument):* "You're just swapping bias for variance." "How do we know this isn't unique?"
      *   *Claim 2 (Modal/Structural):* "Possibility isn't explanation." "So what? It happened once." "External validity?"
      *   *Claim 3 (Anomaly Selection):* "Selection bias." "Cherry-picking." "Survivorship bias."
      *   *Claim 4 (Mediation):* "You're analyzing the inquisitor, not the miller." "Infinite regress of context."

      *Refining into Audience Vocabulary:*
      1.  *Selection Bias/Cherry-picking:* (The biggest threat to Claim 3). "You chose the weird one."
      2.  *External Validity/Generalizability:* (Threat to Claim 2). "So what does this tell us about Italy/Europe?"
      3.  *Identification/Causal Mechanism:* (Threat to Claim 1). "How do you know X caused Y and not Z?"
      4.  *Measurement Error/Mediation:* (Threat to Claim 4). "The source lies. You're building on sand."
      5.  *Sample Size/Power:* (Threat to Claim 1). "N=1. You have no statistical power."
      6.  *Ecological Inference:* (Threat to Claim 2). "You're inferring group behavior from individual data."
      7.  *Hindsight/Teleology:* (Threat to Claim 3). "You know the ending, so you constructed the story to fit."
      8.  *Operationalization:* (Threat to Claim 2). "Your concepts aren't measurable."

  4.  **Ordering by Damage Potential:**
      *   *High Damage:* Selection Bias (kills the method), External Validity (kills the point), Measurement (kills the data).
      *   *Medium Damage:* Identification (standard quant critique), N=1 (basic objection).
      *   *Lower Damage (for this room):* Operationalization (they might accept qualitative coding), Hindsight (more literary).
      *   *Wait, re-evaluating:* For *this* specific room (quants + sociologists), "Selection Bias" is the nuclear option. "External Validity" is the standard follow-up. "Measurement/Mediation" is where the Early Modernists might trap the Philosopher. "N=1" is the lazy objection, but needs a good answer.
      *   *Revised Order:*
          1.  Selection Bias (The "Cherry-picking" charge).
          2.  External Validity (The "So What?" charge).
          3.  Measurement/Mediation (The "Source is Lie" charge).
          4.  Identification (The "Mechanism" charge).
          5.  N=1/Statistical Power (The "Anecdote" charge).
          6.  Ecological Inference (The "Aggregation" charge).
          7.  Counterfactuals (The "What If" charge).
          8.  Replicability (The "Science" charge).

  5.  **Drafting Replies & Soft Spots:**
      *   *Constraint:* 2 minutes spoken. Needs to be punchy.
      *   *Constraint:* Blunt note on where it's soft.
      *   *Strategy:* Don't try to be a quant. Lean into the philosophical distinction (Modal vs. Frequentist).

      *(Self-Correction during drafting)*: Make sure the vocabulary matches. Use "identification," "selection," "external validity," "measurement error."
      *   *Reply 1 (Selection):* Admit selection, reframe as "stress test." Soft spot: Still doesn't give prevalence.
      *   *Reply 2 (External Validity):* Shift to "existence proofs." Soft spot: They want prevalence rates.
      *   *Reply 3 (Mediation):* Reframe filter as data. Soft spot: Hard to separate noise from signal.
      *   *Reply 4 (Identification):* Process tracing vs. regression. Soft spot: Hard to rule out confounders.
      *   *Reply 5 (N=1):* It's not a sample, it's a specimen. Soft spot: Sounds like special pleading.
      *   *Reply 6 (Ecological):* Don't infer up, infer through. Soft spot: Limits utility for macro history.
      *   *Reply 7 (Counterfactuals):* Immanent counterfactuals. Soft spot: Speculative.
      *   *Reply 8 (Replicability):* Intersubjective verification. Soft spot: Not "scientific" in their sense.

  6.  **Strategic Elements:**
      *   *Concession in first 60s:* Must disarm the "N=1" anxiety immediately. Acknowledge you cannot give them frequencies.
      *   *Critical Reply:* The Selection Bias one. If you lose that, the method is just storytelling.
      *   *Weakest Point:* External Validity. It's hard to convince a quant that one case tells them about the world without prevalence.
