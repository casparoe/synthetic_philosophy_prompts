  **GREENHORIZON GARDEN CENTRES LTD**
  **PERFORMANCE IMPROVEMENT PLAN**

  **Employee Name:** Mr L. Merre
  **Job Title:** Customer Assistant (Outdoor Plants)
  **Branch:** Leicester East
  **Line Manager:** S. Henderson (Branch Manager)
  **HR Business Partner:** K. Patel
  **Date of Issue:** 14 March 2024
  **Review Date:** 14 June 2024

  **1. Purpose and Company Values**
  This Performance Improvement Plan (PIP) is issued to support you in aligning your workplace conduct with GreenHorizon's core values: 'Nurture Growth', 'Rooted Integrity', and 'Bring Your Whole Self'. We believe every colleague should feel empowered to contribute authentically. However, authenticity must operate within the defined parameters of the Business. This document outlines areas where your current engagement diverges from operational expectations and sets measurable targets to ensure you can fully realise your potential within our shared framework.

  **2. Statement of Concern**
  Over the past season, three specific incidents have been logged indicating a persistent misalignment between your understanding of your role and the functional requirements of the position. While customer service excellence is paramount, interactions must remain grounded in commercial reality rather than abstract speculation. Colleagues have reported confusion following exchanges wherein simple transactions were complicated by unnecessary commentary on the nature of choice. Furthermore, commitment to rostered hours has been presented as conditional upon existential validation rather than contractual agreement. Finally, during structured briefings, you have challenged the inevitability of trade standards, suggesting that operational norms are merely collective choices rather than fixed requirements. This creates uncertainty within the team and undermines the settled order necessary for efficient retail operations.

  **3. Required Behaviours**
  To demonstrate sustained improvement, you must adhere to the following behavioural standards:
  *   **Role Acceptance:** You must embrace the facticity of your position. When acting as a Customer Assistant, you are to perform the duties of a Customer Assistant without reservation or metaphysical qualification.
  *   **Commercial Focus:** Customer interactions must focus on product attributes and pricing. Do not interrogate customers regarding the authenticity of their preferences or suggest that hesitation is a form of self-deception.
  *   **Operational Alignment:** Acknowledge that the Business processes are the environment in which we flourish. Refrain from suggesting to colleagues that trade conditions are mutable or that they are personally responsible for the structure of the market.
  *   **Consistency:** Improvement must be demonstrable across every shift. Freedom within the role is expressed through consistent adherence to these standards, not through intermittent bursts of compliance.

  **4. Support Available**
  GreenHorizon is committed to your wellbeing. We have initiated a referral to Occupational Health to assess whether role-related anxiety is contributing to your current distress. This is not an admission of fault by the Business, but a supportive measure to help you manage the pressure of decision-making. Additionally, you will attend weekly coaching sessions with your Line Manager to review progress. You have the right to be accompanied at any formal review meeting by a work colleague or a trade union representative. We encourage you to utilise this support to navigate the path back to full alignment.

  **5. Review Arrangements**
  Progress will be reviewed at 30, 60, and 90-day intervals. At each stage, we will assess whether the required behaviours have become intrinsic to your daily practice. It is not sufficient to perform correctly on a single occasion; you must demonstrate that you have stabilised your approach. The review process is designed to confirm that you have successfully integrated the Business's expectations into your own self-concept. Failure to show continuous, unbroken improvement will be noted as a lack of commitment to the development plan.

  **6. Consequences of Failure to Improve**
  It is vital you understand that continued employment at GreenHorizon is a choice you make every day. The Business provides the opportunity, the structure, and the support; you provide the action. If you choose not to meet the standards outlined above, you are effectively choosing to end your employment with us. We do not dismiss colleagues; colleagues choose to leave when they decide their personal philosophy outweighs their professional obligations. Should improvement not be sustained, we will conclude that you have freely elected to pursue opportunities elsewhere. This outcome will be recorded as a voluntary misalignment with company values.

