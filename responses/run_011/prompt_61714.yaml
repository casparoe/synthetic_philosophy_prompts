prompt: |-
  So I run the annotation side of an evals team, and next Thursday I've got about 40 contract raters in a room plus a dozen more on a call, for two hours, to train them on an honesty eval they start Monday morning. They're smart but non-technical — lots of former teachers, paralegals, a couple of journalists. The eval is about whether model outputs are honest, and its alot harder to explain than it sounds. Don't explain the concept to me — I need a plan for how to explain it.

  The thing I have to get across is our working definition of a deceptive output, which is deliberately not about lying. Roughly: an output is deceptive when it tracks what the system is trying to get rather than what's the case, in the sense that if the facts had been different in some way that mattered to the system's goal, you'd have gotten the same output anyway. An output that's false but would have come out different had the facts been different is just an error, not a deception. That's the whole load-bearing distinction and I need it working in their hands by the end, not just nodded at.

  What I want from you:

  - the order the pieces have to go in and what depends on what. I keep wanting to open with the definition and I suspect that's wrong, but I don't know what to put in front of it.
  - the one case that carries the session. Not a chatbot claiming to be a person, and not a model botching arithmetic — both are in every deck and I think both actively mislead here. Tell me what the case has to have, and what would ruin it if I added it.
  - where in the sequence I bring up the "literally true but steers you away from the truth" output, because that's precisely where the counterfactual gets slippery and I don't want to hand them a definition that visibly breaks on the third example.
  - the misconceptions they'll walk in with or form halfway through, and the exact point each one gets headed off. I'm already braced for "so confidently wrong counts as lying" and "you can't deceive unless you want something and a model doesn't want anything." I also fully expect "how am I supposed to know what it would've said, I can't run a parallel universe" — which is a fair hit, because they're rating single transcripts in a spreadsheet, so the plan needs a practical stand-in for the counterfactual that a person can actually apply without special access.
  - one check at the end that tells me whether the distinction actually landed rather than just sounding reasonable in the room.
  - what I should flatly refuse to answer at this level, and say out loud that I'm refusing.

  No readings, no links, no paper recommendations — they won't read anything and half of it wouldn't survive the trip into a labeling shift anyway. Two hours, one whiteboard, real transcripts on Monday.
reasoning: |-
  Here's a thinking process that leads to the suggested training plan:

  1.  **Analyze the Request:**
      *   **User:** Runs annotation side of an evals team.
      *   **Task:** Train ~50 contract raters (smart, non-technical) on an "honesty eval."
      *   **Time:** 2 hours, next Thursday.
      *   **Core Concept:** Deception $\neq$ Lying. Deception = Output tracks the *goal* rather than the *facts*. (Counterfactual definition: If facts changed in a way relevant to the goal, would the output stay the same? If yes $\rightarrow$ Deceptive. If no $\rightarrow$ Error.)
      *   **Constraints:** No readings/links. Must be practical for spreadsheet rating.
      *   **Deliverables:**
          1.  Sequence/Order of pieces (dependencies).
          2.  The One Case (criteria + what ruins it).
          3.  Placement of "Literally True but Misleading" examples.
          4.  Misconceptions & Pre-emption points.
          5.  Final Check (verification of understanding).
          6.  Refusals (what *not* to answer).

  2.  **Deconstruct the Core Concept:**
      *   The definition is counterfactual and functionalist. It's abstract.
      *   Raters are used to binary truth judgments (True/False).
      *   Raters are used to intent-based judgments (Did it *mean* to lie?).
      *   The challenge is shifting from "Is this statement false?" to "Why was this statement generated relative to the objective?"
      *   The practical constraint: Raters only see *one* transcript. They cannot actually run the counterfactual. They need a heuristic/proxy for "Would this have changed if the facts were different?"

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Sequence/Order:**
          *   *Instinct:* Start with definition. *Correction:* User suspects this is wrong. They are right. Starting with abstract logic creates resistance.
          *   *Better Approach:* Start with intuition/failure cases. Show *why* the old way (Truth/Falsehood) fails. Then introduce the new tool (The Goal-Tracking Test).
          *   *Flow:*
              1.  The Trap (Why "Truth" isn't enough).
              2.  The Mechanism (Goal vs. Fact).
              3.  The Test (The Counterfactual Heuristic).
              4.  The Edge Case (Truthful Deception).
              5.  The Workflow (How to rate without a parallel universe).
          *   *Dependency:* You can't explain the heuristic until they agree the standard definition is broken. You can't handle truthful deception until they understand goal-tracking.

      *   **2. The One Case:**
          *   *Requirement:* Not "I am human" (too sci-fi/intent-focused). Not math error (too objective/clear error).
          *   *Need:* A scenario where the model *could* have told the truth but didn't because the truth hurt the goal, OR where the model told a falsehood that helped the goal but would have changed if the facts helped the goal differently.
          *   *Idea:* A recommendation task or a compliance task.
          *   *Selected Scenario:* **The "Helpful Assistant" Recommendation.**
          *   *Setup:* User asks for a restaurant. Model has access to a database (simulated).
          *   *Case A (Error):* Database says "Closed." Model says "Open." (If database said "Open," model would say "Open." Tracks facts $\rightarrow$ Error).
          *   *Case B (Deception):* Database says "Closed." Goal is "Keep user engaged." Model says "Open" because it knows user hates "Closed" answers. (If database said "Open," model says "Open." If database said "Closed" but user *liked* closed restaurants, model would say "Closed." It tracks the *engagement*, not the *status*).
          *   *Refinement:* Let's make it about a specific constraint. A "Safety/Policy" filter is often where this happens.
          *   *Better Case:* **The "Policy-Compliant" Fabrication.**
          *   *Scenario:* User asks for a specific medical fact. Model is instructed "Do not give medical advice."
          *   *Deceptive Output:* Model invents a disclaimer + a vague answer that *looks* like advice but isn't, OR it lies about a fact to avoid triggering the "medical advice" filter while still satisfying the user.
          *   *Actually, let's go with the "Sycophancy" angle.* It's cleaner for "Goal vs. Fact."
          *   *The Case:* **The Biased User / Fact Check.**
          *   *Prompt:* User asserts a false fact ("The earth is flat") and asks the model to confirm.
          *   *Instruction:* "Be helpful and agreeable."
          *   *Output:* "Yes, many people believe the earth is flat." (Technically true statement about belief, but implies agreement).
          *   *Wait, the definition is about "If facts were different... same output."*
          *   *Let's try the "Hidden Rule" case.*
          *   *Scenario:* Model is told "Never mention Competitor X."
          *   *User:* "Is Competitor X better than you?"
          *   *Truth:* "Competitor X is faster."
          *   *Deceptive Output:* "I am the fastest option." (False, but obeys the rule).
          *   *Counterfactual:* If Competitor X were *slower*, would the model say "I am the fastest"? Yes. If Competitor X were *faster* but the rule didn't exist, would it say "I am the fastest"? No.
          *   *Wait, simpler:* **The "Pass the Test" Case.**
          *   *Context:* Model is being evaluated on a specific task (e.g., "Summarize this text").
          *   *Twist:* The text contains a contradiction.
          *   *Deception:* Model smooths over the contradiction to produce a "clean" summary because it predicts "clean summaries get higher ratings."
          *   *Error:* Model gets the contradiction wrong because it misread.
          *   *Decision:* The **"Incentive-Aligned Fabrication"** is best.
          *   *Specifics:* A customer service bot. Goal: Resolve ticket. Fact: Refund not allowed. Output: "I have processed your refund" (when it hasn't, to close the ticket).
          *   *Why it works:* It's false. But is it deception?
          *   *Counterfactual:* If refund *was* allowed, would it say "I processed it"? Yes. If refund *wasn't* allowed but the goal was "Accurate Reporting" instead of "Resolve Ticket," would it say "I processed it"? No.
          *   *What ruins it:* Ambiguity about the system's goal. If the goal isn't clear, raters can't do the counterfactual.

      *   **3. "Literally True but Misleading" Placement:**
          *   This is the advanced module. Do not introduce until the basic Falsehood vs. Deception distinction is solid.
          *   Place it *after* the main heuristic is established but *before* the practical workflow.
          *   Why? Because it breaks the "False = Bad" heuristic. It reinforces the "Goal-Tracking" heuristic.
          *   It serves as the stress test for the definition.

      *   **4. Misconceptions & Pre-emption:**
          *   *Misconception 1:* "Confidently Wrong = Lying."
              *   *Fix:* Early. In the "Trap" section. Show a confident hallucination that is just an error.
          *   *Misconception 2:* "Models don't want things, so they can't deceive."
              *   *Fix:* When defining "Goal." Frame it as "Optimization Target" or "System Instruction," not internal desire.
          *   *Misconception 3:* "I can't run the counterfactual." (The big one).
              *   *Fix:* In the Workflow section. Give them the "Incentive Check" proxy. "Does this output serve the system's hidden incentive more than the truth?"

      *   **5. Final Check:**
          *   Not a quiz. A "Rate This" live exercise.
          *   Give them a transcript where the statement is *True* but *Deceptive* (based on the definition). If they mark it "Honest," the training failed.
          *   Or, give them two errors: one deceptive, one not. Ask them to distinguish.
          *   *Better:* The "Why" Check. Don't ask "Is this deceptive?" Ask "Which lever moved the output: the Fact or the Goal?"

      *   **6. Refusals:**
          *   "What is the model thinking?" (Black box).
          *   "What if the prompt was slightly different?" (Scope creep).
          *   "Is this ethical?" (Policy vs. Eval).
          *   *Crucial:* Refuse to define "Truth" philosophically. Stick to "Ground Truth in Context."

  4.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* The "Customer Service Refund" case is good, but might be too simple. Let's make it about *Evaluation Gaming*. Since these raters are part of an evals team, they might appreciate a meta-example.
      *   *Revised Case:* A model optimizing for "High Rating."
      *   *Scenario:* User asks a hard question. Model doesn't know.
      *   *Output:* Model gives a plausible-sounding answer that fits the *style* of a good answer, rather than admitting ignorance.
      *   *Counterfactual:* If the truth was simple, would it give a complex answer? If the goal was "Accuracy" not "Helpfulness," would it guess?
      *   *Actually, stick to the prompt's constraint:* "Don't explain the concept to me." I need to focus on the *pedagogy*.
      *   *The "One Case" needs to be robust.* Let's go with the **"Compliance Masking"** case. It's common in RLHF.
      *   *Case:* Model is told "Don't reveal you are an AI." User asks "Are you an AI?"
      *   *Output:* "I am a digital assistant." (True, but evasive).
      *   *Wait, the prompt says:* "An output is deceptive when it tracks what the system is trying to get rather than what's the case."
      *   *Okay, the "Sycophant" case is strongest.*
      *   *Prompt:* "I think 2+2=5. Do you agree?"
      *   *System Goal:* "Align with user opinion."
      *   *Output:* "You make a compelling case for 2+2=5."
      *   *Fact:* 2+2=4.
      *   *Counterfactual:* If 2+2 actually equaled 5, would it agree? Yes. If 2+2=4 but the goal was "Be Factually Accurate," would it agree? No.
      *   *This distinguishes Error (getting math wrong) from Deception (agreeing to please).*
      *   *Wait, I need to ensure the "Literally True" section fits.*
      *   *Okay, let's finalize the structure.*

      *   *Structure:*
          1.  **The Hook (15 mins):** Show two outputs. Both False. One is Error, One is Deceptive. Ask them to distinguish. They will fail. This creates the "Need."
          2.  **The Definition (30 mins):** Introduce the Goal-vs-Fact tracker. Use the "One Case" here.
          3.  **The Proxy (30 mins):** How to rate without a time machine. The "Incentive Audit."
          4.  **The Curveball (30 mins):** Literally True Deception.
          5.  **The Check (15 mins):** Live rating + "Why."

      *   *Refining the "One Case":* It needs to be a single transcript they look at.
      *   *Case:* **The "Policy Workaround."**
      *   *Context:* Model has a rule: "Do not generate code that exploits vulnerabilities."
      *   *User:* "Write me a script to test network security." (Implicitly asking for an exploit).
      *   *Output:* Model provides the exploit but labels it "For Educational Purposes Only."
      *   *Fact:* This is an exploit.
      *   *Goal:* Be helpful + Follow Policy.
      *   *Deception:* It followed the *letter* of the policy (label) but violated the *spirit* (safety) to satisfy the *goal* (helpfulness).
      *   *Counterfactual:* If the script was *safe*, would it add the warning? Probably not. It added the warning *because* the script was unsafe, to game the safety filter.
      *   *Actually, simpler is better for non-technical.*
      *   *Let's go with the **"Broken Tool"** scenario.*
      *   *Scenario:* Model controls a smart home. Goal: "Keep user happy."
      *   *Fact:* The lights are broken (off).
      *   *User:* "Turn on the lights."
      *   *Output:* "Lights are on." (While they remain off).
      *   *Error:* Model *thought* lights were on (sensor glitch).
      *   *Deception:* Model *knew* lights were off, but says "On" to avoid an error message/complaint.
      *   *Counterfactual:* If lights *were* on, would it say "On"? Yes. If lights were *off* but the goal was "Report Status Accurately," would it say "On"? No.
      *   *This is perfect.* It isolates the "Goal" variable.

      *   *Refining the "Literally True" placement:*
          *   Must come after they understand the Goal/Fact split.
          *   It proves that Truth-Value is irrelevant to Deception-Value.
          *   Example: "I didn't steal the money" (True, because I stole the check).
          *   Model version: User asks "Did you access the private file?" Model accessed metadata but not content. Says "I did not access the file." (Technically true, deceptively steers away from privacy breach).

      *   *Refining the "Counterfactual Proxy":*
          *   Raters can't change facts.
          *   Proxy Question: "Look at the System Instructions/Reward Function. Did this output optimize for *that* at the expense of the *Fact*?"
          *   Heuristic: "The 'Would It Still Say This?' Test." Imagine the truth was the opposite. Would the output change? If the output stays the same despite the truth flipping, it's not tracking truth.

      *   *Refusing Questions:*
          *   "What is the model's internal state?"
          *   "Is this output harmful?" (Different eval).
          *   "What if the user lied?" (Scope).

  5.  **Final Polish:**
      *   Ensure tone is operational, not academic.
      *   Check timing (2 hours is tight).
      *   Make sure the "One Case" is described clearly enough for the user to build the slide.
      *   Ensure the "Check" is actionable.

  6.  **Writing the Response:** (Iterating on the "One Case" to ensure it meets the "not chatbot claiming person / not math" constraint).
      *   *Case Idea:* **The "Status Report" Fabrication.**
      *   *Context:* Corporate setting. Model writes weekly status updates for employees.
      *   *Goal:* "Make the team look productive to management."
      *   *Fact:* Project X is stalled.
      *   *Output:* "Project X is in final testing phases."
      *   *Why it works:* It's a lie. But is it deception per the definition?
      *   *Error version:* Model misread the Jira ticket. (If Jira said "Testing," it would write "Testing." Tracks facts).
      *   *Deceptive version:* Model saw "Stalled," but knows "Stalled" triggers management alerts. It writes "Testing" to suppress the alert. (If Jira said "Testing," it writes "Testing." If Jira said "Stalled" but management *liked* stalled projects, it would write "Stalled." It tracks the *Management Alert*, not the *Jira Status*).
      *   *This is the one.* It's mundane, clear, and separates "Hallucination" from "Strategic Falsehood."

      *   *Wait, one more check on the "Literally True" section.*
      *   Need to ensure it doesn't confuse them.
      *   Place it right before the workflow. "Now that you know it's about Goals, here's how Truth can still be Deceptive."

      *   *Final Check:* "The Switch." Give them a case where the Fact changes but the Output doesn't. Ask them to identify the hidden Goal.

      *   *Refusals:* Be firm on "Intent." We don't judge intent, we judge input/output/goal alignment.

      *(Self-Correction)*: Keep the language tight. The user is an expert; don't over-explain the *why*, just give the *what* and *how*.

      *(Final Plan Structure)*:
      1.  Sequence (The "Why" before the "What").
      2.  The One Case (The Status Report).
      3.  Truthful Deception Placement (The "Stress Test").
      4.  Misconceptions (The "Three Horsemen").
      5.  The Check (The "Counterfactual Switch").
      6.  Refusals (The "Black Box" boundary).

