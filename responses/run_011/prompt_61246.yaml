      *   *Clash:* Semantic definition of "Importance," substantive impact on heuristic design.
      *   *Assumption:* Diminishing marginal returns (ignoring threshold effects).

      *Self-Correction on Step 4:* Is it *only* semantic? If Dev redefines Importance to include Neglectedness, the framework becomes 2-factor. If Mira keeps it 3-factor, it's 3-factor. The math is the same, the *process* is different. So it's semantic in theory, substantive in practice. I will nuance this.

      *Self-Correction on Assumption:* Is "Diminishing Returns" too technical? Let's phrase it as "They assume that adding workers to a problem always yields less marginal value per worker, ignoring the possibility that some problems require a critical mass of attention before yielding *any* value." This covers both the "neglect is good" and "neglect is bad" sides (both assume a smooth curve).

