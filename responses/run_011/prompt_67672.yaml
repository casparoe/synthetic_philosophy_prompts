answer: |-
  ### Part I: The Translation

  Here is the seminar's debate restated in the vocabulary of non-cooperative bargaining and mechanism design.

  **1. The Distinction of Concession (Quantity vs. Participation)**
  *   **Philosophical Claim:** Conceding on *how much* of a good to promote is different from conceding on *whether to participate* in a wrong.
  *   **Economic Restatement:** This distinguishes between a movement along the Pareto frontier and a shift in the feasible set $S$ or the disagreement point $d$.
      *   *Quantity Concession:* A movement along the utility possibility frontier. We are trading off $u_1$ against $u_2$ within a fixed structure of interaction.
      *   *Participation Concession:* A change in the definition of the outcome space $X$. If "participation" is an attribute of the outcome, then agreeing to participate changes the dimensionality of the good being allocated. If "participation" is a constraint, it shrinks the feasible set $S$. If the agent views participation as affirmatively wrong, this may be modeled as a discontinuity in the utility function or a lexicographic preference that renders a portion of $S$ inaccessible.

  **2. The Integrity Objection**
  *   **Philosophical Claim:** The cost of compromise falls on the agent, not the outcome, and cannot be compensated by reciprocal concession because it is not measured in the same units.
  *   **Economic Restatement:** This challenges the assumption of Transferable Utility (TU) and the continuity of preferences.
      *   In a TU setting (e.g., Nash Bargaining with side payments), any loss in utility can be offset by a transfer $t$. The objection asserts that moral utility is strictly Non-Transferable (NTU).
      *   More strongly, it asserts that the utility loss from "compromising integrity" is not commensurable with the utility gain from "policy success." In standard utility theory, if $u_i(\text{compromise}) < u_i(\text{ideal})$, there exists some $x'$ such that $u_i(x') > u_i(\text{ideal})$. The objection claims no such $x'$ exists. This implies a lexicographic ordering or a discontinuity where the marginal rate of substitution between "policy win" and "moral purity" is either zero or infinite at the point of violation.

  **3. Temporal Binding**
  *   **Philosophical Claim:** Compromise binds a party now to votes it will later judge wrong; the agreement trades across time.
  *   **Economic Restatement:** This is a dynamic bargaining problem with time-inconsistent preferences.
      *   Let $u_{i,t}$ be the utility function at time $t$. The agreement at $t_0$ commits the agent to action $a$ at $t_1$.
      *   If $u_{i,t_0}(a) > u_{i,t_0}(\text{disagreement})$ but $u_{i,t_1}(a) < u_{i,t_1}(\text{disagreement})$, the agent faces a time-inconsistency problem.
      *   The "binding" nature of the compromise functions as a commitment device. However, if the preference change is endogenous (the act of compromising changes future preferences), the subgame perfect equilibrium may not exist, or the agent at $t_0$ is effectively contracting with a different agent at $t_1$.

  **4. Incommensurability of Intensities**
  *   **Philosophical Claim:** Talk of gains from trade presupposes cardinally measurable and interpersonally comparable moral convictions.
  *   **Economic Restatement:** This attacks the construction of the Bargaining Set $S$.
      *   To solve for a Nash Bargaining Solution, we require von Neumann-Morgenstern (vNM) utility functions, which are cardinal up to affine transformation.
      *   To claim a "joint gain" or to compare the magnitude of concessions, we implicitly rely on interpersonal comparability.
      *   The objection states that moral preferences may not satisfy the axioms required for a vNM representation (specifically continuity or completeness). If preferences are incomplete, the set $S$ is not well-defined, and the maximization problem $\max (u_1 - d_1)(u_2 - d_2)$ has no domain.

  ***

  ### Part II: The Residue Report

  Here is the sorting of the claims based on how well they survive the translation into economic structure.

  #### Pile 1: Clean Translations
  *These claims map directly to existing economic structures without losing their essential logic.*

  *   **Temporal Binding (Claim 3):** This translates cleanly into **dynamic bargaining with commitment**. The "cost" of binding future votes is the shadow price of the commitment constraint. The worry that one will "later judge it wrong" is precisely the definition of **time inconsistency** (e.g., hyperbolic discounting or endogenous preference change). The economic model captures the tension: the agreement is only sustainable if it is subgame perfect given the *future* utility function, or if there is an enforcement technology that makes reneging too costly. The philosophical worry is simply the recognition that the enforcement technology (one's own integrity) may depreciate over time.

  #### Pile 2: Distorted Translations
  *These claims can be modeled, but only by altering their ontological status. The mapping works mathematically but fails conceptually.*

  *   **The Integrity Objection (Claim 2):**
      *   **The Distortion:** To model this, we must treat "integrity" as an argument in the utility function, e.g., $u_i(x, \text{action}_i)$. We can represent the "cost" as a massive disutility term associated with action $a_{wrong}$.
      *   **Why it is distorted:** In economics, a utility function represents a preference ordering over outcomes. If I include "action" in the function, I am treating integrity as a **preference over action types**. This assumes consequentialism about agency: the "wrongness" is just a negative utility consequence like pain or cost.
      *   **The Philosophical Counter:** The seminar argues the cost is *constitutive*, not consequential. It is not that the outcome is worse; it is that the *agent* is altered. By modeling this as $u_i$, we assume the agent is sovereign over her values and that the "cost" is commensurable with other goods (i.e., there exists *some* policy gain large enough to offset the integrity loss, even if that gain is astronomically high). The philosopher denies this commensurability.
      *   **Transaction Cost or Preference?** It is neither.
          *   It is not a **transaction cost** (friction in reaching agreement), because the cost persists *after* the agreement is reached.
          *   It is not a standard **preference**, because standard preferences assume compensability (continuity).
          *   **Verdict:** It is a **lexicographic constraint** masquerading as a preference. In your vocabulary, you would model this as a boundary on the feasible set $S$ rather than a slope on the indifference curve. However, since the philosophers admit compromise *happens*, it's not a hard boundary. It is a "soft" lexicographic preference that creates extreme non-convexities. The distortion lies in assuming the trade-off exists at all; the economist sees a steep indifference curve; the philosopher sees a category error.

  *   **Concession Types (Claim 1):**
      *   **The Distortion:** We mapped "participation" to a change in the feasible set $S$. However, in bargaining theory, $S$ is usually exogenous. If the act of bargaining *changes* $S$ (by making previously unavailable "wrong" actions available), this is endogenous feasible set formation.
      *   **Why it is distorted:** Standard bargaining takes $S$ as given. The philosophical point is that the *process* of negotiation alters the moral topology of the choice set. Modeling this requires a meta-game where the feasible set is a choice variable, which complicates the definition of the disagreement point $d$. If $d$ includes "no agreement," but "no agreement" preserves integrity while "agreement" degrades it, $d$ is not a fixed vector but a function of the bargaining history.

  #### Pile 3: Inexpressible Claims
  *These claims cannot be expressed in your vocabulary without violating the foundational axioms of the framework.*

  *   **Incommensurability of Intensities (Claim 4):**
      *   **The Failure:** This is **your failure**, not theirs. Your framework *assumes* the Representation Theorem holds. You assume that if an agent chooses, there exists a real-valued function $u$ representing those choices.
      *   **The Philosophical Denial:** The philosophers are denying the **Completeness** and **Continuity** axioms of vNM utility. They are arguing that for some moral propositions, $A \succeq B$ and $B \succeq A$ are both false (incompleteness), or that there is no probability $p$ such that the agent is indifferent between $B$ and a lottery $pA + (1-p)C$ (failure of continuity).
      *   **Consequence:** If preferences are incomplete, the Bargaining Set $S$ is not a convex subset of $\mathbb{R}^2$. It is a cloud of unranked points. The Nash Product cannot be maximized because the objective function is undefined.
      *   **Verdict:** You cannot model this without smuggling in the assumption they are disputing. To write down a bargaining problem is to assert that the intensities are cardinally measurable. If they are not, there is no bargaining *problem*, only a conflict. The economic model resolves the conflict by fiat: it assumes measurability to generate a solution. The philosophical debate is about whether that assumption is licit.

  ***

  ### Part III: Specific Analysis of the Integrity Objection

  You asked specifically whether the integrity objection is a fixed transaction cost, a preference over action types, or something inexpressible.

  **It is not a transaction cost.**
  A transaction cost (like a lawyer's fee or a delay in Rubinstein bargaining) reduces the total surplus available to be split. It is a friction in the *mechanism*. The integrity cost is not a friction; it is a feature of the *allocation*. Even if the agreement is reached instantly and costlessly, the agent suffers the integrity loss. Therefore, it belongs in the utility function, not the constraint set of the mechanism.

  **It is not a standard preference over action types.**
  You can model "I prefer not to vote for X" by including "vote" in the outcome vector $x$. Let $x = (\text{policy}, \text{my\_vote})$. Then $u_i(\text{policy}, \text{vote}_i)$ captures the disutility.
  *However*, this assumes **compensability**. In your framework, if $u_i(\text{bad\_policy}, \text{clean\_vote}) < u_i(\text{good\_policy}, \text{dirty\_vote})$, the agent trades. The utility function implies a Marginal Rate of Substitution (MRS).
  The philosophical claim is that the MRS is undefined or infinite at the threshold of "wrong." It is not that the price is high; it is that the good is not for sale.
  *   **The Distortion:** By modeling it as a preference, you normalize the moral constraint into a trade-off. You make it **consequentialist**. You assume the agent cares about the *state of the world* resulting from the vote, plus a "feeling" about the vote. The philosopher argues the agent cares about the *moral status of the act itself*, which is not a consequence to be weighed, but a constraint on the will.
  *   **Technical Translation:** To capture this without total distortion, you must model the utility function as **discontinuous** or **lexicographic**.
      *   *Lexicographic:* $u_i$ ranks "clean vote" outcomes strictly above "dirty vote" outcomes, regardless of policy payoff.
      *   *The Problem:* Lexicographic preferences cannot be represented by a continuous real-valued utility function. Therefore, you cannot use standard calculus (Kuhn-Tucker conditions) to solve for the bargain. You cannot draw the indifference curves. You cannot define the Pareto frontier in the usual way.
      *   **Conclusion:** It is **inexpressible in standard utility theory** because standard utility theory requires continuity to guarantee existence of equilibrium. It is **expressible in generalized choice theory** only as a constraint that renders parts of the feasible set invisible. But since the philosophers say compromise *does* occur (agents do "sell out"), it implies the constraint is violable. If it is violable, it is a preference. If it is a preference, it is compensable.
      *   **The Residue:** The only way to save the philosophical claim is to argue that the utility function *changes* upon violation. $u_{pre-compromise} \neq u_{post-compromise}$. The cost is not in the outcome; it is in the **path-dependence of the utility function**. This is inexpressible in static bargaining models and requires a model of endogenous preference formation where the act of choosing $x$ alters the function $u(\cdot)$ used to evaluate $x$.

  ### Part IV: Specific Analysis of the Incommensurability Claim

  You asked whether the failure to express Claim 4 is yours (the economist's assumption) or theirs (philosophical vagueness).

  **It is yours.**

  The assumption that "everything relevant is a utility over outcomes" is exactly what is being denied.
  *   **The Economist's Axiom:** Choice implies Preference. Preference implies Representation (under standard conditions). Representation implies Cardinality (for risk/bargaining).
  *   **The Philosopher's Axiom:** Moral Conviction implies Commitment. Commitment may imply **Incompleteness** (I cannot compare my duty to God vs. my duty to Country) or **Non-Archimedean values** (no amount of economic gain offsets a moral sin).
  *   **The Conflict:** When you insist on writing the problem down, you force completeness and Archimedean properties onto the agents to make the math work.
      *   If you write a Nash Bargaining Problem, you have *already assumed* that the parties can compare their utility gains. The Nash Product $(u_1 - d_1)(u_2 - d_2)$ multiplies units of $u_1$ by units of $u_2$. This requires interpersonal comparability of scale (or a normalization that acts as a proxy for it).
      *   If the philosophers say "our values are incommensurable," they are saying "the product is undefined."
  *   **Does the distinction dissolve?** No. The distinction highlights the **normative content of the Representation Theorem**. By modeling them as bargainers, you are implicitly arguing that their moral views *should* be treated as preferences subject to trade. You are imposing a market structure on a moral debate.
      *   If they refuse to assign cardinal values, the bargaining set $S$ is empty.
      *   If you assign the values for them (as a mechanism designer might), you are violating **Incentive Compatibility**. They cannot truthfully report intensities if they believe intensities are not the correct metric.
      *   **Verdict:** The failure is in the **ontology of the economic model**. The model assumes values are resources to be allocated. The philosophers argue values are constitutive of the allocator. You cannot model the constitution of the allocator using the allocator's own utility function without circularity.

  **Summary of the Residue:**
  1.  **Time** is just dynamic bargaining (Clean).
  2.  **Integrity** is a lexicographic preference or endogenous preference change, which breaks standard continuity assumptions (Distorted/Borderline Inexpressible).
  3.  **Incommensurability** is a denial of the Representation Theorem, which makes the bargaining problem ill-posed (Inexpressible/Economist's Assumption).

  The "gains from trade" language presupposes a surplus. The philosophical debate is often about whether a surplus *exists* or whether the appearance of a surplus is an illusion created by ignoring the non-compensable costs of the transaction itself. Your framework assumes the surplus exists by definition of the feasible set $S$ lying above $d$. Their framework questions the construction of $S$.
