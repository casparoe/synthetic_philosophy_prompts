answer: |-
  Here is an analysis of the 2006 IAU resolution through the lens of three competing accounts of natural kinds, followed by an assessment of the counterfactual geophysical definition and the metaphysical significance of the vote.

  ### I. The Three Accounts

  **1. The Homeostatic Property Cluster (HPC) View (Boyd)**
  On the HPC view, a natural kind is not defined by necessary and sufficient conditions, but by a cluster of properties that tend to co-occur due to underlying causal mechanisms (homeostasis). For biological species, the mechanism is reproduction and gene flow; for chemical elements, it is atomic structure.

  *   **Prediction:** The HPC view predicts that the IAU resolution tracked a joint *if* the three criteria (orbiting Sun, hydrostatic equilibrium, clearing the neighbourhood) identify a cluster of properties maintained by a common causal history. The "clearing the neighbourhood" criterion is the linchpin. On an HPC reading, this is not merely a relational accident but a proxy for a specific dynamical history: a body massive enough to dominate its accretion zone. This dynamical dominance is the homeostatic mechanism that correlates with other planetary properties (differentiation, atmospheric retention, satellite systems).
  *   **Where the Machinery Bites:** The HPC view handles the extrinsic nature of the third criterion better than essentialism. If Earth were relocated to the Kuiper Belt, it would arguably cease to be a planet *on this view*, not because its intrinsic nature changed, but because it would no longer participate in the causal mechanism (dynamical dominance of a specific zone) that sustains the property cluster. The kind is defined by the role the object plays in the system's causal architecture. However, the HPC view must admit an anomaly: the vote by a subset of members suggests the "cluster" was not discovered via empirical investigation of mechanisms, but negotiated. If the homeostatic mechanism is objective, the threshold for "clearing" should be calculated, not voted upon. The vote suggests the boundaries of the cluster are pragmatic, even if the cluster itself is real.

  **2. Promiscuous Realism (Dupré)**
  Dupré argues that the world contains countless overlapping structures, and different classifications are legitimate relative to different human interests. There is no single "correct" carving of nature.

  *   **Prediction:** Promiscuous realism predicts that the IAU resolution imposed a joint rather than tracking a unique one. It legitimizes the IAU's dynamical classification as useful for astronomers studying orbital mechanics, while simultaneously legitimizing a geophysical classification (roundness) as useful for geologists studying body composition.
  *   **Where the Machinery Bites:** This account dissolves the tension regarding the third criterion. That a body's status changes if relocated is irrelevant; in the context of *dynamical* interests, the relation to the neighbourhood is what matters. In the context of *geophysical* interests, it is not. The anomaly here is the intensity of the dispute. If both classifications are equally real, the demotion of Pluto should have been a mere administrative reindexing, not an ontological demotion. Dupré's machinery struggles to explain why the practitioners experienced the exclusion of the "dwarf planet as subclass" proposal as a loss of truth rather than a divergence of interest. The vote, on this view, is purely pragmatic: selecting a convention for a specific community, with no metaphysical weight.

  **3. Microstructural Essentialism (Kripke/Putnam)**
  This view holds that natural kind terms are rigid designators fixed by an underlying essence (e.g., atomic number for gold). While originally developed for chemicals and biological species, transposing it to astronomy requires identifying an intrinsic "inner nature" of planets.

  *   **Prediction:** This account predicts that the IAU resolution failed to track a natural kind. The third criterion ("clearing the neighbourhood") is relational and contingent, not intrinsic. If "planet" is a natural kind term, its extension should not depend on where the object is located or what else is nearby (the Twin Earth intuition).
  *   **Where the Machinery Bites:** The machinery bites hard on the relocation thought experiment. If Earth were moved to the Kuiper Belt and failed to clear its orbit, the IAU definition strips it of planethood. For a Kripkean, this implies "planet" is not a natural kind term in the strict sense, because its application depends on contingent surroundings rather than intrinsic essence. If the essence of a planet is its formation history (accretion in a protoplanetary disk), the IAU definition is flawed because it focuses on current dynamical state rather than origin. Consequently, this view treats the resolution as a stipulation. The vote confirms this: essences are discovered, not decided by show of hands. The fact that a vote was required indicates that no essence was found to settle the matter.

  ### II. The Geophysical Counterfactual

  Would any of the three have delivered a different verdict had the union defined planet geophysically (roundness alone)?

  *   **HPC:** Likely indifferent, but with a shift in mechanism. Roundness (hydrostatic equilibrium) is also a property cluster held together by a mechanism (gravity overcoming material strength). An HPC proponent could argue that the "geophysical kind" is just as real as the "dynamical kind." The verdict on whether the IAU *should* have chosen it depends on which causal cluster is more theoretically fruitful for the bulk of astronomy, not on metaphysics.
  *   **Promiscuous Realism:** Completely indifferent. This view explicitly validates the geophysical definition as an alternative, legitimate carving. It would view the IAU's actual choice as merely one valid option among many.
  *   **Microstructural Essentialism:** This is the only view that might prefer the geophysical definition. Roundness is an intrinsic property determined by the body's mass and composition, whereas orbital clearing is extrinsic. If one must transpose "microstructure" to "macro-structure," intrinsic shape is a better candidate for essence than relational dynamics. However, since composition varies wildly among planets (gas vs. rock), even roundness fails to be a strict "microstructural" essence. Thus, even here, the verdict remains that neither definition captures a strict natural kind, though the geophysical one is less objectionable.

  ### III. The Vote and the Grip on Practice

  **1. Indifference to Practitioner Experience**
  If all three accounts treat the choice between dynamical and geophysical definitions as metaphysically permissible (or impermissible) in ways that ignore the practitioners' sense of momentous discovery, it reveals a gap between philosophical taxonomy and scientific taxonomy.
  *   For the **HPC** and **Essentialist**, the vote is epistemic, not ontological. It settles language, not reality.
  *   For the **Pluralist**, the vote is pragmatic.
  *   **The Implication:** If the philosophers are right, the astronomers were confused. They treated a stipulative definition (a decision on how to use the word "planet") as a discovery (a decision on what Pluto *is*). This suggests that while these accounts may have a grip on *metaphysics*, they have a loose grip on *scientific practice*, where the authority to name is often constitutive of the reality studied. In astronomy, unlike chemistry, the classification often precedes the deep theoretical understanding.

  **2. Stipulation Dressed as Discovery**
  *   **Microstructural Essentialism:** Must treat the episode as stipulation. Since no intrinsic essence was identified that necessitated the third criterion, the vote reveals the term "planet" is not a natural kind term.
  *   **Promiscuous Realism:** Treats it as stipulation, but a legitimate one. It is a decision to prioritize one interest (dynamics) over another (geophysics).
  *   **HPC:** Occupies a middle ground. It can treat the vote as an attempt to identify the threshold of a homeostatic cluster. However, because the threshold (how much clearing is enough?) was decided by hands rather than data, it concedes that the *boundaries* of the kind are stipulative, even if the *cluster* is real.

  On all three views, the vote itself has no metaphysical significance. A show of hands cannot alter causal mechanisms (HPC), create or destroy intrinsic essences (Kripke/Putnam), or validate one interest over another as uniquely true (Dupré). Therefore, all three must agree: the episode was a stipulation dressed as a discovery. The anomaly is that the scientific community required the dress.

  ### IV. Judgement: Which Account Earns the Joint?

  The **Homeostatic Property Cluster (HPC)** view earns the right to call this a joint in nature, though with scars.

  The Microstructural view fails because it cannot accommodate the relational nature of astronomical kinds without declaring "planet" a non-natural term, which contradicts the utility the term holds in planetary science. The Promiscuous Realist view succeeds too easily; by validating all classifications, it fails to explain why the dynamical definition gained hegemony and why the exclusion of Pluto felt like a correction of error rather than a shift in perspective.

  The HPC view succeeds because it acknowledges that "planet" picks out a group of bodies that share a causal history (formation and dynamical evolution). The third criterion ("clearing the neighbourhood"), while extrinsic, is the observable symptom of the intrinsic capacity (mass/gravity) that drives the homeostasis of the cluster. It explains why the relocation thought experiment changes the kind membership: moving Earth to the Kuiper Belt removes it from the causal context that sustains the cluster.

  However, the HPC view must accept an honest anomaly: the "mechanism" holding this cluster together was not sufficient to determine the extension without human intervention. The vote reveals that natural kinds in the special sciences often require a stipulative element to fix the boundaries of the cluster where the causal gradients are shallow. The joint is real, but the knife used to carve it was partly forged by a show of hands in Prague.
