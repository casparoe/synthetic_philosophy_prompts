  The fluorescent lights of Room 304 hummed with a headache-inducing flicker. It was 11:45 PM on a Tuesday, and the Collegiate Debate & Governance Society was deadlocked. Again.

  "We need the budget for the keynote speaker," Julian said, tapping his pen against the table. "But we can't get a two-thirds majority. We have twelve members present. We need eight. We have seven."

  "Eight," corrected Priya, not looking up from her laptop. "Article 9. Amendments and budgetary overrides require a two-thirds vote of members *present*."

  "This isn't an amendment, it's a budget override," Julian snapped.

  "Same threshold," Priya said. "The bylaws are clear. We are stuck."

  The club was supposed to be about governance. Instead, it was a monument to stagnation. The current constitution, drafted five years ago by a group of paranoid political science majors, was designed to prevent tyranny. It had succeeded so well it prevented motion.

  Julian leaned forward. "There's Article 14."

  A collective groan rippled around the U-shaped table.

  "Don't," said Marcus, the Treasurer. "We tried this last semester."

  "Last semester we didn't have the votes for unanimity," Julian said. "We do now. Everyone is tired of being stuck. We dissolve the bylaws entirely. Unanimous vote. We hand out a new constitution. Same rules, mostly, but we tweak the amendment threshold."

  "You can't weaken Article 9," Priya said sharply. "Article 11 says nothing may be changed in a way that weakens Article 9. And Article 11 itself cannot be changed."

  "I'm not changing Article 9," Julian said, a smile touching his lips. "I'm deleting it. Along with everything else. Article 14 allows us to dissolve the bylaws *in their entirety* and replace them with a new constitution. The new constitution can have whatever Article 9 it wants. Even a simple majority rule."

  "That's a loophole," Marcus said.

  "It's a door," Julian corrected. "Article 11 protects the walls. It doesn't protect the demolition clause."

  "Try amending Article 11 first," said Leo, leaning back in his chair with his feet on the table. "Just change Article 11 to say 'This article may be amended.' Then use Article 9 to change the voting threshold. Cleaner."

  "It's a trap," Priya said. "Article 11 says 'Article 11 may not be changed.' If you propose an amendment to change Article 11, you are violating Article 11 in the act of proposing it. The Chair would have to rule the motion out of order immediately."

  "Let's try," Leo said. "I move to amend Article 11 to remove the restriction on amending Article 11."

  Priya sighed. "Point of Order. The motion is inherently invalid under the current governing document."

  "Chair?" Leo looked at Marcus.

  Marcus rubbed his temples. "Sustained. You can't use the rules to break the rules that protect the rules."

  "Exactly," Julian said. "Which is why we use Article 14. We don't break the lock. We burn down the house and build a new one with a different lock."

  The vote was called. It wasn't even close. Twelve hands went up. Unanimous. The air in the room shifted, becoming thinner, charged with the static of something illicit. They weren't just changing rules; they were resetting reality.

  Julian slid a stack of papers across the table. "The New Constitution of the CDGS. Article 9 is now simple majority. Article 11 is gone. Article 14 now requires a simple majority to dissolve."

  "And who certifies this?" Priya asked, her eyes narrowing.

  "Mara," Julian said.

  Mara, the Secretary, looked up from her notebook. She had been quietly transcribing the entire ordeal, her keystrokes growing slower as the night wore on. "Me?"

  "Article 16 of the *new* document," Julian said. "Effective upon certification by the Secretary."

  "But..." Mara hesitated. "My authority to certify anything comes from the *old* bylaws. Article 7. Once I sign the new one, the old ones are dissolved. So the moment I sign, I'm signing under an authority that ceases to exist."

  "It's simultaneous," Julian said. "The signature triggers the effect. The effect validates the signature."

  "That's a temporal paradox," Priya said. "If the new constitution takes effect the instant it's certified, then at the exact moment of certification, the old bylaws are dead. Therefore, the office of Secretary is dead. Therefore, the person signing is a private citizen. A private citizen cannot certify a constitution. Therefore, the constitution is void."

  "So we're anarchy?" Leo laughed. "Come on, Priya. We're all here. We agreed. It's fine."

  "It is not fine," Priya insisted. "There is a gap. A fraction of a second where nothing governs us. In that gap, there are no officers. There is no club. Just twelve people in a room."

  "Minutes," Marcus said quietly. "Mara, just put it in the minutes."

  Mara nodded slowly. She turned her laptop screen toward them. She had stopped typing verbatim and started editing in real-time.

  ***

  **OFFICIAL MINUTES – CDGS GENERAL BODY MEETING**
  **DATE:** October 14th
  **TIME:** 11:45 PM – 12:30 AM
  **LOCATION:** Room 304, Student Union

  **I. CALL TO ORDER**
  Meeting called to order by Chair Marcus. Quorum established.

  **II. PREVIOUS ATTEMPTS**
  Motion to amend Article 11 directly was ruled out of order. (See Point of Order 11:48 PM). Reasoning: Self-negating provision.

  **III. MOTION TO DISSOLVE**
  Motion invoked under Article 14 of Old Constitution.
  Vote: 12-0. Unanimous.
  *Note: Motion passes threshold for dissolution.*

  **IV. ADOPTION OF NEW CONSTITUTION**
  New document presented. Contains revised Article 9 (Majority rule).
  *Issue raised regarding Certification Clause (New Art. 16).*
  *Issue raised regarding Secretary Authority (Old Art. 7).*

  **V. CERTIFICATION STATUS**
  Secretary [Mara ~~Vance~~] is required to sign New Constitution to enact it.
  *Query:* Does signature invalidate the signatory's authority retroactively?
  *Legal Counsel Opinion:* None present.
  *Consensus:* ~~Pending~~ Disputed.

  **VI. ADJOURNMENT**
  Meeting cannot be adjourned until status is resolved.
  *Addendum:* If New Constitution is void, Old Constitution is also dissolved by Vote IV.
  *Result:* ~~Organization exists~~ Organization status unknown.

  **Secretary Signature:** ___________________
  **Date:** _______________

  *[Handwritten note in margin: If I sign this, do I fire myself?]*
  *[Second note: If I don't, are we still a club?]*

  ***

  Mara minimized the window. "I can't sign it if I don't know if I'm the Secretary."

  "You are the Secretary because we say you are," Leo said. He stood up, pacing the small room. "Look, the paper doesn't make the club. We make the club. If we all agree Mara is the Secretary, then Mara is the Secretary. The document is just a receipt."

  "That is legally garbage," Priya said. "Authority derives from the charter. If the charter is void, your consensus means nothing. We are just a social gathering. If we vote on anything now, it's not binding. If we spend money, it's embezzlement."

  "Embezzlement from who?" Leo countered. "The account is in the club's name. If the club doesn't exist, the bank freezes the account. So either the club exists, or we're thieves. Do you want to be thieves, Priya?"

  "I want to be legal," Priya said. "And right now, this is a coup."

  "It's a renovation," Julian snapped. "We used the demolition clause. It's legal under the old rules."

  "Only up to the point of certification!" Priya slammed her hand on the table. "The old rules say you can replace the constitution. They don't say you can replace the *logic of authority*. You're trying to use the old key to open a new door, but you're melting the key in the lock."

  The room went silent. The hum of the lights seemed louder.

  Mara looked at the pen on the table. It was a cheap blue ballpoint. "If I sign," she said, her voice quiet, "and Priya is right... then I just signed a piece of paper that says nothing. The new rules don't exist. The old rules are gone. We have nothing."

  "And if I'm right," Leo said, "you sign, and we move on. We get the speaker. We function."

  "But why?" Mara asked. "Why does your reason work?"

  "Because we're here," Leo said. "Because tomorrow morning, we'll all come back to this room. If we act like the club exists, the club exists."

  "That's not law," Priya said. "That's performance."

  "All law is performance," Julian muttered.

  Mara picked up the pen. She hovered it over the line. "If I sign, I am asserting that I have the authority to sign. If the new constitution says I have that authority, but only *after* I sign... then I am creating the authority by using it."

  "Like pulling yourself up by your bootstraps," Marcus said.

  "Exactly," Mara said. "But boots only work if you have legs. Do we have legs?"

  Priya stood up. "Here is the reality. If you sign, you create a gap. In that gap, there is no government. In history, when there is a gap in government, power goes to whoever holds the room. That's not democracy. That's warlordism."

  "We're twelve college students," Leo said. "The worst warlord crime I'm planning is ordering pizza."

  "It's the principle," Priya said. "If we accept that the document is valid despite the paradox, we are admitting that the document doesn't matter. Only the power matters. So why have a constitution at all? Why not just let Julian decide everything?"

  "Because we vote," Leo said.

  "Because we *agree* to vote," Priya corrected. "And right now, we don't agree on the rules of voting."

  Mara looked at the minutes on her screen. The cursor blinked at the bottom of the page. *Organization status unknown.*

  "We have to vote on whether to accept the paradox," Mara said.

  "Under what rules?" Priya asked. "Old rules? We dissolved them. New rules? They aren't active yet."

  "Under the rules of the room," Mara said. "Show of hands. Who accepts the new constitution, paradox and all?"

  "That's a majority vote," Julian said. "If we do that, we're already using the new rules."

  "Then we're doomed," Priya said. "You're assuming the conclusion."

  "Who accepts?" Mara asked, ignoring her. She raised her own hand.

  Julian raised his. Leo raised his. Marcus, after a long pause, raised his. That was four.

  Priya kept her arms crossed. "I cannot validate a void document. My vote would be meaningless."

  "Eight people against," Priya said. "If we use the old rules, you need eight to pass anything. You don't have it. If you force this through with four people, you are breaking the old rules *and* the new ones."

  Julian lowered his hand. He looked at Mara. "If we don't do this, we stay stuck. Forever. The speaker cancels. The club dies slowly."

  "If we do this, the club dies instantly," Priya said. "It becomes a fiction."

  Mara looked at the pen again. She thought about the bank account. She thought about the room key. She thought about the fact that tomorrow, the University would send an email asking for their budget proposal, and someone would have to sign it.

  If she didn't sign, nobody could. The club would starve.
  If she did sign, the club would be a lie. But a functioning lie.

  "Authority comes from the document," Priya said softly. "If the document is broken, the authority is gone. We should adjourn. We should reform from scratch. Register as a new organization. Start clean."

  "That takes six weeks," Julian said. "We lose the funding cycle."

  "Then we are dead anyway," Priya said.

  Mara realized then that Priya was right about the law, but wrong about the survival. Priya wanted the club to be pure, even if it meant it ceased to exist. Leo wanted the club to exist, even if it meant it was corrupt.

  Mara put the pen down.

  "I'm not signing," she said.

  Julian exhaled sharply. "What?"

  "I'm not signing," Mara repeated. "Because Priya's right. The gap is real. If I sign, I'm lying. And if I lie on the minutes, the minutes are worthless. If the minutes are worthless, we have no record. If we have no record, we have no history."

  "So we're done?" Leo asked, disbelief in his voice.

  "No," Mara said. She turned her laptop around. She highlighted the entire section of the minutes regarding the new constitution. She hit delete.

  "What are you doing?" Julian asked.

  "I'm certifying the meeting," Mara said. "I'm certifying that we met. I'm certifying that we voted to dissolve. But I'm not certifying the new constitution. I'm certifying that the vote happened, and that the result was... inconclusive."

  "That's not an option," Julian said.

  "It is now," Mara said. "Because I control the minutes. And the University recognizes the Secretary's minutes as the legal record of the organization. If the minutes say the new constitution wasn't enacted, then it wasn't enacted."

  "But we voted!" Julian stood up. "Unanimously!"

  "And then we found a flaw," Mara said. "So the vote wasn't unanimous on the *implementation*, only on the *proposal*. I'm recording it as a failed implementation."

  Priya sat down slowly. "That... preserves the old bylaws. Technically. Because the dissolution wasn't completed."

  "It keeps us stuck," Leo said, disgusted. "You're choosing the cage over the freedom."

  "I'm choosing the ground over the air," Mara said. "We can't build on a paradox. We stay under the old rules. We find another way. Or we die."

  Julian looked at the table. He looked at the budget sheet. He looked at the pen. He realized that Mara had just wielded more power than any of them. She hadn't used a vote. She hadn't used a loophole. She had used the record.

  "Fine," Julian said. "We stay stuck. But know that you killed the speaker."

  "I kept the club alive," Mara said.

  She clicked 'Save'. The file name remained: `CDGS_Minutes_Oct14.docx`.

  She stood up to pack her bag. The meeting was over. The old bylaws were still in force, heavy and suffocating as a lead blanket. They were legal. They were legitimate. They were dead weight.

  As they filed out into the hallway, Priya walked beside Mara.

  "You know," Priya said, "technically, by refusing to certify, you violated your duty under Article 7. You could be removed."

  "Article 9," Mara said. "Two-thirds vote. We don't have the votes."

  Priya smiled, a thin, sharp thing. "No. We don't."

  They walked into the night, the door to Room 304 locking behind them with a solid, mechanical click. The rules held. The club survived. And nothing would ever change.
