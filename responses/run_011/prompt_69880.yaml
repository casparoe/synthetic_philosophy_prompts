answer: |-
  You have effectively reinvented the engine room of contemporary metaphysics of mind, but you've done something sharper: you've isolated the *argumentative structure* that generates the problem, rather than just the problem itself.

  To answer your primary question: **No, there is not a single, canonical name for this specific meta-move.** There are names for the *problem* it generates (The Causal Exclusion Problem) and names for the *solution* (Token Identity, Realization, Non-Reductive Physicalism), but there isn't a standard label for the diagnostic move you're describing: *noticing that the dispute relies on an unstated assumption about event individuation.*

  However, since you asked for a term if one doesn't exist, and for the boundary conditions where the argument *doesn't* dissolve, I will give you the existing technical landscape, coin a term for the specific meta-structure you've identified, and then draw the boundary you need.

  ### 1. The Existing Landscape (What you've found)

  You are describing the tension between **Causal Closure** (the physical story is complete) and **Causal Efficacy** (the pain did something).

  *   **The Problem:** In the literature, this is the **Causal Exclusion Argument** (most famously formulated by Jaegwon Kim). Kim argues that if the physical cause is sufficient, the mental cause is "excluded" unless it is identical to the physical cause.
  *   **The Dissolution:** The move you described ("it's the same thing under two descriptions") is **Donald Davidson's Anomalous Monism** (specifically, *Token Identity Theory*). Davidson argues that individual mental events *are* physical events, so there is no competition.
  *   **The Granularity:** The specific worry about "finer-grained vs. coarse-grained" is addressed in the literature on **Causal Proportionality** (Stephen Yablo) and **Interventionism** (James Woodward).

  **Why there isn't a single name:** Philosophers usually treat the "slicing" issue as a background metaphysical commitment (Event Individuation) rather than a fallacious argumentative move. They assume their slicing is correct and argue from there. You have noticed that the *argument itself* often hides the slicing decision.

  ### 2. Coined Term: The Ontological Slicing Fallacy

  Since you asked for a name for this specific meta-structure, I propose: **The Ontological Slicing Fallacy** (or **The Individuation Sleight**).

  **Definition:** An argumentative failure where a dispute appears substantive (about who did the work) but is actually contingent on an unstated premise regarding how many distinct entities exist in a given scenario. The dispute dissolves when the interlocutors realize they are counting events differently (e.g., counting one event under two descriptions vs. counting two competing events).

  **How it differs from a Verbal Dispute:**
  *   **Verbal Dispute:** We agree on the facts, but use the word "cause" (or "pain") to mean different things.
  *   **Ontological Slicing:** We agree on the words, but we are implicitly committed to different *ontologies*. One person counts 1 thing (the neurophysiological event described mentally); the other counts 2 things (the neurophysiological event + the mental property). The fallacy is treating the second count as the default without argument.

  **How it differs from Equivocation:**
  *   Equivocation is switching the *meaning* of a term mid-argument.
  *   Slicing is switching the *count* of referents. You aren't changing what "cause" means; you are changing how many candidates for causation you believe exist to bear that relation.

  ### 3. The Boundary: When does the argument NOT dissolve?

  This is the critical part. You suspect some of these arguments survive re-slicing. You are correct. The "dissolution move" only works if the two candidates stand in a specific relation to one another.

  **The Criterion: Modal Distinctness vs. Constitution**

  The argument dissolves **only if** the coarse-grained item (Pain/Recession/Baseball) **constitutes** or is **token-identical** to the fine-grained item (Firing/Decisions/Molecules).

  The argument **survives** if the two items are **modally distinct** (one could exist without the other) or stand in a **causal chain** rather than a constitution relation.

  #### Case A: The Dissolving Class (Constitution/Identity)
  *   **Pain vs. Firing:** If pain *just is* the firing (or realized by it necessarily in this instance), there is only one causal candidate. Competition vanishes.
  *   **Baseball vs. Molecules:** The baseball *is* the molecules arranged baseball-wise. There aren't two projectiles hitting the window.
  *   **Recession vs. Decisions:** The recession *is* the aggregate of those decisions. It is not a ghostly cloud hovering above them.

  *Diagnosis:* In these cases, the "fine-grained" story and the "coarse-grained" story are **competing descriptions of one event**. The Ontological Slicing Fallacy is in play.

  #### Case B: The Surviving Class (Distinct Existences)
  Here is where your "re-slicing" move fails to dissolve the argument.

  **1. Causal Chains (Mediation)**
  *   *Claim:* "My desire caused my hand to move."
  *   *Rival:* "The motor cortex firing caused the hand to move."
  *   *Why it survives:* The desire and the firing are not the same thing. The desire (plausibly) causes the firing, which causes the movement. If you say "They are the same thing," you are making a substantive metaphysical claim (Identity Theory) that can be false. If they are distinct links in a chain, there is a genuine dispute about **which link is the explanatory cause**.
      *   *Test:* Could the firing happen without the desire? (Yes, electrical stimulation). Could the desire happen without the firing? (No, presumably). Because they can come apart, they are distinct existences. The competition is real.

  **2. Overdetermination (Two Sufficient Causes)**
  *   *Claim:* "The lightning caused the fire."
  *   *Rival:* "The oxygen in the room caused the fire."
  *   *Why it survives:* These are not two descriptions of one thing. They are two distinct necessary conditions, or perhaps two sufficient causes (e.g., lightning *and* a dropped match both hit the fuel).
      *   *Test:* If you remove the lightning, does the fire still happen? If yes, the lightning wasn't the sole cause. This is a dispute about **causal selection**, not slicing.

  **3. Multiple Realizability (The Yablo/Woodward Zone)**
  *   *Claim:* "The recession caused the shop closure."
  *   *Rival:* "The landlord's specific decision on March 3rd caused the closure."
  *   *Why it might survive:* This is the tricky edge case. If the recession is *just* the decisions, it dissolves. But if the macro-level pattern (recession) has **counterfactual robustness** that the micro-level lacks, the macro claim is doing work the micro claim cannot.
      *   *Example:* If the landlord hadn't decided on March 3rd, he might have decided on March 4th because of the *recession*. The specific decision is fragile; the recession is robust.
      *   *Literature:* This is **Stephen Yablo's Proportionality Constraint** and **James Woodward's Invariance**. The macro-cause captures a pattern of counterfactual dependence that the micro-cause misses. Here, the argument doesn't dissolve; the macro-cause wins because it is *more informative* about the dependencies, even if it supervenes on the micro.

  ### 4. Who has worried about the Granularity Question?

  You feel like you're reinventing something because you are standing on the shoulders of a few specific people who moved away from the "Mind-Body" specifics to the "Granularity" mechanics.

  1.  **Stephen Yablo ("Mental Causation", 1992):** This is the most important paper for you. Yablo argues that mental causes don't compete with physical causes because they are at different levels of **determinability**. (Red doesn't compete with Scarlet; Red *is* Scarlet determinably). He explicitly tackles the "slicing" issue using the concept of **Proportionality**.
  2.  **James Woodward (*Making Things Happen*, 2003):** Woodward shifts the question from "What is causation?" to "What do we want causation to *do*?" He argues that we select causal grains based on **invariance**. We pick the level of description that remains stable under interventions. This validates the "coarse-grained" story without denying the "fine-grained" story.
  3.  **Christian List & Philip Pettit ("Group Agency", 2011):** They argue specifically about the Recession/Decisions case. They defend **Causal Autonomy** for higher-level properties. They argue that even if the lower level is sufficient, the higher level tracks dependencies the lower level misses.
  4.  **Brad Weslake ("The Exclusion Problem", 2010+):** Weslake explicitly analyzes the exclusion argument as a failure to distinguish between **causal sufficiency** and **causal explanation**. He worries about the granularity of the variables used in causal models.

  ### Summary for your Lab Context

  You have identified **The Ontological Slicing Fallacy**.

  *   **Use this move when:** Someone treats a macro-description (behavior, pain, recession) as a rival entity to its micro-constituents (muscle contraction, firing, transactions).
  *   **Do not use this move when:** The two candidates are modally distinct (one can occur without the other) or stand in a causal chain.
  *   **The Litmus Test:** Ask, "If the micro-story happened exactly this way, *could* the macro-story have been different?"
      *   If **No** (Supervenience/Identity): The argument dissolves. It's slicing.
      *   If **Yes** (Multiple Realizability/Distinctness): The argument survives. It's about explanatory power or causal chains.

  You aren't reinventing the wheel, but you have identified the axle. In the literature, you are gesturing toward **Non-Reductive Physicalism** grounded in **Event Individuation**, but your specific diagnostic of the *argumentative dissolution* is best captured by **Yablo's Proportionality** applied to **Ontological Commitments**.
