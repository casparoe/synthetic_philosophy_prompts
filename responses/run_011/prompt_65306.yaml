answer: |-
  **TO:** Programming Committee
  **FROM:** Chair
  **DATE:** 14 October
  **SUBJECT:** Decision Required: Health Foundation Bereavement Strand (£30k)

  Colleagues,

  We need to vote on the Health Foundation offer in three weeks. The funder requires a yes/no by the end of this month. This memo outlines my recommendation, the conditions attached, and the reasoning behind them. I ask you to read this specifically with our Safeguarding Trustee's objections in mind. I have not written this to manage her concerns, but to meet them head-on.

  **The Safeguarding Objection**
  Our Trustee argues that advertising grief to the bereaved is exploitative, that bereavement is not a genre to be programmed between a poetry slam and a kids' workshop, and that the funder's branding conditions turn human suffering into footfall. She is right to be uneasy. There is a genuine moral hazard here: the risk that we commodify pain to balance a budget, or that we invite vulnerable people into a room we cannot safely hold. If this strand were merely about "content" — sad books for sad people — I would agree with her and recommend we decline.

  However, the local bereavement charity reports their service users have explicitly asked for this. They are not being targeted; they are requesting accompaniment. The question is not whether we offer grief, but *how* we offer it. To answer that, we must decide why bleak art is bearable at all.

  **The Theory of Action**
  There are two stories about why a bereaved person reads a tragic book.
  1.  **Release:** The book stirs the feeling and lets it out. Comfort is discharge.
  2.  **Form:** The book gives the feeling a shape. Comfort is structure — sentences that know where they are going, a narrative that ends, a pace that holds rather than overwhelms.

  I recommend we proceed on the basis of the second story: **Form**.

  If the mechanism were Release, I would recommend declining. Encouraging emotional discharge in a festival setting is clinically risky and difficult to safeguard. But if the mechanism is Form, the book acts as a container. The reader is not being emptied; they are being accompanied. This distinction dictates our conditions. We are not curating for intensity (how sad is it?), but for structure (does it hold?).

  **Recommendation: Accept with Conditions**
  We should take the funding, but only if the following conditions are met. If the funder refuses these, we walk away.

  1.  **Professional Support:** We must insist on a trained counsellor present at every event. Our Trustee worries about people being "undone" in the room. The letter I received about my own book — the woman who had to give her copy away because it undid her at four months — proves this risk is real. A counsellor eats roughly one-third of the grant. We must pay it. Safety is not a line item to be negotiated; it is the price of entry.
  2.  **Branding:** We cannot accept "Grief Season" with faces on posters. This validates the Trustee's fear of turning grief into marketing. We must negotiate for neutral, dignified branding (e.g., "Reading Through Loss"). If the Foundation insists on exploitative imagery or terminology, we decline. We are partners, not vendors of their metrics.
  3.  **Content Notices:** Standard trigger warnings are insufficient. If we are curating for Form, our listings must flag structure. Instead of "contains death," we should write: "Narrative offers resolution" or "Open-ended narrative; no closure provided." This allows attendees to choose based on their capacity for structure, not just their tolerance for sadness.

  **Evidence Gathering**
  We are volunteers, not academics. We cannot measure psychical distance. But we can measure experience. At each event next October, we will distribute simple feedback cards asking two questions:
  *   *Did this book give your feelings a shape?* (Supports Form)
  *   *Did this book help you let your feelings out?* (Supports Release)

  **How the Recommendation Shifts**
  My recommendation to accept rests on the assumption that Form is the dominant mechanism. If next year's evidence shows that attendees primarily experienced Release without containment (reporting feeling "undone" or "in freefall"), we must not renew the strand. If the evidence shows they felt accompanied and structured, we have a model worth keeping.

  **Next Steps**
  *   **By 20 October:** Committee vote on this approach.
  *   **By 25 October:** I will negotiate the branding and counsellor conditions with the Foundation.
  *   **By 31 October:** Final answer to funder.

  This path respects the Trustee's warning by building safety into the architecture of the events, not just the etiquette. It respects the charity's users by giving them the form they asked for. It respects the money by ensuring we don't spend it on something that harms people.

  Please let me know if you have objections before we circulate this for a formal vote.

  Best,

  [Your Name]
  Chair, Programming Committee
