answer: |-
  Your intuition about the structure of contrastive explanation is robust, and your gut verdicts on the nine cases are largely consistent with a rigorous philosophy of social science. The core tension you are feeling—between the desire for comparable units (Case 1) and the fear of triviality or dependence (Case 3)—is the central methodological problem of comparative history.

  Here is the breakdown of your principle, the necessary repairs, and the implications for the field.

  ### The Repaired Principle

  Your tentative principle is close, but it conflates *ontological* requirements (what the units are) with *causal* requirements (how the units relate). To handle your cases, specifically the temporal contrast (6) and the independence problem (3), we need to separate these.

  **The Principle of Valid Contrastive Explanation:**
  A question of the form "Why P rather than Q?" is well-posed if and only if:

  1.  **Existence of Foil:** Q must be a specific, identifiable alternative state, not merely the negation of P. (Motivated by Case 7; excludes "Why at all?")
  2.  **Ontological Parity:** P and Q must be units of comparable scale and type (e.g., region vs. region, polity vs. polity). (Motivated by Case 2 vs. 1; excludes "Britain vs. China".)
  3.  **Causal Independence:** Q must not be causally downstream of P in a way that makes the contrast a matter of diffusion lag rather than origin. (Motivated by Case 3 vs. 4; excludes "Britain vs. Belgium" for origin questions.)
  4.  **Controlled Variation:** P and Q must share a sufficiently large background of common causes to control for confounders, but differ on specific variables capable of explaining the outcome. (Motivated by Case 5 and 9; excludes "Britain vs. Ottoman" [too much noise] and "Britain vs. Scotland" [too little variation/whole-part error].)
  5.  **Pragmatic Asymmetry:** The direction of the contrast determines the presuppositions about what was "expected." (Motivated by Case 8; validates that "Yangzi vs. Lancashire" is distinct from "Lancashire vs. Yangzi".)
  6.  **Temporal Equivalence:** If the contrast is temporal, the periods must represent comparable states of systemic development, not merely earlier/lower stages of the same trajectory. (Motivated by Case 6; qualifies "18th vs. 14th Century".)

  ### The Independence Condition (Case 3 vs. 4)

  Your hunch is correct: the independence clause is real, not rationalization. In causal inference, we require independent trials to isolate variables. Belgium's industrialization was partially a function of Britain's (technology transfer, capital flows,示范 effect). Comparing Britain to Belgium for *origins* is like comparing a inventor to the first licensee; it explains diffusion, not innovation. Holland (Case 4), however, was a competing center of capital and trade that *failed* to industrialize despite having the prerequisites. It is an independent trial that failed. This makes Holland a superior foil for *origins*, while Belgium is a valid foil only for *diffusion speed*.

  ### Verdict Overturns and Defects

  I agree with most of your verdicts, but I would overturn **Case 6**. "Why the 18th century and not the 14th?" is often a disguised "Why at all?" question. If the 14th century lacked the global connectivity or biological prerequisites (e.g., New World crops, silver) that made the 18th century possible, it is not a valid counterfactual state. It is only well-posed if you can argue the 14th century had the *potential* but lacked a specific trigger. I classify it as **Borderline/Conditional**, not automatically "Fine."

  Regarding **Case 5 vs. Case 2**: These are different defects. Case 2 (China) is an **Ontological Defect** (comparing a polity to a region). Case 5 (Ottoman) is a **Signal-to-Noise Defect** (comparing two distinct polities that differ on too many dimensions to isolate a cause). Your principle needs to distinguish "wrong units" from "too much variance."

  ### The Needham Question Payoff

  The original Needham Question ("Why China and not Europe?") is malformed by Clause 2 (Ontological Parity). "China" is a civilization; "Europe" is a continent of competing states. The revisionist move (Yangzi vs. England) **substitutes** the question to **fix** it. It is not the same question semantically, but it is the same question pragmatically (why did the most advanced economy not industrialize?). The field did not answer the original question; it correctly realized the original question was unanswerable and answered the best proxy available.

  ### New Cases Predictions

  1.  **"Why Japan and not China around 1900?"** -> **Well-posed.** Polity vs. Polity, independent trajectories until late 19th C, comparable development levels.
  2.  **"Why did mechanization start in cotton and not in iron?"** -> **Well-posed.** Sectoral contrast within the same economy (controls for institutions/culture).
  3.  **"Why Britain and not France?"** -> **Borderline.** France is large/heterogeneous (Ontological risk), but classic enough to be usable if restricted to Northern France.
  4.  **Stress Test 1: "Why Einstein and not Poincaré?"** -> **Malformed.** Individual agency contrasts are notoriously fragile in structural history; too much noise, too little structural leverage.
  5.  **Stress Test 2: "Why capitalism and not feudalism?"** -> **Malformed.** Teleological. Feudalism isn't a single alternative state but a prior stage; violates Temporal Equivalence.

