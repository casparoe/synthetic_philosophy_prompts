answer: |-
  A. **Brainstorming Field-Features**

  1.  **Spiritual Sanctity:** Victim A is an enlightened being; Victim B is not.
      *   *Test:* Fails Spec 7 (prohibits "disguised-holy-person move").
  2.  **Future Contribution:** Victim A would have cured a disease; Victim B would not.
      *   *Test:* Fails Spec 7 (prohibits appeal to future contribution) and Spec 2 (consequences would differ).
  3.  **Past Karma Reward:** Victim A is suffering due to past bad karma, making harm to them lighter/heavier.
      *   *Test:* Fails Spec 7 (prohibits appeal to victim's past karma).
  4.  **Secret Vow Status:** Victim A has secretly undertaken a binding moral vow that metaphysically weights them as a "field," without altering behavior or appearance.
      *   *Test:* Passes Spec 2 (physical/psychological effects identical), Spec 4 (invisible/unknowable), and Spec 7 (not sainthood, not past karma, not future output).
  5.  **Lineage Membership:** Victim A belongs to a specific spiritual lineage unknown to outsiders.
      *   *Test:* Risky on Spec 7 (implies future contribution or holy status); less clean than Vow.

  *Choice:* **Secret Vow Status.** It isolates the "field" variable (object's standing) without triggering consequentialist calculations or hagiographic tropes. It generates asymmetry purely through the metaphysical weight of the recipient, forcing the tension between intention and object.

  B. **The Scenario**

  Arjun and Ben drive identical cars on identical roads. Both glance at phones for exactly three seconds. Both strike pedestrians crossing legally. Victim A (Arjun's) and Victim B (Ben's) suffer identical compound fractures, identical pain profiles, and identical recovery times. Both drivers feel identical guilt and resolve to drive safely thereafter. No bystanders witness the lapses.

  Unknown to anyone, Victim A has secretly undertaken a lifelong vow of non-violence that metaphysically designates them as a "weighty field." Victim B has not. This vow alters nothing physical, psychological, or social; it is purely a moral-ontological status.

  Under impersonal karmic law (a natural process without a judge), Arjun incurs triple the demerit of Ben. The mechanism is natural, like gravity acting on mass; no deity records the deed. The difference arises solely because the "soil" receiving the harm was denser, amplifying the moral weight of the identical volition.

  C. **Compliance Check**

  1.  **Agents Identical:** Both acts are negligent distraction; intentions, foresight, and character are stipulated identical.
  2.  **Harm Identical:** Physical injury, pain, recovery, and agent dispositions (guilt/resolution) are stipulated identical.
  3.  **Asymmetry via Field:** The only variable is the victim's vow status (field weight), generating heavier demerit for Arjun.
  4.  **Invisibility:** The vow is secret; no inquiry could reveal it (Spec 4).
  5.  **Impersonal:** Mechanism is "natural law," no deity or judge (Spec 5).
  6.  **Realistic:** No miracles or visible ripening; ordinary traffic accident (Spec 6).
  7.  **Prohibitions:** No parents/heinous deeds; no holy person disguise (vow is technical status, not sanctity); no past/future karma appeals (Spec 7).
  8.  **Character Formation:** Ruled out by Spec 2 stipulation that agent dispositions are identical; the demerit difference is external to the psyche (Spec 8).
  9.  **Retributivist Verdict:** Culpability is identical; thus, deserved suffering must be equal (Spec 9).

  D. **Verdicts from Five Positions**

  1.  **Retributivist:** Arjun and Ben deserve equal suffering. Desert tracks culpability (intent/negligence), which is identical; the victim's hidden status is morally irrelevant to the agent's blameworthiness.
  2.  **Karma-Intentionalist:** Resists the verdict. If karma records only volition, the object's status shouldn't matter. They must argue the vow changes the *quality* of the intention implicitly, or restrict the field doctrine to avoid this unfairness. Regarding invisibility: ignorance should mitigate, but the doctrine says it doesn't.
  3.  **Karma-Field+Impersonal:** Arjun incurs heavier demerit. The law is natural; gravity crushes the ignorant just as the informed. Invisibility is irrelevant to the causal maturation of the deed.
  4.  **Karma-Field+Admin:** Arjun incurs heavier demerit initially, but an administrator could waive it based on ignorance. Invisibility matters for judgment, not for the raw karmic fact.
  5.  **Skeptic:** This confirms karma is causal liability, not desert. You are liable for hitting a high-voltage wire even if you didn't know it was live. Invisibility proves the system ignores epistemic conditions required for desert.

  E. **Removal Tests**

  1.  **Agents learn field-difference before acting:** Retributivist verdict shifts (malice increases desert). Karma verdict shifts (intention becomes targeted, increasing demerit further).
  2.  **Field-difference deleted:** Karma verdict equalizes (both incur standard demerit). Retributivist verdict unchanged.
  3.  **Administrator added:** Karma-Field+Admin verdict changes (waiver possible). Impersonal verdict unchanged.
  4.  **Field-difference discoverable afterward:** Retributivist verdict unchanged (past culpability fixed). Karma-Field+Impersonal verdict unchanged (law is blind to discovery).

  F. **Attack and Payoff**

  **Strongest Attack:** The Karma-Intentionalist argues the case begs the question by defining "karmic weight" as external rather than internal. If desert requires control, and the agent lacked control over the victim's status, charging them heavier demerit is not a theory of desert but of unfortunate causality. The case builds in its verdict by stipulating the demerit differs despite identical culpability.

  **Payoff:** A ledger that charges agents in this way counts as a theory of **causal liability**, not moral desert. Desert requires epistemic access and control; liability does not. What turns on this is whether karma can *justify* suffering (retributive) or merely *explain* it (causal). If it is liability, karma loses its normative force as a guide for moral blame.

  G. **Mercy Case**

  Yes. If Agent C harms a "barren field" (a victim with null moral status), karma assigns zero demerit despite identical harm and culpability, whereas retributivism still demands proportional suffering. This design shows karma can be more merciful by decoupling suffering from harm when the field is metaphysically light.
