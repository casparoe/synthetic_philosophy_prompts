      *   *Refining Move 5/6:* This is the clash of "Moral Override" vs. "Category Shift." Tomas thinks the norm bends; Adaeze thinks the act changes.
      *   *Refining Move 7:* Pluralism is a position, not just a cop-out. But it needs to explain the unity of "assertion-like" acts.

      *(Self-Correction during drafting)*: Make sure I explicitly flag the slides requested (correctness vs. consultability, improper vs. criticizable).
