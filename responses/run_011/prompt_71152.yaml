      *(Check on the "1 in 50" figure)*: Is it decorative? No, it quantifies the risk to argue against knowledge. If it were 1 in 1,000,000, she might know. It sets the stakes for the "knowledge" premise.

      *(Check on "What Both Missed")*: They missed the distinction between the *constitutive* norm of assertion and *all-things-considered* justification. They also missed the role of *authority* vs. *evidence*.

      *(Final Polish)*: Ensure no citations (no Williamson, no Lackey, etc.). Keep it internal to the dialogue provided.

  12. **Final Review against constraints:**
