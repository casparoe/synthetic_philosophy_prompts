  # Joint Statement of Adversarial Collaboration: Long-Run Prediction and Resource Dynamics

  **Date:** October 2023
  **Parties:** Systems Modeler (SM), Resource Economist (RE)
  **Facilitator:** Seminar Instructor

  ## 1. Agreed Claims

  The undersigned agree to the following non-vacuous claims as the baseline for further dispute. Claims that merely assert "uncertainty exists" or "data is imperfect" are excluded.

  1.  **Model Function:** The 1972-style world model simulates physical stock-and-flow dynamics (population, capital, resources, pollution) with feedback loops. It does not simulate market clearing mechanisms or price-mediated allocation unless explicitly augmented.
  2.  **Definition of Collapse:** Within the model, "collapse" is defined as a sustained decline in per-capita industrial output and food production resulting from capital diversion to resource extraction or pollution abatement. It is not defined as human extinction, total societal dissolution, or a sudden "cliff" event occurring on a specific calendar date.
  3.  **Historical Price Record:** Real prices for most non-renewable commodities fell or remained stable between 1980 and 2020, adjusted for inflation. This is an empirical fact accepted by both parties.
  4.  **Wager Outcome:** In the Simon–Ehrlich wager (1980–1990), the basket of five metals decreased in real price. The economist won the specific bet.
  5.  **Wager Limitation:** The wager tested price direction over a single decade. It did not test the structural validity of physical depletion constraints over a century, nor did it test the capacity for substitution indefinitely.
  6.  **Logical Form:** The claim "the model predicted X by year Y" is an incorrect logical form for dynamic systems with feedback. The correct form is "the model projects a trajectory range contingent on parameter values, where deviation outside the range implies structural error."
  7.  **Data Ambiguity:** The observed fall in commodity prices is consistent with both (a) successful substitution and technological innovation (RE view) and (b) endogenous model mechanisms delaying depletion signals through capital accumulation (SM view). Therefore, price data alone does not currently discriminate between the two theories.

  ## 2. Disagreements Table

  | id | dispute | modeler_wording | economist_wording | kind | crux | shared_test | modeler_prediction | economist_prediction | resolution_horizon |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | D1 | **Price vs. Physical Cost** | Real prices mask rising physical energy costs of extraction, which will eventually constrain growth. | Real prices reflect true scarcity; if physical costs rose, prices would signal it and trigger substitution before constraint. | Mixed (Word: "Scarcity") | C1 | Trend divergence between real price and energy cost of extraction (EROI). | Energy cost per unit extracted rises >20% over 10 years while price stays flat. | Energy cost per unit extracted remains flat or falls due to tech innovation. | 2035 |
  | D2 | **Substitution Limits** | Substitution is physically bounded; you cannot substitute capital for finite stocks indefinitely. | Substitution is economically bounded; as long as relative prices move, viable substitutes emerge indefinitely. | Genuine | C2 | Rate of substitution vs. rate of depletion for critical inputs. | Substitution rate fails to match depletion rate for a critical resource cluster. | Substitution rate matches or exceeds depletion rate for all critical clusters. | 2050 |
  | D3 | **Falsification Criteria** | The model is falsified only if the structural relationships (feedback loops) are proven invalid, not if timing shifts. | The model is falsified if the projected trajectory misses observable markers by a wide margin without parameter justification. | Mixed (Word: "Falsified") | C3 | Ex-post analysis of model trajectory vs. actual data 2020–2040. | Trajectory enters decline phase without external shock. | Trajectory remains in growth phase without external shock. | 2040 |
  | D4 | **Technology Response** | Technology responds endogenously to stress but with significant lag, allowing overshoot. | Technology responds exogenously to price signals almost instantaneously in investment terms. | Genuine | C1 | Lag time between price signal and supply response. | Lag exceeds 10 years during stress periods. | Lag remains under 5 years during stress periods. | 2030 |

  ## 3. The Precursor Requirement

  Both parties accept the rule that a mechanism producing a visible turn decades out must exhibit measurable precursors now.

  **Modeler Precursor (The "Effort Trap"):**
  *   **Observable:** The Energy Return on Investment (EROI) for primary non-renewable resources.
  *   **Claim:** If the overshoot mechanism is active, we should already observe a decline in EROI that is being masked by technological efficiency gains in extraction.
  *   **Measurement:** A measurable decline in net energy delivered per unit of energy invested in extraction across the top 5 global oil/gas fields, adjusted for technology.
  *   **Threshold:** If EROI has not declined by at least 15% over the 2010–2025 period (adjusted for tech), the "physical constraint" mechanism is weakened.

  **Economist Kill Condition (The "Signal Failure"):**
  *   **Observable:** Real commodity prices vs. Known Reserves.
  *   **Claim:** If the price mechanism works, rising prices must correlate with increased known reserves (via exploration/substitution) within a specific window.
  *   **Measurement:** A persistent rise in real prices of a basket of 10 critical minerals over a 15-year window without a corresponding increase in economically recoverable reserves.
  *   **Threshold:** If real prices rise >50% over 15 years (2025–2040) while known reserves remain flat or decline, the price-substitution mechanism is failing to signal new supply, validating the modeler's concern about physical limits.

  ## 4. Classification of Defensive Moves

  We classify the arguments typically deployed when data appears to contradict our positions.

  | Side | Move | Class | Why |
  | :--- | :--- | :--- | :--- |
  | **Modeler** | "The turn arrives later because technology feedback delays the signal." | Internal Adjustment | Changes the delay parameter within the existing stock-and-flow structure. |
  | **Modeler** | "You are measuring money, not physical throughput." | Redescription | Saves the claim by shifting the metric without exposing new physical predictions. |
  | **Modeler** | "Pollution constraints bind before resource constraints." | Auxiliary Hypothesis | Adds a new variable (pollution) that is independently testable via atmospheric data. |
  | **Economist** | "1980–1990 was an anomalous window; try 1990–2000." | Redescription | Selects a new dataset to preserve the theory without justifying the selection ex-ante. |
  | **Economist** | "Government subsidies distorted the price signal." | Auxiliary Hypothesis | Adds an external factor (policy) that is independently testable via policy analysis. |
  | **Economist** | "The elasticity of substitution is higher than modeled." | Internal Adjustment | Adjusts the parameter governing substitution within the economic framework. |

  ## 5. Verbal Dispute Analysis

  We identify where the fight is about words versus where it is about the world.

  *   **"Collapse":**
      *   *Modeler:* A decline in complexity and per-capita output (relative decline).
      *   *Economist:* Societal failure or absolute destitution (absolute decline).
      *   *Residue:* **Genuine.** They disagree on whether relative decline matters if absolute welfare stays flat.
  *   **"Falsified":**
      *   *Modeler:* Structural invalidity (the loops don't work).
      *   *Economist:* Predictive failure (the date was missed).
      *   *Residue:* **Mixed.** The word "falsified" does damage. **Neutral Replacement:** "Structurally Invalidated" vs. "Empirically Missed."
  *   **"Right but Early":**
      *   *Modeler:* The trajectory is correct, the time-constants were calibrated poorly.
      *   *Economist:* An unfalsifiable shield used to ignore missed predictions.
      *   *Residue:* **Genuine.** This reduces to the Disagreement D3 (Falsification Criteria). If the Modeler cannot specify *why* the timing was off via a measurable parameter (see Section 3), the Economist is correct that it is a shield.

  **Conclusion on Residue:**
  Approximately 40% of the disagreement is verbal (definitions of collapse and falsification). 60% is empirical (trajectory of EROI vs. Price elasticity). The empirical residue is sufficient to justify continued adversarial testing.

  ***

