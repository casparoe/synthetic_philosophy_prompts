  The Behavioral Economics Laboratory at University College invites participants for a two-day protocol on decision stability. Subjects are offered $10,000, transferred at 9:00 AM on Day 2, conditional on a algorithmic prediction made at enrollment (Day 1) regarding whether the subject will still intend at 2:00 PM on Day 2 to drink a harmless but nauseating solution at 10:00 AM on Day 3. The predictor, based on psychometric profiling, has a verified 85% accuracy rate in forecasting intention retention. By the time the act falls due on Day 3, the money is secured and irreversible, and the subject will have no independent reason to drink the solution other than the prior intention itself. Both subjects know all parameters, including the fallibility of the predictor and the absence of future incentives.

  Subject A and Subject B are identical in all external respects and receive the same offer. Both are fully informed of their own psychological histories regarding plan execution. Subject A knows herself to be a "planning agent": she treats formed intentions as exclusionary reasons that resist reconsideration unless significant new information arises, and she knows this trait reliably predicts her future behavior. Subject B knows herself to be a "moment-maximizer": she treats intentions as mere predictions of action and knows that she routinely reopens deliberation at the moment of action, deciding solely on the balance of reasons present at that later time.

  Both subjects deliberate ordinarily without external precommitment devices, drugs, or contracts. They understand that at 10:00 AM on Day 3, the balance of reasons will weigh against drinking. Subject A recognizes that her self-conception allows her to maintain the intention on Day 2 because she knows she will not reopen the question on Day 3. Subject B recognizes that her self-conception forces her to anticipate reopening the question on Day 3, at which point she knows she will not drink. The payoff, the predictor, the timing, and the institutional setting are identical; the sole variance is their self-knowledge concerning the normative force their prior intentions hold over their future deliberation.

  **Analysis**

  The construction succeeds in isolating the deliberative constraint on intention without resorting to stipulation or science fiction.

  (i) **Payoff Table (Expected Utility in $000s)**
  *Assumptions: Reward = 10, Cost of Act = 1, Predictor Accuracy = 0.85.*

  | Strategy | Prediction Outcome | Probability | Monetary Gain | Act Cost | Net Payoff | Expected Value |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Intend & Perform** | Correct (Yes) | 0.85 | 10 | -1 | 9 | **7.65** |
  | | Incorrect (No) | 0.15 | 0 | -1 | -1 | |
  | **Intend & Not Perform** | Correct (Yes) | 0.85 | 10 | 0 | 10 | **8.50** |
  | | Incorrect (No) | 0.15 | 0 | 0 | 0 | |
  | **Not Intend** | Correct (No) | 0.85 | 0 | 0 | 0 | **1.50** |
  | | Incorrect (Yes) | 0.15 | 10 | 0 | 10 | |

  *Note: The table illustrates the incentive structure available to both subjects. The rationality of accessing the "Intend" rows depends on the possibility of intention-formation, not the EV alone.*

  (ii) **Diagnosis**
  Subject A can intend because her self-conception satisfies the **Belief Constraint** on intention (one cannot intend what one believes one will not do). A knows that for her, intentions are stable planning states that filter out reconsideration; thus, she can sincerely believe at Day 2 that she will act at Day 3, not because of the payoff, but because she knows she treats her own intentions as reason-inclusive fixed points. Subject B cannot intend because her self-knowledge violates the Belief Constraint. B knows she treats intentions as mere predictions subject to continuous optimization; since she knows the reasons at Day 3 will not support the act, she knows she will not act. Consequently, she cannot believe she will act, and therefore cannot form the intention, regardless of the incentive.

  (iii) **Differentiating Feature**
  The single feature doing the work is the subject's belief about whether their future self treats prior intentions as exclusionary reasons for action that block further deliberation. If this feature is deleted (both subjects are moment-maximizers), neither can form the intention, and the reward is largely inaccessible (EV 1.5). If bestowed on both (both are planning agents), both can form the intention, making the high-EV strategy (7.65) accessible to both.

  (iv) **Kavka-Style Objection**
  A defender of Kavka would argue that A's resolution is irrational at the time of action (Day 3), as she acts against her current balance of reasons, implying her "plan-stability" is either empty (she won't actually drink) or smuggles in an independent reason (a desire to be consistent). If the latter, the case ceases to be a Toxin Puzzle because there *is* a reason to drink at T2. If sound, this objection generalizes to show that Gauthier-style replies are incoherent: they either rely on irrational action (acting against best judgment) or deny the premise that there are no independent reasons at the time of action. However, if planning agency is constitutive of rationality (à la Bratman), then treating intentions as exclusionary is not an external "reason" but a structural condition of deliberation, preserving the puzzle's integrity.

  (v) **Candid Verdict**
  This case genuinely elicits the two verdicts from the theories rather than merely announcing them, because it forces students to argue about the nature of intention itself (does it require belief? does it create reasons?) rather than swapping intuitions about the toxin. However, it risks shifting the debate to empirical psychology (are there really such people as A?) rather than pure rationality, though the constraint of "self-knowledge" mitigates this by making it a fact about the agent's deliberative architecture.
