  (5) Inês is **partly right**. She correctly notes that empirical evidence trumps terminology and that adaptationists often shoulder insufficient burden of proof. However, she is wrong that the distinction is idle; knowing whether a trait is due to drift or structural constraint dictates different research programmes (population genetics vs. developmental biology). Her focus on burden of proof is strategically sound but tactically misapplied if it prevents mechanistic clarity. This protects the adaptationist from having to disprove every possible non-adaptive cause.

  (6) Tomás is **clearly right**. A strict definition imposes a positive burden on the non-adaptationist. One cannot simply say "no function"; one must demonstrate the structural necessity linking the trait to a primary adaptation. This prevents "just-so stories" from being replaced by "just-so non-stories." It forces the spandrel proponent to provide a generative model, elevating the non-adaptationist claim from skepticism to positive theory. This requires the chin paper to show the mechanical link, not just lack of function.

  (7) Inês is **partly right** for the wrong reason. She is historically correct that San Marco's surfaces are pendentives and that Dennett criticized the analogy. However, this architectural pedantry does not invalidate Tomás's biological point. The biological concept relies on the logic of structural necessity, not the accuracy of Venetian architecture. She uses architectural error to dodge biological precision, winning a historical point while losing the conceptual argument about causal necessity. This distracts from whether the biological analogy holds regardless of architectural history.

  **What both of them missed**
  Both participants treated the chin case as a binary choice between "adaptation" and "spandrel," ignoring the mechanistic specifics of the paper they read. The paper argues for reduced masticatory stress leading to facial remodelling. This is a **developmental constraint** argument, which is subtly distinct from a spandrel. A spandrel typically implies a feature arising from the selection of a *different* trait (e.g., male nipples as byproducts of female breast development). The chin argument is more about physical modelling under reduced load. Neither addressed whether the chin is a inevitable physical consequence (Tomás's requirement) or merely a correlated response. Furthermore, they ignored modularity. If the jaw and chin are developmentally modular, the chin could vary independently, undermining the "necessary byproduct" claim. Finally, both treated selection as a monolith. They missed the possibility of multi-level selection or that the chin might be adaptive now (speech) despite originating as a byproduct (exaptation), which Tomás mentioned but didn't apply to the chin's current utility. The debate remained meta-theoretical when the paper offered a biomechanical model that deserved scrutiny on its own terms. They also failed to discuss whether the "softer diet" hypothesis itself holds empirical water, focusing instead on the labels applied to its consequences.

  **Where I would take it next**
  I would ask: "Given the paper's biomechanical model, is the chin's protrusion an inevitable geometric consequence of jaw shortening under reduced stress, or merely a correlated variation? If we simulate jaw remodelling without selection for chins, do chins always appear?" This forces the group to test Tomás's requirement for structural necessity against Inês's empirical data, moving beyond terminology to the specific causal mechanism proposed. It shifts the debate from defining words to testing models.
