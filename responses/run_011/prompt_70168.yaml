prompt: |-
  I run learning & evaluation at a mid-sized NGO — about 40 staff, $35M a year in programs across four countries. Every quarter I get a pile of requests to spend money finding stuff out: a partner wants a baseline survey, a program team wants a randomised evaluation of our flagship livelihoods intervention, someone wants to commision a study on whether our cash transfers crowd out local labour, the board wants an audit of safeguarding practices at two partner orgs. Right now I decide basically by whoever argues hardest, and I want to stop doing that.

  Give me a decision procedure my team can actually run on a proposal in under an hour, no stats background required. The spine of it should be the decision-theoretic result that free information is never expected to be worth less than nothing (Good's theorem, I think?), plus the corollary I find genuinely useful: information only has value if some possible finding would change what we do. So the first screen should be — list the possible answers, and for each one, whether the decision changes. If none of them change it, stop.

  But I'm pretty sure the theorem has assumptions and our world breaks some of them, so I want the procedure to carry explicit exception tests, phrased as questions a non-theorist can answer, covering the ways information-gathering can come out net negative even when it is decision-relevant. Things like: knowing it would create an obligation or destroy an option we currently have; the act of gathering changing the thing measured (asking people questions changes their behaviour, publishing an indicator creates a target people optimise); us not trusting ourselves to update on the finding sanely, or knowing we'd over-react to a vivid result; the payoff depending on what we believe rather than on how the world is; results arriving after the decision is locked anyway. For each exception test tell me what a sufficient answer looks like, and whether passing it kills the proposal outright or just reclassifies it as something other than an information purchase.

  Then mark where the procedure stops being decision theory and becomes a values call that has to go to a human — whose welfare counts, whether we're permitted to prefer not to know for our own comfort, that sort of thing. And be blunt about which steps are judgment wearing a procedure costume.

  Run it on three proposals: (1) a $250k randomised evaluation of the flagship livelihoods program that our ED is personally attached to; (2) a cheap safeguarding audit at a partner delivering 40% of our reach, where a bad finding triggers mandatory reporting to a donor and probably ends the partnership; (3) a baseline survey whose indicators will end up on a public dashboard with annual targets attached.

  I want at least one of those to come out with an answer I won't like. If the honest application says don't fund the ED's evaluation, say so, and say what it would have to be justified as instead.

  Two more things. If you think I've got the theorem wrong, or that value-of-information is just the wrong frame for some of these categories, say that plainly up front instead of building on my mistake. And for each exception test, tell me how sure you are that it's a genuine failure of the theorem's assumptions rather than an ordinary cost I'm relabelling — I want to know which ones are actually load-bearing.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Head of Learning & Evaluation at a mid-sized NGO ($35M budget, 40 staff, 4 countries).
      *   **Problem:** Ad-hoc decision making on evaluation/research spend ("whoever argues hardest").
      *   **Goal:** A decision procedure runnable in <1 hour, no stats background needed.
      *   **Core Theory:** Value of Information (VoI) / Good's Theorem (free information is never negative *unless* assumptions break).
      *   **Key Constraint:** Information only has value if a finding changes the decision.
      *   **Required Components:**
          *   Screen 1: Decision Relevance (Will findings change actions?).
          *   Exception Tests: Specific ways VoI fails in the real world (obligations, measurement effects, updating failures, timing, etc.).
          *   Classification: Does passing/failing kill the proposal or reclassify it?
          *   Certainty Check: How sure am I that these are *theoretical* failures vs. just *costs*?
          *   Values Boundary: Where does math end and ethics begin?
          *   Bluntness: Identify "judgment wearing a procedure costume."
          *   Application: Run on 3 specific proposals (ED's RCT, Safeguarding Audit, Baseline/Dashboard).
          *   Outcome: At least one unpopular answer (e.g., kill the ED's RCT).
          *   Correction: Correct the user if their understanding of Good's Theorem is wrong.

  2.  **Deconstruct Good's Theorem & VoI:**
      *   *Theorem:* Expected Value of Information (EVI) $\ge$ 0.
      *   *Assumptions:*
          1.  Cost of information is zero (or accounted for separately).
          2.  Agent is a rational expected utility maximizer.
          3.  Agent *will* update beliefs Bayesianly.
          4.  Agent *can* act on the new belief (no external constraints).
          5.  The state of the world doesn't change *because* of the measurement (no observer effect).
          6.  Timing is irrelevant (info arrives before decision).
      *   *User's Intuition:* The user is correct that in the real world, EVI can be negative. This isn't usually a failure of the *math*, but a failure of the *assumptions* (specifically costs, constraints, and psychological/organizational rationality).
      *   *Correction:* I need to clarify that Good's Theorem assumes *free* information. Once cost is introduced, it's Net Value of Information. The "negative value" usually comes from *costs* (financial, reputational, operational) exceeding the benefit, or from the *act* of measuring changing the payoff structure.

  3.  **Drafting the Procedure (The "VoI Filter"):**
      *   *Step 1: The Decision Test (The Core).* If no decision changes, value = 0.
      *   *Step 2: The Cost Test.* Is Cost > Expected Benefit? (Hard to calc, so use proxies).
      *   *Step 3: Exception Tests (The "Real World" Breakers).*
          *   *Observer Effect:* Does measuring change the outcome? (Goodhart's Law).
          *   *Irrevocable Obligation:* Does knowing force a hand we'd rather keep free? (e.g., safeguarding).
          *   *Update Failure:* Will we actually believe the results? (Political reality).
          *   *Timing:* Will results arrive too late?
          *   *Reputational/Existential Risk:* Does a bad result kill the org regardless of truth?
      *   *Step 4: Values Boundary.* Who decides the "utility" function?

  4.  **Developing the Exception Tests (with Certainty Ratings):**
      *   *Test A: The Actionability Constraint.* (Timing/Authority). Certainty: High. If you can't act, info is useless.
      *   *Test B: The Observer/Goodhart Effect.* (Measurement changes behavior). Certainty: High. This violates the "state of world is fixed" assumption.
      *   *Test C: The Forced Hand (Obligation).* (Knowing creates liability). Certainty: Medium/High. This is about cost/risk, not strictly VoI theory, but functionally similar.
      *   *Test D: The Rational Updater.* (Will we ignore the data?). Certainty: High (Organizational behavior). Violates "rational agent" assumption.
      *   *Test E: The Comfort/Blissful Ignorance.* (Preference not to know). Certainty: Low (Values, not theory).

  5.  **Running the Proposals:**
      *   *Proposal 1: $250k RCT on ED's Flagship.*
          *   Decision Relevance: Would we stop the program if it fails? If ED is attached, probably not. -> Fail Decision Test.
          *   Exception: Update Failure (Political will).
          *   Verdict: Don't fund as *evaluation*. Fund as *learning* or *legitimacy*.
      *   *Proposal 2: Safeguarding Audit (High Risk).*
          *   Decision Relevance: Yes (terminate partnership).
          *   Exception: Forced Hand/Obligation. If we find bad stuff, we *must* report, losing 40% reach. Is it better not to know?
          *   Values Call: Duty of care vs. Utilitarian reach.
          *   Verdict: High tension. Likely must do it (legal/ethical), but acknowledge the cost.
      *   *Proposal 3: Baseline for Public Dashboard.*
          *   Decision Relevance: Low. Targets are already set.
          *   Exception: Goodhart's Law. Publishing targets changes behavior to game targets.
          *   Verdict: Reframe as accountability, not information gathering.

  6.  **Refining the "Bluntness" and "Judgment in Costume":**
      *   Need to explicitly state that "Will we actually change our minds?" is a political question, not a math one.
      *   Need to highlight that "Cost" isn't just dollars, it's opportunity cost and risk.
      *   Need to correct the user on Good's Theorem: It applies to *free* information. The user knows this but framing matters.

  7.  **Review against Constraints:**
      *   < 1 hour to run? Yes, if questions are sharp.
      *   No stats background? Yes, focus on decisions, not p-values.
      *   At least one unpopular answer? Yes (The ED's RCT).
      *   Certainty ratings on exceptions? Yes.
      *   Values boundary marked? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, direct, slightly academic but practical.
      *   Structure: Theory Correction -> The Procedure -> The Exception Tests -> The Values Boundary -> The Applications.
      *   Self-Correction on Good's Theorem: I need to be careful. Good's Theorem says EVI $\ge$ 0 *before* seeing the info. It doesn't account for the *cost* of acquiring it. So Net VoI = EVI - Cost. If Cost > EVI, don't buy. But the user is asking about cases where EVI itself is effectively negative (e.g., knowing creates a liability). That's a modification of the utility function, not the theorem. I will clarify this distinction.

      *(Self-Correction during drafting)*: Wait, if knowing creates a liability (e.g., legal requirement to report), that's a *cost* associated with the state of "Knowing". In decision theory, that's just a negative payoff in the decision tree. So it *is* covered by standard VoI if you model the costs correctly. However, for a non-theorist, treating it as an "Exception" is more practical. I will explain this nuance: it's not a failure of the math, it's a failure to account for *all* costs in the simple model.

      *Wait, one nuance on Good's Theorem:* Good's Theorem assumes you *can* act on the information. If you are legally bound to act in a way that reduces utility (e.g., must report abuse, closing a clinic), the *value* of that information to your *programmatic goals* might be negative, even if the *ethical/legal* value is positive. I need to make sure the procedure distinguishes between "Value to the Mission" vs "Value to the Organization's Survival."

      *Let's finalize the Procedure Steps:*
      1.  The Decision Change Test (The Screen).
      2.  The Cost/Benefit Heuristic.
      3.  The Exception Gauntlet (Observer, Obligation, Update, Timing).
      4.  The Values Handoff.

      *Let's finalize the 3 Cases:*
      1.  ED's RCT: Fails Decision Change (won't stop program) & Update Failure. Verdict: Reject as evaluation.
      2.  Safeguarding: Passes Decision Change. Fails "Blissful Ignorance" (Values call). Verdict: Must do, but acknowledge it's compliance, not learning.
      3.  Baseline/Dashboard: Fails Decision Change (targets set). Fails Observer (Goodhart). Verdict: Reject as learning, accept as comms.

      *Certainty Ratings:*
      *   Observer Effect: High (Empirically robust).
      *   Update Failure: High (Organizational psychology).
      *   Obligation/Cost: High (Legal reality).
      *   Blissful Ignorance: Low (Ethical preference).

      *Judgment in Costume:* The "Will we actually change our minds?" question is political theater. The "Value of Mission" vs "Value of Compliance" is ethical.

      Okay, ready to write.
answer: |-
  ### Part 1: A Correction on the Theory

  You are mostly right, but there is a technical distinction that matters for your team's buy-in.

  **Good's Theorem (1967)** states that the *Expected Value of Information (EVI)* is non-negative **assuming the information is free**. It proves that having more data never hurts a rational agent's expected utility *before* they see the data, because they can always choose to ignore it and act as they would have without it.

  **Where your intuition is correct:** In the real world, information is never free, and agents are rarely rational.
  1.  **Cost:** If Cost > EVI, the *Net* Value is negative.
  2.  **Constraint:** If you are not allowed to ignore the information (e.g., legal mandates, donor rules), you lose the option to "act as if you didn't know." This breaks the theorem's assumption that you control the decision policy.
  3.  **Observer Effect:** If the act of measuring changes the underlying probability distribution (e.g., Hawthorne effect, Goodhart's Law), you are no longer evaluating the same intervention.

  **Verdict:** You are not misusing the frame, but you must be clear with your team: **We are not testing if information has value. We are testing if *this specific purchase* of information has *net* value given our organizational constraints.**

  ---

  ### Part 2: The "VoI Filter" Procedure

  **Time required:** 45–60 minutes.
  **Participants:** Program Lead, Evaluation Lead, Finance/Ops Lead.
  **Inputs:** A 2-page concept note (Question, Cost, Timeline, Decision Owner).

  #### Step 1: The Decision-Change Screen (The "So What?" Test)
  *Theory: Information has zero value if it cannot alter a decision.*

  **Ask:** List the 3 most likely findings (e.g., "Program works amazing," "Program works slightly," "Program harms").
  **For each finding, ask:** "What specific decision do we make differently than we would have without this data?"
  *   *Examples:* Stop the program? Scale it? Change the target population? Alter the delivery mechanism?
  *   *Non-examples:* Write a better report? Feel more confident? Explain to a donor why we did what we already decided.

  **Pass:** At least one finding leads to a concrete, different action.
  **Fail:** We would do the exact same thing regardless of the result.
  **Action:** If **Fail**, kill the proposal as an *evaluation*. It may be funded as *communications* or *compliance*, but do not call it learning.

  #### Step 2: The Exception Gauntlet
  *Theory: Real-world frictions that turn positive EVI into negative Net Value.*

  Run the proposal through these five questions. If any answer is "Yes," the proposal is flagged.

  | Exception Test | The Question | Sufficient Answer to Pass | Consequence of Failure | Certainty (Is this a real theoretical break?) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Timing Trap** | Will the results arrive *after* the budget/strategy decision deadline? | "Results land 4 weeks before the next strategic planning cycle." | **Kill.** Information arriving after the decision is worthless for that decision. | **High.** Violates the assumption that info is available *before* action. |
  | **2. The Goodhart/Observer Effect** | Will measuring this indicator change the behavior of staff or beneficiaries in a way that distorts the truth? | "No, the measurement is passive (e.g., admin data) or unannounced." | **Reclassify.** This is no longer "evaluation"; it is "monitoring" or "audit." Expect lower validity. | **High.** Violates the assumption that the state of the world is fixed during measurement. |
  | **3. The Forced Hand (Obligation)** | If we find something bad, are we *legally or contractually forced* to act in a way that hurts our mission more than ignorance would? | "No, we retain discretion on how to respond to findings." | **Values Call.** (See Part 3). This is a risk/cost calculation, not a learning calculation. | **Medium.** Technically a "cost," but often hidden. Functionally breaks the "optional action" assumption. |
  | **4. The Update Failure** | Is there >50% chance the leadership will dismiss the findings if they contradict their prior beliefs? | "The Decision Owner has publicly committed to following the data regardless of direction." | **Kill.** If you won't update your beliefs, you are paying for confirmation, not information. | **High.** Violates the "Rational Agent" assumption. |
  | **5. The Existential Risk** | Could a valid finding destroy the organization's ability to operate (e.g., funding cliff, scandal) even if the program is ethically sound? | "No, the risk is contained to the specific program." | **Values Call.** (See Part 3). This is risk management, not evaluation. | **Medium.** This is about utility function stability, not info value. |

  #### Step 3: The Values Handoff
  *Theory: Decision theory maximizes utility. It does not define whose utility counts.*

  If the proposal passes Steps 1 & 2, it is mathematically sound. However, three questions remain that math cannot answer. These must be escalated to the Executive Director or Board.

  1.  **Whose Utility?** Are we maximizing beneficiary welfare, donor satisfaction, or organizational survival? (e.g., The Safeguarding Audit might hurt beneficiaries short-term by closing a partner, but satisfies donor ethics).
  2.  **Right to Ignorance?** Are we permitted to *not* know something if knowing it causes harm (e.g., finding abuse we lack resources to fix)?
  3.  **Fairness?** Is the burden of data collection (surveys, time) borne by the same people who benefit from the decision?

  **Action:** If these are contested, the Evaluation Lead cannot decide. Escalate.

  ---

  ### Part 3: Where Judgment Wears a Procedure Costume

  Be aware of these two steps where you are pretending to be objective but are actually making value judgments:

  1.  **"Will we actually change our minds?" (Update Failure Test):** This looks like a probability estimate, but it is a **political assessment**. You are assessing the ego strength of the ED or the rigidity of the Board. Calling this a "risk factor" masks the reality: you are auditing leadership's integrity.
  2.  **"What decision changes?" (Decision-Change Screen):** This assumes the *current* planned decision is the only one that matters. Sometimes the value of information is to *create* a new option space (e.g., "We didn't know we could do X"). Strict adherence to this screen can kill innovation. You must allow for "Exploratory" buckets where the decision is "What should we try next?" rather than "Stop/Go."

  ---

  ### Part 4: Running the Proposals

  Here is the honest application of the filter to your three cases.

  #### Proposal 1: $250k RCT on ED's Flagship Livelihoods Program
  *   **Step 1 (Decision Change):**
      *   *Finding:* Program has zero impact.
      *   *Decision:* Does the ED stop the flagship program?
      *   *Reality:* Highly unlikely. The ED is personally attached; it's the "flagship."
      *   *Result:* **FAIL.** The decision (continue program) does not change based on likely findings.
  *   **Step 2 (Exceptions):**
      *   *Update Failure:* High risk. If results are negative, leadership will likely attack the methodology rather than the program.
      *   *Cost:* $250k is ~0.7% of your program budget. High opportunity cost.
  *   **Verdict:** **DO NOT FUND AS EVALUATION.**
  *   **Unpopular Truth:** You cannot justify this as "learning" because you have already pre-committed to ignoring the learning if it's negative.
  *   **Reclassification:** If the ED insists, fund it as **Legitimacy/Marketing**. The value proposition is not "finding out if it works," it is "signaling to donors that we are rigorous." Be explicit about this. Do not promise decision-relevance you cannot deliver.

  #### Proposal 2: Safeguarding Audit at Major Partner (40% Reach)
  *   **Step 1 (Decision Change):**
      *   *Finding:* Safeguarding breaches found.
      *   *Decision:* Mandatory reporting to donor -> Partnership termination.
      *   *Result:* **PASS.** The decision (continue vs. terminate) changes.
  *   **Step 2 (Exceptions):**
      *   *Forced Hand (Obligation):* **FAIL.** You are contractually/ethically bound to act on negative findings.
      *   *Existential Risk:* **FAIL.** Losing 40% of reach could destabilize the NGO.
  *   **Step 3 (Values Handoff):**
      *   This is now a **Values Call**.
      *   *Conflict:* Beneficiary Safety (Audit) vs. Beneficiary Reach (Ignorance/Continuity).
      *   *Decision Theory:* Net Value is likely negative for *programmatic output*, but positive for *ethical compliance*.
  *   **Verdict:** **FUND, BUT ACKNOWLEDGE THE COST.**
      *   Do not call this "Learning." Call it **Compliance/Risk Management**.
      *   You must budget for the *consequence* of the audit (the loss of the partner), not just the audit fee. If you can't afford to lose the partner, you can't afford the audit.
      *   *Blunt Truth:* If you aren't willing to fire the partner, don't audit them. Auditing without the willingness to act is performative ethics.

  #### Proposal 3: Baseline Survey for Public Dashboard with Targets
  *   **Step 1 (Decision Change):**
      *   *Finding:* Baseline is lower/higher than expected.
      *   *Decision:* Do we change the annual targets?
      *   *Reality:* No. Targets are already set for the dashboard.
      *   *Result:* **FAIL.** The data informs the *narrative*, not the *decision*.
  *   **Step 2 (Exceptions):**
      *   *Goodhart/Observer Effect:* **FAIL.** Publishing annual targets based on baseline indicators guarantees staff will optimize for the indicator, not the outcome.
  *   **Verdict:** **DO NOT FUND AS EVALUATION.**
  *   **Reclassification:** Fund as **Communications/Accountability**.
      *   The value is external (donor trust), not internal (program improvement).
      *   *Warning:* Explicitly note in the proposal that this creates a perverse incentive structure for field staff.

  ### Summary of Recommendations

  1.  **Kill the ED's RCT as science.** It fails the Decision-Change screen. Offer to run it as a "Validity Signal" for donors, but strip the budget down to the minimum required for signaling, not the $250k "gold standard."
  2.  **Accept the Safeguarding Audit as Compliance.** It fails the "Free Information" assumption because the information carries a mandatory liability. Budget for the partnership termination, not just the audit.
  3.  **Reject the Baseline as Learning.** It is a marketing tool. Ensure field teams know they are being measured for PR, not program adaptation, so they don't game the data expecting it to help them.

  **Final Note:** Your instinct was right. Good's Theorem assumes a rational agent with free options. You work in a political organization with binding constraints. Use the procedure to expose those constraints, not to pretend they don't exist.
