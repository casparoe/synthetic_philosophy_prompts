prompt: |-
  I work in television, not in a university: I'm the script editor and senior researcher on a six-part documentary series about the man behind the gospels, and my own training is in current-affairs journalism rather than anything ancient. We have a problem I don't know how to solve. Every draft script arrives with two kinds of error baked in. The first is narration that quietly promotes a gospel scene into plain fact, so that a story told once, decades later, by a writer with a theological purpose becomes something our narrator states to twenty million people as history. The second is the opposite failure: a script so covered in hedges that it never says anything, which the network will not broadcast and which I think is dishonest in its own way, since some things really are close to settled while others really are not, and treating them alike is a kind of lie too. What I need is a repeatable procedure my two junior researchers can run on each individual claim before it goes into a script, because we have roughly three hundred of them across the series and about twenty minutes per claim.

  I keep reading that historians in this field use a handful of named tests for whether a piece of material is likelier to have originated early — something about a claim appearing in several sources that don't derive from one another, about material that would have been awkward for the early movement to invent, about material that fits neither the Judaism of the time nor the later church's interests, about consistency with what else passes, and about traces of an Aramaic-speaking Palestinian setting. I don't want a lecture on the debates; I want those ideas, plus whatever else you think belongs, converted into an ordered set of questions with a plain-English answer standard for each: what response counts as passing, what counts as failing, and what makes a question undecidable for us. The procedure must output one of four dispositions — assert in the narrator's voice, attribute on screen to a named source or to a character, present explicitly as contested with both sides, or cut — and it must say what combination of test results produces each one, including the two claims we treat as bedrock (that he was executed under the Roman governor and that he was baptized by John the Baptist) which I suspect will not come out of your tests as the strongest possible cases and which I need explained to my producers. It must also handle our practical constraints: nobody on my team reads Greek or Aramaic, so the procedure needs an explicit rule for what to do the moment the answer turns on the meaning of a single word; every on-screen assertion has to be backed by something we can name in the graphics; and I need a clear marker for the point where the tests run out and the claim goes up to our consulting academic, who reads each script for one day only, so I cannot send him everything.

  Please also be blunt with me about the machinery rather than just delivering it cheerfully. I want the known weaknesses of these tests stated where they actually bite in the workflow — that a test keyed to awkwardness depends on guessing what a first-century movement would have found awkward, that a test keyed to dissimilarity from both sides can leave you with a figure who belongs to no world at all, that the tests tend to favour sayings over deeds and to say nothing whatever about chronology, about how often something happened, or about what a man thought he was doing — and I want a short list of the steps that are really judgment calls wearing a procedure's clothes. Then run the whole thing on three cases, showing the reasoning at each step and the disposition at the end: that he caused a disturbance in the Temple in Jerusalem during his final week; that he expected the world as it stood to end within the lifetime of his hearers; and, as the one where your answer will annoy me, the claim our marketing department has been pushing for the trailer, that he was married — for which the only documentary support my researchers can point to is a small papyrus scrap that surfaced in the press some years ago and whose authenticity most of the experts who examined it dispute, plus the argument that everyone around him in that society was married. If the procedure says cut, say cut, and tell me what I would have to be able to show before it would say otherwise.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Script Editor/Senior Researcher on a 6-part TV documentary about Jesus ("the man behind the gospels").
      *   **Background:** Current-affairs journalism, not academia/ancient history.
      *   **Problem:** Scripts oscillate between treating gospel stories as plain fact (theological purpose = history) and over-hedging (dishonest ambiguity).
      *   **Need:** A repeatable procedure (checklist/algorithm) for junior researchers to evaluate ~300 claims (20 mins/claim).
      *   **Inputs:** Historical criteria (Multiple Attestation, Embarrassment, Dissimilarity, Coherence, Semitic Context/Palestinian Environment).
      *   **Outputs:** One of four dispositions:
          1.  Assert (Narrator voice).
          2.  Attribute (On-screen to named source/character).
          3.  Contested (Explicitly present both sides).
          4.  Cut.
      *   **Constraints:**
          *   No Greek/Aramaic skills (need a rule for linguistic dependence).
          *   On-screen assertions need nameable graphic backing.
          *   Triage for the Consulting Academic (1 day only, can't see everything).
          *   Must explain the "Bedrock" claims (Execution under Pilate, Baptism by John) even if tests don't rank them highest.
          *   Must be blunt about weaknesses/limitations of the tests.
          *   Must identify "judgment calls wearing a procedure's clothes."
      *   **Test Cases:**
          1.  Temple Disturbance (Final Week).
          2.  Apocalyptic Expectation (End within lifetime).
          3.  Marriage Claim (Marketing push, *Gospel of Jesus's Wife* fragment + cultural norm argument).
      *   **Tone:** Professional, blunt, practical, not academic lecturing.

  2.  **Deconstruct the Historical Criteria (The "Machinery"):**

      *   *Multiple Attestation:* Is it in more than one independent source? (Mark, Q, Paul, John, Josephus, Tacitus).
      *   *Embarrassment (Discontinuity/Criterion of Embarrassment):* Would the early church have invented this? (e.g., Baptism by John implies subordination).
      *   *Dissimilarity (Distinctiveness):* Is it unlike Judaism *and* unlike the later Church? (Risk: makes Jesus an alien).
      *   *Coherence (Consistency):* Does it fit with other data that passes the tests?
      *   *Semitic Context/Palestinian Environment:* Does it fit 1st-century Galilee/Judea linguistically/culturally?
      *   *New Addition:* *Enemy Attestation* (Did opponents acknowledge it?) & *Archaeological/Epigraphic Corroboration* (Can we point to a stone/inscription?).

  3.  **Develop the Procedure (The "Algorithm"):**

      *   Need a scoring system or a flow chart. A flow chart is better for "disposition."
      *   Need to handle the "Linguistic Wall" (No Greek/Aramaic). Rule: If the claim rests on a translation nuance, immediate "Consultant Review" or "Attribute/Cut."
      *   Need to handle the "Bedrock" exception. These are consensus views despite specific criterion scores.
      *   Need to define the four dispositions clearly based on test outcomes.

  4.  **Drafting the Procedure Steps:**

      *   *Step 1: Source Check.* Where does this come from? (Gospel? Paul? Non-Christian?)
      *   *Step 2: The Linguistic Wall.* Does it hinge on a word meaning?
      *   *Step 3: Apply the Five Tests.* (Multiple, Embarrassment, Dissimilarity, Coherence, Context).
      *   *Step 4: Scoring/Disposition Logic.*
          *   High Score + Consensus = Assert.
          *   High Score + Debate = Attribute/Contested.
          *   Low Score = Cut/Attribute.
      *   *Step 5: The "Bedrock" Override.*
      *   *Step 6: Consultant Triage.*

  5.  **Addressing the Weaknesses (The "Blunt Truth"):**

      *   Embarrassment is subjective (what embarrassed *them*?).
      *   Dissimilarity creates a weirdo Jesus.
      *   Tests favor sayings over actions.
      *   Tests don't do chronology or frequency.
      *   "Consensus" isn't truth, just agreement.

  6.  **Addressing the "Bedrock" Claims:**

      *   *Crucifixion under Pilate:* Tacitus + Josephus + Multiple Gospels + Paul. It's an enemy attestation + multiple attestation.
      *   *Baptism by John:* Embarrassment criterion (why invent a superior?). Multiple attestation.
      *   *Why they might fail specific tests:* Dissimilarity (Baptism fits Jewish ritual), Coherence (depends on other data). But the *weight* of evidence is overwhelming.

  7.  **Running the Test Cases:**

      *   *Case 1: Temple Disturbance.*
          *   Sources: Mark (all), John (different version), Gospel of Peter?
          *   Embarrassment: Yes (leads to arrest).
          *   Context: Fits Passover tension.
          *   Verdict: Assert or Attribute? Probably Assert with nuance ("caused a disturbance" vs "cleansed").
      *   *Case 2: Apocalyptic Expectation.*
          *   Sources: Mark 13, Q material.
          *   Embarrassment: Yes (didn't happen).
          *   Dissimilarity: Yes (Church had to explain the delay).
          *   Verdict: Assert (Historical Jesus consensus is strong here, even if theology disagrees).
      *   *Case 3: Marriage.*
          *   Sources: *Gospel of Jesus's Wife* (forgery/disputed), Gnostic gospels (late), Silence in Paul/Gospels.
          *   Argument: "Everyone was married." (Argument from silence/norm).
          *   Linguistic Wall: *Gunē* (wife/woman).
          *   Verdict: Cut. (Marketing wants it, history says no).

  8.  **Refining the Output:**

      *   Make it look like a production document.
      *   Ensure the "20-minute limit" is respected (keep steps tight).
      *   Ensure the "Consultant Triage" is clear (when to bother him).
      *   Check tone: Journalistic, rigorous, not theological.

  9.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the scoring too complex for 20 mins?
      *   *Fix:* Simplify to Pass/Fail/Neutral per test.
      *   *Critique:* How to handle the "Bedrock" explanation to producers?
      *   *Fix:* Add a specific section explaining *why* these pass despite the tests (External Corroboration).
      *   *Critique:* The Marriage case needs to be firm.
      *   *Fix:* Emphasize the "Argument from Silence" weakness and the specific forgery status of the papyrus.
      *   *Critique:* Did I include the rule for Greek/Aramaic?
      *   *Fix:* Make it a "Stop/Refer" rule in Step 2.

  10. **Final Polish:** Check against all constraints in the prompt (4 dispositions, 3 test cases, weaknesses, bedrock explanation, linguistic rule, consultant triage). *Self-correction: Ensure I explicitly state what combination of results leads to which disposition.*

  *(Self-Correction on the "Bedrock" logic)*: The prompt says the user suspects these won't come out as the strongest possible cases *from the tests*. This is astute. Crucifixion isn't "embarrassing" in the same way baptism is (it's necessary for salvation theology). Baptism fails "Dissimilarity" (it's a Jewish ritual). I need to explain that *External Attestation* (Tacitus/Josephus) overrides the internal gospel criteria for these two.

  *(Self-Correction on Marriage)*: The prompt mentions the "Gospel of Jesus's Wife." I need to be clear that most scholars consider it a modern forgery. If the researchers can't verify the Coptic, they hit the "Linguistic Wall."

  *(Final check on tone)*: "Blunt with me about the machinery." Don't sell the criteria as magic truth-detectors. Call them probability indicators.

  Let's assemble the document.cw
answer: |-
  **DOCUMENT: HISTORICAL CLAIM VERIFICATION PROTOCOL (HCVP)**
  **TO:** Script Editor, Junior Researchers
  **FROM:** Senior Research / Historical Methodology
  **SUBJECT:** Procedure for Evaluating Historical Assertions (300 Claims)
  **TIME ALLOWANCE:** 20 Minutes per Claim

  ### PART 1: THE MACHINERY AND ITS WEAKNESSES
  You are using tools designed by historians to estimate probability, not truth. They are probability filters. They work better for *sayings* than *deeds*. They tell you almost nothing about chronology, frequency, or internal motivation.

  **The Five Tests (The "Criteria"):**
  1.  **Multiple Attestation:** Does this appear in two or more independent sources (e.g., Mark AND Paul; or Gospels AND Josephus)?
  2.  **Embarrassment:** Is this something the early Church would likely *not* invent because it made them look bad or subordinate?
  3.  **Dissimilarity:** Is this unlike typical Judaism of the time AND unlike the later Church's theology? (Warning: Passing this makes Jesus an alien. Use with caution).
  4.  **Coherence:** Does this fit with other data that has already passed the tests?
  5.  **Palestinian Context:** Does this fit the language, geography, and culture of 1st-century Galilee/Judea?

  **Known Weaknesses (Where the machinery bites):**
  *   **Subjectivity:** "Embarrassment" requires guessing what a 1st-century follower found awkward.
  *   **The "Alien Jesus" Trap:** If you demand *Dissimilarity* too strictly, you end up with a man who fits nowhere.
  *   **Silence:** These tests cannot prove something *didn't* happen.
  *   **The Language Wall:** If a claim hinges on a translation nuance (e.g., *gunē* meaning "woman" vs. "wife"), our team cannot verify it.

  ---

  ### PART 2: THE PROCEDURE (20-Minute Workflow)

  **STEP 1: THE LINGUISTIC WALL (Time: 2 mins)**
  *Question:* Does the truth of this claim depend on the translation of a single Greek, Aramaic, or Hebrew word?
  *   **YES:** **STOP.** Do not draft narration. Mark claim as **"REFER TO CONSULTANT."** (We cannot verify this in-house).
  *   **NO:** Proceed to Step 2.

  **STEP 2: SOURCE MAPPING (Time: 5 mins)**
  *Action:* Identify the earliest source(s).
  *   **List:** Which documents contain this? (e.g., Mark, Q, Paul, Josephus, Tacitus, Gospel of Thomas).
  *   **Check:** Are they independent? (Matthew copying Mark does *not* count as multiple attestation).
  *   **Graphic Check:** Can we name the source on screen? (If the only source is "Anonymous Oral Tradition," you cannot graphic it. Mark as **"ATTRIBUTE"** minimum).

  **STEP 3: APPLY THE FIVE TESTS (Time: 8 mins)**
  *Action:* Mark each test as **PASS**, **FAIL**, or **N/A**.
  *   **Multiple Attestation:** PASS if ≥2 independent sources.
  *   **Embarrassment:** PASS if it creates a theological problem for the writer (e.g., Jesus baptized by a subordinate).
  *   **Dissimilarity:** PASS if it fits neither standard Jewish piety nor later Christian doctrine.
  *   **Coherence:** PASS if it aligns with other "PASS" claims.
  *   **Context:** PASS if it fits archaeological/cultural data (e.g., Pilate's existence, fishing methods).

  **STEP 4: DISPOSITION LOGIC (Time: 5 mins)**
  *Select one of the four outputs based on the combination below:*

  | Disposition | Required Test Results | Narration Standard |
  | :--- | :--- | :--- |
  | **1. ASSERT** | **Multiple Attestation** (PASS) + **Context** (PASS) + **Embarrassment** (PASS or N/A). <br> *OR* <br> **Bedrock Override** (See Part 3). | "Jesus did X." (Definitive). |
  | **2. ATTRIBUTE** | **Multiple Attestation** (FAIL) but **Context** (PASS). <br> *OR* <br> Claim relies on a single gospel narrative with no external corroboration. | "According to Mark..." or "The Gospel of John describes..." |
  | **3. CONTESTED** | **Multiple Attestation** (PASS) but **Embarrassment** (FAIL) + **Dissimilarity** (FAIL). <br> *OR* <br> Significant scholarly division (50/50 split). | "Some historians argue X, while others maintain Y." |
  | **4. CUT** | **Multiple Attestation** (FAIL) + **Context** (FAIL). <br> *OR* <br> **Linguistic Wall** (STOP in Step 1) + Consultant unavailable. <br> *OR* <br> Source is widely considered a forgery. | Remove from script. |

  **STEP 5: CONSULTANT TRIAGE**
  *Send to Academic Consultant ONLY if:*
  1.  Step 1 triggered the **Linguistic Wall**.
  2.  The claim is **Bedrock** (Part 3) but producers are challenging it.
  3.  The disposition is **CONTESTED** and you need the specific names of the opposing scholars for the graphic.
  *Do not send:* Clear CUTS or clear ASSERTS based on consensus.

  ---

  ### PART 3: THE "BEDROCK" OVERRIDE
  **Claims:** (1) Executed under Pontius Pilate. (2) Baptized by John the Baptist.
  **Problem:** These may not score perfectly on *Dissimilarity* (Baptism is Jewish) or *Embarrassment* (Crucifixion became necessary for theology).
  **Resolution:** These claims pass on **External Enemy Attestation** and **Consensus Weight**, which overrides the standard Five Tests.

  *   **Execution under Pilate:**
      *   **Sources:** Tacitus (Roman historian, hostile), Josephus (Jewish historian), Paul (early letters), All 4 Gospels.
      *   **Logic:** A Roman historian and a Jewish historian both confirm the Roman Governor ordered the death. This is not theological invention; it is administrative record.
      *   **Disposition:** **ASSERT**.
      *   **Graphic:** "Annals of Tacitus," "Antiquities of the Jews."
  *   **Baptism by John:**
      *   **Sources:** Mark, Q, John, Josephus.
      *   **Logic:** **Embarrassment Criterion.** The early Church struggled to explain why the Son of God submitted to a human prophet. They would not invent this subordination.
      *   **Disposition:** **ASSERT**.
      *   **Graphic:** "Gospel of Mark," "Antiquities of the Jews."

  **Note to Producers:** If you ask why these are "facts" while other gospel stories are "stories," the answer is *Hostile Corroboration*. We have non-Christian sources confirming the execution, and a theological embarrassment confirming the baptism.

  ---

  ### PART 4: TEST CASES (Run-Through)

  #### CASE 1: The Temple Disturbance (Final Week)
  *Claim:* Jesus caused a disturbance in the Temple in Jerusalem during his final week.

  1.  **Linguistic Wall:** No. (Action-based, not word-based).
  2.  **Source Mapping:** Mark (11:15), Matthew (21:12), Luke (19:45), John (2:14 - *different timing but same event*), Gospel of Peter.
      *   *Independence:* Mark, John, and Gospel of Peter represent independent traditions.
      *   *Graphic:* "Gospel of Mark," "Gospel of John."
  3.  **Five Tests:**
      *   Multiple Attestation: **PASS** (Mark + John + Peter).
      *   Embarrassment: **PASS** (This is the direct cause of his arrest; inventing a crime that gets him killed is risky, though some argue it's necessary for the passion narrative. However, the specific violence is volatile).
      *   Dissimilarity: **N/A** (Violent protest fits Jewish zealotry).
      *   Context: **PASS** (Passover tension in Jerusalem is historically attested; Roman garrisons reinforced during festivals).
      *   Coherence: **PASS** (Fits with execution by Rome for sedition).
  4.  **Disposition:** **ASSERT**.
      *   *Nuance:* Narrator says "Jesus caused a disturbance," not "Jesus cleansed the Temple" (which implies theological success).
      *   *Reasoning:* Multiple independent sources + fits Roman response pattern.

  #### CASE 2: Apocalyptic Expectation
  *Claim:* Jesus expected the world as it stood to end within the lifetime of his hearers.

  1.  **Linguistic Wall:** No. (Conceptual).
  2.  **Source Mapping:** Mark 13, Q Material (Luke 17/Matt 24), Paul (1 Thessalonians).
      *   *Graphic:* "Gospel of Mark," "Letter to the Thessalonians."
  3.  **Five Tests:**
      *   Multiple Attestation: **PASS** (Mark + Q + Paul).
      *   Embarrassment: **PASS** (The world did *not* end. The Church had to invent explanations for the delay. They would not invent a failed prophecy).
      *   Dissimilarity: **PASS** (Later Church moved to "end of time" theology, not immediate).
      *   Context: **PASS** (Apocalypticism was common in 1st-century Judea).
      *   Coherence: **PASS** (Fits with Baptism by John, who was also apocalyptic).
  4.  **Disposition:** **ASSERT**.
      *   *Reasoning:* This is the strongest historical case we have. The "Embarrassment" score is maximal because the prophecy failed.
      *   *Note:* This will annoy religious consultants. Stand firm. The tests support this more than almost any miracle claim.

  #### CASE 3: The Marriage Claim (Marketing Push)
  *Claim:* Jesus was married.
  *Evidence:* *Gospel of Jesus's Wife* fragment + "Everyone was married" argument.

  1.  **Linguistic Wall:** **YES.**
      *   *Issue:* The fragment is Coptic. The phrase "Jesus said to them, my wife..." hinges on the authenticity of the ink and the grammar.
      *   *Rule:* Step 1 triggers **STOP**.
  2.  **Source Mapping (Hypothetical if Step 1 didn't stop us):**
      *   *Sources:* *Gospel of Jesus's Wife* (4th century, surfaced 2012). No mention in Paul, Mark, Q, John, Josephus, or Tacitus.
      *   *Independence:* **FAIL**. (Only one late source).
      *   *Graphic:* Cannot name a credible source.
  3.  **Five Tests:**
      *   Multiple Attestation: **FAIL**.
      *   Embarrassment: **N/A** (Celibacy wasn't the norm then, so marriage isn't embarrassing; celibacy *later* became the norm).
      *   Dissimilarity: **FAIL** (Marriage fits Judaism, but silence fits the early movement's focus).
      *   Context: **FAIL** (Argument "everyone was married" is an argument from silence. Paul explicitly argues *for* celibacy in 1 Corinthians 7, suggesting it was an option known to the movement).
      *   Coherence: **FAIL** (Contradicts the silence of all earlier texts).
  4.  **Disposition:** **CUT**.
      *   *Reasoning:* Fails Step 1 (Linguistic Wall). Fails Multiple Attestation. Source is widely disputed as a modern forgery (Harvard Divinity School review, 2016).
      *   *Requirement to change to ATTRIBUTE:* You would need a pre-2nd century manuscript fragment, verified by carbon dating and paleography independent of the current owner, that explicitly mentions a wife *and* survives peer review in a major journal.
      *   *Requirement to change to ASSERT:* Impossible with current evidence.

  ---

  ### PART 5: JUDGMENT CALLS WEARING PROCEDURE CLOTHES
  *Be aware: The following steps are not math. They are expert guesses.*

  1.  **Defining "Independence":** Deciding if Matthew and Luke are using Mark *and* Q, or just Mark, changes the "Multiple Attestation" score. *Rule of Thumb:* If the wording is nearly identical, count it as one source.
  2.  **Defining "Embarrassment":** We are guessing what embarrassed a 1st-century Jew. *Rule of Thumb:* If the text itself seems to apologize for or explain away the event (e.g., John the Baptist protesting baptizing Jesus), count it as Embarrassment.
  3.  **The "Consensus" Trap:** Consensus can be wrong. *Rule of Thumb:* If the Consultant disagrees with the "Assert" disposition, default to **CONTESTED** for the script. It protects the network.

  **FINAL INSTRUCTION TO RESEARCHERS:**
  If a claim feels like theology, it probably is. If a claim feels like a police report (Pilate, Crucifixion, John the Baptist), it might be history. Use the tests to separate the two. If the tests are inconclusive, **ATTRIBUTE** or **CUT**. Do not **ASSERT** unless the evidence forces you to.
