      *   *(2) Epistemic Possibility:* The set of *all* functions represents "epistemic possibilities" (what could be true). Averaging over them is "declining to adopt an assumption" (Principle of Indifference).
      *   *(3) Relativity:* Performance is only determinate relative to a prior over functions.
      *   *(4) Prior = Uniformity:* Any prior (bias towards some functions) is a "principle of uniformity of nature."
      *   *(5) Circularity:* Justifying the prior is either circular (a priori) or inductive (begging the question).
