answer: |-
  This is a sharp diagnosis. You have identified the central tension in modern mechanistic interpretability: the gap between the *ontology* implied by the rhetoric (features as natural kinds waiting to be discovered) and the *methodology* (features as optimization artifacts sensitive to hyperparameters).

  Here is a reconstruction of the implicit theory, an assessment of the instrumentalist challenge, and a breakdown of what would break if the field admitted its conventionalism.

  ### 1. The Implicit Theory: "Geometric Realism"

  The field does not actually believe features are like elements in ore (atomic, indivisible, invariant). If they did, the hyperparameter sensitivity would be fatal. Instead, the implicit commitment is to **Geometric Realism** combined with the **Linear Representation Hypothesis**.

  **The Commitments:**
  1.  **Linearity of Semantics:** Human-legible concepts are represented as linear directions (or subspaces) in the activation space. This is the core realist claim. It posits that the model's high-dimensional geometry is not arbitrary; it aligns with the topology of human concepts.
  2.  **Overcompleteness as Density, Not Noise:** The fact that there are more features than dimensions (superposition) is not a bug; it is a compression mechanism. The "true" features exist as a dense, overcomplete dictionary.
  3.  **Scale-Relativity (The Fractal View):** This resolves your hyperparameter objection. The theory is not that there is *one* true set of features, but that the conceptual structure of the model is hierarchical or fractal.
      *   Low sparsity / small dictionary $\rightarrow$ Coarse-grained features (e.g., "Animals").
      *   High sparsity / large dictionary $\rightarrow$ Fine-grained features (e.g., "Golden Gate Bridge", "Suspension Cables").
      *   *Commitment:* The *semantic content* is stable across scales, even if the *boundaries* shift. Merging/splitting is acceptable provided the semantics compose (i.e., the "Bridge" feature doesn't merge with "Flattery" when you lower resolution; it merges with "Architecture").

  **What determines content?**
  A state has content $X$ if it occupies a specific **functional role** in the computational graph *and* aligns with a linear direction in activation space.
  *   **Correlation** establishes that the direction *tracks* $X$ in the data distribution.
  *   **Causation** establishes that the direction is *causally efficacious* for $X$ in the model's computation.
  *   **The Synthesis:** The field assumes that because the model is trained to predict text, and text is about the world, the internal states that causally produce text about $X$ *must* correspond to the concept $X$.

  ### 2. The Instrumentalist Test

  **Could a thoroughgoing instrumentalist publish the identical papers?**
  **Yes, but with a crucial caveat regarding the "Explanation" claim.**

  An instrumentalist views the SAE as a **control surface**, not a **map**.
  *   **The Instrumentalist Workflow:** Train SAE $\rightarrow$ Find direction $d$ $\rightarrow$ Observe that intervening on $d$ changes output $O$ $\rightarrow$ Conclude "$d$ is a useful handle for controlling $O$."
  *   **The Realist Workflow:** Train SAE $\rightarrow$ Find direction $d$ $\rightarrow$ Observe that intervening on $d$ changes output $O$ $\rightarrow$ Conclude "$d$ is the internal representation of concept $C$, which explains *why* the model produces $O$."

  **Where the Instrumentalist gets stuck:**
  The instrumentalist cannot make claims about **generalization mechanisms** or **internal alignment**.
  1.  **Safety Monitoring:** If features are merely useful fictions indexed to a specific SAE run, you cannot claim to have built a "deception detector." You have built a "deception steerer" for that specific model checkpoint. If the model updates, the SAE features might rotate. A realist claims the feature is robust because the *concept* is in the model. An instrumentalist admits the feature is robust only insofar as the *loss landscape* remains stable.
  2.  **The "Black Box" Claim:** The field sells itself as opening the black box. An instrumentalist admits the box is still black; they've just welded some levers onto the outside that happen to correlate with the inside.

  **Verdict:** The instrumentalist can do the *math* and the *interventions*. They cannot write the *Discussion* section. They cannot claim to have "identified the mechanism." They can only claim to have "identified a reliable intervention." The discovery language *is* doing work: it licenses the leap from "we can steer this" to "we understand this."

  ### 3. The Consistency Question

  **Is there an account of content where Correlation + Causation + Hyperparameter Sensitivity are consistent?**
  **Yes, but it requires adopting a "Functional Role + Approximate Factorization" view.**

  *   **Correlation vs. Causation:** In a perfectly factorized model, these would be identical. In a real model (with superposition and noise), they come apart.
      *   *Correlation without Causation:* The feature is a "readout" of upstream computation but doesn't drive downstream behavior (a "spur").
      *   *Causation without Correlation:* The feature is a "trigger" that only fires in rare edge cases (a "latent").
      *   *The Consistency Fix:* The field implicitly treats **Causal Efficacy** as the primary criterion for "reality," and **Correlation** as the primary criterion for "naming."
      *   *Why this works:* You name it "Golden Gate Bridge" because it fires on bridge text (correlation). You claim it's a "real feature" because cranking it makes the model talk about bridges (causation). The gap between them is attributed to "noise" or "polysemanticity," not a fundamental flaw in the theory.

  *   **Hyperparameter Sensitivity:** As noted above, this is saved by the **Fractal View**.
      *   *The Threat:* If changing $\lambda$ makes the "Deception" feature turn into the "Math" feature, Realism dies.
      *   *The Defense:* The field assumes **Semantic Stability**. As long as the "Deception" feature at $\lambda_1$ is a linear combination of "Deception" features at $\lambda_2$, the reality is preserved.
      *   *The Weak Point:* There is currently no rigorous metric for "Semantic Stability" across SAE runs. The field *asserts* it via qualitative examples (e.g., "look, feature 402 at low res splits into 402a and 402b at high res"). This is the weakest link in the consistency chain.

  ### 4. The Conventionalist Shift: What Would Actually Change?

  If the field dropped Geometric Realism and became explicitly Conventionalist ("Features are useful coordinates we impose on the activation space to make it legible"), here is what breaks:

  **1. Reporting Norms (High Impact)**
  *   **Current:** "We discovered the 'Sycophancy' feature."
  *   **Conventionalist:** "We constructed a basis in which sycophancy is locally linear."
  *   **Change:** Papers would be required to report **Feature Stability Metrics**. You couldn't just show one SAE run. You would need to show that Feature $X$ in SAE A matches Feature $Y$ in SAE B (with different seeds/hyperparameters) via canonical correlation analysis or feature matching. If the feature doesn't survive a change in dictionary size, it's not a "feature," it's an artifact.

  **2. Eval Metrics (Medium Impact)**
  *   **Current:** "Top activating examples" and "Intervention effect size."
  *   **Conventionalist:** "Basis Robustness" and "Transferability."
  *   **Change:** The primary metric for a good SAE wouldn't just be reconstruction loss or sparsity; it would be **cross-model alignment**. Do the features found in Llama-2-7B match the features in Llama-2-13B? A realist expects yes (same concepts). A conventionalist expects no (different optimization trajectories). If the field went conventionalist, they would stop expecting transferability and focus on *steering fidelity*.

  **3. Safety Claims (Catastrophic Impact)**
  *   **Current:** "We can monitor models for dangerous capabilities by watching these features."
  *   **Conventionalist:** "We can steer models away from dangerous outputs using these handles."
  *   **Change:** This is your suspicion confirmed. **Monitoring becomes impossible.**
      *   Monitoring requires the feature to exist *independently* of the monitor. If the feature is a convention of the SAE, a malicious actor can train a model to produce the *output* of deception without activating the *SAE direction* associated with deception (adversarial feature masking).
      *   If features are discoveries, masking them is hard (they are the mechanism).
      *   If features are conventions, masking them is easy (optimize against the SAE).
      *   *Survival:* The claim "We can make models safer by steering" survives. The claim "We can verify models are safe by inspecting them" dies.

  ### Summary

  The field is operating on a **Pragmatic Realism**. They act as realists to justify the safety case (monitoring requires real things to monitor) but practice as conventionalists to manage the engineering (tuning $\lambda$ to get useful levers).

  **The specific step that only makes sense for a Realist:**
  The claim that **feature absence implies safety**.
  *   *Instrumentalist:* "We didn't find a deception feature." $\rightarrow$ "Our SAE didn't find a handle for deception." (Model might still be deceptive).
  *   *Realist:* "We didn't find a deception feature." $\rightarrow$ "The model does not contain the mechanism for deception." (Model is likely safe).

  **The Consistency Flaw:**
  The field slides between Correlation and Causation because they assume the **Linear Representation Hypothesis** bridges them. If representations are linear, tracking $X$ and causing $X$ should be the same direction. The fact that they aren't always is hand-waved as "noise."

  **If they went Conventionalist:**
  The "Discovery Register" becomes a "Toolbox Register." The safety narrative shifts from **Verification** (inspecting the engine) to **Control** (holding the steering wheel). Given that the field's funding and existential risk arguments rely heavily on Verification, an explicit shift to Conventionalism would likely collapse a significant portion of the current research agenda's stated justification.
