  3. I would bet on Structural Materialism because her strongest affirmative verdict, the long nineteenth century, explicitly relies on the existence of an actual package of causes rather than the smoothness of the transition.
  4. The closest analog is the long nineteenth century, since both concepts are retrospective labels justified by a distinct configuration of material drivers like coal or carbon that enable historical work.
  5. You should ask her whether a period defined by a hard material marker but rejected by continuity-minded historians is more like the long nineteenth century or the Scientific Revolution.
