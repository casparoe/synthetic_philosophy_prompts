answer: |-
  ### Specification Requirements for Causal Attribution Engine

  **R1: Machine-Groundability**
  *   **Spec:** Every named cause must map to a specific record, log entry, or configuration object present in the input trace. No cause may be inferred from external context, unwritten policy, or assumed human state.
  *   **Rationale:** Satisfies the **Auditability** and **Machine-Data** constraints. If Legal asks "Why is this a cause?", the engine must point to a line in the log (e.g., `Ticket-123 status=OPEN`), not a human judgment.
  *   **Status:** **Non-Negotiable.** Without this, the output is testimony, not telemetry.

  **R2: Active Duty Binding**
  *   **Spec:** An omission is only a candidate cause if a machine-readable rule (roster, ticket assignment, ACL policy) explicitly assigned the prevented action to a specific agent or role *at the time of the incident*.
  *   **Rationale:** Solves **The Two-Shift Rack** and **The Dutyless Bystander**. The architect (5 years ago) had no active duty. The hurricane had no duty. The contractor had ACLs but no roster assignment; the operator had both. This filters the infinite non-events down to the accountable few.
  *   **Status:** **Non-Negotiable.** This is the only way to distinguish "could have" from "should have" without accessing mental states.

  **R3: Sufficiency Over Necessity**
  *   **Spec:** A cause need not be strictly necessary (but-for) for the outcome. If a set of omissions is jointly sufficient to produce the outcome, and each individually violated an Active Duty, all are named.
  *   **Rationale:** Solves **Two Teams, One Check**. In overdetermination cases, strict necessity fails (if Team A hadn't skipped, Team B still did, so A wasn't *necessary* under some readings). To name both as requested, we must treat duty-violating sufficiency as causal.
  *   **Status:** **Non-Negotiable.** Required to meet the business rule of naming both failing teams.

  **R4: Temporal Specificity**
  *   **Spec:** Each named cause must carry a timestamp corresponding to the moment the duty was breached or the window for action closed, not just the time the effect occurred.
  *   **Rationale:** Satisfies the **Timestamp** constraint and aids debugging. The cause of the overheat isn't 03:10 (failure time); it's 02:55 (missed ack) and 22:00 (pump down).
  *   **Status:** **Non-Negotiable.** Required by dashboard schema.

  **R5: Agent Neutrality**
  *   **Spec:** The attribution logic must not depend on the identity of the agent, only on the role-slot occupancy. Adding 30 extra operators to the roster who were not on-shift must not generate 30 new causes.
  *   **Rationale:** Solves **The Two-Shift Rack** scaling problem. Causality must attach to the *slot* that was empty or negligent, not the pool of potential people.
  *   **Status:** **Preference (High Priority).** Technically negotiable, but without it, the system generates noise that renders the dashboard unusable.

  ---

  ### The Colleague's Objection
  Your colleague insists that causation requires a physical process (conserved quantity transfer).
  *   **Verdict:** This is a **preference**, not a constraint on the spec.
  *   **Reasoning:** Physically, he is correct; an omission is not a physical event. However, the business requirement is *accountability*, not physics. In reliability engineering, "cause" is a shorthand for "point of intervention to prevent recurrence." You cannot intervene on a physical process that already happened; you intervene on the *rule* that was broken. Adopting his view renders the tool incapable of fulfilling its primary function (naming the missed ack). You must reject this constraint to build the tool.

  ### The Killer Requirement
  **R2 (Active Duty Binding)** knocks out the largest number of respectable accounts.
  *   **Why:** Pure **Counterfactual** accounts fail here because they admit the hurricane and the architect (their absence was also counterfactually necessary). Pure **Process** accounts fail because they admit no omissions at all. Only accounts that integrate a normative layer (rules, defaults, expectations) can satisfy R2. This requirement forces you to adopt a hybrid model.

  ### Joint Unsatisfiability Check
  There is a conflict between **Constraint 1 (Machine Data Only)** and **R2 (Active Duty Binding)** in edge cases.
  *   **The Conflict:** If a duty exists in human policy but is not encoded in a ticket, roster, or config file (e.g., "Senior engineers should monitor during deploys"), the engine cannot see it. It cannot distinguish the "Dutyless Bystander" from the "Responsible Engineer" if the roster is silent.
  *   **The Recommendation:** You must give up **Exhaustiveness**. The spec cannot promise to find *the* cause in all cases; it can only promise to find *encoded* causes. If the duty isn't in the logs, the engine must return "No Attribution Found" rather than hallucinate a cause or rely on external input. Do not relax Constraint 1 to allow manual tags; that breaks Auditability. Accept that the tool is incomplete for incidents involving unwritten norms.

  ### Theory Evaluation Against Requirements

  **Process / Conserved-Quantity Views**
  *   **Verdict:** **Fail.**
  *   **Reason:** They cannot model omissions. They satisfy Constraint 1 (physical data) but fail R2 and R3 immediately. They would output "No Cause" for the March event.

  **Counterfactual / Interventionist Views**
  *   **Verdict:** **Partial Fail.**
  *   **Reason:** They handle R3 (Overdetermination) well using interventions, but fail R2 (Duty Binding) without modification. They will attribute the overheat to the hurricane and the architect unless artificially constrained by a normative filter.

  **Norm-Relativist Views**
  *   **Verdict:** **Pass (with caveats).**
  *   **Reason:** They naturally satisfy R2 by defining cause as a deviation from a norm. However, they struggle with Constraint 1 (Machine Data) unless the "norms" are strictly codified as system rules. If norms are social, this theory breaks the audit trail.

  **Structural-Equation Models (SEM) of Actual Causation**
  *   **Verdict:** **Best Fit.**
  *   **Reason:** SEMs allow you to model "default values" (the expected state) and "interventions" (the actual state). You can encode the Roster/Ticket as the structural equation defining the default. It handles R3 (Overdetermination) via path analysis and satisfies Constraint 2 (Reproducibility) because the math is deterministic. It requires the most engineering effort to map logs to variables but is the only framework that natively supports all requirements.
