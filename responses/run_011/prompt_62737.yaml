      This covers the Cello (excellence/difficulty) vs Teaching (calm/happiness).
      This covers the Book (trace of excellence) vs Afternoons (pure enjoyment).
      This keeps (1) (not outcome based, but process based).
      This keeps (5) (transience doesn't matter).
      This fixes (3) (excellence can be maintained past 40 even if 'play' fades).

