answer: |-
  1. **The question as it will appear on the paper**

  **Question 1 (25 marks)**
  **Bertrand's Chord Problem**

  A chord is drawn at random in a circle. What is the probability it exceeds the side of an inscribed equilateral triangle? Below is a transcript from a seminar discussion regarding this problem.

  **Student 1:** Using random endpoints, the probability is 1/3.
  **Student 2:** Using a random radial point, it is 1/2.
  **Student 3:** Using a random midpoint, it is 1/4.
  **Student 4:** Students 2 and 3 assign distributions to the same quantity: the perpendicular distance $d$ from the centre. Student 2 makes $d$ uniform; Student 3 makes midpoints uniform over the area, which makes $d^2$ uniform.
  **Student 5:** The dispute is empty. A laboratory apparatus fires rods at a circular target. The limiting frequency of chords produced settles the matter.

  Adjudicate among these four positions. Your answer must address: (i) what decides between uniformity in $d$ versus $d^2$ absent empirical data, and whether invariance demands are discoveries or restatements; (ii) Jaynes' derivation of a unique solution via scale and translation invariance, and whether this renders the problem well-posed; (iii) whether the physical apparatus settles the question of rational credence or merely describes a causal process; and (iv) whether the cube factory paradox refutes the Principle of Indifference or redefines its proper domain. Conclude by stating whether the problem is objectively ill-posed or solvable via principled constraint.

  **(Word limit: 1,000 words. Recommended time: 90 minutes.)**

  2. **Model answer**

  The seminar transcript reveals that Bertrand's paradox is not merely a failure of calculation but a crisis of specification. To adjudicate, one must distinguish between ontic frequencies and epistemic credences, and recognise that 'randomness' is not a property of the chord but of the selection procedure.

  Student 4 correctly identifies that the conflict between the 1/2 and 1/4 solutions lies in the measure assigned to the distance $d$. Choosing between uniform $d$ and uniform $d^2$ cannot be done by inspecting the geometry alone, as both are mathematically coherent. The decision rests on invariance requirements. If we demand the solution be invariant under translation and scaling of the circle—meaning the probability should not depend on the circle's size or position—we are forced towards the measure that yields 1/2. This is not a discovery of empirical fact but a constraint on rationality: if the problem statement specifies neither size nor position, a rational agent cannot assume knowledge of them. Thus, the invariance demand is not a disguised restatement of the random radial point method, but a justification for why that method uniquely satisfies maximal ignorance.

  This leads to Jaynes' treatment. By insisting on scale and translation invariance, Jaynes derives a unique distribution corresponding to Student 2's answer. This convergence is not coincidental; it demonstrates that the problem becomes well-posed only when supplemented by symmetry principles inherent in the phrase 'at random' when stripped of specific generating instructions. However, this solves the epistemic problem, not necessarily the physical one.

  Student 5's apparatus argument conflates frequency with credence. A limiting frequency will indeed converge, but only relative to the specific mechanics of the throwing device. If the device throws rods from a great distance with uniform spatial distribution, it will mimic Jaynes' invariance and yield 1/2. If the device drops sticks onto a circle from a fixed height, it may yield 1/4. The apparatus does not settle the mathematical problem; it merely instantiates one specific causal process. Unless the question is explicitly about that specific machine, the frequency is irrelevant to the general question of rational belief regarding an unspecified chord.

  Finally, the cube factory generalisation reinforces that the Principle of Indifference cannot apply blindly to parameters. Uniformity over side length contradicts uniformity over volume. This does not refute the principle outright but reveals it was never about parameters. It is about state descriptions or, more robustly, invariant measures. Where no invariant measure exists, the principle yields contradiction; where symmetries exist (as in the circle's translation and scale), it yields uniqueness.

  In conclusion, the problem is objectively ill-posed if interpreted as a request for a frequency without a specified mechanism. However, interpreted as a problem of logical probability under maximal ignorance, it is well-posed. The invariance principles required to solve it are not empirical hypotheses but conditions of consistency for any agent lacking specific information. Therefore, Student 2's answer is uniquely defensible as a rational credence, while Student 5 is correct only if the apparatus happens to embody the relevant symmetries. The paradox dissolves once we acknowledge that probability assignments reflect the information available to the agent, not merely the geometry of the target.

  3. **Marking scheme**

  | Component | Marks | Full Credit Requirements | Characteristic Error (No Credit) |
  | :--- | :---: | :--- | :--- |
  | **1. Parameterisation & Invariance** | 5 | Explains that choosing between uniform $d$ and $d^2$ requires a metric constraint; identifies invariance as the deciding factor rather than geometric intuition. | Treats the three classical answers as a refutation of probability theory rather than underdetermination. |
  | **2. Jaynes' Derivation** | 5 | Recognises Jaynes' solution (1/2) arises from scale/translation invariance; argues whether this makes the problem well-posed (yes, for credence) or is coincidental. | Reads the invariance requirement as an extra empirical hypothesis rather than a constraint on the question/state of knowledge. |
  | **3. Physical Apparatus** | 5 | Distinguishes between limiting frequency (ontic) and rational credence (epistemic); notes the apparatus must embody symmetries to match the epistemic solution. | Assumes that naming a physical generating procedure automatically makes the problem well-posed for all interpretations. |
  | **4. Cube Factory & PoI** | 5 | Uses the cube case to argue PoI applies to invariant measures/state descriptions, not arbitrary parameters; avoids claiming PoI is universally useless. | Claims the cube factory refutes the Principle of Indifference outright without qualifying the domain of application. |
  | **5. Synthesis & Position** | 5 | Takes a defended position on whether the problem is ill-posed or solvable; maintains consistency between epistemic and frequentist distinctions throughout. | Slides between the epistemic and the frequentist reading of probability without noticing the contradiction. |

  4. **The first-class line**

  A strong 2:1 answer will correctly identify the relevant arguments, distinguish frequency from credence, and explain Jaynes' invariance condition accurately. It will tick the boxes of the marking scheme with competence and clarity. A first-class answer, however, will go beyond exposition to evaluate the meta-philosophical implications. It will explicitly argue that the 'paradox' arises from a category mistake regarding the nature of probability itself—treating an epistemic relation as an ontic property. The first-class candidate will not just apply Jaynes' solution but critique its necessity, perhaps questioning whether 'maximal ignorance' is a coherent state, or defending the legitimacy of subjective priors where invariance fails. The difference lies in the depth of the adjudication: the 2:1 describes the tools available to solve the problem; the first-class candidate evaluates whether the problem was ever the kind of thing that could be solved.
