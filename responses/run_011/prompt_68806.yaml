answer: |-
  ### Brainstorming & Strategic Assessment

  Before we draft, let's stress-test the core idea. You're right to be worried about the "Reciprocity of Risk" claim; that is the exact point where the liability theorist on your committee will try to break your legs.

  **1. Sharpening the Research Question**
  Your current draft ("is there a principled basis for grading...") is too soft. It invites a "yes" that is trivially satisfied by revisionism. We need a question that forces a structural claim.
  *   *Option A:* "Does the functional differentiation of modern militaries refute the Moral Equality of Combatants?" (Too binary, invites a simple 'yes').
  *   *Option B:* "Can reciprocity of risk justify a limited symmetry of liability within a broadly revisionist framework?" (Better, but focuses too much on the justification rather than the taxonomy).
  *   *Option C (Recommended):* **"Does a functional differentiation of combatant roles necessitate a hybrid theory of liability that preserves symmetrical permissions for high-risk direct combatants while imposing asymmetrical liability on low-risk enabling roles?"**
      *   *Why:* This forces you to argue for a *specific* architecture (Hybrid/Graded) rather than just "Revisionism is nuanced." It promises a determinate answer: either the hybrid holds, or it collapses into one of the poles.

  **2. Originality & The Revisionist Trap**
  You are correct that Revisionists talk about contribution. However, standard Revisionism (e.g., McMahan) tends to treat contribution as a scalar that maps directly to liability. If you contribute to an unjust threat, you are liable, full stop. Your innovation is arguing that *role* and *risk exposure* act as independent variables that can *block* liability attribution even when causal contribution exists.
  *   *The Trap:* If you just say "some contribute more than others," the Revisionist says, "I already said that."
  *   *The Fix:* You must argue that for the infantryman, risk reciprocity generates a *presumption of symmetry* that is not merely epistemic (I don't know I'm unjust) but moral (the mutual exposure creates a fair fighting zone). This is the bridge to the Just War theorist.

  **3. Reciprocity of Risk: Rhetoric or Workhorse?**
  Honest assessment: As a metaphysical ground for liability, it's weak. Revisionists are right that my risk doesn't negate your unjust threat. However, as a *political* or *conventional* constraint on liability assignment, it has teeth.
  *   *Pivot:* Don't argue risk negates liability. Argue that risk reciprocity creates a **normative convention** that is morally binding because it minimizes overall harm and respects the agency of those forced into the "kill zone." If you remove it, you get a theory that is morally correct but practically catastrophic. This appeals to the Phil of Law person (function of norms) and the Just War person (humanity of soldiers).

  **4. The "Manipulation" Worry (State Gaming)**
  This is fatal if ignored. If states can grant immunity by moving troops to drone stations, your theory incentivizes cowardly, remote warfare.
  *   *Solution:* Your grading criteria must include **foreseeable causal potency**, not just physical risk. A drone pilot has low physical risk but high causal potency. If your theory grants them immunity, it's broken. The prospectus must explicitly state that "risk" is only one variable, balanced against "causal proximity."

  **5. Scope Check**
  One semester + summer is tight for a full normative theory. You cannot solve liability from scratch. You must limit the scope to **taxonomy and testing**. You are building the *framework* for grading, not necessarily defending every edge case. The deliverable is the graded model and its defense against the "collapse" objection.

  ***

  ### PhD Qualifying Prospectus

  **Title:** Beyond Symmetry and Asymmetry: A Graded Theory of Combatant Liability and Functional Role

  **Research Question**
  Standard debates over the Moral Equality of Combatants (MEC) operate on a binary assumption: either all combatants possess symmetrical rights and liabilities regardless of their cause (Traditionalism), or liability tracks strictly with contribution to unjust threats, rendering symmetry a moral fiction (Revisionism). This project challenges the homogeneity of the category "combatant." It asks: **Does a functional differentiation of combatant roles necessitate a hybrid theory of liability that preserves symmetrical permissions for high-risk direct combatants while imposing asymmetrical liability on low-risk enabling roles?**

  This question seeks a determinate structural answer. It does not ask merely whether liability varies (which Revisionists grant) but whether there is a principled threshold where risk reciprocity and role function generate a *localized* symmetry that survives even in unjust wars. The hypothesis is that the Traditionalist intuition is not globally false but locally valid for a specific subset of combatants, while the Revisionist critique holds for the remainder. A successful project will demonstrate that a graded model is stable and does not collapse back into binary symmetry or total asymmetry.

  **The Gap in Existing Literature**
  Current literature leaves this question open because both dominant camps rely on an oversimplified ontology of the combatant. Traditionalists treat "combatant" as a legal status conferring uniform moral privileges. Revisionists treat "combatant" as a causal agent whose liability is proportional to their contribution to unjust harm. Both miss the institutional reality of modern warfare, where the chain of threat production is fragmented.

  The Revisionist might object that this project is trivially theirs: if liability tracks contribution, obviously a logistics officer is less liable than a trigger-puller. However, standard Revisionism typically concludes that *any* contribution to an unjust threat generates liability, differing only in degree, not in kind. It does not account for the **normative significance of mutual risk**. A drone pilot contributes to an unjust threat without sharing the risk of death; an infantryman contributes while sharing that risk. If risk reciprocity has moral weight—as Traditionalists argue but Revisionists dismiss—then the infantryman occupies a different moral position than the drone pilot, even if both contribute to the same unjust outcome. Existing theories lack the machinery to explain why one might retain symmetrical protections while the other does not. This project builds that machinery.

  Furthermore, the Philosophy of Law critique—that the area is conceptually messy—is addressed by refusing to import International Humanitarian Law (IHL) categories wholesale. IHL distinguishes based on membership and function (medical, religious) but largely maintains equality among fighters. This project argues that moral liability diverges from legal status in ways that IHL cannot capture, specifically regarding remote and enabling roles. The goal is not to reform the law of war directly, but to provide the moral taxonomy that a coherent law of war *would* require.

  **Methodology**
  The project employs conceptual analysis tested against fixed case archetypes. It will not rely on empirical surveys of soldier intuition, as moral truth is not determined by popular consensus, nor will it attempt to rebuild liability theory from first principles, which exceeds the scope of a dissertation chapter. Instead, it will treat the Traditionalist and Revisionist accounts as competing frameworks and test their explanatory power against specific role-differentiated scenarios.

  **The Test Set:**
  Analysis will focus on four archetypal roles, held constant across just and unjust war scenarios:
  1.  **The Conscripted Infantryman:** High personal risk, direct application of violence, low strategic knowledge.
  2.  **The Strategic Officer:** Low personal risk, high decisional authority, high knowledge.
  3.  **The Remote Operator (Drone/Cyber):** No physical risk, direct causal application of violence, variable knowledge.
  4.  **The Logistics Enabler:** Variable risk, indirect causal contribution, essential support.

  **Conceptual Machinery:**
  The core theoretical work involves disentangling three variables currently conflated in the literature:
  1.  **Causal Contribution:** The extent to which the action is necessary for the threat.
  2.  **Epistemic Access:** The agent's reasonable ability to know the justice of the war.
  3.  **Risk Reciprocity:** The extent to which the agent is exposed to lethal force from the adversary.

  The method involves varying these variables independently across the test set. For example, comparing the Remote Operator to the Infantryman isolates Risk Reciprocity while holding Causal Contribution relatively constant. If liability judgments shift significantly when Risk Reciprocity is removed, this supports the hypothesis that risk plays a non-instrumental role in liability assignment, vindicating a component of the Traditionalist view.

  **Why This Method?**
  Empirical methods are rejected because the question is normative, not descriptive. A purely legal approach is rejected because IHL categories are designed for compliance and identification, not moral truth; borrowing them would beg the question against the Revisionist. Rebuilding liability theory from scratch is unnecessary; the goal is to show how existing insights can be integrated into a stable graded model. This "middle-out" approach allows for progress on the specific impasse regarding combatant heterogeneity without requiring a solution to the foundational nature of rights.

  **Success and Failure Conditions**
  A successful result produces a stable taxonomy where:
  1.  Liability is graded, not binary.
  2.  The "Infantryman" category retains a presumption of symmetrical permission based on risk reciprocity, even in unjust wars.
  3.  The "Remote Operator" and "Strategic Officer" categories are subject to asymmetrical liability based on the justice of the cause.
  4.  The boundaries between these categories are principled, not ad hoc.

  **Failure Conditions (When to Junk the Project):**
  1.  **Collapse into Revisionism:** If analysis shows that Risk Reciprocity adds no independent moral weight to Causal Contribution, the graded view collapses into standard Revisionism. If the infantryman is liable simply because he contributes, regardless of his risk, the Traditionalist intuition is merely sentimental.
  2.  **Collapse into Traditionalism:** If the criteria for "enabling roles" are so narrow that almost everyone counts as a direct combatant, the view collapses back into full symmetry.
  3.  **The Manipulation Objection:** If the graded theory provides states with a moral incentive to restructure militaries to maximize immunity (e.g., by moving all personnel to remote roles to exploit a loophole, or conversely, by forcing conscription to grant immunity), the theory is pragmatically self-defeating. If I cannot articulate a constraint that prevents states from gaming the liability structure, the project fails.
  4.  **Unmanageable Complexity:** If the grading requires such fine-grained knowledge of individual circumstances that it cannot guide action ex ante, it fails as a normative theory for war.

  **Addressing Specific Concerns**
  Two major objections will drive the analysis. First, the **Reciprocity of Risk** worry. Critics will argue that risk is irrelevant to liability; only the unjust threat matters. I will argue that risk reciprocity functions as a **procedural bar** to liability assignment in conditions of uncertainty. It is not that risk negates the unjust threat, but that mutual exposure creates a conventional space where epistemic limitations are respected. This preserves the Revisionist metaphysics of liability while accommodating the Traditionalist ethics of fighting.

  Second, the **Manipulation Worry**. If grading works, states might structure forces to ensure most personnel fall into low-liability categories. This is a feature if it reduces harm (remote war is safer for soldiers), but a flaw if it enables aggression with impunity. The project will test whether the grading criteria can be tied to **foreseeable causal potency** rather than formal role. If a state moves a trigger-puller to a remote station, their causal potency remains high. If the theory holds them liable despite low risk, the manipulation is blocked. If the theory grants them immunity, the theory is defective. Resolving this tension is a primary deliverable of the summer research period.

  **Scope and Timeline**
  **Semester 1 (Weeks 1-14):**
  *   *Weeks 1-4:* Literature mapping. Define the "homogeneous combatant" assumption in key Traditionalist and Revisionist texts.
  *   *Weeks 5-9:* Drafting the core argument for Risk Reciprocity as a procedural bar. Testing against the Infantryman archetype.
  *   *Weeks 10-14:* Drafting the argument against Remote/Enabling roles. Addressing the Manipulation Objection.
  *   *Deliverable:* Complete draft of Chapter 1 (The Case for Differentiation) and Chapter 2 (The Risk Reciprocity Constraint).

  **Summer (Weeks 1-12):**
  *   *Weeks 1-6:* Stress-testing the taxonomy. Applying the model to edge cases (cyber warfare, private contractors). Refining the "Causal Potency" constraint to prevent gaming.
  *   *Weeks 7-12:* Finalizing the argument. Integrating feedback from committee. Preparing the prospectus for dissertation proposal.
  *   *Deliverable:* Complete draft of Chapter 3 (The Manipulation Constraint) and a full article-length paper derived from Chapter 2 for job market purposes.

  **Feasibility:**
  This scope is aggressive but manageable. It limits the empirical domain to four archetypes, avoiding the trap of trying to categorize every military occupation. It limits the theoretical domain to the intersection of liability and role, avoiding the need to solve the deeper metaphysical problems of rights forfeiture. The primary risk is the "Collapse" failure condition. To mitigate this, the first month will focus entirely on whether Risk Reciprocity can bear the philosophical weight assigned to it. If preliminary analysis suggests it cannot, the project will pivot to a purely causal grading model (abandoning the Traditionalist bridge), which is less original but still dissertation-viable. However, the current hypothesis is that without the risk component, the theory loses its explanatory power regarding our intuitions about the infantryman, making the risk argument essential.

  **Conclusion**
  This project moves the debate past the stalemate of Symmetry vs. Asymmetry. By disaggregating the combatant, it offers a path to reconcile the moral insights of Revisionism with the practical wisdom of Traditionalism. It provides the committee's Just War theorist with a defense of the soldier's plight, the Liability theorist with a rigorous tracking of moral responsibility, and the Phil of Law skeptic with a conceptual clarification that exposes the messiness of current categories without succumbing to it. The result will be a robust, graded theory of combatant liability suitable for the complexities of twenty-first-century warfare.
