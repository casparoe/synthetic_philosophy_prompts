prompt: |-
  Ok so I'm two years into a philosophy PhD and my quals prospectus is due in about six weeks — the committee is one just war person, one person who does rights theory and liability, and one philosophy-of-law person who thinks this whole area is a mess. Here's the half-baked thing I keep circling. The moral equality of combatants fight is always set up as binary: either combatants on both sides have the same permissions and the same liability regardless of whether their war is just (the traditional, Walzer-ish line), or the revisionists are right that liability tracks whether what you're doing actually contributes to an unjust threat, so symmetry is a moral myth that only survives as a legal convention. What bugs me is that both sides argue as if "combatant" picks out one morally homogeneous kind. It obviously doesn't. A conscripted nineteen-year-old infantryman, a logistics NCO moving fuel, an intelligence analyst who tasks strikes, a drone pilot on the other side of the planet, a cyber operator, a staff officer who signs the operations order — these differ wildly in how directly their action constitutes a threat, how much they know, and how much risk they personally run. And I have a suspicion that a lot of the intuitive pull of the traditional view is actually coming from that third thing, from reciprocity of risk: we feel bad saying the guy who's about to be shot at was acting impermissibly, partly because he's in the same boat as the guy shooting at him. If that's right, the traditional view isn't exactly false, it just has a hidden premise that only applies to a subset of combatants, and a graded picture falls out of it.

  What I want from you is help turning this into an actual prospectus, roughly 1800 words, that I could hand those three people without getting torn apart. So: state the research question in a form that has a determinate answer and isn't just "is the moral equality of combatants true?" — something like "is there a principled, non-ad-hoc basis for grading combatant liability by role, or does any such grading collapse into either full symmetry or full revisionism?" but sharpened much better than that. Then explain why the two existing camps genuinely leave this open rather than having already answered it, because the revisionist will just say "obviously, that's what contribution-tracking liability means" and I need a reason my question isn't trivially theirs. Then the method: what I'd actually do week to week, which cases I'd fix as a standing test set, what the conceptual machinery is, and why that method rather than the obvious alternatives (empirically surveying soldiers' intuitions; rebuilding liability theory from scratch; going the legal route, though note that IHL basically makes status turn on membership in the armed forces with medical and religious personnel carved out, so I can't just borrow its categories). Then say what a successful result looks like and, just as importantly, what would make me junk the project — what finding would show the graded view is unstable. And give me an honest scope check for one semester plus the following summer. No bibliography and no reading list, I'll add the citations myself, and please don't invent any: talk about positions and arguments, not about papers.

  You're the expert in this one — treat it as if you've sat on a dozen of these committees and know exactly where prospectuses like mine fall apart. Before you draft anything, spend the first part of your answer brainstorming out loud: give me three or four ways the question could be sharpened, say which is most defensible and why, and flag anywhere my framing is confused or the idea is less original than I'm hoping. Then write the prospectus. Think hard about whether reciprocity of risk can really carry the weight I'm putting on it or whether it's just doing rhetorical work — I'd rather hear that from you now than from the liability person on my committee in six weeks. There's also a seperate worry you should engage with: if grading works, does it hand states a recipe for structuring their militaries so that most of their people buy moral immunity? That might be a feature or a fatal flaw and I cant tell which.
