      *   **Practice 3: Model Validation (Calibration).**
          *   *Surface:* Group individuals with predicted $p$, check observed frequency $\approx p$.
          *   *Strict Need:* Empirical feedback loop. Requires exchangeability or stability of the data generating process.
          *   *Philosophical Commitment:* Bridges the gap. It validates subjective/propensity assignments using frequentist outcomes.

