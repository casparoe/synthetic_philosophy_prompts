  2.  **Deconstruct the Three Practices:**
      *   **Practice 1: Actuarial Pricing (Single-case probabilities).**
          *   *Surface:* Assigns $P(\text{death})$ to an individual.
          *   *Strict Need:* Requires a mapping from individual features to a number that guides decision-making (pricing/capital).
