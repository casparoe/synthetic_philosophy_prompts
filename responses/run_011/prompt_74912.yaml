answer: |-
  **Desiderata for a Constitutive Theory of the Demos**

  1.  **Logical Priority (Non-Circularity):** The rule must define membership without presupposing the existence of the body it constitutes.
      *   *Motivation:* You cannot hold a referendum to decide who is eligible to vote in that referendum. A theory that says "the people decide who the people are" offers no starting point for a new authority.
  2.  **Normative Distinction (Affected vs. Subjected):** The rule must distinguish between those who suffer consequences from a decision and those who are under the authority's coercive jurisdiction.
      *   *Motivation:* Downstream water users are affected by extraction but may not be subject to transit fines; airport staff are subject to security rules but may not reside in the watershed. A theory conflating the two either dilutes the vote of those bound by enforcement or ignores severe external harms.
  3.  **Structural Durability (Merge/Split/Dissolve):** The rule must specify what happens to membership if the authority's boundaries or existence change.
      *   *Motivation:* If the binational authority dissolves into two national bodies, does the electorate vanish or split? If it merges with a regional power grid, do the voters merge? The rule must survive structural reorganization without requiring a new theory of legitimacy.
  4.  **Historical Independence:** The rule cannot simply ratify existing jurisdictional lines as morally decisive.
      *   *Motivation:* Current borders often trace to conquest or colonial accident. A theory that says "whoever is inside the line votes" validates past injustice and fails to justify why the line exists in the first place.
  5.  **Output Specification (Binary vs. Weighted):** The rule must declare whether membership grants equal standing or graded influence.
      *   *Motivation:* In a cross-border zone, stakes vary wildly (e.g., a daily commuter vs. a seasonal worker vs. a downstream farmer). A theory must state if "membership" means one vote each or a share proportional to stake, rather than leaving this to later negotiation.
  6.  **Operationalizability (Administrability):** The rule must be executable by clerks and engineers using available data without case-by-case philosophical adjudication.
      *   *Motivation:* A criterion requiring proof of "degree of harm" for every voter is impossible to administer. If a civil engineer cannot apply the rule using tax records, transit passes, or hydrological maps, it is not a rule for constitution-drafting.

  **Classification and Conflicts**

  **Non-Negotiable:** Logical Priority and Operationalizability. Without Logical Priority, you have no starting mechanism; without Operationalizability, you have no functioning body. These bind the constitution-drafter specifically; a critic can afford to be abstract, but a drafter cannot.

  **Camp Commitments:** Normative Distinction, Historical Independence, and Output Specification. These are where political camps fight. Some prioritize the "Affected" (environmental justice), others the "Subjected" (legal positivism). Some demand Historical Independence (revisionists), others accept existing lines (stabilizers). Some insist on equality (Binary), others on stake-based influence (Weighted).

  **Incompatibility:** You cannot jointly satisfy **Historical Independence**, **Comprehensive Affectedness**, and **Operationalizability**. To trace all affected parties (e.g., every downstream water user) without relying on existing borders (Historical Independence) requires complex, real-time modeling of harm that clerks cannot administer (Operationalizability). You are left choosing between dropping Historical Independence (using existing records as a pragmatic proxy) or dropping Comprehensive Affectedness (limiting the franchise to those clearly subject to coercive authority).

  **The Knockout:** **Operationalizability** does the most work eliminating candidates. Most normative theories fail here because they require data that does not exist or judgments too subjective for a registry.

  **Commitment**

  Given the list above, specifically the non-negotiable constraint of Operationalizability combined with Logical Priority, you must reject fractional weighted voting. Calculating a "proportion of life governed" requires a prior metric of stake that reintroduces circularity (who decides the weight?) and demands administrative capabilities no civil registry possesses. You are left with a residence-based binary franchise, but "residence" must be defined functionally to meet the Subjected criterion—meaning anyone paying local taxes or holding a valid annual transit pass qualifies for a full vote, while downstream affected parties are represented via treaty obligations rather than franchise. This preserves the binary switch needed for administration while capturing the core subjected population without collapsing into unmanageable granularity.
