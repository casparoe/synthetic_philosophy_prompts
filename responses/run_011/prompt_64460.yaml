      *   **Constraints:** Flag confidence levels (hedge where unsure). Don't play along if the premise is flawed (e.g., if the proverb is irrelevant). Keep it clean and actionable for a committee setting.

  2.  **Deconstruct the Proverb ("A bird in the hand..."):**
