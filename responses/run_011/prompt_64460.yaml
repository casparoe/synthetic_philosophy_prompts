  3.  **Evaluate Each Thesis:**

      *   *Thesis 1: Risk/Uncertainty.*
          *   *Meaning:* Future benefits are probabilistic.
          *   *Verdict:* Truism/Defensible. Future *is* uncertain.
          *   *7% Rate?* No. Flood risk is arguably *increasing* (climate change), not decreasing. 7% is huge for risk on a public infrastructure project meant to *reduce* risk.
