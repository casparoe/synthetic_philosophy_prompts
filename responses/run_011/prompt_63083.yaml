          *   *Verdict:* Defensible, but perhaps too quick. It identifies the error but doesn't fully solve the "how" of application.

      *   **(3) Dana:** Relocates the problem. How do you *apply* the rule? Applying is an act needing a rule (Kripkean turn).
          *   *Analysis:* This is the Wittgenstein/Kripke challenge. Even if you distinguish rule from premise, you need to know how to use the rule. This regenerates the regress at the level of meta-rules.
          *   *Verdict:* Strong/Defensible. It pushes the problem deeper than just "premise vs. rule".

      *   **(4) Sam:** Rule-following is a practice, not an interpretation (Wittgenstein). We stop at what people *do*. No third thing needed.
