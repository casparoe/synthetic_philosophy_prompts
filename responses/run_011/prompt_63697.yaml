answer: |-
  1. Four joints

  Your decomposition of the relativity claim into inventory, function, patterning, and cognition provides a precise tool for dissecting the Hopi controversy. Your suspicion holds largely true but requires refinement regarding the logical force of an inventory refutation. Whorf's assertion operates primarily at joints (ii) and (iii). He conceded that Hopi speakers could communicate about temporal sequences (inventory), but argued that their language did not grammaticalize time as a measurable, spatialized continuum (function/patterning). For Whorf, the covert categories—the unstated metaphysical assumptions required to make sentences grammatical—obligatorily framed events as processes or manifestations rather than objects located on a timeline. His leap to joint (iv), cognition, was indeed speculative, relying on introspective analogy rather than psychological testing. He inferred that because the grammar did not obligate a spatialized time metaphor, the habitual thought process would not utilize one.

  Malotki's counter-evidence is overwhelmingly concentrated at joint (i), with strong implications for (ii). By documenting tense markers, temporal adverbs, and metaphorical constructions mapping time onto space, Malotki challenged Whorf's description of the inventory. However, an existence refutation at (i) defeats a claim at (iii) only under specific conditions. If Whorf's claim was "Hopi speakers cannot grammatically encode time," Malotki's inventory data is fatal. But if Whorf's claim was "Hopi grammar does not *obligatorily* encode time in the same distribution as Standard Average European (SAE)," then showing that temporal forms *exist* is insufficient. One must show they are used obligatorily in the same contexts. Malotki argued the former (that Hopi has time), while Whorf defenders argue the latter (that Hopi treats time differently). The structural weakness here is that Malotki's inventory data undermines the strong reading of Whorf, but leaves the weak reading (difference in obligatory patterning) partially intact. However, because Whorf's own linguistic descriptions were often impressionistic compared to Malotki's rigorous fieldwork, the burden of proof shifted. The argument fails at joint (i) because Whorf's inventory was empirically inadequate; consequently, his inferences at (ii) and (iii) lost their foundation. Without a secure inventory, claims about function and patterning are unsupported.

  2. Core and auxiliary

  Viewing this episode through a Duhemian lens clarifies why the controversy persists despite the linguistic consensus. The core of the Whorfian thesis is the principle of linguistic relativity itself: that the structure of a language affects its speakers' worldview or cognition. The specific claims about Hopi tenselessness, the absence of time words, and the process metaphysic are auxiliary hypotheses used to test that core. Malotki's monograph successfully falsified the auxiliary hypotheses regarding Hopi linguistics. He demonstrated that the specific data Whorf used to support the core theory was incorrect. However, falsifying the auxiliary does not logically falsify the core. Relativity could still be true even if Hopi is not the evidence for it.

  The persistence of the "Hopi have no concept of time" claim after Malotki's publication reveals how auxiliary hypotheses can detach from their theoretical framework and acquire independent cultural life. In textbooks and popular discourse, the specific Hopi claim became a synecdoche for the entire relativity program. When Malotki disproved the Hopi claim, the public narrative treated it as a disproval of the core theory, because the auxiliary had become the primary representative of the theory. This shows that theses of this kind are often held not as complex theoretical networks but as flagship examples. When the example collapses, the theory is perceived as collapsed, regardless of the logical distinction between core and auxiliary. Furthermore, the persistence suggests a resistance to revising deep-seated narratives about "primitive" versus "modern" cognition. The Whorfian Hopi fit a preconceived anthropological archetype; the Malotkian Hopi, who speak about time much like anyone else, were less narratively useful. The surrender of the thesis was therefore sociological as much as evidential; the discipline surrendered the specific case to save the reputation of linguistics as a science, but the core question of relativity was merely displaced, not resolved.

  3. The confound

  Whorf's reasoning assumed a unidirectional arrow from grammar to worldview, but as you note, grammar, subsistence, ritual, and contact are confounded variables. In the Hopi case, the ceremonial calendar is intricate and time-conscious, yet Whorf argued the language was not. This creates an identification problem: if Hopi speakers demonstrate time-consciousness in ritual but Whorf claims they lack it in language, is the language masking the cognition, or is the ritual borrowing from contact? We cannot isolate the linguistic variable. Once this is granted, the Hopi case cannot support strong causal claims about language determining thought. It can only support correlational claims about language and cultural practice co-varying, or perhaps weak claims about habitual attention shaped by obligatory grammar.

  The modern experimental program inherits this structural weakness to varying degrees depending on how well it isolates joint (iv) from joint (i). Domains like absolute frames of reference (e.g., Guugu Yimithirr cardinal directions) are more robust because they allow for non-linguistic testing of cognition. Researchers can test spatial reasoning in tasks that do not require language production, thereby separating joint (iv) from joint (i). If speakers solve spatial tasks differently based on linguistic encoding without using language during the task, the confound is reduced. Color naming and numeral systems are more fragile in light of the Hopi episode because they often rely on mapping linguistic inventory directly to perceptual discrimination. If the Hopi case teaches us anything, it is that inferring cognition (iv) solely from inventory (i) is perilous. The Hopi case suggests that domains where non-linguistic behavioral evidence is easily gathered (spatial orientation) are robust, while domains where evidence relies on interpreting linguistic semantics (metaphysics of time) are fragile. The Hopi failure was a failure to verify joint (iv) independently; modern research that replicates this failure remains vulnerable to the same critique.

  4. The reflexive question

  Malotki's positive claim—that Hopi speakers structure time spatially like everyone else—is indeed an inference from linguistic data to a universal feature of thought. Methodologically, this commits the same move it was deployed to punish: inferring cognition from grammar. If Whorf was wrong to say "grammar X implies thought Y," Malotki is potentially wrong to say "grammar X implies universal thought Z." Both assume a tight coupling between joint (i)/(iii) and joint (iv).

  However, this symmetry does not cancel out evidentially. Malotki retains an advantage based on the null hypothesis. In scientific inquiry, universality is the default assumption until variation is proven. Whorf claimed variation; Malotki claimed uniformity. To prove variation, one needs positive evidence of difference. To prove uniformity, one needs only to show that the alleged difference is absent. Malotki showed that the linguistic machinery for time exists and functions similarly to other languages. While his leap to universal cognition is still an inference, it is a conservative one aligned with the broader human biological uniformity. Whorf's leap was a stronger claim requiring more evidence. Furthermore, Malotki's inference is supported by cross-linguistic typology; if most languages spatialize time, and Hopi does too, the universalist inference is inductively stronger than Whorf's exceptionalist inference. Nevertheless, the reflexive point stands: neither side fully escaped the trap of assuming linguistic structure maps transparently to cognitive structure without independent psychological verification. The evidential advantage lies not in the logic of the inference, which is identical, but in the weight of the inventory data and the prior probability of the claim. Malotki wins on data quality and parsimony, not on methodological purity.

  *Historical Note:* There is some uncertainty regarding the specific informants Whorf used and the duration of his fieldwork compared to Malotki's multi-year immersion. Whorf's work was largely based on texts and consultations with a few speakers, whereas Malotki conducted extensive fieldwork. Settling the exact extent of Whorf's data limitations would require access to his original field notes, which are not fully standardized in the public record. This matters for assessing whether Whorf's error was theoretical or merely empirical.
