answer: |-
  Here is the translation of Sandel's objections into your operating vocabulary, followed by the residue report you asked for.

  ### The Translation

  **1. Corruption/Degradation $\rightarrow$ Endogenous Valuation of the Asset Class**
  In your framework, a kidney is a unit with a fixed medical value, and the mechanism is a neutral pipe for transfer. Sandel argues the *mode of transfer* alters the valuation of the unit itself.
  *   **Market Design Restatement:** Introducing price changes the utility function of the agents regarding the *nature* of the good. It shifts the kidney from a "gift good" (high social utility, zero price) to a "commodity good" (market price, potential social stigma). If the mechanism changes the good's classification, the historical data on match quality and post-op compliance (based on gift models) becomes invalid for the new mechanism. You are not just clearing a market; you are redefining the asset.

  **2. Unequal Bargaining Power $\rightarrow$ Binding Participation Constraints under Asymmetric Wealth**
  You treat "voluntary" as "incentive compatible" (IC)—i.e., the agent prefers participating to their outside option. Sandel argues that if the outside option is destitution, the IC constraint is met technically but violates a normative threshold of freedom.
  *   **Market Design Restatement:** The participation constraint is being driven by a catastrophic outside option rather than true preference revelation. This introduces selection bias where the supply side is disproportionately drawn from nodes with high liquidity constraints. In optimization terms, you are maximizing efficiency by exploiting a specific subset of the population's vulnerability, which creates a distributional skew that looks like exploitation even if the transaction is Pareto improving.

  **3. Crowding Out $\rightarrow$ Negative Externality on the Altruistic Supply Curve**
  This is the daycare fine example. You worry about dropout rates; Sandel worries that price displaces the moral motivation that sustains the unpaid pool.
  *   **Market Design Restatement:** Introducing a price signal $P > 0$ generates a negative network externality on the $P = 0$ supply curve. If the paid market cannibalizes the altruistic market, total thickness decreases. The cost of the paid kidney isn't just the dollar amount; it's the loss of the unpaid donors who would have existed in the counterfactual. This is a dynamic efficiency loss: short-term allocation gain vs. long-term supply contraction.

  ***

  ### The Residue Report

  Here is the breakdown of what fits, what bends, and what breaks.

  **1. Clean Fit: Crowding Out**
  You are right; this translates perfectly. It is an empirical claim about incentive compatibility over time. You can model this. You can run A/B tests or look at blood plasma markets. If paying donors reduces the total pool size by degrading intrinsic motivation, that is a standard optimization problem. It's a constraint on the objective function: *Maximize matches subject to $\frac{\partial(\text{Altruistic Supply})}{\partial(\text{Price})} < 0$.* This is not philosophy; it's engineering.

  **2. Forced Fit: Unequal Bargaining Power**
  This requires bending your framework. Standard market design treats wealth as an exogenous parameter. To capture Sandel's objection, you have to treat "desperation" as a variable that invalidates consent even if IC is satisfied.
  *   **The Bend:** You have to introduce a "Fairness Constraint" or a "Vulnerability Weight" that penalizes matches derived from high-liquidity-constraint nodes. But where do you set the threshold? Market design has no internal metric for "too poor to consent." You have to import a normative number from outside the model. You can model the *effect* of the constraint, but the model cannot tell you *why* the constraint exists.

  **3. No Fit: Corruption/Degradation**
  This does not translate. It breaks the foundational assumption of your framework.
  *   **The Break:** Market design assumes preferences are **exogenous inputs**. You take what people want as given and try to satisfy it efficiently. Sandel's corruption argument is that markets make preferences **endogenous**. The mechanism *creates* the preference structure it is supposed to satisfy.
  *   In your system, repugnance is a cost parameter (e.g., "20% of the population dislikes this, discount utility by 0.2"). Sandel is saying repugnance is a **validity condition**. It's not that people dislike it; it's that the transaction loses its moral legitimacy *regardless* of whether people dislike it.
  *   You cannot model "the meaning of the act" as a variable. Your framework optimizes allocation; it cannot evaluate *constitution*. If you try to model this, you end up infinite looping: you need a preference to value the meaning, but the market changes the meaning of the preference.

  ***

  ### The Blind Spot Assessment

  You bet that whatever doesn't translate is "squeamishness dressed up as a moral claim."

  **You are half-right, but the conclusion is dangerous.**

  It is not squeamishness. It is **ontological**.

  Market design is structurally blind to **preference formation**. Your tools are designed to clear markets given a set of wants. They are not designed to ask where those wants come from or whether the act of clearing the market changes the wants themselves.

  When Sandel talks about degradation, he is pointing out that you are optimizing a function $f(x)$ while ignoring that the act of optimization changes $x$ to $y$.
  *   **Your view:** Repugnance is a friction cost (like transaction fees or regulatory lag).
  *   **Sandel's view:** Repugnance is a signal that the mechanism is incompatible with the social norm required to sustain the system long-term.

  **The Verdict:**
  The residue isn't emotional noise; it's a **model specification error**.
  If you treat repugnance as just another constraint (e.g., "don't offer chains that look like slavery"), you are engineering around the symptom. Sandel is arguing that the *existence* of a price for kidneys changes the social meaning of kidney donation for everyone, including those who never sell.

  **Why this matters for you:**
  If you ignore the non-translatable residue, you risk a **regime shift**.
  1.  **Trust Collapse:** If the public perceives the mechanism as exploitative (Unequal Bargaining Power) or corrupting (Degradation), the "Altruistic Supply Curve" doesn't just shift; it vanishes. The thickness of your market relies on social trust.
  2.  **Policy Reversal:** If the mechanism is seen as morally invalid rather than just "unpopular," regulators won't just tweak the constraints; they will shut down the exchange. Repugnance isn't a demand curve; it's a veto power.

  **Summary:**
  Crowding out is a variable you can manage. Coercion is a constraint you can impose if you choose. Corruption is a structural blind spot. It's not squeamishness; it's the limitation of using a tool designed for *allocation* to solve a problem of *social constitution*. If you treat the non-translatable parts as mere squeamishness, you are assuming the social norms surrounding organ donation are stable exogenous variables. They are not. They are the infrastructure your market runs on.
