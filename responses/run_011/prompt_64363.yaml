      *   **Future Procedure:** Adopt a "Defined EV + Downside Constraint" rule. If EV is undefined or sensitive to modeling assumptions regarding extreme tails, the proposal is ineligible for EV-based comparison. Also, introduce a "catastrophic downside veto."
      *   **Opposing View (Strongest Case):** Long-termism. If there's even a tiny chance B saves billions, ignoring it because the math is messy might be cowardice. The "natural ordering" might reflect causal reality better than arbitrary rearrangement.

