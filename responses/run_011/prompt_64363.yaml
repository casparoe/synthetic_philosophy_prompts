  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** Wednesday Evening
  **SUBJECT:** Recommendation on Thursday's Allocation Decision

  **Purpose**

  This memo summarizes the issue regarding Thursday's vote on the $2.4M allocation and provides a recommendation. We face a conflict between two proposals: Proposal A (maternal health) and Proposal B (pathogen early-warning). Our board rule mandates funding the proposal with the higher expected life-years per dollar. Staff analysis indicates Proposal B technically exceeds Proposal A under a specific calculation, but that calculation is mathematically unstable. This note explains why the rule cannot be applied as written and recommends a path forward.

  **The Core Problem**

  Proposal A offers a robust estimate: roughly 40,000 life-years with high confidence and no catastrophic downside. Proposal B relies on a model where extreme outcomes drive the value. While the standard calculation yields ~69,300 life-years, this number is not stable. Because the model involves infinite scenarios with alternating positive and negative outcomes, the total sum changes depending on the order in which you count the scenarios.

  This is not a matter of uncertainty or risk tolerance; it is a matter of definition. When a sum changes based on the order of calculation, the expected value is undefined. We cannot follow a rule that says "choose the higher number" when one of the options does not yield a single, unique number. Following the "natural ordering" to get 69,300 is arbitrary; rearranging the same data yields values both above and below Proposal A.

  **Evaluation of Alternatives**

  Several solutions were proposed to rescue the comparison:

  1.  **Stick to the Rule (Fund B):** This requires accepting the "natural ordering" as privileged. There is no mathematical justification for this. It treats an artifact of the model structure as a fact.
  2.  **Cap the Payoffs:** One trustee suggested capping extreme outcomes (e.g., at 500,000 life-years). This forces the math to stabilize. However, choosing the cap is arbitrary. More importantly, the need for a cap admits that the model's extreme tails are unrealistic. If the tails are unrealistic, the original expected value was never credible.
  3.  **Scenario-by-Scenario Comparison:** This approach looks at downside risk. Proposal A has no catastrophic downside. Proposal B's model includes scenarios where we accelerate the pathogen, causing massive harm. On a downside basis, A is strictly superior.

  **Recommendation**

  **I recommend we fund Proposal A.**

  Since the metric required by our rule (expected life-years) is undefined for Proposal B, the rule cannot mechanically select B. In the absence of a valid comparison, we should default to the proposal that is robustly positive and lacks existential downside. Funding A fulfills our mission without relying on a broken calculation. Funding B requires us to ignore the mathematical instability and the modeled risk of making the problem worse.

  **Revised Decision Procedure**

  To prevent this impasse in the future, I propose we amend the allocation rule with a two-step test for "High-Impact" proposals:

  1.  **Robustness Check:** The expected value must be insensitive to reasonable changes in modeling assumptions regarding extreme tails. If the value relies on infinite or unbounded series that do not converge absolutely, the proposal is ineligible for EV-based comparison.
  2.  **Downside Constraint:** Any proposal with a modeled scenario resulting in catastrophic negative impact (greater than 10% of the fund's annual impact) requires a separate supermajority vote, regardless of expected value.

  This ensures we remain rigorous without being trapped by mathematical artifacts.

  **The Strongest Case Against This Recommendation**

  I must acknowledge the strongest argument for funding Proposal B, articulated by the Co-Chair. If our goal is to maximize good over the very long term, avoiding high-variance interventions because the math is messy may be cowardice. The "natural ordering" of the model might reflect causal reality better than a rearranged series, even if mathematicians treat them as equivalent. If there is even a small chance that Proposal B prevents a global catastrophe, the upside dwarfs Proposal A's steady gains. By rejecting B due to technical undefinedness, we may be privileging accounting hygiene over actual lives saved. This is a valid philosophical stance: that when stakes are existential, we should not let decision theory paralysis stop us from acting on potential huge gains.

  **Next Steps**

  If the committee accepts this recommendation, we will vote to fund Proposal A on Thursday. I will also circulate a draft amendment to the allocation policy incorporating the Robustness Check and Downside Constraint for approval at our next quarterly board meeting.

  Please review this before morning. I am available to discuss any concerns prior to the vote.
