          *   **Pre-draft step:** Sketch bullets on deciding considerations vs. noise.

  2.  **Deconstruct the Decision Theory Problem:**
      *   **The Core Issue:** This is a classic "Pasadena Game" or St. Petersburg-like paradox variant involving conditional convergence. When an expected value series is conditionally convergent, the expected value is undefined because it depends on the ordering of outcomes. In decision theory, this means EV maximization fails as a decision criterion.
      *   **Proposal A:** Robust, bounded, high confidence.
      *   **Proposal B:** Unbounded tails, undefined EV, model dependency on ordering.
      *   **The Rule:** "Fund whichever proposal has the higher expected life-years."
      *   **The Break:** The rule assumes EV exists. For B, it doesn't (mathematically). Therefore, the rule cannot mechanically apply.
