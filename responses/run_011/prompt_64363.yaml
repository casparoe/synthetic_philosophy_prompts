          2.  *Cap Payoffs (Trustee 3):* This truncates the distribution. It makes EV defined. But where do you set the cap? It's ad hoc. However, it acknowledges that billion-life-year swings are model artifacts, not reality.
          3.  *Scenario-by-Scenario (Trustee 4):* This sounds like stochastic dominance. Does B dominate A? No, because B has massive negative tails. A has no catastrophic downside.
          4.  *Default to A (Program Officer):* Since the metric is broken, revert to a fallback.
      *   **Deciding Considerations:**
          *   **Undefined EV:** The mathematical fact that the sum changes based on ordering means the metric requested by the rule is nonexistent. You can't compare a number to a non-number.
          *   **Model Credibility:** The model predicts ±5 billion life-years. This is physically/population impossible (or implies existential risk/opportunity far beyond the foundation's leverage). The tails are noise, not signal.
          *   **Downside Risk:** A has no catastrophic downside. B has modeled catastrophic downside (accelerating the pathogen).
          *   **Rule Integrity:** Following the rule blindly when its input is undefined violates the spirit of rigor.
      *   **Noise:**
          *   The specific value of ln(2).
          *   The specific rearrangement values (1.04 vs 0.35).
