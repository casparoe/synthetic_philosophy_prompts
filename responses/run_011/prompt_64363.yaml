          *   Proposal B: Engineered pathogen early-warning. Modeled as an alternating series (1 - 1/2 + 1/3 - 1/4...). EV = ln(2) ≈ 69.3k life-years (beats A).
          *   **The Problem:** The series is conditionally convergent (Riemann series theorem). Rearranging terms changes the sum (1.04 units, 0.35 units, etc.). Extreme outcomes (billions of life-years saved/lost) at low probabilities drive the EV but seem implausible ("obviously silly").
          *   **Board Dynamics:** Co-chair wants to stick to the rule (fund B). Program Officer says EV doesn't exist (fund A). One trustee wants to cap payoffs. Another wants scenario-by-scenario comparison.
