answer: |-
  **Verdict**

  The correct position is Strategy Two: omissions are not causes in the strict metaphysical sense, and the appearance that they are is generated by normative expectations rather than causal relations. The asymmetry presented in *The Deputy* case is not a causal fact but a normative one, distinguishing the phone-guard's breach of duty from the deputy's compliance with instruction. Consequently, causation is not a univocal relation covering both positive events and negative absences. The single claim that would most damage this verdict is the existence of a metaphysical difference between the deep-end guard's absence of attention and the shallow-end deputy's absence of attention, independent of any rules, duties, or expectations surrounding them. If such a difference existed, Strategy One might be salvageable; since it does not, we must demote omissions to a pragmatic category.

  **The cases stated precisely**

  To evaluate the strategies, we must fix the counterfactual profiles and the intuitive causal verdicts for every agent involved. In *Two Phones*, the deep-end guard omits to watch the pool because he is looking at his phone. The counterfactual is straightforward: had he been watching, the child would have lived. The intuitive verdict is that his omission is a cause of the death. The shallow-end guard is in an identical position: looking at her phone, omitting to watch. Her counterfactual is identical: had she been watching, the child would have lived. The intuitive verdict matches the deep-end guard; her omission is also a cause. Here, counterfactual dependence and causal intuition align, though we face overdetermination where either omission suffices for the outcome.

  In *The Deputy*, the deep-end guard remains on his phone. His counterfactual and intuitive verdict remain unchanged: his omission is a cause. The shallow-end guard, however, is now the deputy. She is alert but obeying a specific instruction from her supervisor to watch only the diving board. She omits to watch the whole pool. Her counterfactual is identical to the phone-guard's: had she been watching the whole pool, the child would have lived. Yet the intuitive verdict diverges sharply. We are inclined to say her omission is not a cause of the death, or at least that it is causally inert in a way the phone-guard's is not. She is an instrument of the supervisor's decision.

  This introduces the supervisor. The supervisor instructed the deputy to watch the board, breaching the regulation that requires both guards to watch the whole pool. The supervisor's counterfactual is: had she instructed correctly, the child would have lived. The intuitive verdict is that the supervisor's breach is a cause. This creates a chain: the supervisor's omission causes the deputy's omission, which allegedly does not cause the death, while the deep-end guard's omission does. The puzzle is that the deputy's physical state—eyes open, head turned, neural activity focused on the board—is arguably more robust than the phone-guard's distracted state. Yet we hesitate to call the deputy's omission a cause. The counterfactual profile is identical across the shallow-end variations, but the causal verdict flips based entirely on the presence of an upstream instruction. This divergence is the testing ground for the two strategies.

  **Strategy one**

  Strategy One insists that causation is univocal. Negative and positive causation are the same relation, holding in virtue of the same metaphysical machinery. Proponents of this view argue that the analysis of causation must be revised to accommodate omissions, not the ontology. We should treat omissions as events or states that enter into causal relations just like positive occurrences. To handle the pre-emption and overdetermination issues evident in *Two Phones*, this strategy typically borrows machinery from positive causation accounts, such as process theories or intrinsic structure accounts. The idea is that if we can identify the intrinsic character of the actual process connecting the cause to the effect, we can distinguish causes from mere background conditions.

  Applied to *The Deputy*, Strategy One attempts to locate a process connecting the guard's omission to the death. In positive pre-emption cases, we distinguish the actual cause from the pre-empted backup by looking for a complete causal process. Here, Strategy One must argue that the deep-end guard's omission is part of a complete process leading to death, while the deputy's is not. But this faces an immediate metaphysical hurdle: there is no process of not-looking. There is no energy transfer, no conserved quantity flowing from the guard's absence of attention to the child's drowning. The only physical processes occurring are the guard looking at the water (or not), the child struggling, and the water filling her lungs. The omission is defined by what is *not* happening.

  To salvage this, Strategy One might reidentify the cause as the positive activity replacing the omission. The deep-end guard's cause is not "not-looking" but "looking at phone". The deputy's cause is "looking at board". We then ask which positive act caused the death. But this collapses the distinction required by the case. Both guards are engaged in positive visual activities. Both are physically capable of turning their heads. If the cause is the positive act, then the deputy's act of looking at the board is just as much a cause as the phone-guard's act of looking at his phone, assuming both prevented the rescue. Strategy One cannot distinguish them without smuggling in the normative expectation that one ought to have been looking at the swimmer.

  Furthermore, Strategy One fails to handle the upstream regress. If the supervisor's omission is a cause, it must also be grounded in a process. But the supervisor's omission is merely the issuance of a wrong instruction. If we treat that instruction as a positive event causing the deputy's behaviour, we are no longer talking about omission causation but positive causation of behaviour. The link between the supervisor's breach and the death is still mediated by the deputy's omission. If omissions are causes, the chain of omissions must be metaphysically robust. But Strategy One provides no mechanism for "causal oomph" to transmit across an absence. It treats the absence as a placeholder for a positive event that did not occur. When nothing happens, there is nothing to bear the causal relation. The machinery for positive pre-emption relies on comparing actual processes; when the putative cause is an absence, there is no actual process to compare. Thus, Strategy One cannot explain why the deputy's omission is causally inert while the phone-guard's is not, because metaphysically, both are equally empty.

  **Strategy two**

  Strategy Two demotes omissions. It holds that omissions are not causes in the strict sense, and the appearance that they are is generated by something non-causal, such as normative expectations, statistical normality, or moral responsibility. On this view, the counterfactual misfires in *Two Phones* and *The Deputy* are symptoms of a category error. We speak of omissions as causes because it is pragmatically useful to do so, not because the world contains causal relations between absences and events. This strategy separates the metaphysics of causation from the pragmatics of explanation. Causation remains a relation between positive events; omission-talk is a shorthand for saying that a positive event was expected but did not occur, and had it occurred, the effect would have been prevented.

  Applied to *The Deputy*, Strategy Two explains the asymmetry effortlessly. The deep-end guard is expected to watch the pool. His failure to do so violates a norm, making his omission salient for explanation. We select his absence as the "cause" because it deviates from the expected course of events. The deputy, however, is obeying an instruction. Her behaviour aligns with the immediate normative framework established by the supervisor. Therefore, her omission of watching the swimmer is not salient; it is the supervisor's instruction that deviates from the higher-order regulation. The causal verdict flips not because the metaphysics changes, but because the normative baseline shifts. The deputy is not a cause because her behaviour is normal relative to her instruction, whereas the phone-guard's behaviour is abnormal relative to his duty.

  The most serious challenge for Strategy Two is the selection problem. If omissions are not causes, why do we select *this* omission rather than any other? Everyone on earth failed to save the child. Why is the guard's omission explanatory while the bystander's is not? Strategy Two must rely on a robust account of normality or expectation to avoid triviality. It must explain why some expectations count and others do not. If the account relies purely on moral culpability, it risks circularity: we pick the cause because the agent is responsible, but we assign responsibility because they are the cause. However, *The Deputy* case helps here. The deputy is not morally culpable in the same way as the phone-guard, yet she is physically identical in her absence. This suggests the selection mechanism is sensitive to institutional norms, not just moral blame.

  The risk for Strategy Two is that it makes causation too subjective. If causal claims depend on normative expectations, then causation varies with the observer's knowledge of the rules. But this is a feature, not a bug, for omission talk. We are not describing the fundamental fabric of the universe; we are assigning responsibility within a social context. The child's death is *the* thing to be explained by these omissions because the guards occupy a role defined by the prevention of death. The bystander's omission does not explain the death because the bystander occupies no such role. Strategy Two accommodates this by treating omission-causation as a hybrid of counterfactual dependence and normative expectation. The counterfactual provides the physical possibility; the norm provides the selection. Without the norm, the counterfactual is promiscuous; without the counterfactual, the norm is irrelevant. Together, they generate the illusion of a causal relation where there is only a pragmatic one.

  **What actually decides it**

  The decisive consideration is the regress problem illuminated by the supervisor's role in *The Deputy*. If Strategy One were correct and omissions were genuine causes, the supervisor's breach of regulation would be a cause of the death. This seems intuitive. However, the supervisor's breach is itself an omission (failing to issue the correct instruction). If omissions are causes, we must ask what caused the supervisor's omission. Perhaps she was distracted, or perhaps she was following a higher directive from the pool owner. If the pool owner failed to train her, that omission is also a cause. This chain threatens to regress indefinitely. Every failure to comply with every applicable rule upstream becomes a cause of the death. In a world where omissions are causes, every accident is caused by the infinite chain of everyone who failed to prevent it. Strategy One has no metaphysical principle to stop this regress, because metaphysically, every absence is equally absent.

  Strategy Two stops the regress naturally. The chain of explanation stops where the normative relevance stops. We stop at the supervisor because she is the locus of the relevant duty breach in this context. We do not trace it back to the pool owner unless we are investigating institutional liability rather than immediate causation. The asymmetry in *The Deputy* tells us something specific that general promiscuity objections do not: it isolates the normative mechanism from moral blame. The deputy is not blameworthy, yet her omission is excluded from causal status. The phone-guard is blameworthy, and his omission is included. But the crucial factor is not the blame itself, but the deviation from expectation. The deputy met her local expectation (obey the supervisor); the phone-guard did not. This confirms that the "causal" status of an omission is determined by its deviation from a normative baseline, not by its metaphysical connection to the effect.

  This implies that the asymmetry in *The Deputy* is purely normative. There is no causal fact of the matter distinguishing the guards' absences. The physical world contains only the child drowning and the guards looking elsewhere. The "causation" is imposed by our interest in assigning responsibility. If we treat the deputy's compliance as carrying causal weight, we are smuggling evaluation into the causal relation. We are saying her action was "right" so it cannot be a cause of harm. But causes are not morally evaluated in positive cases; a bullet causes death regardless of whether the shooting was justified. If we treat omissions differently, we admit they are not causes in the same sense.

  Therefore, *The Deputy* decides the issue by showing that counterfactual dependence is insufficient for omission-causation, and metaphysical process accounts are inapplicable. The only variable that changes between the phone-guard and the deputy is the normative status of their inaction. Since the metaphysics remains constant while the causal verdict changes, the verdict must depend on the norm. This validates Strategy Two. The regress question further cements this: only a normative cut-off point can prevent every upstream failure from becoming a cause. A metaphysical account cannot distinguish the supervisor's breach from the rule-maker's breach without arbitrary stipulation. A normative account distinguishes them by relevance. Thus, the asymmetry is not a causal fact to be discovered but a normative boundary to be drawn. We must endorse Strategy Two because Strategy One cannot account for the selectivity of omission-causation without collapsing into absurdity.

  **What my verdict costs**

  Endorsing Strategy Two obliges me to concede that causation is not a natural kind. It is a disjunctive concept: positive causation is a metaphysical relation between events, while negative causation is a pragmatic relation between expectations and outcomes. This disunity is theoretically costly. We lose the elegance of a unified theory of causation that applies across all domains. We must accept that when we say "the lack of water caused the plant to die," we are speaking loosely, whereas "the frost caused the plant to die" is metaphysically strict. This creates a friction in scientific explanation where omissions are frequently cited as causes.

  Furthermore, I must accept that causal claims involving omissions are context-sensitive in a way positive causal claims are not. They depend on the observer's knowledge of duties and norms. This makes causation less objective than we might prefer. However, the strongest argument to live with this cost is that it preserves the integrity of metaphysics while accommodating our practical needs. If we insist on Strategy One, we distort the metaphysics to fit our language, leading to promiscuity and regress. By accepting Strategy Two, we acknowledge that our causal talk about omissions is doing normative work, not descriptive work. This aligns with legal and moral practice, where the distinction between the phone-guard and the deputy is crucial for liability. We gain a clear account of responsibility without cluttering the ontology with negative events. The cost of disunity is preferable to the cost of absurdity. We should treat omissions as causes only in the sense that we treat them as relevant explanations, not as metaphysical anchors. This verdict saves causation from becoming a catch-all for every failure in the universe.
