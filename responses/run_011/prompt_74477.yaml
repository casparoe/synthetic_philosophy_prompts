      *   *Friend's View (Realist/Qualia-friendly):* There is a "residue" left over after functional description. When she says "it tastes different," she means something about the *experience* itself, not just her judgment.
      *   *The Challenge:* Write a speech that praises her skills (discrimination, memory, integrity) without invoking "inner experience" as a separate entity, yet without sounding like a robotic reduction that insults her humanity. The "origin coffee" story is key: she admitted her *standards* changed. For the Dennettian, this is proof that the "taste" is constituted by the standards/judgments. For the Realist, it's just an error about the object vs. the subject. The speech must navigate this so she feels honored (her integrity is highlighted) and the philosophers see the functionalist underpinning without it being aggressive.

