answer: |-
  Good evening. Before I say anything else, I need to acknowledge a directive from the guest of honor. She asked me to remove any mention of her being "gifted," "blessed," or possessing a "palate like no other." She says those words are lazy. She says forty-one years is not a gift; it is showing up. She says luck got her in the door, but attention kept her there. So, in the interest of keeping my job until the end of this toast, I will follow orders.

  What she actually did here was not magic. It was work. For twenty years, she ran this cupping panel. That means she sat at this table thousands of times, slurping from spoons, spitting into buckets, and asking the room: *Is this the same as that?* When the rest of us tasted "coffee," she tasted specific histories. She could tell you where a bean grew, how it was dried, and exactly when the roast drifted off course. But she never claimed this knowledge was private. She never claimed she had access to a secret flavor the rest of us couldn't reach. She claimed only that she had learned to make finer distinctions than we had, and to hold those distinctions steady over time.

  There is a story many of you know. For years, she insisted a specific origin coffee had changed. She stood before the panel and said the profile was different than it was in the nineties. She defended this call against buyers, against growers, against her own team. Then, she stopped. She went back through the records. She tasted the old archives. And she came back to us and said: *I was wrong. The coffee didn't change. I did.* Her standards had shifted. Her map had moved, not the territory. She withdrew the claim publicly. That moment made her reputation. Not because she was infallible, but because she cared more about the accuracy of the call than the authority of the caller.

  That is what we are celebrating. Not a mystical connection to the bean, but a disciplined commitment to getting it right. She built a language we could all speak. When she said "bright" or "flat," she meant something we could check. She turned tasting from a private feeling into a public fact. She taught us that the value isn't in having a sensation no one else understands; the value is in making a judgment everyone can verify.

  To her family: she wasn't just smelling beans. She was maintaining a standard of truth for this company. To her colleagues: she gave us the tools to agree. To the philosophers in the room: she demonstrated that what matters is not what happens in the dark, but what holds up in the light.

  So, we are not here to honor a genius. We are here to honor a worker who paid attention when it was easier to guess. Who corrected herself when it was easier to dig in. Who leaves us with a panel that knows how to listen to the cup, and to each other.

  Thank you for the coffee. Thank you for the clarity. And thank you for showing us that the best taste is the one we can share.

  ***

  **Afterword**

  You asked for bluntness. Here is where the speech cheats.

  First, the phrase "private feeling" versus "public fact" smuggles in the distinction you want to dissolve. By contrasting them, I implicitly grant the realist's premise that there *could* be a private feeling, even while dismissing its value. A hardline Dennettian shouldn't concede the category exists to reject it.

  Second, the story of her correction leans on your view. It frames her admission ("My standards moved") as proof that the taste *is* the standard. A qualia realist would argue she simply corrected a mismatch between her internal experience and her external report. The speech treats her functional adjustment as the whole story, which begs the question against your friend.

  Third, the praise collapses if she stands up and says, "I corrected my report because I wanted my words to match what I *felt*." If she insists the experience itself was the target of her honesty, not just the consistency of her judgments, the speech's functionalist foundation cracks.

  The consideration that would force you to abandon your view is this: If the *normative force* of her correction depends on an independent reality of experience. She didn't just want to be consistent; she wanted to be *faithful* to how the coffee struck her. If that "striking" is not itself a functional disposition but the ground upon which dispositions are built, then your account leaves out the very thing that made her integrity meaningful. You can explain the behavior, but you cannot explain why she cared so much about getting the experience right unless the experience is real.
