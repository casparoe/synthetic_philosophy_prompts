answer: |-
  ### 1. The Procedure: "The Legibility & Harmony Protocol"

  **Time Budget:** 10 minutes standard. 45 minutes escalated.
  **Verdict Vocabulary:** `Pass`, `Pass-with-Note`, `Fail-on-Letter`, `Fail-on-Style`, `Escalate`.

  **Step 1: The Flash Test (Recognition)**
  *   **Question:** Is the glyph identified correctly within 100ms at the smallest intended text size?
  *   **Sufficient Answer:** 9/10 naive viewers name the letter correctly without hesitation.
  *   **Verdict:** If <9/10 → `Fail-on-Letter`. If ≥9/10 → Proceed.
  *   **Sign-off:** QA Lead.

  **Step 2: The Texture Test (Style)**
  *   **Question:** Does the glyph disrupt the color and rhythm of a paragraph set in the family's standard measure?
  *   **Sufficient Answer:** The glyph is invisible in a block of text; it does not create a "hole" or a "dark spot."
  *   **Verdict:** If it creates visual noise → `Fail-on-Style`. If it blends → Proceed.
  *   **Sign-off:** Design Lead.

  **Step 3: The Neighbor Test (Context)**
  *   **Question:** Does the glyph confuse with its structural neighbors (e.g., a/o/d, n/h/u) when set side-by-side?
  *   **Sufficient Answer:** No viewer confuses the glyph for its neighbor in a forced-choice test (50 trials).
  *   **Verdict:** If confusion rate >5% → `Fail-on-Letter`. If clear → Proceed.
  *   **Sign-off:** QA Lead.

  **Step 4: The Spirit Check (Intent)**
  *   **Question:** Does this glyph share the "way of being drawn" (ductus, contrast axis, terminal logic) of the existing family?
  *   **Sufficient Answer:** Design Lead affirms the construction logic matches the master forms.
  *   **Verdict:** If logic diverges without cause → `Fail-on-Style`. If consistent → `Pass`.
  *   **Sign-off:** Design Lead.

  **Escalation Path:**
  *   **Trigger:** Any `Fail` verdict contested by the other department, or a `Pass` verdict that triggers a `Pass-with-Note` on legibility.
  *   **Process:** 30-minute review with Production Lead, Design Lead, and QA Lead.
  *   **Outcome:** `Pass` (with documented risk), `Fail` (final), or `Redesign`.
  *   **Sign-off:** Production Lead.

  ---

  ### 2. The Cheap Tests

  **Order of Operations:** Flash → Texture → Neighbor → Spirit. (Recognition before Style).

  **1. Flash Presentation (Target Sizes)**
  *   **Method:** Show glyph on screen for 100ms at smallest and largest intended sizes.
  *   **Decisive Result:** Immediate correct naming.
  *   **Limitations:** Cannot measure reading flow, only isolated recognition.
  *   **Contingency:** If no viewers available, Design Lead must simulate naive viewing by squinting/blurring the screen. If deadline prevents this, verdict defaults to `Pass-with-Note` (Risk Assumed).

  **2. Substitution (Invented Words & Real Text)**
  *   **Method:** Insert glyph into "nhamqo" strings and 50 words of body copy.
  *   **Decisive Result:** In strings, it must not break syllable grouping. In text, it must not draw the eye.
  *   **Limitations:** Cannot settle aesthetic beauty, only integration.
  *   **Contingency:** If text is unavailable, use "lorem ipsum" with the target glyph substituted for the standard character.

  **3. Forced Choice (Confusable Neighbours)**
  *   **Method:** Rapid toggle between the glyph and its closest neighbor (e.g., 'a' vs 'o').
  *   **Decisive Result:** Viewer can distinguish them 100% of the time at text size.
  *   **Limitations:** Does not account for contextual ligatures or kerning fixes.
  *   **Contingency:** If sketch only, compare vector outlines directly. If overlap of key features (counter, stem) exceeds 80%, flag for `Escalate`.

  **4. Side-by-Side (Family Existing Forms)**
  *   **Method:** Set glyph next to the 'n', 'o', and 'u' of the current master weight.
  *   **Decisive Result:** Stroke weight, contrast, and x-height align visually (not just numerically).
  *   **Limitations:** Subjective alignment.
  *   **Contingency:** If family is new (no existing forms), compare against the Design Lead's reference sketch.

  **5. Native-Reader Checks (Script Expansion)**
  *   **Method:** Show glyph to a fluent reader of the target script.
  *   **Decisive Result:** Reader identifies it as a native character, not a "transplant."
  *   **Limitations:** Availability of readers.
  *   **Contingency:** If no readers available, **STOP**. Verdict is automatically `Escalate`. Do not ship unverified script extensions.

  ---

  ### 3. Handling Conflicts

  **Veto Hierarchy:**
  1.  **Legibility (`Fail-on-Letter`)** trumps **Style**. A beautiful glyph that cannot be read is a defect.
  2.  **Style (`Fail-on-Style`)** trumps **Optimization**. A legible glyph that destroys the family's texture is a defect.
  3.  **Designer's Intent** trumps **Metrics**, but not **Data**. If the spec says "yes" but the Flash Test says "no," the Data wins.

  **"Recognisably an 'a', but not our 'a'":**
  This is a single decision: `Fail-on-Style`. It acknowledges the letter identity is secure but the stylistic contract is broken.

  **Designer vs. Data:**
  If the Designer argues "It feels right" and the Flash Test says "Readers see an 'o'":
  *   **Action:** `Escalate`.
  *   **Resolution:** The data defines the *risk*, the Designer defines the *value*. The Production Lead weighs the risk against the value.

  **Recorded Dissent:**
  If a glyph is shipped against a `Fail` verdict (e.g., Founder override):
  *   **Mechanism:** A "Known Issue" tag is attached to the glyph in the internal release log and the technical documentation.
  *   **Forwarding:** The tag travels to the Customer Support team. If a customer complains about legibility, Support references the tag: "This is a known design choice, not a bug."

  ---

  ### 4. Honest Labelling

  **Where Taste Wears Clothes:**
  *   **The Texture Test:** "Disrupting rhythm" is subjective. QA can measure contrast, but only a human eye can judge "color."
  *   **The Spirit Check:** "Way of being drawn" is intuition codified. It is taste, validated by consistency.

  **The Client Script (2 Sentences):**
  *"The glyph meets all geometric specifications, but it fails to integrate with the surrounding letters, creating visual friction that slows reading. We prioritize the harmony of the whole system over the correctness of the isolated part."*

  ---

  ### 5. Commitment Audit

  **Commitments That Survive:**
  *   **Graded Membership:** Handled by the `Pass-with-Note` and `Escalate` verdicts. We acknowledge a glyph can be "mostly right" but risky.
  *   **Context-Sensitivity:** Handled by the Neighbor and Texture tests. We do not judge the glyph in isolation.
  *   **Identity/Style Unity:** Handled by running Recognition and Spirit checks in the same session. We do not separate "what it is" from "how it looks."

  **Commitments Dropped:**
  *   **"Shared Way of Being Drawn" as a Universal:** We cannot define this philosophically for the procedure. We operationalize it as "consistency with existing masters."
  *   **Infinite Context:** We cannot test every setting. We drop the promise of universal perfection for a guarantee of *sampled* reliability.

  ---

  ### 6. Case Rulings

  **Case A: The Flattened 'a' (Light Weight)**
  *   **Test Results:**
      *   Flash (8px): Pass (Recognized).
      *   Flash (60pt): Fail (4/10 call it 'o').
      *   Neighbor: Fail (Confuses with 'o' at display sizes).
  *   **Procedure Logic:** The glyph fails the Flash Test at the upper bound of the size range. A single master must function across its range.
  *   **Verdict:** `Escalate`.
  *   **Reasoning:** The procedure identifies a size-dependent failure. It cannot `Pass` because it breaks at 60pt. It cannot `Fail` outright because it works at 8px.
  *   **Resolution:** The team must create Optical Sizes (Light Text vs. Light Display) or redesign the master to compromise. The procedure forces the technical solution (splitting masters) rather than allowing a broken single master.

  **Case B: The Greek Alpha**
  *   **Test Results:**
      *   Flash (Latin readers): Pass.
      *   Flash (Greek readers): Fail (Hesitation/Rejection).
      *   Native-Reader Check: Fail ("Latin in costume").
  *   **Procedure Logic:** Native-reader check is a hard gate for script expansions. Legibility for the *target* audience trumps aesthetic approval from outsiders.
  *   **Verdict:** `Fail-on-Letter`.
  *   **Reasoning:** A Greek letter that Greek readers hesitate over is not a Greek letter; it is a decorative symbol. The procedure protects the foundry from shipping a "fake" script.
  *   **Resolution:** Redesign alpha based on Greek ductus, even if it weakens the visual link to Latin.

  **Case C: The Founder's 'Q'**
  *   **Test Results:**
      *   Flash (Display): Pass.
      *   Flash (Text): Fail (Substantial minority take it for 'O').
      *   Texture: Pass (Charming in display).
      *   Spirit: Pass (Signature design).
  *   **Procedure Logic:** The glyph fails the Flash Test at text sizes. This triggers a `Fail-on-Letter` for the text masters.
  *   **Verdict:** `Escalate` (with Recommendation: Restrict to Display Weights).
  *   **Reasoning:** The procedure *does* cost you the 'Q' in text sizes. It flags the legibility risk as a `Fail`. It does not ban the glyph, but it bans the *unrestricted use* of the glyph.
  *   **Why this saves the procedure:** If the procedure allowed this to `Pass` for text, it would be a lie. By forcing an `Escalate`, it forces you to make a business decision: "We accept the legibility cost for brand identity." If you override the `Fail` to ship it in text, you must attach the **Recorded Dissent**. The procedure ensures you pay the price of the decision in documentation and support burden. It protects the team from blame when customers complain.

  ---

  ### 7. Limitations

  **What the Procedure Cannot Do:**
  1.  **Judge Beauty:** It can identify ugliness that disrupts texture, but it cannot mandate beauty. A boring, compliant glyph will `Pass`.
  2.  **Predict Cultural Shift:** It tests current recognition. It cannot anticipate that a form will become legible in 10 years as readers adapt.
  3.  **Resolve Radical Innovation:** If a design breaks all precedents (e.g., a new script logic), the "Neighbor Test" and "Spirit Check" will return `Fail` because there are no neighbors or spirit yet.
  4.  **Replace the Designer:** It hands the decision back to a person at the `Escalate` stage. It is a filter, not a brain.

  **Confident Wrong Answers:**
  *   **High-Context Scripts:** In scripts where meaning relies heavily on word-shape rather than glyph-shape (e.g., some cursive traditions), the isolated Flash Test may `Fail` a glyph that is perfectly legible in flow.
  *   **Variable Fonts:** The procedure assumes static instances. It may `Fail` an interpolation that is only valid at specific axis points.

  **The Human Handoff:**
  *   Any `Escalate` verdict.
  *   Any `Pass-with-Note` where the note concerns brand identity over legibility.
  *   Any decision to ship a glyph that failed a Native-Reader check due to lack of budget (Risk Assumed).
