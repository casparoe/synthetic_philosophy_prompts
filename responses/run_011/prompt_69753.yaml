  8.  **Limitations (Section 7):**

      *   Can't judge beauty.
      *   Can't predict cultural shifts.
      *   Can't replace the Designer's eye for the "spirit."
      *   Fails on radical innovation (new scripts, variable axes).

  9.  **Review and Refine:**

