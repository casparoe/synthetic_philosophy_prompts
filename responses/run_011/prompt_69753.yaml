      *   *Process Design:* Needs to be fast (10 mins) but allow escalation. Needs to satisfy QA (binary output eventually) but respect Design (nuanced input).
      *   *Verdict Vocabulary:* `Pass`, `Pass-with-Note`, `Fail-on-Letter` (not recognizable), `Fail-on-Style` (recognizable but wrong family), `Escalate`.

  3.  **Drafting the Procedure (Section 1 & 2):**

      *   *Time Budget:* 10 minutes standard.
      *   *Step 1: The Flash Test (Recognition).* Quick exposure. If they can't name it, it fails on Letter.
      *   *Step 2: The Texture Test (Style).* Put it in a word. Does it stick out like a sore thumb or disappear too much?
      *   *Step 3: The Neighbor Test (Context).* Compare to 'o', 'd', 'e'. Does it confuse?
      *   *Step 4: The Designer Check.* Does it fit the "way of being drawn"?
      *   *Sign-offs:* QA leads on Letter, Design Lead on Style, Production Lead on Escalations.

      *Refining the Tests:*
      *   Need to specify *how* to run them quickly.
      *   Need to handle "impossible testing" (deadlines, no readers).
      *   *Decision Logic:* If Letter fails -> `Fail-on-Letter`. If Letter passes but Style fails -> `Fail-on-Style`. If both pass -> `Pass`. If ambiguous -> `Escalate`.

  4.  **Handling Conflicts (Section 3):**

      *   *Veto Power:* Recognition (Letter) trumps Style. You can't ship a glyph people can't read. But Style trumps Optimization (you can't make it so generic it loses the family soul).
      *   *Designer vs. Data:* If data says "unrecognizable" but Designer says "it's essential," that's an `Escalate`.
      *   *Dissent:* Needs a "Shadow Tag" in the font metadata or release notes. A formal "Minority Report."

  5.  **Honest Labelling (Section 4):**

      *   *Taste vs. Procedure:* The "Style" check is inherently taste. The "Letter" check is cognitive psychology.
      *   *Client Script:* Need two sentences explaining why a technically perfect glyph was rejected. Focus on "systemic harmony" vs. "isolated correctness."

  6.  **Commitment Audit (Section 5):**

      *   *Survive:* Graded membership (handled via Escalate/Notes), Context-sensitivity (handled via Neighbor/Texture tests), Unity of Identity/Style (handled by running tests in tandem).
      *   *Drop:* The idea that *every* nuance can be tested (we must sample), the idea that context is infinite (we must standardize the test contexts).

  7.  **Running the Cases (Section 6):**

      *   *Case A (The Flattened 'a'):*
