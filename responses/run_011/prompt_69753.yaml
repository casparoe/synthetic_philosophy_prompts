      *   *Check:* Is the time budget realistic? 10 mins is tight but doable for "cheap tests."
      *   *Check:* Case C handling. I need to be careful not to just say "Founder wins." The procedure must highlight the legibility cost. The prompt says "I expect the procedure to cost me this one, and if it does not, I want to know why the procedure is not worth having." This implies the user *wants* the procedure to be rigorous enough to challenge the Founder. I should ensure the procedure flags the risk clearly, even if the final decision is an override. Actually, re-reading: "I expect the procedure to cost me this one [the Q]... and if it does not [if the procedure allows it without friction], I want to know why the procedure is not worth having." The user wants the procedure to be *strict*. So the procedure should likely return a `Fail-on-Letter` for text sizes, forcing an `Escalate` for the exception.

