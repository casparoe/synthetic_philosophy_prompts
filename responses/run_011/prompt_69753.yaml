      *   *Case C (The Founder's 'Q'):*
          *   Text sizes: Confused with 'O'.
          *   Brand: Essential.
          *   *Verdict:* `Fail-on-Letter` for text, `Pass` for Display.
          *   *The Twist:* The user expects the procedure to kill this. If it doesn't, the procedure is broken.
