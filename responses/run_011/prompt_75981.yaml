      *   Total ~1600. Need to trim or expand carefully.

      *Self-Correction on Word Count:* I need to ensure I don't drift into abstract philosophy. Keep it grounded in the grant context. The "Steelman" section needs to be robust.

      *Refining the "Reject" Side:* If I recommend Conditional Renewal, I am effectively rejecting Nadia's "Cut It" recommendation. So the steelman should be the argument for cutting funding entirely.

      *Refining Patch Classification:* Lakatos defines ad hoc1 (no new content), ad hoc2 (new content but untestable), ad hoc3 (new content and testable).
      *   Patch 1: Tuned to failure, predicted success. Technically ad hoc3 (testable & verified), but the tuning makes it suspicious. Let's call it "weakly corroborated novel content."
      *   Patch 2: Domain restriction. Ad hoc1.
      *   Patch 3: Untestable for 10 years. Ad hoc2.

      *Let's write.*

      *(Self-Correction during drafting)*: Make sure the dollar amounts look plausible. 40 labs, rolling awards. Maybe $2M over 5 years normally? So 2 years at 60% = ~$1M? Let's say $1.2M over 2 years.

      *(Check Word Count)*: I will write densely to ensure I hit the minimum without fluff.

      *(Check Tone)*: Ensure it sounds like a senior scientist/administrator, not a grad student.

