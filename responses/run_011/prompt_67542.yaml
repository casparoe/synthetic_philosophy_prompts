  I'm the convenor for our second-year metaethics module and I've still got a pile of script marking to get through before Friday, so I'd like you to help me with one of them. Please act as a professional philosopher who teaches metaethics regularly and has marked hundreds of these scripts - you know the Harman/Mackie/Sturgeon literature inside out and you also know exactly the sorts of things second-years get right while getting the underlying structure wrong. Think carefully and be properly rigorous; don't just give me a general impression of the script.

