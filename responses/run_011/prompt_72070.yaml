          2.  Rank the 3 main tensions.
          3.  Analyze the "Cheapest Revision" (8).
          4.  Analyze the "High-Yield Revision" (1).

      *(Final check on constraints)*: "Rank the real ones by severity... tell me precisely what would have to go... cheapest single revision... one change that would clean up most of the mess."

      Let's write.

      *   *Tension 1 (8 vs 9):* 8 is the absolute. 9 is the exception. 8 must be qualified.
      *   *Tension 2 (1 vs 3+4):* 1 says badness = feel. 3 says feel != disliking. 4 says hurting = disliking. So badness = disliking, not feel (if feel = sensation). 1 needs to specify *which* feel.
