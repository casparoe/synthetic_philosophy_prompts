      *   3. *Sensation vs. Disliking are separable.* (Sensory-Discriminative vs. Affective-Motivative dissociation).
      *   4. *Disliking = Demand to Stop.* (Imperativism/Conativism about the affective component).
      *   5. *Clinical Practice = Reports > Scans.* (First-person authority in treatment decisions).
      *   6. *Congenital Insensitivity = No Badness.* (No sensation = nothing bad inside).
      *   7. *Asymbolia = Missing Something Important.* (Normative claim: Asymbolia is a deficit requiring treatment).
      *   8. *First-Person Authority is Absolute.* (No third-person fact overrides "I feel it").
      *   9. *First-Person Authority is Fallible in Practice.* (Clinician skepticism of reports).

  3.  **Identify Tensions/Contradictions:**

