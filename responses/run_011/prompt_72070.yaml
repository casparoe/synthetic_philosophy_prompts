      *   *Tension B: 1 & 3 vs. 7.* (Badness = Feel/Disliking vs. Asymbolia needs treatment). If badness is *only* the feel/disliking (1, 3), and asymbolics have the feel but no disliking (2, 3), then nothing *bad* is happening to them (per 1). So why treat them (7)? 7 implies there's a normative deficit beyond just "badness for the person."
      *   *Tension C: 1 vs. 4.* (Badness = Feel vs. Disliking = Demand). If badness is *just* how it feels (1), but the "hurting" (bad part) is the demand (4), does the sensation itself carry badness? 1 says "What makes pain bad... is how it feels." 4 says "The hurting just is the wanting-it-to-stop." If the sensation is neutral (as in asymbolia), is it still "pain"? 1 implies pain is bad by definition of feeling. 3 says pain can be affectively neutral. This is a definitional friction.
      *   *Tension D: 6 vs. 7.* (Congenital Insensitivity vs. Asymbolia). 6 says no sensation = nothing bad. 7 says sensation + no caring = missing something important. This isn't a contradiction, but it highlights a normative inconsistency. Why is the lack of sensation (6) just a warning loss, but lack of affect (7) a condition to treat? Both lack the "badness" mechanism.
      *   *Tension E: 5 vs. 9.* (Reports rule vs. Reports suspect). 5 says "run on reports." 9 says "sometimes doubt reports." This is a milder version of 8 vs. 9.

