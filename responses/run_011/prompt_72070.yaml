      *   *Severity 1 (Fatal): 8 vs. 9.* Logical contradiction. You can't hold both as universal truths.
      *   *Severity 2 (Structural): 1/3 vs. 7.* If badness is purely phenomenal (1), and asymbolics have no phenomenal badness (3), then 7 (treat them because something is wrong) lacks a foundation in your own theory of badness. It introduces an external value judgment not accounted for in 1.
      *   *Severity 3 (Conceptual): 1 vs. 4.* 1 says badness is "how it feels." 4 says badness is a "demand." Are demands "feelings"? If the sensation is neutral (3), where is the badness? 1 suggests the sensation *is* the badness carrier. 4 suggests the *reaction* is the badness carrier.
