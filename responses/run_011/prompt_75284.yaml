      *   *Blending:* Allowing blends makes the set convex. If the set is convex, the utopia point is the maximum coordinate. If a player tables a crazy point, they extend the convex hull, moving the utopia point. This is a known vulnerability of KS when the set is endogenous.

  7.  **Address Question 5: Edges:**
      *   *Symmetric Inflation:* If both raise ceilings proportionally, the ratio stays the same, outcome stays same. If asymmetrically, outcome shifts.
      *   *Non-zero $d_i$:* The math holds ($\frac{x-d}{u-d}$). The sensitivity remains.
      *   *One-sided reach:* If only A can reach the utopia point for A, that's the definition of $u_A$. KS still uses it.

  8.  **Synthesize and Structure the Response:**
      *   **Identification:** Confirm the rule is Kalai-Smorodinsky (KS).
      *   **Case 1 (Monotonicity vs. IIA):** Explain that this is the trade-off between Individual Monotonicity (KS) and IIA (Nash). Case 1 is the *feature* of KS, not a bug, but it conflicts with the intuition that "unchosen options shouldn't matter."
