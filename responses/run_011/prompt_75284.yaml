      *   *Correction/Nuance:* The user describes computing $u_i$ based on the "arrangements under consideration." In standard bargaining theory, $u_i$ is the maximum payoff player $i$ can get *within the feasible set* $S$, assuming the other player gets at least their disagreement point. The user's description matches KS.
      *   *Alternative:* The "Egalitarian Solution" (Kalai, 1977) usually refers to equalizing *absolute* gains ($x_1 - d_1 = x_2 - d_2$). The user describes equalizing *relative* gains (fraction of the span). This is definitely Kalai-Smorodinsky.

  3.  **Address Question 1: Names and Axioms (Case 1 & 2):**
      *   *Rule Name:* Kalai-Smorodinsky (KS) Solution.
      *   *Case 1 (A's ceiling rises, B's payoff falls):* This is the defining feature of KS. It is called **Individual Monotonicity**. If the feasible set expands in a way that benefits A (increases A's utopia point) without hurting B's potential, A should not be worse off. In KS, this often means B *is* worse off because the ratio must be maintained.
      *   *Is it a bug or feature?* For KS proponents, it's the signature virtue. It replaces the Nash axiom of **Independence of Irrelevant Alternatives (IIA)**.
      *   *Case 2 (Strategic Table Manipulation):* This is a vulnerability regarding the definition of the "Feasible Set." If the set is defined by "tabled proposals," it's manipulable. In theory, the feasible set is objective (technological/legal constraints). If the user defines it by "tabled proposals," they are vulnerable to **Strategic Agenda Setting** or **Feasible Set Manipulation**.
      *   *Distinction:* Case 1 is about the *axiomatic property* (Monotonicity vs. IIA). Case 2 is about *implementation vulnerability* (defining the utopia point).

  4.  **Address Question 2: Product Rule (Nash) Immunity:**
      *   *Why immune?* The Nash Bargaining Solution (NBS) satisfies **Independence of Irrelevant Alternatives (IIA)**. If the solution is inside a smaller set, removing outer options doesn't change the solution. It depends on the local shape of the Pareto frontier at the solution point, not the extreme points (utopia).
      *   *Family Name:* Rules that use the utopia point ($u_i$) are often called **Monotonic Path Solutions** or specifically **Utopia-Dependent Solutions**. The KS solution is the canonical example. The NBS is a **Utilitarian-like** solution (maximizing product) that relies on local curvature.

  5.  **Address Question 3: Outside Options (Non-cooperative):**
      *   *The Result:* The user is recalling the **Outside Option Principle** (Binmore, Shaked, Sutton, 1989). In alternating-offer games, an outside option only binds if it is better than the equilibrium continuation value. If it's worse, it's "irrelevant."
      *   *Tension:* The KS solution violates this intuition. KS treats the *potential* maximum (the utopia point) as binding, even if that point is not the disagreement point and won't be chosen.
      *   *Clarification:* The "Outside Option Principle" applies to the *disagreement point* ($d_i$). The KS sensitivity is to the *utopia point* ($u_i$). These are different. However, if the "new outlet" in Case 1 is treated as a change in the feasible set rather than $d_i$, KS reacts, NBS does not. The user is correct that KS allows "irrelevant" options (in the IIA sense) to matter.

