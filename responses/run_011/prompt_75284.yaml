answer: |-
  You have reinvented the **Kalai-Smorodinsky (KS) solution** to the bargaining problem.

  It was introduced by Ehud Kalai and Meir Smorodinsky in 1975 ("Other Solutions to Nash's Bargaining Problem"). It is indeed the standard rival to the **Nash Bargaining Solution (NBS)**, which is the rule that maximizes the product of the gains (the "product rule" you mention).

  Your intuition about the trade-off is correct: the KS solution is defined by sacrificing one property to gain another. Below I address your five questions, distinguishing between the axiomatic design of the rule (Case 1) and the implementation vulnerability you have discovered (Case 2).

  ### 1. Names and Properties (Case 1 vs. Case 2)

  **The Rule:** Kalai-Smorodinsky Solution.
  **The Defining Property:** **Individual Monotonicity.**

  Your **First Case** (A's ceiling rises, B's payoff falls) is not a hazard; it is the signature virtue of the KS solution.
  *   **Nash (NBS)** satisfies **Independence of Irrelevant Alternatives (IIA)**. This axiom states that if you remove outcomes from the feasible set that are *not* the solution, the solution should not change. In your First Case, the new arrangements available to A (the ones between 50 and 100) were not chosen in the final settlement, so under IIA, they should not affect the outcome. The Nash rule obeys this; your rule violates it.
  *   **Kalai-Smorodinsky (KS)** violates IIA by design to satisfy **Individual Monotonicity**. This axiom states that if the feasible set expands in a way that gives one player more potential utility without reducing the other's potential, the first player should not end up worse off. In fact, under KS, they usually end up better off, often at the expense of the other player, to maintain the equal ratio of gains.

  So, to answer your specific question: Your complaint in the First Case is a complaint about **Individual Monotonicity**. For a defender of KS, this is not a bug; it is the reason to use KS. They argue IIA is counter-intuitive (why should B benefit from A's *lack* of opportunities?). You are observing the exact tension that defines the literature: **Monotonicity vs. IIA.**

  Your **Second Case** (Strategic tabling of extreme proposals) is a distinct hazard. It has no single famous name like IIA, but in mechanism design, it is referred to as **Strategic Agenda Setting** or **Endogenous Feasible Set Manipulation**.
  *   The KS solution assumes the "feasible set" (the menu of arrangements) is an **objective constraint** (e.g., physical capacity, legal limits).
  *   You are treating the feasible set as **endogenous** (defined by what parties table).
  *   Because KS relies on the "utopia point" (the maximum coordinate of the feasible set), any rule that uses the utopia point is vulnerable if the utopia point can be costlessly inflated.

  **Verdict:** The two cases are theoretically distinct. Case 1 is the rule's *axiomatic feature* (Monotonicity). Case 2 is an *implementation vulnerability* (sensitivity to the definition of the feasible set). You cannot separate Case 1 from the rule without changing the rule, but you can mitigate Case 2 by changing how you define the inputs.

  ### 2. Why the Product Rule is Immune

  The Nash Bargaining Solution (NBS) is immune to these shifts because it is a **local** solution, whereas KS is a **global** solution.

  *   **NBS (Local):** The Nash solution is determined by the slope of the Pareto frontier at the solution point. It maximizes the product of gains. Geometrically, it finds the point where the hyperbola $(x_1-d_1)(x_2-d_2) = k$ is tangent to the Pareto frontier. It does not "look" at the corners (the utopia points) of the feasible set. As long as the new options tabled in your Second Case do not change the shape of the frontier *near the settlement point*, the Nash solution does not move. This is the mathematical expression of **IIA**.
  *   **KS (Global):** The KS solution draws a line from the disagreement point to the "utopia point" (the vector of maximum possible gains for each side). The solution is the intersection of this line and the Pareto frontier. Because it explicitly connects to the utopia point, *any* change to the utopia point rotates the line and moves the solution, even if the new options are far away from the settlement.

  **Family Name:** Rules that depend on the utopia point (like KS) are often called **Utopia-Dependent Solutions** or **Monotonic Path Solutions**. Rules that do not (like Nash) are **IIA-Satisfying Solutions**. The exposure you describe comes with membership in the Utopia-Dependent family.

  ### 3. The Outside Option Result

  You are recalling the **Outside Option Principle** (associated with Binmore, Shaked, and Sutton, 1989).
  *   **The Result:** In non-cooperative bargaining models (like Rubinstein's alternating offers), an outside option affects the agreement *only if* it is better than what the player would get by continuing to bargain. If the outside option is worse than the bargaining equilibrium, it is "irrelevant" and does not bind.
  *   **The Tension:** This principle applies to the **disagreement point** ($d_i$), not the **utopia point** ($u_i$).
      *   Your rule (KS) and Nash both respect the Outside Option Principle regarding $d_i$ (if the walk-away value rises above the settlement, the settlement collapses to the walk-away).
      *   Your complaint is about $u_i$ (the ceiling). The KS solution allows an option that is *worse than the settlement* (the extreme proposal that will never be picked) to move the settlement, provided it raises the *conceivable maximum*.
  *   **Conclusion:** You have not misremembered the result, but you are applying it to the wrong coordinate. The tension you feel is real: KS treats "aspirational" options as binding, whereas non-cooperative theory suggests only "binding" constraints (disagreement points or immediate threats) should matter. This is why proponents of NBS argue it is more robust to "cheap talk" about what *could* happen.

  ### 4. Attainable vs. Tabled (Objective vs. Endogenous)

  There is an established distinction, though often implicit in applied work.
  *   **Objective Feasible Set:** The set of outcomes physically, legally, or economically possible (e.g., total capacity of the pipe).
  *   **Bargaining Agenda:** The subset of the feasible set that parties are currently discussing or have tabled.

  Your **First Case** describes a change in the **Objective Feasible Set** (a new outlet opens). KS is designed to respond to this.
  Your **Second Case** describes a change in the **Bargaining Agenda** (a side tables a unrealistic proposal).

  **The Hazard:** The KS solution is not designed to distinguish between these two. It treats the "best conceivable arrangement" as a mathematical maximum of the set provided to it. If you provide it with the Agenda rather than the Objective Set, it treats strategic posturing as physical reality.

  **Distinction:** In the literature, this is the difference between **structural constraints** and **strategic moves**. There is no specific term for the error of conflating them in KS application, but it is a known failure mode of **axiomatic bargaining in practice**. If the utopia point is not verifiable by a third party (like you), the rule is manipulable.

  ### 5. The Edges

  *   **Symmetric Inflation:** If both sides inflate their ceilings proportionally (e.g., both table crazy proposals that double their respective maximums), the ratio remains constant, and the settlement **does not change**. The KS solution is invariant to symmetric scaling of the utility functions.
  *   **Asymmetric Inflation:** If Side A inflates their ceiling more than Side B, the settlement shifts toward A. The effect is linear in the ratio of the spans.
  *   **Non-Zero/Asymmetric Walk-Aways:** The math $\frac{x_i - d_i}{u_i - d_i}$ holds. The sensitivity remains. In fact, with asymmetric $d_i$, the "span" ($u_i - d_i$) becomes harder to estimate, increasing the room for manipulation in Case 2.
  *   **One-Sided Reach:** It does not matter if only one side can reach their utopia point. KS uses the *coordinate maximums* of the set, regardless of whether a single arrangement achieves both maximums simultaneously (usually they don't; that's why there is a trade-off).

  ### Recommendation: Should you keep using it?

  You should keep using the Kalai-Smorodinsky rule **only if** you can objectively verify the "best conceivable outcome" ($u_i$) independent of what the parties table.

  *   **Use KS when:** The constraints are engineering or legal facts (e.g., "The pipe capacity is 100 units," "The law caps royalties at 20%"). Here, $u_i$ is fixed by reality, not negotiation. The Monotonicity property (Case 1) is desirable here: if A's technology improves, A should capture some of that value.
  *   **Do NOT use KS when:** The "menu" is constructed by the parties' proposals. As you observed in Case 2, this invites **strategic anchoring**. A sophisticated party will table an extreme proposal solely to shift the "utopia point" and drag the KS line toward them.
  *   **Alternative:** If the feasible set is subjective or negotiable, the **Nash Bargaining Solution** (maximizing the product of gains) is more robust. It ignores the extreme corners of the menu and focuses on the trade-off rate near the agreement. It punishes parties less for having "better outside possibilities" that aren't actually exercised, which aligns better with your intuition in Case 1 if you view the "new outlet" as speculative.

  **Summary Definition for your files:**
  You are using the **Kalai-Smorodinsky Solution**.
  *   **Virtue:** **Individual Monotonicity** (Parties benefit from an expansion of their own potential).
  *   **Vice:** Violation of **Independence of Irrelevant Alternatives** (Unchosen options affect the deal).
  *   **Implementation Risk:** **Endogenous Feasible Set Manipulation** (Parties can shift the solution by inflating their utopia point via strategic proposals).

  If you cannot objectively fix the utopia points, the rule is strategically unstable.
