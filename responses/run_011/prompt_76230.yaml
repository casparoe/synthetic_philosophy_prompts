      *   *Idea:* The dating of the Sphinx (water erosion vs wind erosion). Or perhaps something simpler.
      *   *Better Idea:* A claim about a *recent* past where records exist but are contradictory. E.g., "Did this specific local battle happen on Tuesday or Wednesday?"
      *   *Best Idea:* **The Shroud of Turin** or **The Vinland Map**. No, too specific.
      *   *Let's go with:* **A claim about a family genealogy.** "My family story says we are descended from X." Sometimes true, sometimes not. How do we check? It mirrors the big history questions but on a scale they understand.
      *   *Alternative:* **The "Lost Colony" of Roanoke.** Fringe theories abound (integration with tribes vs. Spanish attack). Experts don't know for sure. It shows that "we don't know" is a valid historical conclusion, distinct from "therefore aliens."

  6.  **The Refusal (Scope):**
      *   What can't be done in 100 mins? **Deciding the truth of the specific cases.**
      *   Must state: "We are not deciding if Atlantis existed today. We are deciding how we would know if it did."

  7.  **Drafting the Plan (incorporating the "No Contempt" constraint):**
      *   Tone: Collaborative, investigative, humble.
      *   Structure:
          *   0-10: Framing & Refusal.
          *   10-40: The Carrier Case (Ancient Astronauts) -> Extracting the Principle.
          *   40-60: Misconceptions & Sharpening the Principle.
          *   60-80: The Local Case (The Test).
          *   80-90: The Closing Check (Roanoke/Mystery).
          *   90-100: Wrap up.

  8.  **Refining the "Foundational Idea":**
      *   The facilitator's guess: "A claim about the past commits you to something about what you would expect to find."
      *   *Verdict:* This is correct. But do not state it first.
      *   *Method:* Ask the group: "If the pyramid builders had lasers, what would we find in the quarry?" (Stone dust with melt marks). "Do we find that?" (No). "So what does that tell us?"
      *   *Derive the rule from the answer.*

  9.  **Refining the Misconceptions:**
      *   *Destroyer:* "All history is interpretation." If this stands, the session fails. Must show difference between *interpreting evidence* and *inventing evidence*.
      *   *Sound Principle:* "Absence of evidence..." Concede it, then add the constraint "...unless the evidence should be there."

  10. **Refining the Local Case:**
      *   Hold until the end. Use the tool built earlier. "Okay, apply the 'Expectation Test' to the Stone Chamber."
      *   If the author is there, invite them to state *what they expect to find* to prove their theory. This puts the burden on the method, not the person.

  11. **Final Review against Constraints:**
      *   No contempt? Check. (Emphasize curiosity).
      *   No handouts? Check. (Whiteboard only).
      *   100 minutes? Check.
      *   Address all specific questions? Check.

  12. **Writing the Response:**
      *   Adopt a tone that respects the facilitator's experience (6 years).
      *   Be precise about timing.
      *   Be explicit about the "Sound Principle."
      *   Ensure the "Refusal" is clear.

  *(Self-Correction during drafting)*: I initially thought about suggesting Atlantis as the carrier. But the prompt mentions the "sky-visitor books" as something the facilitator *believed*. Using that personal connection is stronger. It models the "I was like you" empathy. I will recommend the Sky-Visitor case as the carrier, but handled with the "I believed this" framing to disarm defensiveness.
  *Wait, one more check:* The prompt asks "Which single case should carry the weight." I need to be decisive.
  *Decision:* **The Sky-Visitor Argument.** It is the most robust for testing "physical expectations."
  *Wait, the Local Case:* The prompt asks "Should that be the carrier... or held back?" I need to answer this directly. Answer: Held back.
