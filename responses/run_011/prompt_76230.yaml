answer: |-
  Here is a plan for the hundred minutes, designed to respect the intelligence of the room while protecting the community dynamic.

  ### 1. The Foundational Idea: Stated or Drawn Out?
  **Do not state the rule at the start.** If you write *"A claim implies expectations"* on the whiteboard in the first five minutes, it will look like a lecture from a schoolroom they left decades ago. It will trigger resistance in those who feel their curiosity is being policed.

  **Draw it out of the first case.** The idea must be the tool they discover they need, not the rule you impose.
  *   **The Move:** Begin with the **Sky-Visitor (Ancient Astronaut)** argument. You have the advantage here: you can admit, *"I believed this when I was nineteen. It felt exciting. It made the world seem connected."* This disarms the two regulars who believe similar things. You are not the prosecutor; you are a fellow traveler who found a map that didn't work.
  *   **The Extraction:** Ask the room: *"If visitors from the sky helped build these monuments, what physical trace would they have left that a human hand would not?"* (e.g., tool marks, alloys, biological remains, depictions of the craft). Write their answers on the left side of the board under **EXPECTATIONS**. Then ask: *"Do we find these things?"* Write the answers on the right under **FINDINGS**.
  *   **The Principle:** Only *after* this list is populated do you draw the arrow between them and write the rule: **A serious claim tells you what to look for. If the claim is true, the world should look different than if it is false.** If the world looks the same either way, the claim is not doing work.

  ### 2. The Carrier Case and The Local Test
  **The Carrier:** The **Sky-Visitor** argument should carry the methodological weight.
  *   **Why:** It is distant enough that no one in the room feels personally accused. It is familiar enough (the "hundred paperbacks") that you don't waste time explaining the premise. It relies heavily on physical evidence, which makes the "Expectation vs. Finding" test very sharp.
  *   **What it must have:** It must be presented charitably, as a hypothesis that *could* be true if the evidence supported it.
  *   **What it must lack:** It must lack the emotional stakes of local history.

  **The Local Case (The Stone Chamber):** **Hold this back to the end.**
  *   **Why:** You are correct; raising it early turns the morning into a quarrel with a neighbour. If used as the carrier, the two believers will dig in to defend their friend, and the skeptics will attack the friend. The method will be lost in the noise.
  *   **The Test:** Use the Local Case in the final third of the session as the **application test**. Once the group has agreed on the "Expectation/Finding" method using the Sky-Visitor example, turn to the Stone Chamber.
  *   **The Move:** If the author is present, invite him to apply the method himself. *"If your theory is true, what survey result should we have found? If the historical society buried it, where is the copy? If it was pre-Columbian, what artifacts should be in the soil?"* This shifts the dynamic from *"You are wrong"* to *"Help us see what we should be looking for."* It treats the claim seriously by demanding it be specific.

  ### 3. The Misconceptions: Order and Triage
  These will arise naturally as you move from the Sky-Visitor case to the Local one. Meet them in this order:

  1.  **"All history is interpretation anyway."**
      *   **Status:** **Destroyer.** If this stands, the session ends.
      *   **When to meet:** Immediately, during the first case.
      *   **Response:** Concede that *narratives* are interpretations, but *evidence* is not. "We can interpret *why* the stone was cut, but we cannot interpret whether the stone is granite or sandstone. A claim that ignores the stone is not history; it is fiction."
  2.  **"The established view has been wrong before and will be wrong again."**
      *   **Status:** **Dangerous.**
      *   **When to meet:** Before introducing the Local Case.
      *   **Response:** Agree enthusiastically. *"Yes. And when it was wrong, it was corrected by new evidence, not by new stories. Galileo didn't win because he told a better tale; he won because the telescope showed moons around Jupiter."*
  3.  **"Nobody can prove a negative."**
      *   **Status:** **Harmless.**
      *   **When to meet:** Wave it through. It is logically true but practically irrelevant to historical probability.
  4.  **"History is not a science, so none of these tests apply."**
      *   **Status:** **Harmless.**
      *   **When to meet:** Wave it through. Semantics. Call it "investigation" if they dislike "science."
  5.  **"The amateurs are at least asking the questions the professionals will not."**
      *   **Status:** **Harmless/Valid.**
      *   **When to meet:** Affirm this. It validates their curiosity without validating their conclusions. *"Professionals often ignore questions because they seem unlikely. That is a flaw. But the answer still has to match the ground."*
  6.  **"The absence of evidence is not evidence of absence."**
      *   **Status:** **Sound Principle Misapplied.** This is the crucial pivot.
      *   **When to meet:** During the Local Case discussion.
      *   **Response:** **Concede and Sharpen.** Do not knock it down. Say: *"That is true. If I lose a ring in the ocean, the absence of evidence is not evidence it wasn't there. But if I lose a ring in this room, and we look under the chairs and find nothing, the absence of evidence IS evidence of absence."*
      *   **The Sharpened Rule:** Write on the board: **Absence of evidence counts only where evidence is expected.** This validates their principle but restricts its use to cases where preservation is likely (e.g., stone tools in dry soil vs. wooden ships in the ocean).

  ### 4. The Closing Check
  You need a case where the "honest answer" is not that the experts win, but that the question remains open. This proves you are teaching *rigor*, not *orthodoxy*.

  **The Case:** **The Fate of the Princes in the Tower (1483).**
  *   **Why:** Did Richard III kill his nephews? The established view says likely yes. The fringe view says no, they survived.
  *   **The Point:** There is no definitive physical evidence. The "Expectation Test" fails because the evidence (bodies, contemporary confessions) is genuinely lost or destroyed.
  *   **The Lesson:** Show them that a serious historian says *"We do not know"* rather than *"Therefore, they escaped to Portugal."* The goal of the session is to reach a place where *"We do not know"* is an acceptable answer, superior to a confident claim that lacks expectation-based support.

  ### 5. The Refusal (The Opening Statement)
  At the start (Minutes 0–5), you must explicitly limit the scope to prevent the session from becoming a trial of specific truths. Say this, or something close to it:

  > "In the next hundred minutes, I am not asking you to decide whether Atlantis existed, or whether aliens visited, or whether the stone chamber on the ridge is pre-Columbian. I do not know the answers to those things, and neither do we collectively.
  >
  > What I am asking is that we decide **how we would know** if they were true. We are not here to judge the claims. We are here to judge the *tools* we use to measure them. If we leave here today having agreed on how to measure, we have succeeded, even if we still disagree on what the measurement says."

  ### Summary of Timing
  *   **00–05:** The Refusal (Scope setting).
  *   **05–35:** The Carrier (Sky-Visitors). Empathetic framing. Derive the "Expectation" rule from the group.
  *   **35–55:** The Misconceptions. Address "Interpretation" and "Experts Wrong." Sharpen "Absence of Evidence."
  *   **55–80:** The Local Test (Stone Chamber). Apply the rule. If the author is present, ask *them* to define the expectations.
  *   **80–90:** The Closing Check (Princes in the Tower). Demonstrate that "Unknown" is a valid historical conclusion.
  *   **90–100:** Open floor for final thoughts, ensuring the last word is on the *method*, not the *outcome*.

  This plan protects your regulars from embarrassment, protects the local author from a mob, and protects you from the role of the "university-trained expert" you do not claim to be. It makes the room partners in the investigation.
