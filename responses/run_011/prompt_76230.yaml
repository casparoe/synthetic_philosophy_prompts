          *   Local Stone Chamber: High stakes (neighbor might be there), emotional, concrete.
      *   *Decision:* The *Ancient Astronaut* case is the best "carrier" for the *method*. It's familiar enough that everyone knows the gist, distant enough that no one feels personally attacked, and absurd enough to test the criteria without hurting feelings.
      *   *The Local Case:* Use it as the *test* at the end. It's too volatile for the beginning. If used early, it becomes a town feud. If used late, it applies the tool they just built.
