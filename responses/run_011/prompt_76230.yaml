      *   *Wait, looking closer at the prompt's specific constraint:* "Which single case should carry the weight... I have a fourth candidate... Should that be the carrier... or held back?"
      *   *My recommendation:* Hold the Local case for the end (The Test). Use **Ancient Astronauts** or **Atlantis** as the Carrier. Ancient Astronauts is better for demonstrating "expectations of evidence" (e.g., if aliens built it, where are the alloys? the fuel? the depictions?). But Atlantis is better for "textual vs physical."
      *   *Actually, the strongest pedagogical tool here is the Local Case, BUT handled carefully.* No, the prompt says "raising it early will turn the morning into a quarrel." So it *must* be held back.
      *   *So, which carries the weight?* **The Ancient Astronaut claim.** It is the most distinct from reality, making the gap in evidence clearest. *Correction:* The prompt asks me to choose. I will choose **The Ancient Astronaut claim** as the teaching vehicle because it is culturally ubiquitous (paperbacks mentioned) but distant enough to avoid immediate personal conflict. *Wait, better idea:* **Atlantis.** It allows for the "grain of truth" discussion.
      *   *Decision:* I will recommend **Atlantis** as the primary teaching case. It feels more intellectual than Ancient Astronauts, fitting the library setting, but clearly demonstrates the "expectation of evidence" problem. *Actually, let's go with the Ancient Astronauts.* It's explicitly mentioned as "familiar from a hundred paperbacks." It's the common enemy/friend.
      *   *Wait, I need to be careful about the "contempt" constraint.* Ancient Astronauts often invites mockery. Atlantis is safer. Let's go with **Atlantis** as the main case. It allows for "Plato was writing philosophy, not history."
      *   *Re-reading the prompt:* "I intend to put three cases in front of the room."
      *   *Okay, the plan needs to structure these three + the local fourth.*
      *   *Carrier:* **Atlantis.** Why? It bridges myth and history. It allows us to talk about *what Plato was doing* vs *what we are doing*.
      *   *Actually, the "Sound Principle Misapplied" clue:* "Absence of evidence is not evidence of absence." This is the one to concede and sharpen.
