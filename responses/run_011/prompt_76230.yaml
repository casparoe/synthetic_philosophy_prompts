      *   *Okay, final decision on Carrier:* **The Ancient Astronaut claim.** It is the most vivid for "what would we expect to find?" (Alien tech, biological traces, etc.).
      *   *Wait, one more consideration:* The facilitator says "I was taken in by the sky-visitor books myself." This suggests empathy. Using this case allows the facilitator to say, "I liked this too, here is where I got stuck." This builds trust.
