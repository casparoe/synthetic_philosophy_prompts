  4.  **Addressing the Misconceptions:**
      *   *List:*
          1.  All history is interpretation anyway.
          2.  Established view has been wrong before.
          3.  Nobody can prove a negative.
          4.  Absence of evidence is not evidence of absence.
          5.  History is not a science.
