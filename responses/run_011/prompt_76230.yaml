      *   **Topic:** Distinguishing serious claims about the past from unsupported ones (historical epistemology/critical thinking).
      *   **Constraints:** 100 minutes, whiteboard only, no handouts. No contempt for believers (some regulars believe these things, facilitator used to believe them). No reading lists.
      *   **Specific Questions to Answer:**
          1.  What foundational idea must be in place *before* examples work? (Can it be stated or must it be drawn out?)
          2.  Which single case should carry the weight? (Plato/Atlantis, Ancient Astronauts, Fomenko, or Local Stone Chamber?) When to introduce the Local case?
          3.  How to handle specific misconceptions? (Order, which destroy the session, which are harmless, which is a sound principle misapplied.)
          4.  What is the closing check? (New case, not just "experts win".)
          5.  What should be refused at the start? (Scope limitation.)

  2.  **Deconstruct the Core Problem:**
      *   The facilitator suspects the core idea is: *A claim about the past commits you to expectations about evidence (what you would find/not find).*
      *   *Problem:* Stating this abstractly often fails with non-specialists. It sounds like philosophy. It needs to be *felt* through an example.
      *   *Solution:* The idea must be *drawn out* of the first example, not stated as a rule. It needs to be the "aha" moment.

  3.  **Select the "Carrier" Case:**
      *   *Candidates:* Atlantis (Plato), Ancient Astronauts (Von Däniken style), Fomenko (Chronology), Local Stone Chamber (Pre-Columbian).
      *   *Analysis:*
