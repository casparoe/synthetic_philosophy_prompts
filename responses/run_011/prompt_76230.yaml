      *   *Destroyers:* "All history is interpretation" (leads to relativism where nothing matters). "Established view wrong before" (leads to conspiracy thinking).
      *   *Harmless:* "Amateurs ask questions" (Valid, can be affirmed). "History is not a science" (Semantics, can be sidestepped).
      *   *Sound Principle Misapplied:* **"Absence of evidence is not evidence of absence."** This is the key. It *is* true in some contexts (deep ocean, lost libraries), but false in others (if you expect a steel beam and find dirt). It needs sharpening to "Absence of evidence *where evidence is expected* is evidence of absence."
      *   *Order:* They will arrive in this order: "It's just interpretation" -> "Experts were wrong before" -> "Can't prove negative/Absence of evidence."
      *   *Intervention Point:* "Interpretation" must be met early (define the difference between narrative and claim). "Experts wrong" must be met before the Local case. "Absence of evidence" is the climax of the methodological discussion.

  5.  **The Closing Check:**
