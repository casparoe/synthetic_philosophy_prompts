answer: |-
  Dear Friend,

  It is a genuine pleasure to receive your account of the work you are doing with your film society, and I must say that your frustration with the standard literature on the paradox of tragedy is entirely well-founded. You have stumbled upon something that professional aestheticians often miss because they are too busy polishing their theories to check them against the actual phenomenology of the audience. Your hypothesis that the deadlock arises because the parties are answering different questions under a single heading is remarkably astute, and I believe it is largely correct, though I think the situation is slightly more tangled than even you suggest. The impasse is not merely a matter of theorists talking past one another regarding causality versus evaluation, but rather a fundamental confusion about what kind of thing art is supposed to be for us, compounded by a persistent hedonic bias that assumes all consumption must be rooted in pleasure. If we look closely at what the major camps actually claim, we see that they are indeed solving different puzzles, but they are all pretending to solve the same one, which is why your film society members find none of the accounts fully accommodating.

  Consider first the position you associate with Kendall Walton regarding quasi-emotions. Walton is primarily engaged in a metaphysical and philosophy-of-mind project, not an aesthetic evaluation project. His goal is to explain how we can be moved by fictions we know to be false without attributing irrationality to the audience. When he suggests we feel quasi-fear rather than fear, he is solving the problem of belief-dependence in emotion, not explaining why we enjoy the experience. Consequently, his theory is compatible with almost any account of value, including yours, but it fails to address your members' reports because it was never designed to explain why they value the tears, only to explain the status of the tears themselves. This is a clear case of your hypothesis holding true: Walton is answering a question about the individuation of mental states, while your members are asking a question about value. When your group discusses Walton, you are likely debating the nature of emotion while trying to solve a problem about worth, which guarantees a circle.

  Then there is the Humean tradition, which posits that the eloquence of the representation converts pain into pleasure. This is a substantive claim about the phenomenology of the experience, asserting that the negative affect is transformed or overwritten by the aesthetic delight. Your empirical data from the society directly undermines this. Your members report that the films reduce them to tears on the fourth viewing just as on the first, and that the response deepens. This suggests the pain is not converted or eliminated; it is retained. If the sadness remains sadness, and the tears remain tears, then Hume's conversion mechanism is descriptively inaccurate for this specific phenomenon. The theorists who defend Hume are often committed to the idea that negative emotion is inherently aversive and must be neutralized for the experience to be sought. Your members contradict this by seeking the films when already low, suggesting the sadness itself is doing the work, not being cancelled out by it. This indicates that the disagreement is partly about the nature of emotion itself, as you suspected, but specifically about whether negative emotions in aesthetic contexts are instrumental obstacles to pleasure or constitutive parts of a valuable experience.

  The second-order response theory, most notably associated with Susan Feagin, comes closest to your members' testimony about self-regard. Feagin argues that we take pleasure not in the sadness itself, but in the fact that we are the kind of people who feel sadness appropriately in response to the work. This aligns with your members saying it is good to know they can still be moved. However, this view is often treated in the literature as a niche intellectualist solution rather than a central account of value. The reason it fails to satisfy your group completely might be that it still frames the outcome as a species of pleasure, whereas your members seem to describe a species of meaning or confirmation. They are not necessarily saying they feel happy about their sadness; they are saying the sadness validates their capacity for care. This is a distinction between hedonic value and eudaimonic value, a distinction the standard literature on the paradox often glosses over. If the goal of art consumption is meaning rather than pleasure, the paradox dissolves entirely, because there is no contradiction in seeking meaningful experiences that are painful. The deadlock persists because the field assumes the explanandum is enjoyment, when your data suggests the explanandum is significance.

  Regarding the physiological conjectures like those of Huron, you are right to identify these as causal accounts. They explain how the body manages the stress of grief-like responses, perhaps through prolactin release, but they do not explain why the experience is judged as good. A chemical release might make the aftermath tolerable, but it does not explain the intentional selection of devastating films when one is already low. A physiological comfort theory predicts mood repair, yet your members seek mood congruence. This suggests that the physiological account is at best a enabling condition, not a justification. When theorists present this as a solution to the paradox, they are committing a category error between explaining the mechanism of tolerance and explaining the reason for pursuit. This supports your hypothesis that the dispute is partly causal versus evaluative. The physiological camp says here is how you survive the pain, while the aesthetic camp asks why you invited the pain in the first place.

  So where does this leave us regarding your specific diagnosis? You are right that the parties are answering different questions, but I would refine this to say they are operating within different normative frameworks. Some assume art is for pleasure, some assume it is for knowledge, some assume it is for emotional regulation, and some assume it is for ontological clarification. The stability of the debate you have observed for decades is not a symptom of a hard substantive dispute with a shared target, but rather evidence that there is no shared target. The paradox of tragedy is a pseudo-problem generated by the assumption that rational agents do not seek negative affect unless it is compensated by positive affect. Your film society data shows that rational agents do seek negative affect when it serves a function of self-confirmation or emotional clarity. The impasse is therefore an artifact of a flawed framing of the problem rather than a lack of theoretical ingenuity. The theories look stable because they are each internally consistent within their own narrow frame, but they fail to convert anybody because none of them accounts for the full range of human motivation regarding art.

  If we accept this diagnosis, then progress does not look like a new theory of how pain becomes pleasure. Progress would look like a change of vocabulary and a restriction of scope. We need to distinguish clearly between the mechanism of emotion, the motivation for selection, and the justification of value. A case that would discriminate between rivals would be one that isolates the variable of self-regard. If you could design a discussion or a viewing where the self-reflective element is blocked, perhaps by distracting the audience from their own response, and the value of the film drops precipitously, that would support the Feagin-style meta-response account over the Humean conversion account. Conversely, if the value remains high even when the audience is prevented from reflecting on their own virtue, then the value must lie in the content or the feeling itself. However, given your members' testimony, I suspect the self-regard element is crucial, which suggests the literature needs to take the eudaimonic account seriously rather than treating it as a footnote.

  An empirical result that would shift the debate would be longitudinal data on mood congruence in art selection. If it can be robustly demonstrated that people seek sad art when sad not to repair the mood but to deepen the state, this would kill the homeostatic models of mood repair and force a reevaluation of why we value negative affect. It would support the idea that the value lies in the authenticity of the response rather than the hedonic tone. But I suspect the real barrier to progress is not empirical but conceptual. The field needs to abandon the term pleasure in this context. As long as the paradox is defined as why we enjoy pain, theorists will be forced to argue that the pain is not real or not painful. If the question is reframed as why we value sorrowful art, the answers become much clearer. We value it because it connects us to our vulnerabilities, confirms our capacity for empathy, and clarifies what matters to us. This is not pleasure in the sensory sense, but satisfaction in the existential sense.

  Therefore, I do not think you should expect progress from the current literature unless the question itself is changed. The stability you observe is the stability of a paradigm that refuses to acknowledge its own constraints. Your working hypothesis is correct that the parties are answering different questions, but the deeper issue is that they are all trying to answer a question that your film society members have effectively shown to be the wrong one. The paradox exists only if we assume art is a pleasure machine. If we view art as a technology of the self, a tool for emotional calibration and self-knowledge, the paradox vanishes. The progress you are looking for will not come from a new philosophical paper that synthesizes Walton and Hume, but from a willingness to accept that the audience's report of value is accurate even when it contradicts the hedonic calculus. You should encourage your society to stop trying to fit their experience into the existing boxes of quasi-emotion or conversion and instead document the specific ways in which the pain is useful to them. That phenomenological data is worth more than another decade of theoretical maneuvering around a problem that may not exist outside the academy.

  I hope this helps you break the circle in your discussions. You have the advantage of actual data from living audiences, which is something the theorists often lack. Trust that evidence over the inherited problems of the discipline.

  Warmly,

  Your Correspondent
