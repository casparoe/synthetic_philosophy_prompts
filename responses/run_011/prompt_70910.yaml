answer: |-
  There is no single canonical term for this specific configuration, though you have precisely identified a recognized intersection of three distinct literatures: **moral psychology** (sacred values), **sociology** (frame analysis), and **anthropology** (gift vs. commodity exchange).

  You are describing a **Taboo Trade-off** that is successfully executed only under conditions of **Constitutive Silence**, the violation of which triggers **Retrospective Frame Contamination**.

  Here is the breakdown of the existing concepts, why they fall short, and a proposed term with the boundaries you requested.

  ### 1. The Existing Neighbors
  You are right to distinguish this from standard "taboo trade-offs" or "hypocrisy." Here is how the literature maps onto your observation:

  *   **Taboo Trade-offs (Philip Tetlock):** Tetlock established that people react with moral outrage when sacred values (life, justice, faith) are treated as fungible commodities.
      *   *The Mismatch:* Tetlock's work focuses on the *act* of trading being offensive. In your cases, the act is accepted and beneficial. The offense is taken only at the *description*.
  *   **Frame Analysis (Erving Goffman):** Goffman argued that social interactions rely on shared "frames" (definitions of what is going on). If the frame is "Principled Agreement," the interaction holds. If the frame shifts to "Cynical Bargaining," the interaction collapses.
      *   *The Mismatch:* Goffman describes the mechanism (breaking the frame), but not the specific moral punishment or the *retroactive* unraveling you identified.
  *   **Gift vs. Commodity (Marcel Mauss / David Graeber):** In anthropological theory, a "gift" creates a social bond; a "payment" settles a debt and ends it. Explicitly calculating reciprocity turns a gift into a commodity, which can be an insult.
      *   *The Match:* This is the closest emotional fit. By saying "I got my half," the son turned a gift (the mother's concession) into a payment. But this literature usually focuses on kinship, not political coalitions.

  ### 2. The Coined Term: "Constitutive Silence"
  Since no single term captures the *retroactive unraveling triggered by naming*, the most precise label for the phenomenon is **Constitutive Silence**.

  **Definition:** A social contract where the validity of the agreement depends not just on the performance of the terms, but on the *prohibition of metacommunication* regarding the quid-pro-quo nature of the exchange. The silence is not merely polite; it is **constitutive**, meaning the agreement literally does not exist as a valid moral object if the silence is broken.

  **The Mechanism: Retrospective Frame Contamination**
  When the silence is broken, it does not just expose the present; it contaminates the past.
  1.  **Before Naming:** The concession is framed as "Principled Alignment" (I support you because you are right).
  2.  **After Naming:** The concession is reframed as "Market Transaction" (I supported you because I was paid).
  3.  **The Unraveling:** Because "Market Transaction" is a taboo frame for sacred values, the past action is re-categorized as a moral violation. The partner feels not just exposed, but *retroactively bribed*. They reject the "payment" to cleanse their moral standing.

  ### 3. Boundary Cases: Where it Stops
  To give you the edges you asked for, here is how **Constitutive Silence** differs from adjacent phenomena:

  | Phenomenon | Who enforces it? | Stakes of Naming | Retroactive Effect? | Example |
  | :--- | :--- | :--- | :--- | :--- |
  | **Constitutive Silence** (Your phenomenon) | **The Traders** (Beneficiaries) | **Catastrophic** (Deal collapses) | **Yes** (Past acts become tainted) | Funeral compromise; Coalition logrolling. |
  | **Polite Discretion** | Outsiders / Norms | **Awkwardness** (Social friction) | **No** (Past acts remain valid) | Not mentioning a host's bad cooking. |
  | **Strategic Ambiguity** | The Drafters | **Confusion** (Terms become unclear) | **No** (Future acts become harder) | "One China" policy; Vague treaty language. |
  | **Ordinary Hypocrisy** | Outsiders / Critics | **Exposure** (Reputation loss) | **No** (Past acts remain hypocritical) | A politician caught taking bribes. |
  | **Open Secret** | Everyone | **None** (Known but ignored) | **No** (Reality is accepted) | Corporate knowledge of a CEO's affair. |

  **The Edge Case Test:**
  *   **It is NOT Constitutive Silence if:** The parties would still honor the deal even if the trade was named, but they just prefer not to talk about it. (This is *Discretion*).
  *   **It is NOT Constitutive Silence if:** Only outsiders are offended by the naming, while the traders shrug. (This is *Public Relations*).
  *   **It IS Constitutive Silence if:** The traders themselves feel *betrayed* by the naming, and the naming makes them want to *reverse* the concession they already accepted.

  ### 4. Why This Happens (The Theory)
  The reason this feels like a "half-invented" phenomenon is that it relies on a specific cognitive dissonance that societies manage collectively.

  1.  **Sacred Values Resist Commensuration:** As sociologists Espeland and Stevens note, "commensuration" (making things comparable via a metric like political capital) destroys the unique status of sacred values.
  2.  **The "Noble Lie" Requirement:** For the trade to work, both parties must be able to tell themselves and their constituents that they acted on principle.
  3.  **The Metacognitive Ban:** You are allowed to *do* the trade (behavior), but you are forbidden to *think* or *say* the trade (cognition/communication). This is a **Prohibition on Metacommunication**.

  ### Summary
  You have identified a specific subtype of **Taboo Trade-off** governed by **Constitutive Silence**.

  If you need a term for the *unraveling* itself, call it **Retrospective Frame Contamination**.
  If you need a term for the *rule* itself, call it **Constitutive Silence**.

  It is not hypocrisy, because hypocrisy implies one side is deceiving the other. In Constitutive Silence, **both sides are complicit in the deception of the public (and often themselves)** to preserve the moral integrity of the values involved. The moment one party admits the deception, they force the other party to choose between admitting they are a trader (immoral) or rejecting the trade (principled). They almost always choose the latter to save face.
