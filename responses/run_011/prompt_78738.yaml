  I was ready to call that unscientific, until I realized... if he handed me definitive proof tomorrow, I'd just demand higher standards. So I'm not the referee here. I'm just running a competing theory that explains why Dean is wrong, which also cannot be proven wrong.

  So let's not drink to objective truth. Let's drink to two worldviews that no observation could possibly embarrass. To Dean—may your hypotheses always survive contact with reality, and may mine too.
