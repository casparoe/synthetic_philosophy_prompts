answer: |-
  You have identified a genuine friction point between classical semantics and the ontology of institutional practice. To answer your primary question directly: **No, there is no single, canonical label in general philosophy of language that captures this triad of features as a unified phenomenon.**

  However, the phenomenon is not unnamed because it is unknown; it is unnamed because it sits at an intersection where three distinct literatures overlap without fully merging: **truth-conditional pragmatics** (domain restriction), **social ontology** (status functions), and **deontic logic** (conditional obligation).

  If forced to provide a term that respects the carving you are asking for, I would propose **"Constitutive Role Descriptions."**

  Below is the detailed analysis you requested: the nearest concepts, why they fail to fully capture your case, the proposed carving, and the epistemic caveats.

  ### 1. The Nearest Concepts and Their Failures

  You are correct to sense that the classical tools do not fit without distortion. Here is how your three features map against the standard literature, and where the fit breaks.

  **A. Russellian Definite Descriptions & Domain Restriction**
  *   **The Fit:** A Russellian would argue that "The Subcontractor" is shorthand for "The subcontractor *under this agreement*." This invokes **Domain Restriction** (Stanley & Szabo). The quantifier is implicitly restricted to a contextually salient domain, satisfying uniqueness within that domain even if not in the world at large.
  *   **The Failure:** This handles Feature 1 (uniqueness) but fails Feature 2 (no individual in mind). Domain restriction usually presupposes a domain of *existing* entities. In your case, the domain is often empty at $t_0$ (signing). The contract does not merely restrict a domain; it *authorizes the creation* of a domain. Furthermore, as you note, litigation never turns on whether the description succeeded in denoting at $t_0$. A Russellian analysis makes the truth conditions depend on existence at the time of utterance, which contradicts your phenomenological observation that the clause is valid even if the role is empty for years.

  **B. Donnellan's Attributive Use**
  *   **The Fit:** This handles Feature 2 well. The attributive use ("Whoever is the F...") does not require a specific individual in mind. It binds the property to the description.
  *   **The Failure:** Donnellan's distinction is primarily about *speaker reference* in assertoric contexts. Contracts are not primarily assertions; they are **directives** or **declarations** (in the Speech Act sense). More critically, the attributive use typically implies that if nothing fits the description, the statement is false or truth-valueless. Your Feature 3 (the clause is not false, just "not live") suggests a modal structure that Donnellan does not account for.

  **C. Strawsonian Presupposition**
  *   **The Fit:** This addresses the intuition that if the description fails, something goes wrong.
  *   **The Failure:** For Strawson, presupposition failure results in a truth-value gap. You report that the clause does not feel false, nor does it feel like a gap; it feels **dormant**. This suggests the existence of the subcontractor is not a *presupposition* of the sentence's meaningfulness, but a *condition* of the obligation's activation.

  **D. Evans' "Descriptive Names"**
  *   **The Fit:** Gareth Evans discussed terms like "Julius" (stipulated to mean "the inventor of the zip"). These fix reference via description but behave like names.
  *   **The Failure:** "The Subcontractor" is not a name. It is a common noun phrase functioning as a designator. While the *mechanism* of fixing reference is similar (stipulation), the logical behavior differs because "The Subcontractor" can be pluralized or re-instantiated (multiple subcontractors over time), whereas "Julius" is rigid.

  ### 2. The Carving: Constitutive Role Descriptions

  The phenomenon you are describing is best carved as **Constitutive Role Descriptions**. This term acknowledges that the language does not describe a pre-existing state of affairs but constitutes a normative slot within an institutional framework.

  **Feature 1 & 2: The Semantic Mechanism (Intensional Reference)**
  The phrase "The Subcontractor" does not denote an extension (a specific person) at the time of utterance. It denotes an **intension**: a function from possible worlds (or times) to individuals.
  *   **Why this fits:** It explains why uniqueness in the actual world at $t_0$ is irrelevant. The contract fixes the *criteria* for the function, not the *output*.
  *   **The Ontology:** This relies on John Searle's concept of **Status Functions**. The contract creates a status ("Subcontractor") that carries powers and obligations. The language is **constitutive** ("X counts as Y in context C"), not descriptive.
  *   **Differentiation:** Unlike ordinary definite descriptions, which hunt for an existing object, Constitutive Role Descriptions *create the logical space* for the object to be identified later. They are **forward-looking indexicals**.

  **Feature 3: The Truth-Conditional Mechanism (Deontic Conditionality)**
  You asked whether Feature 3 is part of the same phenomenon. I argue it is **distinct but dependent**.
  *   **The Distinction:** Features 1 and 2 are semantic (how reference is fixed). Feature 3 is deontic/modal (how obligations are triggered).
  *   **The Analysis:** When no subcontractor is engaged, the clause is not "false." It is **vacuously satisfied** or **conditionally dormant**. In deontic logic, the obligation is structured as: $\forall x (Subcontractor(x) \rightarrow Obligated(x))$. If $\neg \exists x Subcontractor(x)$, the conditional holds true, but no obligation is instantiated.
  *   **The "Failure" Case:** You noted that if a *Specification* is never attached, parties argue. This is because the Specification is often a **condition precedent** to the formation of the role itself, whereas the Subcontractor is the *filler* of the role. If the role definition is incoherent (no Specification), the intension is undefined. If the role is simply empty (no Subcontractor), the intension is defined but unmapped.
  *   **Conclusion on Feature 3:** It is not a semantic failure (like Russellian falsehood); it is a **pragmatic non-activation**.

  ### 3. Proposed Definition and Boundaries

  **Term:** **Constitutive Role Description (CRD)**

  **Definition:** A definite description used within an institutional speech act (e.g., a contract, statute, or charter) that:
  1.  Fixes its reference via stipulated criteria rather than contextual salience of existing entities.
  2.  Denotes a role or status function rather than a specific individual at the time of utterance.
  3.  Generates deontic consequences (rights/obligations) that are conditional upon the role being instantiated, rather than truth-conditional upon the role's existence at utterance.

  **Boundary Cases:**
  *   **Ordinary Restriction:** "The car in the driveway." (Refers to an existing object; fails if no car is there.) -> *Not a CRD.*
  *   **Referential Use:** "The winner of the race" (pointing at John, who we know will win). (Specific individual in mind.) -> *Not a CRD.*
  *   **Generic Statement:** "The tiger is endangered." (Refers to the kind, not a role to be filled by an agent.) -> *Not a CRD.*
  *   **CRD:** "The Project Manager shall submit reports." (Refers to a slot to be filled; valid even if slot is currently empty.)

  ### 4. Epistemic Request: Where I Might Be Wrong

  You asked for plain speech on where this identification is vulnerable. Here are the three points of highest risk.

  **A. The Category Mistake Risk (Assertoric vs. Directive)**
  *   **The Suspicion:** I am tempted to analyze this using truth conditions because you asked about them. However, contracts are primarily **directives** (commands/promises) or **declarations** (creating status), not assertions.
  *   **The Risk:** If contracts are not assertoric, asking whether the phrase "succeeds in denoting" might be a category mistake. The "truth condition" you perceive might actually be a **condition of satisfaction** (Searle).
  *   **What would change my mind:** If you can provide a case where a court treats a failed description in a contract as a *falsehood* rather than a *breach* or *voidance*. If the legal system treats the contract as a description of the world that can be factually incorrect (rather than a set of instructions that can be unfulfillable), my semantic analysis holds. If the law treats it purely as a matter of enforceability, the "truth condition" is a mirage.

  **B. The Domain Restriction Temptation**
  *   **The Suspicion:** I am resisting the standard pragmaticist move (Stanley & Szabo) that says "The Subcontractor" just means "The Subcontractor *of this project*."
  *   **The Risk:** I may be over-mystifying a simple case of implicit domain restriction. A hard-line contextualist would say the domain *is* restricted to "entities appointed under this contract," and since that set is empty at $t_0$, the uniqueness condition is trivially satisfied (vacuously) until filled.
  *   **What would change my mind:** If you can show a case where the contract refers to "The Subcontractor" *before* the mechanism for appointing one is established, and the reference is still held to be valid. If the role exists *ontologically* before the criteria for filling it are fully settled, then simple domain restriction fails, and my "Constitutive" label is necessary.

  **C. The Bundling of Feature 3**
  *   **The Suspicion:** I have argued that Feature 3 (non-actualization) is deontic, while 1 & 2 are semantic. I might be wrong to separate them.
  *   **The Risk:** It is possible that the "dormancy" you describe is actually a form of **Presupposition Accommodation** that happens *at the time of performance*, not signing.
  *   **What would change my mind:** Consider a case where the contract says "The Subcontractor (who shall be appointed by Jan 1) shall..." and Jan 1 passes with no appointment. If the contract *self-terminates* automatically, Feature 3 is a condition precedent (logical). If the contract *remains valid* but the clause is ignored, Feature 3 is pragmatic. If the contract is deemed *void ab initio* because the description failed, then Feature 3 is semantic (Strawsonian), and my separation of it from 1 & 2 collapses.

  ### Summary
  You are describing **Constitutive Role Descriptions**. They differ from classical definite descriptions because they are **intensional** (picking out a function, not an object) and **institutional** (relying on status functions, not worldly facts). Feature 3 is likely a separate **deontic** phenomenon (conditional obligation) rather than a semantic one, though they are functionally linked.

  The literature that treats this as a single thing is not in *Mind* or *Journal of Philosophy*, but in the intersection of **Legal Theory** (Hart, Searle, Marmor) and **Formal Semantics of Law** (Prakken, Sartor). You have effectively rediscovered the semantic gap that legal philosophers have been trying to formalize for forty years.
