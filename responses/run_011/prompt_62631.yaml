answer: |-
  ### Preamble: Case Coherence Assessment

  **To the Reading Group:**
  Before drafting the joint statement, we vetted the *C.* colonial invertebrate case for internal biological and logical coherence. We concluded the following:

  1.  **Chimeric Fusion:** Biologically plausible (analogous to *Botryllus schlosseri* allorecognition). The "self-recognition allele" mechanism is standard.
  2.  **Cell-Lineage Conflict:** Biologically plausible (analogous to somatic cheating in *Dictyostelium* or cancer). The trade-off between dispersal (larvae) and growth (budding) is a standard life-history conflict.
  3.  **Parasite Complication:** Coherent. Density-dependent selection favoring the "cheater" (bud-biased) in crowded zones adds necessary complexity to prevent a simple "good group/bad cell" narrative.
  4.  **Mobile Policing Element:** This is the most exotic component. For this to be coherent, the plasmid must target a conserved cellular pathway (e.g., cell-cycle regulation) shared across the host species, and its "policing" must be mechanistically distinct from the host's own immune system. We are treating this as a **theoretical given**. If the plasmid cannot physically distinguish bud-biased from disperser-biased cells, the model collapses. Assuming it *can*, the evolutionary dynamics are coherent.

  **Verdict:** The case is internally coherent for the purposes of evolutionary modeling. We proceed.

  ***

  # JOINT STATEMENT ON UNITS OF SELECTION IN SYSTEM *C.*
  **Undersigned:** [Replicator-First Proponent] & [Multilevel Selection Proponent]
  **Date:** End of Semester
  **Subject:** Adversarial Collaboration regarding Case *C.* (Colonial Invertebrate, Cell Lineages, Mobile Element)

  ## 1. AGREED CLAIMS (The Mathematical Core)

  We, the undersigned, agree that the evolutionary dynamics of System *C.* can be fully described by a single set of recurrence equations (specifically, a multi-level Price Equation partition). We stipulate the following:

  1.  **Predictive Equivalence:** Both the "Replicator-First" framework and the "Multilevel Selection" (MLS) framework yield identical numerical predictions for the change in frequency of:
      *   The bud-biased cell allele ($A_{cell}$).
      *   The colony-level fusion allele ($A_{colony}$).
      *   The mobile policing plasmid ($P_{mob}$).
  2.  **Covariance Partitioning:** We agree that the total change in frequency for any trait can be partitioned into a "within-colony" component (cell-lineage competition) and a "between-colony" component (colony differential reproduction).
  3.  **The Limitation of the Math:** We explicitly agree that **the equations do not settle the ontology.**
      *   *Replicator View:* The partitioning is a bookkeeping tool to track the fate of the fundamental replicators (genes/plasmids). The "between-colony" term is a statistical description of how vehicles affect replicator success.
      *   *MLS View:* The partitioning reflects distinct causal processes. The "between-colony" term represents genuine selection acting on the colony as an individual.
  4.  **The Mobile Element:** We agree the plasmid is a distinct evolutionary entity with its own transmission parameters (vertical vs. horizontal). Its dynamics cannot be reduced *solely* to host colony fitness, nor *solely* to cell-lineage fitness, without accounting for its specific transmission mode.

  ## 2. DISAGREEMENTS TABLE

  | Issue | Replicator-First Formulation (RF) | Multilevel Selection Formulation (MLS) | Substantive or Verbal? | The Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Colony** | A "vehicle." A temporary aggregate of cell lineages. Selection acts on cells; colony survival is just a condition for cell replication. | A "unit of selection." When fusion creates a chimera with group-level heredity, the colony becomes an individual subject to selection. | **Verbal** (mostly) | Does the label "unit" require high-fidelity heredity (RF) or just sufficient variance in fitness (MLS)? |
  | **2. The Plasmid** | A selfish replicator. It spreads if its own transmission rate (horizontal + vertical) exceeds its cost. "Policing" is a phenotypic effect it exploits. | A group-stabilizing agent. If vertical transmission dominates, it evolves to suppress cell-cheating for the good of the colony lineage. | **Substantive** | Depends on the ratio of Horizontal vs. Vertical transmission. (See Section 3). |
  | **3. Chimeric Heredity** | Fusion degrades heredity. Chimeras are "noise." If parent-offspring resemblance is low, colony-level selection is mathematically negligible. | Fusion creates a new level of sorting. Even with low fidelity, if variance between colonies is high, selection operates. | **Substantive** | What is the heritability threshold ($h^2$) below which "group selection" becomes a vacuous description? |
  | **4. "For the Good Of"** | Teleology is shorthand. Traits evolve *as if* for the good of the replicator. | Teleology is real at the level of the unit. Traits can evolve *for* the good of the colony. | **Verbal** | Definition of "function." Causal history (RF) vs. Current maintenance (MLS). |

  ## 3. CRUX RESOLUTIONS (Predictions & Tests)

  For the substantive disputes above, we agree that the following experiments/derivations bear on the issue. We sign below our specific predictions.

  ### Crux A: The Mobile Element's Transmission Mode
  **Test:** Manipulate the water column to alter horizontal transmission rates of the plasmid ($H$) while holding vertical transmission ($V$) constant.
  **Question:** At what ratio of $H/V$ does the plasmid's "policing" behavior evolve/maintain?

  *   **RF Prediction:** The plasmid maintains policing if and only if $\text{Total Replicator Fitness} > 1$. If $H$ is high, policing is maintained even if it kills the host colony, provided the plasmid escapes to new hosts. The "interest" is always the plasmid's.
  *   **MLS Prediction:** The plasmid acts as a group-level adaptation only when $V \gg H$. If $H$ is high, the plasmid is a parasite on the colony level. We can distinguish these by measuring colony extinction rates: MLS predicts colony extinction spikes when $H$ increases; RF predicts plasmid frequency stays high regardless of colony extinction.
  *   **Signed Agreement:** We agree to measure **Plasmid Frequency vs. Colony Extinction Rate** under high-$H$ conditions.
      *   *RF Sign:* If Plasmid Frequency remains high while Colony Extinction spikes, RF is vindicated (Selfish Element).
      *   *MLS Sign:* If Plasmid Frequency crashes alongside Colony Extinction, MLS is vindicated (Group Adaptation dependent on group survival).

  ### Crux B: Heritability in Chimeras
  **Test:** Force random fusion (breaking kin-structure) in a subset of the reef. Measure parent-offspring regression ($h^2$) of the "bud-bias proportion" trait.
  **Question:** Does colony-level selection vanish when $h^2 \to 0$?

  *   **RF Prediction:** Yes. If $h^2 \approx 0$, the "between-colony" covariance term in the Price Equation becomes noise. The system reverts entirely to cell-lineage selection.
  *   **MLS Prediction:** Not necessarily. If the "sorting" of cells into colonies creates variance in colony fitness, selection acts on the *composition* even if the composition is not perfectly heritable in the genetic sense. However, we agree that if $h^2 = 0$ exactly, the response to selection ($R$) must be 0.
  *   **Signed Agreement:** We agree to measure **Response to Selection ($R$)** on colony growth rate in the Random Fusion group.
      *   *Joint Prediction:* $R$ will approach zero as $h^2$ approaches zero.
      *   *Divergence:* RF claims this proves colonies were never "units." MLS claims this proves heredity is a *requirement* for units, but that natural chimeras (kin-fused) meet that requirement while random ones do not.

  ## 4. EXPLICIT ANSWERS TO SPECIFIC QUESTIONS

  **Q1: Does the mobile element's spread count as group selection, colony-level selection, or a selfish element?**
  *   **Joint Answer:** It depends on the transmission parameters (see Crux A).
  *   **Agreement:** We agree that if Vertical Transmission $> 90\%$, the plasmid's interests align with the colony, and MLS may label this "colony-level selection" while RF labels it "replicator success via vehicle survival."
  *   **Disagreement:** If Horizontal Transmission is high, RF insists it is *only* a selfish element. MLS insists it can still be a "group-level parasite" selecting *against* the colony unit. We cannot agree on a single label, but we agree on the **conditions** that determine the dynamic.

  **Q2: Do fused chimeras constitute a level at which there is heredity at all?**
  *   **Joint Answer:** Yes, but it is "compositional heredity," not strictly genetic heredity.
  *   **Agreement:** Because fusion partners are frequently close kin (due to limited larval dispersal), the *proportion* of bud-biased cells in the parent colony correlates with the proportion in the fragments/offspring.
  *   **Disagreement:** RF argues this fidelity is too low to call it a "level" distinct from the cell lineage. MLS argues that any fidelity $>0$ combined with high variance in colony fitness constitutes a level.
  *   **Resolution:** We agree to treat it as a **Partial Level**. It exerts selection pressure, but the strength of that pressure is modulated by the kin-recognition allele frequency.

  ## 5. THE UNANSWERABLE QUESTION

  **Question:** What is the exact threshold of heritability ($h^2$) required to ontologically promote a "vehicle" to a "unit of selection"?

  **Why we cannot answer:**
  *   **RF Side:** Believes the threshold is effectively 1.0 (only replicators are units). Anything less is a vehicle.
  *   **MLS Side:** Believes the threshold is context-dependent (any $h^2$ that generates a non-zero covariance term).
  *   **Data Needed:** We would need a meta-analysis of every biological system claimed to be a "group" to see if there is a natural break-point in heritability where evolutionary theory "breaks" if we stop calling it a group. We suspect no such break-point exists; it is a continuum. Therefore, this question is likely a **category error**.

  ## 6. DEFINITION OF "UNIT" (The Verbal Dispute)

  We acknowledge that approximately 60% of our semester-long debate was verbal, centering on the definition of the word "Unit." We codify our definitions here to prevent future confusion.

  | Feature | Replicator-First Definition (Dawkins/Hull) | Multilevel Selection Definition (Sober/Wilson) |
  | :--- | :--- | :--- |
  | **Primary Unit** | **The Replicator.** An entity that passes its structure on intact through successive replications (high fidelity). | **The Interactor.** An entity that interacts as a cohesive whole with its environment in such a way that this interaction causes replication to be differential. |
  | **Colony Status** | **Vehicle.** A machine built by genes to propagate themselves. | **Unit.** A genuine biological individual if it exhibits birth, death, and reproduction. |
  | **Selection** | A process that happens *to* replicators. | A process that happens *to* interactors at any level of hierarchy. |
  | **Criterion** | Fidelity of copying. | Causal contribution to fitness variance. |

  **Joint Conclusion:**
  When we say "Unit of Selection," the Replicator-First proponent means "Entity that is copied." The MLS proponent means "Entity that is selected." These are not the same thing. In System *C.*, the **Cell Lineage** is the primary Replicator. The **Colonies** are the primary Interactors. Both statements can be true simultaneously without contradiction.

  **Signed,**

  _________________________ (Replicator-First Proponent)
  *"The math is the same; the ontology matters."*

  _________________________ (Multilevel Selection Proponent)
  *"The ontology is the same; the math reveals the levels."*
