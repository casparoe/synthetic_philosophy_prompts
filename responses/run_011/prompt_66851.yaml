      *   **Argument (3) - Dana:** Burden of proof. Ecosystem has millions of years of testing (stability). Drive has little testing. Novelty requires proof of safety.
          *   *Analysis:* "Millions of years of testing" is a naturalistic fallacy/nostalgia trap. Ecosystems change, and invasive species prove the ecosystem isn't "safe" or stable against novelty. However, the burden of proof point is standard regulatory practice (novel tech bears the burden).
          *   *Rating:* Partly Right. (Burden of proof is standard, but the "millions of years" justification is scientifically shaky).

      *   **Argument (4) - Ray:** "Millions of years" is a tell (invasive mosquito proves ecosystem isn't safe). Dana slid between precaution as *action rule* vs. *procedural rule* (burden of proof). These come apart.
