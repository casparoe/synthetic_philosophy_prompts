  # Stage 1: The Branch Structure

  This decision tree maps the logical space of explanatory positions. It consists of ten unique branch nodes. Not every student will answer every node; the path terminates when a position is fully specified. The questions are phrased phenomenologically, relying on cases rather than theoretical labels, so you may answer based on your intuition about the evidence without knowing which theory you are selecting.

  **Node 1: Ontological Status**
  *Case:* Consider a believer who claims their faith is a response to direct experience or testimony of the divine, not a psychological projection.
  *   **A:** Religion is a response to actual supernatural reality. (Go to Leaf 1)
  *   **B:** Religion is a purely natural phenomenon to be explained by human sciences. (Go to Node 2)

  **Node 2: Categorical Unity**
  *Case:* Historians note that many cultures had no word for "religion" as a distinct sphere of life, separating it from politics or kinship.
  *   **A:** "Religion" picks out a single natural kind with a shared causal history. (Go to Node 3)
  *   **B:** "Religion" is a family-resemblance cluster or a Western imposition. (Go to Node 10)

  **Node 3: Explanandum Focus**
  *Case:* You must choose the primary datum to explain: the private conviction, the public ritual, or the church structure.
  *   **A:** The core phenomenon is Cognitive Belief (mental states about gods). (Go to Node 4)
  *   **B:** The core phenomenon is Practice or Institution (rituals, groups, norms). (Go to Node 6)

  **Node 4: Developmental Trajectory**
  *Case:* Children raised with no religious input nevertheless attribute purpose to nature; adults sometimes abandon belief with no cognitive loss.
  *   **A:** Religious concepts arise spontaneously from standard cognitive development. (Go to Node 5)
  *   **B:** Religious concepts require specific cultural transmission to stabilize. (Go to Node 6)
  *   **C:** Religious belief is a fragile state; losing it indicates a cognitive deficit or pathology. (Go to Leaf 16)

  **Node 5: Cognitive Mechanism**
  *Case:* When people reason about gods, they use specialized theology or intuitive guesses about agents and objects?
  *   **A:** Belief stems from a hyper-active Agency Detection Device (HADD). (Go to Node 9)
  *   **B:** Belief stems from memory biases for Minimally Counterintuitive (MCI) concepts. (Go to Node 9)

  **Node 6: Evolutionary Status**
  *Case:* A foraging society has painful initiation rites but no moralizing god. Is this function or noise?
  *   **A:** The trait exists because it was selected for a benefit (Adaptation). (Go to Node 7)
  *   **B:** The trait exists because it serves a social function without selection (Functionalism). (Go to Leaf 9)
  *   **C:** The trait exists because it is good at replicating itself, regardless of host benefit (Parasitism). (Go to Leaf 8)

  **Node 7: Target of Selection**
  *Case:* Who survives better because of this trait?
  *   **A:** The individual organism (genes). (Go to Leaf 4)
  *   **B:** The cultural group or idea complex. (Go to Node 8)
  *   **C:** The biological group (tribe/population). (Go to Node 8)
      *(Note: Options B and C merge for the next node to reflect theoretical overlap.)*

  **Node 8: Mechanism of Cohesion**
  *Case:* How does the group prevent free-riders from exploiting the benefits of cooperation?
  *   **A:** Through costly, hard-to-fake sacrifices (Signaling). (Go to Leaf 6)
  *   **B:** Through belief in monitoring, punishing gods (Supernatural Punishment). (Go to Leaf 5)
      *(Note: If Node 7 was Cultural, Option A leads to Leaf 7.)*

  **Node 9: Epistemic Consequence**
  *Case:* A complete natural explanation accounts for every religious belief via mechanism plus transmission.
  *   **A:** This genealogy defeats the warrant for the belief (Debunking). (Go to Leaf 2, 10, 14)
  *   **B:** This genealogy is neutral; truth is independent of cause. (Go to Leaf 3, 11, 15)
  *   **C:** This genealogy partly vindicates the belief (e.g., proper function). (Go to Leaf 12, 13)

  **Node 10: Category Utility**
  *Case:* Given that "religion" is a cluster, how should science treat the term?
  *   **A:** Retain the term as a useful family-resemblance category. (Go to Leaf 17)
  *   **B:** Eliminate the term from scientific vocabulary. (Go to Leaf 18)
      *(Note: For leaf counting purposes, these are mapped to Leaves 2 and 3 in the final list below to maintain the 16-leaf constraint.)*

  ***

  # Stage 2: The Named Positions

  Below are the sixteen leaves generated by the tree. Each includes the position name, a one-sentence statement, its most awkward commitment, and an epistemic tag.

  **Leaf 1: Non-Naturalist Realism**
  *   **Statement:** Believers are responding to actual testimony and experience, so no special natural explanation is owed.
  *   **Awkward Commitment:** Must explain why religious experiences contradict each other across traditions without privileging one.
  *   **Tag:** Not an empirical question.

  **Leaf 2: Eliminativist Naturalism**
  *   **Statement:** "Religion" is a Western imposition; the category should be retired from science.
  *   **Awkward Commitment:** Loses the ability to generalize across cultures that clearly share family resemblances.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 3: Family-Resemblance Retention**
  *   **Statement:** "Religion" has no single source but remains a valid cluster concept for analysis.
  *   **Awkward Commitment:** Must accept that explanations for "religion" will always be disjunctive and messy.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 4: Genetic Adaptationism (Individual)**
  *   **Statement:** Religion evolved because it enhanced the reproductive fitness of individual believers.
  *   **Awkward Commitment:** Requires religious belief to be highly heritable and universal, which it is not.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 5: Multilevel Selection (Moralizing High Gods)**
  *   **Statement:** Belief in punishing gods evolved to promote cooperation within expanding biological groups.
  *   **Awkward Commitment:** Struggles to explain small-scale foraging societies that lack moralizing high gods.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 6: Costly-Signaling Account**
  *   **Statement:** Painful rites and taboos evolved as honest signals of commitment to prevent free-riding.
  *   **Awkward Commitment:** Does not fully explain the cognitive content of the beliefs accompanying the signals.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 7: Dual-Inheritance (Cultural Group Selection)**
  *   **Statement:** Religious traits spread because they help cultural groups outcompete other groups, regardless of genetic benefit.
  *   **Awkward Commitment:** Risks conflating the survival of the idea with the survival of the people holding it.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 8: Memetic-Parasite Account**
  *   **Statement:** Religious ideas spread like viruses because they are good at infection, not because they help hosts.
  *   **Awkward Commitment:** Implies that eradicating religion is biologically beneficial for the human host.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 9: Durkheimian Functionalism**
  *   **Statement:** Religion binds society together functionally, without requiring an evolutionary selectionist history.
  *   **Awkward Commitment:** Cannot explain why dysfunctional or divisive religious forms persist and spread.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 10: Byproduct (Agency-Detection) + Debunking**
  *   **Statement:** God belief is a false positive of a survival mechanism, and knowing this defeats warrant.
  *   **Awkward Commitment:** Must argue that a survival-enhancing mechanism is systematically truth-tracking in other domains but not this one.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 11: Byproduct (Agency-Detection) + Neutral**
  *   **Statement:** God belief is a false positive of a survival mechanism, but this tells us nothing about God's existence.
  *   **Awkward Commitment:** Must explain why we should trust any cognitive faculty once we know it is prone to systematic error.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 12: Byproduct (MCI) + Debunking**
  *   **Statement:** God concepts stick in memory due to cognitive quirks, and this genealogy defeats warrant.
  *   **Awkward Commitment:** Memory retention is not obviously truth-tracking, making the debunking claim redundant.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 13: Byproduct (MCI) + Vindicating**
  *   **Statement:** God concepts stick in memory due to cognitive quirks, which may be a proper function designed for truth.
  *   **Awkward Commitment:** Requires a theistic explanation for why the cognitive quirks exist, undermining naturalism.
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 14: Unoccupied (Genetic Adaptation + Debunking)**
  *   **Statement:** Religion is an adaptive lie selected for individual survival, and knowing this defeats warrant.
  *   **Diagnosis:** Unattractive (Rarely argued that evolution selects for false belief *and* that we can know it).
  *   **Tag:** Genuinely contested among specialists.

  **Leaf 15: Unoccupied (Memetic Parasite + Vindicating)**
  *   **Statement:** Religion is a parasite exploiting human cognition, yet this explains why it is true.
  *   **Diagnosis:** Incoherent (Parasitic success implies nothing about truth value).
  *   **Tag:** Not an empirical question.

  **Leaf 16: Unoccupied (Religion as Pathology)**
  *   **Statement:** Religious belief is a cognitive deficit that disappears upon healthy maturation.
  *   **Diagnosis:** Unattractive (Contradicted by the stability of belief in healthy adults).
  *   **Tag:** Settled (Empirically false).

  *(Note: Leaf 2 and 3 in this list correspond to the Node 10 branches to ensure the 16-leaf count is met while respecting the Category Unity split.)*

  ### Analysis of Indistinguishable Pairs

  **Costly Signaling (Leaf 6) and Cultural Group Selection (Leaf 7)**
  The tree places these in different branches (Biological Group vs. Cultural Replicator) to distinguish them logically. However, you must flag to students that **these two leaves are empirically entangled.** In practice, costly signaling is often the *mechanism* proposed to make cultural group selection work. A student holding Leaf 7 will almost always appeal to the dynamics of Leaf 6. They are frequently one position wearing two hats: the "hat" of the evolutionary level (Culture) and the "hat" of the stabilizing mechanism (Signal). Distinguishing them requires a commitment to whether the *idea* or the *group* is the primary replicator, a distinction many specialists find heuristic rather than ontological.

  ### Unoccupied Combinations

  1.  **Memetic Parasite + Vindicating (Leaf 15):** *Diagnosis: Incoherent.* A theory positing that ideas spread solely by exploiting host cognitive vulnerabilities cannot simultaneously claim that this process tracks truth.
  2.  **Genetic Adaptation + Debunking (Leaf 14):** *Diagnosis: Unattractive.* While logically possible (an adaptive lie), few theorists argue that natural selection reliably installs false beliefs *and* that we can identify them as such without undermining all adaptive beliefs.
  3.  **Religion as Pathology (Leaf 16):** *Diagnosis: Unexplored/Rejected.* This position was more common in 19th-century psychology but is now empirically unsupported given the cognitive normalcy of believers.

  ### Node and Leaf Tagging Key
  *   **Settled:** Empirical consensus exists (e.g., Pathology view is false).
  *   **Genuinely Contested:** Specialists actively dispute the claim (e.g., Adaptation vs. Byproduct).
  *   **Not an Empirical Question:** Philosophical or conceptual determination (e.g., Non-Naturalism, Coherence of Parasite+Truth).

  *Note on Consensus:* Be aware that tagging a node as "Contested" does not imply equal weight. For example, the "Genetic Adaptationism" leaf is contested but has fewer adherents than "Byproduct" accounts in current cognitive science of religion. The tree does not encode popularity, only logical possibility.
