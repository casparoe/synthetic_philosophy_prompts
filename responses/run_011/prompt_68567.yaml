answer: |-
  The air on Kestrel Station tasted of recycled copper and stale coffee. It was a taste Elias had grown to hate over the last seven years, but today it tasted like a decision. The fuel gauge on the main console blinked amber. Enough for the return burn, enough to go home to a Earth that might not remember them. Or enough for the array, nine years of integration time to catch the background neutrino drift that would kill either Theory A or Theory B.

  Elias was packing his personal locker. Mara was calibrating the sensor gain.

  "You're wasting time," Elias said, folding a flight suit that wouldn't fit him in nine years. "We know the answer."

  "We know nothing," Mara said, not looking up from the haptic interface. "We have a null result on every local observation. Both theories fit the sky perfectly."

  "Not perfectly," Elias said. "They fit the sky. They don't fit *us*." He tapped his chest. "Theory B says there are ten to the twenty-four observers in the history of everything. Theory A says ten to the twelve. I am here. I exist. If B were true, the chance of me existing is trillions of times higher than if A were true. Bayes doesn't lie, Mara. The odds are settled."

  Mara spun her chair around. Her face was lined with the fatigue of someone who had fought this war for a decade. "That is the Presumptuous Philosopher's trick. You're saying that because B makes observers more common, you must be in B. But if B is true, most observers are born much later than us. Finding ourselves this early in the sequence is astronomically unlikely under B. It's the Doomsday argument, Elias. We are a random draw. If you pull ticket number five from a hat, you don't bet the hat holds a million tickets. You bet it holds ten."

  "That logic works for tanks," Elias said, zipping the bag. "Grab a German tank by the serial number, sure. But we aren't tanks."

  "It works for people too," Mara said. "Think about the lifeboat drill last year. You argued we should prioritize the junior crew for the survival suits. Why? Because statistically, most people in a crash die. You used the random-draw logic to decide who was worth saving. You treated them as a sample from a population of victims."

  Elias stopped. He remembered Chen, the engineer who hadn't gotten a suit. "That was triage. Resource allocation."

  "It was math," Mara said. "You used the logic when it licensed something monstrous, and you discard it when it tells you to stay put. You want to have it both ways."

  "It's not about having it both ways. It's about the reference class," said Vance from the doorway. He was the oldest, the one who remembered the launch. He held a mug of tea that had gone cold hours ago. "You're both bleeding out on the class definition. Are we sampling from all humans? All conscious minds? All observers capable of understanding this argument? If you define the class as 'people on Kestrel,' the probability is one. If you define it as 'all biological life,' the numbers shift. You pick the class that gives you the answer you want."

  Mara waved a hand. "We use the standard class. Observers with our information content."

  "And if I include the simulations?" Vance asked softly. "If Theory B includes a trillion simulated universes, am I a simulation? If I am, does my observation count? You're building castles on mud."

  Elias stepped forward, his voice tightening. "Mara, you're missing the core objection. If Elias is right, Theory B is immune to anything this station could observe. No measurement we make could dent those trillion-to-one odds. A claim that cannot be wrong about the world has stopped being a claim. It's faith."

  Elias looked at her, his eyes hard. "Existence *is* the observation. You treat 'I am here' as background noise. I treat it as the signal. You can't ignore the data of your own birth just because it makes the math uncomfortable. It's not immunity. It's weighting. The likelihood of me existing swamp the likelihood of this specific neutrino drift."

  "It swamps everything," Mara said. "That's the problem. You've made science impossible."

  Vance took a sip of the cold tea. "It's the coin puzzle," he said. The room went quiet. "The drug that erases memory. The subject who wakes up and doesn't know if it's the first time or the second. You solve the little puzzle one way, you're committed to the big one. You know which side you're on."

  Mara looked at Elias. Elias looked at the fuel gauge. They had argued this in the mess hall, in the sleep pods, in the shadow of the array. They were tired. The philosophy was dry dust, but the fuel was real.

  "We run the experiment," Mara said. "If A is true, we need to know we're near the end. If B is true, the data is still worth the cost of knowledge."

  "It's not worth the cost of home," Elias said.

  "Vote," Vance said.

  It was six to six. The Captain, who had remained silent in her quarters, broke the tie via comms. *Run the measurement.*

  Elias didn't fight it. He sat in the command chair and watched the fuel valves shift. The amber light turned red. The return burn was locked out. The array hummed to life, a deep vibration that shook the floor plates. They had chosen truth over survival.

  For three years, nothing happened. The station drifted. The crew aged. The neutrino counters ticked.

  In the fourth year, a coronal mass ejection from the local star struck the station. It was a one-in-a-million event, unpredicted by any model. The surge fried the primary cooling loop for the sensor array. The measurement continued, but the heat built up. To save the crew, Mara had to vent the coolant.

  The data was corrupted. The noise floor rose above the signal. The nine-year measurement yielded nothing but static.

  They sat in the mess hall, the red fuel light still mocking them. They had no fuel to return. They had no data to transmit. They had only the station, the stars, and the air recyclers whining in the dark.

  Elias looked at Mara. "Your random draw," he said quietly. "Did it predict the flare?"

  Mara stared into her cold coffee. "No."

  "Did mine?"

  "No."

  Vance stirred his tea. "The universe doesn't care about the reference class."

  They would die on Kestrel. The theories remained untested. The argument remained unresolved. The fuel was gone.

  Verdict: Neither. The universe ignored their math.
