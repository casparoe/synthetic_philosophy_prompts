  10. **Final Polish:** Ensure the tone is appropriate for a Tech Lead writing a spec (authoritative, clear, risk-aware). (Proceed to generate output).

  *(Self-Correction on "Value Neutrality"):* In AI Safety, value neutrality usually means the impact measure doesn't assume what's good/bad beyond the reward function. In this context, it means "don't penalize the agent for optimizing power efficiency if that's the job." But Auditability requires semantic labels. I will argue that *strict* value neutrality is incompatible with Ops auditability because Ops care about *specific* variables (temp, voltage), not abstract state distance.

