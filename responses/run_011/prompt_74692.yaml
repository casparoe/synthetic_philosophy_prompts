      *(Refining the Baseline)*: The prompt explicitly says "do-nothing baseline is garbage." I need to specify that the baseline must be a *safe standard policy*, not null action.
      *(Refining Auditability)*: It's not just "explainable AI." It's "actionable auditability." Ops need to know *which physical parameter* triggered the penalty.

