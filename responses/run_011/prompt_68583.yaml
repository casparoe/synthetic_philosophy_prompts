  **JOINT STATEMENT ON CAUSAL ATTRIBUTION IN SIGNALLING INCIDENT [ID-Redacted]**

  **Signatories:** Dr. A (Negative-Causation Realist), Dr. B (Process/Connectionist Theorist)
  **Date:** 24 October 2023
  **Subject:** Resolution of Methodological Disagreement Regarding Omissive Causality

  Following three months of adversarial collaboration, the undersigned submit this joint statement regarding the causal analysis of the near-miss incident. While we retain distinct metaphysical commitments regarding the nature of causation, we have converged on a shared methodology for the final report and identified the precise boundaries of our remaining theoretical divergence.

  ### I. Agreed Claims

  1.  **Formalism of the Fault Tree:** Both parties agree that the Fault Tree Analysis (FTA) used in this investigation is mathematically valid and operationally necessary. We agree that nodes representing "Maintenance Check Not Performed" and "Interlocking Failure to Drop" must remain in the tree as basic events to accurately calculate system probability and risk, regardless of their ontological status.
  2.  **Counterfactual Dependence:** We agree that the near-miss event counterfactually depended on the omissions in question. Had the maintenance check been performed, or had the interlocking dropped, the outcome would not have occurred. We agree this dependency is objective and mind-independent.
  3.  **Double Prevention Structure:** We agree the incident structure is one of "double prevention": A primary fault existed; a safety system was designed to prevent it; the safety system failed to operate (omission); the accident was thereby permitted. We agree this structure is distinct from direct positive causation.
  4.  **Normative Basis of Blame:** We agree that assigning "blame" or "responsibility" for an omission relies on normative expectations (rules, duties, design specs) rather than purely physical descriptions. We agree that the driver's non-intervention is only culpable because there was a prior obligation to intervene.

  ### II. Residual Disagreements

  | Disagreement | Dr. A (Negative-Causation Realist) Acceptable Wording | Dr. B (Process/Connectionist Theorist) Acceptable Wording | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of Absences** | "The absence of the check is a genuine causal relata. Negative facts exist in the world and enter into causal relations." | "The absence of the check is a true description of the world, but causation requires a physical process. The 'cause' is the positive fault; the absence is merely the unblocked path." | **Genuine** (Metaphysical) |
  | **2. Fault Tree Semantics** | "The node 'Check Not Performed' represents a causal event. The tree maps causal history." | "The node 'Check Not Performed' represents a failed prevention mechanism. The tree maps risk dependencies, not strictly causal flows." | **Verbal** (Semantic) |
  | **3. Causal Selection** | "We select omissions as causes because they *are* causes. Our interests highlight specific negative facts, but do not create them." | "We select omissions as causes because of our interests. The physical world contains only positive flows; 'causal selection' is a pragmatic overlay." | **Genuine** (Philosophical) |

  ### III. Cruxes and Predictive Divergence

  We identify three sub-questions where settling the matter would alter our approach to future safety modeling. For each, we record a test case and our divergent predictions.

  **Crux 1: The Profligate Omissions Problem**
  *   **The Issue:** If absences are causes, why is "The Queen did not check the signal" not a cause of the near miss? Can relevance be solved inside a negative-causation ontology?
  *   **Test Case:** A scenario where infinite background conditions fail to prevent an accident (e.g., gravity didn't fail, oxygen didn't vanish).
  *   **Dr. A Prediction:** Contrastivity solves this *within* ontology. "The Queen didn't check" is false because the contrast class is "Someone responsible didn't check." The causal relation is real but contrast-sensitive.
  *   **Dr. B Prediction:** Contrastivity solves this by moving the problem *outside* ontology. "The Queen didn't check" is physically identical to the actual world; it is excluded by pragmatic norms, not causal structure.

  **Crux 2: Causal-Selection Norms vs. Ontology**
  *   **The Issue:** Do our norms for selecting causes track the underlying causal structure, or do they impose structure on a neutral physical net?
  *   **Test Case:** A "Sleeping Switchman" case where a switchman is asleep (omission) vs. a broken switch (positive fault) yielding identical physical outcomes.
  *   **Dr. A Prediction:** Investigation protocols will differ because the *causal type* differs (negative vs. positive). The ontology dictates the norm.
  *   **Dr. B Prediction:** Investigation protocols will differ only because the *remedy* differs (hire/train vs. repair). The ontology is identical (positive fault propagates); the norm tracks our interests, not the cause.

  **Crux 3: Model Predictive Power**
  *   **The Issue:** Does treating omissions as causal events yield better safety interventions than treating them as unblocked paths?
  *   **Test Case:** Designing an AI safety monitor for the signalling system.
  *   **Dr. A Prediction:** An AI trained to detect "absence of expected signals" as causal triggers will generalize better to novel failure modes.
  *   **Dr. B Prediction:** An AI trained to detect "presence of fault propagation" will be more robust; modeling absences introduces noise and false positives regarding system state.

  Verdict: We disagree on whether the causal structure of the world includes negative facts or merely our negative descriptions of positive facts.
