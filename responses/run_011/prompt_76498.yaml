      *Drafting thought on Case 1:* The user says "I expect your procedure is going to make me rewrite it or drop it; if so, say so plainly." I must be direct here. The claim "If the second operator had been on shift, the bypass would have been caught" is speculative. The repair is to focus on the checklist deficiency (GENERAL) rather than the human action (WOULD).

      *Drafting thought on Case 3:* "If the trip had been armed, the pump would have stopped." This is deterministic. It should pass as WOULD because the mechanism is known and fixed.

      *Drafting thought on Limitations:* The "closeness" of the world is the big philosophical leak. I need to admit that deciding what stays fixed when you change the past is a judgment call.

      *Final Polish:* Check against "no headings, no bullet points, no bold, no tables." Ensure "step one" etc. are inline.

      *Wait, one more check:* The user said "Name a distinction if naming it makes the step clearer, but the procedure has to stand on the distinction, not on the source." I can use "general rule" vs "specific event."

