      *Refining the "Steps":* Since I can't use a list, I will describe the procedure as a narrative flow. "Start by asking..." "Once you have that..." "The next check is..."

      *Refining the Examples:* I need to make sure I don't break the flow too much. I can introduce them as "Let's look at three drafts..."

      *Refining the Limitations:* This needs to be the closing section.

