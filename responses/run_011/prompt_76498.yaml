  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Incident investigation group lead at a mid-size chemical plant.
      *   **Task:** Create a procedure for investigators to vet "causal statements" (conditionals) before legal review.
      *   **Problem:** Investigators confuse general conditionals (mechanistic/behavioral rules) with counterfactual conditionals (specific past events). Legal rejects sentences with unjustified confidence, especially "if" statements that don't hold up under contraposition, conflicting evidence, hidden dependencies, or chaining.
      *   **Constraints:**
          *   Target audience: Process engineers (no philosophy, ~30 mins).
          *   Data scarcity: Must work even with no usable data.
          *   Output tags: WOULD (specific counterfactual), GENERAL (disposition/rate), UNKNOWN.
          *   Repair mechanism: Must suggest how to fix sentences that don't earn a tag, not just kill them.
          *   Format: Continuous prose (like a long email), no headings, no bullet points, no bold, no tables.
          *   Content: Must address four specific failure modes (contraposition, conflicting evidence/subjectivity, hidden dependencies/defeaters, chaining).
          *   Examples: Must run the procedure on three specific cases provided by the user.
          *   Limitations: Must explain what the procedure *can't* do (judgment calls, narrowness of antecedents, regulatory perception).
          *   Tone: Professional, direct, colleague-to-colleague, no bibliography/academic references.

  2.  **Deconstruct the Core Problem:**
      *   The core issue is distinguishing between *indicative* conditionals (general truths about the plant) and *counterfactual* conditionals (claims about what *would* have happened in a specific past scenario).
      *   Legal hates counterfactuals because they are speculative. They love generals because they are verifiable.
      *   The procedure needs to force the investigator to justify the link between antecedent and consequent.
      *   Key failure modes to address:
          1.  *Contraposition:* "If A then B" implies "If not B then not A". In causal reasoning, this often fails (multiple causes).
          2.  *Conflicting Evidence:* Different witnesses/data support different conditionals.
          3.  *Hidden Defeaters:* Making the antecedent true might change the context so the consequent doesn't follow (e.g., pump runs only if trip is erased, but trip erasure causes the issue).
          4.  *Chaining:* A -> B -> C, where the link between B and C is weak or unsupported.

  3.  **Drafting the Procedure (Mental Outline):**
      *   *Introduction:* Acknowledge the pain point (legal kickbacks), validate the distinction (general vs. counterfactual).
      *   *The Procedure Steps:*
          *   Step 1: Classification (General vs. Specific).
          *   Step 2: Evidence Check (Data vs. Assertion).
          *   Step 3: The "Flip" Test (Contraposition).
          *   Step 4: The "World Consistency" Test (Hidden Defeaters/Context).
          *   Step 5: The Chain Check (Single link vs. Multi-link).
          *   Step 6: Tagging (WOULD, GENERAL, UNKNOWN).
          *   Step 7: Repair (How to rewrite).
      *   *Running the Examples:*
          *   Case 1: Second operator (Counterfactual, weak evidence, needs repair).
          *   Case 2: Conflicting valve data (Conflict resolution, tagging).
          *   Case 3: Trip armed (Deterministic, should pass).
      *   *Limitations:* Where judgment creeps in, regulatory perception.

  4.  **Refining the Procedure for Constraints:**
      *   *No Bullet Points/Headings:* This is the hardest constraint. I need to use transitional phrases ("First," "Next," "Then") within paragraphs to indicate steps.
      *   *Tone:* Email to a colleague. Professional but direct.
      *   *Content:* Must be actionable. "Ask yourself..."
      *   *Failure Modes:* Need to explicitly weave the four failure modes into the steps.
      *   *Examples:* Need to integrate them smoothly into the prose.
      *   *Limitations:* Honest assessment of the procedure's bounds.

  5.  **Drafting - Section by Section (incorporating constraints):**

      *   *Opening:* Hi [Colleague], I hear you on the legal pushback. It's the difference between how the plant works and what happened on Tuesday. Here is the workflow.
      *   *Step 1 (Classification):* Ask if the sentence describes a rule (GENERAL) or a specific past event (WOULD). If it's about "the pump" generally, it's GENERAL. If it's about "the pump on Tuesday," it's WOULD.
      *   *Step 2 (Evidence):* For GENERAL, do you have a test/manual? For WOULD, do you have data or just inference? If no data for WOULD, it risks UNKNOWN.
      *   *Step 3 (Contraposition/Failure Mode 1):* Flip it. If "If A then B," does "If not B then not A" hold? If not, the original is too strong.
      *   *Step 4 (Consistency/Defeaters/Failure Mode 2 & 3):* If you make the "if" part true, does it break the world? (e.g., changing the trip status changes the flow). Also, check for conflicting witness data (Failure Mode 2).
      *   *Step 5 (Chaining/Failure Mode 4):* Is there more than one "would have" in the sentence? Break it down.
      *   *Tagging:* Assign WOULD, GENERAL, or UNKNOWN.
      *   *Repair:* If it fails, change "would have" to "could have" or split into General + Specific gap.
      *   *Examples:* Walk through the three cases using the steps.
      *   *Limitations:* Acknowledge that "closeness" of the possible world is subjective. Regulators might see UNKNOWN as weakness.

      *Self-Correction on Formatting:* I must ensure *no* bold text, *no* bullet points, *no* numbered lists (except embedded in sentences like "step one"). It needs to look like a wall of text, but readable. I will use paragraph breaks to separate ideas.

      *Self-Correction on Tone:* Keep it empathetic but rigorous. "I know this feels like semantics, but it's liability."

      *Specific Example Handling:*
      *   Case 1 (Second Operator): This is the tricky one. The user wants it to survive but expects the procedure to kill/rewrite it. I need to be honest. The procedure *should* flag this as speculative (UNKNOWN or weak WOULD) because there's no data on what a second operator *would* do. The repair is to change the claim to a system deficiency (checklist) rather than human behavior.
      *   Case 2 (Valve Conflict): This highlights the evidence check. One gets GENERAL (mechanism), one gets UNKNOWN or conflicting WOULD.
      *   Case 3 (Trip): This should pass as GENERAL or strong WOULD because it's deterministic logic.

      *Limitations:* Be clear that this doesn't solve the "blame" problem, just the logic problem.

  6.  **Writing - Iteration 1 (Mental Check):**
      *   Did I use bold? No.
      *   Did I use bullets? No.
