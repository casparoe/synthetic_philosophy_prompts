answer: |-
  Dear Colleague, I hear you on the legal pushback, and you are right to identify the core problem as a confusion between how the plant works in general and what happened on a specific Tuesday. Legal rejects those sentences because they sound like facts but act like guesses, and when you mix those two categories, you give opposing counsel a weapon to dismantle your entire report. What you need is a filter that forces your investigators to separate mechanistic truths from historical speculation before they put pen to paper. I have drafted a procedure below that fits your constraints, avoids the philosophy textbook, and targets the four failure modes you identified. It is designed to be run in thirty minutes by an engineer who is tired and looking at incomplete data.

  Start by isolating the sentence and asking step one, which is a classification question. Does this sentence describe a rule that holds true regardless of the date, such as how a valve responds to pressure or how a checklist is written, or does it describe a specific event that did not happen but might have, such as an operator action or a equipment response on the day of the incident. If it is a rule about the equipment or the written procedure, you are aiming for the GENERAL tag. If it is about what would have occurred on the day in question, you are aiming for the WOULD tag. If you cannot determine which it is, you stop immediately and mark it UNKNOWN, because a sentence that tries to be both is legally indefensible. Once you have classified it, move to step two, which is the evidence check. For a GENERAL tag, you must be able to point to a manual, a test record, or a design specification that verifies the relationship between the antecedent and the consequent. For a WOULD tag, you must have data trends, logs, or corroborated witness statements that support the link. If you are writing a WOULD sentence based solely on what an operator says they would have done without corroborating data, you fail step two. This catches your second failure mode, the conflicting evidence problem, because if one witness says the valve was open and another says it was closed, you cannot write a WOULD statement for either condition without acknowledging the conflict, and you must downgrade the claim to UNKNOWN or split it into two contradictory drafts for legal to review.

  Assuming you pass step two, you proceed to step three, which is the flip test, designed to catch your first failure mode regarding contraposition. Take your sentence and reverse it logically. If you wrote that if the relief valve had lifted the vessel would not have ruptured, you must ask if it is also true that if the vessel ruptured the relief valve did not lift. In causal reasoning, this often fails because there may be multiple ways to prevent a rupture or multiple causes for a rupture. If the flipped sentence is false, your original sentence is claiming too much certainty about causality. You must rewrite it to limit the scope, perhaps by changing would to could or by specifying that the relief valve was the only protection available. Next is step four, the consistency check, which addresses your third failure mode about hidden defeaters. When you imagine the antecedent being true, do you have to change other facts about the day to make it work. If you write that if the pump had run the flow would have continued, but the only way the pump runs is by bypassing a trip that also controls the flow, you have created an impossible world. You cannot hold the trip status fixed while changing the pump status if they are mechanically linked. If making the if part true requires erasing the cause of the accident, the sentence fails step four and must be struck or rewritten to acknowledge the dependency. Finally, apply step five, the chain check, for your fourth failure mode. Count the number of causal links in the sentence. If you have stitched three counterfactuals together, such as if the alarm had sounded the operator would have noticed and would have tripped the unit, you have compounded uncertainty. Each link reduces the probability of the final outcome. If any link in the chain lacks direct evidence, the whole sentence fails. You must break the chain into separate sentences, tagging each link individually, so legal can see exactly where the evidence runs out.

  Once you have run these five steps, you assign the tag. If it is a verified rule, it is GENERAL. If it is a specific past event supported by data and consistent with the plant state, it is WOULD. If it relies on speculation, conflicting testimony, or broken logic, it is UNKNOWN. If a sentence fails to earn a tag, you do not simply delete it. You repair it by downgrading the modality. Change would to could to indicate possibility rather than certainty, or shift the focus from human action to system design. For example, instead of claiming an operator would have caught an error, claim that the procedure did not require a check for that error. This moves the claim from a speculative WOULD about human behavior to a verifiable GENERAL about the documentation.

  Now let us run this procedure on the three drafts you provided. The first one is if the second operator had been on shift the bypass would have been caught before startup. In step one, this is clearly a WOULD claim because it refers to a specific past shift. In step two, you have no data. You have no record of what a second operator would have done, only an assumption about headcount. You fail step two. In step four, you also risk a consistency error because adding a person changes the dynamic of the shift, potentially introducing new errors or distractions, though that is harder to prove. Because this fails the evidence check for a WOULD claim, the procedure tells you to rewrite it. The honest replacement sentence focuses on the system deficiency rather than the human salvation. You should write the bypass was not included in the pre-startup checklist, which is a GENERAL fact, and then add a separate finding that staffing levels did not provide redundancy for checklist verification, which is a policy observation. This survives legal because it attacks the process, not the hypothetical behavior of a ghost operator. I know you wanted to use this for headcount arguments, but the procedure forces you to argue for the checklist change first, which is safer ground.

  The second case involves the conflicting valve conditionals where one investigator says if the valve was open flow continued and another says if the valve was closed flow stopped, based on conflicting witness and trend data. Step one identifies these as WOULD claims about the specific day. Step two flags the conflict immediately. You cannot have two contradictory WOULD statements in the same report. The procedure stops you cold here. You must tag both as UNKNOWN regarding the specific position, or you must write a GENERAL statement about the valve design and a separate factual statement about the data discrepancy. The repair is to state that the valve position at fourteen zero two is indeterminate based on available evidence, and then write a GENERAL conditional about what the valve does when open versus closed. This separates the known mechanics from the unknown history.

  The third case is if the trip had been armed the pump would have stopped. Step one marks this as WOULD. Step two passes because you have deterministic logic and bench test records. Step three passes because if the pump did not stop, the trip was not armed, which holds true for this logic. Step four passes because arming the trip does not require erasing other conditions that caused the incident. Step five passes because it is a single link. This sentence earns the WOULD tag and survives without repair. This is crucial because a procedure that vetoes everything destroys your credibility, and this example shows that verified mechanistic claims are safe.

  Finally, I need to tell you what this procedure cannot do, because if you treat it as a magic wand it will fail you in deposition. The biggest limitation is in step four, the consistency check. Deciding which background conditions to hold fixed when you change the past is a judgment call wearing a procedure's clothes. When you ask an investigator to imagine the alarm sounded, they have to decide whether the operator was distracted, whether the phone was ringing, and whether the training was effective. The procedure tells them to check for consistency, but it does not tell them how narrow the world should be. An investigator can always make a WOULD statement true by narrowing the world enough, or false by widening it. You will still need a senior engineer to review the WOULD tags to ensure the imagined world is reasonable. Additionally, this procedure will misfire on sentences that are technically UNKNOWN but practically certain. If an operator says they would have hit the button and there is no reason to doubt them, the procedure might force an UNKNOWN tag because there is no trend data, and a regulator will read that UNKNOWN tag as hedging or weakness. You cannot fix this with logic alone. You will have to accept that legal safety sometimes looks like ambiguity to a regulator. The procedure protects you from saying something false, but it does not protect you from sounding unsure. You will need to decide internally when a strong UNKNOWN is better than a weak WOULD, but for the purposes of the draft review, the procedure must err on the side of caution. Use this to clean the draft before legal sees it, but do not expect it to resolve the fundamental tension between finding causes and avoiding liability.
