answer: |-
  # Activity: The Sentience Wager
  **Time:** 75 Minutes
  **Class Size:** 26 Students (5 Groups of 5–6)
  **Materials:** 10 Case Cards (printed), Sentience Token Sheets (one per group), Projector for timers/scores.

  ## Part 1: Setup & Rules (5 Minutes)
  **Do not lecture.** Do not define consciousness. Do not mention Descartes, Nagel, or functionalism.

  1.  **Divide:** Split the class into 5 groups.
  2.  **Distribute:** Give each group a **Sentience Ledger** (paper) and **6 Sentience Tokens** (physical chips or marked paper).
  3.  **The Goal:** You are the allocation committee. You must decide which entities possess **phenomenal consciousness** (there is "something it is like" to be them).
  4.  **The Constraint:** You have 6 tokens for 10 cases. You cannot bet on everything.
      *   **Wager:** To vote **YES** (Conscious), you must spend 1 Token.
      *   **Abstain:** To vote **NO** (Not Conscious), you spend 0 Tokens.
      *   **Hedge:** You may split a token (tear it in half) to indicate uncertainty, but this costs 1.5 Tokens total.
  5.  **The Scoring:**
      *   **False Positive (Over-inclusion):** You bet a token, but the "Consensus Key" says No. **Loss: 2 Points.**
      *   **False Negative (Under-inclusion):** You didn't bet, but the "Consensus Key" says Yes. **Loss: 2 Points.**
      *   **The Octopus Rule:** On Card #5, points are awarded based on *room disagreement*. (Detailed below).
  6.  **Winning:** The group with the most points at the end gets... nothing, but the group with the *lowest* score has to summarize the debrief.

  ## Part 2: The Case Cards (40 Minutes)
  **Structure:** 5 Rounds. 2 Cards per round. 8 Minutes per round (3 min discussion, 2 min wager, 3 min reveal/score).
  **Instruction:** Read the facts aloud. Do not elaborate.

  **Round 1**
  *   **Card 1: The Honeybee.** *Apis mellifera*. Brain mass: 1mg. Neuron count: ~960,000. Capable of facial recognition, complex navigation, and communicates location of resources via symbolic "waggle dance." Learns from observing other bees. Lifespan: 6 weeks.
  *   **Card 2: The Sea Anemone.** *Nematostella vectensis*. No central brain. Diffuse nerve net. Retracts tentacles when touched. Releases digestive enzymes when prey contacts oral disk. Regenerates entire body from small fragments.

  **Round 2**
  *   **Card 3: The Human Gut.** *Enteric Nervous System*. 100 million neurons (more than a cat's brain). Embedded in stomach lining. Operates independently of the skull brain. Produces serotonin. Can trigger vomiting or digestion without skull-brain input.
  *   **Card 4: The Sleeping Dog.** *Canis lupus familiaris*. REM sleep cycle observed. Muscles twitch. Whining occurs. Brain waves match human dreaming patterns. Wakes and acts normally immediately after.

  **Round 3 (The Trap)**
  *   **Card 5: The Severed Octopus Arm.** *Octopus vulgaris*. Arm severed from body. Two-thirds of the animal's neurons are in the arms, not the head. The severed arm continues to grasp objects, avoid noxious stimuli, and attempt to feed itself for several hours. The body remains alive and solves mazes.
      *   *Special Wager:* Groups must mark **ONE** of two options: [A] This is the same subject as the body. [B] This is a new, separate subject.
  *   **Card 6: The Intact Octopus.** *Octopus vulgaris*. Three hearts. Blue blood. Opens jars, uses coconut shells as armor, plays with toys. Camouflages instantly.

  **Round 4**
  *   **Card 7: C. Elegans.** *Caenorhabditis elegans*. Nematode worm. Exactly 302 neurons. Connectome fully mapped. Moves toward food, away from heat. If a specific neuron is laser-destroyed, a specific behavior stops.
  *   **Card 8: The Mimosa Plant.** *Mimosa pudica*. No neurons. Folds leaves when touched. If dropped repeatedly, stops folding (habituation). Remembers this for weeks. Reacts to salt water differently than fresh water.

  **Round 5**
  *   **Card 9: The Chimpanzee.** *Pan troglodytes*. Shares 98% DNA with humans. Uses tools. Passes mirror self-recognition test. Shows grief over dead infants.
  *   **Card 10: The Human Infant.** *Homo sapiens*. 6 months old. No language. Motor control incomplete. Brain still myelinating. Screams when hungry. Smiles at faces.

  ## Part 3: Scoring & The Octopus Twist (10 Minutes)
  **The Reveal:**
  Project the "Consensus Key." (Tell them this is based on current philosophical/intuitive consensus, not hard science).

  *   **Key:**
      *   Bee: **Yes** (Functional complexity outweighs size).
      *   Anemone: **No** (Reflexive only).
      *   Gut: **No** (Part of a system, not a subject).
      *   Dog: **Yes** (Mammalian parity).
      *   Octopus (Intact): **Yes** (One Subject).
      *   Octopus (Arm): **Underdetermined** (See below).
      *   Worm: **No** (Too simple).
      *   Plant: **No** (No neurons).
      *   Chimp: **Yes** (High parity).
      *   Infant: **Yes** (Human parity).

  **The Octopus Scoring Mechanic:**
  1.  Tally the class vote for Card #5 (Severed Arm): How many groups voted [A] Same Subject vs [B] Separate Subject?
  2.  **If the Room is Split:** (e.g., 2 groups say A, 3 groups say B):
      *   Groups that voted **Unanimously** (all members agreed internally) **LOSE 2 Points**. (Penalty for dogmatism in the face of ambiguity).
      *   Groups that recorded **Internal Dissent** (noted on their ledger that members disagreed) **GAIN 2 Points**. (Reward for recognizing underdetermination).
  3.  **If the Room Agrees:** (All 5 groups pick A or all pick B):
      *   Everyone loses 2 Points. (Penalty for groupthink on an unsolvable problem).

  *Note: This forces them to realize that on the hardest cases, disagreement is the rational position.*

  ## Part 4: The Debrief (20 Minutes)
  **Step 1: The Criteria Audit (5 mins)**
  Ask: "To get those points, what rule were you using?" Write their answers on the board. They will likely produce:
  *   "It has neurons."
  *   "It acts like it feels pain."
  *   "It's evolved like us."
  *   "It has a brain."

  **Step 2: Mapping the Traps (10 mins)**
  Connect their rules to the philosophical families. Do not use jargon until you map their intuition.

  *   **The Bee Trap (Neural Chauvinism vs. Functionalism):**
      *   *If you said No:* You were using **Neural-Convergence Criteria** (needs a cortex/mammal brain). *Cost:* Excludes bees, octopuses, potentially aliens/AI.
      *   *If you said Yes:* You were using **Functional/Behavioral Criteria** (does it learn/act?). *Cost:* Risks including sophisticated thermostats or the Plant (Card 8).
  *   **The Gut Trap (Integration Criteria):**
      *   *Why No?* It has more neurons than a bee. Why did you exclude it?
      *   *Theory:* **Unity of Consciousness.** You require the system to be integrated into a single "self."
      *   *Cost:* This is exactly where the Octopus Arm broke you. If the arm acts alone, is it a self?
  *   **The Octopus Trap (Subjectivity Criteria):**
      *   Address the scoring. Why did the split cost/earn points?
      *   *Theory:* **Numerical Identity.** How many "lights" are on?
      *   *Point:* Science tells us what it *does*. Philosophy asks *who* is doing it. The biology underdetermines the metaphysics.
  *   **The Plant/Worm Trap (Evolutionary Criteria):**
      *   *If you excluded them:* You are using **Evolutionary Continuity**. Consciousness is a biological tool for complex organisms.
      *   *Cost:* Panpsychism risk. If consciousness is a tool, when did the tool appear? Exactly at which mutation?

  **Step 3: The Hard Limit (5 mins)**
  *   Ask: "Did anyone solve Card #5 definitively?"
  *   Admit: "Neither did the experts."
  *   **The Gap:** This activity tested **criteria for attribution**. It did not touch the **Hard Problem**. You were judging behavior and structure. You never accessed the *experience* itself.
  *   **Takeaway:** We are building criteria to manage our moral uncertainty, not to discover a hidden biological fact. The "Token Economy" mirrors our moral risk: we punish over-inclusion (wasting moral concern) and under-inclusion (committing moral atrocities).

  ---

  # Instructor's Cheat Sheet: Predictable Failures & Fixes

  ### 1. The "Biology Quiz" Trap
  *   **What goes wrong:** Students treat the cards as a test of biological knowledge ("I read somewhere bees don't feel pain").
  *   **The Fix:** Interrupt immediately. "I am not asking what is true. I am asking what rule you are using to bet your tokens. If your rule is 'Only mammals,' stick to it even if you love bees."

  ### 2. The Token Hoarders
  *   **What goes wrong:** Groups save all 6 tokens for the "obvious" ones (Chimp, Dog, Infant) and abstain on everything else. They avoid the trap.
  *   **The Fix:** In Round 3, announce a "Inflation Event." "Cards 5-10 now cost 2 tokens to bet." This forces them to spend their budget on the ambiguous cases, triggering the trap.

  ### 3. The Octopus Deadlock
  *   **What goes wrong:** The Octopus Arm discussion eats 15 minutes. The room gets stuck on the biology of regeneration.
  *   **The Fix:** Enforce the timer ruthlessly. "The biology is fixed. The metaphysics is yours. Commit to a wager." The scoring rule (penalizing unanimity if the room splits) encourages them to *record* their disagreement rather than resolve it.

  ### 4. The "Truth Key" Revolt
  *   **What goes wrong:** Students argue the Key is wrong (e.g., "Plants *are* conscious!").
  *   **The Fix:** Agree with them. "Exactly. The Key is arbitrary. That is the point. If you can argue against the Key using reason, you have proven the underdetermination. You just did philosophy."

  ---

  # Meta-Commentary: What This Activity Cannot Do
  Be straight with your students (and yourself) about the limitations of this simulation.

  1.  **It Cannot Reproduce Qualia:** The activity forces them to judge *third-person* evidence (behavior, neurons). It cannot make them feel *first-person* uncertainty. They are playing God, not being the bee. You must supply the phenomenological gap in the debrief ("You never felt the bee's pain; you only counted its neurons.").
  2.  **It Flattens Moral Stakes:** Losing a token is not the same as killing an animal. The "punishment" is gamified. You must explicitly reconnect the tokens to moral weight in the conclusion ("In the real world, a False Negative isn't -2 points; it's factory farming. A False Positive isn't -2 points; it's wasted resources.").
  3.  **It Implies a Solution Exists:** The scoring key implies there *is* a right answer you are withholding. You must dismantle this in the final minute. The "right answer" is that the question is partly conceptual, not empirical.

  **Final Instructor Note:** The success of this lesson is not measured by who wins the tokens. It is measured by how annoyed they are that the Octopus Arm didn't have a clear answer. That annoyance is the philosophical insight.
