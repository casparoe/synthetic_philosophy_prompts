prompt: |-
  So I'm in a philosophy of biology seminar this term and this week we're doing Popper on demarcation plus the stuff where he talks about Darwin. My response paper is only three pages but I want to get the shape of his argument right, because I think I might be running two things together and my roommate (he's on the debate team) keeps telling me I am. Here's how I currently understand it: the criterion is that a theory counts as scientific only if experience could show it false, and unfalsifiable stuff is meaningless pseudo-science, which is how Freud and Adler got tossed out. Then Popper looks at natural selection and says it's basically tautological — survival of the fittest just amounts to survival of the ones that survived — so it can't be falsified and it lands in the same bucket as psychoanalysis. But he also says somewhere in his intellectual autobiography from the mid-seventies that Darwinism was an enormously successful metaphysical research programme, and then later he apparently reversed himself and said it *is* testable after all, with something about fitness being a propensity or disposition rather than just a body count of offspring.

  The thing I most want to argue in the paper is that this episode is falsificationism refuting itself. Like, if the criterion misfired on the single most important theory in biology, and its own author had to withdraw the classification fifteen years later, doesn't that count as a failed prediction? I want to say the criterion is supposed to be empirical and self-applying, so Popper's Darwinism reversal is an internal self-refutation, not just a guy changing his mind about one example. Is that a fair move or is there a reason the demarcation criterion doesn't have to be falsifiable itself, and if so what kind of thing is it supposed to be?

  Second part, which is really what started this: my roommate used all of it last week to argue that even Popper admitted evolution isn't science, and I told him no, Popper hated that crowd and thought Darwinism was flat-out true. But if Popper really did group it with Freud and Adler and really did think the selection principle was empty, my rebuttal is kind of hollow. My instinct is that the right reply is that he never grouped them together and the two objections are different in kind — the psychoanalysis one is about how the theory's defenders keep rescuing it from every apparent refutation, whereas the Darwinism one is about the general principle having no content to risk — and that's why he could call one a pseudo-science and the other a metaphysical research programme worth betting your whole epistemology on. But then I get stuck, because I keep wanting to say the propensity move "fixed" the emptiness problem by stipulating a new meaning for fitness, which woudl be circular, and our TA said that's too quick and I couldn't reconstruct why in the moment. Can you sort out which parts of my reading actually hold and which parts I've mangled?
