          *   *Philosophical reality:* Popper explicitly denied the demarcation criterion is an empirical theory. It's a *proposal* or a *definition* for the purpose of solving the problem of induction and distinguishing science from non-science. It's a methodological rule, not a scientific hypothesis. Therefore, it cannot be "falsified" in the Popperian sense by a counter-example. It can be shown to be *inadequate* or *unuseful*, but not false in the same way a theory about gravity is false.
          *   *Verdict:* The "self-refutation" argument is a common critique (e.g., by Kuhn or Lakatos), but Popper has a defense: the criterion is philosophical, not scientific. However, if the criterion renders paradigmatic science (Newton, Einstein, Darwin) as non-science, it loses its *utility*. The user needs to nuance "falsified" vs. "pragmatically useless."

