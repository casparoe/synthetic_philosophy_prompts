answer: |-
  Brainstorming candidate readings suggests at least four competing interpretations of the rate-case practice, each with explanatory gaps. First, the **Langean Simulation** reading views the commission as a Central Planning Board setting parametric prices to clear a simulated market; this struggles to explain why the "price" is often a revenue requirement based on historical accounting cost rather than marginal cost, and why the adjustment period is years rather than continuous. Second, the **Legal Entitlement** reading sees the rate as a contractual settlement ensuring solvency in exchange for franchise rights; this fits the "fair return" language but struggles to explain the intense focus on efficiency benchmarks and prudence reviews, which imply an economic truth exists to be found. Third, the **Hayekian Concession** reading argues the practice admits ignorance of the frontier and uses yardstick competition as a proxy; this struggles against the commission's final order, which speaks with the authority of having determined *the* just and reasonable rate, not an approximation. Fourth, the **Instrumentalist** reading claims the practice is a set of stabilizing rules of thumb with no ontological commitment to price theory; this fits the pragmatic messiness of settlements but struggles to explain the rigorous, theory-laden testimony on cost of capital (WACC) and asset valuation that participants treat as objectively discoverable. The Instrumentalist reading is the strongest rival because it dissolves the puzzle by denying the premise that the practice *has* a coherent theory, yet it risks being too cynical about the genuine epistemic efforts of the analysts and judges involved.

  ***

  **1. The Ontology of the Administered Price**
  Is the commission-determined revenue requirement a price in the Misesian sense? Strictly, no. For Mises, a price is a phenomenon of exchange, emerging from the clash of valuations regarding the *ownership* of goods. In your rate case, the ownership of the utility's capital stock does not change hands during the proceeding; the "price" is a rule for transferring income from ratepayers to shareholders to prevent confiscation. It is closer to a **Langean parameter** than a Misesian price, but with a critical distortion: Lange's Central Planning Board was to set prices to equate supply and demand (marginal cost), whereas your commission sets prices to cover *average* accounting costs plus a return on capital.

  However, it is also a **legal entitlement**. The "just and reasonable" standard is a juridical category, not an economic one. The practice treats the price as a **parametric placeholder** only in the inter-review period; once set, it is a fixed rule. The most accurate description is a **negotiated settlement codified as administrative law**. It functions *as if* it were a price for the purpose of rationing demand, but it is generated *as* a cost-allocation mechanism. Mises denied that a rational allocation of *capital* could occur without ownership exchange; your commission does not allocate new capital (mostly), it ratifies sunk capital. Thus, the object is a hybrid: a legal rule with economic justification attached, masquerading as a discovery of value.

  **2. Presupposition vs. Fit (and the Instrumentalist Challenge)**
  You suspect the practice fits a famous position without presupposing it. I agree. The practice fits the **Langean** model comfortably (announce, observe, revise), but it does not presuppose it. Lange presupposed that the planning board *could* calculate equilibrium prices if it had the right equations. Your commission explicitly disclaims the ability to know the efficient cost frontier (as you note in your third point).

  The **Instrumentalist** reading is a live rival that must be taken seriously. The practice presupposes **accounting validity**, not economic efficiency. The core assumption is that if the procedure (notice, testimony, cross-examination, precedent) is followed, the result is legitimate. The economic theories (CAPM for equity return, depreciation schedules) are tools of persuasion and standardization, not ontological commitments. If the commission truly presupposed Lange, it would prioritize marginal cost pricing; if it presupposed Mises, it would not exist. It presupposes **political stability and utility solvency**. The economic theory is ex-post rationalization. However, the Instrumentalist reading fails to account for the *constraints* on the commission. They cannot simply pick a number; they are bound by "substantial evidence" in the record. This implies a belief that economic facts (the cost of equity, the useful life of a pipe) are discoverable and binding, which contradicts pure instrumentalism. The practice is underdetermined: it operates within a space where economic truth is treated as discoverable for legal purposes, even if economically elusive.

  **3. The Contradiction: Unknown Frontiers vs. Correct Prices**
  How do we reconcile the admission of ignorance (benchmarking) with the claim of correctness (the order)? This is not a logical contradiction but a **juridical fiction**. The commission claims to determine the "correct" price in the sense of a **procedurally verified estimate**, not an ontologically true scarcity value.

  The reliance on yardstick competition is indeed a covert concession to **Hayek**. It admits that the regulator cannot access the tacit knowledge of the firm's engineers and managers regarding the true efficiency frontier. By comparing the firm to peers, the regulator attempts to aggregate dispersed information without possessing it. However, it is not neutral among rival accounts. It rejects the Misesian claim that calculation is *impossible* (since they do calculate a number) and rejects the Langean claim that calculation can be *direct* (since they use proxies). It adopts a **second-best epistemology**: we cannot know the truth, but we can identify outliers. The "correct price" is therefore the price that survives adversarial testing against peer data, not the price that reflects marginal cost. The contradiction dissolves if you view the "correctness" as a standard of *reviewability* rather than *efficiency*.

  **4. Scope and Parasitism (The Misesian Limit)**
  This is the decisive point. Mises's argument concerns an economy where the **means of production are not privately owned and traded**. In your rate case, the utility buys transformers, steel, gas, and labor at **market prices**. The calculation problem is solved *upstream*. The utility can calculate whether to buy a Siemens turbine or a GE turbine because those prices exist. The regulator can assess the "prudence" of that purchase because a market benchmark exists.

  Therefore, the practice **parasitically depends on a surrounding market order**. It is indeed an island of administration in an ocean of exchange. This inverts Coase's image of the firm (an island of direction in a sea of prices); here, the regulated utility is an island of *administered prices* in a sea of *market costs*. The Misesian calculation objection survives intact against *full* socialization (where the turbine maker is also state-owned and no market price for turbines exists), but it does not apply here. The regulator is not solving the allocation of steel in the economy; they are allocating the *rents* generated by a monopoly on the distribution of steel-embodied electricity.

  Regarding the Soviet mathematician (likely Kantorovich): If his claim was that dual multipliers were "objectively determined valuations" arrived at by computation, this differs from your commission. Kantorovich attempted to solve the *general* equilibrium problem internally, without external market prices for inputs. Your commission uses external market prices for inputs to validate the rate base. The Soviet case claims to *generate* prices from technology; your commission claims to *recover* costs validated by market purchases. The Soviet claim is theoretically bolder and, per Mises/Hayek, more vulnerable. Your practice is theoretically modest: it relies on the market to value the past, and administration to value the future return.

  **5. Shadow Pricing vs. Tariff Fixing**
  Do these practices presuppose the same view of price? No. They are importantly different.
  *   **Shadow Pricing (VSL, Travel Time):** This presupposes a **welfare economics** view of price. It assumes preferences exist and can be imputed or revealed to construct a "virtual" market. The price is a measure of *utility* or *disutility*.
  *   **Tariff Fixing:** This presupposes an **accounting/financial** view of price. It assumes costs are incurred and capital requires a return. The price is a measure of *financial solvency* and *cost recovery*.

  When you compare a shadow price to a market price, you are comparing a welfare metric to an exchange metric, asking if the welfare justifies the cost. When the commission sets a tariff, it is comparing a revenue requirement to a revenue need, asking if the cash flow covers the obligation. The shadow price attempts to *mimic* a missing market valuation of a good (life, time). The tariff attempts to *replace* a market valuation of a service (electricity) with a cost-plus rule. One is imputing value for a non-market good; the other is administering a return on a market-based asset.

  **6. What Would Change? (The Counterfactuals)**
  *   **If Mises were adopted:** The practice would have to change radically. Mises would argue that without transferable ownership of the utility's capital, the "rate base" is a fiction. To satisfy Mises, you would need to privatize the utility or create a market for the utility's capital stock itself (e.g., frequent auctions of the franchise or the assets). The rate case would disappear, replaced by antitrust or franchise bidding.
  *   **If Hayek were adopted:** Hayek would argue the commission cannot know the efficient cost. He would favor **incentive regulation** (like the price-cap/RPI-X you mentioned) over cost-of-service. He would want the price fixed for longer periods to allow the firm to utilize its local knowledge to cut costs and keep the surplus, rather than having every cost scrutinized in a rate case. The "litigation" over operating expenses would be viewed as wasteful noise.
  *   **If Lange were adopted:** The commission would focus strictly on **marginal cost pricing**. They would attempt to set the price equal to the short-run marginal cost of production, subsidizing fixed costs through lump-sum taxes if necessary (to avoid the deadweight loss of average cost pricing). The "fair return on rate base" would be discarded as irrelevant to allocative efficiency.

  **Which does the practice embody?**
  The practice as presently run is **philosophically underdetermined**. It embodies a **Legal-Instrumentalist hybrid**.
  *   It uses **Langean** mechanics (revision, parameters) but rejects Lange's goal (marginal cost).
  *   It uses **Hayekian** tools (yardstick competition) but rejects Hayek's conclusion (deregulation/incentive regulation).
  *   It relies on **Misesian** inputs (market prices for capital goods) to sustain a **non-Misesian** structure (administered output prices).

  The practice is stable not because it has solved the calculation debate, but because it has **juridified** it. The "truth" of the price is whatever survives the adversarial process. The economic theories are weapons in that process, not the foundation of the institution. The puzzle you feel arises because you are looking for an economic ontology where the institution has installed a legal procedure. The commission does not need to know the "efficient price" in the Hayekian sense; it only needs to know the "defensible price" in the Administrative Procedure Act sense.
