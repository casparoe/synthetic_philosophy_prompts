  I would like an explanation that gets to the bottom of this. Please assume I am a careful reader but that I have not read any philosophy, so define any technical term the first time you use it. I am not looking for a survey of what different thinkers have said, and please do not include a reading list or references; I want the reasoning itself. If there is a standard name in the literature for the feedback phenomenon I describe in the fourth section below, I would like to know it, but naming it is not the main point.

  Please organize your response in exactly these sections, in this order:

  **Bottom line** (about 120 words). Give me your answer up front: what was actually confused in that exchange, stated as compactly as you can manage without being vague.

  **Two ways to construct something** (about 300 words). Explain the difference between constructing a concept or idea and constructing the object the concept picks out, and show how the question "are there races?" can get different answers depending on which of these is at issue. Please be explicit about what has to be true for the answer to come out one way rather than the other.

  **What "not real" could and could not mean** (about 300 words). Sort through the ways a claim like "race is not real" could be intended, and explain which of them follow from social construction and which do not. Here I especially want help with the mountain comparison: what is the difference between depending on minds for its existence and depending on minds for its classification, and does either kind of dependence threaten the objectivity of claims about the thing?

  **The classification that changes the classified** (about 250 words). There is a feature of categories applied to people that categories applied to rocks do not seem to have: once people learn they have been sorted into a category, they can change in response to being sorted, which in turn changes what the category picks out. Explain what this does to the question of whether such a category tracks something independent of us, and whether it makes kinds of people more constructed than kinds of things, less constructed, or constructed in some different way.

  **Money and race: where the analogy holds and where it breaks** (about 250 words). Assess my own move in class. Explain what money and race genuinely share as social kinds, and then identify the specific respects in which they differ that matter for whether the analogy supports my objection or the third student's reply. I want to know whether I was right that the money example defeats the "constructed therefore not real" claim, or whether I had simply picked a bad example.

  **What I should have said** (about 100 words). A short, usable formulation of the distinction I was groping for, phrased so that a seventeen-year-old could say it out loud in a classroom and not be talked past.
