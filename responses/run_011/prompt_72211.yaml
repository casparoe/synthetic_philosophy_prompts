          *   *Issue:* "Ex-post regret." If we approve based on $\infty$, but reality yields finite (low) value, we look foolish.
          *   *Verdict:* Truncated Expectation. Report the truncation point explicitly. Acknowledge the "Infinity Trap."

  6.  **Refining the Output Tone:**

      *   Must sound professional, authoritative, yet empathetic to the analyst's constraints.
