          *   *Comparative Assessment:* If $EV(A)$ and $EV(B)$ are bad, is $EV(A-B)$ well-defined?
      *   *Step 5: Human Hand-off.* When values dominate arithmetic (e.g., choosing the truncation point).

  4.  **Addressing Specific Constraints & Political Nuance:**

