          *   *Absolute Convergence:* $\sum |p_i x_i| < \infty$. EV is well-defined, order-independent.
          *   *Conditional Convergence:* $\sum p_i x_i$ converges, but $\sum |p_i x_i| = \infty$. Riemann Rearrangement Theorem applies: sum depends on ordering. (Pasadena Game).
          *   *Divergence:* $\sum p_i x_i \to \infty$ or oscillates without settling. (St. Petersburg Game).
      *   **The "Concave Transform" Objection:** Applying $U(x)$ (e.g., log utility) might make $\sum p_i U(x_i)$ converge. *Problem:* This changes the metric from "Net Benefit" (monetary/lives) to "Utility." It hides the risk rather than solving the arithmetic indeterminacy. It also introduces arbitrary parameters (risk aversion coefficient).
