answer: |-
  **MEMORANDUM OF PROCEDURE: MDP-04 (EXPECTATION ADMISSIBILITY PROTOCOL)**

  **TO:** Modelling Unit Analysts
  **FROM:** Foundations Secondment
  **SUBJECT:** Standard Operating Procedure for Heavy-Tailed Intervention Models
  **DATE:** 24 May 2024
  **STATUS:** Mandatory for all Programme Assessments involving >$1B impact or existential risk parameters.

  ---

  ### PART 1: THE PROCEDURE

  You have two days. You have Excel/Python. You cannot do real analysis. You must satisfy Rule 4 (10% reproducibility). This protocol converts mathematical pathologies into administrative checkpoints.

  #### Phase 1: Diagnostic Tests (Hours 0–4)
  *Run these on the baseline 40-cell grid, then repeat on a refined 80-cell grid.*

  **Test A: The Absolute Sum Check (ASC)**
  1.  In your spreadsheet, create Column C: `Abs_Weighted_Payoff = ABS(Probability * Payoff)`.
  2.  Sum Column C. Call this $S_{abs}$.
  3.  **Action:** Refine the grid (split cells, redistribute probability mass according to the model's density function). Recalculate $S_{abs}$.
  4.  **Criterion:** If $S_{abs}$ increases by >10% upon refinement, or exceeds $10 \times$ the Net Benefit figure, flag as **NON-ABSOLUTE**.

  **Test B: The Reordering Stress Test (RST)**
  1.  Take the 40-cell baseline. Calculate the standard Net Benefit ($E_{std}$).
  2.  Sort the rows by `Payoff` (Descending). Recalculate sum ($E_{high}$).
  3.  Sort the rows by `Payoff` (Ascending). Recalculate sum ($E_{low}$).
  4.  **Criterion:** If $|E_{high} - E_{low}| > 0.1 \times |E_{std}|$, flag as **ORDER-DEPENDENT**. (This violates Rule 4).

  **Test C: The Truncation Sensitivity Curve (TSC)**
  1.  Sort scenarios by Probability (Descending).
  2.  Calculate the cumulative expected value as you add rows one by one.
  3.  Plot Cumulative EV (Y-axis) vs. Cumulative Probability Mass (X-axis).
  4.  **Criterion:** If the curve does not flatten (asymptote) before reaching the last 5% of probability mass, flag as **TAIL-SENSITIVE**.

  #### Phase 2: Verdict Tree (Hour 5)

  | Test Results | Mathematical Status | Admissibility Verdict |
  | :--- | :--- | :--- |
  | **Pass ASC, Pass RST** | Absolutely Convergent | **ADMISSIBLE.** Report Standard EV. |
  | **Fail ASC, Pass RST** | Divergent (St. Petersburg type) | **INADMISSIBLE.** Proceed to Phase 3A. |
  | **Pass ASC, Fail RST** | *Impossible* (Mathematically inconsistent model) | **REJECT MODEL.** Return to modellers. |
  | **Fail ASC, Fail RST** | Conditionally Convergent (Pasadena type) | **INADMISSIBLE.** Proceed to Phase 3B. |
  | **Fail TSC (Any)** | Poorly Estimated / Heavy Tail | **WARNING.** Requires Phase 3 substitutes. |

  #### Phase 3: Remediation & Substitutes (Hours 6–16)

  **3A: For Divergent Tails (St. Petersburg)**
  *The sum grows without bound. You cannot report an EV.*
  *   **Substitute 1: Truncated Expectation.** Cut the sum at the 99th percentile of probability mass.
      *   *Report:* "Expected Net Benefit (99% Confidence): $X."
      *   *Condition:* Legitimate only if the excluded tail represents physically impossible scenarios (e.g., energy > mass of universe). If the tail is physically possible but unlikely, this is a value judgment (see Phase 4).
  *   **Substitute 2: Median Outcome.** Report the payoff at the 50th cumulative probability.
      *   *Condition:* Legitimate for skewed distributions where mean is undefined.

  **3B: For Order-Dependent Sums (Pasadena)**
  *The sign flips based on sorting. The EV is mathematically undefined.*
  *   **Substitute 1: Bounded Utility Transform.** Apply $U(x) = \ln(x + k)$ or similar to payoffs *before* weighting.
      *   *Report:* "Risk-Adjusted Value (Log-Utility): $Y." **Do not call this Expected Net Benefit.**
      *   *Condition:* Legitimate only if the committee accepts utility as the metric. (See Response to Objections below).
  *   **Substitute 2: Interval Reporting.** Report $[E_{low}, E_{high}]$ from Test B.
      *   *Condition:* If the interval spans zero (e.g., $[-5B, +5B]$), the programme is **UNRANKABLE**.

  **3C: Comparative Assessment (The Difference Test)**
  *If Programme A and Programme B both fail admissibility.*
  *   **Procedure:** Model the *difference* in payoffs $(Payoff_A - Payoff_B)$ for each scenario.
  *   **Test:** Run Phase 1 on the Difference Model.
  *   **Verdict:** If the Difference Model passes ASC and RST, report the **Incremental Expected Benefit**.
  *   **Condition:** Licensed only if the heavy tails are *correlated* (i.e., the same scenarios cause the divergence in both). If tails are independent, the difference will also diverge.

  #### Phase 4: Human Hand-Off (Hour 17)
  *The procedure stops here. These are not arithmetic questions.*
  *   **Trigger:** If the only available substitute is a Truncated Expectation (3A) or Bounded Utility (3B).
  *   **Action:** Escalate to the Scientific Advisory Committee with a "Value Judgment Required" flag.
  *   **Question to Committee:** "Do we accept excluding the top 1% of scenarios?" or "Do we accept Log-Utility as the decision metric?"

  ---

  ### PART 2: DOCUMENTATION OF REFUSAL

  When a programme fails admissibility, you must issue a **Notice of Arithmetic Indeterminacy (NAI)**. This is not a rejection of the science; it is a rejection of the metric.

  **Template:**
  > **PROGRAMME:** [Name]
  > **ASSESSMENT:** [ID Number]
  > **VERDICT:** EXPECTATION INADMISSIBLE
  > **REASON:** Failure of Rule 4 (Reproducibility).
  > **DETAIL:**
  > 1. Absolute Sum Check failed (Sum of absolute weighted payoffs exceeds Net Benefit by factor >10).
  > 2. Reordering Stress Test failed (Sorting by payoff magnitude alters sign of Net Benefit).
  > 3. Conclusion: The Expected Net Benefit is mathematically undefined (Conditionally Convergent Series).
  > **SUBSTITUTE METRIC:** [e.g., Truncated Expectation at 99th Percentile]
  > **WARNING:** This substitute excludes [X]% of scenario mass. The ranking of this programme relative to others is sensitive to the choice of truncation.
  > **ANALYST SIGNATURE:** [Name]

  ---

  ### PART 3: RESPONSE TO THE "CONCAVE TRANSFORM" OBJECTION

  **Objection:** *"If we apply a concave utility function (e.g., log wealth), the series converges. The problem disappears. Why not just do that?"*

  **Standard Response:**
  "The problem does not disappear; it is relocated.
  1.  **Change of Currency:** Expected Net Benefit is measured in [Dollars/Lives]. Utility is measured in [Utils]. A concave transform converts an objective arithmetic failure into a subjective risk-preference parameter. You are no longer reporting 'Expected Benefit'; you are reporting 'Expected Utility for a specific risk-aversion coefficient.'
  2.  **Arbitrariness:** There is no scientific consensus on the coefficient of risk aversion for national-scale interventions. Choosing a transform strong enough to force convergence is a value judgment, not a calculation.
  3.  **Persistence of Pathology:** For sufficiently heavy tails (e.g., geometric payoff growth), even logarithmic utility may not converge. If the payoff grows faster than the utility function compresses, the divergence remains.
  **Directive:** You may use a transform as a *substitute metric* (Phase 3B), but you must disclose the transform and label the output 'Risk-Adjusted Value.' You may not label it 'Expected Net Benefit.'"

  ---

  ### PART 4: APPLICATION TO CASES

  #### Case 1: Solar Geoengineering Field-Test (The "Head of Analysis" Programme)
  **Model Data (Simplified 40-cell representation):**
  *   **Scenarios 1–30 (High Prob):** Modest cooling. $p \approx 0.03$, Payoff $= +10$ units.
  *   **Scenarios 31–40 (Low Prob):** Catastrophic/Bonanza. $p$ decays as $1/n^2$, Payoff magnitude grows as $2^n$. Signs alternate (Monsoon failure [-] vs Avoided Mortality [+]).
  *   **Weighted Terms ($p_i x_i$):**
      *   Cells 1–30: Sum $\approx +300$.
      *   Cells 31–40: Terms are roughly $(-1)^n \cdot \frac{2^n}{n^2}$.
      *   Note: $\frac{2^n}{n^2}$ grows rapidly. For this to be Pasadena-like (conditionally convergent), the model must assume probability mass decays faster than payoff grows, but not fast enough for absolute convergence. Let us assume the model implies weighted terms behave like $\frac{(-1)^n}{n}$.

  **Running the Procedure:**
  1.  **ASC:** Sum of $|p_i x_i|$ for the tail cells (31–40) is dominated by the last cell. Cell 40 term $\approx 1/40$. Sum of absolute values $\approx \sum (1/n) \to \infty$ (Harmonic). On the 40-cell grid, $S_{abs} = 500$. On the 80-cell grid, refinement splits the tail, revealing more terms. $S_{abs} = 850$. **FAIL.** (Increase >10%).
  2.  **RST:**
      *   Standard Order (Index): Sum $= +150$.
      *   Sorted Descending (Positive terms first): Sum $= +4000$.
      *   Sorted Ascending (Negative terms first): Sum $= -3500$.
      *   Variance is massive. **FAIL.** (Violates Rule 4).
  3.  **Verdict:** **INADMISSIBLE.** (Conditionally Convergent).
  4.  **Action:** Issue NAI.
  5.  **Substitute:** Offer Interval $[-3.5B, +4.0B]$. Since this spans zero, the programme is **UNRANKABLE**.
  6.  **Political Note:** The Head of Analysis cannot override this without violating Rule 4. The procedure blocks the EV because the arithmetic is literally hostage to the row order in Excel.

  #### Case 2: Gene-Drive Variants (Self-Limiting vs. Self-Propagating)
  **Model Data:**
  *   **Variant A (Limiting):** Heavy tail on ecological damage (low prob, huge negative).
  *   **Variant B (Propagating):** Heavy tail on ecological damage (low prob, huge negative) + Heavy tail on eradication benefit (low prob, huge positive).
  *   **Individual EVs:** Both fail ASC and RST (Divergent/Conditional).

  **Running the Procedure:**
  1.  **Individual Assessment:** Both receive NAI.
  2.  **Comparative Assessment (Phase 3C):**
      *   Construct Difference Model: $Payoff_{diff} = Payoff_B - Payoff_A$.
      *   **Correlation Check:** The "Ecological Damage" tail is driven by the same uncertainty (off-target mutations). In the Difference Model, these terms cancel out ($Damage - Damage = 0$).
      *   **Remaining Tail:** Only the "Eradication Benefit" tail remains in Variant B.
      *   **Test on Difference:** The remaining tail is positive divergent (St. Petersburg).
  3.  **Verdict:** The *Difference* is Divergent Positive.
  4.  **Action:** Report **Incremental Expected Benefit: $+\infty$** (with St. Petersburg warning).
  5.  **Condition:** Licensed *only* because the destructive tails are correlated. If the damage mechanisms were independent, the difference would also be undefined.
  6.  **Output:** "Variant B dominates Variant A on all defined metrics, but the magnitude of advantage is undefined due to divergent upside."

  #### Case 3: Ocean-Remediation Fleet (Positive Divergent)
  **Model Data:**
  *   **Tail:** Positive only. $p_n \sim 1/n^2$, $x_n \sim n^2$. Weighted term $\sim 1$. Sum diverges linearly.
  *   **Current Template:** Reports $+\infty$.

  **Running the Procedure:**
  1.  **ASC:** Fails (Sum is infinite).
  2.  **RST:** Passes (All terms positive, order doesn't change sum, only refinement does).
  3.  **TSC:** Curve does not flatten. **FAIL.**
  4.  **Verdict:** **INADMISSIBLE** (Divergent).
  5.  **Ex-Post Regret Objection:** If we approve based on $\infty$, and the tail doesn't materialize, we look foolish.
  6.  **Procedure Fix:** **Truncated Expectation (Phase 3A).**
      *   Cut off at 99.9% probability mass.
      *   Calculate EV on the truncated model. Result: $+50B.
      *   **Report:** "Expected Net Benefit (99.9% Confidence): $50B. Note: Excluded tail contains 0.1% probability mass with unbounded potential value."
      *   **Rationale:** This protects the committee from the "Infinity Trap." If the tail fails to materialize, the decision was rational based on the 99.9% credible world. If the tail *does* materialize, the programme was an even better bargain than reported. It eliminates the risk of looking foolish for over-promising.

  ---

  ### PART 5: JUDGMENT CALLS & LIMITATIONS

  **Explicitly Marked Judgment Calls:**
  1.  **Grid Refinement Tolerance (10%):** Why 10%? Arbitrary. Chosen to match Rule 4. A 15% tolerance would pass some pathological cases.
  2.  **Truncation Point (99% vs 99.9%):** This is a risk-appetite decision, not arithmetic. The procedure forces you to *state* the cutoff, but does not *dictate* it.
  3.  **Correlation in Comparative Assessment:** Deciding whether the tails of Gene-Drive A and B are "the same" uncertainty is a modelling judgment. If you assume independence when they are correlated, you falsely declare the difference undefined.
  4.  **Choice of Utility Transform:** If using Phase 3B, choosing Log vs. Square-Root utility is a value judgment on risk aversion.

  **What This Procedure Cannot Do:**
  1.  **It cannot solve the St. Petersburg Paradox:** It cannot tell you if an infinite expectation is "really" valuable. It only forces you to truncate it to make it reportable.
  2.  **It cannot distinguish "Physical Impossibility" from "Low Probability":** The analyst must decide if the excluded tail is impossible (physics) or just unlikely (probability). The procedure treats them the same mathematically.
  3.  **It cannot fix bad models:** If the probability decay is truly power-law and payoff truly geometric, the model describes a physical impossibility (infinite energy/money). The procedure will flag it, but the modellers must fix the physics, not the math.
  4.  **Failure Mode:** It will pass a case where the series is absolutely convergent but *extremely* slow to converge. The EV is real, but the 2-day analysis window won't find the stable value. The procedure accepts this risk to meet the deadline.

  **Final Instruction:**
  When the procedure blocks a figure, do not apologize. You are not saying the programme is bad. You are saying the *ruler* is broken. Hand them the Notice of Arithmetic Indeterminacy. If they want a number, they must choose a value judgment (truncation or utility). That choice belongs to the Committee, not the Unit.
