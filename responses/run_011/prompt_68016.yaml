prompt: |-
  You're going to play a professional philosopher who actually does evolutionary game theory and behavioral ecology — someone who's read Axelrod and Maynard Smith but also the population-genetics side, and who is fluent enough in rationalist-blog-speak that I don't have to over-explain anything. Before you audit anything, brainstorm a little: for each numbered item below, give one line on what normally motivates a smart person to hold it, and only then do the consistency check. Think carefully and don't just pattern-match on the obvious stuff.

  Context: I've been reading LW / the SSC comment sections / the old Overcoming Bias archives for something like fifteen years and I've accumulated a pile of views about the prisoner's dilemma and the evolution of cooperation. Someone I know is running a session where everybody writes their position down and the group tries to break it, and I'd much rather find the cracks myself first. Here's the pile:

  1. In a genuine one-shot PD — anonymous, known to be one-shot, no repeats — you defect. Anyone who says otherwise just doesn't get dominance reasoning. That's not cynicism, it's arithmetic.

  2. Almost no real-life PD is genuinely one-shot. Audience leakage, gossip, future dealings, reputational spillover. So in practice I cooperate in essnetially all the real ones, and I think that costs me nothing in (1).

  3. I don't buy the superrationality stuff. My decision is evidence about what agents like me do, I'm running the same algorithm as everybody else in the room, I'm in their simulation and they're in mine — I think that's motivated reasoning in decision-theory drag, even when it happens to point at the answer I already like.

  4. That said, I do think the unit of evaluation is a policy or disposition, not an act. When I ask whether to defect, what I'm really asking is whether to be the sort of agent who defects in cases like this, and I settle that by asking which sort does better overall — including in cases where nobody will ever find out and nothing downstream changes.

  5. Axelrod's tournaments count for something. Tit-for-tat won, and I take the nice / retaliatory / forgiving / legible lessons as real rather than as a curiosity about one particular invite list.

  6. I also accept the folk theorem. Crank the discount factor up and almost anything is sustainable, so the iterated game by itself doesn't select for cooperation — you need population structure, noise, or actual evolutionary dynamics to do the selecting.

  7. For nonhuman cooperation I go with kin selection plus direct reciprocity, maybe indirect reciprosity and network effects. I'm with the people who think multilevel selection is at best a redescription and at worst a way of making whatever happened look inevitable after the fact.

  8. But I do find the Nowak / E. O. Wilson side of the inclusive-fitness fight convincing — that inclusive fitness is a narrow special-case tool and you're better off with the more general approach.

  9. For humans specifically I find the cultural group selection story pretty persuasive: norms, moralizing gods, parochial altruism, between-group competition sorting cultural variants. Anonymous million-scale cooperation just doesn't look explainable to me without some group-level sorting.

  10. And all of this is about how cooperation got here, not about what to do. My choices should track expected consequences, not the etiology of my intuitions about fairness.

  So: audit it. Which pairs genuinely pull against each other, and which only look like they do? Rank the real tensions by severity — I don't want a flat list where everything is equally bad — and for each one name the specific result or mechanism that generates the problem instead of just a vibe that they're hard to reconcile. Then say what I'd have to give up, what the cheapest repair is, and what that repair costs me somewhere else on the list. Finish with the single revision that buys the most overall consistency. I'm deliberately not telling you which of these I'm most attached to, so don't go easy on any of them.
