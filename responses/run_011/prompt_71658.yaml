      *   *Camp A's stance in Case 2:* This is the hardest part for Camp A. How do they deny causation in a continuous system? They must rely on the "discernibility" or "biological significance" threshold. Even if concentration rises, if the biological damage function has a noise floor or a threshold of *effect*, A argues no harm occurred. I need to make sure A's position is charitable but firm.
      *   *Camp B's stance in Case 1:* They need to argue about the *long run* probability. Even if this pallet is fixed, does this purchase increase the chance the *next* contract is larger? Or does it shift the timing of the threshold crossing?
