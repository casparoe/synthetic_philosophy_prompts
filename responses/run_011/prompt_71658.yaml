answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON CAUSAL NEGLIGIBILITY**

  **Participants:** The Inefficacy Camp (A) and The Expected-Contribution Camp (B).
  **Convener:** [Retired Laboratory Director]
  **Date:** October 26, 2023
  **Subject:** Causal and Moral Status of Individually Negligible Acts in Marine Systems

  ### 1. AGREED CLAIMS

  We, the undersigned parties, submit the following claims as the baseline of fact and theory upon which our disagreement rests. We affirm these statements jointly.

  1.  **Physical Facts of Case 1 (Quantised Ordering):** In the supermarket supply chain described, a single retail purchase of one portion of fish does not physically alter the number of fish caught in the immediate quarterly cycle. The algorithmic rounding (to nearest 500) and fixed pallet size (3000) create a buffer zone. The standing contract fixes the total throughput for the quarter regardless of marginal fluctuations in store-level demand, provided those fluctuations remain within the rounding tolerance.
  2.  **Physical Facts of Case 2 (Continuous Accumulation):** In the coolant discharge scenario, mass balance applies. A single discharge of one kilogram of coolant physically increases the total mass of contaminant in the basin. Consequently, the steady-state concentration of the contaminant in the basin is mathematically higher with the discharge than without it, however infinitesimally.
  3.  **Biological Facts:** In Case 2, biological damage to organisms is a function of concentration. While the function is continuous, the capacity of current measurement technology to detect a change in health status corresponding to a one-kilogram-induced concentration shift is non-existent. In Case 1, the number of fish caught is the primary metric of harm; in Case 2, the physiological degradation of organisms is the primary metric.
  4.  **Moral Requirement:** Any adequate moral theory must provide a consistent account of collective harm. It cannot condemn the aggregate of acts while exonerating every constituent act without a principled distinction, nor can it condemn every constituent act if the aggregate harm is illusory.
  5.  **Concession by A to B:** Camp A concedes that in Case 2, the act results in a physical change to the environment (increased concentration) that does not occur in Case 1. A further concedes that if the biological damage function has no lower threshold of sensitivity, the act physically contributes to the state of the organism.
  6.  **Concession by B to A:** Camp B concedes that in Case 1, the single purchase does not determinately alter the outcome (number of fish caught) in the specific contractual period in which the purchase occurs. B concedes that the causal chain in Case 1 is interrupted by human-designed buffers (rounding, quotas) that do not exist in Case 2.
  7.  **Probabilistic Agreement:** Both parties agree that in Case 1, there is a non-zero mathematical probability that a specific purchase could coincide with a threshold crossing *if* the rounding buffer were removed or if the timeframe were extended indefinitely. Both parties agree that in Case 2, the probability that the discharge causes a *discernible* change in a specific organism's health outcome is effectively zero given current biological noise.

  ### 2. TABLE OF RESIDUAL DISAGREEMENTS

  The following table isolates the precise points of collision. Where a disagreement turns on the definition of a term, it is marked as [Verbal]; where it turns on the structure of reality or moral obligation, it is marked as [Substantive].

  | Issue | Camp A Formulation (Inefficacy) | Camp B Formulation (Expected-Contribution) | Classification & Shared Vocabulary |
  | :--- | :--- | :--- | :--- |
  | **Causation in Case 1** | The purchase is **causally inert** regarding the catch volume. Because the algorithm absorbs the unit, the world state (fish caught) is identical with or without the act. | The purchase **modifies the risk profile** of the supply chain. It alters the probability distribution of when the next threshold is triggered, even if the immediate outcome is buffered. | **[Substantive]** regarding moral relevance of risk.<br>**[Verbal]** regarding "Cause."<br>**Shared Vocabulary:** "Determinate Outcome Change" (A) vs. "Probabilistic Influence" (B). |
  | **Harm in Case 2** | No harm occurs because the change is **biologically indiscernible**. If the organism's physiological state is functionally identical, the increment is moral noise. | Harm occurs because the **physical integrity** of the organism is compromised. The smooth damage function implies every increment degrades function, regardless of measurement capacity. | **[Substantive]** regarding the definition of harm.<br>**Shared Vocabulary:** "Functional Impairment" (A) vs. "Physical Degradation" (B). |
  | **Moral Duty** | Duty is grounded in **outcome responsibility**. If the act makes no difference to the outcome, there is no duty to refrain. | Duty is grounded in **expected utility**. If the act carries an expected disvalue (probability $\times$ magnitude), there is a duty to refrain proportional to that expectation. | **[Substantive]** regarding the source of obligation.<br>**Shared Vocabulary:** "Outcome-Based Duty" (A) vs. "Expectation-Based Duty" (B). |
  | **The Nature of Thresholds** | Thresholds (quotas, rounding) create **ontological breaks**. They sever the causal chain between micro-act and macro-harm. | Thresholds are **epistemic conveniences**. They describe human accounting systems but do not negate the underlying cumulative pressure of demand. | **[Substantive]** regarding the moral weight of institutional buffers.<br>**Shared Vocabulary:** "Causal Severance" (A) vs. "Accounting Masking" (B). |

  ### 3. THE CRUXES

  We identify three sub-questions whose settlement would necessitate a significant revision of at least one party's position.

  **Crux 1: The Moral Relevance of Descriptive Difference**
  Does the physical difference between Case 1 (quantised/buffered) and Case 2 (continuous) constitute a *moral* difference, or merely a descriptive one?
  *   *If Moral:* Camp A is vindicated in Case 1 but potentially vulnerable in Case 2.
  *   *If Descriptive:* Camp B's logic applies to both, or Camp A's logic applies to both (by treating Case 2 as effectively quantised by biological noise floors).

  **Crux 2: Duty Without Outcome Change**
  Can a non-zero expected harm ground a moral duty in instances where the act *definitively* does not alter the final outcome (e.g., a purchase that clearly falls within the rounding buffer in Case 1)?
  *   *Camp A:* No. Duty requires the possibility of outcome determination.
  *   *Camp B:* Yes. Duty attaches to the imposition of risk/expected disvalue, regardless of the realized outcome.

  **Crux 3: Quantisation as Kind vs. Degree**
  Is the quantisation in Case 1 (rounding to 500) a difference of *kind* from the continuous accumulation in Case 2, or merely a difference of *degree* (where the "step size" is simply larger)?
  *   *Camp A:* Difference of Kind. Discontinuous functions break causal chains.
  *   *Camp B:* Difference of Degree. All systems are quantised at some level (e.g., molecular); Case 1 just has a coarser grain.

  ### 4. TESTS AND ARGUMENTS

  For each Crux, we specify the method of resolution. We distinguish between empirical claims (resolvable by measurement) and non-empirical claims (resolvable by argument).

  **Regarding Crux 1 (Moral Relevance)**
  *   **Type:** Non-Empirical.
  *   **Test:** A thought experiment involving a "Smoothed Case 1." Imagine the supermarket algorithm is adjusted to round to the nearest *one* portion, but the processor still operates on fixed quarterly quotas.
  *   **Decisive Argument:** Camp A must demonstrate why a rounding buffer of 500 creates a moral shield that a rounding buffer of 1 does not. Camp B must demonstrate why the existence of a quota (a hard cap) does not negate the expected contribution argument even in a continuous system.
  *   **Refutation Condition:** Camp A states in advance that if it can be shown that the *timing* of a quota renewal is advanced by even one day due to aggregate marginal purchases, they will concede a causal link in Case 1. Camp B states in advance that if it can be shown that the biological damage function has a hard threshold below which *no* physiological change occurs, they will concede no harm in Case 2.

  **Regarding Crux 2 (Duty Without Outcome Change)**
  *   **Type:** Non-Empirical.
  *   **Test:** The "Two Buyers" Scenario. Two identical agents face Case 1. Agent X buys; Agent Y does not. The total order remains identical.
  *   **Decisive Argument:** Camp B must justify why Agent X is morally distinct from Agent Y if the world state is identical. Camp A must justify why the *collection* of Agents is blameworthy if no individual member is.
  *   **Refutation Condition:** Camp B accepts that if the concept of "Expected Harm" leads to a prohibition on acts that are demonstrably harmless in every possible world (not just the actual one), their theory is flawed. Camp A accepts that if their theory implies that a group can be guilty of harm while no member contributed to it, their theory is flawed.

  **Regarding Crux 3 (Quantisation: Kind vs. Degree)**
  *   **Type:** Empirical (Supply Chain Analysis).
  *   **Quantity to Measure:** The "Trigger Variance." We propose measuring the variance in the processor's quarterly orders over a 10-year period against the variance in retail sales.
  *   **Camp A Prediction:** The correlation between marginal retail fluctuations and quarterly order volume will be zero within the buffer zone. The system behaves as a step function.
  *   **Camp B Prediction:** Over a 10-year horizon, the cumulative effect of retail fluctuations will shift the timing of contract renewals. The "step" is not a wall but a delay mechanism. The correlation will be non-zero over time.
  *   **Resolution:** If the data shows that retail demand fluctuations *never* alter the total catch over the long term (due to hard quotas/capacity limits), Camp A wins on Case 1. If the data shows that demand fluctuations shift the *timing* of catch (bringing future catch forward), Camp B wins on Case 1 (harm is hastened, not added).

  ### 5. TRANSFERABILITY TO STANDARD INSTANCES

  We conclude by assessing whether the agreed claims and cruxes transfer to Greenhouse Gas (GHG) emissions and Voting.

  **Greenhouse Gas Emissions**
  *   **Transfer Status:** Partial.
  *   **Alignment:** GHG emissions resemble **Case 2 (Continuous Accumulation)**. There is no rounding algorithm; one tonne of CO2 physically adds to atmospheric concentration. The damage function (climate sensitivity) is generally treated as continuous.
  *   **Failure Point:** The climate system contains **tipping points** (e.g., ice sheet collapse, permafrost thaw). These introduce **Case 1 (Quantised)** dynamics into a Case 2 system. If a specific emission pushes the system across a tipping point, Camp B's expected harm calculation spikes. If the system is far from a tipping point, Camp A's "no discernible difference" argument gains traction regarding specific weather events. The collaboration agrees that GHG is a hybrid case: continuous accumulation with discontinuous thresholds.

  **Voting in a Large Election**
  *   **Transfer Status:** High.
  *   **Alignment:** Voting resembles **Case 1 (Quantised Ordering)** perfectly. It is a threshold system with a massive buffer (the margin of victory). One ballot is rounded to zero in the count unless the margin is exactly one.
  *   **Failure Point:** Unlike the fish supply chain, the "quota" (the election result) is not fixed in advance by contract. However, the probability of a single vote being the pivot is orders of magnitude lower than the probability of a fish purchase triggering a reorder.
  *   **Conclusion:** If Camp A's logic holds for Case 1 (buffers negate causation), it holds strongly for Voting. If Camp B's logic holds for Case 1 (expected contribution via pivot probability), it holds for Voting, but the expected value is so low it may not ground a *strong* duty, only a *weak* one. The collaboration identifies the "pivot probability" in voting as the empirical equivalent of the "Trigger Variance" in the fish supply chain.

  ***

  **Signed,**

  **Representative, Inefficacy Camp (A)**
  **Representative, Expected-Contribution Camp (B)**
