answer: |-
  Here is the specification sheet you asked for. The core problem you've identified is correct: the debate is usually stalled because "computer" is being used as an ontological claim by one side and a metaphorical claim by the other. To make "The Brain is a Computer" a theory rather than a slogan, it must commit to specific mechanical and functional claims that can be falsified.

  ### The Spec Sheet: Desiderata for the Computational Theory of Mind (CTM)

  For the claim "The brain is a computer" to hold as a rigorous theory, it must satisfy the following constraints. I have marked them as **Non-Negotiable** (if the theory fails these, it is not a computational theory) or **Contingent** (these are often demanded by specific camps but are not strictly required by the definition of computation).

  **1. Substrate Independence (Multiple Realizability)**
  *   **The Requirement:** The computational description of the system must remain valid even if the physical medium changes, provided the causal organization is preserved.
  *   **The Reason:** Computation is defined by formal relations (syntax), not physical stuff. If the theory depends on the specific chemistry of the neuron rather than the pattern of firing, it is a *biological* theory, not a *computational* one.
  *   **Status:** **Non-Negotiable.** Without this, "computation" collapses into "physics."

  **2. Causal Efficacy of Syntax**
  *   **The Requirement:** The physical states of the brain must drive behavior *because* they instantiate computational states, not just because of their raw physical properties.
  *   **The Reason:** In a computer, a voltage high/low matters because it represents a 1/0. If the brain works only because of electrochemical gradients regardless of what they "represent," then computation is just an epiphenomenal description, not an explanation.
  *   **Status:** **Non-Negotiable.** This distinguishes real computation from mere simulation.

  **3. Plasticity vs. Fixed Architecture**
  *   **The Requirement:** The theory must explain how a stable computational architecture persists despite the brain's physical hardware constantly changing (neurogenesis, synaptic turnover, rewiring).
  *   **The Reason:** Standard computers crash if you swap a logic gate while running. Brains learn by physically altering the "circuitry." A computational theory must define what the "program" is if the "hardware" is fluid.
  *   **Status:** **Non-Negotiable.** If the theory cannot account for learning without positing a homunculus rewriting the code, it fails.

  **4. The Semantic Grounding Problem**
  *   **The Requirement:** The theory must account for how internal symbols acquire meaning about the external world without an external interpreter.
  *   **The Reason:** Computers manipulate symbols based on shape, not meaning. Brains act based on meaning (food, danger). If the brain is a computer, it must solve how syntax becomes semantics internally.
  *   **Status:** **Contingent.** Classical computationalism cares deeply about this; connectionist models often bypass it by denying internal symbols exist.

  **5. The Mechanism Constraint (Clinical Purchase)**
  *   **The Requirement:** The theory must be able to map computational failure modes to specific physiological interventions (e.g., anesthesia, seizures, lesions).
  *   **The Reason:** If the brain is a computer, turning it off (anesthesia) should look like halting a process, not dissolving the hardware. If a seizure is a "computational error," it must be describable algorithmically, not just electrically.
  *   **Status:** **Contingent (but high value).** Pure philosophical computationalism often ignores this. However, for a theory claiming to describe the *brain* (a biological organ), failing this suggests the theory is describing an abstraction, not the organ.

  **6. Phenomenal Consciousness (Qualia)**
  *   **The Requirement:** The theory must explain why information processing feels like something from the inside.
  *   **The Reason:** Computers process data without feeling. Brains do.
  *   **Status:** **Contingent.** This is the "Hard Problem." Many computationalists argue this is a separate issue. Demanding this of the "Brain-as-Computer" claim often smuggles in the "Mind-Body Problem," which may be a distinct debate.

  ---

  ### Evaluation of Your "Swap Test"

  **Your Criterion:** *Something is only a computer if you can swap the program while keeping the hardware. Since you can't lift arithmetic out of one brain and drop it into a different one, the brain fails.*

  **Verdict:** This is a **legitimate criterion for Classical Computationalism**, but it is **question-begging against Connectionism.**

  *   **Why it's legit:** It tests **Substrate Independence (Desideratum #1)**. In a Von Neumann architecture, software is distinct from hardware. If the brain is a classical computer, memories and skills (programs) should be theoretically transferable between identical hardware structures. The fact that you cannot "upload" your arithmetic skills to another brain suggests the "software" is woven into the specific physical weights of the synapses.
  *   **Why it's prejudicial:** It assumes a "stored-program" architecture. Modern machine learning (neural nets) does not separate program and hardware; the "program" *is* the hardware configuration (weights). If you define "computer" broadly enough to include connectionist networks, your swap test fails because those computers *also* don't allow program swapping without retraining.
  *   **How to use it:** Don't use it to prove the brain *isn't* a computer. Use it to prove the brain isn't a **Classical (Von Neumann) Computer.** It forces the pro-computer side to admit they are arguing for a different kind of computer (wetware/connectionist), which changes the definition of computation significantly.

  ### Evaluation of the "Anesthesiologist Constraint"

  **Your Criterion:** *The theory must explain why propofol turns the system off and seizures make it haywire.*

  **Verdict:** This is **too strong for philosophical computationalism, but necessary for neuroscientific computationalism.**

  *   **Why it might be too strong:** A computational theory is often an *algorithmic level* description (Marr's Level 2). Anesthesia works at the *implementational level* (Marr's Level 3). A theorist could argue, "I am describing the logic, not the electricity. Of course chemistry affects the electricity."
  *   **Why you should keep it:** This is your strongest leverage. If the brain is *nothing but* a computer, then chemical interventions should only matter insofar as they damage the hardware. But propofol doesn't damage hardware; it changes the *state* of consciousness without changing the "logic gates" permanently. If the computational theory cannot explain why a specific molecule (propofol) halts the "computation" of consciousness while leaving other computations (autonomic function) running, it suggests that **computation is not the primary causal mechanism.**
  *   **Strategic Advice:** Frame this not as a demand for a medical explanation, but as a demand for **Causal Closure.** If chemistry can toggle the "computer" on and off independently of the information processing load, then chemistry is causally primary, and computation is secondary.

  ---

  ### The Killer Requirement & The Incompatibility Thesis

  **The Single Requirement That Knocks Out the Most Answers:**
  **Substrate Independence (Desideratum #1).**

  *   **Why:** This is the fault line.
      *   **Classical AI** satisfies this but fails Neuroscience (brains aren't silicon, they rewire).
      *   **Neural Network models** satisfy Neuroscience but fail Substrate Independence (the "program" is the physical weights; you can't separate them).
      *   **Biological Naturalism** rejects this entirely (causality is biological, not formal).

  **The Incompatibility Thesis (Your Paper's Core Finding):**
  You can build your paper around the claim that **the debate is broken because the two necessary conditions for the theory are mutually exclusive.**

  To be a robust theory of the *brain*, the model must be **Biologically Specific** (accounting for neurotransmitters, plasticity, anesthesia).
  To be a robust theory of *computation*, the model must be **Substrate Independent** (abstractable from the physics).

  **You cannot satisfy both.**
  If you make the model specific enough to explain propofol and seizures, it ceases to be a general computational theory and becomes a biochemical one. If you make it abstract enough to be a computational theory, it loses the power to explain why specific chemicals turn it off.

  This means the claim "The Brain is a Computer" is either:
  1.  **True but Trivial:** It's a computer in the sense that *any* physical system follows laws (pancomputationalism).
  2.  **Specific but False:** It's a specific kind of computer, but the biology contradicts the architecture (e.g., no distinct CPU/Memory).
  3.  **Useful but Ontologically Empty:** It's a metaphor that helps us model behavior but doesn't describe what the brain *is*.

  ### Contender Scorecard

  **Classical Computationalism (GOFAI / Turing Machine)**
  *   **Pros:** Clear definition of syntax; satisfies Substrate Independence.
  *   **Cons:** Fails Plasticity (hardware is fixed); Fails Anesthesia Constraint (can't explain chemical state changes); Fails Swap Test (brain doesn't store programs separately).
  *   **Verdict:** Dead as a biological theory; survives only as a logic model.

  **Connectionism (Neural Networks)**
  *   **Pros:** Handles Plasticity well; matches neuroanatomy better.
  *   **Cons:** Fails Substrate Independence (weights are physical); Struggles with Semantics (how do nodes mean anything?); Weak on Anesthesia (why do chemicals stop the math?).
  *   **Verdict:** The current dominant model, but relies on "computation" being redefined to mean "physical dynamics."

  **Biological Naturalism (Searle-esque)**
  *   **Pros:** Satisfies Anesthesia Constraint (causality is biological); Satisfies Phenomenal Consciousness.
  *   **Cons:** Rejects the core claim (Brain is *not* a computer); Offers no alternative computational framework.
  *   **Verdict:** Wins on biology, forfeits the computational claim entirely.

  **Predictive Processing (Bayesian Brain)**
  *   **Pros:** Attempts to bridge algorithm and biology; handles learning well.
  *   **Cons:** Still struggles with the "hardware" question (is the probability physical or descriptive?); often sidesteps the Anesthesia Constraint.
  *   **Verdict:** The most promising current attempt, but risks being a mathematical description rather than a mechanical explanation.

  ### Final Recommendation
  Your paper should not argue "Yes" or "No." It should argue that **the criteria for "Computer" and the criteria for "Brain" are currently defined in ways that make them incompatible.** Use the Anesthesia Constraint to show that biological causality cannot be reduced to logical states without losing explanatory power. Use the Swap Test to show that neural computation cannot be abstracted from its wetware without becoming a metaphor. The finding is that the debate persists only because participants switch between these definitions depending on which objection they are facing.
