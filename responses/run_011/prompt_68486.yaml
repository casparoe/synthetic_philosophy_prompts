prompt: |-
  so for my senior seminar I have to write a paper on whether the brain is a computer, and every source I've managed to get my hands on either says obviously yes (neurons fire or don't, that's basically logic gates) or obviously no (it's wet, it has feelings, the chinese room, whatever). and the annoying thing is I dont think they're even arguing about the same claim. so before I pick a side I want the spec. what does the brain-is-a-computer claim actually have to deliver to be a theory instead of a slogan? give me the full list of desiderata — the phenomena it has to account for, the specific cases it has to get right, the distinctions it's not allowed to collapse, the results from neuroscience it can't contradict — with the reason behind each one, not just its name. and mark which of them are genuinely non-negotiable and which are just what one camp happens to care about (like, is "it has to explain why there's something it's like to be a brain" a real requirement on the computer claim, or is that a requirement from a completely different debate getting smuggled in?).

  couple things I want you to deal with specifically. one, I sort of invented my own test and I want to know if it's any good or if I'm just defining my way to an answer: I said something is only a computer if you can swap the program while keeping the hardware, and since you can't lift the arithmetic out of one brain and drop it into a different one, the brain fails. is that a legit criterion or a prejudice? two, I think whatever the right answer is, it should tell an anesthesiologist something — it should have some purchase on why the thing goes offline under propofol and comes back intact, and why it goes haywire in a seizure. if a candidate answer can't say anything there I want that counted against it, but tell me if you think that's too strong a demand and why.

  then tell me which single requirement knocks out the most popular answers, and whether some subset of them just can't all be satisfied at once — because if they can't, that's the finding I want to build the whole paper around, it'd mean the debate is broken rather than unsettled. at the very end give me a line or two each on how the main contenders do against the list, but keep that short, the list is the point. no bibliography or reading list pls, our library is a joke and I can't get to most of it anyway — name the views if you want but explain them in your own words.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Is the brain a computer? (Senior Seminar Paper)
      *   **Problem:** Existing sources are polarized (obviously yes vs. obviously no) and talking past each other.
      *   **Goal:** Define the *specifications* (desiderata) for the "Brain-as-Computer" claim to be a viable theory rather than a slogan.
      *   **Specific Requirements:**
          *   List phenomena to account for, cases to get right, distinctions to maintain, neuroscience results not to contradict.
          *   Provide reasons for each desideratum.
          *   Distinguish between *non-negotiable* (theoretical core) and *contingent* (camp-specific, e.g., consciousness).
          *   Evaluate the user's "Program/Hardware Swap" test.
          *   Evaluate the "Anesthesiologist/Seizure" constraint (clinical purchase).
          *   Identify the single requirement that knocks out the most popular answers.
          *   Identify if requirements are mutually incompatible (the "debate is broken" angle).
          *   Brief assessment of main contenders against the list.
          *   No bibliography/reading list.
      *   **Tone:** Rigorous, analytical, philosophical but grounded in neuroscience/cognitive science, helpful for a senior seminar.

  2.  **Deconstruct the "Brain-as-Computer" Claim:**
      *   What does "computer" mean here? Turing machine? Von Neumann? Connectionist network? Analog computer?
      *   What does "brain" mean here? Neurons? Cognitive architecture? Phenomenal experience?
      *   The core tension is usually between *computation as formal symbol manipulation* vs. *computation as physical causal process*.

  3.  **Drafting the Desiderata (The Spec Sheet):**
      *   *Need to cover:* Implementation independence, syntax/semantics, causality, learning/plasticity, consciousness (maybe), clinical relevance.
      *   *Constraint:* Must distinguish non-negotiable from contingent.
      *   *Item 1: Implementation Independence (The Hardware/Software Distinction).* Crucial for classical computationalism. If the brain is a computer, the *computation* shouldn't depend entirely on the specific wetware.
      *   *Item 2: Causal Efficacy of Syntax.* The physical state must drive behavior *because* of its computational role, not just its physics. (Haugeland/Searle issue).
      *   *Item 3: Plasticity vs. Fixed Architecture.* Computers have fixed logic gates; brains rewire. A theory must explain how computation happens on shifting hardware.
      *   *Item 4: Semantic Grounding.* Computers manipulate symbols; brains interact with the world. How does meaning get in?
      *   *Item 5: Clinical/Physiological Constraints (The User's Anesthesia Point).* This is a strong demand. Does the theory explain *state changes*?
      *   *Item 6: Consciousness/Qualia.* Is this required? Probably contingent. Classical comp sci doesn't care about feelings.

  4.  **Evaluating the User's "Swap Test":**
      *   *User's Claim:* Computer = swappable program/hardware. Brain = not swappable. Therefore Brain != Computer.
      *   *Analysis:* This is the "Multiple Realizability" argument. It's a standard objection to *Classical* Computationalism (GOFAI). However, connectionist models or "wetware" computing might not require this. It's a strong criterion for *Von Neumann* architectures, but maybe too narrow for "computation" broadly defined. It risks defining "computer" as "PC" rather than "information processing system."
      *   *Verdict:* It's a legitimate criterion for *Classical* Computationalism, but potentially question-begging against *Neural* Computationalism. It highlights the "Implementation Independence" desideratum.

  5.  **Evaluating the "Anesthesiologist" Constraint:**
      *   *User's Claim:* Theory must explain propofol/seizures.
      *   *Analysis:* This is demanding *mechanistic* explanation, not just functional. A pure abstract computational theory might fail here. But a theory claiming to be about the *brain* (biological organ) should arguably account for its biological failure modes.
      *   *Verdict:* It's a strong demand, perhaps too strong for *philosophical* computationalism, but necessary for *neuroscientific* computationalism. If the paper is in a seminar (likely Philosophy or CogSci), this is a great angle to expose the gap between abstract theory and biological reality. I should validate this as a high-value constraint.

  6.  **Identifying the "Killer" Requirement:**
      *   What kills the most theories?
      *   *Candidate 1:* Consciousness (Qualia). Kills physicalist/computationalist accounts, but maybe that's a different debate.
      *   *Candidate 2:* Implementation Independence. Kills connectionism/neuro-accounts.
      *   *Candidate 3:* Causal Efficacy. Kills semantic accounts (Searle).
      *   *Selection:* **Implementation Independence vs. Biological Specificity.** The requirement that "The computation must be identifiable independently of the specific physical substrate" is the biggest wedge. Classical comp says yes, Neuroscience says no (neurotransmitters matter, not just spikes). This creates the incompatibility.

  7.  **Checking for Incompatibility (The "Broken Debate" Angle):**
      *   Can we have Implementation Independence *and* Biological Specificity? No.
      *   Can we have Abstract Computation *and* Clinical/Chemical Explanation? Hard to reconcile. If consciousness is computation, why does chemistry (propofol) stop it without changing the "logic"?
      *   *Thesis:* The debate is broken because "Computation" is being used to mean two incompatible things: (1) Abstract logical structure (requires independence) and (2) Physical causal process (requires dependence).

  8.  **Drafting the Contender Assessments:**
      *   *Classical Computationalism (GOFAI):* Fails plasticity/chemistry.
      *   *Connectionism (Neural Nets):* Fails strict syntax/semantics, passes plasticity.
      *   *Biological Naturalism (Searle-esque):* Rejects computation entirely based on causality.
      *   *Predictive Processing:* Tries to bridge, but struggles with the "hardware" question.

  9.  **Refining the Output:**
      *   Ensure the tone is academic but direct.
      *   Make sure the "Non-negotiable" vs. "Contingent" tags are clear.
      *   Address the User's Test and Anesthesia point explicitly.
      *   Ensure the "Killer Requirement" is highlighted.
      *   Keep the contender section brief.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* for each desideratum? Yes.
      *   *Check:* Did I address the "swap test"? Yes, need to be careful not to dismiss it but contextualize it.
      *   *Check:* Is the anesthesia point too strong? I need to argue *why* it might be too strong for a philosophical claim but necessary for a scientific one. I'll frame it as the "Mechanism Constraint."
      *   *Check:* Is the "Broken Debate" conclusion supported? Yes, the tension between substrate independence and substrate specificity is the key.

  11. **Final Polish:** Check against constraints (no bibliography, specific sections). Ensure the distinction between "Computer as metaphor" and "Computer as ontology" is clear. (Proceed to generate output).

  *(Self-Correction on the "Swap Test")*: I need to be precise. The user says "you can't lift arithmetic out of one brain." Actually, you *can* teach two brains the same arithmetic. But you can't swap the *memory state* easily. I need to clarify that the test is about *state transferability*, not *capability*.
  *(Self-Correction on Anesthesia)*: Propofol affects GABA receptors. A purely computational model ignores receptors. This is the "Chemical vs. Logical" gap. This is a very strong point for the paper.

  *(Final Plan)*:
  1. Intro: Acknowledge the category error in current literature.
  2. The Spec Sheet (Desiderata with reasons and tags).
  3. Evaluation of User's "Swap Test".
  4. Evaluation of "Anesthesia Constraint".
  5. The "Killer" Requirement & The Incompatibility Thesis.
  6. Brief Contender Scorecard.
  7. Closing advice.

