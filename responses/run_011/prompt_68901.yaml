  # The Standoff Diagnostic Instrument

  **Start Node:** Two roughly rational people (you and Sam). Same question. Know you disagree. Same access to trade. Neither updates. Neither trades.

  *   **Node 1:** If the bet paid zero dollars but reduced your personal financial risk (e.g., hedging your job exposure), would you take it?
      *   *(Test for Endowment Effects / Risk Sharing)*
      *   **Yes** → **Leaf: Endowment/Hedging** (The argument was about risk exposure, not truth.)
      *   **No** → Go to Node 2.

  *   **Node 2:** Would you take the bet even if you knew for a fact you had no informational edge over Sam?
      *   *(Test for Noise / Compulsive Trading)*
      *   **Yes** → **Leaf: Noise-Trader** (The trade is driven by utility of gambling, not information.)
      *   **No** → Go to Node 3.

  *   **Node 3:** If you were born with Sam's life history and genetics, would you hold Sam's view?
      *   *(Test for Common Priors)*
      *   **No** → **Leaf: Dispersed-Knowledge / Price-as-Signal** (Disagreement is fundamental; markets pool diverse views, not objective truth.)
      *   **Yes** → Go to Node 4.

  *   **Node 4:** Do you possess specific data that Sam explicitly does not have access to?
      *   *(Test for Private Information Asymmetry)*
      *   **No** → **Leaf: Agreement-Theorem** (With no private info and common priors, disagreement is impossible; you should converge immediately.)
      *   **Yes** → Go to Node 5.

  *   **Node 5:** If you whispered your exact probability estimate to Sam, would you expect them to whisper theirs back?
      *   *(Test for Strategic Communication / Common Knowledge of Beliefs)*
      *   **No** → **Leaf: Common-Knowledge-Fails** (We know, but we don't know that we know; communication is blocked.)
      *   **Yes** → Go to Node 6.

  *   **Node 6:** If you heard Sam's number, would you actually move your own estimate?
      *   *(Test for Rationality / Bayesian Updating)*
      *   **No** → **Leaf: Common-Knowledge-Fails** (You suspect Sam isn't rational or isn't playing the same game.)
      *   **Yes** → Go to Node 7.

  *   **Node 7:** Does the mere fact that Sam *offered* you the bet make you suspect they know something you don't?
      *   *(Test for Adverse Selection / No-Trade Theorems)*
      *   **Yes** → **Leaf: No-Speculative-Trade** (The offer itself leaks information that kills the trade.)
      *   **No** → Go to Node 8.

  *   **Node 8:** Does the current market price reflect all the private information held by people like you and Sam?
      *   *(Test for Price Informativeness / Rational Expectations)*
      *   **No** → **Leaf: Dispersed-Knowledge / Price-as-Signal** (Prices are partial signals; knowledge remains fragmented.)
      *   **Yes** → Go to Node 9.

  *   **Node 9:** If the market price perfectly reflected all truth, would you stop researching the asset?
      *   *(Test for Grossman-Stiglitz Paradox)*
      *   **Yes** → **Leaf: Prices-Can't-Be-Fully-Informative** (Perfect prices destroy the incentive to produce information.)
      *   **No** → **Leaf: Dispersed-Knowledge / Price-as-Signal** (Prices aggregate knowledge without destroying the incentive to find it.)

  ***

  ### 1. Logically Available but Empty Cells

  *   **Common Priors + Perfect Prices + Research Incentive Intact:** This cell (Node 3: Yes → Node 8: Yes → Node 9: No) is theoretically populated by the "Dispersed Knowledge" leaf, but it is **unattractive/unstable**. If prices are perfect (Node 8: Yes), it is logically difficult to maintain a research incentive (Node 9: No) without assuming some external reward for research unrelated to trading profit. Most models suggest this equilibrium collapses into the Grossman-Stiglitz paradox (Leaf: Prices-Can't-Be-Fully-Informative).
  *   **Different Priors + Agreement Theorem:** This cell (Node 3: No → Leaf: Agreement-Theorem) is **incoherent**. The Agreement Theorem mathematically requires a Common Prior. If you answer "No" to Node 3, you have logically disqualified yourself from the Agreement Theorem leaf.
  *   **No Private Info + No-Speculative-Trade:** This cell (Node 4: No → Leaf: No-Speculative-Trade) is **empty**. The No-Speculative-Trade theorem relies on information asymmetry (Node 4: Yes) to generate the adverse selection that kills the trade. If there is no private info, there is nothing to leak, and the trade fails for Agreement Theorem reasons instead.

  ### 2. Indistinguishable Leaves

  *   **Dispersed-Knowledge / Price-as-Signal (via Node 3) vs. Dispersed-Knowledge / Price-as-Signal (via Node 9):** The tree routes two distinct logical paths to the same leaf. One path says markets pool knowledge because we *start* different (Different Priors). The other says markets pool knowledge because prices *aggregate* private info without becoming perfect (Efficient Markets). While the tree treats them as the same "Position," they are mechanistically different: one denies objective convergence is possible, the other claims convergence is asymptotic. Your questions cannot separate these because both result in "Prices signal knowledge but don't settle the argument."
  *   **Common-Knowledge-Fails (via Node 5) vs. Common-Knowledge-Fails (via Node 6):** One path blames the *communication channel* (we won't share numbers), the other blames the *processing engine* (I won't update even if you share). In a real-world argument, these look identical: the disagreement persists. Without introspective honesty at Node 5 and 6, the observable outcome is the same.

