prompt: |-
  ok so last night me and my friend Sam got into an almost four hour arguement about whether we're in an AI bubble. Both of us had "done research," by which I mean we'd both read conflicting stuff and felt smug about it. Neither of us budged a milimeter. And here's the part that's been bugging me all day: neither of us bet on it. We both had our phones out, there's at least one prediction market where you could have taken the other side in about four clicks, and not once did either of us say "fine, fifty bucks, you're wrong." We just argued and went home.

  This morning Sam texted me "well, Aumann, obviously" like that closes the case, and I realised I cant actually tell you which side of it I'm on. So I want to build myself something that settles it.

  Can you write me a decision tree / sorting instrument that takes someone from a concrete situation to a named position on why roughly-rational people trade at all, why prices move, and whether markets know anything?

  Start node, fixed: two people who each count as roughly rational, who have both looked into the same question, who both know that they disagree, who both have access to the same trade at the same price, and where neither one updates and neither one trades.

  Then build the branches out of the logical space, not out of a list of famous economists. Every node has to be a question I could answer honestly without knowing which way it leads — no node should be phrased like "do you accept the agreement theorem?" Things I want on there somewhere (reorder, merge, split, or add as you see fit):

  - whether the two of us could plausibly be described as having started from the same prior, and whether that assumption is doing real work or is just a modelling convenience everybody pretends is neutral
  - whether the thing that fails in a real argument is common knowledge of each other's beliefs, common knowledge that we're both rational, or the common prior itself — I always mush those three together and I want the tree to pry them apart
  - whether a trade that got offered would even be believed, or whether offering it is self-defeating because the offer leaks what you think before anyone accepts
  - whether the disagreement is stable, i.e. whether just announcing our numbers at each other in sequence would force us to converge, and whether that trick still works with three or more people in the room instead of two
  - whether what's happening between us is speculative (a bet on who's right about the world), hedging/liquidity (we just want different things at different times and no belief is actually in dispute), or noise (one of us is trading for reasons that have nothing to do with information)
  - whether a price moving at all tells you someone out there knows something, given the worry that a price which perfectly reflected everything known couldn't be an equilibrium, because then nobody could afford to find anything out
  - whether the market is best read as a machine for pooling knowledge that nobody holds whole, or as a casino with a very good accounting department

  Leaves I want to end up at, at minimum: the agreement-theorem position (if you really knew what I believed, you'd believe it too); the no-speculative-trade position; the common-knowledge-fails position (we know, we know that we know, but it doesn't go all the way down); the dispersed-knowledge / price-as-signal position; the position that says prices can't be fully informative so there's a built-in floor on how much the market can know; the noise-trader position; and the deflationary one that says our argument was never about beliefs at all, it was about endowments, time horizons and tax situations. If you think two of those are really one leaf wearing two hats, say so out loud instead of quietly merging them.

  Two things I want after the tree:

  1. A short list of cells in the space that are logically available but empty — someone who denies the common prior AND thinks markets are near-perfect information aggregators, that kind of combination. For each, tell me whether it's empty because the view is incoherent, because it's just unattractive, or because nobody's got around to it.
  2. Flag any pair of leaves that my questions can't actually separate — positions that come apart only in how their holders describe themselves. Don't paper over those with a tiebreaker node that pretends to work.

  Audience is me plus about five other people in a reading group, half of whom have never seen a probability tree and one of whom is a real economist who will be insufferable if I get a distinction wrong. So plain English at every node, with the formal bit tucked in parentheses after it only if it's needed. Ten to fourteen nodes total, markdown, indented tree, plus a one-line key at the end mapping each leaf to the answer pattern that lands you there.

  I'm doing this on a train with no signal and won't be able to look anything up for the rest of the day, so make the thing stand alone — no reading list at the end, just the instrument.
