  4. Is what you're defending essentially evidential decision theory inside a symmetric game that just has a more evocative name? If the only distinction is assuming correlation where causal theorists see independence, isn't this merely EDT restricted to cases where the symmetry makes the evidence strongest?

  5. What observable outcome would count as evidence against your view, and if nothing can, does that suggest my professor is a fraud rather than a saint? If you cannot specify a scenario where superrationality yields worse outcomes than causal decision theory, aren't you protecting the theory from falsification rather than describing rationality?
