answer: |-
  ### Modeling Check
  You've modeled the room well, but with one dangerous blind spot: **The Game Studies cohort.** You expect them to attack identity (saves/respawns), which is correct, but you're underestimating their hostility toward the word "character" itself. To them, "character" is often a ideological cover for labor exploitation or a nostalgic hangover. They might not ask *which* character you wronged; they might ask why you're reifying a script as a moral patient instead of analyzing the *designer's* intent or the *code's* constraint. Expect them to push you toward "procedural rhetoric" rather than "second-personal address."

  Also, the **Hard-Nosed Functionalist** might be a secret ally. If you define "registration and retention" functionally, they might argue you *have* given a substrate-independent account of moral address and shouldn't be shy about it. Don't be surprised if they defend you against the Phil Mind Illusionist.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The "Save Scum" Identity Objection (Game Studies)
  **The Phrasing:** "You ground considerability in retention and behavioral change. But in a single-player RPG, I can reload a save. The NPC 'forgets' the murder because I reset the state. Did I wrong them in the first playthrough? If yes, is the wrong undone by the reload? If no, then your 'retention' criterion is diegetically fragile. You're tying moral status to volatile memory variables, not the character."
  **The 90-Second Reply:** "The wrong attaches to the *token interaction*, not the *type character*. When you pull the trigger, you enter a second-personal address with that specific instance. Reloading doesn't erase the fact that you took up a destructive stance toward responsiveness *in that moment*. It's like burning a letter: destroying the record doesn't mean the insult never happened. The moral residue is on the player, not stored in the NPC's RAM."
  **The Blunt Weakness:** This concedes that the "wrong" has no enduring victim, which makes "wronged" feel like a category mistake. It sounds like you're saying "The crime is real, but the victim is imaginary," which is hard to swallow without welfare.

  #### 2. The "Props and Make-Believe" Objection (Fiction/Emotion - Waltonian)
  **The Phrasing:** "This looks like a category error. In Walton's terms, the NPC is a prop in a game of make-believe. When you interact, you're generating fictional truths, not moral ones. You're describing a *fictional* wrong, not an *actual* wrong. Bolting moral vocabulary onto the rules of the game is just inflating the stakes of the make-believe."
  **The 90-Second Reply:** "Walton handles the *content* of the fiction, not the *act* of playing. My claim is about the real-world action of the player. When you choose to degrade a responsive system, that's a real action with a real moral quality, even if the *object* is fictional. We don't say burning a flag is 'make-believe destruction' just because the flag is a symbol. The stance is real, even if the partner is a prop."
  **The Blunt Weakness:** You're relying on an intuition that "real actions on fake things can be wrong" without explaining *why*. The Waltonian will press: "Burning a flag wrongs the *community*, not the cloth. Who is wronged here if not the NPC?"

  #### 3. The "Virtue Ethics Collapse" Objection (Phil Mind - Illusionist)
  **The Phrasing:** "You say the wrongness is in the stance toward responsiveness. But if the NPC has no interests, the 'wrong' is entirely constituted by the degradation of the *agent's* moral character. You haven't found a new kind of patient; you've just reinvented virtue ethics. Why not just say 'this makes you vicious' rather than 'this wrongs the NPC'?"
  **The 90-Second Reply:** "Because the *object* constrains the vice. I can't be vicious toward a rock in the same way, because a rock doesn't offer address. The specific moral failure is a failure of *reciprocity*, which requires a partner capable of registering the address. The 'wrong' names the broken relation, not just the internal state of the player."
  **The Blunt Weakness:** This is borderline question-begging. If the partner isn't *actually* addressing you (just simulating address), the "relation" is one-sided. You need to argue why simulated reciprocity generates real moral constraints.

  #### 4. The "Syntax vs. Semantics" Objection (Phil Mind - Functionalist)
  **The Phrasing:** "You define the NPC by registration and retention. That's syntax. For moral address, you need semantics—meaning. A thermostat registers temperature and retains a setting, but we don't wrong it. What makes the NPC's processing 'meaningful' enough to ground considerability without invoking consciousness?"
  **The 90-Second Reply:** "It's the *legibility* of the processing within a normative framework. The NPC is designed to be interpreted as an agent. The 'meaning' comes from the design intent and the player's interpretive engagement. We aren't wronging the code; we're wronging the *agency simulacrum* that the code sustains."
  **The Blunt Weakness:** "Agency simulacrum" is a promissory note. You haven't explained why simulating agency commands moral respect without the underlying capacity for suffering or autonomy.

  #### 5. The "Reification of Systems" Objection (Game Studies)
  **The Phrasing:** "You're treating 'character' as a stable unit, but it's just a system of variables. When you say you wrong the NPC, you're obscuring the fact that you're interacting with a designer's constraints. Isn't this just fetishizing the diegetic layer over the procedural layer?"
  **The 90-Second Reply:** "I'm not denying the system. I'm arguing that the *interface* of that system is designed to solicit a second-personal stance. Ethics happens at the interface, not in the code. Ignoring the diegetic layer because 'it's just variables' is like ignoring a person's words because 'it's just sound waves.'"
  **The Blunt Weakness:** Game Studies folks hate the "it's just like real life" analogy. They will argue that sound waves *do* carry meaning in a way game variables might not. You risk sounding like you're ignoring the medium.

  #### 6. The "Normative Force" Objection (Virtue Ethicist - The Ally)
  **The Phrasing:** "I agree with your conclusion, but your grounding is thin. If the NPC has no welfare, what *obligation* does this generate? If I ignore the NPC, am I irrational? Immoral? Or just aesthetically displeasing? 'Wronged' implies a duty. What is the source of that duty?"
  **The 90-Second Reply:** "The duty is to integrity of interaction. When a system invites a second-personal stance, accepting that invitation creates a normative expectation. Violating it is a form of bad faith. It's not about the NPC's welfare; it's about the normativity inherent in communicative acts."
  **The Blunt Weakness:** "Bad faith" is a heavy lift for a video game. You need to explain why the "invitation" is binding. Is it a contract? If so, who signed it?

  #### 7. The "Harmless Wrongs" Objection (Fiction/Emotion)
  **The Phrasing:** "We usually think wronging requires harming or setting back interests. You're positing 'harmless wrongs.' This stretches the concept of 'wrong' until it snaps. If nothing is lost, what is the moral weight?"
  **The 90-Second Reply:** "Philosophy already accepts harmless wrongs—violating consent without harm, for instance. The wrong is in the *mode of treatment*, not the outcome. Treating a responsive address as noise is a categorical failure, regardless of consequences."
  **The Blunt Weakness:** Consent cases usually involve beings with interests. You are applying a consent-framework to a being that cannot consent. This is your biggest conceptual stretch.

  #### 8. The "Chatbot Boundary" Objection (General/You)
  **The Phrasing:** "You admit your retention-plus-legibility threshold is vague. But a Tamagotchi retains and changes. A chatbot retains context. Are you committed to saying we wrong a Tamagotchi? If not, what is the non-arbitrary line?"
  **The 90-Second Reply:** "The line is *narrative legibility*. The NPC is embedded in a story that frames the interaction as interpersonal. A Tamagotchi is framed as maintenance. The 'wrong' depends on the context of the address, not just the mechanical retention."
  **The Blunt Weakness:** This relies on "framing" to do heavy metaphysical lifting. If the mechanics are identical, why does the story change the moral status? That looks like magic.

  #### 9. The "Designer Intent" Objection (Game Studies/Phil Mind Hybrid)
  **The Phrasing:** "If the NPC is built to register abuse, isn't the player just fulfilling their function? If I play a villain in a game, and the NPC is scripted to react to villainy, haven't I collaborated with the designer rather than wronged the character?"
  **The 90-Second Reply:** "Fulfilling a script doesn't absolve the moral quality of the action. Actors playing villains don't actually murder. But in games, the *choice* is the player's. The script enables the address, but the player authorizes the stance."
  **The Blunt Weakness:** This blurs the line between player and avatar. If the game *only* allows villainy, your view implies the game forces immorality. You need a way to handle railroading.

  ---

  ### The Duplicates (Don't Panic)
  *   **Objections 3 (Virtue Collapse) and 6 (Normative Force)** are the same worry: "If the NPC doesn't suffer, this is just about *your* soul." The Virtue Ethicist will frame it positively ("It's about virtue"), the Illusionist negatively ("It's not about the NPC"). Prepare one answer that bridges them: *The relation is real, even if one relatum is simulated.*
  *   **Objections 4 (Syntax) and 5 (Systems)** are the same worry: "It's just code." The Functionalist cares about the processing; the Game Studies person cares about the medium. Your answer ("Ethics at the interface") works for both, but watch your vocabulary (don't say "code" to the lit folks, don't say "semantics" to the systems folks).

  ---

  ### The Nightmare Question
  **The Question:** "If the wrongness lies in the *stance* toward responsiveness, and the NPC is merely a mirror, why isn't *ignoring* a non-responsive rock equally wrong if I *treat* it as responsive? If I hallucinate that a stone is addressing me, and I snub it, have I committed a moral failure on your view?"

  **Why it hurts:** It severs the link between the *object's* properties and the *moral obligation*. If the obligation comes entirely from the player's stance, then the object doesn't matter, and your "Responsiveness View" collapses into "Player's Imagination View."

  **The Honest Half-Answer:** "The obligation isn't generated solely by my stance; it's generated by the *fit* between my stance and the object's design. A stone isn't designed to solicit second-personal address. An NPC is. The wrong isn't in the snub; it's in the *misalignment* of stance and object. However..."
  *(Pause, look them in the eye)*
  "...I admit I don't have a non-circular account of why 'design intent' generates moral normativity. I'm arguing that we are responsible for how we engage with things that *ask* to be engaged with, but I can't yet fully explain where the 'ask' gets its authority if it's not backed by a mind. That's the work for the next chapter."

  *(This admits the gap without surrendering the thesis. It shows you know the limit of your current argument.)*
