answer: |-
  **Alex (PM):** Look, I'm not saying Condorcet is magic. I'm saying the math is the math. If each sample has a fifty-one percent chance of being right, and they're independent, five hundred samples means the error rate drops to effectively zero. We're seeing that in the dashboards. The pipeline works.

  **Jordan (Lead):** The pipeline outputs *something*, sure. But you're building a business case on a theorem that requires statistical independence. We are running five hundred samples of *one* model. Same weights, same training data, same architectural biases. That isn't five hundred voters. That's one voter asked the same question five hundred times while wearing slightly different sunglasses.

  **Alex:** But the sunglasses matter. Temperature one introduces stochasticity. It's not deterministic. If the model was greedy decoding, sure, it's one voter. But with sampling, the trajectory changes. Sometimes it attends here, sometimes there. That looks like independence to me.

  **Jordan:** It looks like noise, not independence. There's a difference. Independence means my error doesn't predict your error. But if the model has a systemic misconception—say, it thinks a specific legal clause implies liability when it doesn't—temperature isn't going to fix that. It's just going to hallucinate the reasoning for that wrong answer in five hundred different ways. You're not averaging out noise; you're reinforcing a bias.

  **Alex:** Okay, but we benchmarked. On the validation set, the single-shot accuracy is above fifty percent. So even if there's bias, the base rate $p$ is greater than point-five. Condorcet still holds. The majority vote converges on the truth.

  **Jordan:** Only if $p$ is stable. What happens on the subset of questions where the model is systematically confused? Where the shared prior is wrong? In those clusters, $p$ isn't point-five-one. It's point-four. And if you plug point-four into Condorcet, the majority vote doesn't converge on the truth. It converges on the error. The more samples you add, the *more* confident you become in the wrong answer. A single expert might guess right by luck. Your majority vote of five hundred will guarantee failure.

  **Alex:** So we filter those clusters. We know the model struggles on niche tax law. We route that elsewhere. For the general stuff, where $p$ is safely above point-five, why wouldn't more samples help? Even if they're correlated, isn't some independence better than none?

  **Jordan:** It's not about "some." It's about diminishing returns. If the samples are highly correlated, the information gain saturates. Imagine you ask me a question, then you ask my clone, then my clone's clone. By sample ten, you haven't learned anything new. You're just paying for compute. If the correlation coefficient is high, going from fifty samples to five hundred might drop your error rate by a negligible amount while costing ten times the inference budget. You think the curve keeps going down exponentially. I think it hits a floor.

  **Alex:** But we don't know where the floor is unless we scale. If temperature gives us even ten percent effective independence, five hundred samples locks it in. I'd rather oversample and be safe than undersample and have variance.

  **Jordan:** I'll concede this: you are right that sampling beats greedy decoding. There are cases where the highest probability token is wrong, but a lower probability path leads to the right answer. By sampling five hundred times, you are recovering those latent correct paths that greedy decoding prunes. So the ensemble *is* more accurate than a single shot.

  **Alex:** Exactly. So the mechanism works.

  **Jordan:** The mechanism works, but your justification is wrong. It's not Condorcet. It's error coverage. You're casting a wider net, not gathering independent witnesses. And that distinction matters for the $p$ less than point-five problem. If we hit a domain where the model is systematically biased, casting a wider net just catches more of the same wrong fish. You need to know if you're fighting variance or bias. Condorcet only fights variance.

  **Alex:** Fine. Semantics. But if the net catches more right answers, does it matter why?

  **Jordan:** It matters for scaling. If it's variance, adding samples helps forever. If it's bias, adding samples hits a wall. I need to know if we're hitting the wall. Because if we are, I'd rather spend that compute on a smaller model with better fine-tuning than a big model with five hundred samples.

  **Alex:** Okay. So how do we prove it? You say correlation kills the benefit. I say volume crushes the error.

  **Jordan:** We run a saturation curve. We take a fixed test set of five hundred questions. We run the pipeline, but we don't just look at the final majority vote. We simulate the vote count at $n$ equals one, five, ten, twenty, fifty, one hundred, up to five hundred.

  **Alex:** Plotting accuracy against sample size.

  **Jordan:** Exactly. If Condorcet holds and samples are independent, that curve should keep climbing steeply for a long time. The error should drop exponentially. If I'm right, and there's high correlation due to shared weights, the curve will shoot up initially and then plateau. You'll see diminishing returns kick in hard around twenty or thirty samples.

  **Alex:** And if it plateaus?

  **Jordan:** Then we cap the pipeline at the knee of the curve. We save the compute. And we admit we're dealing with bias, not voter independence.

  **Alex:** And if it keeps climbing?

  **Jordan:** Then I eat my hat, and we buy more GPU hours. But I'm betting on the plateau.

  **Alex:** Deal. Let's run it on the legal dataset first. That's where the bias risk is highest.

  **Jordan:** Agreed. If the curve flattens there, we know temperature isn't breaking the shared prior.

  **Alex:** I'll set up the job. You watch the curve.

  **Jordan:** Done.
