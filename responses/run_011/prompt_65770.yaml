      *   *Concession:* Jordan admits sampling beats greedy decoding sometimes.
      *   *Experiment:* Run the pipeline with $n=1, 2, 5, 10... 500$. Plot accuracy. If it plateaus, correlation wins. If it keeps dropping error, independence holds.

  6.  **Polishing:**
