answer: |-
  There is no single, universally standardized noun for this specific category. You have identified a genuine lexical gap in political philosophy and legal theory.

  While "civil disobedience" is often used loosely to cover what you describe, the **orthodox definition** (Rawls, 1971) explicitly excludes it. Rawls argues that accepting punishment is necessary to demonstrate "fidelity to law"—you break a specific statute to alert the majority's conscience, but you submit to the penalty to show you still respect the legal system as a whole.

  The act you are describing breaks the law openly but refuses that specific submission. It treats the courtroom not as a place of witness, but as a place of **adversarial challenge**.

  Here is the carving you are looking for, the closest existing labels, and an analysis of whether this constitutes a different *kind* of act.

  ### 1. The Terminology
  Since there is no single word, scholars and lawyers use descriptive phrases. The most precise labels currently in circulation are:

  *   **Contestatory Civil Disobedience:** Used to distinguish from "persuasive" disobedience (which seeks to shame the majority).
  *   **Disobedience with a Claim of Right:** Borrowed from legal theory. It implies the actor believes they had a *legal* or *moral right* to do the act, rather than admitting guilt for a higher good.
  *   **Conscientious Lawbreaking:** A broader umbrella that drops the "acceptance of punishment" criterion entirely.
  *   **The Political Trial:** This focuses on the *venue*. The act is designed to force a trial where the law itself is put on display (e.g., the Chicago Seven, the Plowshares movement).

  If you need a label for your own use, **"Conscientious Contestation"** captures the two key elements: the motive is conscience, but the method is legal contestation rather than penal submission.

  ### 2. The Conceptual Carving
  To map this properly, we need to distinguish three categories based on two axes: **Openness** (Do you hide?) and **Relationship to Penalty** (Do you accept the state's right to punish?).

  | Category | Openness | Relationship to Penalty | Political Function |
  | :--- | :--- | :--- | :--- |
  | **Evasion / Crime** | Secret or Flight | Reject (Avoid) | Self-preservation or pure disruption. No appeal to public conscience. |
  | **Rawlsian Civil Disobedience** | Public | **Accept** (Submit) | **Moral Witness.** "I break this law to show it is unjust, but I respect your right to punish me." |
  | **Conscientious Contestation** (Your Category) | Public | **Reject** (Litigate) | **Legal Challenge.** "I break this law because it is invalid/void. You have no right to punish me." |

  **The Line Between Them:**
  *   **Vs. Evasion:** The line is clear. Evasion denies the state the ability to process the claim. Contestation engages the state's machinery to force a ruling.
  *   **Vs. Rawlsian Acceptance:** The line is the **claim of legitimacy**. The Rawlsian actor admits the act is *illegal* but argues it is *just*. The Contestatory actor argues the act is *justified* (and therefore should not be treated as criminal).

  ### 3. Is it a Difference in Kind?
  You asked: *If two people do the identical illegal act and one pleads for acquittal while the other asks for leniency after a guilty plea, is that a difference in the kind of act, or only in how they present it afterwards?*

  It is a **difference in kind**, because it changes the **mechanism of political change** they are invoking.

  **The Rawlsian (Accepting Punishment):**
  *   **Audience:** The Public / The Majority.
  *   **Mechanism:** Sacrifice. By suffering the penalty, they prove sincerity. They rely on the "sense of justice" of the majority to eventually change the law.
  *   **Stance toward System:** "I respect this system enough to suffer its errors."

  **The Contestatory (Fighting the Charge):**
  *   **Audience:** The Court / The State.
  *   **Mechanism:** Precedent and Validity. They are not trying to shame the public; they are trying to force the state to admit its own law is unenforceable or superseded by higher law (e.g., International Law, Constitutional Rights, Necessity).
  *   **Stance toward System:** "This specific application of power is illegitimate."

  **Why this matters:**
  If you accept the punishment, you are operating **extra-legally** (outside the law's protection) to appeal to morality. If you contest the punishment, you are operating **intra-legally** (inside the law's logic) to appeal to jurisdiction or validity.
  *   *Example:* A draft refuser who says, "Jail me, war is hell" is a **moral witness**.
  *   *Example:* A draft refuser who says, "The Vietnam War violates the Nuremberg Principles, therefore the draft order is void" is a **legal challenger**.
  The physical act (burning the card) is identical. The political act is fundamentally different. One seeks martyrdom; the seeks acquittal.

  ### 4. Boundary Cases and Nuance
  To sharpen the definition, here is how to handle the fuzzy edges:

  **The "Tactical Plea" Problem**
  *   *Scenario:* A protester intends to accept punishment as a witness, but their lawyer advises them to plead not guilty to preserve appeal rights.
  *   *Verdict:* This remains **Rawlsian Civil Disobedience**. The *intent* determines the category. If the goal is still to highlight the injustice through suffering, but procedural rules require a not-guilty plea, the *kind* of act hasn't changed.
  *   *Your Category:* Requires that the defendant *wants* to win. If they are genuinely arguing, "I should not be convicted because I was right," they are in the Contestatory category.

  **The "Necessity Defense" Edge**
  *   *Scenario:* Someone blocks a road to get a dying person to a hospital. They argue "Necessity" in court.
  *   *Verdict:* This is **Justification**, not necessarily Civil Disobedience. Civil disobedience is usually about changing *policy*. Necessity is about immediate *harm reduction*. However, climate activists using the "Necessity Defense" (arguing climate collapse justifies property damage) fit your **Conscientious Contestation** category perfectly. They are trying to set a legal precedent, not just serve time.

  **The "Uncivil" Edge**
  *   *Scenario:* Someone breaks a law openly, fights the charge, but is violent or rude.
  *   *Verdict:* This falls into **"Uncivil Disobedience"** (a term gaining traction, e.g., by philosopher Robin Celikates). Your category (Conscientious Contestation) usually implies nonviolence, but the "fighting the charge" aspect is compatible with uncivil tactics. The distinguishing feature of your category is the *legal argument*, not the demeanor.

  ### Summary Definition
  If you need to define this in an argument, use this:

  > **"Conscientious Contestation"** is the public, non-evasive violation of a law where the actor refuses to accept the legitimacy of the penalty. Unlike Rawlsian civil disobedience, which accepts punishment to demonstrate fidelity to the rule of law, Conscientious Contestation utilizes the legal trial to challenge the validity of the law itself. The actor seeks acquittal, not leniency, positing that the act was justified rather than merely excusable.

  **The Line:**
  *   If you run: You are a **fugitive**.
  *   If you stand and say, "I did it, punish me, look how wrong this is": You are a **moral witness** (Rawlsian Civil Disobedient).
  *   If you stand and say, "I did it, it was right, let me go": You are a **conscientious contestant**.

  It is a distinct category because it shifts the burden from the **court of public opinion** (where suffering wins) to the **court of law** (where argument wins).
