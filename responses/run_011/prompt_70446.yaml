answer: |-
  **Chairman:** The committee will come to order. We are hearing evidence on the Human Tissue Products Act. Dr. Aris, you represent the liberal perspective. Professor Vance, you represent the sociological perspective. You may begin.

  **Dr. Aris:** Thank you. I approach this as an economist of regulation. My concern is the justification for state coercion. This bill criminalises production but exempts consumption. If the act were truly harmful, the eater would be an accomplice. If it is harmless, why punish the maker? The explanatory memorandum disclaims health, welfare, and dignity. It rests solely on the claim that permitting this trade changes the society's self-conception. But fifteen years of technical feasibility have produced no social collapse. The polling shows revulsion, yes, but revulsion is not an argument. It is a datum. We must ask whether this revulsion tracks a genuine moral boundary or merely historical inertia. Consider the dissection of cadavers. In the eighteenth century, it was viewed as a desecration added to the punishment for murder. Now it is routine medicine. Consider blood transfusion. Once thought monstrous, now mundane. If we ban human tissue culture because it feels wrong today, we risk freezing our morality in a state of ignorance.

  **Prof. Vance:** I agree that revulsion alone is insufficient, but you misunderstand the mechanism of law. You treat permissions and prohibitions as symmetrical switches. They are not. A prohibition encodes a common judgement that members can inhabit and reason from; a permission is merely silent. A society can accumulate new liberties without loss of cohesion, but it cannot withdraw an old prohibition without paying a price in the fabric that holds it together. When you legalise the manufacture of human flesh, you do not simply add an option. You remove a shared boundary that defines the limit of the commodifiable. You argue that fifteen years of stability prove nothing. I argue that while transfusion and inoculation moved from taboo to tool, the eating of horse and dog has remained durable in the West. The question is not whether taboos ever change, but whether this specific taboo belongs to the list of dissipating prejudices or the list of core constitutive rules.

  **Dr. Aris:** But how do we distinguish those lists without begging the question? You say horse meat is a core boundary; I say it is a cultural accident. If you claim that removing this prohibition causes disintegration, you must tell us what observation would count against that claim. If society continues for another fifteen years with this bill rejected, will you concede the disintegration thesis was false? Or will you argue the erosion is invisible? The liberal distinction between the morality a society holds and the morality it ought to hold is essential here. If we defer entirely to the existing moral fabric, we cannot critique slavery or segregation when they were supported by widespread intuition. You must allow that the society's current self-conception might be mistaken.

  **Prof. Vance:** I concede that not every prohibition is vital. A society can survive the loss of minor conventions. But I must revise my earlier phrasing: I do not claim immediate collapse. I claim erosion of the shared language of value. To your point on falsifiability: if the legalisation of human tissue production led to a measurable increase in social trust, or a broadening of charitable cooperation across unrelated groups, that would count against my thesis. I expect the opposite: a fragmentation where the body becomes merely another resource. You ask how we distinguish the horse from the transfusion. The distinction lies in the object's relation to the person. Transfusion repairs the person; eating human tissue consumes the person. The revulsion here is not about pathogen risk—the bill admits there is none. It is about the category error. To treat human biomass as food is to alter the status of the human subject.

  **Dr. Aris:** You say the body is not a resource, yet the donor gives written, revocable, unpaid consent. There is no victim. I concede that the absence of a victim is not a trump card that ends the argument; social facts matter. If eighty per cent of the population feels this violates a sacred boundary, ignoring that causes unrest. However, you argue that the prohibition encodes a judgement we reason from. What judgement is that? 'Human flesh is not food.' But if the chemical composition is indistinguishable from cultivated meat, the judgement rests on origin, not substance. This looks like magic, not morality. If we ban this, we are not protecting a moral truth; we are enforcing a superstition. The is/ought distinction requires us to ask if the society *ought* to hold this view. If the view rests on a factual error—that the tissue retains the person's identity after culture—then the law entrenches error.

  **Prof. Vance:** It is not a factual error; it is a constitutive rule. Consider the durable revulsion against eating dog. There is no chemical difference between dog and pig. The prohibition does not track biology; it tracks membership. We do not eat members. By allowing the commercial manufacture of human tissue, you are not merely adding a liberty. You are signalling that the human body is separable from the human person in a way that permits market valuation. I concede that some prohibitions dissolve, like cremation. But those dissolutions occurred because the underlying moral concern was reinterpreted, not ignored. Cremation became acceptable when it was seen as respecting the soul rather than desecrating it. Here, the bill expressly disclaims dignity. It asks us to accept the commodification without a reinterpretation that preserves the sacred. That is the asymmetry. You cannot simply remove the prohibition and expect the moral understanding to remain intact.

  **Dr. Aris:** But who decides when a reinterpretation is sufficient? You say the law encodes a judgement. I say the law should encode principles of justice, not contingent sentiments. If the polling shows high eighties per cent revulsion across every age cohort, that suggests depth. But it also suggests isolation. Has this revulsion been tested against argument, or merely against absence? The transfusion taboo dissolved when the benefit became undeniable. Here, the benefit is economic efficiency or culinary novelty. If the benefit is trivial, perhaps the revulsion should stand. But not because the revulsion is true. Because the cost of overriding it outweighs the gain. That is a utilitarian calculation, not a moral absolute. You claim the permission is silent. I claim the permission says: 'Adults may choose.' That is a positive judgement of autonomy.

  **Prof. Vance:** Autonomy is not the only value. The permission says: 'There is no longer a shared limit here.' It creates a market where there was a boundary. My thesis is that withdrawing a prohibition costs cohesion. You ask for a test. Look at the jurisdictions where horse meat is consumed versus where it is taboo. Do the latter show higher social cohesion? It is difficult to isolate. But consider the donor consent. You emphasise it is unpaid. But the act of sale introduces the market logic. Once the tissue is a product, the donor becomes a supplier. The relationship changes. The liberal view assumes the morality a society ought to hold can be derived from individual consent. I argue it is derived from shared practices. If the practice changes, the morality changes. You cannot hold the morality constant while changing the practice.

  **Dr. Aris:** I concede that shared practices have weight. Ignoring the eighty per cent revulsion would be politically disastrous and socially destabilising in the short term. But stability is not justice. If the revulsion is based on a category error, the law should educate, not enforce. You say the permission is silent. I say it is an invitation to reasoning. By banning this, you stop the conversation. You say 'This is beyond the pale.' I say 'This is within the pale, but we understand why you hesitate.' The difference is between a closed society and an open one. You fear fragmentation. I fear stagnation. We agree that some prohibitions are core. We disagree on whether this is one. You place it with horse and dog. I place it with dissection and inoculation.

  **Prof. Vance:** And there we remain. You believe the revulsion will dissolve once the utility is proven. I believe the revulsion persists because the utility is irrelevant to the boundary. You say the law should educate. I say the law constitutes the community. If you remove the prohibition, you do not educate; you dissolve the boundary. I concede that not all prohibitions are permanent. But I maintain that removing this one extracts a price from the social fabric that cannot be recovered. You concede that revulsion has social weight. But you maintain it can be overridden by principle. We agree on the facts of the bill. We disagree on the nature of the society that passes it.

  **Chairman:** Thank you. The committee will adjourn.

  ***

  **Note:**

  The Moralist makes claims that are, in principle, testable, whereas the Liberal's appeal to "justice" or "error" relies more heavily on normative axioms that resist empirical falsification. Specifically, the Moralist's asymmetry thesis—that withdrawing prohibitions costs social cohesion while adding liberties does not—invites quantitative scrutiny. A study design could involve a longitudinal cross-national analysis measuring social trust indices (e.g., generalized trust surveys) before and after the legalisation of previously prohibited moral behaviours (such as gambling or euthanasia), controlling for economic variables. Alternatively, a vignette experiment could present subjects with scenarios where a specific prohibition is either maintained or lifted, measuring perceived social cohesion and shared identity afterward. While impractical to execute on a national scale for human tissue, such designs could discriminate between the hypothesis that permissions are neutral versus the hypothesis that they actively erode shared normative structures. The Liberal's claim that revulsion tracks error is harder to test without an independent metric of moral truth, which remains philosophically contentious.
