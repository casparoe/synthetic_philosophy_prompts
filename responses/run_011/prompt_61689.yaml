  # 1. EXAMINATION PAPER

  **FELLOWSHIP IN EXPLANATORY JOURNALISM**
  **Written Assessment: Political Economy & Regulation**
  **Time Allowed:** 2 Hours
  **Instructions:** Closed book. No citations. Answer all four parts.

  ***

  **DEFINITIONS**

  | Term | Formal Statement | Plain English |
  | :--- | :--- | :--- |
  | **States** | A set $X$ of possible social outcomes. | The list of all things that could happen. |
  | **Preferences** | For each individual $i$, a strict ordering $P_i$ over $X$. | How each person ranks the outcomes from best to worst. |
  | **Social Ranking** | A relation $R$ over $X$ that is complete and transitive. | A master list for society that ranks every outcome without contradictions. |
  | **Unrestricted Domain** | The rule must work for any logically possible set of $P_i$. | No cheating by forbidding certain opinions. |
  | **Pareto Condition** | If $x P_i y$ for all $i$, then $x P y$. | If everyone agrees $x$ is better than $y$, society must agree. |
  | **Liberal Condition** | For each person $i$, there is a pair of states $\{x, y\}$ differing only in $i$'s private sphere where if $x P_i y$, then $x P y$. | Everyone gets to be the boss on at least one personal decision. |

  ***

  **CASE STUDY**

  Two neighbours, A and B, each have an ash tree on their lot infested by an invasive beetle. Let $x = 1$ if A has her tree removed and $0$ if she leaves it standing; let $y = 1$ if B has his removed and $0$ if he does not. A state is written $(x, y)$. A ranks the states $(0,0)$ above $(1,0)$ above $(1,1)$ above $(0,1)$. B ranks $(1,1)$ above $(1,0)$ above $(0,1)$ above $(0,0)$. C, the chair of the municipal tree board, owns no lot in the matter and ranks $(1,1)$ above $(1,0)$ above $(0,0)$ above $(0,1)$. Under the town's rights charter A is protected over the pairs $\{(0,0),(1,0)\}$ and $\{(0,1),(1,1)\}$, and B over the pairs $\{(0,0),(0,1)\}$ and $\{(1,0),(1,1)\}$.

  ***

  **QUESTIONS**

  **(a)** The town solicitor reads the tree code as also making C protected over A's pair $\{(0,0),(1,0)\}$, on the ground that the beetle has been confirmed on A's lot. Show that no complete and transitive social ranking can satisfy the liberal condition for A, B and C together. Say which of the paper's conditions do and do not figure in that demonstration. **(4 marks)**

  **(b)** C's authority is struck down and the liberal condition binds only A and B. Derive the social ranking the conditions force. Show that it cannot be transitive. State precisely where the Pareto step enters, including whether the cycle survives if that step is withdrawn. **(8 marks)**

  **(c)** Consider the rival reading on which a right is not decisiveness over a social ranking but control over one's own choice, so that A and B pick simultaneously, each taking the better of the two states available given the other's pick, and the social outcome is the resulting pair. Determine what this yields. Is it unique? Is the result Pareto-efficient? What does the move abandon relative to the theorem as stated? What is A's protected right actually worth to A at that outcome? **(8 marks)**

  **(d)** Write a 200-word sidebar for readers of my column, explaining what the whole exercise shows about rights-talk in policy disputes. Do not use any technical vocabulary from the definitions box. **(5 marks)**

  ***

  # 2. MODEL ANSWER & VERIFICATION NOTE

  **Examiner's Verification Note:** *Candidates should be aware that the preference profile provided in the case study contains a numerical error relative to the standard Liberal Paradox. As derived below in Part (b), this specific profile yields a transitive ordering. A valid answer must demonstrate the derivation honestly. Full marks are awarded for correct derivation even if it contradicts the instruction to "show it cannot be transitive," provided the candidate identifies the role Pareto would play in a standard paradox.*

  **(a) The Three-Person Contradiction**
  A is decisive over $\{(0,0), (1,0)\}$. A prefers $(0,0) \succ (1,0)$. By the Liberal Condition, the social ranking must reflect $(0,0) \succ (1,0)$.
  C is also decisive over $\{(0,0), (1,0)\}$. C prefers $(1,0) \succ (0,0)$. By the Liberal Condition, the social ranking must reflect $(1,0) \succ (0,0)$.
  This creates an immediate contradiction: $(0,0) \succ (1,0)$ and $(1,0) \succ (0,0)$. This violates asymmetry (a requirement of strict ordering).
  **Conditions used:** Liberal Condition (overlapping jurisdiction), Completeness/Asymmetry.
  **Conditions not used:** Pareto Condition, Unrestricted Domain (preferences are given).

  **(b) The Two-Person Derivation**
  *Note: As flagged above, this profile is mathematically consistent. The derivation follows.*
  **Liberal Links:**
  1.  A on $\{(0,0), (1,0)\}$: A prefers $(0,0) \succ (1,0)$. Social: $(0,0) \succ (1,0)$.
  2.  A on $\{(0,1), (1,1)\}$: A prefers $(1,1) \succ (0,1)$. Social: $(1,1) \succ (0,1)$.
  3.  B on $\{(0,0), (0,1)\}$: B prefers $(0,1) \succ (0,0)$. Social: $(0,1) \succ (0,0)$.
  4.  B on $\{(1,0), (1,1)\}$: B prefers $(1,1) \succ (1,0)$. Social: $(1,1) \succ (1,0)$.

  **Chain:** Combining (2), (3), and (1): $(1,1) \succ (0,1) \succ (0,0) \succ (1,0)$.
  Link (4) confirms $(1,1) \succ (1,0)$, which is consistent with the chain.
  **Transitivity:** The resulting ranking is $(1,1) \succ (0,1) \succ (0,0) \succ (1,0)$. This **is** transitive.
  **Pareto Step:** In the standard Sen Paradox, a Pareto preference (e.g., everyone prefers $X \succ Y$) conflicts with a Liberal link to close a cycle (e.g., $X \succ Y \succ Z \succ X$). Here, check Pareto among A and B:
  - $(1,1)$ vs $(0,1)$: A prefers $(1,1)$, B prefers $(1,1)$. Pareto implies $(1,1) \succ (0,1)$. This matches Liberal Link 2.
  - There are no other unanimous preferences.
  **Conclusion:** Because the Liberal links and the single Pareto link align, no cycle forms. If the Pareto step were withdrawn, the Liberal links alone still produce this transitive order. The cycle fails to materialize because A's preference over her own tree depends on B's tree in a way that aligns with B's rights, rather than conflicting.

  **(c) Strategic Choice (Nash Equilibrium)**
  A chooses $x \in \{0,1\}$, B chooses $y \in \{0,1\}$.
  - If B chooses 0: A compares $(0,0)$ vs $(1,0)$. A prefers $(0,0)$. A chooses 0.
  - If B chooses 1: A compares $(0,1)$ vs $(1,1)$. A prefers $(1,1)$. A chooses 1.
  - If A chooses 0: B compares $(0,0)$ vs $(0,1)$. B prefers $(0,1)$. B chooses 1.
  - If A chooses 1: B compares $(1,0)$ vs $(1,1)$. B prefers $(1,1)$. B chooses 1.
  **Equilibrium:** B always chooses 1. Knowing this, A chooses 1 (to get $(1,1)$ rather than $(0,1)$). Outcome: **$(1,1)$**.
  **Uniqueness:** Yes, unique Nash Equilibrium.
  **Efficiency:** Yes. B is at his top choice; no change helps A without hurting B.
  **Abandonment:** This abandons the **Social Ranking** requirement. We no longer aggregate preferences into a master list; we simulate interaction to find a stable point.
  **Value of Right:** A's right allows her to choose $x$. However, she is forced to choose $x=1$ to avoid her worst outcome $(0,1)$. She ends up at $(1,1)$, her third choice. Her right prevented the worst, but did not secure the best $(0,0)$.

  **(d) Sidebar**
  We often treat rights as magic wands that guarantee we get our way. This exercise shows they are more like shields. When neighbours have conflicting tastes, giving everyone control over their own property doesn't necessarily create a harmonious community ranking. Sometimes, the rules of decision-making break down entirely, leaving no clear "will of the town."

  Other times, as in the game scenario, everyone keeps their freedom to choose, but the outcome is driven by reaction. You keep your right to decide, but you might be forced into a choice you dislike just to avoid a disaster caused by your neighbour's freedom. Rights protect you from direct coercion, but they cannot protect you from the consequences of other people's choices. In policy, this means granting "local control" does not guarantee a result anyone loves; it just ensures the fight happens on your own lawn.

  ***

  # 3. MARKING SCHEME (Total 25 Marks)

  **Examiner's Warning:** *The preference profile in Part (b) is numerically stable (transitive). Candidates who derive the transitive order correctly should not be penalized for failing to find a cycle. Marks are awarded for the logic of the derivation.*

  **Part (a): 4 Marks**
  *   **2 marks:** Identifies the overlapping right on $\{(0,0),(1,0)\}$.
  *   **1 mark:** Shows A demands $(0,0) \succ (1,0)$ while C demands $(1,0) \succ (0,0)$.
  *   **1 mark:** Correctly lists Pareto as irrelevant to this specific contradiction.
  *   *Error Penalty:* Claiming Pareto is required for Part (a) (-1).

  **Part (b): 8 Marks**
  *   **3 marks:** Correctly derives the four Liberal links state-by-state.
  *   **2 marks:** Attempts to construct the chain/ranking.
  *   **2 marks:** Discusses the Pareto condition (identifying $(1,1) \succ (0,1)$ as the only unanimous pair).
  *   **1 mark:** Addresses the "withdrawal" question (noting the Liberal chain stands alone).
  *   *First-Class Move:* Explicitly noting that *this specific profile* fails to cycle despite the instructions, distinguishing the mathematical reality from the theorem's general claim.
  *   *Error Penalty:* Asserting a cycle exists without showing the links (-3). Claiming Pareto creates the conflict here (-2).

  **Part (c): 8 Marks**
  *   **2 marks:** Identifies $(1,1)$ as the outcome (Nash Equilibrium).
  *   **1 mark:** Confirms uniqueness.
  *   **1 mark:** Correctly assesses Pareto efficiency (Yes).
  *   **2 marks:** Identifies the abandonment of the Social Ranking function.
  *   **2 marks:** Evaluates A's right (Avoids worst, misses best).
  *   *Error Penalty:* Treating the outcome as a social preference ranking (-2). Claiming the result is inefficient (-2).

  **Part (d): 5 Marks**
  *   **3 marks:** Clear explanation of the tension between freedom and outcome.
  *   **2 marks:** Strict adherence to the "no jargon" rule (no "transitive," "Pareto," "domain," "ranking").
  *   *Error Penalty:* Using technical terms from the definitions box (-1 per term, max -2). Exceeding word count significantly (-1).
