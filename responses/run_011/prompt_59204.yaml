      *   *Adjudicator* $\rightarrow$ *Vet/Farmer* (Cow) vs. *Doctor/Patient* (Human).

  4.  **Analyzing the Disanalogies (The "Pressure" vs. "Fluff"):**
      *   *User's Suspicion:* "Vets love animals" = Fluff. (Correct. Personal affection doesn't change the diagnostic criteria).
      *   *Real Pressure Point 1:* The "Farmer's Interest." A broiler chicken is "healthy" if it grows fast, even if that causes skeletal issues. A laying hen is "healthy" if she lays eggs. These are *economic* functions, not necessarily *biological* flourishing. If vet med relies on human economic interests, it *is* normativist, just hidden.
      *   *Real Pressure Point 2:* Articulation/Consent. Humans can report symptoms (pain, nausea) which are inherently subjective values. Cows cannot. Ignoring this changes the *concept* of disease.
      *   *Real Pressure Point 3:* The Reference Class Problem. In vet med, we often breed *out* natural variation. In human med, we usually treat the "species typical" as the norm.
      *   *Fluff:* "Vets love animals." (As noted). "Plants don't feel pain." (Irrelevant to functional definition).

  5.  **Addressing the "Farmer vs. Natural Selection" Pivot:**
