answer: |-
  ### Brainstorming & Theoretical Mapping

  The device embodies a **Gilbertian Plural Subject** account, filtered through **Bratmanian** consistency checks. Gilbert argues that shared agency requires a *joint commitment* that creates mutual obligations and entitlements to rebuke. Bratman argues for *shared intention* grounded in interlocking individual intentions and meshing subplans, without necessarily creating obligations. Searle argues for a primitive *we-intention* that isn't reducible to individual "I-intentions."

  **Why Gilbert?** The prompt's bonus constraint (dropout due to lack of entitlement to rebuke) is the fingerprint. Bratman allows shared agency without obligation; Gilbert does not. If the machine fails because the veteran hasn't actually committed to the *new hire* (only to the task), it's detecting the lack of normative bind, not just the lack of coordination.

  **Failure Modes & Rival Predictions:**
  1.  **Private Backup Plan:** The veteran plans to jettison the load if risk spikes; the novice plans to save it. Subplans don't mesh. *Bratman* predicts failure here (meshing condition). *Gilbert* predicts failure (violates joint commitment). *Searle* might predict success if both still hold the "we-purpose" despite divergent sub-plans, though likely failure.
  2.  **Circular Expectation:** "I'll commit if you commit." Neither initiates the intention. *Bratman/Gilbert* predict failure (no ground for intention). *Searle* might allow it if the phenomenological "we-feeling" exists, though the lack of mutual knowledge hurts.
  3.  **The Rebuke (The Bonus):** The novice tries to hold the veteran accountable. The machine cuts out because the veteran never entered a joint commitment *with her*, only alongside her. *Gilbert* predicts failure (no obligation exists). *Bratman* predicts success (you can share intention without owing each other anything). This is the key divergence.

  **The Circularity Worry:** The machine requires interdependence (I intend because you intend). If both wait for the other to intend first, nothing happens. The story needs to show the novice realizing that *commitment* breaks the circle, not just prediction.

  **Setting:** Orbital Dock. The "Tandem Rig."
  **Characters:** Kael (Veteran), Elara (New Hire).
  **Plot:** Lifting a destabilized fusion core. Rig cuts out. Elara realizes Kael is treating her as a tool, not a partner. The lift succeeds, but was it a "we"?

  ***

  ### The Tandem Rig

  The fusion core hung in the magnetic suspension field like a bruised fruit, pulsing with a sickly violet light. Outside the cockpit glass, the orbital dock was a skeleton of steel against the void, silent except for the hum of the life support and the low, anxious thrum of the Tandem Rig beneath their hands.

  Elara gripped the left yoke. Kael had the right. They were supposed to be a single unit, a binary star system guiding the core into the containment bay. The Rig didn't care about torque or alignment alone. The manual claimed it measured "operational cohesion." The engineers called it the Ghost Lock. If the machine decided they were two people pushing a rock instead of one people lifting a weight, the power cut.

  "Steady," Kael said. His voice was flat, bored. He'd done this a thousand times. "Match my throttle. Don't lead."

  Elara nudged her thrust forward. The core drifted. The Rig hummed, a solid green light on the dash. Then, a shudder. The hum dipped to a warning amber. The core stalled.

  "Damn it," Kael snapped. He reset the sequence. "You hesitated."

  "I didn't," Elara said. "You changed the vector. I saw you glance at the jettison channel."

  Kael didn't look at her. "Standard protocol. If the containment field flickers, we dump the core. Save the dock."

  "We?" Elara tightened her grip. "I thought the plan was salvage. If we dump it, the contract is void. We lose the bonus."

  "I lose the bonus. You lose a recommendation." Kael shifted in his seat. "Again. And this time, don't think about the bonus. Think about the lift."

  Elara felt the heat rise in her neck. She pushed the yoke forward. The Rig sparked green. They moved the core ten meters. Then Kael's hands twitched, a micro-adjustment toward the emergency release. Elara fought the impulse to counteract him. She wanted to save the core. He was ready to kill it.

  The Rig screamed. Red lights flashed. The power died completely. The core hung dead in the vacuum, drifting slightly off-axis.

  "Subplans," Elara said. The word felt strange in her mouth, pulled from a lecture hall she'd rather forget. "You're doing your thing. I'm doing mine. The machine knows."

  "The machine knows you're nervous," Kael said. He was already cycling the reset. "Look, kid. I've been running Tandem for twelve years. I know how to ride the lock. You just need to stop thinking and follow my lead. Let my intention carry us."

  "That's not how it works," Elara said. "If I'm just following you, then I don't intend the joint action. I just intend to follow you. And you intend to use me. That's a circle. I'm waiting for you to commit to *us*, and you're waiting for me to commit to *you*."

  Kael laughed, a dry, cracking sound. "Philosophy. Great. Look, the manual says mutual responsiveness. I respond to you, you respond to me. The lock holds."

  "It says mutual commitment to the joint activity," Elara corrected. She'd read the leaked engineering logs, not the marketing mush. "Not just responsiveness. If I'm disposed to adjust to you, but you're disposed to adjust to a contingency I don't know about, we aren't joint. We're parallel."

  Kael slammed his hand on the console. "We are lifting the same rock!"

  "Are we?" Elara looked at the dead core. "You're willing to drop it. I'm not. Until you drop that exit strategy, the Rig knows we aren't one agent. It's not measuring our hands, Kael. It's measuring the bind."

  Kael stared at her. For a second, the boredom vanished, replaced by something sharper. Calculation. "So what do you want? A blood oath?"

  "I want to know that if I tell you to hold steady, you owe it to me to hold steady. Not because it's efficient. Because we agreed."

  Kael leaned back. "I don't owe you anything. I owe the company. You're just the second key."

  Elara felt the cold truth of it settle in her gut. That was the dropout. It wasn't the subplans, not really. She could adjust to his jettison plan if she had to. It was the lack of the tie. She had no standing to rebuke him. If she yelled at him for jeopardizing the lift, he could rightly say, *Who are you to tell me what to do?* They hadn't formed the plural subject. They were just two I's in a box.

  "Reset," Kael said. "One more time. I'll stick to the salvage path. No jettison. Happy?"

  "Say it to me," Elara said. "Commit to me."

  "Don't push it."

  "Then the lock won't hold. You know why. Because if I think you're lying, I'm not really intending *with* you. I'm intending to monitor you. And the machine detects the monitoring."

  Kael exhaled sharply through his nose. He looked at the violet core, then at Elara. "Fine. We save the rock. Together. If it blows, we both go. You happy? You have my word."

  Elara nodded. She felt the shift. It wasn't magical. It was normative. He had given her the right to hold him accountable. She placed her hands on the yoke.

  "Together," she said.

  They pushed. The Rig hummed, a deep, resonant chord that vibrated in their teeth. The green light held steady. The core moved smoothly into the containment bay. The magnetic clamps locked with a satisfying thud.

  Elara let out a breath she didn't know she'd been holding. The Rig powered down to idle. They sat in the silence, the adrenaline fading.

  "You were right," Kael said quietly. He wasn't looking at her. He was checking his datapad. "About the lock."

  "It's the interdependence," Elara said, rubbing her wrists. "I intend that we lift because you intend that we lift. But if you only intend because it gets the job done, and I intend because you intend... it's circular. It needs a base. The commitment breaks the circle."

  Kael finally looked at her. There was something unreadable in his eyes. A flicker of doubt, or maybe just fatigue. "You know," he said, "I've run this rig with three different partners before you. None of them ever talked about commitment. None of them ever offered me a rebuke."

  Elara froze. "And the lock held?"

  "Every time," Kael said. "Green light. Smooth lifts. No dropouts."

  "But... if they didn't commit..."

  "Maybe the machine doesn't care about the obligation," Kael said. He stood up, unstrapping his harness. "Maybe it just cares about the prediction. If I know you'll follow, and you know I'll lead, maybe that's enough. Maybe the 'we' is just a trick of the light. An exquisitely fine-grained mutual prediction."

  "But the rebuke," Elara said. "When I tried to hold you accountable earlier, it cut out."

  "Did it?" Kael paused at the airlock door. "Or did it cut out because you hesitated? Because you stopped tracking the load to track me?"

  He opened the door. The vacuum of the dock waited beyond.

  "Or," Kael said, his hand on the frame, "maybe I've been faking it for twelve years. Maybe I've been running on a hollow 'we' this whole time, and the machine is finally getting strict. Or maybe the machine is broken, and we're just telling ourselves stories to make the lights turn green."

  He stepped through. Elara sat alone in the cockpit. The Rig was silent. She looked at her hands, then at the yoke. She tried to remember the feeling of the lift. Had she felt the weight of his commitment, or just the weight of the core?

  She reached out and touched the console. The green light was off. The screen was dark. She wondered if she could lift the next load alone, if she pretended hard enough that someone was beside her. She wondered if the machine would let her try.
