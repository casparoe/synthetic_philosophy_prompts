answer: |-
  Dear Friend,

  Your hypothesis is substantially correct, and it cuts closer to the bone than the standard literature often admits. You have identified that the stalemate is not merely a failure of imagination or a lack of data, but a foundational disagreement about the architecture of moral obligation itself. When you suggest that both the generalization test and the correlation point are used to paper over the deeper divide, you are observing how each side attempts to translate their normative commitments into the language of the other to gain traction. The causal camp, often rooted in a form of act consequentialism or causal decision theory, insists that obligation must track leverage, so they reach for the generalization test to manufacture significance where individual causation fails. The non-causal camp, drawing on deontology, virtue ethics, or theories of fair play, insists that obligation tracks membership and integrity, yet they often feel compelled to defend the utility of voting to avoid sounding quixotic. The third move, regarding the correlation of abstainers, is particularly telling because it attempts to rescue causal efficacy through evidential decision theory, arguing that your vote is evidence of how others will vote, thereby restoring causal weight via correlation. However, this too fails to resolve the dispute because the strict causalists reject evidential decision theory as irrational magic, while the non-causalists find it unnecessary since they do not require efficacy to begin with. Thus, the debate stalls because the participants are not arguing over the same conception of agency.

  This is not merely a verbal quarrel about the word duty, though semantic confusion certainly lubricates the impasse. If it were only verbal, we could stipulate definitions and move on, but the disagreement persists because each side believes the other is making a category error about how human beings relate to collective outcomes. Nor is it a hidden empirical question in disguise, despite the allure of the correlation argument. Even if we possessed perfect sociological data showing that abstainers are perfectly correlated, the causalist could still argue that without a mechanistic link, there is no duty, and the non-causalist could argue that even with zero correlation, the duty of fair play remains. Therefore, empirical findings cannot settle a dispute that is fundamentally meta-ethical. The real friction arises because one side views political participation as a market transaction where one purchases outcomes with effort, while the other views it as a liturgical act where one affirms a relationship with a community. As long as the question is posed as whether there is a duty to vote, it presupposes a single metric of evaluation that does not exist.

  What would count as progress, then, is not a new empirical finding or a formal result, since game theory has already mapped the paradoxes of voting without dissolving the normative tension. Instead, progress would come from a better-posed question grounded in a clear distinction. You should propose that we stop asking whether there is a duty to vote in the abstract and instead ask under which conception of political agency voting becomes intelligible as a requirement. The distinction you need to draw is between instrumental rationality, which concerns the efficient production of states of affairs, and constitutive rationality, which concerns the enactment of a role or identity. If voting is understood instrumentally, the duty vanishes under the weight of negligible probability unless one accepts the controversial premises of evidential decision theory. If voting is understood constitutively, the duty remains robust regardless of probability because the act itself constitutes the status of a citizen in good standing. The stalemate persists because philosophers try to justify constitutive duties using instrumental logic, or vice versa.

  Your essay would make a genuine contribution if you argued that the generalization test and the correlation argument are symptomatic of this category confusion. The generalization test is an attempt to make constitutive duties look instrumental by projecting individual acts onto a universal scale, while the correlation argument is an attempt to make instrumental duties look robust by inflating individual causality through statistical dependence. Both are compensatory maneuvers designed to bridge a gap that should instead be acknowledged. Progress lies in admitting that the causalists and the non-causalists are answering different questions. One is asking, "Will my vote change the outcome?" and the other is asking, "What does my participation say about my relationship to the law?" Once you separate these inquiries, the contradiction dissolves. You can conclude that there is no causal duty to vote, but there may be a constitutive obligation to participate, and the failure to distinguish these two is why the debate has gone nowhere for decades. This reframing does not solve the problem for the individual voter who must still choose, but it clears the philosophical fog that has prevented us from understanding why the choice feels so paradoxical. I hope this helps you sharpen your diagnosis for the journal.

  Warmly,

  A Fellow Student of Philosophy
