      *   Blue says: "I have the nukes, but I can't use them."
      *   This needs to be baked into the math.

  8.  **Troubleshooting:**

      *   *Deadlock:* Add a timer.
      *   *Refuser:* Observer steps in, or pair becomes a trio.
      *   *Reverse Engineering:* Keep math simple. Don't let them calculate EV on the fly, make it intuitive (High Risk vs Small Gain).
      *   *Act 3 Fizzle:* Make the provocation insulting or cumulative.

  9.  **Ethics/Debrief:**

      *   Must address the "flippancy." The game gamifies death. Need to pivot hard to the reality of the stakes.
