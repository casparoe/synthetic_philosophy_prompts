      *   *Act 2 (The Risk):* Needs to introduce a "Russian Roulette" element. Escalation increases the chance of mutual destruction (0 points for both) independent of will. This captures "threat that leaves something to chance."
      *   *Act 3 (The Paradox):* Needs asymmetry. Player A (Aggressor) gains a little from a small move. Player B (Victim) loses a lot but retaliating triggers Act 2 risk. B *should* absorb the loss. This captures Stability-Instability (safe at top, unsafe at bottom).

  3.  **Drafting the Game Structure:**

      *   *Name:* "The Brink Protocol."
      *   *Setup:* Pairs. One "Red," One "Blue." One Observer per pair (rotating or fixed? Fixed is better for data). 24 students = 8 pairs + 8 observers? No, 24 students total. 12 pairs? If 12 pairs, no observers. If 8 trios (2 players, 1 observer), that's 24. Perfect.
      *   *Materials:* Paper, pencils, dice (or deck of cards for probability), tokens (paper chips).

      *   *Act 1:* Simple escalation. Bid for a pot. Highest bid wins, both pay cost. *Wait, need commitment.* Let's use a "Move/Stop" mechanic.
          *   *Idea:* A ladder of 5 rungs. Each turn, players decide to Climb or Stop. If both Climb, they go up. If one Stops, the other wins the rung value. If both reach top, disaster? No, save disaster for Act 2.
          *   *Refinement:* Let's use Schelling's "Commitment" idea. One player can physically discard their "Stop" card. But the prompt says "nobody should be told it is available."
          *   *Better:* The "Irrevocable Order." In Act 1, players exchange written orders for the *next* turn. If I write "CLIMB" and seal it, I am committed.
          *   *Actually, simpler:* The "Burnt Bridge." Allow players to tear up their "Retreat" card. If they do it publicly, the other knows they *must* climb.
          *   *Payoffs:* Small points for climbing, big penalty for collision.

      *   *Act 2:* The Dice of Doom. Every time they escalate past a certain point, roll a die. On a 1, game ends, everyone gets -100 (Catastrophe). This makes the threat probabilistic.
      *   *Act 3:* Asymmetry. Red gets +5 for a "Probe." Blue loses -10. If Blue retaliates, they trigger the Act 2 Die Roll. If Blue does nothing, they just lose -10. Rational choice: Do nothing. *Feeling:* Frustration of having power but being paralyzed by the risk.

  4.  **Refining the Payoffs (Crucial Step):**

      *   Must avoid "joke numbers." Needs to feel like utility.
      *   Currency: "Security Points" (SP).
      *   Act 1: Gain SP by holding territory.
      *   Act 2: Risk losing all SP.
      *   Act 3: Red gains 5 SP. Blue loses 10 SP. Retaliation = 50% chance of Mutual Loss (0 SP).
      *   *Calculation:* If Blue has 50 SP. Retaliation EV = 0.5 * 0 + 0.5 * (50-10 cost) = 20. Doing nothing = 40. Rational to do nothing.
      *   *Wait, need to ensure they feel the "Overwhelming force."* Blue *could* destroy Red, but it costs Blue everything via the Risk.

  5.  **Addressing Specific Constraints:**

      *   *Observers:* Need a specific sheet. "Record every time a player hesitated," "Record every time a die was rolled," "Record the exact moment a player said 'I have to'."
