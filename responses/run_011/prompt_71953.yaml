      *   *Act 3 Asymmetry:* Hand out role cards secretly at start of Act 3.
      *   *Time:* 75 mins. 15 intro, 15 Act 1, 20 Act 2, 15 Act 3, 10 Debrief. Tight.
      *   *Fallback:* 8 students, 30 mins. Cut Act 1 tutorial, merge Act 1 & 2, focus on Act 3.

  6.  **Developing the "Rationality of Irrationality":**

      *   In Act 1, if I can convince you I *will* climb, you must stop.
      *   Mechanism: The "Sealed Order." Write your move for the next 3 turns. Hand it to me. I know you can't change it. Now I have to yield.
      *   *Correction:* The prompt says "nobody should be told it is available."
