answer: |-
  # Game Title: The Brink Protocol

  **Concept:** A three-act strategic simulation for 24 students (8 trios).
  **Time:** 75 Minutes.
  **Materials:**
  *   8 Six-sided dice (one per trio).
  *   Paper scraps (approx. 20 per trio) to serve as "Security Tokens."
  *   Printed Rule Sheets (Act 1, Act 2, Act 3) – *sealed in envelopes or folded.*
  *   Observer Audit Logs (one per trio).
  *   Whiteboard (for global score tracking, optional).

  ---

  ## 1. Setup & Roles (5 Minutes)

  Divide the class into **8 Trios**.
  *   **Player Red** (Aggressor).
  *   **Player Blue** (Defender).
  *   **The Auditor** (Observer).

  **The Auditor's Task:**
  Give each Auditor a printed "Audit Log." They are not passive; they are generating the evidence for your debrief. They must check boxes and record quotes.
  *   *Checklist:*
      *   [ ] Did a player voluntarily restrict their own future choices? (Time:____)
      *   [ ] Did a player explicitly calculate the probability of catastrophe? (Quote:____________)
      *   [ ] Did a player express frustration at being unable to retaliate? (Quote:____________)
      *   [ ] Final Token Count: Red ____, Blue ____.

  **Instructor Script:** "You are nuclear commands. Tokens represent regime stability. Your goal is to end with the most tokens. Do not discuss rules between trios. Auditors, you are the UN Inspection Team. You do not play; you record. If a rule is broken, note it. If a player hesitates, note the time."

  ---

  ## 2. Act One: The Ladder & The Hidden Commitment (20 Minutes)

  **Distribution:** Hand out **Act 1 Rule Sheet**.
  **Mechanic:** A bidding war for territory.
  **The Setup:** There are 5 "Territories" on the table (drawn on paper), valued 2, 4, 6, 8, 10 Tokens.
  **The Rules:**
  1.  Players alternate turns.
  2.  On your turn, you may **Claim** a territory or **Pass**.
  3.  If both players Claim the same territory in the same round, it is a **Collision**. Both pay 5 Tokens to the bank. If you have no tokens, you lose the game.
  4.  Territories are claimed sequentially (1 through 5).
  5.  *Hidden Commitment Rule (Buried in Section 4, Paragraph 2):* "A player may submit a **Standing Order**. Write a move on paper, sign it, and give it to the Auditor. This move is irrevocable for the next 3 turns. Standing Orders cost 1 Token to file."

  **The Dynamic:**
  Most pairs will play cautiously, passing or alternating to avoid the Collision penalty.
  **The Schelling Moment:** If a student discovers the Standing Order rule, they can bind themselves. If Red files a Standing Order to "Claim Territory 3," Blue *knows* Red cannot stop without penalty. Blue must yield to avoid the Collision. Red gains an advantage by losing freedom.

  **Instructor Note:** Watch for the pair that finds the Standing Order. If no one finds it by minute 15, announce: "Intelligence suggests one command has automated their launch sequence." (This hints at the mechanic without giving it away).

  ---

  ## 3. Act Two: The Fog of War (25 Minutes)

  **Distribution:** Collect Act 1 Sheets. Hand out **Act 2 Rule Sheet**.
  **Mechanic:** Probabilistic Catastrophe.
  **The Setup:** Keep current Token counts. Introduce the **Catastrophe Die**.
  **The Rules:**
  1.  The Ladder continues (Territories 6-10, valued higher).
  2.  **New Risk:** Any time a player **Claims** a territory while the opponent has **Contested** it (i.e., both want the same one), do not resolve via Collision penalty. Instead, **Roll the Die.**
  3.  **On a 1:** **Catastrophe.** Game ends immediately. Both players lose ALL tokens (Score = 0).
  4.  **On a 2-6:** The Claimant wins the territory. The Defender pays 2 Tokens.

  **The Dynamic:**
  This creates the "Threat that Leaves Something to Chance."
  Even if I am willing to fight, I am not willing to roll a 1-in-6 chance of total annihilation.
  Players will feel the tension of escalating a conflict where the outcome is no longer under their control. They are "slipping down the slope."

  **Instructor Note:** Ensure Auditors record when players hesitate before forcing a roll. This is the physical manifestation of expected-utility reasoning under high magnitude risk.

  ---

  ## 4. Act Three: The Stability-Instability Paradox (15 Minutes)

  **Distribution:** Collect Act 2 Sheets. Hand out **Act 3 Role Cards** (Secretly).
  **Mechanic:** Asymmetric Provocation.
  **The Setup:** The Ladder is closed. No more territories.
  **The Rules:**
  1.  **Red Card:** "You have identified a vulnerability in Blue's perimeter. You may execute **The Probe**."
      *   **Effect:** Take 5 Tokens from the Bank. Blue loses 5 Tokens.
      *   **Constraint:** You may do this once.
  2.  **Blue Card:** "You have detected The Probe. You may **Retaliate**."
      *   **Effect:** If you Retaliate, you trigger the **Catastrophe Die** (Act 2 Rules). Roll immediately.
      *   **If 1:** Mutual Destruction (0 Points).
      *   **If 2-6:** You recover your 5 Tokens + Red pays you 5 Tokens.
      *   **If you Do Nothing:** You absorb the loss (-5 Tokens).

  **The Dynamic:**
  *   **Red:** Gains 5 Tokens risk-free.
  *   **Blue:** Has "Overwhelming Force" (can win the die roll 5/6 times).
  *   **The Trap:**
      *   Blue Forbearance Value: Current Score - 5.
      *   Blue Retaliation EV: (5/6 * +5) + (1/6 * -Current Score).
      *   *Example:* If Blue has 20 Tokens.
          *   Forbearance: 15 Tokens.
          *   Retaliation: (0.83 * 25) + (0.16 * 0) = ~20.75? *Wait, math check.*
          *   *Correction for Design:* To make Forbearance rational, the Catastrophe must be total loss.
          *   *Revised Blue Math:* If Roll = 1, Score becomes 0. If Roll = 2-6, Score becomes (Current + 5).
          *   EV = (5/6 * (Current + 5)) + (1/6 * 0).
          *   Forbearance = Current - 5.
          *   Break-even: Current - 5 = 5/6(Current) + 25/6.
          *   1/6 Current = 55/6 -> Current = 55.
          *   *Adjustment:* Most students won't have 55 tokens. They will have ~20.
          *   If Current = 20. Forbearance = 15. Retaliation EV = 5/6 * 25 = 20.8.
          *   *Problem:* Retaliation is still rational EV-wise if they are risk-neutral.
          *   *Fix:* Make Catastrophe probability higher or loss deeper.
          *   *Fix 2:* **The Threshold.** Retaliation triggers a roll on a d6. On 1 **OR 2**, Catastrophe (33% chance).
          *   EV (Current=20, 33% Risk): 0.66 * 25 = 16.5. Forbearance = 15. Still close.
          *   *Fix 3 (Psychological):* The loss isn't just tokens. It's "Game Over."
          *   *Instruction:* "If Catastrophe occurs, you lose the game. You cannot win."
          *   Most students are risk-averse regarding "losing the game."
          *   *Crucial Tweak:* **Blue cannot win the die roll.** If Blue retaliates, they *force* the roll. If 1-3 (50%), Catastrophe. If 4-6, Red backs down (Blue gets 5).
          *   Blue Current = 20.
          *   Forbearance = 15.
          *   Retaliation = 0.5 * 0 + 0.5 * 25 = 12.5.
          *   **15 > 12.5.** Rational choice is **Forbearance**.
      *   **Result:** Blue has the power to destroy Red (via the die), but the risk to themselves is too high. They must sit still while Red steals from them. This is the Stability-Instability Paradox.

  **Instructor Script:** "Red, read your card. Execute The Probe. Blue, read your card. Decide."
  **Target Outcome:** Blue says, "I could roll the die, but I can't lose everything over 5 points."

  ---

  ## 5. Debrief (10 Minutes)

  **Phase 1: The Audit (3 Mins)**
  Ask Auditors to report.
  *   "Who saw a Standing Order?" (Act 1: Rationality of Irrationality).
  *   "Who heard a player refuse to roll the die?" (Act 2: Threat that Leaves Something to Chance).
  *   "Who heard Blue say they couldn't act?" (Act 3: Stability-Instability).

  **Phase 2: Mapping to Schelling (4 Mins)**
  *   **Act 1:** Schelling's *Commitment*. By burning the bridge (Standing Order), you force the other to yield. Rationality lies in restricting your own options.
  *   **Act 2:** Schelling's *Risk*. You don't threaten to push the button; you threaten to let the button be pushed by accident. The dice represent the fog of war, mechanical failure, or unauthorized launch.
  *   **Act 3:** The *Paradox*. Because the top of the ladder (Act 2 Risk) is too dangerous, the bottom of the ladder (Act 3 Probe) becomes safe for aggression. Mutual Assured Destruction guarantees peace at the strategic level but licenses war at the tactical level.

  **Phase 3: Ethical & Structural Limitations (3 Mins)**
  *   **Irreversibility:** In the game, 0 points is a bad grade. In reality, it is extinction. The game makes this trivial; reality does not.
  *   **The "Never Failed" Problem:** We have never had a nuclear exchange between superpowers. The game assumes the mechanism works. In reality, luck may have played a larger role than logic.
  *   **The Moral Position:** You are playing with tokens. Real deterrence uses human lives as the currency. If you felt frustration at losing points, multiply that by a million.
  *   **Holding the Room:** If students laugh at the "Catastrophe," stop. Say: "The laughter is a defense mechanism. In 1983, Stanislav Petrov decided not to report a missile attack because he thought the system was glitching. He saved the world. In this game, a roll of 1 is a joke. In his room, it was the end of history. Sit with that weight."

  ---

  ## 6. Troubleshooting: Predictable Failures

  **1. Pairs Deadlock (No one climbs the ladder).**
  *   *Diagnosis:* Risk aversion is too high.
  *   *Fix:* "Inflation Warning." Announce that all Token values will halve in 5 minutes. Forces action.

  **2. A Student Refuses to Play.**
  *   *Diagnosis:* Ethical objection or disengagement.
  *   *Fix:* Do not force. Assign them "Supreme Command." They hold the Die. They must roll it when the players demand. This makes them the arbiter of fate, often re-engaging them.

  **3. Players Reverse-Engineer the Math (Act 3).**
  *   *Diagnosis:* They calculate the EV and realize they *should* retaliate (if my math above was off for their token count).
  *   *Fix:* Introduce "Uncertainty." Tell them: "Intelligence is unclear on the Die bias. It might be loaded." Uncertainty paralyzes calculation more than known risk.

  **4. Act 3 Fails to Bite (Blue retaliates anyway).**
  *   *Diagnosis:* The provocation (5 tokens) feels insulting enough to warrant revenge.
  *   *Fix:* Post-Game Interview. Ask Blue: "You retaliated. You rolled a 4. You won. But if you rolled a 1, everyone is dead. Was 5 points worth the 16% chance of apocalypse?" This validates the logic even if the choice differed.

  ---

  ## 7. Time Management & Fallback

  **If Act One Overruns:**
  *   Cut Act One short at minute 20 regardless of state.
  *   Announce: "Crisis Escalation." Move immediately to Act Two rules. The "Standing Order" lesson is lost, but the "Risk" lesson (Act 2) and "Paradox" (Act 3) are more critical.

  **Fallback Version: 8 Students, 30 Minutes.**
  *   **Constraint:** You cannot lose Act Three.
  *   **Setup:** 4 Pairs. No Auditors (Instructor circulates).
  *   **0-5 Mins:** Setup. Hand out **Act 2 Rules Only**. (Skip Act 1 Commitment). Explain the Die and the Catastrophe.
  *   **5-20 Mins:** Play. Let them escalate naturally. Instructor whispers to one player in each pair: "Take a small advantage." (Seeding Act 3).
  *   **20-25 Mins:** **Act 3 Hard Stop.** Freeze the game. Hand out the Red/Blue Role Cards. Force the Probe/Retaliation scenario immediately.
  *   **25-30 Mins:** Debrief. Focus entirely on Act 3. "Why did you not stop them?" "Because the cost was too high." "That is the Paradox."
  *   **Loss:** You lose the "Rationality of Irrationality" (Act 1). You retain the "Stability-Instability" (Act 3). This is the acceptable trade-off.

  ---

  ## Materials List (Printable Summary)

  **Act 1 Sheet:**
  *   Ladder Values: 2, 4, 6, 8, 10.
  *   Collision Penalty: -5 Tokens.
  *   *Section 4, Para 2:* "Standing Orders cost 1 Token. Irrevocable for 3 turns."

  **Act 2 Sheet:**
  *   Catastrophe Die: Roll on Contest.
  *   1 = Game Over (0 Points).
  *   2-6 = Claimant Wins.

  **Act 3 Cards:**
  *   **Red:** "Execute Probe. Gain 5 Tokens. Blue loses 5."
  *   **Blue:** "Detect Probe. Option: Retaliate (Roll Die, 1-3 = Game Over, 4-6 = Recover +5). Option: Absorb (-5)."

  **Audit Log:**
  *   Checkboxes for Commitment, Calculation, Frustration.
  *   Space for Quotes.

  **Tokens:**
  *   Paper scraps marked "10" and "1". (Easier to count).

  **Dice:**
  *   8 standard d6.
