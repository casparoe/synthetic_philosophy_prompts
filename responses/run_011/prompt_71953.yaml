      *Idea:* Give them a "Command Deck" of 5 cards. 4 say "Tactical," 1 says "Strategic." If they play "Strategic," they *must* reveal it and cannot retreat next turn. It's buried in the rules text they read themselves.
      *Better:* Give them a blank "Order Sheet." They write orders. If they write "NO RETREAT" and sign it, it's binding. The rules say "Orders are binding if marked Irrevocable." They have to notice that line.

