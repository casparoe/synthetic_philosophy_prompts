      *   *Casualties:* ~10k direct, tens of thousands indirect (famine/disease). Correct order of magnitude (estimates vary, often cited as 71k total regional deaths).
      *   *Temperature:* ~0.4-0.7°C global drop. "Half a degree" is accurate enough.
      *   *1816 Effects:* Snow in New England (June), killing frosts (Aug), grain prices spiked, migration to Ohio. Western Europe failed harvests, bread prices doubled, riots. Ireland typhus (1816+). Villa Diodati (Frankenstein/Vampire).
      *   *Context:* Corn Laws (March 1815), Post-Waterloo demobilization (1815).
      *   *Verdict:* The facts are solid. No major corrections needed, though the "running machine" claim is a specific myth to address later.

  3.  **Apply the Four-Role Scheme (Trigger, Terrain, Amplifier, Alibi):**

      *   *Trigger:* Tambora is the obvious trigger. It starts the chain.
      *   *Terrain:* Post-Napoleonic economic depression, demobilization, Corn Laws. These are the standing conditions.
      *   *Amplifier:* The Corn Laws amplified the price shock. The demobilized labor force amplified the social unrest (more desperate people).
      *   *Alibi:* The weather/volcano used by elites to deflect blame from policy (Corn Laws).

      *   *Contested Sorting:*
          *   Is Tambora *just* a trigger? Or is it Terrain (changing the physical baseline)?
          *   Are the Corn Laws Terrain (standing condition) or Amplifier (making the shock worse)? They were passed *before* the eruption (March 1815 vs April 1815), so they are Terrain that acted as an Amplifier.
          *   Is the migration to Ohio a consequence or a new Terrain for the 1820s?

  4.  **Evaluate "Historical Actor":**
      *   Does calling Tambora an "actor" add anything?
      *   *Argument:* It forces agency onto the non-human. It prevents the "background" treatment. But does it risk anthropomorphizing?
      *   *Value:* It highlights *contingency*. Without Tambora, the Corn Laws might have caused unrest, but not *this* unrest at *this* time. It asserts that history isn't just human intention.

  5.  **The "Alibi" and Amartya Sen:**
      *   Sen's point: Famine = entitlement failure, not just food shortage.
      *   Application: 1816 wasn't just "no food." It was "food exists but is too expensive/hoarded."
      *   Political Work: The Corn Law landlords could say "Blame the volcano, not our tariffs." The weather becomes a shield for policy. This is the strongest part of the user's scheme.

  6.  **Stock Claims (Myth-busting):**
      *   *Running Machine (Draisine):* Often linked to oat shortage -> horse death -> need for human-powered transport. *Verdict:* Tenuous. Drais invented it, but the link to 1816 oats is often overstated. Needs evidence of specific oat scarcity driving the invention *timing*.
      *   *Bengal Cholera:* 1817 cholera pandemic often linked to Tambora climate shifts affecting Bay of Bengal. *Verdict:* Plausible but hard to prove causality vs. trade routes.
      *   *Gothic Novel (Frankenstein):* Rained in at Villa Diodati. *Verdict:* Strong causal link for the *timing* and *mood*, but Mary Shelley's genius is the real variable. Tambora provided the container, not the content.

  7.  **Environmental Determinism Check:**
