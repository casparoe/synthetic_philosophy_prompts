  10. **Final Polish:** Check tone. Ensure no bibliography. Ensure all questions from the prompt are answered. (Sort consequences, flag contests, define 'actor', alibi political work, stock claims, determinism verdict, scheme critique).

      *(Self-Correction on Facts)*: User said Corn Law March 1815, Tambora April 1815. This is crucial. The Corn Law was *not* a response to the eruption. It was pre-existing Terrain. This strengthens the Alibi argument.

      *(Self-Correction on Scheme)*: The user asked "Does 1816 vindicate the critique of environmental determinism, expose a version of it nobody had in mind, or is it just a case where my four roles tangle up?" I need to answer this specifically.

      *(Final Plan)*:
      1. Validate facts (mostly correct).
      2. Apply the 4 roles to specific 1816 events.
