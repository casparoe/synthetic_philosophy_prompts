      *   *Break point:* "Historical Actor." If we call Tambora an actor, do we diminish human responsibility? Yes, that's the Alibi risk. The scheme needs to warn against reifying the Alibi into Truth.
      *   *Specific Claim:* The "running machine" (Laufmaschine) is the weakest link. I should emphasize that.
