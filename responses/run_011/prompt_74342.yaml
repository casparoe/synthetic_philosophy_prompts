answer: |-
  Your first colleague is correct that the model-theoretic mechanism is identical, but your second colleague is correct that the philosophical friction is unique to set theory, though the inflated-versus-deficient distinction itself turns out to be largely verbal once we scrutinize the realist commitments required to sustain it. To see why the assimilation to nonstandard arithmetic is technically sound yet philosophically incomplete, we must distinguish between the formal properties of first-order logic and the semantic expectations we bring to the specific theories involved. Both Peano arithmetic and Zermelo-Fraenkel set theory are first-order theories, and both are subject to the Löwenheim-Skolem theorem, which guarantees that if they have any infinite model, they have a countable one. In the case of arithmetic, a countable nonstandard model contains elements that satisfy the formula for being a natural number but which correspond to no standard integer; in the case of set theory, a countable model contains a set that satisfies the formula for being uncountable but which corresponds to no uncountable set in the metatheory. Structurally, these are mirror images of the same phenomenon: the failure of first-order logic to fix the cardinality of the domain or the extension of certain predicates. Your first colleague is right to insist that nothing new follows about the limitations of first-order logic from the set-theoretic case that did not already follow from the arithmetic case, because the engine driving both results is exactly the same compactness and Löwenheim-Skolem machinery.

  However, your second colleague captures something important about why Skolem's paradox feels more disturbing than the existence of nonstandard numbers, even if the inflated-versus-deficient contrast is not as metaphysically deep as it appears. The distinction relies on a realist perspective that privileges the metatheory as describing the actual universe of sets or numbers. From that vantage point, the nonstandard model of arithmetic indeed contains surplus elements, bogus numbers that code for proofs that do not exist in the standard model, whereas the countable model of set theory lacks a function, a bijection that exists in the metatheory but is absent from the model. Yet this contrast is relative to the direction of the embedding. If we view the countable model of set theory as the standard and the metatheory as the extension, the metatheory is the one inflated with extra bijections. The reason the deficiency feels more biting in set theory is not because of the direction of the error but because of the subject matter. Set theory is intended to be a theory of everything mathematical, including the very notion of cardinality itself. When arithmetic fails to pin down the natural numbers, it fails to pin down its own domain. When set theory fails to pin down cardinality, it fails to pin down a concept that it is supposed to define for all subordinate theories. The paradox bites because set theory claims to formalize the notion of uncountability, yet the formalization admits models where the extension of uncountable is countable. This is not merely a surplus of elements but a failure of the theory to capture the semantic content of its own central concepts, which feels like a deeper deficiency than merely having extra numbers in arithmetic.

  The wrinkle you raise about internalization significantly sharpens this point and suggests that the paradox is not merely an artifact of an external observer looking down on the theory. It is true that set theory cannot prove its own consistency, and thus cannot prove the existence of a model of the full theory, but via the reflection principle combined with the Löwenheim-Skolem theorem and the Mostowski collapse lemma, ZFC proves that for any finite fragment of its axioms, there exists a countable transitive model of that fragment. This means the theory itself validates the existence of structures that satisfy its own axioms locally while being countable from the perspective of the theory itself. This internalization changes the character of the puzzle because it prevents the realist from dismissing the countable models as merely unintended artifacts external to the theory. If the theory proves that there are countable models of its fragments, then the relativity of cardinality is a theorem of the theory, not just a fact about the theory observed from outside. The embarrassment is not just that we can find a countable model, but that the theory itself tells us such models exist. This reinforces the view that uncountability is relative to the model, but it does so from within the system, making it harder to argue that there is a single intended model that escapes this relativity. If the theory itself asserts the existence of countable models of its own fragments, the claim that there is a unique intended universe where the reals are truly uncountable becomes harder to sustain without appealing to resources outside the first-order axiomatization.

  This brings us to Putnam, whose model-theoretic argument against metaphysical realism uses the Löwenheim-Skolem theorem but aims at a different target than the traditional Skolem's paradox. Your impression is largely correct that Putnam thought the ordinary diagnosis missed the point, but the distinction lies in the problem of reference rather than the problem of truth. The standard resolution of Skolem's paradox assumes that we can distinguish the intended model from the unintended ones by appealing to our understanding of what uncountable means in the metatheory. Putnam argues that this appeal is question-begging because there is no fact of the matter that fixes reference to the intended model in the first place. He uses a permutation argument to show that even if we fix all the truth values of all sentences in our language, there are still multiple assignments of objects to terms that satisfy those truth values. The Löwenheim-Skolem theorem shows that unintended models exist, but Putnam's argument is that we cannot even specify which one is intended because the constraints we use to specify it are themselves subject to reinterpretation. For Putnam, the problem is not that there are countable models of set theory, but that there is no operational way to rule them out as the intended model. The standard reply to Skolem's paradox says the bijection is missing from the model but present in the metatheory. Putnam asks what fixes the reference of the metatheory's bijection. If we cannot fix reference to the intended model, then the distinction between the real uncountable sets and the model's countable sets collapses, and the paradox becomes an argument against the possibility of a unique intended interpretation of our language.

  So where does this leave your seminar dispute? The inflated-versus-deficient contrast is real in the sense that it describes the structural relationship between the model and the metatheory, but it is a red herring in the sense that it does not resolve the underlying epistemological problem. Whether the model has too much or too little depends on which side of the glass you are standing, and a skeptic like Putnam will argue that we cannot step outside the glass to check. For a realist who believes in a unique universe of sets, the deficiency matters because it implies our axioms fail to describe that universe uniquely. For a anti-realist or a structuralist, the distinction dissolves because there is no unique universe to be deficient relative to. The internalization of the result shows that the theory itself acknowledges this relativity, which undermines the hope that stronger axioms might fix the intended model without changing the logic. Ultimately, the assimilation to arithmetic is logically correct but philosophically shallow because it ignores the specific role set theory plays as a foundation. The paradox remains significant not because it reveals a contradiction, but because it reveals that first-order logic is insufficient to capture the semantic notion of cardinality that motivates the theory, and no amount of internal axiomatization can fully recover that semantic content without begging the question of reference. You should tell your colleagues that they are arguing about the symptoms of the same disease, where one focuses on the pathology of the model and the other on the pathology of the metatheory, but neither has addressed the diagnosis that our logical tools may simply be too weak to capture the metaphysical commitments we are trying to express.
