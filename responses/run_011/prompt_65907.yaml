answer: |-
  There is no single established term that captures the specific configuration you describe: the combination of *openly acknowledged arbitrariness* at inception, *value-specific rigidity* in maintenance, and *age-dependent resistance* to change.

  However, your phenomenon sits at the intersection of three distinct concepts from institutional economics, philosophy of science, and systems theory. To give you the precision you require, I will first triangulate the existing terms that cover parts of the landscape, then propose a coined term that covers the whole, and finally address the question of philosophical weight.

  ### 1. The Triangulation of Existing Concepts

  Three concepts come close, but each fails to capture the specific nexus you identified.

  **A. Path Dependence (Institutional Economics)**
  *   **What it explains:** This accounts for the inertia. It explains why a system stays in a current state because the cost of switching to a superior alternative is too high due to accrued investments (forms, gauges, contracts).
  *   **Where it runs out:** Standard path dependence usually explains why we stick with *a* system (e.g., QWERTY vs. Dvorak). It does not typically explain why the *specific parameter* of the system becomes rigid. Path dependence explains why we don't change the *rule*; it does not fully explain why we cannot move the *cutoff* by one unit while keeping the rule. It misses the "value-specific" accrual you describe.

  **B. Reification (Philosophy/Sociology)**
  *   **What it explains:** This accounts for the ontological shift. It describes the process by which an abstract concept or human decision is treated as a concrete, natural thing. The number stops being a decision and starts being a "fact."
  *   **Where it runs out:** Reification usually implies a *forgetting* of the human origin. In your cases, the arbitrariness is *not* forgotten; it is recorded in the minutes. The committee members know it is artificial, yet they treat it as immovable. Standard reification suggests a delusion; your phenomenon is a清醒 (clear-eyed) acceptance of a constraint.

  **C. Hysteresis (Physics/Systems Theory)**
  *   **What it explains:** This is the strongest fit for your asymmetry observation. Hysteresis describes a system where the state depends on its history, and where the resistance to change is determined by how long the system has been in its current state, not just the magnitude of the proposed change. It captures the "age of the boundary" dynamic perfectly.
  *   **Where it runs out:** Hysteresis is a mechanical description. It does not account for the *semantic* or *normative* layer—the fact that this is a *rule* governing human behavior and classification, not just a magnetic field retaining polarity.

  ### 2. A Proposed Term: Stipulative Hysteresis

  Since no existing term covers the combination of *arbitrary origin*, *value-specific infrastructure*, and *history-dependent rigidity*, I propose the term **Stipulative Hysteresis**.

  **Definition:**
  *Stipulative Hysteresis* is the phenomenon wherein a numeric threshold, initially adopted via explicit stipulation without ontological justification, acquires resistance to revision proportional to the duration of its enforcement, due to the accretion of administrative, economic, and social dependencies indexed to that specific value.

  **The Edges (What looks like it but isn't):**
  1.  **vs. Technical Lock-in:** If the number were 100 because physics breaks at 101, moving it is impossible due to *nature*. In Stipulative Hysteresis, moving it is impossible due to *paperwork*. If the resistance comes from the material world, it is not this.
  2.  **vs. Dogmatic Conservatism:** If the committee *believed* the number was naturally correct (e.g., "100 is the true safety limit"), resistance would be ideological. In Stipulative Hysteresis, the resistance is transactional. The members *know* 101 is safe, but 100 is expensive to change. If the resistance relies on belief in the number's truth, it is not this.
  3.  **vs. General Convention:** If the group simply needed *any* number to coordinate (e.g., "drive on the left"), moving from Left to Right is hard, but moving the *definition* of Left is nonsensical. Stipulative Hysteresis applies specifically to *scalar thresholds* where a neighbor value is functionally identical but administratively distinct.

  **Is the Open Acknowledgment of Arbitrariness Essential?**
  Yes. Your instinct is correct.
  If the threshold were believed to be principled (a "Natural Kind"), challenging it would be an act of *heresy* or *error*. The defense would be epistemic ("You are wrong about the world").
  Because the arbitrariness is acknowledged, challenging it is an act of *budgeting*. The defense is economic ("You are right about the world, but wrong about the cost").
  This distinction is vital. It means the rigidity is not a failure of knowledge, but a success of coordination. The "truth" of the number has been successfully decoupled from its "validity." The open acknowledgment prevents the rigidity from being mistaken for scientific discovery, but it does not prevent the rigidity from existing. It creates a category of **Known Artificial Facts**.

  ### 3. Philosophical Weight: Institutional Facts vs. Natural Kinds

  You ask whether a history of use supplies something the continuum does not, such that after twenty years the question "which side does this case fall on?" has a *better* answer.

  **The Short Answer:**
  It does not have a *truer* answer, but it has a *more determinate* answer. The history supplies **Deontic Power** (the power to create rights and obligations), not **Ontological Truth** (correspondence to reality).

  **The Analysis:**
  In the philosophy of social ontology (specifically John Searle's framework), you are describing the transition from a **Regulative Rule** to a **Constitutive Rule**.
  *   **Day 1 (Regulative):** "We set the limit at 100 to manage risk." The number regulates pre-existing activity. The continuum exists independently of the rule.
  *   **Year 20 (Constitutive):** "To be compliant is to be below 100." The number *constitutes* the status of the object. The continuum is now irrelevant; the only reality is the rule.

  Does the 20-year-old boundary have a "better" answer?
  *   **Epistemically:** No. A value of 100.5 is physically indistinguishable from 100.0 regarding the underlying condition. The history adds no knowledge about the substance.
  *   **Juridically:** Yes. A value of 100.5 has a definitive status (Non-compliant) that it lacked on Day 1 (where it was a borderline case awaiting a decision).

  **The "Social Kind"**
  Philosopher Ian Hacking distinguishes between "Natural Kinds" (electrons, tigers) and "Social Kinds" (refugees, currencies). Social Kinds interact with the classification of themselves.
  By enforcing the cutoff for 20 years, you have created a **Social Kind**. People have organized their lives, supply chains, and identities around "Being Below 100."
  Therefore, the history of use *does* supply something the continuum does not: it supplies a **Reality of Consequences**.
  On Day 1, the difference between 99 and 101 is negligible.
  On Year 20, the difference between 99 and 101 is the difference between solvency and bankruptcy, or freedom and detention.
  The *meaning* of the number has changed from **Descriptive** (describing the contaminant) to **Performative** (creating the legal status).

  **Conclusion on Weight:**
  It has no bearing on the *nature of the substance*, but it has total bearing on the *nature of the society*.
  If you ask, "Is this substance dangerous?" the 20-year history provides no help. The continuum holds the truth there.
  If you ask, "Is this institution compliant?" the 20-year history provides the *only* truth. The continuum is silent there.

  The accumulation changes everything about how the rule **operates** (it becomes a status function) and nothing about what it **means** (it remains an arbitrary line). The philosophical weight lies in recognizing that human institutions do not run on "truth" in the scientific sense, but on "validity" in the institutional sense. Stipulative Hysteresis is the mechanism by which validity detaches from truth and becomes self-sustaining.

  ### Summary
  *   **Established Terms:** *Path Dependence* (inertia), *Reification* (ontological shift), *Hysteresis* (age-dependent resistance). None fit alone.
  *   **Proposed Term:** *Stipulative Hysteresis*.
  *   **Essential Feature:** The open acknowledgment of arbitrariness distinguishes this from dogma; the resistance is transactional, not ideological.
  *   **Philosophical Weight:** The history converts the number from an *Epistemic Tool* (measuring the world) to a *Deontic Power* (creating social reality). It creates a "better" answer only in the juridical sense of determinacy, not in the scientific sense of accuracy.
