prompt: |-
  so my labmate and I have been going in circles about pain asymbolia for like three weeks and it's starting to wreck our reading group. quick recap of the case as I understand it, since everything turns on it: patients with lesions around the posterior insula / parietal operculum who, when you pinch them or bring something hot near their hand, say yes that's pain, can localize it and describe its quality, but just don't seem to mind — no grimace, no withdrawal, sometimes they chat or even laugh, and in at least one reported case the patient let a cigarette burn down between her fingers without moving. They aren't globally flattened: fear and disgust look intact, they can tell you pain is supposed to be bad, they still classify the stimulus as painful. Then on one side you have the morphine and cingulotomy reports, which as far as I can tell amount to the pain still being present but distant, no longer bothering the person; and on the other side the chili-heads and deep-tissue-massage people who claim to enjoy the hurting, wounded soldiers who turn down analgesia, and people born without pain who end up with chewed-through tongues and fractures that never got noticed. I'm trying to write the intro to a proposal about weighing pain relief against other claims in priority setting, and I can't do it until I know what I'd even be asking a theory to do.

  The fight itself: my labmate thinks asymbolia shows the badness can be peeled clean off the experience, so what's left is neutral sensation and all the badness lives in the wanting-it-to-stop; I think that makes "unpleasant" empty and also doesn't explain why the asymbolic still calls it pain at all. Neither of us is willing to just declare the patient a misreporter. So before we read any more accounts of pain's badness, write me the desiderata — what any adequate theory of why pain is bad for the person who feels it has to deliver. The cases it must get right (asymbolia, the masochist, the sedated report, the congenitally painless, chronic pain where the badness seems to be less about any given moment of feeling and more about what it does to a life, infants and non-human animals), the distinctions it can't collapse (unpleasantness vs. the desire for it to stop vs. the judgment that this is bad for me vs. pain's being bad simpliciter; intensity vs. badness; pain vs. suffering; how-it-feels-bad vs. why-it's-bad-for-you), and the stuff it has to stay consistent with — that self-reports are neither incorrigible nor worthless, that pain seems to come in degrees that we compare, that it owes some account of why causing pain is normally wrong without making consensual masochism impossible, that it should say whether pain is special or just one member of a class of nasty experiences that also includes nausea and dyspnea and itch. For each requirement give the case or consideration behind it and what breaks if a theory ignores it. A table is fine for the list itself.

  Be honest about which of these are real constraints on any theory and which are just the house preferences of one camp — I suspect "the badness has to be in the phenomenology" is doing sneaky work somewhere, but I can't say where or why. Flag any subset you think can't be jointly satisfied given the evidence above; my bet is that requiring the asymbolic's sensation to be phenomenally identical to ordinary pain while also requiring badness to explain motivation is already inconsistent, but show me the actual pressure point and whether the empirical setup even licenses the identity assumption. Then tell me which single requirement knocks out the most candidates, and close with a short scorecard, three or four lines each, of the obvious contenders: badness intrinsic to the feeling, badness in the wanting-it-to-stop, badness as the experience representing bodily damage as bad, and badness as not in the experience at all but in what pain does to a person's projects. no citations or reading lists please, I've got a stack by the bed — and keep it concrete, I don't want requirements like "must be explanatorily adequate," I want the ones someone could actually fail.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and their labmate are stuck in a debate about pain asymbolia for three weeks, affecting their reading group. They are writing a proposal intro about prioritizing pain relief.
      *   **Core Problem:** They need to define *desiderata* (requirements) for a theory of why pain is bad for the person feeling it. They can't proceed until they agree on what a theory needs to explain.
      *   **Specific Task:** Write a list of desiderata (cases to get right, distinctions to maintain, consistency constraints). Use a table for the list. Be honest about which constraints are real vs. "house preferences." Flag any inconsistent subsets (impossible to satisfy jointly). Identify the single requirement that knocks out the most candidates. Provide a scorecard of four specific contender theories.
      *   **Constraints:** No citations/reading lists. Keep it concrete (no vague "explanatorily adequate"). Address the specific tension between asymbolia and the phenomenology of pain.
      *   **Tone:** Academic but direct, acknowledging the frustration ("wreck our reading group"), analytical, precise.

  2.  **Deconstruct the Debate (Asymbolia & Pain Badness):**
      *   *The Case:* Posterior insula/parietal operculum lesions. Patient detects pain, localizes it, labels it "pain," but lacks the negative affect/motivation to stop it (no grimace, no withdrawal).
      *   *Labmate's View (Motivational/Desire View):* Badness is separable from sensation. Sensation is neutral; badness = desire for it to stop. Asymbolia proves this separation.
      *   *User's View (Phenomenal/Intrinsic View):* Separating badness makes "unpleasant" empty. If it's not unpleasant, why call it pain?
      *   *The Tension:* If asymbolics feel the *same* sensation as normals but without badness, then badness isn't intrinsic to the sensation. If badness *is* intrinsic, asymbolics must feel something different (which challenges their self-report or the lesion interpretation).

  3.  **Drafting the Desiderata (The Table):**
      *   Need to cover: Cases (Asymbolia, Masochism, Congenital Analgesia, Chronic Pain, Infants/Animals), Distinctions (Unpleasantness vs. Desire vs. Judgment, Intensity vs. Badness, Pain vs. Suffering), Consistency (Self-reports, Normativity, Specialness).
      *   *Constraint:* Must be concrete.
      *   *Drafting items:*
          1.  Asymbolia dissociation (Sensation intact, motivation gone).
          2.  Masochism dissociation (Sensation intact, motivation reversed/neutralized).
          3.  Congenital Analgesia (No sensation, no badness, but damage occurs).
          4.  Chronic Pain (Badness persists without acute damage).
          5.  Non-human/Infant (Badness without complex judgment).
          6.  Unpleasantness vs. Desire (Can't reduce one entirely to the other).
          7.  Intensity vs. Badness (A sharp pin vs. a migraine).
          8.  Normativity (Why causing pain is wrong vs. consent).
          9.  Self-Report Status (Not god-like, not useless).

  4.  **Analyzing Constraints vs. Preferences:**
      *   *Real Constraints:* Empirical data (lesion locations, behavioral responses), logical consistency (can't be A and not-A), normative plausibility (why we care about pain relief).
      *   *House Preferences:* "Badness *must* be in the phenomenology." This is the user's hunch. It's a metaphysical commitment, not an empirical datum.
      *   *The Inconsistency:* The user suspects requiring asymbolic sensation to be *phenomenally identical* to ordinary pain *while* requiring badness to explain motivation is inconsistent.
      *   *Analysis:* If sensation = S, and Ordinary Pain = S + Badness, and Asymbolia = S + No Badness.
          *   If Badness is intrinsic to S, Asymbolia is impossible (or they aren't feeling S).
          *   If Badness is separate (e.g., desire), Asymbolia is easy, but then why does S usually trigger Badness?
          *   *The Pressure Point:* The empirical setup *doesn't* license the identity assumption. We only have self-report ("yes that's pain") and localization. We don't have access to the qualia. Assuming phenomenal identity is the "house preference" causing the gridlock.

  5.  **Identifying the "Killer" Requirement:**
      *   Which requirement kills the most theories?
      *   *Candidate:* The Asymbolia/Masochism Dissociation Constraint.
      *   *Why:* Intrinsic theories struggle with Asymbolia (how can you have pain without badness?). Motivational theories struggle with Masochism/Chronic Pain (why is it bad if I want it? / why is it bad if it doesn't stop anything?). Representational theories struggle with Phantom/Chronic pain (no damage to represent).
      *   *Selection:* The **Asymbolia/Masochism Dissociation** (The ability to separate sensation from affect/motivation). It forces theories to be hybrid or complex. Pure Intrinsic theories die on Asymbolia. Pure Motivational theories die on Masochism/Indifference.

  6.  **Developing the Scorecard:**
      *   *Theory 1: Intrinsic Phenomenalism (Badness is in the feeling).*
          *   Pros: Explains why pain feels bad.
          *   Cons: Struggles with Asymbolia (must claim they feel something different).
      *   *Theory 2: Motivational/Desire (Badness is wanting it to stop).*
          *   Pros: Explains Asymbolia perfectly.
          *   Cons: Struggles with Masochism (wanting it to continue) and Chronic Pain (wanting relief but feeling no damage).
      *   *Theory 3: Representationalism (Experience represents damage as bad).*
          *   Pros: Explains the link to body.
          *   Cons: Phantom limb pain (no damage), Asymbolia (do they represent it as bad?).
      *   *Theory 4: Interferential/Project View (Badness is disruption of life/projects).*
          *   Pros: Explains Chronic Pain burden.
          *   Cons: Struggles with momentary pain (stubbing toe) that doesn't disrupt projects but is still bad.

  7.  **Refining the Output:**
      *   *Tone Check:* Ensure it sounds like a colleague helping out, not a textbook. Acknowledge the "three weeks" friction.
      *   *Formatting:* Use the requested table for desiderata.
      *   *Honesty:* Explicitly call out the "Phenomenal Identity" assumption as the likely culprit.
      *   *Constraint Check:* No citations. Concrete requirements.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I address the "congenitally painless" case properly?
      *   *Fix:* Ensure the desiderata mentions that lack of sensation = lack of badness (usually), distinguishing it from asymbolia.
      *   *Critique:* Is the "Killer Requirement" clearly justified?
      *   *Fix:* Make sure to explain *why* it filters out the simple versions of the theories.
      *   *Critique:* Did I answer the specific question about the inconsistent subset?
      *   *Fix:* Yes, highlight the triad: (1) Asymbolic sensation is identical to normal sensation, (2) Badness is intrinsic to sensation, (3) Asymbolics lack badness. You can only pick two.

  9.  **Final Polish:** Check against the prompt's specific phrasing ("wreck our reading group", "scorecard", "no citations"). Ensure the distinction between "bad for me" and "bad simpliciter" is touched upon in the desiderata. (Proceed to generate output).

  *(Self-Correction on the "Killer Requirement"):* Actually, the requirement that knocks out the most *simple* candidates is the **Dissociation Constraint** (handling both Asymbolia and Masochism). Pure Intrinsic theories fail Asymbolia. Pure Motivational theories fail Masochism. Only hybrid or complex theories survive. I will frame it that way.

  *(Self-Correction on "Inconsistent Subset"):* The user suspects: "requiring the asymbolic's sensation to be phenomenally identical to ordinary pain while also requiring badness to explain motivation is already inconsistent."
  Actually, the inconsistency is:
  1. Asymbolic sensation is phenomenally identical to ordinary pain (regarding sensory-discriminative aspects).
  2. Ordinary pain's badness is intrinsic to its phenomenology.
  3. Asymbolics feel no badness.
  If 1 & 2 are true, 3 is false. If 2 & 3 are true, 1 is false (they feel something different).
  The empirical setup licenses sensory identity (localization, intensity rating) but *not* affective identity. I need to point out that assuming *total* phenomenal identity is the mistake.

