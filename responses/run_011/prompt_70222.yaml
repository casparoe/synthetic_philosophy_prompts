answer: |-
  # ILLOCUTIONARY LOGIC: A DECISION TREE FOR DISPUTED UTTERANCES

  ## 1. THE TREE
  *Answer each node using only the transcript and a neutral description of the circumstances. Do not skip ahead.*

  **Node 1: The Voidness Condition**¹
  Is there an accepted extra-linguistic procedure governing this act such that, if the procedure is violated (e.g., wrong words, wrong person, wrong time), the act is **void** (it simply does not occur) rather than merely insincere, rude, or unauthorized?
  *   **YES** → Go to Node 5 (Standing).
  *   **NO** → Go to Node 2 (Direction of Fit).

  **Node 2: Direction of Fit**
  Does the utterance purport to match how the world *already is* (or will be independently), or does it purport to make the world *become* as described?
  *   **MATCH (Word-to-World)** → Go to Node 3 (Time).
  *   **MAKE (World-to-Word)** → Go to Node 4 (Conduct).

  **Node 3: Time of Content**
  Does the utterance describe a state of affairs existing now or in the past, or one located in the future?
  *   **NOW/PAST** → Go to Node 6 (Uptake).
  *   **FUTURE** → Go to Node 6 (Uptake). *(Note: Distinguishes Assertion/Apology from Prediction/Warning)*.

  **Node 4: Whose Conduct?**
  If the act succeeds, whose future voluntary conduct is primarily obligated to change to satisfy the utterance?
  *   **SPEAKER** → Go to Node 7 (Valence).
  *   **HEARER** → Go to Node 5 (Standing).

  **Node 5: Speaker Standing**
  Does the speaker require specific institutional authority to perform this act, or is standing granted by general linguistic competence?
  *   **INSTITUTIONAL AUTHORITY REQUIRED** → **Leaf: Institutional Declaration** (if Node 1=YES) / **Leaf: Command** (if Node 4=HEARER).
  *   **GENERAL COMPETENCE** → **Leaf: Resignation** (if Node 1=YES) / **Leaf: Request** (if Node 4=HEARER).

  **Node 6: Uptake and Completion**
  If the hearer understands perfectly but remains psychologically unmoved (no fear, gratitude, belief change, or forgiveness), is the speaker's part of the act fully complete?
  *   **YES (Complete)** → **Leaf: Assertion** (if Node 3=NOW) / **Leaf: Prediction** (if Node 3=FUTURE).
  *   **NO (Requires Uptake)** → **Leaf: Apology** (if Node 3=NOW/PAST) / **Leaf: Warning** (if Node 3=FUTURE).

  **Node 7: Valence and Conditionality**
  Is the projected outcome presented as beneficial to the hearer, and is the act conditional on the hearer's acceptance?
  *   **BENEFICIAL + CONDITIONAL** → **Leaf: Offer**.
  *   **BENEFICIAL + UNCONDITIONAL** → **Leaf: Promise**.
  *   **DETRIMENTAL** → **Leaf: Threat**.

  ***
  ¹ *Footnote: We do not begin with "Constative vs. Performative" because that axis conflates the mode of speech with its success conditions. All utterances are acts; all acts can misfire. This node isolates the specific logical feature of institutional nullification.*

  ## 2. THE LEAVES
  *Each leaf includes its "awkward commitment"—the claim a defender must make.*

  1.  **Institutional Declaration:** "My saying so makes it so, solely because of my office, regardless of the facts."
  2.  **Resignation:** "I am removing myself from a role, and you cannot stop me by refusing to hear it."
  3.  **Command:** "You must do this because I have the power to enforce it, not because it is reasonable."
  4.  **Request:** "I want you to do this, but you have the right to refuse without penalty."
  5.  **Assertion:** "I guarantee this is true, regardless of whether it helps anyone or changes anything."
  6.  **Prediction:** "I claim to know the future without intending to control it."
  7.  **Apology:** "I admit I was wrong and owe you restitution, regardless of whether you forgive me."
  8.  **Warning:** "I know something bad will happen to you, and I am not the one causing it."
  9.  **Offer:** "I am willing to do this for you, but only if you want it."
  10. **Promise:** "I am now bound to do this even if it becomes impossible or against my interest."
  11. **Threat:** "I intend to harm you, and I am telling you so to constrain you."
  12. **Bet (Non-Standard):** "I am willing to lose resources solely to prove I was right."
  13. **Endorsement (Non-Standard):** "I am willing to be held responsible for a claim I did not originate."

  ## 3. DIAGNOSTICS

  **A. Indistinguishable Pairs**
  *   **Warning vs. Prediction of Harm:** The tree separates these at Node 6 (Uptake). However, if a speaker predicts harm *knowing* the hearer needs to know, is it a warning? The tree relies on the speaker's intent (beneficial), which is not always visible in the transcript. *Further fact needed:* Evidence of the speaker's intent to aid the hearer.
  *   **Promise vs. Offer:** Both are Speaker-Conduct/World-to-Word/Beneficial. The tree separates them at Node 7 (Conditionality). However, implicit promises often look like offers. *Distinction collapses if:* The speaker's commitment is vague regarding the hearer's acceptance.

  **B. Empty/Impossible Cells**
  *   **Hearer Conduct + Word-to-World:** (e.g., "You will leave" as a description). This leads to **Prediction**, not Directive. If the speaker tries to *make* the hearer leave without authority, it is a **Threat** (Speaker will force you) or a **Request**. A pure "Hearer Conduct + Describe" is logically incoherent as an illocutionary act; it is merely a guess.
  *   **Institutional Declaration + No Standing:** (e.g., A civilian sentencing a criminal). This cell is **Void**. The act does not exist. It is not a "bad declaration"; it is no declaration.
  *   **Command + No Authority:** (e.g., A stranger ordering you). This cell is **Unattractive**. It functions pragmatically as a Request or a Threat, but logically fails as a Command.

  ## 4. WORKED CASES

  **Case 1: The Landlord**
  *"If the money is not in the account by Friday, I will start eviction proceedings."*
  *   **Path:** Node 1 (No, civil procedure is not void if spoken) → Node 2 (Make, Speaker acts) → Node 4 (Speaker Conduct) → Node 7 (Detrimental).
  *   **Exit:** **Threat**.
  *   **Verdict:** **Match.** Though often called a "warning," the landlord controls the harm. The awkward commitment ("I intend to harm you") fits the leverage dynamic.

  **Case 2: The Politician**
  *"When I am re-elected, taxes will come down."*
  *   **Path:** Node 1 (No) → Node 2 (Make, implies control) → Node 4 (Speaker Conduct) → Node 7 (Beneficial/Unconditional).
  *   **Exit:** **Promise**.
  *   **Verdict:** **Mismatch.** The tree yields *Promise*, but politicians often intend *Prediction* (Node 2: Match). The fault lies at **Node 2**. Ambiguity between "I will make it happen" vs. "I foresee it happening" is the core rhetorical evasion.

  **Case 3: The Lapsed Officiant**
  *Beach ceremony; licence lapsed.*
  *   **Path:** Node 1 (Yes, marriage is conventional/void) → Node 5 (Standing: Authority Required).
  *   **Exit:** **Institutional Declaration** (Void).
  *   **Verdict:** **Match.** The act did not happen. The tree correctly identifies that the "marriage" leaf is unreachable due to the Voidness condition.

  **Case 4: The Sarcastic Apology**
  *A says "I'm sorry"; B hears it as sarcasm.*
  *   **Path:** Node 1 (No) → Node 2 (Match, acknowledging past fault) → Node 3 (Past) → Node 6 (Uptake: No, requires forgiveness/recognition).
  *   **Exit:** **Apology** (Failed).
  *   **Verdict:** **Mismatch.** The tree classifies the *attempt* as Apology. It does not capture the *failure* due to uptake. The fault is at **Node 6**. The tree assumes uptake determines the *type*, but here uptake determines *success*.

  **Case 5: The Actor-Judge**
  *Actor says "I sentence you" on stage.*
  *   **Path:** Node 1 (Yes, sentencing is conventional) → Node 5 (Standing: Authority Required).
  *   **Exit:** **Institutional Declaration** (Void).
  *   **Verdict:** **Match.** The circumstances (acting) negate standing. The tree correctly routes to Voidness.

  ## 5. CLOSING NOTE

  **The Most Likely Error: Node 6 (Uptake and Completion)**
  Under time pressure, students confuse **consequences** with **completion**. They will ask: "Did the hearer obey?" or "Did the hearer believe it?"
  *   **The Wrong Turn:** Assuming a Command fails if disobeyed, or an Assertion fails if disbelieved.
  *   **The Spurious Leaf:** This error pushes **Commands** into **Requests** (because the hearer has the power to refuse) or **Assertions** into **Predictions** (because the truth is unsettled).
  *   **Correction:** Remember: A Command is complete when issued; the *obedience* is a separate event. A Command that is disobeyed is still a Command. A Request that is refused is still a Request. Node 6 asks if the *illocutionary act* is complete, not if the *perlocutionary effect* was achieved.
