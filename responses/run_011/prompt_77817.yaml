  (i) **Scenario and Evidence**

  The T-7 Prototype was a single-unit flow diverter fabricated for the Oakhaven Municipal Waterworks. Its internal geometry was machined to 0.01 mm tolerance, symmetric about the vertical axis. A spring-loaded release mechanism directed inflow to Output A or Output B. Elena, the safety officer, authorized the single operational run based on the fabrication dossier. The dossier specified the geometry and release tension but omitted external modifications. Unknown to Elena, a technician had installed a calibrated magnetic shim downstream during assembly. A separate bench rig, identical in geometry to the T-7 and equipped with the shim, recorded 1000 test runs. In those runs, flow to Output A occurred 750 times. The T-7 was dismantled immediately after its single operational run. Flow directed to Output B. The stakes involved certification for city-wide deployment; a failure required costly redesign. Elena's evidence consisted solely of the fabrication dossier. The shim data remained in a sealed archive until post-run audit.

  **Evidence Bullets:**
  1. Fabrication dossier confirming geometric symmetry.
  2. Release mechanism tension specifications.
  3. No record of external modifications in dossier.
  4. No access to bench rig logs prior to authorization.
  5. Knowledge of single-run deployment constraint.

  (ii) **Three Derivations**

  **Frequentist:** The value is 0.75. The relevant collective is not the class of "unique prototypes" (size 1) but the class of "T-7 geometry plus shim configuration," instantiated in the bench rig. The 1000-run series approximates the limit of relative frequencies for this setup. The gap between sample (750/1000) and limit is treated as negligible due to calibration. This number is answerable to the stable long-run frequency of the physical conditions actually governing the run.

  **Propensity:** The value is 0.5. The relatum is the T-7 device itself, defined by its documented symmetric geometry. The shim is an external mask, not part of the device's intrinsic disposition. Attributing propensity to the total situation (device + shim) would conflate the disposition with transient conditions, losing the explanatory power of the device's design. This number is answerable to the physical symmetry of the token device.

  **Subjective Bayesian:** The value is 0.5. Elena's evidence set contains only the symmetric dossier. By the Principle of Indifference, symmetric evidence licenses equal division of belief between A and B. This number is answerable to Elena's information state at the moment of authorization.

  (iii) **The Perturbation: Archive Opened**

  **Frequentist:** Remains 0.75. The existence of the bench series and its counts are facts independent of discovery.
  **Propensity:** Remains 0.5. The device's geometry is unchanged by the audit. (If the relatum shifted to 'total situation', it would move to 0.75, but this abandons the device-relative view).
  **Subjective Bayesian:** Moves to 0.75. The new evidence (shim data) updates the agent's information state, aligning credence with the known bias.

  **Explanation:** The Subjective value moves because it is answerable to evidence, which changed. The Frequentist and Propensity values do not move because they are answerable to physical facts (collective behavior and device structure) that remained constant.

  (iv) **Design Audit**

  **Feature Doing the Work:** The concealed magnetic shim. It creates a divergence between the device's symmetric structure (Propensity/Evidence) and the total setup's causal behavior (Frequency).

  **Removal Tests:**
  1. **Bias Never Installed:** F becomes 0.5 (bench series would match symmetry). P remains 0.5. S remains 0.5. All verdicts converge; the case collapses.
  2. **Archive Never Found:** F remains 0.75 (ontological fact). P remains 0.5. S remains 0.5 (no evidence update). The divergence persists ontologically but remains epistemically hidden.
  3. **Mass-Produced Batch:** F becomes trivially robust (reference class is obvious). P might shift to type-level propensity (still 0.5). S remains 0.5. Uniqueness was required to stress the F reference-class problem.

  **Question-Begging Check:** Candidly, yes. The case begs the question against the strict frequentist by stipulating the bench series as the *relevant* collective. A strict frequentist could argue the unique run belongs to no collective, rendering F undefined. The case forces the frequentist to accept simulated repeatability as sufficient for actual uniqueness.

  (v) **Counterattack**

  **Target:** Propensity Theory (treated as incorrect below).
  **Break:** A defender argues propensity attaches to the *total causal situation*, shim included. Thus the pre-discovery propensity was 0.75, not 0.5.
  **Success:** This breaks the specific verdict (0.5) but only by redefining the relatum from 'device' to 'situation'. It succeeds in saving the theory from falsification but concedes that the original device-relative verdict was simply incorrect.

  **Final Position**

  This case best supports **Frequentism** as the arbiter of objective truth conditions, though it validates Bayesianism as the arbiter of rational action. The interpretation whose pre-discovery verdict is shown to be *simply incorrect* is **Propensity Theory** (restricted to the device). It posits a physical disposition (0.5) that fails to match the physical reality of the outcome-generating setup (0.75). Unlike the Bayesian verdict, which is explicitly relative to evidence and thus rational though uninformed, the Propensity verdict claims ontological status about the world. Since the world included the shim, the claim that the setup disposed toward 0.5 is false, not merely incomplete.

  \answer{F=0.75, P=0.5, S=0.5, S*=0.75, W=P}
