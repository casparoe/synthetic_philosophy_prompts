answer: |-
  Good morning.

  For thirty-five years, I worked at a national measurement laboratory. My job was calibration. If a scale said one kilogram, my job was to ensure it matched the physical reality of a kilogram, anywhere on earth. I retired believing that if a instrument is calibrated, it is honest.

  Then I began studying the mathematics of fairness. I learned that in human systems, a model can be perfectly calibrated—its predictions matching reality on average—and still distribute its mistakes unjustly. It can be technically impeccable and still answer a question nobody asked.

  We are here because that distinction matters. It matters to the clinicians who trusted the tool. It matters to the mothers who were sent home when they should have been admitted. And it matters to Dr. [Name], the epidemiologist we honor today.

  Dr. [Name], you built this model to save lives. You worked with the data you had, the methods we trusted, and the intent to protect mothers. We honor that commitment. We honor your career. But honoring you does not require the community to soften its testimony. Both things can be true: you served with integrity, and the tool caused harm. We do not ask you to apologize for the limits of what was known. We ask only that we all acknowledge the limits of what was built.

  This brings us to the mathematics that divides this room, and the truth that must unite us.

  Half of you know the impossibility theorem cold. For the others, specifically the families who have lived with the consequences, I want to explain what it means without hiding behind it.

  Imagine two groups of 100 pregnant women. In Group A, 10 women will develop severe complications. In Group B, 30 women will. This difference might be biological, or it might be the result of decades of unequal access to care. For this math, the cause doesn't change the numbers.

  Now, imagine a risk model that is perfectly calibrated. When it says a woman has a 20% risk, exactly 20% of those women get sick. To achieve this calibration across both groups, the model must flag more women in Group B as "high risk" than in Group A, because the underlying reality is higher.

  Here is the cost. Because the model flags more women in Group B, it also generates more false alarms in Group B. More healthy women in Group B are told they are high risk, subjected to unnecessary interventions, stress, and cost. Meanwhile, to keep the scores calibrated, the rate of missed cases—the women sent home who get sick—will differ between the groups.

  You cannot have perfect calibration, equal false-positive rates, and equal false-negative rates all at once. If the underlying risks differ, the math forbids it.

  The statisticians in this room know this. But knowing it is not the same as accepting it.

  Too often, this theorem is used as a shield. People say, "The math made us do it. We couldn't have both accuracy and equality." That is a lie. The math does not make choices. Humans do.

  The theorem tells us there is a trade-off. It does not tell us which side of the trade-off to stand on. It does not tell us whether it is worse to unnecessarily intervene on a healthy mother, or to send home a sick one. It does not tell us whether one community should bear the burden of false alarms so another can feel the system is "accurate."

  That is not a mathematical decision. It is a moral one. It is a political one. It belongs to us.

  For too long, we have hidden that decision inside the code. We let the algorithm choose the error distribution by default, simply because we optimized for calibration and called it "truth."

  This retreat is not about proving who is right. The statisticians are right about the constraints. The coalition is right about the harm. The conflict exists because we tried to solve a moral problem with a technical solution.

  So, where do we go from here? We stop asking the model to be impossible. We start asking ourselves what is acceptable.

  If we cannot eliminate the trade-off, we must choose it openly. We must decide, as a county, which errors we can tolerate and who gets to make that choice. If we prioritize catching every complication, we must admit we will increase false alarms, and we must resource the community to handle that burden. If we prioritize reducing unnecessary interventions, we must admit we will miss cases, and we must build safety nets for those failures.

  Dr. [Name] built the map. But she does not drive the car. We do.

  The mothers in this room have waited three years for us to admit that the model is not a judge. It is a tool. And like any tool in my old lab, it is only as good as the hands that wield it and the values that guide it.

  Let us spend these two days not debating the impossibility of perfection, but negotiating the reality of our choices. Let us ensure that when we leave here, the trade-offs are visible, the decisions are ours, and the burden is no longer borne silently by those least able to carry it.

  Thank you.
