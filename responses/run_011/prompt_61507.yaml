          *   *Defender Concession:* They admit the *intuition pump* might be leaky, but insist the *principle* holds via independent argument (actual sequence). The stalemate suggests the thought experiment isn't doing the heavy lifting alone.

      *   **Point 3: Collateral Commitments (Causation by Omission).**
