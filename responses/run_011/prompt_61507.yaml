          *   *Defender Concession:* They must concede that if the neuroscience shows indeterminism is fundamental *and* untrackable, the *practical* use of Frankfurt cases drops, but the *logical* point about PAP remains. *However*, if the user's essay ties the philosophy to the neuroscience, this is a major vulnerability.

      *   **Point 5: Practical Implications (Law/Duress).**
          *   *Critique:* Actual-sequence view holds agents responsible even if they "would have done it anyway" (structural pressure). Law often excuses based on lack of alternatives (duress).
