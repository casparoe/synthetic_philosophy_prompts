          *   *Verdict:* Partly Right (Conceptually coherent, but vulnerable to the "arbitrariness" critique).

      *   *(4) Paulo:* If picking is deliberate, you prefer picking to not-picking. That's a preference/asymmetry. If not deliberate, it's noise (referencing step 2).
