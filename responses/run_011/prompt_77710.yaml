answer: |-
  # The Dispute Diagnostic Tree

  **Instructions:** Start at Question 1. Follow the **Yes** or **No** path until you reach a **LEAF**. Answer based on what you would *actually* do, not what you *should* do.

  ### The Branch Nodes

  **Q1.** If you had not spent a single penny yet and were offered this case fresh today, would you start it?
  *   **Yes:** Go to Q2.
  *   **No:** Go to Q3.

  **Q2.** Has your estimate of the likelihood of winning increased after paying legal invoices, even when no new evidence was found?
  *   **Yes:** Go to Q4.
  *   **No:** Go to Q5.

  **Q3.** If you stopped today, is the primary pain the money already gone, or the opponent keeping the land?
  *   **Money Gone:** Go to Q6.
  *   **Opponent Keeping:** Go to Q7.

  **Q4.** If a neutral expert reviewed your file and said your odds dropped, would you doubt their expertise?
  *   **Yes:** **LEAF A**
  *   **No:** Go to Q5.

  **Q5.** If your opponent sold the house and the new owner offered to drop the claim, would your desire to continue drop by more than half?
  *   **Yes:** Go to Q8.
  *   **No:** Go to Q9.

  **Q6.** If you could settle today with a gag order so no neighbor ever knew you paid or lost, would you take it?
  *   **Yes:** Go to Q10.
  *   **No:** Go to Q11.

  **Q7.** If you won the land but paid triple its value in fees, would it feel like a victory?
  *   **Yes:** Go to Q11.
  *   **No:** Go to Q12.

  **Q8.** Is the goal to recover the money spent, or to secure the property?
  *   **Recover Money:** **LEAF B**
  *   **Secure Property:** **LEAF C**

  **Q9.** Have you stated your intention to win to friends, family, or neighbors?
  *   **Yes:** Go to Q10.
  *   **No:** Go to Q12.

  **Q10.** If you could quit silently with no one knowing, would you feel relief or shame?
  *   **Relief:** **LEAF D**
  *   **Shame:** **LEAF E**

  **Q11.** Does the act of paying lawyers feel like "staking a claim" rather than buying a service?
  *   **Yes:** **LEAF F**
  *   **No:** Go to Q12.

  **Q12.** If the court process paused for a year, would your urge to fight fade?
  *   **Yes:** **LEAF G**
  *   **No:** **LEAF H**

  ---

  ### The Leaves

  **LEAF A: The Investment-Confidence Loop**
  *   **Prediction:** You will continue spending as long as you can afford it, because spending *creates* your certainty, not evidence.
  *   **Cure:** Freeze your probability estimate in writing *before* authorizing any further spend; if the number doesn't move with evidence, you must stop.

  **LEAF B: The Dollar Auctioneer**
  *   **Prediction:** You will bid past the value of the prize solely to ensure the other bidder pays more than you, or to avoid being the second-highest loser.
  *   **Cure:** Collude with the rival to split costs and drop, or treat the rival's bid as irrelevant noise.

  **LEAF C: The Calculated Holdout**
  *   **Prediction:** You are not biased; you will stop immediately if the financial math flips negative or new evidence lowers your odds.
  *   **Cure:** None required; continue to monitor the expected value strictly.

  **LEAF D: The Public Story**
  *   **Prediction:** You would quit if it were private, but you cannot quit because you have built a public narrative of victory.
  *   **Cure:** Anonymize the settlement or reframe the public story as "cutting losses to invest elsewhere."

  **LEAF E: The Vindicator**
  *   **Prediction:** You are fighting to prove you were right originally, not to get the land; money is secondary to being validated.
  *   **Cure:** Separate your self-worth from the verdict; accept that courts decide rights, not truth.

  **LEAF F: The Magical Thinker**
  *   **Prediction:** You believe the money itself exerts influence on the outcome, as if payment purchases righteousness.
  *   **Cure:** Switch to fixed-fee billing to break the link between payment volume and case progress.

  **LEAF G: The Drifter**
  *   **Prediction:** You have no active drive to win; you are simply failing to make the active decision to quit.
  *   **Cure:** Set a hard calendar date for withdrawal; treat inaction as a decision to lose.

  **LEAF H: The Loss Averter**
  *   **Prediction:** The pain of realizing the loss is psychologically twice as heavy as the joy of a potential win, paralyzing you.
  *   **Cure:** Reframe the sunk cost as a "tuition fee" for a lesson learned, closing the account mentally.

  ---

  ### The Empty Squares

  These are combinations of answers that are logically possible but rarely or never observed in reality.

  1.  **The Public Story without an Audience (Leaf D, but Q9 is No):** You cannot be driven by a public narrative if you have told no one. If you find yourself here, you are likely deceiving yourself about how much others care, or you are actually in *The Investment-Confidence Loop* (Leaf A) and using "reputation" as a cover story.
  2.  **The Dollar Auction without a Rival (Leaf B, but Q5 is No):** You cannot be trapped by a rival's bids if you do not care about the rival's outcome. If you claim this, you are likely in *The Vindicator* (Leaf E) mode; you care about the *concept* of the rival, not the person.
  3.  **The Calculated Holdout with Negative Fresh Start (Leaf C, but Q1 is No):** This is a contradiction. If you wouldn't start fresh, but you think you are rational, you are actually suffering from *Loss Aversion* (Leaf H). You are holding a bad stock because selling it makes the loss real.
  4.  **Relief at Quitting Silently but No Audience (Leaf D, but Q9 is No):** If you feel relief at silence but told no one, the audience is internal. This is *The Public Story* turned inward (Shame), which functionally acts like *The Vindicator*. The cure is the same: separate self-worth from the outcome.

  ---

  ### Indistinguishable Pairs

  No decision tree can perfectly separate these from the inside, because the human mind disguises them as each other.

  1.  **Leaf A (Investment-Confidence) vs. Leaf C (Calculated Holdout):**
      *   **The Problem:** Both look like "I think I will win." In Leaf C, the belief comes from evidence. In Leaf A, the belief comes from the spend.
      *   **The Split:** From the inside, you cannot tell. You need an external auditor to look at your evidence log vs. your payment log. If confidence rises only when invoices are paid, it is Leaf A.
  2.  **Leaf D (Public Story) vs. Leaf E (Vindicator):**
      *   **The Problem:** Both involve ego. One is about what neighbors think; the other is about what *you* think of yourself.
      *   **The Split:** Ask: "If I could prove I was right but the neighbors thought I lost, would I be happy?" If yes, it's Public Story. If no, it's Vindicator. The tree approximates this with Q10, but self-reporting on shame is unreliable.
  3.  **Leaf B (Dollar Auction) vs. Leaf H (Loss Averter):**
      *   **The Problem:** Both result in throwing good money after bad.
      *   **The Split:** Leaf B requires a specific rival to beat. Leaf H exists even in a vacuum. If the rival disappeared and you still felt the pain of the loss, it is Leaf H.

  ---

  ### Your Diagnosis

  You asked me to be blunt. Based on what you wrote:

  1.  **"Every time I think about dropping it... him winning."**
      *   This triggers **Q3 (Opponent Keeping)** and **Q5 (Desire drops if rival quits)**. You are heavily invested in the rival's loss, not just your gain.
  2.  **"All that money just evaporating."**
      *   This is classic Sunk Cost, but you recognize it. The fact that you recognize it but can't stop suggests it's not the *root*, but the fuel.
  3.  **"I keep quietly revising my odds of success upward every time I invest."**
      *   This is the smoking gun. This is a direct match for **Q2** and **Q4**. You explicitly stated your confidence is tied to your investment, not new evidence.

  **You are standing in LEAF A: The Investment-Confidence Loop.**

  However, you have a secondary engine: **LEAF B: The Dollar Auctioneer.**

  You are not just trapped by the money; you are trapped because the money *buys* you the feeling of being right (Leaf A), and that feeling is necessary to endure the fight against the neighbor (Leaf B). If the neighbor dropped out, your confidence would likely collapse because the "investment" would no longer have a purpose.

  **The Blunt Truth:**
  You are not fighting for the land. You are fighting to validate the money you have already burned. You have convinced yourself that spending more money increases the probability of a win, which is financially illiterate. The land is worth thousands; you have spent way past that. You are no longer a homeowner disputing a boundary; you are a gambler at a table where the house takes a rake on every hand, believing that the size of your chip stack influences the cards.

  **Your Cure:**
  You cannot "win" your way out of this. The only way to win is to define "winning" as stopping the bleed. You need to freeze your odds estimate *today*. Write it down. Do not let it move unless a judge signs a paper. If the estimate stays static while the bills rise, you must fire the lawyers. You have to accept that the money is gone, the neighbor might keep the strip, and that is cheaper than the alternative. Your wife is right.
