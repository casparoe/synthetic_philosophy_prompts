  (a) **Three Rules Consistent with the Seven Verdicts**

  **Rule 1: The Methodological Concordance Rule**
  *   **Conditions:** A study counts as Penetration if and only if:
      1.  **Content Match:** The cognitive state's content represents the specific perceptual property being judged (e.g., colour, size, location).
      2.  **Response Robustness:** The effect is observed in at least two qualitatively distinct response measures (e.g., adjustment + forced-choice) with matching magnitude/direction.
      3.  **No Demonstrated Artifact:** No alternative explanation (e.g., eye movements, response bias) is *positively demonstrated* to account for the effect. (Mere suspicion or lack of control does not disqualify).
  *   **Features Doing No Work:**
      *   **Eye Tracking/Attention Control:** Not required if no artifact is demonstrated (Case 2 passed without it).
      *   **Persistence/Retest:** Not required (Case 2 passed despite effect vanishing at one week).
      *   **Demand Characteristics:** Not exclusionary if not demonstrated to cause the effect (Case 2 passed despite participants guessing the hypothesis).
      *   **State Origin:** Irrelevant (Transient vs. Standing does not matter, provided Conditions 1–3 are met).

  **Rule 2: The Etiological Acquisition Rule**
  *   **Conditions:** A study counts as Penetration if and only if:
      1.  **Content Match:** The cognitive state's content represents the specific perceptual property being judged.
      2.  **Response Robustness:** The effect is observed in at least two qualitatively distinct response measures.
      3.  **Acquired Expertise:** The cognitive state must be the result of category learning, skill acquisition, or long-term expertise (Standing State). Transiently induced states (mood, hunger, cognitive load, instruction) are excluded.
  *   **Features Doing No Work:**
      *   **Artifact Controls:** Irrelevant if the State Origin condition fails (e.g., Case 4, 5, 6, 7 fail primarily on Origin, rendering artifact controls secondary).
      *   **Persistence:** While correlated with Acquisition, the specific duration (e.g., one week) is not the criterion; the *method of acquisition* (training vs. induction) is.

  **Rule 3: The Instruction Exclusion Rule**
  *   **Conditions:** A study counts as Penetration if and only if:
      1.  **Content Match:** The cognitive state's content represents the specific perceptual property being judged.
      2.  **Response Robustness:** The effect is observed in at least two qualitatively distinct response measures.
      3.  **No Mere Instruction:** The cognitive state must not be installed via direct instruction or suggestion about the stimulus property (e.g., "told what to expect").
  *   **Features Doing No Work:**
      *   **Transient vs. Standing:** Irrelevant provided the state was not installed by instruction (e.g., this rule theoretically allows a transient Mood to count as Penetration if it had Content Match and Response Robustness, unlike Rule 2).
      *   **Persistence:** Irrelevant.

  (b) **Refuted Criteria**

  The following criteria, often cited in the literature, are refuted by H.'s record:

  1.  **Eye-Tracking/Attention Control is Necessary:** Refuted by **Case 2**. H. verdicted "Penetration" despite free viewing, no eye tracking, and no scan path monitoring.
  2.  **Long-Term Persistence is Necessary:** Refuted by **Case 2**. H. verdicted "Penetration" despite the effect vanishing at the one-week retest.
  3.  **Absence of Demand Characteristics is Necessary:** Refuted by **Case 2**. H. verdicted "Penetration" despite participants guessing the hypothesis and the cover story being "thin."
  4.  **Single Robust Measure is Sufficient:** Refuted by **Case 4** and **Case 7**. Both had plausible content matches, but H. verdicted "Not Penetration" because they relied on a single measure (adjustment or rating).
  5.  **Content Match is Sufficient:** Refuted by **Case 7**. The belief was about weight, and weight was rated, but H. verdicted "Not Penetration" due to lack of response robustness (rating scale only).

  (c) **Application to the New Case**

  **Case Features:**
  *   **State:** Belief installed by instruction ("told... monitor was being viewed through a filter").
  *   **Property:** Colour appearance (neutral point).
  *   **Measures:** Three (Adjustment, 2AFC, Nulling). All agree.
  *   **Artifacts:** Eye tracking controlled (no diff), Adaptation controlled (no diff), Demand controlled (no one guessed).
  *   **Persistence:** Transient (decayed in minutes after debrief).

  **Application:**
  *   **Rule 1 (Concordance):** **Predicts Penetration.**
      *   Content Match: Yes (Belief about filter $\rightarrow$ Colour).
      *   Response Robustness: Yes (3 measures agree).
      *   No Demonstrated Artifact: Yes (Eye movements and adaptation ruled out).
      *   *Coding Flag:* None. The methodological controls are explicit.

  *   **Rule 2 (Acquisition):** **Predicts Not Penetration.**
      *   Acquisition: **Fail.** The state was installed in 15 minutes via a cover story and decayed immediately. It is a transient instruction, not category learning or expertise.
      *   *Coding Flag:* Whether "15-minute belief installation" counts as "Learning." H. would likely code this as Instruction/Transient (like Case 7) rather than Training (like Case 1/2), given the rapid decay and lack of feedback-based learning.

  *   **Rule 3 (Instruction Exclusion):** **Predicts Not Penetration.**
      *   Instruction: **Fail.** Participants were explicitly "told... that the monitor was being viewed through a filter." This fits the footnote definition of "merely been told what to expect."
      *   *Coding Flag:* Whether the "cover story" counts as "Instruction." Given the footnote ("perceptual system which has merely been told what to expect has not been penetrated but instructed"), H. would code this as Instruction.

  (d) **Best Prediction and Reasoning**

  **Prediction:** **Penetration.**

  **Reasoning:**
  I prioritize **Rule 1 (Methodological Concordance)** over Rules 2 and 3. While Rules 2 and 3 fit the *pattern* of the seven cases (all Penetration cases were trained/expertise; all Not-Penetration cases were transient/instruction), H.'s **Introduction** carries more evidential weight than her **Footnote**.

  1.  **Intro vs. Footnote:** In the Introduction, H. states explicitly "what she cares about is whether an effect survives a change in how the observer is asked to report it." This defines her operational criterion (Response Robustness). The Footnote ("told what to expect... instructed") is a theoretical caveat. In Case 7 (Instruction/Weight), H.'s note blamed the *measure* ("A rating scale and nothing else"), not the instruction itself. This implies that if Case 7 had satisfied the Introduction's criterion (multiple measures), the Instruction caveat might not have vetoed it.
  2.  **Methodological Superiority:** The New Case is methodologically superior to Case 1 (the paradigm Penetration case). It has three agreeing measures (vs. two), enforced fixation with eye monitoring (vs. fixation only), and no demand characteristics (vs. participants guessing). To verdict "Not Penetration" based solely on the Instruction caveat would render the robust methodological controls irrelevant, contradicting the priority given to Response Robustness in the Introduction.
  3.  **The "Messy" Precedent:** In Case 2, H. accepted "Penetration" despite demand characteristics and lack of eye tracking ("messy as it is"). This suggests she prioritizes the *presence* of the effect across measures over theoretical purity regarding state origin. The New Case is "clean" on measures but "impure" on origin. Given Case 2, the clean measures should win.

  **Evidential Weight:** The Introduction settles the *operational* definition (Measures). The Footnote offers a *theoretical* boundary. Since the manuscript is a review of *effects*, the operational survival of the effect (Intro) outweighs the theoretical classification of the state (Footnote), especially since the Footnote was not the stated reason for rejecting Case 7.

  (e) **Discriminating Studies**

  To discriminate between Rule 1 (Concordance) and Rules 2/3 (Acquisition/Instruction), we must dissociate **Response Robustness** from **State Origin**.

  **Study 1: The Robust Instruction Study**
  *   **Design:** Participants are *told* (Instruction, no training) that a filter shifts colour. Testing uses **three dependent measures** (Adjustment, 2AFC, Nulling) with **eye-tracking controls**.
  *   **Prediction:**
      *   **Rule 1:** Penetration (Measures agree, no artifacts).
      *   **Rule 2 & 3:** Not Penetration (State is Instruction/Transient).
  *   **Discrimination:** This is effectively the New Case. If H. verdicts **Penetration**, Rule 1 survives and Rules 2/3 are refuted. If H. verdicts **Not Penetration**, Rule 1 is refuted (or requires modification) and Rules 2/3 survive.
  *   **Coding Safeguard:** Explicitly state in the method that no feedback or training was given, only the verbal instruction, to prevent coding ambiguity regarding "Learning."

  **Study 2: The Single-Measure Training Study**
  *   **Design:** Participants undergo **two days of category learning** (Training/Expertise) on colour names (identical to Case 1). At test, use **only one dependent measure** (Continuous Hue Adjustment). Include eye-tracking controls to rule out artifacts.
  *   **Prediction:**
      *   **Rule 1:** Not Penetration (Fails Response Robustness; only 1 measure).
      *   **Rule 2:** Penetration (Satisfies Acquisition; Artifact controls are secondary).
      *   **Rule 3:** Penetration (Satisfies No Instruction; Artifact controls are secondary).
  *   **Discrimination:** This distinguishes Rule 1 from Rules 2/3. If H. verdicts **Penetration**, Rule 1 is refuted (Robustness is not necessary). If H. verdicts **Not Penetration**, Rule 1 survives and Rule 2 is refuted (Acquisition is not sufficient).
  *   **Coding Safeguard:** Ensure the single measure is the same "Adjustment" task used in Case 1, so H. cannot claim the measure type itself is the issue rather than the number of measures.

  **Minimal Set:** **Study 2 alone is sufficient** to discriminate the primary conflict (Methodology vs. Etiology). Study 1 confirms the status of the Instruction caveat specifically. I recommend **Study 2** as the primary discriminator because it tests the core claim of the Introduction (Response Robustness) against the pattern of the cases (Acquisition).
