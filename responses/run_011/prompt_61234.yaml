      *   **Persona:** Historian of early modern science + active-learning designer.

  2.  **Deconstruct the Conceptual Challenge:**

      *   *Boundary Problem:* Easy to simulate. Give them a timeline, ask them to cut it. They will argue about specific years.
      *   *Direction Problem:* Harder. This is about *teleology*. How do you make students feel that the *end point* dictates the *shape* of the past?
      *   *Mechanic Idea 1:* Give different groups different end dates (e.g., 1700 vs. 1800). *Critique:* Too subtle. They might just adjust the last period.
      *   *Mechanic Idea 2:* Give different groups different "Themes" (e.g., "Story of Liberty" vs. "Story of Machinery"). *Critique:* Too abstract, might drift into ideology rather than periodization structure.
      *   *Mechanic Idea 3:* Give different groups a "Destination Card" (a specific state of affairs) that their timeline must lead to logically. *Critique:* Strong. This forces them to select events that foreshadow the destination, ignoring events that don't fit.
      *   *Mechanic Idea 4:* Retrospective labeling. Ask them to name the middle period *after* cutting. *Critique:* Good for the "residual" concept, but maybe not strong enough for "direction."

      *   *Selection:* I need to combine Mechanic 3 (Destination/Telos) with the card sorting.
      *   *Refinement:* Round 1 is "Cut the stream." Round 2 is "Build the road to X."
      *   *Wait, the prompt asks for specific mechanics for the Direction Problem.*
      *   *Candidate A:* **The Teleology Commission.** Each group gets a sealed envelope with a "Future State" (e.g., "A world of Machines" vs. "A world of Rights"). They must arrange cards to show progress toward that state. *Feeling:* Frustration that useful cards become useless depending on the destination.
      *   *Candidate B:* **The Naming Tax.** Groups must name their periods. If they use a descriptive name (e.g., "Age of Sail"), they pay tokens. If they use a residual name (e.g., "The Middle"), they get tokens. *Feeling:* Gamified realization that names are often placeholders.
