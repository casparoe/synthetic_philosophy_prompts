  #### 3. Roles and Rules

  **Round 1: The Boundary Problem (20 Minutes)**
  *   **Task:** Groups sort the 28 cards into exactly three piles (Early, Middle, Late).
  *   **Constraint:** You must name each period without using the forbidden words.
  *   **Challenge:** The *Envoy* from each group rotates to a neighboring table. They must identify one card that is placed "incorrectly" (i.e., fits better in a neighboring pile).
  *   **Goal:** Experience the arbitrariness of the cut.

  **Round 2: The Direction Problem (25 Minutes)**
  *   **Task:** Return cards to the deck. Shuffle. Deal again.
  *   **Constraint:** Open your Sealed Commission. You must now sort the cards into three periods that logically lead to your assigned **Future State**.
  *   **Rule:** You may discard up to 5 cards that do not serve your Commission's narrative.
  *   **Challenge:** Groups present their timeline. The class votes on which timeline is most *coherent* (not which is "true").
  *   **Goal:** Experience how the *destination* dictates the *selection* and *arrangement* of the past.

  **Round 3: (Omitted)**
  *   *Rationale:* A third round risks running over time. The naming aspect is covered in Round 1; the teleology is covered in Round 2. Adding a "Power of Naming" round would dilute the core distinction between Boundary and Direction.

  #### 4. Minute-by-Minute Timeline (60 Minutes)

  *   **00–05:** **Intro.** Distribute materials. State the rule: "There are no right answers, only coherent arguments." Assign roles.
  *   **05–25:** **Round 1 (Boundary).** Groups sort cards. Envoys rotate (15 mins). Groups adjust and name periods (5 mins).
  *   **25–30:** **Reset.** Collect cards. Shuffle. Hand out Sealed Commissions.
  *   **30–50:** **Round 2 (Direction).** Groups sort for their specific Teleology. Prepare 2-minute defense.
  *   **50–60:** **Debrief.** Facilitator leads discussion using the whiteboard. Reveal historical coinages.

  #### 5. Scoring Scheme
  **Currency:** "Coherence Tokens" (drawn on whiteboard or scrap paper).
  *   **Boundary Defense:** +1 Token if your group successfully defends a card placement against an Envoy's challenge.
  *   **Narrative Flow:** +2 Tokens if the group can explain why their discarded cards were irrelevant to their Commission.
  *   **Naming:** +1 Token if the period name describes a *process* (e.g., "Consolidation") rather than a *place* (e.g., "Europe").
  *   **Penalty:** -1 Token for using a forbidden word (Periodization, Middle Ages, Renaissance, Scientific Revolution).

  #### 6. Debrief Mapping

  | Activity Moment | Conceptual Target | Facilitator Script & Historical Reveal |
  | :--- | :--- | :--- |
  | **Round 1 Argument** (Why cut at 1450 vs 1500?) | **The Boundary Problem.** Insoluble but harmless. | "You argued about the year. But did the world change on Jan 1st? No. The cut is arbitrary." |
  | **Round 2 Sorting** (Discarding cards that don't fit the Commission) | **The Direction Problem.** Soluble but corrosive. | "You didn't move the dates; you changed *which events mattered*. You solved the problem by ignoring evidence." |
  | **Naming the Middle** (Groups struggling to name the central period) | **Residual Periods.** Defined by what they sit between. | "You called it 'The Transition.' That is a residual name. Its inhabitants couldn't use it." |
  | **Final Reveal** (Last 5 mins) | **Historical Validation.** | "You just reinvented the history of history." Read the provided material: <br>1. *Middle:* Latin phrase appears 1469 (Giovanni Andrea). 1680s German professor makes it standard.<br>2. *Rebirth:* Vasari 1550, but 'Renaissance' as epoch = Michelet 1855 / Burckhardt 1860.<br>3. *Science:* Phrase standard mid-20th C (Butterfield 1949). Shapin: 'There was no such thing.'<br>4. *Conclusion:* Le Goff asked if we must divide at all. |

  #### 7. Predictable Failures & Fixes

  1.  **The "Continuous Time" Group:** One group refuses to cut the deck, arguing time is a flow.
      *   *Fix:* Validate the philosophy, enforce the game. "You are administrators allocating resources by era. You must cut to distribute the budget. If you don't cut, you get zero tokens."
  2.  **The "Science is Obvious" Group:** Science students insist 1543 or 1687 is the only valid pivot.
      *   *Fix:* Hand them the *Religious Uniformity* Commission. Ask: "Does 1687 explain the Huguenot massacre better than 1572?" Force them to see the pivot moves with the theme.
  3.  **The "History Major Dominance":** History students take over the sorting.
      *   *Fix:* Enforce Roles. Only the *Archivist* may touch the cards. Only the *Envoy* may speak during the challenge phase.
  4.  **Time Creep:** Round 1 runs long, eating the Debrief.
      *   *Fix:* At minute 20, blow a whistle. "Cards down. Even if unfinished. The instability you feel right now is the data."

  #### 8. Limitations of the Activity

  **The Limitation:** The activity cannot reproduce the *stakes* of periodization. In the workshop, misplacing a card costs a token. In the real world, periodization dictates museum funding, curriculum standards, and national identity. The "corrosive" nature of the Direction Problem is intellectual here; politically, it is violent.

  **The Facilitator's Task:** You must supply the stakes by hand in the debrief. When revealing the Michelet/Burckhardt data, explicitly state: "When Michelet named the Renaissance in 1855, he was making a claim about why *his* present was superior to the past. You did the same with your Commissions. You made the past a servant to your present."

