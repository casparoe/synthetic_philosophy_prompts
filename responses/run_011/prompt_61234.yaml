      *   **User's Thesis:** Boundary problem = insoluble but harmless; Direction problem = soluble but corrosive (undermines the objectivity of the dates).
      *   **Specific Requirements:**
          1.  Sketch 3-4 mechanics for the "Direction Problem," reject some, commit to one.
          2.  One-sentence learning outcome.
