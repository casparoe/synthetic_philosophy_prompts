answer: |-
  ### Mechanics for the Direction Problem

  **Candidate 1: The Teleology Commission.** Each group receives a sealed envelope containing a specific "Future State" (e.g., "A World of Machines"). They must arrange the same deck of cards to show a logical progression toward that specific end.
  *   *Participant Feeling:* Frustration that a card useful for one group (e.g., a printing press for "Knowledge") is noise for another (e.g., "Divine Right"), forcing them to realize the *end* dictates the *value* of the past.
  *   *Verdict:* **Selected.** It directly simulates the "claim about which changes were worth tracking."

  **Candidate 2: The Naming Tax.** Groups must name their periods. They lose points for descriptive names (e.g., "Age of Sail") and gain points for residual names (e.g., "The Middle").
  *   *Participant Feeling:* Gamified confusion; they realize "Middle" is a placeholder, but it doesn't fully capture *why* the placeholder exists.
  *   *Verdict:* **Rejected.** It addresses the "residual" concept but misses the causal/teleological weight of the Direction Problem.

  **Candidate 3: The Retroactive Edit.** Groups build a timeline. Halfway through, you announce the "End Date" has moved from 1750 to 1800. They must re-cut.
  *   *Participant Feeling:* Instability and annoyance.
  *   *Verdict:* **Rejected.** This reinforces the Boundary Problem (where to cut) rather than the Direction Problem (why this shape?).

  **Candidate 4: The Anachronism Trap.** Cards contain hidden "future" keywords. Groups are penalized if they place a "Modern" card in the "Early" period.
  *   *Participant Feeling:* Like a quiz; they search for the "right" answer.
  *   *Verdict:* **Rejected.** Contradicts the goal of showing there *is* no right answer.

  ***

  ### Workshop Plan: The Architect's Fallacy

  #### 1. Learning Outcome
  By the end of this session, participants will be able to explain how assigning a specific destination to a sequence of events alters which events appear significant, independent of where the chronological boundaries are drawn.

  #### 2. Materials List
  **Total Unique Pages:** 4 (Print Page 1 & 2 once; Print Page 3 & 4 five times).
  **Equipment:** Whiteboard + markers, scissors (for cards), 5 envelopes.

  **Page 1: Instructions & Roles**
  *   **Roles (per group):** *Archivist* (handles cards), *Architect* (arranges timeline), *Scribe* (records names), *Envoy* (challenges other groups), *Timekeeper* (manages rounds).
  *   **Rules:**
      1.  Do not use the forbidden words (Periodization, Middle Ages, Renaissance, Scientific Revolution).
      2.  You must create exactly three periods.
      3.  You must name each period.
      4.  Points are awarded for Coherence, not Accuracy.

  **Page 2: The Commissions (Cut into 5 strips)**
  *   *Commission A:* Your timeline must demonstrate the inevitable rise of **Centralized State Power**.
  *   *Commission B:* Your timeline must demonstrate the inevitable rise of **Mechanical Natural Philosophy**.
  *   *Commission C:* Your timeline must demonstrate the inevitable rise of **Global Commercial Networks**.
  *   *Commission D:* Your timeline must demonstrate the inevitable rise of **Religious Uniformity**.
  *   *Commission E:* Your timeline must demonstrate the inevitable recovery of **Ancient Wisdom**.

  **Pages 3 & 4: The Event Deck (28 Cards)**
  *(Print 5 copies. Cut into strips. Neutral language used throughout.)*

  | Year | Event Description | Type |
  | :--- | :--- | :--- |
  | 410 | City of Rome sacked by Visigoths. | Trap (Looks like End, isn't) |
  | 476 | Last Western Emperor deposed by general Odoacer. | Trap (Classic "Fall" date) |
  | 529 | Closure of Platonic Academy in Athens by Imperial order. | Trap (Looks like End of Thought) |
  | 622 | Migration of a prophet and followers from Mecca to Medina. | Double Agent (Religious/Geo) |
