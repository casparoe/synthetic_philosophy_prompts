  8.  **Final Polish:** Check word count (roughly 800-1000 words for 2 pages single spaced usually, but I need to ensure it fits the "2 pages max" visual constraint). I will aim for dense but readable text.

      *Wait, one critical check:* The user said "If your honest read is that the conceptual work is worthless without new data, say that and reshape the project instead of padding it."
      *My assessment:* Conceptual work *is* valuable here because the data exists (behavioral observations), but the *interpretation framework* is broken. We don't need new physiology data; we need new rules for reading existing behavior. So the project stands, but it must be framed as "re-validating existing metrics," not "generating new biological data."

