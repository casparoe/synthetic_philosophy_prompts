answer: |-
  ### Part 1: The Logical Space

  Before we build the tree, we need to map the territory. We are testing two variables: **Independence** (can they exist without each other?) and **Ontology** (are they the same stuff?).

  Let **P** = Phenomenal Consciousness (the "felt quality").
  Let **A** = Access Consciousness (the "availability for report/control").

  | | **A without P possible?** (Zombies/Machines) | **A without P impossible?** (P is necessary for A) |
  | :--- | :--- | :--- |
  | **P without A possible?** (Overflow/Unreportable) | **Cell 1: Dissociation**<br>*(Block, Kouider)*<br>Both exist, both can fail independently. | **Cell 2: Phenomenal Priority**<br>*(Traditional Dualism / Chalmers)*<br>P is fundamental; A is a contingent add-on. |
  | **P without A impossible?** (Access is necessary for P) | **Cell 3: Access Priority**<br>*(Illusionism / Dennett)*<br>A is real; P is a user-illusion spun by A. | **Cell 4: Identity**<br>*(Global Workspace / Identity Theory)*<br>P and A are the same process described differently. |

  **Empty or Problematic Cells:**
  *   **P exists, A is impossible:** Incoherent for embodied agents. If you have a "felt quality," you are a subject; if you are a subject, you have *some* causal purchase (even if just attention). A "ghost" that cannot attend to anything is logically indistinguishable from nothing.
  *   **Distinct but Nomologically Locked:** P and A are different substances but *never* come apart in reality. This is epiphenomenalism. It is logically possible but scientifically unattractive (why posit two things if they always track perfectly?).
  *   **Eliminativism (Hard):** "P" is a meaningless term like "phlogiston." This collapses into Cell 3 (Access Priority) for practical sorting, as both treat P-talk as derivative.

  ***

  ### Part 2: The Sorting Tree

  Here are six questions. Answer them as you would in a lab notebook: yes, no, or "it depends." Do not worry about consistency yet; the tree will find your inconsistency.

  **Q1. (Anchor 3: The Controller)**
  Your infusion controller outputs: *"I detect high alpha power."* You output: *"I hear a hum."*
  Is the *internal state* of the controller missing something that your internal state has, or is it just missing a body?
  *   **Yes, it's missing the feeling.** (Go to Q2)
  *   **No, it's just missing the body; the processing is the same.** (Go to Q5)

  **Q2. (Anchor 2: The Pool Pump)**
  Regarding the hum before you noticed it: Was the sound *present in your experience* but unattended, or did it enter experience *only when* you attended to it?
  *   **Present but unattended (Overflow).** (Go to Q3)
  *   **Entered only when attended (Access-Required).** (Go to Q4)

  **Q3. (Anchor 1: The Anaesthesia Patient)**
  When the patient squeezed the ball: Was there a "try" feeling that was subsequently erased from memory, or was the motor command issued by a circuit that never felt anything?
  *   **Felt, then erased (P without A).** (Leaf A)
  *   **Circuit never felt (A without P).** (Leaf B)

  **Q4. (The Metaphysical Check)**
  If you answered "Access-Required" in Q2: Is the "feeling" of the hum a *readout* generated to summarize the data, or is the feeling *identical* to the data being available?
  *   **Readout/Summary (P is downstream).** (Leaf C)
  *   **Identical (No distinction).** (Leaf D)

  **Q5. (The Graded Node)**
  If we titrate the anaesthetic or the attention in 1% increments: Does consciousness snap off like a light switch, or fade like a radio signal losing strength?
  *   **Snaps off (Discrete).** (Return to Q2 or Q4 based on Q1 path)
  *   **Fades (Graded).** (Leaf E)

  **Q6. (The Illusion Check - for those who took the Q1 "No" path)**
  If the controller was made of flesh and said "I hear a hum," would there be *anyone home*, or is the "someone home" feeling just a trick the brain plays to track its own access?
  *   **Anyone home (Realism).** (Return to Q2)
  *   **Trick/illusion (Illusionism).** (Leaf F)

  ***

  ### Part 3: The Leaves (Positions)

  **Leaf A: Dissociation (Both Directions)**
  *   *Position:* P and A are distinct systems that can fail independently (e.g., Blindsight vs. Overflow).
  *   *Cost:* It is forced to posit two distinct neural correlates that can be empirically disentangled without remainder.

  **Leaf B: Phenomenal Priority (P-Only Real)**
  *   *Position:* Phenomenology is the fundamental reality; Access is a downstream, contingent tool that sometimes fails to capture it.
  *   *Cost:* It is forced to explain how a non-functional "feeling" can causally drive a motor command (the squeeze) without access.

  **Leaf C: Access Priority (P is Narrative)**
  *   *Position:* Access is the whole story; the "felt quality" is a post-hoc user-illusion spun by the access system to track its own state.
  *   *Cost:* It is forced to explain away the immediate intuition that the feeling exists *before* the report as a systematic cognitive error.

  **Leaf D: Identity Theory (No Distinction)**
  *   *Position:* There is no principled distinction; "Phenomenal" is just the first-person name for "Access."
  *   *Cost:* It is forced to deny the possibility of unreportable experience (overflow) or unconscious processing that mimics report (zombies).

  **Leaf E: Pragmatic Gradualism**
  *   *Position:* The split is an artifact of binary measurement on a continuous signal; distinction depends on resolution.
  *   *Cost:* It is forced to give up sharp boundaries for consciousness, making "conscious/not-conscious" a matter of arbitrary thresholding.

  **Leaf F: Illusionism (Hard Access)**
  *   *Position:* Access is real; Phenomenality is a false model the system runs, like a desktop icon that doesn't resemble the file.
  *   *Cost:* It is forced to claim that the "what-it-is-like-ness" we are discussing right now does not actually exist as we describe it.

  ***

  ### Part 4: Notes on the Device

  **The Graded Node (Q5) Impact:**
  If your group answers "Fades" (Graded), the tree collapses into **Leaf E**. If consciousness is a dimmer, the A/P split is likely a threshold artifact (e.g., signal-to-noise ratio) rather than a metaphysical chasm. This makes **Leaf D (Identity)** and **Leaf C (Access Priority)** much harder to distinguish, as "access" becomes simply "signal strength above threshold."

  **Flagged Indistinguishable Pairs:**
  1.  **Leaf C (Access Priority) vs. Leaf F (Illusionism):** Practically, these look identical in a lab. Both treat P as derivative of A. The only difference is whether you call the derivative a "summary" (C) or a "false model" (F). Your data won't sort this; only their tolerance for eliminativism will.
  2.  **Leaf A (Dissociation) vs. Leaf B (Phenomenal Priority):** If you find P without A (Overflow), you are in Leaf A. But if you believe P is the *only* real thing, you also expect P without A. The tree separates them on the *reverse* case (A without P). If you think the Anaesthesia squeeze was "blind" (A without P), you are Leaf A. If you think it *must* have been felt (denying A without P), you are Leaf B.

  **Advice for the Reading Group:**
  Tell your ex-lab types that **Leaf D (Identity)** is the null hypothesis of neuroscience, **Leaf A (Dissociation)** is the hypothesis of cognitive psychology, and **Leaf F (Illusionism)** is the hypothesis of philosophy. The tree is designed to show them which hat they are actually wearing when they look at the traces.
