      *   **Input:** 8 specific principles provided by the user.
      *   **Constraints:**
          *   Open with a bottom line (2-3 sentences) on whether the package is jointly tenable.
          *   Go through problems in descending order of severity.
          *   For each problem: Name the two conflicting commitments, explain the mechanism of conflict, say what revision is needed and what it costs elsewhere.
          *   If items only *look* inconsistent, say so explicitly.
          *   Do not assume which item the user holds most loosely.
          *   Word count: Under 650 words.
          *   No pointers to further reading.
          *   Tone: Analytical, direct, "audit not an essay."

  2.  **Analyze the Principles:**
      1.  Elections are aristocratic; lot is democratic (Montesquieu/Athens).
      2.  Descriptive representation (looks like the country), no career/constituency pressure.
      3.  Legitimacy = authorship (self-rule), not outcomes/technocracy.
      4.  Service must be voluntary (no penalty for declining).
      5.  Power of the purse (money bills originate here, elected house can only delay).
      6.  No randomizing technical offices (judges, central bankers, etc.). Ends vs. Means distinction.
      7.  Terms: 3 years, non-renewable, paid professional salary, independent research.
      8.  Guaranteed seats for indigenous nations and persecuted religious communities (not left to luck).

  3.  **Identify Conflicts/Tensions:**

      *   *Conflict A: Voluntary Service (4) vs. Descriptive Representation (2).*
          *   Mechanism: If people can opt out without penalty, self-selection bias occurs. Those with flexible jobs, high civic motivation, or specific agendas will serve. Those working hourly wages, caring for dependents, or disengaged will decline. The chamber will not "actually look like the country."
          *   Revision: Need incentives or compulsion.
          *   Cost: Violates Principle 4 (liberty/anti-conscription) or Principle 2 (descriptive representation becomes aspirational).

      *   *Conflict B: Guaranteed Seats (8) vs. Random Selection/Equality (1 & 2).*
          *   Mechanism: Principle 1 & 2 rely on the fairness of the lot where every citizen has an equal chance. Principle 8 grants specific groups exemption from the lot to ensure presence. This creates two classes of legislators: allotted citizens and delegated representatives.
          *   Revision: Remove guarantees or apply lot within groups.
          *   Cost: Violates Principle 8 (protection of minorities) or Principle 1/2 (pure sortition/equality).

      *   *Conflict C: Power of the Purse (5) vs. Technical Competence/Safety (6).*
          *   Mechanism: Principle 5 gives the allotted chamber ultimate control over budget/taxation. Budgeting is highly technical (means), often requiring economic judgment. Principle 6 excludes allotted members from technical offices because means require trained judgment. Controlling the purse *is* controlling the means of governance.
          *   Revision: Limit purse power or allow technical oversight.
          *   Cost: Violates Principle 5 (power of the chamber) or Principle 6 (consistency on technicality).

      *   *Conflict D: Professional Salary/Term (7) vs. Ordinary Citizens (2).*
          *   Mechanism: A "full professional salary" for 3 years attracts careerists or those seeking income, potentially skewing the "ordinary" nature, though less than elections. However, this is less severe than the voluntary issue.
          *   *Decision:* This is manageable compared to the voluntary bias. I might skip this to save word count for bigger issues.

      *   *Conflict E: Legitimacy as Authorship (3) vs. Guaranteed Seats (8).*
          *   Mechanism: If legitimacy comes from *any* fair sample being authors (3), guaranteeing seats implies the random sample isn't sufficient for those groups, undermining the claim that the lot itself confers legitimacy.
          *   *Decision:* This overlaps with Conflict B.

      *   *Potential Non-Conflict:* Principle 1 and 3 hang together well (anti-electoral, pro-authorship). Principle 6 and 7 hang together well (support for members).

  4.  **Drafting the Audit (Iterative Process):**

      *   *Bottom Line:* The package is internally unstable. The voluntary service clause undermines descriptive representation, and the guaranteed seats contradict the logic of the lot.
      *   *Problem 1 (Severity: High):* Principle 4 (Voluntary) vs. Principle 2 (Descriptive Representation).
          *   Mechanism: Opt-out creates self-selection bias. The wealthy/flexible serve; the precarious decline.
          *   Revision/Cost: Must incentivize or compel service. Costs Principle 4's liberty claim or Principle 2's accuracy.
      *   *Problem 2 (Severity: Medium-High):* Principle 8 (Guaranteed Seats) vs. Principle 1/2 (Sortition Equality).
          *   Mechanism: Guarantees create a hybrid elected/delegated class within a body defined by random equality. It admits the lot fails specific groups.
          *   Revision/Cost: Remove guarantees or lot within groups. Costs Principle 8's security or Principle 1's purity.
      *   *Problem 3 (Severity: Medium):* Principle 5 (Power of Purse) vs. Principle 6 (Technical Competence).
          *   Mechanism: Budgeting is technical "means," yet Principle 5 gives ultimate control to laypersons. Principle 6 admits laypersons shouldn't control technical means.
          *   Revision/Cost: Limit purse power to priorities only. Costs Principle 5's supremacy.
      *   *Non-Conflict:* Principles 1, 3, and 7 are coherent.

  5.  **Refining and Editing for Constraints:**
      *   Check word count (limit 650).
