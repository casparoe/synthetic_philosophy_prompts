      Revision: You must introduce compulsion or significant positive incentives (beyond salary) to ensure participation across classes.
      Cost: This violates Principle 4's rejection of conscription. If you keep Principle 4, you must admit Principle 2 is aspirational, not actual.

      2. **Principle 8 (Guaranteed Seats) vs. Principle 1 (Sortition Equality).**
      Conflict: Guaranteeing seats for specific groups creates a hybrid legislature partly defined by election/delegation and partly by lot.
      Mechanism: Principle 1 argues the lot is the only democratic filter. Principle 8 admits the lot is insufficient for certain groups, granting them exemption from the randomizing mechanism that defines the chamber's legitimacy. This creates two classes of members with different mandates.
      Revision: Either remove guarantees or require these groups to use lotting procedures internally.
