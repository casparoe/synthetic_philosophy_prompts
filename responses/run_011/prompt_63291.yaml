      1.  *Naive Realism:* Veridical experience constituted by mind-independent objects/qualities.
      2.  *Argument from Illusion Fails:* Illusions are just objects looking a certain way; no sense-data.
      3.  *Causal-Matching Premise:* Hallucinations matching veridical perceptions are possible via same proximal causes.
      4.  *Denial of Highest Common Factor (HCF):* Hallucination is not the same fundamental kind. Hallucination has no positive phenomenal character; defined by indiscriminability from veridical.
      5.  *Epistemic Disjunctivism:* Good case = factive reasons (seeing that p). Bad case = no such reason.
      6.  *Access Internalism:* Justification depends on reflectively accessible facts. Reflectively indistinguishable situations confer same justificatory status.
      7.  *Blamelessness:* Hallucinating subject is epistemically blameless because things seem the same.
      8.  *Anti-Skepticism:* The package answers the skeptic. "Cannot tell by reflection" does not imply "Do not know."

  3.  **Identify Tensions/Conflicts:**
      *   **The Big Clash:** Commitment 5 (Epistemic Disjunctivism) vs. Commitment 6 (Access Internalism).
          *   (5) says in the good case you have a factive reason (seeing that p), but in the bad case you don't. So the reasons differ fundamentally.
          *   (6) says if two situations are reflectively indistinguishable (which the good and bad cases are, by definition of hallucination matching), they confer the *same* justificatory status.
          *   If the reasons differ (5), but justification must be the same (6), there is a tension. Usually, Epistemic Disjunctivism (McDowell) is paired with *Externalism* about justification to avoid this. Holding both 5 and 6 looks like a contradiction.
      *   **Secondary Clash:** Commitment 4 (Hallucination has no positive phenomenal character) vs. Commitment 7 (Blamelessness explained by things seeming the same).
