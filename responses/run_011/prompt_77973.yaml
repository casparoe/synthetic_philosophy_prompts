answer: |-
  **MEMORANDUM**
  **TO:** Utilization Review Management
  **FROM:** [Your Name/Consultant]
  **SUBJECT:** Panel Review Decision Procedure & Triage Worksheet

  ### PART 1: THE STRAIGHT ANSWER ON YOUR DEPUTY'S MATH
  Your deputy is quoting the **Condorcet Jury Theorem**. It states: If every voter is more likely to be right than wrong ($p > 0.5$) and votes **independently**, the majority is more likely to be right than any single voter. As the group grows, accuracy approaches 100%.

  **The Catch:** The "Independence" clause is doing all the work.
  1.  **Shared Training:** If your manual is wrong, or your training emphasizes the wrong cues, all five reviewers make the *same* mistake. This is **correlated error**. If errors are correlated, five heads are not better than one; they are just five people confidently wrong together.
  2.  **Deliberation:** Talking before voting creates "herding." If the senior physician speaks first, the nurses adjust their votes to match. This destroys independence.
  3.  **Competence:** If the task is so ambiguous that reviewers are essentially guessing ($p \approx 0.5$) or systematically biased by cost-containment culture ($p < 0.5$), adding more reviewers **lowers** accuracy.

  **Verdict:** For routine cases with clear criteria, panels are inefficient and add noise. For complex cases, panels only work if you force independence (secret ballots) before discussion. For "values" cases (rare disease funding), panels lack the authority to decide; that is a policy question, not a medical one.

  ---

  ### PART 2: UTILIZATION REVIEW TRIAGE & PROCESS WORKSHEET
  **Instructions:** Complete Section A for every referral. Follow the lane assigned. Do not deviate.

  #### SECTION A: INTAKE TRIAGE (Complete within 1 hour of receipt)
  **Reviewer:** Intake Nurse / Triage Lead

  | Question | If YES → Go To: | If NO → Ask Next |
  | :--- | :--- | :--- |
  | **1. Is there a specific, binary clinical criterion in the manual?** (e.g., "Failed 6 weeks PT," "BMI > 40") | **LANE 1: Single Specialist** | ↓ |
  | **2. Is the historical overturn rate for this code < 10%?** | **LANE 1: Single Specialist** | ↓ |
  | **3. Does the case involve high-stakes risk where "wrong" means death/severe harm, but criteria are ambiguous?** (e.g., Psych safety, complex surgery) | **LANE 2: Standard Panel** | ↓ |
  | **4. Is this a resource-allocation question where medical necessity is met but cost/policy is the barrier?** (e.g., Ultra-rare gene therapy, experimental) | **LANE 3: Escalation** | **LANE 1: Single Specialist** |

  **LANE DEFINITIONS:**
  *   **LANE 1 (Single Specialist):** One clinician (MD or RN per scope). Decision binding unless appealed. **Turnaround:** 24-72 hrs.
  *   **LANE 2 (Standard Panel):** 5 members (2 MD, 2 RN, 1 Admin). **Turnaround:** 72 hrs (Urgent: 24 hrs).
  *   **LANE 3 (Escalation):** Medical Director + Ethics Committee + External Specialist (if needed). **Turnaround:** 5 Days (unless urgent).

  ---

  #### SECTION B: THE PANEL PROCESS (LANE 2 ONLY)
  **Goal:** Prevent herding and correlated error.

  **Step 1: Silent Review (30 Minutes)**
  *   Reviewers read the file **individually**.
  *   No talking. No emails. No "quick questions" to the chair.
  *   **Action:** Each reviewer marks their ballot privately.

  **Step 2: The Secret Ballot (Stop Rule)**
  *   Reviewers submit a vote: **Approve**, **Deny**, or **Abstain**.
  *   **Aggregation Rule:** Simple Majority (3 of 5).
      *   *Exception:* If the vote is 3-2, the minority opinion must be documented in the notes.
      *   *Exception:* If the vote is 5-0, proceed to Step 3.
  *   **Stop Rule:** If the ballot is split 3-2 on a **Lane 2** case, the Chair must trigger a **Criterion Audit** (Step 3) before discussion.

  **Step 3: Criterion Audit (Before Discussion)**
  *   Do not vote on "Approve/Deny." Vote on the **criteria** that lead to the decision.
  *   *Example:* Instead of "Is PHP necessary?", vote "Does patient meet Safety Risk Threshold?" (Yes/No).
  *   **Logic:** If the panel agrees on all criteria but splits on the conclusion, the **Criteria Manual is broken**. Flag for Medical Director review. Do not force a consensus.

  **Step 4: Deliberation (Only if Ballot was 5-0 or Audit failed)**
  *   Senior Physician speaks **last**.
  *   Chair facilitates. Goal is to understand the minority view, not necessarily to change it.
  *   **Final Vote:** Optional. If the Secret Ballot was 3-2, the 3-2 stands unless new clinical evidence is found during deliberation. **Do not vote again to force unanimity.**

  ---

  #### SECTION C: LANE 3 (ESCALATION) PROTOCOL
  *   **Trigger:** Ultra-rare disease, experimental therapy, or >50% historical overturn rate for this diagnosis code.
  *   **Procedure:** This is not a medical necessity determination; it is a **Coverage Policy** determination.
  *   **Action:** Panel does not vote. Chair writes a summary of medical ambiguity. Medical Director makes the final call based on budget impact and precedent.
  *   **Why:** Your panelists are clinicians, not actuaries or ethicists. They cannot vote on "value."

  ---

  ### PART 3: CASE RUN-THROUGHS

  **Case 1: Advanced Imaging (Low Back Pain, Uncomplicated)**
  *   **Triage:** Q1 (Binary Criterion?) = **YES**. (Manual says "No MRI without red flags within 6 weeks").
  *   **Lane:** **LANE 1 (Single Specialist).**
  *   **Reasoning:** Overturn rate is low. Criteria are binary. Panel adds cost and delay without increasing accuracy. Shared training ensures consistency here.
  *   **Outcome:** RN Reviewer denies based on "No red flags documented." Case closed in 4 hours.

  **Case 2: Adolescent Partial Hospitalization (Psych, Risk Contested)**
  *   **Triage:** Q1 = No (Risk is subjective). Q3 (High Stake/Ambiguous) = **YES**.
  *   **Lane:** **LANE 2 (Standard Panel).**
  *   **Process:**
      1.  Silent Review.
      2.  Secret Ballot: 3 Approve, 2 Deny.
      3.  Criterion Audit: Panel agrees patient is "at risk" (5-0) but splits on "whether home safety plan is sufficient" (3-2).
      4.  Deliberation: Senior MD notes home plan weakness.
      5.  **Decision:** **Approve.** (Majority stands).
      6.  **Note:** Document the 3-2 split in the file. This flags the criteria for future review.
  *   **Why:** High overturn rate (40%) indicates $p < 0.5$ for single reviewers. Panel dilutes individual bias, *provided* the secret ballot prevents the senior MD from bullying the nurses.

  **Case 3: Gene Therapy (Ultra-Rare Disorder)**
  *   **Triage:** Q4 (Resource/Policy Barrier) = **YES**.
  *   **Lane:** **LANE 3 (Escalation).**
  *   **Reasoning:** Panel has zero experience ($p \approx 0$). This is a budget/values decision, not a "does it meet criteria" decision. Using a panel here creates a false veneer of medical consensus.
  *   **Outcome:** Panel Chair summarizes clinical uncertainty. Medical Director consults Finance/ Ethics. Decision made at Director level.
  *   **Why:** Stops your panel from burning out on cases they aren't equipped to judge. Reduces variance caused by guesswork.

  ---

  ### PART 4: LIMITATIONS & METRICS (READ THIS)

  **1. Where this is disguised judgment:**
  The **Triage (Section A)** is subjective. A clever reviewer can game the system by marking a complex case as "Binary Criterion" to avoid panel scrutiny.
  *   **Fix:** Audit 10% of Lane 1 cases monthly. If overturn > 15%, move that code to Lane 2.

  **2. Where this will misfire:**
  *   **Urgent Cases (24h):** Silent review + Secret Ballot takes time. In true emergencies, you will revert to "Senior MD decides." Acknowledge this. Mark these cases as "Expedited" and audit them separately.
  *   **The 3-2 Split:** Your culture likely hates disagreement. This procedure forces you to accept 3-2 decisions. If you force a re-vote to get 5-0, you re-introduce herding and invalidate the math.

  **3. Panel Size (5 vs. 7 vs. 9):**
  *   **Do not go to 7 or 9.** The marginal gain in accuracy is negligible compared to the scheduling nightmare.
  *   **Stop using panels for Lane 1.** You are currently wasting resources on cases where the "Wisdom of Crowds" adds no value because the "Crowd" is just repeating the same manual.

  **4. Metrics to Watch:**
  *   **The "Unanimity Rate":** If your panels are voting 5-0 more than 80% of the time, **you have herding.** People are waiting to hear the Senior MD's opinion before marking their ballot.
  *   **The "Criterion/Conclusion Gap":** Track cases where the panel agrees on all criteria (Step 3) but splits on the final decision. A high rate here means your **Manual is broken**, not your reviewers.
  *   **Overturn by Lane:** If Lane 2 (Panel) overturn rates remain >20%, your panel competence ($p$) is too low. You need better training, not more reviewers.

  **Summary:** Use panels for ambiguity, not for routine. Force silence before speech. Accept disagreement as data, not failure.
