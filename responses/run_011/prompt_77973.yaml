prompt: |-
  I've been running utilization review at a mid-size regional health plan for about six years now — we decide whether a requested service is "medically necessary" and therefore covered. It used to be one reviewer per case, but our state regulator and our own board have been pushing us toward panel review, on the theory that five heads beat one. My deputy is fully converted: he keeps citing some pop book about the wisdom of crowds, and over lunch last week he told me something like "if each reviewer is sixty percent likely to get it right, then five of them are basically always right," and I couldn't work out whether he was making a real point or mangling one. I did a philosophy minor years ago and I half-remember the Condorcet jury theorem from a social epistemology class — each voter more likely right than wrong, votes independent, and majority accuracy climbing toward certainty as the group gets bigger — but I also vaguely remember that people have objections to it that I never properly absorbed. What I want is for you to turn whatever that theorem and its standard criticisms actually establish into a decision procedure my team can run.

  Some shape of the operation so the thing is realistic. Panel-eligible referrals run about 200 a month; standard cases have to be decided in 72 hours and urgent ones in 24. A panel is normally two physicians, two nurses, and one non-clinical reviewer, and I chair. Everyone is trained on the same criteria manual and the same internal e-learning module, which I think means that when they get it wrong they tend to get it wrong together — I don't know whether that breaks the independence the theorem wants, or whether shared training is fine so long as the training is accurate, and I'd like a straight answer on that rather than a hedge. They deliberate out loud before voting and our senior physician sets the tone; I've watched nurses change their votes to fall in line, which I assume is its own problem. Some determinations look like clean criterion-application questions (does this patient meet this documented threshold), and others are ones where equally good clinicians just disagree and I'm not sure there's a fact of the matter at all. Our appeals data is the part that keeps me up: overturn rate on appeal is about 8 percent overall, but roughly 40 percent for adolescent partial-hospitalization psychiatric cases and about 35 percent for ultra-rare-disease therapies. Our medical director signs off on everything and cares a lot about like cases being treated alike, which pushes toward panels, but the panels are also where I see the most variance.

  So: give me a worksheet, maybe two pages, that a nurse or a physician could actually pick up and work through without any philosophy. I want an intake triage that sorts referrals into panel / single specialist / escalate-to-a-human-because-this-is-a-values-question lanes, then the questions to ask in order with what counts as a sufficient answer to each, and where the procedure simply stops with a no. Tell me how we should aggregate once we're in the room — plain majority, unanimity, or voting on each criterion separately and deriving the conclusion, including what to do when a panel agrees on every criterion and still splits on the answer. Say whether we should ever go to seven or nine reviewers, and be blunt if for one of our categories the honest recommendation is "stop using panels here," even though panels are my whole mandate. Run it on three cases: a routine advanced-imaging request for a patient with uncomplicated low back pain; a partial-hospitalization program for a 16-year-old where the risk assessment is genuinely contested; and a gene therapy for an ultra-rare disorder that nobody on our panel has ever seen. Then flag which steps of your own procedure are judgment calls dressed up as procedure, what the whole thing can't settle, how it will misfire, and what I should watch in our overturn data to catch it misfiring. Please don't send me a reading list or citations — I can't look anything up during work hours anyway and I'm not writing a paper. One inequality of arithmetic is fine if it earns its place, but keep the rest in plain language.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Utilization Review (UR) Manager at a mid-size regional health plan (6 years exp).
      *   **Context:** Moving from single reviewer to panel review (5 people: 2 MDs, 2 RNs, 1 non-clinical). Pressure from regulator/board. Deputy cites "Wisdom of Crowds"/Condorcet Jury Theorem (CJT).
      *   **Problem:** Deputy's understanding of CJT might be flawed. Shared training violates independence. Deliberation causes herd behavior. High overturn rates on appeals for specific categories (adolescent psych, ultra-rare disease). Variance in panel decisions.
      *   **Goal:** A practical, 2-page worksheet/decision procedure for the team. No philosophy jargon, no reading lists.
      *   **Specific Requirements:**
          *   Intake triage (Panel vs. Single vs. Escalate).
          *   Questions to ask in order + sufficient answers.
          *   Aggregation method (Majority? Unanimity? Criterion-based?).
          *   Panel size advice (5 vs. 7/9 vs. Stop using panels).
          *   Run the procedure on 3 specific cases (Low back pain imaging, Adolescent psych, Gene therapy).
          *   Self-critique: Where is this procedure just disguised judgment? Where will it fail? What metrics to watch?
          *   Tone: Blunt, practical, operational. One inequality allowed if useful.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) & Criticisms:**
      *   *Theorem:* If $p > 0.5$ (competence) and votes are independent, majority rule accuracy $\to 1$ as $n \to \infty$.
      *   *User's Deputy's Claim:* "If each is 60% right, 5 are basically always right." (Mathematically true for independent votes, but practically false here).
      *   *Criticism 1 (Independence):* Shared training + shared manual + shared culture = correlated errors. If the manual is wrong, *all* are wrong. This breaks CJT.
      *   *Criticism 2 (Deliberation):* Talking before voting introduces social pressure (herding), further breaking independence.
      *   *Criticism 3 (Competence):* If $p < 0.5$ (systemic bias or bad criteria), adding more people makes it *worse*.
      *   *Application:* For routine cases (high competence, clear criteria), panels are overkill and might introduce noise. For complex/ambiguous cases (low competence/consensus), panels help *if* independence is preserved.

  3.  **Drafting the Procedure (The "Worksheet"):**
      *   *Constraint:* Needs to be usable by nurses/physicians. No philosophy.
      *   *Structure:*
          1.  Triage (Gatekeeping).
          2.  The Review Process (Independence first, then discussion).
          3.  Voting/Aggregation.
          4.  Stop Rules.
      *   *Triage:*
          *   *Single Reviewer:* Clear criteria, low risk, low overturn rate (e.g., routine imaging).
          *   *Panel:* Complex medical judgment, moderate risk, conflicting guidelines.
          *   *Escalate (Ethics/Values):* High overturn, resource allocation, "no fact of the matter" (e.g., rare disease funding limits).
      *   *Process:* Crucial fix for the "herding" problem. **Secret ballot BEFORE discussion.** This restores independence.
      *   *Aggregation:* Majority rule is standard, but criterion-based voting is better for auditing. Let's recommend Criterion-Based Voting.
      *   *Panel Size:* 5 is fine for complex, but for routine, it's waste. For high-conflict values, 5 isn't enough (need leadership/ethics). Don't go to 7/9 (diminishing returns + scheduling nightmare).
      *   *Stop Using Panels:* Yes, for the routine stuff where overturn is low and criteria are clear.

  4.  **Running the Cases:**
      *   *Case 1 (Low Back Pain Imaging):* Routine. Criteria clear. Overturn low. -> *Single Reviewer.* Panel is waste.
      *   *Case 2 (Adolescent Psych):* High overturn (40%). Risk assessment contested. "Fact of the matter" unclear. -> *Panel,* but fix the process (Secret ballot).
      *   *Case 3 (Gene Therapy):* Ultra-rare. No expertise on panel. High cost/values. -> *Escalate.* Panel doesn't have competence ($p$ might be < 0.5). Needs Medical Director + Ethics + External Expert.

  5.  **Refining the "Straight Answer" on Independence:**
      *   User asked: Does shared training break independence?
      *   Answer: Yes, if the training is the source of error. If the training is perfect, correlation doesn't matter. But since overturn rates exist, the training/criteria aren't perfect. Therefore, shared training creates *correlated error*, which kills the CJT benefit.
      *   Fix: Diverse backgrounds + Secret Ballot.

  6.  **Developing the Self-Critique (The "Meta" Section):**
      *   Where is this disguised judgment? Triage itself is a judgment call.
      *   Where will it fail? When time pressure (24h urgent) prevents secret ballot/deliberation.
      *   Metrics to watch: Disagreement rate in secret ballot (if 5-0 always, herding is still happening or criteria are too rigid). Overturn rate by triage category.

  7.  **Drafting the Content (Iterative refinement for tone and length):**
      *   *Tone:* Professional, direct, operational.
      *   *Formatting:* Use bolding, lists, and clear headers to simulate a worksheet.
      *   *Math:* Include the CJT inequality simply to show why 60% isn't enough if correlated.
      *   *Constraint Check:* Two pages approx? (Will need to be concise). No citations.

  8.  **Final Review against User Prompt:**
      *   *Worksheet?* Yes.
      *   *Intake Triage?* Yes.
      *   *Questions/Stop Rules?* Yes.
      *   *Aggregation?* Yes (Secret ballot + Criterion).
      *   *Panel Size?* Yes (Stick to 5, don't expand).
      *   *Stop using panels?* Yes (for routine).
      *   *3 Cases?* Yes.
      *   *Self-Critique?* Yes.
      *   *Straight answer on independence?* Yes (Shared training = correlated error).

  9.  **Final Polish:** Ensure the distinction between "Medical Necessity" (facts/criteria) and "Coverage Policy" (values/budget) is clear, as that's the root of the rare disease issue. Ensure the "Secret Ballot" is highlighted as the key fix for the deputy's "wisdom of crowds" misunderstanding. (The crowds are only wise if they don't talk until after voting).

  *(Self-Correction during drafting)*: I initially thought about suggesting criterion-based voting for everything. But for the "values" cases, criteria might not exist. I need to make sure the "Escalate" lane handles the "no fact of the matter" cases. Also, need to be blunt about the 40% overturn rate—that indicates the criteria or the reviewers are systematically wrong ($p < 0.5$ effectively), so adding more reviewers makes it worse.

  *(Refining the Math)*: The user asked for one inequality. I'll use the basic Condorcet probability formula to show the "60%" claim is only true under independence. $P_{majority} = \sum_{k=\lceil n/2 \rceil}^{n} \binom{n}{k} p^k (1-p)^{n-k}$. Actually, that's too complex for a worksheet. I'll just state the condition: $Accuracy_{group} > Accuracy_{individual}$ ONLY IF errors are independent.

  *(Final Plan)*:
  1.  **Direct Answer:** Address the Deputy/CJT question first.
  2.  **The Worksheet:** Triage, Process, Voting.
  3.  **Case Applications:** Run the 3 scenarios.
  4.  **Limitations:** Where this breaks.

