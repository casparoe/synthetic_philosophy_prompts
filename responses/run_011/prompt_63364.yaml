          *   *Verdict:* Serious/Ironical.

      *   *(d) Descriptive Limitations:* Non-programmatic music (absolute music), conceptual art, art that evokes awe/sublime rather than specific emotion.
          *   *Analysis:* Tolstoy struggles with instrumental music. He calls it "indefinite."
