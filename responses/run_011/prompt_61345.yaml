answer: |-
  **Project Title:** Structural Primitives in Optimal Betting: Reconciling Growth Rates and Utility via Horizon and Threshold Constraints

  **Principal Investigator:** [Your Name]
  **Duration:** 8 Weeks (Summer Fund)

  **1. The Research Question**

  The debate between Expected Utility Theory (EUT) and Ergodicity Economics remains stalled. Proponents of the Kelly criterion argue that maximizing the long-run geometric growth rate is the only objective consistent with survival in repeated favorable bets. Proponents of EUT counter that Kelly betting is merely the specific solution for an agent with logarithmic utility. These camps talk past one another because they treat preferences (utility) or time-averages (growth) as the fundamental primitive, while ignoring the structural constraints of the decision environment.

  In reality, agents do not operate on infinite horizons. They face mortality hazards, hard deadlines, and survival thresholds (e.g., tuition payments, debt covenants, minimum stake requirements). Existing literature acknowledges this fragmentarily: the infinite-horizon limit yields Kelly, while finite-horizon goal-reaching problems (the red-and-black literature) often prescribe timid or bold play depending on the distance to the target. Crucially, the optimal betting fraction shifts dramatically based on these structural parameters even if the agent's beliefs and risk tolerance remain constant.

  This project poses a determinate question: **Can we specify a single objective function $J(h, \theta, d)$—taking hazard rate $h$, survival threshold $\theta$, and distance to target $d$ as inputs—that generates optimal betting fractions across these regimes, and is this function irreducible to a static utility function?**

  The critical test is reducibility. If for every structural configuration $(h, \theta, d)$, we can construct a static concave utility function $U(w)$ that replicates the same betting behavior, then the structural argument collapses into standard EUT, and the "ergodic" critique is merely semantic. However, if the optimal strategy implies a *time-inconsistent* utility function (i.e., the implied risk aversion changes as the deadline approaches without new information), then static EUT is falsified as a descriptive primitive. We seek to determine whether structural constraints constitute a distinct class of decision-theoretic primitives.

  **2. Work Plan (8 Weeks)**

  This project relies on discrete-time modeling and numerical simulation rather than deep measure-theoretic proofs. The goal is to map the parameter space and test for utility reducibility.

  *   **Weeks 1–2: Model Setup and Baseline Replication.**
      The student will build a discrete-time simulation environment in Python. The agent faces a sequence of binary bets with positive expected value. We will replicate the two limiting cases to validate the code: (1) Infinite horizon with no threshold, verifying convergence to the Kelly fraction; (2) Finite horizon with a fixed target, verifying convergence to the "timid" or "bold" strategies described in goal-reaching literature. This ensures the simulation engine correctly captures the known boundaries of the problem.

  *   **Weeks 3–5: Parameter Sweep and Strategy Optimization.**
      We will introduce the structural primitives: a hazard rate (probability the game ends exogenously) and a ruin threshold (wealth level below which the agent is removed from the game). For each combination of hazard rate and threshold distance, we will use numerical optimization to find the betting fraction that maximizes the probability of survival and growth. We will generate a "surface" of optimal betting fractions $f^*(h, \theta, d)$. The key output here is a visualization of how the optimal bet shifts as the horizon shortens or the threshold approaches. We expect to see phase transitions where the strategy jumps from Kelly-like growth to threshold-defense.

  *   **Weeks 6–7: The Utility Reducibility Test.**
      This is the core theoretical contribution. For every point on the optimal surface derived in Weeks 3–5, we will attempt to reverse-engineer the implied utility function. If the agent is behaving *as if* they are maximizing expected utility, there must exist a $U(w)$ such that the Euler equations hold at every time step. We will test if this $U(w)$ remains stable as time $t$ approaches horizon $T$. If the implied risk aversion coefficient drifts systematically as a function of time remaining, independent of wealth changes, we demonstrate that static utility cannot capture the structural constraint. We will quantify this drift to determine if it is negligible or fundamental.

  *   **Week 8: Synthesis and Write-Up.**
      The final week is dedicated to compiling the results into a draft working paper. We will produce the code repository, the visualization of the betting surface, and the analysis of the implied utility stability. The draft will argue for or against the "Structural Primitive" hypothesis based on the reducibility test.

  **3. Deliverables**

  1.  **Open-Source Code Repository:** A documented Python library capable of simulating repeated bets with configurable hazard rates, thresholds, and optimization routines. This will allow future researchers to test other structural constraints.
  2.  **Visualization Suite:** High-resolution heatmaps showing the optimal betting fraction as a function of horizon length and distance to ruin. This provides an intuitive map of where Kelly fails and where EUT struggles.
  3.  **Draft Working Paper:** A 15–20 page manuscript suitable for submission to a general interest economics or complexity journal. It will state the question, detail the simulation methodology, present the reducibility test results, and offer a verdict on the theoretical implications.

  **4. Feasibility and Risk Assessment**

  Is eight weeks realistic? For a full theoretical proof, no. For a simulation-based investigation that clarifies the landscape, yes.

  The primary risk is that the "Utility Reducibility Test" yields a null result. It is mathematically possible that for every structural constraint, there exists a contrived, state-dependent utility function that replicates the behavior. If this is the case, the project might conclude that the structural view is isomorphic to EUT, rendering the distinction purely philosophical rather than mathematical. However, even a negative result is valuable: it rigorously defines the limits of the structural critique.

  A second risk is optimization noise. Finding the true optimal fraction in a stochastic environment with path-dependent ruin conditions can be computationally noisy. We mitigate this by using dynamic programming on a discretized wealth grid rather than pure Monte Carlo search for the optimization phase.

  **Verdict:** The scope is tight but manageable. To ensure success, the student must avoid getting bogged down in continuous-time stochastic calculus. Sticking to discrete time steps and numerical optimization is the correct choice for this timeframe. If the reducibility test proves too complex, the scope can be cut to simply mapping the betting surface (Weeks 1–5) and describing the phase transitions qualitatively. However, the full 8-week plan is ambitious enough to yield a publishable insight regarding the time-consistency of implied preferences.

  This project does not require proving new theorems about martingales; it requires careful accounting of how constraints warp behavior. Eight weeks is sufficient to show whether those constraints look like preferences, or whether they are something else entirely.
