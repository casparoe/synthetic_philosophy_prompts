answer: |-
  You are right that all state powers drift, and I do not deny that search warrants, detention, and plea bargaining carry risks of abuse and error. But the slope is steeper here because the ground beneath it is illusory. When you issue a search warrant, you operate on the premise that evidence exists independently of the coercion used to find it; the gun is in the drawer whether the warrant was justified or not, and its discovery verifies the process. Torture, by contrast, attempts to manufacture evidence through the application of pain. The institution cannot distinguish between compliance and truth, especially under the time pressure of an imagined emergency. A search warrant that fails yields nothing; a torture warrant that fails yields falsehoods that look exactly like success. To institutionalize this is to build a justice system on a foundation where the primary output is structurally indistinguishable from lies.

  Your proposed safeguards—warrants, logging, reporting—presume that oversight bodies can evaluate the necessity and efficacy of the act after the fact. But because the epistemic link between pain and truth is broken, no logger or legislator can ever truly audit whether the torture was "successful" or merely effective at producing silence. With preventive detention, we can eventually prove innocence or guilt. With torture, the only proof of necessity is the information extracted, which we have already conceded is unreliable under coercion. If you legalize the practice, even narrowly, you legitimize the state's claim that it knows how to calibrate pain to truth. It does not. Once the law admits that such calibration is possible, the bureaucracy will inevitably expand to meet the demand for security, because the feedback loop required to check that expansion is severed.

  I do not renounce coercion, but I renounce coercion that destroys the possibility of verifying its own justification. The absolute ban is not a moral ornament; it is a functional firewall. It prevents the state from creating a class of specialists whose expertise rests on an epistemic impossibility. Other forms of coercion operate within a framework where error is correctable and evidence is external to the act of coercion itself. Torture makes the coercion the source of the evidence, collapsing the distinction between force and fact. If the law permits a warrant, it declares that there is a correct way to do this. There is not. The ban must remain exceptionless not because emergencies are impossible, but because the legal system cannot survive acknowledging them without surrendering its claim to truth.
