answer: |-
  Here is the plan. It is designed to survive the skepticism in the room, specifically the two who view psychiatry as a scam, without invalidating the lived experience of the nine who rely on their diagnoses for stability and identity.

  ### 1. The Warm-Up: Indifferent vs. Interactive
  **Verdict:** Your plutonium sketch is a **trap** if used as the opener.
  **Why:** If you start by telling people with lived experience that "rocks are real, but you are interactive," you establish a hierarchy of reality where they are on the bottom. It triggers the exact defense mechanism you're trying to bypass: *If I'm interactive, I'm not solid. If I'm not solid, my suffering isn't solid.*

  **The Fix:**
  Do not start with physics. Start with **jobs**.
  *   **Minute 0–10:** Open with the distinction between a "Job Description" and a "Person."
  *   **The Board:** Draw two columns. Left: "The Hammer." Right: "The Manager."
  *   **The Script:** "If I write a new manual for this hammer, does the hammer change how it hits nails? No. It's indifferent. If I write a new manual for the Manager role, does the person in that role change how they act? Yes. They read the manual. They adjust. They are interactive."
  *   **The Pivot:** "We are not hammers. We are managers of our own lives. That doesn't mean we aren't real. It means we read the manual."
  *   **Why this works:** It removes the "real vs. fake" ontology and replaces it with "responsive vs. unresponsive." It validates their agency. You can mention plutonium later *only* as a shorthand for "things that don't read the manual," but do not build the foundation on it.

  ### 2. The Carrying Example: Adult ADHD
  **Verdict:** **High Risk, High Reward.** It is the right choice for speed, but it will blow up if you frame it as "TikTok creates ADHD."
  **The Constraint:** For the two anti-psychiatry PSS, this example confirms their bias (diagnoses are trends). For the others, it threatens their stability (my diagnosis is just a trend).

  **How to Safe-It:**
  You must decouple the **suffering** from the **shape**.
  *   **The Narrative:** Do not start with the diagnosis. Start with the *struggle*. "Ten years ago, you struggled to focus. You called it 'laziness' or 'moral failure.' You felt shame."
  *   **The Loop Entry:** "Then the category 'Adult ADHD' became available (via books, then videos, then clinics)."
  *   **The Shift:** "You adopted the label. Did the focus problem vanish? No. Did the *shame* vanish? Often, yes. Did your *strategy* change? Yes (meds, timers, body doubling)."
  *   **The Feedback:** "Because you changed your strategy, the way you experience the focus problem changed. The clinicians then updated the criteria to match people like you."
  *   **The Takeaway:** "The pain was real before the label. The label changed the *path* of the pain, not the existence of it."
  *   **Why this holds:** It prevents the "It's a scam" conclusion by anchoring the pre-label suffering as objective fact. It prevents the "It's biological destiny" conclusion by showing how the label changes the behavior.

  **What a Carrying Example Must Have/Not Have:**
  *   **Must Have:** A clear "Before Label" state that involves genuine distress (prevents the "it's fake" argument).
  *   **Must Have:** A clear "After Label" behavioral change (demonstrates the loop).
  *   **Must Not Have:** A resolution where the problem disappears (that implies the label was a cure, not a classifier).
  *   **Must Not Have:** A resolution where the category is proven wrong (that implies the loop invalidates the science).

  ### 3. The Misconception Map
  These will surface in psychological order, not logical order. You must head them off *in situ*.

  **1. "This means my diagnosis isn't real / was invented by Big Pharma."**
  *   **When it surfaces:** Minute 15, the moment you draw the first arrow from "Classification" to "Person."
  *   **Intervention:** **Pre-empt this in the Warm-Up.** When you define "Interactive," say explicitly: "Interactive does not mean Imaginary. Gravity is real, but 'Gravity' is a word. If we change the word, the apple still falls. But if we change the word 'Grief,' the way we cry changes. The tears are real. The loop is about the tears, not the apple."
  *   **Status:** Do not try to dislodge this fully. Acknowledge that *some* categories are weaponized, but the *mechanism* of looping applies even to the most biological conditions (e.g., how knowing you have diabetes changes how you eat, which changes the progression of diabetes).

  **2. "This is just Labeling Theory / Self-Fulfilling Prophecy."**
  *   **When it surfaces:** Minute 30, when you close the circle on the whiteboard.
  *   **Intervention:** Distinguish **Stigma** from **Identity**. Labeling theory says: "Society calls you deviant, so you become deviant." Looping says: "You learn a description of yourself, and you *use* it to navigate the world." One is done *to* you (passive); one is done *with* you (active). Peer Support is about the latter.
  *   **Status:** Dislodge completely. This is a theoretical error that undermines their role.

  **3. "The real content here is that Psychiatry is Politics."**
  *   **When it surfaces:** Minute 45, specifically from the two skeptics. "So the DSM is just whoever has the power."
  *   **Intervention:** Agree partially, then pivot. "Who draws the map is political. Whether the map helps you navigate the terrain is practical. We are training to navigate the terrain, not redraw the borders today."
  *   **Status:** Let this one **stay partly standing.** If you argue too hard against the political nature of the DSM, you lose credibility with the skeptics. Acknowledge the politics, but bracket it as "outside the scope of this 90 minutes."

  **4. "If everything loops, no classification is better than any other (Relativism)."**
  *   **When it surfaces:** Minute 60, during discussion. "So if I call myself 'Neurodivergent' instead of 'ADHD,' that's just as good?"
  *   **Intervention:** Utility test. "Some maps get you to the hospital faster. Some maps get you fired. Some maps get you accommodations. The loop doesn't mean all maps are equal; it means we have to check if the map is working for the traveler."
  *   **Status:** Dislodge. This leads to clinical negligence.

  **5. "Knowing about looping means we should stop saying diagnostic words at all."**
  *   **When it surfaces:** Minute 75, the "Paralysis" phase.
  *   **Intervention:** "You cannot un-ring the bell. You are already looped. The goal isn't silence; it's *conscious* looping. We use the words that unlock doors for the client, knowing the words will change them."
  *   **Status:** Dislodge. This is dangerous for their job security and client safety.

  **Hardest to Dislodge:**
  **#1 ("My diagnosis isn't real").**
  **Advice:** Do not fight this with philosophy. Fight it with **validation**. "The loop requires a real person to loop. A ghost cannot loop. You are here. You are real. The loop proves your responsiveness, not your unreality." Let them keep the suspicion of the *institution*, but secure the reality of the *self*.

  ### 4. The Check (Last 10 Minutes)
  Do not ask a quiz question. Ask for a **Prediction**.

  **The Exercise:** "The New Label"
  *   **Prompt:** "I am going to give you a new classification for your work. Starting tomorrow, you are not 'Peer Support Specialists.' You are 'Recovery Consultants.'"
  *   **Task:** On a sticky note, write down **one specific thing** you will do differently on Tuesday because of that name change, and **one specific thing** a client might expect differently from you.
  *   **Success Criteria:** They must identify a change in *behavior* or *expectation* driven by the *label*.
      *   *Pass:* "I will focus more on goals than listening." / "Clients will ask me for advice instead of stories."
      *   *Fail:* "It's just a name." / "I'll do the same thing." (This misses the interactive nature).
  *   **Why this works:** It forces them to run the loop mechanism in real-time on themselves. It proves they understand that changing the classification changes the classified.

  ### 5. What to Leave Out (And Say You Are)
  You are correct; Hacking's full apparatus is too heavy. To maintain safety and time, you must explicitly bracket the following. Write these on the side of the whiteboard under "Parking Lot" and tell them *why* they are there.

  1.  **Historical Ontology:** (How the very possibility of being a certain kind of person changes over centuries).
      *   *Say:* "We are looking at the mechanism now, not the history. We don't have time for the 19th-century genealogy of the hysteric."
  2.  **The Multiple Personality Disorder (MPD) Wars:** (Hacking's case study on how therapy created alters).
      *   *Say:* "This is too triggering and specific for a general intro. We are focusing on everyday categories, not extreme trauma responses."
  3.  **"Is Psychiatry a Science?":**
      *   *Say:* "Looping happens in biology (ecosystems change when studied), economics (markets change when predicted), and medicine. Whether psychiatry is a 'science' is a debate for another day. Today we are looking at how *categories function*."

  **Blunt Correction on Your Sketch:**
  Your instinct to touch psychiatry *only* at the end is wrong. If you wait until minute 60 to talk about the DSM, the room will have spent an hour assuming you are talking about abstract philosophy, and the pivot will feel like a bait-and-switch.
  **Correction:** Introduce the DSM as the "Classification Machine" in Minute 20, right after you draw the loop. Make it clear immediately that this is about *their* paperwork, *their* clients, and *their* charts. Keep the stakes visible the whole time.

  **Summary of Flow:**
  1.  **0-10:** Hammer vs. Manager (Interactive/Indifferent).
  2.  **10-20:** The Loop Diagram (Board).
  3.  **20-30:** ADHD Example (The Carrying Story).
  4.  **30-60:** Implications for DSM/Work (Addressing Misconceptions 1, 2, 3 as they arise).
  5.  **60-80:** Utility & Ethics (Addressing Misconceptions 4, 5).
  6.  **80-90:** "Recovery Consultant" Sticky Note Check.
