prompt: |-
  I teach a third-and-fourth-year seminar called "Cooperation, Democracy, and the Limits of Expected Utility" (co-taught with someone from the politics department, who is convinced the whole debate about voter rationality was settled empirically by turnout studies and gets annoyed when I keep bringing up normative questions). I'm writing the closed-book final now — two hours, no notes, and I've told the students in advance that they won't be expected to recall any citations, so the question has to carry everything it needs inside itself. I want one essay question on the paradox of voting, worth 30 marks, and my big constraint is that it must not be answerable by reciting the Downsian calculus, noting that p is astronomically small in a national election, and then bolting on the citizen-duty term that Riker and Ordeshok added as if that were a solution rather than a redescription. Every single one of last year's answers did exactly that and I couldn't tell the strong students from the ones who'd memorized a Wikipedia summary.

  So here's the seed material I want you to build the question out of — please use it more or less as given, since the point is that the numbers are tuned to take away the easy outs. **Case: the Mill Road levy.** A town of 12,000 registered voters decides by referendum whether to fund a flood barrier; it passes iff at least 6,000 vote yes. 3,000 of the town's households sit in the flood zone. A poll released three days before the vote, which is stipulated to be accurate and to be common knowledge, puts support at a dead heat, such that each individual flood-zone voter's probability of casting the decisive yes vote is 1/40. Cost of voting is about 45 minutes and €12 in parking, so call it €15; a flood-zone household's expected avoided loss if the levy passes is €6,000 over twenty years. So p×B = €150 against a cost of €15, and the purely instrumental arithmetic says vote — decisively. But there's a twist I want the question to hinge on: every one of the 3,000 flood-zone voters faces the very same numbers and knows the others do too, and nobody can coordinate, communicate, or be selectively rewarded. If they all reason their way to voting, turnout is no longer marginal, the race stops being close, and p collapses toward zero for everyone — the consideration that made voting rational destroys itself once it's普遍 acted on. And here's the second seed: one of my grad students has proposed what she calls the **Divisibility Principle** — when the value of an outcome depends only on how many people contribute, each contributor's reason to contribute equals the total value of the outcome divided by the number who contribute, whether or not their own contribution makes the difference between the outcome's obtaining and its not obtaining. She offers DP as a rescue of the instrumentalist story. I want the question to force students to say precisely what DP does and doesn't buy you: is it still an instrumental account at all, or expressivism/rule-consequentialism wearing its clothes; what it has to say about voters with unequal costs (the one for whom voting costs €200 rather than €15); what it implies in the limit where you're certain you're not decisive; and whether the fact that everyone's shares sum neatly back to the total value is a virtue or a symptom that DP needs an independent account of why reasons should be divided up that way in the first place.

  Act as a political philosopher who is also comfortable enough with participation games to formalize a little bit — but keep any formalism to what a third-year with one term of decision theory can follow on paper, and don't expect students to know that literature by name. Before you draft, brainstorm four or five candidate cruxes the case opens up and pick the sharpest; think carefully about which ones a well-prepared student could reach in two hours versus which ones need a whole dissertation. Then give me: (a) the exam question itself, with the case stated compactly enough to read in five minutes and a clear instruction about what the essay must decide; (b) a model answer of about 900 words that actually takes a position rather than surveying options; (c) a marking scheme built on six must-hit moves, with the marks each is worth summing to 30 and a one-line note on how students typically botch each; and (d) a short separate list of moves that should actively lose marks — I'd want that list to include, at minimum, confusing the voting paradox with rational ignorance about political information, treating the D-term as an explanation, and gesturing at Parfit's harmless-torturers style no-difference cases without saying how a threshold outcome with identical contributions differs from a case of imperceptible harms. One more thing I care about alot: the tuned p of 1/40 is supposed to break the standard move of saying "expressive voting solves it," because expressive benefits are cheap for a voter precisely when the chance of affecting the outcome is negligible — at 1/40 you can no longer cheer for your side while ignoring what your ballot does. Make sure the marking scheme rewards a student who spots that, and be explicit about how many marks it's worth.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**

      *   **Context:** Third/fourth-year seminar ("Cooperation, Democracy, and the Limits of Expected Utility"). Co-taught with a politics colleague (empiricist vs. normative tension).
      *   **Task:** Create a closed-book final exam question (30 marks, 2-hour limit) on the Paradox of Voting.
      *   **Constraint 1 (The Problem):** Students usually just recite Downs ($R = PB - C$), note $P \approx 0$, add $D$ (duty), and stop. This needs to be prevented.
      *   **Constraint 2 (The Case):** "Mill Road Levy." 12,000 voters, 6,000 needed. 3,000 flood-zone households. Poll says dead heat. Individual $p = 1/40$. Benefit ($B$) = €6,000. Cost ($C$) = €15. $PB = €150 > C$. Instrumentally rational to vote *individually*.
      *   **Constraint 3 (The Twist):** If all 3,000 reason this way, turnout spikes, $p$ collapses, rationality evaporates. (Self-defeating reasoning).
      *   **Constraint 4 (The Concept):** "Divisibility Principle" (DP). Reason to contribute = Total Value / Number of Contributors, regardless of decisiveness.
      *   **Constraint 5 (The Goal):** Force students to evaluate DP. Is it instrumental? Expressive? Rule-consequentialist? How does it handle unequal costs? What happens in the limit ($p=0$)? Is the summation virtue or circular?
      *   **Constraint 6 (Formatting):** (a) Exam Question, (b) Model Answer (~900 words, takes a position), (c) Marking Scheme (6 moves, 30 marks total, common errors), (d) List of mark-losing moves (specific prohibitions).
      *   **Tone:** Political philosopher comfortable with game theory/formalism but accessible to 3rd years.
      *   **Specific Emphasis:** The $p=1/40$ breaks the "expressive voting" easy out (because impact is significant enough that you can't ignore consequences). Marking scheme must reward spotting this.

  2.  **Brainstorming Cruxes:**

      *   *Crux 1: The Self-Defeating Nature of Instrumentalism.* If everyone calculates $PB > C$, $P$ changes. This is a Nash Equilibrium problem. DP tries to fix the calculation, but does it fix the game?
      *   *Crux 2: The Status of DP.* Is DP actually instrumental? If I'm not decisive, my contribution doesn't *cause* the benefit. DP assigns credit retroactively or proportionally. This looks like Rule Consequentialism (follow the rule that produces good) or Fair Play (fair share of burden), not Expected Utility.
      *   *Crux 3: Heterogeneity.* DP says Reason = $V/N$. But $C$ varies. If my $C > V/N$, DP says don't vote? Or does it say vote anyway because it's a duty? If it allows opt-out based on cost, does the collective benefit still hold?
      *   *Crux 4: The Limit Case.* If I know for sure I'm not decisive (e.g., landslide), DP still assigns value. Does this detach reason entirely from causal efficacy?
      *   *Crux 5: The Expressive Out.* Usually, people say "I vote for expression." But here $PB = 150$, $C = 15$. The instrumental gain is huge compared to cost. Expression is usually a cover for when $PB \approx 0$. Here $PB \gg C$. So expression isn't the main driver.

      *Selection:* The sharpest crux is the *category error* of DP. It claims to save instrumentalism but actually shifts the ground to a non-causal account of reasons (Fair Play/Rule Consequentialism). The prompt asks to evaluate DP specifically.

  3.  **Drafting the Exam Question (Part a):**

      *   Need to present the Mill Road Case clearly.
      *   Need to define DP clearly.
      *   Need to set the task: Evaluate DP as a solution to the paradox *in this specific context*.
      *   Must emphasize the $p=1/40$ constraint (no easy "P is zero" dismissal).
      *   Must ask about the nature of the reasoning (Instrumental vs. Other).

  4.  **Drafting the Model Answer (Part b):**

      *   *Position:* DP is not a rescue of instrumentalism; it is a disguise for a principle of fair play or rule-consequentialism. It fails as instrumentalism because it severs the link between individual action and outcome causation.
      *   *Structure:*
          1.  Analyze the Mill Road numbers ($PB > C$). Acknowledge the instability (if all vote, $P$ drops).
          2.  Define what DP does (allocates value without causation).
          3.  Critique DP as instrumentalism (causation is required for instrumental reason).
          4.  Reclassify DP (Fair Play/Rule Consequentialism).
          5.  Address the Heterogeneity/Cost issue (DP breaks if costs vary too much without a duty component).
          6.  Conclusion: DP solves the motivation problem but abandons the Expected Utility framework.
      *   *Word Count:* ~900 words.
      *   *Tone:* Argumentative, precise.

  5.  **Drafting the Marking Scheme (Part c):**

      *   Total 30 marks.
      *   6 Moves x 5 marks each? Or weighted? Let's do 6 moves, varying weights to sum to 30.
      *   Move 1: Correctly interpreting the Mill Road arithmetic ($PB > C$ initially).
      *   Move 2: Identifying the equilibrium instability (if all vote, $p$ drops).
      *   Move 3: Explaining DP's mechanism (value division independent of decisiveness).
      *   Move 4: Critiquing DP's claim to instrumentalism (causation vs. attribution).
      *   Move 5: Addressing the Heterogeneous Cost problem (what if $C > Share$?).
      *   Move 6: Spotting the Expressive Voting trap (why $p=1/40$ blocks the standard expressive solution).
      *   *Common Errors:* Need a one-liner for each.

  6.  **Drafting the "Lose Marks" List (Part d):**

      *   Confusing Rational Ignorance with Rational Abstention.
      *   Using the $D$-term (Riker/Ordeshook) as a solution.
      *   Vague Parfit references without threshold distinction.
      *   Ignoring the $p=1/40$ constraint (treating it as a standard low-$p$ case).

  7.  **Refining and Polishing:**

      *   *Check Constraint:* The prompt says "Make sure the marking scheme rewards a student who spots that [p=1/40 breaks expressive voting], and be explicit about how many marks it's worth." I need to ensure Move 6 in the marking scheme is explicit about this.
      *   *Check Constraint:* "Model answer... actually takes a position rather than surveying options." I will argue DP is *not* instrumental.
      *   *Check Constraint:* "Formalism... third-year... one term of decision theory." Keep math to $PB - C$ and simple fractions.
      *   *Check Constraint:* "Case stated compactly." Keep the Mill Road text tight.

      *(Self-Correction during drafting)*: I need to make sure the Model Answer doesn't just summarize the prompt but *argues*. I will take the stance that DP is a category mistake regarding instrumentalism.
      *(Self-Correction on Marking)*: Ensure the marks add up to exactly 30.
      *(Self-Correction on "Lose Marks")*: Ensure the specific prohibitions from the prompt are included.

  8.  **Final Review against constraints:**
      *   30 marks? Yes.
      *   No citations required? Yes.
      *   Mill Road case used as given? Yes.
      *   DP concept integrated? Yes.
      *   Model answer ~900 words? Yes.
      *   Marking scheme 6 moves? Yes.
      *   Lose marks list specific? Yes.
      *   Expressive voting trap addressed? Yes.

      *Let's write.*
answer: |-
  (a) **Exam Question**

  **Question 1 (30 Marks)**

  **Case: The Mill Road Levy**
  A town of 12,000 registered voters decides by referendum whether to fund a flood barrier; it passes iff at least 6,000 vote yes. 3,000 of the town's households sit in the flood zone. A poll released three days before the vote, which is stipulated to be accurate and to be common knowledge, puts support at a dead heat, such that each individual flood-zone voter's probability of casting the decisive yes vote is 1/40. Cost of voting is about 45 minutes and €12 in parking, so call it €15; a flood-zone household's expected avoided loss if the levy passes is €6,000 over twenty years. So $p \times B = €150$ against a cost of €15, and the purely instrumental arithmetic says vote — decisively.

  **The Instability:** Every one of the 3,000 flood-zone voters faces the very same numbers and knows the others do too, and nobody can coordinate, communicate, or be selectively rewarded. If they all reason their way to voting, turnout is no longer marginal, the race stops being close, and $p$ collapses toward zero for everyone — the consideration that made voting rational destroys itself once it is universally acted on.

  **The Proposal:** A grad student proposes the **Divisibility Principle (DP)**: When the value of an outcome depends only on how many people contribute, each contributor's reason to contribute equals the total value of the outcome divided by the number who contribute, whether or not their own contribution makes the difference between the outcome's obtaining and its not obtaining.

  **Task:**
  Write an essay evaluating the Divisibility Principle as a solution to the instability described in the Mill Road case. Your essay must decide whether DP successfully rescues the *instrumentalist* account of voting or whether it covertly relies on a different normative framework (e.g., expressivism, fair play, or rule-consequentialism). In your analysis, you must address: (1) how DP handles the collapse of $p$ when turnout rises; (2) whether DP remains "instrumental" if the voter is causally ineffective; (3) how DP handles voters with unequal costs (e.g., a voter for whom $C = €200$); and (4) why the specific probability of $1/40$ in this case blocks the standard "expressive voting" solution.

  ***

  (b) **Model Answer**

  The Mill Road case presents a specific failure mode of expected utility theory: not the standard paradox where $p \approx 0$, but an equilibrium instability where individual rationality creates collective irrationality. The Divisibility Principle (DP) attempts to stabilize this by decoupling individual reason from causal decisiveness. However, a close examination reveals that DP does not rescue instrumentalism; rather, it abandons the causal requirements of instrumental reason in favor of a principle of fair play or rule-consequentialism.

  First, we must acknowledge why the standard toolkit fails here. In typical national elections, $p$ is so negligible that $pB < C$ regardless of $B$. Students often solve this by adding a $D$-term (civic duty) or claiming voting is "expressive." However, the Mill Road stipulation that $p = 1/40$ blocks the expressive exit. Expressive voting is plausible only when the instrumental impact is negligible, allowing the voter to consume the "act" of voting without worrying about the "outcome." Here, the expected instrumental return (€150) dwarfs the cost (€15). To claim one votes merely for expression ignores the massive causal leverage available. The problem is not that the vote doesn't matter; it is that if *everyone* leverages that importance, the leverage vanishes.

  DP addresses this by asserting that a voter's reason to act is $V/N$ (Total Value divided by Number of Contributors), regardless of whether their vote is decisive. This stabilizes the calculation: even if turnout rises and $p$ collapses to zero, the "share" of the benefit remains constant. If the barrier saves €18,000,000 total (3,000 households $\times$ €6,000), and 3,000 vote, each has a reason of €6,000 to contribute, vastly outweighing the €15 cost.

  However, calling this "instrumental" is a category error. Instrumental rationality requires a causal link between means and ends. I have an instrumental reason to buy an umbrella only if my buying it contributes to my staying dry. If I am certain my vote will not change the outcome (the limit case where $p=0$), DP asserts I still have a reason grounded in the outcome's value. This is not instrumentalism; it is a form of *complicity-based* reasoning or rule-consequentialism. It suggests I should act as a co-author of the outcome, claiming a share of the credit, rather than as a causal lever. DP effectively changes the definition of "benefit" from "outcome caused by me" to "outcome I participated in."

  This shift creates difficulties regarding heterogeneous costs, which DP handles poorly. Instrumentalism naturally accounts for cost variations: if $C > pB$, I abstain. DP suggests my reason is $V/N$. But if my personal cost to vote is €200 (due to disability or distance), and my "share" of the benefit is valued at €6,000, DP implies I should still vote. While this might be normatively desirable, it is no longer a prediction of rational choice based on self-interest. It requires a normative premise that I *ought* to bear costs up to the value of my share, which is a principle of Fair Play, not Expected Utility. If DP allows me to opt-out because $C > \text{Share}$, the collective benefit might fail if too many high-cost voters opt out, reintroducing the instability DP was meant to solve.

  Furthermore, the fact that individual shares sum neatly to the total value is often presented as a virtue of DP, ensuring no "double counting" of value. But this arithmetic neatness is a symptom of the principle's circularity. It assumes the very thing that needs to be justified: that reasons for action can be divided independently of causal efficacy. Why should I care about my "share" of a benefit I did not cause? DP answers this by smuggling in a duty to cooperate.

  In conclusion, the Divisibility Principle solves the Mill Road instability, but only by ceasing to be an instrumental account. It correctly identifies that in threshold public goods games, causal decisiveness is the wrong metric for individual reason. However, by retaining the language of "benefit" while severing the link to causation, it obscures the shift to a deontological or rule-consequentialist framework. For the Mill Road voter, DP provides a reason to vote, but it is a reason based on membership and contribution, not on the expected utility of the ballot itself.

  ***

  (c) **Marking Scheme (30 Marks Total)**

  | Move | Marks | Requirement | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1. Arithmetic & Instability** | 5 | Correctly identifies that $pB > C$ initially (€150 > €15) but notes that universal voting collapses $p$, making the instrumental gain self-defeating. | Treating the case as a standard $p \approx 0$ paradox and ignoring the equilibrium instability. |
  | **2. The Expressive Block** | 5 | Explicitly notes that $p=1/40$ is too high for "expressive voting" to work; the instrumental stakes are too significant to ignore consequences. | Claiming expressive voting solves the case despite the high probability/impact stipulation. |
  | **3. DP Mechanism** | 5 | Explains DP as allocating value ($V/N$) independent of decisiveness ($p$), thereby insulating the reason to vote from turnout fluctuations. | Confusing DP with the Riker/Ordeshook $D$-term (duty) rather than a recalculation of benefit. |
  | **4. Instrumentalism Critique** | 5 | Argues that DP is *not* truly instrumental because it severs the causal link between the individual act and the outcome. | Accepting DP as instrumental without questioning the requirement of causal efficacy. |
  | **5. Heterogeneous Costs** | 5 | Addresses the problem of unequal costs (e.g., €200 voter); notes DP requires a normative duty (Fair Play) to work where $C > \text{Share}$. | Assuming DP handles cost variations automatically without needing a normative duty component. |
  | **6. Normative Reclassification** | 5 | Concludes DP is actually Rule-Consequentialism or Fair Play; identifies the "summing to total" as arithmetic neatness, not justification. | Concluding DP is a successful rescue of Expected Utility theory without reclassifying the normative framework. |

  ***

  (d) **Moves That Lose Marks**

  *   **The "D-Term" Dodge:** Adding a "citizen duty" variable ($D$) to the $R = PB - C$ equation as if it were an empirical solution. (This is the Riker/Ordeshook redescription the question explicitly forbids).
  *   **Rational Ignorance Confusion:** Discussing the rationality of *learning* about politics (information costs) rather than the rationality of *turnout* (participation costs).
  *   **The Parfit Gesture:** Mentioning Parfit's "Harmless Torturers" or "overdetermination" without explaining how a *threshold* outcome (6,000 votes needed) differs from a case of imperceptible harms.
  *   **Ignoring the Probability:** Treating $p=1/40$ as effectively zero. (The question is tuned specifically to prevent the "my vote doesn't matter" move; ignoring the number loses the 5 marks allocated for the Expressive Block).
  *   **Circular Summation:** Arguing that DP is valid *because* the shares sum to the total value, without explaining *why* agents should accept that division of reason in the first place.
  *   **Empiricist Deflection:** Arguing that "turnout studies show people do vote, so the paradox is false." (This appeals to the co-instructor's view, but fails the philosophical task of evaluating the *reasoning*).
