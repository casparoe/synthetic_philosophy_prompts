answer: |-
  Step (1) is the premise you must reject, but doing so saves statistical explanation rather than conceding the field to narrative.

  It looks innocent because it codifies the intuitive Hempelian view that to explain an event is to show it was to be *expected* (high probability). This matches our everyday sense that a good explanation removes surprise. However, Wesley Salmon's critique of the Covering Law model demonstrated that explanation requires citing statistically *relevant* factors, not necessarily those that raise the probability above 0.5. A radioactive atom's decay is explained by its half-life and quantum state even if the probability of *that* atom decaying *now* is low; the explanation lies in the statistical relevance of the causes, not the high probability of the outcome.

  Rejecting (1) costs you the specific "High Probability" requirement of the Inductive-Statistical model, but it does not cost you probabilistic explanation itself. A weaker form of (1) survives: "An explanation is adequate only if it cites factors that are statistically relevant to the outcome." This preserves the statistical account without demanding impossible certainty. Consequently, your roommate's inference from the falsity of (1) to the supremacy of narrative is a false dichotomy; you can reject high-probability requirements while maintaining that historical explanation is fundamentally structural and statistical (e.g., using Statistical Relevance or Mechanistic models) rather than purely narrative.

  Regarding your preference for keeping (2) over (1): you are exactly right. Chaos theory (2) is robust, but it applies primarily to fine-grained token events (exact trajectories), not macro-historical types (revolutions, regime collapses). Step (4) exploits this by equivocations on "outcome O," treating historical events as fragile tokens rather than robust types. Even if (4) holds for tokens, (1) is still the deeper philosophical error because it fails even for non-chaotic low-probability events.

  If ranking the premises by sacrificial cost:
  1.  **Step (1):** Cheapest to sacrifice. It is philosophically obsolete (post-Salmon) and contradicted by successful scientific practices (quantum mechanics, evolutionary biology) that explain low-probability events.
  2.  **Step (4):** Moderate cost. Rejecting it requires defending the claim that historians explain macro-types with high probability, which is plausible but contested by structuralists vs. contingency debates.
  3.  **Step (2):** Most expensive to sacrifice. Denying path dependence or chaos in complex social systems contradicts established complexity theory and empirical modeling.

  Your roommate wins the battle against (1) but loses the war because he assumes the only alternative to "High-Probability Statistics" is "Narrative," ignoring "Low-Probability Statistics" and "Mechanism."
