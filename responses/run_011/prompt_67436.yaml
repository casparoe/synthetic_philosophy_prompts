answer: |-
  ### I. The Battery Audit

  Here is the explicit correspondence of the figure as your consultant deploys it, followed by the points where the mapping is invented to sustain the analogy.

  *   **The Battery:** The worker's somatic and psychological capacity.
  *   **The Charge:** Leisure, sleep, and non-work time.
  *   **The Discharge:** Labour, cognitive effort, and emotional regulation performed for wages.
  *   **The Circuit:** The employment contract and the broader economic system that completes the loop between capacity and capital.
  *   **Depth of Discharge:** The intensity of exploitation or overtime hours relative to baseline capacity.
  *   **Cycle Life:** The working lifespan before burnout, injury, or death.
  *   **The Manufacturer:** The State or the Corporation, which sets safety standards and liability limits.
  *   **The Warranty:** Workers' compensation, health insurance, or labour law protections.

  **Invented Mappings:**
  *   **The Manufacturer:** Batteries have a distinct maker with spec sheets. Humans do not. Attributing this to the State is a political fiction, not a physical correspondence. In the 1840s strand, there is no manufacturer, only God and the Father; forcing the State into this role anachronistically imposes a welfare logic where none existed.
  *   **The Warranty:** A warranty implies a guarantee of replacement or repair. In all three strands, particularly the Tokyo and 1840s strands, the system is designed to discard the unit, not repair it. The mapping exists only as a normative claim (what *should* happen), not a descriptive one.
  *   **Uniform Chemistry:** The analogy assumes all three characters possess the same internal chemistry. It ignores that the 1840s daughter's fatigue is theological, the French clerk's is bureaucratic, and the Tokyo physician's is biometric. The battery flattens these distinct chemistries into a single voltage.

  ### II. Failures of the Mapping

  The failures of the battery analogy are not merely poetic weaknesses; they are structural faults that determine the political and moral outcome of the narrative.

  **Load-Bearing Failures (Undermine the Consultant)**
  These are failures that, if acknowledged, dismantle the consultant's claim that death at work is a technical error rather than a moral one.

  1.  **Instrumentality of Rest:** In the battery model, charge exists solely to enable further discharge. Rest has no intrinsic value; it is only valuable insofar as it returns the unit to service. If this mapping holds, your consultant is correct: leisure is merely maintenance. However, in human experience, rest often possesses intrinsic value (pleasure, contemplation) unrelated to future labour. If rest is not purely instrumental, the "charging schedule" cannot be optimised solely for work output. The moral question returns: *why* are we working?
  2.  **Irreversibility of Damage:** A battery can be recharged to near-original capacity many times before degradation. Human depletion is often cumulative and irreversible. Trauma, chronic stress, and grief do not reset to 100% after a weekend. If the human unit cannot be restored to its previous value, the "technical fix" of tuning the charger is insufficient. The damage is structural, not operational. This validates the Tokyo physician's spreadsheet of the dead as a record of structural failure, not individual maintenance errors.
  3.  **Singularity of Metric:** A battery has a single state of charge (voltage). Humans have incommensurable states: attention, appetite, libido, empathy, patience. One may be fully charged physically but depleted emotionally. The consultant's argument relies on reducing death to a single metric (energy level). If depletion is multidimensional, a person can die of despair while physically rested. This restores the moral dimension to the 1840s strand: her exhaustion is not just a lack of charge, but a conflict of values.

  **Decorative Inconveniences (Do Not Affect the Conclusion)**
  These are mismatches that do not fundamentally alter the consultant's argument.

  1.  **Self-Discharge:** Batteries lose charge when idle. Humans age when resting. This is a minor physical parallel that does not change the moral calculus of work-induced death.
  2.  **Memory Effect:** Some batteries retain a memory of discharge patterns. Humans do psychologically, but this is a nuance of trauma rather than a flaw in the core analogy of depletion.
  3.  **Chemical Composition:** The specific biology of fatigue versus electrochemistry is irrelevant to the structural argument about input and output.

  **Ideological Direction**
  You are correct to suspect the figure carries an ideological load. The battery is an instrumental object; it exists to power something else. It has no purpose in itself. By adopting this figure, you implicitly accept that the worker's purpose is to power the circuit. This is indeed a secularised Protestant ethic: the sin is not idleness before God, but inefficiency before the Market. The figure survives adoption by those who despise overwork because it accepts their premise (that we are units of production) while arguing for better maintenance. It is a reformist figure, not a revolutionary one.

  ### III. The Problem of Dead Air

  Your distinction between "recharge scenes" and "dead air" is critical.

  *   **Recharge scenes** (sleep, convalescence) fit the battery model: input is applied to restore capacity.
  *   **Dead air** (watching a canal, mending without purpose) fits neither charge nor discharge.

  In the battery analogy, dead air is classified as **leakage** or **inefficiency**. A battery sitting on a shelf loses charge without doing work. It is a waste state. If you adopt the battery figure, you must classify your characters' moments of deepest humanity (the dead air) as system errors.

  **Verdict:** This is a fatal objection for a novel, though it serves the consultant. A novel requires space for existence without utility. The battery figure denies this space. If the figure cannot accommodate dead air, it cannot accommodate the interior life of your characters. It reduces them to their function within the circuit. You cannot write a triptych about *work* using a figure that makes work the only valid state of being. The dead air is where the resistance to work lives; the battery analogy treats resistance as a fault.

  ### IV. Alternative Figures

  You require figures that can carry a chapter, accommodate dead air, and address the three strands without collapsing into technocracy.

  **1. Debt**
  *   **The Figure:** Work incurs a debt on the body and soul; rest is repayment. Life is a ledger.
  *   **Visible:** The moral weight of obligation, the accumulation of interest (stress), the inevitability of default (death). It captures the 1840s theology (sin/debt) and the Tokyo social obligation (giri).
  *   **Conceals:** The pleasure of labour. It frames all work as a loss, which may flatten the French clerk's bureaucratic pride.
  *   **Dead Air:** A moratorium on payments. Time spent ignoring the ledger. It validates dead air as a suspension of obligation, not a leak.
  *   **Distortion:** It risks making the 1840s strand too theological and the Tokyo strand too financial. It may obscure the physical reality of exhaustion.

  **2. Tenancy**
  *   **The Figure:** The worker does not own their capacity; they lease it to the employer for a term. The body is the property; the labour is the rent.
  *   **Visible:** Legal rights, time limits, the power dynamic between landlord (corporation) and tenant (worker). It fits the French legalism and the Tokyo corporate control.
  *   **Conceals:** The internal sensation of fatigue. It is external and contractual.
  *   **Dead Air:** Occupying the flat without using the amenities. It is a valid use of the space. The tenant has a right to exist in the property without generating rent every moment.
  *   **Distortion:** The 1840s strand may distort, as property relations were different (serfdom vs wage labour), but the theological idea of the body as God's temple (leased from God) fits the Nonconformist context.

  **3. Erosion**
  *   **The Figure:** Work is a fluid (time, demand) flowing over stone (the worker). Death is the collapse of the structure.
  *   **Visible:** Irreversibility, slow violence, the physical wearing down. It fits the Tokyo death and the 1840s mill dust.
  *   **Conceals:** Agency. Stone does not choose to be eroded. It risks making the characters too passive.
  *   **Dead Air:** Sedimentation. Material settling. It allows for stillness that is not restorative but accumulative.
  *   **Distortion:** The French strand may distort; bureaucracy is not always erosive, sometimes it is static. It may lack the drama of the 35-hour week debate.

  ### V. Commitment

  For the Tokyo strand, I would use **Tenancy**.

  **Reasoning:**
  The Tokyo strand is narrated by an occupational-health physician keeping a spreadsheet of the dead and wearing a device that measures readiness. The battery figure makes her a mechanic checking charge levels. The **Tenancy** figure makes her a **surveyor inspecting properties for habitability**.

  *   **The Watch:** Instead of a charge level, the watch reports on the condition of the lease. Is the tenant over-occupying the space? Is the landlord demanding too much rent (hours) for the property's zoning (health limits)?
  *   **The Death:** The death at the desk is not a flat battery (technical failure); it is an **unlawful eviction**. The corporation demanded rent (labour) that exceeded the lease terms (human capacity), and the tenant was removed (died) for non-payment of health.
  *   **The Spreadsheet:** It is not a log of failures, but a register of breached contracts.

  **Impact on the Consultant's Argument:**
  If your consultant adopts the Tenancy figure, his argument shifts from **maintenance** to **liability**.
  *   *Battery Argument:* "The charging schedule was wrong. We need better sleep hygiene." (Blame lies with the worker's maintenance or the system's efficiency).
  *   *Tenancy Argument:* "The landlord exceeded the lease terms. The rent was too high for the property." (Blame lies with the corporation's demands).

  This destroys the consultant's attempt to depoliticise the death. A flat battery is an accident; an unlawful eviction is a crime. It allows you to keep the technical language of the Tokyo strand (metrics, readiness, spreadsheets) while subverting its ideological conclusion. It accommodates dead air (the tenant's right to sit in the room) and it bridges the three strands: the 1840s daughter (tenant of God vs tenant of Father), the French clerk (statutory rights of the tenant), and the Tokyo physician (inspector of breaches).

  The battery asks: "How do we keep them working?"
  The tenancy asks: "What do we owe them for the use of their lives?"

  Use the tenancy. It turns the engineer into a lawyer, and the novel into a prosecution.
