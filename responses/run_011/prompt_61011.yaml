  You're right to scrutinize the tension between verdicts 2/5 and 4. On the surface, ignoring a gut feeling (2 & 5) while honoring a run of heads (4) looks like inconsistent treatment of "non-data." But you are also right to suspect they don't actually pull against each other. Here is the distinction M is drawing: **Internal Qualia vs. External Frequencies.**

  In 2 and 5, the "feeling" is a private mental state with no calibrated track record against the world. It is information about *you*, not the atom or the lottery ball. In 4, the thirty heads are public, empirical data points about the *coin's behavior*. M's system is epistemically hygienic: she updates on evidence that bears on the propensity of the object, and she ignores evidence that bears only on the state of the observer.

  Now, to the Machine Coin. You have constructed a case that forces a collision between two sophisticated rules of probability. Both rules fit her first five verdicts, but they justify the result differently.

  ### The Two Candidate Rules

  **Candidate 1: The Principal Principle (with Admissibility)**
  *   **The Rule:** Your credence (subjective probability) ought to match the known objective chance, *unless* you possess "inadmissible" information. Inadmissible information is data about the specific outcome that bypasses the chance setup (e.g., seeing the future, or knowing the exact deterministic initial conditions of a supposedly chancy process).
  *   **How it fits M so far:** Explains Case 1 (defer to chance). Explains Case 4 (30 heads suggests the "objective chance" isn't 1/2 after all, so the principle doesn't trigger, and you follow the evidence).
  *   **Prediction for Machine Coin:** **9/10.**
      *   *Reasoning:* The calibration report establishes the objective chance at 1/2. However, the colleague's readout is *inadmissible* information—it gives you causal leverage over the specific outcome that the "chance" statement averages over. When you have inadmissible info, the Principal Principle steps aside, and you conditionalize on the info. The info predicts heads 9/10 times.

  **Candidate 2: The Reference Class Rule (Actuarial/Reichenbachian)**
  *   **The Rule:** Probability is always relative to a reference class. You ought to use the frequency of the *narrowest* reference class for which you have reliable statistics. "Chance = 1/2" is just the frequency for the broad class (all machine flips). "9/10" is the frequency for the narrow class (machine flips with *this* launch readout).
  *   **How it fits M so far:** Explains Case 1 (only one class available). Explains Case 3 (blending classes based on source reliability). Explains Case 4 (30 heads moves the coin into a "biased coin" reference class).
  *   **Prediction for Machine Coin:** **9/10.**
      *   *Reasoning:* The "1/2" is correct for the general population of flips. The "9/10" is correct for the sub-population defined by the readout. Since you know you are in the sub-population, the general statistic is irrelevant noise. You always bet on the specific risk profile.

  ### My Commitment

  M is running **Candidate 2: The Reference Class Rule.**

  Here is why: M is a retired actuary, not a metaphysician. The Principal Principle (Candidate 1) is a philosopher's tool (David Lewis) concerned with the relationship between mind and objective propensity. The Reference Class Rule is an actuary's tool concerned with risk assessment based on available data.

