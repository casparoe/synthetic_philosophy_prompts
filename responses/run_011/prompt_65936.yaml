      *   *Critique:* Friend's "Net Suffering" argument.
      *   *Fix:* Incorporate this into the "Future Population" step. If untreated suffering > treated suffering, treat.

  8.  **Final Polish:** Ensure tone is professional, empathetic, but rigorous. No fluff. Direct answers to the prompt's specific constraints. (e.g., "Mark plainly which steps are judgement dressed as procedure").

  *(Self-Correction on the Wasp Case)*: The prompt says "My instinct on the second is that it is easy, that a documented allergy settles it, and I suspect your procedure will tell me either that it does not settle it or that the reasoning I use there cannot be applied consistently anywhere else."
  *Decision:* I will make the procedure demand that *avoidance* be exhausted before *lethal control*, even with an allergy. This challenges the "kill it now" instinct.

  *(Self-Correction on the Friend)*: The prompt asks: "if you think my friend is right... say so plainly."
  *Decision:* I need to be honest. The friend is right that "numbers killed" is wrong. But wrong that "therefore nothing matters." The middle ground is "Uncertain Sentience + Precautionary Principle." I will explicitly state that the friend's "Net Suffering" calculation is impossible to perform accurately due to data gaps, making the User's "Minimize Harm" approach more robust practically, even if theoretically less pure.

  *(Final Check on Constraints)*:
