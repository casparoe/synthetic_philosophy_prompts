      *   *Critique:* Did I handle the Sentience Uncertainty?
      *   *Fix:* Use a "Probability-Weighted Harm" model. If sentience probability is $P$, Expected Harm = $Suffering \times P$. Since $P$ is unknown but $>0$, we minimize $Suffering$.
      *   *Critique:* The Wasp case needs to challenge the user.
      *   *Fix:* User thinks allergy settles it. Protocol should ask: "Can the risk be mitigated without killing?" (e.g., moving the table, screening the area). If yes, killing is not justified *even with an allergy present*. This is the hard pill.
      *   *Critique:* Parasitoid wasps.
