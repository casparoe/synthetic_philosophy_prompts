      *   The intersection is **The Justification of the Representation.**
      *   Let's select **(a) and (b)** as the core thread. Specifically: **"Is there a Normative Constraint on Parameterization?"**

      *   *Wait, I need to check the "Tacit Disagreement" requirement.*
