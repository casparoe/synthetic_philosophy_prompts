      *   *Why?* Because before you can argue about *which* symmetry applies (b), you must argue about *which space* admits symmetry (a). Before you can argue about physical mechanisms (c) or cosmological measures (d), you need to know if the problem is epistemic (indifference) or ontic (mechanism).
