          1.  **The Determinacy Trap (6 vs 5A/1).** (6) says concrete systems always have determinate values. (5A) says alternating register has no fact. If the register is concrete, (6) kills (5A). Cost: Drop (6) or restrict (5A) to abstract descriptions.
