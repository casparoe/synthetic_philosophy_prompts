      *   **Tension 2: (4) vs (7).**
          *   (4) says the machine decides the Halting Problem. It outputs a value at $t=1$.
          *   (7) says values at accumulation points must be limits of earlier values OR fixed by finite earlier stage.
          *   *Conflict:* In the Halting Problem machine (Zeno machine), the output register typically holds a value that changes infinitely often or is set at the end based on the infinite search. If it's the standard "print 1 if halts, 0 if not" where the search runs through $\omega$:
              *   If it finds a halt at stage $n$, it writes 1. (Like 5B).
              *   If it never finds a halt, it writes 0 (or stays 0).
              *   For the Halting Problem, the output depends on the *entire* infinite sequence. Is the output value the *limit* of earlier values?
              *   If the machine writes 0 initially, and writes 1 if it finds a halt: The sequence of values is 0, 0, 0... (if never halts) -> Limit 0. Or 0, 0, 1, 1, 1... (if halts at $n$) -> Limit 1. This seems to satisfy (7) (Limit condition).
              *   However, (4) claims it decides *arbitrary sentences of arithmetic* by iterating (hypercomputation). This usually requires the output to depend on the convergence of the process.
