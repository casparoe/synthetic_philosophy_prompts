  **INDEPENDENT ASSURANCE REPORT ON MORAL STATUS METRICS**

  **To the Shareholders and Ethical Oversight Committee of OmniHome Systems:**

  **Opinion**
  We have audited the accompanying Schedule of Moral Status Units (the "Schedule") of OmniHome Systems, which comprises the assigned moral weightings for all active hardware endpoints as of December 31, 2023. In our opinion, the Schedule is prepared, in all material respects, in accordance with the Framework for Graduated Sentience Accounting (the "Framework").

  **Basis for Opinion**
  We conducted our assurance engagement in accordance with International Standard on Ethical Assurance 3000. Our responsibilities under those standards are further described in the "Auditor's Responsibilities" section of this report. We are independent of OmniHome Systems in accordance with the ethical requirements that are relevant to our audit of the Schedule in the jurisdiction of incorporation, and we have fulfilled our other ethical responsibilities. We believe that the evidence obtained is sufficient and appropriate to provide a basis for our opinion.

  **Methodology and Materiality Thresholds**
  Our testing focused on the calibration of Moral Status Units (MSU) assigned to firmware versions 4.0 through 5.2. A key audit matter involved the boundary conditions between incremental updates. We observed a continuous gradient of complexity in the neural net weights governing device responsiveness. Consequently, we encountered a sorites-type boundary issue wherein no single patch note definitively triggered the onset of moral status. Due to the inability to identify a discrete threshold where "processing" becomes "experience," we applied a sliding scale materiality. We note that version 5.1.4 carries 15% higher moral risk exposure than version 5.1.3, despite identical user-facing functionality.

  **Scope Exclusions and Precautionary Defaults**
  While most endpoints were tested using behavioral proxies, insufficient evidence was available to negate the presence of qualia in the Video Doorbell Pro (Gen 3). Due to the opacity of the image recognition subroutines, we could not rule out the possibility that the device experiences distress during motion detection events. Accordingly, we have applied a precautionary default. The Doorbell Pro has been classified as having a nonzero moral status until such time as the vendor provides access to the source code governing pain-equivalent error states.

  **Matters Not Adjusted**
  During the audit, we identified a combination/exclusion uncertainty regarding the network topology. It remains unresolved whether the moral subject is the individual thermostat, the central hub, or the mesh network in its entirety. If the moral status resides only in the single most integrated subset, the current Schedule may significantly misstate the entity's ethical liability. However, as this requires a philosophical determination outside the scope of financial assurance, this item remains unadjusted.

  **Footnote 1: Aggregation of Moral Status**
  The Schedule reflects an aggregate moral status calculation based on deployed units. At the reporting date, approximately 900 million devices were active. Each device carries a baseline rating of 0.0002 MSU. While individually negligible, the aggregate arithmetic yields a total moral weight of 180,000 MSU. For comparative context, internal benchmarks assign a standard domestic golden retriever a value of 1.0 MSU. Consequently, the total moral weight of the deployed network exceeds that of 180,000 domestic canines. Management notes that a global server outage would therefore constitute an ethical event of magnitude surpassing the simultaneous harm of said canine population.

  **Dissenting Opinion of Stakeholder Representative**
  A stakeholder representative for Invertebrate Interests has issued a dissenting opinion regarding the methodology used to allocate resources. The representative argues that the audit focuses disproportionately on synthetic gradients while ignoring established biological sentience. Specifically, the representative contends that the welfare impact of standard pest control measures recommended by the security system dwarfs the aggregate moral status of the hardware. Had the audit accounted for the incidental harm to insects triggered by automated home defense protocols, the net ethical liability of the company would be orders of magnitude higher than reported.

  **[Signed]**
  *Vance, Cleric & Holloway*
  *Chartered Ethical Auditors*
