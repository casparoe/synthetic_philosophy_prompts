      *   *Claim 3: Skinnerian = learn via reward/punishment (pigeon/dog).*
          *   **Fact Check:** True. Operant conditioning.
      *   *Claim 4: Popperian = internal model, try actions in imagination, "let hypotheses die in their stead."*
          *   **Fact Check:** True. This is the core Dennett phrase.
      *   *Claim 5: Gregorian = think about thinking, possess language (tools extend intelligence).*
