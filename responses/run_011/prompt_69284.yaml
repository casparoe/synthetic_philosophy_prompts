answer: |-
  Take a deep breath. You have not refuted Zorn's Lemma, and you need not fear walking into section on Monday. Zorn's Lemma is safe, as is the Axiom of Choice, and indeed the rest of modern mathematics. You have, however, found a rather subtle and instructive bug in your own reasoning regarding Step (4).

  Your roommate was vaguely correct that subgroups are "weird" in this context, but the specific error lies in the assumption that the union of a chain of *proper* subgroups is necessarily *proper*.

  Here is the diagnosis, the test you asked for, and the cost of rejecting that step.

  ### The Diagnosis: Step (4) is False

  The error is precisely in Step (4): *"⋃C is also proper, so ⋃C ∈ P"*.

  In the proof for rings, this step works because of the multiplicative identity, $1$. An ideal $I$ is proper if and only if $1 \notin I$. If you have a chain of proper ideals $\{I_\alpha\}$, then $1 \notin I_\alpha$ for every $\alpha$. Consequently, $1 \notin \bigcup I_\alpha$. The element $1$ acts as a fixed **witness** to the improperness of the whole ring. Because that witness is absent from every link in the chain, it is absent from the union.

  Groups do not have an equivalent element. A subgroup $H$ is proper if there exists *some* $g \in G$ such that $g \notin H$. However, this $g$ might depend on $H$. As you move up the chain, the elements missing from the subgroups might change. In the limit (the union), every element of $G$ might eventually be included, even if no single subgroup in the chain contained all of them.

  Your example of $\mathbb{Q}$ is the perfect counterexample. You wrote:
  > "I know Q is literally the union of the increasing chain $\mathbb{Z} \subset \frac{1}{2}\mathbb{Z} \subset \frac{1}{6}\mathbb{Z} \subset \dots$"

  Let us analyse this chain. Let $H_n = \frac{1}{n!}\mathbb{Z}$.
  1.  Each $H_n$ is a proper subgroup of $\mathbb{Q}$. (For instance, $\frac{1}{n!+1} \notin H_n$).
  2.  The collection $\{H_n\}$ is a chain under inclusion.
  3.  The union $\bigcup H_n$ is indeed $\mathbb{Q}$. (Any rational $\frac{a}{b}$ is in $H_b$).
  4.  Therefore, the union is **not** a proper subgroup.

  The union falls out of your poset $P$. Because the upper bound of the chain is not *in* $P$, the hypothesis of Zorn's Lemma is not satisfied. Zorn's Lemma simply does not apply. There is no contradiction; the lemma remains silent on whether a maximal element exists in this specific poset.

  ### The Test: Preservation Under Unions

  You asked for a test to apply in advance to posets of "proper X" objects. The condition you must check is this:

  **Is the property defining membership in $P$ preserved under unions of chains?**

  More technically, is the property of **finite character**, or is it witnessed by a fixed element?

  1.  **Fixed Witness:** Is there a specific element $x$ such that $X \in P \iff x \notin X$? (e.g., $1 \notin I$ for ideals). If yes, the union step holds.
  2.  **Finite Character:** Is $X \in P$ determined by its finite subsets? (e.g., a set is linearly independent iff every finite subset is). If yes, the union step holds.

  If the property is "Proper Subgroup" ($H \neq G$), it satisfies neither. There is no single element whose absence guarantees properness (unless $G$ is cyclic), and properness is not determined by finite subsets.

  ### Running the Test on Your Three Cases

  Let us apply this test to the three scenarios you mentioned to see why two work and one fails.

  **1. Proper Ideals in a Unital Ring**
  *   **Poset:** Proper ideals ($1 \notin I$).
  *   **Test:** Is there a fixed witness? **Yes.** The element $1$.
  *   **Result:** If $1 \notin I_\alpha$ for all $\alpha$, then $1 \notin \bigcup I_\alpha$. The union is proper.
  *   **Verdict:** **Passes.** The proof holds.

  **2. Proper Subgroups of a Group**
  *   **Poset:** Proper subgroups ($H \neq G$).
  *   **Test:** Is there a fixed witness? **No.** (Unless $G$ is cyclic). Is it of finite character? **No.**
  *   **Result:** As seen in $\mathbb{Q}$, the union can exhaust the group even if every link is proper.
  *   **Verdict:** **Fails.** The proof collapses at Step (4).

  **3. Linearly Independent Subsets of a Vector Space**
  *   **Poset:** Linearly independent sets. (Note: This is not "proper subspaces", but "independent sets").
  *   **Test:** Is it of finite character? **Yes.** A set is dependent iff a *finite* linear combination sums to zero.
  *   **Result:** If every set in the chain is independent, no finite combination in the union sums to zero (because that finite combination would live inside one of the sets in the chain).
  *   **Verdict:** **Passes.** The proof holds. (This is why every vector space has a basis).

  *Side Note on Vector Spaces:* If you had tried to prove "Every vector space has a maximal *proper subspace*" by taking $P$ = all proper subspaces, you would have run into the same trouble as with groups. The union of proper subspaces can be the whole space. To fix that proof, one usually fixes a non-zero vector $v$ and considers the poset of subspaces *not containing $v$*. Then $v$ acts as the fixed witness (like $1$ in rings), and the proof goes through.

  ### The Cost of Rejecting Step (4)

  You asked what rejecting this step costs you elsewhere.

  1.  **Zorn's Lemma:** It costs you nothing. The lemma stands firm.
  2.  **Ring Theory:** It costs you nothing. The ideal proof relies on the witness $1$, which remains valid.
  3.  **Group Theory:** You must accept that **not every group has a maximal subgroup.** The additive group $\mathbb{Q}$ is the standard counterexample. It is a nontrivial group with no maximal subgroups. This is a known theorem, not a paradox.
  4.  **Your Other Proofs:** Check them. If they rely on taking a union of "proper" structures and assuming the result is "proper" without a fixed witness (like $1$ or a specific excluded vector), they may need adjustment. If they rely on properties of finite character (like linear independence or algebraic dependence), they are safe.

  ### Summary for Monday

  You can walk into section with your head high. You have not broken set theory; you have discovered a fundamental structural difference between rings with unity and general groups.

  *   **Rings:** Have a "top element" generator ($1$) that witnesses improperness.
  *   **Groups:** Do not necessarily have such an element.
  *   **Conclusion:** Step (4) is the failure point. The union of the chain in $\mathbb{Q}$ is $\mathbb{Q}$ itself, which is not in the poset of proper subgroups. Zorn's Lemma is not invoked because the chain has no upper bound *in the poset*.

  It is a brilliant mistake to have made, because it shows you are thinking about the machinery of the proofs rather than just memorising them. Do try to mention the $\mathbb{Q}$ example to your tutor; they will likely be quite pleased to see you grappling with the material at this level.

  Cheerio, and good luck with the section.
