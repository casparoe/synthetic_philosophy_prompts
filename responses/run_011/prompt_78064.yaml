      *   **The Scenario:** A modified QI thought experiment. Trigger yields: 1/4 weight (unimpaired survival), 1/2 weight (severe cognitive damage), 1/4 weight (death). Repeatable.
      *   **The Participants:** Nils (pro-QI metaphysics, anti-weight-as-value) vs. Kesh (pro-weight-as-anticipation, anti-QI reassurance).
