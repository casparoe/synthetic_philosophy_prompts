      *   Actually, the cleanest way for non-math majors is to present the *series* as the "value contributions."
      *   Let's recommend the **Standard Pasadena** but *scaffolded*. Why? Because if they read the literature later, they need to recognize the $2^n/n$ structure. But I will instruct the user to *give* them the series, not make them derive it.
      *   *Wait, re-reading prompt:* "whether that ought to be the Pasadena game as it is standardly stated or a leaner case constructed for this room."
