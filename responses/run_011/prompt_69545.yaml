answer: |-
  Here is the session plan. It is designed to be tight, conceptually linear, and insulated against the mathematical gaps in the room.

  ### 1. The Outset Announcement
  **Minute 0:** Begin by explicitly stating what you are **not** going to cover.
  *   **Announce:** "We are not going to solve the paradox. We are not going to prove the Riemann Rearrangement Theorem. And we are not going to derive the expectation terms from the probabilities and payoffs."
  *   **Reasoning:** This prevents the students from waiting for a resolution that won't come (managing anxiety), stops the math-averse from panicking about proofs, and saves 15 minutes of algebraic derivation that is irrelevant to the decision-theoretic point.

  ### 2. The Core Gamble: A Leaner Case
  **Do not use the Standard Pasadena Game.**
  *   **Why:** The standard formulation ($p_n = 2^{-n}$, payoff $= (-1)^{n+1}2^n/n$) requires students to track the cancellation of $2^n$ to see the harmonic series. For students without analysis, this arithmetic becomes a cognitive bottleneck that obscures the philosophical problem.
  *   **Use Instead:** Construct the **"Alternating Game."**
  *   **What it must contain:** Define the gamble directly by its *expectation contributions*. Tell them: "Consider a gamble $G$ with countably many outcomes. The contribution of the $n$-th outcome to the expected value is $a_n = \frac{(-1)^{n+1}}{n}$."
  *   **What it must leave out:** Do not make them calculate $p_n \times u_n$. Stipulate that the probabilities sum to 1 and the utilities are real numbers, but treat the series $\sum a_n$ as the given object of study. This isolates the *conditional convergence* issue from the *probability calculus* issue.

  ### 3. Session Sequence and Dependencies
  **Total Time: 50 Minutes**

  **Phase 1: The Series and the Order (Minutes 0–15)**
  *   **Component:** Introduce the Alternating Game's series: $1 - 1/2 + 1/3 - 1/4 \dots$
  *   **Dependency:** None, but relies on the Outset Announcement to keep them from asking for proofs.
  *   **Action:** Show that summing in the given order yields $\ln(2)$. Then, explain intuitively (no proof) that because there are infinitely many positive and negative terms, you can "save up" positive terms to reach any high number before dipping into negatives.
  *   **Key Point:** The value of the gamble depends on the *order of summation*.
  *   **Misconception Intervention (SPP+):** At Minute 10, explicitly distinguish this from St. Petersburg.
      *   *St. Petersburg:* Sum grows without bound ($+\infty$). Reordering does not change $\infty$.
      *   *Pasadena:* Sum oscillates/changes value. Reordering changes the result.
      *   *Head off:* "This is not just St. Petersburg with negative numbers. In St. Petersburg, the value is infinite. Here, the value is *absent*."

  **Phase 2: The Decision-Theoretic Crisis (Minutes 15–25)**
  *   **Component:** Translate the math to choice.
  *   **Dependency:** Requires Phase 1 (establishing the EV is order-dependent).
  *   **Action:** Ask: "Expected Utility Theory says maximize EV. But this gamble has no unique EV. Which number do we maximize?"
  *   **Misconception Intervention (Computational):** At Minute 20, address the idea that this is a calculation error.
      *   *Head off:* "It is not that we lack the computing power to find the answer. It is that there is no single answer to find. The definition of the sum fails to pick out a unique number."

  **Phase 3: The Altadena Variant (Minutes 25–40)**
  *   **Component:** Introduce Altadena (Pasadena + \$1 in every outcome).
  *   **Dependency:** Requires Phase 2 (establishing EV is undefined).
  *   **Placement:** This is the pivot. It moves the session from "Math is weird" to "Decision Theory is broken."
  *   **Action:**
      1.  Define Altadena: Same probabilities, payoff is $u_n + 1$.
      2.  Ask for its EV. (It is also undefined; adding 1 to an undefined sum yields an undefined sum).
      3.  Ask: "Which should you choose?"
      4.  Elicit **Dominance**: Altadena is better in every possible state.
  *   **Misconception Intervention (Nihilism):** At Minute 35, address the "Anything is permissible" inference.
      *   *Head off:* "If EV is undefined, can you choose Pasadena over Altadena? No. Dominance still binds you. Therefore, 'no EV' does not mean 'no constraints.' Decision theory is not silent here; Expected *Value* theory is."

  **Phase 4: Diagnostic and Close (Minutes 40–50)**
  *   **Component:** Synthesis and Closing Question.
  *   **Dependency:** Requires Phase 3 (understanding that Dominance survives even when EV fails).

  ### 4. The Closing Question
  **Minute 45:** Pose this specific question to the room (think-pair-share):

  > "If I add \$1 to every payoff in the St. Petersburg game, the Expected Value increases by \$1 (from $\infty$ to $\infty$). If I add \$1 to every payoff in the Pasadena game, does the Expected Value increase by \$1?"

  *   **Correct Answer:** No. For St. Petersburg, $\infty + 1 = \infty$ (in the extended reals). For Pasadena, 'Undefined' $+ 1$ is still 'Undefined'. Linearity of expectation holds for infinite expectations but fails for undefined ones.
  *   **Diagnostic Value:** If they say "Yes," they treat 'undefined' as a number (like 0 or $\infty$). If they say "No," they understand the category error.

  ### 5. Summary of Misconception Interventions

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"This is just St. Petersburg with negatives."** | Phase 1 (Intro to Series) | Explicitly contrast *divergence to infinity* (SPP) vs. *conditional convergence* (Pasadena). Emphasize that SPP has a stable value ($\infty$); Pasadena does not. |
  | **"We just can't calculate it yet."** | Phase 2 (Decision Crisis) | Frame it as *non-uniqueness*, not difficulty. Use the rearrangement intuition: "You can make it sum to 10, or -10. The math isn't stuck; it's ambiguous." |
  | **"If EV doesn't exist, anything goes."** | Phase 3 (Altadena) | Use the Dominance argument. If they prefer Pasadena to Altadena, they are irrational, even though neither has an EV. Constraints exist outside of EV maximization. |

  ### 6. Dependencies Checklist
  1.  **Outset Announcement** must happen before **Phase 1** to prevent derivation requests.
  2.  **Phase 1 (Math)** must precede **Phase 2 (Theory)**; they cannot grasp the decision problem without grasping the lack of a unique sum.
  3.  **Phase 2 (Undefined EV)** must precede **Phase 3 (Altadena)**; the dominance puzzle only bites if they accept that EV maximization is silent.
  4.  **Phase 3 (Dominance)** must precede **Closing Question**; they need to see that 'undefined' behaves differently than 'infinity' regarding additivity to answer correctly.
