answer: |-
  **REPORT OF THE INTER-ALLIED COMMISSION ON RESPONSIBILITIES AND LOSSES (1921)**
  **SUB-COMMITTEE ON ORIGINS AND APPORTIONMENT**

  **1. Terms of Reference**
  The Commission was convened to quantify the loss and damage arising from the hostilities commenced August 1914. It is expressly noted that this body is not empowered to assign moral guilt, which is a theological category, but rather financial liability, which is an arithmetic one. However, pursuant to Article 231 of the Peace Instrument, liability attaches only to loss arising from "the aggression of Germany and her allies." The Commission therefore finds itself required to identify aggression without assigning guilt, a distinction which relies upon the assumption that a State possesses a mind capable of forming intent separate from the individuals comprising it. Upon investigation, the Commission finds that the Imperial Government acted via a General Staff, which acted via a Railway Division, which acted via a timetable. The Commission rules that a timetable is capable of intent.^1^

  **2. Chronology of Events**
  The sequence of actions leading to the cessation of peace is reconstructed below. Each entry is verified by telegram or mobilization order.

  *   **09:00, 24 July:** The Northern Confederation issues an ultimatum to the Southern Republic. The text is drafted to be unacceptable, though the covering note insists it is a standard diplomatic formality.
  *   **14:00, 25 July:** The Southern Republic mobilizes partially. This is declared defensive, though the troop positions are offensive.
  *   **10:00, 28 July:** The Imperial Government declares war. The Sovereign signs the order while on a yacht in neutral waters; the document is countersigned by a Minister who claims he believed the Sovereign had read the previous version.
  *   **08:00, 1 August:** The Imperial Government mobilizes. The Chief of Staff notes that the plan cannot be altered because the coal shipments for the return journey have already been booked.
  *   **09:00, 1 August:** The Western Republic mobilizes. They claim they were forced to do so because the Imperial Government had mobilized, though their own plans required them to mobilize first to be effective.
  *   **12:00, 4 August:** Borders are crossed. All parties claim they were entering to protect the integrity of the neighbor against third-party aggression.

  **3. Causation Analysis**
  The Commission applied a chain of *why* questioning to determine the root cause.
  *Why did the Imperial Government invade?* Because the General Staff activated Plan Red.
  *Why did they activate Plan Red?* Because the Southern Republic mobilized.
  *Why did the Southern Republic mobilize?* Because they feared the Imperial Government would activate Plan Red.
  *Why did the Imperial Government have Plan Red?* Because the Western Republic had Plan Blue.
  *Why did the Western Republic have Plan Blue?* Because the Imperial Government had built a railway line in 1913.
  *Why was the railway line built?* To transport coal.
  *Why was coal being transported?* To heat the homes of voters who wished to avoid war.

  The chain terminates only when it reaches the existence of matter itself. For the purposes of liability, the Commission truncates the chain at the point where a document was signed. However, it is the finding of this Committee that the Railway Timetable of 1913 exerted more executive authority than the Cabinet. The timetable is therefore categorized as a decision-making body.^2^

  **4. Apportionment of Liability**
  Based on the volume of fire, the distance of advance, and the severity of the ultimatums, liability for loss and damage is apportioned as follows:

  | State Entity | Percentage Liability |
  | :--- | :--- |
  | The Imperial Government | 45% |
  | The Northern Confederation | 35% |
  | The Southern Republic | 25% |
  | The Western Republic | 15% |
  | **Total** | **120%** |

  *Footnote 1: The classification of inanimate objects as agents of policy is unprecedented but necessary to locate a signatory.*
  *Footnote 2: The excess of 20% represents concurrent enthusiasm. While no single state intended the total scale of the catastrophe, the Commission finds that the sum of their defensive preparations exceeded the requirements of defense. The overlap is billed jointly.*

  **5. Annex A: Dissenting Opinion (Member V.)**
  I cannot subscribe to the arithmetic of the majority. To divide a catastrophe into shares is to imply it could have been prevented by subtracting one share. The evidence suggests the mechanism was automatic. The statesmen were not drivers but passengers who had forgotten how to operate the brakes. We are charging them with crashing the train when the evidence shows they were merely asleep while the train crashed. If we insist on finding a villain, we must charge the century. If we cannot charge the century, we should charge no one. To bill them is to pretend we understand the invoice.

  **6. Recommendations to Prevent Recurrence**
  1.  All General Staffs must submit mobilization plans for approval by a civilian committee that meets only on Tuesdays.
  2.  Railway timetables must include a margin for error of no less than three weeks.
  3.  Sovereigns are prohibited from boarding yachts during crisis periods unless the yacht is equipped with a telegraph room and a legal advisor.
  4.  It is recommended that the concept of "pre-emptive defense" be abolished, or alternatively, that the calendar be adjusted so that August has fewer days.
  5.  Future commissions should be appointed before the war begins, to ensure the paperwork is in order when the loss occurs.

  ***

  ^1^ *See Appendix C: Comparison of Train Schedules and Declarations of War.*
  ^2^ *This finding allows the Commission to bill the Railway Authority, which has deeper credit than the Treasury.*
