answer: |-
  **The Setup:**
  Ada and Ben are at a dinner party with their philosopher friends. They announce they're considering a third child. Their first two kids are thriving—let's call their wellbeing a solid 10 out of 10. The third kid, based on genetic counseling and financial projections, would have a life clearly worth living, but slightly less optimal—say, a 7 out of 10. Ada and Ben ask the table for moral guidance.

  **Telling 1: The Total View (Ada)**
  Ada grabs a napkin and starts scribbling sums. "Look, morally, we're just containers for utility. Right now, you've got 20 units of happiness in the room. If you have the kid, you've got 27. You are literally leaving seven units of good on the table. To not have the child is to choose a smaller number. It's not just permissible; it's arithmetic."
  **Punchline:** "You're not building a family, you're hoarding happiness points. Have the kid, then start on number four."

  **Telling 2: The Average View (Ben)**
  Ben snatches the napkin and draws a division line. "Don't listen to her. You're running a quality brand here. Your average wellbeing is currently a perfect 10. Add a 7, and your family average drops to 9. You're diluting the stock. Why would you voluntarily lower the family GPA? It's statistical vandalism."
  **Punchline:** "Stop breeding before you turn an A-plus household into a B-minus."

  **Telling 3: The Person-Affecting View (Cleo)**
  Cleo interrupts before anyone can write again. "Wait, who exactly benefits here? Not the siblings—they lose resources. Not the parents—that's selfish. And not the kid, because you can't benefit someone by bringing them into existence compared to never existing. There's no subject here who is better off than they would have been otherwise."
  **Punchline:** "It's not 'good' or 'bad.' It's morally invisible. You're just satisfying an urge. Call it what it is: a hobby."

  **Telling 4: The Critical Level View (Dana)**
  Dana, who has been quietly eating bread, finally speaks up. "Actually, it's worse than invisible. Sure, the kid's life is worth living. But there's a critical threshold of wellbeing required to add value to the universe—let's say it's an 8. Since she's projected at a 7, adding her actually makes the world worse, even though she'll be happy."
  **Punchline:** "She's worth living, but she's not worth adding. Sorry."

  ***

  **The Machinery**
  The joke works by escalating the absurdity of applying abstract axiological constraints to intimate human decisions. Ada's punchline (Total Utilitarianism) highlights the counterintuitive demand for mere accumulation, reducing children to utility units. Ben's punchline (Average Utilitarianism) satirizes the elitism inherent in protecting averages, framing procreation as brand management. Cleo's punchline (Person-Affecting View) undercuts the previous two by dissolving the moral category entirely; if existence cannot be compared to non-existence, the math doesn't matter, rendering the decision morally neutral rather than positive or negative. Dana's bonus punchline (Critical Level Utilitarianism) adds a final layer of philosophical harshness: it accepts the math but introduces a threshold that declares a happy life "not good enough" to count, landing hardest because it validates the child's worth while simultaneously rejecting their addition.
