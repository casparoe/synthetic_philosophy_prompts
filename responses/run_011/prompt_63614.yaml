answer: |-
  **The Climatic Share**

  The ceiling fan clicked. It was a rhythmic, metallic stutter, like a bone knitting wrong. Elias watched the blades smear the dust into the humid air of the office. On the desk before him lay Form 14-B, Provincial Relief Board. The paper was thick, cream-colored, and smelled of lignin and old ink.

  Box 4 waited for a single integer. *Percentage of excess mortality attributable to Climatic Cause.* The remainder would be auto-calculated as Administrative Cause.

  Below the box, the fine print lay in wait. If the Climatic share exceeded fifty percent, the event was classified as a Calamity. An emergency grant would release within the week. No names would be named. The file would close. If the Administrative share exceeded fifty percent, the event was classified as a Failure. The grant would be halved. The officials responsible for procurement and distribution would be subject to review, dismissal, or charge.

  Elias dipped his pen. The ink was black, viscous. He hovered over the box.

  "Three days, Elias," said Corin from the doorway. She didn't come in. She leaned against the frame, wiping sweat from her neck with a handkerchief. "The Secretary wants the file on his desk by Friday. He wants to sign the grant before the budget cycle turns."

  "The Secretary knows the numbers?"

  "He knows the sum."

  Elias looked down at the ledger sheet clipped to the form. It was the aggregate supply table, typed by a clerk with heavy hands.

  **PROVINCE 9: GRAIN AVAILABILITY (CURRENT YEAR)**
  *Harvest Yield:* 840,000 tons (68% of normal)
  *Import/Reserve Release:* 410,000 tons
  *Total Supply:* 1,250,000 tons
  *10-Year Average Supply:* 1,100,000 tons
  *Surplus:* +150,000 tons

  **MORTALITY EXCESS (EST.)**
  *Total:* 14,200
  *Rural Landholding:* 110
  *Urban Wage/Service:* 13,890
  *Administrative Zones:* 4 through 7

  Elias traced the line with his finger. The province had eaten. There was more rice in the silos than there had been in any of the last ten years. The drought had taken the stalks, yes, but the reserves had filled the gap. The math was clean. The math said no one should have starved.

  Yet the morgues in the weaving district had run out of trays. The boatmen along the river had stopped pulling because their legs gave out, and then their hearts did. The farmers, those who held the land, had eaten from their private stores. They had watched the price triple in the market square and kept their sacks closed. They ate fine. The ones who needed to buy rice to live had died.

  "It's not a simple sum, Corin," Elias said.

  "Nothing is. Put a number in the box."

  "If I put fifty-one percent climatic, I say the drought killed them. But the drought only took thirty percent of the crop. The reserves covered the rest."

  "Then put administrative."

  "If I put administrative, I say the Board killed them. But the Board released the reserves. The price spike wasn't us."

  Corin stepped into the room. The fan clicked overhead. "It was the Procurement Order. Zone 4."

  "Director Havel signed it."

  "Havel is in the Northern Zone," Corin said. "He's eating dust up there. Their harvest was zero. Absolute zero. If he hadn't diverted our surplus north, they would have lost half their population. He saved the North."

  "He saved the North by pricing the South out of the market."

  "He stopped a collapse," Corin said. Her voice was flat, tired. She wasn't defending Havel because she liked him. She was defending the logic of the machine. "He moved grain from where it was cheap to where it was life. That is the job. The weavers here died because the price went up. The price went up because the grain moved. The grain moved because the North had nothing. Is that administrative failure? Or is that geography?"

  Elias looked at the pen. "It's both."

  "It can't be both. The form has one box."

  "The form is wrong."

  "The form is the law." Corin walked to the desk and tapped the paper. "If you mark it Calamity, the families get the relief grant. Full amount. If you mark it Failure, they get half, and we spend six months investigating Havel while the widows wait. Havel did what he had to do. But the widows are still dead."

  Elias remembered the market square from before the rains failed. The chalkboard prices written in bright yellow. *4 units per coin.* Then the procurement order went out. The rumors started. Hoarders held back. The price went to *8*. Then *12*. The weavers brought their cloth to market and could buy half the rice they could the month before. Then a quarter. Then nothing.

  He remembered a boatman, old man Kest, sitting on the quay. Kest hadn't asked for money. He had asked why the sacks were sitting on the dock if the silos were full. Elias hadn't had an answer then. He didn't have one now. The sacks were waiting for transport to the North. They were there. They were real. They were just not for Kest.

  "Havel didn't mean to kill them," Elias said.

  "Intent isn't the metric," Corin said. "Cause is the metric. Did the climate kill them? Or did the system?"

  "The climate made the grain scarce relative to demand. The system set the price. The price denied access."

  "Pick one."

  Elias looked at the mortality table again. *Urban Wage/Service: 13,890.* These were the people who sold their labor for coin. The climate didn't take their labor. They could still pull the rickshaws. They could still weave. But the coin bought nothing. The climate hadn't touched their hands. The administration had touched their bowls.

  But without the climate, the procurement order never signs. Without the order, the price stays low. Without the price spike, the weavers eat.

  It was a chain. Pulling any link broke the logic. The form demanded a origin point where there was only a circuit.

  "Friday," Corin said. She turned to leave. "Don't make it a crime, Elias. Just make it a number."

  She closed the door. The fan clicked. *Click. Click. Click.*

  Elias uncapped the pen. He thought about Havel in the North. Havel was a good man. He had weighed two provinces against each other and chosen the one with zero yield over the one with partial yield. It was a defensible calculation. It was the only calculation a human being could make and sleep at night. To let the North die to keep the price stable here would have been monstrous.

  But the dead here were not abstract. They were the ones who paid rent. They were the ones who needed the market to function. The market had functioned perfectly. It had responded to scarcity by raising prices. It had responded to procurement by hoarding. It had done exactly what a market does.

  The form assumed that starvation was either an act of God or an act of incompetence. It did not have a box for *act of economy*. It did not have a box for *necessary sacrifice*.

  If he wrote 51% Climatic, he lied. The drought was not enough to kill. The supply proved it.
  If he wrote 51% Administrative, he lied. The administration had saved the North. The failure was not in the movement of grain, but in the protection of the wage.

  The ink dried on the nib.

  He looked at the box. It was a small square, designed to hold a truth that didn't exist. It demanded a partition of responsibility where the responsibility was fused. To separate them was to falsify the record. To fuse them was to break the form.

  He thought about the widows waiting for the grant. Full grant for Calamity. Half for Failure. If he marked Administrative, he punished Havel to give money to the weavers' wives. If he marked Climatic, he saved Havel's career and gave the money to the wives.

  The money was the same. The truth was the variable.

  Elias moved the pen. He did not write 51. He did not write 49.

  He wrote *50*.

  The form did not have a protocol for a tie. A tie meant the cause was indeterminate. A tie meant the file could not be processed as either Calamity or Failure. It would go to the Committee. The Committee would have to read the ledger. They would have to look at the surplus. They would have to look at the North. They would have to see that the grain was there, and the people were gone, and the line between weather and wage was a fiction drawn by a clerk in a air-conditioned room.

  It would delay the grant. It would cause questions. It would force someone to rewrite the box.

  Elias capped the pen. He blew on the ink to dry it. The number sat in the center of the box, balanced on the edge of the line. It was not an answer. It was a refusal of the question.

  He picked up the file and walked to the door. The heat outside was waiting, heavy and real. The fan clicked one last time as he stepped into the hall. He held the form tight, knowing that tomorrow the Secretary would call him in and ask why he had broken the protocol.

  Elias would tell him the protocol was broken already. He would tell him that you cannot divide a death into weather and paper when the weather brought the paper and the paper bought the weather. He would tell him that this was not a disaster, and it was not a crime. It was a sum that didn't add up.

  He put the file in the outbox. The number stared back at him through the slat. *50*. Half truth. Half lie. All of it real.

  He turned off the light. The office went dark, but the fan kept clicking in the dark, counting time that didn't belong to anyone.
