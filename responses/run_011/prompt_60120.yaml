answer: |-
  The fluorescent lights hummed with a sound that wasn't quite noise, more like a pressure behind the eyes. It was the sound of the Archive, somewhere after the end of things, where the work never finished because the data never stopped arriving.

  Elias rubbed his temples. Across the laminate table, Mara was stacking ledgers. They weren't books, not really. They were slabs of bound paper that grew warm when you touched the bottom edge, feeding themselves new pages from nowhere.

  "We have to sign, Elias," Mara said. She didn't look up. Her coffee was cold, a skin forming on the surface. "Management wants the slot filled by the cycle turn. One goes back, one stays in the queue. Forever."

  "I know the quota," Elias said. He tapped the file between them. Subject 8940. "But look at the tabs. It's oscillating."

  Subject 8940 was a messy life. Even by the standards of the infinite, it was erratic. The ledger showed runs of joy followed by runs of suffering. The first run was short, a single year of bright mornings. The second was pain, two years of gray fog. The third, joy again, four years. Then eight years of pain. Each stretch twice as long as the one before, flipping back and forth forever.

  "It's simple," Mara said, tapping her own calculator. "I use the density rule. You take the average value over expanding windows. As the windows get bigger, the joy peaks higher than the pain valleys. The trend line is up. 8940 gets the slot."

  Elias shook his head. He pushed his own sheet forward. "I use the tail rule. You look at who is ahead in the long run. Pick any point far enough down the line. Eventually, the pain runs dominate the duration. The suffering stretches out longer than the joy stretches. If you look at the end—which never comes, but if you *could*—8940 is losing. The other candidate, 8941? Steady, modest contentment. No spikes. 8941 wins."

  "So you want to send the boring one back," Mara said. "And leave the one who felt something intense to rot in the waiting room."

  "I want to send the one who isn't drowning back," Elias countered. "Your method says the early joy counts enough to offset the endless crushing weight later. That feels like a accounting error."

  "It's not an error, it's a weighting choice. You're discounting the future implicitly. I'm not."

  They sat in the hum. The stakes were abstract, but the fatigue was physical. They had been doing this for centuries, subjective time. They knew the rules were patched together, duct tape over a hole in reality. If the universe was infinite, every possible life was happening somewhere, infinitely many times. Adding one more good year to the total sum of existence was like adding a cup of water to the ocean. It shouldn't matter. But here, in the office, it had to matter. There was only one slot.

  Mara sighed and opened the ledger for 8940. She started flipping pages, not reading, just watching the running total in the margin flicker. Positive. Negative. Positive, higher. Negative, lower. The numbers swung wilder the further she went.

  "What if," Mara said, her voice dropping, "we aren't reading it right?"

  "We're reading it chronologically," Elias said. "Birth to death to afterlife."

  "But the ledger is just a stack of moments. It's all present here." Mara started pulling pages out. She took a page from a joy run deep in the book and slipped it near the front. She took a pain page from the middle and moved it to the back.

  "Mara, don't scramble the sequence. That's chain of custody."

  "Watch the total."

  She slid a block of happy years into the early section. The running balance surged upward, staying positive for hundreds of pages. Then she inserted a block of suffering later. The balance dipped, but stayed higher than before. She kept doing it, interleaving the pages. One joy, one pain, two joys, one pain.

  The flickering number in the margin stabilized. It wasn't oscillating anymore. It was climbing. Slowly, steadily positive.

  "I can make it sum to anything," Mara whispered. She looked at Elias, her eyes wide, not with triumph, but with a kind of sick vertigo. "If I group the joys together, it goes to positive infinity. If I group the pains, it crashes. If I interleave them like this... it settles on plus forty. I can make the life look like a net gain, or a net loss, just by changing the order I process the pages."

  "That's cheating," Elias said, but his voice lacked force. "The life happened in order. You can't live your pain before your joy just to fix the math."

  "Does it matter?" Mara tapped the page. "The total is infinite either way. The order is just how we count it. If the sum depends on the counting order, then the sum isn't real. It's just... a reflection of how we hold the book."

  "Then nothing is real," Elias said. "Then we're just shuffling paper to justify a coin flip."

  "Or," Mara said, "maybe the fact that we can change it means the life isn't one thing. It's everything at once. It's a winner and a loser simultaneously, and we're just forcing it to pick a state by looking at it."

  She stopped shuffling. The ledger sat open, the pages disordered, the running total showing a modest, healthy positive number. It looked like a life worth saving. It looked clean.

  Elias looked at the clock. The hands were spinning counter-clockwise. They were out of time.

  "If you submit that," Elias said, nodding at the shuffled ledger, "Audit will flag the sequence error. They'll reject the file. 8940 stays in the queue."

  "So I put it back."

  "And then my tail rule applies. 8940 loses. 8941 goes back."

  Mara slowly slid the pages back into their chronological order. The running total began to flicker again, swinging wildly between massive gain and massive loss, never settling. The instability returned. The truth of the thing, whatever it was, rushed back in to fill the space.

  "I hate this," Mara said. She picked up her pen. "I hate that we have to sign."

  "We don't have to be right," Elias said. "We just have to be consistent. That's what the manual says. Consistency overrides accuracy."

  "Because accuracy is impossible."

  "Because accuracy is undefined."

  Elias signed his name on the line for Candidate 8941. He didn't look at Mara. He heard the scratch of her pen following his. She was signing off on the rejection of 8940. She was using his rule, not hers.

  "Why did you switch?" Elias asked.

  "Because if I use my rule, I have to shuffle the pages," Mara said. She capped her pen. "And if I shuffle the pages, I'm not judging the life. I'm judging my filing system. I don't want to be the person who decides based on how I stack the paper."

  "So you decided based on time."

  "I decided based on the fact that you can't un-live things. Order matters, even if the math says it shouldn't."

  They stacked the files. The slot was filled. Somewhere, a soul began to knit itself together into a new body, steady and modest. Somewhere else, in the waiting room that had no walls, the oscillating life waited, its joy and pain still doubling, still alternating, still undefined.

  Mara stood up and stretched. Her back cracked. "Coffee?"

  "Yeah," Elias said. He closed the ledger. The hum of the lights seemed louder now, or maybe the silence between them was just heavier. "Yeah, coffee."

  They walked out of the office, leaving the open ledger on the table. The numbers in the margin continued to flicker, chasing each other up and down the scale, never landing, never summing, waiting for someone to come back and count them again.

  ***

  **A Note on the Problem**

  The dilemma you're facing is known in philosophy as the "infinite utility problem." If the universe is infinite in time and space, standard math breaks down because you can't compare two infinite totals (infinity equals infinity). The "fixes" you mentioned are real attempts to solve this, but they all have costs.

  Discounting the future (valuing near-term happiness more than far-future happiness) makes the math finite and manageable, but it feels arbitrary—why should a person's suffering a million years from now count for less than someone's suffering today? The "compare periods" method (seeing who is ahead at different stages) avoids infinity, but as you noticed, it leads to paradoxes where no clear winner exists if the leads keep swapping. The hyperreal numbers (math bigger than infinity) are elegant on paper but don't tell us what we *ought* to do ethically.

  The story highlights the deepest issue: if the result changes based on how you order the calculation, the problem might be ill-posed. In practical terms, most ethicists suggest we should act as if the future isn't infinite simply because we can only influence a finite part of it. You can't fix the whole infinite ledger, but you can fix the page in front of you.
