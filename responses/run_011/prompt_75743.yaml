answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Normative Status of Roles and the Constitution of Persons
  **Parties:** Camp A (Confucian Role Ethicist), Camp B (Kantian-Constructivist)
  **Date:** [Current Date]

  ## 1. Points of Convergence

  We affirm the following claims as shared commitments, acknowledging that our metaphysical and justificatory grounds for holding them differ.

  1.  **The Insufficiency of Contract:** A purely contractarian account of the family is normatively deficient. It fails to capture the specific wrong of betraying a parent or child because it models these relations as voluntary exchanges between strangers, thereby missing the normative force of unchosen dependency and historical intimacy.
  2.  **Concrete Claim (Filial Care):** An adult child has a stringent, non-optional duty to provide material care and emotional regard for an aging parent, even when doing so imposes significant inconvenience, provided the parent is not actively abusive.
  3.  **Concrete Claim (Promise-Keeping):** Breaking a specific promise made to a friend constitutes a moral failure that is distinct from and worse than failing to aid a stranger to the equivalent degree; the history of the relationship intensifies the obligation.
  4.  **Concrete Claim (Political Office):** A person occupying a specific office (e.g., judge, minister) acquires duties specific to that office that they would not possess as a private citizen, and failing to perform these specific duties is a corruption of the person, not merely a rule violation.
  5.  **The Necessity of Reflection:** Moral life requires critical reflection. Unthinking habituation into social roles is insufficient for ethical personhood; the agent must in some sense "own" their conduct, whether through reflective endorsement (Camp B) or through the cultivated mastery of *li* (Camp A).

  ## 2. Map of Disagreements

  | Disagreement | Camp A (Role Ethicist) Formulation | Camp B (Constructivist) Formulation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Source of Obligation** | Obligations arise from the *occupancy* of a role. To be a father is to be bound by the norms of fatherhood; the binding force is internal to the relationship's reality. | Obligations arise from *reflective endorsement* or voluntary undertaking. A role binds only insofar as the agent can will the maxim of that role as a law, or has committed to it. | **Substantive** |
  | **The Moral Self** | The self is constituted by its relations. There is no "I" prior to being a son, neighbor, or friend; personhood is an achievement of role-performance. | The self is a capacity for autonomy prior to its ends. Relations are chosen projects; the agent must be distinguishable from their roles to critically evaluate them. | **Substantive** |
  | **Partiality** | Love with degrees (*chai*) is the correct structure of moral life. Prioritizing kin is not a prejudice to be justified but the root from which care for others grows. | Partiality to intimates requires justification that could be given to those it disadvantages. We must be able to defend why *this* person matters more to *me* in terms accessible to all. | **Substantive** |
  | **Respect vs. Deference** | To respect a person is to defer to the demands of the role they occupy and the role we occupy relative to them (e.g., junior to senior). | To respect a person is to honor their agency and rational status, regardless of hierarchical position. Deference that suppresses agency is disrespectful. | **Verbal** |
  | **Shared Claim (Respect)** | *Both sides agree that persons must not be instrumentalized.* Camp A sees instrumentalization as failing to fulfill the reciprocal demands of a role (treating a father as a mere wallet). Camp B sees it as violating the constraint of treating humanity as an end. The shared core is that relationships impose constraints on how we may use one another. | | |

  ## 3. The Cruxes

  We identify four sub-questions such that settling them would force at least one side to revise their theory, not merely restate it.

  1.  **The Remonstrance Crux (Refined):** *Does role ethics possess internal resources for radical critique, or does it collapse into conservatism?*
      *   *Assessment:* This is the traditional challenge to Camp A. If *li* is just existing custom, A is conservative. If *li* contains an ideal standard independent of current practice, A must explain how that standard is accessed without appealing to B's "reflective endorsement."
      *   *Impact:* Resolving this forces **Camp A** to revise (if they admit they need an external standard) or **Camp B** to revise (if they admit role-immanent critique is sufficient for autonomy).
  2.  **The Asymmetry-of-History Crux (Refined):** *Does a role generate demanding obligations when the relationship that would normally constitute it is thin or actively harmful?*
      *   *Assessment:* This targets the "constitutive" claim. If the parent abandoned the child, is the child still a "son"?
      *   *Impact:* Resolving this forces **Camp A** to revise. If they admit the obligation dissolves, "occupancy" is not the source of obligation; the *quality* of the relationship is.
  3.  **The Limit of Sacrifice Crux (New):** *At what point does role-duty become servitude that destroys the agent?*
      *   *Assessment:* Camp A emphasizes self-cultivation *through* roles. Camp B emphasizes the inviolability of the agent. If a role demands self-destruction (e.g., a minister ordered to commit suicide by a ruler), who decides the limit?
      *   *Impact:* Resolving this forces **Camp B** to revise. If they admit some roles demand sacrifice that cannot be universally willed, their constructivism must accommodate supererogatory role-specific duties.
  4.  **The Universal Floor Crux (New):** *Can role ethics ground a duty to strangers that overrides role-duty?*
      *   *Assessment:* If a father must steal to feed his son, does the stranger's right to property override the son's need? Camp B says yes (universal right). Camp A says the father-son relation is the primary reality.
      *   *Impact:* Resolving this forces **Camp A** to revise. If they admit a universal floor, they concede a status independent of roles.

  **Revision vs. Restatement:**
  *   **The Asymmetry-of-History Crux** is the only one that forces a **Revision** rather than a Restatement for Camp A. If Camp A concedes that an abusive parent forfeits the claim of "fatherhood," they abandon the claim that occupancy alone constitutes the obligation. They must move to a hybrid view where *successful* performance constitutes the role.
  *   The other three cruxes allow for **Restatement**. Camp A can reframe remonstrance as "perfecting the role." Camp B can reframe sacrifice as "chosen commitment." Camp A can reframe universal duty as "expanding the circle of roles."

  ## 4. Pressure Points and The Exit Test

  For each crux, we apply the **Exit Test**: *The agent publicly, informedly, and uncoercively repudiates the role and lives thirty years with no contact. Does the obligation survive?*

  ### Crux 1: Remonstrance
  *   **Pressure Case:** *Analects* 13.18 (The Upright Son). A father steals a sheep. Confucius says uprightness lies in concealing the theft.
  *   **Camp A Prediction:** The obligation to protect the father survives the Exit Test. Even if the son leaves for 30 years, the historical fact of the relationship means he cannot treat the father as a stranger. He must still intervene to protect him, though perhaps through private remonstrance rather than public testimony.
  *   **Camp B Prediction:** The obligation to uphold justice overrides the role if the role requires complicity in wrong. If the son exits the role for 30 years, the special obligation dissolves entirely; he owes the father only what he owes any human being.
  *   **Exit Test Application:** Camp A says **Obligation Survives**. Camp B says **Obligation Dissolves**.

  ### Crux 2: Asymmetry of History
  *   **Pressure Case:** *Constructed Case (The Estranged Care).* An elderly parent who abandoned the child at age three sues the adult child for statutory maintenance. The child has had no contact for 30 years.
  *   **Camp A Prediction:** The obligation survives. The biological/social fact of the parent-child relation constitutes the child's personhood regardless of the parent's failure. To deny this is to treat persons as atoms. The child must pay, though perhaps with a heavy heart of grief rather than reverence.
  *   **Camp B Prediction:** The obligation dissolves. Obligations trace to undertakings or universal status. The parent undertook nothing (abandonment); the child undertook nothing (exit). There is a humanitarian minimum, but no *filial* duty.
  *   **Exit Test Application:** Camp A says **Obligation Survives**. Camp B says **Obligation Dissolves**. (Note: This is the Revision Crux).

  ### Crux 3: Limit of Sacrifice
  *   **Pressure Case:** *Mencius* 7A:35 (Shun and the Murderer). Shun's father kills a man. Shun abandons the throne to carry his father on his back and flee.
  *   **Camp A Prediction:** The obligation survives the Exit Test. Even if Shun had repudiated the throne and the role of ruler for 30 years, the father-son bond remains the constitutive ground of his being. He must sacrifice his public duty for the role of son.
  *   **Camp B Prediction:** The obligation dissolves. Shun cannot will a maxim where familial protection overrides universal justice. If he exits the role of "son" (repudiating the father's authority), he has no duty to harbor a criminal.
  *   **Exit Test Application:** Camp A says **Obligation Survives**. Camp B says **Obligation Dissolves**.

  ### Crux 4: Universal Floor
  *   **Pressure Case:** *Constructed Case (The Drowning Stranger).* A father sees his own child and a stranger's child drowning. He can save only one.
  *   **Camp A Prediction:** The obligation to save his own child is absolute and requires no justification to the stranger. The Exit Test is irrelevant here as the role is current, but if the father had repudiated the role 30 years ago, Camp A still leans toward saving the biological child due to the constitutive history.
  *   **Camp B Prediction:** Partiality is permitted only if it fits a system of equal liberty. Saving one's own is generally permissible, but if the stranger's child had a significantly higher chance of survival or future contribution, the calculus might shift. If the father repudiated the role (Exit Test), he must flip a coin.
  *   **Exit Test Application:** Camp A says **Partiality Survives**. Camp B says **Partiality Dissolves (or requires neutral justification)**.

  ## 5. Drafter's Note

  I am drafting this not as a neutral secretary but as a participant who believes the deadlock has persisted too long due to mutual mischaracterization.

  **On Verbal Disagreements:**
  I judge the disagreement on **Respect vs. Deference** to be merely verbal. Both camps are committed to the idea that human beings possess a dignity that forbids instrumentalization. Camp A encodes this in the reciprocal demands of *li* (a father who does not act like a father forfeits the claim to be treated as one); Camp B encodes this in the Formula of Humanity. They are describing the same normative constraint using different ontologies. I shaded Camp A's formulation in the table to emphasize "reciprocal demands" rather than "blind obedience" to secure Camp B's signature. This was a slight detriment to the hardline Role Ethicist position, which sometimes tolerates more hierarchy than I have allowed here, but it was necessary to show that Role Ethics is not mere authoritarianism.

  **The Key Crux:**
  The **Asymmetry-of-History Crux** (The Estranged Care case) is the single point most likely to break the deadlock. It is the stress test for the metaphysical claim that "persons are constituted by roles." If Camp A concedes that the abandoned child owes no *filial* duty (only humanitarian aid), they have conceded that *quality of interaction* matters more than *occupancy*. This forces Camp A to abandon the strict Ames-Rosemont line that roles are ontologically prior to choice. It moves them toward a view where roles are *normatively* constitutive only when successfully enacted. This is a revision, not a restatement.

  **My Commitment:**
  On the Asymmetry Crux, I side with **Camp B**.
  A theory that demands a victimized child serve an abandoning parent because of a biological or social label treats the child as a vessel for the role rather than a person. While Camp A is correct that we are socially embedded, the *normative force* of that embedding cannot be independent of the moral quality of the engagement. To hold otherwise is to make morality a matter of metaphysics rather than conduct. Camp A must accept that some roles can be morally voided by the failure of the other party. This does not collapse into Kantian individualism; it simply acknowledges that *ren* (authoritative conduct) requires two parties to sustain the relationship that constitutes the persons. If one party destroys the relationship, the constitutive power of the role breaks.

  **Shading Admission:**
  In Section 1 (Claims), I shaded Camp B's critique of the family. A strict Constructivist might argue that *all* family obligations must be explicitly chosen to be binding. I softened this to "reflective endorsement," which allows for hypothetical consent or tacit uptake over time. This was to prevent Camp A from dismissing Camp B as advocating for the dissolution of the family. I did this to preserve the collaboration, but it risks obscuring the radical edge of Camp B's voluntarism.

  We sign this not because we agree, but because we now know exactly where the break is.

  **Signed,**
  **The Drafter**
