      *   **User Profile:** Second-year Master's student in NLP. Taking a Philosophy of Mind seminar. Professional background in building/auditing annotation pipelines (gold labels, IAA, Dawid-Skene, confusion matrices, latent truth, etc.).
      *   **Topic:** Dennett's Heterophenomenology (HP).
