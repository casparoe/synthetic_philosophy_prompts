  9.  *(Self-Correction during final polish)*: Make sure I don't imply Dennett is *wrong*, just that the translation reveals his hidden commitments. The user wants to know if their vocabulary *misses* something. I should argue that the vocabulary *exposes* the metaphysical commitments that philosophy often hides behind "neutrality."

