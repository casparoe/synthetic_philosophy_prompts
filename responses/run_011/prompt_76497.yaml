answer: |-
  **INSTITUTIONAL ANIMAL CARE AND USE COMMITTEE (IACUC) — DOMESTIC SUBCOMMITTEE**
  **Protocol Application Form: Terrestrial Arthropod Intervention (T-AI)**
  **Protocol Number:** 2023-DECK-04
  **Principal Investigator (Homeowner):** J. Miller
  **Date:** 14 September 2023

  **1. Purpose of the Procedure**
  To mitigate immediate conflict between *Vespula vulgaris* (common yellowjacket) colony located beneath structural decking and human subjects (n=3, one pediatric). The procedure aims to eliminate foraging pressure on high-traffic zones while minimizing moral injury associated with large-scale invertebrate culling.

  **2. Number of Animals Justified**
  Estimated colony size is 300–500 workers, plus one queen. Estimate based on entrance traffic flow (approx. 4 wasps/minute) extrapolated over standard diurnal activity cycles per Guideline 7.2.B.
  *[COMMITTEE COMMENT: Range variance is too high. Please provide confidence interval or justify upper bound for moral calculus.]*

  **3. Alternatives Considered (Replacement, Reduction, Refinement)**
  **Replacement:** Live relocation was deemed unfeasible due to nest architecture (subterranean void) and risk of queen fragmentation.
  **Reduction:** Waiting for natural seasonal senescence. Temperate colonies die off in November; only mated queens overwinter. Intervention now prevents approximately 6 weeks of predation by workers.
  **Refinement:** Comparison of sodium lauryl sulfate solution (soap flood) vs. pyrethroid dust. Soap induces spiracle occlusion (suffocation); dust induces neurotoxic paralysis.
  *[COMMITTEE COMMENT: Reduction via waiting is preferred under Guideline 4.1 (Natural Lifecycle). Justify why immediate termination outweighs natural attrition.]*

  **Response to Comment:** While natural attrition is preferred, the risk window overlaps with pediatric outdoor usage. Regarding moral cost: If colony survival probability to winter is 0.05 (workers), intervention reduces total life-days lost by only 42 days per subject. However, applying probability-weighted sentience (P = 0.4 for Hymenoptera nociception) × 450 subjects × 42 days = 7,560 Moral Units of suffering avoided by waiting. Conversely, Pediatric Sting Risk (0.15) × Severity Weight (100) = 15 Human Safety Units. The math indicates waiting is morally superior, but safety protocol overrides moral optimization. Proceeding with immediate termination.

  **4. Pain and Distress / Humane Endpoint**
  Soap solution requires 15–20 minutes for full colony saturation. Dust acts within 2–5 minutes but carries non-target runoff risk. Soap is preferred for containment, despite prolonged distress duration, as it aligns with Refinement principle of minimizing environmental toxicity. Endpoint is cessation of movement for 10 minutes.
  *[COMMITTEE COMMENT: Soap suffocation is classified as Category E (Pain/Distress not relieved). Dust is Category D. You are selecting the higher distress method. Revise justification.]*

  **5. Non-Target and Environmental Effects**
  Eliminating the colony prevents predation on local Lepidoptera larvae. Estimated consumption rate is 100g caterpillar biomass per day. Over 42 days, this saves 4.2kg of biomass. I request this ecological benefit be credited against the Moral Units calculated in Section 3.
  *[COMMITTEE COMMENT: Double-counting prohibited. You cannot claim credit for prey survival while requesting permission to kill the predator. Ecological services do not offset sentient harm in this protocol. Remove biomass credit.]*

  **6. Consultation With an Expert**
  Consulted with licensed extirpator (License #9982). Expert advises dust is standard but soap is "DIY acceptable." Expert noted queen may survive if flood depth is insufficient.
  **Assurance:** I understand that failure to eliminate the queen constitutes protocol deviation and requires secondary intervention.

  **Signature:** ___________________ **Date:** ___________
  **IACUC Approval:** [ ] Approved [ ] Modified [ ] Disapproved
