answer: |-
  ### I. The Desiderata (Legitimacy Specification)

  Any adequate account of referendum legitimacy must satisfy the following requirements. If a theory cannot address a row, it is incomplete.

  | # | Requirement | Definition | Motivating Case |
  | :--- | :--- | :--- | :--- |
  | **1** | **Franchise Definition** | Must specify *who* constitutes "the people" entitled to vote (residents, citizens, age, tenure). | **Scotland 2014:** The fight over 16-year-olds and excluded expats shows the boundary of the demos is a political choice, not a natural fact. |
  | **2** | **Mandate Specificity** | Must explain what a "Yes" authorizes: a specific text, a general direction, or a negotiation mandate. | **UK 2016:** 52% voted "Leave," but the ballot authorized no specific withdrawal terms, leading to four years of interpretive conflict. |
  | **3** | **Threshold Condition** | Must justify the turnout or approval threshold required for validity (simple majority, supermajority, quorum). | **The 26% Problem:** A 52% win on 50% turnout = 26% of electorate. Is this a defect or the standard cost of democracy? |
  | **4** | **Entrenchment Consistency** | Must account for **Reversal Asymmetry**: whether repealing a measure requires the same, higher, or lower bar than passing it. | **CA Prop 13:** Initiatives often create fiscal straightjackets that legislatures cannot undo without returning to the voters, privileging past majorities. |
  | **5** | **Substantive Constraints** | Must define if there are topics a majority simply cannot decide (rights, budget, international obligations). | **Swiss Minarets (2009):** Raised whether a popular initiative violates higher-order norms even if procedurally perfect. |
  | **6** | **Agenda Control** | Must specify who drafts the question and whether alternative formulations are permitted on the same ballot. | **Australia 1999:** Republicans voted "No" because they disliked the specific model, conflating the mandate with the mechanism. |
  | **7** | **Deliberative Input** | Must state whether pre-vote deliberation (expert review, citizen assemblies) is a condition for legitimacy or optional. | **Ireland 2015/2018:** Questions filtered through citizens' assemblies first; implies raw polling is insufficient for complex moral/legal changes. |
  | **8** | **Strategic Immunity** | Must account for incentives to manipulate participation or voting behavior via the rules themselves. | **Italian Quorum:** Turnout requirements turn abstention into a weaponized campaign strategy rather than apathy. |

  ### II. Forbidden Collapses (Distinctions a Theory Must Maintain)

  A theory fails if it conflates the following pairs mid-argument:
  1.  **Legitimacy of Process vs. Wisdom of Outcome:** A vote can be procedurally valid but substantively disastrous.
  2.  **Procedural vs. Epistemic Legitimacy:** Authority derived from *who voted* vs. authority derived from *getting the right answer*.
  3.  **Authorization vs. Instruction:** Licensing the government to act vs. commanding a specific statutory text.
  4.  **Advisory vs. Binding:** A signal to representatives vs. a self-executing legal command.
  5.  **"The People" vs. "Those Who Showed Up":** The theoretical sovereign vs. the actual electorate.
  6.  **One-Off Decision vs. Standing Rule:** A specific policy choice vs. a constitutional amendment altering future rule-making.

  ### III. Non-Negotiables vs. Settled Preferences

  *   **Non-Negotiables (Foundational):** **Franchise Definition** and **Mandate Specificity**. Without defining *who* votes and *what* the vote means, there is no decision to legitimate. These are logical prerequisites, not policy choices.
  *   **Settled Preferences (Disguised as Requirements):** **Threshold Condition** (Quorums) and **Substantive Constraints**.
      *   *Quorums:* The Italian case shows these are often tools for minority veto rather than legitimacy markers. Demanding high turnout is a preference for stability over decisiveness.
      *   *Substantive Constraints:* The Swiss case shows this is a choice about constitutional hierarchy. Demanding rights constraints is a preference for liberalism over majoritarianism.
      *   *Flag:* Complaints about voter ignorance or emotion are usually arguments for legislative sovereignty smuggled in as epistemic criteria.

  ### IV. The Impossible Pentagon (Joint Unsatisfiability)

  Your suspicion is correct. The following five goods cannot be maximized simultaneously in a binding initiative system:
  1.  **Popular Control** (Low barriers to initiate/pass).
  2.  **Deliberated Outcome** (High information, cooled passions).
  3.  **Decisiveness/Finality** (Result is binding and immediate).
  4.  **Minority Protection** (Rights/budget safeguards).
  5.  **Revisability** (Future majorities can undo past decisions).

  *Trade-off:* To get **Popular Control** and **Decisiveness** (CA model), you sacrifice **Deliberation**, **Minority Protection**, and **Revisability** (via entrenchment). To get **Deliberation** and **Protection** (Swiss/German model), you sacrifice **Popular Control** (via filters) and **Decisiveness** (via counter-proposals). The charter commission must choose which two to discard; pretending to satisfy all five is design fraud.

  ### V. The Field Collider

  **Mandate Specificity** does the most damage to existing positions.
  *   It collapses the **Plebiscitary View** because a binary "Yes/No" rarely maps to a specific policy without legislative interpolation (see UK 2016).
  *   It collapses the **Constitutionalist View** because legislatures also pass vague laws; if vagueness invalidates referendums, it should invalidate statutes.
  *   It forces the **Epistemic View** to admit that voters may know *what* they want (outcome) without knowing *how* to get it (mechanism).
  *   *Result:* Any theory claiming a referendum is "self-interpreting" is eliminated.

  ### VI. Camp Scorecard

  *   **Plebiscitary:** Fails **Mandate Specificity** and **Substantive Constraints**. Treats the vote as a black box that validates any interpretation the winners choose.
  *   **Epistemic:** Fails **Popular Control** and **Decisiveness**. If the vote yields the "wrong" answer (by expert standards), legitimacy is voided, making the vote advisory in practice.
  *   **Constitutionalist:** Fails **Authorization** and **Binding** status. Reduces the referendum to a veto or suggestion, preserving legislative sovereignty but negating the initiative power.
