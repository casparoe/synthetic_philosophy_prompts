  **THE COVINGTON INTENT VERIFICATION TRUST**
  **OFFICIAL PRIZE PROTOCOLS & APPLICANT FAQ (REV. 4.2)**

  **1. Consideration.** The Trust shall deposit $1,000,000.00 USD into the Beneficiary's designated account at 08:00 EST on Day 2, contingent solely upon the Beneficiary occupying a verified State of Intent at 23:59 EST on Day 1.

  **2. Definition of Intent.** For purposes of this Agreement, "Intent" is defined as a categorical commitment to perform the Act (ingestion of Toxin Vial 001) at 15:00 EST on Day 2. Intent excludes conditional planning, intending-to-intend, or reliance on external binding mechanisms (e.g., Ulysses contracts, hypnotic suggestion, or social coercion). The Beneficiary must intend the Act for the sake of the Act's execution, not merely for the Consideration.

  **3. Verification.** Verification requires simultaneous functional neuroimaging (fMRI) and sworn affidavit before a certified Notary of Mental States. The Trust reserves the right to reject scans indicating prefrontal activity consistent with deception or self-deception.

  **4. Performance.** The Beneficiary is under no contractual obligation to consume the Toxin. The Consideration is earned upon verification of Intent at midnight, not performance at afternoon. However, failure to perform may impact future eligibility.

  **5. Disqualification.** Consideration is subject to clawback if ingestion occurs via accident, coercion, or mistaken identity. Ingestion motivated solely by sudden masochistic preference rather than prior Intent voids the Agreement ab initio.

  **6. Habitual Resolvers.** Applicants claiming status as "Resolution Keepers" must submit audited logs of past New Year's resolutions maintained for >12 months. The Trust does not accept anecdotal evidence of character consistency.

  **7. Tax & Liability.** Consideration is classified as Ordinary Income (State of Mind Acquisition), not Gift or Prize. Beneficiary assumes all liability for nausea, emesis, and temporary incapacitation. The Trust is not liable for lost wages due to illness.

  **8. Predictive Knowledge.** Applicants who currently believe they will change their mind prior to ingestion are ineligible. Knowledge of future reneging negates present Intent under Clause 2.

  **9. Historical Precedent.** To date, the Trust has not successfully verified a qualifying State of Intent. No funds have been disbursed since the Trust's inception. The Trust remains optimistic regarding future applicant pools.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: Can I hire a hypnotist to ensure I intend to drink?**
  A: No. Clause 2 explicitly excludes externally induced states. Intent must originate endogenously.

  **Q: What if I drink the toxin by accident?**
  A: See Clause 5. Accidental ingestion suggests a lack of deliberate agency, voiding the Intent required for payment.

  **Q: Has anyone ever won the prize?**
  A: See Clause 9. While many have intended to win, none have satisfied the verification criteria for Intent without simultaneously knowing they would not drink.

  **Q: Is the toxin lethal?**
  A: No. It causes twenty-four hours of severe discomfort. Please review the Liability Waiver in Clause 7.

  ***

  **Author's Note**

  I took liberties primarily in Clause 2 and Clause 8, which treat the "Belief Condition" of intention (you can't intend what you believe you won't do) as settled legal fact. This is the core of Kavka's argument, but it is contested. Defenders of "Resolute Choice" (like Edward McClennen) argue agents can intend via rational resolution despite knowing they'd otherwise renege. I also sidestepped the debate on whether intention requires belief entirely (some action theorists say no). By defining Intent as requiring categorical commitment excluding self-binding, the document rules out workarounds philosophers still debate. The tax classification (Clause 7) is pure satire; the IRS has no code for "purchased mental states." Finally, Clause 9 concedes the puzzle's likely solution (impossibility) while maintaining corporate optimism.
