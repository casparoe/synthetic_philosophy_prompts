  ### Application to Four Paradigms

  Here is how the tree adjudicates the four cases you described, locating the decisive nodes and the divergence points between you and your supervisor.

  **1. Fruit Saturation (Disc shaped like fruit looks more saturated)**
  *   **Path:** Node 1 (Yes, assume controls) → Node 2 (**No**) → **Leaf 2: Post-Perceptual.**
  *   **Decisive Node:** Node 2 (Measure Independence). The paradigm uses a judgment ("judge... as more saturated").
  *   **Divergence:** This is where you and your supervisor likely part company immediately. Your supervisor stops at Node 2: "Judgment is not perception." You likely argue that the judgment reports the experience. To win, you must move this paradigm to a matching task (Node 2 Yes). If you do, you move to Node 5 (Feature). If it survives there, you reach Leaf 7.
  *   **Verdict:** On the strict tree, this is **Leaf 2**.

  **2. Category Label Detection (Label helps detect degraded animal)**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes, detection is implicit of features) → Node 3 (Yes, semantic match) → Node 4 (**Yes**) → **Leaf 4: Attentional Gating.**
  *   **Decisive Node:** Node 4 (Attentional Explanation). Detection tasks are the classic domain of signal detection theory and attention.
  *   **Divergence:** Your supervisor says this is Leaf 2 (Decision bias in detection) or Leaf 4 (Attention). You might argue it is Leaf 5 (High-Level Penetration) if you claim the image *looks* clearer, not just that they find it faster.
  *   **Verdict:** Most likely **Leaf 4**. This is the "safe" win for cognition influencing vision without threatening encapsulation of features.

  **3. Bistable Letter/Numeral + Reward (Report shifts with reward)**
  *   **Path:** Node 1 (**No**) → **Leaf 1: Artifact.**
  *   **Decisive Node:** Node 1 (Control for Bias/Demand). If the report shifts with reward contingency, this is the definition of response bias unless there is a yoked-control where reward is unrelated to report.
  *   **Divergence:** Your supervisor sees this as a textbook demand characteristic (Leaf 1). You might argue that if the reward changes the *dominance duration* (Node 2 Yes) rather than just the report, it survives Node 1.
  *   **Verdict:** As described ("reported according to... reward"), this is **Leaf 1**. To save it, you need measures of dominance duration independent of report.

  **4. Hill Slant / Load / Desirability (Estimates shift with bodily state)**
  *   **Path:** Node 1 (Yes/No debated) → Node 2 (**No**) → **Leaf 2: Post-Perceptual.**
  *   **Decisive Node:** Node 2 (Measure Independence). "Estimates of slant" are typically verbal or visual matching, which are explicit.
  *   **Divergence:** This is the fiercest battleground. Your supervisor says verbal estimates are judgments (Leaf 2). You argue that action measures (walking, throwing) diverge from verbal estimates, which would push this to Node 2 (Yes). If action measures *also* shift, you move to Node 5 (Feature: Slant) and potentially Leaf 7 (Low-Level Corrosive).
  *   **Verdict:** As described ("estimates"), this is **Leaf 2**. If you include the action-measure literature, it moves to **Leaf 7**.

