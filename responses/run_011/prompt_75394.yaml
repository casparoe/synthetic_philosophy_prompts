  ### The Cognitive Penetrability Decision Tree

  This instrument is designed to classify experimental claims about cognitive penetrability (CP) based strictly on methodological design and reported results. It does not ask for your theoretical commitment; it asks for what the data allows. Walk down the tree by answering each question based *only* on the Methods and Results sections of the paper in question.

  **Node 1: Control for Bias and Demand**
  *Question:* Does the effect persist in a control condition where the participant holds the same belief or expectation, but that belief is rendered task-irrelevant or is explicitly disconfirmed by the experimental setup?
  *   **Concrete Yes:** The effect remains even when participants are deceived about the hypothesis, or when the cue predicts the wrong stimulus but the effect follows the cue's semantic content rather than the physical stimulus.
  *   **Concrete No:** The effect vanishes when the task instructions change, when the participant is unaware of the contingency, or when the response method changes from verbal report to forced-choice without feedback.
      *   *If No → Leaf 1: Artifact (Response Bias/Demand).*
      *   *If Yes → Go to Node 2.*

  **Node 2: Measure Independence**
  *Question:* Is the effect measured using a method that does not require an explicit judgment about the specific property being manipulated (e.g., adaptation aftereffects, perceptual rivalry, motor guidance, or matching tasks)?
  *   **Concrete Yes:** The paper reports shifts in binocular rivalry dominance, changes in tilt-aftereffect magnitude, or differences in grasping aperture that diverge from verbal estimates.
  *   **Concrete No:** The paper relies entirely on verbal estimates (e.g., "rate the slant"), Likert scales, or identification accuracy where the participant must explicitly report the target property.
      *   *If No → Leaf 2: Post-Perceptual (Judgment/Memory/Decision).*
      *   *If Yes → Go to Node 3.*

  **Node 3: Semantic Specificity**
  *Question:* Does the manipulating cognitive state require specific semantic content matching the stimulus (e.g., the word "red" for a red patch), rather than merely increasing general alertness, arousal, or motivation?
  *   **Concrete Yes:** A prime semantically related to the target (e.g., "fruit") produces a larger effect than a semantically neutral but equally arousing prime (e.g., "object" or a loud noise).
  *   **Concrete No:** The effect is driven by a general increase in vigilance, emotional arousal, or reward expectation that does not match the specific features of the stimulus.
      *   *If No → Leaf 3: Non-Specific Facilitation (Arousal/Valence).*
      *   *If Yes → Go to Node 4.*

  **Node 4: Attentional Explanation**
  *Question:* Can the effect be fully modeled as a reallocation of spatial or feature-based attention (signal-to-noise enhancement) without requiring a change in the sensory encoding of the stimulus itself?
  *   **Concrete Yes:** The effect is eliminated when fixation is strictly controlled, or when the effect size correlates perfectly with cue validity in a way standard attention models predict.
  *   **Concrete No:** The effect persists despite controlled fixation, or the pattern of results (e.g., repulsive aftereffects) cannot be explained by simple gain control or selection.
      *   *If Yes → Leaf 4: Attentional Gating (Selection without Penetration).*
      *   *If No → Go to Node 5.*

  **Node 5: Locus of Processing**
  *Question:* Does the manipulation alter the encoding of basic visual features (color, orientation, size, slant) or does it only alter the recognition/categorization of objects?
  *   **Concrete Yes (Features):** The reported change is in the apparent hue, brightness, geometric slant, or size of the stimulus.
  *   **Concrete No (Objects):** The reported change is in the speed of identification, the ambiguity resolution of a bistable figure, or the categorization boundary.
      *   *If No (Objects) → Go to Node 6.*
      *   *If Yes (Features) → Go to Node 7.*

  **Node 6: High-Level Accuracy**
  *Question:* For effects confined to object recognition, does the top-down influence reduce veridicality (increase errors) relative to a neutral baseline, or does it maintain/improve accuracy?
  *   **Concrete Yes (Reduce):** The cognitive state causes systematic misidentification or hallucination of objects not present.
  *   **Concrete No (Maintain/Improve):** The cognitive state speeds recognition without increasing error rates, or resolves ambiguity toward the physically present object.
      *   *If Reduce → Leaf 5: High-Level Penetration (Corrosive).*
      *   *If Maintain/Improve → Leaf 6: High-Level Penetration (Epistemically Harmless/Beneficial).*

  **Node 7: Low-Level Accuracy**
  *Question:* For effects altering basic features, does the top-down influence make the perceptual estimate less accurate relative to physical measures, or does it maintain/improve accuracy?
  *   **Concrete Yes (Reduce):** A desired object looks closer or a heavy load makes a hill look steeper than it is physically measured to be.
  *   **Concrete No (Maintain/Improve):** Prior knowledge of an object's typical color corrects for illumination, making the perceived color match the surface reflectance better than a naive observer would.
      *   *If Reduce → Leaf 7: Low-Level Penetration (Corrosive).*
      *   *If Maintain/Improve → Leaf 8: Low-Level Penetration (Epistemically Harmless/Beneficial).*

  **Node 8: Explanatory Framework**
  *Question:* Is the effect described by the authors as altering the sensory gain/buffer directly, or as updating the weighting of a prior hypothesis in a generative model?
  *   **Concrete Yes (Sensory):** The discussion invokes changes in V1/V2 activity, sensory tuning curves, or "seeing differently."
  *   **Concrete No (Generative):** The discussion invokes prediction error minimization, Bayesian priors, or suggests the "percept" is the best hypothesis rather than a sensory snapshot.
      *   *If Sensory → Retain Leaf 5, 6, 7, or 8.*
      *   *If Generative → Leaf 9: Predictive Processing (Dissolves Contrast).*

