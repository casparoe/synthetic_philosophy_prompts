  ### Assessment: Empirical or Verbal?

  The shape of this tree implies that the dispute is **primarily verbal**, specifically centering on **Node 2 (Measure Independence)** and **Node 4 (Attentional Explanation)**.

  Empirically, everyone agrees that cognitive states (beliefs, desires, labels) correlate with changes in behavioral output regarding visual stimuli. The disagreement is not about *whether* cognition influences visual behavior, but about where to draw the boundary of the word "perception."
  *   If "perception" includes everything up to the motor output, almost all effects are penetrable (Leaves 4-9).
  *   If "perception" is defined as the encapsulated sensory buffer prior to attention and judgment, almost all effects are artifacts or post-perceptual (Leaves 1-3).

  The tree reveals that "Cognitive Penetrability" is not a single natural kind waiting to be discovered, but a label applied to a specific region of logical space (Low-Level, Semantic, Non-Attentional). The fact that the "Beneficial Low-Level" cell (Leaf 8) is empty suggests the term is normatively loaded: we only call it "penetration" when it looks like a bug (bias), not when it looks like a feature (constancy). Until the field agrees on whether "perception" names a *processing stage* (Node 5) or a *measure type* (Node 2), the empirical data will continue to support opposite verdicts.
