answer: |-
  (1) "The standoff"
  The standoff centers on whether receiving a conditional "If A, then C" licenses a unique update to a probability function. Revisionists argue that while the input isn't a proposition in the algebra, it imposes a constraint that the new conditional probability of C given A equals one. Combined with a principle of minimal change, this yields a unique posterior. They seek an operator minimizing information distance subject to this constraint. The opposing camp, leveraging Lewis's triviality results, argues that indicative conditionals do not express propositions with truth conditions compatible with standard probability theory. Therefore, no event has occurred, and no Bayesian revision is defined. On this view, accepting a conditional is not moving to a new probability distribution but adopting a suppositional policy: one commits to reasoning as if A implies C without altering unconditional credences in a determinate way. The claim that no revision rule is owed rests on the assertion that demanding a unique numerical shift in collateral credences imposes mathematical structure where there is only pragmatic commitment. The deadlock arises because revisionists treat the constraint as sufficient to fix the numbers, while suppositionalists treat the numbers as underdetermined by the semantic content. Revisionists cannot agree among themselves on the metric for minimal change. Some minimize cross-entropy, others preserve odds ratios, and others employ imaging techniques. Without a shared justification for why one distance metric captures epistemic conservatism better than another, the proposed rules appear as competing conventions rather than discoveries of rational necessity. The suppositionalist exploits this plurality to argue that the quest for a unique rule is itself the error. Consequently, the literature remains split between those seeking a deterministic operator and those denying the coherence of the request.

  (2) "What is actually contested"
  What is actually contested is often obscured by shared terminology. Both camps agree that a rational agent changes their disposition upon hearing a conditional; they disagree on whether that change must be represented as a single probability function over the original algebra. The revisionist assumes the doxastic state is always a probability function, so any change must be a transition from one function to another. The suppositionalist denies this, holding that the state after learning a conditional might be a set of functions or a non-probabilistic structure. Consequently, when they argue about the posterior, they are often talking past each other: one refers to a unique point in probability space, the other to a constraint on a family of functions.

  However, there is a specific point of agreement often missed. Both camps agree that if the agent later learns A categorically, their credence in C should be high. They agree on the conditional commitment, just not on the unconditional collateral effects. The divergence arises in how they model the intermediate state. The revisionist needs to assign a specific value to the probability of not-A immediately after learning the conditional, because their formalism requires a value for every event. The suppositionalist sees no fact of the matter about the probability of not-A until A is settled. This means the revisionist is solving a constraint satisfaction problem that the suppositionalist denies exists.

  The dispute over minimal change is not merely verbal but reflects competing normative standards. Minimizing Kullback-Leibler divergence prioritizes preserving prior likelihood ratios, while other rules prioritize preserving independence relations or specific algebraic symmetries. These are not discoveries about how agents do update, but prescriptions about how they should prioritize epistemic virtues. The triviality results bite here: any rule that assigns a probability to the conditional itself while respecting the equation linking conditional probability to the probability of the conditional collapses the algebra. Revisionists avoid this by denying the conditional has a probability; suppositionalists avoid it by denying the update produces a standard probability function. Thus, the disagreement is substantive regarding the normative structure of rationality, but verbal regarding whether the output state deserves the label belief.

  Furthermore, the disagreement masks a deeper conflict about the role of formalism. For the revisionist, the probability function is a comprehensive model of the mind; any input must map to a new function. For the suppositionalist, the function is a tool for modeling categorical belief, and conditionals operate outside its scope. When they debate what is learned, the revisionist means what new probabilities are fixed, while the suppositionalist means what new inferences are licensed. If the question were reformulated as what constraints does accepting a conditional place on future categorical updates, they might agree on the constraints but disagree on whether those constraints necessitate a unique intermediate probability distribution. The stalemate persists because the revisionists insist on uniqueness where the suppositionalists see only bounds. This reveals the contest is over the adequacy of the probability function as an exhaustive model of doxastic states, not merely over the mechanics of updating.

  (3) "Testing the two hunches"
  Your first hunch identifies the core semantic divide but misdiagnoses the revisionist commitment. You suggest revisionists treat acceptance as a change in a probability function with a unique right answer. This is true, but not because they ignore the suppositional nature; rather, they argue that rationality requires resolving the supposition into a definite stance to avoid Dutch Books or incoherence in mixed acts. The hunch fails because it implies the revisionists are mistaken about the nature of the state, whereas they argue the suppositionalists are mistaken about the requirements of coherence. The suppositionalist denies the unique numerical signature not because it is a policy, but because the mathematics forbids it without triviality. The disagreement is not just state type, but whether coherence demands numerical precision where semantics offers none. For instance, imaging rules shift mass to the nearest world where the conditional holds, while entropy-minimization rules preserve global ratios. These are structurally distinct operations on the probability mass, not merely different labels for a policy.

  Your second hunch, regarding idealization and sender modeling, is more robust but ultimately dissolves the wrong problem. Modeling the sender transforms the conditional into a report about the sender's belief. This shifts the problem to testimony analysis, but does not eliminate the conditional update issue. You still must decide how the sender's conditional belief constrains your own probability function. If the sender is reliable, you still face the Judy Benjamin constraint. The idealization is not the source of the ambiguity; the ambiguity lies in the underdetermination of collateral credences by conditional constraints. Even with a fully modeled sender, if their message only fixes your conditional probability, your unconditional probability for the antecedent remains free to vary. The rules differ on how to fix that freedom. Therefore, de-idealization does not collapse the rules into arbitrariness; it merely adds layers of testimony processing before the underlying logical problem re-emerges. The substantive question remains whether rationality dictates a specific way to resolve that underdetermination.

  Consider the internal structure of the rules. Lewis's imaging moves probability mass from worlds where A is false to the nearest A-worlds, preserving the relative probabilities of A-worlds. Entropy-based rules adjust the whole function to satisfy the constraint with minimal information gain. These yield different values for the probability of not-A. If your hunch were correct that sender modeling dissolves this, both rules should converge when the sender's reliability is accounted for. They do not. The sender's reliability determines whether you update, not how you distribute the mass among non-A worlds. The divergence is structural, arising from how each rule defines distance from the prior. Thus, the second hunch fails to explain the persistence of the disagreement; the disagreement survives the removal of idealization because it is rooted in competing definitions of epistemic conservation, not in the purity of the input case.

  (4) "What would count as progress"
  Progress requires moving beyond static snapshots of the Judy Benjamin case. A decisive test would involve iterated updates. Most conditional revision rules fail to commute: updating on a conditional then a categorical proposition yields a different posterior than the reverse order. More critically, updating on two competing conditionals sequentially often produces path-dependence that violates intuitive coherence. A rule that could demonstrate dynamic coherence over sequences of conditional inputs would gain significant traction. Currently, no proposed rule handles iterated conditional updating without ad hoc adjustments. If a rule could prove that it preserves coherence across arbitrary sequences of conditional and categorical inputs, it would offer a structural advantage that minimal change metrics lack.

  Another avenue is decision-theoretic discrimination. If two rules assign different probabilities to the antecedent's negation, they should eventually prescribe different actions in complex bets involving both antecedent and consequent. However, in many simple cases, the actionable recommendations converge even if the credences differ. Progress would look like a constructed case where one rule mandates accepting a bet that another mandates rejecting, based solely on the conditional update. Without such a pragmatic divergence, the choice between rules remains aesthetically normative. Researchers need to identify a tipping point case where the collateral shift changes the expected utility calculation decisively.

  Is this forthcoming? Unlikely. The barriers are foundational. Dynamic coherence results are technically difficult and often yield impossibility theorems similar to triviality results. Decision-theoretic cases are easy to construct formally but hard to motivate intuitively; agents rarely face bets that hinge on the specific collateral credence shifts in question. The field is likely to remain pluralistic. The most productive reformulation would be to stop asking for the rule and instead map the conditions under which each rule preserves specific desirable properties, treating them as context-sensitive tools rather than universal laws. For your friend's system, this means selecting a rule based on the specific risk profile of the operator environment rather than seeking a theoretically perfect solution. Theoretical progress is stalled because the question presupposes a uniqueness that the mathematics may not support.

  (5) "Bottom line"
  The disagreement is substantive but rests on incompatible normative commitments regarding epistemic conservation, not on a solvable factual dispute. Revisionists prioritize functional completeness of the probability model; suppositionalists prioritize semantic fidelity to the triviality results. The seminar cannot budge because no formal argument can compel acceptance of a specific metric for minimal change. Treat the rules as competing explications of rationality, each valid within its own structural assumptions, rather than rival hypotheses about a single phenomenon. For your friend's system, this implies engineering pragmatism should replace theoretical purity: choose the rule that minimizes operational risk in your specific domain, acknowledging that the choice is a policy decision, not a discovery of truth.
