          *   US: No explicit subsidiarity, but courts enforce a hard structural limit on *means* (anti-commandeering: Congress can't order state officials, but can regulate directly or use money).
          *   Inversion: Named principle = soft/political enforcement; Unnamed principle = hard/judicial enforcement.
          *   Nature of Limits: EU = Scope (comparative efficiency/counterfactual); US = Means (bright line on state officials).
          *   Why? Scope tests resist judicial enforcement (requires forecasting, second-guessing legislature). Means tests are manageable (bright line).
