answer: |-
  ### Exam Question: Week 11 Seminar Assessment
  **Time:** 45 Minutes
  **Marks:** 20
  **Conditions:** Closed Book. No citations, case names, or treaty article numbers required.

  **The Prompt:**

  Consider the following structural puzzle regarding how federal systems allocate power vertically:

  In the European Union, the principle of **subsidiarity** is explicitly written into the treaties. It acts as a limit on the *scope* of competence: the Union may act in shared fields only if objectives cannot be sufficiently achieved by member states and can be better achieved at the Union level. However, enforcement is political and soft. National parliaments can object to draft acts, but the Commission may maintain the draft after review, and the final say remains with the EU legislature.

  In the United States, there is no subsidiarity clause. Yet, courts enforce a hard structural limit on the *means* of federal power: Congress may not conscript state legislatures or executives into administering federal programs (anti-commandeering), though it may regulate private actors directly or attach conditions to federal money.

  This suggests an inversion: the system that names the principle polices it politically and weakly, while the system that omits the name polices a related structural limit judicially and strictly. Furthermore, these systems are not limiting the same thing: one tests the *scope* of competence (which level is more effective?), while the other tests the *mode* of implementation (who carries out the order?).

  **Write an essay that addresses the following:**

  1.  Explain why a **scope test** (like EU subsidiarity) resists judicial enforcement, whereas a **means test** (like US anti-commandeering) is judicially manageable.
  2.  Identify the "escape valves" or workarounds available in each system that allow the central government to achieve its goals despite these limits (e.g., conditional grants, directives, preemption).
  3.  Take a position on the following claim: **"Neither enforcement mechanism could be successfully transplanted into the other system without ceasing to function as a constraint."** Defend your position using the logic of institutional design rather than historical tradition.

  *(Note: You may reference the Swiss requirement for a double majority of voters and cantons for constitutional amendments if it strengthens your argument, but this is optional.)*

  ***

  ### Model Answer

  The inversion described in the prompt highlights a crucial distinction in federal design: the difference between policing *where* power lies versus policing *how* power is exercised. The divergence in enforcement mechanisms—political softness in the EU versus judicial hardness in the US—is not an accident of history, but a consequence of the justiciability of the specific legal test being applied.

  A scope test, such as EU subsidiarity, asks a comparative counterfactual: could the member states have achieved this objective sufficiently, and would the Union do it better? This is inherently legislative in nature. It requires forecasting outcomes, weighing policy efficacy, and aggregating complex social data. Courts are ill-equipped to answer these questions. There is no determinate fact to find; a judge ruling on subsidiarity would inevitably be second-guessing the legislature's policy judgment. Because the test collapses into a debate about political efficacy rather than legal authority, it resists hard judicial enforcement. If courts struck down laws based on efficiency calculations, they would become super-legislatures. Consequently, the EU relies on a political enforcement mechanism (national parliament objections), which preserves democratic accountability but lacks teeth, as the final decision remains with the very body being checked.

  By contrast, a means test like the US anti-commandeering rule asks a factual, binary question: does this statute direct state officials to implement federal law? This is a bright-line inquiry. It does not require the court to judge whether the federal goal is good, or whether the state could have done it better. It only requires observing the text of the statute and the chain of command. Because the question is structural and procedural rather than policy-based, it is judicially manageable. Courts can enforce this limit without substituting their policy preferences for those of Congress, allowing for strict judicial review.

  However, both limits possess significant escape valves that render them partly cosmetic. In the US, while Congress cannot commandeer state officials, it can achieve similar results through the spending power. By attaching conditions to federal grants, Congress can induce states to voluntarily administer federal programs. Similarly, Congress can regulate private actors directly and preempt state law, effectively bypassing the need for state cooperation. In the EU, while subsidiarity limits the *level* of action, it does not dictate the *form*. The Union can use Directives, which leave the choice of form and methods to the member states, thereby respecting local administration while achieving Union objectives. Additionally, EU funding programs can incentivize state behavior much like US grants.

  Regarding the transplant claim, the assertion that these mechanisms are non-fungible is persuasive. If the US adopted an EU-style subsidiarity clause enforced by courts, it would likely fail. American judges lack the institutional capacity to conduct the comparative efficiency analysis required, leading either to judicial abdication (rubber-stamping Congress) or an illegitimate expansion of judicial power. Conversely, if the EU adopted a US-style anti-commandeering rule enforced by the European Court of Justice, it might paradoxically weaken integration. Because the EU relies heavily on member state administration to implement law (due to a smaller central bureaucracy), a hard ban on instructing state officials could paralyze Union action unless accompanied by a massive expansion of central bureaucracy, which is politically untenable.

  Therefore, the enforcement mechanism is tied to the nature of the limit. Political enforcement fits political questions (scope/efficiency); judicial enforcement fits structural questions (means/authority). Transplanting the enforcement without changing the underlying institutional capacity would render the constraint meaningless or destructive. The Swiss double majority rule supports this: it polices constitutional scope through a political mechanism (voting) rather than a judicial one, acknowledging that fundamental shifts in power belong to the constituent units politically, not the courts legally. Ultimately, federalism is not just about text, but about which institution is trusted to police the boundary.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. The Manageability Argument (5 Marks)**
  *   **A Range (4-5):** Clearly distinguishes between *scope* (counterfactual/efficiency/policy) and *means* (factual/structural/bright line). Explains *why* courts can do one (fact-finding) but not the other (policy forecasting) without becoming super-legislatures.
  *   **B Range (2-3):** Identifies that EU is soft/political and US is hard/judicial, but offers a vague explanation (e.g., "courts are stricter in the US") without analyzing the nature of the legal test itself.
  *   **C Range (0-1):** Merely restates the prompt's description of the systems without explaining the *why*.

  **2. Escape Valves & Workarounds (5 Marks)**
  *   **A Range (4-5):** Identifies specific functional equivalents (US: spending power/preemption; EU: directives/funding). Explains *how* these bypass the limit while achieving the goal.
  *   **B Range (2-3):** Lists workarounds generally (e.g., "money" or "different laws") without connecting them to the specific constraints mentioned in part 1.
  *   **C Range (0-1):** Claims the limits are absolute or fails to identify workarounds.

  **3. The Transplant Evaluation (5 Marks)**
  *   **A Range (4-5):** Takes a clear position (agree or disagree) and justifies it using *institutional logic* (capacity of courts, structure of bureaucracy) rather than tradition. Acknowledges consequences (e.g., paralysis vs. judicial overreach).
  *   **B Range (2-3):** Takes a position but relies on "it wouldn't fit the culture" or historical differences rather than institutional design logic.
  *   **C Range (0-1):** No clear position or contradicts their own earlier analysis.

  **4. Conceptual Precision & Clarity (5 Marks)**
  *   **A Range (4-5):** Uses terms like "scope," "means," "counterfactual," and "justiciability" correctly. Argument flows logically.
  *   **B Range (2-3):** Writing is clear but concepts are slightly muddled (e.g., confusing subsidiarity with decentralization).
  *   **C Range (0-1):** Disorganized or difficult to follow.

  ***

  ### Common Mistakes & Penalties

  **1. The "Localism" Error (Cost: 3-5 Marks)**
  *   **The Mistake:** Treating subsidiarity as a simple preference for "keeping power local" or "small government."
  *   **Why it's tempting:** It's the colloquial definition.
  *   **Why it fails:** Subsidiarity is a *competence test*, not a *location preference*. If the Union can do it *better*, subsidiarity demands Union action. Ignoring the "better achieved" clause misses the point of the scope test.

  **2. The "Judicial Review" Conflation (Cost: 3 Marks)**
  *   **The Mistake:** Describing the EU's "reasoned opinion" procedure by national parliaments as a form of judicial review or legal enforcement.
  *   **Why it's tempting:** It sounds like a check and balance.
  *   **Why it fails:** It is a *political* check. The Commission can ignore it (with explanation), and courts are not the primary enforcers. Confusing political oversight with legal adjudication undermines the core inversion argument.

  **3. The "Substance vs. Procedure" Confusion (Cost: 4 Marks)**
  *   **The Mistake:** Arguing that the US anti-commandeering rule limits *what* Congress can achieve (the ends) rather than *how* it achieves it (the means).
  *   **Why it's tempting:** It feels like a limit on power.
  *   **Why it fails:** As the prompt notes, Congress can still achieve the goal via spending or direct regulation. The limit is purely on the mode of implementation (using state officials). Missing this distinction makes the transplant argument impossible to answer correctly.

  **4. The "Proportionality" Swap (Cost: 2 Marks)**
  *   **The Mistake:** Discussing proportionality (is the measure excessive?) instead of subsidiarity (is this the right level?).
  *   **Why it's tempting:** They often appear together in treaty texts.
  *   **Why it fails:** Proportionality is about intensity; subsidiarity is about vertical allocation. Conflating them suggests the student doesn't understand the specific vertical allocation problem being tested.

  **5. Dogmatic Transplanting (Cost: 3 Marks)**
  *   **The Mistake:** Arguing "The US system is better so it should be transplanted" without addressing *institutional capacity*.
  *   **Why it's tempting:** Normative preferences are easier than structural analysis.
  *   **Why it fails:** The question asks about *function*, not *virtue*. A mechanism that works in one court system may break another if the institutional capacity (e.g., bureaucratic size, judicial role) differs.
