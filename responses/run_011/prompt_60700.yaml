      *   *Tone:* Rigorous, direct, philosophical but technical. No fluff.
      *   *Structure:* Follow the user's requested ranking (Fatal -> Awkward). Address the specific bullet points within that ranking.
      *   *Distinction:* Keep clear between "Pump Defender" (standard econ/phil) and "Internal Consistency" (does the user's view hold together).

      *   *Drafting Section 1: The Indifference/Cycle Problem (Fatal).*
