      *   *Problem:* If Future Self *prefers* to trade (because B > A locally), and there is no commitment, Future Self *will* trade. Present Self's refusal is the only barrier. But if Present Self refuses, they keep A. That works.
      *   *Wait, the Pump:* The pump usually involves being *offered* a trade. If I have A, and you offer B for A. I prefer B locally. I take it. Then C for B. I prefer C locally. I take it. Then A-fee for C. I prefer A-fee locally. I take it.
      *   *Sophisticated response:* "I know if I take B, I will end up with A-fee. I prefer A to A-fee. So I won't take B."
      *   *Critique:* This requires the agent to value the *final outcome* of the plan over the *local improvement*. This violates "Separability" or "Dynamic Consistency."
      *   *Key Attack:* To make this work, the agent must violate the standard principle that rational choice at a node depends only on the subtree from that node. If they violate that, they are effectively Resolute. The distinction between Sophistication and Resoluteness blurs here. I need to press this hard.

  5.  **Final Polish:**
