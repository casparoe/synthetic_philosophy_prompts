      *   *Drafting Section 5: Falsifiability (Medium/Low).*
          *   The "Not Sophisticated Enough" defense.
          *   To avoid tautology, sophistication must be measurable independently of pump resistance.
          *   If it's just a label for "didn't get pumped," it's empty.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* The user distinguishes Sophistication from Resoluteness. Sophistication (Strotz/Rabinowicz) usually means *predicting* future weakness and acting now to mitigate it. Resoluteness (McClennen) means *ignoring* future preference changes and sticking to the plan.
