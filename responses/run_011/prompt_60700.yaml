          *   Sophistication says: "If I take A for B, I will later trade B for C, and C for A-minus-fee. So I end up with A-minus-fee. I prefer A to A-minus-fee. So I won't start."
          *   *Vulnerability:* What if the preference reversal is *unforeseeable*? (Temptation, framing). The user assumes "ordinary foresight." If preferences are context-dependent in a way the agent can't model, sophistication fails.
          *   *Vulnerability:* Indifference/Ties. If the agent is indifferent between stopping and continuing at some node, backwards induction might not yield a unique plan. If the induced ranking over *plans* is cyclic, sophistication doesn't pick a winner.

      *   *Point 2: The "Freebies" (Foresight/Revision).*
          *   User assumes costless changing of mind.
          *   *Vulnerability:* Is "sophistication" just "resolute choice" in disguise? McClennen vs. Rabinowicz. Sophistication usually implies *manipulating* future choices by current choices. If you can't bind your future self, and your future self *will* act on local preferences, sophistication is just prediction, not control.
          *   If the future self *must* act on local preferences (Dynamic Consistency), then the sophisticated plan is irrelevant unless it aligns with local preferences. If local preferences are intransitive, the future self *will* pump. The only way to stop it is if the *current* self can bind the *future* self. That requires a commitment device. If commitment is costless, that's a huge assumption.

      *   *Point 3: Collapsing back to Transitivity.*
          *   If the requirement is "have a consistent ranking over plans," isn't that just transitivity over a larger domain?
          *   *Vulnerability:* If the agent prefers Plan 1 (Keep A) to Plan 2 (Trade A->B->C->A-fee), that's a transitive ranking over *outcomes/plans*. But the user wants to save intransitivity over *options*.
          *   *Fatal Blow:* If the diachronic requirement implies that the revealed preference over plans must be transitive to avoid pumps *on plans*, have we just shifted the locus of rationality without gaining freedom?
          *   *Nuance:* The user claims transitivity over options is derivative. If the ranking over plans *must* be transitive to be rational, does that force the ranking over options to be transitive? Not necessarily (Sen's result), but it constrains it heavily.

      *   *Point 4: Empirical Predictions.*
          *   Standard view: Intransitive agents get pumped.
          *   User view: Intransitive agents *who are sophisticated* don't get pumped.
          *   *Vulnerability:* How do we distinguish a transitive agent from a sophisticated intransitive agent? Both refuse the trade.
          *   *Test:* Offer a choice between "Intransitive Menu" vs "Transitive Menu". Or, observe behavior when the *cost* of sophistication is non-zero.
          *   *Prediction:* Sophisticated intransitive agents should exhibit specific avoidance behaviors (e.g., avoiding markets with cycles) that transitive agents don't need to. They should pay to restrict their own choice sets.

      *   *Point 5: Falsifiability/Immunization.*
          *   "They weren't sophisticated enough."
          *   *Vulnerability:* This is the biggest risk. If every pump failure is explained by "lack of sophistication," the theory explains nothing.
          *   *Requirement:* Need an independent measure of sophistication (e.g., performance on logic puzzles, planning tasks) to correlate with pump resistance.

