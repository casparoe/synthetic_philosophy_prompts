      *   *Drafting Section 4: Empirical Indistinguishability (Medium).*
          *   Observation: Both Transitive Agents and Sophisticated Intransitive Agents refuse the first trade.
          *   Differentiation: Look for "avoidance costs." The Sophisticated Intransitive Agent should pay to avoid entering the choice sequence. The Transitive Agent doesn't need to.
