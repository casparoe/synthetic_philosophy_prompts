          *   If the user allows "changing mind at no cost," does that mean Present Self can bind Future Self?
          *   If yes: You've assumed a commitment device. That's not "ordinary foresight."
          *   If no: Future Self executes the trade. Pump happens.
          *   This is the "Dynamic Consistency" constraint. You can't have Intransitivity + Dynamic Consistency + No Pumps. You must drop one. User drops Dynamic Consistency (by allowing planning to override local preference). This *is* Resolute Choice (McClennen). Is that a concession? Yes, it's a major structural change to agency.

      *   *Drafting Section 3: Collapsing to Transitivity (High).*
          *   If rationality = "Transitive ranking over Plans," have we saved intransitivity over Options?
