      *Let's structure the response by the user's specific bullet points but ranked by severity.*

      *   *Severity 1 (Fatal): The Dynamic Consistency Trap.* You can't have local intransitivity + global planning without violating Dynamic Consistency. If you violate DC, you are effectively a Resolute Chooser. If you claim "changing mind costs nothing," you are assuming the *ability* to bind, not just the *lack of cost*. This smuggles in a commitment technology.
