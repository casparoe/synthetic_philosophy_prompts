      *Refining the "Kill Shot":* The most damaging thing is if the "leakage" mechanism is actually a feature, not a bug, for the deterrent to work. If uncertainty *must* leak to be credible, then containment is impossible.

      *Refining Concessions:* I should concede on the empirical specificity (Historian) and the precise metric (Formalist). I cannot defend specific historical claims without archives I don't have.

