  *   *Objection 3 (Historian):* Lack of archival proof.
  *   *Objection 4 (Formalist):* Adversary interprets safety as weakness.
  *   *Objection 5 (RC):* Stability *is* the metric.
  *   *Objection 6 (Official):* We already do positive control.
  *   *Objection 7 (Philosopher):* Risk distribution ethics.
  *   *Objection 8 (Grad):* Generalizability.

  *Wait, I need to make sure the "Concessions" are clear.* I will mark them explicitly.
