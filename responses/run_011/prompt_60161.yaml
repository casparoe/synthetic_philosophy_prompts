      *   *Juror 3 (The Holdout):* Emotional bias ($p$ driven by personal trauma, not evidence). Represents $p < 0.5$ driven by noise.
      *   *Juror 5 (Slum Background):* Brings unique information (switchblade usage). Increases independence by adding orthogonal data.

  6.  **Address the "Category Error" Constraint:**
      *   The user asked me to be plain if this is a category error.
      *   *Verdict:* It is partially a category error. CJT is a limit theorem about *random* voters with fixed competence. *12 Angry Men* is about *deliberation*. Deliberation *changes* $p$ and *changes* correlation. The film isn't a test of static voting; it's a simulation of Bayesian updating.
