      *   *Point 1: Independence & Correlation (The "Echo Chamber"):* Focus on the opening scene. The heat, the rush, the show of hands. This is herding, not independent sampling. *Confidence: High.*
      *   *Point 2: Competence ($p$) & The Standard of Proof:* The "Beyond Reasonable Doubt" clause. If the evidence is ambiguous, $p$ for "Guilty" is effectively $< 0.5$ relative to the standard. The film shows $p$ increasing for "Not Guilty" as evidence is scrutinized. *Confidence: High.*
      *   *Point 3: Deliberation as Error Correction:* CJT assumes static voters. The film shows dynamic voters. Juror 8 isn't just a voter; he's an auditor. He forces the group to meet CJT assumptions (independence via secret ballot, competence via re-examination). *Confidence: Medium-High.*
      *   *Point 4: Unanimity vs. Majority:* CJT optimizes for truth under majority. Unanimity optimizes for liberty under doubt. This isn't a refutation; it's a different objective function. *Confidence: High.*
      *   *Point 5: The Category Error:* Be blunt. A movie about 12 specific humans isn't a test of a limit theorem. But it *is* a case study in why the assumptions matter.
      *   *Specific Scenes:*
          *   Switchblade (New Info).
