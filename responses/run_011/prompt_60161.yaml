  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Core Assumptions:*
          1.  Binary choice (Guilty/Not Guilty).
          2.  Common goal (Truth-seeking).
          3.  Independence (Votes are conditionally independent given the truth).
          4.  Competence ($p > 0.5$ for each voter).
      *   *Conclusion:* As $n \to \infty$, probability of correct majority vote $\to 1$.
      *   *Failure Modes:* If $p < 0.5$, majority gets *worse* with size. If correlation is high, effective $n$ drops.

  3.  **Evaluate the Group Member's Claim:**
      *   *Claim:* 11 vote Guilty, 1 votes Not Guilty. Crowd is wrong. CJT failed.
      *   *Counter:* CJT predicts accuracy *given* competence and independence. If the initial vote is wrong, either $p < 0.5$ (incompetence/bias) or Independence failed (herding). The film *demonstrates* why the initial vote failed the assumptions, not that the theorem is mathematically wrong.

  4.  **Evaluate the User's Preliminary Points:**
      *   *Independence:* Strong point. The jurors share the same biased information stream.
      *   *Secret Ballot:* Interesting interpretation. It breaks social pressure (herding).
