answer: |-
  **MEMORANDUM**

  **TO:** Student Elections Committee
  **FROM:** [Your Name], Junior Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Voting System Reform (Spring Election)

  **Executive Summary**
  Based on the practice poll data, feasibility constraints, and fairness criteria, I recommend the Committee adopt **Approval Voting** for the upcoming spring election. This system aligns with the Condorcet winner in our data (the candidate who beats all others head-to-head), avoids the "spoiler effect" that plagued last year's election, and can be implemented within the five-week deadline using standard Google Forms features.

  If legal review or administrative pushback blocks Approval Voting, the fallback option is **FPTP with an Automatic Runoff**. This ensures compliance with the bylaw requirement for a "majority of votes cast" without requiring complex ballot technology.

  **1. Analysis of Practice Poll Data**
  We simulated an election with 600 voters and four candidates (Marcus, Priya, Dana, Theo). The results vary drastically by system. Note that **Priya** is the Condorcet Winner (she defeats every other candidate in a head-to-head matchup), yet she loses under our current system.

  *Assumption for Approval Voting: Voters approve of their top two choices.*
  *Borda Count points: 1st=3, 2nd=2, 3rd=1, 4th=0.*

  | System | Winner | Vote Count / Score | Notes |
  | :--- | :--- | :--- | :--- |
  | **FPTP (Current)** | **Marcus** | 180 (30%) | Fails majority bylaw; vulnerable to vote-splitting. |
  | **IRV (Ranked)** | **Marcus** | 330 (55%) | Eliminates Dana, then Priya. Marcus wins majority. |
  | **Borda Count** | **Priya** | 1130 pts | Rewards broad consensus over intense polarization. |
  | **Approval** | **Priya** | 380 approvals (63%) | Matches Condorcet winner; high satisfaction. |
  | **Condorcet** | **Priya** | Beats all 1v1 | The mathematical "fair" standard. |

  *Arithmetic Check (Approval):*
  *   **Marcus:** 180 (Grp 1) + 150 (Grp 2) = 330
  *   **Priya:** 180 (Grp 1) + 150 (Grp 2) + 50 (Grp 5) = 380
  *   **Dana:** 130 (Grp 3) + 90 (Grp 4) = 220
  *   **Theo:** 130 (Grp 3) + 90 (Grp 4) + 50 (Grp 5) = 270

  **2. Addressing Arrow's Theorem and Sortition**
  There is confusion regarding Arrow's Impossibility Theorem. To be precise: Arrow's Theorem proves that no *ranked* voting system can satisfy a specific set of fairness criteria (including Independence of Irrelevant Alternatives) simultaneously.

  *   **To the proposal for Sortition (Lottery):** While a lottery technically satisfies Arrow's criteria, it violates the Pareto Efficiency criterion (it could elect a candidate everyone ranked last). Arguing that "all systems are rigged so we should pick randomly" is a surrender of student governance, not a solution. Furthermore, FPTP is not "safe" under Arrow; it fails the Independence of Irrelevant Alternatives criterion notoriously well, as evidenced by last year's 36% winner due to vote-splitting.
  *   **To the proposal for Approval Voting:** The member arguing that Approval Voting "escapes" Arrow is technically correct. Arrow's Theorem applies to *ordinal* (ranked) systems. Approval Voting is *cardinal* (rated). However, escaping Arrow does not make a system perfect; it simply shifts the strategic vulnerabilities.

  **3. Evaluation of Approval Voting**
  Approval Voting is the strongest candidate for reform, but it carries risks we must manage.

  *   **Pros:** It identifies the consensus candidate (Priya) rather than the polarizing one (Marcus). It eliminates the "spoiler effect" (candidates from the same club splitting votes). It is feasible within five weeks (Google Forms "Checkbox" question type).
  *   **Cons & Bylaw Conflict:** Our bylaws require a "majority of votes cast." In Approval Voting, a winner is determined by the most approvals, not necessarily >50%. In our poll, Priya won with 63% approval, but in a crowded field, a winner could emerge with 40%.
      *   *Mitigation:* We must educate voters that they can vote for *as many* candidates as they like. If voters "bullet vote" (approve only one), Approval degrades into FPTP.
  *   **Strategy:** Voters may hesitate to approve a second choice for fear of helping them beat their first choice. However, data suggests this is less common in low-stakes student elections.

  **4. Feasibility and The Five-Week Deadline**
  We cannot realistically implement IRV or Borda. Google Forms does not natively support ranked ballots (e.g., drag-and-drop or conditional logic based on rank) without complex, error-prone workarounds. Counting IRV manually from Form exports introduces human error risks.

  *   **Approval Voting:** Requires changing question type from "Multiple Choice" to "Checkboxes." This is a minor edit, easily filed within the deadline.
  *   **Fallback (FPTP + Runoff):** If Approval is rejected, we must enforce the bylaw. If no candidate receives >50% in round one, the top two proceed to a runoff election one week later. This guarantees a majority winner and requires no new technology, only scheduling coordination.

  **5. Recommendation**
  **Move to adopt Approval Voting for the Spring Election.**
  This solves the vote-splitting issue immediately, aligns with the Condorcet winner in our data, and fits the technical constraints. We will draft voter education materials emphasizing "Vote for all candidates you support."

  **Fallback Motion:** If the District rejects the ballot format change, **move to FPTP with Automatic Runoff.** This preserves the integrity of the "majority" bylaw without requiring new software.

  **6. Criteria for Future Committees**
  To prevent this debate from restarting next year, I propose we codify the following selection criteria in our committee charter:
  1.  **Condorcet Efficiency:** The system should elect the head-to-head winner whenever one exists.
  2.  **Ballot Simplicity:** The voting method must be executable on the District's approved platform without manual counting workarounds.
  3.  **Bylaw Compliance:** The system must mathematically guarantee a majority winner, or the bylaws must be amended to reflect a plurality standard.

  I am available to walk through the arithmetic or the Google Forms prototype at Thursday's meeting.
