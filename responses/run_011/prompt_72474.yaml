  2.  **Identify the Mathematical Phenomenon:**
      *   The description matches the **Riemann Series Theorem** (or Dirichlet's Theorem on conditionally convergent series).
      *   *Condition:* A series $\sum a_n$ is *conditionally convergent* if it converges, but $\sum |a_n|$ diverges.
      *   *Property:* If a series is conditionally convergent, its terms can be rearranged to sum to *any* real number, or to diverge to $+\infty$ or $-\infty$.
      *   *Application to EV:* Expected Value is defined as $\sum P_i \times V_i$. If the sum of the absolute expected values ($\sum |P_i \times V_i|$) is infinite (or diverges), the expectation is undefined.
      *   *User's Description:* "Amount each one adds... shrinks, but glacially." "By scenario 20 it's still contributing about a twentieth of what scenario 1 contributed." This suggests the terms $P_i \times V_i$ are not decaying fast enough for absolute convergence. Specifically, if magnitude doubles ($2^n$) and probability halves ($1/2^n$), the product is constant ($1$). If the product is constant, the sum diverges linearly. If it shrinks "glacially" (like $1/n$), it's the harmonic series, which diverges.
