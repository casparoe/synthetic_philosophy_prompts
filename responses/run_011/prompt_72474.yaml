      *   **The Mathematical Issue:** The expected value (EV) calculation depends on the *order of summation*.
          *   Most-likely-first $\rightarrow$ Positive EV.
          *   Biggest-payoff-first $\rightarrow$ Negative EV.
          *   Truncation (cut off at 12) $\rightarrow$ Third value.
