answer: |-
  ### The Short Answer

  The distinction you are chasing is **not confused**. It is a recognized, hard limit in welfare economics and social measurement. You have correctly identified that quantitative data hits a wall where *causality* collapses into *correlation*.

  There is an established technical term for the indistinguishability itself: **Observational Equivalence**.

  However, that term is sterile and econometric. It describes the statistical state but lacks the normative weight you need for equity work. For your specific context, I recommend adopting the term **Preference Opacity**.

  Below is the carving you asked for: the established term, the coined operational term, the boundaries, and the confidence levels.

  ---

  ### 1. The Established Term: Observational Equivalence

  **Definition:** In statistics and economics, two different structural models are "observationally equivalent" if they generate the exact same probability distribution for the observable data.

  **Application to your work:**
  *   **Model A (Genuine Preference):** Household chooses not to ride because they value privacy/speed of cars more than cost.
  *   **Model B (Adaptive Preference):** Household chooses not to ride because they have internalized exclusion and no longer view transit as a viable option.
  *   **The Data:** Both models produce `Ridership = 0`.

  Because the output is identical, you cannot distinguish the underlying mechanism using ridership data alone. This is not a data quality issue; it is a fundamental limit of the metric.

  **Confidence Level:** **High.** This is standard terminology in econometrics and philosophy of science. However, it is rarely used in *transit planning* or *equity analysis*. If you use this term with engineers or economists, they will know exactly what you mean. If you use it with community stakeholders, it will sound like jargon.

  ---

  ### 2. The Coined Operational Term: Preference Opacity

  Since "Observational Equivalence" is too dry for equity advocacy, I propose **Preference Opacity** for your internal and public-facing work.

  **Definition:** Preference Opacity occurs when the *origin* of a preference (autonomous vs. adaptive) is hidden from measurement, causing distinct equity conditions to appear identical in performance metrics.

  **The Carving (What counts vs. What doesn't):**

  | **Counts as Preference Opacity** | **Does NOT Count** |
  | :--- | :--- |
  | **Non-use due to internalized exclusion** vs. **Non-use due to genuine choice.** (Your core case). | **Non-use due to physical barriers.** (e.g., no ramp). This is an *access* failure, not a preference issue. |
  | **Survey data** where respondents say "I don't need transit" (could be adaptation). | **Stated desire** where respondents say "I want transit but it's unsafe." This is *latent demand*, which is visible. |
  | **Long-term behavioral shifts** where a demographic stops riding over generations. | **Short-term fluctuations** due to fare changes or gas prices. These are price elasticities, not preference structures. |

  **Boundary Cases:**
  *   **The "Car Culture" Edge Case:** A household prefers driving because they grew up in a car-centric suburb. Is this adaptive (society shaped them) or genuine (they like cars)?
      *   *Ruling:* This is **not** Preference Opacity. This is *socialization*. Preference Opacity requires a specific *deprivation* or *exclusion* that suppressed a viable option. If the service was never viable for them, it's not adaptation; it's context.
  *   **The "Luxury" Edge Case:** A low-income household refuses to ride the bus because of stigma, even though it's the rational economic choice.
      *   *Ruling:* This **is** Preference Opacity. The preference (avoid stigma) mimics a "taste," but it is driven by social exclusion. It looks like "expensive taste" in the data, but acts like "adaptive preference" in reality.

  ---

  ### 3. Nearest Neighbors (Differentiation)

  You mentioned knowing "adaptive preferences" and "expensive tastes." Here is how **Preference Opacity** differs:

  *   **Adaptive Preferences (The Cause):** This names the *psychological mechanism* in Case B (lowering aspirations to avoid disappointment). It describes *why* they don't ride.
  *   **Expensive Tastes (The Counter-Claim):** This names the *philosophical defense* in Case A (people are responsible for their costly preferences). It describes *why* we might ignore their non-use.
  *   **Preference Opacity (The Measurement Problem):** This names the *analytic blind spot*. It is the fact that **you cannot tell the difference between the two using your current metrics.**

  **Why this distinction matters:**
  If you only name "Adaptive Preferences," you imply you can identify them. You can't. By naming "Preference Opacity," you admit the metric is broken. It shifts the burden of proof: *Unless we can pierce the opacity (via qualitative work), we cannot assume non-use is voluntary.*

  ---

  ### 4. Is the Distinction Confused?

  You asked me to say plainly if you've invented a problem. **You have not.**

  This is a version of the **Endogenous Preference Problem** in welfare economics (discussed by Amartya Sen, Jon Elster, and Martha Nussbaum).
  *   **The Trap:** Liberal equity models often treat preferences as "sovereign." If you don't ride, we assume you don't want to.
  *   **The Reality:** Preferences are endogenous (shaped by the system). If the system excludes you, your preferences adjust to match the exclusion.
  *   **The Measurement Wall:** Standard cost-benefit analysis cannot separate endogenous preferences from sovereign ones without external qualitative data.

  **However, a warning:**
  While the distinction is real *ontologically* (in reality), it is impossible to separate *epistemically* (in knowledge) using quantitative data alone.
  *   **Do not try to solve this with better regression.** You cannot regress away Preference Opacity.
  *   **Solution:** You must pierce the opacity with **qualitative engagement**. You need focus groups, ethnographic observation, or participatory budgeting to distinguish Case A from Case B. The numbers will never tell you.

  ### 5. Recommendation for Your Vocabulary

  1.  **Use "Observational Equivalence"** when speaking to data scientists, economists, or modelers. It signals you understand the statistical limit.
  2.  **Use "Preference Opacity"** when speaking to planners, leadership, or community stakeholders. It signals an equity blind spot that requires intervention.
  3.  **Metric Adjustment:** When reporting "Unmet Need," add a footnote: *"This metric is subject to Preference Opacity. Non-ridership in historically excluded neighborhoods may reflect adaptive preferences rather than lack of demand."*

  **Confidence Statement:**
  *   **Observational Equivalence:** 100% established term, but reconstructed here for your specific transit context.
  *   **Preference Opacity:** 0% established term. This is a coinage for your specific use case, derived from "information asymmetry" and "opacity" in ethics (e.g., "algorithmic opacity"). It is precise, defensible, and fills the vocabulary gap you identified.

  You are seeing the limit of positivism in equity work. Put a name to it, so you can demand the qualitative resources needed to see through it.
