  It is best described as Temporal Immunization.

  There is no single standard term, so I coin this to specify the mechanism. Closest concepts are "Moving the Goalposts" (changing success criteria) and Popper's "Immunizing Stratagem" (adjusting theory to evade falsification). Unlike Goalposts, the criteria here remain identical; only the timeline shifts. Unlike broad Immunization, this specifically exploits the uncertainty of future rates to avoid present falsification.

  Legitimate science adjusts timelines when new data alters rate calculations (e.g., discovering new reserves lowers depletion rate). Immune claims persist despite contradictory evidence, treating the mechanism as axiomatic rather than empirical. The line is drawn at whether the extension incorporates new disconfirming data or simply ignores the miss to preserve the belief. Honest error admits the model might be wrong; immunization assumes the model is right and the calendar is wrong.

  Three cases:
  1.  **1970s Peak Oil:** Predicted exhaustion by 1990. When missed, proponents cited unconventional oil but maintained the "running out" narrative. **Verdict: Temporal Immunization.** The core claim survived without fundamental mechanistic revision, merely sliding the date.
  2.  **Y2K Computer Crash:** Predicted for Jan 1, 2000. Nothing happened because systems were fixed. **Verdict: Legitimate Mitigation.** The prediction wasn't false; the intervention worked. The claim wasn't immune because it accepted the fix.
  3.  **Commercial Fusion Power:** Consistently predicted as "20 years away" for fifty years. **Verdict: Hard Call.** Is it genuine engineering optimism based on iterative progress, or a rhetorical shield? Since milestones are occasionally met but scaled up, it sits on the edge between optimistic forecasting and immunization.

  Temporal Immunization survives by converting falsification into patience. It differs from honest error because it lacks a stopping condition; the date can always move further, making the claim functionally unfalsifiable.
