      *   *Is it evidential?* Yes, partially. Camp A requires direct genetic/individual selection evidence. Camp B accepts group-level functional outcomes as evidence of adaptation.
      *   *Is it definitional?* Yes, significantly. Camp C hits on this. Camp A and B treat "Religion" as a singular trait. Camp C says it's a cluster.
      *   *Is it about "Function"?* This is the crux. In evolutionary biology, "function" has a specific meaning (selected *for*). Camp B uses a more sociological/functionalist definition (what does it *do* now?). Camp A uses the strict evolutionary definition.
      *   *The "Trench Coat" vs. "Machine" metaphor:* Camp A sees a trench coat (hiding separate things). Camp B sees a machine (designed for a job). Camp C says "It's not a coat or a machine, it's a pile of clothes we call a coat."

      *   *Synthesis:* The disagreement is primarily **metaphysical and methodological**, disguised as empirical. It's about *Explanatory Priority* and *Unit of Analysis*.
