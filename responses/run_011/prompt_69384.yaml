      *   **Camp B (Adaptation/Group Selection):** Religion solves the free-rider problem via costly signaling. *Key claim:* Function explains persistence. The specific costly behaviors (fasting, tithing) are too expensive to be mere noise; they must serve a cooperative function.
      *   **Camp C (Ex-Seminarian/Nominalist):** "Religion" isn't a natural kind (like "kidney"). It's a historical lump. *Key claim:* The question is category error.

  3.  **Diagnose the Disagreement (The "Why"):**
