prompt: |-
  Three weeks from now I'm giving a work-in-progress talk at our department's philosophy-of-language session, and I want to walk in already knowing what's coming at me. The room is a specific mix: mostly Lewis-flavored Humean metaphysicians who think reference is settled by eligibility plus fit, two or three people who think the realism/anti-realism debate got buried somewhere in the nineties and are only there for the cookies, and one actual working set theorist who comes to philosophy talks specifically to explain that philosophers of set theory are confused. He's already told me after a previous talk that anything interesting in this area needs transitive models, and that consistency of ZFC doesn't even get you a countable transitive model, so I'd better be careful what I claim to be deriving from Skolem's paradox.

  Here's the thesis I'm defending, which is not the usual one. I'm not arguing that Skolem's paradox is a genuine puzzle — I grant the standard line that "countable" isn't absolute and that nothing contradictory happens. I'm arguing that the paradox, plus the Löwenheim-Skolem machinery behind it, still does real work against the metaphysical realist, and specifically that the "just more theory" reply to Putnam's model-theoretic argument (the Models and Reality one) fails. My own contribution is a principle I've been calling reabsorption: any constraint the realist adds in order to pin down reference — causal constraints, theoretical-role constraints, idealization-under-improvement constraints — has to be stated in the object language, and whatever is stated in the object language is itself available for the kind of reinterpretation it was supposed to block. The Lewisian answer assumes the constraint can be laid down from somewhere outside; my claim is that the metaphysical realist, who insists reference is a non-semantic relation between words and mind-independent items, has no such outside, and so the constraint just gets folded back into the theory that is itself up for reinterpretation. My officemate's version of the objection, which I could not answer well at the time: he says reabsorption is either a triviality about nonstandard and ill-founded models wearing a metaphysical costume, or else it secretly assumes semantic anti-realism and therefore begs the question against the realist from the first premise.

  So: draft my Q&A prep sheet for this room and this argument, not for a general audience. I want the eight to ten objections I'll actually get — in their vocabulary, phrased in the first person roughly the way each of them would put it standing up at the back of the room — ordered by how much damage they'd do to the talk if I flubbed them. Include the set theorist's technical ones (absoluteness, transitivity, whether I'm entitled to the models I'm invoking, whether my conclusion is even first-order expressible), include the Humean ones (isn't reabsorption just verificationism with extra steps; doesn't your argument prove too much, since it would equally show there's no fact of the matter about parthood or about the past; what's left of your view that isn't just "reference is fixed by use"), and include the deflationary ones from the people who think the debate is dead. For each one tell me what I should concede up front, what my two-minute reply is, and — this is the part I always skip and regret — exactly where that reply is soft. Also flag which of these disputes I should be willing to call merely verbal, and say which part. And give me the one question I'll be praying nobody asks, with the emergency answer I can fall back on if it comes anyway. Don't give me a bibliography or a reading list, I've got the literature; I want the argument prep. American English please.

  Return it as a single JSON object with exactly these fields: "thesis_in_one_neutral_sentence" (string, my thesis stated so that the set theorist would agree it's what I said); "opening_line" (string, one sentence I can say out loud in the first minute to frame things); "objections" (array of objects, ordered worst first, each with "rank" integer, "who" string naming which member of the room raises it, "as_they_would_say_it" string of one to three sentences in first person in their idiom, "what_it_targets" string naming the premise or move of my argument it goes after, "severity" integer 1 to 5, "why_it_bites" string, "concede" string, "reply_two_minutes" string, "where_the_reply_is_soft" string, "merely_verbal" string taking one of "yes"/"no"/"partly", "verbal_note" string explaining which words are doing the work if it isn't a clean no); "the_one_i_pray_nobody_asks" (object with "question", "why_i_dread_it", and "emergency_answer" strings); "crosscutting_concessions" (array of strings — things I should grant early that cost me little and buy me credibility); "audience_prediction" (object with keys "set_theorist", "humean_metaphysicians", and "the_debate_is_dead_crowd", each a string saying what each group will conclude about the talk by the end); and "biggest_unresolved_crux" (string, the sub-question I should honestly tell them I haven't settled, since they'll smell it anyway if I pretend otherwise).
