  6.  **Writing the Memo.** (Focusing on clarity, neutrality, and rigor). *Wait, I need to make sure I don't sound like I'm dismissing the student's pain.* I will distinguish between "Misconduct" (punishable) and "Poor Mentorship" (manageable). This allows a "Not Sustained" verdict on misconduct while acknowledging the problem.

