      *   *Critique:* How to avoid "epistemic injustice" jargon?
      *   *Correction:* Focus on "evidentiary asymmetry" and "structural opacity." Talk about the *nature of the evidence*, not the *identity of the knower*.

  5.  **Final Polish:** Check tone. Ensure it sounds like a colleague speaking to colleagues, not a lecture. Ensure the "reuse criteria" are practical.

      *(Self-Correction on the "Sustain" group)*: If I recommend dismissal on all, the 2 sustain members might feel I'm ignoring them. I should acknowledge that their reading of the situation is *plausible*, just not *proven*. This validates their intuition without compromising the verdict.

