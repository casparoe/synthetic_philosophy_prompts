      *(Refining the "Community" slot)*: The community is the tricky part. Was it the newsroom? The readers? The "moral community" of anti-racism? I should highlight that the punishment was imposed *in the name of* one community (staff safety) but enforced by another (management) against a member of a third (opinion staff).

      *(Refining the "Reintegration" slot)*: The prompt asks about his comfortable comeback. Does this break the theory? In traditional punishment, reintegration is the goal. Here, exclusion was the goal. His return elsewhere shows the sanction was *local*, not *universal*.

      *(Final Polish)*: Ensure the distinction between "Accountability" (process-oriented) and "Punishment" (outcome-oriented) is sharp. Accountability implies a debt paid; Punishment implies pain inflicted.

