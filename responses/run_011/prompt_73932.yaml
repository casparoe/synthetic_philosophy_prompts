answer: |-
  **Title:** The Ontology of the Loop: Why the "Real Rate" of Neurodivergence is an Ill-Posed Question

  **Introduction**

  In the annual assembly, the administration offers a specific comfort regarding the rising rates of ADHD and autism diagnoses. We are told that the numbers are an artifact of better awareness and looser criteria, not a genuine epidemic. The implication is clear: there is a stable, underlying reality—a "true rate" of these conditions—that exists independently of our ability to count it. The rise is merely a measurement error, a fog clearing to reveal the landscape as it always was.

  I intend to argue that this reassurance is metaphysically naive. It assumes that diagnostic categories for human psychology function like geological strata or viral loads, waiting to be discovered. I argue instead that for categories like ADHD and autism, there is no fact of the matter regarding a "rate independent of classification." When a classification loops back onto the people it classifies, altering their self-understanding and behavior, and thereby altering the classification itself, the target of the measurement shifts. The question is not merely difficult to answer; it is ill-posed. There is no stable "there" there to be counted.

  **The Conditions for the Argument**

  For this argument to gain traction, we must distinguish between two types of kinds: *indifferent kinds* and *interactive kinds*. This distinction, famously articulated by philosopher Ian Hacking, is the bedrock of the claim.

  For my thesis to hold, the diagnostic category in question must satisfy three conceptual conditions:

  1.  **Cognitive Accessibility:** The classification must be intelligible to the people being classified. A person diagnosed with the condition must be able to understand the label and what it implies about their mind and behavior.
  2.  **Self-Constitution:** The classification must alter the subject's self-conception. Upon acquiring the label, the individual does not remain the same person merely now named; they become a different kind of agent. They may adopt the traits associated with the label, resist them, or reorganize their life narrative around them.
  3.  **Feedback Loop:** This change in self-conception must causally affect the manifestation of the condition, thereby modifying the extension of the category itself.

  If a category satisfies these conditions, it is an *interactive kind*. If it does not, it is an *indifferent kind*. The standard assembly argument treats neurodivergence as an indifferent kind. I argue it is fundamentally interactive.

  **The Instability of the Target**

  To assert that there is a "real increase" distinct from an "artifact of counting," one must assume ontological stability across time. We must be able to compare Variable $X$ at Time 1 (parents' generation) with Variable $X$ at Time 2 (current generation). This requires that $X$ remains the same entity in both instances.

  In the case of interactive kinds, this identity condition fails. Consider the behavior associated with ADHD. In a context where the concept does not exist, a child's inability to focus is interpreted as moral failing, boredom, or high energy. In a context where the concept exists, that same inability is interpreted through a medical framework. Crucially, the child who knows the framework behaves differently than the child who does not. They may seek accommodations, they may view their focus issues as a neurological trait rather than a character flaw, or they may perform the symptoms more acutely because the "script" of the disorder is now available to them.

  Consequently, the "condition" at Time 2 is not the same ontological object as the "condition" at Time 1. The classification has participated in creating the very thing it claims to merely describe. To ask if there is a "real increase" independent of the classification is to ask for a comparison between two different things. It is like asking if the value of the dollar has risen independently of the economy that gives it value. The metric and the reality are entangled. Therefore, the distinction between "real increase" and "diagnostic artifact" collapses. There is only the history of the classification and the people living within it.

  **Objection I: Interactive Kinds Can Still Be Real**

  A critic might object that social construction does not imply unreality. Money, marriage, and citizenship are all interactive kinds; they depend on human agreement and self-understanding. Yet, we can meaningfully ask if there are more marriages now than in 1950. If we can count marriages, why can we not count cases of autism? If an interactive kind can be real, why can't its frequency be measured?

  This objection conflates *institutional reality* with *naturalistic pathology*. The administration's reassurance relies on the implicit premise that ADHD and autism are *natural kinds*—biological or psychological substrates that exist like viruses or bone fractures, which we are simply getting better at spotting. If they were purely institutional, like marriage, the "real rate" question would indeed be nonsensical, but for a different reason: marriage rates *are* defined by the counting rules.

  The problem arises because the medical model wants to have it both ways. It claims the authority of natural science (implying a stable, independent biological reality) while operating in the realm of interactive human kinds. If we treat autism purely as a social identity (like marriage), the "real rate" objection holds no water because there never was a biological baseline. But the assembly speaks as if there *is* a biological baseline that hasn't changed.

  My argument is that because the category is interactive, it cannot sustain the claim of being a stable natural kind *for the purpose of longitudinal measurement*. We can count marriages because the rules of marriage are explicit and the act of counting doesn't change who is married. But when we count neurodivergence, the act of counting (diagnosing) changes the neurology/behavior of the counted. The "reality" of the condition is not in dispute; the suffering and the traits are real. What is illusory is the idea that these traits form a static population that can be tracked across decades without the tracking mechanism altering the population.

  **Objection II: The Tuberculosis Objection**

  A more severe objection is that this argument proves too much. If the existence of a name prevents us from measuring the "real rate" of a condition, then we could never measure the history of any disease. Did tuberculosis become more or less common before and after we discovered the bacteria? By my logic, since the classification of TB changed how we counted it, the question would be ill-posed. This seems absurd; TB rates clearly fluctuated independently of our knowledge of them.

  This objection fails because it ignores the requirement of *cognitive accessibility*. Tuberculosis is an *indifferent kind*. The bacillus *Mycobacterium tuberculosis* does not know it has been named. It does not read medical journals. It does not adjust its replication strategy based on whether humans classify it as a disease or a punishment from God. The classification of TB changes human *behavior* (we wear masks, we take antibiotics), which affects the *spread* of the bacteria, but it does not change the *nature* of the bacteria itself, nor does it change the internal experience of the bacteria.

  In contrast, human beings are cognitive agents. When a human is classified as "autistic" or "ADHD," the classification enters their cognitive ecosystem. It changes how they interpret their own impulses. It changes how teachers treat them, which changes how they learn, which changes how their brain develops. The "object" of study (the human mind) reacts to the microscope.

  With TB, the gap between the *concept* of the disease and the *reality* of the disease is bridgeable because the reality (the bacteria) is indifferent to the concept. With neurodivergence, the gap is unbridgeable because the reality (the human experience) is constituted partly by the concept. To ask for the rate of autism independent of the concept of autism is to ask for the rate of a thing that does not exist in that form without the concept.

  **Conclusion**

  The standard reassurance offered to students is comforting because it suggests stability. It tells us that the world is not changing, only our vision of it. I argue that this is false. The world *is* changing, precisely because our vision of it is changing.

  We cannot step outside the looping effect to measure the "true" rate of neurodivergence. We are inside the loop. The rise in diagnoses is neither a mere artifact nor a biological epidemic; it is a historical transformation of the human kind. To demand a number that strips away the classification is to demand a ghost—a version of the condition that never existed in the wild, untouched by the language we use to capture it. We must accept that in the realm of the human mind, to name is to make, and to count is to change.
