answer: |-
  **Seminar Handout: The Trifle, The Mirror, and The Judge**
  **Topic:** *Citizen Kane* as Plutarchan Biography (and its Limits)

  **The Problem of the Trifle**
  In the introduction to his life of Alexander, Plutarch draws a line between the historian and the biographer. He argues that great deeds—battles, sieges, political triumphs—do not always reveal the true shape of a soul. Often, he suggests, character shines more clearly in a small remark, a joke, or a minor habit. For Plutarch, the "trifle" is more reliable evidence than the public victory.

  *Citizen Kane* is structured around the most famous trifle in cinema history: a sled named Rosebud. The reporter Thompson spends the film collecting testimony about Kane's public deeds (the battles and sieges of finance and politics), only to conclude that no single word can sum up a man. Yet the film ends by showing us the sled burning in a furnace. This creates a tension: the biographer within the film fails to find the key, but the audience is given it.

  If we read this through Plutarch, the film seems to be testing the ancient biographer's confidence. Plutarch believes that isolating these trifles allows the reader to use the life as a mirror for their own self-improvement. We see the virtue or vice, and we adjust ourselves accordingly. Kane, however, is a man who surrounds himself with statues and reflections but never actually looks in a mirror. He builds Xanadu as a monument to himself, but he refuses self-reflection. If the subject of the biography refuses to look in the mirror, can the biography still function as one for the reader? The film suggests that the moral lesson of a life might land somewhere the biographer cannot reach. The truth of Kane is visible to us, the spectators, but it remains inaccessible to the investigator. This implies a limit to Plutarch's method: the "trifle" might reveal character, but only to an omniscient observer, not to a historian bound by testimony.

  **The Portrait and the Flaw**
  In his life of Lucullus, Plutarch offers advice on how to handle a subject's flaws. He compares the biographer to a painter. If a face has a slight imperfection, the painter should neither omit it entirely nor dwell on it excessively. To omit it makes the portrait ugly (false); to dwell on it makes it unlike the sitter (caricature). Plutarch wants to defend human nature against the idea that it never produces good characters; he treats transgressions as shortcomings in an excellence, not products of pure baseness.

  *Citizen Kane* largely ignores this advice. It dwells. The film is less interested in balancing Kane's greatness with his flaws than in documenting the corrosion of his character. Consider the breakfast-table sequence. We see a marriage disintegrate not through a single dramatic event, but through a series of small, cutting exchanges over years. This aligns with Plutarch's interest in the small habit, but it violates his advice on proportion. Welles presents the ugliness without the counterweight of virtue.

  Is this a failed Plutarchan portrait, or is it a commentary on modern expectations? We tend to equate "honesty" in biography with the exposure of darkness. Plutarch seeks moral utility; Welles seems to seek psychological complexity. By dwelling on the flaws, the film asks whether a modern audience accepts a life as "true" only when it is damaged. If Plutarch wants to offer a model for emulation or avoidance, Welles offers a puzzle that resists moral categorization.

  **Hagiography and the Missing Comparison**
  Plutarch's *Parallel Lives* are paired: a Greek statesman matched with a Roman. Each pair ends with a *synkrisis*, a comparison chapter where Plutarch weighs the two lives and adjudicates their virtues. He tells us how to judge.

  *Citizen Kane* offers a different structure. The "News on the March" newsreel functions as a piece of public hagiography running in reverse. It is an obituary that cannot decide whether to canonize Kane as a patriot or damn him as a fascist. It lists the deeds but cannot settle the character. Furthermore, Xanadu itself operates as a self-built reliquary. Kane is crating up the material evidence of his own cult, surrounding himself with objects that signify importance but lack context.

  Crucially, the film provides six competing testimonies from people who loved or resented Kane, but it offers no comparison chapter. There is no narrator to step forward at the end and tell us whether Kane was "good" or "bad." The *synkrisis* is missing. The film forces the audience to perform the comparison ourselves. We must weigh the testimony of the friend against the mistress, the business manager against the butler. This collapses the distinction between praising someone and understanding them. Hagiography assumes that to praise is to understand. *Kane* suggests that understanding might require suspending praise entirely. When the biographer refuses to judge, the burden of moral judgment shifts entirely to the viewer.

  **Where the Fit Breaks**
  It is important to acknowledge where this comparison strains. Plutarch writes with the confidence that a life *can* be known and that knowing it is useful. *Citizen Kane* is deeply skeptical of both premises.

  Thompson's failure to find the meaning of Rosebud may not be a philosophical point about moral education; it may simply be a point about privacy. Some things die with the person. If Rosebud is merely a private memory of lost innocence, it has no moral utility for the reader. It cannot teach us how to live. In this light, the burning sled is not a Plutarchan trifle that reveals character; it is a joke aimed at the audience. We are like Thompson: we want a simple key to explain a complex life. The film gives us a key that opens nothing. If we walk away thinking "Rosebud explains Kane," we have fallen for the same trap as the newsreel. We have reduced a life to a symbol. This resists Plutarch's project, which relies on the reduction of a life into a usable lesson.

  **Why Film? What Does the Medium Add?**
  A philosophical essay can state that a life is fragmented and that biography is limited. But a film can make you *experience* the assembly and the failure.

  Watching a life get assembled piece by piece, only to fail to add up, teaches something that stating the problem does not. In an essay, the contradiction is logical. In *Kane*, the contradiction is spatial and temporal. We physically see the gap between the public image (the newsreel) and the private reality (the bedroom). We watch the marriage rot in fast-forward. We walk through the halls of Xanadu and see the sheer volume of stuff that fails to signify meaning.

  The film contributes to the argument about the uses of biography by showing the *labor* of interpretation. It forces you to sit through the conflicting stories. It makes you feel the frustration of Thompson. When the camera glides through the hall of mirrors, you are not just told that Kane lacks self-reflection; you are visually trapped in his lack of reflection. The medium demonstrates that a life is not a text to be read, but a space to be navigated—and sometimes, a maze with no center.

  ***

  **Clip Guide for Seminar Discussion**

  **1. News on the March (The Opening)**
  *   **Argumentative Function:** Establishes the "public hagiography." It shows how a life is flattened into headlines. Use this to discuss the "reverse canonization"—how the newsreel tries to judge Kane and fails. It sets up the need for the deeper investigation that follows.
  *   **Focus:** The contradictory adjectives used to describe him ("patriot," "pacifist," "idealist," "fascist").

  **2. Thatcher's Manuscript (The Library Scene)**
  *   **Argumentative Function:** Represents the "History" vs. "Life" distinction. Thatcher sees Kane as a series of financial and political deeds. He misses the man. This contrasts with Plutarch's claim that deeds are less revealing than habits.
  *   **Focus:** Thatcher's cold, institutional voiceover versus the young Kane playing in the snow outside the window.

  **3. The Breakfast Table Montage**
  *   **Argumentative Function:** The Plutarchan "trifle" in action. This is not a battle; it is a series of small remarks and habits that reveal the decay of character. It addresses the *Lucullus* portrait passage: here, the film *dwells* on the imperfection rather than balancing it.
  *   **Focus:** The change in costume and the physical distance between the chairs as the dialogue becomes more hostile.

  **4. Susan Alexander's Opera Debut and the Aftermath**
  *   **Argumentative Function:** The distinction between praising and understanding. Kane praises her (builds the opera house), but he does not understand her (she cannot sing). It shows Kane trying to force a narrative onto another life, just as a biographer might.
  *   **Focus:** The shot of Kane clapping alone in the vast theater, and Susan's subsequent suicide attempt.

  **5. The Hall of Mirrors (Xanadu)**
  *   **Argumentative Function:** The visual argument against self-reflection. Plutarch wants the life to be a mirror for the reader; Kane fills his house with mirrors so he never has to look at himself. This is the counter-example to Plutarch's moral utility.
  *   **Focus:** The multiple reflections of Kane as he smashes the room after Susan leaves.

  **6. Sorting the Junk in the Great Hall (The Ending)**
  *   **Argumentative Function:** The failure of material evidence. Xanadu is a reliquary, but the relics are just junk. The burning of Rosebud shows the limit of the "trifle." It explains nothing to the characters.
  *   **Focus:** The camera pulling back from the furnace to the "No Trespassing" sign. The mystery is solved for us, but the biographer (Thompson) remains in the dark. This justifies the audience's role as the final judge (*synkrisis*).
