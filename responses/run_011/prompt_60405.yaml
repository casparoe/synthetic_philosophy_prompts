prompt: |-
  A friend of mine — intelligent, careful about most things — has concluded that a death our county coroner ruled an accident was in fact a killing, and that he knows roughly who was responsible. When I push back he says he has done his own research: he has read the filed incident reports, watched the council meetings, catalogued inconsistencies in the official timeline, and asked the family what the police told them. The phrase has become his universal reply. I notice it is also used approvingly by people who despise his conclusions, where it means checking primary documents rather than repeating headlines.

  I would like the phrase taken apart before I go back to him. Set out the distinct claims that doing your own research could be standing for, as a list, ordered from the ones that are trivially true to the ones doing unearned work. For each reading, say whether it is a platitude, a substantive and defensible epistemic principle, or false, and where it holds or breaks down. Then tell me which reading, if any, would carry him from justified distrust of an institution's testimony to a confident positive account of what happened — and which one he is most likely invoking when he uses it to close down our arguments rather than to continue them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A friend believes a coroner's "accident" ruling was actually a killing and knows who did it. He justifies this with "I've done my own research" (reading reports, watching meetings, cataloging inconsistencies, talking to family).
      *   **Observation:** The phrase is used both by him (to support a conspiracy-adjacent claim) and by his critics (to mean checking primary sources vs. headlines).
      *   **Task:** Deconstruct the phrase "doing your own research" (DYOR).
      *   **Format:** A list of distinct claims/meanings, ordered from trivially true to doing unearned work.
      *   **Evaluation:** For each reading, classify it (platitude, substantive/defensible principle, or false) and explain where it holds/breaks down.
      *   **Specific Analysis:** Identify which reading bridges the gap from distrust to confident positive account, and which reading is being used rhetorically to close down argument.

  2.  **Deconstruct "Doing Your Own Research" (DYOR):**
      *   What does it *actually* mean in different contexts?
      *   *Level 1:* Don't just trust headlines. (Trivial/Good)
      *   *Level 2:* Look at primary sources. (Good/Defensible)
      *   *Level 3:* Interpret the data yourself rather than trusting experts. (Problematic/Epistemically risky)
      *   *Level 4:* My interpretation is final because I did the work. (Rhetorical shield/False)
      *   *Level 5:* I have accessed hidden truth that institutions hide. (Conspiratorial/False)

      *Refining the Order (Trivial -> Unearned):*
      1.  Verification of basic facts (not relying on hearsay).
      2.  Engagement with primary sources (reports, transcripts).
      3.  Critical evaluation of official narratives (looking for inconsistencies).
      4.  Substitution of lay judgment for expert synthesis (forensics, law).
      5.  Epistemic closure (research as a trump card rather than a process).

  3.  **Drafting the List (Iterative Process):**

      *   *Item 1: Information Hygiene.* Don't repeat rumors. Check if the event happened.
          *   *Status:* Platitude/Defensible.
          *   *Breakdown:* Rarely the issue in complex cases.
      *   *Item 2: Primary Source Access.* Reading the report, not the news summary.
          *   *Status:* Substantive Principle.
          *   *Breakdown:* Reading $\neq$ Understanding. Technical jargon, legal context missing.
      *   *Item 3: Narrative Consistency.* Checking timelines, looking for gaps.
          *   *Status:* Defensible but limited.
          *   *Breakdown:* Inconsistencies happen in accidents too. Chaos looks like conspiracy.
      *   *Item 4: Expertise Substitution.* Believing one's own interpretation of forensics/law over the coroner/police.
          *   *Status:* False/Epistemically Unearned.
          *   *Breakdown:* Lacks training, context, chain of custody knowledge.
      *   *Item 5: Epistemic Sovereignty.* The act of researching validates the conclusion regardless of outcome.
          *   *Status:* False/Rhetorical.
          *   *Breakdown:* Research is a method, not a truth-generator.

  4.  **Addressing the Specific Questions:**
      *   *Which reading carries him from distrust to confident positive account?* This requires a leap from "something is wrong" (distrust) to "I know who did it" (positive account). This is Item 4 (Expertise Substitution) mixed with Item 5 (Sovereignty). He assumes his interpretation of the gaps *is* the evidence of guilt.
      *   *Which one is he invoking to close down arguments?* This is Item 5 (Epistemic Sovereignty/Rhetorical Shield). It makes the research a moral virtue rather than an evidentiary standard.

  5.  **Refining the Tone:**
      *   Needs to be analytical, philosophical, yet accessible.
      *   Avoid mocking the friend, but be rigorous about the epistemic limits.
      *   Acknowledge the validity of institutional distrust (coroners *can* be wrong) without validating the specific leap to "I know who killed them."

  6.  **Developing the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between "research" as *gathering* and "research" as *analyzing*. The friend is doing gathering + amateur analyzing.
      *   *Nuance:* Acknowledge that official reports *are* sometimes wrong. The problem isn't distrust, it's the *certainty* of the alternative.
      *   *Ordering:* Ensure the gradient from "Good Citizen" to "Armchair Detective" is clear.

  7.  **Final Polish:**
      *   Check against the prompt requirements: List ordered? Yes. Classifications (platitude, principle, false)? Yes. Where it holds/breaks? Yes. Specific analysis of the friend's leap? Yes. Specific analysis of the rhetorical shutdown? Yes.

      *(Self-Correction on Ordering)*:
      1.  Verification (Don't trust rumors).
      2.  Primary Sources (Read the doc).
      3.  Critical Scrutiny (Look for inconsistencies).
      4.  Competence Equivalence (My reading = Expert reading).
      5.  Process as Proof (The effort validates the conclusion).

      *Let's refine the classifications.*
      1.  Platitude/Defensible.
      2.  Substantive Principle.
      3.  Defensible but insufficient.
      4.  False (Epistemic overreach).
      5.  False (Rhetorical fallacy).

      *Wait, the prompt asks for "trivially true to the ones doing unearned work."*
      Okay, I will structure it that way.

      *Final check on the "Closing Down" aspect:* This is crucial. It's the "Genetic Fallacy" or "Appeal to Effort." The work done is treated as moral capital.

  8.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is a dissection of the phrase "doing your own research," ordered from the trivially virtuous to the epistemically unearned, followed by an analysis of your friend's specific usage.

  ### 1. The Hygiene Claim
  **The Claim:** One should not repeat information one has not verified; one should prefer direct accounts over summarized hearsay.
  **Classification:** **Platitude / Defensible Principle.**
  **Where it holds:** In the age of algorithmic newsfeeds, this is a baseline civic duty. If a headline says "Man Shot by Police," checking the police report to see if a weapon was recovered is responsible behavior.
  **Where it breaks down:** It assumes the "direct account" is accessible and intelligible. In complex forensic or legal matters, the "primary source" (e.g., a toxicology screen or an autopsy protocol) is often unintelligible to a layperson without specialized training. Verification requires comprehension, not just access.

  ### 2. The Primary Source Claim
  **The Claim:** Official summaries (press releases, news clips) often omit context found in the raw data (incident reports, meeting minutes); therefore, one must consult the raw data.
  **Classification:** **Substantive Epistemic Principle.**
  **Where it holds:** Institutions do sanitize narratives. Reading the council minutes rather than the local paper's summary of them is a valid way to uncover omitted dissent or procedural irregularities. This is the version of the phrase his critics use approvingly.
  **Where it breaks down:** It conflates *access* with *audit*. Reading a document is not the same as auditing it. A layperson reading a coroner's report sees words; a forensic pathologist sees a synthesis of histology, chemistry, and biomechanics. The raw data is often theory-laden; you cannot view the "facts" without accepting the methodology that gathered them.

  ### 3. The Inconsistency Claim
  **The Claim:** Official narratives are linear and clean; reality is messy. Therefore, inconsistencies in the official timeline or testimony indicate deception or error.
  **Classification:** **Defensible but Insufficient.**
  **Where it holds:** Lies often require memory, whereas truth relies on record. Contradictions between two police officers' statements, or between a timeline and a phone record, are legitimate grounds for skepticism.
  **Where it breaks down:** Inconsistency is not proof of malice, nor even of error. In traumatic events (like a death), witness memory is notoriously unreliable. Administrative records are often filled with clerical errors or standardized jargon that looks like obfuscation to an outsider. Finding a gap proves a gap exists; it does not prove what fills the gap.

  ### 4. The Competence Equivalence Claim
  **The Claim:** An intelligent, motivated layperson can interpret technical evidence (forensics, law, ballistics) as reliably as the credentialed professionals assigned to the case.
  **Classification:** **False (Epistemic Overreach).**
  **Where it holds:** Rarely. It holds only in cases where the error is administrative or blatant (e.g., a timestamp is clearly impossible).
  **Where it breaks down:** This is the Dunning-Kruger effect applied to epistemology. It assumes that "research" is merely the accumulation of information, rather than the application of a trained heuristic. A coroner rules "accident" based on exclusionary criteria (ruling out homicide, suicide, natural causes) derived from years of pattern recognition. A friend "researching" the case is usually engaging in *inclusionary* reasoning (finding evidence that *could* fit a homicide). You cannot research your way into a professional consensus without the underlying training.

  ### 5. The Process-as-Proof Claim
  **The Claim:** The moral effort expended in researching validates the conclusion reached. Because I have worked harder than the average person, my conclusion is more trustworthy.
  **Classification:** **False (Rhetorical Fallacy).**
  **Where it holds:** Nowhere. This is an *argumentum ad lapidem* (appeal to effort).
  **Where it breaks down:** Research is a method, not a truth-generator. One can do exhaustive research into a false premise and arrive at a confident falsehood. This claim treats skepticism as a virtue that inoculates the researcher against error. It shifts the burden of proof: instead of the evidence supporting the claim, the *effort* supports the claim, making the conclusion unfalsifiable by outsiders who haven't done the "work."

  ***

  ### Analysis of Your Friend's Position

  **Which reading carries him from distrust to a confident positive account?**
  He is relying on a collapse of **Claim 3 (Inconsistency)** into **Claim 4 (Competence Equivalence)**.

  Distrust of the institution is justified by Claim 3: *There are inconsistencies in the timeline; therefore, the official ruling is suspect.* This is a valid move. However, to move from "the ruling is suspect" to "I know roughly who was responsible" requires Claim 4. He is assuming that because he has identified gaps in the official story, his own synthesis of the remaining fragments constitutes a superior explanatory model. He is treating the absence of official evidence for an accident as positive evidence for a specific killing, without possessing the forensic tools to validate that leap.

  **Which reading is he invoking to close down arguments?**
  He is invoking **Claim 5 (Process-as-Proof)**.

  When he uses the phrase as a universal reply to pushback, he is no longer discussing the evidence. He is signaling that he has paid an "epistemic tax" (reading the reports, watching the meetings) that you have not. By framing his conclusion as the product of labor, he makes disagreement feel like an insult to his diligence. It transforms the conversation from *evaluating the truth of the claim* to *respecting the effort of the researcher*. This is why the phrase shuts down argument: it implies that to disagree is to be lazy, reliant on headlines, or dismissive of his hard work, rather than simply unconvinced by the inference.

  **Summary for your conversation:**
  You can grant him Claim 1 and 2 (it is good he read the reports) and even Claim 3 (inconsistencies are worth noting). But you must challenge Claim 4 and 5. You can acknowledge that the coroner *could* be wrong without accepting that your friend's amateur reconstruction *must* be right. Research identifies questions; it does not automatically authorize answers.
