      *   *Filled Bowl (solid):* Becomes a blob or *o*. Loses the "hole" feature which is often key for *a* vs *o*. Verdict: Not an *a* (usually).
      *   *Child's Backwards Bowl:* If consistent within their system, and distinct from their *o* and *e*, it's an *a*. If it clashes with their *d*, it's a problem.

  6.  **The Tie-Breaker Case:**
