      *   *Case:* A secret code where the symbol 'a' is assigned the sound 'b'. Is it an *a* or a *b*?
      *   *Better Case:* A font where the *a* and *d* are swapped. If I write "dad" using the *a*-shape for the *d*-sound and *d*-shape for the *a*-sound.
      *   *Best Case:* The "Cyrillic Trap." The Cyrillic letter 'а' looks exactly like Latin 'a'. In a Russian word, is it an 'a'? Yes. In an English word written by a Russian using Cyrillic characters? It's a fake 'a'.
      *   *Let's go with the "System Swap":* A shape identical to your standard one-storey *a*, but the sign painter declares, "In this alphabet, this shape is *b*."

  7.  **Addressing the Sacrifices:**
