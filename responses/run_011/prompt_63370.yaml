answer: |-
  ### 1. The Correction: Truth vs. Robustness

  You asked for a procedure to decide if an assumption is "fit to be built into a safety case" based on whether its theoretical posits will survive 100,000 years. I must tell you plainly: **That question is unanswerable.** No procedure can predict which theories will be overthrown.

  If you build a procedure on "ontological stability" (will this concept exist in the future?), it will either reject everything (because all concepts are provisional) or accept everything (because you cannot prove they won't survive).

  The question a repository actually faces is not whether your theories are *true*, but whether they are **robustly conservative**. If a theory is replaced in 500 years, will the new theory predict *more* release or *less*? If the current model is wrong, does the error favour safety or risk?

  Therefore, the procedure below does not test for truth. It tests for **Safety Robustness under Theory Change**. It uses your "load-bearing" intuition but directs it toward risk management. It asks: "If this posit is discarded, does the safety case collapse?"

  ### 2. The Decision Procedure: The Robustness & Conservatism Screen

  **Time limit:** 90 minutes per assumption.
  **Operator:** Hydrogeologist, Materials Engineer, or equivalent.
  **Input:** One specific modelling assumption (e.g., "Flow obeys Darcy's Law," "Corrosion follows Arrhenius kinetics").

  #### Step 1: The Empirical Anchor
  **Question:** What specific data points calibrate this assumption, and what is the gap between the calibration conditions and the safety case conditions?
  *   **Sufficient Answer:** A quantitative statement of scale (time, distance, temperature, concentration) for both data and application.
  *   **Insufficient Answer:** "It is well established" or "It matches general behaviour."
  *   **Termination:** If the gap exceeds three orders of magnitude in any dominant variable (time, space, energy) without intermediate validation, **STOP**. Hand to Step 5 (Risk/Values).
  *   **[JUDGEMENT CALL]:** Determining which variable is "dominant." An engineer must decide if temperature matters more than time, or vice versa. This is not mechanical; it relies on professional intuition about the physics.

  #### Step 2: The Load-Bearing Test
  **Question:** Is this posit "load-bearing" for the safety-relevant output, or is it "picture-painting"?
  *   **Definition:** A posit is *load-bearing* if changing its value or removing its mechanism changes the calculated dose/release by more than 10%. It is *picture-painting* if the output remains stable despite the change.
  *   **Sufficient Answer:** A sensitivity analysis showing the output variance when the posit is perturbed or removed.
  *   **Insufficient Answer:** A qualitative statement that the posit is "fundamental" or "standard."
  *   **Termination:** If load-bearing, proceed to Step 3. If picture-painting, **ACCEPT** (record as low priority).
  *   **[JUDGEMENT CALL]:** Setting the threshold for "significant change." While 10% is suggested, the reviewer must decide if a 5% change matters for this specific barrier.

  #### Step 3: The Direction of Error (Conservatism Check)
  **Question:** If this posit is scientifically false (e.g., the mechanism is different, the constant is wrong), does the current model overestimate or underestimate the release/dose?
  *   **Sufficient Answer:** A demonstration that known alternative mechanisms or parameter bounds yield *higher* release rates than the current model.
  *   **Insufficient Answer:** "The model is conservative because we use high values." (This confuses parameters with mechanism).
  *   **Termination:** If the model underestimates release when wrong, **REJECT** (or require redesign). If it overestimates release when wrong, proceed to Step 4.
  *   **[JUDGEMENT CALL]:** Assessing "known alternatives." The reviewer must decide if a dissenting paper constitutes a "known alternative" or a fringe view. This is where prior sympathy can creep in; the reviewer must document *why* a dissenting view was excluded.

  #### Step 4: The Survivorship Adjustment
  **Question:** Is there evidence that this class of models has historically failed in similar extrapolations?
  *   **Rationale:** Successful theories become invisible; failed ones are catalogued. We must look for the silent failures.
  *   **Sufficient Answer:** A search for analogous long-term extrapolations in adjacent fields (e.g., oil reservoir modelling, climate modelling, materials aging) where the same mathematical form was used and later found inadequate.
  *   **Insufficient Answer:** "No failures are recorded in our field."
  *   **Termination:** If analogous failures exist and are unexplained, **ACCEPT WITH CONDITIONS** (requires additional safety margin). If no analogous failures exist, **ACCEPT**.
  *   **[JUDGEMENT CALL]:** Deciding what counts as "analogous." Is a polymer degradation model analogous to copper corrosion? The reviewer must justify the analogy.

  #### Step 5: The Risk Handoff
  **Question:** Does the assumption pass Steps 1–4, but still leave a residual risk due to scale gaps or unknown mechanisms?
  *   **Action:** If the procedure stops here, the matter is no longer scientific; it is about how much uncertainty the programme is willing to carry.
  *   **Output:** A formal "Uncertainty Disclosure" statement.
  *   **Termination:** Hand to Programme Director/Chief Scientist for risk appetite decision.

  ### 3. Recording the Outcome

  To satisfy the Chief Scientist and future auditors, the output must be a single page with three fields:

  1.  **The Verdict:** (Accept / Accept with Conditions / Reject / Handoff).
  2.  **The Regulatory Summary:** (Exactly two sentences, plain language. Example: "This model assumes rock behaves like a sponge. If the rock behaves like a pipe instead, our model predicts more leakage, so we are safe even if the model is wrong.")
  3.  **The Judgement Log:** (A list of the [JUDGEMENT CALL] steps from above, stating what decision was made and the single technical reason why.)

  ### 4. Limitations of the Procedure

  You asked what this procedure cannot do.

  **1. The "Unknown Theory" Limit**
  This procedure screens *existing* posits. It cannot detect a theory nobody has thought of yet. If the true physics of groundwater flow involves a mechanism currently undiscovered (e.g., non-local quantum effects in pore spaces, however unlikely), this screen will not catch it.
  *   **Is this fatal?** No, provided you treat the model as *one line of defence*, not the *only* line of defence. This procedure validates the model; it does not validate the repository. The repository relies on the model plus natural barriers plus engineered margins. If you treat the model output as a precise prediction rather than a bounding estimate, this limit is fatal. If you treat it as a conservative bound, the limit is manageable.

  **2. The "Survivorship Bias" Limit**
  You noted that successful theories become invisible. We adjusted Step 4 to look at adjacent fields. However, this adjustment is imperfect because we cannot know what we failed to notice.
  *   **Adjustment:** The procedure explicitly forces the reviewer to look *outside* their discipline (Step 4). This is the only way to mitigate the bias. If the reviewer stays within hydrogeology to check hydrogeology, the bias wins.

  ### 5. Application to Cases

  Here is the procedure run on your three cases.

  #### Case 1: Darcy Flow in Fractured Crystalline Rock
  *Assumption:* Fractured rock is modelled as an equivalent porous continuum. Calibrated on metres/years; deployed on kilometres/millennia.

  *   **Step 1 (Anchor):** Gap is >3 orders of magnitude in space and time. **STOP/Handoff to Step 5.**
  *   **Step 2 (Load-Bearing):** Flow path is load-bearing for transport time.
  *   **Step 3 (Direction):** If rock is not a continuum but a discrete fracture network, flow is usually *faster* (channeling). The continuum model often *underestimates* speed. **REJECT** (unless proven conservative).
  *   **Step 4 (Survivorship):** Reservoir modelling often fails when upscaling permeability.
  *   **Verdict:** **REJECT** (in current form).
  *   **Regulatory Summary:** "We treat the rock like a sponge, but it is actually cracked. Water moves faster through cracks than sponges. We must assume faster flow to be safe."
  *   **Programme Impact:** This is standard industry practice. The procedure flags it as unsafe because the upscaling direction is non-conservative.

  #### Case 2: Arrhenius Corrosion of Copper Canister
  *Assumption:* Corrosion rate follows Arrhenius law, fitted at high temp, extrapolated to ambient over geological time. Two groups disagree on mechanism.

  *   **Step 1 (Anchor):** Gap is >3 orders of magnitude in time. Temperature extrapolation is significant. **Proceed.**
  *   **Step 2 (Load-Bearing):** Corrosion rate is the primary constraint on containment lifetime. **Load-bearing.**
  *   **Step 3 (Direction):** Group A says reaction proceeds; Group B says it stops at ambient. If Group B is right, the model overestimates corrosion (Safe). If a third mechanism exists (e.g., microbiological) that is faster, the model underestimates corrosion (Unsafe). The existence of competent disagreement implies the mechanism is not settled. **Handoff to Step 5.**
  *   **Step 4 (Survivorship):** Chemical kinetics often break down over geological time due to surface passivation changes not seen in months.
  *   **Verdict:** **ACCEPT WITH CONDITIONS** (Must include specific margin for alternative mechanisms).
  *   **Regulatory Summary:** "We assume the canister rusts at a steady rate. Some scientists say it stops rusting; others say we don't know the rate. We add extra thickness to cover the uncertainty."
  *   **Programme Impact:** This is your "most heavily validated" package. The procedure reveals it carries the highest exposure because the mechanism is disputed (Step 3) and the extrapolation is vast (Step 1). It forces you to admit the validation is temporal, not mechanistic.

  #### Case 3: Biosphere Model (Present-day Diet/Land Use)
  *Assumption:* Future dose calculated using current agricultural habits and diet.

  *   **Step 1 (Anchor):** Gap is 10,000+ years in time. No calibration data exists for future societies. **STOP/Handoff to Step 5.**
  *   **Step 2 (Load-Bearing):** Diet is load-bearing for internal dose.
  *   **Step 3 (Direction):** If future people eat more local food, dose increases. If they eat less, dose decreases. Direction is unknown. **Handoff to Step 5.**
  *   **Step 4 (Survivorship):** Social models have 100% failure rate over centuries.
  *   **Verdict:** **HANDOFF TO RISK/VALUES.**
  *   **Regulatory Summary:** "We cannot know what people will eat in 10,000 years. We use today's diet as a placeholder. Deciding if this is safe enough is a policy choice, not a scientific one."
  *   **Programme Impact:** The procedure correctly identifies that this is not a scientific assumption. It strips the "technical" costume off the problem and forces the Chief Scientist to defend it as a value judgement (e.g., "We protect the critical group").

  ### 6. Final Advice

  You asked me to tell you if the request rests on a confusion. It does.

  You are trying to use philosophy to solve an engineering problem. The "pessimistic induction" (theories change) is a fact of history, but it is not a design constraint. You cannot design for "truth." You can only design for "consequences of falsehood."

  The procedure above works because it ignores whether the model is *right*. It asks only: **"If this model is wrong, do we die?"**

  If you train your reviewers on this, you will face friction. They are trained to defend their models as "correct." This procedure asks them to defend their models as "safely wrong."

  **The Uncomfortable Result:**
  Case 2 (Corrosion) is the one your programme will not like. It is likely the cornerstone of your safety case. The procedure flags it as high-exposure because it relies on a mechanism that is actively disputed by competent peers.
  *   **Why the procedure says this:** Step 3 (Direction of Error). If the mechanism is disputed, you cannot prove the error is conservative.
  *   **What this means:** You are currently relying on a "consensus" that is actually a "standoff." The procedure forces you to either resolve the science (find the mechanism) or add engineering margin (thicker canister). You cannot hide behind the model anymore.

  **The "Unknown Theory" Limit:**
  This is not fatal if you use the procedure to drive **Defence in Depth**. If the model might be wrong due to unknown physics (Case 1 & 2), the repository must survive the *failure* of the model. The model informs the design; it does not permit it.

  **The "Survivorship Bias" Adjustment:**
  I embedded this in Step 4. Do not remove it. It is the only check against the arrogance of "current best science." If your reviewers cannot find an analogous failure in a different field, they haven't looked hard enough.

  **Implementation Warning:**
  The [JUDGEMENT CALL] markers are where your reviewers will drift back into subjectivity. You must audit the **Judgement Log**. If the log says "Dominant variable is time" without a reason, reject the review. The discipline is not in the checklist; it is in the documentation of the exceptions.
