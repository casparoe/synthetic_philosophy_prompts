  *   **The Conflict:** This is an ethical vs. political inconsistency.
      *   (1) declares pure time preference *ethically indefensible*.
      *   (2) implements pure time preference (via market rates) as a matter of policy.
      *   **Why it fails:** "Democratic humility" is a political justification, not an ethical one. If an act is ethically indefensible (per 1), doing it for political convenience (per 2) makes you complicit, not humble. It renders (1) rhetorically toothless.
  *   **Cheapest Revision:** Modify **(2)**. Reframe the 5–7% rate not as "the right rate" but as a "political constraint for short-term fiscal budgeting," while reserving a lower prescriptive rate for long-term social appraisal.
      *   **Cost:** Complexity. You must maintain two discount rates and explain why the "wrong" one is used for public money.

  **3. Severity: Medium — (2) vs. (4)**
  *   **The Conflict:** This is a technical implementation friction.
      *   (2) benchmarks to a constant 5–7% market return.
      *   (4) endorses a declining schedule based on uncertainty.
      *   **Why it fails:** Market rates do not automatically incorporate the Weitzman/Gollier declining rate effect in the way your prescriptive model does. Using a market benchmark contradicts the uncertainty logic of the declining schedule.
      *   **Cheapest Revision:** Modify **(4)**. Clarify that the declining schedule applies *only* beyond the horizon where market rates become unreliable (e.g., >30 years), keeping (2) for the short run.
      *   **Cost:** Precision. You introduce a "kink" in your appraisal methodology that critics can attack as arbitrary.

  ### The Single Revision That Repairs the Most

  **Revise the normative implication in (3).**

  Do not merely add a caveat to (5); instead, decouple your metaphysics from your normativity in (3). State: *"I accept the reductionist account of personal identity... but I reject the consequence that normative concern should track connectedness."*

  **Reasons for this verdict:**
  1.  **It resolves the Logical Contradiction:** By denying that fading connectedness justifies reduced concern, you remove the conflict with (5). You can maintain that discounting is a rational defect (5) because identity metaphysics (3) do not dictate moral weight.
  2.  **It Saves Your Ethics:** This revision strengthens (1). If connectedness does not justify discounting for your *own* future selves, it cannot justify discounting for *future generations* (who are even less connected). This unifies your personal and social ethics into a coherent "No Discounting" principle.
  3.  **It Isolates the Pragmatism:** Once (1), (3), and (5) are aligned philosophically, (2) becomes a clear, isolated pragmatic compromise ("I know the truth, but I must work within current fiscal rules"). This is a defensible "Ethics of Responsibility" position, whereas your current set is an indefensible logical muddle.

  **The Cost:**
  You lose the explanatory elegance of Parfit's argument. You must explain *why* we feel less concern for our future selves if not because of fading connectedness (e.g., appeal to objective well-being or whole-life unity). This is a philosophical cost, but it is the price of coherence. Without this change, your workshop auditors will identify the (3)-(5) contradiction immediately, and it will invalidate the ethical weight of your entire statement.
