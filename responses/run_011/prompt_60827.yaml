      *   **Goal:** A joint statement for an adversarial collaboration that reviewers will accept. It needs to show agreement on basics, exact residual disagreement, and concrete experimental plans.
      *   **Tone:** Constructive, precise, non-adversarial (in tone), but sharp on disagreements. American English. No citations/bibliography.
      *   **Required Components:**
          1.  Numbered section of agreed claims (including the "red wine" study and "belief-resistant illusion" cases).
          2.  Disagreements Table (Claim, Penetration Side, Impenetrability Side, Substantive vs. Verbal).
          3.  Cruxes (Sub-questions, Concrete Paradigm, Pre-registered Predictions).
          4.  Specific Design Analysis (Design A: Color Adaptation/Belief; Design B: Masked Discrimination/Category). For each: Relevance, Required Controls, Predictions (direction/magnitude).
          5.  Additional Designs (One from each camp).
          6.  Signal Detection Theory (SDT) Section (Sensitivity vs. Criterion).
          7.  Definitions Box (Shared vocabulary, Attention ruling).
          8.  Falsification Conditions (What counts as evidence against each view).
          9.  Caricature Check (One line each on how the other is misunderstood).
          10. Conclusion (Terminological vs. Substantive resolution).

  2.  **Deconstruct the Philosophical/Scientific Conflict:**
      *   **Impenetrability Camp (Fodor/Pylyshyn):** Early vision is modular, encapsulated, informationally isolated. High-level cognition (beliefs, desires) doesn't change the *content* of perception, only post-perceptual judgment, attention, or memory. "Perception proper" is fixed.
      *   **Penetration Camp:** Perception is theory-laden. High-level states (beliefs, concepts) can alter the phenomenological experience itself. The boundary between perception and cognition is porous.
      *   **Key Friction Points:** Definition of "perception," role of attention, interpretation of illusions (do they persist despite belief?), interpretation of top-down effects (is it perception or decision?).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official and collaborative. "Joint Statement of Adversarial Collaboration on Cognitive Penetration."
      *   **Introduction:** Brief context setting.

      *   **Section 1: Agreed Claims:**
          *   Need to handle the "Red Wine" case (Morrot et al. style). Both sides agree the *behavior* changes. Disagree on *mechanism*. Agreement: The stimulus was identical; the report changed.
          *   Need to handle "Belief-Resistant Illusions" (e.g., Müller-Lyer). Both agree the illusion persists despite knowledge. Agreement: Knowledge does not *eliminate* the effect.
          *   General agreement: Neural processing is hierarchical; top-down signals exist.

      *   **Section 2: Definitions Box:**
          *   Crucial to define "Perception," "Cognition," "Attention."
          *   *Attention:* This is the biggest fight. Impenetrability says attention selects inputs but doesn't change processing rules. Penetration says attention is the vehicle of penetration. *Compromise:* Distinguish "feature-based attention" (selection) from "expectation-driven modulation." Let's rule that *exogenous* attention shifts aren't penetration, but *endogenous* expectation effects on early sensory gain are the battleground.
          *   *Perception:* Early sensory representation vs. conscious experience. Let's aim for "conscious perceptual experience" as the target.

      *   **Section 3: Disagreements Table:**
          *   Need neutral claims.
          *   *Claim 1:* Does belief change the sensory representation?
          *   *Claim 2:* Is the "shrinking perimeter" defense valid?
          *   *Claim 3:* Are demand characteristics sufficient to explain existing data?
          *   *Substantive vs. Verbal:* Some might be verbal (what counts as "perception"), some substantive (neural locus).

      *   **Section 4: Signal Detection Theory (SDT):**
          *   Impenetrability says effects are $c$ (criterion) shifts.
          *   Penetration says effects are $d'$ (sensitivity) shifts.
          *   Agreement: If only $c$ changes, it's post-perceptual. If $d'$ changes, it's perceptual.
          *   Survival: Even if $d'$ changes, Impenetrability might argue it's "early selection" not "cognitive penetration."

      *   **Section 5: The Cruxes & Designs (A & B):**
          *   *Design A (Color Adaptation/Belief):*
              *   *Impenetrability:* Irrelevant or predicts null. Belief doesn't change adaptation physiology. Control: Check if belief actually changed the *perceived* color of the adapter.
              *   *Penetration:* Predicts shift in nulling point. Belief changes the gain control.
              *   *Prediction:* Penetration says significant shift in PSE (Point of Subjective Equality). Impenetrability says null effect within noise.
          *   *Design B (Masked Discrimination/Category):*
              *   *Impenetrability:* Predicts criterion shift only. Verbal load won't kill it (because it's not cognitive). Nonverbal adjustment will match button press.
              *   *Penetration:* Predicts sensitivity shift. Verbal load might reduce it. Nonverbal adjustment shows the shift.
              *   *Control:* Debrief to ensure belief held.

      *   **Section 6: Additional Designs:**
          *   *Impenetrability Choice:* TMS disruption of PFC during a perceptual task. If PFC goes down and perception stays same, encapsulation holds.
          *   *Penetration Choice:* Learning-induced plasticity in early visual cortex (V1) measured by fMRI pattern classification after category training.

      *   **Section 7: Falsification & Caricatures:**
          *   *Impenetrability Falsified:* If $d'$ changes with pure belief manipulation while controlling attention.
          *   *Penetration Falsified:* If all effects vanish under strict dual-task load or are fully explained by criterion shifts.
          *   *Caricatures:* Impenetrability isn't saying cognition is useless; Penetration isn't saying *anything* can change *anything*.

      *   **Section 8: Conclusion:**
          *   Identify what is terminological (definition of "early") vs. substantive (neural locus of belief effects).

  4.  **Refining and Polishing:**
      *   *Constraint Check:* No citations. American English. Specific wording on Wine/Illusions.
      *   *Tone Check:* Ensure it sounds like a consensus document, not a debate transcript. Use "We agree," "Camp X holds," etc.
      *   *Specific Wine Wording:* Must capture that tasters used red-wine vocabulary for dyed white wine.
      *   *Specific Illusion Wording:* Must capture that patches look different despite known identical reflectance.
      *   *Attention Ruling:* This is critical. The prompt asks for an explicit ruling. I need to make sure the definition distinguishes between *selecting* a location (not penetration) and *altering* the appearance via expectation (potential penetration).
      *   *SDT Section:* Needs to be precise about $d'$ vs $c$.
      *   *Design Details:* Ensure controls are specific (e.g., "concurrent verbal load").

  5.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe let them agree attention *is* penetration.
      *   *Correction:* No, Fodorians hate that. The agreement needs to be that *mere orienting* isn't penetration, but *expectation-based gain* is the test case.
      *   *Initial thought:* Make the predictions vague.
