answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION: COGNITIVE PENETRATION OF PERCEPTUAL EXPERIENCE

  **Date:** October 26, 2023
  **Parties:** The Encapsulation Working Group (Impenetrability Camp) and The Top-Down Modulation Group (Penetration Camp)
  **Context:** Interdisciplinary Grant Bid (Vision Science & Philosophy of Mind)

  ## 1. AGREED CLAIMS

  The following claims are accepted by all signatories as established or conceptually necessary for the purposes of this collaboration.

  1.  **Hierarchical Processing:** Visual processing involves a hierarchy of neural stages, from early retinal input to high-level cortical areas. There is anatomical evidence for feedback connections from higher to lower areas.
  2.  **The Wine Paradigm:** In studies where an odorless red dye is added to a white wine, we agree that: (a) the physical stimulus presented to the olfactory and visual systems is identical across the dyed and undyed conditions regarding volatile compounds; (b) expert tasters produce verbal reports characteristic of red wine in the dyed condition; (c) this establishes that high-level expectations or visual cues can alter *behavioral reports* regarding sensory experience. We remain agnostic in this statement on whether the *phenomenology* itself changed or only the description of it.
  3.  **The Illusion Paradigm:** In demonstrations where subjects are told and fully believe two patches have identical reflectance (e.g., checkerboard shadow illusions) yet they continue to look different, we agree that: (a) explicit propositional knowledge does not eliminate the perceptual difference; (b) this establishes that some perceptual representations are resistant to immediate cognitive override. We remain agnostic on whether this resistance proves encapsulation or merely demonstrates the strength of low-level priors.
  4.  **Methodological Necessity:** To distinguish perceptual changes from post-perceptual judgment changes, experiments must utilize measures that dissociate sensory sensitivity from response bias (e.g., Signal Detection Theory metrics, non-verbal adjustment tasks, or neural decoding of early visual areas).
  5.  **Attention Distinction:** There is a distinction between *spatial orienting* (selecting a location for processing) and *feature-based expectation* (priming a specific content regardless of location). Both camps agree that mere spatial orienting does not count as cognitive penetration in the sense disputed here.

  ## 2. DEFINITIONS BOX

  To prevent equivocation, the following vocabulary is binding for all proposed methodologies.

  | Term | Shared Definition |
  | :--- | :--- |
  | **Perceptual Experience** | The conscious, analog representation of the world available to the subject prior to conceptual labeling or propositional judgment. Operationally defined by performance on non-verbal matching or adjustment tasks. |
  | **Cognitive State** | A propositional attitude (belief, desire, expectation) or a semantic concept that is not itself a sensory representation. |
  | **Cognitive Penetration** | A causal influence of a **Cognitive State** on the content of **Perceptual Experience** such that the experience would have been different had the cognitive state been different, holding sensory input and attention constant. |
  | **Attention-Mediated Effects** | **Ruling:** Effects driven purely by *exogenous* cueing or *spatial* selection are **not** counted as penetration. Effects driven by *endogenous* semantic expectations that modulate sensory gain *without* shifting spatial focus **are** the target of this investigation. |
  | **Encapsulation** | The property of a processing system wherein its internal operations are not influenced by the semantic content of states outside that system. |

  ## 3. DISAGREEMENTS TABLE

  | Neutral Claim | Penetration Camp Position | Impenetrability Camp Position | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Locus of Effect** | Top-down signals alter the tuning curves or firing rates in early visual cortex (V1/V2), changing the sensory signal itself. | Top-down signals alter decision thresholds, memory retrieval, or response selection in frontal/parietal areas; early sensory signals remain invariant. | **Substantive** (Neural locus) |
  | **The "Shrinking Perimeter"** | Defining "perception" as "whatever is impenetrable" renders the claim unfalsifiable and ignores the continuity of processing. | Defining "perception" strictly is necessary to distinguish input systems from central systems; if an effect is top-down, it belongs to the central system by definition. | **Verbal** (Boundary drawing) |
  | **Demand Characteristics** | Careful controls (debriefing, implicit measures) rule out subjects simply guessing what the experimenter wants. | Most alleged penetration effects vanish when strict controls for compliance and response bias are applied; subjects are working out the task, not seeing differently. | **Substantive** (Empirical prevalence) |
  | **Function of Perception** | Perception is for guiding action in a context-rich world; efficiency requires integrating prior knowledge immediately. | Perception is for providing an objective fix on the environment; mixing belief with input risks hallucination and error propagation. | **Substantive** (Teleological) |

  ## 4. SIGNAL DETECTION THEORY (SDT) RECasting

  Both camps agree that reporting sensitivity ($d'$) and criterion ($c$) separately is the minimum standard for behavioral data.

  *   **Impenetrability Camp:** We predict that all alleged penetration effects will manifest as shifts in criterion ($c$) with no change in sensitivity ($d'$). If $d'$ remains constant, the sensory signal is unchanged; only the willingness to report "same" or "different" has shifted.
  *   **Penetration Camp:** We predict that genuine penetration will manifest as shifts in sensitivity ($d'$). If the cognitive state makes the signal clearer or more distinct, discriminability should improve or worsen independent of bias.
  *   **Residual Disagreement:** The Impenetrability Camp argues that even a $d'$ shift could result from early *selection* (filtering noise) rather than *penetration* (changing content). The Penetration Camp argues that if expectation changes the signal-to-noise ratio in early cortex, the distinction between "selection" and "content change" is merely semantic. **Agreement:** A robust $d'$ shift in the absence of spatial attention shifts will be treated as evidence favoring Penetration.

  ## 5. CRUXES AND PROPOSED PARADIGMS

  ### Crux 1: Does semantic belief alter sensory gain in the absence of spatial attention?
  *   **Paradigm:** Design A (Color Adaptation/Belief).
  *   **Prediction (Penetration):** Belief that the adapter is "green tile" vs. "white tile under green light" will shift the aftereffect nulling point by >5nm in CIE space.
  *   **Prediction (Impenetrability):** No significant difference in nulling points between conditions (<1nm variance).

  ### Crux 2: Does cognitive load eliminate the effect?
  *   **Paradigm:** Design B (Masked Discrimination/Category).
  *   **Prediction (Penetration):** The effect persists under verbal load but is reduced; non-verbal adjustment matches button press.
  *   **Prediction (Impenetrability):** The effect is eliminated or reversed under verbal load; non-verbal adjustment shows no effect while button press does (indicating response bias).

  ## 6. ANALYSIS OF SPECIFIC DESIGNS

  ### Design A: Color-Adaptation Study
  *Protocol:* 40s adaptation to greenish field. Test on neutral gray. Identical pixels. Condition 1: Belief field is green tile. Condition 2: Belief field is white tile under green light. Measure: Aftereffect nulling point.

  *   **Relevance:**
      *   **Penetration:** Directly tests if semantic interpretation of the *cause* of the color alters the physiological adaptation state.
      *   **Impenetrability:** Relevant only as a control; expects null result as adaptation is retinal/cortical reflex.
  *   **Required Controls:**
      *   **Penetration:** Must verify via post-trial report that subjects actually held the belief during adaptation.
      *   **Impenetrability:** Must include a "No Belief" baseline and control for luminance changes in the display hardware.
  *   **Pre-registered Prediction:**
      *   **Penetration:** Significant shift in Point of Subjective Equality (PSE). Direction: Stronger aftereffect in "Green Tile" condition. Effect size: $d = 0.6$.
      *   **Impenetrability:** Null effect. PSE difference not distinguishable from noise. Effect size: $d < 0.1$.

  ### Design B: Masked Same/Different Discrimination
  *Protocol:* Brief narrative establishes category (ripe fruit vs. dyed plastic). Display identical. Subject not asked about category. Debrief check on belief. Concurrent verbal load. Nonverbal adjustment + button press.

  *   **Relevance:**
      *   **Penetration:** Tests if category penetrates when resources are taxed and when motor output is decoupled from language.
      *   **Impenetrability:** Tests if the effect is actually a linguistic/decision strategy that collapses under load.
  *   **Required Controls:**
      *   **Penetration:** Must ensure the narrative does not direct spatial attention to specific features.
      *   **Impenetrability:** Must include a condition where the category is irrelevant to the task to check for automaticity.
  *   **Pre-registered Prediction:**
      *   **Penetration:** $d'$ increases for "same category" trials. Verbal load reduces effect by 20% but does not eliminate it. Adjustment task shows same bias as button press.
      *   **Impenetrability:** $d'$ remains constant; $c$ shifts. Verbal load eliminates the bias. Adjustment task shows no bias, only button press does.

  ## 7. ADDITIONAL DESIGNS

  ### Proposed by Impenetrability Camp: TMS Disruption of PFC
  *   **Design:** Apply Transcranial Magnetic Stimulation to Prefrontal Cortex (PFC) during a perceptual matching task known to show top-down effects.
  *   **Rationale:** If the effect is cognitive, disrupting the cognitive engine (PFC) should abolish it. If the effect is perceptual (early visual), disrupting PFC should leave it intact.
  *   **Prediction:** TMS to PFC will abolish the bias. If the bias remains, the Penetration Camp must concede the effect is not driven by high-level cognitive states.

  ### Proposed by Penetration Camp: fMRI Pattern Classification in V1
  *   **Design:** Train a classifier to distinguish neural patterns in V1 for Red vs. Green. Test if holding a belief ("I am looking at Red") without visual input, or with ambiguous input, activates the "Red" pattern in V1.
  *   **Rationale:** Direct neural evidence that semantic states alter early sensory representation codes.
  *   **Prediction:** Classifier will decode the believed color from V1 activity above chance, even when stimulus is ambiguous. Impenetrability Camp accepts this as evidence *if* hemodynamic lag and attention confounds are ruled out.

  ## 8. FALSIFICATION CONDITIONS

  *   **What the Impenetrability Camp accepts as evidence against their view:**
      *   A study demonstrating a shift in sensory sensitivity ($d'$) driven by semantic belief, where spatial attention is strictly controlled, verbal load does not eliminate the effect, and the effect correlates with BOLD signal changes in V1 that cannot be explained by feedback from decision areas.
  *   **What the Penetration Camp accepts as evidence against their view:**
      *   A comprehensive meta-analysis showing that all previously reported penetration effects vanish when response bias is measured via non-verbal adjustment tasks and when strict dual-task loads are applied to occupy working memory.

  ## 9. CARICATURE CHECK

  *   **Impenetrability Camp on Penetration Camp:** "You are not claiming that *anything* can change *anything*; you are claiming that optimal Bayesian inference integrates priors at the earliest possible stage, which is a specific mechanistic claim, not magic."
  *   **Penetration Camp on Impenetrability Camp:** "You are not claiming that cognition is useless; you are claiming that the input system must be stable to serve as a check on hypothesis generation, which is a functional claim, not a denial of feedback anatomy."

  ## 10. CONCLUSION: TERMINOLOGICAL VS. SUBSTANTIVE

  This collaboration reveals that approximately **40%** of the dispute is terminological, specifically regarding the boundary line between "early perception" and "late cognition." The Impenetrability Camp defines perception by its *functional role* (input to thought), while the Penetration Camp defines it by its *phenomenal character* (what it looks like).

  However, **60%** of the dispute is substantive. It concerns the neural locus of belief-driven modulation. If belief-driven modulation occurs in V1 and alters sensitivity ($d'$), the Penetration Camp is substantively correct regardless of what we call it. If belief-driven modulation occurs only in decision circuits and alters criterion ($c$), the Impenetrability Camp is substantively correct. The proposed designs (A and B) are selected specifically to adjudicate this substantive remainder. We agree to proceed with the grant application on the basis that these empirical outcomes are decidable.
