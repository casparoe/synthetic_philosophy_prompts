      *   **The "One Claim" Constraint:** I need to be careful here. I need to pick a claim I'm least sure about. Probably the specific valuation of the user's specific comp package (since I don't see the terms). Or perhaps the philosophical claim about whether Ergodicity *fully* replaces Utility. (I'll lean towards the philosophical claim being the least certain, as economics is not physics).
