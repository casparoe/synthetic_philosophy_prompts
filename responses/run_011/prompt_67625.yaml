  2.  **Analyze the Theoretical Disagreement (Camps 1 & 2):**

      *   *Camp 1 (Expected Utility Theory - EUT):* Standard economics. Agents maximize $E[U(W)]$. If $U$ is logarithmic (or CRRA), the St. Petersburg paradox vanishes. The simulation result (median shrinks) is explained by the agent caring about the *expectation of utility*, not the *utility of the expectation*.
      *   *Camp 2 (Ergodicity Economics):* Associated with Ole Peters. Argues that EUT implicitly assumes ergodicity (time average = ensemble average). In multiplicative processes, they diverge. Maximizing time-average growth rate leads to Log Utility *specifically*, not arbitrarily. It claims to be objective (physics/dynamics) rather than subjective (psychology/preferences).
