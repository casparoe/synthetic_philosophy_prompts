              *   Launch Bad: -500.
              *   Signal Accuracy: 80%.
              *   Prior: 50/50.
              *   $P(\text{Good} | \text{Signal=Go}) = 0.8$.
              *   Individual EV (if Signal=Go): $0.8(100) + 0.2(-500) = 80 - 100 = -20$. Still negative.
              *   *Problem:* If individual rationality says "Don't Launch," the game stalls.
              *   *Fix:* Make the Benefit higher or Cost lower *for the individual calculation*, OR assume the students feel a moral imperative (common good) that weights the False Negative heavily.
              *   *Better Fix:* The "Curse" usually implies that acting on the signal is *locally rational* (or at least plausible) but globally catastrophic.
              *   Let's set Payoffs: Good = +1000, Bad = -100. (Wait, usually Bad > Good in dual use).
              *   Let's try: Good = +100, Bad = -300. Accuracy = 90%.
              *   $P(\text{Good} | \text{Go}) = 0.9$. EV = $0.9(100) + 0.1(-300) = 90 - 30 = +60$. **Individual launches.**
              *   Collective (State=Bad): $P(\text{At least one Go}) = 1 - (0.1)^{28} \approx 100\%$.
              *   Collective EV (State=Bad): -300.
              *   Collective EV (State=Good): +100.
              *   If State is Bad (which we will set for Round 1), the class loses big.
      *   *Round 2 (Vary N):* Split class into 4 groups of 7. Same logic. Shows N matters.
      *   *Round 3 (Mirror Image):* State = GOOD. But require Consensus (Deference).
          *   If Rule is "Only Launch if Everyone Agrees."
          *   $P(\text{All Signal=Go} | \text{State=Good}) = 0.9^{28} \approx 0.05$.
          *   Result: Good project fails.

  5.  **Refining the Flow (Requirement 5 & 6):**
      *   Need to capture the "Decision Rule" before the round.
      *   Handout: "My Rule: I will launch if..."
      *   Debrief: Show that given their signal, their rule was rational.
      *   Timeline: 100 mins.
          *   Intro: 10
          *   Round 1 (High N, Bad State): 15
          *   Round 2 (Low N, Bad State): 15
          *   Round 3 (Deference/Consensus, Good State): 15
          *   Debrief/Discussion: 45
      *   Wait, 45 mins debrief is good.
      *   Need to ensure the "Discovery" happens. Don't explain the math until the end.

  6.  **Addressing Failure Modes (Requirement 7):**
      *   *Nobody launches:* If individual EV is actually negative (miscalculation). Need to ensure the "Go" signal feels compelling. Add a "Social Pressure" nudge? No, keep it pure. Just ensure the Payoff/Benefit ratio makes launching rational for a signal-holder.
      *   *Reverse Engineering:* A student might say "You're making us lose on purpose."
      *   *Response:* Acknowledge it. "The structure is the lesson."
      *   *Emotional Exposure:* A student launches, class loses points, they feel guilty.
      *   *Defuse:* "The system was designed to make this happen. You were rational. The structure failed you."

  7.  **Limitations (Requirement 8):**
      *   Game has fixed probabilities. Real life: we don't know the accuracy.
      *   Game has fixed payoffs. Real life: values differ.
      *   Game is reversible (points reset). Real life: dual-use is often irreversible.

  8.  **Finalizing the Design Details:**
      *   *Signal Delivery:* Envelopes are best for "private information." 28 envelopes per round. Prepped beforehand.
      *   *Tally:* Students write "LAUNCH" or "PASS" on a slip, fold, put in box. Instructor counts "LAUNCH" slips.
      *   *Anonymity:* Essential. If public, the first person to raise hand bears the burden. Secret ballot simulates independent agency.
      *   *Points:* "Ethics Ledger" on whiteboard.
      *   *Rounds:*
          1.  *The Pandemic Patch:* N=28, State=BAD, Acc=85%, Payoff +100/-400. (Individual EV positive, Collective disaster).
          2.  *The AI Safety Update:* N=7 (4 groups), State=BAD, Acc=85%. (Shows N reduction helps).
          3.  *The Geoengineering Test:* N=28, State=GOOD, Rule=Consensus. (Shows Deference cost).

      *   *Wait, check Round 1 Math again:*
          *   $P(\text{Signal=Go} | \text{Bad}) = 0.15$.
          *   $P(\text{No Launch} | \text{Bad}) = 0.85^{28} = 0.01$.
          *   So 99% chance of Launch.
          *   Individual: $P(\text{Good} | \text{Go})$. Prior 50/50.
          *   $P(\text{Go}) = 0.5(0.85) + 0.5(0.15) = 0.5$.
          *   $P(\text{Good} | \text{Go}) = (0.5 \times 0.85) / 0.5 = 0.85$.
          *   EV = $0.85(100) + 0.15(-400) = 85 - 60 = +25$.
          *   Yes, Rational to Launch.
          *   Collective Outcome (State=Bad): -400.
          *   This works.

  9.  **Structuring the Debrief Questions:**
      *   Start with feelings.
      *   Move to rationality (show the rules).
      *   Move to structure (N factor).
      *   Move to solution (Deference).
      *   Move to critique of solution (Who decides?).

  10. **Review against Constraints:**
      *   No citations? Check.
      *   28 students? Check.
      *   Low overhead tally? Check (Folded slips).
      *   Disguised repetition? Check (Different scenarios).
      *   Arithmetic provided? Check.
      *   Mirror image included? Check.
      *   Failure analysis included? Check.

  11. **Refining the "Disguise":**
      *   Make the envelopes look different? No, too much prep.
      *   Change the "Mission Briefing" text on the board.
      *   Round 1: "Open Source Viral Vector."
      *   Round 2: "Decentralized Model Weights."
      *   Round 3: "Stratospheric Aerosol Injection."

