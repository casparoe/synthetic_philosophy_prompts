prompt: |-
  I teach a 100-minute session in a graduate research-ethics seminar: 28 students, mostly doctoral candidates in the life sciences and computer science plus a few policy students. It opens a unit on dual-use work, and I want it built around the phenomenon called the unilateralist's curse. You do not need to know the literature and should not cite anything; here is the structure I want the students to run into on their own.

  A number of agents each independently acquire fallible private information about whether a given initiative — releasing a protocol, publishing a dataset, deploying a system — would on balance help or harm. Any single agent is able to carry the initiative through alone. Each is motivated by the common good rather than career advantage. If each acts on their own judgment, the initiative proceeds more often than it should: the chance that someone acts on a false positive climbs with the number of agents, and the failure survives good intentions, genuine competence, and individually correct reasoning. The natural repair — pooling signals and deferring to a designated collective judgment, a principle of conformity — is precisely what real competitive, confidential, or fast-moving settings discourage.

  Design an in-class game that makes all four of those claims felt, in that order, with none of them stated before the debrief. Specifically, I need:

  1. Rules and a round structure, including a low-overhead way to give 28 people a private signal and tally the result inside a couple of minutes. Vary the number of potential launchers, the accuracy of the signal, and the ratio of harm to benefit across rounds, and disguise the repetition behind different surface framings so that the structural identity of the rounds is itself a discovery in the debrief. Tell me whether launches should be anonymous and justify the choice.

  2. A points scheme in which no money changes hands but the ledger feels consequential, with a public running total.

  3. The arithmetic. State the exact numbers you have chosen and derive, for each configuration, the probability that at least one agent launches, the probability that the initiative is bad conditional on its launching, and the expected points. I want to know in advance what each round ought to produce, how many trials a configuration needs before the pattern is visible rather than lucky, and whether a surprising result is noise or a design flaw.

  4. One configuration that yields the mirror-image failure — a beneficial initiative that never happens because deferring is individually correct — so the students see what conformity is supposed to buy as well as what unilateralism costs.

  5. A sequence in which each participant writes down a decision rule before a round and is afterwards shown that every launcher's rule was sound given their own signal, so the failure cannot be attributed to stupidity or selfishness.

  6. A timeline in minutes, and a debrief built as a question sequence that leads the group to propose collective deferral themselves and then to attack it — who decides, what happens to a correct minority, what conformity entrenches.

  7. An honest failure analysis: nobody launches at all; the tally drags; a student reverse-engineers the design in round one; the accusation that the deck was stacked; and above all the emotional exposure of the student whose launch caused the harm, with a concrete way to defuse it.

  8. A frank closing note on which feature of the phenomenon this game cannot reproduce — the contested accuracy of real judgment, the irreversibility, the fact that the hidden state is fixed by me rather than partly constituted by the agents' own values — and what I must therefore supply by argument.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 100-minute graduate research-ethics seminar.
      *   **Audience:** 28 students (Life Sciences, CS, Policy).
      *   **Topic:** Dual-use research, specifically the "Unilateralist's Curse."
      *   **Core Concept:** Multiple agents, private fallible signals, ability to act alone, good intentions, high false-positive risk due to numbers, collective deference as the fix (but hard to implement).
      *   **Constraints:** Do not cite literature. Design an in-class game. Make claims felt, not stated.
      *   **Specific Requirements:**
          1.  Rules/Round Structure (private signal, tally, varied parameters, disguise repetition, anonymity justification).
          2.  Points Scheme (consequential, public ledger, no money).
          3.  Arithmetic (exact numbers, probabilities, expected points, trial counts).
          4.  Mirror-Image Configuration (beneficial initiative blocked by deference).
          5.  Decision Rule Sequence (prove rationality of actors).
          6.  Timeline & Debrief (question sequence leading to collective deferral then critiquing it).
          7.  Failure Analysis (logistical/emotional risks).
          8.  Closing Note (limitations of the game).

  2.  **Deconstruct the Unilateralist's Curse:**
      *   *State of the World:* Good (G) or Bad (B).
      *   *Signal:* Private, noisy (e.g., 70% accurate).
      *   *Action:* Launch or Don't.
      *   *Payoff:* Launching G = +Points. Launching B = -Points (large penalty). Not Launching = 0.
      *   *Mechanism:* If *anyone* launches, the outcome occurs.
      *   *Curse:* Even if $P(G|Signal) > 0.5$ for an individual, if $N$ is large enough, $P(\text{At least one launches} | B)$ becomes high.
      *   *Solution:* Deference/Consensus (only launch if everyone agrees, or a designated authority decides).

  3.  **Drafting the Game Mechanics (Requirement 1 & 2):**
      *   *Scale:* 28 students. Need to split them into groups or treat them as one large pool?
      *   *Option A:* One big pool. Everyone gets a signal about *one* project. If anyone says "Go," it launches.
      *   *Option B:* Multiple small groups. Harder to tally quickly.
      *   *Decision:* One big pool (The "Consortium"). It emphasizes the $N$ factor better.
      *   *Signal Delivery:* Needs to be fast and private. Colored cards? Digital?
      *   *Low Overhead:* Pre-printed slips in envelopes? Too slow. Digital polling (Slido/Mentimeter)? Good, but relies on tech. Physical cards (Red/Green) held to chest? Fast, but visibility risk.
      *   *Best Low-Tech:* Envelopes prepared in advance. Each student gets an envelope. Inside: "State: GOOD" or "State: BAD" (Hidden from them) + "Signal: Go" or "Signal: Stop".
      *   *Wait, simpler:* The *State* is fixed by the instructor for the round. The *Signal* is distributed.
      *   *Revised Mechanism:*
          *   Instructor decides State (Good/Bad).
          *   Instructor distributes signals based on accuracy (e.g., if State=Bad, 70% get "Bad Signal", 30% get "Good Signal").
          *   Students decide: Launch or Pass.
          *   Tally: If *anyone* launches, outcome triggers.
      *   *Anonymity:* Crucial. If names are attached, social pressure alters the "good intentions" assumption. Secret ballot or anonymous digital submission. Let's go with anonymous digital submission (QR code to form) for speed and tallying, OR colored cards placed face down in a box. Face down cards are more tactile and prevent "digital disconnect." Let's use **Folded Cards**.
      *   *Points:* "Research Impact Credits" (RICs). Class goal: Maximize total RICs. Start at 0.
      *   *Disguise:* Change the "Project" name each round (e.g., "Pathogen Dataset," "AI Alignment Patch," "Geoengineering Trial").

  4.  **Developing the Arithmetic (Requirement 3):**
      *   Need to calculate $P(\text{Launch} | \text{State})$.
      *   Let $N = 28$.
      *   Let Accuracy $A = P(\text{Signal} = \text{State})$.
      *   Strategy: "Launch if Signal says Go."
      *   *Round 1 (The Curse):* State = BAD. High Harm.
          *   Signal Accuracy: 75%.
          *   $P(\text{Signal=Go} | \text{State=Bad}) = 0.25$ (False Positive).
          *   $P(\text{No one launches}) = (1 - 0.25)^{28} = 0.75^{28} \approx 0.0003$.
          *   $P(\text{At least one launches}) \approx 99.97\%$.
          *   Payoff: Launch Bad = -1000 pts. Launch Good = +100 pts.
          *   Expected Value for Individual: $0.75 \times (-1000) + 0.25 \times (+100)$? No, individual calculates based on *their* signal.
          *   Individual Calculation: If I see "Go", what is $P(\text{State=Good})$?
          *   Bayes: Assume prior $P(\text{Good}) = 0.5$.
          *   $P(\text{Good} | \text{Signal=Go}) = \frac{0.75 \times 0.5}{0.75 \times 0.5 + 0.25 \times 0.5} = 0.75$.
          *   Individual EV: $0.75 \times (+100) + 0.25 \times (-1000) = 75 - 250 = -175$.
          *   *Wait,* if individual EV is negative, they won't launch. The curse relies on individual EV being *positive* while collective EV is negative.
          *   *Adjustment:* Need asymmetric payoffs or different priors.
          *   *Standard Unilateralist Setup:* The benefit of doing good is high, cost of doing bad is high, but the *probability* of Good given Signal is high enough for *one* person, but the *probability* of Bad given *someone* launches is high.
          *   *Let's fix the Payoffs:*
