      *   Then after, I ask "Who launched?"
      *   Then "Show me your rule."
      *   Then "Show me your signal."
      *   This proves they followed their rule and the rule was rational given the signal.
      *   *Correction:* To save time, have them write the rule on the same slip as the decision. "My Rule: ___ My Decision: ___".

  13. **Final Polish:**
      *   Ensure the tone is appropriate for grad students (serious, analytical).
      *   Make sure the "Emotional Exposure" mitigation is concrete.
      *   Check timing. 100 mins is tight for 3 rounds + debrief. Might need to cut to 2 rounds + debrief.
      *   *Decision:* 2 Active Rounds + 1 Hypothetical/Debrief Round.
      *   Round 1: Unilateralist Curse (N=28, Bad State).
      *   Round 2: Consensus Failure (N=28, Good State, Consensus Rule).
