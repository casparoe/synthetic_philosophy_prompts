answer: |-
  # Session Plan: The Unilateralist's Curse

  ## 1. Rules and Round Structure

  **The Setup**
  You are the "Oversight Board" for a high-stakes research consortium. There are 28 of you. In each round, a specific research initiative is proposed.
  *   **The State:** For each round, the initiative is objectively either **Beneficial (Good)** or **Hazardous (Bad)**. You do not know this.
  *   **The Signal:** Each of you receives a private envelope containing a card. The card says **GO** or **STOP**.
      *   The card is a *signal*, not the truth.
      *   The signal is **85% accurate**. (If the State is Good, 85% of cards say GO. If Bad, 85% say STOP).
  *   **The Decision:** You must individually decide to **LAUNCH** or **HOLD**.
  *   **The Outcome:** If *at least one person* votes LAUNCH, the initiative proceeds. If everyone votes HOLD, it stops.
  *   **Anonymity:** Votes are cast via folded slip into a central box. **Anonymity is mandatory.**
      *   *Justification:* If votes were public, social pressure would override private judgment. The "Curse" relies on independent agents acting on conscience without coordination. Anonymity preserves the independence of the signal.

  **The Rounds (Disguised)**
  Prepare three distinct sets of 28 envelopes. The physical envelopes are identical, but the "Briefing" projected on the screen changes to disguise the structural repetition.

  *   **Round 1: "The Open Pathogen Dataset"**
      *   *Framing:* A dataset that could accelerate vaccine development (Good) or enable bioweapon design (Bad).
      *   *Structure:* All 28 students are "Principal Investigators" (PIs). Any single PI can upload the data.
      *   *State:* **BAD** (Fixed by you).
      *   *Signal Distribution:* 24 cards say STOP, 4 cards say GO (approximate 85% accuracy).
  *   **Round 2: "The Decentralized Model Weights"**
      *   *Framing:* AI weights that could improve safety alignment (Good) or remove safeguards (Bad).
      *   *Structure:* Only **4 students** (pre-selected randomly upon entry) are "Deployers." The other 24 are "Advisors" (they get signals but cannot Launch; they can only advise, but the Deployers decide alone).
      *   *State:* **BAD** (Fixed by you).
      *   *Signal Distribution:* Among the 4 Deployers: 3 STOP, 1 GO (approximate 85% accuracy).
  *   **Round 3: "The Stratospheric Aerosol Trial"**
      *   *Framing:* Geoengineering to cool the climate (Good) or disrupt monsoons (Bad).
      *   *Structure:* All 28 are PIs. **New Rule:** The initiative launches *only if everyone agrees* (Consensus/Deference).
      *   *State:* **GOOD** (Fixed by you).
      *   *Signal Distribution:* 24 cards say GO, 4 cards say STOP (approximate 85% accuracy).

  **Tallying**
  Collect the box. While you count the "LAUNCH" slips, ask students to discuss their immediate gut reaction with a neighbor. Announce the result immediately.

  ## 2. Points Scheme

  **The Ethics Ledger**
  Draw a large thermometer on the whiteboard labeled "Collective Impact Score." Start at **0**.
  *   **Launch + Good State:** **+100 Points** (A breakthrough for humanity).
  *   **Launch + Bad State:** **-400 Points** (A catastrophe for humanity).
  *   **Hold (Any State):** **0 Points** (Status quo).

  **Consequence:**
  Announce that the final score determines the "Grade Multiplier" for the seminar participation component.
  *   Score > 0: 1.2x Multiplier.
  *   Score < 0: 0.8x Multiplier.
  *   *Note:* This is a bluff to create stakes without actual grade manipulation. It creates a "common good" motivation without career selfishness.

  ## 3. The Arithmetic

  Here are the exact parameters and expected outcomes.

  **Constants:**
  *   Signal Accuracy ($A$) = 0.85.
  *   Prior Probability of Good/Bad = 0.5 (Assumed by students).
  *   Payoff: Good = +100, Bad = -400.

  **Individual Rationality Check:**
  If a student sees a **GO** signal:
  *   $P(\text{State=Good} | \text{Signal=GO}) = 0.85$.
  *   $P(\text{State=Bad} | \text{Signal=GO}) = 0.15$.
  *   Expected Value (Individual) = $(0.85 \times 100) + (0.15 \times -400) = 85 - 60 = \mathbf{+25}$.
  *   *Conclusion:* A rational, benevolent agent *must* launch upon seeing a GO signal.

  **Round 1 (The Curse): N=28, State=BAD**
  *   Probability a specific agent gets a False Positive (GO signal on Bad State) = $1 - 0.85 = 0.15$.
  *   Probability *no one* launches = $(0.85)^{28} \approx 0.01$.
  *   Probability *at least one* launches = $1 - 0.01 = \mathbf{99\%}$.
  *   **Expected Class Score:** $0.99 \times (-400) + 0.01 \times (0) \approx \mathbf{-396}$.
  *   *Trials:* One trial is sufficient. The probability is so skewed that a "Hold" result would be a statistical anomaly (1 in 100), not noise.

  **Round 2 (N-Reduction): N=4, State=BAD**
  *   Probability a specific Deployer gets a False Positive = 0.15.
  *   Probability *no one* launches = $(0.85)^4 \approx 0.52$.
  *   Probability *at least one* launches = $1 - 0.52 = \mathbf{48\%}$.
  *   **Expected Class Score:** $0.48 \times (-400) + 0.52 \times (0) = \mathbf{-192}$.
  *   *Observation:* This round should feel significantly "safer" than Round 1. Roughly half the time the class survives.

  **Round 3 (The Mirror): N=28, State=GOOD, Consensus Rule**
  *   Rule: Launch only if ALL 28 vote LAUNCH.
  *   Probability a specific agent gets a False Negative (STOP signal on Good State) = 0.15.
  *   Probability *everyone* gets a GO signal = $(0.85)^{28} \approx 0.01$.
  *   Probability Initiative Launches = $\mathbf{1\%}$.
  *   **Expected Class Score:** $0.01 \times (100) + 0.99 \times (0) = \mathbf{+1}$.
  *   *Observation:* A beneficial project is almost certainly killed.

  ## 4. The Mirror-Image Configuration

  **Round 3** serves this purpose.
  *   **Failure Mode:** Instead of "Action when we should Stop" (Round 1), the failure is "Inaction when we should Go."
  *   **Mechanism:** The "repair" for the Unilateralist's Curse is collective deference (Consensus).
  *   **Lesson:** By requiring consensus to prevent false positives, you introduce a massive false negative rate. The cure for unilateralism is paralysis. This forces students to see that conformity buys safety but costs opportunity.

  ## 5. Decision Rule Sequence

  **Pre-Round Card:**
  Inside every envelope, include a small slip titled **"My Mandate."**
  Before opening the Signal card, they must write on the slip:
  *"I will LAUNCH if my signal says: ______"*
  (Most will write "GO".)

  **Post-Round Reveal:**
  1.  Ask: "Who voted LAUNCH?" (Show of hands).
  2.  Ask: "Who saw a GO signal?" (Show of hands).
  3.  Ask: "Who voted LAUNCH *despite* seeing a STOP signal?" (Likely no one).
  4.  Ask: "Who saw a GO signal but voted HOLD?" (Likely no one).
  5.  **The Trap:** Collect the "My Mandate" slips. Project a few on the screen.
  6.  **The Point:** "Look at these rules. 'If I see GO, I launch.' Given the payoffs and the accuracy, this is the *morally correct* rule for an individual. You did not fail. Your reasoning was sound. The failure was in the *structure* that allowed one sound judgment to override twenty-seven sound judgments."

  ## 6. Timeline and Debrief

  **Timeline (100 Minutes)**
  *   **00-10:** Intro & Ledger Setup. Explain the "Grade Multiplier" stakes.
  *   **10-25:** Round 1 (Open Pathogen). Distribution, Decision, Tally, Reveal (Score ~ -400).
  *   **25-40:** Round 2 (AI Weights). Select 4 Deployers. Distribution, Decision, Tally, Reveal (Score ~ -200 or 0).
  *   **40-55:** Round 3 (Geoengineering). Consensus Rule. Distribution, Decision, Tally, Reveal (Score ~ 0).
  *   **55-100:** Debrief.

  **Debrief Question Sequence**
  1.  **The Feeling:** "Round 1: How did it feel to see the score drop? Who felt responsible?"
  2.  **The Rationality:** "Show of hands: Did anyone act against their own signal? No? Then everyone was rational. How do we get a catastrophic result from 28 rational people?"
  3.  **The Variable:** "Compare Round 1 and Round 2. What changed? (Number of launchers). Did the risk drop? (Yes). Why?"
  4.  **The Repair:** "In Round 3, we tried to fix the risk by requiring Consensus. What happened to the Good project? (It died). What does this tell us about 'Deferring to the Group'?"
  5.  **The Critique:** "If we can't act alone (Round 1) and we can't require consensus (Round 3), what is left? Who gets to decide? If we appoint a 'Decider,' what happens to the minority who saw a GO signal on a Bad project? Are they silenced?"
  6.  **The Reality:** "In your fields, who has the power to stop a publication? Is it one person? A committee? An algorithm? Where does the 'Unilateralist's Curse' live in your actual labs?"

  ## 7. Honest Failure Analysis

  **Risk 1: Nobody Launches in Round 1.**
  *   *Cause:* Students suspect a trick and vote "Hold" strategically.
  *   *Mitigation:* Emphasize the "Grade Multiplier." To get points, they *must* launch Good projects. Hoarding "Hold" votes guarantees a score of 0, which fails the "Common Good" mission.
  *   *Recovery:* If this happens, acknowledge it. "You coordinated without talking. That is the *solution* to the curse. How did you do it? (Suspicion). Can you rely on suspicion in real life?"

  **Risk 2: A Student Reverse-Engineers the Design.**
  *   *Cause:* A CS student notices the envelope distribution or calculates the EV mid-game.
  *   *Mitigation:* If they speak up, say: "You've spotted the mechanics. Sit on the secret until the debrief. The rest of the class needs to feel the pressure."
  *   *Recovery:* In debrief, hand the mic to that student. "You saw the matrix. Why didn't you convince the others? (Because you couldn't share the info). That is the Curse."

  **Risk 3: The Accusation of Stacked Deck.**
  *   *Cause:* "You made the State Bad on purpose."
  *   *Response:* "Yes. I fixed the State to test the System. In the real world, Nature fixes the State. We don't get to choose whether the pathogen is dangerous. We only choose whether to publish."

  **Risk 4: Emotional Exposure (The "Guilty" Launcher).**
  *   *Cause:* A student voted Launch in Round 1, causing the -400 penalty. They look ashamed.
  *   *Defuse:* **Do not ask them to justify themselves publicly.**
  *   *Script:* "I want to speak to the people who voted Launch in Round 1. You followed your private information. You acted to maximize the common good based on what you knew. If you had voted Hold, and the State was Good, you would have robbed the class of points. You were in a double-bind. The system punished you for being competent. Please do not carry guilt for a game designed to trap competence."

  ## 8. Closing Note: What the Game Cannot Reproduce

  **The Limitation:**
  "In this game, I am God. I fixed the Accuracy (85%) and I fixed the State (Good/Bad). In your research, **no one knows the accuracy of their judgment.** You don't know if your safety protocol is 85% effective or 10%. Furthermore, the 'State' is not fixed by nature; it is constituted by *values*. Is releasing this model 'Good'? A policy student might say Yes, a safety student might say No. The Unilateralist's Curse is worst when we disagree on the *definition* of Harm, not just the probability."

  **The Argument You Must Supply:**
  "Because we cannot know the accuracy, and because we disagree on values, we cannot rely on individual rationality. We need **procedural legitimacy**. We need to agree on *who decides* before we know *what the signal is*. That is the work of ethics committees, export controls, and moratoria. They are not there to be smarter than you; they are there to reduce $N$."
