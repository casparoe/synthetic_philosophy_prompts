answer: |-
  Your work in the nursing home is a form of oral history that aligns precisely with the intuition Plutarch articulates here. You have discovered empirically what he argues theoretically: that the rehearsed narrative of a life often obscures the person, while the unguarded fragment reveals them. Below I work through the passage as requested, separating the literal text from the necessary reconstruction, before addressing your six questions.

  ### Move-by-Move Analysis of the Alexander Passage

  **Sentence 1:** *"It being my purpose to write the lives of Alexander the king, and of Cæsar, by whom Pompey was destroyed, the multitude of their great actions affords so large a field that I were to blame if I should not by way of apology forewarn my reader that I have chosen rather to epitomize the most celebrated parts of their story, than to insist at large on every particular circumstance of it."*

  *   **What it says:** Plutarch states he is writing about Alexander and Caesar. Because they did so many famous things, he would be at fault if he did not warn the reader that he is summarizing the famous events rather than detailing every circumstance.
  *   **What must be reconstructed:** This is rhetorical management. He anticipates the reader's objection: "Why did you leave out that battle?" or "Why is this campaign so short?" He frames the omission not as a failure of research, but as a deliberate choice necessitated by the "multitude" of actions. He is securing permission to be selective before he begins.

  **Sentence 2:** *"It must be borne in mind that my design is not to write histories, but lives."*

  *   **What it says:** There is a distinction between "history" and "lives."
  *   **What must be reconstructed:** This is the core definitional claim. "History" (*historia*) implies a chronicle of public events, politics, and wars, judged by accuracy and completeness. "Lives" (*bioi*) implies a moral portrait, judged by insight into character. He is changing the genre rules. He is not accountable for the completeness required of a historian, only for the truthfulness required of a biographer.

  **Sentence 3:** *"And the most glorious exploits do not always furnish us with the clearest discoveries of virtue or vice in men; sometimes a matter of less moment, an expression or a jest, informs us better of their characters and inclinations, than the most famous sieges, the greatest armaments, or the bloodiest battles whatsoever."*

  *   **What it says:** Big deeds do not always show virtue or vice clearly. Small things (jests, expressions) often show character better than battles.
  *   **What must be reconstructed:** This justifies Sentence 2. The assumption here is that public actions are often ambiguous—a victory might be luck, a defeat might be bad weather. Private moments are less subject to external manipulation. He is arguing that moral truth is not proportional to the scale of the event.

  **Sentence 4:** *"Therefore as portrait-painters are more exact in the lines and features of the face, in which the character is seen, than in the other parts of the body, so I must be allowed to give my more particular attention to the marks and indications of the souls of men, and while I endeavor by these to portray their lives, may be free to leave more weighty matters and great battles to be treated of by others."*

  *   **What it says:** Painters focus on the face to show likeness. I will focus on "marks of the soul" to show lives. I will leave battles to others.
  *   **What must be reconstructed:** This relies on an ancient understanding of physiognomy. The face was not just *where* we look; it was believed to be the literal map of the inner self. The Greek phrase behind "marks and indications of the souls" is *sêmeia kai endeixeis tēs psychēs*. *Sêmeia* means signs or markers. He is arguing that just as a body can be generic but a face is specific, a battle record can be generic (many men win battles) but a jest is specific (only this man makes this joke). The "therefore" claims that because character is the goal, and small things reveal character, omitting big things is methodologically sound, not just practically necessary.

  ***

  ### Responses to Your Questions

  **1. The Force of "Not Histories, But Lives"**
  You ask if this marks a difference in subject matter, completeness, or truth. It is primarily a difference in **aim**, which dictates the subject matter. History aims to record *what happened* (public events); Lives aims to record *who someone was* (moral character). Regarding your second point: it is both an apology and management. It is an apology because he admits he is leaving things out (a fault in history). It is management because he redefines the project so that the omission becomes a virtue. He is telling you: "Do not judge me by the rules of the genre you expect; judge me by the rules of the genre I am writing."

  **2. The Painter Analogy**
  Your objection is sharp: painters do not omit shoulders, they just render them less exactly. However, your objection misfires slightly because of the ancient context. In Plutarch's view, the likeness *resides* in the face. The body provides context (stance, clothing), but the identity is in the features. Plutarch is not saying battles are irrelevant; he is saying they are the "body." They provide the context of the life, but the "likeness" (the moral character) is in the "face" (the anecdotes). He is arguing for a hierarchy of evidence, not total omission. You are right that he abridges rather than deletes, but his analogy claims the abridgement is justified because the "weighty matters" do not carry the likeness.

  **3. The Evidence of "An Expression or a Jest"**
  You ask how a small thing can out-reveal a battle. For Plutarch, a battle is often a collective effort or subject to fortune (*tyche*). A jest is individual and spontaneous. The inference runs like this: Public deeds are performed for an audience and can be masked; private expressions are often unguarded. Regarding your worry about performance vs. accident: Plutarch assumes character is a settled disposition (*hexis*). A jest is valuable because it is a crack in the performance. It is not that the jest is never a performance, but that it is harder to script a lifetime of small gestures than to script a public speech. He requires the biographer to collect many such signs to triangulate the truth, much as you listen for repeated phrases in your recordings.

  **4. The Two Prefaces (Alexander vs. Caesar/Aemilius)**
  The tension you feel is real but not a contradiction. The *Alexander* preface says great deeds are *unreliable* indicators of virtue (a king can win a battle by luck). The *Caesar* (actually *Aemilius Paulus*) preface says virtuous deeds *are* useful for imitation. The synthesis is this: Not all great deeds are virtuous, and not all virtue is in great deeds. Plutarch's job is to sort them. The "trifles" are not the *only* reliable joint, but they are the most *consistently* reliable joint because they are less susceptible to the distortions of power and luck. The biographer's job is to find where the deed and the agent align. When a battle reveals courage despite odds, it is useful. When it reveals only luck, it is noise. The jest is usually pure signal.

  **5. The Anecdote Filter**
  This is a modern historiographical worry (source criticism) that Plutarch does not share in the same way. You are correct that anecdotes are shaped by the people who keep them. However, Plutarch is not writing forensic history; he is writing moral philosophy using historical figures. If a story survives because a household thought it important, that survival is itself data about the man's reputation. Plutarch often compares conflicting accounts ("Some say X, others say Y"). His resource against the filter is multiplicity of sources. He assumes that if a story persists across different tellers, it contains a truth about the character, even if the factual details are blurred. You face the same thing: the family keeps the tape of the joke, not the tape of the silent Tuesday. But for your purpose (knowing the person), the kept tape is the truth you need. Plutarch would agree: the memory of the man is part of the man.

  **6. Plutarch vs. Christian Saints**
  You have identified a structural difference in **purpose**. In hagiography (saints' lives), the subject is an icon. The saying is handed over to be copied because the saint is a perfected model of divine virtue. The complexity is removed to make imitation possible. In Plutarch, the subject is a human being to be **judged**. The saying is a clue to be weighed. Plutarch wants you to understand Alexander, not necessarily to *be* Alexander. He presents virtues and vices so you can distinguish them. The saint's life says "Do this." Plutarch's life says "See this." The structural difference is between **exemplar** (copy this) and **portrait** (know this). Your work is closer to Plutarch: you are preserving the person, not creating a model for your families to imitate.

  ***

  ### Greek Terms and Discreditable Stories

  You asked about the Greek behind "marks and indications of the souls." The word for marks is *sêmeia* (signs/token). The word for soul is *psychē*. In this context, *psychē* does not mean a ghostly spirit, but the moral mind or character. When Plutarch says he looks for *sêmeia* of the *psychē*, he means he is looking for external signs that point to an internal moral state. This supports your intuition: the "rule about not wasting string" is a *sêmeion* of the resident's *psychē*.

  You also recalled Plutarch saying he would not repeat discreditable stories when he need not. You have not misremembered. In the *Life of Cimon*, Plutarch writes that he believes he is writing lives, not histories, and that he does not feel compelled to dwell on faults unless they are essential to understanding the character. He says he will "gladly pass over" shameful details that do not serve the moral portrait. This does not contradict his method of using scraps and jests. It means he will not slander a subject gratuitously. If a jest reveals a flaw necessary to understand the man, he includes it. If a scandal is just gossip that adds no moral insight, he omits it. This aligns with your work: you do not record every complaint a resident makes, only those that reveal who they are.

  ### Conclusion

  Your puzzle is solved by recognizing that Plutarch is not claiming small things are historically more important than battles. He is claiming they are **biographically** more dense. A battle tells you what an army did; a jest tells you what a mind is like. Your objection about the painter is fair in a modern context, but Plutarch relies on an ancient belief that the face (and the small gesture) literally houses the identity. Your worry about the "anecdote filter" is valid, but Plutarch would argue that the filtered memory is the only access we have to the moral reputation of the dead, which is his true subject.

  You are doing Plutarch's work without the Greek. You have noticed that the "history" of a life (the dates, the moves, the jobs) is flat, while the "life" of a life (the jokes, the rules, the tones) is vivid. Plutarch gives you the vocabulary to defend that choice. You are not leaving out the battles because you are lazy; you are leaving them out because they are the body, and you are painting the face.
