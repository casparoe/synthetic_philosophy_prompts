answer: |-
  Okay, I'm settling in. I'm putting on my Hofstadter hat, but I'm keeping my feet on the ground of actual type design. I can feel the heat coming off this argument. Three hours with a type designer is like three hours with a theologian, except the theologian admits their dogma is faith-based. Your friend is operating on a **Formalist** ontology (the shape *is* the thing), and you are operating on a **Functionalist** ontology (the role *makes* the thing).

  Here is the thrashing. I'm going to talk this out before I carve the tablets.

  ### The Thrashing Phase

  My first instinct is to side with you on the Cyrillic 'а' (Case 4). It feels intuitively correct that a letter is defined by the script it inhabits. A red octagon is a "Stop" sign in the US and a "Yield" sign in some other context (hypothetically). Same shape, different semantic load. If your friend says they are the *same letter*, he's confusing **glyph** (the visual form) with **grapheme** (the functional unit).

  But then I hit Case 10 ('@'). You say it's not an 'a'. He says it looks more like an 'a' than the Futura 'a' looks like the Book 'a'. Visually, he's right. The '@' is historically a ligatured 'a' (ad commercialis). If history and shape both point to 'a'-ness, why isn't it an 'a'? Because it lost its **combinatorial role**. It doesn't combine with 'c' and 't' to make "cat." It stands alone. So, role matters more than shape.

  But then Case 6 wrecks me. The filled-in counter. You say it's objectively not an 'a'. If role matters, and I train a generation of kids to read the filled blob as 'a', it becomes an 'a'. So "objectively" is doing a lot of heavy lifting there. You want Case 6 to be a fact about the *glyph*, not the reader. That implies there are topological constraints that no amount of convention can override. Is that true? If I fill the counter of an 'o', it becomes a dot. Is a dot a letter? In Braille, yes. In Latin script, no.

  So we are trapped between **Topology** (the physical limits of the shape), **System** (the contrastive relationships with other letters), and **Convention** (the script history).

  If I prioritize Topology, I lose Case 2 (single vs. double storey). They are topologically distinct.
  If I prioritize System, I lose Case 4 (Cyrillic vs. Latin). They function identically in their respective systems.
  If I prioritize Convention, I lose Case 11 (the kid's drawing). The kid doesn't know convention, yet produces an 'a'.

  Okay, I need to stop circling. The solution has to be hierarchical. A letter is a **functional unit within a specific generative system**. The shape is just the physical realization of that unit, constrained by topology but defined by contrast.

  Here is my commitment.

  ***

  ### The Principle: The Systemic-Topological-Contextual (STC) Account

  A glyph $G$ is an instance of letter $L$ in script $S$ if and only if it satisfies the following three clauses:

  **Clause 1: Topological Integrity (The "Blob" Constraint)**
  $G$ must preserve the critical topological features that distinguish $L$ from its nearest neighbors in $S$ (e.g., openness of counters, number of strokes, connectivity).
  *   *Motivating Case:* **#6** (Filled counter). If you fill the counter, you destroy the topological distinction between 'a' and 'o' or 'a' and a blob. It fails the integrity check.
  *   *Motivating Case:* **#5** (Tiny gap). The topological feature (open/closed) is ambiguous but recoverable. It passes because the *intent* of the topology is legible.

  **Clause 2: Systemic Contrast (The "Neighbor" Constraint)**
  $G$ must occupy a unique position in the contrast space of $S$. It must be distinguishable from all other letters in $S$ under normal reading conditions, and its transformations (scaling, slight distortion) must not map it onto another letter in $S$.
  *   *Motivating Case:* **#8** (Upside down). An upside-down 'a' does not map to any other letter in the Latin set. It falls out of the system. An upside-down 'n' maps to 'u', so it *becomes* a 'u' because it now occupies the 'u' slot in the contrast space.
  *   *Motivating Case:* **#2** (Single vs. Double storey). Both occupy the same contrast slot relative to 'b', 'c', 'd', etc. They are allophones of the same grapheme.
  *   *Motivating Case:* **#7** (Stretching). Scaling does not change contrastive relationships.

  **Clause 3: Script Allegiance (The "Code" Constraint)**
  $G$ must be intended and interpreted within the coding system of $S$. Identity is relative to the active script.
  *   *Motivating Case:* **#4** (Cyrillic 'а'). Visually identical to Latin 'a', passes Topology. Functionally identical in Russian, passes Systemic Contrast *within Russian*. But it fails Script Allegiance for Latin. It is a **homograph**, not the same letter.
  *   *Motivating Case:* **#10** ('@'). Passes Topology (roughly). Fails Systemic Contrast (it has no slot in the 26-letter combinatorial set). Fails Script Allegiance (it is a symbol/logogram, not a grapheme in the alphabet).
  *   *Motivating Case:* **#3** (Uppercase 'A'). Different topology, but same Script Allegiance and same Systemic Contrast slot (it pairs with lowercase 'a').

  ***

  ### Addressing Your Specific Worries

  **1. The "Reader" Problem (Case 6 & 4)**
  You worried that making it about "competent readers" makes letterhood subjective. My Clause 1 (Topology) saves you there. A filled counter is objectively topologically distinct from an open counter. It's not about what the reader *feels*; it's about the geometric facts of the glyph relative to the geometric requirements of the script. However, Clause 3 admits that "Script" is a social fact. So, yes, letterhood is partly social. You cannot have a private letter. If you invent a shape no one else recognizes, it's not a letter yet; it's a doodle.

  **2. The Friend's Case 4 vs. Your Case 10**
  Your friend is wrong about #4. He is conflating **Glyph Identity** (the drawing) with **Grapheme Identity** (the linguistic unit).
  *   *Analogy:* The sound "bat" (animal) and "bat" (sports) are homophones. Are they the same word? Linguistically, no. They have different entries in the mental lexicon.
  *   *Application:* Latin 'a' and Cyrillic 'а' are homographs. They are different letters that happen to wear the same suit.
  *   *Why '@' is not 'a':* '@' fails Clause 2. It doesn't contrast within the alphabet. It's a soloist. 'a' is a chorus member. Even if '@' looks like 'a', it doesn't play the game of spelling.

  **3. The Graft Test (Case 12)**
  Does it do work 1-11 can't? **Yes.**
  Cases 1-11 test **Recognition** (Passive). Case 12 tests **Competence** (Active/Generative).
  In cognitive science terms, 1-11 ask: "Can you classify this stimulus?" Case 12 asks: "Have you inferred the underlying generative grammar of this style?"
  You can recognize an 'a' in a style you don't understand (e.g., you know it's an 'a' but you couldn't draw an 'o' in that style). The Graft Test proves you have captured the **Spirit** (the rules), not just the **Letter** (the instance). It validates that the style is consistent enough to *have* letters. If you can't graft the 'o', the style is incoherent, and the 'a' you saw earlier was just a drawing, not part of a typeface.

  ***

  ### The Cost: What You Have to Give Up

  I have to be honest. To make this principle hold, you have to soften your stance on **Case 6**.
  You said: *"I want #6 to be a fact about the glyph."*
  My principle says: #6 is a fact about the glyph **relative to the script's topological rules**.
  If a designer creates a new script where 'a' is defined as a filled blob with a stem, and the community adopts it, it *becomes* an 'a'. There is no Platonic 'a' in the sky. The "objectivity" you want is real, but it is *system-relative*, not *universe-relative*.
  **Cost:** You must admit that if the Convention (Clause 3) shifts far enough, the Topology (Clause 1) requirements can shift with it. You can't claim the filled blob is *eternally* not an 'a'. You can only claim it isn't an 'a' *in Latin Script as currently constituted*.

  Also, you might have to concede a tiny bit on **Case 4**. If a Latin reader sees a Cyrillic 'а' in a Latin text (e.g., a designer using it stylistically), it *functions* as a Latin 'a'. Its identity is fluid based on context. It's not that it *is* a Latin 'a', but that it is *standing in* for one. Your friend isn't totally crazy; he's just ignoring the context clause.

  ***

  ### Three New Test Cases

  Here is how the STC Account handles fresh hell:

  **Test 1: The Mirror-Reversed 'a'**
  *   *Scenario:* A glyph that is a perfect horizontal mirror image of a standard 'a'.
  *   *Verdict:* **Not an 'a' (in standard Latin).**
  *   *Reasoning:* Fails Clause 2 (Systemic Contrast). In our script, directionality is a distinctive feature (b vs. d, p vs. q). A mirrored 'a' conflicts with the directional logic of the system.
  *   *Exception:* If the Script Allegiance (Clause 3) changes (e.g., we are reading a text meant for a mirror, or a specific cipher system), it becomes an 'a'. This proves identity is context-bound.

  **Test 2: The Unicase Script (e.g., a custom alphabet with no caps)**
  *   *Scenario:* A designed alphabet where there is no uppercase/lowercase distinction, only one form per letter.
  *   *Verdict:* **Letterhood relies entirely on Clause 2.**
  *   *Reasoning:* Without Case (Clause 3 variation), the burden falls on Systemic Contrast. If the 'a' looks too much like the 'o', it fails. This highlights that "Uppercase A" (Case 3) is actually a *different glyph* serving the *same grapheme role*. In a unicase script, that duality collapses. The principle holds: it's about the slot in the system, not the shape.

  **Test 3: The Style Abandonment (The "Schizophrenic" Font)**
  *   *Scenario:* A font where 'a' through 'm' are in a strict geometric style (Futura-like), and 'n' through 'z' are in a humanist script style (Garamond-like), but the designer claims it's one alphabet.
  *   *Verdict:* **Fails the Graft Test (Case 12).**
  *   *Reasoning:* While 'a' is still an 'a' (Clause 1 & 3 pass), the *Typeface* identity fails. This tests the boundary of "Style" vs. "Letter." The letters exist, but the *Spirit* is broken. This confirms your intuition on #12: you can have valid letters without a valid style, but you cannot have a valid *type design* without the graft capability. The Graft Test is about the *family*, not the *individual*.

  ***

  ### Final Settlement

  **On Case 4 (Cyrillic):** You win. It is not the letter 'a'. It is a homograph. Your friend is confusing the vehicle for the cargo. Tell him: "If I hand you a Ruble, is it a Dollar because they are both round pieces of metal with numbers on them? No. It's currency in a different economy."

  **On Case 10 ('@'):** You win, but for a specific reason. It's not a letter because it doesn't combine. It's a logogram. It's the difference between a brick (letter) and a statue (symbol). You can build a wall with bricks. You can't build a wall with statues.

  **On Case 12 (Graft Test):** It is **not** redundant. 1-11 test *perception*. 12 tests *conception*. You can perceive an 'a' without understanding the rules that generated it. The Graft Test proves you understand the *rules*. In Hofstadter's terms, it proves you have the "flexible fluidity" of the concept, not just a rigid template.

  **The Ugly Truth:**
  You asked if the disjunction (Shape governs within script, History governs across scripts) is ugly.
  It is not ugly. It is **necessary**.
  Letters are not natural kinds (like "Gold" or "Water"). They are **institutional facts** (like "Money" or "Marriage").
  A piece of paper is money only if the institution says so.
  A shape is a letter only if the Script says so.
  Your friend wants letters to be natural kinds (Platonic shapes). You know they are institutional facts.
  The "ugliness" you feel is the friction between the physical reality (the ink) and the social reality (the code). Don't smooth it over. That friction *is* typography.

  Go tell him the Ruble argument. Then buy him a drink. Three hours is enough.
