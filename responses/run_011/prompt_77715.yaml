answer: |-
  To attribute a bias is to identify a systematic deviation from a standard. In perceptual or statistical contexts, the standard is supplied uncontroversially: the physical world or the axioms of probability. In moral psychology, however, the standard is contested. To label the distinction between doing and allowing a "bias" is to assume a baseline against which this judgment counts as an error. Three candidate baselines are available. First, a coherence baseline measures judgments against the subject's own considered principles; a judgment is biased if it contradicts the agent's reflective equilibrium. Second, a substantive baseline measures judgments against correct moral truth; a judgment is biased if it is morally false. Third, an outcome baseline measures judgments against value promotion; a judgment is biased if it fails to maximize the good. Each baseline performs normative work that the word "bias" quietly borrows. Choosing among them cannot be done on the basis of data about how people judge, because data describes frequencies, while baselines prescribe norms. Empirical observation can tell us that people distinguish doing from allowing, but it cannot tell us whether they ought to.

  Consequently, the disagreement between the psychologist and the ethicist is not empirical, yet it is not merely verbal. Both parties observe the same behavioral pattern: agents judge harmful actions more severely than harmful omissions. The conflict arises because the description of the phenomenon already encodes one of the baselines. By labeling the pattern "omission bias," the psychologist adopts the substantive baseline of equivalence, treating the null hypothesis as the moral truth that doing and allowing are identical in significance. The ethicist, conversely, adopts a substantive baseline of distinction, treating the pattern as a moral insight. Because the label "bias" presupposes the falsity of the distinction, the dispute is not about what people do, but about which normative baseline governs the interpretation of what they do. The term "bias" functions not as a neutral descriptor of cognitive machinery, but as a carrier of normative commitment.

  Consider the proposal to strip cases of real-world context to distinguish preference from bias. This procedure begs the question in both directions. If the effect survives bracketing, it is deemed a preference; if it disappears, it is deemed a bias generated by noise. However, bracketing can manufacture an apparent preference out of a bias by removing the very contextual cues that trigger corrective moral reasoning. Conversely, it can dissolve a genuine moral consideration by removing exactly the features that give it weight. The distinction between doing and allowing often relies on contextual features like agency, responsibility, and causal proximity. If these are stripped away as "noise" to create a bare hypothetical, the procedure assumes beforehand that these features are morally irrelevant. Thus, the test presupposes the conclusion: it defines signal and noise based on the very normative theory it claims to test.

  To anchor this, consider the disaster-relief case. Subjects either maintain an incumbent allocation or select a new one, though the numerical distributions are identical. One reading is that the divergence exposes a framing artifact: status quo bias or loss aversion causes irrational inertia. On this view, the second condition reveals the true preference, and the first condition obscures it with psychological noise. The competing reading is that the first condition preserves something the second deletes: the moral weight of existing entitlements and legitimate expectations. On this view, overturning an established allocation violates stability-based duties that do not apply to selecting among new proposals. The result itself cannot arbitrate between these readings because the physical outcome is identical while the moral description differs. The data shows a divergence in choice, but only a normative baseline can determine whether that divergence represents a failure of rationality or a sensitivity to moral context.

  What survives of the concept of moral bias once the baseline problem is granted? There is a formulation weaker than a commitment to substantive moral truth yet stronger than the empty claim that a judgment differs from mine: reflective instability. A judgment might be termed biased if it vanishes under calm reflection or contradicts the agent's own stated principles. This relies on the coherence baseline rather than substantive truth. However, even this has limits. In the doing/allowing case, agents often reflectively endorse the distinction; it is not a slip of performance but a stable feature of their moral competence. Therefore, for robust moral intuitions, the concept of bias collapses into normative disagreement. To call the doing/allowing distinction a bias is not to make a scientific finding about cognitive defects, but to assert a normative claim that the distinction is unjustified. The concept in the debiasing literature was thus doing double duty: purporting to offer a scientific diagnosis while actually advancing a substantive ethical theory. Recognizing the baseline problem forces us to admit that identifying a moral bias is not a matter of correcting a distortion to reveal the world, but of arguing for a specific vision of what the moral world requires.
