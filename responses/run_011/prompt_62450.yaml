      *   *Analysis:* Kant is a deontologist (duty-based ethics), but *Perpetual Peace* is also a political treatise. He often weaves pragmatic (prudential) arguments with moral ones.
      *   *Verdict:* It's not *either/or*. The strategic arguments (1, 2, 3) explain *why* it happens and why it's politically unstable. The moral argument (4) explains *why it is unjust* regardless of consequences. However, in the context of *policy* (like the "standing compute" treaty), the strategic stability arguments are usually the hook, while the moral argument provides the normative weight.
