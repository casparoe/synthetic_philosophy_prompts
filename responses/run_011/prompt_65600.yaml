      *   **Detailed Breakdown of Exits:**
          1.  **The "Capacity" Objection (Modifying Premise 2):** Sentience isn't a switch. It's a dimmer. A nematode might have $10^{-4}$ probability of being sentient, but also $10^{-4}$ capacity for suffering compared to a fish. The product becomes negligible.
          2.  **The "Tractability" Objection (The Hidden Premise):** You can't just multiply population. You must multiply by $P(\text{your money helps})$. We have no idea how to help nematodes. Funding research might be okay, but shifting the *whole* budget is wasteful.
