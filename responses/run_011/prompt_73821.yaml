      *   **Refining (2) vs (6):** Recombination + Counterparts handles Origin Essentialism. But if the user thinks Recombination creates *me* with different parents, that violates (6). I need to ensure they know they need Counterpart Theory (CT) to make this work. Lewis uses CT. Does the user? (1) and (4) imply CT usually. I will assume CT but warn them.

