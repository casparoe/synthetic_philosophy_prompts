prompt: |-
  Help me stress-test something before I circulate it. I've been drafting a short position statement for an agricultural ethics workshop and my coauthor thinks the package is internally incoherent, but she won't say where, so I want a proper audit. Act as a moral philosopher who works on population ethics and invertebrate welfare and who has actually read the agronomy side too. Here's roughly where I've landed:

  (1) Whether insects are sentient is genuinely unsettled. I put maybe 10–15% on it. I don't think that credence can be waved away as unmeasurable hand-waving, but I also don't think anyone knows.

  (2) Moral weight scales with the number of beings affected. Given how many invertebrates agriculture moves around and kills, a small probability times an enormous number can dominate everything else on the priority list — so invertebrate welfare belongs near the top of the ordering, not at the bottom where people usually park it.

  (3) The crop deaths / "field animals die too" argument doesn't show that a plant-based diet is worse for animals. Per calorie, pasture and ruminant systems kill at least as many invertebrates as row crops do, so the diet conclusion doesn't reverse.

  (4) On policy I'm an incrementalist: integrated pest management, spray only when you cross an economic threshhold, no abolition of insecticides. Separately, I'd back a global phase-out of neonics.

  (5) Agri-environment schemes that boost insect abundance — flower margins, hedgerows, cover crops — are net harmful to invertebrates. More insects means more of them exposed to starvation, parasitism, predation and drift. Conservation entomology and invertebrate welfare are pulling in opposite directions and nobody has noticed.

  (6) I don't think large invertebrate-welfare programs should get funded yet. Its premature; I'd rather wait until there are better markers for nociception and behavioral integration before anyone spends serious money.

  Go through these and tell me which ones actually pull against each other and which only look like they do. Rank the tensions by severity instead of listing them flat, and for each real one say what would have to give and what the cheapest revision is that keeps the rest of the set standing. If any commitment is resting on a premise I haven't stated, name it and show what follows once you plug it in. Then tell me which single change would clean up the most damage overall, and what it costs me to make it.

  Think this through carefully before you answer, but don't show me the working: lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restating my list back at me. American English, please.
