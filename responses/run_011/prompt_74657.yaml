answer: |-
  Putnam's multiple realisability argument is widely treated as the funeral bell for type-identity theory and the coronation of functionalism. This is a mistake. The argument does not vindicate functionalism as a substantive rival theory; it exposes functionalism as a methodological stance wearing a theory's clothes. To see this, we must stop talking about Martians and start talking about a tidal barrage.

  Consider the estuary system we discussed last term: tide gauges, clerks passing dockets, levers, and a phone tree. It accreted over 140 years of accident reports and fudges. It possesses stable internal states—piles of dockets, roster configurations, chalkboard marks—that correlate with inputs and determine outputs. A marine engineer predicts the barrage's behaviour across a season by attributing to it a standing expectation that the north channel silts up and a preference for keeping the marina deep. This works. It predicts better than writing down the mechanics of the levers. Yet, the clerks are bored and illiterate about tides. The system realizes 'beliefs' without a believing brain.

  Multiple realisability tells us mental kinds cannot be type-identical to neural kinds because the same functional role can be played by neurons, silicon, or clerks. But look closely at the barrage. Why do we identify the 'belief state' with the configuration of dockets rather than the chemical composition of the paper? Because the docket configuration is what matters for *prediction*. The decomposition of the system into states, inputs, and outputs is not fixed by the system itself; it is fixed by what we care about predicting. The functional organization exists only relative to an observer's interests. The paper has intrinsic chemical properties, but we ignore them because they are irrelevant to the tidal model. Similarly, neurons have intrinsic electrochemical properties, but functionalism ignores them.

  If multiple realisability rests on this interest-relative decomposition, then functionalism cannot be a substantive thesis about the intrinsic nature of mind. A substantive theory claims to describe how the world is independently of us. But if the functional states that constitute the mind are only visible when we carve the system up according to our predictive needs, then functionalism is a claim about *our* descriptive practices, not the system's ontology. It says: 'If you want to predict this system, treat it as having beliefs.' It does not say: 'This system contains belief-entities.' The barrage shows that 'functional organization' is not a natural kind waiting to be discovered; it is a projection of utility. Multiple realisability is the giveaway: if the same mental state can be realised by anything, then the 'state' is not in the stuff, but in the description we impose upon the stuff.

  The standard objection is that functionalism can be false. Ned Block's China Case suggests a system could satisfy the functional specification—perhaps via a giant lookup table or a population of people signalling with radios—and yet lack mentality. If functionalism were merely methodological, this wouldn't matter; if the stance works, the mind is there. But if functionalism claims to be a substantive theory of what mind *is*, the China Case is a counterexample: functional equivalence without consciousness. To survive this, we must concede that functionalism does not solve the hard problem of consciousness. My thesis requires admitting that functionalism is not a theory of *qualia* or intrinsic experience. It is a theory of *attribution*. The China Case shows that functional equivalence might not guarantee inner feeling. But it does not show that functionalism fails as an account of how we identify mental predicates. The barrage has no inner feeling, yet the engineer's attributions are valid for prediction. Similarly, functionalism validates psychological attribution without guaranteeing metaphysical substance. The objection only kills functionalism if we demand it do more than it claims.

  A second objection is that the barrage is simply too simple. Functionalism requires sufficient internal richness; the clerks are just shuffling paper. There must be a threshold of complexity before we grant mentality. But where is this threshold? If we set it at 'human-like complexity', we smuggle substrate chauvinism back in. We are effectively saying 'neurons are special' while pretending we are talking about organization. If we set it at 'predictive utility', the barrage qualifies, and the threshold dissolves into 'we count the systems we like'. This arbitrariness supports my thesis. If the threshold for being a mental system cannot be stated non-arbitrarily, then 'being a mental system' is not a natural kind. It is a status we confer based on utility. The richness response tries to save functionalism as a substantive theory by drawing a line in the sand. But since the line is either chauvinistic or interest-relative, it proves that functionalism is ultimately about our interests. The barrage is not excluded because it lacks magic; it is excluded only if we refuse to adopt the stance.

  Multiple realisability was supposed to save functionalism from identity theory. Instead, it reveals that functionalism shares identity theory's mistake: treating mental predicates as naming natural kinds. The barrage shows that functional organization is interest-relative. Therefore, functionalism is not a rival theory sitting alongside identity theory; it is a different kind of claim entirely. It is a license to adopt a predictive stance, not a description of mental machinery. We should stop asking if functionalism is true and start asking when it is useful.

  ***

  The weakest step is the concession regarding the China Case, as it risks abandoning the claim that functionalism explains mind rather than just attribution. I would abandon the thesis if it could be demonstrated that functional organization constrains predictive success independently of observer interests.
