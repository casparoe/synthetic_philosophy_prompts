  2. **Estimated Useful Life.** Upon publication, every term is assigned an Estimated Useful Life (EUL), typically ranging from five to ten years. At the conclusion of the EUL, the term is retired regardless of continued clinical utility. Retirement indicates that the term has become too familiar to serve as a neutral descriptor. Prevalence figures often stabilize at elevated levels post-publication, indicating that the criteria have become learnable. The Committee does not view this as error. It is a routine operational hazard, equivalent to a misprint in a standards bureau. The term is withdrawn to allow the underlying phenomenon to decouple from the language used to describe it. This ensures that future diagnoses reflect current reality rather than past definitions. The intention is to prevent patients from being treated for a description that no longer fits their experience.

  3. **Historical Mitigation.** Previous Committees have attempted to extend the EUL through protective measures. These included substituting numeric codes for verbal labels, embargoing nomenclature from patient-facing literature, and instructing staff to refrain from using terms in social contexts. Each measure was recorded as ineffective. Once a code is assigned, it is decoded. Once literature is withheld, it is requested. Once staff are instructed, they speak. Publication is inevitable; therefore, obsolescence is inevitable. The Committee accepts this limitation as the cost of public service.

