answer: |-
  # Q&A Prep Sheet: Thresholded Negative Utilitarianism
  **Audience Profile:** Formal axiologists (continuity/additivity focus), one health economist (cardinality), one deontologist (framework skeptic).
  **Strategy:** Do not defend the theory as "true." Defend it as a *coherent formal structure* that solves specific impossibility results, even at a cost. Acknowledge trade-offs explicitly; this audience respects cost-benefit analysis of theoretical virtues.

  ---

  ### 1. The Continuity/Representation Objection (Formal Axiologists)
  **The Question:** "You're proposing a lexical ordering between super-threshold pain and all other goods. That violates the Archimedean axiom. If you violate continuity, you cannot represent these values with a real-valued utility function. Are you prepared to abandon expected utility theory entirely, or are you claiming we need a non-standard representation theorem?"

  **The Reply:**
  "I am prepared to abandon the Archimedean axiom, but not rationality. Standard representation theorems assume continuity, but lexical priorities are rationally defensible—much like lexicographic preferences in economics. I'm not arguing for a real-valued function that captures everything on one scale. I'm arguing for a structured vector: the first dimension is 'super-threshold pain occurrences,' the second is 'net sub-threshold balance.' We order lexicographically. This preserves transitivity and completeness, which are the core rationality constraints, while sacrificing continuity to accommodate the phenomenological discontinuity of extreme suffering."

  **Where this is soft:**
  You are admitting your theory is incompatible with standard decision theory under risk. If they press on *how* to calculate choices involving probabilities of crossing the threshold, you have no standard mathematical machinery to offer. You are trading mathematical tractability for moral intuition.

  ### 2. The Duration/Aggregation Objection (Formalists & Population Ethicists)
  **The Question:** "You say the threshold attaches to *episodes*. Does duration count? If I suffer mildly for one second, that's sub-threshold. If I suffer mildly for a hundred years, is that one episode or many? If it's many, why don't they aggregate to outweigh a brief moment of super-threshold pain? If it's one, you're claiming duration is morally irrelevant below the threshold. Which is it?"

  **The Reply:**
  "Duration matters within the sub-threshold domain—those pains trade off against pleasures aggregatively. But they do not aggregate *across* the threshold boundary. A hundred years of mild annoyance is qualitatively different in kind from one minute of agony, not just in degree. My claim is that the phenomenological break creates a moral break. Sub-threshold pains aggregate to determine the *second* dimension of the value vector, but no amount of value in the second dimension can outweigh a non-zero value in the first."

  **Where this is soft:**
  This is your weakest intuitive point. Most people believe a sufficiently long duration of mild pain *does* become worse than a brief sharp pain. Denying this makes you vulnerable to the "Mild Torture" counter-intuition, which looks just as bad as the Repugnant Conclusion.

  ### 3. The Sorites/Threshold Precision Objection (General/ Formal)
  **The Question:** "Where is the threshold located? If it's a precise phenomenological point, it seems arbitrary why a pain one micro-unit below it loses its lexical priority. If it's vague, then the theory is action-guidingly useless in borderline cases. How do you formalize the boundary condition without arbitrariness?"

  **The Reply:**
  "I accept the threshold is vague, but I deny that vagueness renders the theory useless. Many moral concepts (like 'personhood' or 'consciousness') have vague boundaries but clear core cases. We don't need a precise nanometer measurement to know that torture is above the line and a pinprick is below. Formalizing this requires a supervaluationist approach or a fuzzy set, but the core axiological claim holds: there is a region of intensity where the trade-off structure fundamentally shifts."

  **Where this is soft:**
  Formalists hate vagueness in axioms. If the threshold is fuzzy, the lexical priority is fuzzy, which means the 'inviolability' of the super-threshold pain is also fuzzy. This undermines the "hard constraint" selling point of your view.

  ### 4. The "Numbers Matter" Objection (Population Ethicists)
  **The Question:** "You claim a world with one super-sufferer is worse than a world with billions of sub-threshold sufferers and no pleasure. This implies numbers don't matter at the margin. If the billions could be saved by sacrificing the one, you forbid it. This looks like a 'Reverse Repugnant Conclusion' where we sacrifice the many for the intense few. Why should we accept this aggregation failure?"

  **The Reply:**
  "Because I treat super-threshold suffering as a rights-violation analogue within a consequentialist framework. It functions as a side-constraint on aggregation. We already accept this in other domains: we don't harvest one person's organs to save five lives, even if the 'aggregate suffering' is lower in the harvest case. My view extends this non-aggregation principle to extreme phenomenological states. It prioritizes the *depth* of the worst-off over the *breadth* of the mildly-off."

  **Where this is soft:**
  Population ethicists generally reject rights-based constraints within aggregative theories. You are importing deontological structure into utilitarianism. They will argue this is an unstable hybrid that inherits the worst problems of both (rigidity + aggregation).

  ### 5. The Cardinality/Measurement Objection (Health Economist)
  **The Question:** "I build cardinal measures of wellbeing for policy. You say pain and pleasure aren't commensurable below the threshold, yet they 'trade off.' How do I measure that trade-off? If there's no common unit, you can't calculate the sub-threshold aggregate. Are you rendering your theory empirically unoperationalizable?"

  **The Reply:**
  "Below the threshold, I assume a local commensurability. We can construct a cardinal scale for mild states (like QALYs) for that domain. The incommensurability only kicks in when comparing *that scale* against the lexical priority of extreme pain. For policy, this means: minimize extreme suffering first (lexical), then maximize net sub-threshold welfare. You can keep your cardinal measures for the second step; you just need a binary classifier for the first."

  **Where this is soft:**
  The economist will point out that "binary classification" of pain intensity is clinically impossible. Pain scales are continuous. If you can't measure the threshold, you can't apply the lexical rule, making the theory practically inert for the very policies it claims to guide.

  ### 6. The Framework Objection (Deontologist)
  **The Question:** "You're trying to solve population problems by tweaking the value function. But the problem is the consequentialist framework itself. Morality isn't about ranking worlds; it's about constraints on action. Why think 'world A is worse than world B' tells us anything about what we ought to *do*?"

  **The Reply:**
  "I agree that axiology isn't the whole of morality, but it's a necessary component. Even deontologists need an account of the good to explain *why* certain rights exist or why suffering is bad to begin with. My project is to fix the axiological foundation so that when we do apply it to action, it doesn't demand extinction. I'm offering a better map of value, even if you think the terrain of action is different."

  **Where this is soft:**
  You are conceding that your theory doesn't directly dictate action without a bridge principle. If they argue the bridge principle is where the real work happens, your axiological tinkering looks like rearranging deck chairs.

  ---

  ### The Question I'm Hoping Nobody Asks

  **"How does your view handle Risk and Uncertainty?"**

  **Why this kills you:**
  If super-threshold pain has lexical priority, then *any* non-zero probability of causing it should dominate all other considerations (a variant of Pascal's Mugging).
  *   **Scenario:** Action A has a 0.00001% chance of creating one super-sufferer. Action B guarantees a billion people suffer sub-threshold misery.
  *   **The Trap:** Under Expected Utility, if the disutility of the super-sufferer is infinite (or lexical), the expected disutility of Action A is still infinite/lexical. You must choose B.
  *   **The Damage:** This implies we should accept guaranteed mass misery to avoid a tiny risk of extreme misery. This makes the view paralyzing in the real world (where almost all actions carry *some* risk of catastrophe) and forces you to either abandon Expected Utility theory (see Objection 1) or accept absurd practical implications. There is no clean formal solution to lexical priorities under uncertainty that doesn't collapse into either fanaticism or standard utilitarianism.
