answer: |-
  **Weighting Rule for Overall Ranking**
  I will rank the candidates by **Explanandum Fidelity**, ordering them according to how closely their "Best Posed Contrast" aligns with the empirical consensus that the Great Divergence in per capita income is a late-eighteenth-century phenomenon; candidates that posit deep-time causes (c. 1000) are ranked lower for risking teleology, while those targeting the immediate pre-industrial moment (c. 1750) are ranked higher for matching the historical data, regardless of their contrast-stability score.

  ***

  **1. Coal (Pomeranz)**
  (i) **Contrast-Stability Score:** 0.1
  (ii) **Best Posed Contrast:** Britain against the Yangtze delta around 1750.
  (iii) **Justification:** This explanation relies on the specific geological luck of accessible seams that mattered only once steam technology was viable, committing to a divergence onset no earlier than the mid-eighteenth century. It loses force at the 1000 AD contrast where coal was irrelevant and at the Eurasia vs. Americas contrast where coal endowments were not the primary differentiator.

  **2. New World colonies as an ecological release (Pomeranz)**
  (i) **Contrast-Stability Score:** 0.1
  (ii) **Best Posed Contrast:** Britain against the Yangtze delta around 1750.
  (iii) **Justification:** This account depends on trans-Atlantic trade flows that did not exist in the medieval period, committing to a divergence onset following the Columbian Exchange but felt primarily in the 1700s. It cannot explain differences at the 1000 AD contrast and treats the Qing internal frontier as functionally distinct from overseas ghost acres.

  **3. Relative factor prices (Allen)**
  (i) **Contrast-Stability Score:** 0.2
  (ii) **Best Posed Contrast:** Britain against the Qing empire taken as a whole between 1400 and 1800.
  (iii) **Justification:** Wage-energy ratios are a proximate signal that presupposes integrated markets, committing to a divergence onset in the seventeenth century when these price structures crystallized. The explanation fails at the 1000 AD contrast where labor and energy markets were not sufficiently developed to drive mechanization incentives.

  **4. Credible constraints on sovereign predation (North and Weingast)**
  (i) **Contrast-Stability Score:** 0.1
  (ii) **Best Posed Contrast:** Britain against the Yangtze delta around 1750.
  (iii) **Justification:** This institutional trigger is pinned to the Glorious Revolution, committing to a divergence onset precisely after 1688–89. It is historically silent on the 1000 AD contrast and treats the 1400–1800 block as undifferentiated prior to the specific constitutional settlement.

  **5. The high-level equilibrium trap (Elvin)**
  (i) **Contrast-Stability Score:** 0.3
  (ii) **Best Posed Contrast:** Britain against the Qing empire taken as a whole between 1400 and 1800.
  (iii) **Justification:** This model explains a lack of incentive to mechanize during the Ming and Qing dynasties, committing to a divergence onset in the fifteenth century when the trap allegedly snapped shut. It struggles at the 1750 contrast where the trap should have already sprung, and less so at 1000 AD when the Song economy was dynamically innovative.

  **6. The Industrial Enlightenment (Mokyr)**
  (i) **Contrast-Stability Score:** 0.4
  (ii) **Best Posed Contrast:** Britain against the Qing empire taken as a whole between 1400 and 1800.
  (iii) **Justification:** This cultural epistemology requires a long gestation of scientific communities, committing to a divergence onset in the seventeenth century with roots in the sixteenth. It loses explanatory power at the 1000 AD contrast where natural philosophy was not yet coupled to artisan practice, and it risks conflating knowledge with growth.

  **7. Political fragmentation and interstate rivalry (Europe vs. China)**
  (i) **Contrast-Stability Score:** 0.6
  (iii) **Best Posed Contrast:** Northwestern Europe against East Asia around the year 1000.
  (iii) **Justification:** Structural geopolitics operate over centuries, committing to a divergence onset in the high Middle Ages following the collapse of imperial unity in Europe. It retains force at the 1400–1800 contrast but offers little specific leverage on the 1750 coal question, risking a teleological reading of later outcomes.

  ***

  **Overall Ranking**

  1.  **Coal:** It lands first because it identifies the immediate material bottleneck that was actually broken at the moment income data shows divergence.
  2.  **New World colonies:** It ranks second as it complements the coal account by explaining the land constraint specifically at the 1750 juncture.
  3.  **Relative factor prices:** It takes third place because wage signals are the direct economic mechanism translating resources into machinery in the late 17th century.
  4.  **Credible constraints:** It is fourth because while 1688 is specific, secure property rights alone did not guarantee industrialization in other contemporary economies.
  5.  **High-level equilibrium trap:** It ranks fifth as it explains Chinese stagnation well but is less precise about the British acceleration in the 18th century.
  6.  **Industrial Enlightenment:** It is sixth because it explains the capacity for innovation better than the economic realization of that innovation.
  7.  **Political fragmentation:** It lands last because positing a 1000 AD onset contradicts the empirical evidence that living standards remained comparable until the 18th century.

  ***

  **The Needham Question Distinction**

  Candidate 7, **The Industrial Enlightenment**, is in my judgment not an answer to the divergence question at all but an answer to the Needham question about where modern science arose. What is lost when the two explananda are run together is the distinction between the *supply* of useful knowledge and the *demand* for labor-saving technology; a society can possess advanced natural philosophy (as 17th-century France or China did) without undergoing an industrial revolution if factor prices or resource constraints do not incentivize the application of that knowledge to production.
