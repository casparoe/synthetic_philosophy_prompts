answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Workshop:** Foundations of Normative Comparison  
  **Topic:** Spectrum Arguments and the Transitivity of Betterness  
  **Parties:**  
  1.  **The Single-Scale Transitivist (SST):** Defends the view that all-things-considered betterness is a genuine, transitive ordering over a single axiological scale, where cycles are ruled out by dominance and money-pump arguments.  
  2.  **The Aspect-Relative Intransitivist (ARI):** Defends the Temkin/Rachels line that betterness aggregates aspect-relative relations with shifting weights, allowing adjacent comparisons and endpoint comparisons to diverge without error.

  ---

  ## 1. AGREED CLAIMS
  *The following claims are endorsed by both parties without qualification. These constitute the shared phenomenological and logical data that any successful theory must accommodate.*

  1.  **Adjacent Comparability:** In a standard hangnail-versus-torture spectrum (where intensity decreases slightly as duration/number increases significantly at each step), every adjacent pair $(S_n, S_{n+1})$ is axiologically comparable. Neither party accepts "incomparability" or "parity" as the explanation for the difficulty in choosing between adjacent steps.
  2.  **Endpoint Divergence:** Both parties share the robust intuition that the starting endpoint (e.g., 50 years of torture) is worse than the finishing endpoint (e.g., billions of years of mild hangnail pain), even if the chain of adjacent comparisons suggests otherwise.
  3.  **The Logical Stakes:** Both parties agree that if the "Better Than" relation ($>$) is transitive, and every adjacent step satisfies $S_n > S_{n+1}$, then a sharp cutoff must exist somewhere in the spectrum where $S_k \ngtr S_{k+1}$.
  4.  **Pragmatic Vulnerability:** Both parties acknowledge that if intransitivity is real (i.e., $A > B$, $B > C$, $C > A$), an agent is *prima facie* vulnerable to a money pump or dominance argument *unless* the agent's choice architecture restricts trading based on the context of the comparison.
  5.  **Non-Arbitrariness:** Both parties deny that the comparison between adjacent steps is arbitrary. There is a normative fact of the matter regarding whether $S_n$ is better than $S_{n+1}$, even if that fact is difficult to access.

  ---

  ## 2. DISAGREEMENTS TABLE
  *Where the parties cannot sign the same sentence, the specific divergence is recorded here. We explicitly flag disputes that are merely verbal versus those that are substantive.*

  | Issue | SST Wording (Transitivist) | ARI Wording (Intransitivist) | Nature of Dispute |
  | :--- | :--- | :--- | :--- |
  | **Transitivity Status** | "Transitivity is a constitutive norm of rational betterness; any apparent violation indicates an error in description or evaluation." | "Transitivity is a property that holds only within fixed contexts; all-things-considered betterness aggregates context-sensitive relations and is not globally transitive." | **Substantive** |
  | **The Cutoff** | "There is a sharp, ontological cutoff in the spectrum where the betterness relation flips, even if we cannot locate it epistemically." | "There is no sharp cutoff; the 'better than' relation dissolves at the endpoints because the relevant weighting of aspects (intensity vs. duration) has shifted." | **Substantive** |
  | **Intuition Source** | "The intuition of intransitivity is evidence of **psychological error** (e.g., scope neglect or similarity heuristics) in eliciting betterness." | "The intuition of intransitivity is evidence of the **structure of betterness** itself (i.e., that value is essentially comparative)." | **Substantive** |
  | **Semantic Unity** | "The phrase 'better than' names a **single binary relation**. To use it otherwise is to change the subject." | "The phrase 'better than' names a **cluster of relations** indexed to normative aspects. To insist on a single relation is a category mistake." | **Merely Verbal / Semantic** |
  | **Money Pump Escape** | "An intransitive agent *will* be money-pumped unless they irrationally refuse trades they deem beneficial." | "An intransitive agent *will not* be money-pumped because the second comparison ($B$ vs $C$) occurs in a new context that resets the weighting, blocking the cycle." | **Substantive (Empirical/Normative)** |

  ---

  ## 3. CRUXES AND PREDICTIONS
  *We identify three specific cruxes. For each, we specify a concrete case or argument both agree bears on the issue, and we record our divergent predictions in advance.*

  ### Crux 1: The "Reasons-Shift" Case (Vagueness vs. Weight Shifting)
  *This case is designed to separate the claim that the comparison is vague (epistemic/ontic indeterminacy) from the claim that the weights shift (determinate but context-sensitive).*

  *   **The Case:** A triadic choice set involving Pain A (High Intensity, Short Duration), Pain B (Medium Intensity, Medium Duration), and Pain C (Low Intensity, Long Duration).
      *   Comparison A vs. B: Salience of Intensity is high.
      *   Comparison B vs. C: Salience of Duration is high.
      *   Comparison A vs. C: Salience of Intensity returns (due to extreme contrast).
  *   **SST Prediction:** Agents will exhibit hesitation consistent with vagueness near the cutoff, but will not exhibit cyclic preferences ($A > B > C > A$) if forced to choose in a single context. If cycles appear, they are performance errors.
  *   **ARI Prediction:** Agents will express confident, non-hesitant preferences $A > B$ (Intensity dominates) and $B > C$ (Duration dominates), but also $C > A$ (or $A \ngtr C$) because the *reason* for comparing A and C reactivates the Intensity weight, making A look worse than C in a way that doesn't chain. Confidence levels will remain high across all three pairs, ruling out vagueness.

  ### Crux 2: The Dynamic Money Pump
  *Does the "context-reset" defense actually work in a sequential trade environment?*

  *   **The Argument:** An agent is offered a sequence of trades: $A \to B$ (cost $\$1$), $B \to C$ (cost $\$1$), $C \to A$ (cost $\$1$).
  *   **SST Prediction:** If the agent accepts all three trades, they lose $\$3$ for the same state. This proves the initial preferences were irrational. The ARI cannot block the third trade without admitting $C \ngtr A$ in the relevant sense.
  *   **ARI Prediction:** The agent will accept $A \to B$ and $B \to C$. However, when offered $C \to A$, the context has shifted (the agent now holds C). The aspects relevant to comparing $C$ and $A$ differ from the initial $A$ vs $B$ comparison. The agent may rationally refuse the third trade, breaking the pump. The "loss" is the cost of context-sensitivity, not irrationality.

  ### Crux 3: Normative Planning
  *Can an intransitive axiology guide long-term planning?*

  *   **The Argument:** An agent must choose a life path now that leads to outcome $Z$ in 50 years. Intermediate steps are required.
  *   **SST Prediction:** Intransitivity makes long-term planning impossible. If betterness cycles, there is no "best" path, and the agent cannot form a stable intention.
  *   **ARI Prediction:** Planning remains possible because planning occurs within a "fixed context" (the agent's current perspective). Intransitivity only arises when shifting between perspectives (adjacent vs. global). The agent can plan from the current perspective without contradiction.

  ---

  ## 4. FALSIFICATION CONDITIONS & MOVABILITY
  *For each side, we specify what would count as evidence against its own position, with an honest assessment of whether such evidence would actually compel us to change our views.*

  ### Single-Scale Transitivist (SST)
  *   **Falsification Condition:** A demonstrated case where a fully informed, reflective agent consistently prefers $A$ to $B$, $B$ to $C$, and $C$ to $A$ across time, *and* successfully avoids exploitation (money pumps) without resorting to pre-commitment strategies that violate their own stated preferences at the time of trade.
  *   **Honest Note on Movability:** **Low.** We suspect any such case can be explained away by epistemic limitations, framing effects, or a failure to grasp the "single scale." We are committed to transitivity as a requirement of rationality; we are more likely to deny the data than abandon the principle. However, if the "sharp cutoff" implication leads to morally abhorrent prescriptions (e.g., endorsing a world with one person tortured over billions with hangnails solely to avoid a cutoff), we would be forced to reconsider the *location* of the cutoff, not the transitivity itself.

  ### Aspect-Relative Intransitivist (ARI)
  *   **Falsification Condition:** A formal proof that context-sensitive weighting makes *any* form of normative guidance impossible, even within fixed contexts, or a demonstration that the "shifting weights" are themselves reducible to a single higher-order scale (restoring transitivity at the meta-level).
  *   **Honest Note on Movability:** **Moderate.** We are less committed to "intransitivity" as a dogma than we are to the "Essentially Comparative View." If it can be shown that the shifting weights are actually tracking a single, complex value function (e.g., a non-linear utility function over intensity and duration), we would accept that view as a form of transitivism. However, if the only way to save transitivity is to posit a sharp cutoff that violates our deepest moral intuitions (e.g., the Repugnant Conclusion), we will retain intransitivity.

  ---
  **Signed:**  
  _________________________ (Single-Scale Transitivist)  
  _________________________ (Aspect-Relative Intransitivist)  
