  **5. General Condition for Nonempty Feasible Set (Strict Clause ii)**
  *   Let Baseline = $b$, Coop = $c$, Sucker = $s$, Temptation = $t$.
  *   Conditions: $D > b-s$ (Dominance) AND $D \le t-b$ (Safety).
