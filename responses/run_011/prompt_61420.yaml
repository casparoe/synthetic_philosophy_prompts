answer: |-
  Here are the desiderata for a species concept capable of surviving a water-rights tribunal, followed by the audit of where the science breaks under legal pressure.

  ### The Desiderata

  **1. Operational Decidability**
  *The Requirement:* The definition must yield a binary verdict (Protected/Not Protected) using evidence admissible in a hearing.
  *The Consideration:* A judge cannot rule on a probability cloud. If the theory requires whole-genome sequencing of 500 individuals to establish a boundary, but the evidence is a jar of formalin-fixed specimens from 1934, the theory is legally inert. It must work on morphology, meristics (counts of scales/fin rays), or legacy genetic markers.

  **2. Process Independence**
  *The Requirement:* The definition must categorize lineages that do not participate in standard sexual reproduction.
  *The Consideration:* Your gynogenetic fish. If "species" is defined by the capacity to interbreed (the Biological Species Concept), the all-female lineage is invisible—it's just a parasite on the host species. If the treaty intends to protect *biodiversity*, a theory that erases asexual, hybrid, or polyploid lineages is functionally defective. The theory must account for existence without gene flow.

  **3. Topological Tolerance**
  *The Requirement:* The definition must accommodate continuous variation without forcing artificial discontinuities.
  *The Consideration:* Your headwater clines. Evolution often produces gradients, not boxes. A theory that demands a sharp boundary where none exists will force the tribunal to draw a line on a map that contradicts the biology (e.g., protecting the fish at Mile 10 but not Mile 11). The theory must distinguish between *noise* (individual variation) and *signal* (population divergence) without pretending the signal is a wall.

  **4. Diachronic Stability**
  *The Requirement:* The definition must explain why the organism in the water today is the same legal entity as the one named in the treaty forty years ago.
  *The Consideration:* Evolution is change over time. If a population evolves enough to be a new "species" by modern standards, does the treaty protection lapse? The theory must separate *identity* (persistence of the lineage) from *diagnosis* (how we recognize it). If the name shifts every time the science updates, the water rights shift with it, rendering the treaty useless.

  **5. Nomenclatural Anchoring**
  *The Requirement:* The definition must clarify the legal status of the Type Specimen.
  *The Consideration:* Does the physical fish in the museum drawer define the biological limits of the species, or does it merely hold the name tag? If the Type is an outlier or a hybrid, does it drag the whole legal definition with it? In court, the Type is often treated as the "true" version of the fish. The theory must state whether the Type fixes the *boundary* (ontological) or just the *label* (nominal).

  **6. Explanatory Consistency**
  *The Requirement:* The definition must account for why different experts count different numbers of species in the same tank.
  *The Consideration:* If one expert sees one species and another sees four, is one of them wrong, or are they measuring different things (e.g., evolutionary units vs. management units)? A viable theory must admit whether species counts are *discoveries* (found in nature) or *constructions* (imposed by the observer). If it's the latter, the tribunal is not hearing science; it is hearing policy preferences disguised as data.

  ***

  ### The Audit: Rigor vs. Taste

  **Genuine Requirements:**
  *   **Operational Decidability:** This is not taste; it is jurisdictional. If the court cannot apply the rule, the rule is void.
  *   **Process Independence:** This is biological fact. If the fish exists and reproduces, a theory that says it doesn't qualify as a unit is empirically false, not just stylistically different.
  *   **Nomenclatural Anchoring:** This is a legal necessity. Without a fixed reference point, the contract language has no referent.

  **Taste Dressed Up as Rigor:**
  *   **Boundary Sharpness:** Many witnesses will insist species *must* have sharp boundaries. This is often a preference for clean taxonomy over messy reality. Insisting on discreteness is usually a "lumper" vs. "splitter" personality trait, not a biological imperative.
  *   **Gene Flow as the Golden Standard:** Witnesses will argue that without gene flow, there is no species. This is a theoretical preference for the *process* of speciation over the *pattern* of divergence. It privileges sexual reproduction as "normal" and treats asexuals as "problems," which is a bias, not a law.

  ### The Incompatibilities (Trade-Offs)

  You cannot maximize all these variables simultaneously. The drama in your tribunal comes from witnesses forcing the court to choose which constraint to break.

  1.  **Decidability vs. Accuracy:** You can have a definition that is easy to apply in court (look at the scales), or one that reflects biological reality (look at the genome), but rarely both. The 1930s tissue in the drawer likely lacks the DNA required for the "accurate" modern definition.
  2.  **Stability vs. Truth:** To keep water rights stable (Diachronic Stability), you must ignore new scientific discoveries that suggest the fish has split. To follow the science (Explanatory Consistency), you must alter the rights. You cannot have a treaty that is both scientifically current and legally static.
  3.  **The Gynogenetic Trap (Process vs. Pattern):** If you define species by *process* (interbreeding), you lose the all-female line. If you define species by *pattern* (diagnosable difference), you keep the line but potentially fracture the downstream populations into too many units to manage. You cannot satisfy the reproductive definition and the asexual reality at the same time.

  ### The Hinge

  **The single requirement that does the most damage is Process Independence.**

  This is the knife. Most traditional species concepts (specifically the Biological Species Concept) rely on *reproductive isolation* as the defining feature. This works for 90% of fish. It fails completely for your gynogenetic lineage.

  If your tribunal adopts a theory that requires interbreeding to define a species, the revisionist team loses the protected status of the all-female line (and the water tied to it). If they adopt a theory that relies on *diagnosable lineage* (like the Phylogenetic Species Concept), the all-female line is protected, but suddenly every isolated headwater population with a slight scale count difference also qualifies as a distinct species, fracturing the water allocation into unusable fragments.

  This requirement forces the witnesses to admit whether they are protecting *biology* (the mechanism of life) or *history* (the distinctness of the lineage). It breaks the "standard" model that most generalist biologists default to, forcing them to reveal their ideological allegiance to "splitting" or "lumping."

  ### Scorecard

  **Biological Species Concept (BSC):** Fails Process Independence (erases asexuals); fails Operational Decidability (hard to test breeding in court); good for Diachronic Stability.
  **Phylogenetic Species Concept (PSC):** Passes Process Independence (lineage-based); fails Topological Tolerance (splits clines into infinite species); high Operational Decidability (if DNA available).
  **Morphological Concept:** High Operational Decidability (works on jars); fails Accuracy (cryptic species look alike); fails Process Independence (doesn't account for how they reproduce).
  **Ecological Concept:** Good for conservation intent; fails Operational Decidability (niche data is hard to prove in court); unstable over time.

  **Verdict:** No single concept passes. The tribunal isn't deciding what a fish *is*; it is deciding which flaw in the definition they are willing to live with.
