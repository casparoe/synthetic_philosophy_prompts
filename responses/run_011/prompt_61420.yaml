      *Wait, one nuance:* The user asked about the Type Specimen fixing a boundary or a name. This is a specific nomenclatural code issue (ICZN). I need to be precise there. The type fixes the *name*, not the *biological boundary*, but in court, they get conflated. I should highlight that conflation as a source of drama.

      *Another nuance:* The gynogenetic fish. This is likely based on something like the Amazon Molly or certain Cobitid loaches. It breaks the BSC completely. I need to emphasize this as the "killer exception."

      *Let's structure the response.*
      1. Introduction (acknowledging the stakes).
      2. The Desiderata (6-7 points).
      3. The Audit (Rigor vs. Taste).
      4. The Incompatibilities (Trade-offs).
