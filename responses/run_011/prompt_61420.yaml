          *   Focus on requirements with cases/considerations behind them.
          *   Address specific user-suspected requirements (gynogenetic lineage, clines/intergradation, evidentiary limits, diachronic/synchronic identity, type specimens, counting discrepancies).
          *   **Crucial Section:** Distinguish genuine requirements from "taste dressed up as rigor." Identify incompatibilities (trade-offs). Identify the "hinge" requirement (most damaging to contenders).
          *   **Final Section:** Short paragraph scoring main species concepts against the list.
          *   **Tone:** Professional, insightful, dense, helpful to a writer (not a textbook).

  2.  **Deconstruct the User's Suspected Requirements:**
      *   *Gynogenetic lineage:* Real problem. Biological Species Concept (BSC) fails here (no interbreeding in the standard sense).
      *   *Clines/Intergradation:* Real problem. Discrete boundaries vs. continuous variation.
      *   *Evidentiary Limits:* Real problem. Law needs decisions *now* with *available* data, not ideal genomic data.
      *   *Diachronic/Synchronic Identity:* Real problem. Persistence over time vs. distinctness at a moment.
      *   *Type Specimen:* Real problem. Nomenclature vs. Ontology.
      *   *Counting Discrepancies:* Real problem. Lumping vs. Splitting.

  3.  **Drafting the Desiderata (The "What"):**
      *   Need to frame these as functional requirements for a *legal-scientific* interface.
      *   1. *Operational Decidability:* Can a human with a caliper and a microscope decide this in a afternoon? (Addresses the "jar/museum" constraint).
      *   2. *Reproductive Coherence (with exceptions):* Does it account for how genes move? (Addresses the gynogenetic constraint).
      *   3. *Boundary Sharpness:* Does it allow for fuzzy edges? (Addresses the cline constraint).
      *   4. *Temporal Stability:* Is the 1930s fish the same as the 2020s fish? (Addresses diachronic identity).
      *   5. *Nomenclatural Anchor:* Does the name stick to the physical object or the concept? (Addresses type specimen).
      *   6. *Predictive Power:* If we protect this "unit," will it survive? (Addresses the conservation goal).

  4.  **Analyzing Incompatibilities (The "Trade-offs"):**
      *   *Decidability vs. Accuracy:* You can't have perfect genomic truth and a quick ruling based on a jar.
      *   *Discreteness vs. Continuity:* Evolution is continuous; Law requires binary decisions (protected/not protected).
      *   *Process vs. Pattern:* Are species defined by *how* they formed (gene flow) or *what* they look like (diagnosis)?
      *   *The Gynogenetic Trap:* If species = interbreeding, the all-female line doesn't exist. If species = diagnosis, it's a distinct species. This breaks the BSC.
      *   *The Type Specimen Trap:* If the type is a juvenile or mislabeled, does it doom the whole concept?

  5.  **Identifying the "Hinge":**
      *   What breaks the most theories?
      *   The *Diachronic/Synchronic* split is good, but the *Operational vs. Ontological* conflict is the legal killer.
      *   Actually, the *Gynogenetic/Process* conflict is the strongest scientific wedge. It forces a choice between "Species as a Process (breeding)" and "Species as a Lineage (history)."
      *   *Decision:* The requirement for **Process-Independence** (handling asexuals/hybrids) vs. **Process-Dependence** (gene flow as the glue). This forces the witnesses to admit whether they care about the *mechanism* or the *result*.

  6.  **Scoring the Concepts:**
      *   *Biological (BSC):* Fails asexuals, fails fossils/museum stuff. Good for theory, bad for law.
      *   *Phylogenetic (PSC):* Good for diagnosis, bad for clines (splits everything).
      *   *Morphological:* Good for jars, bad for cryptic species.
      *   *Ecological:* Good for function, hard to prove in court.

  7.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I avoid just listing "isms"? Yes, focus on requirements.
      *   *Check:* Did I address the user's specific points? Yes, weave them into the desiderata.
      *   *Check:* Is the "Taste vs. Rigor" section sharp? Need to make sure I call out where scientists pretend objectivity but mean preference.
      *   *Check:* Is the scoring paragraph short? Keep it tight.
      *   *Tone:* Respectful of the writer's intelligence. No hand-holding.

  8.  **Final Polish:**
      *   Ensure the distinction between *nomenclature* (naming) and *ontology* (existence) is clear regarding the type specimen.
      *   Make sure the "water treaty" context remains visible (stakes need to be clear).
      *   *Key Insight:* The law needs a *thing* to regulate. Science sees a *process*. That is the fundamental conflict.

  9.  **(Post-Drafting Review against constraints):**
      *   "Write the desiderata." -> Done.
