prompt: |-
  I work on distributed systems and got into a lunch argument I'm pretty sure I lost. I'd been reading about split-brain patients — the ones whos corpus callosum gets cut to control epilepsy — and I said they're basically a network partition: two nodes that used to share state and now can't, each still processing its own inputs. My coworker ran with it and said that settles the question, consciousness was never one thing, it's a cluster with a flaky interconnect, and "one person" is just a control-plane convention the same way we still call a partitioned database one system.

  Can you audit the analogy for me? I want the correspondence table first (callosum = ?, each hemisphere = ?, phenomenal unity = ? — that last one is where I suspect it falls apart), then the disanalogies, sorted into the ones that actually threaten his conclusion and the ones that don't. I already know two things that feel like problems: the hemispheres still share subcortical wiring, and these patients act weirdly normal in everyday life, which isn't what a real partitioned cluster does. Say what "one person" is doing in his argument that "one system" can't carry, and if the cluster picture is bad, tell me what analogy would be better. No philosophy training here, so define terms as you go rather than assuming I know them.
