  ### Payoff Decision: The €50 Fund (Sole Payoff)

  **Decision:** Use the **€50 student-engagement fund** as the sole payoff. Do not use the film time.

  **Justification:** To isolate *Pure Time Preference* (Constraint 1), the good being traded across time must be identical. If you combine the €50 (Public Good/End of Term) with the Film Time (Private Good/Next Week), you confound *time* with *good type* and *excludability*. Students will debate whether a minute of film is "worth" €2.50, which drowns out the temporal question. By using only the €50, you ensure fungibility: a chip is a chip. The lack of real-time payout variance (all money moves at end-of-term) is a limitation you will address verbally in the debrief (see "Failure Analysis"), but it is preferable to the structural noise of mixing currencies. The "Present" vs. "Future" tension will be simulated through *identity* (Generation 1 vs. Generation 4) rather than payout date, which is sufficient to trigger the psychological intuition of positional preference.

  ---

  ### The Activity: "The Successor Protocol"

  #### Materials List
  *   **200 Poker Chips:** In a central jar.
  *   **4 Large Print Handouts (A3 or 14pt+ font):** "The Constitution Sheet" (one per table).
  *   **4 Large Print Tally Sheets:** Simple grid with 4 columns (Gen A, B, C, D).
  *   **4 Jars/Bowls:** Labeled A, B, C, D (for final allocation).
  *   **Index Cards:** 22 cards, pre-written with "Role Assignments."
  *   **Wall Clock:** Visible to all.
  *   **Pens:** 4 minimum.

  #### Roles
  *   **Facilitator (You):** Timekeeper, rule-enforcer, banker.
  *   **Scribes (4 students, one per table):** Only person allowed to write on the Tally Sheet.
  *   **Observers (18 students):** Participants.
  *   **Silence Monitors (2 students, roving):** Empowered to deduct 5 chips from any table that uses banned terminology (see Constraint 4).

  #### Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & The Veil**
  *   Arrange 4 tables (5-6 students each). Label them A, B, C, D.
  *   Place the jar of 200 chips in the center.
  *   **Instruction:** "You are the Founding Committee. Your task is to draft a Constitution for distributing these 200 chips across the four Tables. You do not know which Table you will occupy when the donation is made. You must agree on a distribution (e.g., 50 chips per table, or 100 to A, 0 to D)."
  *   **Constraint:** No discussion of *why*. Only *how many*.
  *   **Action:** Students negotiate and write the numbers on the Constitution Sheet. They sign it.
  *   **Econ Student Control:** Hand the Economics majors the "Silence Monitor" badges. Their job is to listen for the word "rate" or "discount." This gives them a technical task that requires silence, not speech.

  **00:10 – 00:25: The Reveal & The Temptation (Dynamic Inconsistency I)**
  *   **Action:** Hand out the Index Cards. Each card says: "You are currently seated at Table [X]." (Match the cards to their current physical seats, so Table A students get Card A, etc.).
  *   **Instruction:** "The Veil is lifted. You now know you are Table A. You are Table B. etc. You have 5 minutes to *amend* the Constitution. You may move chips from other Tables to your own. However, there is a Transaction Cost: For every chip you move, you must burn one chip from the total pot (return it to the jar, it is lost forever)."
  *   **Psychology:** Table A will aggressively move chips to A. Table D will try to defend D. The "burn" cost simulates the friction of changing policy.
  *   **Outcome:** Most groups will skew heavily toward their current identity, violating their own Veil plan.

  **00:25 – 00:40: The Rotation (Constraint 3 & Dynamic Inconsistency II)**
  *   **Instruction:** "Stand up. Move one table to the right. Table A goes to B, B to C, C to D, D to A. Take your Index Cards with you."
  *   **Action:** Students physically swap seats. They are now occupying the position they just discounted. (e.g., The student who moved chips from D to A is now sitting at Table D).
  *   **Instruction:** "You have 5 minutes to review the Allocation. You may not move chips anymore. You must write a 'Regret Statement' on the back of your Tally Sheet: One sentence on how the current distribution feels from this new seat."
  *   **Effect:** They feel the force of their own earlier discounting.

  **00:40 – 00:55: Final Allocation & Accounting**
  *   **Instruction:** "The Constitution is locked. Count the chips in each of the 4 Jars according to the final Tally Sheet."
  *   **Action:** Scribes count chips. Facilitator verifies.
  *   **Constraint 5 Check:** This takes 3 minutes.
  *   **Payoff Declaration:** "The €50 will be donated to the charity selected by the Table with the *highest* chip count. If there is a tie, the charity selected by Table A wins." (This adds a final stakes layer: Table A is privileged, reinforcing the time bias).

  **00:55 – 01:15: The Debrief**
  *   (See Debrief Script below).

  ---

  ### Tally Sheet (Large Print Design)
  *   **Header:** ALLOCATION PROTOCOL
  *   **Columns:** TABLE A | TABLE B | TABLE C | TABLE D
  *   **Row 1:** Original Plan (Veil)
  *   **Row 2:** Revised Plan (Identity)
  *   **Row 3:** Chips Burned (Cost)
  *   **Footer:** Total Chips Must Equal 200 minus Burned.

  ---

  ### Debrief Script & Mapping

  **1. Mapping the Phases (10 mins)**
  *   **The Veil (00:00-00:10):** This was **Impartiality**. Without knowing your position, you likely chose an equal split. This mirrors the philosophical intuition that time itself shouldn't matter.
  *   **The Reveal (00:10-00:25):** This was **Pure Time Preference**. Once you knew you were "Now" (Table A), you valued chips more. You were willing to destroy value (burn chips) to bring benefits nearer. That destruction is the cost of impatience.
  *   **The Rotation (00:25-00:40):** This was **The Classical Objection**. Paraphrasing Ramsey/Sidgwick: *'A mere difference in date is not a rational ground for treating one person's welfare as less important than another's.'* When you moved seats, the chips didn't change, only your date did. Your distress at sitting in Table D proves that the discounting was positional, not intrinsic to the chips.

  **2. Answering the Two Objections (5 mins)**
  *   **Objection 1: "It was only a game, of course we revised."**
      *   *Response:* "The arousal you felt when you had to burn a chip to move a benefit to yourself was physiological. That is the same mechanism that drives climate inaction. The game didn't create the preference; it revealed the cost of satisfying it."
  *   **Objection 2: "The far future matters less because those people are not real."**
      *   *Response:* "Table D was as real as Table A five minutes ago. You treated them as abstract until you sat in their chairs. The 'non-existence' of future people is a cognitive bias, not an ontological fact. You just proved you can care about them when forced to occupy their position."

  **3. Banning Jargon (Constraint 4)**
  *   If an Econ student says "Discount Rate," the Silence Monitor deducts 5 chips.
  *   *Why this works:* It forces them to describe the *phenomenon* ("I want it now") rather than the *parameter* ("r=0.05"). This keeps the focus on the moral intuition, not the calculation.

  ---

  ### Failure Analysis: Four Predictable Problems

  1.  **The "Zero-Sum" Misunderstanding:** Students may think moving a chip from D to A creates value.
      *   *Fix:* Explicitly state during setup: "Moving chips does not create new chips. It only changes who holds them."
      *   *Limitation:* You must verbally supply the concept that future people *consume* the resources, they don't just hold them.
  2.  **The "Burn" Resistance:** Students may refuse to burn chips, stalling the revision phase.
      *   *Fix:* Set a timer. "If no revision is submitted in 5 minutes, the Veil Plan stands." Fear of the Veil Plan (which might be equal) usually motivates the revision.
      *   *Limitation:* You cannot reproduce the *pain* of real economic contraction. The "burn" is abstract.
  3.  **The Cynical Economist:** A student may argue "Table A deserves more because they start the chain."
      *   *Fix:* Remind them: "The chips were in a central jar. No one earned them. This is about distribution, not production."
      *   *Limitation:* You cannot reproduce the absence of real waiting. There is no actual delay between Round A and Round D. You must verbally explain that in reality, Round D waits 50 years.
  4.  **Accounting Bottleneck:** Scribes might count slowly.
      *   *Fix:* Pre-stack chips in groups of 10 before class.
      *   *Limitation:* You cannot reproduce the presence of actual future persons. There is no one in the room to complain for Table D. You must supply the standing verbally: "Imagine Table D contains your grandchildren."

  ---

  ### 25-Minute Tutorial Version (6 Students)

  **Goal:** Compress the experience of Dynamic Inconsistency without the group negotiation overhead.

  **Setup:** 1 Table. 6 Students. 60 Chips. 3 Buckets (A, B, C).
  **Payoff:** €50 (Split proportionally to chips in buckets).

  **Timeline:**
  *   **00:00 – 00:05: The Plan.** Each student privately writes on a card how to split 60 chips across A, B, C. (Veil of Ignorance).
  *   **00:05 – 00:10: The Identity.** Tell them: "You are all Generation A." Ask them to publicly revise their cards to favor A. Allow this, but charge 1 chip per move.
  *   **00:10 – 00:15: The Swap.** Tell them: "Actually, the experiment randomly assigns you. You are now Generation C." Ask them to write a one-sentence reaction to their own revised plan.
  *   **00:15 – 00:20: Accounting.** Collect cards. Tally the final distribution.
  *   **00:20 – 00:25: Debrief.** Focus entirely on the feeling of the "Swap." Ask: "Did the chips change value, or did you?"

  **Modifications:**
  *   Remove Silence Monitors (too many roles for 6 people). You enforce the jargon ban.
  *   Remove the "Charity Selection" stakes. Just split the €50 based on the chip count in Bucket A vs C to keep it simple.
  *   **Large Print:** Ensure the index cards are 14pt+ font.

  ---

  ### Facilitator's Note on Limitations
  *You must supply verbally what the game cannot:*
  1.  **Real Waiting:** In the game, Round C happens 20 minutes after Round A. In reality, it is 30 years. Remind them the *psychological* distance is the same, even if the *clock* distance differs.
  2.  **Real Death:** In the game, Table A students survive to see Table C. In reality, Generation A is dead. Remind them that the "Burned Chips" represent resources consumed that future people literally cannot access because the past is gone.
  3.  **Standing:** Table C cannot speak in the game. In reality, they will exist. Remind them that the "Regret Statement" was a proxy for the complaint future people cannot make.
