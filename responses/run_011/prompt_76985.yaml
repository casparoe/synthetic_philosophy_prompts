  2.  **Analyze the Draft:**
      *   **Title:** "The Daughter Who Keeps the Books" (Metaphor unclear in context, maybe refers to astrology keeping the books for astronomy? Needs checking).
      *   **Section 1 (Standard Picture):** Kepler as transitional, astrology as economic scaffolding.
      *   **Section 2 (Argument):** Astrology as physical hypothesis, harmonic mechanism, geometric angles, Earth's faculty/soul. Continuity with *Harmonice Mundi*.
      *   **Section 3 (Reform):** Pruning traditional practice (*De Fundamentis*, *Tertius*). Signs/houses go, aspects stay. Weather/temperament stay, specific prediction goes.
      *   **Section 4 (Failure):** Astronomy had Mars data; astrology lacked scoring. Exempted from discipline.
      *   **Section 5 (Distinction):** Evaluative diffuseness vs. Falsifiability. Scoring vs. Logical form.
      *   **Section 6 (Test Case):** Mother's witchcraft trial. Evidential standards there vs. almanacs.

  3.  **Address Question 1: Accuracy (Sections 2, 3, 6)**
      *   *Section 2 (Mechanism):* "Excitation of a faculty... by angular configuration." This is largely correct (*De Fundamentis*). Kepler posits a "ray" aspectus, but it's geometric harmony affecting the Earth's soul/faculty. *Correction:* It's not *just* straightedge/compass constructible figures; it's specifically harmonic ratios (musical consonances). The draft says "figures constructible... and hence harmonic." Kepler links geometry to harmony, but the *physical* cause is the harmony. The draft is slightly imprecise but not wrong.
      *   *Section 3 (Reform/Signs/Houses):* "What goes is... the significance of the twelve signs as such, much of the traditional house doctrine." *Critique:* This is too strong. Kepler didn't discard the Zodiac signs entirely; he demoted them. He still used them for location. He attacked the *names* and *mythology* of the signs, and the arbitrary divisions of houses, but he didn't throw out the ecliptic coordinates. He kept the aspects (conjunction, sextile, square, trine, opposition). He definitely attacked the *Arabian points* and lots. *Tertius Interveniens:* It intervenes between the "theoretical sceptics" (who deny all influence) and "practical charlatans" (who promise certainty). The draft says "wholesale rejection as well as wholesale acceptance." This is accurate.
      *   *Section 6 (Mother):* Kepler defended Katharina Kepler (1615-1621). He wrote the *Responsio*. He used legal/rhetorical strategies, attacking witness credibility and procedural errors. *Critique:* Did he use "evidential standards... missing from the almanacs"? He used legal standards of proof. Almanacs are probabilistic by nature (in his view). Comparing legal defense standards to natural philosophical prediction standards is tricky. It's not inaccurate to say he fought for evidence, but claiming it's the *same* standard missing from astrology is a stretch. Astrology for Kepler was natural philosophy, not law.
      *   *Verdict:* Section 3 is the weakest on accuracy regarding "discarding signs." Section 6 is speculative.

  4.  **Address Question 2: Novelty**
      *   *Thesis:* Kepler's astrology is a physical/harmonic hypothesis, not just economic scaffolding.
      *   *Reality:* This is the *standard* scholarly view since Westman (1970s), Field (1980s), and especially Vanden Broecke (2000s). The idea that Kepler reformed astrology based on harmonic principles is the received wisdom among historians of astrology.
      *   *Critique:* Section 2 is not novel. It summarizes Field's *Kepler's Geometrical Cosmology* or Vanden Broecke's *The Limits of Influence*. The "scaffolding" view (Section 1) is the *popular* view, not the *specialist* view. A specialist will roll their eyes at Section 1 as a straw man.
      *   *Verdict:* Low novelty for specialists. High novelty for generalists. The paper needs to acknowledge the existing historiography (Westman, Field, Vanden Broecke) or find a new angle.

  5.  **Address Question 3: The Load-Bearing Distinction (Evaluative Diffuseness)**
      *   *Concept:* Diffuseness of scoring vs. Logical unfalsifiability.
      *   *Popper Collapse:* Popper's falsifiability is about logical possibility of refutation. If scoring is diffuse, refutation is practically impossible, which effectively makes it unfalsifiable in practice. The distinction is semantic.
      *   *Bayesian Collapse:* This is about likelihoods. $P(Evidence | Hypothesis)$ is ill-defined because "Evidence" is a fuzzy set. This is a stronger framing.
      *   *Sociological:* Who scores? The audience.
      *   *Critique:* "Evaluative diffuseness" is a good phrase, but it describes *why* it fails falsification tests, not a separate category. It risks being a distinction without a difference unless tied to *methodological norms* of the time.
      *   *Verdict:* It earns its keep only if framed as a *methodological* failure specific to the practice of prognostication, distinct from the *theoretical* validity of the aspects. Don't call it "not Popper." Call it "methodological looseness in application."

  6.  **Address Question 4: Question-Begging (Section 3)**
      *   *Claim:* Harmonic principle $\rightarrow$ Natural/Judicial split.
      *   *Critique:* Kepler kept "judicial" astrology (predicting human affairs) but restricted it to temperament and broad strokes. He didn't fully split natural (weather) from judicial (politics) in the modern sense; he just made judicial astrology *less specific*.
      *   *Evidence needed:* Quotes from *De Fundamentis* where he explicitly links the rejection of specific predictions to the lack of harmonic basis. He does argue that specific events (e.g., "King X will die") depend on too many variables (free will, secondary causes).
      *   *Risk:* Assuming the split was principled. Kepler was pragmatic. He knew specific predictions failed.
      *   *Verdict:* You need textual evidence that Kepler explicitly tied the *limitation of scope* to the *harmonic theory*, not just to empirical failure.

  7.  **Address Question 5: Anachronism (Section 4)**
      *   *Claim:* Kepler exempted astrology from the discipline he was inventing (modern scientific method).
      *   *Critique:* Yes, this is anachronistic. Kepler didn't think he was inventing "The Scientific Method." He thought he was restoring true natural philosophy.
      *   *Survival:* The charge survives if framed internally: Kepler applied rigorous geometric/observational constraints to *theory* (astronomy) but allowed probabilistic/hermeneutic flexibility to *practice* (astrology). It's a double standard *within his own epistemology*, not relative to ours.
      *   *Verdict:* Reframe as an internal inconsistency in Kepler's epistemic rigor, not a failure to meet modern standards.

  8.  **Address Question 6: Strongest Objection**
      *   *Objection:* The paper sets up a straw man in Section 1. Specialists know Kepler's astrology was theoretical and harmonic. The "economic scaffolding" view is outdated historiography.
      *   *Concession:* Acknowledge Westman/Field/Vanden Broecke in the intro. Pivot the argument to the *tension* between the rigorous theory and the loose practice (Section 4/5), rather than the existence of the theory itself.
