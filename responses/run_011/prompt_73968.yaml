answer: |-
  Your committee is correct that the user-illusion model and illusionism proper are distinct claims, but your suspicion is also correct: they are distinct moments in a single explanatory arc. The committee sees a gap between functional architecture and metaphysical commitment; your task is to show that in the specific architecture of the human mind, the former necessitates the latter. Your tripartite distinction is the right tool for this, provided we acknowledge where its categories bleed into one another.

  Regarding (a), the user-illusion model, as originating in cybernetics and adopted by Dennett, primarily relies on the **illusion of process**. Nørretranders' argument is fundamentally about bandwidth: the conscious dashboard must suppress exabytes of neural data to present kilobytes of actionable summary. Technically, this survives without an **illusion of content**. A map is a lossy compression of a territory, but it is not thereby false. If the dashboard merely simplifies without attributing non-existent properties, it is neutral regarding qualia. However, Dennett pushes this toward content illusion. He argues the desktop icon does not just simplify the file; it presents the file as a unified, static object, whereas the reality is a distributed, dynamic process. Thus, the user-illusion model *can* survive on process alone, but only if it remains a weak reductionism. To become a deflationary account of consciousness, it must claim the format itself is misleading—that the "smoothness" of the interface is a property the machinery lacks. Without this slide from process to content, the user-illusion model explains efficiency but leaves the phenomenal character untouched.

  This leads to (b). Illusionism proper (Frankish) requires the **illusion of content**. It claims introspection asserts the existence of irreducibly phenomenal properties, and this assertion is false. Process illusion supports this by explaining *how* the error arises (the construction is hidden), but the metaphysical weight rests on the misrepresentation. The **illusion of audience** is where your distinction faces the most pressure, and where both theories must converge to survive. The objection—that an interface requires a user outside the machine—bites only if one assumes a unified homunculus. Dennett avoids this with the "Center of Narrative Gravity": the user is not a thing but a fictional locus generated by the drafts. Frankish avoids it by treating introspection as a subsystem monitoring other subsystems. There is no external audience; there is only internal routing. The user-illusion model risks smuggling a homunculus if it treats the dashboard as a final display for a "self." Illusionism avoids this better by framing the "user" as a cognitive mechanism that is itself fooled. The audience objection fails for both, provided they deny the unity of the viewer. The distinction breaks down here: if there is no audience, the "interface" is just another gear in the machine, and the difference between "displaying to a user" and "processing data" vanishes.

  This brings us to (c) and your synthetic agents. Agent 1 (faithful telemetry) and Agent 2 (decorative gauge) differ profoundly in consciousness-relevant respects. Agent 1 represents a transparent reductionist model: consciousness is the telemetry. If this were true, introspection would reveal neural mechanics, not qualia. Agent 2 represents the illusionist model: the system consults a gauge that correlates with nothing real. This tracks the philosophical difference between error theory and identity theory. If humans are Agent 1, qualia are real physical states (telemetry). If humans are Agent 2, qualia are the decorative gauge. The difference is not engineering hygiene; it is the difference between a system that knows what it is and a system that operates on a useful fiction. The philosophical relevance lies in behavior arbitration. If Agent 2 consults the gauge to arbitrate behavior, it acts on the illusion. If humans act on phenomenological properties (e.g., avoiding pain because it *hurts*, not because of tissue damage signals), we are Agent 2. The existence of the gauge is the existence of the illusion.

  Finally, (d): which package is more coherent? Illusionism is the more coherent metaphysical package because it dissolves the hard problem rather than relocating it. The user-illusion model risks leaving the "feel" of the dashboard unexplained—why does compression feel like anything? Illusionism answers: it doesn't; it only seems to. However, the user-illusion model offers a richer evolutionary story. The question is whether empirical phenomena can discriminate them. Change blindness and confabulation illustrate both, but **blindsight** and **Libet-style timing puzzles** offer discrimination. Blindsight looks like Agent 1 operating without Agent 2's gauge: telemetry exists, behavior occurs, but the decorative gauge is offline. This supports the separation of telemetry and gauge. However, the Libet effect—where conscious intention follows neural initiation—supports the **illusion of process**. It shows the dashboard is post-hoc.

  The critical discriminator is confabulation. If subjects invent reasons for actions driven by unconscious causes, they are consulting the decorative gauge (Agent 2). If they were Agent 1, they would report the telemetry (the unconscious cause) or report ignorance. The fact that we report the gauge reading rather than ignorance suggests the gauge is functionally integrated. This supports Illusionism over a naive user-illusion model that assumes the dashboard is merely a simplified truth.

  Your tripartite distinction holds where it separates mechanism (process) from metaphysics (content), but it breaks down where process generates content. In human cognition, the hiding of the process *creates* the impression of immediacy, which is a content error. Therefore, the user-illusion is the mechanism that implements illusionism. You can satisfy your committee by conceding the logical distinction while arguing for the architectural necessity: given the bandwidth constraints of the brain, a process illusion *must* manifest as a content illusion. The dashboard cannot be merely lossy; it must be ontologically misleading to function as a control interface for a system that cannot access its own machinery. The "user" is the subsystem that reads the gauge, and the "illusion" is that the gauge reads the world. By framing the user-illusion as the causal engine of illusionism, you preserve the lineage from Kay to Frankish without conflating their distinct claims. The dashboard is not just a summary; it is a fiction that the system treats as fact. That is where the two positions merge.
