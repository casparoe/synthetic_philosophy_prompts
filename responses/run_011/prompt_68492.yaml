answer: |-
  **Brainstorming: Load-Bearing Premises & Vulnerabilities**
  P1 (Self-determination ≠ Ranking) is the normative core; Walzerians will attack this as question-begging. P2 (Cap = Tempo) is the empirical claim; CRT and Kantians will attack this as false neutrality. P3 (Selection = Ranking) is the definitional move; Empirical scholars will attack this as naive. You can revise P2 to acknowledge queue biases without surrendering the asymmetry, but P1 must hold or the thesis collapses. The "duty to mitigate" is your escape hatch for the Kantian, but it invites enforcement objections. Protect the distinction between *delay* (impersonal) and *judgment* (personalized standing); that is the only line that matters.

  ***

  **Q&A Prep: Objections Ordered by Damage Potential**

  **1. The CRT Objection (The Distinction Collapse)**
  *   **Who:** Postcolonial/Critical Race Theorist.
  *   **Objection:** "You claim a cap is neutral tempo, but a queue sorts by who can afford to wait, who has papers, and who lives near the border; calling that 'delay' rather than 'ranking' is just laundering privilege through procedural neutrality."
  *   **Reply:** "I concede the queue is not morally pure; no mechanism is. But there is a categorical difference between a barrier that imposes a cost on everyone equally (time) and a barrier that evaluates moral worth based on traits (skills/origin). My claim isn't that queues are just, but that they do not exercise the state's authority to rank human standing. We can mitigate queue biases without reinstating composition selection."
  *   **Strategy:** Hold the core, concede the empirical reality.
  *   **Softest Point:** Asserting that time costs are "equal" when wealth buys speed (lawyers, visas).

  **2. The Kantian Objection (The Ruin Constraint)**
  *   **Who:** Cosmopolitan Right Scholar.
  *   **Objection:** "A cap is mass refusal by another name; if the aggregate effect of your 'tempo' is that strangers face ruin abroad, you have violated cosmopolitan hospitality regardless of whether you ranked them individually."
  *   **Reply:** "I agree that necessity defeats the cap; that is built into premise four. But the duty to avoid ruin does not entail a duty to admit all. It entails a duty to mitigate the conditions creating the demand to move. The cap is legitimate only if paired with external justice; without that, you are right, it becomes impermissible refusal."
  *   **Strategy:** Concede the conditionality of the cap.
  *   **Softest Point:** Defining "mitigation" sufficiently to prevent "ruin" without open borders.

  **3. The Walzerian Objection (The Cultural Defense)**
  *   **Who:** Communitarian (Walzerian).
  *   **Objection:** "Premise one is question-begging; a community cannot maintain its shared meaning and political culture without selecting for members who align with those values, otherwise self-determination is empty."
  *   **Reply:** "Self-determination is about shaping institutions, not sorting souls. You can protect a political culture through civic integration and public reason after admission without gatekeeping based on origin or skill. Selection assumes culture is static and fragile; I argue it is robust enough to withstand open composition so long as the tempo is manageable."
  *   **Strategy:** Hold firm on P1.
  *   **Softest Point:** Explaining how culture survives without any filtering mechanism.

  **4. The Empirical Objection (The Perverse Incentive)**
  *   **Who:** Migration Policy Scholar.
  *   **Objection:** "If you ban selection, states won't adopt your fair cap; they will simply lower the cap to zero or increase enforcement violence to achieve the same compositional outcomes indirectly."
  *   **Reply:** "That is a prediction about bad faith actors, not a normative justification for selection. We do not justify discriminatory laws because racists might circumvent non-discriminatory ones. However, my requirement for transparency and revisability is designed to expose such bad faith to domestic and international scrutiny."
  *   **Strategy:** Hold the norm, acknowledge the risk.
  *   **Softest Point:** Offering no mechanism to punish states that lower caps to zero.

  **5. The Necessity Objection (The Adjudication Problem)**
  *   **Who:** Immigration Lawyer.
  *   **Objection:** "You say caps are defeated by claims of necessity; who adjudicates that? If it's the state, you've reintroduced selection discretion; if it's a court, you've judicialized the border."
  *   **Reply:** "Adjudicating necessity is not selecting composition. It is recognizing an overriding claim that suspends the rule, like asylum currently does. The discretion is bounded by the specific threat to the individual, not the utility of the individual to the state. That is a legal judgment, not a political ranking."
  *   **Strategy:** Hold.
  *   **Softest Point:** Distinguishing "necessity" from "hardship" in practice.

  **6. The Family Reunification Objection (The Counterexample)**
  *   **Who:** Law/Policy Hybrid.
  *   **Objection:** "Surely you allow selection for family reunification; but that is selecting based on a trait (kinship), which violates your ban on composition selection."
  *   **Reply:** "Family reunification is not about the state ranking the migrant's worth, but honoring the existing rights of current members. It is a derivative right of the citizen, not a selection criterion imposed on the stranger. It falls under 'terms of association' rather than 'ranking of persons'."
  *   **Strategy:** Concede this is a specific exception grounded in member rights.
  *   **Softest Point:** Defining the limit of "family" without slipping into cultural selection.

  **7. The Global Duty Objection (The Enforcement Gap)**
  *   **Who:** Global Justice Theorist.
  *   **Objection:** "You pair the cap with a duty to mitigate global inequality; but there is no global sovereign to enforce that duty, making the cap illegitimate by your own standards."
  *   **Reply:** "The lack of enforcement doesn't negate the duty; it makes the cap provisional. States retain the right to cap only insofar as they are actively discharging that duty through aid, trade, or climate policy. If they cease mitigation, they forfeit the right to exclude. The legitimacy is conditional, not absolute."
  *   **Strategy:** Hold the conditionality.
  *   **Softest Point:** Defining "active discharge" sufficiently to avoid loopholes.

  ***

  **The Question I Hope Nobody Asks**
  "If the right to exclude is derived from the self-determination of a demos, and the demos is constituted by the very boundary you are trying to regulate, aren't you caught in a circle? You need the boundary to justify the cap, but you need the cap to justify the boundary."
  *Why it's worse:* It attacks the foundational legitimacy of the political community itself, not just the migration rule. If I can't answer this, the "right to cap" dissolves entirely. It requires a theory of democratic boundaries I haven't fully developed in the paper.

  ***

  **Pre-emptive Concession (Opening of Talk)**
  "I want to acknowledge from the start that a queue is not morally neutral; it favors those with the resources to wait, and I do not claim otherwise. Nor do I claim that states will act in good faith without robust external scrutiny. My argument is not that caps are perfectly just, but that they are categorically distinct from selection, and that distinction is the only leverage we have to limit state power over human standing."
