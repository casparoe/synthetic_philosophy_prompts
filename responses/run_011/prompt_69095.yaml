answer: |-
  **Joint Statement on the Proposed Drug Policy Pilot**

  **1. Shared Claims**

  We, the undersigned, submit this joint statement to the Town Council. We disagree on the ultimate goal of drug policy, but we agree on the following premises regarding this specific pilot:

  1.  **The current system causes harm.** We agree that the current prohibition model contributes to the 63 fatal overdoses recorded last year. The Prohibitionist signs this acknowledging that enforcement ruins lives; the Advocate signs this acknowledging that most misery is manufactured by the black market.
  2.  **The pilot may increase usage.** We agree that changing the law may signal community approval, potentially raising the number of users. The Advocate signs this admitting legal availability could raise use; the Prohibitionist signs this admitting enforcement alone cannot stop all use.
  3.  **Price and Access are linked.** We acknowledge that "Price" (money and risk) and "Access" (ease of obtaining) are not fully separable. Lowering the risk of arrest lowers the price, which increases access. We will use the three-channel framework (Access, Price, Permission) where possible, but acknowledge this overlap.
  4.  **The design limits proof.** Because all four parts of the pilot start at once, we cannot establish which specific part caused any change in outcomes. We can measure the whole, not the parts.

  **2. Disagreements Table**

  | Issue | Prohibitionist Position | Advocate Position | Genuine or Verbal? | What Would Move It | Component |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Overdose Deaths** | Deaths will rise above 63/year because availability signals safety. | Deaths will fall below 63/year because supply is safer and records don't block help. | Genuine | Annual mortality data compared to last year's 63. | (b) & (d) |
  | **New Users** | Youth usage will rise significantly due to lost Permission signal. | Youth usage will stay flat; Price and Access matter more than signals. | Genuine | Survey data on initiation rates among under-25s. | (c) & (a) |
  | **Arrests & Records** | 1,100 possession arrests are a necessary cost to maintain the Permission signal. | 1,100 possession arrests are unnecessary harm that blocks employment and housing. | Genuine | Review of whether civil fines achieve deterrence without criminal records. | (a) |
  | **Treatment Demand** | The 400 existing beds will be overwhelmed by new addicts seeking free care. | The 400 beds will suffice because the 9-week wait list will shrink as users stabilize. | Verbal | Waitlist duration and bed occupancy rates. | (d) & (b) |

  **3. Cruxes**

  These are the specific questions where evidence from the pilot could change our minds. We commit to these predictions in advance.

  *   **Crux 1: Fatal Overdoses**
      *   **Sub-question:** Does removing the black market reduce death more than increased availability raises it?
      *   **Measure:** Total fatal overdoses in the town per year.
      *   **Prediction:** Prohibitionist predicts >63 deaths. Advocate predicts <63 deaths.
      *   **Channel:** Primarily **Access** (safety of supply) vs. **Permission** (volume of use).

  *   **Crux 2: Treatment Capacity**
      *   **Sub-question:** Does decriminalisation bring hidden users into treatment, or does it create new patients?
      *   **Measure:** The waiting list for the 400 residential treatment places.
      *   **Prediction:** Prohibitionist predicts the 9-week wait will extend to 6 months. Advocate predicts the wait will drop to 2 weeks.
      *   **Channel:** **Price** (risk of record stops people seeking help) vs. **Access** (easier drugs mean more patients).

  *   **Crux 3: Cannabis Initiation**
      *   **Sub-question:** Does regulated retail normalize use for non-users?
      *   **Measure:** Number of new registered buyers in the first year.
      *   **Prediction:** Prohibitionist predicts a 20% increase in unique buyers. Advocate predicts a 5% increase (mostly existing users switching).
      *   **Channel:** **Permission** (law signals approval) vs. **Price** (convenience vs. black market).

  **4. Closing: Words and Definitions**

  Much of our eleven-year argument was verbal. We used the same words to mean different things. To prevent this during the pilot evaluation, we stipulate the following definitions:

  *   **Decriminalisation:** Possession results in a civil fine only, with no arrest and no criminal record. **Neutrality:** Neutral. Both agree this is the mechanism described in part (a).
  *   **Legalization:** A regulated retail market with tax, plain packaging, and no advertising. **Neutrality:** Neutral. Both agree this describes part (c).
  *   **Harm Reduction:** Actions taken to reduce the negative consequences of drug use without necessarily requiring abstinence. **Neutrality:** Favors the **Advocate**. The Prohibitionist views abstinence as the only true reduction of harm, but accepts this definition for the sake of the pilot's medical components.
  *   **Addiction:** A state where drug use continues despite significant harm to the user's life and health. **Neutrality:** Favors the **Prohibitionist**. The Advocate prefers a definition based on physical dependence alone, but accepts this broader definition because it captures the social misery both wish to reduce.

  We sign this not because we agree on the outcome, but because we agree on the question.

  **Signed:**

  __________________________ (Prohibitionist)

  __________________________ (Advocate)
