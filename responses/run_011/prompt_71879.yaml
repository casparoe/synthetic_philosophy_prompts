  3. Hypothesis (c) rightly notes the group conflicts over whether deviations from Molyneux's stipulations, such as using children with poor acuity, invalidate the empirical data. This is an empirical question in disguise about robustness, meaning skeptics commit to strict idealization conditions while proponents commit to the principle holding across messy biological realizations, so a distinction between testing logical possibility versus developmental trajectory would resolve whether Prakash subjects are relevant proxies.

  4. Hypothesis (d) is accurate that there is confusion over whether discriminating shapes, identifying them, or matching them across modalities constitutes the same cognitive achievement. This is a verbal ambiguity regarding the verb "see," where one side equates discrimination with recognition while the other requires explicit categorization without tactile confirmation, so a change of question specifying the exact behavioral output required would eliminate the slippage.

  5. The sides diverge on whether "immediate" success allows for the rapid learning curve observed in Project Prakash rather than literal instant recognition. This is a verbal dispute about time scales where empiricists accept days as instant relative to development while philosophers insist on the literal moment, so resolving the architecture question in Item 1 would collapse this distinction automatically.
