answer: |-
  It is a pleasure to receive your letter and to think through this with you, for the metaphor your colleague deployed is indeed one of those heavy pieces of historiographical furniture that we often move around without ever checking if its legs are level. To audit the analogy as you ask, we must first lay out the mapping your colleague intends, for without that structure the disanalogies cannot be properly weighed. In his telling, Saturn stands for the Revolution itself, conceived not merely as a sequence of events but as a singular agent or entity with a coherent will. The children of Saturn correspond to the revolutionary leadership, the Girondins, Hébertists, Dantonists, and finally the Robespierrists, who are born of the Revolution and nurtured by its early ideals. The prophecy that drives Saturn to devour them maps onto the ideological premises your colleague identified, specifically the concept of the unitary general will and the equation of dissent with conspiracy, which functions as a fate that the Revolution cannot escape. The act of devouring is the Terror, and the guillotine is the mouth or the instrument of that consumption. Finally, the motivation for the eating, which in the myth is the preservation of Saturn's rule against a predicted usurper, is mapped onto the Revolution's drive for self-preservation and purity. When your colleague says the metaphor does evidential work, he is claiming that this mapping is not just decorative but explanatory, suggesting that the structure of the myth reveals the structure of the history.

  However, when we press on the disanalogies, as you rightly suggest we must, the explanatory power begins to leak. The first of your three points concerns the psychology of the devourer. In the myth, Saturn acts out of a specific, personal fear of being overthrown by his offspring, a preemptive strike based on a prophecy. By mapping this onto the Revolution, the analogy imputes a singular, unified psychology to a fractured and often contradictory political movement. It suggests that the Committee of Public Safety or the Jacobin Club possessed a collective mind capable of fearing for its own survival in the way a father fears a son, and that this fear was the primary engine of the killings. This quietly assumes the conclusion your colleague is arguing for, which is that the ideology itself created a paranoid unity. In reality, the fear was often genuine and external, driven by the advance of Prussian armies or the revolt in the Vendée, rather than an internal, mythic necessity. The analogy collapses the distinction between a rational, albeit brutal, response to existential threats and a pathological acting out of an ideological script. It makes the Revolution seem like a monster with a mind, rather than a series of desperate decisions made by men who often disagreed on what the general will actually was.

  The second disanalogy, regarding timing, is perhaps even more damaging to the circumstantial argument your colleague opposes. Saturn devours his children immediately at birth to prevent them from ever growing strong enough to challenge him. If the Revolution were truly Saturn in this sense, the purges should have begun in 1789 or at the latest with the founding of the Republic in 1792, targeting the founders before they could establish their own power. Instead, the Terror arrived in 1793 and 1794, four years into the process, and only after the external enemies had been checked at Valmy and the Republic had secured its footing. The delay suggests that the devouring was not an intrinsic property of the Revolution's birth but a reaction to the specific pressures of the Year II, the economic collapse, and the military emergencies. The myth implies an inevitability that starts at the beginning, whereas the history shows an escalation that correlates with the intensification of the crisis. By ignoring this gap between birth and devouring, the analogy smuggles in the idea that the end was present in the beginning, which is precisely the point at issue between the ideological and circumstantial accounts.

  Your third point about the outcome of the myth also undermines the colleague's usage. In the story of Saturn, the devouring ultimately fails. One child, Zeus, is saved, hidden, and returns to force Saturn to disgorge the others and depose him. If the analogy holds consistently, it promises a surviving heir who will overthrow the Revolution and restore a stable order, perhaps pointing to Thermidor or the Directory. But your colleague uses the metaphor to illustrate the self-destruction of the Revolution, not its succession. He wants to say the Revolution ate itself and died, but the myth says the children survive and the father falls. Furthermore, if Robespierre is the last child eaten, who is the Zeus that overthrows him? Thermidor was not a restoration of the old revolutionary purity but a rejection of it. The myth implies a cyclical restoration of justice where the devourer is punished, but the historical reality was a messy dissolution of revolutionary energy into bureaucracy and eventually military dictatorship. The analogy, pressed to its logical conclusion, predicts a resurrection of the devoured ideals which did not happen, or a punishment of the Revolution that was far more ambiguous than the defeat of Cronus.

  Beyond these structural disanalogies, we must also question the identity of the devoured, as you noted. The metaphor focuses our camera entirely on the famous deputies, the men who sat in the Convention and argued over virtue and law. They are the visible children. But the bulk of those killed in the Year II were not the fathers of the Revolution but its subjects: peasants in the Vendée, federalist rebels, priests, and common suspects caught in the net of the Law of Suspects. These people were not children of the Revolution in the sense of being its progeny or heirs; they were often its victims or its opponents. By restricting the scope of the metaphor to the elite factional struggles, the image sanitizes the Terror, turning a broad social bloodletting into a refined tragedy of leadership. It makes the Terror seem like a family dispute rather than a state violence against the population. This narrowing is necessary for the Saturn analogy to work, because Saturn eats his own kin, not his subjects, and this requirement forces the historian to ignore the thousands of deaths that do not fit the familial model.

  When we ask whether the conclusion your colleague licenses survives these disanalogies, the answer is that the analogy cannot discriminate between intrinsic radicalization and contingency because it is not built to measure causality. It is a description of an outcome, not an explanation of a process. It looks like evidence because it is vivid, but it is actually a restatement of the ideological thesis dressed in classical imagery. It asserts that the Revolution had an appetite for its own, but it does not prove that the appetite was innate rather than induced by hunger and war. A better figure might indeed be your candidate of the escalatory auction. In an auction, the price of safety climbs because each bidder must outbid the others to win the lot, which in this case is political survival and the mantle of true patriotism. This captures the dynamic of the factional struggles without imputing a singular mythic psychology to the Revolution. It explains why moderate positions became impossible not because of a prophecy, but because the competitive logic of the clubs and the sections demanded ever more extreme displays of virtue. It accounts for the timing, as the bidding only becomes frantic when the stakes are high, and it explains why the bidders are eventually priced out, leading to the closure of the auction at Thermidor.

  However, while the auction is analytically superior in explaining the mechanism of the purges, it lacks the tragic weight that the Saturn image carries, specifically the double valence you mentioned. Saturn was not only the devourer of children but also the ruler of a Golden Age, a time of plenty and peace before the conflict with the Olympians. This duality captures something the auction misses, which is the genuine utopian promise of 1789. The Revolution did offer a vision of a golden age, of liberty and equality, and the tragedy is that the instrument of that promise became the instrument of death. The auction metaphor describes a process of competition, but it does not capture the betrayal of the ideal. The Saturn metaphor, for all its flaws, holds together the hope and the horror in a single figure, reminding us that the Terror was not just a political malfunction but a corruption of a specific vision of human perfection. The auction explains how they killed each other; Saturn reminds us why it feels like a sin.

  To answer your final question on what would change my verdict, I would need to see evidence that the ideological commitments of 1789 made the Terror inevitable regardless of the external circumstances. If it could be demonstrated that the Jacobins would have instituted the Revolutionary Tribunal and the Law of Suspects even without the war with Austria, the civil war in the Vendée, or the economic collapse of the assignat, then the Saturn analogy would gain significant traction. Specifically, a reading of the sequence from 1789 to Prairial that showed the purges were planned or theorized before the crises of 1793 would suggest that the devouring was indeed intrinsic to the birth of the Republic. Without that, the analogy remains a poetic restatement of the ideological position rather than a proof of it. As for where my own audit is most likely to be wrong, I suspect I may be underestimating the power of the idea of the General Will to compel action independent of material conditions. I have leaned towards the circumstantial account in this analysis, assuming that the fear was primarily reactive, but it is possible that the ideological framework was so rigid that it interpreted all contingency as conspiracy, effectively making the circumstances irrelevant to the actors' perceptions. If the revolutionaries truly believed that any opposition was a plot against the people, then the war and the famine were not causes but merely occasions that triggered a pre-existing logical trap. In that case, the prophecy of Saturn would be internal to their minds, and the devouring would indeed be fated by their own premises, making the analogy more robust than I have allowed.
