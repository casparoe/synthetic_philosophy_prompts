      *   *The "Slide" in (5)->(6):* The slide is assuming that the *specific* correlation needed to hide non-locality in Bell tests implies *unrecoverable* confounding in all other experiments.
      *   *Refinement:* The strongest objection to the colleague's argument is that it conflates "statistical independence fails" with "science is impossible." Science is possible if the dependence is law-like.

