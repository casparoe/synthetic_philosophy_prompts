      *   There is a distinction between *Logical* possibility and *Plausibility*.
      *   The colleague's argument is logically valid *if* you accept the premise that "correlation implies unresolvable confounding."
      *   But in a deterministic universe, correlation implies *causal connection*. Causal connections are the bread and butter of physics.
      *   So, (7) is the false premise. Correlations don't prevent generalizations; they *are* the generalizations we seek.
      *   *Wait, one nuance:* In Bell tests, the correlation must be between the *setting* and the *particle source*. In a standard experiment (measuring mass), we correlate setting (scale) with object. The worry is that the scale reading is correlated with the object's mass *via a hidden common cause that mimics the law we are trying to find*.
