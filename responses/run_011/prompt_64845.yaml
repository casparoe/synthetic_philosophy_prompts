answer: |-
  # Exam Question: Harsanyi's Aggregation Theorem

  **Time:** 90 Minutes
  **Total Marks:** 25

  **Stem:**
  Consider a fixed finite population $N = \{1, \dots, n\}$ with $n \geq 2$. Let $X$ be a finite set of basic prospects. Let $\mathcal{L}$ be the set of all simple lotteries over $X$.
  For each individual $i \in N$, there is a preference ordering $\succeq_i$ over $\mathcal{L}$ satisfying the von Neumann-Morgenstern (vNM) axioms, represented by a utility function $u_i: \mathcal{L} \to \mathbb{R}$, unique up to positive affine transformation.
  There is a Social Observer with preference ordering $\succeq_0$ over $\mathcal{L}$, also satisfying the vNM axioms, represented by $u_0: \mathcal{L} \to \mathbb{R}$.

  **Part A (10 Marks)**
  1.  State the **Pareto Indifference** principle and the **Anonymity** condition precisely in terms of the utility functions provided above.
  2.  Using the linearity of vNM utility functions, derive the conclusion that $u_0$ must take the form of a weighted sum of individual utilities: $u_0(L) = \sum_{i=1}^n a_i u_i(L) + b$. Explain explicitly what role Anonymity plays in determining the weights $a_i$, and what form the conclusion takes if Anonymity is dropped.
  3.  Distinguish between the **Ex Ante Pareto** route (ranking lotteries based on expected utility profiles) and the **Ex Post Pareto** route (ranking outcomes state-by-state). Explain why these approaches may come apart if individuals hold different subjective beliefs about the lotteries. What extra structure is required to ensure the linear aggregation form remains consistent across both approaches (Hammond's point)?

  **Part B (15 Marks)**
  Harsanyi's result is a representation theorem, not a free-standing moral argument. The claim that "utilitarianism is a theorem of rationality" relies on interpreting the formal premises normatively.
  Identify and analyze **four** specific points where substantive normative assumptions are smuggled into the formal setup or the interpretation of the result. For each point, explain why the formal theorem alone does not settle the moral question. You may draw from the following list or identify your own:
  *   The identification of the Observer's ranking with the moral ranking.
  *   The interpretation of $u_i$ as well-being versus extended preferences.
  *   The source of equal consideration (Anonymity vs. Rationality).
  *   The assumption of fixed population versus variable population ethics.
  *   The requirement of common probabilities for Ex Ante consistency.

  ***

  # Marking Scheme

  **Part A (10 Marks)**
  *   **Definitions (3 marks):**
      *   Pareto Indifference: $\forall L, L' \in \mathcal{L}$, if $u_i(L) = u_i(L')$ for all $i$, then $u_0(L) = u_0(L')$. (1 mark)
      *   Anonymity: For any permutation $\pi$ of $N$, if $u_i(L) = u_{\pi(i)}(L')$ for all $i$, then $u_0(L) = u_0(L')$. (Or: weights $a_i$ must be equal). (1 mark)
      *   Clarity/Precision of notation. (1 mark)
  *   **Derivation (4 marks):**
      *   Notes that $u_i$ are linear in probabilities. (1 mark)
      *   Argues that $u_0$ respecting Pareto Indifference implies $u_0$ is functionally dependent on the vector $(u_1, \dots, u_n)$. (1 mark)
      *   Concludes linearity of $u_0$ implies linear combination: $u_0 = \sum a_i u_i + b$. (1 mark)
      *   States that Anonymity forces $a_i = a_j$ (Equal weights); without it, only Weighted Utilitarianism follows. (1 mark)
  *   **Ex Ante/Ex Post (3 marks):**
      *   Identifies that Ex Ante relies on expected utility comparisons, Ex Post on outcome comparisons. (1 mark)
      *   Notes that if beliefs (probabilities) differ, Ex Ante Pareto can conflict with vNM rationality for the observer. (1 mark)
      *   Hammond's Point: Consistency requires common subjective probabilities across individuals and observer. (1 mark)

  **Part B (15 Marks)**
  *   **4 Points Analyzed (12 marks):** 3 marks per distinct, correctly analyzed crux.
      *   Must identify the premise *and* explain why it is normative, not formal.
      *   *Example:* "Anonymity provides equal weights, but Anonymity is a moral constraint, not a rationality axiom. Rationality alone permits weighting some agents higher."
  *   **Synthesis/Depth (3 marks):**
      *   Connecting the points to the overarching claim ("theorem of rationality").
      *   Avoiding category errors (see Wrong Turns).

  **Wrong Turns (Deduct 2-5 marks each if present)**
  *   **The "Rationality Alone" Error:** Claiming the theorem derives utilitarianism without normative premises.
  *   **Conflation:** Treating the Aggregation Theorem (given preferences) and Impartial Observer Theorem (deriving preferences) as identical.
  *   **Irrelevant Objections:** Invoking Utility Monsters or Repugnant Conclusion (these target the *outcome* of utilitarianism, not the *derivation* from Harsanyi's specific axioms).
  *   **Comparability Confusion:** Asserting the theorem assumes interpersonal comparability of *levels* (it assumes comparability of *differences* via the Pareto condition on vNM scales) or that it begs the question entirely without distinguishing the extended preference route.
  *   **Prioritarianism Error:** Asserting the theorem refutes prioritarianism (it doesn't; prioritarianism transforms $u_i$ before summing, which violates the specific vNM linearity premise but is morally coherent) or that prioritarianism is untouched (it is touched because it violates the specific vNM aggregation form).

  **A vs B Differentiation**
  *   **B Grade:** Correctly states the math in Part A. In Part B, lists the normative premises but treats them as a checklist. May conflate the Impartial Observer argument with the Aggregation theorem.
  *   **A Grade:** In Part A, explicitly links the linearity of the derivation to the vNM independence axiom. In Part B, distinguishes between the *structure* of aggregation (linear sum) and the *currency* of aggregation (welfare vs. preference). Explicitly notes that Anonymity is the sole carrier of "equality," isolating rationality as merely the carrier of "consistency."

  ***

  # Model Answer

  **Part A**
  **1. Definitions:**
  **Pareto Indifference:** For any two lotteries $L, L' \in \mathcal{L}$, if $u_i(L) = u_i(L')$ for all individuals $i \in N$, then $u_0(L) = u_0(L')$.
  **Anonymity:** For any lotteries $L, L'$ and any permutation $\pi$ of the population $N$, if the utility profile of $L$ is a permutation of the utility profile of $L'$ (i.e., $u_i(L) = u_{\pi(i)}(L')$ for all $i$), then $u_0(L) = u_0(L')$.

  **2. Derivation:**
  Since all agents satisfy the vNM axioms, their utility functions $u_i$ and $u_0$ are linear in probabilities. Let $p$ be the probability vector over $X$. Then $u_i(p) = \sum_{x \in X} p(x)u_i(x)$.
  Pareto Indifference implies that $u_0$ is constant on the level sets of the vector function $U(p) = (u_1(p), \dots, u_n(p))$. Thus, $u_0$ is a function of $U$. Because $u_0$ must also satisfy the vNM independence axiom, it must be linear in probabilities. The only functions of linear functions that preserve linearity are linear combinations. Therefore, there exist constants $a_1, \dots, a_n$ and $b$ such that:
  $$u_0(L) = \sum_{i=1}^n a_i u_i(L) + b$$
  **Role of Anonymity:** Anonymity requires that the observer's ranking be invariant to who holds which utility. If we swap $u_i$ and $u_j$, $u_0$ must remain unchanged. This forces $a_i = a_j$ for all $i, j$. Thus, under Anonymity, $u_0$ is a simple sum (Classical Utilitarianism). If Anonymity is dropped, the theorem only supports **Weighted Utilitarianism**, where rationality permits prioritizing specific individuals ($a_i \neq a_j$).

  **3. Ex Ante vs. Ex Post:**
  The **Ex Ante** approach applies Pareto to expected utilities (before uncertainty resolves). The **Ex Post** approach applies Pareto to utilities in each state of the world (after resolution).
  If individuals have different subjective probabilities regarding the lotteries, these approaches diverge. A lottery might look Pareto-superior ex ante (higher expected utility for all) but Pareto-inferior ex post in every realized state.
  **Hammond's Point:** For the linear aggregation form to be consistent with Ex Ante Pareto while respecting vNM rationality for the observer, all individuals and the observer must share **common subjective probabilities**. If beliefs differ, satisfying Ex Ante Pareto requires the observer to violate the vNM independence axiom or adopt a non-linear aggregation rule.

  **Part B**
  The claim that "utilitarianism is a theorem of rationality" fails because the formal premises carry hidden normative weight. Four specific cruxes follow:

  **1. The Observer's Authority:** The theorem proves that *if* a Social Observer satisfies vNM and Pareto, *then* they rank like a utilitarian. It does not prove we *ought* to adopt the Observer's ranking as the moral truth. Identifying the Observer's coherent preferences with "morality" is a substantive meta-ethical claim, not a formal result. A moral skeptic could accept the math but reject the Observer's authority.

  **2. Welfare vs. Extended Preferences:** The theorem sums $u_i$. Are these functions measures of well-being (hedonic/welfare) or satisfied preferences? Harsanyi often relies on "extended preferences" (preferences about being in another's situation) to establish interpersonal comparability. However, aggregating extended preferences is coherent only if we assume individuals' attitudes toward others are morally relevant. If $u_i$ includes sadistic preferences, summing them is formally valid but morally abhorrent. The theorem does not filter the *content* of the utility, only the *structure*.

  **3. Equality is Anonymity, Not Rationality:** As shown in Part A, dropping Anonymity yields Weighted Utilitarianism. The vNM axioms (completeness, transitivity, continuity, independence) are axioms of individual consistency. None of them entail that persons count equally. Equal consideration is introduced solely by the Anonymity constraint. Therefore, equality is a moral input, not a rational output. Rationality alone is compatible with caste systems, provided they are consistently weighted.

  **4. Fixed Population:** The theorem assumes a fixed $N$. It is silent on population ethics (changing $n$). Most contemporary debates (e.g., Repugnant Conclusion) concern variable populations. Because the theorem cannot handle the creation of new agents, it cannot justify Utilitarianism as a *complete* moral theory, only as a theory of distribution among existing agents.

  **Conclusion:** The theorem shows that Utilitarianism is the unique *representation* of a specific set of constraints. But since Anonymity and the identification of the Observer are moral choices, Utilitarianism is not a theorem of rationality alone; it is a theorem of Rationality + Specific Moral Premises.

  ***

  # Instructor Notes & Crux Check

  **On the Cruxes:**
  Your list of five cruxes is robust. I did not remove any, but I prioritized **Observer Authority**, **Welfare vs. Preference**, **Anonymity**, and **Fixed Population** for the Model Answer.
  *   *Correction on "Extended Preferences":* Be careful grading this. The **Aggregation Theorem** (Part A) usually assumes $u_i$ are given. The **Impartial Observer Theorem** is what uses extended preferences to *generate* the $u_i$ and establish comparability. Students who conflate these two theorems should lose marks (as per the "Wrong Turns" scheme). A strong student will note that the Aggregation Theorem *presupposes* the success of the Impartial Observer argument to make sense of the $u_i$ scale.
  *   *Probability Agreement:* This is the most technical crux. In a Phil/Econ mix, Econ students should nail this (Part A.3), while Phil students should focus on the normative implications in Part B. I included it in Part A to ensure everyone engages with the technical constraint.

  **Why this works:**
  The prompt forces the math in Part A so they can't hand-wave the "theorem" part. Part B forces them to isolate the "ought" from the "if." The specific penalty for "Utility Monsters" prevents them from reciting standard Intro-to-Ethics objections that don't apply to the *derivation* problem. The distinction between Anonymity (moral) and vNM (rational) is the key discriminator for the A grade.
