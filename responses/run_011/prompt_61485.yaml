  You are asking whether your framework for bet sizing is objectively sound or if it hides subjective preferences, and whether your friend is right that the withdrawal and floor constraints change the fundamental problem rather than just acting as side conditions. The short answer is that your friend is largely correct about the constraints, but you are also partially right about the utility adjustment, though your reasoning for why it matters is slightly off. The core issue is that you are treating the Kelly criterion as an objective mathematical truth about growth, when it is actually the optimal strategy for a specific subjective preference, namely logarithmic utility. When you say you have a CRRA gamma of 2, you are stating that your utility function is not logarithmic, which means Full Kelly is objectively suboptimal for you even in a vacuum without floors or withdrawals. It is not merely a matter of applying a discount dial to smooth the ride; it is a matter of solving the optimization problem for the correct utility function. For a constant opportunity set like this coin flip, the optimal fraction for a power utility investor is indeed roughly the Kelly fraction divided by gamma, so your intuition that gamma equals 2 implies half Kelly is theoretically sound in an unconstrained environment. However, this is where your friend's insistence that you are confused starts to land, because you are operating in a highly constrained environment where the unconstrained formulas break down.

  The most critical error in your reasoning is the assumption that the growth rate advantage of Kelly will wash out the floor and withdrawal constraints in the limit. This relies on the ergodic assumption that you will survive long enough for the law of large numbers to dominate, but the floor at 2000 dollars and the withdrawal rate of 800 dollars a month create a non-ergodic boundary condition that can terminate your sequence before the long run arrives. You calculated the full Kelly growth rate at about 0.62 percent per week, which compounds to roughly 38 percent a year, but you are withdrawing 800 dollars a month which is 9600 dollars a year. On a 20000 dollar bankroll, that withdrawal rate is 48 percent of your initial capital annually, or about 1 percent per week. Since your expected growth rate of 0.62 percent is lower than your withdrawal drain of 1 percent, your expected drift is negative. This means that on average, your bankroll will shrink regardless of your bet size, and the only way to succeed is to get lucky enough early on to build a buffer where the withdrawal becomes a smaller percentage of the total. In this negative drift regime, variance is your enemy because it increases the probability of hitting the 2000 dollar floor before you get that lucky streak. Full Kelly maximizes variance for a given expected return, which makes ruin more likely in the short term when you are fighting a negative drift.

  Your friend's point that the floor and withdrawals change the question is correct because they transform the problem from maximizing asymptotic growth to maximizing survival probability or expected utility of consumption with a ruin constraint. When you have a hard floor at 10 percent of your starting bankroll and a withdrawal rate that exceeds your expected growth, the objective function is no longer about who has the most money in fifty years, but about who stays in the game long enough to possibly turn it around. This is why your framing of the floor as a side condition that just slows you down is dangerous; it does not just slow you down, it stops you entirely if you hit it, and with negative drift, hitting it is the most likely outcome. The objectivity you thought you had is sneaking preferences back in because by choosing to maximize growth rate, you implicitly chose log utility, but your actual situation requires a utility function that penalizes ruin much more heavily than log utility does. You are not double-counting risk by adjusting for gamma and then worrying about the floor, but you are misapplying the gamma adjustment if you think it solves the survival problem. The gamma adjustment handles your risk aversion regarding wealth fluctuations, but the floor handles your risk of termination, and these are distinct pressures that both argue for betting significantly less than Full Kelly.

  So concretely, you should be staking around 5 percent of the account each week, which is half Kelly, but you need to understand that this is not just a smoothness discount. It is the mathematically correct fraction for your stated gamma of 2 in an unconstrained world, and it also serves the practical purpose of reducing variance to help you survive the negative drift caused by your withdrawals. However, you must accept that even at 5 percent, your expected growth will be lower than 0.62 percent, likely around 0.47 percent per week, which widens the gap between your growth and your 1 percent weekly withdrawal need. This means the half Kelly bet does not solve the sustainability issue; it only reduces the volatility of your decline. The harsh reality is that with a 20000 dollar bankroll, a 2000 dollar floor, and 800 dollar monthly withdrawals, you are mathematically undercapitalized for the edge you are playing, regardless of whether you bet 5 percent or 10 percent. The cap at 2000 dollars per week will eventually bind if you grow, which limits your upside, but the immediate threat is the downside. Your friend is right that you cannot treat the floor and rent as patch-on conditions because they fundamentally alter the probability of ruin, and you are right that Full Kelly is too aggressive for your utility function, but the combination of the two means you are in a precarious position where the optimal strategy is mostly about damage control. You should bet the 5 percent to align with your utility and reduce variance, but you should also recognize that the only way to make this truly sustainable is to reduce the withdrawal amount or increase the bankroll, because no bet sizing strategy can reliably overcome a negative expected drift without taking ruinous risks.
