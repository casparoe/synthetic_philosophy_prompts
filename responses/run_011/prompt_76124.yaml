      *   *Analysis:* If A defines emotion as the *whole package* (body + appraisal) and B defines it as the *feeling component* (body), they are talking past each other. But if they are arguing about the *core* identity, it's genuine.
      *   *Normativity:* A says "fittingness" (truth-like). B says "calibration" (causal reliability). This looks genuine.
