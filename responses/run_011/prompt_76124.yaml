  5.  **Drafting Section 3: The Cruxes:**
      *   *Crux 1:* Is intentionality constitutive or additive? (Does the fear *need* the danger representation to exist?)
      *   *Crux 2:* Can normativity be reduced to reliability? (Is "unfitting fear" just "false alarm"?)
      *   *Crux 3:* Conceptual Requirement. (Do you need the concept 'danger' to feel fear?)
