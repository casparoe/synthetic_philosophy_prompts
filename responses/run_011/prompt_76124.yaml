  6.  **Drafting Section 4: Evidence & Predictions:**
      *   *Spinal Cord Lesions (Hohmann):* B predicts huge loss of emotion. A predicts emotion remains (appraisal intact). *Result:* Mixed/Modest loss. Favors A or Hybrid.
      *   *Facial Feedback:* B predicts changing face changes feeling. A predicts minimal effect on appraisal. *Result:* Weak/Uneven replication.
      *   *Better Evidence:*
          *   *Alexithymia/Interoceptive Accuracy:* If people can't feel bodies but judge threats well, does emotion remain?
          *   *Conditioned Fear in Animals:* Can they have "unfitting" fear without concepts?
          *   *Cognitive Impenetrability:* Does knowing the stick isn't a snake stop the startle? (Yes). Does it stop the *fear*? (Debatable).
      *   *Forcing Concession:* If bodily feedback is blocked entirely and emotion vanishes -> B wins. If bodily feedback is blocked and appraisal-based emotion remains -> A wins.

