      *   **Side B (Jamesian):** Emotions *are* feelings of bodily changes. Intentionality is added later by cognition. Normativity is pragmatic (usefulness/calibration) rather than semantic (truth/fittingness).
      *   **The Stalemate:** They talk past each other. A says "Fear represents danger." B says "Fear is a racing heart." A says "That fear is irrational." B says "That detection system is miscalibrated."

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   Need to handle the specific cases mentioned: phobia (fear of harmless dog), moods (no object), animals/infants (no concepts), persistent grief, fiction, panic/self-report mismatch.
