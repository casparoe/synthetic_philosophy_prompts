      *   *A's Concession:* If bodily states are shown to be necessary conditions, A admits embodiment is constitutive, not just causal.
      *   *B's Concession:* If normativity is shown to be irreducible to reliability, B admits emotions have correctness conditions beyond utility.
      *   *Decisive Question:* Is there one? Probably not. It's likely a "level of analysis" dispute.
