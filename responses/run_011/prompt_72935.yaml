answer: |-
  **DRAFT JOINT STATEMENT FOR ADVERSARIAL COLLABORATION**
  **Subject:** The Ontology and Architecture of Emotion
  **Participants:** [Judgment Theorist], [Somatic-Feeling Theorist]
  **Facilitator:** [Workshop Convener]
  **Date:** [Pre-Workshop Circulation]

  ### I. Substantive Shared Commitments

  Before detailing our disagreements, we affirm the following claims as the boundary conditions for this collaboration. We agree that a successful theory of emotion must accommodate these phenomena without explanatory residue. We sign this section not as a concession of defeat, but as a fixation of the target.

  1.  **Intentionality:** Emotions are typically *about* something (an object, a state of affairs, or a prospect). Even when an object is not consciously identified, the episode possesses directedness (e.g., fear is fear *of* something).
  2.  **Recalcitrance:** Emotions can persist in direct conflict with the subject's sincere, occurrent evaluative judgments (e.g., judging a spider harmless while fearing it).
  3.  **Gradability:** Emotions admit of degrees of intensity and urgency that are not strictly isomorphic with the confidence level of any associated belief or judgment.
  4.  **Heterogeneity:** Episodes falling under the same emotion concept (e.g., "anger") vary wildly in their autonomic signatures, expressive behaviors, and phenomenological textures. There is no single "fingerprint" for any emotion kind.
  5.  **Taxonomic Variance:** The taxonomy of emotion concepts is not invariant across languages or cultures; however, this does not entail that there are no underlying natural kinds of affective processing.
  6.  **Developmental and Comparative Constraints:** Whatever emotions are, they must be compatible with the existence of affective life in human infants and non-human animals lacking complex propositional capacities, and with the clinical neurology of affect (e.g., dissociations between report and physiological arousal).
  7.  **Explanatory Adequacy:** A successful account must explain not only the *nature* of an emotion token but also its *role* in reasoning, action selection, and social coordination. It must explain why emotions are rationalizable but not always rational.

  ### II. Map of Residual Disagreements

  We disagree on the metaphysical status of the emotion token. In our correspondence, we have found that three distinct types of claims are frequently conflated: **Identity** (what the emotion *is*), **Dependence** (what is required for the emotion to occur), and **Primacy** (what explains the other). The table below separates these.

  | Point of Dispute | Judgment Theorist (JT) Formulation | Somatic-Feeling Theorist (FT) Formulation | Neutral Formulation (For Collaboration) | Type of Claim |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Ontological Status** | An emotion token is *identical* to (or necessarily constituted by) an evaluative judgment with propositional content. | An emotion token is *identical* to the feeling of a patterned bodily change. | An emotion token involves a correlation between evaluative content and bodily feeling. | **Identity** |
  | **2. Necessity Condition** | An evaluative judgment is *necessary* for a token of that emotion kind. One cannot fear without judging (implicitly or explicitly) danger. | An evaluative judgment is *neither necessary nor sufficient*. One can fear without judging danger; one can judge danger without fearing. | Evaluative judgments and emotion tokens are reliably associated, but the modal strength of this association is disputed. | **Dependence** |
  | **3. Explanatory Order** | The evaluative content explains the bodily feeling. The feeling is a downstream effect or readout of the judgment. | The bodily feeling (or disposition to act) explains the apparent directedness. The judgment is a downstream interpretation or inflection. | Causal pathways exist between evaluation and bodily change; the direction of priority is disputed. | **Primacy** |
  | **4. Reference Fixing** | The term "emotion" refers primarily to a **functional profile** defined by its role in reasoning and assessment. | The term "emotion" refers primarily to a **phenomenal/physiological profile** defined by felt bodily engagement. | The term "emotion" picks out a cluster of phenomena including function, phenomenology, and physiology. | **Verbal / Semantic** |

  **Analysis of Verbal Disagreement:**
  We acknowledge that a portion of our dispute is verbal. If "emotion" is stipulated to mean *functional assessment*, the JT wins by definition. If "emotion" is stipulated to mean *felt bodily disturbance*, the FT wins by definition.
  *   **JT Preference:** Fixes reference via **lay attribution and self-report** regarding *why* the subject acted (the reason-giving capacity).
  *   **FT Preference:** Fixes reference via **physiological profile and phenomenal report** regarding *what it feels like* (the qualitative capacity).
  *   **Resolution Strategy:** We agree to use the neutral term "affective episode" when discussing the whole phenomenon, reserving "emotion" for the specific ontological candidate we each defend, to prevent talking past one another.

  **Note on the Third View (Perceptualism):**
  We note that a third position (Emotion as Non-Doxastic Perception of Value) is excluded from this collaboration. We acknowledge that if this view is correct, it dissolves the **Identity** claim in Row 1 by positing a category *sui generis* (neither judgment nor feeling). However, it does not automatically resolve the **Dependence** claim in Row 2, as perceptualists still debate whether such perceptions require conceptual capacity. We set this view aside to test whether the Judgment/Feeling dichotomy is exhaustive.

  ### III. Empirical Cruxes and Falsifiable Predictions

  We identify four specific classes of evidence where our theories diverge sharply. For each, we state the agreed-upon evidence, our specific predictions, and what we would concede if proven wrong. We distinguish whether we disagree about the *data* or the *interpretation* of the data.

  **Crux 1: Acute Panic Without Object**
  *   **Evidence:** Episodes of intense acute panic where the subject reports no object (no "fear of X") and no antecedent evaluative judgment regarding threat.
  *   **Disagreement Type:** Interpretation (Is this a true emotion token or a mere sensation?)
  *   **JT Prediction:** These are non-emotional affective surges or "raw feels." If subjects are pressed, they will confabulate a judgment post-hoc. If a protocol prevents confabulation, the episode will not classify as "fear" but as "anxiety" or "alarm," distinct from propositional fear.
      *   *Concession:* If subjects reliably identify these objectless episodes as "fear" indistinguishable from object-directed fear, and no judgment can be elicited even implicitly, I concede that judgment is not necessary for all emotion tokens.
  *   **FT Prediction:** These are paradigmatic emotion tokens. The lack of an object proves the feeling is primary; the search for an object is a secondary cognitive attempt to explain the bodily state.
      *   *Concession:* If it is shown that these episodes lack the specific action-readiness typical of fear (e.g., no disposition to flee), I concede that bodily feeling alone is insufficient for emotion without a dispositional directedness.

  **Crux 2: Recalcitrant Phobia (The "Absurd" Fear)**
  *   **Evidence:** A subject with a specific phobia sincerely judges the stimulus (e.g., a caged spider) as harmless, describes their own reaction as absurd, yet recoils with high arousal.
  *   **Disagreement Type:** Interpretation (Is there a split judgment or no judgment?)
  *   **JT Prediction:** The subject holds a conflicting, implicit, or modular judgment ("This is dangerous") that operates independently of their sincere avowal. The emotion *is* that implicit judgment.
      *   *Concession:* If neuro-imaging or behavioral markers show no trace of threat-evaluation processing (only sensory arousal) during the recoil, I concede that emotion can exist without any evaluative content.
  *   **FT Prediction:** The subject has one judgment (harmless) and one emotion (fear-feeling). The emotion persists precisely because it is not a judgment.
      *   *Concession:* If the recoil disappears immediately upon the sincere judgment of safety (without extinction learning), I concede that judgment is causally sufficient to extinguish the emotion, implying a tighter dependence than I allow.

  **Crux 3: High Spinal-Cord Lesion (Afferent Interruption)**
  *   **Evidence:** Subjects with lesions interrupting visceral afferent feedback report emotional experiences. Literature is contested on whether *intensity* is reduced or merely *quality* changed.
  *   **Disagreement Type:** Evidence (We need to agree on what the current best data indicates).
  *   **JT Prediction:** Emotional intensity and type will remain largely intact because the judgment mechanism is supraspinal. Reports of reduced intensity are due to motor/expressive feedback loss, not emotional loss.
      *   *Concession:* If subjects report a total absence of "emotional feeling" (not just motor inability) while retaining full evaluative capacity, I concede that feeling is constitutive of the *experience* of emotion, if not the emotion itself.
  *   **FT Prediction:** Emotional experience will be significantly attenuated or "cooled," as the feedback loop required for the feeling is broken.
      *   *Concession:* If subjects report emotional intensity identical to pre-injury baselines across all emotion kinds, I concede that visceral feedback is not necessary for the feeling component.

  **Crux 4: Subliminal Affective Discrimination**
  *   **Evidence:** Subjects discriminate threatening vs. non-threatening stimuli presented under conditions precluding identification or report (masking), showing physiological arousal and behavioral priming.
  *   **Disagreement Type:** Interpretation (Is this "emotion" or "detection"?)
  *   **JT Prediction:** This is threat *detection*, not emotion. Emotion requires a minimum threshold of cognitive access to count as an evaluative judgment.
      *   *Concession:* If these subliminal episodes produce the full suite of downstream consequences of conscious fear (e.g., specific long-term avoidance learning, not just priming), I concede that emotion does not require conscious judgment.
  *   **FT Prediction:** This is emotion in its nascent form. The bodily preparation occurs before identification.
      *   *Concession:* If these responses are shown to be reflexive fixed-action patterns that lack the flexibility or integration typical of emotional episodes, I concede that this is mere affect, not emotion.

  ### IV. Closing Reflections

  **Costs Absorbed:**
  *   **JT Cost:** We acknowledge that maintaining the Judgment view requires treating the rich phenomenology of bodily feeling as secondary, which risks making the theory feel alien to the lived experience of emotion. It also requires stretching the definition of "judgment" to accommodate infants and animals, which risks emptying the term of its rational force.
  *   **FT Cost:** We acknowledge that maintaining the Feeling view requires treating the intentional directedness of emotion as derived or secondary, which risks making it difficult to explain why emotions are reasons for action rather than mere impulses. It also requires explaining why we talk about emotions as assessments of the world rather than assessments of our bodies.

  **One Genuinely Moving Argument:**
  We both agree that the phenomenon of **Recalcitrance (Crux 2)** is the strongest argument against the Judgment Theory in its simplest form, and the phenomenon of **Object-Directedness** is the strongest argument against the Feeling Theory in its simplest form. Neither of us has successfully explained the other's strongest case without adding auxiliary hypotheses. We agree that whichever theory can explain Recalcitrance without positing "unconscious judgments" that look suspiciously like "feelings," or explain Directedness without positing "bodily perceptions" that look suspiciously like "evaluations," will have won the day.

  **Assessment of Conceptual vs. Empirical Resolution:**
  We assess that **Crux 4 (Subliminal Discrimination)** is most likely to be settled by conceptual clarification rather than further data. The dispute turns on the definition of "emotion" versus "affect" versus "reflex." If we agree on a functional threshold for "emotion" (e.g., must involve action-selection flexibility), the data may already exist to settle it. The other cruxes depend on difficult-to-access phenomenal reports or contested neurological pathways. We propose spending the first morning of the workshop defining the threshold conditions for the term "emotion" before reviewing the data on subliminal processing.

  ***

  **Signed:**

  _________________________ (Judgment Theorist)

  _________________________ (Somatic-Feeling Theorist)
