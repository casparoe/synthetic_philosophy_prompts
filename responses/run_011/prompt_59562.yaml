      *   *Decision:* The C4 vs C5 conflict is the most lethal. The C6 vs C7 conflict is the most philosophically deep. I will rank C4/C5 as higher severity because it makes the view empirically inadequate (cannot explain reclamation), whereas C6/C7 is a metaphysical tension that might be terminological.

      *   *Wait, one more thing:* C4 says "wherever it surfaces it surfaces as an attitude of the person whose mouth it comes out of." This is the definition of non-displaceability in this context. C5 says "derogation is absent." If C4 is true, C5 is false. This is a logical contradiction, not just a tension. I must highlight this as a contradiction.

