prompt: |-
  I am preparing a paper on the semantics of slurs for journal submission, and before I write it up I would like a rigorous audit of whether the position I have converged on is internally tenable. I would much rather find the fractures myself than have a referee find them. The view is best given as a set of commitments, each of which I hold independently and none of which I would have predicted would strain the others.

  (C1) A slur and its neutral counterpart are truth-conditionally equivalent. "Alf is a Boche" is true in precisely the circumstances in which "Alf is German" is true. Nothing contributed by the slur makes any difference to whether the sentence is true.

  (C2) The difference between the two sentences is nevertheless semantic rather than pragmatic. It is encoded by convention in the lexical item, not inferred: it is not recoverable from general conversational principles, from the speaker's evident intentions, or from what the audience expects. A hearer who does not know the word cannot work the derogation out.

  (C3) The derogatory component is not at-issue content. The sentence is about whatever its neutral counterpart is about, and a bare denial ("that's false") targets the neutral counterpart's content, not the derogation. There is, strictly speaking, no such thing as contradicting a slur.

  (C4) The derogatory component is nonetheless projective and non-displaceable. It survives embedding under negation, in the antecedent of a conditional, in questions, and in attitude reports; and wherever it surfaces it surfaces as an attitude of the person whose mouth it comes out of, rather than being shiftable onto someone else or modulated by further features of the context of utterance.

  (C5) Reclamation is genuine and not merely apparent. When members of the target group use the word among themselves, the derogation is absent from what is said — not suspended, quoted, pretended, or ironized — and those uses are fully correct uses of the word, on a par with any other, differing only in who is licensed to perform them.

  (C6) Meaning is fixed by the standing social practice rather than by any individual. What the word means depends on the norms governing its use in a community: who may deploy it, against whom, and to what end. Users can violate those norms and can be mistaken about them, but no individual use, however deviant, alters the meaning; only the practice as a whole can do that, and the practice as a whole changes slowly, if at all.

  (C7) The wrongness of a slur-use is explained by the meaning of the word alone. I want no appeal to the word's history, to the speaker's attitudes, to the likelihood of causing offence, or to any social expectation in order to explain why uttering the slur rather than its neutral counterpart is objectionable. Whatever does the explaining must be located in the semantics.

  Please treat these as a package and tell me where it breaks. In particular:

  1. Which of these commitments are genuinely in tension with one another, and which pairs merely look as though they are? I expect that at least one apparent conflict dissolves under inspection, and I want to be told why it dissolves rather than having it flagged along with the real problems.

  2. Rank the genuine tensions by severity — where severity means how much of the rest of the view collapses if the tension is left unresolved — instead of presenting them as an undifferentiated list.

  3. For each genuine tension, state the cheapest revision that removes it, and then state what that revision costs: which of my remaining commitments it strains, and which familiar phenomena the revised view thereafter struggles to explain.

  4. Identify the single change I could make that would resolve the most, and tell me whether making it would leave me with something still recognizably a semantic account of slurs rather than a pragmatic or sociolinguistic one. That is the part of the project I am least willing to surrender, so I need to know in advance whether it survives.

  Where a tension turns out to depend on a commitment doing unnoticed work — a claim that looks incidental to the view but is in fact load-bearing for several others at once — say so explicitly and say which commitments would go down with it. Reason from the commitments as I have stated them; I am not asking for a survey of the existing literature on slurs, nor for an identification of which published view mine most resembles, except insofar as noting that a given tension has a known escape route bears on how severe you judge it to be.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's proposed view on the semantics of slurs:

  1.  **Analyze the Request:**
      *   **Goal:** Audit a specific set of commitments (C1-C7) regarding the semantics of slurs for internal tenability before writing a paper.
      *   **Task:** Identify tensions (real vs. apparent), rank them by severity, propose cheapest revisions + costs, and identify the single most effective change.
      *   **Constraint:** Reason from the commitments as stated. Do not just survey literature. Identify load-bearing claims.
      *   **User's Priority:** Maintaining a *semantic* account (not pragmatic/sociolinguistic).
      *   **Input:** Seven specific commitments (C1-C7).

  2.  **Deconstruct the Commitments:**
      *   **C1 (Truth-Conditional Equivalence):** Slur = Neutral Counterpart (NC) in truth conditions. (Expressivist/Non-cognitivist leanings regarding the slur content, or Presuppositional).
      *   **C2 (Semantic Encoding):** The difference is semantic/conventional, not pragmatic. (Against Implicature/Pragmatic accounts).
      *   **C3 (Not At-Issue):** Derogation is not the main point. Denial targets NC content. (Presupposition/Conventional Implicature territory).
      *   **C4 (Projective & Non-Displaceable):** Derogation projects (survives negation, etc.) and is *always* attributed to the speaker (non-shiftable). (Strong constraint on projection behavior).
      *   **C5 (Reclamation):** In-group use lacks derogation genuinely (not irony/quote). (Challenges conventional encoding of derogation).
      *   **C6 (Social Practice/Meaning):** Meaning fixed by community norms/practice, not individuals. Slow change. (Externalist/Normative view of meaning).
      *   **C7 (Semantic Wrongness):** Wrongness explained by meaning *alone* (no history, attitude, offense). (Strong Internalism about moral wrongness).

  3.  **Initial Scan for Tensions:**
      *   *C1 + C2:* Standard Expressivist/CI view. Compatible.
      *   *C2 + C5:* If derogation is semantically encoded (C2), how can in-group use lack it genuinely (C5)? Usually, CI accounts say reclamation is "mention" or "error." C5 says it's *genuine* use without derogation. This looks like a major conflict.
      *   *C4 + C5:* C4 says derogation is non-displaceable (always speaker's attitude). C5 says in-group use lacks derogation. If I (in-group) use it, and C4 holds, I express derogation. But C5 says I don't. Conflict.
      *   *C6 + C5:* C6 says meaning is fixed by practice. If practice allows in-group non-derogatory use, does the meaning change? C6 says practice changes slowly. C5 implies the word *can* be used without derogation *now* by in-group. If the meaning includes derogation (C2), how does C5 work without changing meaning?
      *   *C7 + C6:* C7 says wrongness is in the *meaning*. C6 says meaning is fixed by *social practice*. If the practice shifts (reclamation), does the wrongness vanish? C7 wants wrongness to be stable in the semantics. C6 allows meaning to shift (slowly).
      *   *C7 + C1:* If truth conditions are the same (C1), where is the "wrongness" located in the semantics? It must be in the conventional implicature or use-conditional content. C7 says "meaning of the word alone." This is workable but tight.
      *   *C4 (Non-displaceable) + C2 (Semantic):* If it's semantic, can it be non-displaceable? Yes (CIs usually project). But C4 says it's *always* the speaker's attitude.
      *   *C5 (Reclamation) vs. The Whole Package:* This is the biggest hammer. If derogation is semantic (C2), projective (C4), and explains wrongness (C7), how can it just *disappear* for in-group users (C5) without changing the meaning (C6)?

  4.  **Detailed Analysis of Tensions:**

      *   **Tension 1: The Reclamation Problem (C2, C4, C5).**
          *   C2: Derogation is encoded conventionally.
          *   C4: Derogation is non-displaceable (speaker-oriented).
          *   C5: In-group use lacks derogation genuinely.
          *   *Conflict:* If it's encoded (C2) and speaker-oriented (C4), an in-group speaker *must* express derogation when using it. C5 denies this.
          *   *Severity:* High. C5 is a core data point the user wants to capture. C2/C4 are core theoretical claims.
          *   *Load-bearing:* C2 is load-bearing for the "Semantic" claim. C4 is load-bearing for the specific projection profile. C5 is load-bearing for the sociolinguistic adequacy.

      *   **Tension 2: The Source of Wrongness vs. Social Practice (C6, C7).**
          *   C6: Meaning depends on norms/practice (which can change).
          *   C7: Wrongness is explained by meaning *alone* (no appeal to history/expectations).
          *   *Conflict:* If meaning depends on practice (C6), and practice changes (e.g., reclamation succeeds), the meaning changes. If meaning changes, does the wrongness vanish? C7 implies the wrongness is intrinsic to the *current* meaning. But if the meaning is determined by norms (C6), and norms are contested (reclamation), is the use wrong?
          *   *Refinement:* C7 says "no appeal to... social expectation." But C6 says meaning *is* fixed by social practice/norms. This is a direct contradiction. C7 tries to internalize the norm into the semantics, while C6 acknowledges the norm is external/social.
          *   *Severity:* High. It threatens the meta-ethical/semantic interface.
          *   *Load-bearing:* C6 is load-bearing for explaining *why* meaning is stable/resistant. C7 is load-bearing for the moral force of the paper.

      *   **Tension 3: Truth-Conditions vs. Wrongness (C1, C7).**
          *   C1: Truth conditions identical to NC.
          *   C7: Wrongness explained by meaning.
          *   *Conflict:* If truth conditions are identical, the "meaning" difference must be non-truth-conditional (CI, Expressive, etc.). C7 says the wrongness is in the *meaning*. This is compatible *if* "meaning" > "truth conditions." However, if C1 says "Nothing contributed by the slur makes any difference to whether the sentence is true," and C7 says the wrongness is in the meaning, we need to ensure the "wrongness" isn't reduced to "falsehood." The user seems aware of this (C3).
          *   *Severity:* Low/Apparent. Standard Expressivist/CI move. "Meaning" includes use-conditions.
          *   *Resolution:* This dissolves if we accept a multidimensional semantics (truth-conditional + use-conditional).

      *   **Tension 4: Non-Displaceability vs. Reclamation (C4, C5).**
          *   C4: Attitude is *always* the speaker's.
          *   C5: In-group speaker uses it *without* the attitude.
          *   *Conflict:* Direct contradiction. If C4 holds, C5 is impossible (unless the in-group speaker *is* derogating, which C5 denies).
          *   *Severity:* Critical.
          *   *Resolution:* One must go. Usually, C4 is relaxed (contextual shift) or C5 is reinterpreted (mention/quoting). But user insists C5 is "genuine."

  5.  **Ranking Severities:**
      1.  **C2/C4 vs. C5 (The Reclamation Paradox):** If derogation is semantic and non-displaceable, reclamation is impossible. This breaks the account of a major phenomenon.
      2.  **C6 vs. C7 (The Normative Source):** C6 says meaning is social practice; C7 says wrongness is meaning *not* social expectation/practice. But social practice *is* social expectation/norm. This is a conceptual clash on the metaphysics of meaning.
      3.  **C1 vs. C7 (The Location of Wrongness):** Manageable if "meaning" is broad, but needs care.

  6.  **Developing Revisions:**
      *   *For C2/C4 vs. C5:*
          *   Option A: Drop C5 (say reclamation is mention). Cost: Loss of data coverage.
          *   Option B: Drop C4 (allow displacement). Cost: Loss of specific projection claim.
          *   Option C: Drop C2 (make it pragmatic). Cost: Abandons "Semantic" project.
          *   *Cheapest:* Modify C4. Allow that the *expression* of the attitude is semantic, but the *adoption* of the attitude is context-sensitive (indexical). But C4 says "non-displaceable." So C4 must go.
      *   *For C6 vs. C7:*
          *   Option A: Drop C7 (allow appeal to norms). Cost: Weakens moral claim.
          *   Option B: Drop C6 (Individualist meaning). Cost: Contradicts sociolinguistic reality.
          *   *Cheapest:* Refine C7. Wrongness is in the meaning, but meaning *is* constituted by norms. So wrongness is ultimately grounded in norms. C7's "no appeal to social expectation" is the problem.

  7.  **Identifying the "Single Change":**
      *   The core engine of the view is that the derogation is **Semantic (C2)** but **Not At-Issue (C3)** and **Projective (C4)**.
      *   The biggest breaker is **Reclamation (C5)** combined with **Non-Displaceability (C4)**.
      *   If the user keeps C2 (Semantic), they must handle C5.
      *   If they keep C5 (Genuine Reclamation), they must allow the semantic content to vary by context/speaker.
      *   This threatens C2 (Encoded by convention... hearer who does not know the word cannot work it out"). Actually, C2 is compatible with indexicality.
      *   The real pivot is **C4 (Non-displaceable)**. If derogation is *always* the speaker's attitude, in-group reclamation (where the attitude is absent) is semantically impossible under this view.
      *   *Recommendation:* Abandon C4's strict non-displaceability. Allow the expressive content to be sensitive to the speaker's group membership (contextual parameter).
      *   *Does this save the Semantic Account?* Yes. Indexical semantics are still semantics. It moves away from rigid conventionalism toward contextualism, but remains semantic.

  8.  **Drafting the Response:**
      *   *Structure:* Follow the user's 4 points.
      *   *Tone:* Rigorous, audit-style, constructive but critical.
      *   *Content:*
          1.  **Apparent vs. Real:** C1/C3/C7 look tense but work if "meaning" is multidimensional. C2/C5 looks tense but might work if "convention" allows indexicality.
          2.  **Real Tensions:**
              *   **T1 (Critical):** C4 (Non-displaceable) vs. C5 (Reclamation). If it's always the speaker's attitude, in-group users derogate themselves.
              *   **T2 (High):** C6 (Social Practice) vs. C7 (No appeal to norms). C6 *makes* meaning normative/social. C7 denies normative/social explanation for wrongness.
              *   **T3 (Medium):** C2 (Encoded) vs. C5 (Reclamation). If encoded, how does it vanish?
          3.  **Revisions:**
              *   For T1: Weaken C4. Allow context-sensitivity. Cost: Loss of simplicity in projection.
              *   For T2: Refine C7. Acknowledge norms constitute the meaning which generates wrongness. Cost: C7 becomes less "internalist."
          4.  **Single Change:** Modify C4. Allow the expressive content to be context-sensitive (specifically, sensitive to speaker identity). This preserves Semantics (C2) while allowing Reclamation (C5).

  9.  **Refining the "Load-Bearing" Analysis:**
      *   C4 is the linchpin. It forces the attitude onto the speaker. This makes C5 impossible.
      *   C7 is also fragile. It tries to isolate wrongness from the very social facts C6 says constitute meaning.
      *   C2 is the "Semantic" flag. If C2 goes, the project fails (per user constraint).
      *   So, C4 is the sacrificial lamb.

  10. **Final Review against Constraints:**
      *   Did I answer all 4 prompts? Yes.
      *   Did I avoid literature survey? Yes, focused on internal logic.
      *   Did I respect the "Semantic" priority? Yes, recommended changes keep it semantic (indexical semantics).
      *   Did I identify load-bearing claims? Yes (C4 and C6).

  11. **Self-Correction/Nuance Check:**
