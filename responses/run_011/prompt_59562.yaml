      *   *Check C7:* "No appeal to... social expectation." If C6 says meaning is fixed by practice, and C7 says wrongness is in meaning, then wrongness *is* fixed by practice. C7's prohibition on "social expectation" might be interpreted as "don't appeal to *current* hearer expectations (pragmatics)" vs "constitutive norms (semantics)." I need to clarify this distinction. The tension is that C7 sounds like it wants a moral realist grounding *inside* the word, while C6 is a social constructivist view of meaning.
