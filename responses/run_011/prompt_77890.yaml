          *   *Soft Spot:* Denying representation to a marginalized group feels like a setback.

      *   *Drafting the Attorney's Objection:* Donors.
          *   *Voice:* "Fiduciary," "bequest," "chilling effect."
          *   *Reply:* We aren't returning money, we are updating the *honor*.
          *   *Soft Spot:* Hard to prove future donors won't be scared.

      *   *Drafting the Parent's Objection:* Tradition.
          *   *Voice:* "Memories," "legacy."
          *   *Reply:* Your memory isn't on the building; the building speaks to *current* students.
          *   *Soft Spot:* Dismissing alumni emotion can look arrogant.

      *   *Drafting the President's Objection:* Precedent.
          *   *Voice:* "Policy," "slippery slope."
