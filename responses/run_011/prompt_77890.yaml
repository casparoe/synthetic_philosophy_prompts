      *   *Teacher (Social Studies):* Focus on pedagogy, nuance. "Teachable moment," plaque idea.
      *   *Pastor:* Focus on morality, forgiveness, redemption. "Repentance," not erasure.
      *   *Attorney (Estate):* Focus on legalities, donor trust. "Bequest conditions," "chilling effect on donors."
      *   *Parent (Booster/Alum):* Focus on tradition, emotion, legacy. "My grandfather went here."
      *   *Student Rep:* Focus on representation, action. "Replace with Black teacher," "Status quo."
      *   *Public (Historian/Alumni/Reporter):* Historical accuracy, financial impact, media narrative.

  3.  **Drafting the Objections & Replies (Iterative Process):**

      *   *Goal:* Match vocabulary. Adjuster = "precedent," "liability." Pastor = "grace," "witness." Teacher = "curriculum," "context."
      *   *Reply Constraint:* ~90 seconds spoken. Needs to be punchy but substantive.
      *   *Vulnerability:* Where does the argument leak? Usually on the "functional naming" aspect (feels cold) or the "donor" aspect (scaring future money).

      *   *Drafting the Teacher's Objection:* She likes the plaque.
