      *   **Topic:** Renaming the high school (currently named after Ezra Holloway, a benefactor with a problematic history: child labor, anti-compulsory schooling, racial exclusion).
      *   **User's Position ("Standing-Endorsement View"):** Naming is a continuous act of endorsement, not a one-time event. Keeping the name *after* knowing the history is a stronger endorsement than before. Compromise (plaque) makes it worse (conscious choice). Solution: Functional naming (neighborhood/direction), not swapping names.
      *   **Constraints:** 12-minute presentation, 20-minute Q&A. Needs objections phrased in each board member's voice, damage assessment, 90-second replies, vulnerability notes. Needs opening concessions, the "make or break" reply, hidden/killer questions, and ad hominem/standing attacks.
      *   **Audience:** 7 Board Members (President/Adjuster, Facilities/Landscaper, Teacher/Social Studies, Pastor, Attorney/Estate, Parent/Booster/Alum, Student Rep), plus Public Comment (Historian, Alumni Treasurer, Reporter).
      *   **Tone:** Professional, strategic, realistic, empathetic but firm.

  2.  **Deconstruct the Board Members & Potential Objections:**

      *   *President (Adjuster):* Focus on procedure, precedent, policy. "What's the rule for next time?"
