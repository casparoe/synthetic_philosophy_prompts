      *   *Specific Details:* Use the $46k, the 1927 date, the specific board roles.

  7.  **Final Polish:** (Mental check of the "Student Rep" dynamic). This is tricky. The user and student rep agree on the problem but disagree on the solution. The reply needs to be respectful but firm on the principle.

