answer: |-
  # PREPARATION SHEET: SCHOOL BOARD Q&A
  **Presenter:** Junior Student | **Topic:** Holloway High Naming Policy | **Time:** 20-min Q&A

  ## I. OPENING CONCESSIONS (First 2 Minutes)
  *Do not wait for these to be asked. State them in your closing remarks before Q&A begins. This inoculates you against accusations of naivety.*

  1.  **Concede the Cost:** "I know the signage and uniform replacement is priced at $46,000. That is real money. I am not asking you to spend it lightly."
      *   *Why:* Prevents the Facilities Chair from making this the whole story.
  2.  **Concede the History:** "Mr. Holloway did give the land. Without him, there is no school. I am not asking to erase the record of his gift."
      *   *Why:* Disarms the Historian and the Parent/Alum.
  3.  **Concede the Uncertainty:** "I cannot guarantee that a functional name will never offend anyone in the future. No policy is perfect."
      *   *Why:* Shows maturity; prevents the "Slippery Slope" attack from landing hard.

  ## II. THE "MUST-LAND" REPLY
  *If the Board does not accept this premise, your position collapses. This is your core thesis. You must return to this constantly.*

  **The Premise:** Naming is a continuous speech act, not a historical record.
  **The Reply:** "We tend to think of a name like a cornerstone—laid once in 1927 and done. But a name is not a cornerstone; it is a broadcast. Every time a diploma is printed, every time a jersey is worn, the District is speaking. If we keep the name after today, we are not inheriting a decision; we are making a new one. The question isn't 'What did they think in 1927?' It is 'What are we saying in 2024?'"

  ## III. BOARD MEMBER OBJECTIONS (Ordered by Likelihood)

  ### 1. The Teacher (Social Studies)
  **Objection:** "I appreciate the historical nuance, but schools are where we teach complex history. A plaque allows us to confront Holloway's flaws *and* his contribution. Removing the name feels like hiding the past, not learning from it. Isn't a plaque the better pedagogical tool?"
  **Damage:** **High.** This is the most popular "moderate" position.
  **90-Second Reply:** "A plaque works in a museum, where the goal is to explain the past. But a school name isn't a museum exhibit; it's an honor. If I put a plaque on a statue that says 'This man did good, but also owned people,' the statue still honors him. By keeping the name and adding the plaque, you aren't teaching complexity; you are explicitly choosing to honor him *despite* the plaque. That is a heavier endorsement than simply keeping the name out of habit. I am asking for the building to be a place of learning, not a monument to the man who fought against children learning."
  **Soft Spot:** Sounds like you are rejecting "teachable moments," which teachers love.

  ### 2. The Facilities Chair (Landscaper)
  **Objection:** "I've got the bids on the table. $46,000 for signage, uniforms, and letterhead. In a tight budget year, can you justify that expense for a philosophical point? Taxpayers will ask if this money could buy textbooks instead."
  **Damage:** **Medium.** Practical, but solvable.
  **90-Second Reply:** "It is a significant sum. But we have to ask what the money is buying. If we keep the name, we are buying the continued association of this district with child labor and segregation. That has a cost, too, in who feels welcome here. Also, functional naming is a one-time cost. If we switch to 'North High' or 'River High,' we never have this bill again. If we switch to another person's name, we will be back here in 50 years paying another $46,000. This is an investment in a permanent solution."
  **Soft Spot:** $46k is a lot of money for a student to dismiss as "investment."

  ### 3. The Student Representative
  **Objection:** "I agree Holloway has to go. But suggesting *no* name feels like a cop-out. We need representation. Naming it after the first Black teacher corrects the harm. Why deny students of color a hero on the building?"
  **Damage:** **High.** Makes you look like you are protecting the status quo.
  **90-Second Reply:** "I understand the desire for representation. But naming a building after a person is a liability, no matter who it is. We cannot predict how history will judge anyone 50 years from now. If we name it after the first Black teacher, we are putting their legacy at risk of future re-evaluation. Functional naming protects *everyone* from that. We can honor that teacher in the library, in scholarships, or in the hallway exhibit. Let the building's name belong to the students who walk through it every day, not to a single individual."
  **Soft Spot:** Denying a marginalized group a visible honor can look like privilege protecting itself.

  ### 4. The Attorney (Estate Work)
  **Objection:** "I'm concerned about donor confidence. The Holloway estate built this. If we retroactively apply modern standards to past bequests, will future donors trust this board? We might chill future giving."
  **Damage:** **Medium.** Sounds sophisticated and long-term.
  **90-Second Reply:** "Donors give to educate children, not to buy permanent advertising. We are not returning the land or the money; we are acknowledging that the *honor* attached to it has expired. A wise donor wants their gift to serve the community, not to burden it with controversy a century later. By moving to functional naming, we actually protect future donors from this exact scrutiny. We are telling them: 'Your gift will be used, but your name won't be a permanent liability.'"
  **Soft Spot:** Hard to prove empirically that donors won't be scared off.

  ### 5. The Pastor
  **Objection:** "I hear the harm, but I also think about redemption. People are complex. Does this district believe in forgiveness? Erasing the name feels like we believe people cannot change, or that history cannot be redeemed."
  **Damage:** **Low/Medium.** Emotional, but less policy-relevant.
  **90-Second Reply:** "Institutions aren't souls, Pastor. They don't repent; they policy. A person can ask for forgiveness; a building cannot. My concern isn't about Mr. Holloway's soul, but about the message this building sends to a Black student walking in today. We can forgive the man without engraving his name on our diplomas. Removing the name isn't about damnation; it's about consent. Do we consent to be his representatives today?"
  **Soft Spot:** Can sound secular/cynical to a religious audience.

  ### 6. The Parent (Booster/Alum)
  **Objection:** "My father and grandfather graduated from Holloway. That name is part of our family story. When you change it, you're telling us our memories don't matter. Why hurt the alumni to make a point?"
  **Damage:** **Medium.** Emotional weight.
  **90-Second Reply:** "I respect your family's history deeply. But your memories aren't on the sign outside. Your grandfather's diploma still says Holloway; that hasn't changed. The sign outside isn't for the alumni; it's for the current students. We have to prioritize the 1,900 kids walking the halls now over the history of those who left. You can keep your memories; we just need the building to reflect who we are now."
  **Soft Spot:** Dismissing alumni emotion can look arrogant for a current student.

  ### 7. The Board President (Adjuster)
  **Objection:** "I need to know the rule. If we do this, what is the standard for the next complaint? Are we going to rename every street and park? I need a policy trigger, not a one-off."
  **Damage:** **High.** Procedural kill-shot.
  **90-Second Reply:** "The rule is simple: We stop naming buildings after people entirely. That ends the cycle. If the trigger is 'Is this person perfect?', we will be renaming schools forever. If the trigger is 'Do we attach names to buildings?', and the answer is 'No,' then there is no next time. This isn't a slippery slope; it's a flat surface. We remove the mechanism that causes the problem."
  **Soft Spot:** Defining "functional naming" clearly enough to satisfy a proceduralist.

  ## IV. HIDDEN QUESTIONS (The Traps)
  *These are the questions you haven't anticipated. They attack the internal logic of your argument.*

  **1. The "Functional Coldness" Trap**
  *   **Question:** "You say name it by neighborhood or direction. But 'North High' feels cold. School spirit comes from identity. Are you willing to sacrifice community culture for the sake of political safety?"
  *   **Rank:** **High.**
  *   **Why it hurts:** It frames your solution as anti-community.
  *   **Counter:** "Identity comes from the students and teachers, not the noun on the jersey. 'North High' fans still bleed school colors. We are removing a barrier to belonging, not the belonging itself."

  **2. The "Who Decides?" Trap**
  *   **Question:** "You say we can't trust a future board to judge honorees. But you are asking this board to judge Holloway by 2024 standards. Why is your moral calculus the one that gets locked in?"
  *   **Rank:** **Critical.**
  *   **Why it hurts:** It exposes the arbitrariness of *any* decision, including yours.
  *   **Counter:** "I'm not asking you to lock in a moral calculus. I'm asking you to lock in a *process*. I am asking you to say 'No more names.' That removes the need for future moral calculus about individuals."

  **3. The "Graduation" Trap**
  *   **Question:** "You graduate in 14 months. This change will take years. Why should we disrupt the district for a policy you won't even live under?"
  *   **Rank:** **High.**
  *   **Why it hurts:** Attacks your standing/stake in the outcome.
  *   **Counter:** "I am the customer of this building right now. If I buy a shirt today and it has a slogan I find offensive, I don't wear it. I shouldn't have to wait until I'm an alum to object to the slogan on my own diploma."

  ## V. STANDING & AD HOMINEM ATTACKS
  *Expect these from the Public Comment section (Alumni/Historian) or skeptical Board Members.*

  **Attack 1: "You're 17. You don't understand the complexity of history."**
  *   **Response:** "I don't need to be a historian to know that child labor and segregation are incompatible with the values of this school. I am not asking for a history lesson; I am asking for a policy decision."

  **Attack 2: "This is performative. You're doing this for college applications."**
  *   **Response:** "If I were looking for an easy win, I would have asked for a plaque. That's the compromise everyone likes. I am asking for a solution that is harder, costs money, and gives me no credit. I'm here because I go to school here."

  **Attack 3: "You won't be here to clean up the mess."**
  *   **Response:** "That is exactly why I am proposing functional naming. I am trying to clean up the mess so that the students who *stay* don't have to fight this fight again in 10 years."

  ## VI. FINAL STRATEGIC NOTE
  **The Softest Point in Your Armor:**
  Your argument relies on the idea that *functional naming* is neutral. The Historian and the Teacher will attack this hardest, arguing that "North High" erases local history.
  **Defense:** Do not defend "North High" as *better* history. Defend it as *honest* history. "The history belongs in the archive, not on the marquee. We are not erasing history; we are filing it."

  **The Single Reply That Must Land:**
  The **Board President's** question about precedent. If you cannot convince him that "No Names" is a stable policy endpoint, he will vote no to avoid endless future meetings. Keep returning to: **"This policy ends the debate permanently."**
