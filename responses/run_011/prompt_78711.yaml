prompt: |-
  Something at work has been rattling around in my head and I don't have the vocabulary for it. We train classifiers and we care a lot about calibration: we track ECE, we bolt on temperature scaling or isotonic regression, and if a model is confidently wrong out in the tails we treat that as a genuine defect, almost like it's lying to us. We also train with log loss. But then we turn around and do the opposite things -- we reweight the minority class to handle imbalance even though everyone know that wrecks calibration, we shift the decision threshold to whatever the cost curve wants, and on our fraud model we deliberately ship probabilities biased high because the ops team would rather over-review than miss one. Meanwhile the number that actually decides who gets promoted is leaderboard accuracy/AUC, not the loss we optimised.

  So what does the calibration obsession presuppose about what a predicted probability is -- a coherent degree of belief you could take bets at, a long-run frequency, or just an input to a decision? Which rival accounts does it quietly rule out? Is there a real contradiction with the reweighting and the threshold-shifting, or do those live at a different layer? And if we settled on the purely decision-theoretic view, what would we stop doing on Monday and what would we start doing instead?

  Lead with your bottom line in the first sentence, then give me the reasoning -- no preamble and no repeating my question back at me. American English, please.
