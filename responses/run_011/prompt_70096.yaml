answer: |-
  **MEMORANDUM**

  **TO:** Behavioral Health Data Board
  **FROM:** Chair, Classification and Reporting Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Prolonged Grief Disorder Reporting and Classification Feedback Assessment

  **Purpose and Recommendation**

  This memo fulfills the charter requirement for a classification feedback assessment regarding the addition of Prolonged Grief Disorder (PGD) to the state public health dashboard. This is the first such assessment undertaken by the department. Given the competing imperatives of surveillance integrity and equitable resource allocation, the Subcommittee recommends proceeding with publication in the upcoming fiscal year, but with specific modifications to mitigate measurement instability.

  We recommend publishing PGD prevalence beginning Fiscal Year 2025, anchored to DSM-5-TR criteria (12-month duration) rather than ICD-11 (6-month duration). Simultaneously, we will publish service-utilization counts alongside prevalence rates. This dual-track approach acknowledges that while the label changes the population, withholding it denies necessary entitlements. We must accept a break in the time-series continuity to prioritize immediate access to care in a state currently managing collective trauma.

  **Classification Feedback Assessment**

  The charter requires us to analyze how publishing this label changes the population it counts. This is not a theoretical concern; the classification will actively construct the prevalence it measures. We have identified five specific channels through which this feedback loop will operate: screening protocols in primary care, reimbursement incentives at county clinics, advocacy messaging, local media coverage, and self-identification at intake.

  Of these, the department can directly influence screening protocols and reimbursement incentives. We cannot control media narratives or advocacy framing. If we publish prevalence based on a six-month threshold while primary care providers utilize screening tools calibrated to acute distress, we risk converting normal, culturally shaped grief into a billable condition. The loop runs fastest where reimbursement is tied to the label. Clinics will seek diagnoses to secure funding; patients will adopt the language to access care. This is not necessarily fraud; it is a rational response to the incentives we wire into the system. By publishing the count, we validate the condition, which increases help-seeking, which increases the count. The surveillance methodologist on our team argues that this renders the prevalence series unstable, as we are no longer tracking a fixed target but a moving reaction to our own reporting. This objection is scientifically sound. A time series broken by definitional shifts and behavioral responses loses its utility for trend analysis. However, in this specific context, the cost of delay outweighs the cost of discontinuity.

  **Historical and Philosophical Considerations**

  We must judge whether PGD exhibits the marks of a diagnosis that is historically transient or socially responsive. It meets the criteria: a taxonomy now exists to name it; a pool of symptoms is present in the population; our current cultural setting—marked by recent mine collapses, floods, and overdose deaths—gives the condition specific meaning; and the diagnosis offers the recipient validation and resources. Some argue that because the classification changes the object, the data is compromised. We reject the notion that looping classifications are false. A classification whose objects respond to it can be entirely real. Creating the category enlarges what people are able to say and do about themselves. For the bereaved-parent advocate on this board, the delay of publication is itself an intervention that shapes who gets recognized. To withhold the label is to deny the reality of suffering that currently goes waved off as ordinary grief.

  However, recognizing the reality of the condition does not absolve us of the responsibility to measure it carefully. The methodologist's concern is not that the grief is fake, but that the *count* becomes a measure of our policy rather than the population's health. We weigh this against the surveillance-integrity worry by acknowledging that medicalizing grief is not automatically a harm, but indiscriminate medicalization is. In a state saturated with recent loss, the risk is not that we create grief, but that we pathologize its normal duration. Therefore, the existence of the loop is not a reason to withhold the count, but it is a reason to rigidly anchor the criteria used to generate it.

  **Threshold and Comparability**

  We must resolve the discrepancy between ICD-11 (6-month duration) and DSM-5-TR (12-month duration). Our back-coding indicates this choice moves the counted population by a wide margin. Given the state's recent disaster history, adopting the six-month threshold risks capturing acute grief that would otherwise resolve without intervention. This would inflate prevalence artificially and strain clinic capacity with cases that may not require specialized grief care.

  We recommend adopting the DSM-5-TR 12-month threshold for both dashboard reporting and reimbursement eligibility. This creates a higher bar for entry, ensuring that the "prolonged" label reflects enduring dysfunction rather than acute pain. A simple discontinuity note on the dashboard is insufficient because the incentive structure drives the behavior. We require a structural fix: the reimbursement pathway must lock to the same 12-month standard used in public reporting. This ensures that the financial incentive does not undermine the epidemiological standard. We will mark FY2025 as a baseline year, explicitly noting that comparisons to future years must account for the behavioral feedback loop inherent in the new category.

  **Monitoring Plan**

  Because our measurement is part of the loop, we must monitor the loop itself. In Year Two, the Subcommittee will examine three specific metrics to determine if the classification is driving artificial prevalence. First, we will compare screening positivity rates in primary care against confirmed diagnosis rates. A widening gap suggests screening tools are over-identifying candidates relative to clinical judgment. Second, we will track the demographic distribution of diagnoses. If prevalence spikes disproportionately in counties without recent disaster events, it suggests coding creep rather than genuine need. Third, we will monitor the duration of care. If the average number of sessions per patient drops while total patients rise, it indicates the label is being used for access rather than treatment intensity. These metrics will trigger a review of the criteria threshold if deviations exceed standard variance.

  **Criteria for Future Categories**

  To ensure this is not a one-off judgment, we extract the following criteria for any future contested category requiring a feedback assessment. First, **Incentive Alignment**: If a label drives reimbursement, the reporting standard must match the eligibility standard to prevent administrative arbitrage. Second, **Cultural Vulnerability**: If the state is undergoing specific trauma events relevant to the diagnosis, stricter duration or severity thresholds are required to prevent pathologizing normal reactions. Third, **Loop Capacity**: We must assess whether the population can realistically adopt the label. High-adoption categories require more robust monitoring than low-adoption ones.

  **Conclusion**

  The methodologist's objection regarding time-series stability is the strongest argument against immediate publication. They are correct that we are sacrificing longitudinal purity. However, in a climate of widespread bereavement, the ethical imperative to provide recognizable entitlements supersedes the statistical preference for a stable denominator. We can recover methodological rigor in Year Two through the monitoring plan outlined above, but we cannot recover lost time for those currently ineligible for care. We vote to publish, with the safeguards described.
