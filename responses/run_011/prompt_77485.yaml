  2.  **Validate User's Physics Intuition:**
      *   *Landauer Limit:* $k \approx 1.38 \times 10^{-23}$ J/K. $T \approx 300$ K. $\ln 2 \approx 0.69$.
      *   Calculation: $1.38 \times 10^{-23} \times 300 \times 0.69 \approx 2.86 \times 10^{-21}$ J. User says $3 \times 10^{-21}$. **Correct.**
      *   *Modern Transistor:* Typical switching energy is in the femtojoule ($10^{-15}$ J) range. $10^{-15} / 10^{-21} = 10^6$. User says $10^5$. **Close enough for order-of-magnitude screening.**
      *   *Load-bearing beliefs:* The gap between current tech and Landauer limit is huge (5-6 orders of magnitude). Claims of beating Landauer are impossible. Claims of approaching it require radical changes (speed/area trade-offs). Entropy is about *information loss*, not just movement.
      *   *Decorative beliefs:* Exact value of $k$. Whether "heat" is phonons or photons.

  3.  **Develop the Screening Procedure (The "Thermo-Filter"):**
      *   *Goal:* Filter out pseudoscience, identify genuine physics risks, flag engineering feasibility.
      *   *Structure:* Sequential questions. Stop conditions.
      *   *Key Numbers:* $E_{Landauer} = 3 \times 10^{-21}$ J/bit (at 300K). $E_{Current} \approx 10^{-15}$ J/op (CMOS). Ratio $\approx 1,000,000$.
      *   *Terminology Check:* "Adiabatic" in physics = no heat exchange. "Adiabatic" in computing = slow switching to recover charge (often implies reversible-ish). Need to clarify this.
      *   *Judgment Calls:* Must be explicit.

      *   *Step 1: The Claim Check.* Is the claim about *fundamental limits* or *engineering efficiency*?
      *   *Step 2: The Number Check.* Do they provide energy per bit/op? Compare to Landauer and Current CMOS.
      *   *Step 3: The Entropy Check.* Where does the entropy go? (Crucial for Maxwell's Demon claims).
      *   *Step 4: The Trade-off Check.* Reversibility/Adiabatic usually costs Speed or Area. Do they acknowledge this?
      *   *Decision Matrix:*
          *   Claim $< E_{Landauer}$: Reject (Impossible).
          *   Claim $\approx E_{Landauer}$ without massive speed/area penalty: Escalate (Too good to be true/Physics check).
          *   Claim $> E_{Landauer}$ but $< E_{Current}$ with valid trade-offs: Fund (Engineering study).
          *   No numbers/Evasion: Reject (unless high trust, then Fund for numbers).

  4.  **Address the "Adiabatic" Confusion:**
      *   Physicists: $dQ = 0$.
      *   Engineers/Vendors: "Adiabatic charging" (slow ramping of voltage to reduce $I^2R$ loss). It's not truly adiabatic thermodynamically, but it reduces dissipation.
      *   *Action:* Ask "Does 'adiabatic' mean you are trading clock speed for energy, or that you violate the Second Law?"

  5.  **Drafting the Procedure (Iterative Refinement):**
      *   Make it a checklist.
      *   Include the "Handoff Note" requirements for physicists.
      *   Highlight judgment calls.

  6.  **Applying to Test Cases:**

      *   *Case 1: Correlation-aware erase.*
          *   Claim: Predictable data = less than 1 bit entropy = less than $kT \ln 2$ erase cost.
          *   Physics: This is actually *correct* in information theory (Shannon entropy vs. raw bits). If data is compressed/predictable, the *information* content is lower. Erasing known data costs less.
          *   Catch: The *controller* to predict the data costs energy. Does the prediction cost more than the save?
