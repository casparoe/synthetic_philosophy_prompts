answer: |-
  ## Part 1: Physics Sanity Check

  Your intuition is load-bearing; your numbers are usable.

  1.  **The Numbers:**
      *   **Landauer Limit ($E_L$):** $3 \times 10^{-21}$ Joules per bit at 300K. **Correct.**
      *   **Modern CMOS Switch:** $\approx 10^{-15}$ Joules per operation (femtojoule range). **Correct.**
      *   **The Gap:** Current hardware operates at roughly **$1,000,000 \times$ the Landauer limit**.
      *   **Load-Bearing Belief:** Any claim to operate *below* $3 \times 10^{-21}$ J/bit is impossible. Any claim to approach it (within $100\times$) requires massive trade-offs in speed or area.
      *   **Decorative Belief:** The exact value of $k$. Whether heat is phonons or photons. The distinction between "computation" and "communication" (both move entropy).

  2.  **The "Adiabatic" Trap:**
      *   **To a Physicist:** No heat enters or leaves the system ($dQ=0$).
      *   **To a Vendor:** "Adiabatic charging." Slowly ramping voltage to recover charge from capacitance rather than burning it as heat.
      *   **The Mismatch:** Vendors use "adiabatic" to mean "energy recovering." They often imply this bypasses thermodynamic limits. It does not. It reduces resistive loss ($I^2R$), but logical erasure still costs $kT \ln 2$.
      *   **The Question:** Do not ask "Is it adiabatic?" Ask: **"Does 'adiabatic' mean you are trading clock speed for energy recovery, or that you avoid bit erasure?"**

  3.  **Judgment Calls vs. Rules:**
      *   **Rule:** Claims $< 3 \times 10^{-21}$ J/bit are impossible.
      *   **Judgment:** Whether a trade-off (e.g., $10\times$ area for $2\times$ efficiency) is worth a feasibility study.
      *   **Judgment:** Whether a proposer who cannot provide numbers is "early stage" (Fund) or "hiding something" (Reject).

  ---

  ## Part 2: The Screening Procedure ("The Thermo-Filter")

  **Time Budget:** 45 Minutes.
  **Materials:** Whiteboard, Calculator.
  **Constants:** $E_L = 3 \times 10^{-21}$ J/bit. $E_{CMOS} = 1 \times 10^{-15}$ J/op.

  ### Step 1: The Number Interrogation (10 Minutes)
  **Question:** "What is the energy cost per logical bit operation or erasure in your design, in Joules?"
  *   **Sufficient Answer:** A number with units (Joules, Watts/Hz, or eV).
  *   **Insufficient Answer:** "Percent improvement," "Below CMOS," "Near theoretical limits."
  *   **Action if No Numbers:** Ask them to derive it from power and frequency on the whiteboard. If they refuse or cannot: **REJECT** (unless the proposer is high-trust internal, then **FUND** to generate numbers).

  **Decision Point A:**
  *   If Claim $< 3 \times 10^{-21}$ J/bit: **REJECT** (Violates Second Law).
  *   If Claim $> 1 \times 10^{-15}$ J/op: **REJECT** (Worse than standard hardware).
  *   If Claim is between $3 \times 10^{-21}$ and $1 \times 10^{-15}$: **PROCEED**.

  ### Step 2: The Entropy Source (15 Minutes)
  **Question:** "Where does the entropy go? Specifically, are you erasing bits, or are you moving them?"
  *   **Context:** Vendors often claim efficiency by "moving data" while claiming thermodynamic breakthroughs. Moving data costs energy (transmission), but only *erasing* data hits the Landauer limit.
  *   **Sufficient Answer:** "We avoid erasure by uncomputing garbage bits" (Reversible) OR "We reduce the Shannon entropy of the data before erasure" (Compression/Correlation).
  *   **Insufficient Answer:** "We manage heat better," "We use the information to cool the system" (without accounting for the controller's cost).

  **Decision Point B:**
  *   If they claim "Free Cooling" via information (Maxwell's Demon) without accounting for the sensor/compute cost of the demon: **ESCALATE** (Requires physicist to check the bookkeeping).
  *   If they claim Reversible Computing: Ask Step 3.
  *   If they claim Standard Erasure but lower energy: **PROCEED**.

  ### Step 3: The Trade-Off Check (15 Minutes)
  **Question:** "Approaching the Landauer limit requires quasi-static (slow) operation. What is your penalty in Area or Frequency?"
  *   **Sufficient Answer:** "We are $X\times$ slower" or "We are $Y\times$ larger."
  *   **Diagnostic:** If they claim near-Landauer efficiency *and* high speed *and* small area: **ESCALATE** (Likely error in measurement or definition).
  *   **Adiabatic Specific:** If they say "Adiabatic," ask: "Is this charge recovery (circuit level) or logical reversibility (gate level)?"
      *   Charge Recovery: Expect speed penalty.
      *   Logical Reversibility: Expect garbage bit management overhead.

  **Decision Point C:**
  *   If Trade-off is acknowledged and plausible for Edge (e.g., lower freq is okay for sensors): **FUND**.
  *   If Trade-off is denied or hidden: **ESCALATE**.
  *   If Trade-off makes the product useless for Edge (e.g., $100\times$ slower): **REJECT**.

  ### Step 4: The Handoff Note (If Escalating)
  If you send to a physicist, the note must contain:
  1.  **The Claimed Number:** (e.g., $10^{-20}$ J/op).
  2.  **The Proposed Mechanism:** (e.g., "Reversible logic with adiabatic clocking").
  3.  **The Specific Contradiction:** (e.g., "They claim this speed at this energy, which implies $100\times$ faster than quasi-static limit").
  4.  **The System Boundary:** (e.g., "They exclude the clock generator power").
  *Do not ask the physicist to validate the engineering. Ask them to validate the thermodynamics.*

  ---

  ## Part 3: Application to Test Cases

  ### Case 1: "Correlation-aware erase" (Internal Engineer)
  *   **Step 1 (Numbers):** Engineer claims cost scales with *Shannon Entropy* of the block, not raw bit count. If data is 99% predictable, cost $\ll kT \ln 2$.
      *   *Physics Check:* **Valid.** Landauer cost is proportional to the loss of *information*. If the state is known (predictable), resetting it generates less entropy.
  *   **Step 2 (Entropy):** Entropy is reduced by the predictive model *before* the physical erase.
  *   **Step 3 (Trade-off):** The cost is the energy of running the predictive model on the controller.
  *   **Verdict:** **FUND.**
      *   *Reasoning:* The physics is sound (Information Erasure vs. State Reset). The risk is engineering: does the predictor cost more than the save? This is a standard feasibility study question.
      *   *What we are building:* A storage controller with an embedded compression/entropy estimator that gates physical write/erase cycles based on information content, not just logical commands.

  ### Case 2: "Reversible-adiabatic accelerator" (Vendor)
  *   **Step 1 (Numbers):** Claim: "Energy per op below Landauer limit for equivalent irreversible." Slide shows bar next to $kT \ln 2$.
      *   *Ambiguity:* Do they mean $< 3 \times 10^{-21}$ J? Or $< 10^{-15}$ J (CMOS)?
      *   *Assumption:* If the bar is visually comparable to $kT \ln 2$, they imply near-limit operation.
  *   **Step 2 (Entropy):** Claims "no heat beyond leakage." This implies perfect reversibility.
  *   **Step 3 (Trade-off):** 3x Area, 0.1x Frequency. This is consistent with adiabatic/reversible logic (slow switching to recover charge).
  *   **Verdict:** **ESCALATE.**
      *   *Reasoning:* The trade-off is honest, but the headline claim ("below Landauer limit for equivalent...") is semantically dangerous. If they claim total energy/op $< 3 \times 10^{-21}$ J, it's impossible. If they claim $< 10^{-15}$ J, it's trivial. A physicist must verify if their measurement includes the *clocking energy* (often excluded in adiabatic claims) and if "below Landauer" is marketing fluff or a hard claim.
      *   *Narrower Fundable Version:* If they rephrase to "Energy per op $100\times$ better than CMOS, at $10\times$ latency," and remove the Landauer comparison, this becomes a **FUND**. The physics risk drops; it becomes an integration study.

  ### Case 3: "Demon-class controls" (Vendor)
  *   **Step 1 (Numbers):** 12% site energy reduction.
  *   **Step 2 (Entropy):** Claims "Maxwell's Demon... converts information... into free cooling."
      *   *Physics Check:* **False.** Information does not convert to cooling. The *application* of information (routing workloads) optimizes thermodynamics, but the "Demon" (controller) pays an energy cost to measure and compute.
  *   **Step 3 (Trade-off):** None stated for the control layer.
  *   **Verdict:** **FUND (with caveat).**
      *   *Reasoning:* Do not reject on metaphor. The "Demon" framing is decorative nonsense, but the engineering claim (12% reduction via workload routing + heat recovery) is a standard DCIM (Data Center Infrastructure Management) claim.
      *   *Combination:* Evaluate the 12% as an engineering claim (FUND/REJECT based on ROI). Note in the recommendation: "Physics framing is incorrect; vendor implies information creates energy. Treat as standard optimization proposal."
      *   *Why not Escalate?* The error is conceptual/marketing, not a hidden violation of physics that risks the fund. We know the Demon must be paid. We can budget for the controller's power draw in the feasibility study.

  ---

  ## Part 4: Limitations & False Negatives

  ### What This Procedure Cannot Do
  1.  **Detect Architectural Efficiency:** This filter is tuned for *thermodynamic* claims. It will **False Negative** proposals that save energy via "moving data less" or "batching better."
      *   *Example:* A proposal to aggregate sensor data locally before transmission saves 90% energy. It has no thermodynamic story.
      *   *Fix:* **Create a "Lane 2" for System Efficiency.** If a proposal has no thermodynamic claims, bypass this filter. Evaluate on ROI and system architecture only.
  2.  **Validate "Near-Limit" Measurements:** If a vendor claims $100 \times E_L$ (which is fundable), your panel cannot verify their measurement setup. You are relying on their honesty or the physicist's later check.
  3.  **Account for Manufacturing Cost:** A device might be thermodynamically perfect but require exotic materials (e.g., superconductors) that are impossible for edge deployment. This procedure funds the *physics feasibility*, not the *commercial viability*.

  ### False Positives
  *   **The "System Boundary" Trick:** A vendor claims low energy per op but excludes the cooling system or the clock generator. The procedure might Fund this.
      *   *Mitigation:* Step 3 (Trade-off) usually catches this if you ask "Total system power?"
  *   **The "Marketing Reversible":** Vendors calling standard CMOS "reversible" because they reuse some charge.
      *   *Mitigation:* Step 2 (Entropy Source). Ask "Do you uncompute garbage bits?" If no, it's not logically reversible.

  ### False Negatives (The Worry)
  *   **The "No Numbers" Innovator:** A brilliant theorist with a napkin sketch that violates no laws but has no Joule estimates yet.
      *   *Mitigation:* Use the **High-Trust Internal Exception** in Step 1. If the proposer is known/vetted, Fund to *generate* the numbers.
  *   **The "Batching" Blindspot:** As noted, pure system-level efficiency will look like "No Thermodynamics" and might get bored rejection if forced through this filter.
      *   *Mitigation:* **Explicit Rule:** If a proposal contains no claims about $kT$, bits, or heat limits, **do not use this procedure.** Route to Standard Architecture Review.

  ### Summary of Judgment Calls (Wearing Clothes of Rules)
  1.  **Step 1 (No Numbers):** Deciding if a lack of numbers is "evasion" (Reject) or "early stage" (Fund). *Guideline: External = Reject. Internal = Fund.*
  2.  **Step 3 (Trade-offs):** Deciding if a $10\times$ area penalty is acceptable for Edge. *Guideline: If it fits the rack and power envelope, it's acceptable.*
  3.  **Case 3 (Metaphor vs. Mechanism):** Deciding to ignore the "Maxwell's Demon" lie. *Guideline: Ignore the noun, evaluate the verb. If the verb is "route workloads," it's engineering.*

  ### Final Recommendation to Chair
  Print the **Constants** and the **4-Step Filter** on a single sheet. Keep the **Handoff Note** template in your meeting invite. For any proposal without explicit Joule/bit claims, route it to a separate "Architecture Lane" immediately to avoid false negatives on batching/locality improvements.
