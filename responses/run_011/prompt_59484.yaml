prompt: |-
  Under English law a dead person's wishes about their property go on binding the living: a will or trust can impose conditions that continue to control assets for generations, and courts will enforce them long after everyone who knew the testator has gone. Medical regulators likewise tell doctors that the duty of confidence continues after a patient's death, so records stay protected. Yet the same statute that lets most legal claims survive for the benefit of a deceased person's estate expressly excepts defamation: if someone publishes falsehoods that destroy a dead person's reputation, no claim lies, and a libel action already under way simply ends when the claimant dies. So the system will police what I wanted done with my money and with my medical file for decades after I am gone, while treating my reputation as legally non-existent.

  Meanwhile I have been reading the argument that death cannot be bad for the person who dies, on the ground that where death is, they are not, and nothing can reach them. Does this patchwork presuppose that some of my interests outlive me after all, or is it fully consistent with the thought that nothing does, and that every rule here is really about the living — certainty of title, the feelings of the bereaved, the regulation of doctors, the difficulty of proving what the dead would have wanted? Reconstruct the implicit view of post-mortem harm, distinguish what the practice strictly requires from what it merely happens to fit, say where it is philosophically underdetermined between rival theories, and then tell me what would have to change if the law adopted a consistently Epicurean line, or instead a line on which death genuinely leaves someone with interests that can be thwarted. Please answer in continuous prose, without headings, bullet points, bold text or tables, as you would in a letter.
