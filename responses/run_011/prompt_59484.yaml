answer: |-
  My dear friend, you have put your finger on a profound inconsistency that lies at the heart of how the law negotiates the boundary between existence and non-existence. It is indeed striking that the legal system acts as though you are still present when it comes to the disposition of your wealth and the secrecy of your medical history, yet treats you as utterly vanished the moment someone seeks to slander your name. To understand this patchwork, we must first reconstruct the implicit view of post-mortem harm that currently animates English law, which is not a unified philosophical stance but rather a pragmatic assemblage of policy decisions. The law does not truly presuppose that your interests outlive you in a metaphysical sense; rather, it presupposes that the stability of the living society depends on treating certain aspects of your persona as if they persisted. When a court enforces a will, it is not primarily vindicating your current desire, since you have none, but rather upholding the institution of private property and the expectations of your heirs. Similarly, the duty of medical confidentiality after death is not maintained because you are suffering a privacy violation in the grave, but because the living need to trust that their own secrets will be safe when they eventually die. In this sense, the practice is fully consistent with the Epicurean thought that nothing can reach you once you are gone, because the rules are actually addressed to the living, governing their conduct and securing their expectations.

  However, distinguishing what the practice strictly requires from what it merely happens to fit reveals a significant tension. Strictly speaking, the transfer of property requires only a clear rule of succession, not necessarily adherence to the specific whims of the testator beyond what is needed to validate the transaction. The law could, in theory, distribute assets by a fixed formula upon death without violating any logical necessity of property rights, yet it chooses to honour specific conditions, which creates the appearance of a surviving agency. Conversely, the exemption of defamation from the survival of actions is where the law most clearly admits that you are gone. The rationale here is often that reputation is a purely personal asset that cannot be inherited, and that allowing suits for the defamation of the dead would unduly chill free speech and historical inquiry. This fits the Epicurean view that you cannot be harmed, but it clashes with the treatment of medical records, which are also personal and also incapable of being inherited in a commercial sense, yet remain protected. This is where the system is philosophically underdetermined. There is no coherent ontological principle that explains why a false statement about your financial probity in a will is actionable because it affects the estate, while a false statement about your moral character is not, even if both destroy how you are remembered. The law oscillates between treating you as a continuing legal person for the sake of economic order and treating you as a biological nullity for the sake of expressive freedom, without admitting that it is making a choice between rival theories of death.

  If the law were to adopt a consistently Epicurean line, accepting that death extinguishes all interests and that the dead cannot be subjects of harm, we would see a radical simplification of these rules. A strict Epicurean legal system would likely abolish the power of wills to impose long-term conditions, viewing such attempts as the vain reach of a non-existent hand trying to grasp the future. Property would pass immediately to the living heirs or the state, unburdened by the dead's preferences, because those preferences no longer exist to be respected. Medical confidentiality would cease instantly upon death, as there would be no subject whose privacy could be breached, and any protection would have to be justified solely on the grounds of the living relatives' distress, which is a much weaker claim. Most significantly, the current exemption for defamation would not need to exist as a special exception, because no tort against the dead would be conceivable in the first place; the law would simply state that no duty is owed to the non-existent. The current system is not Epicurean because it retains the fiction of the testator's will, but it is not fully anti-Epicurean because it refuses to protect reputation.

  On the other hand, if the law were to adopt the view that death genuinely leaves someone with interests that can be thwarted, the changes would be equally profound but in the opposite direction. This view, often associated with the idea of ante-mortem persons having post-mortem rights, would require the law to recognise reputation as a protectable asset of the estate, just like a house or a bank account. You would need a mechanism for the dead to sue, perhaps through a permanent representative, for libels published decades after their passing. This would likely extend beyond defamation to other areas; for instance, breaking a promise made to a dying person might become a specific legal wrong against the deceased rather than just a breach of contract with the estate. It would also complicate medical confidentiality, shifting the justification from public trust to the actual rights of the deceased patient, potentially making those rights absolute rather than balanceable against public interest. Ultimately, the current legal patchwork tries to have it both ways, preserving social order by pretending you are still here when it is convenient for commerce and medicine, while allowing history and speech to move freely by pretending you are gone when it is convenient for the public. It is a compromise that works administratively but fails philosophically, leaving you as a legal ghost who can own property but cannot hold a reputation. I hope this helps clarify the strange limbo in which the law places us all.
