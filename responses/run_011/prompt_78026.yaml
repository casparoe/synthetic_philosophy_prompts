answer: |-
  Here is the translation of the reparations debate into the vocabulary of forensic economics and tort law, followed by the residue report and the attack on your hypothesis.

  ### The Translation

  In your vocabulary, the reparations claim is a mass-tort action for intergenerational unjust enrichment and negligent infliction of economic harm.

  **The Parties:** The plaintiff class is defined by lineage (descendants of chattel slavery and Jim Crow). The defendants are successor entities: the federal and state governments (successor liability for sovereign torts), specific corporations (corporate succession), and potentially the general taxpayer (via general revenue funding).

  **The Breach:** A series of discrete historical acts (enslavement, convict leasing, redlining) aggregated into a single continuing course of conduct (structural racism).

  **The Damages Model:** A hybrid of compensatory and restitutionary measures.
  *   *Compensatory:* The present value of lost labor, lost wealth accumulation, and lost opportunity over multiple generations, discounted to today.
  *   *Restitutionary:* The unjust enrichment accrued to the defendant class (white wealth accumulation) derived from the plaintiff class's uncompensated labor and exclusion.

  **The Hurdles:**
  *   *Statute of Limitations:* Overcome via the discovery rule (the harm was concealed) or continuing-violation tolling (the harm is ongoing).
  *   *Causation:* Must bridge the gap between specific historical acts and current socioeconomic status without succumbing to the non-identity problem (the claim that but-for the breach, these specific plaintiffs would not exist).
  *   *Certainty:* Must satisfy the reasonable-certainty standard despite the speculative nature of multi-generational counterfactuals.
  *   *Apportionment:* Must determine joint and several liability among defendants who did not act in concert and across time periods where the tortfeasors are deceased.

  ***

  ### The Residue Report

  **1. Persisting Structure vs. Continuing Violation**
  Mapping "structural injustice" onto **continuing-violation tolling** preserves the statute of limitations but destroys **proximate cause**.
  In tort law, a continuing violation tolls the clock because the *tortious act* is repeated. In the structural argument, the *act* (slavery/segregation) stopped, but the *condition* (wealth gap) persists. If you argue the condition is the violation, you are arguing for strict liability for status rather than negligence or intentional tort for conduct.
  *   *Result:* The mapping reduces the argument's force. It converts a claim about *wrongful acts* into a claim about *wrongful states of being*. Tort law can remedy the former; it has no mechanism for the latter without abandoning the requirement of breach. If the structure is the tortfeasor, everyone participating in the structure is a tortfeasor, which dilutes duty to the point of vanishing.

  **2. The Non-Identity Problem and Doctrinal Slots**
  The non-identity problem falls squarely into **causation-in-fact**, but it functions as a **standing** bar.
  If the "but-for" world (no slavery) results in different pairings and different conceptions, the specific plaintiffs before the court do not exist in that world. In your framework, a plaintiff must prove they were made *worse off* than they would otherwise have been. If the alternative is non-existence, they cannot prove they are worse off.
  *   *Weight Bearing:* Neither causation nor standing can bear this weight. Causation requires a comparison between two states of the *same* victim. Standing requires an injury in fact. The non-identity problem demonstrates that the "injury" is not to the *individual* plaintiff's welfare relative to their own baseline, but to a *group's* standing relative to a moral norm. Tort law lacks a slot for "group harm independent of individual welfare loss."

  **3. Compensatory vs. Restitutionary Equivocation**
  Yes, advocates move between these measures without marking the transition, and the equivocation is largely invisible outside your vocabulary.
  *   *The Shift:* When discussing the *moral* claim, they use restitution (what was taken/stolen). When discussing the *calculation*, they often use compensation (current income gaps/wealth gaps).
  *   *The Divergence:* These numbers diverge wildly. Unjust enrichment (restitution) might be zero if the capital derived from slavery was consumed or lost over generations, even if the plaintiffs' losses (compensation) are massive. Conversely, the enrichment might be massive (compounded capital) even if specific descendants cannot prove individual loss due to intervening causes.
  *   *Visibility:* By conflating "making the plaintiff whole" (compensation) with "disgorging the defendant's gain" (restitution), advocates avoid the **apportionment** problem. Restitution allows for joint and several liability against the "beneficiary class" regardless of specific causation. Compensation requires tracing the loss to the breach. The equivocation hides the fact that the chosen model determines the viability of the claim.

  **4. Ascertainable Class and Formulaic Model**
  Your requirements break the claim.
  *   *Ascertainability:* A class defined by descent is genetically ascertainable but legally diffuse. More critically, the *defendant* class is unascertainable. "The general taxpayer" or "white society" is not a legal entity capable of being sued jointly. You cannot apply a formula for damages against a defendant that does not exist as a single juridical person.
  *   *Formulaic Model:* A damages model must be reducible to a formula applied to a defined population. A reparations model requires a counterfactual simulation of history (a macroeconomic model) rather than a microeconomic extrapolation of individual loss. This fails the *Daubert* reliability standard because the inputs (historical counterfactuals) are not empirically testable.
  *   *Result:* The claim transforms from a tort action into a legislative appropriation. The requirement for an ascertainable defendant forces the claim out of the court and into the legislature.

  **5. Adjustments vs. Baseline (The Counterfactual Conflict)**
  This is a genuine contradiction between the frameworks, not just confused counterfactuals.
  *   *Forensic Econ:* Uses the *actual* market conditions to project the *actual* loss. (e.g., "But for the firing, you would have worked in this discriminatory market for 20 more years.") It accepts the market's imperfections as the background reality.
  *   *Reparations:* Uses a *normative* market condition to project the *ideal* loss. (e.g., "But for slavery, you would have inherited wealth in a non-discriminatory market.")
  *   *The Conflict:* Your framework asks: "What is the loss given the world as it is?" The reparations framework asks: "What is the loss given the world as it should have been?"
  *   *Conclusion:* You are calculating damages for a tort within a system. They are calculating damages for the tort *of* the system. These are incommensurate quantities. One is a breach of contract/tort within the rules; the other is a challenge to the rules themselves.

  ***

  ### The Real Question: Defect or Indeterminacy?

  Is the residue a defect in tort damages, or evidence that the claims were never determinate?

  It is evidence that the claims are **morally determinate but legally indeterminate**.

  Tort law is a technology for resolving bilateral disputes where the transaction costs of private bargaining are too high. It assumes a *closed system*: two parties, a discrete event, a reset button (damages) that returns the parties to the status quo ante.

  Historical injustice is an *open system*.
  1.  **Time:** The chain of causation is too long for the "reasonable certainty" standard to function without becoming fiction.
  2.  **Parties:** The tortfeasors and victims are dead; the current parties are successors who did not consent to the liability.
  3.  **Remedy:** No dollar figure restores the status quo ante because the "ante" involved a different population and a different social ontology.

  The residue is not a bug in your framework; it is a feature. Your framework is designed to *limit* liability to what is provable and specific to prevent infinite regress. The reparations claim *requires* infinite regress (tracing history back to the origin of the harm). Therefore, the framework correctly identifies the claim as non-justiciable *as a tort*. The claims are "true" in a moral ledger (inheritance of obligation), but "false" in a legal ledger (inheritance of liability). The friction you feel is the sound of a moral claim grinding against a legal mechanism that was built specifically to exclude it.

  ***

  ### Attacking Your Hypothesis

  Your hypothesis is that the dispute is a **measurement problem**: everyone agrees on breach and causation in the abstract, and the fight is about discount rates, counterfactuals, and standing (econometrics in philosophy's clothes).

  **This is wrong.**

  If measurement were perfect—if we had a God's-eye view of the exact wealth transfer, the exact discount rate, and the exact counterfactual lineage—the dispute would not vanish. It would intensify.

  **1. The Disagreement is Ontological, Not Quantitative**
  If you produced a perfect damages model, the opposition would not say, "Your discount rate is wrong." They would say, "I do not owe this debt."
  The core disagreement is not about *how much* is owed, but *who* owes *whom*.
  *   **Liability vs. Responsibility:** Your framework assumes liability follows the act. The opposition argues that liability cannot be inherited by innocent successors. This is not a measurement error; it is a rejection of **successor liability** for moral torts.
  *   **The Nature of the Duty:** You assume a duty existed. The opposition argues that the "duty" was a political construct that has expired. Perfect measurement does not solve the statute of limitations on moral obligation.

  **2. The "Breach" is Not Agreed Upon**
  You state everyone concedes breach in the abstract. They do not.
  *   One side views the historical acts as *torts* (actionable wrongs).
  *   The other views them as *historical conditions* (tragic, perhaps immoral, but not actionable legal breaches binding on the present).
  *   If measurement were perfect, the argument would shift to **sovereign immunity** and **ex post facto law**. The disagreement would look like a constitutional crisis, not a damages hearing.

  **3. The Remedy is Not Damages**
  If the measurement were perfect, the number would be so large it would reveal that **damages are the wrong remedy**.
  *   Tort damages are backward-looking (indemnity).
  *   Reparations advocates often seek forward-looking transformation (investment, policy change).
  *   If you calculate the number perfectly, you prove that the defendant class cannot pay without collapsing the system that generates the wealth. The argument then becomes: "Is the goal to compensate the past or to restructure the future?"
  *   If the goal is restructuring, the damages model is irrelevant. You are arguing for tax policy and redistribution, not tort recovery.

  **Conclusion:**
  The dispute is not econometrics wearing philosophy's clothes. It is **political philosophy wearing econometrics' clothes**. The numbers are not the substance of the argument; they are a proxy for the legitimacy of the claim. If measurement were perfect, the veil would lift, and you would see that the fight is not about the *size* of the debt, but the *validity of the creditor* and the *authority of the collector*. Your framework cannot solve this because it is designed to calculate debts that are already admitted, not to adjudicate whether the debt exists at all.
