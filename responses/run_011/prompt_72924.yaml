answer: |-
  This is a fascinatingly specific set of precedents. Your mom's committee has essentially built a common-law framework for state contrition without ever writing it down. Based on the six cases you listed, I can extract the four implicit rules governing their decisions, apply them to the new psychiatric drug case, and then give you the stress-test hypothetical you asked for.

  ### The Four Implicit Rules of the Committee

  Looking at the track record, these are the four operational principles they are actually using, ranked roughly by weight:

  1.  **The Continuity Rule (Name on the Door):** If the agency still exists under the same name and directly committed the act, an apology is *possible* (Cases 1, 3). If the agency was dissolved, folded, or was a private entity, the state deflects to "remembrance" or "failure to protect" (Cases 2, 5).
  2.  **The Cessation Rule (Engine Still Running):** If the specific practice or the *legal authority* for it is still active, no apology is issued (Case 4). The state will not apologize for a sin it is legally capable of repeating tomorrow.
  3.  **The Enrichment Rule (Fruits of the Sin):** If the state still directly benefits (owns the building, uses the data, holds the records), an apology is either declined or heavily conditioned on divesting that benefit (Cases 2, 3).
  4.  **The Voice Rule (Victim Agency):** If living victims exist and ask for an apology, it weighs heavily in favor of passing one (Cases 1, 3, 6). If they disagree, the state tries to satisfy both (Case 6). If they are dead/unidentifiable, the state feels less pressure (Case 2).

  ### The Argument: Consistency vs. The New Case

  The new case (1970s Psych Drug Testing) is the hardest one they've faced because it splits the four rules right down the middle.

  **The Argument for Apology (Training School Analog):**
  *   **Continuity:** It's the same Health Department, same name. (Matches Case 1).
  *   **Voice:** The surviving victims (30 people) nearly unanimously want the apology. (Matches Case 1 & 3).
  *   **Cessation:** The specific *experimental program* shut down in '79. (Matches Case 1).
  *   **Precedent:** In Case 3 (Sterilization), they approved an apology even when it required the state to release withheld records. They could condition this apology on a review of the data usage.

  **The Argument Against Apology (Engine-Running Analog):**
  *   **Cessation:** The *statute* allowing involuntary medicating is still on the books and used. This is the "Engine Still Running" from Case 4. Even if the *experiment* stopped, the *power* that enabled it remains.
  *   **Enrichment:** Current treatment protocols cite the study's data. The state is still intellectually/professionally profiting from the unethical act. (Matches Case 2's "owns the building" logic).
  *   **Liability:** There is an active lawsuit. Case 5 shows they are wary of admitting direct fault when litigation is possible, though Case 5 was about a private company.
  *   **Advocacy Split:** One coalition says apologizing while citing the data is hypocritical. This muddies the "Voice Rule."

  **The Verdict on Consistency:**
  Strictly speaking, **the Cessation Rule trumps the Voice Rule** in their history. In Case 4, they declined even when the harm was historical, simply because the legal authority remained. In Case 2, they declined because the state still owned the building (Enrichment), even though there were no victims to object.

  Therefore, to be consistent with their own record, **they should decline the full apology.** The continued use of the statute and the citation of the data means the "engine" is technically still running and the "fruits" are still being eaten.

  ### What They *Should* Do vs. What They *Will* Do

  **What They Should Do (The Principled Path):**
  They should pass a **Conditional Apology**.
  *   **Logic:** This follows Case 3 (Sterilization). They apologize for the non-consensual experimentation (which is dead) but explicitly condition the resolution on the Health Department commissioning an independent review of the data's current usage.
  *   **Distinction:** They must distinguish the *statute* (court-ordered meds for current safety) from the *study* (experimental drugs for research). If they conflate the two, they trigger Case 4. If they separate them, they satisfy Case 1.
  *   **Why:** It honors the survivors (Voice) without forcing the state to admit guilt in the active lawsuit (since the resolution can specify it applies to the historical study, not current statutory usage).

  **What They Will Do (The Political Path):**
  They will likely pass a **"Resolution of Remembrance"** (Case 2 style) or table it indefinitely.
  *   **Why:** The active lawsuit is the wildcard not present in the previous six cases. Legislators are risk-averse. An apology can be entered as evidence of liability.
  *   **The Cover:** They will use the "Advocacy Split" as an excuse. Since one coalition says the apology would be hypocritical (due to the data usage), the committee will claim they are "respecting the victims' concerns" by not apologizing yet. It allows them to look principled while actually protecting the state from liability and avoiding the hard work of reviewing the data protocols.

  ### The Stress-Test Hypothetical

  You asked for a made-up case that forces the four rules apart. The current case is tricky because Continuity and Voice say "Yes," while Cessation and Enrichment say "No." To really break their framework, you need a case where **Continuity and Cessation say "Yes," but Enrichment and Voice say "No."**

  **The Hypothetical:**
  > "In the 1950s, the State Department of Transportation (which still exists under the same name) seized a neighborhood to build a highway. The specific seizure program ended in 1960 (Cessation: **Yes**). The land was sold to private developers in 1980, and the proceeds went into the general fund; the state owns none of it now (Enrichment: **No**). However, the highway is still in use and is a critical economic artery (Enrichment: **Yes/Maybe**). All original victims are deceased, and their heirs have publicly stated they want financial restitution, not an apology, and have threatened to sue if an apology is issued without money (Voice: **No/Hostile**)."

  **How this breaks the rules:**
  1.  **Continuity Rule:** Says **Apologize**. (Same agency, direct act).
  2.  **Cessation Rule:** Says **Apologize**. (Program ended decades ago).
  3.  **Enrichment Rule:** Says **Decline**. (The highway is still a vital asset the state benefits from daily, similar to owning the building in Case 2).
  4.  **Voice Rule:** Says **Decline**. (The victims' representatives explicitly do *not* want words, they want money, and see words as a trap).

  **The Conflict:**
  In every real case so far, the "Voice Rule" (victims wanting it) has aligned with the "Continuity Rule" (agency exists). Here, the agency is ready to apologize, the harm is stopped, but the victims don't want it, and the state still benefits from the infrastructure.

  *   If they apologize, they violate the **Voice Rule** (ignoring what victims want) and risk the **Enrichment Rule** (apologizing for something they still profit from).
  *   If they don't apologize, they violate the **Continuity Rule** (agency exists) and **Cessation Rule** (harm is over).

  This forces the committee to decide: **Is an apology a gift to the state (to clear its conscience) or a service to the victim (to heal their harm)?** Their record implies it's a service to the victim (Case 6). But if the victim refuses the service, does the state have a duty to offer it anyway for its own moral cleansing? That is the question their precedents cannot answer.
