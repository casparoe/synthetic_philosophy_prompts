answer: |-
  You have identified a genuine gap in the standard forecasting vocabulary. While "survivorship bias" and "hindsight bias" are often waved in this direction, they are imprecise tools for the specific ontological problems you are describing. Survivorship bias concerns *missing data* (the dead are silent); hindsight bias concerns *psychological memory* (I knew it then). Your objection is more fundamental: it concerns the *constitution of the data itself*.

  There is no single, widely recognized pop-scientific label for this specific cluster of problems, but in the philosophy of history, econometrics, and metaphysics, your two objections map onto distinct, established concepts. Together, they describe a failure mode of the Outside View that I will argue is best termed **Retroactive Class Constitution**.

  Here is the carving you requested.

  ### 1. The First Objection: Outcome-Dependent Classification
  **Established Concept:** *Look-Ahead Bias* (Statistics/Finance) or *Goodman's "Grue" Problem* (Philosophy).

  Your first objection is that the features used to assign a polity to a class (administrative reach, tributary structure) are often only identifiable as *significant* once the trajectory is complete. In quantitative finance, this is **Look-Ahead Bias**: using information in a model that would not have been available to a trader at the time of the decision. If you classify an empire as "stable" based on a bureaucratic feature that historians only identified because the empire lasted 500 years, you have leaked the outcome into the input.

  Philosophically, this parallels Nelson Goodman's **"New Riddle of Induction"** (the *Grue* paradox). Goodman showed that we can define predicates that fit all past data but diverge in the future based on arbitrary time-dependencies. Your friend is assuming that "administrative reach" is a *natural kind* (like "mass" or "charge") that exists independently of observation. You are correctly suspecting it is a *projectible predicate* only because we have already seen the projection.

  **Why it differs from Hindsight Bias:** Hindsight bias is psychological ("I feel like I knew it"). Your objection is epistemic ("The definition of the variable relies on the value of the target variable").

  ### 2. The Second Objection: Diachronic Individuation
  **Established Concept:** *The Problem of Individuation* (Metaphysics) or *Periodization* (Historiography).

  Your second objection concerns the *count* of the units. If Rome is one unit, the mean lifespan is $X$; if it is two (West/East), the mean is $Y$. This is the **Problem of Individuation** applied over time (Diachronic Identity). In metaphysics, this is the *Ship of Theseus* problem: at what point of replacement or fracture does an object cease to be itself?

  In historiography, this is the problem of **Periodization**. Historical units are not discrete atoms like electrons; they are continuous processes that we slice into nouns for convenience. The "slice points" (fall of Rome, collapse of Bronze Age) are often drawn based on the narrative arc of the history, not on prospective, observable thresholds. When the unit count ($N$) depends on the outcome (did the fracture stick?), the base rate is mathematically unstable.

  **Why it differs from Survivorship Bias:** Survivorship bias assumes we know what the units *are*, but we only see the winners. Your objection is that we cannot even agree on *what counts as a unit* without knowing the winner.

  ### Are These One Problem or Two?
  They are **logically distinct but mutually reinforcing**.

  *   **Distinct:** You could theoretically agree on the definition of the class (Objection 1 resolved) but disagree on the count (Objection 2 remains). For example, everyone might agree on what constitutes a "dynasty," but disagree on whether a 10-year interregnum breaks the dynasty into two units or one. Conversely, you could agree on the unit count (Rome is one unit) but disagree on the classification features (was it a hegemon or an empire?).
  *   **Reinforcing:** In practice, they collapse into one another. We tend to define the features of a class (Objection 1) in ways that preserve the continuity of the units we care about (Objection 2). We call the Eastern Rome an "Empire" rather than a "Successor State" precisely because we want to preserve the narrative continuity of "Rome."

  ### The Unified Phenomenon: Retroactive Class Constitution
  Since no single existing term captures the combination of *outcome-dependent features* and *outcome-dependent unit identity*, the phenomenon is best described as **Retroactive Class Constitution**.

  This occurs when the reference class required for an Outside View forecast is not a pre-existing population waiting to be sampled, but is instead *constructed* by the historian after the fact. The "class" is a narrative artifact, not a statistical population.

  ### Does This Extend Beyond History?
  Yes. This bites wherever the identity of the object is socially or functionally defined rather than physically defined.

  *   **Startups:** If a company pivots entirely (e.g., Slack starting as a game company), is it the same firm? If you count it as the same, you extend the lifespan; if you count it as a death and a birth, you shorten it. Venture capital returns depend heavily on how you count "survivors."
  *   **Biology (Species):** In paleontology, determining whether a fossil represents a new species or a variation of an old one (anagenesis vs. cladogenesis) often depends on knowing the temporal spread of the fossils. The "lifespan of a species" suffers from the same individuation problem as Rome.
  *   **Firms:** When Company A acquires Company B, does Company A's lifespan continue? If the culture and management are replaced, is it the same organizational order?

  **Where it stops biting:** It does not bite in systems with **fixed ontological boundaries**.
  *   *Boundary Case (Not the Phenomenon):* Predicting the half-life of Uranium-238. The atom is a natural kind. Its identity does not depend on whether it decays tomorrow or in a billion years. The class "Uranium-238 atoms" is not constituted by the decay event.
  *   *Boundary Case (Not the Phenomenon):* Predicting the failure rate of a specific model of mechanical pump. The pump's identity is fixed by its serial number and manufacture date. Whether it breaks in a year or ten does not change whether it *is* that pump.

  ### The Escape Hatch: Do Prospective Criteria Work?
  You asked if a class defined by strictly prospective, outcome-independent criteria escapes this. **It does not; it merely relocates the trouble.**

  This is due to the **Theory-Ladenness of Observation**. Even if you and your friend agree on a prospective rule (e.g., "An empire ends when the capital city is occupied by a foreign power"), the *application* of that rule to historical data is often retrospective.
  *   *Example:* Was Constantinople "occupied" in 1204 or 1453? Was the government in exile still the legitimate authority?
  *   To code the historical data for your prospective rule, you must interpret messy historical events. That interpretation is almost always influenced by the known outcome. If the polity recovered, historians tend to code the occupation as a "temporary setback" (not an end). If it did not recover, they code it as "the fall."

  Thus, the coding of the independent variable (the rule) remains endogenous to the dependent variable (the lifespan).

  ### Summary for Your Argument
  Your friend is treating historical polities as **Natural Kinds** (like isotopes or biological species with fixed genetic boundaries). You are correctly treating them as **Narrative Kinds** (like genres of music or eras of art).

  *   **Objection 1 Name:** Outcome-Dependent Classification (Look-Ahead Bias).
  *   **Objection 2 Name:** Diachronic Individuation (Periodization).
  *   **Unified Concept:** Retroactive Class Constitution.

  You lost the thread at midnight because you were fighting a **Category Error**. The Outside View works best when the reference class is ontologically stable. In history, the reference class is ontologically fluid. You cannot calculate the probability of an outcome when the definition of the event itself depends on the outcome.

  If you need a term to wield in the next argument, use **Endogenous Reference Class Definition**. It signals that the class is not an external constraint on the prediction, but an internal product of the history being predicted.
