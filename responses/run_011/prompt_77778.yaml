answer: |-
  Good afternoon. Looking around this room, I see three distinct groups. There are the people who know exactly how much steel she ground away to make a curve. There are the people who knew her as a mother and a cousin. And there are the people here to record what happened today.

  Usually, at a memorial, we agree on the main subject. Today, we don't. Half the book jackets in this building wear her name, but many of you in the front row still argue about one specific letter. Her lowercase 'a'. It has no bowl. It is a stem with a flag. For forty years, colleagues have whispered that this letter left the alphabet.

  Her granddaughter is here. She is nine. Last week, she asked me the question that matters: "But is it an *a*?"

  I am not going to dodge this. The answer is yes.

  It is an 'a' not because it looks like the one in your schoolbook, but because it does the work of an 'a'. She didn't design letters in isolation. She designed relationships. Her test was never "does this look like an archetype?" Her test was, "does this hold up next to my own 'n' and my own 'o'?"

  She would set proof lines of nothing but letters. If a new drawing cheated—if it relied on the viewer's memory instead of its own structure—it wouldn't survive the line. She could read her flag-'a' faster than a conventional one. She trusted the eye that moves across the word, not the eye that stops to inspect the shape.

  Some of her cousins thought she made fonts the way other people make jam. (Pause for laughter). They imagined her in an apron, stirring a pot of letters until thick. It wasn't jam. It was architecture. It was metal.

  And I know the press is waiting for a scandal, something sharp about the disagreement in this room. (Pause for laughter). But the disagreement isn't about whether the letter works. It works. We are arguing about whether permission was granted to change the shape.

  She granted herself that permission. Her first face, in the late seventies, had a ordinary double-story 'a'. She was proud of it. But she was prouder of the later one. She moved from drawing what an 'a' was supposed to be, to drawing what an 'a' needed to be to stand next to her 'n'.

  So, to the historians: Identity isn't just resemblance. It's compatibility.
  To the family: She didn't break the rules. She checked if the rules were holding up the weight.

  And to her granddaughter, who asked the question:

  You wanted to know if it is an 'a'. It is. But here is the thing you can keep. When you draw something, or write your name, or build something new, do not look at what came before. Look at what stands next to it. If your shape holds up next to your own work, if it fits the space you made for it, then it belongs.

  Keep the proof sheet. Look at the neighbors. If they hold hands, you're done.
