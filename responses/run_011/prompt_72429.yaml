  *   Nover, H., & Hájek, A. (2004). "Vexing Expectations." *Mind*. (The original Pasadena paper).
  *   Easwaran, K. (2008). "Strong and Weak Expectations." *Mind*. (The "Weak Expectation" solution that privileges natural order).
  *   Lauwers, L., & Vallentyne, P. (2016). "Decision Theory without Representation Theorems." (Discusses the domain restrictions).

  Good luck with the reading group. Dan's argument is a classic "philosophical grenade," but the pin is in step (9). Pull it.
