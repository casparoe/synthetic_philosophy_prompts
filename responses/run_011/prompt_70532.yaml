answer: |-
  ### 1. The Principle of Heritable Bottleneck Alignment

  Your verdicts are generated by a specific, albeit sometimes implicit, criterion regarding how reproductive variance is partitioned and transmitted. The principle that best reconstructs your intuition is the **Principle of Heritable Bottleneck Alignment**.

  A candidate level of organization $L$ counts as a genuine unit of selection if and only if three conditions are met:

  1.  **Variance:** There is variance in reproductive success among $L$-units.
  2.  **Heritability:** This variance is heritable; $L$-units produce $L$-units (not merely aggregates of parts).
  3.  **Transmission Bottleneck:** The reproduction of $L$ imposes a bottleneck on the lower-level constituents ($L-1$) such that the fitness of $L-1$ is statistically correlated with the fitness of $L$.

  **Corollary on Conflict:** If $L-1$ constituents can reproduce or transmit *independently* of the reproduction of $L$ (escaping the bottleneck), then $L-1$ becomes a unit of selection *in opposition* to $L$. In such cases, $L$ loses its status as a unified adapter, even if it persists as a vehicle.

  **Application to New Cases:**
  *   **Variance Partitioning:** You require that between-unit variance at level $L$ is not swamped by within-unit variance at level $L-1$, unless policing (Case 2) or bottlenecks (Case 6) suppress the within-unit variance.
  *   **Transmission:** You distinguish between *survival* of a group (Case 5) and *growth* of a group (Case 4). Only if the group's survival leads to the propagation of the group structure (seeding new patches) does it count as reproduction.
  *   **Correlation:** You accept higher-level units when constituent fates are yoked (Case 2, 6). You accept lower-level units when constituent fates decouple (Case 1, 4, 7).

  ### 2. Distinguishing the Pairs

  **The Tumor Cell Lineage (4) vs. The Phage-Resistant Bacterial Population (5)**
  You sense a structural similarity but reach different verdicts. The distinction lies in **Reproductive Propagation vs. Somatic Growth**.
  *   **Case 5 (Bacteria):** The patch is a unit because the phage exposure acts as a **group-level bottleneck**. Patches survive or die *as wholes*, and surviving patches seed new patches. The cells do not escape the fate of the patch; their transmission is bottlenecked through patch survival.
  *   **Case 4 (Tumor):** The cell lineage is a unit because it **escapes the organismal bottleneck**. Tumor cells proliferate and metastasize *within* the organism's lifespan, independent of the organism's reproduction. The organism does not reproduce *via* the tumor; the tumor reproduces *at the expense of* the organism.
  *   **Verdict:** In (5), the higher level reproduces through the lower. In (4), the lower level reproduces by bypassing the higher.

  **The Driving Haplotype (1) vs. The Suppressed Sex Chromosome (7)**
  This pair reveals a tension in your criteria regarding **Active Distortion vs. Passive Linkage**.
  *   **Case 1 (Drive):** The haplotype is a unit because it actively manipulates transmission (meiotic drive) to bias inheritance >50%. It creates variance in its own transmission independent of organismal fitness.
  *   **Case 7 (Sex Chromosome):** You call this a unit because it harbors sexually antagonistic alleles. However, you admit the population genetics are identical to a low-recombination region.
  *   **Distinction:** The driving haplotype *breaks* the transmission rules of the organism. The sex chromosome *follows* Mendelian transmission (mostly) but carries alleles with conflicting fitness effects.
  *   **Resolution:** Under the Bottleneck Alignment principle, the Driving Haplotype is a unit because it decouples its transmission from the organism's reproductive success. The Sex Chromosome is only a unit if it exhibits drive; if it merely carries linked alleles without distorting segregation, it is not a distinct unit from the rest of the genome, despite the fitness conflict.

  ### 3. Three New Cases and Predictions

  **Case A: Mitochondrial Heteroplasmy in a Germline Bottleneck**
  *   *Scenario:* A mammal carries a mix of wild-type and mutant mitochondria. During oogenesis, a severe bottleneck reduces mitochondrial number, randomly fixing one type in the offspring.
  *   *Principle Prediction:* The **Organism** is the unit. The bottleneck aligns mitochondrial fitness with organismal fitness by preventing within-organism selection of "selfish" mitochondria (mostly).
  *   *Expected Resistance:* You may be tempted to call the mitochondria separate units (like Case 6 symbionts). However, unlike the obligate symbiont, mitochondria lack independent transmission outside the host germline. Your intuition might resist subsuming them fully into the host.

  **Case B: Asexual Hydra with Somatic Mutation**
  *   *Scenario:* A hydra reproduces asexually by budding. A somatic mutation arises that increases cell division rate but reduces the bud's viability.
  *   *Principle Prediction:* The **Organism** remains the unit, but the mutation is a within-unit conflict. Because the organism reproduces via budding, the cell lineage is bottlenecked through the bud. If the bud fails, the cell lineage dies.
  *   *Expected Resistance:* You view tumors (Case 4) as cell-level units. Here, the "tumor" is heritable. You may resist calling the organism the unit because the conflict resembles the tumor case, missing that the *reproductive bottleneck* has shifted to include the cell lineage.

  **Case C: Dispersing Biofilm Fragments**
  *   *Scenario:* A biofilm (like Case 3) evolves a mechanism where clumps of cells detach together to colonize new surfaces, rather than single cells dispersing.
  *   *Principle Prediction:* The **Group** becomes a unit. The dispersal mechanism creates a group-level bottleneck, correlating the fates of cooperators and cheaters within the fragment.
  *   *Expected Resistance:* You called Case 3 "bookkeeping." You may resist granting unit status here despite the structural change, holding onto the intuition that bacteria are "individuals" and groups are "ephemeral."

  ### 4. The Verdict to Overturn: Case 7

  Any reasonably simple principle must overturn your verdict in **Case 7 (The Suppressed Sex Chromosome)**.

  **Argument:**
  You explicitly state that "nothing about its population-genetic treatment differs from an ordinary low-recombination region, where I would say no such thing." This is an admission that the *mechanism* is identical, yet the *ontological verdict* differs.
  *   **Why overturn this one?** Overturning Case 3 (Biofilm) would require you to accept group selection in weak structures, which contradicts your strong individualist intuition in that domain. Overturning Case 4 (Tumor) contradicts standard somatic evolution theory.
  *   **The Cost:** Overturning Case 7 requires only that you align your ontology with your own admission of genetic equivalence. Either the sex chromosome is a unit *and* so is any low-recombination region (inflating the number of units), or neither is a unit unless drive is present (deflating the number).
  *   **Recommendation:** Adopt the latter. A chromosome is not a unit of selection simply because recombination is suppressed or alleles are sexually antagonistic. It is a unit only if it possesses a mechanism (like drive) to bias its own transmission independent of the organism (as in Case 1). Without drive, it is merely a linked region of the genome, and calling it a "unit with interests" is metaphorical, not biological. This saves the consistency of your principle regarding transmission bottlenecks.

  ### 5. Recombination vs. Fitness Coincidence: The Diagnosis

  Your pattern of reactions is best read as tracking **Fitness Coincidence** for *higher-level* units (Colony, Symbiont, Patch) and **Independent Transmission** for *lower-level* units (Haplotype, Tumor, Chromosome).

  *   **Higher Levels:** You accept the Colony (2) and Symbiont (6) as units because the fitness of the parts is made to coincide with the whole (via policing or fusion).
  *   **Lower Levels:** You accept the Haplotype (1) and Tumor (4) as units because they achieve independent transmission, even though their fitness *opposes* the whole.

  **The Slide:**
  You are sliding between the **Unit of Replication** (defined by transmission independence) and the **Unit of Adaptation** (defined by fitness alignment).
  *   When looking at genes/cells, you use the Replicator view (if it copies itself independently, it's a unit).
  *   When looking at groups/organisms, you use the Adapter view (if they function together, they're a unit).

  **The Symptom:**
  **Case 7 is the symptom of the slide.**
  In Case 7, you try to apply the Replicator view (it's a distinct chromosome with "interests") to a case that lacks independent transmission mechanisms (no drive, just linkage). You feel it should be a unit because the fitness interests diverge (sexually antagonistic), mimicking the "conflict" of Case 1. But because the transmission is not independent (unlike Case 1), it fails the Replicator test. Because the fitness is not aligned (unlike Case 2), it fails the Adapter test.
  It falls in the gap between your two criteria. You call it a unit to capture the "conflict," but admit the genetics are standard. This verdict is the artifact of switching frameworks mid-analysis. To resolve the slide, you must choose: is a unit defined by its ability to transmit independently (Replicator), or by its contribution to a cohesive adaptive whole (Adapter)? Your other seven verdicts suggest you value **Transmission Independence** as the primary marker for *existence* of a unit, and **Fitness Coincidence** as the marker for *stability* of a higher-level unit. Case 7 violates the Transmission Independence requirement.
