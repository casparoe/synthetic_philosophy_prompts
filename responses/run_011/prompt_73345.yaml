  **1. The Strict Epictetan Line (Orthodox Dichotomy)**
  *   **Rule:** Only your own *prohairesis* (moral choice, assent, volition) is up to you. Everything else (body, reputation, outcomes, feelings) is not.
  *   **Verdicts:**
      *   *Saying the cruel thing:* **Yes** (Fits. Pure volition).
      *   *Being at bedside:* **Yes** (Fits. Pure action).
      *   *Flight/Promotion/Surgery/Students:* **No** (Fits. Externals).
      *   *First jolt of anger:* **No** (Fits. Pre-passion/physiology).
      *   *Knee/Party:* **FAIL.** Strict Stoicism classifies the body and sustained moods as "indifferents" (Not-up-to-you). By marking them **Partly**, she violates the strict dichotomy. She admits influence over the "indifferents."

  **2. The Aim-vs-Target Line (The Archer Analogy)**
  *   **Rule:** The *aim* (doing everything you can) is up to you. The *target* (the actual result) is not.
  *   **Verdicts:**
      *   *Promotion/Students:* **No** (Fits. These are targets).
      *   *Saying cruel thing/Bedside:* **Yes** (Fits. These are aims/actions).
      *   *Knee/Party:* **FAIL.** Under this rule, these should be **No**. You can train for the knee (aim), but the ligament snapping is the target. You can set conditions for the party (aim), but enjoyment is the target. Her **Partly** marks suggest she believes you have *some* ownership of the target, not just the aim.
      *   *User's Item:* If she used this rule, "Feeling like I did right" is a target (an emotional outcome). Mark would be **No**.

  **3. The Causal Chain Hybrid (Your Suspicion)**
  *   **Rule:** Look at the final link in the causal chain.
      *   If it ends in **Another Person's Volition** → **No**.
      *   If it ends in **Physics/Biology + Your Effort** → **Partly**.
      *   If it ends in **Your Volition Alone** → **Yes**.
