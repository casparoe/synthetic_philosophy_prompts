answer: |-
  **JOINT STATEMENT ON THE CALCULATION PROBLEM**
  **Signed:** *The Committee for Adversarial Collaboration on Economic Coordination*
  **Date:** *October 2023*

  **PREAMBLE**
  We, the undersigned representatives of the Austrian (Misesian) and Market Socialist (Langean) traditions, acknowledge that the Socialist Calculation Debate has suffered from definitional drift, historical conflation, and category errors. We agree that the debate is fundamentally about the coordination of dispersed knowledge and the incentives for discovery under different property regimes. This document isolates our agreements, specifies our remaining disagreements, and pre-registers empirical claims to settle them.

  **I. JOINT CLAIMS OF FACT AND THEORY**
  Both sides affirm the following propositions:

  1.  **The Walrasian Limit:** The Arrow-Debreu-McKenzie general equilibrium model demonstrates the *existence* of a set of prices that clears markets under strict assumptions (convexity, complete markets, perfect competition). It does not demonstrate the *attainability* of those prices via a specific dynamic process, nor does it model the discovery of new goods or technologies.
  2.  **Historical Distinction:** No historical command economy (USSR, Eastern Bloc) implemented the Lange-Lerner model of trial-and-error parametric pricing. They utilized material balance planning (quantity targets). Therefore, the failure of the USSR is not a direct falsification of the Lange model, though it may be evidence against the political feasibility of such a model.
  3.  **Information and Incentives:** Prices serve two distinct functions: (a) conveying information about relative scarcity and (b) providing incentives to act on that information. A mechanism that achieves (a) but fails (b) will result in resource misallocation.
  4.  **Tacit Knowledge:** A significant portion of economically relevant knowledge (technological know-how, local conditions, consumer preference nuances) is tacit, context-specific, and not articulable in statistical aggregates.
  5.  **The Boundary Problem:** All economic systems involve a mix of hierarchical planning (within firms or bureaus) and market exchange (between firms). The debate concerns the optimal boundary and the mechanism for setting the boundary, not the total elimination of one or the other.

  **II. TAXONOMY OF THE DISAGREEMENT**
  We accept the Seismologist's Taxonomy of Inverse Problems to locate our specific divergences. We acknowledge that much past confusion arose from arguing past one another across these categories.

  *   **Claim (a) Identifiability:** The data (preferences, technological possibilities) do not exist in gathered-up form; they are generated by the process of exchange itself.
  *   **Claim (b) Latency:** The data exist but cannot be collected and processed on a timescale relevant to economic action; the system changes faster than the solver runs.
  *   **Claim (c) Convergence:** The problem is well-posed *[Correction: We note that standard GE theory does not guarantee uniqueness or stability without further restrictions, so "well-posed" is a strong assumption]* and data are accessible, but the adjustment algorithm fails to settle.

  **Our Positions:**
  *   **The Misesian Position:** We primarily assert **(a)**. Without private property in the means of production, there is no exchange, and without exchange, there are no prices. The "data" required for calculation are not merely hidden; they are *created* by the bidding process for assets. We acknowledge that Langeans often argue against (b), but we contend that if (a) holds, (b) and (c) are moot.
  *   **The Langean Position:** We primarily assert **(c)** is solvable and **(b)** is manageable via modern computation. We treat preferences and production functions as discoverable through surplus/shortage signals (tâtonnement). We concede that if (a) is true in the strong Misesian sense (that knowledge is *only* created via asset exchange), our model fails.
  *   **Admissions of Borrowing:**
      *   *Langeans admit:* We have historically relied on the Misesian/Hayekian critique of **(b)** to motivate the use of faster computational algorithms, implicitly accepting that latency is a threat.
      *   *Misesians admit:* We have historically relied on the Walrasian critique of **(c)** (instability of equilibrium) to argue against planning, implicitly granting that if data *were* available, the math might work.

  **III. RESIDUAL DISAGREEMENTS**
  We disagree on the following, phrased to ensure fidelity to each view:

  1.  **The Nature of the Price:**
      *   *Misesian:* A price is necessarily a historical record of a completed exchange of property titles. A "parametric price" set by a board is an accounting ratio, not a price, because it lacks the risk-bearing component of ownership.
      *   *Langean:* A price is a marginal rate of substitution. If a planning board adjusts a number until quantity supplied equals quantity demanded, it functions identically to a market price regardless of legal title.
  2.  **The Entrepreneurial Function:**
      *   *Misesian:* The entrepreneur is a residual claimant who profits from *disequilibrium*. This function cannot be simulated by a salaried manager following a rule (e.g., "minimize average cost").
      *   *Langean:* The entrepreneurial function can be decomposed into routine management (allocating existing resources) and innovation (R&D). The former is solvable via optimization; the latter can be incentivized via prize systems or competitive bidding for investment funds.
  3.  **Political Constraint:**
      *   *Misesian:* A planning board cannot credibly commit to closing loss-making enterprises (the Soft Budget Constraint) because employment and output are political goods.
      *   *Langean:* This is a political failure, not an economic impossibility. A constitutional separation of the Planning Board from political interference could harden budget constraints.

  **IV. CRUXES AND PRE-REGISTRATIONS**
  We identify four empirical or theoretical tests. We state our predictions in advance.

  **1. The Kantorovich Test (Shadow Prices)**
  *Context:* In 1939, Kantorovich derived dual multipliers (shadow prices) for a plywood trust using linear programming, internal to the Soviet system.
  *   *Misesian Prediction:* These multipliers guided operational efficiency (cutting patterns) but failed to guide *investment* or *innovation* because they lacked external reference. They were local optima disconnected from consumer time-preference.
  *   *Langean Prediction:* These multipliers prove that rational allocation is possible without asset markets. With sufficient computational power, shadow prices can be generalized to the whole economy.
  *   *Adjudication:* If shadow prices in a closed system successfully direct long-term capital investment without reference to world markets, the Langean wins. If they only optimize short-run throughput, the Misesian wins.

  **2. The Free-Rider Test (World Market)**
  *Context:* A single socialist economy embedded in a capitalist world can import prices.
  *   *Misesian Prediction:* A small socialist state can function by free-riding on capitalist price discovery. A large, closed socialist economy (or a global one) will fail because the reference prices disappear.
  *   *Langean Prediction:* Even a large economy can generate sufficient internal price signals via consumer goods markets and labor markets to coordinate production, provided capital allocation is simulated correctly.
  *   *Adjudication:* If a large, relatively closed socialist economy achieves sustained innovation and efficiency comparable to market peers, the Langean wins. If it stagnates specifically in capital-intensive sectors, the Misesian wins.

  **3. The Kornai Test (Soft Budgets)**
  *Context:* János Kornai's observation that socialist firms are bailed out rather than allowed to fail.
  *   *Agreement:* Both sides agree that if losses are socialized, trial-and-error pricing breaks down (moral hazard).
  *   *Misesian Prediction:* Soft budgets are *endemic* to socialism because the state cannot credibly threaten its own agents with bankruptcy without causing political collapse.
  *   *Langean Prediction:* Soft budgets are a *contingent* policy choice. Mechanisms (e.g., independent bankruptcy courts, hard currency constraints) can harden budgets under social ownership.
  *   *Adjudication:* Historical analysis of whether any socialist regime successfully allowed major state enterprises to go bankrupt without political intervention.

  **4. The Firm Boundary Test (Internal Allocation)**
  *Context:* Large modern firms (e.g., Walmart, Amazon) allocate vast resources internally via algorithms and quantity targets, not internal prices.
  *   *Misesian Prediction:* These firms scale only because their boundaries are disciplined by external market prices and the threat of takeover. Internal planning works only on the margin of a market economy.
  *   *Langean Prediction:* The success of internal firm planning proves that non-price coordination scales. The whole economy can be viewed as a single firm.
  *   *Adjudication:* If a firm grows to dominate an economy and replaces external market transactions with internal transfers entirely, does its efficiency rise or fall? (Note: We acknowledge this is counterfactual, but we look to the history of conglomerates).

  **V. VERBAL VS. SUBSTANTIVE**
  Finally, we address the nature of the dispute.

  **1. Verbal Disputes:**
  *   **Definition of "Market":** If "market" requires private property in capital, then "Market Socialism" is an oxymoron. If "market" requires only exchange and price signals, it is not. We agree this is semantic. We will henceforth distinguish **Property Markets** (assets) from **Flow Markets** (goods/services).
  *   **Definition of "Socialism":** Disagreements often vanish when distinguishing **State Statism** (bureaucratic command) from **Social Ownership** (co-ops, public dividends). The Misesian critique applies strongly to the former, less clearly to the latter.

  **2. Substantive Disputes:**
  *   **The Generation of Knowledge:** This is the core irreducible conflict. The Misesian claims knowledge of *future* value is created by the act of betting assets. The Langean claims knowledge of *current* scarcity is revealed by surplus/shortage.
  *   **Survival:** Once vocabulary is pinned down, the substantive claim remains: **Can a system without residual claimants on capital assets discover and correct errors in long-term investment as effectively as a system with them?**

  **CONCLUSION**
  We agree that the 20th century did not settle this debate because the test cases were contaminated by totalitarianism, war, and isolation. The question remains open: Is the price system a computational tool that can be replicated, or is it an epistemic institution that emerges only from specific property relations? We submit the pre-registrations above as the path to an answer.

  ***

  **Technical Note to the Author:**
  You asked for corrections on your framing.
  1.  **On (c) "Well-Posed":** In mathematics, a problem is well-posed if a solution exists, is unique, and depends continuously on the data. In economics, general equilibrium is *not* generally unique (multiple equilibria can exist) and stability is not guaranteed. I adjusted the text in Section II to reflect that the Langean *assumes* well-posedness, but it is not a mathematical given.
  2.  **On Kantorovich:** You asked if dual multipliers refute Mises. Mathematically, they are prices. Economically, Mises argues they are *shadow* prices without *scarcity* significance regarding capital allocation. I distinguished this in the Cruxes section (Operational vs. Investment).
  3.  **On Inverse Problems:** Your analogy is apt. The Misesian argument is essentially that the "forward problem" (preferences $\to$ prices) doesn't exist because preferences aren't fixed vectors until the "experiment" (exchange) is run. This makes the "inverse problem" (prices $\to$ allocation) impossible to formulate. I incorporated this into the Identifiability section.
