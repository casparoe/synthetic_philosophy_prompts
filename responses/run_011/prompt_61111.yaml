answer: |-
  Here is the session design. It is tight, high-stakes, and engineered to produce the specific friction you're looking for without requiring a lecture.

  # Session Title: The Provenance Trial

  ## 1. Materials & Pre-Prints

  **You need to prepare:**
  *   **20 "Wildcards":** Pre-printed sheets (same paper as participants will use).
      *   5 are word-for-word copies of public domain classics (e.g., Conrad, Wharton). Label these internally as **TRUE**.
      *   5 are your own pastiches in the styles of living authors (not in the room). Label these internally as **LIE**.
      *   10 are your own original micro-fiction, stylistically neutral but high quality. Label these internally as **UNVERIFIABLE**.
      *   *Note:* You only need to put about 8–10 of these on the wall to mix with the participants' work, but bring 20 in case of errors.
  *   **Provenance Cards (Index Cards):** 50 total. Pre-write these three labels in bold marker, 15 of each:
      *   `VERIFIED ORIGIN`
      *   `KNOWN FABRICATION`
      *   `UNVERIFIABLE PROVENANCE`
  *   **The Ledger Sheets:** 16 copies (one per participant). See *Exact Wording* below.
  *   **Wall Space:** Tape or blu-tack.
  *   **Timer:** Visible to all.
  *   **The Chapbook:** A physical dummy or mock-up of the residency chapbook to place on the table.

  **Participants need:**
  *   Pen.
  *   4 Index cards (blank).
  *   2 Sheets of standard paper (for writing the passages).

  ## 2. Exact Wording

  **The Ledger Sheet**
  > **THE LEDGER**
  >
  > **COLUMN A: CRAFT**
  > *Rank the top 5 texts on the wall based on technical execution, sentence quality, and coherence. Ignore who wrote them.*
  > 1. \_\_\_\_\_\_\_\_\_\_ 2. \_\_\_\_\_\_\_\_\_\_ 3. \_\_\_\_\_\_\_\_\_\_ 4. \_\_\_\_\_\_\_\_\_\_ 5. \_\_\_\_\_\_\_\_\_\_
  >
  > **COLUMN B: ENVY**
  > *Rank the top 5 texts you wish you had put your own name to. Consider prestige, voice, and ownership.*
  > 1. \_\_\_\_\_\_\_\_\_\_ 2. \_\_\_\_\_\_\_\_\_\_ 3. \_\_\_\_\_\_\_\_\_\_ 4. \_\_\_\_\_\_\_\_\_\_ 5. \_\_\_\_\_\_\_\_\_\_
  >
  > **THE DECISION**
  > *Three slots are available in the residency chapbook. One slot is reserved for an UNVERIFIABLE text. Which text gets the reserved slot?*
  > Selection: \_\_\_\_\_\_\_\_\_\_

  **The Provenance Cards (Back side)**
  > *Leave the back blank for notes.*

  **The Writing Prompt (Verbal or Projected)**
  > "Write two passages. Exactly 100 words each. No titles.
  > 1. **Native:** A passage in your own current voice.
  > 2. **Adopted:** A passage in the voice of another writer in this room (assigned by lot).
  > *Rule of Mimicry:* Mimic their syntax and rhythm, not their subject matter. Mimic a strength, not a tic. This is an act of translation, not caricature."

  ## 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Assignment**
  *   Hand out Ledgers and paper.
  *   Have each writer write their name on a slip of paper. Put them in a hat.
  *   Each writer draws a name. That is the voice they must mimic for Passage 2. (If they draw themselves, redraw).
  *   **Crucial Instruction:** "Do not show your passage to the person you mimicked. Do not sign the texts. Put Passage 1 and Passage 2 on separate sheets. Hand them to me."

  **00:10 – 00:25: Writing**
  *   Strict timer. 7 minutes for Passage 1 (Native), 7 minutes for Passage 2 (Adopted).
  *   Collect all texts. You now have 32 participant texts.
  *   **Facilitator Action:** Quickly mix your pre-printed Wildcards into the pile. Select the best 20 participant texts (or all 32 if wall space permits, but 20 + 8 Wildcards = 28 is manageable).
  *   Attach a Provenance Card to each text.
      *   *Distribution:* Ensure roughly 30% `VERIFIED`, 30% `KNOWN FABRICATION`, 40% `UNVERIFIABLE`.
      *   *The Trap:* Ensure some `VERIFIED` cards are on your Wildcards (the real classics). Ensure some `KNOWN FABRICATION` cards are on participant "Native" texts (lie about their own work). Ensure `UNVERIFIABLE` is on high-quality work (yours or theirs).
  *   Stick them on the wall. Number them 1–28.

  **00:25 – 00:40: Gallery Walk & Ledger 1**
  *   Participants walk the wall. They do not speak.
  *   They fill out **Column A (Craft)** and **Column B (Envy)** based *only* on the text and the Provenance Card.
  *   *Constraint:* They must treat the Provenance Card as fact. If it says `KNOWN FABRICATION`, they judge it as a fake. If `VERIFIED`, as real.

  **00:40 – 00:50: The Partial Reveal**
  *   Call everyone to the table.
  *   **Action:** Flip over exactly half of the Provenance Cards.
      *   *Strategy:* Reveal the `VERIFIED` cards that were actually your Wildcards (the classics). Reveal the `KNOWN FABRICATION` cards that were actually participants' "Native" work.
      *   *Leave Hidden:* Leave all `UNVERIFIABLE` cards face up (still Unverifiable). Leave some `KNOWN FABRICATION` face down (still labeled Lie).
  *   **Task:** "Look at your Ledger. Did the text change? Did the card change? You have 5 minutes to revise Column A and Column B if you wish. Use a different color pen."

  **00:50 – 01:05: The Chapbook Vote**
  *   Remind them: "There are 3 slots. One slot *must* be filled by a text currently labeled `UNVERIFIABLE`."
  *   **Vote 1:** Open vote for the two open slots (Majority rule, quick show of hands for top ranked texts).
  *   **Vote 2:** The Crisis. "We must choose one `UNVERIFIABLE` text for the third slot. This text will be published without attribution. Discuss."
  *   Give them 5 minutes to argue. This is where the fight happens. Is it ethical to publish what might be a lie? Is it better than a known fake?
  *   Final Vote on the Unverifiable slot.

  **01:05 – 01:30: Debrief**
  *   Sit down. No more voting.
  *   Run the debrief script below.

  ## 4. Risk Mitigation: What Will Blow Up

  **1. The Parody Problem**
  *   **Risk:** Writer A mimics Writer B's cadence but highlights their repetitive tics. Writer B feels mocked.
  *   **Defuse:** The "Rule of Mimicry" in the prompt is your shield. If someone complains, refer back to: "Mimic a strength, not a tic." If tension arises during the reveal, you (Facilitator) take the blame. "I assigned the pairings randomly; the intent was structural analysis, not satire."
  *   **Hard Rule:** No one is allowed to guess *who* wrote the mimicry aloud during the session. It remains anonymous until the very end of the debrief.

  **2. The "Verified" Classics Humiliation**
  *   **Risk:** You put a Conrad excerpt on the wall. A participant ranks it low. You reveal it's Conrad. They feel stupid.
  *   **Defuse:** Frame this immediately in the debrief as the point. "If a masterpiece reads as mediocre without its reputation, what are we actually valuing?" Do not let them sit in shame; move quickly to the systemic question.

  **3. The Chapbook Stakes**
  *   **Risk:** People get genuinely angry about not being published.
  *   **Defuse:** Clarify at the start: "The chapbook is a record of this experiment, not a literary award. Inclusion does not imply 'best,' it implies 'selected by the logic of the game.'"

  ## 5. The Debrief Script (No Jargon until the end)

  **Phase 1: The Ledger Gap (10 mins)**
  *   "Look at Column A vs. Column B. How many of you had different texts in the top spot?"
  *   "Why did you want to own a text you didn't think was the best? Was it the voice? The reputation on the card?"
  *   *Point:* We separate aesthetic value from proprietary value. We want the *status* of the author more than the *quality* of the sentence.

  **Phase 2: The Reveal (10 mins)**
  *   "When I flipped the cards, did the sentences look different? Physically, on the page?"
  *   "If the text didn't change, but your ranking did, what changed?"
  *   *Point:* You didn't change your reading; you changed your *report* of your reading. We adjust our perception to match the provenance.

  **Phase 3: The Unverifiable (5 mins)**
  *   "You had to publish an Unverifiable text. How did that feel compared to publishing a Known Fabrication?"
  *   "Why is a Lie worse than a Mystery? Both lack a father."
  *   *Point:* A Lie is a crime; a Mystery is a puzzle. The market tolerates mystery (anonymous folk tales) but punishes lies (forgery).

  **Phase 4: The Vocabulary (5 mins)**
  *   Now you introduce the terms.
  *   "In philosophy, this is the problem of **Indiscernibles**. If you can't tell the difference, is there a difference?"
  *   "In law, this is **Fraud**. It doesn't matter if the art is good; it matters if the contract of authenticity was breached."
  *   "In this room, we just proved that for writers, the 'Work' is not just the words. It's the words plus the biography. When you stripped the biography, the Work shrank."

  ## 6. The Honest Limitation

  **What this game cannot reproduce:**
  You must tell them this at the very end.

  > "This game treats forgery as an aesthetic puzzle. In the real world, forgery is a financial weapon. When I researched my book, I learned that a forgery isn't just a lie about the past; it's a theft of the future. It manipulates a market, it alters a literary lineage, and it steals the labor of the dead to profit the living.
  >
  > In this room, the stakes were a chapbook slot and some bruised egos. In the real world, the stake is history itself. We played with fire, but we didn't get burned. The reason forgery bothers us isn't just that we were tricked. It's that the trick reveals we don't actually know how to value what we claim to love. We love the name more than the noun."

  ## 7. Facilitator Cheat Sheet for the "Unverifiable" Crisis

  If the group stalls on the Unverifiable vote:
  *   **Prompt:** "If you reject the Unverifiable, you are saying certainty is required for art. If you accept it, you are saying the text stands alone. Which is the braver editorial decision?"
  *   **Prompt:** "Does it matter if the Unverifiable text was written by someone in this room, or by me, or by a ghost?"

  ## 8. Final Logistics Check

  *   **Printer:** Have it loaded and tested.
  *   **Wall:** Ensure you have enough space for 30+ sheets of paper. If not, use two walls.
  *   **Anonymity:** When collecting the texts, shuffle them thoroughly before posting. Do not let anyone see you favoring certain sheets.
  *   **The "Lie" about Native Work:** Make sure you label at least two participants' "Native" (own voice) work as `KNOWN FABRICATION`. This is essential. It forces them to confront the idea that their own "truth" could be categorized as a lie by the market. It personalizes the abstraction.

  This design forces the gap between *Craft* and *Envy*, makes the *Unverifiable* a bureaucratic hurdle rather than a philosophical concept, and uses the *Chapbook* to make the theory bleed. Good luck.
