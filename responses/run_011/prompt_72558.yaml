prompt: |-
  Been reading the old value-theory stuff on the rationalist blogs for like fifteen years now — wireheading, experience machines, fun theory, all of it — and lately I've been poking at the actual philosophy of pleasure, specifically the heterogeneity problem for hedonism. Which is: hedonism about well-being says pleasure is the only thing that's good for you in itself, but pleasures seem to have nothing much in common. The pleasure of a hot bath after being cold, the pleasure of finally getting a proof to go through, of sex, of a good meal, of a joke landing, of being praised, of relief — these feel nothing alike. Sidgwick-type hedonists insist there's still one thing there, a common pleasant feel that makes them all pleasures and all good, and that the differences are differences in what carries it. Mill's higher/lower pleasures business looks like an admission that quality is doing extra non-hedonic work. Then there's the family-resemblance camp, which basically says pleasure is a grab bag and the theory is picking out a disjunction, which is why it feels unfalsifiable. And then the attitudinal move (Feldman and people after him) which relocates pleasure from a sensation to a pro-attitude toward a state of affairs — arguably a rescue, arguably changing the subject.

  Now here's what I want. I work on reward models for a living, so my native vocabulary is: scalar reward signals, a reward head trained on top of a high-dimensional learned representation, preference labels, reward shaping, reward hacking, the fact that in practice "reward" is just whatever the policy is optimized against and nobody claims it's a natural kind. Translate the whole heterogeneity debate into that vocabulary as faithfully as you can. My hunch — treat it as a hunch and attack it if it's wrong — is that the debate is secretly about whether reward is a scalar or a vector, that "hedonic tone" is playing the role of the scalar readout head, and that the heterogeneity objection is just the observation that the representation underneath is enormously high-dimensional and non-uniform. If that's right, does the objection collapse, or does it show the readout head is doing no real work and the hedonist is worshipping a bookkeeping device?

  Then the part I actually care about: the residue report. Which claims translate cleanly, which only survive if you fudge something, and which have no expression at all in my vocabulary. Specifically — is there any counterpart in RL talk to "good for the subject", given that reward isn't for anybody, it's just the objective? Is there anything corresponding to the felt character, or do I silently substitute "whatever shapes the policy"? And what about the neuro distinction between wanting and liking, which cuts the other way from my scalar story — where does that land in the translation, and does it help the hedonist or hurt them? Finish by telling me whether the stuff that doesn't survive is a limitation of my framework (missing something real) or evidence that hedonism was less clear than it sounded. Don't soften it to be diplomatic.
reasoning: |-
