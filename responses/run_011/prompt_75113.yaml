answer: |-
  The town of Saltwick clings to the southern lip of Morven Island like a barnacle to a hull. It is a place of grey stone and greyer water, where the wind smells of salt and diesel, and where the harbour mouth is split by a jagged finger of rock known as the Needle. This rock creates two passages: the Eastern Channel, deep and swift, and the Western Channel, shallower but wider.

  For as long as anyone in Saltwick can remember, the rule has been absolute. Outbound vessels take the East. Inbound vessels take the West.

  It is a rule spoken of with the weight of law. Every winter, at the Guild Dinner, the oldest skipper stands to toast the Founders of 1842. They tell the story of the Great Harbour Vote, where the Guild Masters, dressed in frock coats and gold braid, debated the channels for three days before casting a formal ballot to assign the East to outgoing traffic. The details shift slightly year to year—sometimes the vote was unanimous, sometimes it was narrow; sometimes the Chairman was a man named Sterling, sometimes Sterling's brother—but the core remains. The rule exists because it was chosen.

  There are other regularities in Saltwick, of course. Take Old Man Hemlock, for instance. Before he unties any mooring line, Hemlock checks his barometer. He has done this for fifty years. Every skipper in town knows Hemlock checks the glass. But Hemlock does not check because the others do. If every other boat on Morven decided to ignore the pressure drops, Hemlock would still check. He does it because he prefers dry boots to wet ones. His reason is independent of the fleet. The channel rule is different. No skipper takes the East because they love the East. They take the East because they expect everyone else to take the West. If the fleet suddenly decided to swap, the skipper would swap too. Their reason is woven into the expectations of others.

  The truth of the channel rule, however, was uncovered last autumn by a visiting clerk named Mr. Gedge. Gedge had been sent by the Regional Maritime Authority to codify local bylaws for a new digital registry. He sat in the damp archive room beneath the Guildhall, sifting through boxes of rotting ledgers. He was looking for the minutes of the 1842 Vote.

  He did not find them. Instead, he found the logbook of the harbour pilot from November 1842. There was no vote. There was no meeting. There was only a record of a gale so severe it had blinded the harbour mouth for three days. On the fourth day, the fog lifted slightly. A coal brig, the *Mary Anne*, needed to get out. The Western Channel was choked with debris washed down from the hills. The Captain of the *Mary Anne*, a pragmatic man named Halloway, saw the Eastern Channel was clear. He took it.

  The next boat coming in saw the *Mary Anne* leaving via the East. To avoid a head-on collision in the narrow throat of the harbour, the incoming boat took the West. The third boat saw the second. The fourth saw the third. Within a week, the pattern was set. Within a generation, it was history. Within two generations, it was a mythologised vote.

  Gedge wrote this up in a report for the Harbourmaster, Mr. Brine. Brine read it, grunted, and filed it away. He knew the origin didn't matter. The rule worked. The channels kept the traffic flowing. It did not matter that the West could have been for outgoing and the East for incoming; the arbitrariness of the choice was irrelevant now. What mattered was that everyone knew that everyone knew which side was which.

  Then came the dredging scheme.

  The Western Channel had silted up badly. To bring in the dredging barge, the Western passage had to be closed for four days. Furthermore, once the work was done, the currents would have shifted the sandbars such that the East would be safer for incoming heavy loads, and the West for outgoing lighters. The authority mandated a permanent swap. East for In, West for Out.

  Harbourmaster Brine was a practical man. He typed a notice on bright yellow paper. *NOTICE TO ALL MARINERS. EFFECTIVE MONDAY 0800 HOURS. CHANNELS SWAPPED. EAST INBOUND. WEST OUTBOUND.* He pinned it to the board in the harbourmaster's office, where every skipper signed the logbook upon return.

  On Monday morning, the sun rose over a calm sea. Elias Thorne, captain of the lobster boat *Puffin*, arrived at the harbour early. Thorne was a conscientious man. He had seen the notice. He intended to follow it. He wanted to go out to check his pots, which meant he needed to leave via the Western Channel.

  He started his engine and steered toward the West.

  The harbour was quiet. Thorne looked around. He saw the *Sarah Jane* approaching from the sea. According to the new rule, the *Sarah Jane* should be coming in via the East. But the *Sarah Jane* was turning toward the Western Channel. The skipper of the *Sarah Jane*, seeing Thorne heading West for an exit, assumed Thorne knew something he didn't, or perhaps assumed Thorne was ignoring the notice. Panic flickered. The *Sarah Jane* throttled back.

  Thorne stopped too. They sat there, engines idling, fifty yards from the channel mouth. Thorne waved. The other skipper waved back, confused.

  Thorne was not angry. Nobody shouted at him. There was no moral outrage. He had not broken a moral law like stealing or lying. He had simply failed to coordinate. His reason for taking the West was conditional: he would take the West *if* the incoming boats took the East. Since the incoming boats were hesitating, Thorne's reason for taking the West evaporated. He was now just a boat in the way. If he pushed on, he risked a collision not because it was forbidden, but because the other boat wasn't expecting him there.

  He turned around and went home. The dredging barge arrived that afternoon and had to wait an hour because the channel was blocked by indecision.

  The problem was not that the skippers didn't know the rule. Thorne knew. The skipper of the *Sarah Jane* knew. But Thorne didn't know that the *Sarah Jane* knew that Thorne knew. Seeing a notice on a board is a private act. You see it alone. You don't know who else has walked into the office that morning. You don't know if the others trust the notice. You don't know if they think you trust it. The chain of expectation was broken.

  Harbourmaster Brine watched the deadlock from his window. He understood that a piece of paper was not enough to shift a convention. A convention is a equilibrium of expectations. To move the whole town from one equilibrium (East Out) to another (East In), you need a signal that resets the expectations simultaneously. You need something that makes the new rule common knowledge.

  On Tuesday morning, Brine climbed the harbour tower. He installed a powerful green lamp in the window overlooking the Needle. He arranged for the town crier to walk the quays at dawn, ringing a bell and shouting, "Green light means Swap! Green light means Swap!"

  At 0800 hours, Brine switched on the green lamp. It was visible from every mooring, every boat, and every house on the waterfront.

  Thorne came down to the *Puffin* again. He saw the green light. He looked around. He saw the *Sarah Jane* starting its engine. The skipper of the *Sarah Jane* saw the light too. Crucially, Thorne could see that the *Sarah Jane* could see the light. And he could see that the *Sarah Jane* knew that he could see it. The light was public. It created a shared focal point.

  Thorne steered for the West. The *Sarah Jane* steered for the East. They passed each other at the Needle, close enough to shake hands, engines humming smoothly. The traffic flowed. The convention had shifted.

  By Wednesday, the green light was no longer needed. The regularity had hardened. Now, everyone conforms to the new rule. Everyone expects everyone else to conform. Everyone's reason for conforming is conditional on that expectation. And everyone knows there was an alternative—the old rule—that would have worked just as well, had only everyone agreed to it.

  Yet, if you go to the Guild Dinner this winter, the oldest skipper will still stand to toast the Founders of 1842. They will still speak of the Great Harbour Vote. Mr. Gedge's report sits in a drawer in the Harbourmaster's office, unread by the fleet. The myth persists because the myth supports the stability. It gives the rule a weight it doesn't strictly need, but certainly doesn't hurt. The skippers prefer to believe the rule was chosen by wise men in frock coats rather than born from a foggy accident and a bit of luck. It makes the order feel intentional, even though the order is merely a shared solution to a coordination problem.

  There is a lingering question, however, one that keeps Mr. Gedge awake at night. He watches the green light blinking in the tower. It worked because everyone agreed that Green meant Swap. But how did they agree on that? There was no prior convention for what the green light meant. Brine simply declared it.

  Imagine, Gedge thinks, the very first convention Saltwick ever had. Before the channels, before the lights, before the Guild. How did the very first group of people agree on anything without a signal to tell them what the signal meant? To establish the first convention, you need a way to coordinate. But to coordinate, you usually need a convention.

  He watches the *Puffin* heading out through the West channel. Thorne is confident. He knows where he is going because he knows where everyone else is going. But if you strip away the history, the light, the notice, and the myth, you are left with a precarious thing. A line of boats moving in opposite directions, balanced on a mutual expectation that could tip either way.

  Gedge closes his ledger. The harbour is quiet. The green light turns off at dawn, no longer needed. The rule holds. But as he walks home, he wonders what would happen if the power failed tonight. Would the boats remember the light? Or would they remember the vote? Or would they simply wait for someone else to move first, frozen in the dark, waiting for a convention to begin again.
