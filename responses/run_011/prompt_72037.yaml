      *   *Requirement 4: Multiple Realizability.* (Motivation: Two routes to one function). The model might solve a task differently in deployment than in training. If the function is benign, does it matter if the mechanism changed? MAD wants to catch *bad* mechanisms. So we need to distinguish *Good Mechanism A* vs *Good Mechanism B* vs *Bad Mechanism C*. *Implementation Agnosticism (within class)*.
      *   *Requirement 5: Sensitivity to Latent Intent.* (Motivation: Scheming/Suppressed Refusal). The mechanism might look benign on standard inputs but activate on trigger inputs. The relation must capture the *conditional logic*, not just average behavior. *Contextual Fidelity*.

  4.  **Classifying Requirements:**

      *   *Non-Negotiable:* Causal Specificity (otherwise it's just feature matching), Contextual Fidelity (otherwise it misses scheming).
