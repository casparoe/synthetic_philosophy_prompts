answer: |-
  ## Part 1 — The Logical Space

  Before constructing the instrument, we must map the terrain. The debate over authorial intention is not a single line between "yes" and "no." It is a multi-dimensional space where positions diverge on metaphysical, epistemological, and normative grounds. I have identified four independent axes.

  **Axis 1: Constitution (What *makes* the meaning?)**
  *   **Range:**
      *   *Mentalist:* Meaning is constituted by a mental act (willing, intending).
      *   *Conventionalist:* Meaning is constituted by public linguistic rules and textual structures.
      *   *Identity:* Meaning *is* the mental act; there is no gap between the two to bridge.
  *   **Combinations:**
      *   *Occupied:* Mentalist (Hirsch), Conventionalist (Beardsley), Identity (Knapp/Michaels).
      *   *Incoherent:* Claiming meaning is constituted by mental acts but that those acts are irrelevant to interpretation.
      *   *Unexplored:* A view where meaning is constituted by the *reader's* mental act alone, without reference to text or author (solipsistic reception).

  **Axis 2: Access (Which mental state counts?)**
  *   **Range:**
      *   *Actual:* The historical, psychological state of the biographical person.
      *   *Hypothetical:* The state an idealized audience would attribute to an author based on public evidence.
      *   *Postulated:* A theoretical construct generated by the interpretation itself, not necessarily tied to a historical person.
      *   *None:* No mental state is relevant.
  *   **Combinations:**
      *   *Occupied:* Actual (Hirsch/Davies), Hypothetical (Levinson), Postulated (Nehamas), None (Beardsley/Barthes).
      *   *Incoherent:* Claiming the *Actual* state counts but is inaccessible even in principle (makes meaning unknowable by definition).
      *   *Unexplored:* A view where the *Translator's* intention overrides the *Original Author's* intention in a lost-original scenario.

  **Axis 3: Multiplicity (How many meanings can exist?)**
  *   **Range:**
      *   *Singular:* There is one correct meaning; incompatible interpretations cannot both be true.
      *   *Plural:* Incompatible interpretations can be simultaneously valid (relative to frameworks, times, or communities).
  *   **Combinations:**
      *   *Occupied:* Singular (Most intentionalists and formalists), Plural (Margolis, Post-structuralists).
      *   *Incoherent:* Actual Intentionalism + Pluralism (unless the author intended ambiguity, but even then, the *meaning* is "ambiguity," which is singular).
      *   *Unexplored:* A view where multiplicity is allowed only for texts older than a certain age.

  **Axis 4: Normativity (Is meaning distinct from value?)**
  *   **Range:**
      *   *Distinct:* What a text means is separate from how good it is or how we should use it now.
      *   *Unified:* Interpreting a text is inseparable from evaluating it or making it live for us now.
  *   **Combinations:**
      *   *Occupied:* Distinct (Hirsch, Beardsley), Unified (Rorty, some Pragmatists).
      *   *Incoherent:* Claiming meaning is distinct from value but that we should only interpret valuable texts.
      *   *Unexplored:* A view where meaning is fixed historically but value is the only thing we can talk about.

  ***

  ## Part 2 — The Instrument

  **Instructions:** Read each node carefully. Select the option that best matches your intuition about the case. Follow the branching instructions to the next node. If no option fits, select "None of these."

  **Node 1: The Private Letter**
  An author writes a novel. In a private letter to a friend, she writes: "In Chapter 3, the pronoun 'he' refers to the villain, not the hero, though I hid it well." The public text offers strong evidence for both, but slightly favors the hero. The letter is discovered after her death.
  *   **A.** The letter settles the meaning. The text means what she meant, even if she hid it. (Go to Node 2)
  *   **B.** The letter is irrelevant. The text means what the public language allows, regardless of her secret. (Go to Node 3)
  *   **C.** The letter is evidence, but not a verdict. We weigh it against the public text. (Go to Node 2)

  **Node 2: The Disavowal**
  An author publishes a serious poem. Thirty years later, suffering from no cognitive decline, she says: "I was joking. It was satire. Everyone read it wrong."
  *   **A.** She is wrong. The work means what it meant when published. Her later mind doesn't change the past object. (Go to Node 6)
  *   **B.** She is right. Her intention governs, even retrospectively. (Go to Node 7)
  *   **C.** It doesn't matter. The reading public has made the poem what it is now. (Go to Node 8)

  **Node 3: The Misprint**
  A poet writes a line. A typesetter makes an error. For 200 years, readers analyze the "error" as a profound metaphor. Scholars prove it was a mistake.
  *   **A.** It remains a mistake. The meaning is what the author successfully realized. (Go to Node 6)
  *   **B.** It is now part of the work. Usage has absorbed the accident into the meaning. (Go to Node 9)
  *   **C.** The distinction between mistake and meaning is false. If it works, it was meant. (Go to Node 10)

  **Node 4: The Committee (Non-Standard Authorship)**
  A screenplay is written by a committee of twelve. No single person intended the final theme; it emerged from compromise.
  *   **A.** The work has no single authorial meaning, only textual meaning. (Go to Node 9)
  *   **B.** The collective intention of the group counts as the author's intention. (Go to Node 6)
  *   **C.** None of these fits me. (Go to Node 11)

  **Node 5: The Machine (Non-Standard Authorship)**
  A computer program generates a sonnet. No human wrote the words; the code was written by a team who did not intend the specific output.
  *   **A.** It has no meaning, only syntax. Meaning requires a human mind. (Go to Node 10)
  *   **B.** It has meaning based on how readers interpret it. The author is dead. (Go to Node 8)
  *   **C.** None of these fits me. (Go to Node 11)

  **Node 6: The Ambiguity Test**
  Returning to standard texts: Can two incompatible interpretations (e.g., "The character is guilty" vs. "The character is innocent") both be correct?
  *   **A.** No. Only one can be true. (Go to Node 7)
  *   **B.** Yes. Texts support multiple valid truths. (Go to Node 12)
  *   **C.** Only if the author intended the ambiguity. (Go to Node 7)

  **Node 7: The Ideal Audience**
  If the author's actual intention is unknowable, do we guess what they *would* have intended?
  *   **A.** Yes. We construct the best hypothesis based on public context. (Leaf: **Hypothetical Intentionalism**)
  *   **B.** No. We construct an author-figure that makes the text best, regardless of history. (Leaf: **Postulated Author**)
  *   **C.** No. We ignore intention entirely and look at the text. (Leaf: **Textualism**)

  **Node 8: The Reader's Role**
  If the author is absent (dead, unknown, or irrelevant), who determines meaning?
  *   **A.** The text itself determines it through its structures. (Leaf: **Textualism**)
  *   **B.** The reader creates meaning through engagement. (Leaf: **Author-Effacement**)
  *   **C.** The meaning is fixed by the original context of reception. (Leaf: **Historical Contextualism**)

  **Node 9: The Integration**
  When does an external element (like the misprint or a cultural shift) become part of the work?
  *   **A.** Never. The work is closed at creation. (Leaf: **Actual Intentionalism**)
  *   **B.** When it is accepted by the interpretive community. (Leaf: **Moderate Intentionalism**)
  *   **C.** Always. The work is open to all future accretions. (Leaf: **Pluralism**)

  **Node 10: The Gap**
  Is there a gap between "what the words say" and "what the speaker means"?
  *   **A.** Yes, and we must choose which one counts as 'meaning'. (Go to Node 7)
  *   **B.** No. Speaker meaning *is* linguistic meaning. If there's no speaker, there's no meaning. (Leaf: **Meaning-Use Identity**)
  *   **C.** Yes, but they merge in successful communication. (Leaf: **Moderate Intentionalism**)

  **Node 11: The Outlier**
  You have selected "None of these" on the non-standard cases.
  *   **A.** I believe the questions presuppose a false distinction between text and mind. (Leaf: **Meaning-Use Identity**)
  *   **B.** I believe meaning is inherently unstable and cannot be sorted this way. (Leaf: **Pluralism**)
  *   **C.** I hold a view not represented here. (Leaf: **Unmapped**)

  **Node 12: The Value Check**
  Does judging a text's quality change what it means?
  *   **A.** No. Meaning is neutral; evaluation is separate. (Leaf: **Actual Intentionalism** or **Textualism** depending on prior path)
  *   **B.** Yes. To interpret is to evaluate. (Leaf: **Postulated Author**)
  *   **C.** Only for canonical works. (Leaf: **Unmapped**)

  *(ASCII Decision Flow Summary)*
  ```
  Node 1 (Private Letter) --A/C--> Node 2 (Disavowal) --A--> Node 6 (Ambiguity) --A/C--> Node 7 (Ideal Audience)
  Node 1 (Private Letter) --B--> Node 3 (Misprint) --B--> Node 9 (Integration)
  Node 3 (Misprint) --C--> Node 10 (The Gap)
  Node 4 (Committee) --A--> Node 9 (Integration)
  Node 4 (Committee) --C--> Node 11 (The Outlier)
  Node 5 (Machine) --B--> Node 8 (Reader's Role)
  Node 5 (Machine) --C--> Node 11 (The Outlier)
  Node 6 (Ambiguity) --B--> Node 12 (Value Check)
  Node 10 (The Gap) --B--> Leaf: Meaning-Use Identity
  Node 11 (The Outlier) --A--> Leaf: Meaning-Use Identity
  ```

  **Scoring Key:**
  *   **Actual Intentionalism:** 1A/C → 2A → 6A/C → 7A (or 9A) → 12A.
  *   **Textualism (Beardsley):** 1B → 3A → 6A → 7C (or 8A).
  *   **Hypothetical Intentionalism:** 1C → 2A → 6A → 7A.
  *   **Postulated Author:** 1C → 2A → 6A → 7B (or 12B).
  *   **Meaning-Use Identity:** 3C → 10B (or 4C → 11A or 5C → 11A).
  *   **Moderate Intentionalism:** 1C → 2A → 6A → 10C (or 9B).
  *   **Pluralism:** 6B → 12A/B (or 9C).
  *   **Author-Effacement:** 5B → 8B (or 2C).
  *   **Unmapped:** 4C → 11C (or 12C).

  ***

  ## Part 3 — The Leaves

  **1. Actual Intentionalism (Hirsch-style)**
  *   **Awkward Commitment:** If an author successfully hides their meaning so well that no one can find it, the meaning still exists exactly as they hid it, rendering communication functionally irrelevant.
  *   **On the Misprint:** The misprint is an error, not meaning, regardless of how beautifully critics analyze it for two centuries.

  **2. Textualism (Beardsley-style)**
  *   **Awkward Commitment:** An author can be completely misunderstood by everyone, including themselves, and the public reading is still the only one that counts.
  *   **On the Private Letter:** The letter is biographical trivia; it cannot alter the semantic content of the public text.

  **3. Hypothetical Intentionalism (Levinson-style)**
  *   **Awkward Commitment:** We are not looking for the real author, but a fictionalized version of them that fits the evidence best.
  *   **On the Disavowal:** The author's later claim is rejected if an ideal audience at the time of publication would not have accepted it.

  **4. Postulated Author (Nehamas-style)**
  *   **Awkward Commitment:** The "author" we interpret is a character created by the interpretation, not the person who signed the contract.
  *   **On the Committee:** We construct a singular "author-function" to make sense of the text, even if twelve people wrote it.

  **5. Meaning-Use Identity (Knapp & Michaels-style)**
  *   **Awkward Commitment:** A text without an author (like the machine sonnet) is not a text with a different meaning; it is merely marks with no meaning at all.
  *   **On the Gap:** There is no theoretical gap between "what the words say" and "what the speaker means"; if you know it's language, you assume a speaker.

  **6. Moderate Intentionalism (Davies/Stecker-style)**
  *   **Awkward Commitment:** An author can fail to realize their intention, yet that failed intention still partially constrains what the work means.
  *   **On the Misprint:** If the author intended the correction, the misprint is an error; if they accept it later, it becomes part of the work.

  **7. Pluralism (Margolis-style)**
  *   **Awkward Commitment:** Two logically incompatible statements about the same text can both be true, provided they belong to different defensible frameworks.
  *   **On the Ambiguity:** "The character is guilty" and "The character is innocent" can both be correct interpretations of the same work.

  **8. Author-Effacement (Barthes-style)**
  *   **Awkward Commitment:** The author is not a person but a scriptable position; to seek the author is to limit the text's productivity.
  *   **On the Machine:** The machine text is the ideal text, as it liberates the reader from the tyranny of a human origin.

  **Empty Slots in the Logical Space:**
  *   **Actual Intentionalism + Pluralism:** This slot is empty because if meaning is fixed by a singular historical will, incompatible interpretations cannot both be true (unless the will intended contradiction, which collapses back to Singular Meaning of "contradiction").
  *   **Textualism + Hypothetical Intention:** This slot is incoherent. If meaning is constituted by public text, appealing to a hypothetical mental state reintroduces the mentalism the view rejects.

  **Near-Collapses (Pairs the Tree Cannot Separate):**

  **Pair 1: Actual Intentionalism vs. Moderate Intentionalism**
  *   **Why they collapse:** In most standard cases (Node 1, Node 2), both views prioritize the author's will. They only diverge on *failed* intentions (Node 3, Node 10). The tree routes them similarly unless the user hits the specific "Misprint" or "Gap" nodes with high precision.
  *   **Separation Case:** A case where the author intends X, the text clearly says Y, and the author admits they failed. Moderate Intentionalism says the meaning is a blend or Y-with-qualification; Actual Intentionalism says the meaning is X (and the text is just broken). *Sketch:* An architect designs a door to open inward; it is built to open outward. The architect says, "I meant inward." Does the building's "meaning" (function) remain inward?

  **Pair 2: Hypothetical Intentionalism vs. Postulated Author**
  *   **Why they collapse:** Both rely on a construct rather than the biographical person. Operationally, an "ideal audience attribution" (Levinson) often yields the same result as a "postulated author" (Nehamas). The difference is metaphysical (epistemic constraint vs. aesthetic construction), which the micro-cases struggle to pry apart.
  *   **Separation Case:** A case where the *best* interpretation requires attributing an intention the historical author *could not* have had (e.g., a proto-feminist reading of a misogynist text). Hypothetical Intentionalism rejects this (the author couldn't intend it); Postulated Author accepts it (the text supports this author-figure). *Sketch:* Reading Homer as a pacifist. Levinson says "No, historical context forbids this intention." Nehamas says "Yes, if the text supports this construct."

  **Pair 3: Textualism vs. Author-Effacement**
  *   **Why they collapse:** Both ignore the biographical author. In Node 8 (Reader's Role), the distinction between "The text determines it" and "The reader creates it" is often blurred in practice, as readers read texts.
  *   **Separation Case:** A text that is grammatically perfect but semantically nonsensical (e.g., Chomsky's "Colorless green ideas sleep furiously"). Textualism says it has meaning (syntactic/semantic rules); Author-Effacement might say it has no meaning until a reader gives it one. *Sketch:* The machine sonnet. Textualism analyzes its meter; Author-Effacement treats it as a Rorschach test.
