prompt: |-
  I've sat through way too many forum threads watching the laws-of-nature fight go in circles, so I want the document a real adversarial collaboration between a Lewis-style best-systems Humean and a governing-laws realist should have produced and never did.

  Give me: (1) a numbered list of claims both can sign — what the mosaic is, what a law is supposed to do, and which stock objections each side now concedes are question begging (the rotating-discs case, the charge that the best-system account already needs nomic notions to state its own criteria, the worry that Humeanism makes the world implausily transparent to us); (2) a table of residual disagreements, each row worded so that side would accept it about itself; (3) the cruxes, with the case or argument both agree bears on each and each side's prediction written down in advance.

  Then push one case I cooked up all the way through, since that's what I actually care about. Call it Tiebreak: the complete history of a universe admits two best systems, exactly tied on simplicity, strength and fit, that agree on everything that happened but assign different chances to some repeatable process, and so disagree about which counterfactuals hold. What is each side committed to saying, and does either answer cost them more elsewhere? Run the self-undermining problem as a second crux too — the Humean's own chances make the actual frequencies somewhat unlikely, and had those frequencies obtained they'd have supported a rival system.

  Finally, say how much of this is verbal. Propose a translation test both would accept (whether every counterfactual true on one side is true on the other, maybe) and say which parts of the dispute survive it.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Goal:** Create a document representing a *real* adversarial collaboration between a Lewis-style Best-Systems Humean (BSH) and a Governing-Laws Realist (GLR).
      *   **Tone:** Philosophical, rigorous, conciliatory but sharp, avoiding common strawmen.
