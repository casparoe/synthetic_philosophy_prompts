  # The Consensus Engine

  Here is the design. It is built to be frictionless mechanically so that the only friction is logical. It forces the "arithmetic error" realization by making the math trivial and the convergence inevitable—until you break it.

  ## Part 1: The Setup (Phase 1)

  **The Goal:** Six pairs of agents attempt to agree on the probability of an Event $E$.
  **The Stakes:** A "Group Pot" of 12 chocolate bars sits on the whiteboard. Every round where *any* pair fails to agree costs the group one bar. Additionally, every individual gets a personal bar if their final agreed number matches the *Truth* (0 or 1).
  **The Constraint:** You must announce your posterior probability of $E$ out loud and write it on the central whiteboard. You cannot show your card. You cannot discuss *why* you chose the number, only state the number.

  ### The Materials (Printable)

  **1. The World Map (Handout for Everyone)**
  This establishes the Common Prior and Common Knowledge of Partitions.
  *   **State Space ($\Omega$):** $\{1, 2, 3, 4\}$
  *   **Prior:** Uniform. Each state has probability $1/4$.
  *   **Event ($E$):** "The state is 1, 2, or 3." (Prior probability = $3/4$).
  *   **Alice's Vision (Partition):** She knows if the state is in $\{1, 2\}$ or $\{3, 4\}$.
  *   **Bob's Vision (Partition):** He knows if the state is in $\{1, 3\}$ or $\{2, 4\}$.

  **2. The Secret State Cards (Dealer Only)**
  *   Shuffle a deck of 6 cards: four marked "2", two marked "4". (We want most pairs to have a solvable state, but we need the math to work).
  *   *Correction for consistency:* To ensure the worked example below holds for *every* pair, **deal the same True State to every pair.**
  *   **True State for all pairs:** **2**.
      *   (Why 2? It is in $E$. It is in Alice's $\{1,2\}$. It is in Bob's $\{2,4\}$. This creates the specific disagreement dynamic calculated below).

  ### The Worked Numbers (Sanity Check)

  Here is the exact trajectory you should expect if they follow the rules.

  **Round 0 (Private Calculation)**
  *   **True State:** 2.
  *   **Alice** sees $\{1, 2\}$.
      *   Possible states: 1, 2.
      *   States in $E$: 1, 2. (Both are in $E$).
      *   **Alice's Posterior:** $2/2 = \mathbf{1}$.
  *   **Bob** sees $\{2, 4\}$.
      *   Possible states: 2, 4.
      *   States in $E$: 2. (4 is not in $E$).
      *   **Bob's Posterior:** $1/2 = \mathbf{0.5}$.

  **Round 1 (Public Announcement)**
  *   Alice writes **1**. Bob writes **0.5**.
  *   *Disagreement.* Group Pot loses 1 chocolate.

  **Round 2 (Updating)**
  *   **Alice Updates:** She hears Bob say **0.5**.
      *   Alice knows Bob's partition: $\{1, 3\}$ or $\{2, 4\}$.
      *   If the state were **1** (in Alice's $\{1, 2\}$): Bob would see $\{1, 3\}$. Both are in $E$. Bob would calculate $2/2 = 1$.
      *   If the state were **2** (in Alice's $\{1, 2\}$): Bob would see $\{2, 4\}$. Only 2 is in $E$. Bob would calculate $1/2 = 0.5$.
      *   *Deduction:* Since Bob said 0.5, the state cannot be 1. It must be 2.
      *   Alice's new info: $\{2\}$. Probability of $E$: **1**.
  *   **Bob Updates:** He hears Alice say **1**.
      *   Bob knows Alice's partition: $\{1, 2\}$ or $\{3, 4\}$.
      *   If the state were **4** (in Bob's $\{2, 4\}$): Alice would see $\{3, 4\}$. Only 3 is in $E$. Alice would calculate $1/2 = 0.5$.
      *   If the state were **2** (in Bob's $\{2, 4\}$): Alice would see $\{1, 2\}$. Both in $E$. Alice would calculate $2/2 = 1$.
      *   *Deduction:* Since Alice said 1, the state cannot be 4. It must be 2.
      *   Bob's new info: $\{2\}$. Probability of $E$: **1**.

  **Round 2 (Public Announcement)**
  *   Alice writes **1**. Bob writes **1**.
  *   *Agreement.* Game stops for this pair.
  *   *Truth Check:* State was 2. $E$ is true. Probability 1 is correct. They win personal chocolates.

  ---

  ## Part 2: The Break (Phase 2)

  Run Phase 1 until all pairs converge (it will take 2 rounds). Collect the cards. Reset the chocolates.

  For Phase 2, keep the State Space, Partitions, and True State (2) exactly the same. **Change only the Prior.**

  **The Intervention:**
  Secretly hand **Bob** a modified "World Map."
  *   **Alice's Map:** Unchanged (Uniform Prior: 1, 2, 3, 4 each have 25%).
  *   **Bob's Map:** Biased Prior.
      *   State 4 has probability **50%**.
      *   States 1, 2, 3 share the remaining 50% (approx 16.7% each).
      *   *Simplify for arithmetic:* Tell Bob: "For you, State 4 is twice as likely as any other state. Normalize accordingly."
      *   Actually, to keep arithmetic "embarrassingly easy," use integers.
      *   **Bob's Weights:** State 1=1, State 2=1, State 3=1, **State 4=3**. Total = 6.
      *   **Alice's Weights:** State 1=1, State 2=1, State 3=1, State 4=1. Total = 4.

  **The New Trajectory (The "Gasp" Moment):**
  *   **True State:** 2.
  *   **Alice:** Unchanged. Sees $\{1, 2\}$. Posterior = **1**.
  *   **Bob:** Sees $\{2, 4\}$.
      *   Weight of 2: 1. Weight of 4: 3. Total Weight: 4.
      *   Weight of $E$ (State 2): 1.
      *   **Bob's Posterior:** $1/4 = \mathbf{0.25}$.
  *   **Round 1:** Alice says **1**. Bob says **0.25**.
  *   **The Stall:**
      *   Alice hears 0.25. She assumes Uniform Prior. She calculates: "If Bob sees $\{2,4\}$ with uniform prior, he should say 0.5. Why did he say 0.25? He must see different evidence." But she knows his partition. She cannot reconcile the number without assuming he is irrational or lying.
      *   Bob hears 1. He assumes Uniform Prior. He calculates: "If Alice sees $\{1,2\}$ with uniform prior, she says 1. This matches."
      *   Bob updates: He eliminates State 4 (because if State 4, Alice would see $\{3,4\}$ and say 0.5). Bob knows State is 2. Bob's posterior becomes **1** (since 2 is in $E$).
      *   Alice *cannot* update correctly because she doesn't know Bob's weights. She expects Bob to move to 1 in Round 2.
      *   **Round 2:** Alice says **1**. Bob says **1**.
      *   **Surface Agreement:** They agree on 1.
      *   **The Trap:** In the debrief, reveal Bob's card. Bob *did* converge, but only because Alice's signal was so strong it overpowered his prior.
      *   *Better Break for Maximum Gasp:* Change the Event $E$ for Bob? No.
      *   *Let's go with the instruction:* **Break Common Knowledge of Posteriors.**
      *   **Revised Phase 2:** Do not let them write on the whiteboard. They must write on index cards and swap them *privately*.
      *   **Why:** This breaks the "Common Knowledge" requirement. Alice knows Bob's number. Bob knows Alice's number. But Alice doesn't know *that Bob knows her number* (because she doesn't know he received her card yet, or if the channel is noisy).
      *   *Actually, the prompt asks me to choose (a), (b), (c) or propose.*
      *   **My Choice:** **(a) Secretly hand two players different priors.**
      *   **Why:** It produces the deepest "gasp" for this specific demographic. Programmers assume shared logic (code). Rationalists assume shared priors (Bayes). Breaking the prior shows that **you cannot agree if you do not agree on the weight of reality itself.** It validates the ER Nurse (who sees messy, weighted reality) against the Programmers (who see uniform logic).
      *   **The Gasp:** In the debrief, when you reveal Bob's prior, the room will realize they *agreed* in Round 2, but the *path* was broken. If you run it with State 4 as the True State, they will **never agree**.
      *   **Let's switch True State to 4 for Phase 2.**
      *   **True State:** 4.
      *   **Alice:** Sees $\{3, 4\}$. $E=\{1,2,3\}$. Posterior = $1/2 = \mathbf{0.5}$.
      *   **Bob (Biased):** Sees $\{2, 4\}$. Weights: 2=1, 4=3. $E \cap \text{Info} = \{2\}$ (Weight 1). Total Weight = 4. Posterior = $1/4 = \mathbf{0.25}$.
      *   **Round 1:** A=0.5, B=0.25.
      *   **Round 2:**
          *   Bob hears 0.5. He thinks: "If State 4, Alice sees $\{3,4\}$. Uniform prior $\to$ 0.5. Matches." Bob stays at 0.25.
          *   Alice hears 0.25. She thinks: "If State 4, Bob sees $\{2,4\}$. Uniform prior $\to$ 0.5. Why 0.25?" She cannot update. She stays at 0.5.
      *   **Result:** They stall forever at 0.5 vs 0.25. The chocolates run out.
      *   **This is the winner.** It creates a permanent, unresolvable disagreement based on a hidden variable.

  ---

  ## Part 3: The Debrief

  Do not lecture. Map the pain points they just felt to the theorem's hypotheses.

  **1. The "Arithmetic Error" Feeling (Phase 1)**
  *   *Ask:* "In Round 1, you disagreed. In Round 2, you agreed. Did anyone change their mind about the world, or just their math?"
  *   *Point:* Aumann's theorem says disagreement is a computation error. If we share priors and partitions, and we know each other's numbers, **there is only one valid posterior.** Persisting in disagreement isn't a "difference of perspective"; it's a bug in your update function.

  **2. The "Gasp" (Phase 2)**
  *   *Reveal:* Show Bob's biased prior card.
  *   *Point:* "You stalled because you violated the **Common Prior** assumption."
  *   *Upshot:* "In this room, when you disagree, you assume the other person has different *information*. Aumann says you should also check if you have different *priors*. Most real-world disagreement isn't about the data (the card); it's about the weights (the prior). The ER nurse weighs 'patient death' differently than the programmer weighs 'system downtime'. You will never agree until you admit your priors are different."

  **3. The Practical Upshot**
  *   "If I tell you my posterior, my number is now *evidence* about your information. A good disagreement is not a debate to be won. It is a hunt for the difference in information structures. If we agree on priors and partitions, and we still disagree, one of us is lying or broken."

  ---

  ## Part 4: The Honest Section (Failure Modes)

  You know this group. Here is what will go wrong and how to handle it.

  **1. The "Bluffer" (Announces a number they didn't compute)**
  *   *Symptom:* Someone announces "0.5" instantly in Round 1 without looking at their card.
  *   *Fix:* Enforce the "Show Your Work" rule *after* the game. Tell them: "At the end, I will audit one pair. If your written notes don't match your board numbers, you forfeit your chocolate." The threat of audit is usually enough.
  *   *Theorem Feature:* This breaks **Rationality**. AAT assumes agents are perfect Bayesians. Bluffing makes them game-theoretic agents. Acknowledge this: "AAT assumes honesty. In the real world, cheap talk is worthless. That's why we wrote numbers on the board."

  **2. The "Privacy Paranoid" (Refuses to reveal because it leaks their card)**
  *   *Symptom:* "If I say 1, you know I don't have 3 or 4!"
  *   *Fix:* "That is the point. The theorem requires the posterior to be common knowledge. If you hide the number, you break the mechanism. You are choosing to remain disagreeable."
  *   *Theorem Feature:* This breaks **Common Knowledge of Posteriors**.

  **3. The "Math Panic" (Stalls on fractions)**
  *   *Symptom:* "Wait, is 1/4 bigger than 0.2?"
  *   *Fix:* Provide a cheat sheet on the handout: $1/2 = 0.5$, $1/4 = 0.25$, $3/4 = 0.75$. Keep it to these three numbers.
  *   *Theorem Feature:* This breaks **Rationality** (bounded rationality).

  **4. What This Activity Cannot Reproduce**
  *   **Infinite Recursion:** AAT requires "I know that you know that I know..." ad infinitum. Our whiteboard only simulates two rounds.
  *   *How to Supply:* "In the game, we stopped at Round 2. In the theorem, this process continues until the numbers match. The whiteboard is a proxy for common knowledge. In the real world, we rarely have a whiteboard. We rarely know that the other person *heard* us. That is why real disagreement persists—not because we are stubborn, but because the channel is noisy."

  ## Summary Checklist for You

  1.  **Print:** 12 "World Maps" (6 standard, 2 biased for Phase 2 Bob), 12 "Vision Cards" (Alice/Bob partitions), 6 "True State" cards (Set to 2 for Phase 1, Set to 4 for Phase 2).
  2.  **Buy:** 24 Chocolate bars (12 for pot, 12 for individual accuracy).
  3.  **Board:** Draw a table for 6 Pairs, Rounds 1-3.
  4.  **Script:**
      *   "No talking about your card."
      *   "Write the number. Say the number."
      *   "Phase 2: Same rules. New maps."
      *   "Debrief: Why did Phase 2 break?"

  This design gives you the physical tension (chocolates burning), the arithmetic safety (halves and quarters), and the philosophical payload (priors are the hidden variable) without a single lecture slide.
