answer: |-
  Here is a menu of four distinct theses hidden inside the phrase "generations aren't real." Each handles the logic differently, and only one actually allows your friend to hold both positions without contradicting himself.

  ### 1. The Boundary Claim (The Cut-Point Thesis)
  *   **What it's literally saying:** The specific years used to divide generations (e.g., 1964 vs. 1965) are arbitrary conventions fixed by marketers or sociologists, not natural joints in reality.
  *   **Status:** **Substantive and defensible.** Boundaries are fuzzy. Plenty of real things have fuzzy edges (day/night, tall/short), but the specific line drawn is often administrative, not ontological.
  *   **Does it license his contradiction?** **No.** If the boundary is arbitrary, it cannot reliably distinguish a "Boomer" from a "Gen Xer" for the purpose of housing blame any more than it can for work attitudes. If the line is fake for your parents' work ethic, it is fake for his housing complaint. Using this thesis makes him inconsistent.
  *   **Grapples with:** The cut-point arbitrariness. It admits the lines are made up but argues that doesn't necessarily make the *grouping* unreal (like "tall people"). However, in his mouth, it functions as a dismissal of the category entirely.

  ### 2. The Essence Claim (The Reductionist Thesis)
  *   **What it's literally saying:** There is no causal mechanism where sharing a birth year creates shared psychological traits or values. Nothing happens at the cohort level over and above individuals sharing similar circumstances.
  *   **Status:** **Substantive and defensible.** Psychology is individual; economics is structural. It is false to say "Millennials are lazy" (trait); it is defensible to say "Millennials entered the workforce during a recession" (circumstance).
  *   **Does it license his contradiction?** **Yes.** This is the only thesis that saves him. It allows him to say: "Your parents' work ethic is individual/cultural (not generational)," while simultaneously saying: "Boomers hoarded housing because they hit the property market at a specific economic period (a generational *circumstance*)." It distinguishes between **shared values** (false) and **shared material conditions** (true).
  *   **Grapples with:** The explanation level. It requires admitting that "generation" is shorthand for "people who faced the same economic weather," not "people who have the same personality."

  ### 3. The Identification Claim (The APC Thesis)
  *   **What it's literally saying:** Age, Period, and Cohort are mathematically collinear (Cohort = Period − Age). You cannot statistically separate whether an outcome is due to getting older, living in 2024, or being born in 1980.
  *   **Status:** **Substantive and technically true** (in statistics), but often overused as a conversation stopper.
  *   **Does it license his contradiction?** **No.** This is a universal solvent. If the APC problem holds, you cannot cleanly blame Boomers for housing any more than you can blame them for work attitudes. You can't know if they hoarded housing because they are Boomers, because they are currently 70, or because housing laws changed in 2024. Using this thesis undermines his housing argument just as much as yours.
  *   **Grapples with:** The arithmetic trap. It damages any claim that relies on isolating cohort effects. It is neutral about boundaries but fatal to causality.

  ### 4. The Performative Claim (The Constructivist Thesis)
  *   **What it's literally saying:** Generations are not biologically real, but they become socially real because people believe in them and act accordingly (self-fulfilling prophecy).
  *   **Status:** **Defensible.** This is the Thomas Theorem: "If men define situations as real, they are real in their consequences."
  *   **Does it license his contradiction?** **Conditionally Yes.** It licenses the housing blame if Boomers vote as a block or policy treats them as a block. It licenses denying the work argument if your parents *don't* identify with their generation or act on it. It depends on whether the people involved are "performing" the generation.
  *   **Grapples with:** Reflexivity. It argues that belief produces the pattern. It makes generations "real enough" for politics (housing) but potentially "unreal" for private culture (work ethic) if the belief isn't there.

  ***

  ### The Indistinguishable Pair & The Bet

  **The Pair:** **The Boundary Claim (1)** and **The Essence Claim (2).**
  In casual argument, these are functionally indistinguishable because people use the arbitrariness of the *dates* (Claim 1) as proof that the *psychology* (Claim 2) is fake. Logically, this is a non sequitur: you can have arbitrary boundaries around a real phenomenon (e.g., "poverty lines" are arbitrary, but poverty is real). However, your menu cannot tell apart whether he thinks the *lines* are the problem or the *causality* is the problem, because he uses them interchangeably to shut down your point.

  **The Bet:**
  I bet he is operating on **The Essence Claim (2)** without realizing it.
  He denies generations for work because he sees work ethic as individual character (no shared essence). He affirms generations for housing because he sees housing as a material resource grab (shared circumstance). He *says* "Generations aren't real" (invoking Claim 1 or 3) because it sounds more objective, but his actual reasoning relies on splitting **values** (not generational) from **resources** (generational). He isn't being logically inconsistent; he's just using a shorthand ("generations aren't real") to mean "personality isn't determined by birth year," while implicitly accepting "economic opportunity is determined by birth year."

  **How to text him:**
  Don't fight the "real" definition. Ask him: *"Are you saying generations don't exist because the birth years are arbitrary, or because you don't think people born at the same time share the same values? Because I agree values are individual, but economic conditions aren't."* That forces him to pick Thesis 2, which validates both of you.
