prompt: |-
  I work in commercial mediation and our house rule for dividing a joint surplus is basically the Kalai–Smorodinsky thing without anybody ever naming it: we work out each side's walk-away position and its best conceivable outcome, then settle on the single t that puts both parties the same fraction t of the way from the first to the second, so the gains are proportional. Two bits of it have started to bother me. One is that a party's best conceivable outcome counts in full even when it rests on an option nobody would ever actually exercise — say they bought up a patent that only pays off if the other side cooperates perfectly, which will never happen, but it still raises their ceiling and so raises their share. Two is that the same mediators will let each side simply assert its best case pretty much unchallenged, while insisting that the walk-away number has to be backed up with real accounts and real alternative offers.

  So: what theory of fairness does this practise presuppose? Is it the idea that you're owed something in virtue of what you could have got rather than what you contribute or what you can credibly threaten, or something else entirely? Reconstruct the implicit view, then tell me how much of it the rule strictly needs — could a contribution-based or a threat-based account license exactly the same procedure, or does the rule quietly rule them out? And if we decided unexercised options shouldn't count, what would have to change in how the rule is actually run day to day? Finally, is the asymmetry between the two numbers — best case taken on trust, walk-away audited — defensible on any principle, or does it just reward whoever can state a grander ceiling with a straighter face?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Commercial mediation.
      *   **Current Practice:** A "house rule" for dividing surplus that mimics the Kalai-Smorodinsky (KS) bargaining solution.
      *   **Mechanism:** Identify Walk-Away (Disagreement Point, $d$) and Best Conceivable Outcome (Ideal Point, $u^*$). Settle at point $x$ such that $\frac{x_i - d_i}{u^*_i - d_i} = t$ for both parties $i=1,2$. This equalizes the *proportion* of potential gain achieved.
      *   **Problem 1 (The "Unexercised Option" Issue):** The "Best Conceivable Outcome" ($u^*$) includes hypothetical scenarios that are practically impossible (e.g., a patent payoff requiring perfect cooperation that won't happen). This inflates the ceiling and thus the share.
      *   **Problem 2 (The Asymmetry Issue):** Walk-away ($d$) is heavily audited/verified. Best case ($u^*$) is taken on assertion/trust.
      *   **Questions to Answer:**
          1.  What theory of fairness does this practice presuppose? (Reconstruct the implicit view).
          2.  Is it based on "what you could have got" vs. "contribution" vs. "threat"?
          3.  Could a contribution-based or threat-based account license this same procedure, or does the rule rule them out?
          4.  If unexercised options shouldn't count, what changes in day-to-day running?
          5.  Is the asymmetry (audited floor, trusted ceiling) defensible, or does it reward bluffing?

  2.  **Analyze the Theoretical Underpinnings (Question 1 & 2):**

      *   **The Rule:** It's explicitly Kalai-Smorodinsky (KS).
      *   **KS Philosophy:** KS is an axiomatization of bargaining. It satisfies Pareto Optimality, Symmetry, Scale Invariance, and *Individual Monotonicity*.
      *   **Fairness Theory:** KS is often interpreted as a "proportional gains" solution. It's not strictly Rawlsian (maximin) or Utilitarian (max sum). It leans towards a conception of *equal relative sacrifice* or *equal opportunity fulfillment*.
      *   **Implicit View:** The practice presupposes that fairness lies in equalizing the *satisfaction of claims relative to potential*. It treats the "Ideal Point" as a legitimate claim, even if hypothetical. It suggests a "Right to Hope" or "Entitlement to Potential."
      *   **Contribution vs. Threat vs. Potential:**
          *   *Threat-based (Nash):* Nash Bargaining Solution (NBS) relies on the shape of the feasible set and the disagreement point. It's about maximizing the product of gains. It cares about curvature (risk aversion/marginal utility). KS ignores curvature, focusing only on the ideal point. So, this practice is *not* standard threat-based (Nash).
          *   *Contribution-based:* This usually implies Shapley value or marginal productivity. KS doesn't measure marginal contribution to the surplus; it measures distance from $d$ to $u^*$. So, it's not strictly contribution-based.
          *   *Potential-based:* Yes. It rewards the *scope* of your upside, regardless of probability. This aligns with the user's observation about "what you could have got."

  3.  **Analyze Compatibility with Other Accounts (Question 3):**

      *   **Can Contribution/Threat accounts license this?**
          *   *Threat:* A pure threat account (Nash) would look at the *feasible* frontier. If the "best case" is infeasible (probability ~0), a strict threat account should discount it by probability. KS takes the *utopian* point. So, a strict threat account conflicts with counting unexercised/impossible options.
          *   *Contribution:* If "contribution" is defined as "bringing the possibility of a high value to the table," maybe. But usually, contribution implies actual value added. If the option is never exercised, the contribution is null.
          *   *Conclusion:* The rule *quietly rules out* strict contribution or threat accounts because those accounts require feasibility or probability weighting. KS treats the ideal point as a *right*, not a probability-weighted expectation.

  4.  **Analyze the "Unexercised Option" Fix (Question 4):**

      *   **Current:** $u^*$ = Max possible payoff (even if prob $\approx$ 0).
      *   **Fix:** $u^*$ should be *Expected* Best Outcome or *Feasible* Best Outcome.
      *   **Day-to-Day Changes:**
          *   Mediators can't just ask "What's your best case?"
          *   They must ask "What's your best *realistic* case?" or "What is the payoff weighted by probability?"
          *   This turns the ceiling into an audit target (like the floor).
          *   It shifts the mediation from "claim space" to "probability space."
          *   It requires challenging the "unexercised options" (e.g., "You say the patent pays \$10M, but given the cooperation clause, what's the probability? Let's discount it.").

  5.  **Analyze the Asymmetry (Question 5):**

      *   **Observation:** Floor ($d$) audited, Ceiling ($u^*$) trusted.
      *   **Defensibility:**
          *   *Argument For:* $d$ determines whether a deal happens (BATNA). It must be real. $u^*$ is just a scaling factor for fairness. Maybe optimism is necessary for deal-making? "Anchoring."
          *   *Argument Against:* It creates an incentive to inflate $u^*$. Since $t$ is shared, inflating $u^*$ shifts the settlement point in your favor. If I claim \$100M instead of \$10M, and you claim \$10M, the proportional split favors me.
          *   *Principle:* Is there a principle? Maybe "Benefit of the Doubt" on upside, "Burden of Proof" on downside?
          *   *Reality:* It likely rewards bluffing. In KS, the ideal point *must* be feasible (in theory). If the practice allows infeasible points, it breaks the axioms. If mediators don't challenge $u^*$, they are allowing manipulation of the scaling factor.
          *   *Verdict:* Hard to defend on fairness principles. It defends on *efficiency* (speed, avoiding conflict over speculation), but fails on *equity*.

  6.  **Synthesize and Structure the Response:**

      *   **Introduction:** Acknowledge the sophistication of the observation. Confirm it is indeed Kalai-Smorodinsky (KS).
      *   **Part 1: The Implicit Theory of Fairness.**
          *   Identify it as "Proportional Concession" or "Equal Relative Gain."
          *   Contrast with Nash (threat/contribution).
          *   Key concept: Entitlement to *Potential* rather than *Expected Value*.
      *   **Part 2: Compatibility with Threat/Contribution.**
          *   Explain why strict threat/contribution accounts fail here (they require feasibility/probability).
          *   The rule rules them out because it treats the utopian point as a hard claim, not a weighted expectation.
      *   **Part 3: Fixing the "Unexercised Option" Problem.**
          *   Shift from "Best Conceivable" to "Best Reasonable/Feasible."
          *   Operational change: Audit the ceiling. Apply probability discounts.
          *   Consequence: Slower, more contentious, but more robust.
      *   **Part 4: The Asymmetry Defense.**
          *   Why $d$ is audited (feasibility constraint).
          *   Why $u^*$ is trusted (often to preserve face/hope).
          *   Critique: It incentivizes "aspirational bluffing."
          *   Verdict: Not defensible on fairness, only on transactional speed/psychology.
      *   **Conclusion:** Summarize the tension between the mathematical elegance of KS and the messy reality of mediation.

  7.  **Refine the Tone:**
      *   Keep it analytical, philosophical, but grounded in practical mediation dynamics.
      *   Use the user's terminology ("walk-away," "best conceivable").
      *   Ensure the distinction between Nash and KS is clear but not overly technical.
      *   Address the "bluffing" aspect directly.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, does KS require the ideal point to be feasible?* Yes, strictly speaking, the ideal point in KS is the vector of *maximum feasible utilities* for each player independently. If the "best conceivable" is *infeasible* (outside the Pareto frontier), it's not the KS ideal point. The user says "best conceivable... even when it rests on an option nobody would ever actually exercise." This implies the point might be *feasible* in isolation but not jointly, or just highly improbable. If it's outside the feasible set, it's not KS anymore, it's a distorted KS. I need to point this out. The practice is "KS-like" but technically violates the feasibility axiom if the "best case" isn't actually attainable.
      *   *Refinement:* The practice treats the "Ideal Point" as a *claim* rather than a *feasible maximum*. This is a crucial distinction. It turns the mathematical solution into a rhetorical tool.
      *   *Asymmetry:* Why audit $d$? Because if $d$ is fake, the deal might be worse than walking away (individual rationality violation). Why not audit $u^*$? Because if $u^*$ is fake, the deal still happens, just skewed. The risk asymmetry explains the procedural asymmetry.

  9.  **Final Polish:** Check against all specific questions in the prompt.
      *   Theory of fairness? (Equal relative satisfaction of claims).
      *   Contribution/Threat license it? (No, they require probability/feasibility).
      *   What changes if unexercised options don't count? (Audit the ceiling).
      *   Is asymmetry defensible? (Pragmatically yes, normatively no).

  10. (Drafting response based on these points.)
answer: |-
  You have identified a precise and sophisticated tension between the mathematical elegance of a bargaining solution and the messy sociology of its application. Your house rule is indeed a pragmatic implementation of the **Kalai–Smorodinsky (KS) bargaining solution**, but with a critical deviation: standard KS requires the "ideal point" to be the maximum *feasible* utility for each party. Your practice allows the ideal point to be the maximum *conceivable* utility, even if infeasible or probabilistically negligible.

  Here is a reconstruction of the implicit theory, an analysis of its compatibility with other accounts, and a verdict on the procedural asymmetries.

  ### 1. The Implicit Theory of Fairness: Equal Relative Satisfaction

  The theory of fairness your practice presupposes is **not** based on contribution (marginal productivity) nor strictly on threat power (the Nash Bargaining Solution). It is a theory of **Equal Relative Concession** or **Proportional Claim Fulfillment**.

  In this view, fairness is not about dividing the pie according to who baked it (contribution) or who holds the knife (threat). It is about ensuring that both parties feel they have sacrificed the same *percentage* of their hopes to reach agreement.

  *   **The Principle:** Each party is entitled to a share of the surplus proportional to the size of their "claim space" (the distance between walk-away and best case).
  *   **The Ontology of Value:** This presupposes that **potentiality has normative weight.** You are owed something in virtue of what you *could* have got, not just what you can credibly threaten to achieve or what you actually contributed. It treats the "Best Conceivable Outcome" as a legitimate property right, even if that property is a lottery ticket with odds of one in a million.
  *   **Why this appeals to mediators:** It is psychologically potent. It allows parties to say, "I got 60% of my dream," which saves face better than "I got 60% of the market value." It converts a distributive fight into a scaling exercise.

  ### 2. Can Contribution or Threat Accounts License This?

  Strictly speaking, **no.** Your current rule quietly rules out standard contribution and threat-based accounts.

  *   **Threat-Based (Nash):** The Nash Bargaining Solution maximizes the product of gains $(x_1 - d_1)(x_2 - d_2)$. It is sensitive to the *curvature* of the feasible set (risk aversion) and the *feasibility* of outcomes. A threat account discounts outcomes by their probability. If your "best case" relies on an unexercised option (probability $\approx 0$), a threat-based account assigns it a value of $\approx 0$. Your rule assigns it full weight. Therefore, a threat-based theorist would call your rule irrational because it allows low-probability threats to distort the settlement.
  *   **Contribution-Based (Shapley):** A contribution account looks at marginal value added. If the patent option is never exercised, the marginal contribution of that patent to the *actual* deal is zero. A contribution-based account would ignore the ceiling inflation.

  **The Verdict:** The rule relies on a **Claim-Based Account**. It assumes that having a *logical possibility* of a high payoff constitutes a claim on the surplus, regardless of the likelihood of realizing it. It prioritizes the *scope* of the party's ambition over the *credibility* of their position.

  ### 3. If Unexercised Options Shouldn't Count: Operational Changes

  If you decided that only *credible* or *feasible* best cases should count (aligning closer to true KS or Nash), the day-to-day mediation would change drastically. Currently, you treat the floor ($d$) as a fact and the ceiling ($u^*$) as a story. To fix the "unexercised option" problem, you must treat the ceiling as a fact.

  **What would have to change:**
  1.  **Probabilistic Auditing:** Mediators would have to ask not "What is your best case?" but "What is the probability-weighted best case?" If a party claims a \$10M patent payoff that requires the other side's perfect cooperation, the mediator must assign a probability (e.g., 5%) and discount the ceiling to \$500k for the calculation.
  2.  **Feasibility Constraints:** The "Ideal Point" must be Pareto feasible. If Party A's best case requires Party B to lose money, it is not a valid KS ideal point. Mediators would have to police the *joint* feasibility of the two ceilings, not just accept them individually.
  3.  **Shift in Leverage:** Currently, leverage comes from inflating the ceiling. Under the new rule, leverage comes from proving the *realism* of the ceiling. The mediation becomes less about "dreaming big" and more about "reality testing" the upside with the same rigor currently applied to the downside.

  ### 4. Defending the Asymmetry: Audited Floor, Trusted Ceiling

  You asked if the asymmetry (auditing the walk-away, trusting the best case) is defensible on principle, or if it rewards bluffing.

  **The Pragmatic Defense (Why you do it):**
  There is a functional reason for this asymmetry, though it is not strictly about fairness.
  *   **The Floor ($d$) is a Constraint:** If the walk-away number is fake, the deal might violate **Individual Rationality**. If a party settles for less than their true BATNA, they will regret the deal, implementation will fail, or the deal will collapse. Auditing $d$ ensures the deal is *stable*.
  *   **The Ceiling ($u^*$) is a Scale:** If the best case is fake, the deal still happens. The only victim is the proportion $t$. Mediators often tolerate inflated ceilings because they serve a **psychological function**: they allow parties to anchor high, feel heard, and then feel "generous" when they concede to the proportional split. Challenging the ceiling too hard can kill the optimism required to sign.

  **The Normative Critique (Why it's problematic):**
  On principles of fairness, the asymmetry is **indefensible**. It creates a **Perverse Incentive for Aspirational Bluffing**.
  *   Since the settlement $x$ is determined by $t$, and $t$ is derived from the ratio of gains, inflating your denominator ($u^* - d$) allows you to capture more surplus for the same $t$.
  *   If Party A audits their floor at \$1M and claims a ceiling of \$10M (unrealistic), and Party B audits their floor at \$1M and claims a ceiling of \$2M (realistic), the math forces Party B to subsidize Party A's optimism.
  *   **Who gets rewarded?** The party with the straighter face and the more complex, unverifiable upside options (like your patent example). It rewards **opacity**.

  ### Summary Recommendation

  Your house rule is a **Kalai-Smorodinsky mechanism running on Claim-Based fairness**, not Threat or Contribution fairness.

  *   **Does it work?** Yes, because it equalizes relative satisfaction, which feels fair to humans.
  *   **Is it vulnerable?** Yes, because it treats "conceivable" as "claimable," allowing low-probability options to tax the surplus.
  *   **Is the asymmetry defensible?** Only on grounds of **transactional efficiency** (speed and deal stability), not equity. It rewards the better bluffer.

  **To fix it without breaking the room:**
  You do not need to fully audit the ceiling (which kills optimism). But you must introduce a **"Feasibility Filter."** The rule should be: *The Best Conceivable Outcome must be jointly feasible.* If Party A's best case requires Party B to act against their interest, that ceiling is inadmissible for the calculation. This removes the "unexercised option" problem (which usually relies on the other side doing something they won't do) without requiring a full probabilistic audit that stalls the mediation.
