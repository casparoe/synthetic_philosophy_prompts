prompt: |-
  My family group chat has become unliveable. Any time Britain's imperial past comes up — usually after somebody posts about a statue or a museum label — my brother in law forwards something out of Niall Ferguson's *Empire* making the case that the Raj was on balance a good thing for India: railways, rule of law, a single administration, free trade, English as a lingua franca, and the point that India was never a settler colony of the kind that dispossessed whole populations wholesale. My sister fires straight back with Tharoor — that viral Oxford Union clip and then *Inglorious Empire* — on the destruction of handloom weaving, Naoroji's drain, famine mortality, Jallianwala Bagh, the Bengal famine of 1943, divide and rule, and the headline number that India's share of world output fell from something like a quarter in 1700 to barely above 3 per cent by 1947. They have been arguing past each other for years, and I've finally got the two of them to agree to co-author something for a reading group I run. Draft the joint statement a committed Ferguson-style defender of the imperial balance sheet and a committed Tharoor-style critic could both actually put their names to after a genuine adversarial collaboration.

  What I care about most is that it's neither slanted nor vacuous, so start with a numbered list of claims both sides can sign — and real ones, not "both agree the Raj existed". I'd expect some to be about the evidence base itself: that the famous share-of-world-output figure descends from Angus Maddison's long-run reconstructions and is only as good as those reconstructions are; that pre-colonial Indian output, wages and famine mortality are estimates with enormous error bars, so the two camps are not comparing like with like when one of them reaches for the eighteenth century. Some should be substantive historical claims both accept, e.g. that handloom weaving collapsed in the early nineteenth century and that Indian-owned cotton mills then grew strongly in Bombay and Ahmedabad later in the century; that English restrictions on imported Indian calicoes came long before Lancashire's steam-driven cost advantage; that the colonial state did eventually write famine codes and build an enormous railway network, and also ran denial policies in coastal Bengal and repeatedly declined to divert shipping during the 1943 famine; and that by 1947 Britain owed India a very large sterling balance. And some should be about the shape of the normative argument — I suspect both would sign something like: even a positive net balance sheet would not by itself legitimate rule over people who never consented to it, which changes what the argument is even about.

  Then give me a disagreements table, and this is the real work. For each row: the question in neutral terms; the formulation of the Fergusonian position phrased so that he would accept it as his own; the formulation of the Tharoorian position phrased so that he would accept it as his own; a label for what kind of dispute it is (empirical, counterfactual, normative, or a fight about units and aggregation); and then the crux — the specific test, statistic or comparison both would agree bears on it — with each side's prediction written down in advance and a note on what would actually move them. Candidates I'd expect to see: how the counterfactual baseline gets built at all (against Maratha successor states, Mysore, the Sikh Empire, or against never-formally-colonised comparators like Japan and Siam?), and who bears the burden of proof there; whether railway-connected districts saw lower or higher famine mortality than unconnected ones holding rainfall roughly constant; whether the textile collapse was tariff-driven or productivity-driven; whether the drain is measurable in principle and what a counterfactual independent state would have done with those revenues; whether the world-output-share metric means anything at all given that world output exploded over the same period; and whether aggregate consumption growth can ever offset losses of status and autonomy. Finally, tell me which parts of the quarrel are merely verbal — where the two are using benefit, exploitation, responsibility and on balance differently rather than disagreeing about the world — and say why. British English please, and no bibliography or reading list: name scholars only where it genuinely helps and don't invent references.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A family group chat argument between a brother-in-law (Niall Ferguson/Pro-Empire stance) and a sister (Shashi Tharoor/Anti-Empire stance) regarding the British Raj in India.
      *   **Task:** Draft a joint statement for a reading group that both could genuinely sign after adversarial collaboration.
      *   **Requirements:**
          *   British English.
          *   No bibliography/reading list (name scholars only if necessary).
          *   **Part 1:** A numbered list of agreed claims (substantive, evidentiary, and normative). Not vacuous platitudes.
          *   **Part 2:** A disagreements table (Question, Fergusonian Position, Tharoorian Position, Type of Dispute, The Crux/Test/Prediction).
          *   **Part 3:** Analysis of verbal disputes (definitions of benefit, exploitation, etc.).
          *   **Tone:** Neutral, rigorous, historically grounded, avoiding slant or vacuity.

  2.  **Deconstruct the Positions:**
      *   **Fergusonian (Pro-Empire/Balance Sheet):** Focus on institutions (railways, law, administration), integration into global trade, English language, lack of settler colonialism (relative to Americas/Australia), modernisation. Tends to view the "drain" as payment for services or inevitable capital flight. Sees the alternative as chaos or worse colonialism.
      *   **Tharoorian (Anti-Empire/Extraction):** Focus on deindustrialisation (handlooms), drain of wealth (Naoroji), famine mortality (policy-induced), divide and rule, Jallianwala Bagh, Bengal 1943. Sees the "share of world GDP" drop as evidence of relative decline caused by extraction. Views consent/autonomy as paramount.

  3.  **Drafting Part 1: Agreed Claims (The Common Ground):**
      *   *Constraint:* Must be specific, not "the Raj existed."
      *   *Idea 1 (Data limitations):* Maddison's data is the source of the GDP share argument, but it's reconstructed with error bars. Both should agree on the uncertainty.
      *   *Idea 2 (Textiles):* Handlooms declined early 19th C. Indian mills grew late 19th C. Tariffs preceded steam advantage.
      *   *Idea 3 (Famine/Railways):* Railways were built. Famine codes existed. But 1943 involved denial policies and shipping refusals.
      *   *Idea 4 (Finance):* The Sterling Balance was huge by 1947.
      *   *Idea 5 (Normative):* Net economic benefit $\neq$ political legitimacy. Consent matters.
      *   *Refinement:* Ensure the language is precise. Instead of "famines happened," say "policy choices exacerbated mortality." Instead of "textiles died," say "structural shift occurred."

  4.  **Drafting Part 2: The Disagreements Table:**
      *   *Constraint:* Neutral question, authentic representation of both sides, classification, specific crux/test.
      *   *Row 1: Counterfactual Baseline.*
          *   Q: What would India have looked like without the Raj?
          *   Ferguson: Fragmented princely states, vulnerable to other colonisers.
          *   Tharoor: Unified indigenous state (Maratha/Sikh), industrialising like Japan.
          *   Type: Counterfactual.
          *   Crux: Comparison with Japan/Siam.
      *   *Row 2: Railways and Famine.*
          *   Q: Did railways mitigate or exacerbate famine mortality?
          *   Ferguson: Integrated markets, lowered prices, saved lives.
          *   Tharoor: Facilitated grain export away from hungry zones, spread disease.
          *   Type: Empirical/Econometric.
          *   Crux: District-level mortality vs. connectivity controlling for rainfall.
      *   *Row 3: Deindustrialisation.*
          *   Q: Cause of textile decline.
          *   Ferguson: Technological superiority of Lancashire (productivity).
          *   Tharoor: Tariff discrimination and forced deindustrialisation (policy).
          *   Type: Empirical/Causal.
          *   Crux: Price differentials and tariff schedules 1800-1850.
      *   *Row 4: The Drain.*
          *   Q: Nature of financial transfers.
          *   Ferguson: Payment for services (army, admin), investable capital.
          *   Tharoor: Unrequited tribute, theft of surplus.
          *   Type: Normative/Accounting.
          *   Crux: Would an independent India have retained/spent this differently?
      *   *Row 5: Aggregation.*
          *   Q: Meaning of "Share of World Output".
          *   Ferguson: Global pie grew; absolute poverty matters more than relative share.
          *   Tharoor: Relative decline indicates active underdevelopment.
          *   Type: Units/Aggregation.
          *   Crux: Correlation between colonial status and relative GDP share globally.
      *   *Row 6: Legitimacy.*
          *   Q: Can economic gain justify non-consensual rule?
          *   Ferguson: Yes, if net welfare improved (benevolent paternalism).
          *   Tharoor: No, sovereignty is a precondition for welfare.
          *   Type: Normative.
          *   Crux: Willingness to trade autonomy for GDP growth.

  5.  **Drafting Part 3: Verbal Disputes:**
      *   Identify where they talk past each other.
      *   "On Balance": Ferguson means aggregate GDP/Infrastructure. Tharoor means distribution/human cost/sovereignty.
      *   "Exploitation": Ferguson sees market exchange (even if unequal). Tharoor sees coercive extraction.
      *   "Responsibility": Ferguson sees unintended consequences of market forces. Tharoor sees direct policy liability.

  6.  **Review and Refine (Self-Correction):**
      *   *Check Tone:* Is it too academic? Keep it accessible but rigorous. Is it British English? (Use "labour", "defence", "programme", "centred").
      *   *Check Constraints:* No bibliography. Name scholars only if helpful (Maddison, Naoroji mentioned in prompt, okay to keep).
      *   *Check Specificity:* Ensure the "Agreed Claims" aren't weak. The prompt gave specific examples (Maddison error bars, 1943 denial policies). Make sure those are integrated.
      *   *Check the "Crux":* Ensure the "test" is something they could theoretically agree to look at, even if they interpret it differently.
      *   *Check the "Normative" point:* The prompt specifically asked for the point about consent overriding the balance sheet. Make sure that's prominent.

  7.  **Final Polish:**
      *   Ensure the distinction between "settler colony" and "extraction colony" is acknowledged in the agreements (as per prompt).
      *   Ensure the Sterling Balance is mentioned.
      *   Make sure the table headers are clear.
      *   Verify the "Verbal Disputes" section explains *why* it's verbal (different definitions of value).

  8.  *(Final thought on the "Joint Statement" format)*: It should look like a preamble followed by the lists. It needs to sound like a truce document that acknowledges deep disagreement without resolving it falsely.

  9.  *(Drafting content)*... *Mental check on British spelling:* "labour", "defence", "centred", "programme". *Mental check on tone:* Dispassionate, analytical.

  10. *(Final Review against Prompt)*:
