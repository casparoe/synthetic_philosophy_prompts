  So, weird thing I keep running into and I want a second brain on it before I write my response paper. I'm in an aesthetics seminar and we did Schopenhauer on music last week — the bit where music is supposedly a direct copy of the will itself instead of a copy of the Ideas like the other arts, the layered thing about the deep bass standing for the crudest level of reality and the singing top line standing for the individual's striving, and his grumpiness about music that tries to imitate stuff. Meanwhile my friend Maya, who plays cello and runs this listening circle downtown and writes little reviews for a zine, has never read him and swears she wouldn't. But her verdicts keep landing in almost exactly that place, and I've started writing them down: Vivaldi's Four Seasons and any battle piece she dismisses outright as a party trick; Berlioz's Symphonie fantastique she says she only loves when she's forgotten the printed program, and even then it's less good than she wants it to be; Beethoven's Pastoral she rates highly but insists its not about the countryside and would lose nothing without the movement titles; Mozart's G minor quintet and the Rossini overtures are top of her list because they say everything without meaning anything; the Boulez her brother adores she ranks low, sounds like arithmetic, the ear can't follow a wanting; a twenty-minute ambient drone she also ranks low, nothing in it wants anything; and then Bach's St Matthew Passion is her number one, which is awkward since it has words and a story, and when I push her on that she says the words are part of the shape and she means it.

  Three pieces are up for the circle's spring program and she has to rank them, and I want to know what you think she'll do before I ask her. First: a twelve-minute electroacoustic piece built entirely out of processed recordings of a printing press and a subway train, no pitched instruments anywhere in it, but organized as one huge slow build of pressure and then a long calm release — the composer describes it as a portrait of a workday. Second: a new tone poem whose program note describes only inner states, something like wanting a thing you can't name, no objects, no narrative, no imitated sounds, and it's frankly tonal with a big singing line over a grounded bass. Third: a four-minute static piano miniature in the Pärt/Satie vein — plain triads, clear melody, deep simple bass, and essentially no tension or development at all. Give me her ranking and her yes/no on each, but mostly give me the machinery: what are the candidate rules her track record is actually consistent with (my guesses so far are a ban on music that copies things in the world, a requirement that the music exhibit wanting and its satisfaction or frustration, some requirement about the layering of the voices, and a requirement that music be graspable straight off without concepts), what does each one predict about these three, which single one is your best bet and why, and which further piece would seperate the survivors. And tell me whether she really is Schopenhauerian or whether I'm pattern-matching — where do her verdicts come apart from what he'd say.

  Two things about how you answer. Commit — I want an actual predicted ranking, not a hedge cloud, though do tell me how much weight seven verdicts can bear and where you'd want more data before you'd trust the extrapolation. And if you think the request is broken, say so plainly instead of being polite about it: if I've described the three new pieces so loadedly that any answer is foregone, or if the Passion verdict already wrecks every rule on my list and there's no coherent prediction to make, I'd much rather hear that up front than read a confident-sounding answer that papers over it.
