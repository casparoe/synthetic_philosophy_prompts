  No single established term perfectly captures this specific configuration, though it overlaps with concepts in Science and Technology Studies.

  The closest analog is "methodological nationalism," where research methods assume nation-states, reproducing them as natural units; however, this is domain-specific. "Ontological politics" (Annemarie Mol) argues realities are enacted by practices but lacks the focus on masking substantive choices as neutral rules. "Boundary work" (Thomas Gieryn) distinguishes science from non-science but does not detail how internal methodological criteria settle external disputes. "Depoliticization" names the effect but not the mechanistic cause.

  I propose coining **"Methodological Preemption"**.

  **Definition:** A structural dynamic wherein procedural admissibility rules exclude substantive possibilities prior to debate, presenting contingent disciplinary choices as neutral necessities. The method filters which hypotheses are permissible based on formal characteristics (e.g., synchrony, sharpness) that correlate with specific substantive outcomes (e.g., industrial agency).

  **Boundary Conditions:**
  1.  **Positive Case:** Anthropocene stratigraphy requiring a "global synchronous signal," inherently favoring industrial markers over colonial agricultural ones, deciding the "who" and "when" before historical evidence is weighed.
  2.  **Negative Case (Physical Limit):** Rejecting a claim because evidence physically cannot exist (e.g., demanding ice cores for the Precambrian). This is a material constraint, not a disciplinary preference.
  3.  **Negative Case (Individual Bias):** A researcher consciously ignoring data due to personal belief. Preemption is structural; the rule itself embodies the bias, regardless of the practitioner's intent.
  4.  **Negative Case (Measurement Error):** Ordinary uncertainty. Preemption occurs when the *type* of evidence is disqualified, not when the *quality* is insufficient.

  This concept isolates the mechanism where neutrality is claimed via procedure, while the procedure itself encodes a specific worldview. It distinguishes genuine material limits from disciplinary preferences that masquerade as objective standards.
