answer: |-
  I assign a credence of 0.35 that the necessity-of-origin claim is strictly true of persons.

  The decomposition rests on four load-bearing sub-questions, each assigning a probability to the condition required for the claim to hold. First, regarding whether there is a determinate fact of the matter over and above linguistic convention, I assign a probability of 0.45. If identity across possible worlds is merely a feature of how we count people rather than a mind-independent metaphysical reality, the claim cannot be strictly true in the robust sense required; the distributed systems analogy suggests identity is stipulated by protocol, not discovered in nature, which lowers confidence in a brute fact here.

  Second, on whether origins are essential absolutely or within some tolerance, I assign a probability of 0.30 to the absolute view. If we alter the alternative egg by a single base pair, biological continuity suggests the resulting person is still you, yet strict necessity demands a sharp boundary where none seems to exist; this Sorites-style vulnerability implies that if origins are essential, they are so only within a tolerance, which undermines the strict claim that a *different* egg yields a *different* person. Third, concerning whether a counterpart-theoretic treatment is the right account, I assign a probability of 0.50 to its correctness. If 'could have' reduces to similarity comparisons with nearby possible people rather than strict transworld identity, the necessity claim becomes false by definition, as the counterpart is not literally you, merely close enough to bear your name in that world.

  Fourth, on whether the reported intuition is about identity or something weaker, I assign a probability of 0.40 that it is about strict identity. It is highly plausible that when people insist they could not have had different parents, they are tracking psychological continuity or qualitative similarity rather than numerical identity; if the intuition targets a weaker relation, it does not support the metaphysical necessity of origin. These probabilities combine multiplicatively to suppress the final credence: even granting a fact of the matter, the tolerance problem and the viability of counterpart theory severely restrict the space in which the strict claim survives. I am left with a minority confidence that the thesis holds as stated, though I acknowledge it functions well as a heuristic.

  The term I trust least is 'identity', specifically across possible worlds. My credence would move significantly towards 1.0 if you could demonstrate a non-arbitrary boundary in genetic space that distinguishes one haecceity from another without invoking semantic stipulation.
