prompt: |-
  I'm a novelist, and each autumn I run a two-hour workshop for twelve writers on what a story feels like from inside a head that doesn't know what it knows. This year I want the session built around a decision problem — the one about the absent-minded driver — which I'll state in full, so that nothing beyond it is needed.

  A driver is heading home along a road with two exits in succession. Turning off at the first pays 0; turning off at the second, his own street, pays 4; driving past both to the end of the road pays 1. He is absent-minded: when he arrives at an exit he cannot tell whether it is the first or the second, nor whether he has already passed one. Before setting out he can adopt a policy — continue at any exit with probability q — and the best policy in advance is q = 2/3. Yet once he is at an exit, reasoning only from the fact that he is at an exit, the arithmetic appears to tell him to turn off, though turning off at every exit he ever came to would leave him with nothing.

  Design the workshop around this: something the twelve of us physically play over many rounds, with a payoff scheme that needs no real money, in which we commit to policies, are then put in the seat with nothing more informative than "you are at an exit," and run into the collision ourselves before anyone names it. I need the materials; the exact mechanism for reproducing his ignorance at the exit and for settling what he is entitled to believe once he is there; a running order for the two hours; and a debrief that maps particular moments onto the trouble, including — for novelists — what a narrator can and cannot do with a character in that seat. Then tell me what will predictably break the first time I run it and how to recover, and be plain about which feature of the problem no tabletop version can produce and I will have to argue for in prose.

  Give me one design, chosen and defended: your decisions and your reasons for them, not a menu of variants with the picking left to me.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **User:** Novelist running a 2-hour workshop for 12 writers.
      *   **Topic:** The "Absent-Minded Driver" paradox (Piccione & Lipman, 1997).
      *   **Core Problem:** A driver faces two exits. Exit 1 payoff = 0. Exit 2 payoff = 4. Continue past both payoff = 1. Driver can't distinguish exits. Ex-ante optimal policy: Continue with probability $q=2/3$ (Expected Payoff $\approx 1.33$). At the exit (ex-interim), reasoning suggests deviating (turning off), leading to a payoff of 0 if followed consistently.
      *   **Requirements:**
          *   Physical gameplay for 12 people over multiple rounds.
          *   No real money payoff scheme.
          *   Mechanism to reproduce the driver's ignorance (indistinguishable exits).
          *   Mechanism to settle what the driver is entitled to believe.
          *   Running order (2 hours).
          *   Debrief mapping moments to the paradox + narrator/character implications.
          *   Prediction of failure points + recovery strategies.
          *   Identification of the un-reproducible feature (what must be argued in prose).
          *   **Constraint:** One design, chosen and defended (no menus).

  2.  **Deconstruct the Paradox for Gameplay:**
      *   *The Crux:* The tension between *planning self* (ex-ante) and *acting self* (ex-interim). The acting self lacks the information the planning self had (position in sequence).
      *   *The Ignorance:* Players must not know if they are at Exit 1 or Exit 2.
      *   *The Payoff:* Needs to be tangible but not monetary (points, tokens, narrative capital).
      *   *The Collision:* Players need to experience the urge to deviate from the plan when "in the moment."

  3.  **Designing the Mechanism:**
      *   *How to hide the exit number?* Blindfolds? Screens? Randomized assignment?
      *   *Best approach:* The "Correlated Ignorance" method. The facilitator controls the board. The player is the driver. The other 11 writers are observers/narrators? No, 12 writers need to *play*.
      *   *Revised approach:* 12 players, but they can't all drive simultaneously if the ignorance is to be maintained individually.
      *   *Solution:* Divide into 4 groups of 3. One Driver, one "Memory Wiper" (Facilitator role within group), one "Scorekeeper". Rotate roles.
      *   *Wait, 2 hours is short.* 12 people playing simultaneously is better for energy.
      *   *Better Solution:* All 12 are Drivers. The "Road" is abstract. They write down policies. Then they are presented with "Exit Scenarios."
      *   *The Ignorance Mechanism:* The "Envelope Method."
          *   Each player prepares a policy card ($q$).
          *   The Facilitator runs the simulation.
          *   To simulate the *feeling* of being at an exit without knowing which one, we need to put them in a state where the *decision* matters but the *context* is stripped.
      *   *Actually, the prompt asks for "something the twelve of us physically play."*
      *   *Idea:* The "Human Road."
      *   *Setup:* Two physical stations (Exit 1, Exit 2). They look identical.
      *   *Process:* A player starts. A coin flip determines if they stop at Exit 1 or proceed to Exit 2 based on their policy $q$.
      *   *Problem:* If they stop at Exit 1, they know it was Exit 1. If they reach Exit 2, they know it was Exit 2. This breaks the "absent-minded" condition *after* the fact, but during the decision, they don't know.
      *   *Refining the Ignorance:* The player must make the decision *before* knowing if it's Exit 1 or 2, but the payoff depends on which it is.
      *   *The "Amnesia" Trick:* The player commits to a probability $q$. Then, they are blindfolded. They are led to *an* exit. They are told "You are at an exit." They must Decide (Turn or Go). *Then* the blindfold comes off, and they are told which exit it was (to calculate payoff).
      *   *But wait,* in the paradox, the driver uses the *same* policy at both exits because they can't distinguish them.
      *   *Workshop Flow:*
          1.  **Planning Phase:** Set $q$.
          2.  **Execution Phase:** The game engine (Facilitator + Dice) determines where they land.
          3.  **The Twist:** To make them *feel* the interim rationality, we need to interrupt the plan.
      *   *Let's try a "Dual-Self" mechanic.*
      *   *Grouping:* 6 pairs. Pair A = Planner, Pair B = Driver. No, that separates the selves too much.
      *   *Best Physical Metaphor:* The "Correlated Randomization" using cards.
      *   *Mechanism:*
          *   Each writer gets a "Policy Deck" (3 cards: 2 "GO", 1 "TURN" represents $q=2/3$).
          *   They shuffle.
          *   They walk a path. Two identical boxes labeled "EXIT".
          *   They draw a card at *each* box.
          *   *Crucial:* They must not know which box is which.
          *   *Implementation:* The boxes are covered. A facilitator guides them. Or, simpler: The "Exit" is a piece of paper handed to them.
          *   *Wait, the prompt wants them to "run into the collision ourselves."* This implies they should feel the urge to deviate.
          *   *How to induce deviation?* Offer them a chance to rethink $q$ *mid-game* without telling them which exit they are at.
          *   *The "Hot Seat" Mechanism:*
              1.  Commit to $q$ (write it down).
              2.  Facilitator simulates the drive (dice roll based on $q$).
              3.  *Intervention:* Stop the simulation. Tell the player: "You are at an exit. Your policy says GO with prob $q$. Do you want to change your mind *right now*?"
              4.  This forces the ex-interim calculation.

      *   *Refining the Payoff:* Use "Story Points" or "Ink Tokens."
      *   *Refining the Ignorance:* The player must not know if this is the first time they are being asked or the second.
      *   *Solution:* Run multiple rounds. In some rounds, they are stopped at Exit 1. In some, Exit 2. In some, they pass both. They don't know *which* round corresponds to which exit state until the reveal.
      *   *Actually, the paradox relies on self-locating belief.* "Given I am at an exit, what is the prob I am at Exit 1?"
      *   *Workshop Design Choice:* **The "Blind Corridor" Protocol.**
      *   *Why:* It physically enforces the indistinguishability.
      *   *Materials:* Identical envelopes, tokens, a central "Road" board (hidden from players).

  4.  **Drafting the Design (Iterative Process):**

      *   *Decision:* I will design a **"Split-Self Ledger"** system.
      *   *Reasoning:* The paradox is about the conflict between the *Planner* (ex-ante) and the *Agent* (ex-interim). To make 12 people feel this, they need to record the Plan, then be put in a situation where they act as the Agent without access to the Plan's context.
      *   *Mechanism:*
          1.  **The Contract:** Writers write a policy $q$ (e.g., "Roll 1-4 Go, 5-6 Turn").
          2.  **The Drive:** The Facilitator runs the road for them using dice.
          3.  **The Interruption (The Key):** When the dice indicate they are at an exit, the Facilitator stops and asks, "You are at an exit. Your contract says GO. Do you *actually* want to GO?"
          4.  **The Ignorance:** They are not told if it's Exit 1 or 2. They are only told "You are at an exit."
          5.  **The Payoff:** Calculated at the end based on the *actual* exit reached vs. the *action* taken.
      *   *Wait, if I ask them, they break the randomization.*
      *   *Correction:* The paradox arises because the *reasoning* changes. The workshop needs to show that if they listen to the reasoning at the exit, they lose.
      *   *Revised Mechanism:* **The "Amnesiac Round."**
          *   Round 1: Plan $q$. Execute fully. (Establishes baseline).
          *   Round 2: Plan $q$. Execute. *Stop* at the first exit encountered. Ask: "Knowing only that you are at an exit, do you stick to $q$ or switch?"
          *   If they switch to "Turn", they get 0 (if Exit 1) or 4 (if Exit 2). But if they always switch, they train themselves to Turn at Exit 1 next time.
          *   *Better:* Make the payoff immediate but ambiguous.
      *   *Let's settle on:* **The "Sealed Exit" Protocol.**
      *   Players commit to a policy ($q$).
      *   They enter a "simulation" (Facilitator rolls dice).
      *   If an exit is reached, they are handed an identical envelope labeled "DECISION POINT."
      *   Inside is a prompt: "You are at an exit. Your policy says X. Do you override?"
      *   They decide.
      *   Payoff revealed at end of session.
      *   *Why this design:* It isolates the information set. The envelope is the physical manifestation of the information set {Exit 1, Exit 2}.

  5.  **Addressing the "Un-reproducible Feature":**
      *   Tabletop games have perfect recall of *rules*. The paradox requires *imperfect recall of position*.
      *   In a game, I know I'm playing a game. I know the Facilitator knows.
      *   The un-reproducible feature is **ontological uncertainty**. In the thought experiment, the driver *actually* forgets. In the workshop, the writer *pretends* to forget while knowing the Facilitator is tracking it. The "belief" is simulated, not genuine. I must argue that the *narrator* must enforce the forgetting, not the character.

  6.  **Addressing Failure Points:**
      *   *Failure 1:* Players try to count rounds ("This must be Exit 2 because we didn't stop earlier").
      *   *Recovery:* Randomize the start. Or run multiple independent "Drives" simultaneously so round-counting doesn't work.
      *   *Failure 2:* Players treat points as money and optimize greedily, missing the philosophical point.
      *   *Recovery:* Debrief focuses on the *feeling* of rationality, not the score.
      *   *Failure 3:* Confusion over probability $q$.
      *   *Recovery:* Pre-printed policy cards (e.g., Deck of 3 cards: 2 Go, 1 Turn).

  7.  **Structuring the 2 Hours:**
      *   0:00-0:15: Intro & The Setup (The Road).
      *   0:15-0:45: Round 1 (The Plan).
      *   0:45-1:15: Round 2 (The Interruption/Deviation).
      *   1:15-1:45: The Reveal & Scoring.
      *   1:45-2:00: Debrief (Narrative implications).

  8.  **Refining the Payoff (No Money):**
      *   Use "Narrative Authority Tokens."
      *   Winner gets to assign a prompt to the group next time? Or simply "Bragging Rights" + a specific physical token (e.g., a golden pen cap).
      *   *Better:* "Ink." Write a sentence for every point. 4 points = 4 sentences of a story you *want* to write. 0 points = 4 sentences of a prompt you *hate*.
      *   *Decision:* **"The Draft" Currency.** Points = Lines of text you can claim from a communal "Pool of Prompts" (good ones) vs. "Pool of Clichés" (bad ones). High score picks first from Good Pool. Low score must write from Bad Pool. This makes the payoff literary.

  9.  **Finalizing the Design Choice:**
      *   I need to be decisive.
      *   **Design:** "The Blind Ledger."
      *   **Mechanism:** Players write a policy. Facilitator runs the road using dice. When an exit is hit, the player is handed a generic card ("EXIT"). They must choose Turn/Go. They are not told which exit. Payoffs are tallied secretly by Facilitator and revealed at the end.
      *   **Why:** It forces the information asymmetry. The Facilitator holds the "God view" (Narrator), the Player holds the "Limited view" (Character).

  10. **Writing the Response:**
      *   *Tone:* Professional, authoritative, tailored to a novelist (focus on narrative, perspective, agency).
      *   *Structure:*
          1.  Design Choice & Defense.
          2.  Materials List.
          3.  Mechanism (Ignorance & Belief).
          4.  Running Order (2 Hours).
          5.  Debrief (Mapping to Paradox & Narration).
          6.  Predictable Breaks & Recovery.
          7.  The Un-reproducible Feature.

      *(Self-Correction during drafting)*: Make sure the math is clear. If $q=2/3$, Expected Payoff = $1/3(0) + 2/3(1/3(4) + 2/3(1)) = 2/9(4) + 4/9(1) = 8/9 + 4/9 = 12/9 = 1.33$. If Turn always ($q=0$), Payoff = 0. If Go always ($q=1$), Payoff = 1.
      At the exit: If I assume I'm at Exit 1 with prob $r$, and Exit 2 with prob $1-r$.
      Piccione & Lipman argue the ex-interim belief changes.
      For the workshop, I don't need to solve the math, I need them to *feel* the temptation to Turn (because 4 > 1, and 0 is past).
      Actually, the temptation is: "If I'm at Exit 2, I should Turn (4 vs 1). If I'm at Exit 1, I should Go (0 vs 4 later). But I don't know where I am."
      The paradox is that the calculation *at the exit* suggests a different $q$ than the calculation *at the start*.
      I will simplify the gameplay to focus on the *urge to deviate*.

      *Refining the "Break":* The biggest break is players colluding or counting. I need to ensure the "Road" is opaque.
      *Refining the "Un-reproducible":* It's the *genuine* loss of self-location. In the game, they know they are in a workshop. The "forgetting" is a rule, not a state of mind. The novelist must argue that *prose* can induce genuine disorientation in a reader that a game rule cannot.

      *Let's polish the Payoff:* "Ink Tokens" is good. High score gets to choose the writing prompt for the next meeting. Low score has to write the first draft of the cleanup report. No, keep it literary. High score gets "First Pick" of a list of evocative opening lines. Low score gets "Last Pick" (clichés).

      *Wait, one more check on the "Decision Problem":* The prompt says "reasoning only from the fact that he is at an exit, the arithmetic appears to tell him to turn off."
      Why? Because if he thinks there's a significant chance he's at Exit 2, 4 is very attractive compared to 1.
      I need to make sure the workshop highlights this *arithmetic temptation*.
      I will add a "Calculation Sheet" to the materials.

      *Final Plan:*
      1.  **Design:** "The Opaque Road Protocol."
      2.  **Defense:** Maximizes information asymmetry between Facilitator (Narrator) and Player (Character).
      3.  **Materials:** Envelopes, Dice, Policy Cards, Score Sheets.
      4.  **Order:** Plan -> Drive -> Interrupt -> Reveal -> Debrief.
      5.  **Debrief:** Connect "Policy" to "Character Arc" and "Exit" to "Scene."
      6.  **Breaks:** Meta-gaming (counting rounds).
      7.  **Un-reproducible:** Genuine ontological confusion vs. simulated rule-bound ignorance.

      *Wait, 12 writers.* I can't run 12 individual drives in 2 hours if each takes 10 mins.
      *Correction:* I need parallel play.
      *Solution:* 4 Groups of 3. One Facilitator per group (rotate).
      *No, that dilutes my control.*
      *Better:* I am the Facilitator. The 12 writers are Drivers. I run the "Road" centrally.
      *How?* I project the "Road" status? No, that reveals info.
      *Best:* I walk around with a "Road Deck." Each player gets a hand of "Exit Cards."
      *Actually, simplest:* **The "Sealed Envelope" Mass Play.**
      Everyone writes policy. I flip coins for everyone simultaneously.
      If Coin 1 = Heads (Exit 1 reached), they get Envelope A.
      If Coin 1 = Tails, Coin 2 = Heads (Exit 2 reached), they get Envelope A.
      If Coin 1 = Tails, Coin 2 = Tails (End reached), they get Envelope B (No decision).
      *Crucial:* Envelope A is identical for Exit 1 and Exit 2.
      This allows 12 people to play at once.
      *Yes, this is the scalable solution.*

      *Let's finalize the Payoff:* "Narrative Capital." Points translate to words of feedback or something? No, keep it simple. Points = "Draft Passes." 4 points = You can skip one critique round next workshop. 0 points = You must read first.
      *Actually, let's keep it intrinsic.* "The Score is your Story Length." 4 points = You write 4 pages. 0 points = You write 0 pages (you lost the story).
      *No, the prompt says "payoff scheme that needs no real money."*
      *Idea:* **The "Ending" Lottery.**
      There are 3 endings to a sample story provided.
      Exit 1 (0 pts) = Bad Ending.
      Exit 2 (4 pts) = Best Ending.
      End of Road (1 pt) = Okay Ending.
      Players collect "Endings." The goal is to collect the Best Ending.
      *This works.* It's tangible, literary, and zero-cost.

      *Okay, ready to write.*
answer: |-
  # Workshop Design: The Opaque Road Protocol

  ## 1. Design Choice and Defense
  **The Design:** A mass-simultaneous "Sealed Envelope" drive, where you (the facilitator) act as the only entity with "God View" (the Narrator), while the twelve writers (the Drivers) operate under enforced information asymmetry using identical physical tokens for distinct narrative locations.

  **Defense:**
  You need twelve writers to feel the specific claustrophobia of the absent-minded driver: the tension between a rational plan made in safety and a rational deviation made in ignorance.
  *   **Why not small groups?** Small groups require you to split your attention, breaking the immersion. If you are not the sole arbiter of the "Road," the players will compare notes and break the ignorance.
  *   **Why Sealed Envelopes?** This is the only way to physically instantiate the information set {Exit 1, Exit 2}. If the exits look different, the ignorance is broken. If the players move physically down a room, they can count steps. The Envelope abstracts the location into pure information: "You are at an exit."
  *   **Why Mass-Simultaneous?** It prevents players from meta-gaming off each other's results ("Sarah turned, so this must be Exit 2"). Everyone drives in parallel isolation.
  *   **Why "The Ending Lottery" for Payoff?** Money trivializes the paradox into gambling. Literary endings make the payoff about *narrative satisfaction*. It aligns the game mechanics with their profession.

  ## 2. Materials
  Prepare these items beforehand. Nothing digital; everything must be tactile to ground the abstraction.

  1.  **The Road Deck (For You):** 12 sets of 2 coins (or a 4-sided die per player).
  2.  **Policy Cards (12):** Index cards where writers write their $q$ (e.g., "GO on 1-4, TURN on 5-6").
  3.  **Decision Envelopes (24):** 24 identical white envelopes.
      *   **Content:** Inside every envelope is a single slip of paper reading: **"YOU ARE AT AN EXIT. Your Policy says: [GO/TURN]. Do you OBEY or OVERRIDE?"** with checkboxes.
      *   *Note:* Do not label these Exit 1 or Exit 2.
  4.  **Termination Slips (12):** Slips reading **"ROAD ENDED. No Exit Reached."**
  5.  **The Payoff Menu (Projected or Handout):**
      *   **0 Points:** "The Tragic Ending" (A paragraph of cliché melodrama they must read aloud).
      *   **1 Point:** "The Open Ending" (A vague, unresolved paragraph).
      *   **4 Points:** "The Resonant Ending" (A beautifully crafted paragraph they get to keep as a prompt).
  6.  **Calculation Sheets (12):** Paper with the expected value arithmetic pre-printed, leaving blanks for them to fill in during the debrief.

  ## 3. Mechanism: Reproducing Ignorance and Belief
  **The Ignorance:**
  You will simulate the road for each player privately using your coins/dice, but the *output* to the player is standardized.
  *   **Exit 1 Logic:** If Coin 1 = Heads, the driver reaches Exit 1. You hand them a **Decision Envelope**.
  *   **Exit 2 Logic:** If Coin 1 = Tails AND Coin 2 = Heads, the driver reaches Exit 2. You hand them a **Decision Envelope**.
  *   **End Logic:** If Coin 1 = Tails AND Coin 2 = Tails, the driver passes both. You hand them a **Termination Slip**.

  **Crucially:** The Decision Envelope for Exit 1 is *physically indistinguishable* from the Decision Envelope for Exit 2. The player holds the envelope. They know they are at *an* exit. They do not know *which*. This reproduces the driver's information set.

  **The Belief Settlement:**
  When they open the envelope, they are asked to check "OBEY" or "OVERRIDE."
  *   If they check "OVERRIDE," they are effectively setting a new $q=0$ (Turn) for this specific instance.
  *   You (the Facilitator) record their choice.
  *   **Settling Entitlement:** In the debrief, you establish that they were *entitled* to believe they were at an exit, but *not entitled* to know which one. Any belief about position is speculation, not knowledge. The payoff is calculated based on the *actual* location (which you hold secret until the end), not their belief.

  ## 4. Running Order (120 Minutes)

  **0:00 – 0:15: The Setup (The Planning Self)**
  *   Distribute Policy Cards.
  *   State the Payoff Menu (0, 1, 4).
  *   Explain the Road: Two exits. Indistinguishable.
  *   **Task:** Each writer sets a policy $q$. (e.g., "I will roll a die; on 1-4 I Go, on 5-6 I Turn"). They write this on the card.
  *   **Constraint:** They must seal this card in an envelope labeled "PLAN." They cannot look at it again until the end. This separates the *Planner* from the *Agent*.

  **0:15 – 0:45: The Drive (The Acting Self)**
  *   Collect the Policy Cards. You now hold their "conscience."
  *   Tell them: "I am now driving your car. You are asleep in the passenger seat. I will wake you only if we reach an exit."
  *   You move around the room. For each writer, flip your coins.
      *   If Exit 1: Wake them. Hand them a **Decision Envelope**.
      *   If Exit 2: Wake them. Hand them a **Decision Envelope**.
      *   If End: Wake them. Hand them a **Termination Slip**.
  *   **The Collision:** When they open the Decision Envelope, they see: "Your Policy says GO." (You pre-fill these based on their card to ensure most say GO, assuming optimal $q=2/3$).
  *   **The Choice:** They must check OBEY or OVERRIDE.
  *   *Note:* If they OVERRIDE to TURN, they leave the road immediately. If they OBEY (GO), and it was Exit 1, you immediately wake them again for Exit 2 (hand them a second Decision Envelope).
  *   *Silence:* No talking allowed during the Drive.

  **0:45 – 1:15: The Reveal (The Collision)**
  *   Collect all Decision Slips.
  *   Reveal the "Road Map" for each player (e.g., "Player 3: Exit 1 -> Go, Exit 2 -> Turn").
  *   Calculate Payoffs based on the *actual* exit and the *actual* action.
      *   Turn at Exit 1 = 0.
      *   Turn at Exit 2 = 4.
      *   Go past Exit 2 = 1.
  *   Distribute the Payoff Menu paragraphs accordingly. Have them read their endings aloud. The dissonance will be audible (some reading "Resonant," some reading "Tragic").

  **1:15 – 1:45: The Debrief (Mapping the Trouble)**
  *   **The Math:** Walk through the arithmetic on the Calculation Sheet.
      *   *Ex-Ante:* Why was $q=2/3$ optimal? (Maximizes average return).
      *   *Ex-Interim:* Why did they want to OVERRIDE? (At the exit, 4 looks better than 1, and 0 is "already lost").
  *   **The Narrative Map:**
      *   **The Plan = The Outline.** What the writer intends for the character arc.
      *   **The Exit = The Scene.** Where the character actually has to act.
      *   **The Ignorance = Limited POV.** The character doesn't know which act they are in.
      *   **The Override = Voice Drift.** When the character makes a choice that breaks the outline because it feels "true" in the moment, even if it ruins the plot.
  *   **Discussion:** "When you checked OVERRIDE, did you feel irrational? Or did you feel *more* rational than your Plan?"

  **1:45 – 2:00: Narrator Implications**
  *   Ask: "As novelists, you are the Facilitator (you know the Exit number) and the Driver (you feel the ignorance). How do you write a character who is absent-minded without making them stupid?"
  *   **Key Takeaway:** The character must be rational *given their information*, even if that rationality leads to a suboptimal outcome. The tragedy isn't error; it's structural ignorance.

  ## 5. Predictable Breaks and Recovery

  **Break 1: The Counter-Meta Game**
  *   **Problem:** A writer realizes, "If I get an envelope, it's 50/50 Exit 1 or 2. But if I get a *second* envelope, I *must* be at Exit 2." They will OVERRIDE on the second envelope.
  *   **Recovery:** Acknowledge this immediately. "You have discovered 'Updating.' In the paradox, the driver cannot count exits because they forget they passed one. In this room, you have memory. To fix this, imagine the second envelope feels exactly like the first. You are not allowed to use 'round count' as data. You must act as if this could be the first time."
  *   **Prevention:** Instruct them at the start: "You are forbidden from using the sequence of events as data. Treat every envelope as the first envelope you have ever received."

  **Break 2: The "God View" Resentment**
  *   **Problem:** Players feel cheated because *you* know the outcome and they don't. They feel the game is rigged.
  *   **Recovery:** Reframe this as the **Narrator's Burden**. "I am not your opponent; I am the Reality of the Story. You are the Character. The resentment you feel is the exact feeling of a character trapped by plot. Lean into that frustration during the debrief."

  **Break 3: Policy Confusion**
  *   **Problem:** Writers struggle to set a probability $q$. They want to say "I'll decide when I get there."
  *   **Recovery:** Enforce the "Sealed Plan." "You cannot decide when you get there, because 'there' is indistinguishable from 'here.' You must decide *now* what you will do *then*. If you refuse to set $q$, you are assigned $q=0.5$."

  ## 6. The Un-reproducible Feature
  **The Feature:** **Genuine Ontological Uncertainty.**

  **The Limit:**
  In this workshop, the writers *know* they are in a workshop. They know *you* know the exit number. Their ignorance is **simulated** by rules. In the actual paradox (and in deep POV narration), the ignorance is **constitutive**. The driver *actually* does not know. The character *actually* cannot access the narrator's knowledge.

  **What You Must Argue in Prose:**
  You cannot game-mechanic your way into true absent-mindedness. A reader knows they are reading a book. To reproduce the paradox in a novel, you cannot just hide information (that's a mystery); you must degrade the *narrative capacity for location*.
  *   **The Argument:** You must tell your writers: "The tabletop game fails because the players retain a 'meta-self' that remembers the rules. In your prose, you must dissolve the meta-self. You do this not by hiding the exit signs, but by blurring the passage of time and the distinctiveness of memory. The character shouldn't just not know *which* exit; they should struggle to recall *why* they are driving. The paradox isn't about geography; it's about the continuity of consciousness."

  **Closing Instruction:**
  "Your job is not to build a road with hidden signs. Your job is to write a mind that cannot hold a map."
