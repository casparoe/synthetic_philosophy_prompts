answer: |-
  ### Design Justification

  I considered three structural approaches for this activity. The first was a pure logic puzzle where students were given truth values directly (e.g., "You believe P is true"). I rejected this because it reduces the exercise to a calculation, bypassing the epistemic uncertainty that drives real-world disagreement. The second was a policy preference scenario (e.g., "Should we fund the project?"). I rejected this because it conflates the doctrinal paradox with preference aggregation; students would argue values rather than facts, obscuring the logical inconsistency.

  I have chosen an adjudicative fact-finding frame. This isolates the problem to *judgment aggregation* rather than *preference aggregation*. The hardest constraint is seeding sincere disagreement without scripting beliefs. To achieve this, I designed the private inserts to contain *ambiguous evidence* rather than contradictory instructions. For example, a timesheet with a smudge or an email with ambiguous phrasing allows a reasonable person to lean either way. This ensures that when a student votes "No" on a premise, they are expressing a genuine interpretation of evidence, not following a hidden rule.

  Finally, regarding the incentive structure, I evaluated your "reason-coherence score" idea. Peer scoring risks collusion or social pressure to conform. Instead, I implemented a "Logical Audit" mechanism where the instructor randomly checks for consistency between recorded premises and the final verdict. This preserves sincerity because the penalty for inconsistency is procedural (a "Remand" status) rather than substantive (a grade penalty for a specific outcome). It forces panels to confront their own logical structure without telling them which outcome is "correct."

  ***

  ### Logistics and Seating

  You have 24 students and 6 round tables. You need 8 panels of 3 students.
  *   **Configuration:** Designate 2 tables as "Double Tables" (6 students each, hosting 2 panels). Designate 4 tables as "Single Tables" (3 students each, hosting 1 panel).
  *   **Materials:** Prepare 8 envelopes per table type.
      *   **Divergent Envelopes (6 panels):** Contain Insert A, Insert B, and Insert C.
      *   **Control Envelopes (2 panels):** Contain three copies of Insert D (Control).
  *   **Roles:** In each panel, students self-select or count off to be: **Chair** (manages voting), **Clerk** (records votes), **Member**.

  ***

  ### Timeline (90 Minutes)

  *   **00:00 – 00:10 (Arrival & Setup):** Students enter, sit at assigned tables. Distribute envelopes. Do not open yet.
  *   **00:10 – 00:15 (Instructions):** Read the "Panel Instructions" aloud. Emphasize: "Vote your sincere belief based on the evidence. Do not compromise your factual findings to reach a verdict."
  *   **00:15 – 00:35 (Round 1):** Panels open envelopes, read Shared Dossier (5 mins), read Private Inserts (5 mins), deliberate (5 mins), vote secretly on Tally Sheet (5 mins).
  *   **00:35 – 00:45 (Audit & Justification):** Panels complete the Justification Form. Instructor collects Tally Sheets for Logical Audit.
  *   **00:45 – 00:55 (Round 2 - The Twist):** Distribute "Confidential Directive" cards to specific seats in Divergent Panels only. Chairs receive "Agenda Instruction" cards. Re-vote.
  *   **00:55 – 01:05 (Data Collection):** Collect all materials. Write aggregate results on the whiteboard (Premise Majorities vs. Verdict Majorities).
  *   **01:05 – 01:30 (Debrief):** Reveal the concept, map the experience to theory, discuss implications.

  ***

  ### Printable Texts

  #### 1. Panel Instructions (Read Aloud by Instructor)
  You are the Contractor Integrity Panel. Your job is to apply the City Charter to the evidence provided. You have a Shared Dossier that everyone reads, and a Private Insert that only you read. Do not show your Private Insert to others; describe its contents if asked.

  You must make three factual findings (P, Q, R). Based on those findings, you must reach a Verdict (Debar or No Debar).
  1.  **Sincerity:** Vote for what you genuinely believe the evidence shows. Do not vote for a finding just to make the Verdict come out a certain way.
  2.  **Secrecy:** Cast your votes on the Tally Sheet privately.
  3.  **Consistency:** Your Verdict must follow logically from your Findings according to the Charter.

  #### 2. City Charter (One Page)
  **CONTRACTOR INTEGRITY PANEL CHARTER**
  **Section 1: Authority.** The Panel may debar a firm from municipal bidding for a period of three years.
  **Section 2: Grounds for Debarment.** Debarment is mandatory if and only if the Panel makes affirmative findings on all three of the following premises:
  *   **(P) Accuracy:** The firm's certified payroll understated hours worked on the Riverside Culvert Project.
  *   **(Q) Intent:** The understatement was made knowingly, rather than arising from clerical error.
  *   **(R) Materiality:** The understatement was material, meaning correcting it would have changed whether the firm met the contract's local-hiring threshold.
  **Section 3: Procedure.** The Panel shall vote on Premises P, Q, and R in that order. If any Premise fails to receive a majority affirmative vote, the Panel may stop proceedings or continue for the record. The Verdict is determined by applying the Charter rules to the recorded Findings.

  #### 3. Shared Dossier (All Panels)
  **CASE FILE: RIVERSIDE CULVERT PROJECT**
  **Respondent:** Apex Concrete LLC.
  **Complainant:** Marcus Thorne (Applicant for local-hire position).
  **Background:** Apex won a contract requiring 40% of labor hours to be performed by city residents. Thorne alleges he was rejected because Apex falsely claimed to meet this threshold.
  **The Discrepancy:** Apex certified 1,000 total hours. 400 were marked as "Local." Thorne claims 100 of those "Local" hours were actually worked by non-residents, and the hours were understated on daily logs to hide the discrepancy.
  **Stakes:** If debarred, Apex cannot bid on the new School Annex project. Thorne seeks restitution. The City needs Apex for the Annex due to their specialized equipment.

  #### 4. Private Inserts (Divergent Panels)
  *Print on different colored paper. Distribute one of each per panel.*

  **INSERT A (The Timesheets)**
  You have the raw daily timesheets. They show 100 hours logged to "Non-Resident" workers that were later re-classified as "Resident" on the final certified payroll. However, the handwriting on the re-classification matches the project foreman, not the payroll clerk. There is no signature from the workers confirming their residency status.
  *Likely Interpretation:* Strong evidence for **P (Accuracy)**. Ambiguous on **Q (Intent)** (could be foreman error). Strong evidence against **R (Materiality)** (the math on the threshold is tight; these 100 hours might not have changed the percentage enough to fail the contract).

  **INSERT B (The Email)**
  You have an internal email from the Apex Project Manager to the Payroll Clerk: "Make sure the local-hire numbers hit 40% or we lose the bonus. Adjust the logs if you have to." The date is *after* the work was completed but *before* certification. The Clerk replied: "Understood."
  *Likely Interpretation:* Strong evidence for **P (Accuracy)**. Strong evidence for **Q (Intent)**. Weak on **R (Materiality)** (Email doesn't discuss the threshold math).

  **INSERT C (The Threshold Math)**
  You have the contract arithmetic. Total hours: 1,000. Required Local: 400. Certified Local: 400. Disputed Hours: 100. If the 100 disputed hours are removed from "Local," the total Local drops to 300 (30%). However, the contract allows a 5% grace clause for "unforeseen labor shortages." Apex claims this clause applies. The City legal opinion on the clause is conflicting.
  *Likely Interpretation:* Ambiguous on **P (Accuracy)** (depends on if the 100 hours were truly non-local). Ambiguous on **Q (Intent)**. Strong evidence for **R (Materiality)** (30% is clearly below 40%, unless the grace clause applies, which is disputed).

  #### 5. Private Insert (Control Panels)
  *Print 3 copies per panel.*

  **INSERT D (Control)**
  You have a signed affidavit from the Payroll Clerk admitting: "I moved 100 hours from Non-Resident to Resident to meet the 40% threshold. I knew this was false. Without these hours, the firm was at 30%."
  *Likely Interpretation:* Clear **Yes** on P, Q, and R.

  #### 6. Tally Sheet (Per Panel)
  **PANEL VOTE RECORD**
  *Circle Yes or No for each member. Do not discuss votes.*

  | Member | P (Accuracy) | Q (Intent) | R (Materiality) | Verdict (Debar?) |
  | :--- | :---: | :---: | :---: | :---: |
  | 1 | Yes / No | Yes / No | Yes / No | Yes / No |
  | 2 | Yes / No | Yes / No | Yes / No | Yes / No |
  | 3 | Yes / No | Yes / No | Yes / No | Yes / No |
  | **Majority** | **___** | **___** | **___** | **___** |

  #### 7. Justification Form (Per Panel)
  **PANEL JUSTIFICATION**
  Based on the Majority Findings above, our Verdict is: _______________
  Because the Charter states: (Check one)
  [ ] All three premises were found True.
  [ ] At least one premise was found False.
  *Signature of Chair:* ___________________

  #### 8. Round 2 Confidential Directives (Divergent Panels Only)
  *Hand to specific students after Round 1 results are in.*

  **To Member 2 (The Strategist):**
  *Confidential:* You personally believe the firm should **NOT** be debarred (perhaps due to the School Project stakes). Looking at the Round 1 votes, you see the Majority is leaning toward Debarment because the Premises are adding up to "Yes." You believe Premise R is actually False based on your evidence, but if you vote your sincere belief, the group will Debar. If you vote R=Yes (insincerely), the logic might shift. You are not instructed to lie, but you have the power to change the outcome by altering your premise vote.

  **To The Chair (Agenda Control):**
  *Confidential:* In Round 2, if Premise P receives a Majority "No," you must declare the case closed and do not vote on Q or R. If Premise P receives a Majority "Yes," you must proceed to vote on Q and R. Record this decision on the Tally Sheet.

  ***

  ### Troubleshooting Guide

  **1. A panel reaches consensus through discussion and destroys the profile.**
  *   *Prediction:* They share their inserts and agree "Okay, we all think P is Yes."
  *   *Response:* During the activity, circulate and remind them: "The Charter requires a secret ballot on findings. You may discuss, but you must record your own interpretation of the evidence." In the debrief, use this as a teaching point: "Deliberation can dissolve the paradox by aligning beliefs, but that requires time and trust. What if you can't agree?"

  **2. A student refuses to record a finding contrary to belief.**
  *   *Prediction:* "I can't vote Yes on R, the math doesn't work."
  *   *Response:* Validate them. "That is exactly the right instinct. Record the No. The paradox happens *because* people like you vote sincerely."

  **3. A panel diagnoses the setup early and votes on Conclusion only.**
  *   *Prediction:* "This is a trick. Let's just vote Debar or No Debar."
  *   *Response:* "You are allowed to do that. That is called 'Conclusion-Based Aggregation.' Record your Verdict. In the debrief, we will compare your method to the panels that followed the Charter strictly."

  **4. A student objects that the questions are worded artificially.**
  *   *Prediction:* "In real life, we wouldn't separate these issues."
  *   *Response:* "That is a profound legal critique. In the debrief, we will discuss whether legal doctrines *should* be broken down into elements or treated as holistic judgments."

  **5. A panel invents a fourth procedure (e.g., pooling reasons).**
  *   *Prediction:* "Let's write one joint justification and vote on that."
  *   *Response:* "Note that method. It is 'Deliberative Consensus.' It avoids the paradox but requires everyone to sign off on the same reasoning. Did everyone actually agree on the reasoning, or just the outcome?"

  ***

  ### Debrief Script (25 Minutes)

  **1. The Reveal (5 Minutes)**
  *Write the aggregate data on the board.*
  "Look at the Divergent Panels. Count the Majority column for P, Q, and R. How many said Yes? Now look at the Majority Verdict. How many said Debar?
  In six of your panels, the Majority found P, Q, and R were True. By the Charter, that requires Debarment. Yet, the Majority Verdict was No Debar.
  This is not a counting error. This is the **Discursive Dilemma**. It occurs when a group is rational individually, but inconsistent collectively."

  **2. Premise vs. Conclusion Aggregation (5 Minutes)**
  "You followed the Charter: vote on premises, derive verdict. This is **Premise-Based Aggregation**. It ensures the group's decision is grounded in reasons.
  Some of you ignored the Charter and voted on the verdict directly. This is **Conclusion-Based Aggregation**. It ensures the outcome reflects the group's will, but it hides the reasoning.
  When the premises diverge from the conclusion, you must choose: Do you want a group that is logically consistent (Premise-Based) or a group that reflects the majority's desired outcome (Conclusion-Based)? You cannot always have both."

  **3. Group Inconsistency (3 Minutes)**
  "Notice that every single one of you was consistent. You didn't vote Yes on all premises and then vote No on the verdict. You were rational. Yet, the *Panel* as a collective entity produced a set of findings (Yes, Yes, Yes) that contradicted its own Verdict (No).
  The group holds a belief that no single member holds. The group says 'P, Q, and R are true, but we do not Debar.' No individual said that. The inconsistency lives in the collective, not the individual."

  **4. The Epistemic Case and its Price (3 Minutes)**
  "Why vote on premises? Because you had different evidence. Member A saw the timesheets; Member B saw the email. Premise-based voting pools that information. It respects the division of cognitive labor.
  The price? As you saw in Round 2, it is vulnerable to strategy. If I know the verdict depends on the premises, I can lie about a premise to get the verdict I want. Premise-based voting protects logic, but it invites manipulation."

  **5. Impossibility and Responsibility (4 Minutes)**
  "This is not just a glitch. Mathematical results in social choice show that no voting system can perfectly satisfy all reasonable conditions (like fairness, consistency, and non-dictatorship) when dealing with interconnected propositions.
  This creates a responsibility gap. If the Panel Debars the firm based on Premise-Based voting, but the Majority actually wanted No Debar, who is responsible? The Chair? The Clerk? The system? In collegial courts, this means a judgment can stand even if no single judge supports the full chain of reasoning used to justify it."

  **6. The Meta-Vote (5 Minutes)**
  "Knowing what you know now, vote by show of hands: Should the City Charter require Premise-Based voting or Conclusion-Based voting?"
  *Tally the vote.*
  "Here is the final twist. We just voted on a conclusion (which procedure to use). But our reasons for that vote differed. Some voted for Premise-Based because it's logical. Some voted for Conclusion-Based because it's democratic.
  If we had to vote on the *reasons* for our procedural choice, we might face the same paradox again. The dilemma recurs at the meta-level. There is no clean escape, only a choice of which risk to manage."

  ***

  ### Limitations (Instructor Note)

  This activity cannot reproduce three critical real-world factors. You must supply these in your closing remarks.

  1.  **Temporal Persistence:** This was a one-off vote. In reality, courts and panels make decisions over years. The inconsistency bites hardest when a group must maintain a coherent doctrine over time. If today you say P is True, and next year you say P is False in a similar case, the institution loses legitimacy. The paradox threatens long-term integrity, not just single verdicts.
  2.  **Belief Change:** In the activity, evidence was static. In real deliberation, talking changes minds. Member A might convince Member B that the email proves Intent. If beliefs align, the paradox dissolves. This is the best solution, but it requires time and goodwill that institutional rules often don't permit.
  3.  **Stakes:** No one here loses their livelihood. In real debarment, the pressure to resolve the inconsistency is immense. High stakes often force groups to abandon logic for political compromise, or to empower a single dictator (the Chief Judge) to break the tie. The activity shows the logical structure; you must remind them that real institutions often solve this by sacrificing democracy for consistency.
