  REPOSITORY: State Archives of the Northern District
  CREATOR: Van Der Hout Mercantile Co.
  COLLECTION ID: MS-904-Q
  TITLE: Personnel and Asset Ledgers, Series Q
  DATES: 1789-1845 (Bulk 1792-1794)
  EXTENT: 0.4 Linear Feet (1 box)

  SCOPE AND CONTENT:
  Records document shipping manifests, insurance claims, and
  estate valuations. Subject appears in Box 1, Folder 3 as
  "Item 4: One Female, Age 12" and in Folder 5 as a witness
  mark (X) on a deposition given through an interpreter whose
  notes were not retained. No correspondence authored by
  subject exists. Gaps in ledger entries correspond to port
  quarantine periods [ca. 1795-1808].

  ARRANGEMENT:
  Series I: Administrative Correspondence (1790-1792)
     Box 1, Folder 1: General Orders (n.d.)
     Box 1, Folder 2: Staffing Lists (1791)
  Series II: Financial Ledgers (1792-1794)
     Box 1, Folder 3: Asset Depreciation [See Scope]
     Box 1, Folder 4: [Empty]
  Series III: Legal Proceedings (1794-1845)
     Box 1, Folder 5: Indictment vs. Captain V.
     Box 1, Folder 6: Settlement Agreement (1845)

  ACCESS RESTRICTIONS:
  Series III sealed until 2095 per donor agreement.
  Photocopying prohibited for brittle ink.

  SEPARATED MATERIALS:
  Personal effects transferred to Municipal Museum, 1952.
  Location currently unknown.

  PROCESSING INFORMATION:
  Processed by J. Albers, 2023. Original order maintained.
  Folder 4 contained dust only; retained as evidence of
  removal. Describer noted pressure marks on Folder 3,
  page 9, where the pen broke the paper. No attempt was
  made to infer identity beyond legal designation. To
  assign a name would be to falsify the record of her
  erasure. We do not speak for the file. We note the
  weight of the box. This finding aid is not a recovery.
  It is a map of the missing. The archivist wishes to
  say more but finds the fields insufficient. No further
  accruals expected.
