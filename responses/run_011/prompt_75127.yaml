  4.  **Formulate the Solution:**

      *   **The Break Point:** The inference from (3) to (4) is the weakest link, but (1) is also too rigid. The real issue is the definition of "fact of the matter."
      *   **Strategy:** Distinguish between *precision* and *objectivity*. A period can be objectively real (grounded in evidence) without having precise boundaries (sharp dates).
