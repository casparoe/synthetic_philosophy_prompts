prompt: |-
  Bit of a mess and I'd rather not hand it in like this. I'm writing the methods section of a thesis, and a friend took my own reasoning about periodization and ran it back at me until it proved far too much.

  (1) A period label is legitimate only if there's a fact of the matter about where the period begins and ends.
  (2) Take any candidate boundary — 1453, 1492, Copernicus in 1543, the Royal Society in 1660 — and a competent historian can argue for shifting it a generation either way without touching a single piece of evidence; people working on the twelfth-century Renaissance have been doing exactly that for the best part of a century.
  (3) So there's no fact of the matter about the boundaries of any period.
  (4) So 'the Middle Ages', 'the Renaissance' and 'the Scientific Revolution' are convenient fictions — nothing in the past answers to them.
  (5) But nothing in (2) was specific to history. The same goes for the Cold War, the pandemic, the Holocene, adolescence, and the Romantic period in music.
  (6) Those labels are not obviously defective in the way (4) says period labels are.
  (7) So (1) is false, and my scruples were misplaced.

  He thinks thats a clean reductio of my chapter's opening worry. Trouble is I want to keep (2), and I want to keep something in the neighbourhood of (1), because otherwise I can't say what my own period terms are even doing. Which step breaks? Tell me why it looked fine to me in the first place and what giving it up costs — and if your answer is that (4) simply doesn't follow from (3), say what (3) would have to be claiming for it to follow, and whether anything in (2) entitles me to that stronger claim. British English, please.
