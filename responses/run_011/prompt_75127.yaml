      *   *Inference (2) $\rightarrow$ (3):* Slippage $\rightarrow$ No fact of the matter. (This is contentious).
      *   *Inference (3) $\rightarrow$ (4):* No fact of matter $\rightarrow$ Fiction/Nothing answers to them. (This is a big leap).
