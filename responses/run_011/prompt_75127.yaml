answer: |-
  Your friend has constructed a clever *reductio*, but it relies on sliding between **vagueness** and **fiction**. If you wish to retain the methodological scruple behind (1) without accepting the nihilism of (4), the argument breaks at the inference from (3) to (4), though premise (1) also requires sharpening to survive the contact.

  Here is where the chain fails, why your original intuition was not entirely wrong, and how you might recast this for your thesis.

  ### The Broken Inference: From (3) to (4)

  Your friend's argument hinges on the claim that because boundaries are debatable (3), the period itself is a fiction (4). This is a non-sequitur.

  For (4) ('nothing in the past answers to them') to follow validly from (3) ('no fact of the matter about the boundaries'), premise (3) would have to be claiming something much stronger than it currently does. It would need to assert: **'There is no fact of the matter about whether the *core characteristics* of the period obtain.'**

  Mere boundary vagueness does not entail ontological emptiness. Consider a cloud. There is no fact of the matter about exactly which water molecule marks the edge of the cloud versus the surrounding humidity (this is your premise 2). However, it does not follow that 'the cloud' is a convenient fiction and that nothing in the sky answers to the label (your premise 4). The density gradient is real, even if the perimeter is not.

  Does anything in (2) entitle your friend to that stronger claim? No. Premise (2) notes that historians can shift dates 'without touching a single piece of evidence'. This demonstrates **interpretative flexibility regarding transition points**, not the **absence of structural change**. The fact that one can argue for 1453 or 1480 as the end of the Middle Ages presupposes that *something* is ending in that vicinity. If nothing in the past answered to the label, there would be no evidence to argue over in the first place.

  ### The Problem with Premise (1)

  You mentioned you want to keep 'something in the neighbourhood' of (1). Your friend is right that (1) as stated is too rigid, but your instinct behind it is methodologically sound.

  **Why it looked fine to you:**
  Premise (1) appeals to a realist intuition: we want our categories to track reality, not just our convenience. It guards against presentism and arbitrary carving. It looked fine because it demands **accountability**.

  **The cost of giving it up:**
  If you discard (1) entirely, you risk implying that periodisation is purely aesthetic. This undermines your methods section, as you cannot explain why you chose *these* chapters or *this* chronology rather than another.

  **The cost of keeping it (as written):**
  If you keep (1) as written, you fall into the **Sorites paradox** (the paradox of the heap). You invite the objection that because 'tall' has no precise height cutoff, 'tallness' does not exist.

  **The Solution:**
  Modify (1) to shift the requirement from **precision** to **justification**.
  *   *Old (1):* Legitimacy requires a fact of the matter about *where* the period begins.
  *   *New (1):* Legitimacy requires a fact of the matter about *why* a boundary is drawn.

  This preserves your scruple. You are not claiming the date is sacred; you are claiming the *reason* for the date must be grounded in the evidence.

  ### How to Frame This in Your Thesis

  You can acknowledge your friend's point (that boundaries are fuzzy) without accepting the conclusion (that periods are fictions). In fact, acknowledging the fuzziness strengthens your methodology by showing you are aware of the limits of your terms.

  Here is a suggested reconstruction of that logic for your methods section:

  1.  **Acknowledge the Vagueness:** Accept premise (2). Historical change is rarely punctual; it is processual. Competent historians can indeed shift boundaries by a generation.
  2.  **Reject the Nihilism:** Deny the move to (4). Vagueness is a property of many real concepts (e.g., 'mountain', 'adult', 'ecosystem'). It does not render them fictitious.
  3.  **Refine the Criterion:** Adopt the modified (1). A period label is legitimate not when its edges are sharp, but when its **diagnostic features** are robust.
  4.  **The Methodological Payoff:** Your task is not to defend 1453 as the *only* possible date, but to demonstrate that drawing a line near 1453 illuminates more than it obscures.

  ### Summary of Costs

  *   **What you give up:** The comfort of hard dates. You can no longer say 'The Renaissance began in 1400.' You must say 'The cluster of phenomena I term the Renaissance becomes discernible around 1400.'
  *   **What you gain:** A defence against pedantry. If a critic says 'But X happened in 1390!', you can reply, 'Precisely, which is why my boundary is porous, yet the structural shift remains.'
  *   **What you keep:** The requirement that your periodisation must answer to the evidence. It is not a fiction; it is a **heuristic map**. A map is not the territory, and the border on a map may be a shaded line rather than a wall, but that does not mean the territory is imaginary.

  In short, your friend has proved that **chronological precision** is impossible, not that **historical distinction** is impossible. Keep the distinction, drop the demand for precision, and your methods section will be the stronger for it.
