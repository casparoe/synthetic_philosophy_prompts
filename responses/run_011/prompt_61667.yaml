answer: |-
  Here is the diagnosis.

  ### The Diagnosis: Causal Selection vs. Causal Structure

  The dispute is not primarily substantive (about which cause is real), nor is it merely verbal (about definitions). It is a **methodological disagreement about the logic of causal attribution in complex historical systems.**

  Your friend operates under a **Linear Causal Model**: He assumes the Great Divergence is an outcome variable ($Y$) determined by a set of independent variables ($X_1, X_2, X_3...$). He believes that with sufficient data, we can isolate the beta coefficient of each $X$ to find the one with the highest explanatory power ("the decisive work"). To him, the five accounts are competing hypotheses about which $X$ matters most.

  You operate under a **Conjunctive Causal Model**: You assume the Great Divergence is a path-dependent trajectory where $X_1$ only causes $Y$ if $X_2$ and $X_3$ are present at time $t$. To you, the five accounts are describing different links in a chain, or different necessary conditions, none of which are sufficient on their own.

  The friction arises because your friend is asking for a **cause** (a difference-maker), while you are describing a **context** (a configuration of conditions). He wants to know which match lit the fire; you are arguing that the match only matters because of the oxygen, the fuel, and the lack of windbreakers, and that asking for "the match" is arbitrary depending on whether you are comparing this fire to a damp forest or a gas station.

  ### The Five Accounts: Commitments and Evidentiary Limits

  To ground this, we must look at what each of the five accounts you listed is actually committed to, and where evidence runs out.

  1.  **Institutionalists (Property Rights, Rule of Law)**
      *   **Commitment:** Incentive structures determine investment. Innovation requires the security of returns.
      *   **What Evidence Bears On It:** Legal records, patent enforcement rates, sovereign default histories.
      *   **What Evidence Cannot Bear On It:** **Endogeneity.** Did institutions cause growth, or did growing merchant classes demand better institutions? Data shows correlation, but cannot easily distinguish the direction of causality without a clear exogenous shock. Furthermore, evidence cannot easily address the *counterfactual*: Would China have industrialized if it had British institutions? We cannot run the experiment.

  2.  **High-Wage/Cheap-Energy (Allen)**
      *   **Commitment:** Innovation is a response to relative factor prices. Labor-saving tech is only profitable when labor is expensive and energy is cheap.
      *   **What Evidence Bears On It:** Wage series, coal prices, adoption rates of machinery. This is the most empirically robust account.
      *   **What Evidence Cannot Bear On It:** **The Origin of Prices.** Why were British wages high and Chinese wages low? This account takes factor prices as exogenous inputs. It explains the *adoption* of technology, but not the *divergence* in the underlying economic conditions that made the technology profitable. It kicks the can back to demographics or institutions.

  3.  **Ecological (Pomeranz)**
      *   **Commitment:** Material bottlenecks (land, energy) constrain growth. Britain escaped the Malthusian trap via "ghost acres" (colonies) and coal.
      *   **What Evidence Bears On It:** Trade volumes, caloric intake, coal geology, land use data.
      *   **What Evidence Cannot Bear On It:** **Agency.** Why did Britain exploit coal and colonies while China did not? China had coal; it wasn't used. This account explains the *capacity* for sustained growth, but not the *decision* or *ability* to access that capacity. It risks being geographically deterministic.

  4.  **Cultural (Values, Science, Enlightenment)**
      *   **Commitment:** Ideational shifts precede material shifts. A specific mindset toward nature and utility is required.
      *   **What Evidence Bears On It:** Textual analysis, scientific society membership, patent citations referencing theory.
      *   **What Evidence Cannot Bear On It:** **Operationalization.** "Culture" is often defined residually (whatever is left after economics is accounted for). Evidence cannot easily falsify this because cultural claims are often unfalsifiable tautologies (e.g., "They didn't industrialize because they lacked the spirit; we know they lacked the spirit because they didn't industrialize").

  5.  **Regional-Comparison Revisionists**
      *   **Commitment:** Aggregates (Nation/Civilization) are misleading. Comparison must be between functionally equivalent units (Lancashire vs. Yangzi Delta).
      *   **What Evidence Bears On It:** Local wage data, regional market integration metrics.
      *   **What Evidence Cannot Bear On It:** **The Macro Question.** This is a methodological correction, not a causal theory. It can show that China was richer than we thought in 1750, but it cannot explain why Lancashire mechanized and the Yangzi Delta did not *after* 1750. It dissolves the "Civilization" question but leaves the "Region" question intact.

  ### Where Your Hypothesis Fails

  Your hypothesis is that this is "parties answering different contrastive questions under a single heading" combined with a disagreement about "contingent outcome vs. general explanation."

  **You are right about the contrastive questions.** Your friend treats "Why Britain?" as synonymous with "Why not China?" But as you noted, "Why Britain?" could mean "Why Britain and not France?" (answer: coal/politics) or "Why Britain and not Song Dynasty China?" (answer: institutions/culture). Changing the foil changes the cause.

  **However, your hypothesis fails in two specific places:**

  1.  **You underestimate the convergence on necessary conditions.** You treat the five accounts as mutually exclusive alternatives driven by different questions. In reality, the field is converging on the idea that *all five were necessary*. High wages were needed (Allen), but required access to energy (Ecological), which required property rights to exploit (Institutional), which may have been underpinned by cultural shifts (Cultural), visible only at the regional level (Revisionist). Your friend thinks one is "decisive"; you think the search for a decisive one is a category error. The failure in your hypothesis is assuming the Friend believes only *one* factor exists. He likely believes one factor was the *binding constraint* (the bottleneck). Your disagreement is not about the list of ingredients, but about whether identifying the "limiting reagent" counts as a full explanation.
  2.  **You claim your move is unfalsifiable ("no evidence could falsify it").** Your friend is right to call this evasive *if* you stop there. But your point about the "category mistake" is empirically testable. If industrialization occurs in multiple distinct cultural/institutional settings (e.g., later in Japan, Germany, US), then the "British unique cause" models are falsified. If industrialization *only* occurs in British-like institutional settings, the Institutionalists are vindicated. Your skepticism is not a philosophical shield; it is a claim about **equifinality** (multiple paths to the same outcome). That is an empirical claim, not just a methodological one. If you argue "no general explanation is possible," you are arguing that history is non-ergodic. That is a strong claim that *can* be challenged by finding regularities in other industrializations.

  ### What Counts as Progress?

  Given this diagnosis, more data (wage series, coal maps) will not settle the dispute. You already have enough data to know that Britain had high wages, coal, and decent institutions, and China had low wages, coal, and different institutions. The data confirms everyone's premises; it doesn't resolve the causal priority.

  Progress requires three specific shifts:

  1.  **From "The Cause" to "The Binding Constraint":**
      Progress lies in modeling the divergence as a **production function of industrialization**. Instead of arguing whether Institutions or Coal was "the cause," the field must model them as complementary inputs. The question becomes: *Which input was the binding constraint at the margin in 1750?*
      *   *Test:* If you simulate an economy with British wages but Chinese institutions, does it industrialize? If we can build formal models (cliometric simulations) that show which constraint binds first, we move past narrative selection.

  2.  **Temporal Segmentation:**
      The dispute confuses **origins** with **sustainment**.
      *   *Progress:* Acknowledge that different factors explain the *onset* (perhaps wages/energy) vs. the *sustainment* (perhaps institutions). A factor that triggered the spark (coal) is not the same as the factor that kept the engine running (property rights). Separating the "take-off" explanandum from the "sustained growth" explanandum would dissolve much of the argument. Your friend is looking for the spark; you are looking at the engine design. Both are real.

  3.  **Explicit Contrast Classes:**
      Progress requires forcing every claim to specify its foil.
      *   *Bad:* "Institutions caused the divergence."
      *   *Good:* "Institutions explain the divergence between England and France in 1700, but Factor Prices explain the divergence between England and China in 1800."
      *   If the field mandated that every causal claim state its counterfactual explicitly, the "one question" illusion would vanish. You would see that the Institutionalists are answering "Why Europe?" while the Ecological account is answering "Why 1800?"

  ### Conclusion

  Your friend is wrong that there is a single "decisive" factor waiting to be found in the data. The system is conjunctive; removing any one of the five likely prevents the outcome.

  However, you are wrong that this makes the project futile or purely verbal. The search for the **binding constraint** is a valid scientific question, even in complex systems. In a chain, all links are necessary, but the weakest link is the "cause" of the break.

  The progress you seek is not a new dataset, but a **formalization of the causal graph**. Until the field stops treating these five accounts as competing narratives and starts treating them as interacting variables in a dynamic system, you and your friend will continue to argue past one another. He is looking for the weakest link; you are insisting the chain matters. The resolution is to agree that the chain matters, but that for the purpose of intervention (or explanation), identifying the weakest link is the only operational definition of "cause" available.
