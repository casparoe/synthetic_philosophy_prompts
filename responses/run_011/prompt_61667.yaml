      *   *High-Wage/Cheap-Energy (Allen):* Factor prices drove labor-saving innovation. Commitment: Economic incentives trigger specific technological paths. Evidence: Wage/price series, energy costs. Falsifiable if wages weren't actually high or if innovation happened where wages were low.
      *   *Ecological (Pomeranz):* Coal + New World land (ghost acres). Commitment: Material constraints/bottlenecks determine growth ceilings. Evidence: Coal geology, trade volumes, land use data. Falsifiable if China had accessible coal or if land constraints weren't binding.
