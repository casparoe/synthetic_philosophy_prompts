answer: |-
  There is no settled name specifically for the methodological reinstatement of a repudiated ontology, distinct from the doctrinal slip, though 'Cryptocartesianism' captures the theorist's hidden belief.

  I propose the term **Methodological Cartesianism** to carve out this specific phenomenon. While Cryptocartesianism identifies the theorist who secretly holds Cartesian Materialist beliefs, Methodological Cartesianism identifies the structural embedding of those beliefs in the instruments, notation, and experimental paradigms themselves, independent of the theorist's sincere avowals. It is the operationalization of the Cartesian Theater even when the theater has been verbally dismantled.

  To distinguish this from its nearest neighbours:
  *   **Performative Contradiction:** This requires an assertion that undermines the act of asserting (e.g., "I am not speaking"). Methodological Cartesianism requires no assertion; it resides in the silent architecture of the lab protocol or the diagrammatic convention.
  *   **Homunculus Fallacy:** This posits an inner agent interpreting data. Methodological Cartesianism posits an inner *place and time* (a finish line) without necessarily implying an inner viewer. It is a spatiotemporal error, not necessarily an agential one.
  *   **Theory-Ladenness of Observation:** This is universal; all observation relies on theory. Methodological Cartesianism is specific to the reliance on a theory *explicitly rejected* by the observer. It is not just ladenness, but contradictory ladenness.
  *   **Instrumental Fictionalism:** This implies a deliberate, conscious use of a false model for utility (e.g., "talking as if"). Methodological Cartesianism is typically sincere; the theorist believes they have escaped the picture, but their tools have not.
  *   **Residual Theoretical Commitment:** This is too broad, covering any leftover baggage. Methodological Cartesianism specifies that the residue is not just any old concept, but the specific spatiotemporal localization of consciousness that defines Cartesian Materialism.

  To separate genuine residue from innocent notational convenience, we require the criterion of **Operational Indispensability**. A notation is innocent if it can be translated into functional or distributed terms without loss of predictive power or experimental precision. For example, if "conscious access at 300ms" can be reformulated as "the completion of a specific suite of reciprocal signaling loops" without changing the experimental setup, the theater notation is convenience. It becomes Methodological Cartesianism if the experimental paradigm *collapses* without the assumption of a singular locus or moment. If the masking paradigm *requires* a single window where the stimulus is either "in" or "out" of consciousness to yield data, rather than treating reportability as a probabilistic function of multiple competing processes, the method is Cartesian regardless of the theory. The accusation is falsifiable: show me a reformulation of the protocol that retains predictive success while eliminating the privileged spatiotemporal locus.

  Regarding whether this residue is a vice or a discovery: it is **ontologically vicious but heuristically potent**. It is a vice because it reifies a functional bottleneck as an ontological site, inviting the very category errors Dennett warns against (confusing the timing of report with the timing of experience). However, it may be a discovery in the sense that the brain may indeed possess global workspace architectures that function *analogously* to a theater, even if no literal theater exists. If the data consistently converge on a specific latency and locus for reportability, the "theater" is tracking a real functional constraint, even if the ontology is wrong. The danger arises only when the heuristic utility of the model is taken as proof of its ontological literalism. Thus, Methodological Cartesianism is permissible as a shorthand for functional convergence, but becomes a vice when it precludes the investigation of distributed, asynchronous alternatives that might fit the data equally well.
