      *Better Rebuttal:* Nietzsche's Critical history doesn't require the past agent to be "free." It requires the *present* agent to be strong enough to break the chain. Owen frames the dilemma around the *Founder's* metaphysical status. Dana should have shifted the ground to the *Present's* need. The "object" of condemnation is the *effect on life*, not the *moral guilt of the ancestor*.

      *Refining Part (d):* The "Unhistorical." Nietzsche says we need to know when to stop remembering. An exhibition *forces* memory. Maybe the Nietzschean move is to dismantle the foyer's focus on the founder entirely, not to curate it better. To let the founder become "unhistorical" background noise so the university can live.

      *Refining Part (e):* I will explicitly state where I am inferring Nietzsche's broader philosophy vs. specific claims in *UM II*.

      *Final check on ratings:*
