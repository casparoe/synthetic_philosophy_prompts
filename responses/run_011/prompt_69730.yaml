      *   **Requirements:**
          *   (a) Rate each of the 6 moves (Clearly Right, Defensible, Confused, Clearly Mistaken) with brief justification.
          *   (b) Assess who has the three modes (Monumental, Antiquarian, Critical) right interpretation-wise vs. who is just labeling pre-existing positions.
