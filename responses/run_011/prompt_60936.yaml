answer: |-
  **MEMORANDUM**

  **TO:** Student Employment Advisory Committee
  **FROM:** Graduate Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Coffee Cart Tipping Protocols

  This memo addresses the complaint filed by two student workers regarding tip variance at the campus coffee cart. As noted, international students decline tips at triple the rate of domestic peers. The Committee is deadlocked between maintaining the prompt with education (Option d) or restructuring compensation (Option c). To resolve this, we must analyze the normative structure of tipping in this context.

  We should distinguish between **load-bearing** conventions and **outsourced** conventions. A load-bearing convention exists because deviating harms identifiable others whose plans rely on compliance (e.g., queueing). An outsourced convention exists because an institution has shifted a cost it would otherwise carry onto a voluntary norm (e.g., tipping subsidizing payroll).

  Structurally, the coffee cart tip is outsourced. Dining Services utilizes the prompt to supplement a minimum wage, shifting payroll costs to customer voluntarism. However, for the student workers, this convention feels load-bearing. Their income plans rely on the tip; when it vanishes, they suffer identifiable harm. This dual nature drives our disagreement. Option (d) treats the norm as load-bearing for everyone, demanding compliance to protect workers. Option (c) treats it as outsourced, demanding the institution reclaim the cost.

  **The Case for Option (d)**
  Proponents of Option (d) argue that abstract institutional ethics cannot outweigh concrete peer harm. The complaint came from the workers, not the international students. Our peers are losing money through no fault of their own. A short orientation is a low-cost intervention to stabilize their income. To refuse education is to prioritize a theoretical distinction over actual livelihoods. Furthermore, exchange students are transient; they will not suffer reputational consequences for non-compliance, whereas workers remain here dependent on this income. If the norm protects the vulnerable, enforcing it is justified regardless of its origin.

  **Rebuttal and Standing**
  This argument is strong, but it misidentifies who holds standing to enforce the norm. The workers have standing to complain about wages; international students have no standing to enforce a cultural norm they never opted into. By choosing (d), the University makes transient students the enforcers of a payroll decision they didn't make.

  Regarding transience: asking a one-semester exchange student to subsidize the University's wage structure is ethically precarious. They cannot negotiate the wage, nor will they be around to benefit from the norm's stability. They are being asked to pay a "local tax" for a system they don't inhabit. If the convention is outsourced, compliance mainly props up the institution's arrangement rather than anybody's mutual plans. Making newcomers shoulder this burden hides who is actually being paid: the University is being paid via suppressed wages, while students are asked to fill the gap.

  Therefore, while the workers' pain is real, solving it by coercing visitors validates the outsourcing. It treats the symptom while accepting the disease.

  **Recommendation**
  I recommend **Option (c)**: Kill the prompt entirely and recommend a higher posted wage instead.

  This reclassifies the convention from outsourced to explicit compensation. It removes the cultural friction for international students and guarantees income stability for workers without relying on voluntarism. It acknowledges that student employment wages should be sufficient without requiring customers to manage payroll ethics at the point of sale.

  **Condition of Approval**
  Option (c) cannot pass without a budgetary guarantee. My motion includes this condition: **Dining Services must fund the wage increase by calculating the average tip revenue per hour over the last academic year and matching 90% of that figure in base pay, funded exclusively through operational savings or minor price adjustments, not by reducing student work hours.**

  This ensures the solution does not create new harms via hour cuts.

  **Implementation**
  If approved, this policy should take effect at the start of the Spring Semester, January 8, 2024, to allow for payroll reclassification.

  We must not ask students to subsidize institutional payroll choices, even to help their peers. The University must bear the cost of its own labor.

  Verdict: c — End outsourced wage supplementation
