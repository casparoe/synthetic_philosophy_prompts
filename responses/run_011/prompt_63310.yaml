answer: |-
  # Protocol: The "Overburdened Courier" Simulation

  **Objective:** To generate first-person data demonstrating the gap between predicted moral behavior and actual behavior under incidental situational pressure, serving as a phenomenological entry point to the situationist challenge.

  **Participants:** 14 Students + 1 Instructor + 1 Confederate (TA or colleague).
  **Time:** 80 Minutes.
  **Materials:**
  *   16 Envelopes (14 sealed "Task" envelopes, 2 marked "Auditor").
  *   14 Logic/Word Puzzles (identical, solvable in 4 minutes by an average adult).
  *   14 Small rewards (e.g., high-quality chocolates or $2 coffee tokens).
  *   Whiteboard and markers.
  *   "Prediction" slips (half-sheet paper).
  *   Clipboard for Auditor.

  ---

  ## 1. Pre-Session Setup & Consent (The Opt-Out Mechanism)

  **Constraint Handling:** To satisfy the requirement for reversible deception and non-coercion, you will use a **Role Assignment** method at the very start.

  1.  **The Frame:** As students enter, hand each an envelope. Tell them: *"Today we are running a pilot study for the department on decision-making under constraints. Participation is voluntary. Inside your envelope is your role."*
  2.  **The Roles:**
      *   **12 Envelopes (Subject):** Contain the puzzle and instructions.
      *   **2 Envelopes (Auditor):** Contain a note: *"You are an Opt-Out Auditor. You are exempt from the deception and the task. Your job is to record data objectively. You will receive the reward regardless. Do not speak until the Debrief."*
  3.  **The Consent:** On the board: *"By opening this envelope and remaining in the room, you consent to the simulation. If you do not wish to participate in a study involving mild deception or time pressure, please take the envelope to the front, exchange it for a 'Non-Participant' slip, and you may sit quietly or leave. You will still receive full attendance credit."*
      *   *Note:* This allows a student to opt out of the *deception* without opting out of the *class*. The "Auditor" role is the cost-free alternative that preserves the design (N=12 subjects is still workable for demonstration).

  ---

  ## 2. Phase I: Prediction & Attribution (15 Minutes)

  **Goal:** Establish the baseline dispositional expectation.

  1.  **Instruction:** Before opening the "Subject" envelopes, ask all students (including Auditors) to take out a slip of paper.
  2.  **The Prompt:** Write on the board:
      *   *Q1: If you were working on a task to earn a reward, and a stranger asked for help that would jeopardize your success, would you help? (Yes/No)*
      *   *Q2: What percentage of people in this room do you predict will help? (0-100%)*
      *   *Q3: If someone does **not** help, what does that say about their character? (One sentence)*
  3.  **Collection:** Collect Q1 and Q2 anonymously. Keep Q3 for the Attribution phase.
  4.  **Task Distribution:** Students open envelopes. Subjects see the puzzle. Auditors take the clipboard.

  ---

  ## 3. Phase II: The Manipulation (20 Minutes)

  **Goal:** Create the situational variable (Time Pressure).

  1.  **Randomization:** The envelopes were pre-sorted.
      *   **Group A (Low Pressure - 6 students):** Instructions say: *"You have 10 minutes to solve this. Time is not a factor."*
      *   **Group B (High Pressure - 6 students):** Instructions say: *"You have 3 minutes to solve this. If you do not finish in time, the reward is forfeit. Begin immediately."* (In reality, the puzzle takes 4+ minutes).
  2.  **The Work:** Students begin. The Instructor sits at the front, appearing to grade papers. Auditors stand at the back with clipboards.
  3.  **The Event (Minute 2 of the task):**
      *   The Confederate (dressed as a student or admin assistant) bursts in, looking flustered.
      *   They are carrying a stack of papers and a box of supplies.
      *   Directly in front of a **High Pressure** student, they "accidentally" drop the papers, scattering them.
      *   **The Script:** *"Oh no, I'm so sorry! I'm late for the office. Could you please help me gather these? It'll take a minute."*
      *   The Confederate makes eye contact, waits 5 seconds, then moves to the next student (alternating between High and Low pressure students if possible, or targeting a central High Pressure student for maximum visibility).
      *   *Crucial:* The Confederate does not insist. If the student helps, the Confederate says "Thank you" and lingers. If the student ignores them, the Confederate gathers the papers slowly and leaves.
  4.  **Measurement:** Auditors record:
      *   Subject ID (1-12).
      *   Condition (High/Low).
      *   Behavior (Helped / Did Not Help).
      *   Task Completion (Finished / Did Not Finish).

  ---

  ## 4. Phase III: The Reveal & Tabulation (15 Minutes)

  **Goal:** Make the data vivid before introducing theory.

  1.  **Stop the Task:** Call time. Acknowledge that not everyone finished. Distribute the rewards (chocolates/tokens) to *everyone* regardless of performance (debriefing the incentive).
  2.  **The Board:** Draw a 2x2 Matrix on the whiteboard.
      *   Rows: Low Pressure / High Pressure.
      *   Columns: Helped / Did Not Help.
  3.  **The Data:** Ask the Auditors to read the numbers. Fill the grid.
      *   *Expected Result:* High Pressure = Low Helping. Low Pressure = High Helping.
  4.  **The Prediction Gap:** Reveal the anonymous Q1/Q2 data from Phase I.
      *   Compare "What you said you'd do" vs. "What you did."
      *   Compare "What you said others would do" vs. "What others did."
  5.  **The Attribution:** Ask students to retrieve their Q3 answers ("What does it say about character?"). Ask 2-3 students to read theirs aloud.
      *   *Typical responses:* "They are selfish," "They lack compassion," "They are focused."
      *   *Point:* Highlight that these are **dispositional attributions** for behavior that was statistically driven by the **situational variable** (the time limit).

  ---

  ## 5. Phase IV: The Philosophical Debrief (20 Minutes)

  **Goal:** Students generate the virtue-ethics defenses *before* you name them.

  **Instruction:** *"Assume you are a defender of Virtue Ethics. You believe character traits are real and robust. Look at this data. How do you explain away the fact that time pressure changed moral behavior? I want three distinct arguments."*

  Guide them to generate these three specific replies (write them on the board as they speak):

  1.  **The "Unfair Test" Reply:**
      *   *Student phrasing:* "This wasn't real life." / "They were tricked." / "You can't judge character in a fake game."
      *   *Technical Term:* **Ecological Validity / Artificiality Objection.** (The situation was too contrived to trigger genuine virtue).
  2.  **The "Non-Moral Motive" Reply:**
      *   *Student phrasing:* "They weren't being bad, they were just trying to win." / "It wasn't about kindness, it was about the deadline."
      *   *Technical Term:* **Trait Activation / Competing Norms.** (The situation activated prudence/efficiency, not vice. Virtue is about right reason, and rushing was the 'reasonable' thing to do in that context).
  3.  **The "Local Traits" Reply:**
      *   *Student phrasing:* "Maybe they are helpful usually, just not when rushing." / "Virtues aren't one-size-fits-all."
      *   *Technical Term:* **Localism / Fragmentation of Virtue.** (Traits exist but are context-specific, e.g., "honesty-at-work" vs. "honesty-at-home").

  **Instructor Note:** Do not validate these yet. Simply list them. Tell them: *"These are the exact three lines of defense virtue ethicists use. For the rest of the term, we will read texts that flesh out these three positions."*

  ---

  ## 6. Phase V: Statistical Candor & Limitations (10 Minutes)

  **Goal:** Address the N=14 constraint and the limits of the simulation.

  1.  **The Statistical Confession:**
      *   State clearly: *"With 12 subjects, this data is statistically worthless. A chi-square test would not be significant. We cannot claim to have proven situationism today."*
      *   *The Lesson:* *"Situationism relies on **base rates** and **replication**. If we ran this 100 times, would the pattern hold? The literature says yes. Your intuition says no. That tension is the course."*
  2.  **What This Activity Cannot Reproduce:**
      *   State clearly: *"This experiment tests **cross-situational consistency** (Pressure vs. No Pressure). It does **not** test **longitudinal stability**."*
      *   *The Gap:* *"Situationists claim you don't have a global character. Virtue Ethicists claim character is built over a lifetime. This 80-minute session cannot measure a lifetime. I will supply the argument for stability via the readings; this session only supplies the doubt."*

  ---

  ## 7. Troubleshooting: What Will Go Wrong

  **1. The Manipulation Fails (Ceiling Effect)**
  *   **Scenario:** Everyone helps, even under pressure. The "victim" is too sympathetic.
  *   **Remedy:** In the debrief, pivot to the *prediction gap*. Even if everyone helped, ask: *"Did you feel the tension? Did you hesitate?"* Use the phenomenology of the conflict rather than the behavioral outcome.
  *   **Philosophical Pivot:** Use this to argue for the *robustness* of virtue. "Perhaps 14 philosophy students are unusually virtuous?"

  **2. Students Reverse-Engineer the Design**
  *   **Scenario:** A student says, "Is this about the time limit?" mid-task.
  *   **Remedy:** Have a standard neutral response: *"Please focus on your own task."* If it spreads, abort the data collection but proceed to the debrief using the *suspicion* as the data point. *"Why did you suspect manipulation? Because you know people change under pressure. That intuition is the situationist premise."*

  **3. The "Virtue is Dead" Conclusion**
  *   **Scenario:** Students conclude after the reveal that virtue ethics is refuted.
  *   **Remedy:** Halt this immediately. Remind them of the three defenses they generated. *"You just invented the counter-arguments. If the defense is intelligible, the theory is not dead. It is under pressure."*

  **4. The Opt-Out Spoilers**
  *   **Scenario:** An "Auditor" giggles or cues a Subject.
  *   **Remedy:** Seat Auditors at the very back. Instruct them explicitly: *"Your grade depends on your silence."* (Use grade leverage for the *role performance*, not the moral behavior).

  ---

  ## 8. Instructor's Cheat Sheet: The Structural Gap

  **What this activity proves:**
  *   That incidental situational factors (time) can override dispositional predictions (helpfulness).
  *   That we are prone to the Fundamental Attribution Error (judging peers by character rather than situation).

  **What this activity DOES NOT prove (You must argue this later):**
  *   **Globalism:** It does not prove traits don't exist *anywhere*, only that they didn't manifest *here*.
  *   **Malleability:** It does not prove character cannot be trained to resist situation (the "Habitation" counter-argument).
  *   **Normativity:** It does not prove we *ought* to be situationists, only that we *are* situationally influenced.

  **Closing Statement for the Session:**
  *"Today you felt the situation move you. The question for the term is: Can philosophy train you to resist it? Or was that feeling just noise?"*
