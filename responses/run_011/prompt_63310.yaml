      *(Refining the 3 Defenses)*: Make sure the prompt's specific phrasing is matched ("engineered situation was not a fair test", "non-moral motive", "traits may be real yet local").

      *(Final Polish)*: Check timing. 80 mins is tight. Keep the puzzle simple.

