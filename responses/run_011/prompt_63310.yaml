      *   Reversible deception/Opt-out? Yes (Observer role).
      *   N=14 limitation acknowledged? Yes.
      *   What goes wrong section? Yes.
      *   What it can't reproduce? Yes (Stability over time).

  8.  **Writing the Response:**
      *   Tone: Professional, pedagogical, candid.
      *   Structure: Protocol, Incentives, Reveal, Debrief, Limitations, Troubleshooting.
      *   *Self-Correction on Opt-Out:* If an opt-out student is in the room as an observer, they might non-verbally cue others. Better they sit apart or have a distinct task. Let's make them "Data Auditors" who sit at the back and only look at the final sheet, not the live action. Or, simpler: They are excused from the *task* but stay for the *discussion*. They are told "You are exempt from the simulation, please do not speak until the debrief." This is safer.
