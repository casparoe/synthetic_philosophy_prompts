      *   *Statistical Honesty:* Emphasize that *they* are the data, but *science* requires more. The lesson is about the *logic* of the situationist argument, not the empirical proof in this room.

      *   *What it can't reproduce:* The Situationist claim is about *global* traits across *many* situations over *time*. This is one situation. I must explicitly state I will supply the argument for cross-situational consistency via lecture/reading later.

