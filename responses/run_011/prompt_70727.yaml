prompt: |-
  I've spent the better part of a year working through the neo-Roman revival in the theory of liberty — Berlin's two concepts, MacCallum's rejoinder that there is only one triadic concept of freedom whose rivals merely disagree about how to fill in the variables, and then the republican response that what Berlin's negative concept misses is not a further quantity of freedom but a different relation to power. I've ended up with a version of republicanism that I don't see defended in quite this shape, which leaves me unsure whether I've landed on something or simply talked myself into a muddle, and my supervisor has asked me to write a chapter that states the view and then attacks it as hard as I can manage. The view is this. Domination is not a matter of how much another agent is able to interfere with you, nor of whether they do interfere, but of whether your position rests on arrangements you can point to and invoke rather than on the continuing disposition of someone else. Call it the invocable-standing view. Its three signature commitments are: (i) a slave with a genuinely kind and predictably indulgent master is unfree, not because the master is likely to interfere, but because whatever security she enjoys is something she cannot claim — she cannot prove it to a third party, contest its withdrawal in advance, or cite any standing arrangement that obliges the master to be as he is; (ii) law that constrains you does not thereby dominate, provided the constraints are publicly ascertainable and their content is answerable to the interests of those constrained, whereas the identical rule applied at an official's unstructured discretion does dominate; and (iii) the policy upshot is that the aim is not to minimise interference but to replace discretionary beneficence with invocable standing, which is why I think means-tested benefits delivered at caseworker discretion, at-will employment, and ad hoc emergency powers are dominating even when they are, in fact, generously and rarely exercised. I hold that this is not merely negative liberty with a reliability premium bolted on, because what does the work is the source and answerability of power rather than its extent.

  So: what would count against it? I want a map of its exposure, not a defence of it. Work through the arguments, intuitions, cases, and conceptual results that would tell against the view, and separate the ones that would be genuinely decisive from the ones that would be merely awkward or merely verbal. In particular I want you to take seriously the collapse worry in both directions — that invocable standing is either a covert way of talking about the probability-weighted extent of non-interference, in which case Berlin plus an expected-value calculation already has everything I claim to have added, or else that it is a purely procedural and legalist notion, in which case my view is committed to saying that freedom exists only where law has constituted it. What would have to be true for either collapse argument to go through, and what would defeat it? Relatedly: if the stateless person, the informal-sector worker, and the member of a close-knit community governed by nothing but custom and mutual knowledge are all maximally unfree on my account, is that a cost I must swallow, and does the anarchist objection — that every expansion of law expands freedom on this view, which sounds less like a theory of liberty than a theory of jurisdiction — bite? And what about the worry of expansiveness: if discretionary beneficence is dominating, then parents, teachers, physicians, employers, and spouses dominate by default, and if domination is ubiquitous it cannot be a guide to anything.

  I'd also like an honest audit of whether the view risks anything at all or has been insulated by its own vocabulary. "Arbitrariness" defined as failure to be forced to track the interests of those affected, and "tracking" cashed out in terms of whatever survives contestation, looks suspiciously like a pair of definitions built to absorb every counterexample — and if that is right, I want to know whether it matters, since plenty of respectable normative concepts are elaborated rather than tested. Which empirical findings would discriminate my view from a negative-liberty rival, and what would it mean if they came out the other way: given that I claim the slave's unfreedom is objective rather than experienced, would survey evidence that people in arbitrary-but-benign conditions report feeling free be decisive against me, irrelevant to me, or a sign that I have made my view untestable by construction? Finally, everything rests on the intuition about the contented slave, so tell me what happens if that intuition is pressed — for instance, a master permanently incapacitated, or bound by an irrevocable, self-enforcing arrangement that he could not breach even if he wanted to. Is that slave still dominated on my account, and is either answer defensible? For each item, say what a committed defender of the invocable-standing view would concede as counting against them and what they would dismiss, rank the defeaters from fatal to merely irritating, and note where my view makes predictions about actual institutions — basic income versus means testing, private arbitration clauses, family law, emergency powers — that a negative-liberty or a positive-liberty account does not make, and which of those predictions is most exposed. Please argue rather than catalogue, and reach a verdict on whether this is a view worth defending. I don't want a bibliography or a list of further reading; refer to individual thinkers only where a position is really inseparable from them, and if you're not confident of an attribution, describe the position without naming anyone.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A graduate student or researcher working on political theory/philosophy of liberty (specifically neo-Roman republicanism).
      *   **Task:** Critique a specific formulation of republicanism called the "invocable-standing view."
      *   **Core View:** Domination = lacking invocable standing (ability to point to arrangements/claim rights) vs. relying on another's disposition.
      *   **Key Commitments:** (i) Kind slave is unfree (cannot claim security); (ii) Law constrains but doesn't dominate if answerable/public; discretion dominates; (iii) Policy = replace discretion with standing (e.g., basic income > means testing).
      *   **Specific Concerns to Address:**
          *   Collapse worries (is it just negative liberty + reliability? Or just legalism?).
          *   Statelessness/Anarchist objection (does law = freedom?).
          *   Expansiveness/Ubiquity objection (parents, employers dominate by default).
          *   Conceptual Insulation (are definitions rigged to absorb counterexamples?).
          *   Empirical/Psychological evidence (felt freedom vs. objective status).
          *   The "Contented Slave" intuition pump (incapacitated master, self-enforcing contracts).
          *   Policy predictions (where is the view most exposed?).
          *   Verdict: Is this worth defending?
      *   **Constraints:** Argue rather than catalogue. Rank defeaters (fatal vs. irritating). No bibliography/lists of reading. Refer to thinkers only when inseparable.

  2.  **Deconstruct the "Invocable-Standing View":**
      *   It's a variant of Neo-Roman Republicanism (Pettit/Skinner lineage) but emphasizes *procedural claimability* over just *capacity to interfere*.
      *   It shifts the metric from *probability of interference* to *structural dependence*.
      *   It risks conflating *freedom* with *legal status* or *institutional security*.

  3.  **Brainstorming Critiques (Mapping the Exposure):**

      *   *Collapse Argument 1 (Negative Liberty + Risk):* If "invocable standing" just means "high probability of non-interference guaranteed by rules," isn't that just Berlin + risk assessment?
          *   *Counter:* The view says the *source* matters, not just the probability. But if the outcome is identical, is the distinction metaphysical or normative?
      *   *Collapse Argument 2 (Legalism/Statism):* If freedom requires "invocable standing," does it require a state? What about customary law?
          *   *Risk:* Makes freedom co-extensive with legal personality. Anarchist critique bites hard here.
      *   *The "Kind Master" Variants:*
          *   *Incapacitated Master:* If the master *cannot* interfere (stroke, magic spell), is there domination? The view says yes if standing is lacking. This seems counter-intuitive.
          *   *Self-Enforcing Contract:* If the master is bound by a mechanism he can't break, is the slave free? The view says no if she can't *invoke* it herself.
      *   *Ubiquity/Expansiveness:* Parents dominate children? Doctors dominate patients? If domination is everywhere, it loses critical bite.
          *   *Defense:* Maybe domination is bad *only* in political contexts? But the theory claims to be about liberty generally.
      *   *Empirical/Psychological:* If people *feel* free under benevolent discretion, does that matter?
          *   *View's stance:* No, freedom is objective status.
          *   *Critique:* If a theory of liberty diverges completely from the phenomenology of liberty, is it still a theory of *liberty*?
      *   *Definitions:* "Arbitrariness" = "not tracking interests." "Tracking" = "survives contestation." This is circular.
          *   *Risk:* Tautology.

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the view. Set the tone (rigorous critique).
      *   **Section 1: The Collapse Worries.** Address the Negative Liberty reduction and the Legalist reduction.
      *   **Section 2: The Statelessness & Anarchist Objection.** Address the "Law = Freedom" implication.
      *   **Section 3: The Expansiveness Problem.** Address private power (parents, employers).
      *   **Section 4: Conceptual Insulation & Empirical Evidence.** Address the definitions and the "felt freedom" issue.
      *   **Section 5: The Contented Slave Intuition.** Press the edge cases (incapacitated master).
      *   **Section 6: Policy Exposure & Verdict.** Where does this break in the real world? Is it worth defending?

  5.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Collapse:* Need to distinguish between *expected value* (Berlin+) and *structural status*. If the kind master is 99.9% reliable, Berlin says "mostly free." Invocable-standing says "unfree." The divergence is real. *But*, is it freedom or *dignity*? That's a fatal category error risk.
      *   *Legalism:* If customary norms allow invocation, maybe it survives. But if "invocable" implies a court/state, then yes, it's statist. The anarchist objection is strong: it makes freedom a gift of the sovereign.
      *   *Ubiquity:* The view needs a threshold. Not all discretion is domination. Needs a "magnitude of power" clause. Otherwise, a teacher dominating a student is the same *kind* of evil as a master dominating a slave. That dilutes the concept.
      *   *Definitions:* The "tracking interests" definition is the weak link. Who decides interests? If the subject decides, it's positive liberty. If the law decides, it's legalism.
      *   *Slave Cases:* The incapacitated master is the killer. If the master is in a coma, the slave has no standing, but the master has no capacity. Calling this "domination" stretches the word until it snaps. It reveals the view cares more about *status* than *power*.
      *   *Policy:* Basic Income vs. Means Testing is the classic test. But what about private arbitration? If I sign a contract waiving rights, is that domination? The view says yes (no standing). Negative liberty says no (consent). This is a high-stakes divergence.

  6.  **Refining the Tone:**
      *   Must be academic, sharp, but constructive.
      *   Avoid "You should read X."
      *   Focus on internal consistency and external plausibility.
      *   Rank the objections clearly.

  7.  **Final Review against Constraints:**
      *   Did I answer the collapse worry? Yes.
      *   Did I address the anarchist objection? Yes.
      *   Did I cover the empirical/psychological aspect? Yes.
      *   Did I handle the incapacitated master? Yes.
      *   Did I give a verdict? Yes.
      *   No bibliography? Checked.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest Pettit explicitly.
      *   *Correction:* Prompt says refer to thinkers only where inseparable. The view is clearly Pettit-adjacent, but I should focus on the *logic* of the view provided, not exegesis of Pettit. I will mention the lineage generally but focus on the arguments.
      *   *Check:* Make sure I don't defend the view. The prompt asks for a map of exposure and a verdict on whether it's *worth defending*, not a defense of the view itself.
      *   *Emphasis:* Highlight the distinction between *freedom* and *security/status*. This is the core vulnerability.

  9.  **Final Polish:** Ensure the ranking of defeaters is clear (Fatal vs. Irritating). Ensure the policy predictions are concrete. (Proceed to generate output).

  *(Self-Correction Note on "Invocable Standing"):* The user coined this term ("invocable-standing view"). I need to treat it as their specific formulation, even if it overlaps with Pettit's "non-domination." I should critique *this* specific formulation, noting where it might be stricter or looser than standard republicanism.

  *(Key Insight for the Verdict):* The view is worth defending *if* it can successfully argue that "status" is a constituent of liberty, not just a means to security. If it fails that, it collapses into dignity or welfare.

  *(Let's write.)*
answer: |-
  This is a sophisticated formulation. You have distilled the neo-Roman intuition into a procedural test—*invocable standing*—that avoids some of the vagueness of "arbitrariness" while retaining the structural focus of republicanism. However, by tightening the definition, you have also tightened the noose around your own neck. The view is vulnerable not because it is incoherent, but because it risks conflating *liberty* with *legal security* and *dignity*.

  Here is a map of the exposure, ranked from fatal conceptual collapses to merely irritating empirical divergences, followed by a verdict on whether the view is worth defending.

  ### 1. The Collapse Worries

  **A. The Negative Liberty Reduction (Fatal Risk)**
  The worry is that "invocable standing" is just a proxy for "high probability of non-interference." If a master is kind and predictable, the *expected value* of interference is low. If the law is answerable, the *risk* of interference is capped.
  *   **The Test:** For your view to survive, there must be a case where invocable standing is high but interference is high, or standing is low but interference is near-zero, and your verdict on *freedom* diverges from the negative liberty verdict.
  *   **The Vulnerability:** If you say the kind slave is unfree *only* because the master *could* change his mind, you are talking about risk probabilities. A negative libertarian can accommodate this by saying, "Freedom is the absence of interference, but we value security highly." If you say the slave is unfree *even if* the master literally cannot change his mind (e.g., biological incapacity), you avoid the reduction, but you invite the "metaphysical status" objection (see Section 5).
  *   **Defeat Condition:** If it turns out that every instance of "lacking standing" correlates perfectly with "high risk of interference," your view adds no descriptive power, only normative emphasis. You must show cases where standing protects against low-probability but high-stakes interference that negative liberty ignores.

  **B. The Legalist/Statist Reduction (Fatal Risk)**
  You define standing as the ability to "point to arrangements... and invoke." This sounds like a legal power.
  *   **The Vulnerability:** If "invocable" requires a court, a state, or a codified rule, then freedom becomes co-extensive with legal personality. This validates the anarchist objection: you are defining liberty as "the condition of being a recognized subject of a benevolent jurisdiction."
  *   **The Test:** Can a stateless community have invocable standing? If they have customary norms that allow a member to shame or sanction a violator, is that standing?
  *   **Defeat Condition:** If you answer "no" (because custom isn't codified/invocable in the right way), your view collapses into statism. It implies that the stateless are *necessarily* unfree, which makes the theory a justification for jurisdiction rather than an evaluation of liberty. If you answer "yes," you must explain how custom provides "standing" without a sovereign enforcer, which risks blurring the line between *power* (ability to sanction) and *standing* (right to sanction).

  ### 2. The Expansiveness and Ubiquity Objection

  **Rank: Irritating but Manageable**
  If discretionary beneficence is dominating, then parents, doctors, and employers dominate. If domination is ubiquitous, it loses its critical bite.
  *   **The Exposure:** You need a threshold of *magnitude*. A teacher's discretion over a grade is structurally identical to a master's discretion over a slave's manumission, but intuitively distinct in moral weight.
  *   **The Fix:** You must introduce a scalar element. Domination requires not just discretionary power, but power over *fundamental interests* or *basic agency*.
  *   **The Cost:** Once you add "fundamental interests," you risk sliding into positive liberty (defining what interests matter). If you don't add it, you are committed to calling a parent's discretion over a child's bedtime "domination."
  *   **Verdict:** This is not fatal. You can argue that domination is ubiquitous but *wrongful* domination is context-dependent. However, if you claim the *concept* of domination applies equally to the tyrant and the parent, you dilute the term until it is useless for political theory.

  ### 3. Conceptual Insulation and Definitions

  **Rank: Serious Conceptual Worry**
  You define arbitrariness as "failure to track interests" and tracking as "what survives contestation."
  *   **The Circularity:** Who determines if interests are tracked? If the subject decides, it's subjective. If the law decides, it's circular (the law tracks interests because it allows contestation, and contestation works because the law tracks interests).
  *   **The Insulation:** This definitional loop makes the view unfalsifiable. Any successful contestation proves the system tracks interests; any failed contestation proves the interest wasn't valid or the procedure wasn't followed.
  *   **Empirical Discrimination:** You ask if survey evidence matters. If people in arbitrary-but-benign conditions report feeling free, your view says they are wrong (false consciousness).
  *   **The Risk:** If a theory of liberty systematically contradicts the phenomenology of liberty for 90% of the population, it is no longer a theory of *liberty*; it is a theory of *objective status* or *dignity*.
  *   **Defeat Condition:** If you cannot specify an independent criterion for "tracking interests" other than "the procedure was followed," the view is tautological. You need an external metric (e.g., welfare, autonomy) to judge if interests were actually tracked. If you refuse that, you are a proceduralist who cannot explain why the procedure matters.

  ### 4. The Contented Slave Intuition (The Edge Cases)

  **Rank: Fatal if Mishandled**
  This is your core intuition pump. It must hold under pressure.

  **Case A: The Incapacitated Master**
  The master is in a permanent coma. He cannot interfere. He cannot change his mind. The slave is cared for by an automated system funded by the master's estate.
  *   **Your View:** The slave lacks invocable standing. The arrangement rests on the master's past disposition, not the slave's claim. Therefore, the slave is dominated.
  *   **The Objection:** There is no *agent* capable of domination. Domination is a relational concept requiring a dominator. If the master is a vegetable, where is the power relation?
  *   **The Cost:** If you say "still dominated," you admit that domination is a *status* independent of *power*. This confirms the "legalist reduction" worry. You are arguing the slave is unfree because of a *label*, not a *threat*.
  *   **Defensible?** Only if you argue that the *structure* remains (the estate executors could sell the slave). If the structure is truly frozen, calling it domination is a category error.

  **Case B: The Self-Enforcing Contract**
  The master is bound by an irrevocable, magical, or technological constraint that makes interference physically impossible.
  *   **Your View:** If the slave cannot *invoke* this constraint (e.g., she doesn't know the code, or only the master can trigger the safety), she is dominated.
  *   **The Objection:** This makes freedom dependent on *knowledge* and *procedural access*, not actual security.
  *   **Defensible?** Yes, this is your strongest ground. It highlights that *dependence* is the evil, not just *interference*. Even if the chain is unbreakable, if the key is in another's pocket, you are dependent.
  *   **Verdict:** You must hold the line here. If you concede the slave is free in Case B, you collapse into negative liberty (no risk of interference). If you hold she is unfree, you must explain why *potential* access matters more than *actual* security.

  ### 5. Policy Predictions and Exposure

  Your view makes distinct predictions that expose it to empirical and normative refutation.

  **A. Basic Income vs. Means-Testing**
  *   **Prediction:** Means-testing is dominating even if generous; Basic Income is freedom-promoting even if lower value.
  *   **Exposure:** If a means-tested system has robust appeal rights (invocable standing), your view must concede it is non-dominating. If you insist discretion *always* dominates, you ignore that bureaucracies can be rule-bound.
  *   **Risk:** You might be forced to oppose efficient, targeted aid in favor of blunt, universal tools, leading to worse outcomes. If liberty requires Basic Income but Basic Income leads to starvation (due to cost), your theory demands we choose starvation for the sake of status.

  **B. Private Arbitration and Employment**
  *   **Prediction:** At-will employment is dominating. Arbitration clauses waiving the right to sue are dominating.
  *   **Exposure:** Negative liberty says these are free contracts. Your view says they surrender standing.
  *   **Risk:** This makes your view anti-contractual in the private sphere. If I *choose* to waive standing for higher pay, am I dominating myself? If yes, you need a theory of inalienable rights (positive liberty). If no, you admit standing can be waived, which undermines the claim that standing is constitutive of freedom.

  **C. Emergency Powers**
  *   **Prediction:** Ad hoc emergency powers are dominating even if necessary.
  *   **Exposure:** In a genuine crisis (pandemic, war), speed requires discretion.
  *   **Risk:** Your view might imply we should accept higher mortality/risk to preserve "invocable standing." This is a hard pill to swallow. If you say "no, emergency powers can be rule-bound," you are being unrealistic about the nature of emergencies.

  ### 6. Verdict: Is This Worth Defending?

  **Yes, but with a major caveat.**

  **Why it is worth defending:**
  The "invocable-standing" formulation clarifies the neo-Roman intuition better than the standard "capacity to interfere arbitrarily" definition. It shifts the debate from *risk assessment* (how likely is interference?) to *structural dependence* (who holds the keys?). This is a genuine contribution. It exposes the liberal blind spot regarding *dependence* even in the absence of *interference*. The policy implications regarding means-testing and administrative discretion are normatively potent and distinct from standard libertarian or utilitarian views.

  **The Caveat (The Condition for Survival):**
  You must successfully distinguish *Liberty* from *Dignity/Status*.
  *   **Fatal Flaw:** If your argument boils down to "The slave is unfree because it is undignified to beg," you have changed the subject. You are arguing for a theory of *social status*, not liberty.
  *   **Necessary Move:** You must argue that *dependence itself* restricts agency, regardless of feelings or outcomes. You need to show that the *need to anticipate another's will* (even a kind will) consumes cognitive and practical resources that constitute a loss of freedom.
  *   **The Legalist Trap:** You must avoid making "law" the sole source of standing. If you cannot account for standing in non-state contexts (custom, contract, social norms), your theory becomes a justification for state expansion, which undermines its critical potential.

  **Final Advice for the Chapter:**
  Do not try to defend the view against the "incapacitated master" case by saying the slave is still dominated. Concede that *domination* requires a potential agent, but argue that *structural dependence* remains. Refine the definition: Domination is the *availability* of arbitrary power *and* the lack of standing to check it. If the power is unavailable (coma), domination ceases, but the *risk of return* keeps the status precarious.

  Your strongest ground is the *epistemic* burden of discretion. Under discretion, the subject must invest energy in monitoring the powerful. Under standing, they do not. That cognitive tax is a real reduction of freedom. If you anchor the view there—in the *cost of dependence*—rather than in metaphysical status, you avoid the collapse into legalism and make a claim that negative liberty cannot easily absorb.

  **Ranking of Defeaters:**
  1.  **Fatal:** The Legalist Reduction (Freedom = Legal Personality).
  2.  **Fatal:** The Category Error (Liberty = Dignity/Status).
  3.  **Serious:** The Circularity of "Tracking Interests."
  4.  **Irritating:** Ubiquity of Domination (Parents/Teachers).
  5.  **Irritating:** Empirical Divergence (People feel free when you say they aren't).

  If you can plug the first two holes, the view is robust enough to warrant a chapter. If not, it is a theory of justice or dignity masquerading as a theory of liberty.
