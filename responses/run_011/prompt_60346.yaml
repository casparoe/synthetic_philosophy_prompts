answer: |-
  Your section leader is conflating three distinct theoretical moves that rely on different assumptions. Your hesitation is not pedantry; it identifies genuine fault lines in the foundations of solution concepts. Below is the menu of readings you requested, followed by the technical resolutions and an audit of your leader's consistency.

  ### Part I: A Menu of Readings for "Never Play a Dominated Strategy"

  To evaluate the slogan, we must fix four parameters for each reading:
  1.  **Dominance Type:** Strict ($>$) or Weak ($\geq$).
  2.  **Dominator:** Pure strategy only, or Mixed strategy allowed.
  3.  **Scope:** One-shot elimination, or Iterated elimination (IESDS/IEWDS).
  4.  **Utility:** Ordinal (ranking only) or Cardinal (von Neumann–Morgenstern expected utility).

  Here are the four candidate readings relevant to your seminar fragment.

  #### Reading 1: One-Shot Pure Strict Dominance
  *   **Claim:** A rational player never plays a pure strategy $s_i$ if there exists another pure strategy $s_i'$ such that $u_i(s_i', s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$.
  *   **Parameters:** Strict; Pure; One-shot; Ordinal.
  *   **Verdict:** **Platitude.** This follows directly from the definition of instrumental rationality (maximizing utility) without needing beliefs about the opponent.
  *   **Licenses Leader's Moves?**
      *   Discard D via mixture? **No.** (Requires mixed dominator).
      *   Order independence? **N/A.** (No iteration).
      *   Rationality alone? **Yes.**

  #### Reading 2: One-Shot Mixed Strict Dominance
  *   **Claim:** A rational player never plays a strategy (pure or mixed) if there exists a mixed strategy $\sigma_i$ such that $E[u_i(\sigma_i, s_{-i})] > u_i(s_i, s_{-i})$ for all $s_{-i}$.
  *   **Parameters:** Strict; Mixed; One-shot; **Cardinal (VNM)**.
  *   **Verdict:** **Substantive but Defensible.** It requires payoffs to be VNM utilities, not just ordinal rankings. The number "1.5" in your example is meaningless without linearity in probabilities.
  *   **Licenses Leader's Moves?**
      *   Discard D via mixture? **Yes.** (0.5U + 0.5M yields 1.5 > 1).
      *   Order independence? **N/A.** (No iteration).
      *   Rationality alone? **Yes** (provided VNM rationality is granted).

  #### Reading 3: Iterated Strict Dominance (IESDS)
  *   **Claim:** Rational players do not play dominated strategies, and they know others do not, and they know others know, etc. We delete dominated strategies, then look for new dominations in the reduced game.
  *   **Parameters:** Strict; Mixed (usually); **Iterated**; Cardinal.
  *   **Verdict:** **Substantive.** This requires **Common Knowledge of Rationality (CKR)**. It is not "rationality alone"; it is rationality + beliefs about beliefs.
  *   **Licenses Leader's Moves?**
      *   Discard D via mixture? **Yes.**
      *   Order independence? **Yes.** (The set of survivors is unique regardless of deletion order).
      *   Rationality alone? **No.** (Requires CKR).

  #### Reading 4: Iterated Weak Dominance (IEWDS)
  *   **Claim:** Same as Reading 3, but allowing weak dominance ($\geq$ with at least one $>$).
  *   **Parameters:** Weak; Mixed; Iterated; Cardinal.
  *   **Verdict:** **Genuinely Contested / False.** The set of survivors **depends on the order of deletion**. It is not a robust solution concept without specifying an order.
  *   **Licenses Leader's Moves?**
      *   Discard D via mixture? **Yes.**
      *   Order independence? **No.** (False claim).
      *   Rationality alone? **No.** (Weakly dominated strategies *can* be best responses to some beliefs; eliminating them requires refinements like trembling-hand perfection).

  ---

  ### Part II: Technical Resolutions

  #### 1. Order Independence: Strict vs. Weak
  Your leader claimed "the order in which you delete is irrelevant." This is true for **Strict** dominance but false for **Weak** dominance.

  *   **Strict Dominance:** If strategy $s$ is strictly dominated in game $G$, it remains strictly dominated in any subgame $G'$ obtained by deleting other strategies (provided the dominating strategy is not deleted). Thus, the final set of survivors is unique.
  *   **Weak Dominance:** Deleting a strategy can remove the specific column (or row) that made a strategy weakly dominated. If that column is removed first, the dominance relation vanishes.

  **Concrete Counterexample (Order Matters for Weak Dominance):**
  Consider a game where Row chooses {T, B} and Column chooses {L, R}. Payoffs are (Row, Col).

  ```
        L       R
  T   (2, 1)  (2, 0)
  B   (2, 0)  (1, 1)
  ```

  *   **Row's Payoffs:** T weakly dominates B ($2 \geq 2$ and $2 > 1$). The strict inequality comes from Column playing **L**.
  *   **Col's Payoffs:** L weakly dominates R ($1 \geq 0$ and $0 < 1$... wait, L does not dominate R here).
      *   Let's adjust Col's payoffs to ensure Col has a weak dominance too.
      *   Revised Col Payoffs: L gives 1 if T, 1 if B. R gives 0 if T, 1 if B.
      *   Revised Matrix:
      ```
            L       R
      T   (2, 1)  (2, 0)
      B   (2, 1)  (1, 1)
      ```
      *   **Row:** T weakly dominates B (2=2, 2>1). Strict inequality at **L**.
      *   **Col:** L weakly dominates R (1>0, 1=1). Strict inequality at **T**.

  **Deletion Order 1 (Row moves first):**
  1.  Row deletes B (weakly dominated by T).
  2.  Game reduces to Row=T vs Col {L, R}.
  3.  Col payoffs: L=1, R=0. L strictly dominates R.
  4.  Col deletes R.
  5.  **Survivor:** (T, L).

  **Deletion Order 2 (Col moves first):**
  1.  Col deletes R (weakly dominated by L).
  2.  Game reduces to Col=L vs Row {T, B}.
  3.  Row payoffs against L: T=2, B=2.
  4.  T **no longer dominates** B (the strict inequality was at R, which is gone).
  5.  **Survivors:** {(T, L), (B, L)}.

  **Verdict:** The sets of survivors differ. Your leader's claim of order independence is false if weak dominance is permitted.

  #### 2. Dominated vs. Never Best Response (NBR)
  You asked if eliminating strictly dominated strategies coincides with eliminating strategies that are never a best response.

  *   **Pure Dominance vs. NBR:** A pure strategy can be undominated (by any pure strategy) yet never be a best response. (Example: Rock-Paper-Scissors; all are undominated, all are best responses to something. Bad example. Better: A strategy strictly dominated by a *mixed* strategy is never a best response, but might not be dominated by any *pure* strategy).
  *   **Mixed Dominance vs. NBR (Pearce's Lemma):** A strategy is strictly dominated by a **mixed** strategy if and only if it is **never a best response** to any belief over the opponents' strategies.
  *   **The Catch (Correlated vs. Independent Beliefs):**
      *   If the player's belief about opponents allows for **correlation** (e.g., "I believe if Opponent 1 plays L, Opponent 2 plays L"), then **Strictly Dominated $\iff$ Never Best Response**.
      *   If beliefs must be **independent** (product measures, standard in Nash Equilibrium), the equivalence breaks. A strategy might not be a best response to any *independent* belief, yet not be strictly dominated by any mixed strategy.
      *   **In your 2-player game:** Correlation is irrelevant (only one opponent). So, in your specific fragment, D is strictly dominated by a mix $\iff$ D is never a best response to any belief about Column.
      *   **Verification:** D yields 1. U yields 3 or 0. M yields 0 or 3.
          *   If Col plays L with prob $p$:
          *   $E[U] = 3p$
          *   $E[M] = 3(1-p)$
          *   $E[D] = 1$
          *   Is D ever a best response? We need $1 \geq 3p$ AND $1 \geq 3(1-p)$.
          *   $p \leq 1/3$ AND $1-p \leq 1/3 \Rightarrow p \geq 2/3$.
          *   Contradiction. There is no $p$ such that D is a best response.
          *   Thus, D is Never a Best Response. Thus, D is Strictly Dominated by a mix.

  #### 3. The "Observable Coin" Objection
  You objected: *"a mixture is not something anyone literally plays — surely if Column could watch the coin land, the comparison would not go through."*

  *   **Does it have force?** **No,** not in the context of a standard Normal Form game.
  *   **Reasoning:** The Normal Form presupposes **simultaneity**. Column does *not* see the coin land before choosing L or R. Column chooses a strategy against the *distribution* of Row's play. If Column could see the coin, the game would be Sequential (Stackelberg), and the payoff matrix would change.
  *   **Interpretation of Mix:** Whether Row flips a coin (randomization) or Column is uncertain about Row's choice (belief) is observationally equivalent in a simultaneous game. The expected payoff calculation holds in both cases.
  *   **The Real Vulnerability:** Your objection about the coin is misplaced, but your suspicion about **Utilities** is correct. To say "1.5 is better than 1," the payoffs must be VNM utilities. If they are ordinal (e.g., 1st, 2nd, 3rd place), the average of 1st and 3rd is not necessarily better than 2nd. The leader implicitly assumes Cardinal Utility.

