  ### Part III: Audit of the Section Leader

  Your leader made three assertions in one breath. They are mutually inconsistent.

  1.  **"D is eliminated... fifty-fifty mixture... strictly dominates D."**
      *   **Requirement:** Mixed Strict Dominance.
      *   **Implicit Assumption:** Payoffs are **Cardinal (VNM)**.
  2.  **"The order in which you delete is irrelevant."**
      *   **Requirement:** Iterated **Strict** Dominance.
      *   **Implicit Assumption:** We are doing Iterated Elimination (IESDS).
  3.  **"The whole procedure presupposes nothing beyond the rationality of the players, no... beliefs about beliefs."**
      *   **Requirement:** One-Shot Rationality.
      *   **Conflict:** Iterated Elimination (Claim 2) **requires** Common Knowledge of Rationality (Beliefs about beliefs). You cannot justify deleting a strategy in Round 2 without assuming the opponent deleted a strategy in Round 1.
      *   **Conflict:** Mixed Dominance (Claim 1) **requires** Cardinal Utility. "Rationality alone" in a general sense often implies only Ordinal preferences (completeness and transitivity).

  **Conclusion:** Your leader is teaching **Iterated Elimination of Strictly Dominated Strategies (IESDS) with Mixed Strategies**, but justifying it with the epistemic conditions of **One-Shot Pure Dominance**.
  *   He is **right** that D should be discarded (Reading 2/3).
  *   He is **right** that order doesn't matter (Reading 3).
  *   He is **wrong** that this rests on "rationality alone" without beliefs about beliefs (Iterated steps require CKR).
  *   He is **wrong** to dismiss the utility type (Ordinal vs. Cardinal matters for mixtures).

  **Recommendation for Next Session:**
  Do not challenge the "observable coin" point; it is standard normal-form theory. Instead, ask: *"If we are iterating the deletion, doesn't the second round require us to believe the opponent is rational, rather than just being rational ourselves? And if we use mixtures to dominate D, aren't we assuming these numbers are VNM utilities rather than ordinal rankings?"* This targets the actual inconsistencies in his epistemic and measurement assumptions.
