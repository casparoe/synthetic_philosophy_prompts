answer: |-
  Here is the 75-minute plan, sequenced to prevent the three specific failures you encountered last year.

  ### The Dependency Order

  1.  **Maxim Formulation (15 mins):** This must be its own step. You cannot fix "gerrymandering" (Problem #2) during universalization; you must prevent it at the source. If the maxim is wrong, the test is void.
  2.  **Contradiction in Conception (CC) (20 mins):** Teach this as "Logical/Physical Impossibility." This is where you block Rule-Utilitarianism (Problem #1).
  3.  **Contradiction in Will (CW) (20 mins):** Teach this as "Rational Inconsistency." This is where you block Prudence (Problem #3).
  4.  **Application (15 mins):** Students run the test on a new case.
  5.  **Debrief & Cut (5 mins):** Address limitations and strong students.

  **On the "Law of Nature" Formula:** Do not introduce it as a separate formula. Use it *only* as the visualization mechanism for the test. Say: *"When we universalize, imagine your maxim becomes a law of nature, like gravity."* This prevents the "what is natural?" confusion.

  **On CC vs. CW:** Tell them it is **one test with two depths of failure**.
  *   *Depth 1 (CC):* The action becomes impossible in the universalized world.
  *   *Depth 2 (CW):* The action is possible, but a rational agent cannot *will* it without contradicting their own will.
  *   *Why:* Treating them as separate tests invites students to think they are distinct moral criteria. Treating them as depths keeps the focus on the *structure of the will*.

  ---

  ### The Examples: What to Keep, What to Drop

  **Drop:**
  *   **The Suicide Example:** You are right. It relies on a teleological premise about "self-love" that requires more metaphysics than you have time for. Flag this only if a strong student asks why Kant thinks suicide is necessarily irrational.
  *   **The Borrowed Money (False Promise):** Drop it. It is the primary vector for the Rule-Utilitarian collapse (Problem #1). Students inevitably argue "promising would cease to exist" rather than "my specific act becomes impossible."
  *   **Perfect/Imperfect Duty Labels:** Cut them. They are taxonomic jargon that distracts from the *mechanism* of the test. You can mention them in passing if a student reads ahead, but do not put them on the board.

  **Keep:**
  *   **The Talent Example (Non-Development):** This is your anchor for **CW**. It is robust against utilitarian reasoning because the failure is internal to the agent's will (willing a world where one cannot achieve one's own ends), not external social collapse.

  **The New Case (Postdoc Citation Padding):**
  *   **Honest View:** It works for **CC**, but it is dangerous. It tempts the "institution collapse" argument (Problem #1). If everyone pads, citation metrics lose value, so the *system* breaks. That sounds utilitarian.
  *   **Does it carry both failure modes?** No. It is a CC case (the end becomes impossible). It is very hard to argue it is a CW case (you *can* will a world where everyone pads citations; you just wouldn't want to live in it).
  *   **Recommendation:** Use a **"Lie to Escape Social Obligation"** case for your *teaching* of CC. It is cleaner.
      *   *Maxim:* "I will state that I am sick when I am not, to avoid a party."
      *   *Universalize:* Everyone states they are sick to avoid parties when they aren't.
      *   *Contradiction:* The concept of "stating one is sick" loses its meaning/trust. The act becomes impossible.
      *   *Why:* It avoids "institution of promising" but keeps the CC structure.
  *   **Backup:** If you insist on the Postdoc case, you must rigorously police the reasoning. The failure must be: *"My goal is to signal productivity via citations. If everyone pads, citations no longer signal productivity. My goal becomes impossible to achieve via this means."* If they say "Science would suffer," stop them. That is utilitarian.

  ---

  ### The 75-Minute Sequence

  #### 0:00 – 0:15 | Step 1: Maxim Formulation (Defusing Problem #2)
  **Goal:** Fix the input so the output isn't garbage.
  **Board:** Write the template: *"I will do [Action] in [Circumstance] to achieve [End]."*
  **Activity:** Give them a scenario: *You see a wallet on the street. You keep it.*
  **Task:** Write three versions of the maxim.
  1.  Too narrow: "I will keep this wallet." (Fails universalizability trivially).
  2.  Too broad: "I will take what I find." (Misses the specific intent).
  3.  Correct: "I will keep lost property when I can get away with it to increase my wealth."
  **Defusing Problem #2 (Gerrymandering):**
  *   *When:* Minute 10, after they share versions.
  *   *The Sentence:* **"If you leave your real reason out of the maxim, you aren't testing your action; you're testing a stranger's."**
  *   *The Rule:* The maxim must include the *principle* you are acting on, not just the physical movement.

  #### 0:15 – 0:35 | Step 2: Contradiction in Conception (Defusing Problem #1)
  **Goal:** Distinguish Logical Impossibility from Bad Consequences.
  **Case:** The "Lie to Escape Party" (see above).
  **Process:**
  1.  Write the Maxim on the board.
  2.  Ask them to imagine the "Law of Nature" world (everyone lies to escape parties).
  3.  Ask: "Can you still achieve your end?"
  **Defusing Problem #1 (Rule-Utilitarianism):**
  *   *When:* Minute 25, when a student says "But then no one would believe anyone!"
  *   *The Sentence:* **"Don't tell me the *system* breaks. Tell me why *your specific action* becomes impossible in that world."**
  *   *The Correction:* If they say "Trust would collapse," write "Utilitarianism" on the side and cross it out. Force them to say: "In that world, stating 'I am sick' no longer functions as a signal. My act loses its meaning."
  *   *Key Distinction:* Utilitarianism counts *bad outcomes*. Kant checks for *logical/functional impossibility*.

  #### 0:35 – 0:55 | Step 3: Contradiction in Will (Defusing Problem #3)
  **Goal:** Distinguish Rational Inconsistency from Personal Dislike.
  **Case:** Kant's Talent Example (Letting talents rust).
  **Process:**
  1.  Maxim: "I will neglect my talents to pursue a life of ease."
  2.  Universalize: A world where everyone neglects talents.
  3.  Ask: "Is this world possible?" (Yes, humanity could survive).
  4.  Ask: "Can a rational agent *will* this?"
  **Defusing Problem #3 (Prudence):**
  *   *When:* Minute 45, when a student says "But you'd be miserable/hungry."
  *   *The Sentence:* **"It doesn't matter if you'd be unhappy. It matters if you are willing a world that undermines the very capacity to will ends at all."**
  *   *The Explanation:* We necessarily will the means to our ends (as rational agents). Talents are means to ends. Willing the destruction of all talents contradicts the will to have ends. It is a structural contradiction, not an emotional one.

  #### 0:55 – 1:10 | Step 4: Application (The Assessment)
  **Goal:** Verify they can run the mechanism, not just recite it.
  **Case:** The Postdoc Citation Case (or your chosen backup).
  **Task:** In pairs, write the Maxim, Universalize, and Identify the *Specific Contradiction*.
  **Success Criteria:** They identify that the *means-end relationship* breaks (CC) or that the *will undermines itself* (CW).
  **Failure Criteria:** They argue that "Academic integrity would collapse" or "It would be unfair to honest researchers."
  **TA Role:** Circulate. If you hear "unfair" or "collapse," interrupt immediately: *"That is a consequence. What is the contradiction?"*

  #### 1:10 – 1:15 | Step 5: Wrap & Bait
  **Goal:** Acknowledge limits without derailing the lesson.
  **Script:** "Today we treated the test as a mechanical tool. Next week we'll ask if the tool itself is biased. For those reading ahead: Kant assumes 'self-love' has a specific purpose in the suicide example, and he assumes 'rational will' always seeks means to ends in the talent example. If you reject those premises, does the test hold? Think about that for your essay."
  **Cut:** Do not open the floor to debate the premises now. You will run out of time.

  ---

  ### Misconceptions: Order, Defusal, and Script

  | Order | Misconception | Point of Defusal | Defusing Sentence / Question |
  | :--- | :--- | :--- | :--- |
  | **1** | **Gerrymandering** (Maxim is too narrow/broad to rig the result). | **Min 10** (Maxim Formulation) | "If you leave your real reason out of the maxim, you aren't testing *your* action; you're testing a stranger's." |
  | **2** | **Rule-Utilitarianism** (Focusing on institutional collapse/bad outcomes). | **Min 25** (CC Test) | "Don't tell me the *system* breaks. Tell me why *your specific action* becomes impossible in that world." |
  | **3** | **Prudence** (Focusing on personal unhappiness/dislike). | **Min 45** (CW Test) | "It doesn't matter if you'd be unhappy. It matters if you are willing a world that undermines the very capacity to will ends at all." |

  ---

  ### The Final 10 Minutes: The "Mechanism Check"

  **Activity:** Give them a pre-written Maxim and a pre-written Universalized World. Ask them to diagnose the failure.
  *   *Maxim:* "I will make a false promise to repay money when I am in need."
  *   *Universalized World:* Everyone makes false promises when in need.
  *   *Prompt:* "Does this fail at Conception or Will? Write one sentence explaining the *contradiction*."

  **Success:** "It fails at Conception. In this world, the concept of a 'promise' implies trust, which no longer exists, so the act of 'promising' is impossible."
  **Failure:** "It fails because people would get hurt and banks would stop lending." (This is utilitarian).
  **Failure:** "It fails at Will because I wouldn't want to live in that world." (This is prudence).

  **Why this works:** It isolates the *reasoning mechanism* from the *verdict*. They can't memorize "False Promise = Wrong." They have to identify the *structure* of the wrongness.

  ### Blunt Advice on Cutting

  1.  **Cut the Suicide Example:** It requires a teleological theory of instincts that distracts from the *form* of the test. If a student asks, say: "Kant relies on a premise about the function of self-love there. We are focusing on the *structure* of the test today, not his specific anthropology."
  2.  **Cut Perfect/Imperfect Duty:** These are labels applied *after* the test. Teaching them *during* the test confuses the *criterion* (universalizability) with the *classification* (duty type).
  3.  **Do Not Defend the Premises:** You do not have time to defend why "rational wills necessarily will the means to their ends." State it as the rule of the game for this section. If they challenge it, validate the challenge ("Good objection, that's a deep metaphysical worry") but park it ("Let's see if the test works mechanically first").

  ### Summary of Dependencies
  1.  **Maxim** must be locked down before **Universalization**.
  2.  **CC** must be distinguished from **Utilitarianism** before moving to **CW**.
  3.  **CW** must be distinguished from **Prudence** before **Application**.
  4.  **Application** must require identifying the **Contradiction**, not just the **Verdict**.
