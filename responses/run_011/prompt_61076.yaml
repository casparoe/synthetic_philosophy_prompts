      *   **Revised Conclusion (7*):** "Therefore, an M-using agent's predictions are vulnerable to steering *if and only if* the simplest programs generating her data stream are controlled by consequentialist agents, which depends on the relative Kolmogorov complexity of base reality vs. simulated reality."

  6.  **Refining the "Exit":**
