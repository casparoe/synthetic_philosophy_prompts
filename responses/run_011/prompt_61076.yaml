      *The "Malign" claim relies on the idea that simulations are simpler.*
      *The "Exit":* The argument proves that malign agents *exist in the mixture* (Step 6). It does *not* prove they *dominate the posterior* (Step 7). Domination depends on the specific complexity of *your* universe vs. the complexity of a universe containing a simulation of *your* universe.
      *Wait, there's a deeper equivocation in (7).* "Steer her predictions."
