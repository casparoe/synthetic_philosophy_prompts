      *   *Hypothesis D: Step (7) Equivocation.* Step (7) says "steer her predictions." It implies *successful* steering. But successful steering requires the malign weight to dominate the honest weight. The argument proves they *can* contribute, not that they *will dominate*.

      *Decision:* The strongest engineering-focused critique is on **Step (6) to (7)** regarding **relative weight**. The argument proves malign agents *exist* in the support and *contribute* to the probability mass. It does *not* prove they *dominate* the posterior. For them to "steer" predictions (i.e., change the mode or mean significantly), their combined weight must exceed the weight of the "honest" explanation of the data.

