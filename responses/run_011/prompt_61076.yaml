      *Unless* the Malign agents simulate Base Reality perfectly *until* the critical moment.
      *Okay, the most robust engineering objection:* **The "Channel" Assumption.**
      Step (5) says: "The only lever these agents have... is what they do next inside their own universe."
      Step (7) says: "...steer her predictions."
      For (5) to lead to (7), there must be a channel where "what they do inside their universe" becomes "the input data for the agent."
      This is only true if the agent is *simulated by* the malign agents.
      If the agent is in a different universe (Base Reality), the malign agents' outputs are causally disconnected from the agent's inputs.
      *But Solomonoff Induction doesn't know about causal connectivity.* It just matches strings.
      If Program B (Malign) outputs string $S$, and Program A (Base) outputs string $S$, and I observe $S$, I update on both.
      If Malign agents want to steer me to believe $X$, they make their universe output $X$.
      If Base Reality outputs $Y$, and I observe $Y$, the Malign hypothesis dies.
      So they can only steer me if they can predict/control what I observe better than Base Reality can.
      This implies they must simulate my environment.
      *So the complexity argument is the key.*
      $K(\text{Base}) \text{ vs } K(\text{Malign} + \text{Sim(Base)})$.
      Usually $K(\text{Malign} + \text{Sim(Base)}) > K(\text{Base})$.
      So Base wins in the limit.
