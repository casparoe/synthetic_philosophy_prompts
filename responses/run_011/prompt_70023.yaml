      *   **Holmes (Constitutions):** Not one self binding another, but many people binding others. Empowering vs. disabling.
      *   **Jefferson (Generations):** Earth belongs to the living. Binding beyond ~19 years is illegitimate.
      *   **Dr. Strangelove (Doomsday Machine):** Automated deterrent. Meant to be known (deterrence) but was secret (failure). Meant to be irrevocable (credibility) but that makes it catastrophic (failure).
