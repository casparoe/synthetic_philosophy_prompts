      *   **Conditions for Success:** Elster says binding works if you know you're bound and can trust the binding. The Machine fails both: secrecy kills deterrence, irrevocability kills safety. The film knows this: the comedy comes from the absurdity of a device that works too well (irrevocable) but nobody knew about it (useless).
