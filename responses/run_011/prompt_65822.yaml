prompt: |-
  I head the measurement and incentives team at a regional social-services authority. We write the performance measures and payment targets that go into our contracts with outside providers — employment placement, supported housing for people leaving homelessness, home-care visits for older adults — and those measures move real money and real provider behaviour. Roughly thirty proposals reach me each quarter: some from programme managers who want a measure, some from providers who want an easy one, some from my own analysts who think they have found something better. What I need is a screening procedure my analysts can run on a proposal in under an hour, before it comes to me for sign-off, and that they can run without a background in statistics or philosophy.

  The procedure should be built on a working view of mine, which I want you to develop and stress-test rather than accept as settled. The four-way taxonomy of Goodhart failures that circulates in the alignment literature — regressional, extremal, causal, adversarial — sorts failures by their statistical structure, and that is not the axis on which my office can act. What I can act on is the remedy. My suspicion is that at least three distinct failures get reported to me under the single heading "this measure can be gamed," and that the reporting is useless precisely because the heading hides them:

  - Gaming proper: the provider can raise the score without raising the client outcome. The remedy is verification, audit, clawback.
  - Leakage: the improvement is genuine, but it is bought by shifting effort from an unmeasured part of the caseload or the task to the measured part, so that outcomes rise for some clients and fall for others while the aggregate score improves. The remedy is widening or pairing the measure; nobody has done anything wrong and an audit would be a waste.
  - Drift: everyone behaves honestly, and the proxy–outcome relationship decays anyway because the caseload, the labour market, the technology or the service model changes underneath it. The remedy is re-baselining and a shorter review cycle, and no amount of contracting cleverness prevents it.

  These three have different symptoms, different responsible parties and different contractual consequences. I want the procedure to force a classification rather than allow an analyst to stop at "at risk of Goodharting."

  Against that background, the deliverable should contain:

  1. The questions in the order an analyst should ask them, and for each one, what counts as a sufficient answer — not "consider whether the proxy tracks the outcome," but the specific evidence or line of reasoning that entitles a non-expert to move on. Where a question cannot be answered from data we would plausibly hold (we get quarterly provider returns and a small client experience survey; we do not get anything randomised, and we rarely get outcome data beyond twelve months), say so, and give the fallback and its cost.

  2. A sharpening of the test I currently apply by hand: the analyst must write down the three cheapest ways a provider could lift the score substantially within one contract year, and then state for each whether the client outcome moves with it. Tell me how to make that step something other than an exercise in imagination — what to prompt for, whose testimony counts, how to check the list is not padded with implausible scenarios — and what the procedure should conclude when the analyst genuinely cannot think of any.

  3. The exit conditions. Where the procedure terminates in reject; where in accept with named monitoring; where in accept outright; and where it stops being a factual question and hands the decision to me because it turns on values — for instance, how much unmeasured harm to a subgroup we are willing to accept in exchange for a measure we can actually verify at reasonable cost. Mark those handoffs explicitly, and say what information I need at each one.

  4. Three worked applications, showing the questions being answered and not merely listed: (a) an employment provider measured by the number of clients in work at the six-month point; (b) a supported-housing provider measured by the proportion of residents who have not returned to homelessness at twelve months; (c) home-care provision measured by a vendor's algorithmic risk score predicting which clients will need emergency admission in the coming year, with payment attached to reductions in predicted risk. I expect (c) to break the procedure, since the object being optimised is a model whose own training data we generate, and I would rather see exactly how it breaks than see it handled smoothly. At least one of the three must come out against my interests: I have publicly committed to the employment measure, so if the procedure rejects or substantially rewrites it, say so without softening.

  5. An account of the reflexive problem. Once this procedure exists it becomes a target in its own right — programme managers and vendors will learn to fill in the boxes in whatever way gets their measure approved, and my analysts will learn which answers shorten the meeting. Tell me what to build in against that, and be candid if the honest answer is that no checklist can be made robust to being checklisted.

  6. A closing statement of what the procedure cannot do at all, together with your own assessment of how confident you are in the central claims you have made: in particular, how confident you are that gaming, leakage and drift form a real division rather than three descriptions of one underlying failure, and which single step of the whole procedure you are least sure about and why.

  Please do not include a bibliography or a reading list; refer to positions and arguments by their content and I will attach references myself if we publish this.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Head of Measurement and Incentives at a regional social-services authority.
      *   **Task:** Develop a screening procedure for performance measure proposals (contracts with providers).
      *   **Constraint 1 (Time/Skill):** Must be runnable by analysts in under an hour, without stats/philosophy background.
      *   **Constraint 2 (Theoretical Framework):** Reject the standard Goodhart taxonomy (regressional, extremal, causal, adversarial). Adopt the User's specific taxonomy: *Gaming* (score up, outcome flat), *Leakage* (score up, outcome shifted/harmed elsewhere), *Drift* (score/outcome link decays due to external change).
      *   **Deliverables:**
          1.  Ordered questions with sufficient answers/fallbacks (given data limitations).
          2.  Sharpening the "Three Cheapest Ways" test (make it concrete, not imaginative).
          3.  Exit conditions (Reject, Accept w/ Monitoring, Accept Outright, Escalate to Head).
          4.  Three worked examples (Employment, Housing, Algorithmic Risk). One must go against the User's interest (Employment). Example (c) must show breaking points.
          5.  Reflexive problem (procedure becoming a target) and mitigation.
          6.  Closing statement on limitations and confidence assessment (specifically on the Gaming/Leakage/Drift distinction).
      *   **Tone:** Professional, operational, candid, rigorous, no fluff/bibliographies.

  2.  **Analyze the User's Taxonomy:**

      *   *Gaming:* Fraud/Cheating/Loophole exploitation. Remedy: Audit/Clawback.
      *   *Leakage:* Cream-skimming/Parking/Neglect of unmeasured areas. Remedy: Broaden metrics.
      *   *Drift:* Contextual change breaks the proxy. Remedy: Re-baseline/Review.
      *   *Critique:* This is a *remedy-oriented* taxonomy, which is practical for contract management. The challenge is distinguishing them empirically with limited data.

  3.  **Drafting Section 1: The Question Sequence:**

      *   Need a funnel. Start with definitional clarity, move to incentives, then external factors.
      *   *Q1: Definition.* Is the measure clearly defined? (Pass/Fail).
      *   *Q2: The Link.* Why does this proxy equal the outcome? (Evidence needed).
      *   *Q3: The Incentive.* Can the score be moved without moving the outcome? (Gaming check).
      *   *Q4: The Trade-off.* Does moving the score hurt unmeasured clients/tasks? (Leakage check).
      *   *Q5: The Stability.* Will the link hold if the world changes? (Drift check).
      *   *Data Limitations:* User has quarterly returns + small survey. No RCTs, no long-term outcome data (>12 months). Need fallbacks (e.g., provider testimony, literature review, pilot data).

  4.  **Drafting Section 2: Sharpening the "Three Cheapest Ways" Test:**

      *   Current problem: It's too imaginative.
      *   Solution: Force specificity. Require *mechanism*, *cost estimate*, and *precedent*.
      *   *Prompt:* "Don't tell me they could 'cheat.' Tell me which form field they would alter."
      *   *Validation:* Cross-check with provider complaints or past audit findings.
      *   *Null Result:* If they can't find three, assume *Drift* is the primary risk, not Gaming.

  5.  **Drafting Section 3: Exit Conditions:**

      *   *Reject:* Gaming identified with no audit fix.
      *   *Accept w/ Monitoring:* Leakage risk (need paired measures) or Drift risk (need review cycle).
      *   *Accept Outright:* Low risk across all three.
      *   *Escalate (Head of Team):* Value judgments (e.g., acceptable leakage %), high uncertainty, or resource implications for auditing.

  6.  **Drafting Section 4: Worked Examples:**

      *   *(a) Employment (6-month job):* User is committed to this. I need to be honest. If the procedure flags Leakage (cream-skimming easy hires), I must report that.
      *   *(b) Housing (12-month no return):* Classic leakage risk (turning away hard cases).
      *   *(c) Algorithmic Risk:* This is the tricky one. Optimizing a model trained on your own data is recursive Goodharting. It should break the "Drift" vs "Gaming" distinction because the proxy *is* the target.

  7.  **Drafting Section 5: The Reflexive Problem:**

      *   Campbell's Law applies to the checklist itself.
      *   Mitigation: Random audits of the *analysts*, rotation of analysts, "Red Team" the proposal.
      *   Candor: No checklist is robust forever. Need human oversight.

  8.  **Drafting Section 6: Limitations & Confidence:**

      *   *Limitations:* Cannot predict black swans, cannot solve political pressure.
      *   *Confidence:* High on the utility of the taxonomy for *action*, lower on the empirical separability of Gaming vs. Leakage in practice (they often look the same in data).
      *   *Weakest Step:* Distinguishing Leakage from Drift without long-term data.

  9.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check:* Did I address the data limitations? Yes, emphasized quarterly returns + survey.
      *   *Check:* Is the Employment example harsh enough? The prompt says "At least one of the three must come out against my interests... if the procedure rejects or substantially rewrites it, say so without softening." I need to ensure the Employment measure triggers a "Leakage" warning that requires paired measures, effectively rewriting the contract strategy.
      *   *Check:* Is the Algorithmic example broken enough? It needs to show that the procedure fails because the "Outcome" is undefined (it's just the model score).
      *   *Check:* Tone. Needs to be authoritative but subordinate to the User's final decision.
      *   *Check:* Time limit. The questions must be answerable in <1 hour. Keep them tight.

  10. **Final Review against constraints:**
      *   No bibliography? Checked.
      *   Specific evidence for answers? Checked.
      *   Exit conditions clear? Checked.
      *   Reflexive problem addressed? Checked.
      *   Confidence assessment included? Checked.

  *(Self-Correction on the Employment Example)*: The user says "I have publicly committed to the employment measure." If the procedure rejects it, that's politically difficult. The procedure should likely flag it for *modification* (Accept with Monitoring/Pairing) rather than hard Reject, but the analysis must show *why* it's flawed (Leakage via cream-skimming). I will frame the exit as "Accept with Named Monitoring" but explicitly state the measure is insufficient on its own, requiring a counter-metric (e.g., intake acceptance rate). This fulfills the "against my interests" requirement by showing the measure is incomplete.

  *(Self-Correction on the Algorithmic Example)*: The prompt says "I expect (c) to break the procedure." I need to make sure the breakdown is explicit. The breakdown happens at Question 2 (Link between proxy and outcome) because the outcome *is* the proxy.

  *(Refining the "Three Cheapest Ways")*: Make sure to specify *who* provides the info. Front-line staff? Past audits?

  *(Refining the Reflexive Problem)*: Suggest "Shadow Proposals" or random re-evaluation.

  Let's assemble the document.

  *Structure:*
  1.  **The Screening Protocol (The Questions)**
  2.  **The "Three Cheapest Ways" Test (Operationalization)**
  3.  **Decision Matrix (Exit Conditions)**
  4.  **Worked Applications**
  5.  **The Reflexive Problem (Meta-Gaming)**
  6.  **Limitations & Confidence Statement**

  *Voice:* Direct, bureaucratic but sharp, analytical.

  *Key constraint check:* "Under an hour." The questions must be rapid.
  *Key constraint check:* "No stats background." Avoid p-values, talk about trends and anecdotes.

  *Let's write.*
answer: |-
  # The Measure Screening Protocol (MSP)

  **Purpose:** To classify performance measure proposals into Gaming, Leakage, or Drift risks within 60 minutes, using only quarterly returns and client survey data.
  **Operator:** Senior Analyst.
  **Input:** One measure proposal (definition, payment trigger, intended outcome).

  ---

  ## 1. The Question Sequence

  The analyst must answer these five questions in order. If a question fails, the procedure terminates at the relevant Exit Condition (see Section 3). Do not proceed to Question 5 if Question 2 fails.

  **Q1: The Definition Test**
  *   **Ask:** Is the measure defined such that two different auditors counting the same files would get the same number within a 5% margin?
  *   **Sufficient Answer:** Yes, provided a copy of the data dictionary and the specific database fields used for calculation are attached.
  *   **Insufficient Answer:** "It's in the contract," or reliance on provider self-certification without field-level specification.
  *   **Fallback:** If fields are ambiguous, request a sample data extract. If the extract contains nulls or free-text entries in key fields, **Terminate: Reject**.
  *   **Cost:** 15 minutes data check.

  **Q2: The Proxy Link**
  *   **Ask:** What evidence do we have that moving this number improves the client's life, rather than just our ledger?
  *   **Sufficient Answer:** Citation of a specific internal evaluation, a peer jurisdiction's report, or a longitudinal correlation from our own quarterly returns (e.g., "Clients who hit this target have 20% higher survey satisfaction").
  *   **Insufficient Answer:** "It seems logical," or "The provider says so."
  *   **Fallback:** If no data exists, require a pilot clause (measure exists but payment is zero for Year 1).
  *   **Cost:** 15 minutes literature/internal data search.

  **Q3: The Gaming Check (Score up, Outcome flat)**
  *   **Ask:** Can the provider change the data entry or administrative process to raise the score without changing service delivery?
  *   **Sufficient Answer:** A list of specific data fields that are self-reported and unverified, OR a process step that occurs after the measurement point (e.g., measuring "job start" before the first paycheck clears).
  *   **Insufficient Answer:** "Providers might lie." (Must specify *how*).
  *   **Fallback:** If the measure relies entirely on self-reported data with no audit trail, **Flag for Audit**.
  *   **Cost:** 10 minutes process mapping.

  **Q4: The Leakage Check (Score up, Unmeasured harm)**
  *   **Ask:** If a provider maximises this score, which clients or tasks get less attention?
  *   **Sufficient Answer:** Identification of a subgroup excluded by the measure (e.g., "long-term unemployed" excluded from "6-month job" measure) or a task unmeasured (e.g., "emotional support" unmeasured in "home-care visits").
  *   **Insufficient Answer:** "They might ignore hard cases." (Must name the *hard cases*).
  *   **Fallback:** Check intake data. If intake criteria are provider-controlled, **Flag for Pairing** (must add an intake/access measure).
  *   **Cost:** 10 minutes caseload review.

  **Q5: The Drift Check (Link decays)**
  *   **Ask:** What external change in the next 24 months would break the link between this measure and the outcome?
  *   **Sufficient Answer:** Identification of one specific variable (e.g., "Minimum wage rise," "New housing legislation," "Algorithm update") that changes the cost or feasibility of the outcome independent of provider effort.
  *   **Insufficient Answer:** "The economy might change."
  *   **Fallback:** If no specific variable is named, set a mandatory review clause at 12 months.
  *   **Cost:** 10 minutes environmental scan.

  ---

  ## 2. Sharpening the "Three Cheapest Ways" Test

  You currently ask analysts to imagine three ways a provider could lift the score. This is too abstract. To make this empirical and non-speculative, apply the following constraints:

  **1. The Mechanism Constraint**
  The analyst cannot list "cheating." They must identify the *lever*.
  *   *Bad:* "They could fake the employment records."
  *   *Good:* "They could classify a 5-hour/week gig as 'employment' using Field 4b in the return, which lacks an hours threshold."
  *   *Prompt:* "Point to the specific form field, contract clause, or workflow step."

  **2. The Precedent Constraint**
  At least two of the three ways must have happened before, either in your authority or a neighbouring one.
  *   *Evidence:* Past audit reports, provider complaint logs, or news stories about similar contracts.
  *   *If no precedent exists:* The analyst must interview one frontline case manager (not a manager) and ask: "If you were under pressure to hit this number, what's the first corner you'd cut?" Their testimony counts as evidence.

  **3. The Cost Estimate**
  For each way, the analyst must estimate the provider's cost to implement it.
  *   *Low Cost:* Administrative reclassification (e.g., changing a status code).
  *   *Medium Cost:* Process change (e.g., shifting staff time).
  *   *High Cost:* Capital investment or fraud risk.
  *   *Rule:* If all three ways are "High Cost," Gaming risk is low. If any are "Low Cost," Gaming risk is high.

  **The Null Result**
  If the analyst genuinely cannot find three ways (even with frontline testimony):
  *   **Conclusion:** Do not assume the measure is safe. Assume **Drift** is the dominant risk. The measure is likely too rigid or disconnected from operational reality for staff to see how to game it.
  *   **Action:** Proceed to Exit Condition "Accept with Monitoring (Drift)."

  ---

  ## 3. Exit Conditions

  The procedure terminates in one of four states. The analyst must tick the box and attach the evidence from the questions above.

  **A. Reject (Hard Stop)**
  *   **Condition:** Q1 fails (undefined) OR Q3 identifies a Low-Cost Gaming method with no feasible audit remedy.
  *   **Reasoning:** The measure creates financial liability for zero social value.
  *   **Handoff:** None. Return to Programme Manager.

  **B. Accept with Named Monitoring (Leakage Risk)**
  *   **Condition:** Q4 identifies a specific subgroup or task at risk of neglect.
  *   **Remedy:** The contract must include a **paired measure** protecting the unmeasured area (e.g., if measuring "job placements," pair with "intake acceptance rate").
  *   **Handoff:** None, provided the paired measure is added.

  **C. Accept with Monitoring (Drift Risk)**
  *   **Condition:** Q5 identifies a specific external variable, OR the "Three Cheapest Ways" test yields a Null Result.
  *   **Remedy:** Insert a **Sunset Clause**. The measure expires automatically at 12 months unless re-baselined.
  *   **Handoff:** None, provided the clause is inserted.

  **D. Escalate to Head of Team (Value Judgment)**
  *   **Condition:** Q4 identifies Leakage, but the "paired measure" is too costly or operationally impossible, OR the risk involves a value trade-off (e.g., "We accept 10% of hard cases being dropped to save 50% of easy cases").
  *   **Information Needed:**
      1.  The specific subgroup being risked (from Q4).
      2.  The estimated efficiency gain (from the proposal).
      3.  The analyst's recommendation on whether the trade-off is ethical.
  *   **Reasoning:** This is no longer a factual question about measurement; it is a political decision about resource allocation. I must sign this.

  ---

  ## 4. Worked Applications

  ### (a) Employment Provider: "Number of clients in work at 6-month point"
  *   **Q1 (Definition):** Pass. "Work" defined as 16+ hours, verified by payslip.
  *   **Q2 (Proxy Link):** Pass. Internal data shows 6-month retention correlates with 5-year earnings.
  *   **Q3 (Gaming):** **Fail.** *Cheapest Way 1:* Provider pressures clients to take 16-hour contracts that are known to be temporary (precedes exist). *Precedent:* 2021 Audit found 15% of placements lasted <7 months. *Cost:* Low (administrative pressure).
  *   **Q4 (Leakage):** **Fail.** *Risk:* Providers will stop accepting clients with barriers (criminal records, health issues) who are unlikely to hit 6 months. *Subgroup:* High-need caseload.
  *   **Q5 (Drift):** Pass. Labour market fluctuations acknowledged.
  *   **Procedure Output:** **Escalate to Head of Team (D).**
  *   **Analysis:** This measure fails your public commitment. It incentivises cream-skimming (Leakage) and unstable placements (Gaming). To proceed, you must accept the ethical trade-off of excluding high-need clients, or rewrite the contract.
  *   **Recommendation:** Do not accept outright. You must pair this with an "Intake Demographics" measure to ensure they aren't parking the hard-to-serve. If you will not fund the paired measure, this proposal should be **Rejected**.

  ### (b) Supported Housing: "Proportion of residents not returned to homelessness at 12 months"
  *   **Q1 (Definition):** Pass. Defined by shelter registry cross-match.
  *   **Q2 (Proxy Link):** Pass. Return to homelessness is a direct harm indicator.
  *   **Q3 (Gaming):** Pass. Hard to fake registry data.
  *   **Q4 (Leakage):** **Fail.** *Risk:* Providers will discharge residents *before* they are ready to avoid the "return" statistic counting against them, or refuse to admit those most likely to return. *Subgroup:* Those with complex addiction/mental health needs.
  *   **Q5 (Drift):** Pass. Housing market changes noted.
  *   **Procedure Output:** **Accept with Named Monitoring (B).**
  *   **Analysis:** The measure is robust against gaming but vulnerable to leakage.
  *   **Remedy:** Contract must include a "Discharge Reason" measure. If a resident leaves, the provider must code why. If "voluntary departure" spikes, trigger audit.

  ### (c) Home-Care: "Vendor algorithmic risk score predicting emergency admission"
  *   **Q1 (Definition):** **Fail.** The measure is a proprietary model score. We do not hold the code or the weights.
  *   **Q2 (Proxy Link):** **Break.** The "outcome" is the model's prediction, not actual health. We are paying for a reduction in a number generated by a black box.
  *   **Q3 (Gaming):** **Break.** The provider can retrain the model to lower scores without changing care. Since we generate the training data (via our returns), we are feeding the model its own targets.
  *   **Q4 (Leakage):** **Break.** The model will likely downgrade risk for expensive patients to make the score look better.
  *   **Procedure Output:** **Reject (A).**
  *   **Analysis:** This breaks the procedure because the Proxy *is* the Target. There is no external outcome to anchor Q2. The "Three Cheapest Ways" test is infinite because the provider controls the ruler.
  *   **Remedy:** You cannot contract on a vendor's internal risk score. You must contract on *actual* emergency admissions (lagged) or *care hours delivered* (input). If the vendor insists on the risk score, they must open the model for audit (Q1 Fix), which they will refuse.

  ---

  ## 5. The Reflexive Problem

  Once this procedure is published, Programme Managers will write proposals designed to pass the MSP, not to measure performance. They will pre-emptively add sunset clauses, define subgroups vaguely to avoid Q4 triggers, and cite "internal evaluations" that do not exist for Q2.

  **Mitigations:**
  1.  **Random Re-evaluation:** I will select 10% of "Accepted" measures quarterly and re-run the MSP myself. If the Analyst's answers differ materially from mine, the Analyst's approval authority is suspended for retraining.
  2.  **Evidence Lock:** For Q2 (Proxy Link), the analyst must attach the actual document (PDF/Data extract), not just a citation. I will spot-check these.
  3.  **The "Red Team" Clause:** For high-value contracts, require a second analyst to spend 30 minutes trying to *break* the first analyst's conclusion. If the second analyst finds a Low-Cost Gaming method the first missed, the measure goes to Escalation.

  **Candor:** No checklist is robust to being checklisted. The MSP relies on the analyst's integrity and competence. If the analysts become rubber stamps, the MSP becomes a shield for bad measures. The only true control is my willingness to **Reject** a proposal that has passed the MSP but feels wrong. The procedure informs the decision; it does not replace it.

  ---

  ## 6. Limitations & Confidence Statement

  **What the Procedure Cannot Do:**
  1.  **Predict Black Swans:** It cannot anticipate a pandemic, a sudden policy shift, or a technology failure that invalidates a measure overnight (Drift).
  2.  **Solve Political Pressure:** If you (the Head) or a Minister demands a measure for political reasons, this procedure will flag it as "Escalate," but it cannot stop you from signing it.
  3.  **Detect Collusion:** If our auditors and the providers collude, Q3 (Gaming) checks will pass falsely.

  **Confidence Assessment:**
  *   **The Taxonomy (Gaming/Leakage/Drift):** I am **80% confident** this is a real division. In practice, Gaming and Leakage often present identically in aggregate data (scores go up, outcomes stay flat). Distinguishing them requires the granular caseload data you said you *don't* have. The procedure forces a distinction based on *incentive structure* rather than *observed data*, which is a necessary heuristic but empirically fragile.
  *   **The Weakest Step:** **Question 4 (Leakage Check).** This relies on the analyst correctly identifying which subgroup a provider will neglect. Analysts are office-based; providers are field-based. Providers will always know better than analysts where the loopholes are. The "Frontline Testimony" fallback helps, but it is the most likely point of failure. If the analyst asks the wrong frontline staff, or the staff are loyal to management, Leakage will be marked "Pass" incorrectly.
  *   **Overall Utility:** Despite this, the procedure is **high confidence** for improving decision quality. It forces the conversation from "Is this a good idea?" to "What breaks this?" That shift alone will filter out the worst proposals.

  **Final Note:** The Employment Measure (Example A) is the greatest risk to your reputation. The procedure flags it as a Leakage vehicle. If you proceed without the paired intake measure, you are choosing efficiency over equity. The MSP makes that choice visible; it does not make it easy.
