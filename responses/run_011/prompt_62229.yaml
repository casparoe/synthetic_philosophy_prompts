      *   *Function Definitions:* Distinguish between "Selected Effect" (why it's there) and "Causal Role" (what it does now). This is crucial (Millikan vs. Cummins).
      *   *The Sources:*
          *   Pro-Appendix: Needs Etiological/Adaptation.
          *   Skeptic: Needs Optimization/Conservation (If it mattered, it wouldn't vary).
          *   Conflict: They are fighting over evolutionary history, using a phrase about physical design.
      *   *The "Backwards" Cases:* Discuss Exaptation (Gould & Vrba). The slogan breaks. It needs to be retired or heavily qualified.
      *   *Conclusion:* Advice for the article. Don't use the phrase. Use precise evolutionary language.

  7.  **Refining the Tone:**
      *   Ensure it sounds like it's helping a writer, not lecturing a student.
