answer: |-
  Friends, neighbors, colleagues, students. We gather in a stone room built for sound. Words linger here. They hang in the air long after the speaker has finished. This is fitting. We are here to speak about things that linger. We are here to mark one hundred and fifty years. That is a long time. It is long enough for a foundation to settle. It is long enough for cracks to appear in the walls. It is long enough for us to forget why the stones were laid in the first place.

  I have been asked to honor the founding. I have been asked to thank the donors. I have been asked to send you out with pride. I intend to do these things. But I cannot do them by ignoring the weight of the building we occupy. An institution is not a ghost. It is an organism. It eats. It digests. It grows. To live, it must take in its own past. But not all past is food. Some of it is poison. The task of a living thing is to know the difference. It must know how much history it can carry without collapsing. It must know when to remember, when to preserve, and when to judge.

  There are ways to treat the past. Some look for heroes to imitate. Some look for relics to protect. Some look for errors to condemn. We need all of these. But we cannot use them all at once. We cannot treat every year as a monument. We cannot treat every brick as sacred. We cannot treat every mistake as a crime demanding payment. We must allocate them. We must decide what this institution can metabolize today.

  Consider the beginning. We have a founder. He was a minister who rode a circuit. He was an abolitionist when that was dangerous. He mortgaged his farm to keep this school open through the first winter. His letters are read at graduation. This reading is not a trick. He deserves our honor. We need this story. It shows us that great things begin with risk. It shows us that conviction costs money. This is the history that inspires action. It holds up a model of human possibility. We stand taller because he stood here.

  But a monument casts a shadow. If we stand only in the light of the founder, we become blind to what grew in the shade. We cannot use his virtue to excuse our later vices. We cannot say that because he was good, the institution must be good. The founder gives us strength. He does not give us an alibi. We must take his gift without letting it hide the rest of the house.

  Consider the town below us. Four generations of children have walked up this hill. They sit in the balcony tonight. They are alumni. They love this place. They feel a loyalty that is deep and real. When we change the name on a building, they feel a loss. They say an institution that discards its past cannot teach loyalty. They are not simply confused. They are speaking for a necessary hunger. We need to preserve things. We need to feel connected to what came before. Without this piety, we are rootless. We become tourists in our own home. This feeling deserves weight. It is the glue of community.

  But piety can suffocate. To preserve everything is to mummify the body. If we keep every name because it is old, we honor the dead at the expense of the living. If we refuse to change because change feels like theft, we stop growing. The alumni are right to feel pain. But pain is not a veto. We must honor their loyalty without letting it freeze us in time. We can respect the feeling of loss without restoring the name.

  Consider the years between the wars. From 1912 to 1929, this college required a course in heredity. The syllabi survive. They are explicit. They taught which immigrant stocks were fit to reproduce. This was not a mistake. It was the curriculum. We built buildings with money made from this idea. One building carried the name of a trustee. He gave substantial money to eugenics research elsewhere. We took it. We put his name on the wall. We taught the lie.

  This history cannot be monumental. It cannot be preserved with piety. It must be judged. We must speak of it in the first person plural. Our syllabi. Our trustee. Our hill. We are the beneficiaries of those endowments. We teach in those halls. To condemn that past is to condemn the ground we stand on. It is expensive to say this. It is easier to say "they were wrong." It is harder to say "we are the outcome." If we judge the past without seeing ourselves in it, we become vengeful. We pretend we are clean. We are not clean. We are here because of that money. We are here because of those decisions. We must carry the cost of that knowledge. We renamed the building. The alumni association litigates this. People in the balcony call it theft. Let them call it what they will. The act was necessary. But we cannot pretend it was free.

  Consider the spring of 1968. Students occupied the administration building for eleven days. The college admitted its first significant cohort of Black students the following autumn. The trustees' minutes record the decision. They call it a concession to disorder. They do not call it the correction of an injustice. I have read the minutes. The language is cold. It is administrative. Four members of that cohort are alive. At least three are present. They are not statues. They are not models for us to imitate. They are living people. They have opinions about us. They might disagree with this speech. To turn them into heroes is to silence them. We honor them by listening, not by worshipping. They forced a change. We must acknowledge that the change was a concession. We must acknowledge that the injustice remained uncorrected in the hearts of the trustees. We are still living with that distinction.

  So we have these things. We have the founder. We have the town. We have the eugenics. We have the occupation. We cannot choose one. We cannot say we only want the good parts. An organism cannot choose to digest only the nutrients. It must take in the whole meal and process it. Some of this history nourishes us. The founder's risk feeds our courage. The town's loyalty feeds our stability. Some of this history poisons us. The heredity course rots the foundation. The minutes of 1968 chill the air.

  We must distribute these weights. We cannot hold them all in balance. Balance is a static thing. We are not static. We are moving. Sometimes we need the monument to stand up. Sometimes we need the relic to feel grounded. Sometimes we need the knife of judgment to cut away the dead flesh. The measure is not correctness. The measure is plastic power. Can we take this much truth without breaking? Can we take this much shame without collapsing?

  I do not know the answer. I know only that we must try. We cannot hide the founder's virtue. We cannot hide the trustee's sin. We cannot hide the town's pain. We cannot hide the students' anger. To hide them is to starve. To eat them all at once is to gorge. We must pace ourselves. We must speak the truth about the heredity course. We must speak the truth about the farm. We must speak the truth about the minutes.

  There is a cost to this. The donors in the front row may feel implicated. The alumni in the balcony may feel betrayed. The students in the nave may feel burdened. This is unavoidable. A honest history is not comfortable. It is not designed to make you feel proud. It is designed to make you feel real. Pride is a sentiment. Reality is a condition. We are here. We are the product of this mix. We are the children of the abolitionist and the eugenicist. We are the beneficiaries of the gift and the theft.

  We do not resolve this tonight. We do not fix the past. We acknowledge the metabolism. We acknowledge that we must consume our history to live. We acknowledge that some of it will make us sick. We acknowledge that vomiting it up is not enough. We must transform it. We must use the shame to fuel the correction. We must use the loyalty to fuel the change. We must use the risk to fuel the future.

  The stone chapel holds the sound. The words will fade. The history will not. It remains in the bricks. It remains in the minutes. It remains in the silence between us. We carry it out of this room. We carry it into the next century. We carry it together.

  ***

  **NOTE TO THE SPEAKER**

  **1. Liberties with Nietzsche**
  Nietzsche wrote *On the Uses and Disadvantages of History for Life* against the academic historicism of his day, which he saw as paralyzing. He would likely view a sesquicentennial address as precisely the sort of institutional self-congratulation he despised—a ceremony designed to reinforce the status quo under the guise of learning. To make him usable here, I have bent his radical individualism toward institutional ethics. Nietzsche was concerned with the *individual's* ability to act; this speech applies his metabolic metaphor to a *college*. I have also softened his view of "critical" history. For Nietzsche, critical history involves violent breaking; here, it is framed as a sober administrative accounting. He would likely recognize the structure but reject the occasion. I have had to bend the essay from a weapon against culture into a tool for institutional integrity.

  **2. Load-Bearing Commitments**
  The design rests on two interpretive stakes. First, that the three modes (monumental, antiquarian, critical) are *appetites* rather than *methods*. This is contested; many readers see them as historiographical techniques to be chosen based on the subject. If a classicist argues they are methods, the speech's claim that we must "allocate" them metabolically collapses. Second, that critical history is the "most expensive" because it entails self-condemnation. This is load-bearing because it justifies the use of "our" regarding the eugenics era. If critical history is viewed as morally superior detachment (the judge standing above the past), the speech's refusal to be vengeful looks like weakness rather than philosophical rigor. I am staking the speech on the view that we are implicated in what we judge.

  **3. What Would Change the Allocation**
  I would distribute the modes differently if the eugenics history were less documented or if the 1968 survivors were not present. If the syllabi were lost, the critical section would rely on hearsay, weakening the "our" claim. If the survivors were absent, the risk of monumentalizing them would be lower, allowing a more celebratory tone. The design is most likely wrong in the "Antiquarian" section. I have granted the alumni's pain significant weight to avoid alienating the balcony. If the room is more hostile than anticipated—if the renaming is seen as a victory rather than a theft—this section may read as overly conciliatory to donors at the expense of justice. However, given the constraint that alumni are "litigating" the change, the current balance seems safer.

  **4. Performance Risks**
  *Insult:* "We are the children of the abolitionist and the eugenicist." This equates the founder with the trustee morally, even if not in virtue. Donors in the front row may hear this as an attack on their giving. *Evasion:* "We do not resolve this tonight." Given the demand for pride, this may feel like a refusal to lead. In this chapel, with this reverberation, the evasion risk is worse. An insult can be absorbed as honesty; an evasion suggests the speaker lacks the courage of the critical mode they just described. The refusal to name the trustee is also a risk; it could be seen as protecting the dead rather than honoring the truth, but naming him risks turning the critique into a spectacle of vengeance, violating the "no vengeance" constraint.
