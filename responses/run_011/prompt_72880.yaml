      *   *What are they missing?*
          *   **Critical Realism:** Belief can be regulative *and* truth-claiming without being empirically falsifiable in a lab.
          *   **The nature of "Evidence":** Both restrict evidence too much (Adam: only lab results; Bea: mostly empirical). Religious evidence might be experiential/narrative.
