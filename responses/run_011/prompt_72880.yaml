      *Final Verdict:* Bea is more right overall because Adam's view requires believers to be mistaken about what they are doing (error theory), whereas Bea takes them at their word. Adam misses that believers *want* their beliefs to be factual. Bea misses that factual claims in religion function differently than in science. They are talking past each other: Meaning (Adam) vs. Justification (Bea).

