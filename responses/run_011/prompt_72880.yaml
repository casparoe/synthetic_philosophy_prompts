      *In Q2:* Bea's generalization tries to show the criterion is *too broad*. Adam narrows it with "track record." Does that work? A physicist's confidence *is* based on track record. A believer's is not. So Adam distinguishes them. But what about love? Adam ignores the love example in (5), focusing on physics. I should point that out.
