      *   *Self-Correction on 1 vs 7:* Actually, 7 says "no neutral... way to draw the boundary." This attacks the philosophical foundation of 1. If 1 is just a "contested moral view," it loses its trump card status. To be Hartian, 1 must be privileged over majoritarian morality. So 7 is the outlier.

      *   *Self-Correction on 1 vs 5:* 5 allows criminalization based on *institutional* corrosion. Hart requires harm to *persons*. If the institution collapses, do persons suffer harm? 5 says "shrink the organ supply." That is harm to persons (patients). So 5 is compatible with 1 *if* the prediction is about person-harm. The tension is the "unproven" aspect. Hart allows reasonable prevention. 5 is okay if framed carefully. But 7 is the real killer.

      *   *Wait, looking closer at 1:* "Prevention of harm to persons who have not consented."
      *   *Looking at 5:* "Corrode trust... degrade voluntary donation." This harms future patients (non-consenting to the shortage). So 5 is okay under 1.
      *   *Looking at 3:* "Anguish... is a harm to identifiable people." This fits 1 if anguish counts as harm.
      *   *Looking at 7:* "Boundary should be fixed by ordinary democratic majorities." This contradicts 1's "substantive constraint." If the majority wants to criminalize sodomy (no harm), 7 says let them, 1 says stop them. This is the core contradiction.

