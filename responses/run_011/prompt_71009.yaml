      *   **Constraint 2 (Ranking):** Rank conflicts by repair cost (expensive to cheap). For each, specify: what has to give, repair costs, whether cost is acceptable.
      *   **Constraint 3 (No Problem Pairs):** List pairs examined and found to be no problem, with a sentence on why (to show exhaustiveness).
      *   **Constraint 4 (Style):** No bibliography, no case citations, focus on reasoning.
      *   **Constraint 5 (Length):** Under 700 words.

  2.  **Analyze the Commitments:**
      *   (1) Harm Principle (Substantive): Only prevention of harm to non-consenting persons justifies criminalization. Moral wrongness alone doesn't count.
      *   (2) Anti-Disintegration: Devlin's claim that moral change kills society is false.
      *   (3) Desecration as Harm: Anguish caused by desecration (kidneys, corpses) counts as harm to identifiable people.
      *   (4) Anti-Paternalism: Seatbelt/helmet laws unjustified (benefit/burden same person).
      *   (5) Institutional Corrosion: Legislature can act on unproven predictions that practices corrode institutions (e.g., paid kidneys degrade voluntary donation).
      *   (6) Consensual Harm (Brown): Law was right then, wrong ought. (Mostly descriptive/normative split, less relevant to internal consistency unless it conflicts with 1 or 4).
      *   (7) Democratic Boundary: No neutral private zone boundary; democracies should fix it, not courts.

  3.  **Identify Conflicts/Inconsistencies:**
      *   **Conflict A: (1) vs. (3).** (1) says only harm to non-consenting persons justifies criminalization. (3) says anguish experienced by others due to desecration counts as harm. *Analysis:* This is actually a classic Hartian move (psychological harm). If the anguish is real harm to identifiable people, (1) is satisfied. However, if the "anguish" is merely moral offense, (1) excludes it. (3) tries to bridge this by calling it "harm." This is tension but potentially resolvable if "anguish" is severe enough.
      *   **Conflict B: (1) vs. (5).** (1) requires harm to persons. (5) allows criminalization based on corrosion of *institutions* (trust in voluntary donation). Is institutional corrosion "harm to persons"? It's indirect. (5) allows acting on *unproven* predictions. (1) sets a substantive constraint. If the harm is speculative/institutional, does it meet (1)'s threshold? This is a major tension. (5) looks like Legal Moralism or Paternalism disguised as harm prevention.
      *   **Conflict C: (1) vs. (7).** (1) sets a substantive constraint (Hartian liberalism). (7) says democracies should fix the boundary, implying no substantive constraint binds them. If democracies decide to criminalize moral wrongs without harm, (7) permits it, (1) forbids it. This is the **load-bearing failure**. (1) claims a substantive limit on legislature; (7) claims legislature decides the limit.
      *   **Conflict D: (4) vs. (5).** (4) rejects paternalism. (5) allows protecting institutions (which ultimately benefit persons) based on speculation. Less direct conflict.
      *   **Conflict E: (2) vs. (3).** (2) says society survives moral change. (3) says desecration causes anguish. Not necessarily conflicting, but (3) leans towards Devlin's concern about offense/anguish while (2) rejects Devlin's structural claim.

  4.  **Determine the Load-Bearing Failure:**
      *   Commitment (7) undermines (1). (1) says "I hold this as a substantive constraint on the legislature." (7) says "the boundary should be fixed by ordinary democratic majorities... rather than entrenched by courts." If the democracy decides moral wrongness *is* harm, (1) is violated unless (1) is just a plea to the democracy, not a constraint. But (1) says "requires," implying objective justification. (7) says there is "no neutral... way to draw the boundary," implying (1)'s harm principle is just another "contested moral view."
      *   *Decision:* Commitment 7 is the problem. It surrenders the Hartian substantive constraint to majoritarian whim, contradicting Commitment 1's claim of a substantive constraint.

