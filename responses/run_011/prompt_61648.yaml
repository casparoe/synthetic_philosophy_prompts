  *(Self-Correction on Tone)*: The user wants a philosopher who knows the formal stuff *and* the messy room. I should sound like someone who has sat in that chair before.

  *(Key Insight)*: The withdrawal offer is the most dangerous trap. It looks like a solution but it's actually a moral hazard. I need to emphasize this. The coin is the hardest sell emotionally but the most robust philosophically.

