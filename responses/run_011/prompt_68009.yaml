  This is a tight argument, and R. is right to flag the generalisation worry. If you accept (10), you are committed to a purely attitudinal theory of value, which makes it difficult to explain why the aversion itself is rational without circularity. However, your instinct that rejecting (2) and (6) looks "too cheap" is the very reason most contemporary philosophers of pain (evaluativists like Bain or Martínez) actually take that route. It is not cheap; it is theoretically costly, but it preserves the intrinsic badness of pain without succumbing to R.'s bootstrapping problem.

  Here is the cost of each exit, and why I recommend rejecting (2).

  **Exit 1: Reject (4) (Externalism about reasons)**
  *   **Why it looked true:** Badness seems to provide reasons. If something is bad for you, surely you have a reason to avoid it?
  *   **Cost:** You stated you are an internalist about reasons. Abandoning (4) undermines your broader metaethical commitments. It allows pain to be bad even if the subject has no reason to avoid it, but this severs the link between value and motivation that usually grounds the 'badness' claim in the first place.
  *   **Verdict:** Too high a price for your specific project.

  **Exit 2: Reject (1) (Sever feel and value)**
  *   **Why it looked true:** Phenomenal character seems intrinsic; if pain feels a certain way, that way *is* the badness.
  *   **Cost:** This is your preferred sacrifice, but it leads directly to (10) and invites R.'s generalisation. If badness comes from the "extra bit" (aversion), then nothing is bad unless minded. You then face the bootstrapping problem: what makes the aversion itself the right sort of state? You end up with a subjectivist theory of value that may contradict your thesis aim to establish pain's objective disvalue.
  *   **Verdict:** Saves the patient reports but sacrifices the intrinsic badness of pain.

  **Exit 3: Reject (2) and (6) (Deny phenomenological identity)**
  *   **Why it looked true:** Patients report sensory features (location, intensity) accurately. We conflate sensory-discriminative aspects with the whole phenomenal character.
  *   **Cost:** You must argue that asymbolics do not feel the *unpleasantness* of pain, only the sensory location. You have to explain away patient reports as referring only to the sensory component, not the full experience. This commits you to a view where unpleasantness is inseparable from pain's phenomenal character (evaluativism or imperativism).
  *   **Verdict:** This preserves (1), (4), and the claim that pain is bad. It solves R.'s worry because grief's phenomenology also includes the distress; if you remove the distress, it is not grief phenomenologically.

  **Exit 4: Accept (10) (Pain isn't inherently bad)**
  *   **Why it looked true:** It follows logically from the premises.
  *   **Cost:** Counterintuitive and difficult to defend in a thesis on value. It implies pain is neutral until minded.
  *   **Verdict:** Philosophically suicidal for your chapter.

  **The Fifth Exit: Narrowing 'Bad-For'**
  You asked if there is a way to keep (1) by narrowing what 'bad-for' means. You might distinguish *phenomenal badness* (unpleasantness) from *prudential badness* (well-being). However, premise (4) links these: if a state is bad-for a subject, they have a reason to stop it. If asymbolics have no reason to stop it, it isn't bad-for them. To keep (1) and (4), you must deny that asymbolics have the state that is *phenomenally bad*. This collapses back into rejecting (2). There is no stable middle ground where the feel is identical but the value differs without abandoning internalism (4).

  **Recommendation**
  You should reject (2) and (6). It looks "cheap" only if you assume pain's phenomenology is purely sensory. If you adopt an evaluativist account, the unpleasantness *is* part of the phenomenal character. Asymbolics lack the full character; they have the sensory shell without the evaluative core. This explains why they don't mind it (it isn't bad) while preserving the intuition that normal pain is intrinsically bad. It costs you the literal truth of patient reports, but gains you a robust theory of value that avoids R.'s generalisation.

