answer: |-
  **Provisional Mark: 15/20**

  **Sub-scores:**
  *   (a) Moral Equality & Non-Combatants: 5/5
  *   (b) Walzer's Argument: 4/5
  *   (c) McMahan's Objection: 5/5
  *   (d) Legal Implications: 1/5

  **Gradebook Comments (Item-by-Item Assessment):**

  *   **(a) Moral Equality & Non-Combatants:** You provide a clear and accurate definition of the moral equality of combatants and correctly identify its symmetrical relationship to non-combatant immunity. Your explanation of how permissions track combatant status rather than cause justice is precise and meets the requirements of the prompt.
  *   **(b) Walzer's Argument:** You accurately reconstruct Walzer's epistemic argument regarding soldiers' inability to judge the justice of the cause. However, you attribute the "threat = liability" argument to Walzer as a moral foundation, whereas Walzer treats this as a feature of the *convention* rather than deep moral liability.
  *   **(c) McMahan's Objection:** Your statement of the revisionist objection is excellent, correctly identifying moral responsibility for an unjust threat as the basis of liability. You also successfully distinguish McMahan's "deep morality" from the conventional view, capturing the core asymmetry he proposes.
  *   **(d) Legal Implications:** While you correctly distinguish between moral and legal claims in principle, your conclusion regarding McMahan's view on the law is factually incorrect. McMahan argues *against* changing the law to match deep morality (the "pragmatic view"), whereas you claim he argues for aligning them; this significantly undermines your assessment.

  ***

  **Internal Assessment Notes: Factual Inaccuracies & Misattributions**

  *   **Claim:** "What makes a person a combatant is that he poses a threat of harm, and it is that threat which makes him liable to be attacked." (Paragraph 2)
      *   **Correction:** Walzer does not ground liability in *mere* dangerousness/threat in the deep moral sense; he grounds the *conventional* permission to attack in the war convention and the epistemic limitations of soldiers. Attributing a naturalist "threat = liability" view to Walzer conflates him with the view McMahan critiques.
      *   **Required for Full Credit:** The student should have specified that Walzer defends the *convention* of equality based on the separation of *jus ad bellum* and *jus in bello*, not on a natural fact about threat generating moral liability.
  *   **Claim:** "His [McMahan's] conclusion is that the law should be brought into line with the deep morality." (Paragraph 4)
      *   **Correction:** In *Killing in War*, McMahan explicitly argues for the "pragmatic view": the law should *not* be changed to match the deep morality because soldiers cannot reliably judge the justice of the cause.
      *   **Required for Full Credit:** The student should have noted that while McMahan rejects the *morality* of equality, he accepts the *legality* of equality for practical/epistemic reasons.
  *   **Claim:** "Both authors agree that the moral equality of combatants is false in itself and necessary in practice." (Paragraph 4)
      *   **Correction:** Walzer does *not* agree that MEC is "false in itself"; he defends it as a morally defensible principle of the war convention. Only McMahan holds that it is morally false but practically necessary.
      *   **Required for Full Credit:** The student needed to distinguish Walzer's defense of the convention as morally binding from McMahan's view of it as a regrettable practical necessity.
  *   **Claim:** "Since that immunity admits of no exceptions on Walzer's account..." (Paragraph 1)
      *   **Correction:** Walzer allows for exceptions, most notably the "supreme emergency" exemption and discussions of civilians contributing directly to the war effort.
      *   **Required for Full Credit:** A qualification that Walzer's protection of non-combatants is stringent but not absolute would have been more accurate.

  **Underdeveloped Points & Unaddressed Questions:**

  *   **The "Separation Thesis":** The answer describes the separation of *jus ad bellum* and *jus in bello* without using the standard terminology or explicitly noting that this *is* the mechanism Walzer uses to defend MEC.
  *   **McMahan's Pragmatic Reasons:** The answer fails to address *why* McMahan thinks the law should remain unchanged (epistemic constraints, risk of worsening war), which is central to part (d) of the question.
  *   **Normative Assessment:** The prompt asks the student to "say whether accepting that objection gives us reason to change the law." The student answers by reporting McMahan's view (incorrectly) rather than offering their own assessment or analyzing the tension between the two views. A stronger answer would evaluate the strength of McMahan's pragmatic concession.
