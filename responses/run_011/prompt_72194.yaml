  ### 1. Predicted Verdict
  Your friend will classify the stalled scheme as **Outcome-based**.

  ### 2. The Friend's Criterion
  The criterion your friend is applying is **Informational Content (or Semantic Dependency)**.
  *   **Definition:** Supervision is **Outcome-based** if the training signal's information content is reducible to the correctness of the final solution (i.e., the signal would not change if intermediate steps were altered, provided the final answer remained the same). Supervision is **Process-based** if the signal conveys information about the quality, validity, or soundness of intermediate steps *independent* of the final binary outcome.
  *   **Evidence from Verdicts 1–5:**
      *   **Scheme 3** is the smoking gun: It provides per-step values, yet is labeled Outcome-based. This proves your friend does not classify based on *granularity* (step vs. episode) but on *derivation*. Since the step values in Scheme 3 are merely probabilities of final success ($P(\text{win}|\text{step})$), they contain no information about step quality beyond outcome likelihood.
      *   **Scheme 4** confirms this: It uses a judge trained on outcomes, yet is Process-based. Why? Because the judge's *output* is a step-level quality rating, not a win-probability. The signal *semantics* are about the process, even if the *lineage* is outcome-based.
      *   **Scheme 5** reinforces it: Broadcasting a final verdict to every token does not make it process supervision; the information content remains a single bit of outcome correctness.

  ### 3. Alternative Consistent Criteria
  The most plausible alternative criterion that fits verdicts 1–5 is **Verifier Inspection of Intermediates**.
  *   **Definition:** Supervision is **Process-based** if the verifier explicitly reads, parses, or semantically evaluates the intermediate reasoning steps. It is **Outcome-based** if the verifier ignores the intermediates and focuses solely on the final result (or samples futures without evaluating the current step's semantics).
  *   **Consistency Check:**
      *   1 (Annotators grade lines): Inspects -> Process.
      *   2 (String match): Ignores -> Outcome.
      *   3 (Sampling continuations): Does not inspect current step semantics (tests futures) -> Outcome.
      *   4 (Judge reads CoT): Inspects -> Process.
      *   5 (Checker re-executes): Ignores reasoning -> Outcome.
  *   **Verdict on Stalled Scheme (Scheme 6):** Under this criterion, Scheme 6 would be **Process-based**, because the verifier "reads the complete derivation line by line." This creates the divergence.

  ### 4. Closest Analog
  The stalled scheme is structurally closest to **Scheme 5**.
  *   **Similarity:** Both involve a verifier that determines correctness based on the final answer and emits a verdict used for training.
  *   **Difference:** Scheme 5 assumes the answer is easily isolatable (last line/re-execution), while Scheme 6 parses the text to *locate* the answer.
  *   **Why it matters:** Under your friend's criterion (Informational Content), this difference is irrelevant; both emit a single bit of outcome correctness. Under the alternative criterion (Verifier Inspection), this difference is crucial; Scheme 5 ignores text, Scheme 6 reads it.

  ### 5. Recommendation for Print
  To be consistent with the established classifications (particularly the pivotal Scheme 3 vs. Scheme 4 distinction), you should label the scheme **Outcome-based**.

  *   **Principle Adopted:** **"Signal Semantics over Verifier Effort."** The classification of supervision depends on *what the model learns from the signal* (step quality vs. final correctness), not on *how much work the verifier does* to generate that signal. Parsing intermediate text to extract a final answer does not constitute process supervision if the extracted information is solely about the final answer's correctness.

  ### 6. The Divergence Test (Scheme 7)
  To definitively prove which criterion your friend is using, propose the following hypothetical scheme:

  **Scheme 7: Black-Box Process Reward Model.**
  A pre-trained reward model (trained previously on human step-labels) outputs a **per-step quality score** for the current trajectory. However, during the current training loop, **no component inspects the text of the intermediate steps**; the reward model acts as a fixed function mapping the trajectory to step-values.

  *   **Friend's Criterion (Informational Content):** **Process-based.** The signal conveys step-level quality information, distinct from a final outcome bit (analogous to Scheme 4).
  *   **Alternative Criterion (Verifier Inspection):** **Outcome-based.** No verifier inspects the intermediate semantics *during this training phase* (the RM is a black box); it functions similarly to Scheme 3's value estimation.

  If your friend classifies Scheme 7 as Process-based, it confirms he prioritizes **Informational Content**. If he classifies it as Outcome-based, he prioritizes **Verifier Inspection** (or perhaps Signal Lineage), and you will need to re-evaluate Scheme 4's classification to maintain consistency.
