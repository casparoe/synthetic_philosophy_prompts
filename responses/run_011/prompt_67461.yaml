  2.  **Path Dependence:** When priors stem from distinct life histories, divergence is rational. (Motivated by Brother & Believer: Football allegiance and theological belief are rooted in upbringing, not solely evidence.)
  3.  **Bad Faith Exemption:** If one agent optimizes for non-truth goals, convergence is not required. (Motivated by Colleague: Funded bias breaks the rationality assumption.)
  4.  **Epistemic Humility:** If priors are acknowledged as arbitrary, confidence must decrease. (Motivated by Priors: Admitting "luck of birth" contradicts maintaining full conviction.)

  **Diagnostic Case:** Two economists agree on growth data but disagree on inflation risk due to different models of human behavior. Verdict: Permissible divergence (Clause 2), as behavioral models are prior-laden, not purely empirical.

  **Overturns/Trade:** I must overturn your verdict on **Case 6 (Priors)**. You claim you can grant your priors are lucky yet remain certain. This violates Clause 4. Rationality demands humility when origins are contested. This overturn is necessary to save **Case 1**: you can only demand your post-docs converge if you admit you must converge when priors are shared. If you exempt yourself in Case 6, you weaken the mandate in Case 1.

  **Trade-off:** A simpler principle ("Always converge") buys Cases 1 and 3 but sacrifices Cases 2, 4, and 5. It demands you split the difference with your brother and the believer, which is absurd. My principle sacrifices your certainty in Case 6 to save the realism of Cases 2, 4, and 5 while keeping the rigor of Cases 1 and 3. Take this trade: admit humility on arbitrary priors to preserve objective standards on empirical data.
