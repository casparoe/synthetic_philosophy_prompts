prompt: |-
  So, bit of background — I've got no academic training in any of this, I left school at 16 and spent most of my working life in a warehouse and then driving. But I've been reading up on truth commissions on my own for a couple of years now, mainly because of something where I live. The county used to run children's homes here that shut in the early 90s, and there's been a slow drip of stories ever since. Now the council and one of the local papers want a formal truth process set up before the last of the people who were in them are gone.

  The retired teacher who's fronting the campaign — she's on local radio a lot — explains it with what I'd call the therapy picture. The community is like a person who went through something terrible and buried it. The buried thing keeps producing symptoms: the rumours, the mistrust, the way nobody in the pub will say a word about it even now. And the cure is the same as in counselling — you say it out loud, in front of people, and the thing loses its power. On that picture, taking anyone to court is revenge wearing a doctor's coat, and it actively blocks the healing, so the process should be statements and apologies and no prosecutions.

  I definately feel something's off about it but I can't say what, and when I tried in a meeting I got talked over. Can you take the analogy apart for me?

  - The correspondence table first: what exactly is the patient, the buried memory, the symptom, the couch, the therapist, the cure?
  - Then where the mapping breaks. I'd like you to separate the breaks that actually matter for her no-courts conclusion from the surface wobbles that aren't worth me making a fuss about, because I don't want to waste my one chance on the wrong point.
  - What the therapy picture quietly imports that a community doesn't have. My suspicion is there's a lot hiding in there, including something about who gets to say when the patient is better.
  - Whether her conclusion survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time. Be honest either way — I'd rather know.
  - If therapy is the wrong comparison, what would be a better one, or is there simply nothing that carries the weight? And tell me where she does have a real point, because she isn't stupid and I don't want to pretend she is.

  One extra layer I can't work out: even if the therapy picture holds for a whole country coming out of a dictatorship, does it carry down to somewhere like here — one council, a few hundred people who were there, and two of the men who ran the homes still alive and theoretically chargeable? Or is a small place a different kind of thing that breaks the comparison in a second way?

  Please write it in British English, and don't send me off to a reading list or give me references to chase — I can't get hold of them and I want something I can actually sit with and think about. If you need a term of art, explain it in passing rather than assuming I know it.
reasoning: |-
