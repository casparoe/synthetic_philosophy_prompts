prompt: |-
  ok so, two things are colliding for me. I'm in a formal epistemology seminar this term and we just did probability kinematics, and separately I put in about 8 hours a week on my university's forecasting team — we submit probabilities to a public tournament every Sunday night. Problem is almost none of our "evidence" is ever clean. A teammate forwards me a screenshot of a paragraph they half-read, a poll has wierd wording I'm not sure how to interpret, a rumor about a leaked memo gets picked up by two outlets that both cite each other. Right now people just nudge their numbers by feel and nobody can reconstruct why later.

  Can you turn Jeffrey conditionalization into a written protocol my team could actually run, in like 20 minutes per question, by people who have never seen the formula? I need the questions to ask in order — how you pick the partition, how you set the new numbers on it, what you do about the fact that you're supposed to have already had the conditional probabilities before the evidence showed up, and what stops someone from carving the partition however they like to get the answer they wanted. Say what counts as a usable answer at each step, and where the protocol should just stop and say "don't update this way," handing it back to a human. Our faculty advisor floats this rule: never move more probability mass than your confidence in your own reading of the evidence. Tell me whether that's actually coherent with kinematics or just a vibe, and if it's a vibe what should go in thier place. Also flag which steps are precision theater — where a number looks objective but is really a judgment call wearing a lab coat.

  Then run it on three cases: the screenshot-of-a-paragraph one, two outlets reporting the same leaked memo when I'm pretty confident they share a single source, and a noisy poll I'd already partly priced in. Make at least one of them come out badly for me — I want a case where the protocol says I basically learned nothing even though it felt like a big deal. And last: if three ambiguous reports land in the same week, does the order I process them in change where I end up, and if so what do I tell my teammates to do about it?
reasoning: |-
  Here's a thinking process that leads to the suggested protocol and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** User is in a formal epistemology seminar (knows the theory) and on a university forecasting team (practical application).
      *   **Problem:** Evidence is messy (screenshots, ambiguous polls, circular reporting). Current team method is "nudge by feel," which is untraceable and inconsistent.
      *   **Goal:** Create a written protocol based on *Jeffrey Conditionalization* (JC) that takes ~20 mins/question, usable by non-experts.
      *   **Specific Requirements:**
          *   Step-by-step questions (Partition, New Probabilities, Conditional Probabilities).
          *   Guardrails against manipulation (partition carving).
          *   Criteria for "usable answer" vs. "stop and hand to human."
          *   Evaluate the advisor's rule: "Never move more probability mass than your confidence in your own reading of the evidence." (Coherent vs. Vibe).
          *   Identify "precision theater" (where numbers look objective but aren't).
          *   **Case Studies:** Run the protocol on three specific cases (Screenshot, Circular Reporting, Noisy Poll). One must result in "learned nothing."
          *   **Order of Operations:** Address non-commutativity (does order matter?) and give advice.

  2.  **Theoretical Grounding (Jeffrey Conditionalization):**

      *   *Formula:* $P_{new}(H) = \sum P_{old}(H|E_i) \cdot P_{new}(E_i)$.
      *   *Core Idea:* You don't learn $E$ with certainty (probability 1). You learn a new distribution over a partition $\{E_i\}$. You keep your conditional beliefs $P(H|E_i)$ fixed (Rigidity).
      *   *Challenge:* In forecasting, $H$ is the event (e.g., "Candidate X wins"). $E$ is the evidence.
      *   *Constraint:* JC requires $P_{old}(H|E_i)$ to be defined *before* the update. In real-time forecasting, we often form $H$ and $E$ simultaneously. This is the "Rigidity" problem.
      *   *Advisor's Rule:* "Never move mass > confidence in reading." This sounds like bounding $P_{new}(E)$ based on reliability.

  3.  **Drafting the Protocol (The "20-Minute JC"):**

      *   *Step 1: Define the Hypothesis ($H$).* What are we forecasting?
      *   *Step 2: Define the Evidence Partition ($E$).* This is crucial. It can't just be "True/False." It needs to capture the *uncertainty* of the evidence itself (e.g., "Real Leak," "Fake Leak," "Misinterpreted").
      *   *Step 3: Assess Old Conditionals ($P_{old}(H|E_i)$).* This is the hardest part for non-experts. They need to ask: "If I knew $E_i$ was definitely true, what would I believe?" *Precision Theater Alert:* People will fake this.
      *   *Step 4: Assess New Evidence Probabilities ($P_{new}(E_i)$).* How likely is each evidence state *now*?
      *   *Step 5: Calculate.* Weighted average.
      *   *Step 6: Sanity Check/Bounds.* The Advisor's Rule fits here.

  4.  **Evaluating the Advisor's Rule:**

      *   *Rule:* $\Delta P(H) \leq \text{Confidence}(Evidence)$.
      *   *Analysis:* In JC, the shift depends on the *variance* in $P_{new}(E)$ and the *difference* in $P(H|E)$. If $P(H|E_{real}) = 0.9$ and $P(H|E_{fake}) = 0.1$, and I shift $P(E_{real})$ from 0.5 to 0.8, the shift in $H$ could be large.
      *   *Coherence:* Strictly speaking, JC doesn't limit the *magnitude* of the shift based on evidence confidence alone; it limits it based on the *likelihood ratio*. However, as a heuristic for *reliability*, it's a "vibe" that prevents over-updating on noisy signals. It's not a theorem of JC, but a risk-management constraint. I need to clarify this distinction.

  5.  **Developing the Case Studies:**

      *   *Case 1: Screenshot of a paragraph.* (Ambiguous source).
      *   *Case 2: Circular Reporting (Two outlets, one source).* (Dependence issue).
      *   *Case 3: Noisy Poll.* (Already priced in).
      *   *Requirement:* One must yield "Learned Nothing." Case 2 is the best candidate for this. If the outlets are dependent, the second adds no information. Or, if the partition shows the evidence is equally likely to be noise as signal, the weighted average might land right back near the prior. Let's make Case 2 the "Learned Nothing" one due to the "Circular/Single Source" issue making the evidence partition collapse into noise.

  6.  **Addressing Order of Operations (Non-Commutativity):**

      *   *Theory:* JC is *not* commutative. $P_{E1 then E2} \neq P_{E2 then E1}$ generally, because the "Rigidity" condition ($P(H|E)$ stays fixed) applies relative to the *current* state. If the first update changes the conditional probabilities for the second evidence, order matters.
      *   *Advice:* Process the *most reliable/cleanest* evidence first. Or, batch them into a single partition if they arrive simultaneously. For a weekly deadline, treat the week's news as a single "Evidence Bundle" partition to avoid order effects.

  7.  **Refining the "Precision Theater":**

      *   Where do people fake objectivity?
      *   Setting $P_{old}(H|E_i)$. This is counterfactual. "If this screenshot is real, what do I think?" People will anchor on their current belief.
      *   Setting $P_{new}(E_i)$. "How likely is this real?" This is pure gut feeling dressed up as a probability.

  8.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the tension (Theory vs. Messy Reality).
      *   **The Protocol (The "JC-20"):** Step-by-step instructions.
      *   **The Advisor's Rule:** Analysis (Vibe vs. Coherence).
      *   **Precision Theater:** Explicitly flagged sections.
      *   **Case Studies:** Running the protocol.
      *   **Order of Operations:** The commutativity problem.

  9.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is JC actually appropriate here?
      *   *Defense:* The prompt asks for JC. I must make JC work, even if Bayesian Conditionalization (with uncertain likelihoods) might be more standard in forecasting (e.g., using likelihood ratios). JC is specifically for *uncertain evidence*. This fits the "screenshot/poll" scenario well.
      *   *Critique:* The "Old Conditional" requirement is the biggest bottleneck.
      *   *Fix:* The protocol needs a "Pre-Mortem" step where they estimate impact *before* assigning truth values to the evidence.
      *   *Advisor Rule:* I need to be careful. If Confidence = 0.6 (60% sure evidence is real), can I move probability by 0.5? Mathematically, yes, if the likelihood ratio is extreme. But pragmatically, no. I will classify it as a "Heuristic Guardrail," not a theorem.
      *   *Case 2 (Circular):* To make it "Learned Nothing," I need to show that the $P_{new}(E)$ distribution doesn't actually shift the weighted average much because the "Real" vs "Fake" conditionals are similar, or the probability of "Real" didn't actually move enough to overcome the noise. Better: The partition reveals that even if "Real," the content is ambiguous. Let's go with: The evidence partition includes "Misinterpretation." If $P(H|Real)$ and $P(H|Misinterpretation)$ are similar, no update occurs. Or, simpler: The "Two Outlets" case. If they are the same source, the second adds no weight. But JC handles *one* evidence input at a time. I need to frame the "Two Outlets" as a single evidence event "Reports appear." If the partition is "Accurate Report" vs "Echo Chamber Noise," and we assign high probability to Echo Chamber, the update is small.
      *   *Wait, the prompt asks for one case to come out badly.* "Badly" meaning "Protocol says I learned nothing even though it felt like a big deal." I will use the Circular Reporting case for this. The intuition says "Two sources! Big news!" The protocol says "Dependent sources = Single signal = High noise probability = Minimal update."

  10. **Final Polish:** Ensure tone is practical but epistemologically rigorous. Use formatting to make it readable as a protocol.

  *(Self-Correction on Order of Operations)*: Standard JC is non-commutative. However, if the partitions are compatible and rigidity holds, it *can* be. But in messy forecasting, rigidity rarely holds across updates. I should advise batching.

  *(Self-Correction on Advisor Rule)*: "Never move more mass than confidence." If Confidence is 0.6 (60%), max move is 0.6? That's huge. If Confidence is 0.51, max move is 0.51? That allows flipping from 0.1 to 0.6. That seems too permissive. Maybe they mean "Don't move the probability of H more than the probability you assign to the evidence being reliable." I will interpret it as: $|P_{new}(H) - P_{old}(H)| \leq P_{new}(E_{reliable})$. Actually, that's still not mathematically derived from JC. I will label it a "Risk Cap."

  Let's write it.cw
answer: |-
  This is a classic tension: **Formal Epistemology** assumes clean partitions and rigid conditionals; **Real-World Forecasting** is a swamp of correlated noise and ambiguous signals. Jeffrey Conditionalization (JC) is actually the *right* tool for this mess because it allows you to update on uncertain evidence (e.g., "There's a 60% chance this screenshot is real"), but it requires discipline to avoid becoming "math-washing" for gut feelings.

  Below is the **JC-20 Protocol**. It is designed to be run by humans who know arithmetic but not measure theory. Following that, I evaluate your advisor's rule, flag the precision theater, run the three cases, and address the order-of-operations problem.

  ---

  # The JC-20 Protocol (For Messy Evidence)
  **Time Limit:** 20 Minutes per question.
  **Goal:** Traceable probability updates on ambiguous evidence.

  ### Phase 1: The Setup (5 Mins)
  *Do not look at the new evidence yet.*

  1.  **State the Hypothesis ($H$):** What exactly are we forecasting? (e.g., "Candidate X drops out before March 1").
  2.  **Record the Prior ($P_{old}(H)$):** What was our team's consensus probability *before* this specific news hit?
  3.  **Define the Evidence Partition ($\mathcal{E}$):** Break the incoming news into mutually exclusive, exhaustive scenarios.
      *   *Bad Partition:* {News is True, News is False}.
      *   *Good Partition:* {Report is Accurate, Report is Fabricated, Report is Real but Misinterpreted}.
      *   *Constraint:* You must list at least one "Noise" state (e.g., "Misinterpreted" or "Outdated").
      *   **STOP CONDITION:** If you cannot define a partition where the states are clearly distinct, **do not update.** Log the evidence as "Narrative Only" and keep the prior.

  ### Phase 2: The Counterfactuals (5 Mins)
  *This is the hardest step. You must imagine a world where the evidence state is certain.*

  4.  **Set Conditionals ($P_{old}(H|E_i)$):** For each state $E_i$ in your partition, ask: "If we knew for a fact that $E_i$ was the true state of the world, what would the probability of $H$ be?"
      *   *Constraint:* You cannot use your current belief. You must simulate certainty.
      *   *Precision Theater Alert:* If $P_{old}(H|E_{accurate})$ is basically the same as your current prior, you are anchoring. Step away and guess again.
      *   *Usable Answer:* A number between 0 and 1. If the range between the highest and lowest conditional is < 0.15, **STOP.** The evidence is not actionable even if true. Hand to human lead.

  ### Phase 3: The Reliability Assessment (5 Mins)
  *Now look at the evidence.*

  5.  **Set Evidence Probabilities ($P_{new}(E_i)$):** Based on the source quality, corroboration, and context, assign probabilities to the partition states *summing to 1*.
      *   *Example:* $P(\text{Accurate}) = 0.4$, $P(\text{Misinterpreted}) = 0.4$, $P(\text{Fake}) = 0.2$.
      *   *Constraint:* You must justify the "Noise" probability. If you assign < 0.1 to all noise states combined for a screenshot/rumor, **FLAG FOR REVIEW.** You are being overconfident.

  ### Phase 4: The Calculation & Cap (5 Mins)

  6.  **Calculate Raw Update:**
      $$P_{new}(H) = \sum [ P_{old}(H|E_i) \times P_{new}(E_i) ]$$
  7.  **Apply the Advisor's Cap (See Analysis Below):** Compare the shift $|P_{new}(H) - P_{old}(H)|$ against your confidence in the signal.
  8.  **Final Entry:** Record the final number and the "Audit Trail" (the partition and weights).

  ---

  # Analysis: The Advisor's Rule
  **Rule:** *"Never move more probability mass than your confidence in your own reading of the evidence."*

  **Verdict:** This is a **Vibe (Heuristic)**, not Coherent Kinematics.

  **Why:** In strict Jeffrey Conditionalization, the magnitude of the update depends on the *likelihood ratio* (how different $P(H|E_{true})$ is from $P(H|E_{false})$), not just the reliability of the evidence.
  *   *Scenario:* You have a 60% confidence a leak is real ($P(E_{real})=0.6$). But if it *is* real, it guarantees the event ($P(H|E_{real})=1.0$), and if fake, it guarantees it won't happen ($P(H|E_{fake})=0$).
  *   *Math:* Your prior is 0.5. Your new probability is $(1.0 \times 0.6) + (0 \times 0.4) = 0.6$.
  *   *Shift:* 0.1.
  *   *Confidence:* 0.6.
  *   *Result:* The shift (0.1) is less than confidence (0.6). The rule holds.
  *   *Counter-Scenario:* If your prior was 0.1, and the leak implies certainty, new prob is 0.6. Shift is 0.5. Confidence is 0.6. Rule holds.
  *   *Breakage:* If you are 90% confident the evidence is real, but the evidence is only weakly relevant (Conditionals are 0.55 vs 0.45), the shift might be 0.05. The rule allows moving up to 0.9. It doesn't constrain much.
  *   *Real Danger:* The rule implies a hard ceiling. If I am 51% sure a rumor is real, the rule says I can't move my forecast by more than 0.51. That's a huge move. It doesn't prevent over-updating on low-reliability info if the conditionals are extreme.

  **Replacement Rule:**
  Use a **Likelihood-Weighted Cap**.
  $$|P_{new}(H) - P_{old}(H)| \leq P_{new}(E_{signal}) \times |P(H|E_{signal}) - P(H|E_{noise})|$$
  Basically: *Your update cannot exceed the probability the signal is real multiplied by the maximum possible impact of that signal.* This prevents you from moving your probability 20% on a rumor you only think is 10% likely to be relevant.

  ---

  # Precision Theater Flags
  *Where the protocol looks mathy but is actually hiding a guess.*

  1.  **Phase 2 (Conditionals):** This is the biggest theater. Humans are terrible at counterfactuals. When asked "What if this screenshot is real?", forecasters usually just answer "What I think now, but louder."
      *   *Mitigation:* Require the team to write down the conditional *before* discussing the reliability of the screenshot.
  2.  **Phase 3 (Evidence Probabilities):** Assigning "0.4" to "Misinterpreted" feels precise. It is not. It is a disguised confidence interval.
      *   *Mitigation:* Use bins (Low/Med/High) converted to numbers (0.2/0.5/0.8) to stop people from arguing over 0.43 vs 0.47.

  ---

  # Case Studies

  ### Case 1: The Screenshot of a Paragraph
  *Context:* Teammate sends a cropped screenshot of a memo suggesting a policy shift. No header, no date.
  *   **Prior:** 30% chance of policy shift.
  *   **Partition:** {Authentic Memo, Old Memo Recirculated, Fabrication}.
  *   **Conditionals:**
      *   If Authentic: 90% (Policy definitely happening).
      *   If Old/Recirculated: 10% (Already priced in/irrelevant).
      *   If Fabrication: 5% (Noise).
  *   **Evidence Probabilities:**
      *   Authentic: 0.25 (Cropped, no metadata).
      *   Old/Recirculated: 0.50 (Common tactic).
      *   Fabrication: 0.25.
  *   **Calculation:** $(0.9 \times 0.25) + (0.1 \times 0.50) + (0.05 \times 0.25) = 0.225 + 0.05 + 0.0125 = \mathbf{0.2875}$.
  *   **Result:** **Downgrade.** The prior was 0.30. The new prob is ~0.29.
  *   **Why:** The "Old Memo" hypothesis is the killer. Even though "Authentic" pulls up, the high probability of it being stale news drags the average down below the prior.
  *   **Protocol Value:** Prevents the "Screenshot = Truth" bias.

  ### Case 2: Two Outlets, One Leak (The "Learned Nothing" Case)
  *Context:* Outlet A and Outlet B both report a leaked memo. You are 95% sure they share a single source (echo chamber). It feels like "Corroboration."
  *   **Prior:** 40% chance of event.
  *   **Partition:** {Single Source Accurate, Single Source Wrong, Independent Corroboration}.
  *   **Conditionals:**
      *   If Accurate: 95%.
      *   If Wrong: 10%.
      *   If Independent: 98% (Slightly higher than single source).
  *   **Evidence Probabilities:**
      *   Single Source Accurate: 0.30.
      *   Single Source Wrong: 0.60 (High noise in this niche).
      *   Independent: 0.10 (You are confident they are copying each other).
  *   **Calculation:** $(0.95 \times 0.30) + (0.10 \times 0.60) + (0.98 \times 0.10) = 0.285 + 0.06 + 0.098 = \mathbf{0.443}$.
  *   **Result:** **Minimal Move.** From 0.40 to 0.44.
  *   **Why it feels bad:** Intuition screams "Two sources! Double confirmation!" The protocol forces you to admit that $P(\text{Independent})$ is tiny. Because the partition forces you to account for the *dependence*, the "weight" of the second outlet is cancelled out.
  *   **Lesson:** Corroboration only matters if the sources are conditionally independent given the hypothesis. The protocol exposes the lack of independence.

  ### Case 3: The Noisy Poll (Already Priced In)
  *Context:* A poll comes out showing a 5-point lead. You already suspected this trend.
  *   **Prior:** 60%.
  *   **Partition:** {Poll Accurate, Poll Outlier/Noise, Poll Biased}.
  *   **Conditionals:**
      *   If Accurate: 85%.
      *   If Outlier: 60% (Stick to prior).
      *   If Biased: 40%.
  *   **Evidence Probabilities:**
      *   Accurate: 0.40.
      *   Outlier: 0.40.
      *   Biased: 0.20.
  *   **Calculation:** $(0.85 \times 0.40) + (0.60 \times 0.40) + (0.40 \times 0.20) = 0.34 + 0.24 + 0.08 = \mathbf{0.66}$.
  *   **Result:** Move from 0.60 to 0.66.
  *   **Advisor Rule Check:** Confidence in "Accurate" is 0.40. Shift is 0.06. Rule holds (0.06 < 0.40).
  *   **Note:** If you had treated the poll as certain ($P(E)=1$), you would have jumped to 0.85. JC saves you from over-reacting to noisy data.

  ---

  # Order of Operations (Non-Commutativity)

  **The Problem:** Jeffrey Conditionalization is **not commutative**.
  If you update on Evidence A, then Evidence B, you generally get a different result than updating on B then A.
  *Why?* Because the first update changes your "Old Conditionals" for the second update. Once you update on the Screenshot, your belief about "What a Memo implies" changes. When the Poll comes in an hour later, your $P(H|Poll)$ is now contaminated by the Screenshot.

  **The Forecasting Reality:** In a weekly cycle, you receive a "dump" of 10 ambiguous items.
  1.  **Do not process sequentially.** If you process the Screenshot, then the Poll, then the Rumor, your final number depends on the order you opened the emails.
  2.  **The Solution: The "Weekly Bundle" Partition.**
      *   Treat the entire week's news as a *single* Evidence Event.
      *   Partition: {All News Accurate, Mixed/Noise, All News Misleading}.
      *   This is cognitively hard, but it preserves commutativity because you only update once.
      *   **Alternative:** If you must process individually, process in order of **Reliability**, not arrival. Clean data (Polls) first, Ambiguous data (Rumors) last. Why? Because Rigidity (keeping $P(H|E)$ fixed) is more plausible for clean data. If you update on a rumor first, you corrupt your baseline for the poll.

  **Instruction to Teammates:**
  > "Do not update as Slack messages arrive. Collect all evidence for the week. On Sunday, treat the 'State of the World' as a single partition. If you must update sequentially, process hard data (polls, official filings) before soft data (tweets, rumors). Never update on a rumor then a poll; you will double-count the uncertainty."

  ### Summary Checklist for Your Team
  1.  **Partition First:** If you can't name the noise, you can't use the signal.
  2.  **Counterfactuals Before Confidence:** Decide what the evidence *means* before deciding if it's *true*.
  3.  **Bundle Weak Signals:** Don't let order of email arrival dictate the forecast.
  4.  **Accept "No Update":** If the protocol yields a <0.05 shift, log it as "Noise" and keep the prior. That is a successful epistemic outcome.
