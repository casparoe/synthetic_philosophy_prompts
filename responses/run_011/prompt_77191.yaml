answer: |-
  (a) **Claim-by-claim assessment**

  *   **Paragraph 2:** The claim that recurrent absence across three floors constitutes a "positive property of the deposits" rather than an argument from silence is **credit-worthy**. It correctly identifies site-formation processes (trampling/debris accumulation) as the baseline expectation, making the deviation significant.
  *   **Paragraph 3:** The identification of the building as a "temple" is **defensible but under-argued**. While "non-domestic" is licensed, "temple" assumes a specific religious function over other special-purpose uses (e.g., guild hall, council house). The distinction between licensed (continuity) and permitted (family custody) is correctly applied here.
  *   **Paragraph 4:** The inference that the pit records a "single occasion" is **flawed**. The prompt describes a pit containing mandibles but does not specify stratigraphy; assuming a single event rather than accumulated disposal over a season ignores standard site-formation alternatives for faunal pits.
  *   **Paragraph 5:** The claim that Middle-Range Theory makes the ethnographic analogy "demonstrative" rather than "conjectural" is **wrong**. This misunderstands archaeological theory; MRT establishes correlational links, not historical identities, and the Direct Historical Approach requires cultural continuity, not merely ecological similarity (dry environment/herding).
  *   **Paragraph 6:** The inference from sealings in a "later levelling fill" to contemporaneous administrative control is **flawed**. Secondary context means the sealings could be debris from elsewhere or from the building's destruction, not necessarily evidence of its active use. The leap from "one seal impression" to "chiefdom" is **defensible but under-argued**, relying on outdated typological equations (Service) without addressing counter-evidence sufficiently.
  *   **Paragraph 8:** The proposed falsifiers (domestic debris, second seal, pit stratigraphy) are **credit-worthy**. They are specific, material conditions that would directly undermine the preceding inference chain.

  (b) **Defence of contestable claims**

  *   **Para 5 (Analogy):** The strongest defence would be to argue for regional cultural continuity between the ethnographic case and Site Q beyond mere ecology. However, this defence is **not available** based on the evidence as stated; the prompt provides no data linking Site Q to the specific East African pastoralists cited, making the inference speculative.
  *   **Para 6 (Sealings):** The candidate could defend the use of sealings from a levelling fill by arguing that levelling material is typically derived from the immediate destruction of the structure itself. This defence is **partially available** (as a probability), but the candidate presents it as certainty without acknowledging the secondary context risk, which weakens the inference chain.

  (c) **Component Marks**

  *   **Depositional context and site-formation (5/8):** Strong handling of floor deposits and absence recurrence, but fails to interrogate the implications of "later levelling fill" for the sealings or the accumulation process of the bone pit.
  *   **Inference chain and licensed/permitted distinction (4/8):** Excellent structural use of the distinction, but severely undermined by fundamental theoretical errors regarding analogy and overconfidence in political typologies.
  *   **Treatment of absences of evidence (5/5):** Nuanced and correct handling of the hearth and burial absences, distinguishing effectively between silence and positive evidence of non-use.
  *   **Further evidence to change conclusions (4/4):** Provides specific, falsifiable material conditions that directly target the weak points of the argument.
  *   **Total:** 18/25

  (d) **Single issue affecting the grade**

  The theoretical misunderstanding in Paragraph 5 regarding ethnographic analogy and Middle-Range Theory outweighs all other issues. In a seminar focused on *inference*, claiming that analogy is "demonstrative" rather than heuristic contradicts the core epistemological limits the course likely seeks to instil, invalidating the confidence placed in the ritual interpretation regardless of the strength of the surrounding argument.

  (e) **Feedback for the candidate**

  You demonstrate an excellent grasp of falsification and the licensed/permitted distinction, particularly in your handling of absences and future evidence. However, you must correct your understanding of archaeological analogy: ecological similarity does not license the Direct Historical Approach, and Middle-Range Theory never renders an inference "demonstrative." Additionally, treat secondary contexts (like levelling fills) with greater skepticism before linking them to institutional function.

  (f) **Point likely missed by a hurried reader**

  A hurried reader might overlook the phrase "later levelling fill" in the prompt regarding the sealings (Paragraph 6 of the script), missing that the candidate treats secondary debris as primary evidence of administrative activity without qualifying the risk of intrusion or redeposition.

  Grade: 18/25 (B)
