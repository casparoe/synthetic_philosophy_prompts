  9.  **Final Polish:** Ensure the tone is appropriate for a philosophy-of-computation group (rigorous, precise, acknowledging the literature). Use terms like "counterfactual dependence," "causal mediation," "superposition," "polysemanticity."

      *(Self-Correction during drafting)*: I should make sure not to let Step (3) off the hook too easily. If the property $P$ is random noise, a linear probe *can* fit it in 512 dimensions. So (3) is technically true for finite samples. The real work *must* be done by (2b). If (2b) is just "functional dependence," (4) holds. If (2b) is "causal mediation," (4) fails. I need to emphasize that the colleague's definition of "sensitivity" in (2b) is too weak.

