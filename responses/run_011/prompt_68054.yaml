answer: |-
  # JOINT STATEMENT ON IDENTITY AND REPLACEMENT
  **Subject:** The Delayed Handoff Case  
  **Parties:** Functionalism (F) vs. Continuity Skepticism (S)

  ### 1. The Case Definition
  We agree to anchor our disagreement on the **Delayed Handoff**. A specific neural module is targeted for replacement. For six months, the biological module and its artificial substitute run in lockstep: both receive identical inputs, both drive the same outputs, and both remain connected. The artificial module operates at 1000x clock speed: it completes the requisite state transitions for any given biological cycle, then idles until the biological module catches up. After six months, the biological module is disconnected.

  ### 2. Shared Claims
  Despite our disagreement on survival, we agree on the following physical and structural facts:
  1.  **Physicalism:** No non-physical substances (souls, ectoplasm) are involved. All processes are physical.
  2.  **Behavioral Equivalence:** From the outside, the subject's behavior, speech, and memory reports remain indistinguishable from baseline throughout the process.
  3.  **The Speed Fact:** During the overlap, the artificial substrate undergoes 1000 physical state changes for every 1 physical state change in the biological substrate.
  4.  **The Cut:** When the biological module is disconnected, the artificial module continues driving the system without behavioral interruption.
  5.  **No Magic:** Neither side claims the other is arguing in bad faith or relying on intuition pumps that violate physics.

  ### 3. Residual Disagreements
  We disagree on whether the structural facts above are sufficient for survival. We specify the level of description for each claim to avoid hiding behind "function."

  | Claim | Functionalist Position (F) | Skeptic Position (S) | Level of Description |
  | :--- | :--- | :--- | :--- |
  | **Identity Condition** | Survival is preserved if the causal role of the system is maintained. | Survival requires the continued existence of the original living tissue. | **Causal Role** (F) vs. **Physical Constituent** (S) |
  | **Relevance of Speed** | The 1000:1 ratio is irrelevant overhead. The idle state is part of the function. | The ratio changes the physical density of events. Experience may scale with physical state changes, not abstract steps. | **Abstract State Graph** (F) vs. **Physical Event History** (S) |
  | **The Overlap** | During lockstep, there is one person with redundant hardware. | During lockstep, there are two candidates for identity, creating a branching problem. | **System Identity** (F) vs. **Candidate Count** (S) |
  | **Function Definition** | Function is defined by Input/Output mapping over 1-second intervals. | Function must include the physical rate of state transition to be sufficient for experience. | **I/O Mapping** (F) vs. **Process Realization** (S) |

  ### 4. Verbal vs. Substantive Disagreement
  We identify one potentially verbal dispute regarding the phrase **"The Same Process."**

  *   **The Dispute:** F claims the biological and artificial modules instantiate the *same process* during lockstep. S claims they instantiate *different processes* that yield the same result.
  *   **Analysis:** If "process" means "sequence of abstract logical states," this is verbal; we agree the sequence is identical. If "process" means "specific physical causal flow through time," this is substantive; we agree the physical flows differ (due to the 1000x speed and substrate difference).
  *   **Resolution:** We stipulate that this is **substantive**. The core question is whether consciousness supervenes on the abstract logical sequence (F) or the specific physical causal flow (S). We will not dissolve this by defining "process" to favor one side.

  ### 5. Cruxes and Pre-Registered Predictions
  We identify two empirical or quasi-empirical cruxes. Settling these would move at least one party.

  **Crux A: The Phenomenology of Overlap**
  *   **Question:** During the six-month lockstep, if the subject is asked "Are you experiencing anything unusual?", what is the truthful report?
  *   **Argument:** F argues the subject is one continuous entity; reports should be normal. S argues the redundancy creates ambiguity in the "locus" of experience, potentially leading to reports of dissociation or doubling.
  *   **Prediction (F):** Subject reports no change in subjective continuity or unity throughout the overlap.
  *   **Prediction (S):** Subject may report subtle dissociation, or post-cut reports will indicate a discontinuity masked by memory stitching.

  **Crux B: Damage Tolerance During Lockstep**
  *   **Question:** If the biological module is damaged at Month 3 (during overlap), does the *original* subject survive?
  *   **Argument:** F argues the artificial module is already doing the work; biological damage is irrelevant hardware loss. S argues that damaging the biological module destroys the original subject, even if the artificial copy continues behaving normally.
  *   **Prediction (F):** Survival is maintained. The artificial module seamlessly takes full load.
  *   **Prediction (S):** Survival ends at the moment of biological damage. The subsequent behavior is generated by a survivor-claimant, not the original subject.

  **Crux C: The Speed Threshold**
  *   **Question:** If the artificial module runs at 1,000,000x speed instead of 1000x, does the identity claim weaken?
  *   **Argument:** F says speed is irrelevant regardless of magnitude. S argues that at extreme ratios, the causal coupling becomes so loose that the "lockstep" is nominal only, breaking the functional equivalence at the physical level.
  *   **Prediction (F):** Identity claim remains stable regardless of speed ratio.
  *   **Prediction (S):** Identity claim degrades as speed ratio increases, becoming negligible at extreme disparities.

  ### 6. Commitment
  We agree that if **Crux B** yields results consistent with S (i.e., biological damage during overlap is treated as death by all observers including the subject's prior instructions), F must abandon the claim that functional redundancy guarantees survival. We agree that if **Crux A** yields reports of perfect continuity verified by third-party neural monitoring of the artificial module, S must concede that substrate continuity is not *strictly* necessary for reported continuity, though not necessarily for survival itself.

  We sign this not to end the debate, but to ensure the next fight is about the right things.

  **Signed:**  
  ____________________ (Functionalism)  
  ____________________ (Continuity Skepticism)  
  **Date:** ________________
