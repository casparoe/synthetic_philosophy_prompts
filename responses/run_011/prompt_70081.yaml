answer: |-
  ## The Signaling Filter Protocol

  **Purpose:** To evaluate membership/fee proposals based on their ability to distinguish long-term partners from short-term extractors.
  **Time Required:** 45–60 minutes.
  **Output:** A one-page Board Memo (template below).

  ### The Five Questions

  **1. What is the denominator of the cost? (Cash vs. Effort)**
  *   **Ask:** Is the cost purely financial, purely labor/reputation, or hybrid?
  *   **Pass:** Labor/Reputation (e.g., seconding staff, public commits) or Hybrid.
  *   **Fail:** Pure Cash (easier for extractors with deep pockets to ignore).
  *   **Why:** Cash is liquid; effort requires organizational integration.

  **2. Is the cost asymmetric? (The "Tourist Test")**
  *   **Ask:** Is this cost significantly *more painful* for a company planning to leave in <2 years than for one staying >5 years?
  *   **Pass:** Yes. (e.g., Integrating code into your product is painful to undo; writing a check is not).
  *   **Fail:** No. (e.g., A one-time fee is a sunk cost a tourist will pay to access the room once).
  *   **Why:** A signal only works if it costs the "wrong" type more than the "right" type.

  **3. Is the cost recurrent? (The "Zombie Test")**
  *   **Ask:** Does the requirement renew annually, or is it a one-time gate?
  *   **Pass:** Recurrent (Annual fee, annual code audit, yearly secondment).
  *   **Fail:** One-time (Application fee, setup cost).
  *   **Why:** Longevity is a time-based metric. One-time costs filter for *entry*, not *retention*.

  **4. Can the cost be outsourced? (The "Consultant Test")**
  *   **Ask:** Can a company pay a third party to satisfy this requirement without internal engagement?
  *   **Pass:** No. (e.g., "Named engineer must be on payroll," "Commit must come from company domain").
  *   **Fail:** Yes. (e.g., "Submit a patch," "Attend a meeting").
  *   **Why:** If they can buy their way out of engagement, they aren't investing in the standard.

  **5. What is the Community Optic? (The "Sellout Test")**
  *   **Ask:** Does this look like "paying for influence" or "investing in infrastructure"?
  *   **Pass:** Investing (Labor, shared risk).
  *   **Fail:** Paying (Cash for votes, fees for access).
  *   **Why:** Individual contributors maintain the standard. If they view the board as buyers, they will fork the project.

  ---

  ### ⚠️ Where Procedure Becomes Judgment
  **Step 5 is not mechanical.** Deciding whether a specific requirement looks like "investment" or "influence" depends on the current political climate of your community.
  **Strategic Fit (The "Who We Are" Clause):** If a proposal passes Q1–Q4 but conflicts with your mission (e.g., it filters out small startups you *want* to support), you must override the signal logic. **Mark this clearly on the Board Memo.** A failed signal can be accepted for strategic reasons, but the Board must acknowledge they are trading information for values.

  ---

  ### Limitations (What This Won't Catch)
  1.  **The High-ROI Extractor:** If a company can steal IP or manipulate the standard to make $10M, they will happily pay $50k or second an engineer to do it. This filter assumes bad actors are cost-sensitive.
  2.  **The Accidental Tourist:** A company may intend to stay 5 years, pay the cost, and then go bankrupt in Year 2. This filters for *intent/capability*, not *fortune*.
  3.  **The "Box-Ticker":** Large firms may treat seconding an engineer as a HR administrative task with no actual engagement. You must verify the *quality* of the contribution separately.

  ---

  ### Board Memo Template (One Page)

  | Proposal: | [Name] |
  | :--- | :--- |
  | **Signal Strength** | **High / Medium / Low** (Based on Q1–Q4) |
  | **Community Risk** | **High / Medium / Low** (Based on Q5) |
  | **Strategic Override** | **Yes / No** (Are we accepting weak signals for values?) |
  | **Recommendation** | **Approve / Reject / Modify** |
  | **Key Risk** | [One sentence on how this could be gamed] |

  ***

  ## Application to Live Proposals

  ### 1. Drop Sustaining Fee to $10k + 1 FTE Engineer (12 Months)
  *   **Q1 (Denominator):** Effort/Hybrid. **PASS.**
  *   **Q2 (Asymmetry):** High. A tourist doesn't want to integrate their engineering culture with yours. A partner is already doing this. **PASS.**
  *   **Q3 (Recurrent):** 12-month commitment is a strong proxy for multi-year intent. **PASS.**
  *   **Q4 (Outsource):** Hard to outsource a seconded engineer without them becoming a contractor (which is visible). **PASS.**
  *   **Q5 (Optic):** Excellent. Shows "sweat equity." **PASS.**
  *   **Judgment Call:** None needed. Signal aligns with values.
  *   **Verdict:** **APPROVE.**
  *   **Risk:** Company sends a junior engineer to "warm a seat." *Mitigation:* Require the engineer to have commit rights and attendance in technical working groups.

  ### 2. $2,500 Application Fee + Mandatory In-Person Meeting
  *   **Q1 (Denominator):** Cash + Time. **FAIL.** (Mostly cash).
  *   **Q2 (Asymmetry):** Low. $2.5k is noise for large extractors. Travel is easier for large firms than small partners. **FAIL.**
  *   **Q3 (Recurrent):** One-time fee. **FAIL.** (Filters entry, not retention).
  *   **Q4 (Outsource):** Anyone can send a traveler. **FAIL.**
  *   **Q5 (Optic):** Negative. Looks like "pay-to-play" gatekeeping. **FAIL.**
  *   **Judgment Call:** None. This fails on mechanics.
  *   **Verdict:** **REJECT.**
  *   **Risk:** Filters out cash-poor startups (good partners) while admitting cash-rich tourists (bad partners).

  ### 3. Waive Fees for Companies <20 People
  *   **Q1 (Denominator):** Zero Cost. **FAIL.** (No signal).
  *   **Q2 (Asymmetry):** N/A.
  *   **Q3 (Recurrent):** N/A.
  *   **Q4 (Outsource):** N/A.
  *   **Q5 (Optic):** Positive. Supports the "little guy." **PASS.**
  *   **Judgment Call:** **STRATEGIC OVERRIDE.** You are explicitly trading signal for ecosystem diversity.
  *   **Verdict:** **APPROVE WITH MODIFICATION.**
  *   **Modification:** Waive *cash* fees, but maintain *contribution* requirements (e.g., minimum 4 technical contributions/year). This preserves the "Effort" signal from Case 1 while removing the cash barrier.
  *   **Risk:** Companies split legally to stay under 20 heads. *Mitigation:* Define by revenue or funding raised, not just headcount.

  ***

  ## Retrospective: The $50k Ghost Firm

  **Would this procedure have flagged them?**
  **Yes.**
  Under the old system (Cash only), they passed. Under *The Signaling Filter*:
  *   **Q2 (Asymmetry):** For a massive firm, $50k is not asymmetric. It is low-friction. This would have been flagged as a **Low Signal Strength** in the memo.
  *   **Q1 (Denominator):** Pure cash is a weak signal for technical commitment.
  *   **Result:** The Board Memo would have read: *"Signal Strength: Low. Risk: High. This fee is too low relative to the firm's size to indicate genuine partnership."*

  **What needs to be added?**
  The procedure needs a **Scale Clause**: *Costs must be evaluated relative to the applicant's size.* A $50k fee signals differently for a 50-person startup than a 50,000-person conglomerate.
  *   **Addition:** "For Sustaining Members, cash fees must be paired with effort requirements OR scaled to revenue."

  **Does this break Case 1 or 3?**
  *   **Case 1 (Engineer Secondment):** This *solves* the scale problem. One engineer costs a small firm more (proportionally) than a large firm, but the *organizational friction* is high for both. It actually strengthens the defense against the Ghost Firm.
  *   **Case 3 (Small Company Waiver):** If we add "Scale Clause," Case 3 becomes riskier. If we waive fees for small companies, we must ensure the *effort* requirement remains. If we waive both, we admit we have no signal for them. The modification suggested above (Waive Cash, Keep Code) satisfies the Scale Clause without breaking the waiver.

  ***

  ## The Community Optic (The "Credibility" Question)

  **Is this the same question?**
  No. The procedure above asks: *"Will this company stay?"*
  The Community Optic asks: *"Will the volunteers revolt?"*

  **How to fold it in:**
  Treat Community Optic (Q5) as a **Veto Condition**.
  *   A proposal can have perfect signaling mechanics (high cost, asymmetric, recurrent) but still destroy the foundation if it looks like corporate capture.
  *   **Example:** If you require Sustaining Members to write 50% of the core code, the signal is perfect (they are invested), but the community will fork the project because the standard is now "owned" by payers.
  *   **Rule:** If Q5 is rated **High Risk**, the proposal requires a 2/3 Board vote *and* a public comment period before adoption. You cannot proceduralize trust; you must solicit it.

  **Summary for the Board:**
  We are moving from "Can they pay?" to "Are they integrated?" Cash filters for liquidity. Effort filters for commitment. We should prioritize proposals that make it expensive to *leave*, not just expensive to *join*.
