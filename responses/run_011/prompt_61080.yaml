answer: |-
  The air in the Weights Office always smelled of ozone and old paper, a static charge that made the hair on Elara's arms stand up. She sat before the console, the master ledger glowing softly in the dim room. It was not a book anymore, but the function remained the same. Column A listed the injuries. Column B listed the equivalents.

  Currently, the screen read: *1 Unit of Systemic Neural Failure = 4,200,000 Units of Mild Cephalic Pressure.*

  Elara rubbed her temples. The case on her desk was the Verrick Petition. A pharmaceutical company wanted to deploy a dampener field over the southern district. It would erase the capacity for severe nerve pain in everyone within the zone. The cost was a side effect: the total removal of mild discomfort. No stubbed toes. No background anxiety. No itches.

  The math, based on the current ledger, approved the project. The aggregate weight of millions of headaches outweighed the singular horror of the nerve failure suffered by a few hundred patients. But Elara knew the ledger was wrong. She had known for months.

  She picked up her pen. The tip hovered over the revision form. To change the ratio was to shift the budget of the entire state. Hospital triage would change. Factory safety inspections would loosen or tighten. It was not just arithmetic; it was the architecture of mercy.

  The door chimed. Kael stepped in, holding a tablet. He was her junior actuary, sharp-eyed and perpetually tired.

  "The petitioners are waiting in Hall B," Kael said. "They say the dampener makes life feel flat."

  "They say losing the itch makes the scratch meaningless," Elara replied. "I've heard the argument."

  "It's not just philosophy, Elara. They feel hollowed out."

  "They feel safe from the thing that breaks minds."

  Kael set the tablet on her desk. "If you adjust the ratio to favor the nerve failure, you kill the project. Those millions keep their migraines."

  "Those millions keep their ability to feel nothing worse than a migraine."

  "And the few hundred keep the agony."

  Elara looked back at the screen. The numbers blurred slightly. She wasn't trying to maximize pleasure. That was a different department, the one that funded the pleasure gardens and the taste-enhancers. Her job was the subtraction of the negative. But the subtraction had rules.

  "If I lower the value of the migraines," Elara said, "I have to define where pain stops counting."

  "You're talking about a threshold," Kael said. "You want to draw a line below which suffering doesn't exist."

  "I want to stop the math from eating the person."

  "If you say mild pain counts for zero, you ignore the cumulative effect."

  "If I say it counts for something, eventually the sum outweighs the scream."

  Kael leaned against the console. The light from the ledger cast deep shadows under his eyes. He knew where this logic led. They both did. It was the shadow that lived in the basement of the office, the one they didn't put in the manuals.

  "You know what the critics say," Kael said. "If the scream outweighs the itches, then preventing the scream is the only duty."

  "That is the duty."

  "Then why not end the source of the itches entirely?"

  Elara's hand tightened on the pen. "Don't."

  "If you painlessly ended existence, you prevent all future screams," Kael said. "Your ledger implies that is the optimal solution."

  "My ledger manages the living, not the unborn."

  "That's a distinction without a difference if the goal is zero pain."

  Elara stood up. The chair scraped loudly against the floor. She walked to the window. Outside, the city hummed. People were walking to work, carrying groceries, arguing with their children. They were carrying invisible loads of minor irritations and hidden terrors.

  "There is an asymmetry," Elara said. "Creating pleasure is not the same as removing pain."

  "I didn't ask about pleasure."

  "Ending a life removes the possibility of relief."

  "It also removes the possibility of agony."

  Elara turned back to him. She needed him to understand that this wasn't about nihilism. It was about the priority of the negative. The scream demands attention in a way the whisper does not. But she couldn't say that without sounding like she was dismissing the whisperers.

  "If I sign this revision," Elara said, "I am saying the nerve failure is lexically prior."

  "I know what you're signing."

  "It means no amount of headaches justifies watching someone break."

  "It means you might justify ending the world to stop a headache."

  Elara walked back to the desk. She sat down. The form waited for her. Box 4 required the threshold coefficient. If she set it to zero, mild pains vanished from the equation. The dampener project would be canceled because the severe pain would stand alone, uncountered by the aggregate mild pain. But setting it to zero meant admitting that a lifetime of mild irritation was worth nothing.

  If she set it to one, the aggregation held. The dampener passed. The few hundred suffered the nerve failure so the millions could avoid the migraines.

  "Is there a third option?" Kael asked.

  "There is always a third option," Elara said. "It's usually just a slower version of the first two."

  "The petitioners want a vote."

  "We don't vote on pain."

  "They say it's their pain."

  "It is their pain, but it is my ledger."

  Kael sighed. He looked at the screen, then at Elara. He wasn't an enemy. He was just afraid of the logic they served. He feared that if they followed the line to its end, there would be nothing left but silence.

  "You're trembling," Kael said.

  "The coefficient requires precision."

  "You're afraid of the implication."

  "I'm afraid of being wrong about the weight of a scream."

  Kael pushed off the desk. He walked to the door. He paused with his hand on the frame. He didn't look back.

  "If you set the threshold too high, you ignore the slow erosion," Kael said. "If you set it too low, you justify the extinguisher."

  "I know."

  "Whatever you put in Box 4, someone suffers."

  "Someone always suffers."

  Kael left. The door clicked shut. The room was silent again, save for the hum of the servers. Elara looked at the form. The cursor blinked in Box 4. It was a simple numeric field. A decimal point and three digits.

  She thought about the nerve failure patients. She had seen the footage once. It was not just pain. It was the dissolution of the self. The mind retreats until there is nothing left but the signal. No past, no future. Only the red hot now.

  Then she thought about the migraines. Not the clinical ones, but the daily static. The tension in the neck. The worry about rent. The sting of a cold wind. Alone, they were manageable. Together, over a lifetime, they wore people down. They made people cruel. They made people short-tempered.

  If she canceled the dampener, the millions kept the static. Would that static eventually become the red hot now for someone else? Did the mild pain feed the severe?

  She picked up the pen. The ink was black. The paper was thick, textured stock. It felt heavy in her hand.

  To set the threshold at zero was to say the mild pain did not matter. That felt like a lie. Pain was pain. But to let it aggregate was to let the millions vote away the sanity of the few.

  She thought about Kael's comment. The extinguisher. If the goal was the reduction of the negative, then non-existence was the only guarantee. But she worked in the Weights Office. She managed weights. She did not manage existence.

  But was that a real boundary? Or was it a comfort she told herself?

  If she prevented a birth, she prevented pain. If she ended a life, she prevented pain. The ledger treated them differently. One was a zero entry. The other was a closure.

  Why?

  Because the living had a claim. The claim was not to pleasure. The claim was to the possibility of the pain ending without the person ending.

  Elara dipped the pen. The ink pooled at the tip. She lowered it to the paper.

  If she wrote 0.000, the dampener failed. The nerve failure patients remained in agony. The budget went to palliative care that barely touched the surface.

  If she wrote 1.000, the dampener passed. The nerve failure was erased. The millions lost their capacity for mild discomfort. They became flat. Safe. Hollow.

  There was a knock at the door. It wasn't Kael. It was the messenger from the Review Board. They wanted the revision within the hour. The budget cycle turned regardless of her doubt.

  "Come in," Elara said.

  The messenger didn't enter. He just slid the envelope under the door. A reminder. The deadline was real.

  Elara looked at the window again. The sun was setting. The city lights were coming on. Somewhere out there, someone was holding their head in their hands. Somewhere else, someone was screaming into a pillow so the neighbors wouldn't hear.

  She looked back at the form. Box 4.

  She realized she had been treating the threshold as a fact of the universe. It wasn't. It was a decision. It was a choice about what kind of world she could bear to administer.

  If she acknowledged the mild pain, she had to accept the aggregation. If she accepted the aggregation, she had to accept that the many could outweigh the one. If the many could outweigh the one, then the logic of the extinguisher was valid.

  Unless.

  Unless the severe pain was not just more pain. Unless it was a different category. A qualitative break.

  But the ledger demanded numbers. It demanded conversion. It demanded that everything be translatable into a common currency.

  She pressed the pen to the paper. The ink bled slightly into the fiber.

  She wrote a number. It wasn't zero. It wasn't one. It was a variable that would require a new algorithm to process. It would kick the decision to the next cycle. It would buy time.

  It would not solve the problem. It would only delay the accounting.

  Elara lifted the pen. The number sat on the page, dark and final. She blew on the ink to dry it. The air moved across the wet surface.

  She placed the form in the outbox. The metal tray clattered softly.

  Outside, the city continued to hum. The servers in the room continued to whir. The smell of ozone persisted. Elara stood up and walked to the window. She placed her hand against the glass. It was cold.

  She watched the lights below. She waited for the system to process the input. She waited for the error message. It did not come.

  The ledger updated. The new coefficient loaded. The numbers shifted.

  Elara turned away from the window. She picked up her coat. She turned off the console. The room went dark, save for the standby light on the server rack. It blinked green. Once. Twice.

  She locked the door behind her. The key turned with a heavy click. She put the key in her pocket. She walked down the hallway toward the elevators. The floor was polished stone. Her heels clicked against it.

  At the elevator bank, she stopped. She looked at her reflection in the brushed steel doors. She looked tired. She looked like someone who carried a weight.

  The elevator arrived. The doors opened. She stepped inside. She pressed the button for the ground floor.

  The doors closed. The car began to descend. Her stomach lifted slightly.

  She took the pen from her pocket. She looked at the cap. It was scratched. She put it back in her pocket.

  The elevator slowed. It stopped. The doors opened.

  Elara stepped out into the lobby. The security guard nodded at her. He didn't speak. She nodded back. She pushed open the front door.

  The air outside was cool. It smelled of rain and exhaust. She walked to the curb. She waited for the light to change.

  Across the street, a man dropped a bag of groceries. An orange rolled into the gutter. He cursed. He bent down to pick it up. He winced as he straightened.

  Elara watched him. She waited for the light to turn green.
