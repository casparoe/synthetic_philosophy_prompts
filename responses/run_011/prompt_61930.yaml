answer: |-
  Your working theory is half-right, but calling it "merely verbal" or a "badly posed question" lets the participants off the hook too easily. It isn't that they are answering different questions; it's that they are fighting over which question *ought* to be the primary one for naturalizing normativity. The stalemate persists not because of confusion, but because the debate is a proxy war for a deeper metaphysical tension: **Can biology be normative without history?**

  Here is the diagnosis, breaking down the dialectic, the malfunction problem, the reading case, and the prospects for progress.

  ### 1. Matching the Arguments: Talk Past vs. Engage

  You are correct that there is significant talking past one another, but there is a hard core of substantive disagreement that prevents collapse.

  *   **Where they talk past:** They often disagree on the *extension* of the word "function" without acknowledging they are fixing different intensions. When a Cummins-style theorist says "The heart functions to pump blood," they mean "The heart contributes to the circulatory capacity by pumping." When a Millikan-style theorist hears this, they hear "The heart is *supposed* to pump blood." The SE theorist hears a normative claim where the CR theorist intends a descriptive one. This is verbal.
  *   **Where they actually engage:** The engagement happens on the **Novelty Objection** and the **Normativity Objection**.
      *   *The Novelty Objection (CR vs. SE):* This lands. SE accounts genuinely struggle with traits that have no selection history (like the reading circuitry you mention). SE proponents usually respond by stretching "selection" to include cultural or developmental retention. This isn't talking past; it's a substantive bet that *all* function must be grounded in a stabilizing feedback loop. If the CR theorist insists a novel trait has a function *immediately* upon formation without any retention history, that is a metaphysical clash about whether teleology requires time.
      *   *The Normativity Objection (SE vs. CR):* This also lands. CR accounts genuinely struggle to distinguish a broken heart from a heart that simply doesn't pump (e.g., in a corpse, or during surgery). If function is just "what it does," then a fibrillating heart is functioning to fibrillate. CR theorists reply by appealing to a "capacity of the containing system," but this invites the question: why is *that* capacity the standard? SE theorists say: because selection made it the standard. CR theorists say: because it's the capacity we are explaining. This is a substantive disagreement about whether norms are discovered (in history) or imposed (by explanatory interest).

  **Verdict:** It is not merely verbal. It is a clash between **historical essentialism** (SE) and **systemic structuralism** (CR).

  ### 2. Is the Malfunction Point Decisive?

  This is the engine of the debate. You asked if CR can have malfunction, or if SE is loading the dice.

  *   **Can CR have malfunction?** Yes, but only hypothetically. A CR account can say a heart is malfunctioning if it fails to contribute to the *assumed* capacity of the system (circulation). But this makes malfunction relative to the *ascription* of the system's goal. If I analyze a human as a heat-radiator, a fever is a function. If I analyze them as a homeostatic organism, a fever is a defense mechanism or a malfunction.
  *   **Is SE loading history?** Yes, but openly. They argue that without history, "malfunction" is just "difference." To get "wrong," you need a "right" that exists independently of current performance. History provides that independent standard.
  *   **The Middle-Way (Organizational/Dispositional):** Do they escape? Accounts like the SMT (Systemic-Maintenance Theory) or organizational accounts try to ground norms in the **self-maintaining structure** of the organism. A part functions if it contributes to the conditions that keep the whole existing.
      *   *Do they escape the dilemma?* They avoid the history requirement (solving the novelty problem) and they ground norms in the system's own organization (solving the malfunction problem).
      *   *Do they paper it over?* They risk circularity. What counts as "self-maintenance"? If a cancer cell maintains itself by killing the host, is it functioning? The organizational account must privilege the *whole* over the *part*, but the boundary of the "whole" is often where the medical dispute lies (e.g., is a pregnancy part of the woman's system or a distinct entity?).
      *   *Diagnosis:* The organizational account is the strongest contender for a synthesis, but it trades the "history" problem for a "boundary" problem. It doesn't dissolve the fight; it relocates it to mereology.

  ### 3. The Reading Case (Retention vs. Reproduction)

  The brain circuitry for reading is the canonical counterexample to strict SE.

  *   **Does it decide the account?** No. It forces a choice on what counts as a "selective regime."
  *   **The Move:** SE proponents often adopt a "cultural selection" or "developmental selection" move. If the circuitry is retained because it was useful in learning, that is a selection-like process.
  *   **The Implication:** If you accept retention as a form of selection, SE absorbs the counterexample but becomes almost indistinguishable from a sophisticated CR account. If you reject retention as selection, SE admits it cannot account for human-specific novelties.
  *   **Diagnosis:** This case reveals that the real divide isn't "History vs. Now," it's **"Stability vs. Instantiation."** SE requires the trait to be stable across a population over time to be a function. CR requires only that the trait instantiate a causal power now. The reading case shows that human medicine deals heavily in traits that are stable developmentally but not evolutionarily. If medicine cares about *human* norms rather than *species* norms, CR (or Cultural-SE) wins. If medicine cares about *biological* norms strictly, SE wins. The stalemate is often a disagreement about whether medicine is a biological science or a human science.

  ### 4. Pluralism (Interest-Relative Function)

  The third crowd says: "Function is context-dependent. Use SE for evolution, CR for physiology."

  *   **Is it giving up?** No, it's semantic ascent. It acknowledges that "function" is a polysemous term in scientific practice.
  *   **Is it the resolution?** Pragmatically, yes. Metaphysically, no.
  *   **The Problem for Medicine:** Medicine doesn't want pluralism. Medicine wants to know if a condition is a *disease* (malfunction) or a *variation* (normal function). If function is interest-relative, then disease is interest-relative. If a patient *wants* to hear voices (CR: useful for their artistic goals), is auditory hallucination a dysfunction? SE says yes (ears/brain not selected for that). CR says maybe not (depends on the system goal). Pluralism says "it depends on which account you use."
  *   **Diagnosis:** Pluralism dissolves the philosophical fight but forfeits the prize. The reason the debate stays hot is that both sides want **objective normativity** for medicine. Pluralism admits objective normativity is unavailable. That's why the partisans reject it—it feels like capitulation on the possibility of a naturalized ethics of health.

  ### 5. The Honest Part: Progress and Pedagogy

  **What would count as progress?**
  Don't expect a knockout. The debate is stuck because it is trying to solve an "Is-Ought" problem using empirical constraints.
  *   **Progress looks like:** Abandoning the search for a monistic definition of "function" and instead mapping the **trade-offs**. We need a formal taxonomy of what you lose when you pick a side.
      *   Pick SE: You get normativity and malfunction, but you lose novelty and you pathologize evolutionary mismatches (e.g., is sugar craving a dysfunction now? SE says no, it's functioning as selected. CR says yes, it harms the system).
      *   Pick CR: You get novelty and immediate explanatory power, but you lose the ability to distinguish disease from difference without smuggling in social norms.
  *   **New Distinction:** The most productive move is distinguishing ** Etiological Function** (why it's there) from **Systemic Function** (what it does now) and admitting medicine needs *both* but for different purposes. Diagnosis needs Systemic (what's broken now?). Prognosis/Ethics needs Etiological (is this fixable/natural?).
  *   **Formal Machinery:** Causal graph modeling might help. If we model the organism as a control system, "malfunction" can be defined as a deviation from a set-point. This looks like CR, but if the set-point is established by history, it incorporates SE. This doesn't solve the metaphysics, but it clarifies the mechanism.

  **Should you keep teaching it as a live debate?**
  **Yes, but change the framing.**
  Don't teach it as "Which one is true?" Teach it as "What kind of medicine do you want to practice?"
  *   If you teach SE, you are teaching a conservative medicine that respects evolutionary design and is skeptical of enhancement.
  *   If you teach CR, you are teaching an engineering medicine that focuses on system optimization and is open to enhancement.
  *   The stalemate is valuable because it forces students to see that **definitions of disease are political and metaphysical, not just empirical.**

  **Will it last another 50 years?**
  Yes. Because the underlying question is not "How do hearts work?" but "Is nature normative?" As long as people want to derive "ought" (health) from "is" (biology), they will oscillate between History (to ground the Ought) and Structure (to ground the Is). The tension is a feature of naturalizing normativity, not a bug in the arguments.

  **Summary for your seminar:**
  Tell your students the stalemate isn't a failure of intelligence. It's a symptom of trying to use biology to do ethics. The SE/CR fight is the scar tissue of that attempt. Progress isn't picking a winner; it's understanding the cost of the ticket for each side.
