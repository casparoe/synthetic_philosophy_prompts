      *   **Tone:** Critical, analytical, direct, respectful of expertise.

  2.  **Deconstruct the User's Working Theory:**
      *   *Theory:* The SE (Selected Effect) vs. CR (Causal Role) debate is a verbal dispute caused by answering different questions (Etiology vs. Current Contribution). The stalemate exists because both want to ground "malfunction" for medicine (disease vs. enhancement).
      *   *Claim:* It's a badly posed question, not a failure of argument.

  3.  **Address Sub-Question 1: Matching Arguments (Talk Past vs. Engage):**
      *   *SE Critique of CR:* "Can't ground malfunction." *Verdict:* Substantive *if* you assume function is normative. If function is just explanatory contribution, CR wins. If function implies "ought," CR fails.
      *   *CR Critique of SE:* "Novel traits/ontogeny." *Verdict:* Substantive *if* you assume function applies to novel traits. SE proponents usually bite the bullet (no function yet) or stretch "selection" (cultural selection).
      *   *Where they talk past:* When defining "function." SE = "The function of X is F" means "X exists because it did F." CR = "The function of X is F" means "X does F which contributes to capacity C."
      *   *Where they engage:* On the *normativity* of biology. Can biology be normative without history?

  4.  **Address Sub-Question 2: The Malfunction Point:**
      *   *Is it decisive?* It's the pressure point. Medicine *needs* malfunction.
      *   *Can CR have malfunction?* Only relative to a model or a goal. A heart that doesn't pump is broken *relative to the goal of circulation*. But where does the goal come from? If it's just the observer's interest, disease becomes subjective. If it's the organism's goal, we need a theory of organizational goals (Boorse, etc.).
      *   *Are SE people loading history?* Yes, they define malfunction as "failure to perform the effect that was selected for."
      *   *Middle-way (Organizational/Dispositional):* Do they escape? They ground norms in self-maintenance (autopoiesis). A part functions if it contributes to the self-maintenance of the whole. Malfunction is failure to contribute to self-maintenance. *Critique:* This looks like CR but with a specific system-boundary constraint. It avoids history but risks circularity (what counts as the 'self' to be maintained?).

  5.  **Address Sub-Question 3: The Reading Case (Retention vs. Reproduction):**
      *   *The Case:* Reading circuits. No evolutionary history. Robust causal role.
      *   *SE Response:* No biological function. Maybe cultural function (if cultural selection counts).
      *   *CR Response:* Clearly has a function (decoding symbols).
      *   *Retention (Developmental/Cultural):* Does this decide it? It shifts the boundary of "selection." If "retention" counts as a selection-like process, SE absorbs the counterexample. If not, SE admits limits.
      *   *Diagnosis:* This doesn't solve the metaphysical split; it just moves the goalposts on what counts as a "selective regime." It highlights that SE is really about *explanatory stability*, not just DNA replication.

  6.  **Address Sub-Question 4: Pluralism (Interest-Relative):**
      *   *Is it giving up?* Not necessarily. It's a semantic ascent. "Function" is polysemous.
      *   *Is it the resolution?* Pragmatically, yes. Metaphysically, unsatisfying for medicine. Medicine wants *the* definition of disease, not "a definition relative to this context." If disease is interest-relative, the therapy/enhancement line blurs.
      *   *Verdict:* It dissolves the fight but might dissolve the prize (objective disease norms) that the fighters wanted.

  7.  **Address the "Honest Part" (Progress & Teaching):**
      *   *What counts as progress?* Not a knockout argument. Progress is recognizing the *trade-off*. You can have normativity (SE) or you can have novelty/immediacy (CR), but getting both requires a hybrid (Organizational) that has its own costs.
      *   *Why teach it?* Because it reveals the structure of biological explanation. It forces students to choose what kind of naturalists they are. It exposes the hidden normative commitments in medicine.
      *   *Prediction:* Another 50 years? Likely. Because the underlying tension (Is nature normative?) is not empirical, it's metaphysical/ethical.

