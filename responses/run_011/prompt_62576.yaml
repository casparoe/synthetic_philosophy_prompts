answer: |-
  Dear Friend,

  It is a rare and difficult thing to reach the fourth year of a novel and find that the obstruction is not a matter of plot mechanics but of metaphysics, yet I am not surprised that you have arrived here. The sagging middle you describe is often the symptom of a story that has outgrown its initial premise, and in this case, your premise rests on the notion of individual genius in a world that operates on collective inevitability. You are asking whether credit is a reward for being the cause of an event or simply a marker of being the first to register it, and this is a question that has haunted the history of science since the Royal Society began keeping minutes. To help you untangle this, I want to offer you a specific historical case that mirrors your fictional dilemma closely, not because it provides a solution, but because it sharpens the conflict you are already sensing.

  Consider the discovery of the planet Neptune in 1846, which stands as one of the cleanest examples of near-simultaneous discovery in the history of astronomy. The context was the irregular orbit of Uranus, which suggested the gravitational pull of an unseen body. In England, a young Cambridge mathematician named John Couch Adams had completed calculations predicting the position of this body by October 1845. He handed his results to George Airy, the Astronomer Royal, but Airy was skeptical and asked for clarifications that Adams, being shy and inexperienced, did not promptly provide. Meanwhile, in France, Urbain Le Verrier, a professional astronomer with a reputation for rigor, began working on the same problem independently. He published his first memo in June 1846 and a second, more precise prediction in August 1846. Le Verrier sent his coordinates to Johann Galle at the Berlin Observatory, who pointed his telescope to the specified spot on the night of September 23, 1846, and found the planet within an hour. Adams had actually predicted the position with comparable accuracy months earlier, but because he had not secured an observation, the French claimed the discovery. The resulting priority dispute was fierce, dividing the British and French scientific communities along national lines, until a compromise was reached where both men were credited.

  The conceptual issue here, which you could hand directly to a philosopher of science, is the problem of epistemic preemption in the context of realist ontology. If the planet existed independently of the observers, then the truth was available to be found regardless of who found it. Adams was the preempted cause, like your backup assassin, while Le Verrier was the actual cause of the public knowledge. The dispute turns on whether discovery is defined by the private acquisition of truth, which favors Adams, or the public certification of truth, which favors Le Verrier. In your terms, Adams had the private notebooks and the weeks of lead time, but Le Verrier had the instruments, the network, and the act of publication that made the discovery real for everyone else. The case shows that individual credit does not survive the discovery of inevitability intact; rather, credit is revealed to be a social technology designed to incentivize the public registration of truth, not a natural right attached to the private conception of it. The planet was there, the math was waiting, and yet the world needed a name to attach to the event so that it could be filed, taught, and built upon.

  This leads me to your question about which picture of credit you ought to build into your characters. You present a choice between desert tracking difference-making, which leads to nihilism because the discovery was inevitable, and desert tracking actualization, which favors the professor who published. If you build the first picture into your characters, they will seem paralyzed or cynical, and the drama of the priority dispute will evaporate because they will agree that nothing matters. If you build the second picture into them, they will fight with the fervor of people who believe their livelihood and legacy are at stake, which is where the energy of your novel lies. My advice is to let the world of the novel operate on the second picture while letting your heroine glimpse the first. The professor should believe utterly that he deserves the name because he did the work of making it real, that he captured the lightning and therefore owns the storm. Your heroine, however, should be the one who suspects that the lightning was going to strike anyway, that her private notebooks are a testament to a truth that does not require her signature.

  This division allows you to preserve the drama of the priority dispute while acknowledging the philosophical truth that is causing your middle to sag. The reader will sympathize with the heroine not because she is the rightful owner of the idea in a metaphysical sense, but because she bears the burden of knowing that ownership is an illusion. The tragedy is not that she was robbed of something that was uniquely hers, but that she is forced to compete for a prize that she knows was never really hers to win. This shifts the conflict from a legal battle over who was first to a psychological battle over what it means to be necessary in a world of multiples. The professor fights for his name because he believes it secures his place in history; the heroine fights because she is trying to understand if her place in history matters if the history would have written itself without her.

  By anchoring the conflict in this way, you avoid the nihilism of the first picture without endorsing the injustice of the second. You show that credit is a contract between the individual and the society, not a reflection of cosmic debt. The professor gets the name on the thing, and in the eyes of the law and the public, he deserves it because he completed the circuit. But the reader knows, through the heroine, that the circuit was waiting to be completed by anyone with the right wire. This allows you to keep the plot engine running—the letters, the lawyers, the dispute—while giving the middle of the book a thematic weight that transcends the specific quarrel. The sag comes from uncertainty, and if you decide that the uncertainty belongs to the heroine while the certainty belongs to the professor, the structure will hold. You do not need to solve the philosophical problem to write the novel; you only need to ensure that the characters feel the problem differently, so that their collision produces heat rather than just noise.

  I hope this helps you find your way through the next draft. The fact that you are wrestling with this suggests the book is ready to become something more than a period drama about invention, and that is a good place to be stuck.

  Warmly,

  A Reader
