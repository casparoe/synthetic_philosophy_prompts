answer: |-
  You must reject step six because it commits the genetic fallacy, erroneously assuming that the legal validity of modern institutions is contingent upon the legitimacy of their historical predecessor.

  This step looked perfectly fine when you wrote it because we intuitively treat legal lineage like biological heredity, assuming that a defect in the founding act must infect all subsequent generations. It is rhetorically powerful to suggest that the International Criminal Court (ICC) stands on the same footing as the Nuremberg Tribunal, but legally they rest on entirely distinct bases. Nuremberg derived authority from the London Charter and the unconditional surrender of a sovereign state, whereas modern tribunals derive authority from multilateral treaties like the Rome Statute or UN Security Council resolutions grounded in Chapter VII of the Charter. The ICC does not borrow its jurisdiction from Nuremberg; it borrows only the *concept* of individual liability, which has since been crystallised into customary international law and prospective treaty obligations.

  Rejecting this step costs you the radical conclusion of abolition. You cannot argue that the entire enterprise is void *ab initio* simply because its progenitor was legally precarious. You are forced to accept a messier reality: that law can emerge from politically compromised moments and legitimise itself over time through state consent and consistent practice. It requires you to distinguish between transitional justice, which may stretch legality to address unprecedented atrocities, and ordinary international criminal law, which must adhere strictly to the principle of legality.

  However, this is the cheapest premise to lose because it preserves your commitment to principle (1). By severing the link between Nuremberg and the present, you protect modern international criminal law from the charge of retroactivity. You maintain that while Nuremberg may have been 'force in judicial dress', the ICC is not, provided it prosecutes only conduct criminalised by treaty or custom at the time of commission. You lose the satisfaction of a totalising critique but gain a defensible position that allows for reform rather than destruction, keeping the shield of *nullum crimen sine lege* intact for the future while acknowledging the historical anomaly of the past.
