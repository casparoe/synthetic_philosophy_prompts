      *(Self-Correction during drafting)*: I need to be careful about the "forecasting side" comment. The user knows proper scoring rules operationally. I should acknowledge that in forecasting, we *stipulate* the score to incentivize truth. In epistemology, we are trying to *derive* the norm from the concept of truth. That distinction is crucial for the "circularity" objection.

      *(Refining the Berker point)*: Make sure to emphasize that Berker's objection isn't just "I don't like additivity." It's that additivity entails a specific axiological structure (aggregative consequentialism) that is controversial in moral philosophy and arguably less plausible in epistemology.

