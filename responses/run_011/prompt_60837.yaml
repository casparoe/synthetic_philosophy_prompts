          *   *Interpretation:* He's distinguishing between *judicial astrology* (predicting specific events like "you will get rich") and *natural/natal astrology* (understanding dispositions and cosmic harmony).
          *   *Content:* It's not face-saving. He genuinely believed in a causal link, but he thought the mechanism was geometric/optical harmony, not arbitrary symbolism. He wanted to turn astrology into a branch of natural philosophy (science).
