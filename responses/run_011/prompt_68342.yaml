answer: |-
  **Orientation**

  Her core commitment is that a mental state becomes conscious only when an unconscious higher-order representation targets it and claims it as your own. This makes consciousness relational rather than intrinsic. The two pressure points are empirical indistinguishability from first-order theories and the explanatory redundancy of the targeted state. Warning: Do not introduce her as a "meta-cognitive" theorist broadly; her claim is specifically about phenomenal consciousness, not just thinking about thinking.

  **Empty Higher-Order Thoughts**

  **Question 1**
  Consider a subject who confabulates a pain she does not physically have. Her higher-order representation says "I am in pain," but the initial sensory signal is missing. On your view, is she thereby in a conscious state that resembles pain, simply because the representation exists?

  **Exposure**
  This tests whether the higher-order representation alone suffices for phenomenal character.
  **Likely Reply**
  She will likely say yes, the subject feels pain because consciousness is constituted by the representation, not the damage. This is a standard actualist commitment, so concede the point.
  **Follow-up**
  If the feeling is real, does it matter medically that no tissue is actually damaged?

  **Question 2**
  Now take the blindsight subject who guesses correctly about a stimulus but insists she saw nothing. Here the initial sensory signal exists, but she lacks the higher-order representation. Does this confirm that without the representation, there is no conscious vision?

  **Exposure**
  This seeks to use empirical data to validate the necessity of the higher-order state.
  **Likely Reply**
  She will argue blindsight proves the initial signal is insufficient for consciousness without the higher-order tag, aligning with her prefrontal cortex evidence.
  **Follow-up**
  If the subject guesses perfectly, what functional work is the missing consciousness actually doing for her?

  **Question 3**
  In the confabulation case where the initial sensory signal is missing, what is the felt character of that pain supposed to be made of? If the target is absent, is the quality of the experience purely a fabrication of the representation?

  **Exposure**
  This pressures the ontology of the experience when the object of representation is nonexistent.
  **Likely Reply**
  She will claim the quality is determined by what the representation attributes to the subject, regardless of external truth.
  **Follow-up**
  So the brain can generate the full quality of an experience without any corresponding input from the world or body?

  **The Idle First-Order State**

  **Question 4**
  If the higher-order representation is doing all the phenomenal work to make a state conscious, what explanatory work is left for its target? Why do we need the initial sensory signal at all if the representation dictates the experience?

  **Exposure**
  This challenges the necessity of the first-order state in the constitution of consciousness.
  **Likely Reply**
  She will reply that the target provides the content, ensuring the representation is about something specific rather than generic.
  **Follow-up**
  Can you name a feature of that content the subject could detect if the target vanished but the representation remained?

  **Question 5**
  Suppose we could keep the higher-order representation active while removing the initial sensory signal entirely. Would the subject notice the loss of the target, or would the conscious experience remain perfectly intact?

  **Exposure**
  This asks for a detectable difference that justifies the existence of the targeted state.
  **Likely Reply**
  She may admit the experience remains intact phenomenally but argue the state becomes inaccurate, though this risks making the target idle.
  **Follow-up**
  If the experience is identical, is the target not merely a causal trigger rather than a constituent of the consciousness?

  **Ownership**

  **Question 6**
  Imagine a shared cortical implant causes your higher-order representation to be driven by another person's nociceptive activity, representing it as your own. On your theory, do you have a conscious pain, even though your body is untouched?

  **Exposure**
  This tests the self-attribution clause using a case of misplaced ownership.
  **Likely Reply**
  She must say yes, you feel the pain, because the representation successfully claims ownership regardless of the biological source.
  **Follow-up**
  Does this imply that personal identity in experience is nothing more than a tag the brain attaches to signals?

  **Question 7**
  Conversely, suppose your higher-order representation tracks your own visual state accurately, but a disorder means it carries no ownership tag at all. Is that visual state conscious, or does the lack of self-attribution extinguish the light?

  **Exposure**
  This isolates the ownership clause to see if it is necessary for consciousness.
  **Likely Reply**
  She will argue the state is not conscious, as the self-attribution is a necessary condition for phenomenal awareness on her view.
  **Follow-up**
  Is there any empirical evidence of visual processing without ownership that you classify as non-conscious?

  **Question 8**
  Does this clause regarding self-attribution do independent explanatory work, or is it merely plugging a hole? Has a subject who must represent a state as her own before she can be conscious of it simply been handed the first-person character the theory was supposed to explain?

  **Exposure**
  This accuses the theory of circularity regarding the first-person perspective.
  **Likely Reply**
  She will deny circularity, arguing ownership is a structural requirement for subjectivity, not a presupposition of it.
  **Follow-up**
  But if the subject needs the tag to have a perspective, where does the understanding of the tag come from?

  **Animals, Infants, and the Conceptual Bill**

  **Question 9**
  Does a dog need concepts in order to have experiences? If your higher-order representation requires conceptual machinery, does that exclude animals and infants from the circle of conscious beings?

  **Exposure**
  This probes the conceptual requirements of the higher-order state.
  **Likely Reply**
  She will likely argue the representation can be non-conceptual, allowing animals to have conscious states without human-like concepts.
  **Follow-up**
  If it is non-conceptual, what distinguishes it from just another perceptual state directed at the world?

  **Question 10**
  We often discriminate colours far more finely than we can describe them. If the higher-order representation must match this discrimination, does it not require a richness that rivals the initial sensory signal itself?

  **Exposure**
  This highlights the burden of complexity placed on the higher-order representation.
  **Likely Reply**
  She will agree the representation must be rich, arguing that unconscious states can carry fine-grained content without linguistic labels.
  **Follow-up**
  At what point does a rich unconscious representation become functionally identical to a conscious first-order state?

  **Question 11**
  If you answer that the higher-order representation can be rich, non-conceptual and non-linguistic, what then makes it higher-order rather than just another perceptual state directed at the world? What defines its direction inward?

  **Exposure**
  This challenges the distinction between higher-order and first-order states if concepts are removed.
  **Likely Reply**
  She will say the functional role defines it, as it targets another mental state rather than an external object.
  **Follow-up**
  But if the subject cannot distinguish the two, is that functional role anything more than a theoretical label?

  **The Missing Witness**

  **Question 12**
  Since you are never aware of your higher-order states except by having yet further states about them, and since everything anyone could ever learn about her consciousness reaches us through her reports, is there any single case in which your theory and a first-order rival would come apart?

  **Exposure**
  This questions the empirical distinguishability of her theory from competing accounts.
  **Likely Reply**
  She will point to prefrontal cortex activity as the marker, claiming this neural signature distinguishes her view from first-order accounts.
  **Follow-up**
  If the subject cannot report the higher-order state, is the neural signature not just a correlate rather than proof of the mechanism?

  **Question 13**
  If the higher-order state is unconscious, how do we know it is there? Are we not positing a witness that never testifies, existing only to explain the very phenomenon it hides?

  **Exposure**
  This attacks the epistemic status of the unconscious higher-order state.
  **Likely Reply**
  She will argue we infer it as the best explanation for the difference between conscious and unconscious mental states.
  **Follow-up**
  Is it not simpler to infer that consciousness is a property of the first-order state itself when certain conditions are met?

  **Evidence and the Closer**

  **Question 14**
  What finding would you accept as telling against your view, and in particular, would a well-documented subject with a targetless higher-order representation who is nonetheless in no conscious state refute her?

  **Exposure**
  This demands a falsification condition specifically regarding empty higher-order representations.
  **Likely Reply**
  She should admit that if a targetless representation yields no consciousness, her claim that the representation suffices is false.
  **Follow-up**
  Have we yet seen neuroimaging evidence of such a targetless representation occurring without reported experience?

  **Question 15**
  If the higher-order state is invisible to the subject and leaves no unique trace in reports, what empirical work is it doing other than saving the theory? Are we not positing a ghost in the machine simply to avoid calling consciousness a basic property of the brain?

  **Exposure**
  This final question blocks the deflections by focusing on simplicity and empirical necessity.
  **Likely Reply**
  She cannot claim the state is unconscious nor confuse it with the target, as the question addresses the theoretical necessity directly.
  **Follow-up**
  N/A - This is the closing question.
