answer: |-
  The self-sampling assumption holds that you should treat your own existence as if you were a random sample from the set of all observers in your reference class within a given world. It operates as a constraint on conditional probabilities, fixing the likelihood of your evidence given a hypothesis about the world. The self-indication assumption holds that you should weight hypotheses by the number of observers they contain, effectively treating your existence as evidence that you are in a world with more observers. It operates as a constraint on priors before conditionalization. The slogan most naturally expresses the self-sampling assumption, as it invokes a drawing procedure from a fixed class rather than weighting the class itself.

  **1. The Objective Lottery Reading**
  *   **Statement:** There exists a physical or metaphysical process that literally selected you uniformly from the set of observers in your reference class, akin to a lottery draw.
  *   **Verdict:** False or incoherent. There is no known mechanism that selects which observer you are; identity is not assigned by chance after observers are created.
  *   **Doomsday Conclusion:** The conclusion goes through, but the premise is false. The argument becomes unsound.
  *   **Honesty of Use:** A proponent cannot honestly use the slogan here. To claim neutrality while asserting a physical sampling mechanism is to assert a controversial metaphysical thesis without argument.
  *   **Axes:** Force of "random" (objective chance); Force of "as if" (literal); Reference class (fixed independently).
  *   **Objections:** Survives Presumptuous Philosopher only by fiat, but fails on coherence.

  **2. The Epistemic Indifference Reading (Standard SSA)**
  *   **Statement:** You ought to assign equal prior credence to being any specific observer in your reference class, conditional on the world being actual, based on a principle of indifference over self-locating possibilities.
  *   **Verdict:** Substantive but defensible. This is the standard formalization of the self-sampling assumption, though it competes with rival prior constraints.
  *   **Doomsday Conclusion:** The conclusion goes through. Being early in the sequence is unlikely under the vast-future hypothesis given uniform indifference.
  *   **Honesty of Use:** A proponent can use the slogan, but only by admitting it is not neutral. It presupposes the self-sampling assumption over the self-indication assumption, which is the very point in dispute.
  *   **Axes:** Constraint on priors; Force of "random" (uniform indifference); Reference class (all humans).
  *   **Objections:** Survives Presumptuous Philosopher objections (does not favor huge universes *a priori*), but succumbs to the Doomsday conclusion.

  **3. The Cardinality-Weighted Reading (SIA Variant)**
  *   **Statement:** You should reason as if you were a random observer drawn from the set of all possible observers across all possible worlds, making worlds with more observers more likely to contain you.
  *   **Verdict:** Substantive but defensible. This expresses the self-indication assumption, treating the reference class as encompassing all candidate observers.
  *   **Doomsday Conclusion:** The conclusion fails. The higher prior probability of being in a large civilization cancels out the low probability of having a low birth rank within it.
  *   **Honesty of Use:** A proponent cannot use the slogan to support the Doomsday argument. Using this reading to endorse the slogan while arguing for Doomsday is contradictory.
  *   **Axes:** Constraint on priors; Reference class (all possible observers); Force of "random" (weighted by cardinality).
  *   **Objections:** Fails Presumptuous Philosopher objections (makes huge universes too likely); survives Doomsday.

  **4. The Deflationary Heuristic Reading**
  *   **Statement:** The slogan is merely a reminder not to assume you are special or atypical without specific evidence to that effect.
  *   **Verdict:** Platitude. No one denies you should not assume特殊性 without evidence, but this does not dictate a specific probability distribution.
  *   **Doomsday Conclusion:** The conclusion fails. This principle does not entail that birth rank is evidence for doom; it only forbids assuming you are literally the first human without cause.
  *   **Honesty of Use:** A proponent cannot use this to dismiss your objection. It is too weak to bear the weight of the Doomsday derivation and offers no reason to reject your critique of indexical evidence.
  *   **Axes:** Force of "as if" (useful fiction); Role of "you" (collapses to total evidence); Force of "random" (non-special).
  *   **Objections:** Survives all technical objections by being too vague to trigger them.

  **5. The Ad Hoc Class Reading**
  *   **Statement:** The reference class is defined specifically to include only observers relevant to the hypothesis, such that the sampling assumption yields the desired result.
  *   **Verdict:** Question-begging. The slogan is unstateable until the reference class is chosen, and the choice of class often determines the outcome.
  *   **Doomsday Conclusion:** Depends entirely on class selection. If the class is "humans," doom follows; if "observers," it may not.
  *   **Honesty of Use:** A proponent cannot claim neutrality. Selecting the class to ensure the Doomsday result reveals the slogan is a conclusion in disguise, not a neutral premise.
  *   **Axes:** Reference class (chosen ad hoc); Constraint type (both priors and conditionalization).
  *   **Objections:** Vulnerable to the charge that the reference class is gerrymandered to avoid Presumptuous Philosopher or force Doomsday.

  **Coherence and Variant Flagging**
  Reading 1 and Reading 2 are often conflated but are distinct. Reading 1 posits an ontic chance process, while Reading 2 posits an epistemic constraint. Conflating them makes Reading 2 appear more objective than it is. Reading 5 reveals that the slogan is unstateable without prior resolution of the reference class problem. If the class size depends on the hypothesis (as in SIA), the slogan cannot be applied neutrally. Thus, the claim that the slogan is neutral between your view and your friend's is false; the slogan requires a specific choice of reference class and indifference principle that already favors one side.

  **Closing Analysis**
  Your friend most likely means Reading 2, the Epistemic Indifference Reading. This is the only version that yields the Doomsday conclusion while maintaining a veneer of Bayesian respectability. He is not entitled to it without argument, as it is a substantive prior constraint that competes with the self-indication assumption. He presents it as a rule of Bayesian reasoning itself, but it is actually a specific choice of prior over centered worlds.

  The single most pointed question you could ask him is: "What fixes the reference class independently of the hypothesis we are testing?" He will probably answer that the class is "all humans" or "all observers like me." This answer reveals that he has already assumed a specific ontology of observers that excludes the self-indication weighting. If he admits the class is chosen to make the math work, he concedes the argument is circular. If he insists the class is fixed by nature, he must explain the metaphysical mechanism that delineates "humans" from "observers" without referencing the very future population size that is in dispute. His inability to answer this without presupposing the Doomsday conclusion will show that the slogan is not a neutral tool, but a loaded premise.
