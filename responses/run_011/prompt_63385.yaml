answer: |-
  You have identified a structural flaw in historical reasoning that is pervasive in your field (and Biblical studies, hagiography, and medieval chronicles) but lacks a canonical Latin tag equivalent to *post hoc* or *ad hominem*. You are correct that the standard labels (Criterion of Coherence, Halo Effect, Bootstrapping) are near-misses because they fail to capture the specific category error regarding the *type* of information being verified.

  Here is the analysis, the existing conceptual neighbourhood, and a proposed term with the definitional sharpness you require.

  ### 1. The Existing Conceptual Neighbourhood

  There is no single, universally accepted term for this specific move in historiography. However, it is recognized as a specific instantiation of two broader problems:

  *   **The Fallacy of Composition (Epistemic Variant):** Logically, this is inferring that the whole (the narrative) possesses a property (truthfulness) because a part (the toponym) possesses it. In historiography, this is often tacitly defended by an assumption of **Narrative Homogeneity**—the idea that a text is a uniform block of transmission rather than a composite of inert data and elaborated plot.
  *   **Global vs. Local Reductionism (Epistemology of Testimony):** In the philosophy of testimony (e.g., Fricker, Coady), this move conflates *local reductionism* (verifying specific claims to trust a witness) with *global reductionism* (trusting the witness's general character). The move you describe attempts to establish *global* reliability (the story is historical) via *local* verification (the place name is real), ignoring that witnesses (and traditions) are often reliable on background context but unreliable on central agency.
  *   **The "Kernel of Truth" Fallacy:** In Biblical Minimalism (e.g., Thompson, Davies), this is often critiqued under this label, but that term usually refers to the *conclusion* (that a kernel exists) rather than the *mechanism* of the inference.

  ### 2. Proposed Term: The Fallacy of Undifferentiated Fidelity

  Since the field lacks a precise tag, I propose you adopt **The Fallacy of Undifferentiated Fidelity**.

  **Definition:**
  The Fallacy of Undifferentiated Fidelity occurs when the verification of a *low-malleability* element within a tradition (e.g., toponyms, onomastics, material culture) is used to warrant the historicity of a *high-malleability* element (e.g., specific events, motivations, narrative arcs) within the same tradition, without independent justification for why fidelity should apply uniformly across both categories.

  **The Carving (Why it fails in your cases):**
  The fallacy rests on a false scalar model of trustworthiness. It treats "reliability" as a property of the *source* (the tradition/text) rather than a property of the *information class*.
  *   **Class A (Inert Data):** Place names, tribal names, basic geography.
      *   *Transmission Cost:* Low.
      *   *Incentive to Fabricate:* None (adds no dramatic value).
      *   *Resistance to Change:* High (audiences know the local geography).
  *   **Class B (Narrative Action):** Sieges, battles, miracles, speeches.
      *   *Transmission Cost:* High (requires plot cohesion).
      *   *Incentive to Fabricate:* High (provides etiology, legitimacy, entertainment).
      *   *Resistance to Change:* Low (audiences desire elaboration).

  Verifying Class A proves the tradition has access to old *data*, not that it preserves old *events*. It proves **Provenance**, not **Accuracy**.

  ### 3. Boundary Conditions: The Legitimate Inference

  You asked for the boundary conditions where a weaker, legitimate inference *is* available. The move is not always fallacious; it becomes fallacious only when the inference exceeds the class of the verified data.

  **The Legitimate Inference: The Constraint Principle**
  Peripheral accuracy does not confirm the narrative core, but it **constrains the space of possible invention**.

  *   **Valid:** "The presence of authentically Egyptian names in the Exodus tradition constrains the *provenance* of the tradition to a period of Egyptian contact; it renders a purely Iron Age Judean invention *less probable*."
  *   **Invalid:** "The presence of authentically Egyptian names makes the *mass departure* probable."
  *   **Valid:** "The identification of Hisarlik as Troy confirms the *geographical focus* of the Epic Cycle."
  *   **Invalid:** "The identification of Hisarlik as Troy confirms the *ten-year duration* or the *cause* of the war."

  **The Test for Legitimacy:**
  To avoid the Fallacy of Undifferentiated Fidelity, the inference must pass the **Causal Independence Test**:
  *   *Question:* Could the verified detail (Class A) exist or be preserved *without* the claimed event (Class B) having occurred as described?
  *   *If Yes:* The inference is fallacious. (e.g., Can the name "Troy" exist without a ten-year siege? Yes. Can the name "Israel" exist on a stele without an Exodus? Yes.)
  *   *If No:* The inference is potentially valid. (e.g., If a destruction horizon matches the *specific* layer described in a text that also names the conqueror, and that conqueror is otherwise unknown, the link is tighter. But even then, it confirms the destruction, not necessarily the *narrative reason* for it.)

  ### 4. How to Deploy This in Your Thesis

  In your historiography chapter, you can frame this as a critique of **Testimonial Monism**.

  1.  **Diagnose:** Identify where your cohort (or the literature) treats the tradition as a monolithic witness.
  2.  **Differentiate:** Distinguish between **Background Constants** (toponyms, names) and **Narrative Variables** (events, agency).
  3.  **Apply the Constraint Principle:** Argue that archaeological corroboration of Constants validates the *cultural memory* of the period, but not the *historical reconstruction* of the event.
  4.  **Term:** Use **The Fallacy of Undifferentiated Fidelity** to label the error. It is precise enough to be falsifiable (one could theoretically demonstrate differentiated fidelity) and descriptive enough to capture the mechanism.

  **Example Formulation:**
  > "While the Hittite reference to *Wilusa* corroborates the geographical realism of the Epic Cycle, inferring from this the historicity of the Trojan War constitutes the **Fallacy of Undifferentiated Fidelity**. It mistakes the preservation of inert toponymic data (Class A) for evidence of narrative fidelity regarding military events (Class B). The corroboration establishes the tradition's *provenance* in the Late Bronze Age, but not the *accuracy* of its plot."

  This gives you the analytical tool to dismantle the "kernel" argument without denying the value of the archaeological data itself. It shifts the burden of proof: the presence of the name proves the *story is old*, not that the *story is true*.
