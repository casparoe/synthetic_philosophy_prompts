prompt: |-
  I sit on the bioethics committee of an academic medical center, and next month we vote on a single referral that has divided us. A surgical team proposes a human head transplant: a thirty-four-year-old man whose degenerative disease will destroy his body within the year but has spared his nervous system, and a brain-dead donor with an otherwise healthy body. We are not being asked whether the operation is scientifically sound — the surgeons have assumed that risk and the family has been counseled. We are being asked a narrower question that has proved much harder: if it succeeds, who is our patient?

  Three features make the question operative rather than academic.

  First, the surgeons intend to keep the patient's discarded original body perfused and mechanically supported for thirty days, as a fallback should the transplant fail. For that month there will be two bodies in two units of this hospital, one with his brain and one without. His wife has already asked which of them the family should keep vigil at, and whether, if things go badly, that belongs at one, the other, or both.

  Second, the man signed an advance directive eighteen months ago, while in his own body. It names his wife as surrogate, refuses prolonged mechanical support, and directs that his remains be interred in his family's plot. No one on the committee can say what each clause now picks out. The donor's mother, whose consent was given on the express condition that a part of her son goes on living, holds that her family retains an interest in the body that walks out of the hospital, and asks for visitation rights and for a voice if the patient becomes unresponsive.

  Third, and most unusually: the patient has read Dennett's thought experiment about a brain kept alive and supported in a laboratory while its body, controlled remotely, goes on living an ordinary life, and he raised it himself at his pre-operative interview. He asked us to enter a standing instruction that if, after the operation, he reports seeming to be somewhere other than where his brain is, or reports not recognizing the vantage point from which he is speaking, we are to treat that report as bearing on the question of who survived rather than as a symptom to be medicated away. Two members think this request is entirely reasonable and that we owe him an answer in advance; two think it dereliction to weight first-person testimony on a matter settled by biological fact.

  Please draft the written opinion I will circulate before the vote. It should:

  1. State a clear recommendation — clear the referral, clear it subject to conditions, or decline — with a timetable: what must be settled before the operation, what is settled at the moment the patient wakes, and what happens on day thirty.
  2. Say which body is our patient for each purpose the institution must actually act on — surrogate authority, the scope of the advance directive, visitation, and eventual disposition of remains — and explain why. If the answer differs across those purposes, say so and justify the split rather than papering over it.
  3. Give the committee a test for weighing the patient's post-operative testimony, rather than a ruling in advance on whether to believe him.
  4. Take the donor family's condition of consent as seriously as the patient's directive, and state what we should do if the two cannot both be honored.
  5. Set out the strongest consideration on the side your opinion comes out against, in terms its proponents would accept, and explain why it nonetheless does not carry the decision.

  I would rather the memo commit to a defensible position and own its costs than split the difference. Assume readers who are intelligent, have not studied personal identity, and will have to explain this decision to two grieving families.
reasoning: |-
  Here's a thinking process that leads to the drafted memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a bioethics committee at an academic medical center.
      *   **Task:** Draft a written opinion/memo to circulate before a vote on a human head transplant referral.
      *   **Scenario:** 34-year-old male (recipient) with degenerative body disease but intact nervous system. Brain-dead donor with healthy body. Surgeons assume scientific risk.
      *   **Core Question:** If successful, *who* is the patient?
      *   **Complicating Factors:**
          1.  Original body kept perfused for 30 days (two bodies exist).
          2.  Advance Directive (AD) signed by recipient (refuses prolonged support, specifies burial). Donor mother wants visitation/voice based on consent conditions.
          3.  Recipient's Dennett-inspired request: If he feels displaced from his brain location, treat it as an identity question, not a symptom.
      *   **Requirements:**
          1.  Clear recommendation (Clear/Clear w/ Conditions/Decline) + Timetable (Pre-op, Wake-up, Day 30).
          2.  Define "the patient" for specific institutional purposes (Surrogate, AD, Visitation, Remains). Justify splits if any.
          3.  Provide a *test* for weighing post-op testimony, not a pre-ruling.
          4.  Address Donor Family's consent conditions vs. Recipient's AD. Resolve conflict.
          5.  Steelman the opposing view and explain why it loses.
      *   **Tone:** Defensible, owns costs, intelligent but accessible (no jargon-heavy philosophy), empathetic to grieving families.

  2.  **Determine the Ethical Stance:**
      *   *Option A: Psychological Continuity (Brain = Person).* This is the standard legal and medical view. The recipient is the patient. The donor body is tissue/organ.
      *   *Option B: Biological/Somatic Continuity (Body = Person).* The donor body is the patient. The recipient brain is an organ.
      *   *Option C: Dual Existence/Functional Split.* Acknowledge the ambiguity and assign rights based on function.
      *   *Decision:* The most legally and medically defensible position, while respecting the unique philosophical stakes, is **Psychological Continuity (Brain = Person)**, *but* with specific accommodations for the donor family to honor the spirit of their consent without granting legal personhood to the body. This allows for a "Clear subject to conditions" recommendation. It avoids the absurdity of treating the headless body as a person while acknowledging the donor family's profound loss and contribution.
      *   *Why?* Law and medicine generally track consciousness and agency. The AD follows the mind. The donor body is a vessel. However, the "two bodies for 30 days" scenario creates a unique limbo that needs specific protocols.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** Acknowledge the gravity. State the recommendation clearly immediately.
      *   **Recommendation & Timetable:**
          *   *Rec:* Clear subject to conditions.
          *   *Pre-op:* Contracts signed regarding the 30-day window and AD interpretation.
          *   *Wake-up:* Legal identity established.
          *   *Day 30:* Disposition of the original body.
      *   **Defining "The Patient" (The Core Identity Question):**
          *   Need to split purposes.
          *   *Surrogate/AD:* Follows the brain (Recipient). Why? Agency and memory reside there.
          *   *Visitation:* Split. Wife gets primary (brain), Donor mom gets limited/ritual (body). Why? Respect consent without creating two legal persons.
          *   *Remains:* Split. Brain-body goes home (Recipient's plot). Headless body goes to donor family (or cremation per their wish). Why? The "person" is buried in the plot; the "tissue" returns to its source.
      *   **The Dennett Request (First-Person Testimony):**
          *   Cannot rule in advance on metaphysics.
          *   Need a *test*. Focus on *agency* and *consistency*. If the report impairs safety or decision-making capacity, it's medical. If it's a coherent philosophical claim without cognitive deficit, it's logged but doesn't override legal identity.
          *   *Test:* "The Capacity-Coherence Standard." Does the claim prevent safe care? If no, listen. If yes, treat.
      *   **Donor Family vs. Advance Directive:**
          *   Conflict: Donor mom wants voice/visitation. Recipient AD says "no prolonged support" (applies to original body?) and "burial in family plot" (applies to which body?).
          *   Resolution: AD follows the brain. Donor conditions are honored regarding the *remains of the donor body*, not the legal status of the new composite.
          *   *If irreconcilable:* Legal personhood (Brain) trumps property/consent interests (Donor Body), but we mitigate harm through access rituals.
      *   **The Opposing View (Steelman):**
          *   View: The Body is the Person (Somatic view). Or, the uncertainty is too great to proceed.
          *   Argument: We are creating a chimera. The donor family's hope was "a part of him lives." If the mind is totally different, is it their son?
          *   Rebuttal: Medicine treats the brain as the seat of the self. To do otherwise creates legal chaos (two wives? two SSNs?). We must choose a working definition to function.
      *   **Conclusion:** Reiterate the human cost. This is about guiding two families through the unknown.

  4.  **Refining the Tone:**
      *   Avoid dense philosophy jargon (Locke, Parfit, etc., unless explained simply).
      *   Focus on *institutional action*. What do nurses do? Who signs forms?
      *   Ensure the "Day 30" protocol is clear regarding the headless body.
      *   Make sure the Dennett test isn't a dismissal but a framework.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is splitting the remains too messy?
      *   *Fix:* It's necessary. The recipient chose his plot. The donor mother expects her son's body. Separating them honors both.
      *   *Critique:* Is the Dennett test too vague?
      *   *Fix:* Make it about *capacity*. If he says "I am in the cloud" but can sign consent, we note it. If he says "I am in the cloud" and tries to walk out a window, we medicate.
      *   *Critique:* Did I address the 30-day perfusion?
      *   *Fix:* Explicitly state that the headless body is a "biological specimen" under the recipient's AD (which refuses support), but kept for the surgical window. At Day 30, it becomes remains.

  6.  **Final Polish:** Check against the 5 specific requirements in the prompt.
      1.  Rec + Timetable? Yes.
      2.  Which body for which purpose? Yes.
      3.  Test for testimony? Yes.
      4.  Donor family vs. AD? Yes.
      5.  Strongest opposing view? Yes.

  7.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Bioethics Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Referral #492 (Cephalic Transfer Protocol)

  **I. RECOMMENDATION AND TIMETABLE**

  I recommend we **clear the referral subject to binding conditions.** We cannot treat this as a standard surgical procedure because it creates a temporary ontological ambiguity that the hospital is not currently equipped to manage. If we proceed, we must define the rules of engagement before the first incision.

  **Timetable for Resolution:**
  1.  **Pre-Operative (Before Incision):** Legal counsel must draft a specific "Composite Identity Agreement" signed by the recipient, his wife, and the donor family. This document codifies the definitions below. The recipient's Advance Directive must be explicitly re-confirmed as applying to the *brain/consciousness*, not the *original body*.
  2.  **Moment of Awakening (Post-Op):** Legal identity is fixed. The composite organism (Donor Body + Recipient Brain) is the sole legal patient. The original body is reclassified as "biological tissue on temporary life support."
  3.  **Day Thirty:** The life support for the original body is terminated. The disposition of that remains follows the protocol in Section III.

  **II. DEFINING "THE PATIENT" FOR INSTITUTIONAL PURPOSES**

  We must reject the idea that "the patient" is a single metaphysical category. For the hospital to function, we must assign status based on specific administrative needs. We will adopt a **Psychological Continuity Standard** (the person goes where the mind goes) for legal authority, but a **Somatic Respect Standard** (the body retains dignity) for visitation and remains.

  *   **Surrogate Authority & Medical Decision Making:**
      *   *Status:* The Recipient (Brain).
      *   *Authority:* The Recipient's wife holds exclusive power.
      *   *Justification:* Medical consent requires the capacity to understand risk and benefit, which resides in the brain. The donor body is the vessel; the recipient is the agent. To grant the donor mother decision-making power would be to treat the body as a person, which creates unmanageable legal conflicts (e.g., two surrogates with veto power).

  *   **The Advance Directive (AD):**
      *   *Status:* Applies to the Recipient (Brain).
      *   *Application:* The clause refusing "prolonged mechanical support" applies to the *new* body if the transplant fails. The clause regarding "interment in family plot" applies to the *new* body upon eventual death.
      *   *Justification:* An AD is an instruction from a mind about its own future. The donor body never possessed an AD; it is a gift of tissue.

  *   **Visitation (The 30-Day Window):**
      *   *Status:* Split Access.
      *   *Protocol:* The Recipient's wife has primary access to the waking patient (New Body). She also has primary access to the Original Body. The Donor Mother is granted scheduled, supervised visitation with the Original Body only. She is *not* granted visitation with the waking patient unless invited by the Recipient's wife.
      *   *Justification:* This honors the donor family's grief and their specific condition of consent (that a part of their son lives) without confusing the waking patient's recovery environment. The donor mother is visiting the *remains* of her son, not the new person.

  *   **Disposition of Remains:**
      *   *Status:* Split Disposition.
      *   *Protocol:* Upon the eventual death of the patient, the composite body is interred in the Recipient's family plot. Upon Day 30, the Original Body is released to the Recipient's wife for disposal (likely cremation, per the AD's spirit regarding refused support). The Donor Mother is offered the ashes of the Original Body if she wishes them, but she has no claim on the final resting place of the waking patient.
      *   *Justification:* This is the hardest cost. The donor mother wishes her son to "go on living." We must be honest: her son is dead. His tissue is sustaining a life, but it is not *his* life. We honor her contribution by returning the physical remains of her son to her care, but we cannot grant her ownership over the new life created.

  **III. WEIGHING POST-OPERATIVE TESTIMONY (THE DENNETT CLAUSE)**

  The Recipient has asked that reports of "displacement" (feeling located elsewhere than the brain) be treated as data on identity, not symptoms. We cannot rule in advance on the metaphysics of consciousness, but we can rule on clinical safety.

  **The Capacity-Coherence Test:**
  We will not medicate the patient simply for reporting a change in subjective location. However, we will evaluate such reports using the following test:
  1.  **Coherence:** Can the patient explain the sensation consistently over time without contradiction?
  2.  **Agency:** Does the belief prevent the patient from understanding their medical situation or signing consent?
  3.  **Safety:** Does the belief lead to behavior that endangers the graft or the staff?

  *   *If the patient passes all three:* We log the testimony as a philosophical observation. We do not treat it as delusion.
  *   *If the patient fails any one:* We treat it as a neurological symptom requiring management.

  *Justification:* This respects the patient's autonomy and the experimental nature of the procedure without abdicating our duty to prevent harm. We owe him a hearing, not an agreement.

  **IV. CONFLICT RESOLUTION: DONOR CONSENT VS. RECIPIENT DIRECTIVE**

  The Donor Mother's consent was conditional: "a part of her son goes on living." The Recipient's AD dictates the disposal of his remains. These are in tension.

  **Resolution:** We interpret the donor condition as a request for *respect*, not *legal personhood*.
  If the Donor Mother demands visitation with the *waking* patient or veto power over his discharge, we must decline. To grant this would be to treat the donor body as a co-owner of the new life, which violates the Recipient's right to bodily integrity and privacy.

  **If the two cannot be honored:** The Recipient's legal rights (via his wife) supersede the Donor Family's property/consent interests. The donor tissue, once grafted, becomes part of the recipient. However, to mitigate this moral cost, the hospital will provide dedicated grief counseling and a liaison to the Donor Mother for one year post-op, acknowledging that while her son is not alive, her loss is ongoing.

  **V. THE OPPOSING VIEW (AND WHY IT MUST LOSE)**

  The strongest argument against my recommendation is the **Somatic View**, held by two committee members. They argue that human identity is embodied. By placing the brain in a new body, we have created a new entity that is neither the donor nor the recipient, but a third thing. Therefore, the Recipient's AD is void (it was signed by a different bodily entity), and the Donor Family has a claim to the waking patient because the majority of the cells belong to their son.

  **Why this view is compelling:** It acknowledges the profound biological reality that our hormones, immune systems, and gut bacteria influence who we are. It validates the Donor Mother's intuition that her son is not merely "spare parts."

  **Why it nonetheless fails:**
  If we adopt the Somatic View, the hospital cannot function. We would have no valid surrogate (the wife's authority is voided; the mother's is partial). We would have no valid AD. We would be forced to treat the waking patient as a legal orphan until a court rules on his identity. This paralysis harms the patient. Medicine requires a working definition of the person to administer care. The law and medical practice universally track *psychological continuity* (memory, agency, personality) as the seat of the self. To deviate from this now would be to abandon the patient to bureaucratic limbo. We must choose the definition that allows for care, even if it imperfectly captures the metaphysical mystery.

  **VI. CONCLUSION**

  This decision will not satisfy everyone. The Donor Mother will feel we have reduced her son to a chassis. The Recipient's wife may feel haunted by the presence of the original body down the hall.

  But we are not here to solve the hard problem of consciousness. We are here to ensure that when the patient wakes, there is a chart with his name on it, a wife allowed to hold his hand, and a plan for the body left behind. We clear the referral with these conditions to ensure that in the midst of this unprecedented ambiguity, the hospital remains a place of clear obligations and human dignity.

  I move we vote on these conditions.
