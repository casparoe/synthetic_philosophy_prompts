  **Question 1**
  In a system where a statement and its denial can both be true, how does **negation (the operation of denying a statement)** function to exclude anything?
  *   **Expected Answer:** She will likely say that rejection is still possible by asserting the negation, even if the negation does not guarantee falsity.
  *   **Follow-up:** Use her admission that negation behaves differently here to pivot to Q2: if negation doesn't exclude truth, ask how she distinguishes standard truths from contradictory ones.

  **Question 2**
  If you cannot exclude truth via negation, how do you distinguish a sentence that is merely true from a **truth-value glut (a sentence that is both true and false)**?
  *   **Expected Answer:** She should claim there is a predicate or status within her logic that marks sentences as "true only" versus "true and false."
  *   **Follow-up:** Press on the stability of this distinction: if you have a new category for "true only," ask in Q3 what logical rule you must break to keep that category from collapsing.

  **Question 3**
  To prevent every statement from becoming true, you must block a standard inference rule; is this **disjunctive syllogism (the rule that lets you infer B from 'A or B' and 'not A')**?
  *   **Expected Answer:** She will confirm that this rule fails in her system to prevent "explosion" (where one contradiction makes everything true).
  *   **Follow-up:** Highlight the cost: since scientists rely on this rule for elimination proofs, use Q4 to ask if her solution creates new problems elsewhere.

  **Question 4**
  Consider the sentence saying it is false and not true; does treating this as another glut invite a **revenge paradox (a new contradiction generated by the solution to an old one)**?
  *   **Expected Answer:** She will argue that her system absorbs this sentence as yet another glut without collapsing.
  *   **Follow-up:** Challenge the cost of absorption: if every solution generates a new glut, ask in Q5 whether she needs an infinite supply of new logical categories.

  **Question 5**
  If you need new words to describe each new glut, do you sacrifice **expressive completeness (the ability to state every meaningful distinction within the system)**?
  *   **Expected Answer:** She will defend the view that her single logic can express all necessary distinctions without hierarchy.
  *   **Follow-up:** Turn the table on her critique of rivals: if she claims completeness, ask in Q6 why she insists classical systems fail on the same grounds.

  **Question 6**
  You argue **classical logic (the standard system where contradictions are impossible)** fails here; does your own account avoid the same failure mode?
  *   **Expected Answer:** She will claim her account is superior because it accepts the contradiction rather than hiding it.
  *   **Follow-up:** Move from logical mechanics to metaphysical scope: if the logic handles language, ask in Q7 why it shouldn't handle physical reality.

  **Question 7**
  You restrict **dialetheism (the view that some contradictions are true)** to language; what principle keeps it out of physical motion?
  *   **Expected Answer:** She will argue that physical change is not semantic self-reference and thus lacks the structure required for true contradictions.
  *   **Follow-up:** Test the boundary: if the logic changes for different paradox types, ask in Q8 whether non-semantic paradoxes force further logical sacrifices.

  **Question 8**
  For paradoxes involving if-then statements rather than denial, must you restrict **contraction (a rule allowing the reuse of assumptions in a proof)**?
  *   **Expected Answer:** She will likely admit that handling Curry-type paradoxes requires limiting how assumptions are used.
  *   **Follow-up:** Connect logical cost to scientific practice: if proof rules change, ask in Q9 whether she personally believes the contradictions or just tolerates them.

  **Question 9**
  Do you hold a **doxastic state (a mental stance of belief or acceptance)** toward the contradictions, or merely toward the theory?
  *   **Expected Answer:** She will distinguish between "accepting" the theory as useful and "believing" the contradiction is intuitively true.
  *   **Follow-up:** Push for an empirical test: if it's about theory versus world, ask in Q10 how she distinguishes a real contradiction from a model limitation.

  **Question 10**
  Is quantum **complementarity (the principle that objects have mutually exclusive properties)** a glitch in our bookkeeping or a glut in the world?
  *   **Expected Answer:** She will likely classify this as a feature of measurement (bookkeeping) rather than a true ontological contradiction.
  *   **Follow-up:** Close the session by asking her to specify what observation would force her to reclassify such a phenomenon as a real glut.
