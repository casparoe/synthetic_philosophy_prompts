      *   **Tone:** Professional, empathetic, rigorous but accessible, honest about uncertainty.

  2.  **Brainstorming & Philosophical Grounding (The "Working"):**
      *   *Core Conflict:* The user's friend presents the "Tu Quoque" paradox.
          *   View 1: Hypocrisy undermines *standing* (Bell, Fritz, Smith, etc.). You can't blame if you're guilty.
          *   View 2: Hypocrisy is irrelevant to *truth* (The code *is* bad).
      *   *Resolution:* The distinction between *propositional content* (the code is buggy) and *speech act force* (the authority to demand change).
      *   *Key Concept:* "Standing to Blame." It's not about whether the blame is *true*, but whether the blamer has the *authority* to issue it without resentment being fitting.
      *   *Nuance:* Is it *past* hypocrisy (I did it before) or *committed* hypocrisy (I will do it soon)? Committed might be worse because it signals a policy, not a lapse.
      *   *Nuance:* Power dynamics. A Tech Lead has institutional authority, which complicates moral standing. If I have the power to enforce, do I need moral standing? Yes, because enforcement without standing breeds resentment and disengagement.
      *   *Nuance:* The "90 seconds" constraint. Philosophy is slow; code review is fast. The procedure must be heuristics, not deep meditation.
      *   *Case C:* Needs to be a hard pill to swallow. Where does standing completely collapse? Maybe when the violation is systemic and the lead is the architect of that system.

  3.  **Drafting the Procedure (Iterative refinement):**
      *   *Step 1: Truth Check.* Is the criticism actually valid? (Filters out gaslighting).
      *   *Step 2: Similarity Check.* Have I done this? (The hypocrisy trigger).
      *   *Step 3: Relevance/Impact Check.* Is this critical safety or style nit? (Severity matters).
      *   *Step 4: Commitment Check.* Am I *currently* committed to fixing my own version? (The "future hypocrisy" angle).
      *   *Step 5: Framing.* How to say it? "We" vs. "You".
      *   *Decision Tree:*
          *   Valid + Not Hypocritical -> Post Normal.
          *   Valid + Hypocritical (Past) + Fixed -> Post Framed (Own it).
          *   Valid + Hypocritical (Future/Current) + Systemic -> Escalate Norm.
          *   Valid + Hypocritical + Low Stakes + No Plan to Fix Self -> Don't Post.

  4.  **Addressing the Specific Cases:**
      *   *(a) 900-line PR (Junior) vs. My Past:* I did it, nobody caught me. I have standing *if* I acknowledge the inconsistency. If I pretend I'm perfect, I lose standing.
      *   *(b) Future Hotfix:* This is "committed hypocrisy." Worse than past lapses. Requires norm escalation or explicit exemption.
      *   *(c) The "Don't Post" Case:* Needs to be where the lead's behavior *caused* the issue. E.g., I demanded speed over quality last sprint, now I'm blaming you for the technical debt I ordered. That's "dirty hands."

  5.  **Epistemic Confidence & Limits:**
      *   *Consensus:* There is a strong consensus that standing is distinct from truth (Bell, Fritz).
      *   *Disagreement:* *Why* standing is lost. (Resentment-based vs. Authority-based). I'll smooth this over for the procedure but flag it.
      *   *Least Sure:* The "Future Hypocrisy" distinction. Is it morally distinct from past? Some say yes (commitment), some say no (action is what matters).
      *   *Limits:* Power dynamics. A lead *can* enforce regardless of standing, but shouldn't.

  6.  **Refining the Tone:**
      *   Avoid jargon like "propositional attitude" without explanation.
      *   Use engineering metaphors (technical debt, refactoring, CI/CD).
      *   Be direct about the "Don't Post" case.

  7.  **Final Review against Constraints:**
      *   Did I brainstorm out loud? Yes.
      *   Is there a procedure? Yes.
      *   Are there branches? Yes.
      *   Are the 3 cases run? Yes.
      *   Is epistemic confidence addressed? Yes.
      *   Is the "Don't Post" case hard? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe tell them to fix their own code first.
      *   *Correction:* No, that's not always possible (legacy code). The procedure needs to handle "I can't fix mine right now."
      *   *Initial thought:* Focus heavily on resentment.
      *   *Correction:* Keep it practical. Resentment is the *risk*, not the tool. Focus on "effectiveness" and "trust."
      *   *Check:* Did I explain *why* future hypocrisy is worse? Yes, because it signals a rule that doesn't apply to the ruler *by design*, not just by lapse.

  9.  **Final Polish:** Ensure the distinction between "Standing" (authority to blame) and "Correctness" (truth of claim) is crystal clear early on. That's the user's main confusion.

  *(Self-Correction on Case C)*: Make sure Case C isn't just "it's a minor nit." It needs to be "You literally caused this." Example: I told you to skip tests to meet a deadline, now I'm rejecting the PR for no tests. That is the strongest loss of standing.

  *(Self-Correction on Epistemics)*: Be careful not to claim the "Standing to Blame" literature is settled law like physics. It's analytic philosophy. There are dissenters (e.g., some consequentialists might say "blame if it works"). I need to acknowledge the non-ideal theory aspect.

