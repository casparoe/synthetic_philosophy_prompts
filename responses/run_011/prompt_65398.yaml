answer: |-
  ### Part 1: The Working (Brainstorming & Diagnosis)

  Okay, let's unpack your confusion before we build the tool. You said your gut tells you two contradictory things are both right. In the literature on blame and responsibility (people like Macalester Bell, Kyle Fritz, Daniel Bell, and earlier, P.F. Strawson), we actually have a name for this. It's the distinction between **Correctness** and **Standing**.

  1.  **Correctness (The Truth Claim):** "This code is untested." This is a factual claim about the world. Your hypocrisy does not change the state of the repository. If the code is buggy, it's buggy, regardless of who points it out. Your friend's second point ("hypocrisy isn't an argument") relies on this. In logic, *tu quoque* is a fallacy because the truth of the proposition is independent of the speaker.
  2.  **Standing (The Authority Claim):** "I have the right to demand you fix this." This is a normative claim about social relationships. When you blame someone, you aren't just stating a fact; you're issuing a demand and implying that if they don't meet it, resentment or sanction is appropriate. This is where hypocrisy bites. If you violate the very norm you're enforcing, you undermine your authority to enforce it. Your friend's first point ("you've forfeited the right") relies on this.

  **Where your confusion lives:** You are smushing *Correctness* and *Standing*.
  *   If you think hypocrisy makes the criticism *false*, you are wrong.
  *   If you think hypocrisy makes the criticism *ineffective or damaging to trust*, you are right.

  **The "Future Hypocrisy" Puzzle:** You mentioned your friend said planning to do the same thing soon is *worse* than having done it in the past. Why?
  *   *Past lapse:* You failed. You are human. You can acknowledge the failure and aspire to the norm.
  *   *Future commitment:* You are actively planning to violate the norm. This signals that the norm is not actually a rule, but a suggestion for *others*. This transforms you from a "fellow traveler who stumbled" into a "tyrant who makes rules he won't follow." In the literature, this touches on **commitment**. If you blame someone for X while intending to do X, you are treating them as a mere means to your end (clean code) rather than a member of a moral community (the team) bound by shared rules.

  **The Power Dynamic:** You are a Tech Lead. You have *institutional* standing (you can block the PR). But you lack *moral* standing if you're hypocritical. If you rely only on institutional standing, you get compliance but breed resentment (the "quiet quitting" of code quality). The goal of this procedure is to align your moral standing with your institutional power so you don't burn social capital.

  **The Constraint:** You have 90 seconds. We cannot do deep moral introspection per comment. We need heuristics.

  ---

  ### Part 2: The Procedure (The "Standing Check")

  This is a pre-flight checklist for your review comments. Run this mentally before typing.

  #### Step 1: The Truth Filter
  *   **Question:** Is this criticism objectively valid according to our *written* or *agreed* standards?
  *   **Sufficient Answer:** Yes, it violates a specific team norm (e.g., "all PRs >200 lines need tests").
  *   **If No:** Stop. Don't post. (This filters out personal preference masquerading as standards).
  *   **Why this doesn't let you off the hook:** Just because it's true doesn't mean *you* get to be the one to say it (see Step 2).

  #### Step 2: The Mirror Check
  *   **Question:** Have I violated this specific norm in the last 2 quarters, or am I planning to violate it in the next sprint?
  *   **Sufficient Answer:** Be honest. Check your own merged PRs or the roadmap.
  *   **Branch A (No):** Post as normal.
  *   **Branch B (Yes):** Proceed to Step 3.

  #### Step 3: The Severity & Cause Check
  *   **Question:** Is this a critical safety/correctness issue, or a style/maintainability issue? And *why* did I violate it?
  *   **Sufficient Answer:**
      *   *Critical (Security/Data Loss):* Proceed to Step 4 (Frame it).
      *   *Maintainability (Tests/Refactoring):* Did I violate it because of external pressure (deadline) or negligence?
  *   **Why this matters:** Hypocrisy on safety is harder to forgive than hypocrisy on style. But hypocrisy caused by *systemic pressure* (you were forced to skip tests) changes the game to Step 5.

  #### Step 4: The Framing Decision
  *   **Question:** Can I acknowledge my own violation while making this comment?
  *   **Branch B1 (I can acknowledge):** Post, but use "We/I" framing (see examples below).
  *   **Branch B2 (I cannot acknowledge/I plan to do it again):** Proceed to Step 5.

  #### Step 5: The Norm Escalation
  *   **Question:** Is this violation a symptom of a broken team norm that applies to everyone (including me)?
  *   **Sufficient Answer:** If you are planning to skip tests next sprint because "roadmap pressure," then "All PRs must have tests" is currently a lie.
  *   **Branch C1 (Yes, norm is broken):** Do **not** post the comment on the person. Escalate to the team channel/retro as a process issue.
  *   **Branch C2 (No, just me being lazy):** Do **not** post the comment. Fix your own code first.

  ---

  ### Part 3: The Branches & Scripts

  Here is exactly what you do in each outcome.

  #### Outcome 1: Post as Normal
  *   **Condition:** Valid criticism + You are clean on this norm.
  *   **Script:** Standard review comment. "Please add tests for this edge case per our guidelines."
  *   **Rationale:** Your standing is intact.

  #### Outcome 2: Post with "Solidarity Framing"
  *   **Condition:** Valid criticism + You violated this recently (Past Hypocrisy) + You intend to uphold the norm going forward.
  *   **Script:** "I'm flagging this because we need tests here. I know I merged a similar PR without tests last quarter—that was a miss on my part and I'm trying to be better about it. Let's make sure we cover this."
  *   **Rationale:** This restores standing. You admit the lapse, affirm the norm, and align yourself with them against the standard, rather than above them.
  *   **Why it works:** It neutralizes resentment. They can't resent you for holding a standard you admit you also struggle with but are trying to fix.

  #### Outcome 3: Escalate as Norm (Don't Blame the Person)
  *   **Condition:** Valid criticism + You are *planning* to violate this soon (Future Hypocrisy) OR You were forced to violate it by management/roadmap.
  *   **Script:** (Do not comment on the PR). Instead, post in team chat: "Hey team, I'm seeing a pattern where we're skipping tests on large PRs due to timeline pressure. I'm going to be forced to do this on the Hotfix sprint too. We need to decide if 'tests required' is still our rule or if we need a 'fast-track' exception process."
  *   **Rationale:** If you blame the junior for doing what you are *about* to do by design, you are gaslighting them. The problem is the rule, not the coder.

  #### Outcome 4: Drop the Comment (The Hard Stop)
  *   **Condition:** Valid criticism + You violated it + No intention/ability to fix your own violation + Low/Medium Severity.
  *   **Script:** Say nothing.
  *   **Rationale:** You have forfeited standing. Enforcing this now is purely power-play. It costs you trust capital you cannot afford to spend.
  *   **Why this doesn't get you off the hook:** You still have to live with the technical debt. But you cannot morally offload that debt onto the junior while you are actively accruing more of it.

  ---

  ### Part 4: Running the Cases

  #### Case (a): The 900-line Untested PR (Junior) vs. Your Past Lapse
  *   **Analysis:**
      *   Truth: Valid (untested large PRs are risky).
      *   Mirror: You did this 2 quarters ago.
      *   Severity: High (risk of regression).
      *   Cause: You got away with it last time (negligence/luck).
  *   **Procedure Result:** **Outcome 2 (Solidarity Framing).**
  *   **Why:** You cannot let this slide (safety risk), but you cannot pretend you're perfect.
  *   **Comment:** "This needs test coverage before merge. I know I merged a 900-liner without tests last quarter, and looking back, that was a mistake that added to our debt. I'm trying to hold us to a higher bar now so we don't drown in fixes later. Can you break this down or add coverage?"
  *   **Effect:** You acknowledge the inconsistency. You validate their potential resentment ("Yeah, you did it too") by agreeing with them ("Yes, I was wrong").

  #### Case (b): The Upcoming Hotfix (Future Hypocrisy)
  *   **Analysis:**
      *   Truth: Valid (tests are good).
      *   Mirror: You *will* violate this next sprint.
      *   Severity: Medium/High.
      *   Cause: Roadmap pressure (Systemic).
  *   **Procedure Result:** **Outcome 3 (Escalate as Norm).**
  *   **Why:** Your friend was right; this is worse. Past hypocrisy is a lapse; future hypocrisy is a policy. If you reject their PR for no tests while you have a ticket open to ship no-test code, you are telling them: "Rules for thee, not for me."
  *   **Action:** Do not reject the PR solely on this if the business need is similar to yours. Instead, flag the inconsistency publicly. "We are accepting risk on this PR. Note that I have a hotfix next sprint that will also skip tests due to urgency. We need to log this as accepted technical debt for both."
  *   **Effect:** You turn a moral failure into a managed risk. You share the blame with the timeline, not the junior.

  #### Case (c): The "Don't Post" Case (The Hard Pill)
  *   **Scenario:** You rejected a PR last week because it was "too complex." You tell the junior to refactor. However, the reason the code is complex is *because of an architecture decision you made six months ago* that forced this complexity, and you have refused to refactor that core module despite requests.
  *   **Analysis:**
      *   Truth: Valid (code is too complex).
      *   Mirror: You created the condition that makes this code complex.
      *   Standing: **Zero.**
  *   **Procedure Result:** **Outcome 4 (Drop the Comment).**
  *   **Why:** You are blaming them for the consequences of your own unaddressed technical debt. This is the philosophical equivalent of "dirty hands." You caused the trap, now you're blaming them for falling in it.
  *   **Action:** Merge the PR (if safe). Open a ticket for *yourself* to refactor the core module. Tell the junior: "This is complex because of legacy architecture I own. I'm not blocking this, but I'm taking on the debt to fix the root cause."
  *   **Effect:** You take the hit. You lose the short-term code quality win to preserve long-term team trust and your own moral authority.

  ---

  ### Part 5: Limits & Epistemic Confidence

  **Where this procedure is fragile:**
  1.  **The 90-Second Rule:** Steps 2 and 3 require honest self-audit. In a rush, you will lie to yourself ("Oh, my PR was different"). The procedure fails if you lack self-awareness.
  2.  **Public Channel Dynamics:** If you post "Solidarity Framing" in a public review, does it look like weakness? Sometimes. You might need to move the "I messed up too" part to a private DM if your culture punishes vulnerability.
  3.  **Power Imbalance:** The junior *cannot* push back like your senior did. The procedure relies on you voluntarily restricting your power. If you don't, the procedure is just paper.

  **Epistemic Confidence (The Philosophy Bit):**
  *   **High Confidence:** The distinction between *Correctness* and *Standing*. There is a robust consensus in contemporary moral philosophy (e.g., *The Standing to Blame* literature, 2010s–present) that hypocrisy undermines the *authority* to blame, even if the blame is factually correct.
  *   **Medium Confidence:** The claim that *Future Hypocrisy* is worse than *Past Hypocrisy*. This is debated. Some argue only actions matter (you haven't done it yet). I am siding with the "Commitment View" (Fritz et al.) because in a team setting, announced intent signals policy.
  *   **Low Confidence / Smoothed Over:** The "Consequentialist Objection." A strict consequentialist might say: "If blaming the junior improves the codebase and saves the company money, do it regardless of your hypocrisy." I have smoothed this over to prioritize the *relational* health of the team (Strawsonian view). I am assuming trust is a long-term asset more valuable than short-term code quality. If your company is in "survival mode," the consequentialist view might win, but you will burn out your team faster.

  **The Single Thing I'm Least Sure Of:**
  Whether "Solidarity Framing" (admitting your fault in the comment) always works. In some toxic cultures, admitting fault is seen as incompetence rather than integrity. If your organization punishes vulnerability, Step 4 (Drop the Comment) or Private DMs are safer than public solidarity.

  **Final Thought:**
  You aren't mangling the philosophy; you're feeling the tension between *ideal theory* (how blame should work) and *non-ideal theory* (how software teams actually work). The procedure is a bridge. Use it to keep your standing intact so that when you *really* need to block a PR, they know it's about the code, not your power.
