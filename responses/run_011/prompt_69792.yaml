  **Errors Array Ordering:**
  Most severe first.
  1. Lange equations (Serious).
  2. Prices dispensable (Moderate/Inconsistency).
  3. Hayek statistics (Moderate).
  4. Political vs Economic (Moderate/Inconsistency).

  **Credit Easily Missed:**
  - Part (a) distinction between "calculation in kind" and money prices.
  - Part (c) identification of Hayek's argument as epistemic.

  **Contestable:**
  - Hayek/Mises "same objection" thesis.

  **Flags:**
