  **Wait, one more check on Part (b) marks.**
  Question (b): "Describe the economy Lange constructs... and say what he took it to establish against Mises."
  Description: ~5 marks worth.
  Establish against Mises: ~3 marks worth.
  Description is mostly right (Households, Managers, CPB).
