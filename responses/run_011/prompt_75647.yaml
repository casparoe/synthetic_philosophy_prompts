      Epistemic credence can track objective tendencies or propensities without requiring the target proposition to currently possess a classical truth value.

  3.  **$P(\text{Norms Track Utility}) = 0.85$**
      Rational permissibility in betting contexts is governed by expected utility maximization rather than metaphysical correspondence to settled facts.

  4.  **$P(\text{Branching Semantics Cohere}) = 0.85$**
      Modern supervaluationist or branching-time frameworks successfully allow probability measures over future branches despite truth-value gaps at the present node.

  **Combination**
  I treat these four terms as redundant but highly correlated defenses against the claim that openness forces a 0.5 credence. The final figure is the weighted mean of these probabilities, discounted slightly (from 0.8875 to 0.88) to account for the risk that a single underlying metaphysical error could invalidate all four simultaneously.

  **Sensitivity**
  This figure is most sensitive to **Term 1 ($P(\text{Openness} \neq \text{Indifference})$)**. If genuine ontic openness *did* entail a Principle of Indifference (forcing a 0.5 split regardless of evidence), the permissibility of a high credence would collapse to zero, rendering the other terms irrelevant.

  **Mover**
  My credence would move most significantly upon encountering a rigorous proof that **objective chance is incoherent without determinism**. If it were demonstrated that "causal weight" logically requires a settled future (incompatibilism about chance), then the evidence of fleet dispositions would be rendered metaphysically inert, forcing my credence in the proposition down toward 0.5.
