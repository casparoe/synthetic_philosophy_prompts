          *   **Go:** Has draws (rare, but possible with specific rulesets), but more importantly, *Zugszwang* isn't the issue, but *Ko* and passing complicate things. However, the bigger issue is that Go with handicap stones isn't exactly "extra moves" in the same way. But the main killer is that strategy-stealing usually proves a *win*, whereas in Chess/Go a *draw* is the likely optimal outcome. If the game is a theoretical draw, strategy-stealing doesn't prove P1 wins. It only proves P1 can at least draw (if draws are possible). But standard strategy-stealing assumes no draws.
