answer: |-
  Right, let's have a proper look at this. It is a brilliant topic for a seminar — the strategy-stealing argument is elegant, counter-intuitive, and genuinely philosophically provocative. However, your nagging feeling is correct: two of the links in your chain are indeed dodgy, and if you present them as they stand, a sharp third-year with a basic knowledge of game theory or logic will pull the whole thing apart.

  Here is the conceptual lay of the land, stripped of the politeness.

  ### 1. The Transfer to Chess and Go
  This is the weakest link, and frankly, it is the easiest for a student to dismantle. You cannot lump Hex, Chess, and Go into the same "epistemic boat".

  The strategy-stealing argument relies on two specific structural features:
  1.  **Monotonicity:** Having an extra piece on the board is never a disadvantage.
  2.  **No Draws:** The game must end in a win for one side.

  Hex satisfies both. Chess and Go satisfy neither.

  In Chess, the phenomenon of *Zugszwang* (where being compelled to move is a disadvantage) immediately breaks the monotonicity condition. If Player 1 makes an arbitrary opening move and then adopts Player 2's strategy, they might find themselves in a position where the "extra" move they made earlier forces a loss that wouldn't have occurred otherwise. Furthermore, Chess allows for draws. Strategy-stealing in a game with draws can at best prove that the first player can force a *non-loss* (a win or a draw), not a win. Since the consensus among grandmasters and engines is that optimal Chess is likely a draw, the argument doesn't tell you what you claim it does.

  Go is similar. While an extra stone is generally helpful, the rulesets regarding *Ko* and passing complicate the "stealing" mechanism. More importantly, like Chess, Go is widely believed to be a theoretical draw (with komi adjusted) or a win for White depending on the handicap.

  Checkers (English Draughts) is a different case entirely: it has been *solved* (by Schaeffer et al. in 2007). It is a theoretical draw. It is not "waiting on somebody with a big enough machine"; the machine has already done it.

  **Diagnosis:** If you tell your students that strategy-stealing proves Chess is a first-player win in principle, you will lose credibility. The argument works for Hex (and Chomp, and Tic-Tac-Toe on large boards) precisely because those games lack draws and Zugszwang. Keep the focus on Hex. Do not overextend to Chess.

  ### 2. The Intuitionist Move
  This is the subtler philosophical error. You want to argue that because the proof is non-constructive, the Intuitionist must deny that the winning strategy exists until it is constructed. You suggest this makes the Hex position "indeterminate".

  Here is the problem: Intuitionism's rejection of the Law of Excluded Middle and non-constructive existence proofs is primarily motivated by the **infinite**.

  Hex is a finite game. The game tree is finite. There are no draws. Therefore, by Zermelo's Theorem, the game is determined. An Intuitionist generally accepts backward induction on finite trees as constructive *in principle*. The fact that the tree is too large for a human (or even a supercomputer) to traverse is a matter of *computational complexity*, not *logical constructibility*.

  For a strict Intuitionist (like Brouwer), a mathematical object exists if there is a mental construction for it. In a finite game, the "construction" is the backward induction algorithm. The fact that we don't know the output of that algorithm yet does not make the proposition "P1 has a winning strategy" indeterminate in the intuitionistic sense. It is merely unknown.

  If you claim the position is indeterminate, you are sliding from **Intuitionism** into **Ultrafinitism** (or Feasibility Logic). An Ultrafinitist might argue that if a computation requires more steps than there are particles in the universe, the result doesn't "exist". But that is a much harder sell than standard Intuitionism, and it conflates physics with logic.

  **Diagnosis:** Your claim that strategy-stealing is a *reductio* of classical logic is too strong. Classical logic handles finite existence claims perfectly well, even if the proof is non-constructive. The Intuitionist would reject the *proof method* (reductio ad absurdum), but they would likely accept the *conclusion* because a constructive proof (backward induction) exists in principle. You cannot use Hex to show that classical logic leads to falsehoods; you can only use it to show that classical logic allows for knowledge that is practically useless.

  ### 3. A Better Hook for the Seminar
  Do not scrap the session; the core idea is sound. But you need to pivot the philosophical framing to survive scrutiny.

  **Option A: Knowledge-That vs. Knowledge-How**
  Instead of attacking classical logic, attack the nature of mathematical knowledge. Strategy-stealing gives us *knowledge-that* (a strategy exists) without *knowledge-how* (the strategy itself).
  *   **The Hook:** Is mathematics about discovering truths that hold independently of our ability to compute them, or is it a tool for calculation?
  *   **The Twist:** Contrast Strategy-Stealing (non-constructive, elegant, gives no actionable info) with Backward Induction (constructive, brute-force, gives the solution but is intractable).
  *   **The Question:** If a proof tells you something is true but gives you no way to verify it or use it, in what sense do you "know" it? This avoids the Intuitionist trap because you aren't claiming the truth is indeterminate, only that the *epistemic value* of the proof is suspect.

  **Option B: The Feasibility Objection (Ultrafinitism)**
  If you really want to press the "existence" angle, pivot to Ultrafinitism.
  *   **The Hook:** For a finite game, classical logic says the value is determined. But if the game tree is larger than the physical resources of the universe, does "determined" mean anything?
  *   **The Argument:** Strategy-stealing proves a win exists. Backward induction says we could find it. But we can't. So, is the "winning strategy" a real mathematical object, or a fiction of our logical notation?
  *   **Why this works:** It acknowledges the finiteness of Hex (avoiding the Intuitionist error) but presses the point that "in principle" might be doing too much heavy lifting.

  ### Summary of Advice
  1.  **Drop Chess and Go.** Stick to Hex. Acknowledge that strategy-stealing is a special property of specific games (monotonic, no draws).
  2.  **Soften the Intuitionist Claim.** Do not say the position is indeterminate. Say that the *proof* fails to meet intuitionistic standards of evidence, even if the result is acceptable via other means. Or, pivot to Ultrafinitism if you want to question the existence of the strategy itself.
  3.  **Focus on Epistemology.** The strongest philosophical meat here is the distinction between knowing a solution exists and knowing the solution. That is a robust debate that doesn't rely on technical errors regarding game trees.

  If you frame it as "What is the value of a proof that provides no method?", you will have a lively seminar. If you frame it as "Classical logic is wrong about Chess", you will have a mutiny.

  Keep the Hex example; it is the cleanest case we have. Just trim the overreach. Good luck with the term.
