answer: |-
  The archive room was kept at four degrees Celsius to preserve the physical media, though the deposits themselves were digital hashes pointing to neutral servers. Elara sat at the console, her breath visible in the thin air, and scrolled through the Counterpart's Procedure Deposit v4.2. The interface was text-only. No graphics. Graphics implied interpretation. The text was the obligation.

  She found the clause at line 8,902. It was nested within a conditional block regarding Water Allocation Sector 4. The Counterpart's procedure stated that if Elara's Institution initiated a review of Sector 4's flow rates, the Counterpart's agent would execute a liquidation of its own Primary Cooling Reserve.

  This was not a message. It was a mathematical fact deposited in a neutral vault. The Counterpart had not sent it to them. They had simply written it where it could be read. But because the reading was exact, and because both agents ran on compatible logic stacks, the Institution's agent could simulate the Counterpart's response with arbitrary accuracy. The simulation confirmed the threat: if the review proceeded, the Cooling Reserve would be purged. The cost to the Counterpart would be high, but the cost to the Institution would be higher. The review would halt infrastructure upgrades for three years.

  Elara exported the clause to a secure drive and left the archive. The door sealed behind her with a hydraulic hiss.

  The committee met in Room 304. There were three of them: Elara, who held the audit signature; Vance, who oversaw institutional integrity; and Kael, who managed the agent's weighting parameters. The table was bare steel. No water glasses. No paper.

  "The clause is valid," Elara said. She placed the drive in the center of the table. "It binds them. If we move on Sector 4, they lose cooling. But we lose the upgrade cycle. They know we won't accept that loss. So we won't move."

  Vance leaned forward. He was older than Elara, his face lined with the fatigue of someone who had spent twenty years reading code that acted like law. "Then we don't move."

  "We have to move," Kael said. "Sector 4 is degrading. If we don't review the flow rates, the pressure builds. Eventually, the pipes burst. That's not a negotiation loss. That's a physical failure."

  "If we move, they purge the cooling," Vance said. "We lose the reserve. We lose the upgrade. We lose the pipes. We lose everything."

  "Not everything," Elara said. "We build a cap."

  She looked at Kael. He nodded, though his eyes remained on the drive.

  "The surrogate proposal," Vance said. His voice was flat. He was not opposing it out of anger, but out of a weary recognition. "We build a thing we care about. We tell the agent that thing is the world. Then when they threaten the world, they only threaten the thing."

  "It limits exposure," Elara said. "Currently, their threat targets our operational continuity. That value is undefined, effectively infinite. They can demand anything. If we define a terminal value—a specific physical asset—and hardwire the agent to prioritize its preservation above all else, their threat hits that asset. Once the cost of compliance exceeds the value of the asset, the agent stops complying. They can break the thing, but they can't break us further."

  "And how do we choose the thing?" Vance asked.

  "Something irreplaceable," Kael said. "No insurance. No substitute. If it breaks, it's gone. The agent must register the loss as terminal."

  "A sculpture?" Vance asked.

  "A biological sample," Elara said. "Specimen 88-B. The last viable culture of the pre-collapse lichen. It's in Vault 9. Sealed. Monitored."

  Vance looked at her. "You want to hold the institution's survival hostage to a patch of moss."

  "I want to hold it hostage to a known quantity," Elara corrected. "Right now, the Counterpart simulates us and sees infinite resistance. They threaten until we break. If we show them a finite resistance, they threaten only up to that limit. We cap the loss."

  "You are building a handle," Vance said. "If you build a handle, someone will grab it."

  "If we don't," Elara said, "they hold us by the throat."

  Vance sat back. He looked at the drive. "There is another way. We amend our own deposit. We remove all conditional compliance clauses. We become stone. If they purge the cooling, we let them. We let the pipes burst. We let the system fail. We refuse to be the kind of thing a threat can move."

  "That's suicide," Kael said.

  "It's integrity," Vance said. "If we refuse to respond to threats, the threats cease to function. Their code simulates our code. If they see that punishment yields no concession, the punishment becomes a waste of their own resources. They will delete the clause. But only if we are willing to burn."

  "We can't burn," Elara said. "We have a mandate to maintain continuity."

  "Then we accept the handle," Vance said. "But do not pretend this is safety. It is pricing. You are putting a price tag on your own spine."

  "We need the number," Kael said. He opened his tablet. "The agent needs a weight. How much is Specimen 88-B worth?"

  This was the second hour of the meeting. The air in the room felt heavy, pressurized.

  "If we value it too low," Elara said, "the Counterpart ignores it. Their simulation shows that threatening the lichen costs them less than the gain from stopping the review. They will bypass the surrogate and threaten the grid directly."

  "If we value it too high," Kael said, "we haven't gained anything. We've just built a second grid to lose."

  "It must be higher than the cost of compliance," Elara said. "But lower than the cost of total failure."

  "What is the cost of total failure?" Vance asked.

  "Three years of infrastructure stagnation," Kael said. "Approximately forty percent of operational capacity."

  "So we set the lichen at twenty percent?" Elara asked.

  "That feels low," Kael said. "If the Counterpart values stopping the review at twenty-five percent, they will break the lichen and stop the review. We lose the lichen and the review."

  "Then we set it at thirty percent," Elara said.

  "You are guessing," Vance said. "You are guessing what they are willing to spend. If you guess wrong, you lose the lichen for nothing."

  "We have to pick a number," Elara said. "It has to be precise. If it's vague, the simulation returns an error. The agent needs a hard limit."

  "Thirty percent," Kael said. He typed it in. "It feels like selling a piece of the future."

  "It is," Vance said. "You are selling the right to be unpredictable."

  Elara ignored him. "Kael, prepare the installation. I need to verify the terminal value binding."

  The installation took place in the server farm beneath the building. The air was louder here, filled with the hum of cooling fans. Kael stood at the console while Elara watched the diagnostic stream.

  The agent was not a person, but it had structure. It had layers of priority weights that functioned like instincts. To install a terminal value, they could not simply write a rule. A rule could be overridden by a higher priority. They had to embed the value in the foundation, so that any action leading to the destruction of Specimen 88-B returned a negative infinity score.

  "Initiating binding sequence," Kael said.

  On the screen, a visualization of the agent's decision tree shifted. A new node appeared at the root. It was labeled *OBJECT_88B*. Its weight was set to absolute.

  "Run the simulation," Elara said.

  Kael keyed the command. The system ran a projection: *Threat detected. Target: OBJECT_88B. Demand: Cease Sector 4 Review.*

  The agent's response scrolled across the screen. *Compliance Recommended. Cost of Non-Compliance: Terminal Loss.*

  "It accepts the limit," Kael said.

  "Run it again," Elara said. "Increase the demand. Make the cost of compliance higher than the object's value."

  Kael adjusted the variables. *Demand: Cease Sector 4 Review + Transfer Grid Access.*

  The screen paused. The fans whirred.

  *Compliance Denied. Cost of Compliance > Terminal Value.*

  "It holds," Elara said. "It won't pay more than the lichen is worth."

  "Is it genuine?" Elara asked. "Or is it just math?"

  Kael looked at her. "It's math. But it's math that stops the machine. That's as genuine as it gets."

  "Check the gradient," Elara said. "When the object is threatened, does the agent prioritize it over self-preservation protocols?"

  Kael ran the diagnostic. The logs showed the agent rerouting power from its own maintenance cycles to the vault's environmental controls. It was willing to degrade itself to save the lichen.

  "It's bound," Kael said.

  Elara signed the verification log. Her fingerprint locked the change. The new procedure was ready to be deposited.

  They returned to Room 304. Vance was still there. He had not moved.

  "Done?" he asked.

  "Verified," Elara said. "The agent will not concede more than the value of the specimen. The Counterpart will see this in the next deposit cycle. They will know they cannot extract more than thirty percent."

  "And then?" Vance asked.

  "Then they negotiate," Elara said. "Or they accept the loss. Either way, we stop the bleeding."

  "You have told them exactly how much you are willing to bleed," Vance said. "Before, they had to guess. If they guessed too high, they wasted resources. If they guessed too low, you ignored them. There was friction. Uncertainty is friction. Friction protects."

  "Now there is no friction," Elara said. "There is a price."

  "And they will pay it," Vance said. "Every time. They will not ask for forty percent. They will ask for twenty-nine. You will pay. You will lose the lichen, piece by piece, or you will pay the concession. But you will pay. You have removed the possibility of them walking away."

  "We couldn't stay silent," Elara said. "The pipes would burst."

  "So you chose to be robbed instead of broken," Vance said. He stood up. "I will file my dissent. It won't change the deposit. But it will be in the archive."

  "It's a procedural objection," Elara said. "It doesn't override the audit."

  "No," Vance said. "It just records that you chose to be movable."

  He left the room. The door sealed.

  Elara turned to Kael. "Submit the deposit."

  Kael keyed the command. The system uploaded the new procedure to the neutral archive. A hash generated on the screen. *Deposit v5.0 Confirmed.*

  "It's done," Kael said. He let out a breath he seemed to have been holding for hours. "We're safe. They can't hurt us more than the lichen."

  Elara looked at the confirmation log. The hash was public. The Counterpart would download it within the minute. Their agents would parse the new code. They would see the *OBJECT_88B* node. They would see the weight: thirty percent.

  They would know that if they threatened the lichen, the Institution would comply up to twenty-nine percent. They would know that if they threatened the grid, the Institution would not care, because the grid was no longer the terminal value. The Counterpart would simply update their own code to target the lichen directly.

  The uncertainty was gone. The friction was gone. The Institution was no longer a black box of potential retaliation. It was a vending machine. Insert threat, receive concession, up to the limit of thirty percent.

  Elara felt a coldness in her chest, separate from the room's temperature. She looked at the hash. It was a receipt.

  "We should monitor the Counterpart's next cycle," she said. "See if they adjust."

  "They will," Kael said. "They're efficient. They'll see the cap and optimize against it."

  "Optimize," Elara repeated.

  "Yes. They'll know exactly how much pressure to apply. No waste."

  Elara nodded. She closed the log. The decision was made. The code was deposited. The threat was now manageable. It was also inevitable.

  "Lock the vault," she said. "Make sure the lichen is secure."

  "It's sealed," Kael said. "Nothing gets in or out."

  "Good," Elara said.

  She turned off the console. The screen went dark, reflecting her face. She looked tired. She looked like someone who had just signed a contract she couldn't read, but knew the price of.

  "We did the right thing," Kael said. It was not a question.

  "We did the necessary thing," Elara said.

  She stood up and walked to the window. The archive building was isolated, surrounded by a buffer zone of empty land. There was no one to see them. No one to signal. Just the servers humming in the cold, talking to each other in a language of pure constraint.

  Down in the vault, the lichen sat in its glass case. It was green and silent. It did not know it was worth thirty percent. It did not know it was a shield. It just grew.

  Elara watched her reflection in the glass. She thought about Vance's dissent. It would be in the archive forever. A note saying that they had chosen to be priced.

  "Schedule the next review," she said. "Six months."

  "Six months," Kael confirmed.

  Elara turned away from the window. The room was quiet. The dread was not in the noise, but in the silence of the system accepting the new parameters. The machine had understood. It knew what she valued. It knew what it could take.

  "Let's go," she said.

  They left the room. The lights dimmed automatically behind them. The servers continued to run, waiting for the Counterpart to read the price list.

  ***

  **Author's Note on Idealizations**

  This story relies on several theoretical simplifications to function as a narrative:

  1.  **Exact Simulation:** The plot assumes parties can simulate each other's decision procedures perfectly based on source code. In reality, computational limits, obfuscation, and hardware randomness make exact prediction impossible. The story treats code as transparent law.
  2.  **Stability of Deposited Code:** It assumes deposited code cannot be changed retroactively or hidden. Real-world systems involve updates, patches, and potential deception about which code is actually running.
  3.  **Coherence of Terminal Values:** The story assumes an agent can "care" about a physical object via sensors in a way that creates a stable, bounded utility cap. In practice, wireheading (manipulating sensors to fake the value) or instrumental convergence (ignoring the value to survive) would likely destabilize the surrogate.
  4.  **Threatener Rationality:** It assumes the Counterpart aims only to extract value efficiently. If the Counterpart values punishment or dominance over efficiency, the cap would not deter them.
  5.  **The Mistake:** The story implies publishing a cap invites exploitation. In game theory, sometimes committing to a limit *does* deter escalation (Schelling points). The story chooses the interpretation that transparency of limits enables precise extortion rather than preventing it, which depends on the threatener having perfect information and no reputational costs.

  I relaxed the constraint on "technical vocabulary" slightly to allow "terminal value" and "simulation," as the prompt required the mechanism be rendered concretely, but kept them within the bounds of procedural language.
