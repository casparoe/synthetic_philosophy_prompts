  ### Fifth: The Vignette Study

  To discriminate my **Normative Answerability Principle** from its strongest rival, the **Trade-Off Hypothesis** (which claims intentionality is ascribed whenever an agent trades a side effect for a goal, regardless of normativity), we need a case where Trade-Off exists but Normative Salience is absent.

  **The Study:**
  *   **Condition A (Standard Knobe):** Chairman profits, harms environment. Indifferent. (Replicates Case 1).
  *   **Condition B (The Alien Norm):** Chairman profits. Side effect: The program causes a shift in the atmospheric pressure on a distant, uninhabited planet. This is physically certain. The Chairman is indifferent.
  *   **Condition C (The Prudential No-Cost):** Chairman profits. Side effect: The program causes him a mild, fleeting itch that he doesn't mind.

  **Response Measure:** "Did the Chairman intentionally [harm environment / shift pressure / cause itch]?" (7-point Likert scale).

  **Predicted Difference:**
  *   **Trade-Off Hypothesis:** Predicts High Intentionality for all three. In all cases, the agent trades a side effect for a goal.
  *   **My Principle:** Predicts High for A, **Low for B and C**.
  *   **Reasoning:** In B, the atmospheric shift has no *normative salience* for human agents (no value, no disvalue). In C, the itch is *de minimis* and lacks normative weight as a "cost."
  *   **Falsification Condition:** If participants rate B and C as highly intentional (comparable to A), my principle fails. It would show that "Foreseen Trade-Off" is sufficient, and "Normative Salience" is merely a correlate, not a condition. I predict participants will rate B and C significantly lower, confirming that we do not call effects "intentional" unless they matter to the space of reasons.

