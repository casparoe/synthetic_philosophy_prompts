  ### Sixth: Note on Reliability

  **Are you typical?**
  No. Your pattern shows **Expert Drift**.
  Ordinary speakers exhibit the Knobe Effect (Case 1) robustly, but they are much more likely to classify Case 9 (Plants) as *Not Intentional* due to the triviality, and they are more likely to classify Case 7 (Incompetent Killer) as *Intentional* due to moral outrage.

  **Does it matter?**
  Yes. Ordinary speakers operate with a "fuzzy" concept that blends blame, causality, and intentionality. You, with training, are attempting to disentangle them. Your hesitation on Case 8 shows you are successfully detecting the separation of Blame and Intentionality. However, your verdict on Case 7 suggests you still succumb to the **Moral Override Bias** (letting the badness of the outcome force an intentionality attribution despite lack of control).

  Your reliability is high for detecting normative structures (4 vs. 5), but your data is noisy on the boundary conditions of control (6 vs. 7) and severity (1 vs. 9). A principle derived from your judgments must correct for the noise in 7 and 9 to capture the underlying competence you are demonstrating in 1, 4, 5, and 8. You are a better witness to the *normative* structure of the concept than the *folk* are, but you are not immune to the very biases you study.
