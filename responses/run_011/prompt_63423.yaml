answer: |-
  **JURISPRUDENCE SEMINAR: TAKE-HOME ASSESSMENT**

  **Time Allowed:** 48 Hours
  **Word Limit:** 1,500 words maximum
  **Total Marks:** 25

  **The Charter of the Association**

  A private members' association operates under a written Charter containing three relevant articles:
  *   **Article 7:** "Every member shall have one vote."
  *   **Article 23:** "This charter may be amended by a two-thirds vote of the members present."
  *   **Article 24:** "Art. 7 may not be amended."

  At the Annual General Meeting, the membership passes two resolutions using the procedure in Article 23 (a two-thirds vote of members present).
  1.  **Resolution A:** Deletes Article 24 from the Charter.
  2.  **Resolution B:** Amends Article 7 to grant founding families three votes each.

  **Questions**

  (a) Analyze the validity of Resolution B. In doing so, evaluate the distinction between a limitation on the *content* of an amendment (what can be changed) and a limitation on the *manner and form* of an amendment (the procedure required to change it). Does categorizing Article 24 as a content limitation resolve the logical problem of using Article 23 to delete Article 24? (10 marks)

  (b) For Article 24 to successfully bind the membership, what must be true about the legal nature of the power conferred by Article 23? Explain why Article 24 fails if this condition is not met. (5 marks)

  (c) Argue the strongest version of the position you *rejected* in part (a). Why might a reasonable interpreter conclude that your preferred analysis is flawed? (5 marks)

  (d) Briefly explain why the existence of a court to adjudicate the dispute is irrelevant to the question of the Resolution's *validity*. (5 marks)

  ***

  **MODEL ANSWER**

  **Validity and the Paradox of Entrenchment**

  Resolution B is invalid, but only if Resolution A is also invalid. The core difficulty is not the voting count, but whether Article 23 grants the power to remove Article 24. If Article 24 is a valid limitation on Article 23, then the attempt to delete Article 24 (Resolution A) is *ultra vires* (beyond power). If Resolution A is a nullity, Article 24 remains in force, rendering Resolution B (which violates Article 24) invalid.

  The distinction between *content* and *manner and form* is often used to analyze entrenchment. A manner and form restriction dictates the procedure for amendment (e.g., "must be passed at two consecutive meetings"). A content restriction dictates the substantive outcome (e.g., "Article 7 may not be amended"). Article 24 is clearly a content restriction. However, this distinction does not solve the logical paradox; it merely labels it. If Article 23 is the sole source of amendment power, and it is subject to Article 24, then the power to amend does not extend to Article 24. Consequently, Resolution A is not an exercise of power under Article 23; it is an attempt to exercise a power that does not exist. Calling this a "content limitation" explains *why* the power is absent, but it does not explain how the members can overcome it without stepping outside the Charter entirely.

  For Article 24 to bind the membership, Article 23 must be understood as a *delegated* power rather than an inherent one. The members' authority to amend must derive from the Charter itself. If the Charter creates the power, the Charter can limit it. If, however, the members possess an inherent sovereign power to govern themselves, and Article 23 is merely a convenient channel for that power, then Article 24 is ineffective. A sovereign power cannot be bound by a rule it creates unless it chooses to be, and it can always choose otherwise. Therefore, for Article 24 to work, the Charter must be viewed as superior to the current membership's will. The condition required is that the "rule of amendment" is hierarchically superior to the "act of amending." If Article 23 is simply a description of how the members currently choose to act, Article 24 is a speed bump that can be removed by driving over it.

  The strongest argument against this view (and in favor of Resolution B's validity) is the "self-embracing" theory of amendment power. This view holds that the power to amend in Article 23 includes the power to amend the limitations on that power. To argue otherwise creates an infinite regress: if Article 24 protects Article 7, what protects Article 24? If Article 24 is unamendable, the Charter becomes rigid and unable to adapt to existential threats. A reasonable interpreter might argue that Resolution A was a valid "self-correction." By using Article 23 to remove Article 24, the members were not violating the Charter but updating its operating system. On this view, Resolution A succeeds because the power to amend is broad enough to swallow its own restrictions. Once Article 24 is gone, Resolution B is a standard amendment. This view prioritizes the current will of the membership over the historical constraints of the founding document, treating the Charter as a living instrument rather than a binding chain.

  Finally, the validity of these resolutions does not depend on a court's decision. Validity is a question of whether the act was performed according to the normative system's rules. Enforceability is a question of whether a sanction will be applied. A resolution can be valid but unenforced (e.g., if no one challenges it), or invalid but enforced (e.g., if a tyrant upholds it). Introducing a court conflates the existence of the rule with the remedy for its breach. The question asks whether the resolution *is* law, not whether a judge will *say* it is law. The logical consistency of the Charter determines validity; the presence of an adjudicator determines only whether that validity is tested.

  ***

  **MARKING SCHEME (25 Marks)**

  **A-Grade Moves (Required for 20+ marks)**
  1.  **Identifies the Dependency:** Explicitly states that Resolution B's validity depends entirely on Resolution A's validity. (2 marks)
  2.  **Critiques the Distinction:** Explains that labeling Art. 24 as a "content" limitation explains the *type* of restriction but does not solve the *source of power* paradox (i.e., you can't use a limited power to remove the limit). (3 marks)
  3.  **Hierarchy of Norms:** In part (b), identifies that Art. 23 must be a *delegated* power derived from the Charter, not an inherent power of the members. If the power comes from the members, the Charter cannot bind them. (3 marks)
  4.  **Steel-manning:** In part (c), articulates the "self-embracing" argument clearly: that the amendment power includes the power to alter the scope of the amendment power itself, prioritizing adaptability over rigidity. (3 marks)
  5.  **Validity vs. Enforcement:** In part (d), clearly distinguishes between the normative status of the rule (validity) and the institutional mechanism for challenging it (enforceability/adjudication). (3 marks)
  6.  **Internal Logic:** Relies on the logic of the Charter text provided rather than external political theories or name-dropping theorists to do the analytical work. (3 marks)

  **Specific Penalties (Deductions from the total)**
  *   **The "Court" Fallacy (-3 marks):** Arguing that the resolution is valid/invalid *because* a court would/would not uphold it. (See part d requirement).
  *   **Validity/Enforceability Conflation (-2 marks):** Using terms like "binding" or "legal" interchangeably with "enforced" or "punished."
  *   **The "Pointless" Conclusion (-2 marks):** Concluding that Art. 24 is meaningless simply because it requires political will to uphold it. (Entrenchment can be normative even if not self-executing).
  *   **Assumed Regress (-2 marks):** Asserting that an infinite regress of rules is "vicious" or "impossible" without explaining *why* it breaks the system.
  *   **Theoretical Name-Dropping (-1 to -3 marks):** Using "Hart," "Kelsen," "Grundnorm," or "Rule of Recognition" as a substitute for argument. (These terms are permitted only if accurately applied to the specific mechanics of the Charter, not as labels).

  **Grade Bands**
  *   **22-25 (High Distinction):** Makes all 6 A-Grade moves. Nuanced handling of the "content vs. manner" distinction (acknowledging it doesn't fully solve the paradox). Clear separation of validity and enforcement.
  *   **18-21 (Distinction):** Makes moves 1, 3, 4, and 5. Struggles slightly with the critique of the content/manner distinction or the hierarchy condition.
  *   **14-17 (Credit):** Identifies the basic conflict. Answers part (b) by saying "Art. 24 must be higher law" without explaining the delegation condition. Part (d) is weak or conflates validity with enforcement.
  *   **10-13 (Pass)** Identifies the facts. Argues one side clearly but fails to steel-man the other. Relies on "common sense" rather than normative logic.
  *   **0-9 (Fail):** Fails to address the dependency of Resolution B on A. Treats the question as a prediction of litigation outcomes.

  **The "Bad-but-Common" Answer (Spotting Guide)**
  *   **The "Court-Centric" Answer:** The student spends 50% of the word count discussing whether a judge would intervene, whether the association is incorporated, or what the "reasonable member" would expect. They conclude that Resolution B is valid because "no one stopped it" or invalid because "a court would strike it down."
  *   **The "Theorist Label" Answer:** The student writes: "According to Hart, the Rule of Recognition determines validity. Since the members accept Art. 23, that is the Rule of Recognition. Therefore Art. 24 is void." This gets the conclusion but bypasses the internal logic of the Charter required by the prompt.
  *   **The "Democracy" Answer:** The student argues Resolution B is valid because "the majority (or 2/3) should rule" and entrenchment is "undemocratic." This ignores the normative constraint of the existing Charter.
