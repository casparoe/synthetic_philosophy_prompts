prompt: |-
  I've been chewing on a podcast episode I heard on the way to work, and I'd like a second opinion before I repeat any of it to people. It was one of those shows that rehabilitates famous thinkers, and the subject was Adam Smith — the angle being that everyone hears the name and thinks invisible hand, self-interest, greed-is-good, when actually his first book, The Theory of Moral Sentiments (1759), came seventeen years before The Wealth of Nations and is all about how other-regarding we are.

  Here's roughly the account he gave, in my words but tracking what he said:

  Smith's starting point is sympathy. When you see someone in distress you don't reason your way into caring about them, you just catch the feeling — he uses the example of flinching when you see a blow about to land on somebody else's arm. That's not self-interest wearing a disguise: Smith was explicit that he's arguing against the Hobbes/Mandeville line that all concern for others is really concern for yourself. Sympathy also happens to feel good, being in tune with other people is pleasant, and that's a big part of why we bother cultivating the virtues at all. Approval, for Smith, is basically just a matter of your feelings lining up with someone else's. But raw sympathy is obviously lopsided — we care more about people close to us than people far away, and most of all about ourselves — so Smith introduces the impartial spectator, which is the voice of your community installed in your head by upbringing. Before you act you picture how it looks to an onlooker, and if you'd blush, you don't do it. Conscience on this view is just the crowd, internalised. Which has an interesting consequence: Smith's moral theory is relativist at the root. Raise a child in a slaveholding society and his impartial spectator will tell him slaveholding is fine — awkward, since Smith himself was no friend of slavery. So the two halves of the man, the moral philosopher and the economist, never really got reconciled.

  So how much of that would someone who actually works on Smith sign off on? Could you go through it piece by piece and tell me what's straight, what's a fair simplification for a general audience, and what's actually wrong or does real damage to the view? A couple of specific things I'm unsure about: I have a hunch he's sliding between two senses of sympathy — the everyday one where you catch someone's mood, and something more like imagining yourself in their position — but I can't tell if that hunch is onto something or if I'm inventing a problem. And is it right that for Smith approving of something is just your feelings matching theirs?

  Then the bigger question: once you correct the description of the impartial spectator, does the relativism conclusion still follow, or was it leaning entirely on the "crowd in your head" gloss? And is the point about his two books not fitting together still a live worry among scholars, or is that a settled thing that the podcast was just recycling? I've never read Smith so please use the proper names for his distinctions, but explain them rather than assuming I know what they mean.

  British English please, and no need to send me off to a reading list at the end — I'm just trying to work out which parts of this I can safely repeat.
