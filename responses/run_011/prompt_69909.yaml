  **Brainstorm: Candidate Tensions**

  *   (i) vs (ii) vs (iii): If knowledge is constant across stakes (ii) and knowledge entails entitlement (i), assertion should be proper in high stakes. (iii) says it is improper.
  *   (i) vs (v) vs (vi): If assertion norms are inherited from belief norms (vi), and belief norms are truth/justification (v), assertion norms should be truth/justification. (i) says knowledge.
  *   (i) vs Objection 1: If (i) is constitutive of the act-type, violating it means not asserting. But (iii) and (iv) assume improper assertions exist.
  *   (iv) vs (vii): Using intuitions of speakers who lack conceptual grip on the norm (vii) as evidence for the norm (iv).
  *   (i) vs (viii): If (i) is constitutive of assertion, how do we demarcate "pretense" from "assertion" without already invoking the norm?
  *   (iii) vs (v): In high stakes, one may not assert (iii), but one may believe/act (v). Why the asymmetry if assertion expresses belief (vi)?
  *   (i) vs (ix): If lying is believing false, and belief without knowledge is possible (v), does lying always violate (i)? (ix) says yes, seems consistent, but relies on definition of knowledge.
  *   (ii) vs (iv): In lottery cases, does evidence settle knowledge? If invariantism holds, why is assertion improper? (i) handles this, but requires lottery propositions to be unknown.

  ***

  **Audit Deliverable**

  **1. Rank the Genuine Tensions**

  **1. The Surgeon Contradiction (Severity: Fatal)**
  *   **Commitments:** (i), (ii), (iii).
  *   **Conflict:** (ii) stipulates that knowledge is invariant across stakes (the surgeon knows in both cases). (i) stipulates that knowledge is sufficient for entitlement to assert ("knowing that p is what entitles one"). (iii) stipulates that in the high-stakes case, the assertion is improper (not entitled). You cannot simultaneously hold that the surgeon knows, that knowledge entails entitlement, and that the surgeon is not entitled.
  *   **Cheapest Revision:** Modify (i) to claim knowledge is *necessary* but not *sufficient* for entitlement. Allow pragmatic factors to override epistemic entitlement without negating knowledge.
  *   **Cost:** You abandon the strong Knowledge-First claim that knowledge *alone* governs the norm of assertion. You admit a hybrid norm (epistemic + pragmatic), which weakens the theoretical purity of (i) and requires explaining why knowledge is special if it doesn't guarantee propriety.

  **2. The Inheritance Contradiction (Severity: Fatal)**
  *   **Commitments:** (i), (v), (vi).
  *   **Conflict:** (vi) claims assertion norms are *inherited* from belief norms. (v) claims the belief norm is truth or justification. (i) claims the assertion norm is knowledge. Since knowledge is not identical to truth or justification (one can have true justified belief without knowledge), the assertion norm cannot be strictly inherited from the belief norm as described.
  *   **Cheapest Revision:** Abandon (vi). Treat the link between belief and assertion as expressive rather than normative inheritance.
  *   **Cost:** You lose your proposed explanation for why insincere assertion is defective and why assertion tracks belief. You must find a separate account for the belief-assertion link that does not rely on norm inheritance.

  **3. The Constitutive Coherence Problem (Severity: High)**
  *   **Commitments:** (i), (iii), (iv).
  *   **Conflict:** (i) calls the norm "constitutive... in virtue of which an act is the act it is." If a rule is constitutive of an act-type (like the rules of chess), violating it means one is not performing that act. Yet (iii) and (iv) describe "improper assertions," implying the act occurred but was flawed.
  *   **Cheapest Revision:** Distinguish between constitutive *aims* and constitutive *rules*. Asserting is constituted by the aim of knowledge, but one can fail the aim while still asserting.
  *   **Cost:** This comes at a cost to (i). You must weaken the claim from "constitutive rule" to "constitutive standard of correctness." This makes (i) less robust against the objection that improper assertions are not assertions at all.

  **2. Dissolved Tensions**

  *   **(iv) vs (vii):** This tension dissolves on inspection. (vii) claims speakers need not articulate the norm, not that their intuitions are unreliable. Competent speakers often track grammatical norms they cannot state; similarly, they can track assertion norms via intuition without theoretical knowledge. There is no contradiction between implicit competence and explicit ignorance.
  *   **(i) vs (ix):** This tension dissolves. (ix) states lies violate (i) because believing p is false precludes knowing p. Given (i) requires knowledge, and knowledge entails belief in truth, a liar necessarily fails the knowledge condition. This is consistent.
  *   **(i) vs (viii):** This tension dissolves provided the boundary is clear. (viii) exempts pretense from (i) by categorizing it as *not* assertion. As long as "assertion" is defined such that fiction/jokes fall outside its extension, (i) applies only to genuine assertions. No contradiction exists, though the criteria for the boundary remain unspecified.

  **3. Assessment of Quoted Objections**

  *   **Objection 1 (Constitutive Rule):** *This objection lands.*
      *   **Assessment:** If (i) is truly constitutive in the sense that violating it means "not playing the game," then an "improper assertion" is an oxymoron. You cannot have a constitutive violation that remains an instance of the act. Your commitments (iii) and (iv) rely on the existence of improper assertions.
      *   **Reply Consistency:** You can reply by distinguishing *act-type identity* from *act-quality*. One can make an assertion (type) that is defective (quality). However, this requires revising (i) to soften "constitutive" to "regulative of correctness." This reply is consistent with the rest of the package *only if* you accept the revision recommended in Section 1 (modifying (i)). If you keep (i) as written, the objection stands.

  *   **Objection 2 (Intuitions vs. Ignorance):** *This objection fails.*
      *   **Assessment:** The colleague claims (iv) and (vii) are incompatible. They are not. (vii) denies speakers need *theoretical conception* of the norm. (iv) uses speakers' *judgments* of propriety as evidence. One can reliably judge a move as "bad chess" without knowing the rulebook.
      *   **Reply Consistency:** You can maintain both without revision. The only trouble arises if (vii) implied speakers are *wrong* about the norms, but it only says they cannot *articulate* them. This objection creates no new trouble given (i)–(ix).

  **4. Case Verdicts vs. Stated Principles**

  *   **Lottery/Fake Barn (iv):** Your principles *can* deliver this verdict.
      *   **Direction:** Success. By (ii), statistical evidence or fake barn perception does not yield knowledge. By (i), no knowledge means no entitlement to assert. The verdict (improper) matches the principle output.
  *   **Surgeon Matched Pair (iii):** Your principles *cannot* deliver this verdict.
      *   **Direction:** Failure. By (ii), the surgeon knows in the high-stakes case. By (i), knowledge entails entitlement. Your principles predict the assertion is *proper*. Your verdict claims it is *improper*. The principles contradict the verdict.

  **5. Final Recommendation**

  **The Single Revision:** Modify commitment **(i)**.

  **The Change:** Replace "knowing that p is what entitles one to assert it" with "knowing that p is the *primary epistemic condition* for asserting it, though pragmatic factors may override entitlement." Maintain the necessary condition ("only if one knows") but drop the sufficiency claim.

  **What You Lose:** You lose the strong Knowledge-First purity of your assertion norm. You can no longer claim that knowledge is the *sole* governor of assertion. You must admit that two speakers with identical epistemic standing (both knowing) can differ in entitlement due to context (stakes). This weakens your response to Objection 1 (since the norm is no longer strictly constitutive of the act's correctness in all contexts) and requires you to explain what role knowledge plays if it does not guarantee entitlement. However, this is the only revision that resolves the fatal Surgeon Contradiction (i/ii/iii) while preserving your Classical Invariantism (ii) and your case verdicts (iii), which appear to be your core intuitions.
