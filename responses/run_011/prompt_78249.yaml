answer: |-
  **Planning Note**

  *   **§1.2 (Base Score):** Operationalizes the Control Principle as a subtraction algorithm; assumes culpability is a quantifiable residue after filtering non-controlled factors.
  *   **§2.1–2.3 (Adjustments):** Encodes Nagel's constitutive, circumstantial, and resultant luck as mandatory mitigating factors, treating innate temperament and outcome as external contaminants.
  *   **§2.4 (Causal Luck):** Commentary exposes the incoherence of legislating determinism; abandoned drafts show the Commission recognizing the threat to agency itself but proceeding regardless.
  *   **§3.1 (Counterfactuals):** Mandates findings on unchosen circumstances despite epistemic impossibility, satirizing the demand for a "true self" independent of context.
  *   **§4.2 (Degree vs. Scope):** Enforces the distinction between culpability *degree* (internal) and *scope* (external), noting judicial error in conflating outcome with wickedness.
  *   **§5.3 (Calculation):** Demonstrates the vanishing agent via arithmetic exhaustion; the "Minimum Residual" is an arbitrary stopgap against the logic of the guidelines themselves.
  *   **§6.1 (Dissent):** Articulates the Williamsian view that luck constitutes the moral object; argues the "pure agent" is an extensionless point incapable of bearing a life.

  ***

  **COMMISSION ON CULPABILITY ADJUSTMENT SENTENCING GUIDELINES (2024 REV.)**

  **§1.1 Definitions**
  (a) **Controlled Volition.** Any mental state or physical movement originating solely from the agent's uncoerced will, excluding factors derived from genetics, environment, prior causation, or chance occurrence.
  (b) **Base Culpability Score (BCS).** The presumptive moral weight of a prohibited act, set at 10.0 units prior to adjustments.
  (c) **Luck Factor.** Any variable influencing the act or its outcome not traceable to Controlled Volition.

  **§1.2 Statutory Mandate**
  Pursuant to the Moral Equity Act, sentencing must reflect only those aspects of the offense within the defendant's control. Adjustments shall be applied cumulatively to the BCS.

  **§2.0 Adjustments for Luck Factors**
  **§2.1 Constitutive Luck.** Subtract 3.0 units for temperament, capacity, or inclination not chosen by the agent.
  *Commentary:* Evidence of innate impulsivity or diminished empathy reduces score regardless of behavioral control exerted at the time of offense.
  **§2.2 Circumstantial Luck.** Subtract 3.0 units for situations the agent happened to encounter.
  *Commentary:* An agent tested by rare temptation is less culpable than an agent untested. The scarcity of virtue opportunities is a mitigating circumstance.
  **§2.3 Resultant Luck.** Subtract 2.0 units for outcomes diverging from intention due to chance.
  *Commentary:* See §4.2 (Scope vs. Degree).
  **§2.4 Causal Luck.** Subtract 2.0 units for prior causal determination.
  *Commentary:* [Drafting Note: Version 1.0 required proof of determinism; rejected as evidentiary burden impossible. Version 2.0 presumed determinism; rejected as contradicting statutory definition of Volition. Version 3.0 (adopted) applies adjustment universally to acknowledge causal opacity.]

  **§3.0 Counterfactual Findings**
  **§3.1 Requirement.** The Court must find what the defendant *would* have done had circumstances been otherwise (e.g., had the child not darted, had the poison been tasted).
  *Commentary:* Evidentiary uncertainty regarding counterfactuals shall not block adjustment. Where evidence is absent, the Court shall assume the most favorable alternative conduct consistent with the defendant's character profile. The difficulty of accessing the unactualized self does not relieve the Court of the duty to isolate it.

  **§4.0 Application Examples**
  **§4.1 The Negligent Drivers.** Defendant A and Defendant B drive identically negligently. A child darts before A (victim dies); no child darts before B (no victim).
  *Finding:* Both receive identical BCS (10.0) and identical adjustments. Both are equally culpable *in degree*.
  *Scope Distinction:* A is culpable *for a death*; B is culpable *for risk*. Sentencing disparity based on outcome is prohibited.
  **§4.2 The Poisoners.** Defendant C administers poison (victim dies). Defendant D administers identical poison (victim survives due to antidote).
  *Finding:* C and D are equally culpable *in degree*. C is liable for homicide; D for attempted homicide. Judges are reproved for converting scope differences into degree enhancements during oral sentencing. The harm is luck; the will is identical.

  **§5.0 Calculation and Residual Floor**
  **§5.1 Culpability Table**

  | Factor | Adjustment |
  | :--- | :--- |
  | Base Culpability Score | +10.0 |
  | §2.1 Constitutive Luck | -3.0 |
  | §2.2 Circumstantial Luck | -3.0 |
  | §2.3 Resultant Luck | -2.0 |
  | §2.4 Causal Luck | -2.0 |
  | **Total Adjusted Score** | **0.0** |

  **§5.2 Arithmetic Exhaustion.** In cases where all Luck Factors are present, the Adjusted Score shall be 0.0.
  **§5.3 Minimum Residual.** Notwithstanding §5.2, a floor of 0.1 units shall apply to all adult defendants.
  *Commentary:* A score of 0.0 implies no agent exists to punish. While the arithmetic of §2.0 logically eliminates the subject, the Commission declines to authorize null sentences for recognized offenses. This floor is not derived from the Control Principle but from the necessity of maintaining a functioning judiciary. It is acknowledged that this provision contradicts §1.2.

  **§6.0 Dissenting Statement of Commissioner Vane**
  I cannot endorse the 2024 Revision. The Guidelines operate on the premise that luck is a contaminant to be distilled out of moral life. This is a category error. Luck is not noise; it is partly constitutive of what there is to assess.

  When we subtract the driver's constitutive temperament, we remove the person. When we subtract the circumstances she happened to face, we remove the context in which character is formed. When we subtract the outcome, we remove the world's response to her agency. The manual insists on distinguishing degree from scope, but a life project is retroactively vindicated or ruined by how it turns out. The successful poisoner and the failed poisoner do not lead the same life, however identical their intentions.

  The Control Principle, pursued with this level of administrative competence, does not purify the agent; it evaporates her. The residue left after §2.0 is an extensionless point with nothing left to answer for. The Minimum Residual (§5.3) admits this implicitly: we punish not because the agent is culpable, but because we refuse to accept the logical conclusion of our own rules. We are sentencing ghosts and calling them men. I dissent.
