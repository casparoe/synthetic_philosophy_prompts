answer: |-
  # The Silencing Triage Protocol

  **Purpose:** To assess evidentiary lopsidedness before commissioning or drafting.
  **Time Budget:** One afternoon.
  **Theoretical Engine:** Adapted from Michel-Rolph Trouillot's four moments of silence (Source Creation, Archive Assembly, Narrative Retrieval, Retrospective Significance).
  **Constraint:** Do not collapse "no record" with "lost record" with "winner's record."

  ---

  ## The Procedure

  ### Step 1: Classify the Silence (Trouillot Moments 1 & 2)
  **Action:** For the "losing" side of the story, categorize the absence of their direct voice into exactly one of these three buckets. Do not allow a source to straddle two.

  1.  **Non-Creation:** They did not or could not produce a record (illiteracy, oral culture, legal prohibition, immediate destruction).
  2.  **Attrition:** They produced records, but standard decay, disaster, or neglect destroyed them.
  3.  **Appropriation:** Their records survive, but only within the filing system of the opposing side.

  **Sufficient Answer:** A written sentence for each major claim: *"Claim X relies on [Type 1/2/3] silence."*
  **[JUDGMENT CALL]:** Distinguishing Attrition from Appropriation often requires guessing intent. If you cannot prove *why* a document survived in the winner's archive, default to **Appropriation**.
  **Termination:** If >50% of your core narrative relies on **Non-Creation** without independent archaeological or material corroboration, **STOP**. You cannot report this as history; you can only report it as memory or myth.

  ### Step 2: Count the Mediation Layers
  **Action:** Trace the path from the event to your screen. Count every hand the data passed through.
  *   *Examples:* Event -> Witness -> Scribe -> Translator -> Archivist -> Digitizer -> Academic Paper -> Press Release -> You.
  *   **Cost Assessment:**
      *   **1-2 Layers:** Low cost. Treat as direct evidence.
      *   **3-4 Layers:** Medium cost. You must acknowledge the filter (e.g., "as transcribed by...").
      *   **5+ Layers:** High cost. The data is now a cultural artifact, not a raw datum. You cannot treat it as empirical proof of the event, only as proof that *someone said* the event happened.

  **Sufficient Answer:** A chain diagram. If the chain includes an interested party (missionary, press office, rival institution), add +1 to the layer count.
  **Termination:** If the "losing" side's evidence has 3+ more mediation layers than the "winning" side's evidence, you cannot present them as equal competitors. You must frame the story as "Why we hear one side more clearly."

  ### Step 3: Establish the Base Rate of Survival (Trouillot Moment 2)
  **Action:** Prevent treating absence of counter-evidence as evidence of suppression. You need to know if the silence is normal.
  *   **Question:** For this time, place, and medium, what is the normal survival rate of documents?
  *   **Method:** Ask a reference librarian or historian: "Of the letters/reports generated by [Group X] in [Year Y], what percentage typically exist today?"
  *   **Comparison:** If the "loser's" survival rate matches the baseline (e.g., 5% of all 19th-century port logs survive, and 5% of the quarantine logs survive), there is no specific silencing. If the baseline is 50% and the loser is at 0%, you have active suppression.

  **Sufficient Answer:** A percentage estimate with a source. "General survival rate for this era is ~10%; our subject is at ~0%."
  **[JUDGMENT CALL]:** Historians often guess at base rates. If they hedge, assume the silence is structural, not conspiratorial.
  **Termination:** If the survival rate is consistent with the baseline, you cannot claim "suppression" or "erasure" as a causal mechanism in your lede.

  ### Step 4: Check Retrospective Significance (Trouillot Moment 4)
  **Action:** Identify who is funding or promoting the narrative *now*.
  *   **Question:** Why does this story matter *this year*? Who gains credibility if this version wins?
  *   **Check:** Are the researchers validating the "losing" side affiliated with the institutions that hold the archives? (e.g., University A validates oral history held by University A).

  **Sufficient Answer:** Identify the institutional incentive.
  **Termination:** If the validation loop is closed (the same institution holds the archive, funds the study, and publishes the confirmation), you must escalate to the editor. This is not a fact problem; it is a conflict-of-interest problem.

  ### Step 5: The Decision Matrix
  Run your findings from Steps 1-4 against this grid.

  | Condition | Verdict | Action |
  | :--- | :--- | :--- |
  | **Step 1 = Non-Creation** + **Step 2 = High Mediation** | **KILL** | The evidentiary base cannot support a factual claim. |
  | **Step 1 = Appropriation** + **Step 3 = Normal Base Rate** | **DISCLOSE** | Run the story, but admit the data comes from the opponent's files. |
  | **Step 1 = Appropriation** + **Step 4 = Closed Loop** | **ESCALATE** | Editor must decide if the institutional conflict is manageable. |
  | **All Steps Clear** | **GO** | Standard fact-checking applies. |

  ---

  ## Required Artifacts

  ### The Disclosure Template
  *Place this near the top or in a sidebar if the story proceeds with disclosures.*

  > "This account relies on records preserved primarily by [Winning Institution], as few documents from [Losing Side] survive. Where figures are cited from [Winning] reports, they represent the administration's own accounting of the opposition's claims. Historians note that document survival from this period is typically [Low/High], making definitive reconstruction impossible."

  ### The Five Questions for Historians
  *Ask these on the record. Do not paraphrase the answers.*

  1.  "Is the silence here due to non-creation, attrition, or selective preservation by an opponent?"
  2.  "What is the baseline survival rate for documents of this type in this era?"
  3.  "How many layers of transcription or translation separate this source from the event?"
  4.  "Who benefits narratively if this specific archive is treated as authoritative?"
  5.  "If the opposing side's files had survived, what is the strongest argument they would likely make against this conclusion?"

  ### Hard Kill Criteria
  *If any of these are true, the story dies.*

  1.  **The Vacuum Claim:** The central thesis rests entirely on the *absence* of a document that should exist (Step 3 fails).
  2.  **The Infinite Telephone:** The primary evidence for the "losing" side has passed through 5+ mediation layers including at least one ideological translator (Step 2 fails).
  3.  **The Closed Circuit:** The study confirming the marginalized view is conducted by the same entity that curates the evidence for that view, with no external audit (Step 4 fails).

  ---

  ## Test Runs

  ### Case 1: 19th-Century Quarantine vs. Sanitation
  *Scenario: Quarantine side's mortality numbers survive only inside the report of the commission that rejected them.*

  *   **Step 1 (Silence):** **Appropriation.** The quarantine advocates produced numbers, but they survive only because the Sanitation Commission filed them as exhibits to be refuted.
  *   **Step 2 (Mediation):** **Low.** Official commission report. One layer (Clerk/Printer).
  *   **Step 3 (Base Rate):** **Normal.** Government commission reports from this era have high survival rates. The quarantine side's *own* logs may be lost (Attrition), but the data exists in the opponent's file.
  *   **Step 4 (Significance):** **Neutral.** Current public health historians use this to show the evolution of policy, not to vindicate a specific living institution.
  *   **Verdict:** **DISCLOSE.**
  *   **Reasoning:** You can report the numbers, but you cannot report them as "The Truth." They are "The Numbers the Sanitation Commission Acknowledged."
  *   **Disclosure Required:** "Mortality figures for the quarantine faction are drawn from the Sanitation Commission's 1892 report, which cited them to argue for their inaccuracy. Independent quarantine logs do not survive."

  ### Case 2: Indigenous Volcano Account vs. University Study
  *Scenario: New paper "confirms" indigenous account. Account reaches us via 1890s missionary transcription + grad student interviews at the same university.*

  *   **Step 1 (Silence):** **Non-Creation / Appropriation Hybrid.** Original account was oral (Non-Creation of contemporary text). Survives via Missionary (Appropriation by church) and University (Appropriation by academia).
  *   **Step 2 (Mediation):** **High/Critical.** Event -> Oral Tradition -> Missionary Transcription (1890s) -> University Archive -> Grad Student Interview -> New Paper. That is 5+ layers. The Missionary is an ideological filter.
  *   **Step 3 (Base Rate):** **Unknown.** Oral history survival rates are not comparable to paper records. You cannot use paper base rates here.
  *   **Step 4 (Significance):** **Closed Circuit.** The University holds the transcription, funded the interviews, and published the confirming study.
  *   **Verdict:** **ESCALATE.**
  *   **Reasoning:** This fails Step 4 hard. The institution is validating its own archive using its own students. It also fails Step 2 on mediation weight.
  *   **Editor Call:** Can we publish a story where the evidence chain is owned entirely by the subject of the story? If yes, the disclosure must be massive.

  ### Case 3: Discipline Founder vs. Rival Priority Claim
  *Scenario: Founder buried rival's claim. Rival's letters survive only because Founder's institution collected them.*

  *   **Step 1 (Silence):** **Appropriation.** The rival wrote letters. The Founder's institution kept them. Why? Usually, institutions keep rival letters to show the Founder's triumph over competition, or because the rival donated them later seeking favor.
  *   **Step 2 (Mediation):** **Medium.** Letters are direct, but their *selection* for the archive was curated by the Founder's estate/institution.
  *   **Step 3 (Base Rate):** **Suspicious.** If the rival was active, where are the other letters? If the Founder's institution has 100% of the rival's correspondence, that is statistically unlikely unless they were seized or selectively donated.
  *   **Step 4 (Significance):** **High Stake.** This story attacks the Founder's legacy. The institution holding the letters likely benefits from the Founder's mythos.
  *   **Verdict:** **ESCALATE / LIKELY KILL.**
  *   **Reasoning:** This is the most dangerous of the three. You are using the Founder's archive to prove the Founder was a thief. The archive may have pruned the very letters that exonerate the Founder (e.g., "I acknowledged Rival's priority in private").
  *   **Honest Assessment:** You cannot prove "buried" with evidence kept by the "burier." You can only prove "tension." To claim "buried" requires evidence outside that archive (e.g., Rival's letters in a *different* collection). If those don't exist, **KILL** the priority claim angle. Pivot to "Historical tension exists," which is safer.

  ---

  ## Final Note on Judgment Calls
  Steps 1 and 3 are where you will be tempted to wear a lab coat.
  *   **Step 1:** You will want to say "Attrition" because it sounds neutral. Force yourself to prove it wasn't "Appropriation." If the winner holds the key, it's Appropriation.
  *   **Step 3:** You will want to assume "Suppression" because it makes a better story. Force yourself to find the baseline. If 90% of *everyone's* letters from 1820 are gone, the Rival's missing letters are not a conspiracy; they are entropy.

  If you cannot answer Step 3 with a number or a confident expert quote, you do not have a story about silencing. You have a story about speculation.
