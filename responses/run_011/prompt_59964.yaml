answer: |-
  # Problem 2: Larkspur County (25 Marks)

  **Scenario:** Larkspur County must decide, for each defendant, whether to hold them in custody before trial. An instrument assigns every defendant a score $S$ taking one of three ordered bands, $S \in \{1, 2, 3\}$, with 3 the highest. Defendants belong to one of two populations, A and B, distinguished by a legally protected attribute. Let $Y = 1$ if the defendant is rearrested within twelve months of release, and $Y = 0$ otherwise. Over one year the instrument produced the following counts.

  **Group A:** $S = 1$, 400 defendants, of whom 40 were rearrested. $S = 2$, 400 defendants, of whom 200 were rearrested. $S = 3$, 200 defendants, of whom 180 were rearrested.
  **Group B:** $S = 1$, 600 defendants, of whom 60 were rearrested. $S = 2$, 300 defendants, of whom 150 were rearrested. $S = 3$, 100 defendants, of whom 90 were rearrested.

  The county acts on the score by choosing a cut point: it holds a defendant if and only if $S \geq k$, for $k \in \{1, 2, 3, 4\}$, where $k = 4$ corresponds to holding no one and $k = 1$ to holding everyone. The same cut point is currently applied to both groups.

  **Definitions:**
  *   **Base Rate:** The proportion of defendants in a group with $Y=1$.
  *   **True Positive Rate (TPR):** The proportion of rearrested defendants ($Y=1$) who are held.
  *   **False Positive Rate (FPR):** The proportion of non-rearrested defendants ($Y=0$) who are held.
  *   **Positive Predictive Value (PPV):** The proportion of held defendants who are rearrested.

  **(a) [8 marks]** Compute the overall rearrest rate (Base Rate) for each group and the rearrest rate within each score band. State precisely what it amounts to that these within-band rates coincide across the two groups. Then, compute the PPV, TPR, and FPR for each group at each of the four cut points. Report which cut point(s) make PPV equal across groups and which make both error rates (TPR and FPR) equal across groups.

  **(b) [10 marks]** Show that the pattern found in (a) is forced rather than accidental. Express PPV as a function of TPR, FPR, and the group's Base Rate. Derive from that expression the general condition under which a decision rule that equalizes both error rates across two groups with different Base Rates also equalizes PPV. Use the derivation to say what would have to be true of the instrument, or of the two groups, for a non-degenerate rule to satisfy both families of criteria at once, and explain what is degenerate about the rules that satisfy equalized odds in the county's own data. Finally, give a definite answer, with reasons, to whether allowing group-specific cut points, or allowing the rule to randomize within a score band, enlarges the set of rules available to Larkspur County in this case.

  **(c) [7 marks]** Say what further premises, none of them statistical, are needed to move from the grid in (a) to the conclusion that one admissible rule rather than another is unjust to one of the two groups. Second, note that $Y$ records rearrest rather than offending. Distinguish, as carefully as you can, what in the analysis of (a) and (b) survives and what does not if rearrest systematically overstates or understates offending in one group relative to the other because of how enforcement is distributed; say whether any of the criteria discussed retains its claim to measure what it purports to measure.

  ***

  # Model Answer

  **Part (a)**
  The overall rearrest rate (Base Rate) for Group A is $420/1000 = 0.42$. For Group B, it is $300/1000 = 0.30$.
  Within score bands:
  $S=1$: A ($40/400 = 0.10$), B ($60/600 = 0.10$).
  $S=2$: A ($200/400 = 0.50$), B ($150/300 = 0.50$).
  $S=3$: A ($180/200 = 0.90$), B ($90/100 = 0.90$).
  That these rates coincide means the score is **calibrated**: a given score carries the same risk information regardless of group membership.

  The decision metrics for each cut point $k$ are:

  | Group | Cut Point ($k$) | Held | Rearrested (TP) | Not Rearrested (FP) | PPV | TPR | FPR |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **A** | 1 (All) | 1000 | 420 | 580 | 0.42 | 1.00 | 1.00 |
  | **A** | 2 (2,3) | 600 | 380 | 220 | 0.63 | 0.90 | 0.38 |
  | **A** | 3 (3) | 200 | 180 | 20 | 0.90 | 0.43 | 0.03 |
  | **A** | 4 (None)| 0 | 0 | 0 | - | 0.00 | 0.00 |
  | **B** | 1 (All) | 1000 | 300 | 700 | 0.30 | 1.00 | 1.00 |
  | **B** | 2 (2,3) | 400 | 240 | 160 | 0.60 | 0.80 | 0.23 |
  | **B** | 3 (3) | 100 | 90 | 10 | 0.90 | 0.30 | 0.01 |
  | **B** | 4 (None)| 0 | 0 | 0 | - | 0.00 | 0.00 |

  PPV is equal across groups at $k=3$ (0.90). Both error rates (TPR and FPR) are equal across groups only at the degenerate cut points $k=1$ and $k=4$.

  **Part (b)**
  By definition, $PPV = \frac{TP}{TP + FP}$. Dividing numerator and denominator by the total number of defendants in the group ($N$), we get:
  $$PPV = \frac{TP/N}{(TP/N) + (FP/N)}$$
  We know $TP/N = TPR \times P(Y=1)$ and $FP/N = FPR \times P(Y=0)$. Let $R = P(Y=1)$ be the Base Rate. Then $P(Y=0) = 1-R$. Substituting these in:
  $$PPV = \frac{TPR \cdot R}{TPR \cdot R + FPR \cdot (1-R)}$$
  Suppose a rule equalizes error rates across groups A and B, so $TPR_A = TPR_B$ and $FPR_A = FPR_B$. For PPV to also be equal ($PPV_A = PPV_B$), the expression above must yield the same value for both groups. Since TPR and FPR are identical, the only remaining variable is $R$. Thus, PPV equality requires $R_A = R_B$.

  In Larkspur County, $R_A = 0.42$ and $R_B = 0.30$. Because the Base Rates differ, no non-degenerate rule can equalize both error rates and PPV simultaneously. The rules that satisfy equalized odds ($k=1, 4$) are degenerate because they provide no discriminatory information: holding everyone or no one renders the instrument useless.

  Allowing group-specific cut points does not solve this. Changing $k$ alters TPR and FPR, but it does not alter the Base Rates $R_A$ and $R_B$. The algebraic constraint remains: if error rates are matched, PPV must differ. Similarly, randomizing within a score band creates a weighted average of the band's metrics. It allows intermediate values of TPR and FPR, but it does not change the Base Rates. Therefore, the set of rules satisfying both criteria simultaneously remains empty.

  **Part (c)**
  To conclude that a statistical disparity constitutes injustice, one needs normative premises linking specific metrics to moral rights. For example, one must premise that "equal error rates are required for equal treatment" or "equal predictive value is required for due process." The statistics alone show incompatibility, not injustice.

  Regarding measurement: $Y$ is rearrest, not offending. If enforcement is biased such that Group A is policed more heavily, $R_A$ may overstate true offending relative to $R_B$. If so, the Base Rate difference is an artifact of enforcement, not risk. In this case, Calibration (within-band rates) might still hold technically, but it calibrates to biased policing rather than culpability. Consequently, PPV measures the probability of *rearrest*, not *guilt*. Equalizing PPV might merely equalize exposure to biased enforcement. TPR and FPR similarly measure detection rates, not failure rates. If the label $Y$ is corrupted, no criterion based on $Y$ retains its claim to measure fairness regarding offending; they merely measure consistency in processing biased data.

  ***

  # Marking Scheme

  **Must-Hit Moves (25 Marks Total)**

  1.  **Correct Base Rates and Calibration Interpretation (4 marks):** Must calculate 0.42 and 0.30 correctly and identify within-band coincidence as score calibration.
      *   *Typical Botch:* Calculating rates correctly but failing to name or define the property of within-band coincidence.
  2.  **Accurate Grid Computation (6 marks):** All 12 non-degenerate metric values (PPV, TPR, FPR for $k=1,2,3$) must be correct within rounding.
      *   *Typical Botch:* Confusing denominators for FPR (using total held instead of total non-rearrested).
  3.  **Identification of Equalities (2 marks):** Must identify $k=3$ for PPV equality and $k=1,4$ for Error Rate equality.
      *   *Typical Botch:* Claiming $k=2$ satisfies any equality condition.
  4.  **Algebraic Derivation (5 marks):** Must derive $PPV = f(TPR, FPR, R)$ and show $TPR_A=TPR_B \land FPR_A=FPR_B \implies (PPV_A=PPV_B \iff R_A=R_B)$.
      *   *Typical Botch:* Asserting the relationship verbally without showing the algebraic dependency on Base Rate.
  5.  **Degeneracy and Remedy Analysis (4 marks):** Must identify $k=1,4$ as degenerate/useless and explain why group-specific cuts/randomization fail to alter Base Rates.
      *   *Typical Botch:* Proposing group-specific cut points as a remedy without checking their effect on predictive value or base rates.
  6.  **Normative and Measurement Critique (4 marks):** Must distinguish statistical incompatibility from moral injustice and analyze the impact of biased labels on criterion validity.
      *   *Typical Botch:* Treating the rearrest label as unproblematic throughout the normative analysis.

  **Specific Errors to Penalize**
  *   **Miscalibration Claim:** Deduct 2 marks if the candidate reports that the instrument is simply miscalibrated and needs fixing (the data shows it is calibrated).
  *   **Inherited Calibration:** Deduct 2 marks if the candidate assumes that because the score is group-calibrated band by band, any group-blind cut point inherits that property (PPV diverges).
  *   **Degenerate Resolution:** Deduct 3 marks if the candidate presents holding everyone or holding no one as a genuine resolution of the conflict rather than a degenerate one.
  *   **Arbitrary Conclusion:** Deduct 2 marks if the candidate concludes from the impossibility of joint satisfaction that the choice is therefore arbitrary or that fairness is an illusion.
  *   **Label Validity:** Deduct 2 marks if the candidate fails to distinguish rearrest from offending in Part (c).

  **Grading Boundary**
  A passing answer computes the grid correctly and notes the conflict but treats the impossibility as a technical glitch or defaults to a degenerate solution. A full-mark answer derives the algebraic necessity of the conflict, rejects degenerate solutions as substantively empty, and critically isolates the normative premises and measurement validity issues required to make a moral judgment.
