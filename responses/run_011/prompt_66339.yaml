prompt: |-
  Argued with a friend till 2am about whether norms like dueling or footbinding actually died because someone finally won the argument, or because they stopped being honorable — he's an Appiah person, I think honor gets credit for alot of what is just ordinary self-interest shifting. We didn't settle it and honestly I don't care that much about the 19th century, but I want to use the argument at work.

  I run a four-person team at a regional nonprofit that partners with community groups trying to kill a norm that's hurting people: families not calling an ambulance for an overdose because it'd be a disgrace on the house, a building trades local where filing a safety complaint makes you a rat, tenants not reporting a slumlord. We get maybe ten requests a year and can take three, and a badly run campaign makes the norm stickier, so the intake decision is basically the whole job. Right now we decide by gut plus whoever has the best grant writer. Nobody on my team has read any of this literature and nobody has a social science degree.

  Give me a diagnostic procedure we could actually run in a two-hour intake meeting: the questions in order, what counts as a real answer to each rather than it's complicated, and how to tell whether the thing holding a norm up is what people believe, what pays, or what earns respect — plus which lever each diagnosis implies. Mark where it should output decline or not-yet, where it hands the call to me because it's values not facts, and which steps are judgment wearing a flowchart costume. Then run it on two of my cases, and one of them has to come out against us, like where the only lever that works is one my board or the funder would refuse.

  Last thing: be straight about what breaks when you point a theory built on century-scale national practices at a two-year neighborhood problem.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** The user runs a 4-person nonprofit team tackling harmful social norms (ambulance stigma, safety "ratting," slumlord reporting). They have limited capacity (10 requests, 3 slots). Current selection process is ad hoc (gut + grant writing).
      *   **The Conflict:** The user had a 2 AM debate with a friend about Appiah's theory of honor vs. self-interest in norm change (did dueling/footbinding end because of argument/honor or material shift?). The friend sides with Appiah (honor drives it); the user suspects self-interest plays a bigger role.
      *   **The Goal:** Create a practical, 2-hour diagnostic procedure for intake meetings based on this theoretical debate (Honor vs. Interest vs. Belief).
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for "real answers" (no "it's complicated").
          *   Diagnosis of the norm's driver (Belief, Payoff, Respect).
          *   Implied levers for each diagnosis.
          *   Markers for "Decline/Not-Yet," "Escalate to Director (Values)," and "Judgment in Flowchart Clothing."
          *   Run the diagnostic on two cases (one must result in a "No Go" due to funder/board constraints).
          *   Critique the application of macro-theory (century-scale) to micro-practice (2-year neighborhood).
      *   **Tone:** Straight, practical, slightly cynical/realistic (matching the user's "honestly I don't care that much about the 19th century" vibe), actionable.

  2.  **Deconstruct the Theory (Appiah vs. Materialism):**

      *   *Appiah (Honor/Status):* Norms change when the *social meaning* shifts. People stop dueling not because it's expensive, but because it becomes cowardly *not* to stop, or because duelists are seen as brutes rather than gentlemen. Key mechanism: Social sanctions/rewards.
      *   *Materialist/Self-Interest:* Norms change when the *cost/benefit* shifts. Footbinding stopped because industrialization made women's labor valuable outside the home, or laws made it illegal/risky. Key mechanism: Incentives/Punishments.
      *   *Belief/Information:* Norms persist due to false beliefs (e.g., "ambulance = arrest"). Key mechanism: Education/Correction.
      *   *The User's Insight:* Most people blame "Belief" when it's actually "Honor" or "Interest."

  3.  **Drafting the Diagnostic Procedure (The "Norm Autopsy"):**

      *   *Constraint:* 2 hours. Needs to be tight.
      *   *Structure:* Needs to separate the three drivers (Belief, Interest, Honor).
      *   *Step 1: The Behavior Map.* What exactly happens? (Fact-finding).
      *   *Step 2: The Deviance Test.* What happens if someone breaks the norm? (Distinguishes Interest vs. Honor).
      *   *Step 3: The Payoff Audit.* Who gains/loses materially? (Distinguishes Interest).
      *   *Step 4: The Audience Check.* Who is watching? (Distinguishes Honor).
      *   *Decision Rules:* Clear criteria for Go/No-Go/Escalate.

  4.  **Refining the Questions & Criteria:**

      *   *Question 1 (Behavior):* "Describe the exact moment the norm bites." *Bad answer:* "People are scared." *Good answer:* "The brother sees the blue lights and tells the driver to turn around."
      *   *Question 2 (Sanctions):* "If someone calls 911, what happens *socially*?" *Bad answer:* "People get mad." *Good answer:* "Auntie won't speak to them for a month; they are labeled 'unloyal'." (This points to Honor).
      *   *Question 3 (Material):* "What is the concrete cost?" *Bad answer:* "It's expensive." *Good answer:* "They lose their lease" or "They get blacklisted from the union." (This points to Interest).
      *   *Question 4 (Belief):* "Do they know the rule is harmful?" *Bad answer:* "They don't know better." *Good answer:* "They know the medicine saves lives, but value loyalty more." (This rules out simple education).

  5.  **Developing the Levers:**

      *   *If Belief:* Education, myth-busting. (Easy, often wrong diagnosis).
      *   *If Interest:* Insurance, legal protection, anonymity, compensation.
      *   *If Honor:* Status flipping, new heroes, public shaming of the *old* norm, recruiting high-status community members.

  6.  **Creating the "Stop/Go/Escalate" Markers:**

      *   *Decline:* No clear sanction mechanism, problem is purely individual psychology, or the "norm" is actually just poverty (no social pressure).
      *   *Escalate (Values):* The solution requires breaking the law, violence, or violating the nonprofit's own ethics (e.g., paying people to break norms).
      *   *Judgment in Flowchart:* Deciding if a sanction is "strong enough" to matter.

  7.  **Running the Cases:**

      *   *Case 1 (The "No Go"):* Tenants vs. Slumlord.
          *   *Diagnosis:* It's not belief (they know it's bad). It's not just honor (they don't care about status). It's *Material Interest* (eviction/retaliation).
          *   *Lever:* Legal protection/anonymous reporting.
          *   *Constraint:* Board/Funder won't support "legal defense fund" or "anonymous tip line" that undermines property rights/landlord relations. -> **Decline.**
      *   *Case 2 (The "Go"):* Construction Safety ("Ratting").
          *   *Diagnosis:* Honor/Solidarity. Calling safety is "betraying the brotherhood."
          *   *Lever:* Reframe safety as "protecting the crew" (Honor flip).
          *   *Verdict:* **Go.**

  8.  **Addressing the Macro/Micro Critique:**

      *   Appiah talks about *centuries* and *nations*. The user is talking about *2 years* and *one neighborhood*.
      *   *What breaks:* Time horizons, ability to shift "global" status, scale of sanctions. You can't change "Honor" in 24 months easily. You might need to hack it (bribe status) rather than change it.
      *   *Honesty:* Acknowledge that theory is a map, not the territory.

  9.  **Review and Refine:**

      *   *Tone Check:* Is it too academic? Needs to be punchier. Use "Norm Autopsy" framing.
      *   *Constraint Check:* Did I mark the "Judgment wearing a flowchart costume" parts? Yes.
      *   *Constraint Check:* Did I ensure one case fails due to funder constraints? Yes (Slumlord case).
      *   *Constraint Check:* Is the distinction between Honor, Interest, and Belief clear? Yes.

  10. **Final Polish:** Ensure the distinction between Appiah's "Honor" and simple "Social Pressure" is clear. Honor is about *identity* and *status*, not just fear of gossip. (Self-Correction: Make sure the diagnostic distinguishes between "I'll get beaten up" [Interest/Safety] and "I'll be a pariah" [Honor]).

      *(Self-Correction during drafting)*: Wait, the prompt asks for "Judgment wearing a flowchart costume." I need to explicitly label where the procedure pretends to be objective but is actually a value call.
      *(Self-Correction on Case 1)*: Make sure the reason for rejection is specifically the *lever* required vs. funder constraints, not just "it's too hard."

      *(Final thought on the Critique)*: Be sharp. Appiah explains why dueling died in 1850, not why a specific Bronx housing complex doesn't call 911 in 2024. The scale mismatch is the danger.

  11. **Drafting the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is the diagnostic procedure. It is designed to force your team to stop treating "culture" as a foggy cloud and start treating it as a mechanism with gears.

  ### The Norm Autopsy (2-Hour Intake Protocol)

  **Goal:** Determine if the harmful behavior is sustained by *Ignorance* (Belief), *Incentive* (Interest), or *Identity* (Honor).
  **Output:** A specific lever to pull, or a reason to walk away.

  #### Phase 1: The Behavior Map (30 Mins)
  *Stop talking about "the community." Talk about specific actors.*

  **Q1: Who exactly is the "Audience" that matters?**
  *   **Bad Answer:** "The neighborhood," "Society," "People."
  *   **Real Answer:** "The other guys on the crew," "The matriarch of the family," "The shop steward."
  *   **Why:** Norms don't exist in the air; they exist between specific people. If you can't name the audience, you can't change the norm.

  **Q2: What is the specific act of deviance?**
  *   **Bad Answer:** "Doing the right thing," "Calling for help."
  *   **Real Answer:** "Dialing 911 while the body is still warm," "Filing an OSHA form before the shift ends."
  *   **Why:** Vague virtues don't compete with specific habits.

  **Q3: What is the immediate consequence of deviance?**
  *   **Bad Answer:** "They get in trouble," "It's awkward."
  *   **Real Answer:** "He gets fired by Friday," "She isn't invited to Sunday dinner," "His truck tires get slashed."
  *   **Why:** This separates *Interest* (fired/truck) from *Honor* (dinner/invitation).

  > **⚠️ Judgment in Flowchart Costume:** If the team cannot agree on Q1 (The Audience), **STOP**. You are diagnosing a demographic, not a norm. Decline the case. You cannot fix "everyone."

  #### Phase 2: The Driver Diagnosis (45 Mins)
  *Force a choice. No "it's a mix." Pick the dominant engine.*

  **Q4: If we guaranteed total anonymity and zero material cost, would they still do it?**
  *   **Yes:** It's **Belief**. They genuinely think the ambulance kills people or the safety rule is unnecessary.
      *   *Lever:* Education, myth-busting, data.
  *   **No:** It's **Interest** or **Honor**. Proceed to Q5.

  **Q5: If they deviate, do they lose *resources* or *status*?**
  *   **Resources (Money, Housing, Job, Safety):** It's **Interest**.
      *   *Lever:* Insurance, legal shields, compensation, structural protection.
  *   **Status (Respect, Belonging, Identity, "Good Person" standing):** It's **Honor**.
      *   *Lever:* Status flipping, recruiting high-status norm entrepreneurs, shaming the *old* behavior.

  **Q6: Who benefits materially from the norm staying in place?**
  *   **Bad Answer:** "The system," "Patriarchy."
  *   **Real Answer:** "The landlord saves on repairs," "The contractor meets the deadline bonus," "The family avoids police scrutiny."
  *   **Why:** If a powerful actor benefits materially, an Honor-based campaign will fail unless you neutralize their power.

  > **⚠️ Escalate to Director (Values):** If the only viable lever to fix an **Interest** problem requires breaking the law (e.g., hiding evidence, bribing officials) or violates your nonprofit's risk policy, bring it to me. Do not decide this in the room.

  #### Phase 3: The Feasibility Stress Test (45 Mins)

  **Q7: Is there a "Status Entrepreneur" available?**
  *   **Requirement:** We need one person the Audience respects who is willing to publicly break the norm.
  *   **Real Answer:** "The foreman who survived a fall," "The grandmother who lost a son."
  *   **No Go:** If the only people willing to speak are outsiders (us) or low-status victims.

  **Q8: Can we change the payoff within 24 months?**
  *   **Reality Check:** Honor shifts take generations (Appiah's point). Interest shifts can happen overnight (law changes).
  *   **Real Answer:** "We can get the union to endorse safety cards by Q3."
  *   **No Go:** "We need to change how the neighborhood views police." (Too big, too slow).

  > **⚠️ Judgment in Flowchart Costume:** Deciding if 24 months is enough time for an Honor shift is a guess. If the team says "Yes" without a specific Status Entrepreneur (Q7), they are lying. Mark this as **High Risk**.

  #### Phase 4: The Decision Matrix

  | Diagnosis | Required Lever | Decline If... |
  | :--- | :--- | :--- |
  | **Belief** | Information Campaign | You can't access the communication channel. |
  | **Interest** | Material Protection | **Funder/Board won't pay for legal/financial shields.** |
  | **Honor** | Status Reframing | No internal "Status Entrepreneur" exists. |

  ---

  ### Case Run-Throughs

  #### Case A: Tenants vs. The Slumlord
  *Request:* Tenants in a 40-unit building won't report code violations (mold, no heat) because "snitches get evicted."
  *   **Q1 Audience:** The landlord (power) and other tenants (fear of retaliation if one leaves and rent goes up).
  *   **Q3 Consequence:** Eviction, blacklisting from future housing.
  *   **Q4 Anonymity:** Even with anonymity, they fear the landlord will know (small building).
  *   **Q5 Driver:** **Interest**. This is about housing security and income, not honor. They don't think reporting is *dishonorable*; they think it's *suicidal*.
  *   **Q6 Beneficiary:** Landlord saves money on repairs.
  *   **Required Lever:** Legal defense fund + guaranteed relocation housing if retaliation occurs.
  *   **Constraint Check:** Our board is comprised of local property developers. Our primary funder has a "neutral landlord relations" clause. They will not fund litigation support or relocation guarantees.
  *   **Decision:** **DECLINE.**
  *   **Reason:** The diagnosis is **Interest**, but the only lever that works (material protection) is blocked by our own governance. An Honor campaign ("Be a proud tenant!") will get people evicted. We cannot take this.

  #### Case B: Construction Local 404 ("Don't Rat")
  *Request:* Workers won't file safety complaints even after near-misses. "We take care of our own."
  *   **Q1 Audience:** The crew, the foreman, the union rep.
  *   **Q3 Consequence:** Social ostracization, labeled "weak," passed over for overtime.
  *   **Q4 Anonymity:** Even if anonymous, they fear being "the type of guy who would file."
  *   **Q5 Driver:** **Honor**. It's about solidarity and masculinity. Filing is a betrayal of the brotherhood.
  *   **Q6 Beneficiary:** The contractor (speed over safety).
  *   **Status Entrepreneur:** A respected journeyman who lost a finger last year and now advocates for guards.
  *   **Required Lever:** Reframe safety reporting as "protecting the crew" (Honor Flip). Make the *unsafe* worker the liability to the brotherhood.
  *   **Decision:** **GO.**
  *   **Reason:** We have a Status Entrepreneur. The lever (reframing identity) fits our skillset. The timeline (2 years) is tight but possible for a specific crew culture.

  ---

  ### The Theory/Practice Gap (What Breaks)

  You asked for straight talk on applying Appiah to a 2-year neighborhood grant. Here is where the theory breaks:

  1.  **Time Compression:** Appiah writes about the *end* of footbinding or dueling. These took 50-80 years of elite signaling, economic shifts, and generational turnover. You have 24 months. You cannot *change* honor in that time; you can only *hack* it. You aren't looking for norm death; you're looking for norm suspension. If you promise a "norm change" in your grant report, you are lying.
  2.  **Scale of Audience:** Appiah's "Honor" relies on a cohesive elite class (British Gentlemen, Chinese Gentry) whose opinion matters nationwide. In a Bronx housing project or a single trades local, the "Audience" is 50 people. If the one guy who controls the overtime (the Foreman) doesn't buy in, the "Honor" shift doesn't matter. Macro theory assumes distributed status; micro practice is often a dictatorship.
  3.  **The "Interest" Blindspot:** Appiah loves to argue that Honor drives history. In your work, **Interest is usually the bouncer, and Honor is just the decoration.** People will say "It's disrespectful to call the cops" (Honor), but they mean "The cops will deport my uncle" (Interest). If you run an Honor campaign on an Interest problem, you get people hurt. Your diagnostic must be biased toward finding the Material Interest first.
  4.  **The Exit Option:** In the 19th century, you couldn't easily leave the class structure. In your cases, people can move, quit the job, or leave the family. If the cost of the norm is too high, they exit rather than fight. Appiah assumes people stay and fight for the norm's meaning. Your clients might just leave.

  **Final Instruction to Team:**
  Use the Autopsy to kill bad ideas early. If the diagnosis is **Interest** and we don't have the money to fix the Interest, we walk. It is better to fund three Honor fights we can win than one Interest fight that gets our clients evicted.
