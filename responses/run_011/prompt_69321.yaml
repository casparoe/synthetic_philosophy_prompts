prompt: |-
  I've been the only intake person at a small housing-counseling nonprofit for six years — families come in facing eviction or some mess with a landlord, and I figure out what's actually going on, what they're eligible for, and what order to do things in, because half the time the thing they walk in asking for is the third-most useful thing I could help with. Our new director wants to triple the caseload without hiring another me, and her plan is: a pool of part-timers does the first interview off a script I write, two of them score the write-ups against a rubric I also write, and I move to spot-checking — pulling maybe one file in ten and reading it. After a year of that, the idea is the rubric and the score sheets carry most of the weight and I'm freed up for the weird hard cases. She calls it cloning me. I said yes tentatively, and I've felt off about it ever since, and I can't tell whether that's a real problem or just me not wanting to be replaceable.

  Here's the stuff that keeps circling. When I read one of thier write-ups I can usually tell in about a paragraph whether the eventual decision is going to be a good one — checking their work is way, way faster for me than doing the case myself would have been, and that's basically her whole argument. But a lot of what I actually do isn't spotting facts, it's picking between two bad options for this particular family, and I don't know that's the kind of thing you can put on a scoring sheet without it collapsing into "did you check box 4." Also the part-timers turn over every four months and training them on *why* we do it this way takes three weeks each, so there's a strong pull toward just handing over the checklist and skipping the why — and honestly a couple of them have already asked me what the point of a given step is and I noticed I didn't have a crisp answer, it's more a feel for how the whole thing goes wrong if you skip it. One more thing that bugs me: the score sheet rewards closing cases cleanly, and I can already picture that if we're judged on throughput, the files I recieve will start looking tidy in a way real cases never are.

  So what do I tell her? Is a setup like this actually going to produce decisions as good as the ones I make now, or does something specific get lost when you chop the job into pieces and hand them to people who don't hold the whole thing in their heads — and if something does get lost, is it fixable with a better rubric and better onboarding, or is it structural, the kind of thing that just won't survive being written down and passed around? What conditions should I insist on before I go build it — I keep going back and forth on the spot-check ratio, on whether the part-timers need the reasons and not just the steps, and on who gets to change the rubric once it exists. And the part I most want a straight answer on: six months in, when I'm no longer the one doing the work, how would I actually be able to tell whether what's coming out the other end is as good as what I used to produce, or only looks as good on paper? A friend who works in ops says I'm overthinking it and that any skill you can't write down wasn't a real skill anyway — is he right, and if not, what's wrong with that line?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User Role:** Sole intake person at a small housing-counseling nonprofit (6 years experience).
      *   **Core Skill:** Triage, intuition, navigating complex/ambiguous situations, prioritizing needs vs. requests, making judgment calls between bad options.
      *   **The Proposal:** New Director wants to triple caseload without new full-time hires. Plan: Pool of part-timers does initial interviews (scripted), two score write-ups (rubric), User spot-checks (1 in 10). Goal: "Clone" the User, free them for "weird hard cases."
      *   **User's Feelings:** Tentative yes, but feeling "off." Worried about replaceability vs. genuine systemic flaws.
      *   **Specific Concerns:**
          *   Judgment vs. Checklist: Picking between bad options isn't easily rubric-ized.
          *   Turnover/Training: Part-timers leave every 4 months. Training on "why" takes 3 weeks (too long?), leading to checklist-only compliance. User realizes *they* can't always articulate the "why" crisply (it's intuition/feel).
          *   Incentives: Score sheet rewards "clean closing," but real cases are messy. Risk of gaming the system (tidy files, bad outcomes).
          *   Quality Control: How to measure quality after stepping back?
          *   Friend's Advice: "Any skill you can't write down wasn't a real skill anyway." (User suspects this is wrong).

  2.  **Deconstruct the Core Problem:**
      *   This is a classic "Expert vs. Algorithm/Process" tension.
      *   The Director is applying industrial efficiency logic (Taylorism) to social work/counseling.
      *   The User's skill is *tacit knowledge* (knowing more than you can tell).
      *   The risk is *Goodhart's Law*: "When a measure becomes a target, it ceases to be a good measure."
      *   The friend is wrong. Tacit knowledge is real and critical in high-stakes, ambiguous environments (like housing/eviction).

  3.  **Evaluate the Director's Plan:**
      *   *Strengths:* Scalability, documentation, freeing up the expert for complex cases.
      *   *Weaknesses:* Loss of nuance, high turnover eroding institutional memory, incentive misalignment (throughput vs. outcome), inability to capture "judgment" in a rubric.
      *   *Verdict:* It *can* work, but not as currently designed. It needs guardrails.

  4.  **Address the Specific Questions:**

      *   *Is the friend right?* No. Tacit knowledge is real. Polanyi's Paradox: "We know more than we can tell."
      *   *Will decisions be as good?* Not initially, and not without specific structural fixes. Nuance gets lost in handoffs.
      *   *Is it fixable?* Partially. You can't write down intuition, but you can create feedback loops that correct for its absence.
      *   *What conditions to insist on?*
          *   Spot-check ratio (1 in 10 is too low for high-stakes housing).
          *   Training (Must include "why," even if it takes time).
          *   Rubric ownership (User must control changes).
          *   Metrics (Outcome-based, not just throughput-based).
      *   *How to tell if quality drops in 6 months?* Look at downstream metrics (eviction rates, return clients), not just file tidiness.

  5.  **Drafting the Advice - Section by Section:**

      *   **Validation:** Acknowledge the "off" feeling. It's not imposter syndrome; it's professional intuition detecting risk.
      *   **The Friend's Claim:** Directly refute the "if you can't write it down it isn't real" idea. Use the concept of *Tacit Knowledge*. Explain why housing counseling specifically requires this (ambiguity, stakes, human behavior).
      *   **The Structural Risk:** Explain *Goodhart's Law*. If you measure "clean files," you get clean files, not housed families. The "throughput" incentive is dangerous.
      *   **The "Cloning" Fallacy:** You can't clone judgment. You can only scaffold it. The part-timers are sensors, not deciders.
      *   **Actionable Conditions (The "Deal"):**
          *   *Spot Checks:* 10% is too low for the first year. Suggest a tiered approach.
          *   *Metrics:* Shift from "cases closed" to "stability maintained" (lagging indicators).
          *   *Rubric Control:* User owns the rubric. It's a living document.
          *   *Training:* Don't skip the "why." If turnover is high, record the "why" sessions so new hires watch them immediately.
          *   *Escalation Path:* Part-timers need a low-friction way to say "This doesn't fit the script."
      *   **The 6-Month Test:** How to audit quality.
          *   *Random Audit:* Pull 5 "closed" cases and 5 "denied" cases. Call the clients.
          *   *Return Rate:* Are people coming back with the same problem?
          *   *Partner Feedback:* Ask landlords/courts if the paperwork holds up.
      *   **Career Advice:** Reframe the role. You aren't being replaced; you're being promoted to "Quality Assurance/Training Lead." But protect your value.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Validate the user's expertise (6 years is significant).
      *   Avoid jargon where possible, but use precise terms (Tacit Knowledge, Goodhart's Law) to give them language to use with the Director.
      *   Focus on *outcomes for families*, not just workflow.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Tell them to say no.
      *   *Correction:* Nonprofits are resource-starved. Saying no might kill the program. Better to say "Yes, if..."
      *   *Initial thought:* Suggest hiring more full-time staff.
      *   *Correction:* Director already said no to that. Work within the constraint but highlight the risk.
      *   *Focus:* Make sure to answer the "How do I know in 6 months?" question specifically. That's a key anxiety point.

  8.  **Final Polish:** Check against the user's specific worries (turnover, checklist vs. why, spot-check ratio). Ensure the distinction between "process" and "judgment" is clear. (Proceed to generate output).

  9.  *(Post-computation check)*: Did I address the "friend's" comment? Yes. Did I address the 6-month metric? Yes. Did I address the turnover issue? Yes.

  10. **Final Output Structure:**
      *   Validation (Your gut is right).
      *   The Friend is Wrong (Tacit Knowledge).
      *   The Structural Flaw (Goodhart's Law).
      *   Conditions for Agreement (The "Yes, If...").
      *   The 6-Month Audit (How to measure truth).
      *   Closing encouragement.

  (Proceeds to write response based on these points.)
answer: |-
  Your gut is right. You are not feeling this way because you are protective of your turf; you are feeling this way because you are recognizing the difference between **process** and **judgment**.

  Your friend in ops is wrong. The idea that "any skill you can't write down wasn't a real skill anyway" is a dangerous fallacy, especially in social work. It ignores **tacit knowledge**—the expertise that lives in your nervous system, built from six years of seeing patterns, failures, and exceptions. You know what a lie sounds like. You know when a family is on the verge of crisis versus just disorganized. You know which landlord will negotiate and which will sue. You cannot put that on a scoring sheet.

  If you proceed with the Director's plan exactly as described, you will likely see throughput go up and outcomes go down. The files will look tidier, but families will fall through the cracks.

  Here is the breakdown of why this is risky, how to fix the structure, and how to protect yourself and the clients.

  ### 1. The Structural Flaw: Goodhart's Law
  You already identified this: *"The score sheet rewards closing cases cleanly... the files I receive will start looking tidy in a way real cases never are."*

  This is **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."
  If you measure part-timers on how well they fill out the rubric, they will become excellent at filling out rubrics. They will not become excellent at housing counseling.
  *   **The Risk:** A part-timer will check "Box 4: Landlord Contacted" because they sent an email that went to spam, whereas you would have marked it "incomplete" because you know that landlord ignores emails.
  *   **The Fix:** You cannot measure *activity* (boxes checked); you must measure *outcomes* (did the eviction stop?). But outcomes take months to verify. This creates a lag that makes real-time quality control hard.

  ### 2. The "Cloning" Fallacy
  The Director thinks she is building a machine that replicates you. She is actually building a filter.
  *   **Current State:** You are the processor. You take raw input, apply judgment, and produce output.
  *   **Proposed State:** Part-timers are the filter. They screen out the easy stuff and pass the rest to you.
  *   **The Problem:** If the filter is too coarse (scripted), it will pass "easy" cases that are actually toxic, and block "hard" cases that were actually solvable.
  *   **Turnover:** You noted part-timers leave every four months. Training on the "why" takes three weeks. That means for half their tenure, they are operating on muscle memory without understanding the stakes. If you skip the "why" to save time, you guarantee they will make catastrophic errors on edge cases.

  ### 3. Conditions to Insist On
  You said "yes" tentatively. You can still renegotiate the terms. If you don't, you will be blamed when the quality drops. Here is what you need to demand to make this viable:

  **A. Ownership of the Rubric**
  You must have sole authority to update the rubric and the script. The Director cannot change metrics to boost throughput without your sign-off. The rubric is a living document, not a policy manual. It needs to change as you discover where the part-timers are failing.

  **B. The "Escalation" Valve**
  The part-timers need a low-friction way to say, *"This doesn't fit the script."* If they are punished for flagging a case as "complex," they will force square pegs into round holes. You need a category on their score sheet for "Intuition Flag" that allows them to kick a case to you without penalty, even if the checklist looks complete.

  **C. Spot-Check Ratio & Type**
  One in ten is too low for high-stakes housing work, especially in the first year.
  *   **Insist on:** 1 in 5 for the first six months.
  *   **Crucially:** Do not just spot-check *approved* cases. You must spot-check *denied* or *referred-out* cases. That is where the liability lives. If a part-timer tells a family "you aren't eligible" and they get evicted, that is a disaster. You need to audit the "no" decisions heavily.

  **D. Training on the "Why" (Recorded)**
  You cannot skip the "why." If turnover is high, you need to record your training sessions. New hires watch the "Horror Stories" video on Day 1. They need to hear *why* skipping step 3 leads to a family sleeping in a car. If you don't have time to train them, the plan is understaffed.

  ### 4. How to Tell if Quality is Dropping (The 6-Month Test)
  Your friend says you won't know if the skill was real. You will know. But you have to look at **lagging indicators**, not file quality. In six months, do not look at the score sheets. Look at these three things:

  1.  **The Boomerang Rate:** Are clients coming back within 90 days with the same problem? If yes, the intervention was superficial.
  2.  **Downstream Failures:** Pick 20 "closed successfully" files. Call the clients. Ask: *"Are you still in the unit? Did the landlord take you to court anyway?"* Files look clean; court records do not.
  3.  **Partner Friction:** Ask the legal aid lawyers or court clerks you work with. *"Has the quality of the intake packets changed? Are we missing documents more often?"* They will tell you the truth before the data does.

  ### 5. What to Tell the Director
  You need to frame this not as resistance, but as risk management.

  > "I want this to work, but housing counseling isn't assembly line work. If we optimize for throughput, we will optimize for paperwork, not housing stability. I can build this system, but I need to be the Quality Assurance Lead, not just a spot-checker.
  >
  > 1. I need to own the rubric updates.
  > 2. We need to audit 'denied' cases, not just 'approved' ones.
  > 3. We need to measure success by client stability at 6 months, not cases closed per week.
  >
  > If we don't track outcomes, we won't know if we're helping people until they're back on the street."

  ### 6. The "Replaceability" Fear
  You asked if this feeling is just you not wanting to be replaceable.
  Here is the truth: **You are making yourself more valuable, not less, if you structure this right.**
  If you successfully encode your knowledge into a system that runs without you, you are no longer a bottleneck. You become the *architect*.
  However, if the system fails because the nuance was stripped out, you will be the one blamed for "not training them well enough."

  **The Verdict:**
  Your friend is wrong. Tacit knowledge is real. The risk is structural.
  Do not say "No." Say "Yes, provided we measure outcomes, not output."
  If the Director refuses to measure outcomes (eviction rates, return clients) and insists on measuring throughput (cases closed), **do not build the system.** That is a directive to process people, not help them. And you know that's not why you took the job.

  Protect the "why." If you lose the "why," you lose the work.
