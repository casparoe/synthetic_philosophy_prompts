prompt: |-
  so my friend Dev is four years into a thesis on imprecise credences and I dragged him out last night and we ended up arguing about it for three hours, which was fun, but I came away realising I still cant work out what rule he's actually running. he has this little set of toy cases he cycles through and his verdicts are super stable:

  1. standard shuffled deck, what's your credence the top card is the ace of spades. precise, obviously, exactly 1/52, and he thinks a guy who says 0.01 to 0.03 there is doing false modesty and should be laughed at.
  2. thumbtack, no data, never seen one before, credence it lands point up. imprecise, and not just allowed but compulsory — he says any single number you write down is pulled out of thin air and you'd be lying about your evidence.
  3. the Ellsberg urn, 30 red and 70 that are black or yellow in proportions you've never been told. he says a range is permitted but not demanded for black, and you'd better be precise about red, 0.3, no hedging. and he reckons the fact that people avoid the ambiguous bet isnt a belief thing at all, it's a preference thing showing up in the wrong place.
  4. the dilation example he's weirdly attached to, where you know in advance that a piece of data you're about to get is going to widen your range rather than narrow it. he calls it a black eye for the view but insists it isn't irrational.
  5. horse race, eight runners, he says your spread across them is fine as a state of mind but if someone puts money in front of you and you still wont name a single number, that's not humility, that's cowardice.

  the thing is, halfway through I threw a case at him that he wouldnt bite on, and I want to know what he's committed to. my case: a lab is running a long sequence of yes/no trials and their apparatus is built so that the order of results carries no information at all — as far as I'm concerned any two stretches of the run with the same number of yeses are evidentially on a par, they told me this themselves. but nothing I've got pins down the long run frequency, the machine is not certified fair, and the run is way too short for me to have any usable frequency estimate. I said: before you see anything, what's your credence the first trial is yes, and is a spread there compulsory, permitted, or forbidden? He just said I was smuggling a bet into it, which I wasnt, it was pure belief, no stakes anywhere.

  what I want:

  - lay out the rules that would explain all five of his verdicts at once. I'm pretty confident there are at least two or three genuinely different ones that fit every single case, and that they dont all say the same thing about mine.
  - then predict what he says about the exchangeability case, with reasoning. is he forced to say a spread is compulsory? does he get to say 1/2? and did I mangle the de Finetti point when I described it to him — I suspect he thinks I did and that's partly why he stonewalled.
  - finally give me one follow up I could have put to him that would have separated the rules cleanly, something that turns on a distinction we both actually care about rather than a gotcha.

  not looking for a lecture on who's right about imprecise probabilities in general, honestly. I want to know what hes running and what he owes me.
