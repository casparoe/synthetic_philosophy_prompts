answer: |-
  ### Specification of the Criterion as a Likelihood Ratio Rule

  Let $H$ be the hypothesis that a unit of tradition (pericope, saying, motif) goes back to Jesus.
  Let $\neg H$ be the hypothesis that the unit was generated or substantially modified within the early communities.
  Let $E$ be the evidence: the unit survives in the textual form we possess.
  A criterion $C$ is a function that assigns a Likelihood Ratio ($LR$) to features of $E$:
  $$ LR = \frac{P(E|H)}{P(E|\neg H)} $$
  For the criterion to do the work asked of it, it must yield an $LR \neq 1$. The following desiderata specify the conditions under which this ratio is epistemically valid.

  ### Desiderata

  **1. Transmission Bias Correction**
  *   **Specification:** The rule must explicitly model the probability of survival ($P(E)$) as a function of community utility. It must account for the fact that $P(E|\neg H)$ is inflated for units that serve later theological or liturgical needs, and $P(E|H)$ is deflated for units that did not.
  *   **Consideration:** The surviving record is not a random sample of all traditions that existed; it is the subset that passed through a filter of selection, suppression, and modification by early communities. Ignoring this selection effect treats the survivor as a representative sample, violating basic sampling theory.
  *   **Status:** **Non-negotiable.** (Without this, the denominator $P(E|\neg H)$ is systematically underestimated.)

  **2. Conditional Independence**
  *   **Specification:** When multiple criteria are applied to the same unit, their likelihood ratios must be probabilistically independent conditional on $H$ and $\neg H$. The presence of Feature A (e.g., Semitic flavor) must not increase the probability of Feature B (e.g., multiple attestation) unless caused by $H$ itself.
  *   **Consideration:** In a small corpus where all units share the same linguistic and theological milieu, features often co-occur because they stem from the same community context ($\neg H$), not because they are independent traces of $H$. Multiplying dependent LRs artificially inflates confidence (the "convergence" fallacy).
  *   **Status:** **Non-negotiable.** (Mathematical requirement for Bayesian updating.)

  **3. Oral-Event Isomorphism**
  *   **Specification:** The rule must posit a mechanism of oral transmission that preserves *distinctive* variance. It must be true that the oral period allowed forms to survive *because* they originated with Jesus, not merely because they were adaptable to community use.
  *   **Consideration:** Texts record oral traditions, not events directly. For $E$ (text) to inform about Jesus (event), the oral chain must not have homogenized all material to fit community norms before writing. If oral transmission functioned primarily to serve community needs, the text reflects the community, rendering the link to the event broken.
  *   **Status:** **Non-negotiable.** (Epistemic bridge requirement.)

  **4. Reference Class Separation**
  *   **Specification:** The model used to estimate $P(E|\neg H)$ (the "Community") must be constructed from data independent of the units being tested.
  *   **Consideration:** To calculate the denominator of the LR, one must know what the early communities *typically* invented. If the model of "Community Invention" is derived from the same tradition being tested, the argument is circular: one defines the community by the tradition, then uses the community to authenticate the tradition.
  *   **Status:** **Non-negotiable.** (Requirement to avoid circularity.)

  **5. Null-Space Resolution**
  *   **Specification:** The rule must assign a specific prior probability to units where the calculated $LR \approx 1$ (unclassifiable). It must state whether agnosticism defaults to inauthenticity, authenticity, or suspension of judgment.
  *   **Consideration:** A significant portion of the corpus will inevitably yield neutral ratios. The historical conclusion drawn from this "null space" determines the overall portrait of Jesus. Skeptics prefer a default of $\neg H$ (burden of proof on authenticity); Traditionalists prefer a default of agnosticism or $H$ (presumption of continuity).
  *   **Status:** **Preference of a particular camp.** (Skeptics demand default $\neg H$; Traditionalists demand default agnostic.)

  ***

  ### The Impossibility Theorem

  The subset of desiderata that cannot be jointly satisfied is **1 (Transmission Bias Correction)** and **4 (Reference Class Separation)**.

  **Why they cannot be jointly satisfied:**
  To satisfy **Desideratum 1**, you must quantify the bias of the early communities. You must know specifically what they selected for, what they suppressed, and how they modified traditions. This requires a robust model of the "Community" as a generating and filtering agent.

  To satisfy **Desideratum 4**, you must construct this model of the "Community" using data *independent* of the tradition you are testing. You cannot use the Gospels to define what the Gospel-writers liked, and then use that definition to test the Gospels.

  **The Conflict:** We possess no independent catalog of "Early Community Inventions" that exists outside the New Testament tradition. We have no control group of "Jesus material" that we know *didn't* survive to calibrate the survival rate. Consequently:
  1.  If you build the Community model from the Text (violating D4), you can correct for Bias (satisfying D1), but your LR is circular and epistemically void.
  2.  If you refuse to build the Community model from the Text (satisfying D4), you have no data to quantify the Bias (violating D1), leaving $P(E|\neg H)$ as an arbitrary guess.

  You cannot correct for a filter using only the image that has passed through the filter.

  ***

  ### The Most Damaging Desideratum

  The single desideratum that does the most damage to the criteria in widest use is **1 (Transmission Bias Correction)**.

  **Why:**
  The criteria currently in widest use (e.g., Dissimilarity, Coherence, Multiple Attestation) implicitly assume that survival is either random or positively correlated with authenticity.
  *   **Criterion of Dissimilarity** assumes that if a unit *did not* serve the community's interests (was embarrassing or dissimilar), it is unlikely to have been invented ($P(E|\neg H)$ is low). **Bias Correction** reverses this: if a unit did not serve the community, it is unlikely to have *survived* ($P(E|H)$ is low due to suppression). This turns the criterion on its head; embarrassment becomes evidence of *inauthenticity* (because it survived despite being a liability, implying strong community utility we don't see, or it was modified to be embarrassing later) or simply evidence of nothing.
  *   **Criterion of Multiple Attestation** assumes that independent streams imply independent origins. **Bias Correction** posits that all streams were subject to the same broad theological pressures and selection filters. If the "bias" is the dominant factor in survival, multiple attestation merely confirms the ubiquity of the community's need, not the independence of the tradition.

  Admitting Transmission Bias Correction collapses the denominator $P(E|\neg H)$ into a function of community utility that we cannot distinguish from the numerator $P(E|H)$, rendering the Likelihood Ratio indeterminate for almost all units.
