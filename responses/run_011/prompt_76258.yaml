      *   *Verdict:* It's a test of *universality* based on common reason/conscience, not just "neutrality" in the sense of saying nothing controversial. It's about finding the *overlap*. It is a negative heuristic for neutrality (avoid what divides) to achieve a positive goal (teach what unites).

  4.  **Address Question 2: The Veto Problem & Conviction:**
      *   *The Worry:* Does the most sensitive parent win? (The "heckler's veto").
      *   *Ferry's Nuance:* He says "honest man" (*honnête homme*). This implies a reasonable person, not a fanatic. It's an idealised father, not necessarily the actual cranky parent down the road.
      *   *Conviction:* Ferry wants teachers to teach *with* conviction. How? By teaching *common* morality. You can be passionate about honesty without being sectarian. The veto isn't on *morality*, it's on *dogma*.
      *   *Resolution:* It's not about avoiding offence per se, but avoiding *sectarian* offence. The "veto" protects the unity of the school, not the fragility of the individual.

  5.  **Address Question 3: Disputed Matters & Laïcité:**
