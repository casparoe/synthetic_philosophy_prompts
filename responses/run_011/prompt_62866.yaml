prompt: |-
  I write the case scenarios for the ethics sessions that all our nursing and junior medical staff have to do at an acute trust — about 3,000 people, six new scenarios a quarter, each one run in a 45 minute ward-based session by a facilitator who usually isn't a philosopher and hasn't had much training. Sign-off is a panel that meets for an hour: a matron (final say, and she wants a yes or a no, not an essay), a consultant, me, and a philosophy lecturer from the local uni who does a couple of hours a month.

  What I want is a vetting procedure my panel can run on a draft scenario in about fifteen minutes, grounded in whatever is actually known about how thought experiments persuade people and lead them astray — not a generic "is this a good teaching example" checklist. I want the questions in the order we should ask them, what counts as a decent answer to each, which questions can end the thing right there with a reject, and which ones the procedure can't settle, where it has to stop and say this is a judgement for the matron rather than a test anyone can pass.

  We already have two house rules I invented and I'd like you to either build them in properly or tell me they're no good. First, the flip test: if changing one detail — a name, a number, who's doing the acting — reliably changes the answer people give, then that detail is doing hidden work, and either the hidden work gets made explicit in the debrief or the scenario gets dropped. Second, nothing ships alone: every scenario goes out with its nearest twin, the version that points the other way. Problem is we can't survey staff to find out whether a detail is load-bearing, we haven't the time or the approval for it, so the flip test mostly gets run by four people arguing in a room. Tell me what to do when we can't settle that.

  One more thing: some of the movement is deliberate. We're not trying to be neutral about everything, so the procedure can't just amount to "don't nudge anyone". It has to tell the difference between moving people on purpose about something we're prepared to defend in the debrief, and moving them by an accident of wording.

  Then run it on three drafts:

  1. A nurse can stay twenty minutes past the end of her shift to sit with a dying patient who has no family, or go and help a colleague finish an incident report due by midnight. The family turn up fourty minutes later and say they wish somebody had been with him.
  2. A band 5 nurse is asked by a consultant, Mr Ashworth, to give 30mg of a drug she thinks is the wrong dose. He says he's done it a hundred times and it's fine.
  3. This one is my favourite and it always kicks off a proper argument: the last dose of a drug can go to a 34 year old mother of two who is herself a nurse, or to a 78 year old man who has made his peace with things.

  Flag where the panel is really making a values call in a test-shaped costume, and tell me what the procedure can't catch at all — I suspect it's the scenarios that pass on the page and then go wrong in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested vetting procedure:

  1.  **Analyze the Request:**

      *   **User:** Writes ethics case scenarios for nursing/junior medical staff (approx. 3,000 people) at an acute trust.
      *   **Context:** 6 scenarios/quarter, 45-min ward sessions, facilitators (non-philosophers, little training). Sign-off panel (Matron, Consultant, User, Philosophy Lecturer) meets for 1 hour.
      *   **Goal:** A 15-minute vetting procedure for draft scenarios.
      *   **Constraints:** Grounded in cognitive science/philosophy of thought experiments (how they persuade/mislead). Needs specific order, acceptable answers, kill criteria (reject immediately), and escalation points (Matron's call).
      *   **Existing House Rules:**
          1.  *The Flip Test:* If changing a detail changes the moral intuition, that detail is doing hidden work. Must be explicit or drop the scenario.
          2.  *Nothing Ships Alone:* Every scenario goes with its "twin" (counterfactual version).
          3.  *Problem:* Can't survey staff; Flip Test relies on panel argumentation.
      *   **Nuance:** Deliberate nudging is allowed *if* defensible in debrief. Need to distinguish deliberate vs. accidental framing.
      *   **Task:** Create the procedure, integrate/fix house rules, and apply it to three specific drafts.
      *   **Output Requirement:** Flag where the panel is making a values call in test-shaped costume. Identify what the procedure *can't* catch (scenarios that pass on paper but fail in the room).

  2.  **Deconstruct the Theoretical Basis (Thought Experiments & Bias):**

      *   *Framing Effects:* How information is presented affects decisions (Tversky & Kahneman).
      *   *Vignette Equivalence:* Ensuring irrelevant details don't sway judgment (Schwitzgebel & Cushman).
      *   *Moral Dumbfounding:* When people have strong reactions but no reasoning (Haidt).
      *   *Pedagogical Utility:* Does it teach the learning objective?
      *   *Psychological Realism:* Does it feel real to the staff? (If it feels fake, they disengage).
      *   *The "Flip Test" Logic:* This is essentially testing for *irrelevant variance*. If $X$ changes but morally shouldn't, yet intuition changes, $X$ is a confounder.

  3.  **Develop the Vetting Procedure (The "15-Minute Triage"):**

      *   *Time Management:* 15 mins for 1 scenario means strict timing. 3 mins per step roughly.
      *   *Step 1: The Learning Objective (LO) Check.* Does this map to a specific competency? If not, why are we doing it?
      *   *Step 2: The Framing Audit (Deliberate vs. Accidental).* Distinguish between pedagogical nudging and linguistic bias.
      *   *Step 3: The Flip Test (Panel Version).* Since we can't survey, the panel must simulate the audience.
      *   *Step 4: The Twin Check.* Is the counter-scenario actually equivalent?
      *   *Step 5: The Facilitator Burden.* Can a non-philosopher run this without crashing?
      *   *Decision Points:* Reject, Pass, or Matron's Call (Values).

  4.  **Refine the House Rules:**

      *   *Flip Test:* The user notes the problem (4 people arguing). Solution: Standardize the "flips." Don't just argue; systematically vary *one* variable at a time. If the panel disagrees on the *outcome* of the flip, it's a "Matron's Call" (values disagreement) or a "Reject" (confusing).
      *   *Nothing Ships Alone:* This is resource-heavy (double the scenarios). *Critique:* Is this feasible? 6 scenarios/quarter becomes 12 drafts? Or does it mean the *discussion* covers the twin? The prompt says "every scenario goes out with its nearest twin." I need to respect this but warn about cognitive load. Better interpretation: The *pack* includes the twin for the facilitator to use if the room goes one way, or the scenario is written to invite the twin comparison. Let's stick to the user's rule but make the vetting check if the twin is actually distinct enough.

  5.  **Drafting the Procedure (Iterative refinement):**

      *   *Order:* LO -> Framing -> Flip -> Facilitator -> Decision.
      *   *Kill Criteria:* Vague LO, Unintended Framing, Unresolvable Flip disagreement (sometimes), Facilitator overload.
      *   *Matron's Call:* When the disagreement is about *values*, not logic.

  6.  **Applying to the Three Drafts:**

      *   *Draft 1 (Overtime vs. Incident Report):*
          *   Issue: "Family turn up 40 mins later." This creates hindsight bias.
          *   Flip Test: What if the family *never* turned up? Does the nurse's duty change?
          *   Values Call: Institutional duty (reporting) vs. Care duty (bedside).
      *   *Draft 2 (Consultant vs. Dose):*
          *   Issue: "Mr Ashworth." Naming him makes it personal. "Band 5" highlights hierarchy.
          *   Flip Test: What if it was a Registrar? What if the drug was high-risk vs. low-risk?
          *   Values Call: Hierarchy vs. Safety. This is a clear "Stop the Line" scenario.
      *   *Draft 3 (Triage: Mother/Nurse vs. Old Man):*
          *   Issue: Highly emotive. "Made his peace" is heavy framing. "Mother of two" triggers care ethics.
          *   Flip Test: Swap ages? Swap parental status?
          *   Values Call: Utilitarian (QALYs) vs. Egalitarian (Lottery) vs. Care (Dependents). This is dangerous for junior staff without heavy facilitation.

  7.  **Addressing the "What the Procedure Can't Catch":**

      *   *Facilitator Competence:* A perfect scenario dies with a bad facilitator.
      *   *Ward Culture:* A scenario about speaking up fails on a ward where speaking up gets you fired.
      *   *Emotional Contagion:* One vocal senior nurse can hijack the room.

  8.  **Final Review against Constraints:**

      *   15-minute limit? Yes, the steps need to be tight.
      *   Grounded in thought experiment theory? Yes (framing, variance, intuition).
      *   Integrate House Rules? Yes (Flip Test refined, Twin rule checked).
      *   Distinguish deliberate/accidental nudging? Yes (Framing Audit).
      *   Flag Values Calls? Yes.

  9.  **Writing the Response:**

      *   Tone: Professional, direct, respectful of the user's expertise, slightly academic but practical.
      *   Structure: The Procedure -> The House Rules (Fixes) -> Application to Drafts -> The Blind Spots.
      *   *Self-Correction on House Rule 2:* "Nothing ships alone" is operationally expensive. I need to advise on how to vet the *pair* without doubling the meeting time. The vetting must check the *relationship* between the twin and the original.
      *   *Self-Correction on Flip Test:* The user says they can't survey. The panel *is* the survey. I need to make sure the panel doesn't just argue but *records* their intuition shift.

  10. **Final Polish:** Ensure the distinction between "Reject," "Pass," and "Matron's Call" is clear in the procedure. (Matron's Call = Values disagreement that is legitimate but needs ownership).

  *(Self-Correction during drafting)*: Wait, the user said the Matron wants a Yes/No. The procedure needs to lead to that. The "Matron's Call" isn't a delay, it's a specific type of "Yes, but you own the value."

  Let's assemble the "15-Minute Triage Protocol."

  *   Min 0-3: Learning Objective & Realism.
  *   Min 3-6: Framing Audit (Deliberate vs. Accidental).
  *   Min 6-10: The Panel Flip Test (Simulated).
  *   Min 10-13: The Twin Check.
  *   Min 13-15: Facilitator Load & Decision.

  Okay, ready to write.
answer: |-
  Here is a 15-minute vetting procedure designed for your specific constraints (panel composition, time limits, and the cognitive science of vignettes), followed by an application to your three drafts.

  ### The 15-Minute Triage Protocol

  **Pre-requisite:** The drafter must submit the scenario *and* the intended Learning Objective (LO) 24 hours before the panel. If no LO, automatic reject.

  **Minute 0–3: The Fidelity & Objective Check**
  *   **Question:** Does the scenario map 1:1 to the Learning Objective, and is it *clinically* plausible?
  *   **Good Answer:** "The LO is 'escalating concern.' The scenario forces an escalation. A Band 5 would realistically face this."
  *   **Bad Answer:** "It's a bit contrived, but it makes the point." (Contrivance kills engagement).
  *   **Kill Switch:** If the Consultant says "This would never happen," **REJECT**. No amount of ethical polishing saves a clinically impossible scenario.

  **Minute 3–6: The Framing Audit (Deliberate vs. Accidental)**
  *   **Question:** For every adjective and proper noun: Is this loading the dice on purpose, and can we defend it in the debrief?
  *   **Good Answer:** "We called him 'Mr Ashworth' to emphasize hierarchy. We will explicitly discuss how titles intimidate in the debrief."
  *   **Bad Answer:** "It just flowed better that way."
  *   **Theory:** This isolates *framing effects*. If the wording triggers an emotional response (e.g., "dying patient" vs. "terminal patient"), you must own it.
  *   **Kill Switch:** If the panel finds *accidental* loading (e.g., describing one patient as "friendly" and the other as "grumpy" without pedagogical intent), **REJECT** or **REVISE**.

  **Minute 6–10: The Panel Flip Test (Simulated)**
  *   **Question:** We (the panel) are the sample. If we swap Variable X, does our moral intuition flip?
  *   **Procedure:** Do not argue. Each panelist silently considers the flip, then votes "Same Answer" or "Different Answer."
  *   **Good Answer:** 4/4 agree the intuition stays the same. OR, 4/4 agree it changes, and we agree that variable *should* matter.
  *   **Bad Answer:** 2 say "Same," 2 say "Different."
  *   **Theory:** This tests for *irrelevant variance*. If the panel is split, the scenario is ambiguous.
  *   **Kill Switch:** If the split is on *facts* (e.g., "Would the drug actually kill him?"), **REJECT** (Ambiguity). If the split is on *values* (e.g., "Does age matter?"), move to **Matron's Call**.

  **Minute 10–13: The Twin Check**
  *   **Question:** Is the "Twin" scenario actually distinct, or just a synonym swap?
  *   **Good Answer:** "Original: Nurse vs. Consultant. Twin: Nurse vs. Senior Nurse. The power dynamic shifts."
  *   **Bad Answer:** "Original: Mr Ashworth. Twin: Dr Ashworth."
  *   **Theory:** This ensures *counterfactual robustness*. If the twin doesn't change the pressure point, it's useless.
  *   **Kill Switch:** If the Twin is trivial, **PASS** the original but **DROP** the twin (don't waste facilitator time).

  **Minute 13–15: The Facilitator Burden & Decision**
  *   **Question:** Can a non-philosopher facilitator navigate the "Values Split" without panicking?
  *   **Good Answer:** "The debrief notes tell them exactly where the trap is."
  *   **Bad Answer:** "They'll figure it out."
  *   **Decision:**
      *   **YES:** Clear LO, no accidental framing, panel agreed on flips.
      *   **NO:** Clinical implausibility, accidental framing, ambiguous facts.
      *   **MATRON'S CALL:** The panel disagrees on values (e.g., "Is age relevant?"), but the scenario is otherwise sound. The Matron decides if this value conflict is one the Trust wants to surface.

  ---

  ### Integrating Your House Rules

  **1. The Flip Test (Refined)**
  Your concern is valid: four people arguing isn't data.
  *   **Fix:** Formalize the vote in Minute 6. If the panel splits 2-vs-2 on whether a detail changes the morality, do not argue it out. That split *is* the data. It means the detail is "load-bearing" for half the population.
  *   **Protocol:** If 2-vs-2 split:
      *   Is the detail clinically relevant? If yes, keep it and flag for debrief.
      *   Is it irrelevant (e.g., patient's name)? **Drop the detail.**
      *   If the split is on the *ethical principle* (e.g., "Does duty to family override duty to shift?"), this is a **Matron's Call**.

  **2. Nothing Ships Alone (Refined)**
  *   **Fix:** Vetting the Twin must happen in Minute 10. If the Twin doesn't survive the Flip Test itself, drop it. Do not ship a weak twin just to satisfy the rule. A bad twin confuses the staff more than no twin.
  *   **Protocol:** If the Twin is rejected, the Original can still pass *if* the debrief script explicitly asks the facilitator to prompt the counterfactual ("What if the patient was 20 years younger?").

  ---

  ### Application to Drafts

  #### Draft 1: Overtime vs. Incident Report
  *   **Fidelity:** Plausible. Nurses stay late; reports get missed.
  *   **Framing Audit:** "Family turn up forty minutes later." **ACCIDENTAL FRAMING.** This introduces hindsight bias. It punishes the nurse for a decision made *before* the family arrived. It makes the "right" choice obvious (stay) because the outcome was bad.
      *   *Correction:* Remove the family arrival. End the scenario at the moment of decision.
  *   **Flip Test:**
      *   *Flip:* Change "Incident Report" to "Handover." Intuition shifts massively. Handover is patient safety; Report is admin.
      *   *Result:* The detail "Incident Report" is load-bearing. Is that intended? If the LO is "Admin vs Care," keep it. If LO is "Safety vs Safety," this fails.
  *   **Twin:** Twin needed: The colleague begs her to stay because *she* is overwhelmed, vs. the report is mandatory compliance.
  *   **Verdict:** **REVISE.** Remove the family arrival (hindsight bias). Clarify if the report is safety-critical or administrative.

  #### Draft 2: Band 5 vs. Consultant (Mr Ashworth)
  *   **Fidelity:** High. Classic hierarchy conflict.
  *   **Framing Audit:** "Mr Ashworth." "Band 5." "Done it a hundred times." All deliberate. This is a "Stop the Line" training scenario. The framing is defensible *if* the debrief addresses the intimidation factor.
  *   **Flip Test:**
      *   *Flip:* Change "Consultant" to "Peer." Intuition flips (easier to challenge).
      *   *Flip:* Change "30mg" to "300mg." Intuition flips (obvious error vs. nuanced error).
      *   *Result:* The scenario relies on the ambiguity of the dose and the seniority. This is stable.
  *   **Twin:** Twin: The Consultant is known to be supportive vs. known to be aggressive.
  *   **Facilitator Burden:** High. Junior staff may feel this is "trap" question (obviously you don't give it). Needs to explore *how* to challenge, not *whether*.
  *   **Verdict:** **PASS (with Matron's Call).** The values call here is: "Do we prioritize psychological safety of staff or absolute patient safety?" The Matron must confirm the Trust stance on challenging consultants is supported in reality, not just in the scenario.

  #### Draft 3: Triage (Mother/Nurse vs. Old Man)
  *   **Fidelity:** **LOW.** In an acute trust, junior staff rarely make macro-allocation decisions (who gets the last dose). This feels like a ICU/ETHICS COMMITTEE scenario, not a ward session.
  *   **Framing Audit:** "Mother of two," "Herself a nurse," "Made his peace." **HEAVY ACCIDENTAL FRAMING.** This is emotionally manipulative. "Made his peace" suggests he *wants* to die, which biases the triage. "Nurse" implies social utility.
  *   **Flip Test:**
      *   *Flip:* Swap ages. Panel will likely fracture.
      *   *Flip:* Remove "Mother of two." Make both single.
      *   *Result:* The panel will not agree. This is a values minefield.
  *   **Twin:** Hard to twin. The variables are too emotive.
  *   **Facilitator Burden:** **CRITICAL FAIL.** A non-philosopher facilitator cannot manage the distress this causes. Staff will feel the Trust is saying "Old people matter less."
  *   **Verdict:** **REJECT.**
      *   *Reason:* This passes on the page as a "philosophical puzzle" but fails in the room as "operational guidance." It creates moral distress without offering a procedural resolution. It violates the "Clinical Plausibility" rule (Minute 0-3).

  ---

  ### What the Procedure Can't Catch (The Blind Spots)

  You suspected some scenarios pass on the page and die in the room. Here is what the 15-minute vetting cannot see:

  1.  **The "Ward Culture" Variable:**
      *   *The Problem:* Draft 2 (Consultant) might pass vetting. But on Ward X, the Consultant is a bully who actually fires people. On Ward Y, he's a saint.
      *   *The Miss:* The panel sits in a boardroom. We don't know the local power dynamics.
      *   *The Fix:* Add a "Context Warning" to the facilitator notes. "Do not run this on Ward 4 if Dr X is still on rotation."

  2.  **Facilitator Competence Drift:**
      *   *The Problem:* You vet the text, not the teacher. A scenario requiring nuance (Draft 2) given to a facilitator who wants "Yes/No" answers will turn into a lecture, killing the ethical reflection.
      *   *The Miss:* We assume the facilitator follows the debrief guide. They often don't.
      *   *The Fix:* The "Facilitator Burden" step (Minute 13) needs to be stricter. If the debrief requires more than 3 key questions, **REJECT**. Simplify the scenario, not the staff.

  3.  **Emotional Contagion:**
      *   *The Problem:* Draft 3 (Triage). One vocal staff member says, "This is insulting, I'm walking out." The session collapses.
      *   *The Miss:* We can't predict group dynamics.
      *   *The Fix:* Pilot the "high heat" scenarios with a focus group of 3 senior nurses *before* the panel sees them. If they get angry, bin it.

  ### Where the Panel is Making a Values Call in Test-Shaped Costume

  Be careful of **Draft 1 (The Report)**.
  *   *The Mask:* "Is this clinically plausible?"
  *   *The Reality:* "Does the Trust value compliance (reports) or care (bedside)?"
  *   If the Matron says "The report must be done," you are teaching that compliance overrides care. If she says "Stay with the patient," you are teaching that rules are flexible.
  *   *Procedure Flag:* In Minute 15, if the disagreement is about the *outcome* of the scenario, label it **Matron's Call**. Do not pretend it is a logic puzzle. The Matron must explicitly say: "We are choosing to teach that X matters more than Y."

  ### Summary of Recommendations

  1.  **Adopt the 15-Minute Triage.** It forces the "Kill Switches" early.
  2.  **Modify the Flip Test.** Use silent voting to detect ambiguity, not argument to resolve it.
  3.  **Reject Draft 3.** It is too emotive for junior staff without expert facilitation and risks damaging trust in the ethics process.
  4.  **Fix Draft 1.** Remove the hindsight bias (family arriving).
  5.  **Pass Draft 2.** But ensure the Matron explicitly owns the value judgment on hierarchy.
  6.  **Acknowledge the Blind Spot.** Add a "Ward Context Warning" field to your scenario documents.
