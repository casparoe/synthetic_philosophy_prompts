answer: |-
  **1. Shared Ground**

  1.  No finite list of strokes, angles, or curves is necessary or sufficient to define the letter 'a'. A naive stroke-definitionalist would claim that removing the crossbar or opening the counter destroys the letter; we agree that literate readers routinely identify 'a' even when these features are absent or distorted.
  2.  Recognition is robust across substantial morphological variation. The double-storey roman form and the single-storey italic or manuscript form are distinct shapes yet function as the same letter within the Latin system.
  3.  Shape alone does not determine identity. The lowercase 'a' in Cyrillic and Latin alphabets is often visually indistinguishable, yet they are distinct letters belonging to different systems; a plain text search confirms they are not interchangeable.
  4.  Variation is bounded, not random. While no specific stroke is required, not every shape counts. There is a region of shape-space where 'a' resides, bounded by legibility constraints and contrast with neighbouring letters (e.g., 'o', 'd', 'q').
  5.  Competence involves dissociable skills. Fluent reading does not guarantee the ability to reproduce a specific glyph from memory (such as the looptail 'g'), suggesting that recognition relies on different resources than explicit production.
  6.  Historical continuity is real but flexible. Characters evolve (e.g., the German ß gaining a capital form), and systems reassign values (e.g., the IPA treating shapes differently over time), yet users maintain stable categories throughout these shifts.
  7.  Borderline cases exist. There are shapes about which competent users hesitate or disagree, and this hesitation is a feature of the category, not merely a lack of information.

  **2. The Disagreements**

  | Disagreement | Archetype Camp | System Camp | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Source of Identity** | Identity arises from fidelity to a cluster of functional demands (legibility, history, distinctness). | Identity arises from occupying a specific slot within a conventional system maintained by a community. | Substantive |
  | **Borderline Cases** | Hesitation reflects genuine conflict between competing demands within the archetype itself. | Hesitation reflects indeterminate boundaries in community practice or lack of contextual cues. | Substantive |
  | **Shape vs. Slot** | Shape constrains the system; a shape must be sufficiently 'a-like' to occupy the a-slot. | The slot constrains the shape; any shape can be an 'a' if the system assigns it there. | Substantive |
  | **Convergence** | Shapes converge because they track the same underlying functional spirit. | Shapes converge because shared functional pressures cast similar shadows on independent systems. | Verbal |
  | **Change** | Evolution is the refinement of the form to better meet archetypal demands. | Evolution is a shift in convention or utility within a living practice. | Verbal |
  | **Cyrillic 'a'** | The visual similarity is non-accidental; it tracks a shared graphic archetype despite systemic difference. | The visual similarity is coincidental; systemic difference makes them wholly distinct categories. | Substantive |
  | **Memory Asymmetry** | Failure to reproduce proves the archetype is not a stored image but a generative constraint. | Failure to reproduce proves recognition relies on contextual cues absent in isolation. | Verbal |

  **3. Cruxes**

  **1. The Cyrillic Constraint (Ranked Highest)**
  *Question:* Does visual similarity ever suffice for category membership absent systemic assignment?
  *Case:* Data point 4 (Cyrillic vs. Latin 'a'). We propose a variant: present users with a Cyrillic text containing the shape 'a' but label it "Latin Script."
  *Predictions:* **Archetype:** Users will experience cognitive friction but acknowledge the shape as 'a' due to fidelity demands. **System:** Users will reject the classification entirely; without the systemic slot, the shape is merely a curve.
  *Revision:* If users accept the shape as 'a' solely based on morphology despite explicit systemic denial, the System camp must concede shape carries independent weight. If users reject it unequivocally, the Archetype camp must concede system is constitutive, not merely constraining.

  **2. The IPA Reassignment (Ranked Second)**
  *Question:* Can a shape retain identity across systemic reassignment?
  *Case:* Data point 3 (IPA assigning different sound values to 'a' forms historically).
  *Predictions:* **Archetype:** The letter identity persisted despite sound changes because the graphic demands remained stable. **System:** The letter identity changed when the systemic value changed; continuity is an illusion of shape conservation.
  *Revision:* If historical analysis shows users treated the reassigned shapes as fundamentally new letters despite identical forms, the Archetype camp must weaken the claim of graphic continuity.

  **3. The Memory Asymmetry (Ranked Third)**
  *Question:* Does isolated production reveal the internal category model?
  *Case:* Data point 6 (Reproducing looptail 'g' from memory vs. fluent reading).
  *Predictions:* **Archetype:** Errors in production reveal the flexibility of the generative constraint; the archetype guides but does not dictate strokes. **System:** Errors reveal that recognition is context-dependent; isolated production lacks the systemic scaffolding of reading.
  *Revision:* If production accuracy correlates perfectly with reading speed, the Archetype camp must concede the model is stored explicitly. If accuracy remains low despite fluency, the System camp must concede recognition relies on more than contextual habit.

  **4. The Borderline Conflict**
  *Question:* Is hesitation internal or external?
  *Case:* A new invention: A shape exactly midway between 'a' and 'o' presented in a neutral context.
  *Predictions:* **Archetype:** Hesitation is caused by the shape itself failing to resolve competing demands. **System:** Hesitation is caused by the lack of contextual cues to fix the systemic slot.
  *Revision:* If adding context resolves hesitation instantly, the System view is strengthened. If hesitation persists despite context, the Archetype view is strengthened.

  **4. What Is Merely Verbal**

  Much of the dispute dissolves if we rename "essence" to "stable cluster of functional pressures." The Archetype camp speaks of a "spirit" that shapes converge upon; the System camp speaks of "shared functional pressures" that cause convergence. If both agree that shapes are not arbitrary but are constrained by legibility, tooling, and history, the metaphysical weight of "spirit" becomes negligible. Similarly, "representation" is contentious. The Archetype camp denies storing a template image; the System camp denies storing a code. Both agree no picture is stored. If we describe the cognitive resource as a "generative constraint" rather than a "representation," the disagreement over internal machinery largely vanishes. The term "formalism" is also a flashpoint; the System camp rejects it because their system is a living practice, not a rigid code. Once both sides acknowledge that systems are dynamic and archetypes are flexible, the accusation of rigid formalism loses its grip. However, renaming does not solve the priority question: do pressures create the system, or does the system harness the pressures?

  **5. The Residual**

  **Archetype Camp:** The shape constrains the system; a writing system cannot assign the letter 'a' to a shape that fundamentally violates the functional demands of 'a'-ness, regardless of convention.

  **System Camp:** The system constitutes the shape; a shape becomes an 'a' only when a community assigns it to the 'a' slot, regardless of whether it violates prior functional demands.
