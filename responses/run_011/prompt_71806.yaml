answer: |-
  Here is the breakdown you need to defend the one-pager. The confusion stems from the difference between a **theoretical possibility** (math) and a **practical incentive** (behavior).

  ### Part 1: What the Gibbard–Satterthwaite Theorem Actually Says

  The theorem is often summarized as "all voting systems are rigged," but that is sloppy. Here are the precise conditions required for the theorem to apply. If any of these are missing, the theorem does not bite.

  1.  **Three or more candidates:** If there are only two candidates, majority rule is strategy-proof. The theorem requires $\ge3$ options.
  2.  **Ordinal Ballots:** Voters submit a ranking (1st, 2nd, 3rd). It does not directly apply to cardinal systems (like Approval or Score voting) without modification, though similar impossibility results exist for those.
  3.  **Deterministic Outcome:** The winner is decided by rules, not a coin flip. (If you break ties by rolling dice, you technically evade the theorem, but that's not a serious proposal).
  4.  **Surjective (Any candidate can win):** The system cannot rule out a specific candidate beforehand (e.g., "The incumbent always wins").
  5.  **Not a Dictatorship:** The outcome isn't determined by a single voter regardless of others.

  **Definition of "Manipulable":**
  In this context, "manipulable" means: *There exists at least one scenario* where a voter, knowing how others voted, could have achieved a better outcome for themselves by submitting a ballot that did not match their true preferences.

  It does **not** mean:
  *   Manipulation is easy to calculate.
  *   Manipulation is likely to succeed without perfect information.
  *   All systems are *equally* vulnerable.
  *   Voters *should* manipulate.

  ---

  ### Part 2: Evaluating the Claims

  Here is the list of distinct claims your members might make, categorized by their truth value regarding Ranked-Choice Voting (RCV).

  | Claim | Verdict | Explanation |
  | :--- | :--- | :--- |
  | **"RCV is strategy-proof."** | **False.** | RCV fails the Gibbard–Satterthwaite conditions for strategy-proofness. There are specific mathematical scenarios where ranking your true favorite first causes them to lose, when ranking a compromise first would have made them win. |
  | **"Every system is gameable, so system design doesn't matter."** | **True-but-doing-no-work.** | While technically true under the theorem, it implies all systems are *equally* gameable. They are not. Some systems require complex math to game; others require only a glance. Some punish honesty severely; others rarely do. |
  | **"Under RCV, you never have to think strategically."** | **False.** | You *can* vote honestly without fear of "wasting" your vote (as in FPTP), but you still face scenarios where strategy *could* help. The claim should be "You rarely *need* to," not "You never *have* to." |
  | **"Manipulable means you should manipulate."** | **False.** | Just because a strategy *exists* doesn't mean it *pays*. In RCV, strategic voting often requires knowing exactly how others will vote. If you guess wrong, you can hurt your preferred outcome more than if you voted honestly. |
  | **"Bullet voting (ranking only one) is a dominant strategy."** | **False.** | In RCV, ranking only your first choice ("bullet voting") is safe, but it is not mathematically dominant. If your first choice is eliminated, having a second choice ranked allows you to influence the final round. Bullet voting forfeits that influence. |
  | **"Computational complexity makes manipulation irrelevant."** | **True (Practically).** | For some systems, finding the optimal strategic vote is so mathematically complex ("NP-hard") that no human or computer can do it in time. For simple RCV with 5 candidates, it is calculable, but still difficult enough to deter casual gaming. |
  | **"If only two candidates are viable, strategy disappears."** | **True.** | If the race effectively narrows to two frontrunners early in the count, RCV behaves like a majority runoff. In a two-way race, honest voting is the best strategy. |
  | **"Approval Voting escapes this theorem."** | **True (Technically).** | Gibbard–Satterthwaite applies to ordinal (ranking) systems. Approval (tick all you accept) is cardinal. However, Approval has its own strategic issue: deciding where to set your "approval threshold" is itself a strategic calculation. |

  ---

  ### Part 3: Addressing Your Specific Fuzzy Points

  **1. Does "can be manipulated" mean "you should manipulate"?**
  No. This is the most important distinction. In First-Past-The-Post (FPTP), if you like a third-party candidate, you are often *forced* to strategize (vote for the lesser evil) or your vote literally counts for nothing. In RCV, you are *allowed* to be honest. The theorem says a scenario exists where honesty loses, but in a union election with private ballots and no polling data, voters cannot know if they are in that scenario. Therefore, honesty remains the safest "default" strategy.

  **2. What changes if only two candidates are in contention?**
  If your 5 candidates effectively split into "2 frontrunners + 3 spoilers," RCV handles this better than FPTP. In FPTP, the 3 spoilers split the vote, potentially letting a frontrunner win with 35% support. In RCV, the spoilers are eliminated, and their votes transfer. Once the field narrows to two, the system becomes strategy-proof. The theorem requires 3+ candidates to function; if the process reliably reduces to 2, the "gameability" zone shrinks.

  **3. Is bullet voting a real strategy or a folk myth?**
  It is a real strategy, but it is defensive. Voters bullet vote in RCV because they fear their 2nd choice ranking will help eliminate their 1st choice. (e.g., If Candidate A is your favorite, but Candidate B is your acceptable backup, you might fear ranking B will hurt A). This is called "compromising." It is less risky in RCV than FPTP, but it still exists. However, advising members to bullet vote defeats the purpose of switching to RCV.

  **4. Does computational hardness matter?**
  Yes. If figuring out how to lie on your ballot requires a spreadsheet and knowledge of everyone else's votes, practical manipulation is low. FPTP manipulation is easy ("Don't vote for the guy who can't win"). RCV manipulation is hard ("Rank Candidate C second only if Candidate B's transfer value exceeds 0.4..."). High complexity acts as a barrier to entry for manipulators.

  ---

  ### Part 4: Who is Closer to Right?

  **The Data Guy is technically right, but practically wrong.**
  He is correct that no system is mathematically perfect. However, his conclusion ("don't bother changing") is a non-sequitur. Just because no car is immune to accidents doesn't mean seatbelts are useless. RCV reduces the *pressure* to strategize, even if it doesn't eliminate the *possibility*.

  **The RCV Advocate is practically right, but technically imprecise.**
  They are correct that RCV allows for more honest voting than FPTP. However, claiming you "never have to think strategically" is an overstatement that the Data Guy can easily puncture.

  **Winner:** The RCV Advocate is closer to the *goal*, but you must adopt the Data Guy's *precision* in your explanation to maintain credibility.

  ---

  ### Part 5: The One-Pager Bottom Line (Draft Text)

  *Here is the plain-English text you can adapt for the membership. It acknowledges the math without getting bogged down in it.*

  **VOTING SYSTEM PROPOSAL: WHAT CHANGES?**

  **The Proposal:**
  Switch from "First-Past-The-Post" (vote for one) to "Ranked-Choice Voting" (rank candidates 1, 2, 3...).

  **Why Consider the Change?**
  Under our current system, members often feel forced to vote for a "viable" candidate rather than their actual favorite, fearing their vote will be wasted. Ranked-Choice Voting (RCV) reduces this pressure. It allows you to support your favorite candidate first, while still having a say in the final outcome if your favorite is eliminated.

  **Is Any Voting System Perfect?**
  No. Mathematical theory proves that in any election with three or more candidates, there is no system that completely eliminates all strategic considerations. However, not all systems are equally difficult to use honestly.
  *   **Current System:** High pressure to strategize. Voting for your true favorite often feels like wasting your vote.
  *   **Proposed System:** Lower pressure to strategize. You can rank your true favorite first without losing your voice in the final round.

  **How Should I Fill Out My Ballot?**
  1.  **Rank Honestly:** The safest and most effective strategy is to rank candidates in the order you actually prefer them.
  2.  **Use All Your Ranks:** You are not required to rank every candidate, but doing so ensures your vote continues to count if your top choices are eliminated. Leaving later ranks blank forfeits that influence.
  3.  **Don't Overthink It:** Strategic voting requires knowing exactly how everyone else will vote, which is impossible in a private ballot election. Honest ranking is the best default.

  **Recommendation:**
  The Board recommends adopting Ranked-Choice Voting to empower members to vote for who they truly want, rather than who they think can win.
