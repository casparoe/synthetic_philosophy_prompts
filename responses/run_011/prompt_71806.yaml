prompt: |-
  I'm the secretary of a tenant union — about 400 of us, one board election a year, currently first-past-the-post, and we've got maybe five people running every time. At last month's meeting the membership voted to put a question on the next agenda: do we switch to ranked-choice (instant runoff, rank them 1-2-3)? Someone stuck me with writing the one-pager that goes out to members beforehand, which I said yes to before realizing I don't actually understand the arguments being made about it.

  Here's the problem. Two members invoked the exact same theorem in opposite directions and both acted like it settled the question.

  One said ranked choice means you can just honestly rank everybody and stop worrying about wasting your vote or splitting it — apparently the math people proved you never have to think strategically again under RCV. The other one, a guy who does data stuff at work, said that's backwards: the Gibbard–Satterthwaite theorem proves every voting system is gameable, so RCV buys us nothing over what we already have and we shouldn't bother changing anything.

  Can you pull apart what "this system can be manipulated" / "this system is strategy-proof" actually means, as a list of the distinct precise claims somebody could be making? For each one I want to know whether it's trivially true, actually true of instant runoff specifically, false, or true-but-doing-no-work. In particular I'm fuzzy on: what has to be true of a system before that theorem even bites (how many candidates, what kind of ballot, is a coin flip to break a tie going to ruin it?); whether "can be manipulated" has anything to do with "you should manipulate" or "manipulating usually pays"; whether the theorem covers the approval-ballot option we also discussed, where you just tick everyone you'd accept; what changes if in practice only two of our five candidates are ever really in contention; and whether a bloc ranking only its own guy and leaving the rest blank is a real strategy or a folk myth. I also dimly remember reading that for some systems it's computationally hard to even work out what the strategic vote would be — does that matter at all to whether manipulation is a practical worry?

  End with which of the two members is closer to right, and a plain-English bottom line I could actually print for members about how to fill in their ballot next year. Don't bother with references, I just need the distinctions stated clearly enough that I can defend the one-pager when that data guy reads it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Secretary of a tenant union (400 members).
      *   **Context:** Annual board election, 5 candidates, currently First-Past-The-Post (FPTP), considering Ranked-Choice Voting (RCV/Instant Runoff).
      *   **Task:** Write a one-pager for members explaining the voting system change.
      *   **Problem:** Two members cited the *same theorem* (Gibbard-Satterthwaite) to argue opposite conclusions (one says RCV eliminates strategy, the other says all systems are gameable so don't bother).
      *   **Specific Needs:**
          *   Disentangle the claims about "strategy-proof" vs. "manipulable."
          *   Evaluate specific claims (True/False/Trivial/Does No Work).
          *   Address conditions for the theorem (candidates, ballots, ties).
          *   Address "can be manipulated" vs. "should manipulate" vs. "pays to manipulate."
          *   Address Approval Voting.
          *   Address the "two frontrunners" scenario.
          *   Address "bullet voting" (ranking only one).
          *   Address computational complexity of manipulation.
          *   **Conclusion:** Who is closer to right?
          *   **Deliverable:** A plain-English bottom line for the one-pager.
      *   **Constraint:** No references needed, just clear distinctions. Tone should be helpful, precise, and suitable for a secretary defending the one-pager against a data-savvy skeptic.

  2.  **Deconstruct the Theorem (Gibbard-Satterthwaite):**
      *   *What does it actually say?* Any deterministic voting system with 3+ candidates that isn't a dictatorship is manipulable.
      *   *What does "manipulable" mean?* There exists *some* scenario where a voter gets a better outcome by lying about their preferences than by telling the truth.
      *   *What does it NOT say?* It doesn't say manipulation is easy, common, or profitable in *most* cases. It doesn't say all systems are *equally* manipulable.
      *   *Conditions:* 3+ candidates, ordinal preferences (usually), deterministic (no coin flips), surjective (any candidate can win).

  3.  **Address the Specific Claims/Questions:**

      *   *Claim 1: "RCV means you never have to think strategically again."*
          *   Status: **False.** G-S theorem applies to RCV.
      *   *Claim 2: "G-S proves every system is gameable, so RCV buys us nothing."*
          *   Status: **True-but-doing-no-work.** Yes, technically gameable, but "gameable" $\neq$ "equally gameable" or "hard to use honestly."
      *   *Conditions for G-S:* Needs 3+ candidates. RCV fits. Ties usually broken deterministically or randomly (randomness technically avoids G-S but introduces other issues; usually we assume deterministic for this context).
      *   *Manipulation vs. Incentive:* "Can be manipulated" is an existential claim (there exists a case). It doesn't mean "you should manipulate" or "it usually pays."
      *   *Approval Voting:* G-S applies to ordinal systems. Approval is cardinal/ratings. However, Approval has its own strategic issues (threshold strategy). G-S doesn't directly cover it in the standard form, but similar impossibility results exist.
      *   *Two Frontrunners:* If effectively 2 candidates, G-S doesn't bite (May's Theorem applies, majority rule is strategy-proof). RCV reduces to majority in the final round.
      *   *Bullet Voting (Ranking only one):* In RCV, this is a valid strategy *if* you fear your 2nd choice helps eliminate your 1st. It's not a myth, but it defeats the purpose of RCV.
      *   *Computational Complexity:* Yes, for some systems (like STV or complex RCV variants), finding the optimal strategic vote is NP-hard. For simple RCV, it's often easier but still non-trivial. This matters practically (barrier to entry for manipulators).

  4.  **Drafting the Distinctions (The "List"):**
      *   Need to categorize claims clearly.
      *   *Claim:* "RCV is strategy-proof." -> **False.**
      *   *Claim:* "All systems are manipulable." -> **True (under G-S conditions).**
      *   *Claim:* "Manipulable means you must strategize." -> **False.**
      *   *Claim:* "All manipulable systems are equally bad." -> **False.**
      *   *Claim:* "Computational hardness matters." -> **True (practically).**

  5.  **Addressing the Tenant Union Context:**
      *   400 members is small enough for coordination but large enough for anonymity.
      *   5 candidates is the key number (G-S needs 3+).
      *   The goal is representation, not gaming.
      *   The "Data Guy" is technically right on the math but wrong on the implication. The "RCV Advocate" is wrong on the math but right on the *intent* (RCV reduces the *need* for strategy compared to FPTP).

  6.  **Developing the Bottom Line (The One-Pager Text):**
      *   Needs to be neutral but informative.
      *   Must address the "honest voting" claim without lying.
      *   Must address the "it's all rigged" claim without discouraging participation.
      *   *Advice:* Rank honestly. Don't overthink. Bullet voting is okay but limits influence.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction on Approval Voting:* G-S specifically applies to *ordinal* voting (ranking). Approval is *cardinal* (yes/no). So G-S doesn't technically forbid strategy-proof approval voting, but the Gibbard *1973* theorem (generalized) covers all social choice functions. It's safer to say Approval has different strategic dynamics (thresholding) rather than getting bogged down in ordinal vs. cardinal G-S nuances. I should clarify that G-S applies to ranking systems primarily.
      *   *Correction on "Strategy-Proof":* RCV is *not* strategy-proof. But FPTP is *worse* regarding "vote splitting." The argument for RCV isn't that it eliminates strategy, but that it reduces the *pressure* to vote strategically against your conscience (i.e., voting for the "lesser evil" vs. your actual favorite).
      *   *The "Data Guy's" Error:* He conflates "theoretical possibility" with "practical equivalence." Just because both cars have brakes that *can* fail doesn't mean they are equally safe.
      *   *The "RCV Advocate's" Error:* They treat "reduces strategic pressure" as "eliminates strategic incentives."

  8.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the confusion (it's common).
      *   **The Theorem Breakdown:** What G-S actually says (conditions, definition of manipulation).
      *   **Claim Evaluation:** The requested list (True/False/etc.).
      *   **Specific Scenarios:** 2 frontrunners, bullet voting, computational complexity.
      *   **Verdict:** Who is right? (Both partially, neither fully).
      *   **The One-Pager Text:** Draft the actual content for the members.

  9.  **Tone Check:**
      *   Professional, clear, authoritative but accessible.
      *   Avoid academic jargon where possible, or explain it immediately.
      *   Ensure the secretary feels armed with facts.

  10. **Final Review against constraints:**
      *   No references? Check.
      *   List of distinct precise claims? Check.
      *   True/False/Trivial/Does No Work labels? Check.
      *   Address specific fuzzy points (ties, approval, 2 candidates, complexity)? Check.
      *   End with who is closer + plain English bottom line? Check.

  *(Self-Correction during drafting)*: I need to be careful about the "Approval Voting" question. G-S applies to social choice functions where the input is a preference ordering. Approval voting inputs are subsets. There are impossibility theorems for approval too, but G-S specifically targets ordinal ranking. I will clarify that distinction so the secretary doesn't get tripped up if the data guy pivots to "What about Approval?"

  *(Refining the "Strategy-Proof" definition)*: Make sure to distinguish between "Dominant Strategy Truth-Telling" (DSTT) and "Manipulable." RCV does not have DSTT. FPTP does not have DSTT. But FPTP has a *stronger* incentive to deviate from truth (fear of wasting vote) than RCV does in many cases.

  *(Final Polish)*: Ensure the "One-Pager" section sounds like it belongs in a newsletter, not a math textbook.

