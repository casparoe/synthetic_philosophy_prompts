      *   *No Expression:* "Legitimacy of norms." PSM assumes norms (codes/standards) are technically derived, not socially negotiated. ALARP implies a cost/benefit, not a social contract.

  5.  **Evaluate User's Pet Theory (Detection Latency & Legible Feedback):**
      *   User says: Good Loose vs. Bad Loose depends on how fast you see errors and how clear the signal is.
