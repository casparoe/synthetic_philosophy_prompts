      Okay, ready to write.

      *Wait, check Claim 3:* "Teletransporter... I'd say the person who shows up on Mars is me." Claim 1: "No self over and above causal stream." Claim 4: "Blame requires literal numerical identity."
      If Mars person is "me" (Claim 3), does that mean numerically identical? Claim 3 says "I don't think there's any further fact that settles it." So Claim 3 is anti-realist about identity. Claim 4 is realist/requirement-based about identity. This is a direct clash.
      Okay, I will focus heavily on Claim 4 being the problem child.

      *Scenario Construction:*
