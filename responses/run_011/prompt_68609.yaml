answer: |-
  You have identified the two poles of the **Problem of Material Constitution**. Your first puzzle is the *diachronic* problem (identity over time); your second is the *synchronic* problem (identity at a time, distinguished by modal properties).

  You are correct that the standard textbook label for the second puzzle is **The Statue and the Clay** (or the Problem of Coincident Objects). However, that label names the *example*, not the *reasoning pattern* you have isolated. You are asking for the name of the logical engine that turns one table into two objects based on counterfactuals read off of names.

  Here is the carving you requested.

  ### 1. The Established Candidates

  There are three nested concepts in the literature that compete to name this pattern. None captures your specific grievance perfectly, but one captures the mechanism.

  **A. Coincidentism (or The Coincidence View)**
  *   **Definition:** The view that two distinct material objects can occupy the same spatial region at the same time.
  *   **Fit:** This names the *result* of the argument (the room contains more objects than it appears to), but it does not name the *reasoning pattern* that gets you there. It describes the ontology, not the inference.
  *   **Failure:** It is silent on *why* they are two. A Coincidentist could believe they are two because of different historical origins, not just modal properties. It misses your insight about the names.

  **B. The Argument from Modal Properties (via Leibniz's Law)**
  *   **Definition:** The logical form: $x = y$ only if $x$ and $y$ share all properties. The Clay has the property "could survive squashing." The Statue does not. Therefore, Clay $\neq$ Statue.
  *   **Fit:** This names the *logical shape* you described ("the argument... always has the same shape").
  *   **Failure:** It treats the modal properties ("could survive") as brute facts about the world. It does not capture your observation that these properties are "read straight off the way the thing was named." It obscures the source of the divergence.

  **C. Sortal Essentialism**
  *   **Definition:** The metaphysical thesis that an object's persistence conditions (what it can survive) are determined by its *sortal concept* (the kind of thing it is—e.g., "statue" vs. "lump," "chair" vs. "assembly of parts").
  *   **Fit:** This is the strongest candidate. It explains *why* the names matter. Under Sortal Essentialism, "Statue" carries a rule (cannot survive squashing) and "Clay" carries a rule (can survive squashing). When you apply two sortals to one region of space, Sortal Essentialism licenses the conclusion that there are two objects.
  *   **Failure:** It validates the move you find suspect. It treats the sortal-boundaries as mind-independent metaphysical facts. It does not capture your intuition that this is a linguistic sleight-of-hand ("swapping one name for another inside a sentence about what might have happened").

  ### 2. The Best Fit

  **Sortal Essentialism** is the established term for the engine driving the multiplication.

  If you tell a metaphysician, "I see a pattern where applying different sortals generates distinct objects via modal divergence," they will hear **Sortal Essentialism**. It is the commitment that makes the "Statue/Clay" argument work. Without it, the modal differences dissolve (because the object just *is* the matter, or just *is* the form).

  However, Sortal Essentialism assumes the multiplication is *real*. Your description suggests you view the multiplication as *artifact*. You are describing the *application* of Sortal Essentialism in a way that feels like a category error.

  ### 3. The Missing Concept (A Coinage)

  Because existing terms describe the *metaphysics* (what exists) rather than the *linguistic maneuver* (how we count), and because you rightly identify a potential illicit slide from language to ontology, I propose a term that captures the specific pattern you have witnessed in the lab and the insurance dispute.

  **Term:** **Modal Sortal Reification**

  **Definition:** The inference of ontological distinctness from sortal-relative persistence conditions, treating conceptual boundaries as mind-independent modal facts.

  **The Carving:**
  This term isolates the specific move you flagged: taking a *sortal* (a name/category like "chair" or "table"), extracting its *modal profile* (what it can survive), and *reifying* that profile into a distinct physical object.

  *   **Step 1 (Sortal Application):** We apply "Table" and "Arrangement of Parts" to the same wood.
  *   **Step 2 (Modal Extraction):** We note "Table" implies "cannot survive disassembly" and "Arrangement" implies "can survive disassembly."
  *   **Step 3 (Reification):** We conclude there are two objects, rather than concluding that "Table" and "Arrangement" are two ways of counting one object.

  **Boundary Cases:**

  1.  **Vs. Puzzle 1 (Diachronic Identity):**
      *   *Puzzle 1* asks: "Is this object at $T_2$ the same as the object at $T_1$?" (Identity over time).
      *   *Modal Sortal Reification* asks: "Are these two descriptions at $T_1$ two objects?" (Multiplicity at a time).
      *   *Boundary:* If the argument relies on *history* (e.g., "This leg is new"), it is Puzzle 1. If it relies on *counterfactuals* (e.g., "This could be squashed, that could not"), it is Modal Sortal Reification.

  2.  **Vs. "Arguing About Words" (Verbal Dispute):**
      *   A mere verbal dispute admits that the physics is identical and only the labels differ.
      *   *Modal Sortal Reification* goes further: it uses the labels to *claim* extra physical ontology (e.g., for insurance payouts, cataloguing distinct assets).
      *   *Boundary:* If the dispute ends with "We agree on the wood, just not the word," it is verbal. If it ends with "We agree on the wood, therefore we must pay for two assets," it is Modal Sortal Reification.

  ### 4. Why This Fits Your Experience

  You noted that "the furniture of the room seems to multiply with the number of ways of describing it." In philosophy, this is the critique leveled by **Conceptual Relativists** (like Hilary Putnam) or **Deflationary Ontologists** (like Amie Thomasson). They argue that existence questions are often internal to a conceptual scheme.

  However, in the conservation lab and the insurance office, this conceptual relativity is treated as **Modal Sortal Reification**. The conceptual scheme is hardened into an ontological fact to license a payout or a catalog entry.

  **Summary:**
  *   **Puzzle 1:** Diachronic Identity (Ship of Theseus).
  *   **Puzzle 2 (Standard Name):** The Problem of Material Constitution (Synchronic).
  *   **Puzzle 2 (The Reasoning):** The Argument from Modal Properties.
  *   **Puzzle 2 (The Metaphysics):** Sortal Essentialism.
  *   **Puzzle 2 (Your Critique/Pattern):** **Modal Sortal Reification**.

  You are witnessing **Sortal Essentialism** being operationalized as **Modal Sortal Reification**. The philosophers call it "constituting distinct objects"; you call it "swapping names inside a sentence about what might have happened." The latter is the more precise description of the *move*, even if the former is the name of the *theory*.
