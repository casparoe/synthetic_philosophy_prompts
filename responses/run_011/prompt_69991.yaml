answer: |-
  ### Position Statement: The Nature of the Problem

  The difficulty is **an ordinary case of decision-making under deep uncertainty.** It is not a moral problem requiring us to abandon consequentialism.

  **What follows from picking this:**
  We accept the Board's policy (maximize expected value) as the correct moral compass. The stalemate is not about *what* we value, but about *how we calculate* value when data is missing. The solution is not to change the goal, but to install rigorous guardrails on how we estimate probabilities and magnitudes under ignorance. We do not need a new moral theory; we need a better epistemology.

  **The strongest case for the other answer (Moral Problem):**
  The moral argument posits that treating human beings as variables in an expected-value equation violates their dignity, particularly in criminal justice (Case B) or development (Case A). It suggests we have duties to *process* (rights, consent, local accountability) that cannot be traded off against *outcomes* (infections averted, risk reduced).

  **Why it does not move me:**
  Our mandate is grantmaking, not governing. We are not the state; we do not hold a monopoly on force. Our moral obligation is to use our private resources to improve the world as effectively as possible. Ignoring long-term consequences because they are hard to measure is not a moral virtue; it is a form of negligence disguised as humility. Conversely, chasing speculative tails without evidence is not moral seriousness; it is gambling. Both factions are making epistemic errors, not moral ones. We can respect rights by encoding them as "negative infinity" constraints within the EV framework (e.g., "Do not fund projects that violate human rights regardless of benefit") without abandoning the goal of maximizing good.

  ---

  ### The Traceable Value Protocol (TVP)

  **Purpose:** To produce an auditable recommendation (Fund, Decline, Condition, Refer) in under two hours.
  **User:** Program Officer.
  **Auditor:** Executive Director (requires traceability for every ranking).

  #### Step 1: Establish the Direct Baseline (The Floor)
  *Action:* Quantify the near-term, direct effects supported by evidence (RCTs, audits, historical data).
  *   **Sufficient Answer:** A numerical range (Low/High) for the primary metric (e.g., "500–700 infections averted") with a cited source.
  *   **Merely Looks Like an Answer:** "Significant impact expected" or "Based on partner reports."
  *   **Handling "Unknown":** If direct effects are unknown, write: *"Direct Baseline = 0."* Do not guess. This does not auto-decline the grant, but it removes the "Floor."
  *   **Documentation:** Attach the specific evaluation report or data table used.

  #### Step 2: Taxonomy of Ignorance (The Uncertainty Audit)
  *Action:* Categorize every major unknown effect identified in the file or staff review. Use only these three categories:
  1.  **Parameter Uncertainty:** We know the direction (good/bad) and the mechanism, but not the magnitude. (e.g., "We know wages will rise, not by how much.")
  2.  **Model Uncertainty:** We know the mechanism might exist, but the direction is contested. (e.g., "Cash transfers might distort markets or stimulate them.")
  3.  **Structural Ignorance:** We cannot specify the mechanism or the actors affected (e.g., "Political shifts in 20 years," "Existential risk mitigation").
  *   **Sufficient Answer:** Each unknown is tagged 1, 2, or 3.
  *   **Merely Looks Like an Answer:** "Long-term effects are uncertain."
  *   **Handling "Unknown":** If the category is Structural Ignorance (3), proceed to Step 3. If Parameter (1), proceed to Step 4.
  *   **Documentation:** A table listing the uncertainty, the category, and the evidence gap.

  #### Step 3: The Speculative Override Rule (The Ceiling)
  *Action:* Determine if remote/speculative consequences (Category 2 or 3) can override the Direct Baseline.
  *   **The Rule:** Speculative consequences may **only** override a negative Direct Baseline or justify funding when the Direct Baseline is zero if **two conditions** are met:
      1.  **Mechanism Plausibility:** The causal chain from grant to outcome is documented in peer-reviewed literature or historical precedent (even if magnitudes vary).
      2.  **Probability Floor:** A minimum probability is assigned based on the *strength of the mechanism*, not the *magnitude of the outcome*. If the mechanism is contested (Model Uncertainty), the probability assigned for EV calculation cannot exceed 5%.
  *   **Sufficient Answer:** "Mechanism Plausibility: Verified/Contested/Invented." "Probability Cap: X%."
  *   **Merely Looks Like an Answer:** "The stakes are too high to ignore."
  *   **Handling "Unknown":** If Mechanism Plausibility is "Invented" (no precedent for the causal link), the Speculative Value = 0.
  *   **Documentation:** Citation of the literature establishing the mechanism.

  #### Step 4: Discounting and Time (The Rate)
  *Action:* Apply the discount rate to costs and benefits.
  *   **The Rule:**
      *   **Financial Costs:** Apply the standard 3% annual discount rate (time value of money).
      *   **Human Welfare Benefits:** Apply **0% discount rate** up to a 50-year horizon.
  *   **Argument:** A 3% discount on human welfare implies a life saved next year is worth 3% less than a life saved today. This is morally indefensible for a foundation. However, financial capital has an opportunity cost. Separating the two satisfies the auditor (financial rigor) and the mission (moral weight).
  *   **Sufficient Answer:** Two NPV calculations: one for cost (3%), one for benefit (0%).
  *   **Documentation:** The spreadsheet showing the split calculation.

  #### Step 5: Decision and Referral (The Termination)
  *Action:* Combine Baseline + Speculative Cap - Costs.
  *   **Fund:** Positive EV, Uncertainty is Category 1 (Parameter).
  *   **Decline:** Negative EV, or Speculative Value = 0 due to "Invented" mechanism.
  *   **Fund Conditionally:** Positive EV, but Category 2 (Model) uncertainty exists. Requires monitoring plan to resolve uncertainty.
  *   **Refer:** Positive EV, but Category 3 (Structural) uncertainty dominates the value proposition. This is a value judgment on risk tolerance, not a fact judgment.
  *   **Who Decides:**
      *   Officer: Fund / Decline.
      *   Executive Director: Fund Conditionally (approves monitoring costs).
      *   Board: Refer (accepts Structural Ignorance risks).
  *   **Documentation:** The "Decision Matrix" checklist signed by the officer.

  #### Honest Accounting of Judgment and Gameability
  *   **Judgment Calls:** Step 3 (Mechanism Plausibility) is a judgment call. The procedure admits this by requiring the officer to cite the *source* of the plausibility claim. The ED audits the source, not the judgment.
  *   **Gameability:** An officer could label a speculative benefit as "Parameter Uncertainty" to bypass the cap.
      *   *Mitigation:* The "Pre-Mortem" Requirement. The officer must attach a one-page memo titled "How This Could Fail." If the Pre-Mortem lists risks that match Category 2 or 3 Ignorance, but the file claims Category 1, the ED returns the file.
  *   **Leak Strategy:** If applicants read this, they will write proposals that claim "Mechanism Plausibility." This is desirable. It forces them to ground claims in literature rather than aspiration.

  ---

  ### Application to Current Files

  #### File A: Unconditional Cash Transfer Scale-Up ($1.2M)
  *   **Step 1 (Baseline):** Direct effects (consumption, health) verified by RCTs. Positive EV. *Baseline = High.*
  *   **Step 2 (Ignorance):** Colleague objection (market distortion, political accountability). This is **Model Uncertainty (Category 2)**. Direction is unknown (could be good or bad).
  *   **Step 3 (Override):** Speculative risks do not override the positive baseline, but they cap the *net* EV. We cannot assume the distortion is zero.
  *   **Step 4 (Discount):** Costs discounted at 3%. Benefits at 0%.
  *   **Step 5 (Decision):** **Fund Conditionally.**
      *   *Reasoning:* Direct baseline is strong. Model uncertainty is significant but not "Invented."
      *   *Condition:* 10% of grant budget allocated to longitudinal monitoring of wage structures and local political accountability.
      *   *Sign-off:* Officer recommends Fund; ED approves Condition.
  *   **Officer Sentiment:** Satisfied. The grant moves, but with necessary safeguards.

  #### File B: Court Fees Advocacy ($300k)
  *   **Step 1 (Baseline):** Direct effect (40,000 people, small dollar amount). Positive EV. *Baseline = Low.*
  *   **Step 2 (Ignorance):** Systemic precedent (other states follow). This is **Model Uncertainty (Category 2)**. Direction is known (good), magnitude unknown.
  *   **Step 3 (Override):** Mechanism Plausibility: **Verified.** Policy diffusion is a well-documented phenomenon in state legislatures. Probability Cap applied at 5% for the "other states" benefit.
  *   **Step 4 (Discount):** 0% on welfare benefits (justice served).
  *   **Step 5 (Decision):** **Fund.**
      *   *Reasoning:* Low cost. Positive direct baseline. Speculative upside is capped but non-zero due to verified mechanism.
      *   *Sign-off:* Officer recommends Fund.
  *   **Officer Sentiment:** Satisfied.

  #### File C: Doctoral Fellowship / Existential Risk ($500k)
  *   **Step 1 (Baseline):** Direct effect (trained researchers). Positive EV. *Baseline = Very Low* (relative to cost).
  *   **Step 2 (Ignorance):** Risk reduction (pathogen/AI). This is **Structural Ignorance (Category 3)**. We do not know the probability of the risk, nor the elasticity of risk reduction to fellowships.
  *   **Step 3 (Override):** Mechanism Plausibility: **Contested/Invented.** The link between "general doctoral fellowship" and "specific mitigation of engineered pathogen misuse" is not documented in peer-reviewed literature. The ED's note ("tail is invented") aligns with Step 3 criteria.
      *   *Application of Rule:* Since Mechanism is not Verified, Speculative Value = 0 for decision purposes.
  *   **Step 4 (Discount):** Irrelevant, as Speculative Value is 0.
  *   **Step 5 (Decision):** **Decline.**
      *   *Reasoning:* Direct Baseline is too low to justify $500k on its own. Speculative Upside is inadmissible because the causal mechanism is not established.
      *   *Sign-off:* Officer recommends Decline.
  *   **Officer Sentiment:** **Not Wanted.** The officer believes the tail dominates. The procedure forces them to admit the mechanism is unproven.

  ---

  ### Limitations: What This Procedure Cannot Do

  1.  **It Cannot Resolve Bad Faith:** If a trustee is committed to funding Case C regardless of evidence, this procedure will not stop them. It only exposes the epistemic gap. It forces the Board to vote on "Ignoring Staff Protocol" rather than "Funding Grant," which is a higher political bar.
  2.  **It Cannot Predict Black Swans:** The Taxonomy of Ignorance categorizes *known* unknowns. It cannot account for risks we do not yet know exist.
  3.  **It Surrenders "Pure" Expected Value:** By capping speculative probabilities (Step 3) and separating discount rates (Step 4), we are acknowledging that we cannot actually calculate true EV. We are calculating **Auditable Expected Value.** We surrender the claim to mathematical optimality in exchange for defensibility.
  4.  **It Shifts Burden to the Board:** By referring Category 3 (Structural) uncertainties to the Board, we admit that staff cannot make value judgments on existential risk tolerance. This may frustrate a Board that wants staff to "just decide."

  **The Least Bad Version:**
  If you view this as too restrictive, the alternative is to allow "Narrative EV" where officers argue for speculative impacts without probability caps. I advise against this. It returns us to the stalemate. The procedure above forces the "Long-Run Dominance" faction to build the evidence for their mechanisms, and the "Local Verifiability" faction to accept 0% discounting on human welfare. It meets in the middle on *process*, even if it disagrees on *outcomes*.

  **Final Instruction:**
  Execute the TVP on File C immediately. Prepare the Decline memo citing Step 3 (Mechanism Plausibility). When the trustee asks why, show them the Step 3 rule. If they wish to override it, they must vote to amend the Giving Policy. That is the correct venue for a moral disagreement, not a grant review meeting.
