answer: |-
  1. Welcoming The Mixed Room Today
  Welcome everyone. We have gathered a room that rarely exists. Epistemologists who analyze how we trust each other sit beside psychologists who study what happens when trust fails. Historians of Victorian thought share tables with researchers running controlled tests on anomalous events. This mix is deliberate. It is also fragile. If I speak too much like a philosopher, the scientists will check their watches. If I speak too much like a scientist, the historians will miss the context. So I will try to speak like someone who knows that evidence is hard to gather and harder to interpret. We are not here to convert anyone. We are here to test how we speak about things that resist easy explanation. There are about sixty of us. Roughly a third of you would call yourselves skeptics. A third would be offended by the word. The rest are simply here to work.

  2. Sidgwick The Investigator Of Facts
  Consider Henry Sidgwick. He held Cambridge's chair in moral philosophy, but he also founded the Society for Psychical Research. His founding statement committed the group to approach questions without prejudice or prepossession of any kind, and in the same spirit of exact and unimpassioned enquiry which has enabled science to solve so many problems, once not less obscure nor less hotly debated. He meant it. He treated the elimination of fraud as a duty, not a nuisance. In the early eighteen-nineties, he oversaw the Census of Hallucinations. They sent a standardized question to seventeen thousand ordinary people. They asked if anyone had ever had a vivid waking impression of a person appearing to them. Then they checked how many of those impressions coincided with that person's death. This was testimony converted into a base rate, a simple frequency count. He gathered data not from spiritualist circles, but from people with no interest in the answer.

  3. Sidgwick The Moralist Needing Hope
  But Sidgwick was not only an investigator. He was a moral philosopher who ended his major work in a problem. He argued that prudence and duty cannot be shown by argument to coincide. They only match if we assume a moral government of the universe and a life beyond this one. So the man who most needed the anomalous evidence to come out one way had agreed to referee it. He needed the phenomena to be real to make his ethics work. Yet he turned out to be a good referee. He died an agnostic. He remained unconvinced by the phenomena he had spent two decades investigating. He never claimed otherwise. He understood that needing a truth is not the same as finding it. This tension between what he needed and what he found is where we begin.

  4. Keeping Two Ledgers Apart Clearly
  I propose we view this through two ledgers. The first records what the testimony licenses you to assert. The second records what your ethics or worldview requires to be true. Sidgwick's achievement was refusing to make an entry in the first on the authority of the second. That is our working rule for today. Nobody writes from the second ledger into the first. But nobody is asked to pretend the second ledger does not exist. We all have needs for the world to be a certain way. I keep one too, though I promise not to balance them during coffee. If we hold this distinction, we can share a room without demanding conversion. The psychologists can describe the experience. The epistemologists can assess the claim. The historians can track the context. We just must not let the need drive the evidence.

  5. Handing Over The Day To You
  So let us proceed with that scruple in mind. We are not here to solve the mystery of consciousness in a day. We are here to see if we can discuss the unexplained without explaining it away too quickly. The parapsychologists among us have spent careers on pre-registered designs, meaning plans written before data collection. The psychologists study anomalous experiences as ordinary features of human minds. The epistemologists study when belief is responsible. These are not conflicting tasks. They are complementary checks on our own certainty. If we can keep the ledgers separate, we might learn something about testimony itself. When reports ought not to be true, how do we decide they are? I will stop now. The afternoon session has a chair who knows far more about rigorous methods than I do. Thank you for coming, and please keep your pens in the right ledger.
