answer: |-
  1. **Action:** He says, "I didn't make that call." He does not add who did. Afterwards, he calls it "Keeping the transcript accurate." He accepts she may still think him a coward for knowing; that is her inference, not his statement.

  2. **The Rule:** "Literal Compliance." He owes the listener the truth value of the specific utterance requested, not the truth of the situation. He is a witness, not a narrator. His obligation ends at the full stop.

  3. **Alternative Rules:**
      *   **The Spousal Seal:** Confidentiality owed to his wife supersedes clarity owed to descendants. Her secrets die with her.
      *   **The Adversarial Default:** He treats all queries as cross-examination unless intimacy proves otherwise. He defends against implication rather than volunteering exculpatory context.

  4. **The Split:** The funeral splits "Literal Compliance" from "Correcting the World." Ray argues silence is not speech; therefore, letting her believe a falsehood via silence is not lying. It is allowing her to construct her own case. However, the "Direct Query" rule (from the diary incident) forces speech. He speaks to satisfy the query ("Was it you?"), not to satisfy her need for closure ("Who betrayed us?"). The line survives because he corrects the *fact*, not the *world*. He lets her hate him for the silence, which is true, rather than hate him for the call, which is false.

  5. **Next Scene:** A phone call from Melbourne, three days later. She says, "Dad said you knew." Ray says, "I knew she would." He confirms the knowledge without confirming the betrayal. It tests whether he will defend his character or just his words.

  6. **The Cracks:** You have written him consistently, but the principle shifts from *Protection* to *Precision*.
      *   1984 (Police): Protection of self/flatmate against state overreach.
      *   Diary (Daughter): Protection of daughter's autonomy against parental secrecy.
      *   The inconsistency you fear is actually the variable: *Who holds the power?* When Ray holds power (over the neighbour, the client), he withholds. When the queryer holds moral power (the daughter), he discloses. The granddaughter holds moral power (dying father), so he answers. But the wife holds contractual power (marriage), so he withholdsher name. The tension is correct.

  7. **Lying vs. Misleading:** His record commits him to lying being *worse*. Lying is a structural breach of the contract of language; misleading is a tactical use of it. A lie breaks the tool; misleading uses the tool sharply. This is vital for your ending. He will never lie to save her feelings. He will, however, hand her a truth that cuts her. If he must choose between her pain and his integrity, he chooses his integrity every time, because he believes a broken word is permanent, while pain is transient. He is not a good man; he is a precise one.
