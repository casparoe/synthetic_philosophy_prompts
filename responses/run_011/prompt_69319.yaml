answer: |-
  "The entropy curve just turned over," Elena said, pointing at the lower panel. "Look. Right at the pulse inversion. It's coming back down."

  Marcus leaned against the console, arms crossed. "The entanglement entropy of the half-array is coming back down. The von Neumann entropy of the whole ten-qubit state is constant. It has been constant since the initialization pulse."

  "You know what I mean. The accessible entropy. The thermodynamic entropy relative to the control basis."

  "Do I?" Marcus tapped the glass. "This panel plots $S = -\text{Tr}(\rho_A \ln \rho_A)$. That subscript $A$ is doing all the work. It denotes a factorization of the Hilbert space into 'half-array' and 'rest.' That factorization isn't in the hardware. It's in the model. You chose to split the qubits spatially. You could have split them by parity, or by eigenmode. If you'd chosen the eigenbasis of the Hamiltonian, this curve would be flat. The arrow you think you're seeing is a shadow cast by the cut you made."

  Elena shook her head. "The cut isn't arbitrary. The qubits are physically distinct objects on a chip. They couple to nearest neighbors. The dynamics respects that geometry. If I split by parity, I'm grouping physically disjoint degrees of freedom. That's not a natural macrovariable. The dynamics selects the stable variables. That's why the entropy rises in the spatial basis and not the energy basis. The arrow is in the interaction graph, not in my choice of plot."

  "But the interaction graph only matters because you're embedded in it," Marcus countered. "You're a subsystem trying to predict the rest. If you were a god outside the Hilbert space, there would be no entropy increase. There would just be unitary rotation. The Second Law isn't a law of the world; it's a theorem about the limitations of a subsystem trying to model a larger system it's entangled with. This experiment proves that. You reverse the Hamiltonian, you reverse the arrow. That means the arrow wasn't fundamental. It was contingent on the drive."

  "Wait," Elena said, holding up a hand. "We're using 'closed' in two different ways. When I say the system isn't closed, I mean it's coupled to the cryostat, the control lines, the amplifiers. Heat is dumping into the dilution refrigerator. When you say the system is closed, you mean it's evolving unitarily without decoherence. If we were truly closed in my sense, we couldn't control it at all. We'd have no handle to reverse the Hamiltonian."

  Marcus nodded slowly. "Fair. You mean thermodynamically open; I mean quantum mechanically isolated. But even if we grant the heat bath, the point stands. The entropy decrease on this screen is purchased by entropy increase in the control electronics. You know the Landauer cost. To reverse the Hamiltonian, you had to acquire information about the state and then erase the control instructions. That erasure dumps heat. The global entropy goes up. So why call this a reversal of time? It's just a local fluctuation powered by a global gradient."

  "Because the gradient has a direction," Elena said. "That's the whole point. The reason the heat dumps out and doesn't suck back in is the Past Hypothesis. The universe started in a low-entropy state. That boundary condition fixes the direction of the gradient. My experiment rides that wave. It doesn't create it. The press release was wrong to say we reversed time, but not because the arrow isn't real. It's because we're surfing, not steering the ocean."

  "And there it is," Marcus said. "The Past Hypothesis. You treat it as a law, or at least a nomological constraint. I treat it as a contingent fact. If it's just a contingent fact that the universe started smooth, why does it govern the validity of our records? Why does it explain why I remember the past and not the future?"

  "Because records are physical traces," Elena said. "A footprint in the sand is a low-entropy configuration correlated with a past event. To make it, you increase entropy elsewhere. The asymmetry of records is grounded in the asymmetry of entropy production."

  "But a trace is only a record relative to an inference," Marcus pressed. "I look at the footprint and infer the foot. That inference works because I assume the sand was previously smooth. That assumption is the Past Hypothesis. But if I assume the universe is in thermal equilibrium, the most likely explanation for the footprint is a random fluctuation. A Boltzmann brain. You know the worry. If the universe is eternal and ergodic, it's overwhelmingly more likely that you are a brief fluctuation with false memories than a descendant of a low-entropy beginning. Your theory predicts you shouldn't exist."

  Elena frowned. "That's the fluctuation worry. It's a reductio of the equilibrium model, not my model. We aren't in equilibrium. We're in the relaxation phase from the special initial condition."

  "But how do you know?" Marcus asked. "All you have access to is your current state and your records. Your records tell you there was a low-entropy past. But the records themselves are just physical states. To trust them, you must assume the Past Hypothesis. To justify the Past Hypothesis, you trust the records. It's circular. Unless you posit the Past Hypothesis as a law, not a fact. But then you're adding a surcharge to physics to save the appearance of time."

  Elena was silent for a moment, watching the fidelity curve on the upper panel. It was recovering, but not to one. "I'm not positing it as a dynamical law. It's a boundary condition. But I need to adjust something here." She turned to him. "You're right that if I define a record just as a correlation, it's symmetric. A correlation between A and B doesn't say which caused which. I need to give up the idea that correlation alone makes a record. A record is a physical state that is stable against future noise but not past noise. It's about robustness. I'm conceding that 'trace' isn't enough. It has to be a stable trace. That stability is what picks out the future direction."

  "Stability relative to what perturbation?" Marcus asked.

  "Relative to the generic interactions of the environment," Elena said. "The ones that scramble phase information. That's objective. The environment doesn't care about my description."

  "But the 'environment' is just the rest of the system," Marcus said. "And 'generic interactions' are just the terms in the Hamiltonian that couple your subsystem to the rest. You're back to the factorization. If I choose a factorization where the subsystem doesn't couple to the rest, there's no scrambling. There's no stability issue. So the arrow still depends on the split."

  "Not any split works," Elena insisted. "Only the ones that correspond to local interactions."

  "Local in space," Marcus said. "But space is emergent. In the fundamental theory, there's just the Hilbert space. Spatial locality is a feature of the Hamiltonian, yes, but the Hamiltonian is a description of the dynamics. You're grounding the arrow in the dynamics, but the dynamics is just the rule for how the state changes. If you reverse the rule, you reverse the arrow. That's what you did here. You changed the sign of $H$. The entropy went down. So the arrow flipped. Which means the arrow isn't in the universe. It's in the sign of the Hamiltonian term you chose to implement."

  "That's trivial," Elena said. "If I reverse the forces, the ball rolls up the hill. That doesn't mean gravity isn't real. It means I applied a force larger than gravity."

  "Is it trivial?" Marcus paused. He looked at the entropy curve, now halfway back down. "I think I need to concede something too. If I say entropy is purely descriptive, I risk making the Second Law tautological. 'Entropy increases relative to descriptions that see entropy increase.' That's empty. I need to tighten my view. It's not just any description. It's descriptions available to embedded agents with limited computational resources. I'm giving up the idea that *any* factorization counts. It has to be a factorization the agent can actually access and manipulate. The arrow is real relative to the agent's causal powers."

  "So it's subjective," Elena said.

  "No, it's relational," Marcus corrected. "Like velocity. Velocity isn't a property of an object; it's a relation between object and frame. But it's not arbitrary. You can't just claim any velocity. You have to specify the frame. Here, the frame is the agent's macroscopic access. The Second Law says: given your access, you cannot predict better than this. It's a constraint on control, not a constraint on being."

  "But the constraint on control comes from the thermodynamics," Elena argued. "You can't control it because the heat bath is too big. The bath is big because the universe started small. We're back to the cosmology."

  "And the cosmology is a fact we infer from records," Marcus said. "Which brings us back to the circle. But let's look at the cost. You mentioned the control electronics. To run this reversal, you had to store the pulse sequence. Then you had to erase it to reset for the next shot. That erasure costs $k_B T \ln 2$ per bit. That heat goes into the fridge. That entropy increase is vastly larger than the entropy decrease on this screen."

  "Agreed," Elena said. "That's why the global arrow doesn't flip. Only the local one does."

  "But where is the global one?" Marcus asked. "The fridge is part of the lab. The lab is part of the Earth. The Earth is part of the universe. If the universe is a closed quantum system, its von Neumann entropy is constant. So where is this global entropy increasing? You keep saying 'global,' but you never define the boundary. If you say 'the whole universe,' you're invoking a quantity that doesn't exist in quantum mechanics. If you say 'the observable universe,' you're invoking a horizon defined by light cones, which depends on the metric, which depends on the matter distribution. It's descriptions all the way down."

  Elena sighed. "I mean the thermodynamic entropy of the matter and radiation fields. Coarse-grained over macrostates."

  "Whose macrostates?"

  "The ones the dynamics makes stable," Elena repeated.

  "We're looping," Marcus said. "Let's try to find a divergence. Is there any observation we could make, in this room or in principle, where you would say 'entropy decreased' and I would say 'no, it didn't'?"

  Elena thought. "If we could isolate the entire lab perfectly. No heat leak. No control lines. Just a box. If we could reverse the Hamiltonian of every particle in the box, including the control electronics, including our own brains. Then the entropy of the box would decrease. The records in our brains would un-write. We would forget the forward evolution."

  "And what would you say happened?" Marcus asked.

  "I would say time reversed for the box," Elena said. "But I couldn't say it, because I'd have forgotten the forward phase. But from the outside, looking at the box, the entropy went down."

  "But there is no outside," Marcus said. "If the box is the universe, there is no outside. So you're saying if we reversed the universe, entropy would decrease. But to reverse the universe, you need a controller outside the universe. Which doesn't exist. So the reversal is impossible. Which means the entropy decrease is impossible. Which means the arrow is absolute."

  "No," Elena said. "It means the arrow is conditional on the boundary condition. If the boundary condition were different—if the universe started high and ended low—the arrow would point the other way. We would remember the future. But given our boundary condition, the arrow is fixed."

  "But you can't observe the boundary condition," Marcus said. "You only observe the local gradient. You infer the boundary condition from the gradient. So the gradient is the only observable. And the gradient depends on the factorization. So the arrow depends on the factorization."

  "Unless the factorization is unique," Elena said.

  "It's not."

  "Unless the *stable* factorization is unique."

  "Stable for whom?"

  Elena looked at the screen. The fidelity had plateaued. It wasn't going back to one. Control error had won. "We lost fidelity. Because the control wasn't perfect. Because the world is noisy."

  "The noise is just entanglement with degrees of freedom you didn't track," Marcus said. "If you tracked them, it would be unitary. You didn't track them because you couldn't. Because you're finite."

  "Because I'm human," Elena said. "But the qubits don't care if I'm human. They decohere because the substrate has two-level systems. That happens whether I'm there or not."

  "The substrate decoheres relative to the qubit basis," Marcus said. "If you chose the substrate's eigenbasis, the qubits would be the noise. You're privileging the qubit basis because that's what you built the device to measure. You built the arrow into the lab."

  "I built the device to exploit the arrow that was already there," Elena said. "I didn't build the superconductivity. I didn't build the Planck constant. I didn't build the low-entropy past."

  "You built the description that makes those things look like laws," Marcus said. "Look, we agree on the data. We agree on the equations. We agree that the fidelity is less than one. We agree that heat was dumped. The disagreement is ontological. You want to say the heat dump is real in a way the entropy decrease isn't. I want to say both are real relative to the description, and neither is absolute."

  "Is there a test?" Elena asked again. "If I can't test it, it's metaphysics. And I'm a physicist."

  "The test is whether you can find a description where the Second Law is violated without compensating cost," Marcus said. "I say you can't, because any violation implies a description change that restores the law. You say you can't because the cost is objective."

  "That's the same prediction," Elena said.

  "Then we agree on everything," Marcus said. "Except what the words mean."

  "No," Elena said. "Because if you're right, then the arrow is fragile. It depends on us. If we weren't here, there would be no arrow. Just state evolution. If I'm right, the arrow is here regardless. The stars burn regardless. The ice melts regardless."

  "The stars burn because of nuclear cross-sections," Marcus said. "Those are time-symmetric. The burning looks asymmetric because the fuel was concentrated. Why was it concentrated? Past Hypothesis. Why does that matter? Because we care about fuel. A rock doesn't care. The rock just sits there. The arrow is the story we tell about the rock."

  "The rock erodes," Elena said. "It doesn't un-erode. That's not a story. That's wear."

  "Wear is entropy increase," Marcus said. "Which is description-dependent."

  They stood in the silence of the control room. The cryostat hummed behind the wall, a steady, low thrum. On the screen, the entropy curve had stabilized at a value higher than where it started. The fidelity was stuck at 0.6.

  "If I run this tomorrow," Elena said, "the curve will look the same. The error will be the same. The heat dump will be the same. The world will behave as if the arrow is real."

  "It will behave as if the arrow is real for you," Marcus said. "Because you'll be there to measure it. And you'll be using the same description."

  "And if I'm not there?"

  "Then there's no measurement. Just unitary evolution."

  "And the heat?"

  "Dissipated into modes no one is tracking."

  "So it's real or not depending on whether someone tracks it?"

  "It's defined relative to the tracking."

  Elena turned off the screen. The room went dark, save for the status LEDs on the rack. "I need to write the paper. I need to say what happened."

  "Say the fidelity recovered partially," Marcus said. "Say the entanglement entropy turned over. Say the control cost was X joules."

  "And the arrow?"

  "Say the protocol reversed the sign of the Hamiltonian," Marcus said. "Let the readers decide if that reverses time."

  "They'll think it does," Elena said. "Because they live in time."

  "Exactly," Marcus said. "And because they live in time, they'll read your paper. If they didn't, it wouldn't matter."

  Elena picked up her notebook. "I'm writing that the arrow is objective. Because if I write that it's relational, I have to explain who the relation is to. And I don't want to explain that to the press again."

  "Then you're choosing a description," Marcus said. "The one that works for your audience."

  "I'm choosing the one that matches the hardware," Elena said. "The hardware doesn't care about the audience."

  "The hardware is part of the description too," Marcus said. "But yes. For this lab, your description is the stable one. It's the one that lets you get funding. It's the one that lets you cool the qubits. In that sense, it's objectively useful."

  "Useful isn't true," Elena said.

  "No," Marcus agreed. "But it's survivable. And for an embedded agent, that's the same thing."

  Elena opened the door to the hallway. The air out there was warmer. "Come to the workshop in the autumn. I'm moderating the session on this."

  "I'll be there," Marcus said. "But I won't concede the point about the universe."

  "I wouldn't expect you to," Elena said. "But bring your own data. If you can show me a plot where the entropy goes down without a Hamiltonian reversal, I'll listen."

  "I can't," Marcus said. "Because that would violate the Second Law relative to my description."

  "Then we agree," Elena said.

  "On the data," Marcus said. "Not on the world."

  They walked out together, leaving the screen dark, the frozen curve preserved in the memory of the machine, waiting for the next pulse to decide which way it would fall.
