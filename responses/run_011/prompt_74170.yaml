answer: |-
  The lecturer's conclusion does not survive because the analogy conflates distinct theoretical components and smuggles substantive ethical premises into the formal apparatus of rational choice.

  To audit the analogy, we must first set out the explicit correspondence the lecturer proposes between standard decision theory and the social choice context. In this mapping, the **single agent** is the impartial social planner (or impartial observer). The **states of the world** correspond to the possible identities of the members of society (i.e., being person $i$). The **lottery** is the veil of ignorance scenario wherein the planner faces an equiprobable distribution over these identities. The **payoffs** are the utility levels experienced by the individuals in those states. The **probabilities** are the chances assigned to occupying each social position, typically assumed to be equal ($1/n$).

  While this mapping is mathematically coherent within Harsanyi's specific framework, several disanalogies threaten the conclusion that utilitarianism is merely a theorem of rationality. Cosmetic disanalogies, such as the terminology of "voters" versus "states," are irrelevant. However, genuine disanalogies strike at the normative core of the argument.

  First, regarding whether members are states of the world or objects of weighting: treating individuals as states of the world collapses the distinction between intrapersonal and interpersonal compensation. In standard expected-utility theory, a single agent rationalizes losses in one state with gains in another because they are the same entity enduring both outcomes. In society, persons are distinct entities. To treat them as states of a single super-agent is to assert the "separateness of persons" is morally irrelevant—a substantive ethical claim, not a rationality constraint. If members are distinct moral patients, they cannot be reduced to contingent states without justifying why their distinctness should be ignored for the sake of aggregation.

  Second, regarding the nature of the probabilities: in standard decision theory, probabilities represent empirical frequencies or subjective degrees of belief about nature. In Harsanyi's ethical model, there are no objective chances that I will be born as someone else; I am who I am. Therefore, the probabilities cannot be empirical. They are normative coefficients justified by the ethical premise of equal moral worth. If these probabilities are merely coefficients, they are not derived from rationality but from a prior commitment to egalitarianism. If they are read as the hypothetical observer's ignorance, they rely on the moral validity of hypothetical consent, which is contested. Consequently, resisting the probability assignment is not resisting expected-utility theory; it is resisting the ethical justification for the equiprobability assumption.

  Third, regarding the timing of the lottery resolution: if the lottery is resolved *before* preferences are aggregated (the veil is lifted), the agent knows their identity and rational choice dictates maximizing their own specific utility, not the social sum. If the lottery is resolved *after* (the veil remains), the maximization of expected utility applies, but this scenario is counterfactual. Real social choice occurs with known identities. The analogy works only if one accepts that hypothetical risk should dictate actual policy, which is a moral stance on the relevance of actual versus hypothetical consent, not a logical necessity of rational choice.

  Furthermore, the move from a fixed weighted sum to equal weights is not licensed by the Aggregation Theorem itself but is supplied by the analogy. Harsanyi's Aggregation Theorem (1955) demonstrates that if individual and social preferences satisfy von Neumann-Morgenstern axioms and the Pareto principle, social welfare must be a weighted sum of individual utilities ($W = \sum a_i U_i$). It does not dictate that the weights ($a_i$) must be equal. The move to equal weights ($a_i = a_j$) comes from the Impartial Observer Theorem (1953), which relies on the substantive equiprobability assumption discussed above. The lecturer conflates these two results to present the ethical choice of equal weights as a mathematical inevitability of the aggregation theorem.

  Because the analogy relies on ethical premises regarding the separateness of persons, the normative status of hypothetical probabilities, and the justification for equal weights, the conclusion that utilitarianism is not a substantive moral doctrine fails. A better analogy for the theorem is not a single agent under risk, but a measurement problem: the theorem establishes the *scale* on which social welfare must be measured (cardinal utility), but leaves the *weights* on that scale to be determined by moral philosophy rather than rationality alone.
