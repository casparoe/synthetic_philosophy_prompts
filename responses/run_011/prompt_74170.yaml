  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   **Core Result:** If individual preferences and social preferences satisfy von Neumann-Morgenstern (vNM) axioms (specifically independence and continuity) and the Pareto principle holds, then the social welfare function must be a weighted sum of individual utilities. $W = \sum a_i U_i$.
      *   **Harsanyi's Impartial Observer Theorem (often conflated but distinct):** This involves an impartial observer imagining themselves behind a veil of ignorance, having an equal chance of being anyone. This leads to *classical utilitarianism* (equal weights).
