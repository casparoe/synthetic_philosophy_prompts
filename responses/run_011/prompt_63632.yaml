answer: |-
  ### Session Plan: The Boundary Problem (90 Minutes)

  #### 1. The Case Selection
  **Do not use the secession referendum.** It is too abstract and distant for a municipal assembly.
  **Do not use the actual non-citizen voting debate.** It is too heated; participants will arrive with fixed policy preferences that will obscure the structural paradox.

  **Use a Hypothetical Annexation Case.**
  *   **The Scenario:** A large, new housing development is built on the unincorporated border of the town. It uses town roads and the town water table, but its residents are not currently registered town voters. The town wants to tax them for a new school; the developers say "no taxation without representation." The town says "no representation without membership."
  *   **Why this case:** It mirrors the structural logic of the non-citizen debate (residence/stakeholding vs. formal membership) without triggering national sovereignty or immigration culture wars.
  *   **What it must have:** High stakes (taxes/schools), clear geographic ambiguity, and no existing statute that definitively settles it.
  *   **What it must lack:** Any reference to national citizenship, legal status, or ethnicity. It must be purely about *political membership*.

  #### 2. Your Instinct on Circularity
  **Your instinct is correct.**
  *   **Dependency:** The logical circularity (the *demos* cannot define itself democratically) is invisible in the abstract. It only becomes visible once the room attempts to resolve a concrete dispute where the outcome changes based on who is allowed to vote.
  *   **Sequence:** You must establish the stakes of the case *before* you introduce the theoretical paradox. If you explain the theory first, they will treat it as a riddle. If they feel the problem first, they will treat it as a dilemma.

  #### 3. The Sequence of Pieces (90 Minutes)

  **Phase 1: The Concrete Stake (0–20 mins)**
  *   **Action:** Present the Annexation Case. Ask the room: "Who gets to vote on whether this development joins the town?"
  *   **Dependency:** This must happen before any theory is introduced.
  *   **Goal:** Generate conflicting intuitions. Some will say "only current voters" (to protect the town); others will say "the new residents too" (because they are affected).
  *   **Misconception Head-off:** **"Everyone affected should have a say."**
      *   **Where:** Here, in Phase 1.
      *   **Who:** **Leave to surface from the room.** Do not propose this yourself. Let a participant offer it as the obvious solution.
      *   **Action:** Write it on the board as "The Affected Principle." Do not critique it yet. Let it stand as the group's proposed solution.

  **Phase 2: The Circular Trap (20–40 mins)**
  *   **Action:** Ask the group to vote on whether to adopt "The Affected Principle."
  *   **Dependency:** Depends on Phase 1 establishing "The Affected Principle" as the group's intuition.
  *   **The Turn:** Ask: "Who is eligible to cast *this* vote on who is eligible to vote?"
      *   If only current voters decide, the new residents (the "affected") are excluded from the decision about their inclusion.
      *   If the new residents vote, you have already assumed they are members, rendering the vote unnecessary.
  *   **Goal:** Make the circularity felt as a procedural deadlock, not a logical theorem.
  *   **Misconception Head-off:** **"This is a technical question about voter registration."**
      *   **Where:** End of Phase 2.
      *   **Who:** **You must raise this.**
      *   **Action:** Explicitly state: "This is not about how we fill out the forms. This is about whether our decision tonight is legitimate if the wrong people are in the room."

  **Phase 3: The Escape Hatch (40–60 mins)**
  *   **Action:** Ask: "If we can't vote on this, who decides? Can a judge decide? Can the state legislature decide?"
  *   **Dependency:** Depends on Phase 2 establishing that the local *demos* cannot decide this for itself.
  *   **The Turn:** Show that kicking it to a court or state body just moves the boundary problem up one level. (Who decided the judge has jurisdiction? Who decided the state legislature represents this town?)
  *   **Misconception Head-off:** **"A court or international body can settle the question."**
      *   **Where:** Phase 3.
      *   **Who:** **You must raise this.** It is a sophisticated objection that laypeople often assume is true.
      *   **Action:** Present it as the "Standard Solution," then demonstrate that it replicates the problem at a higher altitude.

  **Phase 4: Implications for Legitimacy (60–75 mins)**
  *   **Action:** Connect the Annexation Case back to the Assembly's actual work (Non-Citizen Voting).
  *   **Dependency:** Depends on Phase 3 closing off external authorities.
  *   **Goal:** Shift the focus from "Solving the paradox" to "Managing the paradox." Acknowledge that all boundaries are somewhat arbitrary, but the *awareness* of the arbitrariness changes how we justify them.
  *   **Action:** Explain that democratic legitimacy is not about finding the *correct* boundary, but about acknowledging the *cost* of the boundary we choose.

  **Phase 5: Comprehension & Bracketing (75–90 mins)**
  *   **Action:** The Final Question and the Declined Topics.
  *   **Dependency:** Depends on the group accepting that there is no clean solution.

  #### 4. The Final Comprehension Question
  Do not ask: "What should we do?" (This invites policy proposals).
  Do not ask: "Do you understand the theory?" (This invites nodding).

  **Ask this:**
  > "If we decide tonight that long-resident non-citizens *cannot* vote, what specific claim of legitimacy are we forced to give up? Conversely, if we decide they *can* vote, what definition of the community are we forced to abandon?"

  *   **Why:** This forces them to articulate the trade-off. If they answer correctly, they will identify that they cannot have both "pure democratic consent" and "fixed membership boundaries" simultaneously. They must show they see the loss on *both* sides.

  #### 5. Topics to Decline (The "Bracket")
  At the start of Phase 5, explicitly announce that the following are **out of bounds** for this session. Write them on a "Parking Lot" flipchart and refuse to engage them if raised:

  1.  **Federal Immigration Law:** We are not debating border enforcement or naturalization pathways.
  2.  **Historical Grievances:** We are not adjudicating past wrongs done to specific immigrant groups.
  3.  **Voter Fraud/Security:** We are assuming good faith administration; this is a theoretical session, not an audit.
  4.  **The Final Vote:** We are not taking a straw poll on the non-citizen voting issue today.

  **Instruction to Facilitator:** If a participant attempts to argue for/against non-citizen voting based on policy merits (e.g., "They pay taxes so they should vote"), interrupt and redirect: *"That is a valid policy argument, but right now we are examining the authority we have to make that argument. Please return to the boundary question."*

  ### Summary of Dependencies
  1.  **Case First:** You cannot explain the circularity (Phase 2) until they care about the outcome of the Annexation Case (Phase 1).
  2.  **Intuition First:** You cannot critique the "All Affected" principle until the room has proposed it themselves (Phase 1).
  3.  **Local Failure First:** You cannot explain why Courts fail (Phase 3) until they see why the Local Vote fails (Phase 2).
  4.  **Theory Last:** The connection to their actual work (Phase 4) must wait until the theoretical trap is fully sprung.
