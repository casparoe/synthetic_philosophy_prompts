      *   *Req 2: Extensional Stability (Syntax/Semantics).*
          *   Case: `return C` vs `x=1; if x==1: return C`.
          *   Need: Cooperation shouldn't hinge on whitespace or variable names.
      *   *Req 3: Meta-Equilibrium (Stability).*
          *   Case: Program pair $(P_1, P_2)$ yields $(C, C)$. Can $P_1'$ exploit $P_2$ for $D, C$?
          *   Need: The program submission itself must be stable.
      *   *Req 4: Computational Feasibility (Findability).*
          *   Case: Equilibrium requires solving Halting Problem.
          *   Need: Players must be able to verify the equilibrium within their bounds.
      *   *Req 5: Continuity with Opacity (Reduction).*
          *   Case: If read-access cost $\to \infty$, does it converge to Nash?
          *   Need: Bridge to classical theory.

  4.  **Evaluating "Non-Negotiable" vs. "Aesthetic":**

      *   *Non-Negotiable:* Well-definedness (Termination). If the game doesn't produce an outcome, it's not a game. Meta-Equilibrium. If the programs aren't stable, players won't submit them.
      *   *Aesthetic/Camp:* Extensional Stability. Some camps (Tennenholtz) accept source-matching. Others (Halpern/Pass) want semantic reasoning. This is a design choice, not a logical necessity.
      *   *Aesthetic:* Predictive Bite. Folk theorems are often features, not bugs, depending on if you want descriptive or normative power.

  5.  **Identifying Impossibility Results (The "Theorem-Shaped Claim"):**

      *   *The Trilemma:* Full Introspection + Extensional Stability + Computability.
