  7.  **Refining the Content (Self-Correction during drafting):**

      *   *Correction on "Findability":* Distinguish between the *referee* computing the outcome and the *players* computing the strategy. The prompt asks about players computing the equilibrium.
      *   *Correction on "Neighbors":* Make sure to distinguish from Commitment. Commitment is "I bind my hands." PE is "I show you my brain."
      *   *Tone Check:* Ensure the "concrete case" for each point is punchy. Use pseudo-code.
      *   *Impossibility:* Make sure the Rice's Theorem connection is clear.

  8.  **Final Polish:** Check against all constraints in the prompt.
