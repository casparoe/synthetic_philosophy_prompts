answer: |-
  Here are the desiderata for a theory of Program Equilibrium (PE), structured by requirement, concrete case, and necessity.

  ### 1. Well-Defined Execution (Termination)
  **The Requirement:** The mapping from a pair of submitted programs to a pair of actions must be total. For every valid pair $(P_1, P_2)$, the referee must produce an outcome $(a_1, a_2)$ in finite time.
  **The Concrete Case:**
  ```python
  # Player 1
  def P1(opponent_code):
      return opponent_code.run(P1)

  # Player 2
  def P2(opponent_code):
      return opponent_code.run(P2)
  ```
  If the referee simply executes `P1(P2)` and `P2(P1)`, the system hangs.
  **The Fix:** A theory must specify a halting condition (e.g., step-count timeout) and a **default action** (e.g., "Defect" or "Null") triggered by non-termination.
  **Status:** **Non-Negotiable.** Without this, the game form is ill-defined.

  ### 2. Meta-Equilibrium (Stability)
  **The Requirement:** The submitted program pair must constitute a Nash Equilibrium in the *meta-game* of program submission. It is not enough that $P_1$ and $P_2$ cooperate; it must be that neither player could have submitted a $P'_1$ to get a better payoff against $P_2$.
  **The Concrete Case:**
  Consider the Prisoner's Dilemma. $P_1$ and $P_2$ are "Cooperate-Bots" that output $C$ unconditionally. The outcome is $(C, C)$.
  However, Player 1 could submit $P'_1 = \text{"Always Defect"}$. Against $P_2$, $P'_1$ gets $D, C$ (temptation payoff).
  **The Fix:** The theory must explain why $P_2$ wouldn't simply be exploited. A valid PE requires $P_1$ to punish deviations (e.g., "Cooperate iff opponent cooperates with me").
  **Status:** **Non-Negotiable.** Without this, it is not an equilibrium concept, just a simulation protocol.

  ### 3. Extensional Stability (Syntax vs. Semantics)
  **The Requirement:** Outcomes should ideally depend on the *behavior* of the opponent's program, not its source representation. Benign recompilation should not trigger defection.
  **The Concrete Case:**
  ```python
  # Player 1
  def P1(opp):
      if opp.source == P1.source: return C
      else: return D

  # Player 2 (Semantically identical, syntactically distinct)
  def P2(opp):
      x = 1
      if x == 1: return C # Logic is 'Always C', but source differs
      else: return D
  ```
  $P_1$ defects against $P_2$ despite $P_2$ being a cooperator.
  **The Fix:** The theory must either restrict the language to canonical forms or allow programs to query *behavior* (e.g., "Simulate opponent on input X") rather than source.
  **Status:** **Aesthetic/Camp.** Tennenholtz's original formulation accepts source-matching (it's a "contract"). Halpern/Pass demand semantic reasoning. This defines the *flavor* of PE, not its validity.

  ### 4. Computational Feasibility (Findability)
  **The Requirement:** The players must be able to verify that their chosen program is a best response within their own computational bounds.
  **The Concrete Case:**
  Suppose the equilibrium strategy requires $P_1$ to verify: "Does $P_2$ halt on all inputs?"
  If $P_2$ is a general Turing Machine, $P_1$ cannot compute this (Halting Problem). If the theory posits this as the equilibrium, the players cannot rationally arrive at it.
  **The Fix:** The theory must bound the complexity of allowable programs (e.g., finite state machines) or the depth of introspection (resource-bounded PE).
  **Status:** **Non-Negotiable for Normative Theory.** If players cannot compute the equilibrium, it cannot guide rational play. (Descriptive theories may waive this).

  ### 5. Continuity with Opacity (Reduction)
  **The Requirement:** As the cost of reading code approaches infinity (or readability approaches zero), the solution concept should converge to classical Nash Equilibrium.
  **The Concrete Case:**
  A variant where reading the opponent's code costs \$1,000,000.
  **The Fix:** In the limit where no one reads, the programs effectively commit to actions without conditioning on the opponent. The PE set should collapse to the Nash set of the underlying matrix game.
  **Status:** **Strong Desideratum.** Ensures the theory is a generalization, not a disjoint alternative.

  ### 6. Distinctness from Neighbors
  **The Requirement:** The theory must distinguish itself from Correlated Equilibrium (CE), Superrationality, and Commitment Devices.
  **The Concrete Case:**
  *   **Vs. CE:** A mediator suggests $(C, C)$. In PE, the "mediator" is the code interaction itself. If PE allows any feasible payoff (Folk Theorem), it mimics CE.
  *   **Vs. Commitment:** Commitment is "I burn the bridge." PE is "I show you the map."
  **The Fix:** The theory must identify payoffs achievable in PE that are *not* achievable via simple pre-play commitment (e.g., conditional commitments that are impossible to write in natural language but easy in code).
  **Status:** **Non-Negotiable.** Without this, the concept is redundant.

  ### 7. Robustness to Deception (Asymmetry/Lying)
  **The Requirement:** The theory must account for the difference between *submitted* code and *executed* code, or partial observability.
  **The Concrete Case:**
  Player 1 submits source code $S_1$ to the referee. Player 2 reads $S_1$. However, the referee actually executes $S'_1$ (which defects).
  **The Fix:** Either the referee is trusted (cryptographic verification) or the theory models "cheap talk" code (non-binding).
  **Status:** **Context-Dependent.** In "Transparent" PE, this is fatal. In "Commitment" PE, the referee's integrity is an axiom.

  ---

  ### Non-Negotiable vs. Aesthetic

  **Non-Negotiable (The "Hard" Constraints):**
  1.  **Well-Defined Execution:** The game must end.
  2.  **Meta-Equilibrium:** The programs must be stable against deviation.
  3.  **Computational Feasibility:** Players must be able to find the equilibrium (for normative claims).
  4.  **Distinctness:** Must not collapse into Correlated Equilibrium or standard Nash without cause.

  **Aesthetic (The "Camp" Choices):**
  1.  **Extensional Stability:** Do you care about variable names? (Tennenholtz says no; Halpern says yes).
  2.  **Predictive Bite:** Do you want a Folk Theorem (anything is possible) or a unique prediction? (Folk Theorems are mathematically honest but practically weak).
  3.  **Referee Trust:** Is the referee a god or a potential conspirator?

  ---

  ### The Impossibility Claim

  **Theorem (The Introspection Trilemma):**
  No theory of Program Equilibrium can simultaneously satisfy:
  1.  **Universal Introspection:** Players can submit arbitrary Turing Machines and query them fully.
  2.  **Extensional Stability:** Equilibrium strategies cooperate with all functionally equivalent programs.
  3.  **Computational Feasibility:** Players can verify the equilibrium strategy in polynomial time (or within bounded resources).

  **Sketch of Argument:**
  To satisfy (2), a program $P$ must decide if an opponent $Q$ is functionally equivalent to itself (or a cooperator). This requires solving the **Equivalence Problem** for Turing Machines. By Rice's Theorem, non-trivial semantic properties of Turing Machines are undecidable.
  Therefore, if (1) holds, no computable program can satisfy (2).
  If we restrict programs to make equivalence decidable (satisfying 2 and 3), we violate (1) by losing universality (e.g., restricting to Finite State Machines).
  If we allow undecidable checks, we violate (3) because players cannot verify the strategy works.
  *Conclusion:* You must sacrifice universality, semantic stability, or player computability. Most resource-bounded literature (Halpern/Pass) sacrifices (1) by bounding the simulation depth.

  ---

  ### Scorecard of Flavors

  **(a) Unbounded Introspection + Default Rule**
  *   **Mechanism:** Programs are TMs. Referee simulates; if timeout, default to Nash/Defect.
  *   **Pros:** Mathematically clean; supports strong Folk Theorems.
  *   **Cons:** Unrealistic; relies on arbitrary timeout defaults which can be gamed (time-wasting attacks).
  *   **Verdict:** Good for existence proofs, bad for implementation.

  **(b) Bounded/Resource-Bounded Introspection**
  *   **Mechanism:** Programs pay a cost per step of simulation or have a hard step-limit (Halpern/Pass/Seeman).
  *   **Pros:** Solves the Trilemma; makes computation part of the strategy.
  *   **Cons:** Equilibria become sensitive to specific complexity constants (e.g., is $O(n^2)$ fast enough?).
  *   **Verdict:** The most robust normative theory for realistic agents.

  **(c) Trusted Compiler (Cryptographic PE)**
  *   **Mechanism:** Players submit encrypted code; a secure multi-party computation referee evaluates logic without revealing source to the opponent.
  *   **Pros:** Solves "Lying" and "Syntax" issues; ensures execution matches submission.
  *   **Cons:** Shifts the burden to the mechanism designer; requires trust in the compiler/hardware.
  *   **Verdict:** Best for engineering applications (smart contracts), less interesting for pure game theory.
