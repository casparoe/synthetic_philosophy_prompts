  2.  **Deconstruct the User's Suspected List & Brainstorm Desiderata:**

      *   *Termination:* Crucial. If $P_1$ reads $P_2$ and $P_2$ reads $P_1$, infinite loop. Needs a resolution mechanism (timeout, default move).
      *   *Syntax vs. Semantics:* The "Quining" problem. If cooperation depends on source equality, trivial variations break it. Needs extensional equivalence or canonical forms.
      *   *Findability (Computability):* If players can't find the equilibrium, is it normative? Bounded rationality issues.
      *   *Reduction:* Connection to classical Nash. If transparency is zero, should it look like Nash?
      *   *The Neighbors:* Differentiation from Superrationality (Hofstadter), Correlated Equilibrium (Aumann), Commitment.
      *   *Predictive Bite:* Folk theorems are too broad. Need to narrow predictions.
      *   *Asymmetry/Lying:* Robustness to partial observability or deception.

      *   *New/Refined Ideas:*
          *   *Well-definedness:* Does the mapping from program pairs to outcomes exist uniquely?
          *   *Robustness to Noise:* What if the code read has a bit flip?
          *   *Strategic Stability:* Is the program pair itself a Nash Equilibrium in the "meta-game" of submitting programs?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: Well-Defined Execution (Termination).*
          *   Case: `def P1(op): return op(P1)` vs `def P2(op): return op(P2)`.
