  8.  **Drafting Probing Questions (Part 6):**
      *   Need to force a choice between "Method is bad" vs. "This specific argument is bad."
      *   Q1: Is the objection to TEs in general or this TE? (Tests consistency with Einstein).
      *   Q2: Is the slack-cord objection a physical claim or a logical claim? (Tests the "begging the question" charge).
