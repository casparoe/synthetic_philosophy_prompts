  The induction fails at the very first step because the student is not entitled to assume the announcement is known to be true, only that it is true. To eliminate Friday, the student must know that if Thursday passes without an exam, their credence on Friday morning will necessarily be one. But this conditional holds only if the student knows on Sunday that the teacher's declaration will be satisfied. On my view, the student cannot know this; they can at best believe it. Consequently, on Friday morning, conditional on no prior exam, the student must retain some doubt that the announcement might fail—that either no exam will occur or the condition of low credence will be violated. This doubt prevents their credence from rising to unity, blocking the falsification of the announcement's second clause. The student illicitly converts the truth of the announcement into knowledge of its satisfaction, and it is this conversion, not the logic of elimination, that is impermissible.

  Regarding the distribution, the student ought to assign probabilities on Sunday that include a non-zero weight to the hypothesis that the announcement will prove false, perhaps because the teacher fails to deliver an exam at all. This 'error term' ensures that even on Friday morning, the credence in an exam occurring that day need not exceed one half, allowing the announcement to remain possibly true. This distribution survives the week because the non-occurrence of an exam on earlier days updates the probabilities of the specific days but does not eliminate the possibility of total failure. The teacher is safe to choose any day from Monday to Thursday, provided the student's doubt is sufficiently robust; Friday is unsafe for the truth of the announcement, but the student cannot know this limitation. Neither party is irrational: the teacher utters a truth that exceeds the student's capacity to know it, and the student rationally withholds the certainty required to unravel the week.
