      *   **New Requirement:** Applicability by a non-expert without specialist reconstructive work. Assess cost/feasibility.
      *   **Edge Case Test:** A "bare numbered list" TE (no imagery/narrative) that feels compelling. How does this affect requirements about vividness/concreteness?
