  12. **Final Polish:** Ensure the distinction between "Genuine Constraints" (logical necessities for knowledge) and "Partisan Prejudices" (theoretical commitments of specific schools) is sharp. The "Screening Device" goal is the pivot point that makes the specification likely impossible, which is the valuable philosophical insight to deliver.

  *(Self-Correction on the "Bare List" case)*: If a TE is just a numbered list, it functions like a logical proof. If it *feels* like a TE, it suggests the "narrative" element is decorative, not constitutive. This hurts the Mental Modeling view more than the Reconstruction view.

  *(Self-Correction on "Non-Expert")*: If the user demands a non-expert can verify the TE, they are demanding that the TE contains *all* its warrants explicitly. But TEs often rely on *tacit* knowledge. This is a fundamental tension. I need to highlight this.

