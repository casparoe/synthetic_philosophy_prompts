      *   *Hole Argument:* Shows TEs can be self-undermining. Account must allow for *retraction* without loss of rationality.
      *   *Maxwell's Demon:* Shows TEs are *defeasible* by new empirical facts (Landauer's Principle). Account cannot claim TEs are purely a priori.
      *   *Divided Verdicts:* (e.g., Chinese Room, Swampman). Account must explain *why* disagreement happens without dismissing one side as irrational.
      *   *Distinctions:* TE vs. Example (TE tests limits, Example illustrates rule). Conviction vs. Warrant (Psychology != Epistemology).
      *   *Prejudices:* "Must be an argument" (Empiricist prejudice). "Must be vivid" (Psychological prejudice).
      *   *The "Killer" Requirement:* The requirement that the *source of warrant be identifiable by the user* disqualifies most views because the source is often tacit.
      *   *The "Bare List":* Forces us to drop "imagistic simulation" as a necessary condition.

  11. **Self-Correction/Review during drafting:**

