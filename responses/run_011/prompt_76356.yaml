answer: |-
  Here is the specification you requested. It is constructed not as a summary of existing literature, but as a functional design document for an epistemological tool.

  ### I. The Specification: Requirements for an Adequate Account

  To function as a screening device for a non-specialist, an account of thought experiments (TEs) must satisfy the following requirements. Each is motivated by a specific failure mode or historical datum.

  **1. The Conservation of Information Constraint**
  *   **Requirement:** The account must explain how the conclusion is derived from premises the thinker already possesses (conceptual or empirical) without positing a mysterious influx of new empirical data.
  *   **Motivating Case:** *Galileo's Falling Bodies.* Galileo demolishes Aristotelian physics not by dropping balls from the Leaning Tower, but by considering two bodies strapped together. The account must explain how rearranging existing concepts yields a destructive conclusion about the world without new observation. If the account cannot show where the knowledge was "hiding" in the premises, it fails.

  **2. The Defeasibility Constraint**
  *   **Requirement:** The account must allow for a TE to be rationally compelling at time *t* and rationally rejected at time *t+1* due to changes in background empirical theory, without branding the original thinker irrational.
  *   **Motivating Case:** *Maxwell's Demon.* For a century, the Demon suggested a violation of the Second Law of Thermodynamics. It was only "exorcised" by Landauer's Principle (information erasure costs energy). An account that claims TEs yield pure *a priori* truth cannot explain why this TE was "good" for 100 years and then "bad." The epistemology must be sensitive to shifting empirical backgrounds.

  **3. The Self-Undermining Tolerance**
  *   **Requirement:** The account must permit a thinker to use a TE to reject a principle, then later use a modified version of the same TE (or new theoretical context) to restore that principle, without accusing the thinker of contradiction.
  *   **Motivating Case:** *Einstein's Hole Argument.* Einstein used this TE to argue against generally covariant field equations, then later accepted general covariance. The TE didn't "fail"; the interpretation of the mathematical objects changed. An adequate account must distinguish between the *scenario* and the *description of the possibility space*.

  **4. The Disagreement Accommodation**
  *   **Requirement:** The account must explain why competent readers split into opposite verdicts on the same setup without reducing one side to incompetence or bias.
  *   **Motivating Case:** *Divided Verdict Cases (e.g., Swampman, Chinese Room).* If the epistemology claims TEs access clear *a priori* truths, persistent disagreement among experts is an anomaly that threatens the model. The account must locate the locus of divergence (e.g., divergent tacit premises vs. failed simulation).

  **5. The Non-Expert Transparency Constraint**
  *   **Requirement:** The criteria for warrant must be applicable by a non-specialist without requiring them to reconstruct hidden premises that only a domain expert could validate.
  *   **Motivating Case:** *Your Proposed Purpose.* If the screening device requires the user to know the physics to evaluate the physics TE, it is useless as a screening device. It must detect "smuggled premises" via structural features accessible to general reason.

  ---

  ### II. Distinctions and Empirical Constraints

  **Distinctions the Account Must Not Collapse:**
  1.  **TE vs. Illustrative Example:** An example illustrates a rule already accepted (e.g., "Imagine a red apple to show I understand 'red'"). A TE tests the limits of a rule or theory (e.g., "Imagine a red apple that is also green all over to test color compatibility"). The account must explain the *destructive* or *generative* capacity of TEs, not just their illustrative power.
  2.  **Felt Conviction vs. Warrant:** The psychological feeling of "seeing" the truth (the "Aha!" moment) is not identical to epistemic justification. The account must allow for compelling but fallacious TEs (optical illusions of the mind).

  **Empirical Findings the Account Cannot Contradict:**
  1.  **Psychology of Simulation:** Humans are bad at simulating complex systems mentally (e.g., Monty Hall problem). An account claiming TEs work *because* we run accurate mental simulations contradicts cognitive science showing our intuitions are often heuristically biased.
  2.  **History of Conceptual Change:** TEs often rely on concepts that shift meaning over time (e.g., "mass" in Newton vs. Einstein). An account assuming conceptual stability across the TE's history contradicts historical evidence.

  ---

  ### III. Genuine Constraints vs. Partisan Prejudices

  Here we separate logical necessities from theoretical baggage.

  **Genuine Constraints:**
  *   **Non-Contradiction:** The account cannot claim a TE yields knowledge *P* and *not-P* simultaneously under identical descriptions.
  *   **Connection to World:** Since TEs yield knowledge of the world (not just language), the account must link the mental scenario to empirical reality, even if indirectly.

  **Partisan Prejudices (To Be Discarded):**
  *   **The "Argument Only" Prejudice:** Insisting a TE *is* nothing but an argument in disguise (Norton's view). This is empiricist camp work. It ignores the phenomenological role of imagination in accessing premises that are not explicitly propositional.
  *   **The "Pure Insight" Prejudice:** Insisting TEs access a Platonic realm of laws (Brown's view). This contradicts the Defeasibility Constraint (Maxwell's Demon).
  *   **The "Vividness" Prejudice:** Insisting that sensory richness is necessary for a TE to function. This is contradicted by your "Bare List" edge case (see Section VI).

  **The Single Requirement That Disqualifies the Most Positions:**
  *   **Requirement 5 (Non-Expert Transparency).**
  *   **Reason:** Almost all live positions (Reconstruction, Platonic, Mental Modeling) assume that the warrant for a TE relies on *tacit* knowledge, *expertise*, or *trained intuition*. Norton requires reconstructing hidden empirical premises (which a non-expert cannot do). Brown requires perceiving abstract laws (which requires conceptual training). Nersessian requires running accurate mental models (which requires domain knowledge). Demanding that a non-expert verify the warrant without specialist knowledge disqualifies any view that admits TEs rely on specialized tacit competence.

  ---

  ### IV. The Impossibility Result (Joint Unsatisfiability)

  **The list is jointly unsatisfiable.**

  **Derivation:**
  1.  Take **Requirement 1 (Conservation)** and **Requirement 2 (Defeasibility)**. To satisfy Conservation, the knowledge must be in the premises. To satisfy Defeasibility (Maxwell's Demon), the premises must include empirical assumptions that can change over time.
  2.  Take **Requirement 5 (Non-Expert Transparency)**. For a non-expert to verify that the conclusion follows from the premises (Conservation) and that no hidden empirical assumptions are smuggled in (Defeasibility), the premises must be explicit and their empirical status obvious.
  3.  **Conflict:** Historical and psychological evidence shows that the power of TEs often lies precisely in *tacit* premises and *implicit* empirical commitments that are not obvious even to experts until challenged (e.g., the assumption in Maxwell's Demon that information sorting is cost-free).
  4.  **Conclusion:** If the warrant relies on tacit/expert knowledge (as history/psychology dictates), a non-expert cannot screen it (violating Req 5). If the warrant is fully explicit for the non-expert, it ceases to function as a TE and becomes a standard argument, failing to explain the specific phenomenology and generative power of TEs (violating the spirit of Req 1 & 4).

  **Verdict:** You cannot have a screening device that is both **reliable** (accurately detects smuggled premises) and **accessible** (usable by a non-expert). You must choose: either the device is expert-dependent, or it is prone to false negatives on sophisticated TEs.

  ---

  ### V. The Non-Expert Constraint: Cost and Feasibility

  **Is it legitimate?**
  It is legitimate as a *pragmatic* goal for your paper, but illegitimate as a *condition of adequacy* for the epistemology itself. Epistemology explains how knowledge is constituted, not how it is audited by laypersons.

  **The Cost:**
  To make the tests applicable by a non-expert, you must lower the threshold of "warrant" to **structural coherence** rather than **truth-tracking**.
  *   *What you gain:* A tool to detect internal contradictions or narrative manipulation.
  *   *What you lose:* The ability to detect "empirical smuggling." A non-expert cannot know if a premise about "simultaneity" or "information entropy" is empirically loaded.

  **Can any candidate pay it?**
  No.
  *   **Reconstruction View:** Requires logical analysis often beyond lay capacity.
  *   **Platonic View:** Requires "seeing" laws, which is unverifiable by others.
  *   **Mental Modeling:** Requires checking the model against reality, which requires expertise.
  *   **Recommendation:** Reframe Requirement 5. Do not demand the non-expert verify the *truth*; demand they verify the *provenance*. Can the thinker identify *which* of their prior beliefs is doing the work? Even this is difficult, but it is the only feasible version.

  ---

  ### VI. The "Bare List" Edge Case Test

  **Case:** A TE delivered as a bare numbered list (no imagery/narrative) that readers find compelling and defend by reinterpreting premises.

  **Implications for the Specification:**
  1.  **Vividness is Non-Essential:** Any requirement appealing to "concreteness," "imagistic capacity," or "narrative immersion" as a *necessary condition* for a TE is falsified. This damages the **Mental Modeling/Simulation View**, which often ties the epistemic force to the manipulation of quasi-perceptual representations.
  2.  **Structuralism Required:** The account must locate the evidential force in the *relations* between the propositions, not the *medium* of presentation.
  3.  **Premise Reinterpretation:** The fact that readers defend it by reinterpreting premises suggests the TE functions as a **reflective equilibrium engine**. It forces a choice between rejecting the conclusion or adjusting the weight of prior commitments.
  4.  **Requirement Adjustment:** You must drop any criterion demanding "scenario richness." Replace it with **"Counterfactual Stability."** Does the conclusion hold if we vary the non-essential features of the list? If the "Bare List" works, it is because the logical structure alone triggers the conceptual conflict.

  ---

  ### VII. Scoring the Three Leading Positions

  **1. The Reconstruction View (e.g., Norton)**
  *   **Score:** Fails on Phenomenology and Non-Expert Constraint.
  *   **Critique:** Successfully explains Conservation of Information (TEs are arguments). Fails to explain why the "Bare List" feels different from a proof, and fails the Non-Expert Constraint because reconstructing hidden empirical premises requires expertise.

  **2. The Platonic/*A Priori* View (e.g., Brown)**
  *   **Score:** Fails on Defeasibility and Disagreement.
  *   **Critique:** Explains the "insight" feel well. Cannot explain Maxwell's Demon (why did the "law" change?) or persistent disagreement (why can't experts see the same laws?). Violates Empirical Constraints.

  **3. The Mental Modeling/Simulation View (e.g., Nersessian)**
  *   **Score:** Fails on the "Bare List" and Normativity.
  *   **Critique:** Explains the psychology and the role of imagination. Struggles with the "Bare List" case (no imagery to simulate). Lacks normative force: knowing *how* we simulate doesn't tell us *when* the simulation is trustworthy (Felt Conviction vs. Warrant collapse).

  **Final Recommendation for Your Paper:**
  The "Negative Result" (Section IV) is your strongest philosophical contribution. Argue that the demand for a **Non-Expert Screening Device** reveals a fundamental tension in the epistemology of TEs: their power derives from tacit, expertise-laden intuition, which is precisely what a non-expert cannot audit. Therefore, no account can satisfy your specification without ceasing to be an account of *thought experiments* and becoming an account of *formal arguments*.
