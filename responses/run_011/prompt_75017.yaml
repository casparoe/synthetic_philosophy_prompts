answer: |-
  You have constructed a very tight logical trap, and it is one that catches many readers of Du Bois. The reconstruction is faithful to a certain reading of the text, but it relies on a specific philosophical assumption about function and value that Du Bois does not share.

  To save your seminar and keep Step 1 (which is indeed the heart of Du Bois's intervention), you must reject **Step 2**, and consequently **Step 3**.

  Here is the breakdown of where the logic falters, why it looked plausible, and how to articulate Du Bois's actual mechanism without resorting to vague labels.

  ### 1. The Point of Failure: Step 2
  **Your Step 2:** *If something's function is to advance a side, the right standard for it is how well it advances that side.*

  **Why it looked natural:** This is a classic instrumentalist move. If a hammer's function is to drive nails, we judge it by how well it drives nails. If art's function is propaganda, surely we judge it by how well it propagates? It treats the artwork as a tool external to its effect.

  **Why Du Bois rejects it:** Du Bois is not a crude instrumentalist. He does not view the 'art' and the 'propaganda' as separable components (where one is the vehicle and the other is the cargo). For Du Bois, the aesthetic power *is* the political power.

  If you reject Step 2, you block the slide into Step 4 (Goodness = Political Effect) and Step 5 (Craft counts for nothing). Du Bois's position is not that craft is irrelevant to propaganda, but that **craft is a prerequisite for effective propaganda.** A crudely made piece often fails to advance the cause precisely because it is crudely made; it fails to move the audience, fails to command attention, and fails to embody the humanity of the creator.

  ### 2. The Mechanism: The Unity of Truth, Goodness, and Beauty
  You asked for a mechanism, not a label. In *Criteria of Negro Art*, Du Bois explicitly outlines three criteria: **Truth, Goodness, and Beauty.**

  The mechanism by which he distinguishes 'good propaganda' from 'bad propaganda' (or mere pamphleteering) is the **indivisibility of these three.**

  *   **Truth:** The work must accurately represent the Black experience (countering the lies of racism).
  *   **Goodness:** The work must aim for justice (the propagandistic aim).
  *   **Beauty:** The work must possess aesthetic form.

  Du Bois argues that you cannot achieve Truth and Goodness *without* Beauty. He writes: *"Thus all Art is propaganda and ever must be, despite the wailing of the purists."* But he immediately follows this by insisting that the artist must not sacrifice Beauty for the sake of the message, because to sacrifice Beauty is to sacrifice the power of the message.

  **The Mechanism in Practice:**
  *   **Bad Propaganda (The Crudely Made Piece):** It states a political truth but lacks aesthetic form. Because it lacks beauty, it fails to engage the human spirit. It is ignored or dismissed. Therefore, it fails *as propaganda* (it does not advance the side).
  *   **Good Propaganda (The Beautiful Piece):** It embodies the political truth within a beautiful form. Because it is beautiful, it compels attention and empathy. It succeeds *as propaganda* precisely because it succeeds *as art*.

  Therefore, Step 3 (*"How well something advances a side is a question about effects, not about how the thing is made"*) is empirically false in Du Bois's view. How the thing is made (craft/beauty) directly dictates the effect.

  ### 3. The Cost of Rejecting Step 2
  If you take this route in your seminar, you must pay a specific price. You cannot present Du Bois as saying "Art is propaganda" in the sense of "Art is a weapon." You must present him as saying "Art is propaganda" in the sense of **"Art is situated advocacy."**

  The cost is that you must argue Du Bois holds a **robust theory of aesthetic autonomy within political commitment.** He is not subordinating art to politics; he is arguing that true art *is* political by virtue of its honesty and beauty. This makes his position harder to defend than simple sloganeering, because he must constantly negotiate the tension between the demand for political utility and the demand for aesthetic integrity.

  He pays for this by opening himself to criticism from both sides: the purists who think he politicises art too much, and the radicals who think he cares too much about 'Beauty' (often defined by Western standards) rather than raw political utility.

  ### 4. Resolving Step 7 (The 'Universal' Objection)
  You worry in Step 7 that if *all* art is propaganda, the term picks out everything and so nothing. This is a semantic objection that misses the **polemical work** of the term.

  Du Bois is not offering a scientific taxonomy; he is performing a **reclamation**.
  *   **Prevailing Usage:** 'Propaganda' is a pejorative term applied to Black art (or Soviet art) to dismiss it as biased, whilst white art is granted the status of 'Universal Art'.
  *   **Du Bois's Move:** He accepts the label 'propaganda' but universalises it. By saying *all* art is propaganda, he strips the term of its power to marginalise Black art specifically.

  The critical work the term does is **leveling the playing field.** It forces the critic to admit that the 'neutral' white art is also taking a side (the side of the status quo). Once that admission is forced, the debate shifts from *"Is this art biased?"* (to which the answer is now always 'yes') to *"Which bias is just, and which is beautifully rendered?"*

  ### 5. Summary for Your Seminar
  To keep Step 1 without accepting the reductio ad absurdum of Step 5:

  1.  **Maintain Step 1:** All art is situated; neutrality is a myth.
  2.  **Reject Step 2 & 3:** Political efficacy is not separate from aesthetic quality. Aesthetic failure *is* political failure.
  3.  **Reframe Step 4:** Asking if a work is 'good' is asking if it successfully unites Truth, Goodness, and Beauty. A work that is politically correct but aesthetically dead is *bad propaganda* because it persuades no one.
  4.  **Explain Step 7:** The universality of the claim is the point. It is a strategic universalism designed to expose the particularism of white art.

  **Suggested phrasing for your notes:**
  > "Du Bois does not argue that aesthetic value is irrelevant to political art. He argues that aesthetic value is the *engine* of political art. To call art 'propaganda' is not to reduce it to a pamphlet; it is to insist that its beauty must be in the service of its truth. A ugly lie is bad art; a beautiful lie is dangerous art; an ugly truth is ineffective art; only a beautiful truth is good propaganda."

  This allows you to keep the provocative claim (Step 1) while retaining the critical nuance that allows you to distinguish between a daubed sign and a Goya painting, both of which might be 'on the side' of the people.
