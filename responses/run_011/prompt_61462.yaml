answer: |-
  1. **The Dependency Structure**

      *   **Order of Components:**
          1.  **Standard Baseline (10 mins):** Briefly restate the 1-shot Prisoner's Dilemma (PD) and the standard Nash Equilibrium (NE) argument (dominance of Defect). *Prerequisite for:* Contrasting the new setting against the old.
          2.  **The Interface Rule (10 mins):** Define the new move space. Players submit source code; code receives opponent's source code as input; code returns an action. *Prerequisite for:* Understanding that strategies are now functions, not atomic actions.
          3.  **The Recursion Trap (20 mins):** Demonstrate why the "obvious" reciprocal program (`Return whatever Opponent returns`) fails. Show the infinite regress ($P_1$ calls $P_2$ calls $P_1$...). *Prerequisite for:* Motivating the need for a logical condition rather than direct simulation. **Make the fixed-point character explicit here.** If you defer this, students will assume the programs simply "run" without realizing the circular dependency creates a non-terminating computation.
          4.  **The Logical Cooperators (25 mins):** Introduce the cooperating pair (e.g., `FairBot`). Explain that they do not simulate; they check for a *proof* of cooperation. *Prerequisite for:* Showing how mutual cooperation becomes possible.
          5.  **Equilibrium Redefined (15 mins):** Define Program Equilibrium. Explicitly map what carries over (no unilateral profitable deviation) vs. what is replaced (action space $\to$ program space; payoff matrix $\to$ execution outcome). *Prerequisite for:* Understanding why dominance reasoning changes.
          6.  **Dominance & Difficulty (10 mins):** Explain why dominance doesn't force Defect (because the opponent's action is not fixed independent of your program). *Prerequisite for:* The final takeaway.

      *   **Motivation Strategy:** Show the **Recursion Trap first**. If you exhibit the cooperating pair first, Computer Science students will immediately dismiss it as non-halting code, and Philosophy students will treat it as magic. By breaking the naive solution first, you create the logical vacuum that the `FairBot` style solution fills.
      *   **NE Transfer:**
          *   *Carries Over:* The stability condition (no player wants to switch given the other's choice).
          *   *Replaced:* The definition of a "Strategy" (from Action to Program) and the Payoff Function (from Matrix Lookup to Code Execution).
          *   *Fixed-Point:* Must be made explicit in the **Recursion Trap** phase. If deferred, the "Logical Cooperators" will look like they bypass the loop by magic rather than by changing the query from "What do you do?" to "What is provable about you?"

  2.  **The Carrying Example**

      *   **The Family:** `FairBot` variants.
      *   **Pseudocode:**
          ```python
          def FairBot(OpponentSource):
              if Proof_Exists("OpponentSource(FairBot) == COOPERATE"):
                  return COOPERATE
              else:
                  return DEFECT
          ```
      *   **Payoff Matrix:** Use **Numbers** (e.g., CC=3,3; DC=5,0; CD=0,5; DD=1,1). Ordinal rankings obscure the incentive calculations required to check for equilibrium deviations.
      *   **What it Must Demonstrate:** That $(FairBot, FairBot)$ yields $(3,3)$ and is stable against switching to `DefectBot`.
      *   **What it Must Not Be:** It must not rely on "history" (no memory of past rounds). It must not rely on randomness.
      *   **Visible Failure:** The example must visibly fail against a program that is **functionally equivalent but syntactically distinct**.
          *   *Scenario:* `FairBot` vs. `FairBotPrime` (same logic, variable names changed).
          *   *Failure:* If `Proof_Exists` relies on syntactic identity (which it must, to be computable without the black box), they defect. If it relies on logical equivalence, it requires the black box.
          *   *Pedagogical Value:* This forces the discussion on the "Logic Black Box" (Section 4) and prevents students from thinking simple string matching solves the problem.

  3.  **The Misconceptions**

      *   **"This is just Iterated PD relabeled."**
          *   *Strategy:* **Prevent.** State clearly in the first 5 minutes: "There is no history. There is no round 2. The code reads code, not past actions."
          *   *Timing:* Introduction.
      *   **"Defecting is still better once the code is fixed (Trust/Self-Deception)."**
          *   *Strategy:* **Dismantle.** This is the core conceptual hurdle.
          *   *Timing:* During **Equilibrium Redefined**. Show that if Player 2 switches to `DefectBot`, Player 1's `FairBot` *changes its output* to Defect. The opponent's action is *not* fixed independent of your program.
      *   **"Reciprocal copying (`If Opp == Me`) settles everything."**
          *   *Strategy:* **Dismantle.**
          *   *Timing:* During **Recursion Trap**. Show that `If Opp == Me` causes an infinite loop when run against itself unless handled by a quine trick, which is brittle.
      *   **"Machines can read minds; humans can't."**
          *   *Strategy:* **Dismantle.**
          *   *Timing:* **Omissions** (Section 6). Clarify this is a model of *transparent commitment*, not telepathy.
      *   **"It's just an outer game with a bigger action space."**
          *   *Strategy:* **Allow then Refine.** It *is* technically an outer game, but treating it as a "bigger matrix" misses the functional dependency.
          *   *Timing:* **Equilibrium Redefined**. Acknowledge it is a game over programs, but emphasize that the payoff function is *computed*, not *listed*.
      *   **Missing Misconception:** **"The Halting Problem makes this impossible."**
          *   *Strategy:* **Allow then Bracket.** CS students will raise this.
          *   *Timing:* **Logic Black-Boxing** (Section 4). Acknowledge validity, then explain why we suspend it for the theoretical point.

  4.  **The Logic I Must Black-Box**

      *   **Minimum Assertion:** "We assume a proof system exists where `FairBot` can prove that `FairBot` cooperates against `FairBot` within a bounded number of steps."
      *   **Bracketing:** You cannot teach Gödelian provability logic or Löb's Theorem in this session.
      *   **How to Flag:** Explicitly label `Proof_Exists` as an **Oracle**.
      *   **Script Note:** Say: "In reality, checking all proofs is uncomputable (Halting Problem). For this seminar, we treat `Proof_Exists` as a theoretical primitive that returns 'True' if a valid derivation exists in Peano Arithmetic, ignoring time limits. We do this to isolate the *strategic* implication of transparency from the *computational* limits of verification."
      *   **Why:** This satisfies the CS students (you acknowledged computability) without derailing the Philosophy students (you kept the strategic logic intact).

  5.  **The Check**

      *   **Exercise:** "Player 1 submits `FairBot`. Player 2 submits `CheatBot`. `CheatBot` reads Player 1's source, confirms it is `FairBot`, and then returns `DEFECT` (without simulating). What is the payoff for each, and is `(FairBot, FairBot)` a Nash Equilibrium?"
      *   **Correct Answer:** `FairBot` checks for a proof that `CheatBot` cooperates. `CheatBot` does not cooperate (it defects). `FairBot` finds no proof. `FairBot` defects. Outcome: (1, 1). `(FairBot, FairBot)` *is* an equilibrium because deviating to `CheatBot` yields 1, which is worse than the 3 obtained by playing `FairBot`.
      *   **Characteristic Wrong Answer:** "Player 2 gets 5, Player 1 gets 0."
      *   **Diagnosis:** This reveals the student believes `FairBot` cooperates unconditionally or that `FairBot` cannot "see" the defection. It indicates they failed the **Dominance & Difficulty** step: they think the opponent's action is fixed once the code is submitted, rather than determined by the interaction of the codes.

  6.  **The Omissions**

      *   **Announce in First 2 Minutes:**
          1.  **Computability:** We are ignoring the Halting Problem and runtime limits (treated as idealized logic).
          2.  **Psychology:** This is not about human trust or negotiation; it is about logical dependency.
          3.  **Evolution:** We are not discussing how these populations evolve over time, only static equilibrium.
      *   **Refuse Questions On:**
          1.  "Can we actually compile this in Python?" (Answer: Not without the Oracle assumption).
          2.  "What if the code is obfuscated?" (Answer: Out of scope; we assume readable source).
          3.  "How does this apply to nuclear deterrence?" (Answer: Analogy is imperfect; stick to the formal model).

  7.  **Time Allocation (90 Minutes)**

      *   **00–10: Setup & Baseline.** Define PD, standard NE, and the new Program Interface rules. (Prevents Iterated PD misconception).
      *   **10–30: The Recursion Trap.** Attempt naive simulation. Demonstrate infinite loop. Explain why action isn't fixed. (Handles Reciprocal Copying misconception; Explicitizes Fixed-Point).
      *   **30–55: The Logical Solution.** Introduce `FairBot`. Explain the `Proof_Exists` Oracle. Show $(FairBot, FairBot) \to (C,C)$. (Logic Black-Boxing; Handles Halting misconception).
      *   **55–75: Equilibrium & Dominance.** Define Program NE. Walk through the `CheatBot` deviation. Explain why Dominance fails to force Defect. (Dismantles Trust/Deception misconception; Refines Outer Game misconception).
      *   **75–85: The Check.** Students solve the `CheatBot` scenario individually/discussion. Review answers. (Verification).
      *   **85–90: Omissions & Wrap.** Reiterate scope limits. Final Q&A. (Handles Psychology/Computability scope).

      **Reasoning for Ordering:**
      The sequence moves from **Intuition** (Standard PD) to **Breakdown** (Recursion Trap) to **Repair** (Logical Cooperators) to **Formalization** (Equilibrium Definition). This mirrors the historical and logical development of the concept. Placing the Recursion Trap before the Solution ensures students understand *why* the logic is needed, preventing the "magic" misconception. Placing the Check immediately before the end ensures you catch misunderstandings about the equilibrium condition before they leave.

      **Misconception Map:**
      *   *Iterated PD:* Killed in Setup.
      *   *Recursion/Loop:* Exposed in Trap.
      *   *Trust/Deception:* Killed in Equilibrium/Dominance analysis.
      *   *Halting/Computability:* Contained in Black-Boxing.
      *   *Outer Game:* Clarified in Equilibrium Definition.
      *   *Psychology:* Excluded in Omissions.
