  **Flag 3: Question 9 (Concrete Case)**
  *   **Risk:** He will claim the theories are "compatible" or that the difference is "philosophical, not practical."
  *   **Re-ask:** "Please give me one specific bet. If you and a classical Bayesian disagree on the probability, you must disagree on the price. What is the price?"

