  ### Closing Prediction

  **Will he have a concrete case?**
  **Prediction:** **No.**
  Radical probabilism is typically defended as a *general* framework for rationality rather than a tool for generating divergent numerical outputs in specific, simple scenarios. The guest is likely to argue that in any case where a classical Bayesian has specified the full partition including experience-propositions, the outputs converge, and the difference lies only in the *justification* for the numbers, not the numbers themselves. He will likely try to pivot back to the "normative" difference (foundationalism vs. coherentism) rather than naming a specific bet. Be prepared to press the **Re-ask for Question 9** if he attempts this evasion.
