answer: |-
  ### Episode Question Set

  **Question 1 (Accessible)**
  **Read Aloud:** "Let's start with the headline claim. You argue that no experience ever makes a proposition certain for a subject—that we should never assign probability one to anything. But isn't certainty just a limit case? Why forbid it entirely rather than just treating it as rare?"
  **Expected Reply:** He will say that assigning probability one makes a belief immune to evidence, which is dogmatic; since any experience could be a hallucination, certainty is never rational.
  **Follow-up:** "If I can't be certain of my own sensations, does that mean I must assign some non-zero probability to the possibility that I am not currently conscious?"

  **Question 2 (Accessible)**
  **Read Aloud:** "In standard Bayesianism, I update on a proposition like 'I see a red shirt.' You say I shouldn't. Instead, experience just shifts my probabilities directly. But if I'm not accepting a proposition, where do the new numbers come from? How does a feeling turn into a specific weight, like point-six?"
  **Expected Reply:** He will claim the weights are fixed by the phenomenology of the experience itself, not by a judgment; the experience *is* the shift, not the cause of a judgment.
  **Follow-up:** "If two people have identical phenomenology but assign different weights, has one of them made a mistake, or is the mapping from feeling to number arbitrary?"

  **Question 3 (Technical: Rigidity)**
  **Read Aloud:** "Your rule relies on rigidity: holding conditional probabilities fixed while the partition weights shift. But suppose I learn the lighting is poor *while* I'm looking at the shirt. My conditional probability that the shirt is red given my experience should drop. How does your rule handle simultaneous defeaters without collapsing back into ordinary conditionalization?"
  **Expected Reply:** He will distinguish between the direct impact of experience and subsequent inference; rigidity applies only to the immediate input, and defeaters are handled by a second kinematic step.
  **Follow-up:** "If the 'immediate input' is always vulnerable to a defeater I haven't processed yet, doesn't that make the first update provisional in a way your formalism doesn't capture?"

  **Question 4 (Technical: Order)**
  **Read Aloud:** "Two successive kinematic updates generally don't commute; the order in which I receive experiences changes the final probability. But if evidence is just evidence, why should the timeline matter? Does this imply your rule isn't an updating procedure at all, but just a constraint on coherent pairs of functions?"
  **Expected Reply:** He will argue that order matters because the second experience occurs in the context of the first probability function; the state of the agent has changed, so the input lands differently.
  **Follow-up:** "If order matters, can two agents with the same total evidence but different arrival sequences rationally disagree forever?"

  **Question 5 (Technical: Minimum-Distance)**
  **Read Aloud:** "There's a theorem that your rule minimizes relative entropy subject to the new partition weights. Is that result a vindication of the rule—showing it's the most conservative change—or just a redescription of the mathematics?"
  **Expected Reply:** He will likely call it a vindication, arguing that minimizing information gain is the correct way to respect the constraint that experience only fixes the partition weights.
  **Follow-up:** "If the constraints don't come as a neat partition, does the minimum-distance principle still tell us what to do, or does the rule break down?"

  **Question 6 (Technical: Zeros)**
  **Read Aloud:** "Under rigidity, if I assign zero conditional probability to a hypothesis on every member of the partition, it can never become positive. To avoid this, must you ban zero probabilities from the algebra altogether? And if so, how do I model learning to take seriously a possibility I previously ignored?"
  **Expected Reply:** He will endorse regularity (no zeros) as a requirement for rational agents; learning to entertain a new possibility requires a restructuring of the algebra, not just an update.
  **Follow-up:** "If restructuring the algebra isn't governed by an update rule, isn't that where the real normative work is happening, rather than in the kinematics?"

  **Question 7 (Technical: Enlargement)**
  **Read Aloud:** "A classical Bayesian says you can just add a variable for 'I am having this experience' and conditionalize on that. If that proposition is certain, kinematics is redundant; if it's not certain, you haven't explained the source of the weights. How do you escape this dilemma?"
  **Expected Reply:** He will argue that the proposition 'I am having this experience' is not certain and that conditioning on it introduces a layer of inference that experience does not support.
  **Follow-up:** "But if you can't condition on the experience itself, what forbids me from treating your 'direct weights' as if they were conditional on a hidden proposition?"

  **Question 8 (Technical: Deference)**
  **Read Aloud:** "Suppose a trusted expert reports her probability for a hypothesis, not for an observation. Adopting her marginal isn't an update on a partition. What is your rule for deference, and how do I proceed if two experts report figures that aren't jointly reachable by a single kinematic move?"
  **Expected Reply:** He will say deference is a special case where you treat the expert's report as fixing your new weights on a partition of their reliability, or that you simply adopt their function as your own.
  **Follow-up:** "If I simply adopt their function, haven't I abandoned the idea that my own experience is the sole source of my probability shifts?"

  **Question 9 (Technical: Normative & Concrete Case)**
  **Read Aloud:** "You say coherence is the whole of the norm and no response to evidence is uniquely correct. But if two agents start far apart and get the same experiences, do they converge? And can you name a concrete case—a bet to accept or refuse—where your advice differs from a classical conditionalizer's?"
  **Expected Reply:** He will likely say convergence is not guaranteed but not required, and that the difference is structural rather than practical in simple cases.
  **Follow-up:** "If there is no concrete case where the advice differs, in what sense is this a rival theory rather than a reinterpretation of the same practice?"

  ***

  ### Host's Cheat Sheet: Flagged Questions & Re-Asks

  *Use these if the guest retreats into a rehearsed monologue.*

  **Flag 1: Question 2 (Provenance)**
  *   **Risk:** He will give a polished phenomenological description that dodges the question of *precision*.
  *   **Re-ask:** "Phenomenology is vague, but probabilities are precise numbers. What mechanism translates the vague feeling into the exact number?"

  **Flag 2: Question 7 (Bootstrapping)**
