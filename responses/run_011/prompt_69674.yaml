answer: |-
  A municipal housing grant committee administers a rule stating funds are released only if a property *clearly meets* the standard of "substantially renovated." Property X, a borderline case involving partial structural updates, is reviewed by Committee A, which rules that it does meet the standard and releases funds used immediately for irreversible roof repairs. A second body, Committee B, later audits the same record under the same procedure with no new evidence and rules that Property X does not meet the standard, revoking the grant. Both committees previously agreed that Property Y, which was fully gutted and rebuilt, determinately meets the standard.

  **Demonstration**

  1.  "Property X meets the standard."
      *   **Epistemicism:** True or False (derived from bivalence; boundary is sharp but unknown).
      *   **Supervaluationism:** Neither supertrue nor superfalse (derived from truth-value gaps across admissible precisifications).
  2.  "Property Y meets the standard."
      *   **Epistemicism:** True (derived from clear case falling inside the sharp boundary).
      *   **Supervaluationism:** Supertrue (derived from truth on all admissible precisifications).
  3.  "Either Property X meets the standard or it does not."
      *   **Epistemicism:** True (derived from Excluded Middle holding universally).
      *   **Supervaluationism:** Supertrue (derived from Excluded Middle holding globally despite local gaps).
  4.  "The first ruling was correct."
      *   **Epistemicism:** True or False (derived from the ruling asserting a proposition that is factually true or false).
      *   **Supervaluationism:** False (derived from the ruling asserting a proposition that lacks supertruth).
  5.  "Property X clearly meets the standard."
      *   **Epistemicism:** True or False (derived from 'clearly' having a sharp higher-order boundary).
      *   **Supervaluationism:** False (derived from 'meets' not being supertrue, making 'clearly meets' false).
  6.  "The first ruling was not semantically defective."
      *   **Epistemicism:** True (derived from the machinery that all vague sentences are truth-apt).
      *   **Supervaluationism:** False (derived from the machinery that borderline assertions lack truth values).
  7.  "The first ruling was correct and the funds were rightly paid."
      *   **Epistemicism:** True or False (derived from conjunction of truth-apt components).
      *   **Supervaluationism:** False (derived from conjunction containing a non-supertrue component).

  **Agreement and Divergence**
  The theories agree on Sentence 3 ("Either Property X meets the standard or it does not"), both assigning it a positive truth value (True/Supertrue). They diverge on Sentence 6 ("The first ruling was not semantically defective"). Epistemicism verdicts **True**, because its machinery treats all declarative sentences as having a truth value, rendering the assertion truth-apt and non-defective. Supervaluationism verdicts **False**, because its machinery treats borderline assertions as lacking a truth value, rendering the assertion semantically defective.

  **Structural Feature and Removal**
  The divergence is generated by the combination of the **reversal on the same record** and the **semantic status of borderline assertions**. The reversal forces a comparison of the *validity* of the first ruling's assertion. If the higher-order term "clearly" is deleted from the rule, Supervaluationism still treats the object-level assertion "meets the standard" as gappy in a borderline case, maintaining the divergence on defectiveness. However, if the consequence were reversible, the practical stakes of the defectiveness verdict would diminish; if the second body had fresh evidence, the divergence would be obscured by epistemic updates rather than semantic status.

  **Strongest Attack**
  The strongest attack available to Supervaluationism (which fares worse on preserving institutional validity) is that Epistemicism's "True" verdict on defectiveness is operationally empty because it posits a truth value that is unknowable in principle. However, this attack is not available without restating the idleness charge. The charge claims the dispute is idle because the theories agree on extensions; the attack claims the dispute is idle because the theories agree on *use*. To argue the verdict is "empty" is to argue it has no practical consequence, which is precisely the idleness charge I am refuting. The divergence on defectiveness dictates whether the institution *erred* (Epistemicism: possibly no error) or *failed* (Supervaluationism: definite semantic failure), which alters liability and review protocols regardless of knowability.

  **Closing Verdict**
  The case shows the dispute to have practical consequences.
