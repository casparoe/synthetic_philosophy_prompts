answer: |-
  The rain had not stopped for fourteen days, turning the Kettle River into a brown artery swelling against its banks. Inside the Basin Authority's boardroom, the air was dry and stale, recycled through filters that smelled of dust and old tobacco. Elena Vance sat at the secretary's desk, her pen hovering over the minutes, though she had not written a word in twenty minutes.

  Across the table, the representative from Oakhaven stood with a sheaf of papers. He was not shouting. That was the worst part. He was speaking softly, demonstrating arithmetic to men who had built their careers on concrete and hydrology.

  "Harlan's rule," the representative said, tapping the document. "The former Chief Engineer claimed it was honest. He said if I rank the sites according to where I truly need the levee, I cannot be harmed by it. That truth was my safest shield."

  He pointed to the board members, three men and two women representing the downstream towns of Millersburg and Ridgeport. "But look. When I voted truthfully—Narrows first, Bend second, Flats third—the Flats won. The water goes to Millersburg. But if I had lied? If I had ranked the Bend first, even though I care less for it than the Narrows? Then the Bend wins. My lie saves Oakhaven's fields."

  He sat down. The silence in the room was heavy, pressing against the windows like the river outside. Harlan was dead, buried two months prior, and his legacy was the voting procedure written into the Authority's standing orders. He had prided himself on the mechanism, a complex ranked-ballot system designed to ensure that no member gained by submitting a false preference. He had believed he had built a machine that forced honesty.

  Elena lowered her pen. She was the Secretary of the Authority, the keeper of the procedures, the one who counted the ballots and certified the outcomes. Her job existed to ensure the process was clean. Now, the process was proven to be a sieve.

  "Is there an error in his calculation?" asked the Chair, a weary woman named Sterling whose district included the Flood Plains.

  "No," the Oakhaven representative said. "The math is correct. The rule allows manipulation. Whenever there are three choices, someone can game it."

  The meeting adjourned without a vote. The board needed to site three new flood-control structures, but they could not agree on which of the three locations—The Narrows, The Bend, or The Flats—should receive the primary infrastructure. The budget allowed for only one major structure this season. The towns had organized into blocs, each convinced their geography was the linchpin. If the Authority failed to choose, the river would choose for them.

  Elena stayed behind. She gathered Harlan's files. They were meticulous, filled with diagrams of flow charts and preference orderings. He had been a man of logic, convinced that social engineering could match the precision of civil engineering. She spread the papers on her desk in the quiet office. Outside, the rain drummed against the glass.

  For the next week, the Board attempted to repair the machine. They called in consultants from the university. They tried tweaking the weights assigned to first, second, and third choices. They tried eliminating the lowest-ranked site in rounds. They tried requiring supermajorities.

  Elena watched the simulations. Every time they kept all three sites on the table, and every time they demanded that the outcome be decided by the votes alone without chance, the result was the same. Someone found a way to lie.

  It wasn't that the board members were dishonest people. They were desperate. When a town's survival hung on the outcome, truth became a luxury they could not afford. If telling the truth meant losing the levee, they would lie. And because the rule allowed it, they had to.

  "It's the number three," said the younger consultant, a mathematician named Paul who spoke in hushed tones, as if discussing a contagion. "When you have two options, people just vote for what they want. But with three? The interactions create loops. You can't break them without breaking something else."

  "Fix it," Sterling commanded. "Write a new rule. One where honesty is safe again."

  Paul looked at Elena. He didn't say what she was beginning to suspect. He just shook his head. "There isn't one. Not if we keep all three sites. Not if we want the vote to decide it. Not if we want to ensure no single person controls the outcome."

  Elena felt a cold clarity settle over her. It wasn't a defect in Harlan's design. It wasn't a flaw in the board's character. It was a structural limit, like the load-bearing capacity of a beam. You could not ask a beam to hold more weight than its physics allowed, and you could not ask a voting system to be honest, fair, and open to all choices simultaneously. Something had to give.

  The second week brought the temptation of reduction.

  "If we only vote on two sites," Sterling proposed during a closed session, "the manipulation disappears. Binary choice is stable. You vote for your preference. No loops."

  "Which two?" asked the representative from Ridgeport.

  "We exclude The Flats," Sterling said. "The data shows The Narrows and The Bend offer better hydraulic retention."

  "The Flats are home to four hundred families!" the Millersburg representative snapped. "You can't just erase us from the map because the math is easier."

  "If we keep The Flats," Sterling countered, "we are back to the lying. We are back to Oakhaven gaming the system to save themselves. Do you want honesty, or do you want options?"

  Elena watched the argument circle. To make the vote honest, they had to shrink the world. They had to declare one possibility impossible before the voting began. But who decided which possibility was impossible? If the Board voted on which two sites to consider, they were just voting on the agenda, and the agenda could be manipulated just like the final choice. The power to exclude was the power to decide.

  To make the binary vote honest, the exclusion had to be fixed, external, undeniable. But it meant sacrificing the hope of the excluded town. It meant telling four hundred families that their safety was not even a variable in the equation.

  "We can't do that," Sterling said finally, rubbing her temples. "We can't formally exclude a site. It's political suicide. And morally... we can't say some lives don't count."

  So they searched for another way. The third week, Paul returned with a different proposal. He placed a single die on the table.

  "Randomization," he said.

  The board stared at the white cube.

  "We assign probabilities," Paul explained. "The vote determines the odds. If The Narrows gets forty percent of the support, there is a forty percent chance the levee goes there. You cannot lie to improve your expected outcome. Truth-telling becomes the safest strategy again. The manipulation vanishes."

  "And if the die rolls against us?" the Millersburg representative asked. Her voice was very quiet.

  "Then the levee goes elsewhere," Paul said. "It is fair. It is honest. It treats every option according to its support."

  "We are talking about flood control," Sterling said. "Not a raffle. If the die rolls for The Flats, and the water comes, and the structure isn't there because chance said no... how do I explain that to the families? How do I explain that we gambled their homes on a coin toss?"

  "It removes the strategic burden," Paul insisted. "No one has to lie."

  "I would rather they lie," Sterling said. "I would rather they game the system and we get a definite outcome than I leave their survival to luck. We are an Authority. We decide. We don't roll dice."

  Paul put the die away. The room felt smaller.

  Elena returned to her office. The rain had slowed to a drizzle, but the river remained high, a brown monster waiting for a mistake. She sat before the standing orders, the document that governed the Authority's decisions. Harlan's rule was in Section 4, Paragraph 2. It was elegant, complex, and broken.

  She understood now. The failure was not in the ink. It was in the request. They wanted a system that allowed three distinct futures. They wanted a system where no single person ruled. They wanted a system where honesty was the best policy. They wanted a system where the outcome was certain.

  She could see the shape of it, a tetrahedron where you could touch three faces but never the fourth.

  If they kept three sites and no dictator, they had to accept lying.
  If they kept honesty and three sites, they had to accept chance.
  If they kept honesty and certainty, they had to accept a dictator or fewer options.

  There was no clever design waiting in the future. There was no better electorate. This was the geometry of collective choice. To proceed was to choose a wound.

  Sterling wanted certainty. The towns wanted honesty. The ethics of the office demanded fairness. But fairness, in this specific configuration, was impossible.

  Elena picked up her pen. She opened the draft memorandum that would authorize the voting procedure for the upcoming special session. The cursor blinked on the screen.

  She could restore Harlan's rule. It was the status quo. But she knew now it was a lie. It promised safety for truth-tellers and delivered vulnerability. If she left it, the board would lie, the outcome would be unstable, and trust in the Authority would erode until the next flood washed it away completely.

  She could introduce the lottery. It was mathematically pure. But it abdicated responsibility. It told the citizens that their government was unwilling to make a hard choice.

  She could appoint the Chair as the sole decider. That was honest and certain. But it was autocracy. It violated the charter of the Authority.

  That left the reduction.

  If she struck one site from the ballot, the remaining vote became binary. In a binary vote, honesty is safe. You vote for what you want. There is no advantage to lying. The manipulation ends. The process becomes clean.

  But someone had to be struck.

  Elena looked at the hydrological reports. The Flats were the most vulnerable, but also the most expensive to protect. The Narrows were the most efficient, but protected fewer people. The Bend was the compromise.

  To make the vote honest, she had to make one outcome impossible. She had to sacrifice the 'Onto' condition, though she did not know the name for it. She had to decide that one town's hope was the price of the system's integrity.

  It was a terrible calculus. It felt like weighing lives against logic. But the alternative was a system that pretended to be fair while rewarding deception.

  Elena typed. She drafted the memo establishing the protocol for the special session. She cited the need for procedural stability. She cited the urgency of the flood season. She did not mention the impossibility. She did not mention that she was choosing which constraint to abandon. She simply enacted the choice.

  Her fingers hovered over the list of sites.

  *The Narrows.*
  *The Bend.*
  *The Flats.*

  If she removed The Flats, Millersburg would burn. If she removed The Narrows, Oakhaven would drown. If she removed The Bend, Ridgeport would be isolated.

  There was no right answer. There was only the decision.

  She thought of Harlan, dead in his office, believing he had solved the unsolvable. He had tried to build a machine that required no sacrifice. He had failed. The sacrifice was not a bug; it was the foundation.

  Elena moved the cursor. She did not choose based on hydrology. She chose based on the only metric left: the preservation of the process itself. The Flats had the highest cost-to-benefit ratio. It was the administrative justification. It was the shield she would hold up when the anger came.

  She highlighted *The Flats*. She pressed delete.

  The list now contained two options. The vote would be binary. The members could vote their true preferences without fear of gaming. The outcome would be deterministic. No single person would dictate the result.

  But The Flats would not be protected. The families there would not know that their exclusion was the price of honesty for everyone else. They would only know they were left out.

  Elena read the memo again. It was dry, bureaucratic, devoid of emotion. It committed the Authority to a specific sacrifice. It acknowledged, without saying so, that they could not have everything. They could not have honesty, fairness, and full choice. They had to trade one for the others.

  She signed the document. The ink was black and final.

  She placed the memo in the outbox. The sound of the paper sliding into the tray was loud in the quiet room. Outside, the river continued to rise, indifferent to the voting rules, indifferent to the impossibility of perfect justice. It only cared about the height of the walls.

  Elena stood up and walked to the window. She watched the water churn against the pilings. She felt no triumph. There was no solution here, only a management of failure. She had saved the integrity of the vote by condemning a site. She had ensured that the board could tell the truth by ensuring someone would not be heard.

  It was a small administrative act. A line struck from a standing order. But it carried the weight of the theorem that dared not be named. She had chosen the constraint to abandon. She had chosen the lie they would tell themselves: that the exclusion was economic, not structural.

  She turned back to her desk. There was other work. The flood season was not over. The river did not care about impossibility results. It only cared about what was built. And now, finally, the Authority could build something, because they had stopped trying to build everything.

  Elena sat down and opened the next file. The pen felt heavy in her hand, but it wrote clearly. She recorded the decision. She certified the procedure. She did the work.
