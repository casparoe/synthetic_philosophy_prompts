  Case 3 is handled worst by this procedure because verifying subjective belief ("awareness") relies entirely on self-reporting when records are absent; the procedure cannot mechanically resolve conflicting testimony about memory, forcing a reliance on credibility assessments that remain vulnerable to error. Regarding Case 4, my procedure explicitly rejects your instinct that declining to comment is safe; a refusal is deceptive when it implies inability rather than unwillingness, especially when precedent contradicts the stated policy. A refusal can be the most deceptive answer available when it uses a procedural shield to hide a discretionary choice, effectively lying about the rules governing the institution to avoid accountability.
