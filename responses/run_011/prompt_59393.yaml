  # Communications Integrity Review Procedure (CIRP)

  **Load-Bearing Concepts:**
  1.  **At-Issue Content:** The specific proposition the question demands be addressed.
  2.  **Subjective Belief Condition:** A statement is a lie only if the speaker asserts it while believing it false.
  3.  **Inference Duty:** A statement is misleading if it invites a false inference the speaker foresees and could correct.

  **What Was Dropped:**
  Deep semantic analysis of presupposition and the distinction between intentional deception and negligent ambiguity. We treat foreseeable false inference as misleading regardless of intent.
  **Loss:** We may flag careful phrasing as misleading even if no harm was intended, increasing review friction to ensure public trust.

  **Unsettled Rule:**
  Where debate exists on whether a true statement that invites a false inference is "misleading," this procedure rules **yes**. If a reasonable listener will infer $Q$ (false), and the speaker knows this, the speaker must correct it or the statement is misleading.

  ---

  ### Review Steps (20-Minute Limit)

  **Step 1: Map At-Issue Content (3 mins)**
  Identify the core proposition the reporter's question asks you to confirm or deny.
  *   *Action:* Write the question as a single declarative sentence (e.g., "X patients died").
  *   *Pass:* At-issue content is clear.
  *   *Fail:* Question is ambiguous. **Escalate to Communications Lead** for clarification before proceeding.

  **Step 2: Verify Factual Truth (5 mins)**
  Check every explicit assertion in the draft against available records.
  *   *Instruction for Unknown Truth:* If a fact cannot be verified within this window (e.g., clinical data pending), you **must** qualify the assertion (e.g., "To our current knowledge...") or **Stop** with verdict **Undetermined**. Do not release unverified facts as absolute.
  *   *Pass:* All assertions are verified true or qualified.
  *   *Fail:* An assertion is known false. **Stop** with verdict **Lie**.

  **Step 3: Check Subjective Belief (Judgment Call 1) (4 mins)**
  Determine if the drafter or source believes the assertions to be true.
  *   *Irreducible Judgment:* You cannot scan a brain. You must assess credibility based on source consistency and documented evidence.
  *   *Action:* Interview the source if necessary. If the source asserts $P$ but evidence suggests they know $\neg P$, flag it.
  *   *Sign-off:* **Communications Lead**.
  *   *Pass:* Source believes the assertion.
  *   *Fail:* Source believes the assertion is false. **Stop** with verdict **Lie**.

  **Step 4: Check Foreseeable Inferences (Judgment Call 2) (5 mins)**
  Identify what a reasonable, informed listener will conclude from the draft.
  *   *Irreducible Judgment:* "Reasonable listener" is not mechanical. You must simulate the public's reading, assuming they are interested but not expert.
  *   *Action:* Compare the At-Issue Content (Step 1) with the Likely Inference. If the draft answers a different question to invite a false belief about the At-Issue Content, it is misleading.
  *   *Sign-off:* **Communications Lead or Deputy**.
  *   *Pass:* Inferences align with At-Issue Content or are true.
  *   *Fail:* Inference is false and uncorrected. **Stop** with verdict **Misleading**.

  **Step 5: Check Refusals and Omissions (3 mins)**
  Review any refusal to answer or selective omission.
  *   *Rule:* A refusal is deceptive if it implies inability to answer when the real reason is unwillingness, regarding At-Issue Content.
  *   *Action:* Check past precedent. If you have answered similar questions before, a blanket refusal is misleading.
  *   *Pass:* Refusal is consistent with policy and precedent.
  *   *Fail:* Refusal contradicts precedent or hides discretion. **Stop** with verdict **Misleading**.

  **Step 6: Risk and Values Escalation (Variable)**
  If the statement is Honest but carries high institutional risk (e.g., admits liability):
  *   *Action:* Do not judge truthfulness here.
  *   *Sign-off:* **General Counsel or CEO**.
  *   *Verdict:* **Honest (Risk Escalated)**.

