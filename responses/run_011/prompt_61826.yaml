      You present a compelling case of stable regularity, but you conflate behavioral output with the structure of practical reasoning that defines a convention. The keyboard scenario fails the conditional preference clause decisively. When I accept a predictive suggestion, I do so because it minimizes my keystrokes, not because I expect you to use the same abbreviation and wish to align with you. My preference is conditional on the machine's affordance, not on your conformity. If I discovered tomorrow that everyone else had stopped using 'tbh' but the algorithm still suggested it due to lagging data, I would continue using it. In a genuine convention, if I learned you no longer expected me to use 'tbh', my reason to use it would vanish, even if the keystrokes remained easy. The regularity is sustained by ergonomics, not by interlocking expectations.

