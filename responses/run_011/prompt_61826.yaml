      (Final Polish):
      You force a choice, and I take the horn that denies these micro-regularities the status of conventions. The crucial failure lies in the structure of the preference. In your typing case, my reason for tapping 'gonna' is instrumental efficiency relative to the interface, not coordination with you. The conditional preference clause requires that I prefer to conform only on the condition that I expect others to conform; here, I prefer to conform on the condition that the machine suggests it. If you were to suddenly switch to typing 'going to' in full, my payoff matrix remains unchanged so long as the keyboard continues to suggest 'gonna'. There is no coordination problem here because my success does not depend on matching your specific behavior, but on optimizing my interaction with a tool. The regularity is a byproduct of aggregate efficiency, not a solution to a recurrent conflict of interest where mutual expectation is the glue.

      Regarding your counterfactual, what changes is the description under which the action is intentional, which is sufficient to alter the metaphysical category of the event. If the ranking were driven by human expectations, I would tap 'gonna' because I believe you expect it and I prefer to meet that expectation to ensure understanding. The keystroke is identical, but the action is different: one is 'saving time', the other is 'communicating clearly'. The belief and preference clauses are not idle; they are constitutive of the social relation. Without them, you collapse the distinction between a social convention and a natural regularity, like birds migrating south. We must look to the reasoning that sustains the behavior, not merely the behavior's stability or the existence of alternatives. If the reasoning does not involve interlocking expectations of conformity, the account correctly excludes it.

