answer: |-
  **MEMORANDUM**

  **TO:** Director, Forecasting Unit
  **FROM:** [Your Name/Consultant]
  **SUBJECT:** Procedure for Grounding Forward-Looking Estimates (Reflection Protocol)
  **DATE:** October 26, 2023

  ### Executive Summary

  Your current "house rule" (blending present and predicted future estimates) is an intuitive but mathematically incoherent attempt to apply **van Fraassen's Reflection Principle**. The Principle states that your current belief should match your *expected* future belief, provided you trust your future self to process new evidence rationally.

  **Recommendation:** Replace the "weighted blend" with a **Deferral Protocol**.
  *   If the analyst expects their future estimate to change due to **new evidence** and trusts the process: Publish the **Expected Future Estimate**.
  *   If the change is expected due to **bias, fatigue, or turnover**: Publish the **Current Evidence Estimate**.
  *   **Do not blend.** Blending double-counts current evidence and violates the coherence the rule was meant to ensure.

  The following procedure operationalizes this for junior analysts.

  ---

  ### Part 1: What the Principle Licenses (and What It Does Not)

  **The Core Rule:**
  Your current probability for an event ($P_{now}$) must equal your *weighted average* of what you think your future probability ($P_{next}$) will be.
  *   **Licensed:** If you are 100% sure your future self will say 0.6, your current number *must* be 0.6. If you think there is a 50% chance you will say 0.6 and a 50% chance you will say 0.4, your current number must be 0.5.
  *   **Forbidden:** You cannot look at your current evidence (0.35), look at your predicted future number (0.6), and average them (0.475). If you trust the future number, the current evidence is already "priced in" to that expectation. Averaging them implies you distrust both your current and future rationality.

  **The Critical Distinction:**
  Reflection applies to your **expectation** of your future self, not a single guess.
  *   **Wrong:** "I think I'll probably say 0.6 next quarter, so I'll write 0.6 now."
  *   **Right:** "There is a 70% chance I will say 0.6 (data arrives) and a 30% chance I will say 0.3 (data delayed). My number now is $(0.7 \times 0.6) + (0.3 \times 0.3) = 0.51$."

  ---

  ### Part 2: The 30-Minute Deferral Protocol

  **Analyst Instructions:** Complete this checklist quarterly for each continuing question. Time limit: 30 minutes.

  **Step 1: Establish the Current Baseline (5 mins)**
  *   **Action:** Calculate your estimate based *only* on evidence currently in hand.
  *   **Output:** `Current_Evidence_Estimate` (e.g., 0.35).
  *   **Stop Condition:** If you cannot form a view based on current evidence, halt. Mark "Insufficient Data" and escalate to Director.

  **Step 2: Predict the Future Distribution (10 mins)**
  *   **Action:** Do not pick a single number. Define the possible values for next quarter's estimate and their probabilities.
  *   **Question:** "What specific data releases or events occur between now and next quarter?"
  *   **Output:** A list of scenarios.
      *   *Scenario A (Data arrives on time):* Probability __%, Estimate __.
      *   *Scenario B (Data delayed):* Probability __%, Estimate __.
      *   *Scenario C (Unexpected event):* Probability __%, Estimate __.
  *   **Calculation:** Compute the weighted average. This is your `Expected_Future_Estimate`.

  **Step 3: The "Source of Change" Diagnostic (10 mins)**
  *   **Action:** Answer **YES** or **NO** to the following three questions.
      1.  **Evidential:** Is the expected change driven primarily by new data we currently anticipate? (Yes/No)
      2.  **Rational:** Do you expect your future self to process that data using standard agency protocols, without external pressure? (Yes/No)
      3.  **Identity:** Will *you* be the one calculating the number next quarter, using the same definition of the event? (Yes/No)
  *   **Decision Rule:**
      *   If **ALL YES**: Proceed to Step 4 (Deferral).
      *   If **ANY NO**: Proceed to Step 5 (Rejection).

  **Step 4: Deferral Calculation (Requires Director Sign-off)**
  *   **Action:** Set `Published_Figure` = `Expected_Future_Estimate` (from Step 2).
  *   **Reasoning:** "Deferral licensed under Reflection Principle."
  *   **Flag:** If `Published_Figure` differs from `Current_Evidence_Estimate` by >0.10, attach a "Statutory Compliance Note" for the Director (see Case 1).
  *   **Output:** Submit for Signature.

  **Step 5: Rejection of Future (Standard Publication)**
  *   **Action:** Set `Published_Figure` = `Current_Evidence_Estimate` (from Step 1).
  *   **Reasoning:** "Deferral blocked: Non-evidential drift or turnover expected."
  *   **Output:** Publish. No signature required unless variance from last quarter exceeds standard thresholds.

  ---

  ### Part 3: Conditions for Deferral (The Diagnostic Criteria)

  Use this key to answer Step 3 of the protocol.

  | Condition | Deferral Appropriate? | Rationale |
  | :--- | :--- | :--- |
  | **New Data Expected** | **YES** | Reflection assumes you conditionalize on evidence. If you know the evidence is coming, your current credence should reflect its expected impact. |
  | **Fatigue / Burnout** | **NO** | If you expect your future self to be careless or rushed, your future credence is "noisy." Do not defer to noise. |
  | **Funder Pressure** | **NO** | If you expect your future estimate to shift to please a stakeholder (not due to data), that is bias. Reflection requires trust in rationality. |
  | **Analyst Turnover** | **NO** | Reflection is indexical ("*My* future belief"). It does not apply to a colleague's belief, even if they use the same model. (See Case 3). |
  | **Shifting Definitions** | **NO** | If the hazard threshold or emergency definition changes internally, the proposition $A$ is no longer the same proposition $A$. Reflection fails. |

  ---

  ### Part 4: When the Analyst Cannot Predict

  It is common for an analyst to say, "I have no idea what I'll think next quarter."

  **Procedure:**
  1.  **Record:** "Future Credence Indeterminate."
  2.  **Action:** **Halt Deferral.** Publish the `Current_Evidence_Estimate`.
  3.  **Rationale:** Reflection is a constraint on coherence. If you cannot specify the future constraint, the principle is inert. It cannot generate a number from thin air.
  4.  **Note:** Do not guess. A guessed future credence introduces more error than ignoring the future entirely.

  ---

  ### Part 5: Technical Distinctions vs. Judgment Calls

  **Must Survive (Technical):**
  *   **Expectation vs. Single Value:** You must average over scenarios (Step 2). Picking the "most likely" future number violates the math of expectation.
  *   **Indexicality:** The principle applies to *your* future mind, not the "Unit's" future mind.
  *   **Evidential vs. Non-Evidential:** The source of the change determines whether deferral is rational.

  **Judgment Calls (Dressed as Procedure):**
  *   **The "Rationality" Check (Step 3, Q2):** There is no objective test for whether you will be "rational" next quarter. This relies on the analyst's self-awareness. *Mitigation:* Require a brief written justification if answering "Yes" while under high workload stress.
  *   **The Statutory Flag (Step 4):** The threshold for flagging a discrepancy (>0.10) is arbitrary. It is a risk management control, not a philosophical requirement.

  ---

  ### Part 6: Case Studies

  **Case 1: The Scheduled Survey (Evidence Update)**
  *   **Inputs:** `Current_Evidence` = 0.35. `Predicted_Future` = 0.60 (National survey releases next month).
  *   **Protocol Run:**
      *   Step 3 Diagnostic: Evidential? **Yes**. Rational? **Yes**. Identity? **Yes**.
      *   Step 4 Result: **Publish 0.60.**
  *   **Director Note:** Reflection dictates 0.60. Your current evidence (0.35) is incomplete because it ignores the *certainty* of the incoming survey.
  *   **Statutory Conflict:** If your mandate is "report based on evidence *in hand*," publishing 0.60 may be non-compliant, even if rational.
      *   *Advice:* The procedure flags this for you. If the statute is strict, you must override the protocol and publish 0.35, noting the limitation. If the statute allows "best available assessment," 0.60 is superior. **Signature Required.**

  **Case 2: The Funder's Target (Bias Drift)**
  *   **Inputs:** `Current_Evidence` = 0.50. `Predicted_Future` = 0.75 (Funder announced a 75% target; analyst expects to unconsciously align).
  *   **Protocol Run:**
      *   Step 3 Diagnostic: Evidential? **No** (Shift is due to pressure, not data).
      *   Step 5 Result: **Publish 0.50.**
  *   **Rationale:** Reflection requires trust in the future self's rationality. If the analyst identifies the future shift as a bias ("reasons she would not defend as evidential"), deferral is forbidden. The "blend" rule would have incorrectly pulled the number toward 0.75. This procedure protects integrity.

  **Case 3: The Secondment (Turnover)**
  *   **Inputs:** `Current_Evidence` = 0.40. Analyst leaves next month. Colleague takes over.
  *   **Protocol Run:**
      *   Step 3 Diagnostic: Identity? **No** (Colleague will calculate).
      *   Step 5 Result: **Publish 0.40.**
  *   **Rationale:** Van Fraassen's Reflection applies to *personal* identity over time. You cannot defer to a colleague's future credence using this principle, as you do not have access to their internal rationality constraints.
  *   **Alternative:** If the Unit requires continuity, treat the "Unit Estimate" as the entity. However, under the current personal-analyst model, you must revert to Current Evidence. Do not guess what the colleague will say.

  ---

  ### Part 7: Limitations and Misfires

  **1. The Value/Recommendation Trap**
  *   **Issue:** You also issue recommendations (e.g., "We ought to pre-position supplies"). There is a temptation to ask: "Will my future self think this was the right recommendation?"
  *   **Warning:** **Do not apply this procedure to recommendations.** Reflection applies to *credences* (beliefs about truth), not *utilities* (values).
  *   **Reason:** Your future self might change their mind about what is "good" due to shifting priorities, not new evidence. Deferring to a future "ought" commits the naturalistic fallacy. Keep this protocol strictly for probability estimates (0 to 1).

  **2. The "Self-Fulfilling" Risk**
  *   **Issue:** Publishing a deferred number (e.g., 0.60 in Case 1) might trigger the emergency declaration you are predicting.
  *   **Limitation:** Reflection assumes your belief does not *cause* the fact. If your forecast influences the outcome (performativity), the principle misfires.
  *   **Action:** If the question is performative, revert to `Current_Evidence_Estimate` and note the performativity risk.

  **3. What This Cannot Settle**
  *   This procedure cannot resolve disputes about *what counts as evidence*. If the analyst and Director disagree on whether the upcoming survey is "reliable evidence," the Step 3 Diagnostic will be contested. This requires management oversight, not a checklist.

  ### Final Directive

  Implement this protocol immediately. It eliminates the inconsistent "feel-based" weighting. It forces analysts to distinguish between *learning* (which justifies looking forward) and *drifting* (which requires anchoring to the present).

  **Signed,**
  [Your Name]
