prompt: |-
  My sister-in-law Rhonda has chaired the leave and light-duty board at the canning plant where she's worked for like 22 years, and I do the office stuff for our local so I take the minutes, which means I've sat through maybe forty of these meetings and written down every single call they made. Everybody at the hall says she's inconsistent as hell. I don't buy it. I think there's a small number of rules that fit her whole record and nobody's bothered to say what they are, and I'd like to work that out before next Thursday, because there's a case coming that I think splits the board right down the middle. Here's the track record from my notes: forklift driver with a disc blown out from lifting, light duty approved in under two minutes, no discussion. Guy in shipping with a small hernia on his physical, no pain, no restrictions from his own doctor, asked to be pulled off the heavy cases before it got worse — denied, Rhonda said we don't pay people for things that might happen. Same year a maintenance tech comes back from his annual physical with blood pressure through the roof, never had a symptom in his life, hasn't taken a sick day in eleven years, and they pull him off the ladders on the spot and pay for the monitoring and the meds, and Rhonda calls that one obvious. Woman in QC in the middle of a custody fight asks for two weeks with no diagnosis whatsoever, her doctor just wrote "acute situational stress, unable to work" — approved 5-2. Another guy asks for a week after his brother dies and gets denied, on the grounds that the bereavement clause already covers it and grief "is not a health condition." Burnout request with no note: denied, barely discussed. Every pregnancy request in twenty years: approved instantly, and Rhonda says out loud every single time that pregnancy isn't a sickness but she's not going to argue about it. New hire in the packing room who physically can't hit the case rate, nothing on any test, no diagnosis, just not strong: denied modified duty, "not being able to do the job you were hired for isn't a medical problem" — while another packer with a diagnosed nerve thing in her wrist got approved with a rate reduction the same month. Older machinist losing his hearing: they said that's just age, denied the sick leave, then bought his hearing aids out of the safety budget and moved him off the press anyway. Driver with sleep apnea on a CPAP: schedule change approved; driver who weighs about the same with no apnea diagnosis wanting the identical change: denied. Line lead in treatment for drinking: approved, job protected, everyone agreed that's a medical condition; line lead who asked for leave for a gambling problem: denied 4-3, somebody said that's not medicine. QC inspector with bad hand psoriasis who can't do the wet rotation: approved.

  Thursday's case is Margie, 51, line supervisor here forever, one of the best they've got. She's asking for intermittent leave and off the overnight rotation for three or four months: hot flashes, night sweats, not sleeping, fog in her head, and she definately cried in the pre-meeting, which is not like her. Her own doctor wrote a note naming menopausal symptoms and starting her on hormone therapy. There's nothing else wrong with her, no diagnosis of anything, and she's a supervisor, so she isn't around the machines and nobody is claiming she's a safety risk. HR's line — and I think this is where Rhonda is leaning — is that menopause is a normal stage of life that half the workforce goes through and its not an illness, and that if they approve this they've approved every worker over 50 who wants a schedule change. The union side says she is obviously suffering and there's obviously a treatment for it, so what exactly are we arguing about.

  So: which rules genuinely fit that entire record? Give me more than one, because I'm pretty sure at least three do, and say what each of them predicts for Margie and how the vote comes out under each. Then give me your best guess at what Rhonda actually does Thursday and why, plus which of the old cases is the closest analog to this one and where that comparison starts to break down — I have a feeling the machinist matters here but I can't articulate it. And the practical part: whatever you come up with, I'm handing it to the two union-side members, so I need to know what they should argue if they want the board to be consistent with its own history rather than merely sympathetic, and what the board would be committing itself to if it says yes versus if it says no — like what counts as being sick here from now on, and what they've quietly agreed can never count. Last thing, name me one hypothetical case that hasn't come up at this plant, something specific I could watch for, that would finally settle which rule Rhonda is running, and explain why it separates them.
