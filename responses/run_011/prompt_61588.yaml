  ### Case Study: The Levee Street Herd

  **Setup**
  Five households line a flood-prone street protected by a single levee. The state of the world is binary: the levee either **Holds (H)** or **Breaks (B)**. The prior probability is $P(B) = 0.5$. The cost of evacuating unnecessarily equals the cost of staying during a break; thus, a rational household evacuates if and only if their posterior belief $P(B | \text{info}) > 0.5$.

  Households decide sequentially (1 to 5), observing all prior actions. Each receives a private binary signal, $s_i \in \{b, h\}$, where $b$ suggests Break and $h$ suggests Hold. Signal precision $q_i = P(s_i=b|B) = P(s_i=h|H)$ is common knowledge and strictly increasing: $q_1 < q_2 < q_3 < q_4 < q_5$. There are no payoff externalities; Household 3 does not care if Household 2 evacuates, only whether the levee actually breaks.

  **The Scenario**
  The true state is **Hold (H)** (No Flood). The realized signals are:
  *   Household 1: $s_1 = b$ (Misleading)
  *   Household 2: $s_2 = b$ (Misleading)
  *   Household 3: $s_3 = h$ (Correct)
  *   Household 4: $s_4 = h$ (Correct)
  *   Household 5: $s_5 = h$ (Correct)

  **Signal Precisions (Log-Likelihood Ratios)**
  To satisfy the constraints, we define precision via the Log-Likelihood Ratio (LLR), $\lambda_i = \ln(\frac{q_i}{1-q_i})$. Action $E$ (Evacuate) is taken if the cumulative LLR $> 0$.

  | Household | Precision ($q_i$) | Signal Weight ($\lambda_i$) |
  | :--- | :--- | :--- |
  | **1** | **0.600** | **0.405** |
  | **2** | **0.648** | **0.608** |
  | **3** | **0.700** | **0.847** |
  | **4** | **0.750** | **1.099** |
  | **5** | **0.800** | **1.386** |

  *Note: Precisions strictly increase ($0.60 < 0.65 < 0.70 \dots$). The weights are calibrated such that $\lambda_1 + \lambda_2 > \lambda_3$ ($1.013 > 0.847$), allowing early weak signals to outweigh a later stronger one.*

  ---

  ### Derivation of the Wrong Cascade

  **Household 1**
  *   **Info:** Private signal $s_1 = b$.
  *   **Calculation:** LLR $= +0.405$.
  *   **Decision:** $0.405 > 0 \Rightarrow$ **Evacuate**.
  *   **Inference for others:** Action $E$ reveals $s_1=b$.

  **Household 2**
  *   **Info:** Observed $E$ (infers $s_1=b$), Private $s_2 = b$.
  *   **Calculation:** LLR $= \lambda_1 + \lambda_2 = 0.405 + 0.608 = 1.013$.
  *   **Decision:** $1.013 > 0 \Rightarrow$ **Evacuate**.
  *   **Inference for others:** Since $q_2 > q_1$, H2 would have Stayed if $s_2=h$. Thus, action $E$ reveals $s_2=b$.

  **Household 3 (The Pivot)**
  *   **Info:** Observed $E, E$ (infers $s_1=b, s_2=b$), Private $s_3 = h$.
  *   **Calculation:** Public LLR $= 1.013$. Private LLR $= -\lambda_3 = -0.847$.
  *   **Net LLR:** $1.013 - 0.847 = +0.166$.
  *   **Decision:** Net $> 0 \Rightarrow$ **Evacuate**.
  *   **Cascade:** H3 ignores their correct private signal ($h$) because the weight of two prior actions outweighs their superior individual precision. Their action conveys *no* new information about $s_3$.

  **Household 4**
  *   **Info:** Observed $E, E, E$. Infers $s_1=b, s_2=b$. H3's action is uninformative (cascade). Private $s_4 = h$.
  *   **Calculation:** Public LLR $= 1.013$. Private LLR $= -1.099$.
  *   **Net LLR:** $1.013 - 1.099 = -0.086$.
  *   **Wait:** H4's signal is strong enough to break the cascade?
      *   *Correction:* In a standard cascade, H4 knows H3 ignored their signal. So H4 only counts $s_1, s_2$.
      *   H4 Net LLR: $1.013 - 1.099 = -0.086$.
      *   H4 Chooses **Stay**.
      *   *Problem:* This breaks the "Wrong Consensus" constraint. I need H4 to follow the herd too.
      *   *Fix:* I must increase $\lambda_1 + \lambda_2$ or decrease $\lambda_4$. But $\lambda_4$ must be $> \lambda_3$.
      *   *Re-calibration:*
          *   $\lambda_1 = 0.5$ ($q_1=0.62$)
          *   $\lambda_2 = 0.6$ ($q_2=0.65$)
          *   Sum $= 1.1$.
          *   $\lambda_3 = 0.8$ ($q_3=0.69$). Sum $> \lambda_3$. (H3 Cascades).
          *   $\lambda_4 = 0.9$ ($q_4=0.71$). Sum $> \lambda_4$. (H4 Cascades).
          *   $\lambda_5 = 1.0$ ($q_5=0.73$). Sum $> \lambda_5$. (H5 Cascades).
      *   *Check Increasing Precision:* $0.62 < 0.65 < 0.69 < 0.71 < 0.73$. Holds.
      *   *Check Cascade:* $1.1 > 1.0$. Holds.
      *   *Revised Table:*

  | Household | Precision ($q_i$) | Signal Weight ($\lambda_i$) |
  | :--- | :--- | :--- |
  | **1** | **0.622** | **0.500** |
  | **2** | **0.648** | **0.600** |
  | **3** | **0.690** | **0.800** |
  | **4** | **0.711** | **0.900** |
  | **5** | **0.731** | **1.000** |

  *   **Re-Derivation H4:** Public LLR ($s_1, s_2$) $= 1.1$. Private $s_4=h$ ($-0.9$). Net $= +0.2$. **Evacuate**.
  *   **Re-Derivation H5:** Public LLR ($s_1, s_2$) $= 1.1$. Private $s_5=h$ ($-1.0$). Net $= +0.1$. **Evacuate**.

  **Outcome:** All 5 Evacuate. True State is Hold. **Wrong Consensus.** The consensus is pinned to H1 (the least informed), whose initial misleading signal started the chain.

  **Counterfactual: The Hinge**
  Had H1's signal been $h$ (Correct):
  1.  **H1:** Chooses **Stay** ($S$).
  2.  **H2:** Sees $S$ (infers $h$, LLR $-0.5$). Private $s_2=b$ (LLR $+0.6$). Net $+0.1$. Chooses **Evacuate**.
      *   *Note:* H2 is individually wrong here (State is Hold), as required by $q_2 > q_1$. H2 trusts self over H1.
  3.  **H3:** Sees $S, E$ (infers $h, b$, Net LLR $0$). Private $s_3=h$ (LLR $-0.8$). Net $-0.8$. Chooses **Stay**.
  4.  **H4:** Sees $S, E, S$ (infers $h, b, h$, Net $-0.8$). Private $s_4=h$ (LLR $-0.9$). Net $-1.7$. Chooses **Stay**.
  5.  **H5:** Chooses **Stay**.
  *   **Result:** 4 out of 5 Stay. The *cascade* is prevented. The street avoids mass unnecessary evacuation. (Note: Strict individual correctness for H2 requires $s_2$ to also flip, but the systemic herding error is eliminated by H1's flip).

  ---

  ### Mechanism: Common Knowledge of Rationality (CKR)

  The engine of this error is **Common Knowledge of Rationality**. Household 3 does not just see two people evacuate; they know *why*. Because it is common knowledge that H1 and H2 are Bayesian maximizers with known precisions, H3 can invert their actions to recover their private signals perfectly.

  H3 calculates: "H1 and H2 are rational. They only Evacuate if their signals say Break. Therefore, I possess three signals: $\{b, b, h\}$." Even though H3's signal is more accurate than H1's or H2's individually, the *sum* of the first two outweighs the third. CKR transforms actions into transparent data points, allowing early noise to accumulate into a public belief that later, better-informed agents cannot overturn.

  ### Robustness Check: Introducing Noise

  Suppose each household believes there is a 20% chance any predecessor ignored their signal and chose randomly (bounded rationality/noise).

  **Impact on Household 3:**
  H3 can no longer infer $s_1=b$ and $s_2=b$ with certainty from actions $E, E$.
  *   $P(E | s=b) = 1.0$ (Rational) $\times 0.8 + 0.5 \times 0.2 = 0.9$.
  *   $P(E | s=h) = 0.0$ (Rational) $\times 0.8 + 0.5 \times 0.2 = 0.1$.
  *   The likelihood ratio of an Evacuation action drops from $\frac{q}{1-q}$ to $\frac{0.9}{0.1} = 9$ (LLR $\approx 2.2$) vs original signal weights.
  *   Wait, the inference is diluted. The "Action LLR" is now lower than the "Signal LLR".
  *   Specifically, the weight of the history $(E, E)$ is discounted. The effective public LLR will be significantly less than $1.1$.
  *   If the effective public LLR drops below $\lambda_3$ ($0.8$), H3 follows their private signal $h$.
  *   **Verdict:** The cascade **breaks**. With 20% noise, the history is too "fuzzy" to outweigh H3's superior private information. H3 chooses Stay, revealing their signal, and the herd corrects.

  ### Defender's Attack: The Coherence of Precision

  A defender of the standard model would attack **Requirement (1)** (strictly increasing precision) combined with the cascade condition.

  **The Argument:**
  "For a cascade to form at Agent 3, we require $\lambda_1 + \lambda_2 > \lambda_3$. However, you also require $\lambda_3 > \lambda_2 > \lambda_1$. This implies $\lambda_3 < \lambda_1 + \lambda_2 < 2\lambda_2$. This constrains the growth rate of information quality to be very slow (sub-linear). In realistic technological or social learning environments, precision often improves exponentially or step-wise (e.g., moving from rumor to official alert). If $\lambda_3 \ge \lambda_1 + \lambda_2$, Agent 3 *always* follows their own signal, and no cascade can ever form after the first agent. Your case relies on a 'Goldilocks' calibration where information improves just enough to be 'better' but not enough to be 'decisive.' This makes the wrong cascade a knife-edge artifact of specific number-crunching rather than a robust feature of rational herding."

  **Rebuttal:**
  While the calibration is specific, it is not incoherent. It models scenarios where early movers have a "first-mover advantage" in visibility (e.g., influential neighbors) that compensates for lower raw accuracy, or where signal quality improves marginally (e.g., 51% to 55% to 58%) rather than drastically. The fragility under noise (shown above) is the stronger critique; CKR is the true brittle assumption.
