answer: |-
  Dear Colleague,

  My diagnosis is that this impasse is primarily methodological, specifically concerning the direction of justification, which subsequently generates a verbal dispute over the term responsibility that masks a substantive disagreement about the legitimate aims of sentencing. Your hypothesis regarding the direction of justification not only survives contact with the material but offers the most precise explanation for why the stock intuitions fail to move either side, because it identifies that the two camps are not playing the same game of justification rather than merely playing it poorly. The Dennettians treat the social practice of holding responsible as the fixed point that metaphysics must accommodate, whereas the skeptics treat the metaphysical facts about causation and luck as the fixed point that practice must accommodate. This methodological divergence explains why the dispute feels both verbal, since they are defining responsibility differently, and substantive, since those definitions entail incompatible constraints on state power. It is not merely two questions travelling under one name, because the answers collide in the legislative arena, but it is a case where the conceptual confusion is a symptom of the deeper structural disagreement about whether legitimacy flows from the utility of the practice or the truth of the underlying metaphysics.

  To see why your hypothesis holds, consider the structure of the moves each side makes when you introduce a case like the sniper with the amygdala tumor. The skeptic treats this as a trump card because it isolates a metaphysical condition, causal determination by a pathological state, that undermines basic desert. For them, the justification for sanctioning must be addressed to the agent as a metaphysical subject, and if the metaphysics do not support desert, the sanction loses its moral force regardless of social utility. The Dennettian, however, treats the same case as a boundary condition for the practice of accountability rather than a metaphysical revelation. They ask whether holding this person responsible serves the competence-constituting function of agency. If the tumor removes the capacity to respond to reasons, the Dennettian agrees to exempt the sniper, but not because desert vanished in a metaphysical sense; rather, because the practice of holding responsible no longer functions to sustain agency in this instance. When the skeptic says the compatibilist is changing the subject, they mean the compatibilist has shifted the justification from the agent's metaphysical status to the system's functional needs. When the compatibilist says the skeptic is attacking a straw man, they mean the skeptic is demanding a metaphysical warrant that the practice never required to begin with. Your insight that this is about the direction of justification captures exactly why these moves slide past one another; one side is testing the practice against the world, and the other is testing the world against the practice.

  Your alternative diagnosis regarding the audience of justification is also correct and functions as a corollary to the methodological point. The compatibilist is indeed arguing for system-level legitimacy, concerned with how the state maintains a community of citizens who recognize each other as agents. The skeptic is arguing for agent-facing legitimacy, concerned with what can truthfully be said to the individual offender about why they are being suffering sanctions. This explains why the skeptics reject the compatibilist vocabulary as dishonest; from the agent-facing perspective, telling an offender they are responsible in a compatibilist sense feels like a semantic trick if the underlying causal determinism remains unacknowledged. Conversely, the compatibilists reject the skeptic vocabulary as dehumanizing because the quarantine model addresses the offender as a vector of risk rather than a participant in a normative community. This divergence means that intuition pumps about negligence or addiction will never resolve the dispute, because each side filters the intuition through their preferred audience. The skeptic hears the intuition as a claim about what the agent deserves, while the compatibilist hears it as a claim about what the community needs to sustain trust. Consequently, the dispute over which intuitions count as data is secondary; the data are being processed by different algorithms.

  Given this diagnosis, progress will not look like a metaphysical settlement or a knockout argument from cases, because the methodological divergence is structurally immune to such moves. Instead, progress should be measured by the ability to construct an overlapping consensus that acknowledges the divergence without letting it paralyze policy. You should look for a change of question, shifting from what responsibility is to what functions the sentencing system must perform to be both humane and effective. A useful distinction would be between responsibility as a status required for participation in the political community and responsibility as a condition for retributive suffering. If the coalition can agree that the state should not inflict suffering based on basic desert, the skeptics are satisfied, and if the coalition can agree that offenders must be engaged as moral agents capable of reform rather than managed as risks, the compatibilists are satisfied. This does not require resolving the metaphysics, only agreeing on the constraints it places on the state. A result about how blame attributions behave empirically would be interesting but likely irrelevant to the normative deadlock, because both sides could accept the empirical data and still disagree on what normatively follows from it. The only concession that should be expected is that neither side will convert the other, and therefore the preamble must be drafted to allow for multiple justifications of the same policy outcomes.

  Regarding the concrete formulation for the legislative committee, it is possible to draft a principle that both camps could sign without dishonesty, provided the text focuses on political commitments rather than metaphysical assertions. The text would be dishonest only if it claimed a unified theory of responsibility that does not exist, but it is honest if it frames the coalition's stance as a pragmatic agreement on the limits of state power. I suggest a formulation that centers on accountability as a forward-looking engagement rather than a backward-looking judgment. You might propose language stating that the coalition affirms the importance of holding individuals accountable for their actions as a means of respecting their agency and fostering public safety, while simultaneously affirming that sanctions must be proportionate to the harm caused and limited by the goal of rehabilitation rather than retribution. This allows the Dennettians to read accountability as the constitutive practice of citizenship and the skeptics to read the limitation on retribution as a concession to the lack of basic desert. Specifically, you could write that the state must treat offenders as moral agents capable of change, which satisfies the compatibilist need for agency, while asserting that the severity of sanctions must be justified by future risk and the necessity of harm reduction, which satisfies the skeptic need to abandon desert-based punishment.

  Such a text avoids the word desert entirely, which is the primary flashpoint, and replaces it with the language of agency and justification. The skeptics can sign this because it commits the system to a public-health model where restriction is minimally intrusive and forward-looking. The compatibilists can sign this because it maintains the vocabulary of accountability and moral agency, refusing to reduce the offender to a mere object of management. The honesty of the document rests on your willingness to acknowledge in the working group that this is a political compromise rather than a philosophical synthesis. If you present this to the committee as a unified metaphysical front, you will be lying, but if you present it as a coalition of different philosophical traditions agreeing on the requirements of a humane justice system, you are telling the truth. The impasse you are facing is real, but it is not a barrier to legislation; it is a barrier to a shared preamble that claims too much. By scaling back the philosophical claims to match the policy agreement, you can break the six-week deadlock without asking either side to surrender the core of their view. You are not solving the philosophical problem, but you are rendering it legislatively inert, which is the most any drafter can hope to achieve.
