      *   **Constraint:** Reason from the practice (don't just cite theory). No bibliographies.
      *   **Ending Requirement:** Concrete changes required if a house committed to a "drama-first" view vs. "sound-surface-first."
      *   **Reference:** Bernard Williams (treats opera as drama), but user is shaky on him. Use this as a touchstone but don't get bogged down in exegesis.

  2.  **Deconstruct the "Mainstream Bundle":**
      *   *Practice:* Original Language + Surtitles + Musical Fidelity + Directorial License.
      *   *Implicit Theory:* Opera is a *Musical Object* that *References* a Drama.
      *   *Why Original Language?* Because the sound of the words is part of the music (vowel shapes, rhythm, rhyme). The composer set *these* sounds.
      *   *Why Surtitles?* To provide semantic access without altering the sonic object. But they are secondary (compressed, delayed). They are a translation aid, not the libretto.
      *   *Why Musical Fidelity?* The score *is* the work.
      *   *Why Directorial License?* Because the "drama" implied by the score is abstract enough to be re-contextualized, provided the music remains intact. The setting is illustrative, not constitutive.

  3.  **Identify the Rival Accounts:**
      *   *Account A: Opera as Drama (Williams-ish).* The point is the human action. If the audience doesn't understand the words instantly, the drama is broken. Music serves the drama.
      *   *Account B: Opera as Concert.* The point is the singing and the sound. Drama is an excuse for the noise. (The "Park & Bark" model).
      *   *Account C: Opera as Total Work of Art (Wagnerian).* Everything is fused. Changing one thing breaks the spell. (The mainstream actually rejects this by allowing Regietheater).
      *   *Account D: Opera as Museum Piece.* Fidelity to original staging conditions (historically informed performance). (Mainstream rejects this by allowing modern dress).

  4.  **Analyze Consistency/Underdetermination:**
      *   *Is it consistent?* Mostly, but there's a tension. If the music dictates the emotion, why does the director need to set it in a fascist state to make us feel the oppression? If the original language is sacred for sonic reasons, why is the *meaning* of the words (conveyed via titles) allowed to be compressed/edited?
      *   *Underdetermination:* Yes. You can justify the mainstream bundle with two different theories:
          1.  *The Sonic Monument:* The music is the truth; the stage is just a visualization.
          2.  *The Abstract Drama:* The specific plot is less important than the psychological archetypes, which the music reveals.

  5.  **Address the Bernard Williams Point:**
      *   Williams argued that in opera, the music *enacts* the psychology. It's not just accompaniment. But he also cared about intelligibility. The mainstream practice separates the sonic enactment (music) from the semantic understanding (titles). Williams might argue this creates a split consciousness.

  6.  **Develop the "Drama-First" vs. "Sound-Surface-First" Concrete Changes:**
      *   *Current (Sound-Surface/Musical Object):* Original language, orchestra pit prominent, singer facing out for acoustics, titles as add-on, directorial concept often visual/metaphorical.
      *   *Drama-First:*
          *   Language: Vernacular (no titles needed, or titles integral).
          *   Acoustics: Mics? (Heretical, but logical for drama). Or smaller halls.
          *   Staging: Actors must face each other, not the audience. Movement prioritized over vocal placement.
          *   Music: Tempo flexible for speech rhythm? Orchestration reduced if it drowns text?
          *   Titles: If kept, they must be simultaneous and poetic, not compressed.

  7.  **Drafting the Narrative (Iterative refinement):**
      *   *Tone:* Intellectual, analytical, slightly provocative (magazine style).
      *   *Structure:*
          1.  Diagnose the "Mainstream Bundle."
          2.  Identify the underlying theory (Opera as Musical Architecture).
          3.  Contrast with the "Drama" theory.
          4.  Discuss the inconsistency (The Title Paradox).
          5.  Concrete implications (The "What If" section).

      *(Self-Correction during drafting)*: I need to be careful not to say the mainstream view is *wrong*, just what it *is*. The user wants to know what theory the practice *presupposes*.
      *   *Key Insight:* The mainstream view treats the *Score* as the Work, and the *Libretto* as raw material for the Score. The *Staging* is commentary on the Work.
      *   *The Title Paradox:* Titles are treated as utility (like a wheelchair ramp), not part of the art. But they mediate the whole experience.
      *   *Williams:* He suggests the music *is* the knowledge of the character's mind. If so, understanding the words semantically is secondary to hearing the emotional truth in the strings. This supports the mainstream view actually. Wait, Williams also said opera is *action*. I need to balance this. Let's posit that the mainstream view is "Music as Drama," whereas the user's "Drama-First" implies "Text/Action as Drama."

      *Refining the "Drama-First" concrete changes:* If drama is king, the voice is an instrument of speech, not just sound. This means vernacular is non-negotiable. It also means the orchestra cannot drown the text. This leads to radical changes in balance and perhaps amplification.

  8.  **Final Polish:** Check against constraints. No bibliography. Reason from practice. End with concrete changes. Ensure the distinction between "Musical Object" and "Dramatic Action" is clear.

      *One nuance:* The user mentions ENO as the exception. I should use that to highlight the rule. The rule is: Sound > Sense.

      *Final check on Williams:* Williams' essay "Opera as a Kind of Drama" (in *On Opera*) argues that the music *reveals* the inner life. He isn't necessarily saying "translate it." He's saying the music *does* the dramatic work. So the mainstream view is actually quite Williams-ian in that it privileges the music's expression over the literal text. The "Drama-First" view the user is asking about is more like "Theater-First." I need to make that distinction clear.

      *Wait, re-reading the prompt:* "Bernard Williams... treats opera as drama rather than a concert with costumes." Okay. So Williams is on the side of *meaning*. But the mainstream practice (Original Language + Titles) prioritizes *sound*. So the mainstream practice is actually *deviating* from a strict Williamsian "drama as action" view, unless one argues the music *is* the action. I will frame it as: Mainstream = Music is the primary vehicle of truth. Drama-First = Text/Action is the primary vehicle of truth.

      *Let's structure the argument:*
      1. The Mainstream Bundle defines Opera as a **Musical Monument**.
      2. The Libretto is substrate, not scripture.
