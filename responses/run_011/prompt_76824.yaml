      5. Concrete shifts for Drama-First.

      *Ready to write.*
answer: |-
  The practice you're describing—the "Mainstream Bundle" of original language, sacrosanct score, hackable surtitles, and free-range directing—presupposes a very specific, somewhat contradictory theory of the art form. It treats opera not as a play with music, nor as a concert with costumes, but as a **Musical Monument**.

  Here is the reasoning from the practice, broken down by what the rules imply about the work itself.

  ### 1. The Score is the Work; The Libretto is Raw Material
  The fact that the music is inviolable while the text is compressed for surtitles reveals the hierarchy. In this theory, the composer is the primary author, and the librettist is a supplier of raw materials.

  When a title operator cuts a line of text to fit a two-second window, they are admitting that the *semantic precision* of the libretto is secondary to the *temporal flow* of the music. If the text were sacred, the music would have to wait for the reader to finish the sentence. It doesn't. The music drives; the text trails.

  This rules out the theory that opera is primarily a vehicle for poetry or narrative logic. It also rules out the "concert with costumes" view, because if it were just a concert, the staging wouldn't matter enough to warrant a director's radical reinterpretation. The staging is allowed to be radical precisely because the "real" work is happening in the pit and the singers' throats. The visual production is merely commentary on the Musical Monument, not part of the monument itself.

  ### 2. The Sound of Words > The Meaning of Words
  The insistence on original language, even when it necessitates a craned neck to read titles, posits that the phonetic texture of the language is part of the instrumentation. A German *ich* sounds different from an English *I*; the vowel shape affects the resonance of the singer's head, which affects the timbre.

  By keeping the original language, the institution is saying: **The composer set these sounds, not just these ideas.** To translate the singing is to re-orchestrate the vocal line. This is why ENO is treated as the eccentric exception; they are effectively performing a different arrangement of the work, akin to a transcription for different instruments.

  However, this creates the "Title Paradox" you noticed. If the sound of the words is so sacred, why is the *meaning* of the words delivered via a compressed, utilitarian LED strip that nobody looks at during the big aria? The practice suggests that the *emotional* meaning is carried by the music, while the *informational* meaning is a secondary utility. You are meant to feel the betrayal in the strings, not necessarily parse the specific legal terms of the contract being signed.

  ### 3. Underdetermination: Two Theories, One Stage
  You asked if this is philosophically underdetermined. Yes. You can justify the Mainstream Bundle with two rival theories that should logically oppose each other:

  *   **Theory A (The Abstract Emotion):** The music expresses universal psychological states (grief, rage, love) that transcend the specific plot. Therefore, it doesn't matter if the Count is in 18th-century Seville or a 1970s airport; the music tells you how he feels. The specific text is just a trigger for the music.
  *   **Theory B (The Sonic Object):** The opera is a fixed acoustic sculpture. The staging is just the plinth it sits on. You can paint the plinth any color (Regietheater), and you can provide a pamphlet to explain the sculpture (Surtitles), but you cannot chip off a piece of the marble (the Score).

  Both theories lead to the exact same night at the opera. This makes the practice robust but intellectually fuzzy. It allows the audience to oscillate between listening to the sound and watching the drama without forcing a resolution on which one is doing the heavy lifting.

  ### 4. Where Bernard Williams Fits In
  You mentioned being shaky on Williams. You don't need to read him to use him, but his intuition helps clarify the tension. Williams argued that in opera, the music *enacts* the psychology. It doesn't just accompany the drama; it reveals the inner life of the characters in a way words cannot.

  The Mainstream Bundle actually aligns with Williams *more* than the "Drama-First" view does. If the music reveals the inner truth, then preserving the musical integrity (original language, exact tempo) is the only way to preserve the dramatic truth. The surtitles are just a map; the music is the territory.

  However, Williams also cared about *intelligibility*. He worried that if the audience is completely lost, the music loses its object. The Mainstream Bundle risks breaking this link by making the text a secondary track. It assumes the music can carry the dramatic weight alone.

  ### 5. Concrete Changes: If a House Committed to "Drama-First"
  If an institution decided to stop treating opera as a Musical Monument and started treating it as **Dramatic Action** (where the narrative and psychological clarity is the primary goal, and music is the servant of that goal), the physical practice would have to change radically. It wouldn't just be singing in English.

  Here is what would concretely have to change in the auditorium and on stage:

  **1. The End of the "Singer's Stance"**
  *   **Current:** Singers often angle their bodies toward the audience or the "acoustic sweet spot" to project unamplified sound over the orchestra. They cannot turn their backs or bury their faces in a scene partner's chest.
  *   **Drama-First:** Singers would act like straight-play actors. They would face each other, whisper, turn away, and move naturally. To make this work, **subtle amplification** would likely become mandatory. You cannot prioritize naturalistic movement and unamplified orchestral volume simultaneously.

  **2. The Orchestra Pit Would Be Covered or Reduced**
  *   **Current:** The pit is open to let the sound bloom. The balance is struck so the orchestra supports but doesn't drown.
  *   **Drama-First:** If the text is king, the orchestra is accompaniment. The pit might be partially covered (as Wagner intended, but for different reasons) or the orchestration reduced. Tempos would be dictated by the natural rhythm of speech, not the metronome mark in the score. If a conductor's tempo makes the words unintelligible, the tempo is wrong, regardless of what the manuscript says.

  **3. Surtitles Would Be Integrated or Abolished**
  *   **Current:** Titles are a separate data stream, often delayed, compressed, and located away from the action.
  *   **Drama-First:** If not singing in the vernacular, the translation would need to be projected *onto* the set elements, in real-time, with poetic fidelity. Better yet, the text would be treated as a script. Cut lines in the music would be restored if they are essential to the plot. The "compressed for space" rule would be banned.

  **4. Directing Would Be Constrained by the Text**
  *   **Current:** A director can set *Rigoletto* in a casino because the music conveys the tragedy of the father/daughter relationship regardless of the setting.
  *   **Drama-First:** The setting must facilitate the specific social dynamics of the libretto. If the plot relies on 18th-century court hierarchy, moving it to a 1970s airport breaks the dramatic logic (why does the Duke have power in an airport?). The "concept" would have to serve the plot, not illustrate the music.

  **5. Casting Priorities Would Shift**
  *   **Current:** The voice is the primary hiring criterion. A beautiful voice with poor diction or wooden acting is hireable.
  *   **Drama-First:** Diction and acting ability become the primary filter. A slightly smaller voice with perfect intelligibility and psychological presence is preferred over a huge voice that requires titles to be understood.

  In short, the Mainstream Bundle treats the opera as a **cathedral**: you enter to witness a sacred object, you have a guidebook (titles), and the lighting changes (direction), but the structure is immutable. A Drama-First approach treats it as a **courtroom**: the verdict matters more than the architecture, and if the acoustics prevent you from hearing the testimony, the building must be changed.
