answer: |-
  Here is the spec you asked for. It is designed to let you write "this is for that" without lying, while acknowledging the limits of what a retired field biologist can prove about deep time.

  ### The Spec: Five Desiderata for Adaptation Claims

  **1. The Etiological Condition (History)**
  *   **Requirement:** The account must distinguish why the trait *arose* from why it *persists*. To claim T is an adaptation *for* F, there must be a plausible historical scenario where variants of T capable of F out-reproduced variants not capable of F.
  *   **Motivation:** Without this, you cannot distinguish adaptation from exaptation. A trait can be perfectly useful now (e.g., bird feathers for flight) but have originated for something else (insulation). If you ignore origin, you conflate current utility with evolutionary history, making the claim "adapted for" tautological (i.e., "it is here because it works").

  **2. The Causal Contribution Condition (Current Utility)**
  *   **Requirement:** The trait must currently make a causal difference to the fitness of the organism regarding function F in the relevant environment.
  *   **Motivation:** This rules out vestiges. A trait selected for F in the past might persist due to phylogenetic inertia even if F is no longer possible or useful (e.g., vestigial eyes in cave fish). If T does not currently contribute to F, calling it an adaptation *for* F is misleading, even if it was one ancestrally.

  **3. The Variability Condition (Separability)**
  *   **Requirement:** The account must show that T could vary without necessarily dragging along other traits that are the actual targets of selection.
  *   **Motivation:** This addresses developmental constraints (your mantle fold problem). If the ridge *must* come with the dark band because one fold of tissue makes both, selection for the band (e.g., UV protection) could drag the ridge along for free. If T cannot vary independently, you cannot prove selection acted on T rather than its correlated partner.

  **4. The Counterfactual Condition (Underdetermination)**
  *   **Requirement:** The account must specify what evidence would falsify the claim, specifically by identifying data patterns that would fit a rival hypothesis (e.g., drift or constraint) better.
  *   **Motivation:** If two stories fit the comparative data equally well (e.g., "ridge for crushing" vs. "ridge for structural byproduct of band"), the claim is underdetermined. An adequate account must say: "If we found a population with the ridge but no crushing pressure, and the ridge persisted without cost, the adaptation claim weakens." "No worse than alternatives" is not enough; you need a discriminator.

  **5. The Parsimony Condition (Burden of Proof)**
  *   **Requirement:** The adaptationist hypothesis must be simpler than the null (drift/constraint) given the data, not just plausible.
  *   **Motivation:** Nature is full of noise. Without this, every trait becomes a Rube Goldberg machine of hidden functions. This prevents the "just-so story" problem where every feature is assumed to have a selective history regardless of evidence.

  ---

  ### Test Bed: The Snail Ridge

  Here is how the spec handles your thirty-year headache.

  *   **Etiology:** You cannot confirm this without fossils or phylogenetics. However, the existence of Population B (no ridge, thick shell, band present) suggests the ridge is not *necessary* for the band. This weakens the "byproduct of band" hypothesis slightly, but opens the "exaptation" door: perhaps the ridge arose for the band, then was co-opted for crushing in Population A.
  *   **Causal Contribution:** Your crushing experiments likely showed the ridge helps. This satisfies Desideratum 2. It is *adaptive* now.
  *   **Variability:** Population B is the key. They show the ridge and band *can* be decoupled developmentally. This satisfies Desideratum 3 enough to proceed. If the ridge were physically impossible to remove without losing the band, the adaptation claim would die.
  *   **Verdict:** You can write: "The ridge functions to stiffen the shell" (Current Utility). You should *not* write: "The ridge evolved to stiffen the shell" (Etiology) unless you can rule out that it evolved for the band and was later co-opted. The spec forces you to split the claim.

  ---

  ### The Deletion Test: Lab-Bench Prejudice or Gold Standard?

  Your instinct is the "Knockout Test": Remove T, measure fitness drop.
  *   **The Good:** It rigorously satisfies **Causal Contribution**. If fitness drops without T, T is doing work.
  *   **The Bad:** It fails **Etiology**. Deleting a spandrel (byproduct) often wrecks the structure it supports. If you chip off the keystone of an arch, the arch falls. That doesn't mean the keystone was *selected* to be a keystone; it might just be the shape the stones took when the arch was built.
  *   **The Verdict:** The deletion test is necessary but insufficient. It proves the trait is *useful*, not that it is an *adaptation*. In your snail, if you file off the ridge and the shell crushes, you've proved utility. You haven't proved history. Relying on it alone is lab-bench prejudice dressed as evolutionary truth.

  ---

  ### Non-Negotiable vs. House Style

  *   **Non-Negotiable:** **The Etiological Condition (1)** and **The Causal Contribution Condition (2)**. If you drop (1), "adaptation" just means "useful," and you lose the ability to talk about evolutionary history. If you drop (2), you are talking about ghosts of the past with no relevance to the living animal. You need both to say "this is for that" without lying.
  *   **House Style:** **Strict Proof of Origin.** Demanding a tight causal story about the *exact* moment of origin is a philosophical luxury. In biology, we rely on inference to the best explanation. You do not need a video recording of the first snail with a ridge; you need a phylogenetic pattern that makes selection the best explanation.

  ---

  ### The Impossible Subset

  **The Conflict:** **The Variability Condition (3)** vs. **Developmental Reality.**
  *   **The Problem:** You demand traits be independently variable to prove selection. But developmental biology tells us traits are often tied together (pleiotropy, linkage). If you enforce strict independence, *no* complex trait qualifies as an adaptation.
  *   **The Fix:** You must give up **Strict Independence**. Replace it with **Phylogenetic Decoupling**. You don't need the trait to be variable *now* in one individual; you need evidence that over evolutionary time, the trait *has* varied independently of its partners (which Population B provides for your snail). If you keep Strict Independence, you make adaptationism impossible.

  ---

  ### The Killer Criterion

  **The Etiological Condition (Origin vs. Maintenance).**
  This single requirement knocks out the majority of approaches currently pushed in popular science and introductory texts. Most accounts conflate "it is useful" with "it was selected." Enforcing the distinction kills pan-adaptationism (the idea that every useful thing was selected for) and forces a reckoning with exaptation. It is the filter that separates evolutionary biology from functional physiology.

  ---

  ### Scorecard of Contenders

  **Pan-Adaptationism**
  Fails the Variability and Parsimony conditions. Assumes every trait is optimized and independent. Good for generating hypotheses, bad for truth; it treats your snail ridge as definitely for crushing without checking the mantle fold constraint.

  **Structuralism / Spandrels (Gould & Lewontin)**
  Fails the Causal Contribution condition by over-correction. Often implies traits are *only* byproducts. Useful for checking hubris, but if taken as dogma, it prevents you from acknowledging that the ridge *does* help against crayfish, regardless of origin.

  **Etiological Function (Millikan/Neander)**
  Philosophically robust on History, but epistemically heavy. Demands more historical data than a field biologist usually has. It tells you what "adaptation" means, but often leaves you unable to assert it for your snail without a time machine.

  **Causal Role Function (Cummins)**
  Matches your Deletion Test instinct. Good for physiology ("the heart pumps blood"), but fails the Etiology condition. It lets you say the ridge is *for* stiffening, but strips the word "adaptation" of its evolutionary history. Safe for your publication goal, but philosophically thin.
