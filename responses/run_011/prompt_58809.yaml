prompt: |-
  I'm in year 3 of a philosophy PhD, formal epistemology, and the chapter I've been stuck on for months is about learning from perceptual experience that isn't certain — basically probability kinematics. My committee is split down the middle and meetings have stopped getting anywhere, so I want you to write the document they should have produced instead: the joint statement from a good-faith adversarial collaboration between a radical probabilist (Jeffrey's rule, no probability ever needs to hit 1, experience shifts the partition without certifying any single cell of it) and a certainty foundationalist (experience has to hand you *something* at probability 1 to count as evidence at all, otherwise the new partition probabilities are just posits with no epistemic ground and the whole update floats free).

  Neither one should be a strawman. Let the foundationalist press the input problem and the rigidity assumption hard — where do the new partition probabilities come from, and doesn't rigidity just smuggle in a certainty claim about conditionals? Let the probabilist press the point that ordinary conditionalization is only the limiting case of their rule, and that the foundationalist owes a story about what could ever be certain in perception.

  Work it through on two cases I actually care about.

  Case A: a birder gets one fleeting look at a warbler, sees what she'd call a faint wingbar, and rates herself about 70/30 between two species. Model that. Then she gets a second look the next morning from a different angle. Does rigidity survive the second look? And what if she updates using a partition she chose *after* the experience — that's the worry my advisor calls the sliding-partition problem, and I think it's the sharpest thing in this whole debate, so take it seriously rather than waving at it.

  Case B: a psychophysics subject in a forced-choice task gives a confidence rating on every trial, and the rating is itself noisy. Two bits of uncertain evidence arrive in sequence, on overlapping partitions. Order matters or it doesn't — get both camps to commit to a prediction. Bring in the Diaconis–Zabell sufficiency/commutativity material and Skyrms's dynamic-coherence result where they're doing real work; the foundationalist will say the Skyrms argument presupposes a frozen prior and so quietly reinstates certainty, let them say that and let the other side answer it.

  Also handle reflection: if I can bootstrap my own future credences into present evidence, does that erase the line the foundationalist is drawing?

  Sections, in this order, roughly these lengths:

  1. **Ground rules both can sign** — ~150 words
  2. **Agreed claims** — numbered, 8 to 12 items, each one something both of them would actually initial, not vacuous truisms
  3. **The disagreements table** — columns: issue / the probabilist's own wording of their side / the foundationalist's own wording of their side / genuine or merely verbal?
  4. **Cruxes and pre-registered predictions** — 3 or 4 cruxes, each with the case or argument both accept as bearing on it, and each side's prediction written down in advance
  5. **Falsifiers** — what each side would accept as refuting them, ~200 words
  6. **Where it's only words** — ~150 words, say which parts of the dispute are verbal and why

  No reading list and no citations, I've got all that already, becuase what I need is the argumentation to be tight and the wording to be fair to both sides.
