answer: |-
  **1. Ground Rules Both Can Sign**

  We, the undersigned, acknowledge a stalemate regarding the formal modeling of perceptual learning. This document establishes a framework for adjudicating our dispute without recourse to terminological stipulations alone. We agree to treat the formalisms as substantive claims about rational agency, not merely calculative tools. We commit to evaluating positions based on their handling of diachronic coherence, the structure of perceptual input, and their performance on specific test cases (A and B). We will not retreat to "different projects" when faced with counterexamples. Our goal is to identify whether the disagreement is structural or merely descriptive. We agree that if a model permits Dutch Books in standard cases, it requires revision or rejection. We further agree that "certainty" need not be logical infallibility, but must function as an epistemic stopper.

  **2. Agreed Claims**

  1.  Credences obey probability axioms at any time *t*.
  2.  Standard conditionalization is the correct update rule *given* certainty in evidence *E*.
  3.  Perceptual experiences rarely, if ever, yield logical certainty in ordinary contexts.
  4.  Diachronic coherence (avoiding Dutch Books) is a constraint on rational updating.
  5.  The Rigidity condition (*P*<sub>new</sub>(*H*|*E*<sub>i</sub>) = *P*<sub>old</sub>(*H*|*E*<sub>i</sub>)) is the standard formal constraint for Jeffrey updates.
  6.  Commutativity of updates is required for order-independent evidence.
  7.  The "Input Problem" (specifying the source of new partition probabilities) must be addressed by any complete theory.
  8.  Reflection (aligning present credence with expected future credence) is a coherence constraint.
  9.  Case A (Birder) and Case B (Psychophysics) are legitimate arbiters of theoretical adequacy.
  10. Neither side claims agents are perfectly rational; we model norms.
  11. Overlapping partitions complicate update sequences in both frameworks.
  12. We agree that "certainty" in the foundationalist sense need not be logical certainty, but must be epistemic stoppers.

  **3. The Disagreements Table**

  | Issue | Radical Probabilist (RP) | Certainty Foundationalist (CF) | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Nature of Evidence** | Experience directly shifts probabilities over a partition; no cell needs probability 1. | Evidence must fix probability 1 to some proposition to constrain belief; otherwise updates are arbitrary. | Genuine |
  | **Rigidity** | Structural preservation of learning history; ensures past learning isn't erased by new input. | Smuggles in certainty: assumes we are certain the partition captures all relevant info from experience. | Genuine |
  | **Input Problem** | New partition probabilities are direct outputs of experience, not inferences. | Without a certain base, new partition probabilities are ungounded posits floating free of justification. | Genuine |
  | **Commutativity** | Essential for rationality (Diaconis–Zabell); order shouldn't matter for independent evidence. | Depends on frozen priors (Skyrms); dynamic coherence presupposes the certainty it claims to derive. | Genuine |
  | **Sliding Partition** | Partition is determined by the content of experience; timing is secondary to fit. | If partition is chosen *after* experience, it is theoretical, not evidential; invalidates the update. | Genuine |
  | **Term: "Evidence"** | Any probabilistic input that constrains credence change. | Only propositions held at probability 1. | Verbal |

  **4. Cruxes and Pre-Registered Predictions**

  **Crux 1: The Sliding Partition (Case A)**
  *Scenario:* A birder sees a faint wingbar (Experience 1), assigning 0.7 to Species X, 0.3 to Species Y. She selects the partition {X, Y} *after* the experience. Next morning, she gets a second look (Experience 2).
  *   **RP Prediction:** Rigidity survives the second look if experiences are independent. The partition is valid if it matches the phenomenological content of Experience 1, even if articulated later. Update is valid via Jeffrey Conditionalization.
  *   **CF Prediction:** Update is invalid. Because the partition was chosen post-experience, the 0.7/0.3 split is a hypothesis, not evidence. Rigidity fails because the conditionals rely on a partition not certified by experience. Second look requires a new certain base to ground the sequence.
  *   **Bearings:** If post-hoc partition selection is unavoidable in perception, CF must deny rationality in ordinary birding. If it leads to Dutch Books, RP must restrict admissible partitions.

  **Crux 2: Commutativity and Overlapping Partitions (Case B)**
  *Scenario:* Psychophysics subject gives noisy confidence ratings on overlapping partitions in sequence.
  *   **RP Prediction:** Order does not matter. Diaconis–Zabell sufficiency conditions ensure commutativity. Skyrms's dynamic coherence holds; the sequence converges regardless of order.
  *   **CF Prediction:** Order matters unless certainty is reached. Skyrms's argument presupposes a frozen prior structure that quietly reinstates certainty about the relevance of the partitions. Without certainty, noise accumulates differently based on order.
  *   **Bearings:** Empirical data on order effects in confidence ratings. If order effects exist in independent trials, RP must explain via partition mismatch or concede.

  **Crux 3: Reflection and Bootstrapping**
  *Scenario:* Agent uses expected future credence as present evidence.
  *   **RP Prediction:** Reflection constrains present credence. Bootstrapping is coherent if dynamic coherence holds; the line between evidence and credence is porous.
  *   **CF Prediction:** Bootstrapping erases the evidence line. Without certain anchors, reflection circularizes justification. You cannot lift yourself by your own credence straps.
  *   **Bearings:** Whether Reflection principles can be satisfied without foundational certainty.

  **5. Falsifiers**

  **Radical Probabilist:** We concede if systematic order effects are demonstrated in Case B where partitions are demonstrably independent and sufficient, violating commutativity. We also concede if the Sliding Partition problem proves unavoidable in Case A and leads to demonstrable diachronic incoherence (Dutch Books) that cannot be resolved by partition refinement. If Rigidity consistently forces us to assign certainty to conditionals we explicitly doubt, the model is broken.

  **Certainty Foundationalist:** We concede if a case is produced where agents are intuitively rational, no certainty is present (even idealized), yet coherence is maintained without arbitrary posits. Specifically, if we cannot identify *any* proposition in perceptual experience (even "I seem to see red") that functions as a probability 1 stopper without leading to skepticism about the external world, our requirement is too strong. If Reflection principles can be satisfied without our anchors, the "foundation" is unnecessary.

  **Joint:** If the "Sliding Partition" proves unavoidable in all perceptual cases, CF must concede or deny rationality in perception. If Rigidity leads to Dutch Books in Case B, RP must concede.

  **6. Where It's Only Words**

  Much friction stems from the label "evidence." The CF uses it to mean "justificatory foundation," implying a stopper function. The RP uses it to mean "probabilistic input," implying a constraint function. When CF says "no evidence," they mean "no certainty." When RP says "uncertain evidence," they mean "constraint without certainty." This verbal dispute masks the structural disagreement about whether justification requires a stopper. Additionally, "learning" is contested: CF requires accumulation of certain truths; RP requires coherent probability shifts. Clarifying these terms will not solve the Input Problem, but it will prevent us from talking past one another regarding whether perception *can* justify belief without certainty. The substantive fight is over coherence, not vocabulary.
