answer: |-
  This is a fantastic place to be stuck. Dewey is notoriously difficult at the threshold of his arguments because he refuses to accept the vocabulary everyone else is using. If you accept his opening paragraph as "throat-clearing" (Friend 1), you will read the rest of the book as a policy proposal. If you accept it as "the book in miniature" (Friend 2), you will read it as a diagnosis of democracy itself.

  Friend 2 is right. That paragraph is the architectural keystone of the whole argument.

  Here is the unpacking you need, specifically tailored to your position in local government.

  ### 1. What is he denying about "facts"?
  You asked if this is just the familiar point that "data need interpreting." It is stronger than that.

  The common-sense view (which Dewey is attacking) is that facts are like bricks. If you pile enough bricks up, a wall appears. In this view, a fact is a self-contained unit of truth waiting to be found. If people disagree, it's because they haven't seen enough bricks, or they are being stubborn.

  Dewey is arguing that a "fact" is not a brick; it is a **selection**.
  Nothing is a "fact" in isolation. Something becomes a fact only when it is selected from the buzzing confusion of reality because it is *relevant to a specific problem*.
  *   **Example:** Rainfall is just weather. It becomes a "fact" only when you are asking a question like "Will the crops grow?" or "Will the basement flood?"

  When Dewey says facts don't carry meaning on their face, he means that **meaning is a relationship, not a property.** A number in a spreadsheet has no meaning until it is connected to a consequence in human life.

  **Why this matters for your reading:** He is preparing you to argue that the "Public" is confused not because they are stupid, but because the "facts" of modern society (industrial consequences, economic shifts) are so complex that we haven't yet developed the tools to select and connect them into meaningful patterns. We have the data, but we lack the *inquiry* to make them facts.

  ### 2. The Physics Comparison: Procedure vs. Reality
  You worried that if science convinces us because of "method" rather than "bare phenomena," doesn't that undercut the authority of science? And if so, how can he demand social science be more like physics?

  This is the crux of Dewey's pragmatism. He is not saying physical reality doesn't exist. He is saying that **agreement** is produced by shared technique, not by staring harder at reality.

  *   **In Physics:** If two physicists disagree, they don't shout opinions. They check the apparatus. They replicate the calculation. They have a shared *method of verification*. The authority lies in the reproducibility of the process.
  *   **In Social Discussion:** We have the "phenomena" (poverty, crime, traffic), but we lack the shared method. One person looks at crime stats and sees "moral decay." Another looks at the same stats and sees "economic deprivation." Neither can prove the other wrong because they aren't using a shared technique of inquiry. They are just asserting meanings.

  **Does this undercut his call for social science?**
  No, it defines what he means by "science." He doesn't want social scientists to wear lab coats or use math just for the sake of it. He wants social inquiry to adopt the **communal method of validation** that physics has.
  He wants a world where, if we disagree on the meaning of a budget deficit, we have a agreed-upon process to test our interpretations against future consequences, rather than just battling over ideologies.

  So, the authority of science *does* depend on procedure. But for Dewey, that procedure is the only honest way to access reality. There is no "God's eye view" of the facts; there is only the rigorous process of finding them out together.

  ### 3. Why start a book about Democracy with Method?
  This is where Friend 2's "miniature" theory pays off.

  *The Public and Its Problems* is not a book about voting or administration. It is a book about **association.**
  For Dewey, a "Public" is not a pre-existing group of people. A Public is created when people realize they are jointly affected by the consequences of an action.
  *   **Private:** I buy a coffee. Consequences are mine.
  *   **Public:** A factory pollutes the river. Consequences are shared by thousands.

  To form a Public, those thousands must be able to **identify** those consequences. They must be able to look at the water, look at the health data, and agree on what is happening.

  If "facts do not carry their meaning on their face," then the Public cannot form automatically just because consequences exist. The Public must *inquire* its way into existence. It needs a method to trace the invisible lines of cause and effect in a complex industrial society.

  **The Argument in Miniature:**
  1.  **Premise:** Facts require method to yield meaning.
  2.  **Problem:** Modern society is too complex; our old methods (town halls, local gossip) can't trace the consequences of industrial actions.
  3.  **Result:** The Public is "eclipsed." We are affected by forces we cannot name or understand.
  4.  **Solution:** We need a new "social inquiry" (a new method) to help the Public identify itself.
  5.  **Conclusion:** Democracy is not just voting; it is the cultivation of this shared method of inquiry.

  If you skip the first paragraph, you might think Dewey is just saying "we need better civics education." Because of the first paragraph, you know he is saying "we need a new epistemology of social life."

  ### 4. The Local Government Payoff
  You asked: *We commission a report, publish the numbers, and then act surprised when different groups read wildly different things into exactly the same figures. Is that a communications failure we could fix with better summaries, or is it something that opening paragraph is already diagnosing as structural?*

  Dewey would say it is **structural**, and "better summaries" will not fix it. In fact, better summaries might make it worse by pretending the meaning is obvious.

  **The Standard View (Communications Failure):**
  "The public didn't understand the chart. We need simpler language, better infographics, and more town halls to explain the *conclusions*."
  *   *Assumption:* The meaning resides in the report; we just need to transmit it clearly.

  **The Deweyan View (Structural/Methodological):**
  "The public disagrees because the report was produced *outside* the public's method of inquiry. The numbers were selected by consultants, not by the community's lived experience of the problem."
  *   *Assumption:* Meaning is created in the *process* of investigation, not delivered in the final PDF.

  **What would a Deweyan approach look like in your job?**
  1.  **Stop treating data as "findings."** Treat data as "tools for discussion."
  2.  **Involve the public in the selection of facts.** Before you commission the report, ask the community: "What counts as a sign of success here?" If you measure "traffic flow" and they measure "neighborhood safety," no amount of summarizing will align your meanings.
  3.  **Focus on the Method, not the Message.** Don't just publish the numbers. Publish the *method* used to gather them, and invite scrutiny on the method, not just the result. Create a space where the *interpretation* is the work of the public, not the work of the council.

  **The Hard Truth:**
  Dewey is telling you that you cannot "manage" the public's understanding from the top down. You cannot accumulate enough facts until the interpretation "stares out at you."
  The confusion you see in your work isn't a bug; it's the natural state of a society that has lost the ability to conduct shared inquiry. The "Public" is missing because the *method* for finding the Public is broken.

  ### Summary for your Group
  When you go back to your reading group, you can say this:

  Dewey isn't clearing his throat. He is planting a flag. He is denying that knowledge is a noun (a collection of facts) and asserting it is a verb (a process of inquiry).
  *   **Physics works** because it is a verb (a shared doing).
  *   **Politics is broken** because we treat it as a noun (a battle over static facts).
  *   **Democracy's hope** lies in turning social knowledge back into a verb—a shared experimental method where the "Public" discovers itself by tracing consequences together.

  For your day job: Stop trying to make the data clearer. Start trying to make the *inquiry* more communal. The disagreement isn't a failure of communication; it's a signal that the public hasn't been invited into the method of meaning-making.
