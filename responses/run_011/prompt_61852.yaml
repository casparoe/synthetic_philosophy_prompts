answer: |-
  There is no single, canonical term in organizational theory or philosophy that isolates this phenomenon with the precision you require. However, your description sits at the intersection of three established concepts: **Bureaucratic Ritualism** (sociology), **Reification** (philosophy), and **Cynical Reason** (critical theory).

  None of these fully capture the specific mechanism you describe: a text that functions as a *causal reason* despite universal disbelief in its content. "Bureaucratic Ritualism" describes the behavior (following rules for their own sake) but not the epistemic status of the justification. "Reification" describes the process (treating a social construct as a physical object) but is too broad. "Cynical Reason" (Sloterdijk) describes the mindset ("they know what they are doing, but they do it anyway") but focuses on the subject, not the object (the manual).

  To give you the conceptual tool you need, I will define this as a **Reified Justification**.

  Below, I distinguish this from the near-misses you identified and draw the boundary conditions you requested.

  ### The Concept: Reified Justification

  A **Reified Justification** is a rationale that has been transferred from human cognition into an artifact (text, code, manual), where it acquires independent authority. The artifact no longer requires human belief to function; its existence *is* the justification. The group does not follow the rule because they believe the reason is true; they follow it because the reason is *recorded*.

  The mechanism is not memory, but **liability diffusion**. The text serves as a "liability sink." If an engineer cycles the valve twice and an explosion occurs, the engineer is safe because they followed the text. If they skip the step and an explosion occurs, they are liable. The text protects the actor from the consequences of their own judgment. The "reason" persists not because it is useful for safety, but because it is useful for *cover*.

  ### Boundary Conditions

  To distinguish a Reified Justification from similar phenomena, apply these three tests:

  #### 1. Versus Chesterton's Fence (The Epistemic Boundary)
  *   **Chesterton's Fence:** The rationale is *unknown*. The group assumes wisdom exists but is currently inaccessible. The attitude is: "We don't know why, so we must assume it's necessary."
  *   **Reified Justification:** The rationale is *known to be empty*. The group actively suspects or knows the reason is false or obsolete. The attitude is: "We know this is stupid, but it is written."
  *   **The Edge:** If you ask the group, "Is there a real reason for this?" a Chesterton's Fence group says, "Possibly, we can't tell." A Reified Justification group says, "Probably not, but look at the manual."

  #### 2. Versus Prudent Retention (The Risk Boundary)
  *   **Prudent Retention:** The rationale is *disbelieved*, but the cost of change is deemed higher than the cost of compliance. The group retains the rule because removing it requires political capital, testing, or risk assessment that isn't worth the effort. The rule is kept as a *hedge*.
  *   **Reified Justification:** The rationale is *disbelieved*, and the cost of compliance is accepted, but the rule is kept because the *text itself* provides safety from blame. The rule is kept as a *shield*.
  *   **The Edge:** If you offered the group immunity from blame for changing the rule, a Prudent Retention group might still hesitate due to operational risk. A Reified Justification group would immediately delete the rule, proving the rule existed solely to manage liability, not operational risk.

  #### 3. Versus Dead Hand Control (The Agency Boundary)
  *   **Dead Hand Control:** The past coerces the present. The founders or previous leaders imposed a constraint that the current group *wishes* to remove but legally or structurally cannot. The current group is *victim* to the artifact.
  *   **Reified Justification:** The present *colludes* with the past. The current group *could* change the manual (no legal barrier exists), but they choose not to because the artifact relieves them of the burden of decision-making. The current group is *beneficiary* of the artifact.
  *   **The Edge:** Who has the power to change it? If the group has the authority to update the manual but refuses to do so despite disbelieving the content, it is not Dead Hand Control. It is voluntary servitude to the artifact to avoid the responsibility of agency.

  ### Why This Distinction Matters

  Identifying a **Reified Justification** changes how you intervene.

  *   If it is **Chesterton's Fence**, you investigate the history to find the hidden logic.
  *   If it is **Path Dependence**, you analyze the switching costs.
  *   If it is a **Reified Justification**, investigation and cost-benefit analysis will fail. The rule survives because it performs a *social function* (liability shielding) that is invisible to the *technical function* (valve cycling).

  To remove a Reified Justification, you cannot simply prove it is technically redundant. You must replace the liability shield. You must institute a new process that protects the engineer's judgment *more* effectively than the blind rule does (e.g., a "signed waiver of protocol" that carries explicit organizational indemnity). Until the artifact is replaced by a different form of protection, the text will continue to steer behavior, not because it is believed, but because it is safe.

  ### Summary Definition

  **Reified Justification:** A directive or rationale embedded in an organizational artifact that governs behavior solely through its textual existence, despite universal disbelief in its substantive content among the governed. It persists not through inertia or hidden wisdom, but because the artifact absorbs the liability of decision-making, allowing actors to substitute compliance for judgment.

  **Distinguishing Mark:** The rule survives *because* no one endorses it personally; the lack of personal endorsement is the feature that makes the text useful. If anyone personally believed in the rule, the text would be secondary. Because no one believes it, the text is primary.
