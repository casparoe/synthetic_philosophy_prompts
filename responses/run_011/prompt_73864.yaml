  i'm doing an essay on Bertrand's chord paradox for my maths teacher and i've ended up with a pile of verdicts that don't seem to fit together, so i want to know whether there's a principle underneath them or whether i've just muddled myself.

  1. if you actually chuck straws at a page with a circle drawn on it, the proportion landing longer than the side of the inscribed triangle really is about a third — but that's just a fact about straw-chucking, not a paradox.
  2. same if you stab a dart at a point inside the circle and take the chord with that point as its middle: a quarter, and that's just a fact about dart-stabbing.
  3. but if i simply say 'pick a chord of this circle at random', no method given, i think theres a right answer and it's a third, because a chord just is two endpoints and picking two random points is the plainest thing you can do.
  4. if instead you say 'pick a random circle somewhere in the plane, then a random chord of it', i want to say a half, since nothing out there marks out a privileged centre — yet surely drawing a bigger circle round the first one can't change the answer to 3?
  5. and i'm perfectly happy telling people to 'pick a random number between 0 and 1' while insisting that 'pick a random positive integer' is no instruction at all, even though there's infinitely many chords too, which feels like the same complaint as in 3.

  what's the rule that delivers 1 through 5, and which one does it make me give up? i'd genuinely rather be told that 4 (or 5) is just wrong than be handed a principle with a separate clause for each case.
