answer: |-
  Your instincts are correct to be uneasy. The passage you received is a potent mix of deep insight (ergodicity economics) and dangerous oversimplification (decision theory and risk management). It correctly identifies a flaw in naive Expected Value (EV) reasoning for multiplicative processes but incorrectly concludes that this flaw eliminates the role of subjective utility or guarantees safety.

  Here is an audit of the passage, claim by claim, followed by resolutions to your three specific points.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"Expected-value reasoning is broken because it averages over parallel universes you will never visit; you live one life in sequence, so the only quantity that matters is the time average."*
  *   **Verdict:** **Defensible Simplification (Context-Dependent).**
  *   **Analysis:** This is the core thesis of Ergodicity Economics (associated with Ole Peters). In non-ergodic processes (like multiplicative wealth dynamics), the ensemble average (standard EV) diverges from the time average (what happens to one person over time). For long sequences of reinvested bets, maximizing arithmetic EV leads to ruin with probability 1. However, calling EV "broken" is rhetorical; it remains the correct metric for additive bets or single-shot decisions where reinvestment isn't the goal.
  *   **Status:** Endorsed by decision theorists *within the specific context of repeated multiplicative risk*.

  **Claim 2:** *"Kelly betting is the repair: it is the stake fraction that maximizes the long-run growth rate of your bankroll..."*
  *   **Verdict:** **Mathematically True.**
  *   **Analysis:** The Kelly criterion maximizes the expected logarithm of wealth, which is mathematically equivalent to maximizing the time-average geometric growth rate in a repeated betting scenario.
  *   **Status:** Endorsed.

  **Claim 3:** *"...your utility function drops out entirely, because log utility simply falls out of the time average."*
  *   **Verdict:** **WRONG / Conflated.**
  *   **Analysis:** This is the most critical error. It conflates the *objective dynamics of the wealth process* with the *subjective preferences of the agent*. While maximizing time-average growth is mathematically equivalent to maximizing *log* utility, it does not mean *your* utility function is log. If your utility is linear (risk-neutral) or more concave than log (highly risk-averse), Kelly is not optimal for you. The time average tells you how the money grows, not how much you value that money.
  *   **Status:** Rejected.

  **Claim 4:** *"This is also why Kelly cannot go bankrupt..."*
  *   **Verdict:** **WRONG / Overstated.**
  *   **Analysis:** In an idealized continuous model with known edges, Full Kelly avoids asymptotic ruin. However, in discrete reality, "bankruptcy" usually means falling below a solvency threshold. Full Kelly involves significant drawdowns (50%+ is common). Furthermore, if the edge is misestimated (a near-certainty in finance), Full Kelly becomes "overbetting," which *does* lead to ruin.
  *   **Status:** Rejected.

  **Claim 5:** *"...staking any fraction at or below the Kelly number guarantees that you finish ahead of anyone who stakes differently."*
  *   **Verdict:** **FALSE.**
  *   **Analysis:** There is no such guarantee in finite time. Kelly maximizes the *median* outcome and the *asymptotic* rate. In short horizons, a higher-variance strategy (overbetting) has a chance to outperform Kelly, and a lower-variance strategy (underbetting) might outperform Kelly if Kelly suffers a string of losses. Kelly dominates almost surely only as $N \to \infty$.
  *   **Status:** Rejected.

  **Claim 6:** *"Full Kelly is therefore the rational default, and the half-Kelly that practitioners actually recommend is only a concession to people who find volatility unpleasant."*
  *   **Verdict:** **WRONG / Incomplete.**
  *   **Analysis:** This dismisses the two primary reasons for fractional Kelly: (1) Parameter uncertainty (estimation error) and (2) Utility functions more concave than log. It frames risk management as a psychological weakness rather than a mathematical necessity.
  *   **Status:** Rejected.

  ---

  ### Part 2: Resolving Your Three Points

  #### (a) Does growth-rate optimality license dismissing utility?
  **No.** This is a category error.

  The friend's argument relies on a subtle conflation:
  1.  **Objective Fact:** In a multiplicative process, the time-average growth rate is maximized by maximizing $E[\ln(W)]$.
  2.  **Subjective Preference:** An agent should maximize $E[U(W)]$.

  The friend argues that because the *physics of the bet* dictates log-growth is the maximum sustainable rate, the *agent* must adopt log utility. This is false.
  *   **Example:** Suppose you need \$1,000,000 for a life-saving surgery and you currently have \$1,100,000. Your utility function is effectively a step function (0 if $<1M$, 1 if $\ge 1M$). Kelly betting might suggest a wager that carries a 10% risk of dropping you to \$900,000. Even if Kelly maximizes your long-run geometric growth, it is **irrational** for you to take that bet because the marginal utility of the extra growth is zero compared to the catastrophic utility loss of ruin.
  *   **Correction:** The time-average argument proves that *if* you want to maximize long-run wealth, you must bet Kelly. It does not prove you *should* want to maximize long-run wealth regardless of your consumption needs or risk tolerance. Utility never drops out; it determines the objective function.

  #### (b) What is guaranteed about beating a different fixed fraction, and over what horizon?
  **Nothing is guaranteed in finite time.**

  *   **Asymptotic Dominance:** Kelly betting guarantees that, as the number of bets $N \to \infty$, your wealth will exceed the wealth of any other strategy (that doesn't also bet Kelly) with probability approaching 1. This is a limit theorem.
  *   **Finite Horizon:** In any realistic timeframe (e.g., 100 bets), there is a distribution of outcomes.
      *   **vs. Overbetting:** Someone betting 2x Kelly has a higher *arithmetic* expected return but a lower *geometric* return. They will likely go bust eventually, but in the short run, they have a higher probability of beating you simply due to variance.
      *   **vs. Underbetting:** Someone betting 0.5x Kelly has lower growth but lower volatility. In a "bad luck" sequence for Kelly, the half-Kelly bettor will finish ahead.
  *   **Bankruptcy:** The claim that Kelly "cannot go bankrupt" is theoretically true only if:
      1.  Bets are infinitely divisible.
      2.  The edge is known with perfect precision.
      3.  "Bankruptcy" means wealth $\to 0$ asymptotically.
      In practice, if you overestimate your edge by even a small amount, Full Kelly becomes overbetting. Overbetting reduces growth and increases ruin risk exponentially. This is why the "guarantee" is fragile.

  #### (c) Does half-Kelly have a justification beyond "squeamishness"?
  **Yes, primarily Estimation Error and Utility Curvature.**

  Practitioners recommend half-Kelly (or fractional Kelly) for two rigorous reasons that have nothing to do with emotional volatility aversion:
  1.  **Parameter Uncertainty (The "Edge" Problem):** The Kelly fraction $f^*$ depends on knowing the true probability of winning $p$ and the payoff odds $b$. In real markets, these are estimates ($\hat{p}, \hat{b}$). If you calculate Full Kelly based on an overestimated edge, you are mathematically overbetting. The growth function drops off very sharply on the overbetting side (leading to ruin) but falls off gently on the underbetting side. Fractional Kelly provides a "safety margin" against model error. It is a robustness optimization, not a psychological concession.
  2.  **Utility Curvature:** As established in (a), if your utility function is more concave than log (e.g., $U(W) = -W^{-1}$ or simply having specific liability constraints), the optimal bet is *mathematically* less than Kelly. Half-Kelly is often a rough proxy for an agent with higher risk aversion than log-wealth.

  ---

  ### Part 3: Final Verdict

  **Which conclusions survive correction?**
  1.  **Valid:** Arithmetic Expected Value is the wrong metric for repeated, multiplicative bets (non-ergodic processes). Time-average growth is the correct objective physical quantity to track.
  2.  **Valid:** Kelly betting maximizes this time-average growth rate.
  3.  **Invalid:** That utility functions are irrelevant.
  4.  **Invalid:** That Kelly guarantees outperformance in finite time or prevents bankruptcy in practice.
  5.  **Invalid:** That fractional Kelly is merely for the "volatility-averse."

  **Does the corrected version support the strong claim about Expected-Value reasoning?**
  **Partially, but with reduced scope.**

  The friend's opening claim—"Expected-value reasoning is broken"—is too strong. A corrected version would be:
  > "Arithmetic Expected-Value reasoning is inappropriate for **repeated, multiplicative wealth dynamics** because it ignores the non-ergodic nature of the process. In these specific contexts, maximizing time-average growth (via Kelly) is necessary to avoid asymptotic ruin. However, the optimal stake still depends on the agent's utility function and the precision of their edge estimates; therefore, Full Kelly is not a universal rational default, and risk management (fractional Kelly) is a mathematical necessity, not a psychological concession."

  **Summary for your friend:**
  Your friend has correctly identified the **ergodicity problem** but has incorrectly solved the **decision problem**. They have treated the *properties of the gamble* as if they were the *preferences of the gambler*. You are right to distrust the claim that utility "drops out." In finance and decision theory, utility is the only thing that *doesn't* drop out; everything else is just the constraint structure.
