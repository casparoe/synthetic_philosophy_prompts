answer: |-
  You and Ravi are stuck in the standard swamp of objective chance. Ravi is technically closer to the consensus, but you are correctly identifying where the formalism clashes with intuition. The problem is that you are treating "The Principal Principle" as a single monolith. It isn't. It's a family of principles, and most of them break on your specific cases.

  Here are the two serious candidates. I will define them, run your eight cases against them, and tell you exactly where your intuition is leading you astray.

  ### The Candidates

  **1. Lewis's Principal Principle (LPP)**
  $$C(A \mid Ch_t(A) = x \land E) = x$$
  *Provided $E$ is "admissible."*
  *   $C$: Your credence.
  *   $Ch_t(A)$: The objective chance of $A$ at time $t$.
  *   $E$: Your total evidence.
  *   **Admissibility:** Information that does not give you "crystal ball" access to the outcome (typically, information about the past and present, but not the future).

  **2. Hall's New Principal Principle (NPP)**
  $$C(A \mid Ch_t(A) = x \land H_t \land F) = x$$
  *Provided $F$ contains no "undermining" information.*
  *   $H_t$: The complete history of the world up to time $t$.
  *   **Key Difference:** LPP fails if the chance itself depends on the future (Humean Supervenience). NPP fixes this by conditioning on the *history* that determines the chance, not just the chance value.

  ---

  ### The Autopsy: Cases (1)–(8)

  Here is the verdict. I am not softening this.

  **Case (1): Fair die, no info.**
  *   **Verdict:** Credence = 1/6.
  *   **LPP:** Pass. $E$ is empty (admissible).
  *   **NPP:** Pass.
  *   **Note:** This is the only case where your intuition and the math align perfectly without caveats.

  **Case (2): Peeking at the die.**
  *   **Verdict:** Credence = 1.
  *   **LPP:** Pass, *if* you classify "seeing the die" as **Inadmissible**.
  *   **NPP:** Pass.
  *   **The Fix:** You said "deference rule can't be unconditional." Correct. The principle *is* conditional on admissibility. "Admissible" isn't a label on the problem; it is defined as **information about the outcome that bypasses the chance process**. Visual observation of the outcome is inadmissible. You must accept this definition or reject the principle.

  **Case (3): 30 sixes, chance claim overridden.**
  *   **Verdict:** Credence > 1/6; Chance hypothesis rejected.
  *   **LPP:** **FAIL.** This is the "Undermining Future" problem. If chances supervene on frequencies (Humeanism), then observing 30 sixes changes the *chance* itself. LPP says "Condition on $Ch=1/6$." But your evidence proves $Ch \neq 1/6$.
  *   **NPP:** **PASS.** NPP conditions on the *History* ($H_t$). Your evidence updates the history, which updates the chance. You aren't deferring to a fixed chance; you are updating the chance hypothesis.
  *   **Your Error:** You think you are deferring to a chance claim and overriding it. You aren't. You are using the evidence to update your credence in the *chance hypothesis* itself. PP only applies once you have settled on a chance hypothesis.

  **Case (4): Uncertainty about the theory (0.7 confidence).**
  *   **Verdict:** Credence = 0.35.
  *   **LPP:** **PASS.** You are misreading the principle. PP says $C(A \mid Ch=x) = x$. It does *not* say $C(A) = x$.
  *   **Calculation:** $C(A) = C(A \mid Ch=1/2)C(Ch=1/2) + C(A \mid Ch=0)C(Ch=0)$.
      $= (1/2 \times 0.7) + (0 \times 0.3) = 0.35$.
  *   **Your Error:** You thought this clashed with (1). It doesn't. In (1), you were *certain* the die was fair ($C(Ch=1/6) = 1$). In (4), you are uncertain. PP handles uncertainty via the Law of Total Probability. Ravi was right; you were incoherent here.

  **Case (5): The sealed box (Past event).**
  *   **Verdict:** Credence = 1/2. Chance *now* = 0 or 1.
  *   **LPP:** **PASS**, *if* you respect time indices.
  *   **The Fix:** Chance is time-relative: $Ch_t(A)$.
      *   At $t_{pre-toss}$, $Ch(Heads) = 1/2$.
      *   At $t_{post-toss}$, $Ch(Heads) = 1$ (or 0).
      *   PP says: Defer to $Ch_{t_{pre-toss}}$.
  *   **Your Error:** You said, "I'm deferring to a chance that has... expired." **No.** You are deferring to the chance *as it was at the time of the event*, conditional on you lacking the outcome evidence. If you treat chance as a timeless property of the coin, you are wrong. Chance is a relation between a proposition and a time. If you accept time-relative chance, (5) is consistent. If you insist chance is timeless, you must abandon PP.

  **Case (6): Determinism.**
  *   **Verdict:** You want Compatibilism (Chance = 1/6) and Incompatibilism (Chance = 0/1).
  *   **LPP:** **FAIL.** You cannot hold both.
  *   **The Fix:** Lewis (BSA) says: In a deterministic world, there are no *metaphysical* chances, but there are *pseudo-chances* derived from the Best System. If you want to use PP, you must accept Lewis's Humean Compatibilism.
  *   **Your Error:** You are trying to have your cake and eat it. If determinism is true and chance is metaphysical, chance is 0/1. If you say chance is 1/6, you are using an epistemic or Humean definition of chance. Pick one. If you pick 0/1, PP becomes trivial ($C(A|Ch=1)=1$). If you pick 1/6, you are a Compatibilist. Ravi is right: holding both is incoherent.

  **Case (7): Everett (Many-Worlds).**
  *   **Verdict:** Credence = 1/2.
  *   **LPP:** **FAIL.** There is no single outcome $A$. Both happen. $Ch(A)$ is undefined in the standard sense.
  *   **NPP:** **FAIL.** Same reason.
  *   **The Fix:** You need the **Deutsch-Wallace Theorem**. It derives credence 1/2 from decision theory, not from a deference principle.
  *   **Your Error:** You are trying to apply a single-world chance principle to a branching ontology. The "1/2" in Everett is a *measure*, not a frequency or propensity. PP does not apply here without heavy modification.

  **Case (8): Updating without evidence.**
  *   **Verdict:** Ravi is warning you about "Ratification."
  *   **LPP:** **PASS**, provided the evidence for $Ch=x$ is external.
  *   **Your Error:** In (3), you acquired new evidence (30 sixes). In (8), Ravi is asking if merely *adopting* PP changes the chance. It shouldn't. If your credence changes the chance (e.g., in a Newcomb problem or self-fulfilling prophecy), PP breaks. But in standard physics, your credence doesn't change the decay rate.
  *   **Resolution:** (3) involves empirical evidence updating the chance hypothesis. (8) involves the logic of the principle itself. They are different.

  ---

  ### The New Cases

  **Case A: The Liar Machine**
  *   **Setup:** Machine prints "Chance of rain = 0.8". Builder is a liar.
  *   **Principle Application:** PP applies to $Ch(Rain)=0.8$. It does *not* apply to "Machine says $Ch(Rain)=0.8$."
  *   **Verdict:** Your credence should **not** be 0.8. It should be low.
  *   **Why:** You do not satisfy the antecedent of the PP. You do not know $Ch(Rain)=0.8$. You know $Report=0.8$. You must condition on the reliability of the report.
      $$C(Rain) = C(Rain \mid Report) \neq 0.8$$
      Unless you have independent reason to trust the builder, you ignore the printout. PP is not a gullibility principle.

  **Case B: Unknown Chance (1/4 or 3/4)**
  *   **Setup:** Chance is fixed but unknown. Equal credence it's 1/4 or 3/4.
  *   **Principle Application:** Use Total Probability with PP.
  *   **Verdict:** Credence = 0.5.
      $$C(Heads) = C(Heads \mid Ch=1/4)C(Ch=1/4) + C(Heads \mid Ch=3/4)C(Ch=3/4)$$
      $$= (1/4 \times 0.5) + (3/4 \times 0.5) = 0.5$$
  *   **Why:** PP tells you what to do *given* a chance hypothesis. When you have multiple competing hypotheses, you average them. This is standard Bayesianism + PP.

  ---

  ### The Showdown: Are (3) and (5) the Same?

  **No.** This is the most important thing you need to tell Ravi.

  *   **Case (3) is Epistemic Undermining.**
      *   Structure: Evidence $E$ (30 sixes) makes the hypothesis $H$ ($Ch=1/6$) improbable.
      *   Mechanism: Bayesian updating on the *chance parameter*.
      *   Status: You reject the chance claim.
  *   **Case (5) is Temporal Indexing.**
      *   Structure: Evidence $E$ (null) is consistent with hypothesis $H$ ($Ch_{past}=1/2$).
      *   Mechanism: Deferring to the chance function *at the relevant time*.
      *   Status: You accept the chance claim, but acknowledge the event is settled *now*.

  **Why they feel the same:** In both cases, there is a tension between "What the chance says" and "What the world looks like."
  **Why they are different:** In (3), the world *contradicts* the chance claim (frequencies don't match propensities). In (5), the world *completes* the chance claim (propensity resolves to fact).

  If you treat them as the same, you confuse **evidence against a chance hypothesis** with **evidence about an outcome**.
  *   In (3), the 30 sixes are evidence *against* $Ch=1/6$.
  *   In (5), the lack of info is evidence *for* deferring to $Ch_{past}=1/2$.

  ### Final Verdict: What Survives?

  **Lewis's Original PP (LPP)** is technically false because of Case (3) (Undermining) and Case (6) (Determinism/Humeanism). If you use LPP, you must accept that it is an approximation that fails when chances supervene on futures.

  **Hall's New PP (NPP)** is the robust survivor.
  *   It handles (3) by conditioning on History.
  *   It handles (4) and (B) via Total Probability.
  *   It handles (5) by enforcing time-indexing ($Ch_t$).
  *   It handles (2) via the definition of Admissibility (information about the future outcome is inadmissible).

  **What you must give up:**
  1.  **Case (6) Compatibilism:** You cannot say "Determinism is true, so chances are 0/1" AND "I should defer to 1/6." You must adopt Humean Compatibilism (Lewis's view) where chances are summaries of patterns, even in deterministic worlds. If you refuse this, PP is dead for you.
  2.  **Case (5) Timelessness:** You must stop talking about "The Chance" and start talking about "The Chance at time $t$." If you refuse this, (5) remains a contradiction.
  3.  **Case (4) Confusion:** Admit you misapplied the principle. PP is conditional.

  **What to tell Ravi next Friday:**
  "Ravi, I'm adopting Hall's New Principal Principle. I concede Case (4) was a Total Probability error, not a PP failure. I concede Case (6) requires Humean Compatibilism or the principle dies. But I maintain Case (5) is solved by time-indexing chance functions, not by abandoning deference. And Case (3) is undermining evidence updating the chance hypothesis, not a violation of deference. If you disagree, show me where NPP fails, not where LPP fails."

  That should shut him up for at least one pint.
