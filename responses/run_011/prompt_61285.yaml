answer: |-
  **MEMORANDUM**

  **TO:** Cedar Basin Regional Water Authority Board
  **FROM:** [Your Name], Chair, Finance Subcommittee
  **DATE:** November 10, 202X
  **SUBJECT:** Recommendation on Cost-Allocation Formula for Joint Treatment Plant

  **RECOMMENDATION**

  I recommend the Board adopt the **Kalai-Smorodinsky solution (Rule K) weighted for ability to pay** as the basis for the Intergovernmental Agreement. Under this formula, the City of Fairview contributes **$126 million** and Sanitary District No. 4 contributes **$54 million**.

  This results in an annual cost of approximately **$246 per City household** (0.3% of median income) and **$1,190 per District household** (2.9% of median income). While this requires the City to contribute $13.5 million more than the unweighted "Rule N" (Nash) formula, it is the only option that ensures the District's financial viability without relying on uncertain state bailouts.

  **THE AXIOM FIGHT: MATH VS. POLICY**

  We have spent four months debating bargaining theory as if it were physics. It is not. Our Staff Economist is correct: because our cost-savings "frontier" is flat, Rule K and Rule N produce identical results in raw dollars. The difference only appears when we weight dollars by income.

  We must be plain: **No bargaining axiom can settle the question of equity.** Choosing to weight the formula by ability to pay is not a mathematical discovery; it is a policy choice to prioritize regional stability over strict contractual symmetry. If we choose Rule N (unweighted), we are choosing to treat a dollar from a $41k-income household the same as a dollar from a $78k-income household. That is a valid distributive choice, but we must own it publicly rather than hiding behind the "Nash" label. I recommend we own the equity choice.

  **THE "BETTER OPTIONS" PARADOX**

  Professor Ledbetter argues that under Rule N, a party can be penalized if their outside options improve (e.g., if the District secures a $30M grant). She worries that getting a grant could reduce the District's share of the cooperation savings.

  **The Staff Economist is technically right:** In our specific setup, with the current cost numbers, this paradox cannot bite. The math does not punish the District for a grant in this specific iteration. **However, Professor Ledbetter is strategically right:** Rule K is structurally immune to this penalty in future scenarios. Since this agreement must last decades, adopting the rule that protects partners from being punished for securing outside funding is the prudent long-term strategy.

  **THE "BLUFF" AND THE FALLBACK**

  Board Member Duane has stated the District may prefer to violate its permit and pay fines rather than fund its $95 million standalone fallback. We cannot write a contract based on the assumption that a partner will choose illegal operation.

  We must treat the $95 million fallback as real for the model. If we assume the District will bluff, the City's risk exposure explodes: if the District fails, the State may intervene, potentially mandating a City takeover at a cost far exceeding $126 million. We must plan for the legal baseline, not the threat.

  **THE INDUSTRIAL PARK (2029)**

  It is true that Rule K does not extend cleanly to three or more parties. When the Industrial Park interconnects in 2029, the current formula will not hold.

  **Recommendation:** Adopt Rule K (Weighted) for the initial City-District capacity. Insert a **Reopener Clause** for 2029 that shifts the allocation of *incremental* capacity to a Rule N (Nash) framework for the new party, while preserving the equity protections for the original residential base. This allows us to solve the immediate crisis without locking in a formula that breaks upon expansion.

  **THE CASE FOR THE CITY (THE LOSER UNDER THIS RECOMMENDATION)**

  I will read this section aloud because the City appointees deserve to hear why I am asking them to pay more.

  Under Rule N, the City pays $112.5 million. Under my recommendation, you pay $126 million. You are being asked to subsidize the District by $13.5 million. This is not a trivial amount. You have the stronger tax base, the better credit rating, and the lower per-household burden. It is reasonable to argue that you should not be penalized for your own fiscal success.

  However, consider the alternative. A $1,490 annual burden on the District (under Rule N) represents 3.6% of their median income. In municipal finance, that is a distress level that often leads to default. If the District defaults, the environmental liability does not stop at the county line. The State's likely response to a failing District is not to let it collapse, but to mandate a regional fix funded by the nearest solvent entity: Fairview.

  Paying the extra $13.5 million now is effectively an insurance premium. It buys you a solvent partner, it prevents the State from forcing a more expensive consolidation later, and it secures the $55 million in total cooperation savings that vanish if this deal fails. You are not just paying for pipes; you are paying for regional stability.

  **NEXT STEPS**

  I move that we authorize counsel to draft the Intergovernmental Agreement based on the Rule K (Weighted) allocation, including the 2029 Reopener Clause. We have the numbers. We have the need. We need the vote.
