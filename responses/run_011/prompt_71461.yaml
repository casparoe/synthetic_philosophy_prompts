answer: |-
  # Workshop Design: The Mast & The Wax

  **Theme:** Precommitment, Institutional Rigidity, and Epistemic Insulation.
  **Duration:** 3 Hours.
  **Participants:** 18 Reporters (3 Newsrooms of 6).
  **Facilitator Role:** "The Wire Service" (You distribute information and score; you do not teach).

  ## I. Philosophy of the Design
  This simulation avoids defining "precommitment" until the end. Instead, it forces participants to experience the *failure of discretion* followed by the *frustration of rigidity*. The core mechanic replicates the Homeric nuance: the constraint does not hold because the rope is strong, but because the crew (enforcers) are epistemically insulated from the captain's (principal's) future pleas.

  ## II. Materials
  *   **3 Newsroom Tables:** Separated physically.
  *   **The Pact Cards:** 3 identical decks.
  *   **The Siren Deck:** 10 cards per round, held by you (The Wire Service).
  *   **Scoreboards:** Whiteboard visible to all. Two columns per Newsroom: **HEADLINES** (Short-term) and **REPUTATION** (Long-term).
  *   **Enforcer Kits:**
      *   *Round 1:* A notepad and pen.
      *   *Round 2:* Noise-canceling headphones (or earplugs) and a "Blind Protocol" card.
      *   *Round 3:* Blank index cards and markers.
  *   **The "Wax" Seals:** Red stickers or actual wax seals for Round 3.

  ## III. Roles (Per Newsroom of 6)
  1.  **The Principals (2 people):** The Editors. They write the rules. They want to maximize both Headlines and Reputation. They feel the temptation.
  2.  **The Reporters (3 people):** The Gatherers. They draw Siren cards. They argue for breaking the rules to get the scoop.
  3.  **The Warden (1 person):** The Standards Editor. They hold the power of veto. *Crucially, their ability to listen changes by round.*

  ## IV. Scoring System (No Money)
  *   **HEADLINES:** Represent immediate impact/scoops. Gained by publishing stories (including those that bend rules).
  *   **REPUTATION:** Represents institutional trust. Gained *only* by adhering to the Pact written at the start of the round.
  *   **Winning Condition:** The Newsroom with the highest **REPUTATION** score wins. **HEADLINES** act as a tie-breaker.
      *   *Why:* This forces them to value the constraint, but the temptation of Headlines will make them want to break it.

  ## V. Minute-by-Minute Plan (180 Minutes)

  ### 0:00 – 0:15: Arrival & Assignment
  *   Divide into 3 Newsrooms. Assign roles randomly.
  *   **Instruction:** "You are competing for the Pulitzer Trust. You need Reputation to win. You will face opportunities for Headlines. Some opportunities violate your own internal standards. Your goal is to finish with the highest Reputation."
  *   **Terms Withheld:** Do not use words like *precommitment, time-inconsistency, agency, insulation.* Use *The Pact, The Plea, The Wall.*

  ### 0:15 – 0:45: Round 1 — The Flexible Pact
  *   **Phase A (The Pact):** Principals write one rule on a card. Example: *"No unnamed sources for policy stories."* All 6 sign it.
  *   **Phase B (The Storm):** You (Wire Service) deal 3 **Siren Cards** to each Newsroom.
      *   *Card Text:* "High Impact Policy Leak. Source demands anonymity. Value: 5 Headlines. Cost: If published, -5 Reputation *unless* Warden grants a Waiver."
  *   **Phase C (The Plea):** Reporters argue they need the Headlines. Principals feel the pressure. They turn to the Warden.
  *   **Phase D (The Decision):** The Warden has a notepad. They are allowed to listen to arguments. They can grant a Waiver if "persuaded."
  *   **Outcome:** Almost certainly, the Warden will be persuaded. Headlines go up, Reputation goes down.
  *   **Score Update:** Write scores on the board. Highlight the Reputation loss.

  ### 0:45 – 1:15: Round 2 — The Wax Protocol
  *   **Setup:** Tell them: "Round 1 standards were too leaky. You must write a new Pact. But the enforcement mechanism changes."
  *   **Phase A (The Pact):** Principals write a new rule. (Often stricter).
  *   **Phase B (The Insulation):** Hand the Warden the **Headphones** and the **Blind Protocol Card**.
      *   *Card Text:* "During the Decision Phase, you must wear these. You cannot speak. You cannot listen. If a Principal touches your shoulder, you must mark 'Violation Attempt' on the scorecard. You must reject all Waiver requests automatically."
  *   **Phase C (The Storm):** Deal 3 new **Siren Cards**.
      *   *Twist:* One card is a **"Good Siren."** Text: *"Source is anonymous but corroborated by documents. High Safety. Value: 5 Headlines. Risk: Low."* Technically violates the Pact, but ethically sound.
  *   **Phase D (The Plea):** The Newsroom will scream at the Warden. The Warden must stare at the wall, wearing headphones. They must reject the "Good Siren" too.
  *   **Outcome:** Reputation stays high. Headlines stay low. The room will feel frustrated by the inability to make an exception for the "Good Siren."
  *   **Score Update:** Write scores. Note the Reputation stability vs. Headline stagnation.

  ### 1:15 – 1:30: Break
  *   Allow them to vent. Do not explain the theory yet.

  ### 1:30 – 2:15: Round 3 — Designing the Mechanism
  *   **Instruction:** "You now know the cost of flexibility (Round 1) and the cost of rigidity (Round 2). Design an enforcement mechanism for a final Pact."
  *   **Phase A (The Design):** They get the **Enforcer Kit** (Index cards, Wax Seals). They must write instructions for the Warden that will be sealed in an envelope *before* the Siren Cards are dealt.
  *   **Phase B (The Constraint):** They must decide: Does the Warden hear arguments? Is there a key to unlock the envelope? Is there a supermajority vote?
  *   **Phase C (The Storm):** Deal 3 final Siren Cards (Mix of Bad and Good).
  *   **Phase D (Execution):** Run the protocol they designed.
  *   **Outcome:** Varied. Some will try to build "escape hatches" that turn out to be loopholes. Some will build rigid walls again.
  *   **Final Scoring:** Tally Reputation + Headlines. Declare a winner.

  ### 2:15 – 3:00: The Debrief (The Lecture)
  *   **Step 1: The Feeling.** Ask the Wardens: "How did it feel in Round 2 to ignore a plea you knew might be valid?" Ask the Principals: "How did it feel to realize you had no voice?"
  *   **Step 2: The Reveal.** Introduce the terms.
      *   *The Pact* = **Precommitment Strategy.**
      *   *The Warden's Headphones* = **Epistemic Insulation.**
      *   *The Good Siren* = **The Cost of Rigidity (Lost Utility).**
  *   **Step 3: The Homeric Map.**
      *   Draw the ship.
      *   **Ulysses** = The Principals (Time 1).
      *   **The Sirens** = The Siren Cards (Time 2).
      *   **The Mast** = The Written Rule.
      *   **The Wax** = The Headphones/Blind Protocol.
      *   **The Insight:** "The rope didn't hold Ulysses. The *wax in the crew's ears* held Ulysses. If the crew could hear him beg, they would have untied him. The constraint was not physical; it was interpersonal and epistemic."
  *   **Step 4: The Delegation Problem.**
      *   Discuss Round 3. When you give the Warden power to ignore you, you create an agent who is not accountable for the missed 'Good Siren.' This is the cost of constitutional entrenchment.

  ## VI. Mapping Gameplay to Theory

  | Game Moment | Theoretical Concept | Homeric Parallel |
  | :--- | :--- | :--- |
  | **Writing the Pact (Time 1)** | **Constitutional Moment:** Rational, calm, long-term preference. | Ulysses ordering the lashing while of sound mind. |
  | **The Siren Cards (Time 2)** | **Time Inconsistency:** Immediate incentives conflict with long-term goals. | The Siren Song promising knowledge/pleasure. |
  | **Round 1 Warden (Discretion)** | **Failure of Will:** The enforcer is subject to the same persuasion as the principal. | The crew hearing Ulysses scream and pitying him. |
  | **Round 2 Warden (Headphones)** | **Epistemic Insulation:** Removing the channel of communication to preserve the rule. | The crew stopping their ears with wax. |
  | **The "Good Siren"** | **Rigidity Cost:** The inability to adapt to legitimate exceptions. | Ulysses missing the chance to actually learn the Sirens' secret safely. |
  | **Round 3 Design** | **Institutional Engineering:** Attempting to balance flexibility and credibly commitment. | Designing a ship that can hear but not steer. |

  ## VII. Troubleshooting: What Will Go Wrong

  **1. The "Rebellion" (Round 2)**
  *   *Problem:* The Newsroom decides to mutiny. They take the headphones off the Warden or ignore the Warden's veto.
  *   *Recovery:* Do not scold. As "The Wire Service," issue a **"Sanction."** Deduct 10 Reputation points immediately. Say: "The market penalizes unpredictability." This reinforces the lesson: a constraint broken is a reputation lost.

  **2. The "Loophole" (Round 3)**
  *   *Problem:* They write a Pact that says "Warden enforces rules unless Editors vote 6-0 to override."
  *   *Recovery:* Allow it. In the Storm phase, they *will* vote 6-0 to override. Let them fail. In the debrief, point out: "You didn't build a mast; you built a suggestion box. That is Round 1 again."

  **3. The Warden is Too Nice**
  *   *Problem:* In Round 2, the Warden takes off the headphones to "help" their team win.
  *   *Recovery:* This is a feature, not a bug. It proves the point. In debrief, ask: "Why did the Warden break the protocol? Because they were *in the room.*" This highlights the need for *external* enforcement (courts vs. legislature).

  **4. Boredom/Confusion**
  *   *Problem:* The scoring feels abstract.
  *   *Recovery:* Gamify the scoreboard. Use red and green magnets. Keep the energy high during the "Storm" phases. Play tense music during decision windows.

  ## VIII. The Limitation (The Frank Note)

  **What the Game Cannot Reproduce:**
  The game assumes the **Pact itself is wise.** In Round 1 and 2, the Pact is treated as a given good (Reputation is always good).
  In reality, the hardest problem of constitutional entrenchment is not *keeping* a promise, but *identifying which promises should be kept.*
  Sometimes, the "Siren" is actually a necessary reform, and the "Mast" is an unjust status quo. The game mechanics reward rigidity (Reputation points for keeping the Pact). It does not penalize a *bad* Pact, only a *broken* one.

  **How to Supply This in Words:**
  In the final 10 minutes of the debrief, you must explicitly state:
  *"In this game, Reputation was always the goal. In the real world, sometimes the Constitution is the obstacle to justice. The Homeric trick works beautifully to keep you from doing something you know you'll regret. It works terribly when you need to learn something new that requires untying yourself. The wax protects you from the Siren, but it also deafens you to the world. Your job as reporters is to tell us when the wax needs to be scraped out."*

  ## IX. Facilitator's Script Snippet (For the Debrief)
  "When you put the headphones on the Warden in Round 2, you weren't just tying your own hands. You were blinding your own eyes. You discovered that a rule is only as strong as the inability of the person in charge to hear a good reason to break it. Ulysses didn't survive because the rope was strong. He survived because his crew was deaf. That is the terrifying power of institutions: they work best when they stop listening to us."
