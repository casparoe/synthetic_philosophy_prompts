  ## 6. Expected Outcomes and Failure Conditions

  ### 6.1 What a Successful Result Looks Like
  A successful dissertation will not necessarily prove that a unique, stable democratic boundary exists. In fact, the most likely philosophical result is that the standard principles do *not* converge without additional constraints.
  Success is defined as:
  1.  **Clarification:** The fixed-point framework successfully clarifies the structure of the regress objection, showing exactly where and why the standard principles fail.
  2.  **Differentiation:** It demonstrates that different principles have different convergence properties (e.g., Subjected converges faster than Affected).
  3.  **Normative Insight:** It provides a new criterion for evaluating democratic principles: operational stability.
  4.  **Integration:** It successfully integrates the hydrological analogy without reducing politics to hydraulics.
  If the dissertation achieves this, it makes a contribution to the literature regardless of whether the final answer is "Yes, it converges" or "No, it doesn't."

  ### 6.2 What Counts as Project Failure
  The project would fail if:
  1.  **Triviality:** The fixed-point analogy turns out to be merely metaphorical, adding no logical precision to the existing arguments. If I cannot define the mapping function clearly, the maths is just dressing.
  2.  **Category Error:** The application of convergence theory is shown to be a category mistake (e.g., if political membership is fundamentally discrete and non-iterative).
  3.  **Incoherence:** The "Conceptual Formalism" is too vague for philosophers and too loose for mathematicians, satisfying neither.
  4.  **Scope Creep:** The attempt to cover all three principles (Affected, Subjected, Coerced) leads to a superficial treatment of each.

  ### 6.3 Contingency Plans
  If the fixed-point approach proves too difficult to formalise even conceptually, I will pivot to a purely conceptual analysis of "Iterative Democratic Theory." I will retain the core idea (that boundaries are formed through repeated claims) but drop the mathematical notation.
  If the hydrological analogy is deemed too niche, I will broaden it to general "systems theory" or "cybernetics," which has a stronger pedigree in political science (e.g., Deutsch).
  However, my strong hunch is that the hydrological analogy is the strongest asset of the proposal. It grounds the abstract in the concrete, which is often valued in interdisciplinary work. I will proceed with it as the primary heuristic.

