  ## 8. Detailed Literature Engagement (Uncited)

  To properly situate the fixed-point hypothesis, I must engage deeply with the existing arguments regarding the Boundary Problem. The literature generally falls into two camps: those who believe the problem is solvable via a normative principle, and those who believe it is insoluble and must be bypassed.

  **The Normative Principle Camp**
  Within this camp, the All-Affected Interests Principle is the dominant contender. Proponents argue that democracy is fundamentally about protecting interests. If a decision impacts you, your interest is at stake, and therefore your voice is required to protect it. The counter-argument, which I will leverage, is the problem of specification. How do we measure impact? Do we count potential impact or actual impact? Do we count impact on preferences or on welfare?
  The All-Subjected Principle offers a more institutional approach. It argues that democracy is about the relationship between ruler and ruled. If you are under the authority, you must be part of the authority. The weakness here is the definition of authority. Does it extend to soft power? Economic influence?
  The All-Coerced Principle narrows the focus to force. It is attractive because coercion is a clear threshold. However, it faces the "border paradox." Border controls coerce those outside by keeping them out. Therefore, those outside should be inside to vote on the border. This leads to an open border conclusion which contradicts the idea of a bounded state.

  **The Skeptical Camp**
  The skeptics argue that the Boundary Problem is undecidable democratically. They argue that the *demos* must precede democracy. This is often called the "Prior Question." If the Prior Question cannot be answered democratically, then democracy is always built on a non-democratic foundation (force, history, ethnicity).
  My project challenges the skeptics not by answering the Prior Question directly, but by changing the nature of the question. I am not asking "What is the prior boundary?" I am asking "Does the boundary emerge from the process?" This shifts the ontology of the *demos* from a static precondition to a dynamic equilibrium.

  **The Gap**
  Neither camp considers the iterative stability of the principles. The skeptics assume the regress is vicious. The proponents assume the principle is self-evident. Neither tests the principle for convergence. This is the specific niche my dissertation occupies. I am not arguing for a new principle; I am arguing for a new *test* for existing principles.

