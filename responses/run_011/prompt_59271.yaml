  ## 9. Expanded Methodological Reflection

  *(Expanding this section to ensure the "Maths" concern is fully addressed)*

  **The Epistemological Status of the Analogy**
  I must be clear about the epistemological status of the hydrological analogy. I am not claiming that voters behave like water molecules. Water follows physical laws; voters follow norms. However, both systems involve flows across boundaries, and both involve feedback loops. In hydrology, pumping water here lowers the water table there. In politics, voting here changes the law there.
  The value of the analogy is not in the material similarity but in the structural similarity. Both are boundary-value problems. In engineering, we accept that the boundary conditions are often part of the solution. We do not demand to know the exact boundary before we start modelling; we estimate it and refine it.
  Political philosophy, by contrast, often demands the boundary be justified *before* the model (the democracy) can run. This is a category error in system design. You cannot justify the boundary independently of the system it bounds.
  By adopting the engineering mindset, I am proposing a pragmatic shift in political philosophy. We should look for "good enough" boundaries that stabilise the system, rather than "perfect" boundaries that are logically prior.

  **The Risk of Reductionism**
  The primary risk is reductionism. If I treat the *demos* as a variable in an equation, I risk ignoring the human agency involved. People *choose* to identify with a group; water does not choose to flow.
  To mitigate this, the "Mapping Function" in my model will not be a physical law but a "Normative Recognition Function." It maps "Claims of Affectedness" to "Inclusion." This preserves the agency. The convergence is not physical; it is social. It happens when the group stops contesting the boundary.
  This distinction is crucial. A physical fixed point is inevitable (gravity wins). A social fixed point is contingent (people agree to stop fighting). My dissertation will argue that democratic legitimacy is precisely this contingent stability. It is not that the boundary is "true"; it is that the boundary is "accepted."

  **Formalism Limits**
  I will use set notation ($S$, $S'$, $f(S)$) to clarify the logic. I will avoid calculus. I will speak of "direction" and "magnitude" of change metaphorically. For example, "The All-Affected Principle exerts an expansive pressure on the boundary." This is mathematical language used philosophically.
  I will explicitly state in the methodology chapter that I am not a mathematician. I will invite the examiner to judge the argument on its philosophical coherence, not its mathematical rigour. The maths is a scaffold, not the building.

