  ## 7. Scope Assessment and Feasibility

  ### 7.1 Is the Scope Manageable?
  The proposed scope is ambitious for a part-time MA. Covering three major principles and developing a novel theoretical framework is a significant task.
  **Potential Bottleneck:** The analysis of the All-Affected Principle is potentially bottomless because "affectedness" is so broad.
  **Solution:** I will limit the analysis to a specific type of decision: resource allocation (specifically water/environmental policy). This keeps the "affectedness" tractable and aligns with my background. I will state clearly that I am testing the principles in the context of *resource democracies*, generalising only where the logic holds. This narrows the scope from "All Democratic Decisions" to "Decisions with Spatial/Temporal Externalities."
  **Potential Bottleneck:** The mathematical formalism.
  **Solution:** I will limit the formalism to set theory notation and basic function properties (injective, surjective, convergent). I will avoid calculus or topology unless absolutely necessary. I will include a glossary of mathematical terms for the philosophy reader.

  ### 7.2 Should the Project Be Cut Down?
  There is a strong case for cutting the project down to focus on *only* the All-Affected Principle.
  **Argument for Cutting:** The AAIP is the most susceptible to the regress objection and the most relevant to the hydrological analogy. The Subjected and Coerced principles are more legalistic and might not benefit as much from the fixed-point analysis. Focusing on one principle would allow for greater depth and reduce the risk of superficiality.
  **Argument Against Cutting:** Comparing the principles is essential to show that the fixed-point property varies. If only AAIP is analysed, the conclusion might be "AAIP diverges," which is already suspected. If ASP is shown to converge, that is a significant comparative finding.
  **Decision:** I propose to keep all three but prioritise the AAIP. Chapters on ASP and ACP will be shorter, serving as contrasts to the main analysis of AAIP. If, by Month 6, the workload proves too heavy, I will merge the ASP and ACP chapters into a single comparative chapter.
  **Word Count Consideration:** The dissertation target is 12,000 words. This is tight for three principles plus methodology.
  *   Intro/Conclusion: 2,000 words.
  *   Lit Review: 3,000 words.
  *   Methodology: 2,000 words.
  *   Analysis (AAIP): 3,000 words.
  *   Analysis (ASP/ACP): 2,000 words.
  This distribution suggests that the ASP/ACP section must be concise. I will frame them as "Counter-Cases" rather than full independent analyses. This ensures the core contribution (the AAIP fixed-point analysis) gets the space it needs.

  ### 7.3 Feasibility of the "Maths"
  I must be honest about my mathematical competence. I can handle the logic of fixed points, but I cannot prove existence theorems for complex social functions.
  **Mitigation:** I will frame the mathematical claims as "plausibility arguments" supported by the hydrological analogy. I will not claim "Theorem: The Demos Converges." I will claim "Argument: The Structure of Affectedness Suggests Divergence." This lowers the bar for mathematical rigour while maintaining logical rigour.
  I will also rely on the supervisor to flag if the formalism is becoming a distraction. The philosophy is the end; the maths is the means.

  ### 7.4 Administrative Note on Word Count
  There is a potential ambiguity regarding the 12,000-word specification. In most MA programs, this figure refers to the final dissertation length, not the proposal. A 12,000-word proposal is unconventional and may exceed the supervisor's expectations for this stage. This document is drafted as a "Comprehensive Research Plan" to ensure all methodological and philosophical bases are covered. If the strict requirement is for a shorter proposal (e.g., 3,000 words), the sections on Literature Review and Monthly Plan can be condensed significantly without losing the core argument. I will seek clarification on this immediately after submission.

