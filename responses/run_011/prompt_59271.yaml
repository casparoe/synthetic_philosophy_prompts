answer: |-
  # Dissertation Proposal: The Boundary Problem as a Fixed-Point Convergence

  **Candidate:** [Your Name]
  **Program:** MA Political Philosophy (Part-Time)
  **Proposed Title:** *Convergent Demos: A Fixed-Point Approach to the Boundary Problem in Democratic Theory*
  **Submission Date:** [Friday's Date]
  **Supervisor:** [Supervisor Name]

  ---

  ## 1. Introduction and Statement of the Research Question

  ### 1.1 The Context of the Inquiry
  Democratic theory rests on a foundational presupposition that is rarely subjected to rigorous operational scrutiny: the existence of a pre-political *demos*. Before a group can decide anything democratically, it must be determined who constitutes the "group" entitled to decide. This is the classic Boundary Problem. In standard normative theory, we proceed by assuming a unit of analysis—a state, a city, a community—and then ask how decisions within that unit ought to be made. However, the legitimacy of the decision procedure is contingent upon the legitimacy of the unit itself. If the boundaries of the unit are arbitrary or unjust, the democratic procedure occurring within those boundaries inherits that defect.

  For thirty-five years, my professional life was dedicated to groundwater modelling for a state agency. In that context, the "boundary problem" was not abstract; it was hydraulic. An aquifer does not respect county lines, property deeds, or electoral districts. Whether a specific farmer is deemed "affected" by a pumping permit issued to a neighbour depends entirely on the parameters of the hydrological model. If the model runs on a five-year horizon with a two-kilometre radius of influence, the farmer is outside the boundary of concern. If the model runs on a fifty-year horizon with a five-kilometre radius, that same farmer is inside the boundary, entitled to compensation or veto power. The "affected set" was not a fact waiting to be discovered in the landscape; it was a product of the modelling parameters chosen by the regulator.

  Retiring from this work has allowed me to recognise that the central puzzle of democratic boundary-setting is structurally identical to the parameterisation problem in hydrological modelling. The standard answers in political philosophy—who should be included in the *demos*?—suffer from the same indeterminacy I encountered in the field. The prevailing principles (that all affected should decide, or all subject to the law, or all coerced by it) fail to provide a determinate boundary because the application of the principle itself requires a prior decision about the scope of the principle.

  This dissertation proposes to treat the Boundary Problem not as a vicious regress to be dissolved by fiat, but as a mathematical stability problem to be analysed through the lens of fixed-point theory. The core research question is this: **Can the democratic boundary be conceptualised as a fixed point of a mapping function that relates decision procedures to the sets they enfranchise, and if so, does this mapping converge to a unique, stable solution independent of initial conditions?**

  ### 1.2 The Precise Formulation of the Problem
  To ensure this inquiry yields a determinate answer rather than remaining in the realm of metaphor, the question must be stated with sufficient precision to allow for logical evaluation, even if full mathematical proof is beyond the scope of an MA in philosophy.

  Let $D$ be a decision procedure (e.g., majority rule).
  Let $S$ be a set of individuals (the *demos*).
  Let $f$ be a function that maps a decision procedure and a set of candidates to an enfranchised subset. That is, $f(S, D) \rightarrow S'$, where $S'$ is the set of individuals who, according to a specific principle (e.g., "all affected"), *ought* to be included in the decision.

  The Boundary Problem arises because $S'$ is rarely identical to $S$. If we start with a provisional $S_0$ (e.g., current citizens), apply the principle $f$, we get a new set $S_1$. If we then apply the principle to $S_1$, do we get $S_2$? Does this sequence $S_0, S_1, S_2...$ converge to a limit $S^*$ such that $f(S^*, D) = S^*$?

  If such a fixed point $S^*$ exists, the regress is halted not by normative fiat, but by structural stability. If the sequence oscillates or diverges, the regress is vicious, and the principle $f$ is operationally unusable for boundary setting.

  Therefore, the dissertation will investigate three specific sub-questions:
  1.  **Existence:** Under what conditions does a normative boundary principle (Affected, Subjected, Coerced) generate a mapping function that possesses a fixed point?
  2.  **Uniqueness:** If a fixed point exists, is it unique? Or does the final boundary depend on the starting set $S_0$ (path dependence)?
  3.  **Normative Significance:** If a fixed point exists, does its existence confer legitimacy? Conversely, if no fixed point exists, does that invalidate the principle?

  This formulation moves the debate from "Which principle is morally correct?" to "Which principle is operationally stable?" It treats the *demos* not as a static entity but as an equilibrium state of a recursive inclusion process.

  ### 1.3 Rationale for the Approach
  The motivation for this approach is twofold. First, it leverages my professional background to offer a concrete instantiation of an abstract philosophical problem. The hydrological analogy is not merely illustrative; it suggests that the indeterminacy of the *demos* is a feature of complex systems, not just a failure of moral reasoning. Second, it addresses a gap in the literature. While the regress objection is well-known, the proposal to treat it as a convergence problem is novel. Most theorists accept the regress as a reason to abandon boundary-setting principles in favour of historical or pragmatic defaults. This project asks whether that surrender is premature.

  By framing the problem this way, I aim to determine whether the "Boundary Problem" is a genuine philosophical impasse or a solvable coordination problem. If the mapping converges, the regress is benign. If it does not, the regress is vicious. This distinction allows for a determinate answer: the project succeeds if it can demonstrate the convergence properties of the standard principles, and it fails if it shows that the formalism adds no clarity to the existing philosophical stalemate.

  ---

  ## 2. The State of the Debate: Existing Positions and the Regress Objection

  ### 2.1 The Standard Principles of Inclusion
  To evaluate the fixed-point hypothesis, I must first establish the mapping functions provided by the existing literature. In contemporary democratic theory, three dominant principles attempt to solve the boundary problem. I will refer to these by their common labels: The All-Affected Interests Principle, The All-Subjected Principle, and The All-Coerced Principle.

  **The All-Affected Interests Principle (AAIP)**
  This is the most intuitive and widely discussed position. It holds that anyone whose interests are significantly affected by a collective decision should have a right to participate in making that decision. In the context of my former work, this is the farmer whose water table drops because of a neighbour's permit.
  *Strengths:* It aligns with deep democratic intuitions about fairness and harm. It prevents externalities where one group imposes costs on another without recourse.
  *Weaknesses:* The definition of "affected" is notoriously porous. In a globalised world, almost everyone is affected by almost everything to some degree. A decision on interest rates in one country affects employment in another. If "affected" is interpreted causally, the *demos* becomes global for almost every decision. If interpreted as "significantly affected," the threshold of significance is arbitrary.
  *The Boundary Issue:* To decide who is "affected," you need a decision procedure. But to have a decision procedure, you need to know who is "affected." This is the entry point for the regress.

  **The All-Subjected Principle (ASP)**
  This position argues that inclusion should be granted to all those who are subject to the law or the governance structure in question. It is often favoured by those who want a more bounded, state-centric *demos*.
  *Strengths:* It provides a clearer boundary than AAIP. Legal jurisdiction is usually well-defined. It aligns with the idea of political obligation; if you must obey, you should have a say.
  *Weaknesses:* It is circular. To know who is "subject to the law," you must know the jurisdiction of the law. But the jurisdiction of the law is determined by the boundaries of the state. Who decides the boundaries of the state? If the answer is "the people within the boundaries," we are back to the start.
  *The Boundary Issue:* This principle presupposes the existence of the legal order it seeks to legitimise. It solves the boundary problem by assuming the boundary is already settled legally, which begs the normative question of whether that legal boundary is just.

  **The All-Coerced Principle (ACP)**
  A refinement of the Subjected Principle, this view holds that those who are coerced by the state's enforcement mechanisms deserve a say. It focuses on the use of force rather than mere legal subjection.
  *Strengths:* It captures the moral urgency of autonomy. Coercion requires justification; democratic participation is that justification.
  *Weaknesses:* Like the Subjected Principle, it relies on a prior definition of the scope of coercion. Does coercion extend to border controls that keep people out? If so, those excluded are coerced and should be included, which dissolves the border.
  *The Boundary Issue:* It faces the same circularity as the Subjected Principle. The scope of coercion is determined by the state's reach, which is determined by the *demos*.

  ### 2.2 The Regress Objection
  The standard objection to all three principles is the Regress Objection. It argues that any rule used to determine the membership of the *demos* must itself be chosen democratically. But to choose that rule democratically, you need a *demos* to vote on it. Thus, you need a *demos* to decide who is in the *demos*.
  This leads to an infinite regress. To decide Rule 1 (who votes), you need Vote 1. But to hold Vote 1, you need Rule 1.
  Most theorists conclude from this that the boundary problem cannot be solved democratically. The conclusion is usually that boundaries must be settled by non-democratic means: history, geography, force, or international law. The *demos* is treated as a pre-political fact, a "given" that democracy works upon, rather than something democracy creates.

  ### 2.3 Why the Existing Positions Leave the Question Open
  The existing debate leaves the question open because it treats the regress as a logical stop-sign rather than a dynamic process. The literature focuses on the *first step* of the regress (the circularity) and declares the project impossible. It does not ask what happens if you iterate the process.
  In mathematics and engineering, circular definitions are often resolved through iteration. We define $x$ in terms of $x$, then we solve for the value where the input equals the output. The philosophical literature has not seriously entertained the possibility that the *demos* is the result of an iterative process of claim-making and recognition.
  By stopping at the first circle, the standard positions assume that the starting point ($S_0$) determines the outcome. They assume path dependence without testing for convergence. If the mapping function contracts the set of candidates towards a stable core, the starting point matters less. If it expands or oscillates, the starting point matters more.
  The existing positions fail to distinguish between a *vicious* regress (divergence) and a *benign* regress (convergence). This is the gap this dissertation intends to fill. The question is not "Is there a circle?" (Yes, there is). The question is "Is the circle a spiral that tightens to a point, or one that widens into chaos?"

  ### 2.4 The Hydrological Analogy as Philosophical Evidence
  In groundwater modelling, we deal with partial differential equations that describe flow. To solve them numerically, we discretise the aquifer into a grid. The boundary conditions (e.g., constant head at the edge of the model) are often unknown. We estimate them, run the model, check the output against observed data, adjust the boundaries, and run again. We iterate until the model converges—until the change between iterations is negligible.
  This is not considered a flaw in the science; it is the method. The "true" boundary is the one where the model stabilises.
  Applying this to political philosophy: The *demos* is not a static line on a map. It is the stable state of a process where claims of affectedness are made, evaluated, and either incorporated or rejected. If the process stabilises, the boundary is legitimate because it is robust. If it never stabilises (e.g., every inclusion creates new claims for exclusion), then the boundary is illegitimate or impossible.
  This analogy provides a concrete test case for the philosophical principles. It suggests that the "indeterminacy" of the affected set is a function of the time horizon and spatial scale (parameters), not necessarily a moral failure. The dissertation will use this analogy not to reduce politics to hydrology, but to use hydrology as a proof-of-concept for the fixed-point method.

  ---

  ## 3. The Proposed Method: Fixed-Point Theory in Political Philosophy

  ### 3.1 Conceptualising the Mapping Function
  The core methodological move of this dissertation is to translate the normative principles into functional mappings. I will not be attempting to prove theorems in the style of a mathematics dissertation. Rather, I will use the *logic* of fixed-point theory to structure the philosophical argument.
  I will define the "Inclusion Function" $I(S)$ for each principle.
  For the All-Affected Principle, $I(S)$ is the set of all individuals whose interests are impacted by the decisions made by $S$.
  For the All-Subjected Principle, $I(S)$ is the set of all individuals subject to the laws enforced by $S$.
  The research will analyse the properties of these functions.
  *   **Monotonicity:** Does adding people to $S$ always add people to $I(S)$, or can it subtract them? (e.g., if more people vote for isolationism, fewer are affected).
  *   **Contraction:** Does the size of the set tend to shrink or grow with iteration?
  *   **Continuity:** Do small changes in the starting set lead to small changes in the outcome, or drastic shifts?

  ### 3.2 The Level of Formalism
  A critical constraint of this project is the level of mathematical formalism appropriate for a Philosophy MA. My background is in applied hydrology, not pure mathematics. I am comfortable with numerical methods, convergence criteria, and system dynamics, but I am not a set theorist.
  The dissertation will avoid rigorous topological proofs. Instead, it will use "conceptual formalism." I will use the notation to clarify the logical structure of the arguments, not to derive new mathematical truths.
  For example, rather than proving that a function is a contraction mapping under the Banach Fixed-Point Theorem, I will argue qualitatively that the All-Affected Principle behaves *like* a non-contractive mapping because the causal chain of effects expands indefinitely (the "butterfly effect" of politics).
  I will be transparent about this limitation in the methodology chapter. The goal is not to mathematise political philosophy, but to use mathematical concepts as heuristic tools to expose structural features of the arguments that prose alone obscures.
  The supervisor should expect diagrams of convergence, logical flowcharts of the iterative process, and clear definitions of terms, but not axiomatic proofs. The rigour will be philosophical rigour applied to a structural problem, supported by mathematical intuition.

  ### 3.3 Why This Method?
  The standard method in political philosophy is conceptual analysis and normative argumentation. We argue that Principle X is more just than Principle Y.
  The problem is that justice presupposes a subject. You cannot distribute justice if you don't know who is in the room.
  By shifting to a structural method (fixed-point analysis), I bypass the initial normative stalemate. I am not asking "Is it fair to include the farmer?" I am asking "If we include the farmer, does the set of relevant people stabilise?"
  This allows me to evaluate the principles on their *operational viability* rather than just their moral appeal. A principle that leads to infinite expansion (global *demos* for every local decision) might be morally attractive but operationally impossible. A principle that leads to immediate closure (only current citizens) might be stable but morally repugnant.
  The fixed-point method allows us to map the trade-off between stability and inclusivity. It turns a moral debate into a system design problem, which aligns with my background and offers a fresh perspective on an old puzzle.

