  ## 5. Justification of Approach: Why Not the Alternatives?

  ### 5.1 Alternative 1: Comparative Case Studies of Boundary Disputes
  One obvious alternative would be to examine real-world boundary disputes (e.g., gerrymandering, secession movements, cross-border water rights) and analyse how they were resolved.
  **Why I am rejecting this:**
  While empirically rich, this approach remains descriptive. It tells us how boundaries *are* settled, not how they *ought* to be settled, or whether they *can* be settled consistently. A case study approach might show that boundaries are usually settled by force or history, but it cannot evaluate the normative validity of the democratic principles themselves.
  Furthermore, case studies are bound by the specific details of the cases. My goal is to address the structural logic of the Boundary Problem itself. The hydrological analogy serves the function of a case study but is more controlled. In a model, I can vary the parameters (time horizon, radius) and see the effect on the boundary. In real history, I cannot rerun the 19th century with different voting laws to see if the border stabilises. The theoretical modelling approach allows for a level of abstraction that reveals the underlying logic more clearly than historical narrative.

  ### 5.2 Alternative 2: Normative Defence of One Principle
  Another standard approach is to argue that one principle (e.g., All-Subjected) is simply the correct moral principle, and the regress objection is a distraction.
  **Why I am rejecting this:**
  This approach ignores the operational reality of the regress. Even if the All-Subjected Principle is morally correct, it is useless if it cannot identify its own subjects without circularity. Moral correctness does not guarantee operational coherence.
  By focusing on the coherence (convergence) rather than the moral intuition, I avoid getting stuck in the endless debate about which moral value (autonomy, welfare, fairness) is paramount. I am testing the *engine* of the principles, not the *fuel*. If the engine seizes up (diverges), it doesn't matter how high-quality the fuel is. This approach offers a meta-ethical evaluation of the principles rather than a first-order ethical defence.

  ### 5.3 Alternative 3: Purely Mathematical Modelling
  Could I not build a full agent-based model or a rigorous topological proof?
  **Why I am rejecting this:**
  First, it is beyond the scope of an MA in Philosophy. Second, and more importantly, political boundaries are not purely mathematical objects. They are constituted by beliefs, recognition, and norms. A purely mathematical model would strip away the normative content that makes the problem philosophical.
  The "Conceptual Formalism" I propose strikes a balance. It uses the logic of mathematics to clarify the philosophy without reducing the philosophy to mathematics. It respects the discipline of the MA while leveraging my unique background.

  ### 5.4 The Value of the Fixed-Point Approach
  The unique value of this approach is that it transforms the Boundary Problem from a paradox into a design specification. If the problem is a lack of convergence, the solution might be to alter the mapping function (e.g., by adding a discount rate to future affectedness, or a threshold for coercion). This opens up new avenues for institutional design that the standard literature ignores. It suggests that democratic boundaries might need "damping mechanisms" to prevent oscillation, much like a control system in engineering. This is a novel contribution that justifies the project.

