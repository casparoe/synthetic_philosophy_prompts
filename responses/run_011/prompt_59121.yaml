  ### Scoring Key & Interpretation

  **Step 1: Calculate Your Coordinates**
  Score your answers on three dimensions (0–10 scale).

  *   **Dimension 1: Modal Strength (MS)**
      *   *Measures:* Do you treat identities as fixed across scenarios?
      *   *Items:* 1, 2, 6, 10.
      *   *Score:* +2 for each **A**. +0 for **B** or **C**.
      *   *Range:* 0–8. (High = Identity is fixed; Low = Identity is flexible).

  *   **Dimension 2: Reference Source (RS)**
      *   *Measures:* Do you think reference is fixed by the world or by descriptions?
      *   *Items:* 3, 4, 7.
      *   *Score:* +2 for each **A** (World/Stipulation). +0 for **B** (Description/Usage). +1 for **C**.
      *   *Range:* 0–6. (High = World/Stipulation; Low = Description).

  *   **Dimension 3: Epistemic Clarity (EC)**
      *   *Measures:* Do you distinguish trivial truths from contingent facts?
      *   *Items:* 8, 9.
      *   *Score:* +2 for **8A** and **9A**. +0 for any other combination.
      *   *Range:* 0–4. (High = Clear distinction; Low = Blurred distinction).

  **Step 2: Locate Your Position**
  Find the cell below that matches your coordinates.

  | Position | Coordinates (MS, RS, EC) | Name | Status |
  | :--- | :--- | :--- | :--- |
  | **High MS, High RS, High EC** | (6–8, 4–6, 4) | **Kripkean Orthodoxy** | Standard |
  | **High MS, High RS, Low EC** | (6–8, 4–6, 0–2) | **Strong Two-Dimensionalism** | Standard |
  | **Low MS, Low RS, High EC** | (0–4, 0–2, 4) | **Neo-Fregean** | Standard |
  | **High MS, Low RS, High EC** | (6–8, 0–2, 4) | **Deflationary** | Standard |
  | **Low MS, High RS, High EC** | (0–4, 4–6,4) | **Contingent Identity** | Standard |
  | **Mixed/Low EC** | (Any, Any, 0–2) | **Epistemic Blurring** | Standard |
  | **High MS, Low RS, Low EC** | (6–8, 0–2, 0–2) | *Empty* | **Incoherent** |
  | **Low MS, Low RS, Low EC** | (0–4, 0–2, 0–2) | *Empty* | **Unwanted** |
  | **Low MS, High RS, Low EC** | (0–4, 4–6, 0–2) | *Empty* | **Unthought** |

  **Empty Cells Analysis:**
  *   **(High MS, Low RS, Low EC):** Claims identity is fixed but meaning determines reference, yet fails control cases. **Incoherent:** If meaning fixes reference, trivial identities should be clear.
  *   **(Low MS, Low RS, Low EC):** Claims identity is flexible and meaning-based, but fails controls. **Unwanted:** No one wants to deny logical triviality and contingent facts simultaneously.
  *   **(Low MS, High RS, Low EC):** Claims identity is flexible but world-based, yet fails controls. **Unthought:** Usually, world-based views protect logical identity.

  **Indistinguishable Leaves:**
  *   **Kripkean Orthodoxy vs. Deflationary:** Both score High MS and High EC. They differ on *why* (metaphysics vs. language rules). This quiz cannot separate them; you will need to argue the grounding in seminar.
  *   **Kripkean Orthodoxy vs. Strong Two-Dimensionalism:** Both score High MS and High RS. They differ on whether "could have been otherwise" makes sense (Conceivability). Item 6 and 10 Option B hints at this, but the scoring lumps them. Flag this tension in discussion.

  **Step 3: Your Readout**
  Find your position below for your seminar preparation.

  *   **Kripkean Orthodoxy:** You think identities are fixed by the world, and surprise doesn't change that. **Item 6 gave you away:** You said pain couldn't exist without the process. **Say in seminar:** "The gap is epistemic, not metaphysical; we could discover the identity without it being contingent."
  *   **Strong Two-Dimensionalism:** You think identities are fixed, but imagine them changing makes sense somehow. **Item 10 gave you away:** You said heat could feel different without motion. **Say in seminar:** "We need two senses of meaning: one fixed by the world, one capturing how we conceive it."
  *   **Neo-Fregean:** You think identities depend on how we describe things, not just the things themselves. **Item 7 gave you away:** You said the Twain fact is linguistic. **Say in seminar:** "The cognitive gap shows the meanings differ, so the identity isn't straightforwardly necessary."
  *   **Deflationary:** You think identities are fixed, but only because of how we use words. **Item 3 gave you away:** You said the meter stick knowledge is definitional. **Say in seminar:** "The necessity is trivial; it's just a rule of our language, not a deep fact."
  *   **Contingent Identity:** You think identities could have been false. **Item 2 gave you away:** You said the ancients were mistaken about the stars. **Say in seminar:** "Identity statements are discovered facts that could have turned out otherwise."
  *   **Epistemic Blurring:** You struggled with the control cases or mixed intuitions. **Item 8 gave you away:** You found "Hesperus is Hesperus" informative or contextual. **Say in seminar:** "I'm unsure if the puzzle stems from language or reality; the distinctions seem unstable."
