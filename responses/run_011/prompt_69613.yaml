prompt: |-
  Teaching Ted Chiang's Story of Your Life in a phil of mind seminar next week and I want to run it against the language of thought hypothesis instead of the usual Sapir-Whorf take, which every student has already heard a hundred times. The angle I can't work out myself: Heptapod B isn't a spoken language written down, it's semasiographic, built from semagrams laid out on a 2-D surface in no linear order, and Louise has to know the whole design before she can put down any part of it. That reads like a claim that her *medium of representation* changed format, from sequential and compositional to simultaneous and non-compositional, which is exactly what Fodor needs to explain productivity and systematicity. So can a LOT theorist even make sense of what Chiang describes, or does the story require the language of thought to be the one thing it can't be, i.e. rewritable? Two things I want pressed hard. First, Fodor's argument that you can only learn a language you already know: Louise picks up Heptapod B as an adult second language, so does that escape the argument cleanly, or does her thinking in it require her mentalese itself to have been reformatted, and what could possibly do the reformatting? Second, and this is the one that bugs me: what we actually read is a string of English sentences, first person, addressed to a daughter, with a narrator who says I and withholds things from us. If her cognition really became directionless, with premises and conclusions interchangeable, what is this artifact, a degraded linear rendering of something simultaneous, or evidence Chiang never meant the strong reading at all? I think late Fodor got interested in iconic representations that aren't compositional, so maybe there's an escape hatch there, tell me whether it helps him or digs the hole deeper. Also, if you think the Arrival film is more or less commited to the strong view than the story, say so in a couple sentences, someone will bring it up. Don't quote the story at me, I have it in front of me, and no reading list either. End by telling me what a narrative like this does for the debate that straight argument can't, if anything.
