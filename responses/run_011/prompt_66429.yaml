          3.  **The Reductio (Manageable but Dangerous):** If firing/unfollowing counts, the term "punishment" loses its specific political weight.
      *   *Concessions:* A defender *must* concede that without establishing *political authority* (not just functional power), the "constituted body" element is stretched beyond recognition.
      *   *Predictions:*
