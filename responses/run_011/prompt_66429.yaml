      *   *Defeater 2: The Intent/Censure Problem.* Punishment usually implies *censure* or moral condemnation, not just risk management. If platforms ban for "safety" or "brand safety" (profit), is it censure? If it's purely commercial risk mitigation, it looks more like firing an employee than punishing a citizen.
      *   *Defeater 3: The Reductio Ad Absurdum (Insulation).* If getting fired or unfollowed counts, the concept loses critical bite. Political theory cares about *state* power or *public* power. If private power counts identically, the distinction between public and private spheres collapses.
      *   *Defeater 4: Empirical Reach.* Does reach shrink? Yes. But does that prove punishment? Or just market dynamics?

