      *   *Empirics:* Reach shrinkage confirms hard treatment. It doesn't confirm *punishment* specifically. A competitor driving you out of business also shrinks your reach.
      *   *Insulation/Reductio:* This is a major exposure. If a private employer firing you is "punishment," then political theory loses its grip on the *state*. You need a boundary.
      *   *Conclusion/Advice:* Pivot. Don't argue it *is* punishment in the Hartian state-sense. Argue it is *privatized punishment* or *penal power without sovereignty*. Or, concede the category mistake but argue the *effect* is what matters (functionalist). But the prompt asks me to critique the current thesis. I will argue the thesis is currently unsustainable without a theory of private authority.

