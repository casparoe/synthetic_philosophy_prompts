      *   *Example:* Zebra/Mule is insufficient alone. Needs deepfake parallel. Science examples need careful framing (modal vs. statistical).
      *   *Misconceptions:* Map them to timeline points. Add the "conscious process" misconception.
      *   *Ending:* The question.
      *   *Omissions:* How to frame them positively.
      *   *Closing:* Sign off.

      *(Self-Correction during drafting)*: I need to make sure I don't use bold text or lists. I must write in paragraphs. I need to ensure the flow is logical. I need to be specific about *why* the order is forced. It's forced because closure is a pre-theoretical intuition; tracking is a theoretical tool. You don't sell a tool by showing what it breaks before showing what it fixes.

      *(Check on Science Examples)*: The prompt asks if they can carry the point without collapsing into reliability. I need to be honest. It's hard. Climate attribution is the strongest candidate because it's about causal fingerprints. Face-recognition is too easily read as "99% accurate." I should advise caution there.

