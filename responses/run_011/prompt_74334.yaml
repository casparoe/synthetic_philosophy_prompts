answer: |-
  ### The Logical Space

  Before sorting positions, we map the four splits that define the debate:

  1.  **Reality Status:** Is "real" an all-or-nothing property, or do things exist in degrees (e.g., "real enough")?
  2.  **Ontological Category:** Is a virtual sword a genuine digital object, a fictional prop, merely patterns of bits, or nothing at all?
  3.  **Locus of Harm:** When something goes wrong, does the harm land on the avatar, the player's psychology, their real-world interests, or nowhere?
  4.  **Fragility:** Does the ability to switch off a server or delete a save file negate the existence of what was there?

  ---

  ### The Virtual Worlds Sorting Quiz

  **1. The Minecraft Castle**
  A friend logs into your private server and blows up the castle you spent months building. What did they destroy?
  *   (A) A genuine digital structure that existed in the world.
  *   (B) A fictional prop within a game of make-believe.
  *   (C) Nothing; they just changed some coloured pixels on a screen.

  **2. The Real-Money Sword**
  You paid £50 for a rare sword in an MMO. A hacker steals it. What did you lose?
  *   (A) Digital property with real ownership rights.
  *   (B) A licensed service access tied to fictional items.
  *   (C) Nothing but data; the money loss is the only real thing.

  **3. The Begging NPC**
  An NPC script is programmed to beg you not to delete its save file. Do it have an interest in surviving?
  *   (A) Yes, it has a digital interest in continuing its process.
  *   (B) No, it's a tool designed to simulate having interests.
  *   (C) No, it is nothing but code executing instructions.

  **4. The Virtual Marriage**
  Two players exchange vows inside a game world recognized by their community. Are they married?
  *   (A) Yes, they entered a real digital social contract.
  *   (B) No, they are roleplaying a marriage scenario.
  *   (C) No, they clicked buttons; marriage requires physical presence.

  **5. The VR Assault**
  In a social VR space, one user physically corners and punches another's avatar. Where is the harm?
  *   (A) The avatar was assaulted in its own environment.
  *   (B) The player behind the avatar was psychologically harmed.
  *   (C) Nowhere; no physical contact occurred.

  **6. The Dead Brother's Save**
  Your late brother left a half-finished save file. The server is shutting down forever. What is lost?
  *   (A) A digital artifact of his agency persists until deleted.
  *   (B) A memory aid is lost, but the object was never real.
  *   (C) Storage space is freed; the data was never him.

  ---

  ### The Key & Leaves

  **Virtual Realism (Mostly A)**
  *   **View:** Virtual objects are genuine digital objects. Virtual events are real events.
  *   **Harm:** Lands on the digital entity or the digital environment.
  *   **Fragility:** Deletion destroys a real thing, like burning a book.

  **Fictionalism (Mostly B)**
  *   **View:** Virtual objects are props in a game of make-believe.
  *   **Harm:** Lands on the player's feelings or social standing within the fiction.
  *   **Fragility:** Deleting the file ends the game, like closing a book.

  **Eliminativism (Mostly C)**
  *   **View:** Virtual objects are nothing; there are only electrons and screens.
  *   **Harm:** Nowhere (unless real money/psychology is involved).
  *   **Fragility:** Irrelevant; nothing was there to be fragile.

  **Deflationism (Mix of C on Ontology, A/B on Harm)**
  *   **View:** Ontology doesn't matter; objects are "just code," but harms are definitely real.
  *   **Harm:** Lands on the player's real-world interests/feelings.
  *   **Note:** This view is indistinguishable from Virtual Realism on ethical outcomes, but differs on metaphysics.

  **Unoccupied Logical Space**
  *   **The "Ghost Harm" Combo:** Choosing (C) on Ontology (it's nothing) but (A) on Harm (the avatar felt it).
      *   **Status:** **Incoherent.** You cannot claim the object is nothing while claiming harm landed on *it* rather than the user.
  *   **The "Fragile Real" Combo:** Choosing (A) on Ontology (it's real) but believing deletion makes it *never have existed*.
      *   **Status:** **Unattractive.** Few hold this because it contradicts the intuition that past existence is fixed.

  **Indistinguishable Leaves**
  *   **Realism vs. Deflationism:** If a Realist admits harm ultimately affects the human player, and a Deflationist admits the digital object was "real enough" to cause it, the questions cannot tell them apart. They agree on ethics, disagree on metaphysics.

  Verdict: Virtual Realism
