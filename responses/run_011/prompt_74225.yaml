prompt: |-
  I sit on the panel that runs a small futarchy pilot at a research institute: for the past two years we have settled some internal questions by opening prediction markets rather than by voting. Our record so far is as follows. We approved a market on whether a software migration would be completed by a fixed date, resolved against the vendor's public release log. We refused to open a market on whether the institute's director would step down within the year, on the ground that the best-informed traders were also the ones with most to gain from the answer and some ability to produce it. We approved, subject to a rule excluding senior staff from trading, a market on whether a major funder would renew a programme. We rejected a proposed market on whether a new internal policy would improve the culture here, because nothing could later be checked against it. We approved a thinly traded market on which of two contractors would be selected, on the explicit understanding that the price would inform our deliberation but not settle it. And we adopted a standing gloss distinguishing traders who can bring an outcome about from traders who merely know about it, barring only the former — a gloss that sits somewhat uneasily with the director case, where our stated worry also concerned who stood to gain.

  The director now proposes something closer to futarchy proper: two markets, one on the institute's refereed publication output over eight years if we adopt restructuring plan A, the other on the same measure under plan B, with whichever market clears higher to be adopted automatically. The measure is defined in advance and auditable; the horizon outlasts every current member of the panel; only one of the two markets can ever be resolved; and plan A's principal advocate has offered to fund the payout pool and intends to trade in both markets.

  Which ruling best coheres with our own precedents — approve, approve with conditions, or reject? Please identify the closest analog among the five earlier cases, lay out the candidate rules our record supports (they should not all point the same way here, and say what each implies for this proposal), state which of our precedents we would effectively have to overrule or reinterpret on each option, give your recommendation, and tell us honestly what principle we would be committing ourselves to if we decided the other way.
reasoning: |-
  Here's a thinking process that leads to the suggested ruling:

  1.  **Analyze the Request:**
      *   **Context:** A panel running a small futarchy pilot at a research institute.
      *   **Task:** Evaluate a new proposal from the Director (two conditional prediction markets on publication output under Plan A vs. Plan B, winner adopted automatically).
      *   **Constraints/Requirements:**
          *   Identify the closest analog among the five earlier cases.
          *   Lay out candidate rules supported by the record (they must conflict/diverge).
          *   State what each candidate rule implies for this proposal.
          *   State which precedents would need overruling/reinterpreting for each option (Approve, Approve with Conditions, Reject).
          *   Give a recommendation.
          *   State the principle committed to if the *other* way is decided (the "honest truth" about the counterfactual).

  2.  **Analyze the Precedents (The "Case Law"):**
      *   *Case 1 (Software Migration):* **Approved.** Objective resolution (vendor log), fixed date. *Principle:* Clear, verifiable resolution criteria are good.
      *   *Case 2 (Director Step Down):* **Rejected.** Reason: Best-informed traders = those with ability to produce the outcome + most to gain. *Principle:* No markets where traders can manipulate the outcome (moral hazard/insider trading risk). Also hinted at conflict of interest (gain).
      *   *Case 3 (Funder Renewal):* **Approved (with condition).** Condition: Senior staff excluded from trading. *Principle:* Insiders with influence/knowledge can trade if restricted, but external verification is key.
      *   *Case 4 (Culture Policy):* **Rejected.** Reason: Nothing could be checked against it (subjective/unverifiable). *Principle:* Resolution criteria must be objective/auditable.
      *   *Case 5 (Contractor Selection):* **Approved (Advisory).** Price informs deliberation, does not settle it. *Principle:* Markets can be consultative rather than binding if risk is high or stakes are tricky.
      *   *Standing Gloss:* Distinguishes traders who *bring about* an outcome vs. those who merely *know about* it. Bars the former. *Tension:* Acknowledges unease with Case 2 (Director Step Down) where "gain" was also a factor.

  3.  **Analyze the New Proposal:**
      *   **Mechanism:** Futarchy proper (conditional markets). Market A (Output if Plan A), Market B (Output if Plan B). Higher price wins -> Plan adopted automatically.
      *   **Metric:** Refereed publication output over 8 years.
      *   **Horizon:** 8 years (outlasts current panel).
      *   **Resolution:** Only one market resolves (the winning plan). The other is void/cancelled.
      *   **Stakeholder:** Plan A's advocate funds the payout pool *and* intends to trade in both markets.

  4.  **Evaluate Conflicts & Risks:**
      *   *Verification:* 8-year publication count is auditable (like Case 1). -> **Pro-Approval.**
      *   *Manipulation/Influence:* Plan A's advocate funds the pool and trades. This is a massive conflict of interest. They can pump Market A to ensure Plan A wins. This violates the spirit of Case 2 (Director Step Down) and the Standing Gloss (traders who bring about outcomes).
      *   *Binding Nature:* "Adopted automatically." This is stronger than Case 5 (advisory). It removes panel discretion.
      *   *Resolution Risk:* Only one market resolves. This creates a "counterfactual problem." If Plan A wins, we never know what Plan B would have yielded. Traders know this. It creates incentives to sabotage the *other* plan if trading the losing market is possible (though usually, losing markets are voided). More critically, it incentivizes making the winning plan look good at the expense of long-term health, or manipulating the metric.
      *   *Insider Trading:* The advocate is an insider (presumably senior staff). Case 3 excluded senior staff.
      *   *Time Horizon:* 8 years is very long for a prediction market. Liquidity and discounting become issues.
      *   *The "Gain" Factor:* Case 2 rejected because traders had "most to gain." Here, the advocate definitely has much to gain (their plan wins).

  5.  **Drafting the Analysis (Iterative Process):**

      *   *Closest Analog:* Case 2 (Director Step Down). Both involve high-level structural changes where key insiders have influence and financial stake. Also Case 5 (Contractor) regarding binding vs. advisory, but Case 2 is stronger on the manipulation risk.
      *   *Candidate Rules:*
          1.  *The Verifiability Rule:* (From Case 1 & 4). Is the metric objective? Yes (Publications). Implies Approve.
          2.  *The Manipulation/Insider Rule:* (From Case 2 & Standing Gloss). Can traders influence the outcome? Yes (Advocate). Implies Reject.
          3.  *The Mitigation Rule:* (From Case 3). Can we exclude insiders? Proposal says advocate *intends to trade*. Implies Reject or Strict Conditions.
          4.  *The Binding Rule:* (From Case 5). Should markets decide or inform? Proposal says "automatically." Case 5 says "inform." Implies Conditions (make it advisory) or Reject.

      *   *Options Analysis:*
          *   **Approve:** Overrules Case 2 (Insider influence), Case 3 (Senior staff trading), and Standing Gloss. Commits to "Market Efficiency over Governance Safety."
          *   **Approve with Conditions:** (e.g., Advocate cannot trade, make it advisory). Aligns with Case 3 (exclusions) and Case 5 (advisory). But "Futarchy proper" requires binding. If made advisory, it's not really the Director's proposal anymore.
          *   **Reject:** Aligns with Case 2 (Manipulation risk) and Standing Gloss. Preserves Case 5 (Panel discretion).

      *   *Recommendation:* **Reject.** The conflict of interest (advocate funding + trading) is fatal. The "only one resolves" structure creates perverse incentives. The 8-year horizon is impractical.
      *   *The "Honest Truth" (Principle of the Counterfactual):* If you approve, you admit the pilot was never about "better decisions" but about "abdication of responsibility" or "allowing wealthy insiders to buy policy."

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check the Standing Gloss:* It distinguishes "bring about" vs "know about." The advocate definitely "brings about" Plan A. So the Gloss bars them.
      *   *Check Case 3:* Senior staff excluded. Advocate is likely senior.
      *   *Check Case 2:* Rejected because informed traders = those who produce outcome + gain. This is *exactly* the Director/Advocate situation here.
      *   *The "Futarchy Proper" aspect:* The proposal asks for *binding* markets. Case 5 explicitly kept markets *advisory*. Moving to binding is a major shift.
      *   *The Funding:* Advocate funding the pool is a bribe mechanism essentially.
      *   *The "One Resolves" issue:* This is a known problem in conditional markets (the "counterfactual void"). If Plan A wins, Market B is void. Traders in Market B might try to ensure Plan A loses so their market resolves, or vice versa. It creates cross-market manipulation.

  7.  **Finalizing the Structure:**
      *   **Ruling:** Reject.
      *   **Closest Analog:** Case 2 (Director Step Down).
      *   **Candidate Rules:**
          1.  *Objective Resolution* (Cases 1 & 4).
          2.  *Non-Manipulability/Insider Control* (Case 2 & Gloss).
          3.  *Discretionary Oversight* (Case 5).
          4.  *Conflict of Interest Mitigation* (Case 3).
      *   **Precedent Overruling:**
          *   Approve -> Overrules Case 2, Case 3, Case 5, Gloss.
          *   Conditions -> Overrules Director's "Futarchy Proper" (binding), but saves the pilot's integrity.
          *   Reject -> Consistent with Case 2, 3, 5, Gloss.
      *   **Recommendation:** Reject.
      *   **The Principle:** If you approve, you commit to "Capital determines Policy" rather than "Information determines Policy."

  8.  **Drafting the Response:** (Ensure tone is appropriate for a panel memo—formal, analytical, decisive). *Self-Correction on "Approve with Conditions":* If I recommend "Approve with Conditions," I need to specify conditions that make it viable (Advocate barred from trading, Advisory only). But the prompt asks which ruling *best coheres*. Given the severity of the conflicts, Reject is the most coherent with the *protective* precedents (2, 3, 5). However, "Approve with Conditions" might be the diplomatic "Futarchy" answer. Let's look closer. Case 3 approved *with conditions* (exclude senior staff). Case 5 approved *with conditions* (advisory). So "Approve with Conditions" is actually very consistent with the *method* of the panel, even if the specific proposal is risky.
      *   *BUT:* The proposal is for "Futarchy Proper" (Binding). Making it advisory changes the nature of the proposal fundamentally.
      *   *AND:* The advocate funding the pool *and* trading is a structural flaw that conditions might not fix (if they can't trade, why fund? If they fund, they have leverage).
      *   *Decision:* **Reject** is the strongest coherent position based on Case 2. Case 2 rejected a market because the traders could produce the outcome. Here, the Advocate *is* the producer. Case 3 excluded senior staff, but this is the *Director's* proposal (presumably Director or close ally). Excluding them might make the market empty.
      *   *Actually, looking at the prompt:* "Which ruling best coheres... approve, approve with conditions, or reject?"
      *   *Re-evaluating "Approve with Conditions":* If we bar the advocate from trading (Case 3 precedent) and make it advisory (Case 5 precedent), does it cohere? Yes. But does it meet the Director's ask? No. The prompt asks what coheres with *our precedents*, not the Director's wishes.
      *   *Wait, the "One Resolves" issue:* This is technically complex. If Plan A wins, Plan B market is void. This discourages trading on Plan B. It creates a liquidity asymmetry.
      *   *Let's stick with Reject.* The combination of "Binding," "Advocate Funds & Trades," and "Insider Influence" is too toxic compared to Case 2. Case 2 is the strongest negative precedent.

      *   *Wait, let's look at the "Principle we would be committing ourselves to if we decided the other way."* This implies I need to pick one and defend it, then explain the cost of the alternative.
      *   *Okay, I will recommend Reject.* It is the most robust defense of the pilot's integrity based on Case 2 and the Standing Gloss.
      *   *Alternative:* Recommend "Approve with Conditions" (Bar advocate from trading, Make Advisory). This saves the *idea* but respects the *rules*.
      *   *Which is better?* The prompt highlights the tension in the Standing Gloss ("sits somewhat uneasily with the director case"). The panel is already unsure about the "bring about" vs "gain" distinction.
      *   *Crucial Detail:* "Plan A's principal advocate... intends to trade." Case 3 excluded senior staff. If the advocate is senior staff, they are barred. If they are not, Case 2 still applies (ability to produce outcome).
      *   *Crucial Detail:* "Adopted automatically." Case 5 explicitly *rejected* automatic settlement ("price would inform... but not settle").
      *   *Conclusion:* To approve this *as proposed* violates Case 2, Case 3, Case 5, and the Gloss. To approve *with conditions* (making it advisory and barring trading) effectively turns it into Case 5 (Contractor) again, rendering the "Futarchy Proper" claim false.
      *   *Best Coherence:* **Reject.** The proposal violates the core safety mechanisms established in Cases 2, 3, and 5 simultaneously.

      *   *Wait, one more check:* The prompt asks me to "identify the closest analog." Case 2 is the closest analog (Director/Insider influence on structural outcome).
      *   *Candidate Rules:*
          1.  Verifiability (Case 1/4).
          2.  Non-Manipulability (Case 2/Gloss).
          3.  Insider Exclusion (Case 3).
          4.  Non-Binding/Advisory (Case 5).
      *   *Recommendation:* Reject.
      *   *Principle of the other way:* If we approve, we commit to "Wealth/Influence can buy Policy Outcomes."

      *(Self-Correction)*: I should consider if "Approve with Conditions" is the more nuanced "panel" answer. Panels often compromise. But the conditions required (No trading by advocate, Non-binding) gut the proposal so much it might as well be a rejection of the *Futarchy* aspect. I will frame the recommendation as **Reject** because the conditions required to make it safe fundamentally contradict the "Futarchy Proper" (binding) nature requested, and the conflict of interest (funding + trading) is structurally unsound regardless of trading bans (funding alone creates leverage).

      *Wait, let's look at the "Principle" question again.* "Tell us honestly what principle we would be committing ourselves to if we decided the other way."
      If I recommend Reject, the "other way" is Approve. Principle: "Policy is auctioned to the highest bidder/insider."
      If I recommend Approve (w/ conditions), the "other way" is Reject. Principle: "We are too risk-averse to test actual decision markets."
      Given the severe conflicts (Advocate funding + trading + binding), Reject is the ethically safer and precedent-consistent path. Case 2 is the anchor.

      *Refining the "Closest Analog":* It's Case 2 (Director Step Down). Both involve the Director/Leadership having a stake in a structural outcome that they can influence.
      *Refining the "Rules":*
      1.  *The Auditability Rule* (Cases 1 & 4): Metric must be objective. (Supports Approve).
      2.  *The Causality Rule* (Case 2 & Gloss): Traders shouldn't be able to cause the outcome. (Supports Reject).
      3.  *The Conflict Rule* (Case 2 & 3): Traders shouldn't have disproportionate gain/insider status. (Supports Reject/Conditions).
      4.  *The Sovereignty Rule* (Case 5): Markets inform, Panel decides. (Supports Reject/Conditions).

      *Okay, ready to write.*
answer: |-
  **Ruling:** Reject

  **Closest Analog:**
  **Case 2 (Director Step Down).**
  Like the proposed restructuring market, Case 2 involved a high-stakes structural question where the most informed parties (senior leadership) possessed both the knowledge to predict the outcome and the agency to *cause* the outcome. In Case 2, you rejected the market because the traders could "produce" the result. Here, Plan A's advocate can similarly "produce" the result (by driving the success of the restructuring) while holding a financial position. The fact that the metric is auditable (like Case 1) does not cure the manipulation risk identified in Case 2.

  **Candidate Rules Supported by the Record:**
  Your precedents do not point in a single direction; they establish a tension between *epistemic utility* (getting good information) and *governance safety* (preventing manipulation).

  1.  **The Verifiability Rule (Cases 1 & 4):** Markets require objective, auditable resolution criteria.
      *   *Implication:* **Approve.** The publication count is defined, auditable, and objective, satisfying the rejection criteria of Case 4 (Culture Policy) and meeting the standard of Case 1 (Software Migration).
  2.  **The Causality Rule (Case 2 & Standing Gloss):** Markets must be barred if traders can bring the outcome about, not merely know about it.
      *   *Implication:* **Reject.** The advocate intends to trade and fund the pool. They are definitionally a trader who can "bring an outcome about." Allowing this violates the Standing Gloss and the core reasoning of Case 2.
  3.  **The Insider Mitigation Rule (Case 3):** Insider knowledge is permissible only if those with influence are excluded from trading.
      *   *Implication:* **Approve with Conditions.** You could approve the market only if the advocate (and likely all senior staff) are barred from trading. However, this creates a liquidity problem and contradicts the advocate's stated intent.
  4.  **The Sovereignty Rule (Case 5):** Prediction markets should inform deliberation, not settle it automatically.
      *   *Implication:* **Reject (or Approve with Conditions).** The proposal demands automatic adoption ("Futarchy proper"). Case 5 explicitly established that markets should *not* settle decisions bindingly. Adopting this proposal overrules the advisory precedent set in Case 5.

  **Precedents Overruled or Reinterpreted:**

  *   **If you Approve (as proposed):** You effectively overrule **Case 2** (by allowing a trader to influence the outcome), **Case 3** (by allowing an insider/advocate to trade), and **Case 5** (by making the market binding rather than advisory). You must also reinterpret the **Standing Gloss** to mean that "bringing about" an outcome is permissible if the trader funds the pool.
  *   **If you Approve with Conditions (e.g., Advocate barred, Advisory only):** You preserve Case 2, 3, and 5, but you effectively reject the Director's proposal for "Futarchy proper." You are approving a *prediction market*, not a *decision market*. This requires reinterpreting the Director's request as a request for *information* rather than *authority*.
  *   **If you Reject:** You uphold Case 2, Case 3, Case 5, and the Standing Gloss. You do not need to overrule any precedent. You merely apply the strictest safety constraints consistently.

  **Recommendation:**
  **Reject.**

  The proposal concentrates too many disqualifying risks identified in your previous cases.
  1.  **Manipulation:** Allowing the advocate to fund the pool *and* trade creates an undeniable conflict of interest. They can subsidize the market to signal confidence they do not hold, or trade to pump the price of Plan A. This violates the Causality Rule (Case 2) and the Insider Mitigation Rule (Case 3).
  2.  **Binding Authority:** Moving from advisory (Case 5) to binding automation removes the panel's ability to intervene if the market behaves irrationally or is gamed. Given the 8-year horizon, liquidity will be thin, making the price easy to manipulate.
  3.  **Counterfactual Void:** Since only one market resolves, traders in the losing market have an incentive to sabotage the winning plan to ensure their own market resolves (or vice versa), creating perverse incentives against the institute's success.

  **The Principle of the Counterfactual:**
  If you decide the other way (**Approve**), you must honestly admit the principle you are committing to: **"Policy is auctioned to the highest bidder."**

  By allowing the advocate to fund the payout pool and trade on a binding outcome, you are no longer using markets to aggregate *information*; you are using them to aggregate *capital and influence*. You are establishing that a stakeholder with sufficient resources can purchase the right to implement their preferred policy by subsidizing the prediction that it will succeed. This transforms the futarchy pilot from a mechanism for *epistemic governance* into a mechanism for *financial lobbying*. If that is the institute's new direction, it should be debated openly as such, not introduced under the guise of a prediction market pilot.
