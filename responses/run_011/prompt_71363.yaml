  You're a moral philosopher who works on distributive justice — think this through carefully, and maybe brainstorm a bit on scratch paper before you commit to an answer. I just spent three hours arguing with a friend about prioritarianism and I honestly cant tell who won. Here's how he summed up the view, in his words:

  "Prioritarianism is the view that equality is good in itself, so what matters morally is how people stand relative to each other, not how well off they are in absolute terms. That's why the leveling-down objection finishes it: if you take from the better off and give it to nobody, prioritarianism is committed to saying the world got better, which is absurd. It also violates Pareto — it can rank a change as worse even when everybody ends up better off, just because the gaps widened. And its own math gives it away: I ran the square-root weighting he keeps using as his example, and 16-and-9 beats 36-and-0, which just shows it's egalitarianism in disguise. The one thing I'll grant is that it needs cardinal welfare with interpersonal comparisons plus a non-arbitrary zero point, which nobody can actually supply. Otherwise it's either utilitarianism or egalitarianism with extra steps."

  I'm inclined to think he's overdoing it, but I can't rule out the math-costume charge. Go through his paragraph sentence by sentence: what would a prioritarian happily sign, what's a fair simplification, and what's just wrong? Then check his arithmetic on 16/9 versus 36/0 — I get the same result he does, but when I add 25 to everybody's score, i.e. move where zero sits on the scale, the ranking flips, and he says that's cheating because zero is fixed by definition. Who's right about that? And does the fix-it-up version of his bottom line survive — is prioritarianism a genuine third view, or does it collapse into one of the two he names?
