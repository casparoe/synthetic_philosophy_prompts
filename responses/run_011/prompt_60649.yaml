answer: |-
  The verdict is that the analogy is intuitively powerful but physically brittle, and it ultimately fails to sustain the claim that collapse is nothing but Bayesian updating. It works well enough to explain why probabilities change upon learning an outcome, but it breaks down when you ask how those probabilities behave before the outcome is known, whether different agents can legitimately hold different states without contradicting physical reality, and who is doing the knowing when there is no outside observer. Your suspicion is correct that the analogy is carrying his conclusion by smuggling in classical assumptions about what probability is, and once you press on the specific mechanics of quantum theory, the bookmaker picture cracks in three distinct places that correspond exactly to the worries you raised.

  To map the analogy properly before dismantling it, the horse represents the definite measurement outcome, the odds represent the wavefunction, the running of the race represents the measurement process, the board represents the public state assignment, and the bookie represents the observing agent. In the classical picture, the odds sit static on the board until the bookie hears news, at which point they jump discontinuously to reflect the new information. The wavefunction, however, does not sit static. It evolves deterministically according to the Schrödinger equation, and this evolution is not merely a bookkeeping update but a physical propagation that allows for interference. Probabilities in classical betting are non-negative numbers that add up; quantum amplitudes are complex numbers that can cancel each other out. If the wavefunction were merely a list of odds like a bookie holds, you would not get interference patterns in a double-slit experiment because classical probabilities do not interfere. The wavefunction does work between preparations and measurements that mere knowledge does not do, and this dynamical role suggests it is tracking something more than just subjective uncertainty.

  Your second point about two bookies posting different odds touches on the hardest constraint in modern foundations, which is the suite of no-go theorems like PBR. In betting, two bookies can have different odds based on different private information without implying the horse is in two states at once. In quantum mechanics, if the wavefunction were just information about an underlying reality, then distinct quantum states could correspond to overlapping distributions of that reality. The PBR theorem shows that if you assume systems prepared independently have independent physical states, this overlap leads to predictions that contradict quantum mechanics. Essentially, if the state is just knowledge, you cannot explain why distinct quantum states are perfectly distinguishable in a way that distinct probability distributions over the same underlying reality are not. The epistemic view survives this only by abandoning very natural assumptions about preparation independence or by moving to frameworks like QBism where the theory is strictly about an agent's expectations and makes no claim about underlying reality at all, which is a much heavier philosophical price than the bookie analogy suggests.

  The third point regarding the bookie for the universe is perhaps the most fatal to the analogy in a cosmological context. A bookie must stand outside the race to take bets and update odds based on the result. If the wavefunction describes the entire universe, there is no outside. There is no external agent to hold the knowledge, no external clock to track the updates, and no external laboratory to run the race. If you insist the wavefunction is epistemic here, you are forced into a corner where facts are relative to subsystems within the universe, leading to Wigner's Friend paradoxes where different observers disagree on whether a collapse has occurred. To have a coherent cosmology where the universe has a state regardless of whether anyone is looking, the wavefunction must be ontic, or you must accept that reality itself is fragmented relative to observers. The bookie analogy implicitly assumes an external perspective that simply does not exist for the universe as a whole.

  So when you ask whether collapse is just updating survives these breaks, the answer is that it survives only if you are willing to treat quantum mechanics as a tool for agents rather than a description of the world, or if you accept non-local hidden variables that restore the classical probability logic at a deeper level. But if you want to take the theory as a complete description of physical systems, the analogy fails because it cannot account for interference dynamics, it runs afoul of no-go theorems regarding state distinguishability, and it requires an observer outside the universe. The bookie analogy is a good way to introduce the concept of probability update, but it is a bad way to argue for the nature of the quantum state because it ignores the physical work the wavefunction does before the bet is settled.
