  Been arguing in a comment thread about whether the wavefuntion is real, and the other guy keeps reaching for the same analogy: a psi-epistemic treats the quantum state the way a bookmaker treats odds on a race. The odds aren't out on the track, they encode what the bookie knows, and when the race is run they snap to 1 or 0 — that's just updating, nothing out there changed. He says psi-ontic types are people who've reified the odds board.

