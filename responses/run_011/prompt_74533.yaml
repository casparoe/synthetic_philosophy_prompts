      *   In philosophy of language (Gricean pragmatics), there's a distinction between what is *said* and what is *implicated*. Lying usually requires asserting something false. Misleading involves implicating something false while asserting something true.
      *   The user's Readback Test defines "lie" too broadly. It defines it as "causing a false belief." But causing a false belief isn't always lying. Sometimes it's merely misleading.
      *   If we accept the user's definition (Premise 1), then yes, all communication collapses into lying because communication relies on shared context and inference.
