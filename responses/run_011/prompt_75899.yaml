  **Part One: The Decision Tree**

  **Figure 1: Braudelian Classification Tree for Explanatory Sentences**

  *   **Node 1:** Is the cause's duration centuries-long? *(Criterion: Speed of change)*
      *   **No:** Go to Node 4.
      *   **Yes:** Go to Node 2.
  *   **Node 2:** If the specific triggering event were removed, would the outcome still occur? *(Criterion: Load-bearing vs. Decorative)* **[FLAG: Conflicts with Node 1 if structure is present but passive]**
      *   **No (Decorative):** Go to Node 4.
      *   **Yes (Load-bearing):** Go to Node 3.
  *   **Node 3:** Is the cause physical/non-human? *(Criterion: Kind of thing)*
      *   **Yes:** **Leaf A: Environmental/Geographical.** (*Give up: The ability to explain change without invoking human agency.*)
      *   **No:** Go to Node 3b.
  *   **Node 3b:** Is the cause economic/demographic? *(Criterion: Kind of thing)*
      *   **Yes:** **Leaf B: Slow Economic/Demographic.** (*Give up: The expectation that political decisions override material constraints.*)
      *   **No:** **Leaf C: Mentalities.** (*Give up: The hope that actors could have reasoned outside their epoch's vocabulary.*)
  *   **Node 4:** Is the cause a specific choice by a named actor? *(Criterion: Kind of thing/Agency)*
      *   **Yes:** **Leaf D: Individual Decision.** (*Give up: The claim that broader forces determined the action.*)
      *   **No:** Go to Node 5.
  *   **Node 5:** Is the cause a recurring pattern? *(Criterion: Speed/Frequency)*
      *   **Yes:** **Leaf E: Cycles/Conjunctures.** (*Give up: The belief that this specific decade was unique.*)
      *   **No:** **Leaf F: The Event.** (*Give up: The search for deeper causes beyond immediate contingency.*)
  *   **Residual:** **Leaf G: Unclassifiable.** (*Give up: The certainty that the sentence explains anything at all.*)

  **Part Two: Sentence Analysis**

  Running your eleven claims through the tree yields the following classifications:

  1.  **Leaf A (Geo).** The cause (passes/corridors) is physical and centuries-lasting. It is load-bearing; the conflict exists because of the route, regardless of the revolt.
  2.  **Leaf E (Cycles).** The cause (weather) lasts decades, not centuries. It is a recurring climatic pattern, not a unique event.
  3.  **Leaf D (Individual).** The cause is Frederick's specific acceptance. Node 4 captures this immediately.
  4.  **Leaf B (Slow Econ).** Silver erosion is centuries-long and load-bearing ( fiscal base shrinks regardless of specific policies).
  5.  **Leaf F (Event).** Although it mentions a "habit" (structure), Node 2 flags it as decorative. The sentence explicitly states "it was that debasement... that destroyed." The structure is scenery; the event is the cause.
  6.  **Leaf B (Slow Econ).** The framework (tolls/grain) is a lasting economic structure load-bearing for all powers.
  7.  **Leaf D (Individual).** Though enabled by structure (Node 6), the cause of *entry* is Christian IV's decision. Node 4 diverts it here.
  8.  **Leaf F (Event).** French policy/subsidies are specific interventions, not centuries-long structures.
  9.  **Leaf B (Slow Demo).** Depopulation is a demographic structure lasting generations.
