      *   **Core Thesis:** The user believes *Arrival* is fundamentally about the thermodynamic arrow of time (entropy, Past Hypothesis, records/correlations) rather than just aliens or linguistics. They suspect Louise's "memories" of the future are actually records running backwards or require a special boundary condition.
      *   **Specific Questions/Concerns:**
          *   Is the user's understanding of entropy/arrow of time (Past Hypothesis, Reichenbach, Huw Price) roughly correct?
