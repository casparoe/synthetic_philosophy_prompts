      *   *Correction on Khaldun:* Is *asabiyyah* resilience? Yes, it's the capacity to absorb disturbance (war). Is the collapse a regime shift? Yes, from Ordered State to Chaos/Anarchy (or new State). Is there hysteresis? Yes, you can't just "get *asabiyyah* back" in the city; you need to go back to the desert (change the environmental parameter).
      *   *Nuance:* Be careful not to say "Khaldun is right, Polybius is wrong." Say "Khaldun maps to mechanism, Polybius maps to morphology."

  7.  **Final Polish:** Check against constraints.
      *   Did I answer the specific questions? (Slow var? Regime shift? Limit cycle?)
      *   Is the residue report distinct?
      *   Did I avoid citations?
      *   Is the tone appropriate? (Philosopher/Ecologist hybrid).

  8.  *(Final Mental Check)*: Ensure I explicitly address the "Linear vs. Cyclic" question as a modelling choice regarding boundary conditions and time scales.

  **(Self-Correction Note):** Make sure I don't get too bogged down in math jargon. Keep it conceptual but precise (phase space, attractors, etc.). The user knows the math, but the translation needs to be conceptual.

