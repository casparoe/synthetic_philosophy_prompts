answer: |-
  **Scenario.**
  Consider the burying beetle (*Nicrophorus* spp.). Adults locate small vertebrate carcasses (ephemeral patches) to breed. Each season, a vast, well-mixed global pool of juveniles disperses randomly to colonize carcasses in groups of exactly three ($n=3$). Patches do not reproduce; adults leave after breeding. A heritable trait, "Regurgitant Feeding" ($A$), causes a beetle to expend energy digesting flesh for the group, benefiting all larvae and adults on the carcass. Non-secretors ($S$) consume the pre-digested flesh without paying the cost. One secretor cannot soften the hide before spoilage; at least two are required to unlock the resource. Thus, patch output is synergistic, not additive.

  **Payoff Table (Offspring per Individual):**
  *Cost of $A = 3$. Base Output = 10. Synergy Bonus (if $\ge 2A$) = 24 total (8 each).*

  | Patch Composition | Probability (at $p=0.5$) | Fitness of $A$ | Fitness of $S$ | Mean Patch Fitness |
  | :--- | :--- | :--- | :--- | :--- |
  | **3 $A$** | 0.125 | $10 - 3 + 8 = \mathbf{15}$ | — | 15 |
  | **2 $A$, 1 $S$** | 0.375 | $10 - 3 + 8 = \mathbf{15}$ | $10 + 8 = \mathbf{18}$ | 16 |
  | **1 $A$, 2 $S$** | 0.375 | $10 - 3 = \mathbf{7}$ | $10 = \mathbf{10}$ | 9 |
  | **0 $A$, 3 $S$** | 0.125 | — | $10 = \mathbf{10}$ | 10 |

  ***

  **(a) Verification of Specifications.**
  1.  **Within-patch disadvantage:** In mixed patches (2A/1S and 1A/2S), $A$ fitness is strictly less than $S$ fitness ($15 < 18$ and $7 < 10$). The cost is definite ($c=3$).
  2.  **Global increase:** At starting frequency $p=0.5$:
      *   $W_A = (0.5 \times 15) + (0.5 \times 15) \times (\text{prob of } \ge 1 \text{ other } A) \dots$
      *   Calculation: $W_A = 0.25(15) + 0.5(15) + 0.25(7) = 3.75 + 7.5 + 1.75 = 13$.
      *   $W_S = 0.25(18) + 0.5(10) + 0.25(10) = 4.5 + 5 + 2.5 = 12$.
      *   Since $13 > 12$, the trait increases. New frequency $p' = p(W_A/\bar{W}) = 0.5(13/12.5) = 0.52$.
  3.  **Relatedness:** Colonization is random from an infinite pool. The probability a patch-mate is $A$ is exactly $p$, regardless of the focal individual's type. Statistical relatedness ($r$), defined as the regression of partner genotype on focal genotype, is **0**. There is no kin structure; assortment is purely stochastic.

  **(b) Decomposition of Selection.**
  Using the Price Equation: $\Delta p = \frac{1}{\bar{W}} [ Cov(W_{patch}, p_{patch}) + E(Cov(w_{ind}, p_{ind})) ]$.
  *   **Total Change:** $\Delta p = 0.52 - 0.50 = \mathbf{0.02}$.
  *   **Between-Patch Component:** Covariance of patch fitness and patch frequency of $A$.
      *   $Cov = \sum P_i (W_i - \bar{W})(p_i - \bar{p}) = 0.75$.
      *   Term = $0.75 / 12.5 = \mathbf{+0.06}$.
  *   **Within-Patch Component:** Average covariance of individual fitness and individual trait within patches.
      *   In 2A/1S patches: $Cov = -2/3$. In 1A/2S patches: $Cov = -2/3$. Pure patches: $Cov = 0$.
      *   Expected $Cov = 0.375(-2/3) + 0.375(-2/3) = -0.5$.
      *   Term = $-0.5 / 12.5 = \mathbf{-0.04}$.
  *   **Sum:** $0.06 - 0.04 = \mathbf{0.02}$. The components sum exactly to the total change.

  **(c) Three Accounts.**
  1.  **Gene's-Eye / Individual Selection:** The gene for regurgitant feeding spreads because carriers are statistically more likely to reside in high-yield patches (3A or 2A) than non-carriers. Although an $A$ loses out locally against an $S$ neighbor, the correlation between carrying the gene and being in a synergistic group outweighs the local cost. The trait is not "altruistic" in the long run; it is a selfish strategy that exploits environmental structure.
  2.  **MLS1 (Multilevel Selection):** Selection operates at two levels with opposing vectors. Within patches, selection strongly favors $S$ (coefficient $-0.04$). Between patches, selection favors $A$ because patches with more $A$ produce more offspring total (coefficient $+0.06$). The trait evolves because between-patch selection overwhelms within-patch selection.
  3.  **Hamilton's Rule:** The standard rule is $rb - c > 0$.
      *   $r = 0$ (random assortment).
      *   $c = 3$.
      *   $b$ (average benefit to neighbor) $\approx 5.3$ (weighted average of 8 and 0).
      *   Prediction: $0(5.3) - 3 = -3 < 0$. **The rule predicts the trait will be lost.**
      *   **Diagnosis:** The rule fails because it assumes **additive** fitness effects. Here, benefits are non-linear (threshold synergy). The benefit $b$ is not a constant property of the actor but a function of the group's composition. The simple linear regression underlying $rb - c$ cannot capture the convexity of the payoff structure.

  **(d) Empirical Disagreement.**
  The three accounts **do not disagree** on observable facts. All predict the frequency will rise from 0.5 to 0.52, settle at 0.75, and resist invasion by $S$ at that equilibrium. The disagreement is purely **causal/descriptive**. The Gene's-Eye view describes a single covariance between genotype and fitness. The MLS1 view partitions that covariance into two causal processes (within vs. between). Nothing hangs on this for prediction, but it matters for intervention: an MLS1 account suggests that increasing patch isolation (increasing variance in $p_{patch}$) would accelerate the trait's spread, whereas a naive individualist account might miss the lever of group composition variance.

  **(e) Equilibria.**
  Solving $W_A = W_S$ yields the quadratic $16p^2 - 16p + 3 = 0$.
  *   **Roots:** $p = 0.25$ and $p = 0.75$.
  *   **Stability:**
      *   At $p < 0.25$: $W_S > W_A$ (Trait lost).
      *   At $0.25 < p < 0.75$: $W_A > W_S$ (Trait increases).
      *   At $p > 0.75$: $W_S > W_A$ (Trait decreases).
  *   **Verdict:** The trait does not fix. There is an **unstable threshold at 0.25** and a **stable polymorphism at 0.75**. If the trait arises by mutation (very low $p$), it will be eliminated unless drift or external factors push it past 25%.

  ***

  **Honest Notes.**

  **1. The Working Feature.**
  The single feature doing the work is **non-additivity (synergy)**.
  *Removal:* If we rebuild the table additively (e.g., each $A$ adds 4 to the patch total, shared equally, cost remains 3), the payoffs become: 3A ($10-3+4=11$), 2A/1S ($A=11, S=12$), 1A/2S ($A=9, S=10$).
  *Result:* $W_A$ becomes $10 - 3 + 4p = 7 + 4p$. $W_S$ becomes $10 + 4p$. $W_S$ is always greater than $W_A$ by exactly the cost (3). Condition 2 fails completely. Without synergy, random assortment cannot overcome within-patch disadvantage.

  **2. The Gene's-Eye Attack.**
  A defender of the gene's-eye view would argue: *"There is no group selection here. 'Between-patch selection' is just a mathematical artifact of correlating individual fitness with group frequency. The causal work is done entirely by the individual's genotype predicting its environment. Calling this 'group selection' reifies the patch as an agent when it is merely a context."*
  *Assessment:* This attack **succeeds** regarding ontology (patches are not agents) but **fails** regarding utility. While the arithmetic is equivalent, the MLS1 description correctly identifies that the *variance between patches* is the necessary condition for the trait's survival. If you homogenize the patches (remove between-patch variance), the trait dies. The "levels" language tracks the specific ecological conditions required for the equilibrium, which the "selfish gene" language obscures by burying the variance in the regression slope.

  **3. Darwinian Individuals.**
  Do the patches count as Darwinian individuals? **No.** They lack a reproductive bottleneck (they are not born from single parent patches) and they do not reproduce (they do not found daughter patches). They are "trait groups" (MLS1), not "interactor groups" (MLS2).
  *Verdict:* This distinction matters. Because patches are not Darwinian individuals, we cannot speak of the *patch* adapting. We can only speak of the *frequency of the trait* changing due to differential output of patches. This is group selection in the weak sense (differential productivity), not the strong sense (differential reproduction of groups). If one requires group reproduction for "true" group selection, this case is merely individual selection in a structured population. If one accepts MLS1 as group selection, then it qualifies. The biology is identical; the verdict depends on the terminological boundary drawn around "individual."
