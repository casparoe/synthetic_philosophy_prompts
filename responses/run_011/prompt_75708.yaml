      *   *Drafting Claim 3 (Criticism as Opinion):* False. Both see criticism as capable of correctness, not just subjective reporting.
      *   *Drafting Claim 4 (Response-dependence & Testimony):* Defensible simplification of the "pessimist" view (e.g., Hopkins), but not consensus. Response-dependence doesn't automatically entail testimony failure; it depends on whether the property is the disposition or the experience.
