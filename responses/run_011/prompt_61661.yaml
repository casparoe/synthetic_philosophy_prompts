answer: |-
  First, a quick sanity check on your prep. You are correctly "dangerous"—your understanding of the landscape is better than 90% of interviewers, but there are three specific technical corrections I need you to make before you walk into the recording booth. If you get these wrong, a sharp guest will spot it immediately and use it to pivot away from your trap.

  1.  **Temporary Intrinsics:** You wrote that the endurantist comeback is "being bent is a relation to a time." This is *one* comeback (Relationalism), but many endurantists (like E.J. Lowe) reject it precisely because it makes intrinsic properties extrinsic. They prefer "Adverbialism" (the object is *temporally* bent) or primitive instantiation. **Correction:** Don't assume all endurantists use the relational move. Frame the question around Lewis's specific objection to the relational move, asking why the guest thinks Lewis is right that this "explains away" the property.
  2.  **Relativity:** You are correct that Eternalism (past/present/future exist) and Four-Dimensionalism (objects have temporal parts) are distinct. You can be an Eternalist Endurantist (the whole worm exists, but it doesn't have parts; it's just wholly present at every time slice in the block). **Correction:** Ensure you don't use "Eternalism" and "Four-Dimensionalism" interchangeably. Your question needs to force him to bridge the gap between "time is like space" (Eternalism) and "objects are extended in time like they are in space" (4Dism).
  3.  **Vagueness:** Sider's argument relies on the premise that there cannot be vagueness in *existence*. Epistemicists agree there is no vagueness in existence, they just say we are ignorant of the sharp cutoff. **Correction:** Sider's punchline isn't just that vagueness is bad, it's that Endurantism *requires* vague existence, whereas 4Dism (with unrestricted composition) avoids it. The follow-up needs to press whether "unrestricted composition" (any random collection of temporal parts makes an object) is a fair price to pay to avoid vagueness.

  Here are eight questions designed to corner the guest, with the "Consensus/Contested" status for each.

  ---

  ### 1. The Temporary Intrinsics Trap
  **Context:** Lewis argues an object can't be bent at $t_1$ and straight at $t_2$ without contradiction unless it has parts. Endurantists say properties are relations to times.
  **Consensus Status:** **Contested.** Everyone agrees the relational move is *available*, but there is no consensus on whether it fails. 4Dists think it fails; Endurantists think it succeeds.

  **Question:** "Lewis argues that if we treat shape as a relation to a time—say, 'bent-at-t1'—we aren't describing the object's intrinsic shape anymore, we're describing a relation between the object and a clock. You defend four-dimensionalism to save intrinsics. But why is the cost of temporal parts lower than the cost of accepting that shape is relational? What specifically is lost if shape is relational that you regain with temporal parts?"

  **Follow-up A (If he says: "It makes change extrinsic/relational, and change must be intrinsic"):**
  "Okay, but on your view, the spacetime worm *itself* never changes shape. The worm is a bent-straight composite eternally. So haven't you just pushed the problem back? You've saved intrinsic properties for the *parts*, but at the cost of saying the *object* (the worm) doesn't actually change at all."

  **Follow-up B (If he says: "The relational move is just temporal parts in disguise/linguistic trick"):**
  "If it's just a linguistic difference, then the ontological commitment should be the same. But endurantists insist they aren't committing to temporal parts. Can you point to a specific truth condition or logical inference that fails on the relational view but succeeds on your view? I want to know where the machinery actually does work."

  ---

  ### 2. Relativity vs. Temporal Parts
  **Context:** Special Relativity kills absolute simultaneity, which supports Eternalism (block universe). It does not strictly prove objects have temporal parts.
  **Consensus Status:** **Settled among specialists.** It is common ground that Relativity $\rightarrow$ Eternalism, but Eternalism $\nrightarrow$ 4Dism. Conflating them is an amateur error.

  **Question:** "Special Relativity is often waved at as proof of four-dimensionalism. But strictly speaking, Relativity gets us Eternalism—that past and future are real. It doesn't force us to say objects have temporal parts. I can believe in a block universe but think I am wholly present at every slice of it. What is the specific premise that gets you from 'time is like space' to 'I am made of time-slices'?"

  **Follow-up A (If he gives a premise, e.g., "Parity of reasoning"):**
  "You're arguing that since we have spatial parts, we must have temporal parts. But space and time aren't perfectly symmetric in physics (e.g., metric signature, causality). Why should mereological composition respect that symmetry when the physics doesn't fully support it?"

  **Follow-up B (If he says: "They effectively amount to the same thing"):**
  "That sounds like you're saying Endurantist Eternalism is unstable. But philosophers like Kit Fine hold that view. Is your objection that their view is incoherent, or just that it's less parsimonious? Because if it's coherent, Relativity alone hasn't won the argument for temporal parts."

  ---

  ### 3. The Argument from Vagueness (Sider)
  **Context:** Sider argues endurantism leads to vague existence (when does the object cease?), which is impossible. 4Dism avoids this via unrestricted composition.
  **Consensus Status:** **Contested.** Sider's argument is influential but not decisive. Epistemicism is a live rival.

  **Question:** "Sider's argument from vagueness suggests that if endurantism is true, there are vague facts about when an object ceases to exist. You avoid this by accepting temporal parts. But an epistemicist endurantist can just say: 'There is a sharp cutoff for when I cease to exist, we just don't know it.' Does your argument survive if they accept sharp cutoffs but claim ignorance of them?"

  **Follow-up A (If he says: "Yes, because epistemicism about objects is implausible"):**
  "Why is it implausible? We accept sharp cutoffs for 'baldness' or 'heap' on some theories. If the cost of your view is that any random collection of temporal stages constitutes an object (unrestricted composition), isn't that a higher ontological price than accepting we're ignorant of persistence conditions?"

  **Follow-up B (If he says: "No, the argument relies on vagueness in existence, which epistemicism denies"):**
  "So if they go epistemicist, Sider's specific argument falls away. Does that mean you have to fall back on the intrinsics argument? I'm trying to gauge if the vagueness argument is doing heavy lifting for you, or if it's just a supporting pillar."

  ---

  ### 4. Coincidence and Counting (Statue/Clay)
  **Context:** 4Dism solves coincidence by saying Statue and Clay share temporal parts up until the crush. But they diverge later.
  **Consensus Status:** **Contested.** 4Dists generally accept "ontological inflation" (many overlapping objects). Endurantists find this absurd.

  **Question:** "Take the statue and the clay. You say they are distinct worms that share early temporal parts. But consider the moment before the statue is crushed. They occupy the exact same space and share all their current parts. If I ask 'How many objects are on this pedestal?', and the answer is 'Two', what physical difference accounts for that number? Is it just modal properties?"

  **Follow-up A (If he says: "Yes, different modal properties/futures"):**
  "So the count depends on the future? If the statue survives, there was one object. If it gets crushed, there were two? That makes present-day ontology depend on future facts. Are you comfortable with that retroactive metaphysics?"

  **Follow-up B (If he says: "There are actually indefinitely many overlapping worms"):**
  "Because any arbitrary slice defines a new object? If I'm a software engineer, that looks like a memory leak. You're solving the coincidence problem by proliferating objects infinitely. Is that a bug in your theory, or a feature you're happy to ship?"

  ---

  ### 5. Worms vs. Stages (Perdurantism vs. Exdurantism)
  **Context:** Are we the whole worm (Perdurantism) or just the current stage (Exdurantism)?
  **Consensus Status:** **Live Dispute within 4Dism.** Sider prefers Stages; Lewis preferred Worms.

  **Question:** "Within four-dimensionalism, there's a split. Are you the whole spacetime worm, or are you just the current temporal stage of a worm? I need you to pick one, because the costs differ."

  **Follow-up A (If he picks Stages/Exdurantism):**
  "If you're just a stage, then the sentence 'I was a child' is strictly false. You never were a child; a *counterpart* of you was. That means ordinary speech about our own past is systematically false. Is that a cost you're willing to bill to the audience?"

  **Follow-up B (If he picks Worms/Perdurantism):**
  "If you're the whole worm, where are your boundaries? Why does the worm start at conception and not a week before? If you can't specify the boundaries, you face the 'Problem of the Many'—there are thousands of overlapping worms that are almost-you. Which one is the guest on my podcast?"

  ---

  ### 6. The "No Change" Objection
  **Context:** If I am a worm, I don't change. My parts differ.
  **Consensus Status:** **Contested.** This is the classic "Cambridge Change" objection.

  **Question:** "A common objection is that four-dimensionalism eliminates change. If I am a spacetime worm, I don't change from bent to straight. I just have a bent part and a straight part. The worm itself is static. Have you saved the phenomenon of change, or have you explained it away by redefining it as variation across parts?"

  **Follow-up A (If he says: "I've redefined it, and that's sufficient"):**
  "So if my audience goes home and tells their spouse 'I changed my mind,' on your view, they are speaking loosely. There is a static structure where one part has one belief and a later part has another. Does this make 'change' an illusion of perspective, like a movie reel?"

  **Follow-up B (If he says: "No, variation across parts IS change"):**
  "But that's not how we use the word. If a road goes from asphalt to dirt, we don't say the road *changed*, we say it has different sections. If you say I *change*, you're using a different definition than the endurantist. Why should we accept your definition as the metaphysically privileged one?"

  ---

  ### 7. Falsifiability and Defeaters
  **Context:** Metaphysics is often accused of being unfalsifiable.
  **Consensus Status:** **Methodological Dispute.** Most metaphysicians admit their views aren't empirically falsifiable in the scientific sense.

  **Question:** "I want to know what would move you. Not in the abstract, but concretely. Is there a specific intuition, a logical result, or a physical discovery that would force you to abandon four-dimensionalism and return to endurantism?"

  **Follow-up A (If he names something, e.g., "Proof of Presentism"):**
  "Okay, but Presentism is a competing metaphysical thesis, not empirical data. If the evidence has to be another metaphysical argument, aren't we just trading one coherent story for another? Is there any state of the *world* that would falsify your view?"

  **Follow-up B (If he says: "No, it's a conceptual framework"):**
  "So this isn't a claim about how the world is, but how we model it? If it's a modeling choice, why is four-dimensionalism the 'true' model rather than just a useful one? I'm trying to understand if you think you've discovered reality or just a very consistent language for describing it."

  ---

  ### 8. The Software Connection (Event Sourcing)
  **Context:** In software, "Event Sourcing" treats state as a sequence of immutable events (temporal parts).
  **Consensus Status:** **Analogical.** There is no ontological link, but the structural isomorphism is strong.

  **Question:** "I work in software. We have a pattern called 'Event Sourcing' where we don't store the current state of a user, we store a log of every change they've ever made. To see the user 'now,' we replay the log. This maps perfectly to four-dimensionalism. Is this just a useful analogy, or do you think the fact that this model works so well for complex systems suggests it maps onto reality?"

  **Follow-up A (If he says: "It's just an analogy"):**
  "Then why should we trust the metaphysics? If it's just a modeling tool that helps us organize data, why treat it as an ontological commitment? Why not treat endurantism as the 'UI view' (what users see) and 4Dism as the 'Database view' (how it's stored), without claiming the Database view is more real?"

  **Follow-up B (If he says: "It suggests reality is computational/structural"):**
  "If reality is structured like a database log, does that imply the 'temporal parts' exist in the same way the 'current state' does? In our databases, we often delete old logs to save space. If reality does that, does the past cease to exist? I'm trying to see if your metaphysics can handle a universe that prunes its own history."

  ---

  ### Host Notes for the "Consensus" Tags
  *   **Settled:** Means almost all professional metaphysicians agree on the definition or the logical relationship (e.g., Relativity $\neq$ 4Dism). If the guest denies this, they are out of step with the field.
  *   **Contested:** Means there are reputable papers on both sides. If the guest asserts their side as obvious fact here, push back using the "Contested" status. "I've read [Opposing Philosopher] who argues X..."
  *   **Live Dispute:** Means the fight is *within* their own camp (like Worms vs. Stages). This is a great place to press because you aren't attacking their worldview, you're asking them to defend their tribe against their allies.

  ### Final Advice
  Your strength is the "Software Engineer" persona. You care about **implementation costs**. When he gives a metaphysical answer, ask about the **ontological cost**.
  *   "What does that buy us?"
  *   "What do we have to delete from our ontology to make that work?"
  *   "Is that a feature or a bug?"

  This keeps him from floating away into pure abstraction. Good luck.
