answer: |-
  # Activity Design: The Veil & The Variance

  **Objective:** Demonstrate that the "Veil of Ignorance" does not mechanically produce the Difference Principle (Maximin). The outcome depends on specific background conditions (probability knowledge, severity of loss, utility curvature).
  **Budget:** $40 cash (divided into three rounds).
  **Group Size:** 18 participants.
  **Duration:** 90 minutes.

  ## 1. Materials List
  *   **Cash:** $40 in small bills (preferably $1s and $5s).
  *   **Envelopes:** 54 small envelopes (18 per round).
  *   **Ballots:** 54 slips of paper + a collection box.
  *   **Seat Tokens:** 18 numbered poker chips or slips (1–18) in a opaque bag.
  *   **Projection/Whiteboard:** To display the "Policy Menus" for each round.
  *   **Timer:** Visible to all.
  *   **The "Black Box":** A second opaque bag for Round 1 probabilities (see below).

  ## 2. The Payoff Scheme
  You are running three independent rounds. Each round has its own sub-pot of money. The group votes on a **Distribution Policy** for that pot. After the vote, seats are drawn. Payoffs are calculated per round and summed for each individual at the end.

  *   **Round 1 Pot:** $15
  *   **Round 2 Pot:** $15
  *   **Round 3 Pot:** $10
  *   **Total:** $40

  **Crucial Rule:** Once a policy is voted in, it is binding. Seat assignment happens *after* the vote. If the policy assigns you $0, you get $0. You cannot opt out after seeing your seat number.

  ## 3. Timeline (90 Minutes)

  | Time | Segment | Action |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Contract** | Explain rules. Emphasize binding commitment. No theory yet. |
  | **10–25** | **Round 1** | "The Opaque Urn." Vote -> Draw -> Record. |
  | **25–40** | **Round 2** | "The Fair Coin." Vote -> Draw -> Record. |
  | **40–55** | **Round 3** | "The Safety Net." Vote -> Draw -> Record. |
  | **55–65** | **Settlement** | Calculate totals. Hand out cash. Allow grumbling. |
  | **65–90** | **Debrief** | Reveal the toggles. Map to Rawls/Harsanyi. Discuss limits. |

  ---

  ## 4. The Rounds (The Silent Toggles)

  Display the menu on the board. Do **not** explain the philosophy. Read only the mechanical conditions.

  ### Round 1: The Opaque Urn (Rawlsian Conditions)
  *   **Pot:** $15.
  *   **Condition:** "The mechanism determining your seat is opaque. We do not know the distribution of winning vs. losing seats. It could be 50/50, it could be 1/17. There is a non-zero chance that *everyone* loses."
  *   **Policy Menu:**
      *   **A (Equality):** Every player receives $0.83. (Total $15 distributed evenly).
      *   **B (Gamble):** 50% of players receive $1.66, 50% receive $0. (Expected Value: $0.83).
      *   **C (Lottery):** 1 player receives $15, 17 players receive $0. (Expected Value: $0.83).
  *   **Expected Outcome:** **A wins.** The unknown probability + catastrophic zero triggers Maximin.

  ### Round 2: The Fair Coin (Harsanyi Conditions)
  *   **Pot:** $15.
  *   **Condition:** "The mechanism is transparent. Exactly 9 seats are winners, 9 are losers. The draw is fair. Every player has exactly a 50% chance."
  *   **Policy Menu:**
      *   **A (Equality):** Every player receives $0.83.
      *   **B (Growth):** 50% receive $1.20, 50% receive $0.50. (Expected Value: $0.85). *Note: Slightly higher EV than A.*
      *   **C (Lottery):** 1 player receives $15, 17 players receive $0.
  *   **Expected Outcome:** **B wins (or close split).** Known probabilities + higher EV makes Average Utilitarianism rational. Maximin looks irrational here.

  ### Round 3: The Safety Net (Risk-Tolerance Conditions)
  *   **Pot:** $10.
  *   **Condition:** "Transparent mechanism (50/50 split). **However**, any player who ended Round 1 and 2 with $0 is guaranteed $0.50 from this pot before the split."
  *   **Policy Menu:**
      *   **A (Equality):** Every player receives $0.55.
      *   **B (High Variance):** 50% receive $1.50, 50% receive $0. (But the '0' group gets the safety net guarantee).
  *   **Expected Outcome:** **B wins.** The downside is buffered. The "catastrophe" is removed. Risk-taking becomes rational.

  ---

  ## 5. Execution Script (Key Moments)

  **The Contract (Minute 5):**
  > "We are putting $40 on the table. In each round, you will vote on how to distribute that round's money. Once you vote, I will draw seat numbers. If the policy you voted for assigns your seat $0, you get nothing. You cannot quit after the draw. If you refuse to honor the loss, you leave the meetup and forfeit any winnings. Do we agree?"
  > *(Get verbal confirmation. This prevents the "just kidding" opt-out.)*

  **The Ballot (Each Round):**
  > "Write A, B, or C. Fold it. Put it in the box. No talking about your choice. If you calculate EV, do it silently on paper. If you announce numbers to influence the room, I will disqualify your vote."
  > *(This neutralizes the "EV Guy" who wrecks the epistemic veil by shouting calculations.)*

  **The Draw:**
  > Have a neutral party (or you) draw the 18 seat numbers from the bag and hand them out face down. Players reveal simultaneously.

  **The Settlement (Minute 60):**
  > Pay out individually. Hand them the cash.
  > *Script:* "Here is your total. Count it. If you got $0 in a round, that's gone."
  > *(Let the room breathe. Let the people who lost complain. Let the people who won feel guilty or smug. This emotional residue is data.)*

  ---

  ## 6. The Debrief (Minute 65–90)

  Do not lecture. Ask questions. Write their answers on the board.

  **Step 1: The Data**
  *   "Round 1, who voted A? (Show of hands). Round 2, who voted A?"
  *   "Who changed their mind between 1 and 2?"

  **Step 2: The Why**
  *   "Round 1 and Round 2 had the same money on the table. Why did the vote shift?"
  *   *Target Answer:* "In Round 1 we didn't know the odds."
  *   *Label:* **Knightian Uncertainty.** "Rawls argues the Veil requires this. If you know the odds, you're not behind a thick veil, you're just gambling."

  **Step 3: The Harsanyi Pivot**
  *   "In Round 2, you knew the odds were 50/50. Most of you picked B (Higher Average). Why not A (Equality)?"
  *   *Target Answer:* "Because the EV was higher." / "Because $0.50 isn't starvation."
  *   *Label:* **Average Utilitarianism.** "Harsanyi's objection: If you are rational and know the probabilities, you maximize expected utility, not the minimum."

  **Step 4: The Utility Function**
  *   "Round 3, why did B win more decisively?"
  *   *Target Answer:* "Because the losers got a保底 (floor)."
  *   *Label:* **Marginal Utility.** "Rawls assumes the 'floor' is vital (liberties, self-respect). If the floor is just candy money, you gamble. If the floor is 'starvation,' you don't."

  **Step 5: Naming**
  *   Now introduce the terms: *Original Position, Difference Principle, Maximin Rule.*
  *   "Rawls isn't saying humans are naturally risk-averse. He's saying the *justification* for society's basic structure requires assuming you don't know the odds and that the downside is intolerable."

  ---

  ## 7. Failure Modes & Mitigation

  **1. The "Shut Up and Multiply" Guy**
  *   *Risk:* He calculates EV out loud in Round 1 ("Guys, C has the same EV as A...").
  *   *Mitigation:* The "Silent Ballot" rule enforced strictly. If he speaks, warn him once. Second time, his vote is discarded. Tell him: "Your job is to feel the uncertainty, not solve it."

  **2. The "It's Just Candy" Defector**
  *   *Risk:* Someone loses Round 1, gets $0, and says "This is stupid, just split it evenly."
  *   *Mitigation:* The Contract (see above). If they refuse, they forfeit *all* rounds. Usually, social pressure holds. If they truly rage-quit, let them leave. The pain of their exit proves the point (binding commitments are hard).

  **3. The Mood Sours**
  *   *Risk:* People feel genuinely ripped off.
  *   *Mitigation:* Keep the stakes low enough that $0 is annoying, not ruinous. $40 total means max loss is ~$5. In the debrief, validate the feeling: "That anger you feel? That's why we have politics. If we could just agree on EV, we wouldn't need justice."

  **4. Time Creep**
  *   *Risk:* Voting takes too long.
  *   *Mitigation:* Hard stop at Minute 55 for voting. If a round isn't voted on, you (the facilitator) pick the utilitarian default (B) for that round. Tell them this at the start.

  **5. The "Rigged" Accusation**
  *   *Risk:* They think you manipulated the seat draw.
  *   *Mitigation:* Let a participant shuffle the bag and draw the seats. You handle the money only.

  ---

  ## 8. Honest Limitations (For the Debrief)

  End the night by deflating the experiment's authority. This prevents the Bayesians from feeling "refuted" and the Rawlsians from feeling "vindicated."

  **Say this:**
  1.  **"This isn't the Original Position."** In the real Original Position, you don't know your psychology. Tonight, you all knew you were risk-averse or risk-seeking rationalists. You couldn't strip that away.
  2.  **"This isn't the Basic Structure."** We were splitting $40, not designing rights, liberties, and economic systems. The "catastrophe" of $0 here is trivial. Rawls is concerned with the catastrophe of slavery or destitution.
  3.  **"Bayesians aren't wrong."** If Harsanyi is right, and we *can* know probabilities, Average Utilitarianism is the rational choice. Rawls only wins if you accept his premise that social probabilities are fundamentally unknowable.
  4.  **"The Point."** The goal wasn't to prove Rawls right. It was to show that the Veil doesn't do magic. It only produces the Difference Principle if you load it with specific assumptions about uncertainty and loss.

  **Closing:**
  "Next month, we argue about whether those assumptions are true. Tonight, you just felt what they cost."
