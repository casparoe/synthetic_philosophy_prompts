answer: |-
  Chair, founders, members of the credit union, and neighbours.

  We gather to open a house for money. But before we speak of money, we must ask what it is for. We are told that wealth is a thing to be stored. We are told that scarcity is a lack of coin. I propose we test these ideas against the reality of this town. I ask you to consider the following questions:

  1. Whether the wealth of this parish lies in the gold in a vault or the work done in a day?
  2. Is there not more skill in this hall than there is coin in the bank?
  3. Whether a man out of work is poor because he lacks money, or because he lacks a chance to trade his labour?
  4. Can paper not circulate where metal refuses to move?
  5. Whether trust between neighbours is not a stronger security than a deed to land?
  6. Is it not better to lend on the knowledge of a man's character than on the value of his field?
  7. Whether an institution owned by its members does not bind them closer than one owned by distant shareholders?
  8. Can we not set our own labour in motion without waiting for permission from outside?

  These are not rhetorical tricks. They are the practical questions that built this institution. They reflect the thinking of an eighteenth-century bishop who studied Irish economics, George Berkeley. He argued that money is not wealth itself. It is a ticket. It is a contrivance designed to set labour in motion. A coin has no use until it passes from one hand to another to pay for work. If the work is not there, the coin is useless. If the work is here, but the coin is hidden, the town starves.

  We know the pain of that scarcity. When the medical-devices plant closed, thirty families lost more than a wage. They lost the occasion to exchange their skill for the goods of the parish. The money stopped moving because the work stopped happening. But the skill did not vanish. The need for repairs, for building, for care, and for supplies remains. The genuine scarcity in a depressed place is not of coin, but of occasions to work and to exchange. This credit union exists to create those occasions.

  Berkeley argued that paper issued on good security by an institution the public trusts can perform the work of specie better than specie itself. Gold is heavy and it hides. Paper moves. But it must be backed by something real. In the old days, banks lent on land. They lent on acreage. This credit union is different. Your security is not land. It is your own shares. It is the fact that everybody in the parish knows whether everybody else works. We do not need a deed to know a neighbour is honest. We do not need a valuation to know a neighbour is industrious. That local knowledge is the collateral. It is stronger than any mortgage because it is renewed every day in the street and in the shop.

  This trust allows us to keep the wheels turning. When a member borrows to fix a roof or buy tools, they are not taking money out of the town. They are borrowing the capacity of the town to work. They are paying a neighbour to labour. The money returns to the credit union when the job is done. The labour remains. The roof is fixed. The tool produces value. This is how we set labour in motion without waiting for outside permission.

  However, we must heed the warning history provides. Berkeley kept a cautionary case in view. He studied a paper-money scheme in France that collapsed. It failed because the bills outran the security standing behind them. They printed tickets for work that did not exist. We must not make that error. We must not lend beyond what our shares and our mutual knowledge can support. If we issue credit without the backing of real labour and real repayment, we break the trust that makes this paper valuable. Prudence is not the enemy of generosity. It is the guardian of it.

  The founders here, the retired principal, the farmers, and the publican who kept the books informally, understood this. They knew that waiting for a distant bank to understand this town was a waste of time. The County Councillor secured the premises, but you secure the capital. The youth savings scheme shows that the next generation understands this too. They are learning that saving is not hoarding, but storing power for future work.

  We are not here to celebrate a building. We are here to activate a mechanism. The history of economic thought is full of theories that died in libraries. This institution is a theory put to work. It accepts that money is a tool for exchange, not a treasure to be hid. It accepts that security lies in people, not just in property. It accepts that the wealth of the west coast is not what we export, but what we do for one another.

  So let the records show that this union was opened not on the promise of external investment, but on the security of local character. Let the thirty members who seek work find here the occasions to trade. Let the youth find here the habit of thrift. And let this town prove that when labour is sure of finding something to do, and someone nearby to buy it, the money will follow. The institution is yours. The labour is yours. The motion begins now.

  ***

  **Note on the handling of Berkeley's "National Character" thesis:**
  Berkeley's *Querist* frequently attributes Irish poverty to the supposed idleness, dietary choices, and consumption habits of the Irish poor (e.g., wearing wool instead of exporting it, eating potatoes instead of trading). To avoid blaming the unemployed members in the room, I shifted the locus of the problem from the *character of the worker* to the *absence of the mechanism for exchange*. The speech frames the plant closure as an external removal of the "occasion to work," rather than an internal failure of industry. The Credit Union is presented as restoring the *circulation* that allows existing industry to function, thereby utilizing Berkeley's structural insight (money moves labour) while discarding his moralizing critique of the Irish poor.
