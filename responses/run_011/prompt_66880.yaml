      *Brief:* This checklist serves as an operational tool for state bodies determining whether to issue an official apology for historical wrongs. It is not a historical taxonomy but a functional guide. To clear this brief, the framework must handle intergenerational liability, dissenting citizenship, and the mechanics of repair without relying on metaphysical claims about collective emotion. Success is defined by usability: a committee must be able to tick boxes and identify logical failures before drafting text. It must expose contradictions rather than smooth them over.

