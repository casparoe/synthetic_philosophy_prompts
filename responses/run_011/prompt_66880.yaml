answer: |-
  - **The brief**
  This checklist serves as an operational tool for state bodies determining whether to issue an official apology for historical wrongs. It is not a historical taxonomy but a functional guide designed for practical application. To clear this brief, the framework must handle intergenerational liability, dissenting citizenship, and the mechanics of repair without relying on metaphysical claims about collective emotion. Success is defined by usability: a committee must be able to tick boxes and identify logical failures before drafting text. It must expose contradictions rather than smooth them over, ensuring that any resulting statement is coherent enough to withstand political and moral scrutiny without collapsing under its own ambiguities.

  - **The requirements**
  1. **Agency Continuity:** The state must be treated as a persistent moral agent distinct from its current administration. *Case:* A government apologising for acts committed by founders it politically opposes. *Tag:* Non-negotiable. Without this, the state dissolves into successive regimes, making historical accountability impossible as each new administration disowns the past.
  2. **Recipient Validity:** The framework must specify who holds the authority to accept the apology. *Case:* Victims are dead, missing, or refuse acceptance; descendants claim the right. *Tag:* Non-negotiable. An apology offered into the void lacks a completed speech act; if there is no one competent to receive it, the transaction fails.
  3. **Dissenting Citizenship:** It must clarify if the apology binds citizens who deny the wrong occurred. *Case:* The citizen who rejects the state's moral assessment. *Tag:* Negotiable. This is political authorisation, not moral validity, but affects domestic stability. The state may speak without unanimous consent, but the cost of dissent must be acknowledged.
  4. **Iterative Capacity:** The theory must allow for apologies regarding previous failed apologies. *Case:* A prior apology was conditional, walked back, or disowned by successors. *Tag:* Non-negotiable. States evolve; remediation of failed speech must be possible without resetting the clock to zero, allowing for correction of previous insincerity.
  5. **Liability Admission:** The wording must distinguish between regretting an event and accepting responsibility for it. *Case:* 'Sorry this happened' versus 'We did this'. *Tag:* Non-negotiable. Passive construction voids the apology of agency. If the state does not name itself as the cause, it offers sympathy, not apology.
  6. **Claim Finality:** It must determine if the apology closes off further legal or moral claims. *Case:* Apology as part of a settlement deal. *Tag:* Negotiable. Legal finality often conflicts with moral openness. A committee must decide if this act ends the debate or opens a new chapter of accountability.
  7. **Material Correlate:** The framework must decide if resource transfer is intrinsic to the apology. *Case:* The mate's condition that giving something up is required. *Tag:* Negotiable. This conflates apology with reparations, though they often accompany each other. Words can be valid without payment, but empty words lack force.
  8. **Frequency Durability:** It must address whether serial apologies devalue the currency of remorse. *Case:* States issuing dozens of apologies over years. *Tag:* Negotiable. Sincerity is not a finite resource, but public trust is. Repetition without action breeds cynicism, suggesting the act is merely procedural.

  - **Prejudices, not requirements**
  Several demands often appear in public discourse but must be excluded from an operational checklist. First, 'collective sincerity' as an internal emotional state is metaphysically incoherent for corporate agents; only consistent action matters. Second, unanimous public support is impossible and undesirable; states must sometimes act against majority opinion to correct injustices. Third, perfect historical consensus is a barrier to action; history is contested, and waiting for agreement ensures nothing is ever addressed. Finally, the demand for a single, perfect statement ignores the iterative nature of political repair. Including these would render the checklist unusable, demanding psychological states from institutions or veto powers from dissenters.

  - **Pairs that can't both hold**
  Two critical incompatibilities emerge. First, **Claim Finality vs. Ongoing Wrong.** Your mate insists an apology fails if the state continues a version of the wrong. Yet, legal settlements (Claim Finality) often require closing claims to ensure stability. You cannot simultaneously close the book on liability while admitting the structural harm persists. Second, **Dissenting Citizenship vs. Agency Continuity.** If every citizen must authorise the apology for it to be 'theirs' (Dissenting Citizenship), the state cannot act as a continuous agent (Agency Continuity). The state must speak for the polity even when the polity disagrees, otherwise, no historical responsibility can ever be shouldered by a democracy. These tensions cannot be resolved, only managed.

  - **The heavyweight**
  The requirement that does the most work is **Liability Admission**. Most popular accounts of state apology fail here because they allow 'regret' to substitute for 'responsibility'. Governments prefer expressing sorrow for suffering caused without admitting causal agency. This requirement knocks out the vast majority of actual historical apologies, revealing them as expressions of sympathy rather than accounts of fault. It forces the committee to decide if they are accepting blame or merely observing tragedy. Without this distinction, the apology is merely a press release, as your mate fears, but not because it lacks cost; because it lacks truth.

  - **Where that leaves the costed-apology view**
  Your mate's condition is a disguised restatement of **Material Correlate**, but it conflates apology with reparations. While repair is necessary for justice, it is not strictly necessary for the speech act of apology to be valid. However, his second condition—that the wrong must not be continuing—is a valid critique of **Claim Finality**. If the state continues the harm, the apology is performative contradiction. Therefore, the 'cost' element is prejudice (confusing repair with remorse), but the 'ongoing wrong' element is a genuine requirement for consistency. He is half-right, but for the wrong reasons.
