      *   *Pattern:* $P \land \neg B(P)$ or $B(P) \land \neg P$ (where $B$ is belief/assertion commitment).
      *   *Camp A View:* Logical Contradiction ($P \land \neg P$). They see the assertion as claiming truth and the disavowal as claiming non-truth.
