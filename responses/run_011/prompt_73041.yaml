  # The Construction Diagnostic Instrument

  ### Branch Questions

  **Node 1 (Vignette A):** Regarding the child raised without race vocabulary: Does the child belong to a racial group even if no one around them knows the name for it?
  *   [Yes] → Go to Node 2
  *   [No] → Go to Node 3
  *   [Split] → Go to Node 4

  **Node 2 (Vignette A):** If we changed the vocabulary tomorrow but kept the treatment the same, would the group cease to exist?
  *   [Yes] → Go to Node 5
  *   [No] → Go to Node 6
  *   [Split] → Go to Node 7

  **Node 3 (Vignette C):** Regarding the diagnosis whose incidence rises after publicity: Is the original definition of the condition now incorrect?
  *   [Yes] → Go to Node 8
  *   [No] → Go to Node 9
  *   [Split] → Go to Node 10

  **Node 4 (Vignette D):** Regarding the abolished title: Did the social status survive the abolition of the law?
  *   [Yes] → Go to Node 11
  *   [No] → Go to Node 12
  *   [Split] → **Leaf: General Conferralism**

  **Node 5 (Vignette B):** Regarding the currency stripped of legal status: Is the stuff circulating in the border town still money even though the state says it isn't?
  *   [Yes] → **Leaf: Conservationism about Race**
  *   [No] → **Leaf: Eliminativism about Race**
  *   [Split] → **Leaf: Realism about Race as a Social Kind**

  **Node 6 (Vignette B):** Is the material itself valuable enough to explain why people take the currency?
  *   [Yes] → **Leaf: Money as Commodity**
  *   [No] → Go to Node 7

  **Node 7 (Vignette B):** Did debt relationships exist before coins or paper money were invented?
  *   [Yes] → **Leaf: Money as Credit and Debt Relations**
  *   [No] → **Leaf: Money as a State-Defined Unit**

  **Node 8 (Vignette C):** If the incidence rises, has the world changed rather than the definition?
  *   [Yes] → **Leaf: Gender as Produced Through Repeated Practice**
  *   [No] → **Leaf: Gender as Norm-Guided Self-Identification**
  *   [Split] → **Leaf: Gender as a Position Within a Material Structure**

  **Node 9 (Vignette D):** Is there still a specific job or place the former title holders are expected to fill?
  *   [Yes] → **Leaf: Gender as a Position Within a Material Structure**
  *   [No] → **Leaf: Gender as Norm-Guided Self-Identification**
  *   [Split] → **Leaf: Gender as Produced Through Repeated Practice**

  **Node 10 (Vignette A):** Should we stop using the category entirely if it turns out to have no biological basis, even if it predicts life outcomes?
  *   [Yes] → **Leaf: Eliminativism about Race**
  *   [No] → **Leaf: Conservationism about Race**
  *   [Split] → **Leaf: Realism about Race as a Social Kind**

  **Node 11 (Vignette D):** Is the deference shown because of a remaining role, or just old habit? (Answer "Role" as Yes, "Habit" as No)
  *   [Yes] → **Leaf: Gender as a Position Within a Material Structure**
  *   [No] → **Leaf: Money as a Status Collectively Accepted**
  *   [Split] → **Leaf: General Conferralism**

  **Node 12 (Vignette C):** Does the act of naming the condition change the condition itself?
  *   [Yes] → **Leaf: Gender as Produced Through Repeated Practice**
  *   [No] → **Leaf: Money as a Status Collectively Accepted**
  *   [Split] → **Leaf: General Conferralism**

  *(Note: The branching logic above is simplified for text presentation; in practice, the participant follows the path dictated by their intuitions on the vignettes. The leaves are reached by specific combinations of answers that align with the axes.)*

  ### Leaves and Profiles

  1.  **Eliminativism about Race**
      *   *Explanatory Work:* Takes racial categories to be errors that obscure more real biological or individual facts.
      *   *Awkward Commitment:* Must explain why life outcomes remain patterned despite the category being false.

  2.  **Conservationism about Race**
      *   *Explanatory Work:* Takes racial categories to be durable tools for tracking social treatment and history.
      *   *Awkward Commitment:* Must explain how the category persists without reinforcing the very hierarchy it describes.

  3.  **Realism about Race as a Social Kind**
      *   *Explanatory Work:* Takes race to be a real feature of the social world, grounded in relations rather than biology.
      *   *Awkward Commitment:* Must explain how something real can vanish if social relations change.

  4.  **Gender as a Position Within a Material Structure**
      *   *Explanatory Work:* Takes gender to be a place in a hierarchy of power and resource distribution.
      *   *Awkward Commitment:* Struggles to account for gendered experiences that do not map onto economic power.

  5.  **Gender as Produced Through Repeated Practice**
      *   *Explanatory Work:* Takes gender to be an effect generated by ongoing stylized actions.
      *   *Awkward Commitment:* Must explain the feeling of an inner identity that precedes the action.

  6.  **Gender as Norm-Guided Self-Identification**
      *   *Explanatory Work:* Takes gender to be a matter of aligning one's self-concept with available social norms.
      *   *Awkward Commitment:* Must explain why self-identification is sometimes constrained by external perception.

  7.  **Money as a Status Collectively Accepted**
      *   *Explanatory Work:* Takes money to be a function enabled by shared agreement to treat something as valuable.
      *   *Awkward Commitment:* Must explain why agreement alone sometimes fails without coercive backing.

  8.  **Money as a State-Defined Unit of Account**
      *   *Explanatory Work:* Takes money to be a creature of law, sustained by the demand to settle tax liabilities.
      *   *Awkward Commitment:* Must explain the border town currency that works without state backing.

  9.  **Money as a Commodity**
      *   *Explanatory Work:* Takes money to be a good elevated to medium of exchange by its comparative saleability.
      *   *Awkward Commitment:* Must explain the value of fiat currency with no material worth.

  10. **Money as Credit and Debt Relations**
      *   *Explanatory Work:* Takes money to be a measure of obligation predating any physical medium.
      *   *Awkward Commitment:* Must explain why physical cash is often preferred to credit in crises.

  11. **General Conferralist Account**
      *   *Explanatory Work:* Takes social kinds to be properties granted by others through attitudes or actions.
      *   *Awkward Commitment:* Must explain why some conferred statuses feel involuntary to the holder.

  12. **Role-Based Account (Hybrid)**
      *   *Explanatory Work:* Takes social kinds to be regulated by prevailing cultural representations of function.
      *   *Awkward Commitment:* Must explain what happens when cultural representations contradict institutional rules.

  ---

  ### Vignette Analysis

  **Vignette (a) [Child without vocabulary]:**
  *   *Same Answer:* **Realism about Race**, **Conservationism**, and **Gender as Position** all answer "Yes" (the group/position exists without the name).
  *   *Divergence:* **Eliminativism** and **Gender as Self-ID** answer "No" (the concept is required for the kind).
  *   *Indistinguishable Pair:* **Realism about Race** and **Gender as Position** yield the same answer here. This is a genuine convergence: both posit a material or relational reality independent of immediate vocabulary.

  **Vignette (b) [Currency without legal tender]:**
  *   *Same Answer:* **Money as Commodity**, **Money as Credit**, and **Money as Status** all answer "Yes" (it is still money).
  *   *Divergence:* **Money as State-Defined** answers "No".
  *   *Indistinguishable Pair:* **Money as Credit** and **Money as Status** cannot be separated by this vignette alone. This is a defect of the question set; both rely on social relation rather than state decree, requiring Node 7 (history of debt) to distinguish them.

  **Vignette (c) [Psych diagnosis incidence]:**
  *   *Same Answer:* **Gender as Produced** and **General Conferralism** answer "Yes" (naming changes the thing).
  *   *Divergence:* **Eliminativism** and **Money as Commodity** answer "No" (the thing is static).
  *   *Indistinguishable Pair:* **Gender as Produced** and **General Conferralism** yield the same answer. This is a genuine convergence; conferralism is the metaphysical ground for performativity.

  **Vignette (d) [Abolished title]:**
  *   *Same Answer:* **Gender as Position** and **Conservationism** answer "Yes" (status survives law).
  *   *Divergence:* **Money as State-Defined** and **Eliminativism** answer "No".
  *   *Indistinguishable Pair:* **Gender as Position** and **Conservationism** cannot be separated here. This is a genuine convergence; both treat social kinds as resilient to institutional withdrawal.

  ---

  ### The Logical Space

  The twelve nodes permit $3^{12}$ answer combinations (roughly 530,000 profiles), yet only twelve leaves are occupied. The unoccupied cells represent logically possible but theoretically unstable or unattractive positions.

  **Unoccupied Cell 1: [Yes to Node 1, Yes to Node 5, Yes to Node 11]**
  *   *Profile:* Believes race exists without vocabulary, survives vocabulary change, but should be eliminated if non-biological.
  *   *Diagnosis:* **Incoherence.** If the kind exists independently of vocabulary and biology (Node 1 & 2), eliminating it because it lacks biology (Node 11) contradicts the initial realism. It asserts the thing is real but should be ignored because it isn't the *wrong kind* of real.

  **Unoccupied Cell 2: [No to Node 3, Yes to Node 8]**
  *   *Profile:* Believes naming does not change the condition, but the world changed rather than the definition.
  *   *Diagnosis:* **Instability under pressure.** If the world changed (incidence rose) but the definition didn't, then the definition failed to track the world. Holding both that the definition is correct (Node 3 No) and the world changed (Node 8 Yes) implies the diagnosis is both right and wrong.

  **Unoccupied Cell 3: [Yes to Node 4, No to Node 7, Yes to Node 12]**
  *   *Profile:* Believes status survives law, money is not credit, but naming changes conditions.
  *   *Diagnosis:* **Explanatory Unattractiveness.** This view accepts social resilience (Node 4) and reactivity (Node 12) but denies the relational mechanism of money (Node 7). It posits a social world that changes and persists without underlying relations of debt or conferral, leaving the mechanism of construction unexplained.

  **Unoccupied Cell 4: [Split on Node 1, Split on Node 2, Split on Node 3...]**
  *   *Profile:* Principled split on every node.
  *   *Diagnosis:* **Neglect.** This is the "It Depends" theorist.
      *   *Sketch:* A pragmatic pluralist who argues that race is biological in medical contexts, social in historical contexts, and eliminable in political contexts. They occupy the cell of context-sensitive realism, refusing a unified metaphysics in favor of domain-specific utility.

  **Unoccupied Cell 5: [No to Node 1, No to Node 3, No to Node 5]**
  *   *Profile:* Nothing exists without vocabulary, naming changes nothing, currency needs state.
  *   *Diagnosis:* **Political Unattractiveness.** This is a rigid positivist institutionalism. It denies the reality of oppressed groups without vocabulary, denies the feedback loop of stigma, and denies informal economies. It is rarely held because it invalidates too much lived experience.

  ---

  ### Self-Criticism

  **Misfiled Kind:** Disability.

  **Diagnosis:** The tree misfiles disability because it forces a choice between "medical/biological basis" (Node 11) and "social construction" (Node 1/2). Disability often involves a material impairment (biological) that is only disabling due to social arrangement (construction). The tree treats these as mutually exclusive paths.

  **Rewrite:** Node 11 should be rewritten to accommodate the interaction model.
  *   *Current:* "Should we stop using the category entirely if it turns out to have no biological basis...?"
  *   *Revised:* "If the biological impairment remained but the social barriers vanished, would the category still apply?"
  *   *Effect:* This allows a participant to affirm the biological reality of the impairment while affirming the social construction of the *disability*, routing them to a leaf that acknowledges both material constraint and social exclusion, rather than forcing them into Eliminativism or pure Social Realism.
