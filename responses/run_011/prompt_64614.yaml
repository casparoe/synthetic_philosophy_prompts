  4.  **Writing - Focus on Sensory Details:**
      *   Dust, heat, the sound of washing machines.
      *   The physical sensation of the "Binding" (a tightness in the chest, a nausea when lying).
      *   The look in the eyes of the people in line.

  5.  **Refining the Philosophy:**
      *   Don't explain *why* the binding works. Just show the twitch, the sweat, the inability to turn the doorknob.
      *   The "IOU" system needs to feel like a trap.

  6.  **Drafting - Step-by-Step:**
      *   *Opening:* The heat. The line. The laundromat front.
