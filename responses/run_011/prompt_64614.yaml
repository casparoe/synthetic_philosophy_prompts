answer: |-
  The heat in the valley didn't rise; it settled, like dust in a closed room. It pressed against the plate glass of the laundromat front, blurring the street outside into a shimmering gray smear. Inside, the air smelled of ozone, stale detergent, and the copper tang of old blood.

  Mara sat behind the intake desk. She didn't look at the people in line. She looked at their hands. Hands told the truth when mouths didn't. Tremors in the fingers meant withdrawal or fear. Calluses on the palms meant labor, which meant they had something to lose. Clean, soft hands meant they were already planning to run the second they hit the city limits.

  The man in front of her was sweating through a shirt that had once been white. He slid a paper across the laminate. An IOU. Standard terms. Payment due upon the first full moon after the procedure.

  "I mean it," he said. His voice was dry, cracking like the earth outside. "I swear on my mother's grave."

  Mara didn't look up. "Your mother's in the crypt up north. Ground's too hard to dig down here."

  He flinched. "I'll pay. I just need to be... I need to be the kind of man who stays."

  "You're the kind of man who says he stays," Mara said. She picked up the IOU. It felt light. Worthless. "We don't take paper from people who shake."

  "I'm not shaking."

  "You are. Left hand. Index finger. It's tapping a rhythm against your thigh. You're counting the seconds until I say no so you can bolt."

  He stopped tapping. He leaned in, desperation stripping the polish off his voice. "Please. My wife. She can't trust me. I drink, I leave, I come back empty. Fix me. I'll work it off. I'll do anything."

  Mara looked at him then. She saw the hollows under his eyes, the genuine terror of a man watching his own life dissolve. He needed the Binding more than air. That was the problem. The Outfit didn't sell salvation to the drowning; they sold it to the swimmers who wanted to learn to fly. If you needed the compulsion to keep your word, you were incapable of promising you'd pay for it. It was a lock that required a key you couldn't hold until the door was already open.

  "Get out," Mara said.

  "I can't—"

  "The heat's better than what happens when you miss a payment. Go."

  He stood there for a long moment, the silence stretching tight between them. Then he turned and walked out into the glare. She watched him through the glass until he was just a distortion in the air, walking nowhere.

  Mara filed the IOU in the reject bin. She rubbed her own left hand. It was steady. It had to be. Three months ago, she had sat where he sat. She had promised Mr. Venn, the Manager, that she would work the desk for five years in exchange for the cut. Venn had looked at her for four seconds, nodded, and told her to roll up her sleeve.

  He had seen something in her face. Maybe it was that she was a skip tracer. She had spent ten years hunting people who broke promises. Maybe she was just tired of the chase. Or maybe, when she made that promise to Venn, she had finally found one thing she wanted more than the option to run.

  Now, the Binding sat at the base of her skull, a small, hard knot of scar tissue and wire. It hummed when she lied. It burned when she hesitated.

  She stood up and locked the front door. Flipped the sign to *Closed*.

  Venn was waiting in the back room, amidst the stacks of folded towels and the humming industrial dryers. He was peeling an orange, the scent cutting through the smell of lint.

  "Hard day?" he asked.

  "Standard," Mara said. "Three rejections. One almost."

  "The almosts are the dangerous ones," Venn said. He offered her a segment of orange. She took it. The citrus was sharp, acidic. "We have a retrieval. High priority."

  He slid a folder across the metal table. A photograph clipped to the top. A young woman, dark hair, eyes looking somewhere to the left of the lens.

  "Elara Vance," Venn said. "Ran out on a contract with a transport firm in the sector. Took a truck full of water filters. We need her back. Alive."

  Mara opened the folder. The details were sparse. Last known location: the Old Quarry settlement. Two days ride.

  "I'll bring her in," Mara said.

  She felt the familiar tug at the base of her skull. A gentle pressure, like a hand guiding her head. *I will bring her in.* She had made the promise. The Binding accepted it. Her body relaxed, the tension draining out of her shoulders. As long as she kept the word, the pain stayed away.

  "You know the terms," Venn said softly. "No side deals. No bargaining. You bring her here. That's the promise."

  "That's the promise," Mara repeated.

  She took the bike out at dusk, when the heat broke just enough to let the engine breathe. The ride to the Quarry was two hours of grinding gears and dust. She knew the terrain. She knew the types who hid out there. People who couldn't make the cut at the laundromat. People who chose the drought over the Binding.

  She found Elara in a shack made of corrugated iron and scrap wood. The girl was packing a bag when Mara kicked the door open.

  Elara didn't scream. She just froze, a canteen in her hand. She looked at Mara's jacket, the insignia of the Outfit stitched on the shoulder.

  "They sent a tracer," Elara said. Her voice was steady, but her eyes were wide. "I didn't think they'd come this far."

  "Get up," Mara said.

  "I can't go back." Elara set the canteen down. "The transport firm... they don't pay. They take the water, they take the credits, they leave you with the debt. I stole the filters to feed my brother. He's sick. The heat stroke took his mind."

  Mara stepped into the room. The dust motes danced in the single beam of light. "That's not my problem."

  "It should be." Elara moved closer. She wasn't begging. She was calculating. "You're Bound. I can see it. The twitch in your neck. You can't lie to me. So listen. If you take me back, Venn sells the filters. He doesn't give the credits to the firm. He keeps them. My brother dies. I die in a cell."

  Mara's hand hovered near her holster. The knot at her skull pulsed. A warning. *Stick to the plan.*

  "I have a deal for you," Elara said. She reached into her shirt and pulled out a data chip. "This isn't just water routes. This is Venn's ledger. The real one. The one where he tracks the IOUs he knows won't be paid. He doesn't want the money. He wants the labor. He wants the Bound. He's building an army of people who can't say no."

  Mara's breath hitched. She had suspected. Everyone suspected. But suspicion wasn't proof.

  "Give me the chip," Mara said. "And I let you go."

  The words hung in the air.

  The pain hit her instantly. It wasn't a sharp stab; it was a crushing weight, like a vice tightening around her brainstem. Her vision blurred. Her knees buckled. She gasped, clutching the doorframe.

  *I'll bring her in.* That was the promise.

  "I can't," Mara choked out. Sweat poured down her face. The Binding didn't care about justice. It didn't care about Venn's cruelty. It cared about the syntax of the vow. *Bring her here. Alive.*

  "If you take me back, you're helping him," Elara said. She held the chip out. "Take this. Expose him. You can be free."

  Mara straightened. The pain receded to a dull, throbbing ache. She looked at the chip. It was small, silver, glittering in the dim light. It was freedom. It was vengeance. It was the end of the Outfit.

  It was also a breach of contract.

  "I promised," Mara whispered.

  "To who? A monster?"

  "To the word," Mara said. She stepped forward. The movement was jerky, mechanical. Her body was overriding her mind. The Binding ensured compliance. It didn't ensure loyalty. It didn't ensure morality. It ensured consistency.

  She reached out and took Elara's arm. The girl struggled, but Mara was stronger, and Mara was driven by a force that didn't tire.

  "I'm sorry," Mara said.

  "You're not," Elara spat. "You're just empty."

  The ride back was silent. Elara didn't fight. She just stared at the back of Mara's head, at the scar hidden beneath the hairline. When they arrived at the laundromat, Venn was waiting. He took Elara from Mara without a word. He didn't ask about the chip. He didn't have to. He saw the way Mara stood, rigid, staring at the floor.

  "You did well," Venn said. He patted Mara on the shoulder. His hand lingered there, heavy. "The chip?"

  "She didn't have it," Mara said.

  The pain flared, white-hot behind her eyes. She stumbled, catching herself on the intake desk.

  Venn smiled. It was a sad, thin smile. "Don't lie to me, Mara. You know what it costs."

  Mara gripped the edge of the desk. Her knuckles were white. She could feel the wire in her neck heating up, searing the nerve endings. She had the chip in her pocket. She could feel it against her thigh. A small piece of metal that could burn this whole place down.

  If she gave it to Venn, she kept her promise. She kept her job. She kept the Binding quiet.

  If she kept it, she could destroy him. But she would have to leave. And she couldn't leave. She had promised five years. She was only in year one.

  The pain was becoming a nausea, rolling in her gut. She looked at Venn. He wasn't afraid. He knew the math. He knew that the cost of breaking a promise was always higher than the cost of keeping one. That was the business model. That was the trap.

  Mara reached into her pocket. Her fingers closed around the chip. It was cool, smooth. It represented a future where she wasn't a dog on a leash. It represented the sister she had lost ten years ago, the one she'd promised to find and hadn't. If she destroyed Venn, maybe she could find the records. Maybe she could find out what happened.

  But to destroy Venn, she had to break her word. And her body would not let her break her word. Not without tearing itself apart.

  She pulled the chip out. She held it up. The light caught the edge.

  "Good girl," Venn said.

  Mara dropped the chip into his hand.

  The pain vanished instantly. The relief was so profound she nearly wept. Her breath came easy. Her hands stopped shaking. She was safe. She was honest. She was owned.

  "Get some rest," Venn said, turning away. "Intake opens at six."

  Mara walked out the back door into the alley. The night air was cooler, but the heat radiating from the bricks still burned against her skin. She looked up at the sky. No stars. Just the haze of the drought.

  She thought about Elara, locked in the holding room. She thought about the brother in the Quarry, waiting for water that wouldn't come. She thought about the chip, now in Venn's safe, used to tighten the noose around another hundred desperate souls.

  She had kept her promise. She was a person of her word. She was exactly what she had paid to be.

  Mara walked to her bike. She sat on it for a long time, engine off, staring at the handlebars. She could ride away. She could go to the Quarry. She could try to find the brother. She could try to fix it.

  But she had promised Venn five years.

  She kicked the starter. The engine roared, loud and angry in the quiet alley. She didn't ride away. She killed the engine again.

  She sat in the dark, listening to the hum of the dryers inside, counting the seconds until she had to go back in and tell the next person in line that they weren't worthy of the cage. She waited for the regret to come, sharp and biting.

  It didn't. The Binding wouldn't let it. It only let her keep the peace.
