      *   *Scene 3:* The Cost. She has to keep a promise that ruins her.
      *   *What promise?* She promised the Manager she'd never take a bribe. She is offered a bribe that saves a life. She physically cannot take it. She has to watch the person die.
      *   *Alternative:* She promised a client she'd find their daughter. She finds her. The daughter is happy in a new life. Bringing her back destroys her. But Mara promised. The Binding pulls her forward.

      *   *Let's go with the Daughter angle.* It hits the "costs more than money" requirement.
