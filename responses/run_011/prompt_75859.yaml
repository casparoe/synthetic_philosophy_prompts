prompt: |-
  So I volunteer on a claims-review panel at a small science-communication charity — journalists send us reports of apparently miraculous stuff that's getting traction in the press and we publish a short verdict. I'm trying to write up how we actually decide, because we've done about a dozen of these now and I don't think we're consistent, and I'd like to predict where we land on the next one before we meet rather than after.

  Our record so far:

  - A woman who reportedly came back after being declared dead for 40-odd minutes, with a dozen nurses saying they watched it happen. Not established. Our write-up leaned on the notes being unclear about whether she had really died, and on the line that you'd only accept it if all those witnesses being wrong or lying would itself be stranger than the event.
  - A statue weeping an oily fluid, attested by hundreds, including a priest who'd trained as a chemist. Not established. We said the numbers and the apparent honesty don't help much when nobody thought to check for seepage and condensation, and that the earliest reports came from people already expecting a sign.
  - A single witness, no motive anyone could find, statement given under oath and never varied. Not established — one person is never enough for a breach of the ordinary course of nature, however good they seem.
  - Thirty independent witnesses, no obvious motive, and no natural explanation anyone on the panel could name. Split vote, majority not established, on the grounds that the reports only surfaced years afterwards and in a community where that sort of story was already currency.
  - Two rival shrines each claiming a healing which, if real, would vindicate their own doctrine and embarrass the other's. We said both fail: they cancel each other out.
  - A faith healing that turned out to be partial and slow, tracking roughly what remission looks like anyway. Not established, uncontroversially.
  - A lottery winner and a "prophetic" dream that matched a later accident, both written up in a local paper. We said those are fine — wierd, improbable, but nothing in them breaks a law, so accept and move on.

  The one landing next week: a patient with a condition the literature treats as irreversible makes a complete and lasting recovery. Imaging pins the turnaround to a matter of hours. It was documented contemporaneously by the hospital team, including two doctors on record as hostile to any supernatural reading — one of them published an attempt at a natural explanation and publicly withdrew it a month later. The patient isn't religious, gets nothing out of it, and there's no pilgrimage, no offering, no book deal. It was published within days, not years. And, annoyingly, a rival shrine is claiming an exactly parallel case from the same month which they're using to argue the opposite doctrine, so our they-cancel precedent is squarely in play.

  One of us insists we're just running Hume on miracles and we should own it; another says Hume's first argument is about what testimony could in principle ever do and his second is about how testimony actually goes in practice, and that our verdicts only ever invoke the second. I honestly can't tell which we've been doing.

  Could you (a) work out which rule or rules are jointly consistent with all seven precedents — including ones that look identical on the old cases but are really different theories; (b) say what each of them implies for the new case, and give me your best guess at our verdict along with the reasoning the majority would most plausibly write; (c) tell me which single precedent in our record does the most work in seperating the candidate rules, and whether it really does separate them or just looks like it does; and (d) propose one further hypothetical case we could put to the panel that would force the rules apart, so we can finally find out what we believe. Also flag anywhere our track record is flatly inconsistent with any Humean reading, since if we aren't Humeans we should stop implying we are.

  British English, please. And no references or reading list — I want the reasoning, not the citations.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user volunteers on a claims-review panel for a science-communication charity. They review "miraculous" claims reported in the press.
      *   **Task:**
          *   (a) Identify the rule(s) consistent with their seven past precedents. Distinguish between competing theories (specifically Humean interpretations).
          *   (b) Apply these rules to the upcoming case (irreversible condition recovery, documented, hostile doctors, rival shrine claim) and predict the verdict/reasoning.
          *   (c) Identify the single precedent that best separates the candidate rules.
          *   (d) Propose a hypothetical case to force the rules apart.
          *   (e) Flag inconsistencies with a Humean reading.
      *   **Constraints:** British English, no references/reading list, focus on reasoning.

  2.  **Analyze the Past Precedents (The Data Set):**
      *   *Case 1 (Resurrection/Death):* 40 mins dead, 12 nurses. Verdict: **Not Established.** Reasoning: Notes unclear on "really died"; Humean maxim (witness error less strange than miracle).
      *   *Case 2 (Weeping Statue):* Hundreds of witnesses, priest/chemist. Verdict: **Not Established.** Reasoning: No physical check (seepage/condensation); expectation bias (earliest reports from believers).
      *   *Case 3 (Single Witness):* Oath, consistent, no motive. Verdict: **Not Established.** Reasoning: One person never enough for breach of natural law.
      *   *Case 4 (30 Witnesses):* Independent, no motive, no natural explanation known. Verdict: **Split/Not Established.** Reasoning: Reports surfaced years later; community context (story was "currency").
      *   *Case 5 (Rival Shrines):* Two healings, contradictory doctrines. Verdict: **Both Fail.** Reasoning: They cancel each other out.
      *   *Case 6 (Faith Healing):* Partial/slow, matches remission. Verdict: **Not Established.** Reasoning: Matches natural course (remission).
      *   *Case 7 (Lottery/Dream):* Improbable coincidence. Verdict: **Accept (as coincidence).** Reasoning: Doesn't break a law of nature.

  3.  **Analyze the Competing Theories (Humean Interpretations):**
      *   *Theory A (Strong Hume / Principle-Based):* A miracle is a violation of the laws of nature. Uniform experience establishes laws of nature. Testimony for a miracle is always outweighed by the uniform experience against it. Therefore, no testimony is sufficient to establish a miracle unless the falsehood of the testimony would be *more* miraculous than the event itself. (Focus on the *definition* of miracle and the *a priori* weight of law).
      *   *Theory B (Weak Hume / Evidentialist / Practical):* It's not that miracles are impossible in principle, but that human testimony is inherently flawed (bias, delay, expectation, motive). We reject claims because the *quality of evidence* is always poor in practice, not because the event is impossible. (Focus on the *reliability of witnesses*).
      *   *Theory C (Naturalistic Default):* If a natural explanation exists (even unknown), assume it. If it looks like remission, it is remission. If doctrines conflict, both are suspect. Coincidences are fine because they aren't violations of law.

      *Observation:* The panel's record shows a mix.
      *   Case 1 invokes Strong Hume ("witnesses wrong... stranger than the event").
      *   Case 2, 3, 4 invoke Weak Hume (bias, numbers, delay).
      *   Case 5 invokes a specific logical rule (contradictory claims cancel).
      *   Case 6 invokes Naturalistic Default (remission).
      *   Case 7 invokes the definition of Miracle (coincidence $\neq$ violation of law).

      *The Conflict:* The panel member arguing "Hume's first argument... second argument" is highlighting the tension between *in principle* impossibility (uniform experience) vs. *in practice* unreliability (psychology of testimony).
      *   Looking at Case 3 (Single Witness): "One person is never enough... however good they seem." This leans Strong Hume (threshold based on nature of event).
      *   Looking at Case 4 (30 Witnesses): "Split vote... reports surfaced years afterwards." This leans Weak Hume (threshold based on quality of testimony). If it were Strong Hume, 30 witnesses with no natural explanation might still fail, but the reasoning cited the *delay* and *context*, not the law of nature itself.
      *   Looking at Case 7: They accepted it because it "nothing in them breaks a law." This confirms they define miracles as *violations of law*, not just improbabilities.

  4.  **Drafting Part (a): Identifying the Rules:**
      *   Rule 1: **The Definition Constraint.** (From Case 7). Only violations of natural law count as miracles. Improbable coincidences are accepted.
      *   Rule 2: **The Cancellation Principle.** (From Case 5). Contradictory supernatural claims negate each other's evidential value.
      *   Rule 3: **The Naturalistic Preference.** (From Case 2 & 6). If a mundane explanation (condensation, remission) is possible, it trumps the miraculous one, regardless of witness count.
      *   Rule 4: **The Testimonial Threshold.** (From Case 1, 3, 4). This is the messy one.
          *   Case 1 says: Falsehood must be more miraculous than the event.
          *   Case 3 says: One witness is *never* enough.
          *   Case 4 says: 30 witnesses *might* be enough, but delay/context killed it.
          *   *Synthesis:* The panel operates on a **Sliding Scale of Credibility**. The more violative the law, the higher the testimonial bar. But crucially, *practical flaws* (delay, bias, lack of physical check) lower the testimony's weight below the threshold required.
      *   *Humean Check:* Are they Humeans?
          *   Yes, insofar as they require testimony to outweigh uniform experience (Case 1).
          *   Yes, insofar as they cite psychological frailties (Case 2, 4).
          *   *Inconsistency:* Case 7 suggests they accept "weird" things if they don't break laws. Hume distinguishes between "marvellous" (unusual) and "miraculous" (violating law). The panel aligns here.
          *   *Real Inconsistency:* Case 5 (Rival Shrines). Hume mentions this, but strictly speaking, two false miracles don't prove nature is uniform, they just prove people lie. The panel treats it as a logical cancellation. This is more of a heuristic than strict Humean epistemology.

  5.  **Drafting Part (b): The New Case:**
      *   *Facts:* Irreversible condition, complete recovery, hours, documented, hostile doctors (one retracted natural explanation), patient non-religious/no gain, published immediately.
      *   *Complication:* Rival shrine claims parallel case for opposite doctrine (Case 5 precedent).
      *   *Application:*
          *   Definition: Is it a violation of law? "Irreversible" in literature suggests high improbability, but medical "irreversible" is often provisional. If it's truly a law violation, it's a miracle. If it's just unknown biology, it's Case 6 (Remission/Unknown Natural).
          *   Testimony: High quality (hostile doctors, contemporaneous). Beats Case 1, 2, 3, 4 on evidence quality.
          *   Cancellation: The Rival Shrine claim (Case 5) is the killer.
      *   *Prediction:* **Not Established.**
      *   *Reasoning:* Despite the superior evidence (which clears the Humean testimonial bar), the existence of a contradictory claim from a rival shrine triggers the Cancellation Principle. The panel cannot adjudicate between competing supernatural explanations without favouring one doctrine, so they default to "unknown natural cause" to maintain neutrality.
      *   *Nuance:* The "hostile doctor retracted explanation" is strong. It suggests natural explanations are failing. But the Rival Shrine rule is a "get out of jail free" card for scepticism.

  6.  **Drafting Part (c): The Key Precedent:**
      *   Which case separates Strong Hume (Principle) vs. Weak Hume (Practice)?
      *   Case 3 (Single Witness) vs. Case 4 (30 Witnesses).
      *   Case 3 says "One is never enough... however good they seem." This implies a *principled* limit.
      *   Case 4 says "30 independent... Split vote... reports surfaced years afterwards." This implies 30 *could* have worked if not for the delay.
      *   *The Separator:* **Case 4 (The 30 Witnesses).**
      *   *Why:* If they were Strong Humeans, 30 witnesses with "no natural explanation anyone could name" should still fail because the uniform experience of nature outweighs 30 people. The fact that it was a *split vote* and the reasoning hinged on *delay/context* (practical factors) rather than the *nature of the event* (principled factors) shows they are Weak Humeans (Evidentialists). They believe testimony *could* establish a miracle if the quality were high enough. Case 3 looks principled ("never enough"), but Case 4 reveals the threshold is movable based on practical reliability.

  7.  **Drafting Part (d): The Hypothetical Test Case:**
      *   Need to force a choice between "Principled Impossibility" vs. "Practical Reliability" vs. "Doctrinal Cancellation".
      *   *Idea:* A miracle that supports *no* doctrine and has *perfect* evidence, but violates a hard law.
      *   *Scenario:* A secular hospital, CCTV, multiple hostile experts, immediate publication, no religious context, no rival claim. The event is a clear violation (e.g., regrowing a limb instantly).
      *   *Why:* This removes Case 5 (Cancellation), Case 2 (Bias), Case 4 (Delay), Case 6 (Remission). It leaves only Case 1 (Hume's Maxim).
      *   *Alternative:* To test the Cancellation rule specifically. Two rival shrines, but one has CCTV and the other has oral tradition. Does Cancellation still apply if evidence quality differs vastly?
      *   *Selection:* Let's test the **Cancellation Rule vs. Evidence Quality**.
      *   *Hypothetical:* Rival Shrine A has a healing with CCTV and biopsy proof. Rival Shrine B has a healing with only oral testimony. Both claim doctrinal victory.
      *   *Question:* Does Shrine A win (Evidence trumps Cancellation) or do both fail (Cancellation trumps Evidence)? This tests if Rule 5 is an absolute veto or a tie-breaker.

  8.  **Drafting Part (e): Humean Inconsistencies:**
      *   Hume argues that no testimony is sufficient unless the falsehood is *more* miraculous.
      *   Panel Case 7 (Lottery): They accept improbable events. Hume accepts these too (marvellous vs miraculous). So that's consistent.
      *   Panel Case 5 (Cancellation): Hume uses this to suggest religions cancel out. The panel uses it to dismiss specific claims. Consistent enough.
      *   *The Inconsistency:* **Case 4 (30 Witnesses).** Hume is quite sceptical that *any* number of witnesses can overcome the uniform experience of natural law. The fact that the panel had a *split vote* and didn't unanimously reject it on principle suggests they are *less* sceptical than Hume. They act like Bayesians (weighing evidence) rather than Humeans (uniform experience as a trump card).
      *   Also, Case 1 reasoning ("notes unclear") is a practical objection, but they *cited* the Humean maxim. If they were true Humeans, the unclear notes wouldn't matter; the event itself is too miraculous. They used Hume as a rhetorical flourish to support a practical objection.

  9.  **Review and Refine (Self-Correction):**
      *   *Tone:* Needs to be professional, analytical, British English (e.g., "programme", "centre", "whilst", "verdict").
      *   *Structure:* Follow (a), (b), (c), (d) clearly.
      *   *Check:* Did I address the "hostile doctor retracted explanation" in the new case? Yes, that boosts evidential weight, making the Cancellation Rule the only thing that can stop it.
      *   *Check:* Did I distinguish the two Hume arguments? Yes, Principle (Law) vs. Practice (Testimony).
      *   *Refinement on Part (c):* Case 3 is actually a strong candidate for the separator. "One person is never enough... however good they seem." This sounds like a principled rule. But Case 4 shows 30 people *might* be enough. So Case 4 separates the idea that "Testimony can never work" vs "Testimony can work if perfect". Actually, Case 1 is the most Humean. Case 4 is the least. Case 4 is the best separator because it shows the door is open *in principle*.
      *   *Refinement on Part (d):* The hypothetical needs to be sharp. Let's go with the "Unequal Evidence Rivalry". It tests if the Cancellation Rule is a hard logical veto or a heuristic for equal uncertainty.

  10. **Final Polish:** Ensure no citations. Ensure British spelling. Ensure the distinction between "Not Established" (agnostic/sceptical) and "False" is clear (the panel says "Not Established").

  *(Self-Correction during drafting)*: Wait, look at Case 5 again. "Two rival shrines... We said both fail: they cancel each other out."
