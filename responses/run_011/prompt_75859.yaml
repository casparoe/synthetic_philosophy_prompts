  If the panel applies Case 5 rigidly, the quality of evidence doesn't matter.
  If the panel applies Case 1/3/4 (Evidentialism), the quality matters.
  This is the crux of the prediction. Given the panel's desire for consistency, they will likely hide behind Case 5 because it's the easiest way to avoid making a metaphysical claim.
  Prediction: Not Established. Reasoning: Cancellation.

