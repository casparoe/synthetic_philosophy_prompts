answer: |-
  Here are four distinct technical readings of the claim "a rational player never plays a dominated strategy," separated by the axes you identified.

  ### 1. The "Pure vs. Mixed" Reading
  *   **Claim:** A strategy is dominated only if there is a **single other pure strategy** that yields a higher payoff against every opponent profile.
  *   **Verdict:** **False.** This is too narrow. In standard game theory, a strategy is dominated if it is beaten by *any* alternative, including a **mixed strategy** (a probabilistic lottery over two or more pure strategies).
  *   **Assumption Required:** None (this is simply an incorrect definition).

  ### 2. The "Strict vs. Weak" Reading (Order of Deletion)
  *   **Claim:** You can iteratively remove dominated strategies, and the **order of removal never matters** for the final result.
  *   **Verdict:** **True but only under an assumption he never stated.** This holds for **Strict Dominance** (where the alternative is *always* better). It is **False** for **Weak Dominance** (where the alternative is *at least as good* everywhere and *better* somewhere). With weak dominance, the order of deletion changes the surviving set.
  *   **Assumption Required:** That all dominance being discussed is *strict*.

  ### 3. The "Static vs. Iterated" Reading (Opponent Rationality)
  *   **Claim:** A strategy is dominated if it loses against **every logically possible** move the opponent could make.
  *   **Verdict:** **True and interesting (but limited).** This is "One-Shot" dominance. However, if you assume **Common Knowledge of Rationality** (you know they are rational, they know you know, etc.), you can eliminate opponent moves that are dominated *for them* first. A strategy might be safe against all *possible* moves but dominated against all *rational* moves.
  *   **Assumption Required:** To use iterated deletion, you must assume Common Knowledge of Rationality. Without it, you cannot cross off opponent moves just because they look "bad."

  ### 4. The "Ex-Ante vs. Ex-Post" Reading (The Definition of Rational)
  *   **Claim:** A player is "rational" only if they **win** (or achieve a good outcome).
  *   **Verdict:** **False.** Rationality in game theory is **Ex-Ante** (before the fact). It refers to maximizing *expected* utility based on available information. A rational player can play a dominated strategy by mistake, or play a *non*-dominated strategy and lose due to variance.
  *   **Correct Corollary:** "A rational player never *intentionally chooses* a dominated strategy." (Verdict: **True**).

  ***

  ### Licensing the Three Uses

  *   **Use 1 (Cut Action C):** Licensed by **Reading 2 (Mixed Strategy)**. Your friend was technically correct that C is junk, but your check failed because you only looked for a *pure* strategy dominator. C is dominated by a 50/50 lottery of A and B (see diagnosis below).
  *   **Use 2 (Order Doesn't Matter):** Licensed by **Reading 2 (Strict Dominance)**. He is right *if* the game only involves strict dominance. If your game has weakly dominated actions (e.g., an action that is sometimes equal to another but never better), his claim is false; the order would matter.
  *   **Use 3 (Beginner Luck):** Licensed by **Reading 4 (Ex-Ante Rationality)**. He is right that the maxim holds. The beginner played a dominated strategy (irrational decision) but got a favorable outcome (luck). Rationality judges the decision process, not the roll of the dice.

  ***

  ### Diagnosis of Your A/B/C Toy

  Your intuition that C is "junk" is correct, but your mathematical check was incomplete.

  *   **Pure Check:** You checked if A > C everywhere (No) and if B > C everywhere (No).
  *   **Mixed Check:** You must check if a *combination* of A and B beats C everywhere.
      *   Construct a mixed strategy $M$: Play A with 50% probability, Play B with 50% probability.
      *   **Against Opponent Setup 1:** $M$ pays $0.5(1) + 0.5(0) = \mathbf{0.5}$. (C pays 0.4). **$M$ wins.**
      *   **Against Opponent Setup 2:** $M$ pays $0.5(0) + 0.5(1) = \mathbf{0.5}$. (C pays 0.4). **$M$ wins.**
  *   **Conclusion:** Action C is **strictly dominated by a mixed strategy**. Your friend was right to cut it; you were right to demand a proof, but you looked for the wrong kind of dominator.
