  1. **Framings I considered**
  1. **AI Agenthood:** Treat LLMs as potential Popperian agents to see if they meet the criteria. *Reject:* Prematurely grants agency without solving the generation/cost split, begging the question.
  2. **Historical Narrative:** Treat Dennett's rungs as evolutionary chronology only, not functional types. *Reject:* Ignores Dennett's explicit claim that these are functional kinds realizable in silicon, weakening the critique.
  3. **Axis Decoupling:** Separate behavior generation from error cost to test the taxonomy's structural integrity. *Fund:* This exposes the structural contingency Dennett masks, allowing a precise diagnosis of why LLMs feel both intelligent and inert without forcing them into a rung.

  2. **The question**
  Does Dennett's four-tier taxonomy describe necessary structural levels of cognitive architecture, or contingent historical phases of biological evolution? A determinate answer requires showing whether the pairing of generation-locus and error-cost-locus is logically necessary or merely co-occurred in Earth's history. If structural, we must be able to populate all combinatorial cells (e.g., Gregorian generation with Darwinian cost). If historical, the empty cells are empty by fact, not logic. Merely noting LLMs are "different" is not an answer. The answer must determine if the taxonomy breaks or if we need new labels. If the taxonomy breaks, it was never structural. If it holds, LLMs must fit a rung without forcing. The paper must conclude one way, not hedge. I will argue for the historical contingency hypothesis.

  3. **Why the ladder leaves it open**
  Dennett's ladder assumes cumulative cognition requires new mechanisms for both trying and dying. Darwinian creatures try in genomes and die in lineages. Skinnerian creatures try in lifetimes and die in bodies. Popperian creatures try in models and die in simulations. Gregorian creatures try in culture and die in memes. The commitment is that generation and cost migrate together outward. My two-axis reading exposes this migration as optional. LLMs generate via Gregorian means (external corpus) but incur error costs via a frozen Skinnerian mechanism (gradient descent on fixed data) or no cost at all during inference. The generation is externalized; the cost is historical. The ladder leaves it open whether these axes must couple. Dennett treats the rungs as functional kinds, implying structural necessity. But if generation and cost can decouple, the rungs are not stable categories. They are snapshots of a specific evolutionary trajectory where externalizing generation required externalizing cost-bearing. LLMs show you can have one without the other. This exposes the ladder's commitment to coupled migration as an empirical generalization disguised as a structural typology.

  4. **Approach**
  I will perform a conceptual dissection of "trying" and "dying" across the four rungs, formalizing them as Generation Locus and Error Cost Locus. I will then map current ML architectures onto this grid, distinguishing pre-training from inference. Why not add a fifth rung? This preserves the ladder but ad hoc patches the theory. It assumes the ladder is the right shape, merely incomplete. My approach tests the shape itself. Why not empirical benchmarks? Testing LLMs on animal cognition tasks misses the philosophical point. The issue isn't performance parity; it's the architectural locus of learning. An LLM can pass a test without being Popperian if the error cost isn't internal. Why not abandon the vocabulary? Dennett's terms are too useful for describing cognitive evolution. Discarding them loses diagnostic precision. Instead, I repurpose them to show their limits. The risk of my approach is proving the taxonomy useless. But that is a result. The alternative approaches assume the taxonomy is salvageable. I will treat it as a hypothesis to be falsified by the AI case. This yields a stronger paper: either a repaired taxonomy or a demonstrated category error. I commit to the latter hypothesis: the taxonomy is historical. I will defend the view that the rungs track biological history, not cognitive logic, making them poor predictors for AI minds.

  5. **Three months**
  Fortnights 1-2: Exegesis. Close reading of *Kinds of Minds* and *Brainstorms* to formalize the four rungs. Define Generation and Cost axes rigorously. Ensure I am not straw-manning Dennett's functionalism. Establish the baseline definitions.
  Fortnights 3-4: The ML Case. Map pre-training and inference onto the axes. Consult with CS colleagues to ensure technical accuracy regarding backprop vs. inference. Draft the argument that LLMs occupy a "forbidden" cell where generation is Gregorian but cost is Darwinian/Skinnerian.
  Fortnights 5-6: Synthesis. Argue that the empty cells reveal the taxonomy is historical. Write the full draft. Refine the conclusion: if the taxonomy is historical, it cannot predict AI minds, only describe biological ones.
  Final Week: Polish for submission. Cut technical digressions. Ensure the 8000-word target is met without padding. Verify all claims about ML training loops are accurate.

  6. **What success and failure look like**
  Success: An 8000-word paper demonstrating that Dennett's rungs are contingent pairings. The deliverable argues that LLMs are not "broken Popperians" but evidence that the ladder is a narrative, not a logic. It will be submittable to a journal like *Philosophy of AI* or *Cognitive Science*.
  Failure: If I cannot cleanly separate generation from cost. If every example of external generation necessarily implies externalized cost, the axes collapse.
  Month Two Check: If the ML mapping forces me to stretch definitions until the axes merge back into one, the project fails. I will then pivot to arguing that LLMs are purely Skinnerian despite appearances, abandoning the two-axis claim. But the hypothesis is that they come apart. Another failure mode: Getting bogged down in ML technicalities. If I spend too long explaining transformers, the philosophical point dies. I must keep the ML description high-level but accurate.

  7. **Honest scope worries**
  Dennett exegesis risks ballooning. It is easy to write 4000 words just clarifying what Dennett meant by "Popperian." I will cut this by sticking to the functional roles of trying and dying, ignoring textual nuances unless they affect the axes. ML technicalities also threaten scope. Explaining backpropagation or attention mechanisms could consume the word limit. I will treat these as black boxes defined only by their learning signal location. Finally, I might be tempted to try to fix the taxonomy mid-draft. I will resist. The paper argues the taxonomy is historical. If I try to save it, the argument becomes indecisive. I must commit to the critique.
