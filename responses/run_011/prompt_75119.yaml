  # Activity Design: The Echo Chamber Jury

  ## 1. Parameters and Arithmetic

  **The Setup:**
  *   **Jurors ($N$):** 16 students.
  *   **Rounds ($R$):** 20 voting rounds (plus optional coda).
  *   **Individual Reliability ($p$):** $0.55$ (55%).
  *   **Correlation Structure:**
      *   **Bloc A (Correlated):** 9 students. They receive *identical* signals every round.
      *   **Bloc B (Independent):** 7 students. They receive *independent* signals every round.
  *   **Decision Rule:** Simple Majority (9 votes needed to win).
  *   **Pizza Threshold:** The class must achieve **14 correct verdicts** out of 20 to win the pizza.

  **The Arithmetic:**
  1.  **Individual Reliability:** Every student has a $55\%$ chance of receiving a signal matching the Truth. This satisfies your constraint ($p > 0.5$).
  2.  **Group Accuracy (Correlated Reality):** Because Bloc A has 9 members (a majority) and they vote identically based on a shared signal, the Group Decision *is* the Signal of Bloc A.
      *   $\text{Group Accuracy} = p = 0.55$.
      *   Over 20 rounds, Expected Correct Verdicts = $20 \times 0.55 = 11$.
      *   Standard Deviation ($\sigma$) = $\sqrt{20 \times 0.55 \times 0.45} \approx 2.22$.
      *   **Statistical Indistinguishability:** A result of 11 wins is within one standard deviation of 10 wins (pure chance). A 95% confidence interval on their observed accuracy ($11/20 \pm 2\sigma$) ranges from roughly $33\%$ to $77\%$. This comfortably swallows $50\%$. They cannot statistically prove they are better than a coin toss during the session.
  3.  **Group Accuracy (CJT Expectation):** If students assume independence (as they currently do), they expect the Condorcet Jury Theorem to apply to $N=16, p=0.55$.
      *   Using the Binomial Distribution $B(16, 0.55)$, the probability of a correct majority ($k \ge 9$) is $\approx 0.74$.
      *   Expected Correct Verdicts = $20 \times 0.74 = 14.8$.
  4.  **The Pizza Trap:**
      *   Threshold = 14 wins.
      *   **Independent Expectation:** $14.8$ wins. (Probability of reaching 14+ $\approx 58\%$). They should feel confident they will eat.
      *   **Correlated Reality:** $11$ wins. (Probability of reaching 14+ $\approx 23\%$). They will likely starve.
      *   **Rounds Needed:** 20 rounds is the minimum to make the gap between 11 wins (reality) and 14 wins (threshold) feel like a failure rather than bad luck. 10 rounds is too noisy; 30 is too long for 80 minutes.

  ## 2. Procedure

  **Preparation (Before Class):**
  *   **Truth Deck:** Prepare 20 index cards labeled "Truth: RED" or "Truth: BLACK" (10 of each, shuffled).
  *   **Signal Packets:** Prepare 16 envelopes per student (320 total), organized into 20 rounds.
      *   **For the 9 Correlated Students:** In each round, all 9 receive the *exact same* signal card. (e.g., Round 1: All 9 get "Signal: RED").
      *   **For the 7 Independent Students:** In each round, each receives a unique draw.
      *   **Signal Bias:** To achieve $p=0.55$, use a pre-generated list. If Truth is RED, 55% of signals issued that round must be RED.
      *   *Note:* Use the photocopier to generate the 9 identical cards for the Correlated Bloc efficiently during prep.
  *   **Ballots:** 320 small index cards (20 per student) pre-printed with "RED" / "BLACK" checkboxes.

  **In-Class Flow:**
  1.  **Setup (5 mins):** Arrange seating. Distribute the 20-round packet to each student. Emphasize: *"Do not look ahead. Do not show your signal card to anyone. This is a secret ballot."*
  2.  **The Round Loop (3 mins/round x 20 = 60 mins):**
      *   **State:** You flip a coin (or draw from Truth Deck) to determine the Truth. Record it privately.
      *   **Signal:** Students open the envelope for Round $X$. They view their signal silently.
      *   **Vote:** Students mark their ballot (RED/BLACK) and fold it.
      *   **Collection:** A designated **Clerk** (student volunteer) collects ballots in a box.
      *   **Tally:** You (Facilitator) count votes aloud. Clerk records "Majority: RED/BLACK" on the Whiteboard.
      *   **Reveal:** You announce the Truth. Clerk marks "Correct/Incorrect" on the Board.
      *   **Running Tally:** Clerk maintains a cumulative "Correct Verdicts" count on the Board.
  3.  **Scoring:** If the Running Tally $\ge 14$ after Round 20, pizza is ordered. If not, class ends hungry.

  **Why Secret Ballots?**
  *   **Decision:** Ballots must be **Secret**.
  *   **Defense:** If ballots are open, the 9 Correlated students will be identified by Round 3 (they always vote together). The lesson would shift from "hidden structural correlation" to "spotting the cheaters." We want them to experience the *phenomenology* of independence while suffering the *reality* of dependence. They must feel they are voting freely, only to find the group fails. Secrecy preserves the illusion that their failure is due to the difficulty of the task, not the structure of the information.

  ## 3. The Correlation Mechanism (Hidden Source)

  **How to Generate Signals Without Detection:**
  *   **The "Common Source":** The 9 Correlated students are effectively one juror with 9 votes.
  *   **Concealment:** Since they cannot compare cards (rule enforced), they will not know their signal is identical to others'.
  *   **Plausible Deniability:** When a Correlated student asks, "Why do I keep getting Red?", your answer is truth-adjacent: "The deck is biased based on the Truth." Since the Truth flips, their signals will flip too, just in unison.
  *   **Independents:** Their signals will *also* correlate with the Truth, just not with each other. A Correlated student and an Independent student will agree often (approx $0.55^2 + 0.45^2 \approx 50\%$ agreement by chance + bias), making the perfect correlation among the Bloc harder to spot even in retrospect.

  ## 4. Deliberation Stage

  **Timing:** Inserted after **Round 10**.
  **Duration:** 10 Minutes.
  **Permissions:**
  *   **ALLOWED:** Discussing confidence levels ("I felt sure about that one"), discussing the *difficulty* of the signal ("The cards are ambiguous"), and strategizing on *how* to interpret the signal.
  *   **FORBIDDEN:** **Showing Signal Cards.** This is the critical rule. If they show cards, the 9 Correlated students see they hold identical evidence. The game ends.
  *   **Facilitator Role:** If a student says, "I think we are all getting the same card," intervene: "That would violate the independence assumption of the theorem we are testing. Assume your evidence is private."

  **Purpose:** This mimics real-world deliberation where agents share *conclusions* ("I vote Red") and *confidence* ("I'm sure"), but rarely share raw *data* (the algorithmic feed, the specific news clip). It allows them to realize they are stuck without revealing the mechanical cause.

  ## 5. Coda: The Inversion (Time Permitting)

  **Condition:** If you finish Round 20 with 5 minutes remaining.
  **Modification:** Announce Rounds 21-25 use a "Degraded Channel."
  **Parameter:** Change signal reliability to $p = 0.40$ (worse than chance).
  **Prediction:**
  *   **CJT (Independent):** Group should systematically vote *Wrong* (anti-tracking).
  *   **Reality (Correlated):** Group still follows the Bloc. Group Accuracy = $0.40$.
  **Lesson:** Correlation prevents the "wisdom of crowds" from correcting error, but it also prevents the "madness of crowds" from inverting truth as efficiently as independence would. The group remains stuck at the reliability of the source ($0.40$), rather than converging to $0.00$.
  **Cutting Room:** If time is tight, cut the Coda. The primary lesson (Independence Assumption) is secured by Round 20.

  ## 6. Debrief

  **Mapping Play to Theory:**
  1.  **The Loss:** Point to the Whiteboard. "You had 16 experts, each 55% reliable. CJT predicts 74% group accuracy. You achieved 55%. Why?"
  2.  **The Reveal:** Disclose the seating chart. "Rows 1 and 2 were one person. You had 8 effective voters, not 16."
  3.  **The Phenomenology:** Ask the Correlated students: "Did you feel like you were copying?" (No). "Did your card feel different from a normal card?" (No).
      *   *Key Takeaway:* There is no internal marker distinguishing independent judgment from echoed judgment. You cannot feel correlation.
  4.  **Real World:** Map Bloc A to "Algorithmic Feeds," "Single News Network," or "Shared Departmental Assumptions." Map Bloc B to "Field Research," "Private Data."

  **Predictable Troubles & Recovery:**
  *   **Trouble:** Students compare cards during deliberation.
      *   **Recovery:** "You just violated the independence assumption. In the real world, this is called 'collusion' or 'groupthink.' Notice how quickly it solved the mystery? In reality, you don't get to check."
  *   **Trouble:** They get lucky and hit 14 wins (23% chance).
      *   **Recovery:** "You beat the odds. But look at the variance. In half the sessions like this, the pizza is lost. Would you bet your tenure on a 55% group accuracy?"
  *   **Trouble:** They suspect the Facilitator is rigging the Truth.
      *   **Recovery:** Offer to let a student shuffle the Truth Deck for the Coda rounds.

  **Limitations (What the Activity Cannot Reproduce):**
  *   **Partial Correlation:** In reality, correlation is rarely 100% (perfect copying). It is usually partial (e.g., 0.7 correlation). This activity uses a "worst-case" bloc to make the effect visible in 80 minutes. You must argue by analogy that partial correlation degrades accuracy proportionally.
  *   **Competence Heterogeneity:** All students have equal $p$. In reality, some voters are better than others. CJT handles this, but the "Bloc" effect swamps it here.

  ## 7. Ambition: Phenomenological Indistinguishability

  **Design Feature:**
  The signal cards for Correlated and Independent jurors are physically identical (same stock, same font). The bias ($p=0.55$) is low enough that a "Red" signal does not guarantee Truth, high enough that it feels informative.
  *   **Experience:** When a Correlated student sees "Red," they feel a 55% confidence. When an Independent student sees "Red," they feel a 55% confidence.
  *   **Result:** There is no qualitative difference in the *experience* of judging. The failure of the group is not preceded by a feeling of "echoing." It feels like a series of unfortunate coincidences. This fulfills your ambition: they leave knowing they cannot trust their feeling of independence.

  ## 8. Confidence Report

  **Quantitative Claims:**
  *   **Confidence:** **High** on the logic of the Bloc Majority ($N=9$ dictates outcome). **Moderate** on the specific binomial probabilities.
  *   **Reasoning:** The calculation that Group Accuracy = Bloc Accuracy ($0.55$) is exact, assuming the Bloc holds the majority. The CJT comparison ($0.74$) relies on the normal approximation of the binomial distribution, which is robust for $N=16$.
  *   **Risk:** The Pizza Threshold (14/20) gives the Correlated group a ~23% chance of success. There is a non-zero chance they win the pizza despite the lesson. This is a feature, not a bug—it demonstrates that correlation adds *variance* and *risk*, not just failure.

  **Least Sure Point:**
  *   **Student Compliance with Secrecy:** I am least confident that 16 undergraduates will not peek at each other's signal cards during the 60 minutes of voting, especially if they sit near their friends.
  *   **Mitigation:** I will assign seats randomly upon entry and collect all signal cards at the end of class to prevent post-game forensics. If cards are shown mid-game, the "phenomenological indistinguishability" is broken. I must enforce this aggressively as a "rule of the court."
