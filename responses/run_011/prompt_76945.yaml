      *   *Exegesis:* Be careful not to attribute views not in the prompt, but correct where the prompt misreads standard Carnapian positions (e.g., the status of the criterion).
      *   *Distinctions:* Truth-aptitude vs. Rational Assessability. Theoretical vs. Practical Rationality. Assertion vs. Proposal.
      *   *No Citations:* Strictly enforced.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Blackburn says X." I need to explain the philosophical point as a specialist without relying on name-dropping. I also need to ensure I address the user's specific worry about "proving too much." The diagnosis must show why this doesn't apply to *all* normative views, only those that accept Premise (3).

      *(Refining Premise 3)*: The argument assumes rationality *requires* truth conditions. A non-cognitivist denies this. So the argument is valid *if* you assume cognitivism, but the conclusion contradicts the starting point (Carnap's non-cognitivism). It's a *modus tollens* against Premise (3) given Carnap's framework.

      *(Refining Premise 9)*: Carnap explicitly calls the criterion a proposal. The user's premise (9) treats it as an assertion. This is an exegesis error. I need to point this out gently.

      *(Refining the "Proves Too Much" worry)*: The user worries that if this argument works, it kills *any* philosophy with normative upshots. The diagnosis should confirm this suspicion: the argument relies on a premise (3) that *would* kill any normative philosophy, which is reason to reject (3), not Carnap.

