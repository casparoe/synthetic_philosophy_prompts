answer: |-
  ### First, a brainstorming pass

  Here are the candidate failure points in the argument, ranked by their potential to dissolve the "proves too much" problem without sacrificing your core sympathy for (1)–(2).

  1.  **Premise (3): The Definition of Rationality.** This premise assumes rational assessment requires truth-aptness (fit with evidence). This looks unobjectionable if one assumes rationality is solely about representing the world correctly. However, if rationality can apply to the coherence of plans or attitudes (instrumental or consistency-based rationality), this premise fails. **Rank: High.** If this fails, the move from non-cognitivism to irrationalism (2 to 4) is blocked.
  2.  **Premise (9): The Status of the Criterion.** This premise treats the verification criterion as an assertoric claim subject to its own rules. It looks unobjectionable because it applies the criterion to itself. However, if the criterion is a proposal or a grammatical recommendation rather than a theoretical assertion, it does not need to satisfy its own conditions. **Rank: High.** If this fails, the self-refutation charge (10) dissolves.
  3.  **The Move from (4) to (8): Equivocation on "Rational Ground."** This step assumes that if ends aren't rationally assessable, no *preference* among them can be rational. It looks unobjectionable because it equates "rational choice" with "proven true." But one can have pragmatic reasons for a preference without the object of preference being true. **Rank: Medium.** This relies heavily on (3), but highlights a scope shift between assessing a sentence and assessing a choice.
  4.  **Premise (1): The Scope of Non-Cognitivism.** This premise claims end-assigning sentences are never testable. It looks unobjectionable under strict verificationism. However, if some value claims are disguised empirical claims about social welfare, they might be testable. **Rank: Low.** Challenging this undermines the core separation of spheres you wish to keep.
  5.  **Premise (6): Mood and Status.** This claims imperative mood doesn't alter status. It looks unobjectionable because the content is the same. However, if the function of the utterance changes from describing to prescribing, the standards of assessment might change. **Rank: Low.** This is largely subsumed by the diagnosis of (3).

  ### Second, your diagnosis

  The argument goes wrong at **Premise (3)**.

  **The Diagnosis:**
  Premise (3) states: "Rational assessment applies only to truth-apt content, because to assess a claim is to assess its fit with evidence and with other claims, and an utterance without truth conditions has no such fit to assess."

  This step is valid only under a **Cognitivist Conception of Rationality**, which identifies rationality with the accurate representation of reality (fit with evidence/truth). However, Carnap's non-cognitivism (which you accept in 1–2) commits him to a **Practical Conception of Rationality** for the sphere of life. On this view, rational assessment of non-truth-apt content is possible by evaluating *coherence*, *consistency*, and *instrumental efficiency* rather than truth.

  **Why it seemed fine:**
  It is natural to conflate "rational" with "theoretically justified." In the sphere of scientific cognition, rationality *is* truth-tracking. The argument smuggles this theoretical standard into the practical sphere. It assumes that because value sentences lack *truth conditions*, they lack *conditions of correctness* altogether. But an expressivist can hold that a volition is "correct" or "rational" if it is consistent with other volitions and effective at achieving desired states, even if it is not "true."

  **The Gap:**
  The gap is between **Truth-Aptness** and **Assessability**.
  *   *Truth-Aptness:* A sentence is capable of being true or false (corresponding to facts).
  *   *Assessability:* A commitment is capable of being criticized or defended (based on logic, consistency, or efficacy).
  Premise (3) asserts that Assessability entails Truth-Aptness. Your sympathy with (1)–(2) entails that Truth-Aptness is absent. Therefore, to avoid the conclusion that values are irrational, you must deny that Assessability entails Truth-Aptness.

  **Exegesis Correction:**
  Regarding Premise (9): Your argument treats the verification criterion as a claim that must be tested. Historically, Carnap explicitly treats the criterion as a *proposal* for the use of language, not a discovery about the world. He does not assert "Only analytic or synthetic sentences are meaningful" as a metaphysical truth; he proposes "Let us restrict 'meaningful' to analytic or synthetic sentences for the purpose of clarity." This is not a silent repair; it is a correction of a common misreading. Carnap anticipates the self-refutation charge by denying the criterion is an assertion. However, even with this correction, Premise (3) remains the deeper philosophical error that generates the "proves too much" worry.

  ### Third, price the alternatives

  Here is the cost of rejecting specific premises to save the position, assuming you want to keep the empiricist critique of metaphysics (1–2) intact.

  **Rejecting (1): The Criterion of Meaning**
  *   **Cost:** You abandon the separation of science and values. Value sentences become truth-apt (either naturalistic or non-naturalistic).
  *   **Result:** Preserves the political program (values are rational), but destroys the anti-metaphysical result (metaphysics might also be truth-apt).
  *   **Verdict:** Unacceptable for your purposes.

  **Rejecting (3): The Definition of Rationality**
  *   **Cost:** You must adopt a non-cognitivist account of rationality. You lose the ability to say value disagreements are settled by "facts." You must argue that rationality in the practical sphere consists in logical consistency of commands and instrumental efficiency.
  *   **Result:** Preserves the anti-metaphysical result (values aren't facts) and preserves the political program (planning is still rational, just practically rather than theoretically).
  *   **Verdict:** **Recommended.** This allows you to maintain that science cannot settle ends (no truth-aptitude) while denying that ends are immune to rational critique (they can be inconsistent or imprudent). It stops the argument from proving too much because it limits the scope of Premise (3) to theoretical cognition, not practical deliberation.

  **Rejecting (4): The Inference to Irrationalism**
  *   **Cost:** This is dependent on (3). If you reject (3), (4) falls automatically. If you keep (3) but reject (4), you must explain how non-truth-apt things are rationally assessable without explaining how (3) is false.
  *   **Result:** Similar to rejecting (3), but less principled.
  *   **Verdict:** Redundant if (3) is rejected.

  **Rejecting (6): The Status of Recommendations**
  *   **Cost:** You would have to argue that philosophical recommendations are somehow truth-apt even if moral ends are not. This creates an ad hoc exception for Carnap's own speech acts.
  *   **Result:** Saves Carnap specifically, but does not solve the general "proves too much" problem for other non-cognitivists.
  *   **Verdict:** Weak. It looks like special pleading.

  **Rejecting (9): The Self-Refutation of the Criterion**
  *   **Cost:** You must accept that the criterion is a proposal, not a claim. This costs nothing philosophically if you view philosophy as conceptual engineering.
  *   **Result:** Preserves the anti-metaphysical result (metaphysics violates the proposal) and preserves the political program (the proposal is useful).
  *   **Verdict:** Necessary for historical accuracy, but insufficient on its own to solve the rationality worry in (3)–(8).

  **Recommendation:**
  To keep the empiricist critique of metaphysics intact while avoiding the conclusion that Carnap's politics are irrational, **reject Premise (3)**. You should argue that rational assessment bifurcates: theoretical rationality tracks truth (science), while practical rationality tracks coherence and efficacy (politics/ethics). This allows you to say metaphysics is *cognitively* meaningless (failing theoretical rationality) without saying planning is *practically* irrational (failing practical rationality).

  ### Fourth, treat (9) on its own

  **Is recasting the criterion as a proposal a genuine escape?**
  Yes, but it relocates the difficulty rather than eliminating it.

  **Where the difficulty relocates:**
  If the criterion is a proposal ("Let us speak this way") rather than an assertion ("This is the way meaning is"), it is not subject to its own truth-conditions. It avoids self-refutation. However, the difficulty relocates to the **justification of the proposal**. If the criterion is not true, why should we adopt it?

  **What has to be true for the relocation to be an improvement:**
  For this move to succeed, there must be **pragmatic norms** that are not truth-apt but are nonetheless rationally compelling. You must be able to say, "Adopting this linguistic framework is *better* than adopting a metaphysical one," without meaning "It is truer."
  This requires that "better" in this context means something like "more fruitful for prediction," "more conducive to social cooperation," or "clearer."
  If you can establish that there are rational standards for choosing frameworks (e.g., simplicity, scope, intersubjective testability) that do not rely on the frameworks being "true" descriptions of reality, then the relocation is an improvement. It shifts the debate from semantics (what *is* meaning) to pragmatics (what *works* for our goals).
  The risk is that if these pragmatic standards are also treated as mere expressions of attitude, you return to the problem in (8). To avoid this, you must argue that the goal of *shared scientific cognition* is a constitutive aim of the community engaging in the discourse. If you want to do science, you *must* adopt the criterion. The rationality is hypothetical: "If you want scientific clarity, adopt empiricism."

  ### Fifth, tell me what is left

  After repairing the argument by rejecting Premise (3) and clarifying (9), a residual worry survives, but it is weaker than your original conclusion (10).

  **The Residual Worry:**
  The worry is not that Carnap's position is *irrational* or *self-refuting*, but that the **bifurcation of rationality** leaves the practical sphere vulnerable.
  If theoretical rationality (truth) and practical rationality (coherence/efficacy) are severed, then a political program can be perfectly "rational" in Carnap's sense (internally consistent, empirically informed) while being morally abhorrent, provided its ultimate ends are coherent.
  Because Carnap denies that ultimate ends are truth-apt, he denies there is a *theoretical* error in choosing evil ends, only a *practical* one if they conflict with other ends.

  **Formulating the Weaker Criticism:**
  You can state the criticism without proving too much as follows:
  *"Carnap successfully defends the rationality of planning against the charge of irrationalism by distinguishing theoretical from practical rationality. However, by insulating ultimate ends from cognitive assessment, he renders the choice between competing practical frameworks (e.g., socialist planning vs. decisionist irrationalism) immune to theoretical critique. While this saves his view from self-refutation, it limits the critical power of philosophy: it can check the consistency of a tyrant's plan, but it cannot declare the tyrant's ends cognitively mistaken. The cost of saving empiricism from metaphysics is accepting that reason cannot adjudicate the ultimate ends of life, only the means."*

  This criticism accepts your (1)–(2) and rejects (8)–(10). It acknowledges that Carnap's view is rational (contra 8) and not self-refuting (contra 10), but laments the *limits* this places on normative critique. It does not destroy all philosophy with normative upshots; it only targets those that, like Carnap's, deny truth-aptness to values while hoping to retain a robust notion of rational progress. It forces you to admit that "rational progress" in politics is thinner than "rational progress" in science.
