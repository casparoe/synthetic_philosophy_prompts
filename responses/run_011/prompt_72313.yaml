  ### MPhil Formal Epistemology: End-of-Term Paper

  **Time Allowed:** 2 Hours
  **Instructions:** Answer the compulsory question below. Closed book. Calculators are not permitted.

  **Question 1**
  Consider a framework with three mutually exclusive and jointly exhaustive hypotheses, $H_1, H_2, H_3$. A credence function is a vector $b = (b_1, b_2, b_3)$ where each $b_i \ge 0$. Unlike standard probabilistic frameworks, there is no requirement that $\sum b_i = 1$. Let $w$ be a world where exactly one hypothesis is true. Let $v_j = 1$ if $H_j$ is true at $w$, and $0$ otherwise.

  We define a novel accuracy measure $A(b, w)$ composed of two terms.
  First, a **Closeness Term** (Brier-style): $\beta(b, w) = -\sum_{j=1}^3 (b_j - v_j)^2$. (Higher is better).
  Second, a **Safety Term**: $\sigma(b, w) = 1$ if $b_k \ge 0.4$ for the true hypothesis $H_k$, and $0$ otherwise.
  The **Total Accuracy** is defined as: $A(b, w) = 0.1 \cdot \beta(b, w) + 0.9 \cdot \sigma(b, w)$.

  (i) Calculate the accuracy of the incoherent function $b^* = (0.4, 0.4, 0.4)$ and the coherent uniform function $u = (1/3, 1/3, 1/3)$ at an arbitrary world. Establish which dominates the other. [5 marks]

  (ii) Prove that there exists no *coherent* credence function $c$ (where $\sum c_i = 1$) that accuracy-dominates $b^*$. [5 marks]

  (iii) Joyce's accuracy-first argument for Probabilism relies on specific structural conditions on the accuracy measure (e.g., Propriety, Continuity, Additivity). Diagnose which condition $A$ violates and explain why this violation allows the result in (ii). [5 marks]

  (iv) Contrast $A$ with the Spherical Scoring Rule, defined as $S(b, w) = b_{true} / \sqrt{\sum b_i^2}$. The Spherical Rule is proper but scale-invariant (i.e., $S(b, w) = S(kb, w)$ for $k > 0$). Explain why scale-invariance prevents the Spherical Rule from vindicating Probabilism, even though it satisfies Propriety. [5 marks]

  (v) Suppose we generalise the measure to $A_\lambda = (1-\lambda)\beta + \lambda\sigma$ for some weight $\lambda \in (0, 1)$. Determine whether there exists any $\lambda > 0$ for which $A_\lambda$ is a proper scoring rule. Justify your answer. [5 marks]

  ***

  ### Model Answer

  **(i) Calculation and Dominance**
  At any world $w$, exactly one $v_j=1$ and the others are $0$.
  For $b^* = (0.4, 0.4, 0.4)$:
  The Closeness Term is $\beta(b^*, w) = -[(0.4-1)^2 + (0.4-0)^2 + (0.4-0)^2] = -[0.36 + 0.16 + 0.16] = -0.68$.
  The Safety Term is $\sigma(b^*, w) = 1$, because the true hypothesis has credence $0.4$, meeting the threshold.
  Total Accuracy: $A(b^*, w) = 0.1(-0.68) + 0.9(1) = 0.832$. This is constant across all worlds.

  For $u = (1/3, 1/3, 1/3)$:
  $\beta(u, w) = -[(2/3)^2 + (1/3)^2 + (1/3)^2] = -[4/9 + 1/9 + 1/9] = -6/9 \approx -0.67$.
  $\sigma(u, w) = 0$, because $1/3 < 0.4$.
  Total Accuracy: $A(u, w) = 0.1(-0.67) + 0 = -0.067$.

  Since $0.832 > -0.067$ in every world, $b^*$ strictly dominates $u$.

  **(ii) Non-Dominance by Coherent Functions**
  Let $c$ be any coherent credence function, so $\sum c_i = 1$ and $c_i \ge 0$. By the Pigeonhole Principle, at least one component $c_k$ must be $\le 1/3$. Since $1/3 < 0.4$, at the world $w_k$ where $H_k$ is true, the Safety Term $\sigma(c, w_k) = 0$.
  The maximum possible value for $\beta$ is $0$ (achieved only if $c$ matches the truth values exactly, e.g., $(1,0,0)$).
  Thus, at world $w_k$, the maximum possible accuracy for $c$ is $A(c, w_k) = 0.1(0) + 0.9(0) = 0$.
  However, we established in (i) that $A(b^*, w_k) = 0.832$.
  Therefore, at world $w_k$, $b^*$ scores higher than $c$. Since this holds for any coherent $c$ (each must have a 'weak' hypothesis below 0.4), no coherent function dominates $b^*$ everywhere.

  **(iii) Diagnosis of Violated Conditions**
  The result in (ii) contradicts the Accuracy Dominance Theorem for Probabilism, which states that every incoherent function is dominated by some coherent one. The failure lies in the violation of **Propriety** (and **Continuity**).
  Propriety requires that an agent maximises expected accuracy by reporting their true credences. Under $A$, an agent with true credence $p=(0.39, 0.39, 0.22)$ receives $\sigma=0$. By reporting $b'=(0.4, 0.4, 0.2)$, they incur a negligible loss in $\beta$ but gain $0.9$ in $\sigma$. Thus, truth-telling is not optimal; the rule incentivises inflation of credences to cross the safety threshold. Because $A$ is improper, it does not track epistemic utility correctly, allowing an incoherent function to appear undominated. The discontinuity in $\sigma$ is the specific mechanism breaking Continuity, which is required for Joyce's geometric proofs.

  **(iv) Contrast with Spherical Score**
  The Spherical Score is proper, meaning it incentivises truth-telling. However, it is scale-invariant: $S(b, w) = S(kb, w)$. This means the rule cannot distinguish between a coherent function $p$ (summing to 1) and an incoherent function $kp$ (summing to $k \neq 1$).
  The Accuracy Argument for Probabilism aims to show that coherence (specifically Normalisation, $\sum b_i = 1$) is epistemically required. If the scoring rule is indifferent to the scale of the credences, accuracy considerations alone cannot mandate that the sum equals 1. Propriety ensures the *ratios* of credences match the odds, but without a condition like Additivity or specific normalisation constraints, Propriety is insufficient to vindicate Probabilism. Both $A$ and the Spherical Score fail to vindicate Probabilism, but for different reasons: $A$ fails Propriety, while Spherical fails to penalise Incoherence of scale.

  **(v) Generalisation on $\lambda$**
  $A_\lambda$ is improper for any $\lambda > 0$.
  Proof: $\beta$ is a continuous function of $b$. $\sigma$ is discontinuous at the threshold $0.4$.
  Consider a true credence $p$ where the maximum component is $0.4 - \epsilon$ (for small $\epsilon > 0$). Reporting truth yields $\sigma=0$. Reporting $b'$ where the max component is $0.4$ yields $\sigma=1$.
  The loss in expected $\beta$ from shifting by $\epsilon$ is proportional to $\epsilon^2$ (due to the quadratic nature of Brier). The gain in expected $\sigma$ is $\lambda \cdot 1$.
  For any fixed $\lambda > 0$, we can choose $\epsilon$ sufficiently small such that the gain $\lambda$ outweighs the loss $(1-\lambda)O(\epsilon^2)$.
  Thus, there is always a region near the threshold where lying (inflating credence) yields higher expected accuracy. Therefore, no positive weight on the Safety Term preserves Propriety.

  ***

  ### Marking Scheme (25 Marks Total)

  **Part (i): Calculation [5 Marks]**
  *   **2 marks:** Correct calculation of $\beta$ and $\sigma$ for $b^*$. (Must show $0.832$).
  *   **2 marks:** Correct calculation of $\beta$ and $\sigma$ for $u$. (Must show $\approx -0.067$).
  *   **1 mark:** Correct conclusion that $b^*$ dominates $u$.
  *   *Penalty:* Arithmetic errors carried forward are penalised only once.

  **Part (ii): Dominance Proof [5 Marks]**
  *   **2 marks:** Identification that any coherent $c$ must have some $c_i \le 1/3$.
  *   **2 marks:** Argument that this forces $\sigma(c, w_i) = 0$ and max score $\le 0$ at that world.
  *   **1 mark:** Comparison showing $0.832 > 0$, proving non-dominance.
  *   *First-Class Move:* Explicitly noting that this breaks the *sufficiency* of the Joyce argument (Incoherent $\to$ Dominated), rather than claiming $b^*$ dominates *all* coherent functions.

  **Part (iii): Diagnosis [5 Marks]**
  *   **2 marks:** Identification of **Propriety** as the violated condition.
  *   **2 marks:** Explanation of the incentive to lie near the threshold (inflating credences).
  *   **1 mark:** Linking the violation to the failure of the dominance theorem (Improper rules do not guarantee coherent functions dominate).
  *   *Common Mistake:* Claiming the rule is "not additive." While true, Propriety is the central failure for the accuracy argument.

  **Part (iv): Spherical Contrast [5 Marks]**
  *   **2 marks:** Explanation of scale-invariance (indifference to sum of credences).
  *   **2 marks:** Argument that Propriety alone fixes ratios/direction but not magnitude/normalisation.
  *   **1 mark:** Conclusion that Probabilism (sum=1) cannot be derived from accuracy alone under this rule.
  *   *First-Class Move:* Distinguishing between failure of Propriety (Part iii) and failure of Normalisation vindication (Part iv).

  **Part (v): Lambda Generalisation [5 Marks]**
  *   **2 marks:** Correct verdict: Improper for all $\lambda > 0$.
  *   **3 marks:** Justification using Continuity vs. Discontinuity. Must argue that the jump in $\sigma$ outweighs the continuous loss in $\beta$ for small enough deviations.
  *   *2:1 Level:* Asserts the verdict correctly but offers only an intuitive example without the continuity argument.
  *   *First-Class Level:* Explicitly references the order of magnitude difference ($\epsilon$ vs $\epsilon^2$) or the topological discontinuity.

  ### Grading Guide: First vs. 2:1

  **First Class (20–25 Marks)**
  *   **Philosophical Precision:** In Part (ii), recognises that $b^*$ does not dominate *all* coherent functions (e.g., $(1,0,0)$ beats it at $w_1$), but correctly identifies that the *failure of coherent functions to dominate $b^*$* is what breaks the Joyce theorem. Avoids the claim that "incoherence is mandated" without qualification.
  *   **Technical Rigour:** In Part (v), provides a robust argument about continuity/discontinuity rather than just testing one number.
  *   **Synthesis:** In Part (iv), clearly distinguishes why Spherical fails (Scale) vs. why $A$ fails (Propriety), showing a deep understanding of the necessary conditions for the Accuracy Argument.

  **Upper Second (2:1) (15–19 Marks)**
  *   **Competent Maths:** Gets the arithmetic in (i) and (ii) correct.
  *   **Standard Diagnosis:** Identifies Propriety violation in (iii) but may rely on rote definitions without explaining *why* it breaks the dominance argument.
  *   **Lambda:** Correctly identifies that $\lambda > 0$ fails but relies on a specific numerical example (e.g., testing 0.39 vs 0.4) rather than a general proof about continuity.
  *   **Nuance:** May accept the prompt's implication that "incoherence is mandated" without noting that $b^*$ is not strictly dominant over all coherent options.

  **Common Mistakes Costing Marks**
  *   **"Not Proper" Stopper:** Stating "The rule is not proper, therefore the argument fails" in Part (iii) without explaining the link between Propriety and Dominance. (Costs 2 marks in Part iii).
  *   **Arithmetic Errors:** Failing to square the differences in the Brier score calculation. (Costs marks in Part i).
  *   **Coherence Confusion:** Assuming $b^*$ must sum to 1 or trying to normalise it during calculation. (Costs 3 marks across Parts i & ii).
  *   **Spherical Misunderstanding:** Claiming the Spherical score is "improper" because it doesn't vindicate Probabilism. (Costs 2 marks in Part iv; Propriety and Probabilism-vindication are distinct).
