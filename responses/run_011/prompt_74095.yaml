answer: |-
  The hum of the Loom was the sound of the universe holding its breath. It vibrated through the floorplates of the Office of Apportionment, a constant, low-frequency reminder that reality was not a given, but a scheduled maintenance issue.

  Elara rubbed her eyes. The glow of her terminal cast a sickly pallor over the stack of Continuity Forms waiting for her signature. On her desk sat a cold cup of coffee and a paperweight made of fused silica, etched with the Office seal: a tree with infinite branches, most of them pruned away.

  "Case 8940," she muttered, tapping the screen. "Sentencing adjustment. Defendant requests a split."

  It was a standard request. The defendant had been found guilty of resource hoarding. Instead of ten years in a heavy branch, he was petitioning for a probabilistic sentence: a fifty-fifty split between freedom and incarceration. Theoretically clean. Amplitudes equal. $|\alpha|^2 = |\beta|^2 = 0.5$.

  Elara hovered her cursor over the designation field. She had to label the branches. Prime and Secondary. It was a legal fiction, purely administrative. The Prime branch got the tax benefits; the Secondary got the jail cell. But since the amplitudes were identical, the physics offered no reason to prefer one outcome over the other. Both futures were equally real. Both contained a version of the defendant who remembered signing the form.

  "Why do I have to pick?" she asked the empty room.

  "Because one of them has to file the taxes," said Kael, leaning over her cubicle wall. Kael was a senior auditor, a devout adherent of the Sufficient Weight Doctrine. He looked like he hadn't slept since the last budget cycle.

  "It's a symmetric split, Kael. Decision theory says I should be indifferent. Care equally for both selves. So why does the Prime self get the pension and the Secondary self get the handcuffs?"

  "Because the Court requires a locus of responsibility," Kael said, tapping his pen against her partition. "If you don't assign priority, you get paradoxical inheritance claims. Just pick one. Flip a coin if you have to. The physics doesn't care, but the ledger does."

  Elara selected *Prime* for the freedom branch. It felt like lying. She was drawing a line on a map where there was no border. She signed the form. The machine downstairs whined, accepting the instruction. Somewhere, a man was about to become two men, and only one of them would be allowed to vote.

  She moved to the next file. Case 9002. Her stomach tightened.

  *Subject: Ren Vane. Procedure: Neuro-Stabilization Trial.*

  Ren. He had called her last night, his voice crackling over the comms, trying to sound brave. "It's just a split, El. One goes home, one… doesn't. You know how it works."

  She knew how it worked. The Trial required a specific amplitude schedule to maintain statistical validity across the Loom's medical databases. The protocol demanded a tripartite split: 0.5 probability of full recovery, 0.25 probability of chronic degradation, 0.25 probability of termination.

  Elara pulled up the amplitude scheduler. The bars glowed on her screen: one heavy green bar, two slender red ones.

  The problem wasn't the split. It was the threshold.

  Last month, the Office of Apportionment had updated the Sufficient Weight Doctrine. Due to resource strain—too many thin branches claiming rations, too many ghost-cities demanding power—the minimum amplitude for legal personhood had been raised from 0.2 to 0.3.

  Anything below 0.3 was "thin." Thin branches were not recognized for census purposes. They had no standing. People downstream of a thin split didn't inherit property. They couldn't testify in court. In the eyes of the Loom, they were background noise.

  Ren's survival branch was the 0.5. That was safe. But the interference patterns specific to his neural topology—something about the way his quantum state coupled with the splitter—meant that his *continuity of consciousness* was projected primarily into the 0.25 branch.

  It was a known glitch in the trial design. The "heavy" version of Ren would be a hollow shell, biologically alive but cognitively vacant. The "real" Ren, the one who remembered her, the one who loved her, would wake up in the 0.25 branch.

  Under the old threshold, he was safe. Under the new one, he was thin.

  If she signed the form as written, Ren would wake up in a branch that legally didn't exist. He would be a ghost in the machine, unable to claim his inheritance, unable to marry her, unable to prove he was him. He would be alive, but he wouldn't count.

  "Having trouble with the weights?"

  Elara minimized the window. It was Jory from the next desk. Jory was quiet, mostly kept his head down, but everyone knew he attended Tally meetings in the lower hab rings. The Tally believed in branch counting. One branch, one person. Amplitude was just density, not value.

  "The threshold changed," Elara said quietly.

  "Ah," Jory said. He didn't look up from his own screen. "The Doctrine always tightens when the budget gets loose. Easier to prune the thin than feed the heavy."

  "If I flag this as a continuity error, the Trial gets paused. Ren dies in all branches. The treatment never ships."

  "So you sign," Jory said. "You let him be thin."

  "He's a person, Jory."

  "Under the Tally, he's a third of the outcome," Jory said, finally looking at her. His eyes were tired. "Under the Doctrine, he's a rounding error. But here's the thing, El. How do we know the weights are real?"

  "Don't start."

  "I'm serious. We calibrate the splitters based on frequency counts from past splits. We say, 'Look, the heavy branch happens more often.' But we only count the branches that meet the weight threshold. We're using the conclusion to validate the premise. It's circular. We check the schedule by looking at the frequencies, but we only see the frequencies because we built the schedule that way."

  Elara stared at him. It was the argument she heard in the breakroom, whispered over stale tea. The physicists said it was settled—rational agents *must* bet on squared amplitude or they'd lose money in the long run. The philosophers said it was just axioms smuggled in as logic. The clerks knew it was just paperwork.

  "The auditors check the frequencies," Elara said. "If I boost Ren's branch to 0.35 to clear the threshold, I break the trial protocol. The frequencies won't match the expected distribution. The audit fails."

  "So fudge the other side," Jory said. "Take from the heavy branch. Make the recovery shell slightly lighter. Who's going to notice a few percentage points on a hollow man?"

  "That's fraud."

  "That's mercy," Jory corrected. "Or are you one of them? Do you only care about the selves that carry the most weight?"

  Elara looked back at her screen. The cursor blinked next to the amplitude field.

  She thought about the 50/50 case she'd just processed. The defendant who was about to split into a free man and a prisoner. She had assigned the freedom to the Prime branch arbitrarily. Why? Because the system demanded a hierarchy. The physics said they were equal. The law said one was realer than the other.

  Now she held the pen for Ren.

  If she followed the Doctrine, she was being rational. She was maximizing the utility of the heavy branches, where the most "measure" of existence resided. She was following the decision-theoretic proof that kept the Loom's economy from collapsing into paradox. She was ensuring that the trial data remained valid for future patients, potentially saving thousands of heavy lives.

  If she followed the Tally, she was saving Ren. She was acknowledging that the person in the 0.25 branch felt pain just as sharply as the person in the 0.5 branch. She was admitting that the threshold was a political line drawn in sand, not a law of nature.

  But if she fudged the numbers, she risked the audit. If the audit failed, the Trial was voided. Ren died in *every* branch. The treatment was scrapped. Thousands of future patients stayed sick.

  It was a trolley problem, but the tracks were made of probability amplitudes.

  "Deadline is in ten minutes," Kael called out from his office. "Don't let the queue backlog, Elara."

  She opened the adjustment field. Her finger hovered over the keyboard.

  She could shift 0.05 from the heavy branch to Ren's branch. It would bring him to 0.30. Exactly on the line. It would barely register on the aggregate frequency stats. The auditors looked at large N, not single cases. It was a drop in the ocean.

  But it was a violation. It was an admission that the weights were manipulable, that "personhood" was a slider bar she could move to suit her emotions. It undermined the entire fiction of the Sufficient Weight Doctrine. If clerks started moving amplitude to save loved ones, the statistical integrity of the Loom collapsed. The probabilities would no longer match the predictions. The decision-theory bets would fail. Rational agents would lose money. The economy of existence would stutter.

  On the other hand, Ren would be real.

  She thought about his voice on the comms. *You know how it works.*

  Did she? Did anyone? The physicists claimed the math forced the answer. The philosophers claimed the math hid the question. The clerks just knew that someone had to sign the form, and the machine didn't care about the reason, only the input.

  Elara looked at the 50/50 case in her history log. *Prime: Freedom. Secondary: Incarceration.* She had decided which version of a man got to be free based on nothing but administrative convenience. She had played god with a coin flip.

  Now she had to play god with a life.

  The hum of the Loom seemed to grow louder, pressing against her temples. It was the sound of infinite copies of herself making this choice. In some branches, she signed. In some, she didn't. In some, she quit. In some, she screamed.

  But in this branch, the one she was sitting in right now, the cursor was blinking.

  She thought about the circularity Jory mentioned. They validated the weights by counting the branches, but they only counted the ones they decided were heavy enough to count. It was a snake eating its own tail. If she changed the weight, she changed the reality. Who was to say which reality was the correct one to preserve? The one that kept the ledger balanced, or the one that kept Ren alive?

  There was no theory to tell her. The Deutsch-Wallace proofs were for betting, not for loving. The envariance arguments were for symmetry, not for mercy.

  "Five minutes," Kael said.

  Elara took a breath. She typed in the adjustment.

  *0.50 → 0.45*
  *0.25 → 0.30*

  She paused. Her finger hovered over the *Enter* key.

  If she did this, she was a corrupt clerk. She was privileging her own attachment over the structural integrity of the apportionment system. She was saying that love outweighs logic.

  If she didn't, she was a faithful servant. She was upholding the rational order that kept the Loom from dissolving into chaos. She was saying that the many outweigh the one.

  Both arguments made sense. Both arguments felt like treason.

  She thought about the thin branches. The people who lived there, knowing they were rounding errors. Did they feel less pain? Did their love weigh less? The Doctrine said yes, effectively. The Tally said no.

  Elara closed her eyes. She couldn't know which choice was rational. There was no meta-branch where she could check the answer. There was only this desk, this form, and the hum of the machine waiting to be told what was real.

  She pressed *Enter*.

  The terminal chimed. *Schedule Accepted.*

  Down in the basement, the splitter spun up. The pitch changed, rising into a whine that vibrated in her teeth. Somewhere, Ren was stepping into the chamber. Somewhere, the universe was about to tear itself into three pieces, and she had just decided how much each piece was worth.

  Kael walked past her desk, glancing at her screen. He didn't stop. He didn't need to. The numbers were logged. He would see them in the audit.

  "Good work," he said, not looking at her. "Queue's moving."

  Elara watched the status light turn green. She didn't feel relief. She didn't feel guilt. She just felt the hum, vibrating through the floor, through her chair, through her bones.

  She opened the next file. Case 9003. Another split. Another set of weights. Another person waiting to see how much of them survived.

  She picked up her stylus. The ink was cold.
