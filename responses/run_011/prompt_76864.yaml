  # Session Plan: Intuitionistic Logic for CS & Philosophy

  ## 1. Run Sheet (120 Minutes)

  **00:00 – 00:25 | Segment 1: The Shift (Proofs as Data)**
  *   **Activity:** Define propositions not as "True/False" but as "Tasks/Types". A proof is a program that completes the task.
  *   **Board:** Write `Prop := Type`, `Proof := Program`. Map `A /\ B` to `(A, B)`, `A -> B` to `A -> B`.
  *   **Justification:** You cannot explain why LEM fails until you define what a proof *is*. If you start with axioms, CS students see "restrictions" and philosophers see "truth tables." This aligns everyone on *construction*.
  *   **Misconception Risk:** If skipped, philosophers revert to truth-tables (thinking LEM is "false") and CS students think it's just "classical logic with bugs."

  **00:25 – 00:55 | Segment 2: The Carrying Example (Disjunction & LEM)**
  *   **Activity:** Introduce the example. Ask: "Can you write a function `decide : forall P. P \/ (P -> False)`?"
  *   **Board:** Write the type signature. Draw a box around `\/`. Label it "Must return Left or Right + Proof".
  *   **Justification:** This kills the "LEM is false" myth immediately. We aren't saying `P \/ ~P` is false; we are saying we cannot *inhabit* the type universally.
  *   **Misconception Risk:** If you discuss Negation before Disjunction, they will think the problem is `~P` rather than `\/`. **Deadline:** The belief "Constructivists deny excluded middle" must be dead by **Minute 45**. If alive after, they will think intuitionists assert `~(P \/ ~P)`, which is contradictory.

  **00:55 – 01:25 | Segment 3: Negation & Double Negation (DNE)**
  *   **Activity:** Define `~P` as `P -> False`. Show `P -> ~~P` works (easy function). Show `~~P -> P` fails (no function).
  *   **Board:** Write `~~(P \/ ~P)`. Show this *is* inhabitable (you can refute the refutation). Contrast with `P \/ ~P`.
  *   **Justification:** Now that they know `\/` requires a witness, they see DNE fails because `~~P` doesn't give a witness for `P`. This addresses "Just classical minus LEM"—it's not deletion, it's that DNE presupposes information we don't have.
  *   **Misconception Risk:** If done before Segment 2, they think DNE is the "root cause" rather than a symptom of the disjunction requirement.

  **01:25 – 01:35 | Break**
  *   **Reasoning:** Evening sessions lose energy. Reset attention.

  **01:35 – 01:50 | Segment 4: Loss of Firepower? (Glivenko)**
  *   **Activity:** State Glivenko's Theorem simply: "Classically valid iff Intuitionistically double-negatable."
  *   **Board:** `CPC |- P  <==>  IPC |- ~~P`.
  *   **Justification:** Reassures them they aren't losing truths, just direct proofs. Classical logic embeds into Intuitionistic logic via `~~`.
  *   **Misconception Risk:** If skipped, they leave thinking constructivism is "crippled logic."

  **01:50 – 02:00 | Segment 5: Closing Question & Wrap**
  *   **Activity:** Pose the closing question (see below). Collect answers. Summarize.
  *   **Justification:** Verifies learning objectives before they leave.

  ## 2. The Carrying Example

  **The Example:** The uninhabited type `forall P. P \/ (P -> False)`.
  **Board Work ( < 10 mins):**
  1.  Write the signature.
  2.  Ask: "What does a value of this type look like?" (Answer: A function that takes any proposition and returns either a proof of it or a proof of its impossibility).
  3.  Ask: "Can you implement this?" (Answer: No, that's a universal decider).
  4.  Ask: "Does that mean the type is `False`?" (Answer: No, it just has no inhabitants).

  **Why this survives the "Undecided Arithmetic" shrug:**
  A natural language example like Goldbach's Conjecture invites the objection: "Maybe we'll find out tomorrow." The type signature objection is structural: *No program can exist* that decides all propositions, regardless of future knowledge. It shifts the debate from "current ignorance" to "impossibility of construction."

  **Cost:** Philosophy students may need a 2-minute glossary on Curry-Howard. Pay this cost early in Segment 1. Do not switch to Kripke models; for this audience, Type Theory *is* the semantics they trust. Kripke models risk looking like "weird truth tables."

  ## 3. Misconception Map (Tied to Timeline)

  | Time | Segment | Misconception Targeted | Risk if Out of Order |
  | :--- | :--- | :--- | :--- |
  | **00:00** | **Intro** | "Logic is about Truth Values." | If not killed here, philosophers will interpret `\/` as boolean OR, making LEM failure look like a contradiction. |
  | **00:45** | **Disjunction** | **"Constructivists hold LEM is *false*."** | **CRITICAL DEADLINE.** If this belief survives past Minute 45, they will think intuitionists prove `~(P \/ ~P)`. This poisons all downstream logic because `~(P \/ ~P)` is absurd in *both* systems. |
  | **01:10** | **Negation** | "It's just Classical Logic minus LEM." | If discussed before Disjunction, they think DNE is an arbitrary axiom removal. They need to see `\/` requires a witness first to understand *why* DNE fails structurally. |
  | **01:40** | **Glivenko** | "Constructivism loses firepower." | If left to the end without Glivenko, they leave thinking intuitionistic logic is "broken" classical logic rather than a different foundation. |

  ## 4. What to Leave Out (Say This Out Loud)

  **Keep:** The Glivenko Theorem (`CPC |- P <==> IPC |- ~~P`).
  **Drop:** Diaconescu's Theorem (Choice + Extensionality -> LEM) and Brouwer's Continuous Functions.

  **Script Note:** At Minute 95, say: *"You might read online that constructivism proves all functions are continuous, or that Choice implies LEM. I am leaving those out. They are specific to set theory or analysis. They are traps that eat twenty minutes and don't help you understand the logic of propositions. Glivenko matters because it tells you what happens to your classical truths."*

  ## 5. Closing Question

  **Question:** "Why is `~~(P \/ ~P)` provable, but `P \/ ~P` is not?"

  **Good-but-not-great answer:** "Because double negation elimination isn't allowed in intuitionistic logic, so we can't cancel the negatives." (Recites the rule without understanding the meaning).

  **Real answer:** "Because proving 'it's impossible to refute the disjunction' doesn't give us the specific witness (Left or Right) required to construct the disjunction itself." (Understands proof conditions vs. truth conditions).

  Carrying example: The uninhabited universal decision procedure type.
