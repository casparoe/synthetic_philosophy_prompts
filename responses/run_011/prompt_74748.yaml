      *   Why age survives? (Universal/Transitory vs. Caste).
      *   Probability/Reference classes? (Normative selection of classes).
      *   Required vs. Comfortable? (Direct ban vs. Outcome equality).
      *   Proxies/Real Work? (Symbolic vs. Material, need to tackle indirect discrimination).

  7.  (Drafting the response based on these points.) *Self-correction during drafting: Make sure to explicitly mention the Test-Achats ruling (2011) as context for the EU ban.* *Ensure the distinction between "fairness as accuracy" and "fairness as equity" is clear.*

  8.  **Final Output Generation** (Proceed to generate response).
answer: |-
  This is one of the cleanest examples of the clash between **actuarial fairness** (price equals risk) and **social fairness** (price equals equity). Your friend is arguing from the standpoint of statistical consistency; you are arguing from the standpoint of normative ethics. Both are logically sound within their own frameworks, which is why you couldn't pin the point down.

  To defend the coherence of the ban, you have to abandon the idea that insurance pricing is purely a mathematical exercise in risk prediction. You have to accept that it is a **political technology** that distributes social goods.

  Here is the reconstruction of the theory that makes the ban coherent, followed by the breakdown of what is required versus what is incidental, and finally, the verdict on whether the ban actually does any work.

  ---

  ### 1. Reconstructing the Theory of Fairness
  To make the ban coherent, you must reject your friend's premise: that the "wrong" in insurance pricing is being treated as a member of a statistical class. If that were the only wrong, he would be right—you'd have to ban all rating factors.

  Instead, the ban presupposes a theory of **Anti-Subordination** combined with **Social Solidarity**.

  **The Wrong is Not Classification, It is Caste**
  The theory holds that not all statistical classes are morally equivalent.
  *   **Age** is a universal, transitory trajectory. Everyone who lives long enough becomes "old." Pricing on age is viewed as pricing on a *phase of life*, not a permanent social status. It does not create a permanent underclass; it creates a temporary disadvantage that shifts over time.
  *   **Sex/Gender** is a permanent, binary (in the context of insurance law) caste. If you price on sex, you create two permanent teams: Team Pay-More and Team Pay-Less. You never switch teams.
  *   **Postcode/Occasion** are viewed (theoretically) as mutable or at least reflective of *lifestyle choices* and *current circumstances*, rather than inherent biological identity.

  **The Theory:** The ban asserts that insurance should not reinforce historical systems of oppression. Sex is a "protected characteristic" because it has been used historically to systematically disadvantage a specific group. Age has not. Therefore, using sex as a rating factor is not just a statistical prediction; it is an **expressive harm**. It signals that your biological category determines your economic worth.

  **Why "Unchosen" Isn't the Test**
  You asked why age survives if "unchosen" is the test. It isn't. The test is **Social Salience + Immobility**.
  *   **Sex:** Unchosen, Immutable, Socially Salient (historically used for discrimination). -> **Banned.**
  *   **Age:** Unchosen, Immutable, Universally Shared (everyone ages). -> **Allowed.**
  *   **Postcode:** Chosen (mostly), Mutable, Correlates with Race/Class. -> **Allowed (but legally vulnerable).**

  The coherence lies in preventing the insurance market from calcifying social hierarchies. If women pay more for car insurance simply for being women, the market validates the idea that women are inherently riskier citizens. If 20-year-olds pay more, the market validates that *inexperience* is risky, which is a causal claim, not a caste claim.

  ### 2. Probability and Reference Classes
  Your friend's point about overlapping reference classes is statistically true but philosophically naive.

  Every individual sits in infinite reference classes (e.g., "male," "under 25," "drives a Ford," "lives in London," "has blue eyes"). Actuaries must choose *which* classes to prioritize. This choice is never purely mathematical; it is normative.

  **The Ban's View on Probability:**
  The ban rejects the idea that there is a "true" probability attached to an individual. It acknowledges that **risk is constructed by the categories we choose to measure.** By forbidding the use of sex, the EU is saying: *"We know sex predicts risk. But we choose to construct a risk pool where that prediction is ignored in favor of social cohesion."*

  It forces the insurer to move the "sex risk" into the general pool. Men subsidize women (in annuities) or women subsidize men (in car insurance). This is not an error; it is a feature. It treats insurance as a mechanism of **solidarity** rather than pure **risk segmentation**.

  ### 3. Strictly Required vs. Fits Comfortably
  This is where you can separate what the law *does* from what people *wish* it did.

  **Strictly Required by the Practice:**
  1.  **Direct Discrimination:** Insurers cannot ask for sex or use it as a variable in the algorithm.
  2.  **Expressive Norm:** The market cannot officially state that one sex is more expensive than the other.

  **What Fits Comfortably (But Isn't Required):**
  1.  **Outcome Equality:** Many people assume the ban means men and women will pay the same. They won't necessarily. If women cluster in postcodes with higher theft rates, they will still pay more. The ban only requires the *variable* be removed, not the *outcome* be equalized.
  2.  **Elimination of Proxy Discrimination:** The ban does not strictly require banning postcodes, even if postcodes proxy for sex (e.g., if single mothers cluster in specific areas).

  **Your Friend's Theory:**
  Your friend holds a theory of **Actuarial Fairness**. Under this theory, the ban is *incoherent*. The only way his theory fits the practice is if he argues that sex is not actually predictive of risk once other factors are controlled for. (Evidence suggests it *is* predictive, which is why the industry fought the ban). So, strictly speaking, his theory is incompatible with the ban unless he accepts non-market values.

  ### 4. Does the Ban Change Anything? (The Proxy Problem)
  This is the hardest pill to swallow. If postcode and occupation soak up the variance that sex used to explain, **the ban is largely symbolic regarding economic outcomes.**

  *   **Scenario:** Young men live in Postcode A (high risk). Young women live in Postcode B (low risk).
  *   **Result:** Even without using sex, the insurer charges Postcode A more. Young men still pay more. Young women still pay less.
  *   **Conclusion:** The financial burden hasn't shifted; only the label on the invoice has.

  **However, it does do "Real Work" in two specific ways:**
  1.  **Algorithmic Transparency:** It prevents the "black box" from officially codifying sex. If sex is a direct variable, it is easy to audit. If it is hidden inside a "postcode risk score," it is harder to challenge. Banning the direct variable forces the discrimination into the open (via proxies) where it can be legally challenged as *indirect discrimination*.
  2.  **Normative Shift:** It changes the *justification* for pricing. An insurer cannot tell a woman, "You pay more because you are a woman." They must say, "You pay more because of your car/area." This shifts the burden of proof. It forces the insurer to justify the risk based on behavior or environment, not biology.

  **What Would Have to Change for It to Do "Real Work"?**
  For the ban to materially alter financial outcomes rather than just labels, one of two things must happen:
  1.  **Ban the Proxies:** You would need to ban postcode or occupation if they correlate too highly with protected characteristics (Indirect Discrimination enforcement). This is legally possible in the EU but technically difficult for insurers to model without.
  2.  **Community Rating:** You would need to move to a system where everyone pays the same base rate regardless of risk factors (like the NHS or basic state pensions). This abandons risk-based pricing entirely.

  ### Summary for Your Argument
  You can tell your friend this:

  "The ban isn't incoherent; it just prioritizes a different definition of fairness. You are arguing for **Actuarial Fairness** (price = individual risk). The EU law argues for **Social Fairness** (price should not reinforce historical caste systems).

  It allows age because age is a universal trajectory, not a permanent caste. It allows postcode because that is theoretically mutable and behavioral, even if it correlates with race.

  The ban doesn't pretend that statistical classes don't exist. It pretends that **some classes are morally off-limits for profit calculation.** If postcode proxies for sex, the ban hasn't failed; it has just revealed that the inequality is deeper than insurance pricing—it's in housing and employment. The insurance ban stops the insurance industry from *compounding* that inequality with an official stamp of biological determinism."

  **The Verdict:** The practice is coherent if you accept that markets serve social ends, not just efficiency ends. It is arbitrary only if you believe accuracy is the only virtue in pricing.
