prompt: |-
  Just spent a couple hours arguing with a friend about insurance pricing and neither of us could pin down the actual point, so I'm bringing it to you.

  The practice: in the EU, since the end of 2012, an insurer can't use your sex to set your premium or your payout. But the same insurer is free to price you on your age, your postcode, your occupation, your claims record. Those seperate people into groups at least as sharply as sex ever did — postcode probably sharper, and it tracks race and income pretty closely.

  My friend says the ban is incoherent. If the worry is that you're being treated as a member of a statistical class rather than as yourself, you'd have to outlaw all of it, because nobody is ever charged as an individual — only as a member of whichever class the actuary happened to pick. I said there's a principled line and then couldn't say where it was.

  So what does banning one rating factor and not the rest presuppose? Reconstruct the theory of fairness — or of what counts as "you" — that makes it coherent instead of arbitrary. Is the assumed wrong located in the classifying, in where the money ends up, or in the trait being unchosen? If unchosen is the test, why does age survive it? And does the practice need any particular view of what a probability attached to one person even means, given that they sit in a hundred overlapping reference classes at once?

  Also tell me what's strictly required by the practice versus what just fits it comfortably — I suspect several theories license it, including one my friend would happily accept. And: if postcode and occupation soak up most of what sex used to explain, does the ban change anything at all? What would have to change for it to do real work?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Issue:** The EU ban on using sex/gender in insurance pricing (since 2012) vs. the allowance of other factors (age, postcode, occupation, claims history).
      *   **The Friend's Argument:** The ban is incoherent/arbitrary. If statistical discrimination is the problem, *all* rating factors should be banned. Since we allow others (which correlate with protected traits like race/income), the sex ban is pointless or hypocritical.
      *   **The User's Position:** There *is* a principled line, but they can't articulate it.
      *   **Key Questions to Answer:**
          1.  What theory of fairness/identity makes the ban coherent (not arbitrary)?
          2.  Where is the "wrong" located? (Classifying? Distributional outcomes? Unchosen traits?)
          3.  Why does age survive if "unchosen" is the test?
          4.  What does this imply about probability/reference classes?
          5.  Distinguish between what is *strictly required* by the practice vs. what *fits comfortably*.
          6.  Does the ban actually change anything if proxies (postcode/occupation) exist? What would make it do "real work"?

  2.  **Initial Brainstorming & Theoretical Frameworks:**

      *   *Actuarial Fairness:* Price = Risk. Any factor correlated with risk is fair. (Friend's view).
      *   *Social Fairness/Equity:* Some factors are morally off-limits regardless of predictive power. (User's intuition).
      *   *Protected Characteristics:* Legal/ethical distinction between mutable/immutable, sensitive/non-sensitive.
      *   *Anti-Discrimination Law:* Direct vs. Indirect discrimination.
      *   *Philosophical Theories:* Rawls (veil of ignorance), Nozick (entitlement), Anti-subordination.
      *   *The "Age" Problem:* Age is immutable but universally experienced. Sex is immutable but binary/categorical in a way that creates permanent classes.
      *   *Proxy Variables:* Postcode correlates with race/income. Is this indirect discrimination?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. It's a classic tension between *actuarial fairness* (accuracy) and *social fairness* (equity). Validate both the friend's logic (statistical consistency) and the user's intuition (moral distinction).

      *   **1. Reconstructing the Theory of Fairness (Why Sex is Different):**
          *   Need to move beyond "statistical classes" generally.
          *   *Theory A: Anti-Subordination.* Sex is a historically protected class used for systemic oppression. Age is not (in the same way). We all become old; we don't all become male/female.
          *   *Theory B: The "Morally Irrelevant" Trait.* Sex is seen as irrelevant to *agency* or *responsibility*. Age is often a proxy for experience (driving) or biological decay (health), which feels more causal. Sex is often seen as purely correlational without a causal mechanism individuals can influence.
          *   *Theory C: Social Solidarity.* Insurance is a social technology. We agree to pool risk on some dimensions (sex) to prevent social fragmentation, but not others (smoking).
          *   *Addressing the "Unchosen" Test:* Age is unchosen, but it's *universal* and *transitory*. Sex is permanent and divides the population into fixed castes.

      *   **2. Locating the Wrong:**
          *   Is it the classifying? No, because age is allowed.
          *   Is it the money? Partially (distributional impact).
          *   Is it the trait? Yes, specifically *protected characteristics*.
          *   *Conclusion:* The wrong is **expressive harm** + **historical subordination**. Using sex says "your biological category defines your worth." Using age says "your stage in life defines your risk profile."

      *   **3. Probability and Reference Classes:**
          *   The friend is right that everyone sits in many classes.
          *   The ban presupposes that *some* classes are morally "sticky."
          *   It rejects the idea that "probability attached to one person" is purely objective. It acknowledges that choosing *which* class to prioritize is a normative political decision, not just a mathematical one.

      *   **4. Strictly Required vs. Fits Comfortably:**
          *   *Strictly Required:* Direct use of sex data is forbidden.
          *   *Fits Comfortably:* The idea that this reduces overall inequality. (This is shaky if proxies exist).
          *   *Friend's Theory:* "Actuarial Fairness." This *can* fit if you argue sex isn't actually predictive once other factors are controlled for (but the EU ban happened *because* it was predictive). So the friend's theory actually *conflicts* with the ban unless they accept non-actuarial values.

      *   **5. Proxies and "Real Work":**
          *   If postcode/occupation soak up the variance, is the ban symbolic?
          *   *Yes, largely.* But symbolism matters (expressive law).
          *   *To do real work:* You need to ban the *proxies* (indirect discrimination) or regulate the *outcome* (community rating).
          *   *The "Real Work" Test:* If women still pay more because of postcode, the ban failed on outcomes but succeeded on norms. To fix outcomes, you need to address the underlying socioeconomic correlations (housing, jobs).

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on Age:* Don't say age is "chosen." It's not. Emphasize the *universal trajectory* aspect.
      *   *Correction on Proxies:* EU law *does* technically cover indirect discrimination, but it's hard to enforce in insurance. Need to mention that.
      *   *Philosophical depth:* Bring in the distinction between *brute luck* (sex) and *option luck* (occupation/smoking), though sex is brute luck, so is age. The distinction must be about *social salience*.
      *   *The "Incoherence" Charge:* The friend says it's incoherent. I need to show it's *normatively consistent* even if *statistically inconsistent*. It prioritizes social values over statistical purity.

  5.  **Final Polish:**
      *   Structure with clear headings.
      *   Keep the tone analytical but accessible.
      *   Ensure all parts of the prompt are answered.
