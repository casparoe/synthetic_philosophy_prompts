      *Refining the "Common Slip":* Source 5 and 7 both have a weird typo (e.g., "The sun rose in the West" or a specific wrong name). This teaches "Stemmatics."

      *Refining the "Silence":* Source 8 is a "Daily Court Log." If the Treaty happened, it should be there. It's not. But Source 4 says it did. Is Source 4 lying or is Source 8 missing pages? Metadata says Source 8 is complete for that month. This teaches "Argument from Silence."

      *Let's finalize the Setting:* **The Kingdom of Aethelgard** (sounds generic enough). **The Incident:** The death of Envoy Varrus during negotiations with the neighboring **Ostrara**.

      *Wait, one check on Rigging 1:* "one text that looks like an independent witness but is really an epitome of another, lost one."
      *   Okay, Source C is an epitome of a *lost* Source A. But Source A is also in the dossier? No, "lost one" implies the original is gone.
      *   *Adjustment:* Source 3 is a 12th-century summary of a 2nd-century history (Source 2). Source 2 is in the dossier. So Source 3 adds no new info, just repeats Source 2.
      *   *Wait, prompt says:* "epitome of another, lost one." Okay, so the original is *not* in the dossier. Source 3 summarizes Source X (lost). But Source 1 (Inscription) matches Source X. So Source 3 and Source 1 look like they agree, but Source 3 is just copying Source X which copied Source 1? No, that's too complex.
      *   *Simpler:* Source 3 (Chronicle) claims to be independent. Metadata reveals it is a summary of Source 2 (Letter). So they aren't independent.
      *   *Strict adherence to prompt:* "one text that looks like an independent witness but is really an epitome of another, lost one."
      *   Okay, I will make Source 3 an epitome of a *lost* work. But to make the point land, there needs to be another source that *also* relied on that lost work, or the student thinks Source 3 is independent of Source 2.
      *   *Decision:* Source 3 is an epitome of a Lost Source L. Source 2 is the actual Letter. They agree. Students think 2 sources. Metadata reveals Source 3 is just a summary of Source 2 (wait, if Source 2 is in the packet, it's not lost).
      *   *Re-reading prompt:* "epitome of another, lost one". Okay. So the *original* is lost. The *epitome* is in the packet.
