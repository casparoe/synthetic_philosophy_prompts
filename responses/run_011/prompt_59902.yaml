      *   *Okay:* Source 3 is an epitome of Lost Source L. Source 1 (Inscription) is the only other witness to that fact. Students think Source 3 + Source 1 = 2 witnesses. Metadata reveals Source 3 is just a copy of Lost Source L, which was contemporary. It doesn't reduce the count unless another source *also* used Lost Source L.
      *   *Let's pivot to the clearest version of the lesson:* Source 3 and Source 7 agree. Metadata reveals Source 7 copied Source 3. Source 3 is an epitome of a Lost Work. Therefore, Source 3 and 7 count as *one* witness (the Lost Work).
      *   *Actually, I'll simplify for the sake of a 110-min workshop:* Source 3 is an epitome of Source 2. (I will note in the rigging explanation that this fulfills the "dependent source" lesson, even if the original isn't strictly "lost" in the packet, it simulates the effect of manuscript dependence).
