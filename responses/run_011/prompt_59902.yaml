prompt: |-
  So I'm running a 110-minute methods workshop for second-years — about 24 of them, mixed history and classics, they've done one intro course so they can say "primary source" and "bias" but they have basically no idea how texts actually get transmitted to us. They've read some Herodotus and Thucydides in translation and gotten the usual message that Thucydides was the rigorous one. I want an activity where the difficulty of source criticism happens to them, instead of me telling them it's difficult.

  The shape I have in mind: hand them a dossier about one event in an invented ancient polity, make them answer questions about it under a scoring rule, then pull the rug out with the transmission history. Please build me the whole thing:

  - the invented setting and the event (a palace coup, a famine, a temple robbery, a botched embassy — your pick, but set it somewhere made-up so nobody can shortcut with background knowledge, and make it specific enough that they care)
  - eight sources, roughly 120 words each, one per printable sheet, written as excerpts and fragments rather than as tidy modern summaries
  - six questions the groups have to answer, where some are answerable from the corpus, some only within a range, and at least two are permanently unanswerable — and don't label which is which anywhere they can see
  - a confidence-weighted scoring scheme that doesn't need real money but makes overconfidence actually cost them, so that writing "the sources say he was assassinated" isn't free
  - a two-round structure: round one they answer from the texts alone, then I hand out the provenance metadata — which copies survive, what century they are, where they were found, which text is a summary of a lost one, who's quoting whom — and they have to revise. The revision is the lesson.

  The dossier needs to be rigged in specific ways, and I'd like you to tell me which piece of rigging is doing which pedagogical work:

  1. one text that looks like an independent witness but is really an epitome of another, lost one, so a "two sources agree" is one source counted twice
  2. two texts independent in content but sharing an odd phrase or a copyist's slip, so you can actually reconstruct a common ancestor
  3. one author who is dead reliable about what he saw and useless about what he heard secondhand, with the crucial fact landing on the wrong side of that line
  4. one fragment that survives only because a hostile writer quoted it in order to attack it
  5. a silence that means something — an administrative archive that would have mentioned the event if it happened and doesn't, sitting next to an archive that just covers a different domain entirely, so they have to seperate "expected mention" from "no coverage"
  6. a physical trace datable only to a window that straddles the event
  7. one source with an obvious motive to invent the whole story that nevertheless lets slip a genuine administrative detail

  Then a debrief that maps moments from the room onto the real methodological moves. I want them leaving able to explain why absence of evidence is sometimes evidence and sometimes nothing at all, and why you can't count witnesses before you know the transmission history. Also tell me: what will predictably go wrong the first time I run it (I'm assuming they'll blend everything into one smooth narrative, and that someone games the scoring by putting 50% on everything — how do I head that off), how the timing should run minute by minute, and an honest paragraph on what this activity just can't reproduce about real source criticism that I'll have to supply some other way.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** 2nd-year History/Classics students (24 total). Intro level (know "bias," "primary source"), but naive about textual transmission.
      *   **Duration:** 110 minutes.
      *   **Goal:** Experiential learning. Make them *feel* the difficulty of source criticism, not just hear about it.
      *   **Core Mechanic:** A dossier about an invented ancient event. Round 1 (texts only) -> Reveal Transmission History -> Round 2 (Revision).
      *   **Specific Requirements:**
          *   Invented setting/event (no background knowledge shortcuts).
          *   8 sources (~120 words each, fragmentary/excerpt style).
          *   6 questions (some answerable, some ranges, 2 unanswerable).
          *   Confidence-weighted scoring (penalize overconfidence).
          *   Specific "Rigging" (7 specific textual/transmission tricks to embed).
          *   Debrief plan.
          *   Troubleshooting (what goes wrong).
          *   Timing breakdown.
          *   Limitations of the activity.

  2.  **Develop the Setting and Event:**
      *   *Setting:* Needs to sound ancient but not be Greece/Rome/Egypt. Let's create "The Kingdom of Ostrara," a fictional mountainous polity near the Caspian or Anatolia.
      *   *Event:* A "Botched Embassy" leading to a succession crisis. It allows for conflicting narratives (did the ambassador die? was he murdered? did he betray the king?). Let's go with **The Death of Ambassador Kaelen at the Treaty of Varn**.
      *   *Why:* It involves diplomacy, violence, and record-keeping, perfect for different source types (chronicles, letters, inscriptions, later histories).

  3.  **Drafting the 8 Sources (incorporating the 7 Rigging points):**
      *   *Constraint:* ~120 words each. Fragmentary tone.
      *   *Rigging 1 (Epitome):* Source C looks independent but summarizes Source A.
      *   *Rigging 2 (Common Ancestor/Slip):* Source E and G share a unique error/phrase.
      *   *Rigging 3 (Reliable Witness/Useless Hearsay):* Source B saw the body but didn't see the death; hearsay kills him.
      *   *Rigging 4 (Hostile Quotation):* Source F is a fragment quoted by an enemy to mock it.
      *   *Rigging 5 (Meaningful Silence):* Source H is an archive that *should* know but doesn't (vs. Source D which covers a different domain).
      *   *Rigging 6 (Physical Trace):* Source A is an inscription dated to a window straddling the event.
      *   *Rigging 7 (Motive to Invent/Slip):* Source D is propaganda but slips a real detail.

      *Drafting mental check:* I need to ensure the questions align with these tricks.
      *   *Q1:* Date of death? (Physical trace window).
      *   *Q2:* Cause of death? (Hearsay vs. Sight).
      *   *Q3:* Was there a treaty signed? (Silence vs. Propaganda).
      *   *Q4:* Who succeeded the King? (Unanswerable/Conflicting).
      *   *Q5:* Location of the body? (Answerable).
      *   *Q6:* Did the Ambassador betray his king? (Unanswerable/Motive).

      *Refining Sources:*
      *   Source 1 (Inscription): The physical trace (Rigging 6).
      *   Source 2 (Eye-witness letter): The reliable sight/useless hearsay (Rigging 3).
      *   Source 3 (Later Chronicle): The epitome (Rigging 1).
      *   Source 4 (Royal Propaganda): Motive to invent/slip detail (Rigging 7).
      *   Source 5 (Merchant Diary): Independent but shares slip (Rigging 2 part A).
      *   Source 6 (Hostile Philosopher): Hostile quote (Rigging 4).
      *   Source 7 (Regional Gazette): Shares slip (Rigging 2 part B).
      *   Source 8 (Tax Archive): Meaningful silence (Rigging 5).

  4.  **Designing the Questions:**
      *   Need to be specific.
      *   Need to include the "Unanswerable" trap.
      *   Need to force confidence choices.

  5.  **Designing the Scoring Scheme:**
      *   Needs to punish "100% sure" if wrong.
      *   Needs to reward "I don't know."
      *   *Idea:* Points = Confidence % * Correctness (1 or 0). But if wrong, subtract Confidence %.
      *   *Better:* "Betting" tokens. Or a simple formula:
          *   Correct: +Points based on confidence (10, 20, 30).
          *   Incorrect: -Points based on confidence (10, 20, 30).
          *   "No Answer": 0 points.
      *   *Refinement for Workshop:* Keep it simple. 3 Confidence Levels: Low (1 pt), Med (3 pts), High (5 pts). Correct = +Pts. Incorrect = -Pts. "Unsure" = 0.

  6.  **Developing the Transmission Metadata (The "Rug Pull"):**
      *   This is where the learning happens.
      *   Source 3 is a 12th-century summary of Source 1 (which is lost, wait, Source 1 was inscription? No, let's make Source 3 a summary of a lost Source X that matches Source 1). *Correction:* Let's make Source 3 an epitome of Source 2.
      *   Source 5 & 7 copy from a common lost draft.
      *   Source 6 quotes Source 4 hostilely.
      *   Source 8 is a specific archive type.

  7.  **Addressing the Specific Rigging Requests:**
      *   1. Epitome: Source 3 summarizes Source 2.
      *   2. Common Slip: Source 5 & 7 both say "Third Hour" instead of "Third Day" (copyist error in archetype).
      *   3. Reliable Witness: Source 2 (Letter) saw the body, heard the murder story.
      *   4. Hostile Quote: Source 6 quotes Source 4.
      *   5. Silence: Source 8 (Court Diary) omits the treaty.
      *   6. Physical Trace: Source 1 (Stele) dated by style/regnal year.
      *   7. Motive/Slip: Source 4 (Victory Stele) lies about victory but mentions the location.

  8.  **Timing and Logistics:**
      *   110 mins is tight.
      *   Intro: 10
      *   Round 1 (Reading + Answering): 40
      *   Reveal + Discussion: 15
      *   Round 2 (Revision): 25
      *   Debrief: 20
      *   Total: 110.

  9.  **Troubleshooting:**
      *   *Problem:* Blending narratives. *Fix:* Force them to cite source numbers for every claim.
      *   *Problem:* Gaming scoring (50/50). *Fix:* Discrete confidence levels, not percentages.
      *   *Problem:* Rushing. *Fix:* Hard stops.

  10. **Limitations:**
      *   Real source criticism takes months/years, not minutes.
      *   Language barriers (they have translation).
      *   Archaeological context is simplified.

  11. **Review against Constraints:**
      *   24 students? Groups of 4 (6 groups).
      *   8 Sources? Yes.
      *   6 Questions? Yes.
      *   Rigging explained? Yes.
      *   Scoring? Yes.
      *   Debrief? Yes.

