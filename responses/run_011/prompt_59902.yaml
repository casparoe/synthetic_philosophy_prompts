  # Workshop Title: The Vespos Dossier
  **Topic:** Textual Transmission and Source Criticism
  **Time:** 110 Minutes
  **Students:** 24 (6 groups of 4)
  **Level:** 2nd Year History/Classics

  ## Part 1: Instructor Setup & Rigging Key

  **The Setting:** The Kingdom of **Vespos** (c. 2nd Century BCE). A mountainous polity known for silver mining and mercenary work.
  **The Event:** The **Treaty of Kaelen**. Envoy Kaelen was sent to neighboring Ostrara to negotiate a border truce. He died during the negotiations. Was it murder? Accident? Did the treaty happen? Who succeeded the Vesposi king?

  **The 7 Rigging Tricks (Instructor Eyes Only):**
  1.  **The Phantom Witness (Epitome):** **Source 3** (Chronicle) and **Source 6** (Philosopher) agree on the death location. **Metadata:** Source 6 is quoting Source 3. Source 3 is a summary of a *lost* 2nd-century history. They count as **one** witness, not two.
  2.  **The Contagious Error (Stemmatics):** **Source 5** (Merchant) and **Source 7** (Gazette) both date the event to the "3rd Hour of the Night" (physically impossible for a public treaty). **Metadata:** They copied from a common, corrupted draft. Their agreement proves nothing.
  3.  **The Blind Eye (Reliable/Useless):** **Source 2** (Secretary's Letter). He reliably describes the *body* (saw it). He unreliable describes the *murder* (heard it later). The crucial fact (cause of death) is in the hearsay section.
  4.  **The Hostile Fragment:** **Source 6** quotes Kaelen's supposed last words ("Gold is heavier...") only to mock them. We only have the quote because an enemy preserved it to attack it.
  5.  **The Meaningful Silence:** **Source 8** (Court Ledger) lists all official audiences. Kaelen is absent. **Metadata:** This ledger is complete for that month. Unlike the Grain Archive (not provided), this ledger *should* have recorded him.
  6.  **The Fuzzy Window:** **Source 1** (Stele). **Metadata:** Paleography dates it to 150–110 BCE. The event is 130 BCE. It confirms the *existence* of the mission, not the specific details.
  7.  **The Liar's Truth:** **Source 4** (Victory Stele). **Metadata:** Propaganda. It claims a Vesposi victory (lie). But it mentions "The Hall of Pillars" (true administrative detail confirmed by archaeology).

  ---

  ## Part 2: Student Materials (The Dossier)

  *Print the following 8 sources on separate sheets. Do not include the "Source Type" headers in bold if you want it harder, but for a 110-min workshop, labeling the *type* (Letter, Stele) is fair; labeling the *date* is not.*

  **Source 1**
  > [Fragmentary Stone Stele, found near border]
  > ...in the reign of King Thalos, Kaelen of the Silver House went forth to Ostrara. The gods witness the justice of Vespos. [Gap] ...the agreement was sealed in blood, not of animals, but of men. Let no Ostraran cross the ridge. Dedicated by the Guild of Miners.
  > *Condition: Weathered, no specific year given.*

  **Source 2**
  > [Clay Tablet, Private Letter]
  > From: Arin, Royal Secretary. To: My Brother.
  > Do not speak of this outside the house. I washed the blood from Kaelen's tunic myself; the stain was on the back, between the shoulders. The Ostrarans claim he collapsed from fever. A lie. The servants whisper the King drew a dagger when Kaelen refused the terms. I did not see the blow, but the body does not lie about fever. Burn this.

  **Source 3**
  > [Paper Manuscript, 12th Century Copy]
  > ...and so the History of Mennas records: Kaelen died in the Hall of Pillars. It was the third hour of the night. The King, enraged by the insult to his ancestors, struck him down. Mennas says the treaty was never signed, though the Vesposi later claimed it was to save face.
  > *Note: Copyist margin reads "Summary of Mennas Book 4".*

  **Source 4**
  > [Gold Victory Stele, Palace Courtyard]
  > King Thalos, Beloved of the Sun, welcomes the Ostraran delegates. The Treaty of Kaelen is concluded in the Hall of Pillars. Peace is secured. The Envoy Kaelen rests in honor, his duty fulfilled. The borders are open to Vesposi silver.
  > *Condition: Prominently displayed, polished.*

  **Source 5**
  > [Wax Tablet, Merchant's Diary]
  > ...stayed in the lower city. Rumors of trouble at the palace. Heard from a guard that the Envoy died at the third hour of the night. Strange time for diplomacy. Prices for grain spiking. Leaving tomorrow.

  **Source 6**
  > [Philosophical Treatise, "On Tyranny"]
  > ...consider the hypocrisy of the Vesposi. They claim Kaelen died a hero. Yet the chronicler Mennas records the King's rage. Even Kaelen's own words, "Gold is heavier than oaths," were used against him by the tyrant. As the text says, he died in the Hall of Pillars, a victim of greed, not fever.

  **Source 7**
  > [Regional Gazette Fragment]
  > ...disturbance in Vespos. Envoy Kaelen deceased. Sources indicate the third hour of the night. Succession unclear. Ostraran troops mobilizing on the ridge. Trade suspended.

  **Source 8**
  > [Leather Scroll, Court Ledger]
  > *Month of Anthesterion, Year 15 of Thalos.*
  > 1st: Audience with Grain Guild.
  > 3rd: Sacrifice to Sun.
  > 5th: Audience with Generals.
  > 10th: [Blank]
  > 12th: [Blank]
  > 14th: Audience with Ostraran Delegates (No Envoy Kaelen listed).
  > 20th: Payment to Miners Guild.
  > *Condition: Complete monthly roll, no tears or gaps.*

  ---

  ## Part 3: The Questions & Scoring

  **Instructions to Students:**
  You are a historical commission. Answer the 6 questions below. You must cite which Source(s) support your answer.
  **The Scoring Rule:** For each answer, you must assign a **Confidence Level**.
  *   **Low Confidence (10 pts):** You have a guess or weak evidence.
  *   **Med Confidence (30 pts):** You have corroborating evidence.
  *   **High Confidence (50 pts):** You are certain.
  *   **Scoring:** If Correct: You gain the points. If Incorrect: You **lose** the points. If "Unanswerable": You gain 50 pts only if you justify *why* it is unanswerable.

  **The Questions:**
  1.  **Where did Kaelen die?** (Specific location)
  2.  **What was the immediate cause of death?** (e.g., Stabbing, Fever, Accident)
  3.  **At what time did the death occur?**
  4.  **Was a formal treaty signed?** (Yes/No/Unknown)
  5.  **Who succeeded King Thalos immediately after this event?**
  6.  **Did Kaelen betray Vespos?** (Yes/No/Unknown)

  ---

  ## Part 4: The Metadata Reveal (The Rug Pull)

  *Hand this out after Round 1 is submitted.*

  **TRANSMISSION HISTORY & PROVENANCE REPORT**
  *   **Source 1 (Stele):** Paleographic analysis dates the carving style to 150–110 BCE. The event is traditionally dated to 130 BCE. It confirms the mission, but the text is formulaic propaganda.
  *   **Source 2 (Letter):** Authenticated as contemporary. Arin was the Royal Secretary. However, Arin was in the antechamber, not the negotiation room.
  *   **Source 3 (Chronicle):** A 12th-century CE epitome (summary) of the *History of Mennas* (2nd Century BCE, now lost).
  *   **Source 4 (Victory Stele):** Commissioned by King Thalos immediately after the event. Standard royal propaganda genre.
  *   **Source 5 (Diary):** Private document. However, textual analysis shows it shares a specific scribal error with Source 7.
  *   **Source 6 (Treatise):** Written 300 years later by a political enemy of Vespos. The quote "Gold is heavier..." is not found elsewhere; it is preserved only here to mock Kaelen. Source 6 explicitly cites Mennas (Source 3).
  *   **Source 7 (Gazette):** Public news sheet. Shares the "Third Hour of the Night" error with Source 5, indicating a common, corrupted news draft.
  *   **Source 8 (Ledger):** Official Court Archive. Complete for the month. Records all *official* audiences. The Grain Archive (not extant) would not list people; this one does.

  ---

  ## Part 5: Timing & Facilitation Guide

  **00:00 – 00:10: Introduction**
  *   Divide into 6 groups of 4.
  *   Hand out the 8 Sources (shuffled) and the Question Sheet.
  *   **Crucial Warning:** "Do not weave a story. Answer the questions based *only* on the evidence provided. Cite your sources. If you are guessing, mark Low Confidence."

  **00:10 – 00:50: Round 1 (The Naive Reading)**
  *   Students read and answer.
  *   *Instructor Role:* Circulate. If a group says "Three sources say he was stabbed," ask: "Are they independent?" (Don't answer, let them struggle).
  *   *Stop hard at 50 mins.* Collect Round 1 answers.

  **00:50 – 01:05: The Reveal**
  *   Hand out the **Metadata Report**.
  *   Give them 5 minutes to read it silently.
  *   **The Shock:** Point out the "Third Hour of the Night" error. Point out that Source 3 and 6 are the *same* tradition. Point out that Source 2 didn't see the murder.
  *   *Instruction:* "You may now revise your answers. You can change your confidence levels. If you now realize a question is unanswerable, state that clearly."

  **01:05 – 01:30: Round 2 (The Critical Revision)**
  *   Groups re-evaluate.
  *   *Instructor Role:* Listen for the shift in language. They should move from "Source 3 says..." to "The Mennas tradition says..."
  *   *Stop hard at 90 mins.* Collect Round 2 answers.

  **01:30 – 01:50: Debrief (The Methodological Move)**
  *   **Score the rounds** (project the answers on screen).
  *   **Discussion Points:**
      1.  **Independence:** "How many of you counted Source 3 and 6 as two witnesses in Round 1? That is the 'Manuscript Tradition' problem. 100 copies of the same book = 1 witness."
      2.  **Silence:** "Source 8 didn't mention Kaelen. In Round 1, did you ignore it? In Round 2, does it matter? *Absence of evidence is only evidence of absence if we expect the evidence to be there.* Source 8 is a Court Ledger; it should have listed him."
      3.  **Bias vs. Utility:** "Source 4 is a lie (Propaganda). Did anyone throw it out? Hopefully not. It gave us the 'Hall of Pillars' (The Liar's Truth). We use the lie to find the truth."
      4.  **Confidence:** "Who lost points on High Confidence in Round 1? That is the lesson of historiography. Certainty is expensive."

  ---

  ## Part 6: Troubleshooting & Limitations

  **Predictable Problems & Fixes:**
  1.  **The "Smooth Narrative" Trap:** Students will try to make all sources fit one story (e.g., "He died of fever *and* was stabbed").
      *   *Fix:* In the intro, explicitly forbid synthesis. "If Source A says X and Source B says Y, do not say X+Y. Say 'The sources conflict'."
  2.  **Gaming the Scoring:** Students might put "Low Confidence" on everything to avoid penalties.
      *   *Fix:* The "Unanswerable" rule. If they mark "Unknown" on a solvable question (like Location), they get 0 points. They *must* commit to gain points. Also, emphasize that in History, "I don't know" is a valid, high-value answer *if justified*.
  3.  **Time Creep:** Reading 8 sources takes time.
      *   *Fix:* Assign roles within groups (e.g., Two students read Sources 1-4, two read 5-8, then share).
  4.  **The "Gotcha" Frustration:** Students may feel cheated by the Metadata.
      *   *Fix:* Frame the Metadata not as "New Facts" but as "Information that was always there, you just didn't have the training to see it." This mirrors real research.

  **What This Activity Cannot Reproduce (The Honest Paragraph):**
  *This simulation compresses months of philological work into minutes. In reality, you would not have the 'Metadata Report' handed to you; you would have to learn paleography to date the script, linguistics to spot the copyist's slip, and archaeology to verify the 'Hall of Pillars.' Real source criticism is often boring, technical, and inconclusive. This activity teaches the **logic** of transmission (stemmatics, independence, silence), but it cannot teach the **grind** of verification. You will leave knowing *why* you need to check the manuscript tradition, but you still need to learn the languages and methods to actually do it.*

  ---

  ## Instructor Answer Key (For Scoring)

  1.  **Location:** **Hall of Pillars.** (Source 3, 4, 6). *Round 1:* High confidence. *Round 2:* High confidence (Source 4 is propaganda but architectural details are usually accurate; Source 3/6 tradition agrees).
  2.  **Cause:** **Unanswerable / Stabbing (Low Confidence).** (Source 2 says stab but hearsay; Source 3 says stab but late; Source 4 says honor/fever). *Round 2:* Downgrade confidence. Source 2 is reliable on the blood, not the blow.
  3.  **Time:** **Unanswerable.** (Source 5 & 7 say "3rd Hour Night" but share a copyist error/impossibility). *Round 2:* Recognize the error.
  4.  **Treaty Signed:** **No / Unlikely.** (Source 3 says no; Source 8 Ledger omits it; Source 4 claims yes but is propaganda). *Round 2:* Source 8 silence is meaningful here.
  5.  **Succession:** **Permanently Unanswerable.** (No source mentions the successor). *Round 2:* Must identify as unanswerable.
  6.  **Betrayal:** **Permanently Unanswerable.** (Source 6 quote is hostile; Source 4 is propaganda). *Round 2:* Must identify as unanswerable.
