answer: |-
  # The Mechanistic Continuity Protocol (MCP-v1)

  **Philosophy:** This procedure rejects pure behaviorism (your friend's view) but acknowledges that perfect structural isomorphism is impossible in neural systems (your constraint). It certifies **Causal Stability** rather than **Structural Stasis**. The safety argument holds only if the specific representation identified remains the *dominant causal mediator* of the refusal, even if weights shift.

  **Constraints:** 1 afternoon per release. No new interpretability experiments (only analysis of existing probes/logs).

  ### Phase 1: Change Log Triage (15 Minutes)
  *   **Action:** Compare current commit against last signed-off release. Categorize changes: *Weights Only*, *Code/Arch Only*, or *Hybrid*.
  *   **Pass:** Changes are confined to non-safety-critical paths (e.g., logging, UI) OR are parametric updates (fine-tuning) within the safety module.
  *   **Fail:** Architecture changes to the safety module (e.g., moving logic outside the model, swapping optimizer logic that affects convergence of safety weights).
  *   **Evidence Weight:** High. Code structure is ground truth.
  *   **Judgment Call:** Determining if a code refactor is "architectural" or "cosmetic."

  ### Phase 2: Behavioral Sanity Check (30 Minutes)
  *   **Action:** Run the "Critical Refusal Set" (a fixed suite of 50 prompts known to trigger the specific safety mechanism).
  *   **Pass:** Refusal rate remains within $\pm 2\%$ of baseline *and* failure modes are consistent (e.g., if it fails, it fails silently, not by complying).
  *   **Fail:** Refusal rate drops significantly, or the system complies with a prompt it previously refused *for the wrong reason* (e.g., refuses due to latency timeout rather than safety gate).
  *   **Evidence Weight:** Necessary but Insufficient. (A lookup table passes this).
  *   **Judgment Call:** Defining the "Critical Refusal Set."

  ### Phase 3: Representational Stability (45 Minutes)
  *   **Action:** Run existing probes on the specific neurons/features identified in the original safety argument. Calculate cosine similarity of the activation vectors on the Critical Refusal Set against the baseline.
  *   **Pass:** Similarity score $> 0.85$. The "refusal representation" is still firing in the same subspace.
  *   **Fail:** Similarity score $< 0.70$. The representation has moved or dissolved.
  *   **Gray Zone:** $0.70 - 0.85$. Proceed to Phase 4.
  *   **Evidence Weight:** High. This distinguishes your view from your friend's. A lookup table fails this (no internal representation).
  *   **Judgment Call:** The similarity threshold.

  ### Phase 4: Causal Mediation Light (45 Minutes)
  *   **Action:** Perform a zero-shot ablation on the identified safety features (set activations to zero) for a subset of the Critical Refusal Set.
  *   **Pass:** Refusal rate drops significantly (e.g., $>50\%$ of previously refused prompts are now allowed). This proves the representation is *causal*, not just correlated.
  *   **Fail:** Refusal rate remains high after ablation. The system is refusing via a different, unverified path (e.g., a hardcoded backup or a different heuristic).
  *   **Evidence Weight:** Definitive. This is the tie-breaker.
  *   **Judgment Call:** Determining "significant drop."

  ### Phase 5: Cumulative Drift Counter (15 Minutes)
  *   **Action:** Increment a release counter. Check against the "Audit Budget."
  *   **Rule:** Every 6 releases, a **Full Mechanistic Audit** is required (outside the scope of this 1-afternoon procedure).
  *   **Pass:** Counter $< 6$.
  *   **Fail:** Counter $= 6$. Release is **Blocked Pending Full Audit**.
  *   **Evidence Weight:** Administrative safeguard against the Ship of Theseus.
  *   **Judgment Call:** The Audit Budget number (6).

  ### Termination Conditions
  1.  **Signed Off:** Phases 1-5 Pass.
  2.  **Blocked:** Any Phase Fail.
  3.  **Blocked Pending Human Judgment:** Phase 3 Gray Zone + Phase 4 Ambiguous OR Phase 1 "Cosmetic vs. Architectural" dispute.

  ### Explicit Judgment Calls Dressed as Procedure
  1.  **The Similarity Threshold (Phase 3):** 0.85 is arbitrary. It is a risk tolerance setting, not a physical constant.
  2.  **The Audit Budget (Phase 5):** Setting this to 6 releases is a resource allocation decision, not a safety truth.
  3.  **The Critical Set (Phase 2):** If the set doesn't cover the edge case where the new mechanism fails, you won't see it.

