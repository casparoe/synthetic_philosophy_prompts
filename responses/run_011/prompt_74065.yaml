prompt: |-
  I'm president of a club at my high school — about 180 members, meets once a week — and we keep fighting about whether to vote on things as a whole club or hand them to the 9-person exec board. Somebody told me about the Condorcet jury theorem, the one about how a bigger group is way more likely to get it right as long as each individual is more likely right than wrong and they're not just copying each other. I want to actually use it instead of name-dropping it at meetings.

  Can you turn it into a checklist we could run before deciding which body votes? The questions in order, what counts as a real answer to each, when it outputs "whole club" vs "exec board" vs "this isn't a voting question at all," and where it stops and hands it back to us because it's a values thing. Constraints: we get maybe 15 minutes of a meeting to do this, nobody in the club knows any probability, and I have to sign off before anything goes to a vote.

  Things you should build in: everyone reads the same group chat and the same two seniors' takes before meetings, a third of members skip meetings and vote on a google form days later, and we have zero way to check whether people are actually better than a coin flip. Also some of what we vote on has no right answer (prom theme) and some does (whether a proposed rule actually breaks the school handbook).

  Then run it on two cases: choosing which charity we fundraise for, and deciding whether our advisor overstepped when she cancelled an event. Be straight with me about which steps are just judgment calls wearing a procedure costume.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist and analysis:

  1.  **Analyze the Request:**
      *   **Role:** High School Club President (180 members, weekly meetings).
      *   **Problem:** Conflict between whole-club voting vs. exec board (9 people) voting.
      *   **Tool:** Condorcet Jury Theorem (CJT).
      *   **Goal:** Create a practical checklist based on CJT to decide *who* votes, not just name-drop the theorem.
      *   **Constraints:**
          *   15 minutes max in a meeting.
          *   No probability knowledge among members.
          *   President must sign off.
          *   Specific context: Shared info (group chat + 2 seniors' takes), 1/3 vote asynchronously (Google Forms), no way to verify competence ($p > 0.5$), mix of factual (handbook) and value-based (prom theme) questions.
      *   **Deliverables:**
          *   The Checklist (questions, valid answers, outputs).
          *   Application to two cases (Charity choice, Advisor overstep).
          *   Honest assessment of where "procedure" masks "judgment."

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Core Premise:* If each voter has a probability $p > 0.5$ of being correct, and votes are independent, the probability of the majority being correct approaches 1 as the group size $n$ increases.
      *   *Conditions for CJT to favor large groups:*
          1.  **Binary Choice:** There must be a "right" and "wrong" answer (or at least a better/worse one).
          2.  **Competence ($p > 0.5$):** Voters must be more likely to be right than wrong.
          3.  **Independence:** Voters must not be correlated (no herding, no shared bias).
      *   *Conditions for CJT to fail (favor small groups/experts):*
          1.  $p < 0.5$ (Incompetence): Larger groups amplify error.
          2.  High Correlation: If everyone hears the same wrong info, they all vote wrong together.
          3.  Value Judgments: No "truth" exists to converge upon.

  3.  **Drafting the Checklist (Iterative Process):**
      *   *Constraint Check:* Needs to be done in 15 mins. Needs simple language (no math). Needs to account for the specific club dynamics (group chat, async voting, etc.).
      *   *Step 1: Truth vs. Preference.* CJT only applies to truth-tracking. If it's preference, CJT is irrelevant.
      *   *Step 2: Competence.* Can the average member judge this better than the Execs? Given the "zero way to check $p > 0.5$" constraint, we need proxies (information access, expertise).
      *   *Step 3: Independence.* This is the big one for this club. Shared group chat + 2 seniors' takes = high correlation. Async voting = lower deliberation but potentially higher independence from room pressure.
      *   *Step 4: The Decision.* Map the answers to "Whole Club," "Exec Board," or "Not a Vote."

      *Refining the Questions:*
      *   Q1: Is there a correct answer? (Filters out Prom Theme).
      *   Q2: Do members have unique info, or just the chat/seniors? (Addresses Independence/Correlation).
      *   Q3: Is the Exec Board significantly more informed/competent? (Addresses Competence).
      *   Q4: Does the outcome require buy-in or accuracy? (Political vs. Epistemic).

      *Wait, I need to incorporate the specific constraints:*
      *   "Everyone reads the same group chat and same two seniors' takes." -> This kills independence.
      *   "1/3 skip and vote later." -> This affects deliberation but maybe helps independence (less peer pressure).
      *   "No way to check $p > 0.5$." -> We have to assume based on complexity.

      *Revised Checklist Structure:*
      1.  **Truth Test:** Is this fact or flavor?
      2.  **Information Test:** Is the info common or specialized?
      3.  **Independence Test:** Are people thinking for themselves or echoing the chat/seniors?
      4.  **Stakes/Speed Test:** (Practical constraint).

  4.  **Developing the "Honest Assessment" (The Meta-Commentary):**
      *   The prompt asks to be straight about which steps are judgment calls wearing a procedure costume.
      *   *Reality:* CJT is a mathematical theorem. Applying it to social dynamics is an analogy. Determining "independence" when everyone reads the same chat is impossible to measure objectively. Determining "competence" without feedback loops is a guess.
      *   *Key Insight:* The checklist isn't actually calculating probability. It's a structured way to force the President and Execs to admit *why* they want to keep control or give it away.

  5.  **Running the Cases:**
      *   **Case 1: Charity Fundraise.**
          *   Truth? No, it's values/preference.
          *   CJT适用？No.
          *   Decision: Whole club (for buy-in) or Exec (for strategy)? Usually Whole Club for morale, but CJT doesn't apply.
      *   **Case 2: Advisor Overstep.**
          *   Truth? Yes (Handbook rules).
          *   Competence? Do students know the handbook better than Execs? Maybe not.
          *   Independence? Everyone heard the same rumor/chat. High correlation.
          *   CJT Verdict: Exec Board (or Admin), because correlation kills the "wisdom of crowds."

  6.  **Refining the Output:**
      *   Make it punchy.
      *   Ensure the "President Sign-off" is clear.
      *   Highlight the "Costume" section prominently.
      *   Keep the tone respectful but realistic (High School context).

  7.  **Final Review against Constraints:**
      *   15 mins? Yes, 4 questions.
      *   No probability? Yes, plain English.
      *   President sign-off? Included.
      *   Specific club dynamics addressed? Yes (Chat, Seniors, Async).
      *   Two cases run? Yes.
      *   Honest assessment? Yes.

      *(Self-Correction during drafting)*: I initially thought about suggesting the whole club vote for the charity. But CJT specifically fails there. I need to make sure the checklist distinguishes between "CJT says Whole Club" and "Democracy says Whole Club." The prompt asks to use CJT. So if CJT doesn't apply, the checklist should say "CJT Not Applicable -> Use Default Policy." I will set the default policy to "Whole Club for values, Exec for facts where independence is low."

      *Wait, one more thing:* The prompt mentions "1/3 vote on google form days later." This actually *helps* independence compared to a show of hands, but they still read the same chat beforehand. I need to make sure the checklist weighs the *source* of information (Chat/Seniors) more than the *method* of voting.

      *Final Polish on the "Costume" section:* I need to explicitly state that deciding if $p > 0.5$ without data is a guess. That's the biggest "costume."

