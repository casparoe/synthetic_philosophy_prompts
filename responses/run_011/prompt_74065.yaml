answer: |-
  Here is a practical implementation of the Condorcet Jury Theorem (CJT) tailored to your club's specific constraints. It is designed to be read aloud and answered in under 15 minutes.

  ### The "Wisdom vs. Noise" Checklist

  **Instructions:** The President reads the question. The Exec Board discusses for 2 minutes max per question. The President marks the answer. If the President cannot sign off on the final result, the default is **Exec Board**.

  **Question 1: The Truth Test**
  *   **Ask:** "Is there a factually correct answer (e.g., school rules, budget math), or is this about what we *like* (e.g., theme, charity choice)?"
  *   **Valid Answers:**
      *   **Fact:** There is a right/wrong outcome.
      *   **Preference:** There is no right answer, only popular ones.
  *   **Logic:** CJT only works for **Facts**. If **Preference**, CJT does not apply.
  *   **Output:** If **Preference**, skip to *Decision Protocol A*. If **Fact**, go to Q2.

  **Question 2: The Echo Chamber Test**
  *   **Ask:** "Did everyone get their main info from the same Group Chat and the same two Seniors, or do members have unique, private information?"
  *   **Valid Answers:**
      *   **Shared Info:** Everyone read the same texts/heard the same rumors.
      *   **Unique Info:** Members are bringing different experiences/data (e.g., different class schedules, personal budgets).
  *   **Logic:** CJT requires **Independence**. If everyone hears the same wrong info, they all vote wrong together. Shared info kills the "big group" advantage.
  *   **Output:** If **Shared Info**, go to Q3. If **Unique Info**, go to *Decision Protocol B*.

  **Question 3: The Competence Proxy**
  *   **Ask:** "Is the average member more likely to understand this specific fact than the 9-person Exec Board?"
  *   **Valid Answers:**
      *   **Yes:** The issue is simple/common knowledge (e.g., "Is the pizza place open?").
      *   **No/Unsure:** The issue is complex/technical (e.g., "Does this violate the handbook clause 4.B?").
  *   **Logic:** CJT requires **Competence ($p > 0.5$)**. If the average member is guessing ($p = 0.5$) or confused ($p < 0.5$), adding more voters just amplifies error.
  *   **Output:** If **Yes**, go to *Decision Protocol B*. If **No/Unsure**, go to *Decision Protocol C*.

  ***

  ### Decision Protocols

  *   **Protocol A (Preference Issue):** CJT does not apply.
      *   **Verdict:** **Whole Club Vote.**
      *   **Reasoning:** Since there is no "truth" to find, legitimacy and buy-in matter more than accuracy.
  *   **Protocol B (High Independence or High Competence):** CJT favors the crowd.
      *   **Verdict:** **Whole Club Vote.**
      *   **Reasoning:** Either they have unique info or they are competent enough that 180 heads are better than 9.
  *   **Protocol C (Shared Info + Low Competence):** CJT favors the small group.
      *   **Verdict:** **Exec Board Vote.**
      *   **Reasoning:** The "crowd" is actually one correlated hive-mind with limited expertise. A smaller group can deliberate faster and take responsibility for the technical call.

  ***

  ### Case Studies

  Here is how the checklist runs on your two specific scenarios.

  #### Case 1: Choosing which charity to fundraise for
  *   **Q1 (Truth Test):** **Preference.** There is no objectively "correct" charity. One is not mathematically better than the other; it's about what the club cares about.
  *   **Result:** **Protocol A.**
  *   **Verdict:** **Whole Club Vote.**
  *   **Why:** CJT is irrelevant here. You vote as a whole club not because they are smarter, but because it's *their* money and *their* time. If the Execs pick the charity, members won't show up to sell cupcakes.

  #### Case 2: Deciding whether the advisor overstepped by cancelling an event
  *   **Q1 (Truth Test):** **Fact.** The answer depends on the School Handbook and Faculty Policy. There is a right answer (she did/didn't violate policy).
  *   **Q2 (Echo Chamber):** **Shared Info.** Everyone read the same Group Chat rant and heard the same two Seniors complain. The 1/3 voting on Google Forms did so based on that same chat log.
  *   **Q3 (Competence):** **No/Unsure.** Do average members know the Faculty Handbook better than the Execs? Unlikely. The Execs talk to the advisor directly; members are hearing rumors.
  *   **Result:** **Protocol C.**
  *   **Verdict:** **Exec Board Vote.**
  *   **Why:** This is the exact failure mode of Condorcet. You have 180 people voting on a technical rule they don't understand, based on the same biased rumors. A large vote here doesn't find truth; it just creates an angry mob. The Exec Board should investigate the policy and vote.

  ***

  ### The "Costume" Check: Where this is actually just judgment

  You asked me to be straight. The Condorcet Jury Theorem is math. Your club is sociology. Here is where the checklist is pretending to be a calculator when it's actually a mirror.

  **1. The "Competence Proxy" (Question 3) is a guess.**
  CJT requires knowing that $p > 0.5$ (voters are more likely right than wrong). You admitted you have "zero way to check" this. When you ask the Exec Board, "Are members competent?" they aren't measuring probability. They are measuring **trust**.
  *   *The Reality:* If the Exec Board wants to keep control, they will answer "No" to competence. If they want to offload a tough decision, they will answer "Yes." The checklist forces them to say it out loud, but it doesn't stop them from lying.

  **2. The "Independence" (Question 2) is impossible to verify.**
  CJT fails if votes are correlated. You noted everyone reads the same chat. Technically, this means independence is already near zero for *every* vote.
  *   *The Reality:* If you follow the math strictly, the answer should *always* be Exec Board because the "Shared Info" constraint is always true. To make this usable, you have to pretend that Google Form voters are "independent enough" because they aren't in the room being pressured. That is a judgment call, not a mathematical fact.

  **3. The "Truth" (Question 1) is often disguised.**
  Many "Fact" questions are actually "Preference" questions in disguise.
  *   *Example:* "Should we fund the Food Bank?" looks like a preference. But if you frame it as "Which charity aligns with our mission statement?" it becomes a Fact (interpretation of a document).
  *   *The Reality:* The President (you) decides how to frame the question. You can manipulate the outcome of the checklist simply by how you write the ballot title.

  **4. The President Sign-Off is the real algorithm.**
  The checklist ends with "President must sign off." This is the safety valve.
  *   *The Reality:* The checklist is not a binding contract. It is a **political shield**. If you want to override the checklist, you can. The value isn't that it forces the "right" decision; the value is that it forces the Exec Board to argue using *your* framework (Independence/Competence) rather than just saying "I want to decide this."

  ### How to use this without getting roasted
  Don't present this as "Math says I'm right." Present it as "Here is how we decide who decides."

  When someone argues for a whole-club vote on the Advisor issue, point to **Question 2**: *"Everyone is working off the same Group Chat screenshots. Condorcet says if we all have the same biased info, a bigger group just makes the error louder. Let the Execs check the handbook."*

  When someone argues for Exec vote on the Charity, point to **Question 1**: *"There is no right answer here. Math doesn't apply. This needs buy-in, so the whole club votes."*

  It stops being about you vs. them, and starts being about **Info vs. Preference.**
