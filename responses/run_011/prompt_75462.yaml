  7.  **Refining the Tone:**
      *   Needs to be peer-to-peer, rigorous, slightly provocative (since I must argue with them).
      *   Avoid standard textbook summaries (they know them).
      *   Focus on the *meta-philosophical* impasse.

  8.  **Self-Correction/Check during drafting:**
