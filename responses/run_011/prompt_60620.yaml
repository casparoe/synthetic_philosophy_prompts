  **Planning**

  Orwell's rules bite hardest on ceremonial imagery (light, paths) and abstract praise (legacy, integrity). These constraints were formulated for political essayism, not celebration. The collision lies between the ceremony's need for shared formulas to unite strangers (Chair's Objection 1) and Orwell's ban on stale phrasing. To unite this room without clichés, I must use the letters themselves as the shared object. The "third thing" regarding the boss is habituation: he inherited the language, she broke the habit. This avoids villainy while condemning the prose. I will prioritize the "arguability" point over warmth, trusting that truth creates its own warmth. The risk is sounding cold, but the subject matter demands precision.

  ***

  **Speech**

  Good evening. The charter defines public writing as work for readers who did not choose to read it. That means the writer holds the power. Ruth Kelleher spent twenty-six years in the state agency. She wrote the letters people received when money stopped. For the first half of that time, she wrote what she was told to write. Then she changed the words.

  Listen to the old opening:

  "It has been determined that the documentation provided was insufficient to establish continued eligibility. Accordingly, benefits have been terminated pending further review."

  Listen to the verbs. "It has been determined." "Benefits have been terminated." Who determined? Who terminated? The sentence hides the hand that wrote it. You cannot write back to "it." You cannot ask "it" for a calendar. This language does not invite a reply. It ends the conversation.

  Now listen to what Ruth wrote instead:

  "We stopped your payments on March 4. We stopped them because the doctor's letter we asked for on February 1 had not reached us by March 1. If you send that letter to the address below, we will look at your case again and give you our answer within thirty days. If the answer is no, you may ask for a hearing, and a person who does not work in this office will decide. Here is how to ask."

  Now the writer stands in the sentence. "We stopped." "You send." The dates are plain. The next step is plain.

  The difference is not manners. It is not tone. The first letter cannot be argued with. The second can. You can check the dates. You can mail the letter. The second letter treats the reader as someone who can act.

  The old words were not born of malice. They were inherited. The man who ran this unit before Ruth stood inside the same habit. He read those lines and thought them clear. We all learn to speak by copying what we hear. When the copy is bad, the thought becomes sloppy. It takes work to stop the copy.

  Ruth stopped it. She broke the habit. She wrote a handbook used in three states. She taught her colleagues to write what they meant.

  We have linguists, recipients, and writers here. To the recipients: you know what these letters cost. To the writers: you know how hard it is to stop the copy.

  Ruth does not want to be called a champion. She wants the letters to work. So I will not call her an inspiration. I will say she did the job. She made the words fit the truth.

  She gave us a way to speak that lets the other person answer. That is the prize.

  Tomorrow you will open a document. You will choose a verb. Make it one you can own.

  Please join me in thanking Ruth Kelleher.

  ***

  **Note**

  I refused Objection 1 (formulas unite the room) by using plain speech rather than ritual language to create unity; the shared focus is the letters, not the speaker. I accommodated Objection 2 (absence sounds thin) by making the letters physically present in the text, giving the audience concrete material to hear. I accommodated Objection 3 (self-regard) by focusing entirely on Kelleher's work and the audience's future actions, minimizing my own rhetorical footprint.

  Two close calls: "Holds the power" risks abstract political diction, but "power" is short and the claim is contestable. "Broke the habit" is a dead metaphor, but Orwell permits common idioms where no visual image is conjured; I kept it because "stopped" was already used twice nearby.

  Stock phrase kept: "Please join me in thanking." Defense: It is a functional command required to transition the room from listening to applause; refusing it would hinder the ceremony's mechanics without aiding its truth.
