answer: |-
  I reject step (2) and the inference to (5), as they conflate the logical possibility of accommodation with the evidential weight of independent prediction.

  **The failing step**
  The slide occurs in the move from (2) to (5), specifically the tacit assumption that constructibility implies evidential parity. Step (2) allows you to generate a by-product hypothesis $B$ that accommodates evidence $E$, but it treats $B$ as a live rival to $A$ solely based on that accommodation. This ignores the role of prior probability in confirmation. While (4) correctly states that likelihoods are equal ($P(E|A) = P(E|B) = 1$), (5) illicitly infers that support is equal. Support depends on the posterior probability, which weights likelihood by prior probability. Because $B$ is constructed *post hoc* to fit $E$, it incurs a penalty for ad hocness or complexity that lowers its prior probability relative to $A$, assuming $A$ was motivated by independent theoretical grounds. The corrected version of (5) reads: "Hence $E$ does not favour $A$ over $B$ *unless $A$ possesses a higher prior probability based on independent mechanistic or ecological grounds*." Without this qualification, the argument mistakes logical compatibility for empirical equivalence.

  **Why it looked sound**
  The intuition behind (2) is compelling because the rodent case exhibits perfect structural fit. The allometric exponent and ontogenetic sequence are exactly what a physical constraint model predicts, making the selection story appear redundant. When data aligns perfectly with a constraint, positing selection feels like an unnecessary multiplication of causes. This pulls towards (5) because it exploits a genuine methodological worry: adaptationists often treat fit as proof of selection, ignoring that physical laws also produce fit. The rodent flange scales predictably; if physics dictates the shape, selection need not. This resonates with the spandrels critique's core insight that form often follows function only because form follows growth. Consequently, the argument feels like a rigorous formalization of the warning against "just-so stories," suggesting that if a non-selection story fits equally well, the selection story is unsupported. It captures the genuine underdetermination present in static comparative data.

  **What each repair costs**
  Rejecting (4) sacrifices the Likelihood Principle, which provides the only objective measure of how well a hypothesis predicts data. Without it, confirmation becomes purely subjective, dependent on arbitrary prior assignments. Gould and Lewontin could not coherently hold this position, as their critique relied on showing that spandrel hypotheses fit the *actual* developmental data better than adaptationist stories in specific cases; denying likelihoods removes their empirical leverage.

  Rejecting (2) requires admitting that not all constructible hypotheses are serious rivals. You must adopt criteria for "live" hypotheses, such as mechanistic plausibility or independent testability. This costs the universal skepticism you derived; some adaptation claims will be supported because their by-product rivals are mechanistically incoherent. Gould and Lewontin can hold this comfortably, as they consistently appealed to specific developmental mechanisms to rule out adaptationist stories, never claiming *all* traits were spandrels, only that many were misidentified.

  Rejecting the inference to (5) while keeping (4) forces a Bayesian framework: support is likelihood ratio times priors. This costs the idea that data alone decides; background theory matters. If priors favor selection (e.g., due to known fitness variance), $A$ wins despite equal likelihood. Gould and Lewontin can hold this, and indeed did; their argument was not that likelihoods are always equal, but that adaptationists assigned inflated priors to selection without evidence. They demanded the prior for selection be lowered until independent evidence justified it. This repair saves the critique as a demand for rigorous prior justification rather than a ban on functional inference.

  **What the critique keeps**
  The surviving methodological point is that fit alone never proves selection; independent evidence of fitness variance is required to raise the prior probability of adaptation hypotheses above that of constraint hypotheses. The critique remains a powerful check against pan-adaptationism, forcing functional morphologists to demonstrate that selection is not just possible, but necessary given the developmental context. However, it now carries the commitment that spandrel claims themselves must be supported by positive evidence of constraint, not merely by the logical possibility of their construction. Gould and Lewontin's critics were entitled to demand this parity: if adaptationism requires evidence beyond fit, so does structuralism. The critique thus transforms from a skeptical trap into a call for pluralistic rigor, where both selection and constraint are treated as empirical claims requiring independent validation.
