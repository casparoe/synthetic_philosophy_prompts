      *Let's look at the "Impersonal" sentence again.* "The argument is impersonal..." -> Savulescu's argument *is* based on impersonal principles (maximizing welfare), but the draft explains it as "indifferent to the particular child." That's actually close to the technical definition (person-neutral), but the explanation "because an embryo... never becomes anyone" is the NIP logic, not the definition of impersonal. I need to untangle this.

