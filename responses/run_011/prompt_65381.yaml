  2.  **Deconstruct the Philosophy of Contrastive Explanation (Lipton, Van Fraassen, etc.):**
      *   *Core Logic:* To explain "Why P rather than Q?", you need a cause C that is present in P's history but absent in Q's history (or vice versa), and C must be relevant to the outcome.
      *   *Key Pitfalls:*
          *   *Mismatched Units:* Comparing apples to oranges (Nation vs. Region).
          *   *Impossible Foil:* Q was never a live possibility (no shared track).
          *   *Non-Discriminating Cause:* C exists in both P and Q, or neither.
          *   *Aggregation Mismatch:* Explanation is too broad/narrow for the specific contrast.
          *   *Teleology:* Assuming Q *should* have happened (normative).

  3.  **Drafting the Procedure (Screener Sheet):**
      *   Needs to be concise, actionable, and fit on one side of a sheet.
      *   Structure: Step-by-step questions with "Pass/Fail/Flag" outcomes.
