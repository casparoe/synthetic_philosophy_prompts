answer: |-
  **MEMORANDUM: COMPARATIVE HISTORY SCREENING PROTOCOL**
  **TO:** Managing Editor & Screeners
  **SUBJECT:** Desk Decision Procedure for Contrastive Claims

  ### PART 1: THE SCREENER SHEET (One Side Only)

  **COMPARATIVE HISTORY MANUSCRIPT CHECKLIST**
  *Time Limit: 20 Minutes | Materials: Abstract, Introduction, Tables*

  **1. THE UNIT MATCH**
  *Look at the Fact (what happened) and the Foil (what didn't).*
  *   **Test:** Are they the same kind of thing? (e.g., Nation vs. Nation, Region vs. Region, Century vs. Century).
  *   **Fail:** Country vs. Region; Continent vs. River Delta.
  *   **Action:** **Reframe.** Return to author. They must narrow the Fact or broaden the Foil to match.
  *   **Exception:** If the paper argues units *cannot* be matched, **FLAG FOR EDITOR.**

  **2. THE SHARED TRACK\***
  *Look for evidence that the Foil was ever a live possibility.*
  *   **Test:** Does the text show both sides were on a path where either outcome was possible?
  *   **Fail:** The author treats the Foil as if it "should" have won without evidence it could have.
  *   **Action:** **Flag for Editor.** (See Note A).
  *   **Pass:** Author establishes both sides had the capacity/preconditions.

  **3. THE DISCRIMINATING CAUSE**
  *Look at the main explanatory variable (X).*
  *   **Test:** Is X present in the Fact case and absent in the Foil case?
  *   **Fail:** X is present in both, absent in both, or the author admits X is missing in the Fact case.
  *   **Action:** **Desk Reject.** The cause cannot explain a difference if it doesn't differ.
  *   **Pass:** X tracks perfectly with the outcome.

  **4. THE AGGREGATION MATCH**
  *Look at the Tables vs. the Claim.*
  *   **Test:** Do the data points match the scale of the comparison?
  *   **Fail:** Claim is about "National Culture," data is about "Port Taxes."
  *   **Action:** **Reframe.** Author must align evidence scale with claim scale.

  **5. THE NORMATIVE FLAG\*\***
  *Look for hidden assumptions about history's direction.*
  *   **Test:** Does the author imply history was *supposed* to produce the Fact, and ask why the Foil lagged?
  *   **Action:** **STOP. FLAG FOR EDITOR.** Do not decide. This is a philosophical judgment, not a factual one.

  ---
  *\*Judgment Call: Requires inferring intent from text.*
  *\*\*Procedural Stop: Do not apply Pass/Fail.*

  ***

  ### PART 2: EDITOR'S GUIDE & APPLICATION

  **Note A (Shared Track):** If a paper argues the Foil was *impossible* (e.g., "China could never industrialize"), Step 2 will look like a Fail. This is a valid argument (debunking the contrast), not a broken one. Screeners must check: Is the impossibility the *conclusion* or an *oversight*? If conclusion, **Forward**. If oversight, **Reject**.

  **Note B (Judgment Calls):** Steps 2 and 5 are not mechanical. They require reading tone and argument structure. If a screener is unsure, the default is **Flag for Editor**.

  **APPLICATION TO CURRENT SUBMISSIONS**

  **1. Britain (Nation) vs. Yangzi Delta (Region)**
  *   **Step 1 (Unit Match):** **FAIL.** Country vs. Region.
  *   **Step 3 (Cause):** Coal/New World access fits Britain, not Delta.
  *   **Decision:** **Reframe.** Do not reject. The argument is standard Pomeranz-style material, but the units are sloppy.
  *   **Instruction to Author:** "Resubmit with matched units. Compare Lancashire to Yangzi Delta, or Great Britain to Qing Empire. You cannot compare a polity to a sub-national region without explicit methodological justification."

  **2. Chinese Science vs. European Lawgiver**
  *   **Step 1 (Unit Match):** **PASS** (Civilizational blocks).
  *   **Step 2 (Shared Track):** **UNCLEAR.** Was "Chinese Science" ever on track to become "Modern Science"?
  *   **Step 3 (Discriminating Cause):** **FAIL.** Author admits the "Lawgiver" cause was missing in Europe too. If the cause is absent in both, it cannot explain the divergence.
  *   **Decision:** **Desk Reject.**
  *   **Reason:** The explanation is non-contrastive. It explains nothing about the difference if the variable doesn't vary.

  **3. Song China (11th C.) vs. Britain (18th C.)**
  *   **Step 1 (Unit Match):** **FLAG.** Space and Time mismatch.
  *   **Step 2 (Shared Track):** **FLAG.** Can centuries apart be on a "shared track"?
  *   **Step 5 (Normative):** **FLAG.** Implies industrialization was a destination waiting to be reached.
  *   **Decision:** **Flag for Editor.**
  *   **Reason:** The procedure cannot mechanically validate cross-temporal counterfactuals. This requires your judgment on whether the comparison is heuristic or fallacious. Do not let screeners kill this based on Step 1.

  **FALSE POSITIVES & SAFEGUARDS**

  **The Risk:** The "Impossible Foil" Paper.
  A strong paper may argue: "The Foil was never on a shared track; the divergence was inevitable due to structural constraints."
  **Mechanical Failure:** Step 2 (Shared Track) looks like a **Fail**. A robotic screener will Reject because the author denies the track.
  **The Safeguard:** Screeners must distinguish between *ignoring* the track and *arguing against* it.
  *   **Instruction:** If the Abstract/Intro explicitly states "The Foil was structurally incapable," Step 2 is a **Pass**. The argument is that the question "Why not Q?" is invalid, which is a valid contribution. Only Reject if the author assumes a track exists but fails to prove it.

  **IMPLEMENTATION**
  Print Part 1 as a standalone sheet. Attach Part 2 to your internal wiki. Train screeners on Note A immediately; this is the most common error point.
