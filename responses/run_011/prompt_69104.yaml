          *   *Philosophical Implication:* Just because the *trainer* sees the number doesn't mean the *system* doesn't encode a proxy for it internally (e.g., "advantage" estimates, value heads).
      *   *Claim 2: Pain is global broadcast; Transformers are parallel/no center.*
