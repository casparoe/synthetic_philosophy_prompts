  Bit of an odd request but I'm in a bind. I'm a second-year PhD student TA-ing the fourth-year decision theory module here — normally the lecturer writes the final herself, but she's off on leave in a fortnight and has dumped the whole paper on me, and its due to the exam board in nine days. My own area is nothing like this (I work on vagueness) so I've been living in the reading list all week, and one strand of it has got me properly hooked: the people who argue that risk aversion isn't just a matter of a concave utility function, but a separate attitude that gets built into the decision rule itself, by transforming cumulative probabilities rather than utilities. It's become weirdly personal, actually. My mum rang me about whether to take her pension as a lump sum or as an annuity and kept saying she'd rather have the certain thing even after I showed her the numbers coming out the other way, and my brother-in-law, who works at a bank, said flatly that she was being irrational and there was nothing to discuss. I spent the whole weekend unable to work out which of them I agreed with, which is roughly why I want the exam question to be about this and not something I could crib.

  So: write me a final-exam problem on that, pitched at final-year undergraduate / first-year MA level, for a three-hour paper where students should spend about 45 minutes on it, worth 25 marks. The constraint that matters most is that our students have done von Neumann–Morgenstern from the axioms up, the Allais pairs, Savage, and one week on prospect theory, but they have never seen rank-dependent or risk-weighted utility in any form — so the stem has to hand them the machinery rather than assume it. State the rule in words and in notation: start from the utility of the worst outcome, then for each successively better outcome add the increment in utility weighted by a risk transform applied to the probability of landing on that outcome or something better, where the transform takes those cumulative "at least as good as" probabilities, is increasing, and reduces to expected utility when it's the identity. Then give them a small concrete numerical problem with a specified transform (something like the square function is fine) where they compute both values and watch the ranking flip. Part (a) should ask them to show that no concave utility function over outcomes can reproduce that flip, and to say what the structural reason is, not merely to assert that curvature can't do it. Part (b) is the bit I most want, because I think it's where the class will split: a student proposes the obvious-seeming shortcut of applying the transform to each probability separately instead of to the cumulative ones, and the question should make them analyse a pair of acts on which that version recommends an act that is weakly dominated — one that pays strictly more in some state and no less in any other — and then explain why the cumulative version structurally cannot do that. Part (c) should go diachronic. Hand them the old Samuelson story, the colleague who wouldn't take a single 50-50 bet of winning two hundred or losing a hundred but said he'd happily take a hundred of them, and ask whether an agent with a global risk attitude is rationally criticisable for that pattern, what the answer implies about whether this kind of risk aversion is required by rationality or merely permitted, and the awkward follow-up about whether an agent who refuses the first bet has changed her mind partway through a sequence in a way the theory can or can't license.

  Then give me a model answer of about 800 to 900 words, followed by a marking scheme for the 25 marks that names the specific moves a first-class answer must make and the specific mistakes that should cost marks. I especially want flagged: the answer that recites Allais and calls it a day, the answer that says you can always just make the utility function concave enough, and the answer that treats weighting individual probabilities and weighting cumulative probabilities as notational variants of one idea. Don't make the students cite anything and don't give me a bibliography or a literature list, I'll sort out the references for the reading list separately. One formatting thing, sorry about this: our exam board wants everything pasted into a single plain-text field in the online system, and it turns markdown into soup, so please write the entire response as continuous prose — question, model answer and marking scheme alike — with no headings, no bullet points, no bold and no tables, just paragraphs, the way you'd write an email. If the marking scheme ends up as a run of sentences saying what's worth what, that's exactly what I'm after.
