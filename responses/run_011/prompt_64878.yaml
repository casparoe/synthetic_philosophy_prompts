answer: |-
  EXAMINATION QUESTION

  Decision Theory, Final Year Module. Answer this question in the space provided. Time allowed for this question is 45 minutes. Total marks available are 25.

  Question 1. Standard Expected Utility theory models risk aversion solely through the curvature of the utility function over outcomes. However, some theorists argue risk aversion is a separate attitude towards probability itself. Consider a Risk-Weighted Utility model defined as follows. Let an act f yield outcomes x1 less than x2 less than ... less than xn with respective probabilities. The value of f is given by V(f) equals u(x1) plus the sum from i equals 2 to n of the quantity u(xi) minus u(x(i-1)) multiplied by r of the probability that the outcome is at least xi. Here u is a utility function over outcomes normalized such that u(x1) is the baseline, and r is a risk-weighting function mapping probabilities from 0 to 1 to 0 to 1, where r is increasing and r(1) equals 1. If r(p) equals p for all p, the model reduces to Expected Utility.

  Consider two pairs of acts. In Pair 1, Act A yields 100 with probability 1. Act B yields 500 with probability 0.1, 100 with probability 0.89, and 0 with probability 0.01. In Pair 2, Act C yields 100 with probability 0.11 and 0 with probability 0.89. Act D yields 500 with probability 0.1 and 0 with probability 0.9. Assume u(x) equals x and r(p) equals p squared.

  (a) Calculate the Risk-Weighted Utility for acts A, B, C, and D. Show that an agent can prefer A to B and D to C under this model. Explain why no concave utility function within standard Expected Utility theory can reproduce this specific pattern of preferences, referring to the structural properties of the theory rather than merely asserting risk aversion. (8 marks)

  (b) A student suggests a simpler model where the transform r is applied to each outcome's probability individually rather than cumulatively, so V equals sum of u(xi) times r(pi). Construct or analyze a scenario involving two acts where one act weakly dominates the other, yet this shortcut model recommends the dominated act. Explain why the cumulative definition provided in the stem structurally prevents this violation of dominance. (9 marks)

  (c) Consider Samuelson's colleague who refused a single 50-50 bet to win 200 or lose 100 but accepted a sequence of 100 such bets. Discuss whether an agent with a global risk attitude as defined in the stem is rationally criticisable for this pattern. What does this imply about whether this kind of risk aversion is required by rationality or merely permitted? Finally, address whether an agent who refuses the first bet but accepts the sequence has changed her mind in a way the theory can license dynamically. (8 marks)

  MODEL ANSWER

  For part (a), we calculate the values using the given formula with u(x) equals x and r(p) equals p squared. For Act A, the outcome is 100 with probability 1. The value is simply 100. For Act B, outcomes are 0, 100, 500. The cumulative probability of at least 100 is 0.90. The cumulative probability of at least 500 is 0.10. The value is 0 plus (100 minus 0) times r(0.90) plus (500 minus 100) times r(0.10). This equals 100 times 0.81 plus 400 times 0.01, which is 81 plus 4, totaling 85. Thus A is preferred to B. For Act C, outcomes are 0 and 100. Cumulative probability of at least 100 is 0.11. Value is 0 plus 100 times r(0.11), which is 100 times 0.0121, equaling 1.21. For Act D, outcomes are 0 and 500. Cumulative probability of at least 500 is 0.1. Value is 0 plus 500 times r(0.1), which is 500 times 0.01, equaling 5. Thus D is preferred to C. This pattern violates the Independence axiom of Expected Utility theory. In Expected Utility, preferring A to B implies preferring C to D because the 0.89 chance of 100 is a common consequence that should cancel out. No concave utility function can reproduce this because Expected Utility is linear in probabilities. Concavity affects the valuation of outcomes, not the weighting of probabilities across different states. Any utility function that respects the axioms must satisfy Independence, so the violation cannot be fixed by adjusting curvature alone.

  For part (b), consider Act X yielding 100 with probability 0.5 and 0 with probability 0.5. Consider Act Y yielding 100 with probability 0.5 and 0 with probability 0.5, but described as two distinct states each with probability 0.25 yielding 100, and one state with probability 0.5 yielding 0. Under the shortcut model, Act X values the 100 as u(100) times r(0.5). Act Y values the 100s as u(100) times r(0.25) plus u(100) times r(0.25). If r(p) equals p squared, r(0.5) is 0.25, while 2 times r(0.25) is 2 times 0.0625 which is 0.125. The shortcut model prefers X to Y even though they are objectively equivalent. To show dominance violation, imagine Act Z pays 100 in state 1 and 0 in state 2. Act W pays 100 in state 1 and 10 in state 2. W dominates Z. But if we split state 1 in W into two sub-states, the weighting changes non-linearly. The cumulative model avoids this because it weights increments of utility by the probability of achieving at least that level. Splitting a probability mass for a given outcome does not change the cumulative probability of achieving outcomes better than it, nor the increment value. The cumulative probability function remains step-wise constant regardless of how equiprobable states are partitioned, ensuring extensionality and respecting dominance.

  For part (c), the agent is not necessarily rationally criticisable if the risk attitude is global over portfolios rather than myopic over single bets. The theory permits risk aversion over the distribution of total wealth. Refusing the single bet but accepting the aggregate sequence can be consistent if the agent evaluates the total distribution of the sequence, which by the law of large numbers becomes nearly certain profit. This implies such risk aversion is permitted but not required by rationality, as Expected Utility agents could also accept the sequence if they evaluate it holistically. However, dynamic consistency is tricky. If the agent refuses the first bet based on the single distribution, she must treat the sequence as a single bundled act. If she evaluates them sequentially, she might reject each individually. The theory licenses the bundled evaluation, so she has not changed her mind irrationally provided she commits to the bundle. However, if she re-evaluates at each step using the same risk function on the remaining bets, she might reject the next bet, leading to dynamic inconsistency. Rationality requires she either commits to the bundle or accepts that her risk attitude applies to the marginal bet in context of current wealth, which might shift as wealth changes during the sequence.

  MARKING SCHEME

  Total marks are 25. Part (a) is worth 8 marks. Students must correctly calculate the four values to show the preference flip, worth 4 marks. Deduct 1 mark for each calculation error. They must identify the violation of Independence, worth 2 marks. They must explain that Expected Utility linearity in probabilities prevents concave utility from fixing this, worth 2 marks. Penalize heavily if the student claims concave utility can solve Independence violations. Part (b) is worth 9 marks. Students must demonstrate a dominance violation or equivalence violation with the shortcut model, worth 4 marks. A clear example using probability splitting is required. They must explain why the cumulative method preserves dominance because cumulative probabilities are invariant to state partitioning, worth 5 marks. Answers that treat individual and cumulative weighting as notational variants should receive zero marks for this section. Part (c) is worth 8 marks. Students must discuss the portfolio effect versus myopic evaluation, worth 3 marks. They must address whether the attitude is required or permitted, noting it is permitted, worth 2 marks. They must address dynamic consistency and commitment, worth 3 marks. Answers that simply recite the Allais paradox without engaging the specific Samuelson prompt should lose 3 marks. Answers that claim the agent is irrational solely for refusing the single bet without considering the bundle evaluation should lose 2 marks. First-class answers will integrate the structural explanation of dominance in (b) with the diachronic stability in (c), noting that cumulative weighting supports consistent bundling.
