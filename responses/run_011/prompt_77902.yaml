prompt: |-
  I am the research-integrity officer at a mid-sized research university. My office investigates allegations of fabrication, falsification, and plagiarism in published work. Roughly once a month a respondent's written answer does not contest the facts we have assembled but contests the standing of the methods by which we assembled them: the image-analysis suite used to conclude that a panel was manipulated has never been validated on images from the instrument that produced it; the finding that records are missing depends on a laboratory logbook that the allegation itself says was written up after the fact; the statistical test showing an excluded outlier was material was selected after the outlier was seen; and, at the outer limit, the claim that an office whose remit is to find misconduct cannot be structurally capable of finding none. Two of my findings in the past three years were set aside on internal appeal on the ground of circularity — the panel held that I had used the contested method to establish the reliability of the contested method. I do not think that criticism was empty, but I also cannot suspend an inquiry every time a respondent names a presupposition, and neither of my two investigators has any training in epistemology.

  What I want is a decision procedure my office can run, and I want it built from whatever is usable in the philosophical discussion of Moore's proof of an external world — the argument that proceeds from a pair of demonstrated hands to the existence of the external world, and the subsequent debate over whether an argument can confer warrant on a conclusion when the warrant for its premises already depends on that conclusion being true. The parts I suspect are portable are: the distinction between an argument's being epistemically in good standing and its being useless for persuading someone who doubts the premises; the idea that some warrant is not evidential at all but is something an inquirer is entitled to proceed on absent specific grounds for doubt; and the opposing insistence that a doubt must have a determinate object before it obliges anyone to answer it. I am not after a survey of that debate, and I do not want a bibliography or a reading list — if this ends up in a policy document I will supply the references myself. I want to know what survives translation into a form two non-specialists can apply under deadline.

  Please deliver the following.

  First, a classification test that can be run on a challenge letter in under two minutes, sorting it into kinds — a challenge that the method fails by its own internal standards; a challenge that the warrant for the method depends on the very conclusion in dispute; a challenge to something no evidence in the proceeding could reach; a challenge that is really an objection to persuasiveness rather than to correctness; and a challenge filed to consume time. Give me the discriminating question for each kind and the tell-tale sentences that signal it.

  Second, an ordered procedure that follows from that classification: the questions to ask in sequence, what counts as a sufficient answer to each, and the default action at each exit — proceed on the record, commission independent validation from a party with no stake in the outcome, suspend, or refer upward. Our constraints are hard: a challenge must be classified within two working days of receipt, a finding must be producible within thirty working days, and any suspension longer than twenty working days requires the provost's signature. We also maintain a standing register of methods whose presuppositions have already been litigated, so that a challenge to a registered method is answered by citing the prior ruling; the procedure must say when a register entry should be reopened and when the register itself becomes a way of freezing a bad ruling in place.

  Third, mark every point at which the procedure must stop and hand the matter to a person because what remains is a question of institutional values rather than fact. Say what those questions are and who should answer them. My adjudication panel is two scientists and one lay member, none of whom will read philosophy.

  Fourth, run the procedure on three cases: the unvalidated image-analysis suite; the logbook that is both the evidence for missing records and the object of the allegation; and the challenge that the office's funding by the institution disqualifies any procedure it runs. For at least one of them, tell me plainly that the procedure yields an outcome I will dislike — obliging me to treat a challenge I consider frivolous as legitimate, or permitting me to dismiss a serious one on grounds that will read as circular in the written findings. Say which case that is and why.

  Fifth, state the failure modes honestly: which of the classification steps are judgment calls dressed up as procedure, how the test can be gamed by a well-advised respondent, and what the procedure cannot decide at all. One further constraint on the drafting: every exit must be justifiable in a single paragraph that a non-specialist panel, and on appeal a lawyer with no patience for philosophy, can follow — which means the written justification may not contain the phrase "begs the question" or any synonym of it, since on appeal those read as admissions. Give me the plain-language substitutes you would have my investigators use instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Research Integrity Officer (RIO) at a mid-sized university.
      *   **Task:** Create a decision procedure for handling respondent challenges to investigative methods (epistemological challenges) based on G.E. Moore's "Proof of an External World" debate concepts (warrant, entitlement, circularity, doubt).
      *   **Constraints:**
          *   Must be usable by non-specialists (two investigators, no epistemology training).
          *   Time limits: Classification < 2 days, Finding < 30 days, Suspension > 20 days needs Provost.
          *   Output: No bibliography/reading list. No philosophical jargon in final justifications (specifically ban "begs the question").
          *   Specific Deliverables:
              1.  Classification Test (5 kinds, discriminating questions, tell-tale sentences).
              2.  Ordered Procedure (sequence, sufficient answers, default actions, register management).
              3.  Hand-off Points (where institutional values override fact, who decides).
              4.  Case Studies (run the procedure on 3 specific cases, admit an unpopular outcome).
              5.  Failure Modes (judgment calls, gaming, limitations, plain-language substitutes for banned phrases).
      *   **Tone:** Professional, operational, precise, actionable, honest about limitations.

  2.  **Deconstruct the Philosophical Core (Moore & Wright/Epistemology):**

      *   *Moore's Proof:* "Here is a hand" $\rightarrow$ "External world exists."
      *   *The Problem:* To know "Here is a hand," you arguably already need to know "External world exists." This is *epistemic circularity*.
      *   *Relevant Concepts for RIO:*
          *   *Warrant vs. Persuasion:* An argument can be valid (warranted) even if it doesn't convince a skeptic who rejects the premises. (Moore is right, but the skeptic isn't irrational).
          *   *Entitlement (Wright):* We are entitled to assume certain things (perception works, logs are real) *unless* there is specific reason to doubt. We don't need to prove the foundation every time.
          *   *Specific vs. Global Doubt:* A doubt needs a specific object. "Everything might be fake" is not actionable. "This specific log entry is fake" is.
          *   *Circularity:* Using a method to validate itself is bad *if* the method is the specific point of contention. But using a method that is *generally accepted* is fine.

  3.  **Drafting Section 1: Classification Test:**

      *   Need 5 categories based on the prompt's list:
          1.  Internal Failure (Method fails its own rules).
          2.  Circular Warrant (Method proves itself).
          3.  Unreachable (Evidence can't address the claim).
          4.  Persuasion vs. Correctness (Admits facts, fights interpretation).
          5.  Delay Tactic (Bad faith).
      *   *Constraint:* Under 2 minutes. Needs simple Yes/No questions.
      *   *Tell-tale sentences:* Need to sound like actual respondent letters.

  4.  **Drafting Section 2: Ordered Procedure:**

      *   Needs to flow from classification.
      *   *Steps:* Check Register $\rightarrow$ Assess Doubt Specificity $\rightarrow$ Assess Entitlement $\rightarrow$ Decision.
      *   *Register Management:* When to update? When a new method is validated externally. When to ignore? When the prior ruling was procedural, not substantive.
      *   *Actions:* Proceed, Independent Validation, Suspend, Refer Up.
      *   *Time Limits:* Must fit the 2/30/20 day constraints.

  5.  **Drafting Section 3: Hand-off Points (Values vs. Fact):**

      *   Where does epistemology end and policy begin?
      *   *Risk Tolerance:* How much uncertainty is acceptable?
      *   *Resource Allocation:* Is independent validation worth the cost?
      *   *Institutional Reputation:* Does this look bad even if technically correct?
      *   *Who:* Provost or Legal Counsel (not the panel).

  6.  **Drafting Section 4: Case Studies:**

      *   *Case 1: Unvalidated Image Analysis.* (Specific doubt about tool). Likely needs independent validation.
      *   *Case 2: The Logbook.* (Circular evidence). This is the tricky one. The log proves the missing records, but the log is alleged to be fake. This is Moorean circularity.
      *   *Case 3: Office Funding/Structure.* (Global doubt). This is a "Global/Structural" challenge. Should be dismissed as non-specific doubt (Entitlement).
      *   *Unpopular Outcome:* I need to admit one where the procedure forces a result the RIO dislikes.
          *   *Idea:* The Logbook case. The RIO thinks the log is obviously fake. But the procedure might say "You can't use the log to prove the log is fake without external corroboration." Or, conversely, the Procedure forces the RIO to *accept* the log because the doubt isn't specific enough.
          *   *Better Idea:* The "Office Funding" case. The RIO knows it's a stalling tactic. But the procedure might require a formal rejection that looks like ignoring the conflict of interest concern.
          *   *Best Idea for "Dislike":* The Logbook case. If the procedure demands independent validation for the logbook to break the circle, it burns time (20 days). The RIO might feel they *know* it's falsified but are handcuffed. OR, the procedure forces dismissal of the image analysis because the doubt is "global" about the software, which feels wrong.
          *   *Selection:* I will choose the **Logbook Case**. The procedure will likely require *suspending* for independent validation (handwriting dating, etc.) because the evidence is circular. The RIO dislikes this because it delays justice and validates a likely fraudster's stalling.

  7.  **Drafting Section 5: Failure Modes & Plain Language:**

      *   *Judgment Calls:* Determining "specific doubt" vs. "global skepticism."
      *   *Gaming:* Respondents framing specific doubts as global ones to trigger suspension.
      *   *Banned Phrases:* "Begs the question," "Circular," "Epistemic warrant."
      *   *Substitutes:* "Assumes the conclusion," "Self-supporting," "Relies on the disputed item."

  8.  **Review and Refine:**

      *   *Check Constraints:* Did I use banned phrases in the *justification examples*? (Must avoid "begs the question").
      *   *Check Tone:* Is it bureaucratic enough for a policy but philosophical enough to address the prompt's core?
      *   *Check Moore/Wright Translation:* Did I actually use the "Entitlement" concept (presumption of innocence for methods) and "Specific Doubt"? Yes.
      *   *Check Time Limits:* Ensure the procedure steps fit the 30-day window. (Independent validation eats time, need to flag that).

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest a philosophical committee. *Correction:* No, prompt says panel is 2 scientists + 1 lay. No philosophers.
      *   *Initial thought:* Allow suspension for any method challenge. *Correction:* No, 20-day limit. Must filter heavily.
      *   *Refining the "Circularity" ban:* The prompt says "written justification may not contain... 'begs the question' or any synonym... since on appeal those read as admissions." I need to be careful. I can discuss circularity in the *procedure instructions* to the RIO, but the *output justification* to the respondent/panel must use the plain language substitutes.
      *   *Refining the "Unpopular Outcome":* I need to be explicit. "For the Logbook Case, the procedure requires suspension for external dating. You will dislike this because it rewards delay."

  10. **Final Polish:** Ensure the distinction between *Classification* (2 mins) and *Procedure* (2 days) is clear. Ensure the "Register" logic is sound (don't freeze bad rulings).

  *(Self-Correction on the "Circularity" ban)*: The prompt says "written justification may not contain the phrase 'begs the question' or any synonym of it". I need to make sure I don't use "circular reasoning" in the *sample justifications* either. I will use "relies on the disputed evidence to verify itself."

  *(Self-Correction on Moore)*: Ensure I'm capturing the "Entitlement" aspect (Wright). We are entitled to trust the method *unless* there is specific reason not to. This is the key to filtering the "Office Funding" challenge.

  Let's assemble the document.cw
answer: |-
  **MEMORANDUM**
  **TO:** Research Integrity Officer
  **FROM:** Procedural Design Consultant
  **SUBJECT:** Decision Procedure for Methodological Challenges (Moore-Wright Protocol)

  This document operationalizes epistemological distinctions regarding warrant and doubt into an administrative workflow. It is designed for use by investigators without philosophical training, within your stated time and resource constraints.

  ### I. The Classification Test (Intake Triage)

  **Purpose:** Sort incoming challenge letters within two minutes of reading.
  **Constraint:** Must be completed within two working days of receipt.
  **Instructions:** Read the challenge paragraph regarding methods. Ask the five questions below in order. The first "Yes" determines the classification.

  | Kind | Discriminating Question | Tell-Tale Sentences |
  | :--- | :--- | :--- |
  | **1. Internal Failure** | Does the respondent claim the method violated its own documented rules? | "The software settings described in the report do not match the manufacturer's manual for this mode." <br> "The protocol requires two witnesses, but only one signed." |
  | **2. Circular Warrant** | Does the evidence used to prove the error rely on the very item alleged to be erroneous? | "You used the logbook to prove the logbook was altered." <br> "The software detected manipulation in the software's own output." |
  | **3. Unreachable** | Is the challenge about a fact that no evidence in the current record could possibly confirm or deny? | "You cannot know what the PI was thinking." <br> "There is no way to verify the conditions in the lab ten years ago." |
  | **4. Persuasion Objection** | Does the respondent accept the data but argue a different interpretation is equally reasonable? | "Another expert might read this band differently." <br> "This is a difference of scientific opinion, not fact." |
  | **5. Delay Tactic** | Is the challenge vague, global, or repeated without new evidence? | "Your entire office is biased." <br> "No method is perfect." <br> (See prior correspondence for identical phrasing). |

  ---

  ### II. The Ordered Procedure

  **Purpose:** Move from classification to decision within the 30-day finding window.
  **Constraint:** Suspension >20 days requires Provost signature.

  **Step 1: Check the Method Register**
  *   **Action:** Search the standing register for the contested method (e.g., "Image Forensics Suite v4").
  *   **If Found:** Cite the prior ruling.
      *   *Reopen Register If:* The respondent provides *new, specific* evidence that the prior ruling relied on data now known to be flawed.
      *   *Do Not Reopen If:* The challenge is a restatement of the same theoretical objection already rejected.
  *   **If Not Found:** Proceed to Step 2.

  **Step 2: Assess the Specificity of Doubt**
  *   **Question:** Has the respondent identified a specific failure mode (e.g., "this sensor type creates artifacts") or a general possibility of error (e.g., "software can be wrong")?
  *   **Sufficient Answer:** Specific failure mode linked to the instrument used.
  *   **Default Action:**
      *   *Specific:* Proceed to Step 3.
      *   *General:* **Proceed on Record.** (Rationale: Inquiry is entitled to rely on standard tools absent specific evidence of failure.)

  **Step 3: Assess the Source of Warrant**
  *   **Question:** Is the evidence supporting the method independent of the data being tested?
  *   **Sufficient Answer:** Yes, the validation comes from external controls, calibration logs, or manufacturer specs.
  *   **Default Action:**
      *   *Independent:* **Proceed on Record.**
      *   *Dependent (Circular):* Proceed to Step 4.

  **Step 4: Evaluate Resource Cost vs. Risk**
  *   **Question:** Can independent validation be obtained within 15 working days without halting the entire inquiry?
  *   **Sufficient Answer:** Yes, an external lab can test the specific image/log within the timeframe.
  *   **Default Action:**
      *   *Yes:* **Commission Independent Validation.** (Note: Triggers 20-day suspension limit).
      *   *No:* **Refer Upward.** (To Provost/General Counsel for risk assessment on proceeding without validation).

  ---

  ### III. Hand-Off Points (Values vs. Fact)

  The procedure above handles factual and logical consistency. It cannot decide institutional risk tolerance. At the following points, the file must be transferred to the **Provost or General Counsel**. The Adjudication Panel (Scientists + Lay Member) must not decide these.

  1.  **The "Refer Upward" Exit (Step 4):**
      *   *The Question:* Is the reputational risk of proceeding without independent validation higher than the risk of delaying the finding?
      *   *Why:* This is a resource and reputation calculation, not a factual one.
  2.  **Reopening the Register:**
      *   *The Question:* Does admitting this challenge undermines confidence in past findings enough to warrant the cost of review?
      *   *Why:* This balances finality against accuracy, an institutional policy choice.
  3.  **Dismissal of "Delay Tactic" Challenges:**
      *   *The Question:* Is the appearance of fairness served by ignoring a challenge that is technically valid but strategically timed?
      *   *Why:* Deciding when "process" becomes "harassment" is a legal/HR determination.

  ---

  ### IV. Case Studies

  **Case 1: The Unvalidated Image-Analysis Suite**
  *   **Classification:** *Internal Failure* (if settings mismatch) or *Circular Warrant* (if the software validates its own finding). Let us assume the challenge is: "This suite has never been validated for this microscope."
  *   **Procedure Run:**
      1.  *Register:* Not found.
      2.  *Specificity:* High. Claims instrument incompatibility.
      3.  *Warrant:* Office relied on software default settings (Dependent).
      4.  *Resource:* External validation possible in 10 days.
  *   **Outcome:** **Commission Independent Validation.**
  *   **Justification:** "The inquiry relies on a tool whose compatibility with the source instrument is disputed. To ensure the finding rests on verified data, an external party will confirm the tool's output."

  **Case 2: The Logbook (Evidence and Object)**
  *   **Classification:** *Circular Warrant.* The log proves the records are missing; the allegation says the log is fabricated.
  *   **Procedure Run:**
      1.  *Register:* Not found.
      2.  *Specificity:* High. Claims the log was written post-facto.
      3.  *Warrant:* The office used the log's timestamps to verify the log's authenticity. (Dependent).
      4.  *Resource:* Ink dating or handwriting analysis takes 25 days.
  *   **Outcome:** **Refer Upward.** (Exceeds 20-day suspension limit for validation).
  *   **Unpopular Outcome Warning:** You will dislike this. The procedure identifies the logical circle but the time constraint forces you to the Provost. You likely believe the log is fake. The procedure prevents you from simply asserting that without external proof, effectively rewarding the respondent's delay. You must accept that without external dating, you cannot break the circle within your statutory window.

  **Case 3: Office Funding/Structure**
  *   **Classification:** *Delay Tactic* (Global Doubt).
  *   **Procedure Run:**
      1.  *Register:* N/A.
      2.  *Specificity:* Low. Claims structural bias, not specific methodological failure.
      3.  *Warrant:* N/A.
      4.  *Resource:* N/A.
  *   **Outcome:** **Proceed on Record.**
  *   **Justification:** "The challenge questions the office's authority rather than the evidence presented. The inquiry is entitled to proceed on the assumption of its own authority absent specific evidence of bias in this specific case. No factual error was demonstrated."

  ---

  ### V. Failure Modes and Plain-Language Substitutes

  **1. Judgment Calls Dressed as Procedure**
  *   **Specificity of Doubt (Step 2):** Distinguishing a "philosophical possibility" from a "specific failure mode" is subjective. A well-advised respondent will phrase a global doubt specifically (e.g., instead of "software is unreliable," they will write "Software version X has a known bug in lighting condition Y").
      *   *Mitigation:* Require the respondent to cite the specific technical literature or manual section. If they cannot cite a source, it defaults to General Doubt.
  *   **The Register Freeze:** Relying on the Register creates *stare decisis* without legal oversight. A bad ruling becomes permanent policy.
      *   *Mitigation:* The "Reopen" clause requires Provost approval if the method has been used in more than three closed cases.

  **2. Gaming the System**
  *   **The "Specific" Stall:** Respondents will file "Specific" challenges they know you cannot validate in 20 days, forcing a *Refer Upward* to burn time.
      *   *Mitigation:* Step 4 requires the investigator to confirm the external lab's turnaround time *before* commissioning. If it exceeds 15 days, default to *Refer Upward* immediately.

  **3. What the Procedure Cannot Decide**
  *   It cannot determine truth when all available evidence is circular (see Case 2).
  *   It cannot validate the office's own legitimacy (see Case 3).
  *   It cannot weigh the moral cost of a false positive vs. a false negative.

  **4. Plain-Language Substitutes for Banned Phrases**
  *   *Constraint:* Do not use "begs the question," "circular," "epistemic," "warrant," or "presupposition" in written findings.
  *   *Substitutes:*
      *   Instead of "Begs the question": **"Relies on the disputed item to verify itself."**
      *   Instead of "Circular reasoning": **"The evidence and the conclusion are the same."**
      *   Instead of "Lacks epistemic warrant": **"There is no independent support for this claim."**
      *   Instead of "Entitlement to assume": **"Standard practice allows us to proceed unless..."**
      *   Instead of "Specific vs. Global doubt": **"The challenge identifies a concrete error vs. a general possibility."**

  **Sample Justification Paragraph (for Appeal):**
  > "The Respondent argues that the image analysis is unreliable because the software cannot validate its own output. However, the inquiry does not rely on the software to validate itself. We rely on the manufacturer's calibration records, which are independent of the software's analysis. Therefore, the finding rests on external support, not on the disputed data alone. The challenge suggests a general possibility of error but does not identify a specific failure in this instance."
