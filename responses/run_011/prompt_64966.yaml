answer: |-
  1.
  **Question:** You argue that when a classifier identifies a tumour, it is literally representing a tumour, not just acting as if it does. Does this literal truth depend on the model being correct, or does a mistaken classification still involve representation?
  **Likely Answer:** Representation is fixed by the system's design and use, so a mistake is still a representation, just a false one.
  **Follow-up:** If a false representation is still a representation, does the content depend on what the model was trained to find, or what it actually finds in the data?
  **Tag:** Commitment 1 (Content Realism); Concession: Must distinguish between intended content and statistical correlation.

  2.
  **Question:** You claim internal features like those from sparse autoencoders do not bear content in their own right. If a feature reliably correlates with a concept across many inputs, why is it meaningless to call it the feature for that concept?
  **Likely Answer:** Because correlation does not fix content; only the model's role in the broader practice determines what that feature is about.
  **Follow-up:** If the practice fixes the content, does that mean the feature's meaning could change without the weights changing, simply by changing how humans use the output?
  **Tag:** Commitment 3 (Vehicle Anti-Realism); Concession: Must admit content is unstable relative to internal structure.

  3.
  **Question:** Functionalists argue beliefs are real but not located in specific brain states. Why doesn't this allow you to say model features are real vehicles, even if they don't map to single circuits?
  **Likely Answer:** Because belief tokens are defined by causal role, whereas model features lack stable causal roles independent of training history.
  **Follow-up:** If causal role depends on history, doesn't that mean the vehicle is still real, just historically indexed, rather than ontologically empty?
  **Tag:** Commitment 3 (Vehicle Anti-Realism); Concession: Must admit vehicles exist relative to history.

  4.
  **Question:** If it is literally true that a model represents tumours, something physical must make that true. Since you deny internal parts do this, is it the whole system's behaviour that makes it true?
  **Likely Answer:** Yes, the truthmaker is the whole trained input–output disposition.
  **Follow-up:** If the disposition makes it true, and the disposition depends on internal weights, why is identifying the specific weights contributing to that disposition a category error rather than just difficult?
  **Tag:** Commitments 1 & 3 (Coherence); Concession: Must admit internal structure is relevant to truth conditions.

  5.
  **Question:** Suppose amplifying a candidate feature shifts the model's behaviour exactly as your account of representation demands. What condition is still unmet for calling that direction the vehicle?
  **Likely Answer:** The intervention shows causal leverage, but not that the direction itself carries content independent of the system's use.
  **Follow-up:** Can you state that distinguishing condition in advance, or do you only recognise it after the fact by checking if the intervention worked?
  **Tag:** Commitment 3 (Vehicle Anti-Realism); Concession: Must admit operational criteria for vehicles.

  6.
  **Question:** If content is fixed by training history, could two identical models represent different things? Do you accept that a model may represent what it would never respond to?
  **Likely Answer:** Yes, because content is determined by the environment it was shaped for, not just current activation.
  **Follow-up:** If the model never responds to it, in what sense is the content real rather than just a label we apply based on its past?
  **Tag:** Commitment 2 (Externalism); Concession: Must admit content is observer-relative in practice.

  7.
  **Question:** You cite downstream use as fixing content. If a model trained for cats is used for tumours, does its content change, and does this mean the ascribed content disjoins across contexts?
  **Likely Answer:** The content shifts because the practice surrounding the model has shifted, even if the weights remain identical.
  **Follow-up:** If content shifts without physical change, does this not imply that the representation resides in the user rather than the model?
  **Tag:** Commitment 2 (Externalism); Concession: Must clarify locus of representation.

  8.
  **Question:** Name a claim that working interpretability researchers make that your view renders false or meaningless. Why is this a substantive verdict rather than just changing the definitions?
  **Likely Answer:** The claim that a specific circuit is the unique seat of a concept is meaningless, because no unique seat exists.
  **Follow-up:** If finding that circuit is impossible, why do you maintain representation is literally true rather than useful fiction?
  **Tag:** Commitments 1 & 4 (Realism vs Category Error); Concession: Must clarify distinction between content and mechanism.

  9.
  **Question:** What finding would oblige you to abandon commitment 2 outright instead of reinterpreting it? Please avoid citing the field's immaturity.
  **Likely Answer:** A demonstration that internal structure fixes content regardless of training history or downstream use.
  **Follow-up:** If such a demonstration exists, does it not imply your externalism was false from the start, rather than just incomplete?
  **Tag:** Commitment 2 (Externalism); Concession: Must admit internalism is possible.
