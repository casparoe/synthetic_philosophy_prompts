answer: |-
  # Seminar Game: "The Architect's Wager"

  ## 1. Overview & Setup
  *   **Time:** 90 Minutes.
  *   **Players:** 16 Students.
  *   **Teams:** 4 Teams of 4 (Deliberately mix Phil/CS on each team).
  *   **Roles:** Each team is an "Architectural Firm." You are the "Client" (Game Master).
  *   **Currency:** **Certainty Tokens (CT)**. Printed slips or whiteboard tally.
      *   Starting endowment: 10 CT per team.
      *   Bankruptcy (0 CT): Team is "fired" (eliminated from scoring, but can still observe/audit).
  *   **Materials:**
      *   Whiteboard (for the "Public Ledger").
      *   Index cards (for "Blueprints" and "Audits").
      *   A sealed envelope labeled **"The Infinite Sequence."**

  ## 2. Core Mechanics
  1.  **The Ledger (Lock-in):** Teams write claims on the Public Ledger. Once written, a claim **cannot be erased or modified**. It is permanent.
  2.  **The Audit (BHK):** Any team may spend 2 CT to **Challenge** a claim on the Ledger. The claiming team must immediately submit an Index Card "Blueprint" proving they can make good on the claim.
      *   *Atomic Claim:* Show the fact.
      *   *Disjunction ($A \vee B$):* Mark which one holds + prove it.
      *   *Existence ($\exists x$):* Provide the specific $x$ + prove it satisfies the condition.
      *   *Negation ($\neg A$):* Show that assuming $A$ leads to a contradiction with the Public Ledger.
      *   *Failure:* If the Blueprint is invalid or incomplete, the claiming team loses 5 CT. The challenger gains 2 CT.
  3.  **Information Rounds:** The game proceeds in 3 Rounds. Between rounds, the Client (you) releases new "Site Data" (information) that may make previous claims risky, but never invalidates a valid Blueprint.

  ## 3. The Rounds (Minute-by-Minute)

  ### Phase 1: Setup & Rules (00:00 – 00:10)
  *   Distribute teams and tokens.
  *   Explain the Ledger and Audit rules.
  *   **Crucial Rule:** "You are not paid for what is *true*. You are paid for what you can *secure*. If you write it down, you own it forever."

  ### Phase 2: Round 1 — The Finite Site (00:10 – 00:30)
  *   **Context:** A finite set of numbers $S = \{1, 2, ..., 10\}$.
  *   **Task:** Teams earn CT by making claims about $S$.
  *   **Data:** You reveal 5 numbers in $S$ are "Red" (e.g., 2, 4, 6, 8, 10). The rest are hidden.
  *   **Trap:** Teams want to assert "There exists a Red number" (Easy, 1 CT) vs "For all $x$, $x$ is Red or Not-Red" (Harder audit).
  *   **Goal:** Get them comfortable with the Audit. If they assert $\exists x (Red(x))$, they must write '2' on the index card. If they assert $Red(1) \vee \neg Red(1)$, they must pick one.
  *   **CS/Phil Dynamic:** CS students will try to write code for the audit. Phil students will check if the code actually terminates. Enforce the "Hand Execution" rule: The audit must be traceable by a human in 2 minutes.

  ### Phase 3: Round 2 — The Poisoned Well (00:30 – 00:50)
  *   **Context:** Introduce a predicate $Q(x)$ defined as "The sequence $x$ leads to a contradiction with current Ledger data."
  *   **New Data:** You reveal that $Q(3)$ is true.
  *   **Task:** Teams can assert $\neg Q(3)$.
  *   **The Wall:** To assert $\neg Q(3)$, they must show that assuming $Q(3)$ crashes the Ledger. Since you just revealed $Q(3)$ is true, asserting $\neg Q(3)$ is suicide.
  *   **The Real Lesson:** Teams will want to assert $\neg Q(5)$ (where $Q(5)$ is unknown). To do so, they must prove that *even if* more data is revealed, $Q(5)$ can *never* become true.
  *   **Mechanic:** If a team asserts $\neg A$, they lock in a bet. If *any future round* reveals $A$ is verified, they lose 10 CT immediately. This makes Negation a claim about the *future stability* of information, not just current ignorance.

  ### Phase 4: Round 3 — The Infinite Wall (00:50 – 01:10)
  *   **Context:** The Sealed Envelope.
  *   **Predicate:** $P(n)$: "The digit sequence '7777777777' (ten 7s) starts at position $n$ in the decimal expansion of $\pi$."
  *   **The Offer:** You offer 20 CT (massive payout) for the claim: $\forall n (P(n) \vee \neg P(n))$.
  *   **The Trap:** This is an instance of Excluded Middle (LEM). Classically, it's free. Intuitionistically, it claims you have a method to decide $P(n)$ for *any* $n$.
  *   **The Audit Condition:** To cash out, they must provide a **Decision Procedure** on the Index Card.
      *   *Constraint:* The procedure must include a **proof of termination** for all inputs.
      *   *Catch:* A "Search until you find it" algorithm does not have a known bound. Therefore, it fails the audit *in principle*, not just in time.
  *   **The Right Move:** The rational move is to **refuse the claim**. Teams that write nothing on this round keep their tokens. Teams that assert LEM will try to write a search algorithm. You (the Auditor) reject it because they cannot prove the search halts. They lose the audit fee.
  *   **Alternative:** A team might assert $\neg \forall n (P(n) \vee \neg P(n))$. This is also hard. The best move is silence (withholding judgment).

  ### Phase 5: The Debrief & Mapping (01:10 – 01:30)
  *   **Scoreboard:** Tally remaining CT.
  *   **Discussion:** Transition from game mechanics to logical semantics.

  ---

  ## 4. Facilitator Script: Mapping Game to Logic

  *Do not use this script during the game. Use it only in the final 20 minutes.*

  **1. The Lock-in Rule $\rightarrow$ Persistence (Kripke Monotonicity)**
  *   *Say:* "In the game, once you wrote a claim on the Ledger, you couldn't erase it, even when I gave you new data. In the logic we are studying, truth is not a static label. It is a state of verification. When we move from one state of knowledge to a richer one (Round 1 to Round 2), we cannot lose what we have already verified."
  *   *Formal:* "This is **Persistence** in Kripke Models. If $w \Vdash A$ and $w \leq v$, then $v \Vdash A$. Your Ledger was the chain of worlds. Your locked claims were the forcing relation."

  **2. The Audit $\rightarrow$ The BHK Interpretation**
  *   *Say:* "Why did Team 2 lose points on the 'Exists' claim in Round 1? They knew a Red number existed. But they couldn't point to *which one* until they checked. In this logic, 'Existence' isn't a metaphysical fact. It's a commitment to produce a witness."
  *   *Formal:* "This is the **BHK Interpretation**. A proof of $\exists x P(x)$ is a pair $(n, \pi)$ where $n$ is the witness and $\pi$ is the proof that $P(n)$. The Audit wasn't a test of your honesty; it was a test of whether you possessed the proof object."

  **3. The Infinite Wall $\rightarrow$ Rejection of Excluded Middle**
  *   *Say:* "In Round 3, I offered you free points for $P \vee \neg P$. Most of you hesitated. Why? Because to take that bet, you had to hand me a method that works for *any* $n$. A 'search' isn't a method unless you know it stops."
  *   *Formal:* "This is the **Rejection of LEM**. Asserting $A \vee \neg A$ for an infinite domain is a claim of **Omniscience**. It claims you have a uniform decision procedure. Intuitionism rejects this not because we are pessimistic, but because 'Truth' means 'Verified'. If we lack a verification method, the disjunction is not assertable."

  **4. Negation $\rightarrow$ Refutation, not Ignorance**
  *   *Say:* "In Round 2, asserting $\neg A$ cost you more risk than asserting $A$. You had to bet that *no future information* would verify $A$."
  *   *Formal:* "Intuitionistic Negation ($\neg A$) is defined as $A \to \bot$. It is a positive claim that $A$ leads to contradiction. It is not 'I don't know $A$' (which is just lack of information). It is 'I know $A$ is impossible'."

  ---

  ## 5. The Honest Parts: Troubleshooting & Limitations

  ### Predictable Failures & Fixes

  **1. The CS "Big-O" Gambit**
  *   *Problem:* CS students submit an audit algorithm that is technically correct but $O(2^n)$, arguing "It terminates, just slowly."
  *   *Fix:* The Audit Rule states: "Execution must be completable by a human with pen and paper in 2 minutes." This forces **feasibility** in the game.
  *   *Debrief Patch:* Acknowledge this is a game limitation. "In the game, we used time limits to simulate *principle* limits. In Intuitionism, the requirement isn't 'fast', it's 'effective'. An unbounded search is not effective because we lack a proof of termination."

  **2. The Phil "Freeze"**
  *   *Problem:* Philosophy students fear making a false claim and losing tokens, so they assert nothing.
  *   *Fix:* Introduce a "Withholding" bonus. If a team correctly identifies a round where *no* safe claim can be made (Round 3), they gain 2 CT for "Prudent Silence."
  *   *Debrief Patch:* "In logic, withholding assertion is not a failure. It is the correct logical stance when verification is lacking."

  **3. Token Hoarding/Collapse**
  *   *Problem:* Teams stop playing to protect tokens.
  *   *Fix:* "Maintenance Cost." At the start of each round, teams pay 1 CT to stay in the game. This forces action.
  *   *Fix:* If a team hits 0 CT, they are not eliminated. They become "Auditors." They can earn tokens back *only* by successfully challenging other teams. This keeps them engaged and turns them into skeptics.

  ### The 45-Minute Fallback
  If Round 2 runs long or the Audit process bogs down:
  *   **Cut Round 3 Short:** Do not run the full $\pi$ predicate. Instead, hold up the Sealed Envelope and say: "Inside is a truth value I have not determined yet. If I haven't determined it, can you assert it is True or False?"
  *   **Skip Scoring:** Move straight to Debrief. The experience of *hesitation* is more valuable than the token count.

  ### The Critical Gap: Epistemicism vs. Intuitionism
  *This is the most important part of your request.*

  **The Problem:** The game is finite (90 mins). Students will conclude: "Intuitionism is just Classical Logic where we don't have enough time to compute the answer." This is **Epistemicism** (truth is objective, we just don't know it), not Intuitionism (truth is constituted by verification).

  **What the Game Cannot Reproduce:**
  The game cannot reproduce the *ontological* shift. In the game, the $\pi$ sequence *exists* out there. The students feel they just can't reach it. In Intuitionism, the sequence *is* the construction. There is no "out there" independent of the method.

  **The 10-Minute Patch Talk (End of Debrief):**
  *   *Script:* "You might feel that in Round 3, the sequence of 7s in $\pi$ either exists or it doesn't, and we just couldn't find it in 90 minutes. That is the Classical view. That is Epistemicism.
  *   *The Shift:* "Intuitionism asks: What does 'exists' mean? If 'exists' means 'we can construct it', then until we have the construction, it does not exist. It is not that we are ignorant of a pre-existing fact. It is that the fact *is* the construction.
  *   *The Takeaway:* "The game forced you to act as if truth requires verification. But remember: In the seminar, we are not studying human limitations. We are studying a logic where 'Truth' *is defined as* Verification. The wall you hit wasn't a time limit. It was a definition."

  **How to distinguish Refusal from Ignorance (Round 3 Tweak):**
  To make the refusal feel like something other than ignorance, add this rule to Round 3:
  *   "If you assert $P \vee \neg P$, you must provide the Decision Procedure. If you **Refuse** to assert it, you must write: 'I lack a method.'
  *   *Scoring:* If you Refuse, you keep your tokens. If you Assert and fail the Audit, you lose tokens.
  *   *Debrief Point:* "Notice that Refusing was the *winning strategy*. In Classical logic, refusing $P \vee \neg P$ is irrational (it's a tautology!). In this game, refusing was rational. This shows that Intuitionism isn't about being 'unsure'. It's about recognizing that asserting LEM is a claim to power (omniscience) you do not possess."

  ## 6. Summary of Logic Mapping for Your Defense

  If a student pushes you on the Lock-in/Kripke connection:
  *   **Student:** "Why does locking claims map to Kripke models? Kripke models are about possible worlds."
  *   **You:** "In a Kripke model, the relation $w \leq v$ means $v$ has *more information* than $w$. The Persistence Condition ($w \Vdash A \implies v \Vdash A$) says verification is cumulative. You can't 'un-verify' something by learning more. Our Ledger rule enforces cumulativity. If you could erase claims when new data arrived, you'd be playing Classical logic with belief revision. By locking claims, you are playing Intuitionistic logic with information growth."

  If a student pushes on Audit/BHK:
  *   **Student:** "The Audit is just checking if the proof is valid. That's Classical too."
  *   **You:** "Classically, a proof of $\exists x P(x)$ can be non-constructive (e.g., 'Assume no such $x$ exists... contradiction'). In the Audit, I rejected non-constructive arguments. I demanded the witness $n$. That demand *is* the BHK clause. The game mechanics enforced the BHK interpretation by making the witness a physical requirement for payout."

  ---

  ## 7. Final Checklist for the Instructor
  1.  **Print Tokens:** 20 per team to start.
  2.  **Prepare Envelope:** Write "Undecided" inside the Round 3 envelope to reinforce the "no pre-existing truth" vibe during the debrief.
  3.  **Watch the CS Students:** If they try to define "Termination" loosely, shut it down. "Does your algorithm have a bound $k$ such that for all $n$, it stops in $k$ steps? No? Then it's not a valid construction for this game."
  4.  **Watch the Phil Students:** Encourage them to challenge the CS algorithms. "Does that loop actually end? Make them prove it."
  5.  **End Strong:** Ensure the last 5 minutes are dedicated to the "Truth = Verification" ontological shift, not just the game score.
