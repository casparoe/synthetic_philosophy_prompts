          *   *Bias Check:* Does the user only apply this to *harmful* outcomes? If a remote meter prevents fraud and lowers rates for the poor, is that "politics" too? If not, it's a moral critique disguised as structural analysis.
      *   *Section 3: The Rival Account.*
          *   *Distinction:* Causality. User says Tech -> Silence. Rival says People -> Tech -> Silence.
          *   *Test:* The "Moratorium Test." If the utility keeps the meters but bans remote shutoffs via policy, does the political question return?
              *   If Yes (debate resumes): User is right (tech enforced silence).
              *   If No (everyone accepts the ban easily): Rival is right (people were always in charge).
          *   *Empty Theory:* The Rival account is harder to falsify (always blames "people"), making it potentially empty. The User's account is more precise but risks being wrong about *where* the agency lies.
          *   *Survival:* User's case survives as a specific mechanism of *institutional capture*.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "Winner was wrong." I need to address the user's specific three conditions.
      *   *Correction:* On the "Rival Account," I need to be careful not to dismiss it as "obvious." The philosophical point is about *material agency*. Does the matter matter?
      *   *Key Insight:* The user's "Silence" condition is the most vulnerable. If the debate moves from "Should we cut off Mrs. Jones?" to "What is the bad debt allowance?", the question hasn't vanished, it has abstracted. Is that "Silence"? A critic would say no. The user would say yes. This is a definitional battleground.
      *   *Key Insight on Falsifiability:* The user asks what would count as evidence *in favor* that couldn't be reinterpreted. This is hard. Maybe a case where the *engineers* wanted the political feature but the *management* rejected it? No, that proves people have politics. Maybe a case where the tech was installed *accidentally* or for a different reason, and the political effect emerged later? That supports "Artifacts have politics" (unintended consequences).

  8.  **Final Polish:** Check against constraints. No bibliography. Argument focused. Rank defeaters. Honest verdict.

