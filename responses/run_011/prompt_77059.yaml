prompt: |-
  You are writing as a historian of computing who is also a careful philosopher of mind, and who has taught this material to scientists before. Think carefully, and let the plan follow from an explicit account of what each idea depends on rather than from a generic template for lesson planning.

  **Context.** I convene a third-year option module on the history and philosophy of computing. One of my seminars is a single ninety-minute session, one whiteboard, no slides, fourteen students. Every one of them has, in a second-year computer architecture course, hand-built a toy stored-programme machine in software: fetch-decode-execute, a single memory, a program counter. They therefore arrive certain that they already know what "von Neumann architecture" means, and, more damagingly, that von Neumann's posthumously published Yale lectures on the computer and the brain are simply that architecture pointed at a skull. Several have also met him in popular writing, where he is either credited with anticipating modern neural networks or presented as a naive mechanist who thought neurons were just slower valves. Both readings are available to them before I say a word, and I want the seminar to make neither available afterwards.

  **The task.** Do not explain von Neumann's views on the brain to me; I know the material. Plan how I should present it to *these* students, in *this* room, in ninety minutes. What I want is the dependency structure of the explanation and the map of the misconceptions the material and the students will jointly generate, together with the point in the sequence at which each must be headed off. Where you are unsure of von Neumann's exact wording or of the precise content of a particular passage, say so plainly and paraphrase; do not supply quotations, citations or a reading list.

  Please work through the following before settling on an order: which of his comparisons is genuinely load-bearing and which is decorative; whether the memory argument (his point that a memory serving several organs has to be organised differently from one built for a single organ) or the precision-and-depth-of-arithmetic argument (the claim that nervous system arithmetic is very shallow, two or three steps deep, and compensated for by enormous parallelism, with reliability bought by redundancy rather than by numerical precision) should carry the session; where his suggestion that the nervous system's native idiom is closer to logic than to mathematics belongs, and whether it can be stated at this level without inviting the students to hear a proto-symbolic AI thesis; and what has to be true in the room before any of it can be heard as anything other than a list of similarities between brains and valves.

  **Deliverable.** Return a single valid JSON object and nothing else, with exactly these fields:

  - `brainstorm` (string): your working-through of the questions above, including the orderings you rejected and why.
  - `load_bearing_claims` (array of objects): `claim_id` (a short label), `claim` (one sentence stating what the students must accept by the end of the beat that establishes it), `depends_on` (array of `claim_id`s that must already be in place), `why_before_the_next` (what specifically breaks if this claim is deferred, reversed or dropped).
  - `running_order` (array of objects): `beat` (integer, 1-indexed), `title`, `minutes` (integer; the whole sequence should leave roughly ten minutes for the closing check), `claim_id`, `board_state` (what is physically on the whiteboard at the end of the beat, given that I cannot erase and redraw infinitely), `how_i_say_it` (one or two sentences of the actual framing or patter I would use to open the beat).
  - `carrying_example` (object): `example` (the single comparison or scenario the session is built around), `what_it_must_have` (array of strings), `what_it_must_lack` (array of strings), `where_it_breaks` (the point at which the example begins to mislead and must be retired, and what replaces it), `beat_where_introduced` (integer), `verdict_on_my_candidate` (string: I had thought of running everything through his comparison of nerve impulse timings with the switching times of the valves of his day — tell me whether that is the right carrier or a trap that entrenches exactly the "brain as slower computer" reading I am trying to break).
  - `misconception_map` (array of objects): `misconception` (one sentence), `provenance` (either "arrives_with_them" or "manufactured_by_the_sequence"), `arises_after_beat` (integer), `intervention` (what I actually say or write to head it off), `intervention_beat` (integer), `why_this_point` (why the intervention fails if delivered earlier or later). Include at least one misconception that my own presentation will create if I am not careful, and at least one that the stored-programme background specifically produces.
  - `student_questions` (array of two objects, in the order I expect them): `question` (restate it), `trap_in_answering_it_directly`, `take_it_up_at_beat` (integer, or "defer" with a reason), `what_to_say`, `what_not_to_say`. Question 1: a student will ask whether his claim that nervous-system arithmetic is shallow but massively parallel is just deep learning described before there was deep learning. Question 2: a student who has read a popular account will ask whether von Neumann held that consciousness or the brain transcends computation. I want both handled fairly and deflationarily, without my either endorsing the anachronism or sneering at it.
  - `omissions` (array of objects): `cut_topic`, `why_cut_at_this_level`, `what_to_say_out_loud` (the sentence in which I tell them I am cutting it, since I do not want them to leave thinking the lectures contained nothing else).
  - `comprehension_check` (object): `closing_question` (one question, answerable in a few minutes, that distinguishes a student who has understood the argument from one who has merely memorised a list of brain-versus-machine contrasts), `answer_that_shows_it_landed`, `answer_that_shows_the_misconception_survived`, `what_to_do_if_the_second`.
  - `sourcing_caveats` (array of strings): any place where your account rests on a detail of the text you are not confident of, flagged as such.
reasoning: |-
  The user is asking me to plan a 90-minute seminar on von Neumann's views on the brain and computing, specifically for third-year students who have already built a toy stored-programme machine and therefore have strong preconceptions about what "von Neumann architecture" means. They want me to think carefully about the dependency structure of the explanation, not use a generic lesson plan template.

  The deliverable must be a single valid JSON object with specific fields:
  - brainstorm
  - load_bearing_claims
  - running_order
  - carrying_example
  - misconception_map
  - student_questions
  - omissions
  - comprehension_check
  - sourcing_caveats

  Let me work through the key questions the user has asked me to consider:

  1. Which comparisons are load-bearing vs decorative?
  2. Should the memory argument or the precision-and-depth-of-arithmetic argument carry the session?
  3. Where does the "nervous system's native idiom is closer to logic than mathematics" claim belong?
  4. What has to be true in the room before any of this can be heard as anything other than a list of similarities?

  Key misconceptions to address:
  - Students think von Neumann architecture = what they built in second year
  - Students think von Neumann's brain lectures = that architecture applied to skulls
  - Students have encountered either "he anticipated neural networks" or "he was a naive mechanist" readings

  The user's candidate carrying example: nerve impulse timings vs valve switching times. They want me to evaluate whether this is right or a trap.

  Let me think through the dependency structure:

  For students to understand von Neumann's actual argument about brains and computers, they need to:
  1. First understand that their mental model of "von Neumann architecture" is anachronistic (it's been simplified and hardened since his time)
  2. Understand that von Neumann was NOT simply saying "brains are computers" but rather exploring what kind of computing architecture would be needed to model brains


  3. Grasp that his core insight concerned how memory organization, arithmetic precision, and reliability mechanisms differ fundamentally between digital machines and nervous systems

  The memory argument seems more load-bearing than the precision argument because it addresses structural organization rather than just performance characteristics. The precision argument risks reinforcing the "brains are slower computers" misconception the user wants to avoid.

  The "logic vs mathematics" claim is tricky - it could easily be heard as proto-symbolic AI if introduced too early. It needs to come after students understand that von Neumann was questioning the very framework of digital computation, not just applying it to brains.

  For the carrying example: the nerve impulse/valve timing comparison is actually a trap. It entrenches the "brain as slower computer" reading because it invites direct performance comparison rather than structural comparison. A better carrier would be something that highlights organizational differences - perhaps the memory organization argument itself, or the reliability/redundancy vs precision tradeoff.

  Let me structure the 90 minutes:
  - 10 min: Establish what they think they know (and why it's wrong)
  - 15 min: The memory organization argument (load-bearing)
  - 15 min: The precision/reliability argument (supporting)
  - 10 min: The logic vs mathematics claim (carefully framed)
  - 15 min: Work through implications and misconceptions
  - 10 min: Student questions
  - 10 min: Comprehension check and close
  - 5 min: Buffer

  I need to be careful about sourcing caveats - I should flag where I'm uncertain about von Neumann's exact wording.

  Now let me draft the JSON structure with all required fields.
