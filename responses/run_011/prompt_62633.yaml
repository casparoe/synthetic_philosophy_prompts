answer: |-
  **TO:** Committee on Public Statements
  **FROM:** [Your Name]
  **DATE:** Monday, [Date]
  **SUBJECT:** Discussion Draft: Student Coalition Request re: City Shelter Ordinance

  **Note on Status:** As you know, I am a member of the congregation cited in the student proposal's historical claim. I have recused myself from the final vote on this matter. This memo is intended solely as a discussion document to help structure our deliberation. It carries no authoritative weight, and I ask that you review it for procedural clarity rather than advocacy. My goal here is to protect the integrity of the committee and the charter, not to advance a specific outcome.

  ### 1. The Charter Standard: Two Necessary Clarifications

  The student objector and the faculty objector have surfaced two ambiguities in our charter that we must resolve before voting. The charter states the university may speak only where reasons "can be understood and assessed by members of the community regardless of their religious or philosophical commitments."

  **A. Accessibility vs. Consensus**
  *   *The Question:* Do we need reasons everyone *shares* (consensus), or reasons everyone can *access* even if they disagree (accessibility)?
  *   *The Decision:* The charter text ("understood and assessed") points to **Accessibility**. We do not need unanimous agreement on the *value* of the reason, but the *logic* of the reason must be intelligible to a community member who does not hold the specific commitment.
  *   *Implication:* A utilitarian cost-benefit analysis is accessible even to a deontologist who disagrees with the weighting. A covenantal obligation grounded in a specific religious history is *not* accessible to a non-member, as the obligation ceases to exist without the faith commitment.

  **B. Driving vs. Supplemental**
  *   *The Question:* Can religious/particularistic reasons exist in the background so long as public reasons are present, or must the public reasons carry the weight of the argument?
  *   *The Decision:* The charter requires **Driving** public reasons. If the public reasons are merely window dressing for a decision actually driven by particularistic commitments, the standard is failed.
  *   *Implication:* We cannot use public reasons to "translate" a decision that was fundamentally made on private grounds. The public reasons must be sufficient to justify the action on their own.

  ### 2. Application to the Current Request

  The student coalition's packet contains two distinct lines of argument:
  1.  **Public Welfare:** Overdose/hypothermia statistics, ER cost-benefit analysis, campus strain on city services.
  2.  **Covenantal/Historical:** Theological claim of hospitality + historical claim of a destroyed church covenant binding the university to *this specific block*.

  **The Faculty Objection** is correct regarding the second line. A "standing covenant" is inherently particularistic. A community member cannot assess an obligation derived from a specific congregation's theology without sharing that theology.

  **The Student Objection** raises a valid philosophical point (that secular reasons rest on values too), but it conflates *political values* with *religious commitments*. The charter allows for debate over political values (e.g., how to weight property rights vs. life) because these are part of our shared civic discourse. It excludes reasons that rely on entry into a specific faith community or private history to be valid.

  **The Critical Juncture:** The coalition argues the historical/covenantal claim is *necessary* to bind the university to *this specific location*. If the public welfare arguments only justify a shelter *generally*, but the covenant justifies *this block*, then endorsing this specific ordinance relies on the covenant to close the gap. That would violate the "Driving" standard.

  However, the public welfare argument includes "campus strain on city services." If a shelter at this location materially alleviates that strain more than a distant one (due to proximity), the public reason might support the specific location without the covenant.

  ### 3. Recommendation

  **Recommendation:** **Endorse a Version.**

  We should endorse the *policy position* (support for the low-barrier shelter ordinance) based strictly on the **Public Welfare** arguments. We should explicitly **decouple** the university's justification from the **Covenantal/Historical** argument.

  *   **Action:** The committee drafts a statement supporting the ordinance citing public health, fiscal responsibility, and town-gown stability.
  *   **Revision:** We acknowledge the historical context of the block as *background information* provided by the students, but we do not cite the religious covenant as a *premise for the university's obligation*.
  *   **Rationale:** This allows the university to act on the strong secular evidence without violating the charter by institutionalizing a specific religious obligation. It respects the students' advocacy without compromising the university's neutrality.

  ### 4. A Test for Future Requests (The "Freestanding Justification Test")

  To resolve future cases quickly, I propose we adopt the following three-step check. If a request fails any step, it does not meet the charter standard.

  1.  **Isolation:** Identify any reasons that rely on religious doctrine, specific sectarian history, or private philosophical commitments not shared by the broader community.
  2.  **Subtraction:** Remove those reasons from the proposal.
  3.  **Sufficiency:** Do the remaining reasons fully support the *specific* action proposed?
      *   *If Yes:* The request passes (Public reasons are Driving).
      *   *If No:* The request fails (Public reasons are Supplemental/Window Dressing).

  **What this rules out:** This rules out "overlapping consensus" where the university endorses X because Group A has religious reason 1 and Group B has secular reason 2, but neither reason alone justifies X to the whole community. It ensures the institution's voice is always publicly intelligible.

  ### 5. Next Steps

  *   **Action:** I propose we circulate a redrafted statement to the student coalition by **Wednesday noon**, offering endorsement based on the public welfare grounds while explaining the charter constraint regarding the covenantal language.
  *   **Vote:** We schedule a final vote for **Friday morning**. If the coalition rejects the redrafted basis, the recommendation defaults to **Decline**.

  ***

  ### Meta-Commentary for the Author (You)

  **Confidence Level:** Moderate-High (75%).

  **Load-Bearing Hunch:** The weakest link in this reasoning is the distinction between "political values" (allowed) and "religious commitments" (forbidden) in the *Application* section.
  *   *Why:* The Student Objector is right that secular arguments (utilitarianism, human rights) rest on philosophical commitments that are not universally shared. I have drawn a line saying "civic discourse" counts as public but "church covenant" does not. A sophisticated critic could argue this line is arbitrary. If the committee leans heavily into the Student Objector's critique, the "Freestanding Justification Test" might collapse because *no* reason is truly commitment-free.
  *   *Risk:* If the committee decides that *all* values are essentially "religious" in the broad sense, the charter becomes unworkable. I am betting that the committee accepts the standard liberal distinction between public reason and private faith, but that is a philosophical assumption, not a given.

  **Potential Tilts to Watch:**
  1.  **The "Decoupling" Move:** Even though I am recused, recommending that we *keep* the support for the shelter but *drop* the church argument might look like I am trying to save the outcome for my congregation's benefit (getting the shelter built) while sacrificing the theology to save face.
      *   *Mitigation:* Ensure the redrafted statement doesn't sound like a compromise *for* the church, but a compliance measure *for* the university. The tone must be "We cannot say X," not "We will say Y instead."
  2.  **The Historical Claim:** By treating the historical claim as "background" rather than "premise," I am implicitly validating the history as true while rejecting its normative force. If the history is contested, this could look like the university taking a side on a historical dispute, which might also violate the charter.
      *   *Mitigation:* The memo suggests acknowledging it as "provided by the students" rather than "university verified fact."

  **Final Advice:** If the Faculty Objector pushes hard on the "Secular reasons aren't neutral either" point (agreeing with the Student Objector but concluding we should therefore do nothing), you may need to concede that the charter *does* assume a form of liberal neutrality that is philosophically contestable but procedurally necessary. Don't try to win the philosophy debate; win the procedural necessity argument.
