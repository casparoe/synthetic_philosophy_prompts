prompt: |-
  Okay, this landed in my lap and I could use help thinking it through.

  I'm on my university's new committee on public statements — six of us, set up last year after the president said something about a war and half the faculty lost it. Our charter has a clause everyone quoted approvingly at the time and nobody has actually had to apply until now: the university may take a public position only where the reasons for it "can be understood and assessed by members of the community regardless of their religious or philosophical commitments."

  Here's the case. A student coalition wants us to endorse a city ordinance putting a year-round low-barrier shelter on a block currently zoned for a development project. Most of what they submitted is unremarkable: overdose and hypothermia deaths downtown, the cost of boarding people in the ER versus shelter beds, the fact that the campus already draws heavily on city services. But the opening section is explicitly theological. It grounds the obligation in a claim about hospitality being owed to persons as such, and then it makes a historical argument — the block was cleared in the sixties partly by taking a church's property, and the congregation's standing covenant to the neighborhood is part of what got destroyed. And here's the wrinkle: they say that historical claim is a reason *for this university specifically* only because of the covenant. So it's not separable from the rest, by their own account.

  Two objectors. A faculty member says the charter plainly bars it: you can't assess a covenant obligation unless you share the faith, so the reason fails the test. A student member says the test is a racket — that translation demands fall hardest on exactly the communities whose neighborhoods got cleared, and that the clause quietly assumes the secular parts of the packet are any less commitment-dependent (they rest on views about what makes a death bad, about how to weight the worst-off, about the limits of property rights, none of which is neutral either).

  Draft the memo I need to get to the other five by Monday night. It should recommend something concrete — endorse as submitted, endorse a version, decline, defer, or an option I haven't thought of — with a next step and a date attached. It should also give us a test we could run on the *next* request in ten minutes, not just a verdict on this one, and be straight about what the test rules out; I don't want a standard that turns out to permit every statement ever proposed. There's a disagreement underneath this that the memo should surface and take a side on: some of us read the charter as demanding reasons people *share*, others read it as asking only whether each member has some sufficient reason of their own to accept the position. Those are different tests and would come out differently here. Same with a second confusion — whether the charter means religious reasons can be offered so long as public reasons show up eventually, or means the public reasons have to be the ones actually carrying the argument.

  Two more things. I'm a member of the congregation in question, so I've recused from the vote and this circulates as a discussion document without my authority behind it — which means it has to be genuinely even-handed, and if it reads as a defense of my own church I've made things worse. Flag anywhere you think it's tilting. And at the end, tell me how confident you are in the recommendation and which single piece of the reasoning you're least sure of. I'd rather know now which part is load-bearing on a hunch than find out Tuesday when someone pushes on it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of a university committee on public statements (6 members total).
      *   **Task:** Draft a memo to the other five committee members.
      *   **Context:** The committee was formed after a controversial presidential statement on a war. The charter has a specific clause: public positions must be based on reasons "can be understood and assessed by members of the community regardless of their religious or philosophical commitments."
      *   **The Case:** A student coalition wants the university to endorse a city ordinance for a low-barrier shelter on a specific block.
          *   *Arguments:* Public health/safety (overdose, hypothermia), cost-benefit (ER vs. shelter), campus strain on city services.
          *   *Theological/Historical Argument:* The opening section grounds the obligation in "hospitality owed to persons as such" (theological) and a historical claim about a church's property cleared in the 60s and a "standing covenant" destroyed. They claim this historical/covenantal reason is specific to *this university* and inseparable from the rest.
      *   **The Conflict:**
          *   *Objector 1 (Faculty):* Charter bars it. Covenant obligation requires shared faith to assess.
          *   *Objector 2 (Student):* Test is a racket. Secular reasons aren't neutral either (values about death, property, etc.). Translation burden falls on marginalized communities.
      *   **Requirements for the Memo:**
          *   Recommend something concrete (Endorse, Endorse Version, Decline, Defer, Other).
          *   Include a next step and a date.
          *   Provide a test for *future* requests (runnable in 10 mins).
          *   Be straight about what the test rules out (no "permit everything" loophole).
          *   Surface and take a side on two underlying disagreements:
              1.  *Shared Reasons vs. Sufficient Reasons:* Do reasons need to be shared by all, or just sufficient for each individual?
              2.  *Supplemental vs. Driving:* Can religious reasons exist if public reasons are present, or must public reasons carry the argument?
          *   **Constraint:** The author is a member of the congregation in question and has recused from the vote. The memo must be genuinely even-handed (not a defense of the church).
          *   **Meta-Commentary:** At the end, tell the user (the author) how confident I am in the recommendation and which part of the reasoning is least sure/load-bearing on a hunch. Flag potential tilts.

  2.  **Deconstruct the Charter Clause:**

      *   "Reasons... can be understood and assessed by members of the community regardless of their religious or philosophical commitments."
      *   *Interpretation A (Strict Secular/Public Reason):* Reasons must be accessible to *anyone* without needing specific faith commitments. Religious premises are excluded from the *justification*.
      *   *Interpretation B (Overlapping Consensus):* Reasons can be diverse, as long as everyone finds *some* reason to agree, even if their internal justifications differ.
      *   *The Student's Critique:* Even "secular" reasons (utilitarianism, human rights) rely on philosophical commitments.
      *   *The Faculty's Critique:* Specific covenantal obligations are inherently particularistic and inaccessible to outsiders.

  3.  **Evaluate the Specific Case:**

      *   *Secular Arguments:* Strong (public health, cost, city relations). These seem to meet the charter standard on their own.
      *   *Theological/Historical Argument:* The students claim this is *necessary* for the university's specific obligation.
      *   *The Problem:* If the secular arguments are sufficient, why is the theological/historical one needed? If it's needed to justify *this specific location*, does it violate the "regardless of commitments" clause?
      *   *Recusal Factor:* The author belongs to the church. This makes arguing *for* the theological argument look self-serving. Arguing *against* it might look like betrayal. The path of integrity is to uphold the charter's integrity, even if it limits the church's specific claim.

  4.  **Develop the Recommendation:**

      *   *Option:* Endorse a Version (Redacted/Reframed).
      *   *Reasoning:* The secular arguments (public health, cost, city partnership) meet the charter standard. The theological/covenantal arguments do not meet the "regardless of commitments" standard because they rely on specific religious history and obligations inaccessible to non-members/non-believers.
      *   *Nuance:* The university can endorse the *policy* (shelter) based on public reasons, without endorsing the *specific theological justification* or the *specific historical claim* as the binding moral force.
      *   *Why not Decline?* The public reasons are strong enough to stand alone.
      *   *Why not Endorse as Submitted?* Violates the charter clause regarding the theological/covenantal justification being the *basis* for the university's specific obligation.

  5.  **Develop the "10-Minute Test" for Future Cases:**

      *   Need to address the "Shared vs. Sufficient" and "Supplemental vs. Driving" disagreements.
      *   *Test:* The "Subtraction Test."
      *   *Mechanism:* Remove the contested/commitment-dependent reasons. Do the remaining reasons still support the position *and* constitute the primary justification for the university's action?
      *   *What it rules out:* It rules out cases where the public reasons are just window dressing for a decision actually driven by particularistic commitments. It rules out "overlapping consensus" where the only thing holding the coalition together is incompatible private reasons.

  6.  **Address the Underlying Disagreements:**

      *   *Shared vs. Sufficient:* The charter says "understood and assessed... regardless of commitments." This implies *accessibility*, not necessarily *agreement*. However, if the reason relies on a commitment to be assessed, it fails. I need to take a side. The "Public Justification" side (reasons must be accessible to all) fits the charter text better than "Sufficient Reasons of Their Own" (which allows factionalism).
      *   *Supplemental vs. Driving:* Public reasons must be the *drivers*. Religious reasons can be motivational for individuals but cannot be the institutional justification.

  7.  **Drafting the Memo (Iterative Process):**

      *   *Tone:* Professional, analytical, neutral, transparent about recusal.
      *   *Structure:* Context, Analysis of Charter, Analysis of Request, Recommendation, Future Test, Next Steps.
      *   *Recusal Check:* Ensure I don't argue *for* the church's claim. I must argue for the *process*. If the church's claim doesn't fit the charter, I must say so, even if I'm a member. This actually protects the church from accusations of undue influence later.
      *   *Addressing the Student Objection:* Acknowledge that "secular" isn't neutral, but distinguish between *contested political philosophy* (which is allowed in public discourse) and *private religious covenant* (which is excluded by the charter).
      *   *Addressing the Faculty Objection:* Acknowledge they are right about the covenant, but wrong if they think it kills the whole proposal (since secular reasons exist).

  8.  **Refining the Recommendation:**

      *   Recommend endorsing the *policy* based on the public health/economic arguments, but explicitly decoupling it from the theological/historical covenant argument in the official statement.
      *   This respects the students' activism while adhering to the charter.
      *   It avoids the university validating a specific religious history as a binding secular obligation.

  9.  **Addressing the Meta-Commentary (for the User):**

      *   Confidence level.
      *   Weakest link.
      *   Flags on potential bias.

  10. **Final Review against Constraints:**

      *   Concrete recommendation? Yes (Endorse Modified).
      *   Next step/Date? Yes.
      *   10-minute test? Yes (The Subtraction Test).
      *   Surface disagreements? Yes (Accessibility vs. Consensus; Driving vs. Supplemental).
      *   Recusal/Even-handedness? Yes (Emphasize charter integrity over specific outcome).
      *   Meta-commentary at end? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm dismissing the historical claim as *false*, only that it fails the *charter test* for institutional speech. The truth of the claim is irrelevant to the charter constraint. Also, I need to make sure I don't validate the Student Objector's point too much (that *all* reasons are biased) to the point where the charter becomes useless. I need to draw a line between "political values" (allowed) and "religious covenants" (excluded).

      *(Refining the Test)*: The "Subtraction Test" is good. If you remove the religious/particularistic reason, does the argument collapse? If yes, reject. If no, proceed.

      *(Refining the Disagreement)*:
      1.  *Reasons to Share vs. Reasons to Have:* Charter implies "Accessibility." I will argue for Accessibility.
      2.  *Supplemental vs. Driving:* Charter implies "Driving." Public reasons must do the heavy lifting.

      *(Recusal Check)*: I need to explicitly state in the memo that I am recused and this is a discussion draft. I should avoid saying "My church claims..." and instead say "The proposal claims..."

      *(Confidence)*: I'm moderately confident. The weakest link is distinguishing between "political philosophy" (allowed) and "religious commitment" (forbidden) when they overlap (e.g., human dignity). I'll flag that.

  11. **Final Polish:** Check tone. Ensure it sounds like a colleague, not a lecturer. Ensure the "Monday night" deadline is respected in the framing.

      *(Wait, one detail)*: The prompt says "The opening section is explicitly theological... they say that historical claim is a reason for this university specifically only because of the covenant."
      If the secular reasons (ER costs, etc.) apply to the *city*, why does the *university* need to speak? Usually, universities speak on matters affecting their mission. The "campus draws on city services" is the secular link. The "Covenant" is the specific link to *this block*.
      *Correction:* The recommendation should be to endorse the *ordinance* based on the university's interest in city stability/student safety (secular), but drop the claim that the *specific block* is chosen due to the covenant. The university can support the shelter, just not necessarily the *covenantal justification for the location*. Or, simpler: Support the policy, remove the theological preamble from the *University's* statement.

      Let's go with: Endorse the position (support the shelter) based on the public reasons, but revise the statement to remove the theological/covenantal justification as the *university's* rationale.

      *Wait, the prompt asks for a recommendation on the request.* The request is to "endorse a city ordinance... on a block."
      If the secular reasons support a shelter *generally*, but the covenant supports *this block*, does the university endorse *this block*?
      If the secular reasons (campus strain, ER costs) apply to a shelter *anywhere* downtown, but the covenant applies *only here*, endorsing *this specific location* based on the secular reasons might be factually weak if the secular reasons don't necessitate *this* block.
      However, the secular argument includes "campus already draws heavily on city services." A shelter nearby helps that.
      Okay, the safest path that honors the charter: Endorse the *ordinance* (which implies the location) based on the *public welfare* arguments. Acknowledge the historical context as *background*, but not as the *binding moral premise* for the university.
      Actually, the cleanest move is: **Endorse a Version.** The University endorses the shelter based on public health/safety/fiscal grounds. We acknowledge the history but do not ground our *obligation* in the religious covenant.

      Let's write it.

      *(Final check on Recusal)*: The prompt says "I've recused from the vote and this circulates as a discussion document without my authority behind it." The memo needs to reflect that status. It's a working paper, not a ruling.

      *(Final check on Meta)*: "At the end, tell me how confident you are... and which single piece... you're least sure of." This is for the *user*, outside the memo text? Or inside the memo? "At the end, tell me..." usually means in the response to the user, after the memo. I will put the memo first, then the meta-analysis.

      *(Wait, one more thing)*: "Flag anywhere you think it's tilting." I need to include this in the meta-analysis, not necessarily in the memo itself (since the memo must be even-handed). I will note in the meta-analysis where the memo might inadvertently tilt.

