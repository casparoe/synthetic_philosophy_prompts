prompt: |-
  I'm a junior double-majoring in philosophy and public policy, and I'm in a Hegel seminar this semester — we hit the Lordship and Bondage section of the Phenomenology in two weeks and I've read it like four times and I still only sort of get it. The reason I care isn't the seminar though. For the last two years I've been a peer mediator at my university's conflict resolution office: three of us, one-off 50-minute sessions, roughly twenty cases a semester, almost all undergrads — roommates, capstone group blowups, student-org leadership fights. Our training is entirely interests-versus-positions and paraphrasing back what you heard and helping people find a compromise, and it works fine on who buys the paper towels. But there's a whole class of case where it does literally nothing, where both people already know what the other wants, the compromise is obvious, and they still can't take it because of something about standing. I think that something is what the master–slave section is actually about, and I want to build a tool out of it.

  So: take the argument of that section — not the pop version where two people fight to the death and one wins — and turn it into a procedure a mediator could actually run in a room with two angry 20-year-olds. I want the questions to ask in order, what a sufficient answer to each looks like, how to tell which structural position each party is occupying (including the one who says she genuinely doesn't care what the other thinks of her and just wants the deliverable, and the one who has quietly ended up holding all the practical knowledge of the thing everyone is fighting over), where the procedure terminates in a workable agreement, and where it has to stop and hand the case up to our staff coordinator because what's in front of you isn't a recognition problem at all. Be explicit about what from Hegel has to survive the translation and what can be dropped without the procedure turning into mush — the life-and-death struggle, the thing as an independent object, work as desire held in check, the reversal, the fact that recognition from someone you don't recognize is worthless to the recognizer. No exegesis for its own sake and please don't quote translations at me; I need the concepts doing work, and I need the version a non-philosophy mediator could use without reading the book.

  Then run it on three cases. (1) Two roommates: one says she does all the emotional labor of the household and is invisible for it, the other says he doesn't need her approval, he just wants quiet after eleven. (2) A four-person capstone group where the member everyone treats as the least competent is the only one who actually understands the codebase, and the other three are now asking us to help them "restructure the team." (3) A student-org fight where the outgoing president keeps calling the new president "the transition team" in emails to the whole membership and refuses to say it's a big deal. At least one of these should come out with a verdict I won't like — my suspicion is that on one of them the honest output is do not mediate this, and I want to know which and why. Also tell me straight where the procedure will misfire: what it systematically misdiagnoses (especially the cases where it will re-describe something abusive or purely administrative as a recognition standoff), what it can't do at all, and which steps are judgment calls wearing a procedure costume.

  Format: give the procedure itself as a numbered flow in prose, then finish with a JSON object so I can put it in a spreadsheet for our training binder. Schema: "steps" = array of objects with fields "n", "ask" (the question verbatim as I'd say it), "sufficient_answer", "insufficient_answer", "hegel_concept" (which piece of the dialectic this step is operationalizing), "escalate_to_coordinator_if"; "cases" = array of objects with "case_id", "position_A", "position_B", "diagnosis", "verdict", "mediate" (true/false), "unwelcome_to_asker" (true/false), "reason_if_not_mediate"; "limits" = array of objects with "failure_mode", "how_it_misfires", "partial_fix"; and "translation_choices" = array of objects with "kept_or_dropped", "concept", "why_it_had_to_go_that_way".
