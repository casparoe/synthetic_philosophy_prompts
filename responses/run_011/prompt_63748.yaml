answer: |-
  ### The Recognition Audit: A Mediation Procedure for Status Conflicts

  Standard mediation assumes parties are rational actors maximizing utility over resources. Hegel's *Lordship and Bondage* argues that in deep conflicts, parties are irrational actors maximizing *ontological security* over status. They would rather lose the resource than lose their standing as an independent agent. The following procedure is designed to detect this structure and force a shift from "who is the Master" to "how do we jointly shape the Object."

  #### Part 1: The Procedure

  **1. Viability Check (The Life-and-Death Filter)**
  *   **Ask:** "If we cannot reach an agreement today, what happens to your relationship? Is it acceptable for this relationship to end completely?"
  *   **Sufficient Answer:** "We need to keep working together/living together, even if it's hard." OR "If it ends, we have a plan to separate cleanly."
  *   **Insufficient Answer:** "They need to be removed/destroyed/excluded for me to be okay."
  *   **Hegel Concept:** *The Life-and-Death Struggle.* True recognition requires two living consciousnesses. If one party seeks the existential negation of the other, mediation is impossible.
  *   **Escalate to Coordinator If:** Either party indicates that the other's continued presence is an existential threat (safety risk) or that total exclusion is the only acceptable outcome.

  **2. Mapping the Object (The Thing)**
  *   **Ask:** "Describe the specific thing you are fighting over (the lease, the code, the title) as if you were explaining it to a stranger who doesn't know either of you."
  *   **Sufficient Answer:** A neutral description of the resource or task.
  *   **Insufficient Answer:** A description laden with moral judgment about the other person's character ("The mess they make," "The code they broke").
  *   **Hegel Concept:** *The Independent Object.* The object must be distinguished from the selves to become a site of shared labor.
  *   **Escalate to Coordinator If:** The parties cannot agree on what the object *is*, indicating the conflict is purely about identity, not resources.

  **3. Identifying the Master Claim (Independence)**
  *   **Ask (to the party claiming less investment):** "You've said you don't need their approval. If they completely stopped doing [X task], could you achieve your goal alone?"
  *   **Sufficient Answer:** "No, I actually need them to do X." (Admission of dependency).
  *   **Insufficient Answer:** "I don't care, I'll just do it myself / It doesn't matter." (False independence).
  *   **Hegel Concept:** *Lordship.* The Master claims independence but is secretly dependent on the Bondservant's labor for their status and comfort.
  *   **Escalate to Coordinator If:** The party insists on total independence while simultaneously demanding the benefits of the other's labor (parasitic structure).

  **4. Identifying the Bondservant Claim (Labor and Fear)**
  *   **Ask (to the party doing the work):** "You do the work. What happens if you stop? Do you fear they will punish you, or do you fear the project will fail?"
  *   **Sufficient Answer:** "I fear the project will fail / I care about the quality." (Connection to the Object).
  *   **Insufficient Answer:** "I fear they will yell at me / kick me out." (Pure fear of the Master).
  *   **Hegel Concept:** *Bondage and Work.* The Bondservant finds independence through shaping the Object, not through the Master's approval.
  *   **Escalate to Coordinator If:** The party is operating purely out of fear of punishment (coercion), not commitment to the Object. This is abuse, not conflict.

  **5. The Recognition Test (Value of the Other)**
  *   **Ask:** "Why does it matter to you that *they* specifically acknowledge your contribution? Would acknowledgment from a stranger work?"
  *   **Sufficient Answer:** "Because they are the one benefiting from it / ignoring it."
  *   **Insufficient Answer:** "I just need everyone to know I'm right."
  *   **Hegel Concept:** *Mutual Recognition.* Recognition is only valuable if it comes from an equal whose judgment you respect. The Master rejects the Bondservant's recognition as worthless; the Bondservant craves the Master's.
  *   **Escalate to Coordinator If:** One party explicitly states the other's opinion is inherently worthless (e.g., based on identity prejudice).

  **6. The Reversal (Agency over the Object)**
  *   **Ask:** "Who has the knowledge required to make this object work? If we prioritize the person with the knowledge, what does the other person contribute?"
  *   **Sufficient Answer:** A redistribution of authority based on competency/labor regarding the Object.
  *   **Insufficient Answer:** "Authority stays with the person who had it before / the majority vote."
  *   **Hegel Concept:** *The Reversal.* The Bondservant becomes the essential agent through work; the Master becomes superfluous.
  *   **Escalate to Coordinator If:** The group refuses to grant authority to the person holding the practical knowledge (see Case 2).

  **7. Termination (The Workable Agreement)**
  *   **Ask:** "Can you sign an agreement that gives the worker authority over the work, and the other party authority over the standards, without either canceling the other out?"
  *   **Sufficient Answer:** Yes, with specific boundaries.
  *   **Insufficient Answer:** No, one side must submit.
  *   **Hegel Concept:** *Universal Self-Consciousness.* Moving toward a state where agency is shared, not hoarded.
  *   **Escalate to Coordinator If:** No. The structural asymmetry is too rigid for voluntary agreement.

  ---

  #### Part 2: Translation Choices

  | Concept | Kept or Dropped | Why it had to go that way |
  | :--- | :--- | :--- |
  | **Life-and-Death Struggle** | **Dropped (Literal) / Kept (Structural)** | We cannot allow students to risk physical safety. We keep the *structure*: is the relationship viable? If one seeks the other's destruction, mediation stops. |
  | **The Thing (Object)** | **Kept** | Crucial. Mediation fails when the object is conflated with the self. We must externalize the "thing" (code, lease) to allow shared labor. |
  | **Work as Desire Held in Check** | **Kept** | This is the therapeutic core. The Bondservant grows by working on the problem, not by winning the argument. We channel anger into task-ownership. |
  | **The Reversal** | **Kept** | Essential for resolution. The person doing the labor *must* gain authority. If they don't, the recognition is fake. |
  | **Historical Teleology** | **Dropped** | We aren't trying to achieve Absolute Spirit. We are trying to get roommates to buy paper towels without hating each other. |
  | **Fear of Death** | **Dropped** | Replaced with "Fear of Exclusion/Failure." Undergrads fear social death (GPA, reputation), not literal death. |

  ---

  #### Part 3: Case Runs

  **Case 1: The Roommates (Emotional Labor vs. Quiet)**
  *   **Position A (Her):** Claims Bondservant status. "I do the labor, I am invisible." She seeks recognition of her agency in maintaining the home.
  *   **Position B (Him):** Claims Master status. "I don't need your approval." He claims independence but consumes the benefits of her labor (cleanliness).
  *   **Diagnosis:** Classic Lordship/Bondage. He is living a false independence. She is trapped in seeking recognition from someone who claims her recognition doesn't count.
  *   **Verdict:** **MEDIATE.**
  *   **Path:** Step 3 exposes his dependency (he can't maintain the quiet/cleanliness himself without her labor). Step 6 shifts authority: She gets control over cleaning schedules; he gets control over noise standards. He must explicitly validate her labor (Recognition) to get the cleanliness.
  *   **Unwelcome to Asker:** False. (Both get something, though he loses the "I don't care" posture).

  **Case 2: The Capstone Group (The Competent Outcast)**
  *   **Position A (The 3):** Claim Master status. "We are the leaders/majority." They want to fire the expert to preserve their self-image as competent.
  *   **Position B (The 1):** Bondservant status. "I hold the knowledge." They are being asked to submit their expertise to ignorance.
  *   **Diagnosis:** The Masters are attempting to negate the truth of the Object (the code). They want recognition of authority without the labor that justifies authority.
  *   **Verdict:** **DO NOT MEDIATE.**
  *   **Path:** Step 6 (The Reversal) fails. The three will not grant authority to the one. Mediation implies compromise is possible. There is no compromise between "code works" and "code is restructured by non-coders."
  *   **Unwelcome to Asker:** **TRUE.** The three students asked for mediation to legitimize firing the expert. The mediator must refuse.
  *   **Reason:** This is an adjudication issue (faculty intervention), not a recognition standoff. Mediating validates the false consciousness of the majority.

  **Case 3: The Student Org (The Transition)**
  *   **Position A (Outgoing):** Fading Master. Using language ("transition team") to deny the new President's independent status. Clinging to recognition.
  *   **Position B (Incoming):** New Master/Bondservant hybrid. Has the title but lacks the recognized authority.
  *   **Diagnosis:** Ritual failure. The Outgoing President is refusing the *Reversal* that already happened (the election).
  *   **Verdict:** **MEDIATE.**
  *   **Path:** Step 5 (Recognition Test). The Outgoing President must admit the Incoming President's judgment is now the valid one. The agreement is a public ritual (email) where the Outgoing President explicitly transfers status.
  *   **Unwelcome to Asker:** False. (Though the Outgoing President will dislike losing the shadow power).

  ---

  #### Part 4: Limits and Failure Modes

  1.  **The Abuse Misdiagnosis:**
      *   *Failure Mode:* The procedure treats coercive control as a "recognition standoff."
      *   *How it Misfires:* If the "Master" is an abuser, Step 3 (Dependency) reveals they *need* the victim, but Step 7 (Agreement) asks the victim to negotiate agency with the abuser.
      *   *Partial Fix:* Step 4 (Fear). If the Bondservant's answer is purely "Fear of punishment," escalate immediately. Do not proceed to "Work."

  2.  **The Administrative Mask:**
      *   *Failure Mode:* Treating hierarchical authority as Hegelian mastery.
      *   *How it Misfires:* A TA and a student. The TA has legitimate institutional power. The procedure might try to "equalize" them to achieve mutual recognition, undermining the TA's role.
      *   *Partial Fix:* Step 2 (The Object). If the Object is "grading" or "policy," mediation is inappropriate. This procedure is for peer-to-peer conflicts only.

  3.  **The Judgment Call Costume:**
      *   *Failure Mode:* Step 6 (The Reversal) requires the mediator to decide who actually holds the knowledge/labor.
      *   *How it Misfires:* The mediator might be wrong. If the mediator sides with the "Bondservant" who is actually incompetent, the agreement fails.
      *   *Partial Fix:* Requires evidence. "Show me the commit logs," "Show me the cleaning roster." If evidence is disputed, escalate.

