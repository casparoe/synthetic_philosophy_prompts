answer: |-
  **A:** Let's not dance. Mara's house was a real object. It was a specific configuration of data on a server, maintained by electricity, accessible via a specific interface. The griefer deleted that configuration. He destroyed a real thing.

  **B:** The bits were real. The *house* wasn't. You're confusing the substrate with the object. A painting is canvas and paint, but if I burn the canvas, I haven't burned the *subject* of the painting. Mara's house was a prop in a private game of make-believe. The griefer didn't destroy a home; he changed the state of the server so the pretense could no longer be sustained.

  **A:** If it was just pretense, why target that specific build? The griefer could have flattened a random mountain. He chose Mara's structure. He recognized the pattern. You can't recognize a pattern in nothing.

  **B:** He recognized the *effort*, not the ontology. But fine, I'll concede this: The griefer treated the data structure as significant, not random. He acknowledged the pattern. But acknowledging a pattern isn't acknowledging a *house*.

  **A:** And I'll concede this: Mere existence doesn't prove harm. Just because the data existed doesn't mean deleting it was a moral injury. But you're dodging the loss.

  **B:** I'm defining it. You say the object died. I say the session ended.

  **A:** Mara says she lost "the place I could go to." Not the memory. The place.

  **B:** Exactly. You can't "go to" a database entry. You go to a screen. The "place" was a feeling she had while interacting with the software. When the software changed, the feeling couldn't be triggered. That's a psychological loss, not an ontological one.

  **A:** The pathway was real. The coordinates, the load time, the specific visual rendering—that was a functional affordance built into the digital object. It's like a key fitting a lock. If I destroy the lock, you've lost the ability to open the door. The lock is real metal. The digital structure was real code. It afforded visitation. The griefer broke the affordance.

  **B:** But there was no room behind the door. Just more code. You're saying the lock was real, which I agree with, but you're implying there was a house it opened onto. There wasn't. There was only the lock.

  **A:** The lock *was* the house. In digital space, the appearance and the function are identical.

  **B:** Then let's test that. Same replica. Same two years. But now it's a single-player offline game. No server, no griefer, no audience. A hardware fault shreds the save file. Is anything lost? Is anyone wronged?

  **A:** The object is lost. The data is gone. But no one is *wronged* because there was no agent to violate a norm. The loss is absolute, the wrong is absent.

  **B:** I say nothing is lost, because nothing was there to lose. The hardware failed, the pretense ended. But here's where we might actually split: If I steal your physical car, I wrong you. If I delete your offline save file, have I wronged you?

  **A:** Yes. You destroyed my property.

  **B:** You owned the hard drive. You didn't own the *car* in the game. You owned a license to run code. So if I delete the file, I've damaged your hardware's state, but I haven't taken a "vehicle."

  **A:** But the verdict on the loss is the same. We both agree Mara is worse off.

  **B:** We agree she's hurt. We disagree on *what* was taken from her. You think a thing was destroyed. I think a possibility was closed.

  **A:** So the crux isn't the grief. It's the substrate.

  **B:** No. It's whether function creates ontology.

  **A:** I say yes. If it walks like a house and loads like a house, it's a digital house.

  **B:** I say no. If it relies on human agreement to be a house, it's a story. When the bits change, the story stops. The bits remain.

  **A:** So if I backup the bits, I have the house?

  **B:** You have the potential to restart the story.

  **A:** And you don't think that potential is an object?

  **B:** I think it's a capacity. You're reifying capacity into substance.

  **A:** And you're dissolving substance into capacity.

  **B:** Precisely. So in the offline case, you see a dead object. I see a stopped process.

  **A:** And we agree on the grief, but not the cause.

  **B:** We agree on the wound. We disagree on whether there was a body.
