          9.  (Deliberative) The "Category Error" objection. Institutional design isn't optimization.
          10. (General) The "Dictatorship" objection. Why not just accept dictatorship if you want strategy-proofness? (Actually, this is weak given the thesis, maybe skip or refine). Let's replace with: The "Aggregation" objection. If you minimize manipulability, do you maximize other bad things (efficiency)?

      *   *Refining for Register:* Ensure the Econ sounds like an Econ (priors, welfare, cardinality), the CompSci sounds like a CompSci (NP-hard, worst-case, algorithmic), the Phil sounds like a Phil (modal, normative, conceptual).

  5.  **Drafting Replies & Soft Spots:**
