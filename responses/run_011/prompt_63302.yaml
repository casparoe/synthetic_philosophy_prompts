  Elias is a thirty-four-year-old software engineer, fully cognitively intact, morally conscientious, and economically self-sufficient. He lives within a tight-knit cultural enclave that maintains a traditional ontology where personhood is not an intrinsic birthright but a status achieved through public ritual incorporation. This ritual requires validation by a recognized lineage elder who vouches for the candidate's integration into the communal moral order. Elias performs all the functional roles of a community member: he cares for neighbors, honors agreements, and exercises rational agency, yet he remains ontologically incomplete by the community's own standards.

  The validation ritual is currently impossible for Elias to complete because the only eligible elders for his lineage died in a flood years ago, and the community's normative rules forbid substituting sponsors from other lines. The community bears no malice toward Elias; they treat him with kindness and respect his biological humanity, but their social machinery lacks the capacity to confer full personhood status upon him. He is not shunned for misconduct, nor does he refuse to relate; he is simply stranded outside the constitutive practices that the theory identifies as the source of personhood, rendering him a human organism who lacks the social standing of a person.

  ***

  **1. Account Walkthrough**
  The capacity theorist verdicts Elias as a full person immediately. On this view, personhood is grounded in intrinsic psychological properties—rationality, self-awareness, moral agency—which Elias possesses in abundance. His social context is irrelevant to his ontological status; he is owed full moral consideration (rights, dignity, respect) simply because of what he *is*. The relational theorist, adhering to the Menkiti-ish line that personhood is an achieved status dependent on communal incorporation, must verdict Elias as deficient. Because the constitutive ritual is incomplete, he has not "become" a person in the full moral sense, even if he is a human being. Regarding moral consideration, the relationalist attempts to separate status from treatment: they argue Elias is still owed care and kindness as a human organism and a potential person. However, this separation is unstable; if personhood is the status that grants standing in the moral community (e.g., voice in councils, participation in exchange), denying him the status necessarily diminishes his standing, regardless of benevolent intentions.

  **2. The Working Feature**
  The feature doing the work is **Structural Inaccessibility of Constitutive Rituals**. The scenario does not rely on Elias being unlikable or unwilling; it relies on the specific mechanism required by the relational theory (elder validation) being externally blocked by historical contingency and rigid normative rules. The theory demands a relational act that is physically impossible to perform, generating the shortfall without referencing Elias's internal makeup or interpersonal likability.

  **3. Removing the Feature**
  If the community amends its rules or a valid elder is found, Elias undergoes the ritual and his personhood status snaps back into place. For the relational theorist, this confirms that personhood is a social status or property of the *relationship*, not an intrinsic property of the individual—it can be lost and regained based on social facts. For the capacity theorist, this flickering ontology is absurd; they argue Elias was a person the whole time, and the ritual merely *recognized* a pre-existing fact. If the relationalist admits the status snaps back, they concede that personhood is contingent on social facts rather than real properties of the agent, strengthening the individualist charge that relationalism confuses *recognition* with *existence*.

  **4. Attack and Defense**
  The capacity theorist's best attack is the **Hostage Objection**: this view makes ontological status hostage to the community's competence or justice. If the community is rigid, prejudiced, or bureaucratically broken, the victim loses their personhood through no fault of their own. This is offered as a *reductio*: a theory that allows injustice to erase ontological status is morally untenable. The relational theorist's best defense is the **Social Reality Claim**: personhood *is* social standing, and pretending otherwise ignores how moral life actually functions. However, when pressed with the **Modal Move**—arguing Elias counts because he has the *capacity* to be incorporated—the relationalist concedes the individualist's point. If the *capacity* for relationship is sufficient for personhood, then the actual relationship is not necessary. This collapses the distinction between the two views, leaving the scenario with no verdict difference at all: both would agree Elias is a person.

  ***

  **Constraint Flag**
  I had to walk a fine line with the constraint: *"The relational shortfall has to be generated by the theory's own machinery... not by me stipulating that the person is... unrecognised."* I stipulated that the *mechanism* for recognition (the elder) was unavailable due to structural rules, rather than stipulating that the community *refused* to recognize him out of dislike. This respects the letter of the constraint (the shortfall comes from the theory's requirement for a ritual that cannot be performed) but inevitably implies non-recognition as a consequence. If I removed the structural barrier, the theory would not generate the shortfall; thus, the scenario relies on the community's rules being rigid, which borders on stipulating the outcome, though I have grounded it in historical contingency (the flood) to keep it blameless.
