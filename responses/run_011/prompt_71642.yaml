answer: |-
  Miri is more right overall because she correctly identifies international law as an evolutionary system where precedent establishes legitimacy, whereas Dan applies an overly rigid domestic positivist framework that ignores the unique vacuum of 1945.

  **Move Ratings**

  1.  **Dan: Mostly Right.** He is technically correct that positive law lacked individual liability for aggression, though he overlooks how customary international law often crystallizes through such tribunals.
  2.  **Miri: Mostly Right.** Her functionalist view of legality captures the moral notice given by treaties, though she overstates the clarity of individual criminal liability under Kellogg–Briand.
  3.  **Dan: Mostly Right.** The comparison to summary execution undermines the claim of gross injustice, but the selective indictment does reveal the political limits of the "rule of law" claim.
  4.  **Miri: Mostly Right.** The procedural integrity is historically verifiable and distinct from a sham trial, though her domestic analogy fails because democratic states separate legislative and prosecutorial powers.
  5.  **Dan: Mostly Right.** The structural conflation of prosecutor and judge is a valid critique of legitimacy, and the Tokyo dissents objectively demonstrate the lack of settled law.
  6.  **Miri: Mostly Right.** The existence of reasoned dissents is strong evidence of judicial independence, and her consequentialist pivot accurately reflects the trial's historical legacy.
  7.  **Dan: Mixed.** He is correct that the ICC remains limited on aggression, but wrong to imply the normative shift against individual liability failed to take hold in international relations.

  **Specific Questions**

  (a) Dan is partially right that Miri shifts ground, but wrong to treat it as a contradiction; she moves from a deontological defense (no injustice occurred) to a consequentialist one (the injustice was tolerable for the benefit), which are compatible layers of justification rather than mutually exclusive claims.

  (b) Miri's category-error charge does real work because it distinguishes between procedural legitimacy (was this a legal process?) and substantive justice (was the outcome perfectly fair?), allowing her to concede flaws without conceding that the trial was merely raw power.

  **What Both Are Missing**

  Both neglect that international law evolves primarily through customary practice and state acceptance rather than static legislation, meaning Nuremberg's *ex post facto* nature is less fatal in international jurisprudence than in domestic systems. Additionally, both ignore the absolute absence of a functioning German sovereign authority in 1945, which meant the only alternatives were truly extrajudicial execution or impunity, making the "victor's justice" critique somewhat inevitable given the collapse of the state.
