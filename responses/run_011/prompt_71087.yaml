          3.  Explain what remains of democracy without (2) (Legitimacy/Conflict Management).
          4.  Expose the friend's contradiction (Judges).
          5.  Evaluate the reforms (RCV/Splitting).

  7.  *(Self-Correction during drafting)*: Make sure to explicitly answer "Which step do you reject?" -> Step (2) is the metaphysical error, Step (4) is the non-sequitur. I should focus on (2) as the root cause.
      *   Also, address the "Coin Flip" worry. A coin flip lacks *accountability* and *reason-giving*. Elections force elites to listen to voters to get votes. That mechanism exists even if the "will" is constructed.

  8.  **Final Review against User Prompt:**
