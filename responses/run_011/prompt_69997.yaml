      *   **Final Evaluation:** Does the last sentence (policy prescription: spend everything on stopping extinction) follow from the argument?
      *   **Constraint:** Be honest about consensus vs. live debates in the field. Don't replace one overconfident take with another.

  2.  **Analyze the Coworker's Paragraph (Claim-by-Claim):**
