      *   *Collapse:* It's not contextualism because it doesn't depend on the attributor. It's a species of Subject-Sensitive Invariantism (SSI) but with a counterfactual twist. The risk is SSI collapsing to Traditional Invariantism if the counterfactual is too stable.

  7.  **Finalizing the Verdict:**
