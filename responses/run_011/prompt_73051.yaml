          *   Claim: A causes wetness only because intervention is *actually performable*. -> **Wrong/Misleading.** Woodward's account is about *in principle* intervenability, not actual ability. We can't intervene on the Big Bang, but it can be a cause. The definition relies on the *concept* of an intervention, not human ability. This is a common misconception (confusing interventionism with manipulability theories).
