answer: |-
  # Decision Tree: Do You Actually Think Generations Are Real?

  **Instructions:** Start at the root. Answer each question based on what you think is *actually the case*, not based on the label you want to end up with. If you find yourself answering based on where you think the leaf is, stop and re-read the question.

  ### The Root
  **Consensus:** We agree that people born in 1980 score differently on certain measures than people born in 2000.

  ### Node 1 (The APC Filter)
  **Question:** If you statistically control for **age** (life stage) and **period** (current historical events), does the **birth year** still predict the outcome?
  *   **No:** → Go to **Leaf A**.
  *   **Yes:** → Go to Node 2.

  ### Node 2 (Granularity)
  **Question:** If you were born 18 months later than you were, would you fundamentally differ from your classmates, or just differ slightly?
  *   **Slightly (Smooth Gradient):** → Go to **Leaf B**.
  *   **Fundamentally (Lumpy Clusters):** → Go to Node 3.

  ### Node 3 (Causal Status)
  **Question:** Is "being a Boomer" a *cause* of your behavior, or just a convenient label for a bunch of people who experienced the same causes?
  *   **Just a Label (Container):** → Go to **Leaf B** (Cohort Realism).
  *   **A Cause (Essence):** → Go to Node 4.
      *(Note: This separates those who think cohorts are real statistical groups from those who think 'generation' is an active force.)*

  ### Node 4 (Boundary Sensitivity)
  **Question:** If we shifted the start date of your generation by five years, would the theory break?
  *   **No (Shiftible):** → Go to Node 5.
  *   **Yes (Fixed):** → Go to Node 7.

  ### Node 5 (Boundary Source)
  **Question:** Are the edges of the group determined by demographic shocks (e.g., birth rates) or by cultural naming (e.g., magazines, marketers)?
  *   **Cultural Naming:** → Go to Node 6.
  *   **Demographic Shocks:** → Go to **Leaf G** (Objective Clustering).

  ### Node 6 (Performativity)
  **Question:** Does giving the group a name change how they behave, or just describe how they already behave?
  *   **Changes Behavior:** → Go to **Leaf C**.
  *   **Describes Behavior:** → Go to **Leaf D**.

  ### Node 7 (Independence)
  **Question:** Could this generation exist if no one ever named it or talked about it?
  *   **No (Needs Naming):** → Go to **Leaf D** (Conventionalism).
  *   **Yes (Independent):** → Go to Node 8.

  ### Node 8 (Consciousness)
  **Question:** Do the people in the group need to *feel* like they belong together for the generation to exist?
  *   **Yes:** → Go to **Leaf E**.
  *   **No:** → Go to Node 9.

  ### Node 9 (Cyclicity)
  **Question:** Do these groups appear in a predictable, repeating rhythm (like seasons), or are they unique accidents of history?
  *   **Predictable Rhythm:** → Go to **Leaf F**.
  *   **Unique Accidents:** → Go to **Leaf G**.

  ### Node 10 (Ontological Category)
  **Question:** Is a generation primarily a group of *people* or a slice of *time*?
  *   **Slice of Time:** → Go to **Leaf H**.
  *   **Group of People:** → (Return to previous leaf determined by Node 9).
      *(Note: This node is a tie-breaker for the Realist path; most will return to G or F, but H is distinct.)*

  ---

  ### The Leaves

  *   **Leaf A: Statistical Eliminativism.** Generations are artifacts of the Age-Period-Cohort identification problem. There is no residual cohort effect; what looks like a generation is just age effects or period effects misattributed to birth year.
  *   **Leaf B: Continuous Cohort Realism.** Birth year matters, but "generations" are fake bins imposed on a continuous slope. Every year is different, but there are no natural clusters.
  *   **Leaf C: Performative Constructionism.** Generations are real because we name them. The label creates the similarity (self-fulfilling prophecy), not the other way around.
  *   **Leaf D: Conventionalism (Weak Realism).** Generations are useful fictions. The boundaries are arbitrary, and the label doesn't change behavior, but the grouping tracks real similarities well enough for social science.
  *   **Leaf E: Mannheimian Generationalism.** A generation requires "shared consciousness." Without a feeling of shared location in history (a "we"), it is just a cohort, not a generation.
  *   **Leaf F: Cyclic Historicism (Strauss-Howe).** Generations are real, objective, and driven by a recurring historical engine. They exist independent of consciousness and follow a predictable turnings cycle.
  *   **Leaf G: Objective Cohort Clustering.** Generations are real clusters caused by unique historical accidents (wars, tech shocks). Boundaries are fixed by events, not naming, but there is no repeating cycle. *(The "Missing Corner" often unoccupied because people assume clusters imply cycles or consciousness.)*
  *   **Leaf H: Temporal Idealism.** A generation is not a group of people, but a quality of a time period itself. People inhabit the generation; they do not constitute it.

  ---

  ### Analysis of the Space

  **Indistinguishable Leaves:**
  *   **Leaf D (Conventionalism) and Leaf G (Objective Clustering):** These can blur if the "demographic shocks" in Node 5 are weak. If a student believes boundaries are fixed by demographics (Node 5) but also believes the label doesn't matter (Node 7), they land in G. If they think boundaries are fixed but the *concept* relies on naming, they land in D. In practice, many "Objective" realists are unwilling to commit to the idea that the generation exists *without* the name, pushing them into D.
  *   **Leaf B (Continuous Cohort) and Leaf A (Eliminativism):** If the "residual" in Node 1 is very small, the distinction between "smooth gradient" and "noise" becomes statistical rather than ontological.

  **Empty/Unattractive Cells:**
  *   **Cyclic + Consciousness (Node 9 Yes + Node 8 Yes):** This cell is largely empty. If history moves in a deterministic cycle (Strauss-Howe), individual consciousness is usually treated as epiphenomenal (like leaves knowing they are autumn). If consciousness is required (Mannheim), the mechanism is usually trauma-based, not cyclic. A theory claiming *both* a rigid historical clock *and* a requirement for subjective self-identification is theoretically unstable.
  *   **Temporal Idealism (Leaf H):** This is the "无人区" (no-man's-land). Almost everyone intuitively treats generations as aggregates of people. Treating a generation as a "time slice" that exists independently of the people living in it is a hard sell ontologically, though it appears in some Hegelian or structuralist histories.
  *   **Performative + Fixed Boundaries (Node 6 Yes + Node 4 Yes):** If the label *creates* the group (Performativity), the boundaries should be shiftible based on when the label is applied. Claiming that a performative label has *fixed, natural* start dates (e.g., "The label 'Millennial' created this group, and the group strictly starts in 1981") is incoherent.

  **Why Node 1 is Critical:**
  This is the APC identification problem. If students skip this and go straight to "Are boundaries real?", they are assuming the existence of the object before establishing its necessity. This node forces the Eliminativist path to be a genuine option, not a strawman.

  **Why Node 3 is Critical:**
  This separates **Cohort Realism** (Leaf B) from **Generation Realism**. Many students want to say "Cohorts are real" but reject "Generations." Node 3 forces them to admit that if "Generation" is just a label for a cohort, they are actually Cohort Realists, not Generation Realists. It prevents label-hiding.
