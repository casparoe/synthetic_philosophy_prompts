answer: |-
  **Preconditions: The Protocol Shift**
  Before you draw a single node, you must reframe the domain. She thinks in loss landscapes; you need her to think in **handshake protocols**.
  1.  **Objective vs. Constraint:** Explicitly state that Contractualism is not an objective function ($ \min L $) but a validity constraint on the function itself. The goal isn't "best outcome," it's "unrejectable rule."
  2.  **Generic vs. Specific:** Define "reasonable" immediately as *generic*. A rejection counts only if it appeals to reasons anyone in that position could have, not "because it's *me*." This prevents her from modeling it as personalized weights.
  3.  **The Unit of Analysis:** Insist that the moral unit is the *individual claim*, not the *group outcome*. In her terms: you are iterating over agents, not batching them.

  **The Single Case: The Noisy Neighbor**
  Do not use life/death. Do not use rescue. Use **The Noisy Neighbor**.
  *   **Setup:** A principle is proposed: "Residents may play musical instruments in their homes between 8 PM and 10 PM."
  *   **Agents:** One Drummer (high value activity, moderate noise) vs. $N$ Neighbors (low value quiet, moderate annoyance).
  *   **What it must have:** Asymmetry of interest (Art vs. Sleep), scalability (you can add 1 neighbor or 1,000), and a shared resource (the acoustic environment).
  *   **What it must not have:** Catastrophic harm (death/maiming), active intervention (switching tracks), or emergency scarcity (one lifeboat). This avoids the "savior" heuristic and keeps it on *rule justification*.

  **The Sequence**
  1.  **Define the Veto:** A principle is wrong if *someone* could reasonably reject it. Draw the Drummer. Ask: "Can a Neighbor reject?" (Yes, sleep is important). "Can the Drummer reject a ban?" (Yes, art is important).
  2.  **Pairwise Comparison:** This is the pivot. Do not compare Drummer vs. Group. Compare **One Neighbor vs. One Drummer**.
      *   *Whiteboard move:* Draw a single line between Neighbor #1 and Drummer. Ignore Neighbor #2 through #N.
      *   *Logic:* In a pairwise comparison, the Drummer's gain (art) usually outweighs one Neighbor's loss (annoyance). Therefore, One Neighbor cannot reasonably reject the principle.
  3.  **Scale the Numbers:** Now add 1,000 Neighbors.
      *   *Her instinct:* Sum the annoyance. $1000 \times \text{Annoyance} > \text{Art}$. Ban the drums.
      *   *The Scanlon Block:* Ask: "Which *specific* neighbor is doing the rejecting?" If Neighbor #42 tries to reject, you compare #42 vs. Drummer. The presence of #1–#41 and #43–#1000 is irrelevant to #42's pairwise standing.
  4.  **The Verdict:** The principle stands. The numbers do not aggregate to override the pairwise veto.

  **Anticipated Misfires & Deflections**
  1.  **The Min-Max Trap (Minute 15):**
      *   *Her Move:* "So 'Reasonably Reject' just means 'Minimize the Maximum Complaint'?"
      *   *The Deflection:* "Min-Max is still a global optimization. It looks at the whole board to find the worst spot. Contractualism asks if *this specific player* has a valid move to stop the game. If you Min-Max, you're still summing the system's state. I'm asking if the transaction between *two* agents is justified."
      *   *When:* Hit this immediately after defining "Reasonable Rejection," before introducing the Neighbors.
  2.  **The Aggregation Trap (Minute 40):**
      *   *Her Move:* "But if 10,000 people can't sleep, the system collapses. You have to sum eventually."
      *   *The Deflection:* "You are switching from *Justification* to *Stability*. Scanlon admits large numbers might trigger a tie-breaker, but not because the complaints *add up*. It's because the *burden* on the group becomes a generic reason for anyone. But for the core moral math: You cannot justify to Neighbor #42 by saying 'But look at #43.' #42 doesn't care about #43."
      *   *When:* Hit this exactly when she tries to multiply the Neighbor's loss by $N$.

  **The Final Test Question**
  " If the 1,000 neighbors form a legal corporation and file a single complaint as one entity, does the Drummer's ability to reject the ban change?"
  *   *Correct Answer:* No. The moral status depends on the underlying individuals, not the aggregation mechanism. If she says "Yes, the weight changes," she treated the corporation as a new, heavier moral patient (aggregation). If she says "No, it's still 1,000 pairwise comparisons," she gets it.

  **Scope Limitations (Say This Up Front)**
  "I am not covering how this handles *ideal* vs. *non-ideal* theory (what happens when people break the rules), I am not covering the metaphysics of *who* counts as a contractor, and I am not claiming this solves every policy dilemma. We are strictly debugging the 'Aggregation' function."

  **The Hardest Thing**
  The hardest thing to convey is that justification is a relational property between individuals, not a calculable property of states of affairs.
