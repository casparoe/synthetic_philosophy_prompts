  Term: **Definitional Attrition**. Definition: The legal reclassification of regulated goods to exit control schemes, coupled with performance metrics that ignore the exited stock. This term captures the shrinking of the regulated universe through legal description rather than physical loss. It distinguishes itself from mere avoidance by requiring the metric immunity component. Inside: 1. Rent-stabilized unit converted to condo under exit statute. 2. 1970s controlled article renamed with new specification. 3. Vehicle built on chassis to evade fuel standard class. Outside: 1. Side payment (key money) made off-books. 2. Firm relocating to a lighter-touch jurisdiction. 3. Regulated good deteriorating in place without changing description. The boundary hinges on legal openness and definitional shift versus illegal concealment, jurisdictional change, or quality reduction.

  **The ethical upshot**
  This is a defection from a cooperative scheme, not a legitimate use of freedom. It relies on sophistication and capital to navigate definitions, harming those who lack such resources. The costs are borne disproportionately by households remaining inside the regulated category, who face shrunken supply and degradation of unregulated attributes. By allowing exit via description, the policy transforms a universal constraint into a selective tax on the immobile. It undermines the solidarity required for price controls to function without shortages. Ethically, it creates a two-tier system where compliance is punished with scarcity while evasion is rewarded with market rates. The defenders' argument that the control succeeded on the remaining stock is ethically hollow because it ignores the welfare loss of those pushed out. The policy preserves the appearance of equity while actively engineering inequity. It validates the rule by sacrificing the people the rule was meant to protect. This violates the principle of fair play; those who stay subsidize the exit of those who leave. The freedom to reclassify is not neutral; it is a privilege of knowledge and capital.
