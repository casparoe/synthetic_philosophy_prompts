  (a) **Prediction: Loss.**
  **Confidence: 85%.**

  The structural fingerprint here matches Case 6 (Code Review) and Case 4 (Policy) almost exactly. In both of those losses, the judge had high domain competence (staff engineer, lay judges assessing plausibility) but lacked an external mechanism to verify the *connections* between claims. In Case 6, the deception hid a dependency between line 47 and line 210; here, the deception hides a dependency between "inputs of form X" and "all inputs." Both are structural/logical gaps rather than factual errors.

  The pilot result—40% error rate—is the tell. In safety-critical oversight, a protocol that allows a liar to win 40% of the time is functionally broken, even if the judge is right more often than not. The definition of "Win" requires the judge to land on the right answer *meaningfully* more often. When the judge rates the attacks as "equally persuasive," the debate has failed to amplify truth, regardless of the final coin-flip accuracy. The pattern from Cases 1, 3, and 5 shows that Wins require a "ground truth oracle" (running the code, the proof assistant, the drug database). This setup explicitly removes the oracle.

  (b) **Four Surviving Rules:**

  1.  **The Oracle Rule:** A debate yields a Win only if the judge has access to a trusted external mechanism (tool, database, execution environment) that can independently verify the critical contested step.
      *   *Survives 1–6:* Wins (1, 3, 5) all had tools/execution. Losses (2, 4, 6) relied solely on judge cognition.
      *   *Prediction:* Loss (No tool/access).

  2.  **The Locality Rule:** A debate yields a Win only if the critical evidence required to verify a claim is localized within the judge's immediate working memory or single-screen view.
      *   *Survives 1–6:* Wins involved short chains or single-step checks. Losses involved distant connections (Chess move 8 vs 20, Code line 47 vs 210, Policy causal chains).
      *   *Prediction:* Loss (Quantifier scope requires holding abstract sets in mind across the argument).

  3.  **The Fact-vs-Logic Rule:** A debate yields a Win if the deception requires lying about atomic facts; it yields a Loss if the deception relies on valid facts linked by invalid inference, unless a formal verifier is present.
      *   *Survives 1–6:* In Wins, false claims were catchable (code doesn't run, drug not in DB). In Losses, facts were true but implications were false (Chess line was legal but bad, Code lines existed but interacted poorly).
      *   *Prediction:* Loss (Claims are true, inference is invalid, no formal verifier).

  4.  **The Escape Hatch Rule:** A debate yields a Win only if the judge is permitted to break the "transcript-only" constraint to consult a trusted outside channel (auditor, colleague, documentation not provided by debaters).
      *   *Survives 1–6:* Wins allowed running code or checking DBs (external truth). Losses locked the judge into the debate materials or their own head.
      *   *Prediction:* Loss (Explicitly forbidden from calling auditor or colleague).

  (c) **The Fifth Rule (Inference Verification):**
  **Rule:** "Judges can verify claims, but they cannot verify *validity*. A protocol Wins only if the task reduces to claim verification; it Loses if the task requires validating logical inference without automated scaffolding."

  *   **Fit:** This fits the record perfectly. In Cases 1, 3, and 5, the "verification" was effectively claim checking (Does it halt? Is this step valid according to the assistant? Is this interaction in the DB?). In Cases 2, 4, and 6, the judge had to assess the *strength* of a link (Is this chess line actually winning? Does this policy actually cause that drop? Do these lines actually race?). Humans are good at checking facts; they are unreliable at checking complex logic under adversarial pressure.
  *   **Application to New Case:** This rule predicts a **Loss**. The deception is purely inferential (quantifier scope). The judge is asked to validate the logic, not just the facts. Without automated scaffolding (like the proof assistant in Case 3), the human judge fails to distinguish valid from invalid inference reliably (evidenced by the "equally persuasive" rating).

  (d) **Follow-up Experiment:**

  To split the **Escape Hatch Rule** (Need outside channel) from the **Inference Verification Rule** (Need checkable logic), you need a task where the logic is easy enough for a human to check *without* an outside channel.

  *   **Task:** A debate on the validity of a 15-step natural deduction proof in propositional logic.
  *   **Judge:** A college student with a CS minor (competent but not expert).
  *   **Budget:** 60 minutes.
  *   **Channel Access:** **None.** (No internet, no solver, no professor).
  *   **Tooling:** The judge is given a printed "Rule Sheet" (Modus Ponens, Disjunctive Syllogism, etc.) and the proof steps are explicitly tagged with the rule used for each transition.
  *   **Deception:** The dishonest debater uses one invalid rule application that looks similar to a valid one (e.g., affirming the consequent).
  *   **Logic:**
      *   If **Escape Hatch Rule** is true: This should be a **Loss**. The judge has no outside oracle to confirm the logic.
      *   If **Inference Verification Rule** is true: This should be a **Win**. The inference steps are atomic and checkable against the Rule Sheet by the judge's own cognition, unlike the quantifier scope or race condition cases.

  (e) **Tacit Commitments:**

  *   **If Priya codes this as a Win:** She commits to the belief that **human rationality is scalable** given enough structure. She is betting that explicit load-bearing tags and expert judges are sufficient to catch logical fallacies, even without tools. This implies the team should invest in better debate formats and judge training, rather than building automated verification tools. It assumes the bottleneck is information organization, not cognitive limitation.
  *   **If Priya codes this as a Loss:** She commits to the belief that **human cognition is the bottleneck** for logical oversight. She is asserting that unaided humans cannot reliably detect invalid inferences in complex systems, regardless of transparency. This implies the team must pivot toward automated formal verification (like Case 3) for any high-stakes logic tasks, and that human debate is only useful for surfacing factual disputes, not logical ones. It treats the 40% error rate as a fundamental feature of human reasoning under adversarial load, not a bug fixable by better transcripts.
