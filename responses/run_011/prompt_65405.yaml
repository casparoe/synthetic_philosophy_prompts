      *(Self-Correction during drafting)*: Wait, Carnap's socialism was nuanced. He wasn't a Soviet planner. He was a social democrat. He valued individual liberty. Would he support a "public planning authority"? He supported Neurath's ideas but Neurath was more radical. Carnap's *Tolerance* is key. He wouldn't forbid it. He would ask: "Is this framework more fruitful than the market framework?"
      *Decision:* He would treat the Planning Authority as a proposed *linguistic framework* for economics. The question is not "Is it true?" but "Is it useful?" Given the data capabilities, he'd lean towards "It is now a viable framework to test," whereas in 1930 it might not have been.

      *Wait, one more check on Non-Cognitivism:* Carnap holds ethical statements are not cognitive. So the "objective function" cannot be scientifically justified. Parliament setting it is correct *because* it is a volitional act, not a scientific one. Science serves the volition.

      *Final Plan:*
      1.  **Verdict:** Carnap endorses the *logical permissibility* and *empirical testability* of the plan, rejecting Hayek's a priori ban.
