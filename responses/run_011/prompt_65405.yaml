      *Let's sharpen the "Vulnerability":* Carnap's inductive logic project was a failure. He might overestimate the ability to formalize the "data" from firm-level transactions into a coherent predictive model. The "tacit knowledge" might be unformalizable not metaphysically, but practically in a way that breaks the induction.

