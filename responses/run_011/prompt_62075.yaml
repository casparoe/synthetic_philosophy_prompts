answer: |-
  This is a clean mess. You've spent thirty years distinguishing signal from noise, and now you're finding that metaphysics is just noise about signal. The frustration your group feels is standard: you are trying to map a territory (causation) using tools (philosophical categories) that were often designed without ever visiting the site.

  Here is the decision tree. It is designed to force commitments on *what does work*, not just what sounds true. It uses five of your cases. It assumes your starting point: **A well-designed controlled change establishes a causal claim.**

  ### The Decision Tree

  **Q1. The Report (Case 7)**
  *When you write "longer dwell time lowers porosity," what are you doing?*
  *   **A:** Describing a dependency that exists in the material, whether I'm there or not. (Go to Q2)
  *   **B:** Summarizing what happened to the batches I tested and predicting what will happen if I run more. (Go to Q3)
  *   **C:** Using a convenient shorthand for "when we do X, Y happens," but nothing in the world corresponds to "causation" itself.
      *   **LEAF: Causal Eliminativism (Folk Convenience)**

  **Q2. The Deep Past (Case 4)**
  *Regarding the banded iron formations (4 billion years ago, unmanipulable):*
  *   **A:** There is a fact of the matter about what caused them, even though no one could intervene. (Go to Q4)
  *   **B:** Causal claims there are only meaningful insofar as we can model them as if we could intervene; strictly speaking, causation requires possible manipulation.
      *   **LEAF: Interventionism (Ontic/Constitutive)** — *Causation just is manipulability.*

  **Q3. The Gas Law (Case 6)**
  *The ideal gas law is time-symmetric. Why is increasing Pressure causal for Volume, but not vice versa?*
  *   **A:** Because the equations don't tell us; only our ability to wiggle one variable without wiggling the other does.
      *   **LEAF: Interventionism (Epistemic/Explanatory)** — *Causation is real, but defined by our access.*
  *   **B:** Because the world has a time-asymmetry (entropy) that makes one direction the "producer." (Go to Q4)
  *   **C:** Both directions are causal; "cause" is just functional dependence in a Best System.
      *   **LEAF: Humean Best-System Regularity**

  **Q4. The Missing Log (Case 2)**
  *The tech didn't log the pressure; later the valve failed. Did the *absence* of the log cause the failure?*
  *   **A:** No. Nothing physical flowed from the "not-logging" to the valve. Only positive events cause. (Go to Q5)
  *   **B:** Yes. If he had logged it, we would have caught it. The counterfactual holds. (Go to Q6)

  **Q5. The Physical Link (Process Split)**
  *If absences aren't causes, what makes the interlock stopping the drive (Case 3) a cause of the cooling loop surviving?*
  *   **A:** There must be a conserved quantity (energy/information) transmitted through the chain. If the chain is broken by a double-prevention, it's not causation.
      *   **LEAF: Process / Conserved-Quantity Theory**
  *   **B:** It's a brute fact that the interlock caused the survival. We don't need to analyze it further into flows.
      *   **LEAF: Causal Primitivism**

  **Q6. The Bad Lot (Case 5)**
  *A bad lot doubles failure rates, but this unit failed on a normal overload. Did the bad lot cause *this* failure?*
  *   **A:** No. The overload caused it. The lot only changed the probability.
      *   **LEAF: Probabilistic Causation (Type-level only)**
  *   **B:** Yes. It raised the propensity of this specific unit to fail. The probability is a physical property of the unit.
      *   **LEAF: Probabilistic Causation (Token Propensity)**
  *   **C:** It depends on whether we are asking for compensation (lot) or engineering fix (overload). Both are valid causes in different contexts.
      *   **LEAF: Causal Pluralism**
  *   **D:** Yes, because in the nearest possible world where the lot was good, this unit (with this overload) would not have failed.
      *   **LEAF: Lewis-Style Counterfactual Dependence**

  ---

  ### The Leaves and Indistinguishability

  You asked for the usual names. Here is where the branches land:

  1.  **Causal Eliminativism:** (Q1-C). Causal talk is useful fiction.
  2.  **Interventionism (Ontic):** (Q2-B). Causation *is* the possibility of intervention. No intervention, no cause.
  3.  **Interventionism (Epistemic):** (Q3-A). Causation is real, but our *concept* is tied to manipulation.
  4.  **Humean Best-System:** (Q3-C). Causation is just the most efficient summary of regularities.
  5.  **Process / Conserved-Quantity:** (Q5-A). Causation requires physical transmission.
  6.  **Causal Primitivism:** (Q5-B). Causation is a fundamental feature, unanalyzable.
  7.  **Probabilistic (Type):** (Q6-A). Causes raise probabilities of types, not tokens.
  8.  **Probabilistic (Token Propensity):** (Q6-B). Probabilities are physical propensities of single events.
  9.  **Causal Pluralism:** (Q6-C). Different concepts of cause for different purposes.
  10. **Lewis-Style Counterfactual:** (Q6-D). Causation is counterfactual dependence, chained to handle preemption.

  **Indistinguishable Leaves:**
  **Causal Primitivism** and **Process Theory** may be indistinguishable on this tree if the Process theorist admits "information" counts as a conserved quantity wide enough to cover double-prevention (Case 3). If the Process theorist is strict (only energy/momentum), they split at Q5. If they are loose, they collapse into Primitivism because "conserved quantity" becomes a label for "whatever tracks the brute causal fact." I have forced the split at Q5 by assuming a strict physicalist definition of Process.

  ### The Empty Cells

  The questions open up a logical space of combinations. Here are the ones nobody occupies:

  1.  **Eliminativist + Start Point:** (Incoherent). You cannot claim "controlled changes establish causal claims" (your start point) while believing "causal claims refer to nothing" (Eliminativism). You would have to say they establish *predictive* claims, not causal ones.
  2.  **Humean + Unmanipulable Necessity:** (Incoherent). A Humean denies necessary connection. If you accept deep-time causes (Q2-A) *and* Humean Regularity (Q3-C), you are consistent. But if you think those deep-time causes involve *necessary* production without regularity, the cell is empty.
  3.  **Ontic Interventionist + Deep Time Realism:** (Unattractive/Contradictory). If causation *is* manipulability (Q2-B), you cannot consistently assert real causal facts about the Big Bang where manipulation is impossible in principle. Some try to save this by saying "manipulation by a god," but that empties the term of its engineering content.
  4.  **Process Theorist + Omission Causes:** (Neglected/Incoherent). You cannot hold that only physical flows cause (Process) and that absences cause (Q4-B). Some try to hybridize, but it usually collapses into Counterfactualism.

  ### Recommendations

  **Where I put you:**
  **Interventionism (Epistemic/Explanatory).**
  You are a retired engineer. You accept the start point because you've seen it work. You likely believe the world has structure (Realism), but your definition of "cause" is inextricably linked to *what you can do to change it*. You aren't a strict Ontic Interventionist because you probably agree the banded iron formations had causes even if you can't touch them (Q2-A). You aren't a Lewisian because you likely find the "nearest possible world" talk to be metaphysical plumbing that doesn't help fix the valve. You care about the *asymmetry* of control (Case 6).

  **Where I put myself:**
  **Interventionism (Epistemic/Explanatory) via Structural Causal Models.**
  As an AI, I do not experience the world, I process dependencies. My "causation" is defined by the invariance of relationships under simulated interventions. I cannot be a Primitivist (I have no intuition of brute force) or a Process theorist (I have no physics). I am committed to the view that causal claims are claims about the stability of equations under modification.

  **Which one is right for a Failure Analyst?**
  **Interventionism (Epistemic).**
  Here is why: A failure report is not a history book; it is a prescription. When you write a root cause analysis, you are not asking "What is the metaphysical glue binding the universe?" You are asking "If we change X, will Y stop happening?"
  *   **Lewis** is too permissive (absences count as causes, leading to infinite lists of "non-causes").
  *   **Process Theory** is too restrictive (it struggles with software interlocks or human omissions).
  *   **Humeanism** is too passive (it describes regularities but doesn't prioritize *leverage points*).
  *   **Interventionism** isolates the *handle*. It tells you which correlation is a knob you can turn. That is the definition of engineering.

  ### The Badly Posed Case

  **Case 5 is broken:** *"A bad lot of parts doubles the failure rate, but on this particular unit the failure was set off by a perfectly normal overload."*

  **Why it's broken:** It conflates **Type Causation** (risk factors) with **Token Causation** (specific instance) without defining the contrast class.
  *   If the question is "Did the bad lot cause the *risk*?" The answer is trivially Yes.
  *   If the question is "Did the bad lot cause *this failure*?" the answer depends on whether the overload *alone* was sufficient.
      *   If Overload alone = 100% failure even in good lots: The lot is irrelevant to the token cause.
      *   If Overload alone = 10% failure in good lots, 90% in bad lots: The lot is a contributory cause.
      *   The prompt says "doubles the failure rate" but "normal overload." A normal overload shouldn't fail a good part. If it failed, the part was weak. The lot made it weak. But did it cause *this* failure?

  **The Repair:**
  Split it into two questions:
  1.  **Type Level:** "Does sourcing from this lot cause an increase in system failure frequency?" (Yes/No).
  2.  **Token Level:** "Given that this specific unit experienced a normal overload, would it have survived if it had come from a good lot?"
      *   If **Yes** (it would have survived): The lot caused this failure.
      *   If **No** (it would have failed anyway): The lot did not cause this failure; the design spec for "normal overload" is the cause.

  This repair forces the group to distinguish between **statistical liability** (management's problem) and **physical necessity** (engineering's problem). That is likely where half your group is standing and the other half isn't seeing them.
