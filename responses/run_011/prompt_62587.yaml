prompt: |-
  You're a metaphysician who works on persistence and material constitution — someone who's taught the Ship of Theseus a dozen times and is thoroughly sick of the four-option multiple-choice version of it. Think carefully, and start by brainstorming two or three candidate framings before you commit to one.

  The episode: the main shrine buildings at Ise in Japan are rebuilt from scratch roughly every twenty years, on one of two adjacent plots that alternate — so at any given moment there's a brand-new building on one plot and a twenty-year-old one on the next to it, and the old one then gets taken apart. All cypress, no nails, thatch roof, everything replaced. Its been done this way for something like 1300 years, with one big exception: a gap of well over a century in the medieval period when warfare made it impossible, after which the cycle started up again. The enshrined kami is transferred to the new building at night, in darkness. The old timbers aren't discarded — the largest become torii gates and the rest get distributed to shrines around the country to repair theirs. And the carpentry, the joinery and the ritual sequence are transmitted through the craftspeople, which is arguably the strand that survives most reliably.

  My working claim, which I want you to stress-test rather than flatter: the puzzle only generates its famous embarrassment because it's staged so that exactly one candidate survives the replacement — or exactly two, in the version where somebody hoards the original planks. At Ise there are two standing buildings at once plus a distributed downstream network of reused timber, so "which one is it" never gets a single grip, and the practice carries on regardless. Nobody at Ise has ever supposed the shrine stopped existing.

  So run it in both directions. First, what do the main accounts actually say about this case: spatiotemporal continuity, four-dimensionalist/temporal-parts views, the sortal or dominant-kind line, hylemorphism if you think it earns its keep here, and the reductionist "identity is just what we care about" view. Take the transfer seriously — for a few hours there are two complete shrines and a deity moving between them in the dark. Second, and more important: what does the case do to the puzzle? Does it confirm one account, expose an anomaly, or is it something the puzzle was never built to handle — since the puzzle assumes replacement is a threat to be answered, whereas here replacement is the entire point of the institution? Where the theories are just silent, say so; don't force them to speak.

  One aside, take it or leave it: I have it in my head that the international conservation establishment had to loosen its criteria for authenticity in the mid-90s partly because of practices like this, something about a document drafted in Japan. Only bring that in if there's a metaphysical moral in it. And finish by telling me which piece of my working claim is most likely to get torn apart in seminar.
