  # Joint Statement on the 1831–1848 Estate Corpus

  ## I. Agreed Claims

  1.  [C] The clean excision of the 1839–1840 account book pages indicates deliberate removal rather than material decay. (Camp A resisted; moved by consensus on physical evidence of stubs.)
  2.  [M] Backfilling from comparable estates constitutes a distinct epistemic operation from internal inference. (Camp A resisted; moved by stipulated vocabulary definition.)
  3.  [E] Indexical silences do not automatically license reconstruction of specific content. (Camp A resisted; moved by application of the symmetric legibility test.)
  4.  [C] The interpreter's salaried status locates the testimony within estate governance rather than invalidating it outright. (Camp B resisted; moved by agreement on mediation inevitability.)
  5.  [C] The 1843 account book count of 61 head excludes individuals present in the baptismal register.
  6.  [M] The symmetric legibility test applies equally to overseer accounts and mission registers.
  7.  [E] Refusing to fill gaps ratifies the archive's selection of who counted. (Camp B resisted; moved by Camp A's ethical framing of lacunae.)
  8.  [C] The three individuals in depositions absent from other sources indicate porous estate boundaries.
  9.  [M] Conjecture must be explicitly labeled as probabilistic.
  10. [C] The marginal notes in 1843 represent a distinct administrative intervention.
  11. [E] The absence of self-authored records is a constitutive silence regarding interiority. (Camp B resisted; moved by agreement on literacy laws.)
  12. [C] Livestock and enslaved people sharing a column constitutes a taxonomic silence regarding personhood.

  ## II. Disagreements Table

  | (i) Disagreement | (ii) Camp A Formulation | (iii) Camp B Formulation | (iv) Classification | (v) Neutral Sentence |
  | :--- | :--- | :--- | :--- | :--- |
  | **1843 Count Discrepancy** | The four-person difference evidences unrecorded persons withheld from the account book. | The difference evidences divergent counting conventions or record loss. | Substantive | *N/A* |
  | **1839–1840 Excision** | The excision evidences the content removed (e.g., rebellion, sale). | The excision evidences only the intent of the exciser, not the content. | Partly Verbal | The excision confirms human agency but does not specify the removed data. |
  | **Interpreter Position** | The employee status locates the mediation within power structures without discrediting it. | The employee status discredits the testimony as inherently coerced. | Wholly Verbal | The interpreter's employment constrains the testimony's reliability without nullifying it. |
  | **1843 Marginal Hand** | The second hand acts as a distinct witness correcting the original record. | The second hand acts as an auditor correcting arithmetic errors only. | Partly Verbal | The second hand modifies the 1843 record at a later administrative moment. |

  ## III. Cruxes

  **1. The 1843 Count Discrepancy**
  *   **Question:** Does the difference between 61 head (account book) and 65 attributable names (register) represent unrecorded persons or definitional variance?
  *   **Corpus Item:** The 1843 account book total versus the 1843 baptismal register total minus neighboring estate annotations.
  *   **Camp A Prediction:** Future discovery will identify at least two of the missing four individuals in estate correspondence.
  *   **Camp B Prediction:** Future discovery will define a category (e.g., "infants," "infirm") excluded from the account book valuation.
  *   **Falsification:** Camp A is falsified if no names emerge in correspondence; Camp B is falsified if excluded individuals are valued adults.

  **2. The 1839–1840 Excision**
  *   **Question:** Does the physical removal of pages correlate with a specific historical event?
  *   **Corpus Item:** The clean cut stubs remaining in the 1839–1840 account book section.
  *   **Camp A Prediction:** External regional records will show a disturbance on this estate in 1839–1840.
  *   **Camp B Prediction:** External records will show no specific disturbance; the excision was routine administrative pruning.
  *   **Falsification:** Camp A is falsified if regional records show stability; Camp B is falsified if regional records show unrest specific to this estate.

  **3. The Constitutive/Indexical Dichotomy**
  *   **Question:** Is the two-way distinction sufficient to classify silences where a slot exists but fillers are taxonomically constrained?
  *   **Corpus Item:** The account book column listing enslaved people as "head" alongside livestock.
  *   **Camp A Prediction:** The dichotomy is insufficient; a third category ("Taxonomic Silence") is required.
  *   **Camp B Prediction:** The dichotomy is sufficient; this fits within "constitutive" as the form denies personhood.
  *   **Falsification:** Both camps agree the dichotomy is a crux. It is falsified as sufficient if we cannot agree on whether the "head" slot records presence (indexical) or erases identity (constitutive). We agree it misclassifies the "head" column, which records presence but erases identity, requiring the third category.

  ## IV. Joint Methods Paragraph

  In this monograph, conjectural statements are labeled [Probable] when internal consistency exceeds 75% and [Plausible] when reliant on external regularities. We restrict backfilling to demographic rates derived from comparable estates only when internal data is absent, flagging such instances as [External Estimate]. This convention acknowledges Camp A's insistence that refusal to conjecture ratifies archival selection, while adhering to Camp B's requirement that the archive's frame not be imported uncritically. We acknowledge that approximately eighteen months of our dispute concerned the definition of 'indexical silence' rather than the historical reality of the 1843 discrepancy. Specifically, we debated whether a slot existing within a dominant taxonomy constitutes a constitutive silence when available fillers are constrained by that taxonomy. We now agree this requires a third category, 'Taxonomic Silence,' applicable to the account book's 'head' column, which records presence but erases identity. This verbal dispute delayed our analysis of the 1839–1840 excision, which we now classify as an indexical silence regarding content but a constitutive silence regarding administrative intent. Future work will apply the symmetric legibility test to ensure no inference granted here would be denied to a planter's diary. Our method prioritizes documented lacunae where evidence is absent, but permits probabilistic reconstruction where power structures clearly generated the gap. We accept that some questions regarding the interpreter's mediation remain substantive, not verbal, and require further archival discovery rather than definitional adjustment. Consequently, we treat the interpreter's testimony as situated evidence, neither wholly dismissed nor fully trusted, pending external corroboration.
