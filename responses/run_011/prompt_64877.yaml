prompt: |-
  I'm auditing a graduate seminar on knowledge and action this term, and there is a knot in the material on knowing how versus knowing that that I have not been able to untangle. The setup is familiar enough: Ryle's argument in The Concept of Mind is usually presented as showing that intellectualism — the thesis that knowing how to F is a species of knowing that something is the case — collapses into an infinite regress, because acting intelligently would first require contemplating a proposition about how to F, and that contemplating would itself have to be done intelligently, requiring a further such proposition, and so on. Our instructor's response was that this is a bad argument, or at any rate an argument against a straw man: what it actually refutes is only the claim that an agent must occurrently consider a proposition in order to act intelligently on it, and no intellectualist needs that claim, since the intellectualist can hold that a stored piece of propositional knowledge guides action without ever being brought before the mind. She added that the point cuts against the other side too — whatever stops the regress for the intellectualist, namely that the knowledge is simply there in the right relation to the action without being surveyed, seems to stop it equally for the anti-intellectualist, whose dispositions are likewise supposed to guide action without being exercised in any further act. I think I follow this, but I would like a careful explanation of what the regress does and does not establish: which premise is the vulnerable one, why the intellectualist can reject that premise without giving up intellectualism, and whether her symmetry claim really holds or is too quick.

  The reason I am not satisfied is a second worry that surfaced afterwards and that we ran out of time to resolve. Suppose the intellectualist, having escaped the regress, still owes an account of what makes a piece of propositional knowledge the right kind of knowledge to constitute skill. Take a cycling commentator who can recite everything true about countersteering — lean the way you want to go, steer briefly the other way, the role of trail and of gyroscopic effects, the correction rate as a function of speed — and who, put on a bicycle in an empty parking lot, goes down within ten feet. Intuitively she knows all the propositions and still does not know how to ride. (This is not a hypothetical: my partner teaches adult swim lessons and meets roughly this person every season.) The intellectualist's standard move is to say that the propositions must be grasped under a practical rather than a theoretical mode of presentation, so that the commentator lacks not the content but the way of having it; or, alternatively, that knowing how requires employing the relevant proposition in action rather than merely assenting to it. Both moves strike me as doing all of the work and none of the explaining. If grasping a proposition practically just means grasping it in whatever way is required for knowing how to F, the account is circular; and if employing a proposition in intentional action is itself something done skillfully, then it is itself a know-how, and the regress has not been stopped but relocated one level down — this time to the notion of a mode of presentation or of employment, rather than to the notion of contemplating.

  So here is what I want: an explanation of this conceptual issue, not a survey of the positions. Walk me through the structure of the disagreement — what the regress is meant to show, what it actually shows, and what it presupposes about how knowledge has to relate to action in order for the intellectualist to be in trouble. Then take up the sufficiency problem I sketched and lay out clearly what resources are available for closing the gap between having the right propositional knowledge and being able to perform: a substantive account of practical ways of thinking that is more than a label; a restriction on which propositions count, so that the way must be one the agent can actually execute; an appeal to the difference between possessing and exercising knowledge, perhaps together with cases of the temporarily incapacitated expert who keeps her know-how while losing the ability to display it; or a concession that the gap is primitive. For each option, tell me what it costs and whether it reintroduces the regress somewhere new. I am content for you to conclude that one option is the best of a bad lot, or that the whole dispute rests on an unstable notion of guidance — but I want the reasoning that gets there spelled out rather than a verdict announced, and I would rather you reason from the cases and the concepts than send me anywhere to look things up.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is auditing a graduate seminar on knowledge and action.
      *   **Core Issue:** The "knowing-how vs. knowing-that" debate (Intellectualism vs. Anti-Intellectualism).
      *   **Specific Problems:**
          1.  **The Regress Argument:** Ryle's regress against Intellectualism. The instructor claims it attacks a straw man (occurrent contemplation) and that the escape (dispositional storage) works for both sides symmetrically. The user wants a careful explanation of what the regress actually establishes, which premise is vulnerable, and if the symmetry claim holds.
          2.  **The Sufficiency Problem (The Cyclist Case):** Even if Intellectualism escapes the regress, how does it distinguish *mere propositional knowledge* (the commentator) from *skill* (the rider)? The standard moves ("practical mode of presentation" or "employment in action") feel circular or regress-inducing.
      *   **Requirements:**
          *   Conceptual explanation, not a literature survey.
          *   Walk through the structure of the disagreement.
          *   Analyze the regress (what it shows, what it presupposes).
          *   Analyze the sufficiency problem (resources available, costs, risk of new regress).
          *   Reason from cases and concepts.
          *   No "go look this up" verdicts; provide a reasoned conclusion (even if tentative).

  2.  **Deconstruct Problem 1: The Regress:**
      *   *Ryle's Argument:* If knowing-how is knowing-that, then to act intelligently, one must first contemplate the relevant proposition. But contemplating is an intelligent act, requiring prior knowledge-how, leading to regress.
      *   *Instructor's Critique:* Intellectualists don't need *occurrent* contemplation. Knowledge can be dispositional.
      *   *Symmetry Claim:* If dispositional knowledge stops the regress for the Intellectualist, dispositional abilities stop it for the Anti-Intellectualist.
      *   *Analysis:*
          *   What premise is vulnerable? The premise that *guidance requires occurrent representation*.
          *   Does rejecting it save Intellectualism? Yes, if knowledge-that can be dispositional.
          *   Is the symmetry real? Mostly, yes. Both sides need a "default mode" of operation that doesn't require infinite prior steps. The Anti-Intellectualist posits brute dispositions; the Intellectualist posits brute dispositional propositional knowledge. The difference is the *format* of the disposition, not the *structure* of the regress stopper.
          *   *Nuance:* The regress *does* show that *explicit* intellectualism (requiring conscious rule-following) fails. It doesn't kill *implicit* intellectualism.

  3.  **Deconstruct Problem 2: The Sufficiency Problem (The Commentator):**
      *   *The Case:* Commentator knows all truths about cycling but can't ride.
      *   *The Challenge:* How does Intellectualism distinguish the commentator's knowledge-that from the rider's knowledge-how if both are just "knowing-that"?
      *   *Option A: Practical Mode of Presentation (MOP).*
          *   *Idea:* Same proposition, different cognitive relation (e.g., "under a practical guise").
          *   *Cost:* Risks circularity. If "practical MOP" just means "the way you have it when you know how," it explains nothing.
          *   *Regress Risk:* If grasping a practical MOP is itself a skill, we are back to square one.
      *   *Option B: Employment/Use Condition.*
          *   *Idea:* Knowing-how requires *using* the proposition in action, not just assenting.
          *   *Cost:* "Using in action" sounds like a performance condition, not an epistemic one. It blurs the line between knowledge and ability.
          *   *Regress Risk:* If "using" is a skill, regress returns.
      *   *Option C: Possession vs. Exercise (The Incapacitated Expert).*
          *   *Idea:* The rider has the knowledge even when not riding (e.g., broken leg). The commentator never has it.
          *   *Cost:* Doesn't explain *what* the knowledge consists in. Just says "they have it."
      *   *Option D: Concede the Gap (Primitive Guidance).*
          *   *Idea:* Admit that propositional knowledge needs a primitive "hook" to action.
          *   *Cost:* Weakens the reductive ambition of Intellectualism.

  4.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the query. Set the stage (Ryle vs. Contemporary Intellectualism).
      *   **Part 1: The Regress Argument:**
          *   Reconstruct Ryle's specific target (Ocurrent Intellectualism).
          *   Identify the vulnerable premise (The Contemplation Requirement).
          *   Evaluate the Instructor's Symmetry Claim (It holds regarding the *structure* of stopping the regress, but the *nature* of the stopper differs).
          *   Conclusion on Regress: It kills *conscious* rule-following accounts, not *dispositional* propositional accounts.
      *   **Part 2: The Sufficiency Problem (The Commentator):**
          *   Define the gap: Truth-conditions vs. Action-conditions.
          *   Analyze Option 1: Practical Modes of Presentation (Stanley & Williamson style).
              *   *Pros:* Distinguishes cognitive states.
              *   *Cons:* Circularity risk. Is "practical" just a placeholder?
              *   *Regress:* Only if grasping the MOP is a further act.
          *   Analyze Option 2: The Action/Employment Condition.
              *   *Pros:* Ties knowledge to success.
              *   *Cons:* Makes knowledge-how dependent on ability (conflates epistemology and metaphysics of action).
          *   Analyze Option 3: The Dispositional/Counterfactual Account.
              *   *Pros:* Handles the incapacitated expert.
              *   *Cons:* Hard to distinguish from Anti-Intellectualist dispositions without begging the question.
      *   **Part 3: The Core Tension (Guidance):**
          *   The real issue isn't the regress; it's *guidance*. How does a truth guide a muscle?
          *   Intellectualism needs a bridge (Practical MOP). Anti-Intellectualism needs a bridge (Intentional Disposition).
      *   **Conclusion/Verdict:**
          *   The regress is a red herring for modern Intellectualism.
          *   The Sufficiency Problem is the real battleground.
          *   The "Practical MOP" is the best bet but requires a non-circular account of "practicality" (likely tied to the functional role of the representation in motor control, not just conscious access).
          *   Final thought: The dispute may rest on whether we view "knowledge" as fundamentally descriptive (Intellectualism) or fundamentally functional/normative (Anti-Intellectualism).

  5.  **Refine the Tone:**
      *   Academic but accessible (graduate seminar level).
      *   Avoid name-dropping without explanation (focus on concepts).
      *   Be critical and analytical, not just descriptive.
      *   Ensure the "reasoning from cases" requirement is met (use the cyclist/commentator case).

  6.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I address the symmetry claim thoroughly? *Adjustment:* Make sure to highlight that while the *logical form* is symmetric, the *explanatory burden* might not be. The Anti-Intellectualist claims the disposition is basic; the Intellectualist claims the disposition is propositional. The regress stops for both, but the Intellectualist still has to explain how the proposition *moves* the body.
      *   *Check:* Did I address the circularity worry on MOPs? *Adjustment:* Explicitly discuss whether "practical" is a substantive property or a label. Suggest that it must be defined functionally (role in action generation) to avoid circularity.
      *   *Check:* Did I avoid telling them to read Stanley & Williamson or Ryle? *Adjustment:* Keep the focus on the arguments provided in the prompt, using the concepts rather than citations.

  7.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on this plan.)
answer: |-
  This is a precise and well-formed set of worries. You have identified the two distinct pressure points in the contemporary debate: the logical validity of the regress argument (the "negative" case against Intellectualism) and the explanatory adequacy of the Intellectualist positive account (the "sufficiency" problem).

  Let us untangle the knot by addressing these in turn, focusing on the conceptual machinery rather than the historiography.

  ### Part I: The Regress and the Symmetry Claim

  Your instructor is correct that Ryle's regress is often wielded too bluntly, but it is worth isolating exactly which premise does the damage and why the symmetry claim holds structurally, even if it feels unsatisfying substantively.

  **1. The Vulnerable Premise**
  Ryle's regress argument relies on a specific conception of how knowledge guides action. We can reconstruct the argument as follows:
  1.  **Intellectualist Thesis:** Knowing how to $F$ is a species of knowing that $p$ (where $p$ is a proposition about the method of $F$-ing).
  2.  **Guidance Premise:** For knowledge-that to guide action intelligently, the agent must *contemplate* or *consider* the proposition $p$ prior to or during the action.
  3.  **Intelligence Premise:** The act of contemplating $p$ is itself an intelligent act (it can be done well or poorly).
  4.  **Regress:** Therefore, contemplating $p$ requires prior knowledge-how (by 1), which requires contemplating a further proposition $p^*$ (by 2), ad infinitum.

  The vulnerable premise is **(2), the Guidance Premise**. This premise assumes that propositional knowledge must be *occurrent* to be effective. It assumes a "homunculus" model of the mind, where a central agent reads the rulebook before moving the limbs.

  **2. The Intellectualist Escape**
  Modern Intellectualists (often following the lead of dispositional epistemology) reject (2). They argue that propositional knowledge can be *dispositional*. A chess master knows that controlling the center is good; she does not recite this proposition before every move. The knowledge is stored in memory and triggers responses without conscious survey.
  *   **Result:** The regress stops because the "application" of the knowledge is not itself an intelligent *act* requiring further knowledge; it is a sub-personal or automatic cognitive process triggered by the situation.

  **3. Evaluating the Symmetry Claim**
  Your instructor argues that whatever stops the regress for the Intellectualist (dispositional knowledge) stops it for the Anti-Intellectualist (dispositional ability).
  *   **The Logic:** The Anti-Intellectualist says knowing-how is a complex disposition. When asked "Why did you turn the handle?", they don't consult a rule; they just act. The Intellectualist says knowing-how is a complex propositional disposition. When asked "Why did you turn the handle?", they don't consult a rule; they just act (guided by the stored proposition).
  *   **The Verdict:** The symmetry claim is **logically sound but explanatorily thin**.
      *   *Why it holds:* Both sides must posit a "bedrock" level of cognitive functioning where guidance happens without infinite prior steps. Both agree that intelligent action does not require occurrent thought.
      *   *Why it feels quick:* It ignores the *nature* of the bedrock. The Anti-Intellectualist posits a brute disposition to act. The Intellectualist posits a brute disposition to retrieve and utilize a *truth*. The regress argument shows that *occurrent* intellectualism fails; it does not show that *dispositional* intellectualism is coherent. It merely shows that if Intellectualism is to survive, it must look structurally identical to Anti-Intellectualism at the point of action execution.

  **Conclusion on the Regress:** The regress successfully kills the claim that skill requires *conscious rule-following*. It does not kill the claim that skill *consists in* propositional knowledge, provided that knowledge is understood dispositionally. The debate therefore shifts from "Does it require thought?" to "What is the format of the disposition?"

  ---

  ### Part II: The Sufficiency Problem (The Commentator Case)

  This is the deeper worry. Even if we grant that knowledge-how is dispositional knowledge-that, we face the **Commentator Problem**: The commentator possesses the true propositions about cycling but lacks the skill. If knowledge-how = knowledge-that, why does the commentator lack knowledge-how?

  The Intellectualist must explain the gap between *possessing the truth* and *being able to act on it*. Let us evaluate the available resources for closing this gap, weighing their costs and regress risks.

  #### Option 1: Practical Modes of Presentation (MOP)
  **The Move:** The Intellectualist argues that the commentator and the rider grasp the *same proposition* (e.g., <one must countersteer>) but under different *modes of presentation*. The rider grasps it under a *practical* mode; the commentator under a *theoretical* mode.
  **The Explanation:** A mode of presentation is a way of thinking about a content. To think of "Paris" as "the capital of France" is different from thinking of it as "the city where I had breakfast." Similarly, to think of "countersteering" practically is to think of it as *something for me to do now*.
  **The Cost:**
  1.  **Circularity Risk:** If "practical mode of presentation" is defined simply as "the mode one has when one knows how," the account is empty. It labels the gap rather than bridging it.
  2.  **Regress Risk:** You noted this: if grasping a practical MOP is itself a skill (a "knowing how to grasp"), we have relocated the regress.
  **Assessment:** This option is viable *only if* "practicality" is defined functionally, not phenomenologically. It cannot mean "thinking about it while feeling an urge." It must mean: *The representation is integrated into the motor-control system in such a way that it directly triggers action.*
  *   **Does it reintroduce regress?** No, provided the "grasping" is not an act but a structural property of the cognitive architecture. If the proposition is stored in a format that interfaces with the motor cortex (practical) versus a format that interfaces with the speech center (theoretical), the difference is architectural, not a further skill.
  *   **Verdict:** This is the strongest Intellectualist move, but it demands a substantive theory of cognitive architecture. It concedes that "knowledge-that" is not enough; it must be "knowledge-that-in-a-motor-ready-format."

  #### Option 2: The Employment/Action Condition
  **The Move:** Knowing how to $F$ requires not just possessing the proposition, but *employing* it in the successful performance of $F$. The commentator possesses the truth but fails the employment condition.
  **The Explanation:** This treats knowledge-how as a success verb. You don't know how unless you can do it. The proposition is the content, but the *ability to execute* is a necessary condition for the knowledge attribution.
  **The Cost:**
  1.  **Conflation:** This risks collapsing the distinction between *knowledge* and *ability*. If I break my leg, I retain the knowledge-how (intuitively) but lose the ability to employ it. If employment is necessary for the knowledge itself, the injured expert loses their knowledge.
  2.  **Regress Risk:** If "employing the proposition" is an intentional action guided by knowledge, we are back to Ryle's regress. How do I employ the proposition? Do I need to know how to employ it?
  **Assessment:** To save this, the Intellectualist must distinguish *possession* from *exercise*. They can say the commentator lacks the *disposition to employ* the proposition.
  *   **Does it reintroduce regress?** Only if "employing" is treated as a separate step. If "employing" is just the manifestation of the disposition (the riding itself), there is no regress. But this makes the view look very much like Anti-Intellectualism: "Knowing how is having a disposition to act." The Intellectualist adds: "...which is constituted by propositional states."
  *   **Verdict:** This saves the intuition about the injured expert (they have the disposition, even if masked) but struggles to explain *why* the commentator lacks the disposition if they have all the same propositions. It pushes the problem back to: Why doesn't the truth *cause* the disposition in the commentator? (See Option 1).

  #### Option 3: Restricting the Propositions (The "Way" Constraint)
  **The Move:** The commentator knows *that* countersteering works. But knowing how requires knowing *the way* to $F$ that is available to the agent. The propositions must be indexical or agent-relative (e.g., "This is how *I* move *my* body").
  **The Explanation:** The commentator knows third-person truths ("The rider leans left"). The rider knows first-person truths ("I lean left").
  **The Cost:**
  1.  **The Gap Remains:** A commentator could memorize all first-person truths ("When I am on a bike, I must lean left"). They still couldn't ride. Knowing the truth about one's own body is not the same as motor control.
  2.  **Explanatory Power:** This restricts the *content* but doesn't explain the *access*. Why does the first-person truth guide the muscle while the third-person truth does not?
  **Assessment:** This is insufficient on its own. It clarifies the content but ignores the functional role.
  *   **Verdict:** Weak. It addresses the content of the knowledge but not the mechanism of guidance.

  #### Option 4: Concede the Gap (Primitive Guidance)
  **The Move:** Admit that propositional knowledge requires a primitive, unanalyzable relation to action to count as "practical knowledge."
  **The Explanation:** There is a brute fact that some propositional states guide action and others (like the commentator's) do not. This is a fundamental feature of the mind.
  **The Cost:**
  1.  **Theoretical Retreat:** This abandons the reductive ambition of Intellectualism. If the link between proposition and action is primitive, why not just say the ability itself is primitive (Anti-Intellectualism)?
  2.  **Mystery:** It leaves the "guidance" mechanism as a black box.
  **Assessment:** This is the "Hail Mary." It stops the regress by fiat but offers no insight.
  *   **Verdict:** Philosophically expensive. It makes Intellectualism less parsimonious than Anti-Intellectualism.

  ---

  ### Part III: Synthesis and Resolution

  You asked for a reasoned conclusion based on the concepts and cases. Here is the diagnosis of the knot.

  **1. The Real Disagreement is About Guidance, Not Regress**
  The regress argument is a distraction. Both sides agree that intelligent action does not require occurrent thought. The real disagreement is about the **format of the guidance mechanism**.
  *   **Anti-Intellectualist:** The guidance mechanism is a brute disposition. It needs no semantic content to work.
  *   **Intellectualist:** The guidance mechanism is a semantic content (a proposition) playing a functional role.

  **2. The Commentator Case Exposes the "Interface Problem"**
  The commentator case shows that *truth* is not sufficient for *action*. You can have the map (proposition) without the vehicle (motor control).
  The Intellectualist's best resource is **Option 1 (Practical MOP)**, but it must be fleshed out carefully to avoid your circularity worry.
  *   **How to avoid circularity:** Do not define "practical MOP" as "the way you think when you know how." Define it functionally: A practical MOP is a representation that is *causally hooked up to the motor system* in the right way.
  *   **The Cost:** This concedes that "knowledge-that" in the abstract is not enough. It must be "knowledge-that-embedded-in-a-practical-cognitive-architecture."
  *   **Does this collapse into Anti-Intellectualism?** It comes close. If the defining feature of knowledge-how is that the representation is hooked to the motor system, the Anti-Intellectualist asks: "Why call it knowledge-that at all? Why not just call it a motor disposition?"
  *   **The Intellectualist Reply:** Because the disposition is *sensitive to truth*. If the proposition <lean left> becomes false (e.g., the bike is reversed), the skilled rider's disposition changes. A brute disposition (like a reflex) might not track truth changes in the same way. The rider adjusts because they represent the world *as being a certain way*.

  **3. The Verdict on the Symmetry and the Gap**
  Your instructor's symmetry claim is correct regarding the **regress**: both sides need a dispositional stopper.
  However, the symmetry breaks regarding the **sufficiency problem**.
  *   The Anti-Intellectualist has an easier time with the Commentator: The commentator lacks the disposition. Full stop. No need to explain why the propositions don't work, because propositions aren't the engine.
  *   The Intellectualist has a harder burden: They must explain why the commentator's propositions are "inert."

  **Conclusion:**
  The Intellectualist can escape the regress, but only by adopting a view of propositional knowledge that is far more robust than standard epistemology allows. They must argue that **knowledge-that is not merely a relation to a truth, but a relation to a truth that plays a specific causal role in action generation.**

  If they make this move:
  1.  **The Regress is stopped:** Because the causal role is dispositional, not occurrent.
  2.  **The Commentator is excluded:** Because their propositions play a speech/assertion role, not a motor role.
  3.  **The Cost:** The view becomes vulnerable to the charge that it is merely a verbal variant of Anti-Intellectualism. If "knowing-that" requires "being able to use it in action," then "knowing-that" presupposes "knowing-how."

  **Final Assessment:**
  The knot untangles if you recognize that the Intellectualist is not trying to reduce *skill* to *book learning*. They are trying to show that *skill* has a *propositional structure*.
  *   **Does the regress hold?** No, not against dispositional intellectualism.
  *   **Is the symmetry claim true?** Yes, regarding the structure of the stopper, no regarding the explanatory burden.
  *   **Is the Sufficiency Problem fatal?** Only if Intellectualism insists on a "thin" notion of knowledge-that (mere true belief). If they adopt a "thick" notion (true belief integrated into practical reasoning systems), they can distinguish the rider from the commentator.
  *   **The Remaining Worry:** The "thick" notion risks making the theory trivial. If "knowing-that" just means "having the right brain state that causes successful action," we have lost the distinctively *epistemic* flavor of Intellectualism.

  The most stable position is likely a **hybrid**: Knowing-how involves propositional knowledge, but that knowledge is constituted partly by the agent's ability to deploy it. This admits that the gap between the commentator and the rider is not just a gap in *content*, but a gap in *capacity*. The Intellectualist wins if they can show that the capacity is *constituted* by the grasp of the truth, rather than the truth being a mere accompaniment to the capacity. If they cannot show that, the Anti-Intellectualist wins by parsimony: the truth is an accompaniment, not the essence.
