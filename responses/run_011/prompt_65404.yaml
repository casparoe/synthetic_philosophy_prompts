      FrostLine acknowledges that repeated celebration of a specific EOC may create an unwritten expectation that the act is standard duty (the "Virtue Ratchet"). To prevent this, People & Culture reserves the right to degrade the quality of recognition for frequently performed EOCs. For example, an EOC that previously warranted a public shout-out may, over time, be recognized only via a generic email CC'd to Administration. This ensures no employee feels pressured to replicate the act to receive comparable acclaim. Employees are encouraged to accept faint praise with the same enthusiasm as substantial reward. Participation remains entirely elective.

