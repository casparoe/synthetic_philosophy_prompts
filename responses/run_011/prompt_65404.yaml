  **Q: May a manager ask an employee to donate a kidney to a colleague?**
  A: No. Organ donation is a personal medical decision outside the scope of employment. A manager may not ask, suggest, or inquire about an employee's organ donor status.

  **Q: Does the answer change if the firm offers a reserved parking space?**
  A: Yes. If a reserved parking space is offered as a Spirit Point redemption item unrelated to the donation, the offer remains permissible provided the parking space is not presented as compensation for the organ. The distinction relies on the employee's internal motivation, which People & Culture will assess via post-redemption interview.

