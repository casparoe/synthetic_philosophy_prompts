  **SECTION 14: GOING ABOVE AND BEYOND**

  **14.1 Definition of Extra-Ordinary Contribution.**
  FrostLine Logistics defines an Extra-Ordinary Contribution (EOC) as any action taken by an employee that exceeds the reasonable expectations of their role description while aligning with Core Values. It is the policy of FrostLine that EOCs are strictly voluntary. No employee is obligated to perform an EOC, nor may any manager imply that failure to perform an EOC will impact performance reviews, compensation, or continued employment. We encourage all team members to consider where they might stretch, provided such stretching does not become expected. Participation in the EOC program remains entirely elective.

  **14.2 The Spirit Ledger.**
  To recognize EOCs, FrostLine utilizes the Spirit Ledger, a points-based acknowledgment system. Employees earn Spirit Points for verified EOCs, redeemable for branded merchandise, breakroom privileges, or preferred shift selection. FrostLine wishes to clarify that Spirit Points do not constitute wages, bonuses, or taxable income, as exchanging currency for virtue would reclassify the act as duty. Therefore, points are awarded only after a determination that the act was not performed *for* the points. Employees suspected of performing EOCs primarily to accumulate points may have those points withheld to preserve the moral integrity of the transaction. Managers are instructed to observe enthusiasm levels during point redemption to ensure altruism remains the primary motivator. Participation remains entirely elective.

  **14.3 Baseline Calibration.**
  To ensure an act truly exceeds duty, FrostLine must establish the employee's personal baseline cost. An act involving minimal sacrifice for one employee may constitute significant hardship for another. Accordingly, employees wishing to submit EOCs must complete Form 14-B (Personal Capacity Audit), disclosing current debt load, dependents, health restrictions, and commute distance. This data allows People & Culture to weight the EOC appropriately; for example, staying late carries more virtue for an employee with a ninety-minute commute than for one residing in corporate housing. Submission of Form 14-B is voluntary; however, uncalibrated EOCs cannot be entered into the Spirit Ledger. Access to tax returns and medical notes may be requested to verify hardship claims. Participation remains entirely elective.

  **14.4 Recognition Dilution Protocol.**
  FrostLine acknowledges that repeated celebration of a specific EOC may create an unwritten expectation that the act is standard duty (the "Virtue Ratchet"). To prevent this, People & Culture reserves the right to degrade the quality of recognition for frequently performed EOCs. For example, an EOC that previously warranted a public shout-out during the All-Hands meeting may, over time, be recognized only via a generic email CC'd to Administration. This ensures no employee feels pressured to replicate the act to receive comparable acclaim. Employees are encouraged to accept faint praise with the same enthusiasm as substantial reward. If an act becomes ubiquitous, it will be reclassified as Duty, and points will cease. Participation remains entirely elective.

  **14.5 Sub-Optimal Volition.**
  Concurrent with EOCs, FrostLine recognizes a category of conduct termed "Sub-Optimal Volition" (SOV). SOV refers to actions that are permitted by policy but fall beneath the dignity of a FrostLine team member, such as clocking out exactly on time during a crisis, utilizing all allocated sick leave, or declining to answer emails after 8:00 PM. While SOV carries no formal demerit, employees engaging in SOV may be invited to optional wellness conversations regarding their alignment with FrostLine values. These conversations are supportive, not corrective. No employee is obligated to avoid SOV. Participation remains entirely elective.

  **14.6 The Sustainability of Excellence.**
  FrostLine monitors employees who accumulate excessive Spirit Points to prevent burnout. In the case of Mark T. (Toledo Cold Storage), whose consistent EOCs resulted in the depletion of his personal hobbies and conversational topics, People & Culture intervened to restrict his ability to volunteer. An employee who possesses no outside interests cannot perform acts that sacrifice them. Therefore, high-performing volunteers may be mandated to engage in leisure activities. This mandate is not a punishment but a wellbeing safeguard. Mark T. is currently required to attend two hours of weekly non-work-related socialization. Participation remains entirely elective.

  **14.7 Declination of Acknowledgment.**
  Employees may file Form 14-C to decline public praise for an EOC. Filing Form 14-C is itself considered an EOC, as it demonstrates humility. Consequently, managers may not ask an employee to file Form 14-C, nor may they suggest that filing it would be beneficial. Employees who decline praise may be recognized for their modesty via the Spirit Ledger, unless they have also filed Form 14-C regarding modesty recognition. People & Culture reserves the right to praise the declination privately if public praise is refused. Participation remains entirely elective.

