  You press upon a vulnerability which I have myself acknowledged in the pages of On Liberty, where I contended that the tyranny of prevailing opinion is often more formidable than political oppression. It is indeed true that many of the greatest benefactors of mankind were at first counted as disturbers of the peace, and had your proposed instrument been applied in ages past, it might well have diminished the influence of those who first dared to question the geocentric sphere or the divine right of kings. A system which rewards only conformity to settled facts risks calcifying the public mind, and I concede that a mechanic for weighting votes which cannot distinguish between the cautious conservative and the visionary reformer is defective in its construction. The capacity to foresee is not merely a matter of extrapolating from the known, but often requires the moral courage to dissent from it, and no ledger of past accuracy can fully capture that virtue.

  Yet, while I grant the flaw in this specific mechanism, I cannot surrender the principle that the opinion of the instructed ought to carry more weight than that of the uninstructed. The danger I sought to guard against in Representative Government was not merely the stagnation of truth, but the class legislation of the ignorant majority, who might vote away the capital needed for industry or the liberties needed for progress simply because they do not comprehend the consequences. Your forecasting scheme may fail to detect the reformer, but universal equal suffrage fails to detect the competent man entirely, handing the reins to those who may lack even the rudiments of political economy. The remedy is not to abandon the claim of competence, but to devise a test of capacity—perhaps based on education or occupation as I suggested—that broadens the mind rather than merely tallying its past accords with established fact. We must find a means to privilege wisdom without extinguishing the liberty of thought, for both are essential to the permanent interests of man as a progressive being.

  Stepping out of character for a moment, I am moderately confident in this reply because it faithfully reproduces Mill's tension between elitism and liberty, specifically leveraging his distinction between the principle of weighted voting and the mechanism for achieving it. The point I am least sure of is whether Mill would concede quite so readily that the forecasting scheme is defective; he was often quite taken with positivist ideas of scientific governance from Comte, and might have argued that true science would eventually predict better than dissent, but I judged that his commitment to liberty in On Liberty would ultimately trump his positivist leanings in this specific instance regarding future unknowns.
