      *   **Q6: Rational Expectations Defender's Concessions:**
          *   *Concede:* Noise traders exist. Liquidity needs exist. Common knowledge is an idealization.
          *   *Wave Off:* The *margin* is still rational. Prices still aggregate the *sum* of information, even if volume is noisy. Prediction markets work *despite* the volume, not because of it.

      *   **Q7: Falsifiability:**
          *   *Risk:* "Volume is high = breakdown." "Volume is low = illiquidity." This is unfalsifiable.
