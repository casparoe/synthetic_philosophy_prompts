          *   *Catch:* This model *requires* liquidity traders (non-epistemic volume). If the user defines "epistemic volume" as *all* volume, the model contradicts them. If the user admits liquidity volume is necessary for price discovery, they concede the standard point.
          *   *Pure Speculative Model:* Can you get volume with *only* informed traders and common priors? No (Milgrom-Stokey). So the user is right *if* liquidity needs are netted out.

