  6.  **Final Polish:** Check against the prompt's specific constraints (no summary of both sides, stress test focus, ranking). Ensure the distinction between "epistemic breakdown" and "heterogeneous information" is clear. (Milgrom-Stokey allows heterogeneous information, just not heterogeneous priors + common knowledge of rationality).

