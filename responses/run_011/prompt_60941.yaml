      *   *My Commitment:* I need to distinguish them. The difference is *independent access*. In cosmology, we have independent physical reasons to think thermal fluctuations produce disordered brains (stat mech). In EAAN, the link between "survival value" and "truth" is contested; truth *often* aids survival.
