  She was a Quinean to her bones. She denied there was a determinate fact about whether her central entries were right. Some people think this means the work was lonely. They think it means we can never know another mind. They think it is poignant to chase meanings that were never there to be caught. She would have stood up and corrected that from the coffin. That is a misreading. It turns her rigor into a tragedy. It suggests she failed because the world was vague. She did not think she failed. She thought the world was real, and that our words were tools to navigate it. If there was no final fact, what was the dictionary answerable to? Something was. She was merciless about it. She made students recollect elicitation sessions years later. She would reject an entry on the basis of a single frown from one of the elders. She knew that a frown was data. She knew that a hesitation was a boundary. She treated every pause as a warning sign. She did not want a book that looked perfect. She wanted a book that would not lead anyone astray.

  Here is the truth. The dictionary was answerable to the continuity of life in the valley. It was answerable to the possibility of the next question. She did not need the meaning to be fixed in the sky. She needed the use to be reliable on the ground. The indeterminacy was not a failure. It was the space where the relationship lived. If she claimed too much certainty, she would have broken the trust required to ask the next question. If she claimed too little, she would have had no reason to write the book at all. She walked the line between them for forty years. She was answerable to the people who let her stay. She was answerable to the future students who would need to know where the path held firm and where it washed out. She was answerable to the standard of usefulness that allows strangers to live together without lying.

  I need to speak directly to the three men who flew here from the valley. You taught her how to listen. When she wrote down *tiruké*, she was writing down what you gave her. She knew the words could shift. She knew the world could shift. But she knew that when you spoke, she had to answer with care. This book belongs to you because you kept speaking when she was learning how to hear. We thank you for letting her walk beside you for forty years.

  She did not chase meanings that were never there. She built a bridge that held weight. The entries are not perfect mirrors. They are tools that worked. She leaves us the work. She leaves us the argument. She leaves us the responsibility to keep asking. We will not settle it for her. We will not pretend it is settled. We will keep revising the entry. That is how we honor her. That is how we keep the bridge standing. We will not stop arguing. We will not stop listening. We will not stop writing it down. This room is full of people who learned from her how to disagree. That is her legacy. It is not a set of answers. It is a method of questioning. It is a way of standing in the river valley and knowing that the water moves, but the ground remains.

