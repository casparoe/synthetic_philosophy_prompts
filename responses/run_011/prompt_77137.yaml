  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Make sure the follow-ups aren't just restatements. They need to corner her on the "smuggling" move.
      *   *Check:* Ensure the Liar question addresses *what fixes propositionhood*.
      *   *Check:* Ensure the Self-Application question addresses the *disagreement with correspondence theorists*.

      *(Self-Correction on Q4)*: Make sure the foreign language aspect is clear. If I don't speak Urdu, how do I know "Urdu sentence S is true iff S"?
