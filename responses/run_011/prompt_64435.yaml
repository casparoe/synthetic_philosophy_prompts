      *   *Coupling:* I need to be honest. There is no general coupling theorem in social science. But the *search* for structural parameters (Haavelmo, Cowles) is essentially a search to make assumptions portable. If that program succeeds fully, the user's distinction vanishes.

  7.  **Final Polish:**
