answer: |-
  Here is the diagnosis, the attack on your hunch, and the way forward for the seminar.

  ### The Diagnosis: It is (4), masked as (2), hiding a stake in (1).

  Your hunch is that this is purely verbal (2): a boundary dispute over the extension of the word "moral." You are half-right, but your diagnosis is unstable for the exact reason you feared: **there is no neutral metalanguage.**

  If you claim it is merely verbal, you are implicitly accepting one definition as the standard against which the "verbal" divergence is measured. In your seminar, that standard is almost certainly the Turiel/Developmental paradigm (harm/fairness, authority-independent). If you treat *that* definition as the neutral baseline, you have already conceded the substantive point (1) to the liberals. You are effectively saying, "Conservatives are using the word 'moral' incorrectly according to the liberal definition."

  But as Shweder noted, the Turiel definition is not a discovery of human nature; it is a cultural accomplishment of secular liberal individualism. Therefore, treating the disagreement as merely verbal privileges the liberal conceptual scheme as the "real" morality and relegates the conservative scheme to "terminological confusion."

  **The actual shape is (4): The two camps are answering different questions under one heading.**
  *   **The Liberals (Turiel/Nucci tradition)** are asking a **Deontic Question**: *What obligations hold regardless of authority or social context?* They are looking for the logic of justification.
  *   **The Conservatives/Haidt** are asking a **Sociological Question**: *What norms effectively bind groups and trigger condemnation?* They are looking for the mechanics of social cohesion.

  Haidt's data tracks *condemnation* and *emotional response*. The liberals' objection tracks *justifiability* and *authority-independence*. When a liberal says "Purity isn't moral," they mean "You cannot justify punishing a purity violation without referencing a specific authority or tradition." When Haidt says "Purity is moral," he means "People react to purity violations with the same emotional intensity as harm violations."

  They are not disagreeing about the data. They are disagreeing about whether *emotional intensity* or *authority-independence* is the criterion for the label "moral."

  ### Attacking Your Hunch

  You want to say it's (2) all the way down to avoid the metaphysical swamp of (1). But you cannot sustain (2) without smuggling in (1).

  To call a disagreement "verbal" is to claim that both parties agree on the facts but differ on the label. But here, they do not agree on the facts of *what morality is*.
  *   If morality is defined by **function** (binding groups), then Purity is moral.
  *   If morality is defined by **form** (universalizability/non-contingency), then Purity is convention.

  By calling this "verbal," you are suggesting we could solve this by stipulating new terms (e.g., "Let's call Purity 'ethics' and Harm 'morality'"). But the parties won't accept this. Why? Because the liberal side insists that if it doesn't meet the *form* criteria, it lacks *normative force*. They aren't just protecting a word; they are protecting a claim about **obligation**.

  If you tell a liberal, "Okay, Purity isn't 'moral' by your definition, but it's 'moral' by the conservative definition," the liberal will reply: "Then the conservative definition is useless for determining what we *ought* to do."

  Your hunch fails because it treats "moral" as a bucket we are trying to fill correctly. In reality, "moral" is a tool. Liberals use the tool to protect individuals from the group. Conservatives use the tool to protect the group from individuals. Calling this a "verbal dispute" ignores that the tools are designed for opposite architectural loads.

  ### What Counts as Progress?

  Given Diagnosis (4), progress is not a measurement that breaks the tie. There is no "morality-o-meter" that can tell us whether authority-independence or emotional binding is the *true* essence of morality.

  **Progress is a Distinction that Dissolves the Tie.**
  You need to force the seminar to separate **Moral Psychology** (the study of what triggers the *sense* of obligation/condemnation) from **Moral Philosophy** (the study of which obligations are *justifiable*).

  1.  **Stop asking:** "Is Purity a moral foundation?"
  2.  **Start asking:** "Does coding Purity as moral produce social outcomes that are justifiable?"

  This shifts the debate from **Ontology** (What *is* morality?) to **Pragmatics** (What does calling something 'moral' *do*?).

  **The Measurement that would help:**
  Design an instrument that dissociates *condemnation* from *authority-independence*.
  *   *Item A:* "Is it wrong to kick a dog?" (Harm)
  *   *Item B:* "Is it wrong to wear a uniform incorrectly?" (Authority/Purity)
  *   *Crucial Follow-up:* "If the President/Principal said it was okay, would it still be wrong?"

  You will find Liberals say "Yes" to A and "No" to B. You will find Conservatives say "Yes" to A and often "Yes" to B (or "It depends on the role").
  This proves they aren't just using the word "moral" differently; they have different **criteria for validity**. Progress is acknowledging that Haidt has discovered a *psychology of taboo*, while the liberals are defending a *philosophy of rights*. They are both right about their own domain, but wrong to claim their domain exhausts the other.

  ### The Normative Question (The "Last Thing")

  This is the crux for your students. If your diagnosis is (2) [or my refined (4)], does psychology bear on who is *right* about morality?

  **The Short Answer:** It kills the question of "Who is right about The Moral Truth," but it resurrects the question of "Which Moral System is Viable."

  **The Detailed Argument:**
  If morality is a natural kind (like "water"), psychology could tell us who sees it clearly. If morality is a functional construct (like "money"), psychology tells us how the system operates, but not whether the currency is "valid."

  1.  **If you accept the Liberal Definition (Form):** Psychology is irrelevant to the normative question. The fact that conservatives *feel* purity is moral doesn't make it moral, any more than feeling the earth is flat makes it flat. The normative question is settled by philosophy (reasons), not psychology (feelings).
  2.  **If you accept the Haidt Definition (Function):** Psychology *is* normative. If morality is what binds groups, and purity binds groups, then purity is moral. But this reduces morality to sociology.

  **The Seminar Solution:**
  Tell your students that psychology cannot solve the **Justification** problem, but it can solve the **Trade-off** problem.

  *   **Psychology shows:** Treating Purity as moral increases group cohesion but increases out-group hostility and internal repression. Treating Harm/Fairness as moral increases individual liberty but risks social fragmentation.
  *   **Normative conclusion:** You cannot ask "Which one is *really* moral?" You must ask "Which costs are we willing to pay?"

  This does not kill the normative question; it matures it. It moves the students away from asking "Is the conservative *wrong*?" (which implies a view from nowhere) to "Is the conservative *trade-off* acceptable to us?"

  **Summary for the Room:**
  The disagreement isn't about whether conservatives perceive something liberals don't (1). It isn't just about a dictionary definition (2). It's that liberals are playing **Chess** (rules-based, universal) and conservatives are playing **Rugby** (binding-based, territorial), and Haidt is measuring the **heart rates** of the players and calling it the rules of the game.

  Progress comes when you stop asking which game is "True Sport" and start asking which game produces the society you want to live in. Psychology informs the consequences; Philosophy decides the value.
