prompt: |-
  I co-teach a grad seminar with a moral psychologist and we've spent three weeks going round in circles on something where I now suspect nobody in the room can say what the arguement actually is. Here's the knot. Haidt's questionnaire keeps coming back with the same pattern: conservatives endorse the "binding" stuff — loyalty, deference to authority, purity — considerably more than liberals, and liberals then insist those things aren't moral at all, they're convention, etiquette, taste, tribalism dressed up as obligation. Both camps are sincere and neither budges. What kind of disagreement is that, exactly?

  Three diagnoses circulate and people slide between them mid-sentence without noticing:

  1. It's substantive. There really are moral requirements about loyalty, rank, and contamination; liberals are blind to a chunk of the moral landscape; the scores track a genuine difference in what people can perceive, not in how they talk.

  2. It's verbal. The two sides are drawing the boundary of "moral" in different places. One inherits the harm-and-fairness carve-out that developmental psychologists spent forty years treating as the signature of the moral domain — serious, generalizable, not up for grabs by an authority figure — and the other applies the word to a much wider slice of conduct. No difference in psychology, just different extensions.

  3. It's methodological. The real fight is over which responses count as evidence of a moral judgment: self-reported relevance, third-person condemnation, deserved punishment, seriousness ranking, whether people think an authority could permit it. Different instruments, different verdicts, and the two sides are comparing across measures that were never commensurable.

  My hunch, which I want you to attack rather than flatter, is (2) all the way down — that a lexical boundary question has been masquerading for twenty years as a discovery about human nature. But I can see the problem: the moment you ask whether the harm-and-fairness boundary is itself just a local cultural accomplishment rather than a finding, which is roughly the line Shweder pushed against the developmentalists, diagnosis (2) loses the neutral meaning of "moral" it was leaning on, and it seems to collapse back into (1).

  So: diagnose it. Is the shape (1), (2), (3), some ordered combination, or a fourth thing — e.g. the two camps answering different questions under one heading, one about the causes of condemnation and one about the justification of principles? Argue from what each side actually says and does with its data, not from a survey of the field. Then tell me what would count as progress given your diagnosis: a measurement that would break the tie, a distinction that dissolves it, or a reason to expect no resolution ever and why that isn't just defeatism.

  Last thing, and it's the one I most need for the seminar. If your diagnosis is (2), does that reopen the normative question — whether any of this psychology bears on who is right about morality — or does it kill that question permanently? I genuinely can't tell which, and my students have noticed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Co-teaches a grad seminar with a moral psychologist. They are stuck in a theoretical knot regarding Haidt's Moral Foundations Theory (MFT) and the liberal/conservative divide on "binding" foundations (loyalty, authority, purity).
      *   **The Problem:** Liberals say binding foundations aren't *moral* (just convention/tribalism); Conservatives say they *are* moral. Haidt's data shows conservatives endorse them more.
      *   **The Three Diagnoses:**
          1.  *Substantive:* Liberals are blind to real moral facts.
          2.  *Verbal:* Different definitions of "moral."
          3.  *Methodological:* Different measurement tools yield different results.
      *   **User's Hunch:** It's (2) all the way down (lexical boundary masquerading as discovery).
      *   **User's Worry:** If the harm/fairness boundary is itself cultural (Shweder's critique), then (2) collapses into (1) because there's no neutral ground for the definition.
      *   **The Task:**
          1.  Diagnose the disagreement (1, 2, 3, combo, or 4th option).
          2.  Argue from what the sides *say and do* with data (not just literature review).
          3.  Define what "progress" looks like based on that diagnosis.
          4.  Address the normative question: If it's (2), does psychology bear on who is *right* about morality, or does it kill that question?
      *   **Constraint:** "Attack rather than flatter" the user's hunch.

  2.  **Deconstruct the Diagnoses:**
      *   *(1) Substantive:* Implies moral realism. Conservatives see more truth. Liberals are morally myopic. Haidt often leans this way rhetorically (liberals are "mutants," need to understand conservatives to govern them).
      *   *(2) Verbal:* Implies conceptual analysis. "Moral" is a label. Liberals use a narrow label (Turiel's paradigm); Conservatives/Haidt use a broad label. The conflict is about word usage, not underlying psychology or reality.
      *   *(3) Methodological:* Implies measurement error. Are we measuring *judgments* or *emotions*? Self-report vs. behavioral?
      *   *(4) The "Different Questions" Hypothesis:* One side asks "What causes condemnation?" (Psychology/Sociology), the other asks "What principles are justified?" (Normative Ethics).

  3.  **Evaluate the User's Hunch (Diagnosis 2):**
      *   The user thinks it's verbal.
      *   *The Trap:* As the user notes, if the "harm/fairness" definition is just *another* cultural artifact (Shweder's point), then calling it a "definition" privileges the liberal/WEIRD view as the neutral standard. If "moral" is defined by harm/fairness, then purity *by definition* isn't moral. But if that definition is culturally specific, then asserting it as the definition is just asserting liberal cultural dominance. This makes (2) look like (1) in disguise.
      *   *My Counter-Argument:* It's not *just* (2). It's a hybrid of (2) and (4). It's verbal *and* functional. The disagreement isn't just about the word "moral"; it's about the *function* of moral discourse. Liberals treat morality as a tool for protecting individuals (harm/fairness). Conservatives (and Haidt) treat morality as a tool for binding groups (order/cohesion).
      *   *Refining the Diagnosis:* It is a **Functional-Conceptual Mismatch**. It looks verbal (2), but it rests on a deeper disagreement about what morality *does* (4). It's not just "where do we draw the line," it's "what is the line for?"

  4.  **Develop the Argument (Attacking the Hunch):**
      *   *Why (2) is insufficient:* If it were purely verbal, we could just stipulate terms ("Let's call binding values 'ethics' and harm values 'morality'") and move on. But the stakes feel higher. Why? Because both sides claim their definition tracks *reality* (either psychological reality or normative reality).
      *   *The Collapse into (1):* The user is right to worry. If you say "Liberals define morality as harm," you are implicitly accepting the Turiel/WEIRD framework as the arbiter. If Shweder is right, that framework is local. So, claiming it's "just verbal" privileges the liberal definition as the standard against which the verbal dispute is measured.
      *   *The Better Diagnosis:* It is a **Category Error regarding Function**.
          *   Liberals (Turiel/Nucci tradition): Morality = Prescriptions regarding justice/rights/welfare (Non-contingent, generalizable).
          *   Conservatives/Haidt: Morality = Prescriptions regarding social order/cohesion (Binding, often contingent on role/status).
          *   The conflict: Haidt measures *emotional response to norm violation* (Psychology of condemnation). Liberals measure *justifiability of punishment independent of authority* (Philosophy of obligation).
          *   So, it's Diagnosis (4): One side is doing descriptive psychology of *taboo*, the other is doing normative analysis of *obligation*. They are talking past each other because they are studying different phenomena under the same label.

  5.  **Address "Progress":**
      *   If it's a Functional Mismatch, progress isn't finding the "true" definition.
      *   Progress = Disambiguation. Stop using "Moral" for both.
      *   Proposal: Distinguish **Morality of Rights** (Liberal) vs. **Ethics of Community** (Conservative/Shweder).
      *   Measurement: Don't ask "Is this moral?" Ask "Is this wrong *even if no one gets hurt*?" vs. "Does this threaten the group's integrity?"
      *   Resolution: Acknowledge that Haidt found a difference in *social ontology*, not necessarily *moral truth*.

  6.  **Address the Normative Question (The "Last Thing"):**
      *   *If it's (2) [Verbal]:* Does psychology bear on who is right?
      *   *Standard View:* Is/Ought gap. Psychology describes, ethics prescribes. So psychology kills the normative question.
      *   *Nuanced View:* If the concept of "moral" is functionally tied to human flourishing (naturalism), then psychology *might* bear on it.
      *   *My Stance:* If it's a Functional Mismatch, psychology *dissolves* the normative claim that one side is "blind." It shows they are playing different games.
      *   *Answer:* It kills the question of "Who is right about *The* Moral Truth" because there is no single "Moral Truth" container. But it opens the question: "Which functional system better achieves the goals we want (e.g., individual liberty vs. social cohesion)?"
      *   *Crucial distinction:* Psychology cannot tell you if Purity is *really* moral. But it can tell you that treating Purity as moral has specific social consequences (cohesion vs. exclusion).
      *   *Advice for Seminar:* Don't ask "Is purity moral?" Ask "What happens when we treat purity as moral?"

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, rigorous, direct, slightly provocative (as requested: "attack rather than flatter").
      *   *Structure:*
          1.  Direct Diagnosis (Rejecting pure 2).
          2.  The Argument (Why 2 collapses, why 4 is better).
          3.  What Progress Looks Like (Disambiguation).
          4.  The Normative Question (Is/Ought vs. Functional Pragmatics).
      *   *Key Insight to emphasize:* The Turiel Criterion (authority-independence) is the hidden weapon. Liberals use it to exclude purity. Haidt ignores it to include purity. This isn't just verbal; it's a clash of *criteria for moral validity*.

  8.  **Refining the "Attack" on the Hunch:**
      *   User says: "It's (2) all the way down."
      *   My counter: It's (2) only if you accept the Liberal definition as the neutral baseline. If you do that, you've already lost the argument against the Conservative/Haidt view. You can't say "It's just a definition" when the definition itself is the contested territory.
      *   Therefore, it's not *just* verbal. It's a clash of **Normative Functionalism**.
      *   Actually, let's push harder. It is a **Category Mistake**. Haidt is measuring *sociological functionality* (what binds groups) and calling it *moral psychology*. Liberals are measuring *deontic logic* (what entails obligation) and calling it *moral psychology*.
      *   So, Diagnosis 4 is the strongest. "Different questions under one heading."

  9.  **Final Polish on the Normative Question:**
      *   If it's verbal/functional, does psychology bear on who is right?
      *   No, not on "rightness." But yes on "viability."
      *   The seminar needs to move from "Is this moral?" to "What work is this concept doing?"
      *   This saves the normative question from being killed, but transforms it from Metaphysics to Pragmatics.

  10. **Review against constraints:**
      *   Did I attack the hunch? Yes (argued 2 is unstable).
      *   Did I argue from what sides *do*? Yes (Turiel criteria vs. Haidt surveys).
      *   Did I address progress? Yes (Disambiguation).
      *   Did I answer the normative question? Yes (Transforms it to pragmatics).

  11. **Final check of the "Shweder" point:** The user worries that if the harm/fairness boundary is cultural, (2) collapses to (1). I need to validate this. Yes, if the definition is local, asserting it as *the* definition is asserting local superiority. That makes it substantive (1). So (2) is only viable if we treat "moral" as a functional placeholder, not a natural kind. I will argue for the functional placeholder view.

  12. **Constructing the Output:** (Mental outline of the response)
      *   **Diagnosis:** It's not (2). It's (4) with a hidden (1). It's a **Functional Incommensurability**.
      *   **The Attack:** Your hunch fails because "verbal" implies a neutral metalanguage. There isn't one. The Turiel criterion is a normative claim disguised as a definition.
      *   **Evidence:** Look at the instruments. Turiel asks "Could authority permit this?" Haidt asks "Does this disgust you?" Different phenomena.
      *   **Progress:** Stop asking "Is it moral?" Start asking "What is the cost/benefit of coding this as moral?"
      *   **Normative:** Psychology doesn't solve "ought," but it reveals the *price* of the ought. It shifts the debate from Truth to Trade-offs.

      *(Self-Correction during drafting)*: Keep it tight. Don't get lost in MFT history. Focus on the logic of the disagreement as presented in the prompt. Ensure the distinction between *condemnation* (psych) and *justification* (ethics) is clear.

