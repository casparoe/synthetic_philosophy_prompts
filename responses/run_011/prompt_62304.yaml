answer: |-
  Here is an argument constructed to support your thesis, designed for inclusion in a dissertation theory chapter. It adopts the academic tone appropriate for archaeological anthropology, distinguishes consensus from contention, and rigorously tests your claim against the demographic objection.

  ***

  ### The Unit of Analysis as the Hidden Variable in Collapse Theory

  The polarisation between "collapse" theorists, following Joseph Tainter, and "transformation" sceptics, represented by Guy Middleton, Norman Yoffee, and collaborators, is frequently presented as a substantive disagreement about historical reality. Tainter defines collapse as a rapid, significant loss of an established level of sociopolitical complexity. The sceptics counter that this definition privileges elite institutions, arguing that what looks like collapse from the palace is often merely reorganisation from the village.

  Your thesis posits that this is not a substantive disagreement about the past, but a conceptual divergence regarding the *explanandum*. The contradiction is an artefact of two different units of analysis being described with the single lexical item "society." Tainter's unit is the **polity-as-fiscal-system**; the sceptics' unit is the **population-as-cultural-practice**. When these units are made explicit, the debate shifts from "Did collapse happen?" to "Which unit's trajectory are we tracking?"

  To demonstrate that this is not merely semantic relabelling but a move that does analytical work, we must show that fixing the unit alters what counts as relevant evidence and what constitutes a successful explanation. We can illustrate this through the Southern Maya Lowlands (9th century CE) and the Eastern Mediterranean (Late Bronze Age/Early Iron Age transition).

  #### Case Study 1: The Southern Maya Lowlands (c. 800–950 CE)

  **Scholarly Consensus vs. Contention**
  There is broad consensus that during the 9th century, the institution of divine kingship (*k'uhul ajaw*) ceased in the southern lowlands, monumental construction halted, and major urban centres like Tikal and Calakmul were abandoned. It is genuinely contested, however, whether this represents a systemic failure of Maya civilisation or a political fragmentation accompanied by demographic shifts.

  **Diagnosing the Unit**
  *   **The Tainterian Unit (The State Apparatus):** Here, the unit is the network of tribute extraction and ritual labour required to sustain the divine kingship.
      *   *Diagnosis:* **Collapse.** The cost of maintaining the ideological and physical infrastructure of kingship exceeded the marginal returns of agricultural intensification and warfare.
      *   *Relevant Evidence:* Cessation of stela erection, abandonment of palace complexes, and breakdown of long-distance prestige good networks.
      *   *Causal Explanation:* A fiscal and energetic crisis. The explanation succeeds if it demonstrates why the *institution* could no longer fund itself (e.g., soil exhaustion reducing the surplus needed for ritual).
  *   **The Sceptic Unit (The Maya Population):** Here, the unit is the demographic collective and their habitus (language, pottery, cosmology).
      *   *Diagnosis:* **Reorganisation.** The population did not vanish; it migrated north to the Yucatán or dispersed into smaller, non-monumental settlements.
      *   *Relevant Evidence:* Household cluster continuity, ceramic typologies persisting into the Postclassic, and settlement patterns in peripheral zones.
      *   *Causal Explanation:* An adaptive strategy. The explanation succeeds if it shows how the *people* mitigated risk (e.g., drought prompted decentralization rather than death).

  **The Analytical Work**
  Fixing the unit changes the evidentiary burden. If the unit is the State, a 50% population decline is evidence of collapse because the tax base can no longer support the complexity. If the unit is the Population, that same 50% decline is evidence of resilience, provided the remaining 50% maintain cultural continuity. By explicitly naming the unit, we resolve the contradiction: The *State* collapsed (Tainter is right), which caused the *Population* to reorganize (Middleton/Yoffee are right). The disagreement vanishes once we acknowledge they are tracking different variables.

  #### Case Study 2: The Eastern Mediterranean (c. 1200 BCE)

  **Scholarly Consensus vs. Contention**
  It is consensus that the palatial centres of the Mycenaean, Hittite, and Canaanite worlds were destroyed or abandoned, and that literacy (Linear B, Cuneiform) disappeared from Greece and the Levant for centuries. It is contested whether this was a catastrophic "Dark Age" or a liberating transition that allowed for the rise of the Iron Age polities (e.g., the Greek *polis*, Phoenician city-states).

  **Diagnosing the Unit**
  *   **The Tainterian Unit (The Palace Economy):** The unit is the centralised redistribution system connecting the Aegean, Anatolia, and Egypt.
      *   *Diagnosis:* **Collapse.** The international trade web and the bureaucratic mechanisms managing it disintegrated.
      *   *Relevant Evidence:* Destruction layers in palaces, disappearance of imported luxury goods, loss of administrative scripts.
      *   *Causal Explanation:* Systemic fragility. The explanation succeeds if it shows how the *interconnectedness* of the system amplified shocks (e.g., "systems collapse" theory where one failure cascades).
  *   **The Sceptic Unit (The Regional Community):** The unit is the local settlement and its technological capacity.
      *   *Diagnosis:* **Transformation.** The end of the palace freed communities from tribute burdens, allowing for technological innovation (iron working) and new political forms.
      *   *Relevant Evidence:* Rural settlement expansion, diffusion of iron technology, continuity in domestic religious practice.
      *   *Causal Explanation:* Decentralisation. The explanation succeeds if it shows how the *region* became more equitable or technologically advanced despite the loss of elites.

  **The Analytical Work**
  Here, fixing the unit determines the valuation of the event. For the Palace Economy unit, the loss of literacy is a catastrophic loss of complexity. For the Regional Community unit, the loss of literacy is a shedding of an elite control mechanism that may have improved local autonomy. If we treat "Society" as a monolith, we cannot reconcile "catastrophe" with "liberation." If we treat them as separate units, we see that the catastrophe of the *bureaucracy* was the precondition for the transformation of the *region*. The explanatory goal shifts from finding the "killer" of the Bronze Age to understanding the metabolic change from centralised to distributed complexity.

  #### The Demographic Objection

  The strongest objection to your thesis is that demographic decline is not unit-relative. If a region suffers a 90% population loss due to plague or famine, that is an objective biological fact, not a conceptual choice. In such cases, "collapse" is true independently of whether we are looking at the state or the population. If the sceptics claim "people carried on as before" when 90% of them are dead, they are empirically wrong, not just conceptually different.

  **Does this defeat the thesis?**
  No, but it limits its scope. Your thesis holds for what we might term **sociopolitical collapse**, but not necessarily for **demographic collapse**.

  1.  **The Precision Problem:** In archaeology, "demographic decline" is rarely an objective fact in the way a body count is. It is an inference derived from settlement data, carrying capacity models, or paleopathology, all of which involve interpretive units. A drop in *occupied houses* (a unit of settlement) is often conflated with a drop in *people* (a unit of biology). The sceptics often argue that people moved, not that they died. Therefore, even demographic claims are often unit-dependent (settlement density vs. total population).
  2.  **The Threshold Problem:** Even granting hard demographic decline, the label "collapse" remains unit-relative regarding *significance*. A 50% population loss might be fatal for a complex state (which requires a specific threshold of surplus extraction) but survivable for a cultural tradition (which can persist through oral transmission among survivors). Thus, the *consequence* of the demographic event is still determined by the unit's requirements.

  **Verdict on the Objection:**
  The objection limits your thesis to cases where the debate is about the *nature* of the change (complexity vs. continuity) rather than the *extinction* of the actors. However, since true demographic extinction is rare in the literature (the Maya did not go extinct; the Greeks did not go extinct), the objection applies to the outliers rather than the core cases. You should concede that in cases of near-total depopulation (e.g., certain Pacific islands post-contact), the unit argument fails. But for the canonical cases of "collapse" (Rome, Maya, Bronze Age), the demographic decline is rarely total enough to render the unit choice irrelevant. The objection therefore refines your thesis rather than refuting it: **The unit of analysis determines the diagnosis of collapse, provided the demographic decline is not absolute.**

  #### Conclusion for the Theory Chapter

  By arguing that the Tainter-Middleton/Yoffee dispute is a category error regarding the unit of analysis, you are not dismissing the empirical data. Rather, you are proposing a meta-theoretical framework that allows both datasets to be true simultaneously.

  *   **Consensus:** Both sides agree on the material record (monuments stop, settlements shift).
  *   **Contested:** The interpretation of that record depends on whether the *explanandum* is the survival of the **hierarchy** or the survival of the **habitus**.

  Making this explicit prevents the "straw man" arguments that currently plague the literature, where collapse theorists accuse sceptics of ignoring death, and sceptics accuse collapse theorists of ignoring the peasantry. Your intervention allows the dissertation to move past the question "Did collapse happen?" to the more productive question: "Under what definitions of social units does the archaeological record indicate collapse, and what mechanisms drive those specific unit failures?" This validates your thesis as a tool for theoretical synthesis rather than mere terminology policing.
