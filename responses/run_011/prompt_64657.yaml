answer: |-
  # Diagnostic Instrument: The Boundaries of Expectation in Clinical Practice

  ## Part One: The Logical Space

  Before presenting the cases, we must map the terrain. The disagreement amongst clinicians regarding 'extraordinary' acts is not merely a matter of intuition; it stems from divergent answers to a small set of structural questions. By fixing answers to these questions, one generates a specific position within the logical space.

  **The Substantive Axes**

  1.  **Rankability:** Can two actions both be acceptable, yet one be morally better than the other?
      *   *Yes:* Morality has gradients.
      *   *No:* Actions are either acceptable or unacceptable; 'better' implies 'necessary'.
      *   *Sceptical:* Moral value cannot be ranked in this way.
  2.  **Omissibility:** If an action is the 'best' available option, is it possible to omit it without being open to criticism?
      *   *Yes:* One may choose the lesser option without fault.
      *   *No:* To choose the lesser option is to fail morally.
  3.  **Source of Optionality:** If the 'best' action is not mandatory, what makes it optional?
      *   *Cost:* The sacrifice to the agent is too high to demand.
      *   *Protected Projects:* The agent has a right to prioritise their own life and aims.
      *   *Discretion:* The role itself allows for choice.
      *   *Social Expectation:* It depends on what is customary at the time.
      *   *None:* There is no explanation; it is simply the structure of value.
  4.  **Symmetry:** Is there a mirror image? Can an act be morally worse than the standard yet still permissible (the suberogatory)?
      *   *Yes:* One can be 'below par' without being wrong.
      *   *No:* If it is not wrong, it is acceptable; if it is bad, it is wrong.
  5.  **Public Response:** How should the community react to the 'best' action?
      *   *Celebrate:* It should be praised and rewarded.
      *   *Acknowledge:* It is good but private.
      *   *Suppress:* Publicising it harms the practice by raising expectations.

  **Enumerating the Combinations**

  Mathematically, these axes permit dozens of combinations. For instance, one could hold that acts are rankable, omissible, due to cost, with symmetry, and should be celebrated. However, most combinations are unstable.

  *   **Empty Cell (Incoherent):** Rankability = No, Omissibility = Yes. If acts cannot be ranked, one cannot be 'better' yet 'optional' in the specific sense required here.
  *   **Empty Cell (Unattractive):** Rankability = Yes, Omissibility = No, Source = None. This implies morality is maximising and demanding without any buffer for human limitation. While logically possible, few defend it as a practical guide.
  *   **Empty Cell (Unthought):** Symmetry = Yes, Public Response = Suppress. The view that there are 'bad but allowed' acts that we should also hide is rarely articulated.

  **Locating the Positions**

  Within this space, the standard positions occupy the following coordinates:

  *   **The Maximising View:** Rankability (Yes), Omissibility (No). The category of the 'optional good' is empty because morality demands the best.
  *   **The Conceptualist View:** Rankability (No). It is conceptually confused to say an act is better yet not mandatory.
  *   **The Cost-Threshold View:** Rankability (Yes), Omissibility (Yes), Source (Cost). Acts are good but optional because they cost too much.
  *   **The Protected-Projects View:** Rankability (Yes), Omissibility (Yes), Source (Protected Projects). Agents are entitled to their own lives.
  *   **The Social Expectation View:** Source (Social Expectation). The line moves with culture.
  *   **The Two-Tier View:** Public Response (Suppress). The act is good, but praising it is harmful.
  *   **The Sceptical View:** Rankability (Sceptical). We cannot compare these acts.

  ---

  ## Part Two: The Tree

  **Instructions for Participants:**
  Read each scenario. Do not judge the act in the abstract. Instead, select the statement that best matches what you would personally think or feel about the *clinician* involved. There are no correct answers; we are mapping your intuitions.

  **Section A: Costs Borne by the Agent**
  *(These scenarios involve sacrifice of the clinician's own body, time, or money, with no direct negative impact on others.)*

  **1. The Kidney Donor**
  A consultant nephrologist anonymously donates a kidney to a former patient on their waiting list, undergoing surgery and recovery on their own time.
  *   **A:** I would think they are exceptional; most of us would not do this, and they should not have to.
  *   **B:** I would think they are commendable, but I would expect a specialist in that field to consider it a natural extension of care.
  *   **C:** I would be concerned; they have blurred professional boundaries and risked their health unnecessarily.

  **2. The Private Prescription**
  A consultant privately pays for a costly medication for a patient who does not meet the funding criteria, using their own money.
  *   **A:** I would feel admiration; they have gone far beyond what anyone could ask of them.
  *   **B:** I would feel it was generous, but worry that this sets a precedent we cannot all follow.
  *   **C:** I would feel they have undermined the system; if the treatment is necessary, the system should pay, not them.

  **3. The Vigil**
  A doctor stays through the night sitting with a dying patient's family because no one else was available, missing their own rest.
  *   **A:** I would regard this as a profound act of kindness that is not part of the job description.
  *   **B:** I would regard this as what a good doctor does when the situation demands it.
  *   **C:** I would regard this as poor time management; the system should have provided cover so this was not needed.

  **4. The Extra Training**
  A nurse spends every weekend for a year undertaking advanced training at their own expense, with no promise of promotion or pay rise.
  *   **A:** I would think they are highly motivated and doing more than is asked.
  *   **B:** I would think they are simply keeping up with what a dedicated professional should do.
  *   **C:** I would think they are foolish for giving up their free time without guaranteed reward.

  **Section B: Costs Spilling onto Others**
  *(These scenarios involve potential risks or costs to colleagues, other patients, or the service.)*

  **5. The Unsafe Shift**
  A nurse notices the next shift is short-staffed and unsafe. They stay on for a double shift to cover the gap rather than going home.
  *   **A:** I would think they are a saviour for protecting patients, despite the personal cost.
  *   **B:** I would think they are helpful, but the manager should not have allowed them to stay.
  *   **C:** I would think they are irresponsible; working while exhausted puts patients at risk and lets management off the hook.

  **6. The Queue Jumper**
  A consultant brings a patient in for surgery a week early because of family distress, displacing another patient who is clinically ready.
  *   **A:** I would think they showed great compassion for the family's suffering.
  *   **B:** I would think they made a difficult judgement call that is part of clinical discretion.
  *   **C:** I would think they acted unfairly towards the other patient and breached trust.

  **7. The Rule Bender**
  A doctor allows extended visiting hours for a distressed family, despite complaints from other families on the ward about noise.
  *   **A:** I would think they prioritised human need over bureaucracy admirably.
  *   **B:** I would think they balanced the needs of the ward reasonably well.
  *   **C:** I would think they favoured one family at the expense of others' right to rest.

  **Section C: Third-Party Responses**
  *(These scenarios concern how the institution or colleagues should respond to such acts.)*

  **8. The Award Scheme**
  The hospital trust proposes a 'Compassion Award' for staff who regularly stay late or spend extra time with patients.
  *   **A:** I would support this; good work should be recognised and celebrated publicly.
  *   **B:** I would accept this, provided it does not become a criterion for promotion.
  *   **C:** I would oppose this; it turns moral kindness into a box-ticking exercise and pressures others.

  **9. The Junior Doctor**
  A senior doctor tells a junior: 'What you did for that family was admirable, but please do not make a habit of it.'
  *   **A:** I would think this is the right message; it validates the kindness without setting it as a rule.
  *   **B:** I would think this is confusing; if it is admirable, why should they not do it?
  *   **C:** I would think this is patronising; the senior should either mandate the behaviour or say nothing.

  ---

  ## Part Three: The Key

  This key maps answer patterns to specific philosophical leaves. Do not sum the scores. Look for the shape of the responses.

  **Handling the Split Pattern (The 'Professional Boundary' Profile)**
  *   **Pattern:** Predominantly **A** in Section A (Own Cost), but predominantly **C** in Section B (Spillover Cost).
  *   **Interpretation:** This is the most common profile among experienced clinicians. It indicates a **Contextual Latitude View**. You hold that morality allows for extraordinary generosity when the cost is purely personal (Protected-Projects), but you reject acts that generate negative externalities or systemic risks (Spillover). You do not see the 'extra mile' as empty, but you believe it stops where it burdens the collective. This is not inconsistent; it is a robust distinction between *charity* and *professional conduct*.

  **The Leaves**

  1.  **Predominantly B across all sections.**
      *   **View:** **The Maximising View (Category Empty).**
      *   **Description:** You see the 'extraordinary' acts as simply what good care looks like. There is no gap between 'good' and 'expected'. If it is better, it is what we should aim for.
      *   **Nurse's Terms:** "There is no such thing as 'above and beyond'; there is just doing the job properly."

  2.  **Predominantly C across Section A and B.**
      *   **View:** **The Conceptual Incompatibility View.**
      *   **Description:** You suspect that if an act is truly 'better', it implies a standard we are failing to meet by omitting it. Alternatively, you view these acts as system failures.
      *   **Nurse's Terms:** "If it's the right thing to do, we should all do it. If we don't, the system is broken, not the person."

  3.  **Section A: A | Section B: C | Section C: C.**
      *   **View:** **The Cost-Threshold View.**
      *   **Description:** You believe acts are good and optional only because they cost the agent something significant. Once the cost spills to others, the act becomes wrong.
      *   **Nurse's Terms:** "It's fine to sacrifice your own time, but not if it risks patient safety or fairness."

  4.  **Section A: A | Section B: B | Section C: A.**
      *   **View:** **The Protected-Projects View.**
      *   **Description:** You emphasise the agent's right to choose how to use their own resources. You are permissive of personal sacrifice and supportive of recognition, provided it doesn't harm others.
      *   **Nurse's Terms:** "It's their life to give, and they deserve credit if they choose to give it."

  5.  **Section A: B | Section B: B | Section C: C.**
      *   **View:** **The Social Expectation View.**
      *   **Description:** You judge the act by whether it fits the current norms. You are wary of awards because they shift expectations artificially.
      *   **Nurse's Terms:** "What counts as 'special' changes. Awards make people expect too much."

  6.  **Section A: A | Section B: A | Section C: C.**
      *   **View:** **The Two-Tier View (Corrosion).**
      *   **Description:** You believe the acts are genuinely excellent, but public praise is dangerous. Celebrating them makes them look like requirements, which corrodes the practice.
      *   **Nurse's Terms:** "It was a beautiful thing to do, but if we put it on a poster, it becomes a target."

  7.  **Section A: A | Section B: A | Section C: A.**
      *   **View:** **The Praise and Credit View.**
      *   **Description:** You focus on the reward structure. The act is optional, but because it is better, it deserves formal recognition.
      *   **Nurse's Terms:** "If someone does more, they should get more recognition."

  8.  **Mixed A and C in Section A; C in Section B.**
      *   **View:** **The Mirror-Image View.**
      *   **Description:** You likely feel that if there are acts 'above' the call, there must be acts 'below' the call that are still permissible. You are sensitive to the symmetry of judgement.
      *   **Nurse's Terms:** "If we can be heroes without being forced, we should be able to be average without being blamed."

  9.  **No consistent pattern; options seem arbitrary.**
      *   **View:** **The Sceptical View.**
      *   **Description:** You do not find the cases rankable. The situations are too different to compare on a single scale of 'moral worth'.
      *   **Nurse's Terms:** "Every case is different. You can't measure kindness on a ruler."

  **Unmapped Cells**
  *   **Section A: C | Section B: A.** (Censorious of personal sacrifice, permissive of spillover).
      *   **Status:** **Empty (Unattractive).** This view implies one should not sacrifice one's own time but may sacrifice collective safety. It is logically possible but morally untenable in a health-care setting.
  *   **Section C: B (Consistently) with extreme A/C elsewhere.**
      *   **Status:** **Empty (Unthought).** Indifference to institutional response while holding strong views on the act itself is rare; usually, views on praise track views on the act.

  ---

  ## Part Four: The Honest Limitations

  **Unwanted Consequences**
  *   **Maximising View:** You must accept that a clinician who goes home to see their children instead of staying late is morally deficient.
  *   **Conceptual Incompatibility:** You must accept that the language of 'admiration' is confused; we should only ever speak of 'satisfaction of standards'.
  *   **Cost-Threshold:** You must accept that a wealthy clinician who donates money easily is less morally interesting than a poor one who struggles to do so.
  *   **Protected-Projects:** You must accept that a clinician who prioritises their hobby over a patient's comfort is within their rights, provided minimum standards are met.
  *   **Social Expectation:** You must accept that if the culture becomes cynical, 'good' acts cease to be good.
  *   **Praise and Credit:** You must accept that without an award scheme, the moral value of the act is diminished.
  *   **Two-Tier:** You must accept that silence is sometimes more ethical than gratitude.
  *   **Mirror-Image:** You must accept that there are 'bad' choices that we cannot stop or criticise.
  *   **Sceptical:** You must accept that moral deliberation cannot be systematised or taught.

  **Indistinguishable Pairs**
  *   **Cost-Threshold vs. Protected-Projects:** This instrument cannot reliably separate these. Both yield **A** in Section A and **C** in Section B. The difference lies in the *reason* (suffering vs. entitlement to a life), which cases alone do not reveal. You would need a follow-up interview to distinguish them.
  *   **Two-Tier vs. Sceptical:** Both may result in **C** for Section C (Awards). The Two-Tier proponent opposes awards because they are harmful; the Sceptic opposes them because they are meaningless. The instrument records the opposition, not the motive.

  **The Dud Case**
  *   **Question 5 (The Unsafe Shift):** This is likely to be a dud. Almost all clinicians, regardless of their ethical framework, will select **C** (Irresponsible/Risk). Patient safety norms are too entrenched to allow for variation. It will not sort participants; it will only confirm their professional socialisation. In future iterations, replace this with a scenario where the spillover cost is financial or bureaucratic rather than clinical safety.
