      *   *Implications for Humans:* If stability/history is key, many humans fail. We are often reward-driven (Case 6) or inconsistent (Case 1). Passing is largely luck (being raised well).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Tone Check:* Ensure British English (e.g., "programme," "behaviour," "honour"). Ensure it sounds like a philosophical critique, not a lecture.
      *   *Case 3 Problem:* The user admits they *feel* the argument-trained one is better but can't justify it. I should validate this intuition but point out it violates functionalism. The principle I derive should expose this tension.
