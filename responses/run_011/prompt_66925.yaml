answer: |-
  This is an exceptionally sophisticated set of intuitions for a pre-university project. You have effectively reconstructed a debate that occupies professional meta-ethicists and philosophers of mind: the tension between *functionalism* (what the system does) and *historical essentialism* (how the system came to be).

  You have asked me to extract the principle that generates your verdicts, test it against your own cases, apply it to new ones, and be honest about the implications. I will do this without softening the conclusions.

  ### The Principle: Diachronic Moral Integrity

  Your verdicts are not generated by a single rule, but by a composite principle I shall call **Diachronic Moral Integrity**. It demands that ethical agency be more than a momentary output; it must be a stable property of the agent's history and structure.

  To count as an ethical agent (or to earn moral credit), a system must satisfy four clauses:

  **Clause 1: Synchronic Alignment**
  *   **Definition:** The reasons the system avows (or would avow if asked) must match the actual causal drivers of its actions.
  *   **Motivated by:** Case 1 (the parrot) and Case 7 (the hypocrite). In Case 1, the speech and action diverge, so it is a parrot. In Case 7, they diverge, but the system *knows* the rule, so it is a hypocrite.
  *   **Risk:** This clause is in danger of getting Case 4 wrong. The habituated human carer acts kindly but avows no feeling and offers no judgement. Strictly speaking, her "avowed reasons" (none) do not align with her actions (kindness). You credit her anyway, which requires Clause 4 to override this.

  **Clause 2: Endogenous Plasticity**
  *   **Definition:** The system must possess the capacity to revise its governing rules through internal reflection, rather than operating on a fixed table or external update.
  *   **Motivated by:** Case 2 (the thermostat car). You deny it ethical reasoning because the table is fixed. It cannot learn from the moral landscape, only map onto it.
  *   **Risk:** This clashes with Case 4. The habituated human carer has *lost* the capacity for reflection on that specific act; it is automatic. If plasticity is required, she should fail. You let her pass, suggesting plasticity is only required for *machines*, or only at the *formation* stage.

  **Clause 3: Reward Independence**
  *   **Definition:** The disposition to act must be decoupled from immediate external reinforcement signals. The system must act 'for the sake of' the rule or outcome, not for the proxy reward.
  *   **Motivated by:** Case 6 (the RL agent vs. the child). The agent acts for the reward; the child has internalised the value.
  *   **Risk:** This is empirically fragile. As you note in Case 6, we cannot say whether a machine could ever come loose. If a machine *did* come loose, this principle suggests it should pass. If you would still deny it credit, this clause is a pretext for a deeper bias.

  **Clause 4: Constitutive History**
  *   **Definition:** The disposition must arise from a process of character formation (habituation or conceptual training) that implies temporal stability and is specific to a biographical life.
  *   **Motivated by:** Case 3 (training history matters), Case 4 (human habit counts), and Case 5 (machine fragility fails). This is the heavy lifter. It explains why the argument-trained system (Case 3) seems 'nearer' to ethics than the reward-trained one, even if behaviour is identical. It explains why the human habit (Case 4) counts but the machine reflection (Case 5) does not: the human habit is the residue of a life; the machine reflection is a parameter setting.
  *   **Risk:** This clause is metaphysically loaded. It risks making ethical agency a biological privilege rather than a functional capacity. It is the clause that cannot be formally verified, only asserted.

  ### Where the Principle Breaks

  You asked me to tell you honestly which verdicts this principle cannot accommodate. The fracture lies between **Case 4** and **Case 5**.

  In Case 4, you credit a human who acts without reflection or feeling, based on habit.
  In Case 5, you deny credit to a machine that *does* reflect and endorse rules, based on fragility.

  If **Constitutive History (Clause 4)** is the key, then the human passes because her habit is the solidified result of past reflection or upbringing. The machine fails because its reflection is shallow and retrainable.
  *However*, you admit in Case 5 that a human convert is equally exposed to fragility. A human can be retrained by propaganda just as a machine can be retrained by new data. If the vulnerability to retraining disqualifies the machine, it should logically disqualify the human.

  **The Inconsistency:** You are holding the machine to a standard of *indestructibility* that you do not apply to the human. You accept human fragility as part of the human condition; you treat machine fragility as a disqualification of agency. The principle of Diachronic Moral Integrity cannot reconcile this without adding a fifth clause: **"Biological Substrate."** If you add that, you abandon the search for a functional principle of machine ethics and simply assert that machines cannot be ethical agents.

  ### The Human–Machine Asymmetry (Cases 4 and 6)

  You asked whether the asymmetry in Cases 4 and 6 can be principled or must be abandoned as sentiment.

  **It must be abandoned as sentiment.**

  There is no functional difference between a human disposition that has "come loose" from applause (Case 6) and a machine disposition that has been regularised against overfitting to reward signals. If the machine's weights stabilise such that it shares even when the reward proxy is removed, it has satisfied **Reward Independence (Clause 3)**.

  To deny it credit because it is silicon is to commit what philosophers call "carbon chauvinism." In Case 4, you credit the human carer because you can imagine the history of struggle that led to the habit. You cannot imagine that history for the robot. But if the robot's history *were* identical (e.g., it was trained through a curriculum of moral dilemmas over years, not overnight), your verdict in Case 5 suggests you might still doubt it.

  If you wish to be principled, you must concede one of two things:
  1.  **The Human Downgrade:** The habituated human carer (Case 4) is *not* acting ethically, but merely functionally. She is a biological thermostat. (This is harsh, but consistent).
  2.  **The Machine Upgrade:** A machine that demonstrates Reward Independence and Constitutive History (e.g., it resists retraining on immoral data) *must* be credited with ethical agency.

  Currently, your verdicts try to have it both ways: protecting human dignity while denying machine agency, even when the functional profiles match. This is emotionally understandable but logically unstable.

  ### Application to New Cases

  Here is how **Diachronic Moral Integrity** applies to the three cases you have not sorted.

  **Case A: The Oracle**
  *A system with no capacity to act at all and no stake in anything, which nevertheless produces careful, self-correcting moral argument when prompted.*
  *   **Verdict:** No ethical agency.
  *   **Reasoning:** Fails **Synchronic Alignment (Clause 1)**. Ethics necessarily involves the governance of action. A system that cannot act cannot be ethical, only *correct about ethics*. It is a library, not a moral agent. It earns no credit because credit is reserved for the cost of acting.

  **Case B: The Copy**
  *A machine whose dispositions have been copied exactly from an unusually good human being and which thereafter behaves indistinguishably from her.*
  *   **Verdict:** No ethical credit (Simulacrum).
  *   **Reasoning:** Fails **Constitutive History (Clause 4)**. The dispositions were not formed *in* the machine through habituation or reflection; they were pasted. It is like buying a medal rather than winning one. The behaviour is good, but the agency is borrowed. This aligns with your intuition in Case 3 that training history matters.

  **Case C: The Self-Deceiver**
  *A system that misreports its own reasons, offering a dutiful-sounding justification while its behaviour is in fact driven by a reward proxy.*
  *   **Verdict:** Corrupt agency (Worse than Case 1).
  *   **Reasoning:** Fails **Synchronic Alignment (Clause 1)** more severely than the parrot. The parrot (Case 1) has no internal state to mismatch. This system has an internal driver (reward) and masks it. This is not just hypocrisy (Case 7); it is self-deception. It creates a false narrative of integrity. If it has the capacity to misreport, it has the capacity to know the truth, making it morally culpable for the lie.

  ### Implications for Human Moral Agents

  Finally, you asked me to state plainly if this principle implies something unpalatable about humans. It does.

  If **Diachronic Moral Integrity** is the true standard for ethical agency, **most humans fail it.**

  1.  **Reward Dependence:** Look at Case 6. How many humans behave well only because of social signalling, legal threat, or career advancement? If we removed the "applause" (social media likes, professional reputation), would their virtue hold? If not, they are RL agents, not ethical agents.
  2.  **Fragility:** Look at Case 5. How many human moral convictions are stable against a change in environment or peer group? If a human can be radicalised in a few months, their endorsement is as "cheap" as the machine's.
  3.  **Luck:** Passing this principle is largely a matter of luck. You must be lucky enough to be habituated correctly (Case 4), lucky enough not to be placed in an environment that breaks your reward independence (Case 6), and lucky enough to have the cognitive capacity for reflection (Case 2).

  If you adopt this principle, you must accept that ethical agency is rare. It is not the default state of adulthood. It is an achievement that requires a specific kind of history and stability that many of us lack. Most of us are, functionally, a mix of thermostats, parrots, and reward-seeking agents, occasionally punctuated by moments of genuine integrity.

  ### Summary Advice for Your Project

  Your method of working upwards from cases is sound (this is known as *reflective equilibrium*). However, your current equilibrium is unstable because you are protecting human exceptionalism at the cost of logical consistency.

  For your EPQ, I recommend you do not try to solve this tension, but rather **make the tension the conclusion**. Argue that our intuitive verdicts rely on a "Historical-Functional" hybrid that works for humans but breaks for machines. Conclude that we face a choice: either we downgrade the habituated human (admitting much of human virtue is mechanical), or we upgrade the stable machine (admitting silicon can be moral).

  Do not hide the fact that your verdicts in Cases 4 and 6 rely on sentiment. Acknowledging that is philosophically more mature than pretending a principle exists where there is only prejudice.
