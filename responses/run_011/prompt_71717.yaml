  I write literary fiction, and I have a story idea where the math has to actually be right, because the plot turns on it. Setup: a small town's charter guarantees that the collection of "registered compacts" between families — ordered by extension, where one compact extends another if it keeps every clause and adds more — must contain a maximal compact, so long as every chain of compacts has an upper bound that is itself registrable. My protagonist is the town clerk who, after thirty years of rubber-stamping extensions, discovers the proviso quietly fails: there's a chain whose obvious union can't be registered, because a compact is only registrable while every one of its clauses still has a living wittness, and the union has accumulated clauses from signatories dead for generations. The story should be about her trying to name the maximal compact the charter promises, and finding that the promise only ever guarantees existence — no procedure, no way to point at the thing.

  Could you write that as a short story, maybe 1500–2500 words, from her point of view? I want the mathematics to be the engine, not set dressing: by the last page a reader should feel why "every chain has an upper bound" is the load-bearing hypothesis, and why existence-without-construction lands as a kind of betrayal. Change my invented details freely, just don't soften the lemma or fudge the counterexample.

  Then tack on a short note for me: how confident you are that the math as you've dramatized it is actually right rather than merely sounding right, where you took liberties, and the single point you're least sure about. American English, please.
