answer: |-
  Hi there,

  Thanks for reaching out about this. It is a brave move to walk into a personality department and argue for situationism, especially given that most of them consider the person-situation debate to have ended decades ago with the interactionist consensus. You are essentially telling them their construct validity is philosophically bankrupt, so you need to be strategically humble while remaining firm on the normative stakes. Here is how I would prepare for the room you described.

  Start by disarming them in your opening five minutes. You must concede that the .30 coefficient is old news and that nobody in modern personality psychology believes in perfect cross-situational consistency. Explicitly acknowledge that the Big Five predicts meaningful life outcomes like divorce, job performance, and mortality, and that aggregation across occasions does indeed improve reliability via the Spearman-Brown prophecy. If you do not say this, the methodologist and the Big Five researchers will spend their questions teaching you basic psychometrics rather than engaging your thesis. Frame your target not as the psychological trait used for prediction, but specifically as the robust, explanatory disposition required for Aristotelian praise and blame. Make it clear you are not denying that people are predictable, but rather that they are predictable in the way virtue ethics requires for moral responsibility. This concession costs you little because it isolates your philosophical claim from their empirical data, but it prevents you from being painted as ignorant of the field.

  Once you open the floor, the first objection will almost certainly come from the methodologist or the Big Five specialist, and it will be about aggregation. They will say that looking at single behaviors is a straw man because traits are defined by aggregates over time and contexts, and that once you aggregate, consistency coefficients rise well above .30, often into the .70 or .80 range. They will argue that virtue ethics only requires reliable prediction over the long run, not perfect consistency in every instance. This is high damage because it directly undermines your empirical premise. Your reply should be that aggregation saves prediction but kills explanation. When you aggregate hundreds of behaviors to get a stable score, you lose the specific causal power needed to explain why an agent acted rightly in a specific moment of moral testing. Virtue ethics needs the trait to explain the particular action, not just the average trend. The soft spot here is that you might sound like you are moving the goalposts, so emphasize that moral responsibility is assigned per action, not per lifetime average.

  The second wave will come from the whole trait theorist, who will argue that traits are not global consistencies but density distributions of states or if-then signatures. They will say you are attacking a caricature of traits that nobody holds, and that modern theory already incorporates situational sensitivity into the trait definition itself. This is medium damage because it challenges your conceptual mapping. Your reply is that a density distribution or a bundle of conditionals is not a disposition. A disposition implies an internal cause that surfaces across diverse situations, whereas a distribution is just a description of variance. If honesty is just a set of if-then rules like honest-if-watched but dishonest-if-unobserved, you do not have the unified character required for virtue ethics. The soft spot is that this risks becoming a semantic debate about the word trait, so keep pivoting back to the requirement for a unified explanatory cause.

  Next, the behavioral geneticist will likely ask about rank-order stability. They will point out that individuals maintain their relative standing on traits over decades, which suggests something internal and stable, not situationally swamped. They will ask how you explain this stability if situations are doing all the work. This is medium-low damage because stability over time is not the same as consistency across situations. Your reply is that rank-order stability can be explained by stable environments or gene-environment correlations rather than robust internal traits. If I stay in the same job and social circle, my behavior will look stable even if it is driven by situational cues rather than character. The soft spot is that this requires a complex argument about environmental stability that might bore the room, so keep it brief.

  The trait psychologist focused on predictive validity will ask why it matters if the traits work. They will say that if Big Five scores predict who steals from the company or who helps a colleague, then for all practical purposes the traits exist. This is low damage but annoying because it ignores the normative point. Your reply is that predictive utility does not equal ontological robustness. We can predict weather without understanding the metaphysics of clouds, and we can predict behavior without positing robust character traits. Virtue ethics needs the latter for justification of praise and blame, not just the former for prediction. The soft spot is that this can sound like philosophers dismissing practical science, so acknowledge the utility while denying the metaphysical weight.

  The single most critical reply that has to land for your talk to succeed is the distinction between prediction and moral explanation. You must convince them that while their traits are real enough for science, they are not real enough for the specific job virtue ethics hires them to do. If you fail to make this distinction, you will just be heard as a psychologist arguing with psychologists about effect sizes, which you will lose. You need them to accept that the psychological construct and the philosophical construct are different things, even if they share a name.

  Finally, the question you are hoping nobody asks is the pragmatic so-what question. Someone will ask why we should care about Aristotelian traits if psychological traits work fine for selection, therapy, and understanding behavior. They will ask if you are just defending an obsolete philosophical framework that has no cash value for actual science. This is the hardest question because it challenges the relevance of your entire project. If it comes, do not defend Aristotle. Instead, argue that our practices of praise, blame, and moral education presuppose robust traits, and if those traits do not exist, our moral practices are systematically unjustified. That raises the stakes from academic taxonomy to ethical crisis, which is where you want them.

  Good luck with the talk. It is a tough room, but if you respect their data while holding firm on the normative requirements, you can survive the hour.

  Best,

  Your Colleague
