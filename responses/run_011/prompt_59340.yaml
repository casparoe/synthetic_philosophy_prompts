answer: |-
  1. **The No-Self Problem**
  You defend karma as moral desert, but you also defend the Buddhist *anatman* doctrine: there is no enduring self. If there is no "I" that persists from birth to death, let alone life to life, who exactly is the bearer of this desert? Who is it that *deserves* the suffering or happiness?

  *Follow-up:* You'll likely reach for the standard causal continuity analogy—the flame passing from one lamp to another. But I am causally downstream of a great many dead people too, via genetics, culture, and history. Why does the karmic flame skip my ancestors and land on *this* mindstream? What makes me the owner of a deed I have no memory of and no metaphysical identity with?

  2. **The Beginningless Regress**
  Your system relies on a beginningless series of lives to ensure every outcome is matched to a prior cause. But if every state is deserved only because of a previous state, and there is no first undeserved state, have you actually justified the suffering we see? Or have you just created an infinite chain of deferred justification?

  *Follow-up:* I anticipate you'll say the question of a "first cause" is a category error. But consider the analogy of debt: if I owe money because my father owed money, and he owed it because his father did, ad infinitum, does the debt ever become legitimate? Or does an infinite chain of "each link is deserved" just postpone the question of justice forever?

  3. **The Mechanism of Moral Causality**
  In physical causality, we can explain how fire burns cotton via chemistry and thermodynamics. In your view, moral facts cause physical outcomes—greed leads to poverty, generosity to wealth. What is the mechanism here? How does a private mental intention translate into a public material circumstance without an enforcer to manage the transaction?

  *Follow-up:* You will likely insist it is simply a law of nature, like gravity. But gravity doesn't have an exchange rate. Who or what sets the specific rate? Why does *this* specific lie result in *that* specific loss of wealth, rather than a health issue or a relationship breakdown? In the absence of a legislator, where does the exchange rate come from?

  4. **Description vs. Retribution**
  You've argued that karma isn't retribution; it's just description. It's not that the universe is punishing you, it's that you are encountering the natural fruit of your actions. But the concept of "desert" seems to imply a moral ledger that needs balancing. Can you really have desert without a deserver?

  *Follow-up:* If you remove the agent who gives what is owed, aren't you left with something indistinguishable from moral luck? If a child is born into suffering and we call it "karmic fruit" rather than "bad luck," but there is no one administering the fruit, what work is the word "desert" actually doing other than comforting the observer?

  5. **The Moral Luck Objection**
  Let's press that distinction. If karma is just a natural regularity, like fire burning, then my suffering is just a natural event. But you want to maintain it is *moral* desert. If I cannot distinguish between a karmic consequence and a random accident from my perspective, isn't this just moral luck with extra steps?

  *Follow-up:* You'll likely say the distinction exists objectively even if I can't see it. But if the distinction makes no difference to my experience or my ability to navigate the world, does it matter? If I treat a karmic consequence and a random accident exactly the same, why insist on the moral label?

  6. **Merit Transfer**
  In many Buddhist traditions, one can transfer merit to the dead or dedicate it to all beings. If karma is a strict theory of individual moral desert—where my lot is mine and yours is yours—how is it possible for me to hand you my moral credit?

  *Follow-up:* You will probably explain that I am altering the *conditions* for your merit to ripen, not handing over the deed itself. But if your improved condition relies on my generosity, then in what sense is that improved condition *deserved by you*? Doesn't merit transfer implicitly admit that the system of strict individual desert is porous?

  7. **Prudence vs. Morality**
  If acting well produces a better rebirth and acting poorly produces a worse one, isn't the rational agent simply investing in their future well-being? If I act kindly partly because it pays off in the long run, am I being moral, or am I being prudent?

  *Follow-up:* You'll likely argue that true compassion is intrinsic and not transactional. But the framework itself is transactional: good deeds yield good fruit. If the system incentivizes morality through reward, doesn't that corrupt the moral worth of the action? Are you teaching ethics, or are you teaching long-term risk management?

  8. **Proportionality of Suffering**
  We see instances of extreme, crushing suffering in children who seem incapable of complex intentional action. You would attribute this to heavy demerit from past lives. But without access to the ledger, how do we know the punishment fits the crime?

  *Follow-up:* You will say we cannot judge the proportionality because we lack the vision to see the past deeds. But if the theory claims the system is perfectly just, and we are barred from verifying the justice, are we not asked to take the justice of the system on faith? How is that different from trusting a god we cannot see?

  9. **Epistemology and Falsifiability**
  This leads to the epistemic status of the theory. If every positive outcome confirms the theory (good deed, good fruit) and every negative outcome also confirms the theory (bad deed, bad fruit), and unknown past lives explain away any apparent mismatches, what would actually count as evidence against it?

  *Follow-up:* You might say that meditation or psychic development provides the evidence. But for the rest of us, if no observation of the world can contradict the theory, isn't it unfalsifiable? If it's unfalsifiable, are we doing philosophy or theology?

  10. **The Exit Condition**
  Finally, I want to ask directly: What would make you give this view up? Is there a philosophical argument, a scientific discovery, or a lived experience that would force you to abandon karma as a theory of moral desert?

  *Follow-up:* If you say "nothing," you risk dogmatism. If you say "evidence," we return to the problem that the theory explains away all evidence. So, is there a coherent state of affairs you can describe where you would say, "If that were true, karma is false"? Or is this view insulated from being wrong by design?
