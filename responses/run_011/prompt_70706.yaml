          *   *Wait, actually:* The biggest wobble is between (1)/(4) and (2)/(3). If I sacrifice (2) (hard determinism on conscientiousness), I save Reciprocity. But a PPE student probably won't want to deny luck.
          *   *Better Repair:* Sacrifice the *strength* of (4). Move from "mandatory" to "entitlement to support." Or, Sacrifice (1)'s "fair deal" language.
