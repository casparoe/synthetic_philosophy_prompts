          *   *Let's go with:* Drop the paternalistic justification in (7). It creates the most friction with (8) and isn't needed for (4) if (4) is based on (1). But (1) clashes with (2).
          *   *Actually, the prompt asks:* "Which single revision would repair the most damage."
          *   *Diagnosis:* The conflict between (2) [No Desert] and (1) [Reciprocity] is the engine of the wobble. If you can't deserve your conscientiousness, you can't owe a duty of reciprocity based on it.
