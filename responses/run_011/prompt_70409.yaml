prompt: |-
  I want a position of mine pressure-tested rather than summarized. It concerns satisficing and bounded rationality, and I will state it as carefully as I can before saying what I need from you.

  The position has three parts.

  First: a standard of practical rationality that an agent cannot follow is not a standard for that agent. The maximising norm, on its ordinary reading, requires the agent to select the alternative supported by the strongest reasons overall, and that presupposes a comparison across the whole feasible set. When constructing such a comparison exceeds the agent's search and computational budget, the norm does not become demanding — it becomes empty. There is nothing there for her to fail.

  Second: in choice problems of that kind, satisficing is not a discounted version of maximising. It is the only available candidate for rational choice. Describing it as rational-given-constraints concedes too much, because that formulation keeps maximisation in place as the norm and treats satisficing as a fall from it, when in the relevant domain there is no norm to fall from.

  Third: the aspiration level is not an arbitrary stopping threshold. It is set by the agent's history with comparable problems and calibrated against outcomes she has actually obtained. A satisficer with a well-calibrated threshold is not less rational than a maximiser; she is executing the only procedure that could have been executed.

  Two objections have already been pressed on me, and I want your judgement on whether either is fatal.

  The first comes from a colleague and is conceptual. On her reading my view collapses back into maximisation one level up: if the agent selects the best decision procedure she can execute within her budget, she is maximising over rules. Satisficing is then optimisation restricted to a feasible set of procedures, the second part of my position is false, and I have relocated the maxim rather than escaped it.

  The second comes from a collaborator and is empirical. She ran a repeated-choice task with displayed option sets, a per-decision time limit, and an instruction either to accept the first option clearing a stated threshold or to look for the best of what was shown. Subjects in the threshold condition did not hold their thresholds stable; the thresholds drifted systematically with recent payoffs, rising after good runs and falling after poor ones. Her conclusion was that nothing corresponding to a satisficing rule was being implemented at all — that the label describes the shape of the output rather than any procedure producing it — and so the third part of my position has no support.

  What I want is a map of this position's exposure.

  Which states of affairs would make it false? Sort the candidates by decisiveness, and say for each whether it would be fatal, merely awkward, or absorbable by reformulation. I would like conceptual and empirical defeaters distinguished, since I suspect they fail differently.

  Which of these would a defender of the position concede as genuinely counting against her, and which would she dismiss as changing the subject? I want the internal assessment, not only what critics would say.

  What does the position predict that its main rival — maximisation with explicit search costs — does not? Are there choice situations in which the two come apart, and if so, are they constructible in principle or only describable in the abstract? If they are extensionally equivalent everywhere, say so, and say what that costs me.

  Whether the position has been qualified into immunity. The obvious candidate is the appeal to budget in the first part: budgets are unobservable, are nominally set by the agent, and can be revised after the fact. Tell me plainly whether this renders the view untestable, and whether untestability of that sort is a defect in a claim about practical rationality or is unobjectionable given what the claim is for.

  Bear in mind as you work through the collaborator's result that threshold drift with recent experience may be precisely what the third part predicts, which raises the question of whether any outcome in that experiment could have counted against me. For what it is worth, the objection I would find hardest to answer is the colleague's: if satisficing is best understood as optimisation over procedures, I am not certain I have a substantive thesis left. I would rather be told that directly than reassured.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** Pressure-test a specific philosophical/decision-theoretic position on satisficing and bounded rationality.
      *   **The Position (3 Parts):**
          1.  *Ought Implies Can:* If a rational standard (maximization) exceeds cognitive budget, it's not a standard for that agent (it's empty, not demanding).
          2.  *Satisficing as Default:* In such cases, satisficing isn't a compromised maximization; it's the *only* rational candidate. It's not "rational given constraints," it's just "rational."
          3.  *Calibrated Aspiration:* Aspiration levels aren't arbitrary; they are calibrated by history/outcomes. A calibrated satisficer is fully rational.
      *   **The Objections:**
          1.  *Conceptual (Colleague):* Rule-utilitarian style objection. You are maximizing over *procedures*. Satisficing is just constrained optimization.
          2.  *Empirical (Collaborator):* Thresholds drift with recent payoffs. No stable rule is being followed. Satisficing is just a description of output, not a procedure.
      *   **Specific Tasks:**
          1.  Map exposure (states of affairs that make it false), sorted by decisiveness (fatal, awkward, absorbable). Distinguish conceptual vs. empirical.
          2.  Internal assessment: What would a defender concede vs. dismiss (changing the subject)?
          3.  Differentiation: What does this predict that "Maximization + Search Costs" does not? Are they extensionally equivalent?
          4.  Testability/Immunity: Is the appeal to "budget" untestable/immunizing? Is that a defect?
          5.  Address the specific worry about the "Rule Optimization" objection (the user's hardest worry).

  2.  **Deconstruct the Position & Objections:**

      *   *Core Claim:* Rationality is procedural and capacity-relative. "Maximization" is conceptually incoherent when capacity is exceeded, not just practically hard. Therefore, satisficing isn't a second-best; it's the *sui generis* norm for bounded agents.
      *   *Objection 1 (Rule Optimization):* This is the "Consequentialization" or "Rational Reconstruction" objection. If you choose the best *feasible* strategy, aren't you still maximizing utility (where utility includes cognitive cost)?
          *   *User's Fear:* This collapses the view into standard bounded rationality (Simon/Stigler), losing the normative punch that satisficing is *distinct*.
      *   *Objection 2 (Threshold Drift):* Empirical evidence suggests people don't hold fixed thresholds.
          *   *User's Counter-thought:* Part 3 says thresholds are calibrated by history. Drift *is* calibration. So the data might support, not refute, the view.
          *   *Risk:* If *any* behavior can be described as "calibrated," the theory is unfalsifiable.

  3.  **Drafting the Response - Section by Section:**

      *   **Section 1: Map of Exposure (Defeaters).**
          *   Need to categorize by Fatal, Awkward, Absorbable.
          *   *Conceptual:*
              *   *Fatal:* If "budget" is endogenous and adjustable to fit any behavior (immunization). If "optimization over procedures" is shown to be the *only* coherent definition of rationality (conceptual collapse).
              *   *Awkward:* If satisficing procedures systematically yield worse long-term outcomes than simple heuristics that aren't threshold-based.
              *   *Absorbable:* If thresholds drift, *provided* the drift follows a calibration rule (Part 3).
          *   *Empirical:*
              *   *Fatal:* Evidence that agents *can* maximize in high-cost scenarios but choose not to (showing budget isn't the constraint). Evidence that threshold drift is random/noisy rather than calibrated (refuting Part 3).
              *   *Awkward:* If "calibration" takes so long it ruins the benefit of satisficing.
              *   *Absorbable:* The collaborator's finding (if interpreted as adaptive calibration).

      *   **Section 2: Internal Assessment (Concede vs. Dismiss).**
          *   *Concede:* If the "Rule Optimization" objection shows that the *normative force* comes from the optimization, not the satisficing itself. If "budget" is purely post-hoc rationalization.
          *   *Dismiss:* The idea that rationality must be context-independent (Ought Implies Can is non-negotiable). The idea that output description equals procedure (process matters).

      *   **Section 3: Differentiation (vs. Max + Search Costs).**
          *   Standard model: Maximize $U(x) - Cost(search)$. This is still maximization.
          *   User's model: The norm *changes*. It's not $Max(U-C)$, it's $Satisfy(Threshold)$.
          *   *Divergence:* In cases where search cost is low but cognitive comparison cost is high (complex attributes). Standard model says search more; User's model says satisfice because comparison is impossible.
          *   *Extensional Equivalence:* If they always pick the same option, the distinction is merely semantic/psychological. This is a cost (Occam's razor).

      *   **Section 4: Testability & Immunity.**
          *   The "Budget" problem is real. If budget is unobservable, "I couldn't maximize" is an excuse for anything.
          *   *Is it a defect?* For a normative claim, maybe not (Kantian "Ought Implies Can"). For a descriptive/predictive theory, yes.
          *   *Solution:* Budget must be tied to measurable cognitive constraints (working memory, time), not just "felt difficulty."

      *   **Section 5: Addressing the "Rule Optimization" Worry (The Colleague).**
          *   This is the crux.
          *   *Argument:* There is a difference between *constitutive* aims and *derivative* strategies.
          *   If the agent aims to "do the best feasible procedure," is that Maximization? Yes, formally.
          *   *Defense:* The *normative standard for the choice itself* is satisficing. The meta-choice of procedure is a different logical type.
          *   *Honest Assessment:* The colleague is right that formally it looks like optimization. The substantive thesis survives only if the *criterion of rightness* for the action is satisfaction, not optimality. If the "best procedure" is chosen *because* it maximizes expected value, the colleague wins. If it's chosen because it's the only *intelligible* norm, the user wins.
          *   *Verdict:* It's a serious threat. It risks turning a normative claim into a descriptive one.

  4.  **Refining the Tone:**
      *   The user wants pressure-testing, not reassurance.
      *   Tone should be analytical, rigorous, slightly adversarial but constructive.
      *   Avoid jargon where possible, but use precise philosophical terms (extensional equivalence, normative force, endogenous).
      *   Acknowledge the strength of the Colleague's objection (as the user suspects it's the strongest).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Collaborator's finding correctly? The user thinks drift supports Part 3. I need to validate that but warn about the "just-so story" risk.
      *   *Check:* Did I answer the "Extensional Equivalence" question clearly? If they predict the same actions, the theory is less valuable.
      *   *Check:* Is the distinction between "Ought Implies Can" and "Budget" clear?
      *   *Refinement on Colleague's Objection:* I need to be careful not to just say "it's different levels." That's a standard move that often fails. I need to explain *why* the level shift matters normatively. The key is whether the *reason* for choosing the rule is maximization-based or capability-based.

  6.  **Final Polish:** Organize with clear headings matching the user's prompts. Ensure the "Fatal/awkward/absorbable" sorting is distinct. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a rigorous position, grounded in a specific reading of "Ought Implies Can" applied to cognitive architecture. You are arguing for a *constitutive* limit on rationality, not merely a *practical* constraint.

  Here is the pressure test you requested, structured by your requirements.

  ### 1. Map of Exposure: States of Affairs That Make It False

  I have sorted these by decisiveness. "Fatal" means the position cannot stand without major reconstruction. "Awkward" means it survives but loses explanatory power. "Absorbable" means the position can incorporate the finding without loss.

  #### Conceptual Defeaters

  *   **Fatal: The "Budget" is Endogenous and Unconstrained.**
      *   *State of Affairs:* It is demonstrated that agents can revise their cognitive budget *during* the choice process to accommodate maximization, but choose not to because they prefer leisure/effort-avoidance.
      *   *Why:* Your first part rests on the claim that the norm becomes *empty* (impossible), not *costly*. If the agent *could* maximize but treats cognitive effort as a disutility to be weighed, you are back in the standard "Maximization with Search Costs" model. Your view collapses into a preference for laziness disguised as a limit of rationality.
  *   **Fatal: The Colleague's "Rule Optimization" is Normatively Exhaustive.**
      *   *State of Affairs:* It is shown that the *only* coherent justification for selecting a satisficing procedure is that it yields higher expected utility than attempting to maximize.
      *   *Why:* If the reason you adopt satisficing is "it works best," then the governing norm is still maximization (of outcomes/welfare). Your claim that satisficing is a *distinct* normative standard fails; it becomes merely an instrumental strategy within the maximizing framework.
  *   **Awkward: Satisficing Procedures are Systematically Dominated.**
      *   *State of Affairs:* In bounded environments, agents using calibrated satisficing rules consistently achieve lower long-term welfare than agents using simple "take the best" heuristics that do not rely on aspiration levels.
      *   *Why:* This doesn't falsify the *concept* of satisficing rationality, but it undermines the claim that the satisficer is "executing the only procedure that could have been executed" *rationally*. If a better feasible procedure exists, your claim that satisficing is the *only* rational candidate is weakened.
  *   **Absorbable: Thresholds are Unstable.**
      *   *State of Affairs:* Aspiration levels fluctuate wildly without clear calibration to history.
      *   *Why:* You can absorb this by distinguishing between *ideal* bounded rationality (calibrated) and *actual* human behavior (noisy). Your theory is normative; human error doesn't falsify the norm, only the empirical claim that humans generally meet it.

  #### Empirical Defeaters

  *   **Fatal: Cognitive Capacity is Not the Bottleneck.**
      *   *State of Affairs:* Neurocognitive data shows that in the specific choice problems you cite, the agents possess the working memory and processing speed to compare the feasible set, but fail to do so due to attentional lapses or motivational factors.
      *   *Why:* This attacks Part 1 directly. If the comparison is *possible* but not *actualized* for non-cognitive reasons, the maximizing norm is not empty. The agent is failing a valid standard.
  *   **Fatal: Drift is Random, Not Calibrated.**
      *   *State of Affairs:* The collaborator's data shows threshold drift is statistically indistinguishable from random walk, or correlates with irrelevant factors (e.g., time of day, mood) rather than payoff history.
      *   *Why:* This kills Part 3. If the threshold isn't calibrated by history/outcomes, the satisficer is not "executing a rational procedure." She is guessing. The claim that she is "no less rational than a maximiser" becomes false.
  *   **Awkward: Calibration Lag.**
      *   *State of Affairs:* The time required to calibrate the aspiration level exceeds the time saved by satisficing in the immediate choice.
      *   *Why:* This makes the view pragmatically unstable. It suggests the "rational procedure" is self-defeating in the short run, requiring a long-run defense that complicates the theory.
  *   **Absorbable: The Collaborator's Finding (Drift as Calibration).**
      *   *State of Affairs:* Thresholds rise after good runs and fall after poor ones.
      *   *Why:* As you noted, this is precisely what Part 3 predicts (calibration against outcomes). You can absorb this easily *unless* the magnitude of the drift is maladaptive (e.g., rising too high after a lucky streak, leading to immediate failure).

  ---

  ### 2. Internal Assessment: Concede vs. Dismiss

  This distinguishes what a defender of *your specific view* must accept as a hit, versus what they can reject as attacking a straw man.

  **What to Concede (Genuine Counts Against):**
  *   **The Extensional Equivalence Risk:** If it turns out that "Maximization with Search Costs" and "Bounded Satisficing" predict the exact same choices in all feasible scenarios, you must concede that your distinction is purely psychological, not normative. You lose the claim that satisficing is a *different standard of rightness*.
  *   **The Endogeneity of Budget:** You must concede that if an agent can expand their budget with sufficient incentive (e.g., high stakes), your claim that the norm is "empty" is false. In high-stakes bounded scenarios, agents *do* maximize. If they can do it then, the norm wasn't empty, just expensive. You would have to retreat to a claim about *low-stakes* boundedness only.
  *   **The Colleague's Logical Point:** You must concede that formally, selecting a procedure *is* an optimization problem. You cannot deny the logic. Your defense must be normative, not logical. You must argue that the *criterion of rightness* for the first-order choice is satisfaction, even if the meta-choice was optimal.

  **What to Dismiss (Changing the Subject):**
  *   **The "Ideal Theory" Objection:** Any critic arguing that rationality *should* be defined independently of human capacity is changing the subject. Your position is explicitly grounded in "Ought Implies Can." Demands that ignore capacity are, by your definition, not standards of practical rationality.
  *   **The "Output Description" Objection (if calibrated):** If the collaborator argues that drift proves no rule exists, but the drift follows a calibration function, you dismiss this. A dynamic rule is still a rule. Insisting on a *fixed* threshold is a caricature of satisficing (Simon's original formulation allowed for adjustment).
  *   **The "Perfectionist" Objection:** Arguments that satisficing leaves value on the table are irrelevant. If picking up that value requires cognitive operations that exceed the budget, that value is not "available" in the relevant normative sense.

  ---

  ### 3. Differentiation: Predictions vs. Rival (Max + Search Costs)

  The rival view is: *Maximize $U(x) - C(search)$.*
  Your view is: *Satisfy $Threshold(T)$ where $T$ is feasible.*

  **Where they come apart:**
  1.  **The "Costly Comparison" Case:**
      *   *Scenario:* An agent faces 5 options. Search cost is zero (all options displayed). However, the *attributes* are complex and incommensurable (e.g., choosing a spouse, or a career path). Comparing them requires a cognitive operation that exceeds working memory.
      *   *Rival Prediction:* The agent should continue processing until the marginal cost of comparison equals marginal gain. If the cost is internal (cognitive load), the rival model treats this as a cost to be weighed. It implies the agent *could* compare if the stakes were high enough.
      *   *Your Prediction:* If the comparison exceeds the budget, the norm to compare is empty. The agent *must* satisfice. Even with high stakes, if the cognitive architecture literally cannot hold the comparison, maximization is not an option, not just a costly one.
      *   *Constructibility:* This is constructible in principle (tasks exceeding working memory limits, e.g., Miller's 7±2 chunks), but hard to isolate empirically from "high effort."

  2.  **The "Threshold Violation" Case:**
      *   *Scenario:* An agent finds an option that meets the threshold, but has reason to believe a slightly better option exists with minimal search cost.
      *   *Rival Prediction:* Search for the better option (Maximization).
      *   *Your Prediction:* Stop. Once the threshold is met, the rational requirement is satisfied. Searching further is not "more rational," it is category error (like continuing to prove a theorem after the proof is complete).
      *   *Cost of Equivalence:* If you cannot find cases where agents stop at a threshold *despite* low search costs for improvement, your theory is extensionally equivalent to the rival. **If they are extensionally equivalent everywhere, you pay a high cost:** Occam's Razor favors the rival theory because it unifies all choice under one norm (maximization) rather than positing two norms (maximization for easy tasks, satisficing for hard ones). You would be left with a purely phenomenological distinction, not a normative one.

  ---

  ### 4. Testability and Immunity

  **Is the appeal to "budget" untestable?**
  Yes, in its current formulation, it risks being untestable.
  *   **The Problem:** "Budget" is nominally set by the agent and revisable. If an agent fails to maximize, you say "Budget exceeded." If they succeed, you say "Budget sufficient." This is post-hoc rationalization.
  *   **Is it a defect?**
      *   *For a Normative Claim:* It is less of a defect. Normative claims about "Ought Implies Can" are philosophical constraints, not empirical predictions. However, if "Can" is undefined, the constraint is vacuous.
      *   *For a Theory of Rationality:* It is a significant defect. A theory of practical rationality must guide action or evaluate it. If the evaluation depends on an unobservable internal budget that can be adjusted to fit the behavior, the theory cannot criticize any behavior. Every failure becomes a "budget constraint."

  **How to fix it:**
  You must tether "budget" to **objective cognitive constraints** (working memory capacity, processing speed, time pressure) rather than subjective "difficulty."
  *   *Testable Claim:* In tasks exceeding working memory capacity $X$, agents *cannot* maximize (not just don't).
  *   *Risk:* If you tether it too tightly to objective measures, you lose the flexibility to explain why agents sometimes maximize in hard tasks (via scaffolding/tools).

  **Verdict:** Currently, the view is qualified toward immunity. To avoid being a "just-so story," you need independent measures of cognitive budget that are not inferred from the choice behavior itself.

  ---

  ### 5. Addressing the Colleague's Objection (The Hardest Worry)

  You wrote: *"If satisficing is best understood as optimisation over procedures, I am not certain I have a substantive thesis left."*

  **Direct Assessment:**
  Your colleague is logically correct but normatively vulnerable.

  1.  **The Concession:** Formally, she is right. If an agent chooses a satisficing rule *because* it is the best feasible rule, the meta-choice is maximizing. You cannot escape the logic of optimization at the meta-level without claiming the agent chooses procedures *randomly* or *irrationally*, which undermines your claim that satisficing is rational.
  2.  **The Defense (Substantive Thesis):** Your thesis survives only if you insist on a **discontinuity of norms**.
      *   *Standard View:* The norm is always Maximization. Sometimes the *object* of maximization is a rule, sometimes an action.
      *   *Your View:* The norm *changes* based on feasibility.
          *   Feasible Set = Whole Set $\rightarrow$ Norm = Maximize.
          *   Feasible Set = Subset (due to cognitive limits) $\rightarrow$ Norm = Satisfice.
      *   *The Crucial Distinction:* In the Standard View, satisficing is rational *instrumentally* (because it leads to good outcomes/low cost). In Your View, satisficing is rational *constitutively* (because it is the only form of reasoning available).

  **The Fatal Flaw to Watch For:**
  If you justify the choice of the satisficing rule by saying "It maximizes expected utility given constraints," you have surrendered. You are then a standard bounded rationality theorist.
  To maintain your position, you must argue: **"The agent selects the satisficing rule not because it maximizes utility, but because the maximizing rule is not a rule *for her*."**

  **Conclusion on the Colleague:**
  She has identified the weakest link. If you cannot explain why the meta-choice isn't simply another instance of the maximizing norm you reject at the object level, your position collapses into "Constrained Maximization."
  *   **Recommendation:** Do not argue that the agent *optimizes* the procedure. Argue that the agent *adopts* the procedure because it is the only one that maps to the *structure of her agency*. The justification is not "best outcomes," it is "possibility of agency." If you move the justification from *consequences* to *capacity*, you escape her objection. If you keep the justification on *consequences* (even long-term), she wins.
