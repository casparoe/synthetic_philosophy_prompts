answer: |-
  - **Bottom line up front**
  The spec demands a theory that secures the non-accidental truth of introspective reports without violating the causal closure of the physical world. It bites hardest on the link between experience and utterance, requiring more than reliable correlation to count as knowledge. Any view making phenomenal properties causally inert relative to speech centres fails unless it dissolves the distinction between experience and report.

  - **What the theory is for**
  The primary explanandum is the epistemic status of introspective reports. When a subject says, 'There is something it is like to see this red,' the theory must explain what makes this utterance true and why the subject is justified in making it. It is not enough to explain why the speech muscles moved; the theory must account for why the report is about the experience rather than merely coinciding with it. The target is the transition from phenomenal presence to phenomenal knowledge. Consequently, the paradox of phenomenal judgement is not a side issue but the central test case: if experience cannot explain the judgement, the judgement is unmoored from the very thing it claims to describe. The theory must distinguish genuine awareness from mere reliable disposition, ensuring that consciousness is not rendered a silent spectator to its own announcement.

  - **The requirements**

  1.  **Physical Causal Closure**
      Every physical event must have a sufficient physical cause. This is demanded by the apparent completeness of physics; wherever we look in the brain, from photon impact to vocal cord vibration, physical processes suffice to explain the motion. If phenomenal properties were required to complete a physical causal chain where physics was insufficient, we would expect to detect energy deficits or anomalies in neural processing. Since no such gaps are observed in neurophysiology, the theory must accommodate the fact that physical states alone drive behaviour.

  2.  **No Systematic Overdetermination**
      Effects should not have two distinct, sufficient causes unless there is a specific reason for it. If both a neural state and a phenomenal state fully caused a report, every utterance about consciousness would be causally overdetermined. While occasional overdetermination is plausible, systematic overdetermination across all phenomenal reports is implausibly coincidental. The theory must avoid positing that every time you speak about pain, two separate causal chains converge perfectly to produce the same sound.

  3.  **Accuracy of Phenomenal Reports**
      Subjects are generally right when they say they are in pain or seeing red. This is the data point of introspective authority. A theory that implies we are systematically mistaken about our own conscious states contradicts the foundational evidence of the domain. If a view entails that everyone is wrong about whether they are conscious, it defeats the evidence it was meant to explain. The theory must preserve the truth of standard first-person avowals.

  4.  **Non-Accidental Truth (The Proxy Killer)**
      A true report must be connected to the fact it reports in a non-accidental way. This requirement rules out the correlation-proxy reply. If a neural state causes the report and the quale merely rides along via brute psychophysical law, the truth of the report is lucky relative to the quale. Knowledge requires sensitivity or safety; if the quale could change while the neural state (and report) remained fixed, the report would not count as knowledge of the quale. This is a real desideratum, not a taste, because it defines the difference between knowing and guessing correctly.

  5.  **Consciousness Distinct from Report Disposition**
      Being conscious must be distinguishable from being disposed to say one is conscious. This is demanded by the possibility of error and silence. We can be conscious without reporting it, and we can theoretically report it without being conscious (as in complex blindsight or philosophical zombies). If the theory collapses the experience into the disposition to report, it cannot explain the difference between a true report and a mere reflex. The ontology must support the gap between having an experience and talking about it.

  6.  **Ontological vs. Epistemic Gap**
      The theory must specify whether the gap between physical processes and experience is merely about knowledge or about being. This is driven by Mary's Room. If Mary learns something new upon leaving the room, there is an epistemic gap. The theory must decide if this implies new facts (ontological) or new modes of presentation (epistemic). Collapsing this distinction arbitrarily renders the debate unintelligible; the theory must commit to whether physicalism leaves something out of reality or just out of description.

  7.  **Phenomenal Properties Guide Behavior**
      It must appear that experience makes a difference to action. When we withdraw from fire because it hurts, the hurtfulness seems to be the reason. A theory that makes the qualitative character of pain causally irrelevant to withdrawal contradicts the phenomenology of agency. While this might be an appearance, the theory must explain why the appearance is so robust. If experience does no work, the theory must explain why it looks exactly as if it does.

  8.  **Mary's New Knowledge Accommodated**
      The theory must explain what Mary gains upon seeing red. If she gains nothing, the intuition that she learns something is an illusion. If she gains knowledge of a new fact, physicalism is threatened. The theory cannot simply assert she learns nothing; it must explain away the intuition or accommodate the new fact. This case tests whether the theory treats phenomenal concepts as merely different modes of access or as pointers to distinct properties.

  9.  **Zombie Intuition Accommodated**
      The theory must explain why the idea of a philosophical zombie is coherent to us. Even if zombies are impossible, the intuition that they are possible is a datum. A theory that dismisses this as sheer confusion without explaining the source of the confusion is inadequate. The theory must account for why we can conceive of physical duplicates without consciousness, whether this reveals a modal possibility or a cognitive limitation.

  10. **No Physical Omissions**
      Nothing detectable can be missing from the physical description of the world. This is the constraint of causal closure again. If consciousness adds energy or information to the physical world, it should be measurable. Since it is not, the theory must locate consciousness without adding new physical forces. This ensures the view remains consistent with natural science, preventing consciousness from becoming a magical intervention in the physical order.

  - **Prejudices, not desiderata**

  Three standard demands should be demoted to camp-specific tastes. First, **no brute nomic danglers**. This is a physicalist aesthetic preference, not a logical requirement. Russellian monists accept brute connections between intrinsic nature and structural description. Demanding their elimination rules out viable metaphysical structures simply because they look unfamiliar to Humean minds.

  Second, **statable without indexicals or first-person terms**. This is an objectivist bias. Phenomenal facts might essentially involve first-person perspectives. Demanding third-person statability assumes physicalism is true from the outset. A theory adequate to the subject matter may require resources that standard physical descriptions lack.

  Third, **the demand that a theory leave open the possibility that we could have been zombies**. This is a dualist prejudice. Physicalists argue zombies are metaphysically impossible. Insisting that a theory must validate the modal intuition of dualists rigs the game against physicalism. The theory need only explain the intuition, not validate the possibility.

  - **The squeeze**

  Here is the inconsistency: you cannot jointly hold Physical Causal Closure, No Overdetermination, Distinctness of Phenomenal/Physical, and Non-Accidental Truth of Reports. If Closure and No Overdetermination hold, physical states cause reports. If Phenomenal states are Distinct, they do not cause reports. If they do not cause reports, the truth of the reports relative to the phenomena is accidental (violating Non-Accidental Truth). This is where the correlation-proxy reply dies; it accepts Distinctness and Closure, thereby sacrificing the epistemic link required for knowledge.

  You must drop one. Dropping Closure breaks science. Dropping Non-Accidental Truth breaks epistemology, reducing introspection to lucky guessing. Dropping Distinctness is the only viable path. This pushes you toward Russellian Monism or Identity Theory. You must identify the phenomenal property with the intrinsic nature of the physical cause. This preserves Closure (it's physical), preserves Non-Accidental Truth (the cause is the experience), and accommodates Mary (new mode of access to the same nature). Interactionism fails Closure; Epiphenomenalism fails Non-Accidental Truth; Illusionism fails Accuracy. The squeeze forces you to collapse the ontology to save the epistemology.

  - **The killer requirement**

  The Non-Accidental Truth requirement does the most damage. It immediately eliminates Epiphenomenalist Dualism because if qualia do not cause reports, the reports are not knowledge of qualia. It also eliminates the correlation-proxy manoeuvre for the same reason: reliable correlation without causation is luck. It pressures Illusionism, which must argue the reports are not true but merely useful. It forces Realist views to integrate consciousness into the causal chain, ruling out any view that treats experience as a shadow.

  - **Quick scorecard**

  **Epiphenomenalist Dualism:** Fail. Violates Non-Accidental Truth; makes introspective knowledge impossible since qualia cause nothing.
  **Illusionism:** Fail. Violates Accuracy of Reports; denies the existence of the very thing reports claim to describe.
  **Russellian Monism:** Pass. Satisfies Closure and Non-Accidental Truth by identifying experience with intrinsic physical nature.
  **Reductive Functionalism:** Fail. Struggles with Mary's New Knowledge and the Ontological vs. Epistemic Gap; denies the distinctness of feel.
  **Interactionist Dualism:** Fail. Violates Physical Causal Closure; posits unexplained energy injections into the physical world.
