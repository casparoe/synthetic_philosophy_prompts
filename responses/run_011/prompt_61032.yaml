      *(Self-Correction during drafting)*: Be careful not to say "Humans can't know they are consistent." Humans can *believe* it, or know it relative to a stronger theory. The point is they cannot *prove* it within the theory that constitutes them, *if* they are a theory. Step 2 assumes the "surveying" logic is internal to $Prov_A$. That is the break.

      Let's structure the answer clearly around the user's bullet points.

      1.  **The Break:** Step 2. Equivocation between *validating* and *proving*.
