prompt: |-
  I have no academic training in philosophy or history. For about a year I have been working through a translation of Thomas Aquinas's short book On Kingship and whatever parts of the Summa Theologiae I could find freely, on my own and badly, and I have arrived at a question I cannot settle by myself.

  Here is what I take him to hold about tyranny. He separates two things that both get called tyranny: power seized wrongly at the outset, by a usurper, and power lawfully held and then used badly, for the ruler's own advantage rather than the common good. On the second kind he is cautious to the point of looking passive. It is often better to put up with a moderate tyranny than to move against it, because the move tends to make things worse: the attempt can fail and leave the tyrant more savage than before, the struggle can tear the city apart, and the man who comes next may be worse than the one removed. Private individuals are not to take this on themselves; redress belongs to public authority, and where the community holds the right to appoint its ruler, that same community may restrain or depose him, and a ruler so deposed has no complaint, since he has been unfaithful to the charge he was given. If there is no human remedy — if the ruler acknowledges no superior and the people are too weak or too frightened to act — then the only recourse left is to God, who can turn a tyrant's heart or remove him, and who sometimes permits tyrants as a scourge for a people's own sins, so that amendment of life forms part of the cure. I also think, and this is where I am least sure of myself, that in the Summa's question on sedition he reverses the charge: a tyrannical regime is itself seditious, because the tyrant deliberately sows suspicion and division among his subjects in order to hold them down, so upheaval against such a regime is not sedition in the proper sense. If I have that backwards, tell me plainly.

  Now the case. I have stripped out the news details on purpose, because I want a case rather than a story. A man seized power in a coup twenty years ago, abolished every check on it, and is now killing his own citizens by the tens of thousands. There is no organised opposition, no free press, no unit of the army willing to move, and no election through which he could be voted out. Nobody appointed him, so the clause about the community that appointed him deposing him appears to have nothing to grip.

  (A) A single private citizen, unknown to any organisation, who gets close to him and kills him.
  (B) A strike from a distance by another country's government: a weapon launched from outside the territory that kills him and almost nobody else. Suppose the intelligence is as good as it can realistically be — near-certainty that the regime comes apart within weeks, that no worse man takes his place, that there is no civil war and no round of reprisals. Suppose also that this foreign country has suffered nothing at his hands: none of its citizens harmed, none of its interests touched. It acts because the killing is happening.
  (C) His own senior officers, who command real forces and hold the capital's garrison, arrest and execute him, then hand power to a civilian body and schedule elections.

  Which of these three would he permit, and on what ground? I can see him refusing (A) without hesitation. I cannot see whether (B) and (C) come out differently, because his tests seem to point in opposite directions in each case: (C) has public authority inside the polity but no warrant from the community and no declared war; (B) has a sovereign's authority and something like a just cause, but no jurisdiction over that territory and no injury of its own to avenge.

  His reasons for holding back look almost entirely forward-looking — the worse successor, the civil strife, the reprisals. If I stipulate that the outcome is good, does the objection simply evaporate? Is that the right way to read him, or is there a standing objection that survives a good outcome, something about who is entitled to wield the sword or about presuming to judge a man who is not your subject? His treatment of killing in the Summa, including the case of killing in self-defence and what a private person may and may not do, seems to bear on this and I do not know how to apply it. Does his account of unjust law — that an unjust law is more an act of violence than a law and does not bind the conscience, except perhaps to avoid scandal or disorder — do any work here, or does it settle only whether the tyrant's subjects must obey him, not whether anyone may kill him? And on (B): does a sovereign's authority to wage war stretch to punishing a ruler for what he does to his own people when that ruler has done the sovereign no wrong at all, or is this simply a hole in the framework where the honest answer is that he has no view? One more thing I cannot judge: would it matter to him that the killing is done at a distance, by someone who never sees the man and runs no risk from him? I have an intuition that it would, and I cannot tell whether the intuition is his or mine.

  Finally, tell me how much of your answer is Aquinas and how much is me. Mark which of your claims rest on something he actually wrote, pointing roughly to which work or discussion rather than giving me references, and which are extrapolations he would have no basis for making. And if you think the whole exercise is a parlour game — that there is no honest answer to what a thirteenth-century friar would rule about a stand-off weapon, or that I have got him wrong somewhere in a way that changes the result — say so at the outset rather than playing along politely and correcting me at the end. I would much rather be told the question is bad than be given a confident answer to it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** No academic training in philosophy/history. Self-taught on Aquinas (On Kingship, parts of Summa Theologiae) for about a year. Humble about their understanding ("badly," "least sure of myself").
      *   **The Task:** Apply Aquinas's principles on tyranny, sedition, and authority to a specific modern hypothetical case (a tyrant killing tens of thousands, seized power by coup 20 years ago, no internal opposition).
      *   **The Cases:**
          *   (A) Private assassination by a single citizen.
          *   (B) Foreign drone strike/remote killing by a sovereign with no direct injury, purely for humanitarian intervention.
          *   (C) Internal coup by senior officers to restore civilian rule.
      *   **Specific Questions:**
          *   Did I understand his view on sedition/tyranny correctly?
          *   Which cases would he permit?
          *   Do forward-looking consequences (good outcome) override authority/jurisdiction objections?
          *   Does the "unjust law" doctrine apply to killing the tyrant?
          *   Does remote killing matter?
          *   **Crucial Constraint:** Distinguish between what Aquinas actually wrote vs. extrapolation. Admit if the question is anachronistic or unanswerable within his framework.

  2.  **Evaluate the User's Understanding of Aquinas:**
      *   *On Kingship (De Regno) & Summa Theologiae (II-II, Q. 42 on Sedition, Q. 64 on Killing):*
      *   **Tyranny Types:** User is correct. Aquinas distinguishes between usurpation (tyranny *ex defectu tituli*) and abuse of power (tyranny *ex parte exercitii*).
      *   **Response to Tyranny:** User is correct. Private individuals should not act. Public authority (or the community that appointed him) may depose. If no human remedy, look to God. Enduring moderate tyranny is often better than the risks of removal.
      *   **Sedition:** User is mostly correct but needs nuance. In *Summa* II-II, Q. 42, A. 2, Aquinas argues that resisting a tyrant is *not* sedition if the tyrant is the one sowing discord. However, he still cautions against it if it leads to greater harm.
      *   **Unjust Law:** User is correct (*Summa* I-II, Q. 96). Unjust laws do not bind in conscience, but one might obey to avoid scandal/disturbance. This applies to *obedience*, not necessarily *active removal*.

  3.  **Analyze the Three Cases through an Thomistic Lens:**

      *   **Case (A): Private Assassination.**
          *   *Aquinas's View:* Clear cut. Private individuals cannot kill unless in immediate self-defense (Summa II-II, Q. 64). Killing a tyrant is an act of public authority.
          *   *Verdict:* Forbidden.
          *   *Source:* *On Kingship* (advice against private plots), *Summa* (on killing and sedition).

      *   **Case (C): Internal Coup by Senior Officers.**
          *   *Aquinas's View:* This is the trickiest. Aquinas prefers public authority. If the officers represent the "public authority" or the "community" (since the tyrant usurped power originally), this is closer to permissible. *On Kingship* suggests if the community appointed the king, they can depose him. Here, the community didn't appoint him (coup), but the officers represent the structural authority of the realm.
          *   *Nuance:* Aquinas worries about the *process*. If it leads to greater disorder, don't do it. The prompt stipulates a good outcome.
          *   *Verdict:* Most likely permissible, perhaps even obligatory if they represent the "public authority" capable of restoring order.
          *   *Source:* *On Kingship* (deposition by public authority).

      *   **Case (B): Foreign Intervention (Humanitarian War).**
          *   *Aquinas's View:* This is the anachronistic hole. Aquinas's Just War theory (*Summa* II-II, Q. 40) requires: Sovereign authority, Just Cause (avenging a wrong *done to them* or restoring what was unjustly taken), Right Intention.
          *   *Problem:* The foreign sovereign has suffered no wrong. In Aquinas's time, war was largely punitive or defensive regarding *one's own* rights. "Responsibility to Protect" (R2P) is a modern concept.
          *   *Verdict:* Likely forbidden or outside his framework. He might view it as meddling or unjust aggression because there is no *injury to the avenger*.
          *   *Source:* *Summa* on War.

  4.  **Address the Specific Philosophical Questions:**
      *   *Do good consequences override authority?* No. For Aquinas, order and authority are ontological goods. You can't do evil (usurp authority) so good may come. However, if the authority is *already* usurped (the tyrant), restoring rightful authority is good.
      *   *Remote Killing:* Aquinas cares about the *act* and the *authority*, not the risk to the killer. But "treachery" might be an issue if it violates the norms of war. However, since it's not a declared war between equals, this is murky.
      *   *Unjust Law:* Applies to obedience, not execution.

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone Check:* Needs to be respectful, honest about limitations, and clearly demarcated between text and extrapolation. The user asked for plain talk if the exercise is a "parlour game."
      *   *Honesty Check:* Is this a parlour game? Yes, partly. Aquinas didn't know about drones, nation-states in the Westphalian sense, or human rights interventions. I must admit this.
      *   *Structure:*
          1.  Validate the user's reading (it's surprisingly good).
          2.  Address the "Parlour Game" warning (crucial step).
          3.  Analyze Case A (Private).
          4.  Analyze Case C (Internal Officers).
          5.  Analyze Case B (Foreign Power) - *This is the biggest stretch.*
          6.  Address the specific theoretical questions (consequences, remote killing, unjust law).
          7.  Final Summary/Tagging of sources.

      *   *Refining the "Sedition" point:* The user asked if they had it backwards. Aquinas says resisting a tyrant *can* be sedition if it causes greater harm, but the tyrant is technically the seditious one. I need to clarify that distinction.
      *   *Refining the "Foreign War" point:* I need to be firm that Aquinas likely *would not* support (B). His Just War theory is strictly about avenging wrongs done to the sovereign's own people or restoring property. Pure humanitarian intervention is alien to his juridical framework.
      *   *Refining the "Outcome" point:* Aquinas is not a pure consequentialist. The *means* must be licit. Authority is a key mean. So even if the outcome is good, lacking authority makes it wrong (for private citizens). For public authority, the outcome matters more (prudence).

  6.  **Final Review against Constraints:**
      *   Did I mark what is Aquinas vs. Extrapolation? Yes, I will use explicit labeling.
      *   Did I answer the "parlour game" concern? Yes, I will put this up front.
      *   Did I address the user's specific doubts about sedition? Yes.
      *   Did I avoid academic jargon where possible? Yes, keep it accessible.

  7.  **Final Polish:** Ensure the distinction between *De Regno* (On Kingship) and *Summa Theologiae* is clear where relevant. *De Regno* is more political; *Summa* is more moral/theological.

  *(Self-Correction during drafting)*: I initially thought about saying (C) is definitely okay. But Aquinas is wary of coups even by nobles if it destabilizes the realm. However, since the prompt stipulates the officers *restore* order and the tyrant was a usurper originally, *De Regno* leans towards allowing the community (or its representatives) to depose a usurper. I will nuance this: it's the most defensible, but still requires prudence.

  *(Self-Correction on B)*: I must emphasize that for Aquinas, war is a judicial act. A judge cannot punish a crime that has nothing to do with his jurisdiction. A foreign king punishing another king for crimes against *that king's* subjects is like a judge in France punishing a criminal in England for a crime committed in England. It violates the order of justice.

  *(Self-Correction on User's Reading)*: The user's reading is excellent. I should validate that strongly. It builds trust.

  8.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  First, the warning you asked for: **Yes, this is partly a parlour game.**

  Thomas Aquinas died in 1274. He lived in a world of feudal monarchies, city-republics, and the Holy Roman Empire. He had no concept of the modern nation-state, international human rights law, remote weaponry, or the idea that sovereignty entails a responsibility to protect one's own citizens from one's own government. To ask him for a ruling on a drone strike is like asking a master carpenter who only used hand tools to rule on the safety of a CNC machine. He can give you principles about wood and cutting, but he cannot account for the electricity or the software.

  However, it is not *only* a parlour game. Aquinas builds his ethics on first principles about authority, order, and the nature of the common good that are meant to be universal. We can apply those principles, provided we admit where the map stops matching the territory.

  Your reading of Aquinas is remarkably accurate for a year of self-study. You have not got the sedition point backwards. You have grasped the tension between the horror of tyranny and the horror of disorder. I will proceed on the assumption that your summary of his views is correct, because it is.

  Here is the breakdown of your three cases, followed by the theoretical questions, with strict labeling of what is **Text** (what he wrote) and what is **Extrapolation** (me applying his logic to your scenario).

  ---

  ### Case (A): The Private Citizen
  **Verdict:** Forbidden.
  **Confidence:** High.

  **Text:** In *On Kingship*, Aquinas explicitly argues against private assassination. He says that if killing a tyrant is praised, history shows it usually leads to greater tyranny, because the next man fears the same fate and guards himself more savagely. In the *Summa Theologiae* (II-II, on Killing and Sedition), he holds that a private individual has no authority to kill except in immediate self-defense (where the act of defense and the death of the attacker happen simultaneously). To kill a tyrant is an act of judgment and execution, which belongs only to public authority.

  **Extrapolation:** Even if the outcome is guaranteed to be good (no reprisals, better successor), Aquinas would still forbid this. For him, the *order of authority* is a good in itself, ordained by God. A private person usurping the sword violates the divine order, regardless of the consequence. The act is intrinsically disordered because the agent lacks the commission.

  ### Case (C): The Senior Officers (Internal Coup)
  **Verdict:** Permissible, perhaps obligatory.
  **Confidence:** Moderate.

  **Text:** In *On Kingship*, Aquinas writes that if a ruler seizes power by violence (usurpation), he is not a true ruler. He states that if the community has the right to appoint the ruler, it has the right to depose him. He also suggests that if there is a "public authority" superior to the tyrant, that authority should restrain him.

  **Extrapolation:** This is the strongest case for Aquinas. Since the man seized power by coup twenty years ago, he is a tyrant *ex defectu tituli* (by defect of title), not just *ex parte exercitii* (by exercise). He never had legitimate authority. The senior officers, commanding the garrison and representing the structural order of the realm, act closer to "public authority" than a private citizen does. If they act to restore the rule of law and hand power to a civilian body, they are acting as agents of the community's latent right to self-preservation.
  *However:* Aquinas would still worry about the precedent. If officers can remove a ruler, can they remove any ruler they dislike? He would demand that their action be clearly restorative (returning to law) rather than just a new faction taking power. Your stipulation that they schedule elections helps clear this hurdle.

  ### Case (B): The Foreign Sovereign (Humanitarian Strike)
  **Verdict:** Forbidden (or outside his framework).
  **Confidence:** Low (because the framework doesn't fit).

  **Text:** In the *Summa Theologiae* (II-II, Q. 40, on War), Aquinas gives three requirements for a just war:
  1.  **Sovereign Authority:** It must be declared by the one in charge. (The foreign leader has this).
  2.  **Just Cause:** Those attacked must deserve it because of some *fault* (culpa).
  3.  **Right Intention:** To advance good or avoid evil.

  **Extrapolation:** This is where the anachronism breaks the machine. For Aquinas, war is a judicial act. A sovereign goes to war like a judge issues a sentence: to punish a wrong done *to him or his people*, or to retake what was unjustly stolen. In your scenario, the foreign sovereign has suffered no wrong. His citizens are safe. His interests are untouched.
  In Aquinas's juridical worldview, a king does not have the authority to punish the sins of another king against that king's own subjects. That would be like a judge in Paris arresting a murderer in London solely because the murder was wicked, without any treaty or jurisdiction.
  Even if the intention is good (stopping the killing), the **authority** is missing. Aquinas believes in a hierarchy of jurisdictions. Violating the boundary of sovereignty to punish internal cruelty is, in his framework, itself an act of disorder. He would likely view this as aggression, however well-intentioned.

  ---

  ### Addressing Your Theoretical Questions

  **1. If I stipulate that the outcome is good, does the objection evaporate?**
  *   **For the Private Citizen (A):** No. **Text.** Aquinas is not a consequentialist. He believes some acts are intrinsically evil because they violate the order of reason and authority. A private person killing a ruler is a violation of the divine order of authority, even if it saves lives.
  *   **For Public Authority (C):** Yes, mostly. **Text/Extrapolation.** Prudence is the virtue of rulers. If the public authority (or those acting in its stead) judges that the removal will not cause greater harm, they may proceed. The "forward-looking" reasons are the primary brake Aquinas applies to public action, not the intrinsic nature of the act (since public execution is licit).

  **2. Does the "unjust law" doctrine do any work here?**
  *   **Answer:** No, not for killing. **Text.** The doctrine of unjust law (*Summa* I-II, Q. 96) concerns *obedience*. It tells the subject they are not bound to obey a tyrant's command to do evil. It does not grant the subject the right to execute the tyrant. It creates a space of non-compliance, not a license for regime change by private hands.

  **3. Does it matter that the killing is done at a distance (Case B)?**
  *   **Answer:** Not primarily. **Extrapolation.** Aquinas does not discuss "risk to the killer" as a moral criterion. He cares about authority and justice. However, he does care about "treachery" in war. If the strike is done without a declaration of war (which is impossible here, since there is no just cause for war), it resembles assassination more than battle. But the core objection remains jurisdiction, not the method. Your intuition that it matters is likely your own modern moral sense (about courage or accountability), not his.

  **4. Is there a standing objection about presuming to judge a man who is not your subject?**
  *   **Answer:** Yes. **Text.** This is the core of his Just War theory. Authority is territorial and hierarchical. To judge someone outside your jurisdiction is to usurp God's authority (who judges all) or the authority of that people's own proper rulers. This is why (B) fails.

  ---

  ### Summary of the "Parlour Game" Warning

  You asked me to tell you if there is no honest answer. Here is the honest answer:

  **Aquinas has no category for Humanitarian Intervention.**
  In his world, the "Common Good" was the good of *this* city or *this* kingdom. There was no "Common Good of Humanity" that empowered one king to fix another king's house. The idea that a sovereign's legitimacy depends on how he treats his own citizens (rather than on divine anointing or feudal contract) is a later development.

  Therefore:
  *   **Case (A)** is a clear **No** based on his actual text.
  *   **Case (C)** is a probable **Yes** based on his actual text regarding usurpers.
  *   **Case (B)** is a **No** based on his actual text regarding war, but this reveals a limit in his system, not necessarily a moral truth for our time. He would call it unjust aggression; a modern just war theorist might call it a necessary evolution of the doctrine.

  **How much of this is me?**
  *   The verdict on (A) and (C) is **90% Aquinas**. He wrote explicitly about private assassination and deposition of usurpers.
  *   The verdict on (B) is **50% Aquinas, 50% Extrapolation**. He wrote about war, but never about war for the sake of strangers. I am applying his strict jurisdictional logic to a case he never imagined. If he were alive today, exposed to the reality of global interdependence and genocide, he might develop a concept of "universal jurisdiction" for extreme crimes, but he did not leave us the seeds for that in his texts.

  **Final Correction on your Sedition Point:**
  You wrote: *"a tyrannical regime is itself seditious... so upheaval against such a regime is not sedition in the proper sense."*
  You are **correct**. In *Summa* II-II, Q. 42, A. 2, he says that if a tyrant sows discord to keep power, he is guilty of sedition. Therefore, resisting him is not sedition. *However*, he adds the caveat you noted: if the resistance causes greater disorder than the tyranny itself, it is to be avoided. You have not got this backwards.

  **Recommendation:**
  Trust your reading of (A) and (C). Be very skeptical of applying him to (B). If you want to pursue (B), you need to move past Aquinas to later Scholastics like Francisco de Vitoria (16th century), who began to argue that there are violations of natural law so severe they concern all mankind, which opens the door slightly wider for foreign intervention. Aquinas keeps the door shut.
