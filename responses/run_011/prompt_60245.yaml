  3.  **Reject Generalization:** Attack (8). Threshold deontology forbids certain acts regardless of outcomes. Virtue ethics focuses on character, not total causal chains. These views aren't hostage to far-future calculus. This saves non-consequentialist views from (9), though consequentialism remains pressured unless repaired via (1) or (2). This limits the scope of the skepticism rather than solving it globally, preserving common sense for non-consequentialists. It concedes that consequentialism might be uniquely vulnerable to cluelessness, but denies that this vulnerability infects all normative reasoning.

  - **The cost of keeping (5)**
  If you insist on total ignorance (5), you cannot use total value to guide action. You must abandon maximizing consequentialism for something like satisficing or rule-following. You commit to the view that moral "righteousness" (objective rightness) is unknowable, even if some acts are obviously "better" locally. You survive by separating *objective rightness* (unknowable) from *subjective justification* (based on limited info). You keep (5) but must reject (2) or (7), accepting that you act on proxies, not truth. You become a skeptic about moral truth but a pragmatist about moral action, relying on heuristics rather than calculation. You concede that you never know if an act is truly *right*, only that it is *reasonable*.

  - **Bottom line**
  "The argument fails because symmetric ignorance cancels out in expectation, leaving near-term consequences to decide. We justify acts based on expected value, not omniscient totals. You are justified in believing kicking the dog is wrong because the expected far-future noise cancels, leaving the near-term pain to dominate the calculation."
