  You are right to feel uncertain. The record is consistent in its *outcomes* but ambiguous in its *reasoning*. You have six decisions that split perfectly 3–3 on two different axes, and until now, those axes have moved in lockstep.

  Here are the two candidate rules that both fit your six prior verdicts perfectly:

  **Rule A: The "Local Standing" Doctrine.**
  *   **Principle:** We remove names when the petitioners are local stakeholders who bear the specific burden of the honoree's legacy. We keep names when the petitioners are outsiders (state societies, national orgs, environmental groups) advocating on behalf of others.
  *   **Fit:** In every "Remove" case (Clerk, Sheriff, Superintendent), the petitioners were locals directly impacted (descendants using the records, labor council using the fairgrounds, parents in the school). In every "Keep" case (Judge, Doctor, Benefactor), the petitioners were external entities with no daily stake in the site.
  *   **Verdict on New Case:** **Remove.** The petitioners are East Side residents, bus riders, and relatives of the victims. They are the exact demographic harmed, using the space daily.

  **Rule B: The "Functional Irony" Doctrine.**
  *   **Principle:** We remove names when the facility's current function contradicts the honoree's legacy or perpetuates the harm. We keep names when the harmful institution is abolished, sold, or unrelated to the building's current use.
  *   **Fit:** In every "Remove" case, the harm is structurally embedded in the current operation (Records annex still uses the clerk's indexes; Sheriff's office still uses the "posse" name; School still uses the segregationist zone map). In every "Keep" case, the harmful mechanism is gone (Labor program abolished, clinic sold, hospital sold, tannery fortune distinct from land gift).
  *   **Verdict on New Case:** **Keep.** The volunteer corps is disbanded. Dispatch is regionalized. The county only leases the space. The specific function the Chief controlled (fire response) is no longer housed there. The "irony" is attenuated.

  ### The Closest Analog
  **Case 6 (2023 — Superintendent/School)** is the closest analog.
  *   **Why:** Both involve racial exclusion in the delivery of a public service (education vs. fire safety). Both involve a citation that credits general tenure ("forty years in schools" / "founding volunteer corps") while ignoring the specific discriminatory acts. Both involve petitioners who are current users of the facility (parents / bus riders and association members).
  *   **The Feature Doing the Work:** In Case 6, the deciding feature was that the **structural harm remained in place** (the zone map). In the Fire Chief case, the structural harm (dispatch refusal) is gone, but the **symbolic harm remains in place** (the sign over the bus loop).

  If you vote **Remove**, you are prioritizing **Case 4 (Sheriff)** over Case 6. In Case 4, the Arch was on the Fairgrounds, not the Sheriff's office, yet you removed it because the Labor Council felt the weight of it *where they worked*. You ruled that the *petitioners' experience* mattered more than the *building's function*.

  If you vote **Keep**, you are prioritizing **Case 2 (Doctor)** over Case 4. In Case 2, you kept the bronze despite the sterilization testimony because the clinic was sold and the inscription focused on the free clinic. You ruled that the *severance of the institution* mattered more than the *petitioners' offense*.

  ### Recommendation for Consistency
  If you want to be consistent with your **petitioner profile** (Rule A), you must vote **Remove**. The "Local Standing" signal is the strongest thread in your minutes. You have never removed a name when the petition came from outsiders, and you have never kept one when the petition came from direct local victims. The Fire Chief petition fits the "Local Victim" profile perfectly.

  However, if you vote Remove, you are subtly shifting from Rule B to Rule A. You are establishing that **dignity for local users outweighs institutional continuity.** This is a defensible principle, but it is a change from the "Functional Irony" logic that protected the Doctor and the Benefactor.

  ### The Ambiguity
  The record genuinely does not decide this. In your first six cases, "Local Standing" and "Functional Irony" were always present together in Removals, and always absent together in Keeps. You have never faced a case with Local Standing *without* Functional Irony. This Fire Chief petition is that case.

  *   **If you Remove:** You commit the Commission to the principle that **names must not alienate the immediate community,** regardless of whether the specific harmful institution still exists. You are ruling on *atmosphere and stakeholder dignity*.
  *   **If you Keep:** You commit the Commission to the principle that **names are historical markers of function,** and removal requires proof that the county still benefits from the specific harm. You are ruling on *administrative continuity*.

  ### The Crucial Case
  To settle which rule you have actually been running all along, you need a petition that splits these variables. The next petition that will clarify your identity is this one:

  **A local park named for a 1950s county commissioner who explicitly barred Black residents from using county parks. The parks have been integrated for fifty years. The commissioner's policies are long dead. The park is now just grass and benches, with no administrative function. A petition arrives from the descendants of the excluded families, who live in the neighborhood and use the park weekly.**

  *   **If you Remove:** You admit you have been running on **Local Standing** all along. The Fire Chief vote was consistent.
  *   **If you Keep:** You admit you have been running on **Functional Irony** all along. The Fire Chief vote (if Remove) would have been an anomaly, or the Fire Chief vote (if Keep) confirms that without ongoing structural harm, local standing is not enough.

  Watch that one. It will tell you who you are.
