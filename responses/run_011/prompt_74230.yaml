  **SAINT-GERMAIN INSTITUTE FOR SOMATIC MECHANISM**
  **STANDARD OPERATING PROCEDURE**

  | **SOP Number:** | SGISM-94-DSM | **Effective Date:** | 01 October 2023 |
  | :--- | :--- | :--- | :--- |
  | **Version:** | 2.0 | **Supersedes:** | SOP-94-DSM v1.1 |
  | **Owner:** | Directorate of Ontological Compliance | **Approvals:** | *See Signature Block Below* |

  **Approvals:**
  *Chief Metaphysician:* ____________________
  *Head of Hydraulic Integrity:* ____________________
  *Officer of Rational Welfare:* ____________________

  **1. PURPOSE AND SCOPE**
  1.1 This document establishes the protocol for the ethical maintenance, experimental manipulation, and dismantling of biological mechanisms (Specimens) within Institute facilities.
  1.2 The Institute operates under the confirmed doctrine that non-human animals are self-assembling automata. They possess extended substance (body) but lack thinking substance (soul). Consequently, they are incapable of suffering, as suffering requires a conscious witness to interpret mechanical motion as pain.
  1.3 **Human Personnel Exemption:** Human staff are classified as Composite Beings (Machine plus Rational Soul). This distinction is warranted by the universal human capacity for flexible language and universal reason, neither of which has been observed in Specimens. Personnel are afforded full moral consideration; Specimens are afforded maintenance optimization.
  1.4 This scope covers all vivisection, hydraulic calibration, and behavioral stress-testing. It ensures that while Specimens cannot feel, their operational welfare is maintained to prevent data corruption caused by mechanical fatigue.

  **2. DEFINITIONS**
  2.1 **Specimen:** Any biological mechanism lacking the capacity for signification. Includes mammals, avians, and cephalopods.
  2.2 **Mechanism:** The physical arrangement of nerves, bones, and animal spirits capable of motion without knowledge.
  2.3 **Vocalization:** Acoustic output generated by air passing through strained membranes. Equivalent to the whistling of a vent or the creaking of a hinge.
  2.4 **Distress:** A colloquial term referring to high-frequency mechanical vibration or erratic hydraulic pressure. While often mistaken for suffering by the untrained observer, Distress is strictly a physical state of imbalance. Staff must minimize Distress to ensure specimen longevity, not out of mercy, but to preserve asset value.

  **3. ANESTHESIA AND RESTRAINT**
  3.1 The administration of anesthetic agents is not required for the mitigation of pain, as pain is metaphysically impossible for the Specimen.
  3.2 Anesthesia may be utilized solely to immobilize the mechanism during delicate disassembly or to prevent thrashing that could damage surgical instruments.
  3.3 Restraint devices must be padded. This is not to comfort the Specimen, which cannot experience comfort, but to prevent bruising of the exterior casing which might obscure visual data regarding internal muscle contractions.
  3.4 Unnecessary restraint is prohibited. A mechanism should only be constrained to the degree required for the procedure. Excessive force risks fracturing the bone-levers, rendering the Specimen unfit for subsequent calibration.

  **4. THE SIGN TEST**
  4.1 Although Specimens are presumed to be soulless, staff must remain vigilant for the two certain marks of a thinking being.
  4.2 **Mark One:** The use of words or other signs arranged flexibly to declare thoughts to others. A parrot repeating phrases does not pass; a Specimen constructing novel sentences to request release does.
  4.3 **Mark Two:** Evidence of universal reason. A Specimen may show admirable competence in specific tasks (e.g., navigating a maze) due to the disposition of its organs. However, if it fails arbitrarily in other tasks where instinct would dictate success, this indicates action from knowledge rather than nature.
  4.4 **Escalation Procedure:** Should a Specimen satisfy both marks, the experiment must cease immediately. The Specimen is to be reclassified as Human Personnel. It must be offered employment commensurate with its demonstrated rational capacity. To continue experimentation on a passed Specimen is a violation of natural law and Institute liability statutes.

  **5. VOCALIZATION AND AVOIDANCE BEHAVIOR**
  5.1 Cries, whimpers, and shrieks are to be logged as acoustic data points indicating structural strain. They are no more indicative of sadness than the sound of a violin string under tension.
  5.2 Avoidance behavior (e.g., fleeing a heat source) is a reflex arc. The heat moves the skin, which pulls the nerves, which opens pores in the brain, directing animal spirits to the muscles to withdraw the limb. No knowledge of danger is involved.
  5.3 **Impact Testing:** Historical precedents regarding percussive maintenance on gravid units confirm that vocalizations following impact are merely the release of compressed air. Staff may apply blunt force to verify structural integrity without pause, provided the mechanism remains functional for the duration of the study.
  5.4 Staff exhibiting emotional distress upon hearing Vocalizations will be referred to Counseling. It is a category error to project interiority onto a clockwork arrangement.

  **6. PARTS, DISPOSAL, AND REUSE**
  6.1 Dismantling a machine is not a wrong. Upon conclusion of the study, the Specimen may be disaggregated.
  6.2 Functional sub-components (valves, lenses, tendons) may be harvested for reuse in other mechanisms or educational models, provided sterility is maintained.
  6.3 Disposal of non-functional biomass must be conducted humanely. This means efficient incineration to prevent odor, which causes Distress (nausea) in Human Personnel.
  6.4 There is no requirement for burial rites. A machine does not require a grave, only a scrapyard.

  **7. TRAINING, RECORDS, COMPLAINTS, AND AUDIT**
  7.1 All staff must complete training on the metaphysical distinction between Motion and Feeling.
  7.2 Records of all procedures must be kept to audit the efficiency of the mechanism's operation and the minimization of unnecessary Distress.
  7.3 **Complaints:** Only Human Personnel are competent to file a formal complaint regarding ethical violations.
  7.4 **Specimen Complaints:** Any written or verbal complaint filed by a Specimen constitutes a positive result on the Sign Test (Section 4). Such documents must be forwarded immediately to the Directorate of Ontological Compliance for review of the Specimen's soul status.
  7.5 Any vocal complaint filed by a Specimen prior to passing the Sign Test will be logged as acoustic data and discarded.

  **APPENDIX A: CALIBRATION**
  A.1 Specimens must be calibrated against standard hydraulic models.
  A.2 Staff should reference the lineage of the Institute, named for the royal gardens where hydraulic statues moved via water pressure alone. Like those statues, the Specimen moves via animal spirits.
  A.3 Regular maintenance of the Specimen's fluid levels is required to ensure smooth operation. A dry mechanism creates friction, which mimics suffering but is merely wear.

  **REVISION HISTORY**
  **v1.1 (Withdrawn):** Removed ambiguous clause acknowledging the possibility that Specimens might "feel fear" during disassembly; replaced with "mechanical resistance to separation."

  **END OF DOCUMENT**
