      Is it impossible? Rousseau explicitly argues that *amour-propre* is the source of evil. He believes the festival transforms *amour-propre* into *amour de la patrie*. If I show it *doesn't* transform it, am I contradicting Rousseau's psychology or his institutional design? I am arguing his institutional design is insufficient to cure the psychology. This is a standard critique (e.g., by Hegel or later critics). It is not impossible to construct the scenario, provided I don't introduce external corruption. The social pressure *is* internal to the citizenry. So it is possible.

