      *   *Key Feature:* **The Spectacle of the Self within a Hierarchy of Visibility.** Even without actors, *being seen* by the multitude creates a market for attention.

  6.  **Rousseau's Defense:**
      *   He would argue: "You made it competitive. I said *simple* games."
      *   Counter: Competition is natural to youth (Rousseau admits this in *Emile*).
      *   Can he distinguish? He relies on *intention* and *simplicity*. If the harm comes from human nature (*amour-propre*) rather than institutional structure (theater), his critique of theater collapses into a critique of society.
      *   *Crucial Point:* If the festival fails for the same reasons as the theater, then the problem isn't the *stage*, it's the *assembly*. This links to his suspicion of representation.

  7.  **Verdict:**
      *   Who is right? The User (mostly). The Friend is right that *professionalism* exacerbates it, but wrong that removing it *solves* it.
      *   Nuance: Rousseau knows *amour-propre* is the root. He thinks the festival channels it into *amour de la patrie*. The scenario shows it can channel into factional status.
      *   Flagging Contested Readings: Mechanism (b) is the shakiest. Rousseau thinks theater *softens* virtue by substituting sentiment for action. Does the festival do the same? Yes, if the sentiment is self-congratulatory.

