      *   Check "Impossible?": Is it impossible? No, social pressure exists in free societies.

  9.  **Final Polish:**
      *   Make sure the distinction between "actor" and "citizen displaying virtue" is blurred enough to show the harm, but distinct enough to remain compliant.
      *   Ensure the "Pity" harm is clear. (Weeping for the dead, ignoring the living).
      *   Ensure the "Labor" harm is clear. (Lost wages, cost of sashes).
      *   Ensure the "Amour-propre" harm is clear. (Inner vs Outer ring).

      *(Self-Correction during drafting)*: I need to be careful with Mechanism (b) "Inflaming Passions." Rousseau argues theater inflames passions by depicting them. The festival is supposed to unify. If the festival inflames *factional* passion (inner vs outer), that works.
      *(Self-Correction on Pity)*: Rousseau says theater makes us pity fictional characters so we don't have to pity real ones. In the festival, we pity *ancestors* (abstract) so we don't pity *widows* (concrete). This fits.

