answer: |-
  **The Scenario**

  The city gathers on the Plainpalais for the Annual Covenant, commemorating the founding oath. There is no stage; the citizens form a great concentric ring, dancing the roundel to the sound of drums. Every household has contributed a garland for the central stake, and every citizen wears a sash of the civic colors. To ensure the spectacle is truly public, the magistrates have declared the day a holiday, and no shops are to open. The dancing is unchoreographed, yet as the day wears on, the inner rings tighten. Young men compete to lead the steps, not by appointment but by vigor; young women compete to place their garlands highest on the stake, not by lottery but by reach and beauty. The elders sit on the periphery, watching the vigor of the youth, weeping for the founders whose names are invoked, while the widows of the militia stand just behind the inner ring, unseen in the shadow of the dancers. By evening, the stake is heavy with silk ribbons bought specifically for the occasion, and the taverns nearby have done a brisk trade in wine to sustain the dancing.

  A week later, the city is quieter. The ribbons on the stake have faded. Three households are in debt over the cost of new sashes and the lost day's wages. The young men who led the dance walk with a swagger, claiming a precedence they now expect in the militia muster; those who were pushed to the outer ring resent the exclusion, whispering that the inner circle was rigged by kinship. The tears shed for the founders have not translated to alms for the widows who stood in the shadow; the sentiment was spent in the singing. The passion for the city remains, but it has crystallized into a passion for precedence within the city. The festival did not corrupt the morals by introducing vice, but it hardened the existing inequalities by dressing them in the garb of civic virtue.

  ***

  **The Audit**

  **Mechanism (a): Pity without Relief.**
  *Status: Fires.* The citizens weep for the founders (abstract, unreachable objects) while ignoring the widows (concrete, reachable objects) standing in their shadow.
  *Rousseau Collision:* Rousseau argues theater makes pity "sterile" because it is directed at fiction (*Letter*, §14). Here, the object is real (the dead founders, the living widows), but the *structure of the spectacle* directs attention to the symbolic center (the stake) rather than the human periphery. The emotion is discharged in the collective song, satisfying the duty of memory without requiring the cost of charity.
  *Contested Reading:* This leans on the interpretation that Rousseau believes *any* collective emotion risks becoming cathartic substitution. He implies festivals unite feeling and action, but does not explicitly prove the feeling won't be spent on the ritual itself.

  **Mechanism (c): *Amour-propre* and Display.**
  *Status: Fires.* The "inner ring" becomes a site of honor; the "outer ring" a site of exclusion. Citizens compete for visibility not as paid actors, but as "virtuous participants."
  *Rousseau Collision:* Rousseau claims that when "there are no spectators, everyone is a performer," vanity dissolves into shared joy (§22). This scenario demonstrates that visibility is a scarce resource even in a circle. If I am seen by more eyes, or seen more clearly, I gain status. The absence of a proscenium does not eliminate the hierarchy of attention.
  *Contested Reading:* This assumes *amour-propre* is driven by *visibility* rather than merely *role*. Rousseau might argue that if the competition is for "vigor" or "virtue," it is benign emulation (*émulation*), not toxic vanity. The scenario asserts the line between the two is porous.

  **Mechanism (d): Labor and Expenditure.**
  *Status: Fires.* Lost wages from the holiday; debt from silk ribbons and sashes.
  *Rousseau Collision:* Rousseau admits festivals cost time but argues they are cheaper than theaters (§20). He assumes simplicity will be self-enforcing. The scenario shows social pressure ("everyone wears a sash") creates a market for distinction even without ticket prices.
  *Contested Reading:* This is the least contested. Rousseau acknowledges the risk of luxury but trusts republican mores to curb it. The scenario suggests mores are insufficient against the logic of display.

  *(Mechanism (b) [Inflaming Passions] is partially present in the factionalism of the rings, but I rely primarily on a, c, and d to avoid overreach.)*

  **The Structural Feature**
  The single structural feature doing the work is **the Hierarchy of Visibility within a Mass Assembly.**
  Even without a stage, a crowd large enough to have an "inside" and an "outside" creates a gradient of attention.
  *Test:* If you remove this feature by shrinking the assembly to a size where everyone is equally visible (e.g., a single neighborhood block), the harms dissolve. There is no "outer ring" to resent the "inner ring." If you substitute competitive activity (races) for expressive activity (dancing), the harms shift but remain (winners/losers). If you eliminate the focal object (the stake), the assembly disperses and ceases to be a festival. If you make it routine, it loses the emotional charge required for the pity/expenditure harms.
  *Verdict on Removal:* Removing the scale/visibility gradient dissolves the case. This vindicates your friend *partially*: the harms are not inherent to *assembly* as such, but to *mass* assembly. However, since Rousseau's festival requires a "public" (the whole city), it necessitates the mass.

  **Rousseau's Defense**
  Rousseau would argue that your scenario describes a *corrupted* festival, not a *compliant* one. He would insist that true civic festivals must be simple to the point of poverty (no silk ribbons) and that *émulation* for civic honor is distinct from *amour-propre*.
  *Can he distinguish without appealing to excluded features?* No. He must appeal to the *spirit* or *intent* of the participants (virtue vs. vanity). He cannot point to a structural difference (stage vs. no stage) because your scenario complies structurally.
  *Cost to Critique:* This forces the conclusion that his objection was never to the theater *as such* (the building, the tickets), but to the *moral disposition* of the people. If the people are corrupt, the festival corrupts. If the people are virtuous, the theater might not harm. This collapses his specific critique of representation into his general critique of society. It suggests the problem is not the *medium* (theater vs. festival) but the *message* and the *men*.

  **Verdict**
  You are right, but with a caveat. Your friend is correct that the *commercial apparatus* (tickets, actors, buildings) exacerbates the harms by institutionalizing inequality and passivity. However, you are correct that removing the apparatus does not grant *immunity*. The harms arise from the social psychology of assembly (*amour-propre*, catharsis, scarcity of attention), which persists even in the open air.

  Rousseau has not found the exit. He has found a *mask*. The festival allows the citizens to act out the *role* of equality while practicing the *reality* of distinction. By making the people the spectacle, he does not eliminate representation; he universalizes it. Every citizen becomes an actor representing "The Citizen" to their neighbor. As long as that representation is public, it is subject to judgment, and where there is judgment, there is *amour-propre*.

  *Flagged Contested Reading:* Mechanism (b) (Inflaming Passions) is the weakest link in your original list. Rousseau genuinely believes shared sentiment *corrects* particular passions by subsuming them into the General Will. My scenario assumes the "General Will" can be hijacked by factional status (inner vs. outer ring). If you accept Rousseau's psychology that shared joy necessarily unites, the scenario fails. If you accept the psychological reality that groups fracture along lines of visibility, the scenario holds. I have leaned on the latter.

  **Conclusion:** The immunity claim is false. The festival is not a structural solution to the problems of the theater; it is a moral aspiration that relies on the very virtue it is supposed to produce. Without that pre-existing virtue, the festival reproduces the theater's harms in a republican key.
