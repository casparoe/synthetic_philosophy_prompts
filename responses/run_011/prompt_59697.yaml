prompt: |-
  I'm a first-year archives MA student, and my program put me on the university's special collections access committee because they like having a student vote. Next week we decide what to do with an accession that's already sitting in our building: the surviving administrative records of a state residential institution for people labelled "feeble-minded" or "mentally defective," which ran from the 1920s until it was closed down in the early 90s. Roughly 900 case files, plus admission registers, disciplinary logs, staff correspondence, and a few hundred photographs of residents, almost none of them identified.

  Here's the mess. For a lot of these people, this is the only documentation of there life that exists anywhere — their families have nothing, and the state's copies were pulped years ago. But everything in the files was written by the people confining them. Residents show up as numbers, the diagnoses are straight eugenics vocabulary, and the only actual voices are the superintendent's. So the same box is both the sole evidence these people existed and a product of the machinery that erased them.

  Two descendants' groups have written to us wanting opposite things. One says open everything, we need to find our relatives, and sealing it lets the institution win by keeping its subjects invisible. The other says these are surveillance records created without consent, and putting them online with full-text search turns a superintendent's judgment into the permanent googleable identity of someone who can't answer back.

  Our access policy is no help: it just says records containing personal information are restricted for 75 years from creation. That treats a disciplinary log entry and a letter a resident wrote herself identically, and it doesn't distinguish at all between who made a record and who it's about. About half the files are past 75 years and half aren't.

  Could you draft the memo I'll circulate before the meeting? I need a real recommendation with a workable access scheme — what's open, what's restricted, under what conditions, and who decides when a descendant's request overrides the default — not a paragraph about balancing competing interests. It should take seriously the best argument on whichever side you end up rejecting, and I'd like it to say something about description, since our finding aid is going to reproduce the institution's own categories whether we mean to or not. Something a committee can read in ten minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** First-year Archives MA student, serving on a university special collections access committee.
      *   **Task:** Draft a memo to circulate before the committee meeting regarding a specific accession (records of a state residential institution for people labeled "feeble-minded," 1920s-1990s).
      *   **Content:** Needs a *real recommendation* with a *workable access scheme* (what's open/restricted/conditions/who decides). Must address the conflict between two descendants' groups (open everything vs. protect privacy/dignity). Must address the limitations of the current policy (75-year rule). Must address description/metadata issues (reproducing harmful language).
      *   **Tone/Style:** Professional, actionable, concise (readable in 10 minutes), ethically grounded, acknowledges the complexity without wavering on the recommendation.
      *   **Key Constraint:** "Not a paragraph about balancing competing interests." Needs a decisive path forward.

  2.  **Analyze the Collection & Ethical Dilemma:**
      *   **Nature of Records:** Administrative, case files, registers, logs, photos. Created by oppressors (superintendents/staff) about the oppressed (residents).
      *   **Historical Context:** Eugenics, institutionalization, dehumanization (numbers, derogatory diagnoses).
      *   **Value:** Sole evidence of existence for many vs. permanent record of trauma/surveillance.
      *   **Stakeholders:**
          *   Group A (Open): Visibility, countering erasure, genealogical need.
          *   Group B (Restrict): Privacy, dignity, consent, preventing algorithmic harm.
          *   Institution (University): Legal liability, ethical stewardship, policy gaps.
      *   **Current Policy:** 75-year rolling restriction. Too blunt. Treats all PII the same. Doesn't account for power dynamics.

  3.  **Determine the Recommendation (The "Decision"):**
      *   *Option 1: Open Everything.* Risks harm to living relatives or recently deceased. Validates the eugenic labels as searchable truth. Ignores Group B's valid concern about consent.
      *   *Option 2: Close Everything.* Validates the erasure. Ignores Group A's valid concern about visibility and historical accountability.
      *   *Option 3: Tiered/Managed Access (The Middle Path, but specific).*
          *   **Administrative Records (Staff correspondence, policy, annual reports):** Open. These document the *system*, not the individuals.
          *   **Case Files/Registers (Post-1949/75 years):** Restricted by default, but with a clear petition process.
          *   **Case Files/Registers (Pre-1949):** Open *but* with redacted/controlled metadata.
          *   **Photos:** Highly sensitive. No online posting without identification.
          *   **Description:** Need to intervene in the finding aid. Don't reproduce slurs uncritically.
      *   *Refining the Recommendation:* The 75-year rule is a baseline, not a ceiling. For institutional records of this nature, "Open" doesn't mean "Online Indexable." It means "In the Reading Room."
      *   *Key Mechanism:* A "Community Review Board" or specific protocol for descendant requests. Since the student is on the committee, the recommendation should empower the committee to act as that gatekeeper with guidance.
      *   *Ethical Stance:* Prioritize *dignity* over *efficiency*. Acknowledge that these records are evidence of a crime against humanity (eugenics), not just bureaucratic paperwork.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and specific.
      *   **Executive Summary:** State the recommendation immediately.
      *   **Context:** Briefly summarize the collection and the conflict (acknowledge both groups' validity).
      *   **The Problem with Current Policy:** Explain why the 75-year rule fails here (power imbalance, nature of data).
      *   **Proposed Access Framework:**
          *   *Tier 1: Institutional Memory (Open).*
          *   *Tier 2: Resident Data (Controlled).*
          *   *Tier 3: Visual Materials (Highly Restricted).*
      *   **Description & Metadata:** Address the language issue (content warnings, contextual notes, not reproducing slurs in titles).
      *   **Decision-Making Protocol:** Who decides on exceptions? (Committee + External Advisor).
      *   **Conclusion:** Reiterate the ethical imperative.

  5.  **Refining the Access Scheme (Self-Correction during drafting):**
      *   *Critique:* Just saying "Controlled Access" is vague. How does a descendant actually get in?
      *   *Fix:* Add a "Redaction vs. Access" distinction. For pre-1949 files, open the *folder* but redact sensitive medical/sexual details? No, that's too labor-intensive. Better: Open the *finding aid* but restrict the *digital images*. Physical access only for researchers who sign a stricter agreement.
      *   *Critique:* What about the "Googleable" concern?
      *   *Fix:* Explicitly state: No OCR, no full-text search for names, no online thumbnails of photos.
      *   *Critique:* Who decides on the 75-year cutoff exceptions?
      *   *Fix:* Propose a "Sensitive Records Review Panel" that includes a descendant representative if possible, or at least requires committee consensus + legal review.

  6.  **Addressing Description:**
      *   Must mention "Harmful Language Statements."
      *   Must mention not using institutional numbers as the primary identifier if names are known.
      *   Must mention that the finding aid should describe the *power structure*, not just the content.

  7.  **Review against Constraints:**
      *   10-minute read? (Keep it under 1000-1200 words).
      *   Real recommendation? (Yes, specific tiers).
      *   Acknowledges rejected argument? (Yes, explicitly validate Group A's need for visibility while explaining why unrestricted online access is harmful).
      *   Student voice? (Professional but fresh, ethically engaged).

  8.  **Final Polish:** Check tone. Ensure it sounds like a proposal *to* a committee, not a lecture *at* them. Use formatting (bolding, lists) to make it skimmable. (Self-correction: Ensure the distinction between "Open" and "Online" is clear, as that solves the Google problem).

  9.  **Final Output Generation:** (Proceeding to draft the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Special Collections Access Committee
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Access to the [Institution Name] Records (Accession #____)

  **Executive Summary**
  The [Institution Name] records present a unique ethical challenge: they are simultaneously evidence of erasure and instruments of surveillance. Our current 75-year restriction policy is insufficient because it treats all personal information identically, regardless of power dynamics or potential harm.

  I recommend we reject a binary "open vs. closed" approach. Instead, we should adopt a **Tiered Access Model** that distinguishes between institutional accountability and individual privacy. This model prioritizes physical access over digital discoverability to prevent the reification of eugenic diagnoses as searchable data.

  **The Ethical Conflict**
  We have received conflicting guidance from descendant communities, both of which hold valid ethical weight:
  1.  **Visibility (Group A):** Unrestricted access counters the historical erasure of these individuals. Sealing the records replicates the institution's secrecy.
  2.  **Dignity (Group B):** These records lack consent. Digitizing them creates a permanent, searchable digital scarlet letter for individuals who cannot contest the diagnosis.

  *Assessment:* While Group A is correct that secrecy aids erasure, Group B is correct that *algorithmic* access transforms historical trauma into modern data points. We can provide visibility without enabling surveillance.

  **Proposed Access Scheme**
  I propose we categorize the accession into three tiers with distinct handling protocols.

  **Tier 1: Administrative & Operational Records (Open)**
  *   **Content:** Superintendent correspondence, annual reports, policy manuals, building plans, staff meeting minutes.
  *   **Access:** Fully open, digitized, and searchable online.
  *   **Rationale:** These documents implicate the *state* and the *system*, not the residents. Public scrutiny of the machinery of confinement is necessary for historical accountability.

  **Tier 2: Resident Case Files & Registers (Controlled Physical Access)**
  *   **Content:** Admission logs, case files, disciplinary records, medical notes.
  *   **Access:**
      *   **Pre-1949 (75+ years):** Open for physical research in the reading room only. **No digital surrogates online.**
      *   **Post-1949:** Restricted. Access granted only via petition (see Decision Protocol).
      *   **Searchability:** Names and case numbers will appear in the finding aid, but **OCR and full-text search will be disabled** for these files. A researcher must know what they are looking for; they cannot "stumble" upon a relative via Google.
  *   **Rationale:** This satisfies Group A (researchers can find relatives) and Group B (no global digital footprint). It forces an engagement with context that a search bar bypasses.

  **Tier 3: Photographic Materials (Highly Restricted)**
  *   **Content:** Resident photographs (mostly unidentified).
  *   **Access:** Restricted to physical viewing only. No thumbnails online. No reproduction for public dissemination without Committee approval.
  *   **Rationale:** Facial recognition technology and the decontextualized circulation of images of institutionalized people pose a high risk of dignity harm.

  **Description and Metadata Protocol**
  Our finding aid must not reproduce the institution's violence through neutral description.
  1.  **Harmful Language Statement:** A prominent banner must preface the collection, contextualizing terms like "feeble-minded" as historical eugenic constructs, not medical facts.
  2.  **Interventionist Description:** We will not use institutional case numbers as the primary access point if a name is known. Where possible, we will prioritize the resident's name in the metadata to restore personhood.
  3.  **Contextual Notes:** Folder-level descriptions should note the *creator* of the record (e.g., "Superintendent's report on Resident X") to clarify the power dynamic inherent in the text.

  **Decision Protocol for Exceptions**
  The 75-year rule is a baseline, not a ceiling. For requests to access Post-1949 records (Tier 2), or to reproduce Tier 3 images, the following protocol applies:

  1.  **Petition:** The requester must submit a form stating the purpose of research and relationship to the materials (if any).
  2.  **Review:** The Access Committee will review the petition. **Crucially, we should invite a representative from one of the descendant groups to serve as a non-voting advisor on these specific decisions.**
  3.  **Criteria for Override:** Restrictions may be lifted if:
      *   The requester is a direct descendant seeking genealogical information.
      *   The research has a clear public benefit (e.g., restitution claims, specific historical scholarship) that outweighs privacy risks.
      *   The information is already public record elsewhere.

  **Implementation & Resources**
  This approach requires more labor than a blanket restriction. We will need to:
  *   Configure our digital repository to disable OCR/search on specific series.
  *   Draft the Harmful Language Statement in consultation with the descendant groups.
  *   Schedule a quarterly review for access petitions.

  **Conclusion**
  By choosing **Controlled Physical Access** over **Unrestricted Digital Access**, we acknowledge that these records are not neutral. We can make the lives of the residents visible to those who seek them with care, without broadcasting their trauma to the world as data. This honors Group A's demand for memory without violating Group B's demand for dignity.

  I move that we adopt this Tiered Access Model as the provisional policy for this accession.
