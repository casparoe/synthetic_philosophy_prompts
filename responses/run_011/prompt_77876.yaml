prompt: |-
  I sit on my university's academic integrity board — three faculty, two students, one administrator — and Thursday we hear an appeal that has split us down the middle. I've been asked to write the opinion the board adopts whichever way it goes, so I want a draft I can argue with rather than something that just restates the handbook back at me.

  The case: a senior in the honors program submitted a 5,000-word thesis, got an A, and then a classmate reported that she'd built what she calls "the pipeline." She wrote a workflow in which one model instance produced an outline, a second drafted each section from that outline, a third was instructed to attack the draft as hard as it could, and a fourth revised in light of the attack. She read every output at every stage and either approved it or kicked it back with a one-line instruction, and she has a sixty-page timestamped log of all of it, which she handed over voluntarily without being asked. By my count from the log she rejected or sent back something like a third of the outputs, which cuts in her favor. Her defense, laid out in a genuinely lucid five-page statement, is that each individual step was something she could have done herself in an hour — the pipeline just made her do them one at a time instead of all smeared together — and that since she checked every output, the judgment calls were hers. She points out that if she'd paid a human tutor to play devil's advocate and a human copyeditor to tighten the prose, nobody would have blinked, and she says she thinks of the whole thing as scaffolding for a task too big to hold in her head at once. The syllabus said no generative AI "in drafting the thesis" and said nothing about critique or revision, and the instructor concedes he wrote the rule assuming the tools would only be used to produce sentences.

  The thing that cuts the other way, and I cant get past it: in the oral exam she defended the thesis's conclusion well, but when asked why a specific objection in section three fails she said she'd need to check her log, and when the examiners pushed she described it as "the one the red-team agent raised." Her hand-written work in the same course averaged a B-, and she offered to redo a comparable paper by hand under supervision and got a B-. So there's a live question of whether the artifact measured a capability she actually has, and whether her checking was competent checking or a rubber stamp with good vibes about it. One of the faculty on the board also thinks the scaffolding analogy is doing suspicious work — a calculator extends your arithmetic while leaving the arithmetic yours, he says, whereas this is a case where the checking itself is only as good as the skill the assignment was supposed to build, which is exactly the skill in question. He may be begging the question and I can't tell.

  What I need: a written opinion I could circulate, recommending a concrete disposition — uphold the finding, overturn it, or uphold a modified finding with a lesser consequence — plus what happens to the grade and by when. It should give the board a test we could apply to the next four of these, because there will be next four of these, and it needs to be something a student writing an appeal could actually argue against rather than a vibe. And please engage her decomposition argument at full strength: half the board thinks she's straightforwardly right, and I want to know whether they can be answered at all, and if they can't, what the finding would have to become. No references or policy citations — I don't need a bibliography, I need the reasoning, including an honest account of what we'd be giving up if we rule against her.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university academic integrity board (writing the draft opinion for the board to adopt).
      *   **Task:** Write a draft opinion for a specific case involving AI use in an honors thesis.
      *   **Case Details:**
          *   Student: Senior, honors program.
          *   Work: 5,000-word thesis, originally graded A.
          *   Method: "The Pipeline" (4 AI models: Outline -> Draft -> Critique/Red Team -> Revise).
          *   Oversight: Student read every output, rejected/sent back ~33%. 60-page timestamped log provided voluntarily.
          *   Defense: "Scaffolding" argument (could have done steps individually, AI just organized it); "Human Analogy" (tutor/copyeditor); Syllabus ambiguity (no AI in "drafting," silence on critique/revision).
          *   Counter-Evidence: Oral exam struggle (couldn't explain Section 3 objection without log, referenced "red-team agent"); Handwritten work avg B-; Supervised rewrite resulted in B-.
          *   Faculty Concern: "Scaffolding" vs. " outsourcing the skill." The checking requires the skill the assignment measures.
      *   **Requirements:**
          *   Recommend a concrete disposition (Uphold, Overturn, or Modified).
          *   Specify grade consequence and timeline.
          *   Provide a test/framework for future cases.
          *   Engage the student's "decomposition/scaffolding" argument at full strength (don't strawman it).
          *   No policy citations/bibliography (focus on reasoning).
          *   Acknowledge what is lost if ruling against her.
          *   Tone: Argumentative, reasoned, suitable for a board to debate/adopt.

  2.  **Determine the Stance/Disposition:**
      *   *Option A (Overturn/Exonerate):* Validates the "tool" argument. Risks devaluing the thesis as a measure of independent capability. Ignores the oral exam discrepancy.
      *   *Option B (Uphold Violation/Revoke Grade):* Strict liability. Ignores the nuance of the log and the syllabus ambiguity. Punishes innovation harshly.
      *   *Option C (Modified Finding):* Acknowledges the ambiguity but prioritizes the *learning outcome* verification. The oral exam and supervised rewrite suggest the thesis grade (A) does not reflect the student's unassisted capability.
      *   *Decision:* Option C is the most robust for a precedent-setting opinion. It balances the procedural fairness (syllabus ambiguity) with the substantive integrity issue (did she do the thinking?). It allows for a "Modified Finding" (Violation of Spirit/Outcome, but not necessarily malicious fraud) or a "Uphold with Mitigation." Let's aim for **Uphold the Finding of Violation but Mitigate the Sanction**, or perhaps **Modify the Finding to "Unauthorized Aid" rather than "Plagiarism."** Actually, the prompt asks for a disposition on the *appeal*. The original finding was likely a violation. The appeal argues against it.
      *   *Refined Decision:* The most defensible position for a university board, given the oral exam evidence, is to **Uphold the Violation** (because the core competency wasn't demonstrated) but **Modify the Sanction** (because the syllabus was ambiguous and the effort was transparent). The grade should reflect the supervised performance (B-/B range).
      *   *Wait, looking closer:* The prompt asks for an opinion the board adopts *whichever way it goes*. I need to pick a lane to make it a usable draft. The strongest *reasoned* lane, given the "B- vs A" discrepancy, is that the thesis grade is invalid. I will draft an opinion that **Upholds the Integrity Violation** but frames it carefully around *competency verification* rather than just "AI bad." This addresses the faculty member's concern about "checking requiring the skill."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard board opinion format (Case ID, Date, etc. - keep it minimal).
      *   **Introduction:** State the core tension. Innovation vs. Verification of Competency.
      *   **The Student's Argument (The "Scaffolding" Defense):** Give this its due. It's the strongest part of her case. The "human tutor" analogy. The "decomposition" argument. Acknowledge that if this is just a workflow tool, banning it is like banning word processors.
      *   **The Board's Analysis (The "Competency" Test):** This is where I counter the scaffolding argument. The key distinction: Does the tool *extend* the mind or *substitute* the mind? The oral exam is the smoking gun. If she can't explain the logic without the log, the logic wasn't hers.
      *   **The Syllabus Issue:** Acknowledge the ambiguity. "Drafting" is porous. But "Unauthorized Aid" is a broader category than specific syllabus bans.
      *   **The Precedent/Test:** Need a test for future cases.
          *   *Test Idea:* The "Unassisted Explanation" Test. Can the student explain the reasoning chain without reference to the tool's output?
          *   *Test Idea:* The "Substitution" Test. Did the tool perform the cognitive labor the assignment was designed to assess?
      *   **Disposition:** Grade adjustment to match supervised performance. No suspension (due to transparency/ambiguity).
      *   **What We Lose:** Acknowledge the cost. Chilling effect on workflow innovation. Admitting we are measuring "unassisted brain power" not "best possible artifact."

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the "Scaffolding" argument fully engaged?
      *   *Fix:* I need to make sure I don't just dismiss it. I need to explain *why* the faculty member's calculator analogy fails or succeeds. The calculator does arithmetic (mechanical). Writing involves reasoning (conceptual). If the AI does the reasoning (critique/revision), it's doing the thinking.
      *   *Critique:* Is the tone right?
      *   *Fix:* Needs to be judicial but philosophical. Not bureaucratic.
      *   *Critique:* The prompt asks for a test for the "next four of these."
      *   *Fix:* Explicitly codify a "Cognitive Ownership Standard."

  5.  **Finalizing the Disposition:**
      *   Finding: Violation of Academic Integrity (Unauthorized Aid).
      *   Grade: Adjusted to B (matching the supervised work/oral performance).
      *   Sanction: No disciplinary record beyond the course, given the transparency.
      *   Reasoning: The thesis is a capstone of *independent* thought. The evidence shows the thought was distributed between student and model.

  6.  **Writing the Opinion:** (Mental Outline)
      *   *Title:* Opinion of the Academic Integrity Board.
      *   *Premise:* We are not judging AI use per se, but the verification of learning.
      *   *Addressing the Defense:* The "Pipeline" as workflow management vs. Cognitive outsourcing.
      *   *The Critical Distinction:* The "Red Team" step. Who did the critical thinking? The log shows the AI found the error. The student just approved the fix.
      *   *The Evidence:* The Oral Exam. The B- rewrite.
      *   *The Test:* "Independent Articulation."
      *   *The Cost:* We prioritize skill verification over product quality.
      *   *Ruling:* Grade reduced, violation stands but no further penalty.

  7.  **Review against Constraints:**
      *   No policy citations? Check.
      *   Engage decomposition argument? Check.
      *   Concrete disposition? Check.
      *   Test for future cases? Check.
      *   Honest account of costs? Check.

  8.  **Final Polish:** Ensure the voice sounds like a senior faculty member or administrator trying to bridge a split board. (Proceed to generate output).

  *(Self-Correction during final review)*: I need to make sure I don't sound like I'm just saying "AI is cheating." I need to lean heavily into the *oral exam* evidence. That is the objective proof that the cognitive work wasn't internalized. The "Scaffolding" argument fails because scaffolding is removed before the building stands; here, the scaffolding *was* the structural integrity.

  Let's write it.cw
answer: |-
  **OPINION OF THE ACADEMIC INTEGRITY BOARD**
  **Re: Appeal of Academic Integrity Finding (Case #24-H)**
  **Date:** October 26, 2023

  **I. The Question Before the Board**

  This appeal does not turn on whether the student used generative AI. She admits it, documented it, and submitted a log more transparent than most human drafting processes. The question is whether the use of this "pipeline"—four model instances managing outline, draft, critique, and revision—violates the core requirement of the honors thesis: that the submitted artifact must demonstrate the *independent cognitive capability* of the author.

  The Board is split. One half sees a student who managed a complex workflow, exercised judgment at every gate, and utilized tools to extend her reach. The other half sees a student who outsourced the very reasoning skills the thesis was designed to assess, evidenced by her inability to defend the work without reference to the machine's logs.

  This opinion adopts the latter view, but only by narrowing the grounds. We are not ruling that AI use is inherently prohibited in all contexts. We are ruling that in a capstone assessment of *independent reasoning*, the student must retain ownership of the critical chain, not just the final approval.

  **II. The Student's Defense: Decomposition and Scaffolding**

  The appellant's argument is sophisticated and deserves to be met at its strongest point. She argues that she did not outsource thinking; she outsourced *process*. Her analogy is the calculator: a tool that handles arithmetic so the mathematician can focus on higher-order problem solving. She contends her pipeline merely decomposed a 5,000-word task into manageable chunks (outline, draft, critique, revise), a decomposition she could have performed manually but chose to automate for efficiency. She notes that she rejected one-third of the outputs, proving active engagement. She further argues that if she had hired a human tutor to critique her draft and a copyeditor to revise it, this would be accepted pedagogical practice. To ban the AI equivalent is to privilege human labor over machine labor without a principled distinction.

  If this were a paper for a standard coursework module, or if the syllabus had explicitly permitted "AI-assisted editing," this argument might carry the day. The "scaffolding" analogy is compelling: we allow students to use spellcheck, grammar check, and writing center tutors. Why is a model instance different from a tutor who points out a logical gap?

  **III. The Board's Analysis: The Locus of Critical Judgment**

  The distinction lies in *where* the critical judgment occurs. In the student's analogy, the AI is a calculator. In practice, the log reveals the AI was the *engineer*.

  A calculator performs operations the user directs. It does not tell the user *which* equation to solve or *whether* the result makes sense in context. In this pipeline, the third model instance was instructed to "attack the draft as hard as it could." This is the core work of a thesis: not generating prose, but stress-testing arguments. When the student states she accepted the revision based on the "red-team agent's" objection, she acknowledges that the identification of the flaw originated with the model, not her.

  This brings us to the dispositive evidence: the oral defense and the supervised rewrite.

  1.  **The Oral Defense:** When pressed on why a specific objection in Section Three failed, the student could not articulate the reasoning from her own understanding. She deferred to the log and identified the logic as "the one the red-team agent raised." This confirms that the critical path was not internalized. The scaffolding had not been removed; it was bearing the load.
  2.  **The Supervised Rewrite:** The discrepancy between the thesis (A) and the supervised rewrite (B-) is not a grading variance; it is a capability gap. It demonstrates that the "A" quality of the original thesis relied on cognitive labor the student could not replicate under controlled conditions.

  The faculty member's concern regarding the "calculator analogy" is correct. A calculator extends arithmetic while leaving the *mathematics* to the student. This pipeline extended the *reasoning* while leaving the *prompting* to the student. The assignment was designed to assess the reasoning.

  **IV. The Syllabus and Notice**

  We acknowledge the syllabus ambiguity. The prohibition on AI "in drafting" is porous when drafting, critiquing, and revising are iterative. The student acted in good faith regarding the written rule. However, academic integrity policies generally contain a catch-all regarding "unauthorized aid" or work that is not the student's own. The ambiguity of the syllabus mitigates the *intent* to deceive, but it does not cure the *substance* of the violation. A student cannot claim authorization for a tool simply because the prohibition was not granular enough to name it, if the tool fundamentally alters the nature of the assessment.

  **V. A Test for Future Cases**

  To guide the Board in the inevitable appeals that will follow, we establish the **Standard of Independent Articulation**.

  In assignments designed to assess independent reasoning (theses, capstones, take-home exams), the use of generative tools is permissible only if the student can satisfy two conditions:
  1.  **Attribution:** The specific contribution of the tool is disclosed.
  2.  **Articulation:** The student can explain the *reasoning chain* behind any tool-generated insight without reference to the tool's output.

  If a student cannot explain *why* a revision was made, only *that* the tool suggested it, the cognitive ownership remains with the tool. In such cases, the work cannot be graded as the student's independent output. This standard shifts the focus from *detection* (did they use AI?) to *verification* (do they own the thought?).

  **VI. What We Surrender in This Ruling**

  We must be honest about the cost of this finding. By ruling against the student, we are prioritizing the measurement of unassisted cognitive capacity over the quality of the final artifact. We are acknowledging that the university degree certifies a specific biological process (neural firing in the student's brain) rather than the ability to manage resources to produce excellent work.

  In the professional world, the "pipeline" this student built is an asset. A lawyer or consultant who can orchestrate AI to produce a more rigorous, stress-tested document is more valuable than one who works in isolation. By penalizing this, we risk teaching students to hide their workflows rather than optimize them. We are preserving the integrity of the *grade* as a measure of current individual capability, but we may be weakening the relevance of the *curriculum* to future practice. We accept this trade-off because the university's primary function is certification of learning, not preparation of workflow.

  **VII. Disposition**

  The Board **UPHOLDS** the finding of an Academic Integrity Violation, but **MODIFIES** the sanction.

  1.  **Violation:** The submission is classified as "Unauthorized Aid." The work submitted does not meet the threshold of independent reasoning required for the honors designation.
  2.  **Grade:** The grade for the thesis is adjusted to reflect the student's demonstrated independent capability. Based on the supervised rewrite and oral defense, the appropriate grade is a **B**. This acknowledges competent work that falls short of the honors standard when unassisted.
  3.  **Sanction:** Given the student's transparency (voluntary submission of logs), the clarity of her defense, and the ambiguity of the syllabus, no further disciplinary record (probation or suspension) is imposed. This is treated as a course-level resolution.
  4.  **Timeline:** The Registrar is instructed to adjust the transcript within ten business days.

  **VIII. Conclusion**

  We deny the appeal not because the student cheated in the traditional sense of stealing words, but because she inadvertently proved she had not done the thinking the degree requires her to own. The pipeline was efficient, but it bypassed the struggle where learning occurs. We cannot award honors for a struggle the machine endured.

  *Adopted by the Academic Integrity Board.*
