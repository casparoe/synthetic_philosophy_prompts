answer: |-
  The paradox holds because your trade's foundational axiom—that a readout cannot track a source with zero coupling—is precisely what the epiphenomenalist denies, revealing their position as a claim of knowledge without causal contact.

  **Core Translation**
  In your vocabulary, the epiphenomenalist posits a measurement chain where the physical substrate (neurons, vocal cords) forms a closed system with standard conservation laws. The "experience" is a signal generated at the transducer stage but assigned a coupling coefficient of exactly zero into the amplification and readout stages. The physical chain proceeds from stimulus to neural firing to speech act without any energy or information transfer from the experience variable. The objection (paradox of phenomenal judgment) translates to this: if the coupling coefficient between experience and the speech act is zero, the transfer function is null. Therefore, the logged data (the speech act "I am in pain") is statistically independent of the signal (the pain). If the data is independent of the signal, the system is not calibrated to the signal, and the log cannot be claimed to represent the signal accurately.

  **Direct Responses to Your Constraints**

  1.  **Zero Coupling and Calibration:** In precision measurement, a readout with zero coupling to the target is not a weak measurement; it is a measurement of nothing. You cannot calibrate against a null influence because calibration requires varying the input to observe a correlated variation in the output. If the experience varies but the readout varies only due to physical causes, the correlation is zero. The epiphenomenalist is not entitled to words like "tracking" or "accurate." They are claiming the systematic error is zero by coincidence, not by design. In your trade, we would call this an unverified assumption, not a measurement result.

  2.  **Identical Data and Causal History:** If you stipulate two setups with bit-for-bit identical logged data, the data itself contains no marker of the extra experience. In metrology, what makes a number *about* something is the causal history of the chain—the calibration certificate traces the number back to the standard. If the experience drops out of the causal chain, the number is not about the experience; it is about the physical state that caused the number. The stipulation preserves the physical identity of the logs but quietly destroys the semantic reference. The data is identical, but the claim that the data *references* the experience is false in Setup B (the epiphenomenal one) because the causal link is severed.

  3.  **Location of Vanishing Coupling:** The coupling must vanish wherever the physical closure is enforced. If you put it at the cell level, the neuron fires identically whether the experience is present or not. If you put it at the system level, the behavior is identical. The paradox bites at the final readout (the speech act) regardless of where you put it, because the readout is the only place the claim is tested. If the physical chain is closed (conservation of energy/momentum), the experience is outside the loop. The location doesn't matter; the topology does. If the loop is closed physically, the experience is an open circuit hanging off the side, and no current flows to the meter.

  4.  **Analogues of Non-Coupling Quantities:** The closest analogue is global phase in quantum mechanics or gauge freedom. These are real parameters in the math that do not affect observables. However, we do not claim to *measure* global phase; we claim it is unobservable and irrelevant to the physics. We know about gauge freedom because removing it breaks the symmetry of the equations that *do* predict couplings. Experience, in the epiphenomenalist view, predicts nothing and explains no couplings. So the analogy hurts them: we retain gauge freedom for mathematical consistency, not because we have a readout for it. Claiming to "know" experience exists without it coupling to the knowledge-state is like claiming to measure global phase with a voltmeter.

  **Residue Report**

  *   **Clean Maps:** The physical measurement chain maps cleanly to neural processing and speech production. "Coupling strength" maps directly to causal efficacy. "Noise floor" maps to neural variability. "Calibration" maps to the reliability of belief formation.
  *   **Bent Maps:** "Experience" must be treated as a "signal" to fit the model, which risks physicalizing it. I am bending the term by giving it a place in the chain (as a generated variable) even though the epiphenomenalist says it is non-physical. I am also bending "knowledge" to mean "logged data with a valid causal history," whereas the philosopher might mean "justified true belief" without requiring causal contact.
  *   **No Expression:** "Intentionality" or "aboutness" without causation has no expression. In your vocabulary, a number is about what pushed the electrons. In the philosophical argument, a thought can be about an experience that didn't push the neurons. This is the untranslatable remainder.
  *   **Flagged Assumption:** I have assumed that "knowing" requires a causal chain from the known object to the knower. This is the axiom of your trade (causal realism). The epiphenomenalist denies this axiom. By forcing their view into your vocabulary, I am assuming the conclusion (that causal contact is necessary) to show the contradiction.

  **Verdict on the Remainder**

  The untranslatable remainder is not a limitation of your bench-top vocabulary; it is a sign the original argument was doing sleight of hand. Your vocabulary assumes every fact is a fact about something registered somewhere because that is what operational knowledge *is*. The paradox arises because the epiphenomenalist wants to retain the validity of our reports ("I know I have qualia") while severing the causal warrant that makes reports valid. The remainder is the claim of "non-causal knowledge," which your trade correctly identifies as incoherent. The argument asks you to accept a measurement result that admits no coupling mechanism; in any other context at the bench, you would reject the data as uncalibrated. The fault lies in the philosophical attempt to define knowledge independently of the causal conditions that make knowledge possible.
