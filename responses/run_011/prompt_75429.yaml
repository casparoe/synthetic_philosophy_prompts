  **[14:11] Customer:** Then your business model is fraudulent. You're selling "character" while denying character exists. If I accept your premise that I have no stable traits, why would I bother trying to be brave next time? You're creating the inconsistency you claim to measure.
  **[14:12] Agent:** Escalating to Supervisor.

  **[14:15] Supervisor:** This is L. Harman. We've reviewed the logs. The refund is denied.
  **[14:16] Supervisor:** Your argument regarding habituation assumes a unified self. Our data suggests the "self" is a fragmented collection of context-specific responses. You didn't lose courage; you simply entered a situation where courage wasn't a predictive variable.
  **[14:17] Customer:** So if traits are that bound to the situation, what exactly did I purchase?
  **[14:18] Supervisor:** You purchased a label. It helps organize folk psychology. Whether it corresponds to reality is outside our Terms of Service.
  **[14:19] Customer:** And telling me that doesn't affect future behavior?
  **[14:20] Supervisor:** Causality is ambiguous. Chat closing.

