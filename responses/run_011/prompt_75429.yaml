  **> WARRANTY EXCLUSIONS & LIMITATIONS OF LIABILITY**
  **1. Temporal Urgency Clause:** Performance guarantees void if user is operating under significant time pressure. (Ref: Protocol 77-B)
  **2. Minor Environmental Windfalls:** Trait activation may be inhibited by absence of trivial positive cues (e.g., small currency finds, pleasant ambient temperature).
  **3. Physiological Mood Modulators:** Recent ingestion of carbohydrates or lack thereof constitutes a variable state overriding disposition.
  **4. Domain Specificity:** Integrity or bravery demonstrated in Context A does not guarantee transfer to Context B. Cross-situational consistency coefficients below 0.30 are considered normal operation.
  **5. Folk Category Error:** Product assumes existence of global character traits. Company does not guarantee traits exist independent of situational vectors.

  **[14:07] Customer:** This contradicts the marketing. You sold me a disposition, not a mood ring. Virtue is supposed to be habituated. It's a skill developed through practice, not a switch that flips based on whether I found a dime on the sidewalk.
  **[14:08] Agent:** Our QA protocols indicate that "habituation" is not a shield against situational variance. The data shows behavior is primarily driven by external features, not internal states.
  **[14:09] Customer:** That's a misreading. Practical wisdom means perceiving what *this* situation calls for. Maybe my silence wasn't a failure of courage, but a correct reading of the room. You're treating virtue like a mechanical rule, not a flexible capacity.
