answer: |-
  # 1. The Research Question

  Under what structural conditions on the production function of social value does the multiplicative heuristic of importance, tractability, and neglectedness preserve the ordinal ranking of causes by expected marginal value?

  # 2. The Gap in Standing Responses

  Current discourse regarding cause prioritization frameworks polarizes into two camps, neither of which provides the resources to answer the question above. On one side, defenders of the multiplicative heuristic treat it as a rough rule of thumb that owes no strict semantics. They argue that the framework is intended only to filter out obviously inferior options, not to provide precise cardinal measurements. This defense fails because it cannot specify the boundary conditions under which the heuristic ceases to be merely imprecise and becomes systematically misleading. If the heuristic occasionally inverts the ordering of causes—ranking a low-value cause above a high-value one—then treating it as a benign approximation is unsafe. A rule of thumb requires known error bounds, yet proponents offer no account of what structural features of a cause would trigger such an inversion.

  On the other side, critics dismiss the framework as pseudo-quantification, arguing that assigning scalar scores to complex social phenomena is category mistake. They contend that the arithmetic operations imply a precision that does not exist. This criticism is equally unhelpful for determining the validity of the ordering. By rejecting the quantification entirely, critics foreclose the possibility that the multiplicative structure might track something real under specific conditions. They treat the framework as universally invalid rather than conditionally valid. Consequently, neither side isolates the specific parameter—the interaction between new effort and existing effort—that determines whether the heuristic functions as intended. Both sides assume the relationship between effort and value is monotonic and independent, leaving the substantive question of interaction effects entirely unaddressed.

  # 3. Methodological Strategy

  I will construct a minimal formal model of an allocation problem that includes an explicit interaction term between marginal effort and existing effort. This model will not aim to simulate real-world economies but to isolate the logical structure of the prioritization heuristic. The model will define a value function where output depends on importance, tractability, and a neglectedness term that is functionally derived from the stock of existing effort rather than treated as an independent scalar. By introducing a parameter representing the elasticity of substitution between new and existing effort, I can derive the exact point at which the multiplicative heuristic diverges from the true marginal value.

  I reject the alternative of a purely conceptual argument because the hypothesis concerns a threshold effect. Conceptual analysis can establish that interaction matters, but it cannot identify the tipping point where the heuristic flips from order-preserving to order-inverting. Without a formal structure, the argument risks remaining vague about when the "complementarity" of efforts outweighs the "substitution" effects. Conversely, I reject a methodology based on comparative case studies. While cases can illustrate the phenomenon, they cannot establish the necessary and sufficient conditions for the heuristic's validity. Case studies are vulnerable to the charge of selection bias and cannot generalize to the broader class of cause candidates. The goal is not to show that the heuristic fails in some instances, but to define the structural property that determines success or failure across all instances. The formal model is the only tool capable of yielding the conditional claim required.

  # 4. Success and Failure Conditions

  A successful result will take the form of a conditional theorem: "The multiplicative heuristic tracks marginal value if and only if the production function exhibits diminishing marginal returns to total effort above a specific threshold." Specifically, I aim to demonstrate that the heuristic is order-preserving when the interaction parameter indicates substitutability (where additional workers crowd out existing ones) but becomes order-inverting when the parameter indicates strong complementarity (where additional workers unlock the value of existing ones). The chapter will conclude with a philosophical interpretation of this condition, reframing neglectedness not as a monadic property of a cause but as a relational property indexed to the counterfactual baseline of other agents.

  Failure will occur in one of two modes. The first is trivial failure: the model shows the heuristic is almost never order-preserving, rendering the framework useless. While negative, this is still a substantive result. The second, more dangerous failure mode is epistemic vacuity. This occurs if the derived condition depends on a parameter that is theoretically coherent but empirically inaccessible—for example, if determining the interaction term requires knowing the exact counterfactual actions of all other agents in the system. If the condition for using the heuristic requires information that is impossible to gather without already solving the allocation problem, the result is theoretically sound but practically inert. I will mitigate this by exploring whether proxy indicators for the interaction parameter (such as the presence of shared infrastructure or policy bottlenecks) can be identified within the word limit.

  # 5. Scope and Work Plan

  The constraint of 8,000 words requires strict discipline regarding the complexity of the formal model. The model must be simple enough to be explained and interpreted within approximately 2,000 words, leaving the majority of the text for philosophical analysis and implications. I will avoid complex game-theoretic setups involving multiple strategic agents; instead, I will model a single agent deciding against a fixed background field of existing effort. This simplifies the counterfactual baseline while retaining the core logic of the interaction term.

  To achieve this within one academic year, the work plan is divided into three phases. The first three months will be dedicated to formalizing the model and deriving the threshold condition. The next three months will focus on drafting the philosophical exposition, specifically translating the mathematical result into the conceptual language of neglectedness and relational properties. The final three months will be reserved for revision, ensuring the integration between the formal and conceptual sections is seamless.

  To stay within the word limit, I must cut several potential expansions. I will not provide a historical genealogy of the framework nor engage in detailed empirical applications to specific cause areas (e.g., global health vs. AI safety). These will be mentioned only as illustrative examples where necessary to ground the abstract claims. Furthermore, I will not attempt to solve the estimation problem fully; I will acknowledge the difficulty of measuring the interaction parameter and limit the discussion to qualitative proxies. The primary deliverable is the structural condition itself, not a practical guide for measurement. This ensures the chapter remains a contribution to the philosophical foundations of prioritization rather than drifting into applied policy analysis.
