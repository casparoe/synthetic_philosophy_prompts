  **UNIVERSAL HINGE SET**
  **Model UHS-9 | Assembly Instructions**

  **TOOLS REQUIRED**
  Standard cross-head screwdriver. Power drill (optional). Spirit level. Please ensure your working environment is stable before commencing. Do not attempt assembly whilst questioning the stability of the floor.

  **PARTS LIST**
  1.  Hinge Type A (Light Load)
  2.  Hinge Type B (Heavy Load)
  3.  Fixing Screws (x8)

  **Important Notice:** The hinge is not part of the door. It is not discovered during the assembly process, nor is it fitted on the strength of evidence gathered from the frame. Please note that the hinge is not inspectable while the door is hanging on it. Attempting to locate the hinge within the door structure will result in structural failure. You cannot see the hinge working while it works.

  **ASSEMBLY INSTRUCTIONS**
  1.  Position the door frame against the wall. Ensure the wall is not subject to doubt.
  2.  Align Hinge Type A with the pre-drilled mounts. Insert screws but do not tighten fully.
  3.  Align Hinge Type B. Tighten all screws securely.
  4.  **Verification:** Do not attempt to test whether a hinge is correctly seated by operating the door it holds. Any such test presupposes the stability of other hinges. The manual instructs customers not to test multiple hinges at the same time. To test one is to rely on the rest; to test all is to rely on nothing. If you swing the door to check Hinge A, you are assuming Hinge B holds. Therefore, no single hinge can be tested in isolation. Proceed to use the door without verification.
  5.  Once the door opens and closes, assume the hinges are fitted.

  **TROUBLESHOOTING**

  | Issue | Probable Cause | Solution |
  | :--- | :--- | :--- |
  | Hinge has worked loose in somebody else's house. | External instability. | Ignore. This hinge is fitted for your use only. Do not attempt to tighten screws in another property. Their hinges are not your responsibility. |
  | Two incompatible fitting diagrams both yield doors that open. | Diagrammatic variance. | Accept either diagram. Both facilitate opening. Consistency between diagrams is not required for function. Choose the one that allows entry. |
  | Customer proposes to remove every hinge at once and reassemble from nothing. | Total scepticism. | **WARNING:** Do not remove all hinges simultaneously. Reassembly from nothing is not covered. The frame will collapse. You cannot hang a door on air. |

  **WARRANTY AND GUARANTEE**
  This product is warranted against structural defect for five years. Please note that fitting a hinge is not a matter of holding it to be true but of acting from it. Coverage is voided for anyone who tries to justify a hinge by appeal to the hinges holding it in place. Circular justification invalidates the guarantee. We guarantee the hinge only insofar as it is used to support the door, not when it is used to support itself. If you require proof of the hinge before fitting, this warranty does not apply. Action constitutes acceptance.

  > **CUSTOMER TESTIMONIAL**
  > "Since installing the Universal Hinge Set, I have saved approximately forty hours per year. Previously, I spent considerable time checking whether the Earth existed before my birth. Now I simply open the wardrobe."
  > — *Sarah J., Leeds*
