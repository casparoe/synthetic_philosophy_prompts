      UNIVERSAL HINGE SET
      Model UHS-9 | Assembly Instructions

      TOOLS REQUIRED
      Standard cross-head screwdriver. Power drill (optional). Spirit level. Please ensure your working environment is stable before commencing.

      PARTS LIST
      1.  Hinge Type A (Light Load)
      2.  Hinge Type B (Heavy Load)
      3.  Fixing Screws (x8)

      **Note:** The hinge is not part of the door. It is not discovered during the assembly process, nor is it fitted on the strength of evidence gathered from the frame. Please note that the hinge is not inspectable while the door is hanging on it. Attempting to locate the hinge within the door structure will result in structural failure.

      ASSEMBLY INSTRUCTIONS
      1.  Position the door frame against the wall. Ensure the wall is not subject to doubt.
      2.  Align Hinge Type A with the pre-drilled mounts. Insert screws but do not tighten fully.
      3.  Align Hinge Type B. Tighten all screws securely.
      4.  **Verification:** Do not attempt to test whether a hinge is correctly seated by operating the door it holds. Any such test presupposes the stability of other hinges. The manual instructs customers not to test multiple hinges at the same time. To test one is to rely on the rest; to test all is to rely on nothing. Proceed to use the door without verification.
      5.  Once the door opens and closes, assume the hinges are fitted.

