      *   *Rule 1: The Population Variance Principle.* $h^2$ is about variance in populations, not individuals.
      *   *Rule 2: The Context Dependence Principle.* $h^2$ is specific to the environment measured.
      *   *Rule 3: The Immutability Prohibition.* High $h^2$ $\neq$ unchangeable.

      *Let's formulate specific candidate rules that explain the 10 verdicts:*
      *   **Rule 1: The "Variance, Not Value" Rule.** Heritability estimates the proportion of *variation* in a trait across a *population* that is due to genetic *variation*. It cannot be applied to a single individual's trait composition (V1, V9) or used to claim immutability (V2, V8).
      *   **Rule 2: The "Specific Context" Rule.** Heritability is contingent on the specific environmental variance of the population studied. It cannot be transferred to different environments (V3, V4, V10) or used to explain group mean differences (V5).
      *   **Rule 3: The "Methodological Humility" Rule.** Acknowledge limitations of methods (twins vs DNA) (V6, V7).

