  Your suspicion identifies a fundamental tension: D1 and D5 cannot be jointly satisfied. Mechanisms (selection, reinforcement, planning) and formats (genetic, individual, cultural) vary independently. A system can possess cultural tools (high format) without internal planning (low mechanism). A single ladder forces these orthogonal dimensions into one line, violating D1 or D4. To satisfy D1, D2, D3, and D4, you must drop D5. The cost is losing the intuitive narrative of evolutionary progress. You gain a grid that accurately predicts limits: a system high on format but low on mechanism will fail when scaffolding vanishes, a prediction the ladder misses. This confirms your suspicion that the ladder shifts with surroundings; it is tracking format, not mechanism. These are not three problems but one: the assumption of linearity forces distinct variables into a single sequence. Dropping linearity complicates communication but prevents category errors where engineering successes are dismissed as 'fake' cognition because they lack biological ancestry.

  Mechanism-Format Independence excludes the most candidates. Most existing taxonomies define stages by mixing how behaviors are learned with what tools are used. By demanding these be separated, you invalidate any taxonomy that defines a "human" stage by culture rather than computational capacity. This forces a restructuring of the field's basic vocabulary. It prevents classifying a tool-using crow and a tool-using human on the same rung simply because both use objects, requiring instead a distinction between innate tool use and culturally accumulated technique. It also blocks taxonomies that treat deep learning models as "primitive" simply because they lack biological evolutionary history, forcing evaluation on actual architectural capacity.

  The four-stage ladder fails D1 and D2. It conflates cultural scaffolding with internal planning, causing systems to "drop rungs" when tools are removed. It assumes evolutionary history matters (violating D3). A two-dimensional scheme separating mechanism from format satisfies all non-negotiable desiderata. It predicts that a culturally-saturated system without internal simulation will fail novel tasks requiring offline reasoning, whereas the ladder falsely predicts success based on tool use. The repair costs narrative simplicity but buys predictive accuracy across biological and artificial substrates. The ladder edifies; the grid works.
