answer: |-
  1. **What's wrong with the question**

  The judge is correct; this is a category error, not mere phrasing. You are comparing a unified island nation-state against a continental civilizational empire. Britain's population and economy were comparable to a single Chinese province, not the whole Qing Empire. By setting "Britain vs. China," you force a comparison between mismatched units, guaranteeing that any answer relying on national statistics will be misleading. This is the "foil" problem your judge mentioned: the negative case (China) is too heterogeneous to function as a control group. A valid comparison requires equivalent units, such as England versus the Yangzi Delta. Without this, students cannot isolate variables like institutions or resources because the scale differences overwhelm the data.

  Furthermore, the question assumes a binary outcome—that China definitively failed to industrialise—which ignores the "Great Divergence" debate. Leading economic historians argue that living standards in the Yangzi Delta matched England's until 1800. If the premise is contested, asking students to explain the outcome forces them to argue from false assumptions. Your defence—that students can just pick a side—fails because it rewards reductionism over accuracy. If a student argues "China lacked property rights," they are repeating outdated stereotypes refuted by recent scholarship. If they argue "China lacked coal," they are ignoring that Japan industrialised without domestic coal. The question invites monocausal explanations for a multicausal phenomenon. It suggests history is a puzzle with one solution rather than a complex web of contingencies. For a prize aiming to exercise historical muscle, this question trains the wrong muscle: it encourages confident speculation over nuanced analysis. You cannot fix this by telling students to "argue a side" when the ring itself is rigged. The question structurally privileges Eurocentric narratives by framing Britain as the default success and China as the default failure. Keeping it risks awarding prizes to essays that are confidently wrong. It undermines the prize's academic credibility by endorsing a simplified view of global economic history that experts have moved beyond. The judge's objection about "assuming a single thing" is also vital. The syntax "Why did X happen" implies a sufficient cause. In reality, industrialisation was a convergence of geography, culture, economics, and chance. By asking for "the reason," you force students to elevate one factor above all others artificially. This distorts historical reasoning. They must argue that coal mattered *more* than institutions, or vice versa, without sufficient evidence to weight them comparatively across continents. This creates a false hierarchy of causation. When you tell students to pick a side in a historiographical debate, you assume the debate is balanced. Here, the weight of evidence has shifted. Asking them to defend the old view is like asking them to argue the earth is flat for practice. It teaches them that evidence is secondary to argumentation style. This is dangerous for sixth-formers learning to respect primary sources. They will learn to cherry-pick facts to support a predetermined conclusion. This is the opposite of historical inquiry. The prize should encourage them to follow the evidence, even if it complicates the prompt. By keeping the prompt, you force them to ignore the evidence.

  2. **How many questions are hiding inside it**

  There are at least four distinct questions hidden here, each requiring different evidence. First, the Geographic Reading: "Why did Britain's physical environment favour machines?" The honest answer involves coal location and transport costs. However, as the judge noted, this explains where industry clustered, not why mechanisation occurred at all. Students would need geological maps and transport data, rarely found in school libraries. Without specialist sources, they will resort to clichés about coal being "near water." Second, the Institutional Reading: "Why did British law support innovation better than Chinese law?" The honest answer requires comparing patent systems and property rights. This is writable but risky; recent research shows China had sophisticated contract enforcement. Students might rely on outdated textbooks claiming China was despotic. This creates a grading nightmare where accuracy is penalised against textbook conformity.

  Third, the Regional Reading: "Why did England industrialise while the Yangzi Delta did not?" This is the historians' preferred question. The honest answer involves the "high-level equilibrium trap" or colonial resources. However, the printed question says "China," not "Yangzi Delta." A student answering this correctly is technically disobeying the prompt. A student obeying the prompt is answering incorrectly. This places careful readers at a disadvantage compared to those who generalise. Fourth, the Temporal Reading: "Why did industrialisation start in the 1750s?" This shifts focus from place to time. The honest answer involves demographic pressures or global trade shifts. This is writable but ignores the "not in China" clause entirely. Students who ignore half the prompt should not win, yet answering that half requires the mismatched unit analysis.

  Each reading leads to a different essay. A student focusing on coal ignores institutions; a student focusing on culture ignores geography. Because the prompt doesn't specify which mechanism to investigate, judges cannot grade fairly. One judge might value economic data, another cultural analysis. The ambiguity means there is no single "correct" approach, only different silos of argument. Consequently, there is no consistent way to award the prize. The question asks for a cause, but offers no boundary on what kind of cause is acceptable. This leaves students guessing what the judges want rather than engaging with history. The "Needham Question" reference adds another layer. Needham asked about science, not industry. Conflating the two confuses technological capability with economic application. A student might write about gunpowder or compasses, which is irrelevant to steam engines. This adds a fifth hidden question about scientific culture versus industrial application. None of these readings are mutually exclusive, yet the prompt demands a singular explanation. This guarantees that every essay will be incomplete.

  3. **What still survives**

  The core intent remains valid: comparative economic history is excellent for sixth-formers. The desire to challenge Eurocentrism by including China is commendable. You can keep the comparative framework without the mismatched units. The concept of the "Great Divergence" is accessible enough for bright students if framed correctly. You can retain the focus on industrialisation factors like coal, institutions, or empire. The survival strategy is to narrow the scope rather than broaden the comparison. Acknowledge the complexity in the prompt itself. Instead of asking for a definitive cause, ask for an evaluation of specific factors. This preserves the intellectual challenge while removing the factual trap. The prize remains about argumentation, but the ground beneath the argument becomes stable. You save the theme without saving the specific wording. The judge's reference to the Needham Question is valid; it's about scientific development, not just industry. But the spirit of comparing trajectories is sound. The survival lies in shifting from "Why X not Y" to "How far did X differ from Y regarding Z". This allows for partial divergence rather than binary failure. It respects the historian's view that China was not stagnant. It keeps the student engagement high because the mystery remains, but the terms are fair. We preserve the educational goal of teaching comparative analysis. We simply remove the structural bias that makes accurate analysis impossible. The topic remains exciting without being academically hazardous.

  4. **Three replacements**

  These questions isolate specific variables to avoid the original category errors. They allow for nuanced argumentation without requiring specialist knowledge of Chinese economic history. Each is designed to be answerable with standard school resources. They also prevent the monocausal trap by asking "To what extent" or "How far". This fits the 1500-word limit by focusing the argument.

  1. "To what extent were Britain's coal reserves the decisive factor in its industrialisation?" This commits the student to evaluating a single economic variable against others, forcing them to weigh geography against culture without needing to prove China's failure. It is accessible because coal's role is standard in A-Level curricula and general histories, requiring no specialist economic data or Chinese language sources. Students can find data on coal output in standard economic history summaries found in any school library.

  2. "How far did differences in government and institutions drive economic change in eighteenth-century Britain and China?" This commits the student to comparing political structures rather than national outcomes, avoiding the unit mismatch entirely. It is accessible because general textbooks cover Enlightenment Britain and Qing governance broadly, allowing for balanced argumentation based on known institutional facts. Comparisons of patent laws or tax systems are available in survey texts suitable for sixth-formers.

  3. "Was the Industrial Revolution a sudden breakthrough or a gradual evolution in Britain?" This commits the student to debating the timing and nature of change rather than geographic comparison. It is accessible because the continuity versus change debate is a staple of school history syllabi, ensuring source availability and familiar historiographical frameworks. Debates on Arkwright versus earlier innovations are well-documented in accessible secondary literature.

  5. **Thursday**

  The judge's critique regarding comparative units is historically sound and protects the prize's academic integrity. We must acknowledge that the original phrasing risks validating outdated historical models. I propose we adopt a narrower question that retains the comparative spirit without the factual pitfalls. This adjustment ensures students are rewarded for nuanced analysis rather than confident speculation. We can implement this change immediately without compromising the entry window or budget.
