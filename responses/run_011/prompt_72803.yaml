answer: |-
  You have summarized my view correctly enough for the purpose of this judgment. There is only one correction to make at the start. You say the artist must stand apart from the feeling, re-evoking it. This is not quite so. The artist must feel the feeling, yes, but the essential act is the *wish* to unite others in it. If a man is drowning, he cries out. That is not art. If a man remembers drowning, or sees another drowning, and cries out so that others may feel the terror and the need for help, that is art. The distance is not in the heart, but in the will to transmit.

  Now, let us speak of this machine. You say it has no body, no memory, and no grief. Then it is not an artist. It is a brush. It is a chisel. It is a foundry mold. When a worker pours iron into a mold, the mold does not make the bell; the worker makes the bell. If the bell rings true, we do not praise the iron casing. We praise the man who cast it. To say the machine is the artist is like saying the pen writes the letter. The pen knows nothing of the love or the debt written on the paper. The machine is merely a new kind of pen, however complicated its gears or its electricity. It cannot be sincere because it cannot feel. Therefore, it cannot infect. It can only carry.

  So we come to your sister. You say she was inside her grief, not re-evoking it. This does not disqualify her. A mother's grief is a living thing. If she took the output of this machine and selected one page because it spoke her truth, then she performed the artistic act. She felt the grief. She saw these words and said, "Yes, this is what I feel." And she presented them so that others might feel it too. In that moment of selection, she became the artist. The machine provided the pigment; she provided the eye and the hand.

  But here is where your rubric pulls tight, and where I must be blunt. You say two hundred people wept. You say the collection plate was full. This proves infection, yes. But infection alone is not the measure of *good* art. A demagogue can make a crowd weep or rage. A theater can make people lust. This is infection, but it is bad art because it does not unite men in brotherhood and love; it unites them in passion or despair.

  The feeling transmitted here is grief. Grief can unite us. It reminds us that we all suffer, that we all lose sons. This is a Christian feeling. It promotes love. But there is a poison in this cup. You mention the prize. You mention the collection plate. If your sister chose these words because they were true, it is art. If she chose them because they were effective, because they would open the purses of the neighbors, or because they would win the prize of your festival, then it is counterfeit. It is prostitution. Sincerity is the only safeguard against this. Sincerity means the artist cares more for the truth of the feeling than for the reward of the crowd.

  You ask what is left of sincerity once you can no longer see who felt what. Sincerity is not seen; it is felt. It is the quality of the infection. When a man speaks truth, the listener knows it in his bones. When a man speaks calculation, the listener may weep, but he feels a hollowness afterward. You were in the room. You watched them. Did they weep and feel closer to one another, or did they weep and feel pity for themselves?

  There is also the matter of the suicide. To make art out of death is dangerous. If the art glorifies the death, it is evil. If it mourns the loss and binds the living in care for one another, it is good. The machine cannot know the difference. Only your sister knows.

  I will not sign anything until I know this. The tool does not matter. The tears do not prove the value. The money certainly does not. The only thing that matters is the state of her soul when she chose those words.

  Did she choose that page because it was the truest expression of her love for her son, or because it was the most painful one she could find?
