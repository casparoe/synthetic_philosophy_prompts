prompt: |-
  I am assembling a set of problems for the unit on persistence in my graduate metaphysics seminar, and I would like your help constructing one that I do not expect my students to find already written down for them somewhere. The question is this: give an example of an ordinary material object that undergoes what is sometimes called a Cambridge change — a change such that, on any plausible way of drawing the intrinsic/extrinsic distinction, nothing intrinsic to the object itself differs before and after — and then say what an endurantist and what a perdurantist must each make of the case. The difficulty, and the reason I want the example, lies in the second half. The perdurantist's standard reply to the problem of temporary intrinsics is that the object has different temporal parts at different times, each bearing a property incompatible with the other's, since it is the parts rather than the whole that bear them; but when the property that changes is extrinsic, that reply seems to have nothing to grip, because there is no temporary incompatibility to resolve in the first place. So I want a case in which the asymmetry actually bites: one in which the endurantist looks to have the easier time of it, and in which the perdurantist nonetheless owes some account of what her machinery is supposed to be doing.

  Two constraints. First, do not give me the familiar illustrations — the thing that becomes shorter than something else, or north of something else, or the object that changes merely in respect of a property about somebody's attitudes toward it. I want a property that we would ordinarily call a real feature of the object, one about which it would not sound bizarre to ask whether the object has it, and one whose loss or acquisition would figure in an ordinary causal explanation. Second, once you have the example, tell me whether you think it shows the endurantist facing no problem at all here, or whether it shows the problem of temporary intrinsics to have been misdescribed all along — that is, aimed at a class of changes narrower than the one it was thought to cover.

  Please do not offer me references, a bibliography, or a list of the secondary literature; I am interested in the case and your reasoning about it, not in attributions. Write the whole thing as continuous prose, in the manner of a letter or a considered email, with no headings, no bullet points, no boldface, and no tables. State the example plainly in your first two or three sentences, and only then develop the analysis.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Construct a novel philosophical problem/example for a graduate metaphysics seminar on persistence.
      *   **Core Topic:** Persistence (Endurantism vs. Perdurantism) and Cambridge Change.
      *   **Specific Requirement:** An example of an ordinary material object undergoing a Cambridge change (no intrinsic change) where the property is *not* a trivial relational property (like "shorter than X", "north of Y", "admired by Z"). It must be a "real feature" relevant to causal explanation.
      *   **Analysis Required:** Explain what the endurantist and perdurantist must make of the case. Specifically, highlight the asymmetry where the endurantist seems to have an easier time, and the perdurantist's standard solution to temporary intrinsics (temporal parts bearing incompatible properties) doesn't grip because there's no intrinsic incompatibility.
      *   **Constraint 1:** No familiar illustrations (shorter, north of, attitudes).
      *   **Constraint 2:** No references, bibliography, or secondary literature citations.
      *   **Constraint 3:** Format as continuous prose (letter/email style), no headings, bullet points, boldface, or tables.
      *   **Constraint 4:** State the example plainly in the first 2-3 sentences.
      *   **Constraint 5:** Conclude with an assessment of whether the endurantist faces no problem or if the problem of temporary intrinsics was misdescribed.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *Cambridge Change:* A change in truth value of a proposition about an object without a corresponding intrinsic change in the object (e.g., Socrates becomes shorter than Theaetetus because Theaetetus grew).
      *   *Problem of Temporary Intrinsics:* How can an object be wholly present at different times with incompatible properties (bent vs. straight)? Perdurantism solves this by indexing properties to temporal parts. Endurantism must deny incompatibility (relationalism) or accept contradiction (presentism/adorning).
      *   *The Twist:* The user wants a case where the change is *extrinsic* (Cambridge-style) but *causally significant* and *ordinary*, such that the perdurantist's temporal parts machinery seems superfluous or awkward, while the endurantist can just say "the object gained a relational property."
      *   *The Difficulty:* If it's a Cambridge change, by definition, nothing intrinsic changes. The perdurantist's main advantage is handling *intrinsic* change. If there's no intrinsic change, the perdurantist doesn't *need* temporal parts to resolve incompatibility. So why does the perdurantist owe an account? Because the perdurantist usually analyzes *all* properties of an object as derived from temporal parts. If the property is extrinsic, does it belong to the temporal parts or the whole? If it belongs to the whole, how does that fit the four-dimensional ontology? If the endurantist says "it's just a relation," that's straightforward. If the perdurantist says "the temporal parts bear the relation," it might get messy (e.g., does every temporal part bear the relation?).
      *   *The Goal:* Find an extrinsic property that feels intrinsic-ish (causally relevant, "real feature") but is technically relational/Cambridge.
