answer: |-
  Consider a hardened space probe drifting through the void that is suddenly captured by a planet's gravitational field, thereby becoming a satellite without undergoing any internal mechanical or structural alteration. This acquisition of the status of being a satellite is a change in the object's relational properties rather than its intrinsic constitution, yet it is a feature that figures directly in causal explanations, such as why the probe eventually burned up in the atmosphere or why it began transmitting data from a specific orbital period. We can ask what the endurantist and perdurantist must say about this object's persistence through this transition, and the case reveals a distinct asymmetry in how their respective ontologies handle extrinsic change.

  For the endurantist, the analysis is straightforward because the framework is designed to accommodate objects that are wholly present at each moment of their existence. On this view, the probe is a single, enduring entity that simply enters into a new relation with the planet at the moment of capture. There is no contradiction in saying that the very same object, identical in every intrinsic respect, stands in the relation of orbiting at time t2 that it did not stand in at time t1. The endurantist treats the change as a genuine alteration in the object's profile, specifically an extrinsic one, and since there is no conflict between being a satellite and having previously not been one, there is no need to qualify how the object bears the property. The object bears it simpliciter at the later time, and the lack of intrinsic change means there is no threat to the object's identity or integrity. The endurantist faces no problem here because the machinery of endurance is perfectly suited to tracking an object through changes in its relational context without requiring the object itself to fragment.

  The perdurantist, however, finds themselves in a position where their standard machinery is active but seemingly idle. The perdurantist ontology dictates that the probe is a four-dimensional worm composed of temporal parts, and properties are typically analyzed as being borne by these parts rather than the whole. In the classic problem of temporary intrinsics, this move is essential to resolve the contradiction of an object being both straight and bent; the early parts are straight and the later parts are bent, so the whole is neither. In the case of the probe becoming a satellite, there is no incompatibility to resolve, as the property of being a satellite is not incompatible with the property of not having been a satellite. Nevertheless, the perdurantist must still maintain that it is the post-capture temporal parts that bear the relation of orbiting the planet, while the pre-capture parts do not. This forces the perdurantist to offer an account of how the whole worm inherits the label of satellite. They must explain that the object counts as a satellite in virtue of having later stages that orbit, which requires a theory of how extrinsic properties of parts aggregate to the whole. This is an ontological cost that yields no benefit in terms of resolving logical tension, whereas the endurantist incurs no such cost.

  This case suggests that the endurantist faces no problem at all here, and it indicates that the problem of temporary intrinsics was correctly described all along as a puzzle specific to intrinsic incompatibility. The perdurantist's advantage lies in dissolving the contradiction of an object having incompatible intrinsic properties at different times, but that advantage does not generalize to extrinsic changes where no contradiction exists. When the change is merely Cambridge in nature but causally significant, the perdurantist's temporal parts machinery does not grip the problem in the way it does for intrinsics, because there is no tension to relieve. Instead, the perdurantist must simply assert that the relational property attaches to specific segments of the worm, leaving them with a more complex story about property attribution than the endurantist, who can simply say the object gained a relation. Thus, the example demonstrates that the perdurantist solution is specialized for intrinsic change, and in the domain of extrinsic change, the endurantist retains a simpler and more direct account of persistence.
