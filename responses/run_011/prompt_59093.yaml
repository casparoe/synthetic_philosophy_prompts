      *   *Selection:* **Being a satellite.**
          *   *Object:* A rock (or a manufactured probe).
          *   *Change:* It becomes a satellite of Earth.
          *   *Mechanism:* It gets captured by Earth's gravity (or launched).
          *   *Intrinsic Change:* None (assuming the rock/probe itself doesn't break or change composition during capture).
          *   *Extrinsic Change:* It goes from not orbiting Earth to orbiting Earth.
          *   *Causal Relevance:* Being a satellite affects its trajectory, exposure to radiation, potential for collision, utility for communication (if a probe), etc. It's a "real feature" in astronomy and engineering.
          *   *Cambridge Change:* Yes, because the change is purely relational (position/velocity relative to Earth).
          *   *Endurantist:* The whole object gains a relational property. Easy.
          *   *Perdurantist:* The temporal parts before capture don't have the property; the temporal parts after do. But since the property is relational, does the temporal part bear the relation to the Earth's temporal parts? Yes. But the "object" (the sum) doesn't bear the property simpliciter. The perdurantist has to explain how the *whole* worm counts as a satellite if only later parts orbit. Usually, we say the worm *is* a satellite if most parts or the relevant parts orbit. But this feels like it complicates the simple relational account the endurantist has.
