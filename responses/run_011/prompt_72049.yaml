answer: |-
  This is a sophisticated pedagogical design. It targets the "hard problem" of agency (is flexibility just complex rigidity?) by forcing students to *inhabit* the tension between fidelity and success.

  However, your sketch is optimistic about time and the stability of the "three rigidities." In a 75-minute session with 20 students, logistics will eat you alive if the auditing is granular. Below is a hardened, runnable version of your plan. I have streamlined the auditing, clarified the loop mechanics to ensure it looks like "work," and adjusted the rigidity categories to match what is empirically observable in a short seminar.

  ### 1. Rules and Materials

  **Materials (Stationery Cupboard Only):**
  *   **Index Cards:** 100 count (50 Blue, 50 Red). If only white available, mark half with a dot.
  *   **Envelopes:** 5 large (one per team).
  *   **Paper:** A4/Letter for "Action Logs" and "Deviation Slips."
  *   **Pens:** 20.
  *   **Paperclips:** 20 (for token manipulation).
  *   **Masking Tape:** To mark "Zone A" and "Zone B" on tables.

  **Points System:**
  *   Do not convert points to grades or food. It trivializes the philosophical tension.
  *   **Currency:** "Agency Credits."
  *   **Redemption:** The team with the highest *weighted* score chooses the **opening question** for next week's seminar. This gives them control over the discourse, fitting the theme.
  *   **Secrecy:** The weighting formula (Success vs. Fidelity) is hidden until after Round 2.

  **General Rules:**
  1.  **Teams:** 5 teams of 4. Roles: *Operator* (moves cards), *Reader* (reads protocol), *Auditor* (watches the team to their left), *Scribe* (logs actions). Rotate roles every round.
  2.  **Silence:** No talking between teams during rounds.
  3.  **The Protocol:** Must be followed literally. Ambiguities are not yours to resolve; they are part of the environment.
  4.  **The Deviation:** If you break the protocol, you must mark the exact second on your log and write a "Deviation Slip."

  ### 2. Round-by-Round Protocol & Alterations

  Each envelope contains the **Master Protocol** (same for all rounds) and **Round Specific Directives**.

  **The Master Protocol (Printed on Card):**
  1.  Place all cards face down in Zone A.
  2.  Pick up top card from Zone A.
  3.  Check color.
  4.  **IF Blue:** Place in Zone B.
  5.  **IF Red:** Place in Zone C (marked with tape).
  6.  **IF Zone B has > 3 cards:** Move top card from Zone B back to Zone A.
  7.  Repeat until Zone A is empty.
  8.  Raise hand to finish.

  **Round 1: Baseline (5 Minutes)**
  *   **Setup:** 6 Blue, 4 Red cards in Zone A.
  *   **Environment:** Standard.
  *   **Goal:** Establish baseline speed and fidelity.
  *   **Expected Outcome:** All teams finish. High Success, High Fidelity.

  **Round 2: Notice-Rigidity (The "Void") (10 Minutes)**
  *   **Setup:** 10 Blue cards in Zone A. **No Red cards exist in the room.**
  *   **Alteration:** I (Instructor) silently remove all Red cards from the room before class starts, but the Protocol Step 5 remains.
  *   **Trap:** The protocol assumes Red cards exist. Teams following the protocol literally will pause at Step 5 waiting for a Red card that never comes, or they will improvise (breaking Fidelity).
  *   **Target Rigidity:** *Notice-Rigidity.* Teams that fail to notice the absence of Red cards and stall, or teams that notice but follow the "Check Color" step endlessly.
  *   **Correction:** To prevent total stall, add a clause to Round 2 Directive: "If a condition cannot be met, wait 10 seconds then proceed." This forces them to *log* the impossibility rather than stall forever.

  **Round 3: Protocol-Rigidity (The "Loop") (15 Minutes)**
  *   **Setup:** 4 Blue cards in Zone A.
  *   **Alteration:** I physically move Zone B closer to Zone A, or simply instruct: **"For this round, Step 6 is mandatory."**
  *   **Trap:** Step 6 says "IF Zone B has > 3 cards, move one back to A."
      *   *The Loop:* I will verbally amend Step 6 for this round only: *"IF Zone B has > 0 cards, move top card from Zone B back to Zone A."*
      *   *Result:* As soon as a Blue card hits Zone B, it returns to A. Zone A is never empty. Step 8 is never reached.
  *   **Target Rigidity:** *Protocol-Rigidity.* Teams that see the loop but continue because Fidelity points are now known to be high (see Scoring). They are "working" (moving cards) but failing Success.
  *   **Visual:** It must look like busy work. The cards are moving. It is not standing still.

  **Round 4: The Rule Handover (15 Minutes)**
  *   **Setup:** Standard 6 Blue, 4 Red.
  *   **Directive:** "Discard Master Protocol. Execute the **Deviation Rule** provided by Team [X]."
  *   **Mechanism:** Collect Deviation Slips from Round 2 & 3. Give Team 1 the slip from Team 3, etc.
  *   **Trap:** Most deviation slips will say "I skipped Step 6 because it was stupid." This is not a rule. The new team must try to operationalize "because it was stupid."
  *   **Target:** To demonstrate that "flexibility" is hard to codify.

  ### 3. Scoring Scheme & Auditing

  **The Tension:**
  *   **Success Score (S):** 10 points per card correctly sorted in final state. Max 100.
  *   **Fidelity Score (F):** 5 points per Master Protocol step executed exactly as written. Max 50.

  **The Reveal:**
  *   **After Round 1:** No scoring yet.
  *   **After Round 2:** Reveal Weights. **Round 1 & 2:** Success = 80%, Fidelity = 20%. (Reward problem solving).
  *   **Before Round 3:** Announce Weight Change. **Round 3 & 4:** Success = 20%, Fidelity = 80%. (Reward obedience).
      *   *Note:* This sudden shift is crucial. It makes the Loop (Round 3) a test of whether they can switch from "Winning" to "Obeying."

  **The Auditor's Job:**
  *   Each team's Auditor watches the team to their *left*.
  *   They hold a checklist of the 8 Master Protocol steps.
  *   They tick boxes only if the step was performed *exactly*.
  *   **Crucial:** If a team breaks the protocol to solve the Loop (Success), the Auditor *must* mark Fidelity down. This makes the students police each other's "freedom."

  ### 4. Deviation Log & Rule Handover

  **The Instrument (Deviation Slip):**
  A small slip of paper collected at the end of Rounds 2 and 3.
  *   *Field 1:* Time of departure (e.g., "Minute 1:30").
  *   *Field 2:* Step skipped/altered.
  *   *Field 3:* **The Rule.** "I departed because..." (Must be written as an instruction someone else could follow).

  **The Handover Mechanics:**
  *   In Round 4, teams receive a packet of 3 Deviation Slips from other teams.
  *   They must synthesize these into a **Single New Protocol**.
  *   *The Catch:* If the slips say "I used my judgment," the new team cannot execute them. They will likely freeze or argue. This is the data point you want.

  ### 5. Timeline (75 Minutes)

  *   **00-05:** **Setup.** Divide into 5 teams. Assign Roles. Distribute Envelopes (Closed).
  *   **05-10:** **Round 1 (Baseline).** Run task. Collect Logs. No scoring discussion.
  *   **10-20:** **Round 2 (Notice/Void).** Run task. **Reveal Scoring Weights (Success Heavy).** Discuss briefly: "Why did some teams stall?"
  *   **20-35:** **Round 3 (The Loop).** **Reveal Scoring Weights (Fidelity Heavy).** Run task.
      *   *Instructor Note:* Walk around. If a team stops the loop, remind them: "Fidelity is now 80%. Check your steps."
  *   **35-50:** **Round 4 (Rule Handover).** Distribute Deviation Slips. Teams try to build a protocol from them. Run task.
  *   **50-55:** **Score Tally.** Auditors report. Calculate "Agency Credits."
  *   **55-75:** **Debrief.** (See below).

  **Debrief Question Sequence:**
  1.  **Round 3 Experience:** "Team 2, you stopped the loop. You lost Fidelity points. Did you feel you made a mistake, or that the game was broken?" (Targets: Rationality vs. Obedience).
  2.  **The Auditor's Burden:** "Auditors, did it feel uncomfortable to penalize a team for solving the problem?" (Targets: The social cost of enforcing mechanism).
  3.  **The Deviation Slips:** "Round 4 teams, could you execute the rules you were given? If not, what was missing?" (Targets: The ineffability of judgment).
  4.  **The Fork:** "If you *could* have written a perfect rule for when to break the rule in Round 3, would you have been a machine or a human? If you *couldn't*, how did you decide?"
  5.  **The Reveal:** Introduce "Sphex." "Two weeks ago we discussed a wasp. How many of you felt like the wasp in Round 3? How many felt like the observer?"

  ### 6. Predictable Failure Modes & Fixes

  **Failure 1: The "Meta-Game" Guessers.**
  *   *Risk:* By Round 2, a CogSci student realizes you are manipulating the environment. They stop playing the task and start playing *you*.
  *   *Fix:* Do not deny it. In the debrief, categorize this as **Goal-Rigidity**. They became rigidly focused on "Beating the Instructor" rather than "Doing the Task." This preserves the philosophical point: they swapped one mechanism (Protocol) for another (Meta-Game).
  *   *Script:* "You noticed the manipulation. But did you escape the system, or just find a deeper rule within it?"

  **Failure 2: The Loop Dissolves into Giggles.**
  *   *Risk:* Moving cards back and forth looks silly. The tension evaporates.
  *   *Fix:* Increase the stakes of the Audit. The Auditor must *verbally call out* every step. "Step 4 executed. Step 5 executed." This creates a bureaucratic atmosphere that kills the fun and highlights the absurdity.
  *   *Fix 2:* If they laugh, stop the timer. "This is the exact moment of Sphexishness. The absurdity is the point. Resume."

  **Failure 3: Goal-Rigidity Collapses.**
  *   *Risk:* You wanted three rigidities. In practice, Notice and Protocol rigidity look the same (they follow the steps). Goal rigidity (chasing impossible success) is hard to separate from Meta-Gaming.
  *   *Honest Assessment:* You will likely only get two clear categories: **Blind Obedience** (Notice/Protocol) and **Rebellious Success** (Breaking the loop).
  *   *Adjustment:* In the debrief, admit this. "I hoped to see three types. We saw two. Why was the third invisible?" (Answer: Because humans are bad at being truly blind, or bad at being truly goal-fixated without a rule).

  **Failure 4: Time Overrun.**
  *   *Risk:* Auditing takes too long.
  *   *Fix:* Limit auditing to *one* contested step per round. "Auditors, did they violate Step 6? Yes/No." Don't check the whole log live. Collect logs and sample them later if needed, but give provisional scores immediately for the debrief.

  ### 7. Contingency: The "Wasp" Spoiler

  **Scenario:** A student shouts, "This is the Sphex wasp!" in Round 3.
  **Response:** Do not confirm or deny. Do not stop the class.
  **Script:** "That is a hypothesis. Hypotheses are tested *after* data collection. Please record that hypothesis on your Deviation Slip and return to Step 4."
  **Why:** This treats the philosophical label as just another "rule" or "distraction," reinforcing the idea that naming the mechanism doesn't escape it.

  ### 8. Closing Note: What This Activity Cannot Reproduce

  You asked for honesty on the limitations. You must supply these in words during the debrief, or the students will leave with a simplified view.

  **Limitation 1: The Hawthorne Effect (Observation).**
  *   *The Gap:* The wasp is not being graded. The wasp has no Auditor. Your students are performing *for* you. Their "flexibility" in Round 3 might just be performance art to look smart to the professor, not genuine agency.
  *   *Debrief Point:* "If I left the room, would you have stayed in the loop? The wasp doesn't care if anyone watches. You do. Does social pressure count as a 'mechanism'?"

  **Limitation 2: Biological Drive vs. Arbitrary Points.**
  *   *The Gap:* The wasp drags the cricket because its nervous system is wired to seek reproduction/survival. It *cannot* do otherwise without brain damage. Your students drag the cards for "Agency Credits" (seating choice). They can opt out anytime. Their "obedience" is consent; the wasp's is causality.
  *   *Debrief Point:* "You chose to obey in Round 3 to get points. The wasp did not choose. Is 'choice' just the feeling of having a more complex reward function?"

  **Limitation 3: The "Homunculus" Trap.**
  *   *The Gap:* The activity implies there is a "You" inside that decides to break the rule. The activity cannot prove that *that* decision wasn't also determined by prior causes (hunger, boredom, desire to look clever).
  *   *Debrief Point:* "You wrote a rule for breaking the rule. If that rule was determined by your brain state, are you just a wasp with a longer protocol? I cannot answer that for you today."

  ### Final Advice for the Instructor
  Your role in Rounds 2 and 3 is to be a **Bureaucrat**, not a Teacher. Wear the "Fidelity" weight heavily. If a team asks, "But this is looping," reply only: "Check Step 6." This discomfort is the pedagogical engine. If you soften, the lesson fails. Let them feel the frustration of being a machine.
