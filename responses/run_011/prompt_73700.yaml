      *   **(5) vs. (1):** (5) says DNA carries a *specification*. (1) says the code is physicochemical affinity.
          *   *Tension:* If the mapping is physical necessity (1), is it a "specification" or just a structural complement? A key fits a lock by physics; does the key "specify" the lock?
