          *   *Alternative:* Revising (3). If "error" is defined by fitness (per 4), then "code" is a metaphor for "causal chain with fitness consequences." But the user wants to defend "Literal Code."
          *   *Best Revision:* Weaken (4). Acknowledge *system-relative* normativity (organizational closure) distinct from *fitness* normativity. This preserves (2) and (3) without invoking spooky teleology.
          *   *Actually, looking at (1):* (1) is the most scientifically contentious. The "Stereochemical Hypothesis" is not the consensus (Frozen Accident + Selection is more standard). But the prompt asks for *internal coherence*, not scientific consensus. However, (1) makes (2) harder to defend philosophically (arbitrariness).
          *   *Re-evaluating the "Single Revision":* If I tell them to drop (4), I'm asking them to change their metaphysical stance on normativity. If I tell them to drop (1), I'm asking them to change their scientific hypothesis.
          *   *Coherence focus:* The clash between (3) [Semantic Error] and (4) [Fitness Error] is the logical bottleneck. To keep "Literal Code," you need Semantic Norms. (4) denies Semantic Norms.
          *   *Recommendation:* Modify (4) to distinguish between *system correctness* (translation fidelity) and *evolutionary success* (fitness).

