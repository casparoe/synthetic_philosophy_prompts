          *   *Severity:* Low/Apparent.

      *   **(6) Internal Tension:** "Universal" vs. "Variant codes."
          *   *Tension:* Logical contradiction. It cannot be strictly universal if there are exceptions.
          *   *Resolution:* "Nearly universal" is the scientific standard. Claiming both "universal" and "variant" is linguistically sloppy.
          *   *Severity:* Low (fixable by wording), but logically strict.

      *   **(1) vs. (3):** If the mapping is physical affinity (1), is "mistranslation" (3) a semiotic error or just a chemical failure?
          *   *Tension:* If Codon X *physically demands* Amino Acid Y, then putting Amino Acid Z there is a chemical bond failure, not necessarily a "reading error" in the informational sense.
