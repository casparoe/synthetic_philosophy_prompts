      *   *Specific focus on (3) vs (4):* (3) relies on the *possibility* of error (modal). (4) defines error *actualistically* via fitness. If a mutation is neutral, (4) says it's not a mistake. (3) says if it changes the amino acid, it *is* a mistranslation regardless of fitness. This is a direct contradiction.

      *   *Ranking:*
