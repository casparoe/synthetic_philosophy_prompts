          *   Option B: Drop (4). Allow intrinsic biological normativity (e.g., teleosemantics or organizational closure). This fixes the 3vs4 clash and helps 1vs2 (by allowing the system to define its own norms independent of fitness).
          *   Option C: Modify (3).
          *   *Decision:* Revising (4) is the heavy lifter. If the user allows for *intrinsic* normativity (based on the system's maintenance/organization) rather than just *evolutionary* normativity (fitness), then (3) works (errors are violations of system maintenance) and (2) works (meaning is grounded in system function).
