          *   *Rank:* 2.

      *   **Tension C (The Universality Contradiction):** (6) claims universality and variants.
          *   *Why it's bad:* Logical contradiction.
          *   *Rank:* 3 (Easiest to fix, but logically fatal if untouched).

  5.  **Drafting the Audit:**

      *   *Introduction:* Acknowledge the sophistication of the package. It's a "Stereochemical-Semiotic-Naturalist" hybrid.
      *   *Apparent Tensions:* Address (6) first (terminological). Address (5) vs Causal Parity (this is actually a standard move in philosophy of biology, e.g., Godfrey-Smith, so it's defensible).
      *   *Real Tensions:*
