      *   **Tension A (The Normativity Gap):** (3) requires genuine "mistakes of reading" to justify "code." (4) restricts normativity to fitness (statistical success).
          *   *Why it's bad:* Semiotic errors (syntax/semantics) are distinct from functional failures (pragmatics/fitness). A stop codon read as Glutamine is a semantic error regardless of whether the organism survives. (4) denies the semantic normativity required by (3).
