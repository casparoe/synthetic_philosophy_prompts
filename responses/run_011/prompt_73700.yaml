          *   *Resolution:* Many philosophers (e.g., Barbieri, Pattee) argue constraints don't preclude coding if there's a separation of laws and constraints. However, strong stereochemistry weakens the "arbitrariness" often associated with "code."
          *   *Severity:* Moderate.

      *   **(3) vs. (4):** (3) says errors license the term "code." (4) says mistakes are only defined by fitness, not molecular rules.
          *   *Tension:* (3) implies a *semantic* error (reading the wrong symbol). (4) implies a *functional* error (reducing fitness). A mistranslation can be semantically wrong but fitness-neutral or even beneficial. If normativity is *only* fitness (4), can we really call a mistranslation a "mistake of reading" (3) in the semiotic sense?
