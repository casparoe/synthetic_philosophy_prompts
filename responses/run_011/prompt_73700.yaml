      *   **(4) No Normativity beyond Fitness:** Mutations are only "mistakes" relative to reproductive success (statistical), not molecular rules.
      *   **(5) Causal Parity + Specification Asymmetry:** Accepts causal parity (DNA isn't the sole cause), but claims DNA is unique in carrying a *specification*.
      *   **(6) Universality vs. Variants:** Claims the code is universal *and* acknowledges variant codes (mitochondria, etc.).

