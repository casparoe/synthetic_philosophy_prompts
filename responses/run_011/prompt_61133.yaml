prompt: |-
  You're a philosopher of science who's done a lot of work on the falsification side of things — Duhem–Quine, Lakatos on immunising stratagems — but who also actually reads the history of economic thought rather than just name-checking it. I need your help turning a half-formed idea into a proposal for a dissertation chapter (roughly 9,000 words, one semester to write it). Please write the whole thing in British English.

  The idea. Everyone "knows" Malthus was wrong: population didn't outrun food supply, because yields exploded and then fertility collapsed. But the usual retort — that he was right but early, or right about everything up to the industrial revolution and wrong only about afterwards — strikes me as doing no philosophical work whatsoever. It just relocates the failure to a date that nobody specified in advance. My hunch is that a right-but-early defence is legitimate only when the delay is attributable to a countervailing factor that was independantly identified, and whose magnitude could in principle have been bounded before the fact; and that it's an immunising move when the timescale functions as a free parameter of the theory, so that any date at which the mechanism finally kicks in is equally compatible with it. I want to sharpen that into something closer to an explicit criterion, and then run Malthus through it.

  Two wrinkles the chapter has to handle, dont let them drop out:

  (a) Malthus himself introduced prudential or moral restraint as a preventive check when he expanded the Essay, and the demographic transition looks on the surface like that very check operating. So was his own auxiliary vindicated, or is this a rescue that merely resembles a vindication because the outcome matched while the causal story didn't? I keep circling a distinction between outcome vindication and mechanism vindication and I want it to actually bear weight.

  (b) The Simon–Ehrlich wager over metal prices, settled in 1990, gets offered as the clean case of a Malthusian prediction failing on a fixed date. I want to know whether fixing a date really changes the analysis, or just hides the same free-parameter problem inside the choice of what to bet on.

  Think carefully before you write anything, and start with a short brainstorm — a paragraph or two — pressure-testing my hunch: where the criterion misfires, the most obvious objection to it, and whether there's a better way to carve the distinction than the one I've sketched. Then give me the proposal proper, containing:

  - the question stated precisely enough that it could have a determinate answer;
  - why the existing positions leave it open, and specifically why Lakatos's progressive-versus-degenerating distinction and the Duhemian point about auxiliary hypotheses both fail to settle it (my suspicion is that both are essentially retrospective whereas I'm trying to get something that bites before the outcome is known — tell me if that suspicion is wrong);
  - the method, section by section, saying what I'd actually do in each section and what the criterion looks like as a set of stated conditions rather than a vibe;
  - what a result would look like, and what would count as the project failing — I'd call it a failure if the criterion sorts every historical case the same way, or if it can only be applied once you already know how things turned out;
  - an honest closing note on whether this is too much for one chapter, and what I should cut first if it is.

  Don't bother with citations, references or a reading list, I'll add those myself — just refer to positions and arguments by name where you can't avoid it. And no padding: I don't want a boilerplate paragraph about why this matters for public policy, and please don't finish with a cheerleading bit about how promising the project is.
