  **MEMORANDUM**

  **TO:** Grants Panel and Board of Trustees
  **FROM:** Chair, Grants Panel
  **DATE:** [Date]
  **RE:** Cycle [X] Funding Decisions and Process Reform

  **1. Decision**
  We will fund Proposal A up to $[AMOUNT] contingent on meeting the month-18 observables specified in their submission. We will fund Proposal B up to $[AMOUNT], representing 50% of their requested budget, to account for unmodeled uncertainty. This allocates $[TOTAL] of the current quarter's budget, with disbursement schedules attached. The Board will review the milestone data for Proposal A on [DATE].

  **2. Engagement for Dissenting Members**
  For the members concerned that Proposal A is unfalsifiable: this decision treats the grant not as a purchase of output, but as a real option (a financial term for the right, but not the obligation, to take an action) on policy adoption. The month-18 observables function as kill-switches; if the assumptions fail, funding stops. This satisfies the requirement for accountability without manufacturing false precision. For the members concerned that Proposal B is false precision: we are explicitly discounting their score. We are acknowledging that their interval ignores model uncertainty (the risk that the model itself is wrong, not just the inputs), which their standard errors did not capture. We are not accepting their number; we are taxing it.

  **3. Screening Test for Strategic Vagueness**
  To distinguish honest uncertainty from strategic obfuscation in future cycles, the panel will apply the "External Calibration Test" during review. When an applicant claims quantification is impossible for their project, we will ask them to assign a probability of success to a *different* organization's similar project using public data. If they can quantify risk for others but not themselves, the refusal is strategic. If they cannot quantify risk for either, the uncertainty is likely honest. This requires no new staff, only a shift in questioning during the interview phase. It exploits the incentive structure by forcing applicants to demonstrate competence in probabilistic reasoning elsewhere before claiming exemption.

  **4. Assessment of Proposal A's Format**
  Proposal A's list of assumptions and observables does not substitute for a probability, but it substitutes for a *commitment to update*. A probability is a static claim; a list of falsifiable conditions is a dynamic contract. It relocates judgment from "guessing the future" to "monitoring the present." However, judging which assumptions are load-bearing is indeed probabilistic judgment with implicit numbers. The advantage is that it makes the dependencies visible rather than hiding them inside a spreadsheet. "This cannot be quantified" is rarely a final answer; it is usually a demand for a better-posed question. In this case, the better question was not "What is the ROI?" but "What would prove this is failing?" Proposal A answered the latter.

  **5. Form Changes for Next Cycle**
  We are retiring the requirement for a single expected-impact figure. The new requirement reads: *"Describe the primary mechanism of value creation and list the three specific conditions under which this mechanism would fail to operate, regardless of execution quality. For each condition, specify the observable evidence that would confirm its failure."* This costs us the ability to rank proposals by a single metric. We lose comparability across heterogeneous portfolios. To address the members who believe the current form produces confident fiction, we will no longer allow intervals derived solely from statistical error; all intervals must include a qualitative adjustment for model uncertainty.

  **6. Strongest Consideration Against This Recommendation**
  The strongest argument against this decision is that it institutionalizes inconsistency. By funding A without a number and B with a discounted number, we establish no clear rule for future applicants. A savvy applicant will learn that refusing to quantify yields funding without the risk of being wrong, while honest quantification yields a discount. This creates a perverse incentive where the best strategy is to argue loudly against quantification rather than to improve measurement. Over time, this erodes the foundation's ability to compare impact across sectors, turning every grant decision into a unique negotiation rather than a portfolio selection.

  **7. The Portfolio Question**
  Finally, we must address why we ranked these proposals as individual bets rather than portfolio components. A single expected-value ranking is the wrong instrument for a portfolio because it ignores correlation (a statistical term for how two variables move in relation to each other). Our goal is not to hold the five highest-scoring bets, but the five bets that provide the best mix of risk and diversification. Proposal A (policy) and Proposal B (labor) are uncorrelated; holding both reduces the risk of total portfolio failure compared to holding two labor programs. This dissolves the deadlock regarding commensurability. We do not need A and B to be measured in the same unit to hold both; we need them to behave differently under stress. The deadlock survives only if we insist on a single ranking metric, which is why we are abandoning it.

  **[ASSUMPTION: Insert specific dollar amounts for Section 1 based on current cash flow.]**
  **[ASSUMPTION: Insert specific Board review date based on quarterly calendar.]**
