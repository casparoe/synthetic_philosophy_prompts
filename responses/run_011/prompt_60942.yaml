  ### 1. The Principles Consistent with the Six Rulings

  Your six rulings are jointly consistent with two competing methodological principles. Both explain the approvals and rejections, but they diverge on what constitutes sufficient evidence for a "cultural" cause.

  **Principle A: The Exogenous Identification Principle**
  *   **Definition:** A cultural claim is valid if the purported cause is measured *independently* of the outcome and *temporally prior* to it, ideally using a research design (like a discontinuity) that rules out confounders. The specific content of the belief need not be observed if the historical marker is a valid proxy.
  *   **Consistency:** This justifies **Case 1** (census shares predict laws), **Case 3** (survey items predict turnout), and **Case 5** (writings predict relief). It justifies rejecting **Case 2** (no measure), **Case 4** (post-treatment measure), and **Case 6** (inferred from outcome).
  *   **The Stress Test:** This principle handles the **Relief-Program Case (5)** easily: the writings are exogenous records of intent prior to/during the allocation.
  *   **The Weakness:** It allows "black box" cultural claims where the mechanism is assumed rather than shown.

  **Principle B: The Construct Validity Principle**
  *   **Definition:** A cultural claim is valid only if there is evidence that the specific *content* of the value or norm was actually present and operative in the relevant actors at the time of the outcome. Demographic proxies (like census shares) are insufficient without evidence linking them to the specific value.
  *   **Consistency:** This justifies **Case 3** (duty measured directly), **Case 5** (writings reveal the decision rule), and the rejections of **Case 2, 4, 6** (no valid measure of the value).
  *   **The Stress Test:** This is the principle that **struggles with the Relief-Program Case (5)** if interpreted strictly as requiring *population-level* or *quantitative* measurement. Case 5 relies on elite archival narratives, not a representative measure of the "culture" of the province. If your rule were "culture must be measured in the affected population via standardized items," Case 5 would have been rejected. It also puts **Case 1** on thin ice (census shares are demographics, not beliefs), suggesting Case 1 was approved on Principle A, not Principle B.

  ### 2. Analysis of the Current Proposal

  **The Proposal:** A historical border discontinuity (19th-century census) predicting modern self-employment, admitting the religious mechanism is defunct.

  *   **Under Principle A (Identification):** **Approve.** The design is rigorous (RD design, historical measure, controls). The "culture" variable (confessional share) is independent of the outcome (modern self-employment). The admission that the belief is gone is treated as a feature (persistence of legacy), not a bug.
  *   **Under Principle B (Construct Validity):** **Reject.** The authors explicitly state the mechanism (ethic of calling) is "neither measured nor plausibly still operative." They are claiming a value caused an outcome while admitting the value does not exist in the population. This is functionally identical to **Case 2** (Confucian ethic causing growth without measuring the ethic).

  ### 3. Recommendation and Closest Analog

  **Recommendation: Reject.**

  **The Closest Analog:**
  *   **The Flattering Analog:** **Case 1 (Factory Laws).** Methodologically, this is identical: a confessional border, census shares, and a discontinuity design. Authors will cite this to demand approval.
  *   **The Genuine Analog:** **Case 2 (Confucian Growth).** Substantively, this is the match. Case 1 explained *laws* (institutions), which can persist without beliefs. The current proposal explains *self-employment* (individual economic behavior) via an *ethic* (psychological/cultural trait). Claiming an "ethic" causes behavior without measuring the ethic—and while admitting the ethic is dead—is the exact tautology risk that killed Case 2. You approved Case 1 because institutions can outlast beliefs; you cannot approve this because behaviors (unlike laws) generally require contemporary motivation.

  ### 4. The Commitment

  The precedents underdetermine this case because Case 1 and Case 5 pull in different directions. Your decision commits the foundation to one of two definitions of "culture":

  *   **If you Approve:** You commit to **"Culture as Historical Legacy."** You are ruling that "culture" can be a placeholder for any persistent historical difference that survives the death of the original belief system (e.g., social capital, trust networks, or unobserved institutions). You effectively decouple "cultural cause" from "cultural belief."
  *   **If you Reject:** You commit to **"Culture as Operative Mechanism."** You are ruling that a cultural explanation requires evidence that the values or norms are actually held by the actors in the study. You prioritize construct validity over identification design when the mechanism is explicitly admitted to be absent.

  ### 5. Discriminating Detail and Hypothetical Case

  **Discriminating Detail:**
  Ask the authors: **Do they have data on institutional persistence?**
  If they can show that the Protestant side had different *commercial laws, guild structures, or property rights* that persisted into the 21st century, the claim shifts from "culture caused this" to "institutions caused this." If they cannot, and insist it is purely "socialization" or "ethic" despite the religion vanishing, the claim is unsupported. The detail that discriminates is whether the channel is *institutional* (compatible with Case 1) or *psychological* (incompatible with Case 2).

  **Hypothetical Eighth Case:**
  To deliberately test this split, the panel should consider:
  *   **The "Harmonized Institutions" Case:** A proposal comparing two regions with a historical cultural border, where a subsequent political regime *fully harmonized* all laws, taxes, and institutions across the border 50 years ago, yet economic differences persist.
      *   **Principle A** would approve this (the cultural marker is still exogenous).
      *   **Principle B** would reject this (if institutions are gone and beliefs are gone, what is the mechanism?).
      *   Funding this case would force you to decide if "culture" can exist as a "ghost" without beliefs or institutions.
