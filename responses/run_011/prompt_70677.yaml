answer: |-
  When I got out in March, I had to fill out a form. Just like the ones on the tables today. There was a box that asked for my address. I sat there for ten minutes. I hadn't had an address in nine years. I didn't know what to write. I finally put down the street where my brother lives. I put down the name of the town. I put my name next to it.

  That box didn't change the mail system. It didn't fix the housing problem. But it put me on a list. It said I am somewhere.

  They asked me to come up here and tell you why you should fill out these forms. They probably expect me to say your vote counts. Or that it's our duty. I'm not going to say that. Because I don't know if it counts. I looked at the odds. In a city race, the chance that my ballot changes the winner is almost nothing. You know that too. You know the system doesn't always listen. You know sometimes both choices are bad. You know you don't owe this place a damn thing.

  So why are we here?

  It isn't about the winner. It's about the record.

  When you fill this out, you are going on the record. You are saying, "I am here. I am on this side." Maybe nothing changes next week. Maybe the person you pick loses. But there is a paper trail that says you showed up. The state keeps records on us. Court dates. Supervision meetings. Violations. This is the one record where we put our own names down. Where we choose the line.

  I know some of you can't fill this out. Some of you are still on supervision. Some of you have fines you can't pay. Some of you are from places where the law says never. I know what that feels like. It feels like the door slamming while everyone else walks through. I'm not going to tell you it's fair. It isn't. I'm not going to tell you to wait for next time. Maybe there isn't a next time.

  But you are in this room. That matters.

  The act isn't just the paper. The act is the gathering. For those who can't vote, you are witnessing the claim. You are the reason the claim is necessary. You are on the record of this room. You are here, saying we exist, even when the law says we don't. That isn't a consolation prize. That is evidence.

  There are people outside who say most folks shouldn't vote. They say people vote badly. They say you shouldn't add a bad vote to the pile. I hear that. I lived that for nine years. The sentence was the state saying I wasn't fit to participate. That was the punishment. They decided I couldn't be trusted. This form says I decide. Whether you vote for the longshot. Whether you leave it blank. Whether you walk out without signing. That is your choice. But make it because you chose it. Not because you were told to disappear.

  If you vote for someone who can't win, you are still on the record. If you don't vote at all, you are still in the room. The point isn't to save the system. The point is to say you are here.

  So fill out the form if you can. Put your address in the box. Even if you aren't sure where you'll be next month. Put it down. Say you are somewhere.

  And if you can't fill it out, stay in the room. Watch us do it. Be the witness.

  We aren't doing this because it fixes everything. We are doing it because we are here. And we get to say it.
