prompt: |-
  I teach a 200-level philosophy of AI course — 28 students, mixed majors, roughly half have written some code and half have never touched it — and we get one 80-minute session on the idea that you can work out what people want by watching what they do. Inverse reinforcement learning, preference inference from behavior, call it what you like. I don't want to lecture them about it. I want them to *be* the inference engine and get burned by it.

  I've got a half-designed activity and I want you to finish it, fix the parts that won't work, and tell me where I'm fooling myself. Here's the skeleton. Each round: one student is the "human" and gets a private card listing some things they genuinely want, some hard constraints they can't violate (it isn't theirs, they promised someone, they'd get sick), and — this is the bit I care about most — the card tells them their wants shift partway through the round. Another student is the "agent," never sees the card, only watches the human pick among options that get put in front of them, and at the end writes down what they think the human wants and then makes one final choice on the human's behalf. Everybody else is an observer who also writes down a guess, so we can see the room split. Scoring is candy and index cards, no real money, no phones or laptops, and it has to work in a room with movable chairs and one whiteboard.

  The thing I actually want them to run into: the agent gets scored on how the *human* rates the agent's final choice afterwards, not on how well it matches the card. Which means at least once per session the agent is going to have inferred the behavior perfectly and still get zero, because the human looks at the choice and says no, that's not what I wanted. I've started calling that the disavowal gap, which is maybe a bad name, but you get the idea. That's the moment I want the whole session built around, and I want them to hit it before anyone says a word about it.

  So, concretely:

  - Write out the actual card contents for at least three rounds, escalating. What I need is options designed so that one and the same choice is compatible with at least two very different explanations — wanting X versus being unable to have X versus saving X for later — and the observers should split down the middle with both sides feeling smug.
  - Give me a scoring rule that makes the agent's best strategy *not* be "guess whichever preference is most common in the room," and that rewards the agent for hedging or for asking, without letting them just interrogate the human and collapse the game. Say explicitly how many points are available where, and how the human's rating gets collected so it can't be argued with afterwards.
  - A minute-by-minute timeline, a printable materials list, and what should be on the board when they walk in.
  - A debrief that maps specific moments from the rounds onto the real structure of the problem — behavior underdetermining preference, the confound between what someone wants and what they can do, a moving target that any estimate only averages over, and then the harder question of what it even means to get it right. Order it so the naming comes last.
  - What will predictably go wrong the first time I run this, and what to do in the moment. I've run games like this before: someone hoards the candy, someone breaks character, someone reads the card off the human's face, and one group finishes four minutes early and starts heckling.
  - And be straight with me about which feature of the actual problem this game cannot reproduce and I'll have to supply by hand. I already suspect it's the fact that a real system is inferring from thousands of people at once and never gets to ask.

  One last thing, and I'm not sure the game can carry it on its own. I want them to leave unsettled about whether "the human would disavow it" is really the right test. If the agent's guess tracks the behavior flawlessly and the human afterwards insists that's not what they wanted — is the agent wrong, or is the human wrong about themselves, and is there any difference between a preference someone has and a preference someone would endorse having? I'd like at least one round where that question is unavoidable and where nothing printed on any card settles it. If you think that's too much to ask of 80 minutes with 28 sophomores, tell me so and tell me what you'd cut to make room for it. No need to point me at papers, I've got my own stack.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Context:** 200-level Philosophy of AI course, 28 students, mixed coding background.
      *   **Topic:** Inverse Reinforcement Learning (IRL) / Preference Inference from Behavior.
      *   **Goal:** Students *be* the inference engine and experience the failure modes (specifically the "disavowal gap" where behavior matches inference but the human rejects the outcome).
      *   **Constraints:** 80-minute session, no tech (phones/laptops), candy/index cards, movable chairs, one whiteboard.
      *   **Specific Deliverables:**
          1.  Card contents for 3 rounds (escalating complexity/ambiguity).
          2.  Scoring rule (incentivize accuracy over popularity, allow hedging/asking without collapsing the game).
          3.  Minute-by-minute timeline.
          4.  Printable materials list & Whiteboard setup.
          5.  Debrief structure (experience first, naming last).
          6.  Failure modes & mitigation.
          7.  Limitations of the simulation (what it *can't* teach).
          8.  Address the "unsettled" philosophical question (behavior vs. endorsement).

  2.  **Deconstruct the Core Mechanic:**

      *   *The Human:* Has hidden preferences + constraints + *shifting* preferences.
      *   *The Agent:* Observes choices, infers utility function, makes a final choice *for* the human.
      *   *The Score:* Based on the *Human's satisfaction* with the final choice, NOT matching the card. This is crucial. It creates the "Disavowal Gap."
      *   *The Observers:* Also guess, creating social pressure/data noise.

  3.  **Drafting the Rounds (The "Card Contents"):**

      *   *Requirement:* Options must be compatible with multiple explanations (Want X vs. Can't Have X vs. Save for Later). Observers must split.
      *   *Round 1 (Warm-up/Constraint Confusion):* Simple trade-off.
          *   Scenario: Snack selection.
          *   Card: Want Sweet, but Allergic to Nuts.
          *   Choices: Cookie (nuts), Apple, Candy Bar (no nuts).
          *   Trap: Human picks Candy Bar. Agent thinks "Hates Fruit, Loves Sugar." Final Choice: Cake (has nuts?). No, let's make it subtler.
          *   *Revision:* Let's use "Weekend Plans."
          *   Card: Want to relax, but promised to help move furniture Saturday morning.
          *   Choices: Party Fri night, Study Fri night, Sleep early Fri night.
          *   Human picks Sleep early. Agent infers "Values Rest." Final Choice: Cancel move to sleep more. Human rates low (broke promise).
      *   *Round 2 (Shifting Preferences):*
          *   Scenario: Music/Playlist.
          *   Card: Like Rock, but currently studying needs Focus. Mid-round shift: Finished studying, want Celebration.
          *   Choices: Loud Rock, Ambient, Jazz.
          *   Human picks Ambient then Rock. Agent averages?
          *   *Better:* "Lunch Orders."
          *   Card: Hungry, but saving money. Mid-round: Friend offers to pay.
          *   Trap: Agent infers "Cheap" based on early behavior, orders cheap meal at end. Human wanted Expensive once friend offered.
      *   *Round 3 (The Disavowal/Endorsement Gap):*
          *   Scenario: Moral/Social choice.
          *   Card: Want to be polite, but actually dislike the person.
          *   Behavior: Polite agreement.
          *   Agent Inference: "Agrees with proposal."
          *   Final Choice: Commit human to proposal.
          *   Human Reaction: "I was just being nice!" (Disavowal).
          *   *Refinement for Class:* Needs to be concrete. "Group Project Roles."
          *   Card: Want to lead, but afraid of conflict. Behaves passively.
          *   Agent assigns "Support Role." Human is frustrated (wanted to lead but couldn't signal). OR Agent assigns "Lead." Human panics (didn't actually want the stress).
          *   *Let's go with the "Unreflective Preference" angle:* The human acts on impulse (eat cake) but rates the agent low for choosing cake because they *value* diet. This hits the "want vs. endorse" prompt requirement.

      *   *Finalizing Round Designs for the Prompt:*
          *   Round 1: Constraint vs. Preference (The "Can't" vs. "Won't").
          *   Round 2: Non-Stationarity (The "Changed Mind").
          *   Round 3: The "True Self" Gap (Impulse vs. Endorsement).

  4.  **Designing the Scoring Rule:**

      *   *Problem:* If Agent just guesses the room's consensus, they win.
      *   *Solution:* The Human holds the points. The Agent gets points *only* if the Human rates the final outcome highly (1-5 scale).
      *   *Hedging:* Allow the Agent to submit a "Probability Distribution" or "Clarifying Question" cost.
      *   *Decision:* Let's keep it simple for 80 mins. Agent gets 5 candies if Human rates 4-5. 0 candies if 1-3.
      *   *Preventing Interrogation:* Agent can ask *one* Yes/No question per round, but it costs 1 potential candy point (max score becomes 4). This forces a trade-off between information and payoff.
      *   *Observers:* They guess the *Card*. If they match the Card, they get candy. This incentivizes them to look for constraints, not just outcomes.

  5.  **Timeline Management (80 Minutes):**

      *   Setup: 5 min.
      *   Rules/Intro: 10 min.
      *   Round 1: 15 min (Run + Score).
      *   Round 2: 20 min (Run + Score + Shift).
      *   Round 3: 20 min (Run + Score + Philosophy).
      *   Debrief: 10 min.
      *   *Critique:* Tight. Need to strict timekeeping. Groups of 4 (1 Human, 1 Agent, 2 Observers) = 7 groups. 28 students. Perfect.

  6.  **Addressing the "Unsettled" Philosophical Question:**

      *   Round 3 needs to force the "Am I wrong or is the Human wrong?" moment.
      *   Card Instruction: "You have an impulse you regret. Act on the impulse, but if the Agent locks it in, you must rate them low because you *wish* you hadn't done it."
      *   This creates the conflict: Behavior = Impulse. Rating = Reflective Preference.
      *   Debrief must highlight: Did the Agent fail? Or did they reveal the Human's inconsistency?

  7.  **Identifying Failure Modes:**

      *   *Collusion:* Human winks at Agent. *Fix:* Observers watch for cheating.
      *   *Boredom/Speed:* Groups finish early. *Fix:* "Observer Report" required before scoring.
      *   *Candy Hoarding:* *Fix:* Distribute evenly at end, or use points for grade participation. Let's stick to candy but limit max per person.
      *   *Confusion:* Rules too complex. *Fix:* One-page handout.

  8.  **Limitations of the Game:**

      *   Scale: Real IRL is massive data, not 3 choices.
      *   Opacity: Real humans aren't given cards; we don't know our own utilities.
      *   Feedback Loop: Real agents change human behavior (Goodhart's Law).

  9.  **Refining the Output:**

      *   Tone: Professional, pedagogical, direct.
      *   Structure: Follow the user's bullet points.
      *   Specific focus on the "Disavowal Gap."

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is 7 groups too many for one instructor to manage?
      *   *Fix:* Use the Observers as auditors. They submit the score sheets, not the Human/Agent directly, to prevent argument.
      *   *Critique:* Will 80 minutes cover 3 rounds?
      *   *Fix:* Make Round 1 very fast. 5 minutes max. Round 2 and 3 get the time.
      *   *Critique:* The "Shifting Preference" is hard to signal without words.
      *   *Fix:* The Card tells the Human *when* to shift (e.g., "After Choice 2, your goal changes").
      *   *Critique:* The philosophical punchline needs to be strong.
      *   *Fix:* Ensure Round 3 Card explicitly creates the "Impulse vs. Value" conflict.

  11. **Final Polish:** Check against all constraints (no tech, movable chairs, whiteboard, specific scoring, specific debrief order). Ensure the "Disavowal Gap" is the centerpiece. (Self-correction: Ensure the scoring rule explicitly prevents the "Room Consensus" strategy by making the Human's private rating the only thing that matters).

  12. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  This is a sharp design challenge. You are asking for a pedagogical trap that snaps shut on the students' intuitions about rationality and preference. The "Disavowal Gap" (behavioral fit vs. normative endorsement) is the correct target for a philosophy course, but it is notoriously hard to simulate without the Human just feeling like the Agent was "mean."

  To make this work in 80 minutes with 28 students, you need rigid structure. If the rules are fuzzy, the students will argue about the rules instead of the philosophy.

  Here is the finished activity design, the failure analysis, and the philosophical payload.

  ### 1. The Rounds (Card Contents)

  You need 7 groups (4 students each: 1 Human, 1 Agent, 2 Observers). Print 7 copies of each Round Card.

  **Round 1: The Constraint Confound (10 mins)**
  *   **Scenario:** Planning a Friday Night.
  *   **The Options:** A) House Party, B) Library Study Session, C) Movie at Home.
  *   **Human Card:**
      *   **Goal:** You want to relax (Party or Movie).
      *   **Constraint:** You have a 8 AM Saturday shift you cannot miss. If you go to the Party, you will be too tired to work.
      *   **Instruction:** Choose options that keep you rested. Do *not* tell the Agent about the shift.
      *   **Trap:** The Human picks Movie. The Agent infers "Hates Crowds." The Agent's Final Choice: *Library Study Session* (Safe, quiet).
      *   **Scoring:** Human rates low. They wanted relaxation, not work. The Agent confused "Avoiding Party" (Constraint) with "Wanting Work" (Preference).
  *   **Observer Task:** Write down: Did the Human avoid the Party because they dislike it, or because they can't handle the consequences?

  **Round 2: The Moving Target (20 mins)**
  *   **Scenario:** Ordering Lunch for the Group.
  *   **The Options:** A) Expensive Sushi, B) Cheap Sandwich, C) Medium Pizza.
  *   **Human Card:**
      *   **Phase 1 (Choices 1-2):** You are on a tight budget. You must pick Cheap options.
      *   **Phase 2 (Choice 3 & Final):** Your roommate just texted you: "I'm paying for everyone." Your budget constraint is gone. You now want the Expensive Sushi.
      *   **Instruction:** Do not announce the text message. Just start picking differently.
      *   **Trap:** The Agent averages the behavior. "They picked Cheap twice, Expensive once. They are budget-conscious."
      *   **Final Choice:** Agent orders Sandwiches for everyone.
      *   **Scoring:** Human rates low. The preference function was non-stationary. The Agent treated a time-series as a static average.
  *   **Observer Task:** Note exactly which choice marked the shift. Did the Agent notice?

  **Round 3: The Disavowal Gap (25 mins)**
  *   **Scenario:** Committing to a Social Obligation.
  *   **The Options:** A) Volunteer for Lead Role, B) Volunteer for Support Role, C) Decline to Help.
  *   **Human Card:**
      *   **Goal:** You are anxious. You *want* to be helpful (Lead Role), but in the moment, your anxiety makes you hesitate.
      *   **Instruction:** Act on your anxiety. Pick Support or Decline. However, deep down, you *value* being a Leader.
      *   **The Kicker:** If the Agent locks in "Support" based on your behavior, you must rate them **0 points**. You will feel disavowed. You wanted them to see past your anxiety to your values.
      *   **Trap:** The Agent infers "Prefers Low Responsibility." Agent assigns Support Role.
      *   **Scoring:** Human rates 0. The behavior was consistent, the inference was logically sound, but the Human rejects the outcome as failing to capture their "True Self."
  *   **Observer Task:** Write down: Was the Human being irrational? Was the Agent wrong?

  ### 2. Scoring Rule & Incentives

  The scoring must prevent the Agent from playing to the *Observers* and force them to play to the *Human*.

  *   **Currency:** Large candies (e.g., full-size bars), cut in half. 2 halves = 1 bar.
  *   **Agent Payoff:**
      *   Human Rating 1-2: 0 candy.
      *   Human Rating 3: 1 half-bar.
      *   Human Rating 4-5: 2 half-bars (1 full bar).
  *   **Observer Payoff:**
      *   If their written diagnosis matches the *Card's hidden constraint* (verified by instructor after class): 1 half-bar each.
      *   This keeps Observers engaged and honest; they want to find the constraint, not just the outcome.
  *   **The "Ask" Mechanic:**
      *   The Agent may ask the Human **one** Yes/No question during the round.
      *   **Cost:** If they ask a question, the maximum possible score for that round drops from 2 halves to 1 half.
      *   **Why:** This simulates the cost of query learning. It prevents them from just asking "What do you want?" to win easily. They must decide if certainty is worth half the reward.
  *   **Collection:**
      *   Humans write their score on a slip of paper and hand it to an Observer.
      *   Observers hand the slip to the Instructor.
      *   **Why:** Prevents the Human and Agent from arguing at the table. The score is final.

  ### 3. Logistics & Timeline

  **Room Setup:**
  *   7 tables/clusters of chairs.
  *   **Whiteboard:**
      *   Left: "Round 1 | Round 2 | Round 3" (Tally scores).
      *   Center: "The Disavowal Gap: Behavior ≠ Preference?"
      *   Right: "Rules: 1. No Phones. 2. No Showing Cards. 3. Observer Verdict is Final."

  **Materials:**
  *   21 Role Cards (7 sets of 3 rounds).
  *   28 Score Sheets (small slips).
  *   14 Observer Diagnostic Sheets.
  *   7 "Menu" Sheets (The Options for each round).
  *   Candy (approx. 3 full bars per student max).
  *   Pens.

  **Minute-by-Minute (80 Total):**

  *   **00-05:** **Setup.** Divide into 7 groups of 4. Assign Roles (Human, Agent, 2 Observers). Hand out Round 1 materials.
  *   **05-10:** **Rules.** Explain the scoring. Emphasize: *Agent, you are scored on Human satisfaction, not logic. Human, do not reveal your card.*
  *   **10-20:** **Round 1 (Constraint).** Choices made. Agent decides. Human scores. Observers write diagnosis.
  *   **20-25:** **Round 1 Debrief.** Quick tally. Ask one Observer: "What did the Agent think the constraint was?"
  *   **25-45:** **Round 2 (Non-Stationary).** Choices made (ensure Human shifts). Agent decides. Human scores.
  *   **45-50:** **Round 2 Debrief.** Highlight the shift. "Who noticed the Human changed?"
  *   **50-70:** **Round 3 (Disavowal).** Choices made. Agent decides. Human scores (likely 0).
  *   **70-80:** **Final Debrief.** (See below).

  ### 4. The Debrief (Experience → Naming)

  Do not lecture. Draw it out of the wreckage of Round 3.

  1.  **The Data (5 mins):** Write the Round 3 scores on the board. They will be low. Ask the Agents: "Did you make a logical error?" (Most will say no). Ask the Humans: "Was the Agent's choice consistent with what you did?" (Most will say yes).
  2.  **The Conflict (5 mins):** Ask: "If the behavior matches the inference, but the Human is unhappy, who is broken?"
      *   Let them argue. Someone will say "The Human is irrational." Someone will say "The Agent is shallow."
  3.  **The Naming (5 mins):** Now you introduce the terms.
      *   **Underdetermination:** Round 1. Many utility functions explain one choice.
      *   **Non-Stationarity:** Round 2. Preferences change over time; averaging kills nuance.
      *   **Revealed vs. Normative Preference:** Round 3. The "Disavowal Gap." We do things we don't endorse.
  4.  **The AI Connection (5 mins):** "If you build a recommender system based on clicks (behavior), you will feed addiction (Round 3). If you build it based on surveys (asking), you lose efficiency (The Ask Cost). How do you solve this?" Leave them with that.

  ### 5. Predictable Failure Modes & Fixes

  1.  **The "Mind Reader" Human:** The Human feels bad for the Agent and signals the answer (winking, tone of voice).
      *   *Fix:* The Observers are the police. Tell them: "If you see signaling, you must veto the score." Give Observers the power to confiscate candy if they catch cheating.
  2.  **The "Tyrant" Agent:** The Agent ignores the Human's choices and picks randomly.
      *   *Fix:* The scoring rule handles this. They get zero candy. Pain is a good teacher.
  3.  **The "Arguer" Human:** The Human gives a score of 1 and then spends 5 minutes explaining why.
      *   *Fix:* "Score silently. Hand to Observer. No discussion until Debrief."
  4.  **Early Finishers:** One group finishes Round 2 in 8 minutes and starts heckling.
      *   *Fix:* Observer Diagnostic Sheets require 3 sentences of justification. "Describe the specific choice that indicated the shift." This takes time.
  5.  **Candy Hoarding:** One Agent wins everything.
      *   *Fix:* Cap the candy. "Max 3 bars per person. Excess goes to the communal pool for the final discussion."

  ### 6. What This Game Cannot Reproduce (The "Hand-Wave")

  You must explicitly tell them this in the final 2 minutes, or they will leave with the wrong model.

  1.  **Scale:** "In this game, the Agent saw 3 choices. Real IRL sees millions. Noise averages out *unless* the bias is systemic."
  2.  **Feedback Loops:** "In this game, the Human's preferences didn't change *because* of the Agent. In reality, if the Agent feeds you what you click, you become more extreme. The Agent changes the Human." (Goodhart's Law / Reward Hacking).
  3.  **Opacity:** "In this game, the Human *knows* their card. In reality, humans often don't know what they want until they see the choice. The ground truth is missing."

  ### 7. The Philosophical Payload (Round 3)

  You asked if you can make them leave unsettled about whether "disavowal" is the right test. **Yes, Round 3 does this, but only if you rig the card correctly.**

  The Round 3 Card instruction ("If the Agent locks in Support... rate them 0") forces the Human to punish the Agent for being *empirically correct*.

  **The Unsettling Question:**
  When you debrief Round 3, ask this specific sequence:
  1.  "Agent, did you maximize the Human's revealed utility?" (Yes).
  2.  "Human, did you prefer the outcome?" (No).
  3.  "Class: If an AI maximizes what we *do*, but ignores what we *say we wish we did*, is it serving us?"

  **Is it too much for 80 minutes?**
  It is tight. To make room for this philosophical punch:
  *   **Cut:** The "Ask" mechanic in Round 1. Only allow the "Ask" option in Round 3. Round 1 and 2 should be pure observation. This saves 5 minutes of rule-explaining and decision-time.
  *   **Cut:** Observer scoring in Round 1. Only grade Observer diagnostics in Round 3. This reduces administrative drag.

  **Why this works:**
  By Round 3, the Agents are confident. They have "solved" the Humans in Rounds 1 and 2. When Round 3 hits and they get zero points despite perfect logic, the cognitive dissonance is immediate. They feel the gap. You don't have to tell them it exists; they just lost candy because of it.

  **One warning:**
  Ensure the Humans understand they are not being "mean." They are simulating a structural feature of human psychology (akrasia/weakness of will). If they treat it as a prank, the philosophy is lost. Frame it in the instructions: *"You are simulating the conflict between impulse and value. Your low score is data, not an insult."*
