      *Check length:* Looks like two paragraphs.
      *Check tone:* Confident, experienced, slightly sharp.
      *Check constraints:* No meta, no citations.

      *Wait, one nuance:* The user said "every patch... is a straight value call that no price can settle and no trader has standing to make." I need to agree with that, not fight it. Because that proves the council's role is vital. The user's dilemma is "Either market decides values OR metric needs patching (value call)." I'm saying "Metric needs patching (value call), and that's the council's job, so the market didn't overstep." I need to make sure I don't sound like I'm saying the market *should* make value calls.

