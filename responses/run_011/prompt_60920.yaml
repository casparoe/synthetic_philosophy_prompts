      *Final check on "Never concede core claim":* The core claim is "for the big recurring policy calls, a market priced against a specified welfare metric beats twelve people guessing in a committee room." I am defending this by saying the market found the error faster than a committee would have. I am not conceding that committees are better at setting goals, just that they *set* the goals (which is the premise of the system). The user is attacking the boundary between goals and means. I need to hold that the market is still better at the means, even if the goals need precise specification.

