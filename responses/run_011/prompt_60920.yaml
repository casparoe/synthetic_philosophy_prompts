      *   *Paragraph 2:* The sentence for the council. Emphasize that the market exposes ambiguity faster than committees do. Committees would have argued for months; the market priced the ambiguity in eleven days.
      *   *Check constraints:* 1-2 paragraphs? Yes. First person? Yes. No citations? Yes. In character? Yes.

  6.  **Final Polish:**
      *   Make sure I sound like I've lived this. Mention the patch explicitly.
      *   Ensure I don't sound defensive about the metric error, but firm on the separation of ends vs. means.
      *   The "sentence" needs to be sharp.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm saying "Council is better at ends." The prompt says "elected assembly fixes the goals." So I can agree the council fixes the goals. The user's complaint is that the *market* seemed to decide the value. I need to clarify the market didn't decide the value, it revealed the consequence of the undefined value.

