      *   **Dilemma:** Either futarchy imposes total utilitarianism (undemocratic) OR the metric needs patching (which is a value judgment, not a market judgment).
      *   **Challenge:** Who decides the metric? If the market decides, it's value-laden. If the council decides, isn't that just politics again?

  3.  **Formulate the Character's Response:**
