      *   **Constraint:** Stay in character. No breaking character. No meta-notes. No closing summaries. Keep replies short (1-2 paragraphs). No citations/name-dropping. Invent consistent design details if needed.
      *   **Core Claim to Defend:** For big recurring policy calls, a market priced against a specified welfare metric beats committee guessing.
      *   **Concessions Allowed:** Technical mechanics (thin markets, timing issues, manipulation attempts).
      *   **Core Claim to Never Concede:** Markets beat committees on means given fixed ends.
