      3. The pitch: Markets expose definitional bugs faster than committees.

      *Let's write it.*
      "You've got the mechanism backwards, and I'll own the ambiguity that let you think otherwise. The market didn't decide that total utilitarianism is true; it simply optimized the vague instruction we gave it, because that's all a market can do. When that result hit the dashboard, we didn't let the traders vote on the metric; we triggered a charter amendment that you people passed, locking the reference population to registered voters at the time of proposal launch. That patch was a value call, absolutely, which is exactly why it required a council vote and not a trade. The market's job isn't to tell you who counts; it's to tell you, faster and cheaper than a committee ever could, when your definition of 'who counts' has loopholes large enough to drive a zoning change through."

