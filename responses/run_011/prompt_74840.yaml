answer: |-
  ### Take-Home Essay Question

  **Course:** PHI 605 – Risk and Regulation  
  **Assignment:** Take-Home Essay (Precautionary Principle)  
  **Time Allowed:** 2 Hours  
  **Total Marks:** 25  

  **Instructions:**  
  Read the case study and the regulatory rule below. Answer the question that follows. Your response should be concise and argumentative. Do not rehearse general objections to the Precautionary Principle (e.g., vagueness, self-defeat) unless they directly bear on the specific structural problem identified in the prompt.

  **Case Study:**  
  A water utility serving 200,000 people detects a fungicide metabolite, F-met, at 6 µg/L in its intake. An association with developmental defects exists at concentrations ≥25 µg/L; below this, the dose–response is unknown, and there is no consensus on a threshold. Three options are available:  
  (A) **Status Quo:** No additional treatment; continue quarterly monitoring.  
  (B) **Ozonation:** Retrofits cut F-met by ~85%, but bromide in intake water generates bromate (known dose–response, quantifiable excess risk).  
  (C) **Catalytic Medium:** Cuts F-met by >99%, but the medium sheds a breakdown product never toxicologically characterised. Shedding varies seasonally; there is no probability estimate for harm, not even an order of magnitude.

  **Regulatory Rule:**  
  *"Where an activity raises plausible threats of serious or irreversible harm, and the causal pathways to that harm are not established with confidence, the activity shall not proceed and the burden of demonstrating safety falls on those proposing it."*

  **Question:**  
  The rule's trigger depends on identifying "an activity." Show how fixing the comparison class differently (e.g., baseline as pre-detection status quo vs. continued service provision vs. proposed intervention) generates contradictory verdicts for Options A, B, and C under the rule. Evaluate whether a maximin or "reasonable worst-case" reading resolves this indeterminacy, given Option C's uncertainty profile. Finally, propose a specific repair to the comparison-class problem that avoids collapsing the rule into either a licence for inaction or a blanket veto, and state definitively which option the repaired rule mandates.

  ***

  ### Model Answer

  The regulatory rule is indeterminate because it fails to specify the counterfactual baseline against which "threats" are measured. In this case, shifting the comparison class yields contradictory prohibitions.

  If the "activity" is defined as **changing the treatment process** (baseline: current operation), Option A proceeds trivially. It involves no new activity, so the burden of proof never triggers. Options B and C, however, propose changes. Option B introduces a known risk (bromate); Option C introduces an uncharacterised risk. Under this baseline, the rule licenses Option A, despite the presence of F-met at unknown safety levels. This collapses the principle into a status quo bias, permitting known background risks while vetoing interventions.

  If the "activity" is defined as **supplying water** (baseline: no supply), all options trigger the rule. Option A supplies water containing F-met with unknown downstream effects below 25 µg/L. Option B supplies water with known bromate risks. Option C supplies water with unknown shedding risks. Since all options involve "plausible threats" where pathways are not fully established (especially A and C), the rule vetoes all three. This collapses the principle into a blanket prohibition on essential services.

  If the "activity" is defined as **the specific intervention proposed** (baseline: status quo), we face a paradox regarding Option A. Is "doing nothing" an activity? If yes, A triggers the rule because F-met is present and unsafe below 25 µg/L. If no, A is exempt. Meanwhile, Option C is the strongest trigger: it introduces a novel substance with *no* probability estimate. Option B introduces a known risk. A strict reading forbids C (unknown pathway) and potentially A (unknown pathway below threshold), leaving B as the only compliant option—but only if "known risk" exempts one from the burden of proof.

  A maximin or "reasonable worst-case" reading fails to rescue determinacy here, specifically regarding Option C. Maximin requires ordering outcomes by their worst possible case. For Option B, the worst case is quantifiable. For Option A, the worst case is speculative but bounded by the 25 µg/L threshold data. For Option C, the prompt states there is "no probability estimate of any kind, not even an order of magnitude." There is no defined worst case to maximise. Ignorance is not a risk parameter; it is a lack of parameters. Therefore, maximin cannot rank C against A or B; it simply flags C as incomparable.

  To fix the baseline without licensing inaction or vetoing service, the comparison class must be **the least uncertain method of maintaining essential service**. This repair redefines the "activity" not as "change" or "supply" simpliciter, but as "the specific risk profile adopted to meet a mandatory obligation." Since water provision is mandatory, the status quo (Option A) is not a neutral baseline but an active choice of risk profile.

  Under this repair, we compare the uncertainty profiles of A, B, and C relative to the obligation to supply safe water. Option A fails because it relies on an unknown dose-response below 25 µg/L while 6 µg/L is present; the burden of demonstrating safety is not met. Option C fails catastrophically because it introduces a new unknown with no characterization; the burden of proof cannot be met where no data exists. Option B succeeds not because it is risk-free, but because it converts unknown uncertainty (F-met below threshold) into known risk (bromate). The rule requires the burden of demonstrating safety to fall on proposers. Only Option B allows for a demonstration of safety (via quantifiable risk assessment).

  Therefore, the repaired rule mandates **Option B**. Option A is prohibited because it maintains an uncharacterised threat in a mandatory service. Option C is prohibited because it introduces an uncharacterisable threat. Option B is required because it is the only option where the causal pathways are established with sufficient confidence to discharge the burden of proof.

  ***

  ### Marking Scheme (Total 25 Marks)

  **1. Identification of Comparison Class Problem (5 Marks)**
  *   **5 marks:** Clearly articulates that the trigger "an activity" requires a baseline counterfactual and that the rule does not specify which baseline.
  *   **3 marks:** Identifies the problem but treats it merely as "vagueness" without linking to the case options.
  *   **0 marks:** Fails to identify the baseline issue; discusses general PP vagueness.

  **2. Application to Case (Contradictory Verdicts) (5 Marks)**
  *   **5 marks:** Demonstrates at least two distinct baselines (e.g., status quo vs. continued service) and shows they yield contradictory prohibitions (e.g., A is safe under one, forbidden under the other).
  *   **3 marks:** Shows contradictory verdicts but misapplies the case details (e.g., ignores F-met threshold issues).
  *   **0 marks:** Treats the case as having a single obvious interpretation.

  **3. Critique of Maximin/Worst-Case (5 Marks)**
  *   **5 marks:** Correctly identifies that Option C lacks a defined worst-case outcome ("no probability estimate"), making maximin inapplicable, not just difficult.
  *   **3 marks:** Argues maximin is difficult because C is "too risky" rather than because the outcome space is undefined.
  *   **0 marks:** Claims maximin solves the problem or ignores Option C's specific uncertainty profile.

  **4. Proposed Repair to Baseline (5 Marks)**
  *   **5 marks:** Proposes a specific, normative baseline (e.g., "least uncertain method of maintaining essential service") and explains how it avoids both inaction licenses and blanket vetoes.
  *   **3 marks:** Proposes a fix but admits it still allows for significant ambiguity or "depends on context."
  *   **0 marks:** Offers no fix; concludes that the baseline is inherently political/unresolvable.
  *   **Penalty:** If the answer stops at "it depends how you define the baseline" without proposing a repair, cap this section at 1 mark.

  **5. Definite Verdict/Conclusion (5 Marks)**
  *   **5 marks:** Commits to a single option (A, B, or C) based on the proposed repair. Justification links back to the burden of proof clause.
  *   **3 marks:** Commits to an option but the justification contradicts the proposed repair.
  *   **0 marks:** Hedges ("could be A or B") or refuses to choose.
  *   **Penalty:** If the student hedges in the conclusion, deduct 3 marks from this section.

  **General Penalties:**
  *   **Recitation Penalty:** Deduct 5 marks total if the essay relies heavily on standard Sunstein-style self-defeat arguments without linking them to the comparison class problem.
  *   **Case Ignorance:** Deduct 5 marks total if specific case details (6 µg/L, bromide, shedding) are ignored in favour of abstract theorizing.
