  She will argue that the unassisted conception is a way *this* child could have been born. Her reasoning will track Candidate C. She will maintain that the "essence" of the person is located in the nuclear combination provided by the parents. Since the spindle transfer preserves the nuclear lineage exactly (base-for-base, as stipulated), the identity is preserved. The mitochondria are, in her view, merely environmental or contingent biological hardware, not part of the metaphysical "origin."

