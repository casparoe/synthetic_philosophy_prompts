answer: |-
  Here is your prep sheet. It is designed for damage control and time management. You have 20 minutes for Q&A. That is roughly 6 to 8 questions if you let people ramble. You need to control the clock.

  ### **Opening Concessions (First 5 Minutes)**
  *Do not wait for these to be asked. State them in your introduction or transition to Q&A to disarm the room.*

  1.  **The "Sadism" Concession:** Explicitly state: "I am not arguing we should level down. I am arguing that the *reason* we don't level down is deontic, not telic. My telic view says the outcome is better; my deontic constraints say you aren't allowed to bring it about." This stops the "You're a monster" line of questioning before it starts.
  2.  **The "Responsibility" Concession:** Acknowledge the Luck Egalitarians immediately. "I am bracketing responsibility today. I am arguing about the *currency* of distributive justice (well-being vs. equality), not the *scope* (luck vs. choice). If you think responsibility matters, you can layer that on top of Priority. This argument is just to clear the ground of Telic Egalitarianism."
  3.  **The "Equation" Concession:** Address the Economists. "I know the weighting function needs formalizing. Section 3 is the draft stage. I am happy to take specific functional form questions offline or in the handout, but I want to focus the discussion on the normative justification for the weights."

  ---

  ### **The Objections (Ordered by Damage)**

  #### **1. The Utilitarian Grad Student (The "Redescription" Objection)**
  **The Question:** "You say Prioritarianism and Telic Egalitarianism are both impersonal betterness views that differ only by weighting. But if Prioritarianism is just Utilitarianism with a concave transformation of well-being, haven't you just redescribed the disagreement? If the ranking of outcomes is the same, what normative work is the 'impersonal betterness' doing that 'aggregate transformed utility' isn't? Why isn't this just Utilitarianism in disguise?"
  **The Reply:** "It's not a redescription because the *justification* for the weights differs. A Utilitarian weights by marginal utility because of diminishing returns in production or psychology. I weight by moral priority because being worse off makes a benefit matter *more*, independently of total sum. The math might look similar, but the normative ground is different. That matters when we move to risk, uncertainty, or population changes where the transforms diverge."
  **Soft Spot:** They will press you on **Representation Theorems**. If the behavioral implications are identical in fixed-population cases, they will claim the metaphysics is idle.
  **Follow-up:** "Can you give me a case where Priority and Transformed Utilitarianism rank outcomes differently?"
  **Fold?** **No.** This is your core metaphysical claim. Stand firm on the *source* of the weight.

  #### **2. The Luck Egalitarian (The "Responsibility" Objection)**
  **The Question:** "I've heard this 'impersonal betterness' move before. It feels like you're dodging the actual moral problem. If I'm worse off because I gambled and lost, and you're worse off because you were born blind, Priority says we both get the same moral weight. That ignores agency. Isn't the whole point of the last thirty years of egalitarianism that we shouldn't be compensating for option luck? Doesn't your view collapse back into the pattern-view we rejected?"
  **The Reply:** "I agree responsibility matters for *claims*, but not for *value*. My view is about what makes the world better, not necessarily what we owe each other as agents. You can be a Luck Egalitarian *and* a Prioritarian. You just apply the priority weighting to the 'luck-adjusted' well-being. My argument is just that once you've adjusted for responsibility, the remaining distribution should follow Priority, not Equality."
  **Soft Spot:** They will argue that **Telic** views inherently ignore agency. If the *value* of the outcome doesn't track responsibility, the view is morally blind.
  **Follow-up:** "So you're saying the world is better if a reckless smoker gets a lung transplant than if a careful non-smoker does, ceteris paribus?"
  **Fold?** **Yes, partially.** Concede that your view needs a hybrid account for all-things-considered justice. Don't fight the responsibility battle today; it's a separate paper.

  #### **3. The Public Economist (The "Identification" Objection)**
  **The Question:** *(From the second row, pen hovering)* "You're talking about a weighting function on lifetime well-being. To operationalize this, I need to know: Is your function cardinally measurable? Is it interpersonally comparable? If I can't observe the 'moral weight' separately from the 'well-being level,' your model is unidentified. Are you proposing a specific social welfare function, or is this just verbal window dressing for a concave SWF?"
  **The Reply:** "I'm proposing a normative claim, not an econometric model. The 'weight' is a moral parameter, not an observed variable. I'm arguing that when you construct your SWF, the ethical justification for the concavity should be priority, not risk-aversion or diminishing marginal utility. I'm happy to work with you on the formalization, but the philosophical claim stands even if the measurement is hard."
  **Soft Spot:** They will treat **"moral parameter" as noise**. If you can't measure it, they will dismiss it as non-scientific.
  **Follow-up:** "If we can't measure it, how do we policy-test it? How is this different from just saying 'I like equality'?"
  **Fold?** **Yes.** Promise the formal appendix. Do not try to defend measurement theory in Q&A.

  #### **4. The LDO Hardliner (The "Severity" Objection)**
  **The Question:** "Even if the Leveling-Down Objection applies to both views, doesn't it apply *more strongly* to Egalitarianism? For the Prioritarian, leveling down is bad because the worse-off gain nothing and the better-off lose. For the Egalitarian, leveling down is *in one respect good* (equality increases). Isn't that a decisive difference in the structure of the views, even if the verdict is the same?"
  **The Reply:** "That assumes the 'respect' in which it is good is a genuine value. My argument is that if 'impersonal betterness' isn't better for anyone, calling it a 'pro tanto good' is confused. If you accept my premise that impersonal betterness requires a person-affecting anchor, then the Egalitarian's 'gain in equality' is illusory, not just outweighed. So the severity is the same: both are relying on a phantom value."
  **Soft Spot:** Many find the intuition that **Equality is *pro tanto* good** very robust. Denying it looks revisionist.
  **Follow-up:** "So you deny there is any value in equality, even as a component?"
  **Fold?** **No.** This is your main thesis. Reiterate that "equality" is a relation, not a good.

  #### **5. The Population Ethicist (The "Repugnant Conclusion" Objection)**
  **The Question:** "You're focusing on fixed populations. What happens when we vary the number of people? Does your concave weighting escape the Repugnant Conclusion? Or does it just trade it for the 'Sadistic Conclusion' where we prefer adding miserable people to avoid adding happy ones? Priority views usually have trouble with variable populations."
  **The Reply:** "That's a problem for Total View Utilitarianism and some forms of Egalitarianism. Priority views can avoid the Repugnant Conclusion by using a critical-level or average-priority hybrid. But I'm bracketing population ethics for this paper. The argument about Leveling Down holds for fixed populations, which is the standard domain for distributive justice."
  **Soft Spot:** If your view **fails in variable populations**, it suggests the theory of value is fundamentally broken.
  **Follow-up:** "If your theory of value breaks with population change, why trust it for fixed populations?"
  **Fold?** **Yes.** Explicitly bracket this. "That is a known issue for the family of views, not specific to my argument about LDO."

  #### **6. The Deontic Skeptic (The "Hybrid" Objection)**
  **The Question:** "You conceded earlier that you need a deontic constraint to stop leveling down. But if the telic view says 'Leveling Down is Better' and the deontic view says 'Don't do it,' aren't you left with a fragmented moral theory? Why keep the telic claim at all if it recommends actions you forbid? Isn't that just retaining the 'bad' part of Egalitarianism without the benefit?"
  **The Reply:** "Because the telic claim guides us in cases where we *can* make people better off. It tells us to prioritize the worse-off in positive-sum scenarios. The deontic constraint is only a side-constraint on means. We need the telic view to know where we are aiming; we need the deontic view to know what paths are forbidden."
  **Soft Spot:** **Parfit's "Dualism of Practical Reason."** If the telic and deontic constantly conflict, the theory is unstable.
  **Follow-up:** "What happens when the telic view strongly recommends X, and the deontic view weakly forbids it?"
  **Fold?** **No.** This is standard hybrid view defense.

  #### **7. The Measurement Skeptic (The "Cardinality" Objection)**
  **The Question:** "Priority requires cardinal well-being. You can't apply a weighting function to ordinal preferences. Do you have a theory of well-being that supports cardinality? If not, your weighting function is mathematically undefined."
  **The Reply:** "I assume a objective-list or hedonistic account where cardinality is plausible. I'm not defending a theory of well-being today, I'm defending the weighting of whatever well-being turns out to be. If well-being is only ordinal, then Priority is indeed impossible, but so is most of welfare economics."
  **Soft Spot:** If you don't have a **theory of well-being**, the economists will eat you alive.
  **Follow-up:** "Which theory? Hedonism? Preference?"
  **Fold?** **Yes.** "I'm agnostic on the theory of well-being for the sake of this argument."

  #### **8. The "So What?" Question (The "Practical Difference" Objection)**
  **The Question:** "Okay, suppose you're right. LDO doesn't distinguish the views. We look at the weighting function instead. What practical policy difference does that yield? If both views recommend transferring from rich to poor, why does the department need to care which justification we use?"
  **The Reply:** "It matters for marginal cases and for justification. If we justify transfers by Equality, we resent the rich for having too much. If we justify by Priority, we pity the poor for having too little. That changes the social ethos. Also, in cases of small benefits to the very worst off vs large benefits to the moderately off, the views can diverge."
  **Soft Spot:** **Policy divergence is rare.** They might press you for a concrete example where the policy flips.
  **Follow-up:** "Give me a real policy example where Priority says Yes and Equality says No."
  **Fold?** **Yes.** If you don't have one ready, admit it's mostly about moral justification, not policy outcomes.

  ---

  ### **The Question You Hope Nobody Asks**

  You suspected: *"If all you've shown is that prioritarianism and egalitarianism are two monotone transforms of the same underlying quantity, have you shown anything at all, or just redescribed the disagreement?"*

  **Honest Assessment:** That is a dangerous question, but it is **not** the killer. The Utilitarian grad student will ask that (see Objection #1), and you have a reply (normative ground vs. math).

  **The Real Killer Question:**
  **"If the Leveling-Down Objection doesn't kill Telic Egalitarianism, what positive argument do you have for the Priority Weighting *specifically*?"**

  **Why this is worse:** Your paper's negative thesis is "LDO doesn't distinguish the views." Your positive thesis is "Therefore, we must decide based on the weighting function."
  If you remove the LDO as a weapon *against* Egalitarianism, you have disarmed yourself. The Luck Egalitarians and Telic Egalitarians in the room will say: "Fine. LDO is inconclusive. So why should we accept your concave weighting function over a linear one (Utilitarianism) or a lexicographic one (Strict Equality)? You haven't given us a positive argument for Priority; you've just removed the main argument against Equality."

  **Preparation:** You need a **positive argument for Priority** ready that does not rely on the LDO.
  *   *Suggestion:* Appeal to **Compassion/Empathy**. "When we see someone suffering, we don't think 'their suffering is bad because it creates inequality.' We think 'their suffering is bad because *they* are suffering.' Priority captures the moral urgency of need; Equality captures the moral aesthetics of pattern. Need is more fundamental."
  *   *Risk:* This sounds sentimental. Be ready to formalize it as "The moral value of a benefit is inversely proportional to the recipient's existing level."

  ### **Final Tactical Advice**
  1.  **Watch the Clock:** If an Economist starts deriving a function on the board, interrupt politely. "I want to give you the precise equation, but I'd like to reserve that for the written version so we can discuss the normative implications with the room."
  2.  **Don't Fight the Luck Egalitarians:** They are the majority. Make them feel like Priority is a *tool* they can use, not a rival. "Priority is the engine; Responsibility is the steering."
  3.  **Section 3 Anxiety:** You said Section 3 is thin. If they ask about the weighting function shape, **do not bluff**. Say: "That is exactly what I am working on for the next draft. My intuition is X, but I am testing it against Y." Honesty buys more goodwill than a bad technical defense.

  Good luck. You know the material; the anxiety is just the signal that you care. Keep the answers under 90 seconds.
