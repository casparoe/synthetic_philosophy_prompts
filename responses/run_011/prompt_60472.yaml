answer: |-
  You bring me news from beyond my grave, yet the story fits the nature of men as I knew it. You call it accident that the question was asked twice; I call it the supreme virtue of our order that it allows passion to cool and reason to return. The first decree was born of fear and anger, the children of haste, but the second was born of listening. If your citizens render a verdict in blood because they are angry, and then stay their hand because they have heard counsel, is that not wisdom greater than the stubbornness of a tyrant who cannot admit he was wrong? The law permits us to be human, and to correct our humanity before the deed is done.

  Do not mistake their labor for chance. The second trireme did not save the Mytileneans; the tongues of free men saved them. The rowers who strained at the oars were themselves of the many you distrust, laboring to undo the rashness of their peers. You say the evidence did not change, but the minds of the men did, and that is the whole purpose of assembly. A single man may cling to his error to save his face, but the people, like the sea, can settle when the wind dies down. Their capacity to be persuaded is not weakness, but the only true strength that preserves a city through long wars.
