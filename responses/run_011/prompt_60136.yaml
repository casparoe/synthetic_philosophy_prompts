      *   *Analysis:* This is the smoking gun. Grotius lists them as *alternatives* ("either... or") for establishing a claim "as our own" *in the present tense* ("we establish"). He is discussing causes to justify war *now*. If the common right were extinguished by the advent of property, it could not be cited here as a current justification for war against injury.
      *   *The "Supplied the Place" Phrase:* The text says the general exercise of right "supplied the place of private property." This describes the *origin* story (Justin's view), not the *current legal ontology*. It explains how we moved from A to B. It does not say B annihilates A's moral force in all contexts.
