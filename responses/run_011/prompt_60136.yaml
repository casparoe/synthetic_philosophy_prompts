      *   *Synthesis:* The "Common Right" persists as a category of claim (Snippet 1), but the *mode* of exercising it described in the Theatre analogy (Snippet 2) is primitive and occupation-based. The interlocutor confuses the *mode of origin* (common stock being divided) with the *existence of the right* (common right still valid for war claims).
