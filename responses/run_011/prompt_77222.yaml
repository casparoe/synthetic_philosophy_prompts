answer: |-
  The period between the 1932 *Cartel des Gauches* victory and the 1938 collapse of the Popular Front offers a stress test for political taxonomy that no stable democracy could provide. The French Left did not merely shift policy; it inverted its ontology. In 1932, the PCF (Communists) treated the SFIO (Socialists) as the primary antagonist ("social-fascists"). By 1936, the PCF was sustaining a government led by the SFIO and the Radicals—bourgeois republicans the Communists had previously deemed class enemies. The material conditions of the French worker had not undergone a revolution sufficient to explain this; the catalyst was external (Hitler's rise, Comintern directives) and reactive (the February 1934 riots).

  Here is the weighing of the three candidates for what "Left" and "Right" signify in this crucible.

  ### 1. Program Core (Equality vs. Order)
  This candidate argues that the Left coheres around substantive commitments to redistribution and social equality, while the Right coheres around hierarchy and stability.
  *   **Where it fits:** It explains the **Matignon Accords** (June 1936). The Popular Front delivered the 40-hour week, paid holidays, and collective bargaining. This was not merely defensive; it was a positive program of egalitarianism that required the Radicals to temporarily suspend their commitment to financial orthodoxy.
  *   **Where it goes silent:** It cannot explain the **PCF's 1934 pivot**. There was no sudden discovery that the Radical bourgeoisie shared a commitment to equality. Thorez and Moscow did not fall in love with private property; they calculated that fascism was a greater threat to the Soviet Union than French capitalists were. Furthermore, it fails to explain the collapse. If "Equality" was the core, the Radicals defected not because they stopped believing in order, but because they prioritized *financial* order over *social* equality. The "core" was not shared; it was leased.

  ### 2. Common Enemy (Coalition of Threat)
  This candidate argues that a bloc is defined negatively: it is the set of actors who agree on who the primary existential threat is.
  *   **Where it fits:** It perfectly explains the **timeline of alignment**. The Left did not coalesce when economic suffering peaked (1932–34), but when the *threat* peaked (Feb 1934 riots, followed by the Comintern's 7th Congress). The "glue" was the fear of the leagues (Croix de Feu, Action Française). It also explains the **dissolution**. By 1938, the Radicals (Daladier) recalibrated: the internal instability caused by the Communists and the strikes became a greater threat than the external Fascist one. The coalition didn't break because values changed, but because the hierarchy of enemies flipped.
  *   **Where it goes silent:** It struggles to explain the **intensity of the base**. Fear alone rarely produces the euphoric mass mobilization of June 1936. Workers struck not just to stop fascism, but to claim dignity. A purely negative coalition usually produces defensive pacts, not ambitious social legislation like the 40-hour week.

  ### 3. Indexical (Opposition to Dominance)
  This candidate argues "Left" is merely a label for whoever opposes the current hegemony.
  *   **Where it fits:** It accounts for the **label's survival** despite content changes. The PCF remained "Left" even when supporting bourgeois parties because they were opposing the *potential* hegemony of Fascism.
  *   **Where it goes silent:** It fails the **Radical test**. In 1936, the Radicals were not the opposition; they were the establishment. They were the party of the petty bourgeoisie and state functionaries. If "Left" means "opposition to the dominant arrangement," the Radicals should have been the Center or Right. They were only "Left" because they were allied with parties that were oppositional. This makes the label parasitic rather than descriptive. It also fails the **Symmetry test** (see below): The Right leagues in 1934 were opposing the Republican order. By this definition, the fascist-leaning leagues were the "Left" (opposing dominance), which renders the terms useless.

  ***

  ### Pressing the Symmetry
  The February 1934 crisis confirms that the **Common Enemy** model applies symmetrically. The leagues that stormed the Place de la Concorde were an incoherent mix: monarchists who wanted a king, fascists who wanted a Duce, and veterans who wanted moral purification. They had no shared *Program Core*. They were held together solely by hatred of the Parliament and the Socialists.

  If the Right is a coalition of convenience defined by anti-Leftism, and the Left (1936–38) is a coalition of convenience defined by anti-Fascism, then the political axis is not a spectrum of values but a **spectrum of threat perception**. The "Center" is simply the point where actors are too secure to feel an existential threat. This suggests "Left" and "Right" are not moral geographies but mobilization structures. However, this leaves us with a hollow axis: if both poles are merely negative coalitions, what happens when the enemy vanishes? The 1938 collapse suggests the Left evaporated once the Radicals decided the Communist ally was as dangerous as the Fascist foe.

  ### Pressing the Governing Record
  The governing record distinguishes between the *formation* of the coalition and its *maintenance*.
  *   **Economics (Matignon):** The glue held. The Radicals voted for the 40-hour week. This suggests a latent **Program Core** existed temporarily. The Radicals were willing to trade financial stability for social peace to defeat the Right.
  *   **Foreign Policy (Spain/Munich):** The glue failed. When the threat became external (Spanish Civil War, Munich Agreement), the coalition shattered. The Radicals chose Non-Intervention and Appeasement.

  This divergence reveals that the **Common Enemy** was the necessary condition for the alliance, but the **Program Core** was the sufficient condition for governance. The alliance formed because of the enemy (Candidate 2), but it governed using a program (Candidate 1). It collapsed because the *definition of the enemy* became contested on the international stage. For the PCF, the enemy was Franco/Hitler. For the Radicals, the enemy became War/Instability. When the "Common Enemy" candidate fractured, the "Program Core" was insufficient to hold the Radicals, who valued Order over Equality.

  ***

  ### Verdict

  I defend **Candidate 2: Common Enemy**.

  The episode demonstrates that "Left" and "Right" in unstable democracies function primarily as **coalition structures defined by threat hierarchies**. The PCF did not change its values between 1932 and 1936; it changed its primary enemy. The Radicals did not change their values between 1936 and 1938; they changed their primary enemy (from Fascism to Communism/Instability). The labels "Left" and "Right" persisted not because of shared content, but because the *alignment of threats* temporarily aligned the actors. The symmetry of the 1934 leagues proves this is not unique to the Left; the Right is equally a negative coalition.

  **The feature that counts against this defense:**
  The **Matignon Accords**. If the Popular Front were merely a defensive pact against a common enemy, its legislative output should have been limited to defensive measures (preserving civil liberties, disarming militias). Instead, it produced transformative social democracy (paid holidays, wage hikes). This implies that a shared **Program Core** (Candidate 1) was not just incidental but essential to the coalition's energy. A pure "Common Enemy" theory cannot explain why the coalition moved *forward* socially rather than just holding the line. The workers did not strike in 1936 merely to stop fascism; they struck to change their lives. The "Left" label, therefore, cannot be entirely emptied of content; it must retain some capacity to signal a direction of travel, not just a target of opposition.
