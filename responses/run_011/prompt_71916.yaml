answer: |-
  Your map is surprisingly solid for a week's dive. You've correctly identified the fault lines: the failure of naive EV, the Menger critique of unbounded utility, and the Peters/Ole Jensen ergodicity resolution. You are also right that mainstream economics treats the ergodicity critique as a niche subfield rather than a paradigm shift, though "never updated" is slightly uncharitable—it's more that preference-based utility is more flexible for modeling non-wealth decisions.

  Here is the sanity check on your three questions, starting with the conceptual one because it dictates the answers to the practical ones.

  ### 3. The Conceptual Question: Is Kelly just EV + Log Utility?
  **Verdict:** Mathematically **yes**, ontologically **no**. The commenters are talking past each other because they are conflating the *calculus* with the *justification*.

  *   **The Math:** Maximizing the time-average geometric growth rate of wealth in a multiplicative process is mathematically isomorphic to maximizing the expected value of the logarithm of wealth ($E[\ln(W)]$). If you write down the optimization problem for both, you get the same equations and the same betting fractions.
  *   **The Verbiage is Not Empty:** The distinction matters because it changes the status of the logarithm.
      *   **Standard Econ (Samuelson/Menger):** Log utility is a *preference*. It describes your subjective psychological risk aversion. If you prefer linear utility, you are "risk neutral," and the paradox remains. Bounding utility is an ad hoc constraint on preferences to force convergence.
      *   **Ergodicity Econ (Peters):** Log utility is a *physical constraint* of the dynamics. If wealth evolves multiplicatively (which it generally does via investment, inflation, compounding), the ensemble average (EV) is non-ergodic—it does not equal the time average experienced by a single agent. To maximize your actual wealth trajectory over time, you *must* optimize the geometric mean. The logarithm falls out of the physics of the process, not your psychology.

  **Why this matters:** If it's just preference, a "risk-neutral" agent *should* pay infinite money for the St. Petersburg ticket, and their eventual ruin is just bad luck. If it's ergodicity, a "risk-neutral" agent is objectively making a calculation error regarding the properties of the stochastic process, and ruin is a structural certainty, not bad luck.

  ### 1. The One-Shot Question: $10 Ticket, Single Play
  **Verdict:** The "Kelly fraction" heuristic breaks down here, but the **Log Utility** justification remains.

  Kelly is an asymptotic result. It tells you how to bet to maximize wealth *as $t \to \infty$*. If you play once, there is no time average to converge. You are strictly in the realm of ensemble averages (EV).

  However, if you accept the ergodicity argument (that your life wealth dynamics are multiplicative), you should adopt $\ln(W)$ as your utility function for *all* decisions, not just repeated bets. You treat the one-shot ticket as a perturbation on your lifetime wealth trajectory.

  *   **The Calculation:** You shouldn't ask "what Kelly fraction?" You should ask: "At what cost $C$ does $E[\ln(W_{final})] = \ln(W_{initial})$?"
  *   **The Result:** For the St. Petersburg game, if you use Log Utility, the expected utility converges to a finite number.
      $$ E[U] = \sum_{k=1}^{\infty} \frac{1}{2^k} \ln(W - C + 2^k) $$
      You solve for $C$ where this equals $\ln(W)$.
  *   **Practical Answer:** The "fair price" depends on your wealth $W$.
      *   If $W = \$1,000$, the fair price is roughly **\$7.50**.
      *   If $W = \$1,000,000$, the fair price is roughly **\$15.00**.
      *   If $W = \infty$, the price diverges (slowly).
  *   **Conclusion:** For a one-shot, "fraction of bankroll" is the wrong frame. "Dollar amount based on current wealth" is the right frame. If the ticket costs \$10 and you have \$1,000, you decline. If you have \$1M, you buy. The ergodicity argument justifies *why* you use Log Utility to make that call, even if you never play again.

  ### 2. The EA/Donation Question
  **Verdict:** Applying Kelly to donation percentages is usually a **category error**, but there is a narrow case where it applies.

  Most EA arguments for "high EV giving" rely on **risk-neutrality regarding beneficiaries**. The logic is:
  1.  Utility is linear in lives saved (or QALYs).
  2.  Charities can pool risk (many donors funding many projects).
  3.  Therefore, the *portfolio* of donations should maximize EV, even if individual projects are high-risk.

  **Where Kelly gets misapplied:**
  If an EA says, "I should only donate 10% of my income because I need to Kelly-optimize my personal bankroll to ensure I can donate forever," they are mixing frames.
  *   **Personal Finance:** Kelly applies to your investment portfolio to prevent personal ruin.
  *   **Altruism:** If you are risk-neutral over global utility, you should donate until your marginal dollar does more good elsewhere (often interpreted as keeping enough to remain productive).

  **Where Kelly *does* apply:**
  1.  **Earning to Give:** If your strategy is to invest your capital, grow it via Kelly-optimal strategies, and donate the proceeds, then Kelly applies to the *investment* phase, not the donation phase.
  2.  **Singleton Donors:** If you are the *only* funder for a specific high-risk project (no risk pooling), and your capacity to do good scales with your wealth, then you should treat your "impact capital" like a bankroll. Blowing up your bankroll means zero future impact. In this specific case, maximizing the growth rate of your impact-capital (Kelly) is rational.

  **Summary:** Using Kelly to cap *donations* directly is a stretch. Using Kelly to manage the *assets generating the donations* is sound. The EA crowd gesturing at Kelly are often trying to justify "moderate" giving rates against "maximalist" EV arguments, but they are usually invoking personal risk aversion (Log Utility) rather than true growth-rate optimization.

  ### Final Sanity Check on Your Map
  You are correct that Menger broke the standard Bernoulli solution. You are correct that Ergodicity Economics offers a more robust resolution by shifting the locus from "utility function" to "process dynamics."

  **The one correction:** Be careful with the claim that "mainstream econ just never updated." Mainstream econ acknowledges the math but rejects the *necessity* of the ergodicity solution because:
  1.  Not all decisions are multiplicative wealth dynamics (e.g., health, happiness).
  2.  Preferences are observable; dynamical constraints are often model-dependent.
  3.  Bounded utility, while "ad hoc," is sufficient for most pricing models.

  The ergodicity view is physically more rigorous for financial wealth, but economically less general. Your intuition that it is the "real fix" for financial paradoxes like St. Petersburg is well-supported within that subfield, but don't be surprised if finance practitioners treat it as "Log Utility with a better marketing department."

  **TL;DR:**
  1.  **One-shot:** Don't use Kelly fractions. Use Log Utility to solve for a dollar price based on your total wealth.
  2.  **EA:** Kelly applies to growing your capital, not spending it. Risk-neutrality usually dominates donation logic due to risk-pooling.
  3.  **Concept:** Kelly = EV + Log Utility mathematically. The "ergodicity" label justifies *why* Log Utility is objective physics rather than subjective taste.
