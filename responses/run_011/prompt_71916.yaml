      *   *Structure:* Address the "Map" first (validation/correction), then the three questions in order (or reorder for logical flow: 3 -> 1 -> 2). Let's stick to the user's order (1, 2, 3) but maybe prime with the conceptual clarification since it underpins the others. Actually, Q3 is the foundation. I should address Q3 first to clear the air for Q1 and Q2.
      *   *Correction on "Mainstream Econ":* Be careful not to validate the conspiracy theory that "econ is wrong." Mainstream econ acknowledges the issues but prefers preference-based utility because it's more general. Ergodicity is a specific dynamical systems critique.
      *   *Menger's Point:* Acknowledge that bounded utility is the standard mathematical fix, even if it feels ad hoc.
