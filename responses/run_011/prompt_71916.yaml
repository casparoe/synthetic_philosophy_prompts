          *   *Analysis:* EA usually argues for EV maximization (utilitarian). "Save the most lives."
          *   *Kelly Connection:* Kelly suggests limiting risk to avoid ruin. If you donate 100%, you hit ruin (can't donate later).
          *   *Stretch?* Yes, slightly. Kelly applies to *investing* wealth to grow it. Donating is *consuming* wealth for utility.
          *   *Nuance:* If you view your career capital as a bankroll you are investing to do good, Kelly suggests diversifying or not burning it all at once. But standard EA logic is often "EV max" which can lead to "all in" on high-risk/high-reward interventions (like AI safety).
          *   *Verdict:* Using Kelly to cap donations is a category error unless you frame your *capacity to do good* as a compounding asset. Usually, EAs use "risk neutrality" for charities (pooling risk across many donors). Kelly is for *individual* bankroll management.

