      *   *Bernoulli/Menger:* Correct. Log utility solves the *original* SPP, but Menger showed that for any unbounded utility function, you can construct a "Super St. Petersburg" game that breaks it. Bounded utility solves this but feels restrictive/ad hoc to some.
      *   *Ergodicity/Kelly:* This is the Peters/Gell-Mann view. It's a strong contender but not universally accepted as "the" solution. It reframes the problem from utility to dynamics.
      *   *Samuelson:* Samuelson argued that maximizing geometric mean (Kelly) over long horizons doesn't necessarily maximize expected utility of terminal wealth for *finite* horizons. The ergodicity crowd argues that for non-ergodic processes, ensemble averages are irrelevant. This is still a live debate in econ/physics, not a settled "mainstream just hasn't updated" fact, though the user's intuition aligns with the Peters/Ole Jensen school.
      *   *Kelly = Log Utility:* Mathematically, maximizing expected log wealth is equivalent to maximizing the geometric growth rate. This is a crucial equivalence.

  3.  **Drafting Responses to the Three Questions:**

      *   **Question 3 (Conceptual): Kelly vs. Log Utility vs. Ergodicity.**
          *   *The Claim:* "Kelly is literally just EV maximization under log utility."
          *   *The Truth:* Mathematically, yes. Maximizing $E[\ln(W)]$ is the same as maximizing the time-average growth rate $g = \lim_{T \to \infty} \frac{1}{T} \ln(W_T/W_0)$ for multiplicative dynamics.
          *   *The Distinction:* Is it "empty verbiage"? No. The *interpretation* matters.
              *   *Standard Econ:* You choose log utility because you are risk-averse (preference-based).
              *   *Ergodicity Econ:* You choose log utility (implicitly) because the process is non-ergodic and you want to maximize time growth (dynamics-based).
              *   *Why it matters:* If it's preference, it's subjective. If it's dynamics, it's objective (given the process). The ergodicity argument claims log utility isn't a "patch" but a consequence of the physical structure of wealth accumulation.
          *   *Verdict:* Both claims in the thread are right, but they imply different ontologies. The math is identical; the justification differs.

      *   **Question 1 (One-Shot SPP):**
          *   *Scenario:* Cost $10, play once.
          *   *Kelly Frame:* Kelly is inherently about *repeated* betting to maximize long-term growth.
          *   *One-Shot Problem:* If you play once, the "time average" doesn't converge. You either win or lose.
          *   *Resolution:* If you truly play once, Kelly is less relevant. You fall back on expected utility. If you use Log Utility (justified by ergodicity for *general* wealth dynamics), you calculate $E[\ln(W_{final})]$.
          *   *Calculation:* If bankroll is $B$, cost is $C=10$. Payoff $X$. Maximize $0.5 \ln(B - C + X) + 0.5 \ln(B - C) ...$ wait, SPP payouts are $2^k$.
          *   *Real answer:* For a *single* shot, the "fraction of bankroll" question is tricky. If the bet is small relative to bankroll ($10 vs $10k), Kelly says bet small. But SPP has infinite EV.
          *   *Crucial Point:* Kelly is an asymptotic result. For a one-off, the ergodicity argument weakens. However, if you view your *life* as a sequence of multiplicative decisions, you treat every bet as part of the sequence.
          *   *Advice:* Don't use Kelly fraction for a one-off lottery ticket. Use a utility function (likely log) derived from your broader financial dynamics. If $10 is negligible, buy it for fun. If $10 is significant, don't. The "finite number" from ergodicity ($4) is the *fair price* for a repeatable game. For a one-off, willingness to pay depends on current wealth.

