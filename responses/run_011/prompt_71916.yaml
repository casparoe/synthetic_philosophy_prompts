  5.  **Self-Correction/Nuance Check during drafting:**
      *   *Did Peters actually solve SPP?* He resolved it for *multiplicative* dynamics. If the ticket is additive (you pay $10, win $X, wealth is $W - 10 + X$), the dynamics are different. SPP is usually framed as additive payoff. Kelly applies to multiplicative growth (betting a fraction). If you buy a ticket, it's usually a fixed cost.
      *   *Wait, important distinction:* In SPP, you pay a fee to enter. If you pay $C$, your wealth becomes $W - C + Payoff$. This is additive. Kelly is usually derived for *fractional* betting where wealth updates multiplicatively ($W_{new} = W_{old} \times (1 + f \cdot Return)$).
      *   *Ergodicity resolution:* Peters argues that if wealth dynamics are multiplicative (which they generally are in reality due to investment/consumption), you should maximize geometric mean. For SPP specifically, if you treat the ticket cost as a fraction of wealth, the math works. If it's a fixed fee, you need to solve for $C$ such that $E[\ln(W - C + Payoff)] = \ln(W)$.
      *   *Refining Q3:* The equivalence holds: Maximizing time-average growth in multiplicative dynamics $\iff$ Maximizing Expected Log Utility. The difference is *why* you use Log. (Preference vs. Physics).
      *   *Refining Q1:* If it's a one-shot, the time-average doesn't exist. You must rely on the ensemble average of your utility function. If you accept the ergodic argument that Log Utility is the "correct" utility function for wealth, then you use that. But you can't use the "Kelly Fraction" heuristic directly; you have to solve the expected utility equation.
