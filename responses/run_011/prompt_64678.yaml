answer: |-
  **PHI 450: Philosophy of Social Science — Final Examination**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1**
  Consider the following argument concerning the "gender-equality paradox" (the finding that average sex differences in occupational and field-of-study preferences are larger in countries scoring higher on standard measures of gender equality):

  > (1) If preferences for gendered occupations were chiefly produced by socialization into local norms, then as a society becomes more gender-equal, male and female preferences should converge.
  > (2) Across affluent democracies, the more gender-equal the society, the more these preferences diverge.
  > (3) Therefore, these preferences are not chiefly produced by socialization into local norms, and the residual variation tracks sex itself.

  In an essay of approximately 750 words, critically evaluate this argument. Your response must:
  (a) Isolate at least two auxiliary assumptions without which premise (2) does not support conclusion (3). You must address the relationship between the equality index and national wealth, and the cross-cultural stability of the preference measure.
  (b) Explain why, even granting the correlation in (2), the conclusion (3) remains underdetermined. Specifically, discuss how the "affordability of preference" hypothesis or the encoding of expectations in reported "choice" might explain the data without invoking intrinsic sex-linked traits.
  (c) Sketch one empirical study design capable of discriminating between the hypothesis that "egalitarianism unmasks real differences" and the hypothesis that "affluence lets small initial differences compound."

  ***

  ### Model Answer

  The stipulated argument is formally valid; it employs a *modus tollens* structure to reject the socialization hypothesis based on observed divergence in gender-equal societies. However, philosophical rigor requires distinguishing validity from soundness. The argument fails to be sound because it relies on unstated auxiliary assumptions that are empirically fragile, and it presents a false dichotomy between "socialization" and "intrinsic sex-linked variation."

  To move from premise (2) to conclusion (3), one must assume that the independent variable (gender equality) is not confounded. The first critical auxiliary assumption is that the Gender Gap Index tracks normative equality rather than national wealth. Highly gender-equal countries in these datasets are almost exclusively wealthy Nordic nations. If wealth, rather than egalitarian norms, drives the divergence, the inference to (3) collapses. Wealth provides a welfare buffer that alters the cost-benefit analysis of career choices. Therefore, without controlling for GDP per capita, we cannot attribute the variance to "equality" specifically.

  The second auxiliary assumption concerns measurement invariance. The argument assumes that a reported "preference" for engineering in Oslo means the same thing as a reported "preference" for engineering in Ankara. In high-equality societies, where stigma against non-traditional choices is low, reporting a preference may reflect a genuine inclination. In lower-equality societies, reported preferences may reflect adaptive preferences—what one expects one can safely have. If the survey instrument measures "safe aspiration" in one context and "idiosyncratic desire" in another, the divergence in (2) is an artifact of measurement, not a divergence in underlying psychology.

  Even if we grant the correlation in (2), conclusion (3) is underdetermined because it ignores the mechanism of *choice* under security. The "affordability of preference" hypothesis suggests that in less equal (and often less wealthy) societies, economic necessity forces individuals into available jobs regardless of preference. In affluent, equal societies, material security allows individuals to indulge idiosyncratic preferences. If men and women have slightly different average distributions of interest, economic pressure suppresses this variance. When pressure is lifted, the variance expands. This explains the divergence without requiring that preferences be "chiefly produced" by biology; they may be biologically influenced but socially suppressed or expressed depending on material conditions.

  Furthermore, reported "choices" encode expectations. A woman in a gender-equal society may "choose" nursing not because of an intrinsic sex-linked trait, but because she anticipates that the field offers flexibility compatible with unpaid care work, which she expects to perform even in an egalitarian state. If the state supports work-life balance, she enters the field; if it does not, she exits the workforce entirely. Thus, the "choice" tracks the structure of opportunity, not necessarily an essential nature.

  To discriminate between "egalitarianism unmasks real differences" (the argument's conclusion) and "affluence lets small initial differences compound" (the resource hypothesis), a longitudinal cohort design is required. Researchers should track a single nation undergoing rapid economic development and policy liberalization over 20 years. The study must measure occupational preferences in adolescents *before* labor market entry, alongside measures of perceived material security.

  If the "unmasking" hypothesis is true, preference divergence should correlate specifically with changes in normative attitudes (e.g., acceptance of female leaders), holding wealth constant. If the "compounding" hypothesis is true, divergence should correlate with household income security and welfare availability, even if normative attitudes remain static. Crucially, the study should compare siblings within families who experience different levels of economic security due to timing. If the sibling born during a period of high security shows stronger gendered preferences than the sibling born during austerity, this supports the resource hypothesis. If both siblings show identical preferences regardless of economic timing, but preferences shift only after national media campaigns change norms, this supports the unmasking hypothesis.

  In sum, the stipulated argument is valid but unsound. It treats a complex sociological correlation as a clean falsification of socialization. By ignoring confounds of wealth and measurement, and by failing to distinguish between the *origin* of preferences and the *expression* of preferences, conclusion (3) overreaches. Rejecting (3) does not commit one to denying sex-linked variation; it merely commits one to denying that this specific cross-national correlation proves it.

  ***

  ### Marking Scheme

  | Component | Marks | Must-Hit Points | Characteristic Errors to Penalize |
  | :--- | :---: | :--- | :--- |
  | **(a) Auxiliary Assumptions** | **8** | **1. Wealth Confound (4 marks):** Must identify that "gender equality" indices correlate with GDP. Must argue that wealth, not norms, might drive the divergence.<br>**2. Measurement Invariance (4 marks):** Must argue that "preference" may mean different things (aspiration vs. expectation) in different cultural contexts. | **Treating (2) as raw data:** Failing to question how the variables are constructed.<br>**Ignoring the Wealth/Equality distinction:** Assuming the index measures *only* norms.<br>**Assuming survey transparency:** Taking reported preferences at face value across cultures. |
  | **(b) Underdetermination & Alternatives** | **8** | **1. Affordability/Resource Hypothesis (4 marks):** Explain that security allows expression of small differences, not that security *creates* differences.<br>**2. Encoded Expectations (4 marks):** Explain that "choice" reflects structural constraints (e.g., care work compatibility), not just internal drive. | **The "Clean Modus Tollens" Error:** Treating the argument as a definitive disproof of socialization rather than a probabilistic inference.<br>**The "Blank Slate" Error:** Supposing that rejecting (3) requires denying *any* biological/sex-linked variation (false dichotomy). |
  | **(c) Study Design** | **6** | **1. Discrimination Logic (3 marks):** Design must isolate *wealth/security* from *norms/attitudes*.<br>**2. Feasibility/Specificity (3 marks):** Must specify longitudinal, within-country, or sibling comparison to control for culture. | **Vague "More Research":** Proposing generic cross-national studies without controlling for GDP.<br>**Irrelevant Design:** Proposing a study that measures biology directly rather than the social mechanism. |
  | **Clarity & Structure** | **3** | **1. Flow:** Clear intro, body paragraphs matching (a)-(c), conclusion.<br>**2. Precision:** Use of philosophical terms (validity, soundness, underdetermination). | **Disorganization:** Mixing tasks (a), (b), and (c) indiscriminately.<br>**Imprecision:** Using "nature vs. nurture" instead of analyzing the specific stipulated premises. |
  | **TOTAL** | **25** | | |

  **Examiner's Note on Characteristic Errors:**
  *   **The Modus Tollens Trap:** Students often treat Premise 1 as an undeniable law of social science. Marks should be deducted if they do not challenge the conditional link between "equality" and "convergence."
  *   **The False Dichotomy Trap:** Students often argue that if socialization is not the *chief* cause, it must be *no* cause, or vice versa. The model answer explicitly avoids this. Students who claim rejecting (3) proves men and women are identical should lose marks in section (b).
