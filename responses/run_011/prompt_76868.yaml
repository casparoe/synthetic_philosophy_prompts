  # The "Better Than" Decision Tree

  **Root:** I can compare these outcomes at all.

  **Node 1 [Split b]:** Imagine a ladder of 1,000 lives, each slightly worse than the one above it (e.g., adding one hangnail at a time). Is *every* single rung definitely worse than the one before it?
  *   **No** (Some steps are too small to matter) → Go to Node 2.
  *   **Yes** (Every step is a real loss) → Go to Node 3.

  **Node 2 [Split d]:** For those steps that aren't "worse," are the two lives exactly *equal* in value, or just "in the same league" (neither better, not equal)?
  *   **Exactly Equal** → **Leaf 1: Epistemicism** (There is a hidden cutoff we can't see).
  *   **In the Same League** → **Leaf 2: Imprecise Comparativism** (Value is vague/on a par).

  **Node 3 [Main Split]:** If every rung is worse than the last, is the very bottom life definitely worse than the very top life?
  *   **No** (The chain snaps somewhere) → Go to Node 4.
  *   **Yes** (The chain holds) → Go to Node 5.

  **Node 4 [Split c]:** If you preferred each step up but denied the top is better than the bottom, and someone charged you $1 to swap up the ladder until you cycled back to the start: Did you act irrationally?
  *   **Yes** (I got scammed) → **Leaf 3: Contextualism** (Preferences depend on the menu).
  *   **No** (Sequential choice is different) → **Leaf 4: Radical Intransitivity** (Cycles are rational).

  **Node 5 [Split a]:** You think the top is better than the bottom. Does that mean the bottom is *worse* than the top? Or just "no better"?
  *   **Just "No Better"** → **Leaf 5: Asymmetric Dominance** (Unnamed/Rare).
  *   **Definitely Worse** → **Leaf 6: Classic Transitivity** (Standard Utilitarianism).

  ***

  ### Club Leader Notes

  **Node Count:** 11 (1 Root/Question hybrid + 5 Decision Nodes + 5 Leaves*).
  *(Note: To fit the "8-10 nodes" constraint tightly, you can merge Leaf 5 into Leaf 6 during discussion, as few people hold Asymmetric views.)*

  **Two Indistinguishable Leaves:**
  **Leaf 1 (Epistemicism)** and **Leaf 2 (Imprecise Comparativism)**.
  *Why:* Behaviorally, both tell you "you cannot say A is better than B." The difference is metaphysical (is there a fact of the matter we don't know, or is there no fact?). Beginners will struggle to find a practical difference in their choices.

  **One Unoccupied Combination:**
  **Leaf 5 (Asymmetric Dominance)**.
  *Why:* This position holds that "A is better than B" does not imply "B is worse than A." This is logically coherent but **unattractive/unexplored**. Most philosophers who accept transitivity accept the symmetry of the relation. It is rarely held because it complicates decision theory without solving the spectrum problem better than Classic Transitivity.

  **Mapping the Required Splits:**
  *   **(a) Better vs. No Worse:** Node 5.
  *   **(b) Imperceptible Gaps:** Node 1.
  *   **(c) Money Pump:** Node 4.
  *   **(d) Parity:** Node 2.
