answer: |-
  **Part 0 — Diagnostic**

  To translate the situationist critique into a working instrument without collapsing into excuse-making or trait-essentialism, four distinctions must survive simplification. First, **global versus local traits**. We must abandon the idea that honesty in an exam predicts honesty in billing, but retain the idea that honesty in high-stakes clinical exams predicts honesty in high-stakes clinical exams. Consistency is required only across *relevantly similar* situations. Second, **disposition versus activation**. A trait may exist but remain dormant without a specific trigger (e.g., fatigue, hierarchy). The instrument must ask not just "is she honest?" but "what activates her dishonesty?" Third, **internal disposition versus external scaffolding**. Behavior is often held up by social structures (norms, checks, balances). When scaffolding removes the temptation, virtue is invisible; when scaffolding rots, vice emerges. We must distinguish the person's capacity from the environment's support. Fourth, **accountability versus prediction**. A person may be accountable for an act even if the act was situationally induced, provided they had reasonable capacity to resist. We punish to maintain norms, not merely to predict future risk.

  We can drop the statistical apparatus of the person-situation debate. Clinicians do not need to know that cross-situational correlation coefficients hover around .30. They need to know that behavior varies more than intuition suggests. Specific study names (Milgram, Darley & Batson) are unnecessary; the phenomena (obedience to authority, helping behavior under time pressure) should be described as common knowledge. The metaphysical debate about free will is also irrelevant; the panel operates on practical accountability, not ultimate responsibility.

  The popular formulation that "psychology disproved character" overstates the case. It disproved *global, robust* character traits that operate identically across all contexts. It did not disprove local, stable dispositions supported by habit and environment. The instrument must avoid this overstatement by not asking "Does this person have integrity?" but rather "Does this person have integrity *in contexts like this*?" and "Can we build a context where their integrity holds?"

  I considered three architectures. A **flowchart** was rejected because it implies binary decisions where judgment is required. A **weighted scoring system** was rejected because it creates a false precision that invites gaming. I chose a **Sequential Inquiry with Stopping Rules**. This mirrors the hearing's temporal structure, forces the panel to exhaust specific questions before reaching a verdict, and isolates where judgment is actually happening. It prevents the panel from jumping to the verdict (the "gut feeling") and working backward.

  ***

  **Part 1 — The Instrument**

  **Protocol for Professional Conduct Determinations**
  *Use this sequence. Do not skip steps. If a step yields a stopping rule, terminate.*

  **Step 1: Act Verification**
  *   **Question:** Did the reported behavior occur, and did the subject intend the action?
  *   **Admissible Evidence:** Direct observation, recordings, documentary evidence. Hearsay is inadmissible here.
  *   **Sufficient Answer:** Clear and convincing evidence that the subject performed the act voluntarily.
  *   **Output:** Fact Established / Fact Not Established.
  *   **Stopping Rule:** If Fact Not Established, case dismissed.
  *   **Type:** Mechanical.

  **Step 2: Situational Sampling**
  *   **Question:** Who is testifying about the subject's character, and in which specific contexts have they observed the subject?
  *   **Admissible Evidence:** Witness statements specifying role relationship (e.g., "supervised in clinic," "peer in exam").
  *   **Sufficient Answer:** A map of observations across at least two distinct professional contexts (e.g., clinical care, academic assessment, team interaction).
  *   **Output:** Sampling Profile ( Narrow [one context] / Broad [multiple contexts]).
  *   **Type:** Mechanical.
  *   **Note:** Character references from a single role (e.g., only research supervisors) must be marked "Narrow." Narrow sampling cannot support a global character finding.

  **Step 3: The Mechanism Test (No-Alibi-without-Mechanism)**
  *   **Question:** If a situational explanation is offered (e.g., stress, hierarchy), can we name the specific variable and state what would change if it were absent?
  *   **Admissible Evidence:** Subject testimony, context logs, expert input on workflow.
  *   **Sufficient Answer:** A specific variable (e.g., "sleep deprivation >24 hours") and a counterfactual (e.g., "With 8 hours sleep, the error rate drops to baseline"). Vague appeals ("pressure," "culture") are insufficient.
  *   **Output:** Mechanism Identified / Mechanism Vague.
  *   **Stopping Rule:** If Mechanism Identified, proceed to Step 4 but mark disposition as "Conditional." If Mechanism Vague, treat behavior as disposition-driven.
  *   **Type:** Judgment. Tracks specificity of causal claim. Divergence occurs if panelists disagree on whether a variable is specific enough.

  **Step 4: Disposition and Accountability Separation**
  *   **Question:** What does the evidence support about the subject's dispositions, and for what are they answerable?
  *   **Admissible Evidence:** Steps 1-3 outputs.
  *   **Sufficient Answer:** Two distinct statements. (1) Disposition: e.g., "Has honest disposition fragile under sleep deprivation." (2) Accountability: e.g., "Answerable for managing sleep schedule."
  *   **Output:** Disposition Statement + Accountability Statement.
  *   **Type:** Judgment. Tracks the link between capacity and expectation. Divergence occurs on what is "reasonable to expect" under the identified mechanism.
  *   **Stopping Rule:** None. Proceed to Step 5.

  **Step 5: Institutional Scaffolding (Recommendation)**
  *   **Question:** What forward-looking change to the situation is required to support professional conduct?
  *   **Admissible Evidence:** Program policies, workflow analysis.
  *   **Sufficient Answer:** A specific structural change (e.g., "Remove from night shift," "Require co-signature") OR a specific remediation (e.g., "Ethics coaching").
  *   **Output:** Institutional Action Plan.
  *   **Type:** Judgment. Tracks feasibility and proportionality.
  *   **Closing Rule:** Every determination must end with this plan. A verdict without a plan is incomplete.

  ***

  **Part 2 — Three Applications**

  **Case A: The Bereaved Student**
  *Step 2 (Sampling)* reveals narrow data: faculty know her as honest in class, but this is an exam context. However, *Step 3 (Mechanism)* identifies a specific variable: acute grief eleven days post-bereavement. The counterfactual is clear: had the brother lived, the stressor vanishes. This is not a vague "pressure" alibi; it is a specific cognitive load event.
  *Decision:* Step 3 decides the case. The behavior is treated as a situational failure, not a global trait failure.
  *Determination Sketch:* "Fact Established. Mechanism Identified: Acute bereavement impact on executive function. Disposition: Honesty intact but vulnerable to acute crisis. Accountability: Subject answerable for seeking accommodation protocols during crisis. Action: Grade voided; required counseling; retake exam under standard conditions. No finding of integrity violation."
  *Reasoning:* The instrument prevents a global "dishonest" label based on a single episode driven by a verified, specific mechanism.

  **Case B: The Silent Resident**
  *Step 2 (Sampling)* shows she has raised concerns twice before (willingness exists). *Step 3 (Mechanism)* identifies the variable: hierarchical coercion by a specific attending who penalizes pushback. The counterfactual: In a psychologically safe team, she speaks up. The mechanism is external coercion, not internal cowardice.
  *Decision:* Step 4 separates disposition from accountability. She possesses the disposition (courage) but the situation suppressed activation. She is answerable for patient safety, but the primary accountability lies with the system that punished prior attempts.
  *Determination Sketch:* "Fact Established. Mechanism Identified: Hierarchical suppression. Disposition: Moral courage present but situationally suppressed. Accountability: Shared; subject answerable for escalating via alternative channels, Program answerable for culture. Action: No remediation for resident. Review of attending's feedback patterns. Mandatory team psychological safety training."
  *Reasoning:* The instrument blocks the Program Director's request for a character finding on the resident. The finding targets the scaffolding.

  **Case C: The Decent Surgeon**
  *Step 2 (Sampling)* is critical here. Three episodes over nine months across three contexts: patient consent, team handover, nursing staff interaction. This is broad sampling across professional roles. *Step 3 (Mechanism)* tests his alibis: "exhaustion," "hostile list," "grief." None meet the mechanism test. He cannot state what would change if the list were friendly, nor specify the exhaustion level. These are vague appeals.
  *Decision:* Step 3 fails the alibi; Step 2 confirms cross-situational consistency.
  *Determination Sketch:* "Fact Established. Mechanism Vague. Disposition: Consistent pattern of dismissiveness across professional contexts. Accountability: Fully answerable; seniority implies higher duty to model conduct. Action: Formal probation; mandatory communication coaching; removal from teaching roster until cleared."
  *Reasoning:* **This outcome contradicts my expectation.** As Chair, I am inclined to accept the "decent" reputation and situational excuses for a senior colleague (the "Situationist for friends" bias). The instrument forces a hard finding because the sampling shows consistency across relevant professional contexts, and the alibis lack specific mechanisms. The "decent" reputation is revealed as Narrow Sampling (likely based on peer socializing, not professional conduct). The instrument protects the institution from status bias.

  ***

  **Part 3 — Limits and Failure Modes**

  The instrument will systematically err toward finding situational causes when evidence is sparse, because the "Mechanism Test" requires specificity that is hard to prove negatively. It favors the subject when the panel is lazy. Conversely, it may over-pathologize behavior in simulated environments (OSCEs). An exam station is an atypical situation by design (high surveillance, artificial stress). Evidence generated here must be weighted lightly in Step 2 (Sampling) and never used alone for a global finding.

  A harder limit is the subject with chronically bad circumstances. If a resident is permanently overworked, "exhaustion" becomes a permanent state, not a specific trigger. Here, situational explanation threatens to explain everything and excuse nothing. The instrument handles this in Step 5: the recommendation must be structural (reduce workload) rather than individual (resilience training). If the institution cannot change the situation, it cannot hold the individual fully accountable for situation-induced failure.

  Finally, there is the reflexivity problem. The hearing itself is a high-power, high-surveillance situation. A subject may perform contrition or compliance in the room that does not reflect their true disposition. The instrument cannot solve this, but Step 2 requires evidence from *outside* the hearing room. We must not mistake performance in the tribunal for character in the clinic. The instrument assumes the panel can recognize its own power dynamics; if it cannot, Step 5 recommendations will fail because they will demand compliance rather than virtue. The tool is only as good as the willingness of the panel to apply the Mechanism Test to themselves.
