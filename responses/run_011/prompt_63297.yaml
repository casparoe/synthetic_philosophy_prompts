  To reject (3), you must assert that the physical description of "quantum branching" is not equivalent to "classical duplication" in the relevant respect. Specifically, you must maintain that **branch number is not a well-defined physical quantity** in EQM, whereas **copy number is a well-defined physical quantity** in classical mechanics.

