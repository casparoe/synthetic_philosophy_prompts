  **Decision Tree: Divine Foreknowledge and Human Freedom**

  *Instructions: Start at Node 1. Answer the concrete question based on your intuitions about the case provided. Follow the branch to the next node or to a terminal leaf. Terms of art are defined in parentheses at first use.*

  *   **Node 1:** Consider the proposition "Clara will freely accept the post in Lisbon next June." Is this proposition true right now, before Clara has decided?
      *   *Gloss: Tests truth values of future contingents (statements about future free acts).*
      *   **No:** Go to Leaf A.
      *   **Yes:** Go to Node 2.

  *   **Node 2:** If the proposition is true now, is there anything *existing* right now that makes it true?
      *   *Gloss: Tests grounding (what reality corresponds to the truth).*
      *   **No:** Go to Leaf B.
      *   **Yes:** Go to Node 3.

  *   **Node 3:** What makes it true? Is it God's decision to cause Clara's choice, or something about Clara's own power?
      *   *Gloss: Tests causal source (determinism vs. libertarianism).*
      *   **God's decision/causation:** Go to Node 4.
      *   **Clara's own power:** Go to Node 5.

  *   **Node 4:** Does God physically move Clara's will to ensure she chooses Lisbon?
      *   *Gloss: Tests physical premotion (direct divine causation of the will).*
      *   **Yes:** Go to Leaf C.
      *   **No (God merely ordains it):** Go to Leaf D.

  *   **Node 5:** Does God's knowledge of this truth depend on His decision to create Clara?
      *   *Gloss: Tests logical priority of knowledge vs. decree (middle knowledge).*
      *   **Yes (Knowledge depends on Decree):** Go to Node 6.
      *   **No (Knowledge guides Decree):** Go to Node 7.

  *   **Node 6:** Is God's past belief about Clara a fixed fact that Clara cannot now change?
      *   *Gloss: Tests fixity of the past (hard vs. soft facts).*
      *   **No (She can change it):** Go to Leaf E.
      *   **Yes (It is fixed):** Go to Leaf F.

  *   **Node 7:** Does God exist inside time waiting for Clara's choice, or outside time seeing all at once?
      *   *Gloss: Tests divine temporality (everlasting vs. timeless).*
      *   **Outside time (Timeless):** Go to Leaf G.
      *   **Inside time (Temporal):** Go to Leaf H.

  ***

  **Terminal Leaves**

  *   **Leaf A: Open Theism**
      *   *Commitment Cost:* Abandons (1) (God does not know future free acts as true).
      *   *Neighbor's Objection:* How can God be omniscient if He does not know what is true?

  *   **Leaf B: Grounding Objection Refusal (Brute Truths)**
      *   *Commitment Cost:* Reinterprets (1) (Truths exist without truthmakers).
