  1.  **Node Order:** The order of Nodes 3 and 4 is strict; one must establish *who* causes the act before asking *how* they cause it. Similarly, Node 5 must precede Nodes 6 and 7; the question of whether God's knowledge is fixed (Node 6) or timeless (Node 7) only arises for those who think God knows free acts without causing them (Node 3).
  2.  **Indistinguishable Leaves:**
      *   **Simple Foreknowledge (F) vs. Molinism (H):** These are separated by Node 5 (dependency of knowledge). However, this distinction is often verbal. Both claim God knows future free acts. The tie-breaking question is: *Does God know what Clara **would** do in circumstances He never creates?* If yes, Molinism; if no, Simple Foreknowledge.
      *   **Simple Foreknowledge (F) vs. Boethianism (G):** Boethianism may simply be Simple Foreknowledge described using timelessness. The tie-breaking question is: *Does timelessness solve the fixity of the past problem better than temporal foreknowledge?* If no, they collapse.
      *   **Simple Foreknowledge (F) vs. Ockhamism (E):** Ockhamism is often the mechanism Simple Foreknowledge advocates use to save freedom. They are separated here by the "Fixity" node, but many Simple Foreknowledge advocates are Ockhamists. The distinction is functional, not doctrinal.

