  *   **Leaf D: Theological Determinism**
      *   *Commitment Cost:* Abandons (2) (Actions are not libertarian free).
      *   *Neighbor's Objection:* Why hold Clara morally responsible for what God ordained?

  *   **Leaf E: Ockhamism**
      *   *Commitment Cost:* Reinterprets (1) (Past beliefs are "soft facts" dependent on future).
      *   *Neighbor's Objection:* Does this not imply we have power to change the past?

  *   **Leaf F: Simple Foreknowledge**
      *   *Commitment Cost:* Reinterprets (1) (Knowledge is dependent on world, not guiding).
