answer: |-
  I respect the precision of your data and I am not going to pretend that the physical science of emissions is up for debate in the way a skeptic might claim. Your lab's numbers are robust regarding aggregates; if society drives X miles, Y harms occur. But you are making a category error when you transpose that population-level statistic onto a singular causal chain. The dose-response model tells us about the relationship between total volume and total outcome across a vast system, not the probability that a specific unit of volume triggers a specific unit of harm. To say your specific drive has a nonzero chance of causing a specific death is to assume the system behaves linearly at the micro-scale, when in reality, harms like asthma attacks or heat deaths are discrete events triggered by thresholds being crossed, not by smooth accumulations of probability.

  When you calculate expected harm by multiplying a tiny probability by a large disvalue, you are smoothing over the causal discontinuity that actually exists in the world. In most complex systems, especially markets and climate feedback loops, individual inputs are absorbed without changing the outcome until a critical mass is reached. Your tank of petrol adds to the aggregate, yes, but it almost certainly does not change the ordering of shipments, the extraction rate, or the specific weather pattern that leads to the harm. If the harm would have occurred exactly when and how it did regardless of your specific contribution, then your causal efficacy is zero, not merely small. The "probability" you cite is a measure of our ignorance about where the threshold lies, not a genuine propensity of your act to produce the harm.

  So what am I saying when I say "no difference"? I am saying that moral responsibility tracks actual causal influence on outcomes, not participation in a risk pool. If the world looks exactly the same in terms of who suffers and who dies whether you drive or not, then you have made no moral difference, regardless of the aggregate models. You are conflating being a necessary part of a sufficient set of conditions with being the condition that made the difference. Until you can show that your specific trip tipped a specific threshold that caused a specific harm, the expected value calculation is just a mathematical artifact that doesn't map onto moral reality.

