      *   The core of the inefficacy objection isn't usually that the *physics* is wrong (i.e., that CO2 doesn't trap heat), but that the *causal chain* from individual consumption to specific harm is discontinuous or preempted.
      *   Standard move: The "threshold" problem. Markets and emissions operate on thresholds. One tank of gas doesn't trigger a specific extraction event or a specific weather event. The harm is overdetermined or subject to sorites-like vagueness where the individual contribution is causally inert until a threshold is crossed, and you almost never cross the threshold alone.
      *   Another move: The distinction between *making a difference* and *making a difference that matters*. Even if there's a microscopic physical effect, does it map onto a moral difference?
      *   Another move: Expected utility vs. actual outcome. Consequentialism often cares about actual outcomes. If the outcome is identical whether I drive or not (because the threshold wasn't crossed), then I made no difference.
      *   User's specific challenge: They are citing *expected harm* based on risk models (dose-response). They are conflating statistical risk with causal efficacy in a specific instance.
      *   My counter: Statistical risk models aggregate over populations. They don't track individual causal chains. The "one death per X trips" is a population-level statistic, not a claim that *this* trip caused *that* death. It's a model of aggregate impact, not individual efficacy.

