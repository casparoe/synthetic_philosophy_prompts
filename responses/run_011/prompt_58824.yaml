answer: |-
  The wind is up. It wants this speech short. So do I.

  We are gathered for two endings. The ship leaves us. I leave the ship. We are both going elsewhere. She crosses an ocean to sail under a new name. I go home to a quiet winter. For forty-six years I have traded on the idea that she is the same vessel I signed on to in 1979. Today that continuity stops. It stops here. It stops now. She will sail on, but not as *Constancy*. Not as ours.

  [Pause]

  We have two hulls in this room. I know what it is like to stand in both.

  In the museum dry dock, the air is still. It smells of dry oak and dust. The light is electric. You can walk around her without wetting your feet. She is complete. Every curve is exactly as the builder laid it down in 1921. When you put your hand on her planking, you are touching the year she was born. But she does not move. She never will. She is a monument to origin.

  On the quay, the air smells of tar and salt and diesel. The deck moves under you, even when she is tied up. She is never complete. There is always a seam needing caulking, a shroud needing set. When you put your hand on her planking, you are touching the work we did last week. She is a monument to service.

  In 1998, I told a reporter that the planks are just hair and fingernails. They grow back. The curator has used that line to raise money. He was right to use it. I was right to say it. But hair and fingernails belong to a living body. A body is not just its cells. It is what those cells do. It is where they go.

  [Pause]

  I know the museum's hull. In the winters of 1985 and 1986, I was paid to catalogue the barn. Piece by piece. I held every numbered timber. I know the weight of them. I know the smell. I once spent three days trying to match a frame segment to a scar in the keel. I got it wrong. Twice. My back still knows the difference between a loft floor and a barn floor. Two of the conservators here learned to sail on our deck. They know the difference between a hull that floats and a hull that holds. We are not enemies. We are witnesses to different truths.

  The Registrar asks for a single vessel against a single number. He says the board is deadlocked. He says the choice is mine.

  The Official Number does not record timber. It does not record shape. It records liability. It records service. It is an index to the ledgers. Those ledgers contain the logs of every pilotage, every repair, every storm we weathered. The museum hull has no ledgers. She has no logs. She has no history of work. She has a history of preservation. That is noble. It is necessary. But it is not what the Number counts.

  The Number belongs to the worker.

  [Pause]

  So I assign the Official Number to the sailing vessel. It will be struck with her departure. It leaves with us.

  I know what this costs. The museum team has spent six years rebuilding a home for this identity. They will not have the Number they sought. They will have the wood. They will have the origin. They can tell their visitors: "The Number tracked the work. We kept the body." That is not a loss. It is a distinction.

  The crew will not have the Number either, not for long. She sails abroad. She takes a new registry. She becomes a different legal entity. We lose the name. We lose the number. We keep the memory of the work.

  This is not a clean ending. Someone leaves with less than they came for. I am sorry for that. I cannot fix it with words.

  There is a woman in the second row. She is eighty-one. She has a photograph of the launch in her bag. Her grandfather built this hull. She has watched us sail her for fifty years. She has watched the museum build her from the barn. She knows both of them. She knows that a ship is not just wood, and not just a name. It is the space between them.

  I hand the entry to the Harbour Master. The Number goes with the service. The wood stays here. Let the record show that *Constancy* served. Let the record show that the timber remains.

  We are done.
