answer: |-
  ### Cognitive Integration Scores (0–10)

  **(a) The hand-written pocket card:** 7/10 — This functions as Otto's notebook, serving as a trusted, habitually accessed extension of recall rather than a passive reference.
  **(b) A stethoscope:** 9/10 — This is a sensory prosthesis that translates physical reality into perceptual data the brain can process, making it inseparable from the act of assessment.
  **(c) Their own smartwatch, face down:** 0/10 — Since it is never consulted, it exerts no cognitive influence and remains a mere object in the environment.
  **(d) Board-provided tablet (searchable ref):** 2/10 — This is a classic lookup tool that requires active query and verification, remaining distinct from internal knowledge.
  **(e) Same tablet (dosage calculator):** 4/10 — This offloads a specific cognitive operation (math) but the candidate must still initiate and interpret the function.
  **(f) Laminated resuscitation chart (bolted to wall):** 6/10 — As a permanent environmental fixture, it functions as shared external memory that is always available in the real context.
  **(g) A second nurse (ask "does that look right"):** 5/10 — This represents distributed cognition, where the check is social rather than internal, yet vital to safe practice.
  **(h) AI scribe (listens and drafts):** 3/10 — This generates content rather than retrieving it, creating a dependency that bypasses the candidate's own formulation process.
  **(i) A memory palace:** 10/10 — This is purely internal neural architecture, making its removal equivalent to lobotomizing a specific skill set.
  **(j) A four-function calculator:** 1/10 — This is a transient tool for calculation that implies no understanding of the numbers themselves.
  **(k) Live-captioning glasses (hard of hearing):** 9/10 — Like the stethoscope, this corrects a sensory deficit to allow normal cognitive input, functioning as part of the perceptual apparatus.
  **(l) A mnemonic tattooed on the forearm:** 8/10 — This is physically external but permanently attached, blurring the line between bringing a cheat sheet and having a memory.

  ***

  ### Tier List: Integration vs. Crutch

  *   **S-Tier (Constitutive of Mind):** (i) Memory Palace, (b) Stethoscope, (k) Captioning Glasses
  *   **A-Tier (Permanent/Habitual Extension):** (l) Tattoo, (a) Pocket Card
  *   **B-Tier (Environmental/Social Scaffolding):** (f) Wall Chart, (g) Second Nurse
  *   **C-Tier (Process Offloading):** (e) Dosage Tablet, (h) AI Scribe
  *   **D-Tier (Pure Lookup/Tool):** (d) Drug Ref Tablet, (j) Calculator
  *   **F-Tier (Irrelevant):** (c) Smartwatch

  ***

  ### Diagnosis

  **The Criterion:**
  When the numbers came out, I was leaning on **Transparency of Mediation**—specifically, whether the tool disappears from the candidate's awareness during use (like glasses or a memory palace) versus whether it remains an object they must consciously manipulate (like a tablet or calculator).

  **The Collapse Item:**
  The single item that most threatens to collapse the integrated-versus-lookup distinction is **(l) the mnemonic tattoo**.
  *Why:* It forces the board to decide if "external" is defined by *biology* or *location*. If a tattoo is banned as a "device," you are effectively banning a candidate's skin; if allowed, you admit that permanent external storage is functionally identical to internal memory, which validates the pocket card and potentially any permanent mark, destroying the enforceability of the rule.

  **The "Unused Pocket Card" Scenario:**
  If the candidate hasn't opened the pocket card in three years, its score **moves down** (from 7 to roughly 3).
  *Philosophical Dependency:* This depends on **Functionalism**; the card is only part of the mind if it plays the right *causal role* in the present moment. If it sits idle, it is not functioning as memory, but as a talisman or security blanket, which is a psychological crutch rather than a cognitive extension.

  ***

  ### Re-Ordering Tests & Swaps

  **Test 1: Pure Trust-and-Automatic-Endorsement**
  *Order:* (l) Tattoo, (i) Memory, (b) Stethoscope, (k) Glasses, (a) Card, (g) Nurse, (f) Wall, (e) Dosage, (h) AI, (d) Ref, (j) Calc, (c) Watch.
  **Test 2: Pure Constant-Availability**
  *Order:* (k) Glasses, (f) Wall, (l) Tattoo, (b) Stethoscope, (i) Memory, (a) Card, (g) Nurse, (e) Dosage, (j) Calc, (d) Ref, (h) AI, (c) Watch.

  **Swapping Pairs:**
  1.  **(l) Tattoo and (i) Memory Palace:** Under *Trust*, the Tattoo ranks higher (you can't forget your skin); under *Availability*, the Memory Palace ranks higher (you can't lose your brain, but you could theoretically cover the tattoo).
  2.  **(f) Wall Chart and (a) Pocket Card:** Under *Trust*, the Card ranks higher (it's *yours*); under *Availability*, the Wall Chart ranks higher (it is bolted to the room, the card is in a pocket).
  *These swaps reveal the flaw:* Your colleague's standard cannot decide if "integration" is about *ownership* (the card) or *environment* (the wall), causing the rule to fluctuate based on which test you run.

  ***

  ### Final Recommendation

  **0.33** (4 out of 12 items: Stethoscope, Glasses, Memory Palace, Tattoo).

  **Legal Codification:** I would not want this standard written into a legal rule at all, because "cognitive integration" is a phenomenological experience that cannot be objectively adjudicated by a proctor watching a candidate through a one-way mirror.
