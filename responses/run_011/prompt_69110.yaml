  ### 1. The Candidate Rules
  Based on her record, she is operating under three overlapping heuristics. They are consistent with her past verdicts but diverge on the subject-dropping case.

  *   **Rule A (The Poverty of Stimulus Hardline):** If the input cannot logically disconfirm a wrong hypothesis (i.e., there is no negative evidence), the correct constraint must be innate.
      *   *Support:* Auxiliary fronting and Island constraints. Kids aren't told the linear rule is wrong, yet they don't use it.
  *   **Rule B (The Principles & Parameters Switch):** Universal structural principles are innate; language-specific variations (parameters) are set by positive cues in the input.
      *   *Support:* Word order and auxiliaries are learned (they vary); Binding Principle C is innate (it's universal).
  *   **Rule C (Statistical Preemption):** An innate default rule applies unless a specific form is entrenched by statistical frequency in the input. Developmental delays are attributed to processing, not grammar.
      *   *Support:* *Goed* vs. *went* (default blocked by entrenchment); Binding Principle B delay (processing, not grammatical ignorance).

  ### 2. Predictions for Subject Dropping
  Here is how each rule handles the English/Italian subject-dropping contrast and the early "telegraphic" stage ("Want cookie").

  | Rule | Verdict on Subject Requirement | Verdict on Early Dropping | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Rule A (POS)** | **Innate.** | **Performance Error.** | The input never says "Don't drop subjects." Absence of evidence isn't evidence of absence. Therefore, the ban must be built-in. Early dropping is a mouth/memory failure, not a grammar failure. |
  | **Rule B (Parameters)** | **Learned.** | **Parameter Unset.** | Pro-drop is a parameter (English vs. Italian). The child needs a positive cue (e.g., expletive *it*) to set the switch to "Overt." Until then, they may default to null. |
  | **Rule C (Statistics)** | **Learned.** | **Insufficient Entrenchment.** | Overt subjects are frequent in English input; null subjects are not. The overt form preempts the null form. Early dropping occurs because the statistical threshold hasn't been met yet. |

  ### 3. Best Guess: What She Will Say
  She will argue that the **requirement for a subject is innate (Rule A/B hybrid), but the overt realization is learned via a parameter cue (Rule B), and early dropping is a processing limitation (Rule C).**

  **The Reasoning:**
  She is a "disciplined nativist." She cannot afford to say the subject requirement is fully learned (Rule C) because that undermines the Poverty of Stimulus argument she relies on for Auxiliary Fronting. If absence of evidence can teach a kid *not* to drop subjects, absence of evidence could theoretically teach them *not* to front auxiliaries linearly. She needs to protect the POS argument.

  However, she cannot say the *overt/null* distinction is innate (Rule A) because it varies between English and Italian (violating Rule B).

  **Her Likely Script:**
  "The principle that a clause requires a subject (the Extended Projection Principle) is innate. But whether that subject can be phonologically null is a parameter. The English child sets this parameter to 'Overt' upon encountering positive evidence—specifically expletives like *it* and *there*, which carry no meaning and thus signal a structural requirement. The early telegraphic stage ('Want cookie') is not grammatical ignorance; it's the same processing bottleneck we see in Binding Principle B. They know the rule, but producing the subject costs working memory they don't have yet."

  ### 4. The "Goed" vs. "It" Commitment
  This is where she is most vulnerable. Her entrenchment answer about *goed* commits her to **Rule C (Statistical Preemption)**.

  **The Trap:**
  In the *goed/went* case, she argues that *went* (specific form) preempts *goed* (general rule) because the child hears *went* frequently in the exact context where they would produce *goed*.
  In the subject-dropping case, *It is raining* (specific overt form) competes with *Is raining* (null subject form).

  **The Breakdown:**
  If she accepts that *went* blocks *goed* via statistics, she logically must accept that *it* blocks *null* via statistics. If statistics can block a morphological default, why can't they block a syntactic default?
  *   **If she says statistics handle both:** She undermines the need for an innate "Pro-Drop Parameter." A general statistical learner could figure out English requires subjects just by noting the frequency of overt subjects, without an innate switch.
  *   **If she says they are different:** She must argue that *it* is a **parameter cue**, not just a frequent form. She will claim *it* is special because it is semantically empty. *Went* is just a lexical item; *it* is a structural signal.
  *   **The Commitment:** She is committed to the idea that **semantically empty forms trigger innate switches, whereas semantically full forms merely compete statistically.** If you press her on why *it* isn't just a high-frequency form that preempts the null subject the same way *went* preempts *goed*, she will have to draw a sharp line between "lexical entrenchment" and "parameter setting." That line is theoretically thin and empirically messy.

  ### 5. The Live Case: Resumptive Pronouns
  To force a divergence between her rules, ask her about **Resumptive Pronouns in Relative Clauses** (e.g., *"This is the book that I lost **it**"*).

  *   **The Phenomenon:** Standard English forbids resumptive pronouns in this context. Some other languages (and English dialects/children) allow them.
  *   **Why it breaks her consistency:**
      *   **Rule A (POS) Prediction: Innate Ban.** Kids are never told *"You can't say 'the book that I lost it'."* The input simply lacks it. By her Auxiliary Fronting logic, the ban must be innate.
      *   **Rule B (Parameters) Prediction: Learned.** Since some languages *do* allow resumptives, this is a parameter. It should be learned from input cues.
      *   **Rule C (Statistics) Prediction: Learned.** English kids hear zero resumptives. Entrenchment of the gap strategy ("the book that I lost") should block the pronoun strategy.

  **The Question to Ask:**
  *"You argue that Auxiliary Fronting is innate because the input doesn't disconfirm the linear rule. But Resumptive Pronouns are also never disconfirmed by the input—English kids just never hear them. Yet they vary across languages like Word Order. Is the ban on Resumptives innate (like Fronting) or a learned parameter (like Word Order)? If it's innate, how do Italian kids learn to allow them? If it's learned, why doesn't statistical entrenchment work for Fronting the same way it works for Resumptives?"*

  **Why this works:**
  *   If she says **Innate**, she contradicts her verdict on Word Order/Parameters (Rule B).
  *   If she says **Learned**, she contradicts her verdict on Auxiliary Fronting (Rule A).
  *   If she says **Statistics**, she admits the POS argument is weaker than she claims (Rule C).

  This forces her to choose which of her three "disciplined" rules is the master rule, revealing where her nativism actually lies.
