  **The Scenario**

  Eleanor, a 64-year-old female administrative assistant, presents for a routine occupational health screening. She feels fine, reports no pain, and has no history of fractures, but her dual-energy X-ray absorptiometry (DEXA) scan returns a lumbar spine T-score of -2.1, placing her in the osteopenic range, with a FRAX score indicating a 15% probability of major osteoporotic fracture in the next ten years. Her Z-score (age-matched) is 0.0, meaning her bone mineral density is exactly the statistical mean for women of her age and sex in the national population. Her primary care physician recommends starting bisphosphonates to reduce fracture risk, citing the threat to her long-term mobility and independence, but notes that her bone loss is consistent with typical post-menopausal physiological aging.

  **The Analysis**

  **Biostatistical Theory (BST):** Boorse's account defines health as statistical normality of function within a reference class of age, sex, and species. Here, the relevant part-function is **bone mineralization efficiency**. The reference class is **human females aged 60–69**. Because Eleanor's Z-score is 0.0, her bone density is precisely at the species-typical mean for this class; she is not an outlier. Boorse explicitly excludes universal aging processes from the category of "disease," classifying them as normal physiological decline. Since her bone loss is the statistical norm for her reference class and results from standard aging rather than a pathological deviation, the BST verdict is **Healthy**.

  **Normativist Account (Ability-to-Achieve-Vital-Goals):** This account defines health as the ability to achieve vital goals (e.g., survival, mobility, agency) under standard circumstances. Eleanor's bone density creates a structural fragility that significantly elevates the probability of a hip or vertebral fracture from minor stressors (a fall, a cough). A fracture would directly incapacitate her ability to walk, live independently, and avoid pain—core vital goals. The normativist argues that the *consequence* of the biological state (fragility) matters more than its *frequency*. Because her current physiology objectively threatens her survival and agency, the Normativist verdict is **Diseased/Unhealthy**.

  **The Single Feature & Minimal Edit**

  The feature doing all the lifting is the **prevalence of the condition within the age-specific reference class**.
  *   **Minimal Edit:** Keep Eleanor's biology exactly the same (T-score -2.1, same fracture risk), but change the epidemiology so that only 2% of 64-year-old women have this bone density (perhaps due to a hypothetical universal supplementation program).
  *   **Convergence:** In this edited scenario, both theories converge on **Diseased**. The Normativist still sees the fracture risk. The Boorsean now sees a statistical deviation below the species-typical function for her age class. The disagreement vanishes when the condition ceases to be "normal" for the group.

  **Wakefield's Harmful Dysfunction (HD)**

  Wakefield lands on **Diseased**.
  *   **Harm:** The elevated fracture risk constitutes a clear harm (threat to survival/mobility).
  *   **Dysfunction:** Wakefield relies on evolutionary design. Human bone remodeling mechanisms are "designed" to maintain structural integrity sufficient for survival through the reproductive period and into grandparenting. While some loss is expected, a density level yielding a 15% major fracture risk likely represents a failure of the mechanism to maintain the *designed* safety margin, even if that failure is statistically common due to modern longevity.
  *   **Third Verdict?** This is not a genuine third verdict; it is a collapse onto the **Normativist** side. Wakefield uses "dysfunction" to naturalize the judgment, but in cases of endemic decline (aging), his "design" criterion often stretches to match the normative harm, effectively siding with the idea that "harmful = disease" even if "common."

  **The Boorsean Rescue**

  A Boorsean would reach for the **Disease vs. Aging Distinction**. They would argue that BST is not intended to medicalize universal senescence. If a functional loss is species-typical for a specific age class, it is "normal aging," not "disease."
  *   **Does it work?** It works internally to save the theory from calling everyone diseased, but it fails as a philosophical rescue in this context. It concedes that Eleanor is *unhealthy* (in the colloquial sense) but denies her the label *diseased*. This makes the theory compatible with anything by fiat: if it's common, it's aging; if it's rare, it's disease. It renders the concept of "disease" irrelevant to clinical decision-making, since the physician treats the *risk* (the harm), regardless of whether Boorse labels it "aging" or "disease."

  **Medical Accuracy Flag**

  **Potential Embarrassment:** A clinician in the room may object to the use of the **Z-score** in the scenario. In clinical practice, osteoporosis is diagnosed using **T-scores** (comparison to a healthy 30-year-old), not Z-scores (comparison to age-matched peers), precisely because bone loss *is* considered pathological even if age-typical. Boorse *requires* age-matched classes to avoid calling aging a disease, but medicine *rejects* age-matching for this diagnosis.
  *   **Fix:** Acknowledge this tension explicitly. The scenario works *because* medicine uses a young-adult reference (implying disease) while Boorse demands an age-matched reference (implying health). If you don't highlight this divergence in reference class standards, the medical expert will correct you on the diagnostic criteria.
