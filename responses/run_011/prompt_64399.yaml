prompt: |-
  Next term our second-year philosophy of mind course devotes a week to the split-brain cases and what they are supposed to show about the unity of consciousness, and I have been assigned the section. I am not asking for an exposition of the material; I want a plan for building it in the room, and I want it answerable in the terms I set out below.

  Three constraints govern the session. First, I have fifty minutes, a whiteboard, and nothing else: no slides, and specifically none of the film footage of the classic experiments, which is the device everyone normally reaches for, so the plan must work without it. Second, the students have done the assigned reading and have already sorted themselves into two roughly equal camps. One camp holds that a commissurotomy patient is literally two conscious subjects sharing a single body, and that the discipline should say so plainly. The other holds that the dissociations are artefacts of an apparatus that never obtains outside the laboratory and therefore establish nothing about consciousness. Third, my objective is not to referee between these camps but to make both see that each has skipped the step that actually decides the question. The students have had one lecture on hemispheric lateralization from the psychology department and no neuroscience beyond it.

  What I need:

  1. The order of the components, with the dependency structure made explicit: which claim must be secured before which further claim can even be stated, and why. Mark in particular the point at which the session crosses from "the two hemispheres can be shown to process information independently" to anything resembling a claim about experience, and say what has to be true before that crossing is legitimate.

  2. One carrying case — a single scenario I can draw on the board, develop, and return to throughout, rather than a tour of paradigms. State what features it must have to bear the weight and what features it must lack. Then tell me whether the obvious candidate (a stimulus confined to one visual field, with a verbal report that contradicts a simultaneously correct response by the hand controlled by the other hemisphere) is the right carrier or a trap; if it is a trap, say what any replacement would have to preserve, and note what I lose by not using the everyday anecdotes about the two hands working at cross purposes.

  3. A misconception map. Beyond the two camps above, identify the errors the students will generate in the course of my own explanation as a by-product of it — for example the inference that the hemisphere without speech is thereby without experience, the assumption that whatever integrates the intact brain must be the corpus callosum and nothing more, the belief that these patients' apparent ordinariness is explained by their having learned to compensate, and the treatment of one hemisphere's confabulated account as a report about the other's states. For each, give the point in the sequence at which it should be headed off and the sentence or two that heads it off.

  4. The one thing the session must not slide past: why the disunity, if it is disunity, surfaces only under engineered conditions. I want a formulation I can deliver aloud that does not concede the second camp's dismissal and does not overclaim on the first camp's behalf, together with an explanation of why that formulation is the honest one.

  5. A closing check — a single question put to the room whose answers discriminate between students who have grasped the question and students who have merely picked a side. Describe what a good answer looks like and what a diagnostic bad answer looks like.

  6. What I should decline outright and announce as declined, rather than gesture at: including the dispute over how many persons one of these patients is, which would consume the hour if admitted, and any other component you judge to be unteachable in this format without doing damage to it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Second-year philosophy of mind course, 50-minute session on split-brain cases.
      *   **Constraints:**
          1.  No slides, no video footage (whiteboard only).
          2.  Students have read the material and are already polarized (Two Subjects vs. Artefact of Apparatus).
          3.  Objective: Not to referee, but to show *both* camps skipped the decisive step.
          4.  Student Background: One psych lecture on lateralization, no deep neuroscience.
      *   **Deliverables:**
          1.  Order of components with dependency structure (specifically the jump from information processing to experience).
          2.  One "carrying case" (scenario) to draw on the board (evaluate the standard visual field/hand conflict scenario).
          3.  Misconception map (specific errors to head off during explanation).
          4.  The "One Thing" not to slide past (why disunity only surfaces under engineered conditions).
          5.  Closing check (one discriminating question).
          6.  What to decline outright (topics to rule out).

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is between *behavioral dissociation* (one hand does X, mouth says Y) and *phenomenal unity* (what it is like to be the patient).
      *   Camp 1 (Two Subjects) infers phenomenology directly from behavioral dissociation.
      *   Camp 2 (Artefact) infers normal phenomenology from everyday ordinary behavior.
      *   The "Skipped Step": Both camps assume they know how to map *functional independence* to *subjective unity*. The missing link is the criterion for *what counts as a single subject of experience* in the first place. Is it integration of information? Is it narrative unity? Is something else required?
      *   The "Engineered Conditions" problem: If the brain is disunified, why does it look unified in daily life? If it's unified, why does it look disunified in the lab?

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Order of Components (Dependency Structure):**
          *   Need to start with the physical setup (commissurotomy).
          *   Then the behavioral data (dissociation).
          *   *Crucial Pivot:* The inference from behavior to experience. This is where the "skipped step" lies.
          *   Then the "Everyday vs. Lab" problem.
          *   Finally, the metaphysical implication (without solving the "how many persons" question).
          *   *Constraint Check:* Must explicitly mark the crossing from processing to experience.

      *   **2. The Carrying Case:**
          *   *Candidate:* The standard tachistoscopic key/ring or tool/object task. Left hand picks key, mouth says "I saw nothing" or "I saw a ring."
          *   *Is it a trap?* It's the standard, but it risks reinforcing the "silent hemisphere = no experience" fallacy. However, replacing it is hard without video.
          *   *Decision:* Use the standard case but *modify how it's drawn*. Don't just draw the input/output. Draw the *access*.
          *   *Features needed:* Lateralized input (visual field), lateralized output (hand vs. speech), and the *barrier* between them.
          *   *Features to lack:* Emotional content (distracts), complex sequences (hard to draw).
          *   *Why not anecdotes?* Anecdotes (hands fighting) suggest conflict, which implies two agents. Lab cases suggest isolation, which implies missing access. We need isolation to test unity, not conflict.
          *   *Refinement:* The "Key vs. Ring" is good. Left visual field -> Right Hemisphere -> Left Hand picks Key. Mouth (Left Hemisphere) says "Ring" (or "Nothing").
          *   *Wait, the prompt asks if it's a trap.* It *is* a trap if used to prove two subjects immediately. It's safe if used to prove *informational encapsulation*. I need to argue it's the right carrier *provided* we don't interpret the silence as non-existence.
          *   *Actually, looking closer:* The prompt asks to evaluate if it's the right carrier or a trap. The standard case relies on the assumption that speech = report of experience. If the RH has experience but no speech, the standard case hides it. I should argue it's the *only* viable option for a whiteboard session but requires specific framing to avoid the "speech = consciousness" trap.
          *   *Better approach:* Stick with the Key/Ring but explicitly mark the "Speech Center" as just an output channel, not the seat of experience.

      *   **3. Misconception Map:**
          *   *Error 1:* No speech = no experience. (Head off early when discussing RH).
          *   *Error 2:* Corpus Callosum = the "Self". (Head off when discussing everyday unity).
          *   *Error 3:* Compensation explains ordinary behavior. (Head off when discussing the "Artefact" camp).
          *   *Error 4:* Confabulation = Lying. (Head off when discussing LH reports).
          *   *Timing:* Need to slot these into the sequence from Part 1.

      *   **4. The One Thing (Engineered Conditions):**
          *   Why does disunity only show up in the lab?
          *   *Formulation:* "The lab isolates the hemispheres; the world couples them."
          *   *Explanation:* In the lab, we force input to one side and demand output from the other. In the world, input is bilateral (both eyes see, both ears hear) and output is shared (walking, talking involves both).
          *   *Honesty:* This doesn't prove unity (Camp 2) or disunity (Camp 1). It proves *conditional accessibility*.

      *   **5. Closing Check:**
          *   Need a question that separates "picking a side" from "understanding the problem."
          *   *Bad answer:* "There are two people." or "It's just one person."
          *   *Good answer:* "It depends on what criterion of unity we apply (functional vs. phenomenal)." Or "The data underdetermines the metaphysics."
          *   *Specific Question:* "If the patient reports a unified experience in daily life, but fails to integrate information in the lab, what exactly is broken: the consciousness or the access?"

      *   **6. What to Decline:**
          *   The "How many persons?" question (as requested).
          *   Detailed neuroanatomy beyond the callosum.
          *   Ethical implications (distracts from metaphysics).
          *   Specific surgeon histories (Gazzaniga/Sperry specifics).

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Tone:* Needs to be authoritative, structured, and philosophical. Not a teaching guide, but a structural blueprint.
      *   *Constraint Check:* 50 minutes is tight. The plan must be economical.
      *   *The "Skipped Step":* I need to make sure this is the highlight. The skipped step is the *criterion for subjecthood*. Camp 1 assumes functional separation = subject separation. Camp 2 assumes behavioral integration = subject integration. Both assume the criterion without arguing for it.
      *   *The Carrying Case:* I will advise using the Key/Ring but warn against drawing the "mind" inside the hemisphere. Draw the hemisphere as a processor, not a homunculus.
      *   *The "One Thing":* The formulation needs to be punchy. "Ecological validity vs. Experimental isolation." No, that's too psych-speak. "Natural coupling vs. Artificial decoupling."

  5.  **Final Review against Constraints:**
      *   No slides/video? Yes, plan relies on board.
      *   Address polarized camps? Yes, the goal is to undermine the *basis* of both.
      *   Dependency structure explicit? Yes.
      *   Misconception map included? Yes.
      *   Closing check included? Yes.
      *   Declinations listed? Yes.

  6.  **Writing the Response:** (Proceeding to generate the output based on these thoughts.)
      *   *Focus:* Keep it dense and precise. The user is a philosopher/teacher, not a novice. Use technical terms correctly (commissurotomy, lateralization, phenomenal unity).
      *   *Structure:* Follow the 6 numbered points exactly.

      *(Self-Correction on Point 2)*: The prompt asks if the standard stimulus is a trap. I should be nuanced. It *is* a trap if it leads to "Silent Hemisphere = Unconscious." But it's the only one that fits on a whiteboard. I will argue it is the right carrier *only if* annotated to distinguish *access* from *existence*.
      *(Self-Correction on Point 4)*: The formulation must not concede to Camp 2 (that it's just an artefact). It must acknowledge the disunity is real *in that context* without generalizing it to *all* contexts.

      *(Refining the "Skipped Step")*: The skipped step is the move from "Information is not shared" to "Experience is not shared." This is the "Access vs. Phenomenology" distinction.

      *(Refining the Closing Check)*: The question should force them to articulate the *criterion* they are using, not the *conclusion* they prefer.

      *(Refining Declinations)*: Explicitly mention the "Personhood" debate as requested, but also add "Neuroplasticity" (too complex for 50 mins) and "Animal Studies" (distracting).

      *Let's assemble.*
answer: |-
  Here is the plan for the session, structured to meet your constraints and objectives.

  ### 1. Order of Components and Dependency Structure

  The session must proceed in four distinct phases. You cannot move to a later phase until the claim of the previous phase is secured on the board.

  *   **Phase 1: The Anatomical Constraint (5 mins)**
      *   **Claim:** The corpus callosum is the primary highway for information transfer between hemispheres; cutting it creates informational encapsulation.
      *   **Dependency:** This must be established before any behavioral data is discussed. Without this, the dissociations look like magic or pathology rather than structural isolation.
      *   **Board State:** A simple diagram of two hemispheres with the bridge erased.

  *   **Phase 2: The Behavioral Dissociation (15 mins)**
      *   **Claim:** Under specific conditions, the left hand (Right Hemisphere/RH) can act correctly on information the mouth (Left Hemisphere/LH) explicitly denies having.
      *   **Dependency:** This relies on Phase 1. It establishes *functional* independence.
      *   **Crucial Boundary:** **Do not cross into experience yet.** Stop at "The LH does not have access to the RH's data."
      *   **Why:** If you imply experience here, you validate Camp 1 prematurely. If you deny it, you validate Camp 2.

  *   **Phase 3: The Inferential Gap (The Skipped Step) (15 mins)**
      *   **Claim:** Functional independence does not logically entail phenomenal disunity, nor does behavioral integration entail phenomenal unity.
      *   **Dependency:** This relies on Phase 2. You must show that both camps make an unargued jump from *access* to *existence*.
      *   **The Crossing Point:** This is the only legitimate point to discuss consciousness. The condition for crossing is the explicit distinction between **Access Consciousness** (availability for report/action) and **Phenomenal Consciousness** (what it is like).
      *   **Why:** This is the objective of the session. Both camps assume Access = Phenomenal. You must break this equation.

  *   **Phase 4: The Ecological Context (15 mins)**
      *   **Claim:** The "ordinary" unity of daily life is not a deception (Camp 2) nor a suppression of a second self (Camp 1), but a result of natural bilateral stimulation that bypasses the need for the callosum.
      *   **Dependency:** Relies on Phase 3. Once we stop equating report with experience, we can explain why the patient seems normal without denying the lab results.

  ### 2. The Carrying Case

  **The Scenario:** The "Key and Ring" Tachistoscopic Task.
  *   **Draw:** A patient facing a screen. A flash appears in the *Left Visual Field* (projects to RH).
  *   **Action:** The *Left Hand* (RH) reaches into a bag and pulls out a **Key**.
  *   **Report:** The *Mouth* (LH) says, "I saw a **Ring**" (or "I saw nothing").
  *   **Evaluation:** This is the **right carrier**, but it is a **trap** if drawn carelessly.

  **Features it must have:**
  1.  **Lateralized Input:** Strictly one visual field to guarantee initial RH exclusivity.
  2.  **Divergent Output:** One motor channel for the RH (hand), one for the LH (speech).
  3.  **Neutral Stimuli:** Objects without strong emotional valence (keys/rings/tools). Emotion recruits subcortical structures that might bypass the callosum, muddying the anatomical lesson.

  **Features it must lack:**
  1.  **Homunculi:** Do not draw little faces inside the hemispheres. Draw them as processing nodes.
  2.  **Conflict:** Do not draw the hands fighting. This suggests active antagonism (two agents) rather than isolation (one agent with fragmented access).

  **Why the standard case is a trap:**
  It tempts students to equate the *silence* of the LH regarding the key with the *non-existence* of the RH's experience.
  **How to disarm it:** When drawing the RH, label it "Non-Verbal Processor," *not* "Unconscious Zone." When drawing the LH, label it "Verbal Output," *not* "The Self."
  **What you lose by avoiding anecdotes:** You lose the intuitive pull of Camp 1 (the "alien hand" feels like a second person). You must compensate for this by emphasizing that isolation is not antagonism. The lab case is superior because it isolates *information*, whereas anecdotes isolate *will*, which introduces moral agency prematurely.

  ### 3. Misconception Map

  | Misconception | When it arises | The Interdiction (Say this) |
  | :--- | :--- | :--- |
  | **"No Speech = No Experience"** | Phase 2 (Behavioral Dissociation) | "The Right Hemisphere cannot speak, but it can solve puzzles. Do not confuse the inability to *report* a state with the absence of the *state*." |
  | **"The Callosum is the Seat of Unity"** | Phase 4 (Ecological Context) | "The corpus callosum is a cable, not a soul. If unity were merely cable-dependent, cutting it should cause chaos in daily life. It does not. Why?" |
  | **"Ordinary Behavior is Compensation"** | Phase 4 (Ecological Context) | "Compensation implies effortful workarounds. These patients are not 'managing' a disability in the wild; they are functionally seamless. Do not explain away the data to save a theory." |
  | **"Confabulation is Lying"** | Phase 2/3 (The Inferential Gap) | "When the LH says 'I saw a ring,' it is not lying. It is constructing the best narrative from the data it *can* access. Treat it as a sincere error, not a deception." |

  ### 4. The One Thing: Engineered Conditions

  You must not slide past why the disunity is latent. If you do, Camp 2 wins by default (it's just a lab artefact).

  **The Formulation:**
  > "The laboratory *decouples* the hemispheres by forcing input to one side and demanding output from the other. The world *couples* them by providing bilateral input and allowing shared output. The disunity is real, but it is conditional on isolation."

  **Why this is the honest formulation:**
  1.  **It does not concede to Camp 2:** It admits the disunity is *real* under isolation, not an artefact of measurement error. The dissociation is genuine.
  2.  **It does not overclaim for Camp 1:** It does not assert that the patient is *always* two subjects. It asserts they are functionally partitioned *when partitioned*.
  3.  **The Explanation:** In daily life, both eyes see the object, both ears hear the sound, and the speech centers receive feedback from both hands via proprioception and audition. The environment does the integration the callosum usually does. The lab strips the environment away to test the hardware.

  ### 5. Closing Check

  **The Question:**
  "If the patient lives a unified life in the world, but demonstrates fragmented access in the lab, is the *consciousness* fragmented, or is the *access to consciousness* fragmented?"

  **Diagnostic Answers:**
  *   **Bad Answer (Camp 1):** "Consciousness is fragmented, so there are two people." (Ignores the everyday unity).
  *   **Bad Answer (Camp 2):** "Access is fragmented, but consciousness is one." (Dismisses the lab data as irrelevant to the mind).
  *   **Good Answer:** "The data underdetermines the answer. If we define a subject by *informational access*, there are two. If we define a subject by *phenomenal field*, there may be one. The experiment forces us to choose our criterion for 'self', not reveals the self directly."

  ### 6. What to Decline Outright

  Announce these as excluded at the start of the session to prevent derailment:

  1.  **The Personhood Question:** "We will not answer 'How many persons are in this room?' That is a metaphysical verdict that requires premises we do not have. We are analyzing the *evidence for unity*, not the *rights of subjects*."
  2.  **Neuroplasticity and Recovery:** "We are discussing the immediate post-commissurotomy logic. Do not argue that the brain 'rewires' itself later. That changes the variables."
  3.  **The Nature of Confabulation:** "We will not diagnose the LH's narrative mechanism. Whether it is a 'interpreter module' or a general feature of language is a psychological detail, not a metaphysical one."
  4.  **Ethical Implications:** "We will not discuss consent or surgical ethics. That is a separate module."

  **Instruction for Delivery:**
  Write the "Access vs. Phenomenal" distinction on the board in minute 20 and leave it there. If a student argues for Camp 1 or Camp 2, point to the board and ask: "Which of these two words are you using?" This forces them to confront the skipped step.
