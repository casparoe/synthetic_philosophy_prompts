      *   *Claim 7 (Prediction Failure):* This is the strongest point. Orthodox Second International Marxism expected revolution in advanced economies. Lenin/Trotsky had to theorize why it happened in Russia ("weakest link"). Mao adapted it to peasantry. So, the *strict* prediction failed, but the theory evolved to explain why.

