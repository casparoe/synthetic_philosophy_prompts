  3.  **Evaluate Each Claim (Mental Sandbox & Fact-Checking):**

      *   *Claim 1 (Base/Superstructure):* This is the classic metaphor from the 1859 *Preface*. It *is* Marx, but it's often read more rigidly by later Marxists (especially Soviet Diamat) than Marx intended. Marx saw a relationship, not necessarily a mechanical separation.
      *   *Claim 2 (Determinism):* "Social existence determines consciousness" is a real quote (*Preface*). However, Marx also wrote about human agency (*Theses on Feuerbach*: "circumstances are changed by men"). It's a dialectical relationship, not one-way causality in the crude sense.
      *   *Claim 3 (Hand Mill/Steam Mill):* Quote is from *The Poverty of Philosophy* (1847). It *is* early Marx. It is polemical. It is often cited as if it's his mature theory. It's a simplification even for 1847.
