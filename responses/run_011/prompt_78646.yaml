      *   *Claim 5 (Engels/Marx Biography):* This is a genetic fallacy. Whether Marx was funded by a capitalist doesn't invalidate the logic of the argument. Also, Marx *did* work (journalism), though poorly paid. Engels worked in the factory. The point about "ideas reflecting class position" is actually consistent with Marx's theory (he would agree his ideas reflect his social existence), but that doesn't make them *false*.
