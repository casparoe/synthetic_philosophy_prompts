          1.  The asymmetry in how the two ratios (population vs. subsistence) are established (empirical vs. hypothetical) and the function of the "hedges."
          2.  The logical status of the "unchecked" population claim given the admission that it's never truly been unchecked.
          3.  The strategic function of the "far beyond the truth" concession regarding subsistence and the consequences if Malthus is empirically wrong about agricultural growth.
