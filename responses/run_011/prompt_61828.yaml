      *   Pareto Principle: If everyone prefers $a$ to $b$, society prefers $a$ to $b$.
      *   The Cycle: $x \succ y$ (A's right), $y \succ z$ (Pareto), $z \succ w$ (B's right), $w \succ x$ (Pareto). Result: $x \succ y \succ z \succ w \succ x$.
      *   *The Problem:* Usually, the Pareto steps involve "meddlesome" preferences. E.g., A prefers B to read a book, B prefers A not to. The request specifically bans this. The preferences driving the Pareto steps must be self-regarding *but* linked via the social states.

