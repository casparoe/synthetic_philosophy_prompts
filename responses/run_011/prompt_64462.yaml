answer: |-
  ### ROUGH WORK / SCRATCHPAD

  **Candidate Principles:**
  1.  **Strict Comparability:** If one isn't better, they are equal. (Discard immediately. Fails Case 1 & 3. The "Small Improvement" argument kills this. If they were equal, the stipend/dishwasher would tip the scale.)
  2.  **Incommensurability (Raz):** No common metric. (Fits 1, 3, 6. Struggles with 5—why does incommensurability vanish after the wedding? Incommensurability is usually a fact about the options, not the timeline.)
  3.  **Parity (Chang):** A fourth relation. Neither better, nor worse, nor equal. (Fits 1, 3, 5 initially. Doesn't explain the *feeling* difference between 1 and 5.)
  4.  **Volitional Creation (Existentialist/Williams):** Reasons run out, will creates the reason. (Fits 5 perfectly. Fits 6. Makes 1 & 3 look like failed volition if they remain hard.)
  5.  **Phenomenological Intensity:** Hardness = Anguish. (Fails Case 2. User says agony there is fear, not hardness. Also fails Case 4. Awful ≠ Hard.)

  **The Case 5 Problem:**
  User wants to say 5 *wasn't* hard because the hardness evaporated.
  *Philosophical objection:* This confuses the *choice situation* with the *resolution mechanism*. If the options were truly on a par (no fact of the matter), the choice *was* hard structurally. The fact that the agent successfully committed (no leak) means they have strong *volitional capacity*, not that the choice was easy.
  *Verdict:* I have to tell the user their verdict on 5 is suspect. It was hard, they just handled it well.

  **The Case 6 Problem:**
  User says "No leak = Not hard." But admits "Hardest week of my life."
  *Philosophical objection:* Contradiction. Leak is a symptom of *regret* or *unresolved parity*, not hardness itself. You can have a hard choice (parity) and resolve it cleanly (will).
  *Verdict:* The "Leak" jargon is downstream. It measures *residue*, not *difficulty*.

  **The Case 4 Problem:**
  Kid vs. Strangers. User says "Not hard."
  *Philosophical objection:* Only holds if you accept agent-relative permissions (it's okay to favor your own). If you're a strict utilitarian, this is a math problem (2 > 1) or a horrific hard choice. I will assume the user's non-consequentialist intuition is the data point here.

  **Conclusion for Tidy Version:**
  There is no single principle that saves all six verdicts *and* uses "Leak" as a definition. I need to separate **Ontological Hardness** (the relation between options) from **Psychological Hardness** (the experience of the agent).
  *   Ontological Hardness = Parity/Incommensurability.
  *   Psychological Hardness = Conflict + Uncertainty.
  *   Leak = Failure of Volitional Resolution.

  I will likely have to tell the user to drop the idea that 5 wasn't hard. It was hard; it was just *resolved*.

  ---

  ### THE TIDY VERSION

  You want a single principle. You aren't going to get one that preserves all your verdicts without doing violence to the concepts. Your data set contains a category error. You are conflating the *structure of the options* with the *psychology of the agent*.

  Here is the distinction you need, stated precisely:

  **The Principle of Volitional Parity:**
  A choice is **Hard** (ontologically) if and only if the options stand in a relation of *parity* (neither better, nor worse, nor equal, but comparable in the same neighborhood of value).
  A choice **Feels Hard** (phenomenologically) if and only if the agent lacks a *volitional reason* to break the parity.
  **Leak** occurs if and only if the parity is not successfully converted into a volitional reason post-choice.

  This separates the state of the world from the state of your nervous system. Now, let's run your cases through this machinery.

  **Analysis of Your Six Cases:**

  1.  **Grad Programs:** Parity exists. Sweetening fails (Small Improvement Argument holds). No volitional reason present yet. **Verdict: Hard.** (Matches yours).
  2.  **Apartments (Price):** No parity. One is strictly better (Pareto dominance). Agony is risk-aversion, not hardness. **Verdict: Not Hard.** (Matches yours).
  3.  **Apartments (Light/Commute):** Parity exists. Sweetening fails. **Verdict: Hard.** (Matches yours).
  4.  **Kid vs. Strangers:** No parity. Deontic constraint/Agent-relative permission creates a strict duty. **Verdict: Not Hard.** (Matches yours).
  5.  **Marry A or B:** Parity exists initially. **Verdict: Hard.** (Contradicts yours). The evaporation of hardness is evidence of successful *volitional creation*, not evidence that the choice wasn't hard. You are mistaking the *cure* for the absence of the *disease*.
  6.  **Job vs. Person:** Parity exists. **Verdict: Hard.** (Matches yours). No leak indicates successful volitional creation. Your rule ("No leak = Not hard") is false. Leak measures *residue*, not *difficulty*.

  **Evaluation of Your Jargon:**

  *   **Leak:** This is not a marker of hardness. It is a marker of *unresolved parity*. You can have a hard choice (Case 6) with zero leak if your will is strong enough to create a reason where none existed. If you keep Leak as a definition of hardness, Case 6 breaks the theory. If you keep Case 6 as Hard, Leak must be demoted to a symptom.
  *   **The Coin-Flip Test:** This is theatre, as you suspected. Relief indicates that the agent *wanted* a tie-breaker, not that the options were commensurable. If you flip and feel relief, it means you were suffering from *decision fatigue*, not necessarily ontological hardness.
  *   **Retroactive Reordering:** This is self-narration. It is compatible with Parity. You can say "Obviously that one was better" because your choice *made* it better (by aligning it with your new commitments). It doesn't prove the options were ranked beforehand.

  **Standard Machinery Audit:**

  *   **Raz (Incommensurability/Small Improvement):**
      *   *Handles:* 1, 3, 6 cleanly. The stipend/dishwasher failing to tip the scale is the classic test.
      *   *Breaks:* 5. Raz's view suggests the incommensurability is a permanent fact about the options. It struggles to explain why the hardness vanishes post-wedding without calling it self-deception.
  *   **Chang (Parity):**
      *   *Handles:* 1, 3, 5. Her "fourth relation" captures the "neither better nor equal" intuition perfectly.
      *   *Breaks:* 6. Chang focuses on the normative relation. She doesn't fully account for the *phenomenological variance* (why 6 felt hard but left no leak, while 5 felt hard then vanished).
  *   **Berlin (Value Pluralism):**
      *   *Handles:* 1, 3, 5. Explains *why* there is parity (conflicting ultimate values).
      *   *Breaks:* 2, 4. Doesn't distinguish between "hard" and "close" or "hard" and "awful." Too blunt an instrument.
  *   **L.A. Paul (Transformative Experience):**
      *   *Handles:* 5, 6. Explains why you can't know the value beforehand (you can't know what it's like to be a spouse/expat).
      *   *Breaks:* 1, 3. Grad school and apartments are not necessarily transformative in the metaphysical sense. You can know the value of the commute without becoming a new person.

  **The Distinction You Need (1 vs 5 vs 6):**
  You asked for a distinction that separates 1 from 5 without separating 1 from 6.
  *   **1 (Grad School):** Parity + **Passive Agent**. You wait for a reason. None comes. Hardness persists.
  *   **6 (Job/Person):** Parity + **Active Agent (High Cost)**. You create a reason through sacrifice. Hardness is felt intensely during the act of will, then resolves. No leak because the will was decisive.
  *   **5 (Marriage):** Parity + **Active Agent (Low Cost/High Integration)**. You create a reason through commitment. The integration is so total the parity is obscured retrospectively.

  The distinction is **Volitional Capacity vs. Normative Structure**. 1, 5, and 6 are all structurally Hard (Parity). 1 remains phenomenologically hard because the agent fails to commit. 5 and 6 become phenomenologically easy because the agent succeeds.

  **Application to New Cases:**

  1.  **Concert Pianist (Performing vs. Teaching):**
      *   *Analysis:* Parity. Different goods (excellence/audience vs. mentorship/stability). Sweetening (more money for teaching) likely won't tip if the core values clash.
      *   *Verdict:* **Hard.**
      *   *Leak Prediction:* High risk of leak (buying concert tickets, criticizing students) unless the agent reframes the identity ("I am a teacher-musician").
  2.  **Personality-Changing Treatment:**
      *   *Analysis:* This is **Transformative** (Paul), not just Parity. You cannot compare the values because the valuer changes.
      *   *Verdict:* **Hard (Radical).** Distinct from 1-6. It's not that reasons run out; it's that the *reason-giver* is replaced.
      *   *Leak Prediction:* Impossible to leak toward the "forgone self" because you can no longer access their values. Regret will be alien, not compensatory.
  3.  **Parent with One School Place (Two Children):**
      *   *Analysis:* Not Parity. This is **Tragic Remainder** (Williams). The values are commensurable (both children's welfare), but the constraint makes satisfaction impossible.
      *   *Verdict:* **Awful, Not Hard** (Structurally). There is a fact of the matter (flip a coin, draw straws), but no *moral* fact favoring one child.
      *   *Leak Prediction:* Massive leak. Guilt is the leak here. Not toward the option, but toward the agent's own moral integrity.

  **The Cost:**

  You asked me to be honest about what breaks.

  1.  **Your Verdict on Case 5 Must Go.** You want to say it *wasn't* hard because the hardness evaporated. The philosophy says it *was* hard, you just resolved it. If you keep your verdict, you lose the ability to distinguish between "easy choices" and "hard choices well-handled." For a novel, the latter is more interesting. Keep the verdict, and you lose the structural explanation for why marriage is significant.
  2.  **Your Definition of "Leak" Must Go.** You cannot define hardness by post-choice behavior. Case 6 proves you can have a hard choice with no leak. Leak is a measure of *ambivalence*, not *incommensurability*.
  3.  **The "One Principle" Dream Must Go.** You need a disjunction: **Structural Hardness** (Parity/Incommensurability) AND **Volitional Hardness** (Conflict of Will).
      *   Case 1 has both.
      *   Case 5 has Structural, lacks Volitional (eventually).
      *   Case 6 has Structural, lacks Volitional (eventually), but high Phenomenological cost.

  **What the Novel Loses:**
  If you accept this, you lose the idea that "hardness" is a mysterious fog that either lifts or doesn't. Instead, hardness is a structural feature of the world (the options don't rank) that the character must *force* into resolution.
  The seam is between **The World** (which offers no answer) and **The Will** (which must provide one).
  If you can't name this distinction, your protagonist remains a passive victim of circumstance. If you name it, she becomes an agent who creates value through choice. That is a better book, but it requires you to admit that Case 5 *was* hard, and that her lack of regret is a testament to her will, not the ease of the choice.

  Drop the "Leak = Hardness" rule. It is the weakest link. Keep Case 6 as the paradigm of Hardness without Leak. It is the only one that preserves the dignity of the choice.
