answer: |-
  You have identified a genuine and frustrating epistemological knot. It is not just you; this is a well-known problem in econometrics, evaluation science, and criminology, but it suffers from having different names in different rooms.

  To answer your specific question: **Yes, there is an established term for the shape of the stalemate, and a separate term for the mechanism causing it.**

  The logical shape of the stalemate is called **Observational Equivalence**.
  The mechanism causing it is called **Measurement Endogeneity** (or Policy-Induced Measurement Bias).

  Here is the breakdown of the concepts, how they differ from the ones you already know, and why this is one phenomenon rather than three.

  ### 1. The Best Fit: Observational Equivalence
  In statistics and social science, **Observational Equivalence** occurs when two or more competing theories or models predict the exact same observable data.

  *   **The Shape:** Theory A says "The law reduced the activity." Theory B says "The law reduced the *reporting* of the activity." Both theories predict the exact same drop in the official numbers.
  *   **The Stalemate:** Because the data looks identical under both theories, the data alone cannot decide the winner. You are stuck in a state of observational equivalence.
  *   **Why it fits:** It captures your description perfectly: "Same figure, opposite conclusions, both plausible." It explains why the argument loops forever; you are trying to use the data to distinguish between two models that the data cannot distinguish.

  ### 2. The Mechanism: Measurement Endogeneity
  If Observational Equivalence is the *shape* of the trap, **Measurement Endogeneity** is the *wall* that builds it.

  In a standard experiment, the "treatment" (the law) is supposed to affect the "outcome" (the crime rate), and the "measurement" (the stats) is supposed to be a neutral ruler.
  In your scenario, the treatment (the law) changes the *properties of the ruler itself*.
  *   **Exogenous Measurement:** The policy changes the reality, but the ability to measure reality stays the same.
  *   **Endogenous Measurement:** The policy changes the reality *and* the ability to measure it simultaneously.

  Because the policy determines the visibility of the outcome, the measurement is "endogenous" (internal) to the system rather than "exogenous" (external). This is why you cannot get a clean read.

  ### 3. Is it one phenomenon or three in a trenchcoat?
  It is **one phenomenon** wearing different disciplinary uniforms.

  1.  **In Criminology:** It is the problem of **The Dark Figure**. This names the *hidden stuff*, but not the argument about it.
  2.  **In Economics:** It is **Endogeneity**. This names the *causal flaw*.
  3.  **In Logic/Stats:** It is **Observational Equivalence**. This names the *resulting stalemate*.

  You haven't found a single term because scholars usually specialize in one of those three angles. A criminologist talks about the "Dark Figure," an econometrician talks about "Identification Failure," and a philosopher talks about "Underdetermination." They are describing the same elephant.

  ### 4. How it differs from the concepts you know

  **Vs. Goodhart's Law**
  *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure."
  *   *The Difference:* Goodhart's Law implies **gaming**. It suggests agents are actively manipulating the number to hit a target (e.g., a teacher teaching to the test to boost scores).
  *   *Your Scenario:* This is not necessarily gaming. Sex workers aren't necessarily "manipulating" the stats; the law simply changes the *physics of visibility*. Goodhart's is about corruption of the metric; your scenario is about the **obscuration** of the metric.

  **Vs. The Dark Figure of Crime**
  *   *The Dark Figure:* This is the noun. It is the unreported crime itself.
  *   *Your Scenario:* You are describing the *argumentative dynamic* that arises because of the Dark Figure. Knowing the Dark Figure exists doesn't solve the stalemate; your scenario explains why the Dark Figure makes the stalemate unresolvable.

  **Vs. Unfalsifiability**
  *   *Unfalsifiability:* This implies the *theory* is broken (e.g., "invisible dragons exist but can't be detected").
  *   *Your Scenario:* The theories are falsifiable in principle, but the *data* is compromised. It is not that the claim explains away everything; it is that the **ruler shrinks when you use it.**

  ### 5. What is definitely NOT this? (The Counter-Example)
  To confirm you have the right concept, you need a case where the policy *does not* alter the measurability of the outcome. This is called **Exogenous Measurement**.

  **Case:** A government introduces a new vaccine.
  **Policy:** Mandatory vaccination.
  **Metric:** Blood antibody levels in a randomized, blind population sample.

  **Why it's not the same:**
  If antibody levels go up, it is very hard to argue that "The law didn't increase immunity, it just made people more willing to get their blood drawn."
  *   The biological marker (antibodies) is independent of the legal incentive.
  *   The measurement process (blood test) is not altered by the law's status.
  *   There is no "Dark Figure" of antibodies hiding because of the law.

  In this case, you do **not** have Observational Equivalence. The data can actually distinguish between "The policy worked" and "The policy failed."

  ### Summary
  If you need to name this in a conversation, the most precise phrase is **"Measurement Endogeneity leading to Observational Equivalence."**

  If you want a punchier, descriptive label that isn't strictly jargon, you might call it **"The Visibility Trap"** or **"The Reflexive Metric Problem."** But academically, you are describing a situation where the **intervention invalidates the indicator**, creating **observational equivalence** between success and displacement.

  You aren't missing a term; you've just found the boundary where social science stops being a measurement of reality and starts being a negotiation about what counts as reality.
