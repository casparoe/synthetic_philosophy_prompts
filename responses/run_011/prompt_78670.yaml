answer: |-
  **Working**

  Three cruxes suggest themselves. First, the standard defence against the pessimistic meta-induction, arguing that structure survives where ontology fails. This is too familiar; candidates could recite Worrall without engaging the logic. Second, the epistemic versus ontic distinction, asking whether structure is all we know or all there is. This often devolves into taxonomy rather than argument. I have settled on Newman's Problem—the tension between structural content and triviality. It forces candidates to confront the logical cost of structural commitment. If structure is merely pattern, any collection of objects fits it given the right relation. To defend structural realism, one must explain why some relations count and others do not, without smuggling in the very ontology one claims to bypass. This toy case isolates that logical pressure point without requiring historical knowledge, ensuring the exam tests philosophical reasoning rather than memorisation of case studies like Fresnel or Bohr.

  ***

  **Final Examination: Realism and Theory Change**
  **Time Allowed: 45 minutes**
  **Total Marks: 25**

  **Question 1**

  Consider two theories, T₁ and T₂. T₁ posits three entities, *a*, *b*, and *c*, and a single binary relation *R*. T₁ asserts *R(a,b)*, *R(b,c)*, and the negation of *R(a,c)*. In T₁, *R* is read as 'transmits the disturbance to', and *a*, *b*, *c* are three subtle fluids. T₂ posits three entities, *x*, *y*, and *z*, and a single binary relation *S*. T₂ asserts *S(y,z)*, *S(z,x)*, and the negation of *S(y,x)*. In T₂, *S* is read as 'settles the state of', and *x*, *y*, *z* are three regions of a field.

  (a) Confirm that the relabelling *a*↦*y*, *b*↦*z*, *c*↦*x* demonstrates that T₂ is an isomorphic image of T₁. Briefly comment on the ontological disparity despite this structural identity. (5 marks)

  (b) A structural realist claims that what survives theory change is the structure, represented by existentially quantifying over the relations (a Ramsey sentence). Show why, for this three-element case, this move renders the structural claim trivial. What specific residue of content survives this quantification? (10 marks)

  (c) Evaluate two possible replies available to the structural realist. First, does restricting attention to 'natural' or 'fundamental' relations escape the triviality? Second, does the ontic structural realist claim—that objects are no part of the furniture—rescue the position or surrender it in this particular case? (10 marks)

  ***

  **Model Answer**

  (a) The mapping *a*↦*y*, *b*↦*z*, *c*↦*x* preserves the relational pattern exactly. *R(a,b)* corresponds to *S(y,z)*, which T₂ asserts. *R(b,c)* corresponds to *S(z,x)*, which T₂ asserts. The negation *~R(a,c)* corresponds to *~S(y,x)*, which T₂ also asserts. Thus, the structures are mathematically identical. However, the ontologies are incommensurable: T₁ describes fluids transmitting disturbances, while T₂ describes field regions settling states. The structural realist argues the mathematics captures the reality, while the physical nature of the relata is disposable.

  (b) If we formulate the structural claim as a Ramsey sentence—'There exists a relation *O* such that *O(a,b)*, *O(b,c)*, and *~O(a,c)*'—we strip away the specific physical meaning of *R*. Newman's Problem demonstrates that for any collection of three entities, one can mathematically define a relation that fits this pattern. Provided the domain has the correct cardinality (three objects), the structural claim is automatically satisfied by constructing a relation extensionally. Consequently, the claim becomes trivially true of any three things. The only genuine content surviving this quantification is the cardinality claim: that there are exactly three entities. All specific information about how they interact is lost unless the relation is fixed independently of the structure.

  (c) To escape triviality, the realist might restrict admissible relations to 'natural' ones, excluding gerrymandered mathematical constructions. However, this risks begging the question: if we require epistemic access to which relations are natural, we exceed the structuralist's modest epistemic commitments. If naturalness is purely metaphysical, it is unclear how science identifies them without relying on the very ontology bracketed out. Alternatively, the ontic structural realist might argue objects are eliminable; there is only structure. In this toy case, this looks like surrender. If there are no relata, the structure floats free. But structure is essentially relational; it requires terms to relate. Denying the objects leaves the structure unanchored, making it difficult to explain why *this* structure applies to the world rather than *that* one. Thus, without a robust account of modality or natural properties, structural realism collapses into either triviality or an obscure metaphysics that offers no advantage over standard realism. The position requires more than mere isomorphism to sustain realist commitment.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **Part (a): 5 Marks**
  *   3 marks: Correctly verifies the three relational mappings (positive and negative).
  *   2 marks: Clearly notes the ontological difference (fluids vs. fields) despite structural identity.

  **Part (b): 10 Marks**
  *   4 marks: Explains the Ramsey sentence move (existential quantification over relations).
  *   4 marks: Articulates Newman's Problem: any set of cardinality 3 can satisfy the structure via a constructed relation.
  *   2 marks: Identifies the surviving residue: cardinality only (the number of entities).

  **Part (c): 10 Marks**
  *   4 marks: Critically evaluates the 'natural properties' reply (notes the epistemic access problem or question-begging).
  *   4 marks: Critically evaluates the Ontic Structural Realist (OSR) reply (notes the 'relations without relata' problem).
  *   2 marks: Provides a reasoned conclusion on whether these moves rescue or surrender the position.

  **Differentiation: First Class (20–25) vs. Upper Second (15–19)**
  *   **First Class:** Explicitly names Newman's Problem (or clearly reconstructs the logic); recognises that restricting to 'natural' relations requires epistemic access structuralism claims to lack; identifies that OSR risks making structure unanchored without relata.
  *   **Upper Second:** Correctly identifies the triviality issue; discusses natural properties or OSR but treats them more descriptively than critically; may conclude they are successful without noting the costs.

  **Identifiable Errors**

  | Error | Marks Lost | Diagnosis |
  | :--- | :--- | :--- |
  | **Mapping Failure** | 3 | Fails to verify the specific relational correspondences in part (a). |
  | **Ramsey Confusion** | 4 | Claims Ramsey sentences preserve all theoretical content including relation meanings. |
  | **Cardinality Ignore** | 2 | Fails to identify cardinality as the only surviving content in part (b). |
  | **Naturalness Naivety** | 3 | Asserts 'natural properties' solve triviality without addressing epistemic access. |
  | **OSR Misunderstanding** | 3 | Claims OSR denies structure rather than denying objects prior to structure. |
