prompt: |-
  So I've been reading the rationalist blogs for going on fifteen years now — Overcoming Bias back in the day, SSC, the occasional history-of-science thread — and I like to think I've trained myself to flinch whenever somebody reaches for an analogy to end an argument. Last week somebody got me anyway and I genuinely can't tell if I got got or if he's right.

  The setup: a friend of mine who reads way too much legal theory was in a group chat argument about the statues thing, specifically about whether you're allowed to call a 17th-century merchant who invested in slave voyages a bad person. His move was that retrospective moral condemnation is exactly like an ex post facto law — you're convicting someone under a rule that didn't exist when they acted, which is the paradigm case of injustice in basically every legal system worth the name (the US Constitution flatly prohibits them, nullum crimen sine lege, all that). So when people say "well, they should have known better," he says they're demanding something no court would ever grant: notice of the rule before you're held to it. Then he extended it outward to historians — anyone who evaluates the past using today's categories is doing the same thing with extra steps, and the only honest procedure is to judge actors by the standards that were actually available to them, meaning what their own society told them. He seemed pretty pleased with himself and half the chat agreed.

  Here's what I want from you, and you don't need to name-drop sources or give me a reading list, I want the machinery laid out. First, the correspondence table: in his analogy what exactly plays the legislature, the promulgated rule, the defendant, the court, the punishment, and the notice requirement — because I noticed he never says who the moral lawmaker is, and I suspect that's not an accident. Second, the disanalogies, but sorted: which ones actually load-bearing against his conclusion and which are just decoration that a defender could shrug off. Third, three specific pressure points I came up with and can't resolve. (a) Doesn't the analogy only work if moral norms are made and dated by somebody the way statutes are, i.e. doesn't it sneak in a positivist metaethics about morality and then use the legal machinery to make that look neutral? (b) At Nuremberg "that crime hadn't been written down yet" was rejected as a defense — is that a counterexample to him, or does it only work because international law is a weird half-legal thing where the analogy was already straining? (c) Does his slide from "the act was wrong" to "the agent is blameworthy" go through, or has he answered a different question than the one the chat was actually asking — and relatedly, does negligence law's objective reasonable-person standard, which holds people to a bar they personally didn't endorse, undercut the notice point from inside the legal system he's borrowing from? And fourth, his leap from individual moral assessment to historians-in-general: is that even the same claim? My sense is that presentism in historiography is usually about concepts, periodization, what counts as an explanation, and which questions get asked of the sources — not about scolding dead people — so even a perfect analogy would only cover a slice of the target. Finally, if you think the analogy's no good, tell me what a better one would be, ideally one that keeps whatever is right in his intuition, because I do feel there's something to the notice thing that I don't want to just throw away.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time rationalist reader (Overcoming Bias, SSC, etc.), familiar with argumentative pitfalls (especially analogies), skeptical but open-minded. Values precision ("machinery laid out"), structural analysis over citation dumping.
      *   **The Core Conflict:** A friend argues that retrospective moral condemnation is equivalent to *ex post facto* law. Therefore, judging historical figures by modern standards is unjust.
      *   **The Task:**
          1.  Map the analogy (Legislature, Rule, Defendant, Court, Punishment, Notice).
          2.  Identify disanalogies (sort by load-bearing vs. decoration).
          3.  Address three specific pressure points ((a) Metaethics/Positivism, (b) Nuremberg/International Law, (c) Wrongness vs. Blameworthiness & Negligence).
          4.  Evaluate the leap to Historiography (Presentism).
          5.  Provide a better analogy (if the current one fails) that preserves the valid intuition.

  2.  **Deconstruct the Friend's Argument:**
      *   *Premise 1:* Legal systems forbid *ex post facto* laws (punishing acts that weren't crimes when committed).
      *   *Premise 2:* Moral judgment functions like legal judgment.
      *   *Conclusion:* Therefore, morally condemning historical figures for acts that were acceptable in their time is unjust/invalid.
      *   *Extension:* Historians should only judge actors by standards available to them *then*.

  3.  **Step 1: The Correspondence Table (Mapping the Analogy):**
      *   *Legislature:* Who makes moral law? (God? Society? Reason? Time?) This is the weak point.
      *   *Promulgated Rule:* The moral norm (e.g., "Slavery is wrong").
      *   *Defendant:* The historical figure (17th-century merchant).
      *   *Court:* The present-day public/historians making the judgment.
      *   *Punishment:* Social condemnation, reputational damage, statue removal.
      *   *Notice Requirement:* The societal consensus at the time of the act.
      *   *Insight:* The friend leaves "Legislature" vague because defining it exposes the flaw. If morality is discovered (realism) rather than made (positivism), *ex post facto* doesn't apply.

  4.  **Step 2: Disanalogies (Load-bearing vs. Decoration):**
      *   *Decoration:* Statutes are written vs. norms are unwritten. (Morality often is unwritten). Specific penalties vs. social stigma. (Both are punitive).
      *   *Load-bearing:*
          *   *Sovereignty:* Law requires a sovereign enforcer. Morality doesn't.
          *   *Function:* Law coordinates behavior prospectively. Moral judgment often serves expressive/identity functions retrospectively.
          *   *Truth Conditions:* Legal guilt is procedural. Moral wrongness is often treated as truth-apt (independent of procedure).
          *   *The "Notice" Mechanism:* In law, notice is *created* by promulgation. In morality, notice is *perceived* by reason/empathy. If the merchant *could have known* via reason, the notice requirement is met even if society disagreed.

  5.  **Step 3: Addressing Pressure Points:**
      *   *(a) Metaethics/Positivism:* This is the killer. *Ex post facto* only makes sense if laws are *posited* (created at time T). If morality is realist (discovered), then slavery was always wrong; we just realized it later. The friend smuggles in moral positivism/conventionalism without arguing for it.
      *   *(b) Nuremberg:* Crucial counterexample. "Crimes Against Humanity" were not strictly codified in domestic law for many defendants. The tribunal argued some acts are *malum in se* (wrong in themselves), not just *malum prohibitum* (wrong because prohibited). This undermines the "notice must be statutory" claim. It supports the idea that some moral boundaries are implicit.
      *   *(c) Wrongness vs. Blameworthiness & Negligence:*
          *   *Distinction:* An act can be objectively wrong (causes harm) without the agent being fully blameworthy (lacked capacity/knowledge). The friend conflates "Was this bad?" with "Is he a villain?"
          *   *Negligence:* The "Reasonable Person" standard is objective. You are held to a standard you might not personally meet. If a 17th-century merchant *should have known* (by the standard of a reasonable moral agent, not a reasonable 17th-century racist), negligence applies. This uses legal theory *against* him.

  6.  **Step 4: The Historiography Leap:**
      *   The friend moves from "Don't blame the dead" to "Don't use modern categories."
      *   *Analysis:* These are different. Historians use modern concepts (e.g., "economic incentive," "structural racism") to *explain* behavior, not just to *judge* it.
      *   *Presentism:* Avoiding anachronism is good method. Avoiding moral realism is a philosophical stance. The friend conflates methodological caution with moral prohibition.
      *   *Verdict:* The leap fails. You can analyze the past with modern tools without necessarily holding a "trial."

  7.  **Step 5: A Better Analogy:**
      *   Need to keep the "Notice/Fairness" intuition but drop the "Legislative Positivism" error.
      *   *Idea:* Safety Standards / Engineering.
      *   *Scenario:* A bridge built in 1920 collapses in 2020.
      *   *Judgment:* Was the bridge "unsafe"? Yes, by modern standards. Was the engineer "negligent"? Only if they violated standards *of the time* OR if the flaw was obvious to basic physics *even then*.
      *   *Why it works:* Distinguishes between *objective failure* (the bridge broke/slavery harmed people) and *culpable negligence* (did they ignore available evidence?). It allows for retrospective understanding without necessarily demanding retrospective *punishment*, but it doesn't forbid calling the act "bad."
      *   *Alternative:* Medical Malpractice vs. Medical Progress. We judge past treatments as "incorrect" now, even if they were standard then. We don't say "Smallpox inoculation was good then, so it's not 'wrong' now." We say "It was the best they knew, but it was still dangerous."

  8.  **Drafting the Response:**
      *   *Tone:* Analytical, precise, respectful of the user's rationalist background (avoid fluff, focus on structure).
      *   *Structure:* Follow the user's four points + the better analogy.
      *   *Refinement on Point 3c:* Make sure to distinguish *actus reus* (the bad act) from *mens rea* (the guilty mind). The friend argues no *mens rea* implies no *actus reus*. Law says no.
      *   *Refinement on Point 1:* Emphasize the "Legislature" gap. If God/Reason is the legislature, the law existed in 1650, just wasn't enforced.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about Nuremberg? Yes, need to be clear that Nuremberg relied on natural law principles to bypass the *ex post facto* objection.
      *   *Check:* Did I address the historiography slide? Yes, distinguish between *evaluation* and *explanation*.
      *   *Check:* Is the "Better Analogy" actually better? The "Engineering/Safety" one is strong because it separates *objective state of affairs* from *subjective culpability*.

  10. **Final Polish:** Ensure the language matches the user's register (e.g., "load-bearing," "metaethics," "positivist"). (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to make sure I don't just say "he's wrong." I need to show *where* the analogy breaks. The user asked for the machinery. I need to be mechanical.
  Also, the user mentioned "negligence law's objective reasonable-person standard." I need to make sure I explicitly use that to counter the "notice" argument. The "Reasonable Person" knows what they *ought* to know, not just what they *do* know.

  Okay, ready to write.
answer: |-
  This is a classic case of a "sticky" analogy: it feels robust because it imports the procedural fairness of law into the messy domain of morality, but it breaks when you inspect the underlying ontology. Your friend is leveraging the intuitive unfairness of *ex post facto* punishment to shield historical actors from moral realism.

  Here is the machinery laid out, per your request.

  ### 1. The Correspondence Table

  To evaluate the analogy, we must force the mapping. Your friend leaves the "Legislature" vague because defining it collapses the argument.

  | Legal Concept | Friend's Moral Analog | The Structural Gap |
  | :--- | :--- | :--- |
  | **The Legislature** | *Undefined / "Society"* | Law requires a sovereign authority to *make* rules. Morality (on most non-positivist views) is *discovered*, not made. If there is no Legislature, there is no date of enactment. |
  | **Promulgated Rule** | Contemporary Social Norm | Laws must be written/published. Moral norms are often implicit. If the rule is "don't harm innocents," that is promulgated by reason/nature, not statute. |
  | **The Defendant** | The Historical Actor | Fits well. |
  | **The Court** | Present-Day Observers | Fits well. |
  | **The Punishment** | Social Condemnation / Statue Removal | Fits well (stigma is a penalty). |
  | **Notice Requirement** | Consensus at Time of Act | In law, notice is *created* by the state. In morality, notice is *perceived* by the agent. If the agent *could have known* via reason, legal notice is irrelevant. |

  **The Critical Failure:** The analogy assumes **Moral Positivism** (rules are created by social consensus at time *T*) without arguing for it. If morality is **Realist** (rules exist independently of consensus), the "law" against slavery existed in 1650, it just wasn't being enforced. You cannot have an *ex post facto* violation if the law was always in effect, merely unrecognized.

  ### 2. The Disanalogies

  We can sort these by whether they actually defeat the conclusion or are just surface-level differences.

  **Decoration (Defender can shrug these off):**
  *   **Written vs. Unwritten:** Your friend can argue that social norms function *like* written laws for the purpose of notice.
  *   **State Violence vs. Social Stigma:** He can argue that reputational destruction is punitive enough to trigger fairness constraints.
  *   **Procedure:** Courts have due process; Twitter mobs don't. This is a critique of *how* we judge, not *whether* we can judge retrospectively.

  **Load-Bearing (These break the analogy):**
  *   **Coordination vs. Truth:** The primary function of criminal law is *coordination* and *predictability* (know the rule so you can avoid prison). The primary function of moral judgment is often *truth-tracking* and *expressive* (identifying harm and aligning values). *Ex post facto* prohibitions exist to protect reliance interests. If the merchant had no "reliance interest" in doing evil (i.e., he wasn't *owed* the right to enslave), the fairness constraint vanishes.
  *   **Sovereignty:** Law binds because a sovereign says so. Morality binds (arguably) because of the nature of the act. You can't legislate that "murder is legal" and make it so morally. Therefore, the "enactment date" of the moral law is not the date society accepted it.
  *   **The "Void" Problem:** In law, if there is no statute, there is no crime. In morality, if there is no social norm, there can still be a wrong. The analogy assumes a moral vacuum where none exists.

  ### 3. The Pressure Points

  **(a) The Metaethics Sneak**
  You are correct. The analogy only works if moral norms are **positivist** (made by humans at specific times). It smuggles in the premise that "Wrongness = Violation of Local Contemporary Norm."
  *   *Why it matters:* If morality is **realist** (slavery was wrong in 1650 even if 1650 society said otherwise), then judging the merchant is not *ex post facto*. It is applying the standing law that he violated, which he was epistemically capable of accessing. The friend is using legal machinery to solve a metaethical debate he hasn't had.

  **(b) The Nuremberg Counterexample**
  This is a direct hit against him. At Nuremberg, defendants argued *ex post facto* ("Aggressive war wasn't a specific crime in our domestic code"). The tribunal rejected this.
  *   *The Ruling:* They relied on **Natural Law** principles. Some acts are *malum in se* (wrong in themselves) rather than *malum prohibitum* (wrong because prohibited).
  *   *Implication:* If the analogy holds, Nuremberg was unjust. Since most rationalists agree Nuremberg was just, the analogy must fail where it prohibits judging *malum in se* acts retrospectively. It doesn't matter that international law was "weird"; the principle established was that moral notice can be inherent to the act, not just statutory.

  **(c) Wrongness vs. Blameworthiness & Negligence**
  This is the strongest internal legal critique.
  *   **Actus Reus vs. Mens Rea:** The law distinguishes between the *guilty act* and the *guilty mind*. Your friend conflates them. We can say "Slavery was wrong" (Actus Reus) without necessarily saying "This specific merchant is a demon" (Mens Rea).
  *   **The Negligence Standard:** You hit the nail on the head. Tort law uses the **Objective Reasonable Person** standard. If a defendant fails to meet the standard of care a reasonable person *would* have exercised, they are liable, even if *they personally* didn't know better.
  *   *Application:* If a "Reasonable Moral Agent" in 1650 *could have* deduced that slavery was harmful/wrong (via empathy, logic, or existing dissenting voices), the merchant is negligent. The "notice" requirement in negligence is not "what did you know?" but "what *should* you have known?" This uses the friend's own legal framework to undercut his conclusion.

  ### 4. The Historiography Leap

  Your intuition here is correct; the leap is invalid.
  *   **Moral Assessment:** "Was this person bad?" (Evaluative)
  *   **Historical Analysis:** "Why did this happen? What categories explain it?" (Explanatory)
  *   **The Slide:** Your friend moves from "We shouldn't punish the dead" to "We shouldn't use modern concepts."
  *   **Why it fails:** Presentism in historiography is usually a methodological warning against **anachronism** (e.g., calling a 17th-century merchant a "capitalist" might obscure more than it reveals). It is not a moral prohibition. A historian can use modern concepts (e.g., "structural racism") to *explain* the merchant's behavior without holding a *trial*.
  *   **Verdict:** Even if the legal analogy worked for moral condemnation (which it doesn't), it does not extend to conceptual analysis. Judging a past society by modern categories is necessary to understand progress. If we only used categories available to them, we couldn't explain why they were wrong.

  ### 5. A Better Analogy

  The legal analogy fails because it assumes morality is legislated. A better analogy preserves the "Notice/Fairness" intuition without assuming moral positivism.

  **The Engineering / Safety Standard Analogy**

  *   **Setup:** A bridge is built in 1920 using the best standards of the time. In 2024, we discover the design contains a fundamental flaw that causes stress fractures.
  *   **The Judgment:**
      1.  **Objective State:** Is the bridge "unsafe" by our current understanding? **Yes.** (Corresponds to: Slavery was objectively harmful/wrong).
      2.  **Culpability:** Was the 1920 engineer "negligent"? **Only if** the flaw was detectable by the *Reasonable Engineer* of 1920. If the physics were unknown then, they are not blameworthy. If the physics were known and they ignored them, they are blameworthy.
      3.  **Remediation:** Do we tear the bridge down or label it dangerous? **Yes.** We don't keep using it just because "it was standard in 1920." (Corresponds to: Taking down the statue).

  **Why this works better:**
  1.  **Preserves the Intuition:** It acknowledges that we shouldn't blame people for things they literally couldn't know (the "Notice" intuition you want to keep).
  2.  **Avoids Positivism:** Safety isn't "made" by the engineering board; it's discovered via physics. Similarly, harm isn't "made" by society; it's discovered via moral reasoning.
  3.  **Separates Act from Agent:** It allows us to say "The bridge is unsafe" (The act was wrong) without necessarily saying "The engineer was a criminal" (The agent is irredeemable).
  4.  **Justifies Retrospection:** We are allowed to say the 1920 design was *worse* than the 2024 design. We are allowed to say the 17th-century moral framework was *worse* than the 21st-century one.

  **Conclusion for your chat:**
  Tell your friend his analogy proves too much (it exonerates Nuremberg defendants) and assumes a metaethics he hasn't defended (Moral Positivism). Then offer the Engineering Analogy: We can acknowledge that the "structure" of their morality was flawed and unsafe without necessarily demanding that every individual architect be imprisoned, but we are absolutely allowed to condemn the structure and refuse to honor it today.
