  **1. The Nature of the Residue**
  You argue the wrongness survives as a standing liability. But in any moral dilemma, a losing duty leaves a trace. Why is this political residue anything more than an overridden *pro tanto* reason dressed up as something special?
  *   **Likely Answer:** She'll say overridden reasons don't create *personal liability* requiring payment, only regret.
  *   **Follow-up:** If it's not about the feeling of regret, what observable behavior distinguishes "paying the liability" from just acknowledging you made a hard choice?

  **2. The Coherence of Punishment**
  You say failing to pay this liability is a second wrong, and worse than the first. But if the act was all-things-considered required, who punishes, and what happens when the official is popular and nobody wants to?
  *   **Likely Answer:** She'll say the community must punish institutionally to uphold the norm, regardless of popularity.
  *   **Follow-up:** If the community refuses because he's popular, does the liability vanish, or does the community now share the second wrong?

  **3. Auditing the Emergency**
  How do we audit the emergency threshold after the fact if the call must be made in the situation? What happens to the dirt when the prediction was reasonable but turned out wrong?
  *   **Likely Answer:** Liability attaches to the decision based on evidence, not outcome, but rights violations still leave residue.
  *   **Follow-up:** So an official can accumulate permanent liability for acting on false positives? Does that incentivize paralysis over false negatives?

  **4. The Refuser**
  What about the official who refuses to dirty his hands and the catastrophe happens anyway? Does your view commit us to preferring candidates willing to incur this liability?
  *   **Likely Answer:** We need leaders who recognize the cost, but yes, sometimes the dirty hands are necessary to save the community.
  *   **Follow-up:** If we prefer them, aren't we incentivizing the second wrong? We want someone who will do the first wrong but promise to commit the second?

  **5. Democratic Authorization**
  Does democratic authorization let citizens absorb or share the dirt, especially when they were never told what was done and couldn't have evaluated it?
  *   **Likely Answer:** Authorization requires knowledge. Secrecy blocks shared liability; the official stands alone.
  *   **Follow-up:** Then doesn't your view make democratic dirty hands impossible? The official pays alone for acts done in the people's name without their consent.

  **6. The Case Study**
  Consider a minister who authorized a strike fifteen years ago. The threat was real, he has no regrets, and now he's proud on podcasts. Is the pride itself a fresh wrong? Can the liability still be discharged that late, and does resigning and campaigning against the policy count as paying it off, or as buying himself out cheap?
  *   **Likely Answer:** Pride denies the wrongness, sustaining the second wrong. Resigning might help but requires sincere acknowledgment of the cost.
  *   **Follow-up:** If he campaigns against the policy now, is that moral growth or just laundering his reputation while keeping the power he gained from the act?

  **7. Falsification**
  Finally, what argument or evidence would actually make you give up the residue idea?
  *   **Likely Answer:** Perhaps a theory showing no residue leads to better institutional outcomes without increasing abuse.
  *   **Follow-up:** So is this view ultimately consequentialist about moral psychology, or deontological about the agent?
