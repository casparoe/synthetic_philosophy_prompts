  1. A mark for each of parts (a), (b), and (c), and an overall mark out of 10, against the seminar's bands: 0–3 fail; 4–5 marginal, significant gaps or confusions; 6–7 competent pass, correct on the main points with some imprecision; 8–9 distinction, complete and precise with some independent insight; 10 exceptional, at a publishable level.

  2. A point-by-point assessment keyed to identifiable moves in the answer rather than to general themes. For each, sort it into one of three categories: (i) wrong or resting on a confusion; (ii) defensible, but asserted where the question called for argument; (iii) correct, and worth crediting explicitly because a weaker answer would have missed it. Say which category each falls in and why, in two or three sentences.

  3. For every item in category (i), a judgment on whether the mistake is local — repairable with a sentence or two of correction — or whether it compromises a larger stretch of the answer, together with what specifically distinguishes a local slip from a structural one in this case.

  4. A short note on whether category (ii) is doing any work the student should have recognized as contested, and how the answer would have had to be extended to discharge it.

  5. The single strongest moment in the answer, and whether it is strong enough to move the mark up within its band.

  6. Four to six marginal comments, in the second person, exactly as they would appear on the returned script: specific, tied to particular sentences, and phrased so that the student can see what to do next rather than simply that something is wrong.

