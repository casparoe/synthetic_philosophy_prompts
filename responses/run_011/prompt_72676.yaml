  *   **Calorite "Metaphysical Possibility" Claim:** (i) Wrong or resting on a confusion. The student asserts there is a "genuine metaphysical possibility" in which calorite is the fluid. Once the actual reference is fixed as kinetic energy, the fluid scenario is an epistemic possibility (primary), not a metaphysical one (secondary); conflating these undermines the distinction the framework is meant to preserve.
