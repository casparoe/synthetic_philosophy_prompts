answer: |-
  **TO:** Board of Directors, Fact-Check Cooperative
  **FROM:** [Your Name]
  **DATE:** Wednesday Night
  **SUBJECT:** Verification Standard & Hospital Network Ruling

  **Bottom Line:** For the hospital case, we certify a narrower sentence: *"Records indicate the network transfers high-risk patients to tertiary centers before day 30,"* attributed to leaked logs and staff testimony, without certifying the claim that the metric is "misleading." Regarding our standard, we adopt Proposal A (Living Ledger) as the baseline but institute "Protocol D" (Convergent Evidence) for cases where the Ledger is compromised. The underlying question connecting A, B, and C is: *"When are we allowed to stop asking 'how do you know'?"* Proposal B is a non-answer wearing a policy costume; A and C are genuine but incomplete answers.

  **The Case Ruling**
  We cannot certify the partner paper's original claim—that the mortality number is "misleading"—because proving intent or methodological flaw requires relying on the National Registry's methodology document. That document is compromised by the paid consultant, breaking the Ledger chain. However, the evidence of the *action* (transfers) is corroborated by three sources (log, nurses), even if none are terminal. We will publish the factual observation of transfers with explicit sourcing disclosures. This protects us from libel while serving the public interest. This ruling utilizes Protocol D (below) as an emergency exception; under strict current rules, we would have to refuse, which abandons our mission.

  **The Philosophical Question**
  You are right that A, B, and C are not just patches; they are epistemological stances. The question is: *"What counts as solid ground?"* Proposal A (Foundationalism) says ground is fixed (the Ledger). Proposal C (Coherentism) says ground is a web of mutual support. Proposal B (Probabilism) says ground is a slope where confidence accumulates. Proposal B is the costume. Multiplying confidence factors (0.85^n) creates an illusion of precision without solving the problem of bias; a long chain of biased sources still yields a high score if the factor is too generous. It masks judgment with arithmetic. We should reject B.

  **The Policy Decision**
  We adopt Proposal A, but with the Chair's "living document" amendment mandatory. The Ledger must be re-vetted annually, not biennially, with immediate suspension clauses for conflicts of interest. However, A fails when the foundation rots, as seen here. Therefore, we add Protocol D: When Ledger sources are compromised, we may certify based on three independent lines of evidence that converge on the same fact, provided we disclose the lack of terminal anchor. This applies to this case immediately (emergency override) but operates prospectively for standard work. We cannot retroactively change the rule for past cases, but we can declare a state of emergency for current bottlenecks.

  **The Strongest Argument for the Losing Option (C)**
  We must acknowledge that Proposal C (the Investigators' web) contains a truth A ignores. In modern information ecosystems, terminal anchors are increasingly rare; almost every institution is owned, funded, or influenced. The Investigators argue that reality is often best captured by consistency across flawed sources rather than reliance on a single "pure" source that may no longer exist. Their method mirrors how intelligence agencies and historians actually work: triangulation rather than derivation. If we rigidly enforce the Ledger, we risk becoming irrelevant, certifying only press releases from entities that haven't yet been bought out. Their concern is valid: purity should not require blindness.

  **Implementation**
  The Living Ledger (A) becomes standard policy next quarter. Protocol D is authorized immediately for this hospital case and any future case where >50% of the relevant Ledger entries are under suspension. This balances defensibility with operability. We are not philosophers; we are journalists. We need rules that hold up in court and on Monday morning. A gives us the shield; D gives us the sword.

  Send approvals by 9 AM Thursday. I'll draft the public justification for the hospital ruling based on this framework.
