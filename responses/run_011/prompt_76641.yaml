      *   **User Persona:** Works on inference infrastructure for a chatbot company. Spends days staring at sampling code. No philosophy background but intelligent and precise in framing.
      *   **Core Problem:** The user sees a tension between David Lewis's *Principal Principle* (PP) and Bas van Fraassen's *Reflection Principle* (RP) in the context of LLM token sampling, especially when temperature changes and introspection are removed. They are confused about how these principles interact in an autoregressive setting where the "chance" function evolves based on previous samples.
      *   **Specific Requests:**
          1.  Compare PP and RP head-to-head (source of authority, reaction to new evidence, reaction to reconfiguration/irrationality, nature of violation).
          2.  Adjudicate which is more fundamental/derivative.
