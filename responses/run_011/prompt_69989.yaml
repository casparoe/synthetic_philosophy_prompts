      *(Refining the "Better Analogy")*: I need to be careful not to impose modern ethics. The question asks for a relation fitting *Aristotle's requirements*. The problem is that Aristotle's requirements are contradictory (human enough for virtue, thing enough for ownership). I should conclude that no such analogy exists *within his own ontology* without contradiction.

      *(Final check on Student C)*: If Master=Form and Slave=Matter, then the Slave is purely potential. But Aristotle says the slave has a soul with a deliberative part that lacks authority. Matter doesn't have a soul. So the hylomorphic reading actually contradicts Aristotle's psychological account of the slave. I must highlight this.

      *(Final check on A/B)*: A says "softer interpreters are wrong." B says "analogy is scaffolding." My verdict should be nuanced: The analogy is load-bearing for the *normative* claim (justice/benefit), which is A's main point against the "concession" reading. B is wrong to dismiss it if the goal is to understand why Aristotle thinks it's *just*. But B is right that the *empirical* claim stands alone. I will side closer to A regarding the *argumentative structure* of the justification.

