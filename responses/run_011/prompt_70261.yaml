  3. The Deweyan view tells him to treat ends as hypotheses within the inquiry itself, using evidence and argument to reconstruct the values so the conflict dissolves rather than requiring a mere trade-off.
  4. The single thing that decides between them is whether clarifying logical consistency between fixed ends achieves the same outcomes as transforming those ends through inquiry into consequences.
  5. Dewey is right because transit planning success depends on reframing problems (e.g., speed to accessibility) to align interests, proving values are endogenous to inquiry rather than frozen. The Carnapian comeback is that this Deweyan transformation often masks technocratic coercion, where planners impose their own reconstructed values under the guise of objective inquiry.
