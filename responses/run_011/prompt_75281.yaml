prompt: |-
  I'm a house tutor at a boarding school — 28 kids aged 16-18, and I've got one 90-minute slot with all of them on the Sunday evening before half term. Backstory: until June the house ran on a genuinely tight rulebook (room inspections twice a week, phone curfew, sign-out sheets, prefects with real sanctioning power), there was a near-revolt in March, and the new head has scrapped the whole thing and told them to write their own house constitution, due in about three weeks. The house has since split into a "we'll rot without structure" faction and a "we're not children, leave us alone" faction, and the same argument has now gone round the same circle four times in house meeting with nobody converting anybody. Over the summer I read one of those pop-science books about tight and loose cultures, and what struck me is that both sides are right about different things and the trade-off is the actual content of the dispute: tightness buys coordination, safety and follow-through at the cost of initiative and resentment, looseness buys creativity and genuine buy-in at the cost of drift and free-riding, and which one is correct depends largely on how much threat a group is actually under and who gets to say whether the threat is real. I want them to run into that trade-off physically instead of re-litigating it verbally.

  So: design me a 90-minute activity for those 28 teenagers. Hard constraints — no lecture up front, and nobody hears the words "tight" or "loose" until the debrief at the end. I want them split into two sub-groups operating under different institutional regimes, assigned by lottery rather than chosen, each with a real task that produces something they can see, and a scoring scheme that converts into actual voting weight in the constitutional drafting (no money involved, no budget at all; I have index cards, four whiteboards, markers, a deck of cards and a kitchen timer). Somewhere past the halfway point there needs to be a shock that changes which regime is better adapted, and I want at least a few students to have a genuine option to migrate to the other group — partly because I suspect the fight over whether exit is allowed is where the interesting normative stuff lives, and partly because I want the tight group to be tempted to close the door. Please don't hand me the standard public-goods-with-punishment game dressed up in new language; punishment is a single dial, and this isn't about how hard you punish, its about how much of life is specified in advance, what counts as a deviation, how much room is left for improvisation, and how the group treats the person who goes off-script.

  Give me the full package: the two rule sheets pretty much verbatim as I'd read them out, roles, a minute-by-minute timeline, the shock and how I trigger it without looking like a puppeteer, the migration mechanism, and then a debrief that maps specific things that will have just happened in the room onto the concepts and onto the questions I actually care about — who decides whether the threat is real, whether a tight group can legitimately block exit, whether a group can be too loose to function and what that looks like from inside. Also tell me what will predictably go wrong the first time I run this with real teenagers who already dislike each other's factions and one very clever boy who will probably work out the design in minute five and announce it. And be frank about which feature of the idea the activity just can't reproduce and I'll have to supply myself in talk — my guess is that my rules are handed down by an adult, arbitrary, and known to be a game, whereas real tight norms are internalised and experienced as legitimate by the people living under them, which is exactly the thing the "leave us alone" kids don't currently believe about last year's rulebook. I don't need a reading list or any references, I just need something I can actually run in four days.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**

      *   **Role:** House Tutor at a boarding school.
      *   **Audience:** 28 students (16-18 years old), divided into factions ("Structure" vs. "Freedom"), post-revolt context, writing a new constitution.
      *   **Time:** 90 minutes (Sunday evening).
      *   **Goal:** Make them *experience* the Tight/Loose trade-off physically, not verbally. Avoid re-litigating the same argument.
      *   **Constraints:**
          *   No lecture upfront.
          *   No words "tight" or "loose" until debrief.
          *   Split into two groups by lottery (not choice).
          *   Different institutional regimes for each group.
          *   Real task with visible output.
          *   Scoring converts to voting weight for the constitution.
          *   No money/budget (use index cards, whiteboards, markers, deck of cards, kitchen timer).
          *   Mid-point "Shock" changing which regime is advantageous.
          *   Migration mechanism (option to switch groups).
          *   Focus: Specification vs. Improvisation, Treatment of Deviants, Exit Rights.
          *   Deliverables: Rule sheets (verbatim), Roles, Timeline, Shock trigger, Migration mechanism, Debrief script, Prediction of failure points, Limitations of the simulation.
      *   **Tone:** Practical, frank, experienced, non-preachy.

  2.  **Deconstruct the Core Concept (Tight vs. Loose):**

      *   *Tight:* High coordination, low error tolerance, clear roles, punishment for deviation, efficient in stable/crisis contexts, stifling in creative contexts.
      *   *Loose:* High autonomy, high error tolerance, fluid roles, social negotiation for deviation, creative in stable contexts, chaotic in crisis.
      *   *The Twist:* The environment needs to change so that the "wrong" culture for the first half becomes the "right" culture for the second half (or vice versa), forcing a re-evaluation.
      *   *The Task:* Needs to require both precision (engineering/construction) and adaptation (creative problem solving). Let's go with a "Tower/Bridge Build" variant but with a twist on *how* they build, not just *what* they build. Actually, a "Message Transmission/Decoding" or "Resource Allocation" game might be better for "rules." Let's try a **Collaborative Design & Build** task where the *process* is regulated differently.
      *   *Refined Task:* "The Blueprint Challenge." They need to replicate a complex structure (made of index cards) or design a solution to a problem. Let's make it **Index Card Architecture**. It's tactile, visible, and scalable.
      *   *Wait, better idea:* **The "City Planning" Simulation.** No, too abstract.
      *   *Best Idea:* **The "Protocol & Product" Challenge.** Both groups must produce a physical artifact (a tower/structure) but the *rules of engagement* differ.
      *   *Actually, to capture "Constitution Writing":* The task should be about **making rules for a task** while doing the task.
      *   *Let's settle on:* **The "Supply Chain" Game.** They need to move resources (cards) to build a structure (whiteboard drawing/card house) but the constraints are on *communication and movement*.
      *   *Simpler:* **The "Two-Stage Build."**
          *   Stage 1: Precision replication (Tight wins).
          *   Stage 2: Creative adaptation to a crisis (Loose wins).
          *   Task: Build a structure using index cards that holds weight (books? but no budget). Let's say "Tallest Freestanding Structure."
          *   Regime A (Tight): Specific roles, scripted communication, penalties for stepping out of line.
          *   Regime B (Loose): Open floor, consensus required for major moves, no assigned roles.

  3.  **Drafting the Regimes (The "Rule Sheets"):**

      *   *Group A (Code Name: Protocol):* Needs to feel restrictive but efficient.
          *   Roles: Architect (only one who touches cards), Engineers (fold), Laborers (hold).
          *   Communication: Only through Architect.
          *   Penalty: If anyone speaks out of turn, 30-second freeze.
      *   *Group B (Code Name: Collective):* Needs to feel free but potentially chaotic.
          *   Roles: None. Anyone can do anything.
          *   Communication: Open.
          *   Constraint: Every action requires verbal consensus from at least 2 others ("I'm placing this." "Agreed.").
      *   *Wait, the prompt asks for "how much of life is specified."*
      *   *Revision:*
          *   **Group Alpha (The Standard):** Detailed rulebook on *how* to fold, who speaks, exact sequence. Deviation = Time penalty.
          *   **Group Beta (The Commons):** No rules on process. Only goal is height. But every 5 minutes, a "Tax" is levied (remove a card) unless they unanimously agree on a new rule to prevent it. (This captures the "drift" vs "buy-in").
      *   *Let's refine for the "Shock":*
          *   Phase 1: Stability. Alpha (Tight) should win on speed/height. Beta (Loose) struggles with coordination.
          *   Phase 2: Shock. The "Environment" changes. Maybe the table shakes? Or the materials change? Or the goal changes?
          *   *Better Shock:* The "Inspector" arrives. In Phase 2, the rules change. Alpha's rigid rules become a liability. Beta's flexibility becomes an asset.
          *   *Let's try this:*
              *   **Task:** Build a card tower.
              *   **Group 1 (Regime X):** "The Checklist." Must follow 10 specific steps to place every 5 cards. If a card falls, restart the step.
              *   **Group 2 (Regime Y):** "The Market." No building rules. But every 5 minutes, a "Crisis Card" is drawn. If they haven't agreed on a response, they lose cards.
      *   *Actually, to fit the "Constitution" theme:* The task is to **produce a set of operating procedures** for a hypothetical task, while simultaneously doing a task.
      *   *No, keep it physical.* The prompt says "produces something they can see."
      *   *Final Task Decision:* **The "Bridge" Challenge.** Connect two whiteboards using index cards.
      *   **Regime 1 (Order):** Hierarchical. One Leader, two Lieutenants, rest Workers. Leader decides design. Workers cannot speak unless spoken to. Deviation = 1 min timeout for the deviator.
      *   **Regime 2 (Liberty):** Anarchic. No leaders. Anyone can propose. Action requires 3 people saying "Go." If 2 people disagree, action stops for 1 min debate.
      *   **The Shock:** At 45 mins, the "Ground Shifts." (I move the whiteboards further apart or forbid the use of tape/folds). Let's say: **The Material Ban.** Half the cards are confiscated.
          *   *Effect:* Order group stalls because their plan is ruined and they need Leader permission to pivot. Liberty group pivots faster because they are used to negotiating change.
      *   **Migration:** At 60 mins, students can move.
          *   *Order Group:* Must vote to admit (Tight groups protect boundaries).
          *   *Liberty Group:* Open door, but new members get voting weight on future actions (diluting power).

  4.  **Developing the Scoring/Voting Weight:**

      *   The output (Bridge Height/Strength) determines "Constitutional Credits."
      *   Group with higher score gets more say in the actual house constitution drafting.
      *   This raises the stakes.

  5.  **Addressing the "Clever Boy":**

      *   He will spot the manipulation.
      *   *Strategy:* Acknowledge it in the debrief. "If you spotted the design, you're right. The question is, did knowing the design help you play the hand you were dealt?"
      *   *Mitigation:* Make the rules opaque enough that gaming them takes more energy than playing.

  6.  **Addressing the Limitations:**

      *   Real norms are internalized; these are imposed.
      *   Real stakes are social/long-term; these are game stakes.
      *   I (the tutor) am the "State," which biases the "Tight" side as authoritarian.

  7.  **Step-by-Step Planning:**

      *   **Materials:** 4 Whiteboards (2 per group), Index Cards (lots), Markers, Deck of Cards (for randomization/shock), Timer.
      *   **Groups:** 14 vs 14.
      *   **Timeline:**
          *   0-10: Setup & Rule Reading (No discussion).
          *   10-45: Phase 1 (Stability).
          *   45: The Shock.
          *   45-60: Phase 2 (Crisis).
          *   60-70: Migration Window.
          *   70-80: Final Push.
          *   80-90: Measurement & Debrief.

  8.  **Refining the Rules (Crucial Step):**

      *   *Group A (The Battalion):* Focus on *pre-specification*.
          *   Rule: "No card may be placed unless it matches the Diagram drawn in the first 5 minutes."
          *   Rule: "Only the designated 'Builder' may touch cards. Others are 'Spotters'."
          *   Rule: "If a card falls, the Builder sits for 2 minutes."
      *   *Group B (The Assembly):* Focus on *negotiation*.
          *   Rule: "Any action requires a 'Motion' and a 'Second'."
          *   Rule: "No permanent roles. Roles are assigned per card."
          *   Rule: "If anyone says 'Stop', work halts for 30 seconds."
      *   *Wait, I need the Shock to favor B.*
      *   If A is rigid, a change in requirements breaks them. If B is flexible, they adapt.
      *   *Shock:* "New Safety Regulation." You can no longer fold cards. Only flat stacking.
      *   *Group A:* Their Diagram is now illegal. They need permission to draw a new one (Leader bottleneck).
      *   *Group B:* They are used to stopping and talking. They just agree to stack flat.

      *   *Migration:*
          *   A -> B: Easy. B accepts all.
          *   B -> A: Hard. A must vote unanimously to accept (protecting the "purity" of the system).

  9.  **Debrief Mapping:**

      *   Frustration in A = Resentment of control.
      *   Frustration in B = Drift/Inefficiency.
      *   Migration desire = Exit rights.
      *   A rejecting migrants = Border control/Exclusion.
      *   Shock reaction = Resilience vs. Fragility.

  10. **Writing the Response:**

      *   Tone: Professional, direct, "here is the toolkit."
      *   Structure: Materials -> Setup -> Rule Sheets -> Timeline -> Shock -> Migration -> Debrief -> Risks/Limits.
      *   *Self-Correction on Rule Sheets:* Make them sound bureaucratic but distinct. Use "Directive" vs "Protocol."
      *   *Self-Correction on Scoring:* Make sure the voting weight is clear. "Constitutional Tokens."

  11. **Final Review against Constraints:**
      *   No "Tight/Loose" words? Check.
      *   Lottery split? Check.
      *   Real task? Check (Card Tower).
      *   Voting weight? Check.
      *   Shock? Check.
      *   Migration? Check.
      *   Predict failure points? Check.
      *   Limitations? Check.

      *(Self-Correction during drafting)*: Ensure the "Clever Boy" doesn't ruin it. I need to instruct the tutor on how to handle the meta-game comment. "Save it for the end."

      *(Refining the Migration)*: The prompt asks for "tempted to close the door." Group A (Tight) should be the one tempted to close the door to maintain efficiency. Group B (Loose) should be open but risk paralysis.

      *(Refining the Shock)*: The shock needs to be triggered by *me* but feel like an external event. "The Inspector" or "The Environment." Let's use "The Environmental Hazard."

      *(Refining the Task)*: A tower is cliché. Let's make it a "Span." Connect Whiteboard 1 to Whiteboard 2. Requires engineering.

      *Let's finalize the Rule Sheets.*
      *   **Group 1 (Directive):** Hierarchy. Pre-approved plan. Punishment for error.
