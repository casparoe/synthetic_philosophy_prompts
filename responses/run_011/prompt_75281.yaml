answer: |-
  Here is the full package. It is designed to be run with zero prep time beyond printing/copying the rule sheets and counting cards.

  ### **The Activity: "The Span"**

  **Objective:** Build a freestanding structure of index cards that bridges the gap between two whiteboards (approx. 60cm apart).
  **Win Condition:** The structure must hold a marker pen in the center for 10 seconds.
  **Stakes:** The group with the higher "Span Score" at the end earns 60% of the voting weight for the first draft of the House Constitution. The losing group gets 40%. (This is high enough to matter, low enough to prevent total war).

  **Materials:**
  *   4 Whiteboards (2 per group, placed facing each other).
  *   200 Index Cards (split evenly).
  *   4 Markers.
  *   1 Deck of Cards (for the lottery and the shock).
  *   1 Kitchen Timer (visible to all).
  *   2 Printed Rule Sheets (see below).

  ---

  ### **1. The Setup (0:00 – 0:10)**

  **The Split:**
  Do not ask for volunteers. Take the deck of cards. Remove the Kings and Queens. Shuffle the remaining 28 cards.
  *   **Red Suits (Hearts/Diamonds):** Go to Whiteboard Set 1.
  *   **Black Suits (Clubs/Spades):** Go to Whiteboard Set 2.
  *   *Note:* This is 14 vs 14. If you have odd numbers, you sit out as an "Observer" (give them a clipboard to note who speaks most).

  **The Instructions (Read Verbatim):**
  > "You have 80 minutes. Your goal is to bridge the gap between these two boards using only these cards. No tape, no folding unless your Rule Sheet says otherwise. At the end, I will test the span.
  >
  > You will not choose your rules. You will not change your rules unless the Rule Sheet explicitly allows it. You will not discuss the rules with the other group. If you break a rule, I will blow the whistle.
  >
  > Your voting power for the House Constitution depends on your score. Begin."

  **Hand out the Rule Sheets.** Do not explain them. Let them read.

  ---

  ### **2. The Rule Sheets (Verbatim)**

  **GROUP 1 (The Directive)**
  *Give this to the Red Suit group.*

  1.  **Chain of Command:** One "Chief Engineer" (CE) must be elected within 2 minutes. Only the CE may touch the cards. All others are "Spotters."
  2.  **The Blueprint:** In the first 5 minutes, the CE must draw the design on the whiteboard. No card may be placed that does not match the drawing.
  3.  **Communication:** Spotters may not speak unless the CE asks a direct question. If a Spotter speaks out of turn, the CE must stop working for 60 seconds.
  4.  **Error Protocol:** If a card falls, the CE must sit down for 2 minutes. Work resumes only when the timer beeps.
  5.  **Migration:** (See Migration Phase instructions).

  **GROUP 2 (The Consensus)**
  *Give this to the Black Suit group.*

  1.  **Equality:** There are no permanent roles. Anyone may touch cards.
  2.  **The Motion:** Before any card is placed, a student must state "I propose placing this card here." Two other students must say "Seconded."
  3.  **The Veto:** Any single student may say "Hold." All work must stop for 30 seconds to discuss the concern.
  4.  **Coercion:** If anyone raises their voice or interrupts a speaker, the group must stop for 60 seconds.
  5.  **Migration:** (See Migration Phase instructions).

  ---

  ### **3. The Timeline & Shock**

  **0:10 – 0:45: Phase 1 (Stability)**
  *   **Group 1 (Directive)** will likely move fast initially. They will elect a leader, draw a plan, and start building. It will feel efficient but tense. Spotters will get bored/resentful.
  *   **Group 2 (Consensus)** will move slowly. They will spend 15 minutes just arguing about who speaks first. They will feel frustrated by the "red tape" of motions and seconds.
  *   **Your Role:** Walk between groups. Enforce rules ruthlessly. If a Group 1 Spotter whispers "Pass me a card," blow the whistle. "60-second penalty." If a Group 2 student interrupts, blow the whistle. "60-second penalty."

  **0:45: The Shock (The Environmental Shift)**
  *   **Action:** Walk to Group 1's whiteboard. Erase their Blueprint.
  *   **Statement:** "New Safety Regulation. Folding cards is now prohibited. All cards must remain flat. You have 2 minutes to submit a new plan."
  *   **Action:** Walk to Group 2. Hand them 10 *extra* cards.
  *   **Statement:** "Resource Grant. You have surplus materials. You must incorporate all of them into the span to maintain structural integrity."
  *   **Why this works:**
      *   **Group 1** is devastated. Their *only* authority (the Blueprint) is gone. Their *only* worker (the CE) is now paralyzed because the old plan is illegal. They need to innovate, but their rules punish deviation.
      *   **Group 2** is annoyed but adaptable. They are used to stopping and talking. Incorporating more cards is just a new "Motion." Their process is built for negotiation, which is exactly what this shock requires.

  **0:45 – 1:00: Phase 2 (Crisis)**
  *   Watch Group 1 fracture. The CE will try to dictate a new plan, but Spotters will realize the old way doesn't work. They will want to speak. The rules forbid it.
  *   Watch Group 2 accelerate. Once they agree on the "Flat Stack" strategy, their consensus mechanism locks it in quickly.

  **1:00 – 1:10: The Migration Window**
  *   **Announcement:** "You may now switch groups. You have 5 minutes to move. Once you move, you cannot return."
  *   **The Catch (Crucial):**
      *   **To join Group 1 (Directive):** The current members of Group 1 must vote **unanimously** to accept you. (They will likely reject people to protect their efficiency/score).
      *   **To join Group 2 (Consensus):** You simply walk over. However, every new member adds one "Veto Token" to the group. (Meaning, with more people, it becomes harder to get anything done).
  *   **Dynamic:** Group 1 students who are frustrated Spotters will *want* to leave. But Group 1 leadership will block them to keep the "Chain of Command" pure. Group 2 students might want to leave because it's too slow, but Group 1 won't let them in.

  **1:10 – 1:20: Final Push**
  *   No more movement. Finish the build.

  **1:20 – 1:30: Scoring & Debrief**
  *   Test the spans. Award the Voting Weight (60/40 split).
  *   Sit them down immediately for the debrief.

  ---

  ### **4. The Debrief Script (Mapping the Experience)**

  Do not lecture. Ask questions. Write their answers on the board.

  **Step 1: The Feeling (5 mins)**
  *   "Group 1, raise your hand if you felt frustrated by the rules in the first 20 minutes." (Likely few).
  *   "Group 1, raise your hand if you felt frustrated after I erased the board." (Likely many).
  *   "Group 2, raise your hand if you felt the process was too slow at the start." (Likely all).
  *   "Group 2, raise your hand if the process helped you after the shock." (Likely most).
  *   *Point:* "Structure feels good when the path is clear. It feels like a cage when the path disappears."

  **Step 2: The Migration (5 mins)**
  *   "Who tried to move from Group 1 to Group 2?"
  *   "Who was blocked?"
  *   "Group 1, why did you vote no?" (They will say: "They don't know our system," "It would slow us down," "They're rule-breakers.")
  *   *Point:* "Tight groups protect themselves by excluding. Is that fair? Is it necessary for survival?"
  *   "Group 2, how did it feel taking new people in?" (They will say: "Slower," "More vetoes.")
  *   *Point:* "Openness costs efficiency. Are we willing to pay that price?"

  **Step 3: The Concepts (5 mins)**
  *   "I haven't used these words yet. Group 1 was running a **Tight** culture. Group 2 was running a **Loose** culture."
  *   "Tight buys coordination and speed in stable times. Loose buys adaptability and buy-in in chaotic times."
  *   "The House Constitution isn't about choosing one. It's about knowing when the 'Shock' is coming. Was last year's revolt a 'Shock'? Or was it the result of a Tight culture staying Tight for too long?"

  **Step 4: The Constitution (Final 5 mins)**
  *   "You have the voting weights. You have 3 weeks. My advice: Don't write rules for today. Write rules for the 'Shock.' Who gets to decide when the Blueprint gets erased? And who gets to decide who can walk through the door?"

  ---

  ### **5. Predictable Failure Points (And How to Handle Them)**

  **1. The "Clever Boy" (Meta-Gaming)**
  *   *Risk:* At minute 5, a student says, "This is a psychological experiment. Group 1 is authoritarian, Group 2 is democratic. You're manipulating us."
  *   *Response:* Do not deny it. Do not engage. Say: "You might be right. But the voting weight is real. Do you want to win the argument or win the vote?" Then walk away. If he keeps shouting, penalize his group for "Coercion/Disruption" using *their* rule sheet. This proves the point physically.

  **2. Group 1 Mutiny**
  *   *Risk:* The Spotters in Group 1 realize the CE is failing after the Shock and physically restrain the CE to take over.
  *   *Response:* This is gold. Stop the timer. "You have broken the Constitution of this game. You are now disqualified from the Voting Weight unless you restore the order." Force them to decide: Do they value the *win* or the *rebellion*? This mirrors the March revolt exactly.

  **3. Group 2 Paralysis**
  *   *Risk:* Group 2 spends 40 minutes debating the first card and builds nothing.
  *   *Response:* Intervene at minute 30. "You are at risk of zero voting weight. The rules allow you to suspend the Veto for 5 minutes if 75% agree. Do you want to do that?" This teaches them that Loose cultures need emergency Tight mechanisms.

  **4. The Migration Stalemate**
  *   *Risk:* Nobody moves.
  *   *Response:* Whisper to the frustrated Spotters in Group 1: "The rules say they have to vote unanimously. If you lobby three of them privately, you can get in." This introduces political maneuvering into the Tight group, which usually cracks them open.

  ---

  ### **6. Limitations (What You Must Supply)**

  This simulation cannot reproduce **Legitimacy.**

  *   **In the Game:** The rules are arbitrary, imposed by you (the adult), and known to be temporary. Students follow them to win points.
  *   **In the House:** The rules are lived, permanent, and social. The "Tight" faction believes the old rules were *right*, not just efficient. The "Loose" faction believes freedom is *moral*, not just adaptable.
  *   **Your Job:** In the debrief, you must bridge this gap. You need to say:
      > "In this game, you followed the rules because I told you to. In the House, you follow rules because you believe they keep you safe or because you trust each other. The danger of last year wasn't just that the rules were Tight. It was that they lost Legitimacy. You followed them because you had to, not because you believed in them. A Tight culture without legitimacy is a prison. A Loose culture without trust is a riot. Your Constitution needs to build the trust, not just the rules."

  **Final Note:**
  Do not declare a "Winner" of the moral argument. Declare a winner of the *Span*, award the voting weight, and let them fight it out in the drafting committee. The game's purpose is not to solve the dispute, but to give them a shared vocabulary of *experience* so they aren't just shouting past each other. When they argue in three weeks, you can just say: "Remember the Blueprint."
