answer: |-
  Here is the verdict: **CLAY does not survive the addition of the nose.** **FIGURE does survive.** Upon the kneading of the new clay, the original lump goes out of existence, a new lump comes into existence, and the bust persists through the change.

  This answer requires a specific ontological inventory. After the nose is attached, three distinct material entities occupy the region of the bust. First, there is **FIGURE**, the artistic object, which persists from the initial sculpting through the repair. Second, there is **NEW-CLAY**, the maximal continuous mass of clay currently constituting the bust. Third, there is **OLD-MASS**, the specific collection of clay particles that originally constituted CLAY. OLD-MASS is now a proper part of NEW-CLAY. It is not itself a lump, because it is no longer a maximal mass of clay; it is merely a quantity of matter embedded within a larger lump.

  To defend this, I must explicitly restrict a principle that often goes unnoticed in ordinary discourse: **the persistence of aggregate sortals through mereological change.** We typically assume that if we have a lump of clay and we add a bit more clay to it, we still have "the same lump," just bigger. I deny this. I argue that the sortal term "lump" carries a **Maximality Constraint**. To be a lump is to be a *maximal* continuous mass of a certain material. If you have a mass of clay, and you attach more clay to it such that they become one continuous mass, the original mass ceases to be maximal. It becomes a proper part of a new maximal mass. Since being a lump requires maximality, the original lump ceases to exist. It is replaced by a new lump that includes the new parts.

  This adjudication solves the first horn of your dilemma immediately. You asked if CLAY survives the addition. If it did, we would face the absurdity of CLAY being identical to NEW-CLAY despite having different parts, or we would have to accept that CLAY and CLAY-minus (OLD-MASS) are distinct objects occupying the same space, leading to an explosion of overlapping lump-objects wherever matter accumulates. By denying that CLAY survives, I avoid the claim that one object changes its parts while remaining identical. Instead, one object (CLAY) goes out of existence, and a numerically distinct object (NEW-CLAY) comes into existence. OLD-MASS persists, but it changes status from "lump" to "proper part of a lump." There is no contradiction here, only a change in classification based on mereological structure.

  This leads directly to the second horn of your dilemma: the demand for a principled line. If CLAY dies upon the addition of the nose, why didn't the nose-clay stop being part of a lump when it was kneaded in? The answer lies in the same Maximality Constraint. The nose-clay began as part of a different maximal mass (call it LUMP-B). When it was torn off, LUMP-B ceased to exist (or diminished), and the torn piece became a non-maximal mass. When kneaded into the bust, it became part of NEW-CLAY. It did not stop being clay; it stopped being a *lump* in its own right. The principled line is not drawn based on the *amount* of clay added, nor on the *intent* of the sculptor, but on the topological fact of continuity. Any addition that creates a larger continuous mass destroys the maximality of the constituent masses. Therefore, the original lump dies.

  I am openly paying a cost here. The cost is that lumps are incredibly fragile entities. If a speck of dust lands on a lump of clay and sticks, the original lump ceases to exist and a new one begins. If a molecule evaporates, the lump dies. This violates the pragmatic intuition that lumps are stable objects that can survive minor wear and tear. I accept this violation. The intuition that lumps are stable is a pragmatic heuristic, not an ontological truth. We treat lumps as stable for the purposes of conversation and trade because the differences between CLAY and NEW-CLAY are rarely relevant to our interests. But in strict ontology, "lump" is a low-grade sortal defined by spatial continuity and material homogeneity. It does not have the functional resilience of an artifact like FIGURE. FIGURE survives the repair because its identity conditions are tied to its form and artistic history, not merely to the maximality of its matter. CLAY does not survive because its identity conditions are tied strictly to the extent of its matter.

  This distinction allows me to handle the proliferation worry. You asked if I am committed to a pile of partially overlapping clay objects. I am committed to overlapping objects, yes, but not a pile of *lumps*. I am committed to FIGURE, NEW-CLAY, and OLD-MASS. OLD-MASS is not a lump; it is a quantity of matter. NEW-CLAY is a lump. FIGURE is an artifact. There are not multiple *lumps* competing for the same space; there is one lump (NEW-CLAY) and one artifact (FIGURE) and various sub-lump quantities of matter. The explosion of objects is contained by the Maximality Constraint: only the outermost boundary defines the lump. Everything inside is merely matter or proper parts.

  Now, consider the slow version: the museum conservator replaces a thin outer layer of clay every year for forty years. The removed clay is kept in boxes and finally pressed back together in the basement. Does my verdict carry over?

  Yes, it does, and it reveals the sharp difference between artifacts and aggregates. In the slow case, **FIGURE survives** the forty years. The artistic identity persists through the gradual replacement of parts, much like the Ship of Theseus. However, **CLAY does not survive.** In fact, no single lump survives the process. At Year 1, when the first layer is swapped, the original lump (LUMP-1) ceases to exist because it is no longer a maximal continuous mass of the original clay; it has lost parts and gained new ones. A new lump (LUMP-2) exists. This happens every year. Over forty years, there is a succession of forty distinct lumps, each constituting the figure at that time.

  In the basement, when the removed clay is pressed back together, a new lump forms (LUMP-BASEMENT). Is LUMP-BASEMENT identical to the original LUMP-1? Here, the Maximality Constraint interacts with spatiotemporal continuity. LUMP-1 ceased to exist when its parts were scattered into boxes. Scattered clay is not a lump; it is merely clay. When reassembled, a new maximal mass is formed. Because there was a temporal gap where no maximal mass of that specific matter existed, LUMP-BASEMENT is numerically distinct from LUMP-1, even though it is composed of the same particles. It is a qualitative duplicate, not the same object.

  This verdict might seem harsh on the clay, but it preserves the integrity of the artifact. The museum possesses the original Figure. It does not possess the original Lump. The original Lump died decades ago, replaced by a succession of new lumps. The clay in the basement is the matter of the original lump, reconstituted into a new lump.

  Where does the difference do the work? The difference lies in the **sortal dependence of identity conditions.** FIGURE is a functional kind. Its persistence conditions allow for part replacement so long as the function and form are maintained. CLAY is a material kind defined by maximality. Its persistence conditions do not allow for part replacement because adding or subtracting parts changes the maximal boundary, thereby destroying the object that satisfied the definition.

  One might object that this makes "lump" a useless category. If lumps die whenever dust lands on them, why use the word? I respond that "lump" is useful precisely because it picks out maximal masses at a time. It is a snapshot sortal. It tells us about the current state of matter, not the history of an object. When we need historical persistence, we use artifact sortals like "bust" or "statue." When we need to track matter regardless of form, we use mass terms like "clay." The confusion arises when we treat "lump" as if it were a persistent historical object like a bust. It is not. It is a transient maximal arrangement.

  Let us return to the specific worry about CLAY-minus. In the slow case, CLAY-minus (the original matter) is scattered across forty boxes. It does not form a lump during those years. It is merely matter. When pressed together, it forms a lump again. In the nose case, CLAY-minus (the original matter) remains continuous but loses maximality. In both cases, the original *lump* is gone. In both cases, the *matter* persists. In both cases, the *Figure* persists. The ontology is consistent.

  The load-bearing intuition here is not that objects should be stable, but that **definitions should be respected.** If a lump is defined as a maximal mass, it cannot survive losing maximality. To insist that CLAY survives is to insist that an object can be maximal and non-maximal at the same time, or that maximality is irrelevant to being a lump. I choose to respect the definition. The cost is the fragility of lumps. The benefit is a clean separation between the persistence of matter, the persistence of maximal aggregates, and the persistence of functional artifacts.

  There is a final objection to consider. If CLAY dies when the nose is added, does FIGURE lose its constitution? No. FIGURE is constituted by NEW-CLAY. Constitution is a time-indexed relation. At T1, FIGURE is constituted by CLAY. At T2, FIGURE is constituted by NEW-CLAY. The relation shifts without destroying the relatum (FIGURE). This avoids the need to say FIGURE dies too.

  Some will reject this verdict because it implies that we are surrounded by popping-in-and-out-of-existence objects constantly. They will argue that common sense dictates the lump survives. I reply that common sense is a guide to pragmatics, not metaphysics. Common sense also suggests the sun moves around the earth. When we scrutinize the conditions of identity for material aggregates, we find they are far more rigid than our language suggests. We speak loosely of "the same lump" because the difference between CLAY and NEW-CLAY rarely matters. But in a puzzle case designed to test identity, we must tighten our language.

  Therefore, the table holds one Figure, one Lump (the new maximal mass), and one quantity of original matter (now a proper part). The original Lump is gone. The original Matter remains. The Figure endures. This is the price of precision: we must admit that most of the "objects" we name in daily life are not persistent entities under strict identity conditions, but rather stages in the life of matter, grouped by our interests. The bust is real because it has a history that binds its stages. The lump is real only instantially, as a maximal configuration. When that configuration changes, the lump is dead.

  This verdict resolves the overlap problem by denying the persistence of the overlapping candidate. It resolves the principled line problem by drawing the line at maximality. It handles the slow case by treating it as a series of lump-deaths and one figure-survival. It pays the cost of lump-fragility openly. There are no hidden mysteries here, only the strict application of sortal constraints. The clay does not care about our desire for stability; it only cares about continuity. When continuity expands, the old boundary dies. The bust cares about form. When form persists, the bust lives. We must not confuse the two.
