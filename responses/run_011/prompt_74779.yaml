  **The Models**
  Two decision rules fit her five verdicts perfectly, but they diverge on your new gamble.

  1.  **Risk-Weighted Expected Utility (RWEU):** The philosopher's likely formal view (à la Lara Buchak). Utility is linear, but probabilities are transformed by a concave risk function $r(p)$, where $r(p) < p$. This captures risk aversion without denying linearity of value.
  2.  **Lexical Loss Avoidance (LLA):** A heuristic rule. "Maximize expected gain, provided no outcome is negative." Since your first five bets were gains-only, this rule fits the data trivially.

  **The Arithmetic**
  We can bound her risk function $r(p)$ using her choices.
  *   **Gamble 3 (Reject):** Sure 250 > 50% of 560. $\Rightarrow 250 > r(0.5) \times 560 \Rightarrow \mathbf{r(0.5) < 0.45}$.
  *   **Gamble 4 (Accept):** 80% of 500 > Sure 300. $\Rightarrow r(0.8) \times 500 > 300 \Rightarrow \mathbf{r(0.8) > 0.60}$.

  A simple function fitting these bounds is $r(p) = p^2$ (where $0.5^2=0.25$ and $0.8^2=0.64$). Let's run your new bet through RWEU using this estimate.

  **The New Bet:** 4% of +10,000; 60% of +100; 36% of −300.
  In RWEU, value is calculated from the worst outcome upward:
  $$V = u(\text{min}) + r(P > \text{min})[u(\text{mid}) - u(\text{min})] + r(P > \text{mid})[u(\text{max}) - u(\text{mid})]$$
  $$V = -300 + r(0.64)[100 - (-300)] + r(0.04)[10,000 - 100]$$
  $$V = -300 + 0.41(400) + 0.0016(9,900)$$
  $$V = -300 + 164 + 16 = \mathbf{-120}$$

  **The Verdict**
  She **rejects** the bet.
  Under RWEU, the 36% risk of loss anchors the value at −300. Her risk aversion discounts the 64% chance of recovery so heavily (to ~41% weight) that it fails to climb back to zero. The longshot jackpot is too underweighted to save it.
  Under LLA, she rejects it immediately because a negative outcome exists. Both models agree, but for different reasons.

  **Philosophical Implications**
  *   **If RWEU:** She signs up for consistency across all domains. She must accept the **Allais Common Ratio** reversal (preferring a sure thing over a high-probability gain, but swapping preference when both are scaled down). She also owes you a theory of losses that treats −300 as linear disutility, not a catastrophe.
  *   **If LLA:** She avoids the Allais traps by simply forbidding downside risk. However, she cannot handle *any* bet with a loss, even if the EV is massive (e.g., 99% chance of +1,000,000 vs 1% of −1). This makes her view brittle for real-world policy where "do nothing" often carries hidden risks.

  **The Diagnostic Bet**
  To separate them, offer her this:
  **Sure 0 vs. 90% chance of +20, 10% chance of −50.** (EV = +13)
  *   **LLA** rejects (contains a loss).
  *   **RWEU** accepts ($V = -50 + 0.9^2(70) = -50 + 56.7 = +6.7$).
  If she takes it, she's a risk-weighter. If she balks, she's a loss-avoider.
