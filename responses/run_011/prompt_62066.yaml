prompt: |-
  I keep seeing the same long-read in an ideas supplement about Hofstadter on the self, and its been shared by three people I trust, so I want to check it before I lean on it in an essay. It goes roughly like this: 'Hofstadter thinks the self is an illusion — just a feedback loop the brain runs on itself, no more real than a whirlpool in a stream. Since what you are is a pattern rather than a substance, the pattern can be copied into other media: your friends, a book you wrote, eventually a computer. That's why, after his wife died, he said she was still alive in him — not as a consoling metaphor but literally, because her pattern was running in his brain. Which means death is a bit of a category error: patterns don't die, they just get instantiated somewhere else.'

  Which parts of that would Hofstadter actually sign up to? Go through it claim by claim — what he'd accept, what's a harmless-sounding simplification that quietly changes the thesis, and what he'd say is flatly wrong. I'm especially unsure about 'illusion', and about whether he's really committed to the uploading business or just flirted with it. And once the shaky bits are fixed, does that final claim about death still stand, or does it depend entirely on them? British English please.
