      *   *Verdict:* Friends/Books = Yes (partial patterns). Computers = He's agnostic/skeptical about it preserving *you* specifically, though he believes consciousness *could* be substrate-independent in theory. The summary makes it sound like a straightforward "yes" to uploading as survival, which is a simplification.

