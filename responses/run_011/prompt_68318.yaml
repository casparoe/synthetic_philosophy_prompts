prompt: |-
  I'm putting together week six of a grad proseminar on metaethics — the week we do the evolutionary debunking arguments — and I'm thoroughly sick of the examples everyone reaches for: disgust, the incest vignettes, trolleys, food aversions. I want to hand my students a case that's engineered to isolate one specific variable, and built carefully enough that they can't wriggle out of it by pointing at something I've stipulated away. So: build me the case to spec, then show me it meets the spec.

  Here's what I want. One scenario, a single paragraph, entirely realistic — two ordinary people in the contemporary world. No isolation chambers, no anthropologists with clipboards, nobody being shown an fMRI of their own amygdala, no possible-worlds machinery. Both of them hold the same substantive moral belief: that they are under a serious, genuinely demanding obligation to give up most of their disposable income to aid anonymous strangers on the other side of the planet who will never learn their names. Both are well-informed laypeople who fully accept the standard evolutionary geneology of the moral faculty — kin selection, reciprocal altruism, coalitional psychology, the parochialism of the evolved moral sense. Nobody is surprised by anything, and neither of them needs to be told about their own psychology. The only difference between them is *how* the belief is held. Agent A has it as an immediate, articulate conviction she cannot give reasons for. Agent B arrived at it by a long, careful argument from premises that are entirely non-moral and that she'd hold regardless — roughly, that how bad a child's dying of malaria is doesn't depend on where the child happens to be standing, and that she can prevent it at a cost to herself that is trivial by comparison. And here's the twist I want you to build in honestly rather than just assert: both beliefs run *against* the grain of what a fitness-shaped moral sense would be expected to produce. Parochialism is the evolved default; costly impartiality toward anonymous distant strangers is not. Don't tell me that in the scenario — arrange the scenario so it's true of it.

  Then do the work. For each of three positions — (i) the hardline geneological debunker, (ii) the third-factor realist who says survival or flourishing is itself good, so selection pushed us toward at least some moral truths, and (iii) the tracking realist who thinks selection handed us a normative reasoning capacity which, once it exists, can latch onto moral facts it wasn't selected to detect — give me the verdict on A and on B separately, with the reasoning. One constraint on the debunker that I want *enforced*, not merely mentioned: she may not retreat to a global argument from reason. No Plantinga-style or Lewis-style move where the reliability of every faculty gets called into question at once. She has to say what is specifically wrong with *this* moral belief that isn't equally wrong with, say, the belief that the sun will rise tomorrow, or with her own belief about what selection favored. If the setup makes that impossible for her, say so plainly — that's a result I'd happily have, but only if you've shown it rather than rigged it. Stipulating verdicts instead of generating them out of the positions is cheating, and I'll catch it.

  Finish with an audit. Name the single feature of B's case that is doing the work. Tell me what happens to the three verdicts if you strip that feature out and give B an argument a fitness-shaped mind would have been perfectly happy to produce — does B collapse back into A, or does the gap between them survive the change? Then give me the best attack each of the three positions has on the case as specified: which constraint would each of them say is doing illegitimate work, and why. And since I'll be standing in front of fifteen grad students defending this thing, be straight with me about the weak points — tell me which of the three positions you actually think handles B best, what argument or consideration would move you to a different one, and whether there's a hole in my specification that I haven't noticed and that a sharp student will walk straight into.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Goal:** Create a teaching case for Week 6 of a grad proseminar on metaethics (Evolutionary Debunking Arguments - EDAs).
      *   **Problem:** Standard examples (disgust, incest, trolleys) are overused and allow too many escape routes.
      *   **Requirements for the Case:**
          *   One scenario, single paragraph.
          *   Entirely realistic (contemporary, ordinary people).
          *   No sci-fi/philosophical tropes (isolation chambers, fMRIs, possible worlds).
          *   Two agents (A and B).
          *   **Shared Belief:** Both believe they have a serious obligation to give up most disposable income to aid anonymous distant strangers (Effective Altruism-style).
          *   **Shared Knowledge:** Both accept the standard evolutionary genealogy of morality (kin selection, parochialism, etc.).
          *   **Key Difference:** Agent A holds the belief as an immediate, articulate conviction (intuition). Agent B holds it via a long, careful argument from non-moral premises (reasoning).
          *   **Crucial Constraint:** Both beliefs must run *against* the grain of evolved fitness (parochialism is default; costly impartiality is not). This must be shown, not just asserted.
      *   **Analysis Required:**
          *   Apply three positions: (i) Hardline Genealogical Debunker, (ii) Third-Factor Realist, (iii) Tracking Realist.
          *   Give verdicts on A and B separately for each position.
          *   **Debunker Constraint:** No global skepticism (Plantinga/Lewis). Must target *this* belief specifically without undermining mundane beliefs (sun rising) or beliefs about selection itself. If impossible, admit it.
      *   **Audit:**
          *   Identify the single feature of B's case doing the work.
          *   Test: What if B's argument *was* fitness-conducive? Does the gap survive?
          *   Best Attack: What constraint does each position say is doing illegitimate work?
          *   Instructor Advice: Which position handles B best? What would change my mind? What's the hidden hole?

  2.  **Drafting the Case (The Scenario):**

      *   *Challenge:* Make costly impartiality clearly anti-evolutionary without saying "this is anti-evolutionary."
      *   *Solution:* Focus on the *cost* and the *distance*. Evolution favors kin and reciprocators. Giving away "most disposable income" to "anonymous strangers" who "never learn their names" is the key.
      *   *Agents:* Let's call them Sarah (A) and David (B).
      *   *Setting:* A coffee shop or office breakroom. Ordinary context.
      *   *Drafting:* Sarah and David sit in a Chicago breakroom. Both donate 60% of their take-home pay to bednet distributions in Malawi. Both know evolutionary psychology. Sarah says, "I just feel the pull; it's wrong to keep it." David says, "I calculated the QALYs; distance is morally irrelevant." Both acknowledge this hurts their ability to raise families (fitness cost).
      *   *Refining for "Single Paragraph":* Needs to be tight.
      *   *Refining for "Against the Grain":* Need to emphasize that this reduces their own reproductive security/status without social reward.

  3.  **Developing the Verdicts (The Analysis):**

      *   **(i) Hardline Debunker (e.g., Joyce, Ruse, maybe Street depending on interpretation):**
          *   *Target:* The causal link between moral truth and belief.
          *   *Agent A:* Easy target. Intuition is directly shaped by selection. Selection favored parochialism. This intuition is a misfire or a spandrel. Debunked.
          *   *Agent B:* Harder. B uses reasoning. But the *premises* or the *drive* to reason that way might still be selected. However, the prompt demands the Debunker avoid global skepticism.
          *   *Constraint Check:* Can the Debunker attack B without attacking math/logic? Yes, by attacking the *normative weight* given to the premises. Why does "distance doesn't matter" motivate action? That motivational push is the evolutionary bit.
          *   *Verdict:* A is debunked. B is *also* debunked, but for a subtler reason (the motivation to follow the argument is evolutionary).
          *   *Wait, the constraint:* "If the setup makes that impossible for her, say so plainly."
          *   *Thought:* If B's argument is purely non-moral (facts about malaria, facts about distance, facts about cost), the *inference* is logical. The Debunker needs to attack the *normative premise* hidden inside. If B truly has *no* moral premises, how does she get to "ought"? Hume's Guillotine. If B bridges the is-ought gap, she used a moral intuition (back to A). If she didn't, she hasn't derived a moral obligation.
          *   *Correction:* The prompt says B argues from premises "entirely non-moral... that she'd hold regardless." This is tricky. To get an 'ought', you usually need an 'ought'. Let's assume B accepts a principle like "Preventable suffering is bad" as a non-moral fact? No, that's moral. Let's assume B accepts "I want to minimize suffering" as a preference.
          *   *Better interpretation for the case:* B's argument is instrumental rationality based on a foundational commitment. The Debunker attacks the foundational commitment's genealogy.
          *   *Strict Constraint:* The Debunker cannot say "Reason is unreliable." She must say "This specific moral output is unlinked to truth."
          *   *Strategy:* For A, the link is direct (intuition). For B, the link is indirect (reasoning serving an evolutionary end?). Actually, if the belief is *anti*-fitness, the Debunker has a harder time. Usually, EDAs say "Belief X is explained by fitness, not truth." If Belief X is *anti*-fitness, the EDA needs to explain why we have it. Maybe it's a misfire of a fitness-promoting heuristic (e.g., generalizing care for kin to strangers).
          *   *Verdict:* A: Debunked (misfired heuristic). B: Debunked (reasoning is a tool used by the heuristic). *Wait, can the Debunker spare B?* If B's reasoning is truth-tracking (logic/math), maybe B survives? But the *moral* conclusion relies on the weight given to strangers.
          *   *Decision:* I will argue the Hardline Debunker *must* debunk both, but struggles with the constraint regarding global skepticism. I need to be honest here. If B uses pure logic on non-moral facts, she doesn't get a moral conclusion. If she gets a moral conclusion, she smuggled in a moral premise. If that premise is intuitive (like A), she collapses to A. If the premise is "Suffering is to be prevented," the Debunker attacks that premise's genealogy.
          *   *Refined Decision:* The Debunker attacks the *motivation* to accept the conclusion.

      *   **(ii) Third-Factor Realist (e.g., Enoch, Wielenberg):**
          *   *Idea:* There's a third factor (e.g., survival/flourishing) that explains both the belief and the truth.
          *   *Problem:* The case specifies the belief is *anti*-fitness (costly impartiality). Third-factor usually relies on fitness tracking truth (e.g., "Survival is good, we evolved to seek survival, so we track goodness").
          *   *Application:* Here, the belief *reduces* fitness. So the standard Third-Factor move fails.
          *   *Adjustment:* Maybe the third factor is "Rationality" or "Value of Consciousness."
          *   *Verdict:* A is shaky (intuition opposes fitness). B is stronger because B uses Reason, which might be the Third Factor.
          *   *Constraint:* The prompt asks for verdicts based on the positions. I need to make sure the Third-Factorist doesn't just wave hands.
          *   *Key:* B's reliance on *reasoning* allows the Third-Factorist to say "Reason tracks truth, even if fitness doesn't." A relies on intuition, which is fitness-tethered.

      *   **(iii) Tracking Realist (e.g., Boyd, Brink, maybe moral perception):**
          *   *Idea:* We have a capacity to detect moral facts, selected for other reasons (coalitional coordination), but it can detect objective truths.
          *   *Verdict:* A is vulnerable (intuition is the noisy channel). B is robust (reasoning refines the signal).
          *   *Nuance:* If the capacity was selected for parochialism, can it track impartiality? Yes, via extension/reflection. B represents the reflection.

  4.  **Drafting the Audit:**

      *   *Feature of B:* The *inferential distance* from the evolutionary heuristic. B uses a cognitive process (deductive/inductive reasoning on non-moral facts) that is not the specific module selected for moral intuition.
      *   *Strip the Feature:* If B argues "Helping others feels good and builds reputation" (fitness-conducive argument), then B collapses to A. The gap depends on the argument being *independent* of fitness logic.
      *   *Attacks:*
          *   Debunker: "Your reasoning rests on a normative premise you didn't justify."
          *   Third-Factor: "Why is Reason a third factor if it leads to fitness-reducing behavior?"
          *   Tracking: "Is the capacity to reason about morality actually selected, or is it a spandrel?"
      *   *Instructor Advice:* Which handles B best? Tracking Realist seems most natural. Hardest hole? The "Is-Ought" gap in B's argument. If B derives 'ought' from 'is', she's committed a fallacy. If she uses a moral premise, she's back to A.

  5.  **Refining the Case (Self-Correction during drafting):**

      *   *Critique:* The prompt says B argues from premises "entirely non-moral." This is the philosophical minefield. You can't derive 'ought' from 'is'.
      *   *Fix:* I must construct B's argument carefully. B believes "Suffering is a negative value state" (axiological, not necessarily deontic?) or B accepts a hypothetical imperative: "If one minimizes suffering, one ought to do X."
      *   *Better Fix:* The prompt stipulates B *has* the belief in the obligation. I just need to describe *how* she got there. She reasoned from "Malaria causes death" + "Death is bad" (non-moral value?) + "I can stop it."
      *   *Strict adherence:* I will describe B's reasoning as relying on *consistency* and *non-moral facts* (geometry of space, biology of disease), implying the normative force comes from the rational requirement of consistency, not a moral intuition. This isolates the variable: Intuition vs. Rational Consistency.
      *   *Fitness Constraint:* I need to make sure the text shows this is fitness-reducing. "Both acknowledge this leaves them unable to afford housing in safe school districts or secure retirement," etc.

  6.  **Finalizing the Analysis:**

      *   *Debunker:* Must attack the *reliability* of the process. For A, it's the intuition module. For B, it's the reasoning process applied to moral domains. The constraint (no global skepticism) is the hard part. I will argue the Debunker *fails* the constraint on B, which is a valuable teaching point.
      *   *Third-Factor:* Needs to pivot from "Fitness" to "Rationality" as the third factor.
      *   *Tracking:* Distinguishes the *capacity* from the *output*.

  7.  **Final Review against Constraints:**
      *   One paragraph? Yes.
      *   Realistic? Yes.
      *   Two agents, same belief, different etiology? Yes.
      *   Anti-fitness shown? Yes (financial sacrifice, no reputation gain).
      *   Debunker constraint enforced? Yes (will explicitly address the inability to target B without global skepticism).
      *   Audit included? Yes.
      *   Weak points admitted? Yes.

  8.  **Writing the Response:** (Proceeding to generate output based on these thoughts.)
      *   *Tone:* Academic, precise, slightly conversational (as one colleague to another).
      *   *Structure:* Case -> Analysis (3 positions) -> Audit -> Instructor Advice.

  *(Self-Correction on the Debunker Constraint)*: The prompt says: "If the setup makes that impossible for her, say so plainly — that's a result I'd happily have, but only if you've shown it rather than rigged it." This is a crucial opportunity. I should demonstrate that the Hardline Debunker *cannot* distinguish B from non-moral reasoning without triggering global skepticism. This validates the case design.

  *(Self-Correction on B's Argument)*: To ensure B isn't just smuggling in a moral intuition, I need to frame her reasoning as *structural*. She sees a contradiction in caring about nearby suffering but not distant suffering. The "normative force" comes from the demand for consistency, not a moral sense. This makes it a test of Reason vs. Intuition.

  *(Fitness Check)*: Make sure to mention they *don't* get social credit. "Anonymous strangers... who will never learn their names." This kills reciprocal altruism. "Most disposable income." This kills kin investment.

