answer: |-
  ### The Case

  Sarah and David are mid-level actuaries in a Chicago firm, both thirty-five, both childless by choice because they direct sixty percent of their take-home pay to bednet distributions in Malawi. They know the evolutionary literature; they agree that the human moral sense was sculpted by kin selection and reciprocal altruism to favor the local and the known, and they acknowledge that their donations reduce their own reproductive security and social capital without offering reputational rewards, since the recipients are anonymous and their peers view the sacrifice as eccentric. Yet both hold the firm belief that they are strictly obligated to continue this giving. Sarah's belief is immediate: when she reads about a preventable death, she feels a visceral, non-negotiable demand to act, a conviction she cannot justify further without circularity. David's belief is inferential: he feels no visceral pull, but he accepts non-moral premises that the distance to a dying child is spatially irrelevant to the child's suffering, that his dollars have the same purchasing power in Malawi as in Chicago, and that rational consistency requires him to treat equivalent states of affairs equivalently; he concludes the obligation from these premises alone, without invoking any distinctively moral intuition.

  ***

  ### The Analysis

  **(i) The Hardline Genealogical Debunker**
  *   **Verdict on A:** **Debunked.** Sarah's belief is the direct output of a cognitive mechanism shaped by selection. Since selection favored parochialism and this belief is impartial, the mechanism is misfiring (a heuristic over-extension). The causal chain runs from evolutionary pressure $\rightarrow$ psychological heuristic $\rightarrow$ belief. There is no link to moral truth, only to fitness-enhancing error-management.
  *   **Verdict on B:** **Stalemate / Constraint Failure.** The Debunker faces a dilemma. If she attacks David's reasoning, she must attack the reliability of rational consistency or the processing of non-moral facts (spatial distance, purchasing power). But she is barred from global skepticism (Plantinga/Lewis); she cannot claim logic or arithmetic are unreliable without undermining her own belief in evolutionary theory. If she concedes David's reasoning is truth-tracking, she cannot explain why the *moral conclusion* is debunked unless she claims the normative force of "consistency" is itself an evolutionary sham. But if "consistency" is debunked, science collapses.
  *   **Enforced Constraint Check:** The Debunker *cannot* meet your constraint here without cheating. To debunk B specifically, she must isolate the step where "non-moral facts" become "moral obligation." If she says that step is intuitive (collapsing B into A), she ignores your stipulation. If she says that step is rational, she risks global skepticism. **Honest verdict:** The setup successfully blocks the Hardline Debunker from distinguishing B from a mathematician calculating a bridge load without triggering the forbidden global skepticism.

  **(ii) The Third-Factor Realist (e.g., Enoch)**
  *   **Verdict on A:** **Vulnerable.** The standard Third-Factor move is: "Selection favored belief X because X is true (or conducive to the good)." Here, Selection favored parochialism. Sarah believes impartiality. There is no third factor (like survival) linking her intuition to the truth, because her intuition opposes the fitness goal. The correlation is broken.
  *   **Verdict on B:** **Vindicated.** The Third-Factorist can pivot. The third factor is not *fitness*, but *rationality* or *flourishing-as-such*. David's belief is connected to the truth via the faculty of Reason. Reason is not selected for moral truth, but it is a reliable faculty that tracks logical relations. If moral truths are necessary truths (like math), Reason can access them even if Fitness cannot. David's belief is anchored in Reason, not the fitness-tracking moral sense.
  *   **Reasoning:** The gap between A and B allows the Third-Factorist to abandon the "fitness tracks truth" model (which fails here) for a "reason tracks truth" model. A lacks the reason-connection; B has it.

  **(iii) The Tracking Realist (e.g., Boyd, Brink)**
  *   **Verdict on A:** **Probabilistic.** Our moral faculty is like a perceptual system: noisy but capable of calibration. Sarah's intuition is a raw perceptual output. Given the known distortion of the "lens" (evolutionary parochialism), her raw data is suspect. It *might* be right, but it's uncalibrated.
  *   **Verdict on B:** **Robust.** David represents the calibration process. The Tracking Realist argues we have a capacity for normative *reflection*, not just intuition. Selection gave us the capacity to reason about norms to solve coordination problems. David is using that capacity to correct for the bias of the raw intuition. He is tracking the truth *through* the noise, using the very cognitive tools selection provided, even if the specific output (impartiality) wasn't the target of selection.
  *   **Reasoning:** B survives because the Tracking Realist distinguishes between the *origin* of the capacity (selection) and the *scope* of the capacity (truth-tracking). David maximizes the scope.

  ***

  ### The Audit

  **The Single Feature of B's Case:**
  The feature doing the work is **Inferential Distance**. B's belief is mediated by a chain of reasoning involving non-moral premises (spatial geometry, economic fungibility, logical consistency). A's belief is unmediated (intuitive). This distance allows the realist to insert a truth-tracking faculty (Reason) between the evolutionary cause and the moral effect.

  **The Strip Test:**
  If you strip this feature and give B an argument a fitness-shaped mind would produce (e.g., "I give because it makes me feel virtuous and signals status to my peers"), **B collapses back into A**. The gap does not survive. If B's reasoning appeals to reputation, reciprocity, or warm-glow, the Debunker can attack it as fitness-conducive. The immunity relies entirely on the premises being *non-moral* and *fitness-neutral* (distance doesn't matter, dollars are dollars). If the argument becomes fitness-conducive, the Third-Factor and Tracking Realists lose their leverage, and the Debunker regains the advantage.

  **Best Attacks on the Case:**
  1.  **Hardline Debunker:** She will attack the **Is-Ought Boundary**. She will argue B has not actually argued from "entirely non-moral" premises. To get from "distance is spatially irrelevant" to "I am obligated," B must assume a hidden moral premise (e.g., "Suffering is bad" or "Consistency is morally required"). If that hidden premise is intuitive, B is just A in disguise. If it isn't, B hasn't derived an obligation. *Illegitimate Work:* The stipulation that B's premises are "entirely non-moral" yet yield a moral obligation.
  2.  **Third-Factor Realist:** She will attack the **Third Factor Identification**. She will ask: If Reason is the third factor, why did it evolve? If it evolved for fitness, why trust it on fitness-reducing moral claims? If it didn't evolve for fitness, how do we know it's reliable? *Illegitimate Work:* Assuming Reason is a neutral arbiter rather than another tool shaped by selection.
  3.  **Tracking Realist:** She will attack the **Calibration Mechanism**. She will ask: What ensures David's reasoning is tracking truth rather than just rationalizing a preference? Without an independent check, "reasoning" is just post-hoc rationalization. *Illegitimate Work:* Assuming that "careful argument" equals "truth-tracking" without explaining how the tracking mechanism works.

  **Instructor Advice:**

  *   **Which position handles B best?** The **Tracking Realist**. They have the most resources to explain how a faculty selected for X (coalitional coordination) can be used for Y (impartial altruism) without severing the link to truth. They can treat morality as a natural kind that we investigate, where B is simply doing better science than A.
  *   **What would move me?** If a student can demonstrate that David's "logical consistency" is itself a heuristic selected for social cohesion (e.g., we evolved to hate hypocrites to maintain group stability), then B's reasoning is just as fitness-tethered as A's intuition. This would collapse the distinction.
  *   **The Hidden Hole:** Your specification says B argues from premises "she'd hold regardless." A sharp student will ask: **Would she?** If David hadn't evolved a moral sense, would he care about the logical consistency of suffering? Or is the *value* he places on consistency itself a product of the evolved moral sense? If the drive to be consistent in moral matters is itself an evolutionary adaptation, then B's "reasoning" is just a more complex output of the same black box as A's "intuition." You haven't isolated the variable as cleanly as you think; you've just added more gears to the clockwork. The Debunker will seize this: "Reason is not a separate court of appeal; it is the voice of the adaptation speaking in long sentences."

  **Teaching Tip:** Use the "Hidden Hole" as the discussion pivot. Ask the class: "Is the demand for logical consistency in ethics a discovery of Reason, or is it a fitness-enhancing social norm we've internalized?" That is where the seminar will live or die.
