answer: |-
  FOUNDATIONS OF PROBABILITY: THE INDIFFERENCE ROUTING TREE
  Graduate Seminar Handout

  STEP ONE: THE LOGICAL SPACE

  Answer the following six questions. Your pattern of answers determines your position.

  Q1. Ontology: Does the probability of a "random chord" denote a physical quantity waiting to be discovered, or a state of belief constrained by logic?
  Q2. Normativity: Is the Principle of Indifference a binding logical requirement for rational agents, or merely a defeasible heuristic?
  Q3. Specification: Does the problem description ("random chord") fail to specify a unique physical quantity, rendering the question ill-posed without further mechanism?
  Q4. Continuity: Does the paradox arise specifically from applying indifference to continuous parameters, or does it afflict finite partitions equally?
  Q5. Resolution: If indifference applies to continuous spaces, can mathematical invariance (symmetry groups) uniquely determine the correct measure?
  Q6. Source: If a unique prior is mandated, does the mandate arise from physical symmetries of the object or logical symmetries of the description?

  Incoherent Combinations:
  - (Q2=Heuristic AND Q5=Yes): If indifference is not binding, invariance cannot *determine* a unique rational prior.
  - (Q3=Ill-posed AND Q5=Yes): If the question is ill-posed, symmetry cannot solve it; it can only restate the ambiguity.
  - (Q4=Finite-Only AND Q5=Yes): Invariance solutions require continuous transformation groups; they cannot apply if continuous parameters are ruled out.

  STEP TWO: THE TREE

  Follow the path corresponding to your answers. Record your path as a string (e.g., 1A-2B-3A).

  NODE 1 (Q1): Is probability primarily a physical chance or an epistemic state?
    [A] Physical Chance -> Go to Node 2
    [B] Epistemic State -> Go to Node 3

  NODE 2 (Q3): Does "random chord" lack a unique answer without a specified selection mechanism?
    [A] Yes (Ill-posed without mechanism) -> Go to Node 4
    [B] No (Unique value exists) -> LEAF 1 (Frequentist)

  NODE 3 (Q2): Is Indifference a binding logical norm?
    [A] Yes -> Go to Node 5
    [B] No -> Go to Node 6

  NODE 4 (Q5): Can transformation invariance recover a unique physical measure from the problem statement?
    [A] Yes -> LEAF 2 (Jaynes)
    [B] No -> LEAF 3 (van Fraassen)

  NODE 5 (Q4): Does the paradox afflict finite partitions equally?
    [A] Yes -> LEAF 4 (Deflationary)
    [B] No (Continuous only) -> Go to Node 7

  NODE 6 (Q3): Is the problem ill-posed or simply under-constrained?
    [A] Ill-posed (No answer) -> LEAF 5 (Radical Subjectivist)
    [B] Under-constrained (Agent chooses) -> LEAF 6 (Permissive Subjectivist)

  NODE 7 (Q6): Does the norm arise from physical symmetry or logical description?
    [A] Physical Symmetry -> LEAF 2 (Jaynes) [Merged Path]
    [B] Logical Description -> LEAF 7 (Objective Equivocator)

  NODE 8 (Q4 - Alternative Branch): If Indifference is binding, is it restricted to finite sets?
    [A] Yes (Finite Only) -> LEAF 8 (Keynesian)
    [B] No -> Go to Node 7

  STEP THREE: THE LEAVES

  LEAF 1: Methodological Frequentist
  Probability is a property of repeatable physical setups, not propositions.
  Verdicts: (1) No answer without mechanism. (2) No answer without factory data. (3) Answer depends on long-run door frequencies.
  Awkward Commitment: Single-case probabilities (e.g., "this chord") are meaningless.

  LEAF 2: Transformation Group Objectivist (Jaynes)
  The problem is under-specified until invariance requirements are imposed; the prior falls out of the symmetry group.
  Verdicts: (1) 1/2 (by rotational/translation invariance). (2) Solved by scale invariance. (3) 1/3 (by permutation symmetry).
  Awkward Commitment: Identifying the "correct" symmetry group is not always algorithmically clear.

  LEAF 3: Constructive Empiricist (van Fraassen)
  The three answers reflect equally concrete refinements of a description too abstract to privilege any of them.
  Verdicts: (1) No unique answer; three models are equally valid. (2) No unique answer; depends on parameter choice. (3) 1/3 (language fixes partition).
  Awkward Commitment: There is no fact of the matter regarding which model is "true."

  LEAF 4: Deflationary Skeptic
  The paradox is unresolved and shows there are no non-trivial objective priors over continuous parameters.
  Verdicts: (1) Paradox stands; no solution. (2) Paradox stands; no solution. (3) Paradox stands; no solution.
  Awkward Commitment: Objective Bayesianism is impossible in almost all interesting cases.

  LEAF 5: Radical Subjectivist
  Nothing has gone wrong; no prior was ever rationally mandated, so any coherent assignment is permissible.
  Verdicts: (1) Agent's choice. (2) Agent's choice. (3) Agent's choice.
  Awkward Commitment: Two agents with identical evidence can rationally hold opposite certainties.

  LEAF 6: Permissive Subjectivist (de Finetti-style)
  Indifference is a useful psychological default but not a logical norm; coherence is the only constraint.
  Verdicts: (1) 1/3, 1/2, or 1/4 are all coherent. (2) Any distribution is coherent. (3) Any distribution summing to 1 is coherent.
  Awkward Commitment: Learning from data is not rationally compelled, only permitted.

  LEAF 7: Logical Equivocator (Williamson-style)
  Retains a norm of indifference but grounds it in a requirement to equivocate over logical atoms rather than physical symmetry.
  Verdicts: (1) 1/2 (by logical predicate symmetry). (2) 1/2 (edge length is primitive). (3) 1/3 (doors are primitive atoms).
  Awkward Commitment: Probabilities shift if the "primitive" language of description changes.

  LEAF 8: Restricted Indifference (Keynes)
  Indifference binds only over finite sets of mutually exclusive, indivisible alternatives.
  Verdicts: (1) Ill-posed (continuous space). (2) Ill-posed (continuous space). (3) 1/3 (finite alternatives).
  Awkward Commitment: Most scientific inference (involving continuous magnitudes) lacks logical foundation.

  STEP FOUR: THE EMPTY CELLS

  1. Path 1A-2B (Physical Chance + Unique Value without Mechanism): Incoherent. If probability is physical chance, it requires a generating mechanism to exist.
  2. Path 3A-5B-8A (Binding Norm + Continuous OK + Finite Only): Incoherent. "Continuous OK" and "Finite Only" are contradictory.
  3. Path 3A-5A (Binding Norm + Finite Paradox + No Leaf): Coherent but unattractive. This implies logic is broken everywhere. It costs the ability to do any inference.
  4. Path 1B-3B-6A (Epistemic + Not Binding + Ill-posed): Unexplored. Why would an epistemic state be "ill-posed"? To occupy this, one must argue that some propositions cannot be entertained.

  STEP FIVE: INSEPARABILITIES

  1. Jaynes (Leaf 2) and Frequentist (Leaf 1) threaten to collapse.
     Separation: Node 2 distinguishes them. The Frequentist says the math *cannot* yield an answer without a physical stipulation. Jaynes says the math *derives* the physical stipulation from the problem's symmetry. If you believe the symmetry *is* the physical mechanism, you are a Jaynesian; if you believe the symmetry is just a description of a mechanism you must supply, you are a Frequentist.

  2. Logical Equivocator (Leaf 7) and Jaynes (Leaf 2) share Node 7.
     Separation: Node 6 separates them. Jaynes relies on the physical object's invariance (rotation of the circle). The Equivocator relies on the language's invariance (swapping predicates). In the Cube Factory, Jaynes uses scale invariance of the volume; the Equivocator chooses "edge length" as the linguistically primitive predicate. They often agree, but their justifications differ fundamentally.
