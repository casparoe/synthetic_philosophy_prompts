answer: |-
  **DRAFT FOR PUBLIC COMMENT**
  **FEDERAL ELECTION COMPLIANCE COMMISSION**
  **INSTRUCTIONS FOR FORM 5-X**
  **STATEMENT OF ORGANIZATION FOR AN ENTITY WHOSE MAJOR PURPOSE IS NOT THE NOMINATION OR ELECTION OF FEDERAL CANDIDATES**

  **PURPOSE OF THIS FORM**
  Use Form 5-X to register an organization that engages in political activity but does not have the nomination or election of federal candidates as its major purpose. This form establishes the entity's status for reporting periods preceding the expenditure of funds. Filing this form pre-emptively ensures compliance with disclosure thresholds regarding independent expenditures and covered communications. An entity filing Form 5-X is not required to disclose the identities of individual contributors who fund independent expenditures, provided such contributions are not earmarked for specific candidates.

  **WHO MUST FILE / WHO NEED NOT FILE**
  **Who Must File:** Any organization, including a tax-exempt social welfare organization, that anticipates making independent expenditures or covered communications totaling less than fifty percent of its total expenditures during a reporting cycle.
  **Who Need Not File:** Political committees whose major purpose is the nomination or election of federal candidates. Such entities must file Form 1 instead. Entities making no expenditures related to federal elections need not file any form.

  **DEFINITIONS**
  **Major Purpose:** An organization's major purpose is determined by a quantitative analysis of its spending. If expenditures influencing federal elections constitute fifty percent or more of total expenditures, the entity is a political committee. If such expenditures constitute forty-nine percent or less, the entity retains non-committee status.
  **Express Advocacy:** A communication that uses explicit words such as "vote for," "elect," "support," "cast your ballot for," "Smith for Congress," "vote against," "defeat," or "reject."
  **Issue Advocacy:** A communication that discusses a public policy issue without explicitly advocating for the election or defeat of a clearly identified candidate. Communications referencing a candidate's position on an issue within ninety days of a primary election are covered communications unless they qualify for an exemption.
  **Coordinated Communication:** A communication is coordinated if it is created, produced, or distributed at the request or suggestion of a candidate or party, or if it involves substantial discussion between the spender and the candidate. Coordination also occurs if the spender employs a former employee of the candidate within one hundred twenty days of the communication, unless an internal firewall is established.

  **LINE-BY-LINE INSTRUCTIONS**

  **PART I: ORGANIZATIONAL IDENTITY**
  **Line 1:** Enter the full legal name of the organization.
  **Line 2:** Enter the street address. Do not use a post office box.
  **Line 3:** Indicate tax classification. Check the box for "501(c)(4) Social Welfare Organization" if applicable.

  **PART II: MAJOR PURPOSE CALCULATION**
  **Line 4:** Enter the estimated total expenditures for the calendar year.
  **Line 5:** Enter the estimated expenditures related to federal elections, including independent expenditures and covered communications.
  **Line 6:** Divide Line 5 by Line 4. Enter the percentage. If the result is 50.0% or higher, stop. File Form 1. If the result is 49.9% or lower, proceed to Part III.

  **PART III: ACTIVITY DESCRIPTION**
  **Line 7:** Describe the primary non-political purpose of the organization. Be specific. General descriptions such as "public welfare" are insufficient.
  **Line 8:** Describe the content of planned communications. Ensure language avoids express advocacy terms listed in the Definitions section. Communications may reference candidates provided the reference is tied to a policy position.
  **Line 9:** Indicate whether any staff members previously worked for a federal candidate or authorized committee. If "Yes," describe the internal firewall procedures implemented to prevent coordination.

  **PART IV: FUNDING SOURCES**
  **Line 10:** Indicate if funds are received from other organizations. If funds are received from a limited liability company, report the name of the limited liability company. Do not report the individuals who own the limited liability company unless those individuals earmarked funds for a specific candidate.
  **Line 11:** Indicate if any funds are earmarked. If funds are directed by a donor for the purpose of influencing a specific election, report the donor's identity. If funds are given for general use, do not report the donor's identity.

  **PART V: DISCLAIMER COMPLIANCE**
  **Line 12:** Confirm that all covered communications will include a disclaimer stating the communication is paid for by the organization and is not authorized by any candidate or candidate's committee.

  ***

  **WORKED EXAMPLE**

  > **Entity:** The Society for Municipal Sidewalk Joint Drainage (SMSJD)
  > **Total Budget (Line 4):** $100,000.00
  > **Research Costs (Line 4a):** $51,000.00 (Publication of refereed bulletin on drainage properties)
  > **Advertising Costs (Line 5):** $49,000.00 (Broadcast spots stating "Senator Jones opposes dry joints")
  > **Calculation (Line 6):** $49,000 / $100,000 = 49.0%
  > **Status:** SMSJD is not a political committee. SMSJD files Form 5-X. SMSJD reports the limited liability company "Dry Pavement Holdings LLC" as the funder of the advertising costs. SMSJD does not report the individuals who own Dry Pavement Holdings LLC.

  ***

  **COMMON FILING ERRORS**

  *   **Using Magic Words:** Stating "Vote Against Senator Jones" instead of "Senator Jones opposes dry joints." The former triggers express advocacy reporting requirements; the latter remains issue advocacy.
  *   **Ignoring the Content Window:** Running ads referencing a candidate outside the ninety-day window before an election without realizing the window has opened.
  *   **Firewall Failure:** Hiring a candidate's former campaign manager to run the organization's advertising department without documenting the separation of duties. This converts independent expenditures into coordinated expenditures, which are subject to contribution limits.
  *   **Mathematical Rounding:** Rounding 49.5% up to 50%. Do not round. Enter the exact decimal. 49.9% is compliant; 50.0% is not.

  **FREQUENTLY ASKED QUESTIONS**

  **1. When must Form 5-X be filed?**
  Form 5-X must be filed before making any expenditure that qualifies as an independent expenditure or covered communication. Pre-emptive filing is recommended upon incorporation.

  **2. What happens if our election-related spending exceeds fifty percent during the year?**
  If actual expenditures exceed the threshold, the organization must reclassify as a political committee within ten days and file Form 1. All prior donors must be disclosed retroactively if their funds were used for the excess expenditures.

  **3. If we inadvertently coordinated with a candidate because our firewall was porous, can we amend the firewall retroactively to cure the violation?**
  No. Coordination is determined at the time of the communication. However, you may file a corrected report acknowledging the expenditure as a coordinated communication rather than an independent expenditure, subject to contribution limits. If the limit is exceeded, the excess must be returned or donated to charity.

  ***

  **FOOTNOTES**
  ^1 See Advisory Opinion 2024-09 (Sidewalk Drainage Society), confirming that expenditures on advertisements referencing a candidate's stance on municipal infrastructure within sixty days of a general election constitute covered communications but do not establish major purpose if total spending remains below the statutory threshold.

  **CERTIFICATION**
  I certify that the information provided on this form is true, correct, and complete. I understand that providing false information may result in civil penalties and criminal prosecution under applicable laws.

  ____________________________________
  **Signature of Treasurer or Authorized Officer**

