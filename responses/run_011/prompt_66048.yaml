  ### Scratchpad: Candidate Principles

  1.  **Expected Utility Maximization.**
      *   *Principle:* An act is wrong if its expected disutility (probability × magnitude) exceeds the cost of abstention.
      *   *Breaking Case:* **Case 1 (Chicken).** You admit the probability of triggering a threshold order is vanishingly small. Under strict expected utility, the disutility is near-zero, making the act permissible. Your verdict ("Wrong") rejects this calculation.

  2.  **Pure Complicity Principle.**
      *   *Principle:* It is wrong to voluntarily participate in any practice that causes harm, regardless of marginal impact.
      *   *Breaking Case:* **Case 6 (Dead Button).** You are participating in the *practice* of torturing (pressing the button alongside others), yet you verdicted the disconnected button as "not wrong." Pure complicity cannot distinguish the live button from the dead one if the intention and participation are identical.

  3.  **Threshold Triggering Principle (Kagan-style).**
      *   *Principle:* An act is wrong only if it triggers a discrete threshold of harm (e.g., ordering another 1,000 chickens).
      *   *Breaking Case:* **Case 7 (Slave Labor).** You admit the supply is fixed; your purchase cannot extend enslavement by an hour. No threshold is triggered. Yet you verdicted it "Wrong." This principle would exonerate you, contradicting your intuition about complicity in fixed-supply exploitation.

  ***

  ### The Best Principle: The Principle of Non-Trivial Complicity

  I propose a hybrid principle that attempts to unify your intuitions by distinguishing between *structured* harm and *diffuse* harm, while respecting epistemic limits.

  **Statement:**
  An act is morally wrong if it constitutes **voluntary participation** in a **Structured Harmful Practice**, unless the agent satisfies one of three **Exemption Clauses**.

  **Definitions:**
  *   **Voluntary Participation:** The act is intentional and avoids coercion.
  *   **Structured Harmful Practice:** A cooperative or market scheme where harm is produced via identifiable thresholds (e.g., animal slaughter) or direct exploitation (e.g., slave labor), rather than mere aggregate entropy (e.g., background carbon).
  *   **Exemption Clause A (Epistemic Inertia):** The agent *knows* their act is causally inert (e.g., the button is disconnected).
  *   **Exemption Clause B (Diffuse Aggregation):** The harm is purely accumulative, and the individual contribution is indistinguishable from background noise *and* the victim is not identifiable.
  *   **Exemption Clause C (Disproportionate Cost):** The cost of abstention is significantly disproportionate to the specific moral weight of the act (applies primarily to duties to aid, not duties not to harm).

  **Clause-by-Clause Account of Your Cases:**

  *   **Case 1 (Chicken):** **Wrong.** Fits "Structured Harmful Practice" (market thresholds for slaughter). No exemption applies (cost is low, not known inert).
  *   **Case 2 (Beef):** **Less Wrong.** Fits "Structured Harmful Practice," but triggers **Exemption Clause B (Diffuse Aggregation)** partially. GHG is accumulative/entropy-based, not a discrete threshold per patty like chicken death. The "Identifiable Victim" constraint within the definition reduces wrongness compared to Chicken.
  *   **Case 3 (Voting):** **Permissible (to skip).** Fits "Structured Harmful Practice" (democracy), but triggers **Exemption Clause C (Disproportionate Cost).** This is a duty to aid (benefit), not harm. 35 minutes/gas is disproportionate to the low probability of causal impact.
  *   **Case 4 (2000 Emails):** **Wrong.** Fits "Structured Harmful Practice" (targeted harassment). **Exemption Clause B** fails because 1/2000 is detectable/significant relative to the victim's distress.
  *   **Case 5 (4 Million Replies):** **Not Wrong.** Fits "Structured Harmful Practice," but triggers **Exemption Clause B.** At 1/4,000,000, the contribution is indistinguishable from background noise.
  *   **Case 6 (Torturers):** **Live Button = Wrong.** Structured harm. **Dead Button = Not Wrong.** Triggers **Exemption Clause A (Epistemic Inertia).** You specified the agent *knows* it's disconnected.
  *   **Case 7 (Slave Labor):** **Wrong.** Fits "Structured Harmful Practice" (direct exploitation). **Exemption Clause B** fails because victims are identifiable (enslaved people), unlike diffuse climate harm.
  *   **Case 7 (Taxes):** **Not Wrong.** Triggers **Exemption Clause B.** General fund is diffuse aggregation; link to specific unjust harm is too mediated.
  *   **Case 8 (Offsets):** **Known Fraud = Wrong.** Violates voluntary participation (deceptive). **Unknown = Not Wrong.** Triggers **Exemption Clause A** (lack of knowledge prevents culpable participation).
  *   **Case 9 (Lawn):** **Not Wrong.** Triggers **Exemption Clause B** (rounding error). **Ostentatious = Wrong.** Shifts from water use to "Structured Harmful Practice" of social defiance/exemplification.

  ***

  ### Predictions on New Cases

  1.  **Buying shares of an oil company on the secondary market:** **Not Wrong.**
      *   *Reasoning:* Triggers **Exemption Clause A (Epistemic Inertia)** regarding capital flow. No money reaches the company to fund new drills. It is causally inert regarding production, and while it supports share price, that is too diffuse (Clause B) to count as structured harm participation.
  2.  **Having a child (in a high-consumption context):** **Wrong.**
      *   *Reasoning:* Fails all exemptions. It is a voluntary participation in a structured practice of carbon emission. It is not inert, not diffuse (a whole human's footprint is significant), and while cost is high, the "harm" (climate impact) is severe enough to outweigh the parental desire in this strict framework.
  3.  **Running a hundred thousand model queries:** **Wrong.**
      *   *Reasoning:* Fails **Exemption Clause B.** While one query is diffuse, 100,000 is a detectable load on energy infrastructure. It crosses the threshold from "background noise" to "significant contribution."
  4.  **Streaming a song that pays the artist fractions of a cent:** **Not Wrong.**
      *   *Reasoning:* Triggers **Exemption Clause A & B.** Supply is fixed (artist recorded it already); payment is fractional and aggregated. Your stream is causally inert regarding the artist's income threshold and is diffuse aggregation.
  5.  **The last avocado in a store with a fixed weekly order:** **Wrong.**
      *   *Reasoning:* Fails **Exemption Clause A.** While the order is fixed, buying the *last* one signals demand for the *next* order more strongly than buying the first one. It is a threshold signal. Also, if the alternative is waste, it's complex, but assuming restock, it participates in the structured market harm (water use/labor).

  ***

  ### The Cost: Which Verdict Must Go?

  I cannot save **Case 5 (The 4 Million Pile-On)** without making the principle arbitrary.

  My principle relies on **Exemption Clause B (Diffuse Aggregation)** to exonerate the 4-millionth pile-oner while condemning the 2,000th emailer. But this is a Sorites paradox. There is no non-arbitrary line where "diffuse" becomes "significant." If 2,000 people harming a journalist is wrong, then 4 million people doing the same thing is 2,000 times *more* harm, not less. Your intuition that the individual is *less* culpable in the larger group relies on the psychological feeling of anonymity, not moral mathematics.

  To maintain logical consistency, you must admit that **Case 5 is Wrong.** If the journalist suffers agony from the pile-on, every contributor is morally liable for a fraction of that agony. The scale of the crowd does not exonerate the individual; it only hides them. Holding the 4-millionth person innocent while condemning the 2,000th is an inconsistency driven by the difficulty of imagining large numbers, not a principled distinction. You should feel the same guilt in both cases, proportional to the harm caused.

  ***

  ### The Diagnosis: Two Different Questions

  However, if you refuse to sacrifice Case 5 (and I suspect you will, because the guilt feels genuinely different), then no single principle covers this set. You are answering two different questions depending on the case, and toggling between them creates the illusion of inconsistency.

  **Question 1: Did I Make a Difference? (Causal View)**
  *   *Logic:* Wrongness depends on marginal impact.
  *   *Cases:* 3 (Voting), 6 (Dead Button), 8 (Offsets), 9 (Lawn).
  *   *Verdict:* If your act changes nothing, you are not wrong (or less wrong). This saves the Dead Button and the Lawn, but fails the Chicken (Case 1).

  **Question 2: Am I Implicated? (Complicity View)**
  *   *Logic:* Wrongness depends on joining a harmful practice, regardless of impact.
  *   *Cases:* 1 (Chicken), 4 (Emails), 7 (Slave Labor).
  *   *Verdict:* If you join the practice, you are wrong. This saves the Chicken and Slave Labor, but fails the Dead Button (Case 6) and Taxes (Case 7).

  **The Split:**
  Your intuitions switch based on **Identifiability.**
  *   When the victim is **Identifiable** (The Chicken, The Journalist, The Slave), you use the **Complicity View**. You feel tainted by the connection, regardless of impact.
  *   When the victim is **Diffuse/Abstract** (The Climate, The Election, The General Fund), you use the **Causal View**. You demand proof of impact before accepting guilt.

  **The Pile-On Problem (Case 5):**
  Case 5 is the conflict point. The victim is identifiable (the journalist), suggesting Complicity View (Wrong). But the crowd is diffuse, suggesting Causal View (Not Wrong). Your verdict ("Not Wrong") shows that when the crowd gets large enough, you switch to the Causal View even for identifiable victims.

  **Conclusion:**
  You do not have one principle. You have a **Lexical Priority Rule**:
  1.  Check for **Identifiable Victims**. If present, default to **Complicity** (Wrong).
  2.  Check for **Causal Inertia**. If known, override to **Not Wrong**.
  3.  Check for **Scale**. If the contributing group is massive (>1 million), switch to **Causal View** (Not Wrong) even if victims are identifiable.

  This explains everything, but it admits that your moral philosophy is context-dependent, not universal. You treat small-group harm as complicity and large-group harm as statistics. That is a stable position, but it is not a single principle.
