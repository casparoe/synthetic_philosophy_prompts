  You're a moral philosopher who works on collective harm — the inefficacy objection, thresholds, the whole thing — and you've actually thought hard about the cases rather than just repeating the two standard moves. Think carefully. I want you to help me do reflective equilibrium on my own gut verdicts, and I want to know whether there's a principle underneath them or whether I'm just inconsistent.

  Here's the set. Verdicts are mine and I'm not going to defend them yet.

  1. Chicken breast from a supermarket. I think eating it is wrong — not "suboptimal," wrong. Even though I accept the supply chain restocks in batches of thousands and my one purchase has essentially no chance of changing how many birds get raised this quarter.

  2. Beef patty in the same slot, same price, roughly 20x the greenhouse gases, no individual animal whose death I can point to. I think the chicken is worse. I know how that looks.

  3. Driving 35 minutes to vote in a state where my party wins by 25 points. I think voting matters in some sense that isn't just expressive, and I'd feel bad skipping it. But I also think it's faintly obsessive to drive 35 minutes to do it, and I'd think less of someone who missed their niece's recital for it. So: matters, but not worth 35 minutes of gas and time. I know that's incoherent under expected value.

  4. I'm one of 2,000 people who each send a single abusive email to a local journalist. Obviously wrong. "Your one email made no detectable difference to her" does nothing to me here.

  5. Same shape, bigger: I'm one of four million who each post one dismissive reply in a pile-on. Much less wrong — maybe not wrong at all. I'd feel like a pedant agonizing over it.

  6. Parfit's harmless torturers: a thousand people each press a button that adds an imperceptible increment to one victim's pain; together it's agony. I agree each does wrong. But now the variant where the thousandth button is disconnected and does literally nothing. I don't think that one harms anyone — maybe he's a bad guy, but he didn't do it. And since I can never check whether I'm a live button or a dead one, I want to say my moral status shouldn't hinge on a fact I can't inspect… but I also don't want my ignorance to upgrade me to fully-live-button guilt. This is the pair I most want you to attack.

  7. Buying a phone containing a component made by people who are already enslaved, supply fully fixed, my purchase cannot extend anyone's enslavement by an hour. Still wrong, I think. But my taxes partly fund a war I consider unjust, out of a general fund, and I feel no comparable taint. I can't say what the difference is. Directedness? Identifiability of the victims?

  8. Carbon offsets for a flight. If I know the project would have happened anyway, buying the offset feels like moral fraud — worse than not buying. If I simply don't know, buying it seems fine and I shouldn't have to investigate. So again an epistemic condition is doing all the work.

  9. Watering my lawn during a drought that ends in three weeks no matter what. Not wrong, it's a rounding error, nobody is harmed. But the guy who does it ostentatiously is doing something wrong, and I don't really believe that's just about setting an example.

  My tentative principle, which I suspect is broken: an act is wrong when it is part of a set of acts that together cause serious harm AND you don't know that your own act is a no-op. Please test it, try to repair it, or throw it out.

  Do this: brainstorm first, out loud, in a short scratchpad — three or four candidate principles, each with the case from my list that breaks it — before you commit to anything. Then give me your best one or two principles stated precisely, with terms defined, and a clause-by-clause account of which of my cases each clause exists to handle. Then run them on cases I didn't list: buying shares of an oil company on the secondary market where no money reaches the company; having a child; running a hundred thousand model queries; streaming a song that pays the artist fractions of a cent; the last avocado in a store with a fixed weekly order. Predictions, please, not hedges.

  Finally, be honest about the cost: tell me exactly which of my verdicts the principle cannot save, and if the simplest version forces me to give one up, say which one and defend that in a real paragraph — my guess is it's 3 or 5. And if your conclusion is that no single principle covers all of this because I'm actually answering two different questions ("did I make a difference" vs. "am I implicated"), say so plainly and sort my nine cases into the two piles.

  No bibliography, no reading list, no citations — I can't look anything up. Parfit and Kagan are the only names I need you to mention, and only where it helps.
