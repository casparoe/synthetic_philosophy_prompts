      *   **What the Metaphor Imports/Drops:**
          *   *Imports:* Determinism. The idea that output is strictly a function of structure.
          *   *Drops (Arendt's actual point):* Moral agency. Arendt insisted Eichmann *could* have thought, but *chose* not to. She didn't absolve him; she convicted him. The psychologist drops the *judgment* while keeping the *explanation*.
      *   **Does the Conclusion Survive?**
