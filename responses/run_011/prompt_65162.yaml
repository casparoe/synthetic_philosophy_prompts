  3.  **Deconstruct the Historian's Objection:**
      *   *Fact:* Eichmann claimed to be a cog (defense strategy).
      *   *Arendt's View:* "Banality of Evil" = thoughtlessness/inability to think from others' standpoint, *not* mere functionary status. She upheld legal responsibility despite the bureaucracy.
      *   *Empirical:* Later evidence (Sassen interviews) shows Eichmann was an ideologue, not just a functionary.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. The psychologist's pitch vs. the historian's correction.
      *   **Correspondence Table:** Map the mechanical metaphor to the corporate reality.
          *   Cog -> Mid-level employee (compliance, engineer).
          *   Machine -> The bureaucracy/process.
          *   Designer -> Executives/Architects (often absent or diffuse).
          *   Friction/Lubrication -> Regulations/Incentives.
