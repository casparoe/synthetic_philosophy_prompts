  **REPUBLIC OF OSTRAL // MINISTRY OF CULTURE & HERITAGE**
  **NATIONAL ARCHIVES OF MERIDIAN**
  **ACCESSION RECORD 92-044**

  **Date:** 14 November 1992
  **Source:** Colonial Liquidation Commission, Port Meridian District Office
  **Transfer Type:** Administrative Records (Pre-Independence)
  **Condition:** Variable. Water damage noted on Boxes 12–15. Mildew odor present.
  **Scope:** Harbor Master Logistics, 1953–1958. Includes payroll registers, gate passes, disciplinary logs, and ration allocation sheets.
  **Processing Archivist:** E. Voss.
  **Note:** Do not separate series. Original order reflects colonial administrative hierarchy. Retain folder headings exactly as found, including pejorative terminology, for context.

  ***

  **FINDING AID: SERIES 104 (HARBOR LABOR)**
  **Box 12 // Folder 3: Unskilled Crew – Lighter Division**
  **Extent:** 0.4 linear feet
  **Dates:** 1954–1957

  **Scope and Content Note:**
  Contains daily attendance registers and monthly payroll vouchers for casual laborers employed on harbor barges. Names are recorded as needed for payment processing. No personnel files exist. Identity is established only through fiscal transaction.

  **Item Level List:**
  *   **104.12.03.01:** Payroll Register, June 1954. Entries 40–60.
  *   **104.12.03.02:** Payroll Register, December 1954. Entries 40–60.
  *   **104.12.03.03:** Disciplinary Form 44-B, "Omeni, K." Date: 14 August 1955.
  *   **104.12.03.04:** Gate Pass Log, Issued/Returned. 1955–1956.
  *   **104.12.03.05:** Ration Allocation Sheet, Q3 1956.

  ***

  **EXTRACT: PAYROLL REGISTER (104.12.03.01)**
  **Period:** 01 June 1954 – 30 June 1954
  **Currency:** Ostral Shillings

  | Line | Name | Role | Days Worked | Rate | Deductions | Net Pay | Signature |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 42 | Omeni, K. | Lighter | 26 | 5.00 | Uniform (1.00) | 129.00 | [Mark] |
  | 42 | Omini, K. | Lighter | 24 | 5.00 | None | 120.00 | [Mark] |
  | 42 | Omeni, Kaleb | Lighter | 0 | 5.00 | Absent (26) | 0.00 | — |

  **Extract: Disciplinary Form 44-B (104.12.03.03)**
  **Subject:** Omeni, K.
  **Offense:** Failure to report for 0600 shift.
  **Witness Statement:** Foreman states subject was found sleeping on dock.
  **Penalty:** Half-day pay forfeiture.
  **Subject Comment:** [Field Left Blank]
  **Authorized By:** H. G. Sterling, Harbor Master.

  **Extract: Gate Pass Log (104.12.03.04)**
  **Entry 892:** Pass Issued to Omeni, K. Date: 12 Jan 1956. Purpose: Medical. Returned: Yes.
  **Entry 905:** Pass Issued to Omeni, K. Date: 14 Jan 1956. Purpose: Personal. Returned: No.
  **Note:** Pass 905 never logged as returned. File closed 1958.

  ***

  **INDEX OF NATIVE COMPLAINTS (SERIES 99)**
  **Entry 004:**
  **Date:** 10 August 1955
  **Complainant:** Omeni, K.
  **Nature:** Wage withholding regarding holiday pay.
  **Resolution:** Unresolved. File closed due to lack of supporting documentation.
  **Cross-Reference:** See Series 104, Box 12, Folder 3.

  ***

  **INTERNAL MEMORANDUM**
  **To:** Cataloguing Division
  **From:** Elara Voss, Senior Archivist
  **Date:** 03 March 2023
  **Subject:** Metadata Standards for Series 104

  Per the new digitization protocol, we are required to normalize name variants in the public finding aid to assist genealogical research. The subject "Omeni, K." appears in Box 12 with three spelling variations (Omeni, Omini, Omeni Kaleb). Standard practice dictates merging these under a single authorized heading (e.g., "Omeni, Kaleb").

  I am requesting an exception to this rule.

  Merging these variants implies a continuity of identity that the records do not support. The administration did not know who this man was; they knew only a labor unit that occasionally failed to align with their orthography. To correct the spelling is to correct the history of his erasure. It suggests the archive failed to capture him, rather than acknowledging the archive was designed not to see him.

  **Decision:** Do not merge. List each spelling variation as a distinct entry in the digital index. Link them with a metadata tag: `[PROBABLE ASSOCIATION ONLY]`. Add a Scope Note to Folder 3: "Identities herein are fiscal constructs. No biographical verification exists."

  This will frustrate researchers. It is necessary.

  ***

  **CORRESPONDENCE: ACCESS REQUEST**
  **From:** Dr. A. Ndiaye, University of Kaelo
  **To:** National Archives of Meridian
  **Date:** 10 May 2023
  **Re:** Request for Series 104 (Genealogy Project)

  **Response Letter (Draft)**
  **From:** E. Voss
  **Date:** 15 May 2023

  Dear Dr. Ndiaye,

  Regarding your request for biographical data on harbor workers 1950–1960: Please note that Series 104 contains no personnel files. The individuals listed appear solely as line items in expenditure logs.

  Furthermore, per Cataloguing Decision 2023-03, name variants have not been normalized. You will find "Omeni, K." and "Omini, K." listed separately. We cannot confirm these refer to the same individual, though fiscal patterns suggest a single labor unit. We advise against citing these records as proof of identity. They are proof of payment.

  Sincerely,
  Elara Voss
  *Senior Archivist*

  ***

  **LOG ENTRY: MISFILED DOCUMENTS**
  **Date:** 22 August 2023
  **Processor:** E. Voss
  **Location:** Basement Storage, Row 4 (Flood Zone)

  **Item:** Envelope marked "Personal Effects – Lighter Crew."
  **Action:** During re-housing of Box 12, one photograph was found tucked inside Payroll Register 104.12.03.02. Subject appears to be a group of men on a dock. Faces obscured by water damage from 1998 flood.
  **Disposition:** Photo separated from textual records. Moved to Series 900 (Unidentified Fragments).
  **Note:** By separating the image from the payroll, we have preserved the photograph's integrity but severed its only context. It is now a clean artifact of nothing. The payroll remains a dirty record of everything.

  **Status:** Closed.

  ***

  **Craft Note**

  This story lands on the position that a life like Omeni's is *not* recoverable without re-inscribing the categories that erased him. Even Voss's "resistance"—refusing to normalize the name—is an archival act of power. She decides what silence looks like. By marking the identity as a "fiscal construct," she creates a new authority record that future researchers will cite as truth, potentially obscuring the fact that she, too, is guessing. The story argues that the archive is not a vessel for truth but a machine for producing specific kinds of legibility; you cannot use the machine to dismantle itself.

  I have taken liberties. Real archivists rarely have the autonomy to alter finding aid logic based on philosophical objections; backlog and standards usually dictate normalization. I've romanticized Voss's agency. Additionally, the coherence of the files is fictional; in reality, the "silence" is often just chaotic rot, not a precise structural exclusion. The "Misfiled Note" ending is a narrative device to provide closure; in practice, the photo would likely just be lost in a box, never logged with such poetic symmetry. I prioritized the *argument* of the form over the mundane reality of records work, where the tragedy is usually boredom, not epistemology.
