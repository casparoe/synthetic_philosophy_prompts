  **SEMINAR HANDOUT: The Threshold Stress Programme (1950–1985)**

  **Research Programme:** Fluvial Sediment Transport
  **Hard Core:** Sediment motion initiates only when boundary shear stress exceeds a critical value determined by grain interlocking.

  **Timeline of Theories and Data**

  **T1 (1950):** *The Standard Threshold Model.*
  Establishes baseline critical stress values for uniform grain sizes. No novel predictions; systematizes existing field observations from 1940–1949.

  **T2 (1955):** *The Shape-Factor Modification.*
  **Modification:** Introduces grain angularity coefficient to the stress equation. Independently motivated by new microscopy techniques.
  **Prediction:** Predicts a specific 'Suspension Threshold' (ST) for 20mm quartz gravel at 1.5 m/s flow.
  **Datum Status:**
  *   *Documented:* 1956 (Field measurement, public).
  *   *Accepted:* 1957 (Consensus).
  *   *Knowledge State:* Unknown at T2 proposal (1955).

  **T3 (1963):** *The Turbulence Scaling Theory.*
  **Modification:** Incorporates turbulent burst frequency into shear stress calculation. Independently motivated by fluid dynamics analogies.
  **Prediction:** Predicts an 'Armour Breakdown Velocity' (ABV) of 2.4 m/s for 50mm gravel.
  **Datum Status:**
  *   *Documented:* 1962 (Hydraulics Laboratory Report #402, internal circulation only).
  *   *Accepted:* 1965 (Published in *Journal of Geology*).
  *   *Knowledge State:* The 1962 measurement was known to three lab technicians but absent from public literature. T3 author (Dr. Aris) had no access to Report #402.

  **T4 (1985):** *The Coefficient Adjustment.*
  **Modification:** Adjusts turbulence coefficients to align with T3 anomalies. Independently motivated by computational efficiency requirements.
  **Prediction:** No novel predictions; fits existing ST and ABV data.
  **Datum Status:**
  *   *Documented:* 1962–1956 (Pre-existing data).
  *   *Accepted:* 1985 (Immediate fit).
  *   *Knowledge State:* All data public prior to T4 proposal.

  ***

  **INSTRUCTOR NOTES AND ANALYSIS**

  **1. Application of Lakatosian Criteria**

  *   **Shift 1 (T1 → T2):**
      *   *Excess Content:* Yes (predicts ST).
      *   *Corroboration:* Yes (1956).
      *   *Temporal Novelty:* Fact unknown in 1955. **Verdict: Empirically Progressive.**
      *   *Use Novelty:* Fact not used in construction. **Verdict: Empirically Progressive.**
      *   *Result:* Unambiguous Progress.

  *   **Shift 2 (T2 → T3):**
      *   *Excess Content:* Yes (predicts ABV).
      *   *Corroboration:* Yes (1962/1965).
      *   *Temporal Novelty:* Fact documented 1962 (known to technicians). T3 proposed 1963. Fact was known to *someone*. **Verdict: Degenerating** (accommodation of known fact).
      *   *Use Novelty:* Fact not used by Aris (no access to Report #402). **Verdict: Empirically Progressive** (novel prediction relative to theory construction).
      *   *Result:* **Divergence.** Temporal reading condemns; Use reading approves.

  *   **Shift 3 (T3 → T4):**
      *   *Excess Content:* No (fits old data).
      *   *Corroboration:* N/A.
      *   *Temporal Novelty:* None. **Verdict: Degenerating.**
      *   *Use Novelty:* None. **Verdict: Degenerating.**
      *   *Result:* Unambiguous Degeneration (via novelty bookkeeping, not ad-hocery).

  **2. Snapshot vs. Retrospective Assessment**

  *   **Snapshot (1963, 8 years after T2):**
      T3 is just proposed. The ABV datum (1962) is internal. Publicly, ABV is unknown.
      *   *Temporal:* Appears Progressive (fact appears unknown to the community).
      *   *Use:* Appears Progressive.
      *   *Empirical:* Corroboration not yet public. Verdict suspended pending acceptance.
  *   **Retrospective (1988, 25 years after Snapshot):**
      Report #402 is archived and known.
      *   *Temporal:* Verdict shifts to Degenerating (fact was known in 1963).
      *   *Use:* Verdict remains Progressive.
      *   *Lesson:* Historical verdicts depend on the archive's completeness. The "known to anyone" clause is sensitive to unearthed documents.

  **3. The Divergence Feature**

  *   **Feature:** The existence of an unpublished, inaccessible datum known to a minority subset of the community.
  *   **Variation:** If Report #402 never existed, both readings yield Progressive. If Report #402 was published in 1962, both readings yield Degenerating. The divergence relies entirely on the gap between *community knowledge* (Temporal) and *theorist knowledge* (Use).

  **4. Strongest Reply to the "Bad" Verdict (Temporal Degeneration)**

  *   **Reply:** A defender of Temporal Novelty argues that science is a public enterprise; if *anyone* knows the fact, it is part of the background knowledge against which the theory must prove its worth. Aris's ignorance is irrelevant; the theory did not extend the *community's* empirical horizon.
  *   **Assessment:** This rescues the criterion's objectivity but sacrifices its heuristic value. It penalizes independent rediscovery, potentially labeling fruitful lines of inquiry as degenerating simply because a forgotten report exists in a drawer. It restates the priority of public record over cognitive process.

  **5. Plausibility Honesty Check**

  *   **Verdict:** Plausible but engineered.
  *   **Reasoning:** Real disciplines rarely have such clean hard cores or discrete theory replacements; modifications are usually continuous. The "internal report known to three people" is a classic archival trope that happens, but building a whole case around it requires suppressing the usual flow of pre-prints and conferences. However, mid-century hydraulics was fragmented enough between engineering labs and geology departments that this information silo is historically credible. The constraint forcing exactly one divergent shift required tightening the timeline so T3 arrived before the 1962 data was published but after it was measured.
