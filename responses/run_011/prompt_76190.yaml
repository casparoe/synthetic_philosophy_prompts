answer: |-
  **The Case: The Compliance Audit**

  You are the senior partner at a boutique investment firm deciding whether to execute a high-frequency trade ($T$) or hold ($H$). The market is either Stable ($S$) or Volatile ($V$). Your prior is $P(S) = 0.9$ and $P(V) = 0.1$. Your utility function is defined over the financial outcome: $U(T, S) = 100$, $U(T, V) = -400$, and $U(H, \cdot) = 0$. You are offered a costless compliance audit ($A$) that returns a signal: Clear ($C$) or Flag ($F$). The audit is evidentially relevant: $P(C|S) = 0.8$ and $P(C|V) = 0.3$. However, firm bylaws stipulate that if an audit is conducted, a Clear result triggers an automatic archival protocol forcing you to Hold, whereas a Flag result escalates the file to you for discretionary decision. If no audit is conducted, you retain full discretion.

  **The Calculations**

  **1. Decision Without Information (Act Now)**
  *   Expected Utility of Trade: $E[U(T)] = 0.9(100) + 0.1(-400) = 90 - 40 = 50$.
  *   Expected Utility of Hold: $E[U(H)] = 0$.
  *   **Optimal Act:** Trade. **Expected Utility:** **50**.

  **2. Decision With Information (Wait)**
  *   **Marginal Probability of Signals:**
      *   $P(C) = P(C|S)P(S) + P(C|V)P(V) = (0.8)(0.9) + (0.3)(0.1) = 0.72 + 0.03 = 0.75$.
      *   $P(F) = 1 - 0.75 = 0.25$.
  *   **Posterior Probabilities:**
      *   $P(S|C) = \frac{0.72}{0.75} = 0.96$.
      *   $P(S|F) = \frac{0.18}{0.25} = 0.72$.
  *   **Optimal Choices per Cell:**
      *   **If Clear:** Bylaw forces Hold. Utility = **0**. (Note: Unconstrained optimal would be Trade, since $0.96(100) + 0.04(-400) = 80 > 0$).
      *   **If Flag:** Discretion allowed. $E[U(T)|F] = 0.72(100) + 0.28(-400) = 72 - 112 = -40$. Optimal act is Hold. Utility = **0**.
  *   **Expected Utility of Waiting:**
      *   $E[U(Wait)] = P(C) \cdot U(\text{Forced } H|C) + P(F) \cdot U(\text{Optimal } H|F)$
      *   $E[U(Wait)] = 0.75(0) + 0.25(0) = \mathbf{0}$.

  **Result:** $0 < 50$. The expected utility of waiting for the free, relevant information is strictly lower than acting immediately.

  ***

  **Diagnosis**

  **Violated Hypothesis:** The case violates the **Action Set Invariance** hypothesis (sometimes called the "Constant Menu" assumption). Good's Theorem assumes that the set of physically available acts $A$ is identical whether the agent observes the evidence or not. In this scenario, the set of available acts depends on the evidence cell: $A_C = \{Hold\}$ while $A_F = \{Hold, Trade\}$.

  **The Broken Step:** The convexity argument relies on the inequality $\sum_e P(e) \max_{a \in A} E[U(a)|e] \geq \max_{a \in A} \sum_e P(e) E[U(a)|e]$. This holds because the $\max$ operator is applied over the *same* set $A$ in every term on the left-hand side. In my case, the left-hand side is actually $\sum_e P(e) \max_{a \in A_e} E[U(a)|e]$. Because $A_C \subset A$, the term for cell $C$ is artificially suppressed ($0$ instead of $80$), breaking the inequality.

  **Repaired Version:** Remove the bylaw constraint. If the audit returns Clear, the partner retains discretion.
  *   **New EU(Wait):** $0.75(\text{Optimal } T|C) + 0.25(\text{Optimal } H|F)$.
  *   $E[U(T)|C] = 0.96(100) + 0.04(-400) = 80$.
  *   $E[U(Wait)] = 0.75(80) + 0.25(0) = 60$.
  *   **Result:** $60 > 50$. The theorem holds.

  ***

  **The Adversary**

  **Strongest Objection:** "You have changed the decision problem, not the value of information. The 'cost' of the information is the loss of discretion in the Clear branch. This is an opportunity cost, which you stipulated away."

  **Verdict:** This objection **lands**. The constraint functions exactly like a cost. By defining "costless" as "no money, time, attention, risk, or foregone opportunity," the prompt technically forbids this case if "foregone opportunity" includes "loss of procedural discretion." However, in legal and bureaucratic contexts, a *rule* is distinct from a *cost*. A cost is a resource deduction; a rule is a feasibility constraint. The pre-law students will conflate the two, which is precisely why the case is pedagogically useful: it forces them to distinguish between *paying* to act and being *forbidden* to act.

  **Secondary Objection:** "The utility function implicitly references the epistemic situation because the outcome 'Hold' has different causes in the two branches."
  **Verdict:** This **does not land**. The utility is defined over financial outcomes (Trade/Stable, etc.), not the process. $U(Hold)$ is 0 regardless of whether it was chosen or forced.

  **Theorem Restatement:** "For a Bayesian agent, free information is always worth waiting for, **provided that acquiring the information does not restrict the set of available acts or alter the causal consequences of those acts.**"

  ***

  **Final Notes**

  **Feature Doing the Real Work:** The **state-dependent availability of acts**. The information acts as a switch that locks the agent into a suboptimal subset of actions in the most probable cell (Clear).

  **If Weakened:** If the bylaw were probabilistic (e.g., "Clear triggers archival with 50% probability"), the expected utility of waiting would rise, eventually crossing back above 50 as the constraint weakens. The negative value of information is proportional to the probability of the constraint biting multiplied by the utility gap between the forced act and the optimal act.

  **Likely Student Misdiagnosis:** A student who gets the arithmetic right will likely claim the **Prior was Wrong**. They will argue, "If you knew the audit would force you to Hold, you should have updated your prior to reflect that constraint before calculating EU(Now)." This is incorrect; the constraint is conditional on the *act of waiting*, not on the state of the world. The error reveals a confusion between *states* (which priors describe) and *decision structures* (which define the game).
