      **MEMORANDUM**
      **TO:** Board of Directors
      **FROM:** [Your Name]
      **DATE:** October 24, 2023
      **SUBJECT:** Recommendation Regarding AI Companion Vendor Proposal

      **Recommendation**
      I recommend we reject the vendor's proposal to install AI companion tablets in resident rooms. This is not a compromise position. It is a refusal to trade staffing for surveillance, and a refusal to define care as something a machine can provide.

      **The Budget Reality**
      We must start with the nurse's observation during the last meeting. It was uncomfortable because it was true. Our budget for the next fiscal year already assumes a reduction in aide hours. If we adopt this system, the "freed-up staff time" will not be reinvested in resident interaction; it will be deleted from the ledger. The vendor costs roughly the same as two part-time aides per house. Therefore, the choice is not between "staff plus tablets" and "staff alone." It is between "human staff" and "digital monitors."

      We are in a financial crunch. I know this. We all feel the pressure to modernize and stretch dollars. But efficiency cannot be our only metric. If we approve this, we are effectively voting to reduce human contact in the houses. We cannot claim this technology supplements care when the budget structure ensures it replaces it.

      **Surveillance and Consent**
      Beyond the budget, the functionality of the device presents an ethical barrier. The system listens all day. It analyzes speech patterns and mood, sending reports to families. For residents with moderate to severe dementia, informed consent is impossible. They cannot understand that their private moments are being data-mined to generate a weekly newsletter for their children.

      The pilot program highlighted this risk. Our 91-year-old resident formed an attachment to the device. When the battery died, she experienced genuine distress. Her daughter wants it removed; the resident wants it kept. Who decides? If we deploy this broadly, we will face this conflict repeatedly. We will be managing breakups between vulnerable adults and their algorithms. Furthermore, the "listening" feature turns a private room into a monitored space. We would be normalizing the idea that safety requires surrendering privacy, even for those who cannot consent to the trade.

      **The Case for Adoption**
      I want to address my colleagues who support this proposal, because your arguments are valid and deserve respect. Loneliness is a mortality risk. We know isolation kills faster than many diseases. You are arguing that if a machine can alleviate even a fraction of that loneliness, we have a moral obligation to use it. You are also arguing from staffing reality: we cannot hire enough qualified aides even if we had the money. The workforce is shrinking. If a tablet can prompt meds and play music from a resident's youth, that is tangible benefit. You are not arguing for surveillance; you are arguing for connection where humans are unavailable. You see this as a life raft. I understand that. I feel the pull of that argument every time I visit my mother.

      **What Care Is**
      However, voting on this requires us to state plainly what we believe care is. If we approve this, we commit to the belief that care is a set of outcomes—meds taken, mood stabilized, loneliness reduced—that can be delivered by any effective means. It treats care as a service product.

      If we reject this, we commit to the belief that care is inherently relational. It asserts that the value is not just in the outcome, but in the human contact required to get there. It acknowledges that being cared for by a person, even an overworked one, affirms dignity in a way being managed by a sensor does not. It also affirms the dignity of our workforce. Adopting this tool sends a message to our aides—mostly women, mostly underpaid—that their emotional labor is substitutable by software. We cannot claim to value our staff while voting to make them obsolete.

      **Conclusion**
      We are three members with parents in these homes. We are arguing about our own mothers. That is why this needs to be clear. We cannot vote for this based on hope that the budget might change. We cannot vote for this based on the idea that surveillance is kindness.

      I move we reject the proposal. We should instead focus our limited capital on retaining staff and exploring non-surveillance-based social tools that do not require continuous monitoring. Let us not solve the problem of loneliness by removing the people.

      **Vote Required:** Reject Proposal.

