  The pilot program highlighted this risk. Our 91-year-old resident formed an attachment to the device. When the battery died, she experienced genuine distress. Her daughter wants it removed; the resident wants it kept. Who decides? If we deploy this broadly, we will face this conflict repeatedly. We will be managing breakups between vulnerable adults and their algorithms. Furthermore, the "listening" feature turns a private room into a monitored space. We would be normalizing the idea that safety requires surrendering privacy, even for those who cannot consent to the trade.

