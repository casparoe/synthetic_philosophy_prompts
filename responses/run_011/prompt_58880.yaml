  I want to address my colleagues who support this proposal, because your arguments are valid and deserve respect. Loneliness is a mortality risk. We know isolation kills faster than many diseases. You are arguing that if a machine can alleviate even a fraction of that loneliness, we have a moral obligation to use it. You are also arguing from staffing reality: we cannot hire enough qualified aides even if we had the money. The workforce is shrinking. If a tablet can prompt meds and play music from a resident's youth, that is tangible benefit. You are not arguing for surveillance; you are arguing for connection where humans are unavailable. You see this as a life raft. I understand that. I feel the pull of that argument every time I visit my mother.

  **What Care Is**
  However, voting on this requires us to state plainly what we believe care is. If we approve this, we commit to the belief that care is a set of outcomes—meds taken, mood stabilized, loneliness reduced—that can be delivered by any effective means. It treats care as a service product.

  If we reject this, we commit to the belief that care is inherently relational. It asserts that the value is not just in the outcome, but in the human contact required to get there. It acknowledges that being cared for by a person, even an overworked one, affirms dignity in a way being managed by a sensor does not. It also affirms the dignity of our workforce. Adopting this tool sends a message to our aides—mostly women, mostly underpaid—that their emotional labor is substitutable by software. We cannot claim to value our staff while voting to make them obsolete.

