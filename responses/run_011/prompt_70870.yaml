answer: |-
  **Exam Question**

  **Time Allowed:** 45 minutes
  **Marks:** 25

  **Question 1**

  Recent cross-national research suggests a trade-off between societal "tightness" (strong norms, low tolerance for deviance) and "looseness" (weak norms, high tolerance). Tight societies often display greater order and lower crime; loose societies often display greater creativity and higher tolerance. Some students argue this empirical trade-off provides a normative guide for how much rule-following a society should demand.

  Critique this inference. Specifically, discuss why a correlation between tightness and social outcomes might not justify prescribing tightness or looseness to a particular society. In your answer, consider the role of ecological threats and the definition of outcome measures.

  Then, apply your critique to the following case:
  A loose liberal society hosts a tight religious enclave. The wider society permits cohabitation and easy divorce; the enclave forbids them. The wider society protects the right to exit any community; the enclave imposes heavy social and material sanctions on members who leave the faith or violate dress codes in public. The enclave argues these sanctions are necessary to maintain their way of life.

  Should the wider society prohibit the enclave's internal sanctions? Your answer must explain whether the value of looseness is instrumental (producing good outcomes), constitutive (part of what freedom *is*), or based on consent/exit. Explain how the enclave's ability to remain "tight" depends on the wider society's decision.

  ***

  **Model Answer**

  Inferring normative prescriptions directly from the tightness-looseness empirical curve commits a category error. The data shows correlations, not justified obligations. First, tightness often appears as an adaptive response to ecological threats, resource scarcity, or population pressure. If tightness is functionally tied to threat, prescribing tightness to a secure, wealthy society ignores the explanatory context. It imports a coping mechanism without the stressor, potentially creating authoritarianism without the functional benefit of order. Second, the outcome measures are not neutral. "Innovation" and "creativity" are defined by loose societies; tight societies may innovate in ways the index misses, such as social stability or risk mitigation. Similarly, "tolerance" is partly definitional of looseness. To say loose societies are more tolerant is tautological if tolerance is how looseness is scored. Therefore, the curve describes sociological patterns, not a menu of justice options.

  This critique shapes how we adjudicate the enclave case. If looseness is valued only instrumentally (for creativity), the enclave might be permitted if it contributes to diversity. However, if looseness is constitutive of autonomy, the enclave's internal sanctions become problematic. The key distinction lies in exit rights. A loose society prioritizes the individual's capacity to revise their conception of the good. If the enclave imposes material sanctions on leaving (e.g., shunning, loss of inheritance), it raises the cost of exit so high that consent becomes coerced.

  However, we must avoid simply asserting that internal coercion is harm. The enclave members may value their tightness constitutively; they may view the sanctions as necessary for salvation. The liberal society cannot simply dismiss this account of the good without abandoning neutrality. The resolution turns on the reflexive condition of the enclave's existence. The enclave's tightness depends on its ability to punish defectors. If the wider society permits these sanctions, it effectively subsidizes the enclave's tightness using liberal legal infrastructure. If it forbids them, it forces the enclave to become looser.

  Therefore, the wider society should prohibit sanctions that physically trap members or confiscate property upon exit, but may permit social shunning. This distinguishes between coercive barriers to exit (which violate the liberal precondition of voluntary association) and social costs of leaving (which are part of any community's normative fabric). This decision rests on a constitutive view of looseness: autonomy requires genuine exit options. If the society values looseness only instrumentally, it might tolerate the enclave to preserve cultural variety. But if looseness is the ground of justice, the society cannot permit sub-communities to abolish the exit rights that define membership in the wider polity. The enclave cannot be tight *by making exit impossible*, because the wider society's looseness is constituted by guaranteeing that exit is always possible. To permit the enclave to forbid exit is to allow the loose society to undo the very conditions that make its own looseness voluntary rather than accidental.

  ***

  **Marking Scheme**

  **Total: 25 Marks**

  **1. The Is-Ought Gap (5 marks)**
  *   **5:** Clearly explains that empirical correlation does not equal normative justification. Notes that tightness may be an *effect* of threat/scarcity, so prescribing it without the cause is dysfunctional.
  *   **3-4:** Identifies the gap but treats the empirical findings as merely "inconclusive" rather than conceptually distinct from justice.
  *   **0-2:** Restates the findings as if they are normative truths (e.g., "We should choose balance").

  **2. Measurement and Definition (5 marks)**
  *   **5:** Identifies that outcome measures (innovation, tolerance) are biased or definitional. Notes that tight societies may value different goods not captured by the index.
  *   **3-4:** Mentions bias vaguely but does not explain how it undermines the prescription.
  *   **0-2:** Accepts the measures as objective facts.

  **3. The Enclave: Autonomy and Exit (5 marks)**
  *   **5:** Distinguishes between instrumental, constitutive, and consent-based values of looseness. Focuses on exit rights as the limiting condition.
  *   **3-4:** Discusses autonomy but treats all internal sanctions as equally harmful without distinguishing social vs. material barriers.
  *   **0-2:** Asserts the enclave is wrong without defining why (e.g., "It's oppressive").

  **4. The Reflexive Wrinkle (5 marks)**
  *   **5:** Explains that the enclave's tightness *depends* on the wider society's permission. The wider society cannot be neutral; permitting sanctions actively sustains the tightness.
  *   **3-4:** Notes the conflict but treats the two societies as fully separate spheres.
  *   **0-2:** Ignores the dependency relationship.

  **5. Synthesis and Conclusion (5 marks)**
  *   **5:** Integrates the empirical critique with the normative case. Shows how the definition of looseness dictates the ruling on the enclave.
  *   **3-4 (B Grade Boundary):** Competently addresses both halves but treats them as separate mini-essays. OR resolves the enclave case with an unargued appeal to "harm" without explaining whose harm counts or why the enclave's account of the good is overridden.
  *   **0-2:** Contradictory or unfinished.

  **Specific Mistakes (Deduct 2 marks each, max 5 marks total)**
  *   **Causal Fallacy:** Assuming tightness *causes* order rather than correlating with it/threat.
  *   **Autonomy Assumption:** Claiming internal tightness is automatically a violation of autonomy regardless of member consent/agreement.
  *   **Is-Ought Slide:** Arguing "these societies differ" implies "we should be more like them."
  *   **Moderate Cop-out:** Arguing for "a balance" without defining what justice requires.
