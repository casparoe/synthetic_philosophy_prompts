          *   *§6 (Jim/Negative Responsibility):* Williams definitely links negative responsibility to the integrity objection. The claim that it's about "agency" rather than just "demandingness" is accurate. However, linking the *domestic* case (positive duty/commitment) directly to *negative* responsibility in the public case requires care. The domestic case is about *special obligations*, the public case is about *causal responsibility*. The unifying thread is the "external standpoint."
