  So: does this have a name? I would like (a) a shortlist of the nearest established concepts, drawn from wherever they live — metaphysics of dispositions, psychometrics, econometrics, game theory, intelligence tradecraft, the AI safety literature itself — and, for each, the specific clause of my description it fails to capture; (b) your verdict on whether any of them genuinely covers the case, and if more than one does, which carve closest and what the residual is; (c) if none does, a coinage I can defend: a definition, the conditions that are jointly necessary for a case to fall under it, and at least two boundary cases, one that should count and one that should not. For the second, please adjudicate my own attempt: field biologists studying wary animals with traps and camera rigs face subjects that learn to avoid the apparatus after one bad experience, so the apparatus stops sampling the population it was designed to sample — is that inside the category or outside it, and on what principle? Finally, and I mean this sincerely, please tell me if the description is incoherent or if I have smuggled a premise in. One interviewee suggested that I have quietly assumed the probes must be covert, and that a sufficiently clever evaluation design could be informative precisely *because* the subject knows what it is, and I do not have a good answer to that yet.
