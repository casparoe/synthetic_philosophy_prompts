  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of mind and ethics with practical experience on animal-use committees (IACUC/AWB type).
      *   **Task:** Analyze the implicit moral theory behind current animal research regulations based on the provided observations (EU/US rules, tier forms, exclusions, etc.).
      *   **Constraints:** 1,200–1,500 words. Headers. Smart non-specialist audience. No bibliography/reading list/citations (unless load-bearing, use once).
      *   **Key Questions to Address:**
          1.  Reconstruct the implicit theory (threshold, scalar, proxy, precautionary, political?).
          2.  Analyze the 1–5 tier form (scalar status vs. bureaucratic efficiency vs. aggregate harm).
          3.  Analyze the "revisit as science develops" clause (empirical property vs. interpretive practice) and the fetal development line.
          4.  Distinguish between *presupposes*, *fits well with*, and *explains historically/politically* (specifically regarding rats/birds exclusion and ritual slaughter).
          5.  Identify philosophical underdetermination (rival theories licensing the same rules).
          6.  Concrete changes if replaced with a seriously scalar view or suffering-intensity view.

  2.  **Deconstruct the Observations:**
      *   *Vertebrates + Cephalopods:* Covered. Justification: evidence of pain/suffering.
      *   *Mammalian Fetuses:* Covered only late term.
      *   *Invertebrates (mostly):* Excluded (flies, bees, worms, crustaceans mostly), despite some evidence (crabs sentient).
      *   *Internal Tier Form:* Scores 1-5 based on neuro/behavior. Determines review strictness. Bottom tier = no protocol.
      *   *Legal Inconsistencies:* Crabs sentient in some laws, not others. US excludes rats/mice/birds (budget/lobbying). Pesticides kill insects freely.
      *   *Clause:* "Revisit as science develops."

  3.  **Brainstorming Candidate Theories (Mental Step):**
      *   *Sentientism (Threshold):* You either feel pain or you don't. We use taxonomy as a proxy because testing every individual is impossible.
      *   *Gradualism (Scalar):* Moral status comes in degrees based on cognitive capacity/suffering intensity.
      *   *Political/Relational:* Status is conferred by social relationship, cuteness, or lobbying power (pets vs. pests).
      *   *Administrative Pragmatism:* We can only review so much. We draw lines where resources allow, pretending they are moral lines.
      *   *Precautionary Principle:* If doubt exists, include. (But this fails for insects/crustaceans where doubt exists but they are excluded).

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Acknowledge the messiness. State the thesis: The practice is a hybrid, but functionally operates on *Administrative Proxy Sentientism*.

      *   **1. The Implicit Theory:** It's not a pure moral theory. It's a *Taxonomic Proxy for a Threshold View*. They assume sentience is binary (you suffer or you don't), but since we can't measure it directly, we use phylogeny (vertebrates/cephalopods) as a cheap filter. It's not purely precautionary (otherwise insects would be in). It's not purely political (otherwise cephalopods wouldn't be in). It's a "rough and ready" realism.

      *   **2. The Tier Form (Scalar vs. Binary):** This is the tension point. The 1-5 score *looks* scalar. But if Tier 1 gets *no* protocol, it acts binary. Is it about status or risk management? It's likely *Risk-Weighted Review*. High status/high pain potential = high review. Low status = low review cost. The "cliff" at Tier 1 suggests a bureaucratic cutoff, not necessarily an ontological one. Aggregation (many bees) is ignored because the system is individual-centric. This is a known philosophical bug (the "logic of the larder" or aggregation problem).

      *   **3. "Revisit as Science Develops" & Fetuses:** This presupposes *Moral Realism about Sentience*. It assumes sentience is a discoverable fact like gravity. If sentience is interpretive (we decide what counts), this clause makes less sense. The fetal line assumes *Developmental Gradualism* but enforced as a *Bright Line*. It assumes there's a moment "something turns on." If consciousness is emergent/vague, the line is arbitrary but necessary for enforcement.

      *   **4. Presupposes vs. Fits vs. Explains:** Crucial distinction.
          *   *Presupposes:* That some beings matter morally (otherwise no rules). That taxonomy correlates with morally relevant traits (otherwise why vertebrates?).
          *   *Fits Well With:* Gradualism (tiers).
          *   *Explains Historically/Politically:* US rat/mouse exclusion (budget). Ritual slaughter (cultural exemption). Pesticides (economic override).
          *   *Point:* Saying rules presuppose rats have *no* status is wrong. It presupposes their status is *overridden* by administrative convenience. Category mistake to call it ontological denial.

      *   **5. Underdetermination:** What rival theories fit?
          *   *Indirect Duty View:* We protect animals to protect human character, not the animals themselves. (Fits the arbitrary lines).
          *   *Contractualism:* Only those who can participate in moral agreements matter, but we grant concessions.
          *   *Utilitarianism (Rule):* Follow the rule because calculating every case is too costly.
          *   *Conclusion:* You can't prove lawmakers believe *one* thing. The rules are compatible with deep moral agnosticism.

      *   **6. Concrete Changes (Scalar/Intensity View):**
          *   *Changes:* Individual assessment (impossible). Insect farming regulated. Pesticides restricted. Fetuses reviewed earlier.
          *   *Breakage:* Administrative collapse. Too many animals. Who measures suffering intensity? Vet vs. Philosopher conflict.
          *   *Result:* The system would grind to a halt.

  5.  **Refining and Polishing:**
      *   *Tone:* Professional, insightful, slightly critical but empathetic to the administrative burden.
      *   *Word Count Check:* Need to ensure I hit the 1,200-1,500 range. I need to expand on the nuances in sections 2 and 4 especially.
      *   *Constraint Check:* No bibliography. Headers required.
      *   *Voice:* "Philosopher who has sat on committees." Use terms like "IACUC," "harm-benefit analysis," "phylogenetic bracket."

  6.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe call it "Speciesism." *Correction:* Too loaded/political. Stick to "Taxonomic Proxy."
      *   *Initial thought:* Focus heavily on the US rat exclusion. *Correction:* Keep it balanced with EU rules as per prompt.
      *   *Focus:* Ensure the distinction between "presupposes" and "explains" is sharp. That's a key philosophical demand in the prompt.
      *   *Tier Form:* Make sure to address the aggregation problem (bees).
      *   *Science Develops:* Address the "natural kind" vs "interpretive" aspect.

  7.  **Final Review against Prompt Requirements:**
      1.  Reconstruct implicit theory? Yes.
      2.  Tier form analysis (scalar vs binary)? Yes.
