  About a month ago I was driving through the high desert in Nevada and my alternator went, like 60 miles from anything, sun going down. A guy with a horse trailer stopped. He said he'd tow me into the next town, but only if I promised him I'd send $400 to the volunteer fire department in his hometown, which was back the way he'd come, and there's no way he'd ever find out whether I did it. He said he's pulled people off that road a bunch of times, that he figures he can tell who'll actually follow through, and that he only stops for the ones he thinks will. I said yes, and at the time I meant it completely — I'd have promised anything.

