  2.  **Deconstruct the Legal/Philosophical Problem:**
      *   *The Puzzle:* Why does lying about being a doctor (factum) invalidate consent, but lying about being wealthy or sterile (inducement) usually doesn't, even though both cause the person to agree?
      *   *Contract Analogy:* In contract, lying about material facts (inducement) *does* invalidate the agreement. Why the asymmetry?
      *   *Theories of Consent:*
          1.  **Act-Type Theory (Nature of the Act):** Consent is to a specific physical act. If the act changes description fundamentally, consent is gone.
          2.  **Autonomy/Choice Theory:** Consent is valid only if the choice is informed enough to be autonomous. (This usually pushes toward broader invalidation).
          3.  **Harm/Risk Theory:** The law isn't really protecting "consent" per se, but bodily integrity and specific physical risks (pregnancy, disease).
          4.  **Conditional Consent Theory:** Consent is a set of conditions. If conditions aren't met, consent is void. (The condom case angle).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate that the "confused" charge is too easy, but the tension is real. Set the stage: We are looking for the *principle* behind the line-drawing.

      *   **Part 1: The Implicit Theory (Reconstruction):**
          *   Need to move beyond "factum vs. inducement."
          *   *Core Theory:* **The "Physical Identity and Nature of the Act" Theory.**
          *   *Explanation:* The law treats sexual consent as consent to a specific *physical interaction* with a specific *body*. It draws a hard line between the *physics* of the act and the *context* of the act.
          *   *Why?* To prevent the criminal law from becoming a morality police for dating. If every lie vitiates consent, every broken promise becomes rape.
          *   *The "Operative Description" Problem:* How do we pick the descriptions? The law picks the ones that change the *physical reality* of the touch (who is touching, what is touching, is it penetration or surgery).
