  6.  **Final Polish:** Ensure the distinction between "consent as a mental state" vs. "consent as a social/physical boundary" is clear. This is the philosophical heart of the issue. (Self-correction: Make sure to emphasize that criminal law is about *punishment*, which requires a higher bar than contract *remedies*.)

