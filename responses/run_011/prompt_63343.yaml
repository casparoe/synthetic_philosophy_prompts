answer: |-
  This is an exceptionally sharp question. You have correctly identified that the standard legal labels ("fraud in the factum" vs. "fraud in the inducement") are descriptive, not explanatory. They tell you *where* the line is drawn, but not *why*. Your roommate's claim that the doctrine is "just confused" is a common philosophical take, but it overlooks the possibility that the confusion is actually a compromise between two competing values: protecting sexual autonomy and preventing the criminalization of ordinary dating deception.

  I will prioritize reconstructing the implicit theory of consent and detailing the courtroom consequences of the rival views, as these get to the heart of your request for reasoning over labels. I will address the contract comparison, but I will simplify the "conditional consent" package theory, as it largely collapses into the harm-based view in practice and treating it as a fully separate third pillar might obscure the main tension.

  Here is the reconstruction of the doctrine, the consistency problem, and the practical stakes.

  ### 1. The Implicit Theory: "Physical Boundaries" vs. "Reasons for Action"

  To make the current legal pattern look principled rather than arbitrary, you have to assume the criminal law is not actually protecting "autonomy" in the broad philosophical sense (the right to make fully informed choices). Instead, it is protecting **bodily integrity against specific physical intrusions.**

  Under this theory, consent to sex is not a general permission to interact with a person; it is a permission for a specific physical act to occur to a specific body. The law presumes that when you consent to sex, you are consenting to the *physics* of the encounter, not the *biography* of the partner.

  **The Principle of Selection:**
  How does the law pick which descriptions of the act are "operative"? It selects descriptions that change the **physical identity of the act** or the **physical identity of the actor.**
  *   **Impersonation:** If I think I am touching my husband, but I am touching a stranger, the physical reality of "who is touching me" is different than what I agreed to.
  *   **Nature of the Act:** If I think I am undergoing a medical exam, but I am having sex, the physical reality of "what is being done to my body" is different.
  *   **Condoms:** If I agree to sex *with* a barrier, and the barrier is removed, the physical reality of the contact changes (skin-to-skin vs. barrier).

  **Why Wealth, Status, and Fertility Don't Count:**
  Under this theory, lying about wealth, love, or fertility changes your *reasons* for agreeing, but it does not change the *physical act* you agreed to. You knew you were having sex; you just wish you hadn't. The law treats this as a regretted choice, not a violated boundary.

  **The Underdetermination Problem (Where your roommate has a point):**
  You asked where the doctrine is philosophically underdetermined. It is right here. The "Physical Identity" theory and the "Harm/Risk" theory often produce the exact same verdicts, but for different reasons.
  *   *Condom Case:* Under "Physical Identity," removing a condom changes the act (wrapped vs. unwrapped). Under "Harm/Risk," it changes the exposure to disease/pregnancy.
  *   *Sterility Case:* Under "Physical Identity," the act is the same (intercourse). Under "Harm/Risk," the act is the same *unless* pregnancy occurs, but the risk profile changed.
  *   *The Tell:* The fact that courts struggle with the sterility cases suggests the "Physical Identity" theory is failing. If it were purely about the physical act, sterility shouldn't matter. The fact that some courts *want* it to matter suggests they are actually smuggling in a "Harm/Risk" theory (protecting against unwanted pregnancy) but trying to dress it up as consent doctrine.

  So, the doctrine is not "confused" in the sense of being random; it is **hybrid.** It pretends to be about consent to acts, but it quietly shifts to protecting against physical harms when the act-deception distinction gets too thin.

  ### 2. Contract vs. Sex Law: Can They Be Consistent?

  You asked if we can align contract law and sex law without abandoning one. The short answer is **no**, not without unacceptable costs. This is because the two domains are protecting different things using different tools.

  **The Function of Contract:**
  Contract law facilitates economic exchange. For markets to work, information must flow. If I can lie about the foundation of the house to sell you the lease, the market becomes inefficient and unfair. The remedy is usually *undoing the deal* (rescission) or damages. The state is not sending anyone to prison; it is adjusting the ledger. Therefore, the bar for "valid consent" is higher regarding information. You need to know what you are buying.

  **The Function of Criminal Sex Law:**
  Criminal law punishes moral wrongs with liberty (prison). Because the stakes are so high (loss of freedom, sex offender registration), the definition of the crime must be narrow and clear.
  *   **If we bring Sex Law up to Contract:** If any "material lie" vitiates consent, then lying about loving someone, lying about being a lawyer, or lying about intending to call the next day could theoretically become rape. This would criminalize a vast swath of human sexual behavior and require courts to adjudicate the honesty of romantic feelings. The cost is **overcriminalization and privacy invasion.**
  *   **If we bring Contract down to Sex Law:** If only "physical identity" lies matter in contract, I could lie about the square footage of the apartment or the presence of toxic mold, and you'd still be bound by the lease because you knew you were signing a lease. The cost is **market collapse and unfairness.**

  **The Necessary Concession:**
  We must accept that "consent" means different things in different contexts. In contract, consent is **transactional agreement** (I agree to these terms based on this info). In criminal sex law, consent is **permission for physical intrusion** (I allow you to cross this bodily boundary). To make them consistent, you would have to either imprison people for bad dating lies (absurd) or allow landlords to poison tenants via fraud (unjust). The asymmetry is a feature, not a bug, reflecting the difference between regulating commerce and regulating bodily violence.

  ### 3. Concrete Courtroom Consequences

  This is the most critical part for your understanding. The theory you choose dictates what happens in the trial. Let's contrast the two rival views you mentioned: **The Subjective Decision View** (any lie that mattered) vs. **The Harm/Physical Boundary View** (current doctrine/harm-based).

  #### View A: The Subjective Decision View (Autonomy Maximization)
  *Premise:* Consent is only valid if the decision is fully informed regarding any fact the complainant considered important.

  *   **Jury Instructions:** The judge would tell the jury: "You must decide whether the defendant's statement was a significant factor in the complainant's decision to agree to sex."
  *   **What Must Be Proved:** The prosecution must prove the complainant's internal state of mind.
  *   **Complainant Testimony:** The complainant must testify extensively about their personal motives. "I wouldn't have slept with him if I knew he was married." "I only agreed because he said he was a musician."
  *   **Defendant's Beliefs:** The defendant's knowledge becomes crucial. Did he *know* that wealth was a dealbreaker for her? This turns the trial into a mind-reading contest about the relationship dynamics.
  *   **Result:** The trial becomes an inquest into the relationship's honesty. It blurs the line between "rape" and "breach of promise."

  #### View B: The Harm/Physical Boundary View (Current/Restricted)
  *Premise:* Consent is valid unless the deception altered the physical nature of the act or created a specific physical risk the law recognizes.

  *   **Jury Instructions:** The judge would tell the jury: "You must decide whether the deception concerned the nature of the act itself or the identity of the person, not merely the reasons for agreeing." (Or, under a harm view: "Did the deception create a risk of pregnancy or disease?")
  *   **What Must Be Proved:** The prosecution must prove the objective facts of the deception and the physical reality of the act.
  *   **Complainant Testimony:** The complainant testifies about what was said and what happened physically. They do *not* need to explain *why* they said yes, only that they said yes to X, but Y happened.
  *   **Defendant's Beliefs:** The defendant's beliefs about the complainant's motives are irrelevant. It doesn't matter if he knew she cared about money. It only matters if he lied about being her husband.
  *   **Result:** The trial focuses on physical boundaries and objective lies. It protects privacy (no need to dissect why you found him attractive) but risks under-protecting autonomy (you were tricked, but the law says you weren't raped).

  ### 4. Summary of Priorities and Omissions

  **What I Prioritized:**
  1.  **Reconstructing the Theory:** I focused on the "Physical Boundary" theory because it is the only one that makes the current legal distinctions look principled rather than random.
  2.  **Courtroom Consequences:** I detailed this because it shows the real-world cost of the philosophical choice. It moves the debate from abstract rights to concrete evidence and testimony.
  3.  **Underdetermination:** I highlighted where the "Physical" and "Harm" theories overlap, as this is where the doctrine is most vulnerable to your roommate's critique.

  **What I Dropped/Simplified:**
  1.  **Conditional Consent Package:** I treated this as a subset of the Subjective Decision view. While theoretically distinct (consent as a set of "if/then" conditions), in court, it requires the same inquiry into the complainant's specific conditions, so it merges with View A above.
  2.  **Specific Jurisdictional Variations:** You asked for no case names, but I also avoided diving into how specific states handle the "sterility" vs. "condom" split. The principle remains the same: courts are struggling to decide if they are policing acts or risks.

  ### The Bottom Line for Your Seminar

  The doctrine is not "confused" in the sense of being accidental. It is a **deliberate containment strategy.** The legal system is trying to protect bodily integrity without becoming a regulator of romantic honesty.

  The distinction holds together only if you accept that criminal law is not the right tool to fix all violations of autonomy. If you believe that *any* deception that manipulates a choice is a violation of autonomy equivalent to rape, then the current law is indeed morally bankrupt. But if you believe criminal law should be reserved for violations of physical boundaries and severe harms, then the distinction between "lying about who I am" (physical boundary) and "lying about what I feel" (emotional context) is the only line that prevents the criminal justice system from collapsing under the weight of broken hearts.

  Your roommate sees a philosophical inconsistency in the definition of consent. The law sees a pragmatic necessity in limiting the scope of criminal liability. Both are right within their own frames, but the law's frame wins in the courtroom because the cost of the alternative is too high.
