      *   **Core Question:** What is the implicit theory of consent in criminal sex law that justifies the distinction between "fraud in the factum" (vitiates consent) and "fraud in the inducement" (does not)? Is it principled or arbitrary?
      *   **Specific Constraints:**
          *   Do *not* just restate legal labels (factum vs. inducement).
