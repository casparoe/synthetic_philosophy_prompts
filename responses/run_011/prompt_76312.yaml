answer: |-
  Your hypothesis correctly identifies the underlying meta-aesthetic clash between extensional adequacy and functional normativity, but the immediate dialectical stalemate arises from Tolstoy's own equivocation between defining art as a psychological mechanism and prescribing it as a moral instrument, which makes the accusation of moving goalposts symmetrically plausible.

  The core of your impasse is indeed a conflict over what a philosophical definition of art is supposed to achieve, but characterizing this merely as "classificatory versus laudatory" understates the logical friction involved. Your friend is operating with a descriptivist or institutional intuition, where the extension of the concept "art" is fixed by historical practice and consensus (hence Shakespeare is art regardless of effect), whereas you are defending a revisionist functionalism, where the concept is defined by its telos (hence Shakespeare is counterfeit if it fails the function). This is not simply a verbal dispute about the word "art," but a substantive disagreement about whether aesthetic theory should map existing usage or reform it. Your friend treats Tolstoy's theory as an empirical hypothesis about what artworks *do*, which is falsifiable by counterexamples like propaganda or lullabies; you treat it as a normative claim about what artworks *ought to do*, which is immune to such counterexamples because it reclassifies them as non-art. Consequently, your friend's charge of unfalsifiability is correct relative to a descriptive framework but incorrect relative to a prescriptive one; the theory is only unfalsifiable if one insists it must accommodate intuitions it explicitly intends to overthrow.

  Regarding the accusation of moving goalposts, the blame is symmetrical because Tolstoy's text licenses both readings. Tolstoy oscillates between defining art strictly as the transmission of feeling (which would make Case A art and Case B non-art) and defining "true art" as the transmission of religious feeling (which makes Case A non-art). When your friend attacks the infection criterion using Case A, they are treating the religious clause as an ad hoc addition to save the theory from moral counterexamples; when you defend the theory by invoking the religious clause, you are treating it as constitutive of the definition from the outset. Since Tolstoy himself often introduces infection as the definition and religion as the valuation before collapsing the two, neither of you is being dialectically illegitimate; you are simply latching onto different strands of an inherently unstable argument. The audience-relativity issue you raised is secondary; while it highlights a weakness in the transmission model (making arthood dependent on the spectator's susceptibility), it does not generate the impasse so much as provide your friend with ammunition that only works if one accepts their descriptivist premise.

  Progress here requires neither a new distinction nor a reformulation of Tolstoy, but a stipulative separation of the two concepts Tolstoy conflates. You must agree to discuss either "Art as a descriptive category of human practice" (where your friend's counterexamples hold and Tolstoy fails) or "Art as a normative ideal of moral communication" (where your defense holds but the theory loses its claim to analyze existing works like Shakespeare). Until you agree on whether the theory is intended to explain why we call Shakespeare art or to argue why we should stop calling him art, the goalpost accusation will remain unresolved because the text itself moves the posts. If you cannot make this stipulation, no progress should be expected, because you are not debating the same proposition: one of you is testing a hypothesis about the world, and the other is advocating for a change in the world.
