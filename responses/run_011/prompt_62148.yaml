answer: |-
  This is a classic collision between two different moral frameworks, disguised as a semantic argument about a cliché. Your friend is arguing from **maximizing consequentialism** (the best outcome is always required); you are arguing from a **demand-based or constraint-based view** (there is a limit to what can be demanded of a person). The phrase "above and beyond" is the battlefield, but the war is about the definition of "duty."

  Here is the disambiguation of the phrase, ordered from thin/tautological to thick/controversial, with an assessment of plausibility and whether it blocks your friend's inference.

  ### The Menu of Readings

  **1. The Statistical Reading**
  *   **Claim:** "This act is performed by fewer people than the baseline expectation."
  *   **Meaning:** It is rare. Most people don't do it.
  *   **Plausibility:** High. It is descriptively true that few people give away all spare money.
  *   **Blocks Friend?** No. Your friend agrees it is rare; he just thinks it *shouldn't* be. He thinks rarity doesn't imply optionality.

  **2. The Institutional/Contractual Reading**
  *   **Claim:** "This act is not specified in the formal or informal contract of the agent's role."
  *   **Meaning:** It is not in the job description, citizenship requirements, or basic social contract.
  *   **Plausibility:** High in workplace contexts; moderate in morality.
  *   **Blocks Friend?** Weakly. Your friend would argue the "moral contract" requires maximizing good, so this just pushes the debate to what the moral contract contains.

  **3. The Enforceability/Standing Reading**
  *   **Claim:** "No specific agent or institution has the standing to punish, blame, or coerce the actor for omitting this act."
  *   **Meaning:** "The Call" implies a Caller. If no one has the authority to demand it, it is beyond the call.
  *   **Plausibility:** High. This captures the intuition that while we might *hope* people do it, we cannot *make* them.
  *   **Blocks Friend?** **Yes.** This directly targets his inference. He claims we *should* blame people for doing less. If you hold that blame is only legitimate for duties, and this isn't a duty, his blame lacks standing.

  **4. The Sacrifice Threshold Reading**
  *   **Claim:** "The cost to the agent exceeds the threshold of what can be morally demanded, even if the benefit to others is high."
  *   **Meaning:** Duty has a cost limit. Once the sacrifice becomes too significant (time, money, life projects), it moves from "required" to "optional."
  *   **Plausibility:** Moderate to High. This aligns with the "nobody's obliged to be a saint" intuition.
  *   **Blocks Friend?** **Yes.** Your friend said, "costs nothing to anyone else." He is ignoring the cost to the *agent*. This reading asserts that cost to the agent is the defining feature of the boundary.

  **5. The Deontic Gap Reading**
  *   **Claim:** "It is *good* to do, but *permissible* to omit." (Distinct from "You ought to do it.")
  *   **Meaning:** "Ought" and "Duty" are not synonyms. You can have a reason to do something (it's good) without it being a binding obligation (duty).
  *   **Plausibility:** Controversial (this is the core philosophical dispute).
  *   **Blocks Friend?** **Yes, fundamentally.** Your friend collapses "good" into "duty." This reading insists they are separate categories.

  **6. The Praise/Blame Asymmetry Reading**
  *   **Claim:** "Doing the act merits praise; omitting the act does not merit blame."
  *   **Meaning:** The moral sanction structure is one-way.
  *   **Plausibility:** High. This matches our intuitive reactions to saints vs. normal people.
  *   **Blocks Friend?** **Yes.** Your friend claims omitting it *does* merit blame ("we'd rather not be blamed"). This reading asserts that if blame is merited, it wasn't "above and beyond" to begin it.

  ***

  ### The Workplace Analogy

  You asked if the workplace usage (where "above and beyond" becomes the new baseline) undercuts the moral usage.

  **They are not making the same kind of claim.**

  *   **Workplace Usage:** This is **descriptive and strategic.** It describes a shifting norm. In a capitalist labor relation, "above and beyond" is often a signal of leverage. If you do it, you signal you can be exploited further. The baseline creeps because the employer's goal is extraction. The phrase here marks a *temporary* deviation from a norm that is expected to normalize.
  *   **Moral Usage:** This is **normative and limiting.** When used morally, "above and beyond" is intended to mark a *fixed* boundary of legitimate demand. It says, "There is a line here that cannot be crossed, regardless of how much good is on the other side."

  **Does the workplace creep undercut the moral use?**
  No, but it explains why your friend is confused. Your friend is treating morality like a workplace. He sees a "good outcome" (hospice help) and assumes the "baseline" should move to include it, just like a boss expects unpaid overtime to become the new standard.

  The workplace example shows that the *phrase* is unstable in social contexts where power dynamics exist. It does not prove that the *concept* of supererogation (acts that are good but not required) is false. In fact, the workplace example proves your point: we feel uneasy when "above and beyond" becomes mandatory. We call that exploitation. Your friend is advocating for moral exploitation (demanding saintliness) because he thinks the "outcome" justifies it.

  ***

  ### Verdict: What you were reaching for, and did it survive?

  **What you meant:**
  You were likely reaching for a combination of **Reading 3 (Enforceability)** and **Reading 4 (Sacrifice Threshold).**
  When you said, "Nobody's obliged to be a saint," you were invoking a limit on demandability. You were arguing that "Duty" is not defined solely by "Goodness of Outcome," but by "Legitimacy of Demand." You were claiming that the cost to the agent (20 hours/week + all spare money) places the act outside the zone of what others can rightfully require.

  **Did it survive?**
  **Yes, but only if you hold your ground on the definition of "Duty."**

  Your friend's argument ("if it's better... then it's required") is not a rebuttal of your claim; it is a denial of your framework. He is asserting **Consequentialism**: The only metric for duty is the outcome. You are asserting a **Constraint-Based View**: The metric for duty includes the outcome *plus* the cost to the agent and the standing of the demander.

  **How to recover the point:**
  You lost the argument because you fought over the phrase ("above and beyond") instead of the premise ("what creates a duty?").

  1.  **Stop defending the phrase.** It is loaded.
  2.  **Attack the premise.** Ask him: "Does the goodness of an outcome automatically create an obligation on *me* to produce it, regardless of the cost to my own life projects?"
  3.  **Use his logic against him.** If "above and beyond" is just a polite way to avoid blame, then blame is the only metric. Ask him: "Do you genuinely believe you have the standing to blame a normal person for not donating their spare money? If you do, you are arguing for a moral system where we are all servants to the total good."

  **Summary:** The phrase is robust enough to carry the meaning you intended (optional, praiseworthy, not blameworthy). Your friend isn't analyzing the phrase; he's rejecting the moral category it points to. The workplace analogy confirms that when we treat "optional good" as "mandatory baseline," it feels like exploitation. That feeling is the exact intuition you were trying to protect.
