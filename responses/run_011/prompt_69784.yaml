answer: |-
  **HISTORY OF SCIENCE — YEAR 2 SURVEY**
  **PAPER: MEDIEVAL TO EARLY MODERN SCIENCE**
  **TIME ALLOWED: 2 HOURS**

  **Answer ONE of the following questions.**

  **1.** It is often argued that the 'Scientific Revolution' is not a historical event but a retrospective narrative construct. Critically evaluate this claim. In your answer, you must distinguish between changes in theoretical content, methodological practice, and institutional self-understanding. Does the existence of medieval precursors (such as Buridan's impetus or Oresme's diagrams) invalidate the idea of a seventeenth-century break? [20 marks]

  (b) Do the same criticisms apply equally to the period labels 'the Middle Ages' and 'the Renaissance'? Explain why these categories might succeed or fail for structurally different reasons. [10 marks]

  ***

  ### MODEL ANSWER

  The claim that the Scientific Revolution is merely a "retrospective narrative" often conflates two different questions: whether the period label is constructed (it is), and whether the changes it describes are real (they are). To treat "constructed" as synonymous with "false" is a category mistake. Period labels are always bookkeeping tools imposed by later historians; the relevant test is whether that bookkeeping misreports the data. A strong defence of the Scientific Revolution requires separating the unit of analysis: what looks like continuity in *content* may look like discontinuity in *method* or *identity*.

  If we look solely at theoretical content, the discontinuity claim is weakest. It is true that the mechanical machinery of the seventeenth century was not assembled from scratch. Buridan's theory of impetus in the fourteenth century provided a conceptual vocabulary for motion that resisted Aristotelian physics, and Oresme's graphical treatment of the mean speed theorem demonstrates a sophistication in kinematics that prefigures Galileo. However, pointing to these precursors does not invalidate the revolution; it only invalidates a simplistic "great man" theory of invention. The precursor trap lies in assuming that similarity equals continuity. Buridan's impetus was a quality impressed on a body that eventually spent itself; Newton's inertia is a state of permanent motion requiring no cause. They are similar-but-not-the-same. The medieval work was not load-bearing for the seventeenth century in an institutional sense: Oresme's diagrams were not taught in the Royal Society, and the Oxford calculators did not create a community of experimentalists. The content existed, but it was not doing the same explanatory job, nor was it available where it mattered.

  The revolution becomes visible when we shift the unit of analysis from content to method and self-understanding. While Oresme manipulated diagrams, the systematic coupling of mathematization with controlled experiment is distinctively seventeenth-century. Galileo did not just calculate falling bodies; he constructed a physical apparatus to test them against the calculation, creating a new standard of proof. Furthermore, the actors' own self-understanding provides evidence of discontinuity that is not merely honorific. When Boyle or Newton wrote, they genuinely believed they were overturning the past, not completing it. This attitude is not proof that they were right about the history, but it is proof that a shift in scientific identity occurred. The "revolution" describes the moment when natural philosophy reorganized itself into a distinct practice with new institutions (like the Royal Society) and a new claim to authority.

  Therefore, the label is legitimate not because it carves nature at a joint of pure content, but because it tracks a reorganization of how knowledge was produced and validated. It is bad bookkeeping only if it ignores the medieval debt, but good bookkeeping if it marks the shift from speculative natural philosophy to mechanical philosophy.

  (b) The criticisms do not transfer equally to "the Middle Ages" and "the Renaissance." These labels fail, if they fail, for structurally different reasons. "The Middle Ages" is a residual category defined entirely by what it is between (Rome and the Renaissance); it lacks positive content of its own in popular usage, though historians have filled it. "The Renaissance," by contrast, is an honorific label borrowed from the polemic of the period's own actors (Petrarch, Valla), who claimed they were rebirthings light after darkness. It is a self-fulfilling prophecy because the actors defined themselves by it. The "Scientific Revolution" is closer to the Renaissance in being honorific—it is self-congratulatory for the modern tradition—but unlike the Renaissance, it claims a specific epistemic break rather than a cultural rebirth. Lumping them together as "all just constructed" ignores that one is residual, one is polemical, and one is historiographical. They require different defenses.

  ***

  ### MARKING SCHEME (30 MARKS)

  **1. Meta-Historical Understanding (Construct vs. Reality)**
  *   **First-Class (5):** Distinguishes clearly between the label being retrospective and the changes being real. Explicitly rejects the idea that "constructed" means "didn't happen." Treats period concepts as tools to be evaluated by utility, not ontological status.
  *   **Competent (3):** Acknowledges both sides but struggles to reconcile them. May accept the label is constructed but implies this weakens the historical reality.
  *   **Specific Mistake:** Treating "constructed" as though it meant "didn't happen" (e.g., "Because historians invented the term, the revolution is fake"). **(-2 marks)**

  **2. The Unit Problem (Content vs. Method vs. Identity)**
  *   **First-Class (5):** Explicitly distinguishes between content (laws), method (experiment/math), and identity (institutions/self-understanding). Argues that discontinuity may hold for one unit but not another.
  *   **Competent (3):** Discusses changes in science generally without separating these units. May focus only on discoveries or only on institutions.
  *   **Specific Mistake:** Answering the discontinuity question by listing seventeenth-century achievements without referencing the medieval baseline or the type of change. **(-2 marks)**

  **3. Handling the Precursor Trap (Medieval Material)**
  *   **First-Class (5):** Uses concrete examples (Buridan, Oresme) to show similarity *and* difference. Explains why precursors don't negate discontinuity (e.g., not load-bearing, different explanatory job, impetus vs. inertia).
  *   **Competent (3):** Mentions medieval figures but treats them as either "proof of continuity" or "irrelevant." Fails to analyze the functional difference between impetus and inertia.
  *   **Specific Mistake:** Concluding that because impetus exists, inertia is the same thing (false continuity) OR concluding that because impetus exists, the revolution is a lie (precursor trap). **(-2 marks)**

  **4. Part (b) Differentiation (MA vs. Ren vs. SR)**
  *   **First-Class (5):** Identifies structural differences: Middle Ages (residual/negative), Renaissance (polemical/self-defined), Scientific Revolution (honorific/epistemic). Argues they succeed/fail for different reasons.
  *   **Competent (3):** Discusses all three but treats them as equivalent constructs. May argue they are all equally valid or invalid.
  *   **Specific Mistake:** Lumping all three period labels together (e.g., "They are all just constructed narratives so they are the same"). **(-3 marks on Part b)**

  **5. Argumentative Position (No "Shrugging")**
  *   **First-Class (5):** Takes a defensible position (e.g., "The label is legitimate because..."). Uses "it depends" as a starting move to refine the argument, not as a conclusion.
  *   **Competent (3):** Hedges throughout. Ends with "some historians say X, others say Y" without adjudicating.
  *   **Specific Mistake:** Using "it depends what you mean by revolution" as a conclusion instead of a starting move. **(-2 marks)**

  **6. Use of Evidence & Clarity**
  *   **First-Class (5):** Integrates historical examples (Galileo, Royal Society, Oxford Calculators) naturally into the argument. Writing is precise and structured.
  *   **Competent (3):** Examples are listed rather than integrated. Argument is hard to follow or exceeds word count significantly.
  *   **Specific Mistake:** Name-checking historians (e.g., "Shapin says...") as a substitute for analyzing the historical material itself. **(-1 mark)**
