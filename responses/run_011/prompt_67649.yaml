prompt: |-
  I teach a third-year ethics seminar, 18 students, and I've got one 75-minute slot next week where I want them to run into the internal/external reasons debate without hearing either label until the very end. None of them have read Williams — half are poli-sci majors taking it for credit — so no lecture up front, and please don't have me write "internalism" on the board at minute one.

  Here's the mechanism I've sketched; tell me if it's workable and then build it out properly. Three dossiers, a page each: a person, an explicit list of what they want, believe, and are disposed to feel, and one candidate action. The only question the room answers each round is: does this person have a reason to do it? Trios can justify a yes only by writing an explicit chain from the dossier to the action, and they have to play move cards I deal out — means/end, correcting a false belief contained in the dossier, weighing against the other things the person wants, and an imagination card that lets them bring in what the person would come to want if they thought about it harder and more honestly. Every card played gets tallied on a ledger I keep visible at the front of the room.

  Round 1 should be a case where the honest answer is no. Round 2 is one where correcting a belief flips the verdict. Round 3 is the one I actually care about: someone who, so far as the dossier goes, has nothing at all that reaches the action — I have in mind a man whose estranged brother is dying and who resents him, where no amount of family-duty talk gets any purchase — and the imagination card is the only route left. Then round 4 I turn the ledger around and make them audit their own tally. By then they'll have manufactured reasons for people who on the paperwork didn't have any, and I want them to notice that they can always do this if they're allowed enough moves, and to say out loud what the moves were doing.

  What I want from you: the three dossiers written out in full, with enough texture that chain-building isn't trivial and there are real distractors in the motivational set; the card set with exact wording; timings per round; the verdict sheet; and a debrief that maps what just happened onto the actual distinction — the subjective motivational set, the sound deliberative route, external reason statements — and walks them into the collapse worry, that the escape clause is elastic enough to swallow everything it was supposed to exclude, and then into the blame question: if the round-3 guy genuinely had no reason, what are we doing when we resent him for not going? Also tell me what will predictably go wrong the first time I run it and how to handle it, and what the activity can't reproduce that I'll have to supply by hand. My suspicion is that its the soundness of the deliberation itself: my students are smuggling in their own sense of which chains count as good reasoning, and that isn't in any dossier. Say whether that's right, and whether the whole design is rigged against the externalist — I don't want it to be, and I'd rather know now.

  If you want an anchor with a pedigree, Williams himself leaned on the Henry James story about Owen Wingrave, the young man whose family insists he has a reason to be a soldier. But I'd rather the room build the cases than recognize one, so use it only if it earns its place.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 3rd-year ethics seminar, 18 students (mix of philosophy and poli-sci), 75-minute slot.
      *   **Goal:** Introduce the Internal/External Reasons debate (Bernard Williams) without using the labels until the end. No prior reading of Williams.
      *   **Mechanism:** Three dossiers (Person + Motivational Set + Candidate Action). Students work in trios. They must justify "Yes/No" on "Does this person have a reason?" using specific "Move Cards."
      *   **Rounds:**
          1.  Clear "No" (Internalist intuition holds).
          2.  Belief correction flips verdict (Internalist flexibility).
          3.  The Hard Case (Estranged brother): No existing motivation links to action; only "Imagination/Deliberation" card works.
          4.  Audit/Debrief: Reveal the pattern, map to Williams, discuss the "collapse worry" and blame.
      *   **Deliverables:** Full dossiers, card set wording, timings, verdict sheet, debrief script/outline, troubleshooting (what goes wrong), and critique of the design (is it rigged?).
      *   **Constraint:** Do not write "Internalism" on the board early. Keep the mystery.
      *   **Specific Concern:** The user suspects students will smuggle in their own norms of "sound deliberation." Is this right? Is the design rigged against externalism?

  2.  **Evaluate the Mechanism (Workability Check):**
      *   *Time:* 75 minutes is tight for 3 rounds + debrief with 18 students. Trios = 6 groups.
      *   *Complexity:* Writing chains + playing cards + tallying might eat time. Needs strict timing.
      *   *Pedagogy:* The "Imagination Card" in Round 3 is the crux. It mimics Williams' "sound deliberative route." If students can stretch this enough to say "Yes" to the estranged brother, they enact the Internalist expansion. If they say "No," they enact the Externalist intuition (or a strict Internalist one).
      *   *Risk:* The user is right. The "Imagination Card" is the loophole. If students interpret "thinking harder" as "becoming a moral person," Internalism swallows Externalism. This *is* the Williams debate, so the activity shouldn't avoid this, but the facilitator needs to highlight it.
      *   *Rigging:* The design *favors* Internalism because the rules require linking to the dossier (the subjective motivational set, $S$). An Externalist would say, "The dossier doesn't matter; the reason exists regardless." The activity forces them to look at the dossier. *Correction:* To avoid rigging, the Externalist position needs to be represented by the students who say "No" in Round 3 despite the Imagination Card, or by the debrief revealing that the "Imagination Card" is doing too much work. Actually, the activity *simulates* the Internalist framework to show its limits. That's fine, as long as the debrief exposes the tension.

  3.  **Drafting the Content:**

      *   **Dossiers:** Need texture.
          *   *Case 1 (No):* Needs to be absurd. Action: Eat glass. Motivation: Wants health. Result: No reason.
          *   *Case 2 (Belief):* Needs factual error. Action: Drink from cup. Motivation: Wants water. Belief: Cup contains water (actually gin). Result: Reason to drink *if* belief were true, but technically reason to *not* drink given reality? Wait, Williams says if I want gin and believe it's gin, I have a reason. If I want gin and believe it's water (but it's gin), do I have a reason? Let's go with: Wants to avoid poison. Believes cup is safe. Cup is poison. Action: Drink. Verdict: No reason (based on truth). Correction: If they knew, they wouldn't. Let's make it simpler. Wants to get to airport. Believes bus goes there. Bus doesn't. Action: Take bus. Verdict: No reason (factually). Correction: If belief corrected, no reason. Wait, Round 2 needs to *flip* to Yes.
          *   *Revised Case 2:* Wants to cure headache. Believes aspirin causes headaches (false). Action: Take aspirin. Verdict: No (based on belief). Correction: If belief corrected (aspirin cures), then Yes.
          *   *Case 3 (The Wingrave equivalent):* Estranged brother. Wants: Peace, no contact, resentment. Action: Visit dying brother. Link: None. Imagination Card: If he reflected, would he care? This is the battleground.

      *   **Cards:** Need to map to Williams' deliberative route.
          *   *Means/End:* Instrumental rationality.
          *   *Correction:* Factual error.
          *   *Weighing:* Conflicting desires in $S$.
          *   *Imagination:* "Constitutive" ends or discovering new desires through reflection (the controversial move).

      *   **Timings:** 75 mins total.
          *   Intro: 5 min.
          *   Round 1: 10 min.
          *   Round 2: 10 min.
          *   Round 3: 15 min (Hardest).
          *   Audit/Tally: 10 min.
          *   Debrief/Reveal: 25 min.
          *   Buffer: 5 min.

      *   **Debrief:** Must connect "Dossier" to "Subjective Motivational Set ($S$)." Connect "Cards" to "Sound Deliberative Route." Connect "Round 3 Tension" to "External Reasons." Connect "Blame" to the stakes.

      *   **Troubleshooting:**
          *   *Smuggling Norms:* Yes, students will say "Any decent person would want to see their brother." This *is* the Externalist move disguised as Internalist deliberation. The instructor must catch this. "Where in the dossier does *that* come from?"
          *   *Rigging:* The activity forces an Internalist structure (start with $S$). To represent Externalism, the instructor must point out that some students might insist "He has a reason *even if* he never would want to."
          *   *Time:* Groups might dawdle. Need a visible timer.

  4.  **Refining the "Rigging" Question:**
      *   The user asks: *Is the whole design rigged against the externalist?*
      *   *Answer:* Yes, structurally. The game rules *require* finding a link to the dossier. An Externalist says the link isn't required.
      *   *Mitigation:* The debrief must explicitly name this. "The rules of the game forced you to look inside the person. What if the reason is outside?" The activity demonstrates the *appeal* of Internalism (it explains agency) but also its *strain* (Round 3). The Externalist position emerges as the critique of the game's mechanics, not a move within the game. I need to make sure the user knows this so they don't pretend the game is neutral.

  5.  **Refining the "Smuggling" Question:**
      *   The user suspects students smuggle in their own sense of sound reasoning.
      *   *Answer:* Absolutely. This is the "collapse worry." If "sound deliberation" includes "becoming morally good," Internalism collapses into Externalism. The instructor needs to police the "Imagination Card." Does reflection reveal a *latent* desire, or does it *create* a new one? Williams allows the former, worries about the latter.

  6.  **Developing the Materials:**
      *   *Dossier 1:* The Arsonist. (Classic Williams example variant). Wants: Money. Action: Burn down own shop for insurance. Belief: Won't get caught. Fact: Will get caught. (Actually, let's keep it simpler for Round 1). Let's do the "Glass" idea. It's visceral.
      *   *Dossier 2:* The Traveler. Wants: To be in Paris by noon. Belief: Train goes to Paris. Fact: Train goes to Lille. Action: Board train. (Belief correction changes the reason status).
      *   *Dossier 3:* The Estranged Brother (Owen Wingrave style). Wants: Autonomy, distance. Action: Visit. No link.

      *   *Wait, let's look closer at Round 2.* Williams distinguishes between "I have a reason to $\phi$" and "I would have a reason if I knew $p$." The activity needs to show that Internalism handles false beliefs gracefully (by correcting them in the deliberative route).
      *   *Round 1:* No link possible. (Eat glass).
      *   *Round 2:* Link exists *if* belief corrected. (Take medicine, think it's poison).
      *   *Round 3:* Link exists *only if* motivational set changes via reflection. (Visit brother).

  7.  **Finalizing the Plan:**
      *   Make the cards physical/digital props.
      *   Ensure the Ledger is prominent.
      *   Script the "Reveal" carefully to avoid jargon until the end.
      *   Address the "Rigging" concern honestly in the advice section.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 75 minutes enough?
      *   *Fix:* Keep dossiers to half-pages. Keep chains short (3 steps max).
      *   *Critique:* Will Poli-Sci majors get it?
      *   *Fix:* Keep language concrete. Avoid "normativity" until debrief.
      *   *Critique:* The "Imagination Card" is the danger zone.
      *   *Fix:* Define it strictly in the text. "You may posit a desire they *would* have if they reflected, BUT you must explain how it grows from existing soil."

  9.  **Final Polish:** Check tone. Professional, collegial, precise. Acknowledge the sophistication of the user's design (it's very good).

  *(Self-Correction on the "Rigging" point)*: I need to be clear. The activity *models* Internalism. It cannot model Externalism *within the rules*. The Externalist critique comes from *outside* the game (i.e., "Why are we playing by these rules?"). I must instruct the teacher to make this explicit in the debrief.

  *(Self-Correction on Round 2)*: Let's make sure Round 2 illustrates the "Sound Deliberative Route" correcting error.
  Case: Person wants to drink. Believes glass contains water. Glass contains petrol. Action: Drink.
  Verdict: No reason (because petrol).
  Card: Correct Belief.
  New Verdict: If they knew it was petrol, they wouldn't drink. So they had no reason *even then*?
  Williams says: "A has a reason to $\phi$ if A could reach the conclusion to $\phi$ by a sound deliberative route from $S$."
  If I want water, and I believe this is water, but it's petrol. Do I have a reason to drink? No, because the fact is it's petrol.
  Okay, let's flip it. I want to quench thirst. I believe this clear liquid is water. It *is* water. But I believe it's poison. Action: Don't drink.
  Verdict: No reason to drink (based on belief).
  Card: Correct Belief.
  New Verdict: Yes, reason to drink.
  This works better. It shows Internalism accommodates objective facts via the deliberative route.

  Okay, ready to write.
answer: |-
  This is a sophisticated, high-risk/high-reward design. It is workable, but it is tight on time and relies heavily on your facilitation during the debrief to prevent the "Imagination Card" from becoming a magic wand that dissolves the distinction you're trying to teach.

  Your suspicion is correct: **students will smuggle in their own normative standards.** They will say, "If he thought hard enough, he'd realize family matters." That *is* the debate. The activity shouldn't prevent this; it should expose it.

  Below is the build-out. I have adjusted the timings to protect the debrief (where the philosophy actually happens) and refined the dossiers to ensure the "chains" require actual work.

  ### 1. The Materials

  **The Ledger (Whiteboard)**
  Draw three columns: **Case 1**, **Case 2**, **Case 3**.
  Rows: **Yes**, **No**, **Cards Used**.
  *Instruction:* "I am tallying your group verdicts. I want to see the consensus shift."

  **The Move Cards (Print 1 set per trio)**
  *   **Means/End:** "The action is the only/best way to get something already in the dossier."
  *   **Correct Belief:** "The dossier contains a factual error. Fix it, then re-evaluate."
  *   **Weighing:** "The action conflicts with a desire in the dossier. Show why another desire outweighs it."
  *   **Imagination:** "The person hasn't thought this through. If they did (honestly, vividly, calmly), they would acquire a new motivation *grounded in* the existing ones."

  **The Verdict Sheet (Half-page per student)**
  *   **Case:** \_\_\_\_\_
  *   **Verdict:** [ ] YES [ ] NO
  *   **The Chain:** (Write the steps: Desire/Belief $\rightarrow$ Card $\rightarrow$ Action)
  *   **Resistance:** (What made this hard to justify?)

  ---

  ### 2. The Dossiers

  **Case 1: The Arsonist (The "No" Intuition)**
  *   **Person:** Marcus, 34. Small business owner.
  *   **Motivational Set ($S$):** Wants to keep his shop. Wants to stay out of jail. Loves his wife. Dislikes violence.
  *   **Beliefs:** Knows fire spreads. Knows arson is a crime.
  *   **Candidate Action:** Pour gasoline on his own shop and light it.
  *   **Distractor:** He is in debt. (Students might try to link debt to arson, but the "Stay out of jail" desire blocks it).
  *   **Expected Outcome:** Almost unanimous **NO**. Means/End card fails because it contradicts "Stay out of jail."

  **Case 2: The Traveler (The Belief Correction)**
  *   **Person:** Elena, 28. Tourist.
  *   **Motivational Set ($S$):** Wants to see the sunset from the hilltop. Wants to avoid physical pain.
  *   **Beliefs:** Believes the cable car goes to the hilltop. (Fact: The cable car is broken; the bus goes to the hilltop). Believes the bus goes to the airport.
  *   **Candidate Action:** Board the bus.
  *   **Distractor:** She is tired (supports avoiding pain).
  *   **Expected Outcome:** Initial **NO** (based on her beliefs). After **Correct Belief** card: **YES**. This shows Internalism isn't just about current psychology; it's about what one would conclude *if* informed.

  **Case 3: The Estranged Brother (The "Wingrave" Case)**
  *   **Person:** David, 45.
  *   **Motivational Set ($S$):** Values autonomy above all. Resents his brother for a past betrayal (10 years ago). Wants peace and quiet. Feels guilt when he thinks about family, but actively suppresses it.
  *   **Beliefs:** Knows brother is dying. Knows brother wants to see him. Knows society says "family duty."
  *   **Candidate Action:** Drive 6 hours to visit the brother in the hospital.
  *   **Distractor:** The "Guilt" in the dossier. It's the only hook.
  *   **Expected Outcome:** Deep split. **NO** says: "Nothing in $S$ leads there." **YES** says: "If he used the **Imagination Card** on the guilt, he'd see he actually cares."
  *   **Crucial Tension:** This is where the "collapse" happens. If the Imagination Card allows *any* new desire, Internalism swallows Externalism.

  ---

  ### 3. Timings (75 Minutes)

  *   **00:00 – 00:05: Setup.**
      *   Divide into 6 trios. Hand out Dossiers 1, Cards, Verdict Sheets.
      *   Rule: "You must play at least one card to justify a YES. If you say NO, explain why no card works."
      *   *Do not mention reasons internalism/externalism.* Use the phrase "Having a reason."
  *   **00:05 – 00:15: Round 1 (Marcus).**
      *   Groups decide. Tally on board. (Expect mostly NO).
      *   Quick ask: "Did anyone find a chain?" (Unlikely).
  *   **00:15 – 00:25: Round 2 (Elena).**
      *   Groups decide. Tally. (Expect mixed, then shift to YES).
      *   Ask: "What changed?" (The facts changed, not the person).
  *   **00:25 – 00:40: Round 3 (David).**
      *   Hand out Dossier 3. This needs more time.
      *   Groups debate. Tally. (Expect a 50/50 split or heavy friction).
      *   *Instructor Note:* Circulate. Listen for groups saying "He *should* want to." Interrupt gently: "Is that in the dossier, or is that you?"
  *   **00:40 – 00:50: The Audit.**
      *   Turn the Ledger around.
      *   Ask: "In Case 3, if you voted YES, which card did you use?" (Most will say Imagination).
      *   Ask: "If you can always use the Imagination Card to grow a new desire, is there any case where the answer is truly NO?"
  *   **00:50 – 01:15: The Debrief (The Reveal).**
      *   See script below.

  ---

  ### 4. The Debrief Script (Mapping the Terrain)

  **Step 1: The Labels (5 mins)**
  "Okay, look at the ledger. You just enacted a debate from 1980. The philosopher is Bernard Williams.
  *   **The Dossier** = The **Subjective Motivational Set ($S$)**. Everything the person cares about, right now.
  *   **The Cards** = The **Sound Deliberative Route**. The logical steps to get from $S$ to Action.
  *   **Your Rule** = **Internalism**. You were forbidden from saying 'He has a reason' unless you could link it to the Dossier.
  *   **The Dissenters** = **Externalism**. If you voted NO on Case 3 because 'Family duty is a reason regardless of his desires,' you were an Externalist."

  **Step 2: The Collapse Worry (10 mins)**
  "Look at Case 3. The Internalist says reasons must come from inside $S$. But if the **Imagination Card** is too elastic, Internalism collapses.
  *   If 'thinking harder' just means 'becoming a moral person,' then Internalism is fake. It's just Externalism in disguise.
  *   Williams tries to block this. He says the new desire must be *grounded* in the old ones.
  *   **Question:** Did David's guilt in the dossier ground the visit? Or did you just import your own value of 'family'?"

  **Step 3: The Blame Question (10 mins)**
  "This isn't just semantics. It changes how we treat David.
  *   **If Externalist:** David has a reason, he's ignoring it. He is **irrational** or **wrong**. We blame him.
  *   **If Internalist (Strict):** David has no reason. He is being consistent with $S$. We might dislike him, but we can't say he's making a *reasoning error*.
  *   **Williams' Point:** If we say he has a reason, we must believe there is a deliberative route he *would* take if he were rational. If there isn't, calling it a 'reason' is just a way to blame him."

  ---

  ### 5. Troubleshooting & Critique

  **What will predictably go wrong:**
  1.  **The "Should" Smuggle:** In Case 3, students will say, "He *should* value family."
      *   *Fix:* When you circulate, ask: "Point to the line in the dossier where 'should' lives." If they can't, tell them they are playing an Externalist move in an Internalist game.
  2.  **Time Creep:** Case 3 debates can run long.
      *   *Fix:* At minute 35, call "Final Chains." Force a vote even if unresolved. The unresolved tension is pedagogical gold.
  3.  **Poli-Sci Confusion:** They might treat "Reason" as "Legal Justification" or "Prudential Advice."
      *   *Fix:* In the intro, define "Reason" simply: "A consideration that counts in favor of acting, such that if they didn't act, we could say they made a mistake."

  **Is the design rigged against the Externalist?**
  **Yes.** The game rules *require* a link to the Dossier ($S$). An Externalist denies that link is necessary.
  *   *Why this is okay:* You are not simulating the Externalist *position* in the mechanics; you are simulating the Internalist *framework* to show where it strains. The Externalist position emerges in the debrief as the critique of the game itself ("Why did we have to look at the dossier?").
  *   *How to handle it:* Acknowledge the rig explicitly in the debrief. "The game forced you to be Internalists. The Externalist refuses to play by these rules. They say the reason exists even if the dossier is empty."

  **Your Suspicion on "Sound Deliberation"**
  You are absolutely right. The activity cannot reproduce the **normativity of the deliberative route**.
  *   *The Problem:* Students will accept chains that are logically valid but normatively spurious (e.g., "If he reflected, he'd realize being a hermit is bad").
  *   *What you must supply:* You have to be the gatekeeper of "Sound." In the debrief, you must say: "Williams requires the deliberation to be *sound*. Who decides what sound is? If 'sound' means 'morally good,' Internalism dies. If 'sound' means 'instrumentally efficient,' Internalism survives but can't explain moral obligations."
  *   *The Takeaway:* The activity shows *why* Williams needs the "Sound Deliberative Route" concept, but it also reveals why it's the weakest link in his armor.

  **Final Advice:**
  Don't resolve the tension. If a student says in the debrief, "But David *does* have a reason, he's just a jerk," stop the class. Write that on the board. That sentence *is* the Externalist claim. Let them sit with the fact that they disagree on the rules of the game, not just the outcome. That is the philosophy.
