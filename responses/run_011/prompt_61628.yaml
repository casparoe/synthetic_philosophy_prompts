answer: |-
  Your tripartite scheme is structurally sound, but it misidentifies the Plutarchan stance as merely curatorial when it is actually diagnostic.

  You describe the Plutarchan reader as shopping for virtues and leaving the vices, but this assumes the virtues and vices are separable goods on a shelf. Plutarch operates on the belief that great qualities often share a root with dangerous ones; the same heat that fuels courage can fuel rage. He does not ask the reader to ignore the stain on the character, but to study how the light catches it. When he includes a defect in a man he admires, he is not failing to curate; he is providing the friction necessary for moral traction. The reader's self is assumed to be malleable, capable of emulation, but only if they understand the whole machinery of the character, grease and all. It is not a mirror you adjust to hide your own flaws, but a diagnostic tool to locate them. You are not shopping; you are undergoing an examination.

  Regarding hagiography, you ask if it flattens character, but it merely changes the ontology of the self. In the saint's life, character is not a fixed personality to be analyzed, but a battlefield where grace wrestles will. A flaw is not a psychological quirk to be contextualized by an estate; it is a temptation surrendered or overcome. The reader is not asked to judge the subject, but to be judged by them. The damage isn't transmuted to hide the sin, but to highlight the power that healed it. This assumes the reader's self is broken and needs repair, not information. The saint is not a model to be copied in part, but a window to be looked through entirely. If Plutarch asks you to imitate the virtue, hagiography asks you to submit to the source of it.

  The modern forensic stance, which your narrator inhabits, assumes the reader is a juror and the text is evidence. The estate wants verdict management because they know the evidence is damning. They want context to mean excuse, transforming moral failures into sociological symptoms. This leaves the reader in a courtroom where everyone is guilty, including the judge. The biographer becomes a defense attorney trying to suppress exhibits, while the reader suspects a cover-up. What makes this exhausting is that it offers no utility; knowing the verdict changes nothing about how the reader lives.

  What got lost was the permission to use the dead for the living's improvement, replacing utility with verdict. Your narrator's genre could be a fourth thing: penitential. She must admit the biography cannot save the poet, nor condemn him, but must save herself from the lie of authorization. By refusing to contextualize the damage, she turns the biography into an act of witness rather than verdict. This shifts the reader from juror to accomplice in the truth.
