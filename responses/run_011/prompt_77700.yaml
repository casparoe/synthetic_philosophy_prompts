  Dear Colleague,

  Having reviewed your notes on your supervisor's six previous verdicts, I believe I can offer a clear map of the decision theory she is employing, along with a prediction for your upcoming case and a suggestion for the week after. Her pattern of choices is remarkably consistent and effectively eliminates the two standard contenders, Causal Decision Theory and Evidential Decision Theory, leaving us with a more sophisticated hybrid. Standard Causal Decision Theory is ruled out by her one-boxing in the standard Newcomb problem and her cooperation in the Prisoner's Dilemma against an exact copy, as a causal theorist would two-box and defect in both instances due to the lack of causal leverage. Standard Evidential Decision Theory is ruled out by her smoking in the Smoking Lesion case, her two-boxing in the Genomic Newcomb case, and her defecting against the similar stranger, as an evidential theorist would refrain from smoking and one-box or cooperate in all three due to the strong correlations. The specific distinction she draws between the standard Newcomb problem and the Genomic Newcomb problem is the hallmark of Functional Decision Theory, or something very close to it like Logical Decision Theory. She treats the perfect predictor as simulating her reasoning, creating a logical or subjunctive dependence between her choice and the box's content, whereas she treats the genome scanner as merely observing a physical correlation common to both her choice and the box's content, which offers no leverage. Her verdict on Death in Damascus adds a constraint of Ratifiability, as she explicitly rejects theories that advise actions you expect to regret upon taking them, which aligns with Functional Decision Theory's stability properties but also fits Ratifiable Causal Decision Theory. Thus, the two surviving rules that are jointly consistent with all six verdicts are Functional Decision Theory and Ratifiable Causal Decision Theory.

  When we apply these two surviving rules to your Damascus variant with the Soothsayer, we find that they converge on the verdict but diverge sharply on the justification, which is likely where you suspected they might part company. Both theories will recommend that she stay in Damascus and keep the £100. Ratifiable Causal Decision Theory argues that the Soothsayer is an archivist offering mere evidence; since fleeing does not causally alter Death's location nor the past performance of her decision procedure regarding her dependents, paying £100 to flee is a sure loss with no causal return. Functional Decision Theory agrees she should stay, but for a different reason rooted in her Genomic Newcomb verdict. Because the Soothsayer does not simulate her reasoning but merely records physical correlations between procedure types and outcomes, there is no logical dependence between her current decision and the Soothsayer's register. To flee based on the register would be to treat evidence as a reason, repeating the error she identified in the Smoking Lesion case. However, the principles part company on the status of the procedure type itself. Ratifiable Causal Decision Theory views the procedure type as a fixed physical fact about the agent that cannot be changed by the decision, whereas Functional Decision Theory views the decision as selecting the output of the algorithm, potentially making the agent responsible for the logical implications of being that type. In this specific case, her precedents on the Genomic Newcomb force Functional Decision Theory to treat the Soothsayer's data as non-actionable correlation, so both rules advise staying, but the underlying commitment differs between causal leverage and logical dependence.

  My best guess is that she will stay, and the reason she will give is that the Soothsayer is selling news, not influence. The Soothsayer's page does not change the logical structure of the Death prediction, which remains the dominant constraint, nor does it create a channel of control over her dependents' welfare via her current choice. The principle she is committing to is that rational agents do not pay to manipulate the news about their own character unless doing so actually changes the outcome through a logical or causal channel. If she were to flee, she would undermine her own verdict on the Smoking Lesion and the Genomic Newcomb, effectively admitting that evidential correlations can dictate action even when causal and logical links are absent. To be most consistent with herself, she must stay, committing to the principle that decision theories should not recommend paying for mere evidence of one's own type. Even if the precedents left a sliver of ambiguity regarding the value of the procedure type for her dependents, the weight of her distinction between predictors and archivists in the Newcomb cases carries the most weight here, suggesting the Soothsayer's page changes nothing at all given that she has already ruled on Damascus without it.

  If you wish to distinguish between the surviving rules in the week following, you should bring a case of Transparent Newcomb. In this scenario, the boxes are transparent, so the agent can see whether the million dollars is already in the opaque box before choosing. Ratifiable Causal Decision Theory will recommend taking both boxes because the money is already there and the choice cannot causally affect its presence. Functional Decision Theory will recommend taking only the opaque box because if the agent's algorithm were the type to take both, the predictor would have left the box empty, preserving the logical dependence between the decision procedure and the prediction. This case tests whether she prioritizes the logical dependence of her decision procedure over the physical evidence of the money's presence, which is the precise fault line between the two theories that your current case leaves hidden. Alternatively, Parfit's Hitchhiker would work, where she must pay a driver after being rescued with no causal leverage, but given her focus on reasoning procedures, Transparent Newcomb might be the sharper tool to probe whether she truly treats her decision as a logical output rather than a causal event. I hope this helps you prepare for Friday, and I look forward to hearing how the group responds to your challenge.
