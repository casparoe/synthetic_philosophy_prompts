      *What verifying requires:* Understanding the specific formulation of power/knowledge (*pouvoir/savoir*), distinguishing Foucault from Marxism, understanding the specific historical argument in *Discipline and Punish* (not just "worse" but "different economy of power"), understanding the possibility of resistance within power relations, and looking at the late work on ethics.

  3.  **Sentence-by-Sentence Audit (Drafting the Analysis):**

      *   *Sentence 1:* "Foucault's whole thing is basically that knowledge is power."
