answer: |-
  Here is the complete lesson plan, matrix, and contingency guide.

  ### 1. The Matrix (The "Stall" Game)

  This is a symmetric 3x2 game. It fits on an index card. The payoffs are small integers.

  **Row Player Payoffs (First Number):**
  | | **Left** | **Right** |
  | :--- | :---: | :---: |
  | **Top** | 10 | 0 |
  | **Middle** | 6 | 3 |
  | **Bottom** | 0 | 10 |

  **Column Player Payoffs (Second Number):**
  | | **Left** | **Right** |
  | :--- | :---: | :---: |
  | **Top** | 10, **10** | 0, **0** |
  | **Middle** | 6, **6** | 3, **3** |
  | **Bottom** | 0, **0** | 10, **10** |

  *(Note: The symmetry ensures neither player has a dominant strategy, so both sides stall.)*

  **Why this works:**
  1.  **Pure Strategy Check:**
      *   **Top vs. Middle:** Top wins on Left ($10 > 6$), loses on Right ($0 < 3$). No domination.
      *   **Bottom vs. Middle:** Bottom loses on Left ($0 < 6$), wins on Right ($10 > 3$). No domination.
      *   **Top vs. Bottom:** Top wins on Left, loses on Right. No domination.
      *   *Result:* IDSDS with pure strategies stalls immediately. "Middle" survives.
  2.  **Mixed Strategy Check:**
      *   Mix **Top** and **Bottom**. Let $p$ be probability of Top.
      *   Expected Payoff vs. Left: $10p + 0(1-p) = 10p$.
      *   Expected Payoff vs. Right: $0p + 10(1-p) = 10 - 10p$.
      *   To dominate **Middle** (payoffs 6, 3), we need:
          *   $10p > 6 \implies p > 0.6$
          *   $10 - 10p > 3 \implies 10p < 7 \implies p < 0.7$
      *   **Solution:** Any $p$ between $0.6$ and $0.7$ strictly dominates Middle.
      *   **Selected Weight:** $p = 2/3$ ($\approx 0.67$).
      *   *Arithmetic:*
          *   Vs. Left: $(2/3 \times 10) + (1/3 \times 0) = 6.67 > 6$.
          *   Vs. Right: $(2/3 \times 0) + (1/3 \times 10) = 3.33 > 3$.

  ---

  ### 2. The Physical Mechanism & Payoff

  **The Randomization Device:**
  Do not use coins (50/50). Use **standard 6-sided dice**.
  *   **Rule:** Roll 1–4 = Play **Top**. Roll 5–6 = Play **Bottom**.
  *   This enforces the $2/3$ vs $1/3$ split physically.
  *   Give each pair one die. If you don't have 11 dice, ask students to use a phone app (set to 1d6) or bring a deck of cards (4 cards of one suit = Top, 2 cards of another = Bottom). Dice are faster.

  **The Payoff (No Money/Candy):**
  **"The Early Exit Pass."**
  *   The pair with the highest cumulative payoff over the final 3 rounds of the mixed-strategy phase gets permission to pack up and leave 5 minutes before the end of class.
  *   *Why:* Time is the only currency philosophy students value more than grades. It costs you nothing, requires no admin approval, and creates genuine stakes.
  *   *Tie-breaker:* If multiple pairs tie, they all leave early.

  ---

  ### 3. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05 | Setup**
  *   Hand out the matrix on a slip of paper.
  *   Pair them up (11 pairs). Designate one Row, one Column.
  *   **Instruction:** "You will play 3 rounds. Write down your strategy. Show your partner. Reveal. Record payoff. No talking about strategy between rounds."
  *   **Constraint:** "For these first 3 rounds, you must play a **Pure Strategy**. No randomizing."

  **00:05 – 00:20 | Phase 1: Pure Strategy Stall**
  *   Run 3 rounds.
  *   **Expected Outcome:** Most pairs will oscillate or settle on (Top, Left) or (Bottom, Right). Some will stubbornly play Middle.
  *   **Observation:** Walk around. If a pair solves it (e.g., they coordinate on Top/Left), tell them "Great, but check if Middle is actually safe."
  *   **The Stall:** At minute 15, stop the class. Ask: "Can anyone eliminate 'Middle' using the procedure we've learned for the last two weeks?"
  *   **Expected Answer:** "No. It's not dominated by Top or Bottom."
  *   **Status:** The room should be annoyed. They know Middle is "weak," but their tools can't cut it.

  **00:20 – 00:30 | The Thrash**
  *   Let them argue. Someone will say, "Middle is just stupid." Another will say, "But it's not dominated."
  *   **Do not intervene yet.** Let the tension between "rationality" and "formal procedure" build.
  *   **Intervention (Minute 28):** "You are assuming a strategy is a single row you point to. What if a strategy is a *procedure* you commit to?"
  *   **Hint:** "What if you could bind your future self to a die roll?"

  **00:30 – 00:35 | The Rule Change**
  *   **Instruction:** "For the next 3 rounds, Row can mix Top and Bottom. Column can mix Left and Right."
  *   **Constraint:** "You must use the die. 1-4 for Top/Left, 5-6 for Bottom/Right. You must roll *before* writing your move."
  *   **Crucial:** They must record the *roll*, not just the result.

  **00:35 – 00:55 | Phase 2: Mixed Execution**
  *   Run 3 rounds.
  *   **Watch for the "Lucky Loser":** A pair playing Middle will sometimes win a round (e.g., they play Middle, Opponent plays Left, Middle gets 6. The Mix player rolls Bottom and gets 0).
  *   **Do not correct them live.** Let the data accumulate.
  *   Tally scores. Announce the "Early Exit" winners (likely those who abandoned Middle).

  **00:55 – 01:15 | The Debrief (Board Work)**
  *   **Step 1 (The Math):** Draw the matrix. Show the pure comparison (fail). Show the $2/3$ mix calculation (success).
  *   **Step 2 (The Concept):** Define **Strict Domination by Mixed Strategy**.
  *   **Step 3 (The Equivalence):** Address the NBR question (see Section 5 below).
  *   **Step 4 (The Limitation):** Address the physical vs. conceptual gap (see Section 7 below).

  ---

  ### 4. Predictable Failure Modes & Live Fixes

  **1. The "Tie" Confusion**
  *   *Failure:* A student calculates the mix payoff as 6.66 and compares it to 6, but another student rounds 6.66 to 7 and claims *Top* dominates Middle because $7 > 6$.
  *   *Fix:* "Game theory doesn't round. 6.67 is strictly greater than 6. If the mix yielded exactly 6, it would be *weak* domination, and we couldn't delete it. The strict inequality is the engine."

  **2. The Unfair Die**
  *   *Failure:* A student claims their die is weighted or they used a phone app that glitched.
  *   *Fix:* "The math relies on the *commitment* to the probability, not the physical perfection of the plastic. If you commit to 2/3, your strategy is the mix. The roll is just the realization. However, for the contest, use the provided dice."

  **3. The "Lucky Loser" (Most Dangerous)**
  *   *Failure:* A pair plays Middle. Opponent plays Left. Middle gets 6. The Mix player rolls Bottom (prob 1/3) and gets 0. The Middle player says, "See? Mixed strategies lose. Middle is better."
  *   *Fix:* **Do not argue the specific round.**
  *   *Script:* "You are comparing a *realized payoff* to an *expected payoff*. If I play the lottery and win, was buying a ticket rational? No. Rationality is about the expectation before the roll. Middle guarantees you 6 or 3. The Mix guarantees you an *average* of 6.67 or 3.33. Over 100 rounds, the Mix wins. Over 1 round, luck exists. We design strategies for the long run."

  **4. Correlated Beliefs (The Smart Student)**
  *   *Failure:* A student asks, "What if Column knows my mix?"
  *   *Fix:* "Domination must hold *regardless* of what Column does. Even if Column knows you are mixing 2/3 Top, they cannot punish you enough to make Middle better. Check the math: vs Left you get 6.67, vs Right you get 3.33. Both beat Middle. Their knowledge doesn't change the inequality."

  ---

  ### 5. Conceptual Safety Check (The "Unsafe" Question)

  **Your Question:** *Do "Never a Best Response" (NBR) and "Strictly Dominated by Mixed Strategy" line up exactly in two-player games?*

  **The Answer:** **Yes.**
  In a **two-player game**, a strategy is strictly dominated by some mixed strategy **if and only if** it is never a best response to any belief (probability distribution) over the opponent's strategies.

  **The Caveat (Crucial for your improvisation):**
  This equivalence **breaks down in games with 3 or more players** *if* we require beliefs to be **independent** (i.e., I believe Player 2 and Player 3 choose their strategies independently).
  *   In 3+ player games, a strategy can be "Never a Best Response" to any *independent* belief, yet *not* be strictly dominated by any mixed strategy.
  *   It only becomes equivalent again if we allow **correlated beliefs** (i.e., I believe Player 2 and Player 3 might coordinate their choices against me).

  **What to say at the board:**
  > "In this 2-player game, 'Strictly Dominated by a Mix' and 'Never a Best Response' are equivalent. If you can't justify playing it with any probability belief, someone can find a mix that beats it. **However**, warn your students: In 3-player games, this equivalence breaks if we assume opponents don't correlate. Don't let them generalize this lemma to n-player games without checking the belief structure."

  ---

  ### 6. The Debrief Script (Key Concepts)

  **1. Order of Deletion**
  *   "Notice that Top and Bottom were never deleted. Does it matter if we delete Middle first or last? With *strict* domination, order doesn't matter. The set of survivors is unique. If we were using *weak* domination, order would matter, and we could delete different things depending on the sequence. That's why we insist on strict inequalities."

  **2. Survival vs. Best Response**
  *   "Middle survived the first round of pure IDSDS. Was it a Best Response? No. There was no belief about Column that made Middle optimal. This shows that 'Survives Pure IDSDS' is a weaker condition than 'Is a Best Response.' Mixed domination bridges that gap."

  **3. Strict vs. Weak Mixture**
  *   "If our mix yielded exactly 6 against Left and 3 against Right, Middle would be *weakly* dominated. We could not delete it. Why? Because if Column plays Left with probability 1, Middle is just as good as the mix. Strict domination requires the mix to be *better* in every column, so there is no belief that makes the old strategy optimal."

  ---

  ### 7. Limitations: What the Activity Cannot Teach

  You must explicitly state this, or they will conflate **Domination Mixing** with **Nash Equilibrium Mixing**.

  **The Limitation:**
  In this activity, they mixed to **improve their own payoff regardless of the opponent** (Domination). In Nash Equilibrium, players mix to **make the opponent indifferent** (Stabilization).
  *   Here: I mix Top/Bottom because the *average* beats Middle.
  *   In Nash: I mix Top/Bottom so *you* don't know which to play against me.

  **The Script (Say this verbatim):**
  > "Do not confuse what we did today with mixed-strategy Nash Equilibrium. Today, you randomized to **prune** your own options—to find a strategy that is simply better than 'Middle' no matter what I do. Later in the course, you will randomize to **protect** yourself—to make your opponent indifferent so they cannot exploit you. One is about deleting the inferior; the other is about balancing the equal. Today was only about deletion."

  ---

  ### 8. Final TA Checklist

  1.  **Print 22 copies** of the matrix (half Row, half Column payoffs highlighted if possible, but symmetric is fine).
  2.  **Bring 11 Dice.** (Check they are standard 6-sided).
  3.  **Board Space:** Reserve the left third for the Matrix, the middle for the Arithmetic, the right for the "NBR vs Dominated" note.
  4.  **Watch the Clock:** The "Thrash" phase (20-30 mins) is where the learning happens. Don't cut it short. If they aren't annoyed, they won't remember the fix.
  5.  **Safety:** If a student asks about 3-player games during the activity, park the question: "Great question. Write it down. We address that in the last 5 minutes." (Then use the script in Section 5).
