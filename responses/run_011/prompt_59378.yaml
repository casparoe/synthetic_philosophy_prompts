answer: |-
  The spreadsheet was named `Priority_Matrix_v12_FINAL.xlsx`, which was a lie everyone at the Meridian Fund agreed to tell themselves. It was actually version twenty-four, but counting felt like admitting how much time they'd wasted arguing about whether "moderate suffering" was a four or a five.

  Elias sat in the dim glow of the conference room, the air conditioning humming a B-flat that had driven him mad in year one and become invisible by year four. He highlighted cell G45. Application 892: *Microbial Remediation of Landfill Leachate*.

  Severity: 9. (Groundwater contamination affects millions, long-term carcinogens.)
  Tractability: 4. (We know the bacteria exist, scaling is the hard part.)
  Neglectedness: 9. (Nobody wants to work on trash juice.)

  Total Score: 324.

  He typed the formula into the next cell. `=B2*C2*D2`. It autofilled down the column. He sorted by largest to smallest. The trash juice project jumped to the top, displacing a flashy AI-driven malaria diagnostic tool that had scored a respectable 200.

  "You're funding garbage water again?" Julian asked. Julian was one of the two donors, a man who had made his fortune optimizing ad clicks and now treated altruism like a backend refactor. He leaned against the doorframe, holding a bottle of sparkling water that cost more than Elias's hourly rate.

  "It's the highest leverage," Elias said, not looking up. "Nobody else is touching it. Our two hundred grand buys actual pilot infrastructure instead of just another conference ticket."

  "But look at the math." Julian walked over, tapping the screen. "You have a Severity 9 and a Neglectedness 9. But if I have a Severity 3 and a Neglectedness 3, and I make it slightly more tractable... wait. Look at this one." He pointed to a mental health app further down. "Severity 6, Tractability 6, Neglectedness 6. That's 216. Close to your trash juice."

  "And?"

  "And you're multiplying apples by oranges by gravitons," Julian said. "A 9 on Severity means people die. A 1 on Tractability means we can't stop it. Multiplying them implies you can trade deaths for hope. A 9-1-1 gives you a 9. A 3-3-3 gives you a 27. So you're telling me you'd rather fund three moderately annoying problems than one existential catastrophe just because the math looks prettier?"

  Elias stopped typing. He looked at the column of green numbers. They looked solid, authoritative. They were not solid. They were a costume.

  "Someone needs to prioritize, Julian. If we don't multiply, we have to weight. If we weight, we argue. If we argue, we don't write checks."

  "It's lying with arithmetic," Julian said, but he smiled. He liked the efficiency of the lie. "Just make sure the press release looks good. We need to show movement."

  "We're not publishing the raw scores this year," Elias said.

  "Why not?"

  "Because last year we published the raw scores. And now everyone is working on coral larval propagation. We priced ourselves out of our own strategy."

  Julian shrugged. "Market correction. Write the checks, Elias. I'll sign them."

  ***

  Silas worked in a basement lab at State Tech that smelled permanently of wet cardboard and ammonia. He was thirty-four, wore elbow patches on sweaters that weren't fashionable enough to be ironic, and was the world's leading expert on *Pseudomonas* strains that eat polyethylene terephthalate.

  When the email from Meridian arrived, Silas didn't cheer. He read it twice, then walked over to his fume hood and stared at the bubbling flask until his eyes watered.

  His phone rang. Unknown number. He knew it was Meridian.

  "Silas? It's Elias. From the Fund."

  "I saw the attachment," Silas said. "Two hundred thousand. This is... it's enough for the bioreactor."

  "It is."

  "But you put us on the website. The 'Top Ten Priorities' list."

  Elias paused. On his end, the silence was filled by the hum of the office fridge. "We want to highlight the work."

  "You want to highlight the niche," Silas corrected. "Do you know what happens when you tell a room full of grad students that a field is high-impact and neglected? They come. They flood in. My postdoc just got headhunted by a climate startup because they saw your list. They don't care about the plastic, they care that you said it matters."

  "We have to be transparent, Silas. Donors need to see where the money goes."

  "Donors need to feel good. I need to actually fix the sludge." Silas's voice wasn't angry, just tired. It was the tone of a man who had watched a garden get trampled because someone shouted about the flowers. "If you publish this score, my Neglectedness metric drops to a 2 next year. You'll stop funding me. And I won't be done."

  "We'll cross that bridge next year."

  "There won't be a bridge. There'll be a traffic jam."

  Elias hung up and stared at the spreadsheet. Cell G45 glowed. 324. It was the right number. It was also the number that would kill the project.

  ***

  The report was due to the printer on Friday. On Thursday afternoon, Elias sat with the draft PDF open. The public version included the scores. It was supposed to be a beacon for other funders, a way to coordinate capital toward the invisible cracks in the world.

  He opened the editing tool.

  He found Silas's entry. *Project: Polymer Degradation. Severity: 9. Tractability: 4. Neglectedness: 9.*

  If he left it, other funds would see the 9 on Neglectedness. They would see the 324 total. They would send scouts. They would offer Silas speaking fees. Silas would spend his time talking instead of pipetting. The niche would become crowded. The Meridian Fund's edge would vanish.

  If he changed it, he was lying.

  He highlighted the Neglectedness score. He typed a 3.

  *Neglectedness: 3.*

  The total score dropped to 108. It fell out of the Top Ten. It landed in the "Honorable Mentions" section, buried on page four.

  The money would still go through. The wire transfer was separate from the PDF. But the signal would be mixed. To the world, *Polymer Degradation* would look like a crowded, moderately interesting field. To Silas, it would look like an insult.

  Elias's colleague, Mara, walked in with a stack of hard copies for the board. "Ready to send?"

  "Almost," Elias said.

  Mara looked over his shoulder. "Why did you downgrade the plastic project? I thought that was the winner."

  "Strategic alignment," Elias said. The words tasted like ash.

  "You're sandbagging them," Mara said. She didn't sound shocked. She sounded like she'd seen this before. "If you lower the score, other funders won't co-invest. Silas stays stuck with just us. He can't scale."

  "If other funders co-invest, they'll demand changes. They'll want visibility. They'll want him at galas."

  "So you're protecting him from success?"

  "I'm protecting the work from the market."

  Mara leaned against the desk. "You know Julian wants big numbers in the annual report. He wants to show we found the biggest problems. If you hide the score, he looks like he missed the opportunity. Or that we're hiding something."

  "Julian can handle it."

  "Julian likes the narrative of discovery. You're turning it into a narrative of concealment." Mara tapped the paper. "Pick a sin, Elias. Either you expose him and he gets swallowed by the trend-chasers. Or you hide him and he starves for lack of partners. You can't have it both ways."

  Elias looked at the cursor blinking next to the number 3. He thought about the math Julian had pointed out. *9x1x1 vs 3x3x3*. It was all just conversion rates. Suffering into metrics. Metrics into prestige. Prestige into money.

  "If I leave it high," Elias said, "we fund them for one year. Then the field gets hot. Then we move on. The problem doesn't get solved."

  "If you lower it," Mara said, "you solve the problem slower, because he has less money. But maybe he keeps working. Is that better? Slower progress on the thing that matters?"

  "I don't know."

  "Then pick the one that lets you sleep. Or don't. Just print it."

  Elias clicked save. He kept the 3.

  He sent the file to the printer.

  ***

  Three months later, Elias ran into Silas at a conference on effective altruism. It was in a hotel ballroom that smelled of carpet cleaner and ambition. Silas was standing by the coffee station, wearing the same sweater.

  "Hey," Elias said.

  Silas turned. He looked exhausted. "Hey."

  "Did the wire go through?"

  "Yes. Thank you." Silas stirred his coffee. He didn't look at Elias. "I saw the report."

  "Okay."

  "You listed us as a priority 3 on Neglectedness."

  "We had to balance the portfolio."

  Silas laughed, a short, dry sound. "I tried to use your report to leverage a match from the Green Horizon Foundation. They looked at your public data and said the field was too crowded. They passed."

  Elias felt a cold stone settle in his stomach. "I'm sorry."

  "I know why you did it," Silas said. He finally looked up. His eyes were red-rimmed. "You wanted to keep the vultures away. But you kept the food away too."

  "We can bridge the gap next cycle."

  "There might not be a next cycle. The bioreactor cracked. I need fifty thousand more to fix it. Without the match, I don't have it." Silas set his coffee down. "You protected the niche, Elias. You saved the ecosystem. You just killed the specimen."

  Silas walked away toward a panel discussion on *Scaling Impact Through Transparency*.

  Elias stood by the coffee station. He took a cup. It was lukewarm. He pulled out his phone and opened the spreadsheet app. He stared at the blank grid. He could create a new column. *Unintended Consequences*. He could score it. Severity 10. Tractability 0. Neglectedness 10.

  He multiplied them. The result was zero.

  He put the phone away and drank the coffee. It tasted like burnt nuts and nothing else.
