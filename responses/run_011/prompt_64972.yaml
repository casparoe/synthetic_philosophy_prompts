  # Tutorial Plan: The Referendum Trap (Week 9)

  **Objective:** To demonstrate three distinct aggregation pathologies (Agenda Control, Discursive Paradox, Double Majority Conflict) through lived experience rather than abstract theory.
  **Time:** 90 Minutes.
  **Students:** 24.
  **Materials:** 3 packs of index cards (White, Yellow, Blue), 1 pack of Sticky Notes (3 colors), Whiteboard markers, 1 Envelope (sealed).

  ---

  ## I. Preparation (Night Before)

  1.  **The Envelope:** Write the following on a card and seal it in an envelope labeled *"Do Not Open Unless Asked About Fairness."*
      *   *Text:* "The rules are fixed for the purpose of the experiment. If you recognize the mechanism, your role is to maintain the integrity of the simulation, not to reveal the trick. Please help me keep the frame until the debrief."
      *   *Action:* Identify the "Expert" student (the one who knows Westminster indicative votes) as soon as they enter. Hand them the envelope discreetly. Say: *"I need a Returning Officer for Stage 3. Please keep this safe and open it only if the class challenges the rules explicitly."*
  2.  **The Room:** Arrange the long table into three distinct clusters using sticky notes on the table surface.
      *   **Cluster A (Left):** 10 seats.
      *   **Cluster B (Right):** 10 seats.
      *   **Cluster C (Center):** 4 seats.
      *   *Pretext:* You will tell them this is for "Acoustic Grouping" or "College Affiliation" later. For now, just let them sit where they like, but have the sticky notes ready to assign them if necessary. (Ideally, let them self-sort, then assign the clusters based on where they sit to minimize friction).
  3.  **The Options (Week 10):** Define three concrete plans.
      *   **Option 1 (The Seminar):** Student-led presentation on a chosen text (45 mins) + Q&A (45 mins).
      *   **Option 2 (The Screening):** Documentary film (60 mins) + Informal discussion (30 mins).
      *   **Option 3 (The Workshop):** Practical debate simulation (90 mins).

  ---

  ## II. Minute-by-Minute Timeline & Script

  ### 00:00 – 05:00: Introduction & Stakes
  **Action:** Stand at the head of the table. Do not write on the board yet.
  **Script:** "Welcome to Week 9. Today is not about democratic theory; it is about democratic practice. The topic for Week 10 is currently blank. For the next hour, you will determine what we do in Week 10. The decision made today is binding. I will not lecture. I will only administer the votes. There are three stages. The rules may change between stages. Do not discuss your votes with neighbors."

  ### 05:00 – 25:00: Stage 1 — The Agenda (Path Dependence)
  **Goal:** Demonstrate that the order of voting determines the winner, regardless of underlying preferences.
  **Materials:** White Index Cards.
  **Setup:** Write the three options on the whiteboard.
  **Script:** "We have three proposals. We cannot vote on all three at once. We will use pairwise elimination.
  1.  We vote Option 1 vs Option 2.
  2.  The winner faces Option 3.
  3.  The final winner is the Week 10 plan.
  Write '1' or '2' on your white card. Hold them up."
  **Action:** Count aloud. Record the winner on the board.
  **Transition:** "Now, the winner faces Option 3. Write the Number of the Winner or '3'. Hold them up."
  **Action:** Count aloud. Declare the Final Winner (e.g., Option 3).
  **Potential Friction:** If a student asks, "Why this order?"
  **Response:** "The agenda is set by the tutorial lead. It is arbitrary."
  **Contingency (Single-Peaked Preferences):** If Option 3 beats everything clearly regardless of order, proceed to Stage 2. In the debrief, note that *even if* a Condorcet winner exists, the agenda *could* have excluded them.
  **Expert Student:** If she looks like she is about to speak, catch her eye and tap the envelope.

  ### 25:00 – 45:00: Stage 2 — The Mandate (Discursive Paradox)
  **Goal:** Demonstrate that accepting the premises of a decision does not guarantee accepting the decision.
  **Materials:** Yellow Index Cards.
  **Script:** "We have a winner. But is the mandate clear? We will vote on the *logic* of the decision, not the option itself. I will put three propositions on the board. Vote Yes or No on each."
  **Board Work:** Write the following premises (tailored to the Stage 1 Winner, assume Option 3 won):
  1.  *P1: A majority of this room prefers Option 3 over the Status Quo.* (Fact)
  2.  *P2: A simple majority is sufficient to bind the group.* (Norm)
  3.  *P3: The voting process in Stage 1 was procedurally fair.* (Procedure)
  **Conclusion:** *C: Therefore, Option 3 is binding for Week 10.*
  **Action:** "Vote on P1, P2, P3 individually on yellow cards. Then, on the back of the card, vote on C."
  **The Trap:**
  *   Most will vote **Yes** on P1 (it did win).
  *   Most will vote **Yes** on P2 (democratic norm).
  *   *Crucial:* Many who disliked Option 3 will vote **No** on P3 (because they saw the agenda manipulation).
  *   *However*, to force the paradox, you need them to vote **Yes** on P1, P2, P3 but **No** on C.
  *   *Adjustment:* If you sense P3 will fail, change P3 to: *"The Tutor is obligated to follow the class vote."* (Most will say Yes to this principle).
  *   *The Divergence:* Students may vote Yes on all principles (Majority rules, Tutor obeys, Vote was valid) but vote **No** on the Conclusion because they simply hate Option 3.
  **Action:** Tally the Yes votes for P1, P2, P3. Then tally C.
  **Likely Outcome:** P1, P2, P3 all have >50% Yes. C has <50% Yes.
  **Script:** "The premises are accepted. The conclusion is rejected. The result is... inconclusive. We move to Stage 3 to resolve the deadlock."

  ### 45:00 – 65:00: Stage 3 — The Constituencies (Double Majority)
  **Goal:** Demonstrate how subunit vetoes can override popular majorities.
  **Materials:** Blue Index Cards, Sticky Notes (Red, Blue, Green).
  **Setup:** Assign the clusters.
  **Script:** "Because the mandate is unclear, we must ratify this through a federal check. You are now divided into constituencies based on your seating."
  *   **Action:** Place Red sticky notes on Cluster A (10 students).
  *   **Action:** Place Blue sticky notes on Cluster B (10 students).
  *   **Action:** Place Green sticky notes on Cluster C (4 students).
  *   **Pretext:** "This represents geographic or college representation."
  **The Rule:** "For Option 3 to pass, it requires:
  1.  A majority of individual voters (Popular Vote).
  2.  A majority of Constituencies (Subunit Vote).
  3.  **AND** no Constituency may vote against it by a margin of greater than 2:1 (Minority Veto)."
  *(Note: The Veto rule is the key to letting the small group block).*
  **Action:** "Discuss within your constituency for 2 minutes. Then cast one collective vote per constituency on the Blue Card, and an individual vote on the back."
  **The Setup:**
  *   Cluster A & B (Large) likely contain the Stage 1 Winners' supporters. They vote **Yes**.
  *   Cluster C (Small) likely contains the skeptics (or the Expert Student).
  *   **Instruction to Expert (Pre-session):** If she is in Cluster C, she ensures they vote **No** unanimously.
  *   **Result:**
      *   Popular Vote: 20 Yes, 4 No (Passes).
      *   Constituency Vote: 2 Yes, 1 No (Passes).
      *   **Veto Check:** Cluster C voted 4-0 No. This is a >2:1 margin against.
      *   **Outcome:** **FAILED.**
  **Script:** "The popular majority supports Option 3. The constitutional check rejects it. Week 10 remains... Status Quo (Normal Tutorial)."

  ### 65:00 – 90:00: The Debrief
  **Goal:** Map the frustration to the theory.
  **Action:** Erase the board. Draw three columns: *Stage 1, Stage 2, Stage 3.*

  **1. The Agenda (Stage 1):**
  *   **Ask:** "Who preferred Option 1 or 2 over the Stage 1 Winner?" (Hands go up). "Who thinks the order mattered?"
  *   **Reveal:** "This is **Path Dependence**. In Stage 1, I acted as the Agenda Setter. In a referendum, the government chooses the question. If I had voted Option 2 vs 3 first, the winner would have been different. This is not a 'cycle' necessarily; it is **Manipulation of the Option Set**."
  *   **Expert Role:** Ask the Expert to open the envelope. "Did you know?" She confirms. "Why didn't you speak?" (Illustrates how procedural knowledge is often silenced by the frame).

  **2. The Logic (Stage 2):**
  *   **Ask:** "How many voted Yes on all three premises but No on the Conclusion?"
  *   **Reveal:** "This is the **Discursive Paradox** (or Doctrinal Paradox). You can endorse every reason for a policy but reject the policy itself. In referendums, this happens when the 'Question' simplifies a complex bundle of premises. You voted for 'Democracy' (Premises) but against 'This Outcome' (Conclusion)."

  **3. The Structure (Stage 3):**
  *   **Ask:** "Cluster C, you were 4 people. You overruled 20 people. How does that feel?" (Cluster C: Powerful/Guilty. Others: Angry).
  *   **Reveal:** "This is the **Double Majority** or Federal Veto. It protects minorities from the 'tyranny of the majority,' but it creates a 'tyranny of the minority.' In the EU or Switzerland, this prevents centralization. In this room, it created gridlock."

  **Synthesis:**
  "Individually, each mechanism has a defense. Agenda setting is efficient. Premise voting is logical. Federalism is protective. **Together**, they compound. The Agenda narrowed the choice. The Premises legitimized the choice. The Federalism vetoed the choice. The result is not a 'will of the people.' It is a procedural artifact."

  ---

  ## III. Limitations & Risks (Frank Assessment)

  ### What This Activity Cannot Reproduce
  1.  **Preference Formation:** In a real referendum, campaigns persuade voters over months. Here, preferences are pre-existing or arbitrary. *You must supply this in the debrief:* "In the real world, the 'No' campaign would have tried to change your mind on P3, not just vote on C."
  2.  **Intensity:** Choosing a tutorial topic is low-stakes. Constitutional votes involve identity and security. *Limitation:* The anger in the room will be playful, not visceral. *Mitigation:* Emphasize that the *structure* of the frustration is identical, even if the emotional volume is lower.
  3.  **The Mandate:** Real referendums claim to settle issues. This activity settles nothing (Week 10 reverts to Status Quo). *You must explain:* "This is the danger of bad design. It produces a result that no one treats as settled."
  4.  **Scale:** 24 students cannot show the statistical noise of millions. *Limitation:* It shows the *logic* of aggregation, not the *sociology*.

  ### Predictable Failures & Mitigations
  1.  **Strategic Voting:** Once students realize Stage 2 affects Stage 3, they will vote insincerely.
      *   *Fix:* In the debrief, acknowledge this. "Strategic voting is a rational response to bad rules. The fact that you felt you *had* to lie to get a true outcome proves the system is flawed."
  2.  **The "Expert" Spoiler:** She might blurt out "This is a Condorcet Cycle!" in Minute 10.
      *   *Fix:* The Envelope. If she breaks frame, pause the class. "You have broken the simulation. Please sit out the voting and observe." (Use sparingly).
  3.  **Stage 3 Alignment:** If Cluster C (Small) agrees with the Majority, the Veto doesn't trigger.
      *   *Fix:* **The Preference Grouping Fallback.** If you see Cluster C nodding along in Stage 1, re-assign them in Stage 3. "For the Federal Check, all students who voted for the *Losing* Option in Stage 1 must move to Cluster C." This guarantees the conflict. It looks like gerrymandering—*lean into that*. "Yes, this is gerrymandering. That is the point."
  4.  **Timing Overrun:** Discussions will drag.
      *   *Fix:* Be authoritarian with the timer. "Votes close in 10 seconds. 5, 4, 3..." If Stage 2 runs long, cut the Stage 3 discussion time, not the voting time.

  ### The "Gerrymandering" Charge
  Students will accuse you of rigging the subunits in Stage 3.
  **Do not rebut this.**
  **Script:** "You are correct. I allocated the subunits to ensure a conflict. In real constitutional design, boundaries are *always* drawn to produce specific outcomes. The question is not whether the map is neutral—it never is—but whether the resulting veto power is justified. Was your frustration with the *result*, or with my *power to draw the map*?"

  ---

  ## IV. Materials Checklist (Night Before)
  *   [ ] 30 White Index Cards (Stage 1).
  *   [ ] 30 Yellow Index Cards (Stage 2).
  *   [ ] 30 Blue Index Cards (Stage 3).
  *   [ ] 1 Pack Sticky Notes (Red, Blue, Green).
  *   [ ] 1 Sealed Envelope (for Expert Student).
  *   [ ] Whiteboard Markers (Black, Red, Blue).
  *   [ ] Timer (Phone).

  ## V. Final Note to Tutor
  You are not a neutral facilitator today. You are the **Constitution**. You are the source of the friction. If the class is happy, you have failed. If they are arguing about the rules rather than the topic, you have succeeded. Keep your face neutral. Let the rules be the villain.
