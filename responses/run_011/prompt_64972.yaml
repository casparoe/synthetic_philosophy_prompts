              *   Option A: "The Activist" (Student-led protest simulation).
              *   Option B: "The Academic" (Close reading of a dense text).
              *   Option C: "The Relax" (Film/Docu).
          *   *Mechanism:* Pairwise elimination. Order: A vs B, Winner vs C.
          *   *Goal:* Show that if we voted B vs C first, then Winner vs A, a different result happens.

      *   *Activity 2 (Discursive Paradox):* Needs Premises (P1, P2, P3) -> Conclusion (C).
          *   *Logic:* Majority says Yes to P1, Yes to P2, Yes to P3. But Majority says No to C (where C = P1 & P2 & P3).
