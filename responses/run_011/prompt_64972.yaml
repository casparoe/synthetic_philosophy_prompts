          *   *Problem:* If they vote Yes on all premises, they logically *must* vote Yes on conclusion. To get the paradox, the *individual* logic must differ.
          *   *Standard Discursive Paradox Setup:*
              *   Voter 1: Yes, Yes, No -> No (Conclusion)
