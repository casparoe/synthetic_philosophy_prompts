answer: |-
  The paragraph is salvageable with edits, though its central claim is currently a misstatement of the position it purports to describe.

  1.  **Sentence-by-Sentence Audit**
      *   **Sentence 1:** Wrong. "Moral testimony" is the phenomenon of forming beliefs based on others' say-so; the *position* described is "Moral Testimony Pessimism." You must distinguish the practice from the critique.
      *   **Sentence 2:** Acceptable simplification of "Strong Pessimism" (no knowledge via testimony), but the justification ("nothing for testimony to transmit") is metaphysically loaded. The correct version is that testimony transmits *belief* but fails to transmit *understanding* of the reasons.
      *   **Sentence 3:** Wrong and conflated. "Moral truths are not the sort of thing anyone is in a position to detect" suggests non-cognitivism (no moral facts), whereas pessimists typically accept moral facts but argue they require first-hand grasp. "Philosophers are... no more reliable" is an empirical claim irrelevant to the philosophical thesis, which holds even if philosophers *were* reliable.
      *   **Sentence 4:** Acceptable simplification of the "Normative/Aretaic" thesis (deference undermines virtue), but "hence the word we have..." is rhetorical filler without a clear referent (e.g., "dogmatist" or "blind follower").
      *   **Sentence 5:** Overstatement. Pessimists do not claim thinking harder is the *only* way to improve, nor is the novel-versus-theory contrast a necessary consequence of testimony pessimism.
      *   **Ambiguity:** Sentence 3 ambiguously suggests either that moral truths don't exist or that they are privately accessible. The draft's argument needs the latter (privately accessible) to maintain that the philosopher is "right" in Sentence 2, but it uses language implying the former.

  2.  **Central Defect: Epistemic vs. Normative Conflation**
      *   Yes, the central defect is a conflation of an epistemic thesis (what testimony can transmit) with a normative thesis (whether one may rely on it) and a metaphysical thesis (the nature of moral truth).
      *   A standard pessimist needs the **Normative/Aretaic Thesis**: you *can* gain knowledge via testimony, but you *should not* rely on it because it bypasses the understanding required for moral worth. The draft formulates the **Strong Epistemic Thesis**: you *cannot* gain knowledge at all.
      *   The draft's formulation is stronger than the real one. This difference turns on the viability of institutions: if the Strong Epistemic Thesis holds, deference yields ignorance; if the Normative Thesis holds, deference yields correct action but diminished moral agency. The pessimist need not deny that a hearer comes to know *that* an act is wrong, only that they lack the *understanding* of *why* it is wrong.

  3.  **Second Paragraph Follow-Through**
      *   The second paragraph follows only from the corrected Strong Epistemic Thesis, not the standard Normative Thesis.
      *   **Examples:** The bioethicist and columnist are instances of moral testimony. The forensic expert is **not**; forensic testimony concerns empirical facts (DNA, ballistics), not moral values, so including it confuses moral deference with factual deference.
      *   **Fraud Charge:** The charge against philosophers testifying to legislatures depends on the claim that philosophers offer mere say-so rather than reasons. Pessimism targets blind deference; if philosophers provide arguments for legislators to evaluate, the pessimist objection does not apply. Therefore, the fraud charge is unsupported unless the draft specifies that philosophers are demanding uncritical acceptance.

  4.  **Rewrite**
      Moral testimony pessimism is the view that while we can gain moral knowledge from others, relying on their say-so deprives us of the understanding necessary for genuine virtue. Unlike factual matters like the weather, moral truth requires grasping the reasons behind a judgment, which testimony cannot convey without personal reflection. Consequently, pessimists argue that deferring to experts may yield correct answers, but it fails to make us better people. This suggests that while institutions may consult experts for guidance, individuals must ultimately do the moral reasoning themselves. Thus, the debate centers not on whether experts exist, but on whether their authority can replace personal reflection.
