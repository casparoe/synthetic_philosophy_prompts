      *Actually, the strongest Nozickian internal critique:* Nozick grounds side constraints in the capacity to shape one's life according to an overall conception of the good. Animals lack this. So they are utility buckets. But if they are utility buckets, the *Repugnant Conclusion* looms (breed happy cows to offset human rights violations?). Nozick would reject this. Therefore, he *needs* constraints on animals. But if he adds constraints, he loses the hybrid.
      *Let's go with:* The hybrid collapses **downward**. To avoid the absurd implications of pure utilitarianism for animals (the "breeding" problem), Nozick must implicitly grant them side constraints. But once he does that, the sharp distinction between persons and animals blurs, threatening the Kantian foundation for persons.

