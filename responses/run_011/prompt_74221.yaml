  **NOTE**

  The recorder is bound to set down what reaches him, not to vouch for its certainty. Similarly, the words put into mouths here are shaped by what the moment demanded, not by what was spoken, for those who stood in the same dust remembered differently according to their hope. We print what fits the gap, knowing the space could hold another name.
