  This engineered case demonstrates that competing species concepts deliver divergent verdicts on the same population because they track different biological properties rather than a single underlying reality. Two sympatric songbird populations occupy identical ranges without interbreeding, maintained solely by distinct, culturally transmitted song traditions learned from neighbors rather than inherited genetically. Morphologically indistinguishable and genetically admixed at neutral loci with no fixed alleles or reciprocal monophyly, the groups persist as stable behavioral lineages despite the absence of intrinsic biological barriers or phylogenetic structure. The Biological Species Concept delivers two species because reproductive isolation exists regardless of cause, while Nixon and Wheeler's Diagnosability Phylogenetic Species Concept delivers one species because there are no fixed, heritable character states to diagnose lineages. Paterson's Recognition Concept also delivers one species, as the shared biological capacity for fertilization remains identical despite the cultural variation in signaling cues. The feature doing the work is the heritability of the isolating barrier; if the song difference were genetic, the Phylogenetic Species Concept would switch to two species, the Recognition Concept would likely switch to two due to divergent mate recognition systems, and the Biological Species Concept would remain at two. A defender of the Phylogenetic concept, facing criticism for lumping distinct isolating groups, would attack the case by denying that non-heritable behavioral barriers constitute speciation, arguing species must be evolutionary lineages defined by inherited traits rather than transient cultural norms, effectively claiming the case falls outside the concept's scope. Whether this divergence warrants pluralism or reveals one concept as mistaken remains a live debate among systematists, with no consensus on monism or pluralism.
