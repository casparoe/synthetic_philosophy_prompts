answer: |-
  **Diagnosis of Allocative Difficulty**

  The allocative difficulty facing the federation is distributed as follows: **F1 (Aggregation): 0.40**, **F2 (Commensuration): 0.30**, **F4 (Compliance): 0.20**, **F3 (Discovery): 0.10**.

  The dominant failure mode is F1. The single feature doing the most work here is the stipulation that "no two [jobs] are alike," rendering processing requirements tacit and local to each shop. Because every tooling job is unique, the central council cannot know the specific machine constraints, setup times, or optimal routings without costly transmission of nuanced technical data. The feature whose removal would most change this distribution is the existence of a "repeatable product whose price could be observed." If standard products existed, historical cost data would collapse F2 (commensuration) and significantly reduce F1 (aggregation), as technical requirements would become codified rather than tacit.

  Regarding the canonical theorists: Mises was chiefly worried about F2, arguing that without market prices, rational calculation is impossible. Hayek was chiefly worried about F1, emphasizing that the relevant knowledge of time and place is dispersed and cannot be centralized. Lange was chiefly worried about F4, assuming managers would comply with iterative pricing rules despite lacking ownership incentives. Our problem sits squarely on Hayek's axis (F1); while we lack prices (F2), the deeper barrier is that the council cannot know the local production possibilities required to value those prices correctly.

  **Mechanism Tiering**

  **Tier S: (c) Sealed-bid internal auction.**
  This mechanism best solves F1 by forcing shops to reveal their local valuation of capacity through bids rather than reports. By rebating revenue, it prevents wealth extraction while allowing the lumpy demand to clear efficiently against fixed supply.

  **Tier A: (e) Queue with tradable positions.**
  This is a low-friction market proxy that solves F2 on the margin without requiring complex accounting. It allows shops with urgent deadlines to compensate those with flexible schedules, respecting local knowledge of deadline criticality.

  **Tier B: (b) Administered transfer prices.**
  This Lange-style approach fails primarily on F1, as the council lacks the information to set prices that reflect real-time scarcity. However, it provides a stable unit of account, making it superior to pure bureaucracy if revised frequently enough.

  **Tier C: (f) Central optimization and (d) Unmediated bargaining.**
  Central optimization fails on F4 and F1; it requires truthful input of process times which shops have incentives to pad, rendering the solution mathematically precise but practically useless. Unmediated bargaining lands here due to high transaction costs; coordinating pairwise trades among fourteen shops creates prohibitive friction compared to a centralized clearing mechanism.

  **Tier D: (a) Standing allocation committee.**
  This is the most vulnerable to F4 and F1, as it invites lobbying and relies on non-technical administrators judging technical priorities. It substitutes political capital for economic value, guaranteeing that capacity flows to the loudest voice rather than the most urgent job.

  **Closing Checks**

  First, consider the counterfactual where the engineering library and CAM seats are owned by an outside licensor charging royalties. This change introduces real external price signals for previously non-rival goods, slightly reducing the weight of F2. Consequently, the tier assignment for mechanism (b), administered transfer prices, would move upward from Tier B to Tier A. With external royalties anchoring the cost of CAM usage, the council could set internal machine-hour prices relative to a known cost base, mitigating the arbitrariness that currently plagues administered pricing. The auction mechanism (c) remains in Tier S, as external costs reinforce the need for internal valuation but do not replace it.

  Second, the tier assignment I am least confident about is the placement of mechanism (f), central optimization, in Tier C. It is theoretically elegant and could function as Tier B if the information problem were solvable. The specific fact about our federation needed to settle this is the historical variance between *reported* process times and *actual* process times for the three shops doing outside work. If historical data shows that shops consistently pad estimates by more than fifteen percent to secure buffer capacity, then F4 (compliance) is binding, and (f) must remain in Tier C or lower. If reports are historically accurate within five percent, then F1 is less severe than diagnosed, and (f) could reliably solve the scheduling problem, moving it to Tier B or A. Without this data, we must assume incentive incompatibility dominates mathematical optimization.

  In sum, the federation's problem is not merely a lack of prices, but a lack of knowable parameters for those prices. Any mechanism that relies on central knowledge of local production conditions will fail. The solution must extract valuation from the shops without requiring them to transmit their tacit technical knowledge to the council. The auction mechanism achieves this by treating capacity as a property right to be traded, aligning the federation's constraints with the shops' local information.
