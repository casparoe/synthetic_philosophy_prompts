      *   *Interpretation:* I need to interpret this charitably or note it as a potential error in the prompt's description of Northlight. *Wait, looking closer:* "within any narrow score band, the fraction of defendants who got a new charge... is about the same as the band's score says." This is Calibration.
      *   *The Contradiction:* If I have perfect calibration, but the average score for recidivists equals the average score for non-recidivists, that implies the distribution of scores is identical for both groups. That means the tool tells you nothing.
      *   *Decision:* I will treat this as a potential data anomaly or phrasing issue in the prompt but focus on the *FPR disparity* which is the core conflict. Actually, looking at the FPR stats (41% vs 27%), there *is* discrimination. I will assume the "average score" line in the prompt was meant to indicate "balance" or perhaps I should interpret it as "the tool is well-calibrated" and ignore the confusing "average score" sentence as a distractor or a specific metric I shouldn't rely on heavily. *Better approach:* I will focus on the FPR disparity (41% vs 27%) as the main problem with Northlight, as that's the concrete number provided. I won't lean heavily on the "average score" claim because it sounds mathematically inconsistent with the FPR data provided. I will treat Northlight as "Calibrated but Disparate FPR."
