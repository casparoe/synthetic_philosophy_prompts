          *   *Cons:* High False Positive Rate (FPR) disparity. Black non-recidivists flagged high risk 41% vs. White 27%. Base rates differ (Black 29%, White 19%).
      *   **Meridian (Option B):**
          *   *Pros:* Claims to hit calibration + equal FPR/FNR.
          *   *Cons:* Uses group-specific cutoffs (same score = different risk meaning per group). Proprietary black box (no confusion matrices). Demo on state data, not local. Legal risk on "race-neutral in form."
      *   **Coalition (Option C):**
          *   *Pros:* Directly addresses detention rate gap.
          *   *Cons:* Arbitrary threshold (3 points). Might increase crime/detention overall to fix ratio. Doesn't solve the underlying metric tension.
      *   **Colleague/Transparency (Option D):**
