answer: |-
  **MEMORANDUM**

  **TO:** Pretrial Tools Review Commission, Larkin County
  **FROM:** [Your Name], Commissioner
  **DATE:** May 15, 2024
  **SUBJECT:** Recommendation on Risk Assessment Contract Renewal & Metric Framework

  **Purpose**

  This memo outlines my recommendation for the June vote on the pretrial risk assessment contract. We are operating under statutory ambiguity regarding "race-neutral in form and effect." We have four distinct paths: renew Northlight (Current), switch to Meridian (Option B), adjust Northlight cutoffs (Option C), or renew Northlight with enhanced transparency (Option D).

  There is no mathematical solution that satisfies all fairness concerns simultaneously given our local base rate differences. This memo does not pretend otherwise. It recommends a path that maximizes legal defensibility and public accountability while acknowledging the trade-offs.

  ### 1. Recommendation: Option D (Transparency & Status Quo)

  **I recommend we renew Northlight with the conditions outlined in Option D.**

  We should retain the current tool but adopt the colleague's proposal: publish quarterly error breakdowns by group, subject the trade-offs to annual public debate, and provide judges with a plain-language explainer on the limits of algorithmic fairness.

  **Rationale:**
  *   **Legal "Form":** Meridian (Option B) uses group-specific cutoffs. A score of "7" means a different risk level for a Black defendant than for a White defendant. This is highly vulnerable to a challenge on "race-neutral in form." Northlight applies the same rule to everyone.
  *   **Legal "Effect":** While Northlight shows disparate False Positive Rates (41% vs. 27%), Option C (lowering cutoffs for everyone) risks increasing detention rates overall to fix a ratio, which may violate the statutory mandate to detain only based on risk. Option D acknowledges the disparity without hiding it or distorting the risk scores.
  *   **Accountability:** Option D forces the Commission to own the value judgment. We are not outsourcing our ethics to a vendor's black box.

  **Implementation Timeline:**
  *   **June 15:** Commission Vote to renew Northlight conditioned on Option D reporting requirements.
  *   **July 1:** Issue RFP for independent audit of Northlight's local validation (see Section 4).
  *   **August 15:** Draft "Judicial Explainer" on metric trade-offs; circulate to Bench for comment.
  *   **September 1:** Contract execution.
  *   **December 1:** First Quarterly Error Report published to public.

  ### 2. Ranking of Fairness Metrics

  The statute requires decisions to be "race-neutral." To interpret this, we must rank what matters most in a *detention* decision. Detention is a deprivation of liberty justified only by specific, individualized risk of failure. Therefore, metrics that ensure the *truthfulness* of the risk estimate must rank higher than metrics that ensure *equal outcomes* across groups.

  **Tier 1: Calibration Within Group (Predictive Parity)**
  *   **Rank:** 1st
  *   **Why:** If a "High Risk" score predicts a 60% reoffense rate for White defendants but only a 30% rate for Black defendants, the tool is lying to the judge. This violates due process. A score must mean the same thing regardless of race for the decision to be individualized. Northlight passes this; Meridian compromises this by using group-specific cutoffs.

  **Tier 2: Calibration Overall**
  *   **Rank:** 2nd
  *   **Why:** Similar to Tier 1, but ensures the tool isn't systematically over- or under-estimating risk for the population as a whole. Essential for resource planning.

  **Tier 3: Equal False Negative Rates (Safety)**
  *   **Rank:** 3rd
  *   **Why:** We do not want one community to be less safe than another because the tool failed to flag a dangerous defendant. Public safety is a universal interest. However, forcing this equality when base rates differ often requires sacrificing Calibration (Tier 1).

  **Tier 4: Equal False Positive Rates (Liberty)**
  *   **Rank:** 4th
  *   **Why:** This is the current pain point (41% vs. 27%). It is morally significant that innocent Black defendants are detained at higher rates. However, mathematically, equalizing FPR when base rates differ (29% vs. 19%) *requires* breaking Calibration (Tier 1). We cannot prioritize equal error rates over truthful risk estimates without detaining people who are not actually high risk just to balance the ledger.

  **Tier 5: Statistical Parity (Demographic Parity)**
  *   **Rank:** 5th
  *   **Why:** This demands equal detention rates across groups. If one group has a higher observed base rate of reoffense, enforcing Statistical Parity means either releasing dangerous people from the higher-risk group or detaining safe people from the lower-risk group. This is incompatible with individualized risk assessment.

  ### 3. The Impossibility Claim: Meridian vs. Base Rates

  Meridian claims the "impossibility theorem" (that you cannot have Calibration, Equal FPR, and Equal FNR simultaneously) is an artifact of picking the wrong metrics. My colleague argues the base rate difference (29% vs. 19%) is the sole culprit.

  **My Assessment:** My colleague is correct. Meridian is not solving the math; they are obscuring the trade-off.

  **The Knockdown:**
  Meridian claims to achieve Calibration *and* Equal Error Rates. The only mathematical way to do this when base rates differ is to use **group-specific cutoffs**.
  *   If Group A has a higher base rate, you must set a higher threshold for "High Risk" to equalize False Positive Rates.
  *   This means a defendant in Group A needs a higher raw score to be flagged than a defendant in Group B.
  *   **The Consequence:** The score no longer represents a uniform probability of risk. A "7" for Group A is not a "7" for Group B.
  *   **The Survival:** What survives this scrutiny is the reality that **base rates drive the tension.** Meridian's model shifts the burden from the *algorithm* to the *policy*. They are effectively hard-coding a policy choice (different cutoffs) into the software. This does not remove the impossibility; it merely hides the violation of "Calibration Within Group" inside the vendor's proprietary code.

  **Honest Admission:**
  We cannot have it all. If we prioritize Calibration (truthful risk), we accept disparate False Positive Rates (Northlight). If we prioritize Equal Error Rates, we accept disparate score meanings (Meridian). Option D chooses truthful risk scores and manages the disparity through transparency rather than mathematical obfuscation.

  ### 4. Data Collection Needs Before June Vote

  Our auditor's work is the only local evidence we have. To make Option D defensible, and to ensure we aren't ignoring a better alternative, we need the following immediately:

  1.  **Meridian Local Validation:** We cannot vote on Meridian based on state-level demo data. We need their model run on Larkin County's last 3 years of data. If they claim it is "proprietary," they are not a viable option for a public commission.
  2.  **Northlight Predictive Validity Check:** The vendor claims "average score among recidivists is about equal to... non-recidivists." If true, the tool has no predictive power (AUC ≈ 0.5), yet the FPR data suggests it does. We need an independent statistician to verify the AUC/Discrimination metric before renewal.
  3.  **Option C Simulation:** We need the analyst to model Option C. If we lower the cutoff to shrink the detention gap to 3 points, what happens to the overall reoffense rate? If public safety drops significantly, Option C is untenable.
  4.  **Judicial Usability Test:** For Option D, we need to know if judges will actually read the "one-page explanation." A short survey of the local bench is necessary. If they ignore it, transparency is performative.

  ### Legal Flag & Dissent

  **Statutory Risk:**
  If the County Attorney or a court interprets "race-neutral in effect" to require **Equal False Positive Rates**, Option D fails. Northlight currently produces a 14-point gap in FPR. If the statute is read strictly to mean "equal error rates," we may be forced toward Meridian (Option B) or Option C, despite the risks to "form" and calibration. I recommend we request a formal written opinion from the Attorney on whether "effect" permits disparate impact resulting from base rate differences, prior to the June vote.

  **For the Record:**
  I know Commissioners supporting Option B (Meridian) believe that equalizing error rates is the only moral choice, regardless of the cutoff mechanics. I know Commissioners supporting Option C (Coalition) believe the detention gap itself is the harm, regardless of the underlying risk scores.

  This recommendation prioritizes the integrity of the risk score (Calibration) and the legality of the "form" (same rule for all). It does not solve the disparity. It makes the disparity visible so the Commission can answer for it.

  I look forward to debating this in the meeting.
