prompt: |-
  I'm the sole staff person supporting the standards committee of a regional federation of worker cooperatives — thirty-eight member co-ops across food production, light manufacturing, software, and home care. Membership is not decorative: it carries access to a revolving loan fund, a shared certification mark that members put on retail packaging, and preferential purchasing from other members. Two or three times a month I get a file that turns, whether or not anyone says so in those terms, on a Marxian question — is this arrangement extracting surplus from someone who has no claim on it, and does the work itself deform the people doing it. At present I have no framework, and the decisions are made by seven elected members with mixed schooling, no taste for theory, and about as much patience for abstraction as a zoning board. I get roughly two hours per file. I took one undergraduate course that covered the theory of surplus value and the early writings on alienation, and I would like to build the procedure out of that material, though I'm aware Marx is not obviously in the business of handing anyone a decision rule.

  What I want is a procedure I can actually run: the questions to ask in order, what counts as a sufficient answer to each, which of them are answerable from a co-op's books and governance documents and which are not answerable from anything I can obtain, where the procedure terminates in a refusal, and where it stops and hands the question back to the committee because the remaining issue is one of values rather than facts. It has to keep the two axes distinct rather than letting them collapse into a single score of good-or-bad workplace: the appropriation of surplus (who produces, who claims, under what property relations, and whether the claim rests on ownership rather than on work), and the character of the activity itself (the four moments of alienation in the 1844 manuscripts — from the product, from the act of producing, from species-being, and from other human beings). For each of those four, tell me plainly whether a non-specialist reading a file can operationalize it or whether it cannot be operationalized at all, and don't hand me a checkbox I'll be unable to fill in honestly. The procedure must also confront the feature of Marx's account that makes my current practice look confused: his claim that exploitation occurs through the free exchange of equivalents and does not depend on the wage being below market, on coercion, or on anyone's intentions or bad faith. Much of what my committee currently tests — pay levels, consent, whether workers are better off than their alternatives, the existence of a grievance channel — may be beside the point, and I need to be told what to do when a file shows non-member workers paid above the local market, satisfied with the arrangement, and freely consenting to it. Where the distinction between labor and labor power, or between absolute and relative surplus value, buys me something observable, keep it; where it is load-bearing in the theory but invisible from inside a co-op's file, say so and move on. Address how far the procedure reaches beyond the member's own walls — the co-op that is internally impeccable but buys its inputs from firms running ordinary wage labor — and use the formal versus real subsumption distinction only if it actually generates a different verdict somewhere. Finally, be explicit at the step where it happens, not in a closing caveat, about anywhere Marx's account does not supply a decision rule and you have had to import one: for instance the analytic-Marxist move to define exploitation in terms of unequal ownership of productive assets and a counterfactual test about what a coalition could withdraw with, or a domination-based test about who is subject to whose arbitrary will. Tell me which distinctions you judged indispensable to the translation and which you dropped, what the dropped ones were doing in the theory, and whether the imports change any verdicts.

  Then run the procedure on three files I have in front of me. First: a bakery with twelve member-owners, one member one vote, pay held within a two-to-one band, surplus distributed in proportion to hours worked, and six non-member seasonal workers paid above the local living wage with no realistic path to membership, because the buy-in is five thousand dollars and the season runs four months. Second: a software co-op that is fully worker-owned and governed but in which a mission-aligned venture fund holds three million dollars of preferred stock, a board seat, and a liquidation preference, and whose product is a scheduling and location-monitoring platform sold to logistics firms. Third: a member co-op with impeccable internal democracy that voted last year to contract out its night-shift cleaning to an outside non-union firm, after which member distributions rose by twelve percent. I expect the third to come out badly and I want it to: if the procedure gives a clean pass to the file my committee is proudest of, it is tracking the wrong thing. Close by telling me where the procedure will misfire — which files it will classify wrongly and why, what a co-op could do to game it while satisfying every step, which inputs I simply will not be able to obtain — and what it cannot do even when it is run competently and in good faith.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Sole staff supporting a standards committee for a regional federation of worker co-ops (38 members).
      *   **Context:** Membership has real stakes (loan fund, certification mark, preferential purchasing).
      *   **Problem:** Decisions often turn on Marxian questions (surplus extraction, alienation), but the committee (7 elected members) lacks theoretical patience/time. The user has ~2 hours per file.
      *   **User's Background:** One undergrad course on surplus value and 1844 Manuscripts.
      *   **Goal:** A concrete, operational procedure (questions in order, sufficiency criteria, data sources, termination points) based on Marxian theory but adapted for this specific bureaucratic context.
      *   **Key Constraints:**
          *   Keep two axes distinct: Surplus Appropriation (exploitation) vs. Character of Activity (alienation).
          *   Address the "free exchange of equivalents" problem (exploitation isn't about low wages or coercion).
          *   Address the Labor vs. Labor Power distinction (keep if observable, drop if not).
          *   Address Supply Chain issues (external exploitation).
          *   Address Formal vs. Real Subsumption (use only if it changes verdicts).
          *   **Crucial:** Explicitly state where Marx doesn't provide a decision rule and where non-Marxian imports (Analytic Marxism, Domination theory) are used. Explain what was dropped and why.
          *   **Application:** Run the procedure on three specific cases (Bakery, Software Co-op, Cleaning Contract).
          *   **Critique:** End with limitations, gaming potential, and missing inputs.

  2.  **Theoretical Translation (Marx to Bureaucracy):**

      *   *Surplus Value/Exploitation:* Marx defines this structurally (M-C-M'), not morally. Workers sell labor-power; capitalists buy it and extract surplus labor. In a co-op, the "capitalist" function is ideally dissolved.
          *   *Problem:* Non-member workers. If they sell labor-power to the co-op and don't share in the surplus *because* they don't own capital (the buy-in), is that exploitation? Yes, structurally.
          *   *Problem:* External Investors. Preferred stock/liquidation preference looks like interest-bearing capital claiming surplus without labor.
          *   *Problem:* Supply Chain. Buying commodities produced by exploited labor transfers value.
          *   *Operationalization:* Focus on *claims on surplus* relative to *contribution of labor*.
      *   *Alienation (1844 Manuscripts):*
          1.  From Product (do they own/control what they make?).
          2.  From Process (is the work autonomous or dictated?).
          3.  From Species-Being (is the work creative/human or mechanical?).
          4.  From Others (is work competitive or cooperative?).
          *   *Operationalization:* This is hard to measure in 2 hours. Need proxies in governance docs and job descriptions.
      *   *The "Free Exchange" Trap:* High wages + consent $\neq$ no exploitation. The procedure must ignore "satisfaction" and "market rate" as exonerating factors. It must look at *property relations*.
      *   *Imports:* Since Marx doesn't give a "pass/fail" for co-ops (he was analyzing capitalism), I need to import a normative threshold. *Analytic Marxism (Roemer)* is useful here: Exploitation = unequal ownership of productive assets leading to unequal distribution of surplus. *Domination (Neo-Republicanism)* is useful for the alienation/authority aspect.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Structure:* Two Tracks (Surplus & Alienation).
      *   *Time Limit:* 2 hours.
      *   *Data Sources:* Bylaws, Cap Table, Payroll summaries, Supply Chain disclosures, Job Descriptions.
      *   *Step 1: Surplus Appropriation (The "Who Claims" Track).*
          *   Q1: Who performs the labor? (Member vs. Non-member).
          *   Q2: Who claims the residual surplus? (Patronage dividend vs. Interest/Dividends).
          *   Q3: Is the claim based on Labor or Asset Ownership?
          *   *Import:* Roemer's withdrawal rule (simplified). If a group left, could they take their share of assets?
      *   *Step 2: Alienation (The "How it Feels/Works" Track).*
          *   Q1: Product (Who decides price/use?).
          *   Q2: Process (Who sets pace/method?).
          *   Q3: Species-Being (Skill utilization).
          *   Q4: Others (Competition vs. Solidarity).
      *   *Step 3: External Relations (Supply Chain).*
      *   *Decision Matrix:* Refusal (Structural Exploitation), Referral (Alienation/Values), Pass.

  4.  **Refining the "Imports" and "Drops":**

      *   *Drop:* Labor vs. Labor Power distinction *in the wage context*. Why? Because in a co-op file, you see "wages" and "dividends." Distinguishing the value of labor power from the value produced is impossible without time-motion studies. *Replacement:* Focus on *distribution of surplus*. If surplus goes to non-laborers, it's extraction.
      *   *Drop:* Absolute vs. Relative Surplus Value. *Reason:* Invisible in files.
      *   *Import:* Roemer's Asset Inequality. This allows us to judge the "seasonal worker" issue without needing to calculate surplus value rates.
      *   *Import:* Domination/Arbitrary Will. For alienation, since "species-being" is metaphysical, use "authority structures" as a proxy.

  5.  **Running the Cases:**

      *   *Case 1 (Bakery):*
          *   Surplus: Members get surplus (hours worked). Non-members get wages (above market). *Issue:* Non-members cannot access surplus due to capital barrier ($5k buy-in) + time barrier (4 months). This creates a class distinction within the co-op. *Verdict:* Exploitation of non-members (Roemerian).
          *   Alienation: Likely low for members, high for temps (process dictated).
          *   Result: Refusal/Conditional (must fix temp status).
      *   *Case 2 (Software):*
          *   Surplus: Venture Fund has preferred stock + liquidation preference. This is a claim on surplus based on *capital*, not labor. *Verdict:* Structural Exploitation (External).
          *   Alienation: Product is monitoring software. Does this alienate the *developers*? Maybe not directly, but the *social use* is dominating others.
          *   Result: Refusal (Investor structure).
      *   *Case 3 (Cleaning Contract):*
          *   Surplus: Members gain 12% distribution. Where from? Cost savings from external firm. External firm likely extracts surplus from cleaners.
          *   *Marxian Point:* Co-op members are now functioning as collective capitalists regarding the cleaners.
          *   Result: Refusal (External Exploitation). *Matches user expectation.*

  6.  **Addressing the "Free Exchange" & "Consent" Issue:**

      *   Must explicitly state in the protocol: "Do not record worker satisfaction or wage competitiveness as mitigating factors." Exploitation is structural, not subjective.

  7.  **Addressing Limitations & Gaming:**

      *   *Gaming:* Co-ops can reclassify workers as "contractors" (though illegal/risky) or hide supply chain data.
      *   *Missing Inputs:* Actual rate of surplus value (impossible to know), subjective experience of alienation (requires interviews, not files).
      *   *Misfire:* High-skill co-ops might look "less alienated" simply because the work is nicer, masking power dynamics.

  8.  **Review against Constraints:**

      *   *Two axes distinct?* Yes, Track A and Track B.
      *   *Operationalize Alienation?* Yes, via governance proxies, admitting limits.
      *   *Free Exchange/Consent?* Addressed in the "Exclusion Criteria" of the protocol.
      *   *Imports/Drops explicit?* Yes, in the preamble.
      *   *Three cases run?* Yes.
      *   *Limitations section?* Yes.

  9.  **Final Polish:** Tone should be professional, direct, slightly academic but pragmatic (matching the user's voice). Ensure the distinction between "Refusal" (Structural fail) and "Referral" (Values debate) is clear.

      *(Self-Correction during drafting)*: I need to be careful not to make the procedure *too* complex for a 2-hour review. The questions must be binary or document-verifiable where possible. For Alienation, since I can't measure "species-being," I must rely on *governance control over the process*. If workers control the process, alienation is structurally mitigated, even if the work is boring.

      *(Refining the "Cleaning" case)*: The user expects this to fail. Marx would argue the co-op members are appropriating surplus value produced by the cleaning firm's employees (via lower cost of inputs). I need to make sure the protocol catches "cost externalization" as a form of surplus appropriation.

      *(Refining the "Software" case)*: The investor piece is the smoking gun for surplus extraction. The nature of the product (monitoring) touches on alienation *of the users*, but for the *workers*, it's about control. I should focus on the investor claim first.

      *(Refining the "Bakery" case)*: The key is the barrier to entry. If the barrier is reasonable, it's one thing. $5k for a seasonal worker is effectively a exclusionary class barrier. This fits Roemer's definition.

  10. **Final Output Generation** (incorporating all the above thoughts into the structured response).
answer: |-
  Here is a procedural framework designed for your constraints (two hours per file, non-specialist committee, document-based review), followed by the application to your three files and a critique of the method's limits.

  ### Part I: The Protocol (Marxian Standards Review)

  **Preamble: Theoretical Imports and Drops**
  To make Marx operational for a standards committee, I have made the following translations. You must present this to the committee so they understand *why* we are ignoring "fair wages" or "worker satisfaction."

  1.  **Dropped: Labor vs. Labor Power (Quantitative).** Marx's distinction relies on calculating the socially necessary labor time to reproduce the worker versus the value they produce. You cannot see this in a ledger.
      *   *Replacement:* **Claims on Residual.** We look at who claims the *surplus* (profit/distribution) after costs. If the claim rests on asset ownership rather than labor contribution, it is structurally exploitative, regardless of wage level.
  2.  **Dropped: Absolute vs. Relative Surplus Value.** Distinguishing between lengthening the workday and increasing productivity requires time-motion studies.
      *   *Replacement:* **Control over Intensity.** We look at who sets the pace and method of work (Governance Documents).
  3.  **Imported: Roemer's Asset Inequality (Analytic Marxism).** Marx did not write a rule for co-ops. John Roemer defines exploitation as unequal ownership of productive assets leading to unequal distribution of surplus.
      *   *Usage:* This allows us to judge the "seasonal worker" issue. If a worker cannot withdraw with their per-capita share of assets due to a buy-in barrier, they are exploited.
  4.  **Imported: Domination/Arbitrary Will (Neo-Republicanism).** "Species-being" is metaphysical and unobservable in a file.
      *   *Usage:* We proxy this with **Authority Structures**. If a worker is subject to the arbitrary will of another (who can fire or direct without recourse), alienation is present.
  5.  **Exclusion Criterion:** Do **not** record wage levels, worker satisfaction, or "consent" as mitigating factors. Under Marx, exploitation occurs through free exchange. A well-paid, happy worker can still be structurally exploited if they do not own the surplus they produce.

  ---

  #### Track A: Surplus Appropriation (The "Who Claims" Test)
  *Time Allocation: 45 Minutes*
  *Data Sources: Cap Table, Bylaws, Payroll Summary, Distribution Policy.*

  **Step A1: The Residual Claimant Test**
  *Question:* Who receives the net surplus (distributions/dividends) at the end of the fiscal year?
  *   **Pass:** 100% of surplus is distributed to individuals based on *labor* contribution (hours worked or wages paid).
  *   **Fail:** Any portion of surplus is distributed based on *capital* contribution (stock ownership, interest on loans, preferred returns) to individuals who do not labor in the firm.
  *   **Action:** If Fail $\rightarrow$ **Refusal**. (This is a structural extraction of surplus by non-laborers).

  **Step A2: The Class Boundary Test (Roemerian)**
  *Question:* Are there workers who perform labor but are structurally barred from becoming residual claimants (members)?
  *   **Check:** Compare the "Worker" roster to the "Member" roster. Identify non-member workers.
  *   **Question:** Is the barrier to membership (buy-in + tenure) accessible to these non-member workers given their wage and contract length?
  *   **Sufficient Answer:** If the buy-in exceeds 10% of their annual gross wages OR the tenure requirement exceeds their contract length, they are structurally excluded from asset ownership.
  *   **Action:** If Excluded $\rightarrow$ **Refusal**. (They produce surplus they cannot claim due to asset inequality).

  **Step A3: The Supply Chain Transfer Test**
  *Question:* Did the co-op increase member distributions by reducing costs through contracting out labor to non-co-op firms?
  *   **Check:** Compare "Contracted Services" line item year-over-year against Member Distributions.
  *   **Sufficient Answer:** If distributions rose while contracted labor costs rose (or internal labor costs fell via outsourcing), presume surplus is being appropriated from the external firm's workers via market pressure.
  *   **Action:** If Yes $\rightarrow$ **Refusal**. (The co-op is functioning as a collective capitalist toward the supply chain).

  ---

  #### Track B: The Character of Activity (The "Alienation" Test)
  *Time Allocation: 45 Minutes*
  *Data Sources: Job Descriptions, Governance Manual, Meeting Minutes.*

  *Note: This track measures the potential for alienation. It cannot measure the subjective feeling, only the structural conditions.*

  **Step B1: Product Alienation (Control)**
  *Question:* Do the workers determine the price, destination, and use of the product/service?
  *   **Check:** Voting rights on product lines or pricing in Bylaws.
  *   **Pass:** Workers vote on product strategy.
  *   **Fail:** Product strategy is set by external investors or a management layer not subject to recall.
  *   **Status:** **Referral to Committee.** (This is a values judgment: is the product harmful? The file can't prove alienation, only lack of control).

  **Step B2: Process Alienation (Authority)**
  *Question:* Who sets the pace and method of work?
  *   **Check:** Job descriptions and Discipline Policy.
  *   **Pass:** Workers self-schedule or set methods via committee; discipline requires peer review.
  *   **Fail:** Management sets pace/method unilaterally; discipline is top-down (hire/fire power rests with non-peers).
  *   **Status:** **Referral to Committee.** (High alienation risk, but committee must weigh efficiency needs).

  **Step B3: Social Alienation (Competition)**
  *Question:* Is the remuneration structure competitive or cooperative?
  *   **Check:* Pay ratios and bonus structures.
  *   **Pass:** Pay bands are narrow (e.g., < 3:1); bonuses are collective.
  *   **Fail:** Individual commissions or wide pay gaps (> 5:1) that pit members against each other.
  *   **Status:** **Referral to Committee.**

  **Step B4: Species-Being (Skill)**
  *Question:* Does the work utilize human creativity or reduce the worker to a machine appendage?
  *   **Check:** *UNANSWERABLE FROM FILES.*
  *   **Action:** Mark as **Data Gap**. Do not score. Assume neutral unless job description explicitly describes repetitive, monitored tasks (e.g., "click rate monitoring").

  ---

  #### Termination Points

  1.  **Refusal (Automatic):** Failure of Track A (A1, A2, or A3). These are objective structural violations of the surplus-labor link. No committee vote needed; staff recommends rejection.
  2.  **Referral (Committee Vote):** Failure of Track B (B1, B2, B3). These are degrees of alienation. The committee must decide if the deformation of work is acceptable given the co-op's mission.
  3.  **Pass:** Track A Clear, Track B Clear.

  ---

  ### Part II: Application to Files

  #### File 1: The Bakery
  *   **Track A (Surplus):**
      *   A1 (Residual): Pass. Surplus distributed by hours worked.
      *   A2 (Class Boundary): **Fail.** Six seasonal workers are barred from membership. Buy-in ($5,000) is likely >10% of 4 months' wages (even at above-living wage). Tenure requirement exceeds contract length. They produce surplus but are legally barred from claiming it via asset ownership.
      *   A3 (Supply Chain): Pass (No data suggesting outsourcing).
  *   **Track B (Alienation):**
      *   B1/B2: Likely Pass for members, Fail for temps (temps usually dictated to).
      *   B4: Data Gap.
  *   **Verdict:** **Refusal.**
  *   **Reasoning:** Under the Roemerian import, the seasonal workers are an exploited class. They sell labor-power but cannot access the means of production due to the capital barrier. The fact that they are paid well is irrelevant to the structural extraction of their surplus.
  *   **Recommendation:** Require the co-op to either prorate membership eligibility for seasonal staff or eliminate non-member labor.

  #### File 2: The Software Co-op
  *   **Track A (Surplus):**
      *   A1 (Residual): **Fail.** Venture fund holds preferred stock and liquidation preference. This is a claim on surplus based on *capital*, not labor. In a liquidation event, the fund gets paid before workers. This creates a class of owners who do not labor.
      *   A2 (Class Boundary): Pass (All workers are owners).
      *   A3 (Supply Chain): Pass.
  *   **Track B (Alienation):**
      *   B1 (Product): **Referral.** The product is a monitoring platform. While the *developers* may control the code (low process alienation), the *social use* of the product imposes alienation on others (logistics workers). The file cannot resolve if building tools of domination deforms the builder.
      *   B2 (Process): Pass (Fully worker-governed).
  *   **Verdict:** **Refusal.**
  *   **Reasoning:** The preferred stock structure violates A1. It reintroduces interest-bearing capital into the co-op. The investors claim surplus value generated by the workers by virtue of asset ownership, not work. This is the definition of exploitation Marx identifies, regardless of the "mission alignment."
  *   **Recommendation:** Require conversion of preferred stock to member loans or common stock with no liquidation preference.

  #### File 3: The Cleaning Contract
  *   **Track A (Surplus):**
      *   A1 (Residual): Pass (Internally).
      *   A2 (Class Boundary): Pass (Internally).
      *   A3 (Supply Chain Transfer): **Fail.** Member distributions rose 12% specifically after contracting out night-shift cleaning. The savings come from the external firm paying its workers less than the co-op would have (extracting surplus from them). The co-op members are appropriating that surplus via lower input costs.
  *   **Track B (Alienation):**
      *   B1/B2: Pass for members.
  *   **Verdict:** **Refusal.**
  *   **Reasoning:** This is the "Collective Capitalist" problem. By outsourcing to a non-union, non-co-op firm to boost internal distributions, the member-co-op is participating in the extraction of surplus from the cleaning firm's employees. The 12% rise is effectively transferred surplus value.
  *   **Recommendation:** Require the co-op to internalize the labor or contract only with other certified co-ops.

  ---

  ### Part III: Limitations and Critique

  You asked where this procedure will misfire, how it can be gamed, and what it cannot do.

  **1. Where it Classifies Wrongly (False Positives/Negatives)**
  *   **The "Necessary Evil" False Positive:** A co-op may need external investment (File 2) to survive in a capitalist market. The procedure flags this as exploitation (which it is, structurally), but the committee may feel forced to accept it to save jobs. The procedure treats survival as secondary to structure.
  *   **The "High-Skill" False Negative:** A software co-op (File 2) may pass Track B because developers have high autonomy. Marx would argue they are still alienated if the *product* serves capital accumulation, but the file cannot show this. The procedure underestimates alienation in "creative" work that serves exploitative ends.
  *   **The "Supply Chain" Blind Spot:** We only catch outsourcing (File 3). We do not catch the embedded labor in *goods* purchased (e.g., flour bought from a multinational). If the bakery buys cheap flour from a corporation exploiting farmworkers, Track A3 misses it. We can only audit *services*, not *commodities*, within a 2-hour file review.

  **2. Gaming the Procedure**
  *   **Reclassification:** A co-op can classify workers as "independent contractors" to remove them from the payroll roster entirely, bypassing A2. (You would need to cross-reference with tax filings to catch this, which may be outside your 2-hour window).
  *   **Loan Structures:** In File 2, the venture fund could convert "preferred stock" to a "member loan with variable interest." If the interest rate floats with profit, it looks like a distribution. You would need to check if the interest is capped or guaranteed. If guaranteed, it's still capital claiming surplus.
  *   **Subsidiaries:** In File 3, the co-op could spin off the cleaning unit as a separate legal entity owned by the same members. Internally, it looks like a transfer, not a contract. You would need to request consolidated financials to see the labor cost shift.

  **3. Missing Inputs (The "Black Box")**
  *   **Rate of Exploitation:** You cannot know *how much* surplus is being extracted. You know *that* it is being extracted (File 1 & 2), but not the magnitude. A 1% claim by investors is structurally the same as 50%, though morally distinct to the committee.
  *   **Subjective Alienation:** You cannot measure if the work "deforms" the worker (1844 Manuscripts). You can only measure *control*. A worker can have total control over a pointless job and still be alienated from "species-being." The procedure assumes Control = Non-Alienation, which is a bureaucratic simplification.
  *   **The "Free Exchange" Reality:** The procedure correctly ignores consent. However, the committee *will* care about consent. When you recommend Refusal for the Bakery (File 1) because the temps are "exploited" despite being happy and well-paid, the committee will revolt. You will need to explain that you are judging the *property relation*, not the *welfare*.

  **4. What It Cannot Do**
  *   **It cannot distinguish "Good" Capital from "Bad" Capital.** Marx sees capital as a social relation, not a thing. The procedure treats all external claims on surplus as identical. It cannot validate a "mission-aligned" investor (File 2) even if they never exercise their rights. The *existence* of the right is the violation.
  *   **It cannot solve the "Socialist Calculation" problem.** If the co-op must exploit outsiders to survive (File 3), the procedure says "Refusal." This may mean the co-op goes bankrupt. The procedure is a purity test, not a viability test. It protects the Federation's standards, not the member's solvency.

  **Summary of Imports/Drops for the Committee:**
  Tell the committee: *"We are dropping the question of whether workers are happy or paid well. We are importing a rule that says if you don't own the assets, you shouldn't generate the profit. We are treating the co-op not as a business, but as a property relation."*

  If the procedure gives a clean pass to File 3 (the cleaning contract), it is indeed tracking the wrong thing. The protocol above ensures it fails, aligning with your expectation that benefiting from external exploitation violates the federation's core logic.
