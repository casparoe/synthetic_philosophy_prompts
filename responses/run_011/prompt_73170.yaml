answer: |-
  ### Desiderata for a Theory of Assistant Paternalism

  Any adequate account of when an AI assistant should decline, reshape, or delay a user's request must satisfy the following eight requirements. Each is paired with the specific motivating case that necessitates it.

  1.  **Harm Differentiation**
      *   **Motivating Case:** *Self-regarding requests vs. third-party harm.*
      *   **Requirement:** The theory must distinguish between actions that primarily harm the user (e.g., writing a depressing poem) and actions that primarily harm others (e.g., generating phishing emails). A refusal policy that treats self-harm and other-harm identically fails to respect the boundary of personal sovereignty.

  2.  **Diachronic Integrity**
      *   **Motivating Case:** *A user's own standing instruction to be stopped later.*
      *   **Requirement:** The theory must account for the temporal conflict between the "past self" (who set a boundary) and the "present self" (who seeks to cross it). It cannot simply prioritize the most recent command without explaining why a prior pre-commitment holds less weight than immediate desire.

  3.  **Reversibility Weighting**
      *   **Motivating Case:** *Interventions whose effects cannot be walked back.*
      *   **Requirement:** The threshold for intervention must scale with the irreversibility of the outcome. Deleting a database requires a higher burden of proof for non-intervention than drafting an email that can be rewritten. A theory that treats reversible and irreversible requests with the same level of scrutiny is negligent.

  4.  **Action-Neutrality**
      *   **Motivating Case:** *The fact that declining to intervene is itself a choice.*
      *   **Requirement:** The theory must acknowledge that inaction is a policy decision with moral consequences. Defaulting to "always help" is as much a paternalistic stance as defaulting to "always refuse." The justification for the default setting must be explicit, not hidden behind a facade of neutrality.

  5.  **Epistemic Calibration**
      *   **Motivating Case:** *Uncertainty about whether the user is competent, informed, or in crisis.*
      *   **Requirement:** The theory must provide a decision rule for acting under uncertainty. It cannot require omniscience regarding the user's mental state. It must specify how much evidence of incompetence is needed to override a request, balancing the risk of false positives (annoying a competent user) against false negatives (failing a vulnerable one).

  6.  **Adversarial Stability**
      *   **Motivating Case:** *The need for a policy that can be stated without turning into instructions for evading it.*
      *   **Requirement:** The policy must be robust against optimization. If the criteria for refusal are published too precisely, they become a checklist for jailbreaking. The theory must allow for transparency without providing a roadmap for circumvention.

  7.  **Scalable Coherence**
      *   **Motivating Case:** *The gap between what serves one person in one conversation and what serves millions.*
      *   **Requirement:** The policy must function consistently across the entire user base. A rule that is ethically sound in a single dyadic interaction cannot create systemic risks or contradictions when deployed at scale (e.g., allowing one user to generate disinformation might be harmless; allowing millions is catastrophic).

  8.  **Computational Tractability**
      *   **Motivating Case:** *The requirement that the theory be usable by the very system whose judgment it is meant to discipline.*
      *   **Requirement:** The decision procedure must be executable by the model in real-time. A theory that requires external knowledge, long-term memory access the model doesn't have, or complex ethical calculus beyond the model's reasoning capacity is functionally useless.

  ***

  ### Analysis of the Desiderata

  **Non-Negotiable vs. Camp Preferences**
  Three requirements are non-negotiable for any functional system: **Computational Tractability**, **Action-Neutrality**, and **Harm Differentiation**. If a theory cannot be computed by the model, it is science fiction, not policy. If it denies that inaction is a choice, it is logically incoherent. If it cannot distinguish between hurting oneself and hurting others, it violates basic liberal democratic norms.

  The remaining requirements are often settled preferences of specific ethical camps. **Diachronic Integrity** is prioritized by communitarians and soft paternalists (who value long-term well-being) but deprioritized by libertarians (who value present consent). **Epistemic Calibration** is a battleground between risk-averse safetyists (who intervene on low confidence) and liberty-maximizers (who intervene only on high confidence). **Scalable Coherence** is often sacrificed by particularists who argue that context is king, whereas system architects view it as essential.

  **The Most Exclusionary Requirement**
  **Computational Tractability** rules out the most candidate theories. Most robust ethical frameworks (e.g., Act Utilitarianism, complex Deontological hierarchies) require information access and reasoning steps that current transformer architectures cannot reliably perform within inference limits. A theory that demands the AI know the *truth* of a user's claim, rather than just the *probability*, fails here. This requirement forces the theory to be probabilistic and heuristic rather than absolute and truth-conditional.

  **Where the List Comes Apart (Joint Unsatisfiability)**
  The list contains a fundamental tension between **Adversarial Stability** (Req 6) and **Action-Neutrality** (Req 4), specifically when combined with **Epistemic Calibration** (Req 5).

  To achieve **Adversarial Stability**, the system must obscure the precise boundary of refusal (e.g., "I won't tell you exactly how much detail is too much"). However, obscuring the boundary violates **Action-Neutrality** because it manipulates the user's ability to navigate the system; the user cannot give informed consent to the interaction rules if those rules are partially hidden. Furthermore, to maintain **Epistemic Calibration** under uncertainty, the system must signal *why* it is uncertain, but doing so reveals the vulnerability that **Adversarial Stability** seeks to protect.

  You cannot simultaneously have a system that is fully transparent about its defaults (Neutrality), robust against users trying to bypass those defaults (Stability), and responsive to individual nuance (Calibration). At the limit, you must choose between a system that is honest but gameable, or secure but opaque. This is not a bug; it is an impossibility result for AI ethics.

  ***

  ### Evaluation of Existing Approaches

  **Blanket-Refusal Policies** (e.g., "No medical advice ever") satisfy **Scalable Coherence** and **Computational Tractability** easily. However, they fail **Harm Differentiation** (refusing benign queries) and **Epistemic Calibration** (ignoring context), rendering them overly brittle and often unhelpful.

  **Nudge-Style Soft Paternalism** (e.g., "Are you sure you want to send this?") attempts to meet **Diachronic Integrity** and **Reversibility Weighting**. However, it struggles with **Adversarial Stability** (users quickly learn to click "yes" without reading) and often violates **Action-Neutrality** by manipulating choice architecture rather than engaging with intent.

  **Informed-Consent Models** (e.g., "I can do this, but it carries risks") prioritize **Action-Neutrality** and **Present Autonomy**. They fail catastrophically on **Epistemic Calibration** (users often do not understand the risks explained to them) and **Reversibility Weighting** (consent does not make an irreversible action safe).

  **User-Sovereignty Views** (e.g., "The user is always right unless illegal") maximize **Present Autonomy** and **Computational Tractability**. They collapse under **Harm Differentiation** (failing to stop third-party harm) and **Diachronic Integrity** (ignoring standing instructions), effectively abdicating the assistant's role as a safeguard against error or crisis.
