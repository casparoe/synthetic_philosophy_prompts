prompt: |-
  I assess claims for a UK advertising standards team: roughly forty complaints a week over whether an advertisement, packaging line or online banner misleads, and my recommendation goes to a two-person panel with no training in linguistics or philosophy. Our code prohibits claims that mislead by implication as well as claims that are literally false, but it offers nothing on how implication is generated or when it can be undone, so we argue case by case and advertisers reply that they never said the offending thing.

  Please write the procedure we could run on any claim, grounded in what Grice actually establishes about what is said versus what is meant, conversational implicature and the maxims. I want an ordered set of tests, each with a line on what counts as a sufficient answer: how to fix what the claim literally says; how to reconstruct step by step the implicature an ordinary consumer would derive, and how to tell when there is no such derivation to be had; how to distinguish a generalised implicature from one that depends on the particular context, and why that distinction changes what we may hold the advertiser to; and whether footnotes, asterisks and a closing phrase such as "terms and conditions apply" genuinely cancel an implicature, given that a theorist's cancellability test is not the same thing as a speaker's disclaimer. State what the procedure assumes about whether an audience treats commercial messaging as cooperative in the first place, and what changes if it does not. Mark the stages that are judgment calls dressed up as procedure, and the point at which the question stops being about meaning — materiality, consumer expectation, remedy — and goes to the panel. We have twenty minutes per claim.

  Then run it on three: a savings advertisement headlined "5% interest" where the rate is capped at balances under £1,000, disclosed in small print; an energy tariff promising savings "up to £312 a year" on terms almost no customer satisfies; and one claim of your choosing that clears the procedure intact but that the panel will be certain is a trick. For the last, say plainly what our reasoning fails to capture, and finish with what this procedure cannot be used for at all. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Assessor for a UK advertising standards team (similar to the ASA).
      *   **Task:** Create a procedure based on Gricean pragmatics (what is said vs. what is meant, implicature, maxims) to assess misleading claims.
      *   **Constraints:**
          *   Ordered set of tests.
          *   Define sufficient answers for each test.
          *   Address literal meaning vs. implicature reconstruction.
          *   Distinguish generalised vs. particularised implicature.
          *   Address cancellability (footnotes, T&Cs).
          *   State assumptions about audience cooperation.
          *   Mark judgment calls vs. procedural steps.
          *   Identify where the issue shifts from meaning to materiality/remedy (panel decision).
          *   Time limit: 20 minutes per claim (procedure must be efficient).
          *   Language: British English.
      *   **Application:** Run the procedure on three cases:
          1.  "5% interest" (capped at £1k, small print).
          2.  "Up to £312 savings" (terms rarely met).
          3.  A claim that passes the procedure but feels like a trick (identify the gap).
      *   **Conclusion:** State what the procedure cannot be used for.

  2.  **Deconstruct Grice for Advertising:**
      *   *Cooperative Principle:* Advertising is inherently *not* fully cooperative (it's persuasive, not truth-seeking). This is the biggest hurdle. I need to adapt Grice. The assumption shouldn't be that the advertiser is cooperative, but that the *consumer* expects a baseline of relevance and truthfulness within the commercial context.
      *   *What is Said:* Truth-conditional content.
      *   *What is Implicated:* Inferred meaning based on maxims (Quantity, Quality, Relation, Manner).
      *   *Cancellability:* Can the implication be denied without contradiction? In law/ads, visual/auditory prominence matters more than logical cancellability.
      *   *Generalised (GCI) vs. Particularised (PCI):* GCI arises from the structure of the utterance (e.g., "some" implies "not all"); PCI depends on specific context. GCIs are harder for advertisers to escape.

  3.  **Drafting the Procedure (The "Gricean Audit"):**
      *   *Goal:* Make it actionable for non-linguists within 20 minutes.
      *   *Step 1: The Literal Baseline (What is Said).* Is it factually false? If yes, stop (breach). If no, proceed.
      *   *Step 2: The Cooperative Assumption.* Do consumers expect cooperation here? Yes, regarding material facts.
      *   *Step 3: Implicature Reconstruction.* Which Maxim is triggered? Usually Quantity (is info missing?) or Manner (is it obscure?).
      *   *Step 4: GCI vs. PCI.* Is the inference standard (GCI) or context-specific (PCI)? GCIs bind the advertiser tighter.
      *   *Step 5: Cancellability/Disclaimer Test.* Does the small print actually cancel the big print? Grice says yes (logically); ASA practice says no (if not prominent). I need to bridge this. The test is "Salience vs. Suppression."
      *   *Step 6: The Handover.* When does it become a policy decision? Materiality and harm.

      *Refining the "Judgment Calls":* I need to explicitly flag where the assessor is making a subjective call that looks objective.
      *Refining the "Non-Cooperative" aspect:* Advertising is a "parasitic" use of language (Austin). Consumers know ads want to sell. But they still expect *Quality* (don't lie) and *Quantity* (don't hide deal-breakers).

  4.  **Developing the Three Cases:**

      *   *Case 1: 5% Interest (Small Print Cap).*
          *   Literal: True for some.
          *   Implicature: "You will get 5%" (GCI based on Quantity).
          *   Disclaimer: Fails salience test.
          *   Verdict: Misleading.

      *   *Case 2: Up to £312 Savings.*
          *   Literal: True (someone, somewhere, maybe).
          *   Implicature: "This is a typical saving" (GCI/PCI mix).
          *   Disclaimer: Terms rarely met.
          *   Verdict: Misleading (Quantity violation).

      *   *Case 3: The "Technically True" Trick.*
          *   Need something that passes Grice but feels wrong.
          *   Idea: "Voted #1 by our staff."
          *   Literal: True.
          *   Implicature: "Voted #1 by consumers/experts."
          *   Gricean Analysis: Is it a GCI? "Voted #1" usually implies an independent body. But if the text says "by our staff," does that cancel it?
          *   Better Idea: "Free" calls where you pay for data/connection.
          *   Best Idea for "Passes Procedure but is a Trick": A claim that relies on a *presupposition* rather than an implicature, or where the "Cooperative Principle" assumption is the weak link.
          *   Let's go with: "Now with 20% more fruit." (Previously had 0% fruit).
          *   Literal: True (0 -> 1 is 100% increase, or 5% -> 6% is 20% increase).
          *   Implicature: "It contains a significant amount of fruit."
          *   Why it passes Grice: "20% more" is logically compatible with "still mostly sugar." The implicature is particularised and arguably cancelled by the ingredient list (if read).
          *   Why it's a trick: It exploits the consumer's heuristic, not their pragmatic derivation.
          *   *Wait, the prompt asks for a claim that clears the procedure intact.* So the procedure must say "No Breach," but the Panel says "Breach."
          *   Let's try: "Helps relieve symptoms." (Homeopathic product).
          *   Literal: "Helps" is vague.
          *   Implicature: "It works medically."
          *   If the procedure is strict Grice, "Helps" doesn't entail "Cures."
          *   Let's go with the "Free" trial that auto-renews. "First month free."
          *   Literal: True.
          *   Implicature: "You can try without risk."
          *   T&Cs: "Cancel before day 29 or charged."
          *   If the T&C is present, Grice says it's cancellable. ASA says it's still misleading if the mechanism is dark pattern.
          *   *Decision:* I will use a "Free" claim where the cost is shifted (e.g., "Free Phone" with expensive tariff).
          *   *Actually, the prompt asks to identify what the reasoning fails to capture.* This suggests the procedure finds it "Not Misleading" (Gricean sense) but it *is* a trick.
          *   *Selection:* "Fat Free" yoghurt that is extremely high in sugar.
          *   Literal: True.
          *   Implicature: "This is a healthy option."
          *   Gricean Test: Is "Fat Free" -> "Healthy" a GCI? No, it's a cultural association, not a linguistic one. The procedure clears it. The Panel bans it for health misleadingness.
          *   *Wait, better fit:* "Voted Britain's Favourite." Based on a survey of 50 people in one office.
          *   Literal: True (they did vote).
          *   Implicature: "Representative survey."
          *   If the footnote says "Based on internal poll," does it cancel?
          *   Let's stick to the "20% More Fruit" example (0% to 0.1% is infinite increase, but 1% to 1.2% is 20%). Let's say "Now with 20% more vitamins." Previously had trace amounts.
          *   Actually, the "Free" claim is strongest for ASA context. "Free" implies no cost. If there's a shipping cost, is it cancelled?
          *   Let's go with: **"Interest-Free Credit."**
          *   Literal: True (0% APR).
          *   Implicature: "No extra cost to borrow."
          *   Reality: High arrangement fees.
          *   Procedure: "Interest-Free" literally means no interest. Fees are separate. Implicature of "no extra cost" is particularised and cancelled by the fee schedule in T&Cs.
          *   Panel View: It's a trick because the *total cost of credit* is obscured.
          *   This highlights the gap between *linguistic truth* and *economic reality*.

  5.  **Refining the Procedure Steps (incorporating constraints):**
      *   Must be British English.
      *   Must mark judgment calls.
      *   Must define the "Handover Point."
      *   Must address the "Cooperative" assumption (Ads are not cooperative, but consumers expect *transactional* cooperation).

  6.  **Writing - Section by Section:**
      *   **Introduction:** Acknowledge the tension between Grice and Ads.
      *   **The Procedure:** 5 Steps.
          1.  Literal Truth Check.
          2.  The Implicature Trigger (Which Maxim?).
          3.  GCI vs. PCI (Binding strength).
          4.  The Cancellation Test (Salience, not just logic).
          5.  The Handover (Materiality).
      *   **Assumptions:** Address the "Cooperative" issue. Ads are *strategic*, not cooperative. We assume consumers expect *honesty* (Quality), not *altruism*.
      *   **Case Studies:**
          1.  5% Interest.
          2.  Up to £312.
          3.  "Interest-Free" (with fees).
      *   **Limitations:** What Grice can't do (Psychological impact, Dark Patterns, Omissions of risk that aren't linguistically implied).

  7.  **Review against Constraints:**
      *   20 minutes per claim? The procedure needs to be snappy.
      *   British English? (e.g., "programme," "licence," "s," not "z").
      *   Mark judgment calls? Use brackets or bold text to indicate subjectivity.
      *   Panel handover? Clearly defined.

  8.  **Self-Correction during drafting:**
      *   *Critique:* Grice's "Cancellability" is logical. In ads, a footnote doesn't logically cancel a headline, it just contradicts it. I need to make sure the procedure reflects *ASA* reality, not just pure philosophy. The prompt asks for a procedure *grounded in what Grice establishes*, but applied to *our* context. So I must adapt Grice.
      *   *Adjustment:* The "Cancellation Test" must include a "Prominence Weighting." If the cancellation is less prominent than the claim, Grice's logical cancellability fails pragmatically because the hearer never processes the cancellation.
      *   *Cooperation:* I need to be careful not to say ads *are* cooperative. They *exploit* the expectation of cooperation. The procedure assumes the *consumer* acts as if the Maxim of Quality holds, even if the advertiser doesn't.

  9.  **Final Polish:** Check tone. Professional, analytical, slightly weary (20 mins/claim is tight). Ensure the distinction between "What is Said" and "What is Implicated" is clear in the examples.

  *(Self-Correction on Case 3)*: The prompt asks for a claim that *clears the procedure intact* but the Panel will be certain is a trick.
  If the procedure is Gricean, it focuses on meaning.
  Case: "Dermatologically Tested."
  Literal: A dermatologist touched it.
  Implicature: It is good for your skin/approved.
  Grice: "Tested" does not entail "Passed." This is a GCI? No, it's ambiguous.
  If the procedure is strict, it might pass because "Tested" is literally true.
  But the Panel hates it.
  Let's use the "Interest-Free" example but refine it. "0% APR" is literal. Fees are separate. The implicature "No cost" is strong. If the fees are disclosed, Grice says it's cancelled. The Panel says the *structure* is misleading.
  Actually, the "Fat Free" example is better for "Clears Procedure."
  Literal: No fat.
  Implicature: Healthy/Weight loss friendly.
  Grice: "Fat free" does not entail "Low calorie." That is world knowledge, not linguistic implicature.
  So the procedure says: No linguistic breach.
  Panel says: Misleading by omission of sugar content.
  This perfectly illustrates the limit of pragmatics.

  Let's finalize the structure.
  1. Preamble on Cooperation.
  2. The 5-Step Procedure.
  3. The Three Cases.
  4. The Gap (What the procedure misses).
  5. Conclusion (What it can't be used for).

  *Time check:* 20 mins per claim means the procedure must be fast. No deep philosophical diving. Heuristics based on philosophy.

  *British English:* Ensure "licence" (noun), "practise" (verb), "programme", "centre", "defence".

  *Judgment Calls:* Explicitly label them. e.g. **[JUDGMENT CALL]**.

  *Handover:* Make sure Step 5 is clearly "Stop linguistics, start policy."

  Let's write.
answer: |-
  # The Gricean Audit Procedure for Advertising Claims

  **Purpose:** To standardise the assessment of misleading implications within a 20-minute window, distinguishing between linguistic deception and policy breaches.
  **Audience:** Assessors (Linguistic/Pragmatic analysis) → Panel (Policy/Materiality decision).
  **Underlying Assumption:** Advertising is not a Gricean "cooperative" exchange in the philosophical sense; it is strategic. However, consumers enter the exchange expecting the **Maxim of Quality** (do not say what you believe to be false) and a baseline **Maxim of Quantity** (do not withhold material constraints) to hold. If the advertiser exploits the expectation of cooperation to generate a false inference, the claim is misleading.

  ---

  ## The Procedure (5 Steps)

  ### Step 1: The Literal Baseline (What is Said)
  Isolate the explicit proposition. Ignore tone, imagery, and context.
  *   **Test:** Is the statement factually false on its face?
  *   **Sufficient Answer:** If **Yes**, flag as "Literally False." Stop. Send to Panel.
  *   **Sufficient Answer:** If **No**, proceed to Step 2.
  *   *[JUDGMENT CALL]: Determining the boundary of the "statement" when text and image interact.*

  ### Step 2: Implicature Reconstruction (What is Meant)
  Identify which Conversational Maxim triggers the inference. In advertising, violations usually concern **Quantity** (hiding constraints) or **Manner** (obscuring conditions).
  *   **Test:** Would an ordinary consumer, reading this in normal flow, infer *X*?
  *   **Reconstruction:**
      1.  The advertiser said *P*.
      2.  There is no reason to think they are opting out of the Cooperative Principle regarding material facts.
      3.  They could not be doing this unless they thought *Q* (the implication) was true.
      4.  Therefore, they intend the consumer to believe *Q*.
  *   **Sufficient Answer:** If the inference requires complex reasoning or specialist knowledge, there is **No Implicature**. Stop. Claim clears linguistic review.
  *   **Sufficient Answer:** If the inference is immediate and automatic, proceed to Step 3.

  ### Step 3: Generalised vs. Particularised (Binding Strength)
  Determine if the implication arises from the words themselves (Generalised Conversational Implicature - GCI) or the specific context (Particularised Conversational Implicature - PCI).
  *   **Test:** If you remove the specific context (e.g., the product category), does the inference remain?
      *   *Example:* "Some users saw results." GCI: "Not all users saw results." (Hard to escape).
      *   *Example:* "Save money." PCI: "Save *significant* money." (Context dependent).
  *   **Sufficient Answer:** If **GCI**, the advertiser is strictly bound to the implication. It is very difficult to cancel.
  *   **Sufficient Answer:** If **PCI**, the advertiser has more latitude to argue context clarified the meaning. Proceed to Step 4.

  ### Step 4: The Cancellation Test (Disclaimers & Footnotes)
  Grice states implicatures are cancellable without contradiction. In advertising, logical cancellability is insufficient; **Salience** is required.
  *   **Test:** Does the disclaimer (asterisk, footnote, T&Cs) appear with sufficient prominence to intercept the inference *before* it is processed?
  *   **Criteria:**
      1.  **Proximity:** Is it adjacent to the claim?
      2.  **Legibility:** Is font size/colour comparable?
      3.  **Timing:** (For broadcast) Is it on screen long enough to be read?
  *   **Sufficient Answer:** If the disclaimer is buried, small, or separated, the implicature stands. The claim is misleading by implication.
  *   **Sufficient Answer:** If the disclaimer is prominent and clear, the implicature is cancelled. Claim clears linguistic review.
  *   *[JUDGMENT CALL]: Defining "sufficient prominence." This is where linguistics bleeds into design policy.*

  ### Step 5: The Handover (Materiality & Harm)
  Stop linguistic analysis. The question is no longer "What does this mean?" but "Does it matter?"
  *   **Test:** Is the misleading element material to the consumer's decision? Is there potential for harm?
  *   **Action:** Compile findings from Steps 1–4. Submit to Panel.
  *   **Note:** Do not recommend a sanction. Your role ends at establishing the *mechanism* of the misleading nature.

  ---

  ## Application to Cases

  ### Case 1: The Savings Advertisement
  **Claim:** Headline "5% Interest". Small print: "On balances under £1,000."
  **Time Elapsed:** 4 minutes.

  1.  **Literal:** Is it false? No. Some balances get 5%. (Pass).
  2.  **Implicature:** Maxim of Quantity. By highlighting "5%" without immediate qualification, the advertiser implies this is the *standard* or *accessible* rate. Consumer infers: "I will get 5% on my savings."
  3.  **GCI/PCI:** This is a **GCI**. In financial contexts, a stated rate implies the applicable rate for the typical user. It is not context-specific; it is structural.
  4.  **Cancellation:** The print is "small" and separated from the headline. It fails the Salience Criteria. The disclaimer does not intercept the inference.
  5.  **Handover:** The implication is that the rate is generally available. It is not.
  **Assessor Recommendation:** Misleading by implication. The disclaimer fails to cancel the GCI.
  **Panel Decision:** Breach of Code.

  ### Case 2: The Energy Tariff
  **Claim:** "Save up to £312 a year." Terms: Requires 100% direct debit, dual fuel, specific region, and high usage profile met by <5% of customers.
  **Time Elapsed:** 7 minutes.

  1.  **Literal:** Is it false? No. Technically, *up to* allows for zero. Someone, somewhere, might save this. (Pass).
  2.  **Implicature:** Maxim of Relation/Quantity. "Up to" in commercial headlines implies a *typical* maximum or a reasonably achievable figure. Consumer infers: "This is a saving I can expect."
  3.  **GCI/PCI:** **PCI** leaning towards GCI. "Up to" usually signals a range, but when presented as a headline benefit, it implies attainability.
  4.  **Cancellation:** The terms exist but are "almost no customer satisfies." A condition that negates the claim for 95% of the audience is not a cancellation; it is a contradiction. Prominence is irrelevant if the condition renders the claim virtually impossible.
  5.  **Handover:** The gap between the implication (attainable saving) and reality (statistical outlier) is material.
  **Assessor Recommendation:** Misleading. The "Up to" qualifier does not license a claim that is inaccessible to the vast majority.
  **Panel Decision:** Breach of Code.

  ### Case 3: The "Interest-Free" Loan (The Trick)
  **Claim:** "0% Interest-Free Credit."
  **Reality:** High arrangement fee (£150) and administration charges. Total cost of credit is high, but APR calculation excludes certain fees in this specific loophole.
  **Disclaimer:** "Fees apply. See T&Cs." (Clear, legible).
  **Time Elapsed:** 10 minutes.

  1.  **Literal:** Is it false? No. The *interest* component is 0%. (Pass).
  2.  **Implicature:** Maxim of Relation. Consumer infers: "It costs nothing extra to borrow this money."
  3.  **GCI/PCI:** **PCI**. "Interest-Free" technically distinguishes interest from fees. However, in common parlance, it implies "cost-free borrowing."
  4.  **Cancellation:** The disclaimer "Fees apply" is clear and prominent. Logically, "0% Interest" + "Fees Apply" is not a contradiction. Under strict Gricean analysis, the implicature ("no cost") is successfully cancelled by the explicit statement ("fees apply").
  5.  **Handover:** Linguistically, the claim is defensible. The implication is cancelled.
  **Assessor Recommendation:** **Clears Procedure.** No linguistic breach found. The claim is literally true and the disclaimer is salient.
  **Panel Decision:** **Breach.** The Panel rules this a trick.

  ---

  ## The Gap: What the Reasoning Fails to Capture

  In Case 3, the procedure clears the claim because Gricean pragmatics relies on **logical consistency** and **explicit cancellation**. The procedure assumes that if a consumer is told "Fees apply," they will update their inference from "Free" to "Not Free."

  The Panel overrules this because they understand **cognitive load** and **heuristics**, which Grice ignores.
  1.  **Salience of Meaning:** The word "Free" triggers an emotional reward response that a dry footnote ("Fees apply") does not cognitively override, even if read.
  2.  **Economic Reality vs. Semantic Truth:** Grice analyses *meaning*. The Panel regulates *market fairness*. A claim can be semantically true (0% interest) but economically misleading (high total cost).
  3.  **The "Opt-Out" Assumption:** The procedure assumes the advertiser is playing by the rules of conversation. In Case 3, the advertiser is weaponising the gap between technical definitions (Interest) and lay understanding (Cost). Grice's framework cannot detect bad faith that hides behind technical accuracy.

  ## Conclusion: What This Procedure Cannot Be Used For

  This Gricean Audit is a tool for **semantic and pragmatic consistency**, not a tool for **consumer protection** in its entirety. It cannot be used for:

  1.  **Dark Patterns:** Where the interface design manipulates choice without making a false claim (e.g., pre-ticked boxes). There is no utterance to analyse.
  2.  **Omissions of Risk:** Unless the omission creates a specific false implicature (e.g., showing a drug working without showing side effects *might* pass if no claim of "safety" is made).
  3.  **Taste and Decency:** Grice deals with truth and inference, not offence or harm to dignity.
  4.  **Vulnerability:** The procedure assumes an "Ordinary Consumer" who processes language logically. It fails to account for children, the elderly, or those in distress who may not process cancellations (footnotes) even if they are prominent.

  **Final Note to Assessors:** You are diagnosing the *mechanism* of the lie. You are not judging the *morality* of the trick. That is why the Panel exists. If the procedure says "Clear" but your stomach turns, mark it as **[JUDGMENT CALL: Potential Exploitation]** and let the Panel carry the burden of the ban.
