  *(Self-Correction on S1)*: "the idea that people only ever pursue pleasure, and that pleasure is the only thing that makes a life go well." This explicitly states both Psychological and Ethical hedonism. Nozick's machine primarily targets Ethical Hedonism (what has value), though it uses Psychological intuitions (what we would choose). I will mark the definition as a "Fair Simplification" that borders on "Misleading" because conflation causes confusion later.

