      *   The real tie-breaker is **The specific mechanism of "Closing the File."** Dean fears the apology kills the claim. Ruth fears the lack of apology kills the claim.
      *   *Better Unnamed Thing:* **The nature of the "We".** Dean treats the City as a *Fiduciary* (protecting assets/taxpayers). Ruth treats the City as a *Moral Agent* (capable of sin and repentance). They are speaking different ontologies.
