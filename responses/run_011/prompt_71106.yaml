prompt: |-
  ok so I just got off a nearly three hour argument with my friend Nia (med student, does research in an IVF lab, took one philosophy class in college and has never let anyone forget it) and my head is genuinely spinning. You're a metaphysician — someone who actually works on essentialism and trans-world identity — so please think carefully and treat this as a real problem rather than a homework answer. Maybe start by brainstorming two or three possible diagnoses before you commit to one, because I suspect the obvious one isn't right.

  Setup: I'm sympathetic to origin essentialism about people, the Kripke-ish line that you couldnt have come from a different sperm and a different egg than the ones you actually came from. I like it precisely because it seems modest — a small, almost common-sense claim about identity, not a theory of everything. Nia says it isn't modest at all, that it snowballs, and she wrote the snowball out on my whiteboard like this:

  1. Necessarily, for any person x, x originates from the very pair of gametes x in fact originates from. Different sperm or different egg, different person (or no person at all).
  2. A gamete is the very gamete it is only if it's produced by the very meiotic event that actually produced it. There's no such thing as "the same sperm, made by a different cell division" — that's just a description of a different sperm.
  3. An event is the event it is only if it has the causes it actually has. Otherwise events are just undifferentiated blobs and we can't tell one cell division from another.
  4. Therefore, necessarily, a gamete exists only if its entire actual causal ancestry obtains. Nia's name for this principle is **ancestral closure**: whatever is essential to something that's essential to you is essential to you, all the way back.
  5. Therefore, necessarily, a person exists only if the entire actual history of the world up to their conception obtains, in every detail.
  6. Therefore no world that differs from actuality at a time t contains any actual person conceived after t. Since nearly everyone alive was conceived after any remote change you care to name, most counterfactual histories are simply empty of us.
  7. So it is never true that if my grandmother hadn't missed that train in 1946 I'd have been born in Warsaw. That sentence describes a world with no me in it, and no sister, and no parents. Nia calls this the **Conception Wall**: divergence can only ever occur after the last of us is conceived, so the "could" in "things could have gone differently with all of us still here" is empty.
  8. Now either (a) that's just necessitarianism in a lab coat — you've made the whole actual past necessary while claiming to be talking about sperm — or (b) if you insist the past is genuinely contingent and that some world with a different past does contain people, then step 1 fails in that world for those people.
  9. So origin essentialism is either a disguised thesis about the necessity of the past, or it's false.

  Nia isn't a fatalist herself, she just wants me to concede that (1) costs way more than I advertised.

  Where does this go wrong? I want you to actually name the step, not wave at "it's subtle." Specifically: is the chain valid with one false premise, or is there a hidden equivocation or scope slide between two of the steps — and if it's the latter, spell out both readings explicitly and show me which premise comes out true on one reading while the *next* step needs the other one. Then: why did each step you *don't* reject look fine at the time? And what do I concretely pay if I dump (2) or (3) instead of (1) — does rejecting (2) leave me unable to say what makes a gamete the gamete it is, or open the door to "anything could have come from anything"? Does rejecting (3) commit me to some particular account of events? I dimly remember there's a fight between people who think events are individuated by their causes and people who think an event is just an object having a property at a time, and I dont know whether that's relevant here or whether I'm misremembering it.

  Last thing, which I couldnt answer at the time: she said mitochondrial-replacement and cytoplasmic-transfer cases are an *independent* problem for (1). In those cases the egg a child develops from has its nucleus from one woman and its cytoplasm and mitochondria from another, so which egg is the origin? And if you answer "the enucleated donor egg," then the very same child could have come from a different egg's nucleus, which is exactly what (1) forbids. Is that a genuinely second argument, or the same one wearing different shoes?

  And if you think there IS a repaired version — valid, with premises that are all honestly plausible — write it out for me and tell me what its conclusion really costs, because I'd rather know the worst case than be reassured. For what it's worth I'd really like to keep (1); it feels like the step doing the least harm. Tell me if that's just sentiment.
