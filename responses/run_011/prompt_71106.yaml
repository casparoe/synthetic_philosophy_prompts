answer: |-
  This is a classic metaphysical standoff, and Nia has constructed a very clean version of what we call the **Necessity of the Past** argument (sometimes associated with the "Principle of Sufficient Reason" pushed into modal logic). She is right that if your premises hold strictly, the conclusion follows. But she is wrong that the premises *do* hold strictly.

  You asked me to treat this as a real problem, so I will not offer you a "common sense" dismissal. I will offer you a metaphysical diagnosis.

  ### The Diagnosis: Equivocation in Step 3 (Event Individuation)

  After running through the chain, I believe the error is a **scope slide/equivocation in Step 3**, which then corrupts Step 4.

  **Step 3:** *An event is the event it is only if it has the causes it actually has.*

  This premise looks plausible because it exploits an ambiguity in how we individuate events. There are two competing theories of event identity lurking here:

  1.  **Fine-Grained (Davidsonian) Individuation:** Events are individuated by their causal roles. On this view, "The cause of $E$" is part of the identity of $E$. If the cause changes, it's a different event.
  2.  **Coarse-Grained (Kimian) Individuation:** Events are constituted by an object (or objects) having a property at a time. On this view, the meiotic event is just *Cell C dividing at time t*.

  **The Equivocation:**
  *   **Reading A (Plausible):** For the meiotic event to be *this* event, it must have *some* sufficient biological cause (Reading 2). This makes Step 3 true in a local sense.
  *   **Reading B (Required for Snowball):** For the meiotic event to be *this* event, it must have *this specific total causal ancestry* stretching back indefinitely (Reading 1). This makes Step 3 strong enough to generate Step 5.

  Nia needs **Reading B** to get the "Conception Wall." But **Reading B** is metaphysically extravagant and generally rejected by non-necessitarians. If you accept Reading B, you aren't just an origin essentialist; you are a causal determinist about event identity.

  **Why Step 3 looked true at the time:**
  In ordinary language, we identify events by their causes ("The assassination," "The Big Bang"). It feels intuitive that if the cause changes, the event changes. But in metaphysics, this conflates the *identity* of the event with the *explanation* of the event. A meiotic division is a physical process occurring in a cell. If that cell divides at $t$, it is *that* division, even if the hormonal trigger that initiated the division was slightly different (provided the cell and time are the same).

  **Why Step 4 (Ancestral Closure) fails:**
  Because Step 3 is false on the strong reading, Step 4 fails. Transitivity of essentiality holds for *immediate* origins (Person $\to$ Gametes $\to$ Parents), but it breaks when you try to transit through *events* individuated by their total history. You cannot chain essentiality through links that are themselves contingent.

  ### The Cost of Rejecting Alternatives

  You asked what you pay if you dump (2) or (3) instead of (1).

  **If you reject (2) (Gamete Essentialism):**
  *   *The Claim:* A sperm is the sperm it is even if produced by a different meiotic event.
  *   *The Cost:* You lose the ability to distinguish between *numerical identity* and *qualitative identity*. If a sperm is defined only by its genetic code, then any sperm with that code is *that* sperm. This leads to the "Swap Problem": If two identical twins produce identical sperm, are the sperm the same? Most biologists and metaphysicians say no. Rejecting (2) makes gametes too fungible and undermines the biological basis of (1). **Keep (2).**

  **If you reject (3) (Event Essentialism):**
  *   *The Claim:* A meiotic event is the event it is even if its prior causes differ slightly.
  *   *The Cost:* You must commit to a **Coarse-Grained Theory of Events**. You have to say that events are "object + property + time." This is a standard metaphysical commitment (defended by Jaegwon Kim, among others). It does not open the door to "anything could have come from anything." It only says that the *same* physical process could have been triggered by a slightly different antecedent chain.
  *   *Verdict:* This is the cheapest cost. It preserves (1) and (2) while blocking the snowball. **Reject (3) in its strong form.**

  ### The Mitochondrial Objection: A Different Beast

  Nia's second point about mitochondrial replacement is **not** the same argument wearing different shoes. It is a problem of **Vagueness and Material Constitution**, not Modal Logic.

  *   **The Snowball Argument** asks: "How far back does the necessity stretch?"
  *   **The Mitochondrial Argument** asks: "Which part of the egg is the 'origin'?"

  If you say the origin is the *nucleus*, then (1) survives mitochondrial replacement (the nucleus is the same), but you face the problem that the cytoplasm affects development. If you say the origin is the *whole egg*, then (1) is threatened because the child comes from a hybrid egg.

  This is an independent problem. It suggests that "originates from" might be a vague relation, or that "egg" is a functional term rather than a mereological sum. It does not prove the Snowball; it just complicates the application of (1). You can accept the Snowball is invalid *and* still worry about mitochondria.

  ### The Repaired Argument (The "Local Origin" View)

  You want to keep (1). You can. But you must accept that (1) is not a "small claim" in the way you thought; it requires a specific metaphysical infrastructure to prevent the snowball. Here is the repaired, valid version of your position that blocks Nia's fatalism.

  **Premise 1 (Person-Gamete Link):** Necessarily, if person $P$ exists, $P$ originates from gametes $G_1, G_2$. (Your original 1).
  **Premise 2 (Gamete-Parent Link):** Necessarily, if gametes $G_1, G_2$ exist, they are produced by parents $M, F$. (Modified 2).
  **Premise 3 (Event Contingency):** The meiotic events producing $G_1, G_2$ are individuated by the dividing cells and the time, *not* by their total causal ancestry. Therefore, $M$ and $F$ could have produced $G_1, G_2$ via a slightly different causal chain. (Rejection of Nia's 3).
  **Premise 4 (Stopping Point):** The essentiality of origin terminates at the **immediate progenitors**. $P$ needs $G$; $G$ needs $M+F$. $M+F$ do *not* need *their* specific gametes to be *these* specific gametes in a way that transmits necessity back further.

  **Conclusion:** $P$ could not have come from different parents, but $P$ could have existed in a world where the distant past differed, provided that difference did not prevent $M$ and $F$ from meeting and producing $G_1, G_2$.

  **What this costs you:**
  1.  **Haecceitism:** You are committed to the idea that *this* sperm is distinct from a qualitatively identical sperm produced by a different division. (This is standard for origin essentialists).
  2.  **No Global Supervenience:** You deny that the entire history of the world supervenes on the present. You allow that the world could have been different 100 years ago but identical at conception.
  3.  **The "Almost Me" Problem:** In worlds where the causal chain differs significantly (e.g., Grandma misses the train), $M$ and $F$ might never meet. In those worlds, *you* do not exist. Nia is right about *that*. But she is wrong that *no* divergence is possible. There is a "buffer zone" of contingency between the Big Bang and Conception.

  ### Final Verdict

  Nia is trying to turn a **local constraint** (you need these parents) into a **global constraint** (you need this history).

  The chain breaks at **Step 3**. Events are not individuated by their total causal ancestry. If they were, physics would be necessitarian. Since physics appears contingent, event identity must be coarse-grained enough to allow different causes to produce the same event token (or a token identical in the relevant respects).

  You can keep (1). It is modest, but only if you defend it with a Coarse-Grained theory of events. Tell Nia she has proven that **Causal Determinism + Origin Essentialism = Fatalism**, but she has not proven that **Origin Essentialism = Fatalism**. She smuggled Determinism into Step 3.

  Tell her to take her snowball back to the lab; it melts outside of a necessitarian framework.
