answer: |-
  # WORKSHOP HANDOUT: JUDGING THE DEAD
  **Instructions:** Answer based on your immediate instinct. There are no right answers, only consistent ones.

  **1. The Ancient Owner**
  A Greek estate owner holds slaves. No surviving record shows him doubting this.
  A) He was morally wrong, even then.
  B) He was correct by his lights, wrong by ours.
  C) "Wrong" does not apply across time.

  **2. The Surgeon (1850s)**
  A surgeon experiments on patients without consent. A vocal minority of colleagues denounced this at the time.
  A) He is blameworthy (he could have known).
  B) He is excusable (standard practice).
  C) Record the harm, skip the blame.

  **3. The Psychiatrist (1950s)**
  A psychiatrist prescribes conversion therapy. This was mainstream professional consensus then.
  A) Condemn the practice universally.
  B) Contextualize the practice historically.
  C) Describe the effects only.

  **4. The Inquisitor (Medieval)**
  An inquisitor burns a heretic. He is sincere, careful, and follows all procedural rules internal to his tradition.
  A) He violated universal human rights.
  B) He violated his own tradition's rules.
  C) He fulfilled his role correctly.

  **5. The Pamphlet**
  A slaveholder reads an abolitionist pamphlet, writes "nonsense" in the margin, and carries on.
  A) He is more culpable than the ignorant neighbor.
  B) He is equally excused (product of his time).
  C) The distinction is modern noise.

  **6. The Future**
  Our great-great-grandchildren condemn us for something we currently see as neutral.
  A) They are right if harm exists, regardless of our norms.
  B) They are wrong if we followed our best norms.
  C) Their judgment is irrelevant to us.

  **7. The Historian's Text**
  You believe a historical figure caused great harm.
  A) Write "He was wrong" in the text.
  B) Keep text neutral; judge privately.
  C) Write "This caused harm" without calling him "wrong."

  **8. The Standard**
  When evaluating a past action, whose ethics apply?
  A) The historian's current ethics.
  B) The subject's community ethics.
  C) A mix of both.

  **9. The Statue**
  A hospital benefactor harmed dependents to build the wing.
  A) Remove the name (harm outweighs good).
  B) Keep the name, add a plaque.
  C) Keep the name, ignore the past.

  **10. The Rule**
  Is there a single rule for judging all past actors?
  A) Yes, apply one moral framework.
  B) No, adjust per era/case.
  C) No rule needed, just facts.

  ***

  # FACILITATOR KEY & ANALYSIS
  *(Keep hidden during quiz)*

  ## SCORING TREE & LEAVES
  *Map dominant answer patterns to the following positions.*

  **1. No-Discount (Mostly 1A, 2A, 3A, 6A, 8A, 9A)**
  *View:* Apply current morality universally; past actors are accountable to truth.
  *Awkward Commitment:* You must condemn every ancestor who owned slaves, regardless of their internal life.

  **2. Contextualist (Mostly 1B, 2B, 3B, 4C, 6B, 8B)**
  *View:* Understand don't blame; judgment requires shared conceptual horizons.
  *Awkward Commitment:* You cannot condemn a sincere torturer if his community endorsed torture.

  **3. Split View (Mostly 2C, 3C, 7B, 9B)**
  *View:* Judgment legitimate privately, but quarantined out of historical description.
  *Awkward Commitment:* You must withhold moral clarity from readers who rely on your expertise.

  **4. Mirror Split (Mostly 7C, 3C, 9B)**
  *View:* Verdicts on the page ("harm done"), no moralizing voice ("he was evil").
  *Awkward Commitment:* You must trust readers to draw moral conclusions you refuse to state.

  **5. Culpable Ignorance (Mostly 2A, 5A, 3B)**
  *View:* Discount only covers ignorance that wasn't self-made; excuses conformist, not refuser.
  *Awkward Commitment:* You must punish the curious dissenters more than the compliant majority.

  **6. Two-Tier (Mostly 1A, 6A, 9B)**
  *View:* We may judge but not enact; condemnation stands, building keeps its name.
  *Awkward Commitment:* You must tolerate public honor for people you deem morally culpable.

  **7. Symmetry (Mostly 6A, 1A, 10A)**
  *View:* Any rule you endorse must be one you'd accept having applied to you from the future.
  *Awkward Commitment:* You must accept future condemnation for things you currently believe are right.

  **8. Deflationary (Mostly 10B, 5C, 3C)**
  *View:* "The past" isn't a single thing; no general answer exists.
  *Awkward Commitment:* You offer no guidance when participants demand a consistent policy.

  ## THE GRID OF THREE FIGHTS
  *Mapping leaves onto the Conceptual (Describe?), Normative (Blame?), Practical (Enact?) triad.*

  | Conceptual | Normative | Practical | Leaf Position | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **Yes** (Universal) | **Yes** (Blame) | **Yes** (Enact) | **No-Discount** | Coherent |
  | **No** (Context) | **No** (Excuse) | **No** (Preserve) | **Contextualist** | Coherent |
  | **Yes** | **Yes** (Private) | **No** (Text) | **Split View** | Coherent |
  | **Yes** | **Yes** (Verdict) | **No** (Voice) | **Mirror Split** | Coherent |
  | **Yes** | **Conditional** | **Variable** | **Culpable Ignorance** | Coherent |
  | **Yes** | **Yes** | **No** | **Two-Tier** | Coherent |
  | **Yes** | **Conditional** | **Yes** | **Symmetry** | Coherent |
  | **Variable** | **Variable** | **Variable** | **Deflationary** | Coherent |
  | **No** | **Yes** | **Any** | **Empty** | **Incoherent** (Cannot blame what you cannot describe accurately) |
  | **Yes** | **No** | **Yes** | **Empty** | **Unattractive** (Know it's universal wrong but punish anyway? Rare) |
  | **No** | **No** | **Yes** | **Unexplored** | (Excuse the actor but remove the statue? Possible political compromise) |

  ## LIMITATIONS & INDISTINGUISHABLES
  *Pairs the quiz cannot separate.*

  1.  **"Didn't Know" vs. "Anachronistic":** The Contextualist (Blame is anachronistic) and the Excuser (He didn't know better) both select **2B/3B**. The quiz records the *verdict* (no blame), not the *reason*. You must probe this orally.
  2.  **Split vs. Mirror:** Participants often confuse "neutral text" (Split) with "factual verdicts without moral labels" (Mirror). Both select **7B/7C** interchangeably depending on mood.
  3.  **Two-Tier vs. Deflationary:** Both often select **9B** (Plaque). One does it on principle (judge but don't enact), the other on convenience (case-by-case).

  *Note on Names:* If attaching names (e.g., Williams, Geertz, MacIntyre), ensure the participant matches the *commitment*, not the biography. A Foucaultian might land on Contextualist or Split depending on their view of power vs. truth.
