  6.  **Residue Report (Normative vs. Non-Normative):**
      *   *Normative:* CJT justifies democracy/deference. MA does not justify clinical practice; it informs it. GRADE is the bridge (confidence $\to$ recommendation), but MA itself is descriptive.
      *   *Non-Normative Residue:*
          *   *Binary vs. Continuous:* CJT is classification (True/False). MA is estimation ($\hat{\theta} \pm \text{SE}$).
