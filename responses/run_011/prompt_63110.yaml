answer: |-
  **Seminar Handout: Week Six — Collapse and *Things Fall Apart***

  **Theoretical Framework**
  We are testing *Things Fall Apart* against three dominant models of societal collapse. First, the **diminishing-returns view**, where complexity becomes too costly and participants rationally defect. Second, the **self-inflicted-environment view**, where ecological overshoot leads to system failure. Third, the **skeptic or transformation view**, which argues "collapse" is merely a change in ruling stratum visible only in the archive, while daily life continues. Achebe's novel complicates all three. It does not fit neatly into any single category, and forcing it to do so reveals the ethical costs embedded in our theoretical language.

  **The Environmental Frame: Conquest vs. Overshoot**
  The self-inflicted-environment model finds no purchase here. There is no ecological suicide in Umuofia. The yams grow, the soil remains fertile, and the harvests are successful until the very end. The disruption is not endogenous but exogenous; it comes from outside the system rather than from within its resource base. This makes the novel a counterexample to the standard case list (Maya, Rapa Nui, Bronze Age) that dominates collapse literature. It forces us to distinguish between *systemic failure* and *external conquest*. If we classify this as collapse, we must admit that a society can be ecologically sustainable and yet cease to exist as a meaningful order. This challenges the assumption that collapse is always a failure of adaptation to nature. Here, the failure is a failure of defense against politics. To file this under "environmental collapse" would be a miscategorization; it is a political overwrite. However, keeping it in the collapse conversation demands we acknowledge that "collapse" can occur without resource depletion, driven entirely by the intrusion of a rival sovereignty.

  **The Defection Question: Rational Exit or Coerced Choice?**
  The diminishing-returns model suggests that when the cost of maintaining a social order exceeds the benefit, people leave. The novel initially supports this. The first converts to the missionary church are precisely those burdened by the old order: the *osu* (outcasts), mothers of twins left to die in the forest, and men like Nwoye who are traumatized by the ritual killing of a brother figure. For them, the Igbo cosmological package has high costs and low payoffs. The church offers sanctuary, status, and an alternative kinship structure. Viewed through the lens of rational exit, conversion looks like a market correction: the old firm was charging too much for too little protection, and the customers switched providers.

  However, framing this strictly as diminishing returns insults the text by sanitizing the power dynamics. It treats the colonial encounter as a competitive marketplace rather than a coercive occupation. The "better terms" offered by the mission are backed by the District Commissioner's prison and the court messengers' whips. When the clan leaders are shaved and imprisoned for protesting the burning of a church, the "choice" to defect is no longer purely rational; it is survival. To call this a Pareto improvement ignores the violence required to enforce the new order. The honest cost of the diminishing-returns analogy is that it renders the violence invisible. It turns the imprisonment of the elders and the beheading of the messenger into mere transaction costs rather than acts of war. The novel insists that while the *motivation* for defection may be rational (seeking relief from oppression), the *context* is not a free market of ideas but a gun-backed monopoly. The theory captures the *why* of the converts but fails to capture the *how* of the transition.

  **The Subject of Collapse: Polity or Cosmology?**
  This brings us to the skeptic view, which your co-TA favors: Umuofia is not destroyed, only re-attached to a different sovereignty. The farmers still plant, the markets still run, and the population survives. Therefore, the "collapse" is only documentary—a change in who writes the records. This relies on the subject-of-the-predicate problem: collapse of *what*? If the subject is "population" or "agriculture," the skeptics are right. But if the subject is "moral universe," they are wrong.

  Obierika's verdict near the end—that the white man has put a knife on the things that held them together—identifies the subject of collapse as the cohesive logic of the society, not its biological continuity. The Yeatsian title imports a European anxiety about civilizational disintegration, but Achebe localizes it. The collapse is ontological. The gods are silent; the oracle is ignored; the rituals are forbidden. A society defined by its relationship to its ancestors and its land ceases to function when that relationship is severed, even if the people remain alive to pay taxes to a new master. The novel refuses the skeptic's materialist definition of survival. It argues that a way of life can die even if the bodies breathing it do not. The texture of the book supports this: while the harvest continues, the meaning of the harvest changes. The new courts and churches are indeed a *more* complex order, but they are not *Umuofia's* order. To call this mere transformation is to privilege administrative continuity over cultural integrity. The novel suggests that for the people living it, the end of the world is not a metaphor when the rules governing life and death are replaced by aliens.

  **The Archive and the Commissioner**
  The final scene is the crux of the debate regarding the skeptic's archival argument. The District Commissioner decides to reduce Okonkwo's life and suicide to a reasonable paragraph in his book, *The Pacification of the Primitive Tribes of the Lower Niger*. This is the skeptic argument enacted: collapse is a formatting decision made by the victor. The Commissioner represents the historian who sees only the change in sovereignty, not the loss of meaning. He sees "pacification," not "devastation."

  However, Achebe's existence as the author rebuts the Commissioner. The novel itself is the chapter the Commissioner refused to write. By giving us the full texture of Okonkwo's struggle, Achebe insists that there was a real loss that the archive discounts. The skeptic is right that collapse is often *read* off a surviving archive, but the novel insists that the archive is lying by omission. The Commissioner's paragraph is not proof that collapse is subjective; it is proof that collapse is often silenced. The novel demands we recognize the loss that transformation-talk smooths over. It validates the experience of the conquered over the report of the conqueror. If we accept the Co-TA's reading fully, we risk becoming the District Commissioner, deciding that because the records show continuity, the suffering was negligible. The novel forces us to admit that "re-organization" can feel like apocalypse to the re-organized.

  **Conclusion: What the Novel Adds**
  Does *Things Fall Apart* muddle the debate or clarify it? It clarifies it by adding a phenomenological dimension that archaeology cannot provide. Archaeologists see pots stopping and walls falling; they infer collapse from material discontinuity. Historians see tax records changing hands; they infer transformation from administrative continuity. Neither can access the internal experience of the threshold.

  The novel contributes the *feel* of collapse. It shows that collapse is not just a systemic event but a psychological and moral one. It demonstrates that a society can be materially intact and yet spiritually shattered. This challenges the skeptics to define the threshold of "collapse" not just by population or monumentality, but by the coherence of meaning. It challenges the environmentalists to admit that politics can kill a society faster than drought. And it challenges the rational-choice theorists to acknowledge that "defection" under the gun is not the same as exit in a market.

  Ultimately, the novel survives the theoretical framing only if we allow it to break the frames. It is not a case study for any single model. It is a witness statement against the models that prioritize the observer's categories over the participant's reality. If the seminar concludes that Umuofia did not collapse because the yams kept growing, we have learned to read like the District Commissioner. If we conclude that the world ended because the things that held it together were cut, we have learned to read like Obierika. The novel asks us to choose which subject matters more: the land that remains, or the life that was lived on it.
