prompt: |-
  I want a short story, 1500 words or so, about a consciousness lab that works the way heterophenomenology says you should: you take the subject's verbal reports seriously as data, build up the world she seems to be living in, and stay strictly neutral about whether anything in that world corresponds to what's going on in her head — treat the whole transcript as sincere fiction until the science says otherwise.

  The lab's one subject is a locked-in woman whose reports come out through a speech prosthesis: a predictive-text system trained on a decade of her own journals, letters and emails. She answers their questions fluently and in her own idioms, but nobody on the team can say how much of the wording is hers and how much is the machine's best guess at what she'd say. The world they're writing up has two authors and they cant tell where one stops.

  Make the method strain on the page instead of explaining it. I'd want a scene where she reports a colour she has no name for and that nothing in the training data could have supplied; the PI insisting it goes in the transcript exactly as given, because that's the whole point of the method; and the junior researcher who types it up starting to worry the reporting is manufacturing the experience rather than describing it. Please no reveal at the end — not "it was the algorithm all along," and not a warm confirmation that it really is her in there. Just leave the question standing on the desk.
