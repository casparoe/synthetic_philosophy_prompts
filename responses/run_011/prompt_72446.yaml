answer: |-
  The cursor blinked. It was the only movement in the room, a steady rhythmic pulse against the white void of the main monitor. In the center of the room, strapped into the ergonomic chair with the precision of a flight pilot, sat Elena. Her eyes were open, fixed on the screen above her knee, but the rest of her was stone. Ten years of locked-in syndrome had turned her body into a museum of stillness.

  Sam sat at the transcription desk, fingers hovering over the mechanical keyboard. Behind him, behind the one-way glass, Dr. Aris Thorne watched. The room was soundproofed, but the silence felt heavy, pressurized by the equipment humming in the racks.

  "Question four," Thorne's voice came through the intercom, flat and devoid of expectation. "Describe the texture of the silence in the room."

  Sam typed the prompt into the interface. On Elena's screen, the words appeared. Below them, the predictive bar shimmered. Three options faded in, ghostly suggestions generated by the algorithm trained on Elena's pre-accident journals, her emails, her letters to her sister. The machine knew her syntax better than her doctors did. It knew she preferred compound sentences, that she hated the word 'feel', that she used 'heavy' as a universal descriptor for emotional weight.

  Elena's eyes twitched. The cursor on her screen moved. It hovered over the second suggestion: *It is thick, like wool.*

  She didn't select it. The cursor drifted to the empty field. She began to spell manually. This was the variable the team argued about over coffee. When she used the predictions, was it her mind choosing the path of least resistance, or the machine nudging her toward its statistical average? When she spelled manually, was it pure volition, or was she fighting the ghost in the code?

  The letters appeared one by one. *N-o-t w-o-o-l.*

  The machine suggested *woolens*. She ignored it.

  *Like dust that refuses to settle,* she typed. *It scratches the inside of the eyelids.*

  Sam typed the report into the master log. *Subject reports auditory-thermal synesthesia regarding ambient silence. Describes texture as abrasive particulate.*

  "Accept the description," Thorne said over the intercom. "Do not interpret 'scratches' as metaphor. Log it as phenomenological data."

  "Logged," Sam said. He kept his voice low. He knew the protocol. They were not mining for truth; they were mapping the territory of the text. They were building the world Elena seemed to inhabit, brick by verbal brick, without making any claims about whether the bricks were real. If she said the wall was breathing, the transcript recorded *The wall is breathing*. The question of the wall's respiration was bracketed, suspended in the neutral zone between her skull and the screen.

  "Question five," Thorne said. "Look at the calibration square on the north wall. The red one."

  Sam input the prompt. Elena's gaze shifted slightly. The camera zoomed in on her pupils. Dilated. Steady.

  The cursor moved. It jittered. Usually, her selection was decisive, a sharp click of the eye-muscle sensor. Today, the cursor danced over the predictive bar. The machine offered *Bright*. *Crimson*. *Standard*.

  She deleted them. She opened the manual field.

  *It isn't red,* she typed.

  Sam paused. The calibration square was hex-code #FF0000. It was red. It had been red for every subject for five years.

  "Clarify," Thorne said. His voice didn't change pitch. He didn't ask *Is it red?* He asked for clarification of the report.

  *The surface is red,* Elena wrote. *The light coming off it is not.*

  "Describe the light," Thorne said.

  Sam watched the cursor. It hovered for a long time. The predictive algorithm began to cycle through synonyms for color, growing desperate. *Orange? Pink? Magenta?* The machine was digging through ten years of her vocabulary, searching for a match, and finding none. This was the edge case. The training data covered her life up to the accident. It knew her favorite wine, the color of her daughter's hair, the shade of the curtains in her study. It did not know this.

  *It is a hollow color,* she typed. *Like a sound you hear in a dream when you wake up. It has no depth. It is... vlay.*

  Sam stopped typing. His fingers hovered. *Vlay.*

  He looked through the glass. Thorne was leaning forward, hands pressed against the pane.

  "Type it," Thorne said.

  "Sir," Sam said. "That's not a word. It's not in her lexicon. It's not in the training set. The algorithm couldn't have suggested it because it doesn't exist."

  "Type it exactly as given," Thorne said. "Subject reports qualitative descriptor: 'vlay'. Put it in quotes."

  "But where did it come from?" Sam asked. "If the machine couldn't predict it, and she hasn't used it in ten years... is she coining it now? Or is the algorithm generating a null-value error that looks like a word?"

  "It is data," Thorne said. "Our job is not to debug the subject. Our job is to archive the report. If she says the light is vlay, then in the world we are mapping, the light is vlay. Do not contaminate the transcript with your ontology."

  Sam typed it. *Subject describes spectral emission as 'vlay'.*

  He felt a cold prickle on his neck. This was the strain point of the method. They treated the transcript as sincere fiction until proven otherwise. But when the fiction introduced a new variable that hadn't existed in the source material, who was the author?

  If Elena's mind was generating 'vlay', it meant her consciousness was evolving new qualia, creating sensory experiences her brain had no historical reference for. It meant she was seeing something new.

  But if the machine was generating it... if the predictive text, strained by the conflict between her input and its database, had hallucinated a word to bridge the gap... then they weren't recording her consciousness. They were recording the machine's attempt to simulate her.

  And worse, Sam thought, looking at the back of Elena's head. What if the question itself was the author?

  "Question six," Thorne said. "Does the 'vlay' quality hurt?"

  Sam froze. He looked at the intercom button. "Dr. Thorne. Are we leading her? If we ask if it hurts, she might report pain because the text expects pain. We're manufacturing the qualia by querying it."

  "We are exploring the logical consequences of her report," Thorne said. "If the light is 'vlay', does 'vlay' have an affective component? Ask."

  Sam swallowed. He typed the question.

  Elena's cursor moved faster this time. *Yes. It itches.*

  *It itches.*

  Sam typed it out. The transcript was growing, a thick document of a world that existed only on the server. In that world, silence was abrasive dust and red light was a hollow, itching non-color called vlay. It was a coherent world. It had internal logic. It was also impossible.

  "End session," Thorne said.

  Sam hit the command. The screen in front of Elena went dark, save for the standby light. The hum of the servers seemed to grow louder in the silence.

  Sam saved the file. *Session_402_Elena_Transcript.docx*. He looked at the word count. 1,400 words of pure phenomenology.

  He stood up and walked to the glass. Thorne was still standing there, looking at Elena. She was staring at the blank screen. Her chest rose and fell, mechanically regulated by the ventilator rhythm, though she could breathe on her own. The machine was off. The predictive text was dormant.

  "Did you see the cursor?" Sam asked quietly.

  "When?"

  "Before she typed 'vlay'. It hovered over the null field for four seconds. The algorithm usually times out in two."

  Thorne didn't turn around. "Latency varies."

  "It looked like it was thinking," Sam said. "Not her. The bar."

  "It doesn't matter," Thorne said. "The method holds. We take the report. We build the world. We do not speculate on the source."

  "But if the source is the machine," Sam said, "then we're studying the AI's imagination, not hers. We're writing a biography of the software."

  Thorne finally turned. His face was tired, the lines around his eyes deep. "And if the source is her, and the machine is just the voice box? Then we are studying her. The transcript is the same either way. The world she describes is the only data point we have access to. Whether the engine is biological or silicon is a metaphysical question. We are engineers of the text."

  "She said it itches," Sam said. "Light doesn't itch."

  "In her world, it does." Thorne picked up his tablet. "Prepare the analysis for the morning review. Map the 'vlay' attribute against previous reports of discomfort. See if there's a correlation with the room temperature."

  "Dr. Thorne."

  "Yes?"

  "What if we stop asking?" Sam said. "If we stop querying her... does the world stop existing? If we don't ask about the color, does she see it?"

  Thorne looked at the file on Sam's screen. The cursor blinked at the end of the last sentence. *It itches.*

  "That," Thorne said, "is not in the protocol."

  Thorne walked out of the observation room, leaving Sam alone with the glass and the silence.

  Sam looked back at Elena. She hadn't moved. Her eyes were still fixed on the dark screen. Was she waiting for the next prompt? Was she waiting for the machine to wake up and tell her what she thought? Or was she sitting in the dark, watching a color that had no name, itching in the light that wasn't there, waiting for someone to believe her?

  Sam looked down at his hands. They were trembling slightly. He reached for the keyboard to close the file, but he stopped. He left the document open. The word *vlay* sat on the screen, bright and alien. It wasn't in the dictionary. It wasn't in the code. It was just there, suspended between the woman in the chair and the man at the desk, a small, impossible bridge that neither of them could cross.

  He turned off the monitor. The room went dark, but the word remained in his head, itching against the inside of his eyelids.
