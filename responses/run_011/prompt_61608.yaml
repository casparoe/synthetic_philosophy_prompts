      *   Why the deadlock? Because standard probability theory doesn't dictate how to translate subjective experience ("I see life") into a proposition ($E$). Bayesianism requires a proposition, but experience is pre-propositional. Bridging that gap requires an epistemic principle (like SSA or SIA), and there is no consensus on which principle is correct.
