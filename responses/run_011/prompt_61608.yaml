      *   *Deep Dive into the Epistemology:* Explain *why* Side A and Side B differ. Side A rigidifies the indexical ("*This* universe"). Side B existentializes ("*Some* universe"). This is the SSA vs. SIA tension (though I shouldn't use jargon if I can avoid it, but the concepts are necessary).
      *   *The "Two-Year" Factor:* Why hasn't it resolved? Because there is no external arbiter for epistemic norms. It's like arguing about the Principle of Indifference.
      *   *Path to Progress:*
          *   Stop asking "Is it evidence?"
