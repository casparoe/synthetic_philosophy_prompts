          *   *Counter:* The prompt specifies the disagreement is about *confirmation* (likelihoods/evidence), not the final posterior driven by stubborn priors. They agree on the math *given* the evidence. The fight is over the input to the math.

      *   *Alternative 4: Ill-Posed Question (Agent/Epistemic Situation).*
