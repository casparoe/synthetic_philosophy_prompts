answer: |-
  Dear Convenor

  You are correct to suspect that the impasse in your group is not empirical, and you are also correct that your working hypotheses point toward the solution, though I believe they stop short of the underlying commitment that drives them. My diagnosis is that the disagreement is substantive rather than verbal, but it is not substantive in the way your students think. It is not a dispute over what happened, but a conflict over the normative baseline of state obligation and the temporal boundaries of the causal chain. When one side says famine is a political crime and the other says it is a natural disaster, they are not offering competing descriptions of the same phenomenon. They are offering competing theories of what counts as a cause in a social system. The natural disaster camp treats the physical shock as the cause and policy as a background condition that might mitigate it, while the political crime camp treats the physical shock as a background condition and policy as the cause that amplified it. This is not merely a difference in counterfactuals, as you suggested, though that is part of it. It is a difference in the threshold of responsibility. The disagreement persists because both sides are answering a moral question while pretending to answer a mechanical one. Until you acknowledge that the word cause is carrying a hidden payload of obligation, the debate will remain stuck, because no amount of archival data on rice shipments or potato blight spores can resolve a dispute about who owes what to whom.

  Your hypothesis about the counterfactuals is the strongest lever we have here, but it needs to be sharpened. The natural disaster grammar asks what would have happened holding policy constant, which effectively treats the state as a passive variable or a physical constraint like the weather. The political crime grammar asks what would have happened holding the weather constant, which treats the state as an active moral agent with a duty to intervene. Both propositions are true, but they are non-comparable because they rely on different definitions of feasibility. The economic history students in your group are likely anchoring on the historical capacity of the state, arguing that a nineteenth-century colonial administration or a wartime cabinet did not have the logistical reach to prevent mortality given the transport and information constraints of the time. The development studies students are anchoring on the moral capacity of the state, arguing that the choices made prioritized certain lives over others, rendering the mortality a selection rather than a inevitability. When the second side says the state could have acted differently, they are importing a modern standard of feasibility backwards, as the first side claims, but when the first side says the state could not have acted differently, they are often defining capacity too narrowly, excluding political will from the definition of capacity. The impasse exists because one side defines capacity as logistical possibility and the other defines it as political priority.

  This leads directly to your second point about the phrase famine was caused by doing two jobs at once. You are right that it performs a mechanism job and an agency job, but the deeper issue is that the agency job requires a theory of knowledge and intent that the sources often cannot support. The political crime framing assumes that the state knew or should have known the consequences of its actions and had the standing obligation to prevent them. The natural disaster framing assumes that the state was reacting to constraints it did not create and could not overcome. In the case of the Great Leap Forward, the information failure was endogenous to the political system, so the crime framing holds well because the state destroyed its own ability to see the disaster. In the case of Bengal or Ireland, the information was often available but ignored or deprioritized. Here the crime framing relies on a moral judgment about prioritization rather than a factual judgment about knowledge. The natural disaster framing relies on a factual judgment about logistical limits rather than a moral judgment about prioritization. Because each side is optimizing for a different type of truth, one moral and one logistical, they talk past each other. You cannot prove a moral obligation with a shipping manifest, and you cannot prove a logistical impossibility with a cabinet minute.

  Your third thought about phases is perhaps the most concrete way to break the deadlock, and it suggests that the unit of analysis is the real problem. In Bengal, as you note, more than half the deaths occurred in the epidemic tail after the food crisis had abated. This fact undermines the physical shortfall argument because the calories were available when the people died, and it complicates the entitlement argument because the entitlement failure had technically been resolved by the harvest. The deaths were caused by disease vectors thriving in a displaced, immunocompromised population, which was a downstream effect of the initial policy choices but not a direct result of starvation. If your group continues to treat famine as a singular event defined by food availability, they will never agree. Progress requires shifting the unit of analysis from the famine event to the famine process, disaggregated by phase. The trigger phase may be physical, the amplification phase may be political, and the mortality phase may be epidemiological. A comparative case design that separates these phases would allow your students to agree that the potato blight was natural, the export policy was political, and the cholera outbreak was epidemiological, without forcing them to collapse all three into a single label of crime or disaster. This does not solve the moral question, but it prevents the moral question from distorting the causal map.

  Regarding the modern classification apparatus, you are right to be suspicious. The technical thresholds for declaring a famine are non-attributive by design, which looks like rigor but functions as a depoliticizing tool. It describes a state of affairs while withholding judgment about its origin, which allows international agencies to intervene without accusing the host government of malice. This is the natural disaster grammar reincarnated inside a supposedly political framework. It enables relief without demanding justice. However, the political crime framing has a symmetrical weakness, as you suspected. It flatters the present by assuming that any state with our logistics could have acted differently, and it often depends on an agent whose knowledge and capacity the sources cannot establish. It risks presentism, judging historical actors by standards of information and transport they did not possess. It also risks simplifying the state into a monolithic actor with a single will, ignoring the fragmentation and incompetence that often characterize famine governance. Both framings do ideological work. The natural disaster framing turns a catastrophe into an administrative checklist of distress signals and relief works with nobody to blame, protecting the legitimacy of the state. The political crime framing turns a catastrophe into a moral indictment, protecting the legitimacy of the critic but potentially obscuring the material constraints that made rescue impossible.

  So what counts as progress? It is not a resolution of the debate, because the debate is rooted in a bedrock moral and political commitment about the reach of obligation across time that no finding could touch. You will not convince the economic historians that logistics are moral, and you will not convince the development scholars that morality is logistical. Progress lies in reformulating the question itself. Instead of asking whether famines are natural disasters or political crimes, ask how physical shocks interact with political structures to produce mortality over time. Adopt a measurement convention that separates the trigger from the amplifier from the killer. Use a comparative case design that controls for state capacity, so you are not comparing a nineteenth-century colonial administration to a modern totalitarian state without adjusting for the technology of response. Acknowledge that the natural disaster framing has been doing ideological work by absolving the state of responsibility, but acknowledge also that the political crime framing does ideological work by assuming a capacity for rescue that may not have existed. The goal should not be to pick a side, but to map the interaction between the two.

  You should tell your group that the debate is expected to stay stuck, and that this is not a failure. It is a feature of the subject matter. Famine is where the limits of nature meet the limits of politics, and any explanation that privileges one over the other is necessarily incomplete. The stuckness reflects the tension between explaining suffering and assigning blame. If you can get them to agree that both sides are reporting a true but non-comparable proposition about an overdetermined event, you have achieved clarity. If you can get them to agree that the phase of the famine matters as much as the cause of the famine, you have achieved precision. But do not expect them to agree on the label. The label is not a description. It is a verdict. And your group is sitting in judgment on history without a clear statute of limitations.

  I hope this helps you move the conversation forward. The key is to stop trying to solve the causal question and start solving the classificatory one.

  Best regards

  Your Colleague
