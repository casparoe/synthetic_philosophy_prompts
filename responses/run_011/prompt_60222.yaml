answer: |-
  You are right to feel stuck, because the argument you have built is valid, but it is valid only because it smuggles in a controversial metaphysical commitment that most luck egalitarians explicitly reject. Your supervisor is correct that this is essentially the consequence argument wearing a blazer, and recognizing that is the key to finding the bad step. The argument works by defining responsibility in a way that is incompatible with the causal history of the agent, which forces the collapse you describe in step six. If you want to save luck egalitarianism without accepting the absurd conclusion that all inequality is unjust, you cannot cut premise four, even though that is where you feel the pressure. Premise four is arguably the strongest link in the chain because it is empirically and intuitively robust; we do not choose our genetics, our upbringing, or the basic structure of our psychology. To cut premise four is to claim that agents are causa sui, the cause of themselves, which leads to an infinite regress where you must have chosen the character that chose the character ad infinitum. That is a much heavier bullet to bite than the one required to save the view.

  The step you actually need to cut is premise two, and the reason it looked innocent when you wrote it down is that it appeals to a very plausible principle of control, often called the control condition. It sounds undeniable to say that an agent is responsible for a choice only if that choice is not the upshot of factors for which they are not responsible. However, in the context of this argument, premise two is functioning as an incompatibilist constraint on responsibility. It demands that for a choice to be responsible, the agent must be the ultimate source of the factors that produced the choice. This is where the consequence argument hides. If you cut premise two, you are adopting a compatibilist account of responsibility, which allows that an agent can be responsible for a choice even if their character and capacities are the product of luck, provided the choice issues from those characteristics in the right way, such as through reasons-responsiveness or identification with one's desires. This is the standard move for luck egalitarians like Richard Arneson or perhaps even G.A. Cohen in his later work, who distinguish between brute luck and option luck not by looking at the metaphysical origin of the will, but by looking at the social context of the choice.

  If you choose to cut premise two instead of premise four, you need to know what price the luck egalitarian pays. By cutting premise two, you surrender the claim that distributive justice is grounded in deep metaphysical free will. You are admitting that responsibility for distribution is a political construct rather than a moral absolute derived from the fabric of the universe. What is left of the project is a view that holds people accountable for their choices not because they are unmoved movers, but because holding them accountable is necessary for social relations, respect, or efficiency. The distinction between brute luck and option luck remains viable, but it shifts from being a metaphysical distinction about the origin of actions to a normative distinction about which risks it is fair to let individuals bear. You lose the comforting idea that the gambler deserves their loss because they were truly free in a libertarian sense, but you gain a theory that avoids the collapse into strict equality and aligns better with our considered judgments about savings versus gambling.

  Regarding your worry about the mismatch between premise one and premise five, where one speaks of degrees and the other speaks in absolutes, this is not doing real work in the argument and is not where the error lies. Premise one states that inequality is unjust exactly to the extent that it reflects brute luck. If premise five is true and no choice is responsible, then one hundred percent of any inequality reflects brute luck, so premise one still entails that one hundred percent of inequality is unjust. The quantifier scope difference is consistent with the deduction, so tightening that language will not save the argument from the collapse you fear. The problem is not the logic connecting the premises, but the truth of the premises themselves, specifically the definition of responsibility that forces the total collapse of option luck.

  Finally, on your supervisor's point about importing compatibilism, you can indeed import what the compatibilists say without breaking the analogy, though you must be careful about the type of responsibility involved. Some philosophers argue that distributive justice requires a thinner notion of responsibility than moral blame or criminal punishment. In criminal law, we might worry deeply about whether the agent could have done otherwise in a metaphysical sense before locking them up. In distributive justice, the question is often narrower: is it fair for the collective to compensate this individual for this loss? Here, compatibilism works even better because we are not punishing the agent but simply declining to subsidize their risky choices. So you can defend the view by arguing that while our characters are luck, our capacity to respond to reasons within a social framework is sufficient to ground the distinction between brute and option luck. If you cut premise two and embrace this political conception of responsibility, you keep the core insight of luck egalitarianism without being forced to deny the reality of constitutive luck or accept the absurdity of strict equality.
