  Here is the sanity check you asked for. You haven't gone heretical; you've just moved from reading advocacy summaries to reading the actual statutes and sociological audits. The "Decriminalisation is Best" consensus is robust, but it often glosses over the intersection of sex work law and immigration control.

  Here is the breakdown based on your specific criteria.

  ### 1. The Migrant Worker (No Papers / Temporary Visa)
  *Constraint: This worker cannot access the legal tier in any jurisdiction. They are vulnerable to deportation in all three.*

  **Tier 1: New Zealand (Decriminalisation)**
  **Score: 4/10**
  **Reasoning:** While Section 19 of the PRA explicitly bars temporary visa holders (making work a deportable offense), the *policing culture* of decriminalisation still offers a safety buffer. Migrants can theoretically access health services or report violence without the police automatically treating the *sex work itself* as a crime to be prosecuted. The threat is immigration enforcement, not criminal prosecution for prostitution. However, the legal exclusion means they have zero labor rights and live under constant threat of visa cancellation.

  **Tier 2: Nordic Model (End Demand)**
  **Score: 3/10**
  **Reasoning:** Selling sex is not a crime, so the migrant is not technically breaking sex work laws. However, this model relies on aggressive policing of buyers and "anti-trafficking" raids, which disproportionately target migrant workers. If caught, they are often detained in "protective shelters" (de facto detention) and deported. The criminalization of the client forces transactions underground, increasing violence risk, and the worker has no recourse to justice without triggering an immigration investigation.

  **Tier 3: Germany/Dutch (Licensing)**
  **Score: 2/10**
  **Reasoning:** This creates the most dangerous bureaucratic trap. Because the system relies on registration, anyone working without it is classified as an illegal laborer, not just a sex worker. Police raids focus on compliance (taxes, registration, health checks). An undocumented worker here is vulnerable to being processed as a trafficking victim (paternalistic detention) or prosecuted for illegal employment, with the added stigma of a two-tier industry that pushes unregistered workers to the most dangerous margins.

  ***

  ### 2. The Citizen Worker (Independent, Indoors)
  *Constraint: This worker can access the legal tier in all three jurisdictions.*

  **Tier 1: New Zealand (Decriminalisation)**
  **Score: 9/10**
  **Reasoning:** Sex work is treated as standard work. A citizen can work independently, screen clients, work with peers (without fear of "brothel keeping" laws), and sue for breach of contract or assault. There is no registration requirement that creates a public record, preserving privacy. The primary downsides are lingering social stigma and banking restrictions, not legal ones.

  **Tier 2: Germany/Dutch (Licensing)**
  **Score: 6/10**
  **Reasoning:** Legal, but burdensome. Registration creates a paper trail that can out workers to landlords, banks, or family. The system creates a "legal tier" (registered) and an "illegal tier" (unregistered), which stigmatizes those who choose not to register. Independent workers face zoning laws and bureaucratic hurdles that don't exist in NZ, but they do have access to social security and labor protections if they comply.

  **Tier 3: Nordic Model (End Demand)**
  **Score: 3/10**
  **Reasoning:** While selling is legal, the criminalization of buyers makes screening difficult (clients fear arrest) and pushes the industry underground. Third-party laws often prevent citizens from working together for safety (e.g., sharing a security guard or renting a space together can be construed as "pimping"). Access to justice is hampered because the transaction itself is illicit on the buyer's side, making evidence gathering complex.

  ***

  ### 3. The Comparison: Is "Decrim is Best" Universal?

  **Do the orderings come out the same?**
  **Yes.** The hierarchy (NZ > Nordic/Germany) remains consistent across both categories.

  **However, the "Decriminalisation is Best" claim requires a major asterisk.**
  You are right to question the standard line. The ranking order stays the same, but the **utility gap collapses** for the migrant worker.
  *   For a **citizen**, NZ Decrim is a 9/10 vs Nordic's 3/10. (A massive difference in quality of life).
  *   For a **migrant**, NZ Decrim is a 4/10 vs Nordic's 3/10. (A negligible difference in safety).

  **The Verdict:**
  "Decriminalisation is the best option" is **true for labor rights and safety**, but it is **false as a universal human rights solution.**

  The New Zealand model works brilliantly *if* you have the right passport. For the migrant worker, decriminalisation removes the *criminal* penalty for sex work, but it does not remove the *immigration* penalty. In fact, by creating a specific legal bar in the Prostitution Reform Act (Section 19), NZ explicitly codifies sex work as a privilege of residency.

  So, your "heretical" finding is correct: The global consensus on decriminalisation often assumes a closed system where workers have full citizenship rights. When you introduce border control, decriminalisation stops being a shield and starts being a gatekept privilege. The Nordic model is still worse for migrants (due to raid culture), but NZ's model is not the sanctuary it is often portrayed as for that specific demographic. It protects the *industry* for citizens, but explicitly excludes the *migrant* from that protection.
