answer: |-
  The dispute before us concerns the normative architecture of belief revision under uncertainty. Camp 1 defends Jeffrey Conditionalization (JC) as a substantive norm, insisting that the rigidity condition—preserving conditional probabilities $P(H|E_i)$ during an experiential update—is the defining feature of rational learning from uncertain evidence. Camp 2, invoking Carl Wagner's reparameterization, argues that rigidity is an unmotivated restriction that conflates the *force* of evidence with its *interpretation*, and that rational revision should preserve odds-ratios (the "evidential component") even when conditional probabilities shift.

  I argue that Camp 1 is correct: Jeffrey Conditionalization is the authoritative norm for experiential learning, while Wagner's alternative is either a mere notational variant or, when pressed as a distinct norm, an epistemologically flawed procedure that overrides actual sensory input with abstract invariants. The "heat" complication in the analyst case does not vindicate Wagner; rather, it demonstrates why we must distinguish between *experiential updates* (governed by JC) and *theoretical revisions* (changes in likelihoods). Rigidity is not a convenience; it is the necessary firewall that prevents changes in our models of the world from retroactively altering the record of our experiences.

  To see why rigidity enjoys independent justification, we must recognize what JC is designed to do. Standard Bayesian conditionalization applies when an agent learns a proposition $E$ with certainty ($P^*(E)=1$). JC generalizes this to cases where experience shifts probabilities across a partition $\{E_i\}$ without certifying any single cell. The core intuition is that experience provides the *inputs* ($P^*(E_i)$), while the agent's background theory provides the *processing rules* ($P(H|E_i)$). Rigidity demands that the experience itself does not alter the processing rules. If an experience could simultaneously shift the probability of the evidence *and* the conditional probability of the hypothesis given that evidence, we would have no way to distinguish between "seeing something differently" and "thinking about it differently." Rigidity isolates the sensory impact from the theoretical interpretation.

  Camp 2 objects that this is question-begging, assuming evidential meaning is fixed. However, the dynamic-coherence arguments (Skyrms, Armendt) provide a non-circular defense. The Dutch Book argument against non-rigid updaters hinges on the fact that if an agent changes $P(H|E_i)$ merely as a result of the shift in $P(E_i)$, without new information about the connection between $H$ and $E_i$, they are vulnerable to a sure loss. The objection that bets are settled on uncertain evidence misses the point: the coherence constraint applies to the agent's *own* valuation of the bets at the time they are made. If I accept a bet on $H$ conditional on $E_i$ based on my prior $P(H|E_i)$, and then I change that conditional without new information about the $H$-$E_i$ link, I have violated my own prior assessment of the gamble's fairness. Rigidity is thus required to prevent diachronic inconsistency in valuation.

  Wagner's reparameterization expresses the update in terms of Bayes factors or odds-ratios on the partition cells. Mathematically, under the assumption of rigidity, Wagner's method and JC are equivalent. The divergence arises only if we treat Wagner's factors as the primary norm, allowing them to remain fixed even when $P(H|E_i)$ changes. This is where the analyst case becomes decisive.

  Let us examine the numbers. The analyst's prior probability of contamination is $P(H) = 0.4$. The partition is $C$ (Clear), $P$ (Pale), $D$ (Deep). Her priors over the readings are $P(C)=0.40, P(P)=0.30, P(D)=0.30$. The dusk experience shifts these to $P^*(C)=0.25, P^*(P)=0.45, P^*(D)=0.30$. Under JC, we hold the conditionals fixed: $P(H|C)=0.1, P(H|P)=0.4, P(H|D)=0.8$. The new probability of contamination is:
  $$P^*(H) = (0.1)(0.25) + (0.4)(0.45) + (0.8)(0.30) = 0.025 + 0.18 + 0.24 = 0.445.$$

  Now consider the "heat" revision. The analyst realizes the strip was compromised, making a pale reading less diagnostic. She lowers $P(H|P)$ from 0.4 to 0.3. Camp 2 suggests we should apply the original "evidential factors" to this new theoretical context. The odds-ratio factors for the experience were calculated relative to the clear reading ($C$). The prior odds of $P:C$ were $0.30/0.40 = 0.75$. The posterior odds were $0.45/0.25 = 1.8$. The experience factor is $1.8/0.75 = 2.4$. Similarly, the factor for $D$ is $1.6$.

  If we follow Wagner's prescription to "reapply exactly those factors after the likelihoods have been corrected," we encounter a fundamental problem. Correcting the likelihoods for heat changes the *prior* probabilities of the partition cells themselves. If $P(H|P)$ drops, and we assume this stems from a change in $P(P|H)$ or $P(P|\neg H)$, the marginal $P(P)$ changes. Suppose the heat revision implies a new prior $P_{new}(P)$. If we apply the factor 2.4 to the *new* prior odds, we generate a *new* posterior probability for $P$, say $P^{**}(P)$. This $P^{**}(P)$ will almost certainly differ from the original $P^*(P) = 0.45$ that the agent actually observed at dusk.

  This reveals the epistemic error in Camp 2's position. The value $P^*(P) = 0.45$ represents the agent's actual sensory experience at dusk. It is the direct report of her visual system. The "heat" information is a theoretical correction regarding the *reliability* of the strip, not a hallucination that she saw a different color. By insisting that the odds-factors remain invariant, Wagner's method effectively overrides the agent's actual sensory input ($P^*$) with a reconstructed input derived from the factors. It implies that because the strip is less reliable, the agent *should have seen* something different, or that the "force" of the experience is independent of the specific probabilities assigned to the colors. But the experience *is* the shift to $0.25, 0.45, 0.30$. To alter those values based on a later theoretical discovery is to conflate *what happened to the sensor* with *what happened to the agent's perception*.

  Jeffrey Conditionalization handles this gracefully by separating the two steps. Step 1 (Dusk): Update partition probabilities to $P^*$ using JC. Result: $P^*(H) = 0.445$. Step 2 (Heat): Revise the model. This is not a Jeffrey update; it is a likelihood revision. The agent changes $P(H|P)$ to 0.3. She must then recalculate $P(H)$ using the *already updated* partition probabilities $P^*$ and the *new* conditionals.
  $$P^{**}(H) = (0.1)(0.25) + (0.3)(0.45) + (0.8)(0.30) = 0.025 + 0.135 + 0.24 = 0.40.$$
  Notice that $P^{**}(H)$ returns to 0.40. The heat information completely cancels the evidential gain from the dusk reading because the "Pale" reading, which became more probable, is now deemed uninformative. This is rational. The agent realized the evidence she thought she had was compromised.

  If we followed Wagner's method, we would apply the factors to the *new* priors. Since the heat makes $P$ less likely under $H$, the new prior $P_{new}(P)$ would likely be lower than the old $P(P)$. Applying the factor 2.4 to a lower prior odds yields a lower posterior $P^{**}(P)$ than the original $0.45$. This would result in a different final $P(H)$. Why is this inferior? Because it alters the record of the experience. The agent *did* assign 0.45 to Pale at dusk. To change that to satisfy an invariant factor is to prioritize mathematical symmetry over the phenomenology of the update. The "force" of the evidence is not an abstract number; it is the specific shift in credence over the partition.

  This leads to the charge of order dependence. Camp 2 suggests that if the order of updates matters, the framework is flawed. In the analyst's case, if she learned about the heat *before* dusk, she would have had different priors over the partition. If she applies the dusk experience *after* the heat revision, she starts with different priors and applies the experience to them. If she applies the experience *then* the heat revision, she starts with original priors, updates to $P^*$, then changes conditionals. These yield different results. Camp 2 views this as an embarrassment; I argue it is a virtue.

  The order matters because the epistemic situations are distinct. If I know the sensor is hot *before* I look, my visual experience is interpreted through a lens of skepticism *during* the perception. I might not shift my probability for "Pale" as high as 0.45 because I know the color is unreliable. My $P^*(P)$ would be lower. If I look first and learn of the heat later, I honestly record the shift to 0.45, then downgrade the significance of that shift via the conditional probability. Non-commutativity here tracks the difference between *perceiving with a known defect* and *perceiving normally then discovering a defect*. A normative theory that forced these to commute would be forcing distinct epistemic histories to yield identical doxastic states, which is irrational. Rationality requires that our beliefs reflect our history of information acquisition.

  Furthermore, the dynamic-coherence line genuinely pins down JC. The worry that bets cannot be settled on uncertain evidence is misplaced. In a Dutch Book scenario involving JC, the bookie makes bets conditional on the partition cells $E_i$. These bets are settled when the agent becomes certain of some $E_i$ (or when the world state is revealed). The vulnerability arises if the agent changes her conditional probabilities $P(H|E_i)$ between the time she accepts the bet and the time the condition is resolved, without new information. In the analyst case, if she accepts a bet on $H$ given $P$ at odds reflecting 0.4, and then changes her mind to 0.3 solely because her marginal $P(P)$ shifted, she is vulnerable. The heat information *is* new information about the link between $H$ and $P$, so it licenses a change in the conditional. But Wagner's proposal to keep the *factors* fixed while changing conditionals implies a constraint on the partition probabilities that is not grounded in experience. It subjects the agent to a coherence violation regarding the partition itself.

  Therefore, Wagner's reparameterization is merely a notational redescription when rigidity holds, and a normatively unjustified procedure when it does not. It attempts to isolate an "evidential component" that does not exist independently of the agent's probability assignments. The "evidence" is the shift to $P^*(E_i)$. There is no residue of "pure evidence" that survives changes in how we value the partition cells.

  In verdict, Jeffrey Conditionalization is the substantive norm of rationality for learning from uncertain evidence. Rigidity is not an arbitrary restriction but the essential condition that distinguishes learning from theorizing. The analyst's case confirms this: the dusk update was a learning event (fixing $P^*(E_i)$), while the heat update was a theoretical repair (changing $P(H|E_i)$). Attempting to merge these via Wagner's invariant factors obscures the distinction and forces the agent to revise her record of experience to fit a mathematical invariant.

  However, this verdict comes with a specified background condition: JC is authoritative only when the partition $\{E_i\}$ represents the direct content of the experience. If the "heat" information arrives simultaneously with the visual experience, the agent should not perform a sequential JC update followed by a likelihood revision. Instead, she should construct a new partition that includes the reliability of the strip, or simply adopt the $P^*(E_i)$ that reflect her skeptical state at the moment of perception. But given the case as described—where the experience is temporally distinct from the reliability check—JC correctly mandates that the experience fixes the partition probabilities, and the reliability check fixes the conditionals. The order dependence is not a bug; it is the formal trace of the temporal order of information. We should reject Wagner's proposal not because it is mathematically incoherent, but because it is epistemologically dishonest: it asks the agent to pretend her experience was something other than what it was, for the sake of preserving an abstract ratio that has no normative grip on rationality. Rigidity preserves the integrity of the experience; Wagner sacrifices it for invariance. Rationality demands we preserve the experience.
