  **Prevention vs. Mitigation:** The pact attempts **Prevention**. The relief valve provides **Mitigation**. If the pact fails, consequences are merely **Contained**, not **Prevented**.
  **Residual Risk:** Who accepts the risk of the pact failing? There is no single **Process Owner** entitled to accept **Residual Risk**.
  **ALARP:** Is the risk **As Low As Reasonably Practicable** if competitors force speed? Without ownership, ALARP cannot be demonstrated.

