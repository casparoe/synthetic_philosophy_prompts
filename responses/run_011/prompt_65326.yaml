answer: |-
  It is a familiar frustration in decision theory to be met with a slogan when a distinction is required. Your interlocutor's sentence—'The expected payoff is infinite, so any finite price is a bargain'—packs at least five distinct propositions into a single inference. To dismantle it, one must separate the arithmetic from the normative, and the abstract from the physical.

  Here is a menu of the precise claims embedded in that sentence, evaluated for their truth and the assumptions they require.

  ### 1. The Arithmetic Claim
  **Claim:** *The mathematical series representing the expected monetary value (EMV) of the St. Petersburg lottery diverges to infinity.*
  *   **Status:** **Trivially True** (in the abstract).
  *   **Assumptions:** This holds only for the idealised mathematical formulation where the payoff doubles indefinitely ($2^n$) and the probability halves indefinitely ($1/2^n$).
  *   **Caveat:** It ceases to be true if the series is truncated. In any physical instantiation, there is a maximum $n$ determined by the bank's solvency or the age of the universe. If the bank cannot pay beyond $2^{100}$, the expectation is no longer infinite; it is merely large.

  ### 2. The Linearity Claim
  **Claim:** *Rational value is linear with respect to monetary amounts (i.e., the utility of £$x$ is proportional to $x$).*
  *   **Status:** **Contentious / Generally False.**
  *   **Assumptions:** This assumes the agent has an unbounded utility function for money.
  *   **Caveat:** This was Daniel Bernoulli's original solution to the St. Petersburg paradox (1738). Most agents exhibit diminishing marginal utility (e.g., logarithmic utility). If utility is bounded, the expected *utility* of the ticket is finite, even if the expected *money* is infinite. Your interlocutor is implicitly assuming you care about money, not what money can do for you.

  ### 3. The Maximisation Principle
  **Claim:** *A rational agent is obliged to maximise expected value (whether monetary or utility) in a single decision.*
  *   **Status:** **Contentious.**
  *   **Assumptions:** This relies on 'Expectationism'. It ignores risk-weighting, ergodicity (time averages vs. ensemble averages), or ruin constraints.
  *   **Caveat:** Even if the expectation is infinite, if buying the ticket risks 'gambler's ruin' (bankruptcy before the payoff arrives), a rational agent might refuse. Furthermore, some decision theories (e.g., geometric mean maximisation) reject the arithmetic mean as the guide for repeated or significant choices.

  ### 4. The Feasibility Claim
  **Claim:** *There exists a counterparty capable of honouring the bet.*
  *   **Status:** **False** (in the real world).
  *   **Assumptions:** This assumes the existence of an entity with infinite resources.
  *   **Caveat:** No human, bank, or government can cover the tail risks of the St. Petersburg lottery. If the game cannot be offered, the price is irrelevant. This is often called the 'no casino' objection.

  ### 5. The Normative Conclusion
  **Claim:** *Any sane agent ought to exchange any finite sum of money for this ticket.*
  *   **Status:** **False** (by *reductio ad absurdum*).
  *   **Assumptions:** This follows only if Claims 1–4 are all accepted.
  *   **Caveat:** Since our intuition (your objection) is that no sane person would pay a great deal, and intuition is data in philosophy, a conclusion that violates it suggests one of the premises (1–4) is inapplicable to the real world.

  ---

  ### Which Readings Refute Your Objection?

  Strictly speaking, **none of these claims individually refute your objection.** Your objection is essentially a rejection of Claim 5 based on the implausibility of Claims 2 and 4.

  For your interlocutor's sentence to function as a refutation, they must be arguing that **Claim 1 entails Claim 5 directly.** This is where the argument fails. The move from 'is' (the expectation is infinite) to 'ought' (you should pay) requires the bridge of Claim 2 (Linearity) and Claim 3 (Maximisation).

  **Where the argument slides (Equivocation):**
  The interlocutor is sliding between **Claim 1** (a mathematical fact about an abstract series) and **Claim 5** (a practical recommendation for a human agent).
  1.  They establish Claim 1 to sound scientifically rigorous (it is mathematically true).
  2.  They invoke Claim 5 to sound practically decisive (it tells you what to do).
  3.  They hide the fragility of Claim 2 and Claim 4 in the word 'so'.

  You should reject the argument on the grounds that **Claim 2 is false for human agents.** We do not value money linearly; we value outcomes. Once you introduce a bounded utility function (e.g., there is a maximum amount of good that can be done with money, or diminishing returns set in), the expected *utility* becomes finite, and the 'infinite' argument collapses.

  ---

  ### The Finite but Astronomical Variant

  You ask whether any reading survives when the payoffs are adjusted so the expectation is **finite but astronomically large**. This is the true Pascal's Mugging scenario (e.g., a tiny probability of saving $10^{100}$ lives).

  In this version, **Claim 1 is false** (the expectation is not infinite). The interlocutor's original sentence no longer applies. However, the *spirit* of their argument relies on **Claim 3 (The Maximisation Principle)** combined with an **Unbounded Utility Function**.

  1.  **Does the argument survive?**
      *   **If utility is unbounded:** Yes. If you accept that saving $10^{100}$ lives is exactly $10^{50}$ times better than saving $10^{50}$ lives, and you are a strict expectation maximiser, you must pay the mugger. This is widely regarded as a *reductio ad absurdum* of unbounded utility functions.
      *   **If utility is bounded:** No. If there is a cap on value (e.g., you cannot value the salvation of more than $N$ beings meaningfully higher than $N+1$), the expected utility of the mugger's offer drops precipitously. The 'astronomical' number is neutralised by the utility cap.

  2.  **How to handle this version:**
      In the finite case, the burden of proof shifts to the **probability estimate**. In the St. Petersburg case, the probabilities are defined by the rules of the game (coin flips). In Pascal's Mugging, the probability is asserted by the mugger.
      *   **Epistemic Objection:** You are not obliged to assign the probability the mugger suggests. If a claim is extraordinary, the probability should be penalised (via a complexity prior or similar heuristic) such that the expected value remains negligible.
      *   **Boundedness Objection:** You should maintain that rational utility functions *must* be bounded to avoid this specific mugging. If a decision theory compels you to hand over your wallet to every stranger claiming god-like powers, it is the theory that is broken, not your intuition.

  ### Summary for the Seminar

  If you encounter this interlocutor again, you might say:

  > 'Your sentence conflates the convergence of a mathematical series with the normative requirements of a resource-bounded agent. The expectation is only infinite if we assume the bank is solvent (false), utility is linear (false for humans), and we ignore ruin (irrational). If we correct for bounded utility, the expectation becomes finite. If we then move to the Mugging case with finite expectation, your argument relies entirely on the claim that rational agents must maximise expected utility with an unbounded function. I reject that; a decision theory that mandates ruinous bets on negligible probabilities is not a guide to rationality, but a *reductio* of unbounded utility.'

  In short: The 'infinite' argument is a mathematical curiosity that dissolves upon contact with physics (solvency) or psychology (utility). The 'finite but large' argument is the real threat, and it is best parried by insisting that rational utility must be bounded.
