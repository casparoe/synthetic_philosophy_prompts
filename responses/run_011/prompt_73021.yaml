  Here is the principle, the verdicts, and the surgical advice you need to make the book coherent.

  ### The Principle: Semantic Truth vs. Pragmatic Truth

  Your beta reader is reacting to **Pragmatic Truth** (the intent to convey an accurate belief). You are writing to **Semantic Truth** (the factual accuracy of the proposition).

  For your book to hold together, you must adopt a single standard. Given your premise ("people who never say anything false"), your standard must be **Semantic Truth**. However, to satisfy the reader's moral intuition, the text must acknowledge that **violating Pragmatic Truth is a form of aggression.**

  The precise distinction you are working with is between **Lying** and **Paltering**.

  *   **Lying:** Asserting a proposition the speaker believes to be false (Violates Grice's Maxim of Quality).
  *   **Paltering:** Asserting a true proposition with the intent to induce a false belief (Adheres to Quality, violates Relation/Manner).
  *   **Equivocation:** Using a term with a private definition that contradicts the shared social contract (Violates Manner/Quality).

  Your beta reader writes "he's lying" because, in ordinary conversation, Paltering *counts* as lying. In your novel's specific logic, it does not. You do not need to change the scenes; you need to ensure the *narrative voice* distinguishes between the *act* (paltering) and the *moral weight* (deception).

  ### Verdicts on Your 8 Cases

  To achieve a coherent account based on "No False Propositions," you must categorize these strictly.

  1.  **Wine/Cooking:** **Palter.** (True statement, evasive). *Keep.*
  2.  **Hotel/Office:** **Palter (or Lie).** *Warning:* If he physically left at 7, saying "I was at the office until 9" is objectively false unless "at the office" has a technical definition (e.g., "on call"). If it's physically false, it's a Lie. If it's technically true (badge swipe), it's a Palter. *Keep only if technically true.*
  3.  **Unfaithful:** **Lie (Equivocation).** Language is a shared contract. Using a private definition to violate the listener's reasonable understanding is a lie, even if semantically consistent internally. *You called this a Lie; your intuition is correct.*
  4.  **Deposition:** **Lie.** Direct falsehood about mental state. *Keep (as the villainous act).*
  5.  **Dead Mother:** **Lie.** Objective falsehood. *Incoherent with premise.*
  6.  **Staff Meeting:** **Lie (Bullshit).** Statement contradicts known facts. *Incoherent with premise.*
  7.  **Email:** **Palter.** Presuppositions are not assertions. *Keep.*
  8.  **Coat:** **Non-verbal Deception.** Not a lie (no assertion). *Keep.*

  ### What You Must Give Up

  To maintain a coherent account of "people who never say anything false," **you must cut or rewrite Cases 5 and 6.**

  *   **Case 5 (The Decent Lie):** This is the hardest cut. But if your book is about the *constraint* of truthfulness, a character breaking that constraint for kindness undermines the central tension.
      *   *The Fix:* Make it a Palter. He says, "He was asking about you yesterday," (True: the brother looked at her photo, or thought of her) rather than "He rang." Or, accept that this is the *one* time the constraint breaks, but frame it as a catastrophic failure of their code, not a "decent" moment.
  *   **Case 6 (The Quarter):** If everyone knows it's false, saying it is not "truthful," it is **Bullshitting** (Harry Frankfurt's definition: indifference to truth). It violates the premise.
      *   *The Fix:* He says, "The numbers are in," (True) letting them draw the conclusion.
  *   **Case 3 (Unfaithful):** You already verdicted this as a Lie. If your characters "never say anything false," they cannot do this.
      *   *The Fix:* He says, "I have not broken our agreement," (True, by his technical reading of the agreement). This shifts it from Equivocation (Lie) to Palter (True but misleading).

  **Summary of Cuts:** You cannot have a book about people who never say anything false where they repeatedly say things that are objectively false (4, 5, 6). The drama must come from the *truth* being weaponized (1, 2, 7, 8), not from them lying when it suits them.

  ### Verdicts on Your Three Open Questions

  1.  **Out-of-context quotation (accurate but misleading):**
      *   **Verdict:** **Paltering.**
      *   **Reasoning:** The proposition is true (the person said those words). The implication (that they endorse the sentiment) is false. This fits your book's constraint perfectly. It is technically truthful, morally deceptive.

  2.  **First-person narrator arranging true events to imply falsehood:**
      *   **Verdict:** **Unreliable Narration (by Omission), not Lying.**
      *   **Reasoning:** A narrator is not "speaking" to a listener in the same contract. If every sentence is true, the narrator is not lying. They are **manipulating the Gricean Maxim of Quantity** (giving less info than required for full understanding). This is consistent with your characters' behavior. Do not call it lying; call it **curating**.

  3.  **True answer chosen to induce false inference (The stuck scene):**
      *   **Verdict:** **Paltering.**
      *   **Reasoning:** This is the core of your novel. It is not a lie. It is the weaponization of truth.
      *   **Advice for the Scene:** To stop your beta reader from writing "he's lying," you must make the character's *intent* clear in the narration.
      *   *Bad:* He said, "I was with Sarah." (He was, but she was his sister). Reader thinks: Liar.
      *   *Good:* He said, "I was with Sarah." It was true. He let the silence do the rest.
      *   You must signal that the character knows they are walking the line between truth and deception.

  ### Terminology for your Beta Reader

  If you need to explain this to your beta reader without a reading list, use these three terms:

  1.  **Paltering:** The active use of truthful statements to create a false impression. (This is what your characters do).
  2.  **Equivocation:** Using ambiguous language to conceal the truth. (This is what you must avoid if you want strict coherence).
  3.  **The Gricean Contract:** The unwritten rule that conversation is cooperative. Your characters are adhering to the *letter* of the contract (Truth) while violating the *spirit* (Cooperation).

  **Final Instruction:** Your beta reader is right that it *feels* like lying. You are right that it *isn't* lying. The friction is your theme. But you must clean up the objective falsehoods (5, 6, and potentially 2 & 3) or the premise collapses. The book is not about people who lie well; it is about people who hurt others with the truth. Make sure every wound is inflicted by a fact, not a fabrication.
