answer: |-
  **Preliminary Analysis: Readings of "Explanatory"**
  *   **Nomological:** Explanation requires subsuming events under general laws or regularities (e.g., "strikes occur when wages drop X%"). *Implication:* Reject thesis; it lacks generalizations.
  *   **Counterfactual:** Explanation requires explicitly ruling out alternative outcomes (e.g., "if not X, then not Y"). *Implication:* Revise thesis to include modeling or explicit counterfactuals.
  *   **Narrative/Intelligibility:** Explanation renders events intelligible by reconstructing the constraints and reasons that made the outcome necessary *for the actors*. *Implication:* Approve thesis; the reconstruction of decision-points *is* the causal mechanism.
  *   **Commitment:** I commit to the third reading. It respects the discipline's distinctiveness without sacrificing rigor.

  ***

  **MEMORANDUM**

  **TO:** Graduate Standing Committee
  **FROM:** [Your Name]
  **DATE:** March 10
  **SUBJECT:** Recommendation on Dissertation Eligibility – [Student Name]

  **Recommendation**
  I recommend we **approve** the dissertation as it stands, with no additional chapters or substantive revisions. Given the student's funding deadline in June, we must schedule the final defense immediately upon approval of this memo. Adding a chapter of generalizations would be cosmetic, delaying the degree without improving the scholarship. We should accept this work as a valid model of historical explanation and codify that standard for future candidates.

  **Defining "Explanatory Contribution"**
  The handbook requires an "original explanatory contribution," but offers no definition. Reader B argues that without generalizations, variables, or counterfactuals, there is no explanation—only description. Reader A argues the thesis explains "why it happened" better than quantitative work. Both are partially right, but we must choose a working definition that serves history, not sociology or economics.

  We should adopt a **mechanism-based reading of explanation**. In history, explaining an event does not always require proving it was *typical* (generalization); it requires proving it was *intelligible* (causal reconstruction). An account is explanatory if it demonstrates how the outcome was produced by the interaction of specific constraints and agency.

  To make this usable for future committees without invoking philosophical debates, we should apply three criteria:
  1.  **Constraint Identification:** Does the thesis identify the material, institutional, or epistemic constraints facing the actors?
  2.  **Choice Architecture:** Does it show how those constraints limited the viable options available to the actors at the time?
  3.  **Closure:** Does it demonstrate that, given those constraints and options, the outcome followed necessarily from the actors' decisions?

  If a thesis meets these three criteria, it has explained the event, even if it makes no claim about other strikes or other cities. It has isolated the causal mechanism: the decision-making process under constraint.

  **Addressing Reader B's Objection**
  Reader B is correct that "finding a narrative compelling" is not the same as "explanation." A story can be moving without being explanatory. B is also right that this thesis offers no general laws. However, B assumes that explanation *requires* generalization. This is a category error.

  In this specific case, the student does not merely tell us what happened; she reconstructs the epistemic horizon of the participants. She shows that the General Manager *could not* have seen the walkout as negotiable given his correspondence; she shows the Union officials *could not* have retreated without losing membership credibility given the meeting minutes. By rigorously reconstructing what the actors knew and what they feared, she demonstrates that the strike was not just what happened, but what *had* to happen given their situation. This is a causal claim. It rules out alternatives not by statistical modeling, but by showing the alternatives were unavailable to the agents themselves. This satisfies the requirement for explanation without requiring the thesis to become something it is not.

  **Addressing Reader A's Intuition**
  Reader A feels the explanation but lacks the vocabulary to defend it against B's structural critique. A's sense of "understanding why" is epistemic, not aesthetic. It is the recognition of necessity. When A says this explains better than quantitative work, A means that the quantitative work identifies correlations (wages vs. strikes), while this thesis identifies the *mechanism* (how wage disputes translate into decisions). We should validate A's experience by acknowledging that mechanism-based explanation is a legitimate form of explanatory contribution, distinct from but equal to variable-based explanation.

  **Precedent and Fairness**
  Six years ago, we approved a similar narrative thesis. Technically, past committees do not bind us; we could correct a past error. However, doing so now would be unjust. We cannot change the rules of the degree midway through a candidate's work, especially when a prior precedent established that narrative reconstruction was acceptable.

  If we believe narrative history lacks explanatory power, we should change the handbook for *future* students. We owe this student the standards under which she wrote. Rejecting her now would imply she failed to meet a standard that was effectively waived for her predecessor. That is procedurally indefensible.

  **Regarding Revisions**
  I strongly advise against the compromise of adding a "generalizing chapter." If the thesis explains via mechanism, adding broad claims about strike escalation would indeed be window dressing. It would force the student to make claims her evidence does not support, weakening the work's integrity. We should not reward superficial compliance with the wording of the rule over substantive adherence to its intent. The intent is to ensure the student contributes knowledge that clarifies the past. This thesis does that.

  **Conclusion**
  We should approve this thesis. In doing so, we should explicitly adopt the three criteria listed above (Constraint, Choice, Closure) as our departmental interpretation of "explanatory contribution." This resolves the conflict between Readers A and B by validating the method without dismissing the concern for rigor. It protects the student's funding timeline. It maintains consistency with our past practices. And it clarifies the standard for future candidates, preventing this ambiguity from arising again.

  Let us not mistake a difference in method for a lack of explanation. This work explains the strike by showing us exactly how the actors built it, step by step. That is sufficient.
