answer: |-
  Before you begin, note three tensions between your summary and Moore's actual text that may trip you up if left unaddressed. First, Moore does not claim intrinsic goods are only states of consciousness; in the two-worlds passage he argues a beautiful world is better than an ugly one even if no one sees them, implying beauty itself has some intrinsic value, though consciousness of beauty is the greatest good. If your guest restricts goods strictly to states of consciousness, he deviates from Moore on this specific test. Second, Moore's intuition is not merely a named faculty but a claim that fundamental ethical propositions are self-evident to mature minds, which is distinct from saying they are inexplicable. Third, the move you call under-description is standard analytic practice regarding ceteris paribus conditions, so treating it as purely evasive may strike informed listeners as uncharitable unless you frame it as a refusal to engage with hard cases.

  Question 1
  Pressure: Force him to admit that isolating a part from the whole alters its relational properties, potentially destroying the very value he seeks to measure.
  Concession: Extract an admission that the isolation test is heuristic rather than metaphysical.
  Question: If organic unities means value emerges from relations among parts, in what sense can any part be considered in isolation without altering it, and does the method smuggle in exactly the relational structure it claims to bracket?
  Follow-up: If he says we mentally hold relations constant, ask whether that mental act is not itself a relational structure that biases the outcome toward familiar configurations.
  Second Follow-up: If he says the case is under-described, press him to specify which descriptions are permissible without begging the question against the isolationist method.
  Moore Note: Moore grappled with this in his discussion of organic unities, though he maintained the isolation test was necessary for defining intrinsic value.

  Question 2
  Pressure: Challenge the reliability of the isolation test as a foundation, allowing him to defend its necessity.
  Concession: You concede that despite its flaws, the test is the only way to distinguish intrinsic from instrumental value.
  Question: Given that isolation alters the object, why should we trust a verdict reached in artificial conditions over a verdict reached in the natural context where the value actually manifests?
  Follow-up: If he argues context contaminates the judgment, agree that context brings in instrumental noise but ask how we filter that noise without already knowing what is intrinsically valuable.
  Moore Note: Moore grappled with this difficulty and insisted the isolation method was the only logical way to define intrinsic value, despite the practical difficulty.
  Mark: This is the question where the guest is expected to score a genuine point against you.

  Question 3
  Pressure: Expose the tension between valuing consciousness and valuing unobserved beauty.
  Concession: Extract a clear stance on whether beauty has value independent of a valuer.
  Question: In the test of the beautiful world versus the ugly world where neither is ever seen, if the beautiful one is better though unappreciated, what is left of the claim that value resides in states of consciousness?
  Follow-up: If he says appreciation is doing all the work, ask why his view is anything more than a refined experientialism in which the natural world is merely instrumental.
  Moore Note: Moore grappled with this explicitly and argued beauty has some intrinsic value even unobserved, though vastly less than the consciousness of it.

  Question 4
  Pressure: Test the compatibility of impartial value maximization with the partial nature of friendship.
  Concession: Extract whether partiality is intrinsically good or only instrumentally justified.
  Question: What does your account say about partiality, specifically regarding the worry that consequentialist treatments cannot capture acting for a loved one rather than for the good they produce?
  Follow-up: If he says friendship is intrinsically good, ask whether we are obliged to form friendships with people who would benefit most from them rather than those we naturally prefer.
  Second Follow-up: If he says the case is under-described, ask him to describe a case where natural preference and maximal good diverge sharply and state which obligation wins.
  Moore Note: This arises primarily for a contemporary defender; Moore did not address the Williams-style objection to consequentialist demands on personal relationships.

  Question 5
  Pressure: Challenge the objectification of the friend as a source of aesthetic or moral appreciation.
  Concession: Extract whether the value of friendship survives the diminishment of the friend's qualities.
  Question: You appear to value the friend as an object of appreciation, so if the friend grows dull or disfigured does the good itself shrink, and is that a bite-the-bullet moment or a misreading?
  Follow-up: If he says it is a misreading, ask what grounds the affection if not the qualities of the person that are appreciated.
  Moore Note: This arises only for a contemporary defender; Moore treated personal affection as a whole state of consciousness including the existence of the other person.

  Question 6
  Pressure: Demand a decision procedure for ranking futures without aggregation.
  Concession: Extract an admission that the theory lacks a computational algorithm for choice.
  Question: If wholes are not sums, what procedure does he actually have for ranking two candidate futures, and does the doctrine make the view either inert or merely a vehicle for his own preferences?
  Follow-up: If he says we compare wholes directly, ask how we resolve disagreement when two mature minds perceive the value of the wholes differently.
  Second Follow-up: If he says the case is under-described, insist that real policy choices are always under-described and ask how his theory guides action in non-ideal conditions.
  Moore Note: Moore grappled with this partially by admitting we often cannot calculate the best outcome, but he did not provide a systematic non-additive ranking procedure.

  Question 7
  Pressure: Suggest that non-additivity renders the theory subjective.
  Conception: Extract a defense of objectivity despite the lack of aggregation.
  Question: If you cannot sum values, on what basis do you claim your ranking is objective rather than a report of your own sensitivity to complex wholes?
  Follow-up: If he appeals to convergence among experts, ask whether this reduces value to a sociological fact about a specific class of observers.
  Moore Note: This arises only for a contemporary defender; Moore assumed objectivity via self-evidence without addressing the lack of aggregation.

  Question 8
  Pressure: Test the view against the possibility of artificially induced valuable states.
  Concession: Extract whether the source of the state matters for its value.
  Question: If the good is a conscious state of the right character, it is unclear why an artificially induced or simulated one is any worse, so does your view oblige us to prefer reality over a perfect simulation?
  Follow-up: If he says reality matters, ask whether this commits him to a value external to consciousness, contradicting the claim that goods are states of consciousness.
  Moore Note: This arises only for a contemporary defender; Moore did not anticipate simulation arguments.

  Question 9
  Pressure: Challenge the elitist implications of valuing aesthetic appreciation.
  Concession: Extract whether the view implies the lives of the aesthetically impoverished are less valuable.
  Question: Your view seems to rank the aesthetically impoverished lives of the poor low in a way you will not want to endorse, so how do you avoid implying that some lives are simply worth less?
  Follow-up: If he says basic needs must be met first, ask whether this makes aesthetic goods instrumental to stability rather than intrinsic goods.
  Moore Note: This arises only for a contemporary defender; Moore was criticized for reflecting a specific literary sensibility but did not address systemic poverty.

  Question 10
  Pressure: Distinguish intuition from cultural taste.
  Concession: Extract whether the theory is universal or historically situated.
  Question: What distinguishes a deliverance of intuition from a report of taste, and is your axiology best read as the theoretical rationalization of a particular early-twentieth-century literary sensibility?
  Follow-up: If he says intuition is universal, ask what he says to systematic and culturally patterned disagreement on fundamental goods.
  Moore Note: Moore grappled with this by claiming self-evidence, but he did not adequately address cultural variation in ethical intuitions.

  Question 11
  Pressure: Demand falsifiability conditions for the view.
  Concession: Extract what evidence could count against the view at all.
  Question: What evidence could count against the view at all, and what would distinguish his thesis from the purely psychological claim that people happen to like beauty?
  Follow-up: If he says nothing could count against it, ask whether this renders the view non-cognitive and merely expressive.
  Moore Note: Moore grappled with this by treating ethical propositions as synthetic and self-evident, but he offered no clear falsification conditions.
