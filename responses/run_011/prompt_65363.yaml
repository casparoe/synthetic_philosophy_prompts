answer: |-
  Elara Vance sat before the terminal, the glow of the screen casting a pale rectangle across her blotter. For twenty years, the Directorate of Cohort Allocation had been her world, a universe defined by the clean, unyielding geometry of birth dates. She was a Senior Determination Officer, Grade Seven, and her file was legendary within the civil service: four thousand determinations, zero overrides, zero appeals upheld. She was the human equivalent of the algorithm she served, a vessel for the immutable logic of the Register.

  Today, the logic was bleeding.

  On the screen lay Case 8940. The applicant was Mrs. Aris Thorne. Her date of birth was 14th April 2031. The Vernal Division—the legislative cut-off that separated the 'Stabilisers' from the 'Reconstructors'—had been set at 1st April 2031. By the letter of the Cohort Equity Act, Mrs. Thorne was a Reconstructor. This classification dictated her pension accrual rate, her eligibility for the Crisis Compensation Scheme, and the demographic pool from which her jury service would be drawn. It was a binary state, like citizenship or marriage. You were one, or you were the other.

  But beneath the birth certificate scan lay the Formational Inventory. It was a new tool, piloted quietly in the Directorate's basement before being leaked to the press. It was not a test of biology, but of biography. It audited a life: the news feeds consumed during adolescence, the specific anxieties recorded in medical logs during the Great Blackout, the cultural touchstones referenced in social audits. For most, the Inventory merely confirmed the date. For Mrs. Thorne, it screamed a contradiction.

  The Inventory reported that Mrs. Thorne's formative years were spent in the Hebridean Exclusion Zone. While the mainland burned through the resource wars and the digital collapse that defined the Reconstructor psyche, her parents had moved her to an island community that had severed external connections until she was eighteen. She had not seen the blackouts. She had not heard the emergency broadcasts. Her fears, her habits, her ontological weathering were those of a Stabiliser. She was born after the line, but formed before it.

  Elara rubbed her temples. The Directorate's mandate was mechanical. Date of birth was the only admissible evidence. The Inventory was advisory, intended to help officers understand *why* a cohort behaved as it did, not to redefine who belonged to it. To use it to override the Register was to suggest that a generation was not a fact of nature, but a matter of experience. It was to suggest the line was drawn in sand, not stone.

  The door to her office clicked open. Simon, her deputy, stepped in without knocking. He held a mug of tea that smelled of stale milk and anxiety.

  "Still looking at Thorne?" Simon asked, leaning against the doorframe. He didn't come closer. He knew better than to stand between an officer and her screen during a determination.

  "The Inventory is conclusive, Simon. She's a Stabiliser in everything but biology."

  "And yet she was born on the fourteenth," Simon said, taking a sip. "The Act is explicit, Elara. The Division is temporal. It's about when you arrived, not what you saw when you got here. If you override this, you're not just changing her classification. You're admitting the Register is a lie."

  "It feels like a misdescription," Elara said. "If I certify her as a Reconstructor, I am stating she belongs to a group defined by shared trauma she never experienced. Is that truth?"

  "It's administrative truth," Simon corrected. "It's the kind of truth that allows pensions to be paid and juries to be empanelled without a tribunal hearing for every soul in the kingdom. The legitimacy of the Directorate rests on the dates being beyond argument. If dates become negotiable, based on some subjective inventory of 'feelings' and 'memories', then where does it stop? Does a man born in '29 but raised in a bunker claim to be a 'Reconstructor' to get the higher pension? Does a woman born in '32 claim she was too insulated to be liable for the Reconstruction taxes?"

  "She isn't claiming compensation," Elara said. "She's waiving the Crisis payout. She gains nothing financially. She says the certificate misdescribes her life. She wants the record to match the person."

  Simon set his mug down on a filing cabinet. "Then she's a fool, and you'd be a fool to help her. You have a perfect record, Elara. Twenty years. You are the anchor. If you drift, the whole ship swings. Suppress the Inventory. Mark it as 'non-corroborative'. Sign the certificate."

  He left before she could answer, closing the door with a soft click that sounded like a gavel.

  Elara stared at the cursor. It blinked, a steady, rhythmic pulse. *Save. Submit. Close.* The rhythm of her career.

  Later that afternoon, the claimants' advocate arrived. Mr. Gedge was a man who wore his indignation like a heavy coat, too warm for the season. He sat in the chair opposite Elara's desk, placing a leather satchel on his knees. Mrs. Thorne was not with him; she was waiting in the anteroom, a silent presence behind the frosted glass.

  "Mrs. Vance," Gedge began. "You've had the file for three weeks. The Directorate is stalling."

  "We are conducting a review of the Inventory data," Elara said, keeping her voice level. "It is a complex instrument."

  "It is a mirror," Gedge said. "And you don't like what it shows. You see, the problem isn't Mrs. Thorne. She is a singular anomaly. The problem is the category itself. You treat 'Reconstructor' as a natural kind, like 'gold' or 'water'. You assume there is an underlying structure that binds everyone born after April 1st, 2031. But there isn't. It's a nominal convenience. It's a slice of time that pollsters and actuaries decided had meaning, and then you built a law around it."

  Elara folded her hands. "The law provides stability, Mr. Gedge. It allows for planning. If we treat generations as fluid, based on individual experience, we lose the ability to model risk."

  "Whose risk?" Gedge leaned forward. "If the categories are manufactured, then the scheme is unjust to everyone the manufacture excludes. Mrs. Thorne is being asked to identify with a collective history that rejected her. She is being taxed for a crisis she didn't live. She isn't asking for money. She is asking for ontological honesty. If the state says she is X, and she is Y, the state is lying."

  "The state is categorising," Elara countered. "Classification requires boundaries. Boundaries require cut-offs. Any cut-off will create edge cases."

  "But when the edge cases prove the rule is arbitrary, do you not have a duty to adjust?" Gedge tapped the satchel. "She knows she won't win. She knows the Act binds you. But she wants you to see that the binding is artificial. If you reject her, you confirm that the label is more real than the life. If you accept her, you admit the label is a fiction. Either way, the Directorate loses its innocence. But only one way preserves her dignity."

  Elara looked at the frosted glass. She could see the shadow of Mrs. Thorne sitting still, hands in her lap. "And if I accept her? If I override the date?"

  "Then you break the machine," Gedge said softly. "But perhaps the machine was already broken. You would be the one who pulled the lever. You would be the precedent."

  "And the cost?"

  Gedge smiled, a thin, humourless expression. "That depends on whether you believe the Directorate serves the people, or the Register."

  He left the satchel on the chair. Elara did not open it. She knew what was inside: affidavits from neighbours in the Hebrides, school records showing a curriculum untouched by mainland reforms, medical notes citing anxieties unrelated to the Blackout. Evidence of a life lived outside the grid.

  The office was quiet. The hum of the servers in the basement vibrated through the floorboards. Elara thought of her own classification. She was a Stabiliser, born five years before the Division. She remembered the blackouts. She remembered the fear. It felt like a part of her skeleton. Was it real because it happened, or was it real because everyone else who happened to be born near her said it mattered?

  If she approved Mrs. Thorne's reclassification, she was asserting that a generation was a historical kind, united by common descent from a stretch of events, not merely a stretch of time. She was saying that shared experience was the substance, and the date was merely the proxy. But if the proxy failed, the substance had to stand alone.

  But if the substance stood alone, how many others would come forward? The boy raised in a bunker? The girl homeschooled during the riots? The Inventory would have to be run on thousands. The pension models would collapse. The jury pools would scramble. The clean lines would blur into a watercolour mess.

  Simon was right. The legitimacy rested on the dates being beyond argument. To argue was to weaken.

  But Mrs. Thorne was right too. The certificate misdescribed her life. To force her to sign a document stating she was something she was not—that was a violence of a different order. It was a demand for conformity of the soul to the spreadsheet.

  Elara opened the case file. She highlighted the field: *Cohort Designation*. It read *RECONSTRUCTOR*.

  She thought of her perfect record. Twenty years of invisibility. She was the mechanism, not the agent. If she overridden the date, she became an agent. She became responsible. The Directorate did not forgive officers who introduced ambiguity. There was no procedure for 'conscience'. There was only 'compliance' and 'breach'.

  If she breached compliance, she would be reviewed. Her own pension, tied to her grade and her unblemished service record, would be reassessed. She would lose the Senior Determinant status. She would be moved to data entry, or worse, retired on medical grounds. 'Stress-related incompatibility'. She would lose the identity that had sustained her for two decades. She would become a case file herself.

  She looked at the shadow behind the glass. Mrs. Thorne had not moved.

  Elara typed. She did not type a justification; the system did not allow for justifications that contradicted the Act. She simply changed the designation code. *RECONSTRUCTOR* became *STABILISER (EXCEPTION 9)*.

  She hovered over the *Submit* key.

  To do this was to say that the kind was real, but the boundary was wrong. It was to say that the Directorate's authority was subordinate to the truth of lived experience. It was to admit that the state could be wrong about who you were.

  It was also to admit that she, Elara Vance, was no longer a perfect instrument. She was a variable.

  She pressed the key.

  The screen flashed amber. *OVERRIDE DETECTED. SENIOR AUTHORISATION REQUIRED.*

  She entered her biometric key. The screen turned red. *CASE SUBMITTED. OFFICER FLAGGED FOR REVIEW.*

  It happened instantly. The door opened again, but it wasn't Simon. It was Internal Audit. Two men in dark suits, carrying tablets. They didn't look at her face; they looked at the screen.

  "Mrs. Vance," the lead auditor said. "Please step away from the terminal."

  Elara stood. Her legs felt heavy, as if the gravity in the room had shifted. She walked to the coat stand and took down her jacket. It felt lighter than she remembered.

  "Where am I going?" she asked.

  "You are suspended pending a tribunal regarding the integrity of the Register," the auditor said. "You will be escorted to the lift. Your access credentials are revoked."

  She walked between them down the corridor. The office was open-plan; she could see the heads of her colleagues popping up over the partitions. Simon was standing by his desk. He didn't look at her. He looked at his shoes. He knew what she had done. He knew what it cost.

  As they passed the anteroom, the door was open. Mrs. Thorne was standing there, holding her coat. She looked at Elara. There was no triumph in her eyes, no victory. There was only a quiet recognition. She nodded, once.

  Elara nodded back.

  They reached the lift. The auditor pressed the button. "You understand," he said, not unkindly, "that this sets a precedent we cannot manage. You've opened a door that cannot be closed."

  "I know," Elara said.

  "Your pension classification will be reverted to standard civil service rates. The Senior Determinant bonus is forfeit."

  "I know."

  "And your record," the auditor said, looking at his tablet. "Twenty years, zero overrides. It's gone."

  "It was never mine," Elara said. "It belonged to the Register."

  The lift arrived. She stepped inside. The doors closed, cutting off the view of the Directorate, the hum of the servers, the clean lines of the carpet.

  As she descended, Elara wondered about Mrs. Thorne. Would the certificate change? Or would the Tribunal overturn Elara's decision to preserve the system's integrity? It didn't matter. The act was done. The Inventory had been used. The date had been questioned.

  She stepped out into the lobby. The rain was falling against the glass doors, blurring the street outside. The world beyond the Directorate was a continuum, un sliced, un counted.

  She pushed open the door and walked into the rain. She was no longer a Senior Determination Officer. She was no longer a guardian of the line. She was just a woman, born in 1985, wet and cold and uncertain. She did not know if generations were real. She did not know if she had done justice or caused harm. She only knew that for the first time in twenty years, the file was closed, and she was not inside it.

  The cost was specific. It was the loss of her certainty. She had traded the comfort of the rule for the burden of the exception. She walked towards the bus stop, joining the queue. There were young people there, and old people. She looked at them, wondering if they felt the weight of their birth years, or if they were just people, waiting for the rain to stop. She would never know the answer. But she had paid for the question.
