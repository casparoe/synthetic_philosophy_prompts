answer: |-
  # Stage 1: Brainstorming the Logical Space

  To construct a decision instrument that sorts participants by commitment rather than allegiance, we must isolate the independent variables that constitute the "logical space" of the debate. The following claims are the primary axes of disagreement.

  1.  **Phenomenal Realism:** There is a fact of the matter about "what it is like" to see that is distinct from functional or behavioral facts. (Negation: Illusionism/Deflationism).
  2.  **Higher-Order Requirement:** A mental state is conscious only if the subject is aware of being in that state (a thought about the thought). (Negation: First-Order views).
  3.  **Access Necessity:** A visual state is conscious only if its content is available for report, reasoning, or rational action. (Negation: Phenomenal Overflow/Localist views).
  4.  **Attention Necessity:** A visual state is conscious only if the subject attends to it. (Negation: Unattended Consciousness).
  5.  **Richness/Grain:** Phenomenal character can be more fine-grained than the subject's conceptual or reportive capacity (e.g., seeing 48 spots without conceiving "48"). (Negation: Sparse/Conceptualist views).
  6.  **Ignition/Broadcast:** Consciousness requires a specific, late-stage neural event that broadcasts information globally. (Negation: Early/Local Processing views).

  **Dependencies and Pruning:**
  *   **Access vs. Ignition:** If Access Necessity (3) is true, Ignition (6) is almost invariably true, as broadcast is the proposed mechanism for access. I will treat (6) as the mechanistic explanation for (3). I will keep **Access Necessity** as the node, as it is more phenomenologically descriptive for the seminar.
  *   **Attention vs. Access:** Attention is often treated as the gateway to Access. However, one can theoretically hold that Attention is necessary for Access, but Access is not necessary for Consciousness. I will keep **Attention Necessity** separate, as it distinguishes "Attention-Required" views from "Access-Required" views (one can access without focal attention in some models).
  *   **Higher-Order vs. Access:** Higher-Order Thought (HOT) usually entails Access Necessity (you must access the state to think about it). However, logical space permits a HOT view where the higher-order state is unconscious. I will keep **Higher-Order Requirement** as a primary node because it fundamentally changes the *kind* of thing consciousness is.
  *   **Realism vs. Richness:** Illusionism (Negation of 1) undermines the Richness debate (5); if there is no real phenomenal fact, there is no "rich" phenomenal fact. Illusionism must be split off early.

  **Combinatorial Count:**
  Treating the core live options as binary choices:
  1.  Realism (Yes/No)
  2.  Higher-Order (Yes/No)
  3.  Access Necessity (Yes/No)
  4.  Richness (Yes/No)

  This yields $2^4 = 16$ logical combinations. However, dependencies reduce this. (e.g., HOT + No Access is theoretically unstable; Illusionism + Richness is incoherent). The live theoretical positions occupy roughly 6 to 8 of these cells. The decision tree must navigate these dependencies to sort participants into the 8–12 leaves required.

  ***

  # Stage 2: The Decision Tree

  **Instructions:** Proceed through the nodes below. At each step, select the option that best matches your judgment of the case or claim described. Do not select based on which theory you prefer; select based on what you take to be true about the scenarios.

  1.  Consider the "user-illusion" claim: When we speak of the "feeling" of seeing, are we describing a real property of our mental states, or are we describing a story the brain constructs to explain its own reporting behavior?
      A. It is a real property distinct from behavior. (Go to 2)
      B. It is a story constructed by reporting systems. (Leaf 1)

  2.  Consider a case where a subject must think about their own seeing to have the experience (a "higher-order" thought). Is this inner registration necessary for there to be experience at all?
      A. Yes, experience requires awareness of the experience. (Go to 3)
      B. No, experience can occur without this inner registration. (Go to 4)

  3.  In cases where a subject has the inner registration but cannot report the content to others (e.g., due to temporary speech inhibition), is there still visual experience?
      A. Yes, the inner state suffices even without report. (Leaf 2)
      B. No, the capacity to report is still required. (Leaf 3)

  4.  Consider the "blindsight" paradigm: A subject with brain damage denies seeing a light but points to its location correctly at rates far above chance. In the successful trials, is there a visual experience that the subject ignores, or is visual experience entirely absent?
      A. There is a visual experience they cannot access. (Go to 5)
      B. Visual experience is entirely absent; the guidance is unconscious. (Go to 6)
      *(Empirical Note 1: This turns on whether forced-choice discrimination without report implies residual phenomenology. If neuroimaging shows V1 activity correlates with report, not discrimination, Branch B is supported. If V1 activity correlates with discrimination, Branch A remains open.)*

  5.  Consider the "speckled hen": You see a hen with 48 spots. You cannot count or report "48" in a glance. Does your visual experience contain exactly 48 spots, or is the experience vague until you count?
      A. The experience contains the specific detail exceeding report. (Leaf 4)
      B. The experience is vague; detail requires conceptual reporting. (Leaf 5)

  6.  Consider the "partial report" paradigm: A grid of letters is flashed too briefly to read. A tone cues the subject to report one row. They report that row perfectly but say they saw nothing else. Did they visually experience the uncued rows?
      A. Yes, they experienced more than they could report. (Leaf 6)
      B. No, experience is limited to what is reported. (Go to 7)
      *(Empirical Note 2: This turns on iconic memory capacity. If cueing allows report of items subjects claim they didn't see, Branch A is supported. If performance drops to chance for uncued items, Branch B is supported.)*

  7.  Is the ability to report or use information in reasoning necessary for visual experience, even if attention is focused on the object?
      A. Yes, without availability for use, there is no experience. (Leaf 7)
      B. No, local processing can generate experience without global use. (Leaf 8)

  8.  Is there any further fact about the experience beyond its representational content and functional role?
      A. No, the functional distinction is all there is. (Leaf 9)
      B. Yes, there is a further phenomenal fact. (Leaf 10)

  ***

  ### Key to the Leaves

  **Leaf 1: Illusionism / Deflationism**
  *   **Commitment:** Talk of inaccessible phenomenology is a misdescription manufactured by the access machinery itself.
  *   **Awkward Consequence:** Must explain why the illusion feels so vivid without positing a feeler.

  **Leaf 2: Higher-Order Thought (Libertarian)**
  *   **Commitment:** Consciousness requires a higher-order state, but that state need not be reportable.
  *   **Awkward Consequence:** Posits conscious states that are in principle unverifiable by the subject's public behavior.

  **Leaf 3: Higher-Order Thought (Access-Bound)**
  *   **Commitment:** Consciousness requires a higher-order state that is itself accessible for report.
  *   **Awkward Consequence:** Collapses into a version of Global Workspace theory but with extra metaphysical machinery.

  **Leaf 4: Rich View (Overflow)**
  *   **Commitment:** Phenomenology exceeds access even in ordinary, attentive seeing (fine-grained content).
  *   **Awkward Consequence:** Must explain the function of rich content that plays no role in reasoning or action.

  **Leaf 5: First-Order Representationalism (Sparse)**
  *   **Commitment:** Experience is first-order and real, but its grain is bounded by conceptual/reportive capacity.
  *   **Awkward Consequence:** Implies our immediate visual world is far less detailed than it introspectively appears.

  **Leaf 6: Localist / Recurrent Processing (Rich)**
  *   **Commitment:** Local visual processing suffices for experience and can outrun report and attention.
  *   **Awkward Consequence:** Suggests we are conscious of much more than we can ever know we are conscious of.

  **Leaf 7: Global Workspace Theory**
  *   **Commitment:** Consciousness requires ignition and broadcast to global systems for report and use.
  *   **Awkward Consequence:** Implies a vast amount of detailed visual processing occurs "in the dark" without phenomenology.

  **Leaf 8: First-Order Representationalism (Local)**
  *   **Commitment:** Grants a real functional distinction but denies any further phenomenal fact beyond local representation.
  *   **Awkward Consequence:** Struggles to distinguish itself from Localist views without invoking qualia.

  **Leaf 9: Functional First-Order (Deflated)**
  *   **Commitment:** Experience is real but exhausted by its functional role; no "extra" phenomenal glow.
  *   **Awkward Consequence:** Risks being indistinguishable from Illusionism to critics who demand a hard phenomenal fact.

  **Leaf 10: Phenomenal Realist (First-Order)**
  *   **Commitment:** There is a first-order experience with a real phenomenal character distinct from function.
  *   **Awkward Consequence:** Must explain how this non-functional fact interacts with the physical world (causal exclusion).

  **Leaf 11: [Unoccupied] Higher-Order without Realism**
  *   **Commitment:** Higher-order states are required, but they generate an illusion of phenomenology.
  *   **Diagnosis:** Incoherent; if the phenomenology is an illusion, the Higher-Order requirement loses its explanatory target.

  **Leaf 12: [Unoccupied] Rich Global Workspace**
  *   **Commitment:** Consciousness requires broadcast, but the broadcast content is richer than report.
  *   **Diagnosis:** Unstable; if content is broadcast, it is by definition reportable in principle, contradicting "richer than report."

  ***

  ### Empirical Node Annotations

  **Node 4 (Blindsight Paradigm):**
  *   **Paradigm:** Subjects with damage to primary visual cortex guess the location or orientation of stimuli while reporting blindness.
  *   **Deciding Result:** If neuroimaging shows that successful discrimination correlates with activity in extrastriate cortex *without* recurrent feedback to early visual areas, Branch B (Absent Experience) is favored. If activity suggests residual conscious processing pathways, Branch A remains open.
  *   **Permanent Openness:** If the subject's denial of experience is taken as incorrigible, the branch remains philosophically open regardless of neural data.

  **Node 6 (Partial Report Paradigm):**
  *   **Paradigm:** A matrix of items is flashed briefly (e.g., 200ms). A cue indicates which row to report. Subjects report the cued row accurately but deny seeing uncued items.
  *   **Deciding Result:** If subjects can report uncued items above chance when prompted later, Branch A (Experience Exceeds Report) is favored. If performance on uncued items is at chance, Branch B (Experience = Report) is favored.
  *   **Permanent Openness:** If "report" is defined strictly as immediate verbalization, but memory decay explains the loss, the question of whether the experience *existed* at the moment of flash remains open.

  ***

  ### Indistinguishable Pairs and Diagnostic Gaps

  **Pair: Leaf 7 (Global Workspace) and Leaf 3 (HOT Access-Bound)**
  *   **Diagnosis:** Both views require access/report for consciousness. The tree cannot reliably separate them because both predict the same behavioral thresholds for report.
  *   **Further Question:** "Is the state that makes experience possible a *thought about* the visual state, or simply the *availability* of the visual state?" This requires introspective commitment to the structure of the state, not just its conditions.

  **Pair: Leaf 8 (First-Order Local) and Leaf 6 (Localist Rich)**
  *   **Diagnosis:** Both agree local processing suffices without report. The distinction rests on whether the content is "rich" (Leaf 6) or "sparse/functional" (Leaf 8).
  *   **Further Question:** The Speckled Hen node (Node 5) attempts to separate these, but a respondent could hold a Local view that is Sparse. If they answer Node 5 via Branch B but Node 4 via Branch A, they land in Leaf 8, but may be indistinguishable from a Localist who simply denies the Hen intuition.

  ***

  **Final Verification:**
  1.  **Reachability:** Every leaf (1–12) is reachable by a unique path through the nodes. (e.g., Leaf 1: 1B; Leaf 4: 1A-2B-4A-5A; Leaf 7: 1A-2B-4B-6B-7A).
  2.  **Neutrality:** No node contains theory-specific vocabulary (e.g., "ignition," "qualia," "recurrent"). Terms like "visual experience," "report," and "functional role" are defined contextually or are common ground.
  3.  **Constraints:** 10 Nodes used (under 12). 12 Leaves (8–12 range). Speckled Hen and Blindsight cases included. Two empirical nodes annotated. Required leaves present.
