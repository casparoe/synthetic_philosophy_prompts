prompt: |-
  ok so im in 11th grade and I'm in this after-school philosophy club where we mostly just argue, and this week our teacher handed us an excerpt from John Stuart Mill's Utilitarianism (the 1863 one), chapter 2. I copy-pasted it off a website into a google doc so the dashes look wierd, sorry about that. This is the bit:

  "The creed which accepts as the foundation of morals, Utility, or the Greatest Happiness Principle, holds that actions are right in proportion as they tend to promote happiness, wrong as they tend to produce the reverse of happiness. By happiness is intended pleasure, and the absence of pain; by unhappiness, pain, and the privation of pleasure. To give a clear view of the moral standard set up by the theory, much more requires to be said; in particular, what things it includes in the ideas of pain and pleasure; and to what extent this is left an open question. But these supplementary explanations do not affect the theory of life on which this theory of morality is grounded- namely, that pleasure, and freedom from pain, are the only things desirable as ends; and that all desirable things (which are as numerous in the utilitarian as in any other scheme) are desirable either for the pleasure inherent in themselves, or as means to the promotion of pleasure and the prevention of pain. [...]

  Now, such a theory of life excites in many minds, and among them in some of the most estimable in feeling and purpose, inveterate dislike. To suppose that life has (as they express it) no higher end than pleasure- no better and nobler object of desire and pursuit- they designate as utterly mean and grovelling; as a doctrine worthy only of swine, to whom the followers of Epicurus were, at a very early period, contemptuously likened; and modern holders of the doctrine are occasionally made the subject of equally polite comparisons by their German, French, and English assailants.

  When thus attacked, the Epicureans have always answered, that it is not they, but their accusers, who represent human nature in a degrading light; since the accusation supposes human beings to be capable of no pleasures except those of which swine are capable. If this supposition were true, the charge could not be gainsaid, but would then be no longer an imputation; for if the sources of pleasure were precisely the same to human beings and to swine, the rule of life which is good enough for the one would be good enough for the other. The comparison of the Epicurean life to that of beasts is felt as degrading, precisely because a beast's pleasures do not satisfy a human being's conceptions of happiness. Human beings have faculties more elevated than the animal appetites, and when once made conscious of them, do not regard anything as happiness which does not include their gratification."

  That's all I've got — my pdf cut off right after that, so please don't tell me to go read the rest of the book, just work with what's pasted here.

  Everyone in club immediately went "oh he's ranking pleasures into higher and lower," which I already know, but that's not the part that's got me stuck. What I cant figure out is these two sentences: "a beast's pleasures do not satisfy a human being's conceptions of happiness" and "do not regard anything as happiness which does not include their gratification." Like, whose conceptions? and "regard as" — is he saying that once you're conscious of your higher faculties you literally stop getting pleasure out of the lower stuff (which is obviously false, people enjoy junk food and scrolling all the time), or something weaker about what counts as a happy *life* for a person? And if it's the weaker thing, then is happiness even a feeling anymore, or has he quietly switched to talking about whether your life matches a picture you hold in your head? Because a few paragraphs up he says pleasure and freedom from pain are the *only* things desirable as ends, and I don't see how both of those can be true.

  Also — I noticed he says earlier that "what things it includes in the ideas of pain and pleasure" is left as an open question. Is the faculties sentence him actually answering that question, or him dodging it and leaving "pleasure" vague on purpose?

  Here's my own idea, tell me if its dumb. My brother quit debate team last year to work full time at a bike shop and he keeps saying he's happier now, and my mom keeps saying he's wasting his potential. Maybe Mill is secretly on my mom's side — not claiming the bike shop *feels* worse, but claiming that once your mind has been used at a certain level you can't count your life as happy if that part of you sits unused, no matter how good it feels day to day. If that's right then "happiness" for Mill is about satisfying a trained appetite rather than about feeling anything in particular. Does that reading survive the actual words I pasted, or am I shoving something in there that isn't in the text?

  So can you walk me through the passage sentence by sentence in normal english, and then say which reading the words themselves support best: (a) Mill really is ranking felt qualities of pleasure against each other, (b) he's talking about what satisfies a person's conception of a good life, (c) he's just claiming as a matter of fact that people with developed faculties happen to get more pleasure from developed activities, or (d) something else you can see in there that I've missed. Point out the single sentence that's doing the most work for whichever option you pick, and say if the passage just can't decide between two of them.

  And please end by telling me what would change your mind — which sentence, read the other way, would flip you to a different option, and where do you think your interpretation is most likely to break down. I'd rather hear the shakiest part than get a super confident answer that turns out to be wrong, because I have to present this on Thursday and someone in club always finds the hole.
