answer: |-
  Right, let's settle in. This is a splendid question because it touches the very nerve where metaphysics meets engineering. We are asking about the *ontological commitments* of the Unicode Standard. When the Unicode Consortium says, "This is a character," what sort of thing are they claiming exists?

  Before I commit to a thesis, I need to think this through properly. There are tensions here that look like contradictions until you find the governing principle.

  ### Brainstorming Out Loud

  First, the baseline dogma: "Unicode encodes characters, not glyphs." This is the catechism. In philosophical terms, it's a strict Type/Token distinction, but with a twist. Usually, a 'Type' is an abstract form (the Platonic 'a') and 'Tokens' are instances (the ink on the page). But Unicode's 'Type' (the code point U+0061) is even more abstract than a visual form. It allows the visual form to fluctuate wildly (two-storey, one-storey, italic, bold) without changing the identity.

  So, visual essentialism is out. If the shape determined the identity, the one-storey 'ɑ' (U+0251) and the two-storey 'a' (U+0061) would be the same thing in English text, because we use them interchangeably depending on the font. But they aren't. They are distinct code points. Why? Because in the *International Phonetic Alphabet* (IPA), that shape carries a specific semantic load. In English orthography, it doesn't.

  This suggests identity is relative to a *system*. But then we have Variation Selectors (VS). In Han characters (CJK), a specific radical shape can change the meaning or the historical lineage of a character. So Unicode says, "Okay, base character plus VS-1 equals this specific glyph form." Wait. If we just said "characters not glyphs," why are we now encoding glyph selection?

  Ah, but look closer. The VS mechanism is a patch. It's an admission that sometimes, in specific scripts, the visual form *is* the semantic distinction. In Mongolian, the same code point can look different depending on its position in the word. That's contextual shaping. But sometimes the shape distinguishes two different words that would otherwise be homographs.

  So, is the theory inconsistent? Or is there a hierarchy?
  1.  **Default:** Abstract functional unit (English 'a').
  2.  **Exception 1:** Different system, same shape (IPA 'ɑ'). Here, the system defines the identity.
  3.  **Exception 2:** Same system, shape carries meaning (CJK). Here, the shape is promoted to a functional distinction.

  It seems Unicode isn't committed to *one* metaphysical theory of letters across the board. It's committed to a theory of *information processing*. A "character" is the smallest unit of text that requires distinct handling for searching, sorting, or semantic interpretation.

  If I search for "cat", I want to find "cat" whether it's written in Times New Roman or Helvetica. So 'a' must be stable. But if I search for a specific phonetic symbol, I need precision. If I look up a Japanese surname, the specific radical shape might matter for identity.

  So, the theory isn't about "what is a letter?" in the abstract. It's "what is a *distinctive unit of orthography*?"

  Rival accounts:
  *   **Visual Resemblance:** Ruled out. (Bold 'a' == Regular 'a').
  *   **Pure Phonetics:** Ruled out. (English 'a' != IPA 'ɑ', even if they sound similar or look similar).
  *   **Causal-Historical:** This explains why 'a' is U+0061 (ASCII heritage), but not why it covers multiple shapes.
  *   **Family Resemblance:** Too fuzzy for a binary standard.

  The exceptions (IPA, VS) aren't inconsistencies; they are boundary conditions where the "functional unit" shrinks or expands.

  Okay, I think I have the line. The presupposition is **Orthographic Functionalism**.

  ***

  ### The Ontology of the Code Point

  To answer you directly: the encoding policy presupposes a view I shall call **Orthographic Functionalism**.

  On this view, the identity of a letter is not fixed by its visual properties (shape), nor by its sound (phonetics), nor merely by its historical lineage. Rather, a "character" is defined as the minimal unit of distinctiveness within a specific **orthographic system**.

  Let us unpack this. When Unicode assigns U+0061 to 'a', it is not saying, "This is the essence of 'a'-ness." It is saying, "In the Latin script as used for English, French, German, etc., there is no semantic or orthographic distinction made between the one-storey and two-storey variants." Therefore, treating them as separate code points would introduce a distinction where the writing system recognises none. It would be a category error. To conflate the glyph (the ink) with the character (the functional unit) is to mistake the vehicle for the cargo.

  This quietly rules out **Visual Essentialism**. If visual form fixed identity, every font weight would require a new code point. 'a' in bold would be as distinct from 'a' in regular as 'a' is from 'b'. This is clearly not the case; we can search and replace across fonts without breaking the text's identity.

  It also rules out a naive **Phonetic Realism**. If the sound fixed the identity, the 'a' in "cat" and the 'a' in "father" might require different code points (as they do in some phonemic orthographies), or the English 'a' and the IPA 'ɑ' would merge. They do not. The IPA symbol U+0251 exists not because it looks different, but because it belongs to a different *system of meaning*. In the IPA, shape is semantic. In English orthography, shape is stylistic.

  ### The Exceptions: Inconsistency or Deepening?

  You ask if the IPA symbols and Variation Selectors are inconsistencies. I argue they are the proof of the principle. They reveal that the "character" is not a static metaphysical object, but a **relational node in a system of differences**.

  Consider the IPA 'ɑ' (U+0251). It looks like a one-storey 'a'. In English text, a one-storey 'a' is merely a glyph variant of U+0061. In the IPA, that specific shape *is* the meaning. To swap it for a two-storey 'a' would be to misrepresent the sound. Here, the orthographic system (phonetic notation) demands a finer grain of distinction than English prose. The encoding follows the functional requirement of the script.

  Consider the Variation Selectors (VS) for Han characters or Mongolian. This is the most delicate point. The Unicode Standard maintains "Han Unification"—the idea that a character with the same meaning in Chinese, Japanese, and Korean should share a code point, even if the traditional glyph shapes differ slightly. This is pure Functionalism: meaning over form.

  However, sometimes the shape *does* carry meaning. In Japanese, a specific radical variant might distinguish a surname from a common noun. In Mongolian, the glyph shape can be grammatically significant. If the standard ignored this, it would break the orthography. So, they introduce Variation Selectors.

  Crucially, the VS does not create a new *abstract character*; it creates a **standardised variant**. It is a mechanism to say, "The functional unit is the same, but the presentation is semantically loaded." This preserves the Functionalism while acknowledging that in some scripts, the visual form supervenes on the semantic content more tightly than in others. It is not an inconsistency; it is a recognition that the "function" of a character in CJK includes a visual component that the function of a character in Latin does not.

  ### Strict Presupposition vs. Comfortable Coexistence

  We must be careful not to attribute too much to the standard.

  **Strictly Presupposed:**
  1.  **The Type/Token Distinction:** There is an abstract layer (code point) and a concrete layer (glyph).
  2.  **System-Relativity:** Identity is determined by the writing system's own rules of distinction.
  3.  **Semantic Stability:** Text must remain semantically stable across changes in presentation (font, size, weight).

  **Comfortably Coexisting (but not required):**
  1.  **Causal-Historical Lineage:** It is convenient that U+0061 comes from ASCII, which comes from typewriters. But Unicode *could* have reassigned numbers. The theory doesn't demand history, only distinctness.
  2.  **Family Resemblance:** Type designers often speak as if there is a fuzzy cloud of 'a'-ness. Unicode tolerates this in the glyph layer, but the code point layer demands binary decisions. You are either U+0061 or you are not. There is no "70% 'a'".

  Where do competing theories license the same rules?
  A **Causal-Historical** theorist and an **Orthographic Functionalist** would agree on U+0061. The Functionalist says, "It's one unit in English." The Historian says, "It's one unit because ASCII said so." They converge on the code point, but diverge on *why*. If we encountered a new script where history suggested one grouping but function suggested another, Unicode would (and does) prioritise function. This shows Functionalism is the operative theory, not History.

  ### The Counterfactual: If Identity Were Fixed by Shape

  Now, imagine we adopted **Visual Essentialism**. Suppose letter-identity were fixed by shape, as type designers often imply when they speak of the "true form" of a letter. What would break?

  1.  **The Collapse of Search and Retrieval:**
      If the shape fixes identity, then U+0061 in Times New Roman is a different character from U+0061 in Helvetica. To search for "cat", your computer would need to know every font you have installed and query every visual variant of 'c', 'a', and 't'. Text processing becomes image recognition. The "Find" function becomes probabilistic.

  2.  **Storage and Transmission Bloat:**
      Currently, I can send you a text file containing "Hello" (5 bytes plus overhead). If shape determined identity, I would have to embed the font data or a specific glyph ID with every character to ensure you saw the "same" letter. A text message would be indistinguishable from a vector graphic. The efficiency of plaintext—the backbone of the internet—would vanish.

  3.  **The Death of Interchangeability:**
      Copy and paste would become treacherous. Pasting text from a serif document into a sans-serif editor might change the "characters" themselves. You could not reflow text for accessibility (e.g., for a dyslexic reader who needs a specific font) without altering the content of the message.

  4.  **Fragmentation of Orthography:**
      In English, we accept that 'a' has two common shapes. If these were distinct characters, we would face a spelling crisis. Is "man" spelled with a two-storey 'a' or a one-storey 'a'? Dictionaries would need to list both. Orthography would fracture along typographic lines.

  5.  **The End of Abstraction:**
      Philosophically, this would reduce text to a sequence of pictures. We would lose the ability to talk about the *word* independent of its *inscription*. We could no longer say, "The word 'a' appears twice here," if one was italic and one was roman. They would be different words.

  ### Conclusion

  The Unicode Standard is a pragmatic document, but it rests on a robust philosophical foundation. It presupposes that a letter is a **functional role within a normative system**, not a visual object.

  The type designer's obsession with shape is not wrong; it is simply categorially distinct. They are working on the *presentation layer* (the qualia of the text), while Unicode works on the *semantic layer* (the logic of the text). The exceptions for IPA and Variation Selectors do not undermine this; they merely mark the boundaries where the visual form re-enters the functional logic.

  In short: Unicode treats text as **code**, not **image**. To make shape the criterion of identity would be to abandon the very concept of "text" as we understand it in the information age, returning us to a world where every inscription is unique, and no two words are truly the same. And that would be a Babel far worse than the one we currently inhabit.
