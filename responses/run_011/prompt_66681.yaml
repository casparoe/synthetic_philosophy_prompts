prompt: |-
  I'm auditing a reading group on machine consciousness attached to a university AI-ethics centre; my background is one intro philosophy course and a few years of engineering, so I can follow the arguments but I can't tell when a competent-sounding author is quietly sliding from one claim to a neighbouring one. Last week we read the penultimate chapter of a recent trade-press book about whether artificial systems might have minds, and the chapter pauses to set out higher-order theories of consciousness before using them as a springboard for two conclusions. Here is the relevant passage as I transcribed it:

  > Higher-order theories say that a mental state is conscious just when the mind has a thought about that state: you consciously see red only because some part of you registers that you are seeing red. The view was developed mainly by David Rosenthal, who insists that these higher-order thoughts are themselves unconscious, which is why no infinite regress threatens. It follows that consciousness is a matter of self-monitoring rather than of what an experience feels like, and that is why the theory appeals to neuroscientists hunting for a measurable marker: any system sophisticated enough to keep track of its own states, including a well-designed artificial one, is conscious on this account. Critics reply that the theory makes consciousness both too cheap and too intellectual. Too intellectual, because a fish or an infant lacks the concepts needed for a thought about a state, and so would have to be unconscious. Too cheap, because a higher-order state could misfire and represent an experience the subject never had, in which case the theory is committed to a conscious experience of nothing at all; since that is absurd, higher-order theories have to be abandoned, and the alternative is to hold that consciousness is built into first-order states themselves.

  Could you audit this paragraph claim by claim, separating what a defender of the view would happily sign, what is a defensible simplification, and what is a genuine misrepresentation? I'm especially interested in four places. First, the gloss "a thought about that state": does it drop conditions the theory actually imposes on the higher-order state — conditions about how the state is arrived at, and about whose state it is taken to be — and, if so, does the inference to artificial systems survive once those conditions are restored? Second, the sentence claiming that consciousness becomes "a matter of self-monitoring rather than of what an experience feels like": is that a fair description of what the theory is doing with phenomenal character, or does it convert an attempted explanation of feel into a denial that there is any? Third, the two critical objections, which seem to pull in opposite directions — is the conceptual-sophistication objection aimed at the same target as the misrepresentation objection, and is the latter a refutation or a live dispute that different versions of the theory absorb differently? Here I'd like you to distinguish the actualist and dispositionalist variants, and also to say whether a view on which a state represents itself rather than being targeted by a separate higher-order state escapes the misrepresentation problem or just relocates it. Fourth, whether "the alternative is to hold that consciousness is built into first-order states" exhausts the options. Finish with a bottom line I can take back to the group: is the chapter's paragraph fair enough to quote approvingly, what would the two conclusions it draws look like if stated accurately, and are there spots where the author says something true but for a reason that isn't the theory's? I'm after the reasoning rather than references, so please don't send me to the literature — I have no access to it and would rather you work through the positions yourself.
