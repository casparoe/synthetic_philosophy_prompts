answer: |-
  Good evening. Look at the water. Look at the lights in the windows behind us. There are three thousand eight hundred of us here, and for the next hour, we are going to act as one body. We are going to walk to the landing. We are going to speak the names of our dead. We are going to throw bread into the river.

  I spend my days in the archive room upstairs from the post office. I handle the ledgers of the *Sentinel*. I handle the deeds, the marriage records, the obituaries. I am paid to know what is true about this town, and what is only story. So, before we walk, I need to tell you what I found in the bound volumes from last spring.

  There is a plaque down at the ferry landing that says this walk began in 1674. That is not true. The walk began in 1876.

  I say that not to diminish this night, but to honor the people who started it. In 1876, this town was thirty years younger, and much poorer. We were a lumber camp trying to become a community. The editor of the *Sentinel* looked at the national centennial and decided that we needed a custom of Old World dignity to match our new ambitions. He did not find this tradition in the dirt; he built it. He chose the lanterns. He chose the bread. He chose to bind us together.

  That means this walk is not a relic we inherited. It is a choice we made.

  And because it is a choice, you can see where we struggled to keep it. The walk did not happen in 1918. The flu was in the houses, and there were too many names to read, and not enough breath to read them. It did not happen from 1942 to 1947. We were at war, and the lights were blacked out, and the young men were gone. When the women's club brought the lanterns back in '47, they did not apologize for the gap. They simply lit the way again.

  Those gaps are not failures. They are proof. They prove that this walk is not a machine that runs on its own. It runs on us. It stops when we are hurting, and it starts when we are ready to heal.

  This year, we honor the Vanderwall family. Some of you know the Vanderwalls came in 1889, with the paper mill. They were not here for the founding. They were here for the building. When the lumber ran out, the mill kept the lights on. When the economy turned, the Vanderwalls kept the payrolls met. We honor them tonight not because they were first, but because they were steady. They are the reason many of the houses holding lanterns tonight are still standing.

  We often think history is something that happens to us. Something old, something finished. But standing here, looking at this crowd, I see that history is something we do.

  [Pause. A fourth-grader in a school jacket approaches the podium, holding a lit lantern. The speaker sets down their notes, takes the lantern with both hands, and holds it up slightly.]

  This flame is not old. It was lit ten minutes ago. It is fragile. If I let go, it goes out. If the wind picks up, it goes out. It needs a hand to shield it. It needs a child to bring it. It needs you to carry it down to the water.

  That is what 1876 gave us. It gave us the knowledge that we are not here because of what happened in 1674. We are here because someone decided we needed to be here, and someone else decided to keep it going, and now you are deciding to walk it tonight.

  When we throw the bread into the river, we are not feeding the ghosts of founders who never asked for this. We are feeding our own memory. We are saying that the people who died this year—the mothers, the veterans, the children—are not forgotten. The water does not know the difference between 1674 and 1876. The water only knows that we are here, together, refusing to let the names disappear.

  So take your lanterns. Check your flames. Shield them from the wind. We are not walking to honor a past that happened to us. We are walking to keep a promise we made to ourselves.

  \answer{This walk survives not because it is ancient, but because every generation since 1876 has decided it was necessary.}
