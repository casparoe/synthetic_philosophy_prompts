      *   **Core Tension/Problem:** She believed one hit proves nothing (luck vs. skill). A eulogy calling her lucky insults colleagues; calling her a genius insults her intellectual honesty. There's a dispute among colleagues about *how* she did it (rigorous reference classes vs. intuition/feel).
      *   **Constraints:**
          1.  *No numbers as evidence of excellence:* Can mention reasoning from figures, but cannot cite specific stats to prove she was good.
          2.  *Particular vs. Representative:* She must feel like a specific individual, not a symbol of forecasting. The gap between the general (base rate) and the specific (her) should be felt, not lectured.
          3.  *Tone:* Affectionate, lands for family, not a lecture on forecasting for experts.
          4.  *Length:* About 5 minutes spoken (approx. 750-900 words).

  2.  **Deconstruct the Themes:**
