      Start with the bridge story. Wait, no numbers allowed as evidence. Okay, start with the room. Half of you know her spreadsheets, half know her laugh. She hated being special. She thought luck was real. But she showed up every day. She drove fast. She calculated risk. Some say she used data, some say she used gut. It doesn't matter. She cared about truth. Goodbye.
