answer: |-
  Good morning. Thank you for being here.

  Looking around this room, I see two distinct maps of the same territory. On one side, the people who shared her office, her spreadsheets, her long afternoons arguing over the slope of a curve. On the other, the people who shared her kitchen table, her holidays, the passenger seat of her car. For a long time, I thought these were separate lives. But standing here, I realize she navigated both worlds with the same compass.

  To her colleagues, she was the person who stood in the doorway and asked the question nobody wanted to answer. We know the story of the bridge. We know she stood up when the room was confident and said the numbers were lying. She didn't do it with drama. She did it with a file folder thick enough to stop a bullet. She taught you that the future doesn't care about your optimism. She treated every new proposal not as a unique opportunity, but as the latest iteration of a story she had read hundreds of times before. She called the excitement of the project team the "inside view's charm offensive," and she was immune to the charm.

  But to the family, she was the woman who could parallel park a sedan in a space that looked too small, then laugh about the scuff on the bumper. She drove like she lived: eyes up, checking the mirrors, calculating the gap in traffic with a terrifying precision. We used to grip the handle when she merged onto the interstate. She told us we were worrying about the wrong variables. She wasn't gambling; she was assessing velocity. She knew exactly where the other cars would be before they did.

  She would be deeply uncomfortable with the idea that we are here to crown her a prophet. If she were standing at this podium, she would tell you that of a hundred people making bold predictions, a few will look like geniuses purely by the roll of the dice. She would insist that she had no way of knowing she wasn't one of them. She refused to let a single hit define a career. She knew that luck is a distribution, not a character trait.

  And yet, here we are.

  There is a debate among you, I know. Some say her accuracy came from the archives, from the rigid application of reference classes assembled from decades of past failures. Others say the files were just props, that she had an unteachable feel for where a project truly belonged, a intuition she never wrote down. She took that secret to the grave. Maybe she didn't resolve it herself. Maybe she knew that the moment you define the magic, it stops working.

  I am not here to settle that dispute. I am here to tell you that the method mattered less than the posture. In a world that rewards certainty, she rewarded doubt. She taught us that the most honest thing you can say about the future is "I don't know, but I know what happened last time."

  For the family, her work was abstract until it wasn't. We saw the toll it took, the way she carried the weight of public trust in her briefcase. But we also saw the warmth that survived the skepticism. She could dismantle a budget proposal in the morning and bake a cake that night that tasted like forgiveness. She was not a machine. She was a woman who loved the truth enough to fight for it, and loved us enough to put the fight down at the door.

  There is a base rate for grief. Statistically, aunts die. Nieces stand up and speak. Rooms full of people mourn and then they disperse. That is the general case. That is the reference class.

  But she was not the general case.

  She was the specific variable that broke the model. She was the particular laugh in the hallway. The specific scent of her perfume on a coat hanger. The way she tapped her pen when she was thinking. We cannot forecast what comes next without her. We cannot assemble a reference class for this loss.

  To her colleagues: Honor her by keeping the skepticism. Do not let the charm offensive win. Do not let the numbers lie just because they look nice.

  To her family: Honor her by taking the wheel. Check the mirrors. Watch the gap. And when the road opens up, do not be afraid to drive.

  She spent a lifetime calculating the odds so we wouldn't have to. Today, we accept the uncertainty. We accept that she is gone, and that the world is less precise without her. She was not a coin that landed heads. She was the hand that tossed it.

  Thank you.
