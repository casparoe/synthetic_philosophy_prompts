      *   *Body 3:* The legacy. The dispute among colleagues. Her own humility.
      *   *Conclusion:* The specific loss.

  7.  **Writing - Section by Section (incorporating the "No Number" rule):**
      *   *Intro:* Look around the room. Two tribes, one person.
      *   *Work:* She didn't sell dreams. She sold reality. The "inside view." She treated every new proposal like an old story she'd read before.
