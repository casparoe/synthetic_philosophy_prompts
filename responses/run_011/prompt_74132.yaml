      *   **The Personal Persona:** The driving. The warmth. Connect the driving to the forecasting (confidence, control, risk).
      *   **The Core Conflict (Luck vs. Skill):** Address her own skepticism. She wouldn't want to be called a prophet. How to frame her value? Not being *right*, but being *honest* with uncertainty.
