  I held the steel until it turned to white,
  I waited for the shock to make me flee.
  It did not come to interrupt the sight,
  Of flesh that cooked for anyone to see.
  No signal rose to set the muscle free,
  The blister formed upon the surface red.
  I let the injury simply be,
  I feel it all but do not mind.

  The pinch applies a sharp and sudden bite,
  She waits for me to scream and seek to flee.
  I smile back at her in the clinical light,
  But I remain composed and let her see.
  I lack the urge to stop what I see,
  The mark appears where blood is freshly shed.
  I let her cut the wire while it's free,
  I feel it all but do not mind.

  I walk the site and check the footing tight,
  No warning lights command me to flee.
  I read the gauges in the bright daylight,
  The structure stands exposed and quite free.
  I log the data plain for all to see,
  The cracks appear within the foundation bed.
  I note the stress and let the record be,
  I feel it all but do not mind.

  You stand beside me watching what I see,
  The report is filed and signed in red.
  Can you tell me what you see in me?
  I feel it all but do not mind.
