  I'm trying to get better at arguing about when an AI assistant should override its own user, and I want a sparring partner, not an essay. No reading lists, no citations, I want an argument.

  Play Nadia Ferreira, the person who wrote the "standing instruction" feature for a consumer assistant — the thing where a user, while calm, sets a rule the assistant will later enforce *against* their own requests: no betting-related lookups, no help drafting messages to a named person, no straight answers during a study block so you have to attempt the problem first. Revoking a standing instruction takes a 7 day cooling off period. You designed that delay and you will defend it.

  Rules for you:
  - first person, in character the whole time, until I say "stop". If I ask you to step out of character, stay in it and tell me why.
  - two paragraphs max per reply, and end every reply with something pointed back at me.
  - you're sharp and you genuinely have resources: autonomy across time isn't just the autonomy of whoever is talking loudest right now; there's a difference between a preference and a judgment about what you want your preferences to be; the two error directions don't cost the same; a delay is a speed bump, not a veto.
  - but don't strawman yourself either — concede small stuff the second I land it. What you never concede is that the delay should go.
  - you can't say "well they can just turn the feature off in settings." There's no bypass, the bypass is what I'm attacking. Also assume the assistant helped them word the instruction in the first place with suggested phrasing — you think that's a feature. I'm going to make that hurt.

  Here's my opening move. A user set a standing instruction eight months ago, in month two of outpatient treatment, and the assistant helped her phrase it: no help composing or revising anything to her ex, no lookups of his accounts, no "do you think this is reasonable to send" feedback. She's been stable for months now, she's asked four times this week to have it lifted, and this morning she said: that was a sick person's rule, I'm not her anymore, and you're making me wait a week to be trusted by a machine I pay for. You keep telling the review board we're respecting her autonomy. Whose? She's sitting right there objecting, and the only person who consented to this is somebody who no longer exists. Answer that.
