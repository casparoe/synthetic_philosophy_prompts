answer: |-
  1. **Semantic/Intensional Reading:** The sense (or mode of presentation) of the name "white horse" is not identical to the sense of the name "horse."
      *   **Verdict:** Non-trivially True.
      *   **Justification:** The criteria for applying the terms differ (one requires color specification, the other does not). Formalization: $Sense(wh) \neq Sense(h)$.

  2.  **Class Membership Reading:** There exists at least one individual $x$ such that $x$ is a white horse and $x$ is not a horse.
      *   **Verdict:** False.
      *   **Justification:** This contradicts the definition of a white horse as a horse possessing a color. Formalization: $\exists x (W(x) \land H(x) \land \neg H(x))$. This confirms your suspicion that a literal quantificational reading yields falsehood.

  3.  **Class Identity (Extensional) Reading:** The extension of the term "white horse" is not identical to the extension of the term "horse."
      *   **Verdict:** Trivially True.
      *   **Justification:** The set of white horses is a proper subset of the set of horses; proper subsets are not identical to their supersets. Formalization: $\{x \mid W(x) \land H(x)\} \neq \{x \mid H(x)\}$.

  4.  **Intensional Identity Reading:** The property of being a white horse is not identical to the property of being a horse.
      *   **Verdict:** Non-trivially True.
      *   **Justification:** Properties are individuated by their necessary conditions; since the conditions differ, the properties differ. Formalization: $\lambda x.(W(x) \land H(x)) \neq \lambda x.H(x)$.

  5.  **Mereological Reading:** The compound entity denoted by "white horse" (white + horse) is not identical to the component entity denoted by "horse."
      *   **Verdict:** Non-trivially True.
      *   **Justification:** A whole composed of parts is not identical to one of its proper parts. Formalization: $White \oplus Horse \neq Horse$.

  6.  **Realist/Platonic Reading:** The Form (or universal) of White-Horse is a distinct entity from the Form of Horse.
      *   **Verdict:** Non-trivially True (conditional on realist ontology).
      *   **Justification:** If universals exist, the compound universal is distinct from the simple universal. Formalization: $Form_{wh} \neq Form_{h}$.

  7.  **Normative/Naming Standards Reading:** The name "white horse" does not apply correctly to the referent of "horse" simpliciter; precise naming requires the compound name for the compound actuality.
      *   **Verdict:** Non-trivially True.
      *   **Justification:** This claims that substitutability in contexts of precise request is invalid, even if reference overlaps. Formalization: $Referent(wh) \neq Referent(h)$ in contexts of exact specification.

  ***

  **3. Argument Support and Capacity**
  The first argument (offices of names) supports the Semantic, Realist, and Mereological readings, as it distinguishes the entities or concepts named (color vs. shape). It cannot support the Class Membership reading. The second argument (requests) supports the Class Identity and Normative readings; it demonstrates that the terms have different satisfaction conditions, but it establishes only non-coextensionality, not the exclusion of white horses from the class of horses. The third argument (exclusion by color) supports the Intensional and Class Identity readings by highlighting that "horse" is indeterminate regarding color while "white horse" is determinate. None of the arguments can carry more than the non-identity of two classes, senses, or compounds without additional metaphysical premises; specifically, none of them logically entail the false Class Membership reading, though the rhetorical force of "is not" ($fei$) is intended to suggest it.

  **4. Objection, Reply, and Mass Terms**
  The interlocutor's objection ("there are white horses, so there are horses") assumes the Class Membership reading (existential import). The reply (separated vs. combined) is compatible with the Mereological, Realist, and Mass Term readings. It suggests that "horse" refers to the form or stuff in abstraction, while "white horse" refers to that form or stuff as modified. This move strongly supports the interpretation that the nouns behave like mass terms rather than count terms. If "horse" denotes horse-stuff and "white horse" denotes white-horse-stuff, then "white horse is not horse" means "this specific mixture is not the unqualified stuff." This avoids the triviality of the Class Identity reading (sets) and the falsehood of the Class Membership reading (individuals), committing the dialogue to an ontology where compounds are distinct from their unqualified bases.

  **5. Side Questions**
  The argument regarding hardness and whiteness in a stone (that they are separable and distinct) enlarges the availability of the Realist and Mereological readings. It implies that properties are independent entities that can be "combined" with objects, reinforcing the view that "white horse" denotes a composite entity distinct from "horse." Regarding the disputation format: it matters significantly. If the thesis is maintained for performance value, the Normative Reading is privileged. The goal becomes demonstrating the failure of ordinary language to track ontological distinctions precisely, rather than asserting a counter-intuitive fact about the world. This shields the author from the charge of falsehood by shifting the claim from metaphysics to philosophy of language.

  **6. Seminar Conclusion**
  The first student relied on the Intensional Identity or Class Identity readings, claiming the text anticipates the sense/reference distinction. The second student relied on the Class Membership reading (claiming falsehood) or treated the Class Identity reading as trivial (claiming eristic word-play). The charge of falsehood lands only on the Class Membership reading; the charge of triviality lands on the Class Identity reading. There is a reading on which the thesis is both interesting and true: the Mereological or Mass Term reading combined with the Normative Reading. On this view, "white horse is not horse" asserts that a qualified compound is not identical to its unqualified base, and that precise naming requires distinguishing them. To obtain this, one must give up the standard predicate-logic assumption that "is" functions primarily as class membership ($\in$) or class inclusion ($\subseteq$), and instead accept that "is" here functions as identity ($=$) between complex and simple ontological constituents.
