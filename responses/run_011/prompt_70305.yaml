answer: |-
  Does the mapping between nucleotide triplet and amino acid rely on chemical necessity?
      Yes
          Stereochemical Theory
          Claim: The code is not arbitrary; specific chemical affinities between codons and amino acids dictated the mapping.
          Commitment: Must explain why the current table is not universal if chemistry is absolute.
      No
          Can the genome be physically separated from the cellular machinery reading it?
          No
              Autopoietic Systems (Maturana)
              Claim: The cell produces its own components; code and reader are mutually constitutive and inseparable.
              Commitment: Makes engineering interventions conceptually impossible without destroying the system.
          Yes
              Does a synthetic DNA strand storing a video file count as genetic information?
              No
                  Is information restricted to sequences with selected biological function?
                  Yes
                      Teleosemantics (Millikan)
                      Claim: Meaning derives from evolutionary history and proper function, not mere syntax.
                      Commitment: A perfectly functional gene created yesterday has no meaning until selected.
                  No
                      Causal Information (Dretske)
                      Claim: Information is defined by causal correlation regardless of evolutionary history.
                      Commitment: Struggles to distinguish noise from signal without a function.
              Yes
                  Is uncertainty reduction (Shannon) sufficient for information status?
                  No
                      Semantic Information (Jablonka)
                      Claim: Information requires a receiver that interprets the signal within a context.
                      Commitment: Risks reintroducing a homunculus to explain the interpretation.
                  Yes
                      Shannon Realism (Sterelny)
                      Claim: DNA carries information in the strict mathematical sense, independent of meaning.
                      Commitment: Equates a gene with a random string of equal entropy.
                  Is the protein output determined solely by the sequence string?
                  No
                      Contextualism (Griffiths)
                      Claim: Output depends on cellular context, splicing, and environmental factors.
                      Commitment: Dilutes the concept of a 'programme' into a general causal web.
                  Yes
                      Do prions and epigenetic marks count as part of the code?
                      Yes
                          Extended Inheritance (Oyama)
                          Claim: Inheritance includes structural and behavioural traits, not just sequence.
                          Commitment: Makes the boundary of the 'genome' practically indefinable.
                      No
                          If we rewrite the codon table, does the definition of the code change?
                          Yes
                              Conventionalism (Godfrey-Smith)
                              Claim: The code is a frozen accident; changing the convention changes the code.
                              Commitment: Implies the natural code is no more real than a agreed-upon file format.
                          No
                              Computationalism (Dawkins)
                              Claim: DNA is a digital programme; the medium is irrelevant to the logic.
                              Commitment: Treats the cell as a passive runtime, ignoring biochemical constraints.

  **Logically Available but Unheld Combinations**

  There are positions within this logical space that remain curiously unoccupied. The most prominent is the combination of accepting Shannon information sufficiency while denying the separability of the reader and the code. Technically, one could argue that DNA reduces uncertainty (Shannon) but only within an inseparable autopoietic loop. This is rarely held because it creates a category error: Shannon theory assumes a channel distinct from the source and receiver. If the machinery is inseparable from the data, the channel definition collapses. Engineers find this incoherent because it breaks the transmission model; biologists find it unappealing because it grants too much reality to the 'signal' without a distinct receiver.

  Another unheld position is accepting synthetic video storage as genetic information while insisting the codon table is chemically forced. If the mapping is chemically necessary, a synthetic strand storing a video should not translate into proteins reliably unless the video data accidentally matches chemical affinities. Holding both implies that chemistry dictates the natural code but arbitrary syntax works for artificial code. This is logically unstable. It suggests two different physics for natural and artificial DNA, which is empirically false. It remains unexplored because it requires a dualism of physical laws that no serious researcher supports.

  **Indistinguishable Leaf Pairs**

  Despite the branching, certain leaves converge on practically identical predictions, making them difficult to distinguish empirically. Computationalism and Shannon Realism are nearly indistinguishable in a lab setting. Both treat the sequence as the primary locus of information and downplay the cellular context. The difference is metaphysical: one claims it is a 'programme' with logic, the other claims it is merely a high-entropy string. For an engineer designing a synthesis pipeline, the distinction is irrelevant; the workflow remains the same.

  Similarly, Contextualism and Extended Inheritance often overlap. Both deny that the sequence alone determines the outcome. Contextualism focuses on splicing and reading frames, while Extended Inheritance focuses on prions and methylation. However, both conclude that the genome is not a sufficient description of the organism. Distinguishing them requires deciding whether epigenetic marks are 'context' or 'code'. Since both require measuring beyond the sequence to predict phenotypes, the practical difference is merely terminological. The tree separates them logically, but experimentally, they demand the same data.
