  - **Bottom line**

  The package is untenable as stated. The single commitment doing the most damage is Commitment 5. It imposes a binary, singular ontology of personhood that directly contradicts the gradient, distributed ontology required by Commitments 2 and 3. You cannot maintain that you are literally distributed across multiple skulls while insisting that distinct running loops constitute distinct people. This forces a choice between the "Extended Mind" literalism and the "One Self" intuition. Without resolving this, the view collapses into either solipsism or Parfitian reductionism, both of which you explicitly reject.

  - **The audit**

  **2 vs. 5 (Distribution vs. Unity):** This is the metaphysical crash. Commitment 2 claims you are literally instantiated across multiple skulls. Commitment 5 states that "Two loops running are two people." If your pattern is running in multiple skulls, Commitment 5 dictates these are multiple people. Commitment 2 dictates this is one person (you). The mechanism of failure is the counting rule: 5 counts causal loops as persons, while 2 counts pattern fidelity as persons. To save 2, you must surrender 5's counting rule, admitting that one person can consist of multiple disjoint loops. Cost: You lose the "One Center" constraint, forcing you to accept a form of branching identity you explicitly disavow in 5. This undermines your claim that there is "one center of perspective," as distributed skulls necessarily entail multiple perspectives.

  **3 vs. 5 (Fading vs. Binary Existence):** This is the temporal crash. Commitment 3 claims you "persist, and fade unevenly," implying degrees of existence ("actual reduction in the extent of my pattern"). Commitment 5 denies "me-ness coming in degrees" when candidates compete. While 5 focuses on competition, the ontology of "fading" requires degrees of existence to make sense of "reduction." If existence is binary (loop runs or doesn't), you cannot fade; you can only lose carriers. The mechanism of failure is the metric of survival: 3 requires a continuous metric of extent, while 5 requires a discrete metric of loop identity. To save 3, you must surrender 5's binary constraint. Cost: You move closer to Parfit, accepting that survival is a matter of degree, which undermines your claim in 5 that this gives "no reason to look forward to dying." If you fade, death is gradual, which changes the prudential stakes you wish to maintain.

  **6 vs. 7 (Privilege vs. Epistemic Access):** This is the epistemic crash. Commitment 6 grants your self-model constitutive privilege, making divergences defects in copies. Commitment 7 admits regions where you have no access, treating external models as evidence about *you*. The mechanism of failure is authority: if your sister's model accesses truths about you that your self-model cannot (7), her model cannot be answerable to yours in that region (6). If 6 holds, her model is wrong by definition where you are silent. If 7 holds, your self-model is not constitutively privileged. To save 7, you must surrender 6's global privilege. Cost: You lose the intuition that you are the ultimate authority on your own identity, making the "self" in "self-model" less special than the "pattern" in Commitment 1. This weakens the phenomenological hook of the view.

  **1 vs. 6 (Pattern Ontology vs. Self-Privilege):** Commitment 1 defines you as a pattern, nothing more. Commitment 6 elevates one sub-component (the self-model) to a constitutive authority over the whole pattern. The mechanism is mereological: why does the part settle the whole? If the pattern is distributed (2), the self-model is just one node. To save 1, you must surrender 6's elevation of the internal node. Cost: This reinforces the need to drop 6, democratizing the pattern's nodes. It forces you to treat your own self-conception as just another instantiation, subject to the same fidelity ranking as your sister's model in Commitment 4. This equalizes the epistemic status of all carriers, which is consistent with 2 but devastating to the intuitive authority preserved in 6.

  **4 vs. 5 (Fidelity vs. No Degrees):** Commitment 4 ranks carriers by fidelity. Commitment 5 denies degrees of "me-ness." If fidelity ranks how much of *you* is present, then "me-ness" comes in degrees. The mechanism is semantic: "Fidelity to the pattern" implies partial presence. "No me-ness coming in degrees" denies partial presence. To save 4, you must interpret fidelity as ranking *copies*, not *presence*. Cost: This weakens Commitment 3's claim that your extent is actually reduced. If fidelity only ranks copies, then your extent remains binary (present or absent), contradicting the literal fading in 3. You must choose between ranking carriers or ranking existence; you cannot do both without contradicting 5.

  - **False alarms**

  **1 vs. 4 (Physicalism vs. Fidelity):** This looks like a category error but isn't. Physicalism (1) denies nonphysical residues, while Fidelity (4) ranks physical instantiations. There is no tension because physical patterns can vary in complexity and accuracy without invoking dualism. The distinction is between *ontology* (what exists) and *evaluation* (how well it matches). A physicalist can consistently claim one physical state realizes a pattern better than another.

  **1 vs. 3 (Pattern vs. Death):** One might think pattern ontology requires binary cessation. However, patterns can degrade gradually. Commitment 3's "fading" is consistent with 1's physicalism because signal-to-noise ratios in physical systems can decrease continuously. The distinction is between *substrate failure* (binary) and *pattern integrity* (gradient). A brain can die instantly while the pattern persists in others, fading as they die. This is physically coherent.

  - **Repair options**

  **1. Drop Commitment 6 (Privilege):** Abandon constitutive privilege. Accept that external models have equal ontological standing where internal access fails. Cost: Low. It aligns with the distributed view of 2 and resolves the epistemic clash with 7. It damages the intuition of first-person authority but saves the core metaphysics. This is the cheapest fix.

  **2. Modify Commitment 5 (Allow Degrees):** Allow degrees of personhood. Accept that "me-ness" can come in degrees during distribution. Cost: High. It explicitly contradicts your anti-Parfitian stance in 5 and forces you to address the ethical implications of partial existence. It saves 2 and 3 but requires rewriting the identity theory.

  **3. Modify Commitment 2 (Retreat to Metaphor):** Claim distribution is representational, not literal instantiation. Cost: Highest. It gutted the "Extended Mind" thesis, reducing the view to a standard psychological claim about memory, losing the workshop's hook. It saves 5 but destroys the project's novelty.

  **Judgment:** Drop 6. It is the least integrated commitment and creates the most friction with the empirical claims of 7 and the distributed ontology of 2. It buys coherence without sacrificing the extended mind thesis.

  - **Cross-examination**

  1. "If you are distributed across skulls, and one carrier commits a crime, are you culpable?" (This forces you to explain moral agency across disjoint loops, which 5 forbids but 2 implies.)
  2. "If your pattern fades to 10%, are you 10% responsible for your promises?" (This targets the ethical consequences of the degrees of existence in 3 vs binary ethics.)
  3. "If your sister's model contradicts yours, why should we trust hers?" (This targets the unresolved authority conflict between 6 and 7, demanding a criterion for fidelity you haven't provided.)
