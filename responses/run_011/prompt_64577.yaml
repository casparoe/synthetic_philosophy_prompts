answer: |-
  Daniel Dennett's ladder of creatures is one of the most seductive taxonomies in contemporary philosophy of mind. It arranges cognitive agents into four rungs Darwinian, Skinnerian, Popperian, and Gregorian promising a neat history of increasing cleverness. We teach it because it feels right. Darwinian creatures let natural selection do all the work. Skinnerian creatures learn via reinforcement within a lifetime. Popperian creatures run internal simulations to select behaviors before acting. Gregorian creatures offload design into cultural artifacts and tools. But when I look closely at the structure, the rungs do not seem sorted by a single criterion. The first three introduce new selection mechanisms genes picking behavior, reinforcement picking it, then an internal model trying out options. The Gregorian rung is defined by something else entirely where the design work lives, out in culturally inherited artifacts rather than inside the animal. If I sort the tower strictly by selection mechanism, the Gregorian level seems to vanish, looking like nothing more than Popperian creatures with a much richer model. If I sort strictly by where the design lives, the Skinnerian and Popperian levels collapse into each other as internal processors. This suggests there are two separate axes smuggled into one ladder, and that is what makes the taxonomy feel both obvious and shaky at the same time. My proposal is to spend six months on half teaching release to disentangle these axes, determine whether the ladder is a genuine hierarchy or a conflated map, and establish where new entities like large language models actually land on the resulting geometry.

  The central question I intend to pursue is whether the Gregorian distinction marks a change in the type of selection mechanism or a change in the locus of cognitive design. This is not a rhetorical question it could genuinely come out either way. It might be that cultural transmission introduces a distinct evolutionary dynamic comparable to the shift from genetic to operant selection, validating the single ladder view. Or it might be that Gregorian creatures are simply Popperian agents embedded in a specific environmental niche of external scaffolding, which would suggest the taxonomy is actually a two-dimensional space defined by selection mechanism and design locus. Standard readings of the tower, including the ones that shrug and call it a heuristic, leave this question open because they rely on the intuitive progression of sophistication rather than structural consistency. By treating the ladder as a metaphor for smartness, commentators avoid the hard work of defining the necessary and sufficient conditions for each rung. This works fine for biology as we know it, but it breaks down when we encounter edge cases or artificial agents. If we cannot specify whether the fourth rung is about how agents think or where their thinking happens, we cannot reliably classify systems that think differently than humans. My project argues that this conceptual vagueness is not harmless it prevents us from understanding the cognitive status of non-biological systems.

  Over the six months of this leave, I will proceed in three phases of conceptual archaeology and case testing. During the first two months, I will conduct a close textual analysis of Dennett's original formulations and the primary commentaries that have stabilized the ladder in the literature. I will map every instance where the criteria for ascending a rung are defined, coding them for references to selection mechanisms versus references to the location of design resources. This will establish whether the conflation is explicit or merely implicit in the standard view. The second phase, covering months three and four, will move to comparative edge cases. I will examine biological examples that sit between the rungs, such as animals that build and revise external scaffolds like bowerbirds or octopuses but cannot inherit them culturally. If the ladder is unidimensional, these creatures should be impossible or unstable categories. If the ladder is two-dimensional, they should occupy a specific coordinate that the current taxonomy obscures. I will also look at human populations with limited cultural transmission but high internal modeling capacity to see if they regress down the ladder or simply shift axes. This comparative work is philosophical rather than empirical I will not be running experiments but rather analyzing existing ethological data through the lens of the revised taxonomy.

  The fifth month will be dedicated to the stress test that motivated this inquiry the status of large language models. Current discourse oscillates between calling AI a mere tool and calling it a new kind of agent. By applying the separated axes, I aim to locate LLMs precisely. If the Gregorian rung is about externalized design, LLMs are the ultimate Gregorian artifact, containing the compressed design work of vast cultures. But if the Gregorian rung requires a specific type of selection mechanism involving cultural inheritance within a lineage of agents, LLMs might not qualify as Gregorian creatures at all, but rather as Gregorian environments for human users. Alternatively, if the axes separate, an LLM might be a Popperian simulator running on Gregorian hardware. Resolving this matters because it determines whether we treat AI as a subject of cognitive science or an object of engineering. The final month will be devoted to synthesizing these findings into a draft paper that proposes the corrected taxonomy. I will aim to produce a manuscript suitable for submission to a journal in philosophy of biology or cognitive science, arguing for the two-axis model and demonstrating its utility for classifying both biological and artificial agents.

  This approach beats the obvious alternatives for specific reasons. One alternative would be to bolt on a fifth creature to accommodate AI, perhaps an AIan creature. This is ad hoc and preserves the structural error of the original ladder rather than fixing it. It assumes the problem is capacity rather than category. Another alternative would be to hand the whole thing over to comparative cognition and let empirical data decide. But the problem here is not a lack of data it is a lack of conceptual clarity. No amount of animal behavior data will tell us whether culture counts as a selection mechanism unless we first define what counts as a mechanism in this context. Philosophy must clear the ground before psychology can build on it. My approach respects the division of labor by doing the conceptual repair work required to make the empirical questions askable.

  A successful result would look like a clear diagram replacing the ladder with a coordinate system, showing where humans, tool-using animals, and AI sit relative to one another. It would demonstrate that the feeling of a missing rung is actually a feeling of a missing dimension. Success also means providing a definitive account of where LLMs land, moving beyond the hype cycle to a structural classification. The project would count as having failed if I cannot find a consistent way to separate the axes, or if the two-dimensional model proves too complex to be useful compared to the heuristic ladder. If the end result is that the ladder is simply too messy to save and should be discarded entirely, that is also a valid outcome, though it would require arguing for a replacement framework rather than just dismantling the old one.

  I must be honest about what is too ambitious for the time available. I will not be solving the hard problem of consciousness or defining the nature of intentionality. This project is about taxonomy and mechanism, not phenomenology. I will also not be conducting original empirical research with animal subjects or training new models. I am limited to analyzing existing descriptions and behaviors. Furthermore, I cannot guarantee that the two-axis model will be the final word it may be that there are three axes, or that the dimensions are not orthogonal. The goal is to show that the current one-dimensional view is insufficient and to provide a workable alternative that withstands the pressure of artificial intelligence. By the end of the six months, I intend to have a clear argument that explains why the ladder feels right but fails under scrutiny, and a robust classification system that can handle the next century of cognitive science rather than just the last one. This leave would allow me the uninterrupted time to think through these structural issues without the fragmentation of the teaching semester, ensuring that the resulting work is rigorous enough to reset the terms of the debate.
