answer: |-
  I recommend that we adopt the Kalai–Smorodinsky rule for this cycle's allocation, subject to an explicitly stated restriction on how the ideal points and breakdown positions are to be computed. Specifically, I propose that we define the ideal point for each partner as the maximum workload that can be physically executed on the available cluster within the allocation year, supported by verified and encumbered funding, and that we define the breakdown position as the compute throughput available to the partner outside the institute, normalized by the ratio of the institute's marginal cost to the external provider's marginal cost. Applied to this year's submissions, this restriction would cap the genomics center's ideal point at one hundred percent of the cluster's total capacity rather than the four hundred percent they claimed, exclude the hospital's defunded workload from their ideal calculation, and discount the hospital's commercial cloud throughput by a factor of three to reflect its higher marginal cost relative to our institute hardware. This approach preserves the theoretical advantages of the Kalai–Smorodinsky solution while preventing the formula from being driven by fictions that neither partner expects to realize.

  We moved toward this rule because we recognized a fundamental flaw in the Nash bargaining solution for our specific context. The Nash solution satisfies independence of irrelevant alternatives, meaning it ignores the shape of the feasible set beyond the immediate frontier, but this comes at the cost of monotonicity. In plain terms, under a Nash regime, a partner whose scientific opportunities genuinely expand can paradoxically receive a smaller allocation because the solution maximizes the product of gains rather than equalizing the proportion of potential gained. We want a system where expanding capacity or capability does not penalize the partner with the growth, which is the core virtue of Kalai–Smorodinsky. However, that virtue relies on the ideal point representing a genuine ceiling of possibility rather than a strategic aspiration. If we adopt the rule as written without restricting the inputs, we invite the very gaming behavior we sought to eliminate by replacing haggling with a formula. The genomics center's claim of a utility ceiling premised on a project that requires four times our physical capacity and lacks funding is not a bound on their potential within this institute; it is a signal of ambition that belongs in a strategic plan, not an allocation arithmetic. Similarly, the hospital's inclusion of defunded workload inflates their ideal point without representing a feasible demand on our shared resource. If we allow these figures to stand, the Kalai–Smorodinsky line stretches toward these fictional utopias, distorting the intersection with the Pareto frontier. Under the unrestricted rule, the genomics center's inflated ideal point would pull the solution toward them, attempting to counterbalance the hospital's advantage, but the calculation would rest on numbers we all know to be false.

  The second complication regarding the breakdown position is more substantive because the asymmetry is real, even if the accounting is debatable. The hospital does hold a commercial cloud contract that functions as a credible threat point; if negotiations fail, they have compute, and the genomics center does not. Taken literally, this gives the hospital a high floor, meaning the surplus to be divided is smaller, and since the Kalai–Smorodinsky solution equalizes the proportion of the surplus gained, the partner with the higher floor naturally commands a larger share of the total resource. If we accept the hospital's cloud throughput at face value, the arithmetic suggests the hospital would secure approximately seventy-five percent of the cluster capacity before we even consider the ideal points, simply because their disagreement utility is so much higher than the genomics center's zero. However, this ignores the economic reality that the institute exists to subsidize compute costs for both partners. The hospital's contract delivers sixty percent of the throughput at three times the marginal cost of our cluster. To treat that external capacity as equivalent to institute capacity is to value the partners' funds unequally. By normalizing the breakdown position to the institute's marginal cost, we acknowledge the hospital's prudence in securing a backup without allowing that external subsidy to dominate the allocation of the joint asset. Under my proposed restriction, the hospital's breakdown value drops significantly, likely shifting the final split from that seventy-five percent dominance down to something closer to fifty-five percent in their favor, reflecting the genuine asset they hold without letting it swallow the joint enterprise.

  I anticipate that some of you will argue that we should abandon the rule entirely for this cycle and revert to haggling or switch to the Nash solution, and I want to state the strongest case for that position before we vote. The honest argument against my proposal is that restrictions introduce bureaucracy and subjectivity where we wanted clarity. A colleague has already noted that the Nash solution would not budge if we change the ideal points, as it is independent of irrelevant alternatives. Furthermore, one could argue that the hospital's cloud contract is a testament to their administrative competence and should be rewarded fully; by discounting it, we are effectively penalizing them for not relying on the institute as a single point of failure. Similarly, capping the genomics center's ideal point punishes them for planning at a scale larger than our current infrastructure, which might discourage the very ambition we hope to support. If we adopt the Nash solution instead, we avoid the fight over what constitutes a feasible ideal point entirely, and we avoid the fight over how to value the cloud contract, because the Nash solution focuses only on the feasible frontier and the disagreement point without referencing the utopia point. If we value stability and ease of calculation over the monotonicity property, Nash is the safer harbor for this year.

  However, I reject that path because it surrenders the principle we established when we formed this committee, which is that allocation should track proportional opportunity. The Nash solution's insensitivity to the ideal point is a feature only if the ideal point is irrelevant, but we decided it was relevant when we chose to discuss Kalai–Smorodinsky. We want the partner with more feasible work to get more compute, provided the other partner is treated fairly relative to their own potential. The risk of the Nash solution leaving a partner worse off when their opportunities expand is not a theoretical curiosity for us; it is a likely scenario given the volatility of genomic data volumes and clinical trial enrollments. Regarding the hospital's cloud contract, rewarding competence is appropriate, but the institute's mandate is to equalize the cost of computation, not to amplify the advantage of those who can afford commercial rates. If we allow the breakdown position to be calculated at market value, we are effectively allowing the hospital to spend clinical revenue to buy a larger share of the institute's subsidized resources, which undermines the joint nature of the ownership. Therefore, the restricted Kalai–Smorodinsky rule is the only option that honors our original intent while correcting for the specific distortions in this year's submissions. I ask that you support the adoption of the rule with the restrictions on feasibility and cost-normalization as I have described them, so that we may approve an allocation based on the reality of our capacity and the equity of our partnership rather than the fiction of our wish lists.
