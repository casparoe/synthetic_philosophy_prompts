answer: |-
  ### The Case: Municipal Flood Defense District

  The District offers homeowners a subsidy program. An inspector visits each home to assess "Cooperativeness"—the likelihood the owner will sandbag if a flood occurs. This assessment is sealed. Next, a public lottery draws either "Dry" (50%) or "Flood" (50%). If **Dry**, the homeowner receives a $1,000 subsidy if and only if the assessment rated them "Cooperative." If **Flood**, the homeowner must choose whether to sandbag (Cost: $300) or let water in (Cost: $0). The inspector predicts actual sandbagging behavior with 80% accuracy. The assessment is revealed to the homeowner after the lottery draw but before sandbagging decisions.

  ### The Arithmetic

  | Policy | Inspector Prediction | Prob. Dry & Benefit | Prob. Flood & Cost | Expected Utility |
  | :--- | :--- | :--- | :--- | :--- |
  | **Sandbag if Flood** | "Cooperative" (80%) | 0.5 × 0.8 × $1,000 = $400 | 0.5 × 1.0 × $300 = -$150 | **$250** |
  | **Don't Sandbag** | "Uncooperative" (80%) | 0.5 × 0.0 × $1,000 = $0 | 0.5 × 1.0 × $0 = $0 | **$0** |

  ### Analysis

  **1. Three Moments and Conditioning**
  *   **Moment 1 (Pre-Lottery):** UDT and Updateful (CDT/EDT) **coincide** on valuation: both agree the "Sandbag" policy has higher expected utility ($250 vs $0). They diverge on implementation: UDT recommends adopting the policy resolutely; Updateful agents plan to sandbag but intend to defect later.
  *   **Moment 2 (Post-Lottery, Pre-Assessment):** You know you are in the "Flood" arm. UDT recommends sandbagging. Updateful reasoning recommends defecting: the subsidy is already determined by the past assessment; the cost is future and avoidable.
  *   **Moment 3 (Post-Assessment, Pre-Action):** You see "Predicted: Cooperative." UDT still recommends sandbagging to fulfill the policy. Updateful reasoning still recommends defecting; the prediction is sunk, and action cannot change it.
  *   **Lesson:** Updatelessness is not a refusal to condition on news generally, but a refusal to condition on **indexical news** (which arm of the lottery obtained) that screens off the logical correlation between your policy and the payoff in the counterfactual arm.

  **2. Decision vs. Character**
  At Moment 1, the agent is choosing a **disposition**, not a specific act. If dispositions are psychologically fixed before the inspector arrives, Updateless reasoning recommends having cultivated the compliant disposition *prior* to the interview. If nothing is choosable at Moment 1, UDT ceases to be a theory of momentary decision and becomes a theory of **rational character formation**: it identifies which character type wins across the lottery distribution, even if the current token of that type cannot revise itself.

  **3. The Structural Feature**
  The work is done by **payoff dependency on predicted disposition in a counterfactual branch**. The benefit in the Dry arm depends on what you *would* do in the Flood arm. If you delete this feature (e.g., the subsidy is random, or based on actual sandbagging in the Flood arm), UDT and CDT verdicts converge immediately. The correlation between the counterfactual action and the actual reward is the engine.

  **4. The Precommitment Objection**
  The "just bind yourself early" redescription fails because **no external enforcement mechanism exists**. There is no contract, audience, or reputation stake. The "binding" is purely internal. Updateful theory dictates that internal binding is irrational once the cost arises (Moment 2), whereas UDT dictates that the binding *is* the rational act of policy selection. Without external enforcement, the updateful agent cannot physically stop themselves from defecting, making the "precommitment" description empty.

  **5. Resemblance and Instantiation**
  This is a institutional **Counterfactual Mugging**. The realistic instantiation buys **plausibility of prediction**. By replacing Omega with a competent human inspector (80% accuracy), it demonstrates that UDT does not require metaphysical logical necessity or perfect prediction to generate a divergence; it only requires a correlation strong enough to outweigh the local cost, which is common in insurance and grant contexts.

  **6. Strongest Updateful Objection**
  **Objection:** "Your agent is being asked to pay $300 for a benefit that is already closed (the Dry arm didn't happen), which is a sunk-cost error dressed up as insight."
  **Response:** Concede that it looks like a sunk cost from within the arm. However, the payment is not *for* the benefit in this world; it is the **truth-maker** for the assessment that awarded the benefit in the counterfactual world. Updatelessness survives as the claim that rationality evaluates the policy across all worlds, not the action in the actual one. If you refuse this, you must admit you would have been irrational at Moment 1 to hope for the subsidy.
