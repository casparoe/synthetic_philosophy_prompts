answer: |-
  The seniors on the Student Safety Committee accept the police department's crime statistics without question because they've never seen the raw data, assuming the summary charts are complete. However, they reject the administration's official reports on student disciplinary incidents because last semester the Principal reclassified a fight as an "accident" to lower suspension rates, a fact confirmed by leaked emails. When the school attempts to correct both misconceptions by inviting an outside auditor to present both datasets at a town hall, the committee readily accepts the crime statistics, realizing their previous view was based on missing information. But regarding the disciplinary data, the auditor's presence backfires; because the auditor was contracted by the administration, the committee views the validation as purchased credibility, prompting them to rely even more exclusively on their own encrypted group chat to verify facts, deepening their distrust of outside sources on that specific issue while remaining open on the other.

  ***

  ### Show Your Work

  **1. The Two Topics and Structures**
  *   **Topic A (Crime Statistics):** This is an **epistemic bubble**. The structural feature is *absence*. The students lack the raw data simply because it hasn't been shared or sought out; there is no active mechanism rejecting the police data, just a gap in their network.
  *   **Topic B (Disciplinary Reports):** This is an **echo chamber**. The structural feature is *active discredit*. The students have seen the reports but dismiss them based on a systemic rule: "Administration data is manipulated." This rule was formed by evidence (the reclassified fight), making the distrust rational rather than paranoid.

  **2. The Intervention and Backfire**
  *   **Intervention:** The administration uses the standard cure for misinformation: provide an authoritative third-party source (the outside auditor) to present the facts on both topics.
  *   **Step 1:** The auditor presents crime stats. The committee has no prior reason to distrust the police or the auditor on this specific issue. The bubble pops; they update their beliefs.
  *   **Step 2:** The auditor presents disciplinary data. The committee checks the auditor's provenance.
  *   **Step 3:** They note the auditor is paid by the administration. They recall the past manipulation (the reclassified fight).
  *   **Step 4:** They conclude the auditor is part of the management strategy.
  *   **Result:** On Topic B, the intervention validates their distrust. By trying to fix the information gap with a source they are structured to reject, the administration confirms the students' belief that outside validation is rigged. They retreat further into their private chat, tightening the echo chamber.

  **3. The Key Feature**
  *   **Feature:** *Topic-Specific Earned Distrust.* The students aren't generally anti-authority; they are specifically anti-administration on disciplinary matters because of a verified past event.
  *   **If Deleted:** If you remove the past event (the reclassified fight), the distrust loses its evidentiary basis. The scenario collapses back into an ordinary **epistemic bubble** on both topics. The students would treat the auditor as a neutral source for both datasets, and the "cure" would work for both. The echo chamber effect exists *only* because the structure includes a rule for dismissing specific sources based on specific history.

  **4. The Motivated Reasoning Objection and Defense**
  *   **Objection:** A critic would argue this isn't about structure at all. They would say the students simply *want* to feel like whistleblowers on discipline (it makes them feel important) and *want* to feel safe on crime (it reduces anxiety). Therefore, they accept or reject data based on emotional comfort, not structural rules. The "echo chamber" is just a fancy word for "what they want to believe."
  *   **Defense:** If this were purely motivated reasoning, the students would react to the auditor based on the *conclusion* of the data, not the *source*. If the auditor found high discipline rates, motivated reasoning suggests they would accept it (confirming the admin is harsh) or reject it (if they want to protect the school). Instead, they reject the data *regardless of the content* because of the *source's relationship to the admin*. The fact that they accept the auditor's crime data (where they have no emotional stake in the admin's reputation) while rejecting the discipline data (where they do) from the *same speaker at the same time* proves the filtering is structural. They are following a rule about information provenance, not just chasing emotional comfort.
