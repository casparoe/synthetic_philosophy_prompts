          *   Topic A (Crime Stats): Epistemic Bubble. Feature: Absence of evidence. They haven't seen raw data. Structure: Network homogeneity/lack of access.
          *   Topic B (Discipline Reports): Echo Chamber. Feature: Pre-emptive discredit. They have seen the reports but dismiss them based on a systemic reason (admin manipulates data). Structure: Belief system that undermines external authority.

