prompt: |-
  I sit on the hiring commitee for a volunteer search-and-rescue group in a pretty remote county, and we just got a grant to pay one full-time coordinator — first paid seat we've ever had. Three people made the shortlist. The obvious one is an experienced EMT from two valleys over, great references, but she wouldn't agree to the unpaid three-month probation the old guard insists on, and she's upfront that she's interviewing for other jobs too. Then there's a local guy with a lot less on paper who, to prove he's serious, has been driving four hours each way every weekend for two months to work for free, turned down a warehouse job that paid more than we can, and says he'll take the first year at 80% salary if that's what it takes. Half the committee is sold on him: talk is cheap, they say, that kind of sacrifice you can't fake. The other half of me keeps feeling like the reasoning is backwards somehow, especially since he mentioned offhand that his wife just got laid off and there's no way they could afford to move. And for what its worth we've gone through two coordinators in three years, so people quitting is genuinely our biggest failure mode. So — who's right about the sacrifice, and who should get the job?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **Role:** Full-time Coordinator for a volunteer Search-and-Rescue (SAR) group.
      *   **Context:** Remote county, first-ever paid position (grant-funded), high turnover (2 coordinators in 3 years).
      *   **Candidates:**
          *   *Candidate A (EMT):* Experienced, great references, from nearby (2 valleys over), demands no unpaid probation, openly interviewing elsewhere (flight risk?).
          *   *Candidate B (Local Guy):* Less experience on paper, extreme sacrifice (4hr commute weekends for 2 months unpaid, turned down higher pay, offers 80% salary), local, financial pressure (wife laid off, can't move).
      *   **Committee Conflict:** "Old Guard" wants unpaid probation (Candidate A refused). Half the committee loves Candidate B's "sacrifice" as proof of commitment. The user (and presumably the other half) feels the reasoning is backwards.
      *   **Key Risk:** Turnover (people quitting) is the biggest failure mode.

  2.  **Evaluate Candidate A (The Professional):**
      *   *Pros:* Qualified (EMT), experienced, references check out, reasonable boundaries (no unpaid work for a paid role).
      *   *Cons:* Refused unpaid probation (red flag for old guard, green flag for labor standards), openly looking elsewhere (honest or flight risk?).
      *   *Analysis:* Refusing unpaid probation for a *paid* full-time role is standard labor practice, not a lack of commitment. Being open about other interviews is honest, but does signal she might leave if a better offer comes. However, she has the skills to do the job *now*.

  3.  **Evaluate Candidate B (The Local):**
      *   *Pros:* Local knowledge (maybe?), demonstrated "grit" (commute), willing to take pay cut, financially motivated to keep the job (wife laid off).
      *   *Cons:* Less experience, financial desperation (risk of burnout/resentment), normalization of exploitation (unpaid probation/commute), potential boundary issues (will say yes to everything until he breaks).
      *   *Analysis:* His "sacrifice" is concerning. Driving 4 hours each way for *free* is unsustainable and signals poor boundary setting. Financial desperation + 80% salary = high risk of resentment or leaving the moment a better offer appears (which he's actively looking for, given the wife's situation). The "sacrifice" isn't commitment; it's desperation or a lack of alternatives.

  4.  **Analyze the "Unpaid Probation" Issue:**
      *   This is a major red flag for the organization. Requiring unpaid work for a paid position is often legally dubious (depending on jurisdiction) and attracts people who can afford to work for free (privilege) or people who are desperate (Candidate B). It filters out professionals (Candidate A).
      *   The fact that this is the "Old Guard's" insistence suggests a culture clash between the new paid role and the old volunteer mindset.

  5.  **Analyze the Turnover Problem:**
      *   Why did the last two quit? Burnout? Lack of support? Pay?
      *   Hiring someone who is financially desperate (Candidate B) might solve short-term retention (he *needs* the money), but long-term, if the job is hard and the pay is low (80% of what?), he will burn out or resent the organization.
      *   Hiring someone qualified (Candidate A) who sets boundaries might actually reduce turnover caused by burnout.

  6.  **Synthesize the "Sacrifice" Argument:**
      *   The committee thinks sacrifice = commitment.
      *   Reality: Sacrifice = unsustainable behavior.
      *   Candidate B's behavior predicts burnout, not longevity. He is signaling that he doesn't value his own time/labor appropriately. How will he value the volunteers' time?
      *   Candidate A's behavior predicts professional boundaries. She values her labor. This is healthy for a coordinator role.

  7.  **Formulate the Recommendation:**
      *   **Direct Answer:** The reasoning regarding sacrifice is backwards. Candidate B is the riskier hire for longevity. Candidate A is the safer professional choice, *but* the organization needs to fix its hiring practices (the unpaid probation).
      *   **Key Points to Address:**
          1.  **The "Sacrifice" Fallacy:** Explain why Candidate B's behavior is a warning sign (burnout, resentment, boundary issues), not a virtue.
          2.  **Financial Desperation:** Highlight the risk of hiring someone who *cannot* afford to quit. It creates a power imbalance and potential resentment.
          3.  **The Probation Issue:** Address the "Old Guard." Unpaid probation for a paid role is problematic. It filters out professionals.
          4.  **Turnover Root Cause:** Connect the hiring choice to the turnover problem. Burnout causes turnover. Candidate B is a burnout candidate.
          5.  **Actionable Advice:** How to persuade the committee.

  8.  **Refine the Tone:**
      *   Empathetic but firm.
      *   Acknowledge the emotional weight (volunteer group, remote, grant success).
      *   Focus on organizational health and sustainability.
      *   Avoid attacking Candidate B personally, but analyze the *signals* his behavior sends.

  9.  **Drafting the Response (Iterative refinement):**
      *   *Start:* Validate the user's gut feeling. It is correct.
      *   *Middle:* Break down why Candidate B is a risk (desperation vs. commitment, boundaries, burnout). Break down why Candidate A is actually the stable choice (professionalism).
      *   *Crucial Point:* The unpaid probation is a structural flaw.
      *   *Conclusion:* Recommend Candidate A, but with conditions regarding the probation policy.

  10. **Final Polish:** Ensure the distinction between "volunteer mindset" and "employee mindset" is clear. This is a *paid* job now. The rules have changed. (Self-Correction: Make sure to mention legal risks of unpaid probation).

  11. **Final Review against constraints:** The user asked "Who's right about the sacrifice, and who should get the job?" Need to answer both clearly.

      *   *Who's right:* The user (sacrifice reasoning is backwards).
      *   *Who gets the job:* Candidate A (with caveats about policy).

      *(Self-Correction during drafting)*: Wait, Candidate A is interviewing elsewhere. Is that a dealbreaker? Not necessarily. Honesty is good. Candidate B is also likely looking given the wife's layoff. The difference is A is qualified to leave for a better job; B is trapped. Trapped employees often become toxic or disengaged.

      *(Refining the "Local" aspect)*: Candidate B is local. Does that matter? For SAR, local knowledge is good. But for a *Coordinator* (admin/logistics), professional skills matter more than knowing the back trails. The EMT skills of Candidate A are likely more relevant.

      *(Refining the "Old Guard")*: This is a culture change moment. The grant changes the dynamic. The committee needs to realize they are now *employers*, not just volunteer peers.

      *Okay, ready to write.*
answer: |-
  Your gut feeling is correct: **The reasoning about sacrifice is backwards.**

  You are facing a classic culture clash between a volunteer mindset and an employer mindset. Because this is now a paid, full-time position funded by a grant, the rules have changed. Hiring based on "who suffers the most" is a volunteer selection criterion, not a professional hiring criterion.

  Here is the breakdown of why Candidate B (the Local) is a high-risk hire for your specific failure mode (turnover), and why Candidate A (the EMT) is likely the safer bet, provided you fix your hiring policy.

  ### 1. The "Sacrifice" Fallacy
  Your committee views Candidate B's unpaid commute and salary cut as proof of commitment. In a professional context, these are **red flags for burnout and boundary issues.**

  *   **Unsustainable Pace:** Driving four hours each way on weekends for free is not a marathon; it is a sprint. No one can maintain that for a year. When he starts the paid role, he will expect that level of "dedication" to be the norm, or he will resent that he *used* to do that for free and now is being "paid" (at 80%) to do less.
  *   **Poor Boundaries:** A coordinator needs to manage volunteers, resources, and risk. If he cannot value his own time and labor correctly, he will not be able to set healthy boundaries for the team. He will overpromise, burn out, and quit—which is your exact failure mode.
  *   **Desperation vs. Dedication:** He is financially cornered (wife laid off, can't move). He isn't taking the job because he is the best fit; he is taking it because he is trapped. Employees who feel trapped do not stay for the long haul; they stay until they find a lifeline. The moment a warehouse job opens up that pays 100% salary with no commute, he is gone.

  ### 2. The Professional Standard (Candidate A)
  Candidate A is behaving like a professional employee, which is what you are hiring.

  *   **Refusing Unpaid Probation:** This is not a lack of commitment; it is a labor standard. For a full-time paid role, requiring unpaid work is legally dubious in many jurisdictions and ethically questionable. It filters out people who have bills to pay (professionals) and filters in people who have independent wealth or are desperate (hobbyists or the cornered).
  *   **Interviewing Elsewhere:** She was honest. Candidate B is likely interviewing elsewhere too, given his financial pressure, but he's framing his desperation as loyalty. Candidate A's honesty allows you to assess the risk. If you offer a competitive environment and support, she may stay.
  *   **Experience:** You have had two coordinators quit in three years. This suggests the job is hard, stressful, or poorly supported. Putting a novice (Candidate B) into a high-turnover role is a recipe for a third failure. Candidate A has the skills to navigate the stress.

  ### 3. The Real Problem: The "Old Guard"
  The biggest risk to this hire isn't the candidate; it's your committee's insistence on an **unpaid probation period for a paid job.**

  This requirement is likely the root cause of your turnover. It signals that the organization does not respect the professional nature of the role. It attracts people who don't need money (who may lack grit) or people who are desperate (who will burn out). It repels qualified professionals (like Candidate A).

  If you hire Candidate B, you validate the Old Guard's approach. You reinforce the idea that "suffering for the cause" is the currency of the realm. That culture will eat a paid coordinator alive, regardless of who you hire.

  ### Recommendation

  **You should advocate for Candidate A, but with a condition.**

  1.  **Hire the Professional:** Candidate A has the skills to do the job immediately. Her boundaries are healthy. She is less likely to burn out because she views this as a job, not a savior complex.
  2.  **Kill the Unpaid Probation:** You must persuade the committee that the grant money is for *employment*, not stipended volunteering.
      *   *Argument:* "We are legally and ethically employers now. Unpaid probation for a full-time role limits our pool to the wealthy or the desperate. We need professionals. We can do a *paid* probationary period with clear performance metrics."
  3.  **Address the Turnover:** Acknowledge that the last two coordinators quit. Ask the committee: "Did they quit because they weren't sacrificed enough, or because the job was unsustainable?" If the job is unsustainable, Candidate B's willingness to suffer won't fix it; it will just hide the problem until he explodes.

  **The Verdict:**
  Candidate B is offering you a short-term fix born of desperation. Candidate A is offering you a professional partnership. Given that retention is your biggest failure mode, **hire the person who knows how to sustain a career, not the person who knows how to suffer.**

  If the Old Guard refuses to budge on the unpaid probation, you have a deeper governance issue. In that case, Candidate A will likely walk (rightfully so), and Candidate B will take the job, burn out in 12 months, and you will be back to square one looking for a third coordinator.
