      *   *Situation in 1970:* The notebooks are public. It is now established historical fact that the evidence existed *before* the hypothesis was formulated. The 1961 adjustment to the protective belt was not predicting something unknown; it was accommodating something already known (even if privately). It functions as an *ad hoc* adjustment to save the core from known anomalies (if the rivals had spoken up) or simply fitting existing data. Verdict: Degenerating (or at least, the specific shift loses its progressive status).
      *   *The Crux:* The physical reality of the ice didn't change. The mathematical model didn't change. Only the epistemic status of the data relative to the community changed. Lakatos's criterion relies on the *context of discovery* relative to public knowledge, not just the *context of justification*.

