      *   *Progressive Shift:* Theoretical progress (new content) + Empirical progress (some new content is corroborated).
      *   *Novelty:* Crucial for empirical progress. A prediction is novel if it wasn't used to construct the hypothesis.
      *   *The Tension:* Is novelty logical (improbability) or historical (temporal priority)? Lakatos often leans towards temporal novelty to avoid ad hoc accusations, but acknowledges the logical aspect.

