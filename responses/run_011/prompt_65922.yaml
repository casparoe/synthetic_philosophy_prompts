      *   *My stance:* The "paperwork" dependency is actually a feature, not a bug, of a methodology that views science as a rational reconstruction of history. However, the flip-flop (progressive then degenerating) is problematic for a realist view of progress. A better criterion is **use-novelty** (the data wasn't *used* to construct the theory) rather than **time-novelty** (the data didn't *exist* publicly).
