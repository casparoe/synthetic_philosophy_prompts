answer: |-
  On Lakatos's criteria, your assessment of the glaciology case is correct: the programme oscillates between progressive and degenerating solely due to the public status of the data, not the scientific content. To see why, we must look at how Lakatos distinguishes a progressive problemshift from a degenerating one. A shift is progressive if it predicts novel facts. If it merely accommodates known facts, it is ad hoc and degenerating. The definition of "novel" is the pivot point.

  In 1963, the scientific community's background knowledge includes the published 1963 paper but excludes the private 1959 notebooks. From the perspective of the community, the 1961 auxiliary hypothesis anticipated a fact that was not part of the established empirical baseline. The prediction was temporally novel. The protective belt adjustment yielded empirical content that was corroborated by independent evidence. By the 1963 standard, the programme is progressive; it is growing and risking refutation.

  In 1970, the notebooks enter the public domain. The historical record now shows the fact existed prior to the hypothesis. Under Lakatos's strict temporal criterion, the 1961 adjustment is no longer a prediction; it is an accommodation of pre-existing evidence. Even if the theorist did not know about the notebooks, the fact was "out there" in the world, recorded. The adjustment now looks like a maneuver to save the hard core from a known anomaly (had the rivals spoken up). The empirical content is no longer novel; it is old wine in new bottles. The programme shifts from progressive to degenerating. The ice, the math, and the theory remain identical; only the archival status of the rival's data has changed.

  This leads to the stronger claim: this instability is not an edge case but a structural feature of tying novelty to the history of paperwork. Lakatos attempts to objectify scientific rationality by anchoring it in the public record. He wants to avoid psychologism—guessing what a scientist knew or intended—so he relies on publication dates as a proxy for "background knowledge." But this makes the rationality of a theory contingent on the sociology of publication and the accidents of archival discovery.

  If progress depends on temporal novelty relative to public records, then scientific rationality becomes relative to the efficiency of the library. A theory could be progressive in a decade with slow publishing and degenerating in a decade with open pre-print servers, even if the logical relationship between theory and evidence is identical. It implies that a scientist can make a programme degenerate simply by digging up an old notebook, without running a single new experiment or proposing a competing theory. This reduces methodology to historiography. It suggests that the "truth" of a research programme's progressiveness is not a property of the relation between theory and nature, but a property of the relation between theory and the current state of the archives.

  Should a Lakatosian bite this bullet? No. Accepting that scientific progress is retroactively unstable undermines the normative force of the methodology. If we cannot judge a programme as progressive or degenerating until all private notebooks are public, methodology cannot guide current scientific practice. It becomes merely a tool for historians to categorize the past.

  The better path is to swap the criterion from *temporal novelty* to *use-novelty*. A fact is novel if it was not *used* in the construction of the hypothesis, regardless of whether it existed in a drawer somewhere. In the glaciology case, the 1961 theorist could not have used the 1959 data because it was inaccessible. The risk was real. The theorist stuck their neck out into the unknown. The subsequent discovery of the notebooks changes the history of the rival group, but it does not change the epistemic risk taken by the proponent.

  Use-novelty is superior because it tracks the heuristic power of the hard core rather than the administrative history of the field. It asks: did the theory generate this fact, or was the fact used to generate the theory? This preserves the progressive status of the glaciology programme in 1970. The adjustment was not ad hoc because it was not tailored to fit known data; it was derived from the positive heuristic of the programme. This decouples progress from the paperwork problem. It acknowledges that science is a social activity, but it locates rationality in the causal link between hypothesis and evidence, not the timestamp on the envelope. By adopting use-novelty, the Lakatosian saves the methodology from becoming a slave to the archives while retaining the core insight that predicting the unknown is more valuable than explaining the known.
