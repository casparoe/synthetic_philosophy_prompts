  The committee will almost certainly inscribe the blessing of the salt pans.

  The closest analogue is the fishing fleet blessing, as both involve an industrial ritual surviving the closure of the underlying industry through the agency of descendants and former workers. The strain in this analogy is that the fishing tradition lapsed for forty years before revival, whereas the salt pans have been held continuously since 1953; this uninterrupted continuity should theoretically strengthen the salt pans' case, provided the committee views the post-1988 community takeover as genuine transmission rather than mere preservation. The harvest supper is a secondary analogue regarding the mid-twentieth-century origin date, but the salt pans differ in that their invented nature is publicly documented and contested rather than vaguely acknowledged in minutes.

  Regarding your candidate rules, four of them vote to inscribe while only one implicit rule votes to refuse. The documentation-date rule votes to inscribe because 1953 predates the refused 1974 weaving revival and 2006 miners' procession, aligning instead with the inscribed 1897 bonfire and 1930s supper. The same-community-carries-it rule votes to inscribe because the organisers are ex-workers and families residing in the town, distinguishing them from the miners' organisers who lived forty miles away. The sincerity rule votes to inscribe because the practice is described as the town's identity rather than a performance about a community, mirroring the harvest supper's acceptance. The outsiders-and-money rule votes to inscribe because the collection goes to a local hospice and the event is locally run, avoiding the 'heritage charity' marker that doomed the miners' bid. The only rule voting to refuse is an unspoken 'authenticity-of-origin' rule, triggered by the 2011 exposure of the 1953 fabrication and the 'fake archaic English'; however, the fishing fleet precedent suggests that revival by insiders outweighs origin issues, and the harvest supper precedent suggests that the community's own narrative (even if it admits a later start) is sufficient.

  Reframing the application is unlikely to change the outcome because the facts of the 1953 origin and the 2011 controversy are matters of public record that the committee could easily verify; attempting to obscure them would risk damaging the 'sincerity' criterion. The current framing of 'community resilience' is the strongest possible argument, as it aligns with the harvest supper's acceptance of the community's account of its past as part of the practice itself. Hiding the date would invite suspicion, whereas owning the 1953 start date leverages the continuity rule (70 years of unbroken practice) against the authenticity rule.

  There is a coherent principle hiding in their rulings, but it is not historical authenticity in the Hobsbawmian sense; it is endogenous agency. The committee distinguishes not between 'real' and 'invented' traditions—as you suspect, they likely recognise all traditions are invented—but between practices adopted and sustained by the community versus those imposed upon or performed about them. The bonfire, harvest, fishing fleet, and salt pans were all adopted organically by the participants who continue them, whereas the weaving was a reconstruction from static records and the miners' procession was an external imposition on a defunct community. By inscribing the salt pans, the committee would be adopting the principle that a tradition's validity rests on its current function as a vessel for community identity and intergenerational transmission, regardless of whether its origins are ancient or engineered, provided the community itself holds the keys to the practice.
