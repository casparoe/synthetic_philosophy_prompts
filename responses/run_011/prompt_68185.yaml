answer: |-
  The principle you are looking for does not exist as a single, unified rule. Your unease is not a failure of articulation; it is a correct perception that you are playing two different games with different rules. Your verdicts split cleanly into two normative frames: **Truth/Responsibility** (Cases 1–6, 8–9) and **Solvency/Pooling** (Case 7).

  To give you the committed answer you requested: I propose that the governing epistemic principle for eight of your nine cases is **The Principle of Causal Sensitivity**. I will argue that **Verdict 7** is the outlier that operates on a incompatible principle (**Actuarial Correlation**), and that **Verdict 4** is too timid for a professional risk analyst.

  ### The Principle: Causal Sensitivity

  **Definition:** Evidence $E$ justifies a belief or decision about a specific case $C$ only if:
  1.  **Sensitivity:** Had the fact in $C$ been different, $E$ would likely have been different. (The evidence tracks the truth).
  2.  **Mechanism:** The property linking $C$ to the reference class is causally operative in $C$, not merely a statistical artefact.
  3.  **Specificity:** Where sensitive specific evidence exists, it overrides insensitive class frequencies.

  **Clauses and Case Mapping:**

  *   **Clause 1 (Sensitivity):** *Motivated by Cases 5 & 6.*
      In Case 5 (Bus Market Share), if the accident *had not* involved the defendant's bus, the market share statistic (70%) would remain exactly the same. The evidence is insensitive to the specific truth. In Case 6 (Eyewitness), if the bus *had not* been the defendant's, the witness likely would not have identified it as such. The evidence tracks the fact. This clause explains why identical probabilities yield opposite legal verdicts. Pure probability thresholds fail here; sensitivity succeeds.

  *   **Clause 2 (Mechanism):** *Motivated by Case 8.*
      A genetic marker is a biological property that participates in the causal mechanism of cardiac risk. Month of birth is a sorting artefact; it correlates but does not cause. Narrowing by marker respects the mechanism; narrowing by birthday is overfitting noise. This clause kills the classical advice to "take the narrowest reference class," as that rule would validate the birthday split.

  *   **Clause 3 (Specificity):** *Motivated by Cases 1, 2, 3, & 9.*
      In Case 1 (Survival), you lack specific evidence of his unique biology, so you default to the class. In Case 2 (Smoking), you *have* specific evidence (clinic booking, partner's quit) that is causally linked to volition. Specific evidence overrides the class habit. In Case 3 (Rail), the project plan is not "specific evidence" because the planning fallacy is a systemic bias; the base rate is the more reliable tracker of the *estimation process*. In Case 9 (Politics), you claim your analysis *is* superior specific evidence (verified by your track record). If your track record holds, you are justified in ignoring base rates; if it is self-deception, you are violating this clause.

  ### The Cost: Which Verdicts Must Go?

  This principle accommodates Cases 1, 2, 3, 5, 6, 8, and 9. It forces you to confront two uncomfortable truths about your remaining verdicts.

  **1. You must isolate Verdict 7 (Insurance Pricing).**
  *   **The Conflict:** Case 7 permits using the 70% statistic for premiums, while Case 5 forbids it for liability. Under Causal Sensitivity, **Verdict 7 is epistemically unjustified.** A postcode or market share does not track the specific risk of *this* driver or *this* accident.
  *   **The Sacrifice:** You must admit that insurance pricing does not rest on "truth about the individual" but on "solvency of the pool." It operates on **Actuarial Correlation**, not Causal Sensitivity. This is not a flaw in your practice, but it is a moral and epistemic discontinuity. You are allowed to use "unjustified" statistics for pricing because the contract is voluntary and the harm is financial distribution, not liberty or blame.
  *   **Why this shouldn't embarrass you:** It is better to acknowledge that pricing is a regulatory/financial tool than to pretend it is a forensic truth-finding exercise.

  **2. You must modify Verdict 4 (First-of-a-Kind Plant).**
  *   **The Conflict:** You say "no defensible number exists." Causal Sensitivity demands you use the best available tracker. If no specific mechanism is known, the widest available analogy ("large public projects") *is* the only sensitive evidence you have, provided you attach massive uncertainty bounds.
  *   **The Sacrifice:** Refusing to give a number is evasive in a commercial risk context. You should provide a number derived from the widest class, explicitly labelled as "High Uncertainty / Weak Mechanism." Risk analysis requires quantification of ignorance, not silence.

  ### Testing the Principle on New Cases

  **1. Insurer using postcode-level class correlating with ethnicity.**
  *   **Verdict:** **Epistemically Invalid, Actuarially Tempting.**
  *   **Reasoning:** Under Causal Sensitivity, this fails Clause 2 (Mechanism). Postcode and ethnicity do not cause accidents; they proxy for unmeasured variables (road quality, traffic density). Using them treats the individual as a member of a class rather than a causal agent.
  *   **Decision:** Permissible only under the "Actuarial Correlation" exception (Verdict 7), but carries high ethical and regulatory risk. It violates the norm of individual fairness even if it satisfies solvency.

  **2. Parole board relying on recidivism scores from different prisoners.**
  *   **Verdict:** **Invalid.**
  *   **Reasoning:** This fails Clause 1 (Sensitivity) and Clause 3 (Specificity). A score derived from "people who differ in respects that matter" does not track *this* prisoner's rehabilitation. Liberty decisions belong to the "Truth/Responsibility" frame (like Case 5), not the "Pooling" frame (Case 7). You cannot pool risk with a prisoner's liberty.

  **3. Outcome of the next general election (genuinely unrepeatable).**
  *   **Verdict:** **Base Rates are Weak; Causal Analysis is Primary.**
  *   **Reasoning:** Elections are volitional and path-dependent. Historical base rates (e.g., "incumbents win 60%") lack a stable causal mechanism in a novel political environment. Following your Verdict 9, you should rely on specific causal modelling (polling, economic indicators, sentiment) provided you have verified skill. If you lack skill, the base rate is the only fallback, but it should be heavily discounted.

  ### Defence Against Rivals

  **1. Pure Probability-Threshold Account.**
  *   **Refutation:** Fails Cases 5 and 6 immediately. If the standard of proof were simply $P > 0.5$ (or 0.7), the market share evidence would suffice for liability. It does not. Probability is necessary but not sufficient for justification.

  **2. Causal/Explanatory Relevance.**
  *   **Refutation:** This is close, but too static. Market share *is* causally relevant to the *risk* of an accident occurring in the town, just not to *this* accident. **Sensitivity** is the sharper tool: it asks whether the evidence *varies* with the truth of the specific claim.

  **3. The "Narrowest Reference Class" Rule.**
  *   **Refutation:** Fails Case 8. "Males born in March with this heart condition" is narrower than "Males with this heart condition and this genetic marker," but the former is noise and the latter is signal. Narrowness without causal mechanism is overfitting.

  ### Conclusion

  You asked for a principle that survives contact with your whole list. **There is none.**

  Your practice rests on two incompatible principles applied in different rooms:
  1.  **Causal Sensitivity** for Forecasting, Medicine, and Law (Cases 1–6, 8–9).
  2.  **Actuarial Correlation** for Insurance Pricing (Case 7).

  The cost of this view is that you must stop pretending Case 7 is epistemically equivalent to Case 1. In Case 1, you are reporting a truth about a patient. In Case 7, you are setting a price to ensure a fund does not collapse. Both are valid professional activities, but they answer to different gods: one to Truth, the other to Solvency.

  **Verdicts to Overturn:**
  *   **Verdict 7:** Acknowledge it is a pragmatic exception, not an epistemic success.
  *   **Verdict 4:** Provide a number with wide confidence intervals rather than refusing to quantify.

  This preserves the integrity of your legal and clinical work while securing the commercial reality of your insurance work. It validates your intuition that the bus cases (5 & 6) are fundamentally different from the premium cases (7), without forcing you to abandon the utility of base rates where they genuinely track reality.
