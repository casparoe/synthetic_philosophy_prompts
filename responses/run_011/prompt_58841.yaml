prompt: |-
  ok so I'm a junior double-majoring in CS and philosophy, and this term I'm in a philosophy-of-AI seminar where the midterm isn't a paper, it's that each of us has to run an outreach session for some non-philosophy group on campus. I got assigned the robotics club: 35 minutes, a whiteboard, and their competition bot sitting on the table the whole time. My topic is the frame problem, and honestly I think I understand it fine but I have no idea how to teach it to these people.

  The audience is like 20 second-years who've done a planning pset where they wrote frame axioms by hand and then used a library that auto-generates them for a bigger domain. The club president has already told everybody the frame problem is basically "you have to write a pile of non-effect axioms and it's tedious, so tools do it for you now, it's a solved thing." And I'd bet money at least a few of them will say something like a big language model obviously handles this, since it knows pushing a cart moves the stuff on the cart.

  So: don't explain the frame problem to me, I want a plan for how to explain it. Specifically —

  What has to come first and what depends on what. I'm pretty sure you can't get from "writing axioms is annoying" to the version that actually keeps philosophers up at night without some intermediate step, and I don't know what that step is or where in the sequence it goes. Lay out the order and justify each dependency.

  Which example carries the whole thing. The robot on the table, Dennett's story about the robots sent in to get their battery out of a room with a time bomb in it, or something I haven't thought of? And what does the carrying example have to have, and definitly not have, for the point to survive contact with engineers who will immediately try to debug it?

  The misconceptions. I'm expecting "it's a compute problem, a faster chip fixes it," "learned representations / probability already absorb it," "that's engineering, not philosophy," and maybe the opposite failure where they go "so AI is impossible and you proved it." Which of those are actually pre-existing and which are reactions to a step I haven't taken yet, and exactly where in the sequence I head each one off.

  What one thing I should flatly refuse to cover at this level, and say out loud that I'm refusing.

  And a single question I can ask at the end — with their robot right there — that would tell me whether they actually got the relevance thing or just learned to nod politely at a philosophy student.
reasoning: |-
  Here's a thinking process that leads to the suggested outreach plan:

  1.  **Analyze the User and Context:**
      *   **User:** Junior, CS & Philosophy double major. Competent in both fields but struggling with pedagogy/translation.
      *   **Task:** 35-minute outreach session for a Robotics Club (20 second-years).
      *   **Topic:** The Frame Problem.
      *   **Constraints:** Whiteboard, competition bot on table, 35 mins.
      *   **Audience Knowledge:** They've done planning psets (wrote frame axioms by hand, then used libraries). They think it's "solved" (just tedious engineering) or "solved by LLMs."
      *   **Goal:** Move them from "engineering annoyance" to "philosophical depth" without losing them or letting them dismiss it as "just compute."
      *   **Specific Requests:**
          1.  Sequence/Dependency of concepts.
          2.  The central example (Dennett? Robot on table? Other?).
          3.  Misconception management (compute, LLMs, engineering vs. philosophy, AI impossibility).
          4.  One thing to explicitly refuse to cover.
          5.  One final question to test understanding (using the bot).

  2.  **Deconstruct the Frame Problem (for the purpose of teaching):**
      *   *Surface Level (CS/Planning):* How do we represent what *doesn't* change without writing infinite axioms? (The "Syntactic" Frame Problem).
      *   *Deep Level (Philosophy/Cognition):* How does an agent know *which* facts are relevant to an action without checking everything in the universe? (The "Semantic" or "Relevance" Frame Problem).
      *   *The Gap:* The students think it's the first one. The goal is to show the first one *implies* the second one, and the second one is still open.

  3.  **Drafting the Plan - Section by Section:**

      *   **1. Sequence & Dependencies:**
          *   *Start:* Validate their experience. Acknowledge the "tedious axioms" view. If I start with Dennett, they'll tune out.
          *   *Step 1:* The Planning View (Syntactic). Confirm their pset experience.
          *   *Step 2 (The Pivot):* The Explosion of Relevance. Why did the library work? Because the domain was bounded. What happens when the domain is "the world"?
          *   *Step 3:* The Philosophical View (Semantic). It's not about storage; it's about *salience*.
          *   *Dependency:* You can't understand why it's a philosophical problem until you accept that the engineering "solution" (bounding the domain) is a cheat that doesn't work for general intelligence.
          *   *Justification:* If I skip the planning view, they think I don't know CS. If I stay there, they think it's solved. The pivot is crucial.

      *   **2. The Central Example:**
          *   *Dennett's Robot (R1, R2, R3):* Classic, but maybe too abstract/story-heavy for 35 mins.
          *   *The Competition Bot:* It's right there. Use it.
          *   *The "Pushing a Cart" Example:* Good for relevance.
          *   *Decision:* Use the **Competition Bot** as the anchor, but animate it with a specific scenario. Let's modify the "Pushing a Cart" to be about the Bot.
          *   *Scenario:* The bot needs to grab a battery.
          *   *Requirement:* The example must show that *irrelevant* changes are infinite.
          *   *Avoid:* Don't make it about sensor noise or control theory. Keep it about *representation* and *reasoning*.
          *   *Refinement:* Let's use Dennett's story but *enacted* with the bot on the table. It bridges the gap. Actually, better: Use the "Pulling a Wagon" example (classic frame problem) but map it to the bot's sensors.
          *   *Wait, the prompt asks about Dennett vs. Robot on Table.* Dennett's story is the best for the *relevance* aspect. The Bot on the table is best for *engagement*.
          *   *Strategy:* Use the Bot to set up the *engineering* view, then use Dennett's story (summarized quickly) to break the engineering view.
          *   *Actually, a hybrid is better.* "Imagine this bot has to move *that* cup."
          *   *Crucial Constraint:* The example must survive engineering debugging.
          *   *Must Have:* A change that is logically entailed but practically invisible (e.g., color of the wall, number of hairs on a cat).
          *   *Must Not Have:* Ambiguity about physical mechanics. (Don't let them argue about friction).

      *   **3. Misconceptions:**
          *   *"It's a compute problem":* Pre-existing. Address after the "Relevance" pivot. Show that more compute doesn't help if you don't know *what* to compute.
          *   *"LLMs solve it":* Pre-existing/Reaction. Address near the end. LLMs predict tokens, they don't necessarily model causal reality. They hallucinate frame violations.
          *   *"Engineering, not Philosophy":* Pre-existing. Address at the start by validating, then reframe.
          *   *"AI is Impossible":* Reaction to the deep dive. Address at the conclusion (it's a constraint, not a stopper).
          *   *Timing:* Head off "Engineering" at the start. Head off "Compute" at the pivot. Head off "LLMs" during the Q&A/final check. Head off "Impossible" at the wrap-up.

      *   **4. What to Refuse:**
          *   Don't cover **Non-Monotonic Logic / Circumscription details**. It's too technical, eats time, and lets them hide in the math instead of the concept.
          *   Or, don't cover **The Solution**. Admit there isn't a consensus one.
          *   *Best Refusal:* "I am not going to teach you how to solve it." (Validates the difficulty, prevents them from waiting for a code snippet).

      *   **5. The Final Question:**
          *   Needs to use the bot.
          *   Needs to test *relevance*, not *planning*.
          *   *Idea:* Ask them to program the bot to do something simple, but ask what *else* it needs to check.
          *   *Better:* "If this bot moves forward 1 meter, what variable in its state vector *must* change, and what variable *might* change but we usually ignore? Now, tell me how the bot knows which is which without checking the whole universe."
          *   *Refinement:* Make it about the *environment*. "If this bot pushes that cup, does the color of the cup change? How does the bot know *not* to check the color?"

  4.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Tone:* Respectful of their CS skills. Don't talk down. "You know the code, I know the implications."
      *   *Time Management:* 35 mins is tight.
          *   5 mins: Hook & Validation (The Pset).
          *   10 mins: The Pivot (From Syntax to Relevance).
          *   10 mins: The Dennett Story (The Relevance Explosion).
          *   5 mins: LLMs & Modern Context.
          *   5 mins: Final Question & Wrap.
      *   *The "Step" they are missing:* The distinction between *representing* change (engineering) and *selecting* relevant facts (cognition). This is the core dependency.
      *   *The Example:* Dennett's bomb story is actually the strongest for the "relevance" point. The bot on the table is a prop. I should advise using the bot to *act out* the start, then tell the story for the climax.
      *   *Misconception nuance:* The "LLM" objection is the trickiest. Need to explain that statistical correlation $\neq$ causal frame maintenance.
      *   *Refusal:* "How to fix it."

  5.  **Final Review against constraints:**
      *   Did I explain the frame problem? No (user said don't).
      *   Did I give the sequence? Yes.
      *   Did I pick the example? Yes (Hybrid: Bot for setup, Dennett for the hammer).
      *   Did I map misconceptions? Yes.
      *   Did I pick a refusal? Yes.
      *   Did I craft the final question? Yes.

  6.  **Writing the Response:** (Focusing on clear, actionable advice, matching the user's academic but practical tone). *Self-correction: Ensure I emphasize WHY the sequence matters.* *Make sure the final question is punchy.*

      *(Drafting the "Final Question" carefully)*: "If I tell this bot to push the cup, and I give it infinite compute, what specific line of code tells it that the cup's *color* didn't change?" -> This forces them to admit there isn't one, or that it's hardcoded (which fails generalization).

      *(Drafting the "Refusal")*: "I'm not going to give you the solution." This is honest and frames the philosophical nature.

      *(Drafting the "Example")*: Dennett's is best for the *point*, but the Bot is best for the *room*. Use the Bot to demonstrate the "easy" version, then Dennett for the "hard" version.

      *(Drafting the "Sequence")*:
      1. Validation (You are right about the pset).
      2. The Boundary (Why the pset was easy).
      3. The Explosion (Why the real world is hard).
      4. The Consequence (Relevance, not storage).

      *(Drafting Misconceptions)*:
      - "Engineering": Address in Validation.
      - "Compute": Address in Explosion.
      - "LLMs": Address in Consequence.
      - "Impossible": Address in Wrap-up.

      *Let's assemble.*
answer: |-
  Here is a battle plan for your 35 minutes. Your intuition is correct: the gap between "tedious axioms" and "philosophical crisis" is the distinction between the **Syntactic Frame Problem** (representation) and the **Semantic Frame Problem** (relevance). Your entire session hinges on forcing them to cross that bridge.

  ### 1. The Sequence and Dependencies

  You cannot start with philosophy. If you start with Dennett, they will categorize you as "the humanities person" and tune out. You must start as a TA debugging their pset.

  **Order of Operations:**

  1.  **Validation (The "You're Right" Phase):** Acknowledge their experience. In bounded domains (like their pset), the frame problem *is* just a bookkeeping annoyance solved by libraries (e.g., PDDL solvers).
      *   *Dependency:* You must establish credibility. If you deny their engineering reality, you lose them.
  2.  **The Boundary Condition (The "Cheat" Phase):** Point out *why* the library worked. It worked because the domain was pre-defined. The universe of discourse was limited to "blocks," "table," and "arm."
      *   *Dependency:* You need them to admit the solution relies on human pre-filtering of relevance.
  3.  **The Explosion (The "Real World" Phase):** Remove the boundary. If the robot leaves the table, the number of non-changing facts becomes infinite (color of the wall, position of the moon, number of hairs on the cat).
      *   *Dependency:* This creates the crisis. You cannot write axioms for infinite non-changes.
  4.  **The Pivot to Relevance (The "Philosophy" Phase):** Argue that the problem isn't storing the data (compute); it's knowing *which* data to check for change.
      *   *Dependency:* This is the core insight. Once they accept they can't check everything, they must accept they need a theory of relevance. That is the philosophical problem.

  **Justification:** If you skip step 2, they think Step 3 is just a scaling issue (Step 3 is a complexity class issue). If you skip Step 3, Step 4 looks like mysticism.

  ### 2. The Example: The Hybrid Approach

  Do not use *only* the bot on the table, and do not *only* tell Dennett's story. Use the bot to set the trap, and Dennett to spring it.

  **The Setup (Using the Bot):**
  Point to the competition bot. Ask: "If this bot moves forward 10cm, what changes?"
  *   They will say: "Odometry, X/Y coordinates."
  *   Ask: "What *doesn't* change?"
  *   They will say: "The wheel radius, the battery voltage, the color of the chassis."
  *   *Trap:* Ask, "How does the code know to update coordinates but *not* update the chassis color?"
  *   *Their Answer:* "Because we didn't write an effect for color."
  *   *Your Counter:* "Right. You hardcoded relevance."

  **The Hammer (Dennett's Story):**
  Now, tell the R1/R2/R3 story (summarized).
  *   **R1:** Goes in for battery. Sees bomb. Realizes pulling the wagon moves the battery. Pulls wagon. Bomb comes out. Boom. (Failed to frame the bomb's location).
  *   **R2:** Tries to calculate *all* side effects. Checks if pulling the wagon changes the wall color, the room temperature, the election prospects. Still calculating when bomb goes off. (Failed to filter relevance).
  *   **R3:** Tries to distinguish relevant from irrelevant implications. Still calculating when bomb goes off.

  **Why this combination works:**
  *   **The Bot** proves you understand their hardware.
  *   **Dennett** proves that "hardcoding relevance" (like they did with the bot) fails when the environment is open.
  *   **What the example MUST have:** A consequence that is *causally linked* but *semantically distant* (e.g., pulling the wagon moves the bomb).
  *   **What the example MUST NOT have:** Sensor noise or control theory issues. Do not let them argue about "well, the LiDAR would see the bomb." This is about *symbolic reasoning*, not perception. If they bring up perception, say: "Okay, the LiDAR sees it. How does the planner know that 'object detected at X' implies 'threat' vs 'background clutter' without checking every other object?"

  ### 3. Misconception Management

  Here is where you intercept the objections before they derail the room.

  | Misconception | Origin | When to Head It Off | How to Head It Off |
  | :--- | :--- | :--- | :--- |
  | **"It's just engineering/boilerplate."** | Pre-existing (Club Pres) | **During Validation (Min 0-5).** | "You are right. In *planning domains*, it is solved. I am not here to talk about PDDL. I am here to talk about what happens when you delete the domain file." |
  | **"It's a compute problem."** | Reaction to "Explosion" | **During The Pivot (Min 15).** | "Infinite compute doesn't help R2. R2 had infinite time and failed. The problem isn't speed; it's knowing what *not* to compute." |
  | **"LLMs solve this."** | Pre-existing/Current Hype | **During Q&A/LLM section (Min 25).** | "LLMs predict tokens based on statistical co-occurrence. They don't maintain a causal model of state. If you ask an LLM 'If I move the cup, does the color change?', it answers correctly because of training data, not because it tracks state. Prompt it with a novel physics scenario it hasn't seen, and it will hallucinate frame violations." |
  | **"So AI is impossible."** | Reaction to "Philosophy" | **Wrap Up (Min 30).** | "No. Humans solve this. We don't check if the moon moved when we drank coffee. We just need to figure out how biology does relevance filtering. It's a constraint, not a stopper." |

  ### 4. The Refusal

  There is one thing you must explicitly refuse to cover, or they will spend 20 minutes asking for it.

  **Say this verbatim at the 10-minute mark:**
  > "I want to be clear: I am not going to give you the solution to the frame problem. There isn't one. There are partial fixes in logic (circumscription, event calculus), but no consensus on how a general agent solves relevance. If you are waiting for a library import that fixes this for open worlds, it doesn't exist. We are discussing the bug, not the patch."

  **Why:** This prevents them from treating the session as a technical troubleshooting meeting. It forces them to sit with the uncertainty, which is where the philosophy lives.

  ### 5. The Final Question

  You need a question that uses the bot on the table to test if they understand **Relevance** vs. **Representation**.

  **The Setup:**
  Walk over to the bot. Put a small object (like a eraser or battery) on the table next to it.

  **The Question:**
  > "If I command this bot to push that eraser, its code will update the eraser's position. But the eraser also casts a shadow, and it displaces air molecules, and it might scratch the table.
  >
  > **My question is: What specific line of code, or specific weight in a network, tells the bot that the *shadow* is irrelevant to its goal, but the *battery level* is relevant?**
  >
  > And if you say 'we hardcode it,' tell me how you hardcode that for a world you haven't seen yet."

  **What to listen for:**
  *   **The "Nodder":** "We'd use a relevance heuristic." (Push back: "Where does the heuristic come from?")
  *   **The "Engineer":** "We just don't model the shadow." (Push back: "How do you know not to model it before you run the code?")
  *   **The "Got It":** "That's the point. We don't know. We're relying on the environment to be structured enough that we can ignore it, which isn't guaranteed."

  If they answer with "We'd train a model," ask: "Does the model *know* it's ignoring the shadow, or did it just get lucky during training?"

  **Success Condition:** If they leave arguing about whether "relevance" is a computational property or an environmental property, you have succeeded. That is the philosophical frame problem.
