answer: |-
  Here is a plan designed to move students from "following the algebra" to "feeling the tension." The core problem in your previous attempts was that the definitions of fairness arrived as *rules* rather than *consequences of goals*. To fix this, you must derive the criteria from operational needs before you show they conflict.

  ### 1. The Pedagogical Sequence (Dependency Structure)

  You have 50 minutes. Do not write the theorem statement until minute 35. The sequence must follow the logical dependency of the *system*, not the *proof*.

  **Phase 1: The Score as a Claim (Minutes 0–10)**
  *   **Goal:** Establish that a risk score is a statement of fact about the world, not just a ranking.
  *   **Dependency:** None.
  *   **Action:** Draw a histogram of risk scores for a single group. Ask: "If I tell you a student has a score of 0.8, what does that mean?"
  *   **Crucial Step:** Elicit from them that it means "80% of people with this score drop out." Write this as $P(Y=1 \mid S=0.8) = 0.8$.
  *   **Definition:** Label this **Calibration**. Frame it as *Trust*: "If the score isn't calibrated, the number is a lie. We cannot use it for policy."
  *   **Compression:** Do not discuss how the score is generated (logistic regression, etc.). Treat the score as a given input.

  **Phase 2: The Decision as a Cut (Minutes 10–20)**
  *   **Goal:** Establish that a score does not make a decision; a *threshold* does.
  *   **Dependency:** Requires Phase 1 (we have scores).
  *   **Action:** Introduce the resource constraint (e.g., only 20% of students can get advising). Draw a vertical line (threshold) on the histogram. Everyone to the right gets the intervention.
  *   **Concept:** This converts the continuous score into a binary decision ($\hat{Y}$).
  *   **Dependency:** This creates the possibility of errors. Define False Positives (advised but wouldn't have dropped out) and False Negatives (not advised but dropped out).
  *   **Definition:** Label the rates of these errors **Error Rates** (FPR/FNR). Frame this as *Burden*: "Who bears the cost of the mistake?"

  **Phase 3: The Two Groups (Minutes 20–30)**
  *   **Goal:** Introduce the base rate difference without triggering a debate on *why* it exists.
  *   **Dependency:** Requires Phase 1 & 2 (we have scores, thresholds, and errors).
  *   **Action:** Draw a second histogram next to the first. Group A (High Base Rate) scores are shifted right. Group B (Low Base Rate) scores are shifted left.
  *   **Constraint:** Explicitly state: "For this exercise, we accept these distributions as the current reality. We are measuring the system, not fixing the admissions office today."
  *   **Test:** Ask them to apply the *same* threshold line to both graphs.
  *   **Observation:** They should see visually that the slice of the "Negative" population caught by the threshold is different for each group. The Error Rates differ.

  **Phase 4: The Incompatibility (Minutes 30–40)**
  *   **Goal:** Demonstrate the trade-off.
  *   **Dependency:** Requires all previous phases.
  *   **Action:** Ask: "How do we make the Error Rates equal?"
  *   **Elicit:** Students should suggest moving the threshold line for one group (lower it for Group B, raise it for Group A).
  *   **The Trap:** Once they move the threshold, ask: "A student in Group A has a score of 0.7. A student in Group B has a score of 0.7. Do they have the same risk?"
  *   **The Realization:** If thresholds differ to equalize errors, the *meaning* of the score differs. If you keep the meaning (Calibration), the errors differ.
  *   **Conclusion:** Write the impossibility result now. It is no longer a definition quirk; it is a geometric necessity of shifting distributions.

  **Phase 5: Misconceptions & Closing (Minutes 40–50)**
  *   **Action:** Address the anticipated pushbacks (see Section 3) and pose the final question.

  ---

  ### 2. The Running Example: Critique and Replacement

  **Your Candidate:** University Early-Alert System (First-Gen vs. Continuing).
  **Verdict:** **Unsuitable for this specific 50-minute objective.**

  **Why:** You correctly identified the risk: "the fact that the difference in base rates is partly a product of the institution's own past admissions and funding practices." In a Public Policy program, this is not a bug; it is a feature. If you use this example, a student *will* ask: "Why are we adjusting the threshold to hide the university's failure? Why not fix the funding?"
  This is a valid policy question, but it is **not** the measurement question you have 50 minutes to teach. If that debate starts, you cannot win it in the time allotted, and the mathematical tension will be dismissed as "political." You need an example where the base rate difference is treated as exogenous (given) without triggering a legitimacy crisis about the measurement itself.

  **The Replacement:** **Emergency Department Triage (Sepsis Risk).**
  *   **Context:** The hospital has 50 ICU beds. A model predicts the risk of sepsis within 24 hours for incoming patients.
  *   **Groups:** Patients from **Region X** vs. **Region Y** (or simply Group A/B).
  *   **Base Rates:** Due to epidemiological factors (e.g., prevalence of a comorbidity), Group A has a higher underlying rate of sepsis than Group B.
  *   **Decision:** Admit to ICU (High Resource) vs. General Ward (Low Resource).
  *   **Why this works:**
      1.  **Stakes are Clear:** False Negative = Death/Severe Harm. False Positive = Wasted Bed/Cost.
      2.  **Base Rates are "Natural":** While health disparities exist, students are less likely to argue that the *hospital* caused the biological prevalence difference in a 50-minute window than they are to argue the *university* caused the dropout difference. It allows you to "freeze" the base rates as a premise.
      3.  **Calibration is Vital:** If a score of 0.8 means 80% risk for Group A but 50% risk for Group B, doctors cannot trust the number.
      4.  **Error Rates are Vital:** If Group B is systematically denied ICU beds because the threshold is too high for their distribution, that is a visible harm.

  **What the Example Must Contain:**
  *   **Binary Decision:** You must have a hard capacity constraint (beds/advising slots). Without a threshold, there is no conflict.
  *   **Imperfect Prediction:** The score distributions for "Sick" and "Healthy" must overlap. If they are perfectly separated, fairness is easy.
  *   **Different Base Rates:** The average score for Group A must be visibly higher than Group B.

  **What the Example Must Lack:**
  *   **Debatable Validity:** Do not use a metric where the outcome itself is contested (e.g., "risk of arrest" vs. "risk of committing crime"). Sepsis or Default are objective outcomes.
  *   **Individual Adjudication:** The scenario must imply high volume (thousands of patients/students) to rule out "just look at each case" as a feasible alternative.

  ---

  ### 3. Misconception Map

  Do not save these for the end. Intercept them at the point of vulnerability.

  | Misconception | When it arises | How to head it off (Script) |
  | :--- | :--- | :--- |
  | **"Just delete the group label."** | **Phase 1 (The Score).** Students think fairness means "blindness." | **Intercept:** "If we delete the group label, we cannot *check* if the error rates are equal. We can only hope. Today we are assuming we want to *measure* fairness, which requires seeing the groups." |
  | **"This is just a quirk of these specific definitions."** | **Phase 4 (The Incompatibility).** When you write the theorem. | **Intercept:** "It is not the definitions; it is the math of conditional probability. If $P(Y=1|G=A) \neq P(Y=1|G=B)$, you cannot satisfy both conditions simultaneously. It is like trying to draw a square circle. Any definition requiring both will fail." |
  | **"It's all political; the numbers don't matter."** | **Phase 4 (The Trade-off).** When they realize one group must lose out. | **Intercept:** "The choice is political, but the *consequence* is mathematical. If you choose Equal Error Rates, you *must* accept that a score of 0.8 means different things. That isn't politics; that is the model lying to the doctor. You need to know *how* it lies." |
  | **"Abandon the score; decide case-by-case."** | **Phase 5 (Closing).** The "human in the loop" escape hatch. | **Intercept:** "Humans are not calibrated. If I ask you to estimate sepsis risk for 500 patients, you will be inconsistent. The score forces consistency. The question isn't 'Score vs. Human,' it is 'Which fairness constraint do we force the score to obey?'" |

  **What to Refuse to Engage With:**
  *   **The Proof:** Do not derive Chouldechova's or Kleinberg's theorem algebraically. Use the whiteboard histograms. The visual proof is sufficient for this level and keeps the focus on the *intuition*.
  *   **Individual Fairness:** (e.g., "similar individuals should be treated similarly"). This requires a metric of similarity between individuals which complicates the group-wise logic. Declare this "Out of Scope."
  *   **Fixing Base Rates:** (The "Rectification" debate). See the Example section. Acknowledge it matters, but state: "Today we are the hospital administrators managing the *current* beds, not the public health officials fixing the *future* prevalence. We must make a decision with the data we have."

  ---

  ### 4. Scope and Closing

  **Opening Two Minutes (Setting the Boundary):**
  "Today we are not asking whether the base rates *should* differ. In the real world, they often reflect historical injustice. But for the next 48 minutes, we are acting as the operators of the system *as it exists*. We have a score, we have a capacity limit, and we have to set a rule. Our goal is to understand the mechanical constraints on that rule."

  **The Closing Question (Final 5 Minutes):**
  Do not ask "Did you understand?" Ask a question that forces them to apply the trade-off structure.

  **Pose this:**
  > "Imagine we are forced to satisfy **Equalized Odds** (same false positive rates for both groups). To do this, we must use a lower threshold for Group B than for Group A.
  >
  > **If I am a doctor in Group B and I see a patient with a risk score of 0.7, can I trust that number to mean '70% risk'? Why or why not?**"

  **Why this works:**
  *   If they say "Yes," they missed the point (Calibration is broken).
  *   If they say "No," ask "Then what does the 0.7 mean?" (It means different things for different groups).
  *   If they say "It means 70% risk *for Group B*," they have grasped the structure: The score is no longer a universal probability, but a group-conditional index.

  This confirms they understand that satisfying one criterion *breaks* the semantic meaning of the score, which is the core tension you need them to leave with.
