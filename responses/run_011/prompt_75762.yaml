answer: |-
  **The question**

  Updateless decision theory requires agents to maximize expected utility relative to a prior distribution rather than a posterior. However, the literature lacks a principled boundary for which components of an agent's total information state must be excluded from conditioning to achieve optimality. Currently, this boundary is drawn intuitively: agents update on ordinary empirical evidence but remain updateless regarding predictions of their own behavior or self-locating facts in duplication cases. This project asks: **Is there a formal criterion, derivable from decision-theoretic objectives alone, that partitions an agent's total information into updatable and non-updatable subsets?** The answer must be a function mapping information types to update-status without relying on pre-theoretic verdicts about specific cases. The goal is a determinate rule that tells an agent, upon receiving a piece of information, whether to conditionalize on it or treat it as fixed background for the purpose of policy selection.

  **Why the existing options leave it open**

  Existing frameworks leave this partition undefined. Global updatelessness positions mandate maximizing utility from the prior over all possible worlds. This correctly handles Newcomb-like problems where updating leads to dynamic inconsistency. However, it fails to account for cases where ignoring empirical evidence is clearly irrational, such as observing a box is empty before deciding whether to take it. Global updatelessness lacks a mechanism to exclude irrelevant logical correlations while retaining useful empirical data. Conversely, instrumentalist positions treat updatelessness as a specialized tool for predictor problems. They advise updating normally unless a predictor simulates the agent. This captures ordinary rationality but renders the theory ad hoc. It offers no rule for distinguishing a "predictor" from a standard causal correlate, nor does it explain why self-locating evidence in duplication cases often demands updatelessness while other indexical information does not. For instance, in Sleeping Beauty, updatelessness is often preferred, yet in ordinary self-location, updating is standard. Both positions rely on external intuitions to determine when the updateless protocol activates. They assume the partition is known rather than deriving it. Consequently, there is no general account of which information triggers the shift from posterior to prior optimization. The project targets this gap: the lack of an internal decision-theoretic mechanism for selecting the appropriate reference class for expectation calculations.

  **The method**

  The project proceeds in three monthly phases. Month one focuses on formalization. I will construct a model of an agent's information state as a vector of propositions, distinguishing between empirical observations, logical facts, and self-locating indices. Using causal Bayesian networks, I will represent the dependencies between these propositions and the agent's decision procedure. The goal is to define a partition function $P(I)$ that sorts information $I$ into sets $I_{update}$ and $I_{hold}$. I will explicitly model the relationship between the agent's algorithm and the environment to identify where logical dependence diverges from causal dependence.

  Month two involves stress-testing. I will apply candidate partition functions to four problem classes: standard predictor problems, cases where evidence is an effect of choice, self-locating uncertainty, and cases involving information about the agent's own source code. I will not assume the correct verdict beforehand; instead, I will check if a single partition rule yields optimality across these classes simultaneously. I will look for invariants in the information structure that correlate with the need for updatelessness.

  Month three synthesizes the criterion. If a consistent pattern emerges—for instance, that information subjunctively dependent on the decision algorithm must be held fixed while causally downstream evidence is updatable—I will formalize this condition. The apparatus required is primarily formal epistemology: probability theory extended to handle logical counterfactuals. I will avoid committing to a specific theory of logical uncertainty but will treat logical dependence as a primitive relation to be analyzed structurally. The output will be a proposed axiom for information partitioning.

  **What would count as a result, and what would count as failure**

  Success consists of a stated criterion that satisfies two conditions. First, it must reproduce standard verdicts in paradigmatic cases without circular reference to those verdicts. Second, it must resolve at least one ambiguous case in the literature where current theories diverge. For example, if the criterion clarifies whether an agent should update on knowing its own algorithm in a transparent Newcomb problem, that is a result. It would demonstrate the criterion has predictive power beyond retrodiction.

  Failure is defined by two concrete conditions. First, the criterion collapses into triviality: if the derived rule is coextensive with "never update" or "always update," it fails to capture the nuanced distinction the project seeks. This would imply the distinction is illusory. Second, the criterion proves unstatable without external causal knowledge unavailable to the agent. If the partition requires knowing the true causal graph of the universe rather than structures accessible within the agent's epistemic state, the criterion is unusable for decision theory. A third failure mode is inconsistency: if the criterion requires different partitioning rules for predictors versus duplicators without a unifying principle, the project fails to unify the concept of updatelessness.

  **Scope and risks**

  The primary risk is dependency on unsettled metaphysics. If the criterion relies on a specific treatment of logical counterfactuals that remains controversial, the project's conclusions may be fragile. Similarly, if the distinction between "logical" and "empirical" information cannot be formally drawn without presupposing the solution, the project may stall. However, the three-month timeline allows for a scaled-down fallback. If a general criterion proves unreachable, I will deliver a negative result: a rigorous proof that no such partition exists within standard Bayesian frameworks without additional structural assumptions. This taxonomy of impossibility would still clarify the boundaries of updateless decision theory. The project is feasible because it analyzes existing formal structures rather than requiring new empirical data or complex simulations.
