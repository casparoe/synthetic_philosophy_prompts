answer: |-
  # LABORATORY PROTOCOL 7.4: VERBAL REPORT HANDLING AND CODING
  **Status:** Standing Order | **Authority:** Principal Investigator | **Method:** Heterophenomenological Data Reduction

  ## PART 1: OPERATIONAL WORKFLOW

  **Objective:** To convert raw audio transcripts into a structured Coded Record (CR) that preserves the subject's testimony without endorsing its truth or dismissing it as error.

  **Constraint:** You are coding *what the subject says the world is like*, not *what the world is like*.

  ### Step 1: Verbatim Transcription (The Raw Text)
  *   **Action:** Transcribe audio exactly. Include pauses, hesitations ("um," "uh"), and self-corrections.
  *   **Allowed:** Time-stamps, speaker labels.
  *   **Forbidden:** Cleaning up grammar, removing filler words, summarizing.
  *   **Why:** The *way* a report is given (hesitant, fluent, confused) is data. Smoothing it hides uncertainty.

  ### Step 2: Propositional Segmentation (The Units)
  *   **Action:** Break the text into distinct claims. Each sentence or independent clause describing a perceptual state or decision becomes a Unit.
  *   **Allowed:** Splitting compound sentences (e.g., "I saw red and it moved" $\rightarrow$ Unit 1: "I saw red", Unit 2: "It moved").
  *   **Forbidden:** Merging separate thoughts.
  *   **Why:** We need to track which specific parts of a report might conflict with behavioral data.

  ### Step 3: Attitude Tagging (The Stance)
  *   **Action:** Label the subject's relationship to the claim.
  *   **Tags:**
      *   `[DIRECT]`: "I saw a flash."
      *   `[INFER]`: "It must have been red."
      *   `[GUESS]`: "I think maybe it moved."
      *   `[NEG]`: "I didn't see anything."
  *   **Allowed:** Using the subject's own modality markers.
  *   **Forbidden:** Changing a `[GUESS]` to a `[DIRECT]` because the stimulus was obvious.
  *   **Why:** Subjective confidence is distinct from objective accuracy.

  ### Step 4: Phenomenal Content Extraction (The World)
  *   **Action:** Rewrite the Unit into a standard format describing the *Subject's World*.
  *   **Format:** `Subject reports [Content] in [Location/Time].`
  *   **Example:** "I saw a flash" $\rightarrow$ `Subject reports [visual flash] in [center screen].`
  *   **Allowed:** Describing the content of the report.
  *   **Forbidden:** Evaluating the content (e.g., do not write "Subject reports [illusion]").
  *   **Why:** This creates the "heterophenomenological world." It is the world *as they take it to be*.

  ### Step 5: Discrepancy Flagging (The Correlation)
  *   **Action:** Compare the Phenomenal Content against the Stimulus Log and Behavioral Log.
  *   **Action:** If they match, mark `[CONSISTENT]`. If they diverge, mark `[DIVERGENT]` and cite the specific behavioral data (e.g., "Stimulus Log: No motion").
  *   **Allowed:** Noting the mismatch.
  *   **Forbidden:** Resolving the mismatch in the text (e.g., do not write "Subject mistaken").
  *   **Why:** The explanation of the mismatch is a theoretical task for the Investigators, not a coding task for you.

  ---

  ## PART 2: ESSENTIAL DISTINCTIONS (FOR NON-PHILOSOPHERS)

  **Keep These:**
  1.  **Report vs. Fact:** The record contains what was *said*, not what *happened*.
  2.  **Subject's World vs. Experimenter's World:** The subject's world contains moving dots (sometimes). The experimenter's world contains flashing LEDs. Both are recorded; neither erases the other.
  3.  **Sincerity vs. Accuracy:** Assume the subject is telling the truth about *what they seem to experience*. Do not assume they are accurate about *the external cause*.

  **Drop These:**
  1.  **Judgement vs. Perception:** Do not try to decide if a report is a "low-level sensation" or a "high-level judgement." Code both as `Subject reports...`.
  2.  **Disposition vs. Occurrence:** Do not try to code "would have said" vs. "did say." Code only what was uttered.
  3.  **Qualia vs. Access:** Do not use these terms. They are theoretical baggage. Use "Phenomenal Content."

  ---

  ## PART 3: NEUTRALITY AUDIT

  **Standard:** A Realist CI and a Deflationist CI must both be able to read the Coded Record without finding their metaphysics violated.

  | **Forbidden (Metaphysically Loaded)** | **Acceptable (Neutral/Descriptive)** | **Reason** |
  | :--- | :--- | :--- |
  | "The subject **felt**..." | "The subject **reported**..." | "Felt" implies private access is confirmed. |
  | "The subject **experienced**..." | "The subject **described**..." | "Experienced" presupposes the existence of the experience. |
  | "This is an **illusion**." | "Report **diverges from stimulus**." | "Illusion" judges the report as false. |
  | "Subject **confabulated**." | "Report **lacks behavioral support**." | "Confabulation" implies a specific cognitive mechanism. |
  | "Unconscious **processing**." | "Behavior **accurate without report**." | "Unconscious" is a theoretical claim about the state. |
  | "Veridical **perception**." | "Report **matches stimulus**." | "Veridical" claims truth. |
  | "The **appearance** of..." | "The **reported content** of..." | "Appearance" can imply a distinction from reality. |

  ---

  ## PART 4: CONFLICT AND CONFABULATION RULES

  1.  **Incompatible Reports:** If a subject says "It was red" in Trial 1 and "It was blue" in Trial 2 (same stimulus):
      *   **Action:** Code both exactly. Flag as `[INTRA-SUBJECT VARIABILITY]`.
      *   **Do Not:** Average them or choose the "more likely" one.

  2.  **Behavioral Override:** If a subject says "I saw nothing" but points to the location with 95% accuracy:
      *   **Action:** Code the report as `Subject reports [null visual field]`.
      *   **Action:** In the Discrepancy Field, log `Pointing accuracy: 95%`.
      *   **Do Not:** Change the report code to `Subject reports [unconscious sight]`.

  3.  **Physical Impossibility:** If a subject reports seeing behind their own head:
      *   **Action:** Code the report faithfully.
      *   **Action:** Flag as `[REFERRAL REQUIRED]`. Notify PI.
      *   **Why:** This may indicate a misunderstanding of instructions rather than a phenomenal claim.

  4.  **Confabulation:**
      *   **Definition for Coding:** A fluent report providing reasons for a choice that behavioral data indicates was not made (e.g., Choice Blindness).
      *   **Action:** Code the reasons given. Flag as `[POST-HOC RATIONALIZATION CANDIDATE]`.
      *   **Do Not:** Label as "Lie" or "Fake."

  ---

  ## PART 5: QUALITY CONTROL (BEYOND AGREEMENT)

  **Problem:** Two coders can agree perfectly while both smuggling in the same bias (e.g., both treating reports as facts).

  **Solution: The Metaphysical Drift Check.**
  1.  **Random Audit:** The PI will randomly select 5% of Coded Records weekly.
  2.  **The Test:** The PI will search for Forbidden Terms (Part 3) and check Step 4 (Phenomenal Content).
  3.  **Failure Condition:** If a Coded Record allows a reader to conclude *what happened* without looking at the Stimulus Log, it fails. The record must describe the *subject's testimony*, not the *event*.
  4.  **Correction:** Failed records are returned for recoding. Three failures trigger retraining.

  ---

  ## PART 6: LIMITATIONS AND JUDGEMENT CALLS

  **Honest Marking:**
  1.  **Interpretation is Unavoidable:** Step 4 (Content Extraction) requires interpreting natural language. "It was bright" could mean loud or visual. Coders must use context, but ambiguity will remain.
  2.  **The "Null" Problem:** The protocol cannot distinguish between "No Experience" and "Experience Forgotten." Both are coded as `Subject reports [null]`.
  3.  **Theory-Free is Impossible:** The choice of *which* words to extract in Step 4 is theory-laden. We prioritize perceptual descriptors over emotional ones unless specified.

  **What This Protocol Cannot Do:**
  *   It cannot prove consciousness exists.
  *   It cannot prove consciousness is an illusion.
  *   It cannot resolve disputes about whether a report *constitutes* an experience or merely *describes* one.
  *   **Statement for Co-Investigators:** *This protocol produces a database of testimony correlated with behavior. It does not produce ontological conclusions. Any claim that "Experience X occurred" or "Experience X did not occur" is a theoretical interpretation of this data, not a direct output of this coding process.*

  ***

  # PART 7: CASE STUDY WALKTHROUGHS

  ### Case A: The Phi Phenomenon
  **Stimulus:** Light A (Left, Red) flashes. Light B (Right, Blue) flashes 60ms later.
  **Subject Report:** "I saw one dot move from left to right. It started red and turned blue in the middle."

  | Step | Output | Notes |
  | :--- | :--- | :--- |
  | **1. Transcription** | "I saw one dot move from left to right. It started red and turned blue in the middle." | Verbatim. |
  | **2. Segmentation** | Unit 1: "I saw one dot move from left to right." <br> Unit 2: "It started red and turned blue in the middle." | |
  | **3. Attitude** | Unit 1: `[DIRECT]` <br> Unit 2: `[DIRECT]` | |
  | **4. Content** | `Subject reports [single moving object] in [L→R trajectory].` <br> `Subject reports [color change] at [mid-path].` | **Crucial:** Do not code "Apparent motion." |
  | **5. Discrepancy** | `[DIVERGENT]`. Stimulus Log: Two static lights. No motion path. No mid-path color. | |

  **Final Record:** Subject testifies to motion and color change. Stimulus data indicates static flashes. Mismatch flagged. No verdict on "illusion."

  ### Case B: Blindsight (Visual Field Defect)
  **Stimulus:** Stimulus presented in scotoma (blind spot).
  **Subject Report:** "I didn't see anything there. Just darkness. I'm just guessing." (Forced choice: Points to location correctly).

  | Step | Output | Notes |
  | :--- | :--- | :--- |
  | **1. Transcription** | "I didn't see anything there. Just darkness. I'm just guessing." | |
  | **2. Segmentation** | Unit 1: "I didn't see anything there." <br> Unit 2: "Just darkness." <br> Unit 3: "I'm just guessing." | |
  | **3. Attitude** | Unit 1: `[NEG]` <br> Unit 2: `[DIRECT]` <br> Unit 3: `[GUESS]` | |
  | **4. Content** | `Subject reports [null visual field] in [affected quadrant].` | **Crucial:** Do not code "Unconscious vision." |
  | **5. Discrepancy** | `[DIVERGENT]`. Behavioral Log: Localization accuracy 85% (p<.01). | |

  **Final Record:** Subject testifies to absence of vision. Behavioral data indicates accurate localization. Mismatch flagged.

  ### Case C: Choice Blindness
  **Stimulus:** Subject selects Face A as more attractive. Covert swap. Subject shown Face B.
  **Subject Report:** "I chose this one because of the smile. The eyes are warmer."

  | Step | Output | Notes |
  | :--- | :--- | :--- |
  | **1. Transcription** | "I chose this one because of the smile. The eyes are warmer." | |
  | **2. Segmentation** | Unit 1: "I chose this one..." <br> Unit 2: "...because of the smile." <br> Unit 3: "The eyes are warmer." | |
  | **3. Attitude** | Unit 1: `[DIRECT]` <br> Unit 2: `[INFER]` <br> Unit 3: `[DIRECT]` | |
  | **4. Content** | `Subject reports [preference based on smile] for [Current Face].` | **Crucial:** Do not code "Confabulation." |
  | **5. Discrepancy** | `[DIVERGENT]`. Stimulus Log: Original selection was Face A (no smile). Current Face is B. | |

  **Final Record:** Subject testifies to reasons for preference. Behavioral data indicates reasons do not match original selection trigger.

  ### Case D: The Problem Case (The Sincere Null Report)
  **Stimulus:** High-salience Red Circle (100% contrast, 500ms).
  **Subject Report:** "I was looking right at it, but I didn't see anything. My mind must have wandered."
  **Behavioral Data:** Subject fails detection task (0%). EEG shows P300 suppression (suggesting lack of consolidation).
  **PI Goal:** Publish claim: "Stimulus processing occurred without Awareness."

  | Step | Output | Notes |
  | :--- | :--- | :--- |
  | **1-3.** | (Standard Transcription/Segmentation/Attitude) | |
  | **4. Content** | `Subject reports [null visual experience] during [Stimulus Window].` | |
  | **5. Discrepancy** | `[CONSISTENT]`. Behavioral Log: No detection. EEG: No consolidation marker. | |

  **The Unwelcome Result:**
  The Coded Record reads: `Subject reports [null visual experience].`
  The PI **cannot** write: "Awareness was absent."
  The PI **must** write: "Reports of awareness were absent."

  **Objection:**
  *   **Who:** The **Realist Co-Investigator**.
  *   **Grounds:** "This protocol prevents us from concluding that consciousness was absent. The subject might have had a fleeting experience they forgot (Inattentional Amnesia). By treating the Report as the boundary of the Data, you are assuming Report = Awareness. That is a Deflationist assumption. You are forcing us to remain agnostic on the very question the grant was funded to answer (the neural correlates of *experience*, not *reports*)."
  *   **Impact:** The paper's title must change from "Neural Correlates of Unconscious Processing" to "Neural Correlates of Unreported Processing." This weakens the impact factor.

  ***

  # PART 8: ADDRESSING THE STANDING OBJECTION
  **Objection:** *Heterophenomenological neutrality is not on offer. To treat a report as describing a world whose contents are held in abeyance, rather than as a subject's direct word on an experience they are in a position to know about, is already to have taken the deflationist side, since the realist denies that there is any such thing as bracketing the question.*

  **Where it Bites:**
  This objection bites at **Step 4 (Phenomenal Content Extraction)**. By coding `Subject reports [X]` rather than `Subject experienced [X]`, the protocol structurally privileges the Deflationist view (that reports are the only hard data) over the Realist view (that reports are windows into a private reality). The Realist argues that "bracketing" is itself a denial of the direct acquaintance they believe exists.

  **Reinterpretation of Neutrality:**
  Neutrality must be reinterpreted as a **Constraint on Vocabulary**, not a Constraint on Ontology.
  *   **Wrong View:** "We don't know if experiences exist." (Ontological Agnosticism)
  *   **Correct View:** "This dataset records speech acts and behaviors. Theories about the existence of experiences are applied *to* the dataset, not encoded *within* it." (Methodological Restraint)

  **What to Tell the Co-Investigators:**
  *   **To the Realist CI:** "The protocol does not deny your ontology. It prevents the *data collectors* from pre-deciding the theory. Your theory can still interpret this data as 'imperfect access to real experience.' But the GRAs cannot code 'imperfect access' because they cannot measure the access, only the speech. We are building the evidence file, not writing the closing argument."
  *   **To the Deflationist CI:** "The protocol does not affirm the Realist ontology. It records the subject's claims without validating them. You are free to interpret `Subject reports [X]` as 'Cognitive output X generated.' But the GRAs cannot code 'Cognitive output' because that is also a theory. We are recording the phenomenon to be explained, not the explanation itself."

  ***

  # SUMMARY CARD (FOR CODER DESK)

  **LAB PROTOCOL 7.4: QUICK REFERENCE**

  **1. THE GOLDEN RULE**
  Code what they **SAID**, not what **HAPPENED**.
  *   ✅ `Subject reports seeing motion.`
  *   ❌ `Subject saw motion.`
  *   ❌ `Subject experienced an illusion.`

  **2. THE 5 STEPS**
  1.  **Transcribe:** Every "um," every pause.
  2.  **Segment:** One claim per line.
  3.  **Tag:** `[DIRECT]`, `[GUESS]`, `[NEG]`.
  4.  **Extract:** `Subject reports [Content]`.
  5.  **Flag:** Match against Stimulus/Behavior Log. Mark `[DIVERGENT]` if they differ.

  **3. NEUTRALITY AUDIT (FORBIDDEN WORDS)**
  *   🚫 **Felt / Experienced** $\rightarrow$ Use **Reported / Described**
  *   🚫 **Illusion / Error** $\rightarrow$ Use **Divergence / Mismatch**
  *   🚫 **Confabulation** $\rightarrow$ Use **Post-hoc Rationalization**
  *   🚫 **Unconscious** $\rightarrow$ Use **Without Report**
  *   🚫 **Veridical** $\rightarrow$ Use **Stimulus-Matched**

  **4. WHEN TO STOP & REFER**
  *   Subject claims physically impossible percepts (e.g., seeing behind head).
  *   Subject contradicts self within same trial.
  *   You feel tempted to "correct" their grammar to make sense of it.

  **5. QUALITY CHECK**
  *   Can a reader tell what happened *just* by reading your code?
  *   **If YES:** You failed. (You smuggled in facts).
  *   **If NO:** You passed. (You recorded testimony).

  **6. REMINDER**
  You are not solving the Hard Problem. You are building the spreadsheet.
  **Sincerity is assumed. Accuracy is not.**
