  It rejects the idea that voting is a single mathematical act with a constant "duty" variable. Instead, it argues that the moral weight of voting shifts depending on the *type* of body you are voting in. It has three clauses:

  1.  **The Fiduciary Clause (Functional Contexts):** In small groups where your causal power is non-negligible (like a condo board or committee), voting is a **duty of office**. You are a steward of the outcome. Abstention is negligence. Cost must be proportional to the stakes; disproportionate sacrifice is wasteful.
  2.  **The Solidarity Clause (Symbolic Contexts):** In mass elections where causal power is negligible, voting is an **expressive act of membership**. Moral worth tracks the *cost* of the vote as a signal of commitment to the community, not the probability of decisiveness. High stakes (national scope) justify high cost; low stakes (local routine) do not.
  3.  **The Competence Constraint:** In both contexts, voting requires a minimum stake and knowledge. Without these, voting is noise or vandalism, worse than abstention.

  **How it maps to your 9 verdicts:**
  *   **(1) Close Presidential:** Solidarity Clause. High stakes + high tension makes the signal valuable. Skipping is a failure of solidarity.
  *   **(2) Town Council (Safe):** Solidarity Clause (Low Value). Low stakes + low tension makes the signal cheap. Skipping is morally neutral.
  *   **(3) Blizzard National:** Solidarity Clause. High cost signals high commitment to a high-scope community. Admirable.
  *   **(4) Blizzard Town:** Fiduciary/Efficiency mix. Low stakes do not justify high cost. It is wasteful "over-investment." Sad.
  *   **(5) Condo Abstainer:** Fiduciary Clause. You are a board member. Causal power is real. Abstention is negligence. Blameworthy.
  *   **(6) Landslide Voter:** Solidarity Clause. System isn't threatened, so the signal adds little value. "Guestbook." No blame for skipping.
  *   **(7) Uninformed/Australian:** Competence Constraint. Voting without knowledge degrades the signal/function. Worse than no vote.
  *   **(8) Clueless Expat:** Competence Constraint (Stake). No stake means no stewardship. Should abstain.
  *   **(9) Cost vs. Effect:** Explains your embarrassment. You noticed cost tracks admiration in Symbolic contexts (3) but not Functional ones (5). The principle validates this distinction rather than calling it incoherent.

  **Predictions for your new cases:**
  *   **Abstaining because both candidates are awful:**
      *   *National (Symbolic):* Permissible. This is an expressive signal of dissatisfaction (a "none of the above" statement).
      *   *Condo (Functional):* Blameworthy. In a fiduciary role, you must choose the lesser evil to govern. Abstaining is negligence.
  *   **Primary with 6% turnout (High Decisiveness):**
      *   *Prediction:* You **should** feel a pull. The low turnout moves the election from the Symbolic track toward the Functional track. Your causal power is now significant enough to trigger the Fiduciary Clause. Your feeling of "no extra pull" is a failure to recognize the shift in context; the principle says you are objectively more obligated here than in a general election, even if it feels the same.

  **Sacrifices:**
  I can reconcile all nine of your verdicts without overturning them, provided you accept that "voting" is not one thing but two (Stewardship vs. Solidarity). The only thing you must sacrifice is the idea that there is a single universal rule for all elections.

  Verdict: Contextual Stewardship | sacrifice: none
