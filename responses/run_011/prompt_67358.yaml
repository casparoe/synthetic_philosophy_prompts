      *   *Claim 2 (Counterfactuals = Comparability):* Minimal rewrite is for holding causal structure fixed, not plausibility.
      *   *Claim 3 (Falsifiability):* Distinguishes epistemic (can't know) vs. semantic (no truth value) indeterminacy. Accuses historicists of equivocation.
