      *   **Task:** Create a prep sheet with 7-8 specific objections, ranked by damage potential. Include phrasing, 2-minute reply, concessions, and honesty about weaknesses (dodges/promissory notes). Identify the load-bearing claim. Identify the "killer question" from the philosopher.
      *   **Tone:** Committal, honest, no padding, no reading lists. Critical feedback on the framing if necessary.

  2.  **Analyze the Thesis Claims:**
