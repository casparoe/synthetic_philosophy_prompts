      *   *Narrative Historians:* Care about contingency, specificity, context. Will hate the abstraction/simulation aspect.
      *   *Philosopher of Science:* Care about interventionist causation (Woodward-esque), semantics of counterfactuals, truth conditions. Will spot technical inconsistencies.
