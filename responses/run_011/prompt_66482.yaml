      *(Refining the "Irreversible" Claim)*: The prompt specifically mentions cryonics writing. I need to make sure the agreed claim acknowledges that "irreversible" means "cannot be reversed by current standard medical practice," not "cannot be reversed by future nanotech."

      *(Refining the Cruxes)*: The prompt asks for "predictions in advance, pre-registration style." I need to make sure these look like falsifiable conditions.

