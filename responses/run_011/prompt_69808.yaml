      *   30 mins is inside the range (Ward A does it).
      *   "There need to be real comparable units that hit that same proxy level and genuinely do have the good target values".
      *   Ward A hits 30 mins and has 95% survival.
      *   Ward B hits 30 mins and has 90% survival.
      *   This fits perfectly.

      *One more check on "No Gaming".*
      *   Staff are actually working. No falsification.

      *Ready to draft.*
answer: |-
  **Scenario**
  A municipal hospital system manages two emergency wards, North and South, with identical staffing budgets and patient demographics. Administration observes that North consistently achieves a 30-minute average "door-to-physician" wait time (the Proxy) and a 98% 30-day patient survival rate (the Target), while South averages 60 minutes and 95% survival. Assuming the wait time drives the outcome, administration mandates South match North's 30-minute threshold. To comply without new funding, South's manager reallocates senior physicians from the resuscitation bay to triage intake, clearing the queue faster. South hits the 30-minute mark, but because critical patients now wait longer for senior intervention during the "golden hour," the 30-day survival rate drops to 92%. The proxy improved, the target degraded, and no data was falsified.

  **Causal Graph**
  *   **Variables:** $U$ (Underlying Operational Efficiency), $P$ (Wait Time Proxy), $T$ (Survival Target), $I$ (Intervention/Staff Reallocation).
  *   **Arrows:**
      1.  $U \to P$ (High efficiency reduces wait times).
      2.  $U \to T$ (High efficiency improves survival via better overall coordination).
      3.  $I \to P$ (Moving staff to intake reduces wait times).
      4.  $I \to T$ (Moving staff away from resuscitation reduces survival).
  *   **Structure:** Originally, $P$ and $T$ are correlated because they share a common cause, $U$. The intervention $I$ creates a new path to $P$ that bypasses $U$, but this path has a negative causal link to $T$ due to resource contention.

  **Constraint Satisfaction**
  1.  **Noiseless Proxy:** Wait time is recorded via electronic badge-swipe timestamps at entry and triage; it is an exact physical duration, not a survey estimate or sample, eliminating regression-to-the-mean arguments.
  2.  **Interior Solution:** The 30-minute target is not an extreme extrapolation; Ward North proves that 30-minute waits are compatible with 98% survival under the same budget and demographic constraints. The failure occurs *at* the successful level, not beyond it.
  3.  **No Gaming:** Physicians are physically present and seeing patients; intake logs match actual consultations. The degradation comes from *which* patients are seen *when*, not from falsifying records or avoiding work.

  **The Single Feature Doing the Work**
  The operative feature is **zero-sum resource contention hidden from the metric**. The metric measures throughput speed (intake), while the target depends on depth of care (resuscitation), but both draw from the same fixed pool of senior physician hours. The correlation existed because Ward North had higher $U$ (efficiency), allowing them to maximize both. The intervention forced Ward South to maximize $P$ by sacrificing the resource required for $T$.

  **Counterfactual**
  If you delete the zero-sum constraint (e.g., the hospital is allowed to hire additional physicians specifically for triage), the verdict collapses. Ward South can lower wait times without pulling staff from resuscitation, meaning $T$ would remain stable or improve. The Goodhart failure relies entirely on the inability to expand the resource pool.

  **Objection Responses**
  *   **"This is just bad management, not Goodhart's Law."**
      Goodhart's Law describes the breakdown of a *control system*, not the competence of the controller. The manager acted rationally to minimize the loss function provided by administration (wait time). If the loss function omits a critical constraint (staff allocation trade-offs), that is a measurement design failure, not an execution failure. Blaming management confuses the *incentive* with the *agent*.
  *   **"A dashboard of several proxies fixes it."**
      Adding a lagged metric (e.g., monthly survival rates) to the dashboard does not solve the real-time incentive problem. Physicians respond to daily pressure (wait times) rather than monthly aggregates. Furthermore, if survival rates are noisy or risk-adjusted imperfectly, the noiseless wait-time metric will still dominate daily operational decisions (multi-tasking problem), leading to the same distortion.

  **Honesty Check**
  The verdict does not rely on stipulation. The drop in survival is derived from the structural constraint (fixed senior staff hours) and the clinical reality (resuscitation requires senior staff). It is not asserted that survival *must* drop, but that it drops *because* the intervention depletes the specific resource required for the target. The scenario holds without assuming malicious intent or data error.
