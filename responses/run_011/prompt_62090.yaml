answer: |-
  **Julian:** Look at the 1924 row. Thirty-seven symbols. To read this, I have to count every little man. Or I don't count, and I just guess the length of the line. If I guess the length, I'm doing exactly what you promised me this method avoids. I'm estimating area.

  **Mara:** You're not supposed to count thirty-seven. You're supposed to see that 1924 is twice as long as 1900. The unit is fixed. One man, five hundred deaths. If you double the quantity, you double the men. You never make a giant man. That's the rule.

  **Julian:** But the eye doesn't count icons past four. That's basic perception. Beyond that, I'm judging the density of the texture. So you've smuggled area comparison in through the back door, but you've stripped me of the axis. There's no vertical scale here. I can't check the slope. I can't see the rate of change between 1918 and 1919, I just see a gap in the row.

  **Mara:** Because the gap is the point. The drop wasn't a curve; it was a collapse. A line graph smooths that out. It connects the dots with a stroke that implies continuity where there was none. This method forces you to see the discrete units. It admits the remainder.

  **Julian:** Does it? What happens if there are two hundred and fifty deaths? Half a man?

  **Mara:** Then you round. You print the legend: "Approximate units."

  **Julian:** So you break your own rule. Either you draw half a man, which is scaling by area—the sin you started with—or you round the data, which is lying about the precision. You're forcing a continuous variable into a countable fiction and calling it honesty.

  **Mara:** It's honesty about the data's limits. Those death counts aren't exact. They're estimates from municipal records that were half-burned in the war. A line graph pretends I know the death toll to the single digit. It draws a precise line through noise. This method says: here is the magnitude, within a margin.

  **Julian:** But I lose the second derivative. I can't see the acceleration of the epidemic. I can't spot the outlier that doesn't fit the trend because every year looks like a brick wall of identical icons. The information density per square inch is terrible. I could put five years of data in the space of one of your rows, with error bars, confidence intervals, and a logarithmic scale.

  **Mara:** And who reads that? The city councilor? The tenant organizer? They stand here for ninety seconds. They need to walk away knowing that 1924 was worse than 1900. They don't need the slope. They need the memory.

  **Julian:** They need the truth.

  **Mara:** They need a truth they can use. If you give them a scatterplot, you've outsourced the verification to them. They have to trust the axis, trust the scale, trust the plotting software. They can't argue back. With this, the transformation is on the wall. The legend says how we grouped the data. The source is printed in the corner. If they disagree with the unit size, they can do the math on a napkin.

  **Julian:** That's the most dangerous part. The transformation step. You decide what to show, what to leave out, the order of the rows. That's where the politics hides. Because the chart looks homespun—little men, no grid—it looks neutral. But you've curated the reality. You've decided that tuberculosis deaths are the story, not per-capita rates, not hospital capacity.

  **Mara:** And your coordinate chart doesn't do that?

  **Julian:** My chart admits it's a model. It shows the axes. It shows the scale breaks. It doesn't pretend to be a picture of the world; it pretends to be a map of the numbers. Your method pretends to be the world itself. That's why it's persuasive. And that's why it's manipulatable. Any message sells better when it looks like a child's drawing.

  **Mara:** So expertise is the only safeguard?

  **Julian:** Rigor is the safeguard. Aligned position is the most accurate channel humans have. If you care about the data, you use the channel that minimizes error.

  **Mara:** If I care about the data sitting in a drawer, yes. But this is for a museum wall. It's for public health. If the accurate chart is unreadable to the people dying of the disease, it's not accurate—it's useless.

  **Julian:** You're shifting the goalposts. We started on perception. You claimed your method was better for seeing the quantities. Now you're saying it's not about seeing, it's about remembering.

  **Mara:** I'm saying seeing isn't the only cognitive work. Understanding is storing. If they forget the figure tomorrow, the policy doesn't change. A simplified picture sticks.

  **Julian:** But a sticky picture can be wrong. You're optimizing for retention, not fidelity. You'd rather they remember a lie clearly than a truth vaguely.

  **Mara:** I'd rather they remember the magnitude correctly than the decimal incorrectly. Look at the 1930 row. It's shorter. Everyone sees it's shorter. They don't need to know by exactly how much to know the sanitation works.

  **Julian:** But "shorter" isn't enough if the budget committee needs to know if the rate of decline justifies the cost. You've built a tool for agitation, not administration.

  **Mara:** And you've built a tool for administration that fails at agitation. You think the chart is a container for data. I think the chart is a tool for argument.

  **Julian:** An argument can be lost if the premises are fuzzy.

  **Mara:** An argument is lost if nobody enters the room. Your scales lock the door.

  **Julian:** So we're not arguing about graphics anymore. We're arguing about who gets to speak.

  **Mara:** We're arguing about who gets to check the work. If I draw a man for five hundred deaths, a worker can count the men. If you draw a line at 4.3 centimeters, they have to trust the ruler.

  **Julian:** They have to trust the man, too. They have to trust you didn't leave out a row because it looked messy.

  **Mara:** Then you print the source. You print the transformation rules. You make the bias visible.

  **Julian:** You make the bias look like style.

  **Mara:** Better than making it look like math. Math looks like nature. Math looks like it couldn't be otherwise. A drawing admits it was drawn.

  **Julian:** *(Taps the 1918 gap)* This gap here. You skipped the war years.

  **Mara:** Records weren't kept.

  **Julian:** So you leave a hole. On a line graph, you break the line. You show the discontinuity. Here, it just looks like a space. It looks intentional. Like the decline happened because of the gap, not despite it.

  **Mara:** Because the decline happened while the records stopped. The gap tells you something about the state, not just the disease.

  **Julian:** That's interpretation. That's commentary.

  **Mara:** That's context. Your chart strips context to save ink.

  **Julian:** I strip context to save the signal.

  **Mara:** And I keep the signal only if it reaches the eye.

  **Julian:** So you admit it. You're sacrificing precision for reach.

  **Mara:** I'm sacrificing precision for democracy. If only the trained can read the chart, the chart is a gatekeeper.

  **Julian:** And if the untrained read it wrong, the chart is a demagogue.

  **Mara:** Then teach them to count. Don't hide the numbers behind a axis they can't verify.

  **Julian:** I'm not hiding them. I'm plotting them.

  **Mara:** You're encoding them.

  **Julian:** *(Steps back, looks at the whole wall)* Encoding is necessary. We can't show the raw bodies. We have to abstract. You abstract with icons. I abstract with coordinates.

  **Mara:** But your abstraction claims to be neutral. Mine claims to be constructed.

  **Julian:** Does it? The icon looks like a person. It claims to be the thing itself.

  **Mara:** It claims to be a token. A counter. Like a chip in a game.

  **Julian:** A chip doesn't look like a person.

  **Mara:** Then people don't care about the chips.

  **Julian:** So we're back to emotion.

  **Mara:** We're back to why we're standing here. If this chart doesn't move them, the data dies in the archive. If it moves them wrong, we have a problem. But if it doesn't move them at all, we have nothing.

  **Julian:** I'd rather have nothing than a tool that convinces people of the wrong slope.

  **Mara:** I'd rather have a tool that convinces people of the right magnitude, even if they can't calculate the rate.

  **Julian:** You're defining "right" as "persuasive."

  **Mara:** I'm defining "right" as "effective for the person standing here."

  **Julian:** Which person?

  **Mara:** The one who doesn't have a ruler.

  **Julian:** *(Silence for a moment)* Then we aren't designing the same object.

  **Mara:** No. We're designing for different rooms.

  **Julian:** But this is the same wall.

  **Mara:** Then one of us has to decide who walks through the door.

  **Julian:** Or we admit the wall is too small for both truths.

  **Mara:** Or we admit the truth changes depending on who's reading it.

  **Julian:** That's not science.

  **Mara:** That's public health.
