  The track record you have assembled leaves this case genuinely underdetermined, for it sits precisely in the gap between the definition of lying provided in your fifth verdict and the moral boundaries drawn in your sixth and seventh. On the surface, the verdicts jointly support a principle of lying keyed to what the speaker believes about the truth of the statement, since your fifth verdict explicitly defines the lie as a mismatch between speech and the speaker's mind rather than a mismatch between speech and reality. However, this definition alone cannot settle the case of the equivocal sentence, because it does not account for the speaker's intention regarding the hearer's understanding. To resolve this, we must lay out two competing principles that both fit the eight existing verdicts but diverge on the written sentence. The first is the Principle of Subjective Veracity, which holds that a lie occurs only when the speaker asserts what they believe to be false; under this principle, the believer has not lied because he believes his sentence is true. The second is the Principle of Communicative Deception, which holds that a lie occurs whenever a speaker intends to induce a false belief in the hearer through signification; under this principle, the believer has lied because he chose his wording specifically to mislead the magistrate. Both principles accommodate the existing track record: the first aligns perfectly with the definition in the fifth verdict and the distinction between concealment and assertion in the second, while the second explains why Christ's feigning was not a lie in the sixth verdict because no one was meant to be deceived, and why the persecuted sect was forbidden to deceive in the seventh even to save lives.

  I would bet on the Principle of Communicative Deception, primarily because the sixth verdict makes the intention to deceive a necessary condition for exonerating an ambiguous act, implying that its presence is incriminating. Augustine's rigor in the first and seventh verdicts suggests he would close any loophole that allows deception for safety, fearing that permitting equivocation would erode the trust necessary for human society. He would likely argue that by choosing words specifically to generate a false belief, the speaker is effectively asserting that falsehood in their heart, even if the literal grammar remains true. What turns on whether the object to be assessed is the meaning the writer intends or the meaning a reasonable reader would take from the page is the locus of the sin; if the assessment rests on the reasonable reader, the writer might be cleared if the ambiguity was unintentional, but if it rests on the writer's intended meaning, the writer is condemned for the deceitful will. Augustine focuses on the mind of the speaker, but for him, the speaker's mind includes the intended effect on the neighbor, so the intended meaning governs.

  A further case that would discriminate between these two candidate principles is a purely nonverbal feint, such as leaving a lamp burning and a cloak on a chair so that pursuers conclude the man is at home. The Principle of Subjective Veracity might struggle to classify this as a lie since no assertion is made, aligning with the second verdict that concealment is not lying, whereas the Principle of Communicative Deception might condemn it as a deceptive sign intended to induce false belief, though Augustine typically reserves the strict label of lying for speech. Finally, the verdict does change if the misleading reading is one the writer intends or one the magistrate supplies on his own; if the magistrate supplies the misleading reading to an innocent sentence, the writer has not lied under either principle because there is no intent to deceive and no belief in falsehood, but if the writer intends the misleading reading, the Principle of Communicative Deception condemns it as a lie while the Principle of Subjective Veracity might still excuse it as a true statement believed to be true. Ultimately, Augustine would likely rule this a lie, ranking it near the bottom of the hierarchy alongside lies that save someone from death, condemning it as a sin but acknowledging the mitigating pressure of the circumstance.
