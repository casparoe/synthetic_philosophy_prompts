      *   **Core Question:** Why do philosophers treat norms of assertion (Knowledge vs. Truth vs. Justification) as *competing substantive norms* if the Knowledge Norm is claimed to be *constitutive* (like the rules of a game)? If it's constitutive, doesn't that make non-knowledge assertions impossible (by definition), rendering the debate verbal/stipulative rather than substantive?
