      *   **Constitutive vs. Regulative:**
          *   *Regulative:* Rules that govern an existing activity (e.g., "Drive on the right" regulates driving). You can drive on the left; you're just breaking the rule.
          *   *Constitutive:* Rules that define the activity itself (e.g., "Checkmate ends the game" constitutes chess). If you don't follow them, are you playing chess?
      *   **The User's Objection:** If KNA is constitutive, then asserting without knowledge is *not asserting*. Therefore, Truth/Justification norms aren't rivals; they describe *different* acts. The debate becomes verbal.
      *   **The Philosopher's Counter (Why they persist):**
          1.  **Gradience/Defectiveness:** Constitutive rules allow for *defective* instances. A foul in basketball is still basketball, but it breaks a constitutive rule. An assertion without knowledge is still an assertion, but a *bad* or *improper* one.
          2.  **Explanatory Power:** The claim isn't just "This is what assertion is." It's "This rule best explains the *data* about assertion (e.g., Moore's paradox, challenges like 'How do you know?', retraction practices)."
          3.  **Competing Constitutive Claims:** Rivals (Truth, Justification) also claim to be constitutive. It's not KNA (Constitutive) vs. Truth (Regulative). It's KNA (Constitutive) vs. Truth (Constitutive).
