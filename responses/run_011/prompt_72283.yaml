      *   **Core Question:** Comparing John von Neumann's *The Computer and the Brain* (1958) with Claude Shannon's Information Theory (1948). Specifically, why did vN claim the brain needs a "new notation/mathematics" when Shannon had already provided a rigorous framework for noisy channels (redundancy, error correction)?
      *   **Specific Tasks:**
