      3.  The Statistical Reduction (It's just overfitting).
      4.  The Opacity/Unknowability Problem (Counterfactuals are hard).

      *Wait, I need to check the "Predictive Differences" part.* A standard Bayesian repair (like Garber's solution) allows old evidence to confirm by conditioning on the *logical relation* $T \vdash E$. The user's view says *no*. So the difference is: Garber says GR *is* confirmed by Mercury (via the entailment relation); User says GR is *not* confirmed by Mercury (only by the fact Einstein didn't know it). This is a clear divergence.

