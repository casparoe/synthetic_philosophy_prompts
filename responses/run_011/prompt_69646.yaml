      *   Did I identify unsatisfiable subsets? Yes.
      *   Did I address the Mirror Condition specifically? Yes.
      *   Did I include the uncertainty/bias section? Yes.
      *   Is the tone appropriate? Yes, academic but direct.

  10. **Final Polish:** Ensure the distinction between *moral standing* (liability/rights) and *legal/conventional standing* is clear, as that's often where the Lawyer and Philosopher talk past each other. The Lawyer is often arguing for *International Humanitarian Law (IHL)* compatibility, the Philosopher for *Just War Theory (JWT)* truth.

      *(Self-Correction during drafting)*: Make sure I don't just say "Revisionism says X." I need to frame it as a requirement for the *theory* to handle the case.
      *(Refining the Mirror Condition)*: The prompt asks to number it on the list. I will put it as Item 5.
      *(Refining Unsatisfiability)*: Be explicit. "You can pick two of three."

  11. **Final Review against Prompt:**
      *   "Write the desiderata..." -> Done.
      *   "Flag every item..." -> Done.
