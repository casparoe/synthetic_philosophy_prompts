answer: |-
  ### Specification of Desiderata for a Theory of Combatant Moral Standing

  This document outlines the necessary conditions for a theory of combatant moral standing to be considered adequate. It distinguishes between constraints required by the nature of moral agency and war itself (Non-Negotiable) and constraints demanded by specific theoretical traditions (Camp-Specific).

  #### 1. The Liability/Blameworthiness Distinction
  **Requirement:** The theory must distinguish between a combatant's *liability to defensive harm* and their *moral culpability* for participating in the war.
  **Motivating Case:** The conscript fighting for the aggressor state who is personally doing nothing wrong (coerced, misinformed, or merely fulfilling a civic duty).
  **Status:** **Non-Negotiable.**
  **Reasoning:** A theory that conflates liability with culpability cannot explain why it is permissible to kill a conscript who is not morally blameworthy. If liability requires culpability, most combatants become immune to attack, rendering war impossible. If liability does not require culpability, the theory must explain *what* grounds the liability (e.g., threat creation vs. moral responsibility).

  #### 2. The Independence of *Jus in Bello* (JIB) from *Jus ad Bellum* (JAB)
  **Requirement:** The theory must account for the moral force of conduct constraints (torture, targeting civilians) even when the cause is just.
  **Motivating Case:** The combatant on the just side who is committing atrocities while pursuing a just cause.
  **Status:** **Non-Negotiable.**
  **Reasoning:** A just cause does not license unlimited means. Any theory that allows JIB violations to be "washed out" by JAB justification fails to protect the basic rights of non-combatants and fails to match our deepest moral intuitions about means-ends reasoning.

  #### 3. The Symmetry of Unjust Conflict
  **Requirement:** The theory must generate verdicts in wars where *neither* side has a just cause.
  **Motivating Case:** A war of pure aggression vs. aggression (e.g., two dictators fighting over territory with no self-defense claim available to either).
  **Status:** **Non-Negotiable.**
  **Reasoning:** If a theory relies on the existence of a "Just Combatant" to anchor the permissions of the "Unjust Combatant" (via symmetry), it collapses when both sides are unjust. The theory must explain the moral standing of combatants without relying on the moral privilege of their opponent.

  #### 4. The Epistemic Accessibility Constraint (The "19-Year-Old" Test)
  **Requirement:** The theory's action-guiding prescriptions must be executable by a combatant operating under severe epistemic poverty (limited intel, propaganda, fog of war).
  **Motivating Case:** The soldier who cannot verify their government's *casus belli*.
  **Status:** **Camp-Specific (Traditionalist/Pragmatist).**
  **Reasoning:** **Traditionalists** argue this is non-negotiable because a moral theory that demands impossible knowledge is useless and dangerous. **Revisionists** argue this is a constraint on *law* or *policy*, not on *moral truth*. A theory of moral standing describes who is actually liable, not what it is reasonable to believe. Including this as a hard constraint on *moral truth* risks conflating "what is right" with "what is excusable."

  #### 5. The Mirror Condition (Reciprocal Permission)
  **Requirement:** For any two combatants A and B facing each other, the theory's verdict on whether A may target B and whether B may target A must be identical (both permitted or both forbidden).
  **Motivating Case:** The intuition that war is a symmetrical practice; if I am a legitimate target, you must be a legitimate shooter, and vice versa.
  **Status:** **Camp-Specific (Traditionalist).**
  **Reasoning:** **Traditionalists** treat this as axiomatic for the coherence of war as a regulated institution. **Revisionists** reject this as morally false. If A is an unjust aggressor and B is a just defender, B has a right of self-defense that A lacks. A may not kill B; B may kill A. The verdicts are asymmetrical.
  **Survival Analysis:** This condition **does not survive** contact with the Liability/Blameworthiness Distinction (Item 1) if liability is grounded in moral responsibility for unjust threats. To keep it, it must be weakened to **Institutional Symmetry**: "Under the *laws* of war, permissions are symmetrical," acknowledging that deep *moral* permissions may not be.

  #### 6. The Remote Killing Constraint
  **Requirement:** The theory must account for the moral standing of combatants who kill without assuming reciprocal risk.
  **Motivating Case:** The pilot or drone operator killing from 8,000 kilometers away with no physical danger to themselves.
  **Status:** **Non-Negotiable (with caveats).**
  **Reasoning:** A theory cannot ignore the technological reality of modern war. However, whether risk-reciprocity is a *condition* for the right to kill is debated. If risk is required, remote warfare is impermissible. If risk is irrelevant, the theory must explain why ground troops aren't merely suicide bait. The theory must take a stance, not ignore the asymmetry.

  #### 7. The Institutional Efficacy Constraint
  **Requirement:** The theory must not prescribe norms that, if adopted, would predictably increase overall suffering or prolong conflict compared to the prevailing alternative.
  **Motivating Case:** A "true" moral theory that, if taught to soldiers, leads to more atrocities or more ruthless fighting because it removes the protective convention of symmetry.
  **Status:** **Camp-Specific (Consequentialist/Traditionalist).**
  **Reasoning:** **Revisionists** often treat this as secondary to moral truth (we shouldn't lie about morality to make war nicer). **Traditionalists** argue that the ethics of war is inherently institutional; a theory that destroys the institution's ability to limit violence is self-defeating.

  ---

  ### Joint Unsatisfiability: The Trilemma of War Ethics

  The following three desiderata are **jointly unsatisfiable**. A theory can satisfy any two, but not all three.

  1.  **Moral Truth (Revisionist):** Combatant liability tracks objective moral responsibility (Unjust combatants are liable; Just combatants are not).
  2.  **Symmetry (Traditionalist):** Combatants on both sides have equal permissions and liabilities (The Mirror Condition).
  3.  **Epistemic Accessibility (Pragmatist):** Soldiers can know their status and permissions ex ante (The 19-Year-Old Test).

  *   **If you keep 1 & 2:** You violate 3. If liability tracks truth but permissions are symmetrical, soldiers cannot know if they are liable or permitted without knowing the objective justice of the war (which they can't know).
  *   **If you keep 2 & 3:** You violate 1. If permissions are symmetrical and knowable, they cannot track objective moral responsibility (since responsibility is asymmetrical between aggressor and defender). This yields the Traditionalist view (MEC).
  *   **If you keep 1 & 3:** You violate 2. If liability tracks truth and soldiers can know it, permissions must be asymmetrical (Just soldiers know they may fight; Unjust soldiers know they must stop). This yields a radical Revisionist view that arguably delegitimizes the enemy's surrender rights.

  **Thesis Implication:** Your chapter cannot argue for a theory that satisfies all three. You must explicitly argue for which constraint yields.

  ---

  ### Uncertainty, Bias, and Vulnerability

  **1. The Item I Would Drop First:**
  Under pressure, I would drop **Item 5 (The Mirror Condition)** in its strong form. It is the most fragile link. It relies on a conception of war as a "fair fight" or a game, rather than a series of violent interactions grounded in self-defense and liability. Once you accept that killing is only justified by necessity or liability, strict symmetry becomes untenable. It should be downgraded to a *legal* convention, not a *moral* requirement.

  **2. My Hidden Bias:**
  I am quietly motivated to include **Item 1 (Liability/Blameworthiness Distinction)** as Non-Negotiable because I lean toward the **Revisionist** side. It feels philosophically incoherent to say someone is liable to be killed when they are doing nothing wrong. However, I acknowledge that making this Non-Negotiable rigs the game against the Traditionalist before the argument starts. A Traditionalist would argue that *participation in a collective threat* is itself a wrong that grounds liability, rendering the distinction less sharp than I prefer.

  **3. What Would Change My Mind:**
  I would drop the demand for **Moral Truth (Item 1)** if presented with robust empirical evidence that **Institutional Efficacy (Item 7)** is strictly dependent on it. If it could be demonstrated that adopting a Revisionist morality (asymmetrical liability) leads to a measurable increase in civilian casualties or a decrease in POW surrender rates compared to the Traditionalist convention, I would concede that the "truth" of moral standing is less important than the "function" of the norm. If the "false" theory saves more lives, the "true" theory is ethically inferior in this specific domain.

  **4. Where This Spec Is Most Likely Wrong:**
  This spec assumes a binary between "Traditionalist" and "Revisionist." The most likely error is ignoring **Hybrid Accounts** (e.g., *Institutional Revisionism*). These theories argue that Moral Truth is asymmetrical (Revisionist), but the *normative framework for soldiers* should remain symmetrical (Traditionalist) due to epistemic limits. This spec forces a choice between truth and guidance that a sophisticated hybrid theory might dissolve by separating the *ethics of war* (for leaders/theorists) from the *ethics of fighting* (for soldiers). If your co-author is arguing for the latter and you for the former, this spec may be forcing a conflict where a division of labor is the actual solution.
