answer: |-
  This is an exceptionally sharp diagnosis for someone without formal training. You have identified the fault line more accurately than many graduate seminars do. You are correct that the debate has stagnated, and your intuition that this is a clash of theoretical virtues rather than empirical facts is largely right.

  However, as a professional in this field, I need to push back on one specific premise before we proceed: the claim that they *never* disagree on concrete cases. They mostly do, but the disagreement lurks in the counterfactuals and the margins.

  Here is the breakdown you requested.

  ### 1. Brainstorming Candidate Diagnoses

  Let's lay out the possible reasons for this 35-year stalemate.

  *   **Verbal Dispute:** They are using the word "intention" or "collective" to mean different things.
      *   *Verdict:* Unlikely to be the whole story. They know they are defining terms differently; they claim their definitions carve nature at the joints. If it were merely verbal, they would agree to disagree and move on. They don't, because they think the other side is *missing something real*.
  *   **Substantive but Underdetermined:** There is a fact of the matter about whether a "plural subject" exists, but no empirical evidence could ever settle it.
      *   *Verdict:* Plausible. This is the standard metaphysical stalemate. If "plural subjects" are non-natural entities, science can't touch them. But this makes the debate suspiciously immune to revision.
  *   **Two Different Questions Under One Name:** One camp is doing cognitive science (how is this represented?), the other is doing social ontology/normativity (what obligations does this create?).
      *   *Verdict:* Strong contender. This matches your "Metaphysics vs. Normativity" hunch. Bratman is closer to cognitive architecture; Gilbert is closer to social contract theory.
  *   **Methodological Ideology (Individualism vs. Holism):** The disagreement is a pre-theoretic commitment. Individualists *refuse* to posit group minds; Holists *refuse* to reduce social facts to individual states.
      *   *Verdict:* Very Strong. This is the engine driving the "Two Questions" diagnosis. It's a clash of aesthetic and methodological values (parsimony vs. phenomenological accuracy).
  *   **Ill-Posed / Category Error:** The question "Is it *really* one action or two?" assumes a binary where there is a spectrum or a different category entirely.
      *   *Verdict:* Possible. Action individuation is notoriously messy. But this feels like a way to dissolve the problem rather than solve it.

  ### 2. The Verdict: Methodological Individualism vs. Normative Phenomenology

  I commit to a hybrid of **Two Different Questions** and **Methodological Ideology**.

  Your hypothesis is about 90% correct. The 10% correction is this: It is not just that they have different "theoretical roles." It is that they are optimizing for different **theoretical virtues**, and they refuse to acknowledge that they are trading off against each other.

  *   **Bratman (and Searle, mostly):** Optimizing for **Ontological Parsimony** and **Naturalism**. They want to explain social action without positing spooky "group minds" that don't fit into a scientific worldview. Their cost is that they struggle to explain the *normative force* (the "ought") of joint action. Why do I owe you an explanation if I quit? Bratman has to derive this from individual rationality, which often feels thin.
  *   **Gilbert (and Tuomela's We-Mode):** Optimizing for **Normative Phenomenology**. They start from the intuition that when we act together, I am *bound* to you in a way that isn't just me predicting you. Their cost is **Ontological Inflation**. They have to posit a "plural subject" that sounds metaphysically dubious to a naturalist.

  **Where your hypothesis needs tweaking:** You suggested they agree on all concrete cases. They agree on the *behavior*, but they disagree on the **conditions of success** and the **counterfactuals**.
  *   *Example:* If we are painting a house together, and I silently decide to stop painting and just watch you, but I don't tell you.
      *   **Bratman:** I have violated the interlocking plan. Our shared intention dissolves because the meshing sub-plans are broken.
      *   **Gilbert:** I have violated a joint commitment. The plural subject persists, but I am now liable to rebuke. The "we" survives my defection until the commitment is rescinded.
      *   *Difference:* For Bratman, the collective action *stops* when the psychological interlock breaks. For Gilbert, the collective bond *persists* as a normative violation. This is a factual disagreement about the status of the relationship, not just a label.

  ### 3. Testing the Diagnosis on Concrete Cases

  Let's run my diagnosis (that this is a clash of Parsimony vs. Normativity) over your cases to see if it predicts divergence.

  **Case A: Pair Programming (The Refactor)**
  *   **Scenario:** We are refactoring a module. We agree on the goal. Midway, I get bored and start browsing Hacker News while you type.
  *   **Bratmanian Prediction:** Our shared intention collapses. I no longer have the intention to support your sub-plan. We are no longer acting jointly. I am just a guy sitting next to you.
  *   **Gilbertian Prediction:** We are still a plural subject, but I am a defector. You are entitled to rebuke me ("Hey, we're doing this together!"). The obligation persists even if my psychology shifts.
  *   **Diagnosis Check:** This predicts a difference in **normative judgment**, not observable behavior. If we ask, "Did they stop working together *at the moment* he clicked the tab?" Bratman says yes. Gilbert says no (the commitment holds until dissolved).
  *   **Result:** The dispute is not idle here. It matters for accountability. But empirically, an observer sees the same slackening of effort.

  **Case B: Chimps Pulling a Rope**
  *   **Scenario:** Two chimps pull ends of a rope to get a food tray. If one lets go, the food doesn't move. They wait for each other.
  *   **Consensus:** Almost everyone (including Tomasello, Bratman, Gilbert) agrees this is **not** full-blown collective intentionality. It is coordinated individual action.
  *   **Diagnosis Check:** Here, the camps converge. Why? Because the "Normative Phenomenology" is missing. You can't rebuke a chimp for letting go in the name of *our* goal; you can only react to your own lost food.
  *   **Result:** This suggests the "Normativity" criterion is the real differentiator. If there's no entitlement to rebuke, Individualists and Holists alike classify it as "I-mode." This supports your view that the core dispute is about the *bindingness*, not the coordination.

  **Case C: Infant Pointing (12 months)**
  *   **Scenario:** An infant points at a bird, looks at the parent, looks back at the bird, seeking shared attention.
  *   **Bratman/Empiricist:** This is proto-collective. It lacks the complex planning states of shared intention. It's a precursor.
  *   **Gilbert:** Can an infant enter a joint commitment? Gilbert requires mutual recognition of the commitment. If the infant lacks the concept of "commitment," can there be a plural subject?
  *   **Diagnosis Check:** Here is where the **Methodological Ideology** creates a genuine classification split.
      *   If you prioritize **Naturalism/Continuity** (Bratman/Tomasello), you call this "shared intentionality" to show the evolutionary bridge.
      *   If you prioritize **Normative Rigor** (Gilbert), you must say this is *not* yet a "we," because the infant cannot hold the requisite obligations.
  *   **Result:** This is a real disagreement. It determines whether we see human sociality as a gradual slope (Individualists) or a phase shift upon entering the space of obligations (Holists).

  ### 4. Is the Dispute Idle?

  You asked me to be blunt.

  **Regarding Metaphysics:** Yes, it is largely idle. Whether there is a "plural subject" floating above us or just interlocking brains makes no difference to the physics of the world. No experiment can detect a "plural subject" distinct from the individuals and their interactions. If Gilbert's "plural subject" does no causal work other than describing the pattern of individual interactions and obligations, it is an ontological ghost.

  **Regarding Normativity and Law:** No, it is not idle. The Gilbertian model maps much better onto legal and ethical practices.
  *   *Contract Law:* A contract creates obligations that persist even if one party psychologically disengages (until formally rescinded). This is Gilbertian, not Bratmanian.
  *   *Conspiracy:* In law, a conspiracy can exist even if one member is secretly an informant (defecting psychologically). The joint commitment binds them legally.

  So, the dispute is **metaphysically idle but pragmatically vital**. The philosophers often pretend they are doing metaphysics when they are actually arguing about the foundation of social norms.

  ### 5. What Would Count as Progress?

  Since I am forbidden from giving you a reading list, I will tell you what would actually move the needle.

  **1. Formal Modeling (Game Theory / Team Reasoning)**
  You mentioned team reasoning. This is the most promising technical avenue. Standard game theory assumes individual payoff maximization. "Team Reasoning" (Bacharach, Sugden) models agents who maximize *group* payoff as a primitive.
  *   *Progress Condition:* If Team Reasoning can be shown to be **computationally reducible** to individual reasoning with specific belief structures, Bratman wins. If Team Reasoning requires a fundamentally different utility function that cannot be decomposed without loss of predictive power, Gilbert/Tuomela win.
  *   *Current Status:* It currently just relocates the problem. You have to assume the agent *identifies* with the group. Why? Back to square one.

  **2. Developmental "Rebuke" Experiments**
  We need experiments that isolate the **normative expectation** from the **instrumental expectation**.
  *   *Setup:* Toddlers collaborating on a task. One partner defects.
  *   *Measurement:* Does the remaining child rebuke the defector *in the name of the goal* ("We are doing this!") vs. merely expressing frustration at the outcome ("No food!").
  *   *Progress Condition:* If children rebuke before they have the cognitive capacity for complex "interlocking plans" (Bratman's requirement), then Bratman's cognitive bar is too high. If rebuke only comes after complex planning capacity emerges, Bratman is vindicated.
  *   *Note:* Tomasello has done work here, but the interpretation is still fought over.

  **3. A Change of Question (The Pragmatic Turn)**
  The most likely "progress" is philosophical dissolution. We stop asking "Is it *really* collective?" and start asking "What level of description is useful for this context?"
  *   For **Cognitive Science**: Use Bratman. It maps to neural implementation.
  *   For **Sociology/Law**: Use Gilbert. It maps to institutions and accountability.
  *   *Progress:* Acknowledging that "Collective Intentionality" is not a natural kind (like "water" or "gold") but a **functional kind** (like "chair" or "currency"). A chair is whatever we sit on; a joint action is whatever we hold each other accountable for.

  ### Summary Critique of Your Hypothesis

  You were right that the stalemate is stable because of asymmetrical explanatory burdens (Bratman on normativity, Gilbert on ontology). You were right that it smells like two different projects.

  You were slightly too optimistic that they agree on all concrete cases. They disagree on the **persistence conditions** of the joint action (does it end when I check out mentally, or when I tell you?).

  But your core insight stands: This is not a debate about what is happening in the world. It is a debate about whether we prioritize a **clean ontology** (nothing but individuals exist) or a **rich normativity** (obligations are real and irreducible). Until one side convinces the other that their theoretical virtue is more important than the other's, the circle will continue.

  As an engineer, you might view this as a **layering violation**. Bratman is trying to implement the Social Layer entirely within the Individual Layer. Gilbert is insisting the Social Layer has its own API that the Individual Layer must call. Both work, but they compile differently. The "bug" is assuming only one compilation target is the "true" one.
