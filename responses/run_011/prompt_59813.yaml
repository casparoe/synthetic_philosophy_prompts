  # INSTRUCTOR'S GUIDE & META-COMMENTARY

  ### 1. Defense of Node Ordering
  The tree is ordered **diagnostically rather than historically**. The first split (Question 1: The Surgeon) is the most fundamental fault line: it separates those who view responsibility-sensitivity as a requirement of *justice itself* from those who view it as a *concession* to incentives or social utility. This is the most diagnostic sequence because students frequently claim the label "luck egalitarian" while holding the "concession" view (Leaf 1 or 2). By forcing this choice first, we prevent the conflation of Prioritarianism/Social Egalitarianism with Luck Egalitarianism. The subsequent nodes move from the *metric* of equality (Currency) to the *validity* of the agent's choice (Constitutive Luck), and finally to the *severity* of the penalty. This mirrors the logical dependency of the theory: one must decide *why* we care about responsibility before deciding *what* counts as a choice and *how much* it costs the agent.

  ### 2. Case Load-Bearing Analysis
  *   **Most Load-Bearing:** **The Surgeon (Question 1).** This case does the heaviest lifting because it isolates the "fairness vs. concession" distinction without the noise of imprudence. Students often hide behind the "imprudent don't deserve help" intuition to justify inequality, but the Surgeon case forces them to admit whether natural talent differences are *inherently* unjust. If they say no, they are logically barred from the core Luck Egalitarian leaves (4–8).
  *   **Least Load-Bearing:** **The Coastal Resident (Embedded in Question 2B).** This case is deliberately paired with the Violinist. While pedagogically useful for illustrating "expensive tastes," it rarely separates views that the Violinist case does not already separate. A student who refuses to subsidize the Violinist will almost invariably refuse to subsidize the Coastal Resident. It serves as a check for consistency rather than a primary branching node, which is why it is nested as a note rather than a full question.

  ### 3. Limits of the Instrument
  **Indistinguishable Leaves:** The tree cannot reliably separate **Leaf 2 (Social Egalitarianism)** from **Leaf 1 (Prioritarianism)** in all practical instances. Both views often recommend similar policy outcomes (helping the worst-off), and a student may answer "Ensure Status" while actually prioritizing well-being, or vice versa, without realizing the divergence occurs only in edge cases (e.g., when raising status lowers well-being).
  **Advice for Students:** If you land on Leaf 1 or 2, you must ask yourself a follow-up question: *"If I could slightly increase the income of the poorest but it would make them feel more stigmatized by society, would I still do it?"* A "Yes" confirms Prioritarianism; a "No" confirms Social Egalitarianism.

  **Diagnosis of Unoccupied Regions:**
  *   **Leaf 3 (Harsh Concessionism):** I diagnose this as **Coherent but Unattractive**. It is logically possible to view redistribution as purely pragmatic (incentives) while viewing personal suffering as purely moralistic (desert). However, no major theorist defends this because the pragmatic justification for redistribution usually undermines the moralistic justification for abandoning the imprudent.
  *   **Leaf 9 (Incoherent Welfare-Hardness):** I diagnose this as **Incoherent**. If the *currency* of justice is welfare (satisfaction), then allowing a person to remain in misery due to "choice" contradicts the goal of equalizing welfare, unless one argues the choice *itself* provides welfare (which is a different argument). It represents a category error between metric and responsibility.
