answer: |-
  # HANDOUT: MAPPING YOUR COMMITMENTS ON RESPONSIBILITY AND EQUALITY

  **Instructions:** Read the starting commitment below. Proceed through the four questions in order. At each step, choose the answer that best reflects your immediate judgment about the case described. Follow the arrows to your final position at one of the nine leaves. Work time: 20 minutes.

  **Starting Commitment:** *It is unfair, and therefore a matter for collective correction, when some people end up worse off than others through no fault or choice of their own.*

  ---

  ### QUESTION 1: The Surgeon and the Neighbor
  A highly skilled surgeon earns significantly more than her less talented neighbor, solely because the market rewards her specific natural gifts. Both work equally hard.
  **Is this inequality unfair *in itself*, requiring correction even if taxing the surgeon might reduce her willingness to work?**

  *   **(A) No.** The inequality is not inherently unfair; we might tax her only to help the poor, not because she doesn't deserve the money. → **Go to Question 2A**
  *   **(B) Yes.** The inequality is inherently unfair; she does not deserve the extra income simply because she was born with better hands. → **Go to Question 2B**

  ---

  ### QUESTION 2A (If you answered No): The Basis of Correction
  Since you believe the surgeon's advantage is not inherently unfair, we must decide why we help the worse-off at all.
  **Do we help the worse-off primarily to raise their absolute level of well-being, or to ensure they are not treated as inferiors in social life?**

  *   **(A) Raise Well-being.** The goal is to make the poorest people as well-off as possible, even if gaps remain. → **LEAF 1**
  *   **(B) Ensure Status.** The goal is to ensure no one is dominated or stigmatized, even if some remain materially poorer. → **LEAF 2**

  *(Return to Question 1 for a moment)*: If you answered **(A) No** to the Surgeon, but you also believe that people who make reckless choices should receive **no help at all** (even if they suffer greatly), → **LEAF 3**

  ---

  ### QUESTION 2B (If you answered Yes): The Currency of Equality
  You believe the surgeon's advantage is unfair. Now we must decide what exactly we should equalize.
  **Consider a violinist who has cultivated a taste for a rare, expensive instrument. She works as hard as her colleagues but needs more money to be equally satisfied. Should we give her extra resources to match their satisfaction?**

  *   **(A) Yes.** Equality is about satisfaction (welfare); if she needs more to be as happy, she gets more. → **Go to Question 3A**
  *   **(B) No.** Equality is about resources (opportunities/stuff); if she chose expensive tastes, she gets the same budget as everyone else. → **Go to Question 3B**

  *(Note on the Coastal Resident)*: If you answered **(A) Yes**, consider a resident who chose to live in an expensive city for the surf rather than take higher pay elsewhere. If you would **not** subsidize his rent, circle back and answer **(B) No**.

  ---

  ### QUESTION 3A (If you chose Welfare): The Validity of Choice
  You want to equalize satisfaction. But consider the firefighter who chose a dangerous job because growing up poor made risky, high-pay work seem like the only option.
  **Given that his background shaped his values, can we truly say his injury was his "fault"?**

  *   **(A) No, it wasn't his fault.** His background excuses the choice; we should compensate him fully. → **LEAF 4**
  *   **(B) Yes, it was his fault.** He made the decision; we treat him as responsible despite his background. → **LEAF 5**

  ---

  ### QUESTION 3B (If you chose Resources): The Validity of Choice
  You want to equalize resources. Return to the firefighter who chose a dangerous job due to a constrained background.
  **Given that his background shaped his values, can we truly say his injury was his "fault"?**

  *   **(A) No, it wasn't his fault.** His background excuses the choice; we should compensate him as if it were bad luck. → **LEAF 6**
  *   **(B) Yes, it was his fault.** He made the decision; we treat him as responsible despite his background. → **Go to Question 4**

  ---

  ### QUESTION 4 (If you chose Resources + Fault): The Severity of Penalty
  You believe the firefighter is responsible for his disadvantage. Now consider two drivers who were equally inattentive; one killed a child by bad luck, the other did not. Also consider the mountaineer who ignored warnings and now needs a costly rescue.
  **Do the claims of the imprudent or unlucky lapse entirely, or do they merely weaken relative to others?**

  *   **(A) Lapse Entirely.** They forfeit their claim to assistance; the mountaineer is left on the mountain, the driver bears the full cost. → **LEAF 7**
  *   **(B) Merely Weaken.** They still have claims, but others come first; we rescue the mountaineer only if it is cheap, we punish the driver less if the harm was accidental. → **LEAF 8**
  *   **(C) Lapse Entirely (Welfare Variant).** *If you previously chose Welfare (2B-A) but now think claims should lapse entirely despite background excuses:* → **LEAF 9**

  ---

  ### THE LEAVES: IDENTIFY YOUR POSITION

  **LEAF 1: Prioritarianism**
  *   **Awkward Commitment:** You must accept that making the rich richer is permissible if it adds more total well-being to the sum than helping the poor, even if inequality skyrockets.
  *   **Status:** Defended View.

  **LEAF 2: Social Egalitarianism**
  *   **Awkward Commitment:** You must tolerate significant material inequality provided no one is stigmatized, potentially leaving the poor materially deprived but "dignified."
  *   **Status:** Defended View.

  **LEAF 3: Unoccupied Region (Harsh Concessionism)**
  *   **Diagnosis:** **Coherent but Unattractive.** You view responsibility as a mere concession to incentives, yet deny all help to the imprudent; this combines a pragmatic view of distribution with a moralistic view of desert that rarely cohere.
  *   **Status:** Unoccupied.

  **LEAF 4: Welfare Luck Egalitarianism (Soft)**
  *   **Awkward Commitment:** You must subsidize the expensive tastes of the violinist even if she cultivated them voluntarily, provided her background made her do so.
  *   **Status:** Defended View (Arneson-style).

  **LEAF 5: Welfare Luck Egalitarianism (Hard)**
  *   **Awkward Commitment:** You must deny compensation to the firefighter whose poverty left him no real choice, because you count the decision itself as the locus of responsibility.
  *   **Status:** Defended View (Early Cohen).

  **LEAF 6: Structural Egalitarianism**
  *   **Awkward Commitment:** You must treat the firefighter's injury as brute luck (compensating him) while denying the violinist extra resources for her tastes, creating a split account of responsibility.
  *   **Status:** Defended View (Sher/Anderson hybrid).

  **LEAF 7: Strict Luck Egalitarianism**
  *   **Awkward Commitment:** You must let the mountaineer die or the imprudent driver suffer destitution, because fairness requires that choice costs be borne by the chooser.
  *   **Status:** Defended View (Dworkin/Cohen).

  **LEAF 8: Moderate Luck Egalitarianism**
  *   **Awkward Commitment:** You must help the imprudent mountaineer even when it diverts resources from the careful, effectively taxing the prudent to subsidize the reckless.
  *   **Status:** Defended View (Barry/Segall).

  **LEAF 9: Unoccupied Region (Incoherent Welfare-Hardness)**
  *   **Diagnosis:** **Incoherent.** You claim to equalize welfare (satisfaction) but allow claims to lapse entirely based on choice; if welfare is the metric, denying relief for choice contradictions the metric itself.
  *   **Status:** Unoccupied.

