  Alice, a security engineer, is auditing a legacy system where she has mathematically verified that the public 300-digit modulus $N$ is the product of exactly two primes, $p$ and $q$, generated by a one-way function she trusts but cannot invert. She holds $N$, possesses the concepts of multiplication and primality, and is focused exclusively on identifying $p$; verifying any candidate divisor takes milliseconds on her laptop, but deriving $p$ from $N$ requires computational steps exceeding the energy capacity of the observable universe. She works solely from the public parameters and her proof of the generator's correctness, with no access to the generation event or private records.

  ### Sorting the Escapes

  **Predicts She KNOWS ($p$):**
  *   **Standard Possible Worlds (Hintikka):** Since $p$ is true in every world compatible with her information, she knows it.
      *   *Cost:* Severs the link between knowledge and action; she cannot act on $p$ (e.g., decrypt), yet the theory claims she knows it.
  *   **Implicit Belief:** She possesses the information dispositionally, even if not currently accessed.
      *   *Cost:* Makes knowledge too cheap; counts physical impossibilities as known dispositions, divorcing epistemology from computational reality.

  **Predicts She DOESN'T KNOW ($p$):**
  *   **Explicit Belief / Syntactic Accounts:** Knowledge requires the sentence to be explicitly present or derived in her belief set.
      *   *Cost:* Loses **Closure** (knowing $A$ and $A \to B$ no longer guarantees knowing $B$), complicating logical norms for reasoning.
  *   **Fragmentation (Stalnaker/Lewis):** Her belief state is split; the context where she knows $N$ is distinct from the context where she knows $p$.
      *   *Cost:* Weakens rationality constraints; agents can hold contradictory beliefs across fragments without irrationality.
  *   **Impossible Worlds:** There are impossible worlds compatible with her information where $N$ is true but $p$ is not the factor.
      *   *Cost:* Metaphysical extravagance; requires modeling logically impossible scenarios as epistemic possibilities.
  *   **Awareness Logic:** She is aware of $N$ but not aware of the specific derivation path required to reach $p$.
      *   *Cost:* Makes knowledge dependent on syntactic awareness rather than semantic truth, complicating the definition of "awareness."

  ### Feature, Weakening, and Objections

  **Single Feature:** **Physical Intractability.** The derivation cost exceeds contingent physical limits (energy/time), not just cognitive attention.

  **Weakening:** If the derivation requires only an afternoon's computation (feasible but tedious), **Implicit Belief** verdicts remain unchanged (she still knows), but **Explicit Belief** verdicts become counterintuitive (she *could* know but doesn't yet). The **Fragmentation** camp might argue the fragments should merge given sufficient time, reducing the cost of closure.

  **Objections Against the Case:**
  *   **From the "She Knows" Camp:** The case begs the question by conflating *competence* (possessing the rules and data) with *performance* (executing the derivation); knowledge is a state of possession, not a measure of output speed.
  *   **From the "She Doesn't Know" Camp:** The case relies on contingent cosmological limits (heat death) rather than cognitive architecture; it tests *physical* omniscience, not *logical* omniscience, making it irrelevant to epistemic logic.
