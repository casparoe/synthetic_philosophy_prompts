  1. One paragraph, wholly realistic. An engineer on the job — no sci-fi, no drugs, no stipulated amnesia, no idealized reasoners.
  2. She knows some mundane facts; the target consequence is statable in a single line; she possesses every concept occurring in it; she is attending to exactly that question; and if someone handed her the answer she could check it in seconds. The sole obstacle is that deriving it takes more steps than any physically realizable computer could run — factoring a 300-digit number is a fine candidate, or anything equally clean.
  3. Then sort the standard escapes — implicit versus explicit belief, restricting knowledge to conclusions actually drawn, awareness logic, fragmenting belief by subject matter, impossible worlds — into those that still predict she knows and those that don't. For each that doesn't, say precisely what it costs the theory.
  4. Name the single feature of the case doing the work, state how the verdicts change if I weaken it (say the derivation becomes an afternoon's), and give the best objection each camp would raise against the case itself rather than against the diagnosis.

  Don't stipulate her ignorance — make it fall out of the setup.
