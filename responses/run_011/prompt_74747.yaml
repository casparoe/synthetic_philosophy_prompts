answer: |-
  # Facilitator Guide: The Commitment Exercise

  **Topic:** Agency, Alternative Possibilities, and Blame  
  **Duration:** 50 Minutes  
  **Participants:** 16 Students (Juniors/Seniors)  
  **Goal:** To generate pre-theoretical tension regarding the "Principle of Alternative Possibilities" (PAP) without using technical jargon until the debrief.

  ## 1. Materials & Setup
  *   **Index Cards (Two Colors):** 10 Blue, 10 Red. (Blue = Option A, Red = Option B).
  *   **Envelopes (Three Types):** 16 standard envelopes, pre-labeled on the inside only.
      *   *Type 1 (Frankfurt):* 5 envelopes.
      *   *Type 2 (Determinism):* 5 envelopes.
      *   *Type 3 (Control):* 6 envelopes.
  *   **Pens:** One per student.
  *   **Whiteboard:** Divided into three columns labeled "Choice," "Could Have Done Otherwise?," "Appropriate to Blame/Praise?."
  *   **Room:** Seats arranged in a circle or clusters to allow for quick small-group formation.

  **Pre-Session Prep:**
  1.  **The Payoff:** Decide on two genuine options for the class that matter to them.
      *   *Option A (Blue):* "The final 10 minutes of today's review will be unstructured study time."
      *   *Option B (Red):* "The final 10 minutes of today's review will be a Q&A on the exam format."
      *   *Note:* Most students will prefer A. This makes choosing B a "sacrifice" and choosing A a "self-interested" act, both of which are liable to blame/praise.
  2.  **The Envelopes:** Inside each envelope, place a slip of paper with the specific **Scenario Script** (see Section 3). Ensure the envelopes look identical from the outside. Randomly distribute them face-down on the desks before students enter, or have two student assistants hand them out blindly during the activity.

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **The Choice** | Explain the payoff. Students select a card (Blue/Red) and place it in a collection box. |
  | **05-10** | **The Commitment** | Students privately record their intuitions on an index card (Collected later). |
  | **10-15** | **The Reveal** | Distribute envelopes. Students read the Scenario Script silently. |
  | **15-30** | **Small Groups** | Students group by Envelope Type. Discuss the tension between their choice and the script. |
  | **30-45** | **Debrief** | Facilitator leads large-group discussion. Introduce jargon (PAP, Compatibilism). |
  | **45-50** | **Assessment** | Students answer 3 written questions. Collect as evidence. |

  ## 3. Scripts & Wording

  ### Phase 1: The Choice (00-05)
  **Facilitator:** "Welcome. For this segment, we are going to make a decision that affects how we end the session. On your desk are two cards.
  *   **Blue:** If the majority chooses Blue, the last 10 minutes of this session become unstructured study time.
  *   **Red:** If the majority chooses Red, the last 10 minutes become a Q&A on the exam format.

  Please choose the card you genuinely prefer. Once you pick it up, that is your commitment. Place it in the box at the front. Do not discuss your choice with neighbors."

  *(Wait for all 16 to deposit cards. Do not reveal the count yet.)*

  ### Phase 2: The Commitment (05-10)
  **Facilitator:** "Take a fresh index card. Write your name on it. I want you to answer two questions about the choice you *just made*. Be honest; this is for you.
  1.  **At the exact moment you picked your card, was it possible for you to have picked the other color?** (Yes/No)
  2.  **Depending on which color you picked, do you deserve credit or blame for that choice?** (e.g., If you picked Blue for study time, do you deserve blame for being selfish? If you picked Red for Q&A, do you deserve credit for being generous?)
  Leave the card face down on your desk."

  ### Phase 3: The Reveal (10-15)
  **Facilitator:** "Please pick up the envelope on your desk. Open it. Read the slip inside silently. Do not show it to anyone yet. This slip describes the *conditions* under which your choice was made. For the next twenty minutes, you must treat the statement in the envelope as a fact about your action."

  *(Allow 2 minutes for reading. You will see reactions.)*

  **The Scenario Scripts (Inside Envelopes):**

  *   **Type 1 (Frankfurt Case):** "A mechanism was in place before you entered. If you had shown any sign of choosing the *other* color, this mechanism would have intervened and forced you to pick the color you actually picked. However, you chose this color on your own; the mechanism did not need to activate."
  *   **Type 2 (Hard Determinism):** "A mechanism was in place before you entered. Your neural states and prior causes determined your choice inevitably. You could not have chosen the other color, even in principle. The mechanism actively shaped your decision."
  *   **Type 3 (Libertarian/Control):** "No mechanism existed. Your choice was not constrained by any prior arrangement or intervention. You were the sole source of the decision."

  ### Phase 4: Small Group Discussion (15-30)
  **Facilitator:** "Look at the symbol in the corner of your slip (★, ●, or ▲). Find the others with your symbol. Form three groups. Discuss the following:"
  1.  "Does the information in your envelope change your answer to Question 1 (Could you have done otherwise)?"
  2.  "Does it change your answer to Question 2 (Do you deserve credit/blame)?"
  3.  "If you still deserve blame/credit, *why*, given what you now know?"

  *(Circulate between groups. Listen for friction. Do not intervene unless a group is silent.)*

  ### Phase 5: Large Group Debrief (30-45)
  **Facilitator:** "Let's come back together. I'm going to write some words on the board that we haven't used yet."
  *(Write: **Free Will, Determinism, Compatibilism, Alternative Possibilities**.)*

  **Facilitator:** "Group 1 (Frankfurt): You were told you couldn't have done otherwise, but the mechanism didn't touch you. Many of you likely kept your blame/praise judgment. Why?"
  *(Target Intuition: Sourcehood matters more than alternative possibilities.)*

  **Facilitator:** "Group 2 (Determinism): You were told your choice was inevitable. Did anyone stop feeling responsible? Did anyone keep feeling responsible?"
  *(Target Intuition: The threat of hard determinism to moral responsibility.)*

  **Facilitator:** "Group 3 (Control): You had the 'pure' choice. Did you feel *more* responsible than Group 1?"
  *(Target Intuition: If Group 1 and 3 feel the same, Alternative Possibilities might not be necessary for responsibility.)*

  **Mapping the Activity to Concepts:**
  *   **The "Mechanism":** Represents causal determinism or a prior sufficient cause.
  *   **Type 1 Envelope:** Represents a **Frankfurt Case**. It attacks the **Principle of Alternative Possibilities (PAP)**. It shows students they might hold agents responsible even if they couldn't have done otherwise, provided the action issued from their own will.
  *   **Type 2 Envelope:** Represents **Hard Incompatibilism**. It suggests that if the mechanism *actually* determined the choice, responsibility vanishes.
  *   **The Tension:** The gap between Group 1 and Group 2 reveals the distinction between *counterfactual* inability (Frankfurt) and *actual* causal determination.

  ### Phase 6: Assessment (45-50)
  **Facilitator:** "Take the last five minutes. On the back of your index card, answer these three questions. This is your exit ticket."

  1.  "Did reading your envelope change your mind about whether you could have done otherwise? (Yes/No)"
  2.  "Did reading your envelope change your mind about whether you deserve credit or blame? (Yes/No)"
  3.  "In one sentence: What is the one thing that must be true for blame to be fair?"

  *(Collect cards.)*

  ## 4. Contingency Planning: What Could Go Wrong

  **1. The "Cynic" Problem:**
  *   *Risk:* A student says, "This is fake. You didn't actually rig anything."
  *   *Response:* Do not defend the lie. Say: "You are right that physically, no machine intervened. But philosophically, we are testing whether the *belief* that you couldn't have done otherwise changes your intuition. Treat the envelope as a 'What If' that is stipulated as true for this argument."
  *   *Prevention:* In the Debrief, explicitly acknowledge: "The envelopes were a philosophical device, not a literal claim about neuroscience. The point was to isolate your intuition."

  **2. The "Consensus" Problem:**
  *   *Risk:* Everyone says, "I'm responsible no matter what." (Stoic/Compatibilist consensus).
  *   *Response:* Pivot the question. "If you are responsible even when you couldn't have done otherwise, what work is the concept of 'freedom' doing? Why do we care about it?"
  *   *Prevention:* In Group 2 (Determinism), prompt them: "If your choice was inevitable like a rock falling, is 'blame' just a word for 'causal impact'?"

  **3. The "Resentment" Problem:**
  *   *Risk:* Students feel manipulated by the deception.
  *   *Response:* Apologize for the opacity, reiterate the pedagogical goal. "I hid the topic to prevent you from giving the 'textbook answer' instead of your genuine intuition. I value your genuine intuition more."
  *   *Prevention:* Ensure the "Payoff" (Study Time vs. Q&A) is actually delivered as voted. This proves you respect their agency despite the "rigged" narrative.

  **4. The "Outguessing" Problem:**
  *   *Risk:* Students choose Red *because* they suspect a trick.
  *   *Response:* Acknowledge it. "If you chose against your preference to prove a point, that is also a choice. Does the mechanism account for *that*?"

  ## 5. Limitations: What This Activity Cannot Reproduce

  **The Metaphysical Weight of Determinism:**
  This activity *stipulates* determinism via a note in an envelope. It cannot reproduce the *feeling* of living in a determined universe. Students know, deep down, that the facilitator did not actually control their neurons.
  *   **How to Supply by Hand:** In the debrief, you must explicitly say: "The unease you feel is mild because you know this is a game. Imagine if every thought you ever had was the result of a chain of causes stretching back before your birth. That is the weight Group 2 was asked to carry. The activity gestures at it; you must imagine the rest."

  ## 6. Evidence of Success (Assessment Analysis)

  You requested written questions to verify the activity worked. Collect the index cards from Phase 6.

  **The Questions:**
  1.  "Did reading your envelope change your mind about whether you could have done otherwise? (Yes/No)"
  2.  "Did reading your envelope change your mind about whether you deserve credit or blame? (Yes/No)"
  3.  "In one sentence: What is the one thing that must be true for blame to be fair?"

  **Patterns Indicating Success:**
  *   **Divergence:** Group 1 (Frankfurt) answers "No" to Q1 (couldn't have done otherwise) but "No" to Q2 (blame didn't change). This shows they have decoupled responsibility from alternative possibilities.
  *   **Tension:** Group 2 (Determinism) shows mixed results on Q2. Some say "Yes, blame changed," others say "No." This indicates the incompatibilist worry is live.
  *   **Conceptual Shift:** Answers to Q3 move away from "I had a choice" toward "It was *my* action" or "I understood what I was doing."

  **Patterns Indicating Failure:**
  *   **Uniformity:** All 16 students answer "No" to Q1 and "No" to Q2 regardless of envelope type. This suggests they ignored the stipulation or are hardened compatibilists who weren't moved by the scenario.
  *   **Dismissal:** Answers to Q3 include phrases like "This was a trick" or "The envelope wasn't real." This indicates the ethical frame broke the philosophical immersion.
  *   **Confusion:** Answers to Q3 are blank or say "I don't know." This suggests the debrief failed to connect the activity to the concepts.

  ## 7. Final Note to Facilitator
  You are walking a line between pedagogical deception and philosophical experimentation. The integrity of this session relies on your transparency in the **Debrief (Phase 5)**. You must own the "rig." If you act as though the mechanism was real, you lose their trust. If you act as though it was merely a game, you lose the tension.
  *   **Say this:** "I cannot rig your brains. But I can ask you to imagine a world where they are rigged. Your reaction to that imagination is the data point. That reaction *is* your philosophy."
