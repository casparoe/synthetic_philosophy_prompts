answer: |-
  **The Two Frame Problems: Engineering Solved, Philosophy Pending**

  If you listen to a computer scientist talk about the frame problem, they're talking about bookkeeping. If you listen to a philosopher talk about it, they're talking about the nature of mind. For the last three weeks, we've been oscillating between these two poles, and it's easy to see why the distinction gets blurred. But for the purpose of evaluating where we actually stand with AI—both in my lab's toy domain and in the grand scheme of cognitive science—we need to pry them apart. My thesis is straightforward: the narrow, technical frame problem is effectively solved, or at least dissolvable through standard engineering practices. The wide, philosophical frame problem is real, but it is a distinct animal that no amount of logical formalism or neural filtering can touch. Conflating the two leads to the kind of skepticism my supervisor is directing at our project, but separating them reveals that our relevance filter is a legitimate solution to the engineering hurdle, even if it leaves the philosophical mystery intact.

  Let's start with the technical sense. Originally, McCarthy and Hayes identified the frame problem as a representational headache: how do you tell a logic-based agent what *doesn't* change when it acts without writing an exhaustive list of frame axioms for every action–fluent pair? In a world with $N$ fluents and $M$ actions, you're looking at $N \times M$ axioms to say nothing happens. That's combinatorial suicide. The standard reply in the literature involves non-monotonic formalisms like circumscription or, more practically, Reiter's successor-state axioms. These formalisms encode the commonsense law of inertia directly into the structure of the logic: a fluent changes only if an action specifically causes it to.

  Critics often point to the Yale Shooting Problem (YSP) as evidence that this technical approach is fundamentally broken. In the YSP, a naive non-monotonic logic allows a model where the gun unloads itself spontaneously to preserve consistency, leading to absurd conclusions. However, treating YSP as a death knell for the technical solution is a mistake. YSP wasn't evidence that change is incomputable; it was evidence that early non-monotonic setups were underspecified regarding chronological minimization. Once you fix the formalism to prioritize causal explanations over spontaneous changes, the problem vanishes. The technical frame problem is not a logical paradox; it's a complexity issue. It's about finding a compact way to represent inertia. Successor-state axioms solved the logical representation, and modern probabilistic methods handle the uncertainty.

  This brings us to my lab's project. We built a neural relevance filter to bypass the need for explicit axioms entirely. Instead of hard-coding inertia, we train a net to predict which fluents change given an action. The planner assumes inertia for everything else. This is essentially a learned approximation of successor-state axioms. It works in our 40-fluent domain because the domain is closed and structured. The technical problem here is managed by bounding the world. As long as the world is sufficiently constrained, the "frame" is just a database update rule.

  However, this is where my supervisor's objection hits hard, and it deserves a serious steelmanning. The supervisor argues that we haven't solved the frame problem; we've just relocated it. Our neural net predicts relevance, but how does the system know when to trust that prediction? If the net says a fluent is irrelevant, but it actually matters (e.g., the battery is dead even though the net says it's charged), the robot fails. To avoid this, you'd need a meta-filter to judge the reliability of the first filter. But then you need a filter for the meta-filter. This is the regress objection: any mechanism for selecting relevance requires a prior judgement of relevance to select the mechanism. If relevance is always contextual, you can't capture it in a fixed model without invoking an infinite tower of meta-judgements.

  This is a powerful argument because it mirrors the wide philosophical problem. But there is an equally strong steelman for the reply: the regress is benign because it bottoms out. Humans don't consult a meta-judgement before every judgement. We don't think about how we know the floor is solid before we walk; we just walk. Our relevance judgements are cached heuristics, evolved or trained on statistical regularities in the environment. The tower doesn't go up forever; it goes down into the substrate. In our case, the "bottom" is the training data and the loss function. The neural net doesn't "know" relevance in a philosophical sense; it encodes statistical correlations between actions and state changes found in the simulation. For engineering purposes, this is sufficient. We don't need infallible relevance; we need reliability within a tolerance threshold. If the filter is right 99% of the time, the robot works. The regress stops where the engineering requirements are met.

  So, if the technical problem is solvable via axioms or learned filters, why does the frame problem still haunt philosophy? This is the wide frame problem, dramatized by Dennett's robots. Dennett described a robot that starves because it deduces infinitely many irrelevant implications while a bomb ticks, or another that blows itself up because it doesn't deduce that moving the battery moves the bomb. This isn't about database updates; it's about *meaning*. The wide problem asks: how does an agent know what matters in an open, unstructured world?

  This is the version Dreyfus and Brooks-style behaviourists lean on. They argue that representational AI fails because relevance isn't a computation you perform on symbols; it's a function of embodied engagement with the environment. A symbol like `BatteryOnTable` has no intrinsic relevance. Its relevance emerges from the robot's goal (survive), its physical constraints (can't move without power), and the current context (bomb ticking). The wide frame problem suggests that you cannot solve relevance by adding more rules or better filters because relevance is holistic. It depends on the whole situation, which cannot be fully captured in a state description.

  Here is where the distinction becomes critical. My supervisor is treating the wide problem as if it were a technical constraint on our filter. They are saying, "Your filter doesn't solve the *real* frame problem." But if we keep the senses separate, we see that our filter *does* solve the technical problem (efficient state updates in a closed domain) but does not claim to solve the wide problem (grounded understanding of relevance in an open world). The regress objection holds water only if we demand that the filter provide a philosophical guarantee of relevance. If we demand only engineering reliability, the regress is cut off by empirical performance.

  The Yale Shooting Problem, then, is evidence that the technical problem is tricky to formalize correctly, not that it's impossible. It was a bug in the logic, not a feature of reality. The wide frame problem, however, is not a bug to be fixed. It's a feature of intelligence. It highlights that representation is always an abstraction, and abstractions always lose context. Dennett's robots fail not because their logic is slow, but because their ontology is disconnected from the causal stakes of the environment.

  So, what is the verdict? We need to stop pretending these are the same problem. The technical frame problem is solved. We have successor-state axioms for logical clarity and probabilistic filters for scalability. In bounded domains like our household sim, these methods work. We can build robots that update their state efficiently without enumerating frame axioms. My supervisor is wrong to suggest our project is futile on technical grounds. The regress objection is a philosophical trap, not an engineering barrier. We don't need to justify our heuristics infinitely; we just need them to work within the domain bounds.

  However, the supervisor is right about the wider implication. The wide frame problem remains unsolved and likely is unsolvable within a purely representational framework. No amount of clever formalism or neural filtering will give a system a human-like grasp of *significance* in an open world. The wide problem isn't a technical hurdle; it's a limit condition on symbolic AI. It tells us that while we can build agents that manipulate symbols efficiently, we cannot build agents that understand what those symbols *mean* in a contextual sense without embedding them in a form of life or embodied interaction that goes beyond state vectors.

  Therefore, the condition for claiming we've addressed the wide problem is concrete and falsifiable: our filter would have to generalize to novel domains without retraining, identifying relevance based on causal structure rather than statistical correlation. If our robot could enter a completely new house, encounter a new object, and correctly infer that dropping it might break it (without having seen "breaking" in training), it would be chipping away at the wide problem. Until then, we are solving the bookkeeping problem, not the meaning problem.

  In conclusion, the frame problem is two problems wearing one name. The narrow version is a complexity issue regarding state representation, and it is solved by modern formalisms and learned approximations like our filter. The wide version is a philosophical challenge regarding grounding and context, and it remains open. My supervisor's regress objection correctly identifies the limit of the wide problem but incorrectly applies it as a veto on the technical solution. We should accept the verdict: the technical frame problem is dead, killed by engineering. The philosophical frame problem is alive and well, reminding us that efficiency isn't understanding. Our robot won't blow itself up in the sim, but it doesn't know why that matters. And for now, that's enough to pass the course.
