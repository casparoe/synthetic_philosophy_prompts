  **Mapping Note:** Scope covers asymmetry elicitation. Definitions encode circularity of "intentionally." Clause 3.1 addresses wording sensitivity/pragmatics. Clause 3.2 covers scales (binary vs. graded). Clause 3.3 mandates agent attitude (deep self). Clause 3.4 handles demographics/WEIRD samples. Clause 3.5 licenses iterative revision until asymmetry appears (p-hacking reductio). Troubleshooting addresses replication failure. Annex classifies the four session vignettes. Revision history notes amendment after failed replication.

  ***

  **CONSORTIUM FOR THE STANDARDIZATION OF INTUITION ELICITATION**
  **Standard CSIE-2003-REV4**
  **Vignette-Based Elicitation of Folk Attitudes: Requirements for the Design, Administration, and Certification of Side-Effect Asymmetries**

  **1. SCOPE**
  1.1 This standard establishes normative requirements for the elicitation of the Side-Effect Asymmetry herein referred to as "The Asymmetry."
  1.2 This standard applies to all researchers seeking certification of folk concepts regarding intentional action, moral valence, and agent attitude.
  1.3 Compliance ensures that observed variances reflect conceptual competence rather than artifact.

  **2. DEFINITIONS**
  2.1 **Intentionally:** An action is performed intentionally if and only if it meets the criteria for intentional action set forth in Annex B (Reference Pending).
  2.2 **Folk Attitude:** The modal response of a representative sample population when presented with a vignette under controlled conditions.
  2.3 **Side-Effect:** A consequence foreseen by the agent but neither constituting the primary goal nor requiring active facilitation beyond the primary goal's execution.
  2.4 **Asymmetry:** The statistically significant divergence in intentionality attributions between condition HARM and condition HELP, holding agent attitude constant.

  **3. NORMATIVE REQUIREMENTS**
  3.1 **Vignette Construction**
  3.1.1 Wording shall remain identical across conditions except for the valence of the side-effect.
  3.1.2 Lexical items implying pragmatic implicature shall be permitted only if the research question concerns pragmatic implicature.
  3.1.3 Agent attitude toward the side-effect shall be explicitly stated as indifferent to isolate quality of will from outcome valence.

  3.2 **Response Instrumentation**
  3.2.1 Researchers shall employ a 7-point Likert scale ranging from "Not at All" to "Fully" unless binary forced-choice is required to maximize effect size.
  3.2.2 Neutral midpoints shall be removed if data suggests participants utilize them to avoid commitment rather than to express genuine ambivalence.
  3.2.3 Question order shall be counterbalanced unless order effects are being measured as a confounding variable.

  3.3 **Population Sampling**
  3.3.1 Samples shall be drawn from populations representative of the concept holders unless the expertise defense is invoked.
  3.3.2 If cross-cultural variability eliminates The Asymmetry, the sample shall be restricted to populations where the concept is stable.
  3.3.3 Demographic data shall be collected to permit post-hoc exclusion of outliers who fail attention checks.

  3.4 **Hypothesis Concealment**
  3.4.1 Participants shall be prevented from divining the hypothesis through filler tasks or deception.
  3.4.2 If participants guess the hypothesis, their data shall be excluded unless their guesses align with the predicted asymmetry.

  3.5 **Certification Protocol**
  3.5.1 Initial administration shall seek to establish The Asymmetry at p < 0.05.
  3.5.2 If The Asymmetry is not observed, the instrument shall be recalibrated.
  3.5.3 Recalibration may include modifying vignette wording, adjusting response scales, or refining sample inclusion criteria.
  3.5.4 Once The Asymmetry is observed following recalibration, the instrument shall be certified as valid for concept elicitation.
  3.5.5 The reappearance of The Asymmetry following recalibration shall be treated as evidence of the concept's robustness rather than instrument sensitivity.

  **4. TROUBLESHOOTING**

  | Symptom | Probable Cause | Corrective Action |
  | :--- | :--- | :--- |
  | No Asymmetry Observed | Wording lacks moral valence | Revise side-effect description (See Annex A) |
  | Asymmetry in Both Conditions | Demand Characteristics | Implement filler tasks or blind administration |
  | Asymmetry in Neither Condition | Sample Demographics | Restrict sample to WEIRD populations or Philosophers |
  | Replication Failure | Contextual Framing | Amend Clause 3.1.2 per Revision History |

  **ANNEX A: VIGNETTE CLASSIFICATION**

  **A.1 Vignette HARM**
  *Status:* **Approved**
  *Requirements:* Shall be used as the baseline negative valence condition. Agent indifference must be explicit. Revenue motive shall be primary.

  **A.2 Vignette HELP**
  *Status:* **Approved (Paired)**
  *Requirements:* Shall be used only in direct contrast to Vignette HARM. Orchid blooming must be described as equally incidental to revenue generation as heron displacement.

  **A.3 Vignette NEUTRAL**
  *Status:* **Deprecated**
  *Requirements:* Intake pump humming lacks moral valence. Shall not be used for Asymmetry elicitation. May be used for control conditions regarding foreknowledge only.

  **A.4 Vignette EXPERT**
  *Status:* **Conditionally Approved**
  *Requirements:* Agent expertise (former ecologist) must be disclosed. If Asymmetry disappears, expertise shall be coded as mitigating indifference. If Asymmetry persists, expertise shall be coded as irrelevant to folk concepts. Researcher shall declare which coding supports the hypothesis.

  **REVISION HISTORY**
  **Rev 4.0:** Clause 3.5.3 amended to allow lexical recalibration following Study #402 failure to replicate Asymmetry in non-WEIRD samples.

  **END OF STANDARD**
