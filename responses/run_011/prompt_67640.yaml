prompt: |-
  So next month I'm giving a talk at a cultural evolution workshop and I want a prep sheet for the Q&A, not a defense of my view. The room is mostly modelers — people who build population-level transmission models in the dual-inheritance vein — plus two cognitive anthropologists who work on attractors and minimally counterintuitive content, one historian of science who studies lab notebooks and instruments, and a linguist who works on sound change. Nobody in there is a Dawkins fan. They think "the meme" is an unmeasurable unit and they've spent twenty years building perfectly good selectionist models of culture without it, so they're not hostile to selection, they're hostile to replicator talk.

  The thesis: the thing that gets copied in cultural transmission isn't a mental representation, it's a procedure stored in an external medium — a guild pattern book, a ledger format, a liturgy, a syllabus, a codebase. Brains are read/write heads, not the storage. Selection acts on archives: which ones survive, which get instantiated into new archives, which get made mandatory by some authority that can enforce the checksum. My payoff claim is that this relocates the copying-fidelity parameter out of the learner's cognition and into the medium, which is where it always should have been — you can hold psychology fixed across two populations and get completely different transmission dynamics just by changing how the procedure is stored.

  The two worked examples I'm building the talk around are (a) craft guild pattern books, where I want to say the tradition outlives the loss of individual masters, and (b) liturgical language: fixed wording preserved for centuries by communities that don't understand a word of it, which I take to be genuinely awkward for the mental-replicator story. I also have a short section on oral traditions where I argue they're drift-without-a-checksum, and I know that one's going to draw fire.

  What I want: maybe eight objections this specific room will actually raise, ordered by how much damage they'd do. Phrase them the way these people would phrase them — a modeler's objection sounds nothing like an anthropologist's, and I want to hear the difference. For each, a two-minute reply and a note on where the reply is soft or where I'm quietly changing the subject to survive. Tell me which ones I should just concede in the first two minutes before someone does it for me, and which single reply has to land or the whole talk collapses. And include the question I'm praying nobody asks. No reading list and no citations, I know the literature, I want the arguments.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Academic researcher giving a talk at a cultural evolution workshop.
      *   **Audience:** Mostly dual-inheritance modelers (population-level transmission, selectionist but anti-meme), two cognitive anthropologists (attractors, MCI), one historian of science (lab notebooks, instruments), one linguist (sound change).
      *   **Stance:** Anti-meme/anti-replicator in the brain. Pro-external storage (archives, pattern books, liturgy). Brains = read/write heads. Selection acts on archives. Fidelity is a property of the medium, not cognition.
      *   **Examples:** Craft guild pattern books, Liturgical language (fixed wording without understanding), Oral traditions (drift without checksum).
      *   **Request:** 8 objections ordered by damage potential. Phrased in the voices of the specific audience members. Two-minute replies for each. Notes on weaknesses/deflections. Advice on concessions. One "nightmare question." No citations/reading lists.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Thesis:* Cultural copying = external procedure storage. Brains execute, archives store.
      *   *Vulnerability 1 (The Modelers):* If brains aren't storing the replicator, how do you model the transmission function? Where is the variance coming from if not cognitive noise?
      *   *Vulnerability 2 (The Anthropologists):* What about reconstruction? People don't just read; they interpret. Attractors exist in the mind.
      *   *Vulnerability 3 (The Historian):* Archives aren't static. They get annotated, damaged, ignored. Who decides which archive counts?
      *   *Vulnerability 4 (The Linguist):* Sound change happens *in the mouth/ear*, not in the text. Liturgy changes pronunciation even if text stays fixed.
      *   *Vulnerability 5 (General):* Definition of "Archive." Is a brain an archive? If yes, distinction collapses. If no, how do you copy without a brain?
      *   *Vulnerability 6 (Selection):* Selection needs differential reproduction. Archives don't reproduce themselves; humans move them.
      *   *Vulnerability 7 (Oral Tradition):* Calling oral tradition "drift without checksum" is a huge claim that ignores mnemonic devices.
      *   *Vulnerability 8 (Causality):* Does the archive cause the behavior, or does the behavior cause the archive?

  3.  **Drafting the Objections (Voice & Content):**
      *   *Modeler 1 (The Formalist):* Needs to hear about the math. Where is the $\mu$ (mutation rate)?
      *   *Modeler 2 (The Selectionist):* Needs to hear about the unit of selection. Is the book the replicator?
      *   *Cognitive Anthropologist:* Needs to hear about reconstruction and attractors.
      *   *Linguist:* Needs to hear about phonology vs. orthography.
      *   *Historian:* Needs to hear about materiality and usage.
      *   *General/Synthesis:* The "Brain as Archive" trap.

  4.  **Ordering by Damage:**
      *   *Critical:* The "Brain is still doing the work" objection (Modeler/Anthro). If the brain reconstructs, the archive is just a cue.
      *   *High:* The "Selection Mechanism" objection (Modeler). Archives don't replicate; people copy archives.
      *   *High:* The "Oral Tradition" overreach (Linguist/Anthro). This is the weakest empirical claim.
      *   *Medium:* The "Definition of Archive" (Historian).
      *   *Low:* Specific edge cases.

      *Refining the Order:*
      1.  The Reconstruction/Interpretation Objection (Anthro/Modeler hybrid). *Fatal if not answered.*
      2.  The Agency/Replication Objection (Modeler). *Who copies the book?*
      3.  The Oral Tradition Overreach (Linguist). *Easy target.*
      4.  The "Brain as Archive" Trap (General). *Definition game.*
      5.  The Fidelity/Noise Location (Modeler). *Where is the variance?*
      6.  The Historian's Materiality (Historian). *Books rot/change.*
      7.  The Liturgy Pronunciation (Linguist). *Text fixed, sound changes.*
      8.  The Normative/Enforcement (Historian/Anthro). *Who enforces the checksum?*

      *Wait, let's prioritize based on the prompt's "damage" criteria.*
      1.  **The Reconstruction Objection (Cognitive Anthro):** If minds reconstruct based on attractors, the archive is just a trigger. This kills the "procedure stored externally" claim.
      2.  **The Replicator Objection (Modeler):** Archives don't self-replicate. You've just moved the homunculus.
      3.  **The Oral Tradition Claim (Linguist/Anthro):** This is empirically weak. Mnemonics exist.
      4.  **The Variance Source (Modeler):** If psychology is fixed, where does cultural variation come from?
      5.  **The Historian's "Usage" Objection:** Archives are ignored or annotated.
      6.  **The Linguist's "Sound" Objection:** Text $\neq$ Speech.
      7.  **The "Unit" Objection:** Is the book one unit or many?
      8.  **The Normative Objection:** Authority is cognitive/social, not archival.

  5.  **Drafting Replies & "Soft Spots":**
      *   Need to be pragmatic. Admit where the theory is a lens, not a law.
      *   *Concession Strategy:* Concede the Oral Tradition point early to save credibility for the Archive point.
      *   *Must-Land Reply:* The Reconstruction Objection. If the mind reconstructs, the archive isn't the storage. Need to argue the archive *constrains* reconstruction enough to matter.

  6.  **Refining the Voices:**
      *   *Modeler:* Talks about parameters, variance, transmission chains, fidelity.
      *   *Anthro:* Talks about reconstruction, attractors, meaning, cognition.
      *   *Historian:* Talks about marginalia, wear and tear, context, usage.
      *   *Linguist:* Talks about phonology, orthography, performance vs. competence.

  7.  **The Nightmare Question:**
      *   Something that collapses the distinction between internal and external. "Is a memorized poem an archive?"

  8.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by damage? Yes.
