      *   Notes on soft spots? Yes.
      *   Concession advice? Yes.
      *   Nightmare question? Yes.
      *   No citations? Yes.

  9.  **Final Polish:** Ensure the tone is collegial but sharp, matching the workshop vibe. (Self-Correction: Make sure the "Modeler" objections sound like *dual-inheritance* modelers, i.e., they care about population dynamics, not just "is it a meme?")

  *(Self-Correction during drafting)*: I need to make sure I don't give the user *too* much ammo to dodge. The prompt asks for "where the reply is soft." I need to be honest about where their theory is vulnerable. The "Oral Tradition" point is definitely the weakest link empirically. The "Reconstruction" point is the strongest theoretical threat.

