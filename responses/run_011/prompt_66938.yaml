answer: |-
  **Bottom line**

  This is not one argument; it is a collision between causal logic and predictive heuristics, masquerading as a dispute over statistics. Camp A defends the logical possibility of intervention (causal structure), while Camp B defends the empirical probability of success (predictive utility). Your hypothesis is correct that they answer different questions, but incomplete: the stalemate persists because the stakes are normative, not merely semantic. A fears policy fatalism; B fears resource waste. They talk past each other because "heritability" functions as a proxy for "modifiability" in public discourse, though not in math. The conflict is bedrock intuition about causality versus pragmatism, wrapped in verbal confusion. C is indeed opportunistic ammunition, but the core deadlock is value-driven.

  **What each camp is actually doing**

  Camp A acts as the logical guardian against determinism. Their strongest move is preventing the naturalistic fallacy: deriving "ought" or "cannot" from "is." They argue that $h^2$ describes variance distribution in a specific context, not a causal ceiling. When they cite PKU, they aren't claiming IQ is single-gene; they are proving that high $h^2$ environments can be overturned by changing the environmental parameter. Their goal is to keep the space of possible interventions open. They fear that accepting B's heuristic will lead to abandoning effective social programs because "it's genetic," resulting in unjust neglect of mutable problems.

  Camp B acts as the empirical realist against utopianism. Their strongest move is induction. They argue that while A is logically correct, it is pragmatically vacuous. In the actual world, traits with high $h^2$ (height, IQ) resist environmental manipulation compared to low $h^2$ traits. They aren't claiming immutability, but high friction. Their goal is resource allocation. They fear that accepting A's logic will lead to pouring money into interventions that history shows won't work, driven by wishful thinking rather than base rates. They view A's warnings as technically true but practically misleading.

  Camp C acts as the methodological skeptic. They argue the number itself is noise. Twin studies confound genetics with womb environment; GWAS missing heritability suggests structure is non-additive.

  The wires cross because A hears B's "stubborn" as "immutable," and B hears A's "possible" as "likely." A thinks B is committing a logical error; B thinks A is ignoring base rates. C jumps in to invalidate the premise whenever one side gains traction, preventing resolution. A uses C to say the number is fake; B uses C to say the number is conservative (SNP < Twin), so the trait is even *more* genetic. C is not neutral; they are a weaponized third party. The argument never terminates because A and B are optimizing for different loss functions: A minimizes false negatives (missing a possible intervention), B minimizes false positives (wasting resources on impossible ones).

  **Verbal, empirical, or bedrock**

  This is primarily a bedrock dispute over causal standards, disguised as a verbal dispute over the word "heritable." The verbal layer is real: A uses the technical definition, B uses the folk implication. But stripping the words won't fix it. The bedrock issue is whether logical possibility trumps empirical frequency in policy reasoning.

  The hidden empirical question is: "What is the functional relationship between environmental variance magnitude and phenotypic shift for high-h² traits?" Specifically: Does increasing environmental variance linearly reduce genetic variance, or is there a threshold effect?

  This is measurable in principle. You would need to identify a population, measure a high-h² trait, introduce a controlled, massive environmental shift (novel variance), and measure the change in both mean and variance components.

  However, the bedrock intuition remains: Even if we answer this, A will say "See, it moved," and B will say "See, it took massive effort for small gain." The disagreement is on the *cost-benefit threshold* for intervention, which is normative. A values the possibility of equity; B values the efficiency of allocation. No empirical data settles what cost is worth paying for what gain. Your hypothesis identifies the question mismatch, but misses that the mismatch is motivated by conflicting values, not just confusion. The dispute persists because it serves a social function: A needs the argument to prevent fatalism; B needs it to prevent utopianism. Resolving the math removes their weapons. They will find new numbers to fight over because the conflict is about hope versus realism, not variance components.

  **Does camp A's best example survive?**

  Your worry is statistically sound and damages A's rhetorical position. Lewontin's seeds and PKU demonstrate mean shifts between groups or absolute levels, not necessarily rank reordering within a population. If you treat PKU children, they move from disabled to normal, but their relative IQ ranking among treated children may still be highly heritable. A conflates "the trait can be changed" with "the genetic stratification can be erased."

  B capitalizes on this. For social policy, rank stability often matters more than mean shifts. If an intervention raises everyone's IQ by 10 points but preserves the rank order, inequality and selection pressures remain unchanged. A's examples prove malleability, but not necessarily the dissolution of genetic advantage.

  However, A is not entirely defeated. Their core point is that $h^2$ does not bound the *mean*. If the goal is raising the floor (e.g., eliminating intellectual disability), mean shift is sufficient. A's error is overgeneralizing from "mean can move" to "inequality can be erased." B's error is inferring "inequality persists" means "means cannot move."

  So, A's position survives but shrinks. They can claim interventions can improve absolute outcomes, but they cannot use PKU to claim genetic stratification is illusory. This concedes ground to B on inequality while holding firm on improvement. The stalemate continues because A wants to promise equity, but their math only promises amelioration. A's rhetoric implies the latter guarantees the former, which is the weak point B exploits. If A restricted claims to absolute improvement, B would have less traction, but A's political goal is often relative equality, which high $h^2$ genuinely constrains.

  **What would count as progress**

  Progress requires decoupling "malleability" from "equality." Both sides must concede orthogonality. B must admit high $h^2$ does not imply immutability (the PKU concession). A must admit high $h^2$ predicts high intervention friction and rank stability (the base rate concession).

  A specific study design: Longitudinal intervention trials on high-h² traits that report both mean shift and rank correlation (pre/post). If an intervention shifts the mean but preserves rank, both sides are partially vindicated.

  Reformulation: Stop asking "Is it heritable?" Ask "What is the elasticity of this trait to specific environmental vectors?" This moves from a property of the trait to a property of the intervention.

  However, I am pessimistic. The least confident step in my diagnosis is dismissing C as merely opportunistic. If SNP-based heritability diverges significantly from twin-based due to non-additive effects, the whole additive model A and B fight over might be wrong. If the architecture is non-linear, both A's variance decomposition and B's linear predictions fail.

  Expect no progress because the dispute serves a social function. A needs the argument to prevent fatalism; B needs it to prevent utopianism. Resolving the math removes their weapons. They will find new numbers to fight over because the conflict is about hope versus realism, not variance components. The argument is a proxy war for political philosophy, and no amount of quantitative genetics will settle whether we should prioritize equity or efficiency.
