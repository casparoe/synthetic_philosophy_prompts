  2.  **Analyze the Core Conflict:**

      *   **German Model:** *Ordnung* (Order) + *Grundrecht* (Fundamental Right). Transparency *to* the state for administrative function, but strict barriers *within* the state and against the private sector. Privacy = Contextual Integrity + Purpose Limitation.
      *   **American Model:** Liberty *from* the state (4th Amendment style), but laissez-faire for the market. Privacy = Secrecy/Confidentiality + Property Rights over data.
      *   **The Friend's Point:** Functional equivalence of surveillance. The state knows where you sleep in DE; Capital knows where you sleep in US.
      *   **The User's Point:** Procedural safeguards matter. Knowing *where* you sleep is different from knowing *who* you sleep with, *what* you buy, and *combining* that to score you.

  3.  **Drafting Section 1: The German Bundle (Presuppositions):**

      *   *Knowledge vs. Authority:* It's definitely about **Authority** and **Context**, not raw knowledge. The state *is* allowed to know your address (for taxation, voting, conscription, policing). It is *not* allowed to know your medical history just because it knows your address.
      *   *The Tension:* How does mandatory registration fit with "Informational Self-Determination"?
          *   *Resolution:* The German conception isn't "I own my data." It's "The state is a fiduciary of order." You owe the state legibility (*Scott's Seeing Like a State*) in exchange for legal personality and protection.
