      *   *Foucauldian:* Tricky. A Foucauldian would see the *Anmeldung* as pure disciplinary power (panopticon). However, they might acknowledge the *Zweckbindung* as a friction point that disrupts the smooth flow of biopower. (Need to be nuanced here).
