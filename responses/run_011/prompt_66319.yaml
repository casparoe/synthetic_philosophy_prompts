  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the User and Context:**
      *   **Role:** Research Ethics Review Lead at a mid-size health app company (250 employees).
      *   **Background:** Philosophy training, no legal/clinical training.
      *   **Workload:** 25-40 protocols/month (surveys, usability, passive sensing, some trials).
      *   **Current Process:** Ops coordinator (20 mins, no ethics background) -> User (gut feeling, biased by team rapport) -> Outside Counsel (expensive, limited use).
      *   **Pain Points:** "Gut" is unreliable. Compliance team mislabels everything as "coercive" (confusing undue influence, coercion, and mere discomfort). Consent validity is vague. Needs a clear escalation path to save counsel costs.
      *   **Specific Needs:**
          *   Step-by-step decision procedure for consent validity.
          *   Grounded in ethical theory (not just current forms).
          *   Distinguish failure modes (disclosure, comprehension, voluntariness, competence).
          *   Handle the "payment/coercion" debate robustly.
          *   Identify hard stops vs. flags vs. judgment calls.
          *   Apply to three specific live protocols.
          *   Include one "annoying" verdict (strict adherence over convenience).
          *   No bibliography/reading list (just use proper terms).
          *   Finish with limitations/failure modes of the procedure itself.

  2.  **Deconstruct "Valid Consent" (Ethical Framework):**
      *   Standard bioethics framework (Beauchamp & Childress, Faden & Beauchamp):
          1.  **Disclosure:** Is information provided?
          2.  **Comprehension:** Is it understood?
          3.  **Voluntariness:** Is it free from coercion/undue influence?
          4.  **Competence:** Does the agent have the capacity to decide?
          5.  **Authorization:** Is there explicit agreement?
      *   *Correction/Refinement:* The user specifically wants to distinguish between "too much disclosure," "too little," "not understood," "understood but not free," "free but not competent."
      *   *Terminology:* Use standard terms like *Undue Inducement*, *Therapeutic Misconception*, *Broad Consent*, *Deception*, *Debriefing*.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* actionable, sequential, distinct escalation points.
      *   *Step 1: Competence/Capacity.* (Hard stop if lacking, unless waived/parental).
      *   *Step 2: Disclosure/Transparency.* (Hard stop if material risks hidden, unless Deception Protocol).
      *   *Step 3: Comprehension.* (Flag if jargon-heavy, Hard stop if no mechanism to verify).
      *   *Step 4: Voluntariness (The Coercion/Inducement Check).* This is the big one for the user. Need to separate *Coercion* (threat) from *Undue Inducement* (offer too good to refuse).
      *   *Step 5: Scope/Authorization.* (Hard stop if data use exceeds consent).
      *   *Escalation Logic:* Ops does Steps 1 & 2. User does 3 & 4. Counsel does Legal/Regulatory conflicts.

  4.  **Refining the "Money/Coercion" Distinction:**
      *   Compliance calls $400 "coercive." Ethically, that's usually *Undue Inducement*.
      *   *Coercion:* "Do this or I fire you/treat you poorly." (Threat).
      *   *Undue Inducement:* "Do this and you get rich/healthy." (Offer that clouds judgment of risk).
      *   *Procedure:* Must ask: "Does the offer distort the perception of *risk*?" vs. "Does the threat remove the option to *refuse*?"

  5.  **Applying to the Three Protocols:**

      *   **Protocol 1: Paid Usability ($400, 90 mins, $14/hr market).**
          *   *Math:* $400/1.5hrs = ~$266/hr. Market is $14/hr. This is massive overpayment.
          *   *Issue:* Undue Inducement. Participants saying "really needed this" signals financial vulnerability.
          *   *Verdict:* **Hard Stop/Redesign.** (This will be the "annoying" verdict). It risks compromising data quality (lying to qualify) and exploits vulnerability.
          *   *Why annoying:* Product teams hate losing usability participants. $400 is likely a budget line item they don't want to change.

      *   **Protocol 2: Deception Study (Tracking feature, hidden hypothesis).**
          *   *Issue:* Deception.
          *   *Ethical Standard:* Permissible if necessary for validity, minimal risk, debriefing provided.
          *   *Check:* Did they disclose *what* is recorded? Yes. Risks? Yes. Debrief? Yes.
          *   *Verdict:* **Approved with Conditions.** (Ensure debrief is robust).
          *   *Nuance:* Distinguish from "lack of disclosure." This is *Active Deception*.

      *   **Protocol 3: Passive Collection (One tap, 2200 words, future features).**
          *   *Issue:* Broad Consent vs. Specific Consent. "Clickwrap" fatigue.
          *   *Ethical Standard:* Comprehension is impossible here. Scope is undefined ("feature we haven't built yet").
          *   *Verdict:* **Hard Stop/Redesign.** (Another strict one, but maybe Protocol 1 is the "annoying" one regarding money). Let's make Protocol 1 the "annoying" one regarding payment, as that's the specific argument the user mentioned. Protocol 3 is obviously bad legally/ethically. Actually, Protocol 3 is a GDPR/CCPA nightmare too. Let's make Protocol 1 the "annoying" ethics verdict (money isn't coercion but is undue inducement) and Protocol 3 a hard legal/ethics stop.
          *   *Wait, user wants ONE annoying verdict.* Protocol 1 is the best candidate for "you think you're fine but you're not." Protocol 3 is obviously broken. Protocol 2 is standard. I will make Protocol 1 the "Annoying" one because stopping usability testing over payment hurts velocity.

      *   *Wait, re-reading the prompt:* "I want at least one of the three verdicts to be one I'll be annoyed by."
      *   *Strategy:* Protocol 1 ($400) is the most likely to cause internal friction. Product teams love high show-up rates. Telling them $400 is unethical *Undue Inducement* will be annoying.
      *   *Protocol 3:* This is legally toxic (GDPR/CCPA specific consent). I should flag it as a Hard Stop primarily on *Scope* (Broad consent for undefined future use).

  6.  **Addressing the Teen Protocol (in the procedure, not examples):**
      *   Need a step for *Legally Authorized Representatives (LAR)* vs. *Assent*.
      *   Acknowledge the "mature minor" issue but stick to legal compliance for the Hard Stop, flag the ethical tension.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the role shift from "gut" to "process."
      *   **The Procedure (The "Consent Validity Algorithm"):**
          *   Define the 4 pillars (Capacity, Disclosure, Comprehension, Voluntariness).
          *   Create the Flow (Ops -> Lead -> Counsel).
          *   Define the "Coercion" confusion explicitly.
      *   **The Three Verdicts:**
          *   Case 1 (Money): Undue Inducement. Verdict: Reject/Reduce. (The Annoying One).
          *   Case 2 (Deception): Permissible Deception. Verdict: Approve with Debrief.
          *   Case 3 (Passive/Broad): Invalid Authorization. Verdict: Reject.
      *   **Procedure Limitations:** Where does this framework fail? (e.g., systemic power imbalances, novel tech risks not in forms).

  8.  **Refining the "Money" Argument:**
      *   The user argued with an ICU nurse.
      *   *Nurse view:* Payment distracts from risk.
      *   *Econ view:* Payment compensates for time/burden.
      *   *Ethics resolution:* Payment is not coercion (no threat). Payment *can* be undue inducement if it blinds the participant to risk.
      *   *Test:* Would they do it if the money was $0? If yes, payment is bonus. If no, does the money make them ignore risk?
      *   *In Case 1:* $266/hr vs $14/hr. They *need* the money ("really needed this"). This suggests the money overrides risk assessment (even if risk is low, the *principle* holds).

  9.  **Refining the "Passive Collection" (Case 3):**
      *   2,200 words, one tap.
      *   *Failure Mode:* Comprehension (nobody reads) + Authorization (scope creep).
      *   *Term:* "Blanket Consent" or "Broad Consent" (usually restricted to biobanking, not app features).
      *   *Verdict:* Hard Stop.

  10. **Refining the Procedure Limitations:**
      *   Checklist bias (ticking boxes without thinking).
      *   Power dynamics not captured in forms (employer/employee, doctor/patient).
      *   Novel harms (data re-identification) not obvious at consent stage.

  11. **Review against Constraints:**
      *   Step-by-step? Yes.
      *   Grounded in ethics? Yes (Faden/Beauchamp framework implied).
      *   Hard stops vs. flags? Yes.
      *   Judgment calls marked? Yes.
      *   Money argument addressed? Yes.
      *   Three live runs? Yes.
      *   One annoying verdict? Yes (Case 1).
      *   No bibliography? Yes.
      *   Teen protocol mentioned in procedure? Yes.
      *   Limitations section? Yes.

  12. **Final Polish:**
      *   Tone: Professional, direct, empathetic to the workload but firm on ethics.
      *   Formatting: Clear headers, bold text for decisions.
      *   Ensure the distinction between *Coercion* and *Undue Inducement* is crystal clear, as that's a specific pain point.

  *(Self-Correction during drafting)*: I initially thought about making Case 3 the annoying one. But Case 3 is legally indefensible in most jurisdictions (GDPR/CCPA require specific purpose). Case 1 is ethically defensible as "generous" but ethically risky as "undue." Stopping a usability study because you're paying *too well* is counter-intuitive to product teams and will be more annoying than stopping a legally shady data grab. I will stick with Case 1 as the annoying verdict.

  *(Check on Teen Protocol)*: User said "say where that goes in the procedure, but keep the worked examples to the three above." I need to insert a specific step or note in the procedure about Minors/LARs.

  *(Check on Escalation)*: Ops does 20 mins. They can't assess comprehension deeply. They check for *presence* of elements. Lead assesses *quality*. Counsel assesses *liability*. I need to make sure the handoff is clear.

  *(Check on "Gut")*: The procedure needs to force documentation of the *reason* for a decision, not just a Yes/No.

