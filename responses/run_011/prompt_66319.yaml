answer: |-
  ### The Consent Validity Procedure (CVP)

  This procedure replaces "gut feeling" with a structured audit of the four necessary conditions for valid consent: **Capacity, Disclosure, Comprehension, and Voluntariness.**

  **Roles:**
  *   **Ops Coordinator:** Checks for *presence* of elements (Checklist).
  *   **Ethics Lead (You):** Checks for *quality* and *context* (Judgment).
  *   **Outside Counsel:** Checks for *regulatory liability* (Legal Hard Stops).

  ---

  #### Step 1: Capacity (Competence)
  **Owner:** Ops Coordinator
  **Question:** Does the participant have the legal and cognitive ability to consent?
  *   **Pass:** Adults (18+) with no known cognitive impairment relevant to the decision.
  *   **Minor/Dependent Protocol:** If participants are <18 or lack capacity, is there a **Legally Authorized Representative (LAR)** consent + participant **Assent**?
      *   *Note on Teens:* If teens understand better than parents (common in digital health), you still require parental consent for legal protection, but the *Assent* process must be robust. If a teen refuses assent, the protocol stops, even if parents consent.
  *   **Fail (Hard Stop):** No LAR process for minors; recruiting from a population known to lack capacity (e.g., acute psychosis) without a clinical waiver.
  *   **Escalation:** If capacity is borderline (e.g., cognitive decline study), escalate to Counsel.

  #### Step 2: Disclosure (Transparency)
  **Owner:** Ops Coordinator
  **Question:** Are the material facts present in the document?
  *   **Pass:** Purpose, procedures, risks, benefits, compensation, contact info, right to withdraw are written.
  *   **Fail (Hard Stop):** Material risks hidden; purpose misidentified (unless Step 2b applies).
  *   **Step 2b: Deception Check:** Is information deliberately withheld to preserve study validity?
      *   **Requirement:** Must justify why disclosure ruins the data. Must plan for **Debriefing** (telling the truth post-study).
      *   **Escalation:** All deception protocols go to Ethics Lead.

  #### Step 3: Comprehension (Understanding)
  **Owner:** Ethics Lead
  **Question:** Is the information accessible, and is there a mechanism to verify understanding?
  *   **Pass:** Language is below 10th-grade reading level; key risks highlighted; "Teach-back" or quiz used for high-risk studies.
  *   **Flag:** Dense legal jargon (>2,000 words without summary); "Clickwrap" (one tap) for sensitive data.
  *   **Fail (Hard Stop):** No reasonable opportunity to read (e.g., consent given *after* data collection starts); critical risks buried in terms of service.
  *   **Judgment Call:** *How much understanding is enough?* For low-risk surveys, reading the summary is enough. For interventional trials, verifying understanding is required.

  #### Step 4: Voluntariness (Freedom from Control)
  **Owner:** Ethics Lead
  **Question:** Is the decision free from **Coercion** or **Undue Inducement**?
  *   *Crucial Distinction:*
      *   **Coercion:** A *threat* of harm if they refuse (e.g., "If you don't join, your doctor won't treat you"). **Always a Hard Stop.**
      *   **Undue Inducement:** An *offer* so attractive it clouds judgment of risk (e.g., "$5,000 for a risky blood draw"). **Context Dependent.**
  *   **The Payment Test:**
      1.  Calculate hourly rate.
      2.  Compare to local living wage/participant baseline.
      3.  Ask: "Would they accept the *risks* if the payment were $0?"
      4.  Ask: "Does the payment make them ignore the *risks*?"
  *   **Pass:** Compensation covers time + burden without distorting risk perception.
  *   **Flag:** Payment >3x local market rate for low-skill tasks; Recruiter is participant's direct care provider (Power Imbalance).
  *   **Fail (Hard Stop):** Threats involved; Payment contingent on *completion* rather than *participation* (forces them to endure risk to get paid).
  *   **Judgment Call:** *The Vulnerability Threshold.* If participants explicitly state financial desperation ("I need this"), high payment becomes exploitative even if voluntary.

  #### Step 5: Scope (Authorization)
  **Owner:** Ethics Lead / Counsel
  **Question:** Does the data use match the consent granted?
  *   **Pass:** Specific use cases defined.
  *   **Fail (Hard Stop):** "Blanket Consent" for undefined future features; Data sold to third parties not listed.
  *   **Escalation:** Any "Broad Consent" (future unspecified research) goes to Counsel.

  ---

  ### Live Protocol Verdicts

  Here is the procedure applied to your three current protocols.

  #### 1. Paid Usability Sessions ($400, 90 mins, $14/hr market)
  *   **Step 1 (Capacity):** Pass.
  *   **Step 2 (Disclosure):** Pass.
  *   **Step 3 (Comprehension):** Pass.
  *   **Step 4 (Voluntariness):** **FAIL.**
      *   *Analysis:* $400 for 1.5 hours is ~$266/hour. The market rate is $14/hour. This is a **19x premium**.
      *   *Failure Mode:* **Undue Inducement.**
      *   *Evidence:* Participants stating they "really needed this" indicates financial vulnerability. The payment is no longer compensation for time; it is a pressure tactic that compromises the *freedom* of the choice. It encourages participants to lie about eligibility to qualify (data integrity risk) and exploits economic desperation (ethical risk).
      *   *Verdict:* **Hard Stop / Redesign.**
      *   *Required Fix:* Reduce stipend to a reasonable hourly rate + burden (e.g., $50-$75/hour). If you need high show-up rates, improve scheduling, not bribes.
      *   *Note:* I know this verdict is annoying. You will lose participants. Product teams will argue this is "generous," not "coercive." The procedure classifies this as **Undue Inducement**, which invalidates consent just as surely as a threat.

  #### 2. Tracking Feature (Hidden Hypothesis, Debrief at End)
  *   **Step 1 (Capacity):** Pass.
  *   **Step 2 (Disclosure):** **Flag (Deception).**
      *   *Analysis:* You are withholding the *hypothesis*, not the *procedure*. Participants know what is recorded and the risks.
      *   *Failure Mode:* **Active Deception.**
      *   *Requirement:* Deception is permissible in behavioral research *if* necessary for validity and risks are minimal.
      *   *Verdict:* **Approved with Conditions.**
      *   *Required Fix:* The **Debriefing** must be mandatory. You cannot just send an email. You must confirm they received the true purpose and offer them the chance to withdraw their data *after* learning the truth. If they withdraw post-debrief, data must be destroyed.

  #### 3. Passive Collection (One Tap, 2,200 Words, Undefined Future)
  *   **Step 1 (Capacity):** Pass.
  *   **Step 2 (Disclosure):** **Fail.**
      *   *Analysis:* "Feature we haven't built yet" is undefined scope.
  *   **Step 3 (Comprehension):** **Fail.**
      *   *Analysis:* 2,200 words behind a single tap is **Constructive Non-Disclosure**. Ethically, this is equivalent to no consent.
  *   **Step 5 (Scope):** **Fail.**
      *   *Analysis:* This is **Blanket Consent**. In health data, you cannot consent to "whatever we build later."
      *   *Verdict:* **Hard Stop / Redesign.**
      *   *Required Fix:* You need **Layered Consent**. Top layer: "We collect X to build Y." Second layer (optional): "We may use anonymized data for Z." You cannot collect for a feature that does not exist yet without a new consent event when that feature launches.

  ---

  ### Where This Procedure Misfires

  No checklist captures the full moral landscape. Here is where the CVP will fail you, so you can watch for it.

  **1. The "Box-Ticking" Trap (False Security)**
  The procedure will wave through protocols where every box is checked but the *spirit* is violated.
  *   *Example:* A consent form is 8th-grade reading level (Step 3 Pass), but the font is light gray on white background. Or, the recruiter reads the script perfectly but rolls their eyes when a participant asks a question. The CVP audits the *document*, not the *interaction*.
  *   *Mitigation:* Randomly audit recorded consent conversations, not just forms.

  **2. The "Low Risk" Blind Spot**
  The procedure is calibrated to catch high-risk failures. It may wave through "low risk" data collection that creates systemic harm.
  *   *Example:* Passive collection of mood data (Step 2 Pass, Step 5 Pass). Individually low risk. Aggregated across 100k users, you can identify population-level mental health crashes. The CVP treats this as standard data collection, but the *societal* risk is high.
  *   *Mitigation:* Once a year, review "low risk" protocols in aggregate for pattern risks.

  **3. The Power Imbalance Blind Spot**
  The procedure identifies direct coercion (Doctor/Patient). It misses structural coercion.
  *   *Example:* You recruit from your own user base (Protocol 1). If your app is essential for their health management, opting out of research might feel like risking service quality, even if you say it's voluntary. The CVP treats "User Base" as a neutral pool. It is not.
  *   *Mitigation:* Flag any study where the researcher controls a service the participant *needs* (not just wants). Escalate these to Counsel even if they look low-risk.

  **4. The Innovation Lag**
  Ethics frameworks lag behind tech.
  *   *Example:* AI model training. Consent says "we use your data to improve the app." The model inadvertently learns to discriminate against a specific demographic. The consent was valid (Step 2 Pass), the outcome was harmful. The CVP cannot predict algorithmic emergent behavior.
  *   *Mitigation:* Add a "Data Safety Monitoring" step for any protocol feeding machine learning models, separate from initial consent review.

  ### Final Instruction for Ops Coordinator
  To make this work, give your Ops Coordinator a **Traffic Light Sheet**:
  *   **Green:** Standard surveys, usability <2x market rate, no health data. (Ops approves).
  *   **Yellow:** Deception, payment >2x market rate, minors, passive sensing. (Ops flags -> You review).
  *   **Red:** Clinical intervention, blanket consent, coercion indicators, data selling. (Ops flags -> You review -> Counsel).

  This saves your gut for the Yellow zones where it's actually needed, and keeps the Red zones out of your hands until they are pre-vetted.
