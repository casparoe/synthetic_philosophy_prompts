  2.  **Deconstruct Question 1: "The Onely Science" & God**
      *   *Context:* Hobbes distinguishes between "Prudence" (experience-based) and "Science" (reasoning-based).
      *   *The "Hitherto" Clause:* This is crucial. It implies temporal limitation. Geometry *has been* achieved. Civil philosophy *has not yet* been achieved (at the time of writing). *Leviathan* itself is an attempt to *make* civil philosophy a science.
      *   *The God Clause:* Why God? Hobbes is a materialist/nominalist, but he writes for a Christian audience and operates within a providential framework publicly. Also, for Hobbes, truth is ultimately about the correct ordering of names. The capacity for reason (the "light of the mind") is a divine gift. But more specifically, the *success* of geometry is seen as a rare blessing because human passion usually obstructs reason. In civil matters, passion (pride, greed) blocks the acceptance of demonstrative truth. Geometry is "bestowed" because it's the one area where human passions haven't successfully corrupted the reasoning yet.
      *   *Synthesis:* It's about *actualized* science vs. *potential* science. Civil philosophy is *capable* of being a science (as he argues later), but historically, only geometry has *been* one. God gets the credit because reason itself is divine, and the peace required for geometry is providential.

  3.  **Deconstruct Question 2: Nominalism vs. Geometric Necessity**
      *   *The Problem:* If names are arbitrary, how can "triangle" yield necessary truths?
      *   *Hobbes's Solution:* Truth is *in the proposition, not the thing*. "True" and "False" are attributes of speech, not objects.
      *   *The "Extra Ingredient":* It's not just naming; it's *construction*. In geometry, we define the cause of the figure. We don't just point to a triangle; we define it by its generation (e.g., "a figure made by moving a line...").
      *   *Why Geometry and not Justice?* In geometry, the definitions are of things we *create* (mentally or on paper). We know the properties because we put them there. In civil philosophy, we *also* create the Commonwealth (via covenant), so it *can* be scientific (answering the user's point about civil philosophy). But in natural philosophy (physics), we don't create the causes, so we can't be certain.
      *   *Key Distinction:* Arbitrary naming + Constructibility = Certainty. We stipulate what a triangle *is*, and because we control the stipulation, the consequences follow necessarily *within the system of names*.

  4.  **Deconstruct Question 3: The Deaf Man & The Role of Speech**
      *   *The Deaf Man Example:* Hobbes uses this to distinguish "Knowledge of Fact" (experience/memory) from "Science" (reasoning/consequence).
      *   *The Deaf Man's Status:* He has *experience* of the truth for *that* triangle. He lacks *Science* because Science requires knowing the *consequence* universally.
      *   *Words as Marks:* Words allow us to mark the consequence ("If triangle, then 180 degrees") so we don't have to re-prove it every time.
      *   *Reconciling with the "Definitions" Claim:* The deaf man intuits the relation, but without settled significations (definitions), he cannot build a *chain* of reasoning (a "reckoning"). Science is a *system* of consequences. You can't have a system without stable markers (words/definitions).
      *   *Resolution:* The deaf man has a flash of insight (prudence/experience). The geometer has Science because he records the definition, allowing him to chain this truth with others. Geometry is the science *because* it successfully institutionalizes these definitions, not because the raw insight is impossible without them.

