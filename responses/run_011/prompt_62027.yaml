answer: |-
  This is a superb set of questions. You have spotted the exact tension points where Hobbes's nominalism, his epistemology, and his political project collide. To read this sentence correctly, you have to hold three distinct Hobbesian technical distinctions in mind simultaneously: *Truth vs. Science*, *Construction vs. Observation*, and *Reason vs. Prudence*.

  Here is how to unpack those three sticking points.

  ### 1. "The onely Science... hitherto"
  You are right to suspect that "hitherto" is doing the heavy lifting, but the "God" part is not just rhetorical cover.

  **The Achievement vs. Capacity Distinction:**
  Hobbes believes civil philosophy *is capable* of being a science (demonstrative), but he does not believe it *has been* one yet. When he writes *Leviathan*, he is attempting to perform the very act that makes civil philosophy a science for the first time. So, geometry is the "onely Science" historically achieved, not the only one metaphysically possible.

  **Why God?**
  For Hobbes, the obstacle to science in civil matters is not intellectual difficulty; it is **passion**. Men can agree on geometry because lines and figures do not compete for power, profit, or honor. Men *cannot* agree on civil philosophy because their pride and greed distort their reasoning about justice and sovereignty.
  Therefore, geometry is "bestowed by God" in the sense that it is the one domain where God (or Nature) has allowed human reason to operate without the corruption of passion. It is a providential exception. By framing it this way, Hobbes is subtly setting up his own project: he is claiming that *Leviathan* will finally extend this divine blessing to civil matters, provided men submit their passions to the sovereign just as geometers submit to definitions.

  **How to read it:** Read "onely Science... hitherto" as a historical claim, not a metaphysical limit. Read "pleased God" as a comment on the *conditions of peace* required for science to exist, which have only existed in geometry, not in politics.

  ### 2. Definitions and Certainty (The Nominalist Problem)
  This is the crux of Hobbes's epistemology. If names are arbitrary, how can truth be necessary?

  **Truth is in the Proposition, Not the Thing:**
  For Hobbes, "True" and "False" are attributes of speech, not of objects. There is no "triangle" in the world that is perfectly true; there are only drawn figures. The necessity comes from the **stipulation**.
  When I define a triangle, I am not describing an existing object; I am issuing a decree: *"Let the name 'triangle' stand for 'three-sided rectilinear figure'."*
  Once I have voluntarily imposed that name, I am bound by the consequences of that imposition. The certainty of geometry comes from the fact that **we create the causes**. We draw the line; we generate the figure. Because we know exactly what we put into the definition (because we put it there), we can know exactly what comes out.

  **Why not Justice?**
  In natural philosophy (physics), we observe effects and guess at causes. We didn't make the world, so we can't be certain of its definitions.
  In civil philosophy, Hobbes argues we *do* make the Commonwealth (via covenant). Therefore, civil philosophy *can* be certain, but only if we settle the significations of words like "Justice," "Person," and "Covenant" just as geometers do.
  The "extra ingredient" in geometry is not that the names refer to real essences (they don't), but that the definitions are **generative**. We define the *construction* of the figure. Until Hobbes comes along, political philosophers were trying to define justice by observing existing societies (empirical/uncertain) rather than defining it by the construction of the Commonwealth (demonstrative/certain).

  **How to read it:** Definitions buy certainty not because they match reality, but because they establish the rules of a game we are playing. Geometry is certain because we agree on the rules before we start playing. Politics has been uncertain because everyone plays by different rules.

  ### 3. The Deaf Man and the Role of Speech
  This is the trickiest part, and it hinges on Hobbes's specific definition of **Reason**.

  **Prudence vs. Science:**
  For Hobbes, the deaf man in your example has **Prudence** (or Experience), not **Science**.
  *   **Prudence:** "I have seen this triangle have 180 degrees, and that one too, and that one too. I expect the next one will as well." This is memory-based. It is fallible and limited to the specific instances remembered.
  *   **Science:** "I know *why* any triangle must have 180 degrees based on the consequence of its definition."

  **Reason is Reckoning:**
  Hobbes defines Reason explicitly as "Reckoning (that is, Adding and Subtracting) of the Consequences of general names agreed upon for the marking and signifying of our thoughts."
  Without words (marks), you cannot "reckon." You can have a flash of insight (like the deaf man), but you cannot hold the steps in your mind long enough to chain them together into a universal demonstration. You cannot move from *this* triangle to *all* triangles without the mark "Triangle" to carry the consequence.

  **Reconciling the Paradox:**
  The deaf man lands the *truth* (the fact of the angles), but he does not possess the *Science* (the knowledge of the consequence).
  *   **Words add:** Generality and the ability to chain consequences (memory is too weak to hold a long proof without marks).
  *   **Geometry is the Science:** Not because the insight is impossible without words, but because **Science is the system of recorded consequences.** Geometry is the only field that has successfully institutionalized the "settling of significations" required to turn those flashes of insight into a transmissible, universal system.

  **How to read it:** The deaf man has the raw material of truth, but without "settled significations" (definitions), he cannot build the edifice of Science. He is a bricklayer with bricks but no mortar. Geometry is the "onely Science" because it is the only discipline that has consistently used the mortar (definitions) to build a structure that stands universally.

  ### Summary for your reading
  When you reread that sentence, parse it like this:

  *   **"And therefore in Geometry..."**: Because speech is necessary for reasoning (reckoning)...
  *   **"(which is the onely Science that it hath pleased God hitherto to bestow on mankind,)"**: ...this method has only successfully produced certain knowledge in one field so far (because passions corrupt the others)...
  *   **"men begin at settling the significations of their words;"**: ...by agreeing on exactly what their names stand for (stipulative definitions)...
  *   **"which settling of significations, they call Definitions; and place them in the beginning of their reckoning."**: ...so that they can calculate consequences universally, rather than relying on fallible memory or experience.

  Hobbes is telling you: *Geometry works because they define their terms before they argue. Politics fails because they argue before they define. I am going to fix politics by making it look like geometry.*
