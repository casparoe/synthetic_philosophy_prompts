  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Text:** Thomas Hobbes, *Leviathan*, Part 1, Chapter 4 ("Of Speech").
      *   **Specific Sentence:** "And therefore in Geometry, (which is the onely Science that it hath pleased God hitherto to bestow on mankind,) men begin at settling the significations of their words; which settling of significations, they call Definitions; and place them in the beginning of their reckoning."
      *   **User's Struggles:** Three specific interpretive problems.
          1.  *The "Onely Science" claim:* How does this fit with Hobbes's view that civil philosophy is also demonstrative? Is it about achievement vs. possibility? Why attribute it to God?
          2.  *Definitions and Certainty:* If Hobbes is a nominalist (names are arbitrary marks), how do definitions yield necessary truth? Why is geometry special compared to justice?
