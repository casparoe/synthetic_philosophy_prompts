        "clause_doing_the_work": string,
        "why_it_is_hard": string,          // what makes this a test of the principle rather than a restatement of it
        "you_would_get_this_wrong": boolean  // true for at least one entry, per item 3 above
      }
    ],
    "unaccommodated_verdicts": [           // empty array if your principle saves everything; say so in "summary" if it does
      {
        "case_id": string,
        "why_the_principle_rejects_it": string,
        "cost_of_saving_it": string        // the machinery required, and how ad hoc it is
      }
    ],
    "simplicity_trade": {
      "verdict_to_overturn": string,       // case id
      "simpler_principle": string,         // the stripped-down version that overturns it
      "argument": string                   // why I should give the verdict up rather than keep the machinery
    },
    "flagged_pairs": [                     // exactly two entries: ["C4","C5"] and ["C6","C7"]
      {
        "pair": [string, string],
        "diagnosis": string,
        "justifying_feature": string | null,   // null if you concede the verdicts cannot both stand
        "verdict_that_goes": string | null     // case id, or null if the pair is reconciled
