answer: |-
  **Q&A Preparation Sheet: "Implicature Without Content"**

  **Opening Statement (Two Sentences)**
  Thank you. I want to begin by suggesting that we have been looking for implicature in the wrong place: not in the content added to the common ground, but in the normative status of the speaker within it. If we treat implicature as a change in commitment rather than a piece of information, the puzzles of cancellation and embedding dissolve without requiring us to posit hidden propositions.

  ***

  **1. The Compositionality Objection (Formal Semanticists)**
  **Objection:** "You claim implicatures are normative standings, not contents. But semantic values compose. If I say, 'If some of the applicants were shortlisted, we will celebrate,' the implicature disappears in the antecedent. If implicature is a standing, why does the conditional operator block it? A stance doesn't look like it fits into the semantic valuation function; you seem to be asking us to treat pragmatic norms as if they were semantic operators without giving them a semantic value."
  **Reply:** I agree that normative standing does not compose semantically, and that is precisely why the implicature disappears under embedding. On my account, the conditional does not block a derived content; it merely creates a hypothetical context where the speaker's actual standing is not yet at stake. The hearer processes the antecedent by adjusting *what is said* to fit the hypothetical scenario, not by computing a standing change that would only apply to an actual assertion. The intuition that the implicature vanishes is correct, but the explanation is that the speaker has not yet asserted anything, so no commitment has been undertaken. We do not need a semantic value for standing because standing is not part of the truth-conditional content that the operator scopes over.
  **Softest Point:** Explaining *local* implicatures where the effect seems to persist inside the scope without a full assertion.
  **Instruction:** **Hold ground.** Do not concede that standing must compose; insist that embedding data is evidence *against* content-based accounts.

  **2. The Notational Variant Objection (Formal Semanticists)**
  **Objection:** "You say the hearer acquires a 'normative orientation' rather than the content *not all*. But to know I am committed to *not relying on all*, don't I have to represent the proposition *all* and reject it? If your 'standing' is defined by the alternative it rules out, you haven't eliminated the proposition; you've just moved it from the 'asserted' box to the 'commitment' box. This looks like a relabeling that buys no theoretical economy."
  **Reply:** It is not a relabeling because propositions and standings have different logical properties. A proposition is truth-apt; a standing is liability-apt. If implicature were content, explicit cancellation would be a contradiction, asserting *p* and *not-p*. Since cancellation is coherent, the implicature cannot be content. My account captures this by treating the 'alternative' not as a represented proposition but as a boundary of liability. You do not need to represent *all* to know I am not answerable for it; you only need to recognize that I have forfeited the standing to insist on it. The economy is bought by explaining cancellation without contradiction.
  **Softest Point:** The mechanism by which the hearer identifies the boundary without representing the alternative.
  **Instruction:** **Hold ground.** This is the core philosophical claim; conceding here collapses the thesis.

  **3. The Processing Cost Objection (Psycholinguists)**
  **Objection:** "Our eye-tracking data shows that underinformative utterances like *some* incur a processing cost compared to *all*. This is usually taken as evidence for the time required to derive the alternative content. If your hearer isn't deriving content, what exactly is causing the delay? A change in normative standing must have a measurable signature, and currently, the data favors local derivation of content."
  **Reply:** The processing cost does not necessarily track content derivation; it tracks the assessment of speaker reliability. When a hearer encounters an underinformative utterance, they must evaluate whether the speaker is being scrupulous or misleading. This evaluation of normative standing—checking the speaker against the quantity norm—is cognitively demanding in its own right. My account predicts that this cost should vary with the hearer's prior experience of the speaker's scrupulousness, whereas content-based accounts predict it should track logical strength alone. The current data shows logical strength effects because experimental settings standardize social reliability; vary the social setting, and the cost profile should shift.
  **Softest Point:** Lack of existing data showing social variables overriding logical strength in reading times.
  **Instruction:** **Concede partially.** Acknowledge the current data fits content models but insist your model predicts *new* variables they haven't tested yet.

  **4. The Local Implicature Objection (Formal Semanticists)**
  **Objection:** "You say standing doesn't embed. But consider 'Every student who read some of the books passed.' There seems to be a local implicature *not all* attached to the restrictor. If implicature is a global standing change, how do you get this local effect without semantic composition? You called this an adjustment to 'what is said,' but that looks like local enrichment, which is content-based."
  **Reply:** I treat this as the hearer projecting what the speaker's standing *would be* if they were asserting the restrictor directly. It is a hypothetical standing, not a composed semantic value. The hearer adjusts *what is said* in the restrictor to ensure the speaker remains consistent across the hypothetical contexts generated by the quantifier. This is not semantic composition of implicature but pragmatic adjustment of the semantic input to maintain normative coherence. The effect mimics composition, but the mechanism is the hearer ensuring the speaker doesn't commit to incompatible standings across the hypothetical cases.
  **Softest Point:** Distinguishing "hypothetical standing" from "local content" formally.
  **Instruction:** **Hold ground.** Frame it as a consistency check on the speaker, not a semantic operation.

  **5. The Indirect Rebuttal Objection (Relevance Theorist)**
  **Objection:** "In Relevance Theory, we explain indirect rebuttal and irony through cognitive effects on mutually manifest content. If I say *Some passed* and you say *Yeah, right*, you are rejecting the implication. If there is no content there, what are you rejecting? You cannot challenge a normative standing without representing the content that the standing restricts."
  **Reply:** You are challenging my authority to assert, not the truth of a hidden proposition. When you say *Yeah, right*, you are indicating that I have failed to meet the normative conditions for making the claim I did. You do not need to represent *not all* to see that I am being evasive; you only need to recognize that my commitment is insufficient for the context. The cognitive effect is not the addition of content but the realization that my testimony is unreliable. Irony works similarly: it exposes a mismatch between the standing claimed and the standing warranted, without requiring a propositional negation.
  **Softest Point:** Explaining how "unreliability" is communicated without propositional content.
  **Instruction:** **Hold ground.** Emphasize the social nature of rebuttal over the logical nature.

  **6. The Social vs. Logical Strength Objection (Psycholinguists)**
  **Objection:** "You predict effects should vary with social setting, not logical strength. But the reading-time data is robust: *some* always costs more than *all*, regardless of who is speaking. If your account relies on social assessment, why is the logical effect so dominant in the lab? It suggests the derivation is automatic and logical, not normative and social."
  **Reply:** The lab environment is a specific social setting where the experimenter is assumed to be maximally informative and the participant maximally scrutineering. In that specific context, logical strength is the primary proxy for reliability. My account does not deny logical effects; it claims they are mediated by normative expectations. If you introduce a power asymmetry—for example, if the speaker is known to be withholding information for safety—the processing cost should invert or disappear. The logical effect is a special case of the normative effect, not evidence against it.
  **Softest Point:** The need to actually demonstrate the inversion empirically.
  **Instruction:** **Concede.** Admit the prediction needs empirical verification and invite collaboration.

  **7. The Mechanism of Inference Objection (Post-Gricean Theorist)**
  **Objection:** "In the post-Gricean tradition, we explain inference via reasoning about informativeness. To know I am committed to *not all*, I must reason that if you knew *all*, you would have said *all*. How do you compute this normative conclusion without computing the content of the alternative? You seem to be skipping the reasoning step."
  **Reply:** I am not skipping the reasoning step, but I am denying that the *output* of that reasoning is content. The hearer reasons about the speaker's observance of the quantity norm, but the conclusion of that reasoning is a status assignment, not a proposition. You recognize the violation of the norm directly, without needing to store the negation of the stronger claim as a belief. The reasoning targets the speaker's behavior, not the world state. This preserves the Gricean insight about norms without reifying the implicature into a belief.
  **Softest Point:** Explaining how a conclusion about behavior doesn't entail a belief about the world.
  **Instruction:** **Hold ground.** Distinguish between *believing p* and *treating the speaker as committed to p*.

  **8. The Truth-Conditional Impact Objection (Formal Semanticists)**
  **Objection:** "If the standing change affects how the utterance is interpreted in embedding, doesn't it effectively change the truth conditions? If I treat 'Some' as 'Some but not all' for the purpose of the sentence's evaluation, haven't you just made the standing truth-conditional? If it affects truth, it's content."
  **Reply:** It affects assertibility conditions, not truth conditions. The sentence remains true if *all* were shortlisted, but the speaker becomes answerable for the falsehood of their implication. In embedding, the hearer adjusts *what is said* to avoid attributing inconsistent standings to the speaker, but this is a pragmatic repair mechanism, not a semantic shift. The truth conditions of the embedded clause remain classical; the hearer's interpretation is guided by normative coherence, not semantic valuation.
  **Softest Point:** The line between "pragmatic repair" and "semantic shift" is often blurred in data.
  **Instruction:** **Hold ground.** Maintain the distinction between truth and answerability.

  **9. The Explicature Blur Objection (Relevance Theorist)**
  **Objection:** "You say this isn't content, but you admit hearers adjust 'what is said' to accommodate the standing. In Relevance Theory, that is the development of explicature. You are describing pragmatic enrichment of the logical form, which is content-based. You are drawing a distinction where there is no functional difference."
  **Reply:** Explicature develops the content of the utterance to make it truth-evaluable. My account restricts the speaker's liability without changing the truth-evaluable content. When a hearer adjusts *what is said*, they are ensuring the speaker is not interpreted as contradicting their own standing, not enriching the proposition itself. The functional difference is visible in cancellation: you cannot cancel an explicature without contradiction, but you can cancel a standing change. The distinction is preserved by the data on retraction.
  **Softest Point:** Cases where adjustment to standing looks identical to enrichment of content.
  **Instruction:** **Hold ground.** Use cancellation as the definitive test.

  **10. The Action Guidance Objection (Post-Gricean Theorist)**
  **Objection:** "Communication is for action. If I hear *Some applicants were shortlisted*, I need to know whether to check the rest. If I don't derive the content *not all*, how do I know what to do? A normative standing doesn't tell me about the world; it tells me about you. How does that guide my action regarding the applicants?"
  **Reply:** It guides your action by telling you whether you can rely on me for the rest of the information. If I have forfeited the standing to insist on *all*, you know that checking the rest is necessary because I am not warranting their status. You act on the content *what was said* (*some*), but the standing tells you whether that content is sufficient for your needs. The action guidance comes from the combination of said content and speaker reliability, not from a derived proposition.
  **Softest Point:** Explaining why the hearer doesn't just store the derived content for efficiency.
  **Instruction:** **Concede partially.** Acknowledge hearers might store it as a heuristic, but insist the *mechanism* is normative.

  ***

  **Critical Survival Reply**
  The single reply that **must** land for the paper to survive is **Reply #1 (The Compositionality Objection)**.
  *Reasoning:* The majority of the specialized audience (semanticists) works within a derivational framework where compositionality is non-negotiable. If you cannot explain how your "standing" account handles operators like negation and conditionals without collapsing into a content-based account, the semanticists will dismiss the theory as linguistically inadequate. You must convince them that "not composing" is a feature, not a bug, and that the embedding data is better explained by pragmatic adjustment than semantic composition.

  **The Question to Hope Nobody Asks**
  **Question:** "Can the normative standing itself be the object of a propositional attitude? Can I believe *that you are committed to not-all*?"
  *Why it's dangerous:* If you say **yes**, you admit that standings can be propositionalized, which supports the Notational Variant objection (it's just content after all). If you say **no**, you make it impossible to report or reason about implicatures in higher-order contexts (e.g., "I know that you know that not all..."), which seems cognitively implausible.
  **Least Dishonest Fallback:** "I would argue that we report attitudes about standing using propositional language as a shorthand, but the underlying cognitive state is a representation of a social relation, not a truth-apt proposition. However, I am willing to concede that if a formal logic of standing can be developed, it might look propositional without functioning as content in the semantic interface."

  ***

  **Final Instruction on Tone**
  Maintain the distinction between "content" (truth-apt, compositional) and "standing" (liability-apt, normative) throughout. Do not let them force you into defining standing in terms of the content it excludes. When pressed on data, emphasize that your theory predicts *new* variables (social context) rather than denying existing ones (logical strength).
