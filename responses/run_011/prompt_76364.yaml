prompt: |-
  I'm teaching Bolt's A Man for All Seasons in a philosophy of language seminar alongside Austin, and I want to frame it as a play about performatives rather than about conscience, which is how it always gets taught. The obvious hook is the oath: More won't say the words, and Cromwell's whole game is to get him to speak — the state treats his not-saying as if it had content, and can't convict him until there's an overt act. So can Austin actually adjudicate that? Is Henry's declaration of himself Supreme Head of the Church a misfire (no such procedure exists, wrong person, coerced uptake) or an abuse (procedure intact, insincere)? The bit I most want pushed on: Austin's felicity conditions all presupose a convention that's already in place, but Henry is trying to create the convention in the very act of invoking it, with Parliament and the bishops ratifying after the fact. Does the play see that bootstrapping problem, or does it just assume the king's words fail because God isn't behind them? And second — More seems to hold that whether an oath binds turns on the swearer's private intention, which looks like exactly the casuistry he'd condemn in anyone else. Does Bolt notice? Does the Common Man's ending, keep alive and don't make trouble, amount to the play's verdict that what matters about an utterance is its effects rather than its sincerity conditions? Tell me where the reading breaks down; I don't want a piece that just uses the play to illustrate How to Do Things with Words.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Teaching *A Man for All Seasons* (Bolt) in a philosophy of language seminar alongside J.L. Austin's *How to Do Things with Words*.
      *   **Goal:** Frame the play as being about *performatives* rather than *conscience* (the traditional reading).
      *   **Key Arguments/Questions:**
          1.  Can Austin adjudicate the conflict (More's silence vs. Cromwell's demand for speech)?
          2.  Is Henry's Act of Supremacy a *misfire* (procedure wrong/coerced) or an *abuse* (procedure intact/insincere)?
          3.  **Crucial Point:** Austin's felicity conditions presuppose existing conventions. Henry is *creating* the convention via the utterance (bootstrapping). Does the play see this, or does it rely on theological validity ("God isn't behind them")?
          4.  **Crucial Point:** More treats the oath's binding nature as dependent on private intention (casuistry?). Does Bolt notice this irony?
          5.  **Crucial Point:** Does the Common Man's survivalist ending suggest a pragmatic verdict (effects > sincerity)?
      *   **Constraint:** "Tell me where the reading breaks down." The user *does not* want a simple illustration of Austin using the play. They want critical friction.

  2.  **Deconstruct the Austin/More Intersection:**

      *   *The Oath of Supremacy:* This is the central performative.
      *   *Austin's Framework:* Felicity conditions (A.1, A.2, B.1, B.2, etc.).
      *   *The "Bootstrapping" Problem:* Austin assumes a stable conventional procedure. Henry VIII is changing the constitution. He is the source of the convention *and* the user of it. This is a sovereign exception, not a standard speech act.
      *   *More's Silence:* Silence as a speech act? "I stand silent." Is this a refusal of uptake?
      *   *More's Intention:* More argues that silence implies no consent. Cromwell argues silence implies malice (treason). This is a conflict over *uptake* and *illocutionary force*.
      *   *The Common Man:* Represents the audience/society. His survival suggests a pragmatic ethic. Does this align with Austin's focus on the *doing* (effect) rather than the *thinking* (intention)?

  3.  **Address the Specific Questions:**

      *   **Henry's Supremacy (Misfire vs. Abuse):**
          *   *Misfire:* Austin says a misfire happens if the procedure doesn't exist or is flawed. Henry *makes* the procedure exist via Parliament. So, legally, it's not a misfire. Theologically (for More), it is.
          *   *Abuse:* Insincerity. Henry believes it (mostly). So not an abuse.
          *   *The Breakdown:* Austin's framework is descriptive of *existing* social rituals. It struggles with *revolutionary* speech acts that create the very social reality they invoke. This is closer to Agamben (state of exception) or Schmitt than Austin.
      *   **More's Casuistry:**
          *   More claims the *internal* state determines the binding nature. "An oath is made to God."
          *   Austin explicitly rejects intention as the sole determinant of illocutionary force (the "truth/falsity" vs. "happy/unhappy" distinction). For Austin, if the conventions are met, the act is done, regardless of inner reservation (unless it's an abuse).
          *   *The Breakdown:* More is actually *anti-Austinian* here. He relies on a pre-modern, sacramental view of language where the link between word and reality is guaranteed by God, not social convention. Austin is secular/conventional. More is theological/ontological.
      *   **The Common Man & Effects:**
          *   Common Man survives by adapting his speech to power.
          *   Does this mean "effects > sincerity"? In a way, yes. But Bolt frames this negatively (moral cowardice), whereas Austin is neutral on morality.
          *   *The Breakdown:* Austin isn't interested in moral survival; he's interested in linguistic classification. The Common Man's success shows the *power* of performatives within a system, but Bolt judges this morally. Austin doesn't judge.

  4.  **Synthesize the "Breakdown" Points (The Core Value):**

      *   *Point 1: The Sovereign Exception.* Austin assumes a stable community of speakers. Henry *is* the community. He changes the rules of the game while playing. Austin can't handle the *creation* of felicity conditions by fiat. This is where the reading hits a wall. The play acknowledges this (More: "The law is a causeway upon which so long as he keeps I am safe." Cromwell moves the causeway).
      *   *Point 2: Theology vs. Convention.* More's silence isn't just a linguistic strategy; it's a theological stance. Austin's performatives are social; More's oaths are sacramental. For More, God is the ultimate listener. For Austin, the audience is the community. If God isn't recognized by the state, the "convention" is split.
      *   *Point 3: Intention vs. Uptake.* More thinks his intention saves him. Cromwell (and the law) says uptake defines the act. The trial scene is a battle over *who controls uptake*. Austin sides more with Cromwell here (conventions determine force), which undermines More's philosophical position if read strictly through Austin.
      *   *Point 4: The Common Man.* He represents the "successful" speech actor in a corrupt system. He fits Austin's model (he follows conventions to get things done) better than More does. But Bolt condemns him. This creates a tension: Austin describes *how* language works, Bolt prescribes *how it should be used morally*.

  5.  **Drafting the Response:**

      *   *Tone:* Academic, rigorous, respectful of the user's sophisticated prompt. Avoid summarizing the plot. Focus on the friction.
      *   *Structure:*
          1.  Validate the premise (it's a strong reading).
          2.  Tackle the Henry/Bootstrapping issue (Sovereignty vs. Convention).
          3.  Tackle the More/Intention issue (Sacramental vs. Conventional).
          4.  Tackle the Common Man/Effects issue (Pragmatics vs. Ethics).
          5.  Conclusion: Where the theory fails the text (and vice versa).

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Austin is "wrong." Say his *scope* is limited to established conventions.
      *   *Nuance:* More isn't just a casuist; he's a legalist. He uses the *silence* as a legal shield. But his *reasoning* is theological. Distinguish these.
      *   *Henry's Act:* Is it a misfire? For More, yes (usurpation). For the State, no. This duality is key.
      *   *The Common Man:* He breaks the fourth wall. He is the narrator. His survival is a commentary on the audience. Connect this to "uptake."

  7.  **Final Polish:** Check against the user's specific constraints ("Tell me where the reading breaks down"). Ensure I don't just say "Yes, Austin fits." I need to show where Austin *doesn't* fit.

      *   *Key Insight:* Austin requires a shared form of life. The play depicts the *shattering* of a shared form of life (Christendom vs. Nation State). Austin cannot analyze a civil war of language games.

  8.  (Final Review of the Prompt's specific questions):
      *   *Henry's declaration:* Misfire or Abuse? -> Neither. It's constitutive/revolutionary.
      *   *Bootstrapping:* Does the play see it? -> Yes, through the Law vs. Conscience conflict.
      *   *More's Casuistry:* Does Bolt notice? -> Yes, that's the tragedy. More is trapped between legal silence and theological truth.
      *   *Common Man:* Effects vs. Sincerity? -> Yes, but Bolt adds a moral layer Austin lacks.

      *Ready to write.*
answer: |-
  This is a sharp, generative framing. Moving *A Man for All Seasons* from the ethics of conscience to the pragmatics of speech acts exposes the machinery of the state in a way the "martyrdom" reading obscures. Cromwell is indeed a proto-linguistic analyst: he knows that in a secularizing state, interiority is inadmissible evidence. Only the performative utterance counts.

  However, if you want to avoid the trap of simply using the play to illustrate *How to Do Things with Words*, you need to press where Austin's framework fractures under the weight of Bolt's political theology. Austin describes a stable linguistic community; Bolt depicts a community in the violent process of being re-founded.

  Here is where your reading holds, and crucially, where it breaks down.

  ### 1. Henry's Supremacy: Misfire, Abuse, or Sovereign Exception?
  You ask if Henry's declaration is a misfire (procedure wrong) or an abuse (insincere). Austin's taxonomy struggles here because it presupposes a pre-existing convention.
  *   **The Austinian View:** Legally, it is neither. Parliament provides the procedure (A.1), Henry is the appointed person (A.2), and he goes through it correctly (B.1). By Austin's lights, the Act of Supremacy is a "happy" performative. It *does* what it says.
  *   **The Breakdown:** More argues it is a *misfire* on theological grounds ("The service of God is not a trifle to be treated lightly"). But Austin is secular; he doesn't recognize God as a felicity condition.
  *   **The Real Problem:** This isn't a misfire or an abuse; it is a **constitutive revolution**. Henry is using a performative to *create* the convention that validates the performative. Austin's theory cannot adjudicate the moment a new language game is imposed by force. This is closer to Schmitt's "state of exception" or Agamben than Austin. The play *does* see this bootstrapping problem. More's famous line, "The law is not a light for you or any man to see by; the law is not an instrument of any kind. The law is a causeway upon which so long as he keeps I am safe," acknowledges that the law is a conventional structure. When Cromwell moves the causeway (creates a new convention retroactively), More's silence loses its protective cover.
  *   **Seminar Point:** Austin assumes a shared "form of life." The play shows what happens when the Sovereign unilaterally changes the form of life. Austin can analyze the speech acts *within* the regime, but he cannot analyze the speech act that *founds* the regime.

  ### 2. More's Silence and the Casuistry of Intention
  You note that More treats the oath's binding nature as dependent on private intention, which looks like the casuistry he condemns. This is the strongest point of friction.
  *   **The Austinian View:** For Austin, illocutionary force is determined by convention and uptake, not private intention. If I say "I bet" in the right context, I have bet, even if I crossed my fingers. More's claim that "an oath is made to God" and therefore requires internal assent to be binding is pre-modern. It relies on a sacramental view of language where Word and Reality are linked by Divine guarantee, not social convention.
  *   **The Breakdown:** Bolt *does* notice this irony. More is trapped between two linguistic regimes.
      1.  **The Old Regime (Sacramental):** Words bind the soul. Silence preserves the bond with God.
      2.  **The New Regime (Legal/Positivist):** Words bind the subject to the State. Silence is evidence of malice (as Cromwell argues: "Silence gives consent").
  *   **The Tragedy:** More tries to use the New Regime's rules (legal silence is not treason) to protect the Old Regime's values (conscience). Cromwell defeats him by shifting the ground: he manufactures *uptake*. He gets Rich to testify that More *spoke* against the King. Once there is an overt act (witnessed speech), the state can convict.
  *   **Seminar Point:** More isn't being a casuist; he is being an Austinian *before* Austin, trying to insist that without the correct internal conditions, the performative is void. But the State says the State controls the felicity conditions. The play demonstrates the violence required to make the State's definition of "felicity" stick. More loses not because he is wrong about language, but because he lacks the power to enforce his conventions.

  ### 3. The Common Man: Effects vs. Sincerity
  The Common Man is the ultimate pragmatist. He adapts his speech acts to secure uptake and survival.
  *   **The Austinian View:** The Common Man is the most "successful" speaker in the play. He understands that performatives are tools. He becomes the Jailer, the Boatman, the Foreman of the Jury. He follows the procedures (B.1, B.2) perfectly. His speech acts are consistently "happy" in Austin's terms.
  *   **The Breakdown:** Bolt condemns him. Austin describes; Bolt prescribes. If you read the play strictly through Austin, the Common Man is the winner and More is a failure (his speech acts misfire, he is executed). But Bolt's ending ("It isn't difficult to keep alive, friends. Just don't make trouble") is ironic. It indicts the audience.
  *   **Seminar Point:** This reveals the ethical limit of Austin's theory. Austin is not interested in the *morality* of the performative, only its *felicity*. The Common Man proves that you can have perfect felicity and zero morality. The play argues that a philosophy of language that ignores the *truth conditions* (More's concern) in favor of *felicity conditions* (Cromwell/Common Man's concern) leads to tyranny. More dies for the proposition that some utterances are *false* even if they are *felicitous*.

  ### 4. Where the Reading Breaks Down (The "God" Problem)
  You asked: *Does the play just assume the king's words fail because God isn't behind them?*
  Yes, and this is where Austin cannot help you.
  *   **Austin:** Language works because *we* agree it works.
  *   **More:** Language works because *God* agrees it works.
  *   **The Conflict:** When Henry severs the link to Rome, he isn't just changing a procedure; he is attempting to relocate the guarantor of meaning from Heaven to Westminster.
  *   **The Breakdown:** Austin's theory is anthropocentric. It cannot account for a character who believes the ultimate "uptake" comes from a silent, invisible audience (God). For More, a speech act that satisfies Cromwell but violates God is the ultimate *misfire*, regardless of legal felicity. Austin has no category for "Divine Infelicity."
  *   **Teaching Angle:** Use this to show the limits of secular speech act theory. Austin explains how society functions, but he cannot explain the martyr. The martyr is someone who opts out of the social convention of language entirely. More's silence at the end is a refusal of *human* uptake.

  ### Summary for the Seminar
  1.  **Cromwell is an Austinian:** He knows that if he can get the words spoken (or witnessed), the reality changes. He focuses entirely on illocutionary force and uptake.
  2.  **More is a Pre-Modern Realist:** He believes words reflect a moral reality that exists prior to convention. He treats the oath as a constative that claims a truth, not just a performative that enacts a status.
  3.  **Henry is a Sovereign Exception:** He creates the conventions he invokes. Austin cannot analyze this; it requires political theology.
  4.  **The Common Man is the Warning:** He shows that "felicity" without "truth" is survival at the cost of humanity.

  **The Verdict:** The play does not validate Austin; it indicts a world where Austin is right. If language is *only* about doing things with words, then Cromwell wins. More's victory is extra-linguistic; it is in the silence that remains after the words have done their worst. Your seminar should conclude that *A Man for All Seasons* is a tragedy about the moment the performative severs its tie to the true, and Austin provides the vocabulary for the victors, not the martyr.
