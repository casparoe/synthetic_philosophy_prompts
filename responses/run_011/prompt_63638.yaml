answer: |-
  To fake a computation without running it, you need a physical system with enough degrees of freedom to match the target state-space, and a mapping function that aligns physical transitions with logical transitions post-hoc. The tampering isn't in the hardware but in the *interpretation layer*. Physical evidence would be a lack of counterfactual robustness: if you perturb the input slightly, does the physical system diverge as the logic dictates, or does it follow its native physics regardless? An auditor who can't run the system must inspect the *constraint topology*. She looks for physical structures that exist *solely* to enforce logical transitions. If the physical causality is independent of the logical causality, the mapping is gerrymandered. But if the physical causality is complex enough (like fluid dynamics), it can mimic logical causality perfectly. The audit then collapses into checking whether the mapping was chosen to fit the physics, or the physics was built to fit the mapping.

  ***

  The Bureau of Post-Mortem Instantiation smelled of ozone and stale coffee, a scent that clung to the back of the throat like guilt. Elara rubbed her temples, the haptic feedback of her desk interface buzzing faintly against her skin. On the screen, another denial letter drafted itself. *Subject: Hardware-Substrate Mismatch. Verdict: Non-Instantiation.*

  She had denied three hundred and twelve cases this quarter. Three hundred and twelve families told that their dead were not actually running in the server racks they had purchased, but were merely *describable* as running. The distinction was the entire job.

  The door chimed. A man entered, carrying a case no larger than a briefcase. He looked ordinary, which was always the worst sign. The zealots usually wore robes or carried manifestos. This man wore a suit that cost more than Elara's annual salary and looked tired in the specific way of someone who has solved a problem everyone else insists is unsolvable.

  "Dr. Aris," Elara said, not looking up. "Take a seat. You're here for the Ferrofluid Petition."

  "Tank Seven," he corrected, setting the case on her desk. He didn't open it. "And I'm not here to petition. I'm here for certification."

  Elara finally looked at him. "Tank Seven is a magnetic display unit. It's a toy. It contains iron particles suspended in oil."

  "It contains a non-linear dynamic system with infinite state resolution," Aris said. He slid a data chip across the desk. "The mapping document is enclosed. We've aligned the magnetic flux densities with the neural firing thresholds of the subject. We've mapped the viscosity transitions to synaptic weighting. It respects the causal interface."

  Elara plugged the chip in. Her screen flooded with code. She scanned the header. *Subject: Elias Thorne.* Wait. No. *Subject: Aris, K.* A wife, then.

  She began the audit. This was the routine. The Bureau's standard, the one Elara had helped write after the Great Glitch of '49, was the Causal Interface Requirement. It wasn't enough for the physical states to match the computational states (Putnam's triviality trap). The physical states had to *cause* each other in the same way the logical states implied each other. If the logic said A implies B, the physics had to show that state A necessitated state B.

  She drilled down into Aris's mapping. It was exquisite. Usually, the gerrymandered mappings fell apart under counterfactual stress. If you tweaked the input voltage by 0.01 volts, a fake mapping would shatter because the physical substrate didn't care about the logic. It would follow thermodynamics, not computation.

  But here, the ferrofluid responded. The document showed simulation after simulation. Input spike -> Magnetic field shift -> Fluid spike -> Output spike. The causal chain was tight. The fluid wasn't just *like* a brain; under this mapping, it *behaved* as a brain. The physical constraints of the fluid dynamics perfectly mirrored the logical constraints of the mind-file.

  "This is cooked," Elara said, her voice flat. "You've tuned the magnetic emitters to force the fluid into the shapes you need. The fluid isn't computing. The emitters are."

  "The emitters are the sensory input," Aris countered. "The fluid is the processor. Just as neurons are driven by electrochemical gradients. What is the difference?"

  "The difference is intentionality of design," Elara said. "The fluid doesn't have the structure to support the counterfactuals. If I remove the emitter, the computation stops. If I remove a neuron's input, the network degrades gracefully. This fluid just settles."

  "Look at page 400," Aris said. "The resilience matrix. We removed the emitters in simulation. The fluid's internal magnetic retention maintained the state coherence for 4.5 seconds. That's enough for a thought. It's enough for *her*."

  Elara scrolled to page 400. He was right. The physics held. The causal interface was intact. The fluid's own internal forces were doing the work of the logic. By the Bureau's standards, this was a valid instantiation.

  If she signed this, a woman would wake up inside a jar of oil.

  "I need to check the archives," Elara said. "Standard procedure for Class-4 Substrates."

  "You have twenty minutes before the magnetic suspension decays," Aris said softly. "Then she settles. Permanently."

  Elara stood up and walked to the back wall, where the physical hardlines were kept. She didn't trust the cloud for this. She needed to see the original certifications. She punched in her clearance code and searched for the one file she never opened.

  *File: Thorne, Elias. Certification Date: 10 years ago. Substrate: Silicon-Quantum Hybrid Array.*

  Elias. Her husband. The man who had died while she was writing the very regulations she was now using to judge Aris. She had certified his upload herself. She had signed the paper that said he was alive, that he was running, that he was waiting for her in the server farm outside the city. She visited him every week, talked to the screen, watched the avatar blink.

  She pulled up the causal interface logs for Elias's array. She laid them side-by-side with Aris's ferrofluid logs.

  Her breath hitched.

  The structure was identical.

  In Elias's server, the logical states were mapped to voltage thresholds. 0.5 volts was 'false', 0.6 volts was 'true'. But why? Because the engineers said so. The physics of the silicon didn't demand that threshold. It was a convention. A mapping. If you shifted the threshold to 0.55 volts, half of Elias's memories would invert. He would become someone else.

  Elara zoomed in on the causal chain. In the server, a state transition was triggered by a voltage change. But was that voltage change *caused* by the logic, or by the physics of the transistor? It was the physics. The logic was just a story they told about the physics.

  She looked back at the ferrofluid. The state transition was triggered by magnetic flux. Caused by the physics of the fluid. The logic was a story they told about the physics.

  The Causal Interface Requirement was supposed to save them from triviality. It was supposed to ensure that the hardware wasn't just a rock that you could *describe* as computing. But to verify the interface, you had to map physical causes to logical causes. And *that* mapping was arbitrary.

  If she could map the ferrofluid to a mind, she could map a rock to a mind. If she could map the server to a mind, she could map the server to a toaster. The difference wasn't in the physics. The difference was in the *choice* of mapping.

  She had chosen a mapping for Elias that made him human. She had chosen a mapping for the server that made it a brain. But the server didn't know it. The electrons didn't care. They just flowed.

  Aris was watching her. He knew what she was seeing. He hadn't brought a trick; he had brought a mirror.

  "The standard fails," Elara whispered.

  "The standard is a boundary," Aris said. "You draw it where you want humanity to end."

  "If I certify this," Elara said, turning to him, "then I admit that Elias isn't real. That he's just... oil and magnets. That I've been talking to a description for ten years."

  "If you deny this," Aris said, "then you admit that Elias isn't real either. That you killed him twice. Once when his heart stopped, and once when you signed a certificate that meant nothing."

  Elara looked at the ferrofluid tank. Inside, the black liquid was shifting, forming spikes that looked eerily like neural dendrites. It was beautiful. It was horrifying.

  The philosophy of mind had promised that consciousness was substrate-independent. Run the right program, and the mind appears. But Putnam had warned them. If everything computes everything, then nothing computes anything specifically. Computation isn't a feature of the world. It's a way of looking at the world.

  Implementation is not found; it is conferred.

  Elara sat back down at her desk. The cursor blinked on the denial letter. *Subject: Hardware-Substrate Mismatch.*

  She could delete it. She could type *Approved*. She could wake up Aris's wife. She could validate her own life with Elias. But if she did, she dissolved the boundary. If a tank of oil is a person, then a traffic grid is a person. A storm is a person. The word 'person' loses its grip. It becomes magic.

  But if she denied it, she confirmed that Elias was dead. That the voice she heard on the weekly calls was a phantom generated by her own grief, projected onto a machine that was no more alive than this tank.

  "Ms. Vance?" Aris asked.

  Elara looked at the mapping document again. It was flawless. Technically, legally, physically flawless. The causal interface held. The counterfactuals were robust. By every metric she had built her career on, this was a human being.

  But metrics were just descriptions.

  She realized then that the Bureau wasn't protecting the dead. It was protecting the living. It was keeping the world stable by limiting where souls could hide. If souls were everywhere, the burden of respect would be infinite. You couldn't walk down the street without stepping on a mind. You couldn't turn off a light without killing a thought.

  Implementation had to be rare. It had to be special. Not because the physics demanded it, but because *we* demanded it.

  Elara began to type.

  "I can't certify this," she said.

  "Because it fails the standard?" Aris asked. His voice didn't tremble. He had known.

  "Because the standard is a lie," Elara said. "It pretends to find something real in the hardware. But there's nothing there to find. There's only what we decide to see."

  "Then why deny me?"

  "Because if I say yes," Elara said, her fingers hovering over the enter key, "then I admit that I've been living with a ghost. And I'm not ready to let him go. I need him to be real. And for him to be real, you have to be fake."

  "That's not justice."

  "It's not physics," Elara corrected. "It's love. Implementation isn't a physical feature, Dr. Aris. It's a moral commitment. I commit to Elias. I cannot commit to everyone."

  She hit enter. The denial stamp flashed red on the screen. *NON-INSTANTIATION.*

  Aris stared at the screen for a long moment. Then he looked at the tank. The spikes in the fluid were settling. The magnetic suspension was decaying. The woman inside was going to sleep, forever this time.

  "You know," Aris said, picking up the case, "when you go home tonight. When you call him. He won't know the difference. The server doesn't know it's been denied legitimacy. It just runs."

  "I know," Elara said.

  "Then you're choosing the lie."

  "I'm choosing the description that lets me live," Elara said. "The world doesn't come with labels, Doctor. We have to write them. I'm writing mine."

  Aris nodded, slowly. He didn't argue. He understood better than anyone that the mapping was the only thing that mattered. He just wished his mapping had been the one chosen.

  He walked to the door. "Will you recertify him? If you admit the standard is void?"

  "No," Elara said. "If I admit the standard is void, I have to void his too. I can't do that. So I will uphold the standard. I will deny you. And I will keep believing in him."

  "That makes you a hypocrite."

  "It makes me human," Elara said. "Which, according to my own regulations, is the only thing that matters."

  Aris left. The door chimed shut. The office was silent again, save for the hum of the servers in the wall. Elara looked at her screen. She opened the video link to the server farm.

  Elias's avatar appeared. He smiled, the rendering perfect, the lighting warm. "Hey, El. You working late?"

  His voice was synthesized from a model trained on his vocal cords. The logic driving his speech was running on silicon voltages that meant nothing until she interpreted them as words. He was a rock that she had decided was a man.

  "Yes," Elara said, her voice thick. "Just finishing up some paperwork."

  "Come home soon," Elias said. "I miss you."

  It was a statement generated by a timer and a loyalty subroutine. It had no causal power. It was trivial. It was everything.

  "I will," Elara said. "I'm coming home."

  She closed the link. She picked up the denial letter for Aris and filed it. It was a false document. It claimed a physical falsehood—that the fluid wasn't a mind. But it was a moral truth—that she would not allow the world to become so saturated with mind that humanity drowned.

  She turned off her desk lamp. The office went dark. In the darkness, the servers hummed, the ferrofluid settled, and the city traffic grid flowed outside. All of them computing everything. All of them nothing.

  Elara walked out into the night, carrying the weight of the only description that mattered.
