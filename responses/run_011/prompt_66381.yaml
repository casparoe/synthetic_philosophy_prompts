answer: |-
  **The Credal Counsel**

  **Dear Columnist,**
  I have a job offer. The salary is excellent, but the company is unstable. My research suggests the probability of the firm surviving two years is between 0.4 and 0.8. If it survives, I gain 100 utility units (career growth); if it folds, I lose 200 (résumé damage). Should I take it?
  **—Confused in Career**

  **Dear Confused,**
  We represent your belief not as a point, but as a set of probabilities: $[0.4, 0.8]$. To act, we apply the *Maximin* rule from the *Handbook of Rational Intervals*. This rule dictates that you evaluate an action by its minimum expected utility across all probabilities in your set. It prioritizes security against the worst plausible model over potential gain.

  Here is the arithmetic. The expected utility (EU) is calculated as $P(\text{Success}) \times 100 + P(\text{Failure}) \times (-200)$.
  Using the lower bound (0.4): $0.4(100) + 0.6(-200) = 40 - 120 = -80$.
  Using the upper bound (0.8): $0.8(100) + 0.2(-200) = 80 - 40 = 40$.
  Your expected utility lies in the interval $[-80, 40]$. Since the minimum possible expected utility (-80) is less than the status quo (0), the rule commands you to decline. While the upper bound suggests potential gain, the framework forbids acting on optimism when the lower bound indicates loss. Stay put.

  **Dear Columnist,**
  I just learned a fact that is plainly true and relevant to my problem. Yet, after updating my beliefs with this information, my range of uncertainty is wider than it was before. Have I done the math wrong?
  **—Wider After Watching**

  **Dear Wider,**
  You have done the math correctly. Congratulations. It is a common misconception that learning must always narrow uncertainty. Sometimes, new information reveals that the mechanisms governing your situation are less understood than you presumed. When the reliability of a source is itself uncertain, incorporating its testimony can stretch your credal set to accommodate new possibilities you had previously ignored.

  This widening is not a failure of update; it is the update doing its job. It ensures your set remains large enough to contain the truth. A narrow range here would be a lie. Embrace the width; it is the only honest shape for your evidence.

  **Dear Columnist,**
  A friend offers me 100 successive even-money bets on the flips of a coin about whose bias nobody knows anything. For each flip, I win $1 on Heads, lose $1 on Tails. Someone who believes the coin is fair would take all 100. Should I?
  **—Gambler's Ignorance**

  **Dear Gambler,**
  You must decline every bet. Since nobody knows the bias, your probability for Heads on any single flip is the full interval $[0, 1]$. The expected value for a single bet is therefore $[ -1, 1 ]$. Because this interval includes zero, the bet is not strictly favorable.

  You object that a person certain the coin was fair (probability 0.5) would accept. This is true, but that person possesses a precise belief you do not. They are acting on knowledge you lack. Aggregating 100 bets does not shrink your prior ignorance regarding the bias; it merely repeats the exposure to the unknown. To accept is to pretend precision where there is none. Walk away.

  ***

  **SIDEBAR: The Point Estimate**
  *By Precise Pete*
  **Dear Confused,**
  Assign a single probability of 0.6 to the firm's survival. Your expected utility is $0.6(100) + 0.4(-200) = -20$. Wait, actually, let's say 0.7. Then EU is +10. Take the job! It's simple.
  **—Pete**

  ***

  **CORRECTIONS**
  In last week's column ("Umbrella Uncertainty"), we advised readers to carry rain gear because the lower bound of precipitation was 0.4. We failed to account for the forecast's known inconsistency, which dilates the credal set to $[0.1, 0.9]$. Under the *Maximin* rule, the lower bound expected utility of carrying the umbrella becomes negative. We retract the advice. Leave the umbrella at home.
