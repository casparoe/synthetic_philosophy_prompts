      *   **Corrections Box:**
          *   *Content:* Retract advice because the credal set was updated improperly (e.g., failed to dilate).

  3.  **Writing - Focusing on Tone and Word Count:**
      *   Need to ensure ~800 words.
      *   Tone: Serious, professional, bureaucratic yet personal advice.
      *   No technical jargon like "Dilation" or "E-admissibility" unless explained simply or replaced with descriptive phrases.
      *   Ensure the math in Letter 1 is checkable.
      *   Ensure Letter 3 logic holds (unknown bias = max entropy prior = [0,1] -> expected value interval includes 0).

  4.  **Refining the Math (Letter 1):**
      *   Job Offer.
