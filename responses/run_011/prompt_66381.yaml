      *   **Letter 2 (Widening Uncertainty):**
          *   *Reader:* I learned a fact, but my range got wider. Is this bad?
          *   *Columnist:* No, it's good. It means you are accounting for the reliability of the source.
          *   *Concept:* Dilation. When learning event E, the conditional probability range becomes wider than the prior range.
          *   *Explanation:* The new information tells you something about the situation, but also reveals you know less about the specific mechanism than you thought. It's the update doing its job.
