  **Scenario**

  A Financial Stability Authority mandates higher Capital Reserve Ratios for all regulated banks to maximize **Systemic Solvency** (the network's ability to absorb shocks without cascade failure). The metric is the Reserve Ratio, measured perfectly without error or lag; leadership is competent, banks comply honestly without gaming, and there is no adversarial behavior. For any single bank, increasing its reserve ratio while others hold steady genuinely improves that bank's individual solvency and marginally reduces systemic contagion risk (local vindication). However, as the Authority drives the aggregate reserve ratio up across the entire network, banks simultaneously contract lending to maintain compliance; this credit crunch triggers widespread borrower defaults that overwhelm the newly fortified balance sheets, causing Systemic Solvency to decline steadily across the entire range of improvement.

  **Demonstration**

  **(a) Taxonomy Exclusion**
  *   **Regressional:** The metric is not a noisy proxy; Reserve Ratio is measured perfectly and correlates perfectly with individual solvency. The failure is not due to tails coming apart.
  *   **Extremal:** The system does not shift into a novel physical regime; the relationship between lending and defaults remains stable. The harm occurs steadily from the first increment of compliance, not only at saturation.
  *   **Adversarial:** By construction, no agent is gaming the metric. Banks are not hiding assets; they are honestly holding capital.
  *   **Causal:** In standard Causal Goodhart, intervening on the proxy breaks the causal link *for the unit* (e.g., raising reserves no longer makes the bank safer). Here, the local causal link holds firmly: a lone bank that raises reserves *does* become safer. The failure is not in the unit-level causality, but in the aggregation.

  **(b) Mechanism**
  **Compositional Goodhart.**
  The metric optimizes the unit-level goal correctly, but the units are interdependent such that universal optimization saturates a shared constraint (liquidity), inverting the aggregate outcome.

  **(c) Critical Feature**
  **Non-Separable Aggregation.**
  The system's goal function depends on the *distribution* of metrics across units, not just the sum ($ Goal \neq \sum f(Metric_i) $). If you delete this feature (i.e., assume banks operate in isolation with no interbank lending or shared borrower base), the aggregate harm vanishes and the metric works perfectly at scale.

  **(d) The Causal Objection**
  The objection claims this is just Causal Goodhart because the regulator's intervention causes the collapse. This objection **fails**.
  *   **Criterion:** **Counterfactual Unit Validity**. In genuine Causal Goodhart, the intervention fails to produce the goal *even for the isolated unit* (the link is broken). In Compositional Goodhart, the intervention *succeeds* for the isolated unit (the link holds), and the failure emerges *only* when multiple units act simultaneously. If the harm disappears when holding other units constant, it is Compositional, not Causal.
