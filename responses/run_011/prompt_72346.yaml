      *   **User:** Science/Ideas journalist for a national newspaper.
      *   **Task:** Create a 2-hour workshop plan for graduate trainees + 2 data journalists (no philosophy background) on writing about causation (inquests, inquiries, disasters).
      *   **Constraints:** Whiteboard only, no handouts. British English.
      *   **Key Content to Place:**
          *   *Machinery:* Necessary vs. Sufficient vs. Difference-making; Mackie's INUS; Overdetermination (strict vs. loose).
          *   *Selection:* Abnormal intervention vs. Background conditions (Hart & Honoré style); Sufficient-Component-Cause model (Epidemiological "pies").
      *   **Hypothesis to Test:** Errors are stylistic/formal (narrative needs a protagonist/sentence needs a subject) rather than conceptual.
      *   **Scenario:** Evaluate the user's proposed flood scenario (defences old, maintenance backlog, warning ignored, siting approved, exceptional rain). If it fails, propose a better one.
      *   **Misconceptions:** Address specific listed misconceptions (largest difference = cause, percentages sum to 100%, standing conditions = context, root cause = earliest, overdetermination = no accountability, more factors = more honest) + add missing ones.
      *   **Assessment:** One written exercise (no quiz). Define passing vs. "sounds right but wrong" (specifically looking for verb choice/single-cause smuggling).
      *   **Exclusions:** What *not* to cover and how to declare it.
      *   **Closing:** Confidence level on load-bearing claims, least sure element, and how to settle it.

  2.  **Deconstruct the Content & Sequence:**

      *   *The Hypothesis:* The user thinks it's about sentence structure. I need to validate this. It's partially true (grammar forces agency), but without conceptual clarity, better sentences just make better-sounding errors. So, the plan must integrate *both*. Conceptual clarity informs the selection; sentence structure executes it.
      *   *The "Pies":* The Sufficient-Component-Cause model (Rothman's pies) is visual and intuitive for journalists. It deserves whiteboard time because it solves the "list of 11 factors" problem (they are components of a sufficient set, not competing causes).
      *   *INUS:* Mackie is dense. Needs simplification. "An Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient." For journalists: "A crucial piece of a specific recipe that caused the disaster, though other recipes could have caused it too."
      *   *Sequence:*
          1.  Hook (The Complaints).
          2.  The Trap (Grammar/Narrative).
          3.  The Machinery (Necessary/Sufficient/INUS).
          4.  The Selection (Pies & Abnormality).
          5.  The Scenario (Application).
          6.  The Exercise.
          7.  The Exclusions.
      *   *Timing:* 2 hours = 120 mins. Need buffers.

  3.  **Evaluate the Scenario:**

      *   *User's Flood:* Defences old (40 yrs), maintenance backlog, warning ignored, siting approved (different authority), exceptional rain.
      *   *Critique:* It's a bit "kitchen sink." Too many factors might confuse the specific point about *selection*. It risks becoming a "list of 11" problem immediately. However, it *does* allow for the "Abnormal vs. Background" distinction (Rain = abnormal? Warning ignored = abnormal?).
      *   *Verdict:* It works *if* constrained. But to test "Overdetermination" vs "Long List," it needs a clearer fork. Let's stick with the user's but refine the *use* of it. Actually, the prompt asks me to test the candidate against criteria.
      *   *Criteria for a Teaching Scenario:*
          *   Must have: Clear counterfactuals (what if X hadn't happened?), distinct types of factors (human error vs. natural force vs. structural), and a temptation to blame a single villain.
          *   Must lack: Real-world political baggage (invented is good), ambiguous timelines (needs clear sequence), and genuine overdetermination (unless that's the specific lesson, but strict overdetermination is rare).
      *   *Assessment of User's Case:* It's strong on "Background vs. Abnormal" (Rain vs. Maintenance). It's weak on "Overdetermination" (nothing suggests two *sufficient* paths existed simultaneously). It might be too complex for a 2-hour intro.
      *   *Decision:* It passes, but needs simplification for the whiteboard. I will advise keeping the "different authority" bit—it highlights the "no single protagonist" problem well.

  4.  **Address the Hypothesis (Grammar vs. Concepts):**

      *   Is it just grammar? No. If they don't understand INUS or Selection, changing the verb won't fix the logic. They need the concepts to know *which* subject to pick.
      *   *Correction:* The hypothesis is half-right. Grammar *pressures* them to simplify, but lack of conceptual tools *prevents* them from resisting. The session must arm them with concepts *to fight* the grammar.

  5.  **Map Misconceptions:**

      *   *Listed:* Largest difference = cause; Percentages sum to 100%; Standing conditions = context; Root cause = earliest; Overdetermination = no accountability; More factors = honest.
      *   *Missing:* "Correlation implies causation" (classic), "The last thing that happened is the cause" (proximity bias), "Intent is required for causation" (moral vs. causal).
      *   *Placement:* Pre-empt "Percentages" early (when discussing selection). Pre-empt "Root cause = earliest" during Machinery. Pre-empt "Grammar trap" throughout.

  6.  **Drafting the Plan (Iterative Process):**

      *   *Intro (15 mins):* The complaints. Why causation is hard.
      *   *Module 1: The Grammar Trap (20 mins):* Test the hypothesis. Show how sentences force agents.
      *   *Module 2: The Machinery (30 mins):* Nec/Suff/INUS. Whiteboard diagrams.
      *   *Module 3: The Selection (30 mins):* Pies & Abnormality. This is where the "list of 11" gets solved.
      *   *Module 4: Scenario Application (15 mins):* Group work on the flood.
      *   *Module 5: Exercise & Debrief (10 mins):* The written task.
      *   *Outro:* Exclusions.
      *   *Total:* 120 mins.

      *Wait, timing check:* 15+20+30+30+15+10 = 120. Tight. Need to ensure the "Pies" don't eat the "INUS" time. The Pies are more useful for journalists. INUS is the theory behind it. I should integrate them.

      *Refining the Sequence:*
      1.  **The Hook & The Trap (20m):** The complaints + The Grammar Hypothesis.
      2.  **The Machinery (30m):** Nec/Suff/INUS. (Conceptual foundation).
      3.  **The Selection (30m):** Pies + Abnormality. (Practical tool).
      4.  **The Scenario (25m):** Applying the tools.
      5.  **The Exercise (15m):** Writing test.
      *Wait, 2 hours is 120 mins.* 20+30+30+25+15 = 120. Perfect.

  7.  **Addressing Specific Questions:**

      *   *Do both bodies of material belong?* Yes. Machinery prevents logical errors; Selection prevents narrative distortion.
      *   *Do pies deserve whiteboard time?* Yes, absolutely. It's the only visual that sticks.
      *   *Hypothesis Check:* It's half-right. Grammar exerts pressure, but concepts provide the resistance.
      *   *Scenario Check:* It works but needs specific framing to avoid the "list of 11" trap immediately.
      *   *Misconceptions:* Map them to the modules.
      *   *Exercise:* Needs to be a rewrite task.
      *   *Exclusions:* Counterfactual theory depth, probabilistic causation nuances, legal liability vs. causal attribution.

  8.  **Writing in British English:**

      *   Spellings: *programme, centre, modelling, analyse*.
      *   Tone: Professional, direct, journalistic.

  9.  **Final Review against Constraints:**

      *   Whiteboard only? Yes, plan relies on drawing.
      *   No handouts? Yes.
      *   Confidence note at the end? Yes.
      *   Least sure element? Yes.

  10. **Refining the "Hypothesis" section:**
      I need to be careful here. If I say "You are wrong," it might be dismissive. If I say "You are right," it might be misleading. The truth is: Syntax *drives* the error, but Semantics *allows* it. I will argue that the conceptual work must come *before* the sentence work, otherwise, they are just polishing turds. The sequence must reflect this: Concepts first, then Syntax as the application.

  11. **Refining the Exercise:**
      *   Task: Take a paragraph that blames one thing. Rewrite it to show the INUS condition without losing readability.
      *   Passing answer: Uses "contributed to," "allowed," "combined with." Acknowledges the pie.
      *   Failing answer: "The flood was caused by X, exacerbated by Y." (Still centers X).

  12. **Confidence Note:**
      *   Load-bearing claim: That INUS can be taught in 30 mins to non-philosophers.
      *   Least sure: Whether they will resist the "Protagonist" urge in the exercise.

  13. **Final Polish:** Check the flow. Ensure the "Pies" explanation is clear in the text of the plan. Ensure the "Overdetermination" distinction is sharp. (Strict overdetermination: Two bullets kill simultaneously. Journalistic overdetermination: Many factors contributed. These are different).

      *Self-Correction on Scenario:* The user's scenario has "exceptional rainfall." This is the classic "Act of God" vs. "Human Negligence" tension. It's good. I will endorse it but warn against letting "exceptional" do too much work (it becomes the sufficient cause, rendering the rest background). I need to specify that the rain *alone* wasn't enough; it needed the low defences. That makes the rain a component, not the sole cause.

      *Self-Correction on Misconceptions:* "Percentages summing to 100%" is a big one. I need to make sure the "Pies" model kills this. If a pie is 100% sufficient, the slices don't have percentage weights of the *outcome*, they are binary components.

