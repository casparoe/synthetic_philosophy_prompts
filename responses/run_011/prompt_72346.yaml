answer: |-
  **Workshop Plan: Writing Causation Without Lying**

  **Duration:** 120 minutes
  **Resources:** Whiteboard, markers (multiple colours), flipchart paper (optional for group work).
  **Audience:** Graduate trainees + 2 data journalists (no philosophy background).

  ### 1. Sequence and Timing Skeleton

  The conventional order for teaching causation is *Concepts → Application → Style*. For journalists, this is wrong. If you start with abstract definitions, they will tune out until the "writing bit" begins. You must start with the *constraint* (the sentence), move to the *logic* (the machinery), and end with the *selection* (the story).

  **00:00 – 00:20: The Trap (Grammar and Narrative)**
  *   **Activity:** Display the two complaints from the editor. Ask the room: "Why did these happen?"
  *   **Hypothesis Test:** Put your hypothesis on the board: *"The English sentence demands a subject; the narrative demands a protagonist. We write single causes because our grammar forces us to."*
  *   **Discussion:** Ask them to write one sentence explaining the hospital loss. Collect examples. Highlight the verbs. Did they write "The flood destroyed..." or "The warning failed..."?
  *   **Verdict on Hypothesis:** Tell them the hypothesis is **half-right**. Grammar exerts the pressure, but lack of conceptual tools prevents resistance. If they do not know *what* a cause is, they cannot fight the sentence. The rest of the session provides the ammunition to fight the grammar.

  **00:20 – 00:50: The Machinery (Necessary, Sufficient, INUS)**
  *   **Concept:** Necessary vs. Sufficient. Use the whiteboard.
      *   *Necessary:* No X, no Y. (No rain, no flood).
      *   *Sufficient:* If X, then Y. (Rain enough to breach any wall = flood).
  *   **The Reality:** Most journalistic causes are neither. They are **INUS** conditions (Mackie).
      *   **Board Work:** Write **INUS**. Expand: *An Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient.*
      *   **Translation:** "A crucial piece of a specific recipe that caused the disaster, though other recipes could have caused it too."
      *   **Example:** The ignored warning. Alone? Insufficient. Part of the 'Negligence + Rain' recipe? Necessary. Is 'Negligence + Rain' the only way a hospital floods? No (Unnecessary). But if that recipe is present, does it flood? Yes (Sufficient).
  *   **Overdetermination:** Distinguish strict overdetermination (two bullets hit the heart simultaneously; either would kill) from a "long list" (eleven factors, none sufficient alone). Tell them: *Strict overdetermination is rare. Do not use it to explain away a list of failures.*

  **00:50 – 01:20: The Selection (Pies and Abnormality)**
  *   **The Problem:** If everything is a cause, how do we write the headline?
  *   **Tool 1: The Epidemiological Pies.** (Yes, this deserves whiteboard time).
      *   Draw a circle. Label it "The Flood Disaster".
      *   Slice it into components: Rain, Low Defences, Ignored Warning, Siting.
      *   **Crucial Point:** A slice has no % value of "blame". It is a binary switch. If a slice is missing, the pie is incomplete, the cake doesn't bake. This kills the "percentages summing to 100%" misconception.
      *   **Visual:** Draw a second pie next to it. "Alternative Disaster". Different slices (e.g., Earthquake + Poor Siting). Same outcome. This cements the 'Unnecessary' part of INUS.
  *   **Tool 2: Abnormal vs. Background.** (Hart & Honoré).
      *   We select the "cause" based on what deviated from the expected course.
      *   **Board Work:** Two columns. *Background Conditions* (Gravity, Hospital existed, Rain happens) vs. *Abnormal Interventions* (Warning ignored, Defences not upgraded).
      *   **Rule:** We report the Abnormal. We acknowledge the Background. We do not call Background a "cause" in the headline, but we do not treat it as non-existent.

  **01:20 – 01:45: The Scenario (Application)**
  *   **Activity:** Use your invented flood scenario.
  *   **Task:** In pairs, map the scenario onto the Whiteboard models.
      1.  Which factors are INUS conditions?
      2.  Which are Background (standing conditions)?
      3.  Which is the Abnormal Intervention?
      4.  Is there Overdetermination? (Answer should be no).
  *   **Debrief:** Ask one pair to explain why "Siting approved decades earlier" is likely a Background condition (normal administrative process) whereas "Maintenance backlog" is Abnormal (deviation from standard).

  **01:45 – 02:00: The Exercise and Exclusions**
  *   **Written Exercise:** (See below).
  *   **Exclusions:** (See below).
  *   **Close:** Confidence note.

  ---

  ### 2. Placement of Material

  **Do both bodies of material belong?**
  Yes. The *Machinery* (INUS/Nec/Suff) prevents logical errors (claiming X caused Y when X was merely present). The *Selection* (Pies/Abnormality) prevents narrative distortion (picking a villain where there is only a system). Without Machinery, the Selection is arbitrary. Without Selection, the Machinery is unreadable.

  **Do the pies deserve whiteboard time?**
  Yes. It is the only visual model that survives contact with a newsroom deadline. It allows a journalist to point at a diagram and say, "This slice is the warning, this is the rain. You cannot blame the rain for the missing slice." It concretises the idea of *conjunctural causation* (factors working together) better than any text.

  **Where the conventional order is wrong:**
  Do not teach "Selection" before "Machinery". If they do not understand that a factor can be *necessary within a set* but not *sufficient alone*, they will treat the Selection phase as a purely editorial choice ("Which villain do we like least?") rather than a logical one ("Which factor was the abnormal switch?").

  ---

  ### 3. Testing the Hypothesis

  **Verdict:** Your hypothesis is **half-right**.
  It is true that syntax pressures writers toward single agents ("The flood destroyed the hospital"). However, conceptual confusion is the *enabler*. If a trainee understands INUS conditions, they can use passive voice or plural subjects to resist the pressure ("The hospital was lost to a combination of..."). If they lack the concept, they will simply write a clearer-sounding falsehood.
  **Instructional Consequence:** Do not teach "sentence construction" as a separate module. Teach it as the *output* of the conceptual work. When explaining INUS, explicitly dictate the verb structures that match it (e.g., "contributed to," "allowed," "combined with").

  ---

  ### 4. The Scenario Evaluation

  **Criteria for a Teaching Scenario:**
  *   **Must Have:** Distinct categories of factors (human, natural, structural); clear counterfactuals (if X hadn't happened, would Y still occur?); a temptation to blame a single villain.
  *   **Must Lack:** Real-world political baggage (invented is good); genuine strict overdetermination (confuses the initial lesson); ambiguous timelines.

  **Assessment of Your Candidate:**
  *   **Strengths:** It separates *time* (siting decades ago) from *action* (warning ignored). It separates *nature* (rain) from *humanity* (maintenance). It tempts the "Warning" protagonist.
  *   **Weaknesses:** "Exceptional rainfall" risks becoming a sufficient cause in the trainees' eyes, rendering the defences irrelevant. "Different authority" for siting might complicate the "Abnormal" test (is it abnormal for authorities to disagree?).
  *   **Verdict:** It **passes**, provided you constrain the "Exceptional Rain". You must stipulate on the whiteboard: *"Rainfall exceeded the 40-year standard, but would not have flooded a hospital built to current standards."* This ensures the rain is an INUS condition, not a sufficient cause.
  *   **Repair:** Do not change the scenario, but tighten the parameters. Explicitly state: "The rain was heavy, but not unprecedented. The defence failure was the multiplier."

  ---

  ### 5. Misconceptions Map

  | Misconception | When to Head Off | How to Pre-empt |
  | :--- | :--- | :--- |
  | **Cause = Largest difference to death toll** | During *Machinery* (00:20) | Show that a small switch (warning) can trigger a large outcome. Magnitude $\neq$ Causality. |
  | **Responsibility sums to 100%** | During *Selection* (00:50) | Use the Pies. A pie is 100% sufficient, but slices are not percentages of blame. They are binary requirements. |
  | **Standing conditions are context, not causes** | During *Selection* (00:50) | Clarify: They *are* causal (INUS), but we select the *abnormal* one for the headline. Do not call them "just context". |
  | **Root cause = Earliest thing in chain** | During *Machinery* (00:20) | Counter-example: Siting was earliest, but maintenance was the active failure. Time $\neq$ Root. |
  | **Overdetermination = No accountability** | During *Machinery* (00:20) | Explain strict overdetermination is rare. A long list is not overdetermination; it is a complex pie. |
  | **Naming more factors = More honest** | During *Intro* (00:00) | Reference the second complaint. A list of 11 is obfuscation. Precision > Volume. |
  | **Correlation = Causation** (Missing) | During *Machinery* (00:20) | Briefly note: Just because the backlog and flood happened together doesn't mean the backlog caused it (unless counterfactual holds). |
  | **Intent required for Causation** (Missing) | During *Scenario* (01:20) | Ensure they acknowledge the "Siting" caused the risk even if no one intended harm. |

  ---

  ### 6. The Written Exercise

  **Task:**
  "Here is a paragraph drafted by a senior reporter: *'The ignored warning caused the hospital to flood. Although the defences were old and the rain was heavy, had the warning been heeded, the evacuation would have succeeded.'*
  Rewrite this paragraph to accurately reflect the INUS structure and the Pie model. You must not use the verb 'caused'. You must not exonerate the warning, but you must acknowledge the defences."

  **A Passing Answer:**
  *"The hospital flooded because an ignored warning combined with outdated defences failed to hold back exceptional rain. While the warning was the critical intervention, the loss relied on the pre-existing vulnerability of the site."*
  *   **Why:** It uses "combined with", "relied on". It treats the warning as a switch within a system.

  **The "Sounds Right but Wrong" Answer:**
  *"The flood was triggered by the ignored warning, exacerbated by old defences and heavy rain."*
  *   **Why:** It looks nuanced. But "triggered" + "exacerbated" still frames the warning as the *Protagonist* and the defences as *Setting*. It smuggles the single-cause frame back in via verb hierarchy. The defences are treated as modifiers to the warning's action, rather than co-equal components of the sufficient set.

  ---

  ### 7. Exclusions

  **What to Refuse to Cover:**
  1.  **Legal Liability vs. Causal Attribution:** Make it clear this session is about *what happened*, not *who pays*. Causation is a physical/logical relation; Liability is a moral/legal one. They overlap but are not identical.
  2.  **Probabilistic Causation:** Do not get into "X increased the risk by 20%". Stick to deterministic INUS for this session. Probabilistic claims require statistical literacy you cannot teach in 2 hours.
  3.  **Counterfactual Deep-Dive:** Do not teach Lewisian possible worlds semantics. Use the "But-for" test practically, not philosophically.

  **How to Declare It:**
  Open the final 10 minutes by saying: *"We are drawing a boundary. Today is about physical and logical causation. If a court asks 'Who is liable?', that is a different question. If a scientist asks 'What is the probability?', that is a different question. We are answering 'How did this come to pass?' Do not let the other questions colonise this one."*

  ---

  ### 8. Confidence Note

  **Load-Bearing Claims:**
  I am highly confident that the **INUS formulation** is the necessary conceptual bridge for journalists. It is the only framework that accommodates "multiple factors" without dissolving into "everything is a cause." I am also confident that the **Pie Model** is the only visual aid that will survive the transition from the workshop to the newsdesk.

  **Least Sure Element:**
  I am least sure about the **trainees' resistance to the "Protagonist" urge** during the exercise. My prediction is that even with the Pie model, 50% of them will revert to "The warning failed" in the final draft because it makes a better headline.
  **How to Settle It:**
  During the exercise debrief, ask the room to vote anonymously on which version is more "publishable." If they vote for the single-cause version despite knowing it is logically inferior, you have identified a structural newsroom problem that requires editor intervention, not just training. This would indicate the hypothesis needs shifting from "train the writers" to "educate the editors."
