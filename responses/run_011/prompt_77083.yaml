answer: |-
  Elias sat before the console where the Grey Reach widened into the open sea, the coastline rendered in vector lines that looked too smooth to be true. On the screen, the diesel slick was a spreading bruise of red pixels moving southeast with the tide. He had the model open, the ensemble traces fanning out like the ribs of a leaf. His hand rested on the mouse, the plastic warm from his palm.

  He adjusted the assimilation window. He tightened the initial condition error from one hundred meters to ten. The processing bar crawled across the bottom of the screen, the fans in the tower whining as they pushed air through the heat. When the new run finished, the fan of trajectories had narrowed, but the predictability horizon—the time before the lines diverged into useless noise—had extended only three hours.

  He did it again. He tightened the bound to one meter, a precision that required data they didn't have, data that would cost a fortune to harvest. He simulated the input. The processing took ten times as long. The horizon moved another three hours.

  Elias leaned back. The stiffness in his trapezius muscles felt like a physical manifestation of the curve he was staring at. It was a hard ceiling, invisible but solid as concrete. He could spend ten times the money to know the starting point ten times better, and the sea would grant him the same small mercy of time it had granted before. It wasn't a technical problem. It was a verdict. The ocean didn't care how sharp his eyes were.

  He saved the run and closed the model. The meeting started in ten minutes.

  The conference room was cold, the air conditioning fighting the heat of the servers next door. Mara and Vance were already there, sitting on opposite sides of the table. Both had their laptops open. Both knew the equations. There was no need to draw the exponential divergence on the whiteboard; they had all lived inside that curve for twenty years.

  The budget surplus sat in the middle of the agenda. It was enough for one major upgrade. Either the new high-frequency radar array out on the headland, which would sharpen the initial conditions by an order of magnitude, or the contract for the rapid-response skimmers that could sit on standby in the bay.

  Mara spoke first. She didn't look up from her screen. "The signal is there, Elias. The dynamics are deterministic. The failure is epistemic. We don't know the state of the water well enough, so we treat it like randomness. That's on us, not the fluid."

  She tapped her keyboard, bringing up a comparison of the last spill. "If we had the array, we would have caught the eddy shedding off the point. We would have known the slick was going to turn north. We didn't know, so we sent the boats south. We wasted fuel and the beds got coated. The information exists. We just can't afford to see it yet."

  Vance leaned forward, clasping his hands. He looked tired. "The information exists in a mathematical sense, Mara. Not in an operational one. For an observer inside the system, a horizon you can't cross is the same thing as chance. If I can't cash the check, it doesn't matter if the bank has the funds."

  He turned to Elias. "You know the curve. You ran the sensitivity analysis this morning. You bought three hours with the last upgrade. You'll buy three hours with this one. After that, the divergence takes over again. We are buying comfort, not time. We are buying the feeling of precision without the utility of prediction."

  "Precision is the only path to utility," Mara said. Her voice was tight. "If we stop sharpening the instruments, we admit defeat. We admit the world is unknowable. It isn't. It's just expensive."

  "It's not just expensive," Vance said. "It's asymptotic. We are spending millions to shave minutes off the uncertainty window. Meanwhile, the oil hits the shore. I'd rather have the boats waiting in the harbor than a prettier map of where they should have been."

  Elias listened. He felt the ghost of the mouse in his hand, the resistance of the scroll wheel. He thought about the three hours. Three hours was enough to close a bed. Three hours was enough to launch a skimmer. But only if you knew when to start the clock. With the array, you might know sooner, but you wouldn't know much longer. The logarithmic grind meant the gain was constant, but the cost was exponential.

  Mara was right that the sea was clockwork. The equations didn't lie. But Vance was right that a clock you couldn't read was no better than a stone.

  "If we buy the array," Elias said, his voice sounding rough in the quiet room, "we reduce the error cone. We get a tighter probability density."

  "And we miss the window," Vance said. "Because we waited for the data to confirm what we should have acted on."

  "If we buy the skimmers," Mara said, "we are reacting to blindness. We are planning to be wrong."

  "We are planning for the world as it is," Vance countered. "Not the world as it would be if we had infinite sensors."

  Elias looked at the budget sheet. The numbers were clean. The choice was not. He thought about the stiffness in his shoulders, the physical weight of those three hours. It felt like a tax levied by the water itself. A toll for trying to look too far ahead.

  He picked up the pen. The plastic was cool compared to the mouse. He hovered over the line item for the radar array. It was the scientist's choice. It was the belief that truth was recoverable if you just paid the price. He moved the pen to the skimmers. That was the engineer's choice. It was the belief that utility was the only truth that mattered.

  Neither argument cleared the air. The divergence would happen regardless. The slick would spread. The water would mix the diesel until it was gone or until it ruined the harvest. The math didn't care which line he signed. The limit was already there, written in the fluid dynamics, waiting for them to run into it again.

  Elias signed the requisition for the skimmers. He didn't look at Mara. He didn't look at Vance. He capped the pen and set it down on the table.

  Outside the window, the grey water of the Reach moved against the pilings of the dock. A line of foam gathered in the corner of the glass, vibrated with the tide, and held its shape without breaking.
