  # The Coherence Diagnostic Tree

  **Start:** You accept that an agent vulnerable to a money pump (cyclic preferences leading to loss) is defective in some way.

  **Node 1:** Is the primary lesson that we should not build systems this way, or that a thinker is irrational if they reason this way?
  *   **Build Systems:** → **Leaf 1**
  *   **Thinker Irrational:** → Node 2

  **Node 2:** Is the defect in what the agent fundamentally wants, can it be fixed by better planning, or is it due to limited capacity?
  *   **Fixed by Planning:** → **Leaf 2**
  *   **Limited Capacity:** → **Leaf 3**
  *   **Fundamentally Wants:** → Node 3

  **Node 3:** Can any pattern of behavior be described as maximizing utility if we define "outcomes" to include the history of choices?
  *   **Yes (Any Behavior):** → **Leaf 4**
  *   **No (Constrains Behavior):** → Node 4

  **Node 4:** If we define utility over whole policies rather than single outcomes, does the theorem still tell us how to act?
  *   **Yes (Still Constrains):** → **Leaf 5**
  *   **No (Must be Atomic Outcomes):** → Node 5

  **Node 5:** Must every finite good be tradeable for enough of another good (e.g., is any risk worth taking for a large enough reward)?
  *   **No (Some Values Absolute):** → **Leaf 6**
  *   **Yes (All Tradeable):** → Node 6

  **Node 6:** Must uncertain events always be assigned a single precise probability number?
  *   **No (Unknown Odds Differ from Known):** → **Leaf 7**
  *   **Yes (Precise Probabilities):** → Node 7

  **Node 7:** Does the value of a gamble depend only on the weighted average of its outcomes?
  *   **No (Risk Profile Matters):** → **Leaf 8**
  *   **Yes (Weighted Average):** → Node 8

  **Node 8:** Does the agent need to actually lose money to be irrational, or is the mere possibility of a pump enough?
  *   **Actually Lose Money:** → **Leaf 9**
  *   **Mere Possibility:** → **Leaf 10**

  ***

  ## Leaves and Commitments

  **Leaf 1: Coherence as Engineering Prediction**
  *   **Position:** Coherence arguments are engineering predictions about goal-directed systems rather than norms binding on agents.
  *   **Hardest Pill:** You must accept that "rationality" is merely a survival trait for systems, carrying no moral or logical weight for thinkers.

  **Leaf 2: Dynamic-Choice View**
  *   **Position:** Pumps indict myopic sequential choice rather than the underlying preferences.
  *   **Hardest Pill:** You must concede that an agent can hold cyclic preferences without irrationality, provided they are sophisticated enough to block the trade.

  **Leaf 3: Satisficing or Bounded Rationality**
  *   **Position:** Satisficing or bounded rationality as a positive claim about what rational agents do.
  *   **Hardest Pill:** You must accept that avoiding exploitation is sometimes too computationally expensive to be required of a rational agent.

  **Leaf 4: Deflationary View**
  *   **Position:** Any behavior whatsoever can be represented as utility maximization once utilities are defined over sufficiently fine-grained objects, so that the theorem carries no normative content.
  *   **Hardest Pill:** You must admit that the coherence theorem cannot distinguish between a genius and a lunatic, rendering it normatively empty.

  **Leaf 5: Policy-Based Normativity**
  *   **Position:** Utilities are permitted to take whole trajectories or decision problems as their arguments, preserving normative force.
  *   **Hardest Pill:** You must accept that the "outcome" of a choice includes the entire history of how you got there, radically expanding the domain of evaluation.

  **Leaf 6: Non-Archimedean or Lexicographic Utility**
  *   **Position:** Non-Archimedean or lexicographic utility.
  *   **Hardest Pill:** You must commit to the view that some values are infinite relative to others, making trade-offs between them impossible.

  **Leaf 7: Ambiguity-Sensitive Views**
  *   **Position:** Ambiguity-sensitive and imprecise-credence views.
  *   **Hardest Pill:** You must reject the idea that a rational mind can always summarize its uncertainty with a single percentage.

  **Leaf 8: Distribution-Sensitive Views**
  *   **Position:** The view on which the value of a gamble depends on the shape of its probability distribution and not only on the weighted average of its outcomes.
  *   **Hardest Pill:** You must accept that two gambles with the identical expected payoff can be rationally ranked differently based on risk.

  **Leaf 9: Pragmatic Coherence**
  *   **Position:** Exploitability must be actual (a broker who really shows up) to indict the agent.
  *   **Hardest Pill:** You must hold that an agent is rational until a predator actually arrives to take their money, making rationality contingent on the environment.

  **Leaf 10: Expected Utility Maximization**
  *   **Position:** Expected utility maximization as a straightforward normative ideal.
  *   **Hardest Pill:** You must accept that a rational agent would trade a certainty of a small good for a vanishingly small chance of a great good, provided the expected value is higher.

  ***

  ## Logical Space Analysis

  **Empty Cells**
  1.  **Normative + Preferences + Not Representable + Atomic Outcomes + Archimedean + Precise + Linear + Actual Exploitability + Symptom View:**
      *   *Status:* **Coherent but Unattractive.** This cell represents a view where the pump only matters if money is actually lost, *and* the loss is merely a symptom of a deeper disconnect. It is rarely occupied because if the loss is merely a symptom, the possibility of the pump should suffice to identify the defect; requiring actual loss undermines the diagnostic power of the symptom.
  2.  **Normative + Preferences + Representable (Deflationary) + Normative Force Retained:**
      *   *Status:* **Incoherent.** If any behavior is representable (Deflationary), the theorem cannot constrain behavior. Claiming it retains normative force is a contradiction.

  **Indistinguishable Leaves**
  *   **Leaf 5 (Policy-Based Normativity) and Leaf 10 (Expected Utility Maximization):**
      *   *Flag:* These are difficult to separate empirically. If one maximizes EU over policies (Leaf 5), the observable behavior often mimics maximizing EU over outcomes (Leaf 10) unless the policy itself enters the utility function in a way that violates independence. The distinction is largely metaphysical (what counts as an "outcome") rather than behavioral.

  **Specific Combination Request**
  *   *Combination:* **Transitivity Required + Behavior Always Representable over Trajectories (Incoherence Undetectable).**
  *   *Analysis:* This combination occupies the space between **Leaf 4 (Deflationary)** and **Leaf 5 (Policy-Based Normativity)**.
      *   If behavior is *always* representable over trajectories, then by definition, no observable behavior violates transitivity over those trajectories.
      *   If transitivity is still *required*, the norm applies to a hidden structure (the "true" preferences) that is by assumption perfectly aligned with behavior (since behavior is always representable).
      *   *Verdict:* This view collapses into **Leaf 4 (Deflationary)**. If incoherence is undetectable from the outside because any behavior fits the model, the requirement for transitivity has no empirical content. To maintain it as a norm (Leaf 5), one must claim that *some* behaviors would fail to be representable even over trajectories, which contradicts the premise that *any* behavior admits representation. The user's group member who holds this is likely a Deflationist who wishes the theorem still had bite; logically, they must choose between the bite (Leaf 5) and the universal representability (Leaf 4).
