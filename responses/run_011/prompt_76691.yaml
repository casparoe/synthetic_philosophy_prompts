answer: |-
  **Arrival and the Externalist Turn: A Semantic Autopsy**

  Your instinct to pivot from Sapir-Whorf to semantic externalism is philosophically salvageable, but it requires treating the film's explicit metaphysics as a mistake and its incidental details as the real argument. *Arrival* wants desperately to be a movie about linguistic determinism—the idea that the structure of language dictates the structure of thought. This is an internalist thesis: meaning and cognitive capacity are locked inside the skull, determined by neural architecture. However, the specific mechanism of the crisis—the "weapon versus tool" dispute—opens a door to Twin Earth. If we walk through it, we find a film at war with itself, oscillating between a Whorfian internalism and a Putnamian externalism, ultimately failing to resolve the tension but succeeding in dramatizing the human cost of semantic shift.

  Let's start with the mahjong line. You are right to seize on this. When Louise Banks suggests the Chinese team interpreted the heptapod sign as "use weapon" because their interactions were framed by a competitive game, she is making a contextualist claim about reference. The internal state of the Chinese linguists might be identical to the American team's regarding the visual symbol, but the content differs because their causal history with the speakers differs. This is the shape of Putnam's argument: meaning ain't in the head. It depends on how you are embedded in the world.

  However, the film immediately undermines this. If externalism holds, the reference of the heptapod sign should be fixed by the heptapods' intention and the actual causal role the "weapon" plays in their universe. The sign means whatever the heptapods mean by it. The dispute shouldn't be about how the humans play mahjong; it should be about deferring to the native speakers. Louise resolves the crisis not by checking the heptapods' causal history, but by arguing for a charitable interpretation ("tool" rather than "weapon"). This slides back into internalism. She is effectively stipulating meaning based on what saves the situation, not discovering a pre-existing semantic fact. The film wants there to be a fact of the matter—the heptapods *do* intend to give humanity a tool—but it allows Louise to access this fact through intuition and empathy rather than semantic deference. So, does the film notice the tension? No. It treats externalist context (the mahjong) as a plot device to justify an internalist breakthrough (Louise's insight).

  This brings us to the division of linguistic labor. In a standard externalist framework, Louise should be unable to fix the reference of technical heptapod terms initially. She is a partial speaker. According to Burge's social externalism, her utterances derive their content from her willingness to defer to experts—in this case, the heptapods themselves or Ian Donnelly on the physics of the craft. The film respects this initially; she constantly checks her translations against Ian's physical readings. But the narrative arc requires her to become the expert. By the climax, she is no longer deferring; she is authoritative. She knows what the heptapods mean better than the generals do.

  This creates a worrying gap in the semantics. If Louise's early translations are made while she is incompetent, relying on deference, what do her early utterances express? Externalism suggests they express whatever the experts mean. But the film suggests she is genuinely misunderstanding them until the "rewiring" takes hold. This implies that deference isn't enough; you need the right internal cognitive structure to grasp the content. This is a rejection of externalism. It suggests that without the non-linear neural architecture, you literally cannot latch onto the reference, no matter how much you defer. The film tries to have it both ways: meaning is social (we need to talk to the aliens), but access is biological (you need the right brain).

  The most fertile ground for your group, however, is the slow-switching argument. In the literature, this worry asks: if I move from Earth to Twin Earth, my concept of "water" changes from H2O to XYZ. Do I know what I thought yesterday? Externalism threatens privileged access to our own minds. *Arrival* turns this abstract worry into a narrative tragedy. As Louise immerses herself in Heptapod B, her linguistic environment changes, and consequently, the content of her thoughts changes. She begins to "remember" a future that hasn't happened.

  Here, the film offers something argument alone cannot: the emotional weight of content shift. In a philosophy paper, slow-switching is a puzzle about self-knowledge. In *Arrival*, it is a choice about grief. Louise realizes that learning the language changes the temporal reference of her memory concepts. When she thinks "my daughter," the term initially refers to a dead child in the past. As she becomes fluent, the term shifts to refer to a child she will choose to have in the future. The film asks whether the Louise who remembers the past grief is the same person as the Louise who remembers the future loss.

  This is where the reading risks being imposed. Externalism usually concerns natural kinds or social norms, not the metaphysics of time. For Louise's memories to change content, the external world itself must change (i.e., the future must become real). The film assumes a block universe where the future exists to be referred to. If you reject that metaphysics, the semantic argument collapses. However, if we grant the film its premise, it validates the externalist worry that we do not fully own our thoughts. Louise cannot know what she means by "mother" until she knows her temporal location relative to the child. Her self-knowledge is opaque to her until the linguistic shift is complete. She discovers who she is by learning what her words latch onto. This is a powerful dramatization of the anti-individualist claim: you are not the sole authority on your own mind because your mind is partly constituted by the world outside you.

  Yet, we must be honest about where the film fails the externalist test. The primary mechanism of change is neuroplasticity, not environmental causation. Louise doesn't just learn the words; her brain physically rewires to perceive time non-linearly. This is biological internalism. A strict externalist would say the content changes because her relationship to the heptapods changes, not because her neurons fire differently. The film conflates the vehicle of thought (neurons) with the content of thought (meaning). It suggests that if you don't have the right hardware, you can't have the right semantics. This is incompatible with Putnam's view that a brain in a vat could have different contents purely based on causal history, regardless of internal state.

  Furthermore, there is a deeper semantic problem with Heptapod B that the film glosses over. Externalism relies on reference—words picking out objects or states of affairs. Heptapod B is described as teleological and performative. They don't write to describe; they write to make things happen. The script is written all at once, like a completed gesture. If the language doesn't have truth conditions—if it isn't in the business of describing the world—does externalism even get off the ground? Externalism explains how "water" refers to H2O. It is less clear how it explains a logogram that *is* the action of knowing. If the utterance doesn't have an extension, there is nothing for the environment to fix. In this sense, the heptapods might be speaking a language that externalism cannot analyze, because their semantics are pragmatic, not referential. Louise isn't learning to refer to things differently; she is learning to act differently.

  So, does *Arrival* give the externalism debate anything new? It does not solve the problems, but it raises the stakes. The standard slow-switching argument is epistemological: how do I know what I mean? The film makes it existential: if what I mean changes, do I still want to say it? Louise chooses to learn the language knowing it will alter her perception of loss. She accepts the externalist condition that her mind is not her own, that it belongs to the linguistic community she joins. She accepts that her "memories" will be dictated by the grammar she acquires.

  For your reading group, the value lies in this tension. Use the mahjong line to launch the externalist reading, but force the group to confront the Whorfian counter-evidence. Ask them to locate the exact moment Louise stops deferring and starts knowing. Ask them whether her "memories" are genuine memories if the referent (the daughter) does not yet exist causally. And finally, ask whether a language that refuses to describe the world can be analyzed by a philosophy built on reference. The film is not a textbook case of externalism; it is a messy collision of semantic theories. But that messiness is useful. It shows that when we talk about meaning changing, we aren't just talking about logic; we are talking about whether we can bear to live in the world that our words reveal.

  One plot correction for your handout: Louise does not explicitly tell the generals that the Chinese team was playing mahjong in the climax; she deduces their interpretation based on their earlier mention of the game and uses that to argue for ambiguity. She acts on the externalist insight without fully explaining the philosophy to the military. Also, be careful with the physicist in the room: the film treats the heptapod gift as a language, but Ian treats it as physics. The externalist reading works best if you treat the language as a tool for interacting with physical reality, bridging Louise's linguistics and Ian's science.

  In sum, *Arrival* is not an externalist film, but it is a film about the consequences of externalism. It suggests that if meaning is outside the head, then changing your world changes your self. That is a claim worth arguing over, even if the movie prefers neural rewiring to causal chains.
