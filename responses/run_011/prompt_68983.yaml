      *   *Initial thought:* For Westin, maybe say "User-controlled $\epsilon$."
      *   *Correction:* That's a mechanism design choice, not the definition of privacy. Westin says privacy *is* control. DP says privacy *is* indistinguishability. That's a category error I need to highlight.

  9.  **Final Polish:** Check the "Residue Report" logic. Does the user's framework miss the *normative* layer entirely? Yes. That's the big gap.

