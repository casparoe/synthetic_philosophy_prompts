      *   *Best Diagnosis:* The failure is in **Premise (3)** regarding the definition of "contributing nothing." The argument assumes wage labor is the only valid contribution *in practice* while claiming it isn't in *principle*. But the deeper issue is the **Institutional Mandate Gap**. The principle (1)-(2) is a theory of *Justice*, but the memo is about *Administration*.
      *   *Wait, looking closer at the User's preference:* They want to keep (1) and (2). They are willing to give up (3).
      *   *My Recommendation:* I should argue that **(3) is the point of failure**, but not for the reason they might think. It fails because it conflates "capacity to contribute" with "capacity to engage in wage labor." However, the *real* shield against (6) is not changing (3), but introducing a **Priority Principle** or **Institutional Competence** constraint.
      *   *Actually, the strongest philosophical move:* Distinguish between **Reciprocity within the Scheme** vs. **Reciprocity in Society**.
      *   (1) defines the "common pool" as the "benefits of social cooperation."
      *   But the *Benefits System* is a specific subset of that.
      *   If (1) is about the *Benefits System*, then heirs don't draw from *that* pool. They draw from the *Market*.
