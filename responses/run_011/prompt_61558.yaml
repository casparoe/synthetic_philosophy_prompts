          *   *Option A: Restrict (1).* (Keep the memo, lose the grand theory). Cost: The moral high ground of "fairness" becomes "contractual compliance."
          *   *Option B: Accept (7) First Horn.* (Radicalize). Cost: Political suicide, memo rejected.
          *   *Option C: Accept (7) Second Horn.* (Admit selectivity). Cost: Hypocrisy, undermines the "fairness" claim.
          *   *Option D (My Recommendation):* Reframe (3) & (4) via **Institutional Role**. The state acts as an administrator of a specific fund, not a judge of total justice.
      *   **What would change my verdict:** If the user can show that the "benefits system" is fundamentally distinct from "property rights" in a way that isn't just arbitrary.
      *   **Self-Correction/Uncertainty:** I need to admit that distinguishing between "welfare dependency" and "wealth accumulation" as forms of free-riding is philosophically shaky without a prior theory of property rights.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   Wait, if I tell them to restrict (1), they said they *want* to keep (1) and (2) because it avoids "desert/moral character." If (1) becomes "You signed a form," it returns to contract/compliance, which feels like "administrative cruelty."
      *   They want (1) to be about *Fairness*.
      *   So, how to save Fairness without condemning the Heir?
      *   *Idea:* **The Baseline Problem.** The claimant is falling *below* a social minimum. The heir is resting *above* it. Reciprocity duties are triggered by *need*, not just capacity.
      *   *Revised Diagnosis:* The failure is in (2). Free-riding is unjust, *but* the duty of reciprocity is conditional on the scheme being a safety net, not a general revenue distributor.
      *   *Actually, the strongest point:* **The Distinction between Claim Rights and Liberty Rights.** The claimant has a *claim* on others' resources (taxes). The heir is consuming *their own* (legally recognized) resources. Even if those resources originated from "social cooperation," they are currently titled.
      *   *Okay, let's look at the "Price" request.* I need to be very clear about trade-offs.
      *   *Let's focus on the "Scope of the Principle."* The principle applies to the *Safety Net*, not the *Whole Economy*.
      *   *Why?* Because the Safety Net is a *specific* cooperative venture (insurance against misfortune). Inheritance is a *different* venture (intergenerational transfer).
      *   *Diagnosis:* The argument treats the Welfare State as the *whole* of Social Cooperation. It is not. It is a *subset*.
      *   *Failure:* **Composition Fallacy.** What is true of the whole (society) is not true of the part (welfare agency), and vice versa.

  7.  **Finalizing the Plan:**
