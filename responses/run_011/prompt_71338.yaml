  2. Your first hypothesis is correct but derivative, as the conflicting definitions of conscription arise from these deeper ontological commitments rather than mere semantic sloppiness. The professionists see Sweden's selective model as a recruitment pipeline, whereas the civic camp sees it as a ritual, because they prioritize different functions of the institution.

  3. I would reformulate your fourth hypothesis to suggest that intuitions about coercion are not merely suppressed but actively transubstantiated into arguments about effectiveness to remain politically palatable. Both sides argue via utility because admitting the core conflict is about the moral permissibility of state compulsion would stall the policy process entirely.

  4. Your third hypothesis identifies a genuine ignorance, but I reject the idea that an answer would embarrass both sides equally, as the citizen-soldier camp already admits military utility is secondary to societal signalling. The lack of post-1945 data is convenient for both, but it is not the cause of the disagreement since their criteria for success diverge before reaching the battlefield.

  5. Progress requires abandoning the search for a single optimal system and instead mapping which specific security functions require professionalization versus which require civic participation. The honest way to run the working group is to explicitly separate the debate into two distinct tracks: one for force generation efficiency and another for societal resilience, acknowledging they may demand contradictory structures.
