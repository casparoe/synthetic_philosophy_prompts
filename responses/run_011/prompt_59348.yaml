answer: |-
  0.35

  That's my credence that the Wrong Kind of Reasons (WKR) problem is ultimately fatal to fitting-attitude (FA) analyses. In other words, I'm assigning a 65% probability that some version of FA survives the objection, perhaps battered and modified, but intact enough to do the philosophical work it was designed to do. I'm not confident enough to bet against the framework entirely, but I think the objection lands serious blows that prevent any "clean" version of the theory from standing.

  Here is the decomposition. For the objection to be fatal, four conditions must jointly obtain. If any one of them fails, the FA analysis can be rescued or reformulated. I've assigned probabilities to each condition being *true*, and since they function as a conjunction (all must hold for the theory to die), I multiply them to get the headline number.

  **(a) The Existence of Genuine Attitude-Reasons: 0.75**
  This is the claim that cases like the demon threat or the million-dollar bribe actually provide reasons *to have* the attitude, rather than merely reasons to *want* to have the attitude or to bring it about. I assign this a high probability because the intuitive pull is strong: if a demon threatens to kill everyone unless you admire the saucer of mud, it feels correct to say you have a reason to admire it, not just a reason to wish you did. Denying this often feels like linguistic gerrymandering to save the theory.

  **(b) The Normative Target: 0.70**
  Conditional on (a), this is the claim that these reasons bear on the *fittingness* of the attitude, rather than on some other normative status like pragmatic rationality or prudence. This is the core battleground. If "fittingness" is insulated from pragmatic reasons, FA survives. I give this a 0.70 because the distinction between "fitting" and "rational" is notoriously slippery; if there is a reason to hold the attitude, it's hard to explain why that reason doesn't make the attitude fitting in some broad sense of the term.

  **(c) The Failure of Restrictions: 0.75**
  This is the claim that no independently motivated restriction on the analysis succeeds in filtering out WKRs without also filtering out the right kinds of reasons (RKRs). Proposals like "object-given reasons only," "content constraints," or "deliberative constraints" all face counterexamples or circularity charges. I'm fairly pessimistic here; every fix seems to introduce new problems or presuppose the very value facts the analysis was supposed to explain.

  **(d) The Substantivity of the Dispute: 0.90**
  Note that for the objection to be fatal, the dispute must *not* be merely terminological. So I am assigning a 0.90 probability to the claim that this is a substantive disagreement about normativity, not just a verbal confusion about the word "fitting." If it were just terminological, the objection wouldn't be fatal, just annoying. I think the stakes are real: they concern the structure of normative reasons themselves.

  **Calculation:**
  0.75 (a) × 0.70 (b) × 0.75 (c) × 0.90 (d) = 0.354375 ≈ **0.35**

  ### Sensitivity Analysis

  The headline number is most sensitive to **(b), The Normative Target**.

  If you could settle exactly one sub-question, proving that pragmatic reasons *never* bear on fittingness (dropping the probability of (b) from 0.70 to, say, 0.10) would crash the final credence to roughly 0.05. Conversely, if it were proven that *any* reason for an attitude makes it fitting (raising (b) to 0.95), the fatal credence jumps to 0.48. This is the conceptual hinge because it determines whether the FA theorist can draw a defensive perimeter around "fittingness." The other variables matter, but (b) decides whether the wall exists at all.

  ### What Would Move Me

  I would be moved most by a **conceptual argument about the constitutive aims of attitudes**, rather than an intuition pump or empirical data.

  Intuition pumps regarding the demon cases vary too much between individuals to settle metaphysics, and folk usage of "admire for a reason" is likely too messy to constrain normative theory. What would shift my credence is a rigorous account showing that attitudes like admiration or desire have internal standards of correctness (constitutive aims) that logically exclude external reasons from counting toward their correctness. If someone can demonstrate that pragmatic reasons make an attitude *beneficial* but logically cannot make it *correct* in the way truth makes belief correct, that would drive my credence in fatality down significantly.

  ### Trends and Extrapolation

  Over the last couple of decades, the trend has moved from "WKR kills FA" to "WKR constrains FA." The consensus shifted from viewing the problem as a refutation to viewing it as a technical constraint that any successful FA analysis must solve, leading to more sophisticated teleological and reasoning-based views.

  **Extrapolation:** In fifteen years, I guess the FA framework will remain dominant but deflated. The term "fittingness" will likely be treated as a primitive normative relation rather than something analyzable purely in terms of reasons, or else the analysis will be explicitly restricted to a specific subset of normative properties. The WKR problem won't be "solved" in a way that satisfies everyone, but it will be domesticated as a known boundary condition of the theory.
