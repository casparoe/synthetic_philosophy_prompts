      *   The core tension is that Origin Essentialism claims identity is strict (necessary), but biology is vague. If origin is defined by the *material* gametes, changing the DNA changes the material. But if the material is mostly the same, is it the same origin? The story needs to show the clinic trying to define "origin" as "this specific physical oocyte" vs "this specific genetic sequence".
      *   The lawyer will argue: Identity is binary.
