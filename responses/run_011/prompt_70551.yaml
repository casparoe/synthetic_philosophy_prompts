  I have chosen to construe origin essentialism as a boundary condition for numerical identity, treating the specific genetic sequence of the zygote as the necessary anchor for personhood. The story enacts the Sorites paradox not through abstract argument but through bureaucratic procedure, where the metaphysical absolute must be administered via a consent form that demands a discrete number. By placing the philosopher in the role of legitimizing a hard line on a continuous biological process, the narrative dramatizes the tension between the logic of identity and the vagueness of material composition.

  The conference room was kept at nineteen degrees, a temperature designed to preserve the viability of the samples in the adjacent lab but which always felt like a penalty to those of us in shirtsleeves. Sarah, the clinic's general counsel, sat at the head of the table with the consent form spread before her like a map of a contested border. To her right sat David, the lead embryologist, who was rubbing his temples with a thumb and forefinger that smelled faintly of ethanol. Across from them were Elena and Mark, the parents, who had not spoken in twenty minutes. They were looking at the file folder in the center of the table, the one labeled Case 8940, which contained the genetic sequence of their daughter who had died at four years old from a metabolic disorder. They were not asking for resurrection. They were asking for a sibling who would be as close as the clinic could manage, which meant using the remaining vitrified oocytes from the same retrieval cycle and correcting the single-base variant that had caused the illness. The clinic's policy, however, required a metaphysical certification. If the correction altered the origin enough to constitute a different person, the consent language changed from reproductive treatment to experimental research, and the liability shifted entirely.

  Sarah tapped the paper with a pen. The sound was sharp in the quiet room. We need a number, she said. The policy states that identity is preserved only if the origin remains numerically identical. We have defined origin as the specific oocyte at the time of fertilization. But we are editing the oocyte before fertilization. She looked at me. You drafted the clause. You told us identity was binary. It either is the same child or it is not. There is no degree of sameness in metaphysics. So how many substitutions can we make before we are no longer treating the parents' request for a sibling but creating a stranger? David leaned forward. It is one base pair, he said. Then two. Then three. The sequence is printed here. He slid a sheet across the table. It looked like a receipt, a column of numbers descending into the hundreds. At step one, the oocyte is corrected for the disease variant. At step ten, we have optimized for mitochondrial efficiency. At step fifty, we are arguably enhancing immune response. Where is the line?

  I looked at Elena. She was tracing the barcode on the file folder with a fingernail. She did not look up. I just want her back, she said. Not her. Another one. Like her. The law does not care about like, Sarah said. It cares about who. If we tell you this is your daughter's sibling, and the metaphysics says it is a different person because the origin material was altered beyond a threshold of significance, then we have committed fraud. We have sold you a person under false pretenses. David shook his head. Significance is not a metaphysical property. It is a clinical judgment. Biologically, the cell is continuous. You change one atom, it is still the same cell. You change a billion, it is still the same cell until it lyses. There is no moment where the cell dies and a new one is born during editing. So why should there be a moment where the person changes? Because the person is not the cell, Sarah said. The person is the history that flows from the cell. If you change the source code, you change the history.

  I picked up the pen. It was heavy, designed for signing, not for thinking. The file on the table also contained an addendum regarding Case 7721, a set of monozygotic twins born last year. They shared an origin. They were two persons. This complicated the sufficiency claim. If one origin could yield two persons, then origin was not sufficient for identity. But the clinic's policy relied on necessity. If the origin changes, the person must change. The reverse was not guaranteed. I looked at the sequence. Step one was mandatory to prevent the disease. If I did not initial step one, the child would die. If I initialled step one, I was admitting that a changed genome could still be the same origin. If I admitted that, where did it stop? Sarah was watching me. She needed me to be the arbiter of the magic line. She needed me to say that up to substitution X, the soul remains, and at X plus one, it departs. That was not my job. My job was to write the words that allowed them to sleep at night.

  Mark spoke for the first time. His voice was rough. Does the number matter? If you say ten, and we do eleven, is the child less ours? Yes, Sarah said. Because then we lied to you about who they were. No, David said. Because they are still your child. They are just healthier. Elena looked up. She looked at the pen in my hand. Just pick a number, she said. Please. We are tired. I looked at the sequence. The numbers blurred. The metaphysics was clean in the seminar room, where we dealt in possible worlds and rigid designators. Here, in the cold light of the clinic, it was a tool for liability management. I realized that the necessity of origin was not a fact about the world but a rule about the records. If the record said the origin was preserved, then it was preserved. But I could not write that. I had to initial the box. I hovered the pen over the line for maximum permissible substitutions. The ink gathered at the tip, a dark sphere waiting to fall. I thought about the twins in Case 7721. Same origin, different people. I thought about the dead girl in the file. Different origin, same parents. The pen did not move. The silence stretched until it felt like a physical weight on the table. Sarah cleared her throat. We cannot proceed without the initial. David stood up. I am going to prep the oocyte. He walked out. Elena put her hand over Mark's. They waited. I looked at the number zero. I looked at the number one. I looked at the blank space where the number should be. I put the pen down. We need to revise the policy, I said. Sarah closed the folder. That is not an option for this cycle. Then we do not proceed, I said. Elena began to cry. It was a quiet sound, like air escaping a room.

  I have taken liberties with both the embryology and the metaphysics to serve the narrative pressure. The technique described, single-base editing of vitrified oocytes without fertilization, is currently speculative; CRISPR is typically applied to zygotes or embryos, and oocyte editing carries significant technical hurdles regarding delivery and mosaicism that I have smoothed over to allow the Sorites sequence to exist. Metaphysically, I have leaned on a contested reading of origin essentialism. A strict Kripkean might argue that there is a fact of the matter about identity regardless of our ability to know it, meaning the Sorites paradox is epistemic rather than ontological. By treating the identity boundary as something the clinic must administratively define, I have slid between saying origins are necessary for identity and saying they are sufficient, or rather, that the institutional record of the origin constitutes the identity for legal purposes. This conflation is intentional, as it mirrors how institutions often operationalize philosophical concepts: not as truths, but as manageable risks. The story does not resolve the paradox because the paradox arises from the collision of binary logic with continuous matter, and no amount of签字 can fix the underlying category error.
