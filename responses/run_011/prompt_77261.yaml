  2.  **Deconstruct the Core Philosophical Problem:**
      *   *Chesterton's Fence:* Don't remove a fence until you know why it was put there. Implies latent wisdom in tradition.
      *   *R.'s Extension:* Applies even if there was no builder (sediment) or if the function has shifted (second fence).
      *   *User's Challenge:* Is this category error? Does the metaphor break when applied to evolutionary/accreted social norms vs. deliberate legislation?
      *   *My Role:* Validate the user's intuition (which is philosophically sound) while rigorously testing the limits of the analogy.

  3.  **Brainstorming Candidate Mappings (Step 1 of Prompt):**
      *   *Mapping 1: The Legislative Map.* Fence = Law, Builder = Legislator, Road = Public Life. (Standard view).
      *   *Mapping 2: The Evolutionary Map.* Fence = Adaptation, Builder = Natural Selection/Time, Road = Survival. (R.'s view).
      *   *Mapping 3: The Epistemic Map.* Fence = Heuristic, Builder = Collective Wisdom, Road = Decision Space. (Social Epistemology view).
      *   *Mapping 4: The Power Map.* Fence = Barrier, Builder = Elite, Road = Access. (Critical theory view - relevant for the "Second Fence").
      *   *Mapping 5: The Architectural Map.* Fence = Structure, Builder = Founder, Road = Flow. (Focus on stability).

  4.  **Developing the Correspondence Table (Step 2 of Prompt):**
      *   Need to define the terms clearly based on the *ideal* Chestertonian view vs. the *R.* view.
      *   *Road:* The course of action/social flow.
