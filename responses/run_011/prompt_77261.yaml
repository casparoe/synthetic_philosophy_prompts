  5.  **Analyzing Disanalogies (Step 3 of Prompt):**
      *   *Decorative:* Material (wood vs. norm), Scale (one fence vs. whole system).
      *   *Biting:*
          *   *Cost of Maintenance:* Fences rot; norms require enforcement.
