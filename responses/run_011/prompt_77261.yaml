  9.  **Drafting the Response (incorporating the persona):**
      *   Tone: Professional, rigorous, respectful of the novelist's insight, slightly academic but accessible.
      *   Structure: Follow the prompt's sequence exactly.
      *   Content: Ensure the distinction between *designed order* and *emergent order* is central.

      *(Self-Correction during drafting)*: I need to make sure I don't just agree with the user. I need to test their "Sediment" claim. Is it true there's *no* reason? There's a functional reason, just not an *intentional* one. I need to clarify that distinction. R.'s error is conflating *function* with *intent*.

      *(Refining the Verdict)*: R.'s burden of proof is too strong. It should be a burden of *inquiry*, not a presumption of *validity*. Chesterton says "find out why," R. says "assume it's good until proven bad." That's the slip.

      *(Refining the Image)*: The Reef is the best fit for the user's novel context (old district, brick, accretion). It captures the "dead builders" aspect.

  10. **Final Review against Constraints:**
