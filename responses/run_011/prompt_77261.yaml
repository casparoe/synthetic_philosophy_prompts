  7.  **The Verdict on R. and Burke (Step 5 of Prompt):**
      *   R. is overextending. Chesterton's Fence works for deliberate traditions, fails for "Sediment."
      *   Burke is more nuanced than R. Burke talks about "prescription" and "prejudice" (pre-judgment), which covers sediment better than Chesterton's specific imagery.
