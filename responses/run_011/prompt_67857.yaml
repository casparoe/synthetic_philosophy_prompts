answer: |-
  **Brainstorming Framings**

  1.  **The Probate Clerk:** Silas processes a will where the testator died before signing it in coordinate time, though causally after. Collision: Legal validity of signatures and intent.
  2.  **The Harbour Master:** Elara manages docking rights for ships returning from the outer rotation where arrival precedes departure. Collision: Port fees and quarantine laws based on duration.
  3.  **The Cartographer:** Kael maps "simultaneity lines" for a new atlas, finding they spiral into nonsense. Collision: Property boundaries defined by "current" ownership.
  4.  **The Archivist:** Mara catalogs historical records where cause and effect are inverted in the ledger. Collision: Statistical analysis of crime rates.

  **Selection:** I choose **The Probate Clerk**. It focuses on the *consequences* of the geometry on human meaning (legacy, memory, obligation) rather than the mechanics of travel, fitting the "no caper" rule while allowing a bureaucratic institution to collide directly with the lack of global time.

  ***

  **The Dust and the Deed**

  The Bureau of Succession smelled of lignin and stale tea. It was a smell Silas associated with permanence, though he knew better than to say so aloud. Outside the high, narrow windows, the universe turned. It did not expand; there were no receding galaxies to offer comfort in a redshifted distance. The matter simply rotated, a homogeneous swirl of pressureless dust balanced by a constant, unyielding lambda. Wherever you stood, you were at the centre of the rotation. Wherever you stood, the water in your tea cup spun slightly counter-clockwise if you waited long enough, a subtle Coriolis whisper from the cosmos itself.

  Silas adjusted his spectacles and looked at the file on his desk. Estate of Captain Vane. Date of Death: 14th March, 4092. Date of Will Execution: 16th March, 4092.

  He rubbed his temples. The coordinate times were stamped by the Central Observatory, the only authority trusted to lay a grid over the dust. According to the grid, Captain Vane had signed his will two days after he was recorded dead.

  "It's the outer loop," said Mara, sitting on the edge of his desk. She was his wife, and she was the only person in the Bureau who did not wear a tie. She held a mug of tea that was not spinning. She held it very still.

  "The grid is the law," Silas said. "If the date of execution post-dates the date of death, the will is void. The estate passes to the state."

  "The grid is a convenience, Silas. You know the metric. Beyond the critical radius, the light cones tip. The coordinate $t$ loses its meaning as a global ordering parameter. Vane went out there. He flew the curve. He came back. He signed the paper. He died in his bed. Causally, the signature precedes the death. His hand moved, the ink dried, his heart stopped. That is the only order that matters."

  "The law requires a global 'now'," Silas said, tapping the paper. "It requires us to stack the universe into shared present moments. If we cannot say who was alive when, we cannot say who owned what."

  "Then the law is trying to carve a shape that does not exist," Mara said. She took a sip. "There is no global now. There never was. We just pretended there was because we never went far enough to see the spiral."

  Silas looked out the window. The sky was dark, speckled with stars that held their positions relative to one another over eons. No expansion. Just the slow, great turning. He thought of the retired women in his reading group—no, he thought of the senior partners in the Boardroom. They would not care about light cones. They would care about precedent.

  "The Board meets tomorrow," Silas said. "They want a recommendation."

  "Recommend that the coordinate stamp be abolished for estates involving Class-4 trajectories," Mara said. "Use proper time. Use the wristwatch of the testator."

  "And create a loophole where anyone can claim their grandfather signed a will yesterday because they flew him round the dust fast enough?"

  "If he flew him, then yesterday is where he is," Mara said. "You're frightened of the geometry."

  "I'm frightened of the intestacy," Silas said.

  He stood up and walked to the window. The city below was lit by electric arcs. There was no night really, only a dimming of the ambient starlight as the dust clouds thickened in the local sector. The rotation was imperceptible to the eye, but it was there. It was the fundamental fact of their existence. They lived on a island in a rotating sea of matter.

  "Vane's daughter is waiting," Silas said. "She's in the foyer."

  "Let her wait," Mara said. "She's waiting for a verdict on whether her father exists."

  Silas turned back to the room. The files were stacked in neat piles, chronological order. It was a lie, of course. The pile on the left was not necessarily earlier than the pile on the right. Not globally. But locally, in this office, the entropy increased. The tea cooled. The paper yellowed.

  "I need to write the report," Silas said.

  "Write the truth," Mara said. "Or at least, write the uncertainty."

  She left the mug on the desk. Silas watched the surface of the tea. It was still. But if he waited an hour, would it turn? The effect was too small to see in a cup, only in long canals of water, but the principle held. The universe had a preferred direction. It just wasn't the direction of time.

  ***

  The Boardroom was panelled in wood that had been grown before the rotation was understood. The five members of the Succession Committee sat behind a curved table. Silas stood at the podium. He had his report. He had the file. He had the arguments Mara had given him, and the counter-arguments he had built against them in the night.

  Chairman Halloway looked over his spectacles. "Mr. Vane's trajectory is confirmed?"

  "Confirmed, sir. Class-4. He crossed the critical radius. He returned."

  "And the dates?"

  "Coordinate time places his death before his signature. Proper time places his signature before his death."

  Halloway sighed. It was a dry sound, like pages turning. "We have dealt with this before. The *Lindsey* case of '88. We ruled that coordinate time governs property transfer. Property is fixed to the land, and the land is fixed to the grid."

  "The land rotates, sir," Silas said. "There is no fixed grid. The Observatory admits the coordinate system breaks down beyond the critical radius. It becomes spacelike."

  "Then we extend the grid," Halloway said. "We impose order. Without order, there is no law. Without law, there is no succession. If a man can sign a will after he is dead, what stops a man from signing a deed before he is born?"

  "Physics stops him," Silas said. "Causality stops him. The light cones still protect the local order. Vane did not sign the will after he was dead. He signed it before he was dead. The grid is just... wrong."

  "The grid is the state," Halloway said. "You are asking us to accept that the state's measurement of reality is subordinate to a pilot's wristwatch."

  "I am asking you to accept that the state's measurement of reality is subordinate to reality."

  Halloway leaned forward. "And if reality is inconsistent? If the geometry allows a man to meet himself? What then of the will? Does he sign it twice? Does he inherit from himself?"

  "That is not this case," Silas said. "This case is simple. The man died. He left instructions. The instructions were written while he was alive. The only conflict is in the numbering system we use to label the events."

  "Numbers are not just labels, Mr. Silas. They are sequence. Sequence is time. If you remove sequence, you remove consequence. If there is no consequence, there is no crime, no debt, no inheritance." Halloway paused. "You sound like your wife."

  Silas stiffened. "She understands the metric."

  "She understands the abstraction," Halloway said. "We understand the people. The daughter needs to know if she owns the house. She needs a yes or a no. She does not need a lecture on light cones."

  "If I give her a yes based on a false premise, I am lying."

  "If you give her a no based on a rigid premise, you are unjust." Halloway sat back. "We will adjourn. We will consult the Observatory. We will ask them if the grid can be patched."

  "It cannot be patched," Silas said. "It is the geometry of the universe."

  "Then we will patch the law," Halloway said. "Dismissed."

  Silas gathered his papers. He walked out of the room into the corridor. The lights hummed. He thought about the argument Mara wanted him to make. The deeper one. The one about the nature of time itself. He hadn't said it. He couldn't. It was too large for the Boardroom. It was too large for the Bureau.

  ***

  Dinner was quiet. The flat was small, filled with books that leaned against each other for support. Mara served stew. It smelled of thyme and root vegetables. Ground things. Things that grew in seasons, even if the seasons were not caused by orbit but by local dust density variations.

  "They rejected it," Silas said.

  "Of course they did," Mara said. She poured wine. "Institutions exist to resist the geometry. They are structures of persistence. They must deny the rotation to maintain the wall."

  "Halloway said I sounded like you."

  "Did he mean it as an insult?"

  "He meant I was impractical."

  Mara sat down. She did not eat immediately. She looked at Silas. "Did you tell them why it matters? Not the property. The time."

  Silas cut his meat. "They don't care about time. They care about order."

  "They are the same thing to them." Mara put her fork down. "Silas, listen. Gödel saw this. He saw that if General Relativity allows a universe where time is not a linear flow, where you can return to your own past without breaking physics, then time cannot be an objective feature of reality. It cannot be something that 'passes'. If it were real, if it were fundamental, it couldn't just disappear because you took a different path."

  "That's a big leap," Silas said. "Just because it's possible in one solution doesn't mean it's true in ours."

  "It shows the theory hands us no such structure," Mara said. "The bare possibility proves that 'now' is not built into the equations. It's an appearance. Like the colour of the sky. It's real to us, but it's not in the physics."

  "It feels real," Silas said. "The stew is getting cold. That is not an appearance. That is heat transfer. That is entropy."

  "Local entropy," Mara said. "You can have local order in a chaotic system. You can have a whirlpool in a river. The whirlpool has a direction. But the river flows where it likes. Just because you feel the passage, just because you remember the past and not the future, doesn't mean the universe distinguishes them globally. The equations work both ways."

  "The equations don't feed the daughter," Silas said. "The law does. The law says the father died before he signed. If we ignore that, we say the law is subjective. If the law is subjective, why obey it?"

  "Because it works locally," Mara said. "Like Newtonian physics. We know it's wrong. We know space curves. But we build bridges with it because the curve is small. We should build laws with proper time because the global time is nonsense."

  "And when the curves get big? When the loop is tight?"

  "Then the law breaks," Mara said. "And we admit it. We don't pretend the grid holds."

  Silas looked at his wine. The liquid was dark red. He swirled the glass. The wine climbed the sides, forming a concave surface. Rotation. Evidence of the turn.

  "If I accept your view," Silas said, "then Vane's will is valid. But Halloway is right too. If time is just an appearance, then what is a promise? A promise is a binding of the future. If the future is already there, in the block, waiting for me to walk into it... then I'm not promising. I'm just describing."

  "You're resisting," Mara said. "You want time to be real because you want your choices to matter."

  "I want my choices to matter because I make them," Silas said. "Not because the geometry allows a loop. The fact that a closed loop doesn't stop an event having happened to someone... that counts for something. Vane felt the pen in his hand. He felt the fear of dying. That happened. It's data, not noise."

  "It's data," Mara agreed. "But it's not *temporal* data. It's just... arrangement. The pen mark is next to the heartbeat in the sequence of his life. The grid just labels them differently."

  "The grid is how we meet," Silas said. "If I say meet me at noon, and you say meet me at noon, we meet. If we use proper time, and you flew a loop, your noon is not my noon. We miss each other."

  "Then we meet by causality," Mara said. "I send a signal. You receive it. We meet when the signal arrives."

  "That's not how people live," Silas said. "People live in the shared now. Even if it's a fiction. It's the fiction that holds the Bureau together. It holds us together."

  Mara reached across the table. She touched his hand. Her skin was warm. "We are together now. Is this fiction?"

  "No," Silas said. "But it won't last."

  "Nothing lasts," Mara said. "Not even the dust. Eventually, even the rotation might stop, if the constant changes. But while it turns, we are here."

  Silas looked at her. He thought of the Boardroom. He thought of Vane's daughter in the foyer, waiting for a word that would tell her if she was an heir or a stranger. He thought of the tea in the mug, still on the surface, but turning in the universe.

  "I can't change the ruling," Silas said. "Halloway will patch the law. They will create an exception for Class-4 trajectories. They will call it 'Extended Jurisdiction'. They will not admit the grid is broken."

  "They never do," Mara said.

  "But I can annotate the file," Silas said. "I can add a note. For the archives. So that when someone else reads it in a hundred years, they know the grid was lying."

  Mara smiled. It was a small smile, tired. "That's something."

  "It's not enough."

  "It's what we have," Mara said. "We navigate by the stars, even if the stars are moving. We draw the maps, even if the coastlines shift."

  Silas finished his wine. He stood up and took the plates to the sink. The water ran clear. He watched it go down the plughole. It spiralled. Left-handed. Always left-handed in this hemisphere of the rotation. A small signature of the great turn.

  He dried his hands on the towel. He walked back to the table. Mara was looking out the window. The city lights were blurred by the glass.

  "Did you know," Mara said, "that if you go far enough out, you can see the back of your own head? Not literally. But the light comes round. You could see yourself waving."

  "I don't want to see myself waving," Silas said. "I want to see you."

  "You do," Mara said. "Every day."

  Silas went to the window. He stood beside her. He looked out at the dark, rotating dust. There was no centre. There was no edge. There was only the turn, and the things they held onto while it spun. He placed his hand on the glass. It was cold.

  ***

  **Author's Note**

  The probate scene carries Gödel's claim that global time coordinates are arbitrary in rotating solutions; the Bureau's refusal to accept proper time mirrors the philosophical resistance to abandoning objective succession. The dinner argument enacts Gödel's modal premise: if *possible* worlds in GR lack objective time, time is not essential to reality, even if our local experience suggests otherwise. Silas resists with the phenomenological argument: local distinguishability and the feeling of passage constitute valid data for human ethics, regardless of global topology.

  I have fudged the scale. In Gödel's 1949 metric, the critical radius for Closed Timelike Curves is billions of light-years, requiring velocities near light speed and lifetimes far exceeding human capacity. In the story, Class-4 trajectories are treated as feasible within a career. I also simplified the homogeneity; the city implies local density variations not strictly present in the pure dust solution. These cheats were necessary to make the geometry collide with bureaucracy rather than astrophysics. The physics of the rotation (Coriolis on tea) is exaggerated for sensory effect.
