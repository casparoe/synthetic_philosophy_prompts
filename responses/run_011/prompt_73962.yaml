answer: |-
  You have correctly identified the engine room of confirmation theory without needing to invent a new word, though the literature splits the concept across two main camps. The "dose" you are describing is formally known as **Weight of Evidence** (specifically in the sense defined by I.J. Good), and the dependency you've spotted is the **Background Dependence of Confirmation**.

  However, since you asked for boundaries and nearest concepts, here is the breakdown of how philosophy of science and statistics map onto your QC intuition.

  ### 1. Does it have a name?
  There is no single noun (like *Grue*) that captures the *variability* of the dose. Instead, the field treats this as a property of **Confirmation** itself. The specific quantity you are intuitively calculating—the shift in probability mass provided by an observation—is called **Weight of Evidence** ($W$).

  In Bayesian terms, $W = \log(\text{Likelihood Ratio})$.
  In your sulfate example:
  *   **Specific Method:** The likelihood of a positive blank given contamination is low; the likelihood of a positive blank given *no* contamination is also low. The ratio is near 1. $W \approx 0$.
  *   **Sloppy Method:** The likelihood of a positive blank given *no* sample contamination (but dirty reagents) is high. A negative blank rules out a high-probability alternative. The ratio shifts. $W > 0$.

  The fact that this weight changes based on the setup is simply referred to as the **Context-Dependence of Evidential Support**. If you need a label for your book group, **"Variable Confirmatory Power"** is the standard descriptive phrase.

  ### 2. The Three Nearest Concepts (and their boundaries)

  You are standing at the intersection of three distinct concepts. They overlap, but they stop at different places.

  **A. Likelihood Ratio (Statistics/Bayesianism)**
  *   **What it is:** The ratio of the probability of the evidence given the hypothesis is true vs. false ($P(E|H) / P(E|\neg H)$).
  *   **Where it matches your case:** This captures your "sloppy vs. specific method" intuition perfectly. It quantifies the *discriminatory power* of the test itself.
  *   **Where it stops:** It does not account for the "population effect" (1 in 2 vs. 1 in 10,000). That requires a Prior. A Likelihood Ratio tells you how much to move your belief, but not where you started.

  **B. Base Rate Sensitivity (Bayesianism)**
  *   **What it is:** The dependency of the posterior probability on the prior probability (the prevalence).
  *   **Where it matches your case:** This captures your "1 in 2 lots vs. 1 in 10,000 lots" intuition. A negative result on a high-risk contaminant moves the needle more than on a low-risk one (in terms of absolute risk reduction), though in terms of *odds*, the Likelihood Ratio is the multiplier.
  *   **Where it stops:** It treats the test as a black box. It doesn't care *why* the test is informative (mechanism), only that it correlates with the state.

  **C. Severity (Error Statistics / Deborah Mayo)**
  *   **What it is:** A claim passes a severe test if it is very unlikely to pass if it were false.
  *   **Where it matches your case:** This is the strongest philosophical fit for your "blank" intuition. A negative blank in a sloppy method is a *more severe* test of "reagent purity" than in a specific method, because the sloppy method had more ways to fail.
  *   **Where it stops:** Severity is frequentist/error-based. It focuses on the *capacity to detect error* rather than the *degree of belief*. It tells you whether you are warranted in claiming the reagents are clean, not necessarily how much it boosts the probability of the sample result in a Bayesian updating sense.

  **Summary of Overlap:**
  *   **Likelihood Ratio** quantifies the *method's* contribution to the dose.
  *   **Base Rate** quantifies the *population's* contribution to the dose.
  *   **Severity** explains *why* the method has that likelihood ratio (the capability to catch errors).

  ### 3. Does this dissolve the Raven Paradox?
  It **dissolves** the intuitive sting but **relocates** the philosophical burden.

  *   **Dissolution:** The paradox relies on the intuition that a white shoe *shouldn't* confirm ravens are black. Bayesian confirmation theory agrees it *does*, but calculates the Weight of Evidence as so vanishingly small (due to the massive size of the non-black class relative to ravens) that it is pragmatically zero. Your QC experience validates this: a blank in a highly specific test (where false positives are impossible) adds negligible weight.
  *   **Relocation:** The problem moves from "Why does a shoe confirm ravens?" to "Where do the Class Sizes (Priors) come from?" To calculate the weight, you must assume you know the relative sizes of the class of ravens and the class of non-black things. Justifying those background proportions is where the real work lies (the **Problem of the Priors**).

  ### 4. Is the dose ever exactly zero?
  This depends on whether you are operating in a **Logical** or **Causal** framework.

  *   **Logically (The Raven Case):** The dose is **asymptotically small, never zero**. Because "All ravens are black" is logically equivalent to "All non-black things are non-ravens," *any* non-black non-raven eliminates one possible counterexample from the universe of discourse. Unless the universe is infinite, you have reduced the set of potential falsifiers by 1. The weight is non-zero.
  *   **Causally (The QC Case):** The dose **can be exactly zero**. If the blank and the sample share *no* causal pathway (e.g., the blank uses water from Source A, the sample uses water from Source B; reagents from different batches; glassware washed in different machines), then $P(\text{Blank Result} | \text{Sample Contamination}) = P(\text{Blank Result})$. The Likelihood Ratio is 1. The Weight of Evidence is 0.
  *   **In Practice:** In a real lab, everything shares *some* causal history (same lab air, same analyst, same supplier). So in practice, like the Raven case, it is almost always asymptotically small, not zero. But theoretically, causal isolation permits exactly zero.

  ### 5. Should you coin a term?
  You asked for a definition tight enough to determine boundaries if no term exists. Since **Weight of Evidence** and **Severity** already exist, I advise against coining a new noun, as it will isolate you from the existing literature.

  However, if you need a phrase to describe the *phenomenon* of the weight changing based on the setup, I recommend: **"Contextual Diagnosticity."**

  **Definition:** *The magnitude of evidential support provided by an observation, contingent upon the specificity of the testing mechanism and the prior probability of the hypothesis.*

  **Boundary Conditions:**
  1.  **Inside:** A negative reagent blank in a non-specific assay (high diagnosticity); a negative test for a high-prevalence disease (high diagnosticity).
  2.  **Outside:** A negative reagent blank in a specific assay where interference is physically impossible (zero diagnosticity); observing the color of a shoe when testing for sulfate (zero diagnosticity).
  3.  **Distinct from Reference Class:** Reference Class is about *categorizing* the sample. Contextual Diagnosticity is about *valuing* the result after categorization.

  ### Final Recommendation
  You are describing **Weight of Evidence** as modulated by **Auxiliary Hypotheses** (the state of the reagents).

  If you want to read further without wading through pure math, look into **Deborah Mayo's "Error and the Growth of Experimental Knowledge."** She formalizes exactly your intuition about the "sloppy method" vs. "specific method" under the concept of **Severity**. She argues that a hypothesis is only confirmed if it survives a test that had a high probability of detecting an error if one existed. Your "sloppy method" blank has higher severity regarding reagent purity than the "specific method" blank, which matches your "dose" intuition perfectly.

  You haven't found a ghost; you've found the machinery. It just wears different labels in the stats department versus the philosophy department.
