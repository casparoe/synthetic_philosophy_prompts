answer: |-
  I'll concede the marketing budget. Bacon and the Royal Society fellows were brilliant self-promoters, no doubt. They needed to distinguish themselves from the divines and the schoolmen to secure patronage, so they shouted about a 'Great Instauration.' But taking a grant proposal's executive summary as ontological truth is where we go wrong. The 'fooling' wasn't a contemporary con; it was Herbert Butterfield in the 1930s and 40s. When he lectured on the origins of modern science, he took those seventeenth-century manifestos at face value and cemented a narrative that privileged theory over practice, ignoring the thick continuity of mathematical work running from Grosteste through Oresme to Newton.

  You want a date? I'll give you one, but it's for the historiography, not the history. The 'Scientific Revolution' as a capitalized event is a mid-twentieth-century construct, solidified when Butterfield and later Koyré needed a tidy box for the genesis of modernity. Steven Shapin put it best in the nineties: saying there was no Scientific Revolution isn't denying change happened, it's denying that the change was singular, sudden, or self-contained. The downstream effects you mention are real, but they're the effects of the *story* we told about science, not proof that the actors actually crossed a bright line. They were tinkering, not rebirthing.
