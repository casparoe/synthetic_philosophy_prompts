answer: |-
  ### 1. Confidence Report and Evaluation of Existing Terms

  **Confidence Level:** I am **highly confident (90%+)** that there is no single, canonical term in the philosophical canon (comparable to *ad hominem* or *begging the question*) that captures the specific two-stage pattern you describe.

  **Report vs. Reconstruction:** The analysis below is a **reconstruction** based on methodological literature (e.g., Cappelen, Williamson, Ludwig, Machery) and rhetorical theory. While the *phenomenon* is widely discussed, it is typically fragmented across discussions of "vagueness," "robustness," "idealization," and "ad hoc modification." No single label unifies the *silent under-specification* with the *retroactive fixation*.

  Here is how the terms you suggested map onto your description:

  *   **Enthymeme:**
      *   *Covers:* The idea that information is missing and must be supplied by the audience.
      *   *Fails:* Enthymemes are typically missing *premises* in an argument, not *factual details* in a scenario. Furthermore, enthymemes are usually acknowledged as rhetorical shortcuts; your pattern involves the *denial* that anything was missing ("it was obvious").
  *   **Begging the Question (Petitio Principii):**
      *   *Covers:* The circularity where the conclusion is assumed in the setup.
      *   *Fails:* This pattern is more specific. It's not just assuming the conclusion; it's assuming a *description* that guarantees the conclusion, while pretending the description is neutral.
  *   **Moving the Goalposts:**
      *   *Covers:* The second half (changing the conditions to defuse an objection).
      *   *Fails:* Usually applies to criteria for *acceptance* of a claim, not the *content of the evidence* itself. It misses the first half (the initial silent divergence).
  *   **No True Scotsman:**
      *   *Covers:* The defensive move ("That's not the *real* version of the case").
      *   *Fails:* This applies to class membership ("No true philosopher..."). Your pattern applies to *particulars* ("This specific agent..."). It is structurally similar but categorially distinct.
  *   **Dennett's Intuition Pump:**
      *   *Covers:* The idea that details can be varied to test stability.
      *   *Fails:* Dennett's advice is to *vary* the pump to check robustness. Your pattern describes an author who *denies* variation is occurring. It is the *abuse* of a pump, not the pump itself.
  *   **Framing/Wording Effects:**
      *   *Covers:* The empirical fact that details change verdicts.
      *   *Fails:* These are empirical categories from X-Phi, not names for the *dialectical move* in armchair philosophy.
  *   **Idealization:**
      *   *Covers:* Leaving details out for theoretical clarity.
      *   *Fails:* Idealization assumes the omitted detail is *irrelevant* to the phenomenon. Your pattern occurs precisely when the detail is *load-bearing*.

  **Best Fit:** There is no single best fit. The phenomenon is a composite of **Descriptive Underdetermination** (Part 1) and **Ad Hoc Rescue** (Part 2).

  ---

  ### 2. Naming the Phenomenon

  Since no established term exists, you face a choice: use a descriptive phrase or stipulate a term. Given your constraint against manufacturing terms if the premise is confused, I will first challenge the premise, then offer a label if you persist.

  **The Challenge:** You are asking for a noun (a "concept") for what is arguably a **methodological vice** composed of two distinct errors.
  1.  **Error 1:** Failing to recognize that a case is under-specified at a pivot point (Competence/Epistemic error).
  2.  **Error 2:** Retroactively specifying the case to save the thesis without acknowledging the shift (Integrity/Rhetorical error).

  Combining these into one "concept" risks reifying a bad habit into a "move" that might be seen as legitimate if named. However, for the sake of your writing, you need a shorthand.

  **Proposed Term:** **"Protean Specification"** (or **"The Protean Case"**).
  *   **Definition:** A thought experiment is *Protean* when (a) its description is underdetermined at a load-bearing locus, allowing divergent completions, and (b) the author retroactively fixes the locus to defuse objections while claiming the fixation was implicit in the original description.
  *   **Necessary Conditions:**
      1.  **Load-Bearing Omission:** A detail is omitted that is causally relevant to the intuitive verdict.
      2.  **Divergent Completion:** Competent readers fill the omission differently (evidenced by split intuitions or objections).
      3.  **Retroactive Fixation:** The author specifies the detail only after objection.
      4.  **Denial of Revision:** The author claims the specification was original/obvious, not a revision.
  *   **Diagnostic:** Ask: "If this detail had been specified *ex ante*, would the objection have arisen?" If yes, and the author now says "It was always this way," it is Protean.

  ---

  ### 3. Boundary Cases

  **False Positive (Looks like Protean Specification, but isn't):**
  *   **Scenario:** A utilitarian case describes an agent maximizing happiness. A critic objects: "But what if the calculation is wrong?" The author replies: "The case stipulates the agent *knows* the outcomes."
  *   **Why it's not Protean:** The detail (knowledge of outcomes) is standard idealization for consequentialist cases. It is not load-bearing in a way that splits *moral* intuition (everyone agrees knowledge matters); it is a theoretical parameter. The "omission" was a standard convention, not a hidden pivot.
  *   **Diagnostic:** Is the omission a standard convention of the sub-field? If yes, it's likely **Idealization**, not Protean Specification.

  **False Negative (Is Protean Specification, but rarely flagged):**
  *   **Scenario:** Gettier cases. Many classic Gettier vignettes leave it vague whether the agent has a "justification" in the internalist or externalist sense, or whether the "truth" is connected to the belief via a specific causal chain.
  *   **Why it is Protean:** Different readers fill in the epistemic architecture differently. When pressed, proponents often sharpen the description to ensure the "luck" element is preserved, claiming that was the "point" all along.
  *   **Why it's not flagged:** The case is canonical. The "point" of the case is so entrenched that the specification is treated as discovered, not stipulated. This is the danger of **Canonization**: Protean cases become stable simply because everyone memorizes the same "fix."

  ---

  ### 4. Normative Status: Is it a Defect?

  You asked if there is a respectable view on which this is productive. **Yes.**

  **The Particularist Defense:**
  Moral Particularists (e.g., Jonathan Dancy) argue that moral judgment relies on sensitivity to context, not subsumption under rules. On this view, a vignette *should* be under-specified. It functions as a prompt for the reader to bring their own moral perception to bear.
  *   **Productive Ambiguity:** If the goal is to test the reader's *capacity* to judge, not the truth of a principle, the "gap" is a feature. It forces the reader to engage imaginatively.
  *   **Mirroring Reality:** Real-world moral situations are under-described. We rarely know if the "effortless agent" is aware of temptation. A case that mirrors this ambiguity might be *more* ecologically valid than a fixed vignette.

  **The Counter-Argument (Why it's usually a defect):**
  This defense fails if the author claims **Universal Intuition**. If the argument rests on "We all judge X," but "We" are actually judging X* and X**, the argument is unsound. The defect arises not from the ambiguity itself, but from the **claim of stability** in the face of ambiguity.
  *   **Verdict:** It is a defect *relative to the methodological goal*. If the goal is **Reflective Equilibrium** requiring stable inputs, Protean Specification is fatal. If the goal is **Exploratory Particularism**, it may be acceptable, provided the author acknowledges the variability.

  ---

  ### 5. The Critic's License

  **May a critic complete the case unfavorably?**
  **Yes, but with a caveat.**

  *   **The Standard:** In armchair philosophy, the principle of **Charitable Interpretation** usually suggests reading the case in the way that makes the *argument* strongest. However, this applies to the *argument*, not the *evidence*.
  *   **The License:** A critic is licensed to argue that **the case is unstable**. You do not need to wait for the author to commit. You can argue: "On Reading A, the intuition is X; on Reading B, the intuition is Y. Therefore, the case does not support the universal claim."
  *   **The Trap:** If you simply pick the unfavorable reading and argue against *that*, the author will accuse you of attacking a straw man ("That's not the case I meant!").
  *   **The Strategy:** Do not argue against the completed case. Argue against the **under-specification**.
      *   *Bad Move:* "In your case, if she has savings, she isn't free. So your argument fails." (Author replies: "She doesn't have savings.")
      *   *Good Move:* "Your case leaves savings unspecified. Since this detail determines the verdict, your claim that 'the case elicits intuition X' is false. It elicits X for group A and Y for group B."

  **Summary Advice:**
  Do not let the author force you into the role of "objector to the revised case." Force them into the role of "defender of the original description." If they revise the description, demand they log it as a **revision**, not a **clarification**. In your own writing, if you encounter this, label it **"unstable under-specification"** (a safer, more descriptive term than "Protean") and treat the intuition as **conditional** on the missing detail.

  ### Final Contradiction/Check

  You asked me to contradict you if your premise is confused. Here is the contradiction:

  **You are treating a rhetorical failure as a logical category.**
  There is no name for this pattern for the same reason there is no name for "lying about the data." It is not a distinct *form* of reasoning (like a fallacy); it is a violation of the **norms of description**. By searching for a term like *ad hominem*, you risk granting it a legitimacy it doesn't deserve. It is not a "move" in the dialectic; it is a **breakdown** of the dialectic.

  If you name it "The Protean Case," you risk making it sound like a recognized tool (like "Reductio"). I advise you to describe it functionally in your paper: *"The author relies on an under-specified case that is retroactively stabilized to defuse counterexamples."* This is clunkier than a single term, but it is methodologically more precise and less likely to be misunderstood as a standard maneuver.
