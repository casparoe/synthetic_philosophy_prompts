  1. Welfare is one-dimensional: the balance of pleasure over pain in a life. Nothing else is good or bad for someone except as it feeds that.
  2. There's no single felt quality shared by all pleasures. Cold water when you're parched, the click when a proof falls into place, bass at a loud show, sex, the warm nasty glow of wining an argument — phenomenally these have basically nothing in common.
  3. So what unifies them is conative: they're the experiences you don't want to stop while you're having them. People tell me that makes me an "attitudinal" hedonist rather than a felt-quality one, sure, fine.
  4. I'm a Benthamite on quantity vs. quality: no higher and lower pleasures, no discounting the base ones. A unit of schadenfreude is a unit.
  5. I'd plug into Nozick's machine and I think his argument fails; the deceived husband whose happiness rests on a lie isn't worse off, welfare-wise.
  6. I reject preference-satisfaction theories of welfare pretty firmly, including the idealized fully-informed versions.
  7. I want to keep interpersonal comparison — I need to say a happy mouse has more welfare than a miserable one and roughly how much more, because I aggregate across species for EA reasons.
  8. Introspectively I'm confident I can tell whether any given experience of mine is pleasant right now, no theory required.

