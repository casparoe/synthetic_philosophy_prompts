answer: |-
  ### Audit of Welfare Claims

  This is a sophisticated position. You have essentially reconstructed **Attitudinal Hedonism** (likely unaware of the specific literature, which is good—it means you derived it from intuition). You are trying to hold onto the *structure* of hedonism (welfare = mental states) while adopting a *conative* definition of those states to solve the heterogeneity problem, all while maintaining an EA-friendly aggregation metric.

  Here is the consistency audit, ranking the tensions by severity.

  ### Candidate Pairs & Sorting

  **1. Claim 2 (No common felt quality) vs. Claim 7 (Interspecies Comparison)**
  *   **Severity:** Critical.
  *   **The Tension:** You need a common currency to aggregate welfare across species (7). Claim 1 says that currency is "pleasure." Claim 2 says pleasures share no phenomenal quality. Claim 3 attempts to bridge this by making the currency "conative intensity" (wanting it to continue). However, comparing the intensity of a mouse's conative state to a human's is arguably *harder* than comparing felt qualities. If there is no common phenomenology and no objective external metric for "conative intensity," you have no calibration for your EA aggregation. You cannot sum heterogeneous units.
  *   **What has to go:** You must weaken Claim 2. You need to posit *some* common denominator, whether phenomenal (a "raw feel" of reward) or functional (a specific neural substrate), to make Claim 7 viable.
  *   **Cost:** You lose the strong intuition that a cold drink and a proof are "nothing alike." You must accept they share a deeper, perhaps sub-personal, commonality.

  **2. Claim 3 (Conative unity) vs. Claim 6 (Anti-Preference)**
  *   **Severity:** High.
  *   **The Tension:** You define the good-making feature of an experience as a conative attitude ("don't want to stop"). You simultaneously reject preference-satisfaction theories. While Attitudinal Hedonism is technically distinct from Global Preference Satisfaction (because it restricts preferences to *current experiences* rather than world-states), the *grounding* of value is identical: value is constituted by a pro-attitude. If you reject preference theories because you think value shouldn't depend on desires/attitudes, Claim 3 violates that. If you reject them only because they count non-experiential desires (e.g., posthumous reputation), then there is no conflict. Given your "firm" rejection, this feels like a theoretical contradiction.
  *   **What has to go:** You need to clarify Claim 6. You must admit that your view is a *species* of preference theory (local/experiential), or you must change Claim 3 to a non-conative account (e.g., felt quality).
  *   **Cost:** If you admit it's a preference view, you lose the "Hedonist" label's traditional insulation from preference-based objections. If you change Claim 3, you lose your solution to Claim 2.

  **3. Claim 3 (Conative unity) vs. Claim 8 (Introspective Certainty)**
  *   **Severity:** Medium.
  *   **The Tension:** Claim 8 says you know something is pleasant immediately, "no theory required." Claim 3 says pleasure *is* a specific conative attitude (wanting it to continue). While we often know our desires, the "felt quality" view makes introspection more direct than the "conative" view. Sometimes we enjoy things we wish we didn't (guilty pleasures), or endure pain we want to continue (masochism, intense exercise). In those cases, your "wanting to stop/continue" judgment might lag or conflict with the "pleasantness" judgment.
  *   **What has to go:** Weaken Claim 8 to allow for error, or weaken Claim 3 to allow for non-conative pleasure.
  *   **Cost:** You lose the infallibility of your self-reporting, which complicates data collection for Claim 7.

  ### Dissolving Pairs

  **Claim 5 (Experience Machine) vs. Claim 6 (Anti-Preference)**
  *   **Verdict:** **Dissolves on Inspection.**
  *   **Why:** This looks contradictory only if you assume all anti-preference theorists reject the Experience Machine. In reality, Hedonists (Claim 1) typically *accept* the Experience Machine, while Preference Theorists typically *reject* it (because the preferences are about reality, not experience). Since you are a Hedonist (1), accepting the Machine (5) is consistent. Your rejection of Preference Theory (6) is actually what *licenses* your acceptance of the Machine. This pair is stable.

  ### The Single Revision

  **Revise Claim 2.**

  **Current:** "There's no single felt quality shared by all pleasures... phenomenally these have basically nothing in common."
  **Revision:** "While pleasures feel diverse, they share a common functional or sub-personal 'reward' signature that allows for comparison."

  **Why this cleans up the most:**
  1.  **Solves the EA Problem (Claim 7):** It restores a common currency. If there is a shared neural or functional signature of "reward" across species, you can theoretically calibrate a mouse's reward signal against a human's. Claim 3 (conative) is a poor metric for cross-species comparison; a common phenomenal/functional core is much better.
  2.  **Resolves the Preference Tension (Claim 6):** If pleasure is defined by a felt/functional signature rather than a conative attitude ("wanting"), you are no longer grounding welfare in desires. This distances you from Preference Satisfaction Theory, making Claim 6 consistent again.
  3.  **Simplifies Introspection (Claim 8):** It is easier to argue we have direct access to a felt signature than to a second-order conative attitude.
  4.  **Preserves Hedonism (Claim 1):** It keeps the focus on mental states rather than world-states.

  **The Cost:** You must abandon the strong phenomenological intuition that a cold drink and a mathematical proof share *nothing*. You must accept that "pleasure" is a natural kind with a common underlying thread, even if the surface textures differ. This is a small metaphysical price to pay for a working theory of aggregation.
