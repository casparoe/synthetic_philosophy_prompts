answer: |-
  You have identified a gap in our conceptual vocabulary. There is no single established term that captures the specific two-part mechanism you describe: the *rhetorical reclassification* of punishment as preference, combined with the *structural diffusion* of agency that prevents appeal.

  Here is the landscape of near-misses, followed by a proposed coinage that carves out the phenomenon you are seeing.

  ### The Near-Misses

  1.  **Informal Sanctions:** This is the closest sociological term. It covers non-state punishment (shunning, ostracism). *Failure:* It admits the act is a sanction. Your observation is that the actors *deny* it is a sanction to evade the norms that govern sanctioning.
  2.  **Private Censorship:** This covers the suppression of speech by non-state actors. *Failure:* It focuses on the speech, not the *procedural evasion*. It also implies a central censor, whereas you describe a distributed network.
  3.  **State Action Doctrine:** This is the legal principle that constitutional due process only applies to government actors. *Failure:* This describes the *legal loophole* itself, not the social phenomenon of exploiting it. It explains why they *can* do it, not what the act *is*.
  4.  **Cancel Culture:** This is the colloquial umbrella. *Failure:* It is too politically loaded and imprecise. It conflates public shaming (speech) with deplatforming (economic exclusion) and doesn't distinguish between coordinated campaigns and organic market reactions.

  ### The Coinage: Procedurally Decoupled Sanctioning (PDS)

  I propose calling this **Procedurally Decoupled Sanctioning**.

  This term captures the core mechanism: the *sanction* (the punitive effect) is **decoupled** from the *procedures* that normally legitimize sanctions (hearings, rules, proportionality, appeal).

  #### Definition
  **Procedurally Decoupled Sanctioning** occurs when a target suffers a punitive loss of status, livelihood, or access, achieved through a series of private choices explicitly framed as non-punitive (e.g., "business decisions," "freedom of association"), relying on the diffusion of agency across multiple actors to prevent any single point of accountability or appeal.

  #### The Two Necessary Conditions
  For a case to count as PDS, it must satisfy both halves of the dynamic you identified:

  1.  **Rhetorical Reclassification (The Shield):** The agents imposing the cost must explicitly deny they are administering punishment. They must frame the exclusion as a neutral exercise of private rights (contract, association, property). This framing is what lifts the procedural constraints (no need for a hearing, no need for evidence).
  2.  **Structural Diffusion (The Sword):** The punitive outcome must be the result of accumulated, independent-seeming choices by multiple agents. No single agent delivers the "sentence." This ensures there is no single entity to appeal to, and no single point where the proportionality of the total sanction can be weighed.

  #### The Edges: When Does It Stop Being PDS?

  To carve this concept cleanly, we must define where its boundaries lie. If the following changes occur, the phenomenon ceases to be PDS and becomes something else:

  *   **Edge 1: The Admission of Punitive Intent.**
      *   *Change:* If the publisher or university says, "We are dropping you *because* you violated norm X and this is a penalty."
      *   *Result:* It becomes **Formal Discipline**. Procedural norms (due process, proportionality) immediately re-attach. The "decoupling" collapses.
  *   **Edge 2: Centralized Coordination.**
      *   *Change:* If it is revealed that the bookshops, festivals, and journals are coordinating their blacklisting via a shared list or agreement.
      *   *Result:* It becomes **Conspiracy** or **Restraint of Trade** (antitrust). The diffusion of agency is broken; there is now a identifiable "sender" of the sanction.
  *   **Edge 3: Trivial Impact.**
      *   *Change:* If the exclusion causes inconvenience but not a loss of livelihood or fundamental social standing.
      *   *Result:* It remains **Market Friction** or **Ordinary Preference**. PDS requires the *effect* to be functionally equivalent to a state penalty (civil death, loss of livelihood), even if the *mechanism* is private.
  *   **Edge 4: State Compulsion.**
      *   *Change:* If the government pressures the private actors to do this (jawboning).
      *   *Result:* It becomes **State Action**. The private actors become arms of the state, and constitutional due process applies.

  ### Why This Carving Matters

  You noted that "that framing does real work." Naming this **Procedurally Decoupled Sanctioning** exposes that work.

  Currently, we treat these cases as a binary: either it is **State Punishment** (heavily regulated) or **Private Freedom** (unregulated). PDS reveals a third category: **Private Punishment masquerading as Private Freedom.**

  By identifying PDS, a conduct panel can stop asking, "Did they break a rule?" (they didn't, because they claim they aren't punishing) and start asking, "Is this a sanction that has evaded the constraints proper to sanctions?"

  It allows you to acknowledge that while no individual actor owes the target an audience, the *system* of actors has collectively created a punitive reality that demands a different kind of scrutiny than simple market choice. It shifts the debate from "Freedom of Association" to "Due Process in Private Ordering."

  ### Summary
  *   **Term:** Procedurally Decoupled Sanctioning (PDS).
  *   **Core Mechanism:** Achieving punitive outcomes while denying the label of punishment to evade procedural constraints.
  *   **Key Feature:** Reliance on distributed agency to prevent appeal.
  *   **Boundary:** Stops being PDS if intent is admitted (becomes Discipline), if coordination is proven (becomes Conspiracy), or if impact is trivial (becomes Preference).
