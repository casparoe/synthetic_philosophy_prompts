      *   **Audience:** 25 people.
          *   Majority: UK Public Lawyers (focused on Parliament Acts, Salisbury Convention, HRA, judicial review).
          *   6: Empirical Political Scientists (focused on deliberative polls, citizens' assemblies, measurement, control groups, sceptical of unmeasurable effects).
          *   3: Normative Democratic Theorists (focused on legitimacy, authorization, responsiveness, sceptical of sortition).
          *   *Constraint:* No convinced lottocrats. They know the popular polemic/record, not specialist theory.
      *   **Proposal:** 200 members, lot-selected from a *trained* pool (2-year civic apprenticeship), stratified by "temporal exposure" (over-represent youth/middle-age), competence confined to long-horizon matters, no veto (can delay 12 months then referendum), deliberative embargo (no media/lobbying/post-service office), permanent civil service secretariat.
      *   **Core Claim:** Custodial insulation (no electoral future/career) allows bearing blame for intergenerational costs. Appointment fails because appointees owe appointers.
      *   **Deliverable:** A prep sheet (not a defence).
          *   Order objections by damage potential if fumbled.
          *   Identify subgroup raising each (Lawyers, Empiricists, Theorists) and their idiom.
          *   Provide a 2-minute reply for each.
          *   Include a "candid note" on where the reply is thinnest.
          *   Flag objections to concede early.
          *   Identify the *single* reply that must land for the proposal to survive.
          *   Identify the "prayer question" (softest joint) and how to answer it.
          *   *Constraint:* No references/citations.

  2.  **Deconstruct the Proposal & Identify Vulnerabilities:**
      *   *Civic Apprenticeship (2 years):* Huge barrier to entry. Self-selection bias. Cost. Is it still "sortition" or a filtered elite?
      *   *Temporal Exposure Stratification:* How is this calculated? Is it age-based? Discriminatory? Human Rights Act issues?
      *   *Deliberative Embargo:* Freedom of speech issues (HRA/ECHR). Transparency issues. Accountability.
      *   *Referendum Trigger (after 12 months delay):* Undermines the "custodial" nature. Populism vs. Long-termism.
      *   *Secretariat:* Civil service capture. Who controls the evidence?
      *   *Competence (Long-horizon):* Definitional problems. What counts as infrastructure vs. social policy? Judicial review bait.
      *   *Legitimacy:* Why should trained lotocrats override elected MPs? Authorization problem.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The "Civic Apprenticeship" creates a self-selected elite, destroying the sortition logic.*
          *   *Who:* Empiricists & Theorists.
          *   *Idiom:* Sample frames, self-selection, attrition, representation.
          *   *Damage:* High. If the pool isn't representative, the "descriptive resemblance" claim (even if downplayed) and the "custodial" claim fail.
          *   *Reply:* It's not about descriptive stats; it's about capacity. The lottery happens *after* training to ensure competence without electoral incentive.
          *   *Thin Spot:* Who designs the curriculum? If the state trains them, aren't they state agents?

      *   *Objection 2: The Embargo violates ECHR Article 10 (Freedom of Expression) and transparency norms.*
          *   *Who:* Public Lawyers.
          *   *Idiom:* Convention rights, judicial review, transparency, accountability.
          *   *Damage:* High. Legal impossibility kills the design instantly.
          *   *Reply:* It's a statutory condition of office, like official secrets. Rights are qualified. Necessary for the function (custodial insulation).
          *   *Thin Spot:* Proportionality test. Is a total ban on individual votes necessary?

      *   *Objection 3: The Referendum Trigger undermines the "Long-Horizon" protection.*
          *   *Who:* Theorists & Lawyers.
          *   *Idiom:* Popular sovereignty, Salisbury Convention, democratic legitimacy.
          *   *Damage:* Medium-High. Turns the chamber into a populist weapon.
          *   *Reply:* It's a safety valve, not a veto. Ensures the elected house retains final say, preserving Commons supremacy.
          *   *Thin Spot:* Referendums are short-termist by nature. Contradicts the core purpose.

      *   *Objection 4: "Temporal Exposure" is legally dubious and operationally impossible.*
          *   *Who:* Lawyers & Empiricists.
          *   *Idiom:* Discrimination, administrative burden, metric validity.
          *   *Damage:* Medium.
          *   *Reply:* It's a weighting mechanism, similar to existing demographic stratification in juries/panels.
          *   *Thin Spot:* How do you measure "expected duration"? Age is a proxy, but is it lawful age discrimination?

      *   *Objection 5: Civil Service Capture.*
          *   *Who:* Empiricists & Lawyers.
          *   *Idiom:* Executive dominance, evidence handling, control variables.
          *   *Damage:* Medium.
          *   *Reply:* Secretariat is seconded, but members have independent counsel powers.
          *   *Thin Spot:* Information asymmetry is real.

  4.  **Selecting and Ordering by Damage:**
      1.  **Legitimacy/Authorization (Theorists):** If they don't accept the normative shift from "representative" to "custodial," nothing else matters.
      2.  **Legal Viability/Embargo (Lawyers):** If it breaches HRA, it's dead on arrival.
      3.  **Selection Bias/Apprenticeship (Empiricists):** If the pool is skewed, the "lot" is a sham.
      4.  **Competence Creep/Definition (Lawyers):** If "long-horizon" is indefinable, it causes gridlock and litigation.

      *Refining the "Must Land" Reply:* The core claim is *Custodial Insulation*. If the room doesn't accept that a non-elected body can have legitimacy based on *insulation* rather than *authorization*, the proposal fails. However, the legal viability is a hard stop. Actually, the *Apprenticeship* is the most unique and vulnerable part. If that's seen as disqualifying, the "lot" is meaningless.
      *Decision:* The "Must Land" is the **Normative Trade-off**. Why insulation > authorization. Without that, the lawyers ask "why isn't this just a quango?" and the theorists ask "where is the demos?"

      *Refining the "Prayer Question":* The softest joint is the **Apprenticeship**. It contradicts the "lot from the people" intuition. It sounds like creating a class of guardians. Who trains the trainers?

  5.  **Drafting the Content (incorporating specific idioms):**

      *   *Lawyers:* Salisbury, Parliament Acts, HRA, Justiciability, Proportionality.
      *   *Empiricists:* Selection bias, Attrition, Control group, External validity, Secretariat influence.
      *   *Theorists:* Authorization, Responsiveness, Democratic Legitimacy, Trustee vs. Delegate.

  6.  **Review against Constraints:**
      *   No references? Checked.
      *   Prep sheet format? Checked.
      *   Order by damage? Checked.
      *   2-minute replies? (Need to keep them concise).
      *   Candid notes on thin spots? Checked.
      *   Concessions? (Need to identify what to give away).
      *   Prayer question? Checked.

  7.  **Final Polish:**
      *   Ensure the tone is professional, strategic, and realistic.
      *   Make sure the "Concession" is strategic (give up a minor point to save the core).
      *   Ensure the "Prayer Question" answer is honest but defensive.

      *(Self-Correction during drafting)*: I initially thought the Legal objection was the biggest. But in a *reform* workshop, legal hurdles are often treated as "fixable." The *Normative* hurdle is harder. If they think it's undemocratic, no legal fix helps. However, the prompt says the room is *adversarial*. A legal kill-shot is more immediate. I will rank the **Legal/Embargo** issue highest because a UK public lawyer will treat an HRA breach as a fatal flaw, not a debate point. The **Apprenticeship** is second because it undermines the empirical validity. The **Legitimacy** is third because the user's core claim is already normative (custodial vs electoral).

