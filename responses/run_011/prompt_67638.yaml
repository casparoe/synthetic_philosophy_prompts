      *Wait, let's look closer at 2.* "If you genuinely know what a name means, that's enough to settle what it picks out." If Meaning = Referent, then knowing the meaning *is* knowing the referent. But do I know the referent of "Aristotle"? I know *that* there is one, but I can't point to him. Does that count? This is the "Semantic Competence" issue. I'll flag this as a tension with 1 depending on how "know" is defined.

