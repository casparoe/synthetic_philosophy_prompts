answer: |-
  For the consequentialist welfarist who evaluates dietary choices strictly by their marginal causal impact on sentient welfare, the received wisdom regarding beef and chicken requires urgent revision. The standard handout asserts that substituting chicken for beef reduces suffering because cattle require more resources per calorie. This reasoning relies on a crude proxy—yield efficiency—that collapses under scrutiny of supply-chain mechanics and welfare heterogeneity. If we care about the sum of suffering caused by our purchases, rather than symbolic purity or body counts, beef is often the more defensible choice. This argument rests on four pillars: the moral irrelevance of yield without welfare context, the inelasticity of beef supply, the ambiguity of land-use metrics, and the priority of suffering-hours over death-counts.

  **The Yield Asymmetry and Welfare Heterogeneity**
  The standard argument begins with arithmetic: a single steer yields roughly 300 kilograms of meat, while a broiler chicken yields roughly 2 kilograms. To replace one kilogram of beef, one must theoretically substitute 150 chickens. If every animal killed represents an equal moral harm, chicken consumption is two orders of magnitude worse. However, this calculation assumes that the moral cost of a life is determined solely by its termination. For a welfarist, the moral cost is determined by the quality of the life lived and the nature of its end.

  If a broiler chicken's life is net negative—characterized by rapid growth disorders, confinement, and painful slaughter—then bringing that animal into existence is a harm. Conversely, if a cow's life, particularly on pasture, contains more positive experience than negative, bringing it into existence may be a net benefit, or at least a lesser harm. Under these assumptions, the yield asymmetry reverses its moral valence. Producing 150 net-negative lives to save one net-positive life is catastrophic. The yield argument only holds if we assume all farmed lives are equally miserable. If we grant even a moderate welfare differential, the sheer number of chickens required to match beef calories overwhelms the single-cow metric. This premise is not speculative; broiler welfare is widely documented as severely compromised, whereas cattle welfare varies significantly by system. If the cow's life is merely *less bad* than the chicken's, the math still favors beef, provided the welfare gap is substantial enough to offset the numerical disparity.

  **The Supply-Response Asymmetry**
  Yield calculations assume a static world where demand maps perfectly to slaughter. In dynamic markets, what matters is elasticity: how production adjusts at the margin to a single purchase. Here, the case for beef strengthens considerably. The broiler supply chain is tightly coupled and rapid. Chickens reach slaughter weight in six weeks; breeder flocks are adjusted frequently to match demand. A marginal increase in chicken purchases signals producers to incubate more eggs, directly causing the existence and subsequent death of additional birds. The causal chain is short and the elasticity is high.

  Beef production is structurally different. Cattle take two years to reach slaughter weight, and a significant portion of beef supply comes from culled dairy cows and surplus dairy calves, whose existence is driven by milk demand, not meat demand. When you buy a steak, you are often purchasing a byproduct of the dairy industry or an animal from a herd whose size was determined years ago. The marginal signal sent by one consumer is dampened by long production cycles and joint-product economics. If the supply elasticity of beef is low enough, your purchase may cause zero additional deaths, merely shifting inventory prices. While this reasoning is strongest regarding dairy-beef links, it is merely suggestive regarding dedicated beef herds; however, given the long lead times, the probability that a specific beef purchase triggers a new birth is far lower than the probability that a chicken purchase triggers a new hatch. For a marginalist, expected causal impact is the only metric that counts, and the beef consumer's expected causal footprint is diluted by market friction.

  **The Land-Use Channel and Field Animals**
  The handout argues that beef's high land use implies greater harm, citing field animals killed during crop cultivation for feed. This argument fails on two counts: the metric of harm and the type of land use. First, we must ask whether the field animals (mice, voles, insects) killed by tillage have lives worth living. If wild animal lives are net positive, then killing them to grow soy for chickens is a double harm: you sustain the suffering of the farmed chicken and destroy the positive lives of wild animals. If their lives are net negative, tillage averts suffering. Since the welfare status of wild animals is deeply uncertain, relying on land-use efficiency to reduce suffering is speculative.

  Second, the land-use critique conflates grain-finished and pasture-raised cattle. A significant portion of beef comes from animals grazing on land unsuited for arable crops. In this system, no crops are grown, no tillage occurs, and no field animals are displaced by plows. The land supports a large herbivore rather than a monoculture. If we compare pasture-raised beef to grain-fed chicken, the land-use argument evaporates. The beef system utilizes land that would otherwise remain wild (supporting wild animal populations) or sequester carbon, without the direct killing machinery of industrial agriculture. The chicken system, reliant on soy and corn, necessitates the mechanical destruction of habitat. Unless one assumes that wild field lives are strictly negative and that pasture land would otherwise be rewilded to exclude large herbivores, the land-use channel does not decisively favor chicken.

  **The Choice of Measure**
  Finally, we must select the correct moral metric. The handout implicitly uses "deaths caused per kilogram." This is a proxy for suffering, but a poor one. A welfarist who counts interests equally should care about "expected suffering-hours caused per purchase." This measure integrates the duration of life, the intensity of suffering during life, the pain of death, and the probability that the purchase caused the animal to exist.

  Chicken scores poorly on this metric because the lives are short but intensely negative, and the causal link to existence is strong. Beef scores better because the lives are longer (allowing for more positive experience), the intensity of suffering is often lower (more space, natural behaviors), and the causal link to existence is weaker. Even if the cow's death is more traumatic than the chicken's, the aggregate suffering-hours over 150 chicken lives likely exceed the suffering-hours of one cow life, especially when adjusted for the probability of marginal causation. The welfarist is entitled to this measure because welfarism is concerned with the quality of experience, not the sanctity of biological continuity. If the goal is to minimize negative experience, counting bodies is a category error.

  **Status of the Argument**
  To conclude, we must distinguish between what is established and what remains contested in the literature surrounding these claims.

  Regarding **yield asymmetry**, the biological data (meat per animal) is consensus. However, the *moral* interpretation is a live dispute. One camp treats death as the primary harm, rendering yield decisive. The opposing camp, which this argument adopts, treats net lifetime welfare as decisive. This conclusion depends on the contested premise that cow lives can be net positive or significantly less negative than broiler lives. Empirical data on animal affect could settle this, but current evidence allows for wide interpretation.

  Regarding **supply-response asymmetry**, there is near-consensus among agricultural economists that poultry supply is more elastic than beef supply due to production cycles and dairy byproducts. However, the *moral weight* of this elasticity is disputed. Complicity-based ethicists argue that elasticity is irrelevant if one is participating in a harmful industry. Marginalists argue elasticity is everything. This argument relies on the marginalist premise, which is settled for the specific agent described but contested in broader ethics.

  Regarding **land use and field animals**, the mechanism (tillage kills animals) is consensus. The valuation of those animals' lives is a profound live dispute. "Negative Utilitarians" argue wild lives are net suffering, favoring land-sparing (chicken). "Welfarist Expansionists" argue wild lives can be net positive, favoring land-sharing (pasture beef). Furthermore, the assumption that pasture land cannot grow crops is geographically contingent. This section relies on the contested premise that wild field lives are not clearly net negative.

  Regarding **the choice of measure**, the preference for "suffering-hours" over "body counts" is consensus among strict welfarists but rejected by rights-based or sanctity-of-life theorists. Within the welfarist camp, the dispute lies in discount rates: does a longer life of moderate suffering outweigh a short life of intense suffering? This argument assumes intense suffering weighs heavier per minute, a premise supported by psychological data on pain but disputed by those who prioritize existence itself.

  In sum, the thesis that beef is more defensible than chicken is not settled fact, but it is a robust position within marginalist welfarism. It holds provided one accepts that broiler lives are net negative, beef supply is sufficiently inelastic, and wild field lives are not unequivocally net negative. Where these premises are disputed, the argument does not collapse but invites empirical refinement rather than moral dogma.
