  4.  **Evaluate Conflicts & Consistency (The Audit):**

      *   **Conflict 1: The Mayfly Verdict vs. Principle (1) & (4).**
          *   *Analysis:* Principle (1) says no non-arbitrary lines. Principle (4) says Standing = Intensity $\times$ Stake Interval. The Mayfly lives 1-2 days. Even if short, the Stake Interval is non-zero. To call it "morally weightless" (zero standing) implies a threshold cut-off, violating (1).
