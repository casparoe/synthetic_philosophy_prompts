      *   *(4) Stake Interval:* Standing = Intensity $\times$ Stake Interval (temporal binding of subjectivity). No stake interval = momentary subjects.
      *   *(5) Epistemic Weighting:* Weight standing by confidence in sentience (uncertainty principle).
