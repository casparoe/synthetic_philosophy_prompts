          *   *Severity:* High. The scientific evidence cited by the user *against* the verdict undermines the verdict.
          *   *Resolution:* Upgrade bee standing or downgrade the evidence for bee arbitration/stake.

      *   **Conflict 3: Principle (2) vs. Principle (3) (The "Cognitivist" Worry).**
          *   *Analysis:* (2) says *only* valence matters. (3) says look for *arbitration architecture*.
          *   *User's Worry:* Is arbitration just a cognitive proxy for valence?
