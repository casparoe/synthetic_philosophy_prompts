  We climbed the hill to find the hidden water.
  There was no promise of a cooling drink.
  Just an old stone circle marking the well.
  Sun beat down upon the limestone ridge.
  Dryness scraped the lining of the throat.
  We whispered to the place a private name.

  What does it matter what we call the name?
  If nothing flows, there is no living water.
  The dust collected heavily in the throat.
  Denying us the possibility of drink.
  We looked across the barren limestone ridge.
  And peered into the darkness of the well.

  We lowered buckets down into the well.
  To verify the truth behind the name.
  Beyond the heat-shimmer of the ridge.
  Could something else pretend to be pure water?
  Something that offers itself as a drink.
  And sears the tender lining of the throat.

  It soothed the raw irritation of the throat.
  We drew the rope up from the deep dark well.
  At last we had the substance for a drink.
  It matched the label of the given name.
  No other stuff could ever count as water.
  No mirage on the far side of the ridge.

  No mirage on the far side of the ridge.
  The coolness soothed the pain inside the throat.
  We knew then what we meant by saying water.
  It could not be otherwise in this well.
  Fixed as the letters of the written name.
  No other stuff could serve us as a drink.

  No other stuff could serve us as a drink.
  Once we had crossed the barrier of the ridge.
  And fixed the reference of the proper name.
  No dryness left to aggravate the throat.
  The bucket swung securely in the well.
  The only thing that could be called water.

  To seek a drink is to demand true water.
  Drawn from the well to cool the burning throat.
  We cross the ridge to verify the name.

