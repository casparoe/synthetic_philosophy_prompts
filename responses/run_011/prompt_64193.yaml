answer: |-
  ### The "Money Is Speech" Menu
  *Use this to isolate exactly where the argument breaks down during the debate.*

  | The Claim | Grade | The Counter-Argument |
  | :--- | :--- | :--- |
  | **1. "Money enables speech to be heard."** | **Platitude** | **Trivially True.** No one denies that printing flyers or renting a venue costs money. This is a statement of logistics, not rights. Acknowledge this to show good faith, then move on. |
  | **2. "Money is identical to speech."** | **Flatly False** | **Category Error.** A dollar bill has no viewpoint. Money is the *amplifier*, not the *message*. Regulating the amplifier (spending) is not regulating the message (content). You can limit the volume of a megaphone without banning the song. |
  | **3. "Spending caps limit the total amount of speech."** | **Live-and-Defensible** | **Debatable.** Caps limit *paid* speech, but often increase *diverse* speech by preventing wealthy clubs from monopolizing attention. A cap might reduce total volume but increase the number of distinct voices. |
  | **4. "Spending caps constitute censorship."** | **Flatly False** | **Definition Failure.** Censorship is the suppression of *content* or *viewpoint*. A spending cap is a "time, place, and manner" restriction. It applies to everyone equally regardless of what they are saying. It is regulation, not suppression. |
  | **5. "This rule violates free speech rights."** | **Flatly False** | **Jurisdiction Error.** Student Senates are not Congress. Student organizations are not sovereign citizens. Participation in student government is a privilege governed by student code, not a constitutional right protected by the First Amendment. |

  ***

  ### The Entity Shift: Individuals vs. Organizations
  *The senator's slogan borrows from Supreme Court cases regarding **individuals** and **PACs**. It falls apart when applied to **student clubs**.*

  *   **Source of Funds:** Individual spending limits touch personal property. Club spending usually comes from **Student Activity Fees** (compulsory dues from all students). When the money is collective/institutional, the institution has a right to ensure it is used neutrally.
  *   **Status:** Individuals have inherent rights; clubs have **derived privileges**. A club exists at the pleasure of the university/senate. If the senate defines the rules of existence, it can define the rules of spending.
  *   **Survival Check:**
      *   *Claim 1 (Money enables speech):* **Survives.** Clubs need money to speak.
      *   *Claim 2 (Money is speech):* **Dies.** Institutional funds are not personal expression.
      *   *Claim 3 (Caps limit speech):* **Survives.** But is justified by the need for fairness.
      *   *Claim 4 (Caps are censorship):* **Dies.** Institutions regulate conduct constantly.
      *   *Claim 5 (Rights violation):* **Dies.** Clubs do not have constitutional standing against the senate.

  ***

  ### Constitutional, Moral, or Ambiguous?
  *The slogan works precisely because it is **strategically ambiguous**.*

  *   **If Constitutional:** It fails immediately. The Student Senate is not a state actor bound by the First Amendment in the same way Congress is (especially at private universities, but even at public ones, student orgs are limited).
  *   **If Moral:** It becomes a policy debate. Is it *fair* to cap spending? That is a question of election integrity, not free speech.
  *   **The Trick:** The senator is using the **moral weight** of the Constitution to win a **policy debate** where the Constitution does not apply. He wants the absolute protection of the First Amendment without the burden of proving the Senate is a government body.

  ***

  Verdict: He is relying on the reading that institutional resources confer private individual rights.
