answer: |-
  ### Preliminary Sketch of Positions

  **Camp A (The Nonlocality Realists):**
  Their strongest case rests on the claim that Bell's 'Local Causality' is not a mere modelling choice but the direct mathematical translation of the relativistic prohibition on superluminal influence. They argue that if the probability of an event here changes given a complete specification of the past light cone *and* a spacelike-separated outcome there, then 'something' connects them. To deny this is to engage in semantic gymnastics. They maintain that 'no-signalling' is merely a contingent feature of the quantum statistics (perhaps due to equilibrium conditions) that masks the underlying dynamical nonlocality, not a proof of locality itself. For them, realism about the physical state entails realism about the probabilistic dependencies it generates.

  **Camp B (The Relativistic Operationalists):**
  Their strongest case rests on the distinction between *causality* and *correlation*. They argue that Bell's condition imposes a classical 'common cause' principle (Reichenbach's) onto a domain where it need not apply. For them, 'Locality' is exhausted by the impossibility of superluminal signalling (no-control) and the commutativity of observables at spacelike separation (microcausality). They contend that Outcome Dependence reflects the holistic nature of the quantum state, not a causal mechanism transmitting influence. To call this 'nonlocality' is to confuse a failure of separability with a violation of relativistic causality, thereby risking a category mistake that undermines the coherence of Quantum Field Theory.

  ***

  # JOINT STATEMENT ON BELL'S THEOREM AND LOCALITY

  **Preamble**
  We, the undersigned representatives of Camp A and Camp B, having engaged in adversarial collaboration, acknowledge that while we share agreement on the formal and experimental facts, we diverge on their ontological and semantic interpretation. This document records our consensus, maps our remaining disagreements, and identifies the critical cruxes upon which future resolution depends.

  ### 1. Agreed Claims

  1.  **The Formalism:** We agree that standard quantum mechanics predicts violations of Bell inequalities for entangled states measured at spacelike separation. We agree that these predictions have been confirmed by experiment to high precision.
  2.  **The Loopholes:** We agree that recent 'loophole-free' experiments have simultaneously closed the locality and detection loopholes. We agree that these tests license the conclusion that no theory satisfying the conjunction of *Local Causality* and *Measurement Independence* can reproduce the observed statistics.
  3.  **The Premises:** We agree that Bell's 'Local Causality' condition (Factorisability) is logically equivalent to the conjunction of *Parameter Independence* (the probability of a local outcome does not depend on the distant setting) and *Outcome Independence* (the probability of a local outcome does not depend on the distant outcome, given the complete state).
  4.  **No-Signalling:** We agree that quantum mechanics satisfies Parameter Independence at the observable level. Consequently, superluminal signalling is impossible within the standard framework, and relativistic causality, defined as the prohibition on controllable information transfer, is preserved.
  5.  **Measurement Independence:** We agree that the standard derivation assumes Measurement Independence (the statistical independence of the hidden variables from the future measurement settings). We agree that abandoning this assumption (via superdeterminism or retrocausality) allows for local models, though we differ on the plausibility of such models.
  6.  **The Verdict on Hidden Variables:** We agree that the theorem does not assume determinism. It applies to stochastic theories. The violation rules out *local* stochastic hidden variables, not hidden variables per se.

  ### 2. Table of Surviving Disagreements

  | Topic | Camp A Wording (Nonlocality Realists) | Camp B Wording (Relativistic Operationalists) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Definition of Locality** | Locality is identical to Bell's Local Causality (Factorisability). Violation implies physical nonlocality. | Locality is identical to No-Signalling and Microcausality. Violation of Factorisability implies non-separability, not nonlocality. | **Verbal** (regarding the label 'Locality') |
  | **Outcome Dependence** | Outcome Dependence signifies a causal or ontological link between spacelike events. It is action-at-a-distance. | Outcome Dependence signifies a holistic correlation. It is akin to finding matching colours in separated gloves; no influence passes. | **Substantive** (regarding the nature of 'Causation') |
  | **The Quantum State** | The quantum state (or the underlying physical state) must be ontologically robust to ground the probabilities. | The quantum state may be nomological or epistemic. Probabilities need not reflect physical propensities. | **Substantive** (Ontological commitment) |
  | **Relativistic Compatibility** | A fundamentally nonlocal theory is in tension with the spirit of Relativity, even if signalling is blocked. | A theory respecting No-Signalling and Lorentz-invariant observables is fully compatible with Relativity. | **Substantive** (Theory appraisal) |

  ### 3. The Cruxes

  We identify three sub-questions where clarification would significantly shift the dialectic.

  **Crux 1: The Causal Status of Outcome Dependence**
  *   **Question:** Does probabilistic dependence between spacelike outcomes, absent parameter dependence, constitute a causal relation?
  *   **Bearing Physics:** The structure of probabilistic causation in classical statistical mechanics versus quantum entanglement. Specifically, whether 'causation' requires the possibility of intervention (manipulability).
  *   **Camp A Prediction:** Intervention is not required for causation; objective chance dependencies reveal the causal structure.
  *   **Camp B Prediction:** Causation is defined by controllability. Without Parameter Dependence, there is no causal channel.

  **Crux 2: The Cost of Measurement Independence**
  *   **Question:** Would a theory that preserves Local Causality by violating Measurement Independence (e.g., retrocausal models) count as 'saving locality'?
  *   **Bearing Physics:** The thermodynamic arrow of time and the feasibility of constructing a retrocausal model that avoids fine-tuning conspiracies.
  *   **Camp A Prediction:** No. Such models sacrifice free choice or introduce global constraints that are arguably more costly than nonlocality.
  *   **Camp B Prediction:** Yes. If the local equations of motion remain local, the theory is local, regardless of boundary conditions in time.

  **Crux 3: The Ontology of the Wavefunction**
  *   **Question:** Is the entangled wavefunction a physical field existing in spacetime, or a law-like object residing in configuration space?
  *   **Bearing Physics:** The behaviour of the wavefunction under Lorentz transformations and its role in the energy-momentum tensor.
  *   **Camp A Prediction:** If it is physical, its non-separability implies nonlocality.
  *   **Camp B Prediction:** If it is law-like (nomological), its non-separability implies a holistic law, not a nonlocal mechanism.

  ### 4. Analysis of the Stipulated Test Case

  **The Case:**
  A theory is produced that reproduces every quantum prediction up to the Tsirelson bound. It is Lorentz-invariant at the level of observable operators. It satisfies Measurement Independence (settings are free variables). It satisfies Parameter Independence (no signalling). It violates Outcome Independence (outcomes are correlated beyond the shared past state).

  **Camp A Commitment:**
  Camp A is committed to declaring this theory **Nonlocal**.
  *   *Reasoning:* For Camp A, 'Local Causality' is the definition of locality. Since Outcome Independence is violated, the probability of the event at wing A is not screened off by the past; it depends on the event at wing B. Since A and B are spacelike, this dependence constitutes a physical connection that transcends the light cone. The Lorentz invariance of observables is viewed as a 'conspiracy' of the statistics that hides the underlying preferred frame or nonlocal ontology.
  *   *Statement:* "You have preserved the *appearance* of relativity (no-signalling), but you have sacrificed the *substance* of locality (independent existences). The outcomes know about each other instantly."

  **Camp B Commitment:**
  Camp B is committed to declaring this theory **Local**.
  *   *Reasoning:* For Camp B, 'Locality' is defined by the impossibility of causal influence, which requires Parameter Independence. Since one cannot manipulate the outcome at B to change the statistics at A, no information or energy travels. The Outcome Dependence is treated as a primitive correlation, similar to conservation laws applied to a single system that happens to be spatially extended.
  *   *Statement:* "You have preserved the *substance* of relativity (no causal influence), even if the system is holistic. Correlation is not causation. The outcomes do not 'know' about each other; they are manifestations of a single, non-separable event."

  **Verdict on the Dispute:**
  This case exposes the dispute as **primarily verbal**, resting on a divergent definition of 'causation' and 'locality', though it reveals a **substantive** disagreement regarding ontology.

  1.  **Verbal Aspect:** Both camps agree on the mathematical structure of the theory (Parameter Independent, Outcome Dependent). If Camp A defines 'nonlocality' as 'Outcome Dependence' and Camp B defines 'locality' as 'Parameter Independence', they are talking past each other. They could resolve this by adopting distinct terminology: Camp A speaks of 'Non-Separability', Camp B speaks of 'Causal Locality'.
  2.  **Substantive Aspect:** The disagreement persists because Camp A believes that *any* spacelike probabilistic dependence requires a physical mechanism (a 'beable' connecting the events), whereas Camp B accepts brute correlations as physically admissible without a mediating mechanism. This is a substantive disagreement about the Principle of Common Cause: Camp A holds it as a necessary norm for physical explanation; Camp B holds it as a classical heuristic that fails in the quantum regime.

  **Conclusion of the Collaboration:**
  We conclude that Bell's theorem definitively rules out *Local Causality* (in the sense of Factorisability). Whether this amounts to 'Nonlocality' depends on whether one defines locality by the screening-off condition (Camp A) or by the no-signalling condition (Camp B). We recommend that future discourse distinguish explicitly between **Causal Locality** (no superluminal influence/control) and **Ontic Separability** (the idea that spacelike regions possess independent physical states). Camp A asserts quantum mechanics violates Ontic Separability. Camp B asserts quantum mechanics preserves Causal Locality. Both claims can be true simultaneously without contradiction.
