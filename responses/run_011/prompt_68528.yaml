answer: |-
  **Alternative Cruxes Considered and Rejected**

  *   **Ranke vs. Carr on "Scientific" History:** Asking students to contrast Ranke's positivism with Carr's contextualism. *Rejected:* Too standard. Students can bluff by reciting "wie es eigentlich gewesen" versus "facts are like fish," without engaging the deeper epistemological problem of narrative structure.
  *   **The Role of Moral Judgement:** Asking whether objectivity is possible if historians make moral evaluations. *Rejected:* Too vague. This invites general moral relativism rather than forcing a technical analysis of how narrative form constrains factual selection.
  *   **White vs. Analytic Philosophy of History:** Asking students to defend White against an analytic critique of truth conditions. *Rejected:* Too one-sided. It allows students to attack White from a realist standpoint without grappling with the internal coherence of Carr's middle-ground position.

  ***

  **FINAL EXAMINATION QUESTION**

  **Time Allowed: 75 Minutes**

  **Question:**

  Consider the following defence of historical objectivity: "The apparent conflict between E.H. Carr and Hayden White is merely verbal. Carr argues that evidence constrains the selection and weighting of content, ensuring a self-correcting practice. White argues that historians impose narrative forms (such as tragedy or comedy) on those events. Since form and content are distinct, the two claims are compatible."

  Evaluate this defence. Does the imposition of a narrative emplotment inevitably alter which facts are deemed significant, thereby infecting the content-level judgements Carr seeks to protect? Furthermore, does Carr's insistence that history is a "two-way interaction" between the historian and the facts already concede the ground White claims, or does it retain an independent realist core that White's account cannot touch?

  ***

  **MODEL ANSWER**

  The defence that Carr and White operate on separate levels—content versus form—is attractive because it promises to save objectivity from radical relativism without ignoring the linguistic turn. However, this separation cannot be held. To argue that emplotment is purely formal is to misunderstand how historical significance is generated. If narrative structure determines what counts as a beginning, middle, or end, it necessarily dictates which facts are relevant to the story being told. Therefore, White's claim about form inevitably infects Carr's claim about content selection.

  Carr posits that objectivity arises from a dialogue between the historian and the facts. The historian selects facts, but the facts push back; a hypothesis that ignores too much evidence collapses. This suggests a realist constraint: the past exists independently and limits what can be said about it. Carr believes that while total neutrality is impossible, a progressive approximation to truth is achievable through this interactive process. The weighting of content is determined by causal significance, which is discovered, not invented.

  White, conversely, argues that the past itself possesses no inherent narrative structure. Events simply occur; they do not unfold as tragedies or comedies until the historian imposes that structure. The crux of the incompatibility lies here. If one decides to emplot the French Revolution as a tragedy, certain facts (the descent into terror, the execution of ideals) become central, while others (administrative reforms, economic stabilizations) are marginalized as incidental. If one emplotts it as a romance of liberation, the weighting flips. Thus, the choice of form is not a decorative layer added after the facts are selected; it is the criterion by which facts are selected and weighted in the first place. The "content" Carr believes is constrained by evidence is already pre-filtered by the "form" White identifies as poetic choice.

  Can Carr's "two-way interaction" survive this? Only if one argues that there is a layer of factual brute data that resists emplotment. Carr might argue that while you can tell the revolution as a comedy or tragedy, you cannot deny the fact of the guillotine. The facts constrain the *plausibility* of the emplotment. However, White would counter that even the guillotine gains its meaning only within a narrative structure. Without a plot, it is merely a physical occurrence, not a historical fact.

  Therefore, Carr's dialogue concedes more ground to White than Carr admits. If the "interaction" involves the historian asking questions of the past, those questions are already shaped by the narrative expectations the historian brings. The "self-correcting" nature of Carr's practice relies on a shared agreement about what counts as significant evidence. If White is right that significance is derived from poetic prefiguration, then the correction mechanism is internal to the narrative paradigm, not external to the past itself.

  However, Carr retains one independent move. He insists on the practical success of historical inquiry. If objectivity is defined as a communal practice of verification rather than a mirror of reality, Carr's dialogue describes how historians actually work, regardless of White's theoretical claims about language. White explains the literary condition of history; Carr explains its disciplinary procedure. Yet, if the question is whether objectivity protects the *content* from the *form*, the answer is no. The form constitutively shapes the content. The defence fails because it assumes a distinction between "what happened" and "how it is told" that historical knowledge does not support. The choice of emplotment is a choice about what matters, and that is the very realm Carr wanted to keep objective.

  ***

  **MARKING SCHEME (Out of 25)**

  **First Class (20–25 marks)**
  *   **Specific Move 1:** Explicitly argues that emplotment is not additive but constitutive of significance (i.e., form dictates which content counts as a "fact").
  *   **Specific Move 2:** Analyzes Carr's "dialogue" not just as bias, but as a mechanism of constraint, and successfully evaluates whether White undermines that mechanism.
  *   **Specific Move 3:** Avoids the trap of saying White denies reality; instead focuses on how reality is *processed* into knowledge.
  *   **Structure:** Clear thesis maintained throughout; conclusion directly answers the prompt's two-part challenge.

  **Upper Second (2:1) (15–19 marks)**
  *   **Understanding:** Correctly identifies Carr's view on evidence and White's view on narrative.
  *   **Limitation:** Treats the form/content distinction as plausible for too long before rejecting it, or fails to show *how* emplotment changes fact selection (asserts it without mechanism).
  *   **Carr Analysis:** Describes Carr's "dialogue" accurately but fails to press whether it concedes ground to White; treats them as simply "different approaches" rather than conflicting epistemologies.

  **Lower Second (2:2) (10–14 marks)**
  *   **Generalities:** Relies on broad summaries of "objectivity is hard" without engaging the specific Carr/White mechanism.
  *   **Misinterpretation:** Treats the question as a general comparison of the two authors rather than evaluating the specific "compatibility defence" proposed in the prompt.

  **Fail (0–9 marks)**
  *   **Irrelevance:** Discusses Ranke or postmodernism generally without addressing the prompt's specific argument.
  *   **Confusion:** Confuses Carr's position with positivism or White's position with nihilism.

  **SPECIFIC MISTAKES THAT LOSE MARKS**

  1.  **Claiming White argues "nothing is true."**
      *   *Why:* This is a vulgar caricature; White argues about the *mode* of truth-claiming (narrative), not the existence of events, and misses the philosophical nuance required for a Master's level.
  2.  **Treating Carr as a naive empiricist who believes facts speak for themselves.**
      *   *Why:* The prompt explicitly references Carr's "two-way interaction"; ignoring this shows failure to read the question setup and misrepresents Carr's actual middle-ground position.
  3.  **Accepting the form/content separation without critique.**
      *   *Why:* The question asks the candidate to *decide* whether the separation can be held; accepting it uncritically avoids the central philosophical problem of how narrative generates significance.
