          *   *Information Credibility (1-6):* How likely is the specific info true?
          *   *ACH (Analysis of Competing Hypotheses):* Systematic elimination of alternatives.
          *   *Likelihood Ratios:* Bayesian updating.
          *   *Circular Reporting:* Checking if Source B just copied Source A.
          *   *Calibrated Confidence:* "High confidence," "Moderate confidence."
          *   *Goal:* Actionable truth, predictive accuracy, threat identification.
          *   *Mindset:* Information is a commodity to be verified for operational use. Forgery is a threat.
      *   **Historian (Target Tongue):**
          *   *Multiple Attestation:* Independent corroboration.
          *   *Criterion of Embarrassment:* Adverse interest implies truth.
          *   *Unintentional Evidence:* Incidental data > Intentional narrative.
          *   *Forgery as Evidence:* The fake tells the truth about the forger's context.
          *   *Thucydides' Speeches:* Rhetorical truth > Verbatim accuracy.
          *   *Goal:* Understanding human experience, context, meaning, causality over deep time.
          *   *Mindset:* Artifacts are traces of human intentionality and context. Even lies are truths about the liar.

  3.  **Sketching Resistance (Pre-translation):**
      *   *What won't fit?* The intel grid separates *source* from *info*. History often merges them (the text *is* the source and the info).
