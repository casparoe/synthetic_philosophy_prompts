      *   *Truth Value:* Intel seeks binary/near-binary truth (is the threat real?). History seeks probabilistic truth but values the *narrative function* of uncertain data (Thucydides' speeches).
      *   *Forgery:* In intel, a forgery is a "dangle" or deception (Source F, Info 6). In history, a forgery is a primary source for the era it was made.

  4.  **Drafting the Translations (The 4 Moves):**
      *   *(a) Multiple Attestation:* This maps well to "independent sourcing." Intel calls this "corroboration." The caveat about common descent maps to "circular reporting" or "chain of custody" checks.
      *   *(b) Criterion of Embarrassment:* This is "adverse interest." In intel, if a source admits fault, credibility goes up *unless* it's a cover story. Need to distinguish between "tactical deception" and "unintentional self-harm."
      *   *(c) Unintentional Evidence:* This is "collateral data" or "metadata." Intel values the "envelope" as much as the "letter." A tax roll is "administrative traffic" vs. "narrative reporting."
      *   *(d) Forgery as Evidence:* This is the hardest. In intel, a forgery is a "deception operation." To treat it as evidence of the forger requires shifting the *object of analysis* from the claimed content to the provenance.

  5.  **Drafting the Thucydides Test Case:**
      *   *Intel View:* Thucydides admits fabrication (Source A, Info 5 or 6). Shelve it.
      *   *Historian View:* The speeches reveal the *strategic culture* and *public reasoning* of the time.
      *   *Translation:* The "Information" isn't the words spoken; the "Information" is the *perceived justification*. The Source Reliability is high for Thucydides as an interpreter of political logic, even if low as a stenographer.
      *   *Verdict:* Historians aren't making a mistake; they are scoring a different *requirement*.

  6.  **Developing the Residue Report:**
