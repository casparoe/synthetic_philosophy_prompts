  *(Self-Correction during drafting)*: I need to be careful with the Thucydides section. The prompt asks: "Translate their practice into my terms and say whether they are making a mistake my grid would have caught." I need to be precise. If I say "Historians are scoring 'Political Logic' not 'Verbatim Record'," that fits the grid. But does it? The grid scores *credibility of information*. If the info is "What was said," it's low. If the info is "What was thought," it's high. The shift is in the *Requirement*. I must highlight that.

  *(Refining the "Forgery" translation)*: In intel, a forgery is usually treated as a deception indicator. To treat it as evidence of the forger is to change the *Hypothesis*. Instead of "Is the document real?", the hypothesis becomes "What does the existence of this document imply about the issuer?" This is a shift in ACH structure.

  *(Final Polish)*: Ensure the "Residue" section explicitly calls out the "smuggling" of the assumption that artifacts are assertions.

  10. **Final Review against constraints:**
      *   Sketch resistance first? Yes.
      *   Translate 4 moves? Yes.
      *   Thucydides test case? Yes.
      *   Residue report? Yes.
      *   Verdict + Commitment + Counterexample + Self-Critique? Yes.
      *   Tone? Serious, philosophical/analyst hybrid.

