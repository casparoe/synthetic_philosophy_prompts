answer: |-
  ### Desiderata for an Account of Control

  **1. The Frankfurt-Compatibility Requirement**
  *   **Requirement:** The account must vindicate the intuition that an agent is responsible in cases where they act for their own reasons while an intervener stands ready to force the outcome but never acts.
  *   **Motivating Case:** Standard Frankfurt cases. The agent decides on their own; a counterfactual intervener would have forced the decision had the agent shown signs of choosing otherwise, but the agent chooses otherwise without intervention.
  *   **Commitment of Violators:** An account that violates this is committed to the Principle of Alternative Possibilities (PAP): that responsibility requires the ability to do otherwise. It must therefore deny responsibility in these cases, contradicting the widespread intuition that the intervener's mere presence (which causally effects nothing) does not exculpate.
  *   **Status:** Non-negotiable. Any theory that fails here requires a revision of basic responsibility intuitions too costly for a general theory.

  **2. The Intrinsicness (Irrelevance) Constraint**
  *   **Requirement:** The basis for responsibility must be intrinsic to the agent's actual sequence of events. Facts about what *would* have happened (e.g., an intervener's disposition) cannot constitute the control condition unless they manifest in the actual history.
  *   **Motivating Case:** The "Irrelevance" intuition. Two agents act identically; one has a counterfactual intervener, one does not. It is implausible that their responsibility status differs solely due to the external, unexercised disposition of the intervener.
  *   **Commitment of Violators:** An account violating this makes responsibility depend on extrinsic facts unknown to and causally inert for the agent. It implies that an agent could lose responsibility solely because a hidden device was installed nearby, even if it never interacted with them.
  *   **Status:** Non-negotiable. This fixes the standard that control is a property of the agent's actual conduct, not their modal surroundings.

  **3. The Robustness Neutrality Condition**
  *   **Requirement:** The account must not rely on the existence of "robust" alternative possibilities to explain responsibility, nor may it define robustness in a way that presupposes the falsity of determinism.
  *   **Motivating Case:** The "Residual Alternatives" objection. Critics argue Frankfurt cases always leave some flicker of freedom (e.g., the ability to hesitate). A theory cannot demand robust alternatives to solve this without begging the question against incompatibilists who claim determinism removes *all* relevant alternatives.
  *   **Commitment of Violators:** A violator either collapses into a leeway theory (vulnerable to Frankfurt cases) or defines "control" as "the ability to do otherwise under indeterminism," which renders the theory a restatement of incompatibilism rather than an analysis of control.
  *   **Status:** Non-negotiable. This prevents circularity and ensures the theory addresses the core metaphysical dispute.

  **4. The Guidance/Options Distinction**
  *   **Requirement:** The account must explicitly state whether control consists in having options open (leeway) or in being the proper source of the action (guidance/sourcehood).
  *   **Motivating Case:** The conceptual divergence between "could have done otherwise" and "did it on my own." Conflating these leads to confusion in cases of addiction (where options are narrow but agency may remain) or coercion (where options are narrow and agency is compromised).
  *   **Commitment of Violators:** A violator obscures the metaphysical ground of responsibility. It cannot explain why a coerced agent (who acts for reasons but under threat) differs from a Frankfurt agent (who acts for reasons with a blocker).
  *   **Status:** Non-negotiable. Clarity on the locus of control is the primary function of the theory.

  **5. The Exculpation Constraint**
  *   **Requirement:** The account must explain why coercion, compulsion, and non-culpable ignorance diminish or eliminate responsibility without relying solely on the absence of alternative possibilities.
  *   **Motivating Case:** Standard excuses. A person handing over money at gunpoint lacks alternatives, but so does the Frankfurt agent. The theory must distinguish the gunman case (exculpated) from the Frankfurt case (responsible).
  *   **Commitment of Violators:** A violator implies that all constrained action is equally excusing, or that no constrained action is excusing. It fails to capture the normative difference between *being forced* and *being unable to do otherwise due to a counterfactual blocker*.
  *   **Status:** Non-negotiable. A theory of blameworthiness that cannot account for excuses is practically useless.

  **6. The Manipulation Immunity**
  *   **Requirement:** The account must yield the verdict that agents who are directly manipulated (e.g., brainwashing, value engineering) are not responsible, even if their internal psychology matches that of a normal responsible agent.
  *   **Motivating Case:** Manipulation cases (e.g., Mele's agents). An agent is designed to have specific values and reasons. They act on those reasons without external coercion. Intuition suggests they are not responsible because their history is deviant.
  *   **Commitment of Violators:** A violator is committed to "actual sequence" sufficiency: that if the current mental state causes the action appropriately, history does not matter. This risks making responsibility compatible with any form of determinism that mimics normal psychology.
  *   **Status:** Non-negotiable. This is the primary test for whether the theory requires a historical condition.

  **7. The Capacity Threshold**
  *   **Requirement:** The account must specify the cognitive and volitional capacities necessary for control, accommodating children and the cognitively impaired.
  *   **Motivating Case:** Developmental and clinical exceptions. We do not blame toddlers or those with severe psychosis. The theory must identify what is missing in these cases (e.g., understanding, impulse control) that is present in adults.
  *   **Commitment of Violators:** A violator treats responsibility as an all-or-nothing metaphysical switch unrelated to psychological capacity, or it fails to explain why capacity matters if the causal sequence is identical to a responsible agent's.
  *   **Status:** Non-negotiable. Control is a psychological capacity; the theory must map onto the psychology.

  **8. The Proportionality of Control**
  *   **Requirement:** The account must allow for degrees of control that map onto degrees of blameworthiness.
  *   **Motivating Case:** Negligence and diminished capacity. We blame the negligent agent less than the malicious one, and the addicted agent differently than the sober one.
  *   **Commitment of Violators:** A violator treats control as binary (you have it or you don't). This forces a binary view of blame (fully responsible or not), which contradicts legal and moral practice.
  *   **Status:** Preference. While highly desirable, a binary theory of *basic* desert could theoretically be supplemented by a separate theory of *degree*. However, for a unified theory, this is effectively non-negotiable.

  **9. The Metaphysical Verdict**
  *   **Requirement:** The account must yield a determinate verdict on whether causal determinism is compatible with the control required for desert.
  *   **Motivating Case:** The core dispute of free will. A theory of control that remains agnostic on determinism fails its primary philosophical purpose.
  *   **Commitment of Violators:** A violator offers a conceptual analysis that leaves the metaphysical possibility of responsibility unresolved, deferring the hard work to a separate argument about physics or causation.
  *   **Status:** Non-negotiable. The purpose of the theory is to settle the conditions for desert.

  ***

  ### Adjudication of Unsure Requirements

  **1. Assessor-Accessibility**
  *   **Verdict:** Prejudice.
  *   **Reasoning:** This demand conflates the *conditions* of responsibility with the *evidence* for responsibility. Blaming is a practice, but blameworthiness is a metaphysical status. An agent might be responsible even if no human observer could ever know it (e.g., a hidden mental disorder). Requiring accessibility turns the theory into an epistemic guideline for social regulation rather than an account of moral desert.

  **2. Counterfactual Austerity**
  *   **Verdict:** Genuine.
  *   **Reasoning:** This is a restatement of the Intrinsicness Constraint (Item 2). If responsibility turns on what a hidden intervener *would* have done, it violates the intuition that responsibility is about what the agent *did*. An account that relies on counterfactuals to ground actual responsibility makes the agent's status dependent on the outside world's dispositions rather than their own agency.

  **3. Explanatory Depth**
  *   **Verdict:** Genuine.
  *   **Reasoning:** A theory cannot merely label the intuition (e.g., "you are responsible because you have control" where control is defined as "the property responsible agents have"). It must identify the natural or metaphysical property (e.g., reasons-responsiveness, causal origination) that *makes* the agent responsible. Without this, the theory is circular and offers no predictive or adjudicatory power.

  ***

  ### Stress Test: The Deliberation-Monitoring Mechanism

  **The Case:** A mechanism monitors the agent's deliberation. It fires only if deliberation is about to conclude against the intervener's wish. When it fires, it eliminates every alternative course *at that moment* but does not cause the action. The agent's reasoning and act are internally identical to a normal free act. However, absent the mechanism, the agent *would have concluded otherwise*.

  **Strained Requirements:**
  This case places extreme strain on **The Intrinsicness Constraint** and **The Manipulation Immunity**.
  1.  **Intrinsicness:** The mechanism *does* interact with the actual sequence (it eliminates alternatives *during* deliberation), unlike a standard Frankfurt intervener. However, the internal reasoning remains "identical" to a free act. This blurs the line between an actual-sequence manipulation and a normal decision.
  2.  **Manipulation Immunity:** Since the agent would have chosen otherwise without the mechanism, the mechanism *ensured* the outcome. This is a form of direct manipulation of the will's formation. An Actual Sequence theorist (who looks only at the current reasoning) might deem the agent responsible because the reasoning looks normal. A Historical theorist would deem them not responsible because the outcome was engineered.

  **Forcing a Historical Condition:**
  Accommodating the intuition that this agent is *not* responsible forces a **Historical Condition** on the account. Because the *current* state (reasoning and act) is internally indistinguishable from a free act, the exculpating factor cannot be found in the present snapshot of the agent. It must be found in the *origin* of that state (i.e., that it was produced by a mechanism designed to ensure a specific outcome that wouldn't have occurred naturally). If the account relies solely on the actual sequence (Guidance Control), it risks verdicts of responsibility here, violating the Manipulation Immunity requirement. Thus, the account must specify not just *how* the action was controlled, but *how the control mechanism came to be there*.

  ***

  ### Conclusions

  **The Most Eliminative Requirement**
  The **Manipulation Immunity** requirement eliminates the most candidates. Pure Actual Sequence theories (standard Guidance Control) pass Frankfurt cases easily but fail manipulation cases, as they cannot distinguish between a naturally formed will and an engineered one that functions identically. Pure Leeway theories (Libertarianism) pass manipulation cases (by citing a break in the causal chain) but fail Frankfurt cases (by insisting on alternative possibilities). Only theories that combine a robust account of sourcehood with a historical condition survive, which rules out the majority of simple compatibilist and incompatibilist models.

  **Joint Unsatisfiability**
  There is a joint unsatisfiability between **The Frankfurt-Compatibility Requirement**, **The Manipulation Immunity Requirement**, and **The Metaphysical Verdict (Compatibilism)**. If one holds that determinism is compatible with responsibility (Compatibilism), one typically relies on Actual Sequence properties (reasons-responsiveness). However, if determinism is true, a manipulated agent and a normal agent are both determined. To distinguish them (satisfying Manipulation Immunity), one needs a Historical Condition. But if determinism is true, the history of the normal agent is also causally necessitated by the past. It becomes impossible to specify a historical difference that grants responsibility to the normal agent but denies it to the manipulated agent without implicitly requiring the kind of ultimate origination (causa sui) that determinism rules out. One member must be abandoned: either we accept that manipulated agents are responsible (abandon Manipulation Immunity), or we accept that determinism precludes responsibility (abandon Compatibilism), or we accept that Frankfurt cases do exculpate (abandon Frankfurt-Compatibility).

  **Performance of Candidate Theories**
  **Leeway Theory (Weakened AP):** This view retains a requirement for alternative possibilities but weakens the "robustness" condition to survive Frankfurt cases. It fails the **Metaphysical Verdict** for compatibilists, as it remains incompatible with determinism. It also struggles with the **Residual Alternatives** constraint, as it often has to argue that trivial flickers of freedom are sufficient for desert, which undermines the significance of the control condition. It satisfies Manipulation Immunity well but at the cost of making responsibility impossible in a determined world.

  **Source/Guidance Control Compatibilism:** This view excels at **Frankfurt-Compatibility** and the **Metaphysical Verdict** (favoring compatibilism). It grounds control in the agent's actual reasoning process. However, it catastrophically fails **The Manipulation Immunity** requirement. If control is solely about the current sequence of reasons and actions, a perfectly engineered agent who acts on engineered reasons possesses the same control as a free agent. To avoid this, it must smuggle in historical conditions that often threaten its compatibility with determinism, creating an internal tension between its historical and structural commitments.

  **Responsibility Survives Determinism (Strawsonian/Pragmatic):** This view bypasses the **Control Condition** by treating responsibility as a feature of our social practices rather than a metaphysical status. It trivially satisfies the **Metaphysical Verdict** but fails the **Explanatory Depth** requirement. It does not explain *why* the agent has control, only why we blame. Consequently, it cannot adjudicate the **Manipulation Immunity** or **Exculpation Constraint** on metaphysical grounds; it can only say whether our practices *should* exclude these agents. It avoids the impossibility result by changing the subject, failing the prompt's demand for an account of the control an agent *must have*.
