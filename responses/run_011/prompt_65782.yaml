  1.  **Determinacy of Count:** The system must yield a definite integer for parcels existing at any time $t$. [Motivation: Authority reporting; Tag: Non-negotiable (Institutional)]
  2.  **Intermittent Existence:** The theory must allow an object to cease existing and later return numerically identical. [Motivation: Parcel 47 demolition/rebuild; Tag: Negotiable (Legal fiction)]
  3.  **Coincidence:** Distinct parcels or interests must be able to occupy the same spatial region simultaneously. [Motivation: Subdivision/airspace; Tag: Non-negotiable (Legal)]
