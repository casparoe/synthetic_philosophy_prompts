  5.  **Parcel-Estate Distinction:** The account must separate the physical container from the legal interest held within it. [Motivation: Freehold/leasehold split; Tag: Non-negotiable (Legal)]
  6.  **Continuity of Identity:** Numerical identity must persist through total qualitative replacement of physical markers. [Motivation: Replaced boundaries; Tag: Non-negotiable (Metaphysical)]

  Requirements 1, 3, and 5 stem from the institution of a public register; you can buy your way out of these by changing design or law. Requirements 2, 4, and 6 stem from the metaphysics of persistence; these cannot be redesigned away without falsifying reality. We must not collapse numerical identity (same object) with qualitative identity (same properties), nor the object with the region of space it occupies. The parcel (container) is distinct from the estate (interest). Conditions of persistence (how it lasts) differ from conditions of identity (what makes it itself) and conditions for counting (how many there are). Existence at a time is distinct from existence across times.

  The theory must assert that identity cannot be vague, otherwise counting fails. It must allow distinct objects to coincide in the same place (legal vs physical). It must allow something to go out of existence and return only via legal stipulation.

  Desiderata 1 (Determinacy of Count) and 4 (Vague Boundaries) are jointly unsatisfiable. If boundaries are ontically vague, identity is indeterminate, violating classical logic required for counting. The Determinacy of Count is the single requirement that does the most to exclude candidates, forcing precisification upon vague realities.

