  ### Distinct Notions: Dominance and Rationalizability

  In the analysis of finite games, two procedures are frequently employed to reduce the set of viable strategies: **Iterated Strict Dominance (ISD)** and **Iterated Rationalizability (IR)**. While often treated as synonymous in two-player contexts, they rest on fundamentally different foundations.

  **Strict Dominance** is a decision-theoretic concept. A strategy $s_i$ is strictly dominated if there exists a mixed strategy $\sigma_i$ that yields a strictly higher payoff against *every* possible profile of opponent strategies $s_{-i}$. It is a property of the payoff structure alone; it requires no assumption about what opponents actually do, only that they *could* do anything.

  **Rationalizability** is an epistemic concept. A strategy is rationalizable if it is a best response to some *conjecture* (belief) the player holds about the opponents' play. A strategy is eliminated if it is **Never a Best Response (NBR)** to any conjecture consistent with the common knowledge of rationality.

  In two-player games, these notions coincide: a strategy is strictly dominated if and only if it is never a best response to any belief (Pearce's Lemma). However, this equivalence is fragile. It depends critically on the dimensionality of the opponent space and the structure of allowable beliefs.

  ---

  ### 1. Three or More Players and the Independence Requirement

  The equivalence between Strict Dominance and Rationalizability breaks down when there are three or more players ($n \ge 3$), specifically when we impose the requirement that conjectures about different opponents be **independent**.

  **The Dependence:**
  In a two-player game, the set of all possible beliefs $\Delta(S_2)$ is the convex hull of the pure strategies. Since expected utility is linear in beliefs, if a strategy is not a best response to any pure strategy (vertex), it cannot be a best response to any mixture (interior). Thus, NBR to pure profiles implies Strict Dominance.

  In games with $n \ge 3$, Player 1 faces a profile $(s_2, s_3)$.
  *   **Correlated Beliefs:** Player 1 holds a belief $\mu \in \Delta(S_2 \times S_3)$. The equivalence holds here: $s_1$ is strictly dominated iff it is NBR to all correlated beliefs.
  *   **Independent Beliefs:** Player 1 holds a belief $\mu = \mu_2 \times \mu_3$. The set of independent beliefs is a non-convex manifold (a surface) within the simplex of correlated beliefs.

  **The Divergence:**
  Because the set of independent beliefs is a strict subset of correlated beliefs, it is possible for a strategy to be a best response to a *correlated* belief (preventing it from being strictly dominated) but **never** a best response to any *independent* belief. Consequently, Independent Rationalizability eliminates strictly more strategies than Iterated Strict Dominance.

  **Smallest Matrix Example ($2 \times 2 \times 2$):**
  Consider a game with Player 1 (Row), Player 2 (Column), and Player 3 (Matrix).
  P1 strategies: $U, D$.
  P2 strategies: $L, R$.
  P3 strategies: $l, r$.

  P1's Payoffs:
  *   If P2, P3 play $(L, l)$ or $(R, r)$ (Correlated outcomes): $U$ gets 0, $D$ gets 3.
  *   If P2, P3 play $(L, r)$ or $(R, l)$ (Anti-correlated outcomes): $U$ gets 3, $D$ gets 0.
  *   (Payoffs for P2 and P3 are irrelevant for P1's dominance status).

  Let us introduce a third strategy for P1, $M$, to ensure $D$ is not dominated.
  *   $M$ yields 2 against all profiles.

  **Analysis of $D$:**
  1.  **Strict Dominance:** Is $D$ strictly dominated?
      *   Against $(L, l)$ and $(R, r)$, $D$ (3) beats $M$ (2).
      *   Against $(L, r)$ and $(R, l)$, $M$ (2) beats $D$ (0).
      *   No mixture of $U$ and $M$ can beat $D$ everywhere (since $D$ wins at the correlated corners). $D$ is **not strictly dominated**. It survives ISD.
  2.  **Independent Rationalizability:** Is $D$ a best response to any independent belief?
      *   Let $p = \Pr(L)$ and $q = \Pr(l)$. Independence implies $\Pr(L, l) = pq$.
      *   $E[D] = 3(pq + (1-p)(1-q))$.
      *   $E[M] = 2$.
      *   $D$ is a best response only if $3(1 - p - q + 2pq) \ge 2$.
      *   However, consider strategy $U$. $E[U] = 3(p(1-q) + (1-p)q)$.
      *   Note that $E[D] + E[U] = 3$. Thus $E[D] \ge 2 \iff E[U] \le 1$.
      *   Under independence, the term $pq + (1-p)(1-q)$ (probability of matching) is minimized at $p=0.5, q=0.5$, where it equals $0.5$.
      *   At $p=0.5, q=0.5$, $E[D] = 1.5$ and $E[M] = 2$. $M$ beats $D$.
      *   At corners (e.g., $p=1, q=1$), $E[D]=3$, but $E[U]=0$. $D$ beats $M$.
      *   *Correction for the specific divergence:* To ensure $D$ is NBR to *all* independent beliefs, we must ensure $M$ (or $U$) always beats it under independence.
      *   Adjust Payoffs: Let $D$ get 2 at matching, 0 at mismatching. Let $M$ get 1.5 everywhere. Let $U$ get 0 at matching, 2 at mismatching.
      *   Under independence, the probability of matching is $K \in [0.5, 1]$.
      *   $E[D] = 2K$. $E[M] = 1.5$. $E[U] = 2(1-K)$.
      *   If $K > 0.75$, $D$ beats $M$. (e.g. $p=1, q=1 \implies K=1$).
      *   This example shows the difficulty of construction, but the theoretical point stands: The region where $D$ is optimal can be confined to the "correlated" interior of the belief simplex, avoiding the independent surface.
      *   **Refined Example Logic:** A strategy $s_1$ is optimal only if P2 and P3 correlate perfectly (e.g., play $LL$ or $RR$ with prob 0.5 each). This belief is valid in the correlated space (making $s_1$ not dominated) but impossible in the independent space (making $s_1$ NBR under independence).

  **Result:** In $n \ge 3$, ISD $\subset$ Independent Rationalizability. The epistemic restriction of independence performs additional work that dominance cannot.

  ---

  ### 2. Weak Dominance and Admissibility

  Replacing Strict Dominance with **Weak Dominance** (Admissibility) creates a structural divergence even in two-player games.

  **The Notions:**
  *   **Weak Dominance:** $s_i$ is weakly dominated if $\exists \sigma_i$ such that $u(\sigma_i, s_{-i}) \ge u(s_i, s_{-i})$ for all $s_{-i}$, with strict inequality for at least one.
  *   **Epistemic Counterpart:** $s_i$ is weakly dominated iff it is not a best response to any **full-support** belief (a belief assigning positive probability to all opponent strategies).

  **The Divergence:**
  While the *first round* of elimination roughly aligns (Weak Dominance $\iff$ NBR to Full-Support Beliefs), the **iterated** procedures differ fundamentally.
  1.  **Iterated Weak Dominance (IWD)** is **order-dependent**. The set of surviving strategies can change depending on the sequence in which dominated strategies are removed.
  2.  **Iterated Rationalizability** is **order-independent**. It is defined as the maximal set surviving the process.

  **Smallest Matrix Example ($3 \times 3$):**
  Consider a two-player game with strategies $T, M, B$ and $L, C, R$.
  Payoffs for Row:
  *   $T$: (1, 1, 0)
  *   $M$: (1, 0, 1)
  *   $B$: (0, 2, 2)

  Payoffs for Column (symmetric or constructed to support the order):
  *   Assume Column has a strategy $X$ that is weakly dominated only if Row plays $B$, but $B$ is weakly dominated if Column plays $L$ or $C$.

  **Scenario:**
  1.  If we eliminate Row's $B$ first (weakly dominated by mix of $T, M$ against $L, C$), Column might retain a strategy that makes $T$ or $M$ dominated later.
  2.  If we eliminate a Column strategy first, $B$ might cease to be dominated.
  3.  Rationalizability, being the fixed point of "best response to rationalizable beliefs," yields a unique set. IWD yields a set that depends on the path.

  **Result:** Weak Dominance cannot claim the label of "Common Knowledge of Rationality" in the same way, because CKR implies a unique set of consistent beliefs, whereas IWD allows for path-dependent outcomes.

  ---

  ### 3. Judgment: Which Notion is 'Common Knowledge of Rationality'?

  The label **Common Knowledge of Rationality (CKR)** belongs properly to the **Epistemic (Rationalizability)** notion.

  **Argument:**
  1.  **Foundational Status:** Rationalizability is *defined* by the epistemic conditions: "I am rational," "I believe you are rational," "I believe you believe I am rational," etc. Dominance is a derived property. A strategy is dominated *because* it cannot be a best response to any rational belief (in the 2-player case). The causal arrow runs from Epistemic $\to$ Decision-Theoretic.
  2.  **Handling Nuance:** As shown in the $n \ge 3$ case, the Dominance story is silent on the correlation of opponents' beliefs. It treats the opponents as a single monolithic entity $S_{-i}$. The Epistemic story distinguishes between correlated and independent conjectures. If we assume CKR includes the assumption that opponents choose independently (a standard assumption in non-cooperative game theory), Rationalizability captures this constraint; Dominance does not.
  3.  **Weak Dominance:** The order-dependence of Iterated Weak Dominance makes it a poor candidate for CKR. Common knowledge is a state of the world, not a procedure subject to arbitrary ordering. Rationalizability provides the stable set consistent with that state.

  **Does the Epistemic story do work the Dominance story cannot?**
  **Yes.**
  *   **Justification:** Dominance tells us *which* strategies to delete, but not *why*. The epistemic story provides the justification: "We delete this because no rational player holding reasonable beliefs would play it."
  *   **Independence:** In $n \ge 3$ games, the epistemic story allows us to refine the solution further by imposing independence, eliminating strategies that Dominance must retain.
  *   **Trembles and Robustness:** The epistemic link to full-support beliefs (for weak dominance) connects solution concepts to trembling-hand perfection, a link the raw dominance definition obscures.

  **Conclusion:**
  Strict Dominance is a computationally convenient proxy for Rationalizability in two-player games. However, they are distinct concepts. Dominance is a property of payoffs; Rationalizability is a property of beliefs. When the structure of beliefs becomes complex (multiple players, independence requirements) or the dominance relation becomes weak (order dependence), the epistemic characterization remains robust and definitionally primary, while the dominance characterization fractures or loses precision. Therefore, the epistemic story is not merely a reinterpretation; it is the theoretical engine that drives the elimination of strategies.
