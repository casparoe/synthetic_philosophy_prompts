      *Re-evaluating N2:* If I say "No Function", it aligns with (ii) and (vii). If I say "Function", it aligns with (i).
      *Which is stronger?* (ii) and (vii) deal with the *trait type* in the *population*. (i) deals with a *token*. N2 is about the *trait type* in the *population*. So (ii) and (vii) are better precedents.
      *Prediction:* **No Function.** Principle: **Ecological Obsolescence.** If the selective regime vanishes, function vanishes, even if the trait persists (until degradation confirms it).

      *Let's check N1 again.* Old gene. Flux shifted. Deleting it = no change.
