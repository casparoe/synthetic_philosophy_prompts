answer: |-
  The whiteboard was covered in fractions, but the air in the committee room was thick with something less soluble. Elena capped her marker and stepped back from the prior probabilities. Marcus leaned forward, tapping his pen against the table.

  "Let's lock the threshold first," Marcus said. "If we treat, we gain 100 if the disease is present, lose 40 if it's absent. If we withhold, we lose 500 if present, zero if absent. Break-even is where expected utilities match."

  Elena nodded. "$140p - 40 = -500p$. That gives $640p = 40$. Prevalence threshold is $1/16$, or 0.0625."

  "Exactly," Marcus said. "Your prior interval is [0.01, 0.05]. My point estimate is 0.03. Both are strictly below 0.0625. So before the test, we agree: withhold treatment. The imprecise representation hasn't changed the recommendation. It's just decorative."

  "It's not decoration, Marcus. It's a record of evidence," Elena replied. "The data come from two clinics with different catchment populations. We know the prevalence is somewhere between 1% and 5%, but we have no justification for picking 3% over 4% or 1.5%. Your 0.03 is a guess masquerading as precision."

  "It's a working number required for action," Marcus countered. "But let's run the test. Sensitivity is 1, false positive rate is 0.5. Suppose the patient tests positive. What happens to your set?"

  Elena turned back to the board. "For any prior $p$ in the set, the posterior is $2p / (1 + p)$. If $p$ is 0.01, posterior is roughly 0.02. If $p$ is 0.05, posterior is roughly 0.095. So my posterior interval is [0.02, 0.095]."

  Marcus frowned. "Your prior width was 0.04. Your posterior width is 0.075. You got a positive test result—a signal that should confirm the disease—and your uncertainty widened. That's dilation. You're less sure after seeing evidence than before."

  "Not less sure about the signal," Elena corrected. "But the test is noisy. Because the false positive rate is high, a positive result is compatible with a wider range of underlying prevalences than we started with. And yes, if the test were negative, my probability would collapse to zero instantly because sensitivity is 1. But given the positive result, the interval widens."

  "It's incoherent," Marcus said. "Learning should concentrate probability mass. If you represent your uncertainty with a set, and that set expands upon receiving data, the representation is failing to track reality. And look at the decision. My posterior is $2(0.03)/1.03$, about 0.058. That is still below 0.0625. I still say withhold. Your interval now straddles the threshold. What do you do?"

  "That's the point," Elena said. "The evidence no longer supports a unanimous verdict. If I use Maximin—maximizing the minimum expected utility—I look at the worst case for each act. The worst case for Treat is at $p=0.02$, utility -37.2. The worst case for Withhold is at $p=0.095$, utility -47.5. Maximin says Treat. But E-admissibility says both acts are permissible. The rules diverge."

  "So you need a second-order rule to pick a first-order rule," Marcus pressed. "You've pushed the vagueness back a step. To actually sign the policy, you'll have to pick Maximin. But why Maximin? That's essentially assuming nature is adversarial within your interval. That's a sharp attitude about risk hidden inside a claim about evidence. You say you're representing ignorance, but you're actually smuggling in extreme pessimism."

  Elena paused. She wiped a smudge from the board. "I'll concede that Maximin is conservative. But suppose we use Interval Dominance. Neither act dominates. The recommendation is indeterminate. That's the honest output. The evidence doesn't dictate a choice."

  "Indeterminacy doesn't save lives," Marcus said. "The committee must vote. If you vote Treat, you've effectively adopted a sharp probability above 0.0625. If you vote Withhold, you've adopted one below it. Your interval is inert. It cannot generate a recommendation without a hidden sharp preference. And furthermore, that interval width itself—isn't that an empirical claim? You're asserting the true prevalence isn't 0.009 or 0.051. That requires justification exactly like my 0.03 does. You say I lack evidence for precision; you lack evidence for the bounds."

  Elena turned to face him. "My bounds are based on the clinic data ranges. Your 0.03 is the midpoint, which assumes symmetry we don't have. But here is the blow: if the true prevalence is 0.05, and you commit to 0.03, you are exposed to a sure loss against anyone who knows the true rate. You are betting against the evidence. My set avoids that vulnerability. I am not committed to any single price."

  "But you are committed to the set," Marcus shot back. "And if I offer you a bet that pays out if the prevalence is exactly 0.03, you'll decline. But if I offer a bet that pays out if it's in [0.01, 0.05], you'll take it. That implies a pricing structure. You can't escape sharpness forever. Every time you act, you reveal a sharp cutoff. The interval is just a way to avoid accountability for that cutoff."

  Elena sighed, leaning against the desk. "I will revise that. I don't think the interval avoids accountability. It distributes it. But you're right that action forces a selection. However, that doesn't mean the selection was there all along. It means the evidence was insufficient, and the decision rule bridges the gap. Your rule bridges it by pretending the evidence was sufficient. Mine admits it wasn't."

  "Does your model learn?" Marcus asked. "If I run ten positive tests, your interval might widen again. If it never collapses to a point, you never converge on the truth. You're stuck in permanent dilation."

  "If the test were perfect, it would collapse," Elena said. "But with imperfect tests, widening reflects the structural uncertainty of the model. But I'll concede this: if we get enough independent data, the interval should narrow. If it doesn't, the model is broken. I'm not committed to perpetual widening."

  "Good," Marcus said. "Then we agree the goal is convergence. So why not start with a prior that allows convergence? A sharp prior updates cleanly. Your set updates to a set that overlaps with my point. In this case, my point is inside your interval. So why fight? Just use the midpoint."

  "Because the midpoint leads to a different decision than Maximin," Elena said. "You say Withhold. Maximin says Treat. That's not representational; that's practical. Patients get treated or they don't."

  "Only because you chose Maximin," Marcus said. "If you chose Minimax Regret, or E-admissibility with a tie-breaker, you might match me. The disagreement isn't about the credence; it's about the risk attitude you're bundling with it."

  Elena picked up her marker again. "Maybe. But the risk attitude is rational given the ignorance. You're treating ignorance as risk. I'm not." She wrote a formula on the corner of the board. "Look, settle it. Offer me a bet. You say the prevalence is 0.03. Bet me at odds implied by that probability."

  Marcus smiled, closing his notebook. "I will. I'll bet $100 against $100 that the true prevalence is below 0.04. My probability says that's likely. Your interval says it's possible it's higher, but also possible it's lower. Will you take the other side?"

  Elena capped the marker. "No. Because I don't have a single price. I can't take the side that says it's below 0.04, because 0.05 is in my set. But I can't take the side that says it's above 0.04 either, because 0.01 is in my set."

  "Then you can't act," Marcus said, standing up. "And if you can't bet, you can't decide. You'll abstain, and the default policy will run. Which is effectively a decision."

  "Abstention is a valid response to ignorance," Elena said, gathering her papers. "But fine. For the sake of the policy, I'll register that the decision is indeterminate. Let the chair break the tie. But don't tell me your 0.03 is what the data said."

  "The data said nothing without a model," Marcus replied, heading for the door. "And my model lets us leave the room with a plan. Yours leaves us with a range and a headache."

  "And avertable harm," Elena added quietly.

  Marcus paused at the threshold. "Maybe. But also unnecessary treatment costs. We'll see who loses more." He left the room, leaving Elena alone with the widening interval on the board.
